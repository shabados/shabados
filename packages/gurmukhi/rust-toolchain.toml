# Pinned toolchain and targets. CLAUDE.md: "Pin everything. Cargo.lock and
# rust-toolchain.toml are committed. No floating versions, anywhere."
#
# This file is for rustup used WITHOUT mise -- CI, or a contributor who has rustup
# only. In this repo mise installs the toolchain and does not read the `targets` list
# below, so mise.toml carries its own copy. **Change both together.** The build tasks
# also run `rustup target add` themselves, so a disagreement here costs a redundant
# no-op rather than a broken build.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = [
  # Host — macOS on Apple Silicon. Also an xcframework slice, so the Swift smoke
  # test and the iOS app link through the same artifact.
  "aarch64-apple-darwin",
  # iOS device and Simulator. Separate slices, never lipo'd together: both are
  # arm64, so a fat binary could not tell them apart.
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  # The web codebase, and the JavaScript bindings.
  "wasm32-unknown-unknown",
]
