[tools]
bun = "1"
# mise is what installs the toolchain here, and it does NOT read rust-toolchain.toml's
# `targets` -- so the list has to live here too. Keep both files in step: mise for this
# repo, rust-toolchain.toml for rustup without mise. Version is exact, not "1", because
# CLAUDE.md forbids floating versions and "1" silently moved to 1.98.1.
rust = { version = "1.98.1", targets = "aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android", components = "rustfmt,clippy" }
python = "3"
# Pinned tag: binaryen's version_XXX scheme makes "latest" resolve to stale semver tags
"ubi:WebAssembly/binaryen" = { version = "version_131", exe = "wasm-opt", extract_all = "true", bin_path = "bin" }

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.build]
description = "Build Rust cdylib"
run = "cargo build --release --features bindgen"

[tasks."build:wasm"]
description = "Build Rust WASM binary (size-optimized)"
run = "cargo build --profile wasm-release --target wasm32-unknown-unknown"

[tasks."build:native"]
description = "Cross-compile native library (e.g. TARGET=aarch64-apple-darwin mise run build:native)"
run = """
#!/usr/bin/env bash
set -euo pipefail
command -v zig >/dev/null || { echo "Install zig: mise install zig"; exit 1; }
command -v cargo-zigbuild >/dev/null || pip install cargo-zigbuild
rustup target add "${TARGET:?Set TARGET to a Rust triple}" 2>/dev/null || true
cargo zigbuild --release --target "$TARGET" --lib
"""

[tasks."build:native:all"]
description = "Cross-compile native library for all platforms"
run = """
#!/usr/bin/env bash
set -euo pipefail
command -v zig >/dev/null || { echo "Install zig: mise install zig"; exit 1; }
command -v cargo-zigbuild >/dev/null || pip install cargo-zigbuild
for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-gnu; do
  echo "Building $target..."
  rustup target add "$target" 2>/dev/null || true
  cargo zigbuild --release --target "$target" --lib
done
"""

[tasks.generate]
description = "Generate UniFFI bindings for a language"
run = """
#!/usr/bin/env bash
set -euo pipefail
# The shared library is named by the host, not by us: cargo emits .dylib on macOS and
# .so on Linux. Hardcoding either makes this task work on one machine and fail on the
# other, which is what it used to do.
lib="target/release/libgurmukhi.so"
[ -f "$lib" ] || lib="target/release/libgurmukhi.dylib"
[ -f "$lib" ] || { echo "no built library -- run: mise run build" >&2; exit 1; }
mkdir -p "$UNIFFI_OUT"
target/release/uniffi-bindgen generate \
  --library "$lib" \
  --language "$UNIFFI_LANG" \
  --out-dir "$UNIFFI_OUT" \
  --no-format
"""

[tasks."generate:ruby"]
description = "Generate Ruby bindings"
env = { UNIFFI_LANG = "ruby", UNIFFI_OUT = "bindings/ruby/lib/gurmukhi" }
run = """
mise run generate
sed -i "s|ffi_lib 'gurmukhi'|ffi_lib File.join(File.dirname(__FILE__), FFI.map_library_name('gurmukhi'))|" bindings/ruby/lib/gurmukhi/gurmukhi.rb
"""

[tasks."generate:kotlin"]
description = "Generate Kotlin bindings"
# uniffi-bindgen reads the metadata out of the built host library, same as
# generate:swift — see that task's own comment for why this must be an explicit
# dependency, not assumed.
depends = ["build"]
env = { UNIFFI_LANG = "kotlin", UNIFFI_OUT = "bindings/kotlin/lib" }
run = "mise run generate"

[tasks."generate:swift"]
description = "Generate Swift bindings"
# uniffi-bindgen reads the metadata out of the built host library, so `build` is not
# optional here. generate:all happened to depend on it; running this task alone did
# not, and failed with a missing-library error on a clean checkout.
depends = ["build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
tmpdir=$(mktemp -d)
UNIFFI_LANG=swift UNIFFI_OUT="$tmpdir" mise run generate
mkdir -p bindings/swift/Sources/gurmukhiFFI bindings/swift/Sources/Gurmukhi
mv "$tmpdir/gurmukhiFFI.h" bindings/swift/Sources/gurmukhiFFI/
mv "$tmpdir/gurmukhiFFI.modulemap" bindings/swift/Sources/gurmukhiFFI/
mv "$tmpdir/gurmukhi.swift" bindings/swift/Sources/Gurmukhi/
rm -rf "$tmpdir"
# BSD sed requires an argument to -i and GNU sed does not, so `sed -i` alone works
# on Linux and fails on macOS. Write through a temp file instead of picking a dialect.
mm=bindings/swift/Sources/gurmukhiFFI/gurmukhiFFI.modulemap
grep -v 'use "Darwin"' "$mm" > "$mm.tmp" && mv "$mm.tmp" "$mm"
ln -sf gurmukhiFFI.modulemap bindings/swift/Sources/gurmukhiFFI/module.modulemap
"""

[tasks."generate:javascript"]
description = "Generate JavaScript WASM bindings"
run = """
#!/usr/bin/env bash
set -euo pipefail
rm -rf bindings/javascript/generated/wasm
mkdir -p bindings/javascript/generated/wasm
target/release/uniffi-bindgen-js generate \
  --out-dir bindings/javascript/generated/wasm \
  target/wasm32-unknown-unknown/wasm-release/gurmukhi.wasm
# Shrink the shipped binary after bindgen (bindgen needs uniffi metadata sections intact)
wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int \
  bindings/javascript/generated/wasm/gurmukhi.wasm \
  -o bindings/javascript/generated/wasm/gurmukhi.wasm
bun scripts/flatten-wasm-namespace.ts bindings/javascript/generated/wasm
cd bindings/javascript && bun install --frozen-lockfile && bunx tsc
"""

[tasks."generate:react-native"]
description = "Generate React Native JSI bindings and turbo-module scaffolding"
run = """
#!/usr/bin/env bash
set -euo pipefail
(cd bindings/javascript && bun install --frozen-lockfile)
rm -rf bindings/javascript/src/generated bindings/javascript/cpp/generated
bun bindings/javascript/node_modules/.bin/ubrn generate jsi bindings \
  --library target/release/libgurmukhi.so \
  --ts-dir bindings/javascript/src/generated \
  --cpp-dir bindings/javascript/cpp/generated
(cd bindings/javascript && bunx ubrn generate jsi turbo-module --config ubrn.config.yaml gurmukhi && bunx tsc -p tsconfig.rn.json)
"""

[tasks."generate:python"]
description = "Generate Python bindings"
env = { UNIFFI_LANG = "python", UNIFFI_OUT = "bindings/python/gurmukhi" }
run = "mise run generate"

[tasks."generate:all"]
description = "Generate all language bindings"
depends = ["build", "build:wasm", "generate:ruby", "generate:kotlin", "generate:swift", "generate:javascript", "generate:python"]

[tasks."build:apple"]
description = "Build static libraries for macOS, iOS device, and iOS Simulator"
run = """
#!/usr/bin/env bash
set -euo pipefail
# staticlib is already in Cargo.toml's crate-type, so each of these emits a
# libgurmukhi.a. Device and Simulator stay separate -- see rust-toolchain.toml.
for target in aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim; do
  echo "Building $target"
  # Install the target here rather than trusting mise.toml or rust-toolchain.toml to
  # have been honoured -- neither is guaranteed depending on how the toolchain was set
  # up, and the failure otherwise is a wall of "can't find crate for `std`". Same
  # pattern as build:native above.
  rustup target add "$target" 2>/dev/null || true
  cargo build --release --target "$target" --lib
done
"""

[tasks."build:android"]
description = "Cross-compile native library for all four Android ABIs (needs cargo-ndk and an installed NDK — see the task's own error messages)"
run = """
#!/usr/bin/env bash
set -euo pipefail
command -v cargo-ndk >/dev/null || { echo "Install: cargo install cargo-ndk" >&2; exit 1; }
# cargo-ndk needs to find the NDK itself; ANDROID_NDK_HOME is its own documented
# variable (not ANDROID_HOME/ANDROID_SDK_ROOT, which name the SDK, not the NDK
# inside it) -- checked explicitly so the failure names the right variable rather
# than surfacing as a wall of linker errors.
: "${ANDROID_NDK_HOME:?Set ANDROID_NDK_HOME, e.g. to $ANDROID_HOME/ndk/<installed version>}"
for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android; do
  rustup target add "$target" 2>/dev/null || true
done
# -o writes directly in Android's own jniLibs layout (one arm64-v8a/armeabi-v7a/
# x86_64/x86 directory per ABI, each holding libgurmukhi.so) -- pointed straight at
# the app module so AGP picks the libraries up with no further Gradle config, the
# same way build:apple's xcframework lands where Xcode already looks.
cargo ndk \
  -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
  -o ../../apps/android/app/src/main/jniLibs \
  build --release --lib
"""

[tasks.android]
description = "Everything an Android app needs: native libs per ABI, Kotlin bindings"
depends = ["build:android", "generate:kotlin"]
run = "echo 'jniLibs/ and bindings/kotlin/lib ready -- apps/android/app/build.gradle.kts already points at both'"

[tasks.xcframework]
description = "Assemble gurmukhiFFI.xcframework from the Apple static libraries"
# Both halves: the static libraries, and the header and modulemap that generate:swift
# emits. Declaring only the former meant a clean run reached the header check and
# stopped there.
depends = ["build:apple", "generate:swift"]
run = """
#!/usr/bin/env bash
set -euo pipefail
hdr="bindings/swift/Sources/gurmukhiFFI"
[ -f "$hdr/gurmukhiFFI.h" ] || { echo "run: mise run generate:swift" >&2; exit 1; }

# xcodebuild requires the modulemap to be named module.modulemap and to be a real
# file. generate:swift leaves a symlink, which does not survive being copied into the
# framework, so materialise it here.
staging=$(mktemp -d)
cp "$hdr/gurmukhiFFI.h" "$staging/"
cp "$hdr/gurmukhiFFI.modulemap" "$staging/module.modulemap"

out="bindings/swift/gurmukhiFFI.xcframework"
rm -rf "$out"
xcodebuild -create-xcframework \
  -library target/aarch64-apple-darwin/release/libgurmukhi.a  -headers "$staging" \
  -library target/aarch64-apple-ios/release/libgurmukhi.a     -headers "$staging" \
  -library target/aarch64-apple-ios-sim/release/libgurmukhi.a -headers "$staging" \
  -output "$out"
rm -rf "$staging"
echo "wrote $out"
"""

[tasks.apple]
description = "Everything an Apple app needs: build, Swift bindings, xcframework"
depends = ["xcframework"]
run = "echo 'gurmukhiFFI.xcframework ready -- add packages/gurmukhi to Xcode as a local package'"

[tasks.fmt]
description = "Check code formatting"
run = "cargo fmt --check"

[tasks.lint]
description = "Run clippy lints"
run = "cargo clippy -- -D warnings"

[tasks.check]
description = "Run all checks (fmt, lint, test)"
depends = ["fmt", "lint", "test"]

[tasks.test]
description = "Run Rust tests"
run = "cargo test"

[tasks.publish]
description = "Publish Rust crate to crates.io"
run = "cargo publish"

[tasks."publish:dry-run"]
description = "Dry-run publish to verify package"
run = "cargo publish --dry-run"

[tasks."smoke:stage"]
description = "Symlink native library into binding directories"
run = """
#!/usr/bin/env bash
set -euo pipefail
[ -d bindings/python/gurmukhi ] && ln -sf ../../../target/release/libgurmukhi.so bindings/python/gurmukhi/libgurmukhi.so
[ -d bindings/ruby/lib/gurmukhi ] && ln -sf ../../../../target/release/libgurmukhi.so bindings/ruby/lib/gurmukhi/libgurmukhi.so
true
"""

[tasks."smoke:javascript"]
description = "Smoke test: JavaScript WASM"
run = "bun bindings/javascript/smoke/wasm.ts"

[tasks."smoke:react-native"]
description = "Smoke test: ubrn bindings via Node N-API runtime (no emulator)"
run = """
#!/usr/bin/env bash
set -euo pipefail
rm -rf bindings/javascript/smoke/napi
bun bindings/javascript/node_modules/.bin/ubrn generate napi bindings \
  --library target/release/libgurmukhi.so \
  --ts-dir bindings/javascript/smoke/napi \
  --lib-colocated
cp target/release/libgurmukhi.so bindings/javascript/smoke/napi/
bun bindings/javascript/smoke/native.ts
"""

[tasks."smoke:python"]
description = "Smoke test: Python"
run = "python bindings/python/smoke_test.py"

[tasks."smoke:ruby"]
description = "Smoke test: Ruby"
run = "ruby bindings/ruby/smoke_test.rb"

[tasks."smoke:kotlin"]
description = "Smoke test: Kotlin"
run = "cd bindings/kotlin && gradle runSmoke --quiet"

[tasks."smoke:swift"]
description = "Smoke test: Swift"
depends = ["xcframework"]
run = """
#!/usr/bin/env bash
set -euo pipefail
# No -Xlinker flags: Package.swift consumes the xcframework, whose macOS slice is the
# same artifact the iOS app links. The dev harness and the app now share one path,
# so a linking problem shows up here rather than only in Xcode.
swift build --product SmokeTest
.build/debug/SmokeTest
"""

[tasks."smoke:all"]
description = "Run all smoke tests"
depends = ["smoke:stage", "smoke:javascript", "smoke:python", "smoke:ruby", "smoke:kotlin", "smoke:swift"]
