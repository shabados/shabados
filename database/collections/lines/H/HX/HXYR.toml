[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਮਨ; ਭਜੁ ਰਾਮ ਨਾਮ ਹਰਿ ਨਿਮਖਫਾ ॥"
page = 1336
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, moment, utter thou the Name of thy Lord God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਹਰ ਇਕ ਮੁਹਤ ਤੂੰ ਆਪਣੇ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, vibrate and meditate on the Lord's Name every instant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪ੍ਰੀਤਮ ਹਰੀ! ਤੇਰੇ ਰਾਮ ਨਾਮ ਕੋ ਮਨ ਕਰ (ਭਜੁ) ਸਿਮਰਨ ਕਰਤਾ ਹੂੰ, ਏਕ ਨਿਮਖ ਮਾਤ੍ਰ ਨਹੀਂ ਤਿਆਗਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹਰ ਨਿਮਖ (ਹਰ ਵੇਲੇ) ਜਪਿਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਨਿਮਖਫਾ = ਹਰ ਨਿਮਖ (ਅੱਖ ਝਮਕਣ ਜਿਤਨਾ ਸਮਾ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente mía, vibra y medita en el Nombre del Señor a cada instante."