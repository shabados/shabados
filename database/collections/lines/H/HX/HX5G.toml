data = "ਹੋ ਹਮਰੈ ਚਿਤ ਚੁਰਾਇ; ਲਲਾ ਜੂ, ਤੁਮ ਲਿਯੋ ॥੬॥"
page = 1001

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘You have stolen my heart.’(6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਹੇ ਮੇਰੇ ਪਿਆਰੇ! ਤੁਸੀਂ ਮੇਰਾ ਚਿਤ ਚੁਰਾ ਲਿਆ ਹੈ ॥੬॥"