[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੈ ਆਪੁ ਪਛਾਣਿਆ; ਸਾਦੁ ਮੀਠਾ ਭਾਈ ॥"
page = 426
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who recognise their ownself, enjoy the sweet savour, O brother."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਪਣੇ ਆਪ ਨੂੰ ਸਿਆਣਦੇ ਹਨ, ਉਹ ਮਿੱਠਾ ਸੁਆਦ ਮਾਣਦੇ ਹਨ, ਹੇ ਭਰਾਵਾਂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who recognize their own selves, enjoy the sweet flavor, O Siblings of Destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਨੋਂ ਨੇ ਅਪਨੇ ਆਪ ਮੇਂ ਹੀ ਬ੍ਰਹਮ ਕੋ ਪਛਾਨਿਆ ਹੈ, ਤਿਨ ਕੋ ਮੀਠਾ ਸ੍ਵਾਦ ਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਰਸ ਚੱਖਣ ਨਾਲ) ਮਨੁੱਖ ਆਪਣੇ ਆਪ ਹੀ ਆਤਮਕ ਜੀਵਨ ਨੂੰ ਪੜਤਾਲਣ ਲੱਗ ਪੈਂਦਾ ਹੈ ਤੇ ਇਸ ਤਰ੍ਹਾਂ ਉਸ ਨੂੰ ਨਾਮ-ਰਸ ਦਾ ਸੁਆਦ ਮਿੱਠਾ ਲਗਣਾ ਸ਼ੁਰੂ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੈ ਆਪੁ = ਆਪਣੇ ਹੀ ਆਪ ਨੂੰ, ਆਪਣੇ ਹੀ ਆਤਮਕ ਜੀਵਨ ਨੂੰ। ਪਛਾਣਿਆ = ਪੜਤਾਲ ਕੀਤੀ। ਸਾਦੁ = ਸੁਆਦ। ਭਾਈ = ਹੇ ਭਾਈ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quienes reconocen su propio ser disfrutan del Dulce Sabor, oh Hermanos del Destino;"