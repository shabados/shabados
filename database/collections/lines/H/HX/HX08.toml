[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨਸੈ ਦੁਖੁ ਬਿਪਰੀਤਿ ॥"
page = 980
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that I be rid of distress and evil ways?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਜੋ ਮੈਂ ਦੁੱਖਾਂ ਤੇ ਖੋਟੀਆਂ ਰੀਤਾਂ ਤੋਂ ਖਲਾਸੀ ਪਾ ਜਾਵਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Will he rid me of my pains and evil tendencies?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤੇ ਦੁਖ ਔ ਉਲਟੀ ਰੀਤਿ ਦੂਰ ਹੋ ਜਾਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਮ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਭੈੜੇ ਪਾਸੇ ਦੀ ਪ੍ਰੀਤ ਦਾ ਦੁੱਖ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਨਸੈ = ਨਾਸ ਹੋ ਜਾਂਦਾ ਹੈ। ਬਿਪਰੀਤਿ = ਉਲਟੀ ਪ੍ਰੀਤ, ਮਾੜੇ ਪਾਸੇ ਦੀ ਪ੍ਰੀਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A tal ser entregaría mi cuerpo"