[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਉਠ ਚਲਿਆ ਪਰਭਾਤਿ, ਮਾਰਗਿ ਦਸਿਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Then moved forward on the told path."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜਦ ਪਹੁ ਫੁਟੀ ਤੇ ਰਸਤਾ ਦਿੱਸ ਪਿਆ ਉਠਕੇ ਤੁਰ ਪਿਆ।"