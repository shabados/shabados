[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਝਹਿ ਸੁਝੰਤਾ; ਕਛੂ ਨਾਹਿ ॥"
page = 1196
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou know not any thing, O man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਕੁਝ ਭੀ ਨਹੀਂ ਜਾਣਦਾ, ਹੇ ਇਨਸਾਨ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You know nothing."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਕੋ ਕੁਛ ਸੂਝਤਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਕਾਇਆਂ!) ਤੈਨੂੰ ਕੁਝ ਭੀ ਸੁਰਤ ਨਹੀਂ ਰਹੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੁਝਹਿ = ਤੈਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No sabes nada, oh ser humano,"