[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੱਤ੍ਰ ਚੱਕ੍ਰ ਦਾਨੇ ॥"
page = 6
line = 5

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "\"ਚੱਤ੍ਰ\" ਦਾ ਉਚਾਰਨ \"ਤ\" ਤੇ ਔਂਕੜ ਸਹਿਤ ਕਰਨਾ ਹੈ।"

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O the Donor Lord of all the four directions!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਭ ਨੂੰ ਦੇਣ ਵਾਲਾ"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਚੱਤ੍ਰੁ ਚੱਕ੍ਰ, ਦਾਨੇ ॥"