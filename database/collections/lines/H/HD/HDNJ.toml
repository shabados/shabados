[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਿ ਕਬੀਰ; ਹਉ ਤਾ ਕੋ ਦਾਸੁ ॥੪॥੧॥"
page = 1157
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "of him I am a slave, says Kabir."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਮੈਂ ਗੋਲਾ ਹਾਂ, ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- says Kabeer, I am his slave. ||4||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਕਾ ਦਾਸ ਹੂੰ॥੪॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ ਕਿ ਮੈਂ ਉਸ ਮਨੁੱਖ ਦਾ ਸੇਵਕ ਹਾਂ ॥੪॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕੋ = ਉਸ ਦਾ ॥੪॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "de ese ser, oh Dios, Kabir es su esclavo. (4-1)"