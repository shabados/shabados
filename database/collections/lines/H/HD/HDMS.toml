[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਇਆਲ ਲਾਲ ਗੋਬਿੰਦ ਨਾਨਕ; ਮਿਲੁ ਸਾਧਸੰਗਤਿ ਹੋਇ ਗਤੇ ॥੧॥"
page = 455
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "meeting the society of saints, O Nanak, salvation is attained and That compassionate and Beloved World-Lord is found."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿ ਸੰਗਤ ਨਾਲ ਜੁੜਨ ਦੁਆਰਾ, ਹੇ ਨਾਨਕ! ਮੋਖਸ਼ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦੀ ਹੈ ਅਤੇ ਉਹ ਮਿਹਰਬਾਨ ਤੇ ਪਿਆਰਾ ਸ੍ਰਿਸ਼ਟੀ ਦਾ ਸੁਆਮੀ ਲੱਭ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Merciful Beloved Lord, the Lord of the Universe is found; O Nanak, joining the Saadh Sangat, the Company of the Holy, salvation is attained. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਦ੍ਯਾਲ ਲਾਲ ਗੋਬਿੰਦ ਸਾਧ ਸੰਗਤ ਦ੍ਵਾਰੇ ਮਿਲ ਕਰ (ਗਤਿ) ਮੁਕ੍ਤਿ ਵਾ ਸਾਧ ਸੰਗ ਮਿਲ ਕਰ ਤੇਰੀ ਪ੍ਰਾਪਤੀ ਹੋਤੀ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੈਂ ਨਾਨਕ ਉਤੇ ਦਇਆ ਕਰ, ਮੈਨੂੰ) ਨਾਨਕ ਨੂੰ ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਮਿਲਾ, ਤਾ ਕਿ ਮੈਨੂੰ ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ਪ੍ਰਾਪਤ ਹੋ ਜਾਏ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕ ਮਿਲੁ = ਨਾਨਕ ਨੂੰ ਮਿਲ। ਗਤੇ = ਗਤਿ, ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A ese Señor Benévolo Lo encuentras sin duda en la Sociedad de los Santos. (1)"