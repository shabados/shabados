[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਜੈ ਭਾਇ; ਘਣਾ ਦੁਖੁ ਆਗੈ ॥"
page = 1052
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "loving another, the mortal suffers great sorrow in the yonder world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੋਰਸ ਨੂੰ ਪਿਆਰ ਕਰਨ ਦੁਆਰਾ, ਪ੍ਰਾਣੀ, ਪ੍ਰਲੋਕ ਵਿੱਚ ਬਹੁਤਾ ਕਸ਼ਟ ਉਠਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the love of duality, he will suffer terrible agony in the world hereafter."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦ੍ਵੈਤ ਭਾਇ ਮੇਂ ਤੌ ਪਰਲੋਕ ਮੇਂ ਬਹੁਤ ਦੁਖ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਫਸੇ ਰਿਹਾਂ ਜੀਵਨ-ਸਫ਼ਰ ਵਿਚ ਬਹੁਤ ਦੁੱਖ ਵਾਪਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਜੈ ਭਾਇ = ਮਾਇਆ ਦੇ ਪਿਆਰ ਦੇ ਕਾਰਨ। ਘਣਾ = ਬਹੁਤ। ਆਗੈ = ਪਰਲੋਕ ਵਿਚ, ਜੀਵਨ-ਸਫ਼ਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sino que le agrada el otro y por consecuencia sufre aquí después."