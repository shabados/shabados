[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਟਿ ਤਰਕਸੀ ਸੁਹਾਇ; ਬੋਲਤ ਭੇ ਸੀਅ ਸੋ ਬਚਨ ॥੨੪੪॥"
page = 224

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And binding his quiver to his waist he said to Sita 244"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਜਿਸ ਰਾਮ ਦੇ) ਲੱਕ ਨਾਲ ਭੱਥਾ ਸ਼ੋਭ ਰਿਹਾ ਸੀ, (ਉਹ) ਸੀਤਾ ਪ੍ਰਤਿ ਬਚਨ ਕਹਿਣ ਲੱਗੇ ॥੨੪੪॥"