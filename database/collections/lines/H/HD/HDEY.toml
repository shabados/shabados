[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ ਜਾਣਸਿ; ਬ੍ਰਹਮੰ ਕਰਮੰ ॥"
page = 470
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If you know the Nature of the Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਤੂੰ ਪ੍ਰਭੂ ਦੇ ਦਸਤੂਰ ਨੂੰ ਜਾਣਦਾ ਹੋਵੇਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If you knew the nature of God,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਬ੍ਰਹਮ ਕੇ ਜਾਨਨੇ ਕਾ (ਕਰਮੰ) ਪ੍ਰਕਾਰ, ਭਾਵ ਸਾਧਨ (ਜਾਣਸਿ) ਜਾਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਜੇ ਇਹ ਪੰਡਤ ਰੱਬ (ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ) ਦਾ ਕੰਮ ਜਾਣਦਾ ਹੋਵੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬ੍ਰਹਮੰ ਕਰਮੰ = ਬ੍ਰਹਮ ਦੇ ਕੰਮ, ਰੱਬ ਦੀ (ਬੰਦਗੀ) ਦੇ ਕੰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si solamente conocieran la Naturaleza de Dios,"