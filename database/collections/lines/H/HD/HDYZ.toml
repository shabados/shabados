[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮੇਰੇ; ਸਗਲ ਉਪਾਵ ਤਿਆਗੁ ॥"
page = 45
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Mind! give up all (Other) efforts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ! (ਹੋਰਂ) ਸਾਰੇ ਉਪਰਾਲੇ ਛੱਡ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, give up all these efforts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਔਰ ਸਰਬ ਉਪਾਵੋਂ ਕਾ ਤਿਆਗ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਹੋਰ ਸਾਰੇ ਹੀਲੇ ਛੱਡ ਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਪਾਵ = ਹੀਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Deja ya cualquier otro esfuerzo, oh mi mente."