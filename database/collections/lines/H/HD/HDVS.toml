data = "ਅਸ ਚਰਿਤ੍ਰ ਕਰਿ ਪਾਰਬਤੀ; ਦੀਨੋ ਅਸੁਰ ਜਰਾਇ ॥"
page = 1013

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Through such an Chritar, Paarbati annihilated the devil,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਚਰਿਤ੍ਰ ਕਰ ਕੇ ਪਾਰਬਤੀ ਨੇ ਦੈਂਤ ਨੂੰ ਸਾੜ ਦਿੱਤਾ"