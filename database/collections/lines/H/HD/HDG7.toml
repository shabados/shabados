[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਜਨਾ ਕਾ; ਪੇਖਨੁ ਸਭੁ ਬ੍ਰਹਮ ॥"
page = 294
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the sight of the holy man the Lord is in every-thing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਰਮਾਤਮਾ ਦੀ ਨਿਗ੍ਹਾ ਅੰਦਰ ਹਰ ਸ਼ੈ ਵਿੱਚ ਸੁਆਮੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the eye of the Saint, everything is God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨੋਂ ਕਾ ਦੇਖਨਾ ਭੀ ਸਭ ਬ੍ਰਹਮ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨ ਹਰ ਥਾਂ ਅਕਾਲ ਪੁਰਖ ਨੂੰ ਹੀ ਵੇਖਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੇਖਨੁ = ਵੇਖਣਾ। ਸਭੁ = ਸਾਰਾ, ਹਰ ਥਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Santo percibe a Dios en todas partes."