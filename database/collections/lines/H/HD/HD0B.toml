[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤ︀ਯਾਗਿ ਧਰਮ ਕੀ ਨਾਰਿ ਤੋਹਿ ਕਬਹੂੰ ਨ ਬਰੈਗੇ ॥੨੪॥"
page = 834

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Not to abandon my wife, I will never have sex with you.(24)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਮੈਂ ਆਪਣੀ) ਧਰਮ ਪਤਨੀ ਨੂੰ ਛਡ ਕੇ ਤੈਨੂੰ ਕਦੇ ਵੀ ਨਹੀਂ ਵਰਾਂਗਾ ॥੨੪॥"