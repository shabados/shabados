[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਉਤ ਅਪਛਰਾ ਨਭਿ ਝਰਲਾਯੋ ॥੧੫੪੩॥"
page = 451

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On this side they began to wage war and on the other side, the heavenly damsels began to dance in the sky.1543."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਧਰ ਅਪੱਛਰਾਵਾਂ ਨੇ ਆਕਾਸ਼ ਵਿਚ (ਨਾਚ ਗਾਣੇ ਦਾ) ਰੰਗ ਬੰਨ੍ਹ ਦਿੱਤਾ ਹੈ ॥੧੫੪੩॥"