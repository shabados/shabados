[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਕਿਯਾ ਕੈਸੇ ਪਟ ਬਨੇ; ਗਗਨ ਭੂਮਿ ਪੁਨਿ ਦੋਇ ॥"
page = 904

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘The sky and the earth are like two grinding stones."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਆਕਾਸ਼ ਅਤੇ ਧਰਤੀ ਦੋਵੇਂ ਚੱਕੀ ਦੇ ਪੁੜਾਂ ਵਰਗੇ ਬਣੇ ਹੋਏ ਹਨ।"