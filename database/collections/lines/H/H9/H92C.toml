[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮੇਰੇ; ਨਾਮਿ ਰਤੇ ਸੁਖੁ ਹੋਇ ॥"
page = 38
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Soul! by being imbued with the Name thou shalt procure peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਨਾਮ ਨਾਲ ਰੰਗੀਜਣ ਦੁਆਰਾ ਤੂੰ ਆਰਾਮ ਪਾਵੇਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, attuned to the Naam, you shall find peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪ੍ਯਾਰੇ! ਨਾਮੀ ਸੇ ਰਤੇ ਹੂਏ ਕੋ ਸੁਖੁ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਜੇ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ-ਰੰਗ ਵਿਚ ਰੰਗੇ ਜਾਵੀਏ, ਤਾਂ ਆਤਮਕ ਆਨੰਦ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਮਿ = ਨਾਮ ਵਿਚ। ਰਤੇ = ਰੰਗੇ ਜਾਈਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, llénate con el Nombre del Señor y encuentra ahora la Felicidad."