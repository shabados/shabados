[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਬਿਸਨ. ਕੀਨੇ ਅਵਤਾਰ ॥"
page = 1156
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He created millions of incarnations of Vishnu."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਕ੍ਰੋੜਾਂ ਦੀ ਵਿਸ਼ਨੂੰ ਦੇ ਅਉਤਾਰ ਰਚੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He created millions of incarnations of Vishnu."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜੋਂ ਹੀ ਤੈਨੇ ਬਿਸਨੁ ਅਵਤਾਰ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹ ਗੋਬਿੰਦ ਐਸਾ ਹੈ ਜਿਸ ਨੇ) ਕ੍ਰੋੜਾਂ ਹੀ ਵਿਸ਼ਨੂ-ਅਵਤਾਰ ਬਣਾਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਟਿ = ਕ੍ਰੋੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que creó millones de Vishnus"