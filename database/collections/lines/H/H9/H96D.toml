type = "primary"
data = "ਅਤਿ ਤਸਕਰ ਤਾ ਕੌ ਜਗ ਕਹੈ ॥"
page = 989

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There lived one lowborn called Beer Datt, who was known as a big thief."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਸਾਰਾ ਜਗਤ ਵੱਡਾ ਚੋਰ ਕਹਿੰਦਾ ਸੀ।"