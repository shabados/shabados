[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਕਿ ਬਿਦਿਆ ਅਰੁ ਲਾਜ ਅਮਿਟ; ਅਤਿ ਹੀ ਪ੍ਰਤਾਪ ਰਣਿ ॥"
page = 700

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Vidya (learning) and Lajja (modesty) are also extremely glorious"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ (ਦਾ ਨਾਂ) 'ਬਿਦਿਆ' ਅਤੇ (ਦੂਜੇ ਦਾ) 'ਲਾਜ' ਹੈ, (ਇਹ ਦੋਵੇਂ) ਅਮਿਟ ਅਤੇ ਰਣ ਵਿਚ ਅਤਿ ਅਧਿਕ ਪ੍ਰਤਾਪ ਵਾਲੇ ਹਨ।"