[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖੁ ਰੋਗੀ ਹੈ ਸੰਸਾਰਾ ॥"
page = 118
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The perverse is disease-stricken in this world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਨ ਮਤੀਆ ਇਸ ਜਹਾਨ ਅੰਦਰ ਰੋਗ-ਗ੍ਰਸਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The self-willed manmukhs are sick and diseased in the world."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖਤਾ ਕੇ ਰੋਗ ਕਰ ਸੰਸਾਰ ਰੋਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲਾ ਜਗਤ (ਵਿਕਾਰਾਂ ਵਿਚ ਪੈ ਕੇ) ਰੋਗੀ ਹੋ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਮੁਖ = ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mundo está determinado por el ego y en el ego se aflige,"