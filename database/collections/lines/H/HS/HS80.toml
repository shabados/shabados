[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚੋਆ ਚੰਦਨ; ਮਰਦਨ ਅੰਗਾ ॥"
page = 326
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The body, to whose limbs the otto of sandal is applied,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇਹਿ ਦੇ ਅੰਗਾਂ ਨੂੰ ਚੰਨਣ ਦਾ ਅਰਕ ਮਲਿਆ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You may anoint your limbs with sandalwood oil,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚੰਦਨ ਕਾ ਅਤਰ ਜਿਸ ਸ਼ਰੀਰ ਕੇ ਅੰਗੋਂ ਕੋ ਮਲਤਾ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਸਰੀਰ ਦੇ) ਅੰਗਾਂ ਨੂੰ ਅਤਰ ਤੇ ਚੰਦਨ ਮਲੀਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੋਆ = ਅਤਰ। ਮਰਦਨ = ਮਾਲਸ਼। ਅੰਗਾ = (ਸਰੀਰ ਦੇ) ਅੰਗਾਂ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Podrás untar tu cuerpo con aceite de Sándalo,"