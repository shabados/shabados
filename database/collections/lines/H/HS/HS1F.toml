[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਤਿਤ. ਪੁਨੀਤ ਸਭ ਹੋਏ ॥"
page = 624
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This wise, all the sinners are rendered pure."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਸਾਰੇ ਪਾਪੀ ਪਵਿੱਤਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All the sinners are purified."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭੀ ਪਾਪੀ ਪਵਿਤ੍ਰ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਿਕਾਰੀ ਮਨੁੱਖ ਭੀ ਗੁਰੂ ਨੂੰ ਮਿਲ ਕੇ ਪਵਿਤ੍ਰ ਜੀਵਨ ਵਾਲੇ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿਤ = ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗੇ ਹੋਏ। ਪੁਨੀਤ = ਪਵਿਤ੍ਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, de esta forma todos los transgresores son purificados."