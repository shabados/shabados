[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤ੍ਰਿਕੁਟੀ ਛੂਟੀ; ਬਿਮਲ ਮਝਾਰਿ ॥"
page = 220
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By abiding in the Pure Lord, I am rid of the three qualities."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਵਨ ਪ੍ਰਭੂ ਅੰਦਰ ਵਸਣ ਦੁਆਰਾ ਮੈਂ ਤਿੰਨਾਂ ਗੁਣਾਂ ਤੋਂ ਖਲਾਸੀ ਪਾ ਗਿਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am rid of the three-phased Maya, dwelling in the Pure Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਰਤਾ ਕਰਮ ਕ੍ਰਿਆਦਿ ਤ੍ਰਿਕੁਟੀ ਛੁਟ ਗਈ ਹੈ, ਯਾਂ ਤੇ ਏਕ ਆਤਮਾ ਕੋ ਨਿਸਚੇ ਕੀਆ ਹੈ। (ਬਿਮਲ) ਨਿਰਮਲ ਪਰਮੇਸ੍ਵਰ ਕੇ ਰੂਪ ਮੇਂ ਇਸਥਿਤੀ ਭਈ ਹੈ, ਵਾ ਸੁਧ ਅੰਤਹਕਰਨ ਮੇਂ ਤਿਸ ਕੋ ਜਾਨਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਮਤਿ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਪਵਿਤ੍ਰ ਹਰਿ-ਨਾਮ ਵਿਚ ਲੀਨ ਰਹਿਣ ਕਰਕੇ ਮੇਰੀ ਅੰਦਰਲੀ ਖਿੱਝ ਮੁੱਕ ਗਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤ੍ਰਿਕੁਟੀ = ਤ੍ਰਿਊੜੀ (त्रि-कुटी, ਤਿੰਨ ਵਿੰਗੀਆਂ ਲਕੀਰਾਂ) {ਨੋਟ: ਮੱਥੇ ਤੇ ਤ੍ਰਿਊੜੀ ਤਦੋਂ ਪੈਂਦੀ ਹੈ, ਜਦੋਂ ਮਨ ਵਿਚ ਖਿੱਝ ਹੋਵੇ। ਸੋ, ਤ੍ਰਿਕੁਟੀ ਦਾ ਅਰਥ ਹੈ 'ਮਨ ਦੀ ਖਿੱਝ'}। ਬਿਮਲ = ਸਾਫ਼, ਪਵਿਤ੍ਰ। ਮਝਾਰਿ = ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Habitando en Él, en el Uno Inmaculado, me deshago de las tres caras de Maya,"