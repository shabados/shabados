[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਬੈਸੰਤਰੁ ਇਕੁ ਵਰਨ ਹੋਇ; ਸਭ ਤਰਵਰ ਛਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The same fire is there in all trees."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਨਾਨ ਪ੍ਰਕਾਰ ਦੇ) ਸਾਰੇ ਬ੍ਰਿੱਛਾਂ ਵਿਚੋਂ ਅੱਗ ਇਕੋ ਰੰਗ ਦੀ ਪ੍ਰਗਟਦੀ ਹੈ।"