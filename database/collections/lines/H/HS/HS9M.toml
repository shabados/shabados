[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਇਹ ਪਰਜਾ ਉਸ ਸਦਕਾ ਪ੍ਰਸੰਨ ਹੈ ਅਤੇ ਦੇਸ਼ ਸੁਖੀ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਰੱਯਅਤ ਖ਼ੁਸ਼ੋ ਮਮਲਕਤ ਸ਼ਾਦ ਅਜ਼ੋ ॥੯੮॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, the subjects are satisfied and happy and the country is comfortable due to him. (98)"