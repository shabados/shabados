[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅਹੁ ਮੈਲੇ; ਬਾਹਰਹੁ ਨਿਰਮਲ ॥"
page = 919
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Foul within and fair without."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਦਰੋਂ ਗੰਦੇ ਅਤੇ ਬਾਹਰਵਾਰੋਂ ਸ਼ੁੰਧ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Inwardly polluted, and outwardly pure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੀਅ ਸੇ (ਮੈਲੇ) ਖੋਟੇ ਹੈਂ ਪੁਨਾ ਬਾਹਿਰੋਂ (ਨਿਰਮਲ) ਸਾਫ ਨਜਰ ਆਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਿਰੇ ਬਾਹਰੋਂ ਧਾਰਮਿਕ ਦਿੱਸਦੇ ਕਰਮ ਕਰਨ ਵਾਲੇ ਬੰਦੇ) ਮਨ ਵਿਚ (ਵਿਕਾਰਾਂ ਨਾਲ) ਮੈਲੇ ਰਹਿੰਦੇ ਹਨ ਤੇ ਸਿਰਫ਼ ਵੇਖਣ ਨੂੰ ਹੀ ਪਵਿਤ੍ਰ ਜਾਪਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅਹੁ = ਜਿੰਦ ਤੋਂ, ਮਨ ਵਿਚੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquéllos que están puros por fuera,"