type = "primary"
data = "ਗਿਰ ਭੂਮਿ ਪਰਤ ॥੨੩੬॥"
page = 575

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Getting infuriated, the warriors do not run for two steps and fighting in anger, they fall on the ground.236."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਅੰਤ ਵਿਚ ਮਾਰੇ ਜਾ ਕੇ) ਧਰਤੀ ਉਤੇ ਡਿਗ ਪੈਂਦੇ ਹਨ ॥੨੩੬॥"