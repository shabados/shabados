[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੂਤਰਿ ਬਹੁਰਿ ਬਖਾਨੀਯੈ; ਨਾਮ ਬਾਨ ਲਖਿ ਲੇਹੁ ॥੧੬੭॥"
page = 725

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After uttering the word “Bhardwaj (the father of Dronaj), then adding the words “Shishya and Sutari”, the names of Baan are known.167."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਗਰੋਂ 'ਸੂਤਰਿ' ਦਾ ਕਥਨ ਕਰੋ। (ਇਨ੍ਹਾਂ ਨੂੰ) ਬਾਣ ਦੇ ਨਾਮ ਸਮਝ ਲਵੋ ॥੧੬੭॥"