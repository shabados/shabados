[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪੁਨੇ ਪ੍ਰਭ ਕਉ; ਕਿਉ. ਨ ਸਮਾਰਸਿ ਰੇ ॥"
page = 1000
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why not contemplate on Lord, O mortal?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੇ ਸਾਹਿਬ ਦਾ ਕਿਉਂ ਸਿਮਰਨ ਨਹੀਂ ਕਰਦਾ, ਹੇ ਪ੍ਰਾਣੀ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Why do you not contemplate your God?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਅਪਨੇ ਪ੍ਰਭੂ ਕੋ ਕਿਉਂ ਨਹੀਂ ਸੰਭਾਰਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੇ ਪਰਮਾਤਮਾ ਨੂੰ ਕਿਉਂ ਯਾਦ ਨਹੀਂ ਕਰਦਾ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ ਕਉ = ਪ੍ਰਭੂ ਨੂੰ। ਨ ਸਮਾਰਸਿ = ਤੂੰ ਯਾਦ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hombre, ¿por qué no te preocupas por tu Dios?"