[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਨ ਹੋਈ ਮਨ ਕੀ ਆਸਾ; ਗੁਰੁ ਭੇਟਿਓ ਹਰਿ ਰੰਗਾ ॥੨॥"
page = 208
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By meeting the Guru, in love with God, my mind's desire is fulfilled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਵਿੱਚ ਪ੍ਰੀਤ ਰੱਖਣ ਵਾਲੇ ਗੁਰਾਂ ਨੂੰ ਮਿਲ ਕੇ ਮੇਰੇ ਚਿੱਤ ਦੀ ਮੁਰਾਦ ਪੂਰੀ ਹੋ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind's desires are fulfilled, meeting the Guru, in love with the Lord. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਹਰੀ ਕੇ ਅਨੰਦ ਵਾਲਾ ਅਰਥਾਤ ਆਤਮ ਆਨੰਦੀ ਗੁਰੂ ਮਿਲਿਆ ਤਬ ਮਨ ਕੀ ਜੋ ਆਸਾ ਥੀ ਸੋ ਸਮਾਪਤਿ ਹੋਈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਪਰਮਾਤਮਾ ਨਾਲ ਪਿਆਰ ਕਰਨ ਵਾਲਾ ਗੁਰੂ ਮਿਲ ਪਿਆ, ਉਸ ਦੇ ਮਨ ਦੀ (ਹਰੇਕ) ਕਾਮਨਾ ਪੂਰੀ ਹੋ ਗਈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ ਰੰਗਾ = ਹਰੀ ਨਾਲ ਪਿਆਰ ਕਰਨ ਵਾਲਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el deseo de la mente es saciado y encontramos al Guru en el Amor del Señor."