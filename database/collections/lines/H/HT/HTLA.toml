[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਸਤ ਖੇਲਤ; ਤੇਰੇ ਦੇਹੁਰੇ ਆਇਆ ॥"
page = 1164
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In a laughing and sportive mood, I came to Thy temple, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੰਸਦੜੀ ਅਤੇ ਖਿਲੰਦੜੀ ਦਸ਼ਾ ਅੰਦਰ ਮੈਂ ਤੇਰੇ ਮੰਦਰ ਨੂੰ ਆਇਆ ਹੈ, ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Laughing and playing, I came to Your Temple, O Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੋ ਹਸਤਾ ਖੇਲਤਾ ਪ੍ਰਸੰਨਤਾ ਸਹਿਤ ਤੇਰੇ (ਦੇਹੁਰੇ) ਮੰਦ੍ਰ ਮੇਂ ਆਯਾ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਬੜੇ ਚਾਅ ਨਾਲ ਤੇਰੇ ਮੰਦਰ ਆਇਆ ਸਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਸਤ ਖੇਲਤ = ਹੱਸਦਾ ਖੇਡਦਾ, ਬੜੇ ਚਾਉ ਨਾਲ। ਦੇਹੁਰੇ = ਮੰਦਰ ਵਿਚ {Skt. देवालय}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Llegué a Tu Templo, oh Señor con toda inspiración"