[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨ ਸਪਤ; ਜੇਰ ਜਿਮੀ ॥"
page = 144
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "nor the seven worlds beneath the earth, shall remain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਂ ਹੀ ਜਮੀਨ ਦੇ ਹੇਠਾਂ ਦੇ ਸਤ ਲੋਅ ਰਹਿਣਗੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nor the seven realms beneath the earth, shall remain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਲੋਕ ਮੇਂ ਤੋ ਕਿਆ ਜਮੀਨ ਕੇ (ਜੇਰ) ਨੀਚੇ ਸਾਤ ਜੋ ਪਤਾਲ ਹੈਂ ਤਿਨ ਮੇਂ ਨ੍ਯਾਉ ਕੇ ਦੇਣੇ ਵਾਲਾ ਨਾਗ ਅਸਰਾਦਿਕ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਹ ਹੀ ਧਰਤੀ ਦੇ ਹੇਠਲੇ ਸੱਤ (ਪਤਾਲ ਹੀ) ਸਦਾ ਰਹਿ ਸਕਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਪਤ = ਸੱਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ni tampoco en los siete bajos mundos."