[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਿ ਹਰਿ ਹਰਿ ਕਥਾ ਵਡਭਾਗੀਆ; ਹਰਿ ਉਤਮ ਪਦੁ ਨਿਰਬਾਣੀ ॥"
page = 996
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Deliberate thou over the Lord's discourse, O fortunate man and thy God shall bless thee with the sublime and imperishable status."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੁਆਮੀ ਮਾਲਕ ਦੀ ਵਾਰਤਾ ਨੂੰ ਸੋਚ ਵਿਚਾਰ, ਹੇ ਨਸੀਬਾਂ ਵਾਲਿਆ ਬੰਦਿਆਂ ਅਤੇ ਤੇਰਾ ਵਾਹਿਗੁਰੂ ਤੈਨੂੰ ਸਰੇਸ਼ਟ ਤੇ ਅਬਿਨਾਸ਼ੀ ਪਦਵੀ ਪ੍ਰਦਾਨ ਕਰ ਦੇਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate on the sermon of the Lord, Har, Har, O very fortunate ones; the Lord shall bless you with the most sublime status of Nirvaanaa."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਡਭਾਗੀਆਂ ਪਾਸੋਂ ਹਰੀ ਕਥਾ ਕੋ ਸੁਨ ਕੇ, ਹਰੀ ਨਾਮ ਕੋ ਜਪ ਕਰਕੇ, ਉਤਮ ਪਦ ਜੋ ਨਿਰਬੰਧ ਹੈ ਤਿਸ ਕੋ ਮੈਂ ਪ੍ਰਾਪਤ ਹੋਵਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਡਭਾਗੀ ਮਨ! (ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ) ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਚੇਤੇ ਕਰਦਾ ਰਹੁ, (ਇਸ ਤਰ੍ਹਾਂ) ਉੱਤਮ ਅਤੇ ਵਾਸਨਾ-ਰਹਿਤ ਆਤਮਕ ਦਰਜਾ ਮਿਲ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਡਭਾਗੀਆ = ਹੇ ਵਡਭਾਗੀ ਮਨ! ਪਦੁ = ਦਰਜਾ। ਨਿਰਬਾਣੀ = ਵਾਸਨਾ-ਰਹਿਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh afortunado, medita en el Evangelio de tu Dios, pues de Dios uno obtiene el Sublime Estado de Desapego, el Nirvana."