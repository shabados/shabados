[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਸਿਮਰਤ; ਦੈਤ ਦੇਉ. ਨ ਪੋਹੈ ॥"
page = 1150
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Contemplating God, demon and ghost shall touch thee not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਦਾ ਭਜਨ ਕਰਨ ਨਾਲ ਬੁਤ ਤੇ ਪ੍ਰੇਤ ਤੈਨੂੰ ਨਹੀਂ ਤੋਂ ਹਣਗੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating in remembrance on the Lord, demons and ghosts shall not touch you."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਹਰੀ ਕੋ ਸਿਮਰਤੇ ਹੂਏ ਕੋਈ ਦੈਤ ਔ ਦੇਉ ਭੀ ਪੋਹਿ ਨਹੀਂ ਸਕਤਾ ਹੈ, ਭਾਵ ਮਾਯਾ ਅਰ ਕਾਮਾਦਿਕ ਬਿਆਪ ਨਹੀਂ ਸਕਤੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਦਿਆਂ ਕੋਈ ਦੈਂਤ ਕੋਈ ਦੇਉ ਆਪਣਾ ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੈਤ ਦੇਉ = ਦੈਂਤ ਦੇਉ, (ਕਾਮਾਦਿਕ ਕੋਈ) ਵੱਡੇ ਤੋਂ ਵੱਡਾ ਦੇਉ। ਨ ਪੋਹੈ = ਆਪਣਾ ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí habitando en Dios, ni la maldad ni los fantasmas te siguen los pasos."