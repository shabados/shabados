[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਾਵਨਿ ਗੋਪੀਆ; ਗਾਵਨਿ ਕਾਨੑ ॥"
page = 465
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sing milk-maid and sing Krishans."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗਾਉਂਦੀਆਂ ਹਨ ਗੁਆਲਣਾਂ ਤੇ ਗਾਉਂਦੇ ਹਨ ਕ੍ਰਿਸ਼ਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They sing of the milk-maids, they sing of the Krishnas."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੋਪੀਆਂ ਭੀ ਗਾਵਤੀ ਹੈਂ ਕ੍ਰਿਸ਼ਨ ਔਰ ਰਾਮ ਭੀ ਗਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੋਪੀਆਂ (ਦੇ ਸਾਂਗ ਬਣ ਕੇ) ਗਾਉਂਦੇ ਹਨ, ਕਾਨ੍ਹ (ਦੇ ਸਾਂਗ ਬਣ ਕੇ) ਗਾਉਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਾਵਨਿ ਗੋਪੀਆ = ਗੋਪੀਆਂ (ਦੇ ਸਾਂਗ ਬਣ ਕੇ) ਗਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y de los Krishnas,"