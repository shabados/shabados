[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਚਛੁ ਤਾ ਕੇ ਰਹੈ; ਮੁਖ ਕੁਰੂਪ ਕੇ ਸਾਥ ॥"
page = 878

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He had only one eye and, due to this, his face looked ugly."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ (ਜੱਟ) ਦੇ ਕੁਰੂਪ ਮੁਖ ਉਤੇ ਇਕ ਅੱਖ ਹੀ ਸੀ।"