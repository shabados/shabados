[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮੇਹੀਵਾਲ ਨੋ ਸੋਹਣੀ, ਨੈ ਤਰਦੀ ਰਾਤੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The fame of Sohni who used to swim the Chenab river in the ht to meet Mahival is well known."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੇਹੀਂਵਾਲ ਦੇ ਵਾਸਤੇ ਸੋਹਣੀ ਰਾਤ ਨੂੰ ਰੋਜ਼ ਨਦੀ ਤਰ ਕੇ ਮਿਲਣ ਜਾਂਦੀ ਸੀ।"