[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਿ ਕਰੈ; ਆਪਨ ਬੀਚਾਰੈ ॥"
page = 277
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself does and Himself deliberates."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਠਾਕੁਰ ਆਪੇ ਕਰਦਾ ਹੈ ਅਤੇ ਆਪੇ ਹੀ ਸੋਚਦਾ ਸਮਝਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself acts, and He Himself contemplates."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਬੀਚਾਰ ਕੋ ਆਪ ਹੀ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਝ ਕਰਦਾ ਹੈ, ਆਪਣੀ ਸਲਾਹ ਅਨੁਸਾਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪਨ ਬੀਚਾਰੈ = ਆਪਣੇ ਵਿਚਾਰ ਅਨੁਸਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo actúa y Él Mismo contempla."