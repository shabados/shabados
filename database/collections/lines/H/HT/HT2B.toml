type = "primary"
data = "ਰੋਹ ਹੋਈ ਮਹਾ ਮਾਈ, ਰਾਕਸਿ ਮਾਰਣੇ ॥੫॥"
page = 120

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "For killing the demons, the great mother exhibited great fury.5."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੁਰਗਾ ਦੇਵੀ ਰਾਖਸ਼ਾਂ ਨੂੰ ਮਾਰਨ ਲਈ ਕ੍ਰੋਧਵਾਨ ਹੋ ਗਈ ॥੫॥"