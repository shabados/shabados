[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਪ੍ਰਤਿਪਾਲ ਰਹੀਮ ॥"
page = 896
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Merciful Master cherishes all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿਹਰਬਾਨ ਮਾਲਕ ਸਾਰਿਆਂ ਨੂੰ ਪਾਲਦਾ ਪੋਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The merciful Lord cherishes all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਿੰਦੂ ਕਹਤੇ ਹੈਂ ਤੂੰ ਸਰਬ ਕਾ ਪ੍ਰਤਿਪਾਲਕ ਹੈਂ ਔ ਮੁਸਲਮਾਨ ਰਹੀਮ ਕਹਿਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਭ ਜੀਵਾਂ ਨੂੰ ਪਾਲਣ ਵਾਲੇ! ਹੇ (ਸਭਨਾਂ ਉਤੇ) ਰਹਿਮ ਕਰਨ ਵਾਲੇ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਤਿਪਾਲ = ਪਾਲਣ ਵਾਲਾ। ਰਹੀਮ = ਰਹਿਮ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Señor Misericordioso que eleva a todos."