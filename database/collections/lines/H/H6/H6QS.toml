[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੋਟੀਆ ਕਾਰਣਿ; ਪੂਰਹਿ ਤਾਲ ॥"
page = 465
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "For the sake of bread they beat the time."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਟੁਕੜੇ ਦੀ ਖਾਤਰ ਉਹ ਸੁਰ ਤਾਲ ਮੇਲਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They beat the drums for the sake of bread."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰੋਟੀਓਂ ਕੇ ਵਾਸਤੇ ਤਾਲ ਤੋੜਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਉਹ ਰਾਸਧਾਰੀਏ) ਰੋਜ਼ੀ ਦੀ ਖ਼ਾਤਰ ਨੱਚਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰਹਿ ਤਾਲ = ਤਾਲ ਪੂਰਦੇ ਹਨ, ਨੱਚਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Solamente para esto pegan sus cabezas contra el piso,"