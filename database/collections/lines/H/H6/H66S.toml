[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਛੰ. ਕਰੋਤਿ ਅਗ੍ਰਣੀਵਹ; ਨਿਰਾਸੰ, ਆਸ ਪੂਰਨਹ ॥"
page = 1355
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord brings to the fore those that are left behind and fulfills the hopes of the hopeless."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਪਿਛੇ ਰਹਿ ਗਿਆ ਨੂੰ ਅੱਗੇ ਲੈ ਆਉਂਦਾ ਹੈ ਅਤੇ ਬੇਉਮੈਦਿਆਂ ਦੀਆਂ ਉਹ ਉਮੈਦਾ, ਪੂਰੀਆਂ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who were left behind - the Lord brings them to the front. He fulfills the hopes of the hopeless."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੋ ਪੀਛੇ ਤੇ ਆਗੇ ਕਰਤਾ ਹੈ ਔ ਨਿਰਾਸੋਂ ਕੀ ਆਸ ਪੂਰਨ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲਿਆਂ ਨੂੰ ਆਗੂ ਬਣਾ ਦੇਂਦਾ ਹੈ, ਨਿਰਾਸਿਆਂ ਦੀਆਂ ਆਸਾਂ ਪੂਰੀਆਂ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਛੰ = ਪਿੱਛੇ। ਕਰੋਤਿ = (करोति) ਕਰ ਦੇਂਦਾ ਹੈ। ਅਗ੍ਰਣੀਵਹ = ਅੱਗੇ ਲੱਗਣ ਵਾਲੇ (अग्रणी = a leader)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los que fueron dejados atrás, el Señor los trae al frente, Él cumple las esperanzas de quien no las tiene."