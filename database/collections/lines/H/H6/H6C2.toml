[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਗੁਰਮੁਖਿ; ਮੇਲਿ ਮਿਲਾਏ ॥੩੬॥"
page = 942
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, the pious person unites in the Lord's union."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਪਵਿੱਤਰ ਪੁਰਸ਼ ਪ੍ਰਭੂ ਦੇ ਮਿਲਾਪ ਅੰਦਰ ਮਿਲ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Gurmukh unites in the Lord's Union. ||36||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਗੁਰਮੁਖ ਵਾਹਿਗੁਰੂ ਕੇ ਮੇਲ ਮੇਂ ਮਿਲਾਇ ਦੇਤੇ ਹੈਂ॥੩੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇ ਇਸ ਤਰ੍ਹਾਂ ਉਹਨਾਂ ਨੂੰ) ਹੇ ਨਾਨਕ! (ਪ੍ਰਭੂ ਦੇ) ਮੇਲ ਵਿਚ ਮਿਲਾ ਦੇਂਦਾ ਹੈ ॥੩੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "también une a otros con Dios.  (36)"