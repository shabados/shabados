[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਲੈਤ; ਅਤਿ ਮੂੜ ਸੁਗਿਆਨਾ ॥"
page = 1142
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Taking the Name, the exceedingly ignorant become the great divines."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਲੈਣ ਦੁਆਰਾ ਪਰਮ ਮੂਰਖ ਵਿਸ਼ਾਲ ਬ੍ਰਹਮ ਬੇਤੇ ਬਣ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Repeating the Naam, the most ignorant people become spiritual teachers."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਉਚਾਰਨ ਕਰਨ ਸੇ ਪੁਰਸ ਗਿਆਨਵਾਨ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਜਪਦਿਆਂ ਵੱਡਾ ਭਾਰਾ ਮੂਰਖ ਭੀ ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੋਹਣੀ ਸੂਝ ਵਾਲਾ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਤਿ ਮੂੜ = ਵੱਡਾ ਮੂਰਖ। ਸੁਗਿਆਨਾ = ਚੰਗਾ ਸਿਆਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Recitando el Nombre, hasta los tontos se vuelven Sabios."