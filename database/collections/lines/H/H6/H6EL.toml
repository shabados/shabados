[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਮਹਾ ਬਲਵੰਤ ਦਯੰਤ; ਰਹੇ ਥਿਰ ਹ੍ਵੈ, ਤਿਨ ਬੈਨ ਸੁਨਾਏ ॥੧੪੬੬॥"
page = 443

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Only one powerful demon survived there, who stabilising himself said to the king,1466"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਈ ਇਕ ਮਹਾਨ ਬਲਵਾਨ ਦੈਂਤ ਅਚਲ ਹੋ ਕੇ ਖੜੋਤੇ ਹਨ ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ (ਇਸ ਤਰ੍ਹਾਂ ਦੇ) ਬੋਲ ਕਹੇ ਹਨ ॥੧੪੬੬॥"