assets = ["DGDG"]
type = "primary"
data = "ਰਣੰ ਰੋਸ ਰਜੇ ਮਹਾ ਛਤ੍ਰ ਧਾਰੇ ॥੭੧੧॥"
page = 274

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The helmets broke with the blow of arrows and the great sovereigns were highly enraged in the battlefield.711."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵੱਡੇ ਛੱਤਰਧਾਰੀ ਰਾਜੇ ਕ੍ਰੋਧ ਕਰਕੇ ਰਣ ਵਿੱਚ ਗੱਜ ਰਹੇ ਹਨ ॥੭੧੧॥"