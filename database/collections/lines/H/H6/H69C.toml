[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਪ ਜੋਨਿ; ਵਲਿ ਵਲਿ ਅਉਤਰੈ ॥੧॥"
page = 526
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "is born again and again as the serpent species."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਹ ਮੁੜ ਮੁੜ ਕੇ ਸੱਪ ਦੀ ਜੂਨੀ ਵਿੱਚ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "shall be reincarnated over and over again, in the form of serpents. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ (ਵਲਿ ਵਲਿ) ਬਾਰੰਬਾਰ ਸਰਪ ਕੀ ਜੂਨ ਮੇਂ ਆਵਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੁੜ ਮੁੜ ਸੱਪ ਦੀ ਜੂਨੇ ਪੈਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਲਿ ਵਲਿ = ਮੁੜ ਮੁੜ। ਅਉਤਰੈ = ਜੰਮਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nace y renace como serpiente. (1)"