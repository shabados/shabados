[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੂਕਰ ਸੂਕਰ ਕਹੀਅਹਿ ਕੂੜਿਆਰਾ ॥"
page = 1029
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man of falsehood is called a dog and a swine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਝੂਠਾ ਆਦਮੀ ਕੁੱਤਾ ਅਤੇ ਸੂਰ ਆਖਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The false are called pigs and dogs."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਝੂਠੇ ਕੁਤੇ ਔ ਸੂਰ ਕਹੀਤੇ ਹੈਂ, ਭਾਵ ਸੇ ਇਨ ਯੋਨੀਓਂ ਮੇਂ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਿਰੇ ਕੂੜ ਦੇ ਵਪਾਰੀ ਬੰਦੇ (ਵੇਖਣ ਨੂੰ ਤਾਂ ਮਨੁੱਖ ਹਨ, ਪਰ ਅਸਲ ਵਿਚ ਉਹ) ਕੁੱਤੇ ਤੇ ਸੂਰ ਹੀ (ਆਪਣੇ ਆਪ ਨੂੰ) ਅਖਵਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੂਕਰ = ਕੁੱਤੇ। ਸੂਕਰ = ਸੂਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Como un perro, como un cerdo, es el ser humano que vive en la falsedad,"