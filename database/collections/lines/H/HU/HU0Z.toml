[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭਿ ਕਿਲਬਿਖ ਕਾਟੇ; ਦੂਖ ਸਬਾਏ ॥"
page = 1052
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is rid of all his sins and all his sorrows."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣਿਆਂ ਸਾਰਿਆਂ ਪਾਪਾਂ ਅਤੇ ਸਾਰਿਆਂ ਦੁਖੜਿਆਂ ਤੋਂ ਖਲਾਸੀ ਪਾ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is rid of all sins, and all suffering."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਸਭ ਪਾਪੋਂ ਅਰ ਸਭ ਦੁਖੋਂ ਕੋ ਕਾਟ ਦੇਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੇ ਸਾਰੇ ਪਾਪ ਸਾਰੇ ਦੁੱਖ (ਆਪਣੇ ਅੰਦਰੋਂ) ਕੱਟ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭਿ = ਸਾਰੇ। ਕਿਲਬਿਖ = ਪਾਪ। ਸਬਾਏ = ਸਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así uno se libera de aflicciones y errores."