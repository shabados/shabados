[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਹ੍ਰਿਦੈ; ਬਸਹਿ ਗੁਰ ਪੈਰਾ ॥੩॥"
page = 1299
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "within whose mind the Guru's feet are enshrined."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਮਨ ਵਿੱਚ ਗੁਰਾਂ ਦੇ ਚਰਨ ਨਿਵਾਸ ਰਖਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "for those within whose hearts the Guru's Feet abide. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਰਿਦੇ ਮੇਂ ਗੁਰੋਂ ਕੇ ਚਰਨ ਬਸ ਜਾਤੇ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਹਿਰਦੇ ਵਿਚ ਗੁਰੂ ਦੇ ਚਰਨ ਵੱਸਦੇ ਹਨ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੈ ਹ੍ਰਿਦੈ = ਜਿਸ (ਮਨੁੱਖ) ਦੇ ਹਿਰਦੇ ਵਿਚ। ਬਸਹਿ = ਵੱਸਦੇ ਹਨ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es destruida para quienes tengan los Pies del Guru habitando dentro de su corazón. (3)"