[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਈ ਚਤੁਰੁ ਕਹਾਵੈ ਪੰਡਿਤ ॥"
page = 913
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some one calls himself a wise Brahman."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਜਣਾ ਆਪਦੇ ਆਪ ਨੂੰ ਸਿਆਣਾ ਬ੍ਰਹਾਮਣ ਅਖਵਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One calls himself a wise Pandit, a religious scholar."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਪੰਡਤ ਔ ਕੋਈ ਚਤੁਰ ਕਹਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਮਨੁੱਖ (ਆਪਣੇ ਆਪ ਨੂੰ) ਸਿਆਣਾ ਪੰ​‍ਡਿਤ ਅਖਵਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਤੁਰੁ = ਸਿਆਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunos se llaman Pandits, astutos y eruditos en su hablar;"