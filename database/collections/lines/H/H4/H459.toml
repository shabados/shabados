[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖ ਅੰਧੇ; ਸਾਦੁ. ਨ ਪਾਵਹਿ ॥"
page = 1058
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "those blind egocentrics, taste not God's relish."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਅੰਨ੍ਹੇ ਮਨਮਤੀਏ, ਵਾਹਿਗੁਰੂ ਦੇ ਸੁਆਦ ਨੂੰ ਨਹੀਂ ਚਖਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The blind, self-willed manmukhs do not taste the flavor of God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖਤਾ ਕਰ ਅੰਧੇ ਹੂਏ ਹੈਂ ਸੁਆਦ ਨਹੀਂ ਪਾਵਤੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨ ਦੇ ਮੁਰੀਦ ਤੇ ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਅੰਨ੍ਹੇ ਹੋਏ ਮਨੁੱਖ ਹਰਿ-ਨਾਮ ਦਾ ਸੁਆਦ ਨਹੀਂ ਮਾਣ ਸਕਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਮੁਖ = ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ। ਅੰਧੇ = ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਅੰਨ੍ਹੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ese ciego ególatra, no prueba del Sabor del Señor."