[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਭੀ; ਚੀਤਿ ਨ ਰਾਖਸਿ ਮਾਇਆ ॥੨॥"
page = 478
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the mortal bears it not in her mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਭੀ ਮਾਂ ਇਸ ਨੂੰ ਆਪਣੇ ਚਿੱਤ ਵਿੱਚ ਨਹੀਂ ਰਖਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "even then, his mother does not hold it against him in her mind. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੌ ਭੀ ਮਾਤਾ ਉਸ ਅਪਰਾਧ ਕੋ ਚਿਤ ਮੇਂ ਨਹੀਂ ਰਖਤੀ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਭੀ ਮਾਂ (ਉਸ ਦੇ ਮੂਰਖ-ਪੁਣੇ) ਚੇਤੇ ਨਹੀਂ ਰੱਖਦੀ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਇਆ = ਮਾਂ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a la madre no le importa. (2)"