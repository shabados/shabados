[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਤਾਂ ਹੇਠਿ ਲਤਾੜੀਐ; ਘਾਹੁ ਨ ਕਢੈ ਸਾਹੁ ਵਿਚਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Grass is trampled under feet yet the poor thing never complains."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਘਾਹ ਲਤਾਂ ਦੇ ਹੇਠ ਲਤਾੜੀਦਾ ਹੈ ਵਿਚਾਰੇ ਨੂੰ ਸਾਹ ਨਹੀਂ ਲੈਣਾ ਮਿਲਦਾ।"