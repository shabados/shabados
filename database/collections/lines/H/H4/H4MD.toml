[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਗੁਰ ਕਉ; ਸਿਮਰਉ ਸਾਸਿ ਸਾਸਿ ॥"
page = 239
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That Guru I remember with every breath."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਗੁਰੂ ਨੂੰ ਮੈਂ ਹਰ ਸੁਆਸ ਨਾਲ ਯਾਦ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I remember the Guru with each and every breath."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਤਿਗੁਰੋਂ ਕੋ ਸ੍ਵਾਸ ਸ੍ਵਾਸ ਸਿਮਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਉਸ ਗੁਰੂ ਨੂੰ ਮੈਂ (ਆਪਣੇ) ਹਰੇਕ ਸਾਹ ਦੇ ਨਾਲ ਨਾਲ ਚੇਤੇ ਕਰਦਾ ਰਹਿੰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਸਿਮਰਉ = ਸਿਮਰਉਂ, ਮੈਂ ਸਿਮਰਦਾ ਹਾਂ। ਸਾਸਿ = ਸਾਹ ਨਾਲ। ਸਾਸਿ ਸਾਸਿ = ਹਰੇਕ ਸਾਹ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pienso en el Guru en cada momento, porque el Verdadero Guru es mi Respiración Vital,"