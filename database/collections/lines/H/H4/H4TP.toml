[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਹੁ ਗੁਰਮੁਖਿ ਪਾਵੈ; ਅਲਖ ਅਪਾਰ ॥੪॥"
page = 1188
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by the Guru's grace, he attains unto the Unseeable and Infinite Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਉਹ ਅਦ੍ਰਿਸ਼ਟ ਅਤੇ ਬੇਅੰਤ ਪ੍ਰਭੂ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the Gurmukh attains the invisible and infinite. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਗੁਰਮੁਖ ਅਲਖ ਅਪਾਰ ਪਰਮੇਸ੍ਵਰ ਕੋ ਪਾਵਤਾ ਹੈ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਉਹ ਮਨੁੱਖ ਅਦ੍ਰਿਸ਼ਟ ਤੇ ਬੇਅੰਤ ਪ੍ਰਭੂ ਦਾ ਦਰਸਨ ਕਰ ਲੈਂਦਾ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਲਖ = ਅਦ੍ਰਿਸ਼ਟ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por la Gracia del Guru llega hasta el Señor Infinito e Insondable. (4)"