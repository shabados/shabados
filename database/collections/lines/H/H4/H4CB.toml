[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਇਕੁ ਗੁਰੁ ਇਕੁ ਸਿਖੁ ਹੈ; ਗੁਰੁ ਸਬਦਿ ਸਿਞਾਣੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Becoming the Sikh of the One Guru, the disciple understands the word of the Guru."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਇਕ ਗੁਰੂ (ਨਾਨਕ ਤੇ) ਇਕ ਸਿਖ (ਅੰਗਦ) ਹੈ (ਕਿਉਂ ਜੋ) ਗੁਰੂ ਦੇ ਸ਼ਬਦ (ਹੁਕਮ ਨੂੰ ਮਨੋਂ ਤਨੋਂ ਹੋਕੇ) ਮੰਨ ਲੀਤਾ।"