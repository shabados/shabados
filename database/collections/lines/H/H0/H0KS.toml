[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸ੍ਰਪਨੀ; ਸ੍ਰਪਨੀ; ਕਿਆ ਕਹਹੁ ਭਾਈ ॥"
page = 480
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O brother, why callest thou mammon, a she snake?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਵੀਰ! ਤੂੰ ਮਾਇਆ ਨੂੰ ਨਾਗਣੀ ਕਿਉਂ ਆਖਦਾ ਹੈਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Siblings of Destiny, why is she called a she-serpent?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸ੍ਰਪਨੀ ਸ੍ਰਪਨੀ ਕਿਆ ਕਹਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੋ, ਹੇ ਭਾਈ! ਇਸ ਮਾਇਆ ਤੋਂ ਇਤਨਾ ਡਰਨ ਦੀ ਲੋੜ ਨਹੀਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸ੍ਰਪਨੀ...ਭਾਈ = ਹੇ ਭਾਈ! ਸੱਪਣੀ ਤੋਂ ਇਤਨਾ ਕਿਉਂ ਡਰਦੇ ਹੋ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero, ¿por qué llamarle serpiente hembra a Maya?,"