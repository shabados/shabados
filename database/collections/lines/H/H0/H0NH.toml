[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਚਰਨ ਕਮਲ ਮਨੁ ਲੀਨਾ ॥"
page = 1278
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O God, my soul is absorbed in Thine lotus-feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਮੇਰੀ ਜਿੰਦੜੀ ਤੇਰੇ ਕੰਵਲ ਰੂਪੀ ਪੈਰਾਂ ਅੰਦਰ ਸਮਾਈ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind is absorbed in the Lotus Feet of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਤੇਰੇ ਚਰਨ ਕਮਲੋਂ ਮੇਂ ਮੇਰਾ ਮਨ ਲੀਨ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! (ਮਿਹਰ ਕਰ, ਮੇਰਾ) ਮਨ ਤੇਰੇ ਸੋਹਣੇ ਚਰਨਾਂ ਵਿਚ ਲੀਨ ਰਹੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi mente es absorbida en los Pies de Loto del Señor."