[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਕ ਜੂਝਿ ਪਰੈ, ਇਕ ਦੇਖਿ ਡਰੈ; ਇਕ ਤਉ ਚਿਤ ਮੈ ਅਤਿ ਕੋਪ ਭਰੈ ॥"
page = 479

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Someone died, someone fell and someone got infuriated"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਲੜ ਮਰੇ ਹਨ, ਇਕ (ਸਥਿਤੀ ਨੂੰ) ਵੇਖ ਕੇ ਡਰ ਗਏ ਹਨ ਅਤੇ ਇਕਨਾਂ ਦੇ ਚਿਤ ਵਿਚ ਤਾਂ ਬਹੁਤ ਕ੍ਰੋਧ ਭਰ ਗਿਆ ਹੈ।"