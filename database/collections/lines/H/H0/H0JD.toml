data = "ਇਕ ਬਸਤ ਗ੍ਰਾਮ ਕਾਨਨ ਪਹਾਰ ॥੧੪੪॥"
page = 646

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many stood on one foot without and support and many resided in villages, forests and mountains.144."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਪਿੰਡ ਵਿਚ, ਬਨ ਵਿਚ ਅਤੇ ਪਹਾੜ ਵਿਚ ਵਸਦੇ ਹਨ ॥੧੪੪॥"