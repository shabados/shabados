[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਹਿਰ ਗੰਭੀਰ; ਬੇਅੰਤ ਗੋਵਿੰਦੇ ॥"
page = 99
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "blissful, deep, profound, infinite, the master of universe,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੰਦ-ਪੂਰਤ, ਡੂੰਘਾ, ਅਗਾਧ, ਅਨੰਤ, ਆਲਮ ਦਾ ਮਾਲਕ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Profoundly Deep, Infinite Lord of the Universe,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਬਿੰਦ ਬੇਅੰਤ! ਤੂੰ ਗਹਰ ਗੰਭੀਰ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਡੂੰਘੇ ਤੇ ਵੱਡੇ ਜਿਗਰ ਵਾਲੇ! ਹੇ ਬੇਅੰਤ ਗੋਬਿੰਦ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੰਭੀਰ = ਹੇ ਵੱਡੇ ਜਿਗਰੇ ਵਾਲੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú eres el Señor Insondable, el Maestro Profundo e Infinito Gobind, el Sostenedor."