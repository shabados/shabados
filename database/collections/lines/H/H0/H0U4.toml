[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਭਾਵੈ ਤਿਉ ਰਾਖੁ; ਰਾਖਣਹਾਰਿਆ ॥"
page = 398
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Save me as it pleases Thee O the Saviour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਚਾਉਣਹਾਰ! ਜਿਸ ਤਰ੍ਹਾਂ ਤੈਨੂੰ ਚੰਗਾ ਲਗਦਾ ਹੈ, ਮੈਨੂੰ ਬਚਾ ਲੈ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As it pleases Your Will, please save me, O Savior Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਖਨਹਾਰੇ ਅਕਾਲ ਪੁਰਖ! ਜਿਸ ਪ੍ਰਕਾਰ ਤੁਝੇ ਭਾਵੈ ਤਿਸੀ ਪ੍ਰਕਾਰ ਮੁਝ ਦਾਸ ਕੋ ਰਖ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਭ ਜੀਵਾਂ ਦੀ ਰੱਖਿਆ ਕਰਨ ਦੇ ਸਮਰਥ ਪ੍ਰਭੂ! ਜਿਵੇਂ ਤੈਨੂੰ ਚੰਗਾ ਲੱਗੇ, ਉਸੇ ਤਰ੍ਹਾਂ ਮੇਰੀ ਰੱਖਿਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਖਣਹਾਰਿਆ = ਹੇ ਰੱਖਿਆ ਕਰਨ ਦੀ ਸਮਰਥਾ ਵਾਲੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como es Tu Voluntad, así, mantenme Tú, mi Preservador; pues sin Ti, no hay ningún otro."