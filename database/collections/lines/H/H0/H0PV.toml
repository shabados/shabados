[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੰਧਨ ਮਾਤ ਪਿਤਾ ਸੁਤ ਬਨਿਤਾ ॥"
page = 1147
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mother, father, son and wife are but bonds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਂ, ਪਿਓ, ਪੁੱਤਰ ਅਤੇ ਪਤਨੀ ਕੇਵਲ ਜੰਜੀਰਾਂ ਹੀ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Mother, father, children and spouse - all place the mortal in bondage."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਤਾ, ਪਿਤਾ ਔ ਪੁਤ੍ਰ, ਇਸਤ੍ਰੀ ਆਦਿਕੋਂ ਕਾ ਮੋਹ ਬੰਧਨ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਂ, ਪਿਉ, ਪੁੱਤਰ, ਇਸਤ੍ਰੀ (ਆਦਿਕ ਸੰਬੰਧੀ) ਮਾਇਆ ਦੇ ਮੋਹ ਦੀਆਂ ਫਾਹੀਆਂ ਪਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਤ = ਮਾਂ। ਸੁਤ = ਪੁੱਤਰ। ਬਨਿਤਾ = ਇਸਤ੍ਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Madre, padre, hijos y esposa sólo nos amarran al mundo,"