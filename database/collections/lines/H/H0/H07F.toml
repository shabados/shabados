[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਸੁਨਿ ਹੈ ਗੁਨ ਸ︀ਯਾਮ ਜੂ ਕੇ ਫੁਨਿ ਅਉਰਨ ਤੇ ਅਰੁ ਆਪਨ ਗੈ ਹੈ ॥"
page = 523

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He, who will listen to the praises of Krishna from others and also sing himself"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਕ੍ਰਿਸ਼ਨ ਜੀ ਦੇ ਗੁਣ ਹੋਰਾਂ ਤੋਂ ਸੁਣਦਾ ਹੈ ਅਤੇ ਫਿਰ ਆਪ ਗਾਉਂਦਾ ਹੈ।"