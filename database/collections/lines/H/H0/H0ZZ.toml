[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ ਕੇ; ਸਗਲੇ ਠਾਉ ॥"
page = 275
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the places belong to the Supreme Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਥਾਵਾਂ ਸ਼੍ਰੋਮਣੀ ਸਾਹਿਬ ਦੀਆਂ ਮਲਕੀਅਤ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All places belong to the Supreme Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪਾਰਬ੍ਰਹਮ ਕੇ ਹੀ ਸਰਬ ਅਸਥਾਨ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਥਾਂ (ਸਰੀਰ-ਰੂਪ ਘਰ) ਅਕਾਲ ਪੁਰਖ ਦੇ ਹੀ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲੇ = ਸਾਰੇ। ਠਾਉ = ਥਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos los lugares y sus moradores pertenecen a Dios."