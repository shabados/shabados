[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਜੈਸਾ. ਨਾਹੀ ਕੋ ਦੇਵ ॥"
page = 1142
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is no deity equal to my Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਗੁਰਾਂ ਦੇ ਤੁੱਲ ਕੋਈ ਦੇਵਤਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no deity equal to the Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਸਮਾਨ ਹੋਰ ਕੋਈ ਦੇਵਤਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਵਰਗਾ ਹੋਰ ਕੋਈ ਦੇਵਤਾ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋ = ਕੋਈ। ਦੇਵ = ਦੇਵਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No hay Dios igual a mi Guru, mi Dios."