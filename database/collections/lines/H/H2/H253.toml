[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤਨ ਕੀ ਮਹਿਮਾ; ਕਵਨ ਵਖਾਨਉ ॥"
page = 181
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What glories of the Saints can I describe?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਦੀਆਂ ਬਜੂਰਗੀਆਂ ਮੈਂ ਕਿਹੜੀਆਂ ਕਿਹੜੀਆਂ ਬਿਆਨ ਕਰ ਸਕਦਾ ਹਾਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How can I describe the Glories of the Saints?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਸੰਤ ਜਨੋਂ ਕੀ ਉਪਮਾ ਕਿਸ ਪ੍ਰਕਾਰ ਕਹੁੰ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪੂਰੇ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਣ ਵਾਲੇ ਉਹਨਾਂ) ਸੰਤ ਜਨਾਂ ਦੀ ਮੈਂ ਕੇਹੜੀ ਵਡਿਆਈ ਬਿਆਨ ਕਰਾਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਖਾਨਉ = ਵਖਾਨਉਂ, ਮੈਂ ਬਿਆਨ ਕਰਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De tal Santo, no se llega a expresar toda su Alabanza;"