data = "ਕਿੰਨਰ, ਯਕਸ਼, ਸੱਪ, ਗਣ, ਨਰ, ਮੁਨੀ, ਦੇਵਤੇ ਅਤੇ ਦੈਂਤ (ਆਦਿ ਵਿਚੋਂ ਕੋਈ ਵੀ)"