data = "ਕਿੰਨਰ ਜਛ ਭੁਜੰਗ ਗਨ; ਨਰ ਮੁਨਿ ਦੇਵ ਅਦੇਵ ॥"
page = 891

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Kinnar, Jachh, Bhujang, Gann, Humans and Ascetics, all types of gods,"

