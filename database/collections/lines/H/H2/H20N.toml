[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦਾ ਸਦਾ; ਇਹੁ ਭੂਲਨਹਾਰੁ ॥"
page = 267
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever and ever, this man errs."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਮੇਸ਼ਾਂ ਹਮੇਸ਼ਾਂ ਹੀ ਇਹ ਬੰਦਾ ਗਲਤੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forever and ever, this person makes mistakes;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਬੇਨਤੀ ਕਰੇ: ਹੇ ਹਰੀ! ਇਹ ਜੀਵ ਤੌ ਆਗੇ ਪੀਛੇ ਸਦਾ ਹੀ ਭੂਲਣੇ ਹਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਕੇਹੜਾ ਕੇਹੜਾ ਔਗੁਣ ਚਿਤਾਰੀਏ?) ਇਹ ਜੀਵ (ਤਾਂ) ਸਦਾ ਹੀ ਭੁੱਲਾਂ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਹੁ = ਇਹ (ਜੀਵ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por siempre esta persona esta en error."