[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਗੁਰਮੁਖਿ. ਆਪੇ ਦੇਵੈ; ਆਪੇ ਕਰਿ ਕਰਿ ਵੇਖੈ ॥"
page = 1235
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself blesses with His meditation and creating the creation, Himself beholds it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਮੁਖੀ ਗੁਰੂ ਹੈ, ਆਪ ਹੀ ਆਪਣਾ ਸਿਮਰਨ ਬਖਸ਼ਦਾ ਹੈ ਅਤੇ ਰਚਨਾ ਨੂੰ ਰਚ ਕੇ ਆਪ ਸਹਸੀ ਇਸ ਨੂੰ ਦੇਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is the Gurmukh, and He Himself gives; He Himself creates and beholds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪੇ (ਮੁਖਿ) ਰੂਪ ਗੁਰੂ ਹੋ ਕਰ ਜਗਿਆਸੀ ਕੋ ਆਪ ਹੀ ਉਪਦੇਸ਼ ਦੇਵੈ ਹੈ, ਆਪੇ ਰਚਨਾ ਕੋ ਕਰ ਕਰ ਦੇਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਹੀ (ਜੀਵ ਨੂੰ) ਗੁਰੂ ਦੀ ਸਰਨ ਪਾ ਕੇ ਆਪ ਹੀ (ਆਪਣੇ ਨਾਮ ਦੀ ਦਾਤਿ) ਦੇਂਦਾ ਹੈ, ਆਪ ਹੀ (ਇਹ ਸਾਰਾ ਤਮਾਸ਼ਾ) ਕਰ ਕਰ ਕੇ ਵੇਖਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੇ ਸਨਮੁਖ। ਕਰਿ = ਕਰ ਕੇ। ਆਪੇ = ਆਪ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios Mismo es el Guru, Él de Sí Mismo ve todo y bendice todo."