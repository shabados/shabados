[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮ ਤੇਰੈ ਕੈ ਰੰਗਿ; ਦੁਰਮਤਿ ਧੋਵਣਾ ॥"
page = 523
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With the love of Thy Name, I wash off my evil intellect."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੈਡੇ ਨਾਮ ਦੀ ਪ੍ਰੀਤ ਨਾਲ, ਮੈਂ ਆਪਣੀ ਖੋਟੀ ਬੁੱਧੀ ਨੂੰ ਧੋਦਾਂ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With the Love of Your Name, I wash away my evil-mindedness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਨਾਮ ਕੇ ਪਰੇਮ ਕਰ ਕੇ ਅਪਨੀ ਦੁਰਮਤਿ ਮੈਲ ਕੋ ਧੋਨਾ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੀਵ ਤੇਰੇ ਨਾਮ ਦੇ ਪਿਆਰ ਵਿਚ (ਰਹਿੰਦੇ) ਹਨ ਉਹ ਭੈੜੀ ਮੱਤ ਧੋ ਲੈਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੰਗਿ = ਪਿਆਰ ਵਿਚ। ਦੁਰਮਤਿ = ਭੈੜੀ ਮੱਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con el Amor de Tu Nombre, lavo toda mi maldad,"