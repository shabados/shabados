[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਮੁ ਕ੍ਰੋਧੁ ਲੋਭੁ ਤਿਆਗੁ ॥"
page = 408
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Abandon lust, wrath and avarice,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭੋਗ ਬਿਲਾਸ, ਰੋਹ ਅਤੇ ਤਮ੍ਹਾ ਨੂੰ ਛੱਡ ਦੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Renounce sexual desire, anger and greed;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਾਮ ਕ੍ਰੋਧ ਲੋਭ ਕਾ ਤਿਆਗ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਾਮ ਕ੍ਰੋਧ ਅਤੇ ਲੋਭ ਦੂਰ ਕਰ ਲੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਆਗੁ = ਛੱਡ ਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Abandona ya tu lujuria, enojo y avaricia"