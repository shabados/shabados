[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਨੇਤ੍ਰਾ; ਕਹਾ ਕੋ ਪੇਖੈ ॥"
page = 1140
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the eyes, how can any one see?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੱਖਾਂ ਦੇ ਬਿਨਾਂ ਕੋਈ ਜਣਾ ਕਿਸ ਤਰ੍ਹਾਂ ਵੇਖ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without eyes, how can anyone see?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨੇਤ੍ਰੋਂ ਸੇ ਬਿਨਾਂ ਕਹਾਂ ਕੋਈ ਦੇਖ ਸਕਤਾ ਹੈ, ਭਾਵ ਕੋਈ ਭੀ ਦੇਖ ਨਹੀਂ ਸਕਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅੱਖਾਂ ਤੋਂ ਬਿਨਾ ਕੋਈ ਵੇਖ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੇਖੈ = ਵੇਖ ਸਕਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Quién podría ver sin ojos?"