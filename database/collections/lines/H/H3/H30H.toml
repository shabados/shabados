[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਵਨ ਪਦਵੀ, ਹਰਿ ਕਾ ਨਾਉ ॥"
page = 744
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Lord Name immortal status is obtained,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਨਾਮ ਰਾਹੀਂ ਅਬਿਨਾਸ਼ੀ ਦਰਜਾ ਪਰਾਪਤ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The immortal status is obtained through the Name of the Lord;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਜੀਵਨ ਪਦਵੀ) ਮੋਖਦਾਤਾ ਹਰੀ ਕਾ ਨਾਮ ਜਾਣਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ (ਹੀ) ਆਤਮਕ ਜ਼ਿੰਦਗੀ ਦਾ ਪਿਆਰ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਦਵੀ = ਦਰਜਾ, ਪਿਆਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por la Gracia del Nombre del Señor se purifican el cuerpo,"