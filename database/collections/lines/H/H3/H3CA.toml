[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਣਮੜਿਆ ਮੰਦਲੁ ਬਾਜੈ ॥"
page = 657
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The unskinned drum plays."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੰਮ ਨਾਲ ਨਾਂ ਮੜਿ੍ਹਆ ਹੋਇਆ ਢੋਲ ਵੱਜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The skinless drum plays."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੰਸਾਰ ਰੂਪੀ ਜੋ (ਮੰਦਲ) ਢੋਲ ਹੈ ਤਿਸ ਮੇਂ ਜਿਨ ਸੰਤੋਂ ਕਾ ਮਨ ਮੜਿਆ ਨਹੀਂ ਅਰਥਾਤ ਖੈਂਚਿਆ ਨਹੀਂ ਗਿਆ, ਸੋ ਨਾਮ ਕੋ (ਬਾਜੈ) ਉਚਾਰਨ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਮਨੁੱਖ ਦੇ ਅੰਦਰ) ਢੋਲ ਵੱਜਣ ਲੱਗ ਪੈਂਦਾ ਹੈ (ਪਰ ਉਹ ਢੋਲ ਖੱਲ ਨਾਲ) ਮੜ੍ਹਿਆ ਹੋਇਆ ਨਹੀਂ ਹੁੰਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਦਲੁ = ਢੋਲ। ਬਾਜੈ = ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En la mente despierta,"