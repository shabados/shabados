[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਤਨ ਲਾਲ; ਜਾ ਕਾ. ਕਛੂ ਨ ਮੋਲੁ ॥"
page = 186
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Brimful with the priceless emeralds and jewels,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਣਮੁੱਲ ਮਾਣਕਾ ਅਤੇ ਜਵੇਹਰਾ ਨਾਲ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The storehouse is inexhaustible and immeasurable,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਰਤਨ) ਵੈਰਾਗ (ਲਾਲ) ਪ੍ਰੇਮ ਜਿਨ ਕਾ ਕੁਛ ਮੋਲ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਖ਼ਜ਼ਾਨੇ ਵਿਚ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੇ ਅਮੋਲਕ ਰਤਨਾਂ ਲਾਲਾਂ ਦੇ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕਾ = ਜਿਨ੍ਹਾਂ ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No se podría pagar ni con rubíes ni con perlas;"