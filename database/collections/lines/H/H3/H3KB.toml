[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਕਿਛੁ ਜਾਣੈ ਸਿਰਜਣਹਾਰੁ ॥੩॥"
page = 1139
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Creator-Lord knows all the things."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਰਤਾਰ-ਸੁਆਮੀ ਸਾਰੀਆਂ ਗੱਲਾਂ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator Lord knows everything. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ (ਸਿਰਜਣਹਾਰੁ) ਸ੍ਰਿਸ੍ਟੀ ਕੇ ਰਚਨੇ ਵਾਲਾ ਵਾਹਗੁਰੂ ਸਭ ਕਿਛੁ ਜਾਣ ਰਹਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵਾਂ ਨੂੰ ਪੈਦਾ ਕਰਨ ਵਾਲਾ ਉਹ ਪ੍ਰਭੂ ਸਭ ਕੁਝ ਜਾਣਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues nuestro Dios conoce todo lo que se debe conocer. (3)"