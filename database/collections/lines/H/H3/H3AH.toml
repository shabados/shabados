[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਲੇ ਬਾਰਿਬੇ ਬਾਰ ਕੋ ਜਿਉ ਭਭੂਕੇ ॥"
page = 63

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the great warriors marched forward with great ire like a flame over a fence of dry weeds."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਵਾੜ ਨੂੰ ਸਾੜਨ ਲਈ ਅੱਗ ਦੇ ਅਲੰਬੇ ਚਲੇ ਹਨ।"