[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਪ੍ਰਭੁ ਜਾਣੀਐ; ਸਦ ਸੰਗਿ ॥"
page = 405
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Deem that Lord to be ever with thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਸੁਆਮੀ ਨੂੰ ਤੂੰ ਹਮੇਸ਼ਾਂ ਆਪਣੇ ਨਾਲ ਖਿਆਲ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Know that God is always with you."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸੋ ਪ੍ਰਭੂ ਕੋ ਸਦਾ ਸੰਗ ਜਾਨੀਐ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਵਿਚੋਂ ਆਪਣੀ ਜੀਵਨ-ਬੇੜੀ ਸਹੀ-ਸਲਾਮਤ ਪਾਰ ਲੰਘਾਣੀ ਹੈ, ਤਾਂ) ਉਸ ਪਰਮਾਤਮਾ ਨੂੰ ਸਦਾ ਆਪਣੇ ਅੰਗ-ਸੰਗ ਵੱਸਦਾ ਸਮਝਣਾ ਚਾਹੀਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਣੀਐ = ਸਮਝਣਾ ਚਾਹੀਦਾ ਹੈ। ਸਦ = ਦਸਾ। ਸੰਗਿ = ਅੰਗ ਸੰਗ ਵੱਸਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ve siempre la Presencia del Señor dentro de ti,"