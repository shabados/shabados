[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਬਹੂ. ਨ ਸਮਝੈ; ਅਗਿਆਨੁ ਗਵਾਰਾ ॥"
page = 738
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The ignorant clown understands not ever."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਵਕੂਫ ਵਹਿਸ਼ੀ ਕਦੇ ਭੀ ਸੋਝੀ ਨਹੀਂ ਫੜਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The ignorant clown will never understand."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹ ਐਸਾ ਗਿਆਨ ਕਰ ਕੇ (ਗਵਾਰਾ) ਮੂਰਖ ਹੋਇਆ ਹੈ, ਕਬੀ ਭੀ ਨਹੀਂ ਸਮਝਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੂਝ ਤੋਂ ਸੱਖਣਾ ਮੂਰਖ ਮਨੁੱਖ (ਆਪਣੇ ਅਸਲ ਭਲੇ ਦੀ ਗੱਲ) ਕਦੇ ਭੀ ਨਹੀਂ ਸਮਝਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਿਆਨੁ = ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੂਝ ਤੋਂ ਸੱਖਣਾ। ਗਵਾਰਾ = ਮੂਰਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ese ser que de sabio no tiene nada, nunca conocerá la Sabiduría del Señor,"