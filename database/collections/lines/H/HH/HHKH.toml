data = "ਜਰਉ ਲਾਗਿ ਪਹਿ ਹੋਊਾਂ ਮਸਾਨਾ ॥"
page = 285

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Bring wood for me so that I may get myself reduced to ashes with my husband.”"

