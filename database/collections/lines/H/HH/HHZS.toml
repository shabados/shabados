[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਮਰੀ ਕ੍ਰਿਪਾ ਤੇ; ਤੁਧੁ ਪਛਾਣਾ ॥"
page = 103
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Thy grace do I understand Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਦਇਆਲਤਾ ਰਾਹੀਂ ਮੈਂ ਤੈਨੂੰ ਸਮਝਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Your Grace, I recognize You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੁਮਰੀ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਹੀ ਤੇਰੇ ਕੋ ਪਛਾਨਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਤੇਰੀ ਮਿਹਰ ਨਾਲ ਹੀ ਮੈਂ ਤੇਰੇ ਨਾਲ ਡੂੰਘੀ ਸਾਂਝ ਪਾ ਸਕਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ, ਨਾਲ। ਤੁਧੁ = ਤੈਨੂੰ। ਪਛਾਣਾ = ਮੈਂ ਪਛਾਣਦਾ ਹਾਂ, ਮੈਂ ਸਾਂਝ ਪਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por Tu Gracia solamente Te conozco;"