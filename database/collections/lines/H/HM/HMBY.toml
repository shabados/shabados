[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਨੑ ਕੈ ਸੰਗਿ; ਤੂ ਹੋਈ ਹੈ ਜਾਹਰਿ ॥"
page = 390
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With it thou didst become distinguished."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨਾਲ ਤੂੰ ਨਾਮਵਰ ਹੋਈ ਸੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "with that, you are respected."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਸ ਕੇ ਸੰਗ ਕਰ ਕੇ ਤੂੰ ਸਰਬਤ੍ਰ ਪ੍ਰਗਟ ਹੋ ਰਹੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵਾਤਮਾ ਦੇ ਨਾਲ ਹੁੰਦਿਆਂ (ਹਰ ਥਾਂ) ਤੂੰ ਉਜਾਗਰ ਹੁੰਦੀ ਹੈਂ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y te vuelves manifiesta en el mundo."