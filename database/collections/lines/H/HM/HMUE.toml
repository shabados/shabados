data = "ਪਲਕ ਏਕ ਲਾਗੀ ਨਹੀ; ਤਹਾ ਪਹੂਚੈ ਆਨਿ ॥੧੯॥"
page = 991

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Early next morning, she re-organised her army and rapjdly arrived there.(19)"

