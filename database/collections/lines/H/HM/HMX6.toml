[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਢਲ ਹਲੰ ਢਲੰ ਉਛਾਲੰ ॥੧੧੮॥"
page = 211

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There were war-cries in the battlefield and the warriors, being pleased began to hurl their shields up and down.118."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਯੋਧੇ) ਢਾਲਾਂ ਨਾਲ (ਇਕ ਦੂਜੇ ਨੂੰ) ਧੱਕਦੇ ਅਤੇ ਢਾਲਾਂ ਨੂੰ ਉਛਾਲਦੇ ਸਨ ॥੧੧੮॥"