[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever devoted unto his True Guru is"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਮੇਸ਼ਾਂ ਆਪਣੇ ਸੱਚੇ ਗੁਰਾਂ ਉਤੋਂ ਸਦਕੇ ਜਾਂਦਾ ਹੈ"

[[content]]
assets = ["DSSK"]
type = "translation"
