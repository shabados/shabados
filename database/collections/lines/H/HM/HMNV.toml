[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਵਗੁਣ ਸਹਿ ਗੁਣੁ ਕਰੈ, ਘੋਲਿ ਘੁਮਾਇਆ ॥੧੨॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "I am sacrifice unto him who does good in return of evil."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅਵਗੁਣ ਸਹਾਰਕੇ ਉਪਕਾਰ ਕਰੇ (ਉਸ ਉਪਰੋਂ ਅਸੀਂ) ਬਲਿਹਾਰ ਜਾਂਦੇ ਹਾਂ।"