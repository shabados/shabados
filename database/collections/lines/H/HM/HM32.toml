[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਉ ਗੁਰਦੇਉ; ਤ ਸੰਸਾ ਟੂਟੈ ॥"
page = 1167
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Guru-God is merciful, then man's doubt is dispelled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਗੁਰੂ-ਪ੍ਰਮੇਸ਼ਰ ਦਇਆਲ ਹੋ ਜਾਂਦੇ ਹਨ ਤਾਂ ਜੀਵ ਦਾ ਭਰਮ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Divine Guru grants His Grace, skepticism is shattered."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਗੁਰਦੇਵ ਦਯਾਲ ਹੂਏ ਤਬ ਸੰਸਾ (ਟੂਟੇ), ਭਾਵ ਨਿਬ੍ਰਿਤ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਗੁਰੂ ਮਿਲ ਪਏ ਤਾਂ ਦਿਲ ਦੇ ਸੰਸੇ ਮਿਟ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el Guru nos muestra su Compasión, la duda de uno es destruida."