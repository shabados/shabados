[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੋਇ ਹਲਾਲੁ; ਲਗੈ ਹਕਿ ਜਾਇ ॥"
page = 956
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who is slaughtered thus, gets attached to the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਐਕਰ ਜ਼ਿਬ੍ਹਾ ਹੋਇਆ ਹੋਇਆ ਹੈ ਉਹ ਸੱਚੇ ਸਾਈਂ ਨਾਲ ਜੁੜ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who is slaughtered in this ritualistic way, will be attached to the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਹਕਿ) ਸਚ ਰੂਪ ਪਰਮੇਸ੍ਵਰ ਮੇਂ ਜਾਇ ਲਾਗਤਾ ਹੈ। ਜੇ ਇਸ ਪਰਕਾਰ ਜੀਵ ਹਲਾਲ ਹੋਵੈ, ਭਾਵ ਪੂਰਬੋਕਤ ਪ੍ਰਕਾਰ ਸਾਧਨ ਸਪੰਨ ਹੋਇ ਤੌ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਹਲਾਲ ਹੋ ਕੇ (ਕੁੱਠਾ ਜਾ ਕੇ) ਉਹ ਪ੍ਰਭੂ ਵਿਚ ਜੁੜਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਕਿ = ਹੱਕ ਵਿਚ, ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਰੱਬ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así la vida de ese ser se llenará de satisfacción y vivirá apegado a Dios,"