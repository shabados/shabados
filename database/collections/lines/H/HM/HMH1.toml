[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁ ਕ੍ਰੋਧ ਸਾਗ ਤੀਛਣੰ ਕਿ ਤਾਕਿ ਸਤ੍ਰੁ ਲਾਵਹੀਂ ॥"
page = 594

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors, getting bedecked, fell on the direction of the opponents and striking sharp lances on the enemies"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੀਖਣ ਸਾਂਗਾਂ ਲੈ ਕੇ ਵੈਰੀ ਦਾ ਨਿਸ਼ਾਣਾ ਬੰਨ੍ਹ ਕੇ ਮਾਰ ਦਿੰਦੇ ਹਨ।"