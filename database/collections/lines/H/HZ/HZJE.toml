[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿ ਏ ਸ਼ਾਹ ਸ਼ਾਹਾਨ, ਰਉਸ਼ਨ ਜ਼ਮਾ ॥੩੨॥"
page = 1401

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(Who pleaded,) ‘Oh you the brilliant one,(32)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੇ ਜਾ ਕੇ ਕਿਹਾ) ਹੇ ਬਾਦਸ਼ਾਹਾਂ ਦੇ ਬਾਦਸ਼ਾਹ ਅਤੇ ਜ਼ਮਾਨੇ ਵਿਚ ਪ੍ਰਕਾਸ਼ਮਾਨ (ਰਾਜੇ!) ॥੩੨॥"