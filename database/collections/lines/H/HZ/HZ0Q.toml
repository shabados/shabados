[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਖਿ ਨੈਕੁ ਪ੍ਰਭਾ ਸਜਨੀ ਸਭ ਹੀ; ਇਹ ਭਾਤਿ ਰਹੀਅਤਿ ਰੀਸਿ ਮਨੈ ॥੧੫॥"
page = 962

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Beholding all this, all her friends got envious in their minds.(15)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਪ੍ਰਭਾ ਨੂੰ ਕੁਝ ਕੁ ਵੇਖ ਕੇ ਸਾਰੀਆਂ ਸਖੀਆਂ ਮਨ ਵਿਚ ਇਸ ਤਰ੍ਹਾਂ ਰੀਸ ਕਰਨ ਲਗੀਆਂ ॥੧੫॥"