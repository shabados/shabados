[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਬ ਹਰਖ ਸੋਗ; ਕਹੁ. ਕਿਸਹਿ ਬਿਆਪਤ ॥"
page = 290
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "say, who then was affected by joy and sorrow?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਸੋ ਉਦੋਂ ਖੁਸ਼ੀ ਤੇ ਗਮੀ ਕਿਸ ਨੂੰ ਵਾਪਰਦੀ ਸੀ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then who experienced joy and sorrow?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਹਰਖ ਔ ਸੋਕ ਕਹੁ ਤੌ ਕਿਸ ਕੋ ਵਿਆਪਤਾ ਅਰਥਾਤ ਕਿਸੀ ਕੋ ਨ ਵਿਆਪਤਾ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਦੱਸੋ ਖ਼ੁਸ਼ੀ ਜਾਂ ਚਿੰਤਾ ਕਿਸ ਨੂੰ ਪੋਹ ਸਕਦੇ ਸਨ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਖ = ਖ਼ੁਸ਼ੀ। ਸੋਗ = ਚਿੰਤਾ। ਬਿਆਪਤ = ਪੋਹ ਸਕਦਾ ਸੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿quién podía sentir tristeza o alegría?"