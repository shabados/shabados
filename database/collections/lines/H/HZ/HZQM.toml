[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਬਲਿਹਾਰੀ; ਸਤਿਗੁਰ ਪੂਰੇ ॥"
page = 99
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am a sacrifice unto the perfect True Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਪੂਰਨ ਸੱਚੇ ਗੁਰਾਂ ਉਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to the Perfect True Guru,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਤਿਗੁਰ ਪੂਰੇ ਪਰ ਬਲਿਹਾਰ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਪੂਰੇ ਸਤਿਗੁਰੂ ਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਲਿਹਾਰੀ = ਕੁਰਬਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi ser en sacrificio a mi Guru Perfecto,"