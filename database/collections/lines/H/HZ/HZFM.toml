[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਖੀਂ ਦੇਖੈ ਰੂਪ ਰੰਗੁ; ਸਬਦ ਸੁਰਤਿ ਮੁਹਿ ਕੰਨ ਸਰਿਸੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Man beholds form and colour through eyes and through mouth and ears he speaks and listens to the Word respectively."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅੱਖਾਂ ਰੂਪ ਰੰਗ ਦੇਖਦੀਆਂ ਹਨ, ਮੂੰਹੋਂ ਸ਼ਬਦ (ਬੋਲਣ ਦੀ ਕੰਨੋਂ (ਸਮਝਣ ਦੀ) ਸੁਰਤ (ਗਿਆਤ) ਵਿਸ਼ੇਖ ਦਿੱਤੀ ਹੈ।"