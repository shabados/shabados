[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚੂਕਿ ਗਈ; ਫਿਰਿ ਆਵਨ ਜਾਨੀ ॥੩॥"
page = 337
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that my coming and going, over again, have ceased."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿ ਮੇਰਾ ਮੁੜ ਕੇ ਆਉਣਾ ਤੇ ਜਾਣਾ ਮੁਕ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "my comings and goings in reincarnation have ended. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਤਿਨ ਕੀ ਆਵਨ ਜਾਨੀ ਚੁਕ ਗਈ ਹੈ; ਅਰਥਾਤ ਵਹੁ ਜਨਮ ਮਰਣ ਸੇ ਰਹਤ ਹੂਏ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਮੁੜ ਮੁੜ ਜੰਮਣਾ ਮਰਨਾ ਮੁੱਕ ਜਾਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੂਕਿ ਗਈ = ਮੁੱਕ ਜਾਂਦੀ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mis nacimientos y mis muertes han cesado para siempre."