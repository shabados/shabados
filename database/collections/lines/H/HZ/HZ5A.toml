[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ ਅਪੁਨੇ. ਸੁਨੀ ਅਰਦਾਸਿ ॥"
page = 1152
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Lord Guru, has heard my prayer,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸੱਚੇ ਗੁਰਾਂ ਨੇ ਮੇਰੀ ਬੇਨਤੀ ਸੁਣ ਲਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Guru has listened to my prayer."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਅਪੁਨੇ) ਹਮਾਰੇ ਸਤਿਗੁਰੋਂ ਨੇ ਬੇਨਤੀ ਸੁਨ ਲਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਿਆਰੇ ਗੁਰੂ ਨੇ (ਜਿਸ ਮਨੁੱਖ ਦੀ) ਬੇਨਤੀ ਸੁਣ ਲਈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰ ਅਪੁਨੇ = ਪਿਆਰੇ ਗੁਰੂ ਨੇ। ਅਰਦਾਸਿ = ਬੇਨਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mira, el Guru Verdadero escuchó mi oración"