data = "ਅਧੋ ਉਰਧ ਅਰਧੰ ਅਘੰ ਓਘ ਹਰਤਾ ॥੫੯॥"
page = 4
line = 5

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou Pervadest netherworld, heaven and space and Destroyer of inumerable sins.59."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ('ਓਘ') ਉਤਮ, ਮਧਮ ਅਤੇ ਅਧਮ ਪਾਪਾਂ ('ਅਘੰ') ਨੂੰ ਨਸ਼ਟ ਕਰਨ ਵਾਲੇ! (ਤੈਨੂੰ) ਨਮਸਕਾਰ ਹੈ ॥੫੯॥"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਅਧੋ ਉਰਧ ਅਰਧੰ; ਅਘੰ ਓਘ ਹਰਤਾ ॥੫੯॥"