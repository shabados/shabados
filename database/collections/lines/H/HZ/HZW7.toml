[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਨਹਿ ਤ ਏਕੁ. ਅਲੇਖੁ ਠਾਕੁਰੁ; ਜਿਨਹਿ ਸਭ ਕਲ ਧਾਰੀਆ ॥"
page = 248
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou adorest the One incomputable Lord, who, through His Omnipotence is giving support to all the universe."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਇਕ ਲੇਖੇ ਪੱਤੇ ਤੋਂ ਉਚੇਰੇ ਸਾਹਿਬ ਦੀ ਉਪਾਸ਼ਨਾ ਕਰਦਾ ਹੈਂ ਜੋ ਆਪਣੀ ਅਪਾਰ ਸ਼ਕਤੀ ਰਾਹੀਂ ਸਾਰੇ ਆਲਮ ਨੂੰ ਆਸਰਾ ਦੇ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You adore the One Lord, the Unknowable Lord and Master; His Power gives Support to all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੁਮ ਏਕ ਅਲੇਖ ਠਾਕਰ ਕੋ ਮਾਨਤੇ ਹੋ। ਜਿਸ ਏਕ ਨੇ ਹੀ ਸਭ ਮੇਂ ਕਲਾ ਧਾਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੋਹਨ! ਸਿਰਫ਼ ਤੈਨੂੰ ਇਕ ਨੂੰ (ਅਸਥਿਰ) ਮੰਨਦੇ ਹਨ-ਸਿਰਫ਼ ਤੈਨੂੰ-ਜਿਸ ਦਾ ਸਰੂਪ ਬਿਆਨ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ, ਜੋ ਤੂੰ ਸਭ ਦਾ ਪਾਲਣਹਾਰ ਹੈਂ, ਤੇ ਜਿਸ ਤੈਂ ਨੇ ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ ਵਿਚ ਆਪਣੀ ਸੱਤਾ ਵਰਤਾਈ ਹੋਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਨਹਿ = (ਸਾਰੇ ਜੀਵ) ਮੰਨਦੇ ਹਨ। ਰਾਲੀ = ਮਿੱਟੀ, ਨਾਸਵੰਤ। ਜਿਨਹਿ = ਜਿਸ ਨੇ। ਕਲ = ਸੱਤਾ, ਤਾਕਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú crees solamente en el Único Maestro, el Inefable,"