[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰੁ. ਸਹਜੈ ਦਾ ਖੇਤੁ ਹੈ; ਜਿਸ ਨੋ ਲਾਏ ਭਾਉ ॥"
page = 947
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Guru is the field of balanced life. He, whom the Lord makes love it,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰੂ ਜੀ ਸੰਤੁਲਿਤ ਜੀਵਨ ਦੀ ਪੈਲੀ ਹਨ। ਜਿਸ ਦੀ ਪ੍ਰੀਤ, ਪ੍ਰਭੂ ਇਸ ਨਾਲ ਪਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Guru is the field of intuitive wisdom. One who is inspired to love Him,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ (ਸਹਜੇ) ਸ਼ਾਂਤੀ ਆਦਿ ਗੁਣੋਂ ਕਾ ਅਸਥਾਨ ਹੈ ਜਿਸ ਕੋ ਪਰਮੇਸਰ ਸਤਿਗੁਰੋਂ ਮੇਂ ਭਾਉ ਲਾਏ ਸੋ ਗੁਣ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਅਡੋਲਤਾ ਤੇ ਸ਼ਾਂਤੀ ਦਾ ਖੇਤ ਹੈ, (ਪ੍ਰਭੂ) ਜਿਸ ਨੂੰ (ਇਸ ਅਡੋਲਤਾ ਦੇ ਖੇਤ ਗੁਰੂ ਨਾਲ) ਪਿਆਰ ਬਖ਼ਸ਼ਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜ = ਅਡੋਲਤਾ। ਭਾਉ = ਪਿਆਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru Verdadero es la granja de la Sabiduría Intuitiva, quien está inspirado a Amarlo"