[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਉ ਉਪਮਾ ਉਪਜੀ ਮਨ ਮੈ; ਗਜ ਸੁੰਡ ਮਨੋ ਘਰਿ ਹੀ ਧਰਿ ਆਯੋ ॥੧੫੮੯॥"
page = 456

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He ran away and it seemed that he had forgotten his trunk at home and was going to bring it.1589."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਵੀ ਦੇ) ਮਨ ਵਿਚ (ਉਸ ਦੀ) ਉਪਮਾ ਇਸ ਤਰ੍ਹਾਂ ਉਪਜੀ ਹੈ ਮਾਨੋ ਹਾਥੀ ਸੁੰਡ ਨੂੰ ਘਰ ਹੀ ਰਖ ਕੇ ਆਇਆ ਹੋਵੇ ॥੧੫੮੯॥"