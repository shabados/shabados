[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿ ਸਤਿ ਸਤਿ; ਸਤਿ ਸਤਿ ਗੁਰਦੇਵ ॥"
page = 1166
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True, true, true, true, true is the Divine Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ, ਸੱਚੇ, ਸੱਚੇ, ਸੱਚੇ, ਸੱਚੇ ਹਨ ਰੱਬ ਰੂਪ ਗੁਰੂ ਜੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True, True, True True, True is the Divine Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚਾਰੋਂ ਜੁਗੋਂ ਮੇਂ ਸਤਿਗੁਰ ਦੇਵ ਸ੍ਵਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਯਕੀਨ ਜਾਣੋ ਕਿ ਗੁਰੂ ਦੀ ਸੇਵਾ ਹੀ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਉੱਦਮ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੀ। ਗੁਰਦੇਵ = ਗੁਰੂ (ਦੀ ਸੇਵਾ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, Verdadero, Verdadero, siempre Verdadero es el Guru,"