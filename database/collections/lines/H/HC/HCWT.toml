[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਬਿਨੁ ਅਵਰੁ. ਨ ਕੋਈ ਦਾਤਾ; ਹਰਿ ਤਿਸਹਿ ਸਰੇਵਹੁ ਪ੍ਰਾਣੀ ਹੇ ॥੧॥"
page = 1070
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without Him, there is no other Giver. That Lord, worship ye, O Mortals."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਬਗ਼ੈਰ, ਹੋਰ ਕੋਈ ਦਾਤਾਰ ਨਹੀਂ। ਉਸ ਸੁਆਮੀ ਦੀ ਤੁਸੀਂ ਉਪਾਸ਼ਨਾ ਕਰੋ, ਹੇ ਫ਼ਾਨੀ ਬੰਦਿਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no other Giver except Him; worship the Lord, O mortals. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਬਿਨਾਂ ਜੀਵੋਂ ਕਾ ਦਾਤਾ ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੈ, ਤਾਂ ਤੇ ਹੇ ਪ੍ਰਾਣੀਓਂ! ਤਿਸੀ ਹਰੀ ਕੋ ਸੇਵੋ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਤੋਂ ਬਿਨਾ ਹੋਰ ਕੋਈ ਦਾਤਾ ਨਹੀਂ ਹੈ। ਹੇ ਪ੍ਰਾਣੀ! ਉਸੇ ਪਰਮਾਤਮਾ ਦਾ ਸਿਮਰਨ ਕਰਿਆ ਕਰੋ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸਹਿ = ਤਿਸੁ ਹੀ {ਕ੍ਰਿਆ ਵਿਸ਼ੇਸ਼ਣ 'ਹੀ' ਦੇ ਕਾਰਨ ਲਫ਼ਜ਼ 'ਤਿਸੁ' ਦਾ (ੁ) ਉਡ ਗਿਆ ਹੈ}। ਸਰੇਵਹੁ = ਸਿਮਰੋ। ਪ੍ਰਾਣੀ = ਹੇ ਪ੍ਰਾਣੀ! ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No hay otro Dios Benévolo, así que contémplalo sólo a Él. (1)"