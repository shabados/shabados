data = "ਉਭੈ ਜੀਤ ਚਾਹੈ ॥੨੯੫॥"
page = 580

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors are engaged like wrestlers among themselves and striking their weapons they are desiring for their victory.295."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਵੇਂ (ਆਪਣੀ ਆਪਣੀ) ਜਿਤ ਚਾਹੁੰਦੇ ਹਨ ॥੨੯੫॥"