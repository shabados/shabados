[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਕੀਜੈ; ਸੋ ਬੰਧਨੁ ਪੈਰੇ ॥"
page = 1075
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever he does, that proves fetters For His feet,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁੱਛ ਭੀ ਉਹ ਕਰਦਾ ਹੈ, ਉਹ ਉਸ ਦੇ ਪੈਰਾਂ ਲਈ ਬੇੜੀਆਂ ਸਾਬਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Only serves to tie your feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕਰਤੇ ਰਹੇ ਸੋ ਬੁਧੀ ਰੂਪ ਪੈਰ ਕੋ ਬੰਧ ਨਹੀਂ ਪੜੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਭੀ ਅਜਿਹਾ ਕਰਮ ਕੀਤਾ ਜਾਂਦਾ ਹੈ, ਉਹ ਇਸ ਜੀਵਨ-ਸਫ਼ਰ ਵਿਚ ਮਨੁੱਖ ਦੇ ਪੈਰਾਂ ਵਿਚ ਫਾਹੀ ਬਣਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋ = ਜਿਹੜਾ (ਭੀ ਕਰਮ)। ਕੀਜੈ = ਕੀਤਾ ਜਾਏ। ਬੰਧਨੁ = ਫਾਹੀ। ਪੈਰੇ = ਪੈਰਾਂ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "más se involucra,"