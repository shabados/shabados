[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਸਾਖੀ ਕਾ ਉਜੀਆਰਾ ॥"
page = 599
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With the light of the Guru's instruction,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਦੇ ਪ੍ਰਕਾਸ਼ ਦੇ ਨਾਲ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Light of the Guru's Teachings dawned,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਪ੍ਰਕਾਰ ਜਬ ਗੁਰ ਸਿਖ੍ਯਾ ਕਾ ਚਾਨਣ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ (ਮਨੁੱਖ ਦੇ ਅੰਦਰ) ਗੁਰੂ ਦੇ ਉਪਦੇਸ਼ ਦਾ (ਆਤਮਕ) ਚਾਨਣ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਜੀਆਰਾ = ਚਾਨਣ (ਆਤਮਕ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando la Palabra del Shabd del Guru ilumina la mente,"