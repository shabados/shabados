[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਸਨਾ ਜਪਿ ਜਪਿ ਜੀਵੈ ਸੁਆਮੀ ॥"
page = 107
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The tongue is alive by ever uttering the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਨਾਮ ਦਾ ਸਦਾ ਉਚਾਰਣ ਕਰਕੇ ਜੀਭਾ ਜੀਊਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The tongue lives by chanting and meditating on the Lord's Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਜਿਹਵਾ ਤੇਰਾ ਨਾਮੁ ਜਪ ਜਪ ਕੇ ਜੀਵੇ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇਰਾ ਸੇਵਕ ਤੇਰਾ ਨਾਮ ਆਪਣੀ) ਜੀਭ ਨਾਲ ਜਪ ਜਪ ਕੇ ਆਤਮਕ ਜੀਵਨ ਹਾਸਲ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸਨਾ = ਜੀਭ (ਨਾਲ)। ਜਪਿ ਜਪਿ = ਮੁੜ ਮੁੜ ਜਪ ਕੇ। ਜੀਵੈ = (ਮਨੁੱਖ) ਆਤਮਕ ਜੀਵਨ ਹਾਸਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los labios se avivan pronunciando el Nombre del Maestro."