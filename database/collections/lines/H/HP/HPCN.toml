[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਇਹੁ ਬਿਨਸੈ; ਨਾ ਇਹੁ ਜਾਇ ॥"
page = 868
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He neither perishes, nor departs He."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਂ ਉਹ ਨਾਸ ਹੁੰਦਾ ਹੈ ਨਾਂ ਹੀ ਉਹ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He does not die; He does not go away."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾ ਇਹੁ ਮਰਤਾ ਹੈ ਨ ਜਨਮਤਾ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਐਸਾ ਹੈ ਕਿ) ਨਾਹ ਇਹ ਕਦੇ ਮਰਦਾ ਹੈ ਨਾਹ ਜੰਮਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਇ = ਜੰਮਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No puede ser destruida ni se va a ningún lado,"