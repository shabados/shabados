[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਹ ਗਹਤ ਪ੍ਰੇਤ ਮਸਾਣਯੰ ॥੧੧॥੧੩੩॥"
page = 110

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The arrows and swords are waving in the wind and the ghosts and evil spirits are catching the dead.11.133."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪ੍ਰੇਤ ਮੁਰਦਿਆਂ ('ਮਸਾਣ') ਨੂੰ ਪਕੜ ਪਕੜ ਕੇ ਛਕਦੇ ('ਗਹਤ') ਸਨ ॥੧੧॥੧੩੩॥"