[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਸਕਲ ਤੁਪਕ ਕੇ ਨਾਮ; ਸੁਬੁਧਿ, ਲਹਿ ਲੀਜੀਐ ॥੧੦੨੨॥"
page = 781

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the words “taaraagrahneesh-bhagini”, add the words “Satchar-naath-shatru” and know wisely all the names of Tupak.1122."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਨੂੰ ਬੁੱਧੀਮਾਨੋ, ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝ ਲਵੋ ॥੧੦੨੨॥"