[[content]]
assets = ["DGDG", "DDTK"]
type = "primary"
data = "ਬੇਦ ਪੁਰਾਨ ਕਤੇਬ ਕੁਰਾਨ; ਹਸੇਬ ਥਕੇ ਕਰ ਹਾਥ ਨ ਆਏ ॥"
page = 37

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Vedas, Puranas, Katebs and the Quran have tired of giving His account, but the Lord could not be comprehended."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵੇਦ, ਪੁਰਾਣ, ਕਤੇਬ, ਕੁਰਾਨ ਆਦਿ (ਧਰਮ ਪੁਸਤਕਾਂ) ਬਹੁਤ ਗਿਣਤੀ-ਮਿਣਤੀ ਕਰਦੀਆਂ (ਹਿਸਾਬ ਲਗਾਉਂਦੀਆਂ) ਹਾਰ ਗਈਆਂ, ਪਰ (ਉਨ੍ਹਾਂ ਦੇ) ਹੱਥ ਕੁਝ ਨਾ ਆਇਆ।"

