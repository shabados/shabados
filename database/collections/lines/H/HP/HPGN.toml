data = "ਬਕਿੰਗਸ਼ ਦਰ ਆਮਦ ਦਿਰੰਗਸ਼ ਗਿਰਿਫ਼ਤ ॥"
page = 1398

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He came in the court, pondered over thoroughly,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸਾਰੇ ਵਜ਼ੀਰ) ਗਿਣਤੀ ਮਿਣਤੀ ਵਿਚ ਪੈ ਗਏ ਅਤੇ (ਜਵਾਬ ਦੇਣ ਵਿਚ) ਦੇਰ ਹੋ ਗਈ।"