[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਧਿਕਾ ਚੰਦ੍ਰਭਗਾ ਮੁਖਿ ਚੰਦ; ਲਏ ਜਹ ਗ੍ਵਾਰਿਨ ਥੀ ਸੰਗ ਤੀਨੋ ॥"
page = 357

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There are Radha, Chandarmukhi and Chandarbhaga, the three gopis"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਧਾ, ਚੰਦ੍ਰਭਗਾ ਅਤੇ ਚੰਦ੍ਰਮੁਖੀ (ਨਾਂ ਦੀਆਂ) ਤਿੰਨਾਂ ਗੋਪੀਆਂ ਨੂੰ ਜਿਸ ਨੇ ਆਪਣੇ ਨਾਲ ਲਿਆ ਹੋਇਆ ਹੈ।"