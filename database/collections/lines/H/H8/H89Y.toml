type = "primary"
data = "ਜੈ ਚੰਡੀ ਮੁੰਡੀ ਸਤ੍ਰੁ ਹੰਤੀ ॥"
page = 679

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The killer of the enemies like Chand and Mund,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਚੰਡ ਅਤੇ ਮੁੰਡ ਨੂੰ ਮਾਰਨ ਵਾਲੀ, ਵੈਰੀਆਂ ਦਾ ਨਾਸ਼ ਕਰਨ ਵਾਲੀ (ਤੇਰੀ) ਜੈ ਹੋਵੇ।"