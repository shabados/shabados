[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਿਨ ਕੀ ਕਰਤਿ ਅਧਿਕ ਰਖਵਾਰੀ ॥"
page = 854

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He was deemed to be very wealthy in view of his great number of buffaloes, whom he looked after very diligently."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਉਹ ਬਹੁਤ ਰਖਵਾਲੀ ਕਰਦਾ ਸੀ।"