[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਪੂਰਾ; ਸਾਚੁ ਦ੍ਰਿੜਾਏ ॥"
page = 1055
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Perfect True Guru implants the truth in man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਸੱਚੇ ਗੁਰੂ, ਬੰਦੇ ਅੰਦਰ, ਸੱਚੇ ਨੂੰ ਪੱਕਾ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Perfect True Guru implants Truth within."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਸਤਿਗੁਰੂ ਪੂਰਾ ਸਾਚ ਨਾਮ ਕੋ ਦ੍ਰਿੜ ਕਰਾਉਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੂਰਾ ਗੁਰੂ ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਸਦਾ-ਥਿਰ ਹਰਿ-ਨਾਮ ਪੱਕਾ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚੁ = ਸਦਾ-ਥਿਰ ਹਰਿ-ਨਾਮ। ਦ੍ਰਿੜਾਏ = (ਹਿਰਦੇ ਵਿਚ) ਪੱਕਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru Perfecto nos hace apreciar la Verdad"