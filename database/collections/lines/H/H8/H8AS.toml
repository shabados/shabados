[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਰਬ ਲੋਕ ਤਿਹ ਕਰਮ ਚਲਾਏ ॥"
page = 56

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Brahma composed all the four Vedas, all the people followed the injunctions contained in them."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਾਰੇ ਲੋਕਾਂ ਨੂੰ (ਵੇਦ ਅਨੁਸਾਰੀ) ਕਰਮ ਮਾਰਗ ਉਤੇ ਤੋਰਿਆ।"