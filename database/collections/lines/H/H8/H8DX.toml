[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੋਊ ਛਤ੍ਰਪਾਲੰ ਦੋਊ ਛਤ੍ਰ ਧਰਮੰ ॥"
page = 147

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Both were Sustainers of Kshatriyas and followed the discipline of Kshatriyas."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਵੇਂ ਛਤਰਪਾਲ ਅਤੇ ਦੋਵੇਂ ਛਾਤਰ ਧਰਮ (ਦੀ ਰਖਿਆ ਕਰਨ ਵਾਲੇ) ਸਨ।"