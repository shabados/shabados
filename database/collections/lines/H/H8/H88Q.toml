[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਦਾਤਾ ਪ੍ਰਭ ਅੰਤਰਜਾਮੀ ॥"
page = 741
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art the Munificent Lord, the inner-knower."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਅੰਦਰਲੀਆਂ ਜਾਨਣ ਵਾਲਾ ਦਾਤਾਰ ਸੁਆਮੀ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O God, You are the Great Giver, the Inner-knower, the Searcher of hearts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਅੰਤਰਯਾਮੀ! ਤੂੰ ਦਾਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਸਾਨੂੰ ਸਭ ਦਾਤਾਂ ਦੇਣ ਵਾਲਾ ਹੈਂ, ਸਾਡੇ ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਅੰਤਰਜਾਮੀ = ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú eres mi Señor Benévolo, el Conocedor del interior de nuestro corazón."