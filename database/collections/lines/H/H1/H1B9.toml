[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਇਆ ਕੋਟੁ ਹੈ ਆਕਾਰਾ ॥"
page = 1059
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The body has form of the fortress."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੇਹ ਦੀ ਕਿਲ੍ਹੇ ਵਰਗੀ ਸ਼ਕਲ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The body takes the form of a fortress."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹ ਦੇਹ ਜੋ ਕੋਟ ਕੇ ਅਕਾਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਮਨੁੱਖਾ) ਸਰੀਰ (ਮਾਨੋ ਇਕ) ਕਿਲ੍ਹਾ ਹੈ, ਇਹ ਪਰਮਾਤਮਾ ਦਾ ਦਿੱਸਦਾ-ਸਰੂਪ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਟੁ = ਕਿਲ੍ਹਾ। ਆਕਾਰਾ = (ਪਰਮਾਤਮਾ ਦਾ) ਸਰਗੁਣ ਰੂਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La forma del cuerpo es la Fortaleza de Dios,"