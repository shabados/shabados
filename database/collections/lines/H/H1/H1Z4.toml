type = "primary"
data = "ਬਹੁਰਿ ਨਾਹਿ ਕੋ ਨਾਮੁ ਨ ਲੀਨੋ ॥੧੩॥"
page = 976

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Whatever she asked for he did and, thereafter, never yearned for a woman.(13)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਫਿਰ ਨਾਂਹ ਕਰਨ ਦਾ ਨਾਂ ਤਕ ਨਾ ਲਿਆ ॥੧੩॥"