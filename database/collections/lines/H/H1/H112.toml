[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਾਹੁ ਖਸਮ ਤੂ ਵਾਹੁ; ਜਿਨਿ ਰਚਿ ਰਚਨਾ ਹਮ ਕੀਏ ॥"
page = 788
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hail, hail unto Thee, O Lord, who having created the world, hast made us."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਬਹਾਨ! ਸੁਬਹਾਨ ਹੈਂ ਤੂੰ ਹੇ ਸੁਆਮੀ! ਜਿਸ ਨੇ ਸ਼੍ਰਿਸ਼ਟੀ ਨੂੰ ਸਾਜ ਕੇ ਸਾਨੂੰ ਬਣਾਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Waaho! Waaho! You are wonderful and great, O Lord and Master; You created the creation, and made us."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਧੰਨ ਹੈਂ ਹੇ ਖਸਮ! ਤੂੰ ਧੰਨ ਹੈਂ, ਜਿਸ ਤੈਂਨੇ ਰਚਨਾ ਰਚ ਕੇ ਅਸਮਦਾਦਿ ਜੀਵ ਕੀਏ ਹੈਂ ਸੋਈ ਆਗੇ ਖੋਲ ਕਰ ਕਹਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਖਸਮ! ਤੂੰ ਧੰਨ ਹੈਂ! ਤੂੰ ਧੰਨ ਹੈਂ! ਜਿਸ ਜਗਤ-ਰਚਨਾ ਰਚ ਕੇ ਅਸਾਨੂੰ (ਜੀਵਾਂ ਨੂੰ) ਪੈਦਾ ਕੀਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਾਹੁ = ਧੰਨ, ਅਸਚਰਜ। ਹਮ ਕੀਏ = ਅਸਾਨੂੰ ਬਣਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bendito seas, oh Dios; has creado el Universo entero y a mí también."