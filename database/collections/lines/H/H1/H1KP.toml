[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੇ ਦਾਸ ਸਾਧ ਸਖਾ ਜਨ; ਜਿਨ ਮਿਲਿਆ ਲਹਿ ਜਾਇ ਭਰਾਂਤਿ ॥"
page = 1264
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's slaves are the God's saints and comrades. Meeting with whom doubt is dispelled"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦੇ ਗੋਲੇ ਰੱਬ ਦੇ ਸੰਤ ਅਤੇ ਸਾਥੀ ਹਨ। ਜਿਨ੍ਹਾਂ ਨਾਲ ਮਿਲ ਕੇ, ਭਰਮ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slaves of the Lord are our Holy companions. Meeting with them, doubt is taken away."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਦਾਸ ਜੋ ਸਾਧ ਹੈਂ, ਸੋ ਮੈਂ ਜਨ ਕੇ ਸਖਾ ਹੈਂ, ਜਿਨ ਕੇ ਮਿਲਨੇ ਸੇ ਭ੍ਰਾਂਤੀ ਲਹਿ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਭਗਤ-ਜਨ (ਐਸੇ) ਸਾਧ-ਮਿੱਤਰ (ਹਨ), ਜਿਨ੍ਹਾਂ ਦੇ ਮਿਲਿਆਂ (ਮਨ ਦੀ) ਭਟਕਣਾ ਦੂਰ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਖਾ = ਮਿੱਤਰ। ਭਰਾਂਤਿ = ਭਟਕਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Esclavos del Señor son nuestra Santa Compañía, encontrándolos toda duda desaparece."