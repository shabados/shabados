type = "primary"
data = "ਪੂਤ ਆਨਿ ਪ੍ਰਗਟੈ ਕੋਊ ਨਾਹੀ ॥"
page = 850

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Because her female issues would not survive, and had no luck of a son."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪੁੱਤਰ ਕੋਈ ਪ੍ਰਗਟ ਨਹੀਂ ਸੀ ਹੋਇਆ।"