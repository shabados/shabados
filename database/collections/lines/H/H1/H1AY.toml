[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਤਿਤ. ਪਾਵਨ; ਹਰਿ ਨਾਮਾ ॥"
page = 779
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Purifier of the sinners is the Name of my God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਪੀਆਂ ਨੂੰ ਪਵਿੱਤਰ ਕਰਨ ਵਾਲਾ ਹੈ ਮੇਰਾ ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord's Name is the Purifier of sinners."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਾਪੀਓਂ ਕੋ ਪਵਿਤ੍ਰ ਕਰਨੇ ਕੋ ਏਕ ਹਰੀ ਕਾ ਨਾਂਮ ਹੀ ਸਾਮ੍ਰਥ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਵਿਕਾਰੀਆਂ ਨੂੰ ਪਵਿੱਤਰ ਕਰਨ ਵਾਲਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿਤ = (ਵਿਕਾਰਾਂ ਵਿਚ) ਡਿੱਗੇ ਹੋਏ। ਪਾਵਨ = ਪਵਿੱਤਰ (ਕਰਨ ਵਾਲਾ)। ਪਤਿਤ ਪਾਵਨ = ਵਿਕਾਰੀਆਂ ਨੂੰ ਪਵਿੱਤਰ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Nombre del Señor es el Purificador de los malhechores;"