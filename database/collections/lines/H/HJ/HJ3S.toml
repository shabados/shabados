[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉਮੈ. ਮੈਲੁ ਨ ਚੁਕਈ; ਨਾਮਿ. ਨ ਲਗੈ ਪਿਆਰੁ ॥"
page = 594
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His filth of ego is removed not, nor is the love for the Name implanted."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਹੰਗਤਾ ਦੀ ਮੈਲ ਦੂਰ ਨਹੀਂ ਹੁੰਦੀ ਅਤੇ ਨਾਂ ਹੀ ਨਾਮ ਨਾਲ ਪ੍ਰੀਤ ਪੈਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The filth of ego is not removed, and he does not enshrine love for the Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦਰਸਨ ਮਾਤ੍ਰ ਤੇ ਨ ਹੰਤਾ ਮਮਤਾ ਰੂਪ ਮੈਲ ਹੀ ਜਾਤੀ ਹੈ ਔ ਨ ਨਾਮੀ ਮੇਂ ਪ੍ਯਾਰ ਹੀ ਲਗਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ ਵਿਚਾਰ ਕਰਨ ਤੋਂ ਬਿਨਾ) ਅਹੰਕਾਰ (-ਰੂਪ ਮਨ ਦੀ) ਮੈਲ ਨਹੀਂ ਉਤਰਦੀ ਤੇ ਨਾਮ ਵਿਚ ਪਿਆਰ ਨਹੀਂ ਬਣਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Liberándose del error que produce el sentido de dualidad,"