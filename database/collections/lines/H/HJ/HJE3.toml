[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਸੰਤੁ. ਸਤਗੁਰੁ ਸਤ ਪੁਰਖਾ; ਜੋ ਬੋਲੈ ਹਰਿ ਹਰਿ ਬਾਨੀ ॥"
page = 667
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Guru is the Lord's saint and the true person, who utters the Lord Master's Gurbani."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਦੇਵ ਜੀ ਸੁਆਮੀ ਦੇ ਸਾਧੂ ਅਤੇ ਸੱਚੇ ਪੁਰਸ਼ ਹਨ ਜੋ ਸੁਆਮੀ ਮਾਲਕ ਦੀ ਗੁਰਬਾਣੀ ਦਾ ਉਚਾਰਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Guru is the Lord's Saint, the True Being, who chants the Bani of the Lord, Har, Har."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਹਰੀ ਕਾ ਸੰਤ ਸਤਿਗੁਰ ਸ੍ਰੇਸ਼ਟ ਪੁਰਖ ਜੋ ਹਰਿ ਹਰਿ ਬਾਣੀ ਕੌ ਮੁਖ ਸੇ ਬੋਲਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰੂ ਮਹਾਂ ਪੁਰਖ ਹੈ, ਗੁਰੂ ਪਰਮਾਤਮਾ ਦਾ ਸੰਤ ਹੈ, ਜੇਹੜਾ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ ਉਚਾਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤੁ ਪੁਰਖਾ = ਮਹਾ ਪੁਰਖ। ਹਰਿ ਬਾਨੀ = ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ। ਬੋਲੈ = ਉਚਾਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru Verdadero es el Santo Señor y también la Persona Verdadera que canta el Gurbani del Señor Maestro."