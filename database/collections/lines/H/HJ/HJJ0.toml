[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੇ ਸੇਵਕ ਕਉ; ਕਿਸ ਕੀ ਕਾਣਿ ॥"
page = 371
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Under whose subservience should thy slave be?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਗੋਲਾ ਕਿਹਦੀ ਮੁਹਤਾਜੀ ਕਰੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who else is Your servant to serve?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰੇ ਸੇਵਕੋਂ ਕੋ ਕਿਸ ਕੀ ਕਾਨ ਹੈ ਅਰਥਾਤ ਕਿਸੀ ਕੀ ਕਾਨ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਨੂੰ ਨਿਸ਼ਚਾ ਹੋਵੇ ਉਸ) ਤੇਰੇ ਸੇਵਕ ਨੂੰ ਹੋਰ ਕਿਸ ਦੀ ਮੁਥਾਜੀ ਹੋ ਸਕਦੀ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਣਿ = ਮੁਥਾਜੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cuál es la deficiencia de Tu Sirviente, oh Señor?"