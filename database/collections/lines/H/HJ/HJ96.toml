[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ ਚਲਹਿ ਗੁਣ ਨਾਲਿ; ਨਾਹੀ ਦੁਖੁ ਸੰਤਾਪਣਾ ॥੫॥"
page = 752
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If thou departest with virtues misery shall harass thee not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਤੂੰ ਨੇਕੀਆਂ ਸੰਯੁਗਤ ਜਾਵੇਗਾ, ਤਾਂ ਅਪਦਾ ਤੈਨੂੰ ਔਖਾ ਨਹੀਂ ਕਰੇਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "For if you depart with virtue, then pain shall never afflict you. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਇਨ ਗੁਣੋਂ ਕੇ ਸੰਜੁਗਤ ਚਲੇਗਾ ਤੋ ਦੁਖੋਂ ਕਰ ਕੇ ਤਪਣਾ ਨਾ ਹੋਵੇਗਾ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਤੂੰ (ਪ੍ਰਭੂ ਦੀ ਭਗਤੀ ਵਾਲੇ ਚੰਗੇ) ਗੁਣ ਨਾਲ ਲੈ ਕੇ (ਜੀਵਨ ਸਫ਼ਰ ਵਿਚ) ਤੁਰੇਂ ਤਾਂ ਕੋਈ ਦੁੱਖ ਕਲੇਸ਼ ਤੈਨੂੰ ਪੋਹ ਨਹੀਂ ਸਕੇਗਾ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤਾਪਣਾ = ਕਲੇਸ਼ ਦੇ ਸਕਣਾ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así guardarás la Compañía de lo Bueno y el dolor no te lastimará.(5)"