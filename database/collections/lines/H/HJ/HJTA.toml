[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਛ ਕਛ ਵੈਰਾਹ ਰੂਪਿ; ਹੋਇ ਨਰਸਿੰਘੁ ਬਾਵਨ ਬਉਧਾਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The incarnations in the forms of fish, tortoise, swine, man-lion, dwarf and Buddha etc. have happened."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੱਛ, ਕੱਛ, ਸੂਕਰ, ਨਰਸਿੰਘ ਬਾਵਨ ਬੋਧ ਅਵਤਾਰ ਹੋਏ।"