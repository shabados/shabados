data = "ਗ੍ਰਿਹ ਤੇ ਕਾਢਿ ਅਮਿਤ ਧਨੁ ਦੀਨੋ ॥"
page = 886

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Rani loved him a lot and, then, giving him a lot of wealth banished him I from the house."

[[content]]
