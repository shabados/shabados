[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚ ਬਿਨੁ; ਭਵਜਲੁ. ਜਾਇ. ਨ ਤਰਿਆ ॥"
page = 1041
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the True Name, the dreadful world-ocean can be crossed not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਨਾਮ ਦੇ ਬਗੈਰ, ਭਿਆਨਕ ਸੰਸਾਰ ਸਮੁੰਦਰ ਪਾਰ ਕੀਤਾ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Truth, the terrifying world-ocean cannot be crossed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚ ਨਾਮ ਤੇ ਬਿਨਾਂ ਸੰਸਾਰ ਸੇ ਤਰਿਆ ਨਹੀਂ ਜਾਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ-ਥਿਰ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਸਿਮਰਨ ਤੋਂ ਬਿਨਾ ਇਸ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਵਿਚੋਂ ਪਾਰ ਨਹੀਂ ਲੰਘ ਸਕੀਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin la Verdad, uno no puede nadar a través del aterrador mar de la existencia, pues este mar es insondable y derrama el peor de los venenos."