[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦਿ ਕਹੈ ਜਨੁ ਨਾਨਕੁ; ਹਰਿ ਸਚੇ ਕੇ ਗੁਣ ਗਾਏ ॥੫॥"
page = 550
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's grace, serf Nanak utters and sings the praise of the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਨਫ਼ਰ ਨਾਨਕ ਸੱਚੇ ਸੁਆਮੀ ਦੀ ਕੀਰਤੀ ਆਖਦਾ ਅਤੇ ਗਾਇਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, servant Nanak speaks and sings the Glorious Praises of the True Lord. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਦਾਸ ਹੋਇ ਕਰ ਕੇ ਜੀਵ ਤਿਸ ਹਰਿ ਸਚੇ ਕੇ ਗੁਣ ਗਾਉਤਾ ਰਹੇ॥੫॥☬ਪਾਖੰਡ ਫਕੀਰੀ ਕਾ ਨਿਖੇਧ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦਾਸ ਨਾਨਕ ਆਖਦਾ ਹੈ ਕਿ ਸਤਿਗੁਰੂ ਦੀ ਮੇਹਰ ਨਾਲ (ਹੀ ਮਨੁੱਖ ਐਸੇ) ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਗਾਉਂਦਾ ਹੈ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, canta entonces las Alabanzas Verdaderas del Señor, por la Gracia del Guru. (5)"