[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਿਨਿ ਰਾਜ ਭਭੀਛਨ ਰੀਝਿ ਦਯੋ; ਰਿਸ ਕੈ ਜਿਨਿ ਰਾਵਨ ਖੇਤ ਮਰਿਓ ਹੈ ॥"
page = 334

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He, who gave kingdom to Vibhishana and in great rage, killed Ravana in the battlefield"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਰੀਝ ਕੇ ਵਿਭੀਸ਼ਣ ਨੂੰ ਰਾਜ ਦਿੱਤਾ ਹੈ ਅਤੇ ਜਿਸਨੇ ਕ੍ਰੋਧਵਾਨ ਹੋ ਕੇ ਰਾਵਣ ਨੂੰ ਯੁੱਧ-ਭੂਮੀ ਵਿਚ ਮਾਰਿਆ ਹੈ,"