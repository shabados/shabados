[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੋਬਿੰਦ ਤਿਆਗਿ. ਆਨ ਲਾਗਹਿ; ਅੰਮ੍ਰਿਤੋ ਡਾਰਿ ਭੂਮਿ ਪਾਗਹਿ ॥"
page = 1303
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Abandoning the World-Lord, thou are attached to another, O man and throwing away Nectar, are wholly occupied with dust."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼੍ਰਿਸ਼ਟੀ ਦੇ ਸੁਆਮੀ ਨੂੰ ਛੱਡ, ਤੂੰ ਹੋਰਸ ਨਾਲ ਜੁੜਿਆ ਹੋਇਆ ਹੈ, ਹੇ ਇਨਸਾਨ! ਅਤੇ ਸੁਧਾਰਸ ਨੂੰ ਸੁਟ ਕੇ ਤੂੰ ਖੇਹ ਨਾਲ ਮਗਨ ਹੋਇਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You have forsaken the Lord of the Universe, and become attached to another - you are throwing away the Ambrosial Nectar, to take dust."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕੋ ਤਿਆਗ ਕੇ ਔਰ ਮੇਂ ਲਾਗਨਾ ਐਸੇ ਹੈ ਜੈਸੇ ਕੋਈ ਅੰਮ੍ਰਿਤ ਕੋ ਤਿਆਗ ਕਰ ਮਿਟੀ ਕੋ ਪਕੜ ਲੇਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ! ਪਰਮਾਤਮਾ (ਦੀ ਯਾਦ) ਛੱਡ ਕੇ ਤੂੰ ਹੋਰ ਹੋਰ (ਪਦਾਰਥਾਂ) ਵਿਚ ਲੱਗਾ ਰਹਿੰਦਾ ਹੈਂ, ਤੂੰ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ ਡੋਲ੍ਹ ਕੇ ਧਰਤੀ ਵਿਚ ਸੁੱਟ ਰਿਹਾ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਆਗਿ = ਤਿਆਗ ਕੇ, ਭੁਲਾ ਕੇ। ਆਨ = (अन्य) ਹੋਰ ਹੋਰ (ਪਦਾਰਥਾਂ) ਵਿਚ। ਲਾਗਹਿ = ਤੂੰ ਲੱਗ ਰਿਹਾ ਹੈਂ। ਅੰਮ੍ਰਿਤੋ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ। ਡਾਰਿ = ਡੋਲ੍ਹ ਕੇ। ਭੂਮਿ ਪਾਗਹਿ = ਧਰਤੀ ਉਤੇ ਸੁੱਟ ਰਿਹਾ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Te has olvidado del Señor del Universo y te has apegado al otro. Estás desperdiciando el Néctar Ambrosial por un poco de polvo."