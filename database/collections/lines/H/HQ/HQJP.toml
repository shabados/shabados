language = "pa"
data = "ਰੱਬ ਨੇ ਉਸਨੂੰ ਹਰ ਉੱਚੇ ਪੁਰਸ਼ ਤੋਂ ਵੀ ਉਚੇਰਾ ਮਾਨ ਬਖਸ਼ਿਆ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਸਰ ਅਫ਼ਰਾਖ਼ਤਸ਼ ਹੱਕ ਜ਼ਿ ਹਰ ਸਰਬੁਲੰਦ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "The Primal Lord blessed him with honors higher than even the great persons,"