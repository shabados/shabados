[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਖਿਆ ਕੈ ਧਨਿ; ਸਦਾ ਦੁਖੁ ਹੋਇ ॥"
page = 665
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The poisonous wealth ever causes anguish."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਾਣ-ਨਾਸ਼ਕ ਦੌਲਤ ਹਮੇਸ਼ਾਂ ਦੁਖ ਹੀ ਦਿੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Poisonous wealth brings constant pain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਿਸ਼ਿਅਹੁੰ ਕੇ ਧਨ ਸੇ ਸਦਾ ਦੁਖ ਹੀ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮਾਇਆ ਦੇ ਧਨ ਨਾਲ ਸਦਾ ਦੁੱਖ (ਹੀ) ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਖਿਆ = ਮਾਇਆ। ਕੈ ਧਨਿ = ਦੇ ਧਨ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Esas riquezas fatalmente causan angustia,"