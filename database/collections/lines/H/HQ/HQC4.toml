[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜਿਉ ਮਣਿ ਕਾਲੇ ਸਪ ਸਿਰਿ; ਪਥਰੁ ਹੀਰੇ ਮਾਣਕ ਛਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "A gem remains in the hood of black snake and among the stones are found diamonds and rubies."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜਿਕੂੰ ਕਾਲੇ ਸੱਪ ਦੇ ਸਿਰ ਮਣੀ ਅਰ ਪੱਥਰਾਂ ਵਿਖੇ, ਹੀਰੇ ਤੇ ਮਾਣਕ ਸ਼ੋਭਦੇ ਹਨ।"