[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕ੍ਰਿਪਾ ਸਿੰਧੁ, ਤੁਮਰੀ ਕ੍ਰਿਪਾ; ਜੋ ਕਛ ਮੋ ਪਰਿ ਹੋਏ ॥"
page = 74

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O Ocean of Mercy, if Thy Grace is bestowed upon me:"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਕ੍ਰਿਪਾ ਦੇ ਸਾਗਰ! ਜੇ ਤੇਰੀ ਕੁਝ ਕ੍ਰਿਪਾ ਮੇਰੇ ਉਤੇ ਹੋਏ,"