[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਸੇਵਾ ਤੇ; ਸਭ ਕੁਲ ਉਧਾਰੇ ॥"
page = 423
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's service man saves his generations,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਟਹਿਲ ਦੁਆਰਾ ਬੰਦਾ ਆਪਣੀਆਂ ਸਾਰੀਆਂ ਪੀੜ੍ਹੀਆਂ ਨੂੰ ਬਚਾ ਲੈਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serving the Guru, all of one's generations are saved."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਸੇਵਾ ਤੇ ਸਭ ਕੁਲੋਂ ਕਾ ਉਧਾਰ ਕਰ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮੇਰੇ ਮਨ!) ਗੁਰੂ ਦੀ ਦੱਸੀ ਸੇਵਾ ਦਾ ਸਦਕਾ ਮਨੁੱਖ ਆਪਣੀਆਂ ਸਾਰੀਆਂ ਕੁਲਾਂ ਨੂੰ ਭੀ ਵਿਕਾਰਾਂ ਤੋਂ ਬਚਾ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਨਾਲ। ਉਧਾਰੇ = ਵਿਕਾਰਾਂ ਤੋਂ ਬਚਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A través del Servicio del Guru, uno se vuelve la fuente de la Liberación para todos sus parientes."