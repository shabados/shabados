[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਭੇਟਤ; ਮਨਿ ਓਮਾਹਾ ॥੨॥"
page = 621
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting with the Guru, man's mind gather bliss."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਦੇਵ ਨਾਲ ਮਿਲ ਕੇ ਬੰਦੇ ਦਾ ਚਿੱਤ ਖੁਸ਼ੀ ਵਿੱਚ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting with the Guru, the mind is enraptured. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਗੁਰੋਂ ਕੇ ਮਿਲਨੇ ਸੇ ਮਨ ਮੇਂ (ਓਮਾਹਾ) ਅਨੰਦ ਹੋਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੂੰ ਮਿਲਿਆਂ ਮਨ ਵਿਚ (ਹਰੀ-ਨਾਮ ਸਿਮਰਨ ਦਾ) ਚਾਉ ਪੈਦਾ ਹੋ ਜਾਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਭੇਟਤ = ਗੁਰੂ ਨੂੰ ਮਿਲਦਿਆਂ। ਮਨਿ = ਮਨ ਵਿਚ। ਓਮਾਹਾ = ਉਤਸ਼ਾਹ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y todos los errores son borrados uniéndose a la Sociedad de los Santos. (2)"