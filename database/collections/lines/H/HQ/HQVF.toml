[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ ਪੂਛਉ ਜਾਇ; ਨਾਮੁ ਧਿਆਇਸਾ ਜੀਉ ॥"
page = 689
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I shall go and consult the true Guru and shall deliberate over the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਜਾ ਕੇ ਸੱਚੇ ਗੁਰਾਂ ਦਾ ਮਸ਼ਵਰਾ ਲਵਾਂਗਾ ਅਤੇ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਾਂਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I shall go and ask the True Guru, and meditate on the Naam, the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਕੋ ਜਾਇ ਪੂਛਤਾ ਹੂੰ, ਤਿਨੋਂ ਕੇ ਉਪਦੇਸ਼ ਦ੍ਵਾਰਾ ਤੇਰੇ ਨਾਮ ਕੋ ਜੀਅ ਮੇਂ ਧਿਆਵੋਂਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਤਕ ਮੈਂ ਮਾਇਆ ਵਾਸਤੇ ਭੁੱਖਾ ਪਿਆਸਾ ਰਹਿੰਦਾ ਹਾਂ, ਤਦ ਤਕ ਮੈਂ ਕਿਸੇ ਭੀ ਤਰ੍ਹਾਂ ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ ਪਹੁੰਚ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਛਉ = ਮੈਂ ਪੁੱਛਾਂਗਾ। ਜਾਇ = ਜਾ ਕੇ। ਧਿਆਇਸਾ = ਧਿਆਇਸਾਂ, ਮੈਂ ਸਿਮਰਾਂਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Voy y consulto con mi Guru y habito sólo en el Naam, el Nombre del Señor."