[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਕਰਮੰ ਨ ਭਰਮੰ, ਨ ਜਨਮੰ ਨ ਜਾਤੰ ॥"
page = 19

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is actionless, illusionless, birthless and casteless."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਾ (ਕੋਈ ਵਿਸ਼ੇਸ਼) ਕਰਮ ਹੈ, ਨਾ ਭਰਮ ਹੈ, ਨਾ ਜਨਮ ਹੈ, ਨਾ ਜਾਤਿ ਹੈ,"