[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦ ਕੁਰਬਾਣੈ ਜਾਉ ॥੧॥ ਰਹਾਉ ॥"
page = 660
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto Thee, I am ever a sacrifice. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਉਤੋਂ ਮੈਂ ਹਮੇਸ਼ਾਂ ਘੋਲੀ ਜਾਂਦਾ ਹਾਂ। ਠਹਿਰਾਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am forever a sacrifice to You. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਸੇ ਤੇਰੇ ਊਪਰ ਸੇ (ਸਦ) ਸਉ ਵੇਰ ਕੁਰਬਾਣ ਜਾਤਾ ਹੂੰ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੈਥੋਂ ਸਦਾ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y entonces me ofrezco para siempre en sacrificio a Tu Nombre. (1-Pausa)"