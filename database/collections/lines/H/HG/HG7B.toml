[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕਸ ਕੇ; ਗੁਨ ਗਾਉ ਅਨੰਤ ॥"
page = 289
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sing the excellences of the Infinite One Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਅੰਤ ਇਕ ਸੁਆਮੀ ਦੀਆਂ ਖੂਬੀਆਂ ਗਾਇਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sing the endless Glorious Praises of the One."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਏਕ ਅਨੰਦ ਕੇ ਗੁਣੋਂ ਕੌ ਗਾਉ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਕ ਪ੍ਰਭੂ ਦੇ ਹੀ ਗੁਣ ਗਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨੰਤ = ਬੇਅੰਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cántale Alabanzas sin cesar y"