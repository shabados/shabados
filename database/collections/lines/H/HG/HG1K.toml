data = "ਆਪ ਹਾਥ ਦੈ ਨਾਥ ਬਚਾਯੋ ॥੨੩॥"
page = 73

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "No harm was done to them, the Lord saved them Himself.23."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਆਪ ਪ੍ਰਭੂ ਨੇ (ਉਨ੍ਹਾਂ ਨੂੰ) ਹੱਥ ਦੇ ਕੇ ਬਚਾਇਆ ॥੨੩॥"