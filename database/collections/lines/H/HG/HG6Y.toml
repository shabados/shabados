[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਊ; ਹਰਿ ਸਮਾਨਿ. ਨਹੀ ਰਾਜਾ ॥"
page = 856
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is no King equal to my God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਵਾਹਿਗੁਰੂ ਦੇ ਤੁੱਲ ਕੋਈ ਪਾਤਿਸ਼ਾਹ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no king equal to the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਸਮਾਨ ਔਰ ਕੋਈ ਰਾਜਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਗਤ ਵਿਚ ਕੋਈ ਜੀਵ ਪਰਮਾਤਮਾ ਦੇ ਬਰਾਬਰ ਦਾ ਰਾਜਾ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਊ = ਕੋਈ ਜੀਵ ਭੀ। ਸਮਾਨਿ = ਬਰਾਬਰ, ਵਰਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No existe rey igual a nuestro Dios;"