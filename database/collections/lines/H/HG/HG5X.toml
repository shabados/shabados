language = "pa"
data = "ਰੱਬ ਦੀ ਜ਼ਾਤ ਵਾਂਗ ਉਹ ਵੀ ਛੁਿਪਆ ਰਹਿੰਦਾ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਹਮਚੂ ਜ਼ਾਤਿਸ਼ ਆਸ਼ਿਕਾਂ ਰਾ ਊ ਨਿਹਾਂ ॥੩੩੬॥"

