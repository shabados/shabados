data = "ਸਕੇ ਨ ਸਸਤ੍ਰ ਉਠਾਇ ਕੈ ॥"
page = 65

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They left on galloping horses and could not use the weapons."

[[content]]
assets = ["RSJD"]
type = "translation"
