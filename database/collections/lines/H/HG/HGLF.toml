[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਰ ਊਪਰਿ ਠਾਢਾ ਗੁਰੁ ਸੂਰਾ ॥"
page = 293
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Over his head stands the brave Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਸੀਸ ਉਤੇ ਸੂਰਮਾ ਗੁਰੂ ਖਲੋਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Brave and Powerful Guru stands over his head."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਸਿਰ ਊਪਰ ਰਖ੍ਯਾ ਕਰਨੇ ਕੋ ਗੁਰੂ ਸੂਰਮਾਂ ਖੜਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਬੰਦੇ ਦੇ ਸਿਰ ਉਤੇ ਸੂਰਮਾ ਸਤਿਗੁਰੂ (ਰਾਖਾ) ਖਲੋਤਾ ਹੋਇਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਢਾ = ਖਲੋਤਾ। ਸੂਰਾ = ਸੂਰਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal ser encuentra respaldo en el Valeroso Guru"