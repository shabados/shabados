[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਲ ਜੰਜਾਲ; ਬਿਕਾਰ ਤੇ ਰਹਤੇ ॥"
page = 295
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have become freed from worldly entanglements and sins,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰੀ ਪੁਆੜਿਆਂ ਅਤੇ ਪਾਪਾਂ ਤੋਂ ਬੱਚ ਗਿਆ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have been released from worldly entanglements and corruption,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਜਨ (ਆਲ) ਘਰ ਕੇ ਜੰਜਾਲੋਂ ਸੇ ਔ ਕਾਮ ਆਦੀ ਵਿਕਾਰੋਂ ਕੇ ਸਮੁਦਾਇ ਵਾ ਬੰਧਨੋ ਸੇ ਰਹਤ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅਸੀਂ ਹੁਣ) ਘਰ ਦੇ ਧੰਧਿਆਂ ਤੇ ਵਿਕਾਰਾਂ ਤੋਂ ਬਚ ਗਏ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਲ ਜੰਜਾਲ = ਘਰ ਦੇ ਧੰਧੇ। ਬਿਕਾਰ ਤੇ = ਵਿਕਾਰਾਂ ਤੋਂ। ਰਹਤੇ = ਬਚ ਗਏ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He sido liberado de la corrupción y de las amarras del mundo, al escuchar el Naam, el Nombre del Señor"