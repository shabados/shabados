[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਬਿ ਲਿਖਿਆ ਪਾਈ ॥"
page = 614
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have obtained what was preordained for me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਛ ਧੁਰੋਂ ਮੇਰੇ ਲਈਂ ਲਿਖਿਆ ਹੋਇਆ ਸੀ, ਉਹ ਮੈਨੂੰ ਮਿਲ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have realized my pre-ordained destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਿਛਲੇ ਲੇਖ ਲਿਖੇ ਅਨਸਾਰ ਇਹੁ ਬਾਤ ਪਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਿਛਲੇ ਲਿਖੇ ਲੇਖ ਅਨੁਸਾਰ ਇਹ ਪ੍ਰਾਪਤੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰਬਿ ਲਿਖਿਆ = ਪੂਰਬਲੇ ਭਾਗਾਂ ਅਨੁਸਾਰ ਲਿਖਿਆ ਲੇਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ahora puedo entregar mi mente a los Santos,"