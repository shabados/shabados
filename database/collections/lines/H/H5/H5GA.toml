type = "primary"
data = "ਕੋਬਿਦ ਸਭ ਹੀ ਰਹਤ ਹੁਨਰ ਮੈ ॥"
page = 916

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He had a woman named Chandra Prabha in his house; all the poets used to praise her."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਭ ਗੁਣਾਂ ਵਿਚ ਪ੍ਰਬੀਨ ਸੀ।"