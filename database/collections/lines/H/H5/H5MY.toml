[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਮਾਨੇ ਕਉ; ਪ੍ਰਭ. ਤੇਰੋ ਮਾਨੁ ॥"
page = 266
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of the dishonoured Thou O Lord art the honour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਇਜ਼ਤੇ ਦੀ ਤੂੰ ਹੇ ਸਾਹਿਬ! ਇੱਜ਼ਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "To the dishonored, You, O God, are honor."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭ ਜੀ! ਨਿਮਾਨਓਂ ਕੋ ਤੇਰਾ ਨਾਮ ਹੀ ਮਾਨ ਦਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਿਮਾਣੇ ਵਾਸਤੇ ਤੇਰਾ (ਨਾਮ), ਹੇ ਪ੍ਰਭੂ! ਆਦਰ ਮਾਣ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਮਾਨਾ = ਜਿਸ ਨੂੰ ਕਿਤੇ ਮਾਣ ਆਦਰ ਨਾਹ ਮਿਲੇ, ਦੀਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y la Honra de los humildes."