[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚਾ ਥਾਨੁ ਸਦਾ ਪ੍ਰਭ ਤੇਰਾ ॥"
page = 1074
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever true is Thy adobe, O my Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਦੀਵੀ ਸੱਚਾ ਹੈ ਤੇਰਾ ਨਿਵਾਸ ਅਸਥਾਨ, ਹੇ ਮੇਰੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your place is forever True, O God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰਾ (ਥਾਨੁ) ਬੈਕੁੰਠ ਵਾ ਸਰੂਪ ਸਦਾ ਸਚਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰਾ ਟਿਕਾਣਾ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਥਾਨੁ = ਥਾਂ, ਟਿਕਾਣਾ। ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "siempre Verdadero es Tu Recinto."