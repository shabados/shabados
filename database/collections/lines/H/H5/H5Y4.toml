[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਬਾਂਛਤ ਫਲ ਮਿਲੇ ਅਚਿੰਤਾ; ਪੂਰਨ ਹੋਏ ਕਾਮਾ ॥੨॥"
page = 614
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His heart desired fruits he effortlessly obtains and his affairs are adjusted."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੇ ਚਿੱਤ-ਚਾਹੁੰਦੇ ਮੇਵੇ ਸਹਿਜੇ ਹੀ ਹਾਸਲ ਕਰ ਲੈਂਦਾ ਹੈ ਅਤੇ ਉੇਸ ਦੇ ਕਾਰਜ ਰਾਸ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He effortlessly awards the fruits of the mind's desire, and all works are brought to perfection. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਸੇ ਮਨ ਇੱਛਤ ਤਿਨ ਕੋ ਸ੍ਵਭਾਵਕ ਹੀ ਫਲ ਮਿਲੇ ਹੈ, ਤਿਨ ਕੇ ਸਭ (ਕਾਮਾ) ਸੰਕਲਪ ਪੂਰਨ ਹੂਏ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਨੁੱਖ ਨੂੰ ਅਚਨਚੇਤ ਮਨ-ਇੱਛਤ ਫਲ ਮਿਲ ਜਾਂਦੇ ਹਨ ਉਸ ਦੇ ਸਾਰੇ ਕੰਮ ਸਿਰੇ ਚੜ੍ਹ ਜਾਂਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਂਛਤ = ਇੱਛਤ। ਅਚਿੰਤਾ = ਅਚਨਚੇਤ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno obtiene el Fruto de la añoranza del corazón de manera espontánea y uno experimenta la Plenitud. (2)"