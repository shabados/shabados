[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਗਰੁ ਗੁਣੀ. ਅਥਾਹੁ; ਕਿਨਿ ਹਾਥਾਲਾ ਦੇਖੀਐ ॥"
page = 1091
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unfathomable is the world-ocean of three qualities; who has ever seen its bottom?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਥਾਹ ਹੈ ਤਿੰਨਾਂ ਗੁਣਾਂ ਵਾਲਾ ਸੰਸਾਰ ਸਮੁੰਦਰ, ਇਸ ਦਾ ਥੱਲਾ ਕਦੋਂ ਕਿਸ ਨੇ ਵੇਖਿਆ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The world-ocean of the three qualities is unfathomably deep; how can its bottom be seen?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤ੍ਰੈ ਗੁਣ ਰਚਤ ਸੰਸਾਰ ਸਾਗਰ ਅਥਾਹੁ ਹੈ ਇਸ ਕਾ ਕਿਸ ਨੇ (ਹਾਥਾਲਾ) ਅੰਤ ਦੇਖਿਆ ਹੈ, ਭਾਵ ਕਿਸੇ ਵਿਰਲੇ ਨੇ ਹੀ ਨਾਸ ਰੂਪ ਜਾਣਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤ੍ਰੈ-ਗੁਣੀ (ਸੰਸਾਰ) (ਮਾਨੋ) ਇਕ ਅੱਤ ਡੂੰਘਾ ਸਮੁੰਦਰ ਹੈ, ਇਸ ਦੀ ਹਾਥ ਕਿਸ ਨੇ ਲੱਭੀ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਣੀ = ਤ੍ਰੈਗੁਣੀ, ਮਾਇਆ ਦੇ ਤਿੰਨ ਗੁਣਾਂ ਵਾਲਾ। ਕਿਨਿ = ਕਿਸ ਨੇ? ਕਿਸੇ ਵਿਰਲੇ ਨੇ। ਹਾਥਾਲਾ = ਹਾਥ, ਥਾਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El océano del mundo de las tres cualidades es insondablemente profundo. ¿Cómo podría uno llegar a ver su fondo?"