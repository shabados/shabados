[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਨ ਕਮਲ ਸੰਗਿ; ਲਾਗੀ ਪ੍ਰੀਤਿ ॥"
page = 802
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By enshrining love for the Lord's lotus feet,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਕੰਵਲ ਰੂਪੀ ਪੈਰਾਂ ਨਾਲ ਪ੍ਰੇਮ ਪਾਉਣ ਦੁਆਰਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am in love with the Lotus Feet of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੇ ਚਿਤ ਕੀ ਤੇਰੇ ਚਰਨ ਕਮਲੋਂ ਸਾਥ ਪ੍ਰੀਤ ਲਾਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਦੇ ਸੋਹਣੇ ਚਰਨਾਂ ਨਾਲ ਜਿਸ ਮਨੁੱਖ ਦਾ ਪਿਆਰ ਬਣ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗਿ = ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando amorosamente adoro Tus Pies de Loto, oh Señor,"