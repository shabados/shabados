type = "primary"
data = "ਰਾਗੁ ਗਉੜੀ ਚੇਤੀ ਮਹਲਾ ੫ ਦੁਪਦੇ ॥"
page = 202
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Measure, Gauri Cheti 5th Guru Dupade"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗੁ ਗਊੜੀ ਚੇਤੀ ਪਾਤਸ਼ਾਹੀ ਪੰਜਵੀਂ ਦੁਪਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Gauree Chaytee, Fifth Mehl, Dho-Padhay:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਗਉੜੀ-ਚੇਤੀ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਦੋ-ਪਦਿਆਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Gauri Cheti, Mejl Guru Aryan, Quinto Canal Divino, Dupadas."