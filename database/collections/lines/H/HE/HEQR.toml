[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨੁ ਓਇ ਭਗਤ; ਜਿਨ ਤੁਮ ਸੰਗਿ ਹੇਤ ॥੧॥"
page = 200
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Blessed are those saints who have love with Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਬਾਰਕ ਹਨ ਉਹ ਸਾਧੂ, ਜਿਨ੍ਹਾਂ ਦਾ ਤੇਰੇ ਨਾਲ ਪਿਆਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "blessed are those devotees who are in love with You. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਵਹੁ ਭਗਤਿ ਜਨ ਧੰਨ ਹੈਂ ਜਿਨ ਕਾ ਤੁਮਾਰੇ ਸੰਗ ਹਿਤ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਭਾਗਾਂ ਵਾਲੇ ਹਨ ਉਹ ਭਗਤ ਜਨ ਜਿਨ੍ਹਾਂ ਦਾ ਤੇਰੇ ਨਾਲ ਪ੍ਰੇਮ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਇ = {ਲਫ਼ਜ਼ 'ਓਹੁ' ਤੋਂ ਬਹੁ-ਵਚਨ}। ਤੁਮ ਸੰਗਿ = ਤੇਰੇ ਨਾਲ। ਹੇਤ = ਹਿਤ, ਪਿਆਰ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "benditos los Devotos que Te aman, oh Señor.(1)"