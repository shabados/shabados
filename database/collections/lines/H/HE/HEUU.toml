[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਪ੍ਰਕਾਰੀ ਮੋਹਿਆ; ਬਹੁ ਬਿਧਿ ਇਹੁ ਸੰਸਾਰੁ ॥"
page = 50
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This world has been bewitched in various ways and good many devices."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਤਰੀਕਿਆਂ ਤੇ ਘਨੇਰੇ ਢੰਗਾਂ ਨਾਲ ਇਸ ਦੁਨੀਆਂ ਨੂੰ ਫ਼ਰੇਫ਼ਤਾ ਕੀਤਾ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By various devices, and in so many ways, this world is enticed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਪ੍ਰਕਾਰ ਕਾ ਜੋ ਸੰਸਾਰ ਹੈ, ਭਾਵ ਏਹ ਕਿ ਦੇਵ, ਦਾਨਵ, ਮਾਨੁਖਾਦਿ, ਪ੍ਰਪੰਚੁ ਔਰ ਨਾਨਾ ਪ੍ਰਕਾਰ ਕੇ ਬ੍ਯੋਹਾਰੋਂ ਮੇਂ ਮੋਹਤ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਜਗਤ ਨੂੰ (ਮਾਇਆ ਨੇ) ਅਨੇਕਾਂ ਕਿਸਮਾਂ ਦੇ ਰੂਪਾਂ ਰੰਗਾਂ ਵਿਚ ਕਈ ਤਰੀਕਿਆਂ ਨਾਲ ਮੋਹ ਰੱਖਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਹੁ ਬਿਧਿ = ਬਹੁਤ ਤਰੀਕਿਆਂ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mundo vive engañado de mil formas por Maya."