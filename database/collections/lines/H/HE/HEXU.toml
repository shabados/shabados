[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੇਖਨ ਆਯੋ ਜਗਤ ਤਮਾਸਾ ॥"
page = 58

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I am the servant of the Supreme Purusha and hath come to see the Sport of the world."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜਾਗਤਿਕ ਪ੍ਰਪੰਚ ਦਾ ਤਮਾਸ਼ਾ ਦੇਖਣ ਆਇਆ ਹਾਂ।"