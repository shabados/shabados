[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਸੁ ਜਪਤ; ਭੈ ਅਪਦਾ ਟਰੀ ॥੪॥੧॥੫॥"
page = 874
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by remembering whom dread and distress are dispelled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸਦਾ ਆਰਾਧਨ ਕਰਨ ਦੁਆਰਾ, ਡਰ ਤੇ ਦੁਖ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "meditating on Him, fear and suffering are dispelled. ||4||1||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਜਾਸੁ) ਜਿਸ ਕੋ ਜਪਤਿਆਂ ਭੈ ਔ ਬਿਪਦਾ ਸਭ ਟਰੀ ਹੈ॥੪॥੧॥੫॥☬ਏਕ ਪੰਡਿਤ ਕੇ ਪ੍ਰਥਾਇ ਨਿਰਗੁਨ ਬ੍ਰਹਮ ਕੀ ਉਪਾਸਨਾ ਵਿਧਾਨ ਕਰਤੇ ਹੂਏ ਹੋਰਿ ਦੇਵਤਿਓਂ ਕੀ ਉਪਾਸਨਾ ਕੀ ਗਉਨਤਾ ਦਿਖਾਵਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਉਸ ਦਾ ਨਾਮ ਸਿਮਰਿਆਂ ਸਭ ਡਰ ਤੇ ਮੁਸੀਬਤਾਂ ਟਲ ਜਾਂਦੀਆਂ ਹਨ ॥੪॥੧॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਸੁ = ਜਿਸ ਨੂੰ। ਅਪਦਾ = ਮੁਸੀਬਤ। ਟਰੀ = ਟਲ ਜਾਂਦੀ ਹੈ ॥੪॥੧॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a Quien saludo y felicito; al Contemplarlo todos mis miedos y aflicciones se disuelven. (4-1-5)"