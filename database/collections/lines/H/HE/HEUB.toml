[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਕੀ ਰੇਨ; ਜਾ ਕਾ ਮਨੁ ਹੋਇ ॥"
page = 278
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He whose mind is rendered the dust of all men's feet,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਮਨੂਆ ਸਾਰੇ ਆਦਮੀਆਂ ਦੇ ਪੈਰਾਂ ਦੀ ਧੂੜ ਹੋ ਗਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One whose mind is the dust of all"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਾ ਮਨ ਸਰਬ ਕੀ (ਰੇਨ) ਧੂੜੀ ਰੂਪ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦਾ ਮਨ ਸਭਨਾਂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇਨ = ਚਰਨਾਂ ਦੀ ਧੂੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero aquél que se compara mentalmente con el polvo que los demás pisan,"