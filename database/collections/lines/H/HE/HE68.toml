[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਜੁ ਰਾਮੋ; ਮਨਿ ਰਾਮ ॥"
page = 1297
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, meditate thou on thy Lord Master,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਤੂੰ ਆਪਣੇ ਸੁਆਮੀ ਮਾਲਕ ਦਾ ਸਿਮਰਨ ਕਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mind, meditate and vibrate on the Lord, Raam, Raam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਰਾਮ ਰਾਮ ਭਜੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਸ ਦੇ ਨਾਮ ਦਾ ਭਜਨ ਆਪਣੇ ਮਨ ਵਿਚ ਕਰਿਆ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਜੁ = ਭਜਨ ਕਰਿਆ ਕਰ। ਮਨਿ = ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, mente, medita y vibra en el Señor, Ram, Ram."