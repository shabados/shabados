[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾ ਭਯੋ, ਜੋ ਧਰਿ ਮੂੰਡ ਜਟਾ ਸੋ; ਤਪੋਧਨ ਕੋ ਜਗ ਭੇਖ ਦਿਖਾਯੋ ॥"
page = 522

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "What then, if someone roamed wearing matted locks and adopting different guises"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕੀ ਹੋਇਆ ਜੇ ਸਿਰ ਉਤੇ ਜਟਾਂ ਧਾਰਨ ਕਰ ਕੇ ਜਗਤ ਨੂੰ ਤਪਸਵੀਆਂ ਵਾਲਾ ਭੇਖ ਦਿਖਾਇਆ ਹੈ।"