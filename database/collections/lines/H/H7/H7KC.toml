[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਉ ਮਿਲੀਐ; ਪ੍ਰਭ ਅਬਿਨਾਸੀ ਤੋਹਿ ॥"
page = 801
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How can meet Thee, whom I see not, O my imperishable Lord?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੈਨੂੰ ਕਿਸ ਤਰ੍ਹਾਂ ਮਿਲ ਸਕਦਾ ਹਾਂ ਜਦ ਕਿ ਤੂੰ ਮੈਨੂੰ ਦਿਸਦਾ ਹੀ ਨਹੀਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How can I meet You, O Imperishable God?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭ ਅਬਨਾਸੀ! ਤੁਝ ਕੋ ਕਿਸ ਪ੍ਰਕਾਰ ਮਿਲੀਐ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਤੂੰ ਇਹਨਾਂ ਅੱਖਾਂ ਨਾਲ ਦਿੱਸਦਾ ਨਹੀਂ) ਤੈਨੂੰ ਮੈਂ ਕਿਸ ਤਰ੍ਹਾਂ ਮਿਲਾਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਤੋਹਿ = ਤੈਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entonces, ¿cómo puede uno encontrarte, pues no Te veo, oh mi Señor Eterno?"