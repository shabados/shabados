[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਧਸ੍ਰਯੋ ਜਾਇ ਕੈ ਵਾ ਤ੍ਰਿਯਾ ਕੇ ਸੁ ਡੇਰੇ ॥੧੦॥"
page = 834

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Walking and walking along, without looking back, reached the residence of that damsel.(10)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਿਧਾ ਉਸ ਇਸਤਰੀ ਦੇ ਡੇਰੇ ਜਾ ਪਹੁੰਚਿਆ ॥੧੦॥"