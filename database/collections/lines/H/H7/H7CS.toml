[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਕਾਮਿ; ਹੋਵਹਿ ਤੂੰ ਅਮਰੁ ॥੫॥"
page = 238
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, in whose service, thou shalt become immortal;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਸੇਵਾ ਅੰਦਰ ਤੂੰ ਅਬਿਨਾਸੀ ਹੋ ਜਾਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Working for Him, you shall become immortal. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜਿਸ ਕੇ ਨਾਮ ਕੀ ਇੱਛਾ ਮਾਤ੍ਰ ਸੇ ਹੀ ਤੂੰ ਅਮਰ ਹੋਵੈ, ਅਰਥਾਤ ਜਨਮ ਮ੍ਰਿਤੂ ਸੇ ਰਹਤ ਹੋ ਜਾਵੈ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਉਸ ਦੀ ਸੇਵਾ-ਭਗਤੀ ਵਿਚ ਲੱਗਿਆਂ ਤੂੰ ਸਦੀਵੀ ਆਤਮਕ ਜੀਵਨ ਵਾਲਾ ਬਣ ਸਕਦਾ ਹੈਂ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਮਰੁ = ਸਦੀਵੀ ਆਤਮਕ ਜੀਵਨ ਵਾਲਾ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "llegas a la Gloria y a la Inmortalidad. (5)"