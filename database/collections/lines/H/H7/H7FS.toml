[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਰੋ ਧ੍ਰਮਰਾਇਆ ॥੨॥"
page = 746
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that the Righteous Judge is very strict."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿ ਧਰਮ ਰਾਜਾ ਬਹੁਤ ਸਖਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "that the Righteous Judge of Dharma is so strict and stern. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਧਰਮ ਰਾਜਾ ਕਰੜਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਧਰਮਰਾਜ ਬੜਾ ਕਰੜਾ (ਹਾਕਮ) ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਰੋ = ਕਰੜਾ, ਸਖ਼ਤ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que la Justicia de Dios es tan implacable.(2)"