[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਇਆਲ ਹੋਏ ਸਭ ਜੀਅ ਜੰਤ੍ਰ; ਹਰਿ ਨਾਨਕ. ਨਦਰਿ ਨਿਹਾਲ ॥੧॥"
page = 957
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the sentient beings have become compassionate to me, O Nanak, and God has enraptured me by His grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਪ੍ਰਾਣਧਾਰੀ ਮੇਰੇ ਉੱਤੇ ਮਿਹਰਬਾਨ ਹੋ ਗਏ ਹਨ, ਹੇ ਨਾਨਕ! ਅਤੇ ਹਰੀ ਨੇ ਆਪਣੀ ਦਇਆ ਦੁਆਰਾ ਮੈਨੂੰ ਪ੍ਰਸੰਨ ਕਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All beings and creatures have become kind and compassionate to me. O Nanak, the Lord has blessed me with His Glance of Grace. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਜਬ ਹਰੀ ਨੇ ਕ੍ਰਿਪਾ ਦ੍ਰਿਸਟ ਸਾਥ ਦੇਖਿਆ ਤਬ ਸਭ (ਜੀਅ ਜੰਤ੍ਰ) ਸੂਖਮ ਅਸਥੂਲ ਜੀਵ ਹਮਾਰੇ ਪਰ ਦਿਆਲ ਹੋ ਗਏ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਿਸ ਮਨੁੱਖ ਵਲ ਪ੍ਰਭੂ ਮੇਹਰ ਦੀ ਨਜ਼ਰ ਨਾਲ ਤੱਕਦਾ ਹੈ, ਉਸ ਉਤੇ ਸਭ ਜੀਵ ਦਿਆਲ ਹੋ ਜਾਂਦੇ ਹਨ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਦਰਿ = ਮੇਹਰ ਦੀ ਨਿਗਾਹ ਨਾਲ। ਨਿਹਾਲ = ਤੱਕਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, dice Nanak, el Señor nos bendice con Su Mirada de Gracia. (1)"