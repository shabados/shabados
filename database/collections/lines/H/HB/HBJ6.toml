[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਾਇਨ ਤੋਰੇ ਪਰੋ ਤਜਿ ਸੰਕ; ਨਿਸੰਕ ਚਲੋ ਹਰਿ ਪਾਸਿਹ, ਹਹਾ ਰੀ ॥੬੮੩॥"
page = 362

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I fall at your feet and say again to you to go to Krishna.683."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹਾਇ ਨੀ! (ਮੈਂ) ਤੇਰੇ ਪੈਰੀਂ ਪੈਂਦੀ ਹਾਂ, ਸੰਗ ਨੂੰ ਛਡ ਅਤੇ ਨਿਸੰਗ ਹੋ ਕੇ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਪਾਸ ਚਲ ॥੬੮੩॥"