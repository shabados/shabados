[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪੁਰਾਨ ਔ ਕੁਰਾਨ; ਨੇਤਿ ਨੇਤਿ ਕੈ ਬਤਾਵਈ ॥"
page = 32

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Puranas and the Quran speak of Him as ‘Neti, Neti’ (infinite)."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੂੰ) ਪੁਰਾਣ ਅਤੇ ਕੁਰਾਨ ਬੇਅੰਤ ਬੇਅੰਤ ਕਹਿੰਦੇ ਹਨ।"