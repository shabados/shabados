[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੈਣਿ ਸੁਹਾਵੜੀ; ਦਿਨਸੁ ਸੁਹੇਲਾ ॥"
page = 107
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Beautiful is the night and illustrious the day,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਰਾਤ੍ਰੀ ਅਤੇ ਸੁਭਾਇਮਾਨ ਦਿਹਾੜਾ ਸੁੰਦਰ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Beautiful is the night, and beautiful is the day,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਰਾਤ੍ਰੀ ਸੋਭਨੀਕ ਹੈ ਔਰੁ ਦਿਨ ਭੀ (ਸੁਹੇਲਾ) ਸੁਖੁ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਸੁਹਾਵਣੀ ਬੀਤਦੀ ਹੈ, ਦਿਨ ਭੀ ਸੌਖਾ ਗੁਜ਼ਾਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਹਾਵੜੀ = ਸੁਖ ਦੇਣ ਵਾਲੀ, ਸੋਹਣੀ। ਸੁਹੇਲਾ = ਸੱਖਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bendita sea la noche, bendito sea el día en que uno piensa,"