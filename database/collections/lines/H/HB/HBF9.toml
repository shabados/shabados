[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਲਿ ਪਾਰਸ; ਕੰਚਨੁ ਹੋਇਆ ॥"
page = 657
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Touching the philosopher's stone, I have become gold."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਰਸ (ਅਮੋਲਕ ਰਸਾਇਨ) ਨਾਲ ਲੱਗ ਕੇ ਮੈਂ ਸੋਨਾ ਹੋ ਗਿਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Touching the philosopher's stone, I have been transformed into gold."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਗੁਰੂ ਪਾਰਸ ਕੋ ਮਿਲਕਰ ਇਹ ਜੀਵ ਸ੍ਵਰਨ ਵਤ ਸੁੱਧ ਹੂਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਪਾਰਸ ਨਾਲ ਛੋਹ ਕੇ (ਲੋਹਾ) ਸੋਨਾ ਬਣ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਿ = ਮਿਲ ਕੇ, ਛੋਹ ਕੇ। ਕੰਚਨੁ = ਸੋਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con el toque de la Piedra Filosofal yo también ahora soy oro"