[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁ ਬੀਨ ਬੀਨ ਅਛਰੈ; ਪ੍ਰਬੀਨ ਦੀਨ ਹੁਐ ਬਰੇ ॥੪੧॥"
page = 186

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On getting wounded the warriors are falling down, but are not retracing their steps.41."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਬੀਨ ਸੂਰਮਿਆਂ ਨੂੰ ਚੁਣ ਚੁਣ ਕੇ ਅਪੱਛਰਾਵਾਂ ਵਰ ਰਹੀਆਂ ਸਨ ॥੪੧॥"