data = "ਬਿਅਫ਼ਤਾਦ ਬਰ ਰਥ ਬਿਆਵੁਰਦ ਜਾ ॥"
page = 1406

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He (Subhat Singh) was laid down on the chariot, and she brought him home,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸੁਭਟ ਸਿੰਘ ਨੂੰ ਉਸ ਨੇ) ਰਥ ਉਤੇ ਲੰਬਾ ਪਾ ਲਿਆ ਅਤੇ ਆਪਣੇ ਘਰ ਲੈ ਆਈ"