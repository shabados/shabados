data = "ਤਿਸਨਾ ਅਗਨਿ; ਜਲੈ ਸੰਸਾਰਾ ॥"
page = 120
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man is burning in the fire of desire,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖਾਹਿਸ਼ ਦੀ ਅੱਗ ਅੰਦਰ ਬੰਦਾ ਮਚ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
