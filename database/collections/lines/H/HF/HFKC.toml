data = "(ਹੇ ਭਾਈ!) ਜਗਤ (ਮਾਇਆ ਦੀ) ਤ੍ਰਿਸ਼ਨਾ ਦੀ ਅੱਗ ਵਿਚ ਸੜ ਰਿਹਾ ਹੈ,"

