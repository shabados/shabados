[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਲਗੁ ਦੁਨੀਆ ਰਹੀਐ. ਨਾਨਕ; ਕਿਛੁ ਸੁਣੀਐ ਕਿਛੁ ਕਹੀਐ ॥"
page = 661
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As long as we are in this world, Nanak, we should hear some what and Speak some what of the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਤਾਂਈਂ ਅਸੀਂ ਇਸ ਸੰਸਾਰ ਵਿੱਚ ਹਾਂ, ਸਾਨੂੰ ਪ੍ਰਭੂ ਸਾਰੇ ਕੁਝਕੁ ਸੁਣਨਾ ਤੇ ਕੁਝਕੁ ਉਚਾਰਨਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As long as we are in this world, O Nanak, we should listen, and speak of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਹੇ ਭਾਈ! ਤਾਂ ਤੇ ਜਬ ਲਗ ਇਸ ਦੁਨੀਆਂ ਮੇਂ ਰਹੀਐ ਅਰਥਾਤ ਜੀਵੀਏ ਕਿਛ ਵਾਹਿਗੁਰੂ ਕਾ ਜਸ ਸੰਤੋਂ ਸੇ ਸਰਵਨ ਕਰੀਏ ਔਰ ਕੁਛ ਆਪ ਕਹੀਏ ਇਹੀ ਜੀਵਣੇ ਕਾ ਲਾਭ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਦ ਤਕ ਦੁਨੀਆ ਵਿਚ ਜੀਊਣਾ ਹੈ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਸੁਣਨੀ-ਕਰਨੀ ਚਾਹੀਦੀ ਹੈ (ਇਹੀ ਹੈ ਮਨੁੱਖਾ ਜਨਮ ਦਾ ਲਾਭ, ਤੇ ਇਥੇ ਸਦਾ ਨਹੀਂ ਬੈਠ ਰਹਿਣਾ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕ = ਹੇ ਨਾਨਕ! {ਲਫ਼ਜ਼ 'ਨਾਨਕ' ਅਤੇ 'ਨਾਨਕੁ' ਦਾ ਫ਼ਰਕ ਵੇਖੋ। 'ਨਾਨਕੁ' = ਕਰਤਾ ਕਾਰਕ, ਇਕ-ਵਚਨ। 'ਨਾਨਕ' = ਸੰਬੋਧਨ}। ਕਿਛੁ = (ਪ੍ਰਭੂ ਦੀ) ਕੁਝ (ਸਿਫ਼ਤ-ਸਾਲਾਹ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mientras uno vive en el mundo, oh dice Nanak, uno debe de escuchar y recitar el Nombre del Señor,"