[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੇ ਮਨ ਮੇਰੇ; ਤੂੰ ਹਰਿ ਸਿਉ ਜੋਰੁ ॥"
page = 238
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, unite thyself with thy Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੈ ਮੇਰੀ ਜਿੰਦੇ! ਤੂੰ ਆਪਣੇ ਆਪ ਨੂੰ ਆਪਣੇ ਸੁਆਮੀ ਨਾਲ ਜੋੜ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, unite yourself with the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ ਹਰੀ ਕੇ ਸਾਥ ਬ੍ਰਿਤੀ ਜੋੜ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ ਆਪਣੀ ਪ੍ਰੀਤਿ ਪਰਮਾਤਮਾ ਨਾਲ ਬਣਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋਰੁ = ਜੋੜ, ਪ੍ਰੀਤ ਬਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, únete con tu Señor,"