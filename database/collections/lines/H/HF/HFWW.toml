[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੀਨਾ ਨਾਥ; ਭਗਤ ਪਰਾਇਣ ॥੧॥ ਰਹਾਉ ॥"
page = 760
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who is the Master of the meek and the mainstay of His saints. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਸਕੀਨਾ ਦਾ ਮਾਲਕ ਅਤੇ ਆਪਣਿਆਂ ਸੰਤਾਂ ਦਾ ਆਸਰਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Master of the meek, the Support of His devotees. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਗਰੀਬੋਂ ਕਾ ਸ੍ਵਾਮੀ ਹੈ ਅਰੁ ਭਗਤ ਜਨ ਜਿਸਮੈਂ (ਪਰਾਇਣ) ਤਤਪਰ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਗਰੀਬਾਂ ਦੇ ਖਸਮ! ਹੇ ਭਗਤਾਂ ਦੇ ਆਸਰੇ! (ਸਾਨੂੰ ਵਿਕਾਰਾਂ ਤੋਂ ਬਚਾਈ ਰੱਖ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਾਇਣ = ਆਸਰਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el Maestro del débil, el Mástil de Sus Devotos. (1-Pausa)"