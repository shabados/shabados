[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅੰਨ੍ਰਯ ਦਯੋ ਗਰਗੈ ਜਬ ਨੰਦਹਿ; ਤਉ ਉਠਿ ਕੈ ਜਮੁਨਾ ਤਟਿ ਆਯੋ ॥"
page = 300

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Nand presented the alms of corn to Garg, he, taking all, came to the banks of Yamuna in order to cook food"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦ ਨੰਦ ਨੇ ਗਰਗ ਨੂੰ ਅੰਨ ਦਿੱਤਾ ਤਾਂ (ਉਹ) ਉਠ ਕੇ ਜਮੁਨਾ ਦੇ ਕੰਢੇ ਉਤੇ ਆ ਗਿਆ।"