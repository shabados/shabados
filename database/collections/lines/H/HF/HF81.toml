[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਪਾਸਾ; ਆਪੇ ਸਾਰੀ ॥"
page = 1020
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou Thyself are the chess-board and Thyself the chess-man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪ ਸ਼ਤਰੰਜ ਹੈਂ ਅਤੇ ਆਪ ਹੀ ਨਰਦ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You Yourself are the chess-board, and You Yourself are the chessman."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਹੀ ਤੂੰ ਤੀਨ ਗੁਨ ਰੂਪ ਪਾਸਾ ਹੈਂ ਔ ਆਪ ਹੀ ਤੂੰ ਜੀਵ ਰੂਪ (ਸਾਰੀ) ਨਰਦ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਹੀ (ਇਹ ਜਗਤ-ਰੂਪ) ਚਉਪੜ (ਦੀ ਖੇਡ) ਹੈ ਤੇ ਆਪ ਹੀ (ਚਉਪੜ ਦੀਆਂ ਜੀਵ-) ਨਰਦਾਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਸਾ = ਚਉਪੜ, ਸੰਸਾਰ ਦਾ ਆਕਾਰ। ਸਾਰੀ = ਨਰਦਾਂ, ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Tú Mismo eres la tabla de ajedrez y el ajedrez"