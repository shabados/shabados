[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਬ ਭੂਮਿ ਕੋ ਬਾਰਕ ਜੁਧ ਕੇ ਕਾਜ; ਚੜਿਯੋ ਤਬ ਕਉਚ ਸੁ ਸੂਰਨ ਸਾਜੇ ॥"
page = 511

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "While attacking, Bhumasura began to thunder like warriors"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦ ਭੂਮਾਸੁਰ ਯੁੱਧ ਕਰਨ ਲਈ ਚੜ੍ਹਿਆ ਤਾਂ (ਕ੍ਰਿਸ਼ਨ ਦੇ) ਸੂਰਮਿਆਂ ਨੇ (ਸ਼ਰੀਰਾਂ ਉਪਰ) ਕਵਚ ਸਜਾ ਲਏ।"