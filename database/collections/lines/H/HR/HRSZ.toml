[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਣਿ ਬਾਵਰੇ; ਹਭੁ ਵੈਸੀ ਗਰਬੁ ਗੁਮਾਨੋ ॥"
page = 777
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hear thou, O mad man, all thy ego and arrogance shall be humbled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੁੰ ਸੁਣ ਝੱਲੇ ਮਨੁੱਖ! ਤੇਰੀ ਸਾਰੀ ਹੰਗਤਾ ਅਤੇ ਆਕੜ ਫੁੱਟ ਜਾਏਗੀ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen, madman: all your egotism and pride shall be overcome."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਣ ਹੇ ਕਮਲੇ ਗਰਬ ਧਨ ਕਾ ਔ ਗੁਮਾਨ ਬਿਦ੍ਯਾ ਆਦਕਾ ਸਭ ਚਲਾ ਜਾਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਾਵਰੇ! ਸੁਣ, (ਪਦਾਰਥਾਂ ਨਾਲੋਂ ਸੰਬੰਧ ਟੁੱਟਿਆਂ ਇਹ) ਸਾਰਾ ਮਾਣ ਤੇ ਗੁਮਾਨ ਭੀ ਮੁੱਕ ਜਾਇਗਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਭੁ = ਸਾਰਾ। ਗਰਬੁ = ਮਾਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hombre loco, todo lo que te enorgullece se va a ir; todo lo que parece se irá."