type = "primary"
data = "ਗੁਰ ਕੇ ਚਰਣ; ਊਪਰਿ ਮੇਰੇ ਮਾਥੇ ॥"
page = 187
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru's feet are on my forehead."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਪੈਰ ਮੇਰੇ ਮੱਥੇ ਉਤੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I place the Guru's Feet on my forehead,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਾਂ ਤੇ ਗੁਰੋਂ ਕੇ ਚਰਣ ਮੇਰੇ ਮਾਥੇ ਕੇ ਊਪਰ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਗੁਰੂ ਦੇ ਚਰਨ ਮੇਰੇ ਮੱਥੇ ਉਤੇ ਟਿਕੇ ਹੋਏ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Pies del Guru están en mi frente,"