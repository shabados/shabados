data = "ਕਬੀਰ ਜੀਉ. ਨਾਮਦੇਉ ਜੀਉ. ਰਵਿਦਾਸ ਜੀਉ ॥"
page = 475
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Reverend Kabir, Namdev and Ravidas."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਜਯ ਕਬੀਰ, ਨਾਮ ਦੇਵ ਅਤੇ ਰਵਿਦਾਸ ਜੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Kabeer, Naam Dayv And Ravi Daas."

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Asa, Versos de los Bhaktas Kabir, Nam Dev y Ravi Das"