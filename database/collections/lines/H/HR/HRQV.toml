[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਸਤਿ ਏਕ; ਦਿਗਰਿ ਕੁਈ ॥"
page = 143
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord alone is. Who else can there be?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਸੁਆਮੀ ਹੀ ਹੈ। ਹੋਰ ਕੌਣ ਹੋ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who else is there?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਤੂਹੀ ਸਤ (ਅਸਤਿ) ਹੈ (ਦਿਗਰਿ) ਦੂਸਰਾ ਕੌਨ ਹੈ, ਭਾਵ ਇਹ ਕਿ ਔਰ ਕੋਈ ਸਤ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਹੋਰ ਦੂਜਾ ਕੌਣ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਸਤਿ = ਹੈ, ਕਾਇਮ ਹੈ। ਦਿਗਰਿ = ਦੀਗਰੇ, ਦੂਜਾ। ਕੁਈ = ਕੌਣ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Solamente el Señor Es; ningún otro más que Él está ahí; oh, ninguno."