[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਾਗਿ ਰਹਾ ਭੀਤਨ ਸੌ ਰਾਜੋ ॥"
page = 879

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "As the Raja’s door was quite opposite, and the Raja could hear their conversation."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਕ ਦਿਨ) ਰਾਜਾ ਕੰਧਾਂ ਨਾਲ ਲਗ ਕੇ (ਸਭ ਕੁਝ ਸੁਣਦਾ ਰਿਹਾ)।"