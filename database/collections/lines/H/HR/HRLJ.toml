[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਇਹੁ ਜੀਵੈ; ਨ ਮਰਤਾ ਦੇਖੁ ॥"
page = 871
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Neither it lives, nor it is seen to die."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਂ ਇਹ ਜੀਉਂਦਾ ਹੈ, ਨਾਂ ਹੀ ਇਹ ਮਰਦਾ ਆਖਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It does not live, and it is not seen to die."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹੁ ਜੀਵਤਾ ਭੀ ਨਹੀਂ, ਭਾਵ ਪ੍ਰਾਣ ਧਾਰਤਾ ਨਹੀਂ। ਅਸੰਗ ਹੋਨੇ ਤੇ ਪੁਨਹ ਮਰਤਾ ਭੀ ਨਹੀਂ ਦੇਖੀਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਹ ਇਹ ਜੰਮਦਾ ਹੈ ਨਾਹ ਮਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no vive ni tampoco muere."