data = "ਤਾ ਤੇ ਮੈ ਦੇਖਨਿ ਗ੍ਰਿਹ ਆਯੋ ॥੨੯॥"
page = 1000

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Some body had put a bad notion in my mind, and that is why I have come today.(29)"

