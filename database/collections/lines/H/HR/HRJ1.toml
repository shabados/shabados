[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦੀ; ਸਚਿ ਚਿਤੁ ਲਾਏ ॥"
page = 112
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the Guru's grace, man attaches his mind with truth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਮਿਹਰ ਸਦਕਾ, ਬੰਦਾ ਆਪਣਾ ਮਨ ਸੱਚ ਨਾਲ ਜੋੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, one's consciousness is attached to the Truth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਗੁਰੋਂ ਕੀ ਕਿਰਪਾ ਸੇ ਸਚ ਮੇਂ ਚਿਤ ਕੋ ਲਗਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਵਿਚ ਆਪਣਾ ਮਨ ਜੋੜਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਪਰਸਾਦੀ = ਗੁਰ ਪਰਸਾਦਿ, ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ। ਸਚਿ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y por la Gracia del Guru, la mente se apega a la Verdad."