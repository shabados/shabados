[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਿਖਿਯਨ ਕੌ ਤਾ ਕੇ ਤਰ ਦੀਜੈ ॥"
page = 974

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘You, yourself, ascend in a palanquin, and ask the sages to act as bearers and pick it up."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਨੂੰ ਰਿਸ਼ੀਆਂ ਤੋਂ ਚੁਕਵਾਓ।"