[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਉਧਾਰੇ; ਭਾਈ ਮੀਤਾ ॥"
page = 101
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and he saves all his brothers and friends."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਹ ਆਪਣੇ ਸਾਰੇ ਭਰਾਵਾਂ ਤੇ ਸਜਣਾ ਨੂੰ ਬਚਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and all family and friends are saved."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨੋਂ ਨੇ ਭਾਈ ਔਰ ਮਿਤ੍ਰਾਦਿ ਸੰਪੂਰਨੋਂ ਕਾ ਉਧਾਰ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸਾਰੇ ਭਰਾ ਤੇ ਮਿੱਤਰ (ਗਿਆਨ-ਇੰਦ੍ਰੇ ਗੁਰੂ ਨੇ ਵਿਕਾਰਾਂ ਤੋਂ) ਬਚਾ ਲਏ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲੇ = ਸਾਰੇ। ਉਧਾਰੇ = (ਵਿਕਾਰਾਂ ਤੋਂ) ਬਚਾ ਲਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "uno se vuelve inmaculado y salva a todos sus Hermanos del Destino y amigos."