[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਇ ਉਤੈ ਸਿਰੁ ਭੂਪ ਕੋ ਕਾਸੀ ਕੇ; ਬੀਚ ਪਰਿਯੋ ਪੁਰਿ ਸੋਕ ਜਨਾਯੋ ॥"
page = 526

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On that side in Kashi, the people aggrieved on displaying the chopped head of the king"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਧਰ (ਕਾਸ਼ੀ ਦੇ) ਰਾਜੇ ਦਾ ਸਿਰ ਕਾਸ਼ੀ ਵਿਚ ਜਾ ਕੇ ਡਿਗਿਆ, (ਫਲਸਰੂਪ) ਨਗਰ ਵਾਸੀਆਂ ਨੇ ਸੋਗ ਮੰਨਾਇਆ।"