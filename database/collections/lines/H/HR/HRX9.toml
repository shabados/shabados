[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਸਾਡਾ ਚਾਲਕ ਪਿਆਰਾ ਨਾਨਾ ਰੰਗਾਣ ਦਾ ਮਾਲਕ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਰੰਗਹਾਇ ਮੁਖ਼ਤਲਿਫ ਦਾਰਦ ਬੁਤਿ ਅਯਾਰ ਮਾ ॥੩॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Without any obstacle of the whirlpool, the torrent or the bank of the river. (3) (3)"