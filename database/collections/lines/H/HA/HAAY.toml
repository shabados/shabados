[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਉਸ ਕਉ. ਕੋਈ ਦੇਵੈ ਮਾਨੁ ॥"
page = 892
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When some one shows consideration to her (mammon),"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਕੋਈ ਜਣਾ ਉਸ (ਮਾਇਆ) ਦਾ ਆਦਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When someone tries to appease her,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਉਸ ਮਾਇਆ ਕੋ ਕੋਈ ਮਾਨ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! ਜਦੋਂ ਕੋਈ ਮਨੁੱਖ ਉਸ (ਮਾਇਆ) ਨੂੰ ਆਦਰ ਦੇਂਦਾ ਹੈ (ਸਾਂਭ ਸਾਂਭ ਕੇ ਰੱਖਣ ਦਾ ਜਤਨ ਕਰਦਾ ਹੈ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਮਾਨੁ = ਆਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando alguien muestra alguna consideración por Maya,"