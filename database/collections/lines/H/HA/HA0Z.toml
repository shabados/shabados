[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੁਰੇ ਭਲੇ ਹਮ; ਥਾਰੇ ॥ ਰਹਾਉ ॥"
page = 631
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whether bad or good, I am Thine. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਵੇਂ ਮੰਦਾ ਜਾਂ ਚੰਗਾ, ਮੈਂ ਤੇਰਾ ਹੀ ਹਾਂ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whether good or bad, I am Yours. ||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਚਾਹੋ ਬੁਰੇ ਹਾਂ ਚਾਹੋ ਭਲੇ ਹਾਂ ਸੋ ਹਮ ਆਪ ਕੇ ਹੀ ਹੈਂ॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਚਾਹੇ ਅਸੀ) ਭੈੜੇ ਹਾਂ (ਚਾਹੇ ਅਸੀ) ਚੰਗੇ ਹਾਂ, ਅਸੀਂ ਤੇਰੇ ਹੀ ਹਾਂ (ਸਾਡੇ ਵਿਕਾਰਾਂ ਦੇ ਬੰਧਨ ਕੱਟ ਦੇ) ਰਹਾਉ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਥਾਰੇ = ਤੇਰੇ ॥ਰਹਾਉ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues bueno o malo soy Tuyo. (Pausa)"