[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਮਿਲੈ; ਜੋ ਬਡਭਾਗੋ ॥੧॥ ਰਹਾਉ ॥"
page = 338
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone meets Thee, who is very fortunate. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਓਹੀ ਤੈਨੂੰ ਮਿਲਦਾ ਹੈ, ਜਿਹੜਾ ਸ਼੍ਰੇਸ਼ਟ ਨਸੀਬਾਂ ਵਾਲਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "he alone meets You, who is blessed by great good fortune. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਵੱਡੇ ਭਾਗਾਂ ਵਾਲਾ ਹੋਤਾ ਹੈ, ਸੋ ਤੁਮ ਮੇਂ ਮਿਲਤਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਤੈਨੂੰ ਓਹੀ ਮਿਲਦਾ ਹੈ ਜੋ ਵੱਡੇ ਭਾਗਾਂ ਵਾਲਾ ਹੋਵੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sólo Lo conoce quien tiene tal Bendición, por una gran fortuna.  (1-Pausa)"