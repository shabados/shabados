[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾਸੁ ਸੇਵਹੁ ਜਾਸ ਸੇਵਤਿ; ਹੋਹਿ ਪੂਰਣ ਕਾਮ ॥"
page = 682

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Only worship Him who will fulfil your wishes"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਸੇਵਾ ਕਰੋ ਜਿਸ ਦੀ ਸੇਵਾ ਕੀਤਿਆਂ ਕਾਮਨਾਵਾਂ (ਮਨੋਰਥ) ਪੂਰਨ ਹੋ ਜਾਣ,"