data = "ਸੋ ਮੂਰਖੁ; ਅੰਧਾ ਅਗਿਆਨੁ ॥"
page = 278
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "is stupid, blind and ignorant."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੂੜ੍ਹ ਅੰਨਾ ਅਤੇ ਬੇਸਮਝ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "is a fool, blind and ignorant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਮੂਰਖ ਅਗਿਆਨ ਕਰ ਕੇ ਅੰਧਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੂਰਖ ਹੈ, ਅੰਨ੍ਹਾ ਹੈ, ਬੜਾ ਜਾਹਿਲ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਿਆਨੁ = ਜਾਹਿਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y riquezas, es ciego e insensato."