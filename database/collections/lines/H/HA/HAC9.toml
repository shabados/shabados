data = "ਸੰਛੇਪ ਕੀਨ ਤਾ ਤੇ ਉਚਾਰ ॥੭੮॥"
page = 641

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Who can describe his infinite greatness?, therefore I have said it in brief.78."

