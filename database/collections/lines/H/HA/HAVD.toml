data = "ਜਿਮੰ ਰੁਦ੍ਰ ਮੈਣੰ ॥"
page = 207

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Ram was surrounded by the forces of demons like Shiva by the forces of Cupid (Kamdev)."

