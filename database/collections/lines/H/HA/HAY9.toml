data = "ਕੈ ਮਾਡਹੁ ਹਮ ਸੰਗ ਲਰਾਈ ॥੪੧॥੧੯੭॥"
page = 115

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“That either you return the kingdom to gods or wage the war with me.”41.197."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਾਂ ਫਿਰ ਮੇਰੇ ਨਾਲ ਯੁੱਧ ਕਰੋ ॥੪੧॥੧੯੭॥"