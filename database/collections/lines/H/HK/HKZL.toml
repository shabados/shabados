[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੋਊ ਸੂਰ ਸੈਨੰ ਦੋਊ ਸੂਰ ਮਾਹੰ ॥੯॥੨੨੭॥"
page = 147

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Both the heroes were the sun and moon of their forces.9.227."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਵੇਂ ਸੈਨਾਵਾਂ ਦੇ ਸੂਰਜ ਸਨ ਅਤੇ ਦੋਵੇਂ ਸੈਨਾਵਾਂ ਦੇ ਚੰਦ੍ਰਮਾ ਸਨ ॥੯॥੨੨੭॥"