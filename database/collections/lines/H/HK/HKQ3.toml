[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਸਿਖੀ ਦਾ ਲਿਖਣਾ; ਲੇਖੁ ਅਲੇਖੁ ਨ ਲਿਖਣਹਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Writing about the Sikh-life is also beyond all accounts; none can write."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰ ਸਿੱਖੀ ਦਾ ਲਿਖਣਾ ਲਖੇ ਤੋਂ ਅਲੇਖ ਹੈ, (ਕੋਈ ਇਸਦਾ) ਲਿੱਖਣਹਾਰਾ ਨਹੀਂ ਹੈ।"