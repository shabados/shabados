[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਹੇਲਾ; ਕਹਨੁ ਕਹਾਵਨੁ ॥"
page = 51
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Easy it is to utter and cause to utter."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਖੱਲਾ ਹੈ ਆਖਣਾ ਤੇ ਅਖਵਾਉਣਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It is easy to speak and talk,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਗਵਨ! ਸ਼ਾਸਤ੍ਰਾਂ ਦ੍ਵਾਰੇ ਤੇਰੇ ਜਸ ਕਾ ਕਹਨਾ ਅਰ ਔਰੋਂ ਸੇ ਕਹਾਵਨਾ ਸੁਖਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਆਖਣਾ ਅਖਵਾਣਾ ਸੌਖਾ ਹੈ (ਕਿ ਅਸੀਂ ਤੇਰਾ ਭਾਣਾ ਮੰਨਦੇ ਹਾਂ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਹੇਲਾ = ਸੌਖਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es muy fácil decirlo y sermonearlo"