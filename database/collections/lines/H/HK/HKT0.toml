[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਧੁ ਬਿਨੁ; ਦੂਜਾ ਨਾਹੀ ਕੋਇ ॥"
page = 723
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without Thee, there is not any other."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਬਾਝੋਂ (ਹੇ ਹਰੀ) ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no other than You, Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਤੇਰੇ ਬਿਨਾਂ ਔਰ ਕੋਈ ਦੂਸਰਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੈਥੋਂ ਬਿਨਾ ਹੋਰ ਕੋਈ ਦੂਜਾ ਕੁਝ ਕਰ ਸਕਣ ਵਾਲਾ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin Ti no hay nadie más"