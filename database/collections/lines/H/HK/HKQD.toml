[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਕਰੇ ਕਰਾਏ ਆਪੇ; ਹੁਕਮੇ ਰਹਿਆ ਸਮਾਈ ਹੇ ॥੧॥"
page = 1043
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God Himself does and Himself makes others do, In His will, He is pervading all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਆਪ ਕਰਦਾ ਹੈ ਅਤੇ ਆਪ ਹੀ ਹੋਰਨਾਂ ਤੋਂ ਕਰਾਉਂਦਾ ਹੈ। ਆਪਣੀ ਰਜ਼ਾ ਅੰਦਰ ਹੀ ਉਹ ਸਾਰੇ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself acts, and inspires all to act; in His Will, He pervades and permeates all. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਬ੍ਰਹਮਾਦਿ ਕਾਰਕ ਕਰੇ ਹੈਂ ਤਿਨਾਂ ਦੁਆਰੇ ਅੰਨ ਸਰੀਰ ਕਰਾਏ ਹੈਂ, ਪੁਨਃ ਹੁਕਮ ਕਰ ਕੇ ਆਪ ਹੀ ਬੀਚ ਸਮਾਇ ਰਹਿਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਸਭ ਕੁਝ ਕਰ ਰਿਹਾ ਹੈ, (ਜੀਵਾਂ ਪਾਸੋਂ) ਆਪ ਹੀ ਕਰਾ ਰਿਹਾ ਹੈ, ਆਪਣੀ ਰਜ਼ਾ ਅਨੁਸਾਰ (ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ ਵਿਚ) ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੇ = ਆਪ ਹੀ। ਹੁਕਮੇ = ਹੁਕਮ ਵਿਚ ਹੀ। ਰਹਿਆ ਸਮਾਈ = ਹਰ ਥਾਂ ਮੌਜੂਦ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así el Señor lo hace todo por Sí Mismo y permanece absorbido en Su Propia Voluntad.(1)"