data = "ਹਰਿ ਭਗਤ ਭਾਇ ॥੨੧੪॥"
page = 652

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Forsaking the royal enjoyments that king of Yogis had adopted Sannyas and Yoga for the devotion and desire of meeting the Lord.214."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਭਗਤੀ ਨਾਲ ਪ੍ਰੇਮ ਪਾ ਲਿਆ ਹੈ ॥੨੧੪॥"