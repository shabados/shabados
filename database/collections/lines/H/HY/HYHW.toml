[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਬਿਕ੍ਰਮ ਕੋ ਦਲੁ ਹੁਤੋ; ਸੋ ਲੈ ਚਲੇ ਉਠਾਇ ॥੮॥"
page = 931

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And they shook the forces of Bikrim.(8)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜੋ ਬਿਕ੍ਰਮ ਦਾ ਸੈਨਾ-ਦਲ ਸੀ, ਉਸ ਨੂੰ ਉਠਾ ਕੇ ਚਲ ਪਏ ॥੮॥"