data = "ਸੁਣਿ ਮੂਰਖ ਮੰਨ ਅਜਾਣਾ ॥"
page = 155
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hear O foolish and ignorant mind,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੰਨ ਦੇ, ਹੇ ਬੇਵਕੂਫ ਤੇ ਬੇਸਮਝ ਮਨ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen, you foolish and ignorant mind"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਗਯਾਤ ਮੂਰਖ ਮਨ! ਤੂੰ ਸਰਵਣ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ ਅੰਞਾਣ ਮਨ! ਸੁਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente torpe, escúchame y entiende"