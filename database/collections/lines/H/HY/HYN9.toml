type = "primary"
data = "ਤਾ ਤੇ ਲੈ ਅਪਨੋ ਕਰਿ ਪਾਰਿਯੋ ॥੯॥"
page = 883

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She invited the lady with her son as well and in the court she took him and adopted.(9)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਸ ਤੋਂ ਲੈ ਕੇ ਆਪਣਾ ਕਰ ਕੇ ਪਾਲਿਆ ॥੯॥"