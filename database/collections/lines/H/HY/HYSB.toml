[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹਿਤ ਅਤਿ ਦੁਰ ਮਾਨਸ, ਕਛੂ ਨ ਜਾਨਸ; ਨਰ ਹਰ ਅਰੁ ਬਟ ਪਾਰ ॥"
page = 562

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The men will look to their interest secretly and all will act like robbers"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਮਾੜੇ ਮਨੁੱਖ ਹਿਤ ਦੀ ਗੱਲ ਨੂੰ ਕੁਝ ਨਹੀਂ ਜਾਣਨਗੇ ਅਤੇ ਬਟਮਾਰ ਹੋ ਕੇ ਲੋਕਾਂ ਤੋਂ ਖੋਹਾ ਖੋਹੀ ਕਰਨਗੇ।"