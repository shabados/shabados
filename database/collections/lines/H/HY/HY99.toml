[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿ ਪ੍ਰਭੁ ਸਾਲਾਹੇ ਆਪਣਾ; ਸੋ ਸੋਭਾ ਪਾਏ ॥"
page = 791
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who praises his Lord, obtains glory."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਪਣੇ ਪ੍ਰਭੂ ਦੀ ਪਰਸੰਸਾ ਕਰਦਾ ਹੈ, ਉਹ ਪ੍ਰਭਤਾ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who praises his God, receives honor."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੌਨ ਸੇ ਆਪਣੇ ਪ੍ਰਭੂ ਕੋ ਸਲਾਹਤੇ ਹੈਂ, ਸੋ ਪੁਰਸ ਸੋਭਾ ਕੋ ਪਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਆਪਣੇ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਕਰਦਾ ਹੈ ਉਹ ਸੋਭਾ ਖੱਟਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿ = ਜੋ ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que alaba a su Dios obtiene la Gloria;"