data = "ਸਿਵਕਨ ਕੋ, ਸਿਵਗੁਨ ਸੁਖ ਦੀਓ ॥"
page = 1386

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He bestows Divine virtues and happiness on His servants"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪਰਮ ਸੱਤਾ! ਤੁਸੀਂ) ਸੇਵਕਾਂ ਨੂੰ ਸ਼ੁਭ ਗੁਣ ਅਤੇ ਸੁਖ ਦਿੱਤਾ ਹੈ"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਸਿਵਕਨ ਕੋ; ਸਵਗੁਨ ਸੁਖ ਦੀਓ ॥"