[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਰਪਾ ਨਿਧਿ ਪ੍ਰਭ ਦੀਨ ਦਇਆਲਾ ॥"
page = 826
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, the ocean of mercy and compassionate to the poor,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਹਿਮਤ ਦੇ ਸਮੁੰਦਰ ਅਤੇ ਗਰੀਬਾਂ ਉਤੇ ਮਇਆਵਾਨ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is the ocean of mercy, merciful to the meek;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਕ੍ਰਿਪਾ ਨਿਧਾਨ ਦੀਨੋਂ ਪਰ ਦਇਆਲੂ ਮੇਰੇ ਪ੍ਰਭੂ! ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਿਰਪਾ ਦੇ ਖ਼ਜ਼ਾਨੇ! ਹੇ ਗਰੀਬਾਂ ਉਤੇ ਦਇਆ ਕਰਨ ਵਾਲੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਰਪਾ ਨਿਧਿ = ਹੇ ਕਿਰਪਾ ਦੇ ਖ਼ਜ਼ਾਨੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor Compasivo con el pobre, oh Ser Benévolo,"