[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜੇਹਾ ਮੂਹੁ ਕਰਿ ਭਾਲਿਦਾ; ਤੇਵੇਹੈ ਲੇਖੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Man is reflected (in the mirror) in exactly the same way as is his propensity."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਅੱਗੋਂ) ਜੇਹਾ (ਕੋਈ ਸੰਸਾਰ ਵਿਖੇ) ਮੂੰਹ ਕਰ ਕੇ ਦੇਖਦਾ ਹੈ, ਤੇਹਾ ਹੀ ਲੇਖੇ ਪੈਂਦਾ ਹੈ।"