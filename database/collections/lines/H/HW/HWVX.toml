[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੀਮ ਕੋ ਸ੍ਰਉਨ ਭਰਿਓ ਮੁਖ ਦੇਖਿ ਕੈ; ਛਾਡਿ ਚਲੇ ਰਨ ਕਉਰਉ ਜੈਸੇ ॥੧੮੦॥"
page = 95

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "As though seeing the mouth of Bhim filled with blood, Kaurvas have run away from the battlefield.180.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਭੀਮ ਦੇ ਲਹੂ ਭਰੇ ਮੂੰਹ ਨੂੰ ਵੇਖ ਕੇ ਕੌਰਵ ਰਣ-ਭੂਮੀ ਨੂੰ ਛਡ ਚਲੇ ਹਨ ॥੧੮੦॥"