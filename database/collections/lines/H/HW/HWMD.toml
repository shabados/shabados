[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕਉ ਸਿਮਰਹਿ; ਸਦਾ ਅਬਿਨਾਸੀ ॥"
page = 263
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who meditate on the Lord become immortal for ever."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਾਹਿਬ ਨੂੰ ਆਰਾਧਦੇ ਹਨ, ਉਹ ਹਮੇਸ਼ਾਂ ਲਈ ਅਮਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who remember God are immortal and eternal."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪ੍ਰਭੂ ਕੌ ਸਿਮਰਤੇ ਹੈਂ, ਸੋ ਸਦਾ ਹੀ ਅਬਿਨਾਸੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਦਾ ਲਈ ਜਨਮ ਮਰਨ ਤੋਂ ਰਹਿਤ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਬਿਨਾਸੀ = ਨਾਸ-ਰਹਿਤ, ਜਨਮ ਮਰਨ ਤੋਂ ਰਹਿਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y obtienen la Vida Eterna."