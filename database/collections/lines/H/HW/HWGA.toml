[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਡਮਕੰਤ ਡਉਰ ਮੁਕਤੰਤ ਜ੍ਵਾਲ ॥੫੧੩॥"
page = 602

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The war-drums sounded, the ghosts danced in a charming manner, the Baitals shouted the goddess Kali laughed and the fire-showering tabor was played.513."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸ਼ਿਵ ਦਾ) ਡੌਰੂ ਖੜਕ ਰਿਹਾ ਹੈ ਅਤੇ (ਉਸ ਦੀਆਂ ਅੱਖਾਂ ਵਿਚੋਂ) ਅੱਗ ਨਿਕਲ ਰਹੀ ਹੈ ॥੫੧੩॥"