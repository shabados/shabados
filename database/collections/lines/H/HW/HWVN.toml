[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕੀ ਰੇਨ; ਹੋਇ ਹਾਂ ॥"
page = 410
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Become thou the dust of saints feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਾਧੂਆਂ ਦੇ ਪੈਰਾ ਦੀ ਧੂੜ ਹੋ ਵੰਞ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Become the dust of the Feet of the Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੀ ਧੂੜੀ ਹੋ ਰਹੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ (ਜਗਤ ਵਿਚ) ਕੋਈ ਭੈੜਾ ਨਹੀਂ ਦਿੱਸਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇਨ = ਚਰਨ-ਧੂੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y se vuelva el Polvo de los Pies de los Santos."