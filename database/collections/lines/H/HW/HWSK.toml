[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੇ ਨਾਲਿ ਤੇਰਾ ਗੰਢੁ ਲਾਗੈ; ਗੁਰਮੁਖਿ ਸਦਾ ਸਮਾਲੇ ॥"
page = 440
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou shalt patch up with the True Lord, by ever remembering Him through the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਸਦੀਵ ਹੀ ਉਸ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ ਤੂੰ ਸੱਚੇ ਸੁਆਮੀ ਨਾਲ ਜੁੜ ਜਾਵੇਗੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You shall be linked to the True Lord, and as Gurmukh, remember Him forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚੇ ਕਰਤਾ ਪੁਰਖ ਕੇ ਸਾਥ ਤੇਰਾ ਗੰਢੁ ਲਾਗੈ, ਭਾਵ ਮਿਲਾਪ ਹੋ ਜਾਇ ਔਰ ਗੁਰਮੁਖ ਹੋ ਕਰ ਸਦਾ ਸਿਮਰਣ ਕਰੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮਨ!) ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਤੂੰ ਸਦਾ ਪਰਮਾਤਮਾ ਨੂੰ ਆਪਣੇ ਅੰਦਰ ਵਸਾਈ ਰੱਖ, (ਇਸ ਤਰ੍ਹਾਂ ਉਸ) ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਨਾਲ ਤੇਰਾ ਪੱਕਾ ਪਿਆਰ ਬਣ ਜਾਏਗਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੰਢੁ = ਜੋੜ, ਪੱਕਾ ਸੰਬੰਧ। ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ। ਸਮਾਲੇ = ਸਮਾਲਿ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y estarás atado al Uno Verdadero, y a través de la Gracia del Guru, gozarás siempre de tu Señor."