[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਕਤ ਬੀਜ ਨ੍ਰਿਪ ਸੁੰਭ ਕੋ; ਕੀਨੋ ਆਨਿ ਪ੍ਰਨਾਮ ॥"
page = 87

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Raktavija came and bowed in obeisance before the king.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਕਤ-ਬੀਜ ਨੇ ਰਾਜੇ ਸੁੰਭ ਨੂੰ ਆ ਕੇ ਪ੍ਰਨਾਮ ਕੀਤਾ।"