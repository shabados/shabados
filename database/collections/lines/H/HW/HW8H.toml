[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਉ ਮੈ; ਓਟ ਗਹੀ ਪ੍ਰਭ ਤੇਰੀ ॥"
page = 390
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When I grasped Thy protection, O Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਮੈਂ ਤੇਰੀ ਪਨਾਹ ਪਕੜੀ, ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When I took to Your Protection, O God,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭ! ਜਬ ਮੈਨੇ ਤੇਰੀ ਓਟ ਧਾਰਨ ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜਦੋਂ ਤੋਂ ਮੈਂ ਤੇਰੀ ਓਟ ਪਕੜੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਟ = ਆਸਰਾ। ਗਹੀ = ਫੜੀ। ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando busqué el Refugio de mi Señor,"