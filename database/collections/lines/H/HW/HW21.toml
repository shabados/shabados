[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਿੰਗ ਬਾਜ ਨਹੇ ਰਥੈ; ਸਹਿ ਅਡਿਗ ਬੀਰ ਅਖੰਡ ॥"
page = 696

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "This rider of the brown horse is the unfailing and complete warrior"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਦੇ) ਰਥ ਅਗੇ ਭੂਰੇ ਰੰਗ ਦੇ ਘੋੜੇ ਜੁਤੇ ਹੋਏ ਹਨ, (ਜਿਸ ਦਾ ਸਵਾਰ) ਅਡਿਗ ਅਤੇ ਖੰਡ ਯੋਧਾ ਹੈ।"