[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਰਿ ਬਿਦਾਰਿ ਦਈ ਧੁਜਨੀ ਸਭ; ਦਾਨਵ ਕੋ ਬਲੁ ਹੁਇ ਗਇਓ ਛੀਨੋ ॥"
page = 95

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She killed and destroyed the whole army, which resulted in the depletion of the strength of the demon.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਸਾਰੀ (ਦੈਂਤ) ਸੈਨਾ ਨੂੰ ਮਾਰ ਕੇ ਨਸ਼ਟ ਕਰ ਦਿੱਤਾ, (ਫਲਸਰੂਪ) ਵੈਰੀ ਦੀ ਸ਼ਕਤੀ ਮੱਠੀ ਪੈ ਗਈ।"