[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਰੇ ਸਿਰਿ; ਧੰਧੇ ਲਾਇਆ ॥"
page = 71
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and assigned task to one and all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇ ਹਰ ਇਕ ਨੂੰ ਕੰਮ-ਕਾਜੇ ਲਾਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and assigned tasks to one and all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੀਵੋਂ ਕੋ (ਸਿਰੇ ਸਿਰਿ) ਰਚ ਰਚ, ਵਾ ਭਿੰਨ ਭਿੰਨ ਕਾਰਜ ਮੇਂ ਲਗਾਯਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰੇਕ ਜੀਵ ਉੱਤੇ (ਉਹਨਾਂ ਦੇ ਕੀਤੇ ਕਰਮਾਂ ਦੇ ਲੇਖ ਲਿਖ ਕੇ ਜੀਵਾਂ ਨੂੰ ਤੂੰ ਹੀ ਮਾਇਆ ਦੇ) ਧੰਧਿਆਂ ਵਿਚ ਫਸਾਇਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਰੇ ਸਿਰਿ = ਹਰੇਕ ਜੀਵ ਦੇ ਸਿਰ ਉਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y has asignado tareas a todos nosotros."