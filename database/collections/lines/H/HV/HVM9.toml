data = "ਪੁਨ ਮਿਲ︀ਯੋ ਜਾਇ ਭੀਤਰ ਅਲੇਖ ॥"
page = 170

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And that Imperceptible Lord-God merged again in His Own Self."

