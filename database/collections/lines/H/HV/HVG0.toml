[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਤਿ ਨਾਮ ਲੈ ਬਚਨ ਪ੍ਰਮਾਨੈ ॥"
page = 904

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Those who accept Satnam, Satnam prevails in their eloquence."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਤਿਨਾਮ (ਨੂੰ ਗੁਰਾਂ) ਦੇ ਬਚਨਾਂ ਦੁਆਰਾ ਪ੍ਰਮਾਣਿਕ ਮੰਨਦਾ ਹੈ।"