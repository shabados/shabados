[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਠ ਪਹਰ; ਹਰਿ ਹਰਿ ਕਉ ਧਿਆਈ ॥"
page = 1085
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and throughout the eight watches I remember my Lord Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇ ਅੱਠੇ ਪਹਿਰ ਹੀ ਮੈਂ ਆਪਣੇ ਸੁਆਮੀ ਮਾਲਕ ਨੂੰ ਯਾਦ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Twenty-four hours a day, I meditate on the Lord, Har, Har."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨ: ਅਠੇ ਪਹਰ ਹੇ ਹਰੀ! ਤੇਰੇ ਨਾਮ ਕੋ ਹੀ ਧਿਆਵਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਅੱਠੇ ਪਹਰ ਪ੍ਰਭੂ ਦਾ ਧਿਆਨ ਧਰਦਾ ਰਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਿਆਈ = ਧਿਆਈਂ, ਮੈਂ ਧਿਆਵਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y déjame Contemplarte siempre noche y día y aun mucho más."