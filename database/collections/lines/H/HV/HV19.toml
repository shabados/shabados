[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਲਿ ਸਾਧਸੰਗਤਿ ਕੈ ਸਾਥੇ ॥"
page = 621
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "on meeting with the society of saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤਾਂ ਦੀ ਸੰਗਤ ਨਾਲ ਜੁੜਨ ਦੁਆਰਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "meeting with the Saadh Sangat, the Company of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਕੇ ਸਾਥ ਮਿਲਨੇ ਸੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਮਿਲ ਕੇ। (ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਦੀ ਬਰਕਤਿ ਨਾਲ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਿ = ਮਿਲ ਕੇ। ਸਾਥੇ = ਸਾਥ ਵਿਚ, ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es el Tesoro de Virtud;"