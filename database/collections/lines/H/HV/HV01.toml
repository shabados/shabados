[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਐਸ ਰਾਜ ਰਘੁ ਰਾਜ ਬਿਸੇਖਵਾ ॥"
page = 626

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The kingdom of king Raghu was such that the differentiation of a saint and a thief did not exist there and all were saits"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਦਾ ਰਘੂਰਾਜ ਦਾ ਵਿਸ਼ੇਸ਼ ਰਾਜ ਸੀ।"