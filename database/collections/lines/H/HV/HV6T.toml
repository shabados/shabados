data = "ਤੁਮੀ ਸੁੰਭ ਨੈਸੁੰਭ ਦਾਨੌ ਸੰਘਾਰੇ ॥੪॥"
page = 809

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But don’t hesitate to decimate the Demons.( 4)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਸੁੰਭ ਅਤੇ ਨਿਸੁੰਭ (ਨਾਂ ਵਾਲੇ) ਦੈਂਤਾਂ ਨੂੰ ਮਾਰਿਆ ਹੈ ॥੪॥"