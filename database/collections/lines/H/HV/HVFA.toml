[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਤਪੇ ਤਪੀਸੁਰ ਤੀਰਥਾਂ; ਜਤੀ ਸਤੀ ਦੇਹ ਦੁਖ ਸਹੰਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Ascetics, the people going to pilgrimage centres, celebates and numerous satis in order to know Him suffer through their bodies."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਤਪੀਸਰਾਂ ਨੇ ਤੀਰਥਾਂ ਤੇ ਤਪ ਕੀਤੇ, ਜਤੀ ਸਤੀ, ਦੇਹ ਦੇ ਦੁਖ ਸਹਾਰਦੇ ਰਹੇ।"