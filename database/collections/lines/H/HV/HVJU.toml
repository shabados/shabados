data = "ਨੁਮਾਯਮ ਬ ਤੋ ਹਾਲ ਈਂ ਬਾ ਸਵਾਬ ॥੧੩॥"
page = 1394

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘On whose backs there will be gilded saddles, as charming as the spring-season.(13)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਇਸ ਦਾ ਵਿਸਤਾਰ ਕਰ ਕੇ ਵਿਖਾ ਦਿਆਂ ॥੧੩॥"