[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਆਮਦ ਕਰਕੇ ਸਾਰੀ ਦੁਨੀਆ ਵਿਚ ਖੁਸ਼ੀ ਹੀ ਖੁਸ਼ੀ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਅਜ਼ ਕਦੂਮਿ ਤੁਸਤ ਦਰ ਆਲਮ ਨਿਸ਼ਾਤ ॥੪੪॥੧॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, worship of truth is the asset of your faith and belief. (53)"