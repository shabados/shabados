[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਗੁਣ ਗਾਵੈ; ਹਰਿ ਜਨ ਲੋਗਾ ॥"
page = 367
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The men, who are God's slaves sing God's praises."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਬੰਦੇ, ਵਾਹਿਗੁਰੂ ਦੇ ਗੁਮਾਸ਼ਤੇ ਹਨ, ਉਹ ਵਾਹਿਗੁਰੂ ਦੀ ਕੀਰਤੀ ਗਾਇਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The humble servants of the Lord sing the Lord's Glorious Praises."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਲੋਗ ਹਰਿ ਕੇ ਦਾਸ ਹੈਂ, ਸੋ ਹਰਿ ਗੁਣ ਗਾਉਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਹੀ) ਪਰਮਾਤਮਾ ਦਾ ਭਗਤ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hombres, los que pertenecen al Señor cantan sólo la Alabanza del Señor,"