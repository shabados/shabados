[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਵਰ ਉਪਦੇਸੈ; ਆਪਿ ਨ ਬੂਝੈ ॥"
page = 372
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He instructs others, but understands not his ownself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਹੋਰਨਾਂ ਨੂੰ ਸਿੱਖਮੱਤ ਦਿੰਦਾ ਹੈ, ਪ੍ਰਤੂੰ ਆਪਣੇ ਆਪ ਨੂੰ ਨਹੀਂ ਸਮਝਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They instruct others, but do not understand themselves."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੂਸਰੋਂ ਕੋ ਉਪਦੇਸ਼ ਕਰਤਾ ਹੈ ਆਪ ਨਹੀਂ ਸਮਝਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜੇਹੜਾ ਬ੍ਰਾਹਮਣ) ਹੋਰਨਾਂ ਨੂੰ ਤਾਂ (ਧਰਮ ਦਾ) ਉਪਦੇਸ ਕਰਦਾ ਹੈ, ਪਰ ਆਪ (ਉਸ ਧਰਮ ਨੂੰ) ਨਹੀਂ ਸਮਝਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਵਰ = ਹੋਰਨਾਂ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el cual penetra y embauca a sus Almas. Instruyendo a otros, sin seguir su propia enseñanza,"