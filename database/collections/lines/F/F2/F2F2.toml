assets = ["SSA2"]
type = "primary"
data = "ਨਾਰਾਇਣ; ਸਭ ਮਾਹਿ ਨਿਵਾਸ ॥"
page = 868
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord abides amongst all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਸਾਰਿਆਂ ਦੇ ਅੰਦਰ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord abides in everyone."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਰਾਇਣ ਕਾ ਸਭ ਮਹਿ ਨਿਵਾਸੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਭ ਜੀਵਾਂ ਵਿਚ ਨਾਰਾਇਣ ਦਾ ਨਿਵਾਸ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor habita"