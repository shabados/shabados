[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰੰਕਾਰਿ ਆਕਾਰੁ ਉਪਾਇਆ ॥"
page = 1066
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The formless Lord has created the world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਰੂਪ-ਰਹਿਤ ਸੁਆਮੀ ਨੇ ਸੰਸਾਰ ਸਾਜਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Formless Lord created the universe of form."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਿਰਅਕਾਰ ਪਰਮੇਸਰ ਨੇ ਅਕਾਰੁ, ਭਾਵ ਸੰਸਾਰ ਉਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਕਾਰ-ਰਹਿਤ ਪਰਮਾਤਮਾ ਨੇ (ਆਪਣੇ ਆਪ ਤੋਂ ਪਹਿਲਾਂ) ਇਹ ਦਿੱਸਦਾ ਜਗਤ ਪੈਦਾ ਕੀਤਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰੰਕਾਰਿ = ਨਿਰੰਕਾਰ ਨੇ, ਆਕਾਰ-ਰਹਿਤ ਪਰਮਾਤਮਾ ਨੇ। ਆਕਾਰੁ = ਇਹ ਦਿੱਸਦਾ ਜਗਤ। ਉਪਾਇਆ = ਪੈਦਾ ਕੀਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es a través del Señor Sin Forma que todas las formas del Universo vinieron a existir,"