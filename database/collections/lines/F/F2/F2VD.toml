[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਸਤ੍ਰ ਉਚਰਿ, ਸਭ ਪਾਸਿ ਕੇ; ਲੀਜਹੁ ਨਾਮ ਪਛਾਨ ॥੩੮੭॥"
page = 735

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying “Dhaaraadhraj” and then “Niddhipati Ish” and “Shastrar”, the names of Paash are known.387."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਅੰਤ ਉਤੇ 'ਸਸਤ੍ਰ' ਜੋੜੋ। (ਇਨ੍ਹਾਂ ਨੂੰ) ਪਾਸ ਦੇ ਨਾਮ ਪਛਾਣ ਲਵੋ ॥੩੮੭॥"