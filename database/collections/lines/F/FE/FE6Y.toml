[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਿਤੜੇ ਪੁਰਖ ਵਖਾਣੀਅਨਿ; ਨਾਰਿ ਸੁਮਾਰਿ ਅਗਣਤ ਗਣਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "How many are the males and females cannot be counted."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਈ ਪੁਰਖ ਕਹੀਦੇ ਹਨ, ਕਈ ਇਸਤ੍ਰ੍ਰੀਆਂ ਰਚੀਆਂ, ਗਿਣਤੀ ਅਗਿਣਤ ਰੱਖੀ।"