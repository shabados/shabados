[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਤਿਹਿ ਜਗਾਇ ਕਹਿਯੋ ਧਨ ਹਰਿਯੋ ॥"
page = 947

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She woke her husband and shouted, ‘Our wealth has been robbed."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੇ) ਪਤੀ ਨੂੰ ਜਗਾ ਕੇ ਕਿਹਾ ਕਿ ਧਨ ਲੁਟਿਆ ਗਿਆ ਹੈ।"