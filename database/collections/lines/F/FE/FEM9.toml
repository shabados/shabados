[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਸੁ ਪਰਸਿ, ਪਰਸੁ ਪਰਸਿ; ਗੁਰਿ ਗੁਰੂ ਕਹਾਯਉ ॥"
page = 1408
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting with, being in communion with, and joining with Guru, the philosopher's stone, he was acclaimed as the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਰਸਾਇਣ ਨਾਲ ਮਿਲ, ਮਿਲ, ਅਤੇ ਪਰਸ ਕੇ ਉਹ ਗੁਰੂ ਕਹਿਲਾਏ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting the Guru, touching the Philosopher's Stone, He was acclaimed as Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਸ੍ਰੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਪਾਰਸ ਸਰੂਪ ਕੋ ਪਰਸ ਕਰ ਕੇ ਸ੍ਰੀ ਗੁਰੂ ਅੰਗਦ ਸਾਹਿਬ ਜੀ ਪਾਰਸ ਵਤ ਸਤਿਗੁਰ ਭਏ। ਐਸੇ ਹੀ ਸੰਪੂਰਨ ਸਤਿਗੁਰੋਂ ਸਾਥ ਮਿਲਾਵਣਾ, ਤੈਸੇ ਸ੍ਰੀ ਗੁਰੂ ਰਾਮਦਾਸ ਸਾਹਿਬ ਜੀ ਪਾਰਸ ਕੋ ਪਰਸ ਕਰ ਸ੍ਰੀ ਗੁਰੂ ਅਰਜਨ ਸਾਹਿਬ ਜੀ ਸਤਿਗੁਰ ਕਹਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਾਰਸ (ਗੁਰੂ) ਨੂੰ ਤੇ ਪਰਸਣ-ਜੋਗ (ਗੁਰੂ) ਨੂੰ ਛੁਹ ਕੇ (ਆਪ) ਗੁਰੂ ਤੋਂ ਗੁਰੂ ਅਖਵਾਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਸੁ = ਪਰਸਣ-ਯੋਗ ਗੁਰੂ ਨੂੰ। ਗੁਰਿ = ਗੁਰੂ ਤੋਂ, ਗੁਰੂ ਦੀ ਰਾਹੀਂ। ਕਹਾਯਉ = ਅਖਵਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Encontrando al Guru, tocando la Piedra Filosofal, fue aclamado como Guru;"