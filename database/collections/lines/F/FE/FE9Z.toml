[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੁਤ੍ਰ ਪ੍ਰਹਿਲਾਦ ਸਿਉ; ਕਹਿਆ ਮਾਇ ॥"
page = 1154
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Prahlad's mother, said to her son:"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਹਿਲਾਦ ਦੀ ਮਾਤਾ ਨੇ ਆਪਣੇ ਪੁਤ ਨੂੰ ਆਖਿਆ:"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Prahlaad's mother said to her son,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਹਿਲਾਦ ਪੁਤ੍ਰ ਕੋ ਮਾਤਾ ਨੇ ਆਇਕੇ ਕਹਾ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਂ ਨੇ (ਆਪਣੇ) ਪੁੱਤਰ ਪ੍ਰਹਲਾਦ ਨੂੰ ਆਖਿਆ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਉ = ਨਾਲ, ਨੂੰ। ਮਾਇ = ਮਾਂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Entonces la madre de Prehlad le dijo a su hijo: oh hijo mío,"