[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਮਰੀ ਮਹਿਮਾ ਬਰਨਿ. ਨ ਸਾਕਉ; ਤੂੰ ਠਾਕੁਰ ਊਚ ਭਗਵਾਨਾ ॥੧॥"
page = 735
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thine praise I can describe not. Thou art my Lofty illustrious Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਉਸਤਤੀ ਮੈਂ ਬਿਆਨ ਨਹੀਂ ਕਰ ਸਕਦਾ। ਤੂੰ ਮੇਰੇ ਬੁਲੰਦ ਕੀਰਤੀਮਾਨ ਸੁਆਮੀ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I cannot express Your Glorious Praises. You are my Lord and Master, lofty and benevolent. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੁਮਰੀ ਮਹਿਮਾਂ ਮੈਂ ਕਛੁ ਨਹੀਂ ਕਹਿ ਸਕਤਾ, ਹੇ ਠਾਕੁਰ! ਤੂੰ ਸਭ ਸੇ ਊਚਾ ਹੈਂ ਔਰ ਭਗਵਾਨ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਭ ਤੋਂ ਉੱਚੇ ਭਗਵਾਨ! ਤੂੰ ਸਭ ਦਾ ਪਾਲਣ ਵਾਲਾ ਹੈਂ। ਮੈਂ ਤੇਰੀ ਵਡਿਆਈ ਬਿਆਨ ਨਹੀਂ ਕਰ ਸਕਦਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਹਿਮਾ = ਵਡਿਆਈ। ਬਰਨਿ ਨ ਸਾਕਉ = {ਸਾਕਉਂ} ਮੈਂ ਬਿਆਨ ਨਹੀਂ ਕਰ ਸਕਦਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No puedo expresar Tu Gloriosa Alabanza, eres mi Maestro, Elevado y Benevolente. (1)"