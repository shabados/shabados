[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਰ ਨਹੀ. ਜਿਹ ਤੋਪਉ ॥"
page = 659
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have no awl with which I may stitch,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਕੋਲ ਖੰਧੂਈ ਨਹੀਂ ਜਿਸ ਨਾਲ ਮੈਂ ਜੋੜਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have no awl to stitch them;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਸਰੀਰ ਅਭਿਮਾਨੀ ਬ੍ਰਿਤੀ ਰੂਪੀ ਤੋ ਮੇਰੇ ਪਾਸ ਆਰ ਨਹੀਂ ਹੈ, ਜਿਸ ਕੇ ਸਾਥ ਮੈਂ ਇਸ ਕੋ (ਤੋਪਉ) ਤੋਪਾ ਲਗਾਵੋਂ, ਭਾਵ ਸੇ ਇਸ ਕੀ ਪਾਲਨਾ ਪੋਖਨਾ ਕਰੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਪਾਸ ਆਰ ਨਹੀਂ ਕਿ ਮੈਂ (ਜੁੱਤੀ ਨੂੰ) ਤ੍ਰੋਪੇ ਲਾਵਾਂ (ਭਾਵ, ਮੇਰੇ ਅੰਦਰ ਮੋਹ ਦੀ ਖਿੱਚ ਨਹੀਂ ਕਿ ਮੇਰੀ ਸੁਰਤ ਸਦਾ ਸਰੀਰ ਵਿਚ ਹੀ ਟਿਕੀ ਰਹੇ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਹ = ਜਿਸ ਨਾਲ। ਤੋਪਉ = ਤੋਪਉਂ, ਤ੍ਰੋਪਾ ਲਾਵਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No tengo el punzón para coser los zapatos"