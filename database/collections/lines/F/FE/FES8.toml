[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਜਨਾ ਕੀ ਲੇਹੁ ਮਤੇ ॥"
page = 1136
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man, imbibe thou the instruction of the holymen."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੰਦੇ! ਤੂੰ ਪੁਰਸ਼ਾਂ ਦੀ ਸਿੱਖ-ਮਤ ਧਾਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Take in the teachings of the humble Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸੰਤ ਜਨੋਂ ਕੀ ਮਤਿ ਕੋ ਅੰਗੀਕਾਰ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਦੇ ਚਰਨਾਂ ਨਾਲੋਂ ਟੁੱਟੇ ਹੋਏ ਬੰਦਿਆਂ ਦੀ ਸੰਗਤ ਕਰਨ ਦੇ ਥਾਂ) ਸੰਤ ਜਨਾਂ ਪਾਸੋਂ (ਸਹੀ ਜੀਵਨ-ਜੁਗਤਿ ਦੀ) ਸਿੱਖਿਆ ਲਿਆ ਕਰੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਤੇ = ਮੱਤ, ਸਿੱਖਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh ser humano, instrúyete en la Sabiduría de los Santos,"