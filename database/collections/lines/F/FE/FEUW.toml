type = "primary"
data = "ਦੁਹੂੰਅਨ ਕੇ ਜਿਯ ਆਨੰਦ ਬਾਢਾ ॥"
page = 856

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She embroidered a handkerchief and both of them admired it."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਰੁਮਾਲ ਨੂੰ ਵੇਖ ਕੇ) ਦੋਹਾਂ ਦੇ ਮਨ ਵਿਚ ਬਹੁਤ ਖ਼ੁਸ਼ੀ ਹੋਈ।"