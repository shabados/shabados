[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ; ਆਪਿ ਵਡਾਈ ਦੇਵੈ ਸੋਇ ॥੩॥"
page = 560
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To the Guru-wards, He Himself grants greatness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਨੂੰ ਉਹ ਖੁਦ ਬਜੁਰਗੀ ਬਖਸ਼ਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself blesses the Gurmukh with greatness. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਗੁਰਮੁਖੋਂ ਕੋ ਆਪ ਬਡਿਆਈ ਦੇਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਰਮਾਤਮਾ ਆਪ ਮਨੁੱਖ ਨੂੰ ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਕਰ ਕੇ ਇੱਜ਼ਤ ਬਖ਼ਸ਼ਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਡਾਈ = ਇੱਜ਼ਤ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, aquél a quien Dios escoge para ver Su Gloria. (3)"