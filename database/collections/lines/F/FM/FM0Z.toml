[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਲਮ. ਨ ਲਾਗੈ; ਆਵੈ ਜਾਈ ॥"
page = 1041
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They delay not in coming and going."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਉਣ ਅਤੇ ਜਾਣ ਵਿੱਚ ਚਿਰ ਨਹੀਂ ਲਾਉਂਦੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In no time at all, it comes and goes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਜਗਤ ਕੇ ਆਵਨੇ ਜਾਨੇ ਮੇਂ ਤੋ ਦੇਰੀ ਕੁਛ ਲਗਤੀ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ (ਜਗਤ ਦੀ ਮਾਇਆ ਦਾ ਸਾਥ ਮੁੱਕਦਿਆਂ) ਰਤਾ ਚਿਰ ਨਹੀਂ ਲੱਗਦਾ ਤੇ ਮਨੁੱਖ ਇਸ ਮੋਹ ਦੇ ਕਾਰਨ ਜਨਮ ਮਰਨ ਵਿਚ ਪੈ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਲਮ = ਢਿੱਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues en cualquier momento esto va y viene,"