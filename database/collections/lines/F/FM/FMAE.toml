[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੋ ਪਵਨੁ; ਕਹਾ ਕਉਨੁ ਰੋਤਿ ॥੨॥"
page = 188
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His light to the One light and breath to the identical wind, why and for whom, then should man bewail?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨੂਰ ਇਕ ਨੂਰ ਨਾਲ ਅਤੇ ਸੁਆਸ ਆਪਣੇ ਜੇਹੀ ਹਵਾ ਨਾਲ ਤਾਂ ਆਦਮੀ ਕਿਉਂ ਅਤੇ ਕੀਹਦੇ ਲਈ ਵਿਰਲਾਪ ਕਰੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the one praanic wind. Why are you crying? For whom do you cry? ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਪ੍ਰਾਣ ਪਵਨ ਭੀ ਸਰਬ ਮੇਂ ਏਕ ਹੈ। ਕਹਾਂ ਰੋਵਤਾ ਹੈ ਯਾਂ ਤੇ ਵਿਚਾਰ ਕੌਣ ਮਰਾ ਹੈ, ਭਾਵ ਜੀਵ ਨਹੀਂ ਮਰਾ ਹੈ। ਤੂੰ ਆਪ ਕੋ ਕਵਨ ਮਾਨ ਕਰ ਰੋਵਤਾ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਭ ਵਿਚ ਇਕੋ ਹੀ ਪ੍ਰਾਣ ਹਨ (ਜਿਤਨਾ ਚਿਰ ਸੰਜੋਗ ਕਾਇਮ ਹੈ ਉਤਨਾ ਚਿਰ ਇਹ ਤੱਤ ਇਕੱਠੇ ਹਨ। ਸੰਜੋਗ ਮੁੱਕ ਜਾਣ ਤੇ ਤੱਤ ਵੱਖ ਵੱਖ ਹੋ ਜਾਂਦੇ ਹਨ। ਕਿਸੇ ਨੂੰ ਕਿਸੇ ਵਾਸਤੇ) ਰੋਣ ਦੀ ਲੋੜ ਨਹੀਂ ਪੈਂਦੀ (ਰੋਣ ਦਾ ਲਾਭ ਨਹੀਂ ਹੁੰਦਾ) ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹਾ = ਕਿਥੇ? ਕਿਉਂ? ਰੋਤਿ = ਰੋਵੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La respiración se mezcla con la respiración del aire. ¿Por qué entonces uno se debe lamentar? (2)"