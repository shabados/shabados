[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਜੈ ਲਾਗਿ ਜਗੁ; ਖਪਿ ਖਪਿ ਮੂਆ ॥"
page = 113
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Attached with secular love, the world is greatly distracted to death."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰੀ ਮਮਤਾ ਨਾਲ ਚਿਮੜ ਕੇ ਦੁਨੀਆਂ, ਘਣੀ ਵਿਆਕੁਲ ਹੋ ਮਰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Attached to duality, the world is distracted and distressed to death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰੁ ਦੂਜੇ ਭਾਵ ਮੇਂ ਲਗ ਕਰ ਜਗਤੁ ਖਪਿ ਖਪਿ ਮੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ (ਉਸ ਨੂੰ ਵਿਸਾਰ ਕੇ ਤੇ ਸੁਖ ਦੀ ਖ਼ਾਤਰ) ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਫਸ ਕੇ ਦੁਖੀ ਹੋ ਕੇ ਆਤਮਕ ਮੌਤ ਸਹੇੜਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਜੈ = ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ। ਲਾਗਿ = ਲੱਗ ਕੇ। ਖਪਿ ਖਪਿ = ਦੁਖੀ ਹੋ ਹੋ ਕੇ। ਮੂਆ = ਆਤਮਕ ਮੌਤ ਸਹੇੜਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en amor a la dualidad, el mundo es destruido."