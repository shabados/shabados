[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਮਾਰਗ ਵਿਖ; ਲਵੈ ਨ ਲਾਵਣੀ ॥੧੭॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "None can vie with even the one step of the way of gurmukhs."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾਂ ਦੇ ਮਾਰਗ ਦੀ ਇਕ ਉਲਾਂਘ ਭਰਣੀ ਕਿਸੇ ਦੇ ਲਵੇ ਨਹੀਂ ਲਗਦੀ (ਉਸਦੀ ਬ੍ਰੋਬਰੀ ਕਿਵੇਂ ਬੀ ਨਹੀਂ ਹੋ ਸਕਦੀ)।"