[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਾਤਿ ਭਾਤਿ ਮਾਰੂ ਬਜੇ; ਮੰਡੇ ਸੁਭਟ ਰਨ ਆਇ ॥"
page = 813

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Bugles of death were sounded and the heroes came laced with the fighting attires and holding spears and bows and arrows."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਰ੍ਹਾਂ ਤਰ੍ਹਾਂ ਦੇ ਮਾਰੂ ਵਾਜੇ ਵਜਣ ਲਗੇ ਅਤੇ ਯੋਧੇ ਰਣ-ਭੂਮੀ ਵਿਚ ਆ ਕੇ ਡਟ ਗਏ।"