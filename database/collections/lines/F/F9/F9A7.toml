assets = ["SSA2"]
type = "primary"
data = "ਜਮਕੰਕਰੁ ਨੇੜਿ. ਨ ਆਇਆ ॥"
page = 623
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Death's courier comes not near him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੌਤ ਦਾ ਦੂਤ ਉਸ ਦੇ ਨਜ਼ਦੀਕ ਨਹੀਂ ਆਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Messenger of Death does not come near him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਜਮਦੂਤ ਨੇੜੇ ਨਹੀਂ ਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਮ-ਦੂਤ ਭੀ ਉਸ ਦੇ ਨੇੜੇ ਨਹੀਂ ਢੁਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਮ ਕੰਕਰੁ = {ਕਿੰਕਰੁ = किंकर} ਜਮ ਦਾ ਸੇਵਕ, ਜਮ-ਦੂਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A él no se le acercan los mensajeros de la muerte y,"