[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਨ ਜਾਨਿਆ; ਰਾਮ ਕਾ ॥"
page = 156
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He known not the Name of the Pervading God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਵਿਆਪਕ ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ ਨਹੀਂ ਜਾਣਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You do not know the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੈਂ ਰਾਮ ਕਾ ਨਾਮ ਜਾਨਿਆ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ! ਤੂੰ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਨਾਲ ਡੂੰਘੀ ਸਾਂਝ ਨਹੀਂ ਪਾਈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਮੁ ਨ ਜਾਨਿਆ = ਨਾਮ ਦੀ ਕਦਰ ਨ ਪਾਈ, ਨਾਮ ਨਾਲ ਡੂੰਘੀ ਸਾਂਝ ਨ ਪਾਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que no conoce el Nombre del Señor,"