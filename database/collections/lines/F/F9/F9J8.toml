[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਕਤ ਗੀਤ ਨਾਦ. ਧੁਨਿ ਗਾਵਤ; ਬੋਲਤ ਬੋਲ. ਅਜਾਏ ॥੧॥ ਰਹਾਉ ॥"
page = 820
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "An apostate's singing of obscene songs and melodious tunes and the utterance of useless words. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਧਰਮੀ ਦਾ ਗੰਦੇ ਗੀਤਾਂ ਅਤੇ ਸੁਰੀਲੇ ਰਾਗਾਂ ਦਾ ਆਲਾਪਣਾ ਅਤੇ ਬੇਹੂਦਾ ਬਚਨਾਂ ਦਾ ਉਚਾਰਨਾ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Singing his songs and tunes, and chanting his useless words. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਕਤ ਪੁਰਸ (ਨਾਦ) ਬਾਜੇ ਬਜਵਾਇ ਕਰ ਧੁਨ ਉਠਾਇ ਕਰ ਗੀਤ ਗਾਵਤੇ ਹੈਂ ਔਰੁ ਅਨੇਕ ਬੋਲੋਂ ਕੋ ਬੋਲਤੇ ਹੈਂ, ਸੋ ਸਭੀ (ਅਜਾਏ) ਵਿਅਰਥ ਹੈਂ। ਭਾਵ ਯਹਿ ਕਿ ਤਿਨ ਕੇ ਸ੍ਰਵਨ ਕਰਨੇ ਤੇ ਮਨ ਵਿਸ੍ਯੋਂ ਮੇਂ ਲੰਪਟਿ ਹੋ ਜਾਤਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਨਾਲੋਂ ਟੁੱਟੇ ਹੋਏ ਮਨੁੱਖ (ਜੇਹੜੇ ਗੰਦੇ) ਗੀਤਾਂ ਨਾਦਾਂ ਧੁਨੀਆਂ ਦੇ ਬੋਲ ਬੋਲਦੇ ਹਨ ਅਤੇ ਗਾਂਦੇ ਹਨ ਉਹ (ਆਤਮਕ ਜੀਵਨ ਵਾਸਤੇ) ਵਿਅਰਥ ਹਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਕਤ = ਪਰਮਾਤਮਾ ਨਾਲੋਂ ਟੁੱਟੇ ਹੋਏ ਬੰਦੇ। ਧੁਨਿ = ਸੁਰ। ਅਜਾਏ = ਅਜਾਇ, ਵਿਅਰਥ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y lo que parlotean en vano. (1-Pausa)"