[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨ ਕੂੜ ਤਿਆਗੇ; ਹਰਿ ਲਿਵ ਲਾਈ ॥"
page = 165
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "leave falsehood, and enshrine affection for God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਝੂਠ ਨੂੰ ਛਡ ਦਿੰਦੇ ਹਨ ਅਤੇ ਵਾਹਿਗੁਰੂ ਨਾਲ ਪ੍ਰੀਤ ਪਾ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "renounce falsehood and enshrine love for the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨੋਂ ਨੇ ਕੂੜ ਆਦਿ ਵਿਕਾਰ ਤਿਆਗੇ ਹੈਂ ਔਰ ਹਰੀ ਮੇਂ ਬ੍ਰਿਤੀ ਲਗਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਨੇ ਝੂਠੇ ਮੋਹ ਛੱਡ ਦਿੱਤੇ ਤੇ ਪਰਮਾਤਮਾ ਦੇ ਚਰਨਾਂ ਵਿਚ ਆਪਣੀ ਸੁਰਤ ਜੋੜ ਲਈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੂੜ = ਝੂਠੇ ਮੋਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entonaron su ser en el Señor"