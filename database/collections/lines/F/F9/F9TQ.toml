[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਸਿਮਰਨਿ; ਛੂਟਹਿ ਬੰਧ ॥"
page = 986
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose meditation bonds are loosened."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਇਬਾਦਤ ਦੁਆਰਾ ਜੂੜ ਕੱਟੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating on Him, one's bonds are untied."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਸਿਮਰਨੇ ਸੇ ਬੰਧਨ ਛੂਟਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਸਿਮਰਨ ਨਾਲ ਮੋਹ ਦੀਆਂ ਫਾਹੀਆਂ ਟੁੱਟ ਜਾਂਦੀਆਂ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੰਧ = ਬੰਧਨ, ਫਾਹੀਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y las amarras son desatadas;"