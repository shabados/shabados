[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੀ ਕੀਮਤਿ; ਕਿਨ ਬਿਧਿ ਹੋਇ ॥"
page = 361
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In what way can one appraise God's worth?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿਸ ਤਰੀਕੇ ਨਾਲ ਬੰਦਾ ਹਰੀ ਦਾ ਮੁੱਲ ਪਾ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How can anyone appraise the Lord's worth?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਸ਼੍ਨ: ਹਰਿ ਕੀ ਕੀਮਤ ਕਿਸ ਪ੍ਰਾਕਰ ਕਹੀਐ?☬ਉੱਤ੍ਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਕਿਸ ਤਰੀਕੇ ਨਾਲ (ਮਨੁੱਖ ਦੇ ਮਨ ਵਿਚ) ਪਰਮਾਤਮਾ (ਦੇ ਨਾਮ) ਦੀ ਕਦਰ ਪੈਦਾ ਹੋਵੇ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਨ ਬਿਧਿ = ਕਿਸ ਤਰੀਕੇ ਨਾਲ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿De qué forma podríamos evaluar a nuestro Señor?"