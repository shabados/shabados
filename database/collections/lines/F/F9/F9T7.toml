[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦਸ ਅਵਤਾਰੀ ਬਿਸਨੁ ਹੋਇ; ਵੈਰ ਵਿਰੋਧ ਜੋਧ ਲੜਵਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In his ten incarnations Visnu caused the opposing warriors fight each other."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਵਿਸ਼ਨੂੰ ਨੇ ਦਸ ਅਵਤਾਰ ਧਾਰਕੇ ਵੈਰ ਵਿਰੋਧ ਪਾਕੇ ਸੂਰਮੇ ਲੜਾਏ।"