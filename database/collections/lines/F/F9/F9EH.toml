data = "ਮ੍ਰਿਗ ਮਦਿਤ ਡਾਰਿ ਚੂਵਤ ਸਰਾਬ ॥"
page = 616

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "At that time the Sandal and roses were rubbed and the liquor of musk was prepared"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਸਤੂਰੀ ('ਮ੍ਰਿਗ ਮਦਿਤ') ਪਾ ਕੇ ਸ਼ਰਾਬ ਕੱਢੀ ਜਾਂਦੀ ਸੀ।"