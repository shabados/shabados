[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਕਉ ਚਿੰਤਾ; ਸੁਪਨੈ ਨਾਹਿ ॥੩॥"
page = 388
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "for him there is no anxiety even in dream."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਸੁਫ਼ਨੇ ਵਿੱਚ ਭੀ ਫਿਕਰ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "he suffers no anxiety, even in dreams. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੋ ਸੁਪਨੇ ਮੇਂ ਭੀ ਚਿੰਤਾ ਨਹੀਂ ਹੋਤੀ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕਦੇ ਭੀ ਕੋਈ ਚਿੰਤਾ ਪੋਹ ਨਹੀਂ ਸਕਦੀ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਪਨੈ = ਸੁਪਨੈ ਵਿਚ ਭੀ, ਕਦੇ ਭੀ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "para él no hay ninguna preocupación, ni siquiera en sueños. (3)"