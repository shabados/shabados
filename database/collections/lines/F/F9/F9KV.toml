data = "ਝੁਮੇ ਭੂਮ ਘੁਮੀ ਹੂਰ ॥"
page = 258

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors saturated with blood, are falling down on the earth and the heavenly damsels are roaming"

[[content]]
assets = ["RSJD"]
type = "translation"
