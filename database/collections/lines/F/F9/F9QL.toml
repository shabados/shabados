[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਸੋ ਤਪਾ; ਦਰਗਹਿ ਪਾਵੈ ਮਾਣੁ ॥੨॥"
page = 948
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, such an ascetic obtains honour in the Lord's court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਐਹੋ ਜੇਹਾ ਤਪੱਸਵੀ, ਸਾਈਂ ਦੇ ਦਰਬਾਰ ਅੰਦਰ ਪਤਿ ਆਬਰੂ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, such a man of disciplined meditation is honored in the Court of the Lord. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਜੋ ਸਤਿਗੁਰੋਂ ਕਾ ਸੇਵਕ ਹੂਆ ਹੈ, ਸੋ ਤਪਾ ਦਰਗਾਹ ਮੇਂ ਮਾਨ ਪਾਵਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਇਹ ਤਪ ਕਰਨ ਵਾਲਾ ਤਪਾ ਪ੍ਰਭੂ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਆਦਰ ਪਾਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "tal asceta, oh dice Nanak, es bendecido con Gloria en la Corte del Señor. (2)"