type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ; ਜਬ ਭਏ ਦਇਆਲ ॥"
page = 899
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the supreme Lord is merciful,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਸ਼੍ਰੋਮਣੀ ਸਾਹਿਬ ਮਿਹਰਬਾਨ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Supreme Lord God becomes merciful,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਪਰਮੇਸ੍ਵਰ ਦਿਆਲ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਜਦੋਂ ਕਿਸੇ ਜੀਵ ਉਤੇ ਦਇਆਵਾਨ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando el Señor es Compasivo contigo,"