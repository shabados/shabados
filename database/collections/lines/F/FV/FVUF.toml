[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤੁ ਨਾਹੀ ਕਿਛੁ; ਪਾਰਾਵਾਰਾ ॥"
page = 562
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It has no end or any limits."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਅਖੀਰ ਜਾ ਕੋਈ ਹੱਦ-ਬਨਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It has no end or limitations."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਪਾਰ ਉਰਾਰ ਕਾ ਅੰਤ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਪਾਰਲੇ ਉਰਲੇ ਬੰਨੇ ਦਾ ਕੁਝ ਅੰਤ ਨਹੀਂ ਪੈ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਰਾਵਾਰਾ = ਪਾਰ ਅਵਾਰ, ਪਾਰਲਾ ਉਰਲਾ ਬੰਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, Infinito y Sin Límite es Él."