type = "primary"
data = "ਦੁਖ ਹਰਣੀ ਦੇਵੰ ਇੰਦ੍ਰਾਣੀ ॥੫੭॥"
page = 679

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And you are the remover of the suffering of Indrani.57."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਦੁਖਾਂ ਨੂੰ ਹਰਨ ਵਾਲੀ (ਅਤੇ ਇੰਦਰ ਨੂੰ) ਇੰਦਰ ਦੀ ਪਦਵੀ ਦੇਣ ਵਾਲੀ ॥੫੭॥"