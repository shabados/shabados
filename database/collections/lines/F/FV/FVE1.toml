[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਜ਼ਾ ਬਖ਼ਸ਼ ਰੋਜ਼ੀ ਦਿਹੋ ਰਹਿਨੁਮਾਇ ॥੧॥"
page = 1408

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is Enlightener, Provider and Guide.(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਜ਼ਾ (ਖ਼ੁਸ਼ੀਆਂ) ਬਖ਼ਸ਼ਣ ਵਾਲਾ, ਰੋਜ਼ੀ ਦੇਣ ਵਾਲਾ ਅਤੇ ਪਥ-ਪ੍ਰਦਰਸ਼ਨ ਕਰਨ ਵਾਲਾ ਹੈ ॥੧॥"