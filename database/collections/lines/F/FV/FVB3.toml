[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਵਿਦਾਸੁ ਭਣੈ; ਜੋ ਜਾਣੈ ਸੋ ਜਾਣੁ ॥"
page = 486
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ravidas says, he alone is wise who knows that,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਵਿਦਾਸ ਆਖਦਾ ਹੈ, \"ਕੇਵਲ ਓਹੀ ਸਿਆਣਾ ਹੈ, ਜਿਹੜਾ ਇਹ ਜਾਣਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Ravi Daas, he alone is wise, who knows this:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਵਿਦਾਸ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਸ੍ਵਾਮੀ! ਗੁਰ ਗ੍ਯਾਨ ਕਰ ਇਸ ਭੇਦ ਕੋ ਜੋ ਜਾਨਤਾ ਹੈ, ਸੋ ਜਾਨਤਾ ਹੈ ਅਰਥਾਤ ਸੋ ਗ੍ਯਾਨੀ ਐਸਾ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਵਿਦਾਸ ਆਖਦਾ ਹੈ-ਅਸਲ ਸਿਆਣਾ ਉਹ ਮਨੁੱਖ ਹੈ ਜੋ ਇਹ ਜਾਣਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਣੈ = ਆਖਦਾ ਹੈ। ਜਾਣੁ = ਸਿਆਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Ravi Das, sólo es sabio aquél que sabe"