[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਬਹਿ ਕ੍ਰਿਸਨ ਸੋਊ ਕੀਓ; ਜੋ ਬ੍ਰਹਮਾ ਸਿਖ ਦੀਨ ॥"
page = 451

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then as told by Brahma, Krishna did all that"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਸਮੇਂ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਨੇ ਓਹੀ ਕੀਤਾ ਜੋ ਬ੍ਰਹਮਾ ਨੇ ਸਿਖਿਆ ਦਿੱਤੀ ਸੀ।"