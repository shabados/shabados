[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਨ ਫੂਲ ਮੀਠੇ ਰਸ ਰੋਗ ॥"
page = 1187
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Betel-leaves, flower-garland and sweet dainties lead to maladies."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਨ ਬੀੜੇ, ਫੁੱਲਾਂ ਦੇ ਹਾਰ ਅਤੇ ਮਿੱਠੀਆਂ ਨਿਆਮਤਾਂ ਬੀਮਾਰੀਆਂ ਉਤਪੰਨ ਕਰਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But betel leaves, garlands of flowers and sweet tastes lead only to disease."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਾਨੋਂ ਕੇ ਬੀੜੇ ਫੂਲੋਂ ਕੇ ਹਾਰ ਔਰ ਮੀਠੇ ਰਸ ਜੋ ਹੈਂ ਸਭ ਰੋਗੁ ਰੂਪ ਹੈਂ, ਭਾਵ ਅੰਤ ਕੋ ਦੁਖਦਾਈ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਇਹ ਪਾਨ ਫੁੱਲ ਮਿੱਠੇ ਪਦਾਰਥਾਂ ਦੇ ਸੁਆਦ-ਇਹ ਸਭ ਹੋਰ ਹੋਰ ਵਿਕਾਰ ਤੇ ਰੋਗ ਹੀ ਪੈਦਾ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "de hojas de betel, arreglos florales y sabores dulces,"