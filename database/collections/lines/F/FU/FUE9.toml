[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੀ ਸਾਹਿਬ ਬਾਹਰਾ; ਦੂਜਾ ਅਵਰੁ. ਨ ਜਾਣੈ ਕੋਇ ॥੨॥"
page = 991
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and recognises none other than the One Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਇਕ ਪ੍ਰਭੂ ਦੇ ਬਾਝੋਂ ਹੋਰ ਕਿਸੇ ਦੂਸਰੇ ਨੂੰ ਪਛਾਣੇ ਹੀ ਨਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He recognizes none other than the One Lord and Master. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਸੁਆਮੀ ਤੇ ਬਿਨਾ ਦੂਸਰਾ ਹੋਰ ਸੁਆਮੀ ਕੋਈ ਨਾ ਜਾਣੇ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਕ ਪਰਮਾਤਮਾ ਤੋਂ ਬਿਨਾ ਕਿਸੇ ਹੋਰ ਨੂੰ ਨਹੀਂ ਪਛਾਣਦਾ (ਕਿਸੇ ਹੋਰ ਦੀ ਖ਼ੁਸ਼ਾਮਦ-ਮੁਥਾਜੀ ਨਹੀਂ ਕਰਦਾ) ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਜਾਣੈ = ਨਹੀਂ ਪਛਾਣਦਾ, ਮੁਥਾਜੀ ਨਹੀਂ ਕਰਦਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no conocería a nadie más que al Único Señor.(2)"