[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿ ਦਰ ਵਕਤ ਸ਼ਬ ਚੂੰ ਖ਼ੁਸ਼ੇ ਰੋਜ਼ ਜੰਗ ॥੪੩॥੬॥"
page = 1410

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Which soothes during the wars and the lonely nights.”(42)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਮੈਨੂੰ ਰਾਤ ਵੇਲੇ ਅਤੇ ਜੰਗ ਵਿਚ ਪ੍ਰਸੰਨਤਾ ਪ੍ਰਦਾਨ ਕਰਨ ਵਾਲਾ ਹੋਵੇ ॥੪੩॥੬॥"