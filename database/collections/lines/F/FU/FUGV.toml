[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਰ ਊਪਰਿ; ਠਾਢੋ ਧਰਮ ਰਾਇ ॥"
page = 178
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Over, his head stands the Righteous Judge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਸਿਰ ਉਤੇ ਧਰਮ ਰਾਜਾ ਖਲੋਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the Righteous Judge of Dharma stands over their heads."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਿਸਾਬ ਲੇਨੇ ਕੇ ਵਾਸਤੇ ਸਿਰ ਪਰ ਧਰਮ ਰਾਇ ਖੜਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਿਰ ਉੱਤੇ ਧਰਮਰਾਜ ਖਲੋਤਾ ਹੋਇਆ ਹੈ (ਭਾਵ, ਮੌਤ ਦਾ ਸਮਾ ਨੇੜੇ ਆ ਰਿਹਾ ਹੈ, ਪਰ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਢੋ = ਖਲੋਤਾ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sobre su cabeza está la Ley del Señor"