data = "ਲੀਹਾ ਅੰਦਰਿ ਚਲੀਐ; ਜਿਉ ਗਾਡੀ ਰਾਹੁ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "As, a coach on the highway goes through the beaten tracks,"

