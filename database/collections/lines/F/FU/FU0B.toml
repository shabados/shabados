[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੇਦ ਪੁਰਾਨ; ਸਭ ਦੇਖੇ ਜੋਇ ॥"
page = 1195
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Vedas and Puranas all I have seen and searched."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵੇਦ ਤੇ ਪੁਰਾਣ ਮੈਂ ਸਾਰੇ ਵੇਖੇ ਅਤੇ ਖੋਜੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have searched through all the Vedas and the Puraanas."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬੇਦ ਔਰ ਪੁਰਾਨ ਸਭ (ਜੋਇ) ਢੂੰਢ ਦੇਖੇ ਹੈਂ; ਵਾ ਬੇਦ ਭੀ ਦੇਖੇ ਔ ਪੁਰਾਨ ਭੀ (ਜੋਇ) ਦੇਖੇ ਹੈਂ, ਭਾਵ ਸੋ ਸ੍ਰਬ ਠਾਂ ਹਰੀ ਕੋ ਪੂਰਨ ਬਤਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵੇਦ ਪੁਰਾਨ ਆਦਿਕ ਧਰਮ-ਪੁਸਤਕਾਂ ਭੀ ਖੋਜ ਕੇ ਵੇਖ ਲਈਆਂ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He buscado en los Vedas y en los Puranas,"