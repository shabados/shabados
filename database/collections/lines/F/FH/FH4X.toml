[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਮਾ ਰਸਟਰੀ ਕਾਮ ਰੂਪਾ ਕੁਮਾਰੀ ॥"
page = 117

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art Lakshmi, Kamakhya and Kumar Kanya."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਭ ਨੂੰ ਆਨੰਦ ਦੇਣ ਵਾਲੀ ('ਰਮਾ') ਰਾਜ-ਸਾਜ ('ਰਸਟਰੀ') ਕਰਨ ਵਾਲੀ, ਕਾਮ ਰੂਪ ਵਾਲੀ (ਕਾਮਾਖਿਆ) ਕੁਮਾਰੀ (ਨੂੰ ਨਮਸਕਾਰ ਹੈ);"