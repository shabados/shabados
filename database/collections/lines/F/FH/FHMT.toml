[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਲਹੁ ਸਿਤਾਬ; ਦੀਬਾਨਿ ਬੁਲਾਇਆ ॥੧॥"
page = 792
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Come quickly. Thou art summoned to the court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਛੇਤੀ ਤੁਰ। ਤੈਨੂੰ ਕਚਹਿਰੀ ਵਿੱਚ ਸੱਦਿਆ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Come immediately! You are summoned to His Court! ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਕਹਤੇ ਹੈਂ: ਚਲ ਸ਼ਿਤਾਬੀ ਤੇਰੇ ਕੋ ਕਚਹਿਰੀ ਮੇਂ ਬੁਲਾਇਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਛੇਤੀ ਚੱਲ, ਧਰਮਰਾਜ ਨੇ ਸੱਦਿਆ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਤਾਬ = ਛੇਤੀ। ਦੀਬਾਨਿ = ਦੀਵਾਨ ਨੇ, ਸਰਬ-ਰਾਜ ਨੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Apúrate, oh vida, pues el Señor de la Ley te llama a Su Corte. (1)"