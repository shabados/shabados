data = "ਸੇਵਕ ਸਿੱਖ ਹਮਾਰੇ ਤਾਰੀਅਹਿ ॥"
page = 1386

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Let my servants and disciples cross the world-ocean"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸੇਵਕਾਂ ਅਤੇ ਸਿੱਖਾਂ ਨੂੰ (ਭਵਸਾਗਰ ਵਿਚੋਂ) ਤਾਰ ਦਿਓ।"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਸੇਵਕ ਸਿੱਖ੍ਯ ਹਮਾਰੇ; ਤਾਰੀਅਹਿ ॥"