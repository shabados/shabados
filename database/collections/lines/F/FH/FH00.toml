[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਪੂਰੈ; ਜੁਗ ਚਾਰੇ ਜਾਤਾ ॥"
page = 1016
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In all the four ages, the Name is realised through the Perfect Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੌਹਾਂ ਹੀ ਯੁੱਗਾਂ ਅਦੰਰ, ਪੂਰਨ ਗੁਰਾਂ ਦੇ ਰਾਂਹੀਂ ਹੀ ਨਾਮ ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Throughout the four ages, it is known through the Perfect Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰ ਪੂਰਿਓਂ ਦ੍ਵਾਰਾ ਚਹੁ ਜੁਗੋਂ ਮੇਂ ਜਾਣਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਤੋਂ ਪੂਰੇ ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਹੀ (ਤੇਰੇ ਇਸ ਨਾਮ ਨਾਲ) ਸਾਂਝ ਪੈਂਦੀ ਆ ਰਹੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ ਪੂਰੈ = ਪੂਰੇ ਗੁਰੂ ਦੀ ਰਾਹੀਂ। ਜੁਗ ਚਾਰੇ = ਚਹੁੰਆਂ ਜੁਗਾਂ ਵਿਚ, ਸਦਾ ਹੀ। ਜਾਤਾ = ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ, ਸਮਝ ਪੈਂਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y es a través del Guru Perfecto que uno toma Conciencia de Él en cada época."