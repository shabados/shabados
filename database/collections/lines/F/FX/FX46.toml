[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਨ ਕਾਮ; ਮਿਲੇ ਗੁਰਦੇਵ ॥"
page = 1149
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting with the Divine Guru, my tasks are accomplished."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਈਸ਼ਵਰ ਸਰੂਪ ਗੁਰਾਂ ਨਾਲ ਮਿਲਣ ਦੁਆਰਾ, ਮੇਰੇ ਕਾਰਜ ਸੰਪੂਰਨ ਹੋ ਗਹੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My tasks are perfectly accomplished, meeting the Divine Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਸੇ ਮਿਲਣੇ ਕਰ ਸਭ (ਕਾਮ) ਮਨੋਰਥ ਪੂਰੇ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰਦੇਵ-ਪ੍ਰਭੂ ਨੂੰ ਮਿਲਿਆਂ ਸਾਰੀਆਂ ਕਾਮਨਾਂ ਪੂਰੀਆਂ ਹੋ ਜਾਂਦੀਆਂ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਮ = ਕਾਮਨਾ, ਇੱਛਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Encontrándome con el Dios Guru,"