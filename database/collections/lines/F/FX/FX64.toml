[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਅਸੀਣ ਮੁਰਾਦ ਦੀ ਕੰਧੀ ਤੋਣ ਵਾਕਫ ਨਹੀਣ ਹੋ ਸਕਦੇ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਤਾ ਚਸ਼ਮਿ ਮਾ ਬ-ਯਾਦਿ ਤੂ ਦਰਿਆ ਨਮੀ ਸ਼ਵਦ ॥੨੪॥੬॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Both the worlds are amazed and even desperately restless for his glimpse. (41) (1)"