[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਜਾ ਰਾਨੀ ਕੀ ਸਮ ਭਯੋ ॥"
page = 867

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Rani ruled the country and Raja became like a Rani."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਰਾਜਾ ਰਾਣੀ ਵਰਗਾ ਹੋ ਗਿਆ ਸੀ (ਅਰਥਾਤ ਉਸ ਦੀ ਸਥਿਤੀ ਰਾਣੀ ਜਿਹੀ ਹੋ ਗਈ ਸੀ)।"