[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਨਦਰੀ ਪਾਈਐ; ਕਰਮਿ ਪਰਾਪਤਿ ਹੋਇ ॥੨॥"
page = 1250
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, if man's good destiny awakes, the attains unto the Merciful Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਜੇਕਰ ਇਨਸਾਨ ਦੀ ਚੰਗੀ ਪ੍ਰਾਲਭਧ ਜਾਗ ਉਠੇ ਤਾਂ ਉਹ ਮਿਹਰਬਾਨ ਮਾਲਕ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, by His Glance of Grace, the Merciful Lord is attained. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: (ਨਦਰੀ) ਵਾਹਿਗੁਰੂ ਤਬ ਪਾਈਤਾ ਹੈ, ਜਬ ਪੂਰਬਲਾ ਉਤਮ ਕਰਮ ਪ੍ਰਾਪਤਿ ਹੋ ਜਾਵੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਸਿਫ਼ਤ-ਸਾਲਾਹ ਭੀ ਪ੍ਰਭੂ ਦੀ ਮਿਹਰ ਦੀ ਨਜ਼ਰ ਨਾਲ ਮਿਲਦੀ ਹੈ, ਪ੍ਰਭੂ ਦੀ ਬਖ਼ਸ਼ਸ਼ ਨਾਲ ਹੀ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਦਰਿ = ਮਿਹਰ ਦੀ ਨਜ਼ਰ ਨਾਲ। ਕਰਮਿ = ਬਖ਼ਸ਼ਸ਼ ਦੀ ਰਾਹੀਂ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak dice, mediante la Gracia del Señor, Él es obtenido y el Destino de uno despierta. (2)"