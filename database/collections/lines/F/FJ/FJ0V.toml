[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਨਿਰਮਲੁ ਸਦਾ ਸੁਖਦਾਤਾ; ਮਨਿ ਚਿੰਦਿਆ ਫਲੁ ਪਾਉ ॥੩॥"
page = 565
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Immaculate Lord is ever the Giver of bliss and from Him, man obtains his heart desired fruits."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤਰ ਪ੍ਰਭੂ ਸਦੀਵ ਹੀ ਆਰਾਮ ਬਖਸ਼ਣਵਾਲਾ ਹੈ। ਉਸ ਪਾਸੋਂ ਆਦਮੀ ਆਪਣੇ ਚਿੱਤ-ਚਾਹੁੰਦੇ ਮੇਵੇ ਹਾਸਲ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Immaculate Lord is forever the Giver of peace; from Him, one receives the fruits of his heart's desires. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਸੁਧ ਹੈ ਔਰ ਸਦਾ ਸੁਖੋਂ ਕਾ ਦੇਨੇ ਹਾਰਾ ਹੈ, ਤਿਸ ਸੇ ਤੂੰ ਮਨ ਇਛਤ ਫਲ ਕੋ ਪਾਉ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਇੰਜ ਮਨ-ਇੱਛਤ ਫਲ ਹਾਸਲ ਕਰ! ਪਰਮਾਤਮਾ ਸਦਾ ਪਵਿਤ੍ਰ ਹੈ ਤੇ ਸਦਾ ਸੁਖ ਦੇਣ ਵਾਲਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਮਲੁ = ਪਵਿਤ੍ਰ। ਮਨਿ = ਮਨ ਵਿਚ। ਚਿੰਦਿਆ = ਚਿਤਵਿਆ ਹੋਇਆ। ਪਾਉ = ਪ੍ਰਾਪਤ ਕਰ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "canta siempre Sus Alabanzas, porque tu Inmaculado Señor es el Dador de Éxtasis y gracias a Él uno consigue lo que realmente busca. (3)"