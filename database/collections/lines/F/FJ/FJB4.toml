data = "ਨ ਸੰਕਾ ਬਿਚਾਰੈ ॥"
page = 68

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors are striking their weapons, they do not think of the impending death."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਮਨ ਵਿਚ) ਕੋਈ ਸ਼ੰਕਾ ਨਹੀਂ ਵਿਚਾਰਦੇ ਸਨ।"