[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜੇਹੀ ਕਲੀ ਕਨੇਰ ਦੀ; ਮਨਿ ਤਨਿ ਦੁਹੁ ਭਿਤੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The oleander bud has two aspects; externally it is beautiful but internally it is poisonous."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਨੇਰ ਦੀ ਕਲੀ ਮਨੋਂ ਤਨੋਂ ਹੀ ਹੁੰਦੀ ਹੈ (ਦੇਖਣ ਨੂੰ ਸੋਹਣੀ ਅੰਦਰੋਂ ਵਿਹੁਲੀ ਹੈ)।"