[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿ ਕਰਾਵੈ ਸੋ ਕਰਣਾ ॥"
page = 627
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever Thou makest them do,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਛ ਤੂੰ ਉਨ੍ਹਾਂ ਕੋਲੋਂ ਕਰਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever You cause us to do, we do."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੁਮ ਕਰਮ ਕਰਵਾਤੇ ਹੋ ਸੋ ਜੀਵ ਕੋ ਕਰਨਾ ਪੜਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਸੀਂ ਜੀਵ ਉਹੀ ਕੁਝ ਕਰ ਸਕਦੇ ਹਾਂ ਜੋ ਕੁਝ ਪਰਮਾਤਮਾ ਸਾਥੋਂ ਕਰਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਾਵੈ = ਕਰਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eso que está en Tu Voluntad lo hago y Nanak,"