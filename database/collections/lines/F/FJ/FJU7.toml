[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਦਰਿ ਸੋਭਾ; ਮਹਾ ਉਤਮ ਬਾਣੀ ॥"
page = 317
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He attains honour in God's court and has supremely sublime speech."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਵਾਹਿਗੁਰੂ ਦੇ ਦਰਬਾਰ ਅੰਦਰ ਪੱਤ ਆਬਰੂ ਪਾਉਂਦਾ ਹੈ ਅਤੇ ਪ੍ਰਮ ਸ਼੍ਰੇਸ਼ਟ ਹੈ ਉਸ ਦੀ ਬੋਲਚਾਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is honored in the Court of the Lord, and his speech is the most sublime."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਅਤੀ ਉਤਮ ਬਾਣੀ ਬੋਲਤੇ ਹੈਂ, ਯਾਂ ਤੇ ਉਨ ਕੀ ਹਰੀ ਦਹਗਾਹ ਮੇਂ ਸੋਭਾ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਕਰਕੇ) ਉਸ ਦੀ ਬੜੀ ਉੱਤਮ ਬੋਲੀ ਤੇ ਹਰੀ ਦੀ ਦਰਗਾਹ ਵਿਚ ਸੋਭਾ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es glorificado en la Corte del Señor y su habla se vuelve Sublime."