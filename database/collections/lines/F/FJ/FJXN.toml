[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਜਿ ਅਭਿਮਾਨੁ; ਜਨਮ ਮਰਣੁ ਨਿਵਾਰਹੁ ॥"
page = 191
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Shed thy self-conceit and end thine births and deaths."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਸਵੈ-ਹੰਗਤਾ ਛੱਡ ਦੇ ਅਤੇ ਆਪਣੇ ਜਨਮ ਤੇ ਮਰਣ ਨੂੰ ਖ਼ਤਮ ਕਰ ਲੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Renounce your arrogant pride, and end the cycle of birth and death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਭਿਮਾਨ ਤਿਆਗਨ ਕਰੋ, ਤਿਸ ਕਰ ਜਨਮ ਮਰਨ ਕੋ ਨਿਵਾਰਨ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮੇਰੇ ਵੀਰ! ਆਪਣੇ ਅੰਦਰੋਂ) ਅਹੰਕਾਰ ਦੂਰ ਕਰ ਕੇ ਜਨਮ ਮਰਨ ਦਾ ਗੇੜ ਮੁਕਾ ਲੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਜਿ = ਛੱਡ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Termina esta ronda de nacimientos y muertes aquietando tu ego,"