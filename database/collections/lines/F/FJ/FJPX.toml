data = "ਪੂਰਨ ਕਰਾ ਗ੍ਰੰਥ ਤਤਕਾਲਾ ॥"
page = 1388

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Mahakal became kind, He immediately caused me to complete this book"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਸੇ ਵੇਲੇ (ਮੈਂ ਇਹ) ਗ੍ਰੰਥ ਮੁਕੰਮਲ ਕਰ ਲਿਆ।"

[[content]]
