[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਿਧਿਪਤਿ ਅਸਤ੍ਰ ਕਹਿ ਪਾਸਿ ਕੇ; ਨਾਮ ਚੀਨਿ ਚਿਤਿ ਰਾਖਿ ॥੩੬੫॥"
page = 734

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After saying the words “Nari, Aasuri, Kinnari and Suri” and then uttering the words “Niddihi Pati Astar”, the names of Paash are recognized in the mind.365."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਮਗਰੋਂ) 'ਨਿਧ ਪਤਿ ਅਸਤ੍ਰ' ਕਹਿ ਦਿਓ। (ਇਹ) ਪਾਸ ਦੇ ਨਾਮ ਮਨ ਵਿਚ ਰਖ ਲਵੋ ॥੩੬੫॥"