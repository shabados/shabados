data = "ਜਾਨਕ ਲੂਟਿ ਬਿਧਾ ਤਹਿ ਲਏ ॥੩੨॥"
page = 946

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They looked like as if the Creator had robbed them off their right.(32)"

[[content]]
