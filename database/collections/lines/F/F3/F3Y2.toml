[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਬਿਮਾਤ੍ਰਾ ਭਾਨ ਕੀ; ਰਾਮਦਾਸ ਪੁਰ ਬੀਚ ॥"
page = 825

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "A widow used to live in the city of Ramdaspur."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਭਾਨ ਨਾਂ ਦੇ ਵਿਅਕਤੀ ਦੀ ਮਤਰੇਈ ਮਾਂ ਰਾਮਦਾਸ ਪੁਰ ਵਿਚ ਰਹਿੰਦੀ ਸੀ।"