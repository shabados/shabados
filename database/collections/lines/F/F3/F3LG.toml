[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਫੁਲੁ ਭਾਉ; ਫਲੁ ਲਿਖਿਆ ਪਾਇ ॥"
page = 25
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "According to the ordained destiny the mortal attains the flower and fruit of Lord's love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲਿਖੀ ਹੋਈ ਪ੍ਰਾਲਭਧ ਅਨੁਸਾਰ ਪ੍ਰਾਣੀ ਪ੍ਰਭੂ ਦੀ ਪ੍ਰੀਤ ਦਾ ਪੁਸ਼ਪ ਤੇ ਮੇਵਾ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Flower and the Fruit of the Lord's Love are obtained by pre-ordained destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਕੀ ਭਾਵਨਾ ਹੀ ਫੂਲੁ ਹੈ, ਤਿਸ ਕੇ ਅਨੁਸਾਰ ਹੀ ਬੇਦ ਸ਼ਾਸਤ੍ਰੋਂ ਮੇਂ ਫਲੁ ਪਾਵਣਾ ਲਿਖ੍ਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸੇ ਤਰ੍ਹਾਂ ਜਿਹੋ ਜਿਹੀ) ਭਾਵਨਾ ਦਾ ਫੁੱਲ (ਕਿਸੇ ਮਨੁੱਖ ਦੇ ਅੰਦਰ ਹੈ) ਉਸੇ ਅਨੁਸਾਰ ਉਸ ਨੂੰ ਜੀਵਨ-ਫਲ ਲੱਗਦਾ ਹੈ। (ਉਸ ਦਾ ਜੀਵਨ ਬਣਦਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਉ = ਭਾਵਨਾ, ਰੁਚੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El hombre fluye de acuerdo a su mente y así obtiene el fruto, tal y como es su Destino."