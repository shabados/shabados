[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਰਿ ਅੰਧਕ ਨਾਸ ਸੁਨਿਯੋ ਜਬ ਹੀ ॥"
page = 182

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Indra heard about the destruction of Andhakasura he was very much pleased."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਉਸ ਨੇ ਵੈਰੀ ਅੰਧਕ ਦਾ ਨਾਸ ਹੋਣਾ ਸੁਣਿਆ।"