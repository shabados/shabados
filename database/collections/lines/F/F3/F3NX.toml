[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਜ ਤਹਾਂ ਜੂਝਤ ਭਯੋ ਹਿੰਮਤ ਗਯੋ ਪਰਾਇ ॥"
page = 69

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "His horse was killed there, but Himmat fled."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦਾ) ਘੋੜਾ ਉਥੇ ਮਾਰਿਆ ਗਿਆ ਅਤੇ ਹਿੰਮਤ (ਆਪ) ਭਜ ਗਿਆ।"