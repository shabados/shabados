[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਨਾਮੁ ਨਿਧਾਨੁ ਹੈ; ਗੁਰਮੁਖਿ ਪਾਇਆ ਜਾਇ ॥"
page = 590
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, the Name is a treasure and, through the Guru, it is obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨਾਮ ਇਕ ਖਜਾਨਾ ਹੈ। ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਇਹ ਪਾਇਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Naam, the Name of the Lord, is the treasure, which the Gurmukhs obtain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜੋ ਨਾਮ ਰੂਪੀ ਨਿਧਾਨ ਖਜਾਨਾ ਹੈ, ਸੋ ਗੁਰੋਂ ਦੁਆਰੇ ਪਾਇਆ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਨਾਮ (ਹੀ ਅਸਲ) ਖ਼ਜ਼ਾਨਾ ਹੈ, ਜੋ ਸਤਿਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੋ ਕੇ ਮਿਲ ਸਕਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, el Nombre del Señor es el Tesoro y es obtenido a través del Guru."