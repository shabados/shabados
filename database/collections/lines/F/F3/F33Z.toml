type = "primary"
data = "ਚਤੁਰ ਬੇਦ ਕਥਿਅੰ ਕੁਰਾਣੰ ਪੁਰਾਣੰ ॥੨੪॥"
page = 41

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou hast also related the four Vedas, the Quran and the Puranas! 24"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਚਾਰ ਵੇਦਾਂ, ਕੁਰਾਨ ਅਤੇ ਪੁਰਾਣਾਂ ਦਾ ਕਥਨ ਕੀਤਾ ਹੈ ॥੨੪॥"