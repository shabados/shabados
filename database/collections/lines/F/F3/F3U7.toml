type = "primary"
data = "ਭਰਤ ਪਤ੍ਰ ਖੇਚਰੰ ਕਹੂੰ ਚਾਵੰਡ ਚਿਕਾਰੈਂ ॥"
page = 238

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere the vampires are filling their vessels with blood"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ ਜੋਗਣੀਆਂ ਲਹੂ ਦੇ ਖੱਪਰ ਭਰਦੀਆਂ ਹਨ ਅਤੇ ਕਿਤੇ ਇੱਲਾਂ ਚੀਕਦੀਆਂ ਹਨ।"