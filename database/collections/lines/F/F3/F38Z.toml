[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਸੁ ਜਪਤ; ਕਈ ਬੈਕੁੰਠ ਵਾਸੁ ॥"
page = 236
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By remembering whom many acquire abode in heaven,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ ਘਨੇਰੇ ਸੁਰਗ ਵਿੱਚ ਵਾਸਾ ਪਾ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating on Him, many acquire a home in the heavens."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਨਾਮ ਜਪਣੇ ਸੇ ਕਈ ਪੁਰਸ਼ੋਂ ਕਾ ਬੈਕੁੰਠ ਮੇਂ ਵਾਸਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਨਾਮ ਜਪਿਆਂ ਆਤਮਕ ਆਨੰਦ ਮਿਲਦਾ ਹੈ ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਟਿਕਾਣਾ ਮਿਲ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Meditando en Él, uno habita en la Gloria,"