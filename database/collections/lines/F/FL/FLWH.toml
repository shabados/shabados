[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛੂਟਸਿ ਪ੍ਰਾਣੀ; ਗੁਰਮੁਖਿ ਦਾਸਾ ॥੧॥ ਰਹਾਉ ॥"
page = 412
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Becoming the slave of God through the Guru, the mortal is emancipated. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੁਆਰਾ ਵਾਹਿਗੁਰੂ ਦਾ ਗੋਲਾ ਬਣ ਕੇ, ਫਾਨੀ ਬੰਦਾ ਬੰਦ-ਖਲਾਸ ਹੋ ਜਾਂਦਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mortal is emancipated, as Gurmukh, as the Lord's slave. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਗੁਰਾਂ ਦੁਆਰੇ ਦਾਸਾ ਭਾਉ ਧਾਰੇ ਤਬ ਪ੍ਰਾਣੀ ਛੂਟਤਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਪ੍ਰਾਣੀ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਪਰਮਾਤਮਾ ਦਾ ਦਾਸ (ਭਗਤ) ਬਣ ਜਾਂਦਾ ਹੈ ਉਹ (ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਤੋਂ) ਬਚ ਜਾਂਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo Aquél que sirve al Guru es liberado. (1‑Pausa)"