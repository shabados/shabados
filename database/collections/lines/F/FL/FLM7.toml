data = "ਸੁਭਟ ਸਿੰਘ ਕਹ ਜੀਤ ਬਰਤ ਭੀ ॥੧੧੨॥"
page = 877

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She did not fear of any brave. She won over Subhat Singh and made love with him(112)(l)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੁਭਟ ਸਿੰਘ ਨੂੰ ਜਿਤ ਕੇ ਉਸ ਨਾਲ ਵਿਆਹ ਕੀਤਾ ॥੧੧੨॥"