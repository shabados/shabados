[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਬਿਆਪਿਕ; ਅੰਤਰ ਹਰੀ ॥"
page = 1292
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within all the beings is diffused my Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਜੀਵਾਂ ਦੇ ਅੰਦਰ ਮੇਰਾ ਮਾਲਕ ਰਮ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is diffused in the inner beings of all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਹਰੀ ਸਰਬ ਕੇ ਅੰਤਰ ਬ੍ਯਾਪੁਕ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਹਰੀ-ਪ੍ਰਭੂ ਸਭ ਵਿਚ ਵਿਆਪਕ ਹੈ, ਸਭ ਦੇ ਅੰਦਰ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todas las criaturas del mundo se encuentran en Su Casa."