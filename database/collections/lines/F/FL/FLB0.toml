[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਾਈ ਰੇ; ਰਾਮੁ ਕਹਹੁ ਚਿਤੁ ਲਾਇ ॥"
page = 22
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Brother! repeat God's Name by fixing thy attention."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਰਾ! ਆਪਣੀ ਬ੍ਰਿਤੀ ਜੌੜ ਕੇ ਹਰੀ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਣ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Siblings of Destiny, chant the Lord's Name, and focus your consciousness on Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਰਾਮ ਨਾਮ ਕੋ ਚਿਤੁ ਲਗਾਇ ਕਰ ਕਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਚਿੱਤ ਲਾ ਕੇ (ਪ੍ਰੇਮ ਨਾਲ) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Hermano, recita el Nombre de tu Señor con toda tu mente."