[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੋਈ ਵੀ ਉਸ ਦਾ ਬੰਦਾ ਹੋ ਗਿਆ, ਉਹ ਸੌਖਾ ਹੋ ਗਿਆ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਹਰ ਕਸੇ ਕੂ ਬੰਦਾ ਸ਼ੁਦ ਆਸੂਦਾ ਅਸਤ ॥੩੦੫॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Whether older folks or the youngsters, all have their wishes fulfilled from him,"