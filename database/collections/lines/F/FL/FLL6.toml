[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸੋਈ ਤਾਂਬਾ ਜਿਸਤ ਮਿਲਿ; ਪਿਤਲ ਅਵਲੋਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The same copper mixed with zinc appears in the form of brass."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਉਹੋ ਤਾਂਬਾ ਜਿਸਤ ਨਾਲ ਮਿਲਕੇ ਪਿੱਤਲ ਦਿਖਾਈ ਦਿੰਦਾ ਹੈ।"