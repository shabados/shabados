[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹ ਨਾਮੁ ਸਮਾਧਿਓ; ਹਰਖੁ ਸੋਗੁ. ਸਮ ਕਰਿ ਸਹਾਰੇ ॥"
page = 1393
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who contemplates the Lord's Name; he bears weal and woe alike."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਦਾ ਹੈ। ਉਹ ਖੁਸ਼ੀ ਅਤੇ ਗਮੀ ਨੂੰ ਇਕ ਸਮਾਨ ਸਹਾਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who meditates on the Naam in Samaadhi, endures sorrow and joy as one and the same."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪੁਰਸ਼ ਨੇ ਤਿਸ ਨਾਮ ਕੋ (ਸੰ) ਭਲੀ ਪ੍ਰਕਾਰ ਸੇ ਅਰਾਧਿਆ ਹੈ ਤਿਸ ਨੇ ਹਰਖ ਔ ਸੋਗ ਆਦੀ ਸਮ ਕਰ ਕੇ ਸਹਾਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੇ ਹਰੀ ਨਾਮ ਨੂੰ ਸਿਮਰਿਆ ਹੈ, ਉਨ੍ਹਾਂ ਨੇ ਖ਼ੁਸ਼ੀ ਤੇ ਚਿੰਤਾ ਨੂੰ ਇਕ ਸਮਾਨ ਜਰਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਹ = ਜਿਨ੍ਹਾਂ ਨੇ। ਸਮਾਧਿਓ = ਜਪਿਆ ਹੈ। ਹਰਖੁ ਸੋਗੁ = ਖ਼ੁਸ਼ੀ ਤੇ ਗ਼ਮੀ, ਆਨੰਦ ਤੇ ਚਿੰਤਾ। ਸਮ ਕਰਿ = ਇੱਕੋ ਜਿਹੇ ਕਰ ਕੇ, ਇਕ ਸਮਾਨ। ਸਹਾਰੇ = ਜਰੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Naam da soporte a los sistemas solares y a las galaxias."