[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਘਟ ਅਵਘਟ ਭਰਪੂਰਿ, ਰਿਦੈ ਸਮਾਵਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The one who resides in all hearts is dwelling in their hearts."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਜਾਣਦੇ ਹਨ) ਕਿ ਘਟਾਂ ਤੇ ਅਵਘਟਾਂ ਵਿਖੇ ਪੂਰਨ ਹੋਕੇ ਰਿਦੇ ਵਿਖੇ ਸਮਾਇ ਰਿਹਾ ਹੈ।"