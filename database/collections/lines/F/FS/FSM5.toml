[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਇ. ਨ ਕਿਸ ਹੀ ਸੰਗਿ; ਕਾਹੇ ਗਰਬੀਐ ॥"
page = 398
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "No one is a companion of another so why be one proud of one's relations?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਜਣਾ ਕਿਸੇ ਦਾ ਸਾਥੀ ਨਹੀਂ, ਇਸ ਲਈ ਆਪਣੇ ਸਨਬੰਧੀਆਂ ਦਾ ਕੋਈ ਕਿਉਂ ਹੰਕਾਰ ਕਰੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one is anyone's companion; why take any pride in others?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਕਿਸੀ ਕਾ ਸੰਗੀ ਨਹੀਂ ਹੈ ਫਿਰ ਕ੍ਯੋਂ ਹੰਕਾਰ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮੇਰੀ ਜਿੰਦੇ!) ਕੋਈ ਮਨੁੱਖ ਸਦਾ ਕਿਸੇ ਦੇ ਨਾਲ ਨਹੀਂ ਨਿਭਦਾ (ਇਸ ਵਾਸਤੇ ਸੰਬੰਧੀ ਆਦਿਕਾਂ ਦਾ) ਕੋਈ ਮਾਣ ਨਹੀਂ ਕਰਨਾ ਚਾਹੀਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਸ ਹੀ ਸੰਗਿ = ਕਿਸੇ ਦੇ ਭੀ ਨਾਲ। ਗਰਬੀਐ = ਮਾਣ ਕਰੀਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nadie mantiene la compañía de otro; así que, ¿por qué es que te enorgulleces de tus parientes?"