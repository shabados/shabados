[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਾਲੁ ਮੁਲਕੁ ਚਤੁਰੰਗ ਦਲ, ਦੁਨੀਆ ਪਤਿਸਾਹੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "If being master of army having four divisions (elephant, chariot, horse and infantry), country and the wealth;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਦੌਲਤ ਮੁਲਖ ਤੇ ਚਾਰ ਪ੍ਰਕਾਰ ਦੀ ਸੈਨਾ ਹੋਵੇ (ਅਤੇ ਸਾਰੀ) ਦੁਨੀਆਂ ਦੀ ਪਾਤਸ਼ਾਹਤ (ਕਰੇ)।"