[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿੰਦਾਬਨ ਬ੍ਰਿਖਭਾਨ ਕੀ; ਸੁਤਾ ਰਾਧਿਕਾ ਨਾਮ ॥"
page = 822

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In the city of Brindaban, what did Radhika, the daughter of Brikh Bhan, do?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਿੰਦਰਾਬਨ ਵਿਚ ਰਾਧਿਕਾ ਨਾਂ ਦੀ ਬ੍ਰਿਖਭਾਨ ਦੀ ਪੁੱਤਰੀ ਸੀ।"