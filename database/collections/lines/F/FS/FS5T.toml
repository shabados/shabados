[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਥਰ ਥਰ ਕੰਪੈ ਜੀਅੜਾ; ਥਾਨ ਵਿਹੂਣਾ ਹੋਇ ॥"
page = 934
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without its moorings, the soul violently trembles and reels."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਟਿਕਾਣੇ ਤੋਂ ਬਗੈਰ ਜਿੰਦੜੀ ਜ਼ੋਰ ਨਾਲ ਕੰਬਦੀ ਅਤੇ ਲੜਖੜਾਉਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The soul trembles and shakes, when it loses its mooring and support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹੁ ਜੀਵ ਤੇਰੇ ਸਰੂਪ ਤੇ ਵਿਹੂਣਾਂ ਹੋਇਆ ਥਰਨ ਥਰਨ ਅਰਥਾਤ ਅਤੀ ਕਾਂਪਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਦੋਂ ਇਹ) ਨਿਮਾਣੀ ਜਿੰਦ (ਗੋਪਾਲ ਦਾ) ਸਹਾਰਾ ਗੰਵਾ ਬੈਠਦੀ ਹੈ ਤਾਂ ਥਰਥਰ ਕੰਬਦੀ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅੜਾ = ਨਿਮਾਣਾ ਜੀਵ, ਨਿਮਾਣੀ ਜਿੰਦ (ਨੋਟ: 'ਜੀਵ' ਲਫ਼ਜ਼ ਤੋਂ 'ਜੀਅੜਾ' ਅਲਪਾਰਥਕ ਨਾਂਵ ਹੈ)। ਥਾਨੁ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando pierde su orientación, el Alma tiembla y se tambalea."