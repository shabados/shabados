[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗੁਸੇ ਆਈ ਕਾਲਕਾ; ਹਥਿ ਸਜੇ ਲੈ ਤਰਵਾਰ ਕਉ ॥"
page = 127

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The goddess Kali got enraged, holding her sword in her right hand"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਜੇ ਹੱਥ ਵਿਚ ਤਲਵਾਰ ਲੈ ਕੇ ਕਾਲਕਾ ਗੁੱਸੇ ਵਿਚ ਆਈ।"