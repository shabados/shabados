[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਨ ਕਰਾਵਨਹਾਰ; ਸੁਆਮੀ ॥"
page = 266
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is the Doer and Prompter of actions."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕੰਮਾਂ ਦੇ ਕਰਨ ਵਾਲਾ ਤੇ ਕਰਾਉਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Creator Lord, Cause of causes, O Lord and Master,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਕਰਨ ਕਰਾਵਨ ਹਾਰ ਸਰਬ ਕਾ ਸ੍ਵਾਮੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪ ਹੀ ਸਭ ਕੁਝ ਕਰਦਾ ਹੈਂ, ਤੇ, ਆਪ ਹੀ ਕਰਾਉਂਦਾ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú eres la Causa de toda acción"