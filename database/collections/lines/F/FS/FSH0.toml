[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ; ਪ੍ਰਭ ਸੰਗਿ ਮਿਲਾਇਆ ॥"
page = 105
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Showing his mercy the Guru has united me with the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਮਿਹਰ ਧਾਰ ਕੇ, ਗੁਰੂ ਨੇ ਮੈਨੂੰ ਸੁਆਮੀ ਨਾਲ ਮਿਲਾ ਦਿਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Showering His Mercy upon us, God has united us with Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਤੈਨੇ ਅਪਨੇ ਸਾਥ ਮਿਲਾਇ ਲੀਆ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਨੇ) ਕਿਰਪਾ ਕਰਕੇ (ਜਿਸ ਮਨੁੱਖ ਨੂੰ) ਪ੍ਰਭੂ ਦੇ ਚਰਨਾਂ ਵਿਚ ਜੋੜ ਦਿੱਤਾ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor, en Su Misericordia, nos une con Sus Santos,"