[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਪਦਾਰਥੁ ਪਾਇ ਕੈ; ਕਬੀਰਾ ਗਾਂਠਿ. ਨ ਖੋਲੑ ॥"
page = 1365
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Attaining to the Lord's treasures, O Kabir, open thou not its knot."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੀ ਦੌਲਤ ਨੂੰ ਪਾ ਕੇ, ਹੇ ਕਬੀਰ! ਤੂੰ ਇਸ ਦੀ ਗੱਠ ਨੂੰ ਖੋਲ੍ਹ ਨਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Treasure of the Lord is obtained, O Kabeer, but do not undo its knot."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕਬੀਰ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਹੇ ਭਾਈ! ਰਾਮ ਨਾਮ ਰੂਪੀ ਪਦਾਰਥ ਪਾਇ ਕਰ ਕੇ ਗਾਂਠ ਕੋ ਨਾ ਖੋਲ, ਭਾਵ ਅਧਿਕਾਰੀ ਬਿਨਾਂ ਉਪਦੇਸ਼ ਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਧਰ ਤੱਕੋ, 'ਦੁਨੀਆ' ਦੀ ਖ਼ਾਤਰ ਹੀ ਦੌੜ-ਭੱਜ ਹੈ; ਸੋ) ਹੇ ਕਬੀਰ! (ਚੰਗੇ ਭਾਗਾਂ ਨਾਲ) ਜੇ ਤੈਨੂੰ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦੀ ਸੋਹਣੀ ਵਸਤ ਮਿਲ ਗਈ ਹੈ ਤਾਂ ਇਹ ਗਠੜੀ ਹੋਰਨਾਂ ਅੱਗੇ ਨਾਹ ਖੋਲ੍ਹਦਾ ਫਿਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਦਾਰਥੁ = ਸੋਹਣੀ ਵਸਤ। ਪਾਇ ਕੈ = ਹਾਸਲ ਕਰ ਕੇ, ਜੇ ਤੈਨੂੰ ਮਿਲ ਗਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Tesoro del Señor es obtenido, oh dice Kabir, pero no deshagas el nudo, no hay mercado para venderlo,"