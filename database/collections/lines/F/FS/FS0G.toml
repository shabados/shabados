[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾਂ ਪੂਰਨ ਹੋਈ, ਮਨਸਾ ਮੇਰੀ ॥੩॥"
page = 390
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then was my desire fulfilled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਮੇਰੀ ਖਾਹਿਸ਼ ਪੂਰੀ ਹੋ ਗਈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "my desires were fulfilled. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਮੇਰੀ ਇਛ੍ਯਾ ਪੂਰਨ ਹੋ ਗਈ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਤੋਂ ਮੇਰੀ ਹਰੇਕ ਮਨੋ-ਕਾਮਨਾ ਪੂਰੀ ਹੋ ਰਹੀ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਸਾ = {मनीषा} ਮਨ ਦੀ ਇੱਛਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Dios, todos mis deseos se satisficieron. (3)"