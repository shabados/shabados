[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਥਿਰ ਥਿਰ; ਚਿਤ ਥਿਰ ਹਾਂ ॥"
page = 409
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This immovable and steady and firm is your mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਅਹਿੱਲ, ਅਟੱਲ ਤੇ ਦ੍ਰਿੜ੍ਹ ਹੈ ਤੇਰਾ ਮਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Thus your consciousness shall be stable and steady and firm."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਥਿਰ ਰੂਪ ਸਤਸੰਗ ਦ੍ਵਾਰਾ ਜਿਨੋਂ ਨੇ ਥਿਰ ਰੂਪ ਪਰਮਾਤਮਾ ਮੇਂ ਮਨ ਕੋ ਥਿਰ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਚਿੱਤ ਨੂੰ (ਮਾਇਆ ਦੇ ਮੋਹ ਵਲੋਂ) ਅਡੋਲ ਬਣਾ ਲੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਥਿਰ = ਅਡੋਲ, ਟਿਕਵਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mantén a la mente entera y estable y así,"