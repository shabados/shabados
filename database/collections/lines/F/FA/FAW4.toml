data = "ਅੰਧ ਲਖੈ ਬਦਰੋ ਸੁਨੈ; ਜੋ ਤੁਮ ਕਰੌ ਸਹਾਇ ॥੪੩॥"
page = 812

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Up the mountains, a blind man could see, and a deaf could hear?( 43)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅੰਨ੍ਹਾ ਵੇਖ ਸਕਦਾ ਹੈ ਅਤੇ ਬੋਲਾ ਸੁਣ ਸਕਦਾ ਹੈ ॥੪੩॥"