[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਤੁੰਮੇ ਅੰਮ੍ਰਿਤ ਸਿੰਜੀਐ; ਕਉੜਤੁ ਨ ਜਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The colocynth (tumma) even if irrigated with nectar does not part with its bitterness."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਤੁੰਮੇ ਨੂੰ ਅੰਮ੍ਰਿਤ (ਦੁੱਧ) ਕਿੰਨਾ ਹੀ ਸਿੰਜੀਏ ਕੌੜੱਤਣ ਨਹੀਂ ਜਾਂਦੀ।"