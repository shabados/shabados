[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਸਾਚਿ ਰਤੇ ਪ੍ਰਭਿ; ਆਪਿ ਮਿਲਾਏ ॥੪॥੩॥"
page = 664
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, they, who are imbued with truth, they, who are imbued with truth, them, the Lord unites with Himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਜੋ ਸੱਚ ਨਾਲ ਰੰਗੇ ਹੋਏ ਹਨ, ਉਨ੍ਹਾਂ ਨੂੰ ਸਾਹਿਬ ਆਪਣੇ ਨਾਲ ਅਭੇਦ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, God unites with Himself those who are imbued with Truth. ||4||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਇਸ ਪ੍ਰਕਾਰ ਜੋ ਸਚ ਮੇਂ ਰਤੇ ਹੈਂ, ਸੋ ਪ੍ਰਭੂ ਨੇ ਅਪਨੇ ਮੇਂ ਮਿਲਾਇ ਲੀਏ ਹੈਂ ਅਰਥਾਤ ਅਭੇਦ ਹੈਂ॥੪॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਨੂੰ ਪ੍ਰਭੂ ਨੇ ਆਪ (ਆਪਣੇ ਚਰਨਾਂ ਵਿਚ) ਮਿਲਾਇਆ ਹੈ, ਉਹ ਉਸ ਸਦਾ-ਥਿਰ (ਦੇ ਪ੍ਰੇਮ-ਰੰਗ) ਵਿਚ ਰੰਗੇ ਰਹਿੰਦੇ ਹਨ ॥੪॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚਿ = ਸਦਾ-ਥਿਰ ਹਰਿ-ਨਾਮ ਵਿਚ। ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ ॥੪॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, los que están imbuidos en la Verdad, a ellos el Señor los une en Su Ser. (4-3)"