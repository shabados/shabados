[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੀ ਕੀਰਤਿ; ਸਚੁ ਸੁਖੁ ਹੋਈ ॥"
page = 880
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Praising True Lord, true peace is procured."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਸਾਈਂ ਦੀ ਮਹਿਮਾਂ ਕਰਨ ਦੁਆਰਾ ਸੱਚਾ ਸੁਖ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Praising the True Lord, true peace is attained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਾਚ ਕੀਰਤੀ ਕਰਤੇ ਹੈਂ ਤਿਨ ਕੋ ਨਿਸਚੈ ਕਰਿ ਸੁਖ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪਰਮਾਤਮਾ ਦੀ) ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੀ ਵਡਿਆਈ ਵੱਸਦੀ ਹੈ, ਉਸ ਨੂੰ ਹਰੇਕ ਸੁਖ ਪ੍ਰਾਪਤ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀਰਤਿ = ਸਿਫ਼ਤਿ-ਸਾਲਾਹ। ਸਾਚੀ ਕੀਰਤਿ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues en realidad no existe nadie más y aquéllos que Lo alaban viven en Éxtasis."