[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਾਇਨ ਪੈ ਬਿਨਤੀਅਨ ਕੈ; ਅਤਿ ਹੇਤ ਕੇ ਭਾਵ ਸੋ ਲਿਆਉ ਮਨਾਈ ॥੬੭੯॥"
page = 361

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Krishna called her and said, “You go to Radha and falling at her feet request her and persuade her to come.”679."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪੈਰੀਂ ਪੈ ਕੇ, ਬੇਨਤੀਆਂ ਕਰ ਕੇ ਅਤੇ ਬਹੁਤ ਹੀ ਪ੍ਰੇਮ ਭਾਵ ਜਤਾ ਕੇ (ਕਿਸੇ ਤਰ੍ਹਾਂ ਉਸ ਨੂੰ) ਮਨਾ ਕੇ ਲੈ ਆ ॥੬੭੯॥"