[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਿਧਏ ਸੂਰ ਸੂਰਿ ਕੇ ਧਾਮਾ ॥"
page = 53

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Suchlike horrible war blazed and the brave warriors left for their (heavenly) abode."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸ਼ੂਰਵੀਰ ਸੂਰਮਿਆਂ ਦੇ ਘਰ ਚਲੇ ਗਏ (ਅਰਥਾਤ ਮਾਰੇ ਗਏ)।"