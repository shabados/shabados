[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਰਨਿ. ਨ ਸਾਕਉ; ਗੁਣ ਬਿਸਥਾਰਾ ॥੧॥ ਰਹਾਉ ॥"
page = 1156
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He has good many virtues. I can narrate them not. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਵਿੱਚ ਬਹੁਤੀਆਂ ਹੀ ਨੇਕੀਆਂ ਹਨ। ਮੈਂ ਉਨ੍ਹਾਂ ਨੂੰ ਵਰਨਣ ਨਹੀਂ ਕਰ ਸਕਦਾ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I cannot even describe His Many Virtues. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਗੁਣੋਂ ਕਾ ਬਿਸਥਾਰ ਮੇਂ ਬਰਨਨ ਨਹੀਂ ਕਰ ਸਕਤਾ ਹੂੰ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਮੈਂ ਉਸ ਦੇ ਗੁਣਾਂ ਦਾ ਵਿਸਥਾਰ ਬਿਆਨ ਨਹੀਂ ਕਰ ਸਕਦਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਰਨਿ ਨ ਸਾਕਉ = ਬਰਨਿ ਨ ਸਾਕਉਂ, ਮੈਂ ਬਿਆਨ ਨਹੀਂ ਕਰ ਸਕਦਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues son tan Abundantes e Incontables. (1-Pausa)"