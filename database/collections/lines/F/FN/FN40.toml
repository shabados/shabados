[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਜੈ ਸਰਬ ਦੇਵੰ ਤਜੇ ਸਰਬ ਸਾਜੰ ॥"
page = 163

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "More forces of demons came from another direction, seeing which the gods, leaving all their paraphernalia, ran away."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਧਰ) ਦੇਵਤੇ ਵੀ ਸਾਰਾ ਸਾਜ਼-ਸਾਮਾਨ ਛਡ ਕੇ ਭਜ ਗਏ।"