[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੁੰਭ ਬਿਨਾ; ਜਲੁ ਨਾ ਟੀਕਾਵੈ ॥"
page = 872
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As without pitcher the water is held not,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਖੜੇ ਦੇਬ ਬਗੈਰ ਪਾਣੀ ਨਹੀਂ ਠਹਿਰਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the pitcher, the water is not contained;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਘੜੇ ਸੇ ਬਿਨਾ ਜਲ ਕੋ ਕੋਈ ਟਿਕਾਇ ਨਹੀਂ ਸਕਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਘੜੇ ਤੋਂ ਬਿਨਾ ਪਾਣੀ ਨਹੀਂ ਟਿਕ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੁੰਭ = ਘੜਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin la vasija, el agua no se contiene;"