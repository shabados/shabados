[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਮਹਿ ਵਰਤੈ; ਏਕੋ ਸੋਈ ॥"
page = 127
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Amongst all that unique Lord is contained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਅੰਦਰ ਉਹ ਅਦੁੱਤੀ ਸਾਹਿਬ ਰਮਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That One Lord is pervading in all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਏਕ ਹੀ ਪਰਮਾਤਮਾਂ ਸਰਬ ਮੇਂ ਵਰਤ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਕ ਪਰਮਾਤਮਾ ਹੀ ਸਭ ਜੀਵਾਂ ਵਿਚ ਮੌਜੂਦ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਈ = ਉਹ (ਪਰਮਾਤਮਾ) ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, el Señor, prevalece en todo,"