[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਣੁ ਤ੍ਰਿਣੁ ਤ੍ਰਿਭਵਣ ਪਾਣੀ ॥"
page = 1003
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The forests, grass, the three worlds, water,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੰਗਲ, ਘਾਅ, ਤਿੰਨੇ ਲੋਕ, ਜਲ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The forests, meadows, three worlds, water,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਨ ਔ ਘਾਸ ਪੁਨਾਂ ਤਿੰਨੇ ਭੌਨ ਤਥਾ ਪਾਣੀ ਆਦਿ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੰਗਲ, (ਜੰਗਲ ਦਾ) ਘਾਹ, ਤਿੰਨੇ ਭਵਨ, ਪਾਣੀ (ਆਦਿਕ ਸਾਰੇ ਤੱਤ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਣੁ = ਜੰਗਲ। ਤ੍ਰਿਣੁ = ਤੀਲਾ, ਘਾਹ। ਤ੍ਰਿਭਵਣ = ਤਿੰਨੇ ਭਵਨ {ਆਕਾਸ਼, ਮਾਤਲੋਕ, ਪਾਤਾਲ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a los bosques y glaciares, a los tres mundos de agua,"