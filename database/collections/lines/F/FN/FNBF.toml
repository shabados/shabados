[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁ ਦਾਨ ਤੀਸਰਾ ਹਠੀ; ਅਖੰਡ ਤਾਸੁ ਜਾਨੀਐ ॥"
page = 701

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There is another warriors Suyang (good Yajna), the second is Prabodh (knowledge) and the third warrior is Daan (Charity), who is indivisible persistent"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੀਜੇ ਹਠੀ (ਦਾ ਨਾਮ) 'ਦਾਨ' ਹੈ, ਜਿਸ ਨੂੰ ਅਖੰਡ ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ।"