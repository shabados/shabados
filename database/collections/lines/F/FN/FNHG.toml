[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਉ ਮੈ. ਹਰਿ ਹਰਿ ਕਰੀਆ ॥"
page = 537
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then I repeated God's Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਮੈਂ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਜਾਪ ਕੀਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Then, I repeated the Name of the Lord, Har, Har,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਮੈਨੇ ਕਾਮਾਦਿ ਦੂਤੋਂ ਕੋ ਐਸੇ ਜਾਨਾਂ ਤਬ ਮੈਨੇ ਹਰਿ ਹਰਿ ਜਾਪੁ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਹੀਏਂ ਮੈਂ ਸਦਾ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਉ = ਤਦੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Entonces recité el Nombre del Señor, Jar, Jar,"