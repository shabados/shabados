[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਉ ਗੁਰਦੇਉ; ਤਨਿ ਚਕ੍ਰ ਲਗਾਇਆ ॥"
page = 1167
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Divine Guru is in mercy, then one is deemed to have bathed in sixty eight holies."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਈਸ਼ਵਰ ਰੂਪ ਗੁਰੂ ਮਿਹਰ ਦੇ ਘਰ ਆਉਂਦੇ ਹਨ ਤਾਂ ਬੰਦੇ ਦਾ ਆਪਣੇ ਸਰੀਰ ਤੇ ਚੱਕਰ ਦਾ ਲਾਉਣਾ ਜਾਣ ਲਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Divine Guru grants His Grace, one's body is stamped with the sacred mark of Vishnu."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਗੁਰਦੇਵ ਦ੍ਯਾਲ ਹੂਏ ਤਬ ਪ੍ਰਿਥੂ ਰਾਜ ਕੇ ਤਨ ਪਰ ਹਰੀ ਨੇ ਦੁਆਰਕਾ ਗਏ ਬਿਨਾਂ ਹੀ ਅਰਥਾਤ ਚਿੰਨ ਛਾਪਾ ਤਿਲਕਾਦਿ ਲਗਾਇ ਦੀਆ॥☬ਇਸ ਦੀ ਸਾਖੀ ਭਗਤ ਮਾਲਾ ਮੇਂ ਪ੍ਰਸਿਧ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਗੁਰੂ ਮਿਲ ਪਏ ਤਾਂ ਸਰੀਰ ਉੱਤੇ ਚੱਕਰ ਲੱਗ ਗਏ ਸਮਝੋ (ਜਿਵੇਂ ਬੈਰਾਗੀ ਦੁਆਰਕਾ ਜਾ ਕੇ ਲਾਉਂਦੇ ਹਨ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਨਿ = ਸਰੀਰ ਉੱਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el Guru nos muestra su Compasión, el cuerpo de uno es ungido con los Santos Chakras."