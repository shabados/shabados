[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਵੈਦੁ; ਆਪਿ ਨਾਰਾਇਣੁ ॥"
page = 962
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord, Himself, of Himself, is the physician."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ, ਖੁਦ-ਬ-ਖੁਦ ਹੀ ਹਕੀਮ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord Himself is the true physician."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਆਪ ਨਾਰਾਯਣ ਵੈਦ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਆਪ ਹੀ (ਆਤਮਾ ਦੇ ਰੋਗ ਹਟਾਣ ਵਾਲਾ) ਹਕੀਮ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios es el Único Médico Verdadero,"