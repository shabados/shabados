[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਮਾਤਾ. ਬਾਲਿ ਲਪਟਾਵੈ ॥"
page = 629
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the mother is clung to her child,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਮਾਂ ਆਪਣੇ ਬੱਚੇ ਨਾਲ ਚਿਮੜੀ ਹੋਈ ਹੁੰਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Just as the mother holds her baby close,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਮਾਤਾ ਕੋ ਬਾਲਕ ਪ੍ਯਾਰ ਪੂਰਬਕ ਲਪਟਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਵੇਂ ਮਾਂ ਆਪਣੇ ਬੱਚੇ (ਦੇ ਮੋਹ) ਨਾਲ ਚੰਬੜੀ ਰਹਿੰਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਲਿ = ਬਾਲ (ਦੇ ਮੋਹ) ਵਿਚ। ਲਪਟਾਵੈ = ਚੰਬੜੀ ਰਹਿੰਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como la madre abraza a su amado hijo,"