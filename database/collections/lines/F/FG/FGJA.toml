[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਸੂਤਕਿ; ਜਨਮਿ ਮਰੀਜੈ ॥"
page = 413
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In defilement, the mortals are born and die, O Nanak,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਪਵਿੱਤਰਤਾ ਵਿੱਚ ਪਰਾਣੀ ਜੰਮਦੇ ਅਤੇ ਮਰਦੇ ਹਨ ਹੇ ਨਾਨਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, people are born and die in pollution."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਨਮਨਾ ਮਰਨਾ ਸਭ ਸੂਤਕ ਮੇਂ ਹੀ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਸੂਤਕ (ਦੇ ਭਰਮ) ਵਿਚ ਪੈ ਕੇ (ਪਰਮਾਤਮਾ ਦੀ ਹੋਂਦ ਤੋਂ ਖੁੰਝ ਕੇ) ਜਗਤ ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਵਿਚ ਪੈ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En la impureza nacen los hombres y en la impureza mueren,"