[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਅਧਿਕ ਪ੍ਰੀਤਿ ਰਾਜਾ ਸੋ; ਨਿਤਿਪ੍ਰਤਿ ਰਾਖਹੀ ॥੨॥"
page = 853

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And they ever loved him intensively.(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਹਰ ਰੋਜ਼ ਉਸ ਰਾਜੇ ਪ੍ਰਤਿ ਅਧਿਕ ਪ੍ਰੇਮ (ਦੀ ਭਾਵਨਾ) ਰਖਦੀਆਂ ਸਨ ॥੨॥"