[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਲ ਬਿਵਸਥਾ ਬਾਰਿਕੁ ਅੰਧ ॥"
page = 889
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the age of childhood, the child is blind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਚਪਣੇ ਦੀ ਉਮਰ ਵਿੱਚ ਬੱਚਾ ਅੰਨ੍ਹਾ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In his childhood, the child is blind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਾਲ ਅਵਸਥਾ ਮੇਂ ਤੋ (ਬਾਰਿਕੁ) ਅੰਧੁ ਰਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬਾਲ ਉਮਰੇ ਜੀਵ ਬੇ-ਸਮਝ ਬਾਲਕ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਵਸਥਾ = ਉਮਰ (ਵਿਚ)। ਅੰਧ = ਅੰਞਾਣ, ਬੇ-ਸਮਝ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En tu niñez eras ignorante y ciego;"