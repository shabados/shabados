data = "ਜੇ ਇਨ੍ਹਾਂ ਨੂੰ ਹੁਣ ਮਾਰਦਾ ਹਾਂ (ਤਾਂ) ਇਹ (ਗੱਲ) ਬਾਹਰ ਧੁਮ ਜਾਏਗੀ"