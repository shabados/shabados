[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕ ਆਸ; ਰਾਖਹੁ ਮਨ ਮਾਹਿ ॥"
page = 288
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Keep the hope of One Lord in thy mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇੱਕ ਸਾਹਿਬ ਦੀ ਉਮੀਦ ਆਪਣੇ ਚਿੱਤ ਅੰਦਰ ਰੱਖ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Keep faith in the One Lord within your mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਏਕ ਵਾਹਿਗੁਰੂ ਕੀ ਆਸ ਮਨ ਮੇਂ ਰਾਖੋਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਵਿਚ ਇਕ (ਪ੍ਰਭੂ ਦੀ) ਆਸ ਰੱਖੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ ਮਾਹਿ = ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que conduce tus esperanzas a descansar sólo en el Uno."