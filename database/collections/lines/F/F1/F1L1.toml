[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਹਾ ਬਿਕਾਰ ਗਏ. ਸੁਖ ਉਪਜੇ; ਬਾਜੇ ਅਨਹਦ ਤੂਰੇ ॥"
page = 781
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His arch sins are eradicated, peace wells up and celestial music rings for him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਘੋਰ ਪਾਪ ਕੱਟੇ ਜਾਂਦੇ ਹਨ, ਆਰਾਮ ਉਤਪੰਨ ਹੋ ਜਾਂਦਾ ਹੈ ਅਤੇ ਉਸ ਲਈ ਬੈਕੁੰਠੀ ਕੀਰਤਨ ਗੂੰਜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Even the worst corruption is taken away; peace wells up, and the unstruck celestial harmony vibrates and resounds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਮਹਾ ਬਿਕਾਰ) ਬਡੇ ਦੁਖ ਰੂਪ ਜੋ ਵਿਸ਼ੇ ਥੇ, ਸੋ ਗਏ ਔ ਸੁਖ ਪ੍ਰਗਟ ਹੂਏ ਹੈਂ, ਔ ਜਸ ਰੂਪ ਇਕ ਰਸ ਵਾਜੇ ਵਜੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੇ ਅੰਦਰੋਂ) ਵੱਡੇ ਵੱਡੇ ਵਿਕਾਰ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ (ਉਸ ਦੇ ਅੰਦਰ ਸੁਖ ਪੈਦਾ ਹੋ ਜਾਂਦੇ ਹਨ (ਮਾਨੋ) ਇਕ-ਰਸ ਵਾਜੇ ਵੱਜ ਪੈਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਜੇ = ਵੱਜ ਪਏ। ਅਨਹਦ = ਇਕ-ਰਸ। ਤੂਰੇ = ਵਾਜੇ, ਨਰਸਿੰਘੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos los errores son borrados y uno se llena de Dicha, escuchando la Melodía Divina que se oye en el interior."