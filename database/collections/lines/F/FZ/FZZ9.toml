[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਣਸ ਕਉ; ਪ੍ਰਭਿ ਦੀਈ ਵਡਿਆਈ ॥"
page = 1075
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the Lord has blessed man with glory."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਨੇ ਇਨਸਾਨ ਨੂੰ ਬਜ਼ੁਰਗੀ ਪ੍ਰਦਾਨ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God blessed mankind with glory."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਸਭ ਜੂਨੀਓਂ ਵਿਚ ਪ੍ਰਭੂ ਨੇ ਮਾਨਸ ਕੋ ਵਡਿਆਈ ਦਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਨੇ ਮਨੁੱਖਾ ਜਨਮ ਨੂੰ ਵਡਿਆਈ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਣਸ ਕਉ = ਮਾਣਸ ਜੋਨਿ ਕਉ, ਮਨੁੱਖ ਜਨਮ ਨੂੰ। ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ। ਦੀਈ = ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es bendecido con Gloria por encima de todas ellas y quien sea que pierda la oportunidad en este nacimiento,"