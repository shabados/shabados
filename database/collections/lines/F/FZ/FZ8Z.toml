data = "ਤਾ ਤੇ ਭੂਖਿ ਪ︀ਯਾਸ ਸਭ ਭਾਗੀ ॥"
page = 946

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(She thought,) ‘She has fallen in love with some body, that is why she has lost her appetite."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਲਈ ਸਾਰੀ ਭੁਖ ਤ੍ਰੇਹ ਖ਼ਤਮ ਹੋ ਗਈ ਹੈ।"