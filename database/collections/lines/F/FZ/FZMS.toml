data = "ਕਛੂ ਸੰਕ ਚਿਤ ਬੀਚ ਨ ਆਨੀ ॥"
page = 898

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Shah acted the way he was asked, he did not get any doubt in his mind,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮਨ ਵਿਚ ਕਿਸੇ ਤਰ੍ਹਾਂ ਦਾ ਸੰਦੇਹ ਨਹੀਂ ਲਿਆਂਦਾ।"