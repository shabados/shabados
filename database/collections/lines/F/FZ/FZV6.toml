[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਤੁਲਿ ਨ ਮਿਹਰਵਾਨ; ਮਾਤ ਪਿਤਾ ਨ ਦੇਵ ਸਬਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Neither mother and father nor all the gods can be as gracious as the true Guru."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਦੇ ਤੁੱਲ ਕੋਈ ਮਿਹਰਵਾਨ ਨਹੀਂ, ਮਾਤਾ ਪਿਤਾ ਆਦਿ ਸਾਰੇ ਸਾਕ ਅਰ ਦੇਵਤੇ।"