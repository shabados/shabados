[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹੂੰ, ਸਿਮਟਿ ਭਿ︀ਯੋ ਸੰਕਰ ਇਕੈਠਾ ॥"
page = 1387

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere He contracts Himself as Shiva, the Yogi"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਿਤੇ ਸਿਮਟ ਕੇ ਸ਼ੰਕਰ ਦੀ (ਮੂਰਤੀ ਵਿਚ) ਇਕੱਠੇ ਹੋ ਗਏ ਹੋ (ਅਰਥਾਂਤਰ- ਕਿਤੇ ਸੰਯੁਕਤ ਹੋ ਕੇ ਇਕੱਠੇ ਸਿਮਟੇ ਹੋਏ ਹੋ)।"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਕਹੂੰ ਸਿਮਟਿ; ਭਯੋ ਸੰਕਰ ਇਕੈਠਾ ॥"