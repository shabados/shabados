[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਉ ਸੁਆਮੀ; ਕੀਨੋ ਦਾਨੁ ॥੧॥"
page = 1298
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "whom the Lord blesses with its gift."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਸਾਹਿਬ ਇਸ ਦੀ ਦਾਤ ਬਖਸ਼ਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "whose Lord and Master blesses them with this gift. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਸੁਆਮੀ ਪਰਮੇਸਰ ਨੇ ਉਪਦੇਸੁ ਕਾ ਦਾਨੁ ਕੀਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਲਕ-ਪ੍ਰਭੂ ਜਿਸ ਮਨੁੱਖ ਨੂੰ (ਨਾਮ ਦੀ) ਦਾਤ ਬਖ਼ਸ਼ਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕਉ = ਜਿਸ (ਮਨੁੱਖ) ਨੂੰ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Maestro bendice con Sus Regalos. (1)"