[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਉਠੀ ਕੂਹ ਜੂਹੰ, ਗਿਰੇ ਚਉਰ ਚੀਰੰ ॥"
page = 112

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There was consternation in the whole battlefield and the canopies and garments began to fall."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਣ-ਭੂਮੀ ਵਿਚ ਸ਼ੋਰ ਮਚ ਗਿਆ ਸੀ ਅਤੇ ਚੌਰ ਅਤੇ ਬਸਤ੍ਰ ਡਿਗ ਰਹੇ ਸਨ।"