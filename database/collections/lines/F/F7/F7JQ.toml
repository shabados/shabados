[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਹਿ ਵੈਦ; ਜੀਅ ਕਾ ਦੁਖੁ ਲਾਇਣ ॥"
page = 962
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "These physicians burden the soul with malady."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਦੁਨਿਆਵੀ ਹਕੀਮ ਆਤਮਾ ਨੂੰ ਬਿਮਾਰੀ ਲਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "These physicians of the world only burden the soul with pain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਲੋਕਕ ਵੈਦ ਜੀਅ ਕਾ ਦੁਖ ਦੂਰ ਨਹੀਂ ਕਰਤੇ ਉਲਟਾ ਦੁਖ ਲਾਵਣਾ ਕਰਤੇ ਹੈਂ, ਭਾਵ ਜਨਮ ਮਰਨ ਦੁਖ ਕਾ ਸਾਧਨ ਦੇਹ ਅਭਿਮਾਨ ਬਢਾਵਤੇ ਹੈਂ। ਵਾ ਕਬੀ ਕਹੇ ਨਿਕੁੰਬਤੀ ਅਰ ਖਿਲਤ ਵਿਗੜੀ ਹੈ, ਭਰਮ ਪਾ ਕੇ ਔਖਧੀ ਮੇਂ ਹੀ ਸਦਾ ਲਗਾਈ ਰਾਖੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ (ਦੁਨੀਆ ਵਾਲੇ) ਹਕੀਮ (ਪਖੰਡੀ ਧਰਮ-ਆਗੂ) ਆਤਮਾ ਨੂੰ ਸਗੋਂ ਦੁੱਖ ਚੰਬੋੜਦੇ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਹਿ ਵੈਦ = ਇਹ (ਦੁਨੀਆ ਵਾਲੇ) ਹਕੀਮ, ਪਖੰਡੀ ਧਰਮ = ਆਗੂ। ਜੀਅ ਕਾ = ਜਿੰਦ ਦਾ, ਆਤਮਾ ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues los médicos del mundo no han encontrado cura para el Alma en pena."