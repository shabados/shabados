data = "ਬਡੋ ਜੁਧ ਕੈ ਦੇਵ ਲੋਕੰ ਪਧਾਰੇ ॥੩੧॥"
page = 68

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In great rage, he killed many soldiers and after a great fight departed for the heavenly abode.31."

