[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਊਠਤ ਬੈਠਤ; ਸਦ ਤਿਸਹਿ ਧਿਆਈ ॥"
page = 270
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "remember Him, while standing or sitting."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੜੋਤਿਆਂ ਅਤੇ ਬਹਿੰਦਿਆਂ ਹਮੇਸ਼ਾਂ ਉਸ ਨੂੰ ਯਾਦ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "standing up and sitting down, meditate always on Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਠਤਿਆਂ ਬੈਠਤਿਆਂ ਸਦਾ ਤਿਸੀ ਕਾ ਧਿਆਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਠਦੇ ਬੈਠਦੇ (ਭਾਵ, ਹਰ ਵੇਲੇ) ਉਸੇ ਨੂੰ ਸਦਾ ਸਿਮਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਦ = ਸਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sentado o parado, medita siempre en Él."