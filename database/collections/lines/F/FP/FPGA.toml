[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕੈ ਨਿਕਟਿ ਬਸੈ; ਨਰਹਰੀ ॥੧॥"
page = 1163
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "near him abides my Lord, the Man-Lion."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਨੁਸ਼-ਸ਼ੋਰ-ਸਰੂਪ ਮੇਰਾ ਸਾਈਂ ਉਸ ਦੇ ਨੇੜੇ ਹੀ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- the Lord abides near that person. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੇ (ਨਰਹਰੀ) ਹੇ ਭਗਵਨ! ਤੂੰ ਸਮੀਪ ਬਸਤਾ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਉਸ ਦੇ ਅੰਗ-ਸੰਗ ਵੱਸਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਕਟਿ = ਨੇੜੇ। ਨਰਹਰੀ = ਪਰਮਾਤਮਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "cerca de él está Dios, el Hombre- León. (1)"