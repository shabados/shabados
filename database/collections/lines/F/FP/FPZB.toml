data = "ਹੇਰਿ ਦਸਾ ਤਿਹ ਕਾਲ ਜਮਨ; ਕਰੋਰ ਕਈ ਦਲ ਅਉਰ ਪਠਾਯੋ ॥"
page = 488

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing his own plight, Kalyavana sent millions of more soldiers,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਥਿਤੀ ਨੂੰ ਵੇਖ ਕੇ ਉਸ ਵੇਲੇ ਕਾਲ ਜਮਨ ਨੇ ਕਈ ਕਰੋੜ ਸੈਨਾ ਹੋਰ ਭੇਜ ਦਿੱਤੀ ਹੈ।"