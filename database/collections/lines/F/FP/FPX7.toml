assets = ["DGDG"]
type = "primary"
data = "ਜਹ ਤਹ ਰਿਖੀਨ ਤਜਿ ਦੀਨ ਗਰਬ ॥"
page = 638

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sky and the earth all quivered and the sages here and there abandoned their pride"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਕਿਥੇ ਰਿਸ਼ੀਆਂ ਨੇ ਹੰਕਾਰ ਛਡ ਦਿੱਤਾ ਸੀ।"