type = "primary"
data = "ਸਭ ਸਿਰਿ ਨਾਦ ਬਿਜੈ ਕਾ ਬਾਜਾ ॥"
page = 606

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In this way, conquering various kings, the musical instruments of victory was played"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਦੇ ਸਿਰ ਉਤੇ ਜਿਤ ਦਾ ਨਾਦ ਵਜਾ ਦਿੱਤਾ ਹੈ।"