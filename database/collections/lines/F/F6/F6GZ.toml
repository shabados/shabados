[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੰਘਰੇ ਰਾਮ ਰਣ ਇੰਦ੍ਰਜੀਤ ॥੪੭੫॥"
page = 249

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And he could certainly wed Sita on that day because Inderjit has killed ram in the war.475."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਮ ਚੰਦਰ ਰਣ-ਭੂਮੀ ਵਿੱਚ (ਮੇਘ ਨਾਦ ਨਾਲ) ਲੜ ਮੋਏ ਹਨ ॥੪੭੫॥"