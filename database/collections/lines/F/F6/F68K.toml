[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਿਤਿ ਅਖੇਟ ਕਰੈ ਮ੍ਰਿਗ ਘਾਵੈ ॥"
page = 933

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "As he grew, he commenced going on hunting and killing many deer."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਹ ਨਿੱਤ ਸ਼ਿਕਾਰ ਕਰ ਕੇ ਹਿਰਨ (ਆਦਿ ਜੰਗਲੀ ਪਸ਼ੂ) ਮਾਰਨ ਲਗਿਆ।"