[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਿ ਤਨਿ ਨਾਨਕ; ਹਰਿ ਗੁਣ ਗਾਉ ॥"
page = 1145
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Nanak; One sings Lord's praise with his soul and body,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਆਪਣੀ ਜਿੰਦੜੀ ਅਤੇ ਦੇਹ ਨਾਲ ਸੁਆਮੀ ਦੀ ਕੀਰਤੀ ਗਾਇਨ ਕਰਦਾ ਹੈ"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, sing the Glorious Praises of the Lord with your mind and body."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੇ ਸੰਗਿ ਕਰ ਜਿਸ ਕੋ ਹਰੀ ਅਪਣਾ ਨਾਮ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਿਹੜਾ ਮਨੁੱਖ ਮਨੋਂ ਤਨੋਂ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ (ਉਹ ਭਾਗਾਂ ਵਾਲਾ ਹੈ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਤਨਿ = ਸਰੀਰ ਵਿਚ। ਗੁਣ ਗਾਉ = ਸਿਫ਼ਤ-ਸਾਲਾਹ, ਗੁਣਾਂ ਦਾ ਗਾਇਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canta las Alabanzas de Dios, oh dice Nanak, en cuerpo y Alma,."