[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਿਸਰੁ ਨਾਹੀ ਪ੍ਰਭ; ਪ੍ਰਾਣ ਅਧਾਰੇ ਜੀਉ ॥"
page = 217
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "May I not forget Thee, O Lord. Thou art the mainstay of my life."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੈਨੂੰ ਨ ਭੁਲਾਂ, ਹੇ ਸੁਆਮੀ! ਤੂੰ ਮੇਰੀ ਜਿੰਦੜੀ ਦਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "May I never forget God, the Support of the breath of life."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਪ੍ਰਾਣੋਂ ਕੇ ਆਸਰੇ! ਮੇਰੇ ਕੋ ਵਿਸਰੁ ਨਾਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦ ਦੇ ਆਸਰੇ ਪ੍ਰਭੂ! ਮੈਨੂੰ ਭੁਲ ਨਾਹ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਾਣ ਅਧਾਰੇ = ਹੇ ਮੇਰੀ ਜਿੰਦ ਦੇ ਆਸਰੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Haz que no Te olvide, oh Señor,"