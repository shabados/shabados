[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹ੍ਵੈ ਕੈ ਕੁਰੂਪ ਪਰਿਯੋ ਧਰਿ ਜੁਧ ਕੀ; ਤਉਨ ਸਮੈ ਬਯਦੂਰਥ ਕੋ ਤਨ ॥"
page = 538

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The body of the demon Vidurath god deformed and fell down on the earth"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਵੇਲੇ ਬਯਦੂਰਥ (ਵਿਦੂਰਥ) ਦਾ ਸ਼ਰੀਰ ਕੁਰੂਪ ਹੋ ਕੇ ਯੁੱਧ-ਪੂਮੀ ਵਿਚ ਡਿਗ ਪਿਆ।"