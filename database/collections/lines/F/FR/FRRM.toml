type = "primary"
data = "ਦੁੰਦਭਿ ਤਬੈ ਜੀਤਿ ਕੌ ਦੀਨੋ ॥੩੯॥"
page = 931

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She made him (Arth Rai) unconscious and beat the victory drum.(39)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸੇ ਵੇਲੇ ਜਿਤ ਦਾ ਨਗਾਰਾ ਵਜਾ ਦਿੱਤਾ ॥੩੯॥"