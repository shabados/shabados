[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਜਾਪੈ; ਕਿਛੁ ਕਿਥਾਊ ਨਾਹੀ ॥"
page = 1070
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When it seems, that there is nothing in any place,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ ਕਿ ਕਿਸੇ ਥਾਂ ਉੱਤੇ ਕੁਝ ਭੀ ਨਹੀਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When it seems that a place is empty and void,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਾ ਜਬ ਪੁਰਸ (ਜਾਪੈ) ਜਾਣੈ ਕਿ ਕਿਛੁ ਭੀ ਕਿਸੀ ਅਸਥਾਨ ਮੇਂ ਨਹੀਂ ਹੈ, ਭਾਵ ਸਭ ਪਰਪੰਚ ਅਸਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਇਹ ਸਮਝ ਆ ਜਾਂਦੀ ਹੈ ਕਿ ਕਿਤੇ ਭੀ ਕੋਈ ਚੀਜ਼ (ਸਦਾ-ਥਿਰ) ਨਹੀਂ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ = ਜਦੋਂ। ਜਾਪੈ = ਇਹ ਸਮਝ ਆਉਂਦੀ ਹੈ ਕਿ। ਕਿਥਾਊ = ਕਿਤੇ ਭੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando se siente que hay un tremendo vacío y que nada lo llena,"