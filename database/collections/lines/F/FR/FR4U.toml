[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਨਾਵੈ. ਸਭ ਭੂਲੀ ਫਿਰਦੀ; ਬਿਰਥਾ ਜਨਮੁ ਗਵਾਈ ॥੯॥"
page = 909
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Name, all the mortals are gone astray and lose their life, in vain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੇ ਬਗੈਰ ਸਾਰੇ ਪ੍ਰਾਨੀ ਕੁਰਾਹੇ ਪਏ ਹੋਏ ਹਨ ਅਤੇ ਆਪਣੇ ਜੀਵਨ ਵਿਅਰਥ ਗੁਆ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Name, everyone wanders around in confusion; they waste away their lives in vain. ||9||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਿਨਾ ਨਾਮ ਤੋਂ ਸਭ ਸ੍ਰਿਸ੍ਟੀ ਭੂਲੀ ਫਿਰਤੀ ਹੈ, ਇਸੀ ਸੇ ਬਿਅਰਥ ਹੀ ਜਨਮ ਕੋ ਗਵਾਵਤੀ ਹੈ॥੯॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਸੰਤ ਜਨੋ! ਪਰਮਾਤਮਾ ਦੇ) ਨਾਮ ਤੋਂ ਬਿਨਾਂ ਸਾਰੀ ਲੁਕਾਈ ਕੁਰਾਹੇ ਪਈ ਹੋਈ ਹੈ, ਅਤੇ ਆਪਣਾ ਮਨੁੱਖਾ ਜਨਮ ਵਿਅਰਥ ਗਵਾ ਰਹੀ ਹੈ ॥੯॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੂਲੀ ਫਿਰਦੀ = ਗ਼ਲਤ ਜੀਵਨ-ਰਾਹ ਤੇ ਪਈ ਹੋਈ ਹੈ। ਬਿਰਥਾ = ਵਿਅਰਥ ॥੯॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Nombre del Señor uno vaga en la duda y desperdicia su vida en vano.  (9)"