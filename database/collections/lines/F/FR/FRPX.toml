[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "(ਮੈਂ ਆਪਣੇ ਪ੍ਰੀਤਮ ਲਈ) ਮੋਤੀ, ਲਾਲ ਅਤੇ ਜਵਾਹਰ ਬਣ ਜਾਂਦਾ ਹਾਂ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਗੋਹਰੋ ਲਾਲੋ ਜਵਾਹਰ ਪੇਸ਼ਿ ਸ਼ਾਂ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "They all are the dust of his lotus feet (dust of the path on which he treads) (37)"