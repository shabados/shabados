data = "ਤੂੰ ਬੀਆਬਾਨਾਣ ਵਿਚ ਕਿਉਣ ਜਾਂਦਾ ਹੈੈਣ # ਉਹ ਉਜਾੜ ਦੇ ਖੂੰਜਿਆਣ ਵਿਚ ਨਹੀਣ । "

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਚੂੰ ਬ-ਸਹਿਰਾ ਮੀਰਵੀ ਦਰ ਗੋਸ਼ਾਇ ਵੀਰਾਨਾ ਨੀਸਤ ॥੧੦॥੫॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, protect me from his sugar cubes-chewing mouth and lips. (15) (1)"