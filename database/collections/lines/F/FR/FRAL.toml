[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਪਾਥਰ ਬਿਰਖ ਨਿਪਜਾਏ ॥"
page = 275
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many millions of stones and trees have been produced."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਕ੍ਰੋੜ ਪੱਥਰ ਅਤੇ ਰੁੱਖ ਪੈਦਾ ਕੀਤੇ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions of stones and trees have been produced."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਈ ਕ੍ਰੋੜੋਂ ਪਥਰ ਔਰ ਬ੍ਰਿਛ ਉਤਪਤ ਕਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਰੋੜਾਂ ਹੀ ਪੱਥਰ ਤੇ ਰੁੱਖ ਉਗਾਏ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਰਖ = ਰੁੱਖ। ਨਿਪਜਾਏ = ਉਗਾਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones son las piedras y árboles creados."