[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈ; ਸਤ ਕਾ ਹਲੁ ਜੋਆਇਆ ॥"
page = 73
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have joked the plough of Truth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸੱਚ ਦਾ ਹਲ ਜੋੜਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have hooked up the plow of Truth,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਨੇ ਸਤ ਕਰਮੋਂ ਕਾ ਜੋ ਕਰਨਾ ਹੈ, ਵਾ ਸਤਿਸੰਗ ਕਾ ਜੋ ਕਰਨਾ ਹੈ ਏਹੀ ਹਲ ਜੁੜਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ) ਮੈਂ ਉੱਚ ਆਚਰਣ ਬਣਾਣ ਦਾ ਹਲ ਜੋਅ ਦਿੱਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤ = ਉੱਚਾ ਆਚਰਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y yo hice parcela de Tu Verdad."