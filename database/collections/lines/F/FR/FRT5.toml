[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਇਆ ਮਰਣੁ ਧੁਰਾਹੁ; ਹਉਮੈ ਰੋਈਐ ॥"
page = 369
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From the very beginning death is ordained but egotism makes man bewail."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਨ ਆਰੰਭ ਤੋਂ ਮੌਤ ਨੀਅਤ ਹੋਈ ਹੋਈ ਹੈ। ਹੰਕਾਰ ਹੀ ਆਦਮੀ ਨੂੰ ਰੁਆਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Death is ordained from the very beginning, and yet ego makes us cry."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਧੁਰ ਆਦਿ ਸੇ ਜਨਮ ਮਰਣ ਚਲਾ ਆਇਆ ਹੈ, ਹੰਤਾ ਮਮਤਾ ਕਰ ਕੇ ਰੋਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਧੁਰ ਦਰਗਾਹ ਤੋਂ ਹੀ (ਹਰੇਕ ਜੀਵ ਵਾਸਤੇ) ਮੌਤ (ਦਾ ਪਰਵਾਨਾ) ਆਇਆ ਹੋਇਆ ਹੈ (ਧੁਰ ਤੋਂ ਹੀ ਇਹ ਰਜ਼ਾ ਹੈ ਕਿ ਜੇਹੜਾ ਜੰਮਿਆ ਹੈ ਉਸ ਨੇ ਮਰਨਾ ਭੀ ਜ਼ਰੂਰ ਹੈ) ਹਉਮੈ ਦੇ ਕਾਰਨ ਹੀ (ਕਿਸੇ ਦੇ ਮਰਨ ਤੇ) ਰੋਈਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧੁਰਾਹੁ = ਧੁਰ ਦਰਗਾਹ ਤੋਂ। ਮਰਣੁ = ਮੌਤ, ਮਰਣਾ। ਰੋਈਐ = ਰੋਈਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La muerte está inscrita en nuestro destino, y es la conciencia del ego que nos hace sufrir,"