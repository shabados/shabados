[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਕੌ ਢੀਠ ਬਧਾਇ ਕੈ; ਕਾਢਿ ਲਈ ਤਰਵਾਰਿ ॥"
page = 886

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He, then, tied him up and drew the sword."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਤੋਂ ਬਹੁਤ ਢੀਠਾਈ ਕਰਵਾ ਕੇ ਤਲਵਾਰ ਕਢ ਲਈ"