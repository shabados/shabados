[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਰੇ ਪਰੇ ਆਧੋ ਦਿਨ ਖੋਯੋ ॥"
page = 949

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Since, then, you have been sleeping, nonchalantly, and half the day has gone by."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪਿਆਂ ਪਿਆਂ ਅੱਧਾ ਦਿਨ ਬੀਤ ਗਿਆ।"