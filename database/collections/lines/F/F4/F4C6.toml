[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਿਪੈ ਚਾਰੁ ਆਭਾ ਮਨੋ ਰਾਗ ਮਾਲਾ ॥"
page = 832

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That pretty lady was known as Lal Mati and she was as beautiful as the musical notes."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਸੁੰਦਰ ਛਬੀ ਇਸ ਪ੍ਰਕਾਰ ਝਲਕਦੀ ਸੀ ਮਾਨੋ ਰਾਗ ਮਾਲਾ ਹੋਵੇ।"