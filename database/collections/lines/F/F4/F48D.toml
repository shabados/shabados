[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਗੁਰ. ਕਿਨੈ ਨ ਪਾਇਓ; ਬਿਰਥਾ ਜਨਮੁ ਗਵਾਇ ॥"
page = 33
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Guru no one has obtained the Name and the man loses his life in vain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਬਾਝੋਂ ਕਿਸੇ ਨੂੰ ਭੀ ਨਾਮ ਪਰਾਪਤ ਨਹੀਂ ਹੋਇਆ ਅਤੇ ਆਦਮੀ ਆਪਣਾ ਜੀਵਨ ਨਿਸਫਲ ਗੁਆ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Guru, no one has obtained it; they waste away their lives in vain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਗੁਰੋਂ ਸੇ ਬਿਨਾ ਸ੍ਵਤੰਤ੍ਰ ਕਿਸੀ ਨੇ ਹਰੀ ਨਾਮੁ ਨਹੀਂ ਪਾਇਆ ਹੈ। ਮਨਮੁਖ ਜੀਵ ਅਪਨੇ ਜਨਮ ਕੋ ਬ੍ਯਰਥ ਹੀ ਗਵਾਇ ਕਰ ਚਲੇ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਦੇ ਭੀ) ਕਿਸੇ ਮਨੁੱਖ ਨੇ ਗੁਰੂ ਤੋਂ ਬਿਨਾ (ਪਰਮਾਤਮਾ ਨੂੰ) ਨਹੀਂ ਪ੍ਰਾਪਤ ਕੀਤਾ (ਜੇਹੜਾ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਨ ਨਹੀਂ ਆਉਂਦਾ ਉਹ) ਆਪਣਾ ਮਨੁੱਖਾ ਜਨਮ ਵਿਅਰਥ ਗਵਾ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਨੈ = ਕਿਸੇ ਨੇ ਭੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nadie ha encontrado al Señor sin el Guru, todos los que han tratado han perdido su vida en vano."