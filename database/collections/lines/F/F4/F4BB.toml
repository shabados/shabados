[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੇ ਬਾਝਹੁ; ਕੋ ਅਵਰੁ ਨ ਦੂਆ ॥"
page = 113
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the True Lord there is no other second."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਸੁਆਮੀ ਦੇ ਬਗੈਰ ਹੋਰ ਕੋਈ ਦੂਸਰਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the True One, there is no other at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਸਚੇ ਸੇ ਬਿਨਾ ਅਵਰੁ ਦੂਜਾ ਕੋਈ ਸਤ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਤੋਂ ਬਿਨਾ ਕੋਈ ਹੋਰ ਦੂਜਾ (ਆਤਮਕ ਆਨੰਦ ਦੇਣ ਵਾਲਾ ਨਹੀਂ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਆ = ਦੂਜਾ, ਉਸ ਵਰਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Uno Verdadero, no hay nadie más;"