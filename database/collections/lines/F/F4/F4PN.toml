[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ; ਸਦਾ ਸਦ ਜਾਗਤ ॥"
page = 273
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "For ever and aye, the Lord's divine is wakeful."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਦੀਵ ਤੇ ਹਮੇਸ਼ਾ, ਸੁਆਮੀ ਦਾ ਵੇਤਾ ਚੇਤਨ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The God-conscious being is awake and aware, forever and ever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ ਸਰਬ ਸਮੇਂ ਮੇਂ ਸਦਾ ਹੀ ਗਿਆਨ ਦ੍ਰਿਸ਼ਟੀ ਕਰ ਜਾਗਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮਗਿਆਨੀ ਸਦਾ (ਵਿਕਾਰਾਂ ਦੇ ਹਮਲੇ ਵਲੋਂ) ਸੁਚੇਤ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਦ = ਸਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El ser conciente de Dios, vive despierto y conciente, por siempre y para siempre."