[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਪੜਣਾ ਹਰਿ ਬੁਝਣਾ; ਹਰਿ ਸਿਉ ਰਖਹੁ ਪਿਆਰੁ ॥"
page = 937
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Read thou of God alone, understand thou Him and embrace thou love for thy God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਕੇਵਲ ਵਾਹਿਗੁਰੂ ਬਾਰੇ ਪੜ੍ਹ, ਤੂੰ ਉਸੇ ਨੂੰ ਹੀ ਸਮਝ ਅਤੇ ਤੂੰ ਆਪਣੇ ਵਾਹਿਗੁਰੂ ਨਾਲ ਹੀ ਪ੍ਰੀਤੀ ਪਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Read about the Lord, understand the Lord, and enshrine love for the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹਰੀ ਕਾ ਹੀ ਪੜਨਾ ਔਰ ਹਰੀ ਕਾ ਹੀ ਬੁਝਣਾ ਕਰੋ ਔਰ ਹਰੀ ਸਾਥ ਹੀ ਪਿਆਰ ਰਖੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸੋ, ਹੇ ਪਾਂਡੇ! ਜੇ ਸੁਖ ਲੱਭਦਾ ਹੈ ਤਾਂ) ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਪੜ੍ਹ, ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਹੀ ਵਿਚਾਰ, ਪ੍ਰਭੂ ਨਾਲ ਹੀ ਪਿਆਰ ਪਾ;"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, lee únicamente de Dios, Conócelo y Ámalo sólo a Él,"