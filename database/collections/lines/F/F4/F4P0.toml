[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਾਥ ਦੇਇ ਜਿਨਿ ਰਾਖੇ ॥"
page = 630
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have been saved by His extended hand,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਆਪਣਾ ਹੱਥ ਦੇ ਕੇ ਮੈਨੂੰ ਬਚਾ ਲਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He gave me His hand, and protected me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਹਮ ਹਾਥ ਦੇ ਕਰ ਰਾਖੇ ਹਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਆਪਣੇ ਹੱਥ ਦੇ ਕੇ (ਉਹਨਾਂ ਮਨੁੱਖਾਂ ਨੂੰ ਦੁੱਖਾਂ ਵਿਕਾਰਾਂ ਤੋਂ) ਬਚਾ ਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਇ = ਦੇ ਕੇ। ਜਿਨਿ = ਜਿਸ (ਖਸਮ-ਪ੍ਰਭੂ) ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bebo de la Más Sublime"