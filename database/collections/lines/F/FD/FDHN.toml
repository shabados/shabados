[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਣੀ ਕਲਾ; ਆਪੇ ਹੀ ਜਾਣੈ ॥"
page = 159
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His might, He Himself Knows."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਸ਼ਕਤੀ ਉਹ ਆਪ ਹੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself knows His Own Almighty Power."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਆਪਣੀ ਕਲਾ ਕੋ ਆਪ ਹੀ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਆਪਣੀ ਇਹ ਗੁਝੀ ਤਾਕਤ ਆਪ ਹੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਲਾ = ਤਾਕਤ, ਸ਼ਕਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo Dios conoce Sus Poderes Misteriosos,"