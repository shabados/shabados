[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦਰਗਹ ਵਿਰਲਾ ਕੋਇ, ਬਖਤ ਬਲੰਦਗੀ ॥੩॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "A rare person of high fortune reaches His court."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਦਰਗਾਹ ਵਿਖੇ ਉੱਚੇ ਭਾਗਾਂ ਵਾਲਾ ਕੋਈ ਵਿਰਲਾ ਹੀ ਹੁੰਦਾ ਹੈ।"