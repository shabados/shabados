type = "primary"
data = "ਉਠੀ ਜੈ ਧੁਨੰ ਪੁਰ ਰਹੀ ਲੋਗ ਪੂਰੰ ॥"
page = 275

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On destroying the tyrant, the people of all directions hailed Shatrughan  his fame spread in all the directions nicely"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਲਸਰੂਪ ਜੈ ਦੀ ਧੁਨੀ ਉਠੀ ਜੋ (ਤਿੰਨਾਂ) ਲੋਕਾਂ ਵਿੱਚ ਪਸਰ ਰਹੀ ਹੈ"