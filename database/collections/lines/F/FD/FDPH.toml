[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਖਹਿ ਬਰਮੇ; ਆਖਹਿ ਇੰਦ ॥"
page = 5
line = 19

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਅਨਪੁਰਖ ਬਹੁਵਚਨ ਕਿਰਿਆ"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Brahmas speak of Thee and Indras speak of Thee as well."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਰ੍ਹਮੇ ਤੇਰਾ ਜ਼ਿਕਰ ਕਰਦੇ ਹਨ ਅਤੇ ਇੰਦ੍ਰ ਭੀ ਤੇਰਾ ਹੀ ਜ਼ਿਕਰ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Brahma speaks, Indra speaks."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮੇਂ ਜੀ ਭੀ ਕਹਤੇ ਹੈਂ, (ਇੰਦੁ) ਚੰਦ੍ਰਮੇ ਵਾ ਇੰਦ੍ਰ ਭੀ ਕਹਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਈ ਬ੍ਰਹਮਾ, ਕਈ ਇੰਦਰ ਅਕਾਲ ਪੁਰਖ ਦੀ ਵਡਿਆਈ ਆਖਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਰਮੇ = ਕਈ ਬ੍ਰਹਮਾ। ਇੰਦ = ਇੰਦਰ ਦੇਵਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tus Himnos son cantados por Indra y Brahma,"