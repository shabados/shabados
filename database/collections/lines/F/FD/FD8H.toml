[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਮ ਤੇਰੇ ਜੰਤ; ਤੂ ਬਜਾਵਨਹਾਰਾ ॥"
page = 1144
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am Thy musical instrument and Thou are the Player."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰਾ ਸੰਗੀਤਕ ਸਾਜ ਹਾਂ ਅਤੇ ਤੂੰ ਵਜਾਵਣ ਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am Your musical instrument, and You are the Musician."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ ਤੇਰੇ (ਜੰਤ) ਬਜੰਤ੍ਰ ਹੈਂ ਔਰ ਤੂੰ ਬਜਾਵਨੇ ਵਾਲਾ ਹੈਂ, ਭਾਵ ਸੇ ਤੇਰੀ ਹੀ ਪ੍ਰੇਰਨਾ ਕਰ ਸਮਗਰ ਜੀਵ ਵਿਵਹਾਰਾਦਿਕ ਕਰ ਰਹੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਅਸੀਂ ਜੀਵ ਤੇਰੇ (ਸੰਗੀਤਕ) ਸਾਜ਼ ਹਾਂ, ਤੂੰ (ਇਹਨਾਂ ਸਾਜ਼ਾਂ ਨੂੰ) ਵਜਾਣ ਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੰਤ = ਜੰਤ੍ਰ, ਸਾਜ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Somos Tus Instrumentos, oh Dios, Tú eres Quien los toca."