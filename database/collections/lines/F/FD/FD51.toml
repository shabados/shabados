[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਫਿਰਿ ਪੁਛਣਿ ਸਿਧ, ਨਾਨਕਾ ਮਾਤ ਲੋਕ ਵਿਚਿ ਕਿਆ ਵਰਤਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Siddhs again asked, (O Nanak! How are the dealings on mother earth?)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਤਦ) ਫੇਰ ਸਿੱਧਾਂ ਨੇ ਪੁੱਛਿਆ, “ਹੇ ਨਾਨਕਾ! ਭਾਰਥ ਖੰਡ ਵਿਖੇ ਕੀ ਵਰਤਾਰਾ ਹੈ?”"