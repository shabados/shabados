[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗ੍ਵਾਰਨੀਯਾ ਸੁ ਰਹੀ ਗ੍ਰਿਹ ਮੈ; ਜਿਨ ਕੇ ਮਨ ਬੀਚ ਸੁ ਸੋਕ ਭਏ ਹੈ ॥"
page = 377

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The gopis remained within their homes and the suffering of their mind increased abundantly"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਗੋਪੀਆਂ ਘਰ ਵਿਚ ਹੀ ਰਹੀਆਂ ਹਨ, ਜਿਨ੍ਹਾਂ ਦੇ ਮਨ ਵਿਚ ਸੋਗ ਪੈਦਾ ਹੋ ਗਿਆ ਹੈ।"