[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਕਲ ਨਾਮ ਸ੍ਰੀ ਪਾਸਿ ਕੇ; ਨਿਕਸਤ ਚਲੈ ਬਿਅੰਤ ॥੩੮੦॥"
page = 734

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying “Neeldhar” in the beginning and Ishraastra” at the end, innumerable names of Paash continue to be evolved.380."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਤਰ੍ਹਾਂ) ਪਾਸ ਦੇ ਅਨੰਤ ਨਾਮ ਬਣ ਸਕਦੇ ਹਨ ॥੩੮੦॥"