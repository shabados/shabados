[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੋ ਪਰ ਨਾਰਿ, ਅਨੁਗ੍ਰਹੁ ਕਰਿਯਹੁ ॥"
page = 881

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘My dear Lady, remembering that night, please take pity on me."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਇਸਤਰੀ! ਮੇਰੇ ਉਤੇ ਮਿਹਰ ਕਰੋ।"