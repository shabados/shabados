[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਲੇਖੰ ਅਭੇਖੰ ਅਭੂਤੰ ਅਦ੍ਵੈਖੰ ॥"
page = 40

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is Accountless, Guiseless, Elementless and Blemishless"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਤੂੰ) ਲੇਖੇ ਤੋਂ ਬਾਹਰ, ਭੇਖ ਤੋਂ ਰਹਿਤ, ਭੌਤਿਕਤਾ ਤੋਂ ਉੱਚਾ, ਦ੍ਵੈਸ਼ ਤੋਂ ਪਰੇ ਹੈਂ।"