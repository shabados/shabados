[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੁਕਤਿ ਪਦਾਰਥੁ; ਸਬਦਿ ਸਲਾਹੀ ॥"
page = 1024
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "but the wealth of salvation is attained to by praising the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੰਤੂ ਕਲਿਆਣ ਦੀ ਦੌਲਤ ਸਾਹਿਬ ਦੀ ਸਿਫ਼ਤ ਸ਼ਲਾਘਾ ਕਰਨ ਦੁਆਰਾ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but the treasure of liberation comes only by praising the Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੁਕਤੀ ਪਦਾਰਥ ਤੌ ਸਬਦ ਕੇ ਸਲਾਹੁਣੇ ਕਰਿ ਮਿਲਤੀ ਥੀ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਮੁਕਤੀ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਪਦਾਰਥ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕੀਤਿਆਂ ਹੀ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਲਾਹੀ = ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero la Emancipación es obtenida alabando al Señor a través de la Palabra."