[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਖੇਲਿ ਅਖੇਟਕ ਨ੍ਰਿਪਤਿ ਇਕ; ਆਨਿ ਭਯੋ ਤਿਹ ਯਾਰ ॥੩॥"
page = 816

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But a Raja on a hunting spree fell in love with her.(3)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਰਾਜਾ ਸ਼ਿਕਾਰ ਖੇਡਦਿਆਂ ਉਸ ਦਾ ਯਾਰ ਆ ਬਣਿਆ ॥੩॥"