[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦ੍ਵੈ ਘਟਿ ਆਠ ਰਥੀ ਬਲਵੰਤ; ਤਿਨੋ ਹੂ ਤੇ ਏਕ ਬਲੀ ਨਹੀ ਹੀਨੋ ॥"
page = 529

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He was not at all inferior in strength to the six chariot-riders in any way,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਛੇ ਮਹਾਨ ਯੋਧੇ (ਉਸ ਨਾਲ ਲੜਨ ਲਈ ਆਏ ਸਨ) ਉਨ੍ਹਾਂ ਵਿਚੋਂ ਇਕ ਵੀ ਬਲ ਵਿਚ ਘਟ ਨਹੀਂ ਹੈ।"