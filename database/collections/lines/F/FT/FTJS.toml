[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਪੰਥਿ ਚਲਾਇ, ਚਲਣੁ ਭਾਣਿਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Gurmukh has ordained that community (panth), who moves in the will of Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾਂ ਨੇ (ਏਹੋ) ਪੰਥ ਤੋਰਿਆ ਹੈ (ਕਿ ਵਾਹਿਗੁਰੂ ਦੇ) ਭਾਣੇ ਵਿਖੇ ਚੱਲਣਾ (ਹੀ ਸ੍ਰੇਸ਼ਟ ਹੈ)।"