[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਗੁਰ ਪੂਰੇ; ਨਾਹੀ ਉਧਾਰੁ ॥"
page = 886
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Perfect Guru, the mortal is emancipated not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਾਂ ਦੇ ਬਾਝੋਂ ਪ੍ਰਾਣੀ ਦਾ ਪਾਰ ਉਤਾਰਾ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Perfect Guru, no one is saved."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਬਿਨਾ ਗੁਰੂ ਪੂਰਿਓਂ ਸੇ ਉਧਾਰ ਨਹੀਂ ਹੋਵੈਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਣ ਤੋਂ ਬਿਨਾ (ਅਨੇਕਾਂ ਜੂਨਾਂ ਤੋਂ) ਪਾਰ-ਉਤਾਰਾ ਨਹੀਂ ਹੋ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਧਾਰੁ = (ਕ੍ਰੋੜਾਂ ਜਨਮਾਂ ਤੋਂ) ਪਾਰ-ਉਤਾਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Perfecto Guru, nadie ha sido salvado;"