[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਡਾਰਿ ਸੀਸ ਤਾ ਕੇ ਦਯੋ; ਮਾਰਿਯੋ ਚੋਰ ਜਰਾਇ ॥੧੨॥"
page = 849

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She dumped it on his head and thus killed him.(12)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਸਿਰ ਵਿਚ ਪਾ ਦਿੱਤਾ (ਅਤੇ ਇਸ ਤਰ੍ਹਾਂ) ਚੋਰ ਨੂੰ ਸਾੜ ਕੇ ਮਾਰ ਦਿੱਤਾ ॥੧੨॥"