[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੂਖਨ ਅੰਗ ਅਨੂਪ ਉਤਾਰੇ ॥੮੧੮॥"
page = 285

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The banners were cut and attached to the trees and the unique ornaments of the soldiers were removed from their limbs and thrown away.818."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਹਿਣ ਲੱਗੀ-ਹੇ ਪੁੱਤਰੋ! ਤੁਸਾਂ ਮੈਨੂੰ ਵਿਧਵਾ ਕਰ ਦਿੱਤਾ ਹੈ ॥੮੧੯॥"