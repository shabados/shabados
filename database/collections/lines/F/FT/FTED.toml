[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਛਿਅ ਰੁਤਿ ਬਾਰਹ ਮਾਹ, ਹਸਿ ਹਸਿ ਰੋਵਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The jiv (creature), laughs, weeps and wails during all the six seasons and twelve months of his life"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਬਾਰਾਂ ਮਹੀਨਿਆਂ ਦੀਆਂ ਛੀ ਰੁੱਤਾਂ ਵਿਖੇ ਹੱਸ ਹੱਸ ਕੇ ਰੋਂਦੇ ਹਨ।"