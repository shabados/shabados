[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਿਵ ਸਤ੍ਰੁ ਗਯੋ ਸਰ ਮਾਰਿ ॥"
page = 924

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "His extreme handsomeness had shot through her a Cupid’s sharp arrow."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਸ਼ਿਵ ਦਾ ਵੈਰੀ (ਕਾਮ ਦੇਵ) ਬਾਣ ਮਾਰ ਗਿਆ।"