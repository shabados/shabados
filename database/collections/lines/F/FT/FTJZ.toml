[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਨ ਬਸੇ ਤਬ ਧਾਮ ਲੁਝਾਰਾ ॥"
page = 71

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In this way, when Jujhar Singh was killed, the soldiers returned their homes."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਲੜਾਕੇ ਯੋਧੇ (ਆਪਣੇ) ਘਰਾਂ ਵਿਚ ਜਾ ਟਿਕੇ।"