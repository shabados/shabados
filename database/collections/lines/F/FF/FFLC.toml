[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਸੇਵੀ; ਜੋ ਰਖੈ ਨਿਦਾਨਾ ॥੧॥"
page = 1136
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I serve Him alone, who will save me in the end."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕੇਵਲ ਉਸ ਦੀ ਟਹਿਲ ਕਰਦਾ ਹਾਂ, ਜੋ ਅਖੀਰ ਨੂੰ ਮੇਰੀ ਰੱਖਿਆ ਕਰੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I serve only the One, who will protect me in the end. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਅੰਤ ਕੋ ਰਖਕ ਹੈ ਤਿਸੁ ਕੋ ਸੇਵਤਾ ਹੂੰ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤਾਂ (ਸਿਰਫ਼) ਉਸ ਪਰਮਾਤਮਾ ਨੂੰ ਸਿਮਰਦਾ ਹਾਂ ਜਿਹੜਾ ਆਖ਼ਿਰ (ਹਰੇਕ ਦੀ) ਰੱਖਿਆ ਕਰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸੁ = ਉਸ ਪ੍ਰਭੂ ਨੂੰ। ਸੇਵੀ = ਸੇਵੀਂ, ਮੈਂ ਸਿਮਰਦਾ ਹਾਂ। ਰਖੈ = ਰੱਖਿਆ ਕਰਦਾ ਹੈ। ਨਿਦਾਨਾ = ਆਖ਼ਰ ਨੂੰ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "como el musulmán, pues Le sirvo sólo a Él, Quien emancipa a todos al final. (1)"