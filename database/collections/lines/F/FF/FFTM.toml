[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਵਤ ਜੀਵਤ; ਜੀਵਤ ਰਹਹੁ ॥"
page = 1138
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thus thou shall live eternally."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਤੂੰ ਕਾਲ ਸਥਾਈ ਹੀ ਜਿਉਂਦਾ ਰਹੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Live, live, live forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਭਾਵ ਕੋ ਦੂਰ ਕਰਕੇ, ਜੀਵਤ ਰੂਪ ਪਰਮੇਸ੍ਵਰ ਕੋ ਜਾਣ ਕਰ ਸਦਾ ਜੀਵਤੇ ਰਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਮ ਸਿਮਰਨ ਦੁਆਰਾ) ਸਦਾ ਆਤਮਕ ਜੀਵਨ ਵਾਲੇ ਬਣੇ ਰਹੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਵਤ ਜੀਵਤ ਜੀਵਤ = ਸਦਾ ਹੀ ਆਤਮਕ ਜੀਵਨ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si, uno habita eternamente y para siempre,"