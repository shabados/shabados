[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿ ਸ਼ਿਕਮਸ਼ ਫ਼ਰੋਮਾਦ ਅਜ਼ ਤੁਖ਼ਮਿ ਸ਼ਾਹ ॥੧੪॥"
page = 1410

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And through the semen of that tycoon, she became pregnant.(14)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਸ ਸ਼ਾਹੂਕਾਰ ਦੇ ਬੀਰਜ ਤੋਂ ਉਸ ਨੂੰ ਗਰਭ ਠਹਿਰ ਗਿਆ ॥੧੪॥"