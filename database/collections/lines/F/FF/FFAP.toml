[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਨਿਰਮਲੁ ਅਤਿ ਊਜਲਾ; ਬਿਨੁ ਗੁਰ. ਪਾਇਆ ਨ ਜਾਇ ॥"
page = 66
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is immaculate and exceedingly effulgent. Without the Guru He is not obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਪਵਿੱਤ੍ਰ ਤੇ ਪਰਮ ਚਮਕੀਲਾ ਹੈ। ਗੁਰਾਂ ਦੇ ਬਾਝੋਂ ਉਹ ਪਰਾਪਤ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is Immaculate and Radiantly Bright; without the Guru, He cannot be found."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਜੋ (ਨਿਰਮਲੁ) ਸੁਧੁ ਸ੍ਵਰੂਪੁ ਔਰ ਅਤਿ (ਊਜਲਾ) ਪ੍ਰਕਾਸ ਰੂਪੁ ਹੈ, ਸੋ ਬਿਨਾਂ ਗੁਰੂ ਸੇ ਪਾਇਆ ਨਹੀਂ ਜਾਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਪਵਿਤ੍ਰ-ਸਰੂਪ ਹੈ, ਬਹੁਤ ਹੀ ਪਵਿਤ੍ਰ-ਸਰੂਪ ਹੈ, ਗੁਰੂ ਦੀ ਸਰਨ ਤੋਂ ਬਿਨਾ ਉਸ ਨਾਲ ਮਿਲਾਪ ਨਹੀਂ ਹੋ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor es Inmaculado, lo más puro de lo puro, pero uno no lo obtiene sin el Guru."