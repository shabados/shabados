[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਕਬੀਰ; ਪਰਗਟੁ ਭਈ ਖੇਡ ॥"
page = 326
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir, a strange sport has become manifest,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨਇਕ ਅਤਭੁਤ ਖੇਲ ਜਾਹਰ ਹੋ ਆਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, a strange sport has become manifest:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਏਹ ਖੇਡ ਸੰਤ ਜਨੋਂ ਕੋ ਪ੍ਰਗਟ ਭਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ- (ਮੈਨੂੰ ਤਾਂ) ਇਹ ਅਜੀਬ ਤਮਾਸ਼ਾ ਸਮਝ ਵਿਚ ਆ ਗਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਗਟੁ ਭਈ = ਸਮਝ ਵਿਚ ਆ ਗਈ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, veo claramente el juego extraño del mundo,"