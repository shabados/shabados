[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਿਹ ਬਿਨੁ ਭੂਤਤਿ ਦੁਖਿਤ ਹ੍ਵੈ; ਮੰਤ੍ਰੀ ਲਏ ਬੁਲਾਇ ॥"
page = 812

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Without her company the Raja was extremely afflicted, and he called in his ministers."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਤੋਂ ਬਿਨਾ ਰਾਜੇ ਨੇ ਦੁਖੀ ਹੋ ਕੇ ਮੰਤ੍ਰੀਆਂ ਨੂੰ ਬੁਲਾ ਲਿਆ"