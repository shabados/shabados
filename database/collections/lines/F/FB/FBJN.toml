[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਬ ਹੀ ਮਹਾ ਗ︀ਯਾਨ ਕੋ ਜਾਨੈ ਪਰਮ ਪਯੂਖਹਿ ਪੀਜੈ ॥੯੮॥"
page = 684

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Only then you will realise the Supreme Essence and would be able to quaff the nectar.24.98."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਹੀ ਮਹਾਨ ਗਿਆਨ ਨੂੰ ਜਾਣਿਆ ਜਾਏਗਾ ਅਤੇ ਪਰਮ ਅੰਮ੍ਰਿਤ ਨੂੰ ਪੀ ਲਿਆ ਜਾਵੇਗਾ ॥੯੮॥"