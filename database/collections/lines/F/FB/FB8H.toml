[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਧੁ ਬਿਨੁ; ਦੂਜਾ ਅਵਰੁ ਨ ਕੋਇ ॥"
page = 12
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Beside Thee, there is no other second."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੈ ਬਾਝੋਂ ਹੋਰ ਦੂਸਰਾ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no one except You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰੁ ਤੇਰੇ ਬਿਨਾ ਦੂਸਰਾ ਔਰੁ ਕੋਈ ਕਰਤਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੈਥੋਂ ਬਿਨਾ (ਤੇਰੇ ਵਰਗਾ) ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਵਰੁ = ਹੋਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aparte de Ti, no hay otro más."