[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜੀਵਨ ਪਦੁ; ਨਾਨਕ. ਪ੍ਰਭੁ ਮੇਰਾ ॥੪॥੩॥੧੯॥"
page = 1005
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Nanak my God-Lord is the Giver of the Eternal life,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਮੈਡਾਂ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਅਮਰ ਜਿੰਦਗੀ ਦੇਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, my Lord God is the Giver of the true state of life. ||4||3||19||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਕਿਉਂਕਿ ਹੇ ਹਰਿ ਪ੍ਰਭੂ! ਮੇਰਾ ਏਹੀ ਜੀਵਾਵਨੇ ਕਾ ਅਸਥਾਨ ਹੈ॥੪॥੩॥੧੯॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਮੇਰਾ ਹਰੀ-ਪ੍ਰਭੂ ਆਤਮਕ ਜੀਵਨ ਦਾ ਦਰਜਾ (ਦੇਣ ਵਾਲਾ) ਹੈ ॥੪॥੩॥੧੯॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਵਨ ਪਦੁ = ਆਤਮਕ ਜੀਵਨ ਦਾ ਦਰਜਾ ॥੪॥੩॥੧੯॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, bendíceme con Tu Nombre, Tu Sirviente Te pide sólo esto, pues sólo Tú eres el Supremo Objeto de vida de Nanak.(4-3-19)"