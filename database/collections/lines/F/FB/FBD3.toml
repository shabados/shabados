[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਫਾਥੀ ਛੂਟਹਿ; ਗੁਣ ਗਿਆਨ ਬੀਚਾਰਿ ॥੫॥"
page = 1275
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou are ensnared. Through virtues, Divine knowledge and the Lord's meditation, thou can delivered."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਫਸ ਗਈ ਹੈਂ। ਨੇਕੀਆਂ, ਬ੍ਰਹਮ-ਗਿਆਤ ਅਤੇ ਸੁਆਮੀ ਦੇ ਸਿਮਰਨ ਰਾਹੀਂ ਤੂੰ ਬੰਦ-ਖਲਾਸ ਹੋ ਸਕਦੀ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are trapped. You can only be saved by virtuous conduct, spiritual wisdom and contemplation. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਫਾਥੀ ਹੂਈ ਗਿਆਨ ਵੀਚਾਰ ਆਦਿਕ ਗੁਣੋਂ ਕਰ ਛੂਟੇਂਗੀ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਨੂੰ ਆਪਣੇ ਸੋਚ-ਮੰਡਲ ਵਿਚ ਟਿਕਾ, ਪ੍ਰਭੂ ਨਾਲ ਡੂੰਘੀ ਸਾਂਝ ਪਾ, ਤਦੋਂ ਹੀ ਤੂੰ (ਮਾਇਆ ਦੇ ਮੋਹ ਦੇ ਜਾਲ ਤੇ ਆਤਮਕ ਮੌਤ ਤੋਂ) ਬਚ ਸਕੇਂਗੀ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sólo podrás ser salvado con una conducta Virtuosa, con la Meditación y la Sabiduría Espiritual. (5)"