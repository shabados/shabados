[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਨਾਨਕ, ਦੇ ਵਡਿਆਈ ॥"
page = 164
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "On the true disciples of true Guru, the Lord bestows glory o, Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸੱਚੇ ਸਿੱਖਾਂ ਨੂੰ ਪ੍ਰਭੂ ਪ੍ਰਭਤਾ ਪਰਦਾਨ ਕਰਦਾ ਹੈ, ਹੈ ਨਾਨਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Gurmukhs are blessed with glorious greatness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਗੁਰੋਂ ਦ੍ਵਾਰਾ ਅਪਨੇ ਨਾਮ ਕੀ ਵਡਿਆਈ ਦੇਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਜਿਸ ਕਿਸੇ ਉਤੇ ਪ੍ਰਭੂ ਮਿਹਰ ਕਰਦਾ ਹੈ ਉਸ ਨੂੰ) ਗੁਰੂ ਦੀ ਸਰਨ ਪਾ ਕੇ (ਆਪਣੇ ਨਾਮ ਦੀ) ਵਡਿਆਈ ਬਖ਼ਸ਼ਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇ = ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y Tú confieres la Gloria a aquéllos que voltean hacia Ti."