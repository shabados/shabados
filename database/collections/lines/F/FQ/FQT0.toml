[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੋਊ ਕਹੈ ਹਰਿ ਜੂ ਜਿਤ ਹੈ ਕੋਊ ਇਉ ਕਹਿ ਏ ਜਿਤ ਹੈ ਬਹਸਾਵੈ ॥"
page = 405

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Someone says that Krishna will win and someone says that those warriors will gain victory"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਕਹਿੰਦਾ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਜਿਤਣਗੇ, ਕੋਈ ਇਉਂ ਕਹਿੰਦਾ ਕਿ ਇਹ ਜਿਤੇਗਾ, ਇਸ ਪ੍ਰਕਾਰ ਦੀ ਬੈਹਸ ਕਰਨ ਲਗ ਪੈਂਦੇ ਹਨ।"