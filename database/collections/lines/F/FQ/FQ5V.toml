[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕਿ ਮਾਸਹਾਰੀ; ਇਕਿ ਤ੍ਰਿਣੁ ਖਾਹਿ ॥"
page = 144
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some are meat eaters and some eat grass."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਗੋਸਤ ਖਾਣ ਵਾਲੇ ਹਨ ਅਤੇ ਕਈ ਘਾਹ ਫੂਸ ਖਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some eat meat, while others eat grass."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਮਾਸ ਕਾ ਅਹਾਰ ਕਰਤੇ ਹੈਂ ਏਕ ਘਾਸ ਖਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਈ ਜੀਵ ਮਾਸ ਖਾਣ ਵਾਲੇ ਹਨ, ਕਈ ਘਾਹ ਖਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunos se alimentan de carnes, otros de pasto;"