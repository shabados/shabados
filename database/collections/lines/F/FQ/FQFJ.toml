[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਚਿ ਨਚਿ ਹਸਹਿ; ਚਲਹਿ ਸੇ ਰੋਇ ॥"
page = 465
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who dance, dance and laugh, shall weep on their departure."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਨੱਚਦੇ, ਨੱਚਦੇ ਹਸਦੇ ਹਨ, ਉਹ ਤੁਰਨ (ਮੌਤ) ਵੇਲੇ ਰੋਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who dance and dance and laugh, shall weep on their ultimate departure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਚ ਨਾਚ ਕਰ ਕੇ ਹਸਤੇ ਹੈਂ ਫਿਰ ਚਲਨੇ ਕੇ ਸਮ੍ਯ ਰੋਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੀਵ ਨੱਚ ਨੱਚ ਕੇ ਹੱਸਦੇ ਹਨ, ਉਹ (ਅੰਤ ਨੂੰ) ਰੋ ਕੇ (ਏਥੋਂ) ਤੁਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੋਇ = ਰੋ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquéllos que bailan ahora, se lamentarán en el más allá,"