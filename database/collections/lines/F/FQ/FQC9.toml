[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਥਨੀ ਬਦਨੀ; ਪੜਿ ਪੜਿ ਭਾਰੁ ॥"
page = 412
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Mere words of mouth and recurring reading is an unwarrantable load."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਿਰੀਆਂ ਮੂੰਹ ਦੀਆਂ ਗੱਲਾਂ ਅਤੇ ਮੁੜ ਮੁੜ ਕੇ ਪੜ੍ਹਨਾ, ਇਕ ਬੇਲੋੜਾ ਬੋਝ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Words, spoken and read again and again, are useless loads."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਗੁਣਾਨਵਾਦ ਸੇ ਬਿਨਾਂ ਜੋ ਔਰੁ ਕਥਾ ਕਾ ਪੜ੍ਹਨਾ ਹੈ ਔਰ (ਬਦਨੀ) ਕਵਿਤਾ ਕਾ ਜੋ ਪੜਨਾ ਹੈ, ਸੋ (ਭਾਰੁ) ਬੋਝ ਹੈ ਅਰਥਾਤ ਹਰਿਨਾਮ ਬਿਨ ਸਭ ਨਿਸਫਲ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਗੁਣ ਕਹਣ ਨਾਲ ਬੋਲਣ ਨਾਲ ਤੇ ਮੁੜ ਮੁੜ ਪੜ੍ਹ ਕੇ ਭੀ (ਮਨ ਉਤੇ ਹਉਮੈ ਦਾ) ਭਾਰ (ਹੀ ਵਧਦਾ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਥਨੀ ਬਦਨੀ = ਕਹਿਣ ਨਾਲ, ਬੋਲਣ ਨਾਲ। ਭਾਰੁ = (ਹਉਮੈ ਦਾ) ਭਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De otra forma, el leer y cantar son una ilusión, porque aunque los escritos son incontables,"