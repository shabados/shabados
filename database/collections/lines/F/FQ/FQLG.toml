[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੰਗ੍ਰਹ ਕਰੋ ਸਦਾ ਸਿਮਰਨ ਕੋ; ਪਰਮ ਪਾਪ ਤਜਿ ਭਾਗੋ ॥੨॥"
page = 710

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Absorb yourself in the remembrance of the name of the Lord and abandon and run away from sins.2."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਸਿਮਰਨ ਨੂੰ ਇਕਤਰ ਕਰੋ ਅਤੇ ਮਹਾਂ ਪਾਪਾਂ ਨੂੰ ਛਡ ਕੇ (ਇਨ੍ਹਾਂ ਤੋਂ) ਦੂਰ ਹੋ ਜਾਓ ॥੨॥"