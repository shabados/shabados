[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸਾ ਰਾਮ ਭਗਤੁ; ਜਨੁ ਹੋਈ ॥"
page = 225
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "such is the devoted slave of the all Pervading Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹੋ ਜਿਹਾ ਹੈ ਜਾ-ਨਿਸਾਰ ਗੋਲਾ ਸਰਬ-ਵਿਆਪਕ ਸੁਆਮੀ ਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such are the humble devotees of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਸਿਧ ਜੀ ਪੂਰਬੋਕਤ ਪ੍ਰਕਾਰ ਨਿਸਚੇਵਾਨ ਐਸਾ ਰਾਮ ਭਗਤ (ਜਨੁ) ਦਾਸ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਭਗਤ ਪਰਮਾਤਮਾ ਦਾ ਸੇਵਕ ਇਸ ਤਰ੍ਹਾਂ ਦਾ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਮ ਭਗਤੁ = ਪਰਮਾਤਮਾ ਦਾ ਭਗਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Estos son humildes devotos del Señor."