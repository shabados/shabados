[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੂਪ ਅਠਾਰਹ ਜੁਧ ਮੈ ਸ︀ਯਾਮਿ ਹਨੇ ਬਲ ਬੀਰ ॥"
page = 423

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Krishna has killed eighteen kings in the war"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕ੍ਰਿਸ਼ਨ ਨੇ ਅਠਾਰ੍ਹਾਂ ਬਲਵਾਨ ਰਾਜਿਆਂ ਨੂੰ ਯੁੱਧ ਵਿਚ ਮਾਰ ਦਿੱਤਾ ਹੈ।"