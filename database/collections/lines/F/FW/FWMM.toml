[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦੀ; ਸਦਾ ਸੁਖੁ ਪਾਏ ॥"
page = 841
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's grace, man obtains eternal peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ, ਇਨਸਾਨ ਸਦੀਵੀ ਆਰਾਮ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, one finds lasting peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਪਰ ਸਤਿਗੁਰੋਂ ਕੀ ਕਿਰਪਾ ਭਈ ਹੈ, ਸੋ ਸਦਾ ਸੁਖ ਕੋ ਪਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਸਦਾ ਆਤਮਕ ਆਨੰਦ ਮਾਣਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es a través de la Gracia del Guru que uno logra el Éxtasis Eterno."