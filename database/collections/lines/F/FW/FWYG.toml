[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਕੋਟਿ ਕੋਟਿ; ਲਖ ਧਾਵੈ ॥"
page = 562
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Myriads, myriads, myriads, and laces are keen,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾ, ਕ੍ਰੋੜਾ, ਕ੍ਰੋੜਾਂ ਅਤੇ ਲੱਖਾ ਹੀ ਦੌੜ-ਭੱਜ (ਜਤਨ) ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Millions, millions, tens of millions seek,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੀਨੋਂ ਕਾਲ ਮੇਂ ਕ੍ਰੋੜੋਂ ਹੀ ਜੀਵ ਤਿਸ ਕੇ (ਲਖ) ਦੇਖਨੇ ਕੋ ਧਾਵਤੇ ਹੈਂ ਅਰਥਾਤ ਯਤਨ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਭਾਵੇਂ ਮਨੁੱਖ ਕ੍ਰੋੜਾਂ ਜਾਂ ਲਖਾਂ ਵਾਰੀ ਜਤਨ ਕਰੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਟਿ = ਕ੍ਰੋੜਾਂ ਵਾਰੀ। ਲਖ = ਲੱਖ ਵਾਰੀ। ਧਾਵੈ = ਦੌੜਦਾ ਫਿਰੇ, ਜਤਨ ਕਰਦਾ ਫਿਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aunque millones de criaturas buscan Encontrarlo,"