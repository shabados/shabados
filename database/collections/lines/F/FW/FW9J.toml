[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਿਰਦੈ ਨਾਮੁ ਸਮੑਾਰਿ ਸਵੇਰਾ ॥੨॥"
page = 794
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within thy mind, remember thou the Lord's Name betimes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਅੰਦਰ ਤੂੰ ਪ੍ਰਭੂ ਤੇ ਨਾਮ ਦਾ ਵੇਲੇ ਸਿਰ ਆਰਾਧਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Within your heart, contemplate the Naam, the Name of the Lord, sometime. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਿਰਦੇ ਮੇਂ ਨਾਮ ਕੋ ਸੰਭਾਰੁ (ਸਵੇਰਾ) ਸੁਵਖਤ, ਭਾਵ ਛੇਤੀ ਨਾਮੁ ਸਿਮਰੁ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਵੇਲੇ-ਸਿਰ ਉਸ ਦਾ ਨਾਮ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਸਾਂਭ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਵੇਰਾ = ਸੁਵਖਤੇ ਹੀ, ਵੇਲੇ ਸਿਰ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "llega temprano a la Alabanza de Dios. (2)"