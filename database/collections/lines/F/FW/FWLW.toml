data = "ਯਾ ਮੈ ਕਛੂ ਭੇਦ ਨਹੀ ਮਾਨਹੁ ॥੭੨੬॥"
page = 752

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Comprehend all the names of Tupak by uttering firstly the word “Singh” and then adding the word “Ari”, there is no mystery in it.726."

