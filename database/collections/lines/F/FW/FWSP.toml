[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਬਿ ਲਿਖਿਆ. ਤਿਨੀ ਕਮਾਇਆ ॥"
page = 1050
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "they practise the pre-destined virtuous deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੁਢਲੇ ਲਿਖੇ ਹੋਏ ਨੇਕ ਅਮਲ ਕਮਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "act according to pre-ordained destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੂਰਬ ਜਨਮ ਕਾ ਸੁਭ ਲੇਖ ਲਿਖਿਆ ਹੂਆ ਤਿਨੋਂ ਨੇ ਕਮਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਮਨੁੱਖ ਪੂਰਬਲੇ ਜਨਮ ਵਿਚ ਕੀਤੇ ਕਰਮਾਂ ਦੇ ਸੰਸਕਾਰਾਂ ਅਨੁਸਾਰ (ਨਾਮ ਸਿਮਰਨ ਦੀ) ਕਮਾਈ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰਬਿ = ਪੂਰਬਲੇ ਜਨਮ ਵਿਚ। ਲਿਖਿਆ = ਕੀਤੇ ਕਰਮਾਂ ਦੇ ਸੰਸਕਾਰ। ਤਿਨੀ = ਉਹਨਾਂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "practican lo que estaba escrito para ellos por Dios,"