[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਬੋਲੈ; ਸੋ ਆਪੈ ਹੋਇ ॥"
page = 1162
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever he utters that happens spontaneously."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਛ ਉਹ ਆਖਦਾ ਹੈ, ਉਹ ਖੁਦ-ਬ-ਖੁਦ ਹੀ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "whatever he says, comes to pass."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਜੋ ਬੋਲੈ) ਜੋ ਬੋਲਤਾ ਹੈ, ਭਾਵ ਸੇ ਬਾਣੀ ਆਦਿ ਇੰਦ੍ਰਯਾਂ ਕੋ ਸਤਾ ਦੇਤਾ ਹੈ, ਸੋਈ ਆਪ ਹੀ ਹੈ ਐਸੇ ਜਾਨ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦਾ ਹੈ, ਉਹ ਪ੍ਰਭੂ ਦਾ ਰੂਪ ਹੀ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "logra la Plenitud,"