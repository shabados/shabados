type = "primary"
data = "ਲਖ ਚਉਰਾਸੀਹ ਜੋਨਿ, ਖੇਲੁ ਰਚਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He created the game of eighty four lakhs of species."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਚੁਰਾਸੀ ਲੱਖ ਜੂਨ ਦਾ ਖੇਲ ਰਚਾਇਆ ਹੈ।"