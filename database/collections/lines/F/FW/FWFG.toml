[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਨੌ ਆਨਿ ਕੈ, ਲਾਤ ਸੈਤਾਨ ਮਾਰੀ ॥"
page = 1002

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Raja was nonplussed as if Satan had taken over him."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇੰਜ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ) ਮਾਨੋ ਸ਼ੈਤਾਨ ਨੇ ਆ ਕੇ ਲਤ ਮਾਰੀ ਹੋਵੇ।"