[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਙਣਤੀ ਙਣੀ; ਨਹੀ ਕੋਊ ਛੂਟੈ ॥"
page = 254
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "None can be emancipated by making calculations."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲੇਖਾ-ਪੱਤਾ ਕਰਨ ਦੁਆਰਾ ਕੋਈ ਭੀ ਬੰਦ-ਖਲਾਸ ਨਹੀਂ ਹੋ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "no one is emancipated by counting and calculating."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਰਮੋਂ ਕੀ ਗਿਣਤੀ ਗਿਣਨੇ ਸੇ ਕੋਈ ਛੂਟਤਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੋਚਾਂ ਸੋਚਿਆਂ (ਇਸ ਹੋਣੀ ਤੋਂ) ਕੋਈ ਬੰਦਾ ਬਚ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਙਣਤੀ ਙਣੀ = ਗਿਣਤੀ ਗਿਣਿਆਂ, ਸੋਚਾਂ ਸੋਚਿਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por su propia cuenta, nadie se salva, y el cántaro terreno del cuerpo,"