[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ, ਨਿਰਭਉ ਤਾੜੀ ਲਾਹਾ ॥"
page = 699
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Himself, the fearless Lord sits in trance."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਹੀ ਭੈ-ਰਹਿਤ ਸੁਆਮੀ ਸਮਾਧੀ ਅੰਦਰ ਬੈਠਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Fearless Lord Himself is absorbed in Samaadhi."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਹੀ ਨਿਰਭੈ ਹੋ ਕਰ (ਤਾੜੀ) ਸਮਾਧੀ ਲਗਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਨਿਡਰ ਹੋ ਕੇ ਸਮਾਧੀ ਲਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾੜੀ = ਸਮਾਧੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo es el Señor Intrépido, contempla Su ser en un profundo trance."