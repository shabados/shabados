[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਵਨੁ ਸੈਸਾਰੀ; ਕਵਨੁ ਸੁ ਭਗਤਾ ॥"
page = 1081
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who is the householder and who the devotee of Thine?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੌਣ ਘਰਬਾਰੀ ਹੈ ਅਤੇ ਕੌਣ ਤੇਰਾ ਪ੍ਰੇਮੀ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who is worldly, and who is a devotee?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰੀ ਕੌਨ ਪ੍ਰਕਾਰ ਹੋਤਾ ਹੈ ਔ ਭਗਤ ਕੌਨ ਪ੍ਰਕਾਰ ਹੋਤਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਹੁਕਮ ਤੋਂ ਬਿਨਾ ਨਾਹ ਕੋਈ ਗ੍ਰਿਹਸਤੀ ਹੈ ਨਾਹ ਕੋਈ ਭਗਤ ਬਣ ਸਕਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੈਸਾਰੀ = ਗ੍ਰਿਹਸਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Quién es el sostenedor de hogar y quién no tiene un hogar que atender?"