type = "primary"
data = "ਕਹਤ ਨਾਨਕ; ਐਸੀ ਮਤਿ ਆਵੈ ॥"
page = 357
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, if one obtains such an understanding,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ ਜੇਕਰ ਕਿਸੇ ਨੂੰ ਐਹੋ ਜੇਹੀ ਸਮਝ ਆ ਜਾਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, if one comes to such an understanding,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਬ ਐਸੀ ਬੁਧਿ ਆਉਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਜਦੋਂ (ਪ੍ਰਭੂ ਦੀ ਆਪਣੀ ਹੀ ਮੇਹਰ ਨਾਲ ਗੁਰੂ ਦੀ ਰਾਹੀਂ) ਜੀਵ ਨੂੰ ਅਜੇਹੀ ਅਕਲ ਆ ਜਾਵੇ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, Oh Señor Verdadero,"