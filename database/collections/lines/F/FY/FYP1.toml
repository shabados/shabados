[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਗਿ ਤੁਮਾਰੈ; ਮੈ ਕਰੇ ਅਨੰਦਾ ਜੀਉ ॥"
page = 217
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In Thine company, I enjoy happiness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਸੰਗਤ ਅੰਦਰ ਮੈਂ ਖੁਸ਼ੀ ਮਾਣਦੀ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In Your Company, I am in ecstasy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੁਮਾਰੇ ਸੰਗ ਮੇਂ ਆਏ ਹੈਂ, ਸੋ ਅਨੰਦ ਰੂਪ ਹੀ ਕਰ ਦੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮੇਰੇ ਪਿਆਰੇ ਰਾਮ ਜੀ!) ਤੇਰੀ ਸੰਗਤਿ ਵਿਚ ਰਹਿ ਕੇ ਮੈਂ ਆਨੰਦ ਮਾਣਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗਿ ਤੁਮਾਰੈ = ਤੇਰੀ ਸੰਗਤਿ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Tu Compañía, estamos en serena Paz,"