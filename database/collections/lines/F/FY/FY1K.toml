[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪੜਿ ਵਿਦਿਆ ਘਰਿ ਆਇਆ; ਗੁਰਮੁਖਿ ਬਾਲਮੀਕ ਮਨਿ ਭਾਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Valmiki also only becoming guru- oriented attained knowledge and then he returned home."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਬਾਲਮੀਕ ਬੀ ਨਿਮ੍ਰਭੂਤ ਹੋ) ਵਿੱਦ੍ਯਾ ਪੜ੍ਹਕੇ ਗੁਰਮੁਖ ਬਾਲਮੀਕ ਮਨ ਨੂੰ ਭਾਉਂਣਾ ਘਰ ਨੂੰ ਆਯਾ।"