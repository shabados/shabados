[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਤ੍ਰ ਤਤ੍ਰ ਧੁਜਾ ਬਧੀ ਜੈ ਪਤ੍ਰ ਕੀ ਸਭ ਧਾਮ ॥੧੯੬॥"
page = 219

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And his banners of victory are fluttering here, there and everywhere.196."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿੱਥੇ ਕਿਥੇ ਸਾਰੇ ਘਰਾਂ ਉੱਤੇ ਜਿੱਤ ਦੀ ਨਿਸ਼ਾਨੀ ਵਜੋਂ ਝੰਡੀਆਂ ਬੰਨ੍ਹੀਆਂ ਹੋਈਆਂ ਸਨ ॥੧੯੬॥"