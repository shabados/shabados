[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭਿ ਤੁਝ ਹੀ ਥਾਵਹੁ ਮੰਗਦੇ ਮੇਰੇ ਸਾਹਾ; ਤੂ ਸਭਨਾ ਕਰਹਿ ਇਕ ਦਾਤਿ ॥੨॥"
page = 670
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Everyone begs of Thee, O Lord, and Thou alone bestowest gifts on all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜਣੇ ਤੇਰੇ ਪਾਸੋਂ ਮੰਗਦੇ ਹਨ, ਹੇ ਸੁਆਮੀ! ਤੇ ਕੇਵਲ ਤੂੰ ਹੀ ਸਾਰਿਆਂ ਨੂੰ ਬਖ਼ਸ਼ੀਸ਼ਾਂ ਦਿੰਦਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everyone begs of You, O my King; You alone give gifts to all. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਪੂਰਨ ਜੀਵ ਤੇਰੇ ਹੀ ਪਾਸੋਂ ਮੰਗਤੇ ਹੈਂ। ਹੇ ਮੇਰੇ ਸ਼ਾਹਾ! ਪੁਨਾ ਤੂੰ ਏਕ ਹੀ ਸਭ ਕੋ ਦਾਤਿ ਕਰਨੇਹਾਰਾ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪਾਤਿਸ਼ਾਹ! ਸਾਰੇ ਜੀਵ ਤੇਰੇ ਪਾਸੋਂ ਹੀ (ਮੰਗਾਂ) ਮੰਗਦੇ ਹਨ। ਇਕ ਤੂੰ ਹੀ ਸਭ ਜੀਵਾਂ ਨੂੰ ਦਾਤਾਂ ਦੇ ਰਿਹਾ ਹੈਂ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਥਾਵਹੁ = ਪਾਸੋਂ। ਤੂ ਇਕ-ਇਕ ਤੂ ਹੀ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, cada uno pregunta por Ti, y Tú bendices a todos. (2)"