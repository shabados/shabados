[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਊਤਮ; ਕਿਸੁ ਆਖਉ ਹੀਨਾ ॥"
page = 1189
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All are sublime, whom should I call low?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਹੀ ਸਰੇਸ਼ਟ ਹਨ, ਮੈਂ ਕਿਸ ਨੂੰ ਨੀਵਾ ਕਹਾ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All are high and exalted; how can I call anyone low?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਕੋਈ ਊਤਮ ਹੈ। ਅਰ ਹੀਨ, ਭਾਵ ਨੀਚ ਕਿਸ ਕੋ ਕਹਾ ਜਾਵੇ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੀ ਲੁਕਾਈ ਚੰਗੀ ਹੈ, (ਕਿਉਂਕਿ ਸਭ ਵਿਚ ਪਰਮਾਤਮਾ ਆਪ ਮੌਜੂਦ ਹੈ) ਮੈਂ ਕਿਸੇ ਨੂੰ ਮਾੜਾ ਨਹੀਂ ਆਖ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭ = ਸਾਰੀ ਲੁਕਾਈ। ਊਤਮ = (ਮੈਥੋਂ) ਚੰਗੀ। ਹੀਨਾ = ਮਾੜਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos son sublimes, ¿a quién se le puede llamar bajo o deprimido?"