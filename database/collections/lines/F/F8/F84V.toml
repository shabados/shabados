[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੇਵ ਪਿਤ੍ਰ ਤੋਖੇ ਬਿਧ ਨਾਨਾ ॥"
page = 152

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He worshipped in various ways the gods and manes."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੇਵਤਿਆਂ ਅਤੇ ਪਿਤਰਾਂ ਨੂੰ ਕਈ ਤਰ੍ਹਾਂ ਨਾਲ ਪ੍ਰਸੰਨ ਕੀਤਾ।"