data = "ਨਗਰ ਪਾਵਟਾ ਬਹੁ ਬਸੈ; ਸਾਰਮੌਰ ਕੇ ਦੇਸ ॥"
page = 896

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Paonta City was established in the country of Sirmaur,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਿਰਮੌਰ ਦੇਸ਼ (ਰਿਆਸਤ) ਵਿਚ (ਇਕ) ਪਾਉਂਟਾ (ਨਾਂ ਦੀ) ਨਗਰੀ ਚੰਗੀ ਤਰ੍ਹਾਂ ਵਸਦੀ ਹੈ।"