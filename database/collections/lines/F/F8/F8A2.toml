[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਨੁ ਖਾਣਾ. ਕਪੜੁ ਪੈਨਣੁ ਦੀਆ; ਰਸ ਅਨਿ ਭੋਗਾਣੀ ॥"
page = 167
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He gave them corn to eat clothes to wear and other pleasures to enjoy,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਖਾਣ ਲਈ ਅਨਾਜ, ਪਹਿਨਣ ਲਈ ਕਪੜੇ ਅਤੇ ਹੋਰ ਖੁਸ਼ੀਆਂ ਮਾਨਣ ਲਈ ਦਿੱਤੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He gave them corn to eat, clothes to wear, and other pleasures to enjoy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਖਾਣੇ ਕੋ ਅੰਨ ਔਰ ਪਹਿਰਨੇ ਕੋ ਬਸਤ੍ਰ ਦੀਆ ਹੈ, ਪੁਨਾ ਅਨੇਕ ਰਸ ਭੋਗਨੇ ਕੋ ਦੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਮੈਨੂੰ ਅੰਨ ਖਾਣ ਨੂੰ ਦਿੱਤਾ ਹੈ, ਕੱਪੜਾ ਪਹਿਨਣ ਨੂੰ ਦਿੱਤਾ ਹੈ, ਹੋਰ ਅਨੇਕਾਂ ਸੁਆਦਲੇ ਪਦਾਰਥ ਭੋਗਣ ਨੂੰ ਦਿੱਤੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਿ = ਅਨਿਕ, ਅਨੇਕਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "me diste alimento, vestido y muchos goces en la vida."