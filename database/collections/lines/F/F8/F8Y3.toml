[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਹਾ ਬਾਗ ਤਿਨ ਕੋ ਹੁਤੋ; ਤਹਾ ਪਹੂੰਚੀ ਆਇ ॥"
page = 972

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She reached there where they (the devils) had their garden."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਉਨ੍ਹਾਂ (ਦੈਂਤਾਂ) ਦਾ ਬਾਗ਼ ਸੀ, ਉਥੇ ਆਣ ਪਹੁੰਚੀ।"