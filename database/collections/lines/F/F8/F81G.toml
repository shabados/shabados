[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਚਲ੍ਰਯੋ ਪਗ ਦ੍ਵੈਕੁ ਫਿਰਿਯੋ ਪੁਨਿ ਜਿਯੋ ॥"
page = 167

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "As soon as the horse of Hiranayakashipu turned a little, he himself deviated and retraced two steps"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹਿਰਨਕਸ਼ਪ) ਵਿਚਲਿਤ ਹੋ ਕੇ ਦੋ ਹੀ ਕਦਮ ਹਟਿਆ ਸੀ ਕਿ ਫਿਰ ਮੁੜਿਆ, ਜਿਵੇਂ-"