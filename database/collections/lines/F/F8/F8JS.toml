[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਤੇ ਉਠੋ ਤਜਿ ਮਾਨ ਸਭੈ; ਚਲਿ ਖੇਲਹਿਾਂ ਪੈ ਜਮੁਨਾ ਤਟਿ ਕੇਰੇ ॥"
page = 368

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Therefore, forsaking your pride, go with me for playing on the bank of Yamuna"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਕਰਕੇ ਉਠ, ਸਾਰੇ ਰੋਸੇ ਨੂੰ ਛਡ ਦੇ ਅਤੇ ਚਲ ਜਮਨਾ ਦੇ ਕੰਢੇ ਉਤੇ ਖੇਡੀਏ।"