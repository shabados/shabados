language = "pa"
data = "ਕਿ ਉਹਨਾਂ ਵਿਚ ਸੈਂਕੜੇ ਆਬਿ#ਹੱਯਾਤ ਸਮਾ ਜਾਂਦੇ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਕਿ ਸਦ ਆਬਿ ਹੈਵਾਂ ਦਰਾਂ ਆਮਦਾ ॥੧੪੬॥"

[[content]]
assets = ["KEGP"]
