[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਿਰਿਯੋ ਰੇਤਿ ਮੁਨਿ ਕੇ ਜਬੈ; ਰੰਭਾ ਰਹਿਯੋ ਅਧਾਨ ॥"
page = 950

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Munni’s semen fell on the ground, then Rumba managed to seize it."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਮੁਨੀ ਦਾ ਵੀਰਜ ਡਿਗਿਆ ਤਾਂ ਰੰਭਾ ਨੂੰ ਗਰਭ ਹੋ ਗਿਆ।"