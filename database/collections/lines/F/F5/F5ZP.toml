[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤੁ ਮਿਲੈ; ਕਿਛੁ ਸੁਨੀਐ ਕਹੀਐ ॥"
page = 870
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting with a pious person, have thou some conversation with him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤਰ ਪੁਰਸ਼ ਨਾਲ ਮਿਲ ਕੇ, ਤੂੰ ਉਸ ਨਾਲ ਕੁਝ ਗੱਲਬਾਤ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When you meet a Saint, talk to him and listen."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੇ ਸੰਤ ਮਿਲ ਜਾਏ ਤੋ ਕੁਛ ਉਸ ਸੇ ਸੁਣੀਏ। ਜੇ ਕਹੇ ਤੁਮ ਕੁਛ ਸੁਣਾਵੋ ਤੌ ਉਸ ਕੇ ਪਾਸ ਰਾਮ ਨਾਮ ਸਾਥ ਮਿਲੀ ਹੂਈ ਬਾਣੀ ਕਹੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋਈ ਭਲਾ ਮਨੁੱਖ ਮਿਲ ਪਏ ਤਾਂ (ਉਸ ਦੀ ਸਿੱਖਿਆ) ਸੁਣਨੀ ਚਾਹੀਦੀ ਹੈ, ਤੇ (ਜੀਵਨ ਦੇ ਰਾਹ ਦੀਆਂ ਗੁੰਝਲਾਂ) ਪੁੱਛਣੀਆਂ ਚਾਹੀਦੀਆਂ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Al encontrar a un Santo, platica con él y escucha,"