[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਵਤ ਪਾਵਹੁ ਮੋਖ ਦੁਆਰ ॥"
page = 343
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thus shalt thou, in life, obtain the gate of salvation,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਜੀਉਂਦੇ ਜੀ ਤੂੰ ਮੁਕਤੀ ਦਾ ਦਰਵਾਜ਼ਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You shall attain the Gate of Liberation while yet alive."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਰੀਤੀ ਸੇ (ਜੀਵਤ) ਪ੍ਰਾਣੋਂ ਕੇ ਹੋਤੇ ਹੀ (ਮੋਖ ਦੁਆਰ) ਗ੍ਯਾਨੁ ਪਾਵੋਗੇ॥☬ਪ੍ਰਸ਼ਨ: ਗ੍ਯਾਨ ਕਿਸ ਕਾ ਹੋਤਾ ਹੈ?☬ਉੱਤ੍ਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੁਸੀ ਇਹਨਾਂ ਥਿੱਤਾਂ ਨਾਲ ਜੋੜੇ ਹੋਏ ਕਰਮ-ਧਰਮ ਕਰ ਕੇ ਮਰਨ ਪਿਛੋਂ ਕਿਸੇ ਮੁਕਤੀ ਦੀ ਆਸ ਰੱਖਦੇ ਹੋ, ਪਰ ਜੇ ਪਰਮਾਤਮਾ ਦਾ ਸਿਮਰਨ ਕਰੋਗੇ, ਤਾਂ) ਇਸੇ ਜਨਮ ਵਿਚ (ਵਿਕਾਰਾਂ ਦੁੱਖਾਂ ਅਤੇ ਭਰਮਾਂ-ਵਹਿਮਾਂ ਤੋਂ) ਖ਼ਲਾਸੀ ਹਾਸਲ ਕਰ ਲਵੋਗੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਖ = ਮੁਕਤੀ, ਭਰਮਾਂ ਤੋਂ ਖ਼ਲਾਸੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así obtendrás la iluminación en vida."