data = "ਬਰਤੀ ਬਰਤ; ਰਹੈ ਨਿਹਕਾਮ ॥"
page = 840
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone is the faster who observes the fasting of rendering selfless service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਵਰਤ ਵਾਲਾ ਹੈ, ਜੋ ਸਵਾਰਥ ਰਹਿਤ ਸੇਵਾ ਕਰਨ ਦਾ ਵਰਤ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Observe the fast of remaining free of desire."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਤੀ ਪੁਰਸ ਨਿਸਕਾਮਤਾ ਰੂਪੀ ਬ੍ਰਹਮ ਮੇਂ ਸਦਾ ਰਹਣਾ ਕਰੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਮਨੁੱਖ ਵਾਸਨਾ-ਰਹਿਤ ਜੀਵਨ ਜੀਊਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਰਤੀ ਬਰਤ = ਵਰਤਾਂ ਵਿਚੋਂ ਸ੍ਰੇਸ਼ਟ ਵਰਤ। ਨਿਹਕਾਮੁ = ਵਾਸਨਾ ਤੋਂ ਰਹਿਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aquél cuyo ayuno es el no desear nada,"