[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਫੂਲੇ ਪੁਹਪ ਬਸੰਤ ਜਾਨੁ ਬਨ ॥"
page = 216

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sons of king Dasrath playing in the forests appeared like the flowers bloomed in spring season."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਬਣ ਵਿੱਚ ਬਸੰਤ ਰੁਤ ਦੇ ਫੁੱਲ ਖਿੜੇ ਹੋਣ।"