[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਸੁ ਜਪਤ; ਰਿਦੈ ਅੰਮ੍ਰਿਤੁ ਸੰਚਾ ॥"
page = 236
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By remembering whom Nectar is amassed in the heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ, ਹਰੀ-ਰਸ ਦਿਲ ਵਿੱਚ ਇਕੰਤ੍ਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating on Him, Ambrosial Nectar is collected in the heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਿਸ ਕੇ ਜਪਣੇ ਸੇ ਰਿਦੇ ਮੇਂ ਅੰਮ੍ਰਿਤ ਰੂਪ ਆਤਮਾਨੰਦ (ਸੰਚਾ) ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਨਾਮ ਜਪਿਆਂ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ ਹਿਰਦੇ ਵਿਚ ਇਕੱਠਾ ਕਰ ਸਕੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਚਾ = ਇਕੱਠਾ ਕਰ ਲਈਦਾ ਹੈ। ਅੰਮ੍ਰਿਤੁ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y recolectamos el Néctar en el corazón."