[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜਲੈ ਪਤੰਗੁ ਨਿਸੰਗੁ ਹੋਇ, ਕਰਿ ਅਖਿ ਉਘਾੜੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Moth fearlessly burns itself on the flame but goes on beholding in the face of the flame up to last."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਤੰਗ ਨਿਸੰਗ ਹੋਕੇ (ਦੀਵੇ ਪੁਰ ਜਲ ਜਾਂਦਾ ਹੈ, (ਫੇਰ ਬੀ) ਅੱਖਾਂ ਉਘਾੜਕੇ (ਸਾਹਮਣੇ ਹੀ ਜਾਂਦਾ) ਹੈ (ਡਰਦਾ ਨਹੀਂ)।"