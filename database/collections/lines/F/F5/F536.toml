[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੋ ਭਜਨ ਏਕੰਕਾਰ ॥੧੭॥"
page = 612

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He who creates this and the next word and merges them within himself, if you want the salvation of your body, then worship only that One Lord.17."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਇਕ ਪਰਮਸੱਤਾ ਦਾ ਭਜਨ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ ॥੧੭॥"