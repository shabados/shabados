[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵਤ ਜਾਤ; ਨ ਲਾਗੈ ਬਾਰਾ ॥"
page = 1189
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In coming and going it makes not any delay."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਉਣ ਤੇ ਜਾਣ ਵਿੱਚ ਇਸ ਨੂੰ ਕੋਈ ਦੇਰੀ ਨਹੀਂ ਲਗਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It is caught in non-stop coming and going."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਆਵਤ ਜਾਤ) ਜਨਮਤੇ ਮਰਤੇ ਵਾ ਸੰਕਲਪ ਵਿਕਲਪ ਕਰਤੇ ਕੋ ਡੇਰੀ ਨਹੀਂ ਲਾਗਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹਰ ਵੇਲੇ) ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ, ਰਤਾ ਭੀ ਚਿਰ ਨਹੀਂ ਲੱਗਦਾ (ਭਾਵ, ਰਤਾ ਭਰ ਭੀ ਟਿਕਦਾ ਨਹੀਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਵਤ ਜਾਤ = ਆਉਂਦੇ ਜਾਂਦੇ ਨੂੰ, ਭਟਕਦੇ ਨੂੰ। ਬਾਰਾ = ਦੇਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y de manera incesante me muevo entre la vida y la muerte."