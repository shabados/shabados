[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਵਰ ਜਤਨਿ; ਨਹੀ ਪਾਈਐ ॥"
page = 211
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By another effort the Lord is not obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੋਰਸੁ ਉਪਰਾਲੇ ਦੁਆਰਾ ਸਾਹਿਬ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is not obtained by any other efforts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਤਨੋਂ ਕਰ ਨਹੀਂ ਪਾਇਆ ਜਾਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਿਮਰਨ ਤੋਂ ਬਿਨਾ ਕਿਸੇ ਭੀ) ਹੋਰ ਜਤਨ ਨਾਲ ਪਰਮਾਤਮਾ ਨਹੀਂ ਮਿਲਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਤਨਿ = ਜਤਨ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No podemos obtener el Nombre de otra forma"