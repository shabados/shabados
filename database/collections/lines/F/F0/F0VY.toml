[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਰਗ ਮਹਲਾ ੪ ਘਰੁ ੩ ਦੁਪਦਾ ॥"
page = 1200
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sarang 4th Guru. Dupada."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੰਗ ਚੋਥੀ ਪਾਤਿਸ਼ਾਹੀ। ਦੁਪਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Saarang, Fourth Mehl, Third House, Dho-Padhay:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਸਾਰੰਗ, ਘਰ ੩ ਵਿੱਚ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਦੀ ਦੋ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sarang, Mejl Guru Ram Das, Cuarto Canal Divino, Du-Padas."