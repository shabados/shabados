type = "primary"
data = "ਰਾਝਾ ਅਪਨੋ ਨਾਮ ਸਦਾਵੈ ॥"
page = 937

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He used to come back in the evening after grazing the cattle and became known as Ranjah."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣਾ ਨਾਂ ਰਾਂਝਾ ਅਖਵਾਉਂਦਾ ਸੀ।"