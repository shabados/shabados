[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚਾ ਸਾਹਿਬੁ; ਅਮਰੁ ਅਤੋਲੁ ॥"
page = 905
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Imperishable and Immeasurable is the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਬਿਨਾਸੀ ਅਤੇ ਅਮਾਪ ਹੈ ਸੱਚਾ ਸੁਆਮੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Lord Master is immortal and immeasurable."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਵਹੁ ਸਾਚਾ ਸਾਹਿਬ ਜੋ ਅਮਰ ਹੈ, ਇਸੀ ਤੇ ਉਸ ਕਾ ਨਾਮ ਭੀ (ਅਤੋਲੁ) ਬੇਅੰਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਮਾਲਕ ਹੈ ਉਹ ਕਦੇ ਮਰਨ ਵਾਲਾ ਨਹੀਂ ਹੈ, ਉਸ ਦੇ ਵਡੱਪਣ ਨੂੰ ਤੋਲਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਮਰੁ = ਅਟੱਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, Verdad, Verdad es nuestro Señor, Eterno y Sin Igual."