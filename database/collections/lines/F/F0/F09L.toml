[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਗਟੁ ਭਇਆ; ਜਨ ਕਾ ਪਰਤਾਪੁ ॥੧॥"
page = 396
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The glory of His servant has become manifest."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਸੇਵਕ ਦੀ ਨਾਮਵਰੀ ਊਜਾਗਰ ਹੋ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The glory of His servant has become manifest. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੁਝ ਦਾਸ ਕਾ ਪ੍ਰਤਾਪ ਸੰਸਾਰ ਭਰ ਮੇਂ ਪ੍ਰਗਟ ਹੂਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਸੋਭਾ-ਵਡਿਆਈ (ਸਾਰੇ ਜਗਤ ਵਿਚ) ਉੱਘੜ ਪੈਂਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨ = ਸੇਵਕ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y el poder de su Sirviente se ha vuelto manifiesto en el mundo. (1)"