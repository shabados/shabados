[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਬਦ ਸੁਰਤਿ ਬਿਨੁ; ਆਈਐ ਜਾਈਐ ॥"
page = 1042
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Name's knowledge, man continues coming and going."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੀ ਗਿਆਤ ਦੇ ਬਾਝੋਂ ਇਨਸਾਨ ਆਉਂਦਾ (ਜੰਮਦਾ) ਤੇ ਜਾਂਦਾ (ਮਰਦਾ) ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without awareness of the Shabad, they come and go in reincarnation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਪਦੇਸ ਕੀ ਪ੍ਰੀਤੀ ਬਿਨਾਂ ਜਗਤ ਮੇਂ ਆਵੀ ਜਾਵੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸ਼ਬਦ ਦੀ ਲਗਨ ਤੋਂ ਬਿਨਾ (ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਫਸ ਕੇ) ਉਹ ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਵਿਚ ਪਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਰਤਿ = ਲਗਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, el Gurmukj obtiene el soporte de la Liberación"