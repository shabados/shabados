[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਪਦੇਸੁ ਸੁਣਹੁ ਤੁਮ ਗੁਰਸਿਖਹੁ; ਸਚਾ ਇਹੈ ਸੁਆਉ ॥"
page = 963
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Guru's disciples! hearken ye the Guru's counsel. This alone is your life's true aim."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਰੂ ਦੇ ਸਿੱਖੋ! ਤੁਸੀਂ ਗੁਰਾਂ ਦੀ ਸਿਫ਼ਤ ਸ੍ਰਵਣ ਕਰੋ। ਕੇਵਲ ਇਹ ਹੀ ਤੁਹਾਡੀ ਜ਼ਿੰਦਗੀ ਦਾ ਸੱਚਾ ਮਨੋਰਥ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen to these Teachings, O Sikhs of the Guru. This is the true purpose of life."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਰੂ ਕੇ ਸਿਖੋ! ਤੁਮ ਇਹੁ ਉਪਦੇਸ਼ ਸੁਣੋ: ਸਚਾ ਏਹੋ ਸੁਆਦ ਵਾ ਪ੍ਰਜੋਜਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਰ-ਸਿੱਖੋ! (ਸਿਫ਼ਤ-ਸਾਲਾਹ ਵਾਲਾ ਇਹ) ਉਪਦੇਸ਼ ਸੁਣੋ, ਜ਼ਿੰਦਗੀ ਦਾ ਅਸਲ ਮਨੋਰਥ ਇਹੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਆਉ = ਸੁਆਰਥ, ਮਨੋਰਥ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Sikjs del Guru, escuchen esta Instrucción, pues es el objeto de su vida."