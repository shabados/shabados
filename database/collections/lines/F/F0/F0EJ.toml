[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਖਸਿ ਲੀਏ; ਨਾਹੀ ਜਮ ਕਾਣੇ ॥੫॥"
page = 1190
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Them the Lord forgives and for them the fear of Death's courier is no more."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਨੂੰ ਸੁਆਮੀ ਮਾਫ ਕਰ ਦਿੰਦਾ ਹੈ ਅਤੇ ਉਨ੍ਹਾਂ ਨਹੀਂ ਮੌਤ ਦੇ ਦੂਤਾਂ ਦਾ ਡਰ ਨਹੀਂ ਰਹਿੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord forgives them, and they no longer fear the Messenger of Death. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸ੍ਵਰ ਨੇ ਵਹੁ ਬਖਸ ਲੀਏ ਹੈਂ, ਇਸ ਵਾਸਤੇ ਤਿਨ ਕੋ ਜਮ ਕੀ ਕਾਣ ਨਹੀਂ ਹੋਤੀ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਨੂੰ ਜਮਾਂ ਦੀ ਮੁਥਾਜੀ ਨਹੀਂ ਰਹਿ ਜਾਂਦੀ ਕਿਉਂਕਿ ਪ੍ਰਭੂ ਨੇ ਉਹਨਾਂ ਉਤੇ ਮੇਹਰ ਕਰ ਦਿੱਤੀ ਹੁੰਦੀ ਹੈ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਣੇ = ਮੁਥਾਜੀ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él los perdona y el miedo a la muerte desaparece. (5)"