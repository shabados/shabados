[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੁਹੀ ਕਟਾਰੀ ਸੈਹਥੀ; ਕਰੀਐ ਰਛ ਹਮਾਰਿ ॥੧੨॥"
page = 717

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art the kataari, and Saihathi  Protect me.12."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਕਟਾਰ, ਸੈਹਥੀ ਹੈਂ, (ਤੁਸੀਂ) ਮੇਰੀ ਰਖਿਆ ਕਰੋ ॥੧੨॥"