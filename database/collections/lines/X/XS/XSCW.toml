[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਦਿ ਜੁਗਾਦਿ ਅਨੀਲ ਅਨਾਹਦ; ਲੋਕ ਅਲੋਕ ਬਿਲੋਕ ਨ ਪਾਯੋ ॥"
page = 712

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art primal, from the beginning of the ages and limitless, who can be realized with profound insight in these worlds"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜੋ) ਆਦਿ, ਜੁਗਾਦਿ, ਅਨੀਲ, ਅਨਾਹਦ (ਅਪਾਰ) ਹੈ, (ਉਸ ਨੂੰ) ਲੋਕ ਅਤੇ ਪਰਲੋਕ ਵਿਚ ਕੋਈ ਵੇਖ ਨਹੀਂ ਸਕਿਆ ਹੈ।"