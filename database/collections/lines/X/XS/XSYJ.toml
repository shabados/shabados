[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮਿ ਤੇਰੈ; ਰਹੈ ਮਨੁ ਰਾਤਾ ॥"
page = 180
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "May my soul remain imbued with Thy Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਆਤਮਾ ਤੇਰੇ ਨਾਮ ਨਾਲ ਰੰਗੀਜੀ ਰਹੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind remains attuned to Your Name;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਹੇ ਨਾਮੀ! ਤੇਰੇ ਮੇਂ ਮਨ ਰਤਾ ਰਹੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਜਿਸ ਮਨੁੱਖ ਦਾ) ਮਨ ਤੇਰੇ ਨਾਮ ਵਿਚ ਰੰਗਿਆ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਮਿ = ਨਾਮ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Para Nanak, éste es el más elevado"