[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਬਿਹਾਵੈ; ਹਰਿ ਰਸੁ ਪੀਵਤ ॥੭॥"
page = 914
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saint passes his life quaffing the Lord's elixir."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਆਪਣਾ ਜੀਵਨ ਸੁਆਮੀ ਦਾ ਅੰਮ੍ਰਿਤ ਪਾਨ ਕਰਨ ਵਿੱਚ ਗੁਜ਼ਾਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Saints pass their lives drinking in the sublime essence of the Lord. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੀ ਅਵਸਥਾ ਹਰੀ ਰਸ ਕੋ ਪਾਨ ਕਰਤਿਆਂ ਹੀ ਬੀਤਤੀ ਹੈ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਦੀ ਉਮਰ ਬੀਤਦੀ ਹੈ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਅੰ​‍ਮ੍ਰਿਤ ਪੀਂਦਿਆਂ ॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੀਵਤ = ਪੀਂਦਿਆਂ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero los Santos pasan su vida embebidos en la Esencia de Dios. (7)"