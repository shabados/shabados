[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਨੀ ਚੀਤਿ; ਨ ਰਾਖਸਿ ਤੇਤੇ ॥੧॥"
page = 478
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "so many his mother bears not in her mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਓਨੇ ਉਸ ਦੀ ਮਾਤਾ ਆਪਣੇ ਚਿੱਤ ਵਿੱਚ ਨਹੀਂ ਰੱਖਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "his mother does not hold them against him in her mind. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਤਨੇ ਹੀ ਮਾਤਾ ਚਿਤ ਮੇਂ ਨਹੀਂ ਰਾਖਤੀ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਮਾਂ ਉਹ ਸਾਰੀਆਂ ਦੀਆਂ ਸਾਰੀਆਂ ਭੁਲਾ ਦੇਂਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨਨੀ = ਮਾਂ। ਚੀਤਿ = ਚਿੱਤ ਵਿਚ। ਤੇਤੇ = ਉਹ ਸਾਰੇ ਹੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero a la madre no le importa. (1)"