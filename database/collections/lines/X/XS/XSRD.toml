[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੈ ਸਿਮਰਨਿ; ਭਉ ਨ ਬਿਆਪੈ ॥"
page = 262
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Lord's meditation fear overtake not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੀ ਬੰਦਗੀ ਦੁਆਰਾ ਡਰ ਨਹੀਂ ਲਗਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remembering God, one is not touched by fear."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕੇ ਸਿਮਰਨੇ ਸੇ ਪੁਨਾ ਕੋਈ ਭੈ ਨਹੀਂ ਵਿਆਪਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦਾ ਸਿਮਰਨ ਕਰਨ ਨਾਲ (ਕੋਈ) ਡਰ (ਜੀਵ ਉਤੇ) ਦਬਾਉ ਨਹੀਂ ਪਾ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਉ = ਡਰ। ਬਿਆਪੈ = ਜ਼ੋਰ ਪਾਉਂਦਾ ਹੈ, ਗ਼ਲਬਾ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Meditando en el Señor, uno se libera de sus miedos."