[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਝ ਤੇ ਬਾਹਰਿ; ਕੋਈ ਨਾਹਿ ॥੧॥"
page = 1134
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is naught that is without Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਭੀ ਐਸਾ ਨਹੀਂ ਜੋ ਤੇਰੇ ਬਗੈਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is nothing at all except You. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਹੁਕਮ ਸੇ ਬਾਹਰ ਕੋਈ ਭੀ ਨਹੀਂ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਭੀ ਸਰੀਰ ਤੇਰੀ ਜੋਤਿ ਤੋਂ ਬਿਨਾ ਨਹੀਂ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, no existe nada en donde no estés Tú. (1)"