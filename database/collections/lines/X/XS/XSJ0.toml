[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰੇ ਸਤਿਗੁਰ ਮਿਲਿ; ਨਿਸਤਾਰੇ ॥੧॥"
page = 193
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and am emancipated by meeting the perfect True Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪੂਰਨ ਸੱਚੇ ਗੁਰਾਂ ਨੂੰ ਭੇਟ ਕੇ ਮੈਂ ਪਾਰ ਉਤਰ ਗਿਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting the Perfect True Guru, I am emancipated. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਸਤਿਗੁਰੋਂ ਕੇ ਸਾਥ ਮਿਲਨੇ ਕਰ ਗੁਰਾਂ ਨੇ ਉਧਾਰੇ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਸਤਿਗੁਰੂ ਨੂੰ ਮਿਲ ਕੇ ਉਹ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘ ਜਾਂਦੇ ਹਨ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰ ਮਿਲਿ = ਗੁਰੂ ਨੂੰ ਮਿਲ ਕੇ। ਨਿਸਤਾਰੇ = (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘ ਗਏ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y encontrando al Perfecto y Verdadero Guru, he sido liberado.(1)"