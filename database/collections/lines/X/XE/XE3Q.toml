data = "ਸਾਚੇ ਗੁਰ ਕੀ; ਸਾਚੀ ਸੀਖ ॥"
page = 152
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is the instruction of the True Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੀ ਹੈ ਸਿਖਿਆ ਸੱਚੇ ਗੁਰਾਂ ਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True are the Teachings of the True Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਸਚੇ ਗੁਰੋਂ ਕੀ ਸਚੀ ਸਿਖਿਆ ਲਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਨੂੰ ਸੱਚੇ ਸਤਿਗੁਰੂ ਦੀ ਸੱਚੀ ਸਿੱਖਿਆ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ,"

