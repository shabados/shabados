[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਨ ਪੁਨੀਤ ਪਵਿਤ੍ਰ; ਚਾਲਹਿ ਪ੍ਰਭ ਪਥਾ ॥"
page = 709
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Pure and holy, are the feet, which walk on the Lord's path."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਵਨ ਅਤੇ ਪਾਕ ਹਨ ਉਹ ਪੈਰ, ਜਿਹੜੇ ਪ੍ਰਭੂ ਦੇ ਮਾਰਗਾਂ ਉਤੇ ਤੁਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those feet which walk on God's Path are pure and holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਚਰਣ ਪਵਿਤ੍ਰ ਹੈਂ, ਜੋ ਪ੍ਰਭੂ ਕੇ ਪਵਿਤ੍ਰ ਮਾਰਗ ਮੇਂ ਚਲਤੇ ਹੈਂ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੈਰ ਪਵਿੱਤ੍ਰ ਹਨ ਜੋ ਪ੍ਰਭੂ ਦੇ ਰਾਹ ਤੇ ਤੁਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੁਨੀਤ = ਪਵਿਤ੍ਰ। ਪਥਾ = ਰਾਹ (ਸੰ: ਪਥਿਨ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Benditos, benditos son los Pies piadosos que caminan en el Sendero de los Santos;"