[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਤੇ ਭਿੰਨ; ਨਹੀ ਕੋ ਠਾਉ ॥"
page = 294
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is no place without Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਬਗੈਰ ਕੋਈ ਜਗ੍ਹਾਂ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without Him, there is no place at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਤੇ ਭਿੰਨ ਕੋਈ ਅਸਥਾਨ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ (ਭੀ) ਥਾਂ ਉਸ ਪ੍ਰਭੂ ਤੋਂ ਵੱਖਰਾ ਨਹੀਂ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਿੰਨ = ਵੱਖਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No existe lugar alguno que no sea alcanzado por el Naam, el Nombre del Señor,"