[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੁੰਡ ਮਹਾ ਰਨ ਮਧਿ ਹਨਿਓ; ਫਿਰ ਕੈ ਬਰ ਚੰਡਿ ਤਬੈ ਇਹ ਕੀਨੋ ॥"
page = 86

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Killing Mund in the battlefield, the dagger of Chandi then did this,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੁੰਡ ਨੂੰ ਰਣ ਵਿਚ ਮਾਰ ਕੇ ਪ੍ਰਚੰਡ ਚੰਡੀ ਨੇ ਤਦ ਇਹ ਕੀਤਾ"