[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਖ ਸੂਖ; ਪ੍ਰਭ ਦੇਵਨਹਾਰੁ ॥"
page = 283
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lord is the Dispenser of woe and weal."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਗ਼ਮੀ ਤੇ ਖੁਸ਼ੀ ਦੇਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is the Giver of pain and pleasure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਰਮੋਂ ਅਨੁਸਾਰ ਦੁਖ ਸੁਖ ਪ੍ਰਭੂ ਆਪ ਹੀ ਦੇਨੇ ਹਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦੁੱਖ ਸੁਖ ਦੇਣ ਵਾਲਾ ਪ੍ਰਭੂ ਆਪ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "recuerda que el Señor es Quien te da el placer o el dolor;"