data = "ਬ੍ਰਹਮ ਕਵਚ ਕੋ ਜਾਪ ਉਚਾਰਾ ॥"
page = 117

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All of them extremely eulogized the goddess and repeated the mantra known as “Brahm-Kavach”."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "'ਬ੍ਰਹਮ-ਕਵਚ' ਜਾਪ ਨੂੰ ਪੜ੍ਹਿਆ।"