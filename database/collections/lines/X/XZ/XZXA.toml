type = "primary"
data = "ਭਗਤ ਜਨਾ ਦਾ, ਕਰੇ ਕਰਾਇਆ ॥੧੧॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The Lord accomplishes whatever is done and desired by saints."

