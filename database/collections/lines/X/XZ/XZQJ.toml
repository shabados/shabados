[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗੰਗ ਜਟਨ ਮੈ ਧਾਰਿ; ਗੰਗਧਰ ਨਾਮ ਸੁਹਾਯੋ ॥"
page = 996

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then, with tresses imbued in colours, he earned the admirations as god Gandharabh."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਗੰਗਾ ਨੂੰ ਜਟਾਵਾਂ ਵਿਚ ਧਾਰਨ ਕਰ ਕੇ 'ਗੰਗਧਰ' ਨਾਮ ਨਾਲ ਸੁਸ਼ੋਭਿਤ ਹੋਇਆ।"