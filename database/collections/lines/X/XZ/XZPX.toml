[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇਜ ਸੁਹਾਵੀ ਰਸਿ ਬਨੀ ॥"
page = 1184
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Lord's love my couch has been rendered beauteous,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੀ ਪ੍ਰੀਤ ਰਾਹੀਂ ਮੇਰੀ ਸੇਜ ਸੁੰਦਰ ਬਣ ਗਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My bed has been beautified by His Love."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਿਰਦਾ ਰੂਪ ਸੇਜਾ ਹਮਾਰੀ (ਰਸਿ) ਪ੍ਰੇਮ ਕਰ ਕੇ ਸੁਹਾਵੀ ਬਨੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ-ਮਿਲਾਪ ਦੇ) ਸੁਆਦ ਨਾਲ ਉਹਨਾਂ ਦੀ ਹਿਰਦਾ-ਸੇਜ ਸੋਹਣੀ ਬਣ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਜ = ਹਿਰਦਾ-ਸੇਜ। ਸੁਹਾਵੀ = ਸੋਹਣੀ। ਰਸਿ = (ਮਿਲਾਪ ਦੇ) ਸੁਆਦ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El aposento del corazón toma vida"