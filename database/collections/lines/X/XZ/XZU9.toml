[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮੁ ਆਇਆ ਮਨਿ ਚੀਤਿ ॥"
page = 1149
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who within his mind remembers the Transcendent Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਪਣੇ ਹਿਰਤੇ ਅੰਦਰ ਪਰਮ ਪ੍ਰਭੂ ਨੂੰ ਚੇਤੇ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "of those who remember the Supreme Lord God in their minds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸਾ ਪਾਰਬ੍ਰਹਮ ਹਮਾਰੇ ਮਨ ਮੇਂ ਯਾਦ ਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਮਨ ਵਿਚ ਚਿੱਤ ਵਿਚ ਪਰਮਾਤਮਾ ਆ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਚੀਤਿ = ਚਿੱਤ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si uno enaltece a Dios en la mente."