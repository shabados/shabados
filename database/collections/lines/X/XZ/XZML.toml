[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤ੍ਰਿਸਨਾ ਬੂਝੈ; ਮਨੁ ਤ੍ਰਿਪਤਾਵਹੁ ॥੧॥ ਰਹਾਉ ॥"
page = 179
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by which desires may be quenched and the soul be satiated. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੁਆਰਾ ਖਾਹਿਸ਼ ਮਿਟ ਜਾਵੇ ਅਤੇ ਆਤਮਾ ਰੱਜ ਜਾਵੇ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "which will quench my thirst and satisfy my mind. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਪਾਇ ਕਰ ਤ੍ਰਿਸਨਾ ਨਵਿਰਤ ਹੋਵੇ ਔਰ ਮਨ ਕੋ ਤ੍ਰਿਪਤੀ ਹੋਵੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! ਮੇਰੇ ਮਨ ਨੂੰ ਸੰਤੋਖੀ ਬਣਾ ਦਿਓ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤ੍ਰਿਪਤਾਵਹੁ = ਤ੍ਰਿਪਤ ਕਰੋ, ਸੰਤੋਖੀ ਬਣਾਓ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que pueda calmar mi mente y saciar mi deseo!  (1-Pausa)"