[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੀਓ ਸਗਲ ਭਵਨ ਤੇ ਊਪਰਿ; ਹਰਿ ਸੋਭਾ ਹਰਿ ਪ੍ਰਭ ਦਿਨਛੇ ॥੨॥"
page = 1178
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Him the God raises above the whole world, and the Lord God blessed him with the Divine glory."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਵਾਹਿਗੁਰੂ ਸਾਰੇ ਜਹਾਨ ਤੋਂ ਉਚਾ ਕਰ ਦਿੰਦਾ ਹੈ ਅਤੇ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਉਸ ਨੂੰ ਈਸ਼ਵਰੀ ਪ੍ਰਭਤਾ ਪ੍ਰਦਾਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord exalts and elevates him above the whole world, and the Lord God blesses him with the Lord's Glory. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ ਹਰਿ ਪ੍ਰਭੂ! ਜਿਸ ਕੋ ਤੁਮ ਨੇ ਸੋਭਾ (ਦਿਨਛੇ) ਦਿਤੀ ਹੈ ਤਿਸ ਜਨ ਕੋ ਸਗਲ ਭਵਨੋਂ ਤੇ ਊਚਾ ਕੀਆ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਤੂੰ ਉਸ ਨੂੰ ਸਾਰੇ ਜਗਤ ਦੇ ਜੀਵਾਂ ਤੋਂ ਉੱਚਾ ਕਰ ਦਿੱਤਾ। ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਉਸ ਨੂੰ (ਲੋਕ ਪਰਲੋਕ ਦੀ) ਵਡਿਆਈ ਬਖ਼ਸ਼ ਦਿੱਤੀ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ। ਸਗਲ ਭਵਨ ਤੇ = ਸਾਰੇ ਭਵਨਾਂ ਤੋਂ। ਊਪਰਿ = ਉੱਚਾ। ਦਿਨਛੇ = ਦਿੱਤੀ। ਸੋਭਾ = ਵਡਿਆਈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a él lo has elevado por encima de todo el mundo y los has bendecido con Tu Gloria. (2)"