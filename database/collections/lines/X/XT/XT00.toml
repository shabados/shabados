[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਉ ਕਰਿ ਕਰਉ ਬੇਨੰਤੀ; ਹਉ ਆਖਿ. ਨ ਜਾਣਾ ॥"
page = 567
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How should I make supplication? I know not what to say."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕਿਸ ਤਰ੍ਹਾਂ ਪ੍ਰਾਰਥਨਾ ਕਰਾਂ? ਮੈਨੂੰ ਨਹੀਂ ਪਤਾ ਮੈਂ ਕੀ ਕਰਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How should I make and offer my prayer? I do not know what to say."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕਿਸ ਪ੍ਰਕਾਰ ਬੇਨਤੀ ਕਰੂੰ ਮੈਂ ਕਹਨੇ ਨਹੀਂ ਜਾਨਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ (ਤੇਰੇ ਦਰ ਤੇ) ਕਿਵੇਂ ਬੇਨਤੀ ਕਰਾਂ? ਮੈਨੂੰ ਤਾਂ ਬੇਨਤੀ ਕਰਨੀ ਭੀ ਨਹੀਂ ਆਉਂਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਉ ਕਰਿ = ਕਿਵੇਂ? ਕਰਉ = ਮੈਂ ਕਰਾਂ। ਹਉ = ਮੈਂ। ਆਖਿ ਨਾ ਜਾਣਾ = ਮੈਂ ਆਖਣੀ ਜਾਣਦਾ ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cómo Te puedo alabar, qué ofrenda dar?"