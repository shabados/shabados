[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਨ ਨ ਬੀਆ; ਤੇਰੀ ਸਮਸਰਿ ॥"
page = 371
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is no other second at par with Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੋਰ ਕੋਈ ਦੂਸਰਾ ਤੇਰੇ ਬਰਾਬਰ ਦਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no other, comparable to You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਤੇਰੇ ਸਮਾਨ ਦੂਸਰਾ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਤੇਰੇ ਬਰਾਬਰ ਦਾ ਦੂਜਾ ਕੋਈ ਹੈ ਹੀ ਨਹੀਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਨ = ਹੋਰ। ਬੀਆ = ਦੂਜਾ। ਸਮਸਰਿ = ਬਰਾਬਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No existe nadie que Te iguale."