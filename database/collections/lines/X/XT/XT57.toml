[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁ ਕ੍ਰਿਤ ਕਾਬਿ ਕ੍ਰਿਤ ਕੀ; ਕਬੀਸ ਔਰ ਦੇਹਗੇ ॥੨॥"
page = 614

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He unhesitatingly, composed in this way the, fine epic Ramayana, which none else will be able to do.2."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਕੀਤੇ ਹੋਏ ਕਾਵਿ ਦਾ ਯਸ਼ ਹੋਰ ਕਵੀ ਜਨ ਕਰਨਗੇ ॥੨॥"