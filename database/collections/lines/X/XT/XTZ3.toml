type = "primary"
data = "ਸਦਾ ਰਹੋ ਇਹ ਧਾਮ ਤਿਹਾਰੈ ॥"
page = 966

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘What good will be this sovereignty for me? This must remain with you."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਦਾ ਤੁਹਾਡੇ ਕੋਲ ਹੀ ਰਹੇ।"