[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਿਅ ਕੀ ਸੋਭ; ਸੁਹਾਵਨੀ ਨੀਕੀ ॥"
page = 1272
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Beauteous and sublime is the glory of my love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁੰਦਰ ਅਤੇ ਸਰੇਸ਼ਟ ਹੈ ਮੇਰੇ ਪ੍ਰੀਤਮ ਦੀ ਪ੍ਰਭਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The glory of my Beloved is noble and sublime."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਤੀ ਕੀ ਸੋਭਾ (ਨੀਕੀ) ਅਤੀ ਸੁੰਦਰ ਸੋਭਨੀਕ ਹੋ ਰਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਿਆਰੇ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ (ਹਿਰਦੇ ਨੂੰ) ਚੰਗੀ ਲੱਗਦੀ ਹੈ, ਸੁਖਦਾਈ ਲੱਗਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਭ = ਸੋਭਾ, ਸਿਫ਼ਤ-ਸਾਲਾਹ। ਸੁਹਾਵਨੀ = ਸੁਖਾਵੀਂ, ਸੁਖ ਦੇਣ ਵਾਲੀ। ਨੀਕੀ = ਚੰਗੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Gloria de mi Bienamado es Noble y Sublime."