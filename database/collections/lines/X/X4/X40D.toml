type = "primary"
data = "ਕਿ ਰਉਸ਼ਨ ਤਬੀਯਤ ਸਲੀਖ਼ਤ ਮੁਦਾਮ ॥੩੧॥"
page = 1401

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Who was gentle in nature and was an enlightened man.(31)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਸੁਭਾ ਉਜਲਾ ਸੀ ਅਤੇ ਜੋ ਸਦਾ ਹਸਮੁਖ ਰਹਿਣ ਵਾਲਾ ਸੀ ॥੩੧॥"