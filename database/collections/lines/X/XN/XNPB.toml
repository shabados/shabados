[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹਰੀ ਸਲਾਕ ਹਰੀ ਤ੍ਰਿਯਹਿ; ਸ੍ਵਰਨ ਤੋਲਿ ਭਰਿ ਲੀਨ ॥"
page = 896

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "This way a woman took away the pipe containing gold,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸੁਨਿਆਰੇ ਦੁਆਰਾ) ਹਰੀ ਹੋਈ ਸਲਾਖ਼ ਇਸਤਰੀ ਨੇ ਹਰ ਲਈ ਅਤੇ ਉਸ ਦੇ ਬਰਾਬਰ ਵਜ਼ਨ ਦਾ ਸੋਨਾ ਵੀ (ਸੁਨਿਆਰੇ ਤੋਂ) ਭਰ ਲਿਆ।"