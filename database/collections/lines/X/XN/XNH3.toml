[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੇ ਚਰਨ; ਬਸੇ ਮਨ ਮੇਰੈ ॥"
page = 1221
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru's feet abode within my mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਪੈਰ, ਮੇਰੇ ਹਿਰਦੇ ਅੰਦਰ ਨਿਵਾਸ ਰਖਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Feet of the Guru abide within my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਚਰਨ ਮੇਰੇ ਮਨ ਮੇਂ ਬਸੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਦੋਂ ਦੇ) ਗੁਰੂ ਦੇ ਚਰਨ ਮੇਰੇ ਮਨ ਵਿਚ ਵੱਸ ਪਏ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ ਮੇਰੈ = ਮਨਿ ਮੇਰੈ, ਮੇਰੇ ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Enaltezco los Pies del Guru en mi mente y veo al Señor llenándolo todo,"