[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਧੁ ਜੇਵਡੁ. ਮੈ ਹੋਰੁ ਕੋ ਦਿਸਿ, ਨ ਆਵਈ; ਤੂਹੈਂ ਸੁਘੜੁ. ਮੇਰੈ ਮਨਿ ਭਾਣਾ ॥"
page = 305
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I see none as great as Thee. Thou O wise Lord, art pleasing to my mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਤੇਰੇ ਜਿੱਡਾ ਵੱਡਾ ਕੋਈ ਨਜ਼ਰੀ ਨਹੀਂ ਪੈਦਾ ਤੂੰ ਹੈ ਸਿਆਣੇ ਸੁਆਮੀ ਮੇਰੇ ਚਿੱਤ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I can see no other as great as You; O Lord of Wisdom, You are pleasing to my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਕੋ ਤੇਰੇ ਜੈਸੇ ਵਡਾ ਔਰ ਕੋਈ ਦ੍ਰਿਸਟੀ ਨਹੀਂ ਆਵਤਾ ਹੈ, ਤੂੰ ਹੀ (ਸੁਘੜ) ਚਤ੍ਰ ਮੇਰੇ ਮਨ ਮੇਂ ਭਾਇਆ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਤੇਰੇ ਜੇਡਾ ਵੱਡਾ ਹੋਰ ਕੋਈ ਭੀ ਦਿਖਾਈ ਨਹੀਂ ਦੇਂਦਾ, ਤੂੰ ਹੀ ਸਿਆਣਾ ਮੇਰੇ ਮਨ ਵਿਚ ਪਿਆਰਾ ਲੱਗਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਘੜੁ = ਸੋਹਣੀ ਘਾੜਤ ਵਾਲਾ, ਸੁਚੱਜਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Yo no veo Tu igual; Te amo, porque eres Omnisapiente y lleno de Gracia."