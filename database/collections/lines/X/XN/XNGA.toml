[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਠਾਕੁਰ ਹੋਏ ਆਪਿ ਦਇਆਲ ॥"
page = 532
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself has become merciful."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਖੁਦ ਮਿਹਰਬਾਨ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord and Master Himself has become Merciful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਮੇਰੇ ਪਰ ਠਾਕੁਰ ਜੀ ਆਪ ਦਿਆਲ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਆਪਣੇ ਸੇਵਕ ਉੱਤੇ ਪ੍ਰਭੂ ਜੀ ਦਇਆਵਾਨ ਹੁੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਕੁਰ = ਮਾਲਕ-ਪ੍ਰਭੂ ਜੀ। ਦਇਆਲ = ਦਇਆਵਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Maestro tuvo Compasión de mí; ahora vivo en Éxtasis y en Bienaventuranza."