data = "ਭੇਦ ਅਭੇਦ ਕਛੁ ਹ੍ਰਿਦੈ ਨ ਜਾਨ︀ਯੋ ॥"
page = 900

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Everybody branded her as a liar without understanding the secret."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਇਸ ਭੇਦ ਨੂੰ ਹਿਰਦੇ ਵਿਚ ਜ਼ਰਾ ਜਿੰਨਾ ਵੀ ਨਹੀਂ ਸਮਝਿਆ।"