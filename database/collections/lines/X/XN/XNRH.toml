data = "ਦੁਹੂੰਅਨਿ ਹਨਤ ਕ੍ਰੋਧ ਉਪਜਾਈ ॥੬॥"
page = 191

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Immanent Lord then helped Vishnu and in great fury, he destroyed both the demons.6."

[[content]]
