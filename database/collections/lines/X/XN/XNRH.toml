language = "pa"
data = "ਅਤੇ ਕ੍ਰੋਧਵਾਨ ਹੋ ਕੇ ਦੋਹਾਂ ਨੂੰ ਮਾਰ ਦਿੰਦਾ ਹੈ ॥੬॥"