data = "ਨਿਰਖ ਰਾਇ ਤ੍ਰਿਯ ਕੋ ਰਮਤ; ਸਰ ਤਨਿ ਕਾਨ ਪ੍ਰਮਾਨ ॥"
page = 852

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Raja on seeing two in love flew in rage,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਜੇ ਨੇ ਇਸਤਰੀ ਨੂੰ ਰਮਣ ਕਰਦਿਆਂ ਵੇਖ ਕੇ ਬਾਣ ਨੂੰ ਕੰਨ ਤਕ ਖਿਚਿਆ"