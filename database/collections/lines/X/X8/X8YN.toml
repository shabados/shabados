[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਇਕੁ ਅਰਾਧਣਾ; ਇਕੁ ਮਨ ਹੋਇ ਨ ਹੋਇ ਦੁਚਿਤਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The Gurmukhs single-mindedly adore the Lord and do not remain in dubiety."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖ ਇਕ ਮਨ ਹੋਕੇ ਇਕ ਈਸ਼੍ਵਰ ਅਰਾਧਦੇ ਹਨ, ਦੋ ਦਿਲੇ ਨਹੀਂ ਹੁੰਦੇ।"