[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸਾ ਕਰਹੁ; ਬੀਚਾਰੁ ਗਿਆਨੀ ॥"
page = 385
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Think of such a doctrine, O divine,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਐਹੋ ਜੇਹੀ ਤਰਕੀਬ ਸੋਚ, ਹੇ ਬ੍ਰਹਿਮ ਬੇਤੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Consider this, O wise one,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗ੍ਯਾਨੀ ਪੁਰਸੋਂ ਕੇ ਸਾਥ ਮਿਲ ਕਰ ਐਸਾ ਬਿਚਾਰ ਕਰਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਗਿਆਨਵਾਨ ਮਨੁੱਖ! ਕੋਈ ਇਹੋ ਜਿਹੀ ਵਿਚਾਰ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਿਆਨੀ = ਹੇ ਗਿਆਨਵਾਨ ਮਨੁੱਖ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Considera esto, Oh sabio,"