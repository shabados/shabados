[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਈ; ਜੋ ਪ੍ਰਭ ਕੇ ਗੁਨ ਗਾਵੈ ॥"
page = 531
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Mother, he who sings the hymns the Lord's praise,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਤਾ! ਜੋ ਸੁਆਮੀ ਦੀ ਕੀਰਤੀ ਗਾਇਨ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mother, how fruitful is the birth of one who sings the Glories of God,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੋ ਪ੍ਰਭੂ ਕੇ ਗੁਣੋਂ ਕੋ ਗਾਉਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਂ! ਜੇਹੜਾ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦਾ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਈ = ਹੇ ਮਾਂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh madre, Santo es aquél que canta la Alabanza del Señor;"