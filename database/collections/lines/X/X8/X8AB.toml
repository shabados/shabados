data = "(ਉਸ ਕੰਨਿਆ ਬਾਰੇ) ਬੋਲ ਸੁਣ ਕੇ ਰਾਜੇ ਨੇ ਸੈਨਾ ਨੂੰ ਬੁਲਾਇਆ"