[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਬਕਰੀਆਂ ਨੋ ਚਾਰ ਥਣੁ; ਦੁਇ ਗਲ ਵਿਚਿ ਦੁਇ ਲੇਵੈ ਲਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Goats have four teats, two on their necks and two attached to their udders."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਬਕਰੀਆਂ ਦੇ ਥਣ ਚਾਰ ਹਨ, ਦੋ ਹਵਾਨੇ ਨਾਲ ਤੇ ਦੋ ਗਲ ਵਿਖੇ ਹੁੰਦੇ ਹਨ।"