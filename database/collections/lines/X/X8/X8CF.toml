[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸਾ ਦਾਰੂ; ਖਾਹਿ ਗਵਾਰ ॥"
page = 1257
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O ignorant man, take thou such medicine,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਹੋ ਜੇਹੀ ਦਵਾਈ ਲੈ, ਹੇ ਬੇਵਕੂਫ ਬੰਦੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So take such medicine, O fool,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗਵਾਰ! ਤੂੰ ਐਸਾ ਦਾਰੂ ਖਾਹ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ ਜੀਵ! ਅਜੇਹੀ ਦਵਾਈ ਖਾਹ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਵਾਰ = ਹੇ ਮੂਰਖ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh ser ignorante déjate aliviar de tus males con ese remedio"