type = "primary"
data = "ਸੁੰਦਰਿ ਸਕਲ ਭਵਨ ਮੈ ਜਾਨੀ ॥"
page = 913

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Indra Mati was his senior Rani who was acclaimed to be most beautiful ill the world."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰਿਆਂ ਲੋਕਾਂ ਵਿਚ ਸੁੰਦਰ ਜਾਣੀ ਜਾਂਦੀ ਸੀ।"