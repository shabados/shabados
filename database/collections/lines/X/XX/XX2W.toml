[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਗਨਿ ਕੁੰਟ ਮਹਿ. ਉਰਧ ਲਿਵ ਲਾਗਾ; ਹਰਿ ਰਾਖੈ ਉਦਰ ਮੰਝਾਰਾ ॥"
page = 720
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When hanging upside down, thou wert absorbed in the Lord's love in the pit of fire, He preserved thee in the womb."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਮੂਧੇ ਮੂੰਹ ਤੂੰ ਅੱਗ ਦੇ ਟੋਏ ਅੰਦਰ ਪ੍ਰਭੂ ਦੀ ਪ੍ਰੀਤ ਵਿੱਚ ਲੀਨ ਸੈਂ, ਤਦ ਉਸ ਨੇ ਤੈਨੂੰ ਗਰਭ ਵਿਚੋਂ ਬਚਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the fiery pit of the womb, when you were hanging upside-down, the Lord absorbed You in His Love, and preserved You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗਰਭ ਕੀ ਅਗਨੀ ਸੇ ਰਖ੍ਯਾ ਹੇਤ ਜਿਸ ਮੇਂ ਉਰਧ ਮੁਖ ਕਰ ਭਜਨ ਮੇਂ ਲਾਗਾ ਥਾ, ਸੋ ਹਰੀ ਤੇਰੇ ਕੋ ਉਦਰ ਬੀਚ ਅਗਨੀ ਸੇ ਰਾਖਤਾ ਭਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਜਦੋਂ ਜੀਵ (ਮਾਂ ਦੇ ਪੇਟ ਦੀ) ਅੱਗ ਦੇ ਕੁੰਡ ਵਿਚ ਪੁੱਠਾ ਲਟਕਿਆ ਹੋਇਆ (ਉਸ ਦੇ ਚਰਨਾਂ ਵਿਚ) ਸੁਰਤ ਜੋੜੀ ਰੱਖਦਾ ਹੈ (ਤਦੋਂ) ਪਰਮਾਤਮਾ (ਮਾਂ ਦੇ) ਪੇਟ ਵਿਚ ਉਸ ਦੀ ਰੱਖਿਆ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਨਿ ਕੁੰਟ = ਅੱਗ ਦਾ ਕੁੰਡ। ਮਹਿ = ਵਿਚ। ਉਰਧ = ਉਲਟਾ (ਲਟਕਿਆ ਹੋਇਆ)। ਲਿਵ ਲਾਗਾ = ਸੁਰਤ ਜੋੜੀ ਰੱਖਦਾ ਹੈ। ਉਦਰ = (ਮਾਂ ਦਾ) ਪੇਟ। ਮੰਝਾਰਾ = ਮੰਝ, ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien te conservó íntegro en el fuego del vientre, cuando estando boca abajo, fuiste entonado en Él."