[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿ ਮਤਿ ਤ੍ਰਿਲੋਚਨ ਚਿਤਿ; ਭਗਤ ਕੰਬੀਰਹਿ ਜਾਣੀ ॥"
page = 1394
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The understanding that was in the mind of Tirlochan and which was realised by saint Kabir."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਮਝ ਜਿਹੜੀ ਤ੍ਰਿਲੋਚਨ ਦੇ ਮਨ ਵਿੱਚ ਸੀ ਅਤੇ ਜਿਸ ਨੂੰ ਸੰਤ ਕਬੀਰ ਅਨੁਭਵ ਕਰਦਾ ਸੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the understanding which was in the consciousness of Trilochan and known by the devotee Kabeer,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੀ ਬੁਧੀ ਤ੍ਰਿਲੋਚਨ ਜੀ ਕੇ ਚਿਤ ਮੇਂ ਭਈ ਹੈ ਔ ਜੋ ਮਤ ਭਗਤ ਕਬੀਰ ਜੀ ਨੇ ਜਾਣੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮੱਤ ਤ੍ਰਿਲੋਚਨ ਦੇ ਹਿਰਦੇ ਵਿਚ ਸੀ, ਜਿਹੜੀ ਮੱਤ ਕਬੀਰ ਭਗਤ ਨੇ ਸਮਝੀ ਸੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤ੍ਰਿਲੋਚਨ ਚਿਤਿ = ਤ੍ਰਿਲੋਚਨ ਦੇ ਚਿੱਤ ਵਿਚ। ਕੰਬੀਰਹਿ = ਕਬੀਰ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "de Trilochan y la del Devoto Kabir,"