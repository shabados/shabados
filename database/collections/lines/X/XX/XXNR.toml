[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਹਉ ਕਰੇ; ਤੈ ਆਪੁ ਜਣਾਏ ॥"
page = 127
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He continually practises egotism and shows his own self."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਹਰ ਦਮ ਹੰਕਾਰ ਕਰਦਾ ਹੈ ਅਤੇ ਆਪਣੇ ਆਪ ਦਾ ਮੁਜ਼ਾਹਰਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Practicing egotism and selfishness, they try to impress others by showing off."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਪੁਰਸ ਹੰਤਾ ਮਮਤਾ ਕਰ ਕੇ ਆਪਣਾ ਆਪ ਜਨਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ-ਵੇੜ੍ਹਿਆ ਮਨੁੱਖ ਸਦਾ) ਹਉਮੈ ਦੇ ਬੋਲ ਬੋਲਦਾ ਹੈ, ਆਪਣੇ ਆਪ ਨੂੰ ਵੱਡਾ ਜ਼ਾਹਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੈ = ਅਤੇ। ਆਪੁ = ਆਪਣਾ ਆਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El ser humano dice, yo soy, yo soy, y trata de impresionar;"