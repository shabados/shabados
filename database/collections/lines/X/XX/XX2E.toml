[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਠਾਢੇ ਚਾਹਹਿ; ਪ੍ਰਭੂ ਦੁਆਰਿ ॥"
page = 1187
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Standing at Thy door, O Lord, Nanak longs for Thy vision."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਹਿਬ! ਤੇਰੇ ਬੂਹੇ ਤੇ ਖੜਾ ਹੋਇਆ ਨਾਨਕ ਤੇਰੇ ਦਰਸਨ ਦੀ ਤਾਂਘ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak stands longingly at God's Door."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰੇ ਦੁਆਰੇ ਪਰ ਖੜੇ ਤੇਰੇ ਕੋ ਚਾਹਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ ਅਰਦਾਸ ਕਰਦਾ ਹੈ- ਹੇ ਪ੍ਰਭੂ! ਅਸੀਂ ਜੀਵ ਤੇਰੇ ਦਰ ਤੇ ਖਲੋਤੇ (ਬੇਨਤੀ ਕਰਦੇ ਹਾਂ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਢੇ = ਖਲੋਤੇ ਹੋਏ। ਦੁਆਰਿ = ਦਰ ਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak sólo busca postrarse ante Tu Puerta, oh Dios,"