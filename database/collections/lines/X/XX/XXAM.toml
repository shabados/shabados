[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਮਨੋਰਥ ਪੂਰੇ ॥"
page = 629
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the desires are fulfilled,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਖਾਹਿਸ਼ਾਂ ਪੂਰੀਆਂ ਹੋ ਜਾਂਦੀਆਂ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All desires have been fulfilled."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਸਗਲ ਮਨੋਰਥ ਭੀ ਪੂਰਨ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਦੀਆਂ ਸਾਰੀਆਂ ਮਨੋ-ਕਾਮਨਾ ਪੂਰੀਆਂ ਹੋ ਗਈਆਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨੋਰਥ = ਮਨੋ-ਕਾਮਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Logré obtener el Fruto de añoranza de mi corazón"