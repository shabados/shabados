[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਝ ਭੀ ਕੋਲ ਹੈ, ਤੇਰੇ ਰਾਹ ਉਤੇ ਕੁਰਬਾਨ ਕਰ ਦੇਵੇ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਹਰ ਚਿਹ ਦਾਰਦ ਦਰ ਰਹਿਤ ਕੁਰਬਾਂ ਕੁਨਦ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Whatever there is, he should be prepared to sacrifice on Your account,"