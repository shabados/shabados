data = "ਕਲਹਿ ਨਾਮ ਇਕ ਨਾਰਿ; ਮਹਾ ਕਲ ਰੂਪ ਕਲਹ ਕਰ ॥"
page = 693

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There is one woman named Kalha, whose figure is very hideous,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "'ਕਲਹ' ਨਾਂ ਵਾਲੀ ਇਕ ਇਸਤਰੀ ਹੈ ਜੋ ਮਹਾਨ 'ਕਲ' ਰੂਪ ਵਾਲੀ ਅਤੇ ਬਹੁਤ ਕਲੇਸ਼ ਕਰਨ ਵਾਲੀ ਹੈ।"