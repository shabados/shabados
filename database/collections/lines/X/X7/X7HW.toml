[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੋਗ ਸੋਗ ਸਭਿ ਮਿਟਿ ਗਏ; ਨਿਤ ਨਵਾ ਨਿਰੋਆ ॥"
page = 1193
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am rid of all the ailments and sorrow, and am ever hale and hearty."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀਆਂ ਸਾਰੀਆਂ ਬੀਮਾਰੀਆਂ ਤੇ ਅਫਸੋਸ ਦੂਰ ਹੋ ਗਹੇ ਹਨ ਅਤੇ ਮੈਂ ਹਮੇਸ਼ਾਂ ਨੌ-ਬਰ-ਨੌ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All sorrows and sicknesses are eradicated, and you become ever-fresh and rejuvenated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਰੋਗ ਔਰ ਸੋਗ ਸਭ ਦੂਰ ਹੋ ਗਏ ਹੈਂ ਔਰ ਵਹੁ ਨਿਤ ਹੀ (ਨਵਾ) ਨਵੀਨ ਅਰਥਾਤ ਖੁਸੀ ਔ (ਨਿਰੋਆ) ਅਰੋਗ ਹੂਆ ਹੈ, ਭਾਵ ਹੰਕਾਰ ਰੋਗ ਸੇ ਰਹਿਤ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਕਰਕੇ) ਉਸ ਦੇ ਸਾਰੇ ਹੀ ਰੋਗ ਤੇ ਸਹਸੇ ਮਿਟ ਜਾਂਦੇ ਹਨ, ਉਹ ਸਦਾ ਪਵਿਤ੍ਰ-ਆਤਮਾ ਤੇ ਅਰੋਗ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭਿ = ਸਾਰੇ। ਨਿਰੋਆ = ਰੋਗ ਰਹਿਤ, ਅਰੋਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno se libera de sus tristezas y males, estando siempre fresco"