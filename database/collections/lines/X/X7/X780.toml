[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਕੀਐ ਸ੍ਰਮੁ ਕਰੈ; ਤੇ ਬੈਰ ਬਿਰੋਧੀ ॥"
page = 809
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They for whom thou toilest, they are at variance and have enmity with thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਦੀ ਖਾਤਿਰ ਤੂੰ ਮਿਹਨਤ ਮੁਸ਼ੱਕਤ ਕਰਦਾ ਹੈ, ਉਨ੍ਹਾਂ ਦੀ ਤੇਰੇ ਨਾਲ ਅਣਬਣ ਅਤੇ ਦੁਸ਼ਮਣੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those for whom you work, will become your spiteful enemies."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੀਵ! ਤੂੰ ਜਿਨ ਇੰਦ੍ਰੀਆਂ ਵਾ ਸਨਬੰਧੀਆਂ ਕੀ ਪਾਲਨਾ ਕਰਨੇ (ਕੀਐ) ਵਾਸਤੇ (ਸ੍ਰਮੁ) ਕਸਟੁ ਕਰ ਥਕਤ ਹੋਤਾ ਹੈ, ਤੇ ਸਨਬੰਧੀ (ਅੰਤਕਾਲਿ) ਬ੍ਰਿਧ ਅਵਸਥਾ ਮੇਂ ਤੇਰੇ ਸਾਥ ਵਿਰੋਧੀ ਹੂਏ ਵੈਰੀ ਹੋਇ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਸੰਬੰਧੀਆਂ ਦੀ ਖ਼ਾਤਰ ਮਨੁੱਖ (ਧਨ ਇਕੱਠਾ ਕਰਨ ਦੀ) ਮੇਹਨਤ ਕਰਦਾ ਹੈ ਉਹ (ਤੋੜ ਤਕ ਇਸ ਨਾਲ ਸਾਥ ਨਹੀਂ ਨਿਬਾਹ ਸਕਦੇ, ਇਸ ਵਾਸਤੇ ਇਸ ਨਾਲ) ਵੈਰ ਕਰਨ ਵਾਲੇ ਵਿਰੋਧ ਕਰਨ ਵਾਲੇ ਹੀ ਬਣਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੈ ਕੀਐ = ਜਿਨ੍ਹਾਂ (ਸੰਬੰਧੀਆਂ) ਦੀ ਖ਼ਾਤਰ। ਸ੍ਰਮੁ = ਮੇਹਨਤ। ਤੇ = ਉਹ {ਬਹੁ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los parientes por los que uno lucha tanto se convierten en enemigos y lo abandonan al final."