[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੁਰਗਾ ਸਭ ਸੰਘਾਰੇ, ਰਾਕਸ ਆਂਵਦੇ ॥"
page = 125

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Durga killed all the coming demons."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਤਰ੍ਹਾਂ) ਆਉਂਦੇ ਹੋਏ ਸਾਰਿਆਂ ਰਾਖਸ਼ਾਂ ਨੂੰ ਦੁਰਗਾ ਨੇ ਮਾਰ ਦਿੱਤਾ।"