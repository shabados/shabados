[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਇ ਨ ਜਾਵੈ; ਨਿਹਚਲੁ ਧਨੀ ॥"
page = 862
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Immovable Lord comes and goes not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਹਿੱਲ ਸੁਆਮੀ ਆਉਂਦਾ ਅਤੇ ਜਾਂਦਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The unchanging Lord does not come or go."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾ ਕਹੀਂ ਆਵਤਾ ਹੈ ਨਾ ਕਹੀਂ ਜਾਤਾ ਹੈ, ਪੁਨਹ ਵਹੁ ਨਿਸਚਲ ਧਨੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਉਹ ਮਾਲਕ-ਪ੍ਰਭੂ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਹੈ, ਉਹ ਨਾਹ ਜੰਮਦਾ ਹੈ ਨਾਹ ਮਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਇ ਨ = ਜੰਮਦਾ ਨਹੀਂ। ਨ ਜਾਵੈ = ਨਹੀਂ ਮਰਦਾ। ਨਿਹਚਲੁ = ਸਦਾ ਅਟੱਲ। ਧਨੀ = ਮਾਲਕ-ਪ੍ਰਭੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Inamovible Dios no va ni viene, Sus Gloriosas Virtudes son Infinitas."