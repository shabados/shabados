[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਰਮ ਧਰਮ ਜਗ ਮੋ ਭਲੁ ਸਾਜਾ ॥"
page = 194

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The king Manu was the incarnation of Vishnu and he propagated in the right manner the actions of Dharma."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਜਗਤ ਵਿਚ ਧਰਮ ਕਰਮ ਦੀ ਚੰਗੀ ਵਿਵਸਥਾ ਕੀਤੀ।"