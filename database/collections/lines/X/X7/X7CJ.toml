[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੈ ਹੇਤਿ; ਸਾਚੈ ਪ੍ਰੇਮ ਪਿਆਰਿ ॥੧॥ ਰਹਾਉ ॥"
page = 1173
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By loving the Guru, they cultivate love and affection for the True Lord. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਨਾਲ ਪਿਆਰ ਕਰਨ ਦੁਆਰਾ, ਉਨ੍ਹਾਂ ਦੀ ਸੱਚੇ ਸੁਆਮੀ ਨਾਲ ਪ੍ਰੀਤ ਤੇ ਪਿਰਹੜੀ ਪੈ ਜਾਂਦੀ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Loving the Guru, they have love and affection for the True Lord. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਤਿਨੋਂ ਨੇ ਗੁਰੋਂ ਵਿਖੇ ਹੇਤ ਕੀਆ ਹੈ ਔਰ ਸਚੇ ਪਰਮੇਸ੍ਵਰ ਮੇਂ ਪ੍ਰੇਮ ਔਰ ਨਾਮ ਮੇਂ ਪ੍ਯਾਰ ਕੀਆ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦਾ ਗੁਰੂ ਦੇ ਪ੍ਰੇਮ ਵਿਚ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਪ੍ਰੇਮ ਵਿਚ (ਜੁੜੇ ਰਹਿੰਦੇ ਹਨ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ ਹੇਤਿ = ਦੇ ਪਿਆਰ ਵਿਚ। ਸਾਚੈ ਪਿਆਰਿ = ਸਦਾ-ਥਿਰ ਹਰੀ ਦੇ ਪਿਆਰ ਵਿਚ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ellos aman al Guru y este Amor dura para siempre. (1-Pausa)"