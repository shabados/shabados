data = "ਕਰੁਣਾ ਨਿਧਿ ਜਗ ਤਬੈ ਉਚਰਈ ॥੧੦॥"
page = 156

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Therefore the world calls Thee ‘Karuna-nidhi’ (the Tresure of mercy).10."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸੇ ਲਈ ਜਗਤ ਤੈਨੂੰ 'ਕਰੁਣਾਨਿਧੀ' ਉਚਾਰਦਾ ਹੈ ॥੧੦॥"