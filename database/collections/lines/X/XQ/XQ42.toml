[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਰਗ ਮਹਲਾ ੩ ਅਸਟਪਦੀਆ ਘਰੁ ੧ ॥"
page = 1233
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sarang 3rd Guru. Ashtpadis"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੰਗ ਤੀਜੀ ਪਾਤਿਸ਼ਾਹੀ। ਅਸ਼ਟਪਦੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Saarang, Third Mehl, Ashtpadheeyaa, First House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਸਾਰੰਗ, ਘਰ ੧ ਵਿੱਚ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਦੀ ਅੱਠ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sarang, Mejl Guru Amar Das, Tercer Canal Divino, Ashtapadis."