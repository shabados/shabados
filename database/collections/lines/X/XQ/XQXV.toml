[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਵਣੁ ਪਾਣੀ ਪਾਲਾ ਸਹੈ; ਸਿਰ ਤਲਵਾਇਆ ਨਿਹਚਲੁ ਜਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "It bears the impact of air, water and cold but still keeping its head inverse, it remains steadfast at its place."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਉਣ, ਮੀਂਹ ਅਤੇ ਪਾਲਾ ਸਹਾਰਦਾ ਹੈ ਉਲਟਾ ਸਿਰ ਕਰ ਕੇ ਅਚੱਲ ਜਗਾ ਪਰ (ਖੜ੍ਹਾ ਰਹਿੰਦਾ) ਹੈ।"