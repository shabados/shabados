[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਪਿਰ. ਤ੍ਰਿਪਤਿ; ਨ ਕਬਹੂੰ ਹੋਈ ॥੬॥"
page = 226
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "is never satisfied without her spouse. (So is the man of duality)."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨੂੰ ਕਦਾਚਿੱਤ ਆਪਣੇ ਪਤੀ ਬਿਨਾ ਰੱਜ ਨਹੀਂ ਆਉਂਦਾ। (ਉਸੇ ਤਰ੍ਹਾਂ ਦਾ ਹੈ ਦਵੈਤ-ਭਾਵ ਵਾਲਾ ਬੰਦਾ)।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = ", but without her husband, she is never satisfied. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਅਪਨੇ ਭਰਤਾ ਸੇ ਬਿਨਾ ਕਾਮ ਕੀ ਯਥੇਸ਼ਟ ਪੂਰਣਤਾ ਕਬੀ ਨਹੀਂ ਹੋਤੀ। ਭਾਵ ਯਹਿ ਕਿ ਕਾਮਨਾ ਕਰ ਕੇ ਜੀਵ ਔਰ ਦੇਵਤਿਓਂ ਕੋ ਸੇਵਨ ਕਰਤੇ ਹੈਂ, ਪਰੰਤੂ ਪਰਮੇਸਰ ਕੀ ਪ੍ਰਾਪਤੀ ਸੇ ਬਿਨਾ ਤ੍ਰਿਪਤਿ ਨਹੀਂ ਹੋਤੇ ਹੈਂ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਪਤੀ ਤੋਂ ਬਿਨਾ ਉਸ ਨੂੰ ਕਦੀ ਭੀ ਸ਼ਾਂਤੀ ਨਸੀਬ ਨਹੀਂ ਹੋ ਸਕਦੀ (ਤਿਵੇਂ ਖਸਮ-ਪ੍ਰਭੂ ਨੂੰ ਭੁਲਾਣ ਵਾਲੀ ਜੀਵ-ਇਸਤ੍ਰੀ ਆਪਣਾ ਆਪ ਵਿਕਾਰਾਂ ਦੇ ਅਧੀਨ ਕਰਦੀ ਹੈ, ਪਰ ਪਤੀ-ਪ੍ਰਭੂ ਤੋਂ ਬਿਨਾ ਆਤਮਕ ਸੁਖ ਕਦੇ ਨਹੀਂ ਮਿਲ ਸਕਦਾ) ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤ੍ਰਿਪਤਿ = ਸ਼ਾਂਤੀ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no tiene el dominio de su mente y nunca estará satisfecha sin su Esposo Divino. (6)"