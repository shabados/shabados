[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਛੁਟੀ ਈਸ ਤਾੜੀ ਡਗਿਯੋ ਬ੍ਰਹਮ ਧਿਆਨੰ ॥"
page = 165

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Hearing the terrible sound of the war, the attention of gods Shiva and Brahma hath distracted"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਯੁੱਧ ਦੀ ਭਿਆਨਕਤਾ ਕਾਰਨ) ਸ਼ਿਵ ਦੀ ਸਮਾਧੀ ਟੁਟ ਗਈ ਅਤੇ"