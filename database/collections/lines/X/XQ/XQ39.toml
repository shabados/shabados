[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਨੀ ਪਛਾਨੀ ਕਿ ਮੰਦਰ ਕੇ; ਪਿਛਵਾਰੇ ਹੈ ਮੇਰੋ ਖਰੋ ਸੁਖਦਾਈ ॥"
page = 918

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Rani acknowledged that her benefactor was present at the back of the temple."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਣੀ ਨੇ ਪਛਾਣਿਆ ਕਿ ਮੰਦਿਰ ਦੇ ਪਿਛਵਾੜੇ ਮੇਰਾ ਸੁਖਦਾਈ (ਮਿਤਰ) ਖੜੋਤਾ ਹੈ।"