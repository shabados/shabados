[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਮੇਰੇ ਲਾਲਨ; ਤੂੰ ਮੇਰੇ ਪ੍ਰਾਨ ॥"
page = 181
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art my Beloved, and Thou my very Life."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰਾ ਦਿਲਬਰ ਹੈ ਅਤੇ ਤੂੰ ਹੀ ਮੇਰੀ ਜਿੰਦਜਾਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my Intimate Beloved, You are my breath of life."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਹਾਰਾਜ! ਤੂੰ ਮੇਰੇ (ਲਾਲਨ) ਲਡਾਉਣੇ ਵਾਲਾ ਹੈਂ ਔਰ ਤੂੰ ਹੀ ਮੇਰੇ ਪ੍ਰਾਨ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਤੂੰ ਮੇਰਾ ਸੋਹਣਾ ਲਾਲ ਹੈਂ, ਤੂੰ ਮੇਰੀ ਜਿੰਦ (ਦਾ ਸਹਾਰਾ) ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਾਲਨ = ਲਾਡਲਾ। ਪ੍ਰਾਨ = ਜਿੰਦ (ਦਾ ਸਹਾਰਾ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres mi Bienamado, eres mi Respiración Vital;"