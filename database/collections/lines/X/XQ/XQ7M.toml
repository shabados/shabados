[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਸਾਲਾਹੀ; ਜਿਸੁ ਹਰਿ ਧਨੁ ਰਾਸਿ ॥"
page = 1155
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I praise him, who possesses the capital of the Lord's wealth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਸ ਦੀ ਉਸਤਤੀ ਕਰਦਾ ਹਾਂ, ਜਿਸ ਦੇ ਪੱਲੇ ਵਾਹਿਗੁਰੂ ਦੀ ਦੌਲਤ ਦੀ ਪੂੰਜੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I praise that person, who has the capital of the Lord's Wealth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਪਾਸ ਹਰੀ ਕੇ ਨਾਮ ਧਨ ਕੀ ਪੂੰਜੀ ਹੈ ਤਿਸ ਪੁਰਸ ਕੀ ਹਮ ਉਸਤਤੀ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਸ ਮਨੁੱਖ ਨੂੰ ਵਡਿਆਉਂਦਾ ਹਾਂ ਜਿਸ ਦੇ ਪਾਸ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਧਨ ਸਰਮਾਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸੁ = ਉਸ (ਮਨੁੱਖ) ਨੂੰ। ਸਾਲਾਹੀ = ਸਾਲਾਹੀਂ, ਮੈਂ ਸਲਾਹੁੰਦਾ ਹਾਂ। ਰਾਸਿ = ਸਰਮਾਇਆ, ਪੂੰਜੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos alaban a aquél que obtiene las Riquezas del Señor,"