data = "ਵਜ਼ਾ ਖ਼ੁਦ ਸ਼ਨਾਸੀ, ਕਿ ਗੋਈ ਸ਼ਹਸ ॥੪੩॥"
page = 1399

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘(He is) considered as worthy as your king.(43)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਆਪਣਾ ਬਾਦਸ਼ਾਹ ਸਮਝੋ ਅਤੇ ਕਹੋ ॥੪੩॥"