[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਥਿਆ ਰਸਨਾ; ਨਿਤ ਉਠਿ ਭਾਖੈ ॥"
page = 1151
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Arising daily, he utters falsehood with his tongue."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਿਤਾਪ੍ਰਤੀ ਉਠ ਕੇਉਹ ਆਪਣੀ ਜੀਭ ਨਾਲ ਝੂਠ ਬੋਲਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He gets up each day and tells lies."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਸਨਾ ਕਰ ਕੇ ਨਿਤਾਪ੍ਰਤਿ ਉਠ ਕਰ ਝੂਠ ਬੋਲਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਸਦਾ ਗਿਣ-ਮਿਥ ਕੇ ਆਪਣੀ ਜੀਭ ਨਾਲ ਝੂਠ ਬੋਲਦਾ ਰਹਿੰਦਾ ਹੈ"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਥਿਆ = ਝੂਠ। ਰਸਨਾ = ਜੀਭ (ਨਾਲ)। ਉਠਿ = ਉੱਠ ਕੇ। ਨਿਤ ਉਠਿ = ਸਦਾ ਹੀ, ਹਰ ਰੋਜ਼। ਭਾਖੈ = ਬੋਲਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "se convierte en la encarnación de aquéllas, sí, aquél que con sus labios pronuncia falsedades"