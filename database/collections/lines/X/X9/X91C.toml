[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਖ ਸੋਗ ਕਾ ਨਗਰੁ ਇਹੁ ਕੀਆ ॥"
page = 1075
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This body is made the township of weal and woe."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਦੇਹ ਖੁਸ਼ੀ ਤੇ ਗਮੀ ਦਾ ਪਿੰਡ ਬਣਾਇਆ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This body has been made the village of joy and sorrow."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੰਸਾਰ ਹਰਖ ਸੋਗ ਨਾ ਨਗਰ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਨੇ ਇਸ ਮਨੁੱਖਾ ਸਰੀਰ ਨੂੰ ਖ਼ੁਸ਼ੀ ਗ਼ਮੀ ਦਾ ਨਗਰ ਬਣਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਖ = ਖ਼ੁਸ਼ੀ। ਸੋਗ = ਗ਼ਮੀ। ਨਗਰੁ = ਸਰੀਰ-ਸ਼ਹਰ। ਸੇ = ਉਹ {ਬਹੁ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La ciudad del cuerpo engendra el placer, pero también el dolor"