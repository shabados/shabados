[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੀ ਬੈਸਕ ਤਿਨੑਾ ਸੰਗਿ; ਜਿਨ ਸੰਗਿ ਜਪੀਐ ਨਾਉ ॥"
page = 520
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is the society of those, in whose company, the Name is meditated upon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੀ ਹੈ ਸੰਗਤ ਉਨ੍ਹਾਂ ਦੀ, ਜਿਨ੍ਹਾਂ ਦੇ ਮੇਲ-ਮਿਲਾਪ ਅੰਦਰ ਨਾਮ ਸਿਮਰਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The true society is the company of those who meditate on the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚੀ ਬੈਠਕ ਉਨਹੀਂ ਕੇ ਸੰਗ ਕੀ ਹੈ ਜਿਨ ਕੇ ਸੰਗ ਬੈਠ ਕਰ ਨਾਮ ਜਪੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਮਨੁੱਖਾਂ ਨਾਲ ਤੋੜ ਨਿਭਣ ਵਾਲੀ ਮੁਹੱਬਤ (ਕਰਨੀ ਚਾਹੀਦੀ ਹੈ) ਜਿਨ੍ਹਾਂ ਨਾਲ (ਬੈਠਿਆਂ ਪਰਮਾਤਮਾ ਦਾ) ਨਾਮ ਸਿਮਰਿਆ ਜਾ ਸਕੇ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੀ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੀ, ਤੋੜ ਨਿਭਣ ਵਾਲੀ। ਬੈਸਕ = ਬੈਠਕ। ਸੰਗਿ = ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La verdadera relación es aquélla en la que uno contempla el Nombre del Señor."