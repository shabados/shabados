[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਸੁ ਜਪਤ; ਸਗਲਾ ਦੁਖੁ ਲਾਥਾ ॥੬॥"
page = 236
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By remembering whom all the distress is destroyed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ ਸਾਰਾ ਦੁਖੜਾ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating on Him, all pains are destroyed. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਿਸ ਕੇ ਜਪਣੇ ਸੇ ਸੰਪੂਰਨ ਦੁਖ ਲੱਥਾ ਹੀ ਜਾਣੁ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਜਿਸ ਦਾ ਨਾਮ ਜਪਿਆਂ ਹਰੇਕ ਕਿਸਮ ਦਾ ਦੁੱਖ ਦੂਰ ਹੋ ਜਾਇਗਾ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y toda tristeza se aleja de nosotros. (6)"