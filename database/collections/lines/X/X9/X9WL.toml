[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੜਿ ਪੰਡਿਤੁ; ਅਵਰਾ ਸਮਝਾਏ ॥"
page = 1046
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Brahman reads and instructs others,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਾਹਮਣ ਵਾਚਦਾ ਅਤੇ ਹੋਰਨਾਂ ਨੂੰ ਸਿੱਖਮਤ ਦਿੰਦਾ ਹੈ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Pandit, the religious scholar, reads and instructs others,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੰਡਤ ਪੜ ਕੇ ਹੋਰਨਾਂ ਕੋ ਸਮਝਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੰਡਿਤ (ਧਰਮ ਪੁਸਤਕਾਂ) ਪੜ੍ਹ ਕੇ ਹੋਰਨਾਂ ਨੂੰ ਮੱਤਾਂ ਦੇਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੜਿ = ਪੜ੍ਹ ਕੇ। ਪੰਡਿਤੁ = {ਇਕ-ਵਚਨ}। ਅਵਰਾ = ਅਵਰਾਂ, ਹੋਰਨਾਂ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Pandit lee y después instruye a otros, sin darse cuenta que en su propio hogar hay fuego."