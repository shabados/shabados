[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਭਏ ਹੈ; ਕਿਰਪੇਨ ॥"
page = 1305
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord has become merciful unto me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਲਕ ਮੇਰੇ ਉਤੇ ਮਿਹਰਬਾਨ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God has become Merciful to me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਸੇ ਪ੍ਰਭ ਜੀ ਕ੍ਰਿਪਾਲ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ, ਪ੍ਰਭੂ ਦਇਆਵਾਨ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਰਪੇਨ = ਕਿਰਪਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios me ha mostrado Su Misericordia;"