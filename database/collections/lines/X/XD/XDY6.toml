[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਰ੍ਹਿਐ ਦਰਗਹ ਗੁਰੂ ਕੀ; ਕੁਦਰਤੀ ਨੂਰੁ ॥"
page = 967
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord's Light spontaneously rains at the Guru's court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੀ ਰੌਸ਼ਨੀ ਸੁਤੇਸਿਧ ਹੀ ਗੁਰਾਂ-ਦੇ ਦਰਬਾਰ ਤੇ ਵਰਸਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Guru's Court, the Divine Light shines in its creative power."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਰੂ ਜੀ! ਆਪ ਕੀ ਸਭਾ ਮੇਂ (ਕੁਦਰਤੀ) ਪਰਮੇਸਰ ਕਾ ਨੂਰ ਬਰਸਤਾ ਹੈ, ਭਾਵ ਆਤਮ ਗ੍ਯਾਨ ਪ੍ਰਾਪਤ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਗੁਰੂ (ਨਾਨਕ) ਦੀ ਦਰਗਾਹ ਵਿਚ ('ਨਾਮ' ਦੀ) ਵਰਖਾ ਹੋਣ ਕਰ ਕੇ (ਹੇ ਗੁਰੂ ਅੰਗਦ! ਤੇਰੇ ਉਤੇ) ਰੱਬੀ ਨੂਰ (ਡਲ੍ਹਕਾਂ ਮਾਰ ਰਿਹਾ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਰ੍ਹਿਐ = ਵਰ੍ਹਨ ਕਰ ਕੇ, ਵਰਖਾ ਹੋਣ ਕਰ ਕੇ। ਕੁਦਰਤੀ = ਰੱਬੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Luz de Dios se rocía espontáneamente en la Corte del Guru."