[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਛਾਡਤਿ ਹੈ ਹਮ ਸਸਤ੍ਰ ਸਬੈ; ਸੁ ਬਿਵਾਨ ਚਢੋ ਸੁਰ ਧਾਮਿ ਸਿਧਈਯੈ ॥੧੭੧੪॥"
page = 468

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "We all forsake our weapons, go to heaven, mounting on the air-vehicle.”1714."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਸੀਂ ਸਾਰੇ ਵੀ (ਹੁਣ) ਸ਼ਸਤ੍ਰ ਛਡਦੇ ਹਾਂ, ਤੁਸੀਂ ਵਿਮਾਨ ਵਿਚ ਚੜ੍ਹੋ ਅਤੇ ਦੇਵ-ਲੋਕ ਵਲ ਚਾਲੇ ਪਾਓ ॥੧੭੧੪॥"