[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਯ ਭੰਜਨੁ, ਪਰ ਦੁਖ ਨਿਵਾਰੁ; ਅਪਾਰੁ ਅਨੰਭਉ ॥"
page = 1407
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the destroyer of dread, the dispeller of other's pain, infinite and fearless."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਡਰ ਨਾਸ ਕਰਨਹਾਰ, ਹੋਰਨਾ ਦੀ ਪੀੜ ਦੂਰ ਕਰਨ ਵਾਲਾ ਬੇਅੰਤ ਅਤੇ ਭੈ-ਰਹਿਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the Destroyer of fear, the Dispeller of pain, Infinite and Fearless."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਭੈ ਕੇ (ਭੰਜਨੁ) ਨਾਸ ਕਰਨੇਹਾਰੇ ਔ ਪਰ ਕੇ ਦੁਖ ਕੋ ਨਿਵਾਰਨੇਵਾਰੇ ਅਪਾਰ ਅਨਭਵ ਸਰੂਪ (ਅਗਹ) ਜੋ ਪਰਮੇਸਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਅਰਜਨ) ਭੈ ਦੂਰ ਕਰਨ ਵਾਲਾ, ਪਰਾਏ ਦੁੱਖ ਹਰਨ ਵਾਲਾ, ਬੇਅੰਤ ਤੇ ਗਿਆਨ-ਸਰੂਪ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰ ਦੁਖ = ਪਰਾਏ ਦੁੱਖ। ਅਨੰਭਉ = ਗਿਆਨ-ਰੂਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Destructor del miedo, Disipador del dolor, Infinito y Sin Miedo."