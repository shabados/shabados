[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਰਤੁ ਨਰਕੁ ਅਸਥਾਨ ਬਿਖੜੇ; ਬਿਖੁ. ਨ ਪੋਹੈ ਤਾਹਿ ॥੪॥"
page = 1017
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Death, hell, agonising abodes and sins touch him not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੌਤ, ਦੋਜ਼ਕ, ਦੁਖਦਾਈ ਟਿਕਾਣੇ ਅਤੇ ਪਾਪ ਉਸ ਨੂੰ ਛੂੰਹਦੇ ਤਕ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Death, hell and the most horrible dwelling of sin and corruption cannot even touch such a person. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੋ ਮੌਤ ਔ ਨਰਕ ਪੁਨਃ ਜੋ ਔਖੇ ਅਸਥਾਨ ਹੈਂ ਤਥਾ ਵਿਖੈ ਰੂਪ ਵਿਖ ਜੋ ਹੈ, ਸੋ ਨਹੀਂ ਬਿਆਪਤੀ ਹੈ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਤਮਕ ਮੌਤ, ਨਰਕ, ਹੋਰ ਔਖੇ ਥਾਂ, ਆਤਮਕ ਮੌਤ ਲਿਆਉਣ ਵਾਲੀ ਮਾਇਆ-ਇਹਨਾਂ ਵਿਚੋਂ ਕੋਈ ਭੀ ਉਸ ਉਤੇ ਆਪਣਾ ਅਸਰ ਨਹੀਂ ਪਾ ਸਕਦਾ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਰਤੁ = ਮੌਤ। ਅਸਥਾਨ ਬਿਖੜੇ = ਔਖੇ ਥਾਂ। ਬਿਖੁ = ਜ਼ਹਿਰ, ਆਤਮਕ ਮੌਤ ਲਿਆਉਣ ਵਾਲੀ ਮਾਇਆ। ਨ ਪੋਹੈ = ਅਸਰ ਨਹੀਂ ਕਰ ਸਕਦੀ। ਤਾਹਿ = ਉਸ ਨੂੰ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ni la muerte, ni la oscuridad de la conciencia lo amenazan, tampoco el vicio, ni las altas y las bajas de la vida. (4)"