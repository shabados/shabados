[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਟੇ ਅੰਗ ਜੰਗੰ ਰਟੈਂ ਮਾਰ ਮਾਰੰ ॥੪੦੭॥"
page = 242

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors have begun the war in many way, the chopped limbs are falling, even then the warriors are shouting “Kill, Kill”.407."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੇ ਯੁੱਧ ਵਿੱਚ ਅੰਗ ਕੱਟੇ ਗਏ ਹਨ, (ਤਾਂ ਵੀ ਮੂੰਹੋਂ) ਮਾਰੋ-ਮਾਰੋ ਬੋਲਦੇ ਹਨ ॥੪੦੭॥"