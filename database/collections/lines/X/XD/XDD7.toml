[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਇਕਸਿ ਇਕਸਿ ਜੋਨਿ ਵਿਚਿ; ਜੀਅ ਜੰਤ ਅਗਣਤ ਅਪਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In each species innumerable creatures are there."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਇਕ ਇਕ ਜੂਨ ਵਿਚ ਬੇਸ਼ੁਮਾਰ ਜੀਵਜੰਤੁ ਬਣਾਏ।"