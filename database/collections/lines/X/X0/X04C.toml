[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਧਸੰਗਤਿ ਅਸਥਾਨੁ; ਜਗਮਗ ਨੂਰ ਹੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "His glory shines forth in the holy congregation of the saints."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਦੇ ਅਸਥਾਨ ਵਿਖੇ (ਉਸਦਾ) ਨੂਰ ਜਗਮਗ ਕਰ ਰਿਹਾ ਹੈ।"