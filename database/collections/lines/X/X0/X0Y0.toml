[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਰਭ ਮਹਿ ਰਾਖਿਆ; ਜਿਨਿ ਕਰਿ ਜਤਨੁ ॥"
page = 177
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who has adopted means to preserve thee in the womb"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਬੱਚੇਦਾਨੀ ਵਿੱਚ ਤੈਨੂੰ ਬਚਾਉਣ ਲਈ ਉਪਾਓ ਅਖਤਿਆਰ ਕੀਤੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and He managed to preserve you in the womb."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜਿਸ ਨੇ ਮਾਤ ਗਰਭ ਮੇਂ ਬਡੇ ਜਤਨ ਸੇ ਰਖ੍ਯਾ ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਜਤਨ ਕਰ ਕੇ ਮਾਂ ਦੇ ਪੇਟ ਵਿਚ ਮੇਰੀ ਰੱਖਿਆ ਕੀਤੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਰਭ = ਮਾਂ ਦਾ ਪੇਟ। ਕਰਿ = ਕਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Él, Quien te preservó en el vientre eterno,"