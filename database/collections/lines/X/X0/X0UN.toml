[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਪ੍ਰਭ ਭਏ ਪ੍ਰਸੀਨਾ ॥੪॥੭॥੧੨॥"
page = 804
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and the Lord is pleased with me, says Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸੁਆਮੀ ਮੇਰੇ ਨਾਲ ਪਰਸੰਨ ਹੋ ਗਿਆ ਹੈ, ਗੁਰੂ ਜੀ ਫੁਰਮਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, God is pleased with me. ||4||7||12||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈ: ਤਿਨੋਂ ਪਰ ਪ੍ਰਭੂ ਜੀ (ਪ੍ਰਸੀਨਾ) ਪ੍ਰਸੰਨ ਭਏ ਹੈਂ॥੪॥੭॥੧੨॥☬ਪੁਨ: ਬੇਨਤੀ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- (ਜਿਨ੍ਹਾਂ ਉਤੇ) ਪ੍ਰਭੂ ਜੀ ਪ੍ਰਸੰਨ ਹੋ ਗਏ ॥੪॥੭॥੧੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕ = ਹੇ ਨਾਨਕ! ਪ੍ਰਸੀਨਾ = ਪ੍ਰਸੰਨ ॥੪॥੭॥੧੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y mira, el Señor está complacido conmigo.(4-7-12)"