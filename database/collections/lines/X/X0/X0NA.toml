[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਫਲ ਮੂਰਤਿ; ਜਾ ਕੀ ਨਿਰਮਲ ਸੇਵ ॥"
page = 677
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Fruitful is his vision and immaculate his service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਫਲਦਾਇਕ ਹੈ ਉਸ ਦਾ ਦਰਸ਼ਨ ਅਤੇ ਪਵਿੱਤਰ ਉਸ ਦੀ ਘਾਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His image brings prosperity; serving Him, we become pure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੀ ਮੂਰਤੀ ਸਫਲ ਔਰ ਸੇਵਾ ਭੀ ਨਿਰਮਲ ਹੈ ਵਾ ਉਜਲ ਕਰਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰਮਾਤਮਾ ਦਾ ਦਰਸਨ ਕੀਤਿਆਂ ਸਾਰੇ ਫਲ ਪ੍ਰਾਪਤ ਹੁੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਫਲ ਮੂਰਤਿ = ਜਿਸ ਦੇ ਦੀਦਾਰ ਨਾਲ ਸਾਰੇ ਫਲ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦੇ ਹਨ। ਜਾ ਕੀ = ਜਿਸ ਪਰਮਾਤਮਾ ਦੀ। ਨਿਰਮਲ = ਪਵਿਤ੍ਰ ਕਰਨ ਵਾਲੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien es nuestro padre y madre, Cuya sola Presencia es dadora de Éxtasis y Cuyo Servicio lo vuelve a uno puro."