[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨੑੀ ਘਰੁ ਜਾਤਾ ਆਪਣਾ; ਸੇ ਸੁਖੀਏ ਭਾਈ ॥"
page = 425
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who know their Home, are happy, my brother."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਪਣੇ ਗ੍ਰਹਿ ਨੂੰ ਜਾਣਦੇ ਹਨ, ਉਹ ਅਨੰਦ-ਪ੍ਰਸੰਨ ਹਨ, ਹੇ ਵੀਰ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who know their own home, are happy, O Siblings of Destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਨੋਂ ਨੇ ਅਪਨਾ ਸ੍ਵਰੂਪ ਘਰ ਪਛਾਨਾ ਹੈ, ਸੋ ਸੁਖੀਏ ਭਏ ਹੈਂ॥☬ਜੇ ਕਹੇ ਕਿਸ ਤਰਾਂ ਉਨੋਂ ਨੇ ਪਛਾਨਾ ਹੈ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਨੇ ਆਪਣਾ (ਹਿਰਦਾ-) ਘਰ ਚੰਗੀ ਤਰ੍ਹਾਂ ਸਮਝ ਲਿਆ ਹੈ (ਭਾਵ, ਜਿਨ੍ਹਾਂ ਨੇ) ਇਹ ਪਛਾਣ ਲਿਆ ਹੈ ਕਿ ਪਰਮਾਤਮਾ (ਸਾਡੇ) ਅੰਦਰ ਹੀ ਵੱਸਦਾ ਹੈ, ਉਹ ਸੁਖੀ ਜੀਵਨ ਬਿਤਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਤਾ = ਪਛਾਣਿਆ। ਭਾਈ = ਹੇ ਭਾਈ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Benditos son aquéllos que realizan su propio Hogar;"