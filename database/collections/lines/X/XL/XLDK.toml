[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਕਰਿ ਗਤਿ ਮੇਰੀ; ਪ੍ਰਭ ਦਇਆਰ ॥੧॥ ਰਹਾਉ ॥"
page = 1182
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Emancipate Thou me, O my merciful Master. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰੀ ਕਲਿਆਨ ਕਰ, ਹੇ ਮੇਰੇ ਮਿਹਰਬਾਨ ਮਾਲਕ! ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Save me, O my Merciful Lord God. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਯਾਲ ਪ੍ਰਭੂ! ਤੂੰ ਮੇਰੀ ਮੋਖਿ ਕਰੁ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਿਹਰ ਕਰ) ਮੈਨੂੰ ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ਦੇਹ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਤਿ = ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ। ਪ੍ਰਭ ਦਇਆਰ = ਹੇ ਦਇਆਲ ਪ੍ਰਭੂ! ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor Bondadoso, muéstrame Tu Compasión y libérame. (1-Pausa)"