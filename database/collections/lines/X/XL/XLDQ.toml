[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨਿ ਭੀ; ਅੰਤੁ. ਨ ਪਾਇਆ ਤੋਹਿ ॥"
page = 1237
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Even they can find not Thy limit, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਭੀ ਤੇਰੇ ਓੜਕ ਨੂੰ ਨਹੀਂ ਪਾ ਸਕਦੇ, ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Even these cannot find the limits of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨੋਂ ਨੇ ਭੀ (ਤੋਹਿ) ਤੇਰਾ ਅੰਤ ਨਹੀਂ ਪਾਇਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਭੀ (ਹੇ ਪ੍ਰਭੂ!) ਤੇਰਾ ਅੰਤ ਨਹੀਂ ਪਾਇਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਨਿ = ਉਸ ਨੇ। ਤੋਹਿ = ਤੇਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aun así uno no podrá encontrar los límites de Dios."