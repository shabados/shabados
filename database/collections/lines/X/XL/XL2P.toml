[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖਖਾ; ਖਿਰਤ ਖਪਤ ਗਏ ਕੇਤੇ ॥"
page = 342
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Kh - Many have pined and perished away."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖ - ਅਨੇਕਾਂ ਹੀ ਖੁਰ ਕੇ ਨਾਸ ਹੋ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "KHAKHA: Many have wasted their lives, and then perished."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਖਖੇ ਅਖਰ ਦੁਆਰਾ ਕਹਤੇ ਹੈਂ: ਕਿਤਨੇ ਹੀ ਪੁਰਸ਼ (ਖਿਰਤ) ਜਗਤ ਕੇ ਬੀਚ ਵਾ (ਖਿਰਤ) ਖੀਨ ਹੋ ਕਰ ਖਪ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਰਦਿਆਂ ਖਪਦਿਆਂ ਜੀਵ ਦੇ ਕਈ ਜਨਮ ਲੰਘ ਗਏ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖਿਰਤ = {Skt. क्षर = To glide, to waste away perish.} ਨਾਸ ਹੁੰਦੇ ਹੁੰਦੇ। ਕੇਤੇ = ਕਈ, ਬੇਅੰਤ (ਜਨਮ)। ਅਜਹੂੰ = ਅਜੇ ਤਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Kha kha Muchos han desperdiciado sus vidas en la banalidad, y en ese desperdicio,"