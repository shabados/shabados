[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਮੈਣ ਆਪਣੀ ਅੱਖ ਦੀ ਪੁਤਲੀ ਵਿਚ ਉਸ ਦਿਲ ਹਰਨ ਵਾਲੇ ਨੂੰ ਵੇਖਿਆ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਦਰੂੰ ਮਰਦਮੁਕਿ ਦੀਦਾ ਦਿਲਰੁਬਾ ਦੀਦਮ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, it is only with a real devotion for Him that one gets eternal bliss. (221)"