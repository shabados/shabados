[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲੂਣ ਖਾਇ ਕਰਿ ਚਾਕਰੀ; ਰਣਿ ਟੁਕ ਟੁਕ ਹੋਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Such a faithful, in the battlefield gets killed piece to piece for the master."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਚਾਕਰ) ਲੂਣ ਖਾਕੇ 'ਚਾਕਰੀ' ਕਰਦਾ, ਰਣ ਵਿਖੇ ਟੁਕੜੇ ਟੁਕੜੇ ਹੋਕੇ ਮਰਦਾ ਹੈ।"