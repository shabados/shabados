type = "primary"
data = "ਗ੍ਰਿਹ ਤੇ ਨਿਕਸਿ ਚੋਰ ਤਬ ਭਾਗੇ ॥"
page = 950

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Along with Jodan, other people awoke too and the thieves tried to slip out of the house."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਚੋਰ ਘਰ ਵਿਚੋਂ ਨਿਕਲ ਕੇ ਭਜ ਗਏ।"