[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਪਨ ਨ︀ਯਾਸ ਸਿਖਾਇ ਸਬਨ ਕਹੁ ਆਪਨ ਮੰਤ੍ਰ ਚਲਾਯੋ ॥"
page = 687

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In this way, killing the Sannyasis, Parasnath propagated his own sect and extended his own mode of worship"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਨੂੰ ਆਪਣਾ ਢੰਗ ਸਿਖਾ ਕੇ ਆਪਣਾ ਮੰਤ੍ਰ ਚਲਾ ਦਿੱਤਾ।"