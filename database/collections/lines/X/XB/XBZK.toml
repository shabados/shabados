[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਹਰਿ ਹਰੇ; ਸੁ ਹੋਹਿ ਨ. ਆਨਾ ॥"
page = 330
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who are reverdured by God, become not of any other."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੂੰ ਵਾਹਿਗੁਰੂ ਨੇ ਸਰਸਬਜ ਕੀਤਾ ਹੈ, ਉਹ ਹੋਰਸ ਕਿਸੇ ਦੇ ਨਹੀਂ ਬਣਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who are rejuvenated by the Lord, do not belong to any other."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਹਰੀ ਨੇ ਅਪਨੀ ਤਰਫ ਹਰੇ ਹੈਂ ਅਰਥਾਤ ਅਪਨੇ ਮੇਂ ਮਿਲਾਇ ਲੀਏ ਹੈਂ (ਸੋ) ਆਨਾ ਭਿੰਨ ਨਹੀਂ ਹੋ ਸਕਤੇ ਹੈਂ। ਵਾ ਜੋ (ਹਰੇ) ਹਰੀ ਕੋ ਪਾਇ ਕਰ ਅਨੰਦ ਹੂਏ ਹੈਂ ਪਾਉਣੇ ਕਾ ਅਧਿਆਹਾਰ ਹੈ, ਸੋ ਅਨੰਦ ਸੇ ਭਿੰਨ ਸੋਕਵਾਨ ਨਹੀਂ ਹੋਤੇ, ਭਾਵ ਸੇ ਸਦਾ ਹੀ ਆਤਮ ਅਨੰਦੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਪ੍ਰਭੂ ਦਾ ਸਿਮਰਨ ਕਰਦੇ ਹਨ, ਉਹ ਪ੍ਰਭੂ ਤੋਂ ਵੱਖਰੇ ਨਹੀਂ ਰਹਿ ਜਾਂਦੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ ਹਰੇ = ਹਰੀ ਹਰੀ ਹੀ, ਪ੍ਰਭੂ ਪ੍ਰਭੂ ਹੀ (ਜਪਦੇ ਹਨ)। ਹੋਹਿ ਨ = ਨਹੀਂ ਹੁੰਦੇ। ਆਨਾ = (ਪ੍ਰਭੂ ਤੋਂ) ਵੱਖਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquéllos que vivieron en el Señor, no permanecieron diferentes a Él."