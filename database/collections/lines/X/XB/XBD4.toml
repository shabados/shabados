[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੂਖ ਸਹਜ ਆਨੰਦ ਲਹਹੁ ॥"
page = 1147
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man, obtain peace, poise and bliss;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੰਦੇ! ਤੂੰ ਆਰਾਮ, ਅਡੋਲਤਾ ਤੇ ਖੁਸ਼ੀ ਨੂੰ ਹਾਸਲ ਕਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You shall obtain peace, poise and bliss,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਹਜ ਸੁਖ ਕੇ ਅਨੰਦ ਕਾ ਲੈਣਾ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਾਧ ਸੰਗਤ ਵਿਚ) ਆਤਮਕ ਅਡੋਲਤਾ ਦੇ ਸੁਖ ਆਨੰਦ ਮਾਣੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜ = ਆਤਮਕ ਅਡੋਲਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh raza humana, obten Paz, Equilibrio y Éxtasis, recitando el Naam,"