[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਘਰਿ ਅਸਾਡੇ ਛਡਿ ਕੈ; ਗੋਲੇ ਦੇ ਘਰਿ ਜਾਹਿ ਕਿ ਸੁਖਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Leaving our grand palaces, how much happiness and comfort did you attain in the home of a servant?"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਡੇ ਮੰਦਰਾਂ ਨੂੰ ਛਡ ਕੇ ਦਾਸ ਦੇ ਘਰ ਜਾਣ ਨਾਲ ਕੀ ਸੁਖ ਹੈ?"