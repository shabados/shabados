[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚਾਰਿ ਵਰਨ ਗੁਰਸਿਖ ਹੋਇ; ਸਾਧਸੰਗਤਿ ਸਚ ਖੰਡ ਵਸਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "People of the four varnas, by becoming followers of the Guru, reside in the abode of truth through the holy congregation."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਚਾਰ ਵਰਣ ਗੁਰੂ ਦੇ ਸਿੱਖ ਹੋਕੇ ਸਾਧ ਸੰਗਤ ਸਚਖੰਡ ਵਿਖੇ ਵਸਦੇ ਹਨ।"