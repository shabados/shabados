[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿ ਬਿਗੁਜ਼ਸਤ ਬਰ ਹਰ ਮਕੀਨੋ ਮਕਾਂ ॥੧੦੮॥"
page = 1394

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "It gives a fatal blow to everthing of this world.108."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਇਹ ਹਰ ਮਕਾਨ ਅਤੇ ਮਕਾਨ ਵਿਚ ਰਹਿਣ ਵਾਲਿਆਂ ਉਪਰੋਂ ਲੰਘ ਰਿਹਾ ਹੈ ॥੧੦੮॥"