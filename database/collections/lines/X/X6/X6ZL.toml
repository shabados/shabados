[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਰਾਮ; ਹਉ ਸੋ ਥਾਨੁ ਭਾਲਣ ਆਇਆ ॥"
page = 747
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Lord I have come to search that place."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸੁਆਮੀ! ਮੈਂ ਉਸ ਅਸਥਾਨ ਨੂੰ ਲੱਭਣ ਲਈ ਆਇਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my Lord, I have come searching for that place."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਰਾਮ! ਮੈਂ ਵਹੁ ਅਸਥਾਨ ਢੂੰਢਣੇ ਕੋ ਆਯਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਰਾਮ! ਮੈਂ ਉਹ ਥਾਂ ਲੱਭਣ ਤੁਰ ਪਿਆ (ਜਿੱਥੇ ਮੈਂ ਤੇਰਾ ਦਰਸਨ ਕਰ ਸਕਾਂ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਮੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, he estado en búsqueda de ese lugar,"