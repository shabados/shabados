[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਧਸੰਗਤਿ ਆਰਾਧਿਆ; ਭਗਤਿ ਵਛਲੁ ਗੁਰੁ ਰੂਪੁ ਮੁਰਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Have undertaken to perform various types of business and trade."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਵਿਖੇ ਮਿਲਕੇ ਭਗਤ ਵਛਲ 'ਮੁਰਾਰੀ' (ਹੰਕਾਰ ਨਾਸ਼ਕ) ਨੂੰ ਗੁਰੂ ਰੂਪ ਕਰ ਕੇ ਅਰਾਧਦੇ ਹਨ।"