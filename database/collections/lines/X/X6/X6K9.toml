[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਹ ਅਨਹਦ ਸਬਦ ਅਗਾਜਾ ॥"
page = 621
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There in His presence, celestial music, resounds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਉਸ ਦੀ ਹਜ਼ੂਰੀ ਵਿੱਚ ਬੈਕੁੰਠੀ ਕੀਰਤਨ ਗੂੰਜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There, the unstruck melody of the Shabad resounds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸਤਸੰਗ ਮੇਂ ਏਕ ਰਸ ਉਪਦੇਸ਼ ਪ੍ਰਗਟ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨਾਲ ਮਿਲਾਪ-ਅਵਸਥਾ ਵਿਚ ਮਨੁੱਖ ਦੇ ਅੰਦਰ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ ਇਕ-ਰਸ ਪੂਰਾ ਪ੍ਰਭਾਵ ਪਾ ਲੈਂਦੀ ਹੈ (ਤੇ, ਮਨੁੱਖ ਉੱਤੇ ਕਾਮਾਦਿਕ ਵੈਰੀ ਆਪਣਾ ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕਦੇ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਹਦ = ਇਕ-ਰਸ, ਬਿਨਾ ਵਜਾਏ, ਲਗਾਤਾਰ। ਸਬਦ = ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ। ਅਗਾਜਾ = ਗੱਜ ਪਈ, ਪੂਰਾ ਪ੍ਰਭਾਵ ਪਾਂਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y en Su Presencia resuena la Melodía Divina de Éxtasis."