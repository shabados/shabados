type = "primary"
data = "ਯਾ ਮੈ ਕਛੂ ਭੇਦ ਨਹੀ ਮਾਨੋ ॥੭੨੦॥"
page = 752

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Utter the word “Bhoomi” and then add the word “Jaa”, comprehend the names of Tupak in this way and do not consider any difference in it.720."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਵਿਚ ਰਤਾ ਜਿੰਨਾ ਭੇਦ ਨਾ ਸਮਝੋ ॥੭੨੦॥"