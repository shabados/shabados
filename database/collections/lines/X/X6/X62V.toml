data = "ਛੁਰਾ ਭਏ ਤਿਹ ਕਾਟਿ ਗਿਰਾਵੈ ॥੨॥"
page = 989

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And if some enemy shot an arrow on him, he would cut him with a dagger.(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਸ ਨੂੰ ਛੁਰੇ ਨਾਲ ਕਟ ਕੇ ਸੁਟ ਦਿੰਦਾ ॥੨॥"