[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧ ਜਨਾ ਕੈ ਸੰਗਿ; ਭਵਜਲੁ ਬਿਖਮੁ ਤਰਿ ॥"
page = 519
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Joining the society of holymen, cross thou the difficult and dreadful world-ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨੇਕ ਪੁਰਸ਼ਾਂ ਦੀ ਸੰਗਤ ਨਾਲ ਜੁੜ ਕੇ, ਤੂੰ ਬਿਖੜੇ ਤੇ ਭਿਆਨਕ ਸੰਸਾਰ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਹੋ ਜਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Joining the Saadh Sangat, the Company of the Holy, you shall cross over the terrifying and difficult world-ocean."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਸਾਧ ਜਨੋਂ ਕਾ ਸੰਗ ਕਰ ਕੇ (ਬਿਖਮੁ) ਕਠਨ ਭੌਜਲ ਸੇ ਤਰ ਜਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾਂ ਦੀ ਸੰਗਤ ਵਿਚ ਇਹ ਔਖਾ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤਰ ਜਾਈਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਖਮੁ = ਔਖਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uniéndote a la Sociedad de los Santos, cruza el horrible mar de la existencia;"