[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੰਡੀ ਰਾਕਸਿ ਖਾਣੀ; ਵਾਹੀ ਦੈਤ ਨੂੰ ॥"
page = 122

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She struck the demon with that Chandi, the devourer of demons (that is the sword)."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਚੰਡੀ ਨੇ ਰਾਖਸ਼ਾਂ ਦਾ ਨਾਸ਼ ਕਰਨ ਵਾਲੀ (ਤਲਵਾਰ) ਦੈਂਤ ਉਤੇ ਚਲਾਈ।"