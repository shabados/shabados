data = "ਦੁਸਟ ਅਰਿਸਟ ਟਰੇਂ ਤਤਕਾਲਾ ॥੩੯੮॥"
page = 1387

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Their enemies and troubles come to and end instantly.398."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ) ਦੁਸ਼ਟ ਅਤੇ ਵਿਘਨ ਉਸੇ ਵੇਲੇ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ ॥੩੯੮॥"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਦੁਸਟ ਅਰਿਸਟ; ਟਰੈਂ ਤਤਕਾਲਾ ॥੨੨॥"