[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਿਚਿ ਕਾਇਆ ਨਗਰ; ਲਧਾ ਹਰਿ ਭਾਲੀ ॥੩॥"
page = 1134
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Searching Within the township of the body I have found out my God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਰੀਰ ਦੇ ਸ਼ਹਿਰ ਦੇ ਅੰਦਰ ਖੋਜ ਭਾਲ ਕਰਨ ਦੁਆਰਾ ਮੈਂ ਆਪਣੇ ਵਾਹਿਗੁਰੂ ਨੂੰ ਲੱਭ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Searching within the body-village, I have found the Lord. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰੀਰ ਰੂਪੀ ਨਗਰ ਕੇ ਬੀਚ ਹੀ, ਹੇ ਹਰੀ! ਤੇਰੇ ਕੋ (ਭਾਲੀ) ਢੂੰਢ ਕੇ (ਲਧਾ) ਲਭ ਲੀਆ ਵਾ ਪਾ ਲੀਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਸਹਾਇਤਾ ਨਾਲ) ਉਸ ਨੇ ਪਰਮਾਤਮਾ ਨੂੰ ਆਪਣੇ ਸਰੀਰ-ਨਗਰ ਦੇ ਅੰਦਰ ਹੀ ਭਾਲ ਕੇ ਲੱਭ ਲਿਆ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਇਆ = ਸਰੀਰ। ਭਾਲੀ = ਭਾਲਿ, ਭਾਲ ਕੇ, ਖੋਜ ਕੇ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y en el interior del pueblo del cuerpo, encuentra a su Dios Invisible. (3)"