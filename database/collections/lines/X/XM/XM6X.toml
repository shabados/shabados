[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਹਿਨਿਸਿ; ਅੰਤਰਿ ਰਹੈ ਧਿਆਨਿ ॥"
page = 953
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day, he remains absorbed in hearty meditation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਦਿਨ ਉਹ ਦਿਲੀ ਸਿਮਰਨ ਅੰਦਰ ਲੀਨ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, he remains in deep inner meditation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਰਾਤ ਪ੍ਰਮਾਤਮਾ ਕੇ ਧਿਆਨ ਮੇਂ ਰਹੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਦਿਨ ਰਾਤ ਆਪਣੇ ਅੰਦਰ ਹੀ (ਭਾਵ, ਹਿਰਦੇ ਵਿਚ ਹੀ) ਪ੍ਰਭੂ ਦੀ ਯਾਦ ਵਿਚ ਜੁੜਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਹਿ = ਦਿਨ। ਨਿਸਿ = ਰਾਤ। ਧਿਆਨਿ = ਧਿਆਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "al vivir en constante Meditación en su ser interior;"