[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਡਾ ਆਪਿ, ਵਡੀ ਵਡਿਆਈ ॥੧੬॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He is great and His grandeur is also great"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਆਪ ਭੀ ਵੱਡਾ ਹੈ (ਤੇ ਉਸਦੀ) ਸ਼ੋਭਾ ਦਾ ਭੀ ਅੰਤ ਨਹੀਂ ਹੈ।"