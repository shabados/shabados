[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੜ੍ਹੀਅਲੁ ਮਥਰਾ ਦਾਸੁ ਹੈ; ਸਪਰਵਾਰਾ ਲਾਲ ਗੁਲਾਲਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Bhai Garhial and Mathara Das and their families are said to have been dyed in the red colour of love for the Guru."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੜੀਅਲ ਸੰਗ੍ਯਕਿ ਮਥਰਾਦਾਸ ਸਣੇ ਕੋੜਮੇ ਗੂੜੇ ਰੰਗ ਵਾਲਾ ਸੀ, (ਭਾਵ ਅੰਦਰੋਂ ਬਾਹਰੋਂ ਪ੍ਰੇਮੀ)।"