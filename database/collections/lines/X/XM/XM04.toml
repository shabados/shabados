data = "ਸਭ ਸ੍ਰੀ ਨਾਮ ਤੁਪਕ ਕੇ ਜਾਨਹੁ ॥੯੦੫॥"
page = 769

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Vaarigrahanani”, then add the words “Jaachar-nayak-shatru” and know all the names of Tupak.905."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਤੁਪਕ ਦਾ ਨਾਮ ਕਰ ਕੇ ਜਾਣੋ ॥੯੦੫॥"