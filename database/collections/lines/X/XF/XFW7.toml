[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਨਾਮੁ; ਮਾਗੁ ਨਿਧਾਨੁ ॥"
page = 895
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ask for the treasure of God's Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦੇ ਖਜਾਨੇ ਦੀ ਜਾਚਨਾ ਕਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Ask for the treasure of the Name of the Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕਾ ਨਾਮ ਜੋ ਨਿਧੋਂ ਕਾ ਘਰ ਹੈ ਤਿਸ ਕੋ ਗੁਰੋਂ ਸੇ ਮਾਗੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੇ ਦਰ ਤੋਂ ਹੀ) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਖ਼ਜ਼ਾਨਾ ਮੰਗਿਆ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਗੁ = ਮੰਗ। ਨਿਧਾਨੁ = ਖ਼ਜ਼ਾਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pide por el Nombre del Señor,"