[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਕੀ ਮੈਲੁ; ਨ ਤਨ ਤੇ ਜਾਤਿ ॥"
page = 265
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "but filth of the heart departs no from his body."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰ ਦਿਲ ਦੀ ਮਲੀਨਤਾ ਉਸ ਦੇ ਸਰੀਰ ਤੋਂ ਦੂਰ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but the filth of your mind shall not leave your body."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੌ ਭੀ ਮਨ ਕੀ ਪਾਪ ਰੂਪ ਮੈਲ ਇਸ ਜੀਵ ਕੇ ਤਨ ਕੇ ਧੋਣੇ ਸੇ ਨਹੀਂ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਫੇਰ ਭੀ) ਮਨ ਦੀ ਮੈਲ ਸਰੀਰ ਧੋਤਿਆਂ ਨਹੀਂ ਜਾਂਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਨ ਤੇ = ਸਰੀਰ ਤੋਂ, ਸਰੀਰ ਧੋਤਿਆਂ। ਨ ਜਾਤਿ = ਨਹੀਂ ਜਾਂਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aún así permanecerían las impurezas en tu mente."