[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤ੍ਰੈ ਗੁਣ ਮੇਟੇ; ਚਉਥੈ ਚਿਤੁ ਲਾਇਆ ॥"
page = 231
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "wherewith the three moods are effaced and man's mind is attached with the fourth one."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨਾਲ ਤਿੰਨ ਅਵਸਥਾਵਾਂ ਅਲੋਪ ਹੋ ਗਈਆਂ ਹਨ, ਅਤੇ ਬੰਦੇ ਦਾ ਮਨ ਚੌਥੀ ਨਾਲ ਜੁੜ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "it eradicates the three qualities, and attunes the consciousness to the fourth state."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨੋਂ ਨੇ ਤੀਨੋਂ ਗੁਣ ਦੂਰ ਕਰ ਕੇ ਸਾਖੀ ਮੇਂ ਚਿੱਤ ਲਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਆਪਣੇ ਅੰਦਰੋਂ ਮਾਇਆ ਦੇ) ਤਿੰਨਾਂ ਗੁਣਾਂ ਦਾ ਪ੍ਰਭਾਵ ਮਿਟਾ ਲਿਆ ਹੈ, ਉਸ ਨੇ ਆਪਣਾ ਮਨ ਉਸ ਆਤਮਕ ਅਵਸਥਾ ਵਿਚ ਟਿਕਾ ਲਿਆ ਹੈ ਜਿੱਥੇ ਮਾਇਆ ਦੇ ਤਿੰਨ ਗੁਣ ਆਪਣਾ ਅਸਰ ਨਹੀਂ ਪਾ ਸਕਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਉਥੈ = ਚੌਥੇ ਦਰਜੇ ਵਿਚ, ਉਸ ਅਵਸਥਾ ਵਿਚ ਜਿਥੇ ਮਾਇਆ ਦੇ ਤਿੰਨ ਗੁਣ ਆਪਣਾ ਅਸਰ ਨਹੀਂ ਪਾ ਸਕਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a través de la Cuál, uno se sobrepone a las tres cualidades y llega al Cuarto Estado de Éxtasis."