[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਨਹੁ ਸੋਕ ਕੋ ਧਾਮ ਹੁਤੋ; ਦ੍ਰੁਮ ਠਉਰ ਰਹੇ ਸੁ ਤਹਾ ਮੁਰਝਾਈ ॥"
page = 386

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the Braja appeared to him as the abode of sorrow, there the trees and plants had withered with grief"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇੰਜ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ) ਮਾਨੋ (ਉਥੇ) ਸੋਗ ਦਾ ਘਰ ਬਣਿਆ ਹੋਇਆ ਹੋਵੇ (ਕਿਉਂਕਿ) ਉਸ ਥਾਂ ਦੇ ਬ੍ਰਿਛ ਵੀ ਮੁਰਝਾ ਰਹੇ ਹਨ।"