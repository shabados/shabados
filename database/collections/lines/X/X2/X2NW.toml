[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਰਕਿ; ਨ ਸੇਈ ਪਾਈਐ ॥"
page = 132
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who meditate on the Master, are not thrown into the hell."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਦੋਜ਼ਕ ਵਿੱਚ ਨਹੀਂ ਪਾਏ ਜਾਂਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "shall not be thrown down into hell."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪੁਰਸ਼ ਨਰਕ ਮੇਂ ਨਹੀਂ ਪਾਈਤੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਨੂੰ ਨਰਕ ਵਿਚ ਨਹੀਂ ਪਾਇਆ ਜਾਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਰਕਿ = ਨਰਕ ਵਿਚ। ਸੇਈ = ਉਹਨਾਂ ਨੂੰ। ਪਾਈਐ = ਪਾਇਆ ਜਾਂਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no son arrojados a la oscuridad de su conciencia;"