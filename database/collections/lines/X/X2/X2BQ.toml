[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕਰਹੁ ਸਾਧੂ ਧੂਰਿ ॥"
page = 837
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, make me the dust of the feet of the saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਮੈਨੂੰ ਸੰਤਾਂ ਦੇ ਪੈਰਾਂ ਦੀ ਧੂੜ ਬਣਾ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O God, make me the dust of the feet of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਹਮ ਕੋ ਅਪਨੇ ਸੰਤ ਜਨੋਂ ਕੀ ਧੂੜੀ ਪ੍ਰਾਪਤ ਕਰੋ ਵਾ ਚਰਨਾਂ ਕਾ ਦਾਸ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ (ਆਪਣੇ) ਸੰਤ ਜਨਾਂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ਬਣਾਈ ਰੱਖ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਸਾਧੂ ਧੂਰਿ = ਸੰਤ ਜਨਾਂ ਦੀ ਧੂੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, permíteme ser el Polvo debajo de los Pies de los Santos;"