data = "ਦੋਊ ਜੂਝਿ ਖੇਤ ਮੈ ਪਰੀ ॥੧੯॥"
page = 982

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Throwing them away they fought with the daggers and both sacrificed their lives.(19)"

