[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਪਰਮਲੁ; ਹਿਰਦੈ ਰਹਿਆ ਸਮਾਇ ॥੩॥"
page = 560
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Name's fragrance abides within my mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੀ ਸੁਗੰਧਤਾ ਮੇਰੇ ਮਨ ਅੰਦਰ ਰਮੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The fragrance of the Naam permeates my heart. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਰੂਪੀ (ਪਰਮਲੁ) ਚੰਦਨੁ ਹਿਰਦ੍ਯ ਮੇਂ ਸਮਾਇ ਰਹਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੁਗੰਧੀ ਦੇਣ ਵਾਲਾ ਹਰਿ-ਨਾਮ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਸਦਾ ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਮਲੁ = {परिमल} ਸੁਗੰਧੀ, ਸੁਗੰਧੀ ਦੇਣ ਵਾਲਾ ਪਦਾਰਥ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "fragante como el Sándalo, habita en el corazón. (3)"