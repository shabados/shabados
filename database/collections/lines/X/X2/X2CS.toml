[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਹਾ ਭਗਤਿ; ਚੂਕੈ ਅਭਿਮਾਨੁ ॥"
page = 424
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With this worship one's ego is stilled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਉਪਾਸ਼ਨਾ ਨਾਲ ਆਦਮੀ ਦਾ ਅੰਹਕਾਰ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By this devotional worship, egotism is eliminated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹੀ ਬਡੀ ਭਗਤੀ ਹੈ ਅਰ ਇਸੀ ਸੇ ਅਭਿਮਾਨ ਨਿਬ੍ਰਿਤ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਹੀ ਹੈ ਜਿਸ ਨਾਲ ਮਨ ਵਿਚੋਂ ਅਹੰਕਾਰ ਦੂਰ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੂਕੈ = ਮੁੱਕਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y en la Verdadera Alabanza dejarás a un lado tu ego."