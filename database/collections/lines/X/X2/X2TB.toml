[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਨ ਤੇ ਕਹੁ; ਕਵਨੈ ਸੁਖੁ ਪਾਇਆ ॥੩॥"
page = 692
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "from these, say, who has ever obtained peace?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਏਨ੍ਹਾਂ ਕੋਲੋਂ ਦੱਸ, ਕਦੋਂ ਕਿਸੇ ਨੇ ਆਰਾਮ ਪ੍ਰਾਪਤ ਕੀਤਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- who has ever obtained peace from these? ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਜਨ ਕਹੋ ਤੌ! ਇਨ ਤੇ ਕਿਸ ਨੇ ਸੁਖ ਪਾਯਾ ਹੈ ਅਰਥਾਤ ਕਿਸੀ ਨੇ ਨਹੀਂ ਪਾਇਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦੱਸ, (ਹੇ ਭਾਈ!) ਇਹਨਾਂ ਤੋਂ ਭੀ ਕਿਸੇ ਨੇ ਕਦੇ ਸੁਖ ਲੱਭਾ ਹੈ? ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹੁ = ਦੱਸ। ਕਵਨੈ = ਕਿਸ ਨੇ? ਤੇ = ਤੋਂ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues nadie ha obtenido Paz a través de ellos. (3)"