[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੀ ਸੋਇ ਸੁਣੀ; ਮਨੁ ਜੀਵੈ ॥"
page = 1078
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hearing of whose sublimity, the soul lives,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਸੋਭਾ ਸੁਣ ਕੇ ਜਿੰਦੜੀ ਜਿਉਂਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Hearing of Him, the mind comes to life."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਸੋਭਾ ਸੁਣ ਕੇ ਮਨ ਜੀਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਗੁਰੂ) ਦੀ ਸੋਭਾ ਸੁਣ ਕੇ ਮਨ ਆਤਮਕ ਜੀਵਨ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੀ = ਜਿਸ (ਗੁਰੂ) ਦੀ। ਸੋਇ = ਸੋਭਾ। ਸੁਣੀ = ਸੁਣਿ, ਸੁਣ ਕੇ। ਜੀਵੈ = ਆਤਮਕ ਜੀਵਨ ਹਾਸਲ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escuchándolo la mente de uno vive,"