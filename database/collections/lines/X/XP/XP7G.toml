[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਤਨੁ ਅਰਪਿ ਰਖਉ ਸਭੁ ਆਗੈ; ਗੁਰ ਚਰਣੀ ਚਿਤੁ ਲਾਈ ॥"
page = 1265
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Dedicating my soul and body, I place them all before the Guru, and fix my mind with his feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਜਿੰਦੜੀ ਅਤੇ ਦੇਹ ਨੂੰ ਸਮਰਪਣ ਕਰ, ਮੈਂ ਉਨ੍ਹਾਂ ਸਾਰਿਆਂ ਨੂੰ ਗੁਰਾਂ ਮੂਹਰੇ ਟਿਕਾ ਦਿੰਦਾ ਹਾਂ ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ ਪੈਰਾਂ ਨਾਲ ਆਪਣੇ ਮਨ ਨੂੰ ਜੋੜਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have dedicated my mind and body to Him, and placed everything before Him in offering. I focus my consciousness on His Feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਸਤਿਗੁਰੋਂ ਕੇ ਆਗੇ ਤਨ ਅਰ ਮਨ ਸਭ ਅਰਪਣ ਕਰ ਰਖੋਂ ਔਰ ਗੁਰੋਂ ਕੇ ਚਰਨੋਂ ਮੇਂ ਚਿਤ ਕੋ ਲਗਾਇ ਰਖੋ, ਅਰ ਐਸੇ ਬੇਨਤੀ ਕਰਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣਾ ਮਨ ਆਪਣਾ ਤਨ ਸਭ ਕੁਝ ਗੁਰੂ ਦੇ ਅੱਗੇ ਭੇਟਾ ਰੱਖਦਾ ਹਾਂ, ਮੈਂ ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਵਿਚ ਆਪਣਾ ਚਿੱਤ ਜੋੜੀ ਰੱਖਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਰਪਿ = ਭੇਟਾ ਕਰ ਕੇ। ਰਖਉ = ਰਖਉਂ, ਮੈਂ ਰੱਖਦਾ ਹਾਂ। ਲਾਈ = ਲਾਈਂ, ਮੈਂ ਲਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es dedicada mi mente y mi cuerpo a Él. Le he ofrecido todo a Él y postro mi Conciencia ante Él."