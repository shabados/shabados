data = "ਬਨਿਜ਼ਦਸ਼ ਜ਼ੁਬਾ ਰਾ ਬ ਫ਼ੁਰਸਤ ਕਸੂਦ ॥੨੯॥"
page = 1414

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Opened her mouth, and narrated (her story) very gently.(29)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਫਿਰ) ਕੋਲ ਬੈਠ ਕੇ ਧੀਰਜ ਨਾਲ ਜ਼ਬਾਨ ਨੂੰ ਖੋਲ੍ਹਿਆ ॥੨੯॥"