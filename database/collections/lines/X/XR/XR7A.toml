[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ; ਜਉ ਸਤਿਗੁਰੁ ਮਿਲਿਓ ॥"
page = 235
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By His grace, when the True Guru meets,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਸਦੀ ਦਇਆ ਦੁਆਰਾ ਸੱਚੇ ਗੁਰੂ ਜੀ ਮਿਲ ਪੈਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When, by His Grace, the True Guru is met,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਕਿਰਪਾ ਕਰ ਕੇ ਸਤਿਗੁਰੂ ਮਿਲਿਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ (ਕਿਸੇ ਮਨੁੱਖ ਨੂੰ) ਗੁਰੂ ਮਿਹਰ ਕਰ ਕੇ ਮਿਲ ਪੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਉ = ਜਦੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando uno encuentra a su Verdadero Guru,"