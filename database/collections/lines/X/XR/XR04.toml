[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਮ ਜਨਮ ਕੇ; ਬਿਛੁਰੇ ਮੇਲੇ ॥੧॥ ਰਹਾਉ ॥"
page = 191
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Separated since many births, we have been united with the Lord. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਜਨਮਾ ਦੇ ਵਿਛੁੜਿਆਂ ਹੋਇਆ ਨੂੰ ਸਾਹਿਬ ਨਾਲ ਮਿਲਾ ਦਿਤਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Separated from Him for countless incarnations, we are now reunited with Him. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਹਰੀ ਨੈ ਜਨਮ ਜਨਮਾਂਤ੍ਰੋਂ ਕੇ ਬਿਛਰੇ ਹੂਏ ਮਿਲਾਇ ਲੀਏ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਨੂੰ ਅਨੇਕਾਂ ਜਨਮਾਂ ਦੇ ਵਿੱਛੁੜਿਆਂ ਨੂੰ ਪਰਮਾਤਮਾ (ਆਪਣੇ ਨਾਲ) ਮਿਲਾ ਲੈਂਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "después de tanto tiempo de separación.(1-Pausa)"