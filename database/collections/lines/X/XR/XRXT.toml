[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਧੁਜ ਪ੍ਰਮਾਣ ਬੀਜੁਰੀ; ਭੁਜਾ ਭਾਰੀ ਜਿਹ ਰਾਜਤ ॥"
page = 695

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He, who is long like the banner and whose arm is like lighting"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਬਿਜਲੀ ਜਿਹੀ ਧੁਜਾ ਹੈ ਅਤੇ ਭਾਰੀ ਭੁਜਾਵਾਂ ਸ਼ੋਭਦੀਆਂ ਹਨ।"