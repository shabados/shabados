[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਰਨੈ ਬਲਿਹਾਰਨੈ; ਲਖ ਬਰੀਆ ॥"
page = 211
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am devoted and a sacrifice, lacs of times unto my Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਸੁਆਮੀ ਉਤੋਂ ਲਖੂਖਾਂ ਵਾਰੀ ਸਦਕੇ ਤੇ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice, dedicated hundreds of thousands of times, to my Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਲਾਖੋਂ ਬਾਰੀ ਮਨ ਤਨ ਕਰ ਬਲਿਹਾਰੇ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੈਂ (ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਤੋਂ) ਲੱਖਾਂ ਵਾਰੀ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ, ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਰਨੈ = ਵਾਰਨੇ, ਸਦਕੇ। ਬਰੀਆ = ਵਾਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi ser en sacrificio a Ti un millón de veces, porque Tu Nombre, oh Maestro,"