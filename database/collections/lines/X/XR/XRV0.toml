[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਾ ਬਿਧਿ; ਕੀਨੋ ਬਿਸਥਾਰੁ ॥"
page = 284
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He has extended Himself in myriads of ways,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਣਗਿਣਤ ਢੰਗਾ ਨਾਲ ਪਸਾਰਿਆ ਹੋਇਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In so many ways, He has extended Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੇਕ ਭਾਂਤੋਂ ਕਰ ਕੇ ਤਿਸ ਨੇ ਬਿਸਥਾਰ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਜਗਤ ਦਾ ਪਸਾਰਾ ਕਈ ਤਰੀਕਿਆਂ ਨਾਲ ਕੀਤਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਾ ਬਿਧਿ = ਕਈ ਤਰੀਕਿਆਂ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él esparce Su Ser de mil maneras."