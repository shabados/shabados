[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਜੀਆਂ ਕਾ; ਜਾਨੈ ਭੇਉ ॥"
page = 863
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He knows the secrets of all the beings,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਜੀਵਾਂ ਦੇ ਭੇਤਾਂ ਨੂੰ ਜਾਣਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He knows the secrets of all beings;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਜੀਵੋਂ ਕਾ ਜੋ ਭੇਤ ਜਾਨਤਾ ਹੈ, ਭਾਵ ਸੇ ਜੋ ਸਭ ਕਾ ਅੰਤਰਜਾਮੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਦੇ ਅੰਦਰ ਉਸ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਆਸਰਾ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ ਜੋ ਸਾਰੇ ਜੀਵਾਂ (ਦੇ ਦਿਲ) ਦਾ ਭੇਤ ਜਾਣਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੇਉ = ਭੇਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor conoce el estado íntimo de cada Alma"