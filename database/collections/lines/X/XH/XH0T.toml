[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮ ਬਿਨਾ; ਕੈਸੇ ਆਚਾਰ ॥੧॥"
page = 1330
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the name, how can there be good conduct?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੇ ਬਾਝੋਂ ਚੰਗਾ ਚਾਲ ਚਲਨ ਕਿਸ ਤਰ੍ਹਾਂ ਹੋ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Naam, the Name of the Lord, how can I maintain good conduct? ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਨਾਮ ਕੇ ਜਪੇ ਸੇ ਬਿਨਾਂ ਕਿਸ ਪਰਕਾਰ ਸੁਭ ਅਚਾਰ ਪ੍ਰਾਪਤਿ ਹੋਵੈ? ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਭਾਈਚਾਰਕ ਰਸਮਾਂ ਕਿਸੇ ਅਰਥ ਨਹੀਂ ਜੋ ਤੇਰਾ ਨਾਮ ਸਿਮਰਨ ਤੋਂ ਵਿਛੋੜਦੀਆਂ ਹਨ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਚਾਰ = ਭਾਈਚਾਰਕ ਰਸਮਾਂ। ਕੈਸੇ = ਕਿਸੇ ਕੰਮ ਨਹੀਂ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues sin el Naam, el Nombre del Señor ¿cómo podría mantener una buena conducta? (1)"