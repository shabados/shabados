[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ. ਜਮ ਕਾ ਪੰਥੁ ਮਿਟਾਇਆ ॥"
page = 623
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who has obliterated the Death's courier path."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੇ ਮੌਤ ਦੇ ਦੂਤ ਦੇ ਮਾਰਗ ਨੂੰ ਨਾਸ ਕਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "who obliterated the path of the Messenger of Death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਸਤਿਗੁਰੋਂ ਨੇ ਜਮ ਕਾ ਰਸਤਾ ਹੀ ਮਿਟਾਇ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਗੁਰੂ) ਨੇ (ਉਹਨਾਂ ਵਾਸਤੇ) ਜਮ ਦੇ ਦੇਸ ਨੂੰ ਲੈ ਜਾਣ ਵਾਲਾ ਰਸਤਾ ਮਿਟਾ ਦਿੱਤਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਗੁਰੂ) ਨੇ। ਪੰਥੁ = ਰਸਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quién destruyó al mensajero de la muerte"