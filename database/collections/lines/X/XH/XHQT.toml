[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤ੍ਰਿਯ ਜਾਨ︀ਯੋ ਸੋਯੋ ਨ੍ਰਿਪਤਿ ਗਈ ਜਾਰਿ ਪਹਿ ਧਾਇ ॥"
page = 852

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Deeming the Raja to be in deep sleep, she ran and reached her lover,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸਤਰੀ ਨੇ ਰਾਜੇ ਨੂੰ ਸੁੱਤਾ ਹੋਇਆ ਜਾਣ ਕੇ (ਤੁਰਤ) ਯਾਰ ਕੋਲ ਚਲੀ ਗਈ।"