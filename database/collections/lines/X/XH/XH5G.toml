[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਕਿਛੁ; ਜੀਵਤ ਕੋ ਬਿਵਹਾਰ ॥"
page = 536
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All thine worldly affairs are only for life."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਸਾਰੇ ਸੰਸਾਰੀ ਕਾਰ ਵਿਹਾਰ ਜੀਉਦਿਆਂ ਤੋੜੀ ਹੀ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All things are mere diversions of life:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰ ਮੇਂ ਸਭ ਕਿਛੁ ਬਿਵਹਾਰ ਜੀਵਣੇ ਤਕ ਕਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਭ ਕੁਝ ਜਿਊਂਦਿਆਂ ਦਾ ਹੀ ਮੇਲ-ਜੋਲ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭ ਕਿਛੁ = ਸਾਰਾ। ਬਿਵਹਾਰ = ਵਰਤਣ-ਵਿਹਾਰ। ਕੋ = ਦਾ। ਜੀਵਤ ਕੋ = ਜਿਊਂਦਿਆਂ ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tu madre, padre, hermanos, hijos, esposa y"