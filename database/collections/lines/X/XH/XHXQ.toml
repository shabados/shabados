[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕਾ ਦਰਸਨੁ ਦੇਖਿ ਨਿਹਾਲ ॥"
page = 897
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Seeing the Guru's sight, one is filled with bliss."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦਾ ਦੀਦਾਰ ਵੇਖ ਕੇ ਬੰਦਾ ਪਰਮ ਪ੍ਰਸੰਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Gazing upon the Blessed Vision of the Guru's Darshan, I am enraptured."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਗੁਰੋਂ ਕਾ ਦਰਸਨ ਦੇਖ ਕੇ ਨਿਹਾਲੁ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦਾ ਦਰਸ਼ਨ ਕਰ ਕੇ ਉਹ ਸਦਾ ਚੜ੍ਹਦੀ ਕਲਾ ਵਿਚ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਖਿ = ਵੇਖ ਕੇ। ਨਿਹਾਲ = ਪ੍ਰਸੰਨ, ਚੜ੍ਹਦੀ ਕਲਾ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es así bendecido con la Visión del Guru;"