[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰਾ ਮਨੁ; ਲਾਗਾ ਹੈ ਰਾਮ ਪਿਆਰੇ ॥"
page = 670
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My soul is attached to my beloved Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਜਿੰਦੜੀ, ਮੇਰੇ ਪ੍ਰੀਤਮ ਪ੍ਰਭੂ ਨਾਲ ਜੁੜੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind is attached to my Beloved Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਮ ਪਿਆਰੇ! ਮੇਰਾ ਮਨ ਤੇਰੇ ਸਰੂਪ ਮੇਂ ਲਗ ਰਹਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੇਰਾ ਮਨ ਪਿਆਰੇ ਪਰਮਾਤਮਾ (ਦੇ ਨਾਮ) ਨਾਲ ਗਿੱਝ ਗਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi mente está entonada en mi amado Señor,"