[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਿ ਤਰਹਿ; ਸਗਲੇ ਕੁਲ ਤਾਰੇ ॥"
page = 117
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They save themselves and save their entire lineage as wall."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਊਹ ਖੁਦ ਪਾਰ ਉਤਰ ਜਾਂਦੇ ਹਨ ਅਤੇ ਆਪਣੀ ਸਾਰੀ ਵੰਸ਼ ਨੂੰ ਭੀ ਤਾਰ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They save themselves, and save all their ancestors as well."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਆਪ ਸੰਸਾਰ ਸੇ ਤਰੇ ਹੈਂ ਔਰੁ ਪੂਰਨ ਕੁਲ ਕੇ ਲੋਗ ਤਾਰ ਲੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੀਆਂ ਸਾਰੀਆਂ ਕੁਲਾਂ ਨੂੰ ਤਾਰ ਕੇ ਆਪ (ਭੀ) ਤਰ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾਰੇ = ਤਾਰਿ, ਤਾਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ellos mismos sirven al Señor y así salvan a toda su familia."