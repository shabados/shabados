[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਸਮੈ ਜਸੁਧਾ ਸੰਗਿ ਗੋਪਿਨ; ਖੀਰ ਮਥੇ ਕਰਿ ਲੈ ਕੈ ਮਧਾਨੀ ॥"
page = 304

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Once Yashoda was churning the curd alongwith the gopis"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਵਾਰ ਜਸੋਧਾ ਗੋਪੀਆਂ ਨਾਲ (ਰਲ ਕੇ) ਹੱਥ ਵਿਚ ਮਧਾਣੀ ਲੈ ਕੇ ਦਹੀ ਰਿੜਕਣ ਲਗੀ।"