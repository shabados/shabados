[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਲ ਘਾਤਨੀ; ਕਪਟਹਿ ਭਰੀ ॥"
page = 874
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who was the destroyer of children and full of deceit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਬੱਚਿਆਂ ਨੂੰ ਮਾਰਨ ਵਾਲੀ ਅਤੇ ਛਲਕਪਟ ਭਰੀ ਸੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "even though she was a deceitful child-killer."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਬਾਲਕੋਂ ਕੇ ਘਾਤ ਕਰਨਹਾਰੀ ਔ ਕਪਟ ਸੇ ਭਰੀ ਹੂਈ ਥੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬਾਲਾਂ ਨੂੰ ਮਾਰਨ ਵਾਲੀ ਅਤੇ ਕਪਟ ਨਾਲ ਭਰੀ ਹੋਈ (ਉਸ ਪੂਤਨਾ ਦਾ ਉਧਾਰ ਹੋ ਗਿਆ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਾਤਨੀ = ਮਾਰਨ ਵਾਲੀ। ਕਪਟ = ਧੋਖਾ, ਫ਼ਰੇਬ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "esa viciosa que quería envenenar a Krishna de niño."