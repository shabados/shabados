[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੁਹਿ ਜਦੁਪਤਿ ਕੈਸੇ ਮਿਲੇ, ਕਹਾ ਦਯੋ ਬਰ ਤੋਹਿ ॥੩੧॥"
page = 841

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘How did you meet Krishna, and what boons did he endow.’(31)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੁਹਾਨੂੰ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਕਿਸ ਤਰ੍ਹਾਂ ਮਿਲੇ ਅਤੇ ਤੁਹਾਨੂੰ ਕੀ ਵਰ ਦਿੱਤਾ ॥੩੧॥"