[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਖਗ ਮ੍ਰਿਗ ਜਛ ਭੁਜੰਗ; ਅਸੁਰ ਸੁਰ ਨਰ ਮੁਨਿ ਮੋਹੈ ॥"
page = 996

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Animals, birds, Jachh, Bhujang, the gods, the evils, men, women and sages, all became fond of him."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪੰਛੀਆਂ, ਪਸ਼ੂਆਂ, ਯਕਸ਼ਾਂ, ਭੁਜੰਗਾਂ, ਦੈਂਤਾਂ, ਦੇਵਤਿਆਂ, ਮਨੁੱਖਾਂ ਅਤੇ ਮੁਨੀਆਂ (ਦੇ ਮਨ) ਨੂੰ ਮੋਹੰਦਾ ਹੈ।"