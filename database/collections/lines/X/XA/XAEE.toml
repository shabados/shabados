[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅੰਤ ਕਾਲ ਜੋ ਹੋਇ ਸਹਾਈ ॥"
page = 59

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O Brother! Why do you not meditate on Him, who will help you at the time of death?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਅੰਤ-ਕਾਲ ਸਹਾਇਕ ਹੁੰਦਾ ਹੈ।"