[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਡਹੁ ਵਡਾ ਵਡ ਮੇਦਨੀ; ਸਿਰੇ ਸਿਰਿ ਧੰਧੈ ਲਾਇਦਾ ॥"
page = 472
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is the greatest of the great and great is His world. He puts every one to work."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਵਿਸ਼ਾਲਾਂ ਦਾ ਪਰਮ ਵਿਸ਼ਾਲ ਹੈ, ਅਤੇ ਵਿਸ਼ਾਲ ਹੈ ਉਸ ਦਾ ਸੰਸਾਰ। ਉਹ ਹਰ ਇਕਸ ਨੂੰ ਕੰਮ ਕਾਜ ਲਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is the greatest of the great; great is His world. He enjoins all to their tasks."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਬ੍ਰਹਮਾਦ ਵਡੋਂ ਤੇ ਭੀ ਵੱਡਾ ਹੈ ਔ ਤਿਸ ਕੀ ਰਚੀ (ਮੇਦਨੀ) ਪ੍ਰਿਥਵੀ ਭੀ ਵੱਡੀ ਹੈ। (ਸਿਰੇ ਸਿਰਿ) ਭਿੰਨ ੨ ਵਾ ਰਚ ਰਚ ਕਰ ਕੇ ਬਿਵਹਾਰ ਮੇਂ ਲਗਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਵੱਡਿਆਂ ਤੋਂ ਵੱਡਾ ਹੈ (ਭਾਵ, ਸਭ ਤੋਂ ਵੱਡਾ ਹੈ), (ਉਸ ਦੀ ਰਚੀ ਹੋਈ) ਸ੍ਰਿਸ਼ਟੀ ਭੀ ਬੇਅੰਤ ਹੈ। (ਇਤਨੀ ਬੇਅੰਤ ਸ੍ਰਿਸ਼ਟੀ ਹੁੰਦਿਆਂ ਭੀ) ਹਰੇਕ ਜੀਵ ਨੂੰ ਪ੍ਰਭੂ ਥਾਉਂ ਥਾਈਂ ਧੰਧਿਆਂ ਵਿਚ ਜੋੜੀ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਡਹੁ ਵਡਾ = ਵੱਡਿਆਂ ਤੋਂ ਵੱਡਾ। ਮੇਦਨੀ = ਸ੍ਰਿਸ਼ਟੀ, ਧਰਤੀ। ਵਡ ਮੇਦਨੀ = ਵੱਡੀ ਹੈ ਸ੍ਰਿਸ਼ਟੀ ਉਸ ਦੀ। ਸਿਰੇ ਸਿਰਿ = ਹਰੇਕ ਜੀਵ ਦੇ ਸਿਰ ਉੱਤੇ, ਥਾਉਂ ਥਾਈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, lo más Alto de lo alto, y en la vasta tierra atrae a todos a Su Obra."