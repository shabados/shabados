[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨੇ ਦਾਸ ਕੋ; ਭਇਓ ਸਹਾਈ ॥"
page = 625
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of His slave, the Master has become a refuge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਗੋਲੇ ਦਾ ਮਾਲਕ ਪਨਾਹ ਗੁਝੀਰ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has become the help and support of His slave."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਦਾਸ ਕੋ ਤੂੰ ਐਸਾ ਸਹਾਈ ਹੂਆ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਆਪਣੇ ਸੇਵਕ ਦਾ ਮਦਦਗਾਰ ਬਣਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋ = ਦਾ। ਸਹਾਈ = ਮਦਦਗਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora el Señor es mi Único Refugio; me ha bendecido"