[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਜਨਮੁ; ਸਿਵ ਪੁਰੀ ਗਵਾਇਆ ॥"
page = 326
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All my life I wasted in the city of Shiva."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣਾ ਸਾਰਾ ਜੀਵਨ ਸ਼ਿਵਜੀ ਦੇ ਸ਼ਹਿਰ ਵਿੱਚ ਗੁਆ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I wasted my whole life in the city of Shiva;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੈਂ ਸੰਪੂਰਨ ਜਨਮੁ ਸਿਵ ਪੁਰੀ ਮੇਂ ਗਵਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਰਾਮ! ਮੈਨੂੰ ਲੋਕ ਆਖਦੇ ਹਨ-) ਤੂੰ ਸਾਰੀ ਉਮਰ ਕਾਂਸ਼ੀ ਵਿਚ ਵਿਅਰਥ ਗੁਜ਼ਾਰ ਦਿੱਤੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲ ਜਨਮੁ = ਸਾਰੀ ਉਮਰ। ਸਿਵਪੁਰੀ = ਸ਼ਿਵ ਦੀ ਨਗਰੀ ਕਾਂਸ਼ੀ ਵਿਚ। ਗਵਾਇਆ = ਵਿਅਰਥ ਗੁਜ਼ਾਰ ਦਿੱਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Desperdicié casi toda mi vida en el pueblo de Shiva,"