[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਦੀਸੈ; ਸੋ ਆਪੇ ਆਪਿ ॥"
page = 931
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever is seen that is the Lord Himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁੱਛ ਨਜ਼ਰੀ ਪੈਂਦਾ ਹੈ, ਉਹ ਸਾਹਿਬ ਖ਼ੁਦ-ਬਖ਼ੁਦ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever is seen, is the Lord Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਦੇਖਨੇ ਮੇਂ ਆਵਤਾ ਹੈ, ਸੋ ਆਪ ਹੀ ਆਪ ਪਰਮੇਸ੍ਵਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਝ (ਜਗਤ ਵਿਚ) ਦਿੱਸ ਰਿਹਾ ਹੈ ਉਹ ਗੋਪਾਲ ਆਪ ਹੀ ਆਪ ਹੈ (ਭਾਵ, ਉਸ ਗੋਪਾਲ ਦਾ ਹੀ ਸਰੂਪ ਹੈ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, Él es el Creador de todo y todo lo que es, es establecido por Él solamente."