data = "(ਤਦ ਆਪਣੇ) ਨੇੜੇ ਜੋ ਕਰੜੇ ਸੂਰਮੇ ਸਨ, ਉਨ੍ਹਾਂ ਪ੍ਰਤਿ ਕਹਿਣ ਲਗਾ ॥੧੦੬੯॥"