data = "ਨਿਕਟਿ ਬਿਕਟਿ ਭਟ ਜੋ ਹੁਤੇ ਤਿਨ ਪ੍ਰਤਿ ਬੋਲਿਯੋ ਬੈਨ ॥੧੦੬੯॥"
page = 404

[[content]]
assets = ["DSKO"]
type = "translation"
