[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਭਾਰੋ ਸੁਆਮੀ ਮੋਰਾ ॥"
page = 625
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art my great Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰਾ ਵੱਡਾ ਮਾਲਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my Great Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹਮਾਰਾ ਭਾਰਾ ਸ੍ਵਾਮੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਮੇਰਾ ਵੱਡਾ ਮਾਲਕ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਰਾ = ਮੇਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres mi Gran Maestro, oh Señor;"