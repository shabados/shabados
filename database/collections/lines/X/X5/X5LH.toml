[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਾ ਠਾਕੁਰੁ ਤੁਹੀ ਪ੍ਰਭ; ਤਾ ਕੇ ਵਡਭਾਗਾ ॥"
page = 399
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He whose Thou art the Master, O Lord his is the great destiny."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਤੂੰ ਮਾਲਕ ਹੈ, ਹੇ ਸੁਆਮੀ ਉਸ ਦੀ ਪਰਮ ਚੰਗੀ ਕਿਸਮਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who has You as His Master, O God, is blessed with great destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜਿਸ ਕਾ ਤੂੰ ਠਾਕੁਰ ਹੈਂ ਤਿਸ ਕੇ ਬਡੇ ਭਾਗ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਆਪ ਹੀ ਜਿਸ ਮਨੁੱਖ ਦੇ ਸਿਰ ਉੱਤੇ ਮਾਲਕ ਹੈਂ ਉਸ ਦੇ ਵੱਡੇ ਭਾਗ (ਸਮਝਣੇ ਚਾਹੀਦੇ) ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕਾ = ਜਿਸ ਮਨੁੱਖ ਦਾ। ਠਾਕੁਰੁ = ਮਾਲਕ। ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਸੁਹੇਲਾ = ਸੌਖਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél de quien Tú eres el Maestro, oh Señor, es un hombre de gran Destino;"