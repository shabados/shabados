[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਸੁਣਿ ਹਰਣਾ ਕਾਲਿਆ; ਕੀ ਵਾੜੀਐ ਰਾਤਾ ਰਾਮ ॥"
page = 438
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hear thou, O black, why art thou enamoured of the orchard (of passion)?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸ੍ਰਵਣ ਕਰ, ਹੇ ਕਾਲੇ ਮਿਰਗ (ਵਿਸ਼ਿਆਂ ਦੀ) ਬਗੀਚੀ ਨਾਲ ਤੂੰ ਕਿਉਂ ਮਸਤ ਹੋਇਆ ਹੋਇਆ ਹੈਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen, O black deer: why are you so attached to the orchard of passion?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਹਰਣ ਅਰ ਭਵਰ ਮਛੀ ਔ ਨਦੀ ਨਾਲਿਓਂ ਕੇ ਰੂਪਕ ਦ੍ਵਾਰਾ ਜੀਵ ਕੋ ਵੈਰਾਗ ਮਯ ਉਪਦੇਸ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਾਲੇ ਹਰਣ! (ਹੇ ਕਾਲੇ ਹਰਣ ਵਾਂਗ ਸੰਸਾਰ-ਬਨ ਵਿਚ ਬੇ-ਪਰਵਾਹ ਹੋ ਕੇ ਚੁੰਗੀਆਂ ਮਾਰਨ ਵਾਲੇ ਮਨ!) ਤੂੰ (ਮੇਰੀ ਗੱਲ) ਸੁਣ! ਤੂੰ ਇਸ (ਜਗਤ-) ਫੁਲਵਾੜੀ ਵਿਚ ਕਿਉਂ ਮਸਤ ਹੋ ਰਿਹਾ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀ = ਕਿਉਂ? ਵਾੜੀਐ = ਫੁਲਵਾੜੀ ਵਿਚ। ਰਾਤਾ = ਮਸਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh venado negro, escucha, ¿por qué estás tan apegado a la belleza del jardín?"