data = "ਕਰੋ ਆਨਿ ਕੈ ਬੇਦ ਬਿਦ︀ਯਾ ਬਿਚਾਰੀ ॥"
page = 677

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He invited the scholars and sages from many countries far and near for consultations on Vedic learning"

[[content]]
