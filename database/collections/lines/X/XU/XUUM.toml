[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਲੀ ਗਲਾ; ਸਿਰਜਣਹਾਰ ॥"
page = 351
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The most excellent of all the talks is the talk of the Creator."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਰਤਾਰ ਦਾ ਬਚਨ ਬਿਲਾਸ, ਸਾਰਿਆਂ ਬਚਨ ਬਿਲਾਸਾਂ ਵਿਚੋਂ ਪਰਮ ਸ਼੍ਰੇਸ਼ਟ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The real words are the Words of the Creator Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਾਤੋਂ ਮੇਂ ਵਹੁ ਬਾਤ ਸ੍ਰੇਸਟ ਹੈ, ਜੋ ਹੇ (ਸਿਰਜਣਹਾਰ) ਉਤਪੰਨ ਕਰਤਾ ਅਕਾਲ ਪੁਰਖ! ਤੇਰੀ ਹੋਵਾਂ। ਮੈਂ ਗਲਾਂ ਹੀ ਗਲਾਂ ਕੇ ਰਚਨੇ, ਭਾਵ ਕਰਨੇ ਵਾਲਾ ਹਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੱਲਾਂ ਵਿਚੋਂ ਸਿਰਫ਼ ਉਹ ਗੱਲਾਂ ਹੀ ਚੰਗੀਆਂ ਹਨ ਜੋ, ਹੇ ਸਿਰਜਣਹਾਰ! ਤੇਰੀਆਂ ਗੱਲਾਂ ਹਨ (ਤੇਰੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੀਆਂ ਗੱਲਾਂ ਹਨ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਲੀ ਗਲਾ = ਗੱਲਾਂ ਵਿਚੋਂ (ਚੰਗੀਆਂ) ਗੱਲਾਂ। ਗਲਾ ਸਿਰਜਣਹਾਰ = ਸਿਰਜਣਹਾਰ ਦੀਆਂ ਗੱਲਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero las Verdaderas Palabras son aquéllas que son reveladas por el Señor Creador."