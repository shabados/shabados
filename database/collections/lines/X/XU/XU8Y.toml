[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ; ਬਚਨ ਤੁਮੑਾਰੇ ॥"
page = 406
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By thy words, O True Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਬਾਣੀ ਦੁਆਰਾ ਹੇ ਸੱਚੇ ਗੁਰੂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O True Guru, by Your Words,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਤਗੁਰੂ ਜੀ! ਆਪ ਕੇ ਬਚਨ ਕੈਸੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਤਿਗੁਰੂ! ਤੇਰੇ ਬਚਨਾਂ ਨੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰ = ਹੇ ਸਤਿਗੁਰੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Un Dios Creador del Universo, por la Gracia del Verdadero Guru"