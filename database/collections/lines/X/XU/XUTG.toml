data = "ਨਾਮ ਤੁਪਕ ਕੇ ਸਭ ਲਹਿ ਲਿਜੈ ॥੯੦੭॥"
page = 770

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Utter firstly the word “Sarasvati” and then speak the words “Jaachar-nayak-shatru” and in this way speak all the names of Tupak.907."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝੋ ॥੯੦੭॥"