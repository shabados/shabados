[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦਿਨੁ ਕੀਰਤਨੁ; ਹਰਿ ਗੁਣ ਗਾਮ ॥੧॥"
page = 807
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day chant thou the praises and glories of God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਦਿਨ ਤੂੰ ਵਾਹਿਗੁਰੂ ਦੀਆਂ ਸਿਫਤਾਂ ਅਤੇ ਬਜਰੰਗੀਆਂ ਦਾ ਗਾਇਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, sing the Kirtan of the Lord's Praises. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰੁ ਦਿਨੇ ਰਾਤਰ ਹਰੀ ਕੇ ਗੁਣੋਂ ਕਾ ਕੀਰਤਨ ਗਾਉ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਹਰ ਵੇਲੇ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਕਰਿਆ ਕਰ, ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਇਆ ਕਰ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਦਿਨੁ = ਹਰ ਰੋਜ਼। ਗਾਮ = ਗਾਵੋ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y canta siempre la Alabanza de tu Dios. (1)"