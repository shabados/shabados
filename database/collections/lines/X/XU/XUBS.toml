[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਾ ਅੰਤੁ. ਨ ਜਾਨਸਿ ਕੋਇ ॥"
page = 863
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, whose limit no one knows;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਓੜਕ ਕੋਈ ਨਹੀਂ ਜਾਣਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one knows His limit."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਾ ਕੋਈ ਅੰਤ ਨਹੀਂ ਜਾਨਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਉਸ ਪ੍ਰਭੂ ਦਾ ਧਿਆਨ ਧਰਿਆ ਕਰ) ਜਿਸ (ਦੀ ਹਸਤੀ) ਦਾ ਅੰਤ ਕੋਈ ਭੀ ਜੀਵ ਜਾਣ ਨਹੀਂ ਸਕੇਗਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਨਸਿ = ਜਣ ਸਕੇਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su Fin nadie lo conoce;"