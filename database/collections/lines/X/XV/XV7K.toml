[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਹੋਇ ਕ੍ਰਿਪਾਲੁ; ਤਾ ਗੁਰੂ ਮਿਲਾਵੈ ॥੩॥"
page = 801
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Guru becomes merciful, then he make him meet the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਗੁਰੂ ਜੀ ਮਿਹਰਬਾਨ ਹੋ ਜਾਂਦੇ ਹਨ, ਤਦ ਉਹ ਉਸ ਨੂੰ ਪ੍ਰਭੂ ਨਾਲ ਮਿਲਾ ਦਿੰਦ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Guru becomes Merciful, He leads them to meet the Lord. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਤੂੰ ਆਪ ਹੀ ਜਿਨ ਗੁਰਮਖਾਂ ਪਰ ਕ੍ਰਿਪਾਲ ਹੋਵੈ ਤਬ ਤਿਨ ਕੋ ਸਤਿਗੁਰਾਂ ਕਾ ਮਿਲਾਪ ਕਰਵਾਇ ਦੇਤਾ ਹੈਂ; ਵਾ ਜਬ ਗੁਰੂ ਕ੍ਰਿਪਾਲ ਹੋਵੈਂ ਤਬ ਤੇਰੇ ਸਰੂਪ ਮੇਂ ਮਿਲਾਇ ਦੇਤੇ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਪਰਮਾਤਮਾ ਆਪ (ਜੀਵ ਉੱਤੇ) ਦਇਆਵਾਨ ਹੁੰਦਾ ਹੈ, ਤਾਂ (ਉਸ ਨੂੰ) ਗੁਰੂ ਮਿਲਾਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es sólo cuando el Señor nos muestra Su Misericordia, cuando nos guía hasta el Guru.(3)"