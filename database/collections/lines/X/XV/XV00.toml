[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕੈ ਦੂਖਨਿ; ਜਮ ਤੇ ਨਹੀ ਛੁਟੈ ॥"
page = 279
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By accusing the saints man escapes not from the Deaths couriers."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਤੇ ਦੂਸਨ ਲਾਉਣ ਨਾਲ ਆਦਮੀ ਮੌਤ ਦੇ ਦੂਤਾਂ ਤੋਂ ਨਹੀਂ ਬਚ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Slandering the Saints, one shall not escape the Messenger of Death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਕੇ ਵਿਖੇ ਦੋਸ਼ ਅਰੋਪਣੇ ਕਰ ਜੀਵ ਜਮ ਤੇ ਨਹੀਂ ਛੂਟਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਸੰਤ ਦੀ ਨਿੰਦਿਆ ਕੀਤਿਆਂ ਮਨੁੱਖ ਜਮਾਂ ਤੋਂ ਬਚ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛੁਟੈ = ਬਚ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la muerte lo acosa, toda Paz y serenidad se alejan de él"