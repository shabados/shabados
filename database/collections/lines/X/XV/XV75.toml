data = "ਪੁਹਪ ਮੰਜਰੀ ਜਿਹ ਜਗ ਕਹੈ ॥"
page = 867

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "A Rani used to live in Odchhe; she was known in the world as Pohap Manjri."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਲੋਕ ਪੁਹਪ ਮੰਜਰੀ ਕਹਿੰਦੇ ਸਨ।"