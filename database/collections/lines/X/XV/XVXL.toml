[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹੂੰ ਬ੍ਰਹਮ ਬਾਨੀ ਕਰਹਿ ਬੇਦ ਚਰਚਾ ॥"
page = 150

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere there was the recitation of Upnishads and somewhere there was discussion about the Vedas."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ ਬ੍ਰਹਮ-ਬਾਣੀ (ਦਾ ਪਾਠ ਹੁੰਦਾ ਸੀ ਅਤੇ ਕਿਤੇ) ਵੇਦਾਂ ਦੀ ਚਰਚਾ ਕੀਤੀ ਜਾ ਰਹੀ ਸੀ।"