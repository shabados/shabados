data = "ਸਮਝਦਾਰ ਵਜ਼ੀਰਾਂ ਨੇ ਬਾਦਸ਼ਾਹ ਦੀ ਗੱਲ ਸਮਝ ਲਈ (ਅਤੇ ਇਹ ਵੀ ਸਾਫ਼ ਹੋ ਗਿਆ ਕਿ)"