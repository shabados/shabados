data = "ਸ਼ੁਨੀਦ ਈਂ ਸੁਖ਼ਨ ਦਉਰ ਦਾਨਾ ਵਜ਼ੀਰ ॥"
page = 1399

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thus he had spoken to the wise minister,"

