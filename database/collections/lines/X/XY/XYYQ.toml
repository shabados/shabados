[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਕਤ ਲੋਭੀ; ਬੰਧੁ. ਨ ਪਾਇਆ ॥੬॥"
page = 239
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The greedy infidel falls into entanglement."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲਾਲਚੀ ਕਾਫਰ ਫਾਹੀ ਅੰਦਰ ਫਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The greedy, faithless cynic falls into entanglements. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਕਤ ਪੁਰਸ ਲੋਭੀ ਨੇ ਆਪਕੋ ਬੰਧਨ ਮੇਂ ਪਾਇਆ ਹੈ, ਵਾ (ਬੰਧੁਨ ਪਾਇਆ) ਅਰਥਾਤ ਸੰਤੋਖ ਧਾਰ ਕਰ ਤ੍ਰਿਸਨਾ ਸੇ ਮਨ ਕੋ ਰੋਕਾ ਨਹੀਂ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਨਾਲੋਂ ਟੁੱਟੇ ਹੋਏ ਮਨੁੱਖ ਲੋਭ ਵਿਚ ਗ੍ਰਸੇ ਰਹਿੰਦੇ ਹਨ (ਉਹਨਾਂ ਦੇ ਰਾਹ ਵਿਚ, ਲੱਖਾਂ ਰੁਪਏ ਕਮਾ ਕੇ ਭੀ) ਰੋਕ ਨਹੀਂ ਪੈ ਸਕਦੀ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੰਧੁ = ਰੋਕ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en la maldad no se puede contener a la mente. (6)"