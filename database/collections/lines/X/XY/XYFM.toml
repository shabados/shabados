[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਜੰਤ; ਸਗਲੇ ਪ੍ਰਤਿਪਾਲ ॥"
page = 184
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He nourishes all men and other sentient beings."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰਿਆਂ ਇਨਸਾਨਾਂ ਤੇ ਹੋਰ ਪ੍ਰਾਣਧਾਰੀਆਂ, ਦੀ ਪਰਵਰਸ਼ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He cherishes and nurtures all beings and creatures."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਸਰਬ ਜੀਵ ਜੰਤ ਕੀ ਪ੍ਰਤਿਪਾਲਾ ਕਰਨੇ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਾਰੇ ਜੀਵ ਜੰਤਾਂ ਦੀ ਪਾਲਣਾ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲੇ = ਸਾਰੇ। ਜੀਅ = {ਲਫ਼ਜ਼ 'ਜੀਵ' ਤੋਂ ਬਹੁ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Él sostiene Su Creación por todas partes."