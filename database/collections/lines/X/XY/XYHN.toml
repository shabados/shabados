[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਿਖੰ ਜੰਤ੍ਰ ਥਾਕੇ ਪੜ੍ਹੰ ਮੰਤ੍ਰ ਹਾਰੇ ॥"
page = 44

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The writers of Yantras have grown weary and the reciters of mantras have accepted defeat."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਯੰਤ੍ਰ ਲਿਖਣ ਵਾਲੇ ਥਕ ਗਏ ਅਤੇ ਮੰਤ੍ਰ ਪੜ੍ਹਨ ਵਾਲੇ ਹਾਰ ਗਏ।"