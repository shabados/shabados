data = "ਸਭ ਸ੍ਰੀ ਨਾਮ ਤੁਪਕ ਕੇ ਜਾਨੋ ॥੮੫੨॥"
page = 764

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After saying the word “Yadu-naathini” and then adding the words “Jaachar-nayak and shatru”, know all the names of Tupak.852."

[[content]]
assets = ["RSJD"]
type = "translation"
