[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਬ ਢੂੰਢਨ; ਕਹਾ ਕੋ ਜਾਇਆ ॥"
page = 202
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then to what place should he go to search Him?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ, ਉਹ ਉਸ ਨੂੰ ਲੱਭਣ ਲਈ ਕਿਸ ਜਗ੍ਹਾਂ ਨੂੰ ਜਾਵੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then where should he go to look for Him?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਕਿਸ ਜਗਾ ਕੋ ਢੂਢਨ ਜਾਨਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਉਹ (ਬਾਹਰ ਜੰਗਲਾਂ ਪਹਾੜਾਂ ਆਦਿਕ ਵਿਚ ਉਸ ਨੂੰ) ਲੱਭਣ ਲਈ ਨਹੀਂ ਜਾਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹਾ = ਕਿੱਥੇ? ਕੋ = ਕੋਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿para qué salir de mi ser a buscar algo diferente?"