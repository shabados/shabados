[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰ ਸਮਗ੍ਰੀ; ਪੂਰੇ ਠਾਕੁਰ ਕੀ ॥"
page = 376
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Perfect is the creation of the Perfect Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਹੈ ਰਚਨਾ ਪੂਰਨ ਸਾਹਿਬ ਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Perfect is the Creation of the Perfect Lord Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਪੂਰਨ ਠਾਕੁਰ ਕੀ ਸਮਗ੍ਰੀ ਪੂਰਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਾਰੇ ਜਗਤ-ਪਦਾਰਥ ਉਸ ਅਭੁੱਲ ਪਰਮਾਤਮਾ ਦੇ ਹੀ ਬਣਾਏ ਹੋਏ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰ ਸਮਗ੍ਰੀ = ਸਾਰੇ ਜਗਤ ਦੇ ਪਦਾਰਥ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Perfecto tiene Maneras Perfectas,"