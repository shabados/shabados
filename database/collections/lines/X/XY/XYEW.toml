[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹਸੇ ਦੇਵ ਸਰਬੰ, ਰਿਸ੍ਰਯੋ ਦਾਨਵੇਸੰ ॥"
page = 112

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the gods appear pleased and the demon-king is getting furious."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਦੇਵਤੇ ਹਸ ਰਹੇ ਸਨ ਅਤੇ ਦੈਂਤ ਰਾਜਾ ਕ੍ਰੋਧਵਾਨ ਹੋ ਰਿਹਾ ਸੀ,"