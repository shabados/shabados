type = "primary"
data = "ਅਪਿ ਕਾਮਰੂਪ ਕਹਾਇ ॥੪॥੩੧੫॥"
page = 154

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He called very leaned Brahmins, who called themselves very beautiful like Cupid.4.315."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਾਮ-ਰੂਪ (ਤੀਰਥ ਦੇ ਨਿਵਾਸੀ) ਅਖਵਾਉਣ ਵਾਲੇ ਬ੍ਰਾਹਮਣਾਂ ਨੂੰ (ਬੁਲਾ ਲਿਆ) ॥੪॥੩੧੫॥"