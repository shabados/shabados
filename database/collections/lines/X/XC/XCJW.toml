[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕਿਰਪਾ ਤੇ; ਹੋਇ ਪ੍ਰਗਾਸੁ ॥"
page = 271
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Lord's grace the light dawns."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੀ ਦਇਆ ਦੁਆਰਾ ਚਾਨਣ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By God's Grace, enlightenment comes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪ੍ਰਭੂ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਹੀ ਰਿਦੇ ਮੇਂ ਗਿਆਨ ਰੂਪ ਪ੍ਰਕਾਸ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੀ ਮੇਹਰ ਨਾਲ (ਮਨ ਵਿਚ ਗਿਆਨ ਦਾ) ਪ੍ਰਕਾਸ਼ ਹੁੰਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਗਾਸੁ = ਚਾਨਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "cantan las Gloriosas Alabanzas del Señor."