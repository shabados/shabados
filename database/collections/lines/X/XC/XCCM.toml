[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾਹੂ ਬੁਰਾ; ਨਿਕਟਿ ਨਹੀ ਆਵੈ ॥"
page = 258
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Harm draws not near him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਾਨੀ ਉਸ ਦੇ ਨੇੜੇ ਨਹੀਂ ਢੁਕਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "no evil even approaches him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪੁਰਸ਼ ਕੇ ਬੁਰਾ ਕਰਮੁ ਅਰ ਤਿਸ ਕਾ ਫਲੁ ਦੁਖ ਨਿਕਟ ਨਹੀਂ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਨੇ ਇਹ ਕਰ ਲਿਆ) ਦੂਜਿਆਂ ਵਲੋਂ ਚਿਤਵੀ ਬੁਰਾਈ ਉਸ ਦੇ ਨੇੜੇ ਨਹੀਂ ਢੁਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾਹੂ ਨਿਕਟਿ = ਉਸ ਦੇ ਨੇੜੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y encuentra que no hay ninguna otra fuerza en contra."