[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਾਰਿ ਚਰਨ; ਕਹਹਿ ਬਹੁ ਆਗਰ ॥"
page = 324
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "So many wise-men say that such persons are the four-footed animals,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਸਿਆਣੇ ਬੰਦੇ ਆਖਦੇ ਹਨ ਕਿ ਐਸੇ ਪੁਰਸ਼ ਚਹੁੰ ਪੈਰ ਵਾਲੇ ਹੈਵਾਨ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The wise men call them four-footed creatures;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਚਾਰਿ ਚਰਨ) ਚਾਰੋ ਬੇਦ ਔਰ (ਬਹੁ ਆਗਰ) ਅਤੀ ਚਾਤਰ ਏਹ ਕਹਤੇ ਹੈਂ; ਵਾ ਪੂਰਬ ਉਕਤ ਪੁਰਸੋਂ ਕੋ ਸੰਤ ਜਨ (ਚਾਰਿ ਚਰਨ) ਪਸੂ ਕਹਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬਹੁਤੇ ਸਿਆਣੇ ਮਨੁੱਖ ਚਾਰ ਵੇਦ (ਆਦਿਕ ਧਰਮ-ਪੁਸਤਕਾਂ ਨੂੰ) ਹੀ (ਨਿਰੇ) ਪੜ੍ਹਦੇ ਹਨ (ਪਰ ਨਿਰਾ ਪੜ੍ਹਨ ਨਾਲ ਕੀਹ ਬਣੇ?)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਾਰਿ ਚਰਨ = ਚਾਰ ਵੇਦ। ਕਹਹਿ = ਉਚਾਰਦੇ ਹਨ, ਪੜ੍ਹਦੇ ਹਨ। ਬਹੁ = ਬਹੁਤੇ। ਆਗਰ = ਸਿਆਣੇ ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los sabios dicen que la religión tiene cuatro pies:"