data = "ਕਬੀਰ ਆਖਦਾ ਹੈ ਕਿ (ਅਸਲ ਵਿਚ) ਉਹ ਮਨੁੱਖ ਹੀ ਕੰਗਾਲ ਹੈ,"

[[content]]
assets = ["SNST"]
