language = "pa"
data = "ਸ੍ਰੀ ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਹਮਾਰੇ ਮਤ ਮੇਂ ਸੋਈ ਪੁਰਸ਼ ਨਿਰਧਨੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
