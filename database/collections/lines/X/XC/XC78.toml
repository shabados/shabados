data = "ਕਹਿ ਕਬੀਰ; ਨਿਰਧਨੁ ਹੈ ਸੋਈ ॥"
page = 1159
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir, he alone is poor,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ, ਕੇਵਲ ਉਹ ਹੀ ਗਰੀਬ ਹੈ,"

[[content]]
