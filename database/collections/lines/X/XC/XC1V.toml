[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਸ ਮੈ ਖੇਲਨਿ ਕਾਜ ਚਲੀ ਸਜਿ ਸਾਜਿ ਸਭੈ ਕਬਿ ਸ︀ਯਾਮ ਨਟੀ ਹੈ ॥"
page = 347

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She is moving like all the bedecked dancers for the amorous play"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਵੀ ਸ਼ਿਆਮ (ਕਹਿੰਦੇ ਹਨ) ਉਹ ਰਾਸ ਖੇਡਣ ਲਈ ਸਜ-ਧਜ ਕੇ ਨਟੀ ਵਾਂਗ ਚਲੀ ਹੈ।"