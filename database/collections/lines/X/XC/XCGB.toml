[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਹਿਰ ਗੰਭੀਰ ਅਪਾਰ ਗੁਣਤਾਸੁ ॥"
page = 889
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by the Profound, Unfathomable and Infinite Lord, the treasure of virtues."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨੇਕੀਆਂ ਦੇ ਖਜਾਨ, ਅਗਾਧ, ਅਥਾਹ ਅਤੇ ਅਨੰਤ ਪ੍ਰਭੂ ਨੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is profound, unfathomable, infinite, the treasure of virtue."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਸੰਤ ਕੈਸੇ ਹੈਂ? ਡੂੰਘੇ ਔ ਨਿਰਹਲ ਹੈਂ ਔ ਗੁਣੋਂ ਕੇ ਅਪਾਰ ਸਮੁੰਦਰ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਥਾਹ, ਬੇਅੰਤ, ਗੁਣਾਂ ਦਾ ਖ਼ਜ਼ਾਨਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਹਿਰ = ਡੂੰਘਾ। ਗੰਭੀਰ = ਜਿਗਰੇ ਵਾਲਾ। ਗੁਣ ਤਾਸੁ = ਗੁਣਾਂ ਦਾ ਖ਼ਜ਼ਾਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a través de la Misericordia del Santo, he encontrado el Tesoro Insondable de Virtud."