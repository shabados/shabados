[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗ੍ਰਿਹ ਗਯੋ ਅਤ੍ਰਿ ਮੁਨਿ ਮਨਿ ਮਹਾਨ ॥੧੨॥"
page = 635

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "” Rudra saying “let it be”, disappeared and the sage came back to his home.12."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਹਾਨ ਮਨ ਵਾਲਾ ਅਤ੍ਰੀ ਮੁਨੀ ਵੀ ਘਰ ਨੂੰ ਪਰਤ ਗਿਆ ॥੧੨॥"