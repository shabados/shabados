[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਵਤ ਭੀਰਿ. ਸਕਤਿ ਸਿਮਰਨ ਕੀ; ਕਟੀ ਕਾਲ ਭੈ ਫਾਸੀ ॥"
page = 1162
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Taking with me the army of God's warriors, and through the power of the Lord's meditation, I have snapped the noose of fear of death."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਨਾਲ ਭਗਵਾਨ ਦੇ ਯੋਧਿਆਂ ਦੀ ਸੈਨਾ ਲੈ ਅਤੇ ਸੁਆਮੀ ਦੇ ਚਿੰਤਨ ਦੀ ਸੱਤਿਆ ਰਾਹੀਂ ਮੈਂ ਮੌਤ ਦੇ ਡਰ ਦੀ ਫਾਹੀ ਕੱਟ ਛੱਡੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With the army of God's devotees, and Shakti, the power of meditation, I have snapped the noose of the fear of death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੁਝ (ਭੀਰਿ) ਕਾਇਰ ਨੇ ਭਗਵਾਨ ਕੇ ਸਿਮਰਨ ਕੀ ਸਕਤੀ ਅਰਥਾਤ ਸਮਰਥਾ ਵਾ ਬਰਛੀ ਕਰ ਕਾਲ ਕੇ ਭੈ ਕੀ ਫਾਸੀ ਕਾਟ ਦਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਤਸੰਗ ਤੇ ਸਿਮਰਨ ਦੇ ਬਲ ਨਾਲ ਮੈਂ ਕਾਲ ਦੀ ਫਾਹੀ, ਦੁਨੀਆ ਦੇ ਡਰਾਂ ਦੀ ਫਾਹੀ, ਵੱਢ ਲਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਗਵਤ ਭੀਰਿ = ਭਗਵਾਨ ਦਾ ਸਿਮਰਨ ਕਰਨ ਵਾਲਿਆਂ ਦੀ ਭੀੜ, ਸਾਧ-ਸੰਗਤ। ਸਕਤਿ = ਤਾਕਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con el ejército de los Devotos de Dios, y Shakti, el Poder de la meditación, he logrado romper las ataduras del miedo y de la muerte y Kabir,"