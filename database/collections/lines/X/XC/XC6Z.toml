[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਧੰਨਾ ਜਟੁ ਵਖਾਣੀਐ; ਸਧਨਾ ਜਾਤਿ ਅਜਾਤਿ ਕਸਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "And Sadhana was an out caste butcher. Saint Kabir was a weaver"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਧੰਨਾ ਭਗਤ ਜੱਟ ਕਹੀਦਾ ਹੈ, ਸਧਨਾਂ ਜਾਤਾਂ ਵਿਚੋਂ ਨੀਚ ਜਾਤ ਵਾਲਾ ਕਸਾਈ (ਹੋਇਆ ਹੈ)।"