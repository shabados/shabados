[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੀ ਦ੍ਰਿੜਤਾ; ਤਾ ਕੈ ਹੋਇ ॥"
page = 236
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone acquires such steadfastness,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਸ ਨੂੰ ਹੀ ਐਹੋ ਜੇਹੀ ਪਕਿਆਈ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They alone acquire such stability,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੋ ਐਸੀ ਦ੍ਰਿੜਤਾ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਉਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਅਜੇਹਾ ਆਤਮਕ ਬਲ ਪੈਦਾ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦ੍ਰਿੜਤਾ = ਪਕਿਆਈ, ਮਾਨਸਕ ਤਾਕਤ। ਤਾ ਕੈ = ਉਸ ਮਨੁੱਖ ਦੇ ਅੰਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin embargo, solamente tiene la dedicación y la resolución para hacerlo,"