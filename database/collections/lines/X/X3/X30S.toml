[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਟਣੈ ਸਭਰਵਾਲ ਹੈ; ਨਵਲੁ ਨਿਹਾਲਾ ਸੁਧ ਪਰਾਣੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In Patna Bhai naval and among Sabhaervals Nihala is a pious person."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਟਣੇ ਦਾ ਵਾਸੀ ਭਾਈ ਨਿਵਲ ਤੇ ਸੱਭਰਵਾਲ ਦਾ ਵਾਸੀ ਨਿਹਾਲਾ ਸ਼ੁੱਧ ਪ੍ਰਾਣੀ ਸਨ।"