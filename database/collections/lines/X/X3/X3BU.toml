[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਖਿ ਲੀਏ; ਅਪੁਨੈ ਗੁਰਿ ਗੋਪਾਲ ॥੪॥"
page = 1347
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Guru-God, has saved me from them."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਗੁਰੂ-ਪ੍ਰਮੇਸ਼ਰ ਨੇ ਮੈਨੂੰ ਉਨ੍ਹਾਂ ਪਾਸੋਂ ਬਚਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My Guru, the Lord of the World, has saved me from them. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਹਮ ਕੋ ਤਿਨ ਵਿਕਾਰੋਂ ਸੇ ਗੋਪਾਲ ਰੂਪ ਗੁਰੂ ਨੇ ਰਾਖ ਲੀਆ ਹੈ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਤਾਂ ਮੇਰੇ ਗੁਰੂ ਨੇ ਗੋਪਾਲ ਨੇ (ਇਹਨਾਂ ਤੋਂ) ਬਚਾ ਲਿਆ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਪੁਨੈ ਗੁਰਿ = ਆਪਣੇ ਗੁਰੂ ਨੇ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Señor del mundo, me protege y me salva de ellos. (4)"