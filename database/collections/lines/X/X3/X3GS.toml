[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਹ ਚਰਿਤ੍ਰ ਨਿਜੁ ਜਾਰ ਲੰਘਾਯੋ ॥੧੧॥"
page = 997

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He got up, went away to his own palace, and the woman, through this trickery, saved the friend.(11)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਚਰਿਤ੍ਰ ਕਰ ਕੇ ਆਪਣੇ ਮਿਤਰ ਨੂੰ ਲੰਘਾ ਦਿੱਤਾ ॥੧੧॥"