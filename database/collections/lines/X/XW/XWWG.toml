[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਸੰਗਤਿ ਮਿਲੁ ਭਜੁ ਰਾਮ ॥"
page = 1297
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whosoever has great destiny writ on his forehead,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਿਸੇ ਦੇ ਮੱਥੇ ਉਤੇ ਭਾਰੀ ਪ੍ਰਾਲਭਧ ਲਿਖੀ ਹੋਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Joining the Sat Sangat, the True Congregation, vibrate and meditate on the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਸੰਗਤਿ ਮੇਂ ਮਿਲ ਕਰ ਰਾਮ ਕੋ ਸੋਭ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਾਧ ਸੰਗਤ ਵਿਚ ਮਿਲ ਅਤੇ ਰਾਮ ਦਾ ਭਜਨ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲੁ = ਮਿਲਿਆ ਰਹੁ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a la Verdadera Congregación, y ahí medita en el Señor."