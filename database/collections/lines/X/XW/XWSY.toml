[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਪੂਰੈ; ਕਿਰਪਾ ਧਾਰੀ ॥"
page = 621
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Perfect Guru has taken pity on me,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਾਂ ਨੇ ਮੇਰੇ ਉਤੇ ਤਰਸ ਕੀਤਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Perfect Guru has granted His Grace,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭਲੇ ਕਰਮ ਕਰਨੇ ਸੇ ਪੂਰੇ ਗੁਰੂ ਨੇ ਹਮਾਰੇ ਪਰ ਕਿਰਪਾ ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਸੰਤ ਜਨੋ! ਜਦੋਂ ਤੋਂ) ਪੂਰੇ ਗੁਰੂ ਨੇ ਮੇਹਰ ਕੀਤੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru Perfecto es Compasivo conmigo y el Señor,"