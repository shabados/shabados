[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਫਰੀਦਾ. ਦੁਨੀ ਵਜਾਈ ਵਜਦੀ; ਤੂੰ ਭੀ ਵਜਹਿ ਨਾਲਿ ॥"
page = 1383
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Farid! The world dances as the devil makes it dance and thou too are playing with it;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਫਰੀਦ! ਜਿਸ ਤਰ੍ਹਾਂ ਸ਼ੈਤਾਨ ਨਚਾਉਂਦਾ ਹੈ, ਉਸੇ ਤਰ੍ਹਾਂ ਹੀ ਸੰਸਾਰ ਨਚਦਾ ਹੈ, ਤੂੰ ਭੀ ਇਸ ਦੇ ਸੰਗ ਹੀ ਖੇਡਦਾ ਹੈਂ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Fareed, the world dances as it dances, and you dance with it as well."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਫਰੀਦ ਜੀ ਦ੍ਵਾਰਾ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਜਿਸ ਅਗਿਆਨ ਕੀ ਵਜਾਈ ਹੋਈ (ਦੁਨੀ) ਸ੍ਰਿਸਟੀ ਵਜਤੀ ਹੈ, ਭਾਵ ਸਰਬ ਪ੍ਰਕਾਰ ਕੀ ਚੇਸਟਾ ਕਰਤੀ ਹੈ ਤੂੰ ਭੀ ਉਸ ਦੁਨੀਆਂ ਕੇ ਲੋਕੋਂ ਸਾਥ ਹੀ ਬਜਤਾ ਹੈਂ, ਭਾਵ ਤਿਨ ਕੇ ਅਨੁਸਾਰ ਅਗਿਆਨ ਸਹਿਤ ਚੇਸਟਾ ਕਰਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਫਰੀਦ! ਦੁਨੀਆ ਦੇ ਲੋਕ (ਵਾਜੇ ਹਨ ਜੋ ਮਾਇਆ ਦੇ) ਵਜਾਏ ਹੋਏ ਵੱਜ ਰਹੇ ਹਨ, ਤੂੰ ਭੀ ਉਹਨਾਂ ਦੇ ਨਾਲ ਹੀ ਵੱਜ ਰਿਹਾ ਹੈਂ, (ਭਾਵ, ਮਾਇਆ ਦਾ ਨਚਾਇਆ ਨੱਚ ਰਿਹਾ ਹੈਂ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਨੀ = ਦੁਨੀਆ, ਦੁਨੀਆ ਦੇ ਲੋਕ। ਵਜਾਈ = ਮਾਇਆ ਦੀ ਪ੍ਰੇਰੀ ਹੋਈ। ਨਾਲਿ = ਦੁਨੀਆ ਦੇ ਹੀ ਨਾਲਿ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Farid, el mundo baila como baila y tu bailas con él también,"