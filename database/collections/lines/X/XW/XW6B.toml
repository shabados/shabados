[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਨਾਮੰ ਨ ਠਾਮੰ ਮਹਾ ਜੋਤਿ ਜਾਗੰ ॥"
page = 39

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is Nameless, Placeless; and a Radiating Great Effulgence"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਾ ਨਾਮ ਹੈ, ਨਾ ਠਿਕਾਣਾ ਹੈ, (ਬਸ) ਜਗਣ ਵਾਲੀ (ਤੂੰ) ਮਹਾ ਜੋਤਿ ਹੈਂ।"