[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੈ ਰੰਗਿ; ਰਾਚਿ ਜਨ ਰਹੇ ॥"
page = 285
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lord's slaves remain absorbed in His Love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਗੋਲੇ ਉਸ ਦੇ ਪ੍ਰੇਮ ਅੰਦਰ ਲੀਨ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God's humble servants remain absorbed in His Love."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਜਨ ਪ੍ਰਭੂ ਕੇ (ਰੰਗਿ) ਪ੍ਰੇਮ ਵਾ ਅਨੰਦ ਮੇਂ ਰਾਚ ਰਹੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਦਾਸ ਪ੍ਰਭੂ ਦੇ ਪਿਆਰ ਵਿਚ ਮਸਤ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਚਿ ਰਹੇ = ਮਸਤ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos aquéllos que a Ti Te sirven, oh Señor, son inundados por Tu Amor."