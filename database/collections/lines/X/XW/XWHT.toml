[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭਨੀ ਛਾਲਾ ਮਾਰੀਆ; ਕਰਤਾ ਕਰੇ ਸੁ ਹੋਇ ॥"
page = 469
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Every one has taken a jump, but what the Creator does, that alone comes to pass."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਇਕਸ ਨੇ ਛਲਾਂਗ ਲਗਾਈ ਹੈ, ਪਰ ਜੋ ਕੁਛ ਸਿਰਜਨਹਾਰ ਕਰਦਾ ਹੈ, ਕੇਵਲ ਓਹੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everyone makes the attempt, but that alone happens which the Creator Lord does."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਤਨੇ ਜੀਵ ਹੈਂ ਸਭ ਨੇ ਛਾਲਾਂ ਮਾਰੀਆਂ ਹੈਂ, ਭਾਵ ਸਾਧਨ ਕੀਏ ਹੈਂ, ਪਰੰਤੂ ਜਿਸ ਕੇ ਕਰਤਾ ਪੁਰਖ ਪ੍ਰਮਾਣ ਕਰੇ ਸੋਈ ਸਾਧਨੋਂ ਸੇ ਸਿਧ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜੀਵ ਆਪੋ ਆਪਣਾ ਜ਼ੋਰ ਲਾਂਦੇ ਹਨ, ਪਰ ਹੁੰਦੀ ਉਹੀ ਹੈ ਜੋ ਕਰਤਾਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭਨੀ = ਸਭ ਜੀਵਾਂ ਨੇ। ਛਾਲਾ ਮਾਰੀਆ = ਆਪਣਾ ਜ਼ੋਰ ਲਾਇਆ ਹੈ। ਸੁ ਹੋਇ = ਉਹੀ ਕੁਝ ਵਰਤਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aunque traten lo que sea, solamente ocurrirá lo que está en la Voluntad del Señor."