[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉਮੈ ਕ੍ਰੋਧੁ; ਸਬਦਿ ਨਿਵਾਰੈ ॥"
page = 1057
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Name, he silences his ego and wrath."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੇ ਰਾਹੀਂ ਉਹ ਆਪਦੀ ਹੰਗਤਾ ਤੇ ਗੁੱਸੇ ਨੂੰ ਮਾਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Egotism and anger are silenced through the Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਉਮੈਂ ਤਥਾ ਕ੍ਰੋਧ ਗੁਰੋਂ ਕਾ ਸਬਦ ਹੀ ਨਿਵਰਤ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਹੜਾ ਮਨੁੱਖ ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿੰਦਾ ਹੈ, ਉਹ) ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ (ਆਪਣੇ ਅੰਦਰੋਂ) ਹਉਮੈ ਦੂਰ ਕਰ ਲੈਂਦਾ ਹੈ, ਕ੍ਰੋਧ ਦੂਰ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਬਦਿ = ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ। ਨਿਵਾਰੈ = ਦੂਰ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues a través de la Palabra se sobrepone a su ego y a su furia."