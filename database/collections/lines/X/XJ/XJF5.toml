[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਇਨਾ ਰੂਪਾ; ਫੁਨਿ ਨਹੀ ਦਾਮ ॥"
page = 187
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Gold, Silver and rupees are not thine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੋਨਾ ਚਾਂਦੀ ਅਤੇ ਰੁਪਏ ਤੇਰੇ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Gold, silver and money are not yours."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਇਨਾ ਰੁਪਾ ਪੁਨਾ ਦਾਮ ਭੀ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਸੋਨਾ ਚਾਂਦੀ ਤੇ ਦੌਲਤ ਭੀ (ਸਦਾ ਲਈ ਆਪਣੇ) ਨਹੀਂ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੂਪਾ = ਚਾਂਦੀ। ਫੁਨਿ = ਭੀ। ਦਾਮ = ਦੌਲਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ni tampoco el oro, la plata y otras riquezas,"