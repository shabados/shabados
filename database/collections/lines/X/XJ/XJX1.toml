[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਰਮਤਿ ਖੋਟੀ; ਖੋਟੁ ਕਮਾਵੈ ॥"
page = 1047
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The evil-intellected, wicked wife practises wickedness,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੰਦੀ ਅਕਲ ਵਾਲੀ ਪਾਪਣ ਪਤਨੀ ਪਾਪ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The evil-minded, wicked soul-bride practices wickedness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਖੋਟੀ ਬੁਧੀ ਵਾਲੀ ਤੌ ਖੋਟ ਹੀ ਕਮਾਵਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਖੋਟੀ ਮੱਤ ਵਾਲੀ ਜੀਵ-ਇਸਤ੍ਰੀ ਸਦਾ ਖੋਟ ਨਾਲ ਭਰੀ ਰਹਿੰਦੀ ਹੈ ਸਦਾ ਖੋਟ ਕਮਾਂਦੀ ਹੈ (ਖੋਟਾ ਕੰਮ ਕਰਦੀ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖੋਟੁ = ਖੋਟਾ ਕੰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, tiene una mente viciosa y se hace daño a sí misma."