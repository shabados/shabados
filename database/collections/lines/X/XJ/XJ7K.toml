[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਅਦਬ ਹੀ ਤਾਂ ਸਾਰਿਆਂ ਨੂੰ ਰਾਹ ਵਿਖਾਉਣ ਦੇ ਕਾਬਲ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਚੂੰ ਆਦਬ ਅਮਦ ਹਮਾ ਰਾ ਰਹਾਨੁਮਾ ॥੩੦੮॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "He spared the world from the evils of monsters and demons and made it sacred,"