[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਮਿੱਟੀ ਦਾ ਇਹ ਸਰੀਰ ਰੱਬ ਦੀ ਬੰਦਗੀ ਕਰਕੇ ਹੀ ਪਵਿੱਤਰ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਈਂ ਵਜੂਦਿ ਖ਼ਾਕ ਪਾਕ ਅਜ਼ ਬੰਦਗੀਸਤ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "This body of dust becomes sacred only due to the remembrance of the Provident,"