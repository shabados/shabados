[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਸੁ ਸੇਵੀ. ਤੈ ਕਿਸੁ ਸਾਲਾਹੀ ॥"
page = 1048
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whom should I serve and whom praise?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕੀਹਦੀ ਅਹਿਲ ਕਰ ਅਤੇ ਕੀਹਦੀ ਉਸਤਤੀ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whom should I serve, and whom should I praise?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਸ਼ਨ: ਕਿਸ ਕੋ ਸੇਵੀਏ ਔ ਕਿਸ ਕੋ ਸਾਲਾਹੀਏ?☬ਉੱਤਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇ ਤੂੰ ਪੁੱਛੇਂ ਕਿ) ਮੈਂ ਕਿਸ ਦੀ ਸੇਵਾ ਕਰਦਾ ਹਾਂ ਅਤੇ ਕਿਸ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵੀ = ਸੇਵੀਂ, ਮੈਂ ਸੇਵਾਂ, ਮੈਂ ਸਰਨ ਪਵਾਂ। ਤੈ = ਅਤੇ। ਸਾਲਾਹੀ = ਸਾਲਾਹੀਂ, ਮੈਂ ਸਾਲਾਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿A Quien podré alabar y servir?,"