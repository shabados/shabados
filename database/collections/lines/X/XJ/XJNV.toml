[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਰਮ ਰੂਪ ਦੁਰ ਧਰਖ ਗਾਤ; ਅਮਰਖ ਤੇਜ ਅਪਾਰ ॥"
page = 697

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They are pretty in form, sturdy in body and have infinite brilliance"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਨ੍ਹਾਂ ਦਾ) ਮਹਾਨ ਰੂਪ ਹੈ, ਦ੍ਰਿੜ੍ਹ ਸ਼ਰੀਰ ਹੈ, (ਇਹ) ਬਹੁਤ ਗੁੱਸੇ ਵਾਲੇ ਅਤੇ ਅਪਾਰ ਤੇਜ ਵਾਲੇ ਹਨ।"