[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਹਰਿ ਕੀ; ਹਰਿ ਕਥਾ ਸੁਣਾਵੈ ॥"
page = 164
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who reads out to me the divine discourse of God,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਵਾਹਿਗੁਰੂ ਦੀ ਈਸ਼ਵਰੀ ਵਾਰਤਾ ਮੈਨੂ ਪੜ੍ਹ ਕੇ ਸੁਣਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who chants the Speech of the Lord"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੁਰਸ ਹਰੀ ਜੋ ਪਾਪੋਂ ਕੇ ਹਰਨੇ ਵਾਲਾ ਹੈ ਤਿਸੁ ਹਰੀ ਕੀ ਕਥਾ ਸੁਨਾ ਦੇਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜੇਹੜਾ ਮਨੁੱਖ (ਮੈਨੂੰ) ਪਰਮਾਤਮਾ (ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ) ਦੀਆਂ ਗੱਲਾਂ ਸੁਣਾਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que me recita los Salmos del Señor,"