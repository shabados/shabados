[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੀ ਦਰਗਹ; ਪਾਵੈ ਮਾਨੁ ॥"
page = 1173
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, then obtains honour in the True court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਉਹ ਸੱਚੇ ਦਰਬਾਰ ਅੰਦਰ ਪਤਿ ਆਬਰੂ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Then, the mortal is honored in the Court of the True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਵਹੁ ਪੁਰਸ ਸਾਚੀ (ਦਰਗਹ) ਪ੍ਰਲੋਕ ਮੇਂ ਵਾ ਸਤਸੰਗ ਮੇਂ ਮਾਨੁ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਆਦਰ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਨੁ = ਇੱਜ਼ਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así encuentra el Honor en la Corte del Señor."