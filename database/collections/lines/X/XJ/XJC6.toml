[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਖੁ ਸਦਾ ਪ੍ਰਭ ਅਪਨੈ ਸਾਥ ॥"
page = 828
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, keep me Thou ever with Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਤੂੰ ਸਦੀਵ ਹੀ ਮੈਨੂੰ ਆਪਣੇ ਨਾਲ ਰੱਖ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Keep me with You forever, O God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭ! ਹਮ ਕੋ ਸਦਾ ਅਪਨੇ ਸਾਥ ਹੀ ਰਾਖੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਸਾਨੂੰ ਤੂੰ ਸਦਾ ਆਪਣੇ ਚਰਨਾਂ ਵਿਚ ਟਿਕਾਈ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਪਨੈ ਸਾਥ = ਆਪਣੇ ਨਾਲ, ਆਪਣੇ ਚਰਨਾਂ ਵਿਚ। ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, consérvame siempre en Tu Ser,"