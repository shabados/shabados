[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਨੋ ਵਿਸਰੈ ਨਾਉ; ਸੁ ਜੋਨੀ ਹਾਂਢੀਐ ॥"
page = 964
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who forgets the Lord's Name; He wanders in existences."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੁਆਮੀ ਦੇ ਨਾਮ ਨੂੰ ਭੁਲਾਉਂਦਾ ਹੈ, ਉਹ ਜੂਨੀਆਂ ਅੰਦਰ ਭਟਕਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who forgets the Name, wanders in reincarnation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਨਾਮ ਵਿਸਰੈ ਸੋ ਜੋਨੀਓਂ ਮੇਂ ਫਿਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਮਾਲਕ ਪ੍ਰਭੂ ਦਾ ਨਾਮ (ਸਿਮਰਨਾ) ਭੁੱਲ ਜਾਏ (ਜਿਵੇਂ ਕੋਈ ਕੰਗਾਲ ਮੰਗਤਾ ਦਰ ਦਰ ਤੇ ਰੁਲਦਾ ਹੈ, ਤਿਵੇਂ) ਉਹ ਜੂਨਾਂ ਵਿਚ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਾਂਢੀਐ = ਭਟਕਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, aquél que abandona Tu Nombre, vaga por millones de vientres."