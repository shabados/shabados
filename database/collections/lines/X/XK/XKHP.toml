[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲੇ ਜਾਚਹਿ; ਗੁਰ ਭੰਡਾਰੀ ॥"
page = 1024
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Everyone ask for alms from the Guru, the Lord's treasurer."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਕੋਈ ਪ੍ਰਭੂ ਦੇ ਖ਼ਜ਼ਾਨਚੀ, ਗੁਰਾਂ ਪਾਸੋਂ ਖ਼ੈਰ ਮੰਗਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everyone begs from the Guru, God's Treasurer."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੋ ਭੰਡਾਰੀ ਹੈਂ ਤਿਨ ਸੇ ਸਗਲੇ ਜਗ੍ਯਾਸੀ ਮਾਂਗਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜੀਵ ਗੁਰੂ ਦੇ ਖ਼ਜ਼ਾਨੇ ਵਿਚੋਂ (ਉਸ ਪ੍ਰਭੂ ਦਾ ਨਾਮ) ਮੰਗਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਚਹਿ = ਮੰਗਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos buscan al Guru, el Tesoro del Bien,"