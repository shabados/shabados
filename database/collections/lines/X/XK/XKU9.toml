[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਹਜੇ; ਸਿਫਤੀ ਧਣਖੁ ਚੜਾਏ ॥"
page = 993
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and stretch the bow of the Lord's praise,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇ ਸਾਈਂ ਦੀ ਕੀਰਤੀ ਦੀ ਕਮਾਨ ਨੂੰ ਚਿੱਲਾ ਚੜ੍ਹਾਉਣਾ ਚਾਹੀਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "with your intuition, draw the bow of the Praise of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜੋ ਸਿਫਤ ਰੂਪ ਧਨਖ ਸੁਤੇ ਹੀ ਚੜਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਡੋਲਤਾ ਵਿਚ ਟਿਕ ਕੇ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦਾ ਧਣਖ (ਬਾਣ) ਕਸਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜੇ = ਸਹਿਜ, ਸਹਜਿ ਵਿਚ, ਅਡੋਲਤਾ ਵਿਚ (ਟਿਕ ਕੇ)। ਸਿਫਤੀ ਧਣਖੁ = ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦਾ ਧਣਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y de forma natural apuntar hacia su ser el arco de la Alabanza del Señor,"