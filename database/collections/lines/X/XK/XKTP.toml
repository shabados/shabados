[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਰਸੁ; ਜਿਨਿ ਜਨਿ ਚਾਖਿਆ ॥"
page = 211
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The person who has tasted God's elixir,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਪੁਰਸ਼ ਨੇ ਵਾਹਿਗੁਰੂ ਅੰਮ੍ਰਿਤ ਦਾ ਸੁਆਦ ਮਾਣਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who taste the sublime essence of the Lord"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਪੁਰਸੋਂ ਨੇ ਹਰੀ ਰਸ ਚਾਖਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਮਨੁੱਖ ਨੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਰਸ ਚੱਖ ਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ ਨੇ। ਜਨਿ = ਜਨ ਨੇ। ਜਿਨਿ ਜਨਿ = ਜਿਸ ਮਨੁੱਖ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que prueba la Esencia del Señor,"