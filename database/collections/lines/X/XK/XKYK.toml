[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਮੇਰਾ ਠਾਕੁਰੁ; ਹਉ ਦਾਸੁ ਤੇਰਾ ॥"
page = 1144
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou are my Lord and I am Thy serf."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰਾ ਸੁਆਮੀ ਹਂੈ ਅਤੇ ਮੈਂ ਤੇਰਾ ਨਫਰ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my Lord and Master; I am Your slave."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰਾ ਸ੍ਵਾਂਮੀ ਹੈਂ ਔਰ ਮੈਂ ਤੇਰਾ ਦਾਸ ਹਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰਾ ਮਾਲਕ ਹੈਂ, ਮੈਂ ਤੇਰਾ ਸੇਵਕ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਕੁਰੁ = ਮਾਲਕ। ਹਉ = ਮੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres mi Maestro, yo Tu Sirviente,"