[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਸਚਾ ਸਚੁ ਵਰਤਾਏ ॥"
page = 1053
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of Himself the True Lord distributes truth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਸੱਚਾ ਸੁਆਮੀ ਸੱਚ ਵੱਡਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Lord Himself makes Truth pervasive."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਚਾ ਵਾਹਿਗੁਰੂ ਆਪ ਹੀ ਸਾਜ ਕੋ ਵਰਤਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਪਰਮਾਤਮਾ ਆਪ ਹੀ ਆਪਣਾ ਅਟੱਲ ਹੁਕਮ ਵਰਤਾ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੇ = ਆਪ ਹੀ। ਸਚੁ = ਅਟੱਲ ਹੁਕਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor por Sí Mismo hace Su Verdad Manifiesta,"