[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਰੇਯੰ ਪੁਨੀਤੰ ਪਵਿਤ੍ਰੰ ਪ੍ਰਧਾਨੰ ॥"
page = 127

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art beyond everything. Thou art holy, immaculate and supreme."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੂੰ) ਸਭ ਤੋਂ ਪਰੇ, ਸਵੱਛ, ਪਵਿੱਤਰ ਅਤੇ ਸਰਬ-ਪ੍ਰਮੁਖ ਹੈਂ;"