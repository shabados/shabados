[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕਾ ਓਟ; ਗਹੁ ਹਾਂ ॥"
page = 410
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Grasp the protection of one God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇੱਕ ਵਾਹਿਗੁਰੂ ਦੀ ਪਨਾਹ ਪਕੜ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Grab hold of the Support of the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਕੀ ਓਟ ਗ੍ਰਹਨ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਇਕ ਪਰਮਾਤਮਾ ਦਾ ਪੱਲਾ ਫੜ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਕਾ ਓਟ = ਇਕ ਪਰਮਾਤਮਾ ਦਾ ਆਸਰਾ। ਗਹੁ = ਫੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Busca sólo el Refugio de tu Señor"