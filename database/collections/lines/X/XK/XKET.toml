[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈਸੇ ਭੂਖੇ; ਭੋਜਨ ਮਾਤ ॥"
page = 987
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the hunger of the hungry man is satisfied with food."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਭੁੱਖੇ ਇਨਸਾਨ ਦੀ ਭੁੱਖ, ਖਾਣੇ ਨਾਲ ਮਿੱਟ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "as one's hunger is satisfied by food;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਭੂਖੇ ਕੋ ਭੋਜਨ ਮਿਲੋ ਤੌ ਭੂਖ ਮਾਤ ਹੋ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਕਿਸੇ ਭੁੱਖੇ ਨੂੰ ਭੋਜਨ ਹੀ ਸਹਾਈ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੋਜਨ ਮਾਤ = ਭੋਜਨ ਮਾਤ੍ਰ, ਸਿਰਫ਼ ਭੋਜਨ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así como el hambre de uno se satisface con el alimento."