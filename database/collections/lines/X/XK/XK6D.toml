[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕਾ ਸੇਵਕੁ; ਨਰਕਿ. ਨ ਜਾਏ ॥"
page = 1075
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru's serf falls not into hell."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦਾ ਨਫ਼ਰ ਦੋਜ਼ਕ ਵਿੱਚ ਨਹੀਂ ਪੈਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru's servant is not consigned to hell."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕਾ ਸੇਵਕ ਨਰਕ ਨਹੀਂ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦਾ ਸੇਵਕ ਨਰਕ ਵਿਚ ਨਹੀਂ ਪੈਂਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਰਕਿ = ਨਰਕ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El que sirve al Guru, no cae en la oscuridad de su conciencia."