language = "pa"
data = "ਉਸ ਦਾ ਹਰ ਜਲਵਾ ਹਰ ਥਾਣ ਬਿਨਾਣ ਘੁੰਡ ਦੇ ਰੂਪਮਾਨ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਜਮਾਲਿ ਊ ਹਮਾ ਜਾ ਬੇ-ਹਿਸਾਬ ਜਲਵਾਗਰ ਅਸਤ ॥"

