[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਨਹੁ ਜਿਠਾਨੀ. ਸੁਨਹੁ ਦਿਰਾਨੀ; ਅਚਰਜੁ ਏਕੁ ਭਇਓ ॥"
page = 856
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hear, O elder sister-in-law, Hear O Younger sister-in-law, a wondrous thing has occurred."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਣ, ਹੇ ਮੇਰੇ ਜੇਠ ਦੀਏ ਪਤਨੀਏ! ਸੁਣ! ਹੇ ਮੇਰੇ ਦੇਵਰ ਦੀਏ ਪਤਨੀਏ! ਇਕ ਅਸਚਰਜ ਗੱਲ ਹੋ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen, O my sisters-in-law, a wondrous thing has happened!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਰਾਨੀ! ਤੁਮ ਸੁਨੋ ਔਰ ਹੇ ਜਠਾਨੀ! ਤੁਮ ਭੀ ਸੁਨੋ ਏਕ ਬਡਾ ਅਸਚਰਜ ਔਰ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀਓ ਦਿਰਾਣੀਓ ਜਿਠਾਣੀਓ! ਸੁਣੋ, (ਸਾਡੇ ਘਰ) ਇਹ ਕਿਹਾ ਅਚਰਜ ਭਾਣਾ ਵਰਤ ਗਿਆ ਹੈ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh compañeros, ¡qué extraño, qué cruel,"