[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਕੀ ਜੋਤਿ ਤ੍ਰਿਭਵਣ ਸਾਰੇ ॥"
page = 1037
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His light is contained in all the three worlds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਪ੍ਰਕਾਸ਼ ਸਾਰੇ, ਤਿੰਨਾਂ ਲੋਆਂ ਅੰਦਰ, ਰਮਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His Light pervades all the three worlds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੀ (ਜੋਤਿ) ਸੱਤਾ ਤੀਨੋਂ ਭਵਣੋਂ ਮੇਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਆਪਣੀ ਹੀ ਜੋਤਿ ਸਾਰੇ ਤਿੰਨਾਂ ਭਵਨਾਂ ਵਿਚ ਪਸਰ ਰਹੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y mira, Él infundió en los tres mundos Su Luz Infinita."