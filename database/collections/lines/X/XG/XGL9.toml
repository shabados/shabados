[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਫੜਿ ਕਢੈ ਮਰੁਜੀਵੜਾ; ਪਰ ਕਾਰਜ ਨੋ ਆਪੁ ਫੜਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The diver catches hold of it and it also allows itself to be caught for the sale of altruistic sense."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮਰਜੀਉੜਾ ਫੜ ਕੱਢਦਾ ਹੈ, (ਮਾਨੋ) ਸਿੱਪ ਪਰਸੁਆਰਥ ਨੂੰ ਆਪ ਫੜਾਉਂਦਾ ਹੈ।"