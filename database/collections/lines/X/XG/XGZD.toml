[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸ︀ਯਾਮ ਸੋ ਸੁੰਦਰ ਖੇਲਤ ਹੈ ਕਬਿ ਸ︀ਯਾਮ ਕਹੈ ਅਤਿ ਹੀ ਰੰਗ ਰਾਚੀ ॥"
page = 356

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Those beautiful women, imbued in the love of Krishna, are absorbed in the amorous play"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਵੀ ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, (ਪ੍ਰੇਮ) ਰੰਗ ਵਿਚ ਰਤੀਆਂ ਹੋਈਆਂ ਸੁੰਦਰ (ਗੋਪੀਆਂ) ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਨਾਲ ਖੇਡਦੀਆਂ ਹਨ।"