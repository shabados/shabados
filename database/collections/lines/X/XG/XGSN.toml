[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਹੁੜੀ ਪਾਰਸ ਪਥਰੀ; ਅਸਟ ਧਾਤੁ ਕੰਚਨੁ ਕਰਵਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The philosopher’s stone is small but transforms alloy of eighty metals into gold."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਨਿੱਕੀ ਪਾਰਸ ਦੀ ਗੀਟੀ ਅੱਠਾਂ ਧਾਤਾਂ ਨੂੰ ਸੋਨਾ ਕਰਦੀ ਹੈ।"