[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੇ ਮਨ ਮੇਰੇ; ਤੂ ਤਾ ਕਉ ਜਾਪਿ ॥੩॥"
page = 987
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meditate thou on Him, O my soul."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਉਸ ਦਾ ਸਿਮਰਨ ਕਰ, ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, meditate on Him. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ ਤਿਸ ਕੋ ਜਪੁ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ ਉਸ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਜਪਿਆ ਕਰ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕਉ = ਉਸ ਨੂੰ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh mi mente medita en Él. (3)"