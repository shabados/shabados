[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਧਉ ਮੁਕਤਿ. ਕਹਾ ਦੇਉ ਕੈਸੀ; ਕਰਿ ਪ੍ਰਸਾਦੁ. ਮੋਹਿ ਪਾਈ ਹੈ ॥੧॥ ਰਹਾਉ ॥"
page = 1104
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Tell me, where and what sort of emancipation shall Thou give me? By Thy grace, I have already obtained it. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਦਸ, ਤੂੰ ਮੈਨੂੰ ਕਿਥੇ ਅਤੇ ਕੇਹੋ ਜੇਹੀ ਕਲਿਆਣ ਦੇਵੇਗਾਂ? ਤੇਰੀ ਮਿਹਰ ਦੁਆਰਾ ਪਹਿਲਾਂ ਹੀ ਮੈਂ ਇਸ ਨੂੰ ਪਰਾਪਤ ਕਰ ਲਿਆ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Tell me where, and what sort of liberation shall You give me? By Your Grace, I have already obtained it. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਬਿਚਾਰਤਾ ਹੂੰ ਮੇਰੇ ਕੋ ਮੁਕਤੀ ਕਹਾਂ ਦੇਵੋਗੇ ਔ ਵਹੁ ਮੁਕਤੀ ਕੈਸੀ ਹੈ, ਭਾਵ ਮੁਕਤੀ ਕਾ ਸਰੂਪ ਕਿਆ ਹੈ? ਮੈਨੇ ਤਉ ਤੇਰੀ ਕਿਰਪਾ ਕਰ ਕੇ ਮੁਕਤੀ ਪਾਇ ਲਈ ਹੈ॥੧॥ ਰਹਾਉ ॥☬ਜੇ ਪਰਮੇਸਰ ਕਹੇ ਤੂੰ ਤਰਿਆ ਨਹੀਂ ਚਾਹਿਤਾ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਤੇਰੇ ਚਰਨਾਂ ਵਿਚ ਜੁੜੇ ਰਹਿਣਾ ਮੁਕਤੀ ਨਹੀਂ ਹੈ, ਤਾਂ) ਮੈਂ ਪੁੱਛਦਾ ਹਾਂ-ਉਹ ਮੁਕਤੀ ਕਿਹੋ ਜਿਹੀ ਹੋਵੇਗੀ, ਤੇ ਮੈਨੂੰ ਹੋਰ ਕਿਥੇ ਲੈ ਜਾ ਕੇ ਤੂੰ ਦੇਵੇਂਗਾ? (ਤੇਰੇ ਚਰਨਾਂ ਵਿਚ ਜੁੜੇ ਰਹਿਣ ਵਾਲੀ ਮੁਕਤੀ ਤਾਂ) ਤੇਰੀ ਕਿਰਪਾ ਨਾਲ ਮੈਂ ਅੱਗੇ ਹੀ ਪ੍ਰਾਪਤ ਕੀਤੀ ਹੋਈ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਧਉ = ਸੋਧਉਂ, ਮੈਂ ਪੁੱਛਦਾ ਹਾਂ। ਕੈਸੀ = ਕਿਹੋ ਜਿਹੀ (ਮੁਕਤੀ)? ਪ੍ਰਸਾਦੁ = ਕਿਰਪਾ। ਮੋਹਿ = ਮੈਂ। ਪਾਈ ਹੈ = ਲੱਭ ਲਈ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Te pregunto, por favor, ¿cómo y de qué forma puede ser mi Liberación, cuando por Tu Gracia, ya estoy liberado y redimido? (1-Pausa)"