[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੀਵਤ ਰਾਮ ਰਸੁ; ਅੰਮ੍ਰਿਤ ਗੁਣ ਜਾਸੁ ॥"
page = 195
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He quaffs Lord's elixir, immortalising is whose property."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਹਿਬ ਦੀ ਸੁਧਾਰਸ ਨੂੰ ਪਾਨ ਕਰਦਾ ਹੈ, ਜਿਸ ਦੀ ਸਿਫ਼ਤ ਸੁਰਜੀਤ ਕਰ ਦੇਣਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They drink in the sublime essence of the Lord's Name, the Ambrosial Elixir."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੋ ਰਾਮ ਕੇ ਗੁਨਾ ਕਾ ਜਸ ਰੂਪੀ ਅੰਮ੍ਰਿਤ ਰਸ ਪਾਨ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਰਸ ਪੀਂਦਿਆਂ, ਪਰਮਾਤਮਾ ਦੇ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲੇ ਗੁਣਾਂ ਦਾ ਜਸ ਗਾਂਦਿਆਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੀਵਤ = ਪੀਂਦਿਆਂ। ਰਾਮ ਰਸੁ = ਰਾਮ ਦੇ ਨਾਮ ਦਾ ਰਸ। ਅੰਮ੍ਰਿਤ ਗੁਣ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲੇ ਗੁਣ। ਅੰਮ੍ਰਿਤ ਜਾਸੁ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਜਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Toda el hambre y la sed son saciadas bebiendo a los Pies del Señor,"