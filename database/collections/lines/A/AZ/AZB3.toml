[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੋਜਨ ਪੂਰਨ; ਰਹੇ ਅਘਾਈ ॥੧॥"
page = 390
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "they remain satiated with the Name's perfect food."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਨਾਮ ਦੇ ਮੁਕੰਮਲ ਖਾਣੇ ਨਾਲ ਰੱਜੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "are satisfied and fulfilled with the perfect food. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਗਿਆਨ ਭੋਜਨ ਸੇ ਅਘਾਇ ਕਰ ਪੂਰਨ ਹੋ ਰਹੇ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਮੁੱਕ ਨਾਮ-ਭੋਜਨ ਦੀ ਬਰਕਤਿ ਨਾਲ ਉਹ (ਮਾਇਆ ਦੀ ਤ੍ਰਿਸ਼ਨਾ ਵਲੋਂ ਸਦਾ) ਰੱਜਿਆ ਰਹਿੰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੋਜਨ ਪੂਰਨ = ਅਮੁੱਕ ਨਾਮ-ਭੋਜਨ ਦੀ ਬਰਕਤਿ ਨਾਲ। ਅਘਾਈ ਰਹੇ = ਅਘਾਇ ਰਹੇ, ਰੱਜਿਆ ਰਹਿੰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "está satisfecho con el alimento Perfecto del Naam, el Nombre del Señor. (1)"