[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਵਨ ਅਹਾਰੀ ਹੁਇ ਰਹਿਓ; ਬਰੁ ਦੀਨੋ ਭਗਵਾਨ ॥੧੭੩੮॥"
page = 471

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Eating and drinking and subsisting only on air, then the Lord bestowed on him a boon.1738."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਪੌਣ ਆਹਾਰੀ ਹੋਇਆ ਰਿਹਾ। (ਤਦ) ਭਗਵਾਨ ਨੇ (ਇਸ ਨੂੰ) ਵਰ ਦਿੱਤਾ ਸੀ ॥੧੭੩੮॥"