[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਾਣੀ ਪਖਾ ਪੀਹਣਾ, ਨਿਤ ਕਰੈ ਮਜੂਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He fetches water, fans the congregation, grinds flour (for latigar) and does all manual jobs."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਾਣੀ (ਭਰਦੇ), ਪੱਖਾ (ਝੱਲਦੇ), (ਚੱਕੀ) ਪੀਹਣ (ਦੀ) ਮਜੂਰੀ ਨਿੱਤ ਕਰਦੇ ਹਨ।"