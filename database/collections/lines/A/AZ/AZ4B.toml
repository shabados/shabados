[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦਿਤਾ ਲਈਯੇ ਆਪਣਾ; ਅਣਿਦਿਤਾ ਕਛੁ ਹਥਿ ਨ ਆਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "You get your own; given nothing cannot bring to you anything."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਦਿੱਤਾ ਲਈਦਾ ਹੈ, ਬਿਨਾਂ ਦਿੱਤੇ ਕੁਝ ਹੱਥ ਨਹੀਂ ਆਉਂਦਾ।"