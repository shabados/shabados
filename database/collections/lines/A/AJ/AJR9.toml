[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਡੇਮੂ ਖਖਰ ਜੋ ਛੁਹੈ; ਦਿਸੈ ਮੁਹਿ ਸੂਣੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Whosoever will touch the hive of poisonous wasps will find his face swollen."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਡੇਮੂੰ ਦੀ ਖੱਖਰ ਨੂੰ ਜੋ ਹੱਥ ਪਾਉ, ਉਸ ਦਾ ਮੂੰਹ ਸੁਜਿਆ ਹੋਇਆ ਦਿੱਸੂ।"