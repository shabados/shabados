[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨੈਨ ਕੁਰੰਗਨ ਸੇ ਤੁਮਰੇ; ਕੇਹਰਿ ਕੀ ਕਟਿ ਰੀ, ਸੁਨ ਤ੍ਵੈ ਹੈ ॥"
page = 365

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Your eyes are like these of a doe and the waist is slim like that of a lioness"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨੀ! ਸੁਣ, ਤੇਰੇ ਨੈਣ ਹਿਰਨ ਵਰਗੇ ਹਨ ਅਤੇ ਲਕ ਸ਼ੇਰ ਵਰਗਾ ਹੈ।"