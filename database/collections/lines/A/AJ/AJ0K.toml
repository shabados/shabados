page = 373
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Honour, renown, dignity, greatness,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਜ਼ਤ, ਮਹਿਮਾਂ, ਉੱਚ-ਪਦਵੀ, ਵਡਿਆਈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Likewise, honor, fame, dignity and greatness,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਪਤਿ) ਪ੍ਰਤਿਸ੍ਟਾ ਔ ਸੋਭਾ ਔਰ ਮਾਨ (ਮਹਤੁ) ਬਡਪਨ ਬਣਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇੱਜ਼ਤ, ਸੋਭਾ, ਆਦਰ, ਵਡਿਆਈ (ਭੀ ਮਿਲ ਜਾਏ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿ = ਇਜ਼ਤ। ਮਹਤੁ = ਵਡਿਆਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así también el honor, el esplendor,"