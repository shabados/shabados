[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਈ ਕਹਤਉ; ਅਨੰਨਿ ਭਗਉਤੀ ॥"
page = 912
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "One declares that he is the worshipper of the One Lord alone,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਜ਼ਾਹਰ ਕਰਦਾ ਹੈ ਕਿ ਉਹ ਕੇਵਲ ਇੱਕ ਪ੍ਰਭੂ ਦਾ ਹੀ ਉਪਾਸ਼ਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some claim that they are devotees of the One Lord alone."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਕਹਿਤਾ ਹੈ ਮੈਂ ਅਵਿਰਲ ਭਗਤ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਇਹ ਆਖਦਾ ਹੈ ਕਿ ਮੈਂ ਅਨੰਨ ਭਗਉਤੀ ਹਾਂ (ਹੋਰ ਆਸਰੇ ਛੱਡ ਕੇ ਸਿਰਫ਼ ਭਗਵਾਨ ਦਾ ਭਗਤ ਹਾਂ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹਤਉ = ਕਹਤਾ, ਆਖਦਾ ਹੈ। ਅਨੰਨਿ = {अनन्य। न अन्य} ਕੋਈ ਹੋਰ ਆਸਰਾ ਨਾਹ ਤੱਕਣ ਵਾਲਾ। ਭਗਉਤੀ = ਭਗਵਾਨ ਦੀ ਭਗਤੀ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunos sólo pretenden ante la gente alabar al Único Señor."