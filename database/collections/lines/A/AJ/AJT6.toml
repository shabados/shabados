[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਭਏ ਅਭਿਮਾਨੀ ॥"
page = 275
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many myriads are self-conceited."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਕ੍ਰੋੜਾਂ ਸਵੈ-ਹੰਕਾਰੀ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions become self-centered."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਈ ਕ੍ਰੋੜੋਂ ਜਗਤ ਮੇਂ ਅਭਿਮਾਨੀ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਜਗਤ-ਰਚਨਾ ਵਿਚ) ਕਰੋੜਾਂ ਅਹੰਕਾਰੀ ਜੀਵ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਭਿਮਾਨੀ = ਅਹੰਕਾਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones de hombres se regocijan en su propio ego."