[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ ਕਾ; ਇਹੈ ਗੁਨਾਉ ॥"
page = 272
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This is the attribute of the knower of God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਹੈ ਗੁਣ ਵਾਹਿਗੁਰੂ ਨੂੰ ਜਾਣਨ ਵਾਲੇ ਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is the quality of the God-conscious being:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਬ੍ਰਹਮ ਗਿਆਨੀ ਕਾ ਸੁਭਾਵਕ ਇਹ (ਗੁਨਾਉ) ਗੁਣ ਹੈ, ਜੋ ਤਿਨ ਕੇ ਸਮੀਪ ਆਵਤਾ ਹੈ ਤਿਨੋਂ ਕਾ ਜੜਤਾ ਰੂਪ ਪਾਲਾ ਔ ਅਗਿਆਨ ਅੰਧੇਰਾ ਔ ਜਨਮਾਦਿਕੋਂ ਕਾ ਭੈ ਅਗਨੀ ਵਤ ਦੂਰ ਕਰ ਦੇਤਾ ਹੈ"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮਗਿਆਨੀ ਮਨੁੱਖਾਂ ਦਾ (ਭੀ) ਇਹੀ ਗੁਣ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਨਾਉ = ਗੁਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El hombre de Dios tiene un valor ilimitado;"