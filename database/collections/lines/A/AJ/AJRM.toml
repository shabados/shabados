[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਮਕਾਰ. ਬੀਜੁਲ ਤਹੀ ॥"
page = 657
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There they glitter like lightning."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਓਥੇ ਉਹ ਬਿਜਲੀ ਦੀ ਤਰ੍ਹਾਂ ਲਿਸ਼ਕਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They sparkle and glitter like lightning."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਤਹਾਂ ਹੀ ਤਿਸ ਕੀ ਸੱਤਾ ਕਾ ਬਿਜਲੀ ਸਮ ਪ੍ਰਕਾਸ਼ ਹੋ ਰਹਾ ਹੈ, ਭਾਵ ਸੇ ਜੀਵ ਕਲਾ ਕਾ ਤਹਾਂ ਹੀ ਨਿਵਾਸ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਉੱਥੇ (ਗੁਰੂ ਦੀ ਮਿਹਰ ਸਦਕਾ, ਮਾਨੋ) ਬਿਜਲੀ ਦੀ ਲਿਸ਼ਕ (ਵਰਗਾ ਚਾਨਣ) ਹੈ (ਤੇ ਉਹ ਰਤਨ ਦਿੱਸ ਪਏ ਹਨ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਹੀ = ਉਸੇ (ਹਿਰਦੇ) ਵਿਚ। ਚਮਕਾਰ = ਲਿਸ਼ਕ, ਚਾਨਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Su Luz brilla como relámpago."