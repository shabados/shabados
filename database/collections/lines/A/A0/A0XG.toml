[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਉਸੁ ਬੰਧਨ; ਨਾ ਹਮ ਬਾਧੇ ॥"
page = 391
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He has no entanglements, nor am I in bondage."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕੋਈ ਜੰਜਾਲ ਨਹੀਂ, ਤੇ ਨਾਂ ਹੀ ਮੈਂ ਫਾਥਾ ਹੋਇਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is not bound, so I am not in bondage."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾ ਉਸ ਕੋ ਮਾਯਾ ਕਾ ਬੰਧਨ ਹੈ ਨ ਹਮ ਮਾਯਾ ਕਰ ਕੇ ਬਾਂਧੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪਰਮਾਤਮਾ ਨੂੰ ਮਾਇਆ ਦੇ ਬੰਧਨ ਜਕੜ ਨਹੀਂ ਸਕਦੇ (ਇਸ ਵਾਸਤੇ ਅਸਲ ਵਿਚ) ਅਸੀਂ ਭੀ ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਬੱਝੇ ਹੋਏ ਨਹੀਂ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ni Él tiene ataduras, ni yo estoy amarrado."