[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਣ ਅਮੋਲਕ; ਪਾਏ ਨ ਜਾਹਿ ॥"
page = 361
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The invaluable excellences cannot be acquired."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਣਮੁੱਲੀਆਂ ਖੂਬੀਆਂ ਪਰਾਪਤ ਕੀਤੀਆਂ ਨਹੀਂ ਜਾ ਸਕਦੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The invaluable merits cannot be acquired."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹ ਅਮੋਲਕ ਗੁਣ ਬਿਨਾਂ ਅਕਾਲ ਪੁਰਖ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਪਾਏ ਨਹੀਂ ਜਾਤੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਗੁਣਾਂ ਦਾ ਮੁੱਲ ਨਹੀਂ ਪੈ ਸਕਦਾ, ਕਿਸੇ ਭੀ ਕੀਮਤਿ ਤੋਂ ਮਿਲ ਨਹੀਂ ਸਕਦੇ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Méritos del Señor son Invaluables,"