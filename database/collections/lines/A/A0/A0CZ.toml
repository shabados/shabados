[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਥਿਰੁ ਸਾਧ ਸਫਰੀਆ ॥"
page = 537
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Eternal is the saints congregation,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਡੋਲ ਹੈ ਸਤਿ ਸੰਗਤ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Eternal is the Company of the Holy,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੀ (ਸਫਰੀਆ) ਸੰਗਤ ਸਥਿਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਿਰਫ਼ ਗੁਰੂ ਦੀ ਸੰਗਤ ਹੀ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਟਿਕਾਣਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਫਰੀਆ = ਸਫ਼, ਸਭਾ, ਸੰਗਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo la Sociedad de los Santos es Eterna,"