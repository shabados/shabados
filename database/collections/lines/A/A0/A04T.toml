type = "primary"
data = "ਵੇਹ ਆਨਿ ਜਸੂਸ ਬਤਾਇ ਦਏ ॥੧੦॥੩੦੦॥"
page = 153

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But the spies gave the news (of the presence of his brothers there).10.300."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਧਰ ਜਸੂਸ ਨੇ ਆ ਕੇ ਦਸ ਦਿੱਤਾ (ਕਿ ਅਸੁਮੇਧ ਤੇ ਅਸੁਮੇਦ ਅੰਦਰ ਹੀ ਹਨ) ॥੧੦॥੩੦੦॥"