[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਕੂਟਨੁ; ਮੁਕਤਿ ਬਹੁ ਪਾਵੈ ॥੧॥"
page = 872
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that pander obtains perfect salvation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਭੜੂਆ ਪੂਰਨ ਮੁਕਤੀ ਨੂੰ ਪਰਾਪਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "such a pimp attains total liberation. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਕੂਟਨੇਹਾਰਾ ਤਬ ਬਹੁਤ ਮੁਕਤੀਓਂ ਕੋ ਪਾਇ ਲੇਤਾ ਹੈ। ਭਾਵ ਸੇ ਸਲੋਕ ਸਮੀਪ ਸਰੂਪ ਸੁਜੁਜ ਪੁਨਹ ਕੇਵਲ ਇਨ ਪੰਚ ਪ੍ਰਕਾਰ ਕੀ ਮੁਕਤੀ ਕੋ ਪਾਵਤਾ ਹੈ, (ਬਹੁ) ਕੂਟਨੇ ਵਾਲਾ ਪੁਰਖ ਮੁਕਤਿ ਕੋ ਪਾਇ ਲੇਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ (ਆਪਣੇ ਮਨ ਨੂੰ ਕੁੱਟਣ ਵਾਲਾ) 'ਕੂਟਨ' ਮੁਕਤੀ ਹਾਸਲ ਕਰ ਲੈਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "tal ser obtiene la liberación.(1)"