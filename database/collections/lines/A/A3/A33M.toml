[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰਾ ਅੰਤਰਜਾਮੀ ਹਰਿ ਰਾਇਆ ॥"
page = 1003
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My God, the King, is the inner knower."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਡਾਂ ਵਾਹਿਗੁਰੂ ਪਾਤਿਸ਼ਾਹ ਅੰਦਰਲੀਆਂ ਜਾਣਨਾ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My Sovereign Lord is the Inner-knower, the Searcher of hearts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਹਰੀ ਰਾਜਾ ਅੰਤਰ੍ਯਾਮੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪੰਡਿਤ!) ਮੇਰਾ ਪ੍ਰਭੂ-ਪਾਤਿਸ਼ਾਹ ਸਭ ਦੇ ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲਾ ਹੈ (ਉਹ ਬਾਹਰਲੇ ਭੇਖਾਂ ਉੱਦਮਾਂ ਨਾਲ ਨਹੀਂ ਪਤੀਜਦਾ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ ਰਾਇਆ = ਪ੍ਰਭੂ ਪਾਤਿਸ਼ਾਹ। ਅੰਤਰਜਾਮੀ = ਸਭ ਦੇ ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios, mi Rey, es el Conocedor Íntimo de los corazones y Él, el Bienamado de mi Alma, sabe todo lo que está en mí."