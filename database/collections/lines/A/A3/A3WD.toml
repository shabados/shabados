[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦਾ ਸਦਾ ਜਾਈ ਬਲਿਹਾਰੀ ॥"
page = 1077
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever, ever am I a sacrifice unto Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਦੀਵ, ਸਦੀਵ ਹੀ ਮੈਂ ਤੇਰੇ ਉਤੋਂ ਕੁਰਬਾਨ ਵੰਝਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forever and ever, I am a sacrifice to You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਤੇ ਮੇਂ ਸਦੀਵਕਾਲ ਬਲਿਹਾਰੇ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੈਥੋਂ ਸਦਾ ਹੀ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਈ = ਜਾਈਂ, ਮੈਂ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi Maestro Infinito e Insondable,"