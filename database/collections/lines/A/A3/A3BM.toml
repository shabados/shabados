[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੋ ਬਨਜੁ; ਏਕੋ ਬਿਉਹਾਰੀ ॥"
page = 181
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Their is but one trade, and one occupation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦਾ ਕੇਵਲ ਇਕ ਵਪਾਰ ਹੈ ਅਤੇ ਇਕ ਹੀ ਕਾਰ ਵਿਹਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is only one trade, and one occupation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਨਾਮ ਕਾ ਹੀ ਜਪਣਾਂ ਜਪਾਉਣਾ ਰੂਪ ਬਨਜ ਕਰਤੇ ਹੈਂ ਔਰ ਸਰਬ ਬਿਉਹਾਰੋਂ ਵਾਲਾ ਏਕ ਕੋਈ ਨਿਸਚੇ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹੀ ਉਹਨਾਂ ਦਾ ਵਣਜ ਹੈ, ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦੇ ਹੀ ਉਹ ਸਦਾ ਵਪਾਰੀ ਬਣੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਉਹਾਰੀ = ਵਪਾਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Comercia sólo una cosa y solamente lo hace con el Uno,"