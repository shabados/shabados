[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚਿਤੈ ਅੰਦਰਿ, ਚੇਤੁ ਚਿਤੇਰੇ ॥੧੭॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "0 man, remember the artist of this artistic creation!"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਚਿੱਤ੍ਰਕਾਰੀ (ਰਚਨਾਂ) ਵਿਚ ਚਿਤੇਰੇ (ਵਾਹਿਗੁਰ) ਨੇ ਚੇਤ (ਸਿਮਰਣ ਕਰ)।"