[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਸੰਤ ਭਾਵੈ; ਤਾ ਓਇ ਭੀ ਗਤਿ ਪਾਹਿ ॥੨॥"
page = 280
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, if it pleases the saints, then, he too obtains salvation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਜੇਕਰ ਸਾਧੂ ਨੂੰ ਚੰਗਾ ਲੱਗੇ, ਤਦ ਉਹ ਭੀ ਮੁਕਤੀ ਪਾ ਲੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, if it pleases the Saint, even then, he may be saved. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜੇਕਰ ਸੰਤ ਚਾਹੇ ਤਬ ਵਹੁ ਨਿੰਦਕ ਭੀ ਗਤੀ ਅਰਥਾਤ ਮੋਖ ਕੋ ਪਾਇ ਲੇਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹਾਂ) ਹੇ ਨਾਨਕ! ਜੇ ਸੰਤਾਂ ਨੂੰ ਭਾਵੇ ਤਾਂ ਉਹ ਨਿੰਦਕ ਭੀ ਚੰਗੀ ਅਵਸਥਾ ਤੇ ਅੱਪੜ ਜਾਂਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਇ = ਨਿੰਦਾ ਕਰਨ ਵਾਲੇ। ਪਾਹਿ = ਪਾ ਲੈਂਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, a pesar de ello puede ser elevado si el Santo se compadece de él.(2)"