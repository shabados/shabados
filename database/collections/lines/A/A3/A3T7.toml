[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਸਾਹਿਬੁ ਆਪੇ ਹੈ ਰਾਖਾ; ਆਪੇ ਰਹਿਆ ਸਮਾਏ ॥"
page = 554
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself is the Lord, Himself the Protector and Himself is contained in His creation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪ ਸੁਆਮੀ ਹੈ, ਆਪ ਹੀ ਰਖਵਾਲਾ ਅਤੇ ਆਪ ਹੀ ਆਪਣੀ ਰਚਨਾ ਅੰਦਰ ਲੀਨ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is the Lord and Master, and He Himself is the Protector; He Himself is permeating and pervading everywhere."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਸਾਹਿਬ ਹੈ ਆਪ ਹੀ ਰਖ੍ਯਕ ਹੈ, ਆਪ ਹੀ ਤਿਨ ਬਨਤ੍ਰਿਨੋ ਮੇਂ ਅਭੇਦ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਲਕ ਭੀ ਆਪ ਹੈ ਤੇ ਰਾਖਾ ਭੀ ਆਪ ਹੈ, ਆਪ ਹੀ ਸਭ ਥਾਈਂ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo es el Señor, el Protector y el Maestro, Él Mismo se inmerge en lo que Él crea."