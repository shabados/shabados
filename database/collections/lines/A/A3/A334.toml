[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਇਛੈ; ਸੋਈ ਫਲੁ ਪਾਏ ॥"
page = 1148
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man obtains the fruit which he wishes for,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੰਦਾ ਉਹ ਮੇਵਾ ਪਾ ਲੈਂਦਾ ਹੈ, ਜਿਸ ਨੂੰ ਉਹ ਚਾਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You shall receive the fruits of your desires,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਪੁਰਸ ਮਨ ਇਛਤ ਫਲ ਕੋ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਜੋ ਕੁਝ (ਪਰਮਾਤਮਾ ਪਾਸੋਂ) ਮੰਗਦਾ ਹੈ ਉਹੀ ਫਲ ਹਾਸਲ ਕਰ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਛੈ = ਇੱਛਾ ਕਰਦਾ ਹੈ, ਲੋੜਦਾ ਹੈ, ਮੰਗਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo que sea que uno desea eso obtiene si uno enaltece el Naam,"