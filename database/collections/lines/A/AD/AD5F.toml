type = "primary"
data = "ਕਹੂੰ ਬੀਰ ਲੁਟੈ ॥੨੭੬॥"
page = 579

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Where the warriors have gathered, there they are striking the blows of their arms, they are fearlessly chopping with their weapons and killing the fighters.276."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ ਸੂਰਮੇ ਲੁੜਕ ਰਹੇ ਹਨ ॥੨੭੬॥"