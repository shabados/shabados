[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਉਠੈ ਜਉਨ ਕੇ ਰੂਪ ਕੀ ਜ੍ਵਾਲ ਮਾਲੰ ॥੬੭॥"
page = 632

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O princess! see that king, the master of riches, from whose body the fires of beauty are arising.”67."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਰੂਪ ਤੋਂ ਅੱਗ ਦੀਆਂ ਚਿਣਗਾਂ ਉਠਦੀਆਂ ਹਨ ॥੬੭॥"