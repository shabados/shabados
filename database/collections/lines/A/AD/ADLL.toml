[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਾਰੇ ਹੀ ਉਸ ਦੀ ਮਿਹਰ ਅਤੇ ਬਖ਼ਸ਼ਿਸ਼ ਦੇ ਜਾਚਕ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਹਮਾ ਖ਼ਾਸਤਗਾਰਿੰਦਾਇ ਲੁਤਫ਼ਿ ਊ ॥੪੬॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, All of them are the seekers of his blessings and bestowals. (46)"