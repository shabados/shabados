[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਕਤੁ ਲੋਭੀ; ਇਹੁ ਮਨੁ ਮੂੜਾ ॥"
page = 415
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This foolish soul is perverse and avaricious."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਮੂਰਖ ਆਤਮਾ ਪ੍ਰਤੀਕੂਲ ਅਤੇ ਲਾਲਚੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This foolish mind is perverted and greedy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਕਤ ਲੋਭੀਓਂ ਕਾ ਇਹ ਮਨ ਮੂਰਖ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ-ਵੇੜ੍ਹਿਆ ਇਹ ਮਨ ਲਾਲਚੀ ਬਣ ਜਾਂਦਾ ਹੈ, ਮੂਰਖ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂੜਾ = ਮੂਰਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y después, borracha de poder se vuelve salvaje e ignorante."