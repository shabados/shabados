assets = ["DGDG"]
type = "primary"
data = "ਜਾਡ ਭਏ ਤਰਕਸ ਅਟਕਾਯੋ ॥"
page = 994

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She did not wake her friend up but took his quiver and hung it Over the tree."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜੰਡ ਨਾਲ ਤਰਕਸ (ਭੱਥਾ) ਟੰਗ ਦਿੱਤਾ।"