[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਉਨ ਬਸਤੁ; ਆਈ ਤੇਰੈ ਸੰਗ ॥"
page = 283
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What thing has come with thee,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿਹੜੀ ਚੀਜ਼ ਤੇਰੇ ਨਾਲ ਆਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What things did you bring with you?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੌਨ ਵਸਤੂ ਤੇਰੇ ਸਾਥ ਆਈ ਹੈ ਅਰਥਾਤ ਸਾਥ ਕੁਛੁ ਨਹੀਂ ਆਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਦੱਸ) ਕੇਹੜੀ ਚੀਜ਼ ਤੇਰੇ ਨਾਲ ਆਈ ਸੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਸਤੁ = ਚੀਜ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Te has preguntado qué fue lo que a esta vida te trajo?"