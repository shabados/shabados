[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਤਿ ਬਲਿਸਟ, ਦਲ ਦੁਸਟ ਨਿਕੰਦਨ ॥"
page = 130

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art Most Powerful and Destroyer of the forces of the tyrants."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਤੁਸੀਂ) ਬਹੁਤ ਬਲਵਾਨ ਅਤੇ ਦੁਸ਼ਟਾਂ ਦੇ ਦਲਾਂ ਨੂੰ ਨਸ਼ਟ ਕਰਨ ਵਾਲੇ (ਨਿਕੰਦਨ)"