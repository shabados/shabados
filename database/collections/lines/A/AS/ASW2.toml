[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੋਹਿ ਬੈਰਾਗੁ ਭਇਓ ॥"
page = 870
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am saddened by this thought,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਇਸ ਖਿਆਲ ਨੇ ਉਦਾਸ ਕਰ ਦਿੱਤਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have become sad,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੁਝੇ ਇਸ ਖਿਆਲ ਨੇ ਉਦਾਸ ਕਰ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਨ ਵਿੱਚ (ਹੋਰਨਾਂ ਗੱਲਾਂ ਵਲੋਂ) ਉਪਰਾਮਤਾ ਹੋ ਰਹੀ ਹੈ, (ਮੈਨੂੰ ਹੋਰ ਗੱਲਾਂ ਗ਼ੈਰ-ਜ਼ਰੂਰੀ ਜਾਪਦੀਆਂ ਹਨ।)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਿ = ਮੈਨੂੰ। ਬੈਰਾਗੁ ਭਇਓ = (ਹੋਰਨਾਂ ਗੱਲਾਂ ਵਲੋਂ) ਉਪਰਾਮਤਾ ਹੋ ਰਹੀ ਹੈ, ਮੈਨੂੰ ਹੋਰ ਗੱਲਾਂ ਗ਼ੈਰ-ਜ਼ਰੂਰੀ ਜਾਪਦੀਆਂ ਹਨ; ਹੋਰਨਾਂ ਗੱਲਾਂ ਵੱਲੋਂ ਹਟ ਕੇ ਮੈਨੂੰ ਇਹ ਸੋਚ ਫੁਰ ਰਹੀ ਹੈ ਕਿ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me entristece pensar"