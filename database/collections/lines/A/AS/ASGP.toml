[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਰਉਪਕਾਰ ਕਮਾਂਵਦਾ; ਉਨਿ ਆਪੁ ਗਵਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Erasing ego it does altruistic deeds;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਾ ਭਾਵ ਗਵਾਕੇ ਪਰੋਪਕਾਰ ਕਮਾਉਂਦਾ ਹੈ।"