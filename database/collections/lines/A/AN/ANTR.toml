[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਘਾਯਲ ਜ︀ਯੋ ਘੂੰਮਤ ਰਹੀ ਬਿਨਾ ਤਿਹਾਰੇ ਰਾਇ ॥੫੪॥"
page = 935

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘I have been rolling around like an injured person.(54)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਜਨ! ਤੇਰੇ ਬਿਨਾ ਮੈਂ ਘਾਇਲ ਵਾਂਗ ਘੁੰਮਦੀ ਫਿਰਦੀ ਹਾਂ ॥੫੪॥"