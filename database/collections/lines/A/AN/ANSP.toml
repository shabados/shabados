[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ; ਪ੍ਰਭ ਬੰਧਨ ਛੋਟ ॥"
page = 194
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Showing His mercy, the Lord has freed me of the fetters,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਮਿਹਰ ਧਾਰ ਕੇ, ਸੁਆਮੀ ਨੇ ਮੈਨੂੰ ਬੇੜੀਆਂ ਤੋਂ ਆਜਾਦ ਕਰ ਦਿਤਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Granting His Grace, God has released me from bondage."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੀ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਪ੍ਰਭੂ ਨੈ ਬੰਧਨੋਂ ਸੇ ਛੁਡਾਇ ਦੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਮਾਇਆ ਦੇ ਬੰਧਨਾਂ ਤੋਂ ਖ਼ਲਾਸੀ ਦੇਣ ਵਾਲੇ ਪ੍ਰਭੂ ਜੀ ਨੇ ਮਿਹਰ ਕਰ ਕੇ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ ਬੰਧਨ ਛੋਟ = ਮਾਇਆ ਦੇ ਬੰਧਨਾਂ ਤੋਂ ਖ਼ਲਾਸੀ ਦੇਣ ਵਾਲੇ ਪ੍ਰਭੂ ਜੀ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Confiriendo Su Gracia, Dios me ha liberado de mis amarras"