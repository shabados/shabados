[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਿਲ ਦਰੀਆਉ; ਧੋਵਹੁ ਮੈਲਾਣਾ ॥"
page = 1084
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wash away thou thy pollution in the river of thy mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੀ ਪਲੀਤੀ ਨੂੰ ਆਪਣੇ ਮਨ ਦੇ ਦਰਿਆ ਵਿੱਚ ਧੋ ਸੁੱਟ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wash away pollution with the river of your heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦਿਲ ਕੀਆਂ ਪਾਪੋਂ ਰੂਪ ਮੈਲ ਕੋ ਸਤਸੰਗ ਰੂਪ ਦਰਿਆਉ ਮੇਂ ਧੋਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਦਿਲ ਵਿਚੋਂ ਵਿਤਕਰੇ ਕੱਢ ਕੇ) ਦਿਲ ਨੂੰ ਦਰੀਆ ਬਣਾਣ ਦਾ ਜਤਨ ਕਰ, (ਇਸ ਤਰ੍ਹਾਂ) ਦਿਲ ਦੀ (ਵਿਕਾਰਾਂ ਦੀ) ਮੈਲ ਧੋਇਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੈਲਾਣਾ = ਵਿਕਾਰਾਂ ਦੀ ਮੈਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y lava tu mente sucia en el río del corazón. Sí, si conoces a tu Profeta,"