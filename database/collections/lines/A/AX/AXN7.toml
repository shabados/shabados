[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੀਓ ਸਿੰਗਾਰੁ; ਮਿਲਨ ਕੇ ਤਾਈ ॥"
page = 483
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have decorated myself for meeting my Spouse."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਕੰਤ ਨੂੰ ਮਿਲਣ ਲਈ ਹਾਰਸ਼ਿੰਗਾਰ ਲਾਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have decorated myself to meet my Husband Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਨੇ ਸਭ ਸਾਧਨ ਰੂਪ ਸਿੰਗਾਰ ਮਿਲਨੇ ਕੇ ਵਾਸਤੇ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਪਤੀ-ਪ੍ਰਭੂ ਨੂੰ ਮਿਲਣ ਲਈ ਹਾਰ-ਸਿੰਗਾਰ ਲਾਇਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੇ ਤਾਈ = ਦੀ ਖ਼ਾਤਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He adornado mi ser para encontrar a mi Señor, pero el Señor,"