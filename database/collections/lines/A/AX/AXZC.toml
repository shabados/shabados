[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕੀ ਚਾਕਰੀ; ਕਰਹੁ ਬਿਸੇਖਾ ॥੬॥"
page = 238
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His service, do thou perform well, O man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਨੌਕਰੀ ਤੂੰ ਚੰਗੀ ਤਰ੍ਹਾਂ ਵਜਾ ਹੇ ਬੰਦੇ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So serve Him with distinction. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੀ ਚਾਕਰੀ ਅਧਿਕਤਾ ਕਰ ਕੇ ਕਰੋ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪਰਮਾਤਮਾ ਦੀ ਸੇਵਾ-ਭਗਤੀ ਉਚੇਚੇ ਤੌਰ ਤੇ ਕਰਦੇ ਰਹੁ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਾਕਰੀ = ਸੇਵਾ। ਬਿਸੇਖਾ = ਉਚੇਚੀ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sirve a Dios entonces, con una mente consciente. (6)"