[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਤਿਤ. ਪੁਨੀਤ; ਪ੍ਰਭ ਤੇਰੋ ਨਾਮੁ ॥"
page = 898
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Purifier of sinners is Thy Name, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਪੀਆਂ ਨੂੰ ਪਵਿੱਤਰ ਕਰਨ ਵਾਲਾ ਹੈ ਤੇਰਾ ਨਾਮ, ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your Name, God, is the Purifier of sinners."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭ! ਤੇਰਾ ਨਾਮੁ ਪਾਪੀਓਂ ਕੋ ਪਵਿਤ੍ਰ ਕਰਨੇਹਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰਾ ਨਾਮ ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗੇ ਹੋਇਆਂ ਨੂੰ ਪਵਿੱਤਰ ਕਰਨ ਵਾਲਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿਤ = ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗੇ ਹੋਏ। ਪੁਨੀਤ = ਪਵਿੱਤਰ। ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, Tu Nombre purifica a todos los malhechores."