[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਊਧਵ ਜੋ ਸੁਭ ਸਤ੍ਰੁ ਕਉ ਮਾਰਿ; ਕਹਿਓ ਸੁ ਸਭੈ ਹਰਿ ਮਾਨ ਲੀਓ ॥"
page = 531

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Everyone agreed with Udhava regarding the killing of the enemy"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਊਧਵ ਨੇ ਵੈਰੀ ਨੂੰ ਮਾਰਨ ਦੀ ਜੋ ਸ਼ੁਭ (ਵਿਧੀ) ਕਹੀ, ਉਹ ਸਾਰੀ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਨੇ ਮੰਨ ਲਈ।"