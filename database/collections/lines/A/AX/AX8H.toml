type = "primary"
data = "ਛਪੈ ਛੰਦ ॥ ਤ੍ਵ ਪ੍ਰਸਾਦਿ ॥"
page = 1
line = 3

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਭਾਈ ਤਲਵਾੜਾ ਜੀ ਨੇ \"ਤ੍ਵ\" ਦਾ ਉਚਾਰਨ \"ਤੁਅ\" ਦਸਿਆ ਹੈ। ਕਈ ਗੁਰਸਿਖ ਪੈਰ ਵਿਚ \"ਵ\" ਦਾ ਅੱਧਾ (ਪੋਲਾ ਜਿਹਾ) ਉਚਾਰਨ ਇਸ ਤਰੀਕੇ ਨਾਲ ਕਰਦੇ ਹਨ ਕਿ ਇਹ \"ਤਵ\" ਵਾਂਗ ਨਾ ਹੋਵੇ।"

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "CHHAPAI STANZA. BY THY GRACE"

[[content]]
assets = ["RSJD"]
type = "translation"
