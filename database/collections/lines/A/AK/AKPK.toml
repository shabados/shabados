[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਵਡਭਾਗੀ; ਨਿਹਚਲ ਥਾਨੁ ॥"
page = 197
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Very lucky and stable is the place,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਰੇ ਨਸੀਬਾਂ ਵਾਲੀ ਅਤੇ ਅਸਥਿਰ ਹੈ ਉਹ ਜਗ੍ਹਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Very blessed, stable and sublime is that place,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਵੱਡੇ ਭਾਗੋਂ ਵਾਲਾ ਨਿਸਚਲ ਅਸਥਾਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਉਹ ਹਿਰਦਾ-ਥਾਂ ਵੱਡੇ ਭਾਗਾਂ ਵਾਲਾ ਹੈ ਉਹ ਹਿਰਦਾ ਸਦਾ ਅਡੋਲ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਥਾਨੁ = ਥਾਂ, ਹਿਰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Afortunado y Eterno es el lugar"