[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਵਤ ਹੀ ਬਰਮਾਕ੍ਰਿਤ ਜੂ; ਅਰਿ ਸੈਨਹੁ ਤੇ ਸੁ ਘਨੇ ਭਟ ਕੂਟੇ ॥"
page = 474

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Kratvarma on coming chopped down many warriors"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਰਮਾਕ੍ਰਿਤ ਜੀ ਨੇ ਆਉਂਦਿਆਂ ਹੀ ਵੈਰੀ ਦੀ ਸੈਨਾ ਦੇ ਬਹੁਤ ਸਾਰੇ ਯੋਧੇ ਕੁਟ ਸੁਟੇ ਹਨ।"