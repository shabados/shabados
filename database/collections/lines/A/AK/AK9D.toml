data = "ਅਨਸੂਆ ਨਾਮ ਗੁਨ ਗਨ ਮਹਾਨ ॥"
page = 636

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Ansuya also, in consonance with her name, inspection being a charming lady, performed austerities"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਨਸੂਆ ਨਾਂ ਵਾਲੀ (ਉਹ ਇਸਤਰੀ) ਗੁਣਾਂ ਦਾ ਸਮੂਹ ਸੀ।"