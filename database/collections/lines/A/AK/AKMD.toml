[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਮੀ ਕਰਮੀ; ਹੋਇ ਵੀਚਾਰੁ ॥"
page = 7
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They are judged according to their deeds and actions."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੇ ਕੰਮਾਂ ਤੇ ਅਮਲਾ ਅਨੁਸਾਰ ਉਨ੍ਹਾਂ ਦਾ ਫੈਸਲਾ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By their deeds and their actions, they shall be judged."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਕਰਮੀ ਕਰਮੀ) ਅਪਨੇ ਅਪਨੇ ਕਰਮੋਂ ਅਨੁਸਾਰ ਭਿੰਨ ਭਿੰਨ ਜੀਵੋਂ ਕਾ ਵੀਚਾਰੁ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹਨਾਂ ਅਨੇਕਾਂ ਨਾਵਾਂ ਤੇ ਰੰਗਾਂ ਵਾਲੇ ਜੀਵਾਂ ਦੇ) ਆਪੋ-ਆਪਣੇ ਕੀਤੇ ਹੋਏ ਕਰਮਾਂ ਅਨੁਸਾਰ (ਅਕਾਲ ਪੁਰਖ ਦੇ ਦਰ ਤੇ) ਨਿਬੇੜਾ ਹੁੰਦਾ ਹੈ"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਮੀ ਕਰਮੀ = ਜੀਵਾਂ ਦੇ ਕੀਤੇ ਕਰਮਾਂ ਅਨੁਸਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como actuemos aquí así seremos juzgados."