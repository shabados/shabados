[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਡੈ ਮਰਕੈ; ਕਹਿਓ ਜਾਇ ॥"
page = 1194
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sanda and Marka went and complained to the king."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਡੇ ਅਤੇ ਮਰਕੇ ਨੇ ਜਾ ਕੇ ਪਾਤਿਸ਼ਾਹ ਕੋਲ ਸ਼ਿਕਾਇਤ ਕੀਤੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sanda and Marka went to the king to complain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਡੇ ਔ ਅਮਰਕੇ ਨੇ ਹਰਨਾਖਸ ਕੋ ਜਾਇ ਕਰ ਕਹਾ: ਨਾ ਤੋ ਹਮਾਰੀ ਵਿਦ੍ਯਾ ਪੜਤਾ ਹੈ ਔਰ ਨਾ ਰਾਮ ਨਾਮ ਕੋ ਛੋਡਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਹਿਲਾਦ ਦੇ ਅਧਿਆਪਕ) ਸੰਡੇ ਮਰਕੇ (ਅਮਰਕ) ਨੇ ਜਾ ਕੇ (ਹਰਨਾਖਸ਼ ਨੂੰ ਇਹ ਗੱਲ) ਕਹਿ ਦਿੱਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sanad y Marka, sus maestros se quejaron ante el Rey"