[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਅਉਖਧੁ; ਮੋ ਕਉ ਸਾਧੂ ਦੀਆ ॥"
page = 101
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saint has given me the medicine of God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਨੇ ਮੈਨੂੰ ਰੱਬ ਦੇ ਨਾਮ ਦੀ ਦਵਾਈ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Holy Saint has given me the Medicine of the Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਗਵਨ! ਹਰਿ ਨਾਮ ਰੂਪੀ (ਅਉਖਧੁ) ਦਾਰੂ ਗੁਰੋਂ ਨੇ ਮੇਰੇ ਕੋ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਦਾਰੂ (ਹੈ, ਜਦੋਂ) ਮੈਨੂੰ ਗੁਰੂ ਨੇ ਦਿੱਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਉਖਧੁ = ਦਵਾਈ। ਮੋ ਕਉ = ਮੈਨੂੰ। ਸਾਧੂ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Santo me ha aplicado la medicina del Nombre del Señor;"