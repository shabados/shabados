[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਸਹਿਜੇ ਹੀ ਤੂੰ ਇਸ ਦਿਲ ਦਾ ਮਾਲਕ ਬਣ ਜਾਵੇਂ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਬੇ ਤਕੱਲਫ਼ ਸਾਹਿਬਿ ਈਂ ਦਿਲ ਸ਼ਵੀ ॥੪੨੧॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Then, you can be the master of this heart without any (ritual) problems. (421)"