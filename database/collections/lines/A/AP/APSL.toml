[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ ਕੀ; ਓਹੁ ਦੀਖਿਆ ਲੇਇ ॥"
page = 1261
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He receives the instruction of the True Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਸਿੱਖਿਆ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He accepts the Teachings of the True Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਸਤਿਗੁਰੋਂ ਕੀ (ਦੀਖਆ) ਸਿਖ੍ਯਾ ਲੇਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਜਿਹਾ ਪੰਡਿਤ ਗੁਰੂ ਦੀ ਸਿੱਖਿਆ ਗ੍ਰਹਣ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਹੁ = ਉਹ (ਪੰਡਿਤ)। ਦੀਖਿਆ = ਸਿੱਖਿਆ। ਲੇਇ = ਲੈਂਦਾ ਹੈ (ਇਕ-ਵਚਨ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él acepta la Enseñanza"