[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਹਾ ਅਗਨਿ ਤੇ; ਆਪਿ ਉਬਾਰਿਆ ॥"
page = 1005
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From the great fire, the Lord himself saves the man,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਰੀ ਅੱਗ ਤੋਂ ਸਾਈਂ ਖ਼ੁਦ ਇਨਸਾਨ ਨੂੰ ਬਚਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself saves us from the great fire."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਹਾਂ ਅਗਨ ਕਾ ਜੋ ਸਮੁੰਦਰ ਸੰਸਾਰ ਹੈ ਤਿਸ ਸੇ ਅਪਨਾ ਦਾਸ ਰਖ੍ਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਜੀਵਾਂ ਨੂੰ ਮਾਇਆ ਦੀ ਵੱਡੀ ਅੱਗ ਤੋਂ ਆਪ ਹੀ ਸਦਾ ਬਚਾਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਬਾਰਿਆ = ਬਚਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Santos son la mera Encarnación de Él"