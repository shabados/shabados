[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਕਲਾ ਸਮਰਥ ਪ੍ਰਭ; ਪੂਰੇ ਗੁਰਦੇਵ ॥੧॥ ਰਹਾਉ ॥"
page = 811
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Omnipotent Lord, the Possessor of all might is met through the Perfect bright Guru. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਸ਼ਕਤੀਆਂ ਦਾ ਮਾਲਕ ਸਰਬ ਸ਼ਕਤੀਮਾਨ ਸੁਆਮੀ ਪੂਰਨ ਪ੍ਰਕਾਸ਼ਮਾਨ ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਮਿਲਦਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is omnipotent, possessing all powers; He is obtained through the Perfect, Divine Guru. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੂਰਨ ਗੁਰਦੇਵ ਪ੍ਰਭੋ, ਸਰਬ ਕਲਾ ਸਾਮਰਥ! ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਰੀਆਂ ਤਾਕਤਾਂ ਵਾਲੇ ਪ੍ਰਭੂ! ਹੇ ਸਭ ਕੁਝ ਕਰ ਸਕਣ ਵਾਲੇ ਪ੍ਰਭੂ! ਹੇ ਗੁਣਾਂ ਨਾਲ ਭਰਪੂਰ ਪ੍ਰਭੂ! ਹੇ ਸਭ ਤੋਂ ਵੱਡੇ ਦੇਵਤੇ ਪ੍ਰਭੂ! ਤੇਰੀ ਮੇਹਰ ਨਾਲ (ਹੀ ਵਿਕਾਰਾਂ ਤੋਂ) ਬਚ ਸਕੀਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਲਾ = ਤਾਕਤ। ਗੁਰਦੇਵ = ਹੇ ਸਭ ਤੋਂ ਵੱਡੇ ਦੇਵਤੇ! ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios Todopoderoso, eres el Dios de dioses.(1-Pausa)"