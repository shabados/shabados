[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਸਕਲ ਤੁਪਕ ਕੇ ਨਾਮ; ਸੁਬੁਧਿ ਬਿਚਾਰੀਐ ॥੮੮੯॥"
page = 768

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the words “Kans-kesh-karshani”, add the words “jaaachar-nayak-shatru” and consider the names of tupak thoughtfully.889."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਬੁੱਧੀਮਾਨ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝਣ ॥੮੮੯॥"