[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋਇ ਕ੍ਰਿਪਾ ਤੁਮਰੀ ਹਮ ਪੈ ਤੁ ਸਭੈ ਸਗਨੰ ਗੁਨ ਹੀ ਧਰਿ ਹੋਂ ॥"
page = 290

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On receiving Thy Grace, I shall assume all the virtues"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਕ੍ਰਿਪਾ ਹੋਣ ਤੇ ਹੀ ਮੈਂ ਸਾਰੇ ਸ਼ੁਭ ਗੁਣਾਂ ਨੂੰ ਧਾਰਨ ਕਰਾਂਗਾ।"