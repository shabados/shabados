data = "ਜੇ ਜੇ ਤੁਮਰੇ ਧਿਆਨ ਕੋ; ਨਿਤ ਉਠਿ ਧਿਐਹੈ ਸੰਤ ॥"
page = 119

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All those saints, who will ever meditate on Thee"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਦੇਵੀ ਮਾਤਾ!) ਜੋ ਜੋ ਸੰਤ ਨਿੱਤ ਉਠ ਕੇ ਤੇਰਾ ਧਿਆਨ ਧਰਨਗੇ,"