[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਪਾਵਹੁ; ਮਨੁ ਅਗਾਧਿ ॥"
page = 1304
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Incomprehensible Lord shall come into thy mind"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਲਖ ਪ੍ਰਭੂ ਤੇਰੇ ਹਿਰਦੇ ਵਿੱਚ ਆ ਜਾਵੇਗਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Unfathomable Lord shall come into your mind,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਗਾਧ ਹਰੀ! ਮੇਰੇ ਮਨ ਨੇ ਤੇਰੇ ਕੋ (ਪਾਵਹੁ) ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਤਰ੍ਹਾਂ ਉਸ) ਅਥਾਹ ਮਨ (ਦੇ ਮਾਲਕ) ਪ੍ਰਭੂ ਦਾ ਮਿਲਾਪ ਹਾਸਲ ਕਰ ਲਵੋਗੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਵਹੁ = ਲੱਭ ਲਵੋਗੇ, ਮਿਲਾਪ ਹਾਸਲ ਕਰ ਲਵੋਗੇ। ਅਗਾਧਿ = ਅਥਾਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así, el Señor Insondable vendrá a tu mente y,"