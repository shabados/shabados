[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਪਨ ਕੀ ਬਰਜੀ ਨ ਰਹੀ ਤ੍ਰਿਯ; ਕਾਨ੍ਰਹਰ ਕੇ ਮਿਲਬੇ ਕਹੁ ਧਾਈ ॥"
page = 324

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The wives did not stop, though they were forbidden by the Brahmins and ran to meet Krishna"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਾਹਮਣਾਂ ਦੇ ਰੋਕਿਆਂ ਵੀ (ਉਨ੍ਹਾਂ ਦੀਆਂ) ਇਸਤਰੀਆਂ ਨਾ ਰੁਕੀਆਂ ਅਤੇ ਕਾਨ੍ਹ ਨੂੰ ਮਿਲਣ ਲਈ ਭਜ ਤੁਰੀਆਂ।"