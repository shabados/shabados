[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਏ ਖਰੇ ਕਠਿਨ; ਜਮਕੰਕਰਿ ਪਕੜਿ ਲਇਆ ॥"
page = 546
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All hard-hearted myrmidons of death come and seize him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੌਤ ਦੇ ਪਰਮ ਕਠੋਰ ਫਰੇਸ਼ਤੇ ਆ ਕੇ ਊਸ ਨੂੰ ਫੜ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The hard-hearted Messenger of Death comes and seizes him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਭਾਰੀ ਕਠਿਨ ਜਮ ਕੰਕਰ ਆਏ ਤਬ ਮਨਮੁਖ ਕੋ ਪਕੜ ਲਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਖ਼ਰ ਬੜਾ ਨਿਰਦਈ ਜਮਦੂਤ ਆ ਕੇ ਉਸ ਨੂੰ ਫੜਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖਰੇ = ਬਹੁਤ। ਕਠਿਨ = ਨਿਰਦਈ। ਜਮ ਕੰਕਰਿ = ਜਮ-ਕੰਕਰ ਨੇ; ਜਮਦੂਤ ਨੇ {ਇਕ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A la hora de recibir la llamada de la muerte sufre arriado por el lamento"