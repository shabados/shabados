data = "ਮੰਤ੍ਰ ਲੈਨ ਆਯੋ ਹੁਤੋ; ਭਈ ਔਰ ਕੀ ਔਰ ॥੧੪॥"
page = 834

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But the situation is quite contrary (I4)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ (ਮੈਂ ਤਾਂ) ਮੰਤਰ ਲੈਣ ਆਇਆ ਸਾਂ, (ਪਰ ਇਥੇ ਤਾਂ) ਹੋਰ ਦੀ ਹੋਰ ਹੀ (ਗੱਲ) ਬਣ ਗਈ ਹੈ ॥੧੪॥"