[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਰ ਮੰਦਰ ਖੁਸੀਆ ਤਹੀ; ਜਹ ਤੂ ਆਵਹਿ ਚਿਤਿ ॥"
page = 319
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The home, mansion and enjoyments are there, where Thou art heartily remembered."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗ੍ਰਹਿ ਮਹਿਲ ਤੇ ਮੌਜ ਬਹਾਰਾ ਉਥੇ ਹਨ ਜਿਥੇ ਤੂੰ ਦਿਲੋਂ ਯਾਦ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Homes, palaces and pleasures are there, where You, O Lord, come to mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਹਾਰਾਜ! ਘਰ ਔਰ ਮੰਦਰ ਤਹਾਂ ਹੀ ਸਫਲੇ ਹੈਂ ਔਰ ਖੁਸ਼ੀਆਂ ਭੀ ਤਿਸੀ ਅਸਥਾਨ ਮੇਂ ਹੈਂ ਜਹਾਂ ਤੂੰ  ਚਿਤ ਆਵਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਘਰਾਂ ਮੰਦਰਾਂ ਵਿਚ ਹੀ (ਅਸਲੀ) ਖ਼ੁਸ਼ੀਆਂ ਹਨ ਜਿੱਥੇ (ਹੇ ਪ੍ਰਭੂ!) ਤੂੰ ਯਾਦ ਆਉਂਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਹੀ ਘਰ ਮੰਦਰ = ਉਹਨਾਂ ਘਰਾਂ ਮੰਦਰਾਂ ਵਿਚ। ਜਹ = ਜਿੱਥੇ। ਚਿਤਿ = ਚਿੱਤ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Felicidad reina en aquélla casa en donde Tú, oh Señor, eres exaltado."