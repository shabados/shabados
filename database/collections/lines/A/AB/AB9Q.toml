[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਰਤਿਪਾਲ ਪ੍ਰਭ ਕ੍ਰਿਪਾਲ; ਕਵਨ ਗੁਨ ਗਨੀ ॥"
page = 1153
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God, the Cherisher, is compassionate Who can count His virtues?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਲਣ ਪੋਸਣਹਾਰ ਵਾਹਿਗੁਰੂ ਦਇਆਲੂ ਹੈ। ਉਸ ਦੀਆਂ ਨੇਕੀਆਂ ਨੂੰ ਕੌਣ ਗਿਣ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is the Compassionate Cherisher. Who can count His Glorious Virtues?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਤਿਪਾਲਾ ਕਰਨਹਾਰੇ ਸਮਰਥ ਕ੍ਰਿਪਾਲ! ਮੈਂ ਤੇਰੇ ਕਵਨ ਸੇ ਗੁਨ ਕੀ ਗਿਨਤੀ ਕਰੂੰ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਭ ਦੇ ਪਾਲਣਹਾਰ ਪ੍ਰਭੂ! ਹੇ ਕਿਰਪਾਲ ਪ੍ਰਭੂ! ਮੈਂ ਤੇਰੇ ਕਿਹੜੇ ਕਿਹੜੇ ਗੁਣ ਬਿਆਨ ਕਰਾਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਤਿਪਾਲ = ਹੇ ਪ੍ਰਤਿਪਾਲ! ਹੇ ਪਾਲਣਹਾਰ! ਕਵਨ ਗੁਨ = ਕਿਹੜੇ ਕਿਹੜੇ ਗੁਣ? ਗਨੀ = ਗਨੀਂ, ਮੈਂ ਗਿਣਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, eres Tú Quien me sostiene, ¿cual de Tus Méritos podría recordar?"