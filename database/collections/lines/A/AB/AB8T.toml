data = "ਮਤਸ ਦੇਸ ਮੈ ਬਨ ਘਨੋ; ਤਹੀ ਬਿਹਾਰੈ ਜਾਇ ॥੧੫॥"
page = 1008

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He was proceeding to the country of Machh where there were bettertrees.(15)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਮਤਸ ਦੇਸ ਵਿਚ ਬਹੁਤ ਬਨ ਹਨ, ਉਥੇ ਹੀ ਜਾ ਕੇ ਵਿਚਰੀਏ ॥੧੫॥"