[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਜੀਆ ਮਹਿ; ਏਕੋ ਰਵੈ ॥"
page = 228
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Amongst all the beings, the One Lord is contained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਮੂਹ ਜੀਵਾਂ ਅੰਦਰ ਇਕ ਸੁਆਮੀ ਰਮਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Among all beings, the One Lord is pervading."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਜੀਵੋਂ ਮੇਂ ਸੋ ਹਰੀ ਏਕ ਹੀ ਵ੍ਯਾਪ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਭ ਜੀਵਾਂ ਦੇ ਅੰਦਰ ਇਕ ਪਰਮਾਤਮਾ ਹੀ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਵੈ = ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor lo sostiene y lo preserva todo;"