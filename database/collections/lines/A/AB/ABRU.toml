[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਭਵਨ; ਪੂਰਨ ਪਰਤਾਪ ॥"
page = 299
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In all the worlds, perfect is His effulgence."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਜਹਾਨਾਂ ਅੰਦਰ ਮੁਕੰਮਲ ਹੈ ਉਸ ਦਾ ਤਪ ਤੇਜ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "On all worlds, His radiant glory is perfect."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਸੰਪੂਰਨ ਭਵਨੋਂ ਮੇਂ ਤਿਸ ਕਾ ਪ੍ਰਤਾਪ ਪੂਰਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਭਵਨਾਂ ਵਿਚ ਉਸ ਦਾ ਤੇਜ-ਪਰਤਾਪ ਚਮਕਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਤਾਪ = ਤੇਜ, ਤਾਕਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su Gloria es Perfecta y prevalece en todos los mundos."