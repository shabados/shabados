[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈਸੀ ਆਗਿਆ; ਤੈਸਾ ਕਰਮੁ ॥"
page = 294
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As is His will so are His creatures acts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਹੋ ਜਿਹੀ ਉਸ ਦੀ ਰਜ਼ਾ ਹੈ, ਉਹੋ ਜਿਹੇ ਹਨ ਉਸ ਦੇ ਜੀਆਂ ਦੇ ਅਮਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As He orders, so do His creatures act."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੀ ਜੈਸੀ ਤਿਸ ਕੀ ਆਗਿਆ ਹੋਤੀ ਹੈ, ਤੈਸੇ ਹੀ ਇਹ ਜੀਵ ਕਰਮ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੋ ਜਿਹਾ ਉਹ ਹੁਕਮ (ਕਰਦਾ ਹੈ), ਉਹੋ ਜਿਹਾ (ਜੀਵ) ਕੰਮ ਕਰਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਗਿਆ = ਹੁਕਮ। ਕਰਮੁ = ਕੰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y cada acción nuestra se da de acuerdo a Su Voluntad."