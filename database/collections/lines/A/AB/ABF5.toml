[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸ੍ਰੀ ਬ੍ਰਿਜਨਾਥ ਗਏ ਮਥੁਰਾ ਤਜਿ; ਕੈ, ਬ੍ਰਿਜ ਪ੍ਰੀਤਿ ਸਭੈ ਬਿਸਰਾਈ ॥"
page = 543

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Chandarbhaga and Radha said this to Krishna, “Krishna, relinquishing his attachment for Braja, has gone to Mathura,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ (ਸਾਨੂੰ) ਛਡ ਕੇ ਮਥੁਰਾ ਚਲੇ ਗਏ ਅਤੇ ਬ੍ਰਜ ਦੀ ਸਾਰੀ ਪ੍ਰੀਤ ਭੁਲਾ ਦਿੱਤੀ।"