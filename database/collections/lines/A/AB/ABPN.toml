[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਿਰਦੈ ਗੁਰਮਤਿ ਰਾਮ ਰਸਾਇਣੁ; ਜਿਹਵਾ ਹਰਿ ਗੁਣ ਗਾਵੈ ॥"
page = 172
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within my mind is Guru 's instruction and the Lord, the Home of elixir. My tongue sings God 's praises."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਨ ਵਿੱਚ ਗੁਰਾਂ ਦਾ ਉਪਦੇਸ਼ ਤੇ ਅੰਮ੍ਰਿਤ ਦਾ ਘਰ ਸੁਆਮੀ ਹੈ। ਮੇਰੀ ਜੀਭ ਵਾਹਿਗੁਰੂ ਦਾ ਜੱਸ ਅਲਾਪਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Teachings of the Guru are in my heart; the Lord is the Source of nectar. My tongue sings the Glorious Praises of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹ੍ਰਿਦੇ ਕੇ ਬੀਚ ਭੀ ਗੁਰੋਂ ਕੇ ਉਪਦੇਸ ਦ੍ਵਾਰਾ ਰਾਮ ਰਸਾਇਣ ਬਿਰਾਜਮਾਨ ਭਇਆ ਹੈ ਔਰ ਜਿਹਬਾ ਕਰ ਕੇ ਭੀ ਹਰੀ ਕੇ ਗੁਣੋਂ ਕੋ ਗਾਇਨ ਕਰਤੇ ਹਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਦੇ) ਹਿਰਦੇ ਵਿਚ ਗੁਰੂ ਦੇ ਉਪਦੇਸ਼ ਦੀ ਬਰਕਤਿ ਨਾਲ ਸਭ ਰਸਾਂ ਦਾ ਘਰ ਪ੍ਰਭੂ-ਨਾਮ ਵੱਸ ਪੈਂਦਾ ਹੈ, (ਜਿਨ੍ਹਾਂ ਦੀ) ਜੀਭ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸਾਇਣੁ = (रस-अयन) ਰਸਾਂ ਦਾ ਘਰ, ਸਭ ਤੋਂ ਸ੍ਰੇਸ਼ਟ ਰਸ। ਜਿਹਵਾ = ਜੀਭ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En mi corazón está la Palabra del Shabd del Guru, la Panacea del Señor."