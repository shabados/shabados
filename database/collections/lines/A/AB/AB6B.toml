[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਸਮਝ ਸੁਜਾਨ ॥੫੩੫॥"
page = 741

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying “Kovandaj-dayani” in the beginning and then uttering “Ripu Ari”, O wise men! the name of Tupak are formed.535."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤੁਪਕ ਦਾ ਨਾਮ ਬਣਦਾ ਹੈ। ਸੁਜਾਨ ਲੋਗੋ! ਵਿਚਾਰ ਲਵੋ ॥੫੩੫॥"