[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜਾਰਤਿ ਕਰਿ ਮੁਲਤਾਨ ਦੀ; ਫਿਰਿ ਕਰਤਾਰਿਪੁਰੇ ਨੋ ਆਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "After the journey of Multan, Baba Nanak again turned towards Kartarpur."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੁਲਤਾਨ ਦੀ ਜਾਤਰਾ (ਵਿਚ ਦਿਗ ਬਿਜਯ) ਕਰ ਕੇ ਫਿਰ ਕਰਤਾਰ ਪੁਰ ਨੂੰ (ਬਾਬਾ) ਆਇਆ।"