[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੰਧਨ ਤੋੜਿ. ਲੀਏ ਪ੍ਰਭਿ ਮੋਲੇ ॥"
page = 1072
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord has shattered my shackles and united me with Himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਨੇ ਮੇਰੀਆਂ ਬੇੜੀਆਂ ਕੱਟ ਦਿੱਤੀਆਂ ਹਨ ਅਤੇ ਮੈਨੂੰ ਆਪਣੇ ਨਾਲ ਮਿਲਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God has broken my bonds, and claimed me as His own."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ ਬੰਧਨ ਤੋੜ ਕਰ ਹਮ ਮੋਲ ਲੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ (ਮਾਇਆ ਦੇ ਮੋਹ ਦੇ) ਬੰਧਨ ਤੋੜ ਕੇ ਪ੍ਰਭੂ ਨੇ ਉਸ ਨੂੰ ਆਪਣਾ ਬਣਾ ਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੋੜਿ = ਤੋੜ ਕੇ। ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor rompe nuestras ataduras y nos une a Su Ser."