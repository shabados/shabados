[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਰਣ ਕਾਰਣ ਸਮਰਥ; ਕ੍ਰਿਪਾ ਕੀ ਸੂਰਤ ਕ੍ਰਿਤ ਧਰ ॥"
page = 131

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is the cause of causes, Powerful, Merciful Entity and prop of creation."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਰਨ ਅਤੇ ਕਾਰਨ ਵਿਚ ਸਮਰਥ, ਕ੍ਰਿਪਾ ਦੀ ਮੂਰਤ ਅਤੇ ਸਿਰਜੀ ਹੋਈ (ਸ੍ਰਿਸ਼ਟੀ) ਦਾ ਆਧਾਰ"