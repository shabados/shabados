[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਨੀ ਸੁਨਿ ਗਾਡਿਯੋ ਤਿਸੈ; ਭਏ ਪਵਨ ਭ੍ਰਿਤ ਭੇਸ ॥"
page = 953

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After listening to this command from the heaven, they buried him there,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਆਕਾਸ਼ ਬਾਣੀ ਸੁਣ ਕੇ ਉਸ ਨੂੰ (ਉਥੇ ਹੀ) ਗਡ ਦਿੱਤਾ ਅਤੇ ਨੌਕਰ ਪਵਨ ਦਾ ਰੂਪ ਹੋ ਗਏ। (ਅਰਥਾਤ ਬਹੁਤ ਜਲਦੀ ਚਲ ਪਏ)।"