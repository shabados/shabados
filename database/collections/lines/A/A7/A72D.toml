[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਸ ਦਿਸ ਖੋਜਤ. ਮੈ ਫਿਰਿਓ; ਜਤ ਦੇਖਉ ਤਤ ਸੋਇ ॥"
page = 298
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have wandered searching in ten directions, wherever I see I find that Lord there."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਦਸੀ ਪਾਸੀ ਹੀ ਲੱਭਦਾ ਫਿਰਿਆ ਹਾਂ। ਜਿਥੇ ਕਿਤੇ ਭੀ ਮੈਂ ਵੇਖਦਾ ਹਾਂ, ਉਥੇ ਮੈਂ ਉਹ ਸੁਆਮੀ ਨੂੰ ਪਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have wandered, searching in the ten directions - wherever I look, there I see Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਦਸੋਂ ਦਿਸਾ ਮੇਂ ਖੋਜਤਾ ਫਿਰਾ ਹੂੰ, ਜਹਾਂ ਜਾਇ ਕਰ ਦੇਖਤਾ ਹੂੰ ਤਹਾਂ ਸੋਈ ਮਨ ਕਾ ਹਾਲ ਦੇਖਤਾ ਹੂੰ ਜੋ ਪਹਿਲੇ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਆਖ-ਉਂਞ ਤਾਂ) ਮੈਂ ਜਿਧਰ ਵੇਖਦਾ ਹਾਂ, ਓਧਰ ਉਹ (ਪਰਮਾਤਮਾ) ਹੀ ਵੱਸ ਰਿਹਾ ਹੈ (ਪਰ ਘਰ ਛੱਡ ਕੇ) ਦਸੀਂ ਪਾਸੀਂ ਹੀ ਮੈਂ ਢੂੰਡ ਫਿਰਿਆ ਹਾਂ (ਜੰਗਲ ਆਦਿਕਾਂ ਵਿਚ ਕਿਤੇ ਭੀ ਮਨ ਵੱਸ ਵਿਚ ਨਹੀਂ ਆਉਂਦਾ);"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਿਸ = {दिश} ਪਾਸੇ, ਤਰਫ਼ਾਂ। ਖੋਜਤ = ਢੂੰਡਦਾ। ਜਤ = {यत्र} ਜਿਥੇ। ਦੇਖਉ = ਦੇਖਉਂ, ਮੈਂ ਦੇਖਦਾ ਹਾਂ। ਤਤ = {तत्र} ਉਥੇ। ਸੋਇ = ਉਹ (ਪਰਮਾਤਮਾ) ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He diambulado, buscando las diez direcciones- i donde este ahí lo veo,"