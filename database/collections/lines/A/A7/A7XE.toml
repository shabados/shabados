[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਾਨ ਅੰਸ ਨਿਕਾਰ ਲੀਨੀ; ਅਰਥ ਸ੍ਵਰਥ ਸੁਧਾਰਿ ॥੫੨॥"
page = 618

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They established all the Shastras with commentaries according to Vedic rites and held in honour again the significance of charity.52."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਲੋਕ ਭਲਾਈ ਅਤੇ ਸੁਧਾਰ ਲਈ ਦਾਨ ਦਾ ਅੰਸ਼ ਕਢ ਲਿਆ ॥੫੨॥"