[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਸੇਵਾ ਬਿਨੁ. ਭਗਤਿ, ਨ ਹੋਵੀ; ਕਿਉ ਕਰਿ ਚੀਨਸਿ ਆਪੈ ॥"
page = 1013
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without serving the Guru, Lord's meditation is embraced not, How can man of himself know the Lord?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਚਾਕਰੀ ਕਮਾਉਣ ਦੇ ਬਗ਼ੈਰ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਨਹੀਂ ਹੁੰਦਾ। ਆਪਣੇ ਆਪ ਇਨਸਾਨ ਕਿਸ ਤਰ੍ਹਾਂ ਪ੍ਰਭੂ ਨੂੰ ਜਾਣ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without serving the Guru, there is no devotional worship. How can anyone, by himself, know the Lord?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਸੇਵਾ ਬਿਨਾਂ ਤੋ ਭਗਤੀ ਨਹੀਂ ਪ੍ਰਾਪਤਿ ਹੋਤੀ, ਕਿਸ ਪ੍ਰਕਾਰ ਅਪਨੇ ਆਪ ਕੋ ਦੇਖੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਦੱਸੀ ਸੇਵਾ ਕਰਨ ਤੋਂ ਬਿਨਾ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਹੋ ਨਹੀਂ ਸਕਦੀ (ਇਹ ਮਨਮੁਖ) ਆਪਣੇ ਆਤਮਕ ਜੀਵਨ ਨੂੰ ਕਿਵੇਂ ਪਛਾਣੇ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੀਨਸਿ = ਪਛਾਣੇ। ਆਪੈ = ਆਪਣੇ ਆਪ ਨੂੰ, ਆਪਣੇ ਆਤਮਕ ਜੀਵਨ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿cómo puede así conocer su ser? Calumnia a otros y cae en la oscuridad de su conciencia,"