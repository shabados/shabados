type = "primary"
data = "ਬਾਰਿਧ ਮੈ ਪਾਵਕ ਕੋ ਡਾਰਿਯੋ ॥"
page = 977

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The great Ruder then calmed down and threw fire into the sea."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਅਗਨੀ ਨੂੰ ਸਮੁੰਦਰ ਵਿਚ ਸੁਟ ਦਿੱਤਾ।"