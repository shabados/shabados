[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੋਈ ਖੰਡ ਸਵਾਰਦਾ; ਮਖਣ ਮਸਾਲਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Some prepare refined sugar and some adding in it sweet drops make special jaggery."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਖੰਡ ਬਨਾਉਂਦਾ, ਕੋਈ ਮਸਾਲੇਦਾਰ ਮਖਾਣੇ।"