[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਲ, ਹਮਾਰੇ ਪਾਸ; ਦੇਸ ਦੇਸਨ ਤ੍ਰਿਯ ਆਵਹਿ ॥"
page = 836

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Listen lady! Women come to us from far off lands,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਾਲਾ! ਸਾਡੇ ਕੋਲ ਦੇਸ ਦੇਸਾਂਤਰਾਂ ਦੀਆਂ ਨਾਰੀਆਂ ਆਉਂਦੀਆਂ ਹਨ।"