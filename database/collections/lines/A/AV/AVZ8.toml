[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੋਇ ਪੁਤ੍ਰ ਤਾ ਤੇ ਉਪਜਾਯੋ ॥"
page = 975

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She always ensnared the Raja; they had two sons."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਤੋਂ ਉਸ ਨੂੰ ਦੋ ਪੁੱਤਰ ਪ੍ਰਾਪਤ ਹੋਏ।"