[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰਿ ਬਿਖੁ. ਬਾਹਰਿ ਨਿਭਰਾਤੀ; ਤਾ ਜਮੁ ਕਰੇ ਖੁਆਰੀ ॥੬॥"
page = 1013
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With poison in his mind, from without he pretends to be doubt free. so Yama humiliates him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਨ ਅੰਦਰ ਜ਼ਹਿਰ ਹੁੰਦਿਆਂ ਹੋਇਆਂ ਉਹ ਬਾਹਰੋਂ ਭਰਮ-ਰਹਿਤ ਹੋਣ ਦਾ ਦੰਭ ਕਰਦਾ ਹੈ। ਸੋ, ਯਮ ਉਸ ਨੂੰ ਖੱਜਲ-ਖ਼ੁਆਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With poison within, he pretends to be free of doubt; he is ruined and humiliated by the Messenger of Death. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅੰਤਰ ਬਿਖੇ ਬਾਸਨਾ ਸਾਥ ਭਰਿਆ ਹੂਆ ਹੈ ਔ ਬਾਹਰਿ ਸੇ ਆਪ ਕੋ ਭਰਮ ਰਹਿਤ ਜਨਾਵਤਾ ਹੈ, ਤਾਂ ਇਸੀ ਸੇ ਜਮ ਖੁਆਰੀ ਕਰੇਗਾ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਨਮੁਖ ਦੇ) ਅੰਦਰ (ਆਤਮਕ ਮੌਤ ਲਿਆਉਣ ਵਾਲੀ ਤ੍ਰਿਸ਼ਨਾ ਦਾ) ਜ਼ਹਿਰ ਹੈ, ਬਾਹਰ (ਲੋਕਾਂ ਨੂੰ ਵਿਖਾਣ ਵਾਸਤੇ) ਸ਼ਾਂਤੀ ਧਾਰਨ ਕੀਤੀ ਹੋਈ ਹੈ। (ਅਜੇਹੇ ਪਖੰਡੀ ਨੂੰ) ਆਤਮਕ ਮੌਤ-ਖ਼ੁਆਰ ਕਰਦੀ ਹੈ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਭਰਾਤੀ = ਭਟਕਣਾ ਦਾ ਅਭਾਵ, ਸ਼ਾਂਤੀ। ਖੁਆਰੀ = ਦੁਰਗਤੀ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por fuera se ve en total calma, pero en su interior ha sido picado y será destruido por Yama. (6)"