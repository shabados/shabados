[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਹਮਾਰੈ; ਨਿਰਮਲ ਬਿਉਹਾਰ ॥੩॥"
page = 1145
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's Name is my immaculate business."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦਾ ਨਾਮ ਹੀ ਮੇਰਾ ਪਵਿੱਤਰ ਵਣਜ ਵਾਪਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Naam is my immaculate occupation. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰੇ ਨਾਮ ਹੀ ਨਿਰਮਲ ਬ੍ਯੋਹਾਰ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹੀ ਮੇਰੇ ਲਈ ਪਵਿੱਤਰ ਕਾਰ-ਵਿਹਾਰ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਉਹਾਰੁ = ਕਾਰ-ਵਿਹਾਰ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Nombre para mí, es el único Comercio Inmaculado que existe. (3)"