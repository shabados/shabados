[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਜੁ ਤੇਰਾ; ਕਬਹੁ ਨ ਜਾਵੈ ॥"
page = 567
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thy rule never ends."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਹਕੂਮਤ ਕਦੇ ਭੀ ਨਹੀਂ ਜਾਂਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your rule shall never end."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਰਾਜ ਅਰਥਾਤ ਹੁਕਮ ਐਸਾ ਨਿਸਚਲ ਹੈ, ਜੋ ਕਬੀ ਨਹੀਂ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਰਾਜ ਕਦੇ ਭੀ ਨਾਸ ਹੋਣ ਵਾਲਾ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tu Reino es Eterno, nunca se acaba, sí, es siempre Duradero e Inmutable."