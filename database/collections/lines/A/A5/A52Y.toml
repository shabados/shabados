[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਿਨੇਸ ਕ੍ਰਿਤ ਹਾਰੀਯੰ ॥੧੦॥੧੮॥"
page = 129

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art wearing such crown on Thy head which debases the pride of sum.10.18."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਦੇ ਸਾਹਮਣੇ) ਸੂਰਜ ਦੀ ਕਾਂਤੀ (ਚਮਕ) ਵੀ ਹਾਰ ਜਾਂਦੀ ਹੈ (ਫਿੱਕੀ ਪੈ ਜਾਂਦੀ ਹੈ) ॥੧੦॥੧੮॥"