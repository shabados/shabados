[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਰੇ; ਸਤਿਗੁਰੁ ਸੇਵਿ ਨਿਸੰਗੁ ॥"
page = 69
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my mind! do thou serve the True Guru unhesitatingly."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਤੂੰ ਨਿਧੜਕ ਹੋ ਕੇ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਘਾਲ ਕਮਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mind, serve the True Guru without hesitation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਮਨ ਰੇ) ਹੇ ਮੇਰੇ ਪ੍ਯਾਰੇ! ਸਤਿਗੁਰੂ ਕੀ ਸੇਵਾ ਨਿਸੰਕ ਹੋ ਕਰ ਕੇ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਝਾਕਾ ਲਾਹ ਕੇ ਗੁਰੂ ਦੀ ਸਰਨ ਪਉ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਸੰਗੁ = ਝਾਕਾ ਲਾਹ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, sirve al Guru Verdadero, sin ninguna duda."