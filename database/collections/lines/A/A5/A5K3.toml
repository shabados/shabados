type = "primary"
data = "ਸਸੰ ਜਿਉ ਚਕੋਰੀ ॥੧੦੭॥"
page = 210

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She kept her eyes concentrated like that off a Chakori (a hill bird) on the moon.107."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਚਕੋਰੀ ਚੰਦ੍ਰਮਾ ਵਲ ਅੱਖਾਂ ਜੋੜ ਲੈਂਦੀ ਹੈ ॥੧੦੭॥"