[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਦੁ ਬਿਬਾਦੁ; ਕਾਹੂ ਸਿਉ. ਨ ਕੀਜੈ ॥"
page = 1164
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hold thou no discussion and argument with anyone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਕਿਸੇ ਨਾਲ ਭੀ ਬਹਿਸ ਅਤੇ ਮੁਬਾਹਸਾ ਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Do not engage in any arguments or debates with anyone."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਬਾਦ) ਬ੍ਯਰਥ (ਬਿਬਾਦੁ) ਝਗੜਾ ਕਿਸੀ ਕੇ ਸਾਥ ਨਾ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕੋਈ ਨਿੰਦਾ ਪਿਆ ਕਰੇ) ਕਿਸੇ ਨਾਲ ਝਗੜਾ ਕਰਨ ਦੀ ਲੋੜ ਨਹੀਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਦੁ ਬਿਬਾਦੁ = ਝਗੜਾ, ਬਹਿਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No discuto con nadie"