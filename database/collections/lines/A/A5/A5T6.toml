[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹੂੰ, ਪਹਿਲਵੀ ਪਸਤਵੀ ਸੰਸਕ੍ਰਿਤੀ ਹੋ ॥"
page = 29

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere Thou art Pathlavi, somewhere Pushto, somewhere Sankrit!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ ਤੁਸੀਂ ਪਹਿਲਵੀ ਹੋ। ਕਿਤੇ ਪਸਤੋ ਹੋ ਅਤੇ ਕਿਤੇ ਸੰਸਕ੍ਰਿਤ ਹੋ।"