[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੁਇ ਸਤਿ ਸਿਯੰਦਨ ਕਾਟਿ ਦਏ; ਬਹੁ ਬੀਰ ਹਨੇ ਬਲੁ ਕੈ ਅਸਿ ਧਾਰੀ ॥"
page = 437

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He chopped two hundred chariots and killed many sword-wielding warriors"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋ ਸੌ ਰਥ ਤੋੜ ਦਿੱਤੇ ਹਨ ਅਤੇ ਬਹੁਤ ਸਾਰੇ ਸੂਰਵੀਰਾਂ ਨੂੰ ਜ਼ੋਰ ਨਾਲ ਤਲਵਾਰ ਦੀ ਧਾਰ ਨਾਲ (ਪਾਰ ਬੁਲਾਇਆ ਹੈ)।"