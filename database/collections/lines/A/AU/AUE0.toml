[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਹਜਿ ਸੁਖਿ ਸੋਈਐ ਹਾਂ ॥"
page = 410
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I, therefore, sleep in poise and peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਇਸ ਲਈ, ਅਡੋਲਤਾ ਤੇ ਆਰਾਮ ਅੰਦਰ ਸੌਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I sleep in peace and poise."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਐਸਾ ਜਾਨਾ ਹੈ ਵਹੀ ਸਾਂਤਿ ਸੁਖ ਮੇਂ ਸੈਨ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਮਨੁਖ ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਆਨੰਦ ਵਿਚ ਲੀਨ ਰਹਿ ਸਕੀਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜਿ = ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ। ਸੁਖਿ = ਆਨੰਦ ਵਿਚ। ਸੋਈਐ = ਲੀਨ ਰਹੀਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por Tu Gracia uno habita en Paz"