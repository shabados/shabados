[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਲਟੀ ਰੇ ਮਨ; ਉਲਟੀ ਰੇ ॥"
page = 535
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Turn away O my soul, turn away."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁੜ ਪਉ ਹੇ! ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਮੁੜ ਪਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Turn away, O my mind, turn away."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨਾ! ਤੇਰੀ ਬਿਰਤੀ ਜੋ ਅਕਾਲ ਪੁਰਖ ਕੀ ਓਰ ਸੇ ਉਲਟੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਜੇਹੜੇ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਨਾਲੋਂ ਸਦਾ ਟੁੱਟੇ ਰਹਿੰਦੇ ਹਨ, ਉਹਨਾਂ ਨਾਲੋਂ ਆਪਣੇ ਆਪ ਨੂੰ ਸਦਾ ਪਰੇ ਰੱਖ, ਪਰੇ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਲਟੀ = ਉਲਟਾ ਲੈ, ਪਰਤਾਅ ਲੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, no te acerques a los que no tienen Fe,"