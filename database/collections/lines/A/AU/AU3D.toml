type = "primary"
data = "ਦੋਊ ਜੀਤ ਚਾਹੈਂ ॥੩੬॥"
page = 68

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They strike their weapons fearlessly, both the sides wish for their victory.36."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਦੋਵੇਂ (ਆਪਣੀ ਆਪਣੀ) ਜਿਤ ਪ੍ਰਾਪਤ ਕਰਨ ਦੇ ਚਾਹਵਾਨ ਹੁੰਦੇ ਹਨ ॥੩੬॥"