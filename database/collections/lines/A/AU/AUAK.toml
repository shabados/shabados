language = "pa"
data = "ਜਿਹੜਾ ਚਾਉ ਨਾਲ ਉਸ (ਅਕਾਲਪੁਰਖ) ਦੀ ਪ੍ਰੀਤ ਬਾਰੇ ਗਲ ਬਾਤ ਕਰਦਾ ਹੈ ।"

[[content]]
