[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੂਤ ਭਵਿਖ ਭਵਾਨ ਤੁਹੀ; ਸਬਹੂੰ ਸਬ ਠੌਰਨ ਮੋ ਮਨ ਮਾਨਾ ॥"
page = 712

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art considered Pervasive in the present, past and future"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਭੂਤ, ਭਵਿਖਤ ਅਤੇ ਵਰਤਮਾਨ ਕਾਲਾਂ ਅਤੇ ਸਭ ਸਥਾਨਾਂ ਵਿਚ ਤੁੰ ਹੀ ਹੈਂ, (ਇਹ ਗੱਲ) ਮੇਰੇ ਮਨ ਨੇ ਮੰਨ ਲਈ ਹੈ।"