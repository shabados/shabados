[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ; ਪਾਰਬ੍ਰਹਮ ਸੁਆਮੀ ॥"
page = 1339
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Be merciful to me, O my Supreme Lord Master,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸ਼੍ਰੋਮਣੀ ਸਾਈਂ ਮਾਲਕ! ਤੂੰ ਮੇਰੇ ਉਤੇ ਮਿਹਰ ਧਾਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please be merciful, O Supreme Lord God, O Lord and Master,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਾਰਬ੍ਰਹਮ ਸ੍ਵਾਮੀ! ਹਮਾਰੇ ਪਰ ਅਪਨੀ ਕ੍ਰਿਪਾ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਾਰਬ੍ਰਹਮ! ਹੇ ਸੁਆਮੀ! (ਮੇਰੇ ਉਤੇ) ਮਿਹਰ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਰਬ੍ਰਹਮ = ਹੇ ਪਾਰਬ੍ਰਹਮ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por favor, muestra Tu Misericordia, oh Supremo Dios, Señor y Maestro nuestro,"