[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗੁ ਸੂਹੀ ਅਸਟਪਦੀਆ ਮਹਲਾ ੫ ਘਰੁ ੧ ॥"
page = 759
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rag Suhi Ashtpadian 5th Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਸੂਹੀ ਅਸ਼ਟਪਦੀਆਂ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Soohee, Ashtpadheeyaa, Fifth Mehl, First House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਸੂਹੀ, ਘਰ ੧ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਅੱਠ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Suji, Mejl Guru Aryan, Quinto Canal Divino, Ashtapadis."