[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤ੍ਰੀਆ ਤਾਸ ਚੀਨੋ ਅਦਿਤਿਆ ਕੁਮਾਰੰ ॥੬੨॥"
page = 631

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Even the king Indra conceals himself in fear because of his fame as a Donor O friend! He is the same Aditya Kumar.62."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਇਸਤਰੀ ਸਚੀ, ਅਦਿਤੀ ਦੀ ਕੁਮਾਰੀ (ਲੜਕੀ) ਹੈ ॥੬੨॥"