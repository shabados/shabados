[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰਥਮ ਭੋਗ ਤਾ ਸੋ ਕਰਿਯੋ; ਬਹੁਰਿ ਦੇਗ ਮੈ ਡਾਰਿ ॥"
page = 1007

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "First she had revelled with him sexually and then put him in thecauldron."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਹਿਲਾਂ ਉਸ ਨਾਲ ਭੋਗ ਕੀਤਾ ਅਤੇ ਫਿਰ ਦੇਗ ਵਿਚ ਪਾ ਦਿੱਤਾ।"