[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਹਰਿ ਗੁਨ ਗਾਵਹੁ ॥"
page = 1120
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God, God God's praise sing thou, O man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰੀ, ਹਰੀ, ਹਰੀ ਦਾ ਤੂੰ ਜੱਸ ਗਾਇਨ ਕਰ, ਹੇ ਬੰਦੇ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sing the Glorious Praises of the Lord, Har, Har, Har."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਮਨ ਤਨ ਬਾਣੀ ਕਰ ਮੈਂ ਤੇਰੇ ਗੁਣੋ ਕੋਂ ਗਾਵਣਾ ਕਰੋਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦੇ ਰਿਹਾ ਕਰੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canta las Alabanzas del Señor."