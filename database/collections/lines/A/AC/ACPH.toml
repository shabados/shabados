data = "ਟੂਕ ਟੂਕ ਹੁਐ ਗਿਰਤ; ਨ ਘਰ ਕਹ ਬੂਝਹੀ ॥"
page = 258

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After revolving and holding the lance the warriors come forward and fight and fall down on being chopped into bits"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਟੋਟੇ-ਟੋਟੇ ਹੋ ਕੇ ਡਿੱਗਦੇ ਹਨ, ਪਰ ਘਰ ਨੂੰ ਯਾਦ ਤੱਕ ਨਹੀਂ ਕਰਦੇ ਹਨ।"