[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਕਰਮ ਮੈ ਨ ਧਰਮ ਮੈ; ਨ ਭਰਮ ਮੈ ਬਤਾਈਐ ॥"
page = 32

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He cannot be told within any Karmas, religions and illusions."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਨਾ ਕਰਮ ਵਿਚ, ਨਾ ਧਰਮ ਵਿਚ ਅਤੇ ਨਾ ਭਰਮ ਵਿਚ (ਲੁਪਤ) ਦਸਿਆ ਜਾਂਦਾ ਹੈ।"