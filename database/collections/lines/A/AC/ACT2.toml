data = "ਤਾ ਕੇ ਸੰਗ ਅਤਿ ਕੇਲ ਕਮਾਵੈ ॥੬॥"
page = 998

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The woman would not come near Raja but enjoyed lovemaking with him (the friend).(6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ (ਯਾਰ) ਨਾਲ ਬਹੁਤ ਕਾਮ-ਕ੍ਰੀੜਾ ਕਰਦੀ ਸੀ ॥੬॥"