[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਪੂਰੈ; ਮੇਰੀ ਪੈਜ ਰਖਾਈ ॥੧॥"
page = 239
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Perfect Guru has preserved my honour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਾਂ ਨੇ ਮੇਰੀ ਇੱਜਤ ਰਖ ਲਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Perfect Guru has preserved my honor. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੋਂ ਨੇ ਮੇਰੀ (ਪੈਜ) ਪਤਿ ਵਾ ਪ੍ਰਤਗਿਆ ਪਰਮੇਸ੍ਵਰ ਤੇ ਰਖਵਾਈ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਦੁਨੀਆ ਦੇ ਵਿਕਾਰਾਂ ਦੇ ਮੁਕਾਬਲੇ ਤੇ) ਪੂਰੇ ਗੁਰੂ ਨੇ ਮੇਰੀ ਇੱਜ਼ਤ ਰੱਖ ਲਈ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ। ਪੈਜ = ਲਾਜ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Perfecto Guru ha conservado mi integridad. (1)"