[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਮਨ; ਕਾਹੇ ਰੋਸੁ ਕਰੀਜੈ ॥"
page = 1262
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my mind, why are thou cross?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨੂਏ! ਤੂੰ ਗੁੱਸਾ ਕਿਉਂ ਕਰਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, why are you angry?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ ਰੋਸ ਕਿਸ ਵਾਸਤੇ ਕਰੀਏ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! (ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਲੋਂ) ਰੋਸਾ ਨਹੀਂ ਕਰਨਾ ਚਾਹੀਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, mente mía, ¿por qué vives en el enojo?"