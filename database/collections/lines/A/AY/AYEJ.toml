[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕਰਨ ਕਰਾਵਨਹਾਰੀ ॥"
page = 655
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is the Doer and the Prompter"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਹੀ ਕਰਨ ਤੇ ਕਰਾਉਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord God is the Cause of causes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਹਾਰਾਜ! ਪ੍ਰਭ ਕੀ ਸ਼ਕਤੀ ਸਰਬ ਕਰਮੋਂ ਕੇ ਕਰਣੇ ਕਰਾਵਣੇਹਾਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਭ ਕੁਝ ਕਰਨ ਕਰਾਉਣ ਵਾਲਾ ਪ੍ਰਭੂ ਆਪ ਹੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor es el Hacedor y la Causa;"