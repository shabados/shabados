[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਨਿਡਰ ਬਖਾਨੋ ਤਹਾ; ਜਹਾ ਜੀਅ ਜਾਨੀਐ ॥੧੨੯੧॥"
page = 806

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firsly the word “Asur”, add the word “Pit” and then the word “Nrip” at the end and then uttering the word “Nrip” at the end and then uttering the word “ari” recognize the names of Tupak for using them as desired.1291."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਜੀ ਕਰੇ, ਨਿਸੰਗ ਹੋ ਕੇ ਕਥਨ ਕਰਨ ॥੧੨੯੧॥"