[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੇ ਲੋਗ; ਨਹੀ ਜਮੁ ਮਾਰੈ ॥"
page = 1033
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Godly people the Death's courier, smites not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦੇ ਬੰਦਿਆਂ ਨੂੰ ਮੌਤ ਦਾ ਦੂਤ ਡੰਡ ਨਹੀਂ ਦਿੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Death cannot strike down the people of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਲੋਗੋਂ ਕੋ ਜਮ ਨਹੀਂ ਮਾਰਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੇ ਬੰਦੇ ਪਰਮਾਤਮਾ ਦੇ ਸੇਵਕ ਬਣਦੇ ਹਨ ਉਹਨਾਂ ਨੂੰ ਜਮ ਨਹੀਂ ਮਾਰ ਸਕਦਾ (ਆਤਮਕ ਮੌਤ ਨਹੀਂ ਮਾਰ ਸਕਦੀ),"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Gurmukjs no son destruidos por Yama y para nada ven el dolor en el Sendero,"