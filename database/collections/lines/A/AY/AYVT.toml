type = "primary"
data = "ਨਾਹਕ, ਔਰ ਲੋਕ ਨਹਿ ਮਰਿਯੈ ॥੫੫॥"
page = 923

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Our own sake, we should not make others to lose their lives.’(55)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਵਿਚ ਨਾਹਕ ਹੋਰਾਂ ਲੋਕਾਂ ਨੂੰ ਨਾ ਮਰਵਾਈਏ ॥੫੫॥"