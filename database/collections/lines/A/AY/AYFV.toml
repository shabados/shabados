[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਉਚੇ ਮਹਲ ਉਸਾਰਿ, ਵਿਛਾਇ ਵਿਛਾਵਣੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Tall palaces are erected and carpets are spread therein,"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਦੁਨੀਆਂਦਾਰ) ਲੋਕ ਉੱਚੇ ਮੰਦਰਾਂ ਨੂੰ ਉਸਾਰਕੇ (ਦਰੀਆਂ ਗਲੀਚੇ ਆਦਿ ਬਿਸਤਰੇ) ਵਿਛਾਂਵਦੇ ਹਨ।"