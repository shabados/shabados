[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਸਮਝ ਪ੍ਰਬੀਨ ॥੪੯੯॥"
page = 740

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Khagni” in the beginning and then adding “Ripu Ari”, the names of Tupak are formed.499."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤੁਪਕ ਦਾ ਨਾਮ ਬਣਦਾ ਹੈ। ਸੁਜਾਨੋ! ਸਮਝ ਲਵੋ ॥੪੯੯॥"