[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਪ ਕਰੰਤੌ; ਨਹ ਸੰਗਾਇ ॥"
page = 1192
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "One shirks not from committing sins."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਨਾਹ ਕਰਨ ਤੋਂ ਬੰਦਾ ਝਿਜਕਦਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mortal does not hesitate to commit sins."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਾਪੋਂ ਕੋ ਕਰਤਾ ਹੂਆ ਇਹ ਜੀਉ ਸੰਕਾ ਨਹੀਂ ਕਰਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਵਿਚ ਮਸਤ ਮਨੁੱਖ) ਪਾਪ ਕਰਦਾ ਭੀ ਝਿਜਕਦਾ ਨਹੀਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗਾਇ = ਸੰਗਦਾ, ਸ਼ਰਮ ਕਰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El que no constriñe sus errores,"