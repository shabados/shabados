[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਮੋਤੀ ਜੇ ਗਹਣਾ ਹੋਵੈ; ਪਉਣੁ ਹੋਵੈ ਸੂਤ ਧਾਰੀ ॥"
page = 359
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If her mind's pearl, like an ornament, be weaved into the thread of breath,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਉਹ ਜੇਵਰ ਵਰਗੇ ਆਪਣੇ ਮਨ ਦੇ ਮਾਣਕ ਨੂੰ ਸੁਆਸ ਦੇ ਧਾਗੇ ਵਿੱਚ ਪਰੋ ਲਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If the pearl of the mind is strung like a jewel on the thread of the breath,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਕਾ ਜੋ (ਗਹਣਾ) ਪਕੜਨਾ ਹੈ, ਸੋ ਮੋਤੀ ਹੋ, ਭਾਵ ਸੁਧ ਮਨ ਹੋ, ਵਾ ਮਨ ਕਾ ਜੋ ਗ੍ਰਹਣ ਕਰਨਾ ਏਹੀ ਮੋਤੀ ਜੜਤ ਗਹਿਣਾ ਹੋ ਅਰ ਉਸ ਮਨ ਮੋਤੀ ਮੇਂ (ਪਉਣੁ) ਸ੍ਵਾਸ ਵੈਰਾਗ ਸੰਜੁਗਤ ਸੂਤ੍ਰ ਧਾਰਨ ਕੀਆ ਜਾਇ, ਭਾਵ ਸਾਸ ਸਾਸ ਮਨ ਕਰ ਭਜਨ ਕੀਆ ਜਾਇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਜੀਵ-ਇਸਤ੍ਰੀ ਆਪਣੇ ਮਨ ਨੂੰ ਸੁੱਚੇ ਮੋਤੀ ਵਰਗਾ ਗਹਿਣਾ ਬਣਾ ਲਏ (ਮੋਤੀਆਂ ਦੀ ਮਾਲਾ ਬਣਾਨ ਲਈ ਧਾਗੇ ਦੀ ਲੋੜ ਪੈਂਦੀ ਹੈ) ਜੇ ਸੁਆਸ ਸੁਆਸ (ਦਾ ਸਿਮਰਨ ਮੋਤੀ ਪ੍ਰੋਣ ਲਈ) ਧਾਗਾ ਬਣੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਉਣੁ = ਹਵਾ, ਸੁਆਸ। ਸੂਤ = ਧਾਗਾ। ਕਾਮਣਿ = ਇਸਤ੍ਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si la mente como perla fuera ensartada en el hilo de la respiración"