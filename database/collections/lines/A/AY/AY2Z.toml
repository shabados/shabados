[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਓਹੁ ਬਿਨਸੈ; ਨਾ ਹਮ ਕੜਿਆ ॥"
page = 391
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He perishes not, nor do I grieve."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਨਾਸ ਨਹੀਂ ਹੁੰਦਾ, ਨਾਂ ਹੀ ਮੈਂ ਔਖਾ ਭਾਰਾ ਹੁੰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He does not perish, so I do not grieve."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸਤੇ ਵਹੁ ਬਿਨਸਿਆ ਨਹੀਂ ਤਿਸਤੇ ਹਮਰਾ ਮਨ ਝੁਰਿਆ ਭੀ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਰਮਾਤਮਾ ਕਦੇ ਨਾਸ ਨਹੀਂ ਹੁੰਦਾ, ਸਾਨੂੰ ਭੀ (ਵਿਨਾਸ਼ ਦੀ) ਕੋਈ ਚਿੰਤਾ ਨਹੀਂ ਹੋਣੀ ਚਾਹੀਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੜਿਆ = ਚਿੰਤਾ-ਫ਼ਿਕਰ ਕਰਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él no es destruido, y por eso no le temo a la destrucción."