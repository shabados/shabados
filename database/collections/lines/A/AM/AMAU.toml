[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਰੂਪੰ ਨ ਰੇਖੰ ਨ ਰੰਗੰ ਨ ਰਾਗੰ ॥"
page = 39

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is Formless, Signless, Colourless and Non-attached;"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਤੇਰਾ) ਨਾ ਰੂਪ ਹੈ, ਨਾ ਰੇਖ ਹੈ, ਨਾ ਰੰਗ ਹੈ ਅਤੇ ਨਾ ਹੀ ਸਨੇਹ ('ਰਾਗੰ') ਹੈ;"