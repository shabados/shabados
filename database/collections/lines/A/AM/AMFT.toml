[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸਹਿ ਧਿਆਇ; ਜੋ ਏਕ ਅਲਖੈ ॥"
page = 270
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remember Him, who is the One Invisible Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਚਿੰਤਨ ਕਰ, ਜੋ ਇਕ ਅਦ੍ਰਿਸ਼ਟ ਸੁਆਮੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate on Him - the One Invisible Lord;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਤਿਸ ਕੌ ਧਿਆਇ ਜੋ ਏਕ ਅਲਖ ਸਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪ੍ਰਭੂ ਨੂੰ ਸਿਮਰ, ਜੋ ਇੱਕ ਹੈ, ਤੇ, ਬੇਅੰਤ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਲਖ = ਜੋ ਲਖਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ, ਜੋ ਬਿਆਨ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Medita en Él, el Ser Invisible,"