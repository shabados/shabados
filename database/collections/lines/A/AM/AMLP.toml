[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਾ. ਸਤਿਗੁਰੁ ਜੀਵਦਿਆ ਮੁਇਆ. ਨ ਵਿਸਰੈ; ਸੇਈ ਪੁਰਖ ਸੁਜਾਣ ॥"
page = 643
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sagacious are the persons, who forget not the True Guru both in life and death."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿਆਣੇ ਹਨ ਉਹ ਪੁਰਸ਼ ਜੋ ਜੀਉਂਦੇ ਅਤੇ ਮੋਏ ਦੋਹਾਂ ਵਿੱਚ ਸੱਚੇ ਗੁਰਾਂ ਨੂੰ ਨਹੀਂ ਭੁਲਾਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who do not forget the True Guru, in life and in death, are truly wise people."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਪੁਰਸ਼ੋਂ ਕੋ (ਜੀਵਦਿਆ) ਜਗ੍ਯਾਸਾ ਅਵਸਥਾ ਮੇਂ ਔਰ (ਮੁਇਆ) ਜੀਵਨ ਮੁਕਤ ਸਮੇਂ ਬਿਖੈ ਸਤਿਗੁਰੂ ਬਿਸਰਤਾ ਨਹੀਂ ਹੈ, ਵਹੀ ਪੁਰਸ਼ ਚਤਰ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਮਨੁੱਖ ਸਿਆਣੇ (ਗਿਣੇ ਜਾਂਦੇ ਹਨ) ਜਿਨ੍ਹਾਂ ਨੂੰ ਸਾਰੀ ਉਮਰ ਕਦੇ ਭੀ ਆਪਣਾ ਸਤਿਗੁਰੂ ਨਹੀਂ ਭੁੱਲਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਵਦਿਆ ਮੁਇਆ = ਜਨਮ ਤੋਂ ਮਰਨ ਤਕ, ਸਾਰੀ ਉਮਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que no abandona al Guru en la vida o en la muerte, sólo él es sagaz y sabio."