[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੇਡੁ ਮੁੰਢਾਹੂ ਕਟਿਆ; ਤਿਸੁ ਡਾਲ ਸੁਕੰਦੇ ॥੩੧॥"
page = 317
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the tree is cut at the roots, its branches wither off."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਬ੍ਰਿਛ ਜੜ੍ਹਾ ਤੋਂ ਵੱਢ ਦਿੱਤਾ ਜਾਂਦਾ ਹੈ ਤਾਂ ਇਸ ਦੀਆਂ ਟਹਿਣੀਆਂ ਸੁੱਕ ਜਾਂਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the tree is cut off at its roots, the branches wither and die. ||31||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਬ੍ਰਿਛ ਕਾ ਪੇਡ ਮੂਲ ਸੇ ਹੀ ਕਾਟਾ ਜਾਵੇ ਤਿਸ ਕੇ ਡਾਲੇ ਸੁਕ ਜਾਤੇ ਹੈਂ। ਦ੍ਰਾਸ੍ਟਾਂਤ ਮੇਂ ਜਿਨੋਂ ਨੇ ਆਦਿ ਸੇ ਹੀ ਸਰਬ ਸੁਖੋਂ ਕਾ ਮੂਲ ਰੂਪ ਨਾਮ ਨਹੀਂ ਜਪਿਆ ਹੈ, ਤਿਨ ਕੇ ਪ੍ਰਲੋਕ ਮੇਂ ਸੁਖ ਪ੍ਰਾਪਤੀ ਰੂਪ ਟਾਸ ਸੁਕ ਜਾਤੇ ਹੈਂ॥੩੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਸਪਸ਼ਟ ਗੱਲ ਹੈ ਕਿ) ਜੋ ਰੁੱਖ ਮੁੱਢੋਂ ਕੱਟਿਆ ਜਾਏ, ਉਸ ਦੇ ਟਾਹਣ ਭੀ ਸੁੱਕ ਜਾਂਦੇ ਹਨ ॥੩੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y es destinado a vagar en la  ronda de interminables encarnaciones.  (31)"