[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਸੁ ਅਸਥਾਨ ਤੇ; ਬਹੁਰਿ ਨ ਆਵੈ ॥"
page = 278
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From that place he returns not again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਓਸ ਥਾਂ ਤੋਂ ਫੇਰ ਉਹ ਮੁੜ ਕੇ ਨਹੀਂ ਆਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "From that place, he does not have to come back again."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਤਿਸ ਸਤਸੰਗ ਅਸਥਾਨ ਸੇ ਪੁਨਾ ਇਨ ਚੌਰਾਸੀ ਜੋਨੋ ਮੇਂ ਨਹੀਂ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਸ ਥਾਂ ਤੋਂ ਮੁੜ ਵਾਪਸ ਨਹੀਂ ਆਉਂਦਾ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਹੁਰਿ = ਮੁੜ, ਵਾਪਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "para ya nunca dar marcha atrás,"