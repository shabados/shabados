[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਧਰ ਬਚਨ ਅਲਾਉ; ਹਉਮੈ ਤਿਆਗੁ ਹੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They speak sweet words and they have already expelled ego from their selves."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮਿੱਠੇ ਬਚਨ ਬੋਲਦੇ ਹਨ, ਹਉਮੈ ਦਾ (ਸਦਾ) ਤਿਆਗ (ਰਖਦੇ ਹਨ)।"