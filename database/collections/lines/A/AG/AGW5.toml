[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਜਨੁ ਦੁਸਟੁ; ਜਾ ਕੈ ਏਕ ਸਮਾਨੈ ॥"
page = 236
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With him a friend and a foe are alike."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਲਈ ਦੋਸਤ ਅਤੇ ਦੁਸ਼ਮਨ ਇਕ ਬਰਾਬਰ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Friend and foe are one and the same to them."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਿਤ੍ਰ ਔਰ ਸਤ੍ਰੂ ਜਿਸ ਕੇ ਏਕ ਸਮਾਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਮਿੱਤਰ ਤੇ ਵੈਰੀ ਇਕੋ ਜਿਹਾ ਜਾਪਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਸਟੁ = ਵੈਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Entonces él considera igual a los amigos y a los enemigos,"