[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਸਨਾ ਜਪੀਐ; ਏਕੁ ਨਾਮ ॥"
page = 211
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With thy tongue repeat the One Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਜੀਭ ਨਾਲ ਤੂੰ ਇਕ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With your tongue, chant the Name of the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਰਸਨਾ ਕਰ ਕੇ ਏਕ ਨਾਮ ਕੋ ਜਪੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜੀਭ ਨਾਲ ਹਰਿ-ਨਾਮ ਜਪਦੇ ਰਹਿਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸਨਾ = ਜੀਭ (ਨਾਲ)। ਏਕੁ ਨਾਮੁ = ਸਿਰਫ਼ ਹਰਿ ਨਾਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Recita el Nombre del Uno con tu lengua;"