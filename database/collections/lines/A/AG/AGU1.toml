[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ ਗੁਰ; ਨਾਹੀ ਭੇਦ ॥੪॥੧੧॥੨੪॥"
page = 1142
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Between the Transcendent Lord and the Guru, There is no difference."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਪ੍ਰਭੂ ਅਤੇ ਗੁਰਾਂ ਦੇ ਵਿੱਚ ਕੋਈ ਭਿੰਨ-ਭੇਤ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no difference between the Supreme Lord God and the Guru. ||4||11||24||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਏਹੀ ਕਹਤੇ ਹੈਂ: ਪਾਰਬ੍ਰਹਮ ਪਰਮੇਸ੍ਵਰ ਔ ਗੁਰੋਂ ਮੇਂ ਭੇਦ ਨਹੀਂ ਹੈ॥੪॥੧੧॥੨੪॥☬ਨਾਮ ਕਾ ਮਹਾਤਮ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਅਤੇ ਪਰਮਾਤਮਾ ਵਿਚ ਕੋਈ ਭੀ ਫ਼ਰਕ ਨਹੀਂ ਹੈ ॥੪॥੧੧॥੨੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੇਦ = ਫ਼ਰਕ, ਵਿੱਥ ॥੪॥੧੧॥੨੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y en los Smritis o Textos Semíticos y logró tener la intuición de que el Guru y Dios son Uno y lo Mismo. (4-11-24)"