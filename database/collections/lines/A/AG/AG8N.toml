[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਕਿਉਣ ਜੋ ਉਸਦੀ ਬੰਦਗੀ ਤੋਣ ਬਿਨਾਣ ਜਹਾਨ ਵਿਚ ਹੋਰ ਕਿਸੇ ਦਾ ਨਿਸ਼ਾਨ ਨਹੀਣ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਕਿ ਗ਼ੈਰ ਬੰਦਗੀਅਸ਼ ਨੀਸਤ ਦਰ ਅਹਾਣ ਆਸਾਰ ॥੩੬॥੭॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "If you can constantly and always stay imbued in Akaalpurakh's meditation,"