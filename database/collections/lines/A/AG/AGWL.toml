[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਸਚਾ ਹੈ ਸੁਖਦਾਤਾ ॥"
page = 1065
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Lord himself is the Giver of peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚਾ ਸੁਆਮੀ ਆਪ ਹੀ ਆਰਾਮ ਬਖਸ਼ਣਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Lord Himself is the Giver of peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ (ਸਚਾ) ਵਾਹਿਗੁਰੂ ਸੁਖ ਦਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਪਰਮਾਤਮਾ ਆਪ ਹੀ (ਸਾਰੇ) ਸੁਖ ਦੇਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੇ = ਆਪ ਹੀ। ਸਚਾ = ਸੱਚਾ, ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Mismo Señor Verdadero es el Dador de Paz,"