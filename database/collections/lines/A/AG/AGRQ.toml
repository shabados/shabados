[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਰੇ. ਕਿਉ ਛੂਟਹਿ; ਬਿਨੁ ਪਿਆਰ ॥"
page = 60
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O My Mind! how shalt thou be delivered without love?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਪ੍ਰੀਤ ਦੇ ਬਗੈਰ ਤੇਰਾ ਛੁਟਕਾਰਾ ਕਿਸ ਤਰ੍ਹਾਂ ਹੋਵੇਗਾ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mind, how can you be saved without love?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਪ੍ਰੇਮ ਕੇ ਬਿਨਾਂ ਕੈਸੇ ਛੁਟੇਂਗਾ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! (ਪ੍ਰਭੂ ਨਾਲ) ਪਿਆਰ ਪਾਉਣ ਤੋਂ ਬਿਨਾ ਤੂੰ (ਮਾਇਆ ਦੇ ਹੱਲਿਆਂ ਤੋਂ) ਬਚ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, nadie es salvado sin el Amor."