data = "ਭਾਤਿ ਭਾਤਿ ਪਕਵਾਨ ਪਕਾਯੋ ॥"
page = 884

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She called in Raja along with the ministers and prepared various types of food."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਭਾਂਤ ਭਾਂਤ ਦੇ ਪਕਵਾਨ ਪਕਵਾਏ।"