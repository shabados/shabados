[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕਾ ਬਚਨੁ; ਅਨਾਥ ਕੋ ਨਾਥ ॥"
page = 177
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru's word is the Master of the Masterless."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦਾ ਸ਼ਬਦ ਨਿਖ਼ਸਮਿਆ ਦਾ ਖ਼ਸਮ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru's Word is the Master of the masterless."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਗੁਰੋਂ ਕਾ ਬਚਨ ਅਨਾਥੋਂ ਕਾ ਨਾਥ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦਾ ਉਪਦੇਸ਼ ਨਿਆਸਰੀਆਂ ਜਿੰਦਾਂ ਦਾ ਸਹਾਰਾ ਬਣਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਥੁ = ਖਸਮ, ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la Palabra del Shabd del Guru es el Soporte de los que no lo tienen."