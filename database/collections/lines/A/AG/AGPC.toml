[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਲਾ ਫੇਰੈ; ਮੰਗੈ ਬਿਭੂਤ ॥"
page = 888
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou tellest the rosary and askest for wealth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਜਪੁਨੀ ਫੇਰਦਾ ਹੈਂ ਅਤੇ ਧਨ ਦੀ ਜਾਚਨਾ ਕਰਦਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You chant on your mala, and beg for money."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਲਾ ਫੇਰਤਾ ਹੈਂ ਔ ਮਾਇਆ ਕੋ ਮਾਂਗਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੇ ਘਰ ਬੈਠ ਕੇ) ਮਾਲਾ ਫੇਰਦਾ ਹੈ, (ਫਿਰ ਉਸ ਧਨਾਢ ਪਾਸੋਂ) ਧਨ-ਪਦਾਰਥ ਮੰਗਦਾ ਹੈ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਭੂਤ = ਧਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "rezas el rosario y pides dinero;"