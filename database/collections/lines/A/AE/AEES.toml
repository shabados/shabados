[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਆਵੈ ਵੈਦੁ ਸੁਵੈਦੁ ਘਰਿ; ਦਾਰੂ ਦਸੈ ਰੋਗੁ ਲਹੰਦਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "If a mature physician is found, he prescribes the right medicine, which removes the malady."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜਦ ਕੋਈ ਸ਼ਿਰੋਮਣੀ ਹਕੀਮ ਘਰ ਵਿਖੇ ਆਉਂਦਾ ਹੈ ਤਾਂ ਉਸ ਦੇ ਦਾਰੂ ਦੱਸਣ ਨਾਲ ਰੋਗ ਹਟ ਜਾਂਦਾ ਹੈ।"