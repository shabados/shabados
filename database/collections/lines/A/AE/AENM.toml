[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਰੇਨੁ; ਨਿਤਿ ਮਜਨੁ ਕਰੈ ॥"
page = 1300
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whosoever bathes ever in the dust of the saints' feet,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੋਈ ਭੀ ਹਮੇਸ਼ਾਂ ਸਾਧੂਆਂ ਦੇ ਪੈਰਾਂ ਦੀ ਧੂੜ ਅੰਦਰ ਨਹਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Continually bathing in the dust of the feet of the Saints,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੀਉ ਨਿਤਾਪ੍ਰਤਿ ਸੰਤੋਂ ਕੀ ਚਰਨ ਧੂਰੀ ਮੇਂ ਇਸਨਾਨ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਮਨੁੱਖ ਸੰਤ ਜਨਾਂ ਦੀ ਚਰਨ-ਧੂੜ ਵਿਚ ਸਦਾ ਇਸ਼ਨਾਨ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇਨੁ = ਚਰਨ-ਧੂੜ। ਨਿਤਿ = ਸਦਾ। ਮਜਨੁ = ਇਸ਼ਨਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bañándose continuamente en el Polvo de los Pies de los Santos"