[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮੇਰੇ; ਸਤਿਗੁਰ ਸੇਵਾ ਸਾਰੁ ॥"
page = 48
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Soul! take thou to the service of the True Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਤੂੰ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਟਹਿਲ ਸੇਵਾ ਸੰਭਾਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, serve the True Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਸਤਿਗੁਰੋਂ ਕੀ ਸੇਵਾ (ਸਾਰੁ) ਉਤਮ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਗੁਰੂ ਦੀ (ਦੱਸੀ ਹੋਈ) ਸੇਵਾ ਧਿਆਨ ਨਾਲ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਰੁ = ਸੰਭਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, entrégate al Servicio del Uno Verdadero"