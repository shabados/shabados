[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਹਜ ਗੁਫਾ ਘਰੁ ਜਾਣੈ ਸਾਚਾ ॥"
page = 939
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, then deems the cave of equipoise his Real Home."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਉਹ ਅਡੋਲਤਾ ਦੀ ਕੰਦਰਾ ਨੂੰ ਆਪਣਾ ਅਸਲੀ ਗ੍ਰਹਿ ਖ਼ਿਆਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Then, one knows that his true home is in the cave of intuitive poise."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿ ਰੂਪ (ਗੁਫਾ) ਰਿਦੇ ਮੇਂ ਜੋ (ਸਾਚਾ) ਘਰ ਪਰਮੇਸਰ ਹੈ ਤਿਸ ਕੋ ਜਾਣੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਸਹਜ-ਅਵਸਥਾ ਦੀ ਗੁਫ਼ਾ ਨੂੰ ਆਪਣਾ ਸਦਾ ਟਿਕੇ ਰਹਿਣ ਦਾ ਘਰ ਸਮਝ ਲਏ (ਭਾਵ, ਜਿਸ ਮਨੁੱਖ ਦਾ ਮਨ ਸਦਾ ਅਡੋਲ ਰਹੇ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜ = ਮਨ ਦੀ ਉਹ ਹਾਲਤ ਜਦੋਂ ਇਹ ਅਡੋਲ ਹੈ, ਅਡੋਲਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La verdadera casa es la cueva del Equilibrio"