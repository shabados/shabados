[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇਵਕ ਕੀ; ਓੜਕਿ ਨਿਬਹੀ ਪ੍ਰੀਤਿ ॥"
page = 1000
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The love of the Lord's slave has endured to the end."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਗੋਲੇ ਦਾ ਪ੍ਰੇਮ ਅੰਤ ਤਾਂਈਂ ਨਾਲ ਨਿਭਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The love which the Lord's servant feels for the Lord lasts forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸੇਵਕ ਕੀ ਅੰਤ ਪਰਯੰਤ ਪ੍ਰੀਤੀ ਨਿਭੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਭਗਤ ਦੀ ਪਰਮਾਤਮਾ ਨਾਲ ਪ੍ਰੀਤ ਅਖ਼ੀਰ ਤਕ ਬਣੀ ਰਹਿੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓੜਕਿ = ਅਖ਼ੀਰ ਤਕ। ਨਿਬਹੀ = ਬਣੀ ਰਹਿੰਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ve, el Sirviente del Señor, Lo ama hasta el final."