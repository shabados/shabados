type = "primary"
data = "ਤਿਹ ਸਿਰ ਛਤ੍ਰੁ ਪੂਤ ਬਿਧਿ ਧਰਿਯੋ ॥"
page = 839

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Soon after that Raja died, the crown of sovereignty was put on the son’s head,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਛਤ੍ਰ ਵਿਧਾਤਾ ਨੇ (ਉਸ ਦੇ) ਪੁੱਤਰ ਦੇ ਸਿਰ ਉਤੇ ਧਰਿਆ।"