[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਖਾਵਾਲੇ ਸੋ ਖਾਣੁ, ਪੀਐ ਪੀਆਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He eats and drinks what is bestowed by the Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਜੋ ਘਰ ਦਾ ਮਾਲਕ) ਖਵਾਲਦਾ ਹੈ ਸੋ ਖਾਂਦੇ ਹਨ ਜੋ ਪਿਆਏ ਸੋ ਪੀਂਦੇ ਹਨ।"