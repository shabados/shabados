type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਸਕਲ ਲਹਿਜੈ ॥੯੮੫॥"
page = 777

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying “hiran-raat”, utter the word “Bhagini”, then speak the words “Satchar-nayak-shatru” and in this way know all the names of Tupak.985."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝੋ ॥੯੮੫॥"