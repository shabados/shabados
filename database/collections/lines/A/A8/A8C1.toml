[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਅਮੋਲਕੁ; ਗੁਰਮੁਖਿ ਪਾਵੈ ॥"
page = 232
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The priceless Name, one attains through the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਮੁੱਲਾ ਨਾਮ, ਜੀਵ ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਪਰਾਪਤ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukhs obtain the Naam, the Priceless Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭਗਵੰਤ ਕਾ ਨਾਮ ਅਮੋਲਕ ਗੁਰਮੁਖ ਹੀ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਕਿਸੇ ਭੀ ਮੁੱਲ ਤੋਂ ਨਹੀਂ ਮਿਲ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਮੋਲਕੁ = ਜੇਹੜਾ ਕਿਸੇ ਭੀ ਮੁੱਲ ਤੋਂ ਨਾਹ ਮਿਲ ਸਕੇ। ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿਣ ਵਾਲਾ ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno recibe el Nombre Invaluable a través del Guru;"