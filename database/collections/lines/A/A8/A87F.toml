[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਰਨਿ ਅਕਾਸ; ਸਭ ਮਹਿ ਪ੍ਰਭ ਪੇਖੁ ॥"
page = 299
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In earth and sky see thou thy Lord everywhere."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਰਤੀ ਤੇ ਅਸਮਾਨ ਹਰ ਥਾਂ ਵਿੱਚ ਤੂੰ ਆਪਣੇ ਸਾਈਂ ਨੂੰ ਵੇਖ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Behold God in all the earth and sky."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਧਰਤੀ ਮੇਂ ਔਰ ਅਕਾਸ ਮੇਂ ਸੰਪੂਰਨ ਅਸਥਾਨੋਂ ਮੇਂ ਪ੍ਰਭੂ ਕੋ ਦੇਖੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਧਰਤੀ ਆਕਾਸ਼ ਸਭ ਵਿਚ ਵੱਸਦਾ ਪਰਮਾਤਮਾ ਵੇਖੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਰਨਿ = ਧਰਤੀ। ਪੇਖੁ = ਵੇਖੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ve a tu Señor en la tierra y en el cielo;"