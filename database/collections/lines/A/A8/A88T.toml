[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਹੁਕਮੁ ਚਲਾਇਦਾ; ਜਗੁ ਧੰਧੈ ਲਾਇਆ ॥"
page = 789
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself issues commands and yokes the mortals to their task."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਆਪ ਹੀ ਫੁਰਮਾਨ ਜਾਰੀ ਕਰਦਾ ਹੈ ਅਤੇ ਪ੍ਰਾਣੀਆਂ ਨੂੰ ਉਨ੍ਹਾਂ ਦੇ ਕੰਮੀ ਜੋੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself issues His Commands, and links the people of the world to their tasks."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਜਗਤ ਕੋ ਰਚ ਕੇ ਧੰਧਿਓਂ ਮੇਂ ਲਾਯਾ ਹੈ ਵਹੁ ਆਪੇ ਹੀ ਅਪਨੇ ਹੁਕਮ ਮੇਂ ਚਲਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਹੀ ਆਪਣਾ ਹੁਕਮ ਵਰਤਾ ਰਿਹਾ ਹੈ ਤੇ ਜਗਤ ਨੂੰ ਉਸ ਨੇ ਆਪ ਹੀ ਮਾਇਕ ਧੰਧੇ ਵਿਚ ਲਾ ਰੱਖਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor comanda a todos y les encomienda a todos sus tareas."