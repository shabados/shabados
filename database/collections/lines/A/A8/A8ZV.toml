[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਬਾ; ਮਾਇਆ ਸਾਥਿ. ਨ ਹੋਇ ॥"
page = 595
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O sire, wealth goes not with the man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਾਬਾ! ਦੌਲਤ ਆਦਮੀ ਦੇ ਨਾਲ ਨਹੀਂ ਜਾਂਣੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Baba, the wealth of Maya does not go with anyone."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ (ਬਾਬਾ) ਪਿਤਾ ਜੀ! ਮਾਯਾ ਕਿਸੀ ਕੇ ਸਾਥ ਨਹੀਂ ਹੋਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਇਥੋਂ ਤੁਰਨ ਵੇਲੇ) ਮਾਇਆ ਜੀਵ ਦੇ ਨਾਲ ਨਹੀਂ ਜਾਂਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਬਾ = ਹੇ ਭਾਈ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Baba, Maya no será tu compañera; Maya ha engañado al mundo entero,"