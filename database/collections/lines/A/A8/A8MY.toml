data = "ਮ੍ਰਿਤਕ ਖਸਮ ਕੌ ਬਹੁਰਿ ਪ੍ਰਜਾਰਿਯੋ ॥"
page = 989

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "First she cremated her son and then placed her husband in the pyre."

[[content]]
