[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਲਿ ਨਰਾਇਣੁ ਮੇਰੈ ॥"
page = 630
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Pervading God is with me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਆਪਕ ਵਾਹਿਗੁਰੂ ਮੇਰੇ ਅੰਗ ਸੰਗ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is always with me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਨਾਰਾਇਣ ਜੀ ਹਮਾਰੇ ਸਾਥ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਮੇਰੇ ਨਾਲ (ਮੇਰੇ ਹਿਰਦੇ ਵਿਚ ਵੱਸ ਰਿਹਾ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਰਾਇਣੁ = {नार = अयन} ਪਰਮਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Señor y Maestro está siempre conmigo"