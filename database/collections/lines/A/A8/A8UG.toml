[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਰਮੇ ਜਨਮ ਅਨੇਕ; ਸੰਕਟ ਮਹਾ ਜੋਨ ॥"
page = 458
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have wandered through many births and have suffered great pangs in these existences."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਘਣੇਰਿਆਂ ਜਨਮਾਂ ਅੰਦਰ ਭਟਕਿਆ ਹਾਂ ਅਤੇ ਜੂਨੀਆਂ ਅੰਦਰ ਭਾਰੇ ਕਸ਼ਟ ਉਠਾਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have wandered through countless incarnations, suffering terrible pain in these lives."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਅਨੇਕ ਜਨਮੋਂ ਮੇਂ ਭਰਮੇ ਹੈਂ ਔਰ ਤਿਨ ਜੂਨੋਂ ਮੇਂ ਮਹਾਂ ਸੰਕਟ ਪਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਹੇ ਮੁਰਾਰੀ! ਮੈਂ ਅਨੇਕਾਂ ਜਨਮਾਂ ਵਿਚ ਭਟਕਿਆ ਹਾਂ, ਮੈਂ ਕਈ ਜੂਨਾਂ ਦੇ ਵੱਡੇ ਦੁੱਖ ਸਹਾਰੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਰਮੇ = ਭਟਕਦੇ ਰਹੇ। ਸੰਕਟ ਮਹਾ = ਵੱਡੇ ਦੁੱਖ। ਜੋਨ = ਜੂਨਾਂ ਦੇ (ਜੋਨਿ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He vagado a través de muchos nacimientos y he sufrido los espasmos de nacer de un vientre."