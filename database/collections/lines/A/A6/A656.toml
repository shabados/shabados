[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕਾ ਦੋਖੀ; ਨ ਮਰੈ. ਨ ਜੀਵਾਈਐ ॥"
page = 280
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The maligner of the saint hangs between life and death."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਤੇ ਊਝ ਲਾਉਣ ਵਾਲਾ ਜਿੰਦਗੀ ਤੇ ਮੌਤ ਦੇ ਵਿਚਕਾਰ ਲਟਕਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He does not die, but he does not live either."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਸੰਤ ਕਾ ਦੋਖੀ ਨ ਮਰਤਾ ਹੈ ਔ ਨਾ ਜੀਵਾਈਤਾ ਹੈ, ਭਾਵ ਦੁਖੀ ਰਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਹ ਉਹ ਜੀਊਂਦਿਆਂ ਵਿਚ ਤੇ ਨਾਹ ਮੋਇਆਂ ਵਿਚ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ni vive ni muere."