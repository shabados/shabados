[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੀ ਉਸਤਤਿ; ਕਰਹੁ ਦਿਨੁ ਰਾਤਿ ॥"
page = 280
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Praise thou the Lord day and night."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਰਾਤ ਤੂੰ ਸਾਹਿਬ ਦੀ ਕੀਰਤੀ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Praise God, day and night."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪ੍ਰਭੂ ਕੀ ਉਸਤਤੀ ਦਿਨੇ ਰਾਤ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਰਾਤਿ ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਗਾਓ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਸਤਤਿ = ਵਡਿਆਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "me postro eternamente en Reverencia ante Él."