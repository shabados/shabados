[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਵ ਭਾਰ ਅਪਾਰ ਨਿਵਾਰਨ ਕੌ; ਕਲਿਕੀ ਅਵਤਾਰ ਕਹਾਵਹਿਗੇ ॥"
page = 566

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "For the removal the burden of the earth, he be called Kalki incarnation"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਦੇ ਅਪਾਰ ਭਾਰ ਨੂੰ ਉਤਾਰਨ ਲਈ (ਪ੍ਰਭੂ ਜੀ) ਕਲਕੀ ਅਵਤਾਰ ਅਖਵਾਉਣਗੇ।"