[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਰਾਤਿ ਹਨ੍ਹੇਰੀ ਚਮਕਦੇ; ਲਖ ਕਰੋੜੀ ਅੰਬਰਿ ਤਾਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The lacs of stars shine in the dark night but with the moon rise they become dim."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅਕਾਸ਼ ਵਿਖੇ ਕਾਲੀ ਬੋਲੀ ਰਾਤ ਨੂੰ ਲੱਖਾਂ ਕਰੋੜਾਂ ਤਾਰੇ ਚਮਕਦੇ ਹਨ।"