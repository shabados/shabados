[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਖਹੁਰੀ ਸਾਣ ਧਰਾਇ; ਅੰਗੁ ਹਛਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Grinding against whet stones its parts are pruned i.e. many articles are made out of it."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਖੁਰਦਰੀ ਸਾਣ ਉਤੇ ਰੱਖਕੇ (ਤਲਵਾਰਾਂ, ਕਾਚੂ, ਕੈਂਚੀ ਆਦਿ ਚੰਗੇ 'ਅੰਗ') ਔਜ਼ਾਰ ਬਣਾਏ ਜਾਂਦੇ ਹਨ।"