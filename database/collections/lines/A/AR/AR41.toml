[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਹਾ ਭਗਤਿ ਸਾਰ ਤਤੁ ॥"
page = 895
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This is the real essence of the Lord's devotional service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੀ ਪ੍ਰੇਮ-ਮਈ ਸੇਵਾ ਦਾ ਏਹੀ ਅਸਲੀ ਨਿਚੋੜ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is the essence of true devotional worship."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹੀ ਭਗਤੀ ਕਾ ਸ੍ਰੇਸਟ ਤਤੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹੀ ਵਧੀਆ ਭਗਤੀ ਹੈ, ਇਹੀ ਹੈ ਭਗਤੀ ਦੀ ਅਸਲੀਅਤ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਰ = ਸ੍ਰੇਸ਼ਟ। ਤਤੁ = ਅਸਲੀਅਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "medita en Él, pues es la Esencia de la Alabanza y de la Devoción."