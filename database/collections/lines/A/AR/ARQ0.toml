[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਾਗ ਸੁਲਖਣਾ; ਹਰਿ ਕੰਤੁ ਹਮਾਰਾ ਰਾਮ ॥"
page = 846
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am blessed with auspicious destiny, for my God is my Bride-groom."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਮੁਬਾਰਕ ਪ੍ਰਾਲਭਧ ਵਾਲਾ ਹਾਂ ਕਿਉਂ ਜੋ ਮੇਰਾ ਵਾਹਿਗੁਰੂ ਮੇਰਾ ਭਰਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By blessed destiny, I have found my Husband Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੇਸਟ ਲਖਣੋਂ ਵਾਲਾ ਔਰ ਭਾਗੋਂ ਵਾਲਾ ਹਰੀ (ਰਾਮ) ਵਿਆਪਕ ਹਮਾਰਾ (ਕੰਤੁ) ਪਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਹੇਲੀਏ! ਸਾਡਾ ਕੰਤ-ਪ੍ਰਭੂ ਸੋਹਣੇ ਲੱਛਣਾਂ ਵਾਲੇ ਭਾਗਾਂ ਵਾਲਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਲਖਣਾ = ਸੋਹਣੇ ਲੱਛਣਾਂ ਵਾਲੇ। ਭਾਗ ਸੁਲਖਣਾ = ਸੋਹਣੇ ਲੱਛਣਾਂ ਵਾਲੇ ਭਾਗ, ਚੰਗੇ ਭਾਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bendito, bendito soy, pues Dios es mi Esposo."