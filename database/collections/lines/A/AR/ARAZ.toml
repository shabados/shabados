[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਤ ਨਿਤ ਰਿਦੈ ਸਮਾਲਿ; ਪ੍ਰੀਤਮੁ ਆਪਣਾ ॥"
page = 752
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever, ever remember thou Thy Love in thy mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਮੇਸ਼ਾਂ! ਹਮੇਸ਼ਾਂ ਹੀ ਤੂੰ ਆਪਣੇ ਪਿਆਰੇ ਨੂੰ ਆਪਣੇ ਚਿੱਤ ਅੰਦਰ ਯਾਦ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Continually, continuously, remember and cherish your Beloved Lord in your heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਭੀ ਨਿਤ੍ਯ ਜੋ ਪ੍ਰੀਤਮ ਆਪਣਾ ਹੈ ਤਿਸ ਕੋ ਨਿਤ੍ਯੰਪ੍ਰਤਿ ਮਨ ਮੇਂ ਸੰਭਾਲ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਆਪਣੇ ਪ੍ਰੀਤਮ ਪ੍ਰਭੂ ਨੂੰ ਸਦਾ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਸਾਂਭ ਕੇ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਿਦੈ = ਹਿਰਦੇ ਵਿਚ। ਸਮਾਲਿ = ਸਾਂਭ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Alaba siempre al Señor en tu corazón;"