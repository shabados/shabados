[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਸਕਿ ਰਸਕਿ ਗੁਨ ਗਾਵਹ ਗੁਰਮਤਿ; ਲਿਵ ਉਨਮਨਿ ਨਾਮਿ ਲਗਾਨ ॥"
page = 1335
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the Guru's instructions, I sing the Lord's praise with love and relish and my mind is attuned to the most-exalted Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਦੁਆਰਾ ਮੈਂ ਪਿਆਰ ਤੇ ਸੁਆਦ ਨਾਲ ਪ੍ਰਭੂ ਦਾ ਜੱਸ ਗਾਇਨ ਕਰਦਾ ਹਾਂ ਅਤੇ ਮੇਰੇ ਚਿੱਤ ਦੀ ਪਰਮ ਉਤਕ੍ਰਿਸ਼ਟ ਨਾਮ ਨਾਲ ਪਿਰਹੜੀ ਪੈ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Guru's Teachings, I sing the Glorious Praises of the Lord with joyous love and delight; I am enraptured, lovingly attuned to the Naam, the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰੋਂ ਕੀ (ਮਤਿ) ਸਿਖ੍ਯਾ ਸੇ ਮਨ ਤਨ ਕਰ (ਰਸਕਿ) ਪ੍ਰੇਮ ਸਾਥ ਤਿਸ ਵਾਹਿਗੁਰੂ ਕੇ ਗੁਣੋਂ ਕੋ ਹਮ ਗਾਵਤੇ ਹੈਂ, ਤਿਸੀ ਕਰ ਅਬ ਹਮਾਰੀ ਬ੍ਰਿਤੀ (ਉਨਮਨਿ) ਤੁਰੀਆ ਸਰੂਪ ਨਾਮੀ ਮੇਂ ਲਾਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਮੱਤ ਉਤੇ ਤੁਰ ਕੇ, ਆਓ ਅਸੀਂ ਮੁੜ ਮੁੜ ਸੁਆਦ ਨਾਲ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਵਿਆ ਕਰੀਏ, (ਇਸ ਤਰ੍ਹਾਂ) ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਿਚ ਲਗਨ ਲੱਗ ਜਾਂਦੀ ਹੈ (ਪ੍ਰਭੂ-ਮਿਲਾਪ ਦੀ) ਤਾਂਘ ਵਿਚ ਸੁਰਤ ਟਿਕੀ ਰਹਿੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸਕਿ = ਸੁਆਦ ਨਾਲ। ਰਸਕਿ ਰਸਕਿ = ਮੁੜ ਮੁੜ ਸੁਆਦ ਨਾਲ। ਗਾਵਹ = ਆਓ ਅਸੀਂ ਗਾਇਆ ਕਰੀਏ। ਉਨਮਨਿ = ਉਨਮਨ ਵਿਚ, (ਪ੍ਰਭੂ-ਮਿਲਾਪ ਦੀ) ਤਾਂਘ ਵਿਚ। ਨਾਮਿ = ਨਾਮ ਵਿਚ। ਲਗਾਨ = ਲੱਗ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mediante la Enseñanza del Guru, canto la Gloriosa Alabanza del Señor"