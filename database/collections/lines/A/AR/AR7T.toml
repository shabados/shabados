type = "primary"
data = "ਖਰੇ ਤੋਹਿ ਦੁਆਰੇ ॥੬੪੪॥"
page = 268

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Hanuman, falling at the feet of Sita, said, “O mother Sita! Ram has killed the enemy (Ravana) and now he is standing at your door.644."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਹੁਣ) ਤੁਹਾਡੇ ਦੁਆਰ ਉਤੇ ਖੜੋਤੇ ਹਨ ॥੬੪੪॥"