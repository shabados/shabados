[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਰਾਮ ਰਾਮ; ਲਿਵ ਲਾਇ ॥"
page = 865
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Embrace thou love for the Lord Master's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੁਆਮੀ ਮਾਲਕ ਦੇ ਨਾਮ ਨਾਲ ਪਿਰਹੜੀ ਪਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Embrace love for the Lord, Raam, Raam, Raam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਮ ਰਾਮ ਰਮਿਆ ਜਾਣ ਕੇ ਬਿਰਤੀ ਕੋ ਲਗਾਇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਚਰਨਾਂ ਵਿਚ ਸਦਾ ਸੁਰਤ ਜੋੜੀ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਿਵ ਲਾਇ = ਸੁਰਤ ਜੋੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nuestro Único Santuario; entona entonces tu ser en tu Señor, tu Dios."