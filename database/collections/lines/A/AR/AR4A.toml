data = "ਕਿ ਬੇਰੂੰ ਬਿਅਫ਼ਤਾਦ ਪਰਦਹ ਨਕਾਬ ॥੧੭੮॥"
page = 1424

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘So that I may keep the secret enshroud.(178)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨਾਲ ਕਿ ਮੇਰੇ ਘੁੰਡ ਦਾ ਪਰਦਾ ਹਟ ਜਾਏ ॥੧੭੮॥"