[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਤੂ ਸੈਣਕੜੇ ਕੰਮ ਅਜਿਹੇ ਕੀਤੇ ਹਨ ਜਿਹੜੇ ਤੇਰੇ ਕੰਮ ਨਹੀਣ ਆਪੁਣੇ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਸਦ ਕਾਰ ਕਰਦਾਈ ਕਿ ਨਯਾਇਦ ਬਕਾਰਿ ਤੂ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "In the same way, God's devotees in my religion come together in congregations of pious saints,"