[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਕਉ; ਪ੍ਰਭੁ ਹੋਇਓ ਦਇਆਲੁ ॥"
page = 289
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto His slave the Lord has become merciful."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਗੋਲੇ ਉਤੇ ਮਾਲਕ ਮਿਹਰਬਾਨ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Unto His humble servant, God has shown His kindness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਜਨ ਕੌ ਪ੍ਰਭੂ ਦਿਆਲ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪਣੇ (ਅਜੇਹੇ) ਸੇਵਕ ਉਤੇ ਮੇਹਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨ ਕਉ = ਆਪਣੇ ਸੇਵਕ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Señor es Bondadoso con Su sirviente"