[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮ ਤੇਰੇ ਕੀ ਆਸ; ਮਨਿ ਧਾਰੀ ॥੨॥"
page = 388
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "thy Name is my mind's only hope."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਨਾਮ ਦੀ ਹੀ ਮੇਰੇ ਚਿੱਤ ਅੰਦਰ ਊਮੈਦ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your Name is my mind's only hope. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਤੇਰੇ ਨਾਮ ਕੀ ਆਸਾ ਮਨ ਮੇਂ ਧਾਰਨ ਕਰੀ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੇ (ਬਿਰਦ-ਪਾਲ) ਨਾਮ ਦੀ ਆਸ ਮਨ ਵਿਚ ਰੱਖੀ ਹੋਈ ਹੈ (ਕਿ ਤੂੰ ਸਰਨ-ਆਏ ਦੀ ਲਾਜ ਰੱਖੇਂਗਾ) ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ese soy yo; ahora Tu Nombre es la única esperanza de mi mente. (2)"