[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲੂਲਾ ਪੈਰੀ ਹੋਂਵਦੀ; ਟੰਗਾਂ ਮਾਰਿ ਨ ਉਠਿ ਖਲੋਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Though with feet, a child (man) is cripple and cannot stand upon his legs."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੈਰਾਂ ਦੇ ਹੁੰਦਿਆਂ ਲੂਲ੍ਹਿਆਂ ਵਾਂਗੂੰ ਟੰਗਾਂ ਮਾਰਦਾ ਹੈ, ਉਠ ਨਹੀਂ ਖਲੋਂਦਾ।"