[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਸਤਿਗੁਰੁ ਚਹੁ ਜੁਗੀ; ਆਪਿ ਆਪੇ ਪਰਮੇਸਰੁ ॥"
page = 1406
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou are the True Guru of the four ages and thou thyself are the Supreme Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਚਾਰੇ ਹੀ ਯੁਗਾਂ ਦਾ ਸੱਚਾ ਗੁਰੂ ਹੈਂ ਅਤੇ ਤੂੰ ਖੁਦ ਹੀ ਸ਼੍ਰੋਮਣੀ ਸਾਹਿਬ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the True Guru, throughout the four ages; You Yourself are the Transcendent Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਤਿਗੁਰ ਜੀ! ਤੁਮ ਚਾਰੋਂ ਜੁਗੋਂ ਮੇਂ ਆਪ ਹੀ ਆਪ ਪਰਮੇਸ੍ਵਰ ਸਰੂਪ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਰੂ ਰਾਮਦਾਸ! ਤੂੰ ਚਾਰ ਜੁਗਾਂ ਵਿਚ ਹੀ ਥਿਰ ਗੁਰੂ ਹੈਂ, (ਮੇਰੀਆਂ ਨਜ਼ਰਾਂ ਵਿਚ ਤਾਂ) ਤੂੰ ਹੀ ਪਰਮੇਸਰ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਹੁ ਜੁਗੀ = ਚੌਹਾਂ ਹੀ ਜੁਗਾਂ ਵਿਚ ਰਹਿਣ ਵਾਲਾ, ਸਦਾ-ਥਿਰ। ਆਪੇ = ਆਪ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres el Verdadero Guru, a través de las cuatro épocas, Tú Mismo eres el Señor"