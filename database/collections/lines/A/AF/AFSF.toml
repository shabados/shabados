data = "ਬਚਨ ਕਹਤ ਨਊਆ ਸੁਤ ਭਏ ॥੩॥"
page = 891

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When they were passing through the thick jungle, the barber’s son called him.(3)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤਾਂ ਉਸ ਨਾਲ) ਨਾਈ ਦੇ ਪੁੱਤਰ ਨੇ ਬੋਲ ਸਾਂਝੇ ਕੀਤੇ ॥੩॥"