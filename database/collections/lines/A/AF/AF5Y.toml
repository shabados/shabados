[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਨ ਕਰਾਵਨਹਾਰੁ; ਪ੍ਰਭੁ ਜਾਨੈ ॥"
page = 294
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He deems that the Lord is the doer of deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਮਝਦਾ ਹੈ ਕਿ ਸੁਆਮੀ ਕੰਮਾਂ ਦੇ ਕਰਨ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He knows God as the Doer, the Cause of causes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਮੇਂ ਕਰਨੇ ਕਰਾਵਨੇ ਹਾਰਾ ਏਕ ਪ੍ਰਭੂ ਕੋ ਹੀ ਜਾਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਭ ਕੰਮ ਕਰਨ ਵਾਲਾ ਤੇ (ਜੀਆਂ ਪਾਸੋਂ) ਕਰਾਉਣ ਵਾਲਾ ਪ੍ਰਭੂ ਨੂੰ ਹੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Verdaderas son las palabras pronunciadas por los Santos."