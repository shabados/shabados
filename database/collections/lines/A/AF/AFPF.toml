data = "ਭੇਦ ਅਭੇਦ ਨ ਚੀਨਤ ਭਏ ॥"
page = 980

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Harkening to this they consented but had not discerned the secret."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਵਿਚਲੇ ਭੇਦ ਨੂੰ ਕੋਈ ਸਮਝ ਨਾ ਸਕਿਆ।"