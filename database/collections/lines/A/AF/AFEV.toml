[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਭ ਦੈਤਨ ਕੋ ਛੈ ਕਰਉ; ਬਸਉ ਸਿਵਪੁਰੀ ਜਾਇ ॥੨੩॥"
page = 77

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She said, “I shall destroy all the demons, go and abide in the city of Shiva.23."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਦੈਂਤਾਂ ਨੂੰ ਨਾਸ਼ ਕਰਕੇ ਹੀ ਸ਼ਿਵ-ਪੁਰੀ ਵਿਚ ਵਸਾਂਗੀ ॥੨੩॥"