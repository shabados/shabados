[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚਾ ਤੇਰਾ ਅਮਰੁ; ਸਚਾ ਦੀਬਾਣੁ ॥"
page = 463
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is Thy order and true Thy court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚਾ ਹੈ ਤੇਰਾ ਹੁਕਮ ਅਤੇ ਸੱਚਾ ਤੇਰਾ ਦਰਬਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True is Your Command, and True is Your Court."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਅਮਰੁ) ਰਾਜ ਭੀ ਤੇਰਾ ਸਤ ਹੈ, ਤੇਰਾ (ਦੀਬਾਣੁ) ਦਰਬਾਰ, ਭਾਵ ਸਤਸੰਗ ਭੀ ਸਤ੍ਯ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਾਤਸ਼ਾਹ! ਤੇਰੀ ਪਾਤਸ਼ਾਹੀ ਤੇ ਤੇਰਾ ਦਰਬਾਰ ਅਟੱਲ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਮਰੁ = ਹੁਕਮੁ, ਪਾਤਸ਼ਾਹੀ। ਦੀਬਾਣੁ = ਦੀਵਾਨ, ਕਚਹਿਰੀ, ਦਰਬਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Verdad es Tu Voluntad, Verdad es Tu Palabra."