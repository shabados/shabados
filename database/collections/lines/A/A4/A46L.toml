[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਕਿ ਛੋਟੇ ਵੱਡੇ ਸਾਰੇ ਹੀ ਸੱਚ ਦੇ ਉਪਾਸ਼ਕ ਬਣ ਗਏ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਕਿ ਖ਼ੁਰਦੋ ਬਜ਼ੁਰਗ ਆਮਦਾ ਰਾਸਤ-ਬਾਜ਼ ॥੭੯॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "That, young and old, all have become disciples and followers of truth. (79)       "