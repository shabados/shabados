type = "primary"
data = "ਉਠੈ ਅਸਤ੍ਰ ਘਾਤੰ ॥੨੮੩॥"
page = 579

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors shouting “kill, kill” were coming near and with the blows of their arms and weapons, the wounds were being inflicted.283."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਅਸਤ੍ਰਾਂ ਦੇ ਘਾਤ ਹੁੰਦੇ ਹਨ ॥੨੮੩॥"