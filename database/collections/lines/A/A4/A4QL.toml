[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਠਗਿਆ ਮੁਠਾ ਜਾਇ ॥"
page = 142
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, he is beguiled and defrauded."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਉਹ ਛਲਿਆ ਤੇ ਲੁੱਟਿਆ ਪੁੱਟਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, they are deluded and defrauded."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਕਾਮ ਆਦਕੋਂ ਠਗੋਂ ਕਰ ਠਗਿਆ ਗਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਉਹ) ਮਨੁੱਖ ਠੱਗਿਆ ਜਾ ਰਿਹਾ ਹੈ, ਲੁੱਟਿਆ ਜਾ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਠਾ = ਲੁੱਟਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así será engañado, oh, dice Nanak, engañado por la vida,"