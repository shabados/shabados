[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨ ਕੀ ਭਗਤਿ; ਮੇਰੇ ਪ੍ਰਭ ਭਾਈ ॥"
page = 494
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, whose devotional service is pleasing to my Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਦੀ ਪ੍ਰੇਮ-ਮਈ ਸੇਵਾ, ਮੈਂਡੇ ਸੁਆਮੀ ਨੂੰ ਚੰਗੀ ਲੱਗਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those whose devotional worship is pleasing to my God"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਦਾਸੋਂ ਕੀ ਸੇਵਾ ਮੇਰੇ ਹਰਿ ਪ੍ਰਭੂ ਕੋ ਅਛੀ ਲਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਦੀ ਭਗਤੀ ਪਰਮਾਤਮਾ ਨੂੰ ਪਸੰਦ ਆਉਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ ਭਾਈ = ਪ੍ਰਭੂ ਨੂੰ ਪਸੰਦ ਆਉਂਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquéllos cuya Devoción es aprobada por el Señor, dice Nanak,"