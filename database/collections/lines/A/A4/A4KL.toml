[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਤਿਤ. ਉਧਾਰਨ ਤਾਰਨ; ਬਲਿ ਬਲਿ. ਬਲੇ ਬਲਿ ਜਾਈਐ ॥"
page = 1005
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Thou the Saviour and Emancipator of sinners, I am ever a sacrifice, sacrifice, sacrifice, sacrifice unto Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਤੂੰ ਪਾਪੀਆਂ ਨੂੰ ਬਚਾਉਦਹਾਰ ਅਤੇ ਬੰਦਖ਼ਲਾਸ ਕਰਨ ਵਾਲੇ, ਮੈਂ ਤੇਰੇ ਉਤੋਂ ਸਦਾ ਹੀ ਕੁਰਬਾਨ ਕੁਰਬਾਨ, ਕੁਰਬਾਨ, ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Redeemer of sinners, who carries us across; I am a sacrifice, a sacrifice, a sacrifice, a sacrifice to Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਾਪੀਆਂ ਕੋ ਉਧਾਰਨੇ ਕੋ (ਤਾਰਨ) ਬੇੜਾ ਰੂਪ ਹੋ। ਇਸੀ ਤੇ ਮਨ, ਤਨ, ਬਾਣੀ ਕਰ ਕੇ ਬਲਿਹਾਰ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਿਕਾਰੀਆਂ ਨੂੰ ਬਚਾਣ ਵਾਲੇ ਅਤੇ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘਾਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਤੋਂ ਸਦਾ ਹੀ ਕੁਰਬਾਨ ਜਾਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿਤ ਉਧਾਰਨ = ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗਿਆਂ ਨੂੰ ਵਿਕਾਰਾਂ ਤੋਂ ਬਚਾਣ ਵਾਲਾ। ਤਾਰਨ = (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘਾਣ ਵਾਲਾ। ਬਲਿ ਜਾਇਐ = ਕੁਰਬਾਨ ਜਾਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Emancipador, oh Purificador de los malhechores, ofrezco mi ser para siempre como un sacrificio a Ti."