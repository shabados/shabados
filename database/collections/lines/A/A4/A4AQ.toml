[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਿਚਹੁ; ਦੂਜਾ ਠਾਕਿ ਰਹਾਏ ॥੩॥"
page = 842
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within him, then, is stilled the love of another."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਅੰਦਰੋਂ ਤਾਂ ਹੋਰਸ ਦੀ ਪ੍ਰੀਤ ਨਾਸ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Duality is subdued within. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦ੍ਵੈਤ ਭਾਵ ਮਨ ਕੇ ਬੀਚ ਸੇ (ਠਾਕਿ) ਰੋਕ (ਰਹਾਏ) ਰਖਤਾ, ਭਾਵ ਹਟਾਇ ਦੇਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਆਪਣੇ) ਅੰਦਰੋਂ ਵੱਖਰੇ ਦਿੱਸ ਰਹੇ ਜਗਤ ਦਾ ਮੋਹ ਰੋਕ ਰੱਖਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਜਾ = ਮਾਇਆ ਦਾ ਮੋਹ। ਠਾਕਿ = ਰੋਕ ਦੇ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, aquél que encuentra al Guru Verdadero, logra al Uno Solo y en su interior la idea del otro termina.(3)"