[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਸਾਸਿ ਸਾਸਿ; ਸਿਮਰਹੁ ਪ੍ਰਭ ਊਚੇ ॥"
page = 270
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "At ever breath remember the most high Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਹਰ ਸੁਆਸ ਨਾਲ ਪਰਮ-ਬੁਲੰਦ ਸਾਹਿਬ ਨੂੰ ਚੇਤੇ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mind, with each and every breath, remember God on High."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਸ੍ਵਾਸ ਸ੍ਵਾਸ ਸੇ ਤਿਸ ਸਰਬ ਤੇ ਊਚੇ ਪ੍ਰਭੂ ਕੌ ਸਿਮਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਉਸ ਉਚੇ ਪ੍ਰਭੂ ਨੂੰ ਸ੍ਵਾਸ ਸ੍ਵਾਸ ਯਾਦ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਸਿ ਸਾਸਿ = ਦਮ-ਬ-ਦਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente, con cada respiración, eleva a Dios en tu ser."