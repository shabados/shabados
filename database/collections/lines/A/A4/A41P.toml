[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਘਨ ਬਾਸੁ ਕੂਲੇ ॥"
page = 1185
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Tender trees emit abundant fragrance."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਰਮ ਬਿਰਛ ਘਣੇਰੀ ਖੁਸ਼ਬੂ ਦਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The tender young plants smell so good,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖ ਪਰਮੇਸ੍ਵਰ ਕੇ ਜਸ ਰੂਪੀ ਸਘਨ ਵਾਸਨਾ ਕੋ ਲੇ ਕਰ ਹਰੇ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਜਦੋਂ ਬਸੰਤ ਦਾ ਸਮਾ ਆਉਂਦਾ ਹੈ, (ਤਦੋਂ ਰੁੱਖ ਤਰਾਵਤ ਨਾਲ) ਸੰਘਣੀ ਛਾਂ ਵਾਲੇ, ਸੁਗੰਧੀ ਵਾਲੇ ਅਤੇ ਨਰਮ ਹੋ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਘਨ = ਸੰਘਣੀ ਛਾਂ ਵਾਲੇ। ਬਾਸੁ = ਸੁਗੰਧੀ। ਕੂਲੇ = ਨਰਮ, ਕੋਮਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunas plantan emiten intensas fragancias,"