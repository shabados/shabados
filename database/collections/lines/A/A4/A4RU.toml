[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਮੋਹ ਕਾ ਏਹੁ ਪਸਾਰਾ ॥"
page = 1068
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The world is all but mammon's love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੰਸਾਰ ਸਮੂਹ ਮੋਹਨੀ ਮਾਇਆ ਦੀ ਮਮਤਾ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The expanse is the manifestation of emotional attachment to Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹੁ ਸਭ ਪਸਾਰਾ ਮਾਇਆ ਮੋਹ ਕਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰ ਪਾਸੇ ਮਾਇਆ ਦੇ ਮੋਹ ਦਾ ਪ੍ਰਭਾਵ ਬਣਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਸਾਰਾ = ਖਿਲਾਰਾ। ਮੋਹ ਕਾ ਪਸਾਰਾ = ਹਰ ਪਾਸੇ ਮੋਹ ਦਾ ਪ੍ਰਭਾਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es así como uno se involucra con los atractivos de Maya y se llena de apego."