[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੁਆਰ ਕੰਨਿਆ; ਜੈਸੇ ਕਰਤ ਸੀਗਾਰਾ ॥"
page = 792
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I bedeck myself like a virgin young girl,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਅਣਵਿਆਹੀ ਜੁਆਨ ਕੁੜੀ ਦੀ ਤਰ੍ਹਾਂ ਹਾਰ-ਸ਼ਿੰਗਾਰ ਲਾਉਂਦੀ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I decorate myself like a young virgin;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੀ ਕੁਆਰੀ ਕੰਨਿਆਂ ਸ਼ੀਂਗਾਰ ਕਰਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਕੁਆਰੀ ਲੜਕੀ ਸ਼ਿੰਗਾਰ ਕਰਦੀ ਰਹੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੁਆਰ = ਕੁਆਰੀ। ਕੰਨਿਆ = ਕੁੜੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No es para una virgen adornar su ser,"