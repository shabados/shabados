type = "primary"
data = "ਨਿਸ਼ਸਤੰਦ ਵਜ਼ੀਰਾਨ ਓ ਪੇਸ਼ ਪਸਤ ॥੯॥"
page = 1397

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And all his Ministers came and positioned themselves around him.(9)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਸ ਦੇ ਅਗੇ ਪਿਛੇ ਵਜ਼ੀਰ ਆ ਬੈਠੇ ॥੯॥"