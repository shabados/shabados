[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਅੱਖਾਣ ਅੱਗੋਣ ਉਹ ਨਾ-ਮਿਹਰਬਾਨ ਪਿਆਰਾ ਲੰਘ ਗਿਆ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਅਜ਼ ਪੇਸ਼ਿ ਚਸ਼ਮ ਆਂ ਬੁਤਿ ਨਾਂ-ਮਿਹਰਬਾਂ ਗੁਜ਼ਸ਼ਤ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "It is still possible if one is prepared to put his foot on the crucifix like Mansoor. (12) (2)"