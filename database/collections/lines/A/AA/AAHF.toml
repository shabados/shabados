[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਰੈ ਨ ਰਾਖੈ; ਅਵਰੁ ਨ ਕੋਇ ॥"
page = 286
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "None else can kill pre preserve (but God)."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "(ਵਾਹਿਗੁਰੂ ਦੇ ਬਾਝੋਂ) ਹੋਰ ਕੋਈ ਮਾਰ ਜਾ ਰੱਖ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one else can kill or preserve"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾ ਤੋ ਕੋਈ ਮਾਰਤਾ ਹੈਂ ਔਰ ਨਾ ਹੀ ਰਾਖਤਾ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਤੋਂ ਬਿਨਾ ਜੀਵਾਂ ਨੂੰ) ਨਾਹ ਕੋਈ ਮਾਰ ਸਕਦਾ ਹੈ, ਨਾਹ ਰੱਖ ਸਕਦਾ ਹੈ, (ਪ੍ਰਭੂ ਜੇਡਾ) ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਵਰੁ = ਹੋਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nadie puede aniquilar o preservar."