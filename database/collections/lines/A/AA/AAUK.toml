[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਫਲਿਓ ਬਿਰਖੁ; ਅੰਮ੍ਰਿਤ ਫਲੁ ਪਾਵਹਿ ॥"
page = 1033
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His tree of life is fruitful and bears the ambrosial fruit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਜੀਵਨ ਦਾ ਬਿਰਛ ਫਲਾਦਾਇਕ ਹੈ ਅਤੇ ਇਸ ਨੂੰ ਅੰਮ੍ਰਿਤਮਈ ਮੇਵਾ ਲਗਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The tree of life is fruitful, bearing the fruit of Ambrosial Nectar."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਗੁਰੋਂ ਰੂਪ ਸਫਲ ਬ੍ਰਿਛ ਤੇ ਗਿਆਨ ਅੰਮ੍ਰਿਤ ਫਲ ਕੋ ਪਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇਹੜੇ) ਗੁਰਮੁਖ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਫਲ ਪ੍ਰਾਪਤ ਕਰਦੇ ਹਨ। ਗੁਰੂ (ਮਾਨੋ ਅਜਿਹਾ) ਫਲ ਦੇਣ ਵਾਲਾ ਰੁੱਖ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "dando el Fruto del Néctar de Dios, y el ser,"