[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰਿ ਬਾਹਰਿ; ਅਵਰੁ ਨ ਕੋਇ ॥"
page = 411
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within and without there is none other than God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਦਰ ਤੇ ਬਾਹਰ ਰੱਬ ਦੇ ਬਗੈਰ ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Inwardly and outwardly, there is none other than Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅੰਤਰ ਔਰ ਬਾਹਰ ਬਿਨ ਪਰਮਾਤਮਾ ਸੇ ਦੂਸਰਾ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰ ਥਾਂ ਜੀਵਾਂ ਦੇ ਅੰਦਰ ਤੇ ਬਾਹਰ ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ ਵਿਚ ਪਰਮਾਤਮਾ ਤੋਂ ਬਿਨਾ ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, no hay nadie más que Él, dentro y fuera."