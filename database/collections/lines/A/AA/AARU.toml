data = "ਦੇਵ ਭੂਤ ਜਿਨਾਨ ਬੁਲਾਵੈ ॥੨॥"
page = 1004

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When in meditation, he would call devils, demons and ghosts.(2)"

[[content]]
