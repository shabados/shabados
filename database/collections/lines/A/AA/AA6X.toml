type = "primary"
data = "ਗੁਨਿ ਗਨ ਸੰਪੰਨ ਸੁੰਦਰ ਸੁਰੰਗ ॥"
page = 639

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sin had not even touched him and he was elegant in virtues"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਸਾਰਿਆਂ ਗੁਣਾਂ ਨਾਲ ਸੰਪੰਨ ਹੈ ਅਤੇ ਸੁੰਦਰ ਸ਼ਰੀਰ ਵਾਲਾ ਹੈ।"