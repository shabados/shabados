[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਮਧੇ ਕਿਨੈ ਪਛਾਣਿਆ; ਹਰਿ ਨਾਮਾ ਸਚੁ ਸੋਈ ॥"
page = 769
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hardly any one amongst millions, realises the True Name of that Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾਂ ਵਿਚੋਂ ਕੋਈ ਵਿਰਲਾ ਜਣਾ ਹੀ ਉਸ ਸੁਆਮੀ ਦੇ ਸੱਚੇ ਨਾਮ ਨੂੰ ਅਨੁਭਵ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Among millions, there is scarcely one who realizes the Name of the True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਤੇ ਹੇ ਭਾਈ ਪ੍ਯਾਰਯੋ! ਜੋ ਸਚਾ ਹਰੀ ਨਾਮੁ ਹੈ, ਸੋ ਕ੍ਰੋੜੋਂ ਮੇਂ ਸੇ ਕਿਸੇ ਨੇ ਹੀ ਪਛਾਨਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾਂ ਵਿਚੋਂ ਕਿਸੇ ਵਿਰਲੇ ਮਨੁੱਖ ਨੇ ਇਹ ਗੱਲ ਸਮਝੀ ਹੈ ਕਿ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹੀ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਟਿ ਮਧੇ = ਕ੍ਰੋੜਾਂ ਵਿਚ। ਕਿਨੈ = ਕਿਸੇ ਵਿਰਲੇ ਨੇ। ਸਚੁ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Entre millones, escasos son aquéllos que conocen la Esencia del Nombre Verdadero del Señor."