[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕੇ ਹਿਰਦੈ ਰਹਿਆ ਸਮਾਈ ॥੩॥"
page = 655
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "in his mind, He remains permeated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਮਨ ਅੰਦਰ ਉਹ ਰਮਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "his heart remains permeated with the Lord. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਹਿਰਦੇ ਮੇਂ ਵਹੁ ਹਰੀ ਨਿਸਚੇ ਕਰ ਸਮਾਇ ਰਿਹਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਹਿਰਦੇ ਵਿਚ ਉਹ ਸਦਾ ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en su corazón el Señor habita. (3)"