[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਹੀ ਹੋਤ; ਕਛੁ ਦੋਊ ਬਾਰਾ ॥"
page = 253
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nothing can be done a second time."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੂਜੀ ਵਾਰੀ ਕੁਝ ਭੀ ਨਹੀਂ ਹੋ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nothing can be done a second time."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੂਸਰੀ ਬਾਰ ਕੁਛ ਨਹੀਂ ਹੋਤਾ, ਭਾਵ ਸੇ ਤਿਸ ਕੇ ਕੀਏ ਪਰ ਕੁਛ, ਪੁਨਾ ਨ੍ਯੂਨ ਅਧਿਕਤਾ ਨਹੀਂ ਹੋ ਸਕਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਕੰਮ ਉਸ ਨੂੰ ਦੂਜੀ ਵਾਰੀ (ਠੀਕ ਕਰ ਕੇ) ਨਹੀਂ ਕਰਨਾ ਪੈਂਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él hace las cosas una sola vez y no otra más,"