[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਸਾਹਿਬੁ ਅਗਮੁ ਦਇਆਲੁ ਹੈ; ਸਭਿ ਤੁਧੁ ਧਿਆਹੀ ॥"
page = 301
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou my Lord art inaccessible and Merciful. Everyone thinks of thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰੇ ਸੁਆਮੀ ਪਹੁੰਚ ਤੋਂ ਪਰੇ ਅਤੇ ਮਿਹਰਬਾਨ ਹੈ। ਹਰ ਕੋਈ ਤੈਨੂੰ ਯਾਦ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord and Master, You are inaccessible and merciful. Everyone meditates on You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬੁ ਤੂੰ ਅਗੰਮ ਹੈਂ ਪੁਨਾ ਦਯਾਲੂ ਹੈਂ, ਯਾਂ ਤੇ ਤੇਰੇ ਕੋ ਸਭ ਕੋਈ ਧਿਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਦਇਆ ਕਰਨ ਵਾਲਾ ਮਾਲਕ ਹੈਂ (ਪਰ) ਤੇਰੇ ਤਾਈਂ ਪਹੁੰਚ ਨਹੀਂ ਹੋ ਸਕਦੀ; ਸਭ ਜੀਵ ਜੰਤ ਤੈਨੂੰ ਸਿਮਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਮੁ = ਅਪਹੁੰਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú, mi Maestro, eres Inaccesible y Misericordioso; todos meditan en Ti."