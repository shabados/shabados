[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭ੍ਰਮਤ ਫਿਰੇ; ਤਿਨ ਕਿਛੂ ਨ ਪਾਇਆ ॥"
page = 374
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Those who continue roaming about, they achieve nothing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਭਟਕਦੇ ਫਿਰਦੇ ਹਨ, ਉਨ੍ਹਾਂ ਨੂੰ ਕੁਝ ਭੀ ਪਰਾਪਤ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who continue to wander around, achieve nothing."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕਬੀ ਕਹੀਂ ਕਬੀ ਕਹੀਂ ਭ੍ਰਮਤੇ ਫਿਰਤੇ ਹੈਂ, ਭਾਵ ਅਨੇਕ ਮਤੋਂ ਮੇਂ ਪ੍ਰਵਰਤੇ ਹੈਂ ਤਿਨੋਂ ਨੇ ਕਿਸੀ ਸਾਸਤ੍ਰ ਕਾ ਸਿਧਾਂਤ ਕਛੁ ਭੀ ਨਹੀਂ ਪਾਇਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜੇਹੜੇ ਮਨੁੱਖ (ਮਾਇਆ ਦੀ ਖ਼ਾਤਰ ਹੀ ਸਦਾ) ਭਟਕਦੇ ਫਿਰਦੇ ਹਨ (ਆਤਮਕ ਜੀਵਨ ਦੀ ਦਾਤਿ ਵਿਚੋਂ) ਉਹਨਾਂ ਨੂੰ ਕੁਝ ਭੀ ਨਹੀਂ ਮਿਲਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਛੁ ਨ = (ਆਤਮਕ ਜੀਵਨ ਦਾ) ਕੁਝ ਭੀ ਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que deja que su mente vague, no logra nada,"