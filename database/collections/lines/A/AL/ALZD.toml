[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇਖ ਹੈਯਾਤੀ ਜਗਿ; ਨ ਕੋਈ ਥਿਰੁ ਰਹਿਆ ॥"
page = 488
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Sheikh, no one's life remains permanent in this world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸ਼ੇਖ ਕਿਸੇ ਇਨਸਾਨ ਦੀ ਜਿੰਦੜੀ ਭੀ ਇਸ ਜਹਾਨ ਅੰਦਰ ਮੁਸਤਕਿਲ ਨਹੀਂ ਰਹਿੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Shaykh, no one's life is permanent in this world."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੇਖ ਜੀ ਕਹਤੇ ਹੈਂ: ਕੋਈ ਭੀ (ਹੈਯਾਤੀ) ਅਮਰ ਹੋ ਕਰ ਸੰਸਾਰ ਮੇਂ ਥਿਰ ਨਹੀਂ ਰਹਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸ਼ੇਖ਼ ਫ਼ਰੀਦ! ਜਗਤ ਵਿਚ ਕੋਈ ਸਦਾ ਲਈ ਉਮਰ ਨਹੀਂ ਭੋਗ ਸਕਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਖ = ਹੇ ਸ਼ੇਖ਼ ਫ਼ਰੀਦ! ਹੈਯਾਤੀ = ਉਮਰ। ਜਗਿ = ਜਗਤ ਵਿਚ। ਥਿਰੁ = ਸਦਾ ਕਾਇਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Sheikh, nadie vive para siempre en el mundo,"