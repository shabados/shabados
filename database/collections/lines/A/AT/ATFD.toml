[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦਾ ਸਦਾ ਹਰਿ ਧਿਆਈਐ; ਗੁਰਮੁਖਿ ਸੁਖੁ ਪਾਵਹਿ ॥"
page = 950
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever, ever contemplating the Lord, the pious persons attain to peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਦੀਵ, ਸਦੀਵ ਹੀ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ ਪਵਿੱਤਰ ਪੁਰਸ਼ ਸੁਖ ਪਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating on the Lord forever and ever, the Gurmukh finds peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਹਰੀ! ਜੋ ਤੂੰ ਸਦਾ ਹੈ, ਨਿਤ੍ਯੰਪ੍ਰਤੀ ਗੁਰੋਂ ਦੁਆਰੇ ਤੁਝ ਕੋ ਧਿਆਈਏ ਔਰੁ ਜੋ ਧਿਆਵਤੇ ਹੈਂ, ਸੋ ਸੁਖ ਪਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਐਸੇ ਪ੍ਰਭੂ ਨੂੰ) ਸਦਾ ਸਿਮਰਨਾ ਚਾਹੀਦਾ ਹੈ। (ਜੋ) ਗੁਰੂ ਦੇ ਹੁਕਮ ਵਿਚ ਤੁਰ ਕੇ (ਸਿਮਰਦੇ ਹਨ ਉਹ) ਸੁਖ ਪਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor es Eterno e Inmóvil; los demás van y vienen."