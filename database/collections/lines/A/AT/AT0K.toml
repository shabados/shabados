[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਨੂੰ ਢੂੰਡਣ ਵਾਲਿਆਣ ਨੂੰ ਬਸ ਇਸੇ ਸੰਗਤ ਦੀ ਹੀ ਲੋੜ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਤਾਲਿਬਾਣ ਰਾ ਹਸਤ ਚਦੀਣ ਇਹਤਿਆਜ ॥੧੬॥੨॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Goyaa says, \"I am lost on your trail and am trying to look for you (the Guru) in every nook and corner,\nWhat would you lose if you were to direct this strayed and lost person towards the right path.\" (25) (7)"