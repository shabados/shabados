data = "ਜੋ ਤੁਮਰੀ ਬਾਛਾ ਕਰਤ; ਪ੍ਰਾਨ ਹਰੈ ਜਮ ਮੋਹਿ ॥"
page = 921

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘If the god of death takes out my life in your remembrance,"

