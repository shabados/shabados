[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁੰਦਰੁ ਚਤੁਰੁ; ਤਤ ਕਾ ਬੇਤਾ ॥"
page = 296
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "beautiful, shrewd and knower of reality;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੂਬਸੂਰਤ, ਪ੍ਰਬੀਨ ਤੇ ਅਸਲੀਅਤ ਦਾ ਜਾਣੂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "beauty, intelligence, and the realization of reality;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰੂਪ ਕਰ ਕੇ ਸੁੰਦਰ ਔ ਬਾਣੀ ਕਰ ਚਤਰ ਯਥਾਰਥ ਗਿਆਨ ਕੇ ਜਾਨਣੇ ਹਾਰਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੋਹਣਾ, ਸਿਆਣਾ, (ਜਗਤ ਦੇ) ਮੂਲ ਪ੍ਰਭੂ ਦਾ ਮਹਰਮ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਤ ਕਾ ਬੇਤਾ = ਪ੍ਰਭੂ ਦਾ ਮਹਰਮ, (ਜਗਤ ਦੇ) ਮੂਲ ਦਾ ਜਾਣਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Belleza, inteligencia y la Conciencia de la Realidad."