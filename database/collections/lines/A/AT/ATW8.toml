data = "ਨ ਹੈਬਤ ਕੁਨਦ ਦੁਸ਼ਮਨਾ ਬੇਸ਼ੁਮਾਰ ॥੪੮॥"
page = 1399

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Nor he gets scared while facing gigantic enemies.(48)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਬੇਸ਼ੁਮਾਰ ਵੈਰੀਆਂ ਨੂੰ ਵੇਖ ਕੇ ਡਰਦਾ ਨਹੀਂ ਹੈ ॥੪੮॥"