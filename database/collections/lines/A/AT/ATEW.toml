[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਾਨਵ ਦੁਸਟ ਨ ਬਾਚਾ ਏਕਾ ॥"
page = 117

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The comfort of the saints increased in many ways and not even one demon could survive."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਇਕ ਵੀ ਦੁਸ਼ਟ ਦਾਨਵ ਬਾਕੀ ਨਹੀਂ ਬਚਿਆ।"