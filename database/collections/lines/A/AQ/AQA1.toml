data = "ਸੂਤੁ ਪਾਇ; ਕਰੇ ਬੁਰਿਆਈ ॥"
page = 951
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Putting on the thread, he commits sins."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੰਝੂ ਪਾ ਕੇ ਉਹ ਪਾਪ ਕਮਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He puts on the thread, but does evil deeds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੂਤ ਕੋ ਪਾਇ ਕਰ ਬੁਰਿਆਈ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਮਨੁੱਖ ਜਨੇਊ ਤਾਂ ਪਾ ਲੈਂਦਾ ਹੈ, ਪਰ) ਜਨੇਊ ਪਾ ਕੇ ਭੀ ਮੰਦ-ਕਰਮ ਕਰੀ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero sigue haciendo maldades,"