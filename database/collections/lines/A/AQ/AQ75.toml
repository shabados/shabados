[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤਹੁ; ਹਰਿ ਹਰਿ ਨਾਮੁ ਧਿਆਈ ॥"
page = 620
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O saints, I ponder over the Lord's God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਧੂਓ! ਮੈਂ ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Saints, meditate on the Name of the Lord, Har, Har."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤੋਂ! ਹਮ ਤੋ ਹਰਿ ਹਰਿ ਨਾਮ ਕੋ ਧਿਆਵਣੇ ਵਾਲੇ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! (ਅਰਦਾਸ ਕਰੋ ਕਿ) ਮੈਂ ਸਦਾ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਦਾ ਰਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤਹੁ = ਹੇ ਸੰਤ ਜਨੋ! ਧਿਆਈ = ਧਿਆਈਂ, ਮੈਂ ਧਿਆਉਂਦਾ ਰਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Santos, contemplen siempre el Nombre del Señor"