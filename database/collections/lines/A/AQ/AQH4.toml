[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਲੈਤ; ਮਨੁ ਪਰਗਟੁ ਭਇਆ ॥"
page = 1142
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remembering the Name, man is renowned."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ ਬੰਦਾ ਪ੍ਰਸਿੱਧ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Repeating the Naam, the Name of the Lord, the mortal is exalted and glorified."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮੁ ਲੈਣੇ ਕਰ ਜੀਵ ਪ੍ਰਗਟ ਹੋ ਜਾਤਾ ਭ੍ਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪਦਿਆਂ (ਮਨੁੱਖ ਦਾ) ਮਨ (ਵਿਕਾਰਾਂ ਦੇ ਹਨੇਰੇ ਵਿਚੋਂ ਨਿਕਲ ਕੇ) ਰੌਸ਼ਨ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੈਤ = ਲੈਂਦਿਆਂ, ਜਪਦਿਆਂ। ਪਰਗਟੁ = ਰੌਸ਼ਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi mente ha despertado, recitando el Naam, el Nombre del Señor,"