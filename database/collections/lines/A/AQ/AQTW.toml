[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਇਹੁ ਧਾਵੈ; ਮਾਇਆ ਅਰਥੀ ॥"
page = 235
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When he runs about for the sake of riches,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਹ ਧਨ ਦੌਲਤ ਦੇ ਵਾਸਤੇ ਭੱਜ ਦੌੜ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When he runs around for the sake of Maya and riches,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਲਗ ਏਹ ਮਾਇਆ ਕੇ ਵਾਸਤੇ ਧਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਤਨਾ ਚਿਰ ਇਹ ਮਨੁੱਖ ਮਾਇਆ ਦਾ ਮੁਥਾਜ ਹੋ ਕੇ (ਹਰ ਪਾਸੇ) ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਾਵੈ = ਦੌੜਦਾ ਹੈ। ਅਰਥੀ = ਲੋੜਵੰਦ (ਹੋ ਕੇ), ਮੁਥਾਜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando corre tras la Maya,"