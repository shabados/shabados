[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਰੇ; ਸਾਚੀ ਖਸਮ ਰਜਾਇ ॥"
page = 62
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O My Soul! just is the will of the Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੈ ਮੇਰੀ ਜਿੰਦੇ! ਮਾਲਕ ਦਾ ਭਾਣਾ ਬਿਲਕੁਲ ਠੀਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mind, the Will of our Lord and Master is true."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! (ਖਸਮ) ਵਾਹਗੁਰੂ ਕੀ ਆਗਿਆ ਸਚੀ ਹੈ ਭਾਵ ਯਹਿ ਕਿ ਅਮੇਟ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਖਸਮ-ਪ੍ਰਭੂ ਦੀ ਰਜ਼ਾ ਵਿਚ ਤੁਰਨਾ ਸਹੀ ਕਾਰ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚੀ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੀ (ਕਾਰ), ਸਹੀ (ਕਾਰ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, sométete a la Voluntad del Maestro."