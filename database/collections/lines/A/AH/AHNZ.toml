[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਾਮ ਕਰੋਧ ਵਿਣਾਸੁ; ਸਿਫਤਿ ਸਮੇਉ ਹੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Conquering the lust and anger they have absorbed themselves in the praises (of God)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਾਮ, ਕ੍ਰੋਧ ਆਦਿ ਦਾ ਅਭਾਵ ਹੈ (ਤੇ ਵਾਹਿਗੁਰੂ ਦੀ) ਸਿਫਤ ਵਿਚ ਸਮਾਏ ਰਹਿੰਦੇ ਹਨ।"