[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਲ ਭੀਤਰਿ; ਕੁੰਭ ਸਮਾਨਿਆ ॥"
page = 657
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the Water is contained in the pitcher,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਪਾਣੀ ਘੜੇ ਅੰਦਰ ਸਮਾਇਆ ਹੋਇਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The water is contained within the pitcher;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਘੜੇ ਕਾ ਜਲ ਸਮੁੰਦ੍ਰ ਕੇ ਜਲ ਮੇਂ ਘਟ ਉਪਾਧੀ ਛੋਡ ਕਰ ਸਮਾਇ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਵੇਂ ਸਮੁੰਦਰ ਦੇ) ਪਾਣੀ ਵਿਚ ਘੜੇ ਦਾ ਪਾਣੀ ਮਿਲ ਜਾਂਦਾ ਹੈ (ਤੇ ਆਪਣੀ ਵੱਖਰੀ ਹਸਤੀ ਮਿਟਾ ਲੈਂਦਾ ਹੈ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੀਤਰਿ = ਅੰਦਰ, ਵਿਚ। ਕੁੰਭ = ਪਾਣੀ ਦਾ ਘੜਾ, ਜੀਵਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En los mares de Dios, el cántaro de mi mente está sumergido."