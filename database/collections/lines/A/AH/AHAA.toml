[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੀ ਮੇਰੀ ਕਰਿ ਮੁਏ; ਵਿਣੁ ਨਾਵੈ. ਦੁਖੁ ਭਾਲਿ ॥"
page = 936
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Puffed up with pride, many have perished. Without the Name, one comes to grief."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੰਕਾਰ ਨਾਲ ਆਫ਼ਰ ਕੇ ਘਣੇਰੇ ਮਰ ਮੁਕ ਗਏ ਹਨ। ਨਾਮ ਦੇ ਬਾਝੋਂ ਇਨਸਾਨ ਰੰਜ ਗਮ ਉਠਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Crying out, \"Mine, mine!\", they have died, but without the Name, they find only pain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਮੇਰੀ ਕਰ ਕੇ ਮੂਏ ਹੈਂ, ਬਿਨਾਂ ਨਾਮ ਸੇ ਤਿਨ ਕੋ ਦੁਖ (ਭਾਲਿ) ਪ੍ਰਾਪਤ ਹੋਵੈਂਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ 'ਨਾਮ' ਭੁਲਾ ਕੇ (ਨਿਰੀ) ਮਾਇਆ ਨੂੰ ਹੀ ਆਪਣੀ ਸਮਝ ਕੇ (ਇਸ ਤਰ੍ਹਾਂ ਸਗੋਂ) ਦੁੱਖ ਵਿਹਾਝ ਕੇ ਹੀ (ਬੇਅੰਤ ਜੀਵ) ਚਲੇ ਗਏ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਲਿ = ਢੂੰਢ ਕੇ, ਵਿਹਾਝ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los egocéntricos están destinados a morir, porque sin el Nombre, sólo viven en el dolor."