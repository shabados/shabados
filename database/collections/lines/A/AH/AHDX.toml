[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨ ਹਰਿ ਹਿਰਦੈ ਸੇਵਿਆ; ਤਿਨ ਹਰਿ ਆਪਿ ਮਿਲਾਏ ॥"
page = 303
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who heartily serve Lord, him the Lord unites with Himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਦਿਲੋਂ ਸੁਆਮੀ ਦੀ ਸੇਵਾ ਕਮਾਉਂਦਾ ਹੈ, ਉਸ ਨੂੰ ਸੁਆਮੀ ਆਪਣੇ ਨਾਲ ਮਿਲਾ ਲੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who serves the Lord with all his heart - the Lord Himself unites him with Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਹਿਰਦੇ ਮੇਂ ਹਰੀ ਸੇਵਨ ਕੀਆ ਹੈ ਹਰੀ ਤਿਨ ਕੋ ਆਪ ਮਿਲਾਇ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਜੀਵਾਂ ਨੇ ਹਿਰਦੇ ਵਿਚ ਪ੍ਰਭੂ ਦਾ ਸਿਮਰਨ ਕੀਤਾ, ਉਹਨਾਂ ਨੂੰ ਪ੍ਰਭੂ (ਆਪਣੇ ਵਿਚ) ਮਿਲਾ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si uno enaltece al Señor en su corazón, el Señor de Sí Mismo lo viene a encontrar,"