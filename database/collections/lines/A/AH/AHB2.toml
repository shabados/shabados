[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਅਰਾਧਨ; ਹੋਆ ਜੋਗੁ ॥"
page = 1340
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and becoming worthy of contemplating the Name, I feel contented."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੇ ਲਾਇਕ ਹੋ, ਮੈਂ ਸੰਤੁਸ਼ਟ ਹੋ ਗਿਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have become worthy of worshipping the Naam in adoration."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਨਾਮ ਕੇ ਅਰਾਧਨੇ ਯੋਗ ਹੂਆ ਹੈ, ਭਾਵ ਇਹ ਸੁਧ ਮਨ ਕਰ ਅਧਕਾਰੀ ਭਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਨ ਜੋਗਾ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋਗੁ = ਲਾਇਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y soy Digno de Alabar y Adorar el Naam."