[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇਤੇ ਜੀਅ; ਤੇਤੇ ਵਣਜਾਰੇ ॥"
page = 789
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As many as there are mortals, so many are traders."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿੰਨੇ ਭੀ ਪ੍ਰਾਣੀ ਹਨ, ਉਨੇ ਹੀ ਵਾਪਾਰੀ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There are just as many traders as there are living beings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚੌਦਾਂ ਲੋਕੋਂ ਮੇਂ ਜੇਤੇ ਜੀਵ ਹੈਂ ਤੇਤੇ ਕਰਮੋਂ ਕੇ ਕਰਨੇਹਾਰੇ ਵਨਜਾਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜੀਵ (ਇਸ ਸ਼ਹਰ ਦੇ) ਵਪਾਰੀ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal es el número de seres humanos que actúan como clientes;"