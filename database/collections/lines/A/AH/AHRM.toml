[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਤਨਾ ਸਾਰ. ਨ ਜਾਣਨੀ; ਅੰਧੇ ਵਤਹਿ ਲੋਇ ॥੨॥"
page = 954
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who know not the worth of the jewels of the Gurbani and the Name, wander like the blind men in the world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰਬਾਣੀ ਅਤੇ ਨਾਮ ਦੇ ਜਵਾਹਿਰਾਤ ਦੀ ਕਦਰ ਨੂੰ ਨਹੀਂ ਪਛਾਣਦੇ, ਉਹ ਮੁਨਾਖਿਆਂ (ਅੰਨ੍ਹਿਆਂ) ਮਨੁੱਖਾਂ ਦੀ ਮਾਨੰਦ ਸੰਸਾਰ ਅੰਦਰ ਭਟਕਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who do not appreciate the value of the jewels, wander like blind men in the world. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਰਤਨੋਂ ਕੀ ਸਾਰ ਨਹੀਂ ਜਾਨਤੇ ਸੋ ਲੋਕ (ਅੰਧੇ) ਅਗ੍ਯਾਨੀ (ਵਤਹਿ) ਫਿਰਤੇ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਜੋ ਇਹਨਾਂ ਰਤਨਾਂ ਦੀ ਕਦਰ ਨਹੀਂ ਜਾਣਦੇ ਉਹ ਅੰਨ੍ਹਿਆਂ ਵਾਂਗ ਜਗਤ ਵਿਚ ਫਿਰਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਤਹਿ = ਭਟਕਦੇ ਹਨ। ਲੋਇ = ਜਗਤ ਵਿਚ। ਕੇਰੀ = ਦੀ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues ellos no andan a tientas como los ciegos en el mundo."