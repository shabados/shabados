[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਨਨ ਮੈ ਨਿਰਖੇ ਨਹਿ ਨੇਤ੍ਰਨ; ਆਜੁ ਲਗੇ ਕਬਹੂੰ ਨ ਚਬਾਯੋ ॥"
page = 969

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘I have never seen them through my own eyes in this jungle before."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਨ ਵਿਚ ਅੱਖਾਂ ਨਾਲ ਵੇਖੇ ਨਹੀਂ ਅਤੇ ਅਜ ਤਕ ਕਦੇ ਖਾਏ ਨਹੀਂ।"