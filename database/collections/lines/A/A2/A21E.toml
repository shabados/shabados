[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਤਬ ਸਭਿ ਸਵਾਰੇ ॥"
page = 627
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All my affairs, the Master has resolved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸਾਰੇ ਕੰਮ ਮਾਲਕ ਨੇ ਸੁਆਰ ਦਿੱਤੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has resolved all of my affairs."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੇ ਸਭ ਕਰਮ ਹਰੀ ਨੇ ਸਵਾਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! (ਜਿਸ ਮਨੁੱਖ ਨੇ ਪ੍ਰਭੂ ਦਾ ਪੱਕਾ ਆਸਰਾ ਲਿਆ, ਪ੍ਰਭੂ ਨੇ ਉਸ ਦੇ) ਸਾਰੇ ਕੰਮ ਸਵਾਰ ਦਿੱਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor cumple con todas nuestras tareas,"