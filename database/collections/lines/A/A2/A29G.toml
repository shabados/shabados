[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬ੍ਰਿਖਭਾਨੁ ਸੁਤਾ ਕੀ ਬਰਾਬਰ ਮੂਰਤਿ ਸ︀ਯਾਮ ਕਹੈ ਸੁ ਨਹੀ ਘ੍ਰਿਤਚੀ ਹੈ ॥"
page = 357

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The heavenly damsel named Ghritachi is not so beautiful as Radha"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਵੀ) ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, ਰਾਧਾ ਦੀ ਸ਼ਕਲ ਦੇ ਬਰਾਬਰ ਘ੍ਰਿਤਚੀ (ਨਾਂ ਦੀ ਅਪੱਛਰਾ ਵੀ) ਨਹੀਂ ਹੈ।"