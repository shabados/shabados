[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਤ ਨਾਮ; ਭਏ ਨਿਹਕਾਮ ॥੨॥"
page = 1137
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meditating on the Name, I have become desireless."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦਾ ਚਿੰਤਨ ਕਰਨ ਦੁਆਰਾ ਮੈਂ ਖਾਹਿਸ਼ ਰਹਿਤ ਹੋ ਗਿਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating in remembrance on the Naam, I have become free of desire. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਮ ਕੋ ਜਪ ਕਰ ਕੇ (ਨਿਹਕਾਮ) ਵਾਸਨਾ ਸੇ ਰਹਿਤ ਭਏ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਸਿਮਰਦਿਆਂ (ਸਿਮਰਨ ਕਰਨ ਵਾਲੇ) ਦੁਨੀਆ ਵਾਲੀਆਂ ਵਾਸਨਾਂ ਤੋਂ ਰਹਿਤ ਹੋ ਜਾਂਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਹਕਾਮ = ਵਾਸਨਾ-ਰਹਿਤ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "contemplar el Nombre y permanecer sin deseos. (2)"