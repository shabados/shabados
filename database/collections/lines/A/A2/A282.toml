type = "primary"
data = "ਜੇ ਕੋ ਆਪੁਨਾ; ਦੂਖੁ ਮਿਟਾਵੈ ॥"
page = 266
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If one wishes to efface one's agonies,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਕੋਈ ਜਣਾ ਆਪਣੀਆਂ ਪੀੜਾ, ਮੇਸਣਾ ਚਾਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If you wish to erase your sorrows,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਕੋਈ ਅਪਨਾ ਜਨਮ ਮਰਨ ਆਦਿ ਦੁਖ ਮਿਟਾਵੈ ਤਉ ਇਉਂ ਮਿਟਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋਈ ਮਨੁੱਖ ਆਪਣਾ ਦੁੱਖ ਮਿਟਾਣਾ ਚਾਹੇ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el hombre anhela una vida libre de tristeza y de dolor,"