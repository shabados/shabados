[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਹ ਚਾਹੋ, ਤਹ ਕਹੋ ਪ੍ਰੀਬਨਹੁ ॥੧੧੮੯॥"
page = 796

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Diggajani”, speak the word “Ishhaaradani” at the end and recognize the names of Tupak for using them according to your inclination.1189."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਚਾਹੋ, ਪ੍ਰਬੀਨੋ! ਉਥੇ ਵਰਤੋ ॥੧੧੮੯॥"