[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਧਰਮ ਛੂਟਨ ਕੇ ਹੇਤ; ਅਧਿਕ ਮਨ ਮੈ ਡਰੋ ॥੨੯॥"
page = 827

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘By doing this, I am afraid, I will go astray of my righteous path.’ (29)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਆਪਣੇ) ਧਰਮ ਦੇ ਨਸ਼ਟ ਹੋਣ ਕਾਰਨ ਮਨ ਵਿਚ ਬਹੁਤ ਡਰਦਾ ਹਾਂ ॥੨੯॥"