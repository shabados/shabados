[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਛਬਿ ਕੋ ਨਿਰਖਾਇ; ਹਰਖ ਭਇਓ ਹਰਿਖਾਇ ਕੈ ॥੨੬॥"
page = 292

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Beating their drums, they came near Mathura and all the people were pleased to see their elegance.26."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਵੇਲੇ ਦੀ ਰੌਣਕ ਨੂੰ ਵੇਖ ਕੇ ਆਨੰਦ ਵੀ ਆਨੰਦਿਤ ਹੋ ਰਿਹਾ ਸੀ ॥੨੬॥"