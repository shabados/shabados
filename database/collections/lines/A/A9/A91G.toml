[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਇ ਆਪਿ ਡੁਬੇ ਪਰ ਨਿੰਦਕਾ; ਸਗਲੇ ਕੁਲ ਡੋਬੇਨਿ ॥"
page = 951
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Those great slanderers are them-selves drowned and they ruin all their families."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਵੱਡੇ ਨਿੰਦਕ ਖੁਦ ਡੁੱਬ ਜਾਂਦੇ ਹਨ ਅਤੇ ਆਪਣੇ ਸਾਰੇ ਖਾਨਦਾਨਾਂ ਨੂੰ ਭੀ ਤਬਾਹ ਕਰ ਛੱਡਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Slandering others, they drown themselves, and drown all their generations as well."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਪਰਨਿੰਦਕ ਆਪ ਡੂਬੇ ਹੈਂ ਔ ਸਾਰੇ ਕੁਲੋਂ ਕੋ ਭੀ ਡੋਬਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦੂਜਿਆਂ ਦੀ ਨਿੰਦਾ ਕਰਨ ਵਾਲੇ ਉਹ ਮਨੁੱਖ ਆਪ ਭੀ ਡੁੱਬਦੇ ਹਨ ਤੇ ਆਪਣੀਆਂ ਸਾਰੀਆਂ ਕੁਲਾਂ ਭੀ ਗ਼ਰਕ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਡਬੇਨਿ = ਅੱਖਰ 'ਡ' ਦੇ ਨਾਲ (ੁ) ਪੜ੍ਹਨਾ ਹੈ, ਉਂਞ ਅਸਲ ਲਫ਼ਜ਼ \"ਡੋਬੇਨਿ\" ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "esos calumniadores acaban ahogándose, y con ellos todo su linaje también."