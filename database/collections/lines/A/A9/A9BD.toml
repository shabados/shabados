[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਲ ਪੁਰਖੁ ਪਹਿ ਕਰਤ ਪੁਕਾਰਾ ॥੧॥"
page = 190

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the earth is distempered with the load of sins, then she manifested her anguish before the Destroyer Lord.1."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਦੋਂ) ਕਾਲ ਪੁਰਖ ਕੋਲ ਪੁਕਾਰ ਕਰਦੀ ਹੈ ॥੧॥"