[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਾਇਆ ਮੋਹਿ ਕਰੋੜ ਮਿਲਿ; ਹੁਇ ਬਹੁ ਗੁਣੁ ਸੋਹੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "And ego, full of pride for having killed lacs of demons, may touch a gursikh;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦੇ ਮੋਹ ਕਰੋੜਾਂ ਮਿਲਕੇ ਬਹੁਗੁਣੇ ਹੋਕੇ ਸੋਭ ਰਹੇ ਹਨ।"