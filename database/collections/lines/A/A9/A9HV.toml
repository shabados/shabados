[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਜੀਵੈ; ਦੇਖਿ ਬਡਾਈ ॥੪॥"
page = 277
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak lives by beholding His greatness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਉਸ ਦੀ ਮਹਾਨਤਾ ਨੂੰ ਵੇਖ ਕੇ ਜੀਊਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak lives by beholding His greatness. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹਮ ਤਿਸ ਕੀ ਵਡਿਆਈ ਕੌ ਦੇਖ ਕਰ ਜੀਵਤੇ ਹੈਂ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਆਪਣੀ (ਇਸ) ਬਜ਼ੁਰਗੀ ਨੂੰ ਆਪ ਵੇਖ ਕੇ ਖ਼ੁਸ਼ ਹੋ ਰਿਹਾ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਵੈ = ਜੀਊਂ ਰਿਹਾ ਹੈ, ਪ੍ਰਸੰਨ ਹੋ ਰਿਹਾ ਹੈ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh, dice Nanak, por ello dedico mis días a conocer la Gloria revelada en Su Gran Obra. (4)"