type = "primary"
data = "ਤਿਤਿਓ ਕਾਲ ਖਾਪਾ ਨ ਤੇ ਕਾਲ ਘਾਏ ॥"
page = 41

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But they could not destroy him!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਸਭ ਨੂੰ ਕਾਲ ਨੇ ਖਪਾ ਦਿੱਤਾ, ਪਰ ਕਾਲ ਨੂੰ ਨਾ ਖ਼ਤਮ ਕਰ ਸਕੇ।"