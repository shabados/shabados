[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਈ ਬਿਧਾਤਾ; ਖਿਨੁ ਖਿਨੁ ਜਪੀਐ ॥"
page = 1004
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "contemplate thou that creator every moment."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਉਸ ਸਿਰਜਣਹਾਰ ਨੂੰ ਹਰ ਮੁਹਤ ਯਾਦ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Each and every instant, meditate on that Creator Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਕਰਮ ਫਲ ਪਰਦਾਤਾ ਖਿਨ ਖਿਨ ਮੇਂ ਜਪੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸੇ ਸਿਰਜਣਹਾਰ ਨੂੰ ਹਰੇਕ ਖਿਨ ਜਪਣਾ ਚਾਹੀਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਧਾਤਾ = ਸਿਰਜਣਹਾਰ। ਜਪੀਐ = ਜਪਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Habita por siempre y para siempre en Él,"