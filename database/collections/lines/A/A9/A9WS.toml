[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਹੀ ਓਟ; ਸਾਧਾਇਆ ॥"
page = 746
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have grasped the saint's support."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸੰਤਾਂ ਦਾ ਆਸਰਾ ਪਕੜਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have grasped the Support of the Holy Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਧੋਂ ਕੀ ਰੇਨ ਪਕੜੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਜਦੋਂ ਤੋਂ) ਮੈਂ ਗੁਰੂ ਦਾ ਆਸਰਾ ਲਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਹੀ = ਫੜੀ। ਸਾਧਾਇਆ = ਗੁਰੂ (ਦੀ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He buscado ahora vivir en mi Señor"