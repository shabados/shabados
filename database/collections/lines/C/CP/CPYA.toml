[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੁ ਕਿਸ਼ਤੀ ਯਕੇ ਸ਼ੁਦ ਹਮਹ ਮੌਜ ਬੀਮ ॥੫੭॥"
page = 1419

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But through the waves both the vessels joined together.(57)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਰ ਭਿਆਨਕ ਲਹਿਰਾਂ ਨੇ ਉਨ੍ਹਾਂ ਕਿਸ਼ਤੀਆਂ ਨੂੰ ਇਕੱਠਿਆਂ ਕਰ ਦਿੱਤਾ ॥੫੭॥"