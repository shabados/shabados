[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਣਿ ਮਨ ਅੰਧੇ; ਮੂਰਖ ਗਵਾਰ ॥"
page = 1344
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hear thou, O my blind, foolish and ignorant soul."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਕੰਨ ਕਰ ਹੇ ਮੇਰੀ ਅੰਨ੍ਹੀ ਮੂੜ੍ਹ ਤੇ ਬੇਸਮਝ ਜਿੰਦੜੀਏ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen, O blind, foolish, idiotic mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਗ੍ਯਾਨ ਕਰ ਅੰਧੇ ਅਤੀ ਮੂਰਖ ਮਨ! ਤੂੰ ਸ੍ਰਵਨੁ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ) ਅੰਨ੍ਹੇ ਹੋਏ ਮਨ! ਹੇ ਮੂਰਖ ਮਨ! ਹੇ ਅਮੋੜ ਮਨ! ਸੁਣ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ ਗਵਾਰ = ਹੇ ਅਮੋੜ ਮਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escucha, oh mente ciega tonta e idiota,"