[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪੈੜਾ ਛਜਲੁ ਜਾਣੀਐ; ਕੰਦੂ ਸੰਘਰੁ ਮਿਲੈ ਹਸੰਦਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Paira is of Chhajal caste and Kandu belongs to Sanghar caste. They greet everybody with a warming smile."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੈੜਾ ਛੱਜਲ ਜਾਤ ਜਾਣੋਂ ਕੰਦੂ (ਮਸੰਦ) ਸੰਘਰ ਜਾਤ ਹੱਸ ਕੇ ਮਿਲਦਾ ਸੀ।"