[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦੀ; ਮਿਲੈ ਹਰਿ ਸੋਈ ॥"
page = 230
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's favour, He, the Lord is met."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਮਿਹਰ ਸਦਕਾ ਉਹ ਸੁਆਮੀ ਮਿਲ ਪੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, one meets the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਬੇਦ ਅਗੰਮ ਕਹਤੇ ਹੈਂ, ਸੋ ਹਰੀ ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਹੀ ਮਿਲਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਹੀ ਉਹ (ਘਟ ਘਟ ਦੀ ਜਾਣਨ ਵਾਲਾ) ਪਰਮਾਤਮਾ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਸਾਦੀ = ਪਰਸਾਦਿ, ਕਿਰਪਾ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por la Gracia del Guru uno toma Conciencia del Señor."