[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਰਾਇਣ ਨਰਹਰ; ਦਇਆਲ ॥"
page = 897
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The man-lion and the Merciful Lord is He."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਨੁਸ਼-ਸ਼ੇਰ ਸਰੂਪ ਅਤੇ ਮਿਹਰਬਾਨ ਪ੍ਰੂਭ ਹੈ ਉਹ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is powerful and merciful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਹਿੰਦੂ ਐਸੇ ਕਹਿਤੇ ਹੈਂ, ਨਰੋਂ ਮੇਂ ਤੇਰਾ ਘਰ ਹੈ ਔ ਨਰਸਿੰਘ ਰੂਪ ਹੋਇਕੇ ਪ੍ਰਹਿਲਾਦ ਕੀ ਰਖ੍ਯਾ ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਹ ਦਇਆ ਦਾ ਸੋਮਾ ਪਰਮਾਤਮਾ ਆਪ ਹੀ ਨਾਰਾਇਣ ਹੈ ਆਪ ਹੀ ਨਰਸਿੰਘ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਰਾਇਣ = ਜਲ ਵਿਚ ਨਿਵਾਸ ਰੱਖਣ ਵਾਲਾ, ਵਿਸ਼ਨੂ, ਪਰਮਾਤਮਾ। ਨਰਹਰ = ਨਰਸਿੰਘ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor es Poderoso y Misericordioso,"