[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਮਹਿ ਏਕੁ; ਨਿਰੰਜਨ ਕਰਤਾ ॥"
page = 998
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Amongst all is the one Pure Creator-Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸiਾਰਆਂ ਅੰਦਰ ਇੱਕ ਪਵਿੱਤਰ ਸਿਰਜਣਹਾਰ ਸੁਆਮੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One Pure Creator Lord is in all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਮੇਂ ਮਾਇਆ ਰਹਿਤ ਸੁਧ ਏਕ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਭ ਜੀਵਾਂ ਵਿਚ ਇਕੋ ਨਿਰਲੇਪ ਕਰਤਾਰ ਵੱਸ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰੰਜਨ = {ਨਿਰ-ਅੰਜਨ} ਨਿਰਲੇਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dentro de todo está el Uno Inmaculado, el Verdadero Señor,"