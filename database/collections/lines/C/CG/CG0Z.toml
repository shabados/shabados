[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪੂਰਣੁ, ਪਰਉਪਕਾਰੁ ਕਰੰਦਾ ॥੨॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Only perfect one undertakes altruism."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਅਤੇ) ਪੂਰਾ ਪਰੋਪਕਾਰ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ।"