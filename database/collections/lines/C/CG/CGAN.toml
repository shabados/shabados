[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨੈਨ ਸੰਤੋਖੇ; ਪ੍ਰਭ ਦਰਸਨੁ ਪਾਇਆ ॥"
page = 804
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "One whos eyes are satiated by seeing the Lord's vision,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀਆਂ ਅੱਖਾਂ ਸੁਆਮੀ ਦਾ ਦੀਦਾਰ ਵੇਖ ਕੇ ਤ੍ਰਿਪਤ ਹੋ ਗਈਆਂ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My eyes are content, gazing upon the Blessed Vision of God's Darshan."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਹੇ ਪ੍ਰਭੂ! ਆਪ ਕਾ ਦਰਸਨ ਪਾਇਆ ਹੈ ਤਿਸ ਕੇ ਨੇਤਰ ਸੰਤੋਖ ਕਉ ਪ੍ਰਾਪਤਿ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਦਰਸਨ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਜਿਸ ਦੀਆਂ ਅੱਖਾਂ (ਮਾਇਆ ਦੀ ਤ੍ਰਿਸ਼ਨਾ ਵਲੋਂ) ਰੱਜ ਗਈਆਂ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੈਨ = ਅੱਖਾਂ। ਸੰਤੋਖੇ = ਰੱਜ ਗਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mis ojos se calman sólo cuando tengo la Visión del Darshan"