[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਰਾਮੂ ਦੀਪਾ ਉਗ੍ਰਸੈਣੁ; ਨਾਗਉਰੀ ਗੁਰ ਸਬਦ ਵੀਚਾਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Ramu, Dipa, Ugarsain, Nagori would concentraye opon the world of the Guru."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਰਾਮੂ, ਦੀਪਾ ਉਗ੍ਰਸੈਨ, ਨਾਗਉਰੀ, ਗੁਰ ਸਬਦ ਦੇ ਵੀਚਾਰ ਕਰਨ ਵਾਲੇ।"