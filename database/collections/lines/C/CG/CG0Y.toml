[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਭਜਿ ਸ੍ਰਉਣਤੰ ਤਣੈ ਉਠੰਤ ਭੈ ਕਰੀ ਧੁਨੰ ॥"
page = 283

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors, on whatever side of the earth they were, began to fal, the blood flowed from the bodies of the fleeing warriors and there were terrible shouts"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋਧੀ ਸੂਰਮੇ ('ਚਪੀ') ਚਿੜ੍ਹ ਕੇ ਚੱਲਦੇ ਹਨ ਅਤੇ ਤਿੱਖੇ ਤੀਰਾਂ ਦੀ ਬਰਖਾ ਕਰਦੇ ਹਨ।"