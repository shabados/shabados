[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੋ ਕਰਤਾ; ਅਵਰੁ. ਨ ਕੋਇ ॥"
page = 1174
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is but one Creator-Lord. There is not another."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਇਕੋ ਹੀ ਸਿਰਜਣਹਾਰ ਸੁਆਮੀ ਹੈ। ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is only One Creator Lord; there is no other at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਹੀ ਸਰਬ ਕਾ ਕਰਤਾ ਪਰਮੇਸ੍ਵਰੁ ਹੈ ਔਰ ਦੂਸਰਾ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ (ਹਰ ਥਾਂ) ਇਕ ਕਰਤਾਰ ਹੀ ਦਿੱਸਦਾ ਹੈ, ਉਸ ਤੋਂ ਬਿਨਾ ਕੋਈ ਹੋਰ ਉਸ ਨੂੰ ਨਜ਼ਰੀਂ ਨਹੀਂ ਆਉਂਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Hay sólo un Señor Creador,"