[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਸਚੁ ਸੇਵਿਹੁ ਸਿਰਜਣਹਾਰਾ ॥"
page = 1053
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Serve thou Him, the True Creator-Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਉਸ ਸੱਚੇ ਰਚਣਹਾਰ ਸੁਆਮੀ ਦੀ ਸੇਵਾ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serve the True Creator Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੋ ਉਤਪਤੀ ਕਰਨੇਹਾਰਾ ਪਰਮਾਤਮਾ ਹੈ ਤਿਸ ਕੋ ਨਿਸਚੇ ਕਰ ਕੇ ਸੇਵਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਕਰਤਾਰ ਦਾ ਸਿਮਰਨ ਕਰਿਆ ਕਰੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੁ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਪਰਮਾਤਮਾ। ਸੇਵਿਹੁ = ਸਿਮਰਿਆ ਕਰੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sirve al Verdadero Señor Creador,"