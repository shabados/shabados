[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੁਰਾ ਭਲਾ; ਕੋਈ ਨ ਕਹੀਜੈ ॥"
page = 186
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Slander or praise not any one."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਦੀ ਭੀ ਨਿੰਦਿਆਂ ਜਾ ਉਸਤਤੀ ਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Do not say that anyone is good or bad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਬੁਰਾ ਭਲਾ ਕਿਸੀ ਕੋ ਨ ਕਹੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਨਾਹ ਕਿਸੇ ਦੀ ਨਿੰਦਾ ਕਰਨੀ ਚਾਹੀਦੀ ਹੈ ਨਾਹ ਕਿਸੇ ਦੀ ਖ਼ੁਸ਼ਾਮਦ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਕਹੀਜੈ = ਨਹੀਂ ਕਹਿਣਾ ਚਾਹੀਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No digas quién es bueno o malo,"