[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਜਨ ਕੈ; ਪਾਰਬ੍ਰਹਮ ਕਾ ਨਿਵਾਸੁ ॥੩॥"
page = 1152
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within that man abides the Transcendent Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਇਨਸਾਨ ਦੇ ਅੰਦਰ ਪਰਮ-ਪ੍ਰਭੂ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Within that person, the Supreme Lord God abides. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਜਨ ਕੇ ਹਿਰਦੇ ਮੇਂ ਪਾਰਬ੍ਰਹਮ ਕਾ ਨਿਵਾਸੁ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਨੁੱਖ ਦੇ ਅੰਦਰ ਪਰਮਾਤਮਾ ਦਾ ਨਿਵਾਸ ਹੋ ਜਾਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸੁ ਜਨ ਕੈ = ਉਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en él habita Su Señor, el Dios. (3)"