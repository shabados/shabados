[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੁ ਨਿਰੰਜਨੁ ਜਾ ਕੀ ਰਾਸਿ ॥"
page = 677
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The one pure Lord is his capital."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਪਾਵਨ ਸੁਆਮੀ ਹੀ ਉਸ ਦੀ ਪੂੰਜੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One Lord, the Immaculate Lord, is our capital."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਨਿਰੰਜਨ ਹੀ ਜਿਨੋਂ ਕੀ (ਰਾਸਿ) ਪੂੰਜੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਤੋਂ ਨਿਰਲੇਪ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਹੀ ਉਸ ਮਨੁੱਖ (ਦੇ ਆਤਮਕ ਜੀਵਨ) ਦਾ ਸਰਮਾਇਆ ਬਣ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੀ ਰਾਸਿ = ਜਿਸ ਮਨੁੱਖ ਦੀ ਪੂੰਜੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La mente de aquél que alaba al Dios Inmaculado"