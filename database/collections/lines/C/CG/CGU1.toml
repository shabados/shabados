[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬੀਰ ਫਿਰੈ ਅਤਿ ਘੂਮਤਿ ਹੀ; ਸੁ ਮਨੋ ਅਤਿ ਪੀ ਮਦਰਾ ਮਤਵਾਲੇ ॥"
page = 529

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the warriors appeared like the intoxicated persons roaring after drinking wine"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੂਰਮੇ ਬਹੁਤ ਘੁੰਮਦੇ ਫਿਰਦੇ ਸਨ, ਮਾਨੋ ਬਹੁਤੀ ਸ਼ਰਾਬ ਪੀ ਕੇ ਮਤਵਾਲੇ ਹੋ ਗਏ ਹੋਣ।"