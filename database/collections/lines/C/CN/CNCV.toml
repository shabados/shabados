[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧ ਕੀ ਮਹਿਮਾ; ਬਰਨੈ ਕਉਨੁ ਪ੍ਰਾਨੀ ॥"
page = 271
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Which mortal can narrate the saints praise?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿਹੜਾ ਜੀਵ ਸੰਤਾਂ ਦੀ ਕੀਰਤੀ ਨੂੰ ਬਿਆਨ ਕਰ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What mortal can speak of the Glorious Praises of the Holy?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੀ ਮਹਿਮਾ ਕੌ ਕੌਨ ਪ੍ਰਾਣੀ ਬਰਨਨ ਕਰੈ ਅਰਥਾਤ ਕੋਈ ਨਹੀਂ ਕਰ ਸਕਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਦੀ ਵਡਿਆਈ ਕਿਹੜਾ ਮਨੁੱਖ ਬਿਆਨ ਕਰ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਹਿਮਾ = ਵਡਿਆਈ। ਬਰਨੈ = ਬਿਆਨ ਕਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Qué puede decirse de las virtudes de un hombre de Fe?"