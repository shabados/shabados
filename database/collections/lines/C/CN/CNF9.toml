type = "primary"
data = "ਇਤ ਤੇ ਬੀਰ ਭੂਮਿ ਮੈ ਲਰੈ ॥੨੩੯੯॥"
page = 540

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On that side the heavenly damsel like Rambha began to dance and on this side, these warriors were fighting on the earth.2399."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਇਧਰ ਯੋਧੇ ਧਰਤੀ ਉਤੇ ਲੜ ਰਹੇ ਹਨ ॥੨੩੯੯॥"