[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਹਉ ਤਿਸੁ ਬਲਿ ਜਾਉ ॥੪॥੨੮॥੯੭॥"
page = 185
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, I am a sacrifice unto him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਮੈਂ ਉਸ ਉਤੋਂ ਘੋਲੀ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, I am a sacrifice to Him. ||4||28||97||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੈਂ ਤਿਸ ਕੇ ਬਲਿਹਾਰ ਜਾਤਾ ਹੂੰ॥੪॥੨੮॥੯੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਕਾਲ ਪੁਰਖ ਇੱਕ ਹੈ ਅਤੇ ਸਤਿਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਲਿ = ਸਦਕੇ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, soy un sacrificio para El. (4-28-97)"