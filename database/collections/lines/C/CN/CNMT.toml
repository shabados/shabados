[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਦ ਵਿਚਿ ਰਿਧਾ ਪਾਇ ਕੈ; ਕੁਤੇ ਦਾ ਮਾਸੁ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The meat of dog cooked in the wine was, along with its foul smell, kept in the human skull."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਇਕ ਚੁਹੜੀ ਨੇ) ਕੁੱਤੇ ਦਾ ਮਾਸ ਸ਼ਰਾਬ ਵਿਚ ਪਾਕੇ ਰਿੱਧਾ।"