[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਉਲਾ; ਖੇਲ ਕਰੇ ਸਭਿ ਆਪੇ ॥"
page = 1020
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of Himself, the Lord stages the whole play."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖ਼ੁਦ ਹੀ ਪ੍ਰਭੂ ਸਾਰਾ ਖੇਡ ਰਚਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord Himself stages all this drama."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸਰੁ ਨੇ ਸਭ ਆਪ ਹੀ ਖੇਲ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ, ਜੀਵਾਂ ਦੇ ਕੀਹ ਵੱਸ?) ਪਰਮਾਤਮਾ ਆਪ ਹੀ ਸਾਰੇ ਖੇਲ ਕਰ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਉਲਾ = ਖ਼ੁਦਾ, ਰੱਬ। ਸਭਿ = ਸਾਰੇ। ਖੇਲ = {ਬਹੁ-ਵਚਨ। ਲਫ਼ਜ਼ 'ਖੇਲੁ' ਇਕ-ਵਚਨ}। ਆਪੇ = ਆਪ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor por Sí Mismo, pone las reglas de Su Propio Teatro"