[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਮਨਿ; ਨਾਹੀ ਸਚਾ ਸੋਇ ॥"
page = 142
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What can be achieved by eating and what by dressing so long as that True Lord abides not in the man's mind?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਤਾਈਂ ਉਹ ਸੱਚਾ ਸੁਆਮੀ ਮਨੁੱਖ ਦੇ ਚਿੱਤ ਵਿੱਚ ਨਹੀਂ ਵਸਦਾ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "if the True Lord does not abide within the mind?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਾ ਮਨ ਕੇ ਬੀਚ ਸੋ ਸਚਾ ਵਾਹਗੁਰੂ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਉਹ ਸੱਚਾ ਪ੍ਰਭੂ ਹਿਰਦੇ ਵਿਚ ਨਹੀਂ ਵੱਸਦਾ, (ਜਿਸ ਪ੍ਰਭੂ ਨੇ ਸਾਰੇ ਸੋਹਣੇ ਪਦਾਰਥ ਦਿੱਤੇ ਹਨ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si el ser humano no ama al Verdadero Nombre del Señor?"