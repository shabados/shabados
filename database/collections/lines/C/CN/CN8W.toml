[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਥਰ ਕਾਂਵ ਰੋਗੀ ਘਣੇ; ਗਦਹੁ ਕਾਲੇ ਕੰਬਲ ਭਾਲੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Stones, crows, patients, donkeys, black blankets;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੱਥਰ, ਕਾਂ, ਬਹੁਤੇ ਰੋਗੀ, ਖੋਤੇ, ਕਾਲੇ ਭੂਰੇ, ਤੇ ਰਿੱਛ;"