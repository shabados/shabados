[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ; ਮੀਨ ਜਲ ਸਿਉ ਹੇਤੁ ॥"
page = 838
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the fish loves the water."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਮੱਛੀ ਦੀ ਪਾਣੀ ਨਾਲ ਮੁਹੱਬਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "as the fish loves the water,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾਂ ਜੈਸੇ ਮਛੀ ਕਾ ਜਲ ਕੇ ਸਾਥ ਪ੍ਰੇਮ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਮਛਲੀ ਦਾ ਪਾਣੀ ਨਾਲ ਪਿਆਰ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੀਨ = ਮੱਛੀ। ਸਿਉ = ਨਾਲ। ਹੇਤੁ = ਪਿਆਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así como el pez ama el agua,"