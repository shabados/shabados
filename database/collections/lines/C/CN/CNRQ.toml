[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਖੁ ਅੰਧੇਰਾ; ਸਗਲਾ ਜਾਇ ॥੧॥"
page = 867
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and all thy distress shall be dispelled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਤੇਰੀ ਸਾਰੀ ਤਕਲੀਫ ਅਤੇ ਅਨ੍ਹੇਰਾ ਦੂਰ ਹੋ ਜਾਣਗੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and all your pain and darkness will be dispelled. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਜਨਮ ਮਰਨ ਰੂਪ ਦੁਖ ਤਥਾ ਅਗਿਆਨ ਰੂਪ ਅੰਧੇਰਾ ਸਭ ਮਿਟ ਜਾਵੇਗਾ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰੇਕ ਦੁੱਖ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ, (ਮਾਇਆ ਦੇ ਮੋਹ ਦਾ) ਸਾਰਾ ਹਨੇਰਾ ਮੁੱਕ ਜਾਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲਾ = ਸਾਰਾ। ਜਾਇ = ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y el dolor y la oscuridad serán disipados (1)"