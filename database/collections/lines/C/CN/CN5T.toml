[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਗ ਜਿਉ; ਲਾਇ ਬਹੈ ਨਿਤ ਧਿਆਨਾ ॥"
page = 230
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Like the heron the, ever, sits in trance."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਗਲੇ ਦੀ ਤਰ੍ਹਾਂ ਉਹ ਸਦੀਵ ਹੀ ਸਮਾਧੀ ਲਾ ਕੇ ਬੈਠਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They sit there, like storks, pretending to meditate."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਬਗਲੇ ਸਮਾਨ ਨਿਤ ਧਿਆਨ ਲਗਾਇ ਬੈਠਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦਾ ਬਗਲੇ ਵਾਂਗ ਹੀ ਸਮਾਧੀ ਲਾ ਕੇ ਬੈਠਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਗ = ਬਗਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "como la garza enfoca su atención en la cacería,"