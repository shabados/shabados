[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੁ ਅਚੰਭਉ; ਸੁਨਹੁ ਤੁਮੑ ਭਾਈ ॥"
page = 481
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hear one wonderful thing, O my brethren."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਹੈਰਾਨੀ ਦੀ ਗੱਲ ਸੁਣੋ, ਤੁਸੀਂ ਹੇ ਭਰਾਓ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen to this wonderful thing, O Siblings of Destiny!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਏਕ ਅਸਚਰਜ ਕੀ ਬਾਤ ਸੁਨੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੁਣੋ ਇਕ ਅਚਰਜ ਖੇਡ (ਜੋ ਜਗਤ ਵਿਚ ਵਰਤ ਰਹੀ ਹੈ।)"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escuchen sus maravillas, Oh Hijos del destino!"