[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਹ ਤੀਰਥ ਵਰਤ ਤਪ ਸਾਰੇ ॥"
page = 879
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "in that are contained all the pilgrim stations, fasting and austerities."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਅੰਦਰਹੀ ਸਮੂਹ ਯਾਤਰਾ ਅਸਥਾਨ, ਵਰਤ ਅਤੇ ਕਰੜੀਆਂ ਘਾਲਾਂ ਆ ਜਾਂਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is my sacred shrine of pilgrimage, fasting and austere self-discipline."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਬਾਣੀ ਮੇਂ ਤੀਰਥ ਔ ਵਰਤ ਪੁਨਹ ਤਪ ਭੀ ਸਾਰੇ ਪ੍ਰਾਪਤਿ ਹੈਂ। ਭਾਵ ਜਿਨੋਂ ਪੁਰਸ਼ੋਂ ਨੇ ਗੁਰੂ ਬਾਣੀ ਬੀਚਾਰੀ ਹੈ ਤਿਨੋਂ ਨੇ ਸਭ ਸਾਧਨ ਕਰ ਲੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਆਤਮਕ ਅਵਸਥਾ ਵਿਚ ਉਹ ਪਹੁੰਚਦਾ ਹੈ) ਉਥੇ ਸਾਰੇ ਤੀਰਥ-ਇਸ਼ਨਾਨ ਸਾਰੇ ਵਰਤ ਤੇ ਤਪ ਭੀ ਉਸ ਨੂੰ ਮਿਲਿਆਂ ਬਰਾਬਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਹ = ਉਥੇ, ਉਸ ਆਤਮਕ ਅਵਸਥਾ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Ella está contenido el mérito de las austeridades, los ayunos y los peregrinajes;"