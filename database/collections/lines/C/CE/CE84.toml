[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਜੈ ਭਾਇ ਲਗੇ; ਦੁਖੁ ਪਾਇਆ ॥"
page = 362
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Attached to something else (duality) one incurs pain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੋਰਸ (ਦੂਜੇ)ੇ ਦੇ ਪਿਆਰ ਨਾਲ ਜੁੜ ਕੇ ਆਦਮੀ ਤਕਲੀਫ ਉਠਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Attached to the love of duality, one only incurs pain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨਮੁਖ (ਦੂਜੈ) ਦੂਸਰੇ ਦੇਵਤਿਓਂ ਕੇ ਪ੍ਰੇਮ ਮੇਂ ਲਗੇ ਹੈਂ ਤਿਨੋਂ ਨੇ ਦੁਖ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇਹੜੇ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਨੂੰ ਛੱਡ ਕੇ) ਕਿਸੇ ਹੋਰ ਦੇ ਪਿਆਰ ਵਿਚ ਮੱਤੇ ਰਹਿੰਦੇ ਹਨ ਉਹਨਾਂ ਨੇ ਦੁੱਖ ਹੀ ਦੁੱਖ ਸਹੇੜਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਇ = ਪਿਆਰ ਵਿਚ। ਭਾਉ = ਪਿਆਰ। ਦੂਜੈ ਭਾਇ = ਹੋਰ ਦੇ ਪਿਆਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que está apegado a la dualidad, incurre en el sufrimiento,"