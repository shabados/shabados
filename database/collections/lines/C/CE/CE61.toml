[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੀਤ ਸਾਜਨ; ਭਰਵਾਸਾ ਤੇਰਾ ॥"
page = 1349
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Friend and Intimate, Thou alone are my mainstay."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਿੱਤਰ ਅਤੇ ਯਾਰ! ਕੇਵਲ ਤੂੰ ਹੀ ਮੇਰਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my Friend and Companion, You are my Trusted Support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਿਤ੍ਰ ਰੂਪ ਵਾਹਿਗੁਰੂ! ਸਰਬ ਕੇ ਸਜਨ ਜੋ ਸੰਤ ਹੈਂ ਤਿਨੋਂ ਕੋ ਭੀ ਤੇਰਾ ਹੀ ਭਰੇਸਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਹੀ ਮੇਰਾ ਮਿੱਤਰ ਹੈਂ, ਮੇਰਾ ਸੱਜਣ ਹੈਂ, ਮੈਨੂੰ ਤੇਰਾ ਹੀ ਸਹਾਰਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh mi Amigo y Compañero, eres el Único Soporte en el que confío."