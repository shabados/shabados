[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੁ ਭਗਤੁ; ਮੇਰੇ ਹਿਰਦੇ ਬਸੈ ॥"
page = 1163
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saint alone abides within my mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਸਾਧੂ ਹੀ ਮੇਰੇ ਚਿੱਤ ਅੰਦਰ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord looked upon Naam Dayv and smiled."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਬਿਸਨ ਜੀ ਲਛਮੀ ਕੋ ਕਹਤੇ ਹੈਂ: ਏਕ ਭਗਤ ਮੇਰੇ ਮਨੁ ਬੀਚ ਬਸਤਾ ਹੈ, ਮੈਂ ਵਹਾਂ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਅਨੰਨ ਭਗਤ ਸਦਾ ਮੇਰੇ ਹਿਰਦੇ ਵਿਚ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਕੁ ਭਗਤੁ = ਅਨੰਨ ਭਗਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios, viendo mi inocencia dijo,"