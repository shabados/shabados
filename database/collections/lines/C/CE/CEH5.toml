[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਸੇਵਹਿ; ਸੇ ਮਹਾਪੁਰਖ ਸੰਸਾਰੇ ॥"
page = 161
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who serve the True Guru, are the great persons in this world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਖਿਦਮਤ ਕਰਦੇ ਹਨ ਉਹ ਇਸ ਜਹਾਨ ਵਿੱਚ ਵਡੇ ਪੁਰਸ਼ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who serve the True Guru are the greatest people of the world."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਤਿਗੁਰੋਂ ਕੋ ਸੇਵਤੇ ਹੈਂ, ਸੋ ਸੰਸਾਰ ਮੇਂ ਮਹਾਨ ਪੁਰਖ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੇ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਂਦੇ ਹਨ, ਉਹ ਸੰਸਾਰ ਵਿਚ ਮਹਾ ਪੁਰਖ ਮੰਨੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਸਾਰੇ = ਸੰਸਾਰਿ, ਸੰਸਾਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los que sirven al Guru son los grandiosos del mundo,"