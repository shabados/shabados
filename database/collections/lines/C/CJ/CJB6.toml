[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪੁ ਤਪੁ ਸੰਜਮੁ. ਨਾਲਿ ਤੁਧੁ; ਹੋਰੁ ਮੁਚੁ ਗਰੂਰੁ ॥"
page = 967
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meditation, hard service and self-discipline abide with thee, O my Guru and excessive pride abides with others."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿਮਰਨ, ਕਰੜੀ ਘਾਲ ਅਤੇ ਸਵੈ-ਜ਼ਬਤ ਤੇਰੇ ਨਾਲ ਵਸਦੇ ਹਨ, ਹੇ ਮੇਰੇ ਗੁਰਦੇਵ! ਅਤੇ ਘਣੇਰਾ ਘੁਮੰਡ ਵਸਦਾ ਹੈ ਹੋਰਨਾਂ ਦੇ ਨਾਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditation, austerities and self-discipline rest with You, while the others are filled with excessive pride."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਰੂ ਅੰਗਦ ਸਾਹਿਬ ਜੀ! ਸਰਬ ਸਮੇਂ ਮੇਂ ਤੁਮਾਰੇ ਸਾਥ ਜਪ ਤਪ ਅਰ ਇੰਦ੍ਰਿਓਂ ਕੀ ਜੀਤਤਾ ਅਰ ਗੌਰਵਤਾ ਆਦੀ ਔਰ (ਮੁਚੁ) ਬਹੁਤ ਗੁਣ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਸਤਿਗੁਰੂ!) ਹੋਰ ਜਗਤ ਤਾਂ ਬਹੁਤ ਅਹੰਕਾਰ ਕਰਦਾ ਹੈ, ਪਰ ਤੇਰੇ ਪਾਸ ਜਪ ਤਪ ਸੰਜਮ (ਆਦਿਕ ਦੀ ਬਰਕਤਿ ਹੋਣ ਕਰ ਕੇ ਤੂੰ ਪਹਿਲੇ ਵਾਂਗ ਗਰੀਬੀ ਸੁਭਾਵ ਵਿਚ ਹੀ) ਰਿਹਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੋਰੁ = ਹੋਰ ਸੰਸਾਰ। ਮੁਚੁ = ਬਹੁਤ। ਗਰੂਰੁ = ਗ਼ਰੂਰੁ, ਅਹੰਕਾਰ। ਫੇਰਿ = ਇਸ ਤੋਂ ਪਿਛੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "consigo trajo la Meditación, la Austeridad, la Disciplina al mundo del ego."