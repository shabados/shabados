[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੂੰਦ ਪਵੈ ਬਿਨਸੈ; ਢਹਤ. ਨ ਲਾਗੈ ਬਾਰਾ ॥"
page = 1048
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the drop of water falls, it crumbles and is wasted away without delay."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਪਾਣੀ ਦਾ ਤੁਪਕਾ ਡਿੱਗ ਪੈਂਦਾ ਹੈ, ਇਹ ਗਲ ਜਾਂਦਾ ਹੈ ਅਤੇ ਬਿਨਾ ਕਿਸੇ ਦੇਰੀ ਦੇ ਨਾਸ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the drop of water falls upon it, it crumbles and dissolves instantaneously."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਕਾਗਦ ਜਲ ਕੀ ਬੂੰਦ ਪੜੇ ਸੇ ਬਿਨਸ ਜਾਤਾ ਹੈ, ਤੈਸੇ ਗਿਰਤਿਆਂ ਕੋਈ ਦੇਰੀ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਵੇਂ ਕਾਗ਼ਜ਼ ਉਤੇ ਪਾਣੀ ਦੀ ਇਕ) ਬੂੰਦ ਪੈ ਜਾਏ ਤਾਂ (ਕਾਗ਼ਜ਼) ਗਲ ਜਾਂਦਾ ਹੈ (ਇਸੇ ਤਰ੍ਹਾਂ ਇਸ ਸਰੀਰ ਦਾ) ਨਾਸ ਹੁੰਦਿਆਂ ਭੀ ਚਿਰ ਨਹੀਂ ਲੱਗਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਰਾ = ਚਿਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y si una gota de agua cae sobre él, mira, se destruye sin tardanza."