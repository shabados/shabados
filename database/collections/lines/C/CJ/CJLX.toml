[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸਾ ਸੰਮ੍ਰਥੁ; ਹਰਿ ਜੀਉ ਆਪਿ ॥"
page = 900
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "So powerful is our venerable Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਹੋ ਜਿਹਾ ਬਲਵਾਨ ਹੈ ਆਪਣਾ ਪੂਜਯ ਪ੍ਰਭੂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such is our all-powerful dear Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਜੀਉ ਜੋ ਆਪ ਹੈ, ਸੋ ਐਸਾ ਸਾਮਰਥ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਪਰਮਾਤਮਾ ਆਪ ਬੜੀਆਂ ਤਾਕਤਾਂ ਦਾ ਮਾਲਕ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਮ੍ਰਥੁ = ਸਮਰਥਾ ਵਾਲਾ, ਸਭ ਤਾਕਤਾਂ ਦਾ ਮਾਲਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal es nuestro Señor, el Dios, Todopoderoso,"