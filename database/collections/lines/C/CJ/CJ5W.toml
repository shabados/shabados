[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਸਟ ਧਾਤੁ ਇਕ ਧਾਤੁ ਹੋਇ; ਸੰਗਿ ਪਾਰਸਿ ਢੋਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Being in touch with the philosophers’s stone and the alloy of light metals transforms into one metal (gold)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਾਰਸ ਦੇ ਨਾਲ ਮਿਲਕੇ ਅੱਠਾਂ ਧਾਤਾਂ ਦੀ ਇਕ ਧਾਤ (ਸੋਨਾ) ਹੋ ਜਾਂਦੀ ਹੈ।"