[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਏਕੁ ਛੋਡਿ ਦੂਜੈ ਲਗੈ; ਸਾ ਜਿਹਵਾ ਜਲਿ ਜਾਉ ॥੨॥"
page = 516
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, burnt be the tongue, which forsaking the one Lord, is attached to another."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਸੜ ਵੰਞੇ ਉਹ ਜੀਭ ਜਿਹੜੀ ਇਕ ਸੁਆਮੀ ਨੂੰ ਤਿਆਗ ਕੇ ਹੋਰਸ ਨਾਲ ਜੁੜਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, let that tongue be burnt, which renounces the One Lord, and attaches itself to another. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਜੋ ਏਕ ਸ੍ਵਾਮੀ ਕੌ ਛੋਡ ਕਰ ਦੂਸਰੇ ਮੇਂ ਲਗੀ ਹੈ, ਸੋ ਜਿਹਬਾ (ਜਲ ਜਾਉ) ਭਸਮ ਹੋ ਜਾਇ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ, ਹੇ ਨਾਨਕ! ਉਹ ਜੀਭ ਸੜ ਜਾਏ ਜੋ ਇਕ ਪ੍ਰਭੂ ਨੂੰ ਛੱਡ ਕੇ ਕਿਸੇ ਹੋਰ (ਦੀ ਯਾਦ) ਵਿਚ ਲੱਗੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "dice Nanak, destruida sea la boca que abandonando al Señor, pronuncia el nombre de otro. (2)"