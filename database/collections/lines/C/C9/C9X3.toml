[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਰਤਨੁ; ਹਰਿ ਅਗਹ ਅਤੋਲੇ ॥"
page = 1339
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unfathomable and Unweighable is the jewel of the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਥਾਹ ਅਤੇ ਅਜੋਖ ਹੈ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਜਵੇਹਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Jewel of the Naam, the Name of the Lord, is unfathomable and immeasurable."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਜੋ ਹਰੀ ਕਾ ਨਾਮ ਰੂਪੀ ਰਤਨ ਅਗਰ ਅਤੋਲ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਜਿਨ੍ਹਾਂ ਨੇ) ਅਪਹੁੰਚ ਅਤੇ ਅਤੋਲ ਹਰੀ ਦਾ ਕੀਮਤੀ ਨਾਮ ਹਾਸਲ ਕਰ ਲਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਹ = ਅਪਹੁੰਚ। ਅਗਹ ਨਾਮੁ = ਅਪਹੁੰਚ ਹਰੀ ਦਾ ਨਾਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la Joya del Naam es Insondable e Invaluable. Por siempre"