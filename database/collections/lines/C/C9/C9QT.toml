[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਸਿਉ ਜੁਰੈ; ਨ ਵਿਆਪੈ ਕਾੜੑਾ ॥"
page = 238
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who unites with God, is not engrossed in anxiety."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਰੱਬ ਨਾਲ ਜੁੜ ਜਾਂਦਾ ਹੈ, ਉਹ ਚਿੰਤਾ ਵਿੱਚ ਗ਼ਲਤਾਨ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When someone attaches himself to the Lord, he is not afflicted by worries."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜੇ ਹਰੀ ਕੇ ਸਾਥ ਜੁੜੇ ਤਾਂ (ਕਾੜਾ) ਝੋਰਾ ਨਹੀਂ ਵਿਆਪਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਨਾਲ ਜੁੜਦਾ ਹੈ, ਤਾਂ ਕੋਈ ਚਿੰਤਾ-ਫ਼ਿਕਰ ਉਸ ਉਤੇ ਆਪਣਾ ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾੜ੍ਹ੍ਹਾ = ਚਿੰਤਾ-ਫ਼ਿਕਰ, ਝੋਰਾ। ਵਿਆਪੈ = ਜ਼ੋਰ ਪਾ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que está unido con el Señor,"