[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਸੁਪ੍ਰਸੰਨ ਭਏ ਗੋਪਾਲ ॥"
page = 1349
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Master is pleased with me,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਪ੍ਰਮੇਸ਼ਰ ਮੇਰੇ ਤੇ ਖੁਸ਼ ਹੋ ਗਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God, the Lord of the World, is pleased and satisfied with me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਪਾਲ! ਜਬ ਤੁਮ ਹਮਾਰੇ ਪਰ ਸੁਪ੍ਰਸੰਨ ਹੋਤੇ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਥੇ ਸਾਧ ਸੰਗਤ ਵਿਚ ਜਿਹੜੇ ਮਨੁੱਖ ਟਿਕਦੇ ਹਨ, ਉਹਨਾਂ ਉੱਤੇ) ਜਗਤ-ਰੱਖਿਅਕ ਪ੍ਰਭੂ ਜੀ ਬਹੁਤ ਤ੍ਰੁੱਠਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੋਪਾਲ = ਸ੍ਰਿਸ਼ਟੀ ਦਾ ਪਾਲਣ ਵਾਲਾ ਪ੍ਰਭੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Señor del Mundo está Satisfecho conmigo,"