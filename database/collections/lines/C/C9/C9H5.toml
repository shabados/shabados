data = "ਠਾਕੁਰਿ ਅਪੁਨੈ; ਕੀਨੀ ਦਾਤਿ ॥"
page = 389
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My master has given me a gift,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਾਲਕ ਨੇ ਮੈਨੂੰ ਇਕ ਬਖਸ਼ੀਸ਼ ਦਿੱਤੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My Master has given me a gift;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਅਪੁਨੈ) ਮੇਰੇ ਠਾਕੁਰ ਨੇ ਨਾਮ ਕੀ ਦਾਤ ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਠਾਕੁਰ-ਪ੍ਰਭੂ ਨੇ ਜਿਸ ਨੂੰ ਆਪਣੇ ਸੇਵਕ ਨਾਮ ਦੀ ਦਾਤਿ ਬਖ਼ਸ਼ੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਕੁਰਿ = ਠਾਕੁਰ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Maestro es Compasivo ahora conmigo,"