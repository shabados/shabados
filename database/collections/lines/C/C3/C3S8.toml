[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਾਰਿ ਅਨੁਗ੍ਰਹੁ; ਸੁਆਮੀ ਮੇਰੇ ॥"
page = 1086
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Show Thou mercy unto me, O my Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰੇ ਉਤੇ ਮਿਹਰ ਕਰ, ਹੇ ਮੈਂਡੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please shower me with Your Merciful Grace, O my Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਪ੍ਰਾਰਥਨਾ ਕਰ: ਕਿ ਹੇ ਸ੍ਵਾਮੀ! ਮੇਰੇ ਪਰ (ਅਨੁਗ੍ਰਹੁ) ਕ੍ਰਿਪਾ ਧਾਰਿ ਕਰਿ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਾਲਕ-ਪ੍ਰਭੂ! (ਅਸਾਂ ਜੀਵਾਂ ਉੱਤੇ) ਦਇਆ ਕਰੀ ਰੱਖ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨੁਗ੍ਰਹੁ = ਮਿਹਰ, ਕਿਰਪਾ {ਪੁਲਿੰਗ}। ਸੁਆਮੀ = ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Maestro mío, ten Compasión de mí. Tú,"