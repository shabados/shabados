[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚਾ ਨਾਮੁ; ਮੰਨਿ ਵਸਾਏ ॥੪॥"
page = 1343
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by enshrining the Name in the heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਨੂੰ ਦਿਲ ਅੰਦਰ ਟਿਕਾਉਣ ਦੁਆਰਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Name is enshrined in the mind. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਕਾ ਸਚਾ ਨਾਮੁ ਇਸ ਪ੍ਰਕਾਰ ਮਨ ਮੇਂ ਵਸਾਵਣਾ ਕਰੇ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦਾ ਸਦਾ-ਥਿਰ ਨਾਮ ਆਪਣੇ ਮਨ ਵਿਚ ਵਸਾ ਲੈਂਦਾ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਨਿ = ਮਨ ਵਿਚ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ahí el Nombre Verdadero es enaltecido. (4)"