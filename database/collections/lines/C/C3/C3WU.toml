[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਏ ਪ੍ਰਸੰਨ ਗੋਪਾਲ ਰਾਇ; ਭਉ ਕਿਛੁ. ਨਹੀ ਕਰਨਾ ॥੧॥"
page = 818
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When Lord, the king is pleased, there is no need to fear."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਪ੍ਰਭੂ-ਪਾਤਿਸ਼ਾਹ ਖੁਸ਼ ਹੋ ਜਾਂਦਾ ਹੈ ਤਾਂ ਡਰਨ ਦੀ ਕੁਝ ਭੀ ਲੋੜ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Sovereign Lord of the Universe is pleased, there is nothing at all to fear. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਪੁਰਸੋਂ ਪਰ ਗੋਪਾਲ ਰਾਇ ਪ੍ਰਸੰਨ ਭਏ ਹੈਂ ਤਿਨੋਂ ਨੇ ਫੇਰ ਕਿਸੀ ਕਾ ਕੁਛ ਭੈ ਨਹੀਂ ਕਰਨਾ ਹੈ। ਭਾਵ ਯਹਿ ਵਾਹਿਗੁਰੂ ਕਾ ਭੈ ਕਰਨੇ ਸੇ ਔਰ ਭੈ ਸੇ ਨਿਰਭੈ ਹੋਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਉਤੇ ਜਗਤ-ਪਾਲ ਪਾਤਿਸ਼ਾਹ ਦਇਆਵਾਨ ਹੁੰਦਾ ਹੈ, ਉਸ ਨੂੰ ਕੋਈ ਡਰ ਕਰਨ ਦੀ ਲੋੜ ਨਹੀਂ ਰਹਿੰਦੀ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੋਪਾਲ ਰਾਇ = ਜਗਤ ਦਾ ਪਾਲਕ ਪਾਤਿਸ਼ਾਹ। ਭਉ = ਡਰ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Señor está complacido conmigo, y no temo a nadie, ni a nada.(1)"