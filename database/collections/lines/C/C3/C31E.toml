[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੁਮੰ ਧ︀ਯਾਨ ਮੈ ਸੁਕਲ ਅੰਬਰ ਸੁ ਧਾਰੇ ॥"
page = 809

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And Sandhiya, wherefore capturing all the minds."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਸਫ਼ੈਦ ('ਸੁਕਲ') ਬਸਤ੍ਰ ਧਾਰਨ ਕਰ ਕੇ ਧਿਆਨ ਵਿਚ ਆਉਣ ਵਾਲੀ ਹੈਂ।"