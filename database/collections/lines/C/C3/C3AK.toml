data = "ਪੂਰੇ ਗੁਰ ਕਾ; ਸੁਨਿ ਉਪਦੇਸੁ ॥"
page = 295
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Listen to the instruction of the Perfect Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਪੂਰਨ ਗੁਰਾਂ ਦੀ ਸਿੱਖਿਆ ਨੂੰ ਸ੍ਰਵਣ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen to the Teachings of the Perfect Guru;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪੂਰੇ ਗੁਰੋਂ ਕਾ ਉਪਦੇਸ ਸ੍ਰਵਣ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮਨ!) ਪੂਰੇ ਸਤਿਗੁਰੂ ਦੀ ਸਿੱਖਿਆ ਸੁਣ,"

