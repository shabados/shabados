[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੋ ਤੁਮ ਆਜੁ ਨ੍ਰਿਪਤਿ, ਮੁਹਿ ਬ੍ਰਯਾਹੋ ॥੯॥"
page = 965

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘If you are ready to continue loving me, then you must marry me today.(9)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਹੇ ਰਾਜਨ! ਤੁਸੀਂ ਅਜ ਹੀ ਮੈਨੂੰ ਵਿਆਹ ਲਵੋ ॥੯॥"