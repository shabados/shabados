[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਾਵਤ ਥੀ ਤੁਮ ਪੈ ਮਿਲ ਕੈ; ਜਿਹ ਕੀ ਸੁਰ ਤੇ ਕਛੁ ਤਾਨ ਨ ਛੀਜੈ ॥"
page = 393

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“ ‘We used to sing with you in a lengthened tune"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੁਹਾਡੇ ਨਾਲ ਮਿਲ ਕੇ ਗਾਉਂਦੀ ਸਾਂ ਜਿਸ ਦੀ ਸੁਰ ਤੋਂ ਕੋਈ ਤਾਨ ਟੁਟਦੀ ਨਹੀਂ ਸੀ।"