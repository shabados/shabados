[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਜਾ ਰਾਮ ਕੀ ਸਰਣਾਇ ॥"
page = 899
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have sought the protection of Lord, the King."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਪ੍ਰਭੂ, ਪਾਤਿਸ਼ਾਹ ਦੀ ਓਟ ਲਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I seek the Sanctuary of the Sovereign Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਰਾਜਾ ਰਾਮ ਕੀ ਸਰਨ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਹੜੇ ਮਨੁੱਖ ਪ੍ਰਕਾਸ਼-ਸਰੂਪ ਪਰਮਾਤਮਾ ਦਾ ਆਸਰਾ ਲੈਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਜਾ ਰਾਮ = ਚਾਨਣ-ਰੂਪ ਪ੍ਰਭੂ, ਸਭ ਜੀਵਾਂ ਨੂੰ ਆਪਣੀ ਜੋਤਿ ਦਾ ਚਾਨਣ ਦੇਣ ਵਾਲਾ ਹਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Busco el Santuario de mi Señor, el Dios;"