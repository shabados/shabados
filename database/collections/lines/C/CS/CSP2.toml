[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਹ ਬਿਨਸੈ; ਉਹੁ ਮਨਿ ਪਛੁਤਾਵੈ ॥"
page = 268
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "when that vanishes, he mourns in his mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਹ ਨਾਸ ਹੁੰਦੀ ਹੈ, ਉਹ ਆਪਣੇ ਚਿੱਤ ਅੰਦਰ ਅਫਸੋਸ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and when it passes away, they feel regret in their minds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਛਾਯਾ ਅੰਤ ਕੋ ਨਾਸ ਹੋ ਜਾਤੀ ਹੈ, ਤਿਸੀ ਸੇ ਵਹੁ ਜਨ ਪੀਛੈ ਪਸਚਾਤਾਪ ਕਰਤਾ ਹੈ। ਪਰਮੇਸ੍ਵਰ ਬ੍ਰਿਛ ਹੈ, ਜੋ ਮਾਯਾ ਰੂਪ ਛਾਯਾ ਸਾਥ ਪ੍ਰੇਮ ਕਰਤਾ ਹੈ, ਸੋ ਦੁਖੀ ਹੋਤਾ ਹੈ, ਭਾਵ ਛਾਇਆ ਅਨਿਸਥਿਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਿੱਟਾ ਕੀਹ ਨਿਕਲੇਗਾ?) ਉਹ ਛਾਂ ਨਾਸ ਹੋ ਜਾਂਦੀ ਹੈ, ਤੇ, ਉਹ ਮਨੁੱਖ ਮਨ ਵਿਚ ਪਛੁਤਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਹ = ਉਹ (ਛਾਇਆ)। ਉਹੁ = ਉਹ ਮਨੁੱਖ (ਜੋ ਛਾਂ ਨਾਲ ਪਿਆਰ ਪਾਉਂਦਾ ਹੈ)। ਮਨਿ = ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así te lamentas cuando pierdes algo que aprecias."