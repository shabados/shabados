[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬ ਜਾਕਰ ਦਿਹੰਦ ਈਂ ਜ਼ਮੀਨੋ ਜ਼ਮਾਨ ॥"
page = 1414

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "To the devotees, He has endowed the earth, the sky."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦਾ ਜ਼ਿਕਰ ਕਰਨ ਵਾਲਿਆਂ ਲਈ ਆਸਮਾਨ ਅਤੇ ਜ਼ਮੀਨ ਦੀ ਸਿਰਜਨਾ ਕਰ ਦਿੱਤੀ ਹੈ।"