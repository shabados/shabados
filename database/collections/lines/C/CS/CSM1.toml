data = "ਤਬੀਅਤ ਬਹਾਲਸਤ ਹੁਸਨਲ ਜਮਾਲ ॥"
page = 1410

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "His will prevails, and his blessedness is splendid,"

[[content]]
