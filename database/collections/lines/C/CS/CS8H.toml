[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੋਟਿ ਨਾਹੀ; ਤੁਧੁ ਭਗਤਿ ਭੰਡਾਰ ॥"
page = 154
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that Thine treasures of meditation run not short."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿ ਤੇਰੇ ਸਿਮਰਨ ਦੇ ਖਜਾਨੇ ਕਦੇ ਘਟ ਨਹੀਂ ਹੁੰਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The treasure of Your devotional worship is never exhausted."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿ ਤੇਰੇ ਭਗਤੀ ਰੂਪ ਭੰਡਾਰ ਕੀ ਭੀ ਤੋਟ ਨਹੀਂ ਆਵਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਖ਼ਜ਼ਾਨਿਆਂ ਵਿਚ ਭਗਤੀ (ਦੀ ਦਾਤਿ) ਦੀ ਕੋਈ ਘਾਟ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੰਡਾਰ = ਖ਼ਜਾਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Tesoros que provienen al Alabarte son cada vez mayores."