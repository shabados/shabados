[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖਿ. ਸੋਝੀ ਨਾ ਪਵੈ; ਵੀਛੁੜਿ ਚੋਟਾ ਖਾਇ ॥"
page = 60
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The perverse obtain not understanding. Separated from God they bear strokes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਤੀਕੂਲਾਂ ਨੂੰ ਸਮਝ ਨਹੀਂ ਆਉਂਦੀ। ਰੱਬ ਤੋਂ ਵੱਖਰੇ ਹੋ ਕੇ ਉਹ ਸੱਟਾਂ ਸਹਾਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The self-willed manmukhs do not understand; separated from Him, they endure beatings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਮਨਮੁਖ ਹੈ ਤਿਸ ਕੋ ਅਪਨੇ ਸਰੂਪ ਕੀ ਸਮਝ ਨਹੀਂ ਪੜਤੀ ਹੈ, ਯਾਂ ਤੇ ਵਿਛੁੜ ਕੇ ਜਮ ਕੀਆਂ ਚੋਟਾਂ ਖਾਤਾ ਹੈ॥☬ਪ੍ਰਸ਼ਨ: ਵਹੁ ਬ੍ਰਹਮ ਕੌਣ ਅਸਥਾਨ ਮੇਂ ਹੈ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ ਬੰਦੇ ਨੂੰ ਇਹ ਸਮਝ ਨਹੀਂ ਪੈਂਦੀ, ਉਹ ਪ੍ਰਭੂ-ਚਰਨਾਂ ਤੋਂ ਵਿੱਛੁੜ ਕੇ (ਮਾਇਆ ਦੇ ਮੋਹ ਦੀਆਂ) ਚੋਟਾਂ ਖਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨੁਮੁਖਿ = ਆਪਣੇ ਮਨ ਦੇ ਪਿਛੇ ਤੁਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los arrogantes Manmukjs lo ignoran y viven afligidos por la separación."