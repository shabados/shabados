[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਣਿ ਸਜਣ ਜੀ; ਮੈਡੜੇ ਮੀਤਾ ਰਾਮ ॥"
page = 576
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hear, O my friend and intimate."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਣ, ਹੇ ਮੇਰੇ ਮਿੱਤ੍ਰ ਤੇ ਬੇਲੀਆ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen, O my friend and companion"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੇਰੇ ਮਨ ਤਨ ਕੇ ਮਿਤ੍ਰੋ ਸੁਨੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸੱਜਣ! ਹੇ ਮੇਰੇ ਮਿੱਤਰ! ਸੁਣ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਜਣ = ਹੇ ਸੱਜਣ! ਮੈਡੜੇ = ਮੇਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escuchen, oh amigos y compañeros,"