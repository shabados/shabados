[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨੀਚ ਊਚ ਨਹੀ ਮਾਨ ਅਮਾਨ ॥"
page = 344
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "For Him there is no high or low. and no honourable or dishonourable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਲਈ ਕੋਈ ਉੱਚਾ ਜਾਂ ਨੀਵਾਂ ਅਤੇ ਨਾਂ ਹੀ ਇੱਜ਼ਤ ਵਾਲਾ ਜਾ ਬੇਇਜ਼ਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no high or low, no honor or dishonor."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੇ ਅੰਤਹਕਰਣ ਮੇਂ ਊਚ ਨੀਚ ਮਾਨ ਅਪਮਾਨ ਨਹੀਂ ਹੈ॥☬ਪ੍ਰਸ਼ਨ: ਊਚ ਨੀਚ ਕੀ ਨਵਿਰਤੀ ਮੇਂ ਕੌਣ ਕਾਰਣ ਹੈ?☬ਉੱਤਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਹ ਉਸ ਨੂੰ ਕੋਈ ਨੀਵਾਂ ਦਿੱਸਦਾ ਹੈ, ਨਾਹ ਉੱਚਾ; ਕਿਸੇ ਵਲੋਂ ਆਦਰ ਹੋਵੇ ਜਾਂ ਨਿਰਾਦਰੀ, ਉਸ ਲਈ ਇੱਕੋ ਜਿਹੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਨ = ਆਦਰ। ਅਮਾਨ = ਅ-ਮਾਨ, ਨਿਰਾਦਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Para él, no hay ni alto ni bajo, ni honor, ni deshonor,"