[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਜਨਮ ਬੀਤੀਅਨ; ਭਰਮਾਈ ॥"
page = 745
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Good many lives have passed away in wandering about,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਹੀ ਜੀਵਨ ਭਟਕਣ ਅੰਦਰ ਬੀਤ ਗਏ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Countless lifetimes have passed away, wandering aimlessly."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੇਕ ਜਨਮ ਬੀਤੇ ਹੈਂ, ਸੋ ਭਰਮਾਈ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਭਟਕਦਿਆਂ ਭਟਕਦਿਆਂ ਅਨੇਕਾਂ ਹੀ ਜਨਮ ਬੀਤ ਗਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੀਤੀਅਨ = ਬੀਤ ਗਏ ਹਨ। ਭਰਮਾਈ = ਭਟਕਦਿਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno vaga por miles y miles de encarnaciones guiado por la duda,"