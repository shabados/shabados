[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਬ ਤੁਮ ਅਪਨੇ ਚਿਤ ਬਿਖੈ; ਲੀਜਹੁ ਚਰਿਤ ਬਿਚਾਰਿ ॥੧੨॥"
page = 869

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘You, then, determine in your mind to judge her conduct.’(12)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਤੁਸੀਂ ਆਪਣੇ ਮਨ ਵਿਚ ਉਸ ਦੇ ਚਰਿਤ੍ਰ ਬਾਰੇ ਵਿਚਾਰ ਕਰ ਲੈਣਾ ॥੧੨॥"