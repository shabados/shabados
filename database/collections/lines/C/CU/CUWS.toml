[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਤਨੁ ਅਪਨਾ; ਆਗੈ ਧਰਹੁ ॥੧॥"
page = 191
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thy soul and body do thou place before the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਆਤਮਾ ਤੇ ਦੇਹਿ ਤੂੰ ਸਾਹਿਬ ਦੇ ਮੂਹਰੇ ਰੱਖ ਦੇ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Place your mind and body in offering before Him. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨਾ ਮਨ ਔਰ ਤਨ ਸਭ ਆਗੇ ਧਰੋ, ਭਾਵ ਏਹ ਕਿ ਸਰਬ ਸ੍ਵੈ ਅਰਪਨ ਕਰੋ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਮਨ ਆਪਣਾ ਤਨ (ਭਾਵ, ਆਪਣਾ ਹਰੇਕ ਗਿਆਨ-ਇੰਦ੍ਰਾ) ਉਸ ਪਰਮਾਤਮਾ ਦੇ ਹਵਾਲੇ ਕਰ ਦੇਹ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y haz de tu mente y tu cuerpo una ofrenda a ellos.(1)"