[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਰਿ ਰਹੀ; ਉਹ ਜਨ ਤੇ ਬਾਟ ॥੨॥"
page = 393
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that path is removed away from Lord's slave."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਰਾਹ ਸੁਆਮੀ ਦੇ ਗੋਲੇ ਪਾਸੋਂ ਦੁਰੇਡੇ ਰਹਿ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- that path remains far removed from the Lord's humble servant. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ (ਬਾਟ) ਡੰਡੀ ਤੇਰੇ ਜਨੋਂ ਸੇ ਦੂਰ ਰਹਿ ਗਈ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਰਸਤਾ ਸੰਤ ਜਨਾਂ ਤੋਂ ਦੂਰ ਪਰੇ ਰਹਿ ਜਾਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਟ = ਵਾਟ, ਰਸਤਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "se encuentra muy lejos de los Santos. (2)"