[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋਤਿ ਸਮਾਣੀ ਜੋਤਿ ਵਿਚਿ; ਹਰਿ ਨਾਮਿ ਸਮਇਆ ॥੧੪॥"
page = 790
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His light merges in the Supreme Light, and he is absorbed in God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਨੂਰ ਪਰਮ ਨੂਰ ਅੰਦਰ ਅਭੇਦ ਹੋ ਜਾਂਦਾ ਹੈ ਅਤੇ ਉਹ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਵਿੱਚ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His light merges into the Light, and he is absorbed into the Lord's Name. ||14||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕਾ ਮਨ ਹਰੀ ਨਾਮ ਮੇਂ ਸਮਾਇਆ ਹੈ, ਤਿਨ ਕੀ ਜੋਤੀ ਮੇਂ (ਜੋਤਿ) ਸਤਾ ਸਮਾਈ ਹੈ॥੧੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਆਤਮਾ ਪਰਮਾਤਮਾ ਵਿਚ ਲੀਨ ਹੁੰਦੀ ਰਹਿੰਦੀ ਹੈ ਉਹ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਵਿਚ ਜੁੜਿਆ ਰਹਿੰਦਾ ਹੈ ॥੧੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਮਿ = ਨਾਮ ਵਿਚ ॥੧੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Alma se inmerge en el Alma Universal y uno se inmerge en el Nombre del Señor.  (14)"