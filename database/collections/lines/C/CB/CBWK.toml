[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹਿ ਦੀਨ ਕਾਲ ਤਿਹ ਜੋਗ ਜੁਗਤ ॥੬੩॥"
page = 640

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I say unto you that there can be no salvation without the Guru first of all, adopt a Guru, then you will be redeemed, in this way, KAL told the method of Yoga to Dutt.63."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਾਲਦੇਵ ਨੇ ਉਸ ਨੂੰ (ਇਹ) ਯੋਗ ਦੀ ਜੁਗਤ ਕਹਿ ਦਿੱਤੀ ॥੬੩॥"