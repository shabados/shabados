[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਹੁ ਪਰਪੰਚ ਕਰਿ; ਪਰ ਧਨੁ ਲਿਆਵੈ ॥"
page = 656
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Practising great deceit, the man acquires other's wealth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਹੁਤੀ ਠੱਗੀ ਠੋਰੀ ਕਰ ਕੇ, ਇਨਸਾਨ ਹੋਰਨਾਂ ਦੀ ਦੌਲਤ ਲਿਆਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Practicing great hypocrisy, he acquires the wealth of others."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਬਹੁਤ ਹੀ (ਪਰਪੰਚੁ) ਛਲ ਬਲ ਕਰ ਕੇ ਪਰਾਏ ਧਨ ਕੋਲਿ ਆਵਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਈ ਤਰ੍ਹਾਂ ਦੀਆਂ ਠੱਗੀਆਂ ਕਰ ਕੇ ਤੂੰ ਪਰਾਇਆ ਮਾਲ ਲਿਆਉਂਦਾ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਹੁ ਪਰਪੰਚ = ਕਈ ਠੱਗੀਆਂ। ਕਰਿ = ਕਰ ਕੇ। ਪਰ = ਪਰਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Engañando a los demás uno obtiene sus riquezas"