[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਿਰੁ ਛੋਡਿਆ. ਘਰਿ ਆਪਣੈ; ਮੋਹੀ ਦੂਜੈ ਭਾਇ ॥"
page = 785
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Fascinated by the love of the other, she leaves the Husband of her home."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਦੂਸਰੇ ਦੇ ਪਿਆਰ ਨਾਲ ਫਰੇਫਤਾ ਹੋ ਉਹ ਆਪਣੇ ਗ੍ਰਿਹ ਦੇ ਖਸਮ ਨੂੰ ਤਿਆਗਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "She leaves the husband of her own home, enticed by her love of duality."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਪਿਰੁ) ਪਤੀ ਜੋ ਵਾਹਿਗੁਰੂ ਹੈ, ਸੋ (ਘਰਿ) ਅਪਨੇ ਰਿਦੈ ਮੇਂ ਛੋਡਿਆ ਹੈ, ਅਰੁ ਦੂਜੇ ਭਾਵ ਮੇਂ ਬੁਧੀ ਮੋਹੀ ਗਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦੇ ਪਿਆਰ ਵਿਚ ਉਹ ਲੁੱਟੀ ਜਾ ਰਹੀ ਹੈ (ਕਿਉਂਕਿ) ਉਹ ਆਪਣੇ ਹਿਰਦੇ-ਘਰ ਵਿਚ ਵੱਸਦੇ ਖਸਮ-ਪ੍ਰਭੂ ਨੂੰ ਵਿਸਾਰ ਦੇਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹੀ = ਠੱਗੀ ਗਈ, ਲੁੱਟੀ ਗਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ella abandona su propio Hogar engañada por el amor al otro."