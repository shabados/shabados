[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚੰਚਲ ਤ੍ਰਿਸਨਾ ਸੰਗਿ ਬਸਤੁ ਹੈ; ਯਾ ਤੇ. ਥਿਰੁ ਨ ਰਹਾਈ ॥੧॥ ਰਹਾਉ ॥"
page = 219
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The fickle avarice abides with it. Therefore it remains not stable. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੁਲ ਬੁਲਾ ਲਾਲਚ ਇਸ ਦੇ ਨਾਲ ਰਹਿੰਦਾ ਹੈ। ਇਸ ਲਈ ਇਹ ਅਸਥਿਰ ਨਹੀਂ ਰਹਿੰਦਾ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Fickle desires dwell with it, and so it cannot remain steady. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚੰਚਲ ਰੂਪ ਪਦਾਰਥੋਂ ਕੀ ਜੋ ਤ੍ਰਿਸਨਾ ਹੈ, ਸੋ ਮਨ ਕੇ ਸਾਥ ਵਸ ਰਹੀ ਹੈ, ਇਸੀ ਹੇਤੁ ਸੇ ਅਚੱਲ ਹੋ ਕਰ ਨਹੀਂ ਰਹਤਾ॥੧॥ ਰਹਾਉ ॥☬ਜੇ ਕਹੇ ਏਕ ਤ੍ਰਿਸਨਾ ਹੀ ਰਹਤੀ ਹੈ ਵਾ ਕੋਈ ਔਰ ਭੀ ਬਿਕਾਰ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ ਇਹ ਮਨ ਸਦਾ) ਅਨੇਕਾਂ ਹਾਵ-ਭਾਵ ਕਰਨ ਵਾਲੀ ਤ੍ਰਿਸ਼ਨਾ ਨਾਲ ਵੱਸਦਾ ਰਹਿੰਦਾ ਹੈ, ਇਸ ਵਾਸਤੇ ਇਹ ਕਦੇ ਟਿਕ ਕੇ ਨਹੀਂ ਰਹਿੰਦਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੰਚਲ = ਕਦੇ ਨਾਹ ਟਿਕਣ ਵਾਲੀ, ਅਨੇਕਾਂ ਹਾਵ-ਭਾਵ ਕਰਨ ਵਾਲੀ। ਯਾ ਤੇ = ਇਸ ਕਾਰਨ। ਥਿਰੁ = ਸਦਾ-ਟਿਕਵਾਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La mente desvaría cuando el corazón está lleno de enojo,  (1-Pausa)"