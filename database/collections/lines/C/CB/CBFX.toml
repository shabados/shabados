[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨੀ ਸੁਣਿ ਕੈ ਮੰਨਿਆ; ਤਿਨਾ ਨਿਜ ਘਰਿ ਵਾਸੁ ॥"
page = 27
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who hear God's Name and believe in it, obtain an abode in their own home."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਹਰੀ ਨਾਮ ਨੂੰ ਸਰਵਣ ਕਰਦੇ ਅਤੇ ਇਸ ਵਿੱਚ ਯਕੀਨ ਰਖਦੇ ਹਨ, ਉਹ ਆਪਣੇ ਨਿਜਦੇ ਗ੍ਰਿਹ ਅੰਦਰ ਨਿਵਾਸ ਪਾ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who hear and believe, find the home of the self deep within."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਨ ਪੁਰਸੋਂ ਨੇ ਗੁਰਉਪਦੇਸ਼ ਕੋ ਸ੍ਰਵਨ ਕਰ ਕੇ (ਮੰਨਿਆ) ਮਨਨ ਕੀਆ ਹੈ, ਤਿਨੋਂ ਕਾ ਅਪਨੇ (ਘਰਿ) ਸ੍ਵਰੂਪ ਮੇਂ ਬਾਸਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਨੇ (ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ) ਸੁਣ ਕੇ ਮੰਨ ਲਿਆ ਹੈ (ਭਾਵ, ਆਪਣੇ ਮਨ ਨੂੰ ਉਸ ਨਾਮ-ਸਿਮਰਨ ਵਿਚ ਗਿਝਾ ਲਿਆ ਹੈ) ਉਹਨਾਂ ਦਾ ਆਪਣੇ ਅੰਤਰ-ਆਤਮੇ ਨਿਵਾਸ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ (ਭਾਵ, ਉਹਨਾਂ ਦਾ ਮਨ ਬਾਹਰ ਭਟਕਣੋਂ ਹਟ ਜਾਂਦਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਜ ਘਰਿ = ਆਪਣੇ ਘਰ ਵਿਚ, ਅੰਤਰ ਆਤਮੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquéllos que escucharon el Nombre y tuvieron Fe en Él, entraron en el Reino Verdadero del Ser."