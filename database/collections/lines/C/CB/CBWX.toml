[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੁਕਮੇ ਬਾਧਾ; ਕਾਰ ਕਮਾਇ ॥"
page = 390
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It acts subject to Lord's command."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਫੁਰਮਾਨ ਦੀ ਬੰਨ੍ਹੀ ਹੋਈ ਇਹ ਕੰਮ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It acts according to the Command of the Lord's Will."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੁਕਮ ਕਾ ਬਾਧਾ ਹੂਆ ਜੀਵ ਰੂਪ ਹੋ ਕਰ ਸਭ ਕਾਰਜ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹ ਤਾਂ ਪਰਮਾਤਮਾ ਦੇ) ਹੁਕਮ ਵਿਚ ਬੱਝਾ ਹੋਇਆ (ਕਾਂਇਆਂ ਵਿਚ ਆਉਣ ਤੇ ਫਿਰ ਇਸ ਵਿਚੋਂ ਚਲੇ ਜਾਣ ਦੀ) ਕਾਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y funciona como es la Voluntad del Señor."