[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਧਾਇ ਪਰੇ ਤਜਿ ਸੰਕ ਨਿਸੰਕ; ਚਿਤੈ ਅਰਿ ਕਉ ਚਿਤੁ ਮੈ ਨ ਡਰੇ ਹੈ ॥"
page = 484

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Hearing these words of the king, Krishna was filled with rage and he unhesitatingly fell upon him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੰਸਾ ਛਡ ਕੇ (ਸਾਰੇ) ਟੁਟ ਕੇ ਪੈ ਜਾਂਦੇ ਹਨ ਅਤੇ ਨਿਸੰਗ ਹੋ ਕੇ ਵੈਰੀ ਵਲ ਤਕਦੇ ਹਨ, ਪਰ ਚਿਤ ਵਿਚ ਡਰਦੇ ਨਹੀਂ ਹਨ।"