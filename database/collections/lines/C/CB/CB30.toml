[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਬਖਸੇ; ਮੇਲਿ ਮਿਲਾਏ ॥"
page = 116
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself grants pardon and unites in His union."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਖੁਦ ਮਾਫੀ ਦਿੰਦਾ ਹੈ ਤੇ ਆਪਣੇ ਮਿਲਾਪ ਵਿੱਚ ਮਿਲਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself forgives and unites in His Union."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਸਤ ਸੰਗਤ ਕੇ ਮੇਲ ਮੇਂ ਮਿਲਾਇ ਕਰ ਹਰੀ ਆਪੇ ਬਖਸਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਪ੍ਰਭੂ ਆਪ ਹੀ ਬਖ਼ਸ਼ਸ਼ ਕਰਦਾ ਹੈ ਤੇ ਗੁਰੂ-ਚਰਨਾਂ ਵਿਚ ਮਿਲਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੇਲਿ = ਮੇਲ ਵਿਚ, ਚਰਨਾਂ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo nos perdona y nos une Consigo;"