[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖੋੜ ਸੀਗਾਰ ਕਰੈ; ਅਤਿ ਪਿਆਰੀ ॥"
page = 225
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "She may make sixteen Kinds of decoration and render herself exceedingly lovely."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੋਲਾਂ ਪਰਕਾਰ ਦਾ ਹਾਰਸ਼ਿੰਗਾਰ ਲਾਵੇ ਅਤੇ ਆਪਣੇ ਆਪ ਨੂੰ ਪਰਮ ਮਨ ਮੋਹ ਲੈਣ ਵਾਲੀ ਬਣਾ ਲਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "she may decorate herself with the sixteen adornments, and make herself appear gorgeous."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਤੀ ਪਿਆਰ ਸੋ ਸੋਲਾਂ ਸਿੰਗਾਰ ਕਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੋਲਾਂ ਕਿਸਮਾਂ ਦੇ ਹਾਰ-ਸ਼ਿੰਗਾਰ ਕਰਦੀ ਹੋਵੇ, ਤੇ ਮੈਨੂੰ ਬਹੁਤ ਪਿਆਰੀ ਲੱਗਦੀ ਹੋਵੇ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖੋੜ = ਸੋਲਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sus innumerables adornos,"