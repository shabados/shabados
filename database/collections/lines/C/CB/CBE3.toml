[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਉਰ ਜਿਤੇ ਤਹ ਠਾਢੇ ਹੁਤੇ; ਅਸਿ ਲੈ ਬਰਛੈ ਪਰਸੇ ਗਹਿ ਆਏ ॥"
page = 420

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They started moving with their axes and lances"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੋਰ ਵੀ ਜਿਤਨੇ ਉਸ ਸਥਾਨ ਉਤੇ ਸਨ, (ਉਹ) ਤਲਵਾਰਾਂ, ਬਰਛੇ ਅਤੇ ਕੁਹਾੜੇ ਪਕੜ ਕੇ ਆ ਗਏ।"