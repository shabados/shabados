[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਇਸੁ ਮਾਰੇ; ਸੁ ਦਰਗਹ ਸਿਝੈ ॥੨॥"
page = 238
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, n who kills it, is approved in Lord's Court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਇਸ ਨੂੰ ਨਸ਼ਟ ਕਰ ਦਿੰਦਾ ਹੈ, ਉਹ ਸਾਈਂ ਦੇ ਦਰਬਾਰ ਵਿੱਚ ਕਬੂਲ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who kills this is approved in the Court of the Lord. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜੋ ਇਸ ਕੋ ਮਾਰਤਾ ਹੈ, ਸੋ ਦਰਗਹਿ ਮੇਂ (ਸਿਝੈ) ਕਲ੍ਯਾਨ ਕੋ ਪਾਉਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਇਸ (ਮੇਰ-ਤੇਰ ਨੂੰ) ਮੁਕਾ ਲੈਂਦਾ ਹੈ, ਉਹ ਪਰਮਾਤਮਾ ਦੀ ਦਰਗਾਹ ਵਿਚ ਕਾਮਯਾਬ ਹੋ ਜਾਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਝੈ = ਕਾਮਯਾਬ ਹੁੰਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y es aprobado en la Corte del Señor.  (2)"