[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਤੇ; ਨਾਹੀ ਮਨੁ ਤ੍ਰਿਪਤਾਨ ॥੧॥"
page = 179
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through them the mind is not sated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੇ ਰਾਹੀਂ ਆਤਮਾ ਧ੍ਰਾਪਦੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but they do not satisfy the mind. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕਰ ਭੀ ਮਨ ਤ੍ਰਿਪਤ ਨਹੀਂ ਹੂਆ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹਨਾਂ ਨਾਲ (ਕਿਸੇ ਦਾ) ਮਨ ਤ੍ਰਿਪਤ ਨਹੀਂ ਹੋ ਸਕਿਆ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਤੇ = ਉਸ ਨਾਲ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues ninguno de estos estados puede saciar la mente. (1)"