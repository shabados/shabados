[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਤ੍ਰਿਹੁ ਜੁਗੀ, ਤ੍ਰੈ ਧਰਮ ਉਚਾਰਾ ॥੬॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Thus three duties of the three Ages were enunciated."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਤਿੰਨਾ ਯੁਗਾਂ ਦੇ ਤ੍ਰੈ ਧਰਮ (ਵੱਖੋ ਵੱਖ) ਉਚਾਰਦੇ ਸਨ।"