[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਊਡਾਂ ਬੈਸਾ; ਏਕ ਲਿਵ ਤਾਰ ॥"
page = 1275
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Flying in the sky or sitting on the ground, my attention is fixed in the One Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਸਮਾਨ ਵਿੱਚ ਉਡਦਿਆਂ ਜਾਂ ਧਰਤੀ ਤੇ ਬੈਠਿਆ ਮੇਰੀ ਬਿਰਤੀ ਇਕ ਸਾਈਂ ਅੰਦਰ ਜੁੜੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Flying high or sitting down, I am lovingly focused on the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ (ਊਡਾਂ) ਚਲਤੇ ਬੈਠਤੇ ਏਕ ਤੇਰੇ ਮੇਂ ਬ੍ਰਿਤੀ ਤਾਰ ਇਕ ਰਸ ਲਗਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਉਂ ਜਿਉਂ ਮੈਂ (ਜੀਵ-ਪੰਛੀ) ਜੀਵਨ-ਪੰਧ ਵਿਚ ਇਕ ਪਰਮਾਤਮਾ ਦੇ ਚਰਨਾਂ ਵਿਚ ਇਕ-ਰਸ ਸੁਰਤ ਜੋੜ ਕੇ ਉਡਾਰੀਆਂ ਲਾਂਦਾ ਹਾਂ ਤੇ ਲਗਨ ਦਾ ਸਹਾਰਾ ਲੈਂਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਊਡਾਂ = (ਜੇ) ਮੈਂ ਉੱਡਾਂ। ਬੈਸਾ = (ਜੇ) ਮੈਂ ਬੈਠਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Volando en lo alto o sentado, estoy enfocado Amorosamente en el Único Señor,"