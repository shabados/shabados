[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਸਕੀਨੀ ਵਿਚ ਵਤਿ; ਚਾਲੇ ਚਾਲੀਐ ॥੮॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In humility and joy they lead altogether distinct life."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(੯) ਨਿਰਾਲੀ ਚਾਲ (ਇਹ ਹੈ) ਕਿ ਗ਼ਰੀਬੀ ਵਿਚ ਫਿਰਦੇ ਹਨ।"