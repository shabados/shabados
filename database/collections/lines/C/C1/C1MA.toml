[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਢਿ ਭੋਹਰਾ ਤੇ ਪਤਿਹਿ; ਦੀਨੋ ਸਤ੍ਰੁ ਦਿਖਾਇ ॥"
page = 931

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She brought her husband out of the dungeon and revealed to him."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਭੋਰੇ ਤੋਂ ਪਤੀ ਨੂੰ ਕਢ ਕੇ ਵੈਰੀ ਦਿਖਾ ਦਿੱਤਾ"