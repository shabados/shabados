[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਤੁ ਪੀਤੈ ਮਤਿ ਦੂਰਿ ਹੋਇ; ਬਰਲੁ ਪਵੈ ਵਿਚਿ ਆਇ ॥"
page = 554
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By drinking which intellect departs, madness, enters the brain,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਪੀਣ ਦੁਆਰਾ, ਅਕਲ ਮਾਰੀ ਜਾਂਦੀ ਹੈ, ਝੱਲਪੁਣਾ ਦਿਮਾਗ ਵਿੱਚ ਆ ਵੜਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Drinking the wine, his intelligence departs, and madness enters his mind;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਮਦਿਰਾ ਕੈਸੀ ਹੈ ਕਿ ਜਿਸ ਕੋ ਪੀਤੇ ਹੂਏ ਬੁਧੀ ਦੂਰ ਹੋ ਜਾਵੇ ਅਰ ਜੀਵ ਕੇ ਬੀਚ (ਬਰਲੁ) ਬਕਵਾਦ ਆਇ ਪੜੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ (ਸ਼ਰਾਬ) ਜਿਸ ਦੇ ਪੀਤਿਆਂ ਅਕਲ ਦੂਰ ਹੋ ਜਾਂਦੀ ਹੈ ਤੇ ਬਕਣ ਦਾ ਜੋਸ਼ ਆ ਚੜ੍ਹਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਰਲੁ = ਝੱਲਪੁਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sin sentido y privado de toda razón. Así uno no puede distinguir entre lo propio"