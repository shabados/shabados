[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰਾ ਮੇਰਾ ਕਰਿ; ਬਿਲਲਾਹੀ ॥"
page = 188
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man weeps saying \"He was mine, O mine\"."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਦਮੀ ਇਹ ਆਖ ਕੇ ਰੋਂਦਾ ਹੈ \"ਉਹ ਮੇਰਾ ਸੀ, ਉਹ ਮੇਰਾ ਸੀ।\""

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "People weep and cry out, \"Mine, mine!\""

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਬਿਚਾਰਹੀਨ ਮੇਰਾ ਮੇਰਾ ਕਰ ਕੇ ਬ੍ਰਿਲਾਪ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਸੇ ਸੰਬੰਧੀ ਦੇ ਵਿਛੋੜੇ ਤੇ ਲੋਕ) 'ਮੇਰਾ, ਮੇਰਾ' ਆਖ ਕੇ ਵਿਲਕਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ, ਆਖ ਕੇ। ਬਿਲਲਾਹੀ = (ਲੋਕ) ਵਿਲਕਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno se aflige diciendo: “Él era mío, oh mío”"