[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਓਡਛੇਸ ਜਾ ਕੀ ਹਿਤੂ; ਚਿਤ੍ਰਮਤੀ ਤਿਹ ਨਾਮ ॥"
page = 813

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The daughter of the Ruler of Orrisa was known as Chitramatti."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉੜੀਸਾ ਦੇ ਰਾਜੇ ਦੀ ਪਿਆਰੀ (ਧੀ) ਜਿਸ ਦਾ ਨਾਮ ਚਿਤ੍ਰਮਤੀ ਸੀ,"