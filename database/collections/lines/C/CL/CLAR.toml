[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦਿਨੁ ਸਚੁ ਸਲਾਹਣਾ; ਸਚੇ ਕੇ ਗੁਣ ਗਾਉ ॥"
page = 53
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day I praise The True One, and of the True I sing the praises."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੈਣ ਦਿਹੁੰ ਮੈਂ ਸਤਿਤਪੁਰਖ ਦੀ ਪ੍ਰਸੰਸਾ ਕਰਦਾ ਹਾਂ ਅਤੇ ਸੱਚੇ ਦੀ ਹੀ ਮੈਂ ਕੀਰਤੀ ਅਲਾਪਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, I praise the True One; I sing the Glorious Praises of the True One."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਰਾਤ ਦਿਨ (ਸਚੁ) ਪਰਮੇਸ੍ਵਰ ਕੋ ਸਲਾਹਣਾ ਕਰੀਏ, ਔਰ ਰਾਗੋਂ ਕੇ ਬੀਚ ਪਾ ਕਰ ਸਚੇ ਕੇ ਹੀ ਗੁਣੋਂ ਕੋ ਗਾਇਨ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ) ਮੈਂ ਹਰ ਵੇਲੇ ਸਦਾ-ਥਿਰ ਪਰਮਾਤਮਾ ਨੂੰ ਸਲਾਹੁੰਦਾ ਰਹਿੰਦਾ ਹਾਂ ਅਤੇ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਗਾਂਦਾ ਰਹਿੰਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਦਿਨੁ = ਹਰ ਰੋਜ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y así canto las Alabanzas del Uno Verdadero noche y día. ¡"