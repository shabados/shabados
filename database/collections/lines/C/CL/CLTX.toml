[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਰਦ ਕਹਤ ਸੁਨਤ ਧ੍ਰੂਅ ਬਾਰਿਕ; ਭਜਨ ਮਾਹਿ ਲਪਟਾਨੋ ॥੧॥"
page = 830
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Listening to Narad's instruction, the child Dhru got absorbed in meditation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਰਦ ਦੇ ਉਪਦੇਸ਼ ਤੂੰ ਸੁਣ ਕੇ, ਬੱਚਾ ਧ੍ਰੂ ਸਿਮਰਨ ਅੰਦਰ ਲੀਨ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listening to Naarad's teachings, the child Dhroo was absorbed in deep meditation. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਰਦ ਜੀ ਕਾ ਉਪਦੇਸ ਕਥਨ ਹੂਆ, ਧ੍ਰੂਅ ਭਗਤ ਸੁਨਤੇ ਹੀ ਯਦਪਿ ਬਾਲਕ ਅਵਸਥਾ ਥੀ ਪਰੰਤੂ ਹਰੀ ਕੇ ਭਜਨ ਮੇਂ ਤਿਸ ਕਾ ਮਨ ਲਪਟਾਇ ਗਿਆ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਰਦ ਦਾ ਕੀਤਾ ਹੋਇਆ ਉਪਦੇਸ਼ ਸੁਣਦਿਆਂ ਬਾਲਕ ਧ੍ਰੂ ਪਰਮਾਤਮਾ ਦੇ ਭਜਨ ਵਿਚ ਮਸਤ ਹੋ ਗਿਆ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹਤ = ਆਖਦਾ, ਉਪਦੇਸ਼ ਕਰਦਾ ਸੀ। ਲਪਟਾਨੋ = ਮਸਤ ਹੋ ਗਿਆ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dhruva, instruido por Narada, dedicó su ser a la Alabanza de Dios. ()"