type = "primary"
data = "ਜਾ ਕੋ ਨਿਰਖਿ ਇੰਦ੍ਰ ਹਯ ਲਾਜੈ ॥੫॥"
page = 954

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When that horse galloped, even the Lord Indra’s horse felt meek.(5)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਵੇਖ ਕੇ ਇੰਦਰ ਦਾ ਘੋੜਾ ਵੀ ਸ਼ਰਮਸਾਰ ਹੋ ਜਾਂਦਾ ॥੫॥"