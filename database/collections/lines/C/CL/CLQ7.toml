[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਉਬੋਲੇ ਮਹਲਾ ੫ ॥"
page = 1363
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Chaubolas.5th Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚਉਬੋਲੇ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chaubolas, Fifth Mehl:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚਉਬੋਲੇ ਛੰਦ ਵਸੇਸ ਹੈਂ; ਵਾ ਜੋ ਚਾਰ ਭਗਤੋਂ ਨੇ ਬੋਲੇ ਹੈਂ ਸੋਈ ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਨੇ ਉਚਾਰਨ ਕੀਏ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਚਉਬੋਲੇ'।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਉਬੋਲਾ = ਇਕ ਛੰਤ ਦਾ ਨਾਮ ਹੈ। ਇਥੇ 'ਚਉਬੋਲਾ' ਛੰਤ ਦੇ ੧੧ ਬੰਦ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Chaubolas, Guru Aryan Dev, Quinto Canal Divino."