[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੋ ਅਚਰਜੁ; ਦੇਖਿਓ ਕਬੀਰ ॥"
page = 326
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Kabir has seen such wonders."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਐਹੋ ਜਿਹੇ ਅਸਚਰਜ ਵੇਖੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Kabeer has seen such wonders!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਸੰਸਾਰ ਮੇਂ ਐਸਾ ਆਸਚਰਜ ਦੇਖਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਬੀਰ! ਮੈਂ ਇਕ ਅਜੀਬ ਤਮਾਸ਼ਾ ਵੇਖਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਚਰਜੁ = ਅਨੋਖਾ ਕੌਤਕ, ਅਜੀਬ ਤਮਾਸ਼ਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tan extrañas son las maneras del mundo, oh, dice Kabir,"