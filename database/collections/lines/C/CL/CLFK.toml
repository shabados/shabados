[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿਹ ਕਾਜ ਕਹਿਯੋ ਇਨ ਸੋ ਤੁਮ ਜੂਝ; ਕੀਯੋ, ਜਿਨ ਸੋ ਭਟ ਕੋ ਨ ਬੀਓ ॥੨੧੮੨॥"
page = 516

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There is no other hero like him.2182."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਤੁਸੀਂ ਇਨ੍ਹਾਂ ਨਾਲ ਕਿਸ ਲਈ ਯੁੱਧ ਕੀਤਾ ਹੈ ਜਿਨ੍ਹਾਂ ਦੇ ਬਰਾਬਰ ਹੋਰ ਕੋਈ ਯੋਧਾ ਨਹੀਂ ਹੈ ॥੨੧੮੨॥"