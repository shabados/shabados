[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਉ; ਠਾਕੁਰਿ ਦੀਆ ਮਾਨੁ ॥੩॥"
page = 888
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "whom the Lord blesses with honour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਪ੍ਰਭੂ ਇਜ਼ਤ ਆਬਰੂ ਪ੍ਰਦਾਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "whom the Lord Master blesses with honor. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਠਾਕਰ ਜੀ ਨੇ ਮਾਨ ਦੀਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਮਾਲਕ-ਪ੍ਰਭੂ ਨੇ ਆਦਰ ਬਖ਼ਸ਼ਿਆ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਕੁਰਿ = ਠਾਕੁਰ ਨੇ। ਮਾਨੁ = ਆਦਰ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien el Señor y Maestro medita en verdad.  (3)"