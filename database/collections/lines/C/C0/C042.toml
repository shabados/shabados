[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ. ਤਿਹ ਜਾਨੀਐ; ਸਦਾ ਬਸਤੁ ਤੁਮ ਸਾਥਿ ॥੬॥"
page = 1426
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, realise thou Him, who abides ever with thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਤੂੰ ਉਸ ਨੂੰ ਅਨੁਭਵ ਕਰ, ਜੋ ਸਦੀਵ ਹੀ ਤੇਰੇ ਨਾਲ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, realize and know Him, who is always with you. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਸਦੀਵ ਕਾਲ ਤੇਰੇ ਸਾਥ ਰਹਿਤੇ ਹੈਂ, ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਨ ਕੋ (ਜਾਨੀਐ) ਜਾਨਨਾ ਚਾਹੀਐ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਉਸ (ਪ੍ਰਭੂ) ਨੂੰ (ਇਉਂ) ਸਮਝਣਾ ਚਾਹੀਦਾ ਹੈ ਕਿ ਉਹ ਸਦਾ ਤੇਰੇ ਨਾਲ ਵੱਸਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਹ = ਉਸ (ਪਰਮਾਤਮਾ) ਨੂੰ। ਜਾਨੀਐ = (ਇਉਂ) ਜਾਣਨਾ ਚਾਹੀਦਾ ਹੈ (ਕਿ)। ਸਾਥਿ = ਨਾਲ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "dice Nanak, entiéndelo y conócelo, pues Está siempre contigo. (6)"