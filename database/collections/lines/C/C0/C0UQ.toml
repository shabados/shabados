type = "primary"
data = "ਮਨੋ ਰਾਮ ਕੀਨੋ ਦੁਤੀ ਰਾਮ ਤੇ ਲੈ ॥"
page = 276

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Sita bore a son there who was just a replica of Ram"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਰਾਮ ਨੇ (ਸੀਤਾ ਤੋਂ) ਦੂਜਾ ਰਾਮ ਉਤਪੰਨ ਕਰ ਲਿਆ ਹੋਵੇ।"