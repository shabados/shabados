[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁਖ਼ਨ ਗੁਫ਼ਤਨੇ ਰਾਸਤ ਗ਼ੁਫ਼ਤਨ ਖ਼ੁਸ਼ ਅਸਤ ॥"
page = 1418

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘It is always beneficial to reveal and tell the fact."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਮਿਤਰਾਂ ਨੂੰ) ਆਪਣੀ ਗੱਲ ਕਹਿਣੀ ਅਤੇ ਸਹੀ ਰੂਪ ਵਿਚ ਦਸਣੀ ਚੰਗੀ ਹੁੰਦੀ ਹੈ।"