[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਖ ਲਖ ਮੁਹਿ ਮੁਹਿ ਜੀਭੁ ਕਰਿ; ਸੁਣਿ ਬੋਲੈ ਦੇਖੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "If such million of mouths could speak through their millions of tongues;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਫੇਰ ਉਸ) ਹਰੇਕ ਮੂੰਹ ਵਿਚ ਲੱਖ ਲੱਖ ਜੀਭ (ਲੱਗ ਜਾਵੇ, ਕੰਨ ਅੱਖਾਂ ਲੱਗ ਜਾਣ, ਜੋ) ਇਸ ਦੇ ਗੁਣ ਨੂੰ ਬੋਲੇ ਸੁਣੇ ਤੇ ਦੇਖੇ।"