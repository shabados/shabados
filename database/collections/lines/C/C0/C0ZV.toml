[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਜ਼ੱਰਹ ਦਰੀਂ ਰਾਹਿ ਖ਼ਤਰਾ ਤੁਰਾਸਤ ॥"
page = 1392

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Do not bring in your mind the danger of coming there"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਬਾਦਸ਼ਾਹ!) ਤੈਨੂੰ ਇਸ ਰਾਹ ਤੇ ਆਉਣ ਵਿਚ ਜ਼ਰਾ ਜਿੰਨਾ ਵੀ ਖ਼ਤਰਾ ਨਹੀਂ"