data = "ਚਰਾ ਲਾਗਰੀ ਗਸ਼ਤ ਵਜਹੇ ਨੁਮਾ ॥੨੯॥"
page = 1417

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Why do you seem to be languishing?(29)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੁਸੀਂ ਕਮਜ਼ੋਰ ਕਿਉਂ ਹੁੰਦੇ ਜਾ ਰਹੇ ਹੋ। ਇਸ ਦਾ ਕੀ ਕਾਰਨ ਹੈ ॥੨੯॥"