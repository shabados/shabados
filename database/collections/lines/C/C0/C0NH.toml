[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਿਧਿ ਅਉ ਸਿਧਿ ਅਉ ਆਪਨੇ ਦੇਖ ਕੈ; ਜਾਨਿ ਅਭੇਵ ਲਗੀ ਪਗ ਲਾਗਨ ॥"
page = 303

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing the powers, wealth and herself, the mother Yashoda realizing that Krishna was beyond all mysteries, began to touch his feet"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਿੱਧੀਆਂ ਅਤੇ ਸਿੱਧੀਆਂ ਅਤੇ ਆਪਣੇ ਆਪ ਨੂੰ ਵੀ (ਮੂੰਹ ਵਿਚ) ਵੇਖ ਕੇ (ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਨੂੰ) ਪਰਮਾਤਮਾ ਸਮਝ ਕੇ ਜਸੋਧਾ ਪੈਰੀਂ ਆ ਲਗੀ।"