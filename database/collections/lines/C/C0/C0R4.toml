[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਮਾਇਆ; ਜਾ ਕੈ ਸੇਵਕਾਇ ॥"
page = 1156
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such is the Lord, millions of Lakhshmis are his maids,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਸਾ ਹੈ ਉਹ ਸਾਹਿਬ, ਕ੍ਰੋੜਾਂ ਹੀ ਲਖਸ਼ਮੀਆਂ ਹਨ ਜਿਸ ਦੀਆਂ ਨੌਕਰਾਣੀਆਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Millions of Mayas are His maid-servants."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜੋਂ ਮਾਯਾ ਜਿਸ ਤੇਰੇ ਆਗੇ ਸੇਵਾ ਕਰਨੇ ਹੇਤ ਦਾਸੀਆਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹ ਗੋਬਿੰਦ ਐਸਾ ਮਾਲਕ ਹੈ ਕਿ) ਕ੍ਰੋੜਾਂ ਹੀ ਲੱਛਮੀਆਂ ਉਸ ਦੇ ਘਰ ਵਿਚ ਦਾਸੀਆਂ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੈ = ਜਿਸ ਦੇ ਦਰ ਤੇ। ਸੇਵਕਾਇ = ਦਾਸੀਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél en Cuyo Servicio está toda la Maya,"