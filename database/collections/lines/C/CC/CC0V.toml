[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਾਰਿ ਪਦਾਰਥ. ਅਸਟ ਦਸਾ ਸਿਧਿ; ਸਭ ਊਪਰਿ ਸਾਧ ਭਲੇ ॥"
page = 1227
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The four boons and the eighteen supernatural powers; above all these are the pious saints of God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚਾਰ ਦਾਤਾਂ ਅਤੇ ਅਠਾਰਾ ਕਰਾਮਾਤੀ ਸ਼ਕਤੀਆਂ, ਇਨ੍ਹਾਂ ਸਾਰਿਆਂ ਦੇ ਉਪਰ ਹਨ, ਵਾਹਿਗੁਰੂ ਦੇ ਨੇਕ ਸੰਤ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The four great blessings, and the eighteen supernatural spiritual powers - above all these are the Holy Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਧਰਮਾਦਿ ਚਾਰੋਂ ਪਦਾਰਥ ਔਰ ਅਠਾਰਾਂ ਸਿਧੀਆਂ, ਜੋ ਇਨ ਸੇ (ਊਪਰਿ) ਉਪਰਾਮ ਹੂਏ ਹੈਂ ਵਹੀ ਸਾਧੂ ਭਲੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਧਰਮ, ਅਰਥ, ਕਾਮ, ਮੋਖ-ਇਹ) ਚਾਰ ਪਦਾਰਥ ਅਤੇ ਅਠਾਰਾਂ ਸਿੱਧੀਆਂ (ਲੋਕ ਇਹਨਾਂ ਦੀ ਖ਼ਾਤਰ ਤਰਲੇ ਲੈਂਦੇ ਹਨ, ਪਰ ਇਹਨਾਂ) ਸਭਨਾਂ ਤੋਂ ਸੰਤ ਜਨ ਸ੍ਰੇਸ਼ਟ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਾਰਿ ਪਦਾਰਥ = ਧਰਮ ਅਰਥ ਕਾਮ ਮੋਖ। ਅਸਟ ਦਸਾ = ਅਠਾਰਾਂ। ਸਿਧਿ = ਸਿੱਧੀਆਂ। ਭਲੇ = ਗੁਰਮੁਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por encima de los cuatro Regalos y los dieciocho poderes psíquicos están los Santos Benditos de Dios."