[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨਾ ਬਿਗਾਰਿ; ਬਿਰਾਂਨਾ ਸਾਂਢੈ ॥"
page = 875
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and neglecting his own arranges other's affairs,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣਿਆਂ ਨੂੰ ਛੱਡ ਕੇ ਹੋਰਨਾਂ ਦੇ ਕਾਰਜ ਰਾਸ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "he may neglect his own affairs to work for others,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਅਪਨਾ ਕਾਜ ਬਿਗਾੜ ਕੇ ਬਿਗਾਨਾ ਕਾਰਜ (ਸਾਂਢੈ) ਸਵਾਰੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਆਪਣਾ ਨੁਕਸਾਨ ਕਰ ਕੇ ਭੀ ਦੂਜਿਆਂ ਦੇ ਕੰਮ ਸਵਾਰੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਗਾਰਿ = ਵਿਗਾੜ ਕੇ। ਸਾਂਢੈ = ਸਵਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sin perseguir su propio bien hace el bien a otros,"