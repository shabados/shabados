[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਨਾਮੁ; ਤਿਨਿ ਘਟਿ ਘਟਿ ਚੀਨਾ ॥"
page = 266
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "beholds Lord God's Name in every heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦੇ ਨਾਮ ਨੂੰ ਹਰ ਦਿਲ ਅੰਦਰ ਦੇਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "recognizes the Name of the Lord, Har, Har, in each and every heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਨੇ ਹਰਿ ਹਰਿ ਨਾਮ ਜਪ ਕੇ ਘਟੋਂ ਘਟੋਂ ਮੇਂ ਵਿਆਪਕ ਰੂਪ ਹਰੀ ਕੋ (ਚੀਨਾ) ਜਾਣਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਨੁੱਖ ਨੇ ਹਰੇਕ ਸਰੀਰ ਵਿਚ ਪ੍ਰਭੂ ਦੀ ਸੱਤਾ ਪਛਾਣ ਲਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਮੁ = ਸਰਬ-ਵਿਆਪਕ ਤਾਕਤ। ਤਿਨਿ = ਉਸ (ਮਨੁੱਖ ਨੇ)। ਘਟਿ ਘਟਿ = ਹਰੇਕ ਸਰੀਰ ਵਿਚ। ਚੀਨਾ = ਪਛਾਣ ਲਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "exalta en su corazón la Visión del Señor."