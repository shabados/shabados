[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਫਿਰਿ ਓਇ ਕਿਥਹੁ; ਪਾਇਨਿ ਮੋਖ ਦੁਆਰਾ ॥"
page = 115
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How will they then obtain the door of deliverance?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਉਹ ਕਿਸ ਤਰ੍ਹਾਂ ਮੋਖਸ਼ ਦੇ ਦਰਵਾਜੇ ਨੂੰ ਪ੍ਰਾਪਤ ਹੋਣਗੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "how will they find the gate of salvation?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਫਿਰਿ ਵਹੁ ਕਹਾ ਸੇ (ਮੋਖ ਦੁਆਰਾ) ਗ੍ਯਾਨ ਪਾਵੇਂਗੇ, ਭਾਵ ਏਹਿ ਕਿ ਤਿਨ ਕੋ ਮੋਖ੍ਯ ਕੀ ਪ੍ਰਾਪਤੀ ਕੈਸੇ ਹੋਵੇਗੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਫਿਰ ਹੋਰ ਕਿਸੇ ਭੀ ਥਾਂ ਤੋਂ ਵਿਕਾਰਾਂ ਤੋਂ ਖ਼ਲਾਸੀ ਦਾ ਰਸਤਾ ਨਹੀਂ ਲੱਭ ਸਕਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਇ = {ਲਫ਼ਜ਼ 'ਓਹੁ' ਤੋਂ ਬਹੁ-ਵਚਨ}। ਪਾਇਨਿ = ਪਾਂਦੇ ਹਨ, ਪਾ ਸਕਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cómo va a llegar a la Puerta de la Liberación así?"