[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਕਰਮੰ ਨ ਭਰਮੰ, ਨ ਜਨਮੰ ਨ ਜਾਤੰ ॥"
page = 20

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is without work, without illusion, without birth and without caste."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਾ ਕਰਮ ਹੈ, ਨਾ ਭਰਮ ਹੈ, ਨਾ ਜਨਮ ਹੈ, ਨਾ ਜਾਤਿ ਹੈ,"