[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ; ਗੁਰਿ ਹਰਿ ਹਰਿ ਨਾਮੁ, ਕੰਠਿ ਧਾਰੇ ॥"
page = 882
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O God, the Lord Master, the Guru has established Thy Name in my heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਿਗੁਰੂ, ਸੁਆਮੀ ਮਾਲਕ! ਗੁਰਾਂ ਨੇ ਤੇਰਾ ਨਾਮ ਮੇਰੇ ਦਿਲ ਅੰਦਰ ਅਸਥਾਪਨ ਕਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord, the Guru has implanted the Name of the Lord, Har, Har, within my heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹਮਨੇ ਗੁਰੋਂ ਸੇ ਹਰਿ ਹਰਿ ਨਾਮ ਕੰਠ ਮੇਂ ਧਾਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਰਾਮ! ਮੇਰੇ ਵੱਡੇ ਭਾਗ ਹੋ ਗਏ ਹਨ, ਗੁਰੂ ਦੀ ਰਾਹੀਂ, ਹੇ ਹਰੀ! ਤੇਰਾ ਨਾਮ ਮੈਂ ਆਪਣੇ ਗਲ ਵਿਚ ਪ੍ਰੋ ਲਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਮ = ਹੇ ਰਾਮ! ਗੁਰਿ = ਗੁਰੂ ਦੀ ਰਾਹੀਂ। ਕੰਠਿ = ਗਲੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, Tu Nombre Lo enaltezco en mi corazón por la Gracia del Guru."