[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਨ ਗੋਬਿੰਦ ਗਾਇਓ ਨਹੀ; ਜਨਮੁ ਅਕਾਰਥ ਕੀਨੁ ॥"
page = 1426
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If thou have not sung the praises of the World-Lord, thou have wasted thy life in vain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇ ਤੂੰ ਸੰਸਾਰ ਦੇ ਸੁਆਮੀ ਦੀਆਂ ਸਿਫਤਾਂ ਗਾਇਨ ਨਹੀਂ ਕੀਤੀਆਂ ਤਾਂ ਤੂੰ ਆਪਣੇ ਜੀਵਨ ਨੂੰ ਨਿਸਫਲ ਗਵਾ ਦਿਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If you do not sing the Praises of the Lord, your life is rendered useless."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਜਿਸ ਨੇ ਗੋਬਿੰਦ ਕੇ ਗੁਨਾਂ ਨੂੰ ਗਾਇਨ ਨਹੀਂ ਕੀਆ, ਤਿਸ ਨੇ ਇਸ ਮਾਨਸ ਜਨਮ ਕੋ ਅਕਾਰਥ ਕਰ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਤੂੰ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਕਦੇ ਨਹੀਂ ਗਾਏ, ਤਾਂ ਤੂੰ ਆਪਣਾ ਮਨੁੱਖਾ ਜਨਮ ਨਿਕੰਮਾ ਕਰ ਲਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਨ ਗੋਬਿੰਦ = ਗੋਬਿੰਦ ਦੇ ਗੁਣ। ਅਕਾਰਥ = ਵਿਅਰਥ। ਕੀਨੁ = ਬਣਾ ਲਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si no entonas las Alabanzas del Señor tu vida se vuelve inútil."