[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਨਿਰਵੈਰਹੁ ਜੈਕਾਰੁ ਅਜੂਨਿ; ਅਕਾਲਿਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He is devoid of rancour, beyond time and free from the cycle of transmigration."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਨਿਰਵੈਰ' ਹੈ, (ਜੈਕਾਰ=) ਜਯ ਮੂਰਤਿ (ਮੂਰਤ) ਹੈ, ਅਜੋਨੀ (ਸੈਭੰ) ਅਤੇ ਅਕਾਲ ਹੈ।"