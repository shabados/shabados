[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਕਿਸ ਨੋ ਆਖੀਐ; ਕਿਆ ਮਾਇਆ ਕਰਮ ਕਮਾਇ ॥"
page = 67
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whom do men call mammon? What work does mammon do?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੋਹਨੀ ਕਿਸ ਨੂੰ ਕਹਿੰਦੇ ਹਨ? ਮੋਹਨੀ ਕੀ ਕੰਮ ਕਰਦੀ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What is called Maya? What does Maya do?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਕਹੇ ਮਾਇਆ ਕਿਸ ਕੋ ਕਹਤੇ ਹੈਂ, ਔਰ ਵਹੁ ਮਾਇਆ ਕਿਆ ਕਰਮ ਕਮਾਵਤੀ ਹੈ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇ ਪੁੱਛੋ ਕਿ) ਮਾਇਆ ਕਿਸ ਚੀਜ਼ ਦਾ ਨਾਮ ਹੈ? (ਮਾਇਆ ਦਾ ਕੀਹ ਸਰੂਪ ਹੈ? ਜੀਵਾਂ ਉੱਤੇ ਪ੍ਰਭਾਵ ਪਾ ਕੇ ਉਹਨਾਂ ਦੀ ਰਾਹੀਂ) ਮਾਇਆ ਕੇਹੜੇ ਕੰਮ ਕਰਦੀ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਸ ਨੋ = ਕਿਸ ਨੂੰ {ਨੋਟ: ਲਫ਼ਜ਼ 'ਕਿਸੁ' ਦਾ (ੁ) ਸੰਬੰਧਕ 'ਨੋ' ਦੇ ਕਾਰਨ ਉਡ ਗਿਆ ਹੈ। ਵੇਖੋ 'ਗੁਰਬਾਣੀ ਵਿਆਕਰਣ'}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Qué es Maya, qué acciones son de Maya?"