[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਫੁਲਾਂ ਅੰਦਰਿ ਵਾਸੁ ਹੈ; ਹੋਇ ਭਵਰੁ ਲੁਭਾਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The Lord is the fragrance in flowers and becoming black bee He is attracted towards flowers."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਫੁੱਲਾਂ ਵਿਚ ਵਾਸ਼ਨਾ (ਆ ਪਈ) ਹੈ (ਜਿਸ ਪਰ) ਭੌਰਾ ਲੋਭ ਰਿਹਾ ਹੈ;"