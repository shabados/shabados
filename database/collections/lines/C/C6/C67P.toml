[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਨਾਨਕ; ਸਦ ਬਲਿਹਾਰਾ ਜੀਉ ॥੪॥੩॥੧੬੮॥"
page = 217
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Slave Nanak, is, ever, a sacrifice unto the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੋਲਾ ਨਾਨਕ, ਸਦੀਵ ਹੀ ਸਾਹਿਬ ਉਤੋਂ ਸਦਕੇ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Servant Nanak is forever a sacrifice. ||4||3||168||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੈਂ ਸਦਾ ਵਾਰਨੇ ਜਾਤਾ ਹੂੰ॥੪॥੩॥੧੬੮॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਾਸ ਨਾਨਕ! (ਆਖ-ਹੇ ਹਰੀ!) ਮੈਂ (ਤੈਥੋਂ ਤੇ ਤੇਰੇ ਭਗਤ ਤੋਂ) ਸਦਾ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ ॥੪॥੩॥੧੬੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, Tu Esclavo ofrece su ser siempre en sacrificio a Ti. (4-3-168)"