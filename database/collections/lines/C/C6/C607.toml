[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਗ੍ਰਿਹ ਆਏ; ਰਾਜਾ ਰਾਮ ਭਤਾਰਾ ॥੧॥ ਰਹਾਉ ॥"
page = 482
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Monarch Lord has come to my house as my Husband. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਪਾਤਸ਼ਾਹ ਮੇਰੇ ਕੰਤ ਵਜੋ ਮੇਰੇ ਘਰ ਆਇਆ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord, my King, has come to my house as my Husband. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਗ੍ਰਿਹ ਮੇਂ ਰਾਜਾ ਰਾਮ ਜੀ (ਭਤਾਰਾ) ਪਤੀ ਆਏ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਮੇਰੇ (ਹਿਰਦੇ-) ਘਰ ਵਿਚ ਮੇਰਾ ਪਤੀ (ਜਗਤ ਦਾ) ਮਾਲਕ-ਪਰਮਾਤਮਾ ਆਇਆ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mi Dios, ha venido a habitar en mi hogar. (1‑Pausa)"