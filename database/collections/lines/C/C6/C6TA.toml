type = "primary"
data = "ਸਾਧ ਊਪਰਿ; ਜਾਈਐ ਕੁਰਬਾਨੁ ॥"
page = 283
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Become thou a sacrifice unto the saint."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੰਤ ਉਤੋਂ ਬਲਿਹਾਰਨੇ ਹੋ ਜਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "To the Holy, make your life a sacrifice."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਸਾਧੂ ਪਰ ਕੁਰਬਾਨ ਜਾਈਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖ ਤੋਂ ਸਦਕੇ ਹੋਹੁ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੁਰਬਾਨੁ = ਸਦਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y póstrate ante ellos,"