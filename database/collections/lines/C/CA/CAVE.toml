[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੈ ਬਚਨਿ; ਪੇਖਿਓ ਸਭੁ ਬ੍ਰਹਮੁ ॥੪॥"
page = 239
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through Guru's Word, I have seen the Lord everywhere."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਬਾਣੀ ਰਾਹੀਂ ਮੈਂ ਹਰ ਥਾਂ ਸਾਈਂ ਨੂੰ ਵੇਖ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Guru's Word, I see God everywhere. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਥਾ ਗੁਰੋਂ ਕੇ ਬਚਨੋਂ ਸੇ ਸਭ ਕੋ ਪਾਰਬ੍ਰਹਮ ਦੇਖਿਆ ਹੈ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਹੁਣ ਮੈਂ ਹਰ-ਥਾਂ-ਵੱਸਦਾ ਪਰਮਾਤਮਾ ਵੇਖ ਲਿਆ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੇਖਿਓ = ਮੈਂ ਵੇਖ ਲਿਆ ਹੈ। ਸਭੁ = ਹਰ ਥਾਂ। ਬ੍ਰਹਮੁ = ਪਰਮਾਤਮਾ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y he visto al Señor prevaleciendo en todo. (4)"