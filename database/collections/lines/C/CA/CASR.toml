data = "ਭੂਮ ਭਰਥ ਭਏ ਤਬੈ; ਜਨਮੇਜ ਰਾਜ ਮਹਾਨ ॥"
page = 141

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then the great king Janmeja become the Sustainer of the earth."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਭਰਤ-ਭੂਮੀ ਉਤੇ ਮਹਾਨ ਰਾਜਾ ਜਨਮੇਜਾ ਹੋਇਆ"