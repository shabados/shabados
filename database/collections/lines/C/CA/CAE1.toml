[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮੂਰਖ ਨਾਲਿ, ਨ ਕੋਇ ਸਥੋਈ ॥੩॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The idiot has no companion."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੂਰਖ ਦਾ ਕੋਈ ਸਾਥੀ ਨਹੀਂ ਹੈ (ਗੱਲ ਕੀ ਅੰਨ੍ਹਾਂ, ਬੋਲਾ, ਗੁੰਗਾ, ਨਕਟਾ, ਲੁੰਜਾ ਆਦਿ ਸਾਰੇ ਵਿਸ਼ੇਖਣ ਉਸ ਵਿਖੇ ਵਿਦਮਾਨ ਹਨ)।"