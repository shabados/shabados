[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਜ ਤ︀ਯਾਗ ਤਪਸ︀ਯਾ ਕਰੈ ਪਰੈ ਨਰਕ ਮਹਿ ਜਾਇ ॥੯੧॥"
page = 909

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘And, after forsaking governance, goes to meditate, he is destined for hell.(91)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਜ ਛੱਡ ਕੇ ਤਪਸਿਆ ਕਰਦਾ ਹੈ, (ਉਹ) ਨਰਕ ਵਿਚ ਪੈਂਦਾ ਹੈ ॥੯੧॥"