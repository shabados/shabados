[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ ਲੋਚੈ ਸਭੁ ਕੋਇ; ਵਣਾਹੰਬੈ ॥੬॥"
page = 1104
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "even though everyone may desire it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਵੇਂ ਹਰ ਜਣਾ ਇਸ ਦੀ ਖ਼ਾਹਿਸ਼ ਪਿਆ ਕਰੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "even though all the people may wish for it. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚਾਹੇ ਸਭ ਕੋਈ ਚਾਹੇ। ਹਾਂ ਜੀ ਐਸੇ ਹੀ ਬਨਤਾ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਭਾਵੇਂ ਕੋਈ ਕਿਤਨੀ ਹੀ ਤਾਂਘ ਕਰੇ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭੁ ਕੋਇ = ਹਰੇਕ ਜੀਵ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aunque lo añore y lo deseé. (6)"