[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮੇਰੇ; ਸਦਾ ਹਰਿ ਵੇਖੁ ਹਦੂਰਿ ॥"
page = 34
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Mind! ever see God just close-by."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਆਤਮਾ! ਵਾਹਿਗੁਰੂ ਨੂੰ ਹਮੇਸ਼ਾਂ ਅਤੀ ਨੇੜੇ ਦੇਖ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, see the Lord ever close at hand."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ ਪ੍ਯਾਰੇ! ਗੁਰੋਂਦ੍ਵਾਰੇ ਹਰੀ ਕੋ ਸਦੀਵਕਾਲ (ਹਦੂਰਿ) ਪ੍ਰਤੱਖ ਹੀ ਦੇਖੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਪਰਮਾਤਮਾ ਨੂੰ ਸਦਾ (ਆਪਣੇ) ਅੰਗ-ਸੰਗ ਵੇਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਦੂਰਿ = ਹਾਜ਼ਰ-ਨਾਜ਼ਰ, ਅੰਗ-ਸੰਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, reconoce la Presencia de tu Señor por siempre"