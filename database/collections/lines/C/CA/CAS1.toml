[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੈ ਨਾਨਕੁ. ਜਿਸੁ ਕਰੇ ਕਿਰਪਾ; ਸੋ ਹਰਿ ਭਗਤੀ ਚਿਤੁ ਲਾਵਏ ॥੧॥"
page = 440
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, he, to whom God shows mercy, attaches his mind to His meditation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਜਿਸ ਉਤੇ ਵਾਹਿਗੁਰੁ ਮਿਹਰ ਧਾਰਦਾ ਹੈ ਉਹ ਉਸ ਦੀ ਬੰਦਗੀ ਨਾਲ ਆਪਣੇ ਮਨ ਨੂੰ ਜੋੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, that one, upon whom the Lord casts His Glance of Grace, links his consciousness to the worship of the Lord. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਸ ਪਰ ਹਰੀ ਆਪ ਕ੍ਰਿਪਾ ਕਰਤਾ ਹੈ, ਸੋ ਪੁਰਸ ਤਿਸ ਹਰੀ ਕੀ ਭਗਤੀ ਮੇਂ ਚਿਤ ਕੋ ਲਗਾਵਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ-ਜਿਸ ਮਨੁੱਖ ਉਤੇ ਪ੍ਰਭੂ (ਆਪ) ਕਿਰਪਾ ਕਰਦਾ ਹੈ ਉਹ ਮਨੁੱਖ ਆਪਣਾ ਮਨ ਪ੍ਰਭੂ ਦੀ ਭਗਤੀ ਵਿਚ ਜੋੜਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਾਵਏ = ਲਾਵੈ, ਲਾਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, sólo quien tiene la Gracia del Señor se vuelve Devoto de Su Alabanza. (1)"