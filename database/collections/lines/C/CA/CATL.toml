[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਪ੍ਰਭੁ; ਨੇਰੈ ਹੂ ਤੇ ਨੇਰੈ ॥"
page = 530
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the Lord, is the nearest of the near."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਹਿਬ ਦੇ ਪਰਮ ਨੇੜੇ ਤੋਂ ਪਰਮ ਨੇੜੇ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is the nearest of the near."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸੋ ਪ੍ਰਭੂ ਨਿਕਟ ਸੇ ਭੀ ਨਿਕਟ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਰਮਾਤਮਾ ਨੇੜੇ ਹੈ, ਨਾਲ ਹੀ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੇਰੈ ਹੂ ਤੇ ਨੇਰੈ = ਨੇੜੇ ਤੋਂ ਨੇੜੇ, ਨਾਲ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Señor está lo más cerca de lo cerca;"