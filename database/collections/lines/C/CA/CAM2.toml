[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਰਵਿਦਾਸ; ਭਇਓ ਜਬ ਲੇਖੋ ॥"
page = 1293
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Ravidass, when the account is taken."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਵਿਦਾਸ ਜੀ ਆਖਦੇ ਹਨ, ਜਦ ਇਸਾਬ ਕਿਤਾਬ ਲਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Ravi Daas, when the account is called for and given,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਵਿਦਾਸ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਬ ਪ੍ਰਲੋਕ ਮੇਂ ਲੇਖਾ ਹੂਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਤਬਦੀਲੀ ਕਿਵੇਂ ਆਈ?) ਰਵਿਦਾਸ ਆਖਦਾ ਹੈ- (ਸਾਧ ਸੰਗਤ ਵਿਚ ਆ ਕੇ) ਜਦੋਂ ਮੈਂ ਆਪੇ ਵਲ ਝਾਤ ਮਾਰੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਇਓ ਜਬ ਲੇਖੋ = (ਸਾਧ ਸੰਗਤ ਵਿਚ) ਜਦੋਂ (ਮੇਰੇ ਕੀਤੇ ਕਰਮਾਂ ਦਾ) ਲੇਖਾ ਹੋਇਆ, ਸਾਧ ਸੰਗਤ ਵਿਚ ਜਦੋਂ ਮੈਂ ਆਪੇ ਵਲ ਝਾਤ ਮਾਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Ravi Das, cuando las cuentas llegan,"