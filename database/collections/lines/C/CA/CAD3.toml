[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨੀਧਰਿਆ ਧਰ; ਪਨਹ ਖੁਦਾਇ ॥"
page = 1138
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord's protection is the support of the supportless."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੀ ਪਨਾਹ ਨਿਆਸਰਿਆਂ ਦਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is the Support of the unsupported."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਿਰਾਸਰਿਓਂ ਕੇ ਆਸਰਾ ਰੂਪ (ਖੁਦਾਇ) ਪਰਮੇਸ੍ਵਰ! ਤੇਰੀ (ਪਨਹ) ਓਟ ਲਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਰਮਾਤਮਾ ਨਿਆਸਰਿਆਂ ਦਾ ਆਸਰਾ ਹੈ (ਨਿਓਟਿਆਂ ਦੀ) ਓਟ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੀਧਰਿਆ ਧਰ = ਨਿਆਸਰਿਆਂ ਦਾ ਆਸਰਾ। ਪਨਹ = ਪਨਾਹ, ਓਟ। ਖੁਦਾਇ = ਪਰਮਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres el Único Soporte de Tus Criaturas que no lo tienen, el Único orgullo de los pobres,"