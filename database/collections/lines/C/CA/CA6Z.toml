[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਨਿ ਮਿਨਿ ਦੇਖਹੁ; ਸਗਲ ਬੀਚਾਰਿ ॥"
page = 893
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Counting, measuring and thinking in all the ways, see thou,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਵਿਧੀਆਂ ਨਾਲ ਗਿਣ ਮਿਣ ਤੇ ਖਿਆਲ ਕਰਕੇ ਤੂੰ ਵੇਖ ਲੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Calculating, measuring, and thinking in every way,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਵਸਤੂ ਗਿਨ ਲਈਤੀ ਹੈ ਔ ਕੋਈ (ਬੀਚਾਰਿ) ਅਨੁਮਾਨ ਕਰ ਜਾਨੀਤੀ ਹੈ। ਤਿਸੀ ਪ੍ਰਕਾਰ ਤੁਮ ਸਭ ਤਰਾਂ ਸੇ ਬੀਚਾਰ ਕੇ ਦੇਖੋਗੇ ਤੇ ਏਹੀ ਬੀਚਾਰ ਨਿਕਸੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! ਸਾਰੇ ਗਹੁ ਨਾਲ ਚੰਗੀ ਤਰ੍ਹਾਂ ਵਿਚਾਰ ਕੇ ਵੇਖ ਲਵੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਨਿ = ਗਿਣ ਕੇ। ਮਿਨਿ = ਮਿਣ ਕੇ। ਬੀਚਾਰਿ = ਵਿਚਾਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si meditan en esto van a saber, oh amigos,"