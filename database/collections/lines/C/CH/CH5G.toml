[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਸਤ੍ਰੰ ਨ ਮਿਤ੍ਰੰ, ਨ ਨੇਹੰ ਨ ਗੇਹੰ ॥"
page = 23

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is without enemy, without friend, without love and without home."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸਦਾ) ਨਾ ਕੋਈ ਵੈਰੀ ਹੈ, ਨਾ ਮਿੱਤਰ, ਨਾ ਸਨੇਹ ਹੈ ਅਤੇ ਨਾ ਹੀ ਕੋਈ ਘਰ ਹੈ।"