[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਮਰਥ ਅਕਥ ਅਗੋਚਰ ਦੇਵਾ ॥"
page = 1084
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All-powerful, Indescribable and Inapprehensible is my Luminous Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਰਬ-ਸ਼ਕਤੀਵਾਨ, ਅਕਹਿ ਅਤੇ ਸੋਚ ਸਮਝ ਤੋਂ ਪਰੇ ਹੈ ਮੇਰਾ ਪ੍ਰਕਾਸ਼ਵਾਨ ਪ੍ਰਭੂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is all-powerful, indescribable, unfathomable and divine."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਮਰਥ ਅਕਥ ਔ ਅਗੋਚਰ ਜੋ ਪ੍ਰਕਾਸ ਸਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਸਭ ਤਾਕਤਾਂ ਦਾ ਮਾਲਕ ਹੈ, ਉਸ ਦਾ ਸਰੂਪ ਸਹੀ ਤਰ੍ਹਾਂ ਬਿਆਨ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ, ਉਹ ਗਿਆਨ-ਇੰਦ੍ਰਿਆਂ ਦੀ ਪਹੁੰਚ ਤੋਂ ਪਰੇ ਹੈ, ਉਹ ਨੂਰ ਹੀ ਨੂਰ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਮਰਥ = ਸਭ ਤਾਕਤਾਂ ਦਾ ਮਾਲਕ। ਅਕਥ = ਜਿਸ ਦੇ ਸਰੂਪ ਦਾ ਬਿਆਨ ਨਾਹ ਕੀਤਾ ਜਾ ਸਕੇ। ਅਗੋਚਰ = ਅ-ਗੋ-ਚਰ} ਗਿਆਨ-ਇੰਦ੍ਰਿਆਂ ਦੀ ਪਹੁੰਚ ਤੋਂ ਪਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor Indescriptible, Dios Omnipotente e Imperceptible."