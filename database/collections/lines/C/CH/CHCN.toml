[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜਮਪੁਰਿ ਗਇਆ ਪੁਕਾਰ ਸੁਣਿ; ਵਿਲਲਾਵਨਿ ਜੀਅ ਨਰਕ ਨਿਵਾਸੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "From there, he, hearing the cries of inhabitants of hell, went to them."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜਮ ਦੀ ਪੁਰੀ ਨੂੰ ਪੁਕਾਰ ਸੁਣ ਕੇ ਰਾਜਾ (ਗਿਆ) (ਕੀ ਡਿੱਠਾ? ਕਿ) ਨਰਕ ਦੇ ਰਹਿਣ ਵਾਲੇ ਵਡੇ ਕੁਰਲਾਉਂਦੇ ਹਨ।"