[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਮਨਿ ਪਰਗਾਸੁ, ਗੁਰਿ ਉਪਦੇਸਿਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The gurmukh who have received well with the Guru's teachings have got their minds enlightened."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾਂ ਦੇ ਮਨ (ਵਿਖੇ ਜਿਨ੍ਹਾਂ ਨੂੰ) ਗੁਰੂ ਜੀ ਨੇ ਉਪਦੇਸ਼ ਦਿਤਾ ਹੈ ਪ੍ਰਕਾਸ਼ ਰਹਿੰਦਾ ਹੈ।"