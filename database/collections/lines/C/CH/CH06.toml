[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਈ; ਰਾਮ ਨਾਮ ਗੁਨ ਗਾਵਨੋ ॥"
page = 801
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who sings the glories of the Lord's Name;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋਈ ਸਾਹਿਬ ਦੇ ਨਾਮ ਦੀਆਂ ਸਿਫਤਾਂ ਗਾਇਨ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "And one who sings the Glorious Praises of the Lord's Name"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੋਈ ਰਾਮ ਨਾਂਮ ਕੇ ਗੁਣੋਂ ਕੋ ਗਾਇਨ ਕਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜੇਹੜਾ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak se postra a los pies de tal ser que cante la Alabanza del Señor;"