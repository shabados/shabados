[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਚਿ︁ਯੋ ਰੁਦ੍ਰ ਰੁਦ੍ਰੰ ਨਚੇ ਮੱਛ ਮੱਥੰ ॥੪੪॥"
page = 160

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The god Shiva is busy in another dance and on the other side, the Machh incarnation, being pleased, is stirring the ocean.44."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰੂਦਰ ਭਿਆਨਕ ਰੂਪ ਨਾਲ ਨਚ ਰਿਹਾ ਸੀ ਅਤੇ ਮੱਛ ਸਮੁੰਦਰ ਨੂੰ ਨਚ ਨਚ ਕੇ ਮੱਥ ਰਿਹਾ ਸੀ ॥੪੪॥"