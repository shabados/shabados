[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਲਕੁ ਮਰੈ; ਬਾਲਕ ਕੀ ਲੀਲਾ ॥"
page = 1027
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The child dies amidst his child-like frolics."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੱਚਾ ਆਪਣੇ ਬਚਪਦੇ ਦੇ ਕਲੋਲਾਂ ਅੰਦਰ ਮਰ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The child dies in his childish games."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਬਾਲਕ ਮਰੇ ਤਾਂ ਬਾਲਕ ਕੀ ਖੇਲ ਯਾਦ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਵੇਖੋ ਮਾਇਆ ਦੇ ਮੋਹ ਦਾ ਪ੍ਰਭਾਵ! ਜਦੋਂ ਕਿਸੇ ਘਰ ਵਿਚ ਕੋਈ) ਬਾਲਕ ਮਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੀਲਾ = ਖੇਡ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si murió cuando era niño, entonces ellos recuerdan su sonrisa y el disfrute de la vida,"