[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਨਾਮੁ; ਜਪਹੁ ਨਿਤ ਪ੍ਰਾਣੀ ॥"
page = 192
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Mortal, ever, repeat the Name of Lord God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਫ਼ਾਨੀ ਬੁੰਦੇ, ਸਦੀਵ ਹੀ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mortal, chant continually the Name of the Lord, Har, Har."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਾਣੀ! ਨਿਤ ਹਰਿ ਹਰਿ ਨਾਮ ਕੋ ਜਪੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਾਣੀ! ਸਦਾ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਦੇ ਰਹੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਾਣੀ = ਹੇ ਪ੍ਰਾਣੀ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh vida, habita siempre en el Naam, el Nombre,"