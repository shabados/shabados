[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਿ ਦਾਨਦ ਕਿ ਕਸ ਹਾਲ ਬਰ ਸਰ ਗੁਜ਼ਸ਼ਤ ॥੪੯॥"
page = 1408

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And no body cared what state of affairs she had been passing through?(49)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਕੀ ਜਾਣਦੇ ਹਨ ਕਿ ਉਸ ਦੇ ਸਿਰ ਉਤੇ ਕੀ ਬੀਤ ਰਹੀ ਹੈ ॥੪੯॥"