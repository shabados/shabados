[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਿ ਪਿਆਸ ਬਹੁਤੁ; ਦਰਸਾਵੈ ॥੧॥ ਰਹਾਉ ॥"
page = 978
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within my mind is the great thirst to see Thy vision. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਰੇ ਚਿੱਤ ਅੰਦਰ ਤੇਰਾ ਦਰਸ਼ਨ ਦੇਖਣ ਦੀ ਡਾਢੀ ਤ੍ਰੇਹ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Within my mind is such a great thirst for the Blessed Vision of Your Darshan. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਨ ਮੇਂ ਆਪ ਕੇ ਦਰਸਨ ਕੀ ਬਹੁਤ ਪਿਆਸ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਭਾਵ, ਮੇਰੀ ਤਾਂਘ ਪਸੰਦ ਹੈ ਜਾਂ ਨਹੀਂ, ਪਰ) ਮੇਰੇ ਮਨ ਵਿਚ ਤੇਰੇ ਦਰਸ਼ਨ ਦੀ ਤਾਂਘ ਬਹੁਤ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਪਿਆਸ = ਤਾਂਘ। ਦਰਸਾਵੈ = (ਤੇਰੇ) ਦਰਸਨ ਦੀ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En mi mente hay tal sed por la Bendita Visión de Tu Darshan.(1-Pausa)"