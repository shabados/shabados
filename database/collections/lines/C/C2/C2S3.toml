[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਤਾ ਕੀ; ਭਗਤਿ ਕਰੇਹ ॥੩॥"
page = 270
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Nanak, perform the devotional service of that Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਪ੍ਰਭੂ ਦੀ ਪ੍ਰੇਮ-ਮਈ ਸੇਵਾ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, worship Him with devotion. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਮਨ! ਤਿਸ ਕੀ ਭਗਤੀ ਕਰ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਪ੍ਰਭੂ ਦੀ ਭਗਤੀ ਕਰ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰੇਹ = ਕਰ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, recuérdalo siempre como toda tu devoción. (3)"