[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਮ ਧਰਮ ਤਤੁ ਗਿਆਨੁ; ਸੰਤਾ ਸੰਗੁ ਹੋਇ ॥"
page = 521
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The meritorious deeds, faith and real gnosis, are obtained in the society of saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ੁਭ ਅਮਲ, ਈਮਾਨ ਅਤੇ ਯਥਾਰਥ ਬ੍ਰਹਿਮ-ਬੋਧ ਸਤਿ ਸੰਗਤ ਅੰਦਰ ਪ੍ਰਾਪਤ ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The karma of good deeds, the righteousness of Dharma and the essence of spiritual wisdom are obtained in the Society of the Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਕਰਮ ਧਰਮ ਔਰ ਜਥਾਰਥ ਗ੍ਯਾਨੁ ਸੰਤੋਂ ਕਾ ਸੰਗੁ ਹੋ ਕਰ ਪ੍ਰਾਪਤਿ ਹੋਇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਸੰਤਾਂ ਦੀ ਸੰਗਤ ਮਿਲੇ ਤਾਂ ਉਹ ਉੱਚੀ ਸਮਝ (ਪ੍ਰਾਪਤ) ਹੁੰਦੀ ਹੈ, ਜੋ (ਮਾਨੋ,) ਸਭ ਕਰਮਾਂ ਧਰਮਾਂ ਦਾ ਨਿਚੋੜ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y de llegar a la Quintaesencia de lo Real, puede obtenerse a través de los Santos."