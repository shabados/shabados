[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰਾ ਠਾਕੁਰੁ ਅਤਿ ਭਾਰਾ ॥"
page = 1005
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Very great is my Lord Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਿਹਾਇਤ ਹੀ ਵੱਡਾ ਹੈ ਮੈਡਾਂ ਸੁਆਮੀ ਮਾਲਕ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My Lord and Master is utterly powerful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਠਾਕੁਰ ਅਤੀ ਭਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਮਾਲਕ ਪ੍ਰਭੂ ਬਹੁਤ ਤਾਕਤਾਂ ਦਾ ਮਾਲਕ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਤਿ ਭਾਰਾ = ਬਹੁਤ ਤਾਕਤਾਂ ਦਾ ਮਾਲਕ। ਠਾਕੁਰੁ = ਮਾਲਕ-ਪ੍ਰਭੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Glorioso es mi Señor, el Guru,"