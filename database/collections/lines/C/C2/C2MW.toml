[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਾਉ ਨ ਭਗਤੀ; ਨਾ ਸਿਵ ਸਕਤੀ ॥"
page = 1036
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There was no love or devotion nor mind or matter."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਪ੍ਰੀਤ ਜਾਂ ਸ਼ਰਧਾ ਨਹੀਂ ਸੀ, ਨਾਂ ਹੀ ਨਰ ਜਾਂ ਮਾਦਾ ਸੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There was no love or devotion, no Shiva or Shakti - no energy or matter."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੇਮਾ ਭਗਤੀ ਭੀ ਨਹੀਂ ਥੀ ਔ (ਸਿਵ) ਈਸਰ ਮਾਇਆ ਭੀ ਨਹੀਂ ਥੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਨਾਹ ਕਿਤੇ ਪ੍ਰੇਮ ਸੀ ਨਾਹ ਕਿਤੇ ਭਗਤੀ ਸੀ, ਨਾਹ ਕਿਤੇ ਜੜ੍ਹ ਸੀ ਨਾਹ ਚੇਤਨ ਸੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਵ = ਸ਼ਿਵ, ਚੇਤੰਨ। ਸਕਤੀ = ਜੜ੍ਹ ਪਦਾਰਥ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No existía la Amorosa Adoración de Dios, ni conciencia, ni inconciencia."