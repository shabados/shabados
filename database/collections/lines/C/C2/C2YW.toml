[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਜਲਿ ਥੋੜੈ ਮਛੁਲੀ; ਕਰਣ ਪਲਾਵ ਕਰੇਇ ॥"
page = 56
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "like the fish which bewails (cries for pity) bitterly in scanty water."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਘੱਟ ਪਾਣੀ ਵਿਚਲੀ ਮੱਛੀ ਧਾਂਹੀ ਰੋਂਦੀ (ਤੜਫਦੀ) ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "like the fish in shallow water, crying for mercy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਥੋੜੇ ਜਲ ਮੇਂ ਮਛਲੀ (ਕਰਣ ਪਲਾਵ) ਬਿਰਲਾਪ ਕਰਤੀ ਹੈ, ਭਾਵ ਦੁਖੀ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਥੋੜ੍ਹੇ ਪਾਣੀ ਵਿਚ ਮੱਛੀ ਤੜਫਦੀ ਹੈ, ਤਿਵੇਂ ਉਹ ਤਰਲੇ ਲੈਂਦੀ ਰਹਿੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਣ ਪਲਾਵ = {करूणाप्रलाप} ਉਹ ਕੀਰਨੇ ਜੋ ਸੁਣਨ ਵਾਲੇ ਦੇ ਮਨ ਵਿਚ ਤਰਸ ਪੈਦਾ ਕਰ ਦੇਣ, ਤਰਲੇ, ਹਾੜੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "como el pez fuera del agua, llora por un poco de piedad."