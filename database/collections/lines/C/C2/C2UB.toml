[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਤ ਉਤ ਕੀ; ਓਹੁ ਸੋਝੀ ਜਾਨੈ ॥"
page = 281
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "obtains the knowledge of this world and the next one."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਇਸ ਲੋਕ ਅਤੇ ਪ੍ਰਲੋਕ ਦੀ ਗਿਆਤ ਪ੍ਰਾਪਤ ਕਰ ਲੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "understands this world and the next."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਇਸ ਲੋਕ ਔ ਪ੍ਰਲੋਕ ਕੀ ਸੋਝੀ ਜਾਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਲੋਕ ਪਰਲੋਕ ਦੀ (ਭਾਵ, ਜੀਵਨ ਦੇ ਸਾਰੇ ਸਫ਼ਰ ਦੀ) ਸਮਝ ਆ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਤ ਉਤ ਕੀ = ਲੋਕ ਪਰਲੋਕ ਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque Él es el Único que conoce los misterios de este mundo y de los otros mundos."