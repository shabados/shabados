[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਸਤ੍ਰ ਅਸਤ੍ਰ ਸੁਭੇ ਕਹੂੰ; ਸਰਦਾਰ ਸੁਆਰ ਅਨੇਕ ॥"
page = 103

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere generals and warriors with weapons and aromuts are lying down."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਿਤੇ ਅਸਤ੍ਰ-ਸ਼ਸਤ੍ਰਾਂ ਨਾਲ ਸਜੇ ਸਰਦਾਰ ਅਤੇ ਸਵਾਰ (ਡਿਗੇ ਪਏ ਸਨ)"