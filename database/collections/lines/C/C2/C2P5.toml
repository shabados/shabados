[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ; ਨਾਮੁ ਨਿਰੰਜਨ ਪਾਏ ॥"
page = 942
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru-ward is blessed with the Name of the Immaculate Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਸਮਰਪਨ ਨੂੰ ਪਵਿੱਤਰ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੀ ਦਾਤ ਮਿਲਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh obtains the Name of the Immaculate Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖ ਪਰਮੇਸਰ ਕਾ ਨਾਮ ਪਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਹੁਕਮ ਵਿਚ ਤੁਰਨ ਵਾਲਾ ਮਨੁੱਖ ਨਿਰੰਜਨ ਦਾ ਨਾਮ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰੰਜਨ = ਨਿਰ-ਅੰਜਨ, ਮਾਇਆ ਤੋਂ ਰਹਿਤ (ਅੰਜਨੁ = ਸੁਰਮਾ, ਕਾਲਖ, ਮਾਇਆ ਦੀ ਕਾਲਖ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Gurmukj es bendecido con el Nombre del Señor Inmaculado,"