data = "ਸਭ ਸ੍ਰੀ ਨਾਮ ਤੁਪਕ ਪਹਿਚਾਨੋ ॥੮੫੮॥"
page = 765

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Yaadveshni”, then add “Jaachar-nayak-shatru” and recognize all the names of Tupak.858."

