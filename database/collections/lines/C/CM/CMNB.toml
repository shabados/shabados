[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਡਗਮਗ ਛਾਡਿ; ਰੇ ਮਨ ਬਉਰਾ ॥"
page = 338
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Cease wavering O crazy man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਡਿੱਕੋ ਡੋਲੇ ਖਾਣੇ ਛੱਡ ਦੇ, ਹੇ ਬੇਵਕੂਫ ਬੰਦੇ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Stop your wavering, O crazy people!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਾਵਰੇ ਮਨ! (ਡਗ) ਵਿੰਗੇ ਰਸਤੇ ਛੋਡ ਦੇਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਮਲੇ ਮਨ! (ਸਭ ਤੋਂ ਉੱਚੇ ਮਾਲਕ ਦੀ ਸ਼ਰਨ ਆ ਕੇ ਹੁਣ) ਜੱਕੋ-ਤੱਕੇ ਛੱਡ ਦੇਹ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਡਗਮਗ = ਡੱਕੋ-ਡੋਲੇ, ਜੱਕੋ-ਤੱਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente loca, no vaciles en tu sendero,"