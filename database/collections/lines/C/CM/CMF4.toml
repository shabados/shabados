[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕਾ ਰੰਗੁ; ਨ ਉਤਰੈ ਜਾਇ ॥੨॥"
page = 194
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His colour (of love) fades and goes not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ (ਪ੍ਰੇਮ ਦੀ) ਰੰਗਤ ਲਹਿੰਦੀ ਤੇ ਜਾਂਦੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The color of His Love shall never fade away. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪੁਰਸ਼ ਕਾ ਰੰਗ ਕਬੀ ਉਤਰ ਨਹੀਂ ਜਾਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਮਨ ਨੂੰ ਪਰਮਾਤਮਾ ਦੇ ਪਿਆਰ ਦਾ ਰੰਗ ਚੜ੍ਹ ਜਾਂਦਾ ਹੈ, ਤੇ) ਉਸ ਦਾ ਉਹ ਰੰਗ ਕਦੇ ਨਹੀਂ ਉਤਰਦਾ, ਕਦੇ ਨਹੀਂ ਲਹਿਂਦਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Color de Su Amor nunca se desvanecerá. (2)"