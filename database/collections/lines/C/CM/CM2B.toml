[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਗਨਤ ਗੁਣ; ਠਾਕੁਰ ਪ੍ਰਭ ਤੇਰੇ ॥"
page = 802
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Infinite are Thine excellences, O my Lord Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਅੰਤ ਹਨ ਤੇਰੀਆਂ ਚੰਗਿਆਈਆਂ, ਹੇ ਮੇਰੇ ਸੁਆਮੀ ਮਾਲਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your Glories are uncounted, O God, my Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਠਾਕੁਰ! ਤੇਰੇ ਗੁਣੋਂ ਕਾ ਅੰਤ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਠਾਕੁਰ ਪ੍ਰਭੂ! ਤੇਰੇ ਗੁਣ ਗਿਣੇ ਨਹੀਂ ਜਾ ਸਕਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਨਤ = ਅ-ਗਨਤ, ਜੋ ਗਿਣੇ ਨਾਹ ਜਾ ਸਕਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Incontables son Tus Glorias, mi Señor y Maestro."