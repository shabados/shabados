[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਹਾ ਸਿਰਿਆ ਕਾ; ਖਸਮੁ ਪ੍ਰਭੁ ਸੋਈ ॥"
page = 185
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That Lord is the Master of both the worlds (extremities)."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਹਿਬ ਦੌਨਾ ਜਹਾਨਾਂ (ਕਿਨਾਰਿਆਂ) ਦਾ ਮਾਲਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is the Lord and Master of both worlds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਦੋਹਾਂ ਸਿਰਿਆਂ ਕਾ ਅਰਥਾਤ ਲੋਕ ਪ੍ਰਲੋਕ ਵਾ ਗੁਰਮੁਖਾਂ ਮਨਮੁਖਾਂ ਕਾ ਮਾਲਕ ਸੋਈ ਪ੍ਰਭੂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੀਵਾਂ ਦੇ ਭੀ ਕੀਹ ਵੱਸ?) (ਜੀਵਨ ਦੇ ਚੰਗੇ ਤੇ ਮੰਦੇ) ਦੋਹਾਂ ਪਾਸਿਆਂ ਦਾ ਮਾਲਕ ਪਰਮਾਤਮਾ ਆਪ ਹੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਹਾ ਸਿਰਿਆ ਕਾ = ਦੋਹਾਂ ਪਾਸਿਆਂ ਦਾ (ਉਲਟੇ ਮਾਰਗ ਅਤੇ ਸਿੱਧੇ ਮਾਰਗ ਦਾ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor está en los dos extremos,"