[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬ੍ਰਿਥਾ ਜਗਤ ਮੈ ਆਇ; ਜੋਗ ਬਿਨੁ ਜਨਮੁ ਗਵਾਯੋ ॥"
page = 906

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Without yoga I have obliterated my birth."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋਗ ਤੋਂ ਬਿਨਾ ਮੈਂ ਵਿਅਰਥ ਵਿਚ ਜਗਤ ਵਿਚ ਆ ਕੇ ਜਨਮ ਗੰਵਾਇਆ ਹੈ।"