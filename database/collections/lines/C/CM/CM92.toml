[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਸਾਹੁ ਆਪੇ ਵਣਜਾਰਾ; ਆਪੇ ਹੀ ਹਰਿ ਹਾਟੁ ॥"
page = 517
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God Himself is the banker, Himself the Merchant and Himself the shop."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਆਪ ਸ਼ਾਹੂਕਾਰ ਹੈ, ਆਪ ਵਾਪਾਰੀ ਅਤੇ ਆਪ ਹੀ ਹੱਟੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is the true banker, He Himself is the merchant, and He Himself is the store."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਆਪੇ ਹੀ ਸਾਹੂਕਾਰ ਹੈ, ਅਰੁ ਆਪ ਹੀ ਬਨਜਾਰਾ ਹੈ, ਆਪੇ ਹੀ (ਹਾਟੁ) ਦੁਕਾਨ ਹੈ, ਭਾਵ ਗੁਰੂ ਔ ਸਿਖ ਔ ਸਤਸੰਗਤ ਰੂਪ ਆਪ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਆਪ ਹੀ ਸ਼ਾਹੂਕਾਰ ਹੈ, ਆਪ ਹੀ ਵਾਪਾਰੀ ਅਤੇ ਆਪ ਹੀ ਹੱਟੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਣਜਾਰਾ = ਵਾਪਾਰੀ। ਹਾਟੁ = ਹੱਟ (ਜਿਥੇ ਸੌਦਾ ਹੋ ਰਿਹਾ ਹੈ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo es el mercader, Él Mismo es el comerciante,"