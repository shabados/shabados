[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਫਿਰਿ ਬਾਬਾ ਗਇਆ ਬਗਦਾਦਿ ਨੋ; ਬਾਹਰਿ ਜਾਇ ਕੀਆ ਅਸਥਾਨਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "From Mecca Baba went to Baghdad and stayed outside the city."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਫੇਰ ਬਾਬਾ ਜੀ ਬਗ਼ਦਾਦ ਨੂੰ ਚਲੇ ਗਏ, ਬਾਹਰ ਜਾ ਕੇ ਡੇਰਾ ਲਾਯਾ।"