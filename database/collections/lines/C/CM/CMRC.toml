[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੌਦਾ ਕੌ ਚੌਕਸ ਕਰੈ; ਪਿਤੁ ਤੇ ਭਯੋ ਸਪੂਤ ॥੧॥"
page = 891

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He was an obedient boy and was very alert in business.(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੂਰੀ ਚੌਕਸੀ ਨਾਲ ਸੌਦਾ ਕਰਦਾ ਸੀ ਅਤੇ ਪਿਉ ਦਾ ਸੁਪੁੱਤਰ ਹੋ ਨਿਬੜਿਆ ਸੀ ॥੧॥"