[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਖੀਰੁ ਨੀਰੁ ਨਿਰਵਾਰਦੇ; ਲਹਰੀਂ ਅੰਦਰਿ ਫਿਰਨਿ ਤਰੰਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "These swans separate water from milk and go on floating on the waves."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਦੁਧ ਪਾਣੀ ਅੱਡ ਅੱਡ ਕਰ ਕੇ ਲਹਿਰਾਂ ਵਿਖੇ ਤਰਦੇ ਫਿਰਦੇ ਹਨ।"