data = "ਬੋਲਿ ਸਾਹੁ ਕੋ ਧਾਮ ਪਠਾਯੋ ॥"
page = 897

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the Rani had pondered over this, she called the Shah to her house."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤਾਂ) ਉਸ ਸ਼ਾਹ ਨੂੰ ਘਰ ਬੁਲਾ ਭੇਜਿਆ।"