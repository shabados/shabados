[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿ ਮੁਲਕਸ਼ ਬਸੇ ਅਸਤ ਬਖ਼ਸ਼ਸ਼ ਕਰੀਮ ॥੮॥"
page = 1397

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He ruled over many counties through Karim, the Bountiful.(8)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਪਾਸ ਮੁਲਕ ਵੀ ਬਹਤੁ ਸੀ ਅਤੇ ਬਖ਼ਸ਼ਿਸ਼ ਕਰਨ ਵਾਲਾ ਵੀ ਸੀ ॥੮॥"