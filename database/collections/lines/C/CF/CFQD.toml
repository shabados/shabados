[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਰਿਖੀ ਮੁਨੀ ਦਿਗੰਬਰਾਂ; ਕਾਲਖ ਕਰਾਮਾਤ ਅਗਲੇਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Innumerable are the practising, siddhs (yogis) who publicise themselves as great persons."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਰਿਖੀ ਮੁਨੀ, ਨਾਂਗੇ ਕਰਾਮਾਤ ਦੀ ਕਾਲਖ ਵਾਲੇ ਬਾਹਲੇ।"