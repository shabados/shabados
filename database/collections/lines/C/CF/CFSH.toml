data = "ਬਿਦਾ ਦੀਜਿਯੈ ਦਾਸ ਕੌ; ਬਨ ਕੌ ਕਰੈ ਪਯਾਨ ॥"
page = 908

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Please bid me farewell, to enable me to go to the jungle,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮਾਤਾ!) ਦਾਸ ਨੂੰ ਵਿਦਾ ਕਰੋ (ਤਾਂ ਜੋ) ਬਨ ਨੂੰ ਜਾ ਸਕਾਂ"