[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਫਲਾ; ਸੋਈ ਜਨੁ ਪਾਏ ॥੬॥"
page = 760
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that man obtains all the fruits."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੁਰਸ਼ ਸਾਰੇ ਫਲ ਪਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- that humble being receives the fruits of all rewards. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਫਲਾਂ ਨੂੰ ਸੋਈ ਪੁਰਸ਼ ਪਾਵਤਾ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਮਨੁੱਖ (ਮਨੁੱਖਾ ਜਨਮ ਦੇ) ਸਾਰੇ ਫਲ ਹਾਸਲ ਕਰ ਲੈਂਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "recibe todos los frutos de las añoranzas de su corazón.(6)"