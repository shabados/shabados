[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਮਿੱਟੀ ਦੀ ਹਰ ਮੁੱਠ ਭਲਾ ਉਸ ਦੀ ਕਦਰ ਕੀ ਜਾਣ ਸਕਦੀ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਕੈ ਬਿਦਾਨਦ ਕਦਰਿ ਊ ਹਰ ਮੁਸ਼ਤਿ ਖ਼ਾਕ ॥੮॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, the zeal and ardor for His love is assimilated in the heads of all men and women. (360)"