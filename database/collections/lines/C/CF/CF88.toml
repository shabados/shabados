[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲੈ ਮੁਹਰੈ ਰੁਪਯਾ ਦੇਵੌ; ਤੁਮ ਕਹ ਸਾਹ, ਸੁਧਾਰਿ ॥੧੪॥"
page = 857

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Let us do a deal. You give me Gold coins in exchange of coins rupees.’(I4)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਹੇ ਸ਼ਾਹੂਕਾਰ! (ਮੈਂ) ਤੁਹਾਨੂੰ ਮੋਹਰਾਂ ਲੈ ਕੇ ਰੁਪਏ ਦਿੰਦਾ ਹਾਂ ॥੧੪॥"