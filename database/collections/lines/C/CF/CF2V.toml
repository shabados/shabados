type = "primary"
data = "ਕਿ ਮਾਰਾ ਬ ਕਾਰ ਅਸਤ ਵਕਤੇ ਮੁਦਾਮ ॥੪੮॥"
page = 1412

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Because the Master is intelligent enough, and is known all over.(48)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦਾ ਪਿਆਲਾ ਦੇ ਜੋ ਮੈਨੂੰ ਸਦਾ ਚਾਹੀਦਾ ਹੈ ॥੪੮॥"