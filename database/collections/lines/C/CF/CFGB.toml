[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਮਲ ਅੰਮ੍ਰਿਤੁ; ਗੁਰ ਤੇ ਪਾਇਆ ॥"
page = 121
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The immaculate elixir is obtained from the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤ੍ਰ ਆਬਿ-ਹਿਯਾਤ ਗੁਰਾਂ ਤੋਂ ਪਰਾਪਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Immaculate Ambrosial Nectar is obtained from the Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਅੰਮ੍ਰਿਤ ਨਿਰਮਲ ਗੁਰੋਂ ਸੇ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਗੁਰੂ ਪਾਸੋਂ ਪਵਿਤ੍ਰ ਪਰਮਾਤਮਾ ਦਾ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ ਪ੍ਰਾਪਤ ਕਰ ਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਮ੍ਰਿਤ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ। ਤੇ = ਤੋਂ, ਪਾਸੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno encuentra el Néctar Inmaculado, el Amrit del Guru;"