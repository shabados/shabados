[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਿਹ ਬਰਣ ਜਾਤਿ ਨਹੀ ਕ੍ਰਿਤ ਅਨੰਤ ॥"
page = 642

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is the king of kings and Sovereign of sovereigns"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਵਰਣ ਅਤੇ ਜਾਤਿ ਨਹੀਂ ਹੈ ਅਤੇ ਜਿਸ ਦੀ ਕ੍ਰਿਤ (ਕੀਰਤੀ) ਅਨੰਤ ਹੈ।"