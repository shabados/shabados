[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮ ਬਿਨਾ; ਸਦ ਸਦ ਹੀ ਝੂਰੇ ॥੪॥"
page = 1140
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Lord's Name, man repents for ever and eye."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਨਾਮ ਦੇ ਬਗੈਰ, ਬੰਦਾ ਹਮੇਸ਼ਾਂ ਹਮੇਸ਼ਾਂ ਨਹੀਂ ਅਫਸੋਸ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Naam, the mortal regrets and repents forever and ever. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਪ੍ਰਕਾਰ ਨਾਮ ਸੇ ਬਿਨਾਂ ਮਨਬਾਣੀ ਕਰ ਜੀਵ ਸਦੀਵ ਝੂਰੇਗਾ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਨ ਤੋਂ ਬਿਨਾ ਮਨੁੱਖ ਸਦਾ ਹੀ ਸਦਾ ਹੀ ਚਿੰਤਾ-ਫ਼ਿਕਰਾਂ ਵਿਚ ਪਿਆ ਰਹਿੰਦਾ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਦ = ਸਦਾ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así pues, sin el Nombre, uno vive en el sufrimiento. (4)"