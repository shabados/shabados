data = "ਅਤੇ ਤਰ੍ਹਾਂ ਤਰ੍ਹਾਂ ਦਾਈਆਂ ਨੇ ਲਾਡ ਕਰਕੇ (ਵੱਡਾ ਕੀਤਾ) ॥੨॥"