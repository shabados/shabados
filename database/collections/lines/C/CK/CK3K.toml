data = "ਭਾਂਤਿ ਭਾਂਤਿ ਦਾਈਅਨਿ ਦੁਲਰਾਏ ॥੨॥"
page = 60

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Whence I was brought to Madra Desh (Punjab), where I was caressed by various nurses.2"

[[content]]
