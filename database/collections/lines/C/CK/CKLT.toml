[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਸੇਤੀ ਸਦ ਮਾਣਹੁ ਰਲੀਆ; ਜਨਮ ਮਰਣ ਦੁਖ ਖੋਵਹੁ ॥"
page = 77
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With God ever enjoy revelments and do away with the pain of birth and death."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨਾਲ ਹਮੇਸ਼ਾਂ ਰੰਗ-ਰਲੀਆਂ ਭੋਗ ਅਤੇ ਜੰਮਣ ਤੇ ਮਰਣ ਦੀ ਪੀੜਾ ਨੂੰ ਮਿਟਾ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Enjoy ecstasy forever with the Lord, and do away with the pains of birth and death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹਰੀ ਕੇ ਸਾਥ ਹੀ ਸਦਾ (ਮਾਣਹੁ ਰਲੀਆ) ਅਨੰਦ ਕਰੋ ਔਰ ਜਨਮ ਮਰਨ ਦਾ ਦੁਖ ਨਸ਼ਟ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਜੀਵ-ਮਿਤ੍ਰ! ਸਿਮਰਨ ਦੀ ਬਰਕਤਿ ਨਾਲ ਹੀ) ਪਰਮਾਤਮਾ ਦੇ ਮਿਲਾਪ ਦਾ ਆਨੰਦ ਸਦਾ ਮਾਣੋਗੇ ਤੇ ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਵਿੱਚ ਪਾਣ ਵਾਲੇ ਦੁਖਾਂ ਨੂੰ ਮੁਕਾ ਸਕੇਗਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਲੀਆ = ਆਤਮਕ ਆਨੰਦ। ਜਨਮ ਮਰਣ ਦੁਖ = ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਵਿਚ ਪਾਣ ਵਾਲੇ ਦੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Disfruta de tu Esposo y deja atrás la pena de los nacimientos y muertes."