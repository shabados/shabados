[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮਿ ਰਤੇ; ਪਾਵਹਿ ਮੋਖ ਦੁਆਰੁ ॥"
page = 941
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Imbued with the Name, one finds the door of salvation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਨਾਲ ਰੰਗੀਜਣ ਦੁਆਰਾ, ਇਨਸਾਨ ਮੁਕਤੀ ਦੇ ਦਰਵਾਜ਼ੇ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Attuned to the Naam, they find the door of liberation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਮ ਮੇਂ ਰਤੇ ਹੈਂ, ਸੋ (ਮੋਖ ਦੁਆਰ) ਗ੍ਯਾਨ ਕੋ ਪਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਵਿਚ ਰੰਗੇ ਹੋਏ ਬੰਦੇ ਹੀ ਹਉਮੈ ਤੋਂ ਛੁਟਕਾਰਾ ਪਾਣ ਦਾ ਰਾਹ ਲੱਭਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਖ = ਮੁਕਤੀ, ਆਜ਼ਾਦੀ, ਖ਼ਲਾਸੀ, ਹਉਮੈ ਤੋਂ ਖ਼ਲਾਸੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, imbuido en el Nombre, uno es Emancipado,"