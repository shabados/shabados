[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਸਾਜਨ ਸਿਖ; ਭਏ ਸੁਹੇਲੇ ॥"
page = 1340
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Illustrious are the saints, friends and the disciples of the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੀਰਤੀਮਾਨ ਹਨ ਗੁਰਾਂ ਦੇ ਸਾਧੂ, ਮਿੱਤਰ ਅਤੇ ਮੁਰੀਦ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Saints, spiritual companions and Sikhs are exalted and uplifted."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਸਾਜਨੋਂ ਕੀ ਸਿਖਿਆ ਲੇ ਕਰ ਸੋਈ ਜਨ (ਸੁਹੇਲੇ) ਸੁਖੀ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਸੰਤ-ਜਨ ਸੱਜਣ ਸਿੱਖ ਸੁਖੀ ਜੀਵਨ ਵਾਲੇ ਹੋ ਗਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਖ = (ਸਾਰੇ) ਸਿੱਖ (ਬਹੁ-ਵਚਨ)। ਸੁਹੇਲੇ = ਸੁਖੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Santos, Compañeros Espirituales y Sikhs, son exaltados y elevados,"