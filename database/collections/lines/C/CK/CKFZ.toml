[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਦਰਸ ਮਗਨ ਮਨੁ ਮੋਹਿਓ; ਪੂਰਨ ਅਰਥ ਬਿਸੇਖਾ ॥੨॥੬੫॥੮੮॥"
page = 1221
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, he whose soul is inebriated and fascinated with the Lord's vision; his tasks are well accomplished."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਜਿੰਦੜੀ ਪ੍ਰਭੂ ਦੇ ਦਰਸਨ ਨਾਲ ਮਤਵਾਲੀ ਅਤੇ ਮੋਹਿਤ ਹੋਈ ਹੈ, ਉਸ ਦੇ ਕਾਰਜ ਭਲੀ ਭਾਤ ਸੰਪੂਰਨ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, one whose mind is fascinated and intoxicated with the Blessed Vision of the Lord's Darshan - his tasks are perfectly accomplished. ||2||65||88||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਹੇ ਹਰੀ! ਜਿਸ ਕਾ ਮਨੁ ਆਪ ਕੇ ਦਰਸਨ ਨੇ ਮੋਹਿਆ ਹੈ ਵਹੁ ਦਰਸਨ ਮੇਂ ਮਗਨ ਰਹਿਤਾ ਹੈ, ਔਰ ਉਨ ਕੇ (ਬਿਸੇਖਾ) ਵਿਸੇਸ ਕਰ ਕੇ ਸਭੀ ਅਰਥ ਮਨੋਰਥ ਪੂਰਨ ਹੂਏ ਹੈਂ॥੨॥੬੫॥੮੮॥☬ਰਾਮ ਨਾਮ ਸਿਮਰਨੇ ਕਾ ਫਲ੍ਹ ਦਿਖਾਵਤੇ ਹੂਏ ਕਹਿਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਤਾਂ (ਪ੍ਰਭੂ ਦੇ) ਦਰਸਨ ਵਿਚ ਮਸਤ ਰਹਿੰਦਾ ਹੈ, ਉਸ ਦਾ ਮਨ (ਪ੍ਰਭੂ ਦੇ ਦਰਸਨ ਨਾਲ) ਮੋਹਿਆ ਜਾਂਦਾ ਹੈ। (ਪ੍ਰਭੂ ਦੀ ਕਿਰਪਾ ਨਾਲ) ਉਸ ਦੀਆਂ ਸਾਰੀਆਂ ਲੋੜਾਂ ਉਚੇਚੀਆਂ ਹੁੰਦੀਆਂ ਰਹਿੰਦੀਆਂ ਹਨ ॥੨॥੬੫॥੮੮॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਗਨ = ਮਸਤ। ਅਰਥ = ਲੋੜਾਂ। ਬਿਸੇਖਾ = ਉਚੇਚੀਆਂ ॥੨॥੬੫॥੮੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, vivo habitando en mi Único Dios y ve, me he liberado de mi ego negativo. (2-65-88)"