[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਨਮਸਕਾਰ ਸੰਸਾਰ ਵਿਚਿ; ਆਦਿ ਪੁਰਖ ਆਦੇਸੁ ਉਧਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "All in the world salute him and he, ordained by the primal Lord, liberates one and all."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰ ਵਿਖੇ ਸਭ ਨਮਸਕਾਰਾਂ ਕਰਦੇ (ਸਰਬ ਸੰਤਾਂ ਦੇ) ਆਦਿ ਪੁਰਖ ਹਨ, (ਜੋ ਕੋਈ) ਨਮਸਕਾਰ ਕਰੇ ਉਧਾਰ (ਪਾਉਂਦਾ ਹੈ)।"