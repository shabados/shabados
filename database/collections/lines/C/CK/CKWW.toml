[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਗੁਰਮੁਖਿ ਸਬਦਿ ਪਛਾਣੈ ॥੭੧॥"
page = 946
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, it is through the Guru, that one realises the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਹੀ ਇਨਸਾਨ, ਸੁਆਮੀ ਨੂੰ ਅਨੁਭਵ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Gurmukh realizes the Word of the Shabad. ||71||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਵਹੀ ਗੁਰਮੁਖ (ਸਬਦਿ) ਬ੍ਰਹਮ ਕੋ ਪਛਾਨਤੇ ਹੈਂ॥੭੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਮਨੁੱਖ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ (ਪ੍ਰਭੂ ਨਾਲ) ਜਾਣ-ਪਛਾਣ ਬਣਾ ਲੈਂਦਾ ਹੈ ॥੭੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh dice Nanak, el Gurmukj comprende la Palabra del Shabd.(71)"