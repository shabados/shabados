[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਬ ਲਿਖਿਆ ਸੁ; ਮੇਟਣਾ ਨ ਜਾਏ ॥"
page = 88
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What is destined from the very outset, that cannot be effaced."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਛ ਐਨ ਆਰੰਭ ਤੋਂ ਉਕਰਿਆ ਹੋਇਆ ਹੈ, ਉਹ ਮੇਸਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That which is pre-ordained cannot be erased."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੂਰਬ ਕਰਮੋਂ ਕਾ ਲੇਖ ਲਿਖਿਆ ਹੈ, ਸੋ ਮੇਟਾ ਨਹੀਂ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਤਰ੍ਹਾਂ) ਪਹਿਲਾਂ (ਕੀਤੇ ਕਰਮਾਂ ਦੇ ਚੰਗੇ ਮੰਦੇ ਸੰਸਕਾਰ ਜੋ ਮਨ ਤੇ) ਲਿਖੇ ਗਏ (ਹਨ, ਤੇ ਜਨਮ ਜਨਮ ਵਿਚ ਭਵਾਉਂਦੇ ਫਿਰਦੇ ਹਨ) ਮਿਟ ਨਹੀਂ ਸਕਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la marca de su Destino no se borra."