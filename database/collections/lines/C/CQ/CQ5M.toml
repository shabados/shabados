[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਣਿ ਬਾਵਰੇ; ਕਿਆ ਕੀਚੈ ਕੂੜਾ ਮਾਨੋ ॥"
page = 777
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hearken thou, O mad man, why takest thou the false pride?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੁਣ ਹੇ ਝੱਲੇ ਇਨਸਾਨ! ਤੂੰ ਝੂਠਾ ਹੰਕਾਰ ਕਿਉਂ ਕਰਦਾ ਹੈਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen, madman: why do you harbor false pride?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਣ ਹੇ ਬਾਵਰੇ! ਕਯਾ ਝੂਠਾ ਮਾਨ ਕਰ ਰਹਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਵਰੇ! (ਨਾਸਵੰਤ ਪਦਾਰਥਾਂ ਦਾ) ਝੂਠਾ ਅਹੰਕਾਰ ਨਹੀਂ ਕਰਨਾ ਚਾਹੀਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਆ ਕੀਚੈ = ਨਹੀਂ ਕਰਨਾ ਚਾਹੀਦਾ। ਕੂੜਾ = ਝੂਠਾ। ਮਾਨੋ = ਅਹੰਕਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hombre loco, ¿por qué te enorgulleces de todo lo que es ilusorio y falso?"