[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਿਰਖਤ ਨੈਨ ਬਸੰਤ ਪ੍ਰਭਾ ਤਾਕਹ ਸਿਰ ਨ︀ਯਾਵਤ ॥"
page = 696

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing him, the glory of spring bows its head"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੁੰਦਰਤਾ ਨੂੰ ਅੱਖਾਂ ਨਾਲ ਵੇਖ ਕੇ ਬਸੰਤ (ਰੁਤ) ਉਸ ਅਗੇ ਸਿਰ ਨਿਵਾਉਂਦਾ ਹੈ।"