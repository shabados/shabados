[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੋਨੀ; ਮੋਨਿਧਾਰੀ ॥"
page = 71
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The man of silence observes silence."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੁੱਪ ਕੀਤਾ ਬੰਦਾ ਚੁੱਪ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The men of silence observe silence,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੋਨੀ ਮੌਨ ਕੀ ਧਾਰਨਾ ਕੋ ਮੁਕਤੀ ਮਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਚੁੱਪ ਸਾਧੀ ਰੱਖਣ ਵਾਲੇ ਸਾਧੂ ਚੁੱਪ ਵੱਟੀ ਰੱਖਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਨੀ = ਚੁੱਪ ਰਹਿਣ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El hombre de silencio observa silencio."