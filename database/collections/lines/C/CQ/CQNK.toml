[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰਿਥਮ ਨਾਮ ਜਮ ਕੋ ਉਚਰਿ; ਬਹੁਰੋ ਰਦਨ ਉਚਾਰਿ ॥"
page = 719

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After speaking the names of “Yama” in the beginning, if the word “Radan” (tooth) is uttered,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਹਿਲਾਂ 'ਜਮ' ਦਾ ਨਾਮ ਕਹਿ ਕੇ, ਫਿਰ 'ਰਦਨ' (ਦੰਦ) (ਸ਼ਬਦ) ਉਚਾਰ ਦਿਓ।"