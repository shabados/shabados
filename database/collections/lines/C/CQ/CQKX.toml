[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਚੀਨ ਚਤੁਰ ਨਿਰਧਾਰ ॥੬੩੯॥"
page = 746

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Anil” in the beginning and then adding the word “Chhodani” at the end, the names of Tupak are formed.639."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਨਾਮ ਤੁਪਕ ਦਾ ਹੈ। ਸਮਝਦਾਰ ਵਿਚਾਰ ਲੈਣ ॥੬੩੯॥"