[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਲਿ ਸੰਗਤਿ ਸਾਧੂ ਮੀਤ ॥"
page = 669
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My friend, join thou the saints society."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਿਤ੍ਰ, ਤੂੰ ਸਤਿਸੰਗਤ ਅੰਦਰ ਜੁੜ ਜਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Join the Saadh Sangat, the Company of the Holy, O friend."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ ਮਿਤ੍ਰ! ਸੰਤ ਜਨੋਂ ਕੀ ਸੰਗਤਿ ਮੇਂ ਮਿਲ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਿੱਤਰ! ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਮਿਲ ਕੇ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਿ = ਮਿਲ ਕੇ। ਮੀਤ = ਹੇ ਮਿੱਤਰ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "únete a la Sociedad de los Santos, tus amigos,"