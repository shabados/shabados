[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਾ ਨਰ; ਅਪਨੋ ਜਨਮੁ ਗਵਾਵੈ ॥"
page = 1231
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why, O man, waste thy life?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੰਦੇ! ਤੂੰ ਆਪਣਾ ਜੀਵਨ ਕਿਉਂ ਗੁਆਉਂਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mortal, why have you wasted your life?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੁਰਸ਼! ਕਿਸ ਵਾਸਤੇ ਅਪਨੇ ਜਨਮ ਕੋ ਬਿਅਰਥ ਗਵਾਵਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਤਾ ਨਹੀਂ ਮਨੁੱਖ ਕਿਉਂ ਆਪਣਾ ਜੀਵਨ ਅਜਾਈਂ ਬਰਬਾਦ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹਾ = ਕਿਉਂ? ਗਵਾਵੈ = ਗਵਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué pierde el ser humano el Mérito en esta vida?,"