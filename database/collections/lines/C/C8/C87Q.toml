data = "ਚਮਕਿ ਉਠੀ ਜਬ ਬਚਨ ਉਚਾਰੇ ॥"
page = 855

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘When you had gone across the stream and after washing away your friend came back home.’(22)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦ (ਡੋਗਰ ਨੇ ਇਹ) ਬੋਲ ਕਹੇ (ਤਾਂ ਉਹ) ਭੜਕ ਉਠੀ"