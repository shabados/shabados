[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਝਲਹਲੰਤ ਉਜਲ ਅਸਿ ਧਾਰੰ ॥੫੮੮॥"
page = 261

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The blows were struck with many hands creating knocking sounds and the white edges of the swords glittered.588."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕ੍ਰਿਪਾਨਾਂ ਦੀਆਂ ਚਿੱਟੀਆਂ ਧਾਰਾਵਾਂ ਹਿਲਦੀਆਂ ਹੋਈਆਂ ਝਿਲਮਿਲ ਕਰਦੀਆਂ ਹਨ ॥੫੮੮॥"