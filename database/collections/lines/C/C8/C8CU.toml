[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਵਤ ਚੋਰ ਤ੍ਰਿਯਨ ਕੇ ਭਯੋ ॥"
page = 884

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Shah was detained in a village on his way and, here, in the house of one lady, the thieves broke in."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਧਰ ਇਸਤਰੀਆਂ ਨੂੰ ਚੋਰ ਆ ਪਿਆ।"