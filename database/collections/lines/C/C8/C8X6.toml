[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੈ ਸਿਮਰਨਿ; ਕਬਹੁ. ਨ ਝੂਰੇ ॥"
page = 263
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through Lord's meditation the mortal never grieves."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਭਜਨ ਪ੍ਰਾਣੀ ਕਦੇ ਭੀ ਝੂਰਦਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remembering God, one never grieves."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕੇ ਸਿਮਰਨ ਸੇ ਇਹੁ ਪੁਰਸ਼ ਕਬੀ ਝੂਰਤਾ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਦੇ ਚਿੰਤਾ ਦੇ ਵੱਸ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਝੂਰੇ = ਝੁਰਦਾ, ਚਿੰਤਾ ਕਰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Meditando en Dios, uno nunca se lamenta."