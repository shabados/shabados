[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜੈਸਾ. ਤੈਸਾ ਉਹੀ; ਰਹਉ ਹਰਖਿ ਗੁਨ ਗਾਇ ॥੧੨੨॥"
page = 1370
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As God is, so is He Himself alone. I abide in the delight of singing His praises."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਹੋ ਜਿਹਾ ਵਾਹਿਗੁਰੂ ਹੈ ਉਹੋ ਜੇਹਾ ਉਹ ਕੇਵਲ ਆਪ ਹੀ ਹੈ। ਮੈਂ ਉਸ ਦੀਆਂ ਸਿਫਤਾਂ ਗਾਉਣ ਦੇ ਆਨੰਦ ਅੰਦਰ ਵਸਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is just as He is. I dwell in delight, singing His Glorious Praises. ||122||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਜੈਸਾ ਹਰੀ ਹੈ ਤੈਸਾ ਓਹੀ ਹੈ, ਭਾਵ ਹਰੀ ਕੇ ਤੁਲ ਔਰ ਕੋਈ ਨਹੀਂ ਹੈ। ਮੈਂ ਤਿਸ ਕੇ ਗੁਣੋਂ ਕੋ ਗਾਇ ਕਰ ਸਦਾ (ਹਰਖਿ) ਅਨੰਦ ਸੰਜੁਗਤ ਰਹਿਤਾ ਹੂੰ॥੧੨੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਆਪਣੇ ਵਰਗਾ ਆਪ ਹੀ ਹੈ; (ਮੈਂ ਤਾਂ ਸਿਰਫ਼ ਇਹ ਕਹਿ ਸਕਦਾ ਹਾਂ ਕਿ) ਉਸ ਦੇ ਗੁਣ ਗਾ ਗਾ ਕੇ ਮੈਂ ਮੌਜ ਵਿਚ ਟਿਕਿਆ ਰਹਿੰਦਾ ਹਾਂ ॥੧੨੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਹਉ = ਮੈਂ ਰਹਿੰਦਾ ਹਾਂ। ਹਰਖਿ = ਖ਼ੁਸ਼ੀ ਵਿਚ, ਖੇੜੇ ਵਿਚ। ਗਾਇ = ਗਾ ਕੇ ॥੧੨੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Señor es así como es y yo habito en Dicha disfrutando de Sus Gloriosas Alabanzas.(122)"