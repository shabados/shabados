[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੁਤ੍ਰ ਕਲਤ੍ਰ; ਕੁਟੰਬ ਸੰਗਿ ਜੁਰਿਆ ॥"
page = 237
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Afterwards he attaches himself to his sons, wife and family."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਗਰੋਂ ਉਹ ਆਪਣੇ ਆਪ ਨੂੰ ਆਪਣੇ ਬੇਟਿਆ ਵਹੁਟੀ ਤੇ ਪਰਵਾਰ ਨਾਲ ਜੋੜ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They become attached to their children, spouses and families."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਪੁਤ੍ਰ ਇਸਤ੍ਰੀ ਆਦਿ ਕੁਟੰਬ ਕੇ ਸਾਥ ਜੁੜਤਾ ਭਇਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ ਵਿਚ ਜਨਮ ਲੈ ਕੇ ਫਿਰ ਸਹਜੇ ਸਹਜੇ ਜਵਾਨੀ ਤੇ ਪਹੁੰਚ ਕੇ) ਪੁੱਤ੍ਰ ਇਸਤ੍ਰੀ ਆਦਿਕ ਪਰਵਾਰ ਦੇ ਮੋਹ ਵਿਚ ਫਸਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਲਤ੍ਰ = ਇਸਤ੍ਰੀ। ਜੁਰਿਆ = ਜੁੜਿਆ ਰਹਿੰਦਾ ਹੈ, ਮੋਹ ਵਿਚ ਫਸਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "uno se relaciona con los hijos, la esposa y la familia."