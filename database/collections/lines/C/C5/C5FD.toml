type = "primary"
data = "ਪਰ ਤ੍ਰਿਯ ਕਰਿ ਅਪਨੀ ਪਹਿਚਾਨੀ ॥"
page = 965

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There, he made love with her considering another person’s woman as his own."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਅਤੇ) ਪਰਾਈ ਇਸਤਰੀ ਨੂੰ ਆਪਣਾ ਕਰ ਕੇ ਮੰਨ ਲਿਆ।"