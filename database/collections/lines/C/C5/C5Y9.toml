[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਸੁਖਾ; ਗੁਰ ਚਰਨਾ ॥"
page = 531
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "all the comforts abide in Guru's Feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਆਰਾਮ ਗੁਰਾਂ ਦੇ ਪੈਰ ਵਿੱਚ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All peace is found in the Guru's feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਸੁਖੋਂ ਕੇ ਸਮਦਾਇ ਗੁਰੋਂ ਕੇ ਚਰਨੋਂ ਕੇ ਧਿਆਨ ਮੇਂ ਹੈਂ॥ ਪੁਨਾ ਕੈਸੇ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਚਰਨਾਂ ਵਿਚ ਪਿਆਂ ਸਾਰੇ ਸੁਖ ਮਿਲ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਬ = ਸਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Toda Paz la encuentro a los Pies de mi Guru; Sus Pies"