[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਬਿਨੁ ਰਾਜਾ; ਅਵਰੁ. ਨ ਕੋਈ ॥"
page = 936
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without Him, there is no other King."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਬਾਝੋਂ ਹੋਰ ਕੋਈ ਪਾਤਿਸ਼ਾਹ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no other king, except Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਬਿਨਾ ਰਾਜਾ ਔਰ ਕੋਈ ਨਹੀਂ ਹੈ, ਭਾਵ ਸਭ ਕਾ ਸਾਮੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਤੋਂ ਬਿਨਾ ਹੋਰ ਕੋਈ (ਭਾਵ, ਉਸ ਦੇ ਬਰਾਬਰ ਦਾ) ਹਾਕਮ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, sin Él no hay ningún otro rey,"