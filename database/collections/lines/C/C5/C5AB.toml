[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਸੁ ਪੁਰਖ ਕਾ; ਨਾਹੀ ਕਦੇ ਬਿਨਾਸ ॥"
page = 287
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That man never perishes,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਇਨਸਾਨ ਕਦਾਚਿੱਤ ਨਾਸ ਨਹੀਂ ਹੁੰਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That person whose mind is illuminated"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪੁਰਸ ਕਾ ਕਬੀ ਨਾਸ ਨਹੀਂ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਕਦੇ ਨਾਸ ਨਹੀਂ ਹੁੰਦਾ (ਭਾਵ, ਉਹ ਮੁੜ ਮੁੜ ਮੌਤ ਦਾ ਸ਼ਿਕਾਰ ਨਹੀਂ ਹੁੰਦਾ)"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La persona que se encuentra iluminada"