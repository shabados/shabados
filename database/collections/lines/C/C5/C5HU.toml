[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਉ ਅਪੁਨਾ ਸਾਂਈ ॥"
page = 630
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I meditate on my Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਸੁਆਮੀ ਦਾ ਭਜਨ ਕਰਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I meditate in remembrance on my Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੈਂ ਅਪਨੇ ਸੁਆਮੀ ਕੋ ਸਿਮਰਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੈਂ (ਉਸ) ਖਸਮ-ਪ੍ਰਭੂ (ਦਾ ਨਾਮ) ਸਿਮਰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਮਰਉ = ਸਿਮਰਉਂ, ਮੈਂ ਸਿਮਰਦਾ ਹਾਂ। ਸਾਂਈ = ਖਸਮ-ਪ੍ਰਭੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Medita en tu Señor; Contémplalo día y noche,"