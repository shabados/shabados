type = "primary"
data = "ਯਕੇ ਨਾਮ ਰਾਹੋ ਸੁਰਾਹੋ ਦਿਗਰ ॥"
page = 1425

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘The name of one horse is Rahu and the other is Surahu."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਘੋੜੇ ਦਾ ਨਾਂ ਰਾਹੋ ਸੀ ਅਤੇ ਦੂਜੇ ਦਾ ਸੁਰਾਹੋ ਸੀ।"