[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖੁ ਅੰਧਾ ਮੁਗਧੁ ਗਵਾਰੁ ॥"
page = 931
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the apostate is gone blind, foolish and ignorant."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਧਰਮੀ, ਅੰਨ੍ਹਾ, ਮੂਰਖ ਅਤੇ ਬੇਸਮਝ ਥੀ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the self-willed manmukh is blind, foolish and ignorant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਨ ਬਿਕਾਰੋਂ ਕਰ ਮਨਮੁਖ ਅਤੀ ਮੂਰਖ ਅੰਧਾ ਹੋ ਰਹਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ (ਪਰਮਾਤਮਾ ਦਾ ਸਿਮਰਨ ਛੱਡ ਕੇ) ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਦਾ ਹੈ (ਤੇ ਲਬ ਲੋਭ ਆਦਿਕ ਕਰਦਾ ਹੈ) ਉਹ ਮੂਰਖ, ਮੂੜ੍ਹ, ਤੇ ਅੰਨ੍ਹਾ ਹੈ (ਭਾਵ, ਉਸ ਨੂੰ ਜੀਵਨ ਦਾ ਸਹੀ ਰਾਹ ਨਹੀਂ ਦਿੱਸਦਾ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ ਮੁਖੁ = ਉਹ ਬੰਦਾ ਜਿਸ ਦਾ ਰੁਖ਼ ਆਪਣੇ ਮਨ ਵਲ ਹੈ, ਆਪ-ਹੁਦਰਾ ਬੰਦਾ। ਮੁਗਧੁ = ਮੂਰਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el egocéntrico que hace esto es un ciego e ignorante."