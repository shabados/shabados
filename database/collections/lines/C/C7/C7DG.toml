[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੀਨੇ ਹਸਤ ਪਾਵ; ਕਰਨ ਨੇਤ੍ਰ ਰਸਨਾ ॥"
page = 267
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who gave thee hands, feet, ears, eyes and tongue."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਤੈਨੂੰ ਹੱਥ, ਪੈਰ, ਕੰਨ ਅੱਖਾਂ ਅਤੇ ਜੀਭਾ ਬਖਸ਼ੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He gave you hands, feet, ears, eyes and tongue,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਵਾਹਿਗੁਰੂ ਨੇ ਤੁਝ ਕੌ ਹਾਥ, ਪੈਰ, ਕੰਨ, ਨੇਤ੍ਰ, ਰਸਨਾ ਆਦਿ ਇੰਦ੍ਰੇ ਦੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਨੇ) ਤੈਨੂੰ ਹੱਥ ਪੈਰ ਕੰਨ ਅੱਖਾਂ ਜੀਭ ਦਿੱਤੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਸਤ = ਹੱਥ। ਪਾਵ = ਪੈਰ। ਕਰਨ = ਕੰਨ। ਨੇਤ੍ਰ = ਅੱਖਾਂ। ਰਸਨਾ = ਜੀਭ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es por Su Gracia que has recibido cada uno de tus dones;"