[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜਿਉ ਜਾਲਿ ਪੰਖੇਰੂ ਫਾਸਦੇ; ਚੁਗਣ ਦੀ ਭੁਖੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "As the birds get entangled in the net out of their greed for seeds,"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜਿਕੂੰ ਪੰਛੀ ਜਾਲੀ ਵਿਖੇ ਦਾਣੇ ਚੁਗਣ ਦੀ ਤ੍ਰਿਸ਼ਨਾ ਨਾਲ ਜਾਂਦੇ ਹਨ।"