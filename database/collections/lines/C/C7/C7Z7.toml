type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਸਕਲ ਪਤਿਜੈ ॥੯੭੪॥"
page = 776

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying “Rainraat” add the word “Bhagaa”, then utter the words “Jaachar-pati-shatru” and know all the names of Tupak.974."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝੋ ॥੯੭੪॥"