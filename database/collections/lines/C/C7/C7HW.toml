[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰਭ ਕੋ ਨਾਮ ਨਿਤਿ ਉਠਿ ਕਹਿ ਹੌ ॥੫੧॥"
page = 954

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘I am better of a widow than a married woman like that; at least I could get up and prey the Almighty everyday.(51)(l)."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਨਿੱਤ ਉਠ ਕੇ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਜਪਾਂਗੀ ॥੫੧॥"