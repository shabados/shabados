[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਜਿ ਰਜਿ ਭੋਜਨੁ ਖਾਵਹੁ; ਮੇਰੇ ਭਾਈ ॥"
page = 807
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Eat to your fill and repletion O my brethren,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੁਸੀਂ ਰੱਜ-ਰੱਜ ਕੇ ਖਾਣਾ ਖਾਓ! ਹੇ ਮੇਰੇ ਭਰਾਵੋ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Eat to your fill, O my Siblings of Destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਭਾਈ! ਅਬ ਮਨਬਾਨੀ ਸੇ ਤ੍ਰਿਪਤਿ ਹੋ ਕਰ ਕੇ ਪਰਤਖ ਵਾ ਗਿਆਨ ਰੂਪੀ ਭੋਜਨ ਕੋ ਛਕੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਵੀਰ! (ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਿੰਦ ਦੀ ਖ਼ੁਰਾਕ ਹੈ, ਇਹ) ਖ਼ੁਰਾਕ ਰੱਜ ਰੱਜ ਕੇ ਖਾਇਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਜਿ = ਰੱਜ ਕੇ। ਭਾਈ = ਹੇ ਭਾਈ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Coman hasta saciarse, oh amigos"