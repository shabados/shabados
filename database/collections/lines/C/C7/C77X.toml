[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਗੁਰਮੁਖਿ; ਤਰੀ ਤਿਨਿ ਮਾਇਆ ॥੪॥"
page = 385
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Nanak, crosses the mammon s ocean through Guru s instruction."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਰਾਹੀਂ, ਮਾਇਆ ਦੇ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਉਤਰ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Gurmukh crosses over the ocean of Maya. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਗੁਰਮੁਖਿ ਨੇ ਮਾਯਾ ਰੂਪ ਨਦੀ ਤਰੀ ਹੈ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਆਖ-) ਉਸ ਨੇ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਮਾਇਆ (ਦੀ ਸ਼ੂਕਦੀ ਨਦੀ) ਪਾਰ ਕਰ ਲਈ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ। ਤਿਨਿ = ਉਸ ਨੇ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y a través del Shabd de la Palabra del Guru cruzar el mar de la dualidad. (4)"