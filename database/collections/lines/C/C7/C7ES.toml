[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਬਿਸਰਤ; ਸਹਸਾ ਦੁਖੁ ਬਿਆਪੈ ॥"
page = 190
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By forgetting God, superstition and sorrow overtake the mortal."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਨੂੰ ਭੁਲਾਉਣ ਕਰਕੇ ਸ਼ੱਕ-ਸੰਦੇਹ ਤੇ ਗ਼ਮ ਪ੍ਰਾਣੀ ਨੂੰ ਆ ਪਕੜਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forgetting the Lord, superstition and sorrow shall overtake you."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹਰੀ ਕੇ ਬਿਸਰਨੇ ਕਰ ਸੰਸਾ ਔਰ ਦੁਖ ਵਯਾਪਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਨੂੰ ਭੁਲਾਇਆਂ (ਦੁਨੀਆ ਦਾ) ਸਹਮ-ਦੁੱਖ (ਆਪਣਾ) ਜ਼ੋਰ ਪਾ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਸਾ = ਸਹਮ। ਬਿਆਪੈ = ਜ਼ੋਰ ਪਾਈ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Olvidándose de Él, uno vacila en la duda, pero meditando en Él,"