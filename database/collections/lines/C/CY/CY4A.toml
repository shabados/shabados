data = "ਗਿਰਯੋ ਆਯੁਧੰ ਸਾਯੁਧੰ ਬੀਰ ਖੇਤੰ ॥"
page = 160

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors began to fall in the battlefield alongwith their weapons, and"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਈ) ਵੀਰ ਯੋਧੇ ਅਸਤ੍ਰਾਂ ਸ਼ਸਤ੍ਰਾਂ ਸਮੇਤ ਯੁੱਧ-ਭੂਮੀ ਵਿਚ ਡਿਗਣ ਲਗ ਗਏ ਸਨ।"