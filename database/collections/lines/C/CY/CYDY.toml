[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਨ. ਨ ਦੀਸੈ ਕੋਈ ॥"
page = 886
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I see not any other."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਹੋਰ ਕੋਈ ਨਹੀਂ ਦਿਸਦਾ (ਉਸ ਤੋਂ ਸਿਵਾ)।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I do not see any other at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਤੇ ਬਿਨਾ ਹੋਰ ਕੋਈ ਭੀ ਨਹੀਂ ਦੇਖੀਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਤੇ ਭੀ) ਉਸ ਤੋਂ ਬਿਨਾ ਕੋਈ ਦੂਜਾ ਨਹੀਂ ਦਿੱਸਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਨ = {अन्य} ਦੂਜਾ ਹੋਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, no veo a nadie más que a Dios."