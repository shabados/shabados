[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧ ਕੀ ਮਹਿਮਾ; ਬੇਦ ਨ ਜਾਨਹਿ ॥"
page = 272
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Vedas know not the praise of the holy men."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵੇਦ ਨੇਕ ਹਸਤੀਆਂ ਦੀ ਕੀਰਤੀ ਨੂੰ ਨਹੀਂ ਜਾਣਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The glory of the Holy people is not known to the Vedas."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਕੀ ਮਹਿਮਾਂ ਬੇਦ ਅਥਵਾ ਬੇਦ ਬਕਤਾ ਵਾ ਸ੍ਰੋਤਾ ਭੀ ਨਹੀਂ ਜਾਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਦੀ ਵਡਿਆਈ ਵੇਦ (ਭੀ) ਨਹੀਂ ਜਾਣਦੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਹਿਮਾ = ਵਡਿਆਈ। ਨ ਜਾਨਹਿ = ਨਹੀਂ ਜਾਣਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Gloria de las personas Santas no es entendido ni en los Vedas,"