data = "(ਜਿਸ ਨੇ) ਸਮੁੰਦਰ ਅਤੇ ਵਿੰਧਿਆਚਲ, ਸੁਮੇਰ ਪਰਬਤਾਂ ਨੂੰ ਬਣਾਇਆ ਹੈ,"