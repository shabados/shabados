[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਸਮਝ ਸੁਜਾਨ ॥੧੧੧੯॥"
page = 789

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Kaami” and adding the word “ari” at the end, O wise men! the names of Tupak are formed.1119."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਨਾਮ ਤੁਪਕ ਦਾ ਹੋਵੇਗਾ, ਸੁਜਾਨ ਸਮਝ ਲੈਣ ॥੧੧੧੯॥"