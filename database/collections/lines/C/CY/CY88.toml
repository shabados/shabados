[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੌਕੀ ਹੁਤੀ ਤਹਾ ਚਲਿ ਆਯੋ ॥"
page = 878

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The lover left the place without the maid and reached where the watchmen were posted."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਥੇ ਆ ਪਹੁੰਚਿਆ ਜਿਥੇ (ਪਹਿਰੇਦਾਰਾਂ ਦੀ) ਚੌਕੀ ਸੀ।"