[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਰਗਹ ਕਬ ਹੀ, ਨ ਪਾਵੈ ਮਾਨੁ ॥"
page = 1066
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the Lord's court, he attains not honour, ever."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਦਰਬਾਰ ਅੰਦਰ, ਉਸ ਨੂੰ ਕਦੇ ਭੀ ਇੱਜ਼ਤ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Court of the Lord, they are never honored."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਦਰਗਾਹ ਮੇਂ ਕਬੀ ਮਾਨ ਕੋ ਨਹੀਂ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਉਹ ਪਰਮਾਤਮਾ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਕਦੇ ਭੀ ਆਦਰ ਨਹੀਂ ਪਾਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਨੁ = ਆਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ése ser vive apegado al otro,"