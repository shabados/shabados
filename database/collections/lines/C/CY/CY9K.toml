[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਭਜੇ ਲਖਿ ਆਹਵ ਕਉ; ਇਕ ਘਾਇਲ, ਘਾਇਲ ਕੋ ਲਲਕਾਰੈ ॥"
page = 477

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many of them have fled away, seeing the ferocity of war"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਯੁੱਧ-ਭੂਮੀ ਨੂੰ ਵੇਖ ਕੇ ਭਜ ਗਏ ਹਨ ਅਤੇ ਇਕ ਘਾਇਲ ਘਾਇਲਾਂ ਨੂੰ ਲਲਕਾਰ ਰਹੇ ਹਨ।"