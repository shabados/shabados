[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੂਸਰ ਬਯਾਹ ਬਧੂ ਅਬ ਹੀ; ਮਨ ਤੇ ਮੁਹਿ ਨਾਥ ਬਿਸਾਰ ਡਰੈਂਗੇ ॥"
page = 215

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "If he thinks another marriage in his mind, then her Lord on forgetting her, will fill her life definitely with unrest."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੇ ਕਰ ਹੁਣੇ ਹੀ (ਇਨ੍ਹਾਂ ਨੇ) ਦੂਜੀ ਇਸਤਰੀ ਵਿਆਹ ਲਈ, (ਤਾਂ) ਸੁਆਮੀ ਜੀ ਮੈਨੂੰ (ਜ਼ਰੂਰ ਹੀ) ਮਨ ਤੋਂ ਭੁੱਲਾ ਦੇਣਗੇ।"