[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਲ ਬਿਨਾ; ਕੈਸੇ ਬਜੈ ਰਬਾਬ ॥"
page = 1140
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How can a rebeck be played without the strings?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਰਾਂ ਦੇ ਬਞੈਰ ਸਰੰਦਾ ਕਿਸ ਤਰ੍ਹਾਂ ਵੱਜ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without strings, how is a guitar to be played?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਜੀਲ) ਰਬਾਬ ਕੀ ਏਕ ਤਾਰ ਹੋਤੀ ਹੈ। ਤਿਸ ਸੇ ਬਿਨਾਂ ਰਬਾਬ ਕੈਸੇ ਬਜੇ, ਭਾਵ ਨਹੀਂ ਬਾਜਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੰਦੀ ਤੋਂ ਬਿਨਾ ਰਬਾਬ ਨਹੀਂ ਵੱਜ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਲ = ਤੰਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿cómo podría uno vivir en la satisfacción sin el Naam, el Nombre del Señor?"