[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਿ ਤਨਿ ਨਿਰਮਲ; ਅਭਿਮਾਨ ਅਭੇਵਾ ॥੬॥"
page = 906
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "his mind and body become immaculate and his self-conceit is obliterated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਆਤਮਾਂ ਅਤੇ ਦੇਹ ਪਵਿੱਤਰ ਹੋ ਜਾਂਦੇ ਹਨ ਅਤੇ ਉਸ ਦੀ ਸਵੈ-ਹੰਗਤਾ ਨਾਸ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- his mind and body become immaculate, and his egotistical pride is obliterated. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਮਨ ਤਨ ਕਰ ਕੇ ਨਿਰਮਲ ਹੈਂ ਔ ਅਭਿਮਾਨ ਸੇ (ਅਭੇਵਾ) ਅਭਿਜ ਰਹਿਤੇ ਹੈਂ, ਵਾ ਅਭੇਦ ਸ੍ਵਰੂਪ ਪ੍ਰਮੇਸਰ ਕੋ (ਅਭਿ) ਰਿਦੇ ਮੇਂ ਮਾਨਤੇ ਹੈਂ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਦੇ ਮਨ ਵਿਚ ਉਹਨਾਂ ਦੇ ਸਰੀਰ ਵਿਚ (ਭਾਵ, ਇੰਦ੍ਰਿਆਂ ਵਿਚ) ਪਵਿਤ੍ਰਤਾ ਆ ਜਾਂਦੀ ਹੈ, ਉਹਨਾਂ ਦੇ ਅੰਦਰ ਅਹੰਕਾਰ ਦਾ ਅਭਾਵ ਹੋ ਜਾਂਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਭਿਮਾਨ ਅਭੇਵਾ = ਅਭਿਮਾਨ ਦਾ ਅਭਾਵ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el cuerpo y la mente se vuelven Inmaculados y el ego desaparece. (6)"