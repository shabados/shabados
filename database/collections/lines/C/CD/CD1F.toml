type = "primary"
data = "ਭਾਤਿ ਭਾਤਿ ਦੀਨਨ ਸਨਮਾਨਾ ॥"
page = 626

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "By honouring various types of the lowly, he gave horses and elephants in charity"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਭਾਂਤ ਭਾਂਤ ਦਾ ਦੀਨਾਂ ਦੁਖੀਆਂ ਦਾ ਸਨਮਾਨ ਕੀਤਾ।"