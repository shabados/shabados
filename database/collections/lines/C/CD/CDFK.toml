[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਾਵਤ ਮਨੂਆ; ਆਵੈ ਠਾਇ ॥"
page = 236
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and the wandering mind is held."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਭਟਕਦਾ ਹੋਇਆ ਮਨ ਟਿਕ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and the wandering mind is held steady."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਧਾਵਤਾ ਹੈ, ਜੋ ਮਨ ਸੋ (ਆਵੈ ਠਾਇ) ਅਰਥਾਤ ਇਸਥਿਤ ਪਾਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਿਕਾਰਾਂ ਵਲ ਦੌੜਦਾ ਮਨ ਟਿਕਾਣੇ ਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਾਵਤ = ਵਿਕਾਰਾਂ ਵਲ ਦੌੜਦਾ। ਠਾਇ = ਥਾਂ ਸਿਰ, ਟਿਕਾਣੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y tu mente delirante es contenida."