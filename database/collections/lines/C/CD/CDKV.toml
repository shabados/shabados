[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦੇ ਸ਼ੌਕ ਦਾ ਇੱਕ ਕਿਣਕਾ ਉਸ ਦੇ ਦਿਲ ਵਿਚ ਵੱਸ ਗਿਆ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਜ਼ੱਰਾ ਅਜ਼ ਸ਼ੌਕ ਜਾ ਦਰ ਦਿਲ ਗ੍ਰਿਫ਼ਤ ॥੩੩੩॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "He is the pearl of the ocean of blessings and generosity,"