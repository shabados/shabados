[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਮੁਖ ਆਸ ਫਿਰਿ ਭਿਛਕ ਨ ਆਵਾ ॥"
page = 623

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Whosoever asked for anything, he obtained it and no beggar returned without the fulfillment of his wish"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਭਿਖਾਰੀ ਵੀ ਇੱਛਾ ਪੂਰੀ ਕੀਤੇ ਬਿਨਾ ਫਿਰਦਾ ਨਹੀਂ ਸੀ (ਅਰਥਾਤ-ਜੋ ਕੁਝ ਮੰਗਦਾ, ਉਹੀ ਕੁਝ ਉਸ ਨੂੰ ਮਿਲ ਜਾਂਦਾ)।"