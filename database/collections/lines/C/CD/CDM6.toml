[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਣ ਅਵਗੁਣ, ਗਤਿ ਆਖਿ ਵਖਾਣੀ ॥੧॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "We have here exposed the position of merits and demerits."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਣਾਂ ਅਤੇ ਅਵਗੁਣਾਂ ਦੀ ਗਤੀ (ਅਸਾਂ ਉਪਰ) ਕਹਿਕੇ ਵਰਣਨ ਕਰ ਦਿੱਤੀ ਹੈ।"