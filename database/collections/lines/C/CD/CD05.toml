[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਰਸੁ ਪੀਆ ਰੇ ॥"
page = 337
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lord's elixir I have quaffed,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦਾ ਅੰਮ੍ਰਿਤ ਮੈਂ ਪਾਨ ਕੀਤਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I drink in the sublime essence of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਰਾਮ ਨਾਮ ਰਸ ਪੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਗੁਰਮੁਖ) ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਰਸ ਪੀਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇ = ਹੇ ਭਾਈ! ਪੀਆ = ਪੀਤਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Prueba entonces la Esencia de tu Señor,"