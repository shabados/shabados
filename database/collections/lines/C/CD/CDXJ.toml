[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖ ਭਰਮੈ; ਸਹਸਾ ਹੋਵੈ ॥"
page = 646
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Engrossed in doubt, the self willed wanders about."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਦੇਹ ਅੰਦਰ ਖੱਚਤ ਹੋਇਆ ਹੋਇਆ ਮਨਮੱਤੀਆ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The self-willed manmukh remains deluded by his doubts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ ਭ੍ਰਮ ਮੇਂ ਭ੍ਰਮਤੇ ਹੈਂ, ਕਿਉਂਕਿ ਤਿਨ ਕੇ ਅੰਤਰ ਸੰਸਾ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ ਭਟਕਦਾ ਹੈ, ਕਿਉਂਕਿ ਉਸ ਨੂੰ ਸਦਾ ਤੌਖ਼ਲਾ ਰਹਿੰਦਾ ਹੈ;"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Manmukjs habitan en la duda,  engañados por la ilusión;"