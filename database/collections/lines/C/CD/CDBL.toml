[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਪਾਸਿ ਕੇ ਹੋਤ ਹੈ; ਚੀਨ ਲੇਹੁ ਮਤਿਵੰਤ ॥੩੭੪॥"
page = 734

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The name of Paash becomes by uttering primarily “Baardhar” and then saying “Ishraastra”, O wise men! know like this.374."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਤਰ੍ਹਾਂ) ਪਾਸ ਦੇ ਨਾਮ ਬਣਦੇ ਹਨ। ਬੁੱਧੀਮਾਨ ਸਮਝ ਲੈਣ ॥੩੭੪॥"