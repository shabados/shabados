[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ; ਜਨਿ ਲਹੇ ਹਾਂ ॥"
page = 411
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The slaves, who attain to Lord God, they"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੋਲੇ ਜੋ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਨੂੰ ਪਰਾਪਤ ਹੁੰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But those humble beings, who attach themselves to the Lord, Har, Har,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਹਰਿ ਹਰਿ ਨਾਮ ਲਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਜਿਸ ਮਨੁੱਖ ਨੇ ਪਰਮਾਤਮਾ ਨੂੰ ਲੱਭ ਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨਿ = ਜਨ ਨੇ, ਜਿਸ ਜਿਸ ਜਨ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero aquellos Seres humildes que se aferran al Señor, Jar, Jar"