[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਕੋ ਮੂੜੁ; ਨਹੀ ਕੋ ਸਿਆਨਾ ॥"
page = 914
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "None is foolish, nor is any one wise,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਂ ਹੀ ਕੋਈ ਮੂਰਖ ਹੈ, ਨਾਂ ਹੀ ਕੋਈ ਅਕਲਮੰਦ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one is foolish, and no one is wise."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਆਪ ਕਰਿਕੇ ਨਾ ਕੋਈ ਮੂਰਖ ਹੈ ਔ ਨਾ ਕੋਈ ਚਤੁਰ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਹ ਕੋਈ ਜੀਵ ਮੂਰਖ ਹੈ, ਨਾਹ ਕੋਈ ਸਿਆਣਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋ = ਕੋਈ ਮਨੁੱਖ। ਮੂੜੁ = ਮੂਰਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ante Ti nadie es ni sabio ni tonto;"