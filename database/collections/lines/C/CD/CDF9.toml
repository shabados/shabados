[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬੇਦ ਬ︀ਯਾਸ ਅਰੁ ਬੇਦ ਤ੍ਰਿਯ ਭੇਦ ਸਕੇ ਨਹਿ ਪਾਇ ॥੧੫॥"
page = 985

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sage Viyas, and them all, could not fathom the females.(15)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵੇਦ ਵਿਆਸ ਅਤੇ ਵੇਦ ਕੋਈ ਵੀ ਇਸਤਰੀ ਦੇ ਭੇਦ ਨੂੰ ਪ੍ਰਾਪਤ ਨਹੀਂ ਕਰ ਸਕਿਆ ॥੧੫॥"