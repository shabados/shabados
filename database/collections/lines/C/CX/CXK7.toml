[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਹੁ ਅੰਤੁ; ਨ ਜਾਣੈ ਕੋਇ ॥"
page = 5
line = 9

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਉਹਦਾ ਅੰਤ ਇਹ ਹੈ ਕਿ ਉਹਦਾ ਅੰਤ ਕੋਈ ਨਹੀਂ ਜਾਣ ਸਕਦਾ।"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This limit none can know."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਪਾਰਾਵਾਰ ਕੋਈ ਨਹੀਂ ਜਾਣ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one can know these limits."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹੋ ਹੀ ਅੰਤੁ ਹੈ ਐਸੇ ਕੋਈ ਨਹੀਂ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅਕਾਲ ਪੁਰਖ ਦੇ ਗੁਣਾਂ ਦਾ) ਇਹ ਹੱਦ-ਬੰਨਾ (ਜਿਸ ਦੀ ਬੇਅੰਤ ਜੀਵ ਭਾਲ ਕਰ ਰਹੇ ਹਨ) ਕੋਈ ਮਨੁੱਖ ਨਹੀਂ ਪਾ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਹੁ ਅੰਤ = ਇਹ ਹੱਦ-ਬੰਨਾ (ਜਿਸ ਦੀ ਭਾਲ ਬੇਅੰਤ ਜੀਵ ਕਰਦੇ ਹਨ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nadie conoce de sus limites."