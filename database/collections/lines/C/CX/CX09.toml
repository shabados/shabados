[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੌਲਵੀ # ਇਹ ਸਭ ਉਨ੍ਹਾਣ ਦੀ ਹੀ ਤਾਰੀਫ਼ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਈਣ ਹਮਾ ਤਾਰੀਫ਼ਿ ਸ਼ਾਣ ਐ ਮੌਲਵੀਸਤ ॥੧੫੨॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "The strong and powerful angel of death was subservient to him, and the chief of gods of maintaining the accounts of each and every person was under his supervision."