[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਉ ਜਾਚਉ; ਤਉ ਕੇਵਲ ਰਾਮ ॥"
page = 1162
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When I beg, then beg I only the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਮੈਂ ਮੰਗਦਾ ਹਾਂ, ਤਾਂ ਸਿਰਫ ਸਾਂਹੀ ਦਾ ਨਾਮ ਹੀ ਮੰਗਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When I beg, I beg only from the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਮ! ਜੋ ਮਾਂਗਤਾ ਹੂੰ ਤੋ ਕੇਵਲ ਤੇਰੇ ਕੋ ਹੀ ਮਾਂਗਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਜਦੋਂ ਭੀ ਮੰਗਦਾ ਹਾਂ, ਸਿਰਫ਼ ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੋਂ ਮੰਗਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਉ = ਜਦੋਂ। ਜਾਚਉ = ਜਾਚਉਂ, ਮੈਂ ਮੰਗਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, sólo Él es el Dador, sólo Él es mi Dios,"