[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੇ ਜਿਹਵੇ; ਤੂੰ ਰਾਮ ਗੁਣ ਗਾਉ ॥"
page = 180
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O tongue, sing thou the praises of the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੀਭੈ! ਤੂੰ ਸਾਹਿਬ ਦਾ ਜੱਸ ਗਾਇਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O tongue, sing the Glorious Praises of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਜਿਹਵੇ! ਤੂੰ ਰਾਮ ਕੇ ਗੁਣ ਗਾਇਨ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੀ) ਜੀਭ! ਤੂੰ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾ, ਪਲ ਪਲ ਹਰ ਵੇਲੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੇ ਜਿਹਵੇ = ਹੇ ਜੀਭ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mis labios, reciten la Alabanza del Señor,"