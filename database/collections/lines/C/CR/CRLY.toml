[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਲਿਜੁਗ ਰਹਿਆ ਪੈਰ ਇਕੁ; ਹੋਇ ਨਿਮਾਣਾ ਧਰਮ ਅਧੀਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In Kaliyug, the dharma has only one feet and consequently has become quite feeble."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਲਜੁਗ ਵਿਖੇ ਇਕੋ ਪੈਰ ਰਹਿ ਗਿਆ, ਧਰਮ ਨਿਮਾਣਾ ਹੋਕੇ ਅਧੀਨ ਹੋ ਗਿਆ।"