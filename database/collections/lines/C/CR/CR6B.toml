[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਲੰਕ ਬਿਭ੍ਰਮਾਦਿ ਅਉ ਕ੍ਰਿਤਘਨ ਤਾਹਿ ਕੌ ਹਨ︀ਯੋ ॥"
page = 706

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Kalank, Vibharam and Kritghanta etc. were killed"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਲੰਕ, ਬਿਭ੍ਰਮ ਅਤੇ ਕ੍ਰਿਤਘਨਤਾ ਆਦਿ ਨੂੰ ਮਾਰ ਦਿੱਤਾ ਹੈ।"