[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਂ ਤੁਧੁ ਭਾਵੈ; ਤਾ ਦੁਰਮਤਿ ਜਾਇ ॥"
page = 354
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When Thou willest then evil-intellect is eliminated,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਤੈਨੂੰ ਚੰਗਾ ਲਗਦਾ ਹੈ, ਤਦ, ਮੰਦੀ ਅਕਲ ਦੂਰ ਹੋ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When it pleases You, evil-mindedness departs,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਤੁਝ ਕੋ ਭਾਵੈ ਤੋ ਦੁਰਮਤਿ ਦੂਰ ਹੋ ਜਾਇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਤੇਰੀ ਰਜ਼ਾ ਹੋਵੇ ਤਦੋਂ ਹੀ ਮੇਰੀ ਭੈੜੀ ਮਤਿ ਦੂਰ ਹੋ ਸਕਦੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando así Tú lo deseas, mi naturaleza malvada desaparece"