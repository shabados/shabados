[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਾਟਿ; ਨ ਕਿਨ ਹੀ ਕਹਾਇਆ ॥"
page = 71
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "None calls himself deficient."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਭੀ ਆਪਣੇ ਆਪ ਨੂੰ ਘੱਟ ਨਹੀਂ ਆਖਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Of these, no one admits to any deficiency;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵ ਇਨ ਸਭਨੋਂ ਮੇਂ ਆਪ ਕੋ ਕਿਸੀ ਨੇ (ਘਾਟ) ਕਮ ਨਹੀਂ ਕਹਾਯਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹਨਾਂ ਵਿਚੋਂ) ਕਿਸੇ ਨੇ ਭੀ ਆਪਣੇ ਆਪ ਨੂੰ (ਕਿਸੇ ਹੋਰ ਨਾਲੋਂ) ਘੱਟ ਨਹੀਂ ਅਖਵਾਇਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਾਟਿ = ਘੱਟ, ਮਾੜਾ। ਕਿਨ ਹੀ = ਕਿਨਿ ਹੀ, ਕਿਸੇ ਨੇ ਭੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nadie dice que uno es menos que el otro,"