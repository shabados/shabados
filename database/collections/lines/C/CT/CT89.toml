[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖ ਭੂਲੇ; ਲੋਕ ਸਬਾਏ ॥"
page = 117
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The wayward persons are all gone astray."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪ-ਹੁਦਰੇ ਪੁਰਸ਼ ਸਭ ਕੁਰਾਹੇ ਪਏ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The self-willed manmukhs have all gone astray."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ ਲੋਕ ਸਭ ਭੂਲੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ ਮਨੁੱਖ ਸਾਰੇ ਹੀ ਕੁਰਾਹੇ ਪਏ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਬਾਏ = ਸਾਰੇ। ਜਾਇ = ਜਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los arrogantes Manmukjs no se dan cuenta de esto."