[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਆ ਦੀਨੁ; ਕਰੇ ਅਰਦਾਸਿ ॥"
page = 1304
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What supplication I, the poor one, can make,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਗਰੀਬੜਾ ਕੀ ਬੇਨਤੀ ਕਰ ਸਕਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am meek and poor - what prayer can I offer?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਦੀਨ ਜਨ ਕਿਆ ਬੇਨਤੀ ਕਰੇ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੀ ਪ੍ਰੇਰਨਾ ਤੋਂ ਬਿਨਾ) ਵਿਚਾਰਾ ਜੀਵ ਕੋਈ ਅਰਦਾਸ ਭੀ ਨਹੀਂ ਕਰ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੀਨੁ = ਨਿਮਾਣਾ, ਗਰੀਬ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Soy débil y pobre ¿qué oración te podría ofrecer?"