[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੈਸੇ ਕੈ ਆਜੁ ਹਨੋ ਇਹ ਕੋ, ਜੁ ਹੈ ਰਾਵ ਬਡੋ ਅਰੁ ਸੁੰਦਰ ਸੂਰੋ ॥੨੫॥"
page = 1002

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘He is brave and handsome Raja, how can he be annihilated.’(25)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਮੈਂ) ਅਜ ਇਸ ਨੂੰ ਕਿਵੇਂ ਮਾਰ ਦਿਆਂ, ਇਹ ਬਹੁਤ ਸੁੰਦਰ ਰਾਜਾ ਅਤੇ ਸੂਰਮਾ ਹੈ ॥੨੫॥"