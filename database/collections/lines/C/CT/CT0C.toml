[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਚੰਤੀ; ਗੋਪੀ ਜੰਨਾ ॥"
page = 693
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The women and men dance alike."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਰੀ ਅਤੇ ਮਰਦ ਇੱਕ ਸਾਰ ਨੱਚਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Women and men both dance."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਸਤਾ ਕੋ ਪਾਇ ਕਰ ਕੇ ਸਰਬ ਜਨੋਂ ਕੀਆਂ ਇੰਦ੍ਰੀਆਂ ਚੇਸਟਾ ਕਰ ਰਹੀਆਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸਤ੍ਰੀਆਂ ਮਰਦ ਸਭ ਨੱਚ ਰਹੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੋਪੀ ਜੰਨਾ = ਇਸਤ੍ਰੀਆਂ ਅਤੇ ਮਰਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los hombres bailan"