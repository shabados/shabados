data = "ਚਮਕ ਪਰੀ ਅਬਲਾ ਤਬੈ; ਪ੍ਰੀਤਿ ਪਿਯਾ ਕੇ ਸੰਗ ॥"
page = 1014

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Dreaming about her infatuation with her lover, she abruptly got up."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਉਸ ਅਬਲਾ ਦਾ ਪ੍ਰੀਤਮ ਨਾਲ ਪ੍ਰੇਮ ਭੜਕ ਪਿਆ।"