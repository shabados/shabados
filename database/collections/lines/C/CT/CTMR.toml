[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਊਪਰਿ ਸਮਰਥ ਪ੍ਰਭ; ਪੂਰਨ ਗੁਣਤਾਸ ॥੧॥"
page = 812
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lord, the Perfect Treasure of virtues is powerful over all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਪੂਰਨ ਨੇਕੀਆਂ ਦਾ ਖਜਾਨਾ ਸਾਹਿਬ ਸਾਰਿਆਂ ਉਪਰ ਬਲੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is All-powerful, above all; He is the perfect treasure of virtue. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ (ਪ੍ਰਭ) ਸੁਆਮੀ ਸਰਬ ਕੇ ਊਪਰ ਹੈ ਅਰੁ ਸਮਰਥ ਔਰ ਸਰਬ ਮੇਂ ਪਰੀ ਪੂਰਣ ਗੁਣੋਂ ਕਾ (ਤਾਸ) ਪਾਤ੍ਰ, ਭਾਵ ਸਮੁੰਦ੍ਰ ਰੂਪ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹਨਾਂ ਨੂੰ ਨਿਸ਼ਚਾ ਰਹਿੰਦਾ ਹੈ ਕਿ) ਪ੍ਰਭੂ ਸਭ ਜੀਵਾਂ ਉਤੇ ਤਾਕਤ ਰੱਖਣ ਵਾਲਾ ਹੈ, ਸਭ ਤਾਕਤਾਂ ਨਾਲ ਭਰਪੂਰ ਹੈ, ਸਭ ਗੁਣਾਂ ਦਾ ਖ਼ਜ਼ਾਨਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਮਰਥ = ਤਾਕਤ ਰੱਖਣ ਵਾਲਾ। ਗੁਣ ਤਾਸ = ਗੁਣਾਂ ਦਾ ਖ਼ਜ਼ਾਨਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues mi Señor es el Tesoro Perfecto de Virtud y el Todopoderoso. (1)"