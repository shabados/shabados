[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਵਾਹ# ਕਿਤਨਾ ਮੁਬਾਰਕ ਹੈ ਉਹ ਬੋਲ ਜੋ ਉਸ ਵਾਹਿਗੁਰੂ ਦਾ ਮਹਿਰਮ ਬਣਾਣਦਾ ਹੈ । "

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਐ ਜ਼ਹੇ ਕਾਲ ਮੁਬਾਰਿਕ ਕਿ ਕੁਨਦ ਸਾਹਿਬਿ ਹਾਲ ॥੫੨॥੬॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "A human being deserves to be called a human being only if he directs himself towards meditation;"