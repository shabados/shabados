[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਯਹ ਮਾਲਾ ਅਪਨੀ ਲੀਜੈ ॥"
page = 656
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Take back this rosary of Thine, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਆਪਣੀ ਸਿਮਰਨੀ ਵਾਪਸ ਲੈ ਲੈ, ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Here, Lord, take back Your mala."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਇਹ (ਮਾ) ਮਾਯਾ ਜੋ ਮੇਰੇ ਸਾਥ ਅਪਨੇ (ਲਾ) ਲਗਾਈ ਹੈ, ਤਿਸ ਅਪਨੀ ਮਾਯਾ ਕੋ ਆਪ ਖੈਂਚ ਲੀਜੀਏਗਾ, ਭਾਵ ਤਬ ਮੇਰੇ ਸੇ ਆਪ ਕੀ ਭਗਤੀ ਹੋਗੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਇਹ ਆਪਣੀ ਮਾਲਾ ਮੈਥੋਂ ਲੈ ਲਉ। (ਪ੍ਰਭੂ! ਇੱਕ ਤਾਂ ਮੈਨੂੰ ਰੋਟੀ ਵਲੋਂ ਬੇ-ਫ਼ਿਕਰ ਕਰ, ਦੂਜੇ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਯਹ = ਇਹ। ਲੀਜੈ = ਕਿਰਪਾ ਕਰ ਕੇ ਲੈ ਲਉ। ਯਹ.........ਲੀਜੈ = ਹੇ ਪ੍ਰਭੂ! ਇਹ ਆਪਣੀ ਮਾਲਾ ਮੈਥੋਂ ਲੈ ਲਉ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aquí te entrego de regreso mi rosario."