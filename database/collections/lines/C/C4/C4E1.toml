data = "ਅਰੁਨ ਬਸਤ੍ਰ ਤਨ ਮਹਿ ਧਰੇ; ਇਮਿ ਅਬਲਾ ਦੁਤਿ ਦੇਹਿ ॥"
page = 865

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The ladies in their red clothes were looking so attractive,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਇਸਤਰੀਆਂ ਨੇ ਸ਼ਰੀਰ ਉਤੇ ਲਾਲ ਬਸਤ੍ਰ ਧਾਰਨ ਕੀਤੇ ਹੋਏ ਸਨ ਅਤੇ ਇਸ ਤਰ੍ਹਾਂ ਚਮਕ ਰਹੀਆਂ ਸਨ"