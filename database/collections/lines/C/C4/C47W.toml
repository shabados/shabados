[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਸਕਲ ਤੁਪਕ ਕੇ ਨਾਮ; ਸੁਕਬਿ ਬਿਚਾਰੀਐ ॥੭੯੩॥"
page = 759

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Utter firstly the word “Jalraashinani”, then say the words “Jaa-char-nayak-shatru”  in this way consider all the names of Tupak.793."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਸਾਰਾ ਤੁਪਕ ਦਾ ਨਾਮ ਬਣਦਾ ਹੈ, ਕਵੀ ਲੋਗ ਵਿਚਾਰ ਲੈਣ ॥੭੯੩॥"