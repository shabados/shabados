[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਮ; ਸੰਤ ਜਨਾਂ ਰੇਨਾਰਾ ॥"
page = 623
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am the dust of the feet of the pious persons."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਪਵਿੱਤਰ ਪੁਰਸ਼ਾਂ ਦੇ ਪੈਰਾਂ ਦੀ ਧੂੜ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am the dust of the feet of the Holy people."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਹਮ ਸੰਤ ਜਨੋਂ ਕੇ ਚਰਨੋਂ ਕੀ ਧੂਰ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤਾਂ ਸੰਤ ਜਨਾਂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ਬਣਿਆ ਰਹਿੰਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਮ = ਅਸੀ, ਮੈਂ। ਰੇਨਾਰਾ = ਰੇਣ, ਚਰਨ-ਧੂੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y me he vuelto humilde como el Polvo que pisan los Pies de los Santos."