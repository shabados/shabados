[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹੋਇ ਸੁਚੇਤ ਅਚੇਤ ਇਵ; ਅਖੀਂ ਹੋਂਦੀ ਅੰਨ੍ਹਾ ਹੋਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The jiv though consciousness incarnate is so much unconscious (of his aim in life) as if he is blind though having the eyes;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਮਝਦਾਰ ਹੋਕੇ 'ਅਚੇਤ' (ਭੋਲਾ ਭਾਲਾ ਅਰ) ਅੱਖਾਂ ਦੇ ਹੁੰਦਿਆਂ ਸੁੰਦਿਆਂ ਅੰਨ੍ਹਾਂ ਹੋ ਰਿਹਾ ਹੈ।"