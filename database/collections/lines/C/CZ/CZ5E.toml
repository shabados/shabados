[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਯ ਦੀਨ ਸੁਰੇਸ ਨਰੇਸ ਜਥਾ ॥੧੭॥"
page = 201

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "How the king co-operated for the victory of Indra, the king of gods, this story has been told in the drama.17."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਦਸ਼ਰਥ ਰਾਜੇ ਨੇ ਇੰਦਰ ਨੂੰ (ਦੈਂਤਾਂ ਤੋਂ) ਜਿੱਤ ਕੇ ਦਿੱਤੀ ਸੀ ॥੧੭॥"