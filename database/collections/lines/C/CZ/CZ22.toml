data = "ਸੁੰਦਰ ਪ੍ਰਭਾ ਵਾਲੀ ਸਿੰਧੁਰੀ, ਸੁੰਦਰ ਭ੍ਰਮਣ ਕਰਨ ਵਾਲੀ, ਡਾਕਣੀ,"