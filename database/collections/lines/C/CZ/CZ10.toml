[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੁ ਖਜੀਨਾ ਸਾਚਾ ਸਾਹੀ ॥"
page = 1073
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is the treasure of the true Banker."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚਾ ਹੈ ਖ਼ਜਾਨਾ ਸੱਚੇ ਸ਼ਾਹੂਕਾਰ ਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True is the treasure of the True Banker."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚਾ ਖਜਾਨਾ ਸੰਤੋਂ ਕੇ ਰਿਦੇ ਔਰ ਵਹ ਸਚਾ ਸਚੀ ਹੀ (ਸਾਹੀ) ਬਿਭੂਤੀ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਖ਼ਜ਼ਾਨਾ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਹੈ, ਉਸ ਦੀ ਪਾਤਿਸ਼ਾਹੀ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖਜੀਨਾ = ਖ਼ਜ਼ਾਨਾ। ਸਾਹੀ = ਸ਼ਾਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, Verdad es Su Tesoro."