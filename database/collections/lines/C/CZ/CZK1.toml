[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਹੇ ਭਈਆ; ਫਿਰਤੌ ਫੂਲਿਆ ਫੂਲਿਆ ॥"
page = 654
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why O brother, goest about thou, puffed up and in pride?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਕਿਉਂ ਹੇ ਭਰਾ! ਆਕੜਿਆਂ ਤੇ ਫੁੰਕਾਰੇ ਮਾਰਦਾ ਫਿਰਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Why, O Siblings of Destiny, do you strut around, all puffed up with pride?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤੂੰ ਝੂਠੇ ਪਦਾਰਥੋਂ ਕੋ ਦੇਖ ਕਰ ਕਿਉਂ ਪ੍ਰਫੁਲ੍ਯਤ ਹੂਆ ਫਿਰਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤੂੰ ਕਿਸ ਗੱਲੇ ਹੰਕਾਰ ਵਿਚ ਆਫਰਿਆ ਫਿਰਦਾ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫੂਲਿਆ ਫੂਲਿਆ = ਹੰਕਾਰ ਵਿਚ ਮੱਤਾ ਹੋਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hombre, ¿por qué tienes tanto orgullo, y de qué?"