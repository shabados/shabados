[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਬਦੁ ਚੀਨੑਿ ਸੁਖੁ ਪਾਇਆ; ਸਚੈ ਨਾਇ ਪਿਆਰ ॥"
page = 1346
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Contemplating the Lord and loving the True Name, man is blessed with bliss."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਸਿਮਰਨ ਅਤੇ ਸੱਚੇ ਨਾਮ ਨਾਲ ਪ੍ਰੇਮ ਕਰਨ ਦੁਆਰਾ ਬੰਦੇ ਨੂੰ ਖੁਸ਼ੀ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Contemplating the Shabad, peace is obtained, loving the True Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਸਬਦ ਕੌ ਜਾਨ ਕਰ ਜਿਨੋਂ ਕਾ ਸਚੇ ਨਾਮ ਮੇਂ ਪਿਆਰ ਹੂਆ ਹੈ ਤਿਨੋਂ ਨੇ ਹੀ ਸੁਖੁ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ) ਸਦਾ-ਥਿਰ ਹਰਿ-ਨਾਮ ਵਿਚ (ਜਿਸ ਮਨੁੱਖ ਨੇ) ਪਿਆਰ ਪਾਇਆ, ਉਸ ਨੇ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਨਾਲ ਸਾਂਝ ਪਾ ਕੇ ਆਤਮਕ ਆਨੰਦ ਪ੍ਰਾਪਤ ਕੀਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੀਨ੍ਹ੍ਹਿ = ਪਛਾਣ ਕੇ। ਨਾਇ = ਨਾਮ ਵਿਚ। ਸਚੈ ਨਾਇ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Meditando en el Shabd, la Paz es obtenida; amando el Nombre Verdadero,"