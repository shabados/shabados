[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਬ ਹਮ ਚਲੀ; ਠਾਕੁਰ ਪਹਿ ਹਾਰਿ ॥"
page = 527
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have now come weary to my Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹੁਣ ਹਾਰ ਹੁੱਟ ਕੇ ਆਪਣੇ ਮਾਲਕ ਕੋਲ ਆ ਗਈ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Now, I have come, exhausted, to my Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਠਾਕਰ ਜੀ! ਅਬ ਮੈਂ ਹਾਰ ਕਰ ਆਪ ਕੇ ਪਾਸ ਚਲੀ ਆਈ ਹੂੰ, ਭਾਵ ਤੇਰੀ ਸਰਨ ਲਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਮੈਂ ਹੋਰ ਸਾਰੇ ਆਸਰੇ ਛੱਡ ਕੇ ਮਾਲਕ-ਪ੍ਰਭੂ ਦੀ ਸਰਨ ਆ ਗਈ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਬ = ਹੁਣ। ਪਹਿ = ਪਾਸ, ਕੋਲ। ਹਾਰਿ = ਹਾਰ ਕੇ, ਥੱਕ ਕੇ, ਹੋਰ ਸਾਰੇ ਆਸਰੇ ਛੱਡ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora voy a entregar mi ser a mi Maestro;"