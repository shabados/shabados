type = "primary"
data = "ਸੁਰ ਨਰ ਜਛ ਭੁਜੰਗਨ ਮੋਹੈ ॥੨॥"
page = 1014

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Her youthfulness was very much savoured by all; the gods, the devils, Jachh and Bhujangs. (2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੇਵਤੇ, ਮਨੁੱਖ, ਯਕਸ਼ ਅਤੇ ਭੁਜੰਗ ਉਸ ਉਤੇ ਮੋਹਿਤ ਸਨ ॥੨॥"