[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਸਰੋਵਰ ਨਾਵੈ ॥"
page = 623
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who bathes in the saints tank,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਾਧੂਆਂ ਤੇ ਤਾਲਾਬ ਵਿੱਚ ਨ੍ਹਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who bathes in the healing pool of the Saints,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜੋ ਸ੍ਰੀ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਹੈਂ, ਤਿਨ ਕੇ ਸਰੋਵਰ ਸ੍ਰੀ ਅੰਮ੍ਰਿਤਸਰ ਜੀ ਮੇਂ ਜੋ ਆਗੇ ਕੋ ਭੀ ਨਾਵੈਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੇਹੜਾ ਮਨੁੱਖ ਸੰਤਾਂ ਦੇ ਸਰੋਵਰ ਵਿਚ (ਸਾਧ ਸੰਗਤਿ ਵਿਚ) ਆਤਮਕ ਇਸ਼ਨਾਨ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤ ਸਰੋਵਰਿ = ਸੰਤਾਂ ਦੇ ਸਰੋਵਰ ਵਿਚ, ਸਾਧ ਸੰਗਤਿ ਵਿਚ। ਨਾਵੈ = ਨ੍ਹਾਵੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que baña su ser en el lago de los Santos,"