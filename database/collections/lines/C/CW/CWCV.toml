[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੀਤੇ ਪਰਮ ਪੁਰਖ ਪਾਰਸ ਕੇ; ਸਗਲ ਜਟਾ ਧਰ ਹਾਰੇ ॥"
page = 687

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In the battle all the warriors of Parasnath were victorious and all those with matted locks were defeated"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਪੁਰਖ ਪਾਰਸ (ਨਾਥ) ਦੇ (ਸੂਰਮੇ) ਜਿਤ ਗਏ ਅਤੇ ਸਾਰੇ ਜਟਾਧਾਰੀ (ਸੰਨਿਆਸੀ) ਹਾਰ ਗਏ।"