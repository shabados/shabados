[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਨਹੁ ਦੂਰ ਘਨੋ ਤਮੁ ਕੈ; ਦਿਨ ਆਧਿਕ ਮੈ ਦਿਵਰਾਜ ਬਿਰਾਜਿਯੋ ॥"
page = 437

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After killing the twelve kings, the king Kharag Singh looks splendid like the sun in distant darkness"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਅੰਧਕਾਰ ਨੂੰ ਦੂਰ ਕਰ ਕੇ ਚੰਗੇ ਦਿਨ ਚੜ੍ਹੇ ਵਿਚ ਸੂਰਜ ਬਿਰਾਜਮਾਨ ਹੋ ਰਿਹਾ ਹੋਵੇ।"