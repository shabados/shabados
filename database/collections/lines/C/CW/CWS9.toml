[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦ ਬਲਿਹਾਰਿ ਜਾਉ; ਲਖ ਬੇਰਾ ॥"
page = 887
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "A hundred thousand times, I am ever a sacrifice unto thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲੱਖਾਂ ਵਾਰੀ ਮੈਂ ਸਦੀਵ ਹੀ ਤੇਰੇ ਉਤੋਂ ਘੋਲੀ ਵੰਞਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am forever a sacrifice to You, hundreds of thousands of times."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਮੇਸ੍ਵਰ! ਤੇਰੇ ਊਪਰ ਸੇ ਹਮ ਲਾਖੋਂ ਬੇਰ ਸਦਾ ਬਲਿਹਾਰ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਤੈਥੋਂ ਸਦਾ ਹੀ ਲੱਖਾਂ ਵਾਰੀ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਦ = ਸਦਾ। ਬਲਿਹਾਰਿ = ਕੁਰਬਾਨ। ਜਾਉ = ਜਾਉਂ, ਮੈਂ ਜਾਵਾਂ। ਬੇਰਾ = ਵਾਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En reverencia me postro ante Ti un millón de veces,"