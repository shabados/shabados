[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੇਵ ਸਭੈ ਮਿਲਿ ਕੈ ਇਕ ਠਉਰ; ਸੁ ਅਛਤ ਕੁੰਕਮ ਚੰਦਨ ਲੀਨੋ ॥"
page = 100

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the gods gathering at one place and taking rice, saffron and sandalwood."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਦੇਵਤਿਆਂ ਨੇ ਇਕ ਥਾਂ ਇਕਤਰ ਹੋ ਕੇ ਅਤੇ ਚਾਵਲ ਕੇਸਰ ਤੇ ਚੰਦਨ ਲੈ ਕੇ"