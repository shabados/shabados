[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੈ ਵਿਚਿ; ਧਰਤੀ ਦਬੀ ਭਾਰਿ ॥"
page = 464
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In Lord's fear the earth is trampled under burden."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਡਰ ਵਿੱਚ ਜ਼ਮੀਨ ਬੋਝ ਹੇਠਾਂ ਲਤਾੜੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Fear of God, the earth is crushed under its burden."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭ੍ਯ ਕਰ ਕੇ ਪ੍ਰਿਥ੍ਵੀ (ਭਾਰਿ) ਬੋਝ ਸੇ ਦਬੀ ਹੂਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੀ ਧਰਤੀ ਰੱਬ ਦੇ ਡਰ ਦੇ ਕਾਰਨ ਹੀ ਭਾਰ ਹੇਠ ਨੱਪੀ ਪਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਰਿ = ਭਾਰ ਦੇ ਹੇਠ। ਇੰਦੁ = ਇੰਦਰ ਦੇਵਤਾ, ਬੱਦਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Reverencia a Él, la Tierra soporta el peso de su densidad."