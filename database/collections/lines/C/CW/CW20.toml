[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨੇ ਕੀਤੇ ਨੋ ਆਪਿ ਪ੍ਰਤਿਪਾਲੇ; ਪਇ ਪੈਰੀ ਤਿਸਹਿ ਮਨਾਈ ਜੀਉ ॥੨॥"
page = 106
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His creation, He Himself nurtures Falling at His feet I propitiate Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਰਚਨਾ ਨੂੰ ਉਹ ਆਪੇ ਹੀ ਪਾਲਦਾ ਪੋਸਦਾ ਹੈ। ਉਸ ਦੇ ਪਗੀ ਡਿਗ ਕੇ ਮੈਂ ਉਸ ਨੂੰ ਪ੍ਰਸੰਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself nurtures and cherishes His Creation. I fall at His Feet and surrender to Him. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪਨੇ ਕੀਏ ਹੂਏ ਜੀਵ ਕੀ ਆਪ ਹੀ ਪ੍ਰਤਿਪਾਲਾ ਕਰਤਾ ਹੈ, ਯਾਂ ਤੇ ਤਿਸਕੇ ਚਰਨੋਂ ਮੇਂ ਪੜ ਕਰ ਕੇ ਮਨਾਈਏ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪਣੇ ਪੈਦਾ ਕੀਤੇ ਜਗਤ ਦੀ ਆਪ ਪਾਲਣਾ ਕਰਦਾ ਹੈ। ਮੈਂ ਉਸ ਦੇ ਚਰਨਾਂ ਤੇ ਢਹਿ ਕੇ ਉਸ ਨੂੰ ਹੀ ਪ੍ਰਸੰਨ ਕਰਨ ਦਾ ਜਤਨ ਕਰਦਾ ਹਾਂ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੋ = ਨੂੰ। ਪਇ = ਪੈ ਕੇ। ਤਿਸਹਿ = ਉਸ ਨੂੰ ਹੀ {ਨੋਟ: ਲਫ਼ਜ਼ 'ਤਿਸੁ' ਦਾ (ੁ) ਕ੍ਰਿਆ ਵਿਸ਼ੇਸ਼ਣ 'ਹਿ' ਕਾਰਨ ਉਡ ਗਿਆ ਹੈ}। ਮਨਾਈ = ਮਨਾਈਂ, ਮੈਂ ਮਨਾਂਦਾ ਹਾਂ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es Él Quien sustenta a todas las criaturas, cae a Sus Pies, y reconcílialo contigo. (2)"