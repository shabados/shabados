[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਬਲਿਹਾਰੈ; ਤਾ ਕੈ ਜਾਉ ॥"
page = 354
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am a sacrifice unto them."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਨ੍ਹਾਂ ਉੱਤੋ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Hear and believe in the Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤਿਨ ਕੇ ਬਲਿਹਾਰ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਹਨਾਂ ਬੰਦਿਆਂ ਤੋਂ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕੈ ਬਲਿਹਾਰੈ = ਉਹਨਾਂ ਤੋਂ ਕੁਰਬਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Señor, a él ofrezco mi ser para siempre en sacrificio."