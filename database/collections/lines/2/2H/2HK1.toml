[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ; ਸੁਤਿਆ ਦੇਇ ਜਗਾਈ ॥੨॥"
page = 160
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Himself, God awakens some from slumber."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਹਰੀ ਕਈਆਂ ਨੂੰ ਨੀਂਦਰ ਤੋਂ ਜਗਾ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself wakes us from sleep. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਆਪ ਹੀ ਜਬ ਕ੍ਰਿਪਾ ਕਰਤਾ ਹੈ ਤਬ ਅਵਿਦਿਆ ਨਿੰਦ੍ਰਾ ਸੇ ਸੁਤਿਆ ਕੋ ਗ੍ਯਾਨ ਦੇ ਕਰ ਜਗਾਇ ਦੇਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਦੇ ਮੋਹ ਦੀ ਨੀਂਦ ਵਿਚ) ਸੁੱਤੇ ਹੋਏ ਜੀਵਾਂ ਨੂੰ ਉਹ ਪਰਮਾਤਮਾ ਆਪ ਹੀ ਜਗਾ ਦੇਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਇ = ਦੇਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "lo despierta a uno del letargo.(2)"