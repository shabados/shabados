[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਯਾਸੁ ਜਪਤ ਮਨਿ ਹੋਇ ਅਨੰਦੁ; ਬਿਨਸੈ ਦੂਜਾ ਭਾਉ ॥"
page = 252
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By repeating which the soul becomes happy, love of another is effaced,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਉਚਾਰਨ ਕਰਨ ਦੁਆਰਾ ਜਿੰਦਗੀ ਪਰਸੰਨ ਹੋ ਜਾਂਦੀ ਹੈ, ਹੋਰਸ ਦਾ ਪਿਆਰ ਮਿਟ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chanting it, the mind is filled with bliss; love of duality is eliminated, and pain, distress and desires are quenched."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰਮੇਸ੍ਵਰ ਕੇ ਨਾਮ ਕੇ ਜਪਣੇ ਕਰ ਮਨ ਮੇਂ ਆਨੰਦ ਹੋਵੈ ਔਰ ਦ੍ਵੈਤ ਭਾਵ ਬਿਨਸ ਜਾਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਜਪਦਿਆਂ ਮਨ ਵਿਚ ਆਨੰਦ ਪੈਦਾ ਹੁੰਦਾ ਹੈ, (ਪ੍ਰਭੂ ਤੋਂ ਲਾਂਭੇ) ਕਿਸੇ ਹੋਰ ਦਾ ਮੋਹ ਦੂਰ ਹੋ ਸਕਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਯਾਸੁ = ਜਾਸੁ, ਜਿਸ ਨੂੰ। ਮਨਿ = ਮਨ ਵਿਚ। ਦੂਜਾ ਭਾਉ = ਕਿਸੇ ਹੋਰ ਨਾਲ ਪਿਆਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Viviendo en ese Ser, en el que la mente de uno se regocija y abandona el sentido de dualidad, la tristeza y el deseo,"