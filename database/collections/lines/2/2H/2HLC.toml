[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੂਲੋ ਰਾਵਣੁ; ਮੁਗਧੁ ਅਚੇਤਿ ॥"
page = 224
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "foolish and unwise Ravana forgot the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਵਕੂਫ ਤੇ ਬੇਸਮਝ ਰਾਵਨ ਨੇ ਪ੍ਰਭੂ ਨੂੰ ਵਿਸਾਰ ਦਿਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raawan was deluded, foolish and unwise."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਤੀ ਮੂਰਖ ਰਾਵਣ ਜਬ ਗਰਬ ਕਰ ਪਰਮੇਸ੍ਵਰ ਤੇ ਭੂਲਤਾ ਭਯਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੂਰਖ ਰਾਵਣ ਬੇ-ਸਮਝੀ ਵਿਚ ਕੁਰਾਹੇ ਪੈ ਗਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਚੇਤਿ = ਅਚੇਤ-ਪਨ ਵਿਚ, ਮੂਰਖਤਾ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rawan perdió su Elevada Conciencia, y atontado dejó que invadieran su reino;"