[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਵਲ ਸੁੰਦਰ ਰਾਮਈਆ ॥"
page = 335
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my dark and beauteous Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸ਼ਾਮ ਤੇ ਸੁਨੱਖੇ ਸੁਆਮੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my dark and beautiful Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਤੋਹਿ) ਤੇਰੇ ਕੋ ਸਮਝਾਵਤਾ ਹੂੰ ਸਾਵਲ ਸੁੰਦਰ ਰਾਮਈਆ ਜੋ ਵਾਹਗੁਰੂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸਾਂਵਲੇ ਸੁਹਣੇ ਰਾਮ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਮਈਆ = ਹੇ ਸੁਹਣੇ ਰਾਮ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh bello Azul, oh mi dulce Corazón,"