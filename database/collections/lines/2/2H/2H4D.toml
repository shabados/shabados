[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਹੀ ਧੋਇ; ਨ ਉਤਰੈ ਮੈਲੁ ॥"
page = 893
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By washing the body the mind's filth is removed not;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਰੀਰ ਨੂੰ ਧੋਣ ਨਾਲ ਮਨ ਦੀ ਮਲੀਣਤਾ ਨਹੀਂ ਲਹਿੰਦੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By merely washing the body, one's filth is not removed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਸਥੂਲ ਦੇਹੀ ਕੇ ਧੋਨੇ ਸੇ ਰਿਦੇ ਕੀ ਰਾਗ ਦ੍ਵੈਸ ਰੂਪ ਮੈਲ ਨਹੀਂ ਉਤਰਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਸੰਤ ਜਨੋ! ਤੀਰਥ ਆਦਿਕਾਂ ਤੇ) ਸਰੀਰ ਨੂੰ ਧੋਤਿਆਂ (ਮਨ ਦੀ ਵਿਕਾਰਾਂ ਵਾਲੀ) ਮੈਲ ਦੂਰ ਨਹੀਂ ਹੁੰਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਹੀ = ਸਰੀਰ। ਧੋਇ = ਧੋ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si uno limpia su cuerpo, uno no está limpio en verdad,"