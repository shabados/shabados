[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਹਜਿ ਸੀਗਾਰ; ਕਾਮਣਿ ਕਰਿ ਆਵੈ ॥"
page = 750
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The bride bedecks herself with Divine Knowledge,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਨੀ ਆਪਣੇ ਆਪ ਨੂੰ ਬ੍ਰਹਮ-ਗਿਆਨ ਨਾਲ ਸ਼ਿੰਗਾਰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The soul-bride adorns herself with peace and poise."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਜਗ੍ਯਾਸੀ ਰੂਪ ਇਸਤ੍ਰੀ ਸਾਂਤੀ ਆਦਿ ਗੁਣੋਂ ਕਾ ਸਿੰਗਾਰ ਕਰ ਕੇ ਗੁਰੋਂ ਕੀ ਸਰਣ ਆਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੀ ਜੀਵ-ਇਸਤ੍ਰੀ ਅਡੋਲ ਆਤਮਕ ਅਵਸਥਾ ਵਿਚ (ਟਿਕਦੀ ਹੈ, ਤੇ ਇਹ) ਹਾਰ ਸਿੰਗਾਰ ਕਰ ਕੇ (ਪ੍ਰਭੂ-ਪਤੀ ਦੇ ਦਰ ਤੇ) ਆਉਂਦੀ ਹੈ (ਉਹ ਪਤੀ-ਪ੍ਰਭੂ ਨੂੰ ਚੰਗੀ ਲੱਗਦੀ ਹੈ, ਤੇ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜਿ = ਅਡੋਲ ਆਤਮਕ ਅਵਸਥਾ ਵਿਚ। ਕਾਮਣਿ = ਇਸਤ੍ਰੀ, ਜੀਵ-ਇਸਤ੍ਰੀ। ਕਰਿ = ਕਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La esposa debería adornarse con el Estado de Equilibrio,"