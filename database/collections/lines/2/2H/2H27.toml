[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਟੇ ਉਪਦ੍ਰਹ; ਮਨ ਤੇ ਬੈਰ ॥੨॥"
page = 395
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "wrangling and enmity are effaced from man's mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਦੇ ਮਨੂਏ ਤੋਂ ਬਖੇੜਾ ਤੇ ਦੁਸ਼ਮਣੀ ਮਿੱਟ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "troubles and hatred are eliminated from the mind. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਸੇ ਬੈਰਾਦਿ ਸਭ ਉਪਦ੍ਰਵ ਮਿਟ ਗਏ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਮਨ ਵਿਚੋਂ ਸਾਰੀਆਂ ਛੇੜ-ਖ਼ਾਨੀਆਂ ਸਾਰੇ ਵੈਰ-ਵਿਰੋਧ ਮਿੱਟ ਜਾਂਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਪਦ੍ਰਹ = ਉਪੱਦ੍ਰਵ, ਛੇੜ-ਖ਼ਾਨੀਆਂ। ਤੇ = ਤੋਂ, ਵਿਚੋਂ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sus tribulaciones se acaban y no vuelve a tener enemistad con nadie. (2)"