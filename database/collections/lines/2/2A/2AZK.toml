[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਪ੍ਰਸਾਦਿ; ਸਭ ਕੀ ਗਤਿ ਹੋਇ ॥"
page = 270
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose kindness and all are saved,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਰਹਿਮਤ ਸਦਕਾ ਸਭਸ ਦਾ ਪਾਰ ਉਤਾਰਾ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By His Grace, everyone is saved;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਸਭ ਕੀ (ਗਤੀ) ਮੋਖ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਪਰਾਮਤਮਾ) ਦੀ ਦਇਆ ਨਾਲ ਹਰੇਕ (ਜੀਵ) ਦੀ (ਉਸ ਤਕ) ਪਹੁੰਚ ਹੋ ਜਾਂਦੀ ਹੈ, (ਉਸ ਨੂੰ ਜਪ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por Su Gracia, todos y cada uno son salvados."