data = "ਏਸਨਏਸ ਨਰੇਸਨ ਕੇ ਜੁਤ ॥੧੭੭॥"
page = 218

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "This group of kings accompanied by elephants and horses, having many desires in their mind, started (for back journey).177."

