data = "ਸੰਤਨ ਸੰਗਿ; ਕਬੀਰਾ ਬਿਗਰਿਓ ॥"
page = 1158
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the society of saints, Kabir is spoiled,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿਸੰਗਤ ਅੰਦਰ ਕਬੀਰ ਬਿਗੜ ਗਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Society of the Saints, Kabeer is transformed;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਐਸੇ ਹੀ ਸੰਤੋਂ ਕੇ ਸੰਗ ਮਿਲ ਕੇ (ਕਬੀਰਾ) ਮੈਂ ਬਿਗਰ ਗਿਆ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸੇ ਤਰ੍ਹਾਂ) ਕਬੀਰ ਭੀ ਸੰਤਾਂ ਦੀ ਸੰਗਤ ਵਿਚ ਰਹਿ ਕੇ ਵਿਗੜ ਗਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Kabir también ha sido impregnado por los Santos y ve el milagro,"