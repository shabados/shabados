[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਤਿ ਜਛਣੀ ਨਾਰਿ ਰਾਗ ਗਾਵਤੀ ਗੁਰੂ ਤੇਈਸਵੋ ਸਮਾਪਤੰ ॥੨੩॥"
page = 673

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "End of the description of the adoption of a Yaksha woman-singer as the twenty-Third Guru."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਥੇ 'ਜਛਣੀ ਨਾਰ ਰਾਗ ਗਾਉਂਦੀ ਹੋਈ' ਤੇਈਵੇਂ ਗੁਰੂ ਦਾ ਪ੍ਰਸੰਗ ਸਮਾਪਤ ॥੨੩॥"