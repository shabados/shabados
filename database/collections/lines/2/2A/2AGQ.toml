[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਮ੍ਰਿਤ ਬਾਣੀ ਸਤਿਗੁਰ ਪੂਰੇ ਕੀ; ਜਿਸੁ ਕਿਰਪਾਲੁ ਹੋਵੈ. ਤਿਸੁ ਰਿਦੈ ਵਸੇਹਾ ॥"
page = 961
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ambrosial is the word of the perfect True Guru. It abides within the mind of him, to whom the Guru is compassionate."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਮ੍ਰਿਤ-ਮਈ ਹੈ ਪੂਰਨ ਸੱਚੇ ਗੁਰਦੇਵ ਜੀ ਦੀ ਗੁਰਬਾਣੀ। ਇਹ ਉਸ ਦੇ ਹਿਰਦੇ ਅੰਦਰ ਵਸਦੀ ਹੈ, ਜਿਸ ਉੱਤੇ ਗੁਰੂ ਜੀ ਮਿਹਰਬਾਨ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Word of the Perfect True Guru's Bani is Ambrosial Nectar; it dwells in the heart of one who is blessed by the Guru's Mercy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਗੁਰੂ ਪੂਰੇ ਕੀ ਬਾਣੀ ਅੰਮ੍ਰਿਤ ਸਰੂਪ ਹੈ। ਜਿਸ ਪਰ ਪਰਮੇਸਰ ਕਿਰਪਾਲ ਹੋਵੈ ਤਿਸ ਕੇ ਰਿਦੇ ਮੈਂ ਗੁਰੋਂ ਕੀ ਬਾਣੀ ਬਸਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੂ ਦੀ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲੀ ਬਾਣੀ ਉਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਵੱਸਦੀ ਹੈ ਜਿਸ ਉਤੇ ਗੁਰੂ ਮੇਹਰ ਕਰੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਮ੍ਰਿਤ ਬਾਣੀ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Palabra del Bani del Guru Perfecto es Néctar Ambrosial y habita en el corazón de quien ha sido bendecido con la Misericordia del Guru."