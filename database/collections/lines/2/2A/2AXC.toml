[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਕੇ ਨ ਪਾਸ ਚਲੈ ਸਜਨੀ, ਉਨ ਕੋ ਕਛ ਜੈ ਹੈ ਨ, ਆਪਨ ਖੋਗੀ ॥"
page = 366

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O friend! if you do not go to him, he will lose nothing, the loss will be only yours"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਜਨੀ! (ਜੇ) ਉਸ ਦੇ ਕੋਲ ਨਹੀਂ ਜਾਂਦੀ, (ਤਾਂ) ਉਸ ਦਾ ਕੁਝ ਨਹੀਂ ਜਾਏਗਾ, (ਤੂੰ ਹੀ) ਆਪਣਾ ਕੁਝ ਖੋਹੇਂਗੀ।"