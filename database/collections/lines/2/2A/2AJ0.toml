[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੋਜਾ ਧਰੈ, ਨਿਵਾਜ ਗੁਜਾਰੈ; ਕਲਮਾ. ਭਿਸਤਿ ਨ ਹੋਈ ॥"
page = 480
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By keeping fast, saying prayer and reading the Muslim creed (Kalma) thou cannot go to paradise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਰਤ ਰੱਖਣ, ਨਿਮਾਜ਼ ਪੜ੍ਹਨ ਅਤੇ ਮੁਸਲਮਾਨੀ ਕਲਮੇ ਦੇ ਵਾਚਣ ਦੁਆਰਾ ਤੂੰ ਸੁਰਗ ਨੂੰ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Keeping your fasts, reciting your prayers, and reading the Kalma, the Islamic creed, shall not take you to paradise."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਾਜੀ! ਰੋਜਾ ਰਖਤੇ ਹੋ, ਨਿਮਾਜ ਪੜਤੇ ਹੋ, ਕਲਮਾ ਪੜਤੇ ਹੋ, ਇਤਨੇ ਹੀ ਮੇਂ (ਭਿਸਤਿ) ਬੈਕੁੰਠ ਪ੍ਰਾਪਤੀ ਨਹੀਂ ਹੋਵੇਗੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਿਰਾ) ਰੋਜ਼ਾ ਰੱਖਿਆਂ, ਨਿਮਾਜ਼ ਪੜ੍ਹਿਆਂ ਤੇ ਕਲਮਾ ਆਖਿਆਂ ਭਿਸ਼ਤ ਨਹੀਂ ਮਿਲ ਜਾਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੋਜਾ ਧਰੈ = ਰੋਜ਼ਾ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno hace ayunos y oraciones diarias y recita el Qualima, el Credo Islámico, pero con esto, uno no va al cielo."