[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਕ੍ਰਵਾਰਿ; ਪ੍ਰਭੁ ਰਹਿਆ ਸਮਾਈ ॥"
page = 841
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Friday: My Master is pervading all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ੁਕਵਾਰ: ਮੇਰਾ ਮਾਲਕ ਸਾਰੇ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Friday: God is permeating and pervading everywhere."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ਼ੁਕ੍ਰਵਾਰ ਦ੍ਵਾਰੇ ਕਹਤੇ ਹੈਂ: ਸੋ ਪ੍ਰਭੂ ਸਰਬ ਮੇਂ ਸਮਾਇ ਰਹਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ ਵਿਚ) ਪਰਮਾਤਮਾ ਵਿਆਪਕ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Viernes: El Maestro Todopoderoso prevalece en todos los seres,"