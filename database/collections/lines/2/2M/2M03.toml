[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਵਤ ਮਰਹੁ; ਭਵਜਲੁ ਜਗੁ ਤਰਣਾ ॥"
page = 1040
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remaining dead in life, thou shall cross the terrible world ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੀਉਂਦੇ ਜੀ ਮਰ ਕੇ, ਤੂੰ ਭਿਆਨਕ ਸੰਸਾਰ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਹੋ ਜਾਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remain dead while yet alive, and cross over the terrifying world-ocean."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਭਾਵ ਤੇ ਮਰੋ ਤਉ ਜਗਤ ਰੂਪ ਸਮੁੰਦਰ ਤੇ ਤਰਨਾ ਹੋਵੈਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵਨ-ਸਫ਼ਰ ਵਿਚ ਵਿਕਾਰਾਂ ਦੇ ਹੱਲੇ ਤੋਂ ਬਚੇ ਰਹੋਗੇ, ਤੇ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਲੰਘ ਜਾਵੋਗੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਰਹੁ = ਵਿਕਾਰਾਂ ਵਲੋਂ ਬਚੇ ਰਹੋਗੇ। ਭਵਜਲੁ = ਸੰਸਾਰ-ਸਮੁੰਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así, nada a través del mar de las existencias."