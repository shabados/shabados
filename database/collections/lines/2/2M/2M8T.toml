[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਦਰਸਨ ਪ੍ਰਭ ਪਿਆਸ ॥"
page = 276
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many millions have thirst for Lord's sight."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਕ੍ਰੋੜਾਂ ਨੂੰ ਸਾਹਿਬ ਦੇ ਦੀਦਾਰ ਦੀ ਤਰੇਹ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions thirst for the Blessing of God's Darshan."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਕਈ ਕ੍ਰੋੜੋਂ ਕੌ ਸਰਗੁਣ ਸਰੂਪ ਪ੍ਰਭੂ ਕੇ ਦਰਸਨ ਕੀ ਪਿਆਸਾ ਅਰਥਾਤ ਇਛਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਰੋੜਾਂ ਜੀਵਾਂ ਨੂੰ ਪ੍ਰਭੂ ਦੇ ਦੀਦਾਰ ਦੀ ਤਾਂਘ ਲੱਗੀ ਰਹਿੰਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਿਆਸ = ਤ੍ਰੇਹ, ਇੱਛਾ, ਤਾਂਘ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones están sedientos por alcanzar una Visión de su Señor,"