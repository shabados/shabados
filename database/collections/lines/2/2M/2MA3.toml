[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖਾਧਾ ਹੋਇ ਸੁਆਹ; ਭੀ ਖਾਣੇ ਸਿਉ ਦੋਸਤੀ ॥"
page = 146
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What is eaten become ashes, but still man has got friendship with eating."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਖਾ ਲਿਆ ਹੈ, ਉਹ ਭਸਮ ਹੋ ਜਾਂਦਾ ਹੈ, ਪਰ ਤਾਂ ਭੀ ਆਦਮੀ ਦੀ ਖਾਣ ਨਾਲ ਯਾਰੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That which is eaten becomes dust, but they are still attached to eating."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਖਾਇਆ ਥਾ, ਸੋ ਭਸਮ ਹੋ ਗਿਆ ਫੇਰ ਭੀ ਖਾਣੇ ਸੇ ਹੀ ਪ੍ਰੀਤੀ ਰਹਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਦੋਂ) ਜੋ ਕੁੱਝ ਖਾਧਾ ਹੁੰਦਾ ਹੈ ਭਸਮ ਹੋ ਜਾਂਦਾ ਹੈ, ਤਾਂ ਹੋਰ ਖਾਣ ਦੀ ਤਾਂਘ ਪੈਦਾ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "cuando el hambre y la sed le ladran, pero todo lo que uno come se vuelve polvo;"