[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਤੋਲੀ ਧਰਤਿ ਅਕਾਸਿ ਦੁਇ; ਪਿਛੇ ਛਾਬੇ ਟੰਕੁ ਚੜਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "I may weigh the earth and the sky against few grams of weight."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਤੱਕੜ ਵਿੱਚ) ਧਰਤ ਅਕਾਸ਼ ਦੋਵੇਂ (ਧਰਕੇ) ਪਿਛਲੇ ਛਾਬੇ ਵਿਚ (ਟੰਕ=) ਵੱਟਾ ਪਾਕੇ ਤੋਲ ਲਵਾਂ।"