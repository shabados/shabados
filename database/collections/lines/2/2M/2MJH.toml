type = "translation"
language = "pa"
data = "ਸਿਰਫ ਪੂਰਾ ਸਤਿਗੁਰੂ ਹੀ ਸੱਚੇ ਰੱਬ ਦਾ ਪਤਾ ਦੇ ਸਕਦਾ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਮੁਰਸ਼ਦਿ ਕਾਮਿਲ ਦਿਹਦ ਅਜ਼ ਹੱਕ ਨਿਸ਼ਾਂ ॥੪੧੬॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "In fact, a perfect Guru alone can give us the correct whereabouts of Akaalpurakh. (416)"