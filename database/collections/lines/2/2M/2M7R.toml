[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਤਿਸੁ ਸਰਣਾਗਤੀ; ਘਟ ਘਟ ਸਭ ਜਾਨ ॥੨॥੧੨॥੭੬॥"
page = 819
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak has sought the protection of Him, who is Knower of all the hearts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੇ ਉਸ ਦੀ ਪਨਾਹ ਲਈ ਹੈ, ਜੋ ਸਾਰੇ ਦਿਲਾਂ ਦੀਆਂ ਜਾਨਣਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak has come to the Sanctuary of the One who knows each and every heart. ||2||12||76||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜੋ (ਘਟ ਘਟ) ਸਰਬ ਕੇ ਰਿਦੋਂ ਕਾ ਜਾਣੀ ਜਾਣ ਵਾਹਿਗੁਰੂ ਹੈ, ਤਿਸ ਕੀ ਹਮ ਸਰਣਾਗਤੀ ਹੈਂ॥੨॥੧੨॥੭੬॥☬ਸ੍ਰੀ ਗੁਰੂ ਹਰਿ ਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਕਾ ਰੋਗ ਨਿਵਿਰਤ ਹੋਏ ਤੇ ਉਚਾਰਨ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਸਾਧ ਸੰਗਤਿ ਦਾ ਆਸਰਾ ਲੈ ਕੇ) ਉਸ ਪਰਮਾਤਮਾ ਦੀ ਸਦਾ ਸਰਨ ਪਏ ਰਹਿਣਾ ਚਾਹੀਦਾ ਹੈ ਜੇਹੜਾ ਹਰੇਕ ਜੀਵ ਦੇ ਹਿਰਦੇ ਦੀ ਹਰੇਕ ਗੱਲ ਜਾਣਨ ਵਾਲਾ ਹੈ ॥੨॥੧੨॥੭੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸੁ = ਉਸ (ਪਰਮਾਤਮਾ) ਦੀ। ਘਟ ਘਟ ਜਾਨ = ਹਰੇਕ ਦੇ ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲਾ ॥੨॥੧੨॥੭੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak busca el Refugio de ese Señor que vive en todos los corazones.  (2-12-76)"