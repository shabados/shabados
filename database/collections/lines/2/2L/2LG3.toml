[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਕਿਛੁ ਕੀਨੋ; ਸੁ ਪ੍ਰਭੂ ਰਜਾਇ ॥"
page = 1275
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever the Lord does, that is in His will."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਝ ਸਾਈਂ ਕਰਦਾ ਹੈ, ਉਹ ਉਸ ਦੇ ਭਾਣੇ ਵਿੱਚ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever God does, is by His Own Will."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਛ ਕੀਆ ਹੈ, ਸੋ ਪ੍ਰਭੂ ਨੇ ਅਪਨੀ ਰਜਾਇ ਮੇਂ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਭੀ ਖੇਡ ਰਚੀ ਹੈ ਪ੍ਰਭੂ ਨੇ ਆਪਣੀ ਰਜ਼ਾ ਵਿਚ ਰਚੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todo lo que Dios hace es por Su Propia Voluntad."