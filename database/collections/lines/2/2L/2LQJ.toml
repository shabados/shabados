[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਕ੍ਰ ਚਲਾਇ ਗਿਰਾਇ ਦਇਓ; ਅਰਿ ਭਾਜਤ ਦੈਤ ਬਡੇ ਬਰਬੰਡੀ ॥"
page = 86

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She killed the running superb mighty warriors with her disc.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਚਕ੍ਰ ਚਲਾ ਕੇ (ਉਸ ਨੇ) ਵੈਰੀ ਨੂੰ ਡਿਗਾ ਦਿੱਤਾ ਅਤੇ ਵਡੇ ਵਡੇ ਬਲਵਾਨ ਦੈਂਤ ਭਜ ਗਏ।"