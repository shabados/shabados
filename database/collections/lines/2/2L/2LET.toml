[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉਮੈ ਵਿਚਹੁ ਤਜੈ ਵਿਕਾਰ ॥੩॥"
page = 665
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then one sheds, from within, him, ego and sin."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਆਦਮੀ ਆਪਣੇ ਅੰਦਰੋਂ ਹੰਕਾਰ ਤੇ ਪਾਪ ਨੂੰ ਕੱਢ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Egotism and corruption are eradicated from within. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਤਿਨੋਂ ਨੇ ਅੰਤਸਕਰਣ ਵਿਚੋਂ ਹਉਮੈਂ ਆਦਿਕ ਵਿਕਾਰ ਤਿਆਗ ਦੀਏ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਆਪਣੇ ਅੰਦਰੋਂ ਹਉਮੈ ਆਦਿਕ ਵਿਕਾਰਾਂ ਨੂੰ ਕੱਢ ਦੇਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es entonces cuando uno se deshace de su ego y de sus errores. (3)"