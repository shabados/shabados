[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੈ ਸਿਮਰਨਿ; ਕਾਰਜ ਪੂਰੇ ॥"
page = 263
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through Lord's meditation the tasks are accomplished."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਭਜਨ ਰਾਹੀਂ ਕੰਮ ਸੰਪੂਰਨ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remembering God, one's works are accomplished."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕੇ ਸਿਮਰਨੇ ਸੇ ਸਭੀ ਕਾਰਜ ਪੂਰਨ ਹੋ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦਾ ਸਿਮਰਨ ਕਰਨ ਨਾਲ ਮਨੁੱਖ ਦੇ (ਸਾਰੇ) ਕੰਮ ਪੂਰੇ ਹੋ ਜਾਂਦੇ ਹਨ (ਭਾਵ, ਉਹ ਲੋੜਾਂ ਦੇ ਅਧੀਨ ਨਹੀਂ ਰਹਿੰਦਾ)"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Meditando en Dios todos sus trabajos, compromisos y tareas son realizadas."