[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦੀ; ਸਦ ਸਮੑਾਲ ॥"
page = 1173
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the Guru's grace, ever cherish thou Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਤੂੰ ਹਮੇਸ਼ਾਂ ਉਸ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, contemplate Him forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਕੋ ਪਾਇ ਕਰ ਤਿਸ ਕੋ ਸਦਾ ਸਮਾਲਣਾ ਯੋਗ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਉਸ ਪਰਮਾਤਮਾ ਨੂੰ ਸਦਾ ਯਾਦ ਰੱਖਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਸਾਦੀ = ਕਿਰਪਾ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Alábalo entonces siempre, por la Gracia del Guru,"