[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਹਸ ਰੰਗ; ਫੁਰਮਾਇਸਿ ਕਾਈ ॥"
page = 1331
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the comforts, revelments and many commands,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਛਾਂਤੀ, ਰੰਗ-ਰਲੀਆਂ, ਕਈ ਹੁਕਮਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "joy, love and the power to command;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਵੇਤ, ਪੀਤਾਦੀ ਰੰਗੋਂ ਕਾ ਪਹਿਰਨਾ ਅਰ ਖੁਸ਼ੀ ਕੀ ਫੁਰਮਾਇਸ਼ ਜੋ ਕੋਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦੁਨੀਆ ਵਾਲੇ ਚਾਉ ਮਲ੍ਹਾਰ ਤੇ ਹਕੂਮਤਾਂ, (ਇਹਨਾਂ ਵਿਚੋਂ) ਕੁਝ ਭੀ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਹਸ = ਅਨੰਦ, ਚਾਉ। ਫੁਰਮਾਇਸਿ = ਹਕੂਮਤ। ਕਾਈ = ਕੋਈ ਭੀ ਚੀਜ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "alegrías, amor, y el disfrute del poder de comandar;"