[[content]]
assets = ["SSKS"]
type = "primary"
data = "ਪੂਰਨ ਬ੍ਰਹਮ ਬਿਬੇਕ ਆਪਾ ਆਪ ਪ੍ਰਗਾਸ ਹੁਇ ॥"

[[content]]
assets = ["SSPK"]
type = "translation"
language = "en"
data = "Being supreme conscious and knowledgeable; it seems God Himself has descended as light divine in the form of Guru Hargobind."

[[content]]
assets = ["SSSK"]
type = "translation"
language = "pa"
data = "ਆਪਾ ਜੀਵਤ ਭਾਵ = ਆਤਮੇ, ਦਾ ਵੀਚਾਰ ਨਿਰਣਾ ਕੀਤਿਆਂ, ਇਹ ਆਤਮਾ ਹੀ ਪੂਰਣ ਬ੍ਰਹਮ ਪਰਮਾਤਮਾ ਸਰੂਪ ਹੋ ਭਾਸਦਾ ਹੈ। *ਆਤਮ ਚੀਨਿ ਪਰਾਤਮ ਚੀਨਹੁ........*"