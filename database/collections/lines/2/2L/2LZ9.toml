[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਅੰਤਰਿ; ਵਸੈ ਪ੍ਰਭੁ ਆਪਿ ॥"
page = 865
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, within whom the Lord Himself abides;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਅੰਦਰ ਸਾਹਿਬ ਖੁਦ ਨਿਵਾਸ ਰੱਖਦਾ ਹੈ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Deep within, God Himself abides;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਜਿਸ ਕੇ ਅੰਤਰਿ ਆਪ ਪ੍ਰਭੂ ਨਿਵਾਸ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪ੍ਰਭੂ ਆਪ ਆ ਪਰਗਟ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ ਅੰਤਰਿ = ਦੇ ਅੰਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El corazón de aquél en el"