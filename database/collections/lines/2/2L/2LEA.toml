[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਣੈ ਭਾਣੈ ਕਿਨੈ. ਨ ਪਾਇਓ; ਜਨ ਵੇਖਹੁ ਮਨਿ ਪਤੀਆਇ ॥"
page = 1313
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "No body finds the Lord by walking in his own will. O man, realize this and satisfy thy soul."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਮਰਜੀ ਅੰਦਰ ਟੁਰਨ ਦੁਆਰਾ, ਕਿਸੇ ਨੂੰ ਭੀ ਪ੍ਰਭੂ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦਾ। ਹੇ ਬੰਦੇ! ਤੂੰ ਇਸ ਨੂੰ ਵੇਖ ਵਿਚਾਰ ਕੇ ਆਪਣੀ ਆਤਮਾ ਦੀ ਤਸੱਲੀ ਕਰ ਲੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one finds the Lord by his own will; see this, and satisfy your mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਮਤ ਕਰਨੇ ਸੇ ਕਿਸੀ ਨੇ ਨਹੀਂ ਪਾਯਾ ਹੈ, ਹੇ ਸੰਤ ਜਨੋ! ਮਨ ਮੇਂ ਪਤੀਆਇ ਨਿਸਚੇ ਕਰ ਦੇਖ ਲੇਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਆਪਣੇ ਮਨ ਵਿਚ ਤਸੱਲੀ ਕਰ ਕੇ ਵੇਖ ਲਵੋ, ਆਪਣੇ ਮਨ ਦੀ ਮਰਜ਼ੀ ਵਿਚ ਤੁਰ ਕੇ ਕਿਸੇ ਨੇ ਭੀ ਹਰਿ-ਨਾਮ ਪ੍ਰਾਪਤ ਨਹੀਂ ਕੀਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨ = ਹੇ ਜਨੋਂ! ਪਤੀਆਇ = ਤਸੱਲੀ ਕਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nadie encuentra al Señor por propia voluntad. Que al entender esto, tu mente quede satisfecha."