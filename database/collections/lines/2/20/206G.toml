[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਇਹ ਕਉਤੁਕ ਦੇਖਨ ਕਉ; ਚਲਿ ਆਯੋ ਹੁਤੋ, ਸਭ ਹੀ ਸੁਖੁ ਪਾਯੋ ॥੨੦੧੦॥"
page = 498

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Whosoever came to see this spectacle, obtained extreme delight.2010."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਵੀ ਇਸ ਕੌਤਕ ਨੂੰ ਵੇਖਣ ਲਈ ਚਲ ਕੇ ਆਇਆ, (ਉਨ੍ਹਾਂ) ਸਾਰਿਆਂ ਨੇ ਬਹੁਤ ਸੁਖ ਪ੍ਰਾਪਤ ਕੀਤਾ ॥੨੦੧੦॥"