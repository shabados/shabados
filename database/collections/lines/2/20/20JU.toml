[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਚਰਜੁ; ਤੇਰੀ ਵਡਿਆਈ ॥"
page = 630
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Marvellous is Thy grandeur."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਦਭੁੱਤ ਹੈ ਤੇਰੀ ਮਹਿਮਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your glorious greatness is wonderful and marvellous."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਵਡਾਈ ਭੀ ਅਸਚਰਜ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਅਸਚਰਜ-ਸਰੂਪ ਹੈਂ। ਤੇਰੀ ਬਖ਼ਸ਼ਸ਼ ਭੀ ਹੈਰਾਨ ਕਰ ਦੇਣ ਵਾਲੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਚਰਜੁ = ਹੈਰਾਨ ਕਰ ਦੇਣ ਵਾਲਾ। ਵਡਿਆਈ = ਬਖ਼ਸ਼ਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak medita por siempre en el Naam,"