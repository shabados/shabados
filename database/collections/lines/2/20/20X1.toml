type = "primary"
data = "ਬਿਧੁੰ ਬਾਕ ਬੈਨੀ ॥੬੪੭॥"
page = 268

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Sita fell at the feet of Ram who saw towards her and addressed to that lady of lotus eyes and sweet speech 647"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਕੋਇਲ ਦੀ ਸੁਰ ਵਰਗੇ ਬੋਲ ਬੋਲਣ ਵਾਲੀਏ! ਦੱਸੋ (ਤੁਹਾਡੀ ਪਵਿੱਤਰਤਾ ਦੀ ਪਰੀਖਿਆ ਕਿਸ ਤਰ੍ਹਾਂ ਹੋਵੇ) ॥੬੪੭॥"