[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਿ ਨਿਰਾਲਮੁ ਅਪਰ ਅਪਾਰੀ ॥"
page = 1037
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself is detached, endless and unequalled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਖ਼ੁਦ ਨਿਰਲੇਪ, ਅੰਤ-ਰਹਿਤ ਅਤੇ ਬੇ-ਮਿਸਾਲ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is unattached, infinite and incomparable."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ (ਅਪਰ ਅਪਾਰੀ) ਪਰਮੇਸਰ ਨਿਰਾਲਮ ਹੈ ਅਰਥਾਤ ਨਿਰਲੇਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਅਪਰ ਤੇ ਅਪਾਰ ਪ੍ਰਭੂ ਆਪਣੇ ਸਹਾਰੇ ਆਪ ਹੀ ਹੈ (ਉਸ ਨੂੰ ਕਿਸੇ ਹੋਰ ਆਸਰੇ ਦੀ ਲੋੜ ਨਹੀਂ ਪੈਂਦੀ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਾਲਮੁ = {निरालम्ब} ਜੋ ਆਪਣੇ ਸਹਾਰੇ ਆਪ ਹੀ ਹੈ, ਜਿਸ ਨੂੰ ਕਿਸੇ ਹੋਰ ਸਹਾਰੇ ਦੀ ਲੋੜ ਨਹੀਂ (ਆਲੰਬ-ਸਹਾਰਾ)। ਅਪਾਰ = ਜਿਸ ਦਾ ਪਾਰਲਾ ਬੰਨਾ ਲੱਭਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, el Uno Infinito y Desapegado, y así, de Él Mismo creó la Naturaleza,"