[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਗਿ ਤੁਹਾਰੈ ਪ੍ਰਭੁ ਬਸੈ; ਬਨੁ ਬਨੁ ਕਹਾ ਫਿਰਾਹਿ ॥"
page = 256
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord resides with thee why wanderest thou from forest to forest?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਤੇਰੇ ਨਾਲ ਹੀ ਰਹਿੰਦਾ ਹੈ, ਤੂੰ ਜੰਗਲ ਜੰਗਲ ਕਿਉਂ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is with you, so why do you wander around from forest to forest?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪ੍ਰਭੂ ਤੁਮਾਰੇ ਸੰਗ ਹੀ ਬਸਤਾ ਹੈ। ਭੇਖ ਬਨਾ ਬਨਾ ਕਰ, ਵਾ ਬਨ ਬਨ ਮੇਂ (ਕਹਾ) ਕਿਸ ਵਾਸਤੇ ਭਟਕਤੇ ਫਿਰਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪ੍ਰਭੂ ਤੁਹਾਡੇ ਨਾਲ (ਹਿਰਦੇ ਵਿਚ) ਵੱਸ ਰਿਹਾ ਹੈ, ਤੁਸੀ ਜੰਗਲ ਜੰਗਲ ਕਿੱਥੇ ਢੂੰਢਦੇ ਫਿਰਦੇ ਹੋ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué vagar por el mundo buscando, cuando Él habita en tu interior?"