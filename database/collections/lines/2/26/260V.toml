[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗਾਂਈ ਘਰਿ ਗੋਸਾਂਈਆਂ; ਮਾਧਾਣੁ ਘੜਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The cow herds are there in the house of the master, the foolish person continues getting the churning sticks made for his own home."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗਊੂਆਂ ਤਾਂ ਗੁੱਜਰਾਂ (ਆਥਵਾ ਮਾਲਕਾਂ) ਦੇ ਘਰ ਹਨ, (ਸ਼ੇਖ ਚਿਲੀ ਨੇ) ਮਧਾਣੀਆਂ ਘੜਾ ਛੱਡੀਆਂ (ਕਿ ਗਊਆਂ ਦੇ ਦੁੱਧ ਤੋਂ ਮੱਖਣ ਕੱਢਾਂਗੇ)।"