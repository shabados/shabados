data = "ਮਹਾ ਜੋਤਿ ਦਸ ਚਾਰਿ ਨਿਧਾਨੂ ॥"
page = 624

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He was a great hero and superb intellectual, he was the store of fourteen sciences"

[[content]]
