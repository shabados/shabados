[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਵਿਹਾਝੇ. ਨਾਮੁ ਲਏ; ਨਾਮਿ ਰਹੇ ਸਮਾਏ ॥"
page = 440
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It then purchases the Name, utters the Name and in the Name it remains absorbed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਇਹ ਨਾਮ ਨੂੰ ਖਰੀਦਦਾ ਹੈ, ਨਾਮ ਨੂੰ ਉਚਾਰਨ ਕਰਦਾ ਹੈ ਅਤੇ ਨਾਮ ਅੰਦਰ ਹੀ ਲੀਨ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It purchases the Naam, chants the Naam, and remains absorbed in the Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਮਹਾਤਮਾ ਨਾਮ ਹੀ ਕੋ (ਵਿਹਾਝੇ) ਗੁਰਾਂ ਪਾਸੋਂ ਖਰੀਦਤੇ ਹੈਂ, ਨਾਮ ਹੀ ਕੋ ਲੇਤੇ ਹੈਂ, ਭਾਵ ਉਚਾਰਤੇ ਹੈਂ ਔਰ ਨਾਮੀ ਹੀ ਮੇਂ (ਸਮਾਏ) ਮਿਲੇ ਰਹਿਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਫਿਰ ਇਹ) ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਸੌਦਾ ਕਰਦਾ ਹੈ (ਭਾਵ,) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪਦਾ ਰਹਿੰਦਾ ਹੈ, ਨਾਮ ਵਿਚ ਲੀਨ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਿਹਾਝੇ = ਖ਼ਰੀਦਦਾ ਹੈ। ਲਏ = ਲੈਂਦਾ ਹੈ, ਸਿਮਰਦਾ ਹੈ। ਨਾਮਿ = ਨਾਮ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y atesora el Nombre del Señor, repite el Nombre y se inmerge en el Nombre."