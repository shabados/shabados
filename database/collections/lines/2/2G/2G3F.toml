[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਇਸੁ ਮਾਰੇ; ਸੁ ਸਹਜ ਧਿਆਨੀ ॥੫॥"
page = 238
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who kills it, is a the visualiser of the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਇਸ ਨੂੰ ਨਾਸ ਕਰਦਾ ਹੈ, ਉਹ ਪ੍ਰਭੂ ਦਾ ਵੀਚਾਰਵਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who kills this meditates intuitively. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਇਸ ਕੋ ਮਾਰਤਾ ਹੈ, ਸੋ ਸੁਭਾਵਕ ਹੀ ਧਿਆਨ ਲਗਾਵਣੇ ਵਾਲਾ ਹੂਆ ਹੈ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਇਸ (ਮੇਰ-ਤੇਰ ਨੂੰ) ਮੁਕਾ ਲੈਂਦਾ ਹੈ, ਉਹ ਸਦਾ ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜ = ਆਤਮਕ ਅਡੋਲਤਾ। ਸਹਜ ਧਿਆਨੀ = ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਟਿਕੇ ਰਹਿਣ ਵਾਲਾ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "llega a la Contemplación y al Equilibrio.(5)"