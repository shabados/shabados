data = "ਉਨ ਭਾਖੋ, ਯੌ ਹੀ ਉਠਿ ਜੈਹੋ ॥੧੧॥"
page = 859

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "As, he had suggested that he would give her a rope (to cross over the stream) 11"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਕਿਹਾ, ਮੈਂ (ਬਿਨਾ ਡੋਲੀ) ਦੇ, ਉਵੇਂ ਚਲੀ ਜਾਵਾਂਗੀ ॥੧੧॥"