[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਾਵੈ ਦੇਇ; ਨ ਦੇਈ ਸੋਇ ॥"
page = 25
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By His pleasure, He may give or may not give."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਰਜ਼ਾ ਦੁਆਰਾ ਉਹ ਦੇਵੇ ਜਾਂ ਨਾਂ ਦੇਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As it pleases Him, He may give, or not give."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਤੂੰ  ਚਾਹੇ ਦੇਵੇਂ ਔਰੁ ਚਾਹੇ ਨਾ ਦੇਵੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਮਰਜ਼ੀ ਹੈ ਕਿ ਧਨ-ਪਦਾਰਥ ਦੇਵੇ ਜਾਂ ਨਾਹ ਦੇਵੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਵੈ = ਜੇ ਚੰਗਾ ਲੱਗੇ, ਜੇ ਉਸ ਦੀ ਮਰਜ਼ੀ ਹੋਵੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si Él así lo desea, da, si no, entonces no da."