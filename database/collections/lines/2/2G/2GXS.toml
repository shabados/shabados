[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ ਮੇਰੇ; ਸਚਾ ਸਾਜੁ ॥"
page = 1142
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Guru is truly embellished."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸੱਚੇ ਗੁਰਦੇਵ ਜੀ ਵਾਸਤਵ ਵਿੱਚ ਸ਼ਸ਼ੋਭਤ ਹੋਏ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My True Guru is adorned with Truth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸਤਿਗੁਰੂ ਕਾ ਸਭ (ਸਾਜੁ) ਬਣਾਉ ਸਚਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਇਹ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੀ ਮਰਯਾਦਾ ਹੈ (ਕਿ ਉਹ ਸਦਾ ਬੇ-ਗ਼ਰਜ਼ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ। ਸਾਜੁ = ਮਰਯਾਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, mi Verdadero Guru está Eternamente establecido."