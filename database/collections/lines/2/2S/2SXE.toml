[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੁ ਮਨੁ ਕਰਮਾ; ਇਹੁ ਮਨੁ ਧਰਮਾ ॥"
page = 415
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This mind does the deeds and this very mind practises truthfulness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਚਿੱਤ ਕੰਮ ਕਰਦਾ ਹੈ ਅਤੇ ਇਹ ਚਿੱਤ ਹੀ ਸਚਾਈ ਦੀ ਕਮਾਈ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This mind commits its deeds of karma, and this mind follows the Dharma."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹੀ ਮਨ ਕਰਮਕਾਂਡੀਓਂ ਮੇਂ ਮਿਲ ਕਰ ਕਰਮੋਂ ਕਾ ਕਰਨੇ ਵਾਲਾ ਬੈਠਤਾ ਹੈ ਇਹੀ ਮਨ ਧਰਮੀ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਹੈਰਾਨ ਹੋਇਆ) ਇਹ ਮਨ ਹੋਰ ਹੋਰ ਧਾਰਮਿਕ ਰਸਮਾਂ ਰੀਵਾਜ ਕਰਦਾ ਫਿਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਮਾ ਧਰਮਾ = ਧਾਰਮਿਕ ਰਸਮਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La mente nace de cinco elementos;"