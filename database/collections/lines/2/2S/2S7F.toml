[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਰਾਮਾ ਰਾਮ ਰਮਾ; ਕੰਠਿ ਉਰ ਧਾਰੀਐ ॥"
page = 925
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Install thou thy Omnipresent Lord Master God in thy throat and mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੇ ਸਰਬ-ਵਿਆਪਕ ਸੁਆਮੀ ਮਾਲਕ ਵਾਹਿਗੁਰੂ ਨੂੰ ਆਪਣੇ ਗਲੇ ਅਤੇ ਹਿਰਦੇ ਅੰਦਰ ਅਸਥਾਪਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Enshrine the Lord, Raam, Raam, Raam, Raam, within your heart and throat."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਰਾਮਾ) ਹੇ ਭਾਈ! (ਰਾਮਾ) ਜੋ ਇਸਤ੍ਰੀ, ਭਾਵ ਲਛਮੀ ਹੈ, ਤਿਸ ਕਾ ਪਤੀ ਜੋ ਹੈ ਰਾਮ (ਰਾਮਾ) ਸੁਖਾਂ ਕੇ ਦੇਨੇਹਾਰੇ ਤਿਸ ਕੋ ਕੰਠ ਮੇਂ ਔਰ ਉਰ ਮੇਂ ਧਾਰਨ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਸੋਹਣੇ ਰਾਮ ਨੂੰ ਸਦਾ ਹੀ ਗਲ ਵਿਚ ਹਿਰਦੇ ਵਿਚ ਪ੍ਰੋ ਰੱਖਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਮਾ = ਸੁੰਦਰ, ਸੋਹਣਾ। ਕੰਠਿ = ਗਲ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, enaltece a tu Señor, Ram, Ram, Ram, Ram, con tu garganta y tu corazón."