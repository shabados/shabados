[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗ੍ਰਿਹਿ ਸੋਭਾ ਜਾ ਕੈ ਰੇ ਨਾਹਿ ॥"
page = 872
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, in whose house is not the glory of wealth,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਘਰ ਵਿੱਚ ਮਾਇਆ ਦੀ ਪ੍ਰਭਤਾ ਨਹੀਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When someone's household has no glory,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਘਰ ਮੇਂ (ਸੋਭਾ) ਮਾਇਆ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਮਨੁੱਖ ਦੇ ਘਰ ਵਿਚ (ਘਰ ਦੀ ਸੁਹੱਪਣ) ਮਾਇਆ ਨਹੀਂ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗ੍ਰਿਹਿ = ਘਰ ਵਿਚ। ਜਾ ਕੈ ਗ੍ਰਿਹਿ = ਜਿਸ ਦੇ ਘਰ ਵਿਚ। ਸੋਭਾ = ਮਾਇਆ। ਰੇ = ਹੇ ਭਾਈ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando el hogar de alguien no tiene Gracia,"