[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਪੰਚ ਮਾਰਿ. ਬਿਦਾਰਿ ਗੁਦਾਰੇ; ਸੋ ਪੂਰਾ. ਇਹ ਕਲੀ ਰੇ ॥੧॥ ਰਹਾਉ ॥"
page = 404
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who passes his life having defeated and slain the five, is perfect in this Dark age. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੰਜਾਂ ਨੂੰ ਹਰਾ ਅਤੇ ਮਾਰ ਕੇ ਆਪਣਾ ਜੀਵਨ ਗੁਜਾਰਦਾ ਹੈ, ਉਹ ਇਸ ਕਾਲੇ ਸਮੇਂ ਅੰਦਰ ਪੂਰਨ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone, who conquers and defeats the five demons, is perfect in this Dark Age of Kali Yuga. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸੰਤ ਨੇ (ਮਾਰਿ) ਕਾਮਾਦਿਕ ਪੰਚ ਬਿਕਾਰ (ਬਿਦਾਰਿ) ਨਾਸ ਕਰ ਕੇ (ਗੁਦਾਰੇ) ਚਲਾਇ ਦੀਏ ਹੈਂ, ਸੋ ਇਸ ਕਲੀ ਮੇਂ ਪੂਰਨ ਹੂਆ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਵਿਚ ਉਹੀ ਮਨੁੱਖ ਪੂਰਨ ਹੈ ਜਿਸ ਨੇ ਇਹਨਾਂ ਪੰਜਾਂ ਨੂੰ ਮਾਰ ਕੇ ਲੀਰਾਂ ਲੀਰਾਂ ਕਰ ਦਿੱਤਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਰਿ = ਮਾਰ ਕੇ। ਬਿਦਾਰਿ = ਪਾੜ ਕੇ। ਗੁਦਾਰੇ = ਮੁਕਾ ਦਿੱਤੇ। ਇਹ ਕਲੀ = ਇਸ ਜਗਤ ਵਿਚ {ਲਫ਼ਜ਼ 'ਕਲੀ' ਇਥੇ 'ਜੁਗ' ਦਾ ਖ਼ਿਆਲ ਨਹੀਂ ਦੇ ਰਿਹਾ} ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, solamente aquél que ha conquistado los cinco enemigos es el Ser perfecto en esta época oscura.(1-Pausa)"