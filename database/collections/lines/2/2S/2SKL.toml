[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਪਤਿਤ; ਹੋਹਿ ਪੁਨੀਤ ॥"
page = 980
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remembering God, millions of sinners are sanctified."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦਾ ਆਰਾਧਨ ਕਰਨ ਦੁਆਰਾ, ਕ੍ਰੋੜਾਂ ਹੀ ਪਾਪੀ ਪਵਿੱਤਰ ਥੀ ਵੰਝਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and millions of sinners are sanctified."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੀ ਸੰਗਤ ਕਰ ਕੇ ਕ੍ਰੋੜਾਂ ਹੀ ਪਾਪੀ ਪਵਿਤ੍ਰ ਹੋਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਮ ਜਪ ਕੇ) ਕ੍ਰੋੜਾਂ ਵਿਕਾਰੀ ਪਵਿੱਤਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਟਿ = ਕ੍ਰੋੜਾਂ। ਪਤਿਤ = ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗੇ ਹੋਏ, ਵਿਕਾਰੀ। ਹੋਹਿ = ਹੋ ਜਾਂਦੇ ਹਨ। ਪੁਨੀਤ = ਪਵਿੱਤਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así es como millones de seres han sido redimidos."