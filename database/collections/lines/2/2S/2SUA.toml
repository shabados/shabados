[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਂਹਿ ਗਹੇ ਕੀ ਲਾਜ ਅਸ; ਗੋਬਿੰਦ ਦਾਸ ਤੁਹਾਰ ॥੮੬੪॥"
page = 290

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I, Govind, am Thy serf, kindly take (care of me and) protect my honour.864."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੁਹਾਨੂੰ ਬਾਂਹ ਫੜੇ ਦੀ ਲਾਜ ਹੈ, ਗੋਬਿੰਦ ਤੁਹਾਡਾ ਦਾਸ ਹਾਂ ॥੮੬੪॥"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਬਾਂਹਿ ਗਹੇ ਕੀ ਲਾਜ ਅਸ; ਗੋਬਿੰਦ ਦਾਸ ਤੁਹਾਰ ॥੨॥"