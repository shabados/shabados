data = "ਸੰਕਿ ਰਹਾ ਨਹਿ ਚੋਟ ਚਲਾਈ ॥"
page = 852

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After some thinking Raja changed his mind and did not shoot the arrow."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸ਼ੰਕਾ ਕਾਰਨ ਬਾਣ ਨਾ ਚਲਾਇਆ।"