type = "primary"
data = "ਕਿ ਆਯਦ ਬਜੰਗੇ ਚੁਨੀ ਮਾਹਰੋ ॥੭੩॥"
page = 1403

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "As the Chandra Mukhi was bent to fight out any body.(73)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੰਗ ਦੇ ਮੈਦਾਨ ਵਿਚ ਚੰਦ੍ਰਮਾ ਵਰਗੇ ਮੁਖ ਵਾਲੀ (ਰਾਜ ਕੁਮਾਰੀ) ਆਈ ਹੋਈ ਸੀ ॥੭੩॥"