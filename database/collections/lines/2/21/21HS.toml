[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇ ਵਡਭਾਗੀ; ਜਿਨੀ ਸਤਿਗੁਰੁ ਪਾਇਆ ॥"
page = 1059
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Very fortunate are they, who attain unto the True Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਰੇ ਨਸੀਬਾਂ ਵਾਲੇ ਹਨ ਉਹ, ਜੋ ਆਪਣੇ ਸੱਚੇ ਗੁਰਾਂ ਨੂੰ ਪ੍ਰਾਪਤ ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Very fortunate are those who find the True Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੇ ਵਡਭਾਗੀ ਹੈਂ ਜਿਨੋਂ ਨੇ ਸਤਿਗੁਰੂ ਕੋ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਭਾਗਾਂ ਵਾਲੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਗੁਰੂ ਮਿਲ ਪਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇ = ਉਹ {ਬਹੁ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, benditos son aquéllos que han logrado al Guru"