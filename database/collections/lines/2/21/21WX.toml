data = "ਬ︀ਯਾਹਨ ਕੋ ਦੋਊ ਲਲਚਾਏ ॥੧੧॥"
page = 972

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They approached Tilotama (the woman) and both yearned to marry her.(11)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਉਸ ਨਾਲ) ਵਿਆਹ ਕਰਾਉਣ ਲਈ ਦੋਵੇਂ ਲਲਚਾਏ ॥੧੧॥"