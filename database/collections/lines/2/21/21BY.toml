[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਈਹਾ ਊਹਾ; ਕਾਮਿ ਨ ਪ੍ਰਾਨੀ ॥੧॥"
page = 394
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Here and hereafter such a mortal is of no avail."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਏਥੇ ਅਤੇ ਓਥੇ ਐਸਾ ਜੀਵ ਕਿਸੇ ਕੰਮ ਦਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Here and hereafter, such a mortal is useless. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰੁ ਵਹੁ ਪ੍ਰਾਨੀ (ਈਹਾਂ ਊਹਾਂ), ਭਾਵ ਲੋਕ ਪ੍ਰਲੋਕ ਮੇਂ ਕਿਸੀ ਕਾਮ ਕਾ ਨਹੀਂ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਜੀਵ ਲੋਕ ਪਰਲੋਕ ਵਿਚ ਕਿਸੇ ਕੰਮ ਨਹੀਂ ਆਉਂਦਾ (ਉਸ ਦਾ ਜੀਵਨ ਵਿਅਰਥ ਹੋ ਜਾਂਦਾ ਹੈ) ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਈਹਾ = ਇਸ ਲੋਕ ਵਿਚ। ਊਹਾ = ਪਰਲੋਕ ਵਿਚ। ਕਾਮਿ ਨ = ਕਿਸੇ ਕੰਮ ਨਹੀਂ ਆਉਂਦਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y vana es la vida tanto aquí como en el más allá. (1)"