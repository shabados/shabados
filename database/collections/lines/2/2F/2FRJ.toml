[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤ੍ਰਿਸਨਾ ਭੁਖ ਵਿਚਹੁ ਉਤਰੈ; ਸੁਖੁ ਵਸੈ ਮਨਿ ਆਈ ॥"
page = 511
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thirst and hunger depart from within him and peace comes to abide in his mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤ੍ਰੇਹ ਅਤੇ ਖੁਦਿਆ ਉਸ ਦੇ ਅੰਦਰੋਂ ਨਿਕਲ ਜਾਂਦੇ ਹਨ ਅਤੇ ਆਰਾਮ ਆ ਕੇ ਉਸ ਦੇ ਚਿੱਤ ਵਿੱਚ ਟਿਕ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Hunger and thirst depart from within, and peace comes to dwell in the mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤ੍ਰਿਸਨਾ ਰੂਪ ਖੁਧ੍ਯਾ ਅੰਤਸਕਰਨ ਮੇਂ ਸੇ ਉਤਰ ਜਾਤੀ ਹੈ, ਇਸ ਜੀਵ ਕੇ ਮਨ ਮੇਂ ਸੁਖ ਆਇ ਕਰ ਬਸਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦੀ ਤ੍ਰਿਸਨਾ ਭੁੱਖ ਵਿਚੋਂ ਉਤਰਦੀ ਹੈ, ਮਨ ਵਿਚ ਸੁਖ ਆ ਵੱਸਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno se sobrepone a la sed y al hambre, y la Paz habita en la mente."