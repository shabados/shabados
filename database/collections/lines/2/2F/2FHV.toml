[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਸਰਣਾਈ. ਜੋਹਿ ਨ ਸਾਕੈ; ਦੂਤੁ. ਨ ਸਕੈ ਸੰਤਾਈ ॥"
page = 504
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In Guru's sanctuary, death's myrmidon cannot harass the man or even look at him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਸ਼ਰਣਾਗਤ ਅੰਦਰ ਮੌਤ ਦਾ ਫਰੇਸ਼ਤਾ ਬੰਦੇ ਨੂੰ ਦੁੱਖ ਨਹੀਂ ਦੇ ਸਕਦਾ, ਸਗੋਂ ਉਸ ਵੱਲ ਵੇਖ ਹੀ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Guru's Sanctuary, the Messenger of Death cannot see the mortal, or torture him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਗੁਰੋਂ ਕੀ ਸਰਣ ਲੀ ਹੈ, ਤਿਨ ਕੋ ਜਮ ਕੇ ਦੂਤ ਨ ਦੁਖ ਦੇ ਸਕਤੇ ਹੈਂ ਨਾ ਦੇਖ ਸਕਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਰਨ ਪਏ ਬੰਦਿਆਂ ਨੂੰ ਆਤਮਕ ਮੌਤ ਤੱਕ ਭੀ ਨਹੀਂ ਸਕਦੀ, ਉਹਨਾਂ ਨੂੰ ਸਤਾ ਨਹੀਂ ਸਕਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋਹਿ ਨ ਸਾਕੈ = ਤੱਕ ਨਹੀਂ ਸਕਦਾ। ਦੂਤ = ਵੈਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En el Santuario del Guru la muerte no los atrapa y no hay dolor,"