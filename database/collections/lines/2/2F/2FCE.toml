[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਸਹਜੇ ਨਾਮਿ ਸਮਾਇਆ ॥੪॥੭॥"
page = 1174
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, he is easily absorbed in the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਊਹ ਸੁਖੈਨ ਹੀ ਸਾਹਿਬ ਦੇ ਨਾਮ ਅੰਦਰ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, he is intuitively absorbed in the Naam, the Name of the Lord. ||4||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਵਹੁ ਪੁਰਸੁ ਸਹਜੇ ਹੀ ਨਾਮੀ ਵਾਹਿਗੁਰੂ ਮੇਂ ਅਭੇਦ ਹੂਆ ਹੈ॥੪॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਸਦਾ ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਹਰਿ-ਨਾਮ ਵਿਚ ਲੀਨ ਰਹਿੰਦਾ ਹੈ ॥੪॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜੇ = ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ। ਨਾਮਿ = ਨਾਮ ਵਿਚ ॥੪॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "logran el Éxtasis y de forma espontánea se inmergen en el Naam, el Nombre del Señor. (4-7)"