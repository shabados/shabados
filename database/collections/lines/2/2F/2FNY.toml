[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੁਖ ਮਾਰ ਹੀ ਮਾਰ ਪੁਕਾਰਿ ਪਰਿਯੋ; ਦਲੁ ਜਾਦਵ ਕੋ ਸਿਗਰੋ ਬਿਡਰਿਯੋ ॥੧੧੦੬॥"
page = 408

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He shouted “kill, kill” from his mouth and seeing him, the forces of Yadavas broke into fragments.1106."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੂੰਹ ਤੋਂ 'ਮਾਰ ਲੌ, ਮਾਰ ਲੌ' ਹੀ ਪੁਕਾਰ ਰਿਹਾ ਹੈ, (ਜਿਸ ਨੂੰ ਸੁਣ ਕੇ) ਯਾਦਵਾਂ ਦਾ ਸਾਰਾ ਦਲ ਘਬਰਾ ਗਿਆ ਹੈ ॥੧੧੦੬॥"