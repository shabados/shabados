[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਤਿ ਦੁਰਬਲ ਕੋ ਭੇਸ ਕਰਿ ਸਭ ਬਸਤ੍ਰਨ ਕੋ ਤ︀ਯਾਗ ॥੫॥"
page = 886

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘And disguised as a pauper, you remain there standing.’(5)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਦੁਰਬਲ ਦਾ ਭੇਸ ਬਣਾ ਕੇ ਖੜੋ ਜਾਣਾ ॥੫॥"