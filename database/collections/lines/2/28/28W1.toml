[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਹਿਮਾ ਕਹੀ ਨ ਜਾਇ; ਗੁਰ ਸਮਰਥ ਦੇਵ ॥"
page = 522
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The glory of the Omnipotent and bright Guru, cannot be described."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਰਬ-ਸ਼ਕਤੀਵਾਨ ਅਤੇ ਪ੍ਰਕਾਸ਼ਵਾਨ ਗੁਰਾਂ ਦੀ ਉਪਮਾ ਬਿਆਨ ਕੀਤੀ ਨਹੀਂ ਜਾ ਸਕਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Glory of the all-powerful Divine Guru cannot be described."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਸਮਰਥ ਗੁਰਦੇਵ ਕੀ ਸੋਭਾ ਕਹੀ ਨਹੀਂ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੱਤਿਆ ਵਾਲੇ ਗੁਰਦੇਵ ਦੀ ਵਡਿਆਈ ਬਿਆਨ ਨਹੀਂ ਕੀਤੀ ਜਾ ਸਕਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਹਿਮਾ = ਵਡਿਆਈ। ਸਮਰਥ = ਤਾਕਤ ਵਾਲਾ, ਸੱਤਿਆ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno no puede describir la Gloria del Todopoderoso Señor;"