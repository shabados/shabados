[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਹਲਾਦ ਉਧਾਰੇ; ਕਿਰਪਾ ਧਾਰੀ ॥੪॥"
page = 224
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord showered His benediction and saved Prahlad."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਨੇ ਆਪਣੀ ਮਿਹਰ ਕੀਤੀ ਅਤੇ ਪ੍ਰਹਲਾਦ ਨੂੰ ਬਚਾ ਲਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He bestowed His Mercy, and saved Prahlaad. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ੍ਹੋਂ ਨੈ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਅਪਨੇ ਭਗਤਿ ਪ੍ਰਹਲਾਦ ਕੋ ਬਚਾਇ ਲੀਆ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਮਿਹਰ ਕੀਤੀ ਤੇ ਪ੍ਰਹਿਲਾਦ ਦੀ ਰੱਖਿਆ ਕੀਤੀ (ਹਰਣਾਖਸ ਦਾ ਮਾਣ ਤੋੜਿਆ) ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así, por Su Gracia, salvó a Su Devoto Prelada.(4)"