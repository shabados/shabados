[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੈ ਸਬਦਿ ਮਨੁ ਤਨੁ ਰਪੈ; ਹਰਿ ਸਿਉ ਰਹੈ ਸਮਾਇ ॥੩੦॥"
page = 756
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's instruction man's soul and body are imbued and he remains blended with the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਦੁਆਰਾ ਬੰਦੇ ਦੀ ਆਤਮਾ ਤੇ ਦੇਹ ਰੰਗੇ ਜਾਂਦੇ ਹਨ ਤੇ ਉਹ ਸਾਈਂ ਨਾਲ ਅਭੇਦ ਹੋਇਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When one's mind and body are attuned to the Word of the Guru's Shabad, one remains merged in the Lord. ||30||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਗੁਰੋਂ ਕੇ ਉਪਦੇਸ਼ ਮੇਂ ਜੋ ਮਨ ਤਨ ਕਰ ਕੇ ਰੰਗੇ ਗਏ ਹੈਂ ਵਹੁ ਹਰੀ ਕੇ ਸਾਥ ਅਭੇਦ ਹੋ ਰਹੇ ਹੈਂ॥੩੦॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦਾ ਮਨ ਅਤੇ ਤਨ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਵਿਚ ਰੰਗਿਆ ਜਾਂਦਾ ਹੈ, ਉਹ ਸਦਾ ਪਰਮਾਤਮਾ ਵਿਚ ਲੀਨ ਰਹਿੰਦਾ ਹੈ ॥੩੦॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ ਸਬਦਿ = ਦੇ ਸ਼ਬਦਿ ਵਿਚ। ਸਿਉ = ਨਾਲ ॥੩੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el cuerpo y la mente están imbuidos en la Palabra del Shabd del Guru, uno se inmerge en Dios. (30)"