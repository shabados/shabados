[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਈ ਮਰਦੁ ਮਰਦੁ ਮਰਦਾਨਾ ॥"
page = 1084
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he is the manliest man amongst men."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਇਨਸਾਨਾਂ ਵਿਚੋਂ ਪਰਮ ਵਰੀਆਮ ਇਨਸਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "is the manliest man among men."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਮਰਦਾਂ ਵਿਖੈ (ਮਰਦਾਨਾ) ਬਹਾਦਰ ਮਰਦ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਵਿਕਾਰਾਂ ਦੇ ਟਾਕਰੇ ਤੇ) ਉਹੀ ਮਨੁੱਖ ਸੂਰਮਾ ਮਰਦ (ਸਾਬਤ ਹੁੰਦਾ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਰਦਾਨਾ = ਸੂਰਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo será un Sheik, un Yayi, sí, sólo será el Sirviente de Dios,"