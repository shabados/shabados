type = "primary"
data = "ਪਸ਼ੇਮਾ ਸ਼ਵਦ ਸੁਖ਼ਨ ਗੁਫ਼ਤਨ ਫ਼ਜ਼ੂਲ ॥"
page = 1406

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He repented on the unintended words he had spoken,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸੁਭਟ ਸਿੰਘ) ਆਪਣੇ ਵਿਅਰਥ ਦੇ ਬੋਲਾਂ ਉਤੇ ਸ਼ਰਮਿੰਦਾ ਹੋਇਆ ਅਤੇ ਕਹਿਣ ਲਗਿਆ।"