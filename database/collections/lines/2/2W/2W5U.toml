[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਪੂਰਨ ਹੋਈ ਆਸਾ ॥"
page = 622
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My hearts desire is fulfilled,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਦਿਲ ਦੀ ਖਾਹਿਸ਼ ਪੁਰੀ ਹੋ ਗਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind's desires have been fulfilled;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਸਭ ਆਸਾ ਮਨ ਕੀ ਪੂਰਨ ਹੋਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਨ ਦੀ (ਇਹ ਚਿਰਾਂ ਦੀ) ਆਸ ਪੂਰੀ ਹੋ ਗਈ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y los deseos de mi mente han sido cumplidos."