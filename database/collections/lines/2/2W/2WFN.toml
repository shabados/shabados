[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੈ ਵਿਚਿ; ਆਡਾਣੇ ਆਕਾਸ ॥"
page = 464
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In Lord's fear is stretched the sky."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਦੇ ਡਰ ਅੰਦਰ ਅਸਮਾਨ ਤਣਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Fear of God, the Akaashic ethers are stretched across the sky."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਕਾਸ ਭੀ (ਆਡਾਣੇ) ਛਾਏ ਹੂਏ ਵਾ ਨਿਰਾਸ੍ਰਯ ਹੈ, ਸੋ ਭੀ ਭਯ ਮੇਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਉੱਪਰ ਤਣੇ ਹੋਏ ਅਕਾਸ਼ (ਜੋ ਦਿੱਸਦੇ ਹਨ, ਇਹ ਭੀ) ਭੈ ਵਿਚ ਹੀ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਡਾਣੇ = ਤਣੇ ਹੋਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Reverencia a Él, el cielo se extiende sobre la tierra."