[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਪਾਵੈ; ਸੋ ਆਣਿ ਦਿਖਾਵੈ ॥"
page = 1072
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever he finds, he comes and shows that to his bride."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁੱਛ ਉਸ ਨੂੰ ਲੱਭਦਾ ਹੈ ਉਸ ਨੂੰ ਉਹ ਆਪਣੀ ਪਤਨੀ ਨੂੰ ਆ ਵਿਖਾਲਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever he finds, he brings to show his bride."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪਤੀ ਕੋ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ, ਸੋ ਆਇਕੇ ਦਿਖਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਝ ਉਸ ਨੂੰ ਲੱਭਦਾ ਹੈ, ਉਹ ਲਿਆ ਕੇ (ਆਪਣੀ ਕਾਇਆਂ-ਇਸਤ੍ਰੀ ਨੂੰ) ਵਿਖਾ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਵੈ = ਹਾਸਲ ਕਰਦਾ ਹੈ। ਜੋ = ਜੋ ਕੁਝ। ਆਣਿ = ਲਿਆ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "corre a enseñárselo a su amor."