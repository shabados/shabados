[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਰੁ ਲੋਕ ਬੁਲਾਇ ਸਬੈ ਬ੍ਰਿਜ ਕੈ; ਬਹੁ ਦਾਨ ਦਯੋ ਤਿਨ ਮੰਗਨ ਕੋ ॥"
page = 300

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Inviting all the people of Braja, Nand and Yashod gave good deal of alms by touching them with the head and other limbs of Krishna"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਅਨੇਕ ਪਦਾਰਥ) ਬ੍ਰਜ ਦੇ ਸਾਰੇ ਮੰਗਤਿਆਂ ਨੂੰ ਬੁਲਾ ਕੇ ਦਾਨ ਕਰ ਦਿੱਤੇ।"