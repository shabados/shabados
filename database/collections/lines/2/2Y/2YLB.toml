[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਚਾਖਿਆ; ਤਿਨਿ ਦਰਸਨੁ ਡੀਠਾ ॥"
page = 1032
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whosoever tastes it, he sees the Lord's vision."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੋਈ ਭੀ ਇਸ ਨੂੰ ਛਕਦਾ ਹੈ, ਉਹ ਸਾਈਂ ਦੇ ਦੀਦਾਰ ਨੂੰ ਵੇਖ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whoever tastes it, sees the Blessed Vision of the Lord's Darshan."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਇਸ ਰਸ ਕੋ ਚਾਖਿਆ ਹੈ ਤਿਸ ਨੇ ਭਗਵੰਤ ਕਾ ਦਰਸਨੁ ਡੀਠਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਇਹ ਸੁਆਦ ਚੱਖਿਆ ਹੈ ਉਸ ਨੇ ਪਰਮਾਤਮਾ ਦਾ ਦੀਦਾਰ ਕਰ ਲਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ ਮਨੁੱਖ ਨੇ। ਤਿਨਿ = ਉਸ (ਮਨੁੱਖ) ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y quien sea que la prueba, logra la Visión de Dios."