[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਕਛੁ ਕਰੈ; ਸੋਈ ਸੁਖੁ ਮਾਨੁ ॥"
page = 283
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever He does deem that as good."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਝ ਉਹ ਕਰਦਾ ਹੈ ਉਸ ਨੂੰ ਭਲਾ ਕਰਕੇ ਜਾਣ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever He does - take comfort in that."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਛ ਵਾਹਿਗੁਰੂ ਕਰੈ ਸੋਈ ਸੁਖ ਰੂਪ ਮਾਨ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਝ ਪ੍ਰਭੂ ਕਰਦਾ ਹੈ ਉਸੇ ਨੂੰ ਸੁਖ ਸਮਝ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Recibe con gusto lo que de Él proviene"