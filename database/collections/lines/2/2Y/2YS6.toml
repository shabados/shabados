[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਧਰਤੀ ਅਤੇ ਆਕਾਸ਼ ਉੱਤੇ ਰੌਸ਼ਨ ਕਰ ਦਿੱਤਾ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਕਰਦ ਰੌਸ਼ਨ ਦਰ ਜ਼ਮੀਨੋਂ ਆਸਮਾਂ ॥੪੩੧॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Made them refulgent on both the earth and the sky. (431)"