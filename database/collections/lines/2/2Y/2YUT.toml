[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਜਾਨਉ; ਬੈਕੁੰਠੁ ਹੈ ਕਹਾਂ ॥੧॥ ਰਹਾਉ ॥"
page = 1161
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I know not where heaven is. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਨਹੀਂ ਜਾਣਦਾ ਕਿ ਬਹਿਸ਼ਤ ਕਿੱਥੇ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but I do not even know where heaven is. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਮੈਂ ਨਹੀਂ ਜਾਨਤਾ ਕਿ ਬੈਕੁੰਠ ਕਹਾਂ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਮੈਨੂੰ ਤਾਂ ਸਮਝ ਨਹੀਂ ਆਈ, (ਇਹਨਾਂ ਦਾ ਉਹ) ਬੈਕੁੰਠ ਕਿੱਥੇ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾ ਜਾਨਉ = ਮੈਂ ਨਹੀਂ ਜਾਣਦਾ, ਮੈਨੂੰ ਤਾਂ ਪਤਾ ਨਹੀਂ। ਕਹਾਂ = ਕਿੱਥੇ? ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en verdad no sé en dónde queda ese cielo del que tanto hablan. (1-Pausa)"