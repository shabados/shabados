[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਹਜ ਧੁਨਿ ਗਾਵੈ ਮੰਗਲ ਮਨੂਆ; ਅਬ ਤਾ ਕਉ ਫੁਨਿ ਕਾਲੁ. ਨ ਖਾਇ ॥੩॥"
page = 373
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My mind sing the natural melody of Lord's praise, and now death will, no, more, eat it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਮਨ ਸੁਭਾਵਕ ਸਾਹਿਬ ਦੇ ਜੱਸ ਦਾ ਰਾਗ ਗਾਇਨ ਕਰਦਾ ਹੈ, ਅਤੇ ਹੁਣ ਮੌਤ ਇਸ ਨੂੰ ਮੁੜ ਕੇ ਨਹੀਂ ਖਾਊਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind sings the celestial melody of bliss, and death shall no longer consume it. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ (ਸਹਜ ਧੁਨਿ) ਸਾਂਤਿ ਰੂਪ ਸਬਦੋਂ ਕਰ ਮੇਰਾ ਮਨ ਹਰਿ ਕੇ ਮੰਗਲ ਰੂਪ ਗੁਣ ਗਾਉਤਾ ਹੈ। (ਤਾ ਕਉ) ਤਿਸ ਮੇਰੇ ਮਨ ਕੋ (ਫੁਨਿ) ਫੇਰ ਕਾਲ ਨ ਖਾਏਗਾ ਅਰਥਾਤ ਜਨਮ ਮਰਨ ਨਹੀਂ ਹੋਇਗਾ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਮਨ ਆਤਮਕ ਅਡੋਲਤਾ ਦੀ ਸੁਰ ਵਿਚ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੇ ਗੀਤ ਗਾਂਦਾ ਰਹਿੰਦਾ ਹੈ, ਹੁਣ ਇਸ ਮਨ ਨੂੰ ਕਦੇ ਆਤਮਕ ਮੌਤ ਹੜੱਪ ਨਹੀਂ ਕਰਦੀ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜ ਧੁਨਿ = ਆਤਮਕ ਅਡੋਲਤਾ ਦੀ ਸੁਰ ਨਾਲ। ਮੰਗਲ = ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੇ ਗੀਤ। ਤਾ ਤਉ = ਉਸ (ਮਨ) ਨੂੰ। ਫੁਨਿ = ਫਿਰ, ਮੁੜ। ਕਾਲੁ = ਆਤਮਕ ਮੌਤ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi mente entona la Melodía Sublime del Equilibrio y el tiempo no la devora más. (3)"