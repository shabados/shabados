[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਨਾਮੁ; ਜਪੀਐ ਸਾਧਸੰਗਿ ॥"
page = 1150
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Associating with the saints, dwell thou upon the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤਾਂ ਦੀ ਸੰਗਤ ਕਰਕੇ, ਤੂੰ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chant the Name of the Lord in the Saadh Sangat, the Company of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਤਿਸੰਗ ਕਰ ਹਰੀ ਕਾ ਨਾਮੁ ਜਪਣਾ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਾਧ ਸੰਗਤ ਵਿਚ (ਰਹਿ ਕੇ) ਜਪਿਆ ਜਾ ਸਕਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਪੀਐ = ਜਪਿਆ ਜਾ ਸਕਦਾ ਹੈ। ਸਾਧ ਸੰਗਿ = ਸਾਧ ਸੰਗਤ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno debe meditar en el Nombre de Dios,"