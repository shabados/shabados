[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਭਾਵੈ; ਲਏ ਮਿਲਾਇ ॥"
page = 1175
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Lord wills He blends man with Himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਪ੍ਰਭੂ ਨੂੰ ਭਾਊਦਾ ਹੈ, ਊਹ ਬੰਦੇ ਨੂੰ ਨਾਲ ਮਿਲਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When God so wills, He merges the mortal into Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪਰਮੇਸ੍ਵਰ ਕੋ ਭਾਵਤਾ ਹੈ ਤਿਸ ਕੋ ਆਪ ਹੀ ਮਿਲਾਇ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਉਤੇ ਪ੍ਰਭੂ ਆਪ ਹੀ ਮਿਹਰ ਕਰਦਾ ਹੈ ਉਸ ਨੂੰ ਆਪਣੇ ਨਾਲ ਜੋੜ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਵੈ = ਚੰਗਾ ਲੱਗਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es sólo cuando Dios así lo desea que nos une en Su Ser."