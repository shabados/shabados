[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋਤੀ ਜੋਤਿ ਮਿਲਾਵਣਹਾਰਾ ॥੫॥"
page = 411
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God is the Blender of human light with the Divine Light."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਮਨੁੱਖੀ ਪਰਕਾਸ਼ ਨੂੰ ਈਸ਼ਵਰੀ-ਪ੍ਰਕਾਸ਼ ਨਾਲ ਅਭੇਦ ਕਰਨ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the One who blends one's light with the Divine Light. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਸੀ ਕੀ ਜੋਤਿ ਕੋ (ਜੋਤੀ) ਹਰੀ ਅਪਨੇ ਮੇਂ ਮਿਲਾਉਣੇ ਹਾਰ ਹੂਆ ਹੈ॥੫॥☬ਪੂਰਬੋਕਤ ਸਾਧਨ ਕਰ ਜੋ ਮੁਕਤਿ ਹੂਆ ਹੈ ਤਿਸ ਕੇ ਲਛਣ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੀ ਜੋਤਿ ਨੂੰ ਪਰਮਾਤਮਾ ਦੀ ਜੋਤਿ ਵਿੱਚ ਮਿਲਾ ਲੈਂਦਾ ਹੈ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋਤੀ = ਪਰਮਾਤਮਾ ਦੀ ਜੋਤਿ ਵਿਚ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así es como la luz de uno se difunde en la Luz Divina. (5)"