type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਸਕਲ ਬਿਚਾਰੋ ॥੭੯੭॥"
page = 759

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Utter the word “Paanini”, then speak the words “Jaa-char-shatru” and tin this way comprehend all the names of Tupak.797."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਲੋਗ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝੋ ॥੭੯੭॥"