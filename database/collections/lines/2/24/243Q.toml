[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਧਿਕ ਤਰੁਨਿ ਰੁਚਿ ਮਾਨਿ; ਤਰੁਨਿ ਜਾ ਸੋ ਹਿਤ ਕਰਹੀ ॥"
page = 835

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "For whosoever she makes mind for, she becomes naked before him,"

[[content]]
assets = ["RSJD"]
type = "translation"
