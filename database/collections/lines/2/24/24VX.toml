[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਕਰਮੀ ਇਹ ਮਤਿ ਪਾਈ ॥"
page = 85
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, by God's grace this understanding is obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਵਾਹਿਗੁਰੂ ਦੀ ਰਹਿਮਤ ਦੁਆਰਾ ਇਹ ਸਮਝ ਪਰਾਪਤ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, by His Mercy, this understanding is obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਨ ਕੇ ਸੁਭ ਕਰਮ ਹੈਂ ਤਿਨ੍ਹੋਂ ਨੇ ਇਹ ਮਤਿ ਪਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ, ਹੇ ਨਾਨਕ!) ਪ੍ਰਭੂ ਮਿਹਰ ਕਰੇ ਤਾਂ (ਭਾਣਾ ਮੰਨਣ ਵਾਲੀ ਇਹ) ਸਮਝ ਮਿਲਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਮੀ = ਮਿਹਰ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, por Su Gracia la lección es aprendida,"