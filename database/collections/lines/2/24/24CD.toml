[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਰਮ ਖੰਡ ਕਾ; ਏਹੋ ਧਰਮੁ ॥"
page = 7
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This aforesaid is the moral duty of the realm of righteousness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ੳਪਰੋਕਤ ਦਸਿਆ ਇਖਲਾਕੀ ਫਰਜ਼ ਸਚਾਈ ਦੇ ਮੰਡਲ ਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is righteous living in the realm of Dharma."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਰਮ ਕਾਂਡ ਕਾ ਏਹੋ ਹੀ ਪ੍ਰਕਾਰੁ ਹੈ, ਜੈਸੇ ਪੂਰਬ ਤੁਕੋਂ ਮੇਂ ਕਥਨ ਕੀਆ ਹੈ। ਵਾ \"ਧਰਮ ਖੰਡ ਕਾ ਏਹੋ ਧਰਮੁ॥\" ਕਹੀਏ ਕਰਮ ਕਾਂਡ ਕਾ ਇਸੀ ਰੀਤ ਕਾ ਧਰਮੁ ਹੈ - ਜੈਸਾ ਕਰਮੁ ਕਰੇ ਤੈਸਾ ਫਲੁ ਭੁਗਾ ਦੇਣ॥☬ਪ੍ਰਸ਼ਨ: ਗਿਯਾਂਨ ਕਾਂਡ ਕੀ ਰੀਤੀ ਕਹੋ?☬ਉੱਤਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਧਰਮ ਖੰਡ ਦਾ ਨਿਰਾ ਇਹੀ ਕਰਤੱਬ ਹੈ, (ਜੋ ਉੱਪਰ ਦੱਸਿਆ ਗਿਆ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਰਮੁ = ਮਨਤਵ, ਕਰਤੱਬ। ਆਖਹੁ = ਦੱਸੋ, ਵਰਣਨ ਕਰੋ, ਸਮਝ ਲਵੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora después de hablar de la rectitud y servicio en el ámbito del Dharma,"