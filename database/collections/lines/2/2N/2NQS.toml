[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਹ ਕਾਹਿ ਗੁਪਾਲ ਕੋ ਨਾਮੁ ਭਨੰ ॥"
page = 167

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Only Hiranayakashipu is considered the mithty-one in water and on land , then why are you repeating the name of Lord-God”?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਹ ਕਿਸ ਲਈ ਗੋਪਾਲ ਦਾ ਨਾਂ ਜਪਦਾ ਹੈ।"