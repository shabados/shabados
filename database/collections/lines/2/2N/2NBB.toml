[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਬ ਨ੍ਰਿਪ ਮਨ ਮੈ ਕ੍ਰੋਧ ਬਢਾਯੋ; ਸ੍ਰੀਪਤਿ ਕੋ ਗੁਨ ਗਾਯੋ ॥"
page = 455

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Krishna, in fury, fell on the enemy powerfully, taking up his bow in his hand, then, getting infuriated, the king eulogised the Lord in his mind"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਰਾਜਾ (ਖੜਗ ਸਿੰਘ) ਨੇ ਮਨ ਵਿਚ ਕ੍ਰੋਧ ਵਧਾ ਕੇ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਦੇ ਗੁਣਾਂ ਦਾ ਗਾਇਨ ਕੀਤਾ।"