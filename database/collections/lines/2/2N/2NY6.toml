[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਆ ਗੁਣ ਤੇਰੇ ਆਖਿ ਵਖਾਣਾ; ਪ੍ਰਭ ਅੰਤਰਜਾਮੀ ਜਾਨੁ ॥"
page = 979
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What virtues of Thine can I utter and describe? Thou art the Inner-Knower and the Omniscient Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੀਆਂ ਕਿਹੜੀਆਂ ਕਿਹੜੀਆਂ ਨੇਕੀਆਂ ਵਰਨਣ ਤੇ ਬਿਆਨ ਕਰ ਸਕਦਾ ਹਾਂ? ਤੂੰ ਅੰਦਰਲੀਆਂ-ਜਾਣਨਹਾਰ ਸ੍ਰਵੱਗ ਸੁਆਮੀ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What Glorious Virtues of Yours should I chant? O God, You are the Inner-knower, the Searcher of hearts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕਿਆ ਤੇਰੇ ਗੁਣਾਂ ਕੋ ਏਕ ਮੁਖ ਸੇ ਕਥਨ ਕਰੋਂ। ਹੇ ਪ੍ਰਭੂ ਅੰਤਰਜਾਮੀ! ਤੂੰ ਸਭ ਕੁਛ ਜਾਨਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਸੁਜਾਨ ਹੈਂ, ਤੂੰ ਹਰੇਕ ਦੇ ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲਾ ਹੈਂ, ਮੈਂ ਤੇਰੇ ਕਿਹੜੇ ਕਿਹੜੇ ਗੁਣ ਦੱਸ ਕੇ ਗਿਣਾਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਖਿ = ਆਖ ਕੇ। ਵਖਾਣਾ = ਵਖਾਣਾਂ, ਮੈਂ ਬਿਆਨ ਕਰਾਂ। ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਅੰਤਰਜਾਮੀ = ਹਰੇਕ ਦੇ ਅੰਦਰ ਦੀ ਜਾਣਨ ਵਾਲਾ। ਜਾਨੁ = ਸੁਜਾਨ, ਸਿਆਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Conocedor íntimo de los corazones, ¿cuáles de Tus Méritos podría mencionar?"