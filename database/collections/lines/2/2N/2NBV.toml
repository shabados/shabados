type = "primary"
data = "ਨਮਸਤਸਤੁ ਅਜਬੇ ॥੧੭॥"
page = 2
line = 12

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਨਮਸਤਸਤ ਦਾ ਉਚਾਰਨ ਨਮਸਤ-ਸੱਤ ਨਹੀਂ ਕਰਨਾ। ਇਹ ਸ਼ਬਦ ਨਮਸਤ+ਅਸਤ ਦਾ ਸੰਧੀ ਵਾਚੀ ਸ਼ਬਦ ਹੈ।"

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Salutation to Thee O Wonderful Lord! 17"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਜਬ ਸਰੂਪ ਵਾਲੇ! ਤੈਨੂੰ ਨਮਸਕਾਰ ਹੈ ॥੧੭॥"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਨਮਸਤੱਸਤੁ, ਅਜਬੇ ॥੧੭॥"