[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਾਰ ਧਾਰ ਧਰ ਧੂਮ ਮੁਕਤ ਬੰਧਨ ਤੇ ਛੁੱਟੇ ॥"
page = 53

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Enduring the somokeless fire of the steel-edge, they have saved themselves from the bondages."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਧੂੰਏ ਤੋਂ ਬਿਨਾ (ਅੱਗ) ਵਰਗੇ ਹਥਿਆਰਾਂ (ਲੋਹੇ) ਦੀ ਧਾਰ ਸਹਿ ਕੇ ਸੰਸਾਰਿਕ ਬੰਧਨਾਂ ਤੋਂ ਛੁਟ ਗਏ ਹਨ।"