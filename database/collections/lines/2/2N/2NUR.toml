[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਸਬ ਨਾਮਹੇ ਖ਼ੁਦ ਬ ਬਹਿਮਨ ਸਪੁਰਦ ॥੩॥"
page = 1410

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He conferred the sovereignty to his son, Bahmin.(3)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਸ ਨੇ ਆਪਣੀ ਰਾਜ-ਗੱਦੀ (ਆਪਣੇ ਪੁੱਤਰ) ਬਹਿਮਨ ਦੇ ਸਪੁਰਦ ਕਰ ਦਿੱਤੀ ॥੩॥"