[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦ੍ਰੁਲਭ ਦੇਹ ਕਾ; ਕਰਹੁ ਉਧਾਰੁ ॥"
page = 293
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Like this save thy scarcely obtainable human body."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਤੂੰ ਆਪਣੇ ਮੁਸ਼ਕਲ ਨਾਲ ਮਿਲਣ ਵਾਲੇ ਮਨੁੱਖੀ ਸਰੀਰ ਦਾ ਪਾਰ ਉਤਾਰਾ ਕਰ ਲੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Redeem this human body, so difficult to obtain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤੇ ਇਸ ਦੁਰਲਭ ਦੇਹ ਕਾ ਉਧਾਰ ਕਰ ਲੇਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਇਸ (ਮਨੁੱਖਾ-) ਸਰੀਰ ਦਾ ਬਚਾਉ ਕਰੋ ਜੋ ਬੜੀ ਮੁਸ਼ਕਿਲ ਨਾਲ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਧਾਰੁ = ਬਚਾਉ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canta las Palabras Ambrosiales de las Alabanzas Gloriosas del Señor,"