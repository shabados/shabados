[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਬੋਹਿਥ; ਸਾਗਰ ਨਹੀ ਵਾਟ ॥"
page = 226
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the boat, voyage across an ocean cannot be had."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿਸ਼ਤੀ ਦੇ ਬਗੈਰ ਸਮੁੰਦਰ ਦਾ ਸਫ਼ਰ ਕੀਤਾ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without a boat, you cannot cross over the ocean."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਬਿਨਾ (ਬੋਹਿਥ) ਜਹਾਜ ਕੇ ਸਮੁੰਦਰ ਕਾ ਰਸਤਾ ਨਹੀਂ ਚਲਾ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਜਹਾਜ਼ ਤੋਂ ਬਿਨਾ ਸਮੁੰਦਰ ਦਾ ਸਫ਼ਰ ਨਹੀਂ ਹੋ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੋਹਿਥ = ਜਹਾਜ਼। ਸਾਗਰ ਵਾਟ = ਸਮੁੰਦਰ ਦਾ ਸਫ਼ਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Puede uno cruzar el mar sin un vehículo?"