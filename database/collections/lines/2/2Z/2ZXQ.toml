[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਕਾ; ਕਾਰਨ ਕਰਤਾ ਸੋਊ ॥"
page = 253
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "K: He the Lord is the Creator and cause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ-ਉਹ ਸੁਆਮੀ ਸਿਰਜਣਹਾਰ ਤੇ ਮੂਲ ਹੇਤੂ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "KAKKA: He is the Creator, the Cause of causes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਕੇ ਦ੍ਵਾਰਾ ਕਹਤੇ ਹੈਂ: ਸੋਈ ਪਰਮੇਸ੍ਵਰ ਸਰਬ ਕਾਰਣੋਂ ਕਾ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਰਤਾਰ ਆਪ ਹੀ (ਜਗਤ ਦੀ ਕਾਰ ਦਾ) ਸਬਬ ਬਣਾਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "KAKKA: Él, el Señor es el Creador y la Causa,"