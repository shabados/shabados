[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਈਹਾ; ਹਰਿ ਜਸੁ ਤੇਰਾ ਭਣੀਐ ॥"
page = 1081
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Here in this world, utter I Thine praise, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਏਥੇ ਇਸ ਲੋਕ ਵਿੱਚ ਮੈਂ ਤੇਰੀ ਮਹਿਮਾਂ ਉਚਾਰਨ ਕਰਦਾ ਹਾਂ, ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In this world, I chant Your Praises, Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਈਹਾਂ ਇਸ ਲੋਕ ਮੇਂ, ਹੇ ਹਰੀ! ਤੇਰਾ ਹੀ ਜਸ ਕਹੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਲੋਕ ਵਿਚ ਭੀ ਤੇਰੀ ਹੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਉਚਾਰੀ ਜਾ ਰਹੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਈਹਾ = ਇਥੇ, ਇਸ ਲੋਕ ਵਿਚ। ਭਣੀਐ = ਉਚਾਰਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Has escrito la cuenta de nuestros actos y también nos liberas de la necesidad de entregar cuentas por ellos,"