[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਹ ਜੁਧ ਘਣੋ ਨ੍ਰਿਪ ਆਪ ਕਰੋ ॥"
page = 201

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then once a war was waged between the gods and demons, in which the king gave a tough fight from the side of gods."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਵਿੱਚ ਬਹੁਤਾ ਯੁੱਧ ਰਾਜੇ ਨੇ ਆਪ ਕੀਤਾ।"