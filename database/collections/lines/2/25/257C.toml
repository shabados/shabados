[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਵ ਪੁਰੀ ਕਾ; ਹੋਇਗਾ ਕਾਲਾ ॥"
page = 237
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The realm of Shiva shall do perish."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ਿਵ-ਲੋਕ ਵੀ ਬਿਨਸ ਜਾਏਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Realm of Shiva shall also perish."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਸ਼ਿਵ ਪੁਰੀ ਕਾ ਭੀ ਕਾਲ ਹੋਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸ਼ਿਵ ਦੀ ਪੁਰੀ ਦਾ ਭੀ ਨਾਸ ਹੋ ਜਾਇਗਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਲਾ = ਨਾਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mundo de Shiva también morirá,"