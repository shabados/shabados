data = "ਹੇ ਰਾਜਿਆਂ ਦੇ ਸ਼ੇਰ ਅਤੇ ਵਿਦਿਆ ਦੇ ਖ਼ਜ਼ਾਨੇ! ਸੁਣ, (ਜੇ ਤੂੰ ਮੇਰਾ ਕਿਹਾ ਮੰਨੇਗਾ,"