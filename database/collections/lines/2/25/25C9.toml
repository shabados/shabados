[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਝਟਕਿ ਬਾਹ ਤੇ ਨਿਜੁ ਪਤਿਹ; ਹੈ ਪਰ ਲਯੋ ਚਰਾਇ ॥"
page = 888

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She jerked his (warrior’s) hand and took her husband an her horse."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਬਾਂਹ (ਤੋਂ ਫੜ ਕੇ) ਝਟਕੇ ਨਾਲ ਆਪਣੇ ਪਤੀ ਨੂੰ ਘੋੜੇ ਉਤੇ ਚੜ੍ਹਾ ਲਿਆ"