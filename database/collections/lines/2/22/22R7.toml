[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਪ੍ਰਸਾਦਿ; ਆਭੂਖਨ ਪਹਿਰੀਜੈ ॥"
page = 270
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose favour thou wearest ornaments,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਮਿਹਰ ਦੁਆਰਾ ਤੂੰ ਗਹਿਣੇ-ਗੱਟੇ ਪਹਿਨਦੀ ਹੈਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By His Grace, you wear decorations;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਕ੍ਰਿਪਾ ਸੇ (ਆ) ਵਿਸੇਸ ਕਰ ਕੇ ਭੂਖਨੋਂ ਕੋ ਪਹਿਰੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਪ੍ਰਭੂ) ਦੀ ਕਿਰਪਾ ਨਾਲ ਗਹਣੇ ਪਹਿਨੀਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਭੂਖਨ = ਗਹਣੇ, ਜ਼ੇਵਰ। ਪਹਿਰੀਜੈ = ਪਹਿਨੀਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por Su Gracia, decoras con joyas tu ser."