[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਣੀ ਧੋਤੈ; ਉਤਰਸੁ ਖੇਹ ॥"
page = 4
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "is removed by washing with water."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਲ ਨਾਲ ਧੋਣ ਦੁਆਰਾ ਘੱਟਾ ਲਹਿ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "water can wash away the dirt."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੌ ਓਹੁ ਪਾਣੀ ਸਾਥ ਧੋਣੇ ਕਰ ਤਨ ਸੇ ਉਤਰ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਪਾਣੀ ਨਾਲ ਧੋਤਿਆਂ ਉਹ ਮੈਲ ਉਤਰ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਣੀ ਧੋਤੈ = ਪਾਣੀ ਨਾਲ ਧੋਤਿਆਂ। ਉਤਰਸੁ = ਉਤਰ ਜਾਂਦੀ ਹੈ। ਖੇਹ = ਮਿੱਟੀ, ਧੂੜ, ਮੈਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el agua los puede limpiar."