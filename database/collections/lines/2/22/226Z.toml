[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕਿ ਧਰਨਿ ਗਗਨ ਮਹਿ; ਠਉਰ ਨ ਪਾਵਹਿ ॥"
page = 353
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some get no resting place on earth or in sky."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈਆਂ ਨੂੰ ਜ਼ਮੀਨ ਤੇ ਅਸਮਾਨ ਵਿੱਚ ਕੋਈ ਆਰਾਮ ਦੀ ਥਾਂ ਨਹੀਂ ਮਿਲਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some find no place of rest at all, on the earth or in the sky."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਕ ਧਰਤੀ ਅਰ ਅਕਾਸ ਮੇਂ ਠਹਰਨਾ ਨਹੀਂ ਪਾਵਤੇ ਹੈਂ, ਭਾਵ ਅਤਿ ਸੀਘਰ ਜਨਮਤੇ ਮਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਉਹਨਾਂ ਨੂੰ ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ ਵਿਚ ਕਿਤੇ ਸ਼ਾਂਤੀ ਲਈ ਥਾਂ ਨਹੀਂ ਲੱਭਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਰਨਿ = ਧਰਤੀ। ਗਗਨ = ਆਕਾਸ਼। ਮਹਿ = ਵਿਚ। ਠਉਰ = ਥਾਂ, ਮਨ ਦੇ ਟਿਕਣ ਲਈ ਥਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunos no logran paz en la tierra ni en ningún otro lado,"