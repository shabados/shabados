[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚਾ ਸਾਹਿਬੁ; ਸਦ ਮਿਹਰਵਾਣ ॥"
page = 619
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My True Master is ever merciful."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਸੱਚਾ ਸੁਆਮੀ ਸਦਾ ਹੀ ਦਇਆਲੂ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Lord and Master is forever merciful and forgiving."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰੇ ਪਰ ਸਾਚਾ ਸਾਹਿਬ ਸਦਾ ਹੀ (ਮਿਹਰਵਾਨ) ਦਿਆਲ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਮਾਲਕ-ਪ੍ਰਭੂ ਸਦਾ ਦਇਆਵਾਨ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ। ਸਦ = ਸਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Verdadero Señor es siempre Benévolo conmigo; sí, el Verdadero Guru ha calmado mi dolor,"