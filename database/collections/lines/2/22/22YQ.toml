[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਘਟਾ ਕਾ ਅੰਤਰਜਾਮੀ ॥੧॥ ਰਹਾਉ ॥"
page = 741
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is the inner-knower of all the hearts. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰਿਆਂ ਦਿਲਾਂ ਦੀਆਂ ਅੰਦਰਲੀਆਂ ਜਾਨਣਹਾਰ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Inner-knower, the Searcher of all hearts. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਘਟਾਂ ਕੇ ਅੰਤਰ ਹੋ ਕੇ ਪ੍ਰੇਰਕ ਹੈ ਵਾ ਸਰਬ ਕੇ ਰਿਦੇ ਕੀ ਜਾਨਤਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਸਭ ਜੀਵਾਂ ਦੇ ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲ = ਸਾਰੇ। ਅੰਤਰਜਾਮੀ = ਅੰਦਰ ਦੀ ਜਾਣਨ ਵਾਲਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien es el Conocedor Íntimo de todos los corazones.(1-Pausa)"