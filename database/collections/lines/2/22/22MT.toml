data = "ਘੇਰਿ ਦਸੋ ਦਿਸਿ ਤੇ ਬਧੁ ਕੀਜੈ ॥੩੩॥"
page = 930

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Don’t let them go, surround them and give tough fight.’(33)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਹਰ ਪਾਸਿਓਂ ਘੇਰ ਕੇ ਮਾਰ ਦੇਣਾ ਹੈ ॥੩੩॥"