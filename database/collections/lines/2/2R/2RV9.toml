[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਤੂੰ ਕੀਆ; ਤਿਸ ਕਉ ਜਾਨੁ ॥"
page = 866
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Realise thou Him, who did create thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਉਸ ਨੂੰ ਅਨੁਭਵ ਕਰ, ਜਿਸ ਨੇ ਤੈਨੂੰ ਰਚਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Know the One who created you,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਤੁਮ ਕੋ ਪੈਦਾ ਕੀਆ ਹੈ ਤਿਸ ਕੋ ਤੂੰ ਜਾਣੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਪਰਮਾਤਮਾ ਨੇ ਤੈਨੂੰ ਪੈਦਾ ਕੀਤਾ ਹੈ ਉਸ ਨਾਲ ਸਾਂਝ ਪਾਈ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਪ੍ਰਭੂ) ਨੇ। ਤੂੰ = ਤੈਨੂੰ। ਜਾਨੁ = ਸਾਂਝ ਪਾ। ਤਿਸ ਕਉ = {ਲਫ਼ਜ਼ 'ਤਿਸੁ' ਦਾ (ੁ) ਸੰਬੰਧਕ 'ਕਉ' ਦੇ ਕਾਰਨ ਉਡ ਗਿਆ ਹੈ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Conoce a Aquél que te ha creado"