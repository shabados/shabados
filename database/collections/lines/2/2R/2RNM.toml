[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੋਲੂ ਪਾਇ ਪੀੜਾਇਆ; ਰਸ ਟਟਰਿ ਕਸ ਇੰਨਣ ਵੰਨਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Then it is crushed in cane crusher; its nice is boiled in a cauldren and the bagasse is burnt as fuel."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਵੇਲਣੇ ਵਿਚ ਪਾਕੇ ਪੀੜਿਆ ਜਾਂਦਾ ਹੈ, ਰਹੁ ਕੜਾਹੇ ਵਿਚ, ਤੇ ਪੱਛੀਆਂ ਲਕੜੀਆਂ ਵਾਂਗੂੰ (ਬਾਲੀਦੀਆਂ ਹਨ)।"