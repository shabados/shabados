[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਨ ਕਹਾਵਨ; ਸਗਲ ਜੰਜਾਰ ॥"
page = 1299
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To utter and shout are all involvements."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਚਾਰਨਾ ਤੇ ਪੁਕਾਰਨਾ ਜੰਜਾਲ ਹੀ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Speaking and talking are all just entanglements."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਹਿਨਾ ਕਹਾਵਨਾ ਸਭ ਜੰਜਾਲ ਰੂਪੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹਰਿ-ਨਾਮ ਸਿਮਰਨ ਤੋਂ ਬਿਨਾ) ਹੋਰ ਹੋਰ ਗੱਲਾਂ ਆਖਣੀਆਂ ਅਖਵਾਣੀਆਂ- ਇਹ ਸਾਰੇ ਉੱਦਮ ਮਾਇਆ ਦੇ ਮੋਹ ਦੀਆਂ ਫਾਹੀਆਂ ਦਾ ਮੂਲ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹਨ ਕਹਾਵਨ = ਹੋਰ ਹੋਰ ਗੱਲਾਂ ਆਖਣੀਆਂ ਅਖਵਾਉਣੀਆਂ। ਜੰਜਾਰ = ਜੰਜਾਲ, ਮਾਇਆ ਦੇ ਮੋਹ ਦੀਆਂ ਫਾਹੀਆਂ (ਦਾ ਕਾਰਨ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Hablar y parlotear sólo provoca enredos."