[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕਾ ਅੰਤੁ; ਨ ਜਾਨੈ ਕੋਇ ॥"
page = 276
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His limit no one knows."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਓੜਕ ਨੂੰ ਕੋਈ ਨਹੀਂ ਜਾਣਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His limits are not known to anyone."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਵਾਹਿਗੁਰੂ ਕਾ ਕੋਈ ਅੰਤ ਨਹੀਂ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪ੍ਰਭੂ ਦਾ ਅੰਤ ਕੋਈ ਬੰਦਾ ਨਹੀਂ ਜਾਣਦਾ;"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De Él provienen el torrente de seres y mundos y por Él serán absorbidos nuevamente."