[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਬ੍ਰਹਮ ਗਿਆਨੀ ਆਪਿ ਪਰਮੇਸੁਰ ॥੬॥"
page = 273
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak the Brahm-gyani, is Himself the Exalted Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਬ੍ਰਹਮ ਗਿਆਨੀ ਖੁਦ ਹੀ ਪਰਮ ਪ੍ਰਭੂ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the God-conscious being is Himself the Supreme Lord God. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਕਿਉਂਕਿ ਬ੍ਰਹਮ ਗਿਆਨੀ ਆਪ ਪਰਮੇਸ੍ਵਰ ਸਰੂਪ ਹੋਤਾ ਹੈ। ਯਥਾ-☬\"ਜਿਨਿ ਜਾਤਾ ਸੋ ਤਿਸਹੀ ਜੇਹਾ॥\" ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਅਕਾਲ ਪੁਰਖ ਆਪ ਬ੍ਰਹਮਗਿਆਨੀ (ਦਾ ਰੂਪ) ਹੈ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਮੇਸੁਰ = ਪਰਮਾਤਮਾ, ਅਕਾਲ ਪੁਰਖ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, el ser conciente de Dios, es el Mismo Supremo Dios nuestro Señor.(6)"