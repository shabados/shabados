[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹਥਿ ਨ ਆਵੈ ਭੇਟੁ ਸੋ; ਤੁਸਿ ਤ੍ਰਿਲੋਚਨ ਮੈ ਮੁਹਿ ਲਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "“No offerings are needed by me. Out of my delight only, I would make Trilochan to have sight of me. "

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਤੇਰਾ ਦੀਦਾਰ) ਭੇਟਾ ਨਾਲ ਹੱਥ ਨਹੀਂ ਆਉਂਦਾ, ਮੈਂ ਤ੍ਰਿਲੋਚਨ ਨੂੰ ਪਰਸੰਨ ਹੋ ਕੇ ਦਰਸ਼ਨ ਦੇਵਾਂਗਾ।"