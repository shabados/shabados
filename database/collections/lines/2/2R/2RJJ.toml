[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਮ ਸੋ ਠਾਕੁਰੁ; ਅਉਰੁ ਨ ਦੇਵਾ ॥੪॥"
page = 659
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is no other Lord, like Thee, O God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਵਰਗਾ ਸੁਆਮੀ ਹੋਰ ਕੋਈ ਨਹੀਂ, ਹੇ ਵਾਹਿਗੁਰੂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no other Lord Master than You, O Divine Lord. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਹੇ (ਦੇਵਾ) ਪ੍ਰਕਾਸ਼ ਰੂਪ! ਤੇਰੇ ਜੈਸਾ ਸਾਮਰਥ ਸ੍ਵਾਮੀ ਕੋਈ ਨਹੀਂ ਹੈ॥੪॥☬ਜੇ ਕਹੈ ਮੇਰੇ ਜੈਸਾ ਔਰ ਕਿਉਂ ਨਹੀਂ ਹੈ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦੇਵ! ਤੇਰੇ ਵਰਗਾ ਕੋਈ ਹੋਰ ਮਾਲਕ ਮੈਨੂੰ ਨਹੀਂ ਦਿੱਸਿਆ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੁਮ ਸੋ = ਤੇਰੇ ਵਰਗਾ। ਠਾਕੁਰੁ = ਮਾਲਕ। ਦੇਵਾ = ਹੇ ਦੇਵ! ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues como Tú, no hay ningún otro Dios. (4)"