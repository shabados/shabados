[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰ ਉਪਦੇਸੁ ਅਗੰਮੁ, ਰਿਦੈ ਵਸਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The inaccessible teachings of the Guru he adopts in his heart."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦਾ ਅਗੰਮ ਉਪਦੇਸ ਰਿਦੈ ਵਿਖੇ ਵਸਾਇਆ ਹੈ।"