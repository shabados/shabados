[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਰਾਜੈ ਦੇ ਸਉ ਰਾਣੀਆ; ਸੇਜੈ ਆਵੈ ਵਾਰੋ ਵਾਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The king keeps hundred of queens and turn by turn visit their beds."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਇਕ) ਰਾਜੇ ਦੀਆਂ ਸੌ ਰਾਣੀਆਂ (ਆਪੋ ਆਪਣੀ) ਵਾਰੀ ਨਾਲ ਸੇਜਾ ਪੁਰ ਆਂਵਦੀਆਂ ਹਨ।"