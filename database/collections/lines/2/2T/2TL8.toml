[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਨਿਰਧਨੁ; ਧਨੁ ਦੇਖਿ. ਸੁਖੁ ਪਾਵੈ ॥"
page = 100
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "as a poor-man obtains happiness by finding wealth,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਇਕ ਗਰੀਬ ਦੌਲਤ ਲੱਭ ਪੈਣ ਤੇ ਖੁਸ਼ੀ ਪਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and the poor person is pleased by seeing wealth,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਨਿਰਧਨੁ ਧਨੁ ਪ੍ਰਾਪਤਿ ਹੂਆ ਦੇਖ ਕੇ ਸੁਖ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ (ਕੋਈ) ਕੰਗਾਲ ਮਨੁੱਖ (ਮਿਲਿਆ) ਧਨ ਵੇਖ ਕੇ ਸੁਖ ਮਹਿਸੂਸ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਖਿ = ਵੇਖ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así como los pobres se enloquecen al ver la riqueza;"