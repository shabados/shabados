data = "ਦਿਖਾਵੇ ਬਲੀ ਮੰਡਲਾਕਾਰ ਥਾਨੈ ॥"
page = 146

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They were standing and showing feats of bravery in enclosures."

[[content]]
