[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਬਿਨੁ; ਦੂਜਾ ਕੋਈ ਨਾਹੀ ॥"
page = 1080
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without Him, there is not another."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਬਗ਼ੈਰ ਹੋਰ ਕੋਈ ਭੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is none other than Him at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਤਿਸੁ) ਤੇਰੇ ਬਿਨਾਂ ਦੂਸਰਾ ਕੋਈ ਭੀ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੂੰ ਇਹ ਦਿੱਸ ਪੈਂਦਾ ਹੈ ਕਿ) ਪਰਮਾਤਮਾ ਹੀ ਪਰਮਾਤਮਾ ਸਭਨੀਂ ਥਾਈਂ ਵੱਸ ਰਿਹਾ ਹੈ, ਉਸ ਤੋਂ ਬਿਨਾ (ਉਸ ਵਰਗਾ) ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no, no hay nada ni nadie sin Él. El Señor está impregnado, desde el principio,"