[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਸੋ ਨਰ ਹਮਰੇ ਸਾਥ; ਸੁ ਆਇ ਬਿਹਾਰਿ ਹੈ ॥੬॥"
page = 1008

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Whosoever hit the fish will marry me.’(6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੁਰਸ਼ ਮੇਰੇ ਨਾਲ ਆ ਕੇ ਰਮਣ ਕਰੇਗਾ ॥੬॥"