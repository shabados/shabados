[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਦਮੁ ਕਰਤ; ਮਨੁ ਨਿਰਮਲੁ ਹੋਆ ॥"
page = 99
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Making the effort, my mind is rendered pure."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਪਰਾਲਾ ਕਰਦਿਆਂ ਮੇਰਾ ਚਿੱਤ ਪਵਿੱਤ੍ਰ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Making the effort, my mind has become pure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਸੰਗਤ ਕੇ ਵਾਸਤੇ ਪੁਰਖਾਰਥ ਕਰਨੇ ਸੇ ਮਨ ਨਿਰਮਲ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਦੱਸੀ ਸਿਮਰਨ-ਕਾਰ ਵਾਸਤੇ) ਉੱਦਮ ਕਰਦਿਆਂ (ਮੇਰਾ) ਮਨ ਪਵਿਤ੍ਰ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਤ = ਕਰਦਿਆਂ। ਹੋਆ = ਹੋ ਗਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Encausándola, mi mente se vuelve pura."