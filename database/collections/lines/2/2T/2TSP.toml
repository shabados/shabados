data = "ਜਿਨਿ ਦੀਆ ਤੁਧੁ; ਨੀਰੁ ਨਿਰਮੋਲਾ ॥"
page = 913
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who blessed thee with the priceless water,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਤੈਨੂੰ ਅਮੁੱਲਾ ਪਾਣੀ ਦਿੱਤਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He gave you the priceless water;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਤੇਰੇ ਕੋ ਜਲ ਬਿਨਾਂ ਮੋਲ ਤੋਂ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪ੍ਰਭੂ ਨੇ ਤੈਨੂੰ ਨਿਰਮੋਲਕ ਪਾਣੀ ਦਿੱਤਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੀਰੁ = ਪਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "con el agua preciosa para beber,"