data = "ਸਾਹਾਨ ਸਾਹਿ ਭੂਪਾਨ ਭੂਪ ॥"
page = 642

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is the king of kings and Sovereign of sovereigns"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਸ਼ਾਹਾਂ ਦਾ ਸ਼ਾਹ ਅਤੇ ਰਾਜਿਆਂ ਦਾ ਰਾਜਾ ਹੈ।"