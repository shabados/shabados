[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਰਸੁ ਪੀਵਹੁ. ਭਾਈ ॥"
page = 630
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O brother, quaff thou the God's elixir."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਵੀਰ! ਤੂੰ ਵਾਹਿਗੁਰੂ ਦੇ ਅੰਮ੍ਰਿਤ ਨੂੰ ਪਾਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Drink in the sublime essence of the Lord, O Siblings of Destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹਰੀ ਨਾਮ ਰਸ ਕਾ ਪੀਵਣਾ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪੂਰੇ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪਿਆ ਕਰੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਈ = ਹੇ ਭਾਈ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hermanos, beban de la Esencia del Señor"