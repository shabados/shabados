[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਰੇ ਪਰਾਤ ਚੁਰੈਲ ਹ੍ਵੈ; ਚਮਕਿ ਚਿਤੈਹੌ ਤੋਹਿ ॥੩੦॥"
page = 921

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘I will become witch and keep on roaming and searching for you.(30)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਮੈਂ ਮਰਨ ਉਪਰੰਤ ਚੁੜੇਲ ਬਣ ਕੇ ਚਮਕ ਕੇ ਤੁਹਾਨੂੰ ਵੇਖਾਂਗੀ ॥੩੦॥"