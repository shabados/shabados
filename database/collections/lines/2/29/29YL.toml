[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਰਵਿਰਤੀ ਨਰਵਿਰਤਿ ਪਛਾਣੈ ॥"
page = 1027
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If man knows what he is to possess or abandon,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਬੰਦਾ ਇਹ ਜਾਣ ਲਵੇ ਕਿ ਕੀ ਗ੍ਰਹਿਨ ਕਰਨਾ ਜਾਂ ਤਿਆਗਣਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who realizes what he has to possess, and what he has to abandon,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖੋਂ ਕੀ ਯਹ ਰੀਤੀ ਹੈ: ਪਰਵਿਰਤੀ ਔ ਨਿਵਿਰਤੀ ਕੋ ਪਛਾਣਤੇ ਹੈਂ। ਭਾਵ ਦੁਖਦਾਈ ਸੁਖਦਾਈ ਵਾ ਪਰਵਿਰਤੀ ਵਿਖੇ ਰਹਤੇ ਹੀ ਨਿਵਿਰਤ ਰਹ ਕਰ ਪਰਮੇਸਰ ਕੋ ਪਛਾਣਤੇ ਹੈਂ॥☬ਕਹਾਂ ਪਛਾਣਤੇ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਦੁਨੀਆ ਦੀ ਕਿਰਤ-ਕਾਰ ਕਰਦਾ ਹੋਇਆ ਦੁਨੀਆ ਤੋਂ ਉਪਰਾਮ ਰਹਿਣਾ ਜਾਣਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਵਿਰਤੀ = {प्रवृत्ति} ਦੁਨੀਆ ਵਾਲਾ ਰੁਝੇਵਾਂ। ਨਰਵਿਰਤਿ = {निवृत्‍ित} ਉਪਰਾਮਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si uno supiera lo que hay que poseer o abandonar, asociándose con el Guru,"