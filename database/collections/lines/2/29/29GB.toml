[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਕਤ; ਮਾਇਆ ਕਉ ਬਹੁ ਧਾਵਹਿ ॥"
page = 1029
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mammon-worshippers greatly run after riches."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦੇ ਪੁਜਾਰੀ ਧਨ-ਦੌਲਤ ਮਗਰ ਬਹੁਤ ਨਸਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The faithless cynics chase after Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਕਤ ਮਾਇਆ ਕੋ ਬਹੁਤ ਧਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ-ਵੇੜ੍ਹੇ ਜੀਵ ਮਾਇਆ ਇਕੱਠੀ ਕਰਨ ਦੀ ਖ਼ਾਤਰ ਬਹੁਤ ਭੱਜ-ਦੌੜ ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਕਤ = ਮਾਇਆ-ਵੇੜ੍ਹੇ ਮਨੁੱਖ। ਧਾਵਹਿ = ਦੌੜਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El amante de Maya, corre tras la ilusión,"