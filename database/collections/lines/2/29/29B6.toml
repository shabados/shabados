[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨਸਿ ਜਾਇਗੋ; ਸਗਲ ਆਕਾਰਾ ॥੫॥"
page = 237
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "these all forms of existence shall perish."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਸਤੀ ਦੇ ਇਹ ਸਾਰੇ ਸਰੂਪ ਤਬਾਹ ਹੋ ਜਾਣਗੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- all forms of existence shall pass away. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੰਪੂਰਨ ਅਕਾਰ ਬਿਨਸ ਜਾਵੇਗਾ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਾਰਾ ਦ੍ਰਿਸ਼ਟ-ਮਾਨ ਸੰਸਾਰ (ਆਖ਼ਰ) ਨਾਸ ਹੋ ਜਾਇਗਾ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਕਾਰਾ = ਦਿੱਸਦਾ ਜਗਤ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y todas las formas, desaparecerán.  (5)"