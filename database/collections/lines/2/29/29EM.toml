[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਸਾਚਾ ਸਾਹਿਬੁ; ਸਾਹੁ ਅਮਿਤਾ ॥"
page = 1117
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou are the True Lord and the limitless sovereign."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੱਚਾ ਸੁਆਮੀ ਅਤੇ ਹੱਦ ਬੰਨਾ-ਰਹਿਤ ਸੁਲਤਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my True Lord and Master, O Infinite King."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਹਿਬ! ਤੂੰ ਸਾਚਾ ਹੈਂ ਔਰ (ਅਮਿਤਾ) ਬੇਅੰਤ ਪਾਤਸਾਹੁ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਮਾਲਕ ਹੈਂ, ਤੂੰ ਬੇਅੰਤ ਵੱਡਾ ਸ਼ਾਹ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ। ਸਾਹਿਬੁ = ਮਾਲਕ। ਅਮਿਤਾ = ਅਮਿੱਤਾ, ਹੱਦ-ਬੰਨੇ ਤੋਂ ਪਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres mi Verdadero Dios, Infinito y Sin Fronteras."