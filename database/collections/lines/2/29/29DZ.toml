[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਰਧਿ ਮੋਟਿਯੋ ਯਾਰ ਤਿਹ; ਤਰੁਨ ਪਤਰਿਯੋ ਯਾਰ ॥"
page = 814

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Her fat lover was old but the other, the young one, was slender."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਮੋਟਾ ਯਾਰ ਬਿਰਧ ਸੀ ਅਤੇ ਪਤਲਾ ਯਾਰ ਜਵਾਨ ਸੀ।"