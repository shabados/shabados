data = "ਅਬ ਮੈ ਪੂਰਾ ਪਾਇਆ ॥੪॥੩॥੪੬॥"
page = 746
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have now obtained the Perfect one."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹੁਣ ਪੂਰਨ ਪੁਰਖ ਨੂੰ ਪਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Now, I have found the Perfect Lord. ||4||3||46||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਮੈਂਨੇ ਤੇਰਾ ਪੂਰਣ ਸਰੂਪ ਪਾਇਆ ਹੈ॥੪॥੩॥੪੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ, ਮੈਨੂੰ ਪੂਰਨ ਪ੍ਰਭੂ ਲੱਭ ਪਿਆ ਹੈ ॥੪॥੩॥੪੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰਾ = ਪੂਰਨ ਪ੍ਰਭੂ ॥੪॥੩॥੪੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "he obtenido a mi Dios Perfecto.(4-3-46)"