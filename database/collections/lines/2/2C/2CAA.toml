[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਕੈ ਕੇਰੀ ਖਖੜੀ; ਕੋਈ ਅੰਬੁ ਨ ਆਖੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "No one calls the akk berries, mango."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅੱਕ ਦੀ ਖੋਖੜੀ ਨੂੰ (ਜੋ ਭਾਵੇਂ ਅੰਬ ਦੇ ਰੰਗ ਰੂਪ ਵਾਂਗੂੰ ਹੈ) ਅੰਬ ਕੋਈ ਨਹੀਂ ਕਹਿੰਦਾ ਹੈ।"