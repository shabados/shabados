[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ; ਮੇਰੀ ਸਰਧਾ ਪੂਰਿ ॥"
page = 289
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Supreme Lord, fulfill my desire."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸ਼ਰੋਮਣੀ ਸਾਹਿਬ ਮੇਰੀ ਸੱਧਰ ਪੂਰੀ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Supreme Lord God, please fulfill my yearning;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਾਰਬ੍ਰਹਮ! ਇਹੁ ਮੇਰੀ ਸਰਧਾ ਪੂਰਨ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਾਰਬ੍ਰਹਮ! ਮੇਰੀ ਇੱਛਾ ਪੂਰੀ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਰਬ੍ਰਹਮ = ਹੇ ਪਾਰਬ੍ਰਹਮ! ਸਰਧਾ = ਇੱਛਾ। ਪੂਰਿ = ਪੂਰੀ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor Trascendente,"