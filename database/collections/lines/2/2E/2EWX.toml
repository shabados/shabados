[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨੁ ਜੋਬਨੁ ਸੰਪੈ ਸੁਖ ਭੋੁਗਵੈ; ਸੰਗਿ. ਨ ਨਿਬਹਤ ਮਾਤ ॥"
page = 1120
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The enjoyments of wealth, youth, property and pleasures stand not by the man, O mother."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨ-ਦੌਲਤ, ਜੁਆਨੀ ਜਾਇਦਾਦ ਅਤੇ ਹਾਸ ਬਿਲਾਸ ਦੇ ਅਨੰਦ ਮਾਣਨੇ, ਬੰਦੇ ਦਾ ਸਾਥ ਨਹੀਂ ਦਿੰਦੇ ਹੈ ਮਾਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The pleasures of wealth, youth, property and comforts will not stay with you, O mother."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਧਨੁ ਅਰ ਜੋਬਨ ਅਵਸਥਾ ਪੁਨਾ ਸੰਪਦਾ ਅਰ ਭੋਗੋਂ ਕੇ ਸੁਖ ਜੋ ਹੈਂ, (ਵੈ) ਸੋ ਪ੍ਰਲੋਕ ਮੇਂ (ਮਾਤ) ਤੁਛ ਮਾਤ੍ਰ ਭੀ ਵਾ ਮਾਤਾ ਆਦਿ ਸਨਬੰਧੀ ਕੋਈ ਸਾਥ ਨਹੀਂ ਨਿਭਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਨੁੱਖ ਇਥੇ) ਧਨ ਦੌਲਤ (ਇਕੱਠੀ ਕਰਦਾ ਹੈ), ਜੁਆਨੀ ਸੁਖ ਮਾਣਦਾ ਹੈ (ਪਰ ਇਹਨਾਂ ਵਿਚੋਂ ਕੋਈ ਭੀ ਚੀਜ਼ ਜਗਤ ਤੋਂ ਤੁਰਨ ਵੇਲੇ) ਰਤਾ ਭਰ ਭੀ (ਮਨੁੱਖ ਦੇ) ਨਾਲ ਨਹੀਂ ਜਾਂਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋਬਨੁ = ਜੁਆਨੀ ! ਸੰਪੈ = ਦੌਲਤ। ਭਗਵੈ = {ਅੱਖਰ 'ਭ' ਦੇ ਨਾਲ ਦੋ ਲਗਾਂ ਹਨ: (ੋ) ਅਤੇ (ੁ) ਅਸਲ ਪਾਠ ਹੈ 'ਭੋਗਵੈ'। ਇਥੇ 'ਭੁਗਵੈ' ਪੜ੍ਹਨਾ ਹੈ}। ਸੰਗਿ = ਨਾਲ। ਮਾਤ = ਮਾਤ੍ਰ, ਰਤਾ ਭਰ ਭੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno acumula riquezas, se embellece y regocija, pero ni una pizca de todo esto se va con uno."