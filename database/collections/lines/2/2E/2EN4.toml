[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਧਨਵੰਤਾ; ਜਿਨਿ ਪ੍ਰਭੁ ਧਿਆਇਆ ॥"
page = 1079
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone is wealthy who contemplates on his Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਅਮੀਰ ਹੈ ਜੋ ਆਪਣੇ ਸੁਆਮੀ ਦਾ ਮਿਸਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is wealthy, who meditates on God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਧਨ ਵਾਲਾ ਹੈ ਜਿਸ ਨੇ ਪ੍ਰਭੂ ਕੋ ਧਿਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਪ੍ਰਭੂ ਦਾ ਧਿਆਨ ਧਰਿਆ ਉਹ ਨਾਮ-ਖ਼ਜ਼ਾਨੇ ਦਾ ਮਾਲਕ ਬਣ ਗਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਮਨੁੱਖ) ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo es millonario aquél que atesora a Dios."