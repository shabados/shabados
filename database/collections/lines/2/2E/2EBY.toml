[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਤਨੁ ਸਚੀ ਭਗਤੀ ਰਾਤਾ; ਸਚੇ ਸਿਉ ਚਿਤੁ ਲਾਇਆ ॥੨॥"
page = 1068
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, whose mind and body are imbued with the true devotional service, fixes his mind with the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਚਿੱਤ ਅਤੇ ਦੇਹ ਸੱਚੀ ਪ੍ਰੇਮਮਈ ਸੇਵਾ ਨਾਲ ਰੰਗੇ ਹੋਏ ਹਨ, ਉਹ ਆਪਣੇ ਮਨ ਨੂੰ ਸੱਚੇ ਸਾਈਂ ਨਾਲ ਜੋੜ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One whose mind and body are imbued with true devotion, focuses his consciousness on the True Lord. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕਾ ਮਨ ਤਥਾ ਤਨ ਸਚੀ ਭਗਤੀ ਮੇਂ ਰੰਗਿਆ ਹੈ, ਤਿਸੀ ਨੇ ਹੇ (ਸਚੇ) ਵਾਹਿਗੁਰੂ! ਤੇਰੇ ਸਾਥ ਚਿਤ ਲਾਇਆ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਨੁੱਖ ਦਾ ਮਨ ਉਸ ਦਾ ਤਨ ਤੇਰੀ ਸਦਾ-ਥਿਰ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਵਿਚ ਰੰਗਿਆ ਰਹਿੰਦਾ ਹੈ, ਉਹ ਤੇਰੇ ਸਦਾ-ਥਿਰ ਨਾਮ ਨਾਲ ਆਪਣਾ ਚਿੱਤ ਜੋੜ ਰੱਖਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਤਾ = ਰੰਗਿਆ ਗਿਆ। ਸਿਉ = ਨਾਲ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando nuestra mente y nuestro cuerpo están imbuidos en la Verdadera Devoción, uno, en Verdad, alaba al Uno Verdadero. (2)"