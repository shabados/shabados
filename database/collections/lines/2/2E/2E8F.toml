[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਕ ਦਿਨ ਜੋਗੀ ਘਰ ਹੁਤੋ ਗ੍ਰਿਹਸਤੀ ਪਹੂੰਚ︀ਯਾ ਆਇ ॥"
page = 853

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "One day while the ascetic was still in the house, her householder came back."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਦਿਨ ਜੋਗੀ (ਇਸਤਰੀ ਦੇ) ਘਰ ਵਿਚ ਸੀ। (ਉਤੋਂ) ਗ੍ਰਿਹਸਥੀ ਆ ਪਹੁੰਚਿਆ।"