[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਟੇ ਅੰਧੇਰ; ਭਏ ਪਰਗਾਸਾ ॥"
page = 1143
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The darkness is dispelled and the Divine Light is illumined for me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਨ੍ਹੇਰਾ ਦੂਰ ਹੋ ਗਿਆ ਹੈ ਅਤੇ ਈਸ਼ਵਰੀ ਪਰਕਾਸ਼ ਮੇਰੇ ਲਈ ਰੌਸ਼ਨ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The darkness has been dispelled, and the Divine Light blazes forth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਗ੍ਯਾਨ ਅੰਧੇਰ ਮਿਟ ਗ੍ਯਾ ਹੈ ਔਰ ਗ੍ਯਾਨ ਕਾ ਪ੍ਰਕਾਸ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੇਰੇ ਅੰਦਰੋਂ ਮਾਇਆ ਦੇ ਮੋਹ ਦੇ ਸਾਰੇ) ਹਨੇਰੇ ਮਿਟ ਗਏ ਹਨ, (ਮੇਰੇ ਅੰਦਰ ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੂਝ ਦਾ) ਚਾਨਣ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਗਾਸਾ = ਚਾਨਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la oscuridad fue eliminada, pues vivo en la Iluminación."