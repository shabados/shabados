[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੋਬਿੰਦ ਪੂਰਨ ਆਸ ॥"
page = 838
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord of the universe, fulfil Thou this desire of mine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਆਲਮ ਦੇ ਸੁਆਮੀ! ਤੂੰ ਮੇਰੀ ਇਹ ਸੱਧਰ ਪੂਰੀ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord of the Universe, please fulfill my hopes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਬਿੰਦ! ਮੇਰੀ ਇਹੁ ਆਸ ਪੂਰਨ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਬਿੰਦ! (ਮੇਰੇ ਮਨ ਦੀ) ਆਸ ਪੂਰੀ ਕਰ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰਨ ਆਸ = ਆਸ ਪੂਰੀ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Señor de la Tierra."