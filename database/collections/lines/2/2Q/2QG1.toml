[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਰਹਤ ਸੁਨਹੁ, ਮੇਰੇ ਭਾਈ ॥"
page = 392
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My brother, hear thou the way of living of the saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਡੇ ਵੀਰ! ਤੂੰ ਸਾਧੂਆਂ ਦੀ ਜੀਵਨ ਰਹੁ ਰੀਤੀ ਸ੍ਰਵਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen, to the way of life of the Saints, O my Siblings of Destiny;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸੰਤੋਂ ਕੀ (ਰਹਤ) ਰਹਨੀ ਸ੍ਰਵਣ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਵੀਰ! (ਪਰਮਾਤਮਾ ਦੇ) ਸੰਤ ਦੀ ਜੀਵਨ-ਜੁਗਤੀ ਸੁਣ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਹਤ = ਜੀਵਨ-ਜੁਗਤਿ, ਰਹਿਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escucha la rutina de la vida de los Santos,"