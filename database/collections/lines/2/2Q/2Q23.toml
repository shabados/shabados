type = "translation"
language = "pa"
data = "ਰਾਗ ਕਾਨੜਾ, ਘਰ ੯ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Malhar, Kanra, Mejl Guru Aryan Dev, Quinto Canal Divino, Novena Casa."