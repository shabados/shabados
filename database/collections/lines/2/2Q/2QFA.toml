[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨਸਿ ਜਾਹਿ; ਮਾਇਆ ਜੰਜਾਲ ॥"
page = 185
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and the entanglements of mammon are destroyed,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੋਹਣੀ ਦੇ ਅਲਸੇਟੇ ਮੁਕ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and the entanglements of Maya are dispelled."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਮਾਇਆ ਕੇ ਜੰਜਾਲ ਬੰਧਨ ਬਿਨਸ ਜਾਵੇਂਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਮਾਇਆ (ਦੇ ਮੋਹ) ਦੇ ਫਾਹੇ ਦੂਰ ਹੋ ਜਾਣਗੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੰਜਾਲ = ਫਾਹੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y los enredos del Maya son desechados."