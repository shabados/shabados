[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹਵਾ. ਰੰਗਿ ਨਹੀ ਹਰਿ ਰਾਤੀ; ਜਬ ਬੋਲੈ ਤਬ ਫੀਕੇ ॥"
page = 1126
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thy tongue is imbued not with God's love and whenever it utters, then all that is insipid."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਜੀਭ ਰੱਬ ਦੀ ਪ੍ਰੀਤ ਨਾਲ ਰੰਗੀ ਨਹੀਂ ਗਈ ਅਤੇ ਜਦ ਭੀ ਇਹ ਬੋਲਦੀ ਹੈ ਤਦ ਉਹ ਸਭ ਫਿੱਕਾ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your tongue is not imbued with the Love of the Lord; whatever you say is tasteless and insipid."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਹਵਾ ਭੀ (ਹਰਿ) ਵਾਹਿਗੁਰੂ ਕੇ ਪ੍ਰੇਮ ਵਿਖੇ ਨਾ ਰੰਗੀ ਗਈ, ਜਬ ਕਬੀ ਬੋਲ ਬੋਲੇ ਤੋ ਫਿਕੇ ਅਰਥਾਤ ਨਾਮ ਰਸ ਥੀ ਰਹਿਤ ਹੀ ਬੋਲਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਅੰਨ੍ਹੇ ਜੀਵ!) ਤੇਰੀ ਜੀਭ ਪ੍ਰਭੂ ਦੀ ਯਾਦ ਦੇ ਪਿਆਰ ਵਿਚ ਨਹੀਂ ਭਿੱਜੀ, ਜਦੋਂ ਭੀ ਬੋਲਦੀ ਹੈ ਫਿੱਕੇ ਬੋਲ ਹੀ ਬੋਲਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੰਗਿ = ਰੰਗ ਵਿਚ, ਪ੍ਰੇਮ ਵਿਚ। ਰਾਤੀ = ਰੱਤੀ, ਰੰਗੀ। ਫੀਕੇ = ਖਰ੍ਹਵੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tus labios no están imbuidos en Dios, y lo que sea que recitas no tiene sentido ni significado y es insípido,"