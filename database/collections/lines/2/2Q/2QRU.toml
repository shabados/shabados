data = "ਜਾਗੜਦੰ ਜੁਟੇ ਬਾਗੜਦੰ ਬੀਰੰ ॥੪੪੩॥"
page = 595

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The adepts laughed and the groups of warriors ran away, the arrows were discharged and the warriors fought among themselves.443."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੂਰਮੇ (ਯੁੱਧ ਕਰਮ ਵਿਚ) ਜੁਟੇ ਹੋਏ ਹਨ ॥੪੪੩॥"