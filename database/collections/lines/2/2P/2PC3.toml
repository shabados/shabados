data = "ਜ਼ਰੋ ਜਾਮਹ ਨੀਮ ਆਸਤੀਂ ਬੇਸ਼ੁਮਾਰ ॥੫੦॥"
page = 1396

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "From then on gave him the name as Raja Daleep.(50)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਸਾਰੀ ਦੌਲਤ ਅਤੇ ਬੇਸ਼ੁਮਾਰ ਆਸਤੀਨਾਂ ਲੈ ਕੇ ਆਇਆ ॥੫੦॥"