[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਿਰਖਤ ਜਾ ਕੇ ਲਜਤ ਅਨੰਗਾ ॥੬॥"
page = 676

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "His body is gleaming with youth and seeing him, even the god of love is feeling shy.”6."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਵੇਖ ਕੇ ਕਾਮਦੇਵ ਵੀ ਸ਼ਰਮਿੰਦਾ ਹੁੰਦਾ ਹੈ ॥੬॥"