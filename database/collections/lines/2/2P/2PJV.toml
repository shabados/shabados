[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਮਹਾ ਖੁਧਿਆਰਥ; ਭੋਗੁ ॥"
page = 838
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the very hungry man loves the food."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਬਹੁਤਾ ਭੁੱਖਾ ਆਦਮੀ ਭੋਜਨ ਨਾਲ ਪਿਆਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "as food is to the very hungry man,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਮਹਾਂ ਖੁਧਿਆਰਬੀ ਕੋ ਅੰਨ ਕੋ ਭੋਗਣੇ ਸਾਥ ਪ੍ਰੀਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਬਹੁਤ ਭੁੱਖੇ ਨੂੰ ਭੋਜਨ (ਤ੍ਰਿਪਤ ਕਰਦਾ ਹੈ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖੁਧਿਆਰਥ = ਭੁੱਖੇ ਨੂੰ। ਭੋਗੁ = ਭੋਜਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así como el hambriento no piensa más que en comida,"