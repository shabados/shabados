[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੰਚ ਦੂਤ; ਸਭਿ ਵਸਗਤਿ ਆਇਆ ॥੩॥"
page = 395
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and all the five demons are subdued."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਮੂਹ ਪੰਜੇ ਭੂਤਨੇ ਕਾਬੂ ਆ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and the five demons are totally subdued. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਾਮਾਦਿਕ ਜੋ ਪੰਚ ਦੂਤ ਥੇ, ਸੋ ਤਿਨ ਕੇ ਸਮੁਦਾਇ ਕਾ (ਗਤਿ) ਗਵਨ ਮੇਰੇ ਵਸ ਆਯਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਾਮਾਦਿਕ ਪੰਜੇ ਵੈਰੀ ਸਾਰੇ ਉਸ ਦੇ ਕਾਬੂ ਵਿਚ ਆ ਜਾਂਦੇ ਹਨ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੰਚ ਦੂਤ = ਕਾਮਾਦਿਕ ਪੰਜ ਵੈਰੀ। ਸਭਿ = ਸਾਰੇ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y se sobrepone a los cinco enemigos. (3)"