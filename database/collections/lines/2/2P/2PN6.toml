[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਠ ਪਹਰ ਗਾਵਤ ਭਗਵੰਤੁ ॥"
page = 1150
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the eight watches I hymn the praise of the illustrious Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਠੇ ਪਹਿਰ ਹੀ ਮੈਂ ਕੀਰਤੀਮਾਨ ਪ੍ਰਭੂ ਦੀ ਮਹਿਮਾ ਗਾਇਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Twenty-four hours a day, I sing of the Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁ ਆਠੋਂ ਪਹਿਰ ਭਗਵੰਤ ਕੇ ਗੁਣੋਂ ਕੋ ਗਾਵਤਾ ਰਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੀ ਉਮਰ) ਅੱਠੇ ਪਹਰ ਭਗਵਾਨ ਦੇ ਗੁਣ ਗਾਂਦਿਆਂ (ਬੀਤਦੀ ਹੈ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਾਵਤ = ਗਾਂਦਿਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canto así para siempre las Alabanzas de mi Señor,"