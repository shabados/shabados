data = "ਤਹ ਘੋਰ ਭਯਾਨਕ ਜੁਧ ਜਗੰ ॥"
page = 188

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The arrows and the swords were showered in the war and in this may this war was a dreadful and horrible war."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਵਿਚ ਘੋਰ ਅਤੇ ਭਿਆਨਕ ਯੁੱਧ (ਹੋਇਆ ਸੀ)।"