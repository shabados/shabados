[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰਿ ਮਿਲਿਐ; ਵਡੀ ਵਡਿਆਈ ॥"
page = 833
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting with the True Guru, the mortal is blessed with great glory."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਨਾਲ ਮਿਲਣ ਦੁਆਰਾ ਪ੍ਰਾਣੀ ਨੂੰ ਬਹੁਤ ਪ੍ਰਭਤਾ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting with the True Guru, one is blessed with glorious greatness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਕੋ ਸਤਿਗੁਰੂ ਮਿਲਾ ਹੈ, ਤਿਨ ਕੀ ਵਡਿਆਈ ਵਡੀ ਹੋਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੇ ਗੁਰੂ ਮਿਲ ਪਏ, ਤਾਂ (ਲੋਕ ਪਰਲੋਕ ਵਿਚ) ਬੜੀ ਵਡਿਆਈ ਮਿਲਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰਿ ਮਿਲਿਐ = ਜੇ ਗੁਰੂ ਮਿਲ ਪਏ। ਕਾਟੈ = ਕੱਟ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Encontrando al Guru Verdadero uno es Bendecido con Gloria,"