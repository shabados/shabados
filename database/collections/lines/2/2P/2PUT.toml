[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੇਤੜਿਆਂ ਹੀ ਤਾਇਫੇ; ਢਾਢੀ ਬਚੇ ਕਲਾਵਤ ਗਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many are prostitutes, bards and singers of qauwali, a particular type of song sung usually in-group in particular modes mostly by Muslims."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਈ ਤੈਫੇ, ਢਾਡੀ ਬਚੇ ਗਾਉਣ ਵਾਲੇ ਕਲੌਤ।"