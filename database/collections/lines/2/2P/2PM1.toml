[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਗਿ ਦੇਖੈ ਕਰਣਹਾਰਾ; ਕਾਇ ਪਾਪੁ ਕਮਾਈਐ ॥"
page = 461
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Creator is with him and watches his deeds. So why should he commit sins?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿਰਜਨਹਾਰ ਉਸ ਦੇ ਅੰਗ ਸੰਗ ਹੈ ਤੇ ਉਸ ਦੇ ਕਰਮਾਂ ਨੂੰ ਤੱਕਦਾ ਹੈ। ਫੇਰ ਉਹ ਕਿਉਂ ਗੁਨਾਹ ਕਰਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator Lord is with you; He sees you, so why commit sins?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਕਰਣ ਹਾਰਾ ਸੰਗ ਹੀ ਦੇਖਤਾ ਹੈ ਫਿਰ ਕ੍ਯੋਂ ਪਾਪ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਿਰਜਣਹਾਰ (ਹਰੇਕ ਜੀਵ ਦੇ) ਨਾਲ (ਬੈਠਾ ਹਰੇਕ ਦੇ ਕੀਤੇ ਕੰਮ) ਵੇਖਦਾ ਰਹਿੰਦਾ ਹੈ। ਸੋ ਕੋਈ ਮੰਦ ਕਰਮ ਨਹੀਂ ਕਰਨਾ ਚਾਹੀਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਣਹਾਰਾ = ਸਿਰਜਣਹਾਰਾ। ਕਾਇ = ਕਿਉਂ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué cometemos errores y faltas si Él puede verlo todo dentro de nosotros?"