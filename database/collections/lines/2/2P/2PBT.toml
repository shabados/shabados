[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਚੰਤਿ. ਬਿਖਿਆ ਛਲੰ ਛਿਦ੍ਰੰ; ਨਾਨਕ. ਬਿਨੁ ਹਰਿ. ਸੰਗਿ ਨ ਚਾਲਤੇ ॥੧॥"
page = 708
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man amasses poisonous wealth with deceit and guile, O Nanak Bur, without the Lord's Name, nothing goes with him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਦਮੀ ਠੱਗੀ ਠੋਰੀ ਤੇ ਛਲ ਫਰੇਬ ਨਾਲ ਜ਼ਹਿਰੀਲੀ ਮਾਇਆ ਇਕੱਤਰ ਕਰਦਾ ਹੈ, ਹੇ ਨਾਨਕ! ਪ੍ਰਭੂ ਸਾਈਂ ਦੇ ਨਾਮ ਬਾਝੋਂ ਕੁਛ ਭੀ ਉਸ ਦੇ ਨਾਲ ਨਹੀਂ ਜਾਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One may gather poison through deception and fraud, O Nanak, but without the Lord, nothing shall go along with him in the end. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਪਰੰਤੂ ਇਹ ਪਦਾਰਥ ਹਰੀ ਕੇ ਨਾਮ ਬਿਨਾਂ ਇਸ ਕੇ ਸਾਥ ਚਲਤੇ ਨਹੀਂ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਛਲ ਕਰ ਕੇ ਦੂਜਿਆਂ ਤੇ ਦੂਸ਼ਣ ਲਾ ਲਾ ਕੇ (ਕਈ ਢੰਗਾਂ ਨਾਲ) ਮਾਇਆ ਜੋੜਦੇ ਹਨ, ਪਰ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਤੋਂ ਬਿਨਾ ਕੋਈ ਭੀ ਚੀਜ਼ ਏਥੋਂ ਨਾਲ ਨਹੀਂ ਜਾਂਦੀ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਚੰਤਿ = ਇਕੱਠੀ ਕਰਦੇ ਹਨ। ਬਿਖਿਆ = ਮਾਇਆ। ਛਿਦ੍ਰ = ਐਬ, ਦੋਸ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, uno se queda con el veneno de la ilusión, pues nada se queda con uno sin el Señor. (1)"