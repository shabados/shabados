[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨੈਨ ਨਚਾਇ ਕਛੂ ਮੁਸਕਾਇ ਕੈ; ਭਉਹ ਦੁਊ ਕਰਿ ਟੇਢਿ ਧਰੀ ॥"
page = 346

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They are causing their eyes to dance, they are tilting their eyebrows"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨੈਣਾਂ ਨੂੰ ਮਟਕਾ ਕੇ ਅਤੇ ਕੁਝ ਮੁਸਕਰਾ ਕੇ ਅਤੇ ਦੋਹਾਂ ਭੌਆਂ ਨੂੰ ਟੇਢਾ ਕਰ ਕੇ (ਕ੍ਰਿਸ਼ਨ ਵਲ ਇੰਜ ਵੇਖਿਆ"