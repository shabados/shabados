language = "pa"
data = "ਜਿੱਥੇ ਵੀ ਉਹ ਵੇਖਦੇ ਹਨ, ਤੇਰਾ ਹੀ ਜਮਾਲ ਵੇਖਦੇ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਹਰ ਜਾ ਕਿ ਬਿਨਿਗਰੇਦ ਜਮਾਲਿ ਤੂ ਬਿਨਿਗਰੇਦ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "There is no ever-lasting love or devotion other than the love of Waaheguru,"