[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਖ ਸੁਰਤੀ. ਲਖ ਗਿਆਨ ਧਿਆਨ; ਪੜੀਅਹਿ ਪਾਠ ਪੁਰਾਣ ॥"
page = 467
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "lacs of Divine comprehensions and concentrations and lacs of readings of Vedas and recitations of Puranas,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲੱਖਾਂ ਬ੍ਰਹਿਮ-ਗਿਆਨ ਤੇ ਤਾਈਆਂ ਅਤੇ ਲੱਖਾਂ ਹੀ ਵੇਦਾਂ ਦੇ ਪੜ੍ਹਨੇ ਅਤੇ ਪੁਰਾਣਾਂ ਦੇ ਪਾਠ ਕਰਨੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "hundreds of thousands of divine understandings, hundreds of thousands of divine wisdoms and meditations and readings of the Vedas and the Puraanas"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬੇਦ ਕੀਆਂ ਲਖੋ ਸੁਰਤੀਆਂ ਪੜੇ, ਲਖਾਂ ਗ੍ਯਾਨ ਕੀਆਂ ਬਾਤਾਂ ਕਰੇ, ਲਾਖੋਂ ਦੇਵਤੋਂ ਕਾ ਧ੍ਯਾਨ ਕਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਲੱਖਾਂ (ਤਰੀਕਿਆਂ ਨਾਲ) ਸੁਰਤ ਪਕਾਈ ਜਾਵੇ, ਗਿਆਨ-ਚਰਚਾ ਕੀਤੀ ਜਾਏ ਤੇ ਮਨ ਨੂੰ ਇਕਾਗਰ ਕਰਨ ਦੇ ਜਤਨ ਕੀਤੇ ਜਾਣ, ਬੇਅੰਤ ਵਾਰੀ ਹੀ ਪੁਰਾਣ ਆਦਿਕ ਧਰਮ ਪੁਸਤਕਾਂ ਦੇ ਪਾਠ ਪੜ੍ਹੇ ਜਾਣ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਰਤੀ = ਧਿਆਨ ਜੋੜਨਾ। ਪੜੀਅਹਿ = ਪੜ੍ਹੇ ਜਾਣ। ਪਾਠ ਪੁਰਾਣ = ਪੁਰਾਣਾਂ ਦੇ ਪਾਠ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "miles de textos Semíticos, conocimiento y concentraciones y la lectura de los Puranas,"