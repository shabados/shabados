type = "primary"
data = "ਖਾਨ ਪਾਨ ਸਭ ਕਛੁ ਬਿਸਾਰਿਯੋ ॥"
page = 911

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Since the Rani saw you, she has abandoned eating and drinking."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਖਾਣਾ ਪੀਣਾ ਸਭ ਕੁਝ ਭੁਲਾ ਦਿੱਤਾ ਹੈ।"