[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਰਮ ਪਦਾਰਥੁ; ਪਾਵੈ ਸੋਈ ॥"
page = 232
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone attains the Supreme wealth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹੀ ਮਹਾਨ ਦੌਲਤ ਨੂੰ ਹਾਸਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They alone obtain the supreme treasure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਪਰਮ ਪਦਾਰਥ ਬਦੇਹ ਮੋਖ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਮਨੁੱਖ ਸਾਰੇ ਪਦਾਰਥਾਂ ਤੋਂ ਸ੍ਰੇਸ਼ਟ ਨਾਮ-ਪਦਾਰਥ ਹਾਸਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "él llega al Estado Supremo"