[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਨਾਮੁ; ਤਹ ਨਾਲਿ ਪਛਾਨੂ ॥"
page = 264
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "there God's Name shall be thy recoginser with thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ ਤੇਰੇ ਸਾਥ, ਤੈਨੂੰ ਪਛਾਨਣ ਵਾਲਾ ਹੋਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "with the Name of the Lord, you shall be recognized."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਹਾਂ ਤੇਰੇ ਸਾਥ ਤੇਰਾ ਪਛਾਣੂ ਹਰੀ ਕਾ ਨਾਮ ਹੀ ਹੋਗਾ, ਭਾਵ ਸੇ ਵਹੀ ਸਹਾਯਕ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਓਥੇ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਤੇਰੇ ਨਾਲ (ਸੱਚਾ) ਸਾਥੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "tendrás en el Nombre al más grato amigo."