[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰਿ ਵਸਤੁ; ਨ ਜਾਣਹਿ ਭੇਦੁ ॥"
page = 355
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He knows not the secret of the commodity within him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੇ ਅੰਦਰ ਦੇ ਵੱਖਰ ਦੇ ਭੇਤ ਨੂੰ ਨਹੀਂ ਸਮਝਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but he does not know the secret of the thing within himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਜੋ ਬਸਤੂ ਬੇਦ ਵਾ ਅੰਤਸਕਰਣ ਮੇਂ ਸਾਰ ਰੂਪ ਹੈ ਤਿਸ ਕੇ ਭੇਦ ਕੋ ਨਹੀਂ ਜਾਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ (ਨਿਰੀ ਵਿੱਦਿਆ ਦੇ ਮਾਣ ਵਿਚ ਰਹਿ ਕੇ) ਇਹ ਭੇਦ ਨਹੀਂ ਜਾਣਦੇ ਕਿ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਪਦਾਰਥ ਅੰਦਰ ਹੀ ਮੌਜੂਦ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero no entiende el Misterio del interior."