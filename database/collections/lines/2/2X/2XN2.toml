[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਜਾ ਕਾ ਪੂਰਾ ਕਰਮ ॥"
page = 189
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, he whose fortune is perfect,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਜਿਸ ਦੀ ਕਿਸਮਤ ਪੂਰਨ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, one whose karma is perfect,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਸ ਪੁਰਸ ਕਾ ਪੂਰਨ ਭਾਗ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਨਾਨਕ ਆਖਦਾ ਹੈ- ਜਿਸ ਦੀ ਵੱਡੀ (ਚੰਗੀ) ਕਿਸਮਤਿ ਹੋਵੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕਾ = ਜਿਸ (ਮਨੁੱਖ) ਦਾ। ਕਰਮ = ਭਾਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, solamente aquél, que tiene un Destino perfecto,"