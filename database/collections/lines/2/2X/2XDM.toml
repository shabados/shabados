[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਮ ਰੋਗਿ; ਮੈਗਲੁ ਬਸਿ ਲੀਨਾ ॥"
page = 1140
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The disease of lust overwhelms the elephants."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਸ਼ੇ ਭੋਗ ਦੀ ਬਿਮਾਰੀ ਹਾਥੀ ਨੂੰ ਕਾਬੂ ਕਰ ਲੈਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The disease of sexual desire overwhelms the elephant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਾਮ ਰੋਗ ਨੇ ਹਸਤੀ ਕੋ ਬਸ ਕਰ ਲੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਾਮ-ਵਾਸਨਾ ਦੇ ਰੋਗ ਨੇ ਹਾਥੀ ਨੂੰ ਆਪਣੇ ਵੱਸ ਵਿਚ ਕੀਤਾ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੋਗਿ = ਰੋਗ ਨੇ। ਮੈਗਲੁ = ਹਾਥੀ। ਬਸਿ = ਵੱਸ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El elefante es controlado con la enfermedad de la lujuria,"