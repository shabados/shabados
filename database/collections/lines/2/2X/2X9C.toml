[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਤਰੁ ਖਰਾ; ਰਿਸੈ ਹੈ ਰਾਇ ॥੩॥"
page = 344
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the King shall be exceedingly wrath."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਹੀਂ ਤਾਂ ਪਾਤਸ਼ਾਹ ਬਹੁਤ ਹੀ ਗੁੱਸੇ ਹੋਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "shall feel the terrible wrath of the Lord, their King. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਹੀਂ ਤੋ (ਰਾਇ) ਰਾਜਾ ਪਰਮੇਸ੍ਵਰ (ਖਰਾ) ਅਤੀ (ਰਿਸੈ) ਗੁਸੇ ਹੋਵੇਗਾ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਹੀਂ ਤਾਂ ਇਹ ਮਨ (ਵਿਕਾਰਾਂ ਵਿਚ ਪੈ ਕੇ) ਬੜਾ ਦੁਖੀ ਹੋਵੇਗਾ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਤਰੁ = ਨਹੀਂ ਤਾਂ, ਜੇ ਤੂੰ ਬਾਹਰ ਚਲਾ ਗਿਆ। ਰਿਸੈ ਹੈ = ਖਿੱਝ ਜਾਏਗਾ। ਰਿਸ = {Skt. रिष् to be injured, to meet with a misfortune} ਬਿਪਤਾ ਵਿਚ ਪੈ ਜਾਣਾ, ਦੁਖੀ ਹੋਣਾ। ਰਾਇ = ਰਾਜਾ, ਮਨ-ਰਾਜਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "salen fuera en busca del Señor, con ellos de seguro Dios no está complacido. (3)"