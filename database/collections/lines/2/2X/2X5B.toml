[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਸਕਰ ਸਣੈ ਦਮਾਮਿਆ; ਛੁਟੇ ਬੰਕ ਦੁਆਰ ॥"
page = 1244
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mortal leaves his beauteous mansions, together with his armies and drums."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਾਣੀ ਆਪਣੇ ਸੁੰਦਰ ਮੰਦਰਾਂ ਨੂੰ ਸਮੇਤ ਆਪਣੀਆਂ ਫੌਜਾ ਅਤੇ ਧੌਸਿਆਂ ਦੇ ਛੱਡ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They must leave their armies and drums, and their beautiful mansions."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਦਮਾਮਿਆ) ਧੋਂਸਿਓਂ ਕੇ ਸਹਿਤ (ਲਸਕਰ) ਫੌਜਾਂ ਔਰ ਬਡੇ ਸੁੰਦਰ ਦਰਵਾਜੇ ਛੂਟ ਜਾਤੇ ਭਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਫ਼ੌਜਾਂ ਤੇ ਧੌਂਸੇ ਤੇ ਸੋਹਣੇ ਘਰ ਇਥੇ ਹੀ ਰਹਿ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਣੇ = ਸਮੇਤ। ਦਮਾਮੇ = ਧੌਂਸੇ। ਬੰਕ = ਬਾਂਕੇ, ਸੁੰਦਰ। ਛੁਟੇ = ਸਾਥ ਛੁੱਟ ਗਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así con sus ejércitos y tambores, dejan sus bellas mansiones."