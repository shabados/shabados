[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜਾਇ ਸੁਤਾ ਪਰਭਾਸ ਵਿਚਿ; ਗੋਡੇ ਉਤੇ ਪੈਰ ਪਸਾਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "At the sacred place of Prabhas, Krishna slept cross legged with his foot on his knee."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਰਭਾਸ (ਨਾਮੇਂ ਤੀਰਥ) ਵਿਖੇ (ਕ੍ਰਿਸ਼ਨ) ਆਪਣੇ ਗੋਡੇ ਉੱਤੇ ਪੈਰ ਰੱਖਕੇ ਸੁੱਤਾ ਹੋਇਆ ਸੀ।"