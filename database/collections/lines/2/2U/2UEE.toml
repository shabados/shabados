data = "ਜ਼ਿ ਤੋ ਦੋਸਤੀ ਮਨ ਬ ਬਾਜ਼ ਆਮਦਮ ॥"
page = 1407

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘I am better off without your friendship, I renounce your fraternity."

