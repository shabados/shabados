[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਬਦੁ ਪਛਾਣੈ ਰਵਿ ਰਹੈ; ਨਾ ਤਿਸੁ ਕਾਲੁ ਸੰਤਾਇ ॥"
page = 58
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Death agonises not him who recognises the Word and merges in it.9"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੌਤ ਉਸ ਨੂੰ ਦੁਖਾਂਤ੍ਰ ਨਹੀਂ ਕਰਦੀ ਜੋ ਸ਼ਬਦ ਨੂੰ ਸਿੰਞਾਣਦਾ ਹੈ ਤੇ ਉਸ ਵਿੱਚ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who recognizes the Shabad merges into it, and is not afflicted by death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ (ਸਬਦੁ) ਬ੍ਰਹਮ ਕੋ ਪਛਾਣ ਕਰ ਕੇ ਅਭੇਦ ਹੋ ਰਹੇ ਹੈਂ ਤਿਨ ਕੋ ਕਾਲ ਨਹੀਂ ਸੰਤਾਵਤਾ ਹੈ, ਭਾਵ ਏਹ ਕਿ ਜਨਮ ਮਰਣ ਸੇ ਰਹਤ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਨਾਲ ਸਾਂਝ ਪਾਂਦਾ ਹੈ (ਪ੍ਰਭੂ ਚਰਨਾਂ ਵਿਚ) ਜੁੜਿਆ ਰਹਿੰਦਾ ਹੈ ਉਸ ਨੂੰ ਮੌਤ (ਦਾ ਡਰ) ਸਤਾ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਵਿ ਰਹੇ = (ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਵਿਚ) ਜੁੜਿਆ ਰਹੇ। ਨਾ ਸੰਤਾਇ = ਨਹੀਂ ਸਤਾਂਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero aquél que reconoce la Palabra del Shabd y se inmerge en Ella, el tiempo para él no transcurre."