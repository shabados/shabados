[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਹੰਬੁਧਿ; ਤਿਨਿ ਸਗਲ ਤਿਆਗੀ ॥੨॥"
page = 187
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and that has wholly removed my haughty intellect."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਨੇ ਮੇਰੀ ਹੰਕਾਰੀ ਮਤ ਸਮੂਹ ਨਵਿਰਤ ਕਰ ਦਿਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "which has removed all my arrogant intellect. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕਰ ਮੈਨੇ ਅਹੰਬੁਧਿ ਸੰਪੂਰਨ ਤਿਆਗ ਦਈ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਆਪਣੀ ਸਾਰੀ ਹਉਮੈ (ਪੈਦਾ ਕਰਨ ਵਾਲੀ) ਬੁੱਧੀ ਤਿਆਗ ਦਿੱਤੀ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਹੰਬੁਧਿ = 'ਹਉ ਹਉ' ਕਰਨ ਵਾਲੀ ਅਕਲ। ਤਿਨਿ = ਉਸ (ਮਨੁੱਖ) ਨੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así me deshago de mi egocéntrica actitud.  (2)"