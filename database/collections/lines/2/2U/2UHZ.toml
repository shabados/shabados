[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹੋਰਤੁ ਰਾਤੀ ਉਠਿ ਕੈ; ਚਲਿਆ ਪਿਛੈ ਤਰਲ ਜੁਆਣੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The following night he followed the young queen."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਹੋਰ (ਦੂਜੀ) ਰਾਤ ਨੂੰ ਉੱਠਕੇ ਪਿਛੇ ਲੱਗ ਤੁਰਿਆ (ਉਸ) ਚੰਚਲ ਜੁਆਨ ਰਾਣੀ ਦੇ।"