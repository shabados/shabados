data = "ਅਵਰ ਤ੍ਰਿਯਨ ਕੇ ਰਸ ਅਨੁਰਾਗਿਯੋ ॥੩॥"
page = 879

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He abandoned adoring her and became the lover of some other ladies.(3)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਹੋਰਨਾਂ ਇਸਤਰੀਆਂ ਨਾਲ ਪ੍ਰੇਮ ਕਰਨ ਲਗ ਗਿਆ ॥੩॥"