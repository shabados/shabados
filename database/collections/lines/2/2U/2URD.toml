[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਥੈ ਨਿਬੜੈ; ਸਾਚੁ ਨਿਆਉ ॥"
page = 1188
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True justice is administered there."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਓਥੇ ਸੱਚਾ ਇਨਸਾਫ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True justice is administered there."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਤਿਥੈ) ਉਸ ਪਰਮੇਸ੍ਵਰ ਕੇ ਪਾਸ ਸਚਾ ਨਿਆਉਂ ਨਿਬੜਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਦਰਗਾਹ ਵਿਚ ਸਦਾ ਸਦਾ-ਥਿਰ ਨਿਆਂ ਹੀ ਚੱਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਥੈ = ਉਸ ਪ੍ਰਭੂ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ। ਨਿਬੜੈ = ਨਿੱਬੜਦਾ ਹੈ, ਚੱਲਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ante Él sólo la Verdad se considera Verdadera."