[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਹਾ ਰੂਪ ਪਾਪੀ, ਕੁਵਿਤ੍ਰਾਧਿਕਾਰੰ ॥੫੭॥"
page = 557

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The men and women will forsake dharma and absorb themselves in sinful deeds and the great sinners will become the administration.57."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵੱਡੇ ਰੂਪ (ਸਮਰਥਾ) ਵਾਲੇ ਮਾੜੀ ਕਮਾਈ ਦੇ ਅਧਿਕਾਰੀ ਹੋਣਗੇ ॥੫੭॥"