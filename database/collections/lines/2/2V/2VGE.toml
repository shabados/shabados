[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਨਸ ਜਨਮਿ; ਗੁਰ ਭਗਤਿ ਦ੍ਰਿੜਾਏ ॥"
page = 1061
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It is in Human life alone, that one can enshrine the Great God's meditation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਮਨੁੱਖੀ ਜਨਮ ਵਿੱਚ ਹੀ ਜੀਵ ਵਿਸ਼ਾਲ ਵਾਹਿਗੁਰੂ ਦੀ ਬੰਦਗੀ ਧਾਰਨ ਕਰ ਸਕਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Only in this human life, is devotional worship to the Guru implanted within."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਨਸ ਜਨਮ ਮੇਂ ਗੁਰ ਭਗਤੀ ਦ੍ਰਿੜਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੀ ਮਿਹਰ ਨਾਲ ਹੀ) ਮਨੁੱਖਾ ਜਨਮ ਵਿਚ ਗੁਰੂ ਜੀਵ ਦੇ ਅੰਦਰ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਪੱਕੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨਮਿ = ਜਨਮ ਵਿਚ। ਦ੍ਰਿੜਾਏ = ਹਿਰਦੇ ਵਿਚ ਪੱਕੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en donde hombres y mujeres pueden ser Devotos del Guru."