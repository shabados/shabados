[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਹੁ ਨਿਰਮਲੁ ਹੈ; ਨਾਹੀ ਅੰਧਿਆਰਾ ॥"
page = 1026
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is immaculate and in Him there in no darkness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਵਿੱਤ੍ਰ ਹੈ ਤੇ ਉਸ ਵਿੱਚ ਅਨ੍ਹੇਰਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is immaculate, and has no darkness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਨਿਰਮਲੁ ਹੈ ਔ ਅਗ੍ਯਾਨ ਤਿਸ ਵਿਖੇ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਰਮਾਤਮਾ ਸੁੱਧ-ਸਰੂਪ ਹੈ, ਉਸ ਵਿਚ (ਮਾਇਆ ਦੇ ਮੋਹ ਆਦਿਕ ਦਾ) ਰਤਾ ਭੀ ਹਨੇਰਾ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਹੁ = ਪਰਮਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es Inmaculado, y Toda Luz, sin oscuridad alguna"