[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭੁ ਕੋਊ ਕਹੈ; ਜਾਸੁ ਕੀ ਬਾਤਾ ॥"
page = 330
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, of whom everyone speaks,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਜਿਸ ਦੀ ਹਰ ਕੋਈ ਗੱਲ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everyone speaks of Him; He is All-powerful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਉਤਪਤੀ ਪਾਲਨਾ ਸੰਘਾਰ ਕੀਆਂ ਬਾਤਾਂ ਸਭ ਕੋਈ ਕਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪ੍ਰਭੂ ਦੀਆਂ (ਵਡਿਆਈਆਂ ਦੀਆਂ) ਗੱਲਾਂ ਹਰੇਕ ਜੀਵ ਕਰ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭੁ ਕੋਊ = ਹਰੇਕ ਜੀਵ। ਜਾਸੁ ਕੀ = ਜਿਸ (ਪ੍ਰਭੂ) ਦੀਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, de quien todos hablan, es Todopoderoso,"