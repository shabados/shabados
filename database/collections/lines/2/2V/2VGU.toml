[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨ ਕਉ; ਕਾਲੁ. ਨ ਸਾਕੈ ਪੇਲਿ ॥"
page = 353
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the death cannot crush."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਨੂੰ ਮੌਤ ਕੁਚਲ ਨਹੀਂ ਸਕਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "cannot be crushed by death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੋ ਕਾਲ (ਪੇਲਿ) ਦਬਾਇ ਵਾ ਚਲਾਇ ਨਹੀਂ ਸਕਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਨੂੰ ਮੌਤ ਦਾ ਡਰ ਢਾਹ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੇਲਿ ਨ ਸਾਕੈ = ਪੀੜ ਨਹੀਂ ਸਕਦਾ, ਡੇਗ ਨਹੀਂ ਸਕਦਾ। ਕਾਲੁ = ਮੌਤ (ਦਾ ਡਰ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a ellos el tiempo no los destruye en su molino."