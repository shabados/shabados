[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸੁ ਏਕੇ ਕਾ ਜਾਣੈ ਭੇਉ ॥"
page = 930
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who knows the secret of this one God,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਇਸ ਇੱਕ ਵਾਹਿਗੁਰੂ ਦੇ ਭੇਤ ਨੂੰ ਜਾਣ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who knows the mystery of the One God,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਏਕ ਪਰਮੇਸ੍ਵਰ ਕਾ ਜੋ ਭੇਤ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਪ੍ਰਭੂ ਦਾ ਇਹ ਭੇਤ ਜਾਣ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਸੁ ਏਕੇ ਕਾ = ਜਗਤ ਨੂੰ ਸਵਾਰਣ ਵਾਲੇ ਇੱਕ ਪ੍ਰਭੂ ਦਾ। ਭੇਉ = (ਇਹ) ਭੇਤ (ਕਿ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que conoce la Esencia de Dios,"