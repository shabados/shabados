[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਸਿਰ ਨੂੰ ਪੈਰ ਬਣਾ ਕੇ ਚਲ, ਤਾਣ ਜੋ ਉਸ ਪਿਆਰੇ ਦੇ ਰਾਹ ਉੱਤੇ ਟੁਰ ਸਕੇਣ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਸਰ ਕਦਮ ਸਾਜ਼ ਕਿ ਤਾ ਦਰ ਰਹਿ ਆਣ ਯਾਰ ਸ਼ਵੀ ॥੬੧॥੩॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "There is no purpose (of life) better than the remembrance of Akaalpurakh,"