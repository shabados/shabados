[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਿਖਿਆ ਪਲੈ ਪਾਇ; ਗਰਬੁ ਵਞਾਈਐ ॥੬॥"
page = 420
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then one obtains what it written in his lot and stills his ego."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਛ ਉਸ ਦੇ ਭਾਗਾਂ ਵਿੱਚ ਲਿਖਿਆ ਹੋਇਆ ਹੈ, ਤਦ ਆਦਮੀ ਉਸ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ ਅਤੇ ਆਪਣੀ ਹਊਮੈ ਨੂੰ ਛੱਡ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They obtain what is written in their destiny, and overcome pride. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਹਮਾਰੇ ਮਸ੍ਤਕ ਮੇਂ ਲਿਖਾ ਹੈ, ਸੋਈ ਹਮ ਕੋ ਮਿਲੈਗਾ, ਜਬ ਐਸਾ ਨਿਸਚ੍ਯ ਕਰੀਏ ਤਬ ਹੰਕਾਰ ਦੂਰ ਕਰੀਤਾ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਣ ਦੂਰ ਕਰ ਦੇਣਾ ਚਾਹੀਦਾ ਹੈ, (ਪ੍ਰਭੂ ਦੀ ਰਜ਼ਾ ਵਿਚ ਹੀ) ਹਰੇਕ ਜੀਵ ਆਪਣੇ ਕੀਤੇ ਕਰਮਾਂ ਦੇ ਸੰਸਕਾਰਾਂ ਅਨੁਸਾਰ ਪ੍ਰਾਪਤੀ ਕਰਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਞਾਈਐ = ਦੂਰ ਕਰੀਏ। ਗਰਬੁ = ਅਹੰਕਾਰ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "uno cumple con el decreto de su Destino y transforma su ego. (6)"