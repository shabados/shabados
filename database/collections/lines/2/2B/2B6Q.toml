[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੂਹੀ ਮਹਲਾ ੫ ਗੁਣਵੰਤੀ ॥"
page = 763
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Suhi, 5th Guru. Gunwanti."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੂਹੀ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ। ਗੁਣਵੰਤੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Soohee, Fifth Mehl, Gunvantee ~ The Worthy And Virtuous Bride:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਗੁਣਵੰਤੀ) ਪ੍ਰੇਮ ਗੁਨ ਵਾਲੀ ਉਤਮ ਜਗ੍ਯਾਸੀ ਕਹਤੀ ਹੈ:"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Suji, Mejl Guru Aryan, Quinto Canal Divino, Gunvanti,  - La Novia Virtuosa y Merecedora -"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਣਵੰਤੀ = ਗੁਣਾਂ ਵਾਲੀ।"