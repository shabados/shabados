[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਲੂਆ ਕੇ ਗ੍ਰਿਹ; ਭੀਤਰਿ ਬਸੈ ॥"
page = 267
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He abides in the house of sand."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਰੇਤ ਦੇ ਘਰ ਵਿੰਚ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He lives in a castle of sand."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰੇਤੇ ਕੇ ਘਰ ਵਤ ਜੋ ਖਿਨਭੰਗਰ ਸਰੀਰ ਹੈ ਤਿਸ ਕੇ ਬੀਚ ਇਹ ਜੀਵ ਵਸਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰੇਤ ਦੇ ਘਰ ਵਿਚ ਵੱਸਦਾ ਹੈ (ਭਾਵ ਰੇਤ ਦੇ ਕਿਣਕਿਆਂ ਵਾਂਗ ਉਮਰ ਛਿਨ ਛਿਨ ਕਰ ਕੇ ਕਿਰ ਰਹੀ ਹੈ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਲੂਆ = ਰੇਤ। ਗ੍ਰਿਹ = ਘਰ। ਭੀਤਰਿ = ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vive en un castillo de arena;"