[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਅਬਿਨਾਸੀ; ਤੁਮਰੈ ਸੰਗਿ ॥"
page = 238
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Imperishable God is with thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਮਰ ਵਾਹਿਗੁਰੂ ਤੇਰੇ ਨਾਲ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Imperishable Lord is always with you."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਸ ਰਹਤ ਹਰੀ ਤੁਮਾਰੇ ਸੰਗ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਉਹ ਕਦੇ ਨਾਸ ਨਾਹ ਹੋਣ ਵਾਲਾ ਪਰਮਾਤਮਾ ਸਦਾ ਤੇਰੇ ਨਾਲ ਵੱਸਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗਿ = ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Eterno está siempre contigo,"