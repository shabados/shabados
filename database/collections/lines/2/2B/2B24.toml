[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚਉਰਾਸੀਹ ਲਖ ਜੂਨਿ ਵਿਚਿ; ਉਤਮ ਮਾਣਸ ਜੂਨਿ ਭਲੇਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Among eighty-four lakh species of life, the human life is the best one."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਚਉਰਾਸੀ ਲਖ ਜੋਨੀਆਂ ਵਿੱਚੋਂ ਮਾਣਸ ਜੋਨੀ ਉੱਤਮ ਅਤੇ ਭਲੀ ਹੈ।"