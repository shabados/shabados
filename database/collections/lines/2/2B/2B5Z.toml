data = "(ਜਿਸ ਨੇ) ਸਾਰੀ ਧਰਤੀ ਅਤੇ ਆਕਾਸ਼ (ਦੀ ਸਾਜਨਾ ਕਰ ਕੇ ਆਪਣੇ) ਅਧੀਨ ਕੀਤਾ ਹੈ,"