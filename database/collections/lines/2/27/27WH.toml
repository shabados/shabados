data = "He is magnanimous and knows all in the earth and heavens(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਹਾਨ ਅਤੇ ਧਰਤੀ ਤੇ ਆਕਾਸ਼ ਵਿਚਲੇ ਭੇਦਾਂ ਨੂੰ ਸਮਝਣਾ ਵਾਲਾ ਹੈ ॥੨॥"