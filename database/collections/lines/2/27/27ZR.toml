[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਰਮੇ ਭੂਲਾ; ਫਿਰੈ ਅਭਾਗਾ ॥"
page = 1061
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lost in doubt, the unfortunate one wanders about."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਰਮ ਅੰਦਰ ਭੁਲਿਆ ਹੋਇਆ ਉਹ ਨਿਕਰਮਣ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Deluded by doubt, the unfortunate wander around in confusion."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਅਭਾਗਾ ਭਰਮ ਮੇਂ ਭੂਲਾ ਹੂਆ ਜੂਨੀਓਂ ਮੇਂ ਫਿਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੰਦ-ਭਾਗੀ ਮਨੁੱਖ ਭਟਕਣਾ ਵਿਚ ਪੈ ਕੇ ਕੁਰਾਹੇ ਪਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਰਮੈ = ਭਟਕਣਾ ਵਿਚ ਪੈ ਕੇ। ਭੂਲਾ = ਕੁਰਾਹੇ ਪਿਆ ਹੋਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ese desafortunado vaga perdido en la duda. Sí, si la Gracia de Dios está en uno,"