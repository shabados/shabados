[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦਿਨੁ ਧਿਆਈਐ ਨਾਮੁ ॥"
page = 896
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day reflect thou over the Name;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਦਿਨ ਤੂੰ ਨਾਮ ਦਾ ਆਰਾਧਨ ਕਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, meditate on the Naam, the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਦਿਨ ਨਾਮ ਕੋ ਧਿਆਈਐ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹਰ ਵੇਲੇ ਸਿਮਰਨਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਦਿਨੁ = {अनुदिनं} ਹਰ ਰੋਜ਼, ਹਰ ਵੇਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora medito en el Señor noche y día,"