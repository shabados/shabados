[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਿਆਨ ਰਤਨਿ ਮਨੁ ਮਾਜੀਐ; ਬਹੁੜਿ. ਨ ਮੈਲਾ ਹੋਇ ॥"
page = 992
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If man cleanses his soul with the jewel of gnosis, it goes not dirty again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਬੰਦਾ ਆਪਣੀ ਆਤਮਾ ਨੂੰ ਬ੍ਰਹਮ ਗਿਆਤਾ ਦੇ ਹੀਰੇ ਨਾਲ ਸਾਫ਼ ਕਰ ਲਵੇ, ਇਹ ਮੁੜ ਕੇ ਗੰਦੀ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the mind is cleaned with the jewel of spiritual wisdom, it does not become dirty again."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਮਨ ਕੋ ਵਵੇਕ ਕਰ ਕੇ (ਮਾਜੀਐ) ਸੁਧ ਕਰੀਏ ਤਾਂ ਫੇਰ ਕਬੀ ਮੈਲਾ ਨਾ ਹੋਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੀ ਡੂੰਘੀ ਸਾਂਝ-ਰੂਪ ਰਤਨ ਨਾਲ ਮਨ ਨੂੰ ਲਿਸ਼ਕਾਣਾ ਚਾਹੀਦਾ ਹੈ, ਮੁੜ ਇਹ (ਵਿਕਾਰਾਂ ਵਿਚ) ਮੈਲਾ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਤਨਿ = ਰਤਨ ਨਾਲ। ਮਾਜੀਐ = ਸਾਫ਼ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ। ਬਹੁੜਿ = ਮੁੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y puede limpiar la mente sólo con la Joya de la Sabiduría;"