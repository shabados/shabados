type = "primary"
data = "ਏਕ ਬੀਰ ਸਾਬਤ ਨ ਉਬਰਿਯੋ ॥"
page = 990

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Most of the soldiers, while fighting, were injured and none was spared."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਵੀ ਸੂਰਮਾ ਸਾਬਤ ਸਬੂਤ ਨਹੀਂ ਬਚਿਆ ਸੀ।"