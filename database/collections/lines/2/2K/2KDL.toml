[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਜਨਿ; ਅਪਨਾ ਪ੍ਰਭੂ ਪਛਾਤਾ ॥"
page = 286
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The man who recognises his Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਇਨਸਾਨ ਆਪਣੇ ਸੁਆਮੀ ਨੂੰ ਸਿਆਣਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those humble beings who recognizes God"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਹਰਿ ਜਨ ਨੇ ਆਪਨਾ ਪ੍ਰਭੂ ਪਛਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਅਪਣੇ ਪ੍ਰਭੂ ਨੂੰ ਪਛਾਣ ਲਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ ਜਨਿ = ਜਿਸ ਮਨੁੱਖ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquellos humildes que reconozen a Dios,"