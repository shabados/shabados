[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਬੂਝਿਆ; ਤਿਸੁ ਆਇਆ ਸ੍ਵਾਦ ॥"
page = 285
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who understands the Lord tastes the joy."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੁਆਮੀ ਨੂੰ ਸਮਝਦਾ ਹੈ, ਉਹੀ ਅਨੰਦ ਨੂੰ ਮਾਨਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who realizes this, comes to taste this state of joy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੈ ਇਹ ਸਰੂਪ ਸਮਝਿਆ ਹੈ ਤਿਨੋਂ ਕੋ ਇਸ ਕਾ ਰਸੁ ਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਵਡਿਆਈ ਤੱਕ ਕੇ) ਉਹ ਬੜੇ ਹੈਰਾਨ ਤੇ ਅਸਚਰਜ ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸ੍ਵਾਦ = ਆਨੰਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que ha concebido en Sí Mismo la Verdad, goza del sabor del Júbilo."