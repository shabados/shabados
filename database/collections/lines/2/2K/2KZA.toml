[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁਯੰਭਵ ਸੁਭੰ, ਸਰਬ ਦਾ ਸਰਬ ਜੁਗਤੇ ॥"
page = 10
line = 18

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Salutation to Thee O Self-Existent, Most Beautiful and United with all Lord!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਆਪ ਸ਼ੋਭਾਇਮਾਨ ਹੋਣ ਵਾਲਾ, ਸਦਾ ਹੀ ਸਭ ਨਾਲ ਸੰਯੁਕਤ ਰਹਿਣ ਵਾਲਾ ਹੈਂ;"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਸੁਯੰਭਵ ਸੁਭੰ, ਸਰਬਦਾ ਸਰਬ ਜੁਗਤੇ ॥"