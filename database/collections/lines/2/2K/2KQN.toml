data = "ਮਨੰ ਮਾਨਕੰ ਬਧ ਰਧੰ ਦੁਰੰਤੰ ॥੬੮੨॥"
page = 271

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The chariots, diamonds, raiments and invaluable precious stones were also presented.682."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨਾਲ ਮਣੀ ਅਤੇ ਮਾਣਕਾਂ ਦੇ ਅਮੋਲਕ ਗੁੱਛੇ ਬੰਨ੍ਹੇ ਹੋਏ ਸਨ ॥੬੮੨॥"