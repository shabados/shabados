[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਭੂਲਾ; ਜਿ ਪ੍ਰਭੂ ਭੁਲਾਇਆ ॥"
page = 1004
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone is strayed, who is strayed by the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਭੁਲਦਾ ਹੈ ਜਿਸ ਨੂੰ ਸੁਆਮੀ ਭੁਲਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is deluded, who is deluded by God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪ੍ਰਭੂ ਨੇ ਭੁਲਾਇਆ ਹੈ, ਸੋ ਭੂਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਮਨੁੱਖ ਕੁਰਾਹੇ ਪੈਂਦਾ ਹੈ ਜਿਸ ਨੂੰ ਪ੍ਰਭੂ ਆਪ ਕੁਰਾਹੇ ਪਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੂਲਾ = ਕੁਰਾਹੇ ਪੈ ਗਿਆ। ਭੁਲਾਇਆ = ਕੁਰਾਹੇ ਪਾ ਦਿੱਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y será desviado quien sea desviado por Dios."