[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਵਿ ਸਸਿ ਪਵਣੁ; ਪਾਵਕੁ ਨੀਰਾਰੇ ॥"
page = 237
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the sun, the moon, wind, fire, and water,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੂਰਜ, ਚੰਦਰਮਾ, ਹਵਾ, ਅਗ ਅਤੇ ਪਾਣੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the sun, the moon, the wind, water and fire;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਰਵਿ) ਸੂਰਜ ਔਰ (ਸਸਿ) ਚੰਦ੍ਰਮਾਂ ਪੁਨਾ (ਪਾਵਕੁ) ਅਗਨੀ ਤਥਾ (ਨੀਰਾਰੇ) ਜਲੁ ਵਾ ਜਲਦੇ ਘਰ ਸਮੁੰਦ੍ਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੂਰਜ, ਚੰਦ, ਹਵਾ, ਅੱਗ, ਪਾਣੀ, ਦਿਨ ਤੇ ਰਾਤ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਵਿ = ਸੂਰਜ। ਸਸਿ = ਚੰਦ੍ਰਮਾ। ਪਾਵਕੁ = ਅੱਗ। ਨੀਰਾਰੇ = ਨੀਰ, ਪਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El sol, la luna, el aire, el fuego y el agua."