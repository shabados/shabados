[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਗਊ ਚਰਾਵੈ ਬਾਨਾ ॥"
page = 1083
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself grazes the cows in the forest."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਖ਼ੁਦ ਹੀ ਗਾਈਆਂ ਨੂੰ ਜੰਗਲ ਵਿੱਚ ਚਰਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself grazes the cows in the forest."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਤੂੰ ਬਨੋਂ ਮੇਂ ਗਊਓਂ ਕੋ ਚਰਾਵਤਾ ਰਹਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਹੀ ਗਊਆਂ ਨੂੰ ਬਿੰਦ੍ਰਾਬਨ ਵਿਚ ਚਾਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਨਾ = ਬਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo pastorea las vacas en la pradera."