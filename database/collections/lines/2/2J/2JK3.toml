[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਭਾਵੈ; ਤਿਉ ਰਾਖਿ ਲੇ ॥"
page = 1181
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As Thou please, so Thou keep me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਤੈਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ, ਉਸੇ ਤਰ੍ਹਾਂ ਹੀ ਤੂੰ ਮੇਰੀ ਰੱਖਿਆ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As it pleases Your Will, save me, Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜ੍ਯੋਂ ਤੇਰੇ ਕੋ ਭਾਵੇ ਤਿਵੇਂ ਰਖ੍ਯਾ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਤੈਨੂੰ ਚੰਗਾ ਲੱਗੇ ਤਿਵੇਂ (ਮੇਰੀ) ਰੱਖਿਆ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Consérvame entonces en Tu Voluntad,"