[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੁਰੰਕ. ਨਾਦੈ ਨੇਹੁ ॥"
page = 838
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the deer loves music,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਹਰਨ ਰਾਗ ਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As the deer loves the sound of the bell,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ (ਕੁਰੰਕ) ਮ੍ਰਿਗ ਕਾ ਘੰਡਾਹੇੜੇ ਕੇ (ਨਾਦੈ) ਸਬਦ ਸੁਣਨੇ ਮੇਂ (ਨੇਹੁ) ਪ੍ਰੇਮੁ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਹਰਨ ਦਾ ਘੰਡੇਹੇੜੇ ਦੀ ਆਵਾਜ਼ ਨਾਲ ਪਿਆਰ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੁਰੰਕ = ਹਰਨ। ਨਾਦੈ ਨੇਹੁ = ਨਾਦ ਦਾ ਪਿਆਰ। ਨਾਦ = ਖੱਲ ਨਾਲ ਮੜ੍ਹੇ ਹੋਏ ਘੜੇ ਦੀ ਆਵਾਜ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como el venado ama la música,"