[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਾਜ ਭੂਖਿ ਭਾਗਤ ਸਭੈ; ਬਿਸਰਤ ਸਕਲ ਸਿਯਾਨ ॥੯॥"
page = 945

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They become shameless, their wisdom flies away and they relinquish the urge of eating.(9)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਸਾਰੀ ਭੁਖ ਅਤੇ ਲਾਜ ਖ਼ਤਮ ਹੋ ਜਾਂਦੀ ਹੈ ਅਤੇ ਸਾਰੀ ਸਿਆਣਪ ਭੁਲ ਜਾਂਦੀ ਹੈ ॥੯॥"