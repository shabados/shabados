[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰਿ ਰਤਨੁ; ਮਿਲੈ ਮਿਲਾਇਆ ॥"
page = 117
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within the mortal is the Name jewel. It is obtained if the Guru makes it accessible."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਾਣੀ ਦੇ ਅੰਦਰ ਨਾਮ ਦਾ ਜਵੇਹਰ ਹੈ। ਜੇਕਰ ਗੁਰੂ ਜੀ ਪ੍ਰਾਪਤ ਕਰਾਉਣ ਤਾਂ ਇਹ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Deep within the nucleus of the self is the jewel; we receive it only if the Lord inspires us to receive it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅੰਤਹਕਰਣ ਜਿਸ ਕੀ ਉਪਾਧੀ ਹੈ ਐਸਾ ਸਾਖੀ ਚੈਤਨ ਰੂਪ ਰਤਨ ਹੈ, ਸੋ ਅੰਤਰ ਹੀ ਹੈ, ਪਰੰਤੂ ਗੁਰੋਂ ਕਾ ਮਿਲਾਯਾ ਹੂਆ ਮਿਲਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਹਰੇਕ ਜੀਵ) ਦੇ ਅੰਦਰ (ਪ੍ਰਭੂ ਦੀ ਜੋਤਿ-) ਰਤਨ ਮੌਜੂਦ ਹੈ, ਪਰ ਇਹ ਰਤਨ ਤਦੋਂ ਹੀ ਮਿਲਦਾ ਹੈ ਜੇ (ਗੁਰੂ) ਮਿਲਾ ਦੇਵੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਤਰਿ = ਸਰੀਰ ਦੇ ਅੰਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En lo profundo del Ser está la Joya y La recibimos sólo si el Señor nos otorga la inspiración para recibirla,"