[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੀੜੀ ਵਾਕ ਨ ਥੰਮੀਐ; ਹਸਤੀ ਦਾ ਭਾਰੁ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "An ant cannot bear the weight of an elephant."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕੀੜੀ ਪਾਸੋਂ ਹਾਥੀ ਦਾ ਭਾਰ ਧੰਮ੍ਹੀਦਾ ਨਹੀਂ।"