type = "primary"
data = "ਕੈ ਅਤਿਥਿ ਹੋਊਾਂ ਤਜ ਰਾਜ ਸਾਜ ॥"
page = 203

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then the king expressed this wish that either he would burn himself that day or forsaking his kingdom, he would go to the forest,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਾਂ ਰਾਜ ਸਾਜ ਛੱਡ ਕੇ ਜੋਗੀ (ਅਤਿਥਿ) ਹੋ ਜਾਵਾਂ?"