[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਿ ਕਬੀਰ; ਜਾ ਕਾ ਨਹੀ ਅੰਤੁ ॥"
page = 971
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir, who has no limit,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ, ਜਿਸ ਦਾ ਕੋਈ ਓੜਕ ਨਹੀਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, He has no limits;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਸ ਕੇ ਪ੍ਰਤਾਪ ਕਾ ਅੰਤ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ ਕਿ ਉਸ ਪ੍ਰਭੂ ਦੇ ਗੁਣਾਂ ਦਾ ਅੰਤ ਨਹੀਂ ਪੈ ਸਕਦਾ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "dice Kabir, Infinito y Sin Fronteras es ese Dios"