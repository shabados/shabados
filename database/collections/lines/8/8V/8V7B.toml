[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਸਾਧੂ ਅੰਜੁਲੀ; ਪੁੰਨੁ ਵਡਾ ਹੇ ॥"
page = 171
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Make obeisance with joined hands unto the Saint Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਗੁਰਾਂ ਨੂੰ ਹਥ ਜੋੜ ਕੇ ਨਮਸ਼ਕਾਰ ਕਰ, ਇਹ ਇਕ ਭਾਰਾ ਨੇਕ ਕੰਮ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Greet the Holy Saint with your palms pressed together; this is an act of great merit."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਓਂ ਕੋ (ਔਜੁਲੀ) ਹਾਥ ਜੋੜ ਕਰ ਨਮਸਕਾਰ ਕਰੀਏ, ਤਬ ਵਡਾ ਪੁਨੁ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਗੁਰੂ ਅੱਗੇ ਹੱਥ ਜੋੜ ਕੇ ਨਮਸਕਾਰ ਕਰ, ਇਹ ਵੱਡਾ ਨੇਕ ਕੰਮ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਜੁਲੀ = {अंजलिः ਬੁੱਕ। अंजलि कृ = ਦੋਵੇਂ ਹੱਥ ਜੋੜ ਕੇ ਨਮਸਕਾਰ ਕਰਨ ਲਈ ਸਿਰ ਤਕ ਅਪੜਾਣੇ} ਹੱਥ ਜੋੜ ਕੇ ਅਰਦਾਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Saluda con tus palmas juntas a los Santos, ésta es una acción de gran mérito,"