[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਤਿ ਭ੍ਰਿਤ ਪਤਿ ਲੈ ਘਰ ਗਏ; ਉਤੈ ਨ ਜਾਨਤ ਕੋਇ ॥੬॥"
page = 988

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Bere, they brought Nabhi to his house and no one noticed even.(6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਧਰ ਨੌਕਰ ਨਬੀ ਖ਼ਾਨ ਨੂੰ ਘਰ ਲੈ ਗਏ ਅਤੇ ਉਧਰ (ਇਸ ਗੱਲ ਦਾ) ਕਿਸੇ ਨੂੰ ਪਤਾ ਨਾ ਲਗਿਆ ॥੬॥"