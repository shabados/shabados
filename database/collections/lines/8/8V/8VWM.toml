[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਖੀ. ਪ੍ਰੇਮ ਕਸਾਈਆ; ਜਿਉ ਬਿਲਕ ਮਸਾਈ, ਰਾਮ ॥"
page = 845
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Mine eyes are drawn towards the Lord's love, as are the cat's towards the mouse."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਨੇਤ੍ਰ ਪ੍ਰਭੂ ਦੀ ਪ੍ਰੀਤ ਵੱਲ ਐਉਂ ਖਿਚੇ ਹੋਏ ਹਨ, ਜਿਸ ਤਰ੍ਹਾਂ ਬਿੱਲੀ ਦੇ ਚੂਹੇ ਵੱਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My eyes are drawn to His Love, like the cat to the mouse."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੀਆਂ ਅਖੀਆਂ ਹਰੀ ਪਿਰ ਕੇ ਪ੍ਰੇਮ ਕਰ ਕਸਾਈਆਂ ਕਸ ਖੈਚ ਵਿਚਿ ਆਈਆਂ ਰਹਿਤੀਆਂ ਹੈਂ। ਜੈਸੇ (ਬਿਲਕ) ਬਿਲੀ ਕੀਆਂ ਅਖੀਆਂ (ਮਸਾਈ) ਮਾਸ ਕੀ ਤਰਫ ਖੈਂਚੀ ਰਹਿਤੀ ਹੈ, ਭਾਵ ਤਿਨ ਕੇ ਮਨ ਬੁਧੀ ਧ੍ਯਾਨ ਪਰਾਇਣ ਰਹਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਜੀਵ-ਇਸਤ੍ਰੀ ਦੀਆਂ) ਅੱਖਾਂ ਨੇ ਪਿਆਰ ਦੀ ਖਿੱਚ ਖਾਧੀ, ਜਿਵੇਂ ਬਿੱਲੀ (ਦੀਆਂ ਅੱਖਾਂ) ਚੂਹੇ ਵਲ (ਖਾਂਦੀਆਂ ਹਨ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਖੀ = ਅੱਖੀਂ, (ਉਸ ਦੀਆਂ) ਅੱਖਾਂ। ਕਸਾਈਆ = ਖਿੱਚ ਖਾਧੀ, ਖਿੱਚੀਆਂ ਗਈਆਂ। ਬਿਲਕ = ਬਿੱਲੀ। ਮਸਾਈ = ਮੂਸਾ, ਚੂਹਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sus ojos se hunden en Él, así como los ojos del gato se hunden en el ratón."