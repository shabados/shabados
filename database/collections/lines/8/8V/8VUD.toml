[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੁਚਲੁ ਕਠੋਰੁ ਕਾਮੀ; ਮੁਕਤੁ ਕੀਜੈ ॥੪॥"
page = 738
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and emancipate me, the filthy, relentless and lustful one."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੈਂ, ਗੰਦੇ ਨਿਰਦਈ ਅਤੇ ਵਿਸ਼ਈ ਨੂੰ ਮੁਕਤ ਕਰ ਦਿਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am silly, stubborn and filled with sexual desire - please, liberate me! ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੰਦ ਕਾਲ ਖੋਟੀ ਰੀਤ ਵਾਲਾ ਔ ਕਠੋਰ ਰਿਦੇ ਔ ਕਾਮੀ ਜੀਵ ਹੂੰ, ਮੈਨੂੰ ਮੁਕਤ ਕੀਜੀਏ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੀਵ ਵਿਚਾਰਾ ਕੁਝ ਕਰਨ-ਜੋਗਾ ਨਹੀਂ, ਇਹ) ਮੰਦ-ਕਰਮੀ ਹੈ, ਨਿਰਦਈ ਹੈ, ਵਿਸ਼ਈ ਹੈ (ਫਿਰ ਭੀ ਤੇਰਾ) ਹੈ ਇਸ ਨੂੰ ਇਹਨਾਂ ਵਿਕਾਰਾਂ ਤੋਂ ਖ਼ਲਾਸੀ ਬਖ਼ਸ਼ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੁਚਲੁ = ਗੰਦਾ, ਮੈਲੇ ਆਚਰਨ ਵਾਲਾ। ਕਠੋਰੁ = ਨਿਰਦਈ। ਮੁਕਤੁ ਕੀਜੈ = ਵਿਕਾਰਾਂ ਤੋਂ ਬਚਾ ਲੈ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y emancípame, pues cometo todo tipo de errores, mi corazón está duro y vivo en la lujuria.(4)"