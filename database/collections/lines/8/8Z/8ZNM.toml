[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੂੜੋ ਠਾਕੁਰੁ; ਕਿਤੈ ਵਸਿ. ਨ ਆਵੈ ॥"
page = 1076
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The beauteous Lord is controlled not by any wise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁੰਦਰ ਸੁਆਮੀ ਕਿਸੇ ਤਰ੍ਹਾਂ ਭੀ ਵੱਸ ਵਿੱਚ ਨਹੀਂ ਆਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Beauteous Lord and Master is not controlled in any way."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੁੰਦਰ ਸ੍ਵਾਮੀ ਕਿਸੇ ਪ੍ਰਕਾਰ ਵਸ ਨਹੀਂ ਆਵਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੋਹਣਾ ਪ੍ਰਭੂ ਕਿਸੇ ਤਰੀਕੇ ਨਾਲ ਵੱਸ ਵਿਚ ਨਹੀਂ ਆਉਂਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੂੜੋ = ਸੁੰਦਰ। ਕਿਤੈ = ਕਿਸੇ ਤਰੀਕੇ ਨਾਲ। ਵਸਿ = ਵੱਸ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nadie puede gobernar o dirigir al Bello Señor de ninguna forma,"