[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਚਤੁਰ, ਪ੍ਰਮਾਨ ॥੫੦੨॥"
page = 740

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Shastar-ravani” in the beginning and then uttering “Ripu Ari”, the names of Tupak are formed.502."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਨਾਮ ਤੁਪਕ ਦਾ ਹੈ। ਪ੍ਰਬੀਨੋ! ਵਿਚਾਰ ਲਵੋ ॥੫੦੨॥"