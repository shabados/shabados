[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚੋਰੁ ਕਰੈ ਨਿਤ ਚੋਰੀਆਂ; ਓੜਕਿ ਦੁਖ ਭਾਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "A thief commits thefts daily but ultimnately has to suffer heavily."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਚੋਰ (ਪਰਾਈਆਂ) ਚੋਰੀਆਂ ਕਰਦਾ ਹੈ, (ਪਰੰਤੂ) ਅੰਤ ਨੂੰ ਭਾਰੀ ਦੁਖ ਭੋਗਦਾ ਹੈ।"