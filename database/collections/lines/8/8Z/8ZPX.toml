[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਹਿਬੁ ਮੇਰਾ ਅਤਿ ਭਾਰਾ ॥"
page = 896
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Exceedingly great is my Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਿਹਾਇਤ ਹੀ ਵੱਡਾ ਹੈ ਮੇਰਾ ਮਾਲਕ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My Lord and Master is so very great."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਵਹੁ ਸਾਹਿਬ ਮੇਰਾ ਅਤੀ (ਭਾਰਾ) ਬਡਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੇਰਾ ਮਾਲਕ-ਪ੍ਰਭੂ ਬਹੁਤ ਗੰਭੀਰ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਹਿਬੁ = ਮਾਲਕ। ਅਤਿ ਭਾਰਾ = ਬਹੁਤ ਗੰਭੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Maestro es Sublime;"