[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਵਰ ਆਸਾ ਸਭ ਲਾਹਿ ॥"
page = 895
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and give up all other hopes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਹੋਰ ਸਾਰੀਆਂ ਆਸਾਂ ਉਮੈਦਾਂ ਛੱਡ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Give up all other hopes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੋਰ ਇੱਛਾ ਸਭ ਲਾਹਿ ਦੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੋਰ (ਆਸਰਿਆਂ ਦੀਆਂ) ਸਭ ਆਸਾਂ (ਮਨ ਵਿਚੋਂ) ਦੂਰ ਕਰ ਦੇਹ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਾਹਿ = ਦੂਰ ਕਰ ਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no descanses tus esperanzas en nadie más."