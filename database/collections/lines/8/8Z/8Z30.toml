[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੀਤਰਿ ਏਕੁ ਅਨੇਕ ਅਸੰਖ ॥"
page = 413
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within the various and countless bodies, the one Lord is contained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਅਤੇ ਅਣਗਿਣਤ ਸਰੀਰਾਂ ਅੰਦਰ ਇੱਕ ਪ੍ਰਭੂ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One Lord dwells within the various and countless beings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਅਸੰਖ ਪਰਮਾਤਮਾ ਅਨੇਕ ਜੀਵੋਂ ਕੇ ਅੰਤਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਭ ਦੇ ਅੰਦਰ ਇਕੋ ਪਰਮਾਤਮਾ ਵੱਸ ਰਿਹਾ ਹੈ, ਉਹ ਅਨੇਕਾਂ ਅਸੰਖਾਂ ਰੂਪਾਂ ਵਿਚ ਦਿਖਾਈ ਦੇ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aunque son incontables los cuerpos, el Señor habita en cada uno de ellos."