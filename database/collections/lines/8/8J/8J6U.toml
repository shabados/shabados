[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਗਮੁ ਅਗੋਚਰੁ; ਗੁਰੂ ਦਿਖਾਇਆ ॥"
page = 1075
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Inaccessible and Inapprehensible Lord the Guru has shown me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਹੁੰਚ ਤੋਂ ਪਰੇ ਅਤੇ ਸੋਚ ਸਮਝ ਤੋਂ ਉਚੇਰੇ ਸੁਆਮੀ ਨੂੰ ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਵਿਖਾਲ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru has revealed the inaccessible and unfathomable Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਗਮ ਅਗੋਚਰ ਜੋ ਪਰਮੇਸੁਰ ਹੈ, ਸੋ ਸਤਿਗੁਰੋਂ ਨੇ ਦਿਖਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੇ ਹੀ ਉਸ ਨੂੰ ਅਪਹੁੰਚ ਤੇ ਅਗੋਚਰ ਪਰਮਾਤਮਾ ਦਾ ਦਰਸਨ ਕਰਾਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਮੁ = ਅਪਹੁੰਚ ਪ੍ਰਭੂ। ਅਗੋਚਰੁ = {ਅ-ਗੋ-ਚਰੁ} ਜਿਸ ਤਕ ਗਿਆਨ-ਇੰਦ੍ਰਿਆਂ ਦੀ ਪਹੁੰਚ ਨਹੀਂ ਹੋ ਸਕਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru nos hace ver al Insondable e Imperceptible Señor,"