data = "ਬਰੋ ਊਦ ਅਜ਼ ਜ਼ਾਫ਼ਰਾ ਰੇਖ਼ਤੰਦ ॥੧੮॥"
page = 1411

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then she coated it with saffron, and kindled incense around.(18)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕੇਸਰ ਤੇ ਉਦੂ (ਇਕ ਸੁਗੰਧ ਵਾਲੀ ਲਕੜੀ) ਨੂੰ ਰਗੜ ਕੇ ਛਿੜਕਿਆ ॥੧੮॥"