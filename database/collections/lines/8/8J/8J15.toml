assets = ["DGDG"]
type = "primary"
data = "ਦਾਤਾ ਦੁਰੰਤ ਦੁਖ ਦੋਖ ਰਹਤ ॥"
page = 36

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is the Donor, Endless and devoid of sufferings and blemishes.!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬੇਅੰਤ ਦਾਤਾ ਹੈ, ਦੁਖਾਂ-ਦੋਖਾਂ ਤੋਂ ਰਹਿਤ ਹੈ,"