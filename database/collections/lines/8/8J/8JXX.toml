[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਨਿਰਗੁਣ ਸਰਗੁਣ ਸਤਿਗੁਰੂ; ਵਿਰਲਾ ਕੋ ਗੁਰ ਸਬਦ ਸਮਾਸੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The true Guru (Lord) is without attributes and yet possesses all the qualities."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਨਿਰਗੁਣ ਅਤੇ ਸਰਗੁਣਾ ਰੂਪ ਸਤਿਗੁਰ ਨੂੰ ਹੀ ਜਾਣਕੇ ਕੋਈ ਵਿਰਲਾ ਗੁਰ ਸ਼ਬਦ ਵਿਖੇ ਸਮਾਏਗਾ।"