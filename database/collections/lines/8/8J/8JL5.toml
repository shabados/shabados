[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸਹਿ ਬਿਸਾਰੈ; ਮੁਗਧੁ ਅਜਾਨੁ ॥"
page = 267
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the ignorant fool forgets Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਸਮਝ, ਬੇਵਕੂਫ ਉਸ ਨੂੰ ਭੁਲਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and yet, the ignorant fool forgets Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ! ਅਗ੍ਯਾਨ ਕਰ ਕੇ ਤਿਸ ਕੋ ਤੂੰ ਈਹਾਂ ਭੁਲਾਵਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੂਰਖ ਤੇ ਅੰਞਾਣ ਜੀਵ ਉਸ ਪ੍ਰਭੂ ਨੂੰ ਵਿਸਾਰ ਬੈਠਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸਹਿ = ਉਸ (ਪ੍ਰਭੂ) ਨੂੰ। ਮੁਗਧੁ = ਮੂਰਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Este hombre seguirá viviendo en el error hasta que Tú,"