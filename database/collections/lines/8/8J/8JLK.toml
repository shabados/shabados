[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਬ ਲਉ ਰਨ ਮੈ ਹਮ ਜੀਵਤ ਹੈ; ਤਬ ਲਉ ਹਰਿ ਤੇ ਤੁਮ ਹੂੰ ਨ ਡਰੋ ॥"
page = 417

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Do not fear Krishna as long as we are alive"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦ ਤਕ ਅਸੀਂ ਰਣ-ਭੂਮੀ ਵਿਚ ਜੀਉਂਦੇ ਹਾਂ, ਤਦ ਤਕ ਤੁਸੀਂ ਕ੍ਰਿਸ਼ਨ ਤੋਂ ਨਾ ਡਰੋ।"