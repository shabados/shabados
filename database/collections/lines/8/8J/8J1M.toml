[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ; ਮਾਤ ਪੂਤਹਿ ਹੇਤੁ ॥"
page = 838
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the mother loves her son,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਮਾਂ ਆਪਣੇ ਬੱਚੇ ਨੂੰ ਪਿਆਰ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and as the mother loves her son,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਮਾਤਾ ਕਾ ਅਪਨੇ ਪੁਤ੍ਰ ਮੇਂ ਹਿਤ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਮਾਂ ਦਾ ਪੁੱਤਰ ਨਾਲ ਪਿਆਰ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਤਹਿ = ਪੁੱਤਰ ਨਾਲ। ਹੇਤੁ = ਪਿਆਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así como la madre se desvive por su hijo;"