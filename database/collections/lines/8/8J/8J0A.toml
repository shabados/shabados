[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਕੈ ਮਨਿ; ਇਹੁ ਅਨਰਾਉ ॥੧॥"
page = 284
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "in the mind of Nanak is this longing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਦੇ ਹਿਰਦੇ ਅੰਦਰ ਇਹ ਸੱਧਰ ਹੈ (ਹੇ ਪ੍ਰਭੂ)।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- this is the longing of Nanak's mind. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੈਂ ਜਨ ਕੇ ਮਨ ਮੇਂ ਇਹੀ (ਅਨਰਾਉ) ਪ੍ਰੇਮ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਦੇ ਮਨ ਵਿਚ ਇਹ ਤਾਂਘ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਅਨੁਰਾਉ = ਅਨੁਰਾਗ, ਤਾਂਘ, ਖਿੱਚ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es el único anhelo de la mente de Nanak.  (1)"