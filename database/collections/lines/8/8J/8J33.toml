[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਮੋਘ ਦਰਸੁ; ਸਫਲ ਜਾ ਕੀ ਸੇਵ ॥"
page = 392
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Accredited is their sight and fruitful their service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲਾਭਦਾਇਕ ਹੈ ਉਨ੍ਹਾਂ ਦਾ ਦਰਸ਼ਨ ਅਤੇ ਫਲਦਾਇਕ ਹੈ ਉਨ੍ਹਾਂ ਦੀ ਟਹਿਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Blessed is their Darshan, and fruitful is their service."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕਾ ਦਰਸਨ ਅਮੋਘ ਹੈ ਔ ਜਿਨ ਕੀ ਸੇਵਾ ਭੀ ਸਫਲ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਦਾ ਦਰਸ਼ਨ ਵਿਅਰਥ ਨਹੀਂ ਜਾਂਦਾ, ਸੰਤ ਦੀ ਸੇਵਾ ਜ਼ਰੂਰ ਫਲ ਦੇਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਮੋਘ = ਵਿਅਰਥ ਨਾਹ ਜਾਣ ਵਾਲਾ। ਸਫਲ = ਫਲ ਦੇਣ ਵਾਲੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bendito, bendito es su Servicio;"