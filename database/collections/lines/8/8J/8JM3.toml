[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਸਾਚਿ ਸਮਾਵੈ ਸੋਇ ॥੪॥੮॥੪੭॥"
page = 363
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Nanak, he gets absorbed in the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਸੁੱਚੇ ਸੁਆਮੀ ਅੰਦਰ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, he is absorbed in the True Lord. ||4||8||47||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਸਚੇ ਅਕਾਲ ਪੁਰਖ ਸੇ ਅਭਿੰਨ ਹੋਤਾ ਹੈ॥੪॥੮॥੪੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਤਿਉਂ ਤਿਉਂ ਉਹ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਵਿਚ ਲੀਨ ਹੁੰਦਾ ਜਾਂਦਾ ਹੈ ॥੪॥੮॥੪੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y se inmerge para siempre en la Verdad de Dios. (4‑8‑47)"