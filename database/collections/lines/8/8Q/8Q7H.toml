[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਯਾ ਹੀ ਤੇ ਜਨਮ ਹੈ; ਮਾਰਹੁ ਤਾਕਹੁ ਰਾਇ ॥੪੧॥"
page = 294

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Absorbed in fear, Vasudev said to Kansa, “Do not kill Devaki, but O king! whosoever will be born to her, you may kill him.”41."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਜਨ! ਜੋ ਇਸ ਤੋਂ ਜੰਮੇਗਾ, (ਤੁਸੀਂ) ਉਸ ਨੂੰ ਮਾਰ ਦੇਣਾ ॥੪੧॥"