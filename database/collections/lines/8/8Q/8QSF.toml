[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਚੁ ਸਬਦੁ ਨੀਸਾਣੁ; ਸੁਰਤਿ ਸਮਾਣੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "His consciousness remains absorbed in the graceful true Word."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਸ਼ਬਦ ਦਾ ਨੀਸ਼ਾਨ (ਮਿਲਦਾ ਹੈ) ਸੁਰਤ (ਭਗਵੰਤ ਪ੍ਰੀਤ) ਵਿਚ ਸਮਾ ਜਾਂਦੀ ਹੈ।"