[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਤੁ ਕਬੀਰੁ. ਸੁਨਹੁ ਰੇ ਸੰਤਹੁ; ਸਾਧਸੰਗਤਿ ਤਰਿ ਜਾਂਹਿਗਾ ॥੩॥੧॥"
page = 1106
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir, hear, ye saints, ye shall be saved in the society of the saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ, ਤੂਸੀਂ ਸੁਣੋ, ਹੇ ਸਾਧੂਓ! ਸਤਿਸੰਗਤ ਅੰਦਰ ਤੁਸੀਂ ਪਾਰ ਉਤਰ ਜਾਓਗੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, listen, O Saints: in the Saadh Sangat, the Company of the Holy, you shall be saved. ||3||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਸੰਤੋਂ! ਤੁਮ ਸ੍ਰਵਣ ਕਰੋ, ਹਮ ਇਸ ਜੀਵ ਕੌ ਬਾਰੰਬਾਰ ਕਹਤੇ ਹੈਂ ਕਿ ਤੂੰ ਸਾਧ ਸੰਗਤ ਦੁਆਰਾ ਹੀ ਸੰਸਾਰ ਤੇ ਤਰ ਕੇ ਭਗਵਤ ਮੇਂ ਜਾਏਂਗਾ ਅਰਥਾਤ ਅਭੇਦ ਹੋਵੇਂਗਾ॥੩॥੧॥☬ਰਵਿਦਾਸ ਭਗਤ ਕੋ ਹਰੀ ਨੇ ਦਰਸਨ ਦੀਆ। ਤਿਸ ਸਮੈਂ ਹਰੀ ਕੇ ਸਨਮੁਖ ਪਰਮੇਸਰ ਕੇ ਉਪਕਾਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ ਕਿ ਹੇ ਸੰਤ ਜਨੋ! ਸੁਣੋ, ਸਾਧ-ਸੰਗਤ ਵਿਚ ਰਹਿ ਕੇ ਹੀ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘੀਦਾ ਹੈ ॥੩॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, escuchen amigos, uno es llevado a través sólo asociándose con los Santos. (3-1)"