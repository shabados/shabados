[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗੋਪਿਨ ਕੇ ਤਨ ਕੀ ਛੁਟਗੀ; ਸੁਧਿ ਡੋਲਤ ਹੈ ਬਨ ਮੈ ਜਨੁ ਬਉਰੀ ॥"
page = 342

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The gopis lost consciousness of their bodies and ran like mad men"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਗੋਪੀਆਂ ਨੂੰ ਸ਼ਰੀਰ ਦੀ ਸੁਧ ਨਾ ਰਹੀ ਅਤੇ ਬਾਵਲੀਆਂ ਹੋ ਕੇ ਬਨ ਵਿਚ ਫਿਰਨ ਲਗੀਆਂ।"