[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਟੂਟੀ; ਨਿੰਦਕ ਕੀ ਅਧ ਬੀਚ ॥"
page = 1224
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The slanderer is destroyed in the mid-stream."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਦਖੋਈ ਕਰਨ ਵਾਲਾ ਅਧ-ਵਾਟੇ ਹੀ ਨਾਸ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slanderer is destroyed in mid-stream."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਿੰਦਕ ਪੁਰਸ਼ ਕੀ ਅਵਧੀ ਸੁਲਹੀ ਵਤ ਅਧ ਬੀਚ ਸੇ ਹੀ ਟੂਟ ਜਾਤੀ ਭਈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨਾਂ ਦੀ ਨਿੰਦਾ ਕਰਨ ਵਾਲੇ ਮਨੁੱਖ ਦੀ ਜ਼ਿੰਦਗੀ ਨਿਸਫਲ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਧ ਬੀਚ = ਅੱਧ ਵਿਚ ਹੀ। ਟੂਟੀ ਅਧ ਬੀਚ = ਅੱਧ ਵਿਚ ਹੀ ਟੁੱਟ ਜਾਂਦੀ ਹੈ, ਜ਼ਿੰਦਗੀ ਅਸਫਲ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El que calumnia a Dios es destruido donde sea que se encuentre."