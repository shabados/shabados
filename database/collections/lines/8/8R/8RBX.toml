[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਾਵਉ ਦਸਾ ਅਨੇਕ; ਪ੍ਰੇਮ ਪ੍ਰਭ ਕਾਰਣੇ ॥"
page = 1363
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I run about in many directions for attaining my Lord's love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਪ੍ਰਭੂ ਦੇ ਪਿਆਰ ਨੂੰ ਪਰਾਪਤ ਕਰਨ ਲਈ ਮੈਂ ਅਨੇਕਾਂ ਪਾਸਿਆਂ ਵਲ ਭਜਿਆ ਫਿਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I run around in all directions, searching for the love of God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕੇ ਪ੍ਰੇਮ ਪ੍ਰਾਪਤੀ ਵਾਸਤੇ ਮੈਂ ਅਨੇਕ (ਦਸਾ) ਤਰਫੋਂ ਮੇਂ ਧਾਵਤਾ ਹੂੰ ਅਰਥਾਤ ਅਨੇਕ ਪ੍ਰਕਾਰ ਕਰ ਕੇ ਸੇਵਨ ਆਦੀ ਜਤਨ ਕਰਤਾ ਹੂੰ॥☬ਪ੍ਰਸ਼ਨ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ (ਦੇ ਚਰਨਾਂ) ਦਾ ਪ੍ਰੇਮ ਹਾਸਲ ਕਰਨ ਵਾਸਤੇ ਮੈਂ ਕਈ ਪਾਸੀਂ ਦੌੜਦਾ ਫਿਰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਾਵਉ = ਧਾਵਉਂ, ਮੈਂ ਦੌੜਦਾ ਹਾਂ। ਦਸਾ = ਦਿਸ਼ਾ, ਪਾਸੇ (ਦਸ਼ਾ = ਹਾਲਤ)। ਪੰਚ"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Corro por todas direcciones buscando el Amor de Dios,"