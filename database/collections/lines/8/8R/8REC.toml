[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਈ ਛੋਹਨੀ ਜਾਤ ਨਹੀ ਗਨਿ ॥"
page = 670

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sage reached there alongwith Sannyasis and innumerable disciples"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨਾਲ ਸੰਨਿਆਸੀਆਂ) ਦੀਆਂ ਕਈ ਛੋਹਣੀਆਂ ਸਨ, (ਉਨ੍ਹਾਂ ਦੀ) ਗਿਣਤੀ ਨਹੀਂ ਕੀਤੀ ਜਾ ਸਕਦੀ ਸੀ।"