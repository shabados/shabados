type = "primary"
data = "ਗੁਰਦੇਵ ਤਬੈ ਤਿਹ ਯਾ ਸਿਖ ਦੀਨੀ ॥੪੮੫॥"
page = 674

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There he performed severe austerities and then the Guru Dutt, gave these instructions to all of them.485."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਗੁਰਦੇਵ (ਪ੍ਰਭੂ) ਨੇ ਉਸ ਨੂੰ ਇਹ ਸਿਖਿਆ ਦਿੱਤੀ ॥੪੮੫॥"