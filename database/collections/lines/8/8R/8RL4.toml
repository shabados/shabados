[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦਾ ਸਦਾ ਜਾਈ ਬਲਿਹਾਰਾ ॥"
page = 106
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever and ever I am a sacrifice unto Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਮੇਸ਼ਾਂ ਤੇ ਸਦੀਵ ਹੀ ਮੈਂ ਉਸ ਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forever and ever, I am a sacrifice to Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਹਰੀ ਕੇ ਮਨ ਤਨ ਬਾਣੀ ਕਰ ਕੇ ਸਦਾ ਬਲਿਹਾਰਨੇ ਜਾਈਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਸ ਤੋਂ ਸਦਾ ਹੀ ਸਦਾ ਹੀ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਈ = ਜਾਈਂ, ਮੈਂ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "yo me ofrezco siempre y para siempre en sacrificio a Él."