[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਈ ਰੀ; ਮਨੁ ਮੇਰੋ ਮਤਵਾਰੋ ॥"
page = 1225
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my mother, mind is intoxicated with the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਮਾਤਾ! ਮੇਰਾ ਮਨੂਆ ਨਾਮ ਨਾਲ ਮਸਤ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mother, my mind is intoxicated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਮਾਈ ਰੀ) ਹੇ ਸਖੀ ਸੰਤ ਜਨੋਂ! ਮੇਰਾ ਮਨ (ਮਤਵਾਰੋ) ਮਸਤ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਂ! ਮੇਰਾ ਮਨ (ਪ੍ਰਭੂ ਦੇ ਦੀਦਾਰ ਵਿਚ) ਮਸਤ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਤਵਾਰੋ = ਮਤਵਾਲਾ, ਮਸਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi madre, mi mente está embebida con Dios."