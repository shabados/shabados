[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹਾਰ ਰਹੇ ਰਨਧੀਰ ਸਬੈ; ਅਬ ਕਾ ਪ੍ਰਭ ਜੂ, ਤੁਮਰੇ ਮਨ ਆਯੋ ॥"
page = 462

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“All the warriors are being defeated"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਰਣਬੀਰ ਹਾਰ ਚੁਕੇ ਹਨ। ਹੇ ਪ੍ਰਭੂ! ਹੁਣ ਤੁਹਾਡੇ ਮਨ ਵਿਚ ਕੀ (ਵਿਚਾਰ) ਆਇਆ ਹੈ?"