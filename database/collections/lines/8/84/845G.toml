[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਮਨ; ਗੁਰ ਚਰਣੀ ਚਿਤੁ ਲਾਇ ॥"
page = 162
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, fix thy attention on Guru's feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ, ਗੁਰਾਂ ਦੇ ਚਰਨਾਂ ਨਾਲ ਆਪਣੀ ਬਿਰਤੀ ਜੋੜ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, focus your consciousness on the Guru's Feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਗੁਰੋਂ ਕੇ ਚਰਣੋਂ ਮੇਂ ਚਿਤ ਲਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਵਿਚ ਸੁਰਤ ਜੋੜ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, fija tu atención en los Pies del Guru."