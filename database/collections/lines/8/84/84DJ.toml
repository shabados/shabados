[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨੇਕ ਜਤਨ ਕਰੇ; ਇੰਦ੍ਰੀ ਵਸਿ. ਨ ਹੋਈ ॥"
page = 1062
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Inspite of making various efforts, the sexual desire is overcome not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਉਪਰਾਲੇ ਕਰਨ ਦੇ ਬਾਵਜੂਦ, ਕਾਮ ਦੀ ਖ਼ਾਹਿਸ਼ ਕਾਬੂ ਵਿੱਚ ਨਹੀਂ ਆਉਂਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Making countless efforts, sexual desire is not overcome."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਪੁਰਸ਼ ਅਨੇਕ ਜਤਨ ਕਰੇ ਪਰੰਤੂ ਇੰਦ੍ਰੀਆਂ ਵਸ ਨਹੀਂ ਹੋਤੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਸਰਨ ਤੋਂ ਬਿਨਾ) ਹੋਰ ਅਨੇਕਾਂ ਜਤਨ ਭੀ ਮਨੁੱਖ ਕਰੇ ਤਾਂ ਭੀ ਕਾਮ-ਵਾਸਨਾ ਕਾਬੂ ਵਿਚ ਨਹੀਂ ਆ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇੰਦ੍ਰੀ = ਕਾਮ-ਵਾਸਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno trata de mil maneras, pero las pasiones de uno no son controladas,"