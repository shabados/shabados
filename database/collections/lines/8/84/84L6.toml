[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੁ ਵਾਪਾਰੁ; ਵਿਰਲਾ ਵਾਪਾਰੈ ॥"
page = 283
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Only a few engage in this trade."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਹੀ ਥੋੜੇ ਇਸ ਵਣਜ ਦੀ ਸੁਦਾਗਰੀ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In this trade, only a few are trading."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਇਹੁ ਰਾਮ ਨਾਮ ਵਪਾਰ ਕੌ ਕੋਈ ਵਿਰਲਾ (ਵਾਪਾਰੈ) ਖਰੀਦਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਇਹ ਵਪਾਰ ਕੋਈ ਵਿਰਲਾ ਬੰਦਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pocos son aquéllos que participan de éstos bienes;"