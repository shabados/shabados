[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੀਠੀ ਪਿਰਹਿ ਕਹਾਨੀ ॥"
page = 830
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sweet is the tale of my Spouse."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿੱਠੜੀ ਹੇ ਮੇਰੇ ਕੰਤ ਦੀ ਵਾਰਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How sweet is the story of my Husband Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਤੀ ਕੀ (ਕਹਾਨੀ) ਕਥਾ ਪਰਮ (ਮੀਠੀ) ਮਧਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ-ਪਤੀ ਦੀਆਂ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੀਆਂ ਗੱਲਾਂ ਮੈਨੂੰ ਪਿਆਰੀਆਂ ਲੱਗ ਰਹੀਆਂ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਿਰਹਿ = ਪਿਰ ਦੀ, ਪ੍ਰਭੂ-ਪਤੀ ਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, ¡qué dulce es la Palabra de mi Amor!"