[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇਈ ਹੋਏ ਭਗਤ; ਜਿਨਾ ਕਿਰਪਾਰੀਆ ॥੧॥"
page = 240
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They alone becomes Thine devotees on whom is Thy grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹੀ ਤੇਰੇ ਅਨੁਰਾਗੀ ਹੁੰਦੇ ਹਨ ਜਿਨ੍ਹਾਂ ਉਤੇ ਤੇਰੀ ਕਿਰਪਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They alone are Your devotees, who are blessed by Your Grace. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਪੁਰਸ ਪਰਮੇਸ੍ਵਰ ਕੇ ਭਗਤ ਹੂਏ ਹੈਂ ਜਿਨ੍ਹੋਂ ਪਰ ਤਿਸ ਕੀ ਕ੍ਰਿਪਾ ਹੂਈ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੇ ਭਗਤ ਬਣ ਸਕਦੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਉਤੇ ਉਸ ਦੀ ਕਿਰਪਾ ਹੁੰਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਈ = ਉਹੀ ਬੰਦੇ। ਭਗਤ = {ਬਹੁ-ਵਚਨ} ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y es solamente por Tu Gracia que Te alabamos.(1)"