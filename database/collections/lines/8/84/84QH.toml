[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਟ ਲੈਹੁ ਨਾਰਾਇਣੈ; ਦੀਨ ਦੁਨੀਆ ਝਲੈ ॥"
page = 320
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Enter ye the sanctuary of the Pervading God thus spiritual world and temporal world shall hail thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਵਿਆਪਕ ਵਾਹਿਗੁਰੂ ਦੀ ਸ਼ਰਣਾਗਤ ਸੰਭਾਲ ਇੰਜ ਰੂਹਾਨੀ ਮੰਡਲ ਅਤੇ ਮਾਦੀ ਸੰਸਾਰ ਤੈਨੂੰ ਵਧਾਈ ਦੇਣਗੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Take the Support of the Lord, who gives support in the spiritual and material worlds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਰਾਇਣ ਕਾ ਆਸਰਾ ਲੇਵੇ, ਲੋਕ ਪਰਲੋਕ ਮੇਂ (ਝਲੈ) ਰਖਿਆ ਕਰੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਕਾਲ ਪੁਰਖ ਦੀ ਟੇਕ ਰੱਖੇ ਜੋ ਦੀਨ ਤੇ ਦੁਨੀਆ ਨੂੰ ਆਸਰਾ ਦੇਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਝਲੈ = ਝੱਲਦਾ ਹੈ, ਆਸਰਾ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y busquen Refugio en el Señor, Quien es nuestro Soporte en el mundo de la carne así como en el mundo del Alma."