[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੋ ਸਉ; ਕੋਊ. ਨ ਕਹੈ ਸਮਝਾਇ ॥"
page = 346
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "No one explains and brings it home to me,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਕੋਈ ਜਣਾ ਇਸ ਨੂੰ ਦਰਸਾਉਂਦਾ ਤੇ ਨਿਸਚਿਤ ਨਹੀਂ ਕਰਾਉਂਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one has explained to me,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਮੇਰੇ ਕੋ ਸਮਝਾਇ ਕਰ ਕੋਈ ਨਹੀਂ ਕਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੁਹਾਡੇ ਵਿਚੋਂ) ਕੋਈ ਭੀ ਮੈਨੂੰ ਐਸਾ ਕੰਮ ਸਮਝਾ ਕੇ ਨਹੀਂ ਦੱਸ ਸਕਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋ ਸਉ = ਮੈਨੂੰ। ਕੋਊ = ਇਹਨਾਂ ਕਰਮ-ਕਾਂਡੀ ਪੰਡਿਤਾਂ ਵਿਚੋਂ ਕੋਈ ਭੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nadie me lo ha explicado,"