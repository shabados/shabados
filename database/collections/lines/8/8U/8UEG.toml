[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਹੀ ਕੀ ਓਟ ਸਦੀਵ ॥"
page = 896
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever seek I the support of Him,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹਮੇਸ਼ਾਂ ਉਸ ਦਾ ਆਸਰਾ ਲੋੜਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I seek His eternal support;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਦਾ ਤਿਸੀ ਕੀ ਸਰਨ ਲੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਸਦਾ ਹੀ ਉਸੇ ਪ੍ਰਭੂ ਦਾ ਹੀ ਆਸਰਾ ਲਈ ਰੱਖ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਦੀਵ = ਸਦਾ ਹੀ। ਓਟ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por siempre y para siempre busco Tu Santuario;"