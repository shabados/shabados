[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਤੁ ਤਨਿ ਨਾਮੁ. ਨ ਭਾਵਈ; ਤਿਤੁ ਤਨਿ ਹਉਮੈ ਵਾਦੁ ॥"
page = 61
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The body which likes not the Name that body is infested with pride and strife."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸਰੀਰ ਨੂੰ ਨਾਮ ਚੰਗਾ ਨਹੀਂ ਲਗਦਾ, ਉਹ ਸਰੀਰ ਹੰਕਾਰ ਤੇ ਝਗੜੇ-ਟੰਟੇ ਦਾ ਸਤਾਇਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That body which does not appreciate the Naam-that body is infested with egotism and conflict."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸਰੀਰ ਮੇਂ ਨਾਮੁ ਜਪਣਾ ਨਹੀਂ ਭਾਵਤਾ ਹੈ, ਤਿਸ ਸਰੀਰ ਮੇਂ ਹੰਤਾ ਮਮਤਾ ਔਰ (ਵਾਦੁ) ਵਿਰੋਧ ਆਦਿ ਵਿਕਾਰ ਨਿਵਾਸ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸਰੀਰ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਪਿਆਰਾ ਨਹੀਂ ਲੱਗਦਾ, ਉਸ ਸਰੀਰ ਵਿਚ ਹਉਮੈ ਵਧਦੀ ਹੈ, ਉਸ ਸਰੀਰ ਵਿਚ ਤ੍ਰਿਸ਼ਨਾ ਦਾ ਬਖੇੜਾ ਵਧਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਤੁ = ਜਿਸ ਵਿਚ। ਜਿਤੁ ਤਨਿ = ਜਿਸ ਸਰੀਰ ਵਿਚ। ਵਾਦੁ = ਝਗੜਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ese ser al que no le gusta el Nombre del Señor, en ese ser vive la confusión del ego."