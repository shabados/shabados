[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਚਉ ਇੰਦ੍ਰੀ; ਬਸਿ ਕਰਿ ਰਾਖੈ ॥"
page = 974
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His five sense-organs, he keeps under his control."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਪੰਜੇ ਗਿਆਨ-ਅੰਗਾਂ ਨੂੰ ਉਹ ਆਪਣੇ ਇਖਤਿਆਰ ਵਿੱਚ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He keeps the five sensory organs under his control."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਜੋਗੀ ਪਾਚੋਂ ਇੰਦ੍ਰੀਆਂ ਕੋ ਅਪਨੇ ਵਸ ਕਰ ਰਾਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੰਜਾਂ ਹੀ ਇੰਦ੍ਰਿਆਂ ਨੂੰ ਆਪਣੇ ਕਾਬੂ ਵਿਚ ਰੱਖਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "debe disciplinar los cinco órganos de los sentidos,"