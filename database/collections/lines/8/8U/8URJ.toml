[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਰਸੈ ਹੋਇ ਸਹੰਸ ਧਾਰ; ਮਿਲਿ ਗਿਲ ਜਲੁ ਨੀਵਾਣਿ ਚਲੰਦਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Becoming thousands of currents when it rains, water in thousand streams flows towards the lower places."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਹਜ਼ਾਰ ਟੁਕੜੇ ਹੋਕੇ ਪਾਣੀ ਵਰ੍ਹਦਾ ਹੈ (ਤਾਂ ਜੋ ਬ੍ਰਿਛਾਂ ਨੂੰ ਔਖ ਨਾ ਹੋਵੇ), (ਫਿਰ) ਰਲ ਮਿਲਕੇ ਨੀਵਾਣ ਨੂੰ ਹੀ ਚਲਦਾ ਹੈ।"