[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸ੍ਰੀ ਰਾਮ ਨਾਮਾ; ਉਚਰੁ ਮਨਾ ॥"
page = 155
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Utter the Name of the venerable Pervading Lord, O my soul."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਜਯ ਵਿਆਪ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਣ ਕਰ, ਹੇ ਮੇਰੀ ਜਿੰਦੂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chant the Name of the Supreme Lord, O my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਸ੍ਰੀ ਰਾਮ ਨਾਮ ਕਾ ਉਚਾਰਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਚਰੁ = ਉਚਾਰ, ਬੋਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi único recurso es el Nombre del Señor."