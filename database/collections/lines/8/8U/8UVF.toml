[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕਿ ਨਾਮੁ ਨਿਰੰਜਨ ਜਾਨੵਉ; ਕੀਨੀ ਭਗਤਿ ਪ੍ਰੇਮ ਲਿਵ ਲਾਈ ॥"
page = 1406
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak realised the immaculate Name and lovingly fixed his attention on the Lord's devotional service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੇ ਪਵਿੱਤਰ ਨਾਮ ਨੂੰ ਅਨੁਭਵ ਕੀਤਾ ਅਤੇ ਪਿਆਰ ਨਾਲ ਸੁਆਮੀ ਦੀ ਅਨੁਰਾਗੀ ਸੇਵਾ ਅੰਦਰ ਆਪਣੀ ਬਿਰਤੀ ਜੋੜੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Guru Nanak realized the Immaculate Naam, the Name of the Lord. He was lovingly attuned to loving devotional worship of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਥਮੇ ਸ੍ਰੀ ਗੁਰੂ ਨਾਨਕ ਸਾਹਿਬ ਜੀ ਨੇ ਨਿਰੰਜਨ ਕੇ ਨਾਮ ਕੋ ਜਾਣਿਆ ਹੈ ਔ ਬ੍ਰਿਤੀ ਲਗਾਇ ਕੇ ਪ੍ਰੇਮਾ ਭਗਤੀ ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ) ਨਾਨਕ (ਦੇਵ ਜੀ) ਨੇ ਨਿਰੰਜਨ ਦਾ ਨਾਮ ਪਛਾਣਿਆ, ਪ੍ਰੇਮ ਨਾਲ ਬ੍ਰਿਤੀ ਜੋੜ ਕੇ ਭਗਤੀ ਕੀਤੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕਿ = ਨਾਨਕ ਨੇ। ਜਾਨ੍ਯ੍ਯਉ = ਪਛਾਣਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Guru Nanak tomó Conciencia del Inmaculado Naam, el Nombre del Señor,"