[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਿਵਹੀ ਤਰਿ ਭੇਟਤ ਭਈ; ਉਹੀ ਨ੍ਰਿਪਤਿ ਕੇ ਸਾਥ ॥੧੬॥"
page = 846

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The same way she had gone to meet the Raja crossing the river.(l6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਉਹ ਰਾਜੇ ਨੂੰ ਮਿਲਣ ਲਈ (ਨਦੀ) ਤਰ ਕੇ ਆਉਂਦੀ ਸੀ ॥੧੬॥"