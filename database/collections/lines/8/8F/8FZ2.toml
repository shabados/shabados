[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਖੁ ਨਾਹੀ; ਪੇਖੇ ਨਿਰਤਿ ਨਾਟੇ ॥"
page = 1147
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is no peace in beholding dance and drama."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਚ ਅਤੇ ਰੂਪਕ ਵੇਖਣ ਵਿੱਚ ਕੋਈ ਆਰਾਮ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no peace in watching dances and plays."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਨਾਚ ਔ ਤਮਾਸੇ ਦੇਖਣੇ ਸੇ ਭੀ ਸੁਖ ਨਹੀਂ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਟਕਾਂ ਦੇ ਨਾਚ ਵੇਖਿਆਂ ਭੀ ਆਤਮਕ ਆਨੰਦ ਨਹੀਂ ਪ੍ਰਾਪਤ ਹੁੰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੇਖੇ = ਵੇਖਿਆਂ। ਨਿਰਤਿ = ਨਾਚ। ਨਾਟੇ = ਨਾਟਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ni tampoco ver el mundo bailar en el estrado."