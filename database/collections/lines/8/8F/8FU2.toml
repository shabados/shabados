[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕਉ ਹਾਥਿ; ਨ ਆਵੈ ਕੇਹ ॥"
page = 268
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "shall have nothing to hand thereby."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਹੱਥ ਪੱਲੇ ਕੁਛ ਨਹੀਂ ਪੈਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "nothing shall come into her hands in this way."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੈ ਹਾਥ (ਕੇਹ) ਕੁਛ ਨਹੀਂ ਆਵਤਾ ਹੈ, ਤੈਸੇ ਇਨ ਸਨਬੰਧੀਓਂ ਸੇ ਜੋ ਪਰੇਮ ਹੈ, ਸੋ ਕਿਸੀ ਅਰਥ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅੰਤ ਨੂੰ) ਉਸ ਦੇ ਹੱਥ ਪੱਲੇ ਕੁਝ ਨਹੀਂ ਪੈਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕਉ = ਉਸ ਨੂੰ। ਹਾਥਿ = ਹੱਥ ਵਿਚ। ਨ ਕੇਹ = ਕੁਝ ਭੀ ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nada viene a sus manos de esta manera."