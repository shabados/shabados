data = "ਮਤੇ ਸੂਰ ਰਤੇ ਨੈਣ ॥"
page = 257

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sky is torn with arrows and the eyes of the warriors are getting red"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਯੁੱਧ ਕਰਮ ਵਿੱਚ) ਮਸਤ ਸੂਰਮਿਆਂ ਦੀਆਂ ਅੱਖਾਂ ਲਾਲ ਹੋ ਗਈਆਂ ਹਨ।"