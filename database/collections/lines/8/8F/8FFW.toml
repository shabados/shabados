[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਤੇ; ਪਾਏ ਮੁਕਤਿ ਦੁਆਰੁ ॥੧॥"
page = 158
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From the Guru is gained the door of Salvation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਪਾਸੋਂ ਮੋਖਸ਼ ਦਾ ਦਰਵਾਜ਼ਾ ਪਾਇਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Guru, the Gate of Liberation is found. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪੁਰਸ ਗੁਰੋਂ ਸੇ ਮੁਕਤੀ ਕਾ ਦੁਆਰਾ ਗ੍ਯਾਨ ਪਾ ਲੇਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਗੁਰੂ ਪਾਸੋਂ (ਵਿਕਾਰਾਂ ਤੋਂ) ਖ਼ਲਾਸੀ (ਹਾਸਲ ਕਰਨ) ਦਾ ਦਰਵਾਜ਼ਾ ਲੱਭ ਲੈਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Del Guru viene la apertura de la Puerta de la Salvación. (1)"