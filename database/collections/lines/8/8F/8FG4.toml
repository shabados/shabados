[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੀਨਿ ਗੁਣਾ; ਇਕ ਸਕਤਿ ਉਪਾਇਆ ॥"
page = 868
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He created three qualities and one mammon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਤਿੰਨ ਲੱਛਣ ਅਤੇ ਇਕ ਮਾਇਆ ਉਤਪੰਨ ਕੀਤੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "From the three qualities, the one mechanism of Maya was produced."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੀਨ ਗੁਣਾਤਮਕ ਜੋ ਮਹਾ ਮਾਇਆ ਇਕ ਸਕਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜੀਵਾਤਮਾ ਜਿਸ ਪਰਮਾਤਮਾ ਦਾ ਰੂਪ ਹੈ) ਇਹ ਬੜੀ ਡਾਢੀ ਮਾਇਆ ਉਸੇ ਦਾ ਹੀ ਪਰਛਾਵਾਂ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਕਤਿ = ਮਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las tres Gunas dieron nacimiento a Maya,"