[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਸਟਾ ਨਾਲਿ ਦੋਸਤੀ; ਨਾਲਿ ਸੰਤਾ. ਵੈਰੁ ਕਰੰਨਿ ॥"
page = 755
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who cherish friendship with the wicked and enmity with the saints;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਕਰਮੀਆਂ ਨਾਲ ਸਜਣਤਾਈ ਅਤੇ ਸਾਧੂਆਂ ਨਾਲ ਦੁਸ਼ਮਣੀ ਕਮਾਉਂਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who make friendships with the wicked, and harbor animosity to the Saints,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨੋਂ ਕੀ ਦੁਸਟੋਂ ਕੇ ਸਾਥ ਦੋਸਤੀ ਹੈ ਅਰ ਸੰਤੋਂ ਕੇ ਸਾਥ ਵੈਰ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਜੇਹੇ ਮਨੁੱਖ ਭੈੜੇ ਬੰਦਿਆਂ ਨਾਲ ਮਿਤ੍ਰਤਾ ਗੰਢੀ ਰੱਖਦੇ ਹਨ, ਅਤੇ ਸੰਤ ਜਨਾਂ ਨਾਲ ਵੈਰ ਕਰਦੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰੰਨਿ = ਕਰਦੇ ਹਨ। ਦੁਸਟ = ਮੰਦ-ਕਰਮੀ, ਭੈੜੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ellos aman a los malhechores y sienten celos de los Santos."