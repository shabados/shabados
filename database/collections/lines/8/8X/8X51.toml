[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੋਊ ਚਿਤ੍ਰਜੋਤੀ ਦੋਊ ਚਾਰ ਬਿਚਾਰੰ ॥"
page = 147

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Both were Beauty-incarnate and had lofty thoughts."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਵੇਂ ਸੁੰਦਰ ਜੋਤਿ ਵਾਲੇ ਸਨ ਅਤੇ ਦੋਹਾਂ ਦੇ ਵਿਚਾਰ ਸੁੰਦਰ ਸਨ।"