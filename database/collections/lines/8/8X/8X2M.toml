data = "ਨਮੋ ਪ੍ਰੇਤ ਅਪ੍ਰੇਤ ਦੇਵੇ ਸੁਧਰਮੇ ॥੫੪॥"
page = 4
line = 1

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Salutation to Thee O Virtuous-Sustainer Lord !  Salutation to Thee O Love-Incarnate Lord! 54"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੇਤ-ਅਪ੍ਰੇਤ ਦਾ ਧਰਮ ਅਨੁਸਾਰ ਪਾਲਣ ਕਰਨ ਵਾਲੇ ਦੇਵ ਸਰੂਪ! (ਤੈਨੂੰ) ਨਮਸਕਾਰ ਹੈ ॥੫੪॥"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਨਮੋ, ਪ੍ਰੇਤ ਅਪ੍ਰੇਤ; ਦੇਵੇ ਸੁ ਧਰਮੇ ॥੫੪॥"