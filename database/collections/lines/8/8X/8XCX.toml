[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਾਰੋ ਈ ਅਸ੍ਵਨ ਸੂਤ ਸਮੇਤ ਸੁ; ਕੈ ਸਬ ਹੀ ਰਥ ਚੂਰਨ ਡਾਰਿਯੋ ॥੧੮੭੩॥"
page = 484

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Balram jumped and came down to stand on the earth and the king pulversied his chariot alongwith all four horses.1873."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਚੌਹਾਂ ਹੀ ਘੋੜਿਆਂ ਨੂੰ ਰਥਵਾਨ ਸਹਿਤ ਅਤੇ ਸਾਰੇ ਹੀ ਰਥਾਂ ਨੂੰ ਚੂਰ ਚੂਰ ਕਰ ਦਿੱਤਾ ਹੈ ॥੧੮੭੩॥"