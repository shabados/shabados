[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੀਨੇ ਰਾਮ ਨਾਮ; ਇਕ ਆਖੵਰ ॥"
page = 262
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "are the creation of the One Word of Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੇ ਇਕੋ ਅੱਖਰ ਦੀਆਂ ਰਚਨਾ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "were created from the One Word of the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਆਖਰ) ਅੰਤ ਕੋ ਏਕ ਰਾਮ ਨਾਮ ਹੀ ਸਾਰ ਰੂਪ ਅਖਰ ਨਿਹਚੈ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਕ ਅਕਾਲ ਪੁਰਖ ਦੇ ਨਾਮ ਨੂੰ ਹੀ ਸਭ ਤੋਂ ਪਵਿੱਤ੍ਰ ਨਾਮ ਮੰਨਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਕ ਆਖ੍ਯ੍ਯਰ = (Skt.एकाक्षर) ਅਕਾਲ ਪੁਰਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "son en realidad la creación del Naam, el Nombre del Señor."