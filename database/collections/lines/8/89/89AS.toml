[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਹਿਰਦੈ; ਰਾਮ ਨਾਮ ਗੁਣਤਾਸੁ ॥"
page = 232
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "when Lord's Name an ocean of merits, abides in the mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਖੂਬੀਆਂ ਦਾ ਸਮੁੰਦਰ, ਸਾਈਂ ਦਾ ਨਾਮ ਚਿੱਤ ਵਿੱਚ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "when the Lord's Name, the Ocean of Virtue, comes to dwell within the heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਹਿਰਦੇ ਕੇ ਬੀਚ ਰਾਮ ਨਾਮ ਗੁਣੋ ਕਾ ਤਾਸ ਪ੍ਰਾਪਤ ਹੂਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਹਿਰਦੇ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਆ ਵੱਸਦਾ ਹੈ ਗੁਣਾਂ ਦਾ ਖ਼ਜ਼ਾਨਾ ਪ੍ਰਭੂ ਆ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Tesoro de toda Virtud se encuentra en su corazón;"