[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਕਹੈ ਭਗਵਾਨ ਹਰੀ; ਇਕ ਲੈ ਹਰਿ ਨਾਮੁ, ਪਰੈ ਗਿਰਿ ਭੂਈਆ ॥"
page = 347

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Someone is repeating the name of Krishna and someone, repeating his name, is falling on the earth"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਕਹਿੰਦੀਆਂ ਹਨ ਕਿ ਕ੍ਰਿਸ਼ਨ ਭਗਵਾਨ ਦਾ ਰੂਪ ਹਨ, ਇਕ ਹਰਿ ਨਾਮ ਲੈ ਕੇ ਧਰਤੀ ਉਤੇ ਡਿਗ ਪੈਂਦੀਆਂ ਹਨ।"