[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮੋ ਸਾਸਤ੍ਰ ਬੇਤਾ ਨਮੋ ਸਸਤ੍ਰ ਗਾਮੀ ॥"
page = 118

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art the knower of Shastras, knower of the use of weapons"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ਾਸਤ੍ਰ ਜਾਣਨ ਵਾਲੀ ਨੂੰ ਨਮਸਕਾਰ ਹੈ; ਸ਼ਸਤ੍ਰ ਚਲਾਉਣ ਵਾਲੀ ਨੂੰ ਨਮਸਕਾਰ ਹੈ।"