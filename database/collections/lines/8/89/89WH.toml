data = "ਸੋ ਸੇਵਕੁ; ਕਹੁ ਕਿਸ ਤੇ ਡਰੈ ॥"
page = 281
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "say of whom should he be afraid?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੱਸੋ ਖਾਂ, ਉਸ ਕਿਸ ਕੋਲੋ ਭੈ ਖਾਵੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "who do those servants need to fear?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸੋ ਸੇਵਕ ਕਹੁ ਤੋ ਕਿਸ ਤੇ ਡਰਤਾ ਹੈ ਅਰਥਾਤ ਨਹੀਂ ਡਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦੱਸੋ (ਪ੍ਰਭੂ ਦਾ) ਉਹ ਸੇਵਕ (ਹੋਰ) ਕਿਸ ਤੋਂ ਡਰ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਸ ਤੇ = ਕਿਸ ਤੋਂ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿ A quien temer?"