[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਕਿਉਣ ਜੋ ਉਹ ਰੱਬ ਦੇ ਉਸ ਮਹਾਨ ਸੱਚ-ਸਰੂਪ ਤੋਣ ਬਿਨਾਣ ਹੋਰ ਕਿਸੇ ਨੂੰ ਨਹੀਣ ਦੇਖਦਾ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਕੂ ਨ ਬੀਨਦ ਗ਼ੈਰ ਨਕਸ਼ਿ ਕਿਬਰੀਆ ॥੭੦॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "The Akaalpurakh does not divulge His mysteries to him. (422)"