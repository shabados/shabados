[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਹ ਵਾਪਾਰੀ; ਏਕੈ ਥਾਟ ॥੪॥"
page = 430
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru banker and the Sikh dealer, abide in the one place."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਸ਼ਾਹੂਕਾਰ ਅਤੇ ਸਿੱਖ ਵਣਜਾਰਾ ਇਕੋ ਹੀ ਟਿਕਾਣੇ ਤੇ ਵੱਸਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Banker and the dealers dwell in the same place. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਸ਼ਾਹ ਗੁਰੂ ਵਪਾਰੀ ਜੋ ਜਗ੍ਯਾਸੂ ਹੈ, ਸੋ ਦੋਨੋ ਏਕ ਹੀ ਬਨਾਵ ਕੇ, ਭਾਵ ਸੇ ਸਿਖ ਗੁਰੂ ਰੂਪ ਹੀ ਹੋ ਜਾਤਾ ਹੈ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੇ (ਸਿੱਖ-) ਵਣਜਾਰੇ (ਗੁਰੂ-) ਸ਼ਾਹ ਦੇ ਨਾਲ ਇੱਕ-ਰੂਪ ਹੋ ਜਾਂਦੇ ਹਨ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਥਾਟ = ਬਨਾਵਟ। ਏਕੈ ਥਾਟ = ਇਕੋ ਰੂਪ ਵਿਚ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y los comerciantes del Señor habitaron en el mismo lugar. (4)"