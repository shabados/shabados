[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ ਅਪਨੇ ਪ੍ਰਭਿ ਕੀਨੇ; ਨਾਮ ਅਪੁਨੇ ਕੀ ਕੀਨੀ ਦਾਤਿ ॥"
page = 820
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In His mercy, the Lord has made them His own and has blessed them with the gift of His"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿਹਰ ਧਾਰ ਕੇ, ਪ੍ਰਭੂ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਆਪਣੇ ਨਿੱਜ ਦੇ ਬਣਾ ਲਿਆ ਹੈ ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਆਪਣੇ ਨਾਮ ਦਾ ਦਾਨ ਪਰਦਾਨ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In His Mercy, God has made them His own, and blessed them with the gift of His Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੈਂਨੇ ਕ੍ਰਿਪਾ ਕਰ ਸੋ ਸੰਤ ਅਪਨੇ ਸਾਸ ਕੀਨੇ ਹੈਂ, ਕਿਉਂਕਿ ਤਿਨ ਕੋ ਅਪਨੇ ਨਾਮ ਕੀ ਤੈਨੇ ਦਾਤ ਕੀਨੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸੰਤ ਜਨਾਂ ਨੂੰ ਪ੍ਰਭੂ ਨੇ ਮੇਹਰ ਕਰ ਕੇ ਆਪਣੇ ਸੇਵਕ ਬਣਾ ਲਿਆ ਹੁੰਦਾ ਹੈ, ਉਹਨਾਂ ਨੂੰ ਆਪਣੇ ਨਾਮ ਦੀ ਦਾਤ ਬਖ਼ਸ਼ੀ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ। ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, en Tu Misericordia nos tomas como Tuyos y nos bendices con el Regalo de Tu Nombre,"