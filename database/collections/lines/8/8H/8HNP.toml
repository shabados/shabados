[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖੁ ਅੰਧਾ; ਆਵੈ ਜਾਇ ॥"
page = 314
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The blind apostate continues coming and going."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਨ੍ਹਾ ਅਧਰਮੀ ਆਉਂਦਾ ਤੇ ਜਾਂਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The blind, self-willed manmukh comes and goes in reincarnation;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਕਰ ਮਨਮੁਖ ਅੰਧਾ ਆਵਤਾ ਜਾਤਾ ਅਰਥਾਤ ਜਨਮਤਾ ਮਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅੰਨ੍ਹਾ ਮਨਮੁਖ ਕੁਰਾਹੇ ਪਿਆ ਹੋਇਆ ਹੈ ਤੇ ਨਿੱਤ ਜੰਮਦਾ ਮਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El soberbio Manmukj va y viene una y otra vez;"