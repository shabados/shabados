[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸੁ ਕਾਇਆ ਅੰਦਰਿ; ਬਹੁਤੁ ਪਸਾਰਾ ॥"
page = 112
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within this human body are numberless vistas."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਏਸ ਮਨੁੱਖੀ ਦੇਹਿ ਵਿੱਚ ਅਣਗਿਣਤ ਦ੍ਰਿਸ਼ਯ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Within this body are countless vast vistas;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਕਾਇਆ ਕੇ ਬੀਚ ਗੁਣੋਂ ਰੂਪੀ ਪਸਾਰਾ ਬਹੁਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਕ ਪਾਸੇ) ਇਸ ਮਨੁੱਖਾ ਸਰੀਰ ਵਿਚ (ਮਾਇਆ ਦਾ) ਬਹੁਤ ਖਿਲਾਰਾ ਖਿਲਾਰਿਆ ਹੋਇਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਸਾਰਾ = ਮਾਇਆ ਦਾ ਖਿਲਾਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En el interior de su cuerpo hay vastos horizontes;"