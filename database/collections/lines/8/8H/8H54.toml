[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪੀਰ ਮੁਰੀਦਾਂ ਪਿਰਹੜੀ, ਹੈਰਾਣੁ ਹੈਰਾਣੈ ॥੨੧॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Similarly, the love between the Guru and disciple is wondrous."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੀਰਾਂ ਤੇ ਮੁਰੀਦਾਂ ਦੀ ਪ੍ਰੀਤ ਅਚਰਜ ਥੋਂ ਅਚਰਜ ਹੈ।"