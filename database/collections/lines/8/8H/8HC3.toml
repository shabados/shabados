[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਨ ਖੰਡਿ; ਮਾਇਆ ਮੋਹਿ ਹੈਰਾਨਾ ॥"
page = 415
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It wanders about distracted in the forest of worldly attractions."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰੀ ਮਮਤਾ ਦੇ ਜੰਗਲ ਅੰਦਰ ਇਹ ਫ਼ਾਵਾ ਹੋਇਆ ਹੋਇਆ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It wanders around the forest, distracted by attachment to Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਕਾ ਮੋਹ ਰੂਪ ਜੋ (ਬਨ ਖੰਡਿ) ਬਨ ਸਥਾਨ ਹੈ ਤਿਸ ਮੇਂ ਮਨ ਹਸਤੀ ਹੈਰਾਨ ਰਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਮਾਇਆ ਦੇ ਮੋਹ ਦੇ ਕਾਰਨ (ਸੰਸਾਰ-) ਜੰਗਲ ਵਿਚ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਨ ਖੰਡਿ = ਜੰਗਲ ਦੇ ਇਕ ਟੋਟੇ ਵਿਚ, ਸੰਸਾਰ-ਜੰਗਲ ਵਿਚ। ਮੋਹਿ = ਮੋਹ ਦੇ ਕਾਰਨ। ਹੈਰਾਨਾ = ਘਬਰਾਇਆ ਹੋਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "salvaje e intoxicada con su propio poder,"