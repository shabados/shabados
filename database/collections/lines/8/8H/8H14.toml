[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੈ ਸ੍ਰਮੁ ਕਰਿ; ਗਾਡੀ ਗਡਹੈ ॥"
page = 1004
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Gathering it, some bury it in the pit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਮਾ ਕਰਕੇ ਕੋਈ ਇਸ ਨੂੰ ਟੋਏ ਵਿੱਚ ਦੱਬ ਦਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some collect wealth, and bury it in the ground."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਕ ਪੁਰਸੋਂ ਨੇ ਕਸਟ ਕਰ ਕੇ (ਗਡ) ਟੋਏ ਮੇਂ ਗਾਡੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਤਾਂ ਐਸਾ ਹੈ ਜੋ ਬੜੀ ਮਿਹਨਤ ਨਾਲ ਕਮਾ ਕੇ ਧਰਤੀ ਵਿਚ ਦੱਬ ਰੱਖਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਕੈ = ਇਕ (ਜੀਵ) ਨੇ। ਸ੍ਰਮੁ = ਮਿਹਨਤ। ਗਾਡੀ = ਦੱਬ ਦਿੱਤੀ। ਗਡਹੈ = ਗੜ੍ਹੇ ਵਿਚ, ਟੋਏ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunos hay que acumulan riquezas para luego esconderlas y enterrarlas bajo tierra y no las comparten ni aun en sueños."