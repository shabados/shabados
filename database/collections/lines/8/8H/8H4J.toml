[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਵਨੁ ਸੁ ਮੁਨਿ; ਜੋ ਮਨੁ ਮਾਰੈ ॥"
page = 329
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who is that silent sage, who has killed his mind?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਕਿਹੜਾ ਚੁੱਪ ਕੀਤਾ ਰਿਸ਼ੀ ਹੈ, ਜਿਸ ਨੇ ਆਪਣੇ ਮਨੂਏ ਦਾ ਅਭਾਵ ਕਰ ਦਿਤਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who is that silent sage, who has killed his mind?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨ ਕੋ ਮਾਰੇ ਤਿਸ ਕੇ ਸਮਾਨ ਕੌਨ ਮੁਨੀ ਹੈ, ਸਮਾਨ ਪਦ ਕਾ ਅਧਿਆਹਾਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਕਿਹੜਾ ਮੁਨੀ ਹੈ ਜੋ ਮਨ ਨੂੰ ਮਾਰਦਾ ਹੈ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dime, ¿quién es el Siddha con sus poderes milagrosos que aniquila su mente? Porque si anula su mente,"