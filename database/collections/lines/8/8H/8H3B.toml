[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਤਾ ਵਲਿ ਖੁਦਾਇ ਦੇ; ਕਿਉ ਕਰਿ ਪਇਆ ਹੋਇ ਬਜਿਗਾਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Why this sinner is sleeping his legs spread towards God, Khuda."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਲਤਾਂ ਖ਼ੁਦਾਂ ਦੀ ਵੱਲ ਕੀਤੀਆਂ ਹਨ, ਕਿਉਂ ਪਾਪੀ ਹੋਕੇ ਲੰਮਾ ਪੈ ਰਿਹਾ ਹੈ'"