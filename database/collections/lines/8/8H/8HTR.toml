[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੈ ਗੁਰਿ; ਮੋਰੋ ਸਹਸਾ ਉਤਾਰਿਆ ॥"
page = 1218
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Guru has rid me of my doubt."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਗੁਰਾਂ ਨੇ ਮੇਰਾ ਸੰਦੇਹ ਦੂਰ ਕਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My Guru has rid me of my cynicism."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਗੁਰੋਂ ਨੇ ਮੇਰਾ ਸਹਿਸਾ ਉਤਾਰ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਗੁਰੂ ਨੇ (ਮੇਰੇ ਅੰਦਰੋਂ ਹਰ ਵੇਲੇ ਦਾ) ਸਹਿਮ ਦੂਰ ਕਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੇਰੈ ਗੁਰਿ = ਮੇਰੇ ਗੁਰੂ ਨੇ। ਮੋਰੋ = ਮੇਰਾ। ਸਹਸਾ = ਸਹਿਮ, ਦੁ-ਚਿੱਤਾ-ਪਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Guru me liberó de mi duda"