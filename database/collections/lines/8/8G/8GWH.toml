[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦਾ ਹਦੂਰਿ ਗੁਰਮੁਖਿ ਜਾਪੈ ॥"
page = 1055
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the Guru's grace, the Lord ever seems near."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ, ਸਾਈਂ ਹਮੇਸ਼ਾਂ ਨੇੜੇ ਭਾਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh knows that God is always ever-present."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖ ਸਦਾ (ਹਦੂਰਿ) ਨਜੀਕ ਹੀ ਜਾਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿਣ ਵਾਲੇ ਮਨੁੱਖ ਨੂੰ ਪਰਮਾਤਮਾ ਅੰਗ-ਸੰਗ ਵੱਸਦਾ ਦਿੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਦੂਰਿ = ਅੰਗ-ਸੰਗ। ਜਾਪੈ = ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por la Gracia del Guru, el Señor establece siempre Su Presencia"