[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸੁਖ ਸੰਪੁਟ ਵਿਚਿ ਰਖਿ ਕੈ; ਚਰਣ ਕਵਲ ਮਕਰੰਦ ਪਿਆਲੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They make cups of the nectar of lotus feet and quaff it with complete delight."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੂੰਹ ਦੇ ਡਬੇ ਵਿਚ ਰਖਕੇ ਚਰਨ ਕਵਲਾਂ ਦੇ ਰਸਾਂ ਦੇ ਪਿਆਲੇ ਬਣਾਉਂਦੇ ਹਨ (ਭਾਵ ਵਡੇ ਅਦਬ ਨਾਲ ਲੈਂਦੇ ਹਨ)।"