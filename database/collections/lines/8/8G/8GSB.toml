[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੂ ਜਿਨਾ ਕਾ ਅੰਧੁਲਾ; ਸਿਖ ਭੀ ਅੰਧੇ ਕਰਮ ਕਰੇਨਿ ॥"
page = 951
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The disciples, whose spiritual preceptor is blind, too, do the blind deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੇਲੇ, ਜਿਨ੍ਹਾਂ ਦਾ ਰੂਹਾਨੀ ਰਹਿਬਰ ਅੰਨ੍ਹਾਂ ਹੈ; ਉਹ ਭੀ ਅੰਨ੍ਹੇ ਹੀ ਕੰਮ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The disciples whose teacher is blind, act blindly as well."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜਿਨੋਂ ਕਾ ਅਗ੍ਯਾਨੀ ਹੋਵੇਗਾ ਉਸ ਕੇ ਸਿਖ ਭੀ ਅੰਧੇ, ਭਾਵ ਮੰਦ ਕਰਮ ਕਰਨਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਦਾ ਗੁਰੂ (ਆਪ) ਅਗਿਆਨੀ ਅੰਨ੍ਹਾ ਹੈ ਉਹ ਸਿੱਖ ਭੀ ਅੰਨ੍ਹੇ ਕੰਮ (ਭਾਵ, ਮੰਦੇ ਕੰਮ) ਹੀ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los que son guiados por un ciego, caminan en la oscuridad, hablan falsedades y banalidades;"