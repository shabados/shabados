[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਗਰਕ ਉਸ ਕੇ; ਵਡੇ ਠਗਾਊ ॥"
page = 392
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Her courtiers are great cheats."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਮਸਾਹਿਬ ਭਾਰੇ ਠੱਗ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Her courtiers are also great deceivers."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਅਗਰਕ) ਅਗ੍ਰਣੀਯ ਕਾਮਾਦਿਕ ਉਸ ਕੇ ਬਡੇ ਠਗਨੇ ਵਾਲੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਕਾਮਾਦਿਕ) ਉਸ ਮਾਇਆ ਦੇ ਮੁਸਾਹਬ (ਵੀ) ਵੱਡੇ ਠੱਗ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਰਕ = ਅੱਗੇ ਅੱਗੇ ਤੁਰਨ ਵਾਲੇ, ਚੌਧਰੀ, ਮੁਸਾਹਬ। ਠਗਾਊ = ਠੱਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sus cortesanos son también grandiosos embaucadores,"