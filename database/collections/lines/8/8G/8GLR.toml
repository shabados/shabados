[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਕਾ ਹੁਕਮੁ ਬੂਝਿ; ਸੁਖੁ ਹੋਇ ॥"
page = 281
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Peace ensues from understanding His order."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਫੁਰਮਾਨ ਸਮਝਣ ਦੁਆਰਾ ਆਰਾਮ ਉਤਪੰਨ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Understanding His Order, there is peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕਾ ਹੁਕਮ ਬੂਝ ਜੋ ਤੇਰੇ ਕੋ ਸੁਖ ਹੋਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਾਂ ਤੇ) ਉਸ ਮਾਲਕ ਦਾ ਹੁਕਮ ਸਮਝ ਕੇ ਸੁਖ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੂਝਿ = ਸਮਝ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sabe entonces que la Paz se alcanza aceptando Su Voluntad."