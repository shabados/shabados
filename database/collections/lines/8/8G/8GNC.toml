[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਖਦਾਈ; ਦੂਖ ਬਿਡਾਰਨ ਹਰੀਆ ॥"
page = 100
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God is the giver of comfort and the dispeller of pain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਆਰਾਮ ਦੇਣਹਾਰ ਤੇ ਦਰਦ-ਦੂਰ ਕਰਨ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is the Giver of Peace and the Dispeller of sorrow."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਸੁਖੋਂ ਕੇ ਦੇਣੇ ਵਾਲਾ ਹੈ ਔਰ ਦੁਖੋਂ ਕੇ (ਬਿਡਾਰਨ) ਦੂਰ ਕਰਨੇ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਨਾਮ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਐਸਾ ਜਲ ਹੈ ਜੋ ਸਦਾ ਹੀ ਸਾਫ਼ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਖ ਬਿਡਾਰਨ = ਦੁੱਖ ਦੂਰ ਕਰਨ ਜੋਗਾ। ਹਰੀਆ = ਹਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es el Dador de Paz y tristeza."