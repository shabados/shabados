[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਪ੍ਰਭਿ. ਆਪਿ ਤਰਾਇਆ ॥"
page = 622
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "him, the Lord Himself saves."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਸੁਆਮੀ ਖੁਦ ਪਾਰ ਉਤਾਰਾ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "is saved by God Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! (ਸੋ) ਤਿਸ ਤਿਸ ਕੋ ਤੈਨੇ ਆਪ ਹੀ ਤਰਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਉਸ ਨੂੰ ਪ੍ਰਭੂ ਨੇ ਆਪ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ। ਤਰਾਇਆ = ਪਾਰ ਲੰਘਾ ਲਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Señor Mismo los emancipa,"