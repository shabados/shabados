[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਪਕੜੀ; ਤਬ ਹੀ ਪਛੁਤਾਨੀ ॥੩॥"
page = 1275
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When death seizes thee, then shalt thou grieve."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਮੌਤ ਨੇ ਤੈਨੂੰ ਫੜਿਆ, ਤਦ ਤੂੰ ਝੋਰਾ ਕਰੇਂਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When Death seizes you, then you shall regret and repent. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਜਮਦੂਤੋਂ ਨੇ ਪਕੜੀ ਤਬਹਿ ਪਸਚਾਤਾਪ ਕਰਨੇ ਵਾਲੀ ਹੋਵੇਗੀ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਤੂੰ (ਮੌਤ ਦੇ ਜਾਲ ਵਿਚ) ਫੜੀ ਜਾਂਦੀ ਹੈਂ ਤਦੋਂ ਪਛੁਤਾਂਦੀ ਹੈਂ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y cuando la muerte te atrape, entonces te arrepentirás. (3)"