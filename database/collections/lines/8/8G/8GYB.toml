[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਲਿ ਸਾਧੂ; ਨਿਤ ਭਜਹ ਨਾਰਾਇਣ ॥"
page = 1312
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting together, the saints ever contemplate their Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕੱਠੇ ਹੋ ਸੰਤ ਸਦਾ ਹੀ ਆਪਣੇ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Holy meet together, and continually vibrate and meditate on the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਾਧੂ ਕੋ ਮਿਲ ਕਰ ਨਿਤਾਪ੍ਰਤੀ ਨਾਰਾਇਣ ਕੋ ਭਜਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਓ, ਸੰਤ ਜਨਾਂ ਨੂੰ ਮਿਲ ਕੇ ਸਦਾ ਪਰਮਾਤਮਾ ਦਾ ਭਜਨ ਕਰਿਆ ਕਰੀਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਿ ਸਾਧੂ = ਸੰਤ ਜਨਾਂ ਨੂੰ ਮਿਲ ਕੇ। ਭਜਹ = ਆਓ ਅਸੀਂ ਭਜਨ ਕਰੀਏ। ਨਾਰਾਇਣ = ਪਰਮਾਤਮਾ (ਨਾਰ = ਜਲ। ਅਯਨ = ਘਰ। ਸਮੁੰਦਰ ਵਿਚ ਜਿਸ ਦਾ ਘਰ ਹੈ, ਵਿਸ਼ਨੂ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Santos se reúnen vibrando y meditando en el Señor."