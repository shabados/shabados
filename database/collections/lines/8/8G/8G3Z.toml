[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਪੂਰ ਕਰੰਮ; ਸਤਿਗੁਰ ਚਰਣੀ ਲਗਿਆ ॥੨॥"
page = 710
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, perfect is the destiny of him, who is attached to the True Guru's feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਪੂਰਨ ਹੈ ਪ੍ਰਾਲਭਧ ਉਸ ਦੀ, ਜੋ ਸੱਚੇ ਗੁਰਾਂ ਦੇ ਪੈਰੀ ਨਾਲ ਜੁੜਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, by perfect good karma, one is attached to the feet of the True Guru. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਸ ਕੇ ਪੂਰਨ ਕਰਮ ਹੈਂ, ਸੋ ਗੁਰੋਂ ਕੀ ਚਰਨੀ ਲਗਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜੋ ਮਨੁੱਖ ਸਤਿਗੁਰੂ ਦੀ ਚਰਨੀਂ ਲੱਗਦੇ ਹਨ, ਉਹਨਾਂ ਦੇ ਚੰਗੇ ਭਾਗ ਹੁੰਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰ ਕਰੰਮ = ਪੂਰੇ ਭਾਗ, ਚੰਗੇ ਭਾਗ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, el Destino se vuelve perfecto si uno se postra a los Pies del Guru. (2)"