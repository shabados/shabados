[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਖਿਅਨ ਸਿਉ ਕਾਹੇ ਰਚਿਓ; ਨਿਮਖ. ਨ ਹੋਹਿ ਉਦਾਸੁ ॥"
page = 1426
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why are thou engrossed in the deadly sins and becomes not detached even for a moment?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਪ੍ਰਾਣ-ਨਾਸ਼ਕ ਪਾਪਾਂ ਅੰਦਰ ਕਿਉਂ ਖਚਤ ਹੋਇਆ ਹੋਇਆ ਹੈ ਅਤੇ ਇਕ ਮੁਹਤ ਭਰ ਲਈ ਭੀ ਤੂੰ ਉਪਰਾਮ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Why are you engrossed in sin and corruption? You are not detached, even for a moment!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਬਿਖ੍ਯੋਂ ਮੇਂ ਕਿਉਂ (ਰਚਿਓ) ਪ੍ਰੇਮ ਕਰ ਰਹਾ ਹੈਂ, ਨਿਮਖ ਮਾਤ੍ਰ ਭੀ ਤਿਨ ਬਿਖ੍ਯੋਂ ਸੇ ਉਦਾਸ ਨਹੀਂ ਹੋਤਾ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਵਿਸ਼ਿਆਂ ਨਾਲ ਕਿਉਂ (ਇਤਨਾ) ਮਸਤ ਰਹਿੰਦਾ ਹੈਂ? ਤੂੰ ਅੱਖ ਝਮਕਣ ਜਿਤਨੇ ਸਮੇ ਲਈ ਭੀ ਵਿਸ਼ਿਆਂ ਤੋਂ ਚਿੱਤ ਨਹੀਂ ਹਟਾਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਖਿਅਨ ਸਿਉ = ਵਿਸ਼ਿਆਂ ਨਾਲ। ਕਾਹੇ = ਕਿਉਂ? ਨਿਮਖ = (निमेष) ਅੱਖ ਝਮਕਣ ਜਿਤਨੇ ਸਮੇ ਲਈ। ਨ ਹੋਹਿ = ਨ ਹੋਹਿਂ, ਤੂੰ ਨਹੀਂ ਹੁੰਦਾ। ਉਦਾਸੁ = ਉਪਰਾਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué te involucras en el error y la corrupción?, no te desprendes de tus apegos ni por un instante."