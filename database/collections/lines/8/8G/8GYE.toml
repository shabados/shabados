[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਕਲ ਸਿਥਿਲ ਭਏ ਅੰਗ; ਸੰਗ ਜੈ ਹੈ ਭਲੇ ॥"
page = 921

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘All my body limbs are getting exhausted."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਅੰਗ ਸਿਥਲ ਹੋ ਗਏ ਹਨ, (ਪ੍ਰੀਤਮ) ਦੇ ਨਾਲ ਜਾਣਾ ਹੀ ਚੰਗਾ ਹੈ।"