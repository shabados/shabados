type = "primary"
data = "ਕਹਿਯੋ ਤੁਮਾਰੋ ਮਾਨਿ; ਭੋਗ ਤੋਸੋ ਨਹਿ ਕਰਿਹੋ ॥"
page = 834

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Acquiescing to your request, I am not going to copulate with you,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਕਿਹਾ ਮਨ ਕੇ ਮੈਂ ਤੇਰੇ ਨਾਲ ਰਤੀ-ਕ੍ਰੀੜਾ ਨਹੀਂ ਕਰਾਂਗਾ।"