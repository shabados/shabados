[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਜਨਮ; ਪੰਖੀ ਸਰਪ ਹੋਇਓ ॥"
page = 176
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In several births thou became a bird and a snake."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਜੂਨਾ ਅੰਦਰ ਪੰਛੀ ਅਤੇ ਸੱਪ ਹੋਇਆ ਸੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In so many incarnations, you were a bird and a snake."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਈ ਜਨਮ ਪੰਖੀ ਤਥਾ ਸਰਪ ਹੋਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਈ ਜਨਮਾਂ ਵਿਚ ਤੂੰ ਪੰਛੀ ਤੇ ਸੱਪ ਬਣਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੰਖੀ = ਪੰਛੀ। ਸਰਪ = ਸੱਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "fuiste también pájaro y serpiente;"