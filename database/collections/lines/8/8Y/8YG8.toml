data = "ਤਬ ਓਹ; ਚਰਣੀ ਆਇ ਪਈ ॥੧॥"
page = 891
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then it comes and falls at his feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਇਹ ਆ ਕੇ ਉਸ ਦੇ ਪੈਰੀਂ ਪੈ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then it comes and falls at your feet. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਵਹੁ ਮਾਇਆ ਤਿਨ ਕੀ ਚਰਨੀ ਆਇ ਪਈ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਇਹ ਆ ਕੇ ਉਸ ਦੀ ਚਰਨੀਂ ਪੈ ਗਈ ॥੧॥"

[[content]]
