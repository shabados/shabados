[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਡਰਤ ਤੈਰਿ ਕੋਊ ਨ ਸਕੈ; ਲਾਗਤ ਸਿੰਧੁ ਸਮਾਨ ॥੪॥"
page = 896

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Dreaded, none dared to swim across, as it looked like a sea.(4)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਡੁਬਣ ਦੇ) ਡਰ ਕਰ ਕੇ ਉਸ ਨੂੰ ਕੋਈ ਤਰ ਨਹੀਂ ਸੀ ਸਕਦਾ। (ਉਹ) ਸਮੁੰਦਰ ਵਰਗੀ ਲਗਦੀ ਸੀ ॥੪॥"