[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਦਿ ਦੇਵ, ਅਨਾਦਿ ਮੂਰਤਿ; ਥਾਪਿਓ ਸਬੈ ਜਿਂਹ ਥਾਪਿ ॥"
page = 5
line = 9

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou, the Primal God, art Eternal Entity and hast created the entire universe."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਦਿ ਦੇਵ, ਆਦਿ (ਮੁੱਢ) ਤੋਂ ਰਹਿਤ ਸਰੂਪ ਵਾਲਾ ਅਤੇ ਜਿਸ ਨੇ ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ (ਸਥਾਪਨਾ) ਨੂੰ ਸਥਾਪਿਤ ਕੀਤਾ ਹੋਇਆ ਹੈ;"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਆਦਿ ਦੇਵ ਅਨਾਦਿ ਮੂਰਤਿ; ਥਾਪਿਓ ਸਭੈ ਜਿਹ ਥਾਪ ॥"