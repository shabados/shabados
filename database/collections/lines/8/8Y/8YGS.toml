[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੁਨਰਪਿ ਜਨਮੁ ਨਾਹੀ; ਗੁਣ ਗਾਉ ॥੫॥"
page = 224
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By singing His praises, the man is not born again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਕੀਰਤੀ ਗਾਇਨ ਕਰਨ ਦੁਆਰਾ, ਬੰਦਾ ਮੁੜ ਕੇ ਜਨਮ ਨਹੀਂ ਧਾਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such a person is not reincarnated again; he sings the Glories of God. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਪਰਮੇਸ੍ਵਰ ਕੇ ਗੁਣ ਗਾਇਨ ਕਰਨੇ ਸੇ (ਪੁਨ) ਪੁਨਃ (ਰਪਿ) ਫੇਰਿ ਨਿਸਚੇ ਕਰ ਕੇ ਜਨਮ ਹੀ ਹੋਤਾ ਹੈ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਮੁੜ ਮੁੜ ਜਨਮ ਨਹੀਂ ਲੈਣਾ ਪੈਂਦਾ, ਉਹ ਸਦਾ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦਾ ਹੈ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੁਨਰਪਿ = {पुनः अपि} ਮੁੜ ਮੁੜ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y yo ofrezco mi ser en sacrificio a él, y canto sus Alabanzas para que no tenga que nacer sólo para morir otra vez.(5)"