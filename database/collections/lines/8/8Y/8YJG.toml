[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਤੁਧੁ ਭਾਵਹਿ. ਤਾ ਕਰਹਿ ਬਿਭੂਤਾ; ਸਿੰਙੀ ਨਾਦੁ ਵਜਾਵਹਿ ॥"
page = 145
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When it pleases Thee, O Lord! then the mortal smears his body with ashes and sounds the horn and the shell."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਤੈਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ, ਹੇ ਸੁਆਮੀ! ਤਦ ਪ੍ਰਾਣੀ ਆਪਣੇ ਸਰੀਰ ਨੂੰ ਸਵਾਹ ਮਲਦਾ ਹੈ ਅਤੇ ਸਿੰਗ ਅਤੇ ਸੰਖ ਵਜਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When it pleases You, we smear our bodies with ashes, and blow the horn and the conch shell."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਕਰ ਤੇਰੇ ਕੋ ਜੀਵ ਭਾਵੈ ਤੌ ਸਰੀਰ ਪਰ ਵਿਭੂਤੀ ਕਾ ਮਲਨ ਕਰੇ ਹੈਂ, ਸਿਙੀ ਔਰ ਨਾਦ ਕਾ ਵਜਾਵਣਾ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਈ (ਪਿੰਡੇ ਉਤੇ) ਸੁਆਹ ਮਲਦੇ ਹਨ ਤੇ ਸਿੰਙੀ ਦਾ ਨਾਦ ਵਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਭੂਤਾ = ਸੁਆਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si es Tu Voluntad, uno unta su cuerpo con cenizas, y si es Tu Voluntad, toca el corno y la concha del Yogui."