[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕਾ ਸਬਦੁ; ਤੇਰੈ ਸੰਗਿ ਸਹਾਈ ॥"
page = 190
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Guru's Word is thy comrade and succour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦਾ ਸ਼ਬਦ ਤੇਰਾ ਸਾਥੀ ਅਤੇ ਮਦਦਗਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Word of the Guru's Shabad is your Companion and Helper."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕਾ ਸਬਦ ਤੇਰੇ ਸੰਗ ਸਹਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰੂ ਦਾ ਸ਼ਬਦ ਹੀ ਤੇਰੇ ਨਾਲ (ਸਦਾ ਸਾਥ ਨਿਬਾਹੁਣ ਵਾਲਾ) ਸਾਥੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਾਈ = ਸਾਥੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Palabra del Shabd del Guru te acompañará siempre,"