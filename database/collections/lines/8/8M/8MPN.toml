[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨਿ ਸਰਬ ਸੁਖਾ ਫਲ ਪਾਇਆ ॥੨॥੧੨॥੭੬॥"
page = 627
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and he obtains the fruit of all the comforts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇ ਉਹ ਸਾਰਿਆਂ ਆਰਾਮਾਂ ਦੇ ਮੇਵੇ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He obtains the rewards of all joys and peace. ||2||12||76||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨੋਂ ਨੇ ਸਰਬ ਸੁਖੋਂ ਕਾ ਫਲ੍ਹ ਜੋ ਆਤਮਾਨੰਦ ਹੈ, ਸੋ ਪਾਇ ਲੀਆ ਹੈ॥੨॥੧੨॥੭੬॥☬ਗ੍ਯਾਨਵਾਨੋਂ ਕਾ ਨਿਹਚਾ ਦਿਖਾਵਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਸਾਰੇ ਸੁਖ ਦੇਣ ਵਾਲੇ (ਫਲ ਪ੍ਰਾਪਤ ਕਰ ਲਏ ਹਨ ॥੨॥੧੨॥੭੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਨਿ = ਉਸ (ਮਨੁੱਖ) ਨੇ। ਸਰਬ ਸੁਖਾ = ਸਾਰੇ ਸੁਖ ਦੇਣ ਵਾਲੇ ॥੨॥੧੨॥੭੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y es bendecido con la Fruta dadora de la Paz de la Emancipación. (2‑12‑76)"