data = "ਰਾਮਜਨੀ ਗ੍ਰਿਹ ਜਨਮ; ਬਿਧਾਤੈ ਮੁਹਿ ਦਿਯਾ ॥"
page = 827

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘God gave me birth into the house of a prostitute and"

