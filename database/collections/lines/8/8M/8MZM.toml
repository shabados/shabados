[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖਿਨ ਮਹਿ; ਥਾਪਿ ਉਥਾਪਨਹਾਰ ॥"
page = 1144
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In an instant, He establishes and disestablishes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਮੁਹਤ ਵਿੱਚ ਉਹ ਟਿਕਾਉਂਦਾ ਤੇ ਉਖੇੜ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In an instant, He establishes and disestablishes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਕ ਖਿਨ ਵਿਖੇ ਸ੍ਰਿਸ੍ਟੀ ਕੋ ਬਨਾ ਕਰ ਕੇ ਫੇਰ ਢਾਹ ਦੇਤਾ ਹੈ, ਭਾਵ ਰਾਜਾ ਤੇ ਭੇਖਾਰੀ ਕਰ ਦੇਤਾ ਹੈ ਔਰ ਭੇਖਾਰੀ ਸੇ ਰਾਜਾ ਬਨਾ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਇਕ ਖਿਨ ਵਿਚ ਪੈਦਾ ਕਰ ਕੇ ਨਾਸ ਕਰਨ ਦੀ ਸਮਰਥਾ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਥਾਪਿ = ਪੈਦਾ ਕਰ ਕੇ। ਉਥਾਪਨਹਾਰ = ਨਾਸ ਕਰ ਸਕਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él hace y deshace en un instante."