type = "primary"
data = "ਅਛਿਦਾ ਅਭਿਦਾ ਅਸਿਤਾ ਅਧਰੀ ॥"
page = 680

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O Goddess! You are invincible, indiscriminate, non-white and base of all"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾ ਛਿਦਣ ਵਾਲੀ, ਨਾ ਭੇਦੇ ਜਾ ਸਕਣ ਵਾਲੀ, ਕਾਲੇ ਰੂਪ ਵਾਲੀ, ਆਸਰਾ ਦੇਣ ਵਾਲੀ,"