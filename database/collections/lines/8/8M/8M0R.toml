[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਣ ਕਾ ਦਾਤਾ ਸਚਾ ਸੋਈ ॥"
page = 1055
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the True Lord, is the Giver of virtue."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੱਚਾ ਸਾਹਿਬ, ਨੇਕੀ ਬਖਸ਼ਣਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Lord is the Giver of virtue."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ਼ੁਭ ਗੁਣੋਂ ਕਾ ਦਾਤਾ ਤੌ ਸੋਈ ਸਚਾ ਵਾਹਿਗੁਰੂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ, (ਆਪਣੇ) ਗੁਣਾਂ (ਦੇ ਗਾਣ) ਦੀ ਦਾਤ ਦੇਣ ਵਾਲਾ ਉਹ ਸਦਾ-ਥਿਰ ਪਰਮਾਤਮਾ ਆਪ ਹੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਪਰਮਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru Verdadero es Quien nos bendice con la Virtud,"