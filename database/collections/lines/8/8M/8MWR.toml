[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੈ ਤੂਹੀ ਏਕੈ; ਅਨ ਨਾਹੀ. ਤੁਮ ਭਤਿ ॥"
page = 1385
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou are but One. None else is like Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਕੇਵਲ ਕਲਮਕੱਲਾ ਹੀ ਹੈ। ਕੋਈ ਹੋਰ ਤੇਰੇ ਵਰਗਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the One and Only; no one else is like You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕੋ ਏਕ ਤੂ ਹੀ ਹੈਂ, ਕਿਉਂ ਕਿ ਤੁਮਾਰੀ (ਭਤਿ) ਤਰਹ ਸਮਰਥ ਔਰ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਕੇਵਲ ਇੱਕੋ ਹੀ ਇਕ ਹੈਂ, ਤੇਰੇ ਵਰਗਾ ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨ = ਕੋਈ ਹੋਰ (अन्य)। ਤੁਮ ਭਤਿ = ਤੁਮ ਭਾਂਤਿ, ਤੇਰੇ ਵਰਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, no tienes Fin ni Límite,"