[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਵਰ ਗਏ; ਬਗ ਬੈਠੇ ਆਇ ॥੧॥ ਰਹਾਉ ॥"
page = 792
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The black bees have gone and the white cranes have come and settled. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਾਲੇ ਭਾਉਰ ਚਲੇ ਗਏ ਹਨ ਅਤੇ ਚਿੱਟੇ ਬਗਲੇ ਆ ਕੇ ਬਹਿ ਗਏ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My dark hairs, like bumble bees, have gone away, and grey hairs, like cranes, have settled upon my head. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਭਵਰ) ਰਾਤੀ ਕੇ ਪਹਰ ਕਾਲੇ ਚਲੇ ਗਏ, (ਬਗ) ਚਿਟੇ ਦਿਨ ਕੇ ਪਹਿਰਿ ਆਇ ਇਸਥਿਤ ਹੂਏ ਹੈਂ। ਵਾ (ਰੈਨਿ), ਭਾਵ ਜੁਆਨੀ ਚਲੀ ਗਈ ਹੈ ਮਤ (ਦਿਨੁ), ਭਾਵ ਬੁਢੇਪਾ ਭੀ ਬਿਅਰਥ ਜਾਤਾ ਹੋਵੇ। (ਭਵਰ) ਕਾਲੇ ਕੇਸ ਚਲੇ ਗਏ ਹੈਂ, ਜੋ (ਬਗ) ਧੌਲੇ ਕੇਸ ਹੈਂ, ਸੋ ਆਨ ਇਸਥਿਤ ਹੂਏ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੇਰੇ) ਕਾਲੇ ਕੇਸ ਚਲੇ ਗਏ ਹਨ (ਉਹਨਾਂ ਦੇ ਥਾਂ) ਧੌਲੇ ਆ ਗਏ ਹਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਵਰ = ਭਵਰ ਵਰਗੇ ਕਾਲੇ ਕੇਸ। ਬਗ = ਬਗਲੇ ਵਰਗੇ ਚਿਟੇ ਕੇਸ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El cabello negro como la abeja negra ha desaparecido y los cabellos blancos como grullas blancas han descendido sobre mí. (1-Pausa)"