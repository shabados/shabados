[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਗਨੁ ਰਹਾਇਆ ਹੁਕਮੇ ਚਰਣਾ ॥"
page = 1071
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who has poised the sky on the feet of his will,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਆਕਾਸ਼ ਨੂੰ ਆਪਣੀ ਰਜ਼ਾ ਦੇ ਪੈਰਾ ਤੇ ਟਿਕਾਇਆ ਹੋਇਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He suspends the heavens upon the feet of His Command."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨ: ਅਕਾਸ ਕੋ ਹੁਕਮ ਰੂਪ ਕੇ (ਚਰਣਾ) ਆਸਰੇ ਇਸਥਿਤ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਆਪਣੇ ਹੁਕਮ ਦਾ ਹੀ ਆਸਰਾ ਦੇ ਕੇ ਆਕਾਸ਼ ਨੂੰ ਥੰਮ੍ਹ ਰੱਖਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਗਨੁ = ਆਕਾਸ਼। ਰਹਾਇਆ = ਟਿਕਾਇਆ, ਥੰਮ੍ਹਿਆ। ਹੁਕਮੇ = ਹੁਕਮ ਦੀ ਰਾਹੀਂ ਹੀ। ਚਰਣਾ = ਆਸਰਾ (ਦੇ ਕੇ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Quien sostiene el firmamento con los Pies de Su Sabiduría."