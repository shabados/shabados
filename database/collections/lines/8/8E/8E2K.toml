[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੋਕ ਜਿਤੇ ਮਨ ਭੀਤਰ ਥੇ; ਹਰਿ ਕੋ ਤਨ ਭੇਟਿ ਸਭੈ ਬਿਸਰਾਏ ॥"
page = 397

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He forsook the sorrow of his mind,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਨ ਵਿਚ ਜਿਤਨੇ ਦੁਖ ਸਨ, ਕ੍ਰਿਸ਼ਨ ਦੇ ਸ਼ਰੀਰ ਨੂੰ ਛੁਹ ਕੇ ਸਾਰੇ ਭੁਲ ਗਏ।"