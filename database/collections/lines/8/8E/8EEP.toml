[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੁ ਛੋਡਿ; ਝੂਠ ਸੰਗਿ ਮਚੈ ॥"
page = 267
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He renounces truth and is pleased with falsehood."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਰਾਸਤੇ ਨੂੰ ਤਿਆਗਦਾ ਹੈ ਅਤੇ ਕੂੜ ਨਾਲ ਖੁਸ਼ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They renounce Truth and embrace falsehood."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ (ਸਾਚਿ) ਨਾਮ ਕੌ ਛੋਡ ਕਰ ਝੂਠੇ ਕਾਮਾਦਿਕੋਂ ਕੇ ਸਾਥ ਮਚ ਰਹਾ ਹੈ ਅਰਥਾਤ ਪ੍ਰਫੁਲਤ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ (ਪ੍ਰਭੂ) ਨੂੰ ਛੱਡ ਕੇ ਨਾਸਵੰਤ (ਪਦਾਰਥਾਂ) ਨਾਲ ਭੂਹੇ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛੋਡਿ = ਛੱਡ ਕੇ। ਮਚੈ = ਮੱਚਦਾ ਹੈ, ਭੂਹੇ ਹੁੰਦਾ ਹੈ, ਆਕੜਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "rechazando la Verdad, vive fascinado por lo falso."