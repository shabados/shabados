[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਧੀਰੁ ਨਿਹਾਲੂ ਤੁਲਸੀਆ; ਬੂਲਾ ਚੰਡੀਆ ਬਹੁ ਗੁਣਿਆਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Nihalu and Tulsia are for bearing and Bula Chandia are full of many virtues."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਧੀਰੂ, ਨਿਹਾਲੂ, ਤੁਲਸੀਆ, ਬੂਲਾ ਚੰਡੀਆ ਗੁਣਾਂ ਦਾ ਘਰ ਗੁਣਾਂ ਵਾਲੇ ਹਨ।"