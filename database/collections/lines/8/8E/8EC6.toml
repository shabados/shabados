[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਹਉਮੈ ਪਰਹਰੈ; ਮਨਿ ਭਾਵੈ ਖਸਮੈ ਦਾ ਭਾਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Gurmukh repudiates ego and he likes the will of God."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖ ਲੋਕ ਹਉਮੈਂ ਨਹੀਂ ਕਰਦੇ (ਕਿਉਂ ਜੋ ਉਹਨਾਂ ਦੇ) ਮਨ ਵਿਖੇ ਵਾਹਿਗੁਰੂ ਦਾ ਭਾਣਾ ਹੀ ਚੰਗਾ ਲਗਦਾ ਹੈ।"