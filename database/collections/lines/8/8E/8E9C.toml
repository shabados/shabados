data = "ਸੰਨਿਆਸ ਰਾਜ ਉਪਜਾ ਉਦਾਰ ॥"
page = 638

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The praise of his limbs seemed boundless and he manifested himself as a generous king of the Yogis"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਪ੍ਰਕਾਰ) ਸੰਨਿਆਸ ਰਾਜ ਪੈਦਾ ਹੋਇਆ ਸੀ।"