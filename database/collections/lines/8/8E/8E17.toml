[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧੂ ਕੈ ਸੰਗਿ; ਪਾਪ ਪਲਾਇਨ ॥"
page = 271
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By association with the saints the sins flee away."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤਾਂ ਦੀ ਸੰਗਤ ਕਰਨ ਦੁਆਰਾ ਕਸਮਲ ਦੌੜ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Company of the Holy, one's sins fly away."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੇ ਸੰਗ ਕਰ ਸਰਬ ਪਾਪ (ਪਲਾਇਨ) ਭਾਗਤੇ ਅਰਥਾਤ ਦੂਰ ਹੋ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾਂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਪਾਪ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਲਾਇਨ = {Skt. प्लु! A. fade away, disappear} ਨਾਸ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Viviendo en Santa Compañía las propias faltas son borradas"