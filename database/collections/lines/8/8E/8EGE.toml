[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਭੰ ਜੁਧੁ ਕੋ ਸਸਤ੍ਰ ਅਸਤ੍ਰੰ ਬਨਾਏ ॥"
page = 177

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When all the kings heard that taking a vow of killing Kshatriyas, the persistent Parashurama had arrived, then all of them prepared for war, taking all their weapons."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਨੇ ਯੁੱਧ ਲਈ ਅਸਤ੍ਰ ਅਤੇ ਸ਼ਸਤ੍ਰ ਸਜਾ ਲਏ।"