[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਦੇਸ ਭੂ ਮੰਡਲ ॥"
page = 275
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many million are the countries and regions of earth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਕ੍ਰੋੜ ਹਨ ਮੁਲਕ ਅਤੇ ਧਰਤੀ ਦੇ ਖੰਡ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions are the countries and realms of the world."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਈ ਕ੍ਰੋੜੋਂ ਦੇਸ ਔ ਪ੍ਰਿਥਵੀ ਮੰਡਲ ਵਾ ਪ੍ਰਿਥਵੀ ਮੰਡਲ ਮੇਂ ਕਈ ਦੇਸ ਰਚੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਰੋੜਾਂ ਦੇਸ ਤੇ ਧਰਤੀਆਂ ਦੇ ਚੱਕ੍ਰ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੂ = ਧਰਤੀ। ਭੂ ਮੰਡਲ = ਧਰਤੀ ਦੇ ਚੱਕ੍ਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones los países y reinos de la tierra."