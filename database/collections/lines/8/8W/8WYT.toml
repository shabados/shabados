[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਗੇ ਹੂੰ ਕਾਲ ਧਰੇ ਅਸਿ ਗਾਜਤ ਛਾਜਤ ਹੈ ਜਿਹ ਤੇ ਨਸਿ ਅਈਐ ॥"
page = 46

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Wherever one may go, even there he will perceive the well-seated thundering sword of KAL."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਧਰ ਜਾਈਏ ਉਧਰ) ਅਗੇ ਹੀ ਕਾਲ ਤਲਵਾਰ ਧਾਰੇ ਗੱਜਦਾ ਹੋਇਆ ਸੋਭ ਰਿਹਾ ਹੈ ਜਿਸ ਕਰ ਕੇ (ਵਾਪਸ) ਭਜ ਆਈਦਾ ਹੈ।"