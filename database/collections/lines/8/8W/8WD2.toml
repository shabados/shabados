[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਕੀ ਓਟ; ਤਿਸੈ ਕੀ ਆਸਾ ॥"
page = 1144
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, whose protection seek I; on Him alone is pinned my hope."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਪਨਾਹ ਲੋੜਦਾ ਹਾਂ, ਉਸ ਉਤੇ ਹੀ ਮੇਰੀ ਉਮੀਦ ਬੱਝੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is my Anchor and Support; I place my hopes in Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਵਾਹਿਗੁਰੂ ਕੀ ਸਰਨ ਲਈ ਹੈ ਤਿਸ ਕੀ ਮਨ ਵਿਖੇ ਆਸਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਦੁੱਖਾਂ ਤੋਂ ਬਚਣ ਲਈ ਅਸਾਂ ਜੀਵਾਂ ਨੂੰ) ਜਿਸ (ਪਰਮਾਤਮਾ) ਦਾ ਆਸਰਾ ਹੈ, (ਸੁਖਾਂ ਦੀ ਪ੍ਰਾਪਤੀ ਲਈ ਭੀ) ਉਸੇ ਦੀ (ਸਹਾਇਤਾ ਦੀ) ਆਸ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸ ਕੀ = {ਸੰਬੰਧਕ 'ਕੀ' ਦੇ ਕਾਰਨ ਲਫ਼ਜ਼ 'ਜਿਸੁ' ਦਾ (ੁ) ਉਡ ਗਿਆ ਹੈ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo en Él me apoyo,"