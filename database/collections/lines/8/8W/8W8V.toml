[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਫਿਰਦੀ ਫਿਰਦੀ ਦਹ ਦਿਸਾ; ਜਲ ਪਰਬਤ ਬਨਰਾਇ ॥"
page = 322
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The kite, roams and wanders in ten direction over waters, mountains and forests,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗਿੱਧ ਪਾਣੀਆਂ, ਪਹਾੜਾ ਅਤੇ ਜੰਗਲਾਂ ਉਤੇ ਦਸੀ ਪਾਸੀਂ ਭੌਦੀਂ ਅਤੇ ਭਟਕਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Roaming and wandering in the ten directions, over water, mountains and forests"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਲੋਂ ਔਰ ਥਲੋਂ ਪਰਬਤੋਂ ਪੁਨਾ ਬਨਾਸਪਤੀਓਂ ਮੇਂ ਦਸੋ ਦਿਸਾ ਮੇਂ ਫਿਰਤੀ ਫਿਰਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦਸੀਂ ਪਾਸੀਂ ਦਰਿਆਵਾਂ, ਪਹਾੜਾਂ ਅਤੇ ਰੁੱਖਾਂ-ਬਿਰਖਾਂ ਤੇ ਉੱਡਦੀ ਉੱਡਦੀ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਹ = ਦਸ। ਦਿਸਾ = ਪਾਸੇ। ਦਹਦਿਸਾ = ਦਸੀਂ ਪਾਸੀਂ, ਹਰ ਪਾਸੇ। ਬਨਰਾਇ = ਬਨਸਪਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El zopilote vuela por los mares, los bosques y por todo tipo de paisajes,"