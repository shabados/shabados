[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਰਭਰਾਇ ਉਠਿ ਠਾਢ ਭੀ; ਜਾਨਿ ਮੋਟਿਯੋ ਯਾਰ ॥੧੦॥"
page = 815

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And she hastily got up and stood before the old man.(10)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਬਾਹਰੋਂ) ਮੋਟੇ ਯਾਰ ਨੂੰ ਆਇਆ ਜਾਣ ਕੇ ਘਬਰਾ ਕੇ ਉਠ ਕੇ ਖੜੋ ਗਈ ॥੧੦॥"