[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਰਿਕ ਵਾਂਗੀ; ਹਉ. ਸਭ ਕਿਛੁ ਮੰਗਾ ॥"
page = 99
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Like a child I ask for everything."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੱਚੇ ਦੀ ਮਾਨਿੰਦ ਮੈਂ ਹਰ ਸ਼ੈ ਦੀ ਯਾਚਨਾ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Like a child, I ask for everything."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਗਵਨ! ਬਾਰਿਕਵਤ ਮੈਂ ਸਭ ਕਿਛੁ ਮਾਂਗਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਮਤਿ ਲੈ ਕੇ ਪਰਮਾਤਮਾ ਦੇ ਦਰ ਤੋਂ) ਮੈਂ ਅੰਞਾਣੇ ਬਾਲ ਵਾਂਗ ਹਰੇਕ ਚੀਜ਼ ਮੰਗਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਮੈਂ। ਮੰਗਾ = ਮੰਗਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Como un niño le pido todas las cosas,"