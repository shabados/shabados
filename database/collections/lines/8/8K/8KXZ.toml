[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਿਤ੍ਰ ਬਚਿਤ੍ਰ ਚੌਪਿ ਰਨ ਕਰਿਯੋ ॥"
page = 933

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The ruler of Sialkote became furious and, engulfed in rage, eventuated the skirmishes."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਈ ਪ੍ਰਕਾਰ ਦਾ ਵਿਚਿਤ੍ਰ ਅਤੇ ਅਦਭੁਤ ਯੁੱਧ ਕਰਨ ਲਗਾ।"