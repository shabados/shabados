[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤਨ ਕੀ ਸਰਣਾਈ ਪੜਿਆ ॥"
page = 1078
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have entered into the sanctuary of the saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਾਧੂਆਂ ਦੀ ਪਨਾਹ ਲਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have entered the Sanctuary of the Saints,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੰਤੋਂ ਕੀ ਸਰਣ ਪੜਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਭੀ ਤੇਰੇ ਸੰਤ ਜਨਾਂ ਦੀ ਸਰਨ ਆ ਪਿਆ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੜਿਆ = (ਮੈਂ ਭੀ) ਪਿਆ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He buscado sólo el Refugio de la Sociedad de los Santos"