[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਸਉ ਸੰਗਿ ਗੁਪਾਲ; ਸਗਲ ਸੁਖ ਰਾਸਿ ਹਰਿ ॥"
page = 1362
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I abide with God, the Sustainer of the universe who is the capital of the comforts,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਲਮ ਦੇ ਪਾਲਣ-ਪੋਸਣਹਾਰ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਲ ਵਸਦਾ ਹਾਂ, ਜੋ ਸਾਰਿਆਂ ਆਰਾਮਾਂ ਦਾ ਮੂਲ ਧਨ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I abide with the Lord of the World, the Treasury of Total Peace. O Lord!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਗੋਪਾਲ ਜੋ ਸਰਬ ਸੁਖੋਂ ਕੀ ਰਾਸ ਹੈ ਅਬ ਮੈਂ ਤਿਸ ਕੇ ਸਾਥ ਹੀ ਵਸਤਾ ਹੂੰ॥☬ਜੇ ਕਹੇ ਵੁਹ ਕੈਸਾ ਹੈ? ਸੋ ਕਹਿਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਮਿਹਰ ਦਾ ਸਦਕਾ) ਮੈਂ ਉਸ ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਪਾਲਣਹਾਰ ਨਾਲ (ਸਦਾ) ਵੱਸਦੀ ਹਾਂ, ਜਿਹੜਾ ਪਰਮਾਤਮਾ ਸਾਰੇ ਸੁਖਾਂ ਦਾ ਸੋਮਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਸਾਉ = ਬਸਾਉਂ, ਮੈਂ ਵੱਸਦੀ ਹਾਂ। ਸੰਗਿ ਗੁਪਾਲ = ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਪਾਲਣਹਾਰ ਪ੍ਰਭੂ ਨਾਲ। ਸਗਲ = ਸਾਰੇ। ਸੁਖ ਰਾਸਿ = ਸੁਖਾਂ ਦਾ ਸੋਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Habito en el Señor del Mundo, la Tesorería de la Total Paz. Oh Señor,"