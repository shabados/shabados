[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਥਰਿ ਥਰਿ ਪ੍ਰਿਥਮੀ ਚਾਲੀ ਦਲਾਂ ਚੜੰਦਿਆਂ ॥"
page = 126

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the armies marched, the earth trembled"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਰਾਖਸ਼ਾਂ ਦੇ) ਦਲਾਂ ਦੀ ਚੜ੍ਹਤ ਨਾਲ ਧਰਤੀ ਥਰ-ਥਰ ਕੰਬਣ ਲਗ ਗਈ"