data = "ਸੁਣਿਯੋ ਨਾਵ ਖੰਡੰ ॥"
page = 64

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Such a heroic battle was fought that all the people of the world living in nine quarters, knew it."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਦਾ ਸ਼ੋਰ) ਨੌਂ ਖੰਡਾਂ ਵਿਚ ਸੁਣਿਆ ਗਿਆ।"