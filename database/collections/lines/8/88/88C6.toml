[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਣਾ ਆਪੁ; ਵਿਚਹੁ ਗਵਾਏ ॥"
page = 1016
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and eradicates his self-conceit from within him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੇ ਅੰਦਰ ਆਪਣੀ ਸਵੈ-ਹੰਗਤਾ ਨੂੰ ਦੂਰ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "he eradictes his self-conceit from within."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਹੰਕਾਰ ਵਿਚੋਂ ਗਵਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਆਪਣੇ ਅੰਦਰੋਂ ਆਪਾ-ਭਾਵ ਦੂਰ ਕਰ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੁ = ਆਪਾ-ਭਾਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, sin la ayuda del Guru, todos están involucrados en la contienda,"