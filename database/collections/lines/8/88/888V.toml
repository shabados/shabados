data = "ਹੇ ਨਸੀਹਤ ਕਰਨ ਵਾਲੇ# ਤੂੰ ਕਦ ਤਕ ਨਸੀਹਤਾਣ ਦੇ ਕਿੱਸੇ ਸੁਣਾਣਦਾ ਰਹੇਣਗਾ #  "

