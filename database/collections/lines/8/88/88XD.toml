[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਨ ਕਮਲ ਹਰਿ ਸਰਨ ॥"
page = 896
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of Thine lotus feet, my God, I ponder over that Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਕੰਵਲ ਚਰਨਾਂ ਦੀ ਮੈਂ ਪਨਾਹ ਲੋੜਦਾ ਹਾਂ, ਮੇਰੇ ਵਾਹਿਗੁਰੂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your lotus feet, Lord, are my Sanctuary."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਚਰਨ ਕਮਲੋਂ ਕੀ ਤੁਮ (ਹੀ) ਨਿਸਚੇ ਕਰ ਕੇ ਸਰਨ ਲੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੈਂ ਤਾਂ ਸਦਾ) ਤੇਰੇ ਸੋਹਣੇ ਚਰਨਾਂ ਦੀ ਸਰਨ ਵਿਚ ਰਹਿੰਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ = ਹੇ ਹਰੀ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por eso es que busco el Refugio de Tus Pies de Loto."