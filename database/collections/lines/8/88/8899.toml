[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਖੁ ਪਾਵਹਿ; ਹਰਿ ਦੁਆਰ ਪਰਾਨੀ ॥੧॥ ਰਹਾਉ ॥"
page = 200
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and thou shalt obtain peace at God's gate, O mortal. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਤੂੰ ਵਾਹਿਗੁਰੂ ਦੇ ਦਰਵਾਜੇ ਉਤੇ ਆਰਾਮ ਪਾਵੇਂਗਾ ਹੈ ਫਾਨੀ ਬੰਦੇ! ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "are blessed with peace at the Lord's Gate, O mortal. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੀਵ! ਹਰੀ ਕੇ ਦੁਆਰ ਮੇਂ ਸੁਖ ਪਾਵੈਂਗਾ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਾਣੀ! (ਸਿਮਰਨ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਤੂੰ ਹਰੀ ਦੇ ਦਰ ਤੇ ਸੁਖ ਪ੍ਰਾਪਤ ਕਰੇਂਗਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ ਦੁਆਰਿ = ਹਰੀ ਦੇ ਦਰ ਤੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "obtienen la Paz Divina en la Puerta del Cielo.(1-Pausa)"