[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਤਿਉ ਸਾਂਗਿ ਸਿਞਾਪਨਿ ਸਨਮੁਖਾਂ; ਬੇਮੁਖ ਹਤਿਆਰੇ ॥੧੯॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Similar are the apostates, the assassins who disguised as close to the Lord remain around, but ultimately are identified."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅਜਿਹਾ ਹੀ ਬੇਮੁਖ ਹਤਿਆਰੇ ਜੋ ਸਨਮੁਖਾਂ ਦਾ ਸਾਂਗ ਬਣਾ ਫਿਰਦੇ ਹਨ ਸਿਾਣੇ ਜਾਂਦੇ ਹਨ।"