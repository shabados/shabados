[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਜੈ ਭਾਇ; ਬਹੁਤੁ ਘਰ ਗਾਲੇ ॥"
page = 1160
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The love of other has destroyed many homes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੋਰਸ ਦੇ ਪਿਆਰ ਨੇ ਅਨੇਕਾਂ ਘਰਾਂ ਨੂੰ ਤਬਾਹ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The love of duality has ruined countless homes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦ੍ਵੈਤ ਭਾਵ ਨੇ ਬਹੁਤ ਹੀ ਘਰ ਗਾਲੇ ਹੈਂ, ਭਾਵ ਜਨਮ ਮਰਨ ਕੋ ਪ੍ਰਾਪਤ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਨੂੰ ਛੱਡ ਕੇ ਹੋਰ ਹੋਰ ਵਿਚ ਪਿਆਰ ਪਾ ਕੇ ਬਥੇਰੇ ਜੀਵ ਤਬਾਹ ਹੋ ਗਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਜੈ ਭਾਇ = ਪ੍ਰਭੂ ਨੂੰ ਛੱਡ ਕੇ ਕਿਸੇ ਹੋਰ ਦੇ ਪਿਆਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ha destruido millones de hogares,"