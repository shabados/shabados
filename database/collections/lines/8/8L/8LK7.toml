[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਗੈ ਪਾਛੈ ਕੁਸਲੁ ਭਇਆ ॥"
page = 829
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Both here and hereafter, there is bliss for me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲੋਕ ਤੇ ਪ੍ਰਲੋਕ ਦੋਨਾਂ ਵਿੱਚ ਮੇਰੇ ਲਈ ਖੁਸ਼ੀ ਹੀ ਖੁਸ਼ੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Here, and hereafter, there is happiness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਗੇ ਪੀਛੇ, ਭੂਤ ਭਵਿਖਤ ਵਾ ਲੋਕ ਪਰਲੋਕ ਕਾ ਹਮ ਕੋ ਸਰਬ ਪ੍ਰਕਾਰ (ਕੁਸਲੁ) ਅਨੰਦ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਸ ਮਨੁੱਖ ਵਾਸਤੇ ਇਸ ਲੋਕ ਵਿਚ ਅਤੇ ਪਰਲੋਕ ਵਿਚ ਸੁਖ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਗੈ = ਪਰਲੋਕ ਵਿਚ। ਪਾਛੈ = ਇਸ ਲੋਕ ਵਿਚ। ਕੁਸਲੁ = ਸੁਖ। ਭਇਆ = ਹੋ ਗਿਆ, ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Hay Bondad aquí y allá,"