type = "primary"
data = "ਇਸੋ ਖੇਲ ਭਾਵੈ ॥੨੬੨॥"
page = 656

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She was playing with it and she loved it so much that she drank water and continued to play with it.262."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਇਸੇ (ਗੁੱਡੀ ਦੀ) ਖੇਡ (ਉਸ ਨੂੰ) ਚੰਗੀ ਲਗਦੀ ਹੈ ॥੨੬੨॥"