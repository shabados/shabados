data = "ਤੁਮ ਮੋ ਪਤਿ ਰੁਕਮਿਨਿ ਕੇ ਜਾਏ ॥"
page = 499

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then Mainvati said this, “You are the son of Rukmani and also my husband"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੁਸੀਂ) ਰੁਕਮਨੀ ਦੇ ਪੁੱਤਰ ਅਤੇ ਮੇਰੇ ਪਤੀ ਹੋ।"