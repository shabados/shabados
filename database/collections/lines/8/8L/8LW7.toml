[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦੂਤਾ ਨੋ ਫੁਰਮਾਇਆ; ਨੰਗੀ ਕਰਹੁ ਪੰਚਾਲੀ ਬਾਂਦੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He commanded his men to strip the maidservant Dropati stark naked."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਦਰਯੋਧਨ ਨੇ) ਦੂਤਾਂ ਨੂੰ ਕਿਹਾ ਇਸ ਪੰਜਾਬਣ ਨੂੰ ਨੰਗੀ ਕਰੋ।"