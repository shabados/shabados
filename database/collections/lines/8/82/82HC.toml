[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਹਰ ਪਾਸੇ ਤੇਰਾ ਦਰਸ਼ਨ ਕਰਣ ਲਈ ਮੈਂ ਦੇਖਦਾ ਹਾਂ ਪਰ ਮੇਰੀ ਮੁਰਾਦ ਪੂਰੀ ਨਹੀਂ ਹੁੰਦੀ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਦਰ ਹਰ ਤਰਫ਼ ਬੀਨਮ, ਚੂੰ ਰੁਖ਼ਿ ਤੁਰਾ ਮੁਦਾਮ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, it is only the heart of a knowledgeable person who is familiar with His mysteries. (260)"