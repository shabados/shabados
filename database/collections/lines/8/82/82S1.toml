[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਕਣ. ਖਲਹਾਨੁ; ਜੈਸੇ ਗਾਹਨ. ਪਾਇਆ ॥"
page = 1137
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As none gains anything by threshing a crop without corn,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰਾਂ ਦਾਣਿਆਂ ਤੋਂ ਸੱਖਣੀ ਫਸਲ ਨੂੰ ਗਾਹੁਣ ਦੁਆਰਾ ਕਿਸੇ ਨੂੰ ਕੁਛ ਨਹੀਂ ਮਿਲਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It is like threshing a crop without any corn - nothing is gained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪ੍ਰਕਾਰ ਬਿਨਾਂ (ਕਣ) ਅਨਾਜ ਦੇ (ਖਲਹਾਨੁ) ਖਲਵਾੜੇ ਕੋ ਗਾਹਿਆ ਹੋਯਾ ਅੰਨ ਨਹੀਂ ਪਾਈਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਅੰਨ ਦੇ ਦਾਣਿਆਂ ਤੋਂ ਬਿਨਾ ਕੋਈ ਖਲਵਾੜਾ ਗਾਹਿਆ ਜਾਏ (ਉਸ ਵਿਚੋਂ ਦਾਣਿਆਂ ਦਾ ਬੋਹਲ ਨਹੀਂ ਬਣੇਗਾ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਣ = ਅੰਨ ਦੇ ਦਾਣੇ। ਖਲਹਾਨੁ = ਖਲਵਾੜਾ। ਗਾਹਨ ਪਾਇਆ = ਗਾਹਿਆ ਜਾਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Qué va uno a recolectar si no hay granos?"