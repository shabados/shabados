[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਦਾ ਦੇਖਿ; ਜੁ ਬਿਨਸਨਹਾਰਾ ॥"
page = 341
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Th--Whatever we see is perishable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦ-ਜੋ ਕੁਛ ਅਸੀਂ ਵੇਖਦੇ ਹਾਂ, ਨਾਸਵੰਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "DADDA: Whatever is seen shall perish."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦਦੇ ਅਖਰ ਦੁਆਰਾ ਕਹਤੇ ਹੈਂ: ਜੋ ਨਾਮ ਰੂਪ ਜਗਤ ਦੇਖੀਤਾ ਹੈ, ਸੋ ਬਿਨਸਨੇ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਇਹ ਸੰਸਾਰ (ਇਹਨਾਂ ਅੱਖਾਂ ਨਾਲ) ਦਿੱਸ ਰਿਹਾ ਹੈ, ਇਹ ਸਾਰਾ ਨਾਸਵੰਤ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਖਿ = {ਸੰ: ਦ੍ਰਿਸ਼੍ਯ} ਜੋ ਵੇਖਣ ਵਿਚ ਆ ਰਿਹਾ ਹੈ। ਜੁ = ਜੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Da dda Todo lo que vemos a nuestro alrededor es pasajero y no irá con nosotros;"