data = "ਜਹ ਤਹ ਸਾਧਨ ਹੋਇ ਸਹਾਈ ॥੩॥੨੨੨॥"
page = 117

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The mother of the universe ever helps the saints and is helpful to them everywhere.3.222."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜਿਥੇ ਕਿਥੇ ਉਨ੍ਹਾਂ ਦੀ ਸਹਾਇਕ ਹੁੰਦੀ ਹੈ ॥੩॥੨੨੨॥"