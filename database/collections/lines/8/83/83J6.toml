[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਸਕਲ ਸ੍ਰੀ ਪਾਸਿ ਕੇ; ਚੀਨ ਚਤੁਰ ਚਿਤਿ ਲੇਹੁ ॥੪੦੫॥"
page = 735

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Shatru” primarily and then adding the word “Antak”, O wise men! the names of Paash are formed.405."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਸਾਰੇ ਨਾਮ ਪਾਸ ਦੇ ਹਨ। ਵਿਦਵਾਨ ਲੋਗ ਮਨ ਵਿਚ ਵਿਚਾਰ ਲੈਣ ॥੪੦੫॥"