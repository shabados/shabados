type = "primary"
data = "ਦੋਊ ਚਿਤ੍ਰ ਜੋਤੀ ਦੋਊ ਚਿਤ੍ਰ ਚਾਪੰ ॥"
page = 147

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Both were marvelously beautiful carrying beautiful bows."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਵੇਂ ਜੋਤਿ ਦੇ ਚਿਤਰ ਸਨ ਅਤੇ ਦੋਵੇਂ ਧਨੁਸ਼ ਦੀ ਮੂਰਤ ਸਨ।"