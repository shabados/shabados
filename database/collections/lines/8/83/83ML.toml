[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚਾ ਠਾਕੁਰੁ ਤ੍ਰਿਭਵਣਿ; ਮੇਰਾ ॥"
page = 109
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Lord of the three worlds is mine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਿੰਨਾਂ ਜਹਾਨਾਂ ਦਾ ਸੱਚਾ ਸੁਆਮੀ ਮੇਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Lord and Master of the three worlds is mine."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਚੇ ਤ੍ਰਿਲੋਕੀ ਕੇ ਮਾਲਕ! ਮੇਰਾ ਤੋ ਤੂੰ ਹੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਸਦਾ ਵਾਸਤੇ ਪਾਲਣ ਵਾਲਾ ਸਿਰਫ਼ ਉਹੀ (ਪ੍ਰਭੂ) ਹੈ, ਜੋ ਤਿੰਨਾਂ ਭਵਨਾਂ ਵਿਚ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਕੁਰੁ = ਪਾਲਣ ਵਾਲਾ ਪ੍ਰਭੂ। ਤ੍ਰਿਭਵਣਿ = ਤਿੰਨਾਂ ਭਵਨਾਂ ਵਿਚ ਵਿਆਪਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pertenezco al Maestro Verdadero de los tres mundos."