[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਤਿਤ. ਪੁਨੀਤ ਕਰਿ ਲੀਨੇ ॥"
page = 623
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Me, the sinner, the Lord has rendered pure."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਪਾਪੀ ਨੂੰ, ਪ੍ਰਭੂ ਨੇ ਪਵਿੱਤ੍ਰ ਬਣਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sinner, but the Lord made me pure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਸੇ ਹਮ ਪਾਪੀ ਪਵਿਤ੍ਰ ਕਰ ਲੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨ ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗੇ ਹੋਇਆਂ ਨੂੰ (ਭੀ) ਪਵਿਤ੍ਰ ਜੀਵਨ ਵਾਲਾ ਬਣਾ ਲੈਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿਤ = ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗੇ ਹੋਏ। ਪੁਨੀਤ = ਪਵਿਤ੍ਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor nos ha purificado;"