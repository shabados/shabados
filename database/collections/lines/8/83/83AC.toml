type = "primary"
data = "ਧਰਮ ਕਰਮ ਤਜਿ ਕਰ ਹਰਿ ਜਾਪਨ ॥"
page = 559

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Here and there all will leave the religious injunctions and the remembrance of the Name of the Lord and perform the sinful acts"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਧਰਮ ਕਰਮ ਅਤੇ ਹਰਿ (ਦੇ ਨਾਮ) ਦਾ ਜਾਪ ਛਡ ਕੇ"