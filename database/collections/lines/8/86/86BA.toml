[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖ ਮਾਇਆ ਮੋਹੁ ਹੈ; ਨਾਮਿ. ਨ ਲਗੋ ਪਿਆਰੁ ॥"
page = 552
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "An apostate loves wealth and enshrines not affection for the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਧਰਮੀ ਧਨ-ਦੌਲਤ ਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹੈ। ਉਹ ਨਾਮ ਨਾਲ ਪ੍ਰੀਤ ਨਹੀਂ ਪਾਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The self-willed manmukh is emotionally attached to Maya - he has no love for the Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ ਕਾ ਮਾਯਾ ਮੇਂ ਮੋਹੁ ਹੈ ਇਸੀ ਤੇ ਤਿਸ ਕਾ ਨਾਮ ਮੇਂ ਪ੍ਯਾਰ ਨਹੀਂ ਲਗਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ ਦਾ ਮਾਇਆ ਵਿਚ ਮੋਹ ਹੈ (ਇਸ ਕਰ ਕੇ) ਨਾਮ ਵਿਚ ਉਸਦਾ ਪਿਆਰ ਨਹੀਂ ਬਣਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਮੁਖ = ਮਨ ਦਾ ਮੁਰੀਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El voluntarioso Manmukj ama la Maya, y no tiene Amor por el Naam."