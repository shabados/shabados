[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸਾ ਧਨੁ ਦੀਆ ਸੁਖਦਾਤੈ; ਨਿਖੁਟਿ. ਨ ਕਬ ਹੀ ਜਾਈ ॥"
page = 608
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thee Bestower of peace confers such wealth, as is never exhausted."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੁਸ਼ੀ ਬਖਸ਼ਣਹਾਰ ਐਹੋ ਜੇਹੀ ਦੌਲਤ ਦਿੰਦਾ ਹੈ, ਜੋ ਕਦੇ ਭੀ ਮੁੱਕਦੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord, the Giver of peace, bestows such wealth, that it can never be exhausted."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਖਦਾਤੇ ਵਾਹਗੁਰੂ! ਤੈਨੇ ਐਸਾ ਤਿਸ ਕੋ ਨਾਮ ਧਨ ਦੀਆ ਹੈ ਵਹੁ ਕਬੀ ਨਿਖੁਟ ਨਹੀਂ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੁਖਦਾਤੇ ਪ੍ਰਭੂ ਨੇ ਉਸ ਨੂੰ ਅਜੇਹਾ (ਨਾਮ-) ਧਨ ਦੇ ਦਿੱਤਾ ਹੈ ਜੋ (ਉਸ ਪਾਸੋਂ) ਕਦੇ ਭੀ ਨਹੀਂ ਮੁੱਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਖਦਾਤੈ = ਸੁਖ ਦੇਣ ਵਾਲੇ (ਪ੍ਰਭੂ) ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues tal es la Bienaventuranza del Señor que nunca se acaba."