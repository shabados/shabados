[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜੀਉ; ਤੇਰੀ ਸਦਾ ਸਰਣਾਈ ॥"
page = 111
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My venerable God! I ever see the asylum."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਪੂਜਯ ਵਾਹਿਗੁਰੂ! ਮੈਂ ਹਮੇਸ਼ਾਂ ਤੇਰੀ ਸ਼ਰਣਾਗਤ ਸੰਭਾਲਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Dear Lord, I seek Your Sanctuary forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਜੋ ਸਦਾ ਤੇਰੀ ਸਰਣ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਜੀ! ਮੈਂ ਤੇਰਾ ਸਦਾ ਹੀ ਆਸਰਾ ਤੱਕਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ ਜੀਉ = ਹੇ ਪ੍ਰਭੂ ਜੀ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Amado Señor, busco Tu Santuario;"