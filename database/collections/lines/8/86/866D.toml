[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਅਤੇ, ਰੂਹਾਨੀ ਸੰਸਾਰ ਦੇ ਸਾਰੇ ਫਰਿਸ਼ਤੇ ਵੀ ਉਸ ਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦੇ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਹਮਾ ਲਾਹੂਤੀਆਂ ਬਪਾਇ ਊ ॥੧੮॥"
page = 1
line = 18

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, even all the angels of the spiritual world are also prepared to follow suit. (18)"