data = "ਰੋਇ ਪੀਟ ਕਰਿ ਕਰਤ ਪੁਕਾਰਾ ॥"
page = 858

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "As the Shah did not know the date of min ting, he closed his eye and kept his mouth shut."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰੋ ਪਿਟ ਕੇ ਪੁਕਾਰਨ ਲਗਾ"