[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਠਾਕੁਰ ਕਾ ਸੇਵਕੁ; ਸਦਾ ਪੂਜਾਰੀ ॥"
page = 285
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lord's slave is ever an adorer of His."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਦਾ ਗੋਲਾ ਸਦੀਵ ਹੀ ਉਸ ਦਾ ਉਪਾਸ਼ਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The servant worships his Lord and Master forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਠਾਕਰ ਕਾ ਸੇਵਕ ਸਦਾ (ਪੂਜਾਰੀ) ਪੂਜਨੇ ਵਾਲਾ, ਵਾ ਪੂਜਨੇ ਯੋਗ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਸਦਾ ਉਸ ਦੀ ਪੂਜਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਜਾਰੀ = ਪੂਜਾ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y permanentemente Lo alaba."