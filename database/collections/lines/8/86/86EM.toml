[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨੈਨਨ ਸਾਥ ਲਗੈ, ਸੋਊ ਨੇਹੁ; ਕਹੈ ਮੁਖ ਤੇ ਇਹ ਸਾਵਲ ਗੋਰੀ ॥"
page = 318

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The love that is created on seeing with eyes is the actual love.”"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਾਲੀਆਂ ਅਤੇ ਗੋਰੀਆਂ (ਗੋਪੀਆਂ ਨੇ) ਮੂੰਹੋਂ ਇਹ ਆਖਿਆ ਕਿ ਉਹ ਨੇਹੁੰ ਤਾਂ ਅੱਖਾਂ ਰਾਹੀਂ ਲਗਦਾ ਹੈ।\""