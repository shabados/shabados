[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੀ ਵਡਿਆਈ ਗੁਰ ਤੇ ਪਾਈ; ਸਚੁ ਸਵਾਰਣਹਾਰਾ ॥"
page = 569
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru, true glory is attained and one is embellished with Truth"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਸੱਚੀ ਪ੍ਰਭਤਾ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ ਅਤੇ ਇਨਸਾਨ ਸੱਚ ਨਾਲ ਸ਼ਿੰਗਾਰਿਆਂ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Guru, true greatness is obtained, and one is embellished with Truth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੀ ਸਚੀ ਬਡਿਆਈ ਨਿਸਚੇ ਕਰ ਸਵਾਰਨੇ ਹਾਰਾ ਜੋ ਗੁਰੂ ਹੈ ਤਿਸ ਸੇ ਪਾਈ ਹੈ, ਵਾ ਜਿਸ ਨੇ ਗੁਰੋਂ ਤੇ ਸਚੀ ਵਡਿਆਈ ਪਾਈ ਹੈ, ਸੋ ਸਚੁ ਨਾਮ ਦੇ ਕਰ ਔਰੋਂ ਕੋ ਸਵਾਰਨੇ ਵਾਲਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਸਚੀ ਇੱਜ਼ਤ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ ਤੇ ਜੀਵਨ ਸੋਹਣਾ ਬਣਾਣ ਵਾਲੇ ਪ੍ਰਭੂ ਨੂੰ ਮਿਲਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੀ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੀ। ਤੇ = ਤੋਂ। ਸਚੁ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno obtiene Gloria a través del Guru y es embellecido con la Verdad del Señor. Dejando el ego, uno obtiene a Dios,"