[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਹ ਭੀਗੈ; ਅਧਿਕ ਸੂਕਾਇਆ ॥੨॥"
page = 1136
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "even then it is wetted not and remains extremely dry."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਭੀ ਇਹ ਗਿੱਲਾ ਨਹੀਂ ਹੁੰਦਾ ਅਤੇ ਨਿਹਾਇਤ ਸੁੱਕਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Even so, they do not absorb the water; they remain hard and dry. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਅੰਤਰ ਸੇ ਭੀਗਤਾ ਨਹੀਂ ਅਧਿਕਤਾ ਕਰ ਕੇ ਜਲ ਮੇਂ ਸੇ ਸੁਕਾ ਹੂਆ ਹੀ ਆਵਤਾ ਹੈ, ਭਾਵ ਸਾਕਤ ਸਤਿਸੰਗ ਵਿਖੇ ਰਹਿ ਕੇ ਭੀ ਕਠੋਰ ਹੀ ਰਹਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅੰਦਰੋਂ ਉਹ) ਬਿਲਕੁਲ ਸੁੱਕਾ ਹੀ ਰਹਿੰਦਾ ਹੈ (ਇਹੀ ਹਾਲ ਹੈ ਸਾਕਤ ਦਾ) ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੀਗੈ = ਭਿੱਜਦਾ। ਅਧਿਕ = ਬਹੁਤ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "permaneciendo tan seca como siempre. (2)"