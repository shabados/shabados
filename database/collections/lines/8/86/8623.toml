[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਦੋਹਾਂ ਜਹਾਨਾਂ ਵਿਚ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਦੇ ਬਰਾਬਰ ਦਾ ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਦਰ ਦੋ ਆਲਮ ਤਾਕ ਗੁਰ ਗੋਬਿੰਦ ਸਿੰਘ ॥੧੧੭॥"
page = 10
line = 117

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, there is no rival to Guru Gobind Singh in the two worlds. (117)"