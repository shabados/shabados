[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੇ ਨਰ; ਐਸੀ ਕਰਹਿ ਇਆਨਥ ॥"
page = 1001
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such silliness practise thou, O man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਹੋ ਜੇਹੀ ਬੇਵਕੂਫੀ ਤੂੰ ਕਰਦਾ ਹੈਂ, ਹੇ ਬੰਦੇ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O man, such is the foolishness you practice."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੁਰਸ! ਤੂੰ ਐਸੀ ਇਆਨਪੁਨੇ ਕੀ ਬਾਤ ਕਰਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨੁੱਖ! ਤੂੰ ਬੜੀ ਮਾੜੀ ਬੇ-ਅਕਲੀ ਕਰ ਰਿਹਾ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇ ਨਰ = ਹੇ ਮਨੁੱਖ! ਕਰਹਿ = ਤੂੰ ਕਰਦਾ ਹੈਂ। ਇਆਨਥ = ਬੇ-ਅਕਲੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hombre, ¿por qué quieres permanecer en tal ignorancia? ¿Por qué abandonas al Maestro de la Tierra, al vivir en el apego y dejándote confundir por el engaño?"