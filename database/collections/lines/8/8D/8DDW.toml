[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਸਤਿਗੁਰ ਚਰਨੀ ਲਾਗਿ ॥"
page = 1304
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and repair to the feet of the Great True Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਵਿਸ਼ਾਲ ਸੱਚੇ ਗੁਰਾਂ ਦੇ ਪੈਰੀ ਪਊ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Grasp the Feet of the Guru, the True Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਗੁਰ) ਪੂਜ ਜੋ ਸਤਿਗੁਰੂ ਹੈਂ ਤਿਨ ਕੇ ਚਰਣੀ ਲਾਗਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਸਤਿਗੁਰੂ ਦੀ ਚਰਨੀਂ ਲੱਗ ਕੇ (ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਕਰੋ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਾਗਿ = ਲੱਗ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aférrate a los Pies del Guru, del Verdadero Guru."