[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਰੀ ਨ ਪ︀ਯਾਰੀ ਹਾਥ ਮੈ ਮਛਹਿ ਲਗਿਯੋ ਨ ਬਾਨ ॥"
page = 1008

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Neither they could hit the fish nor they achieved the beloved."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੱਛ ਨੂੰ ਬਾਣ ਨਾ ਲਗਿਆ ਅਤੇ ਉਹ ਪਿਆਰੀ (ਦ੍ਰੋਪਤੀ) ਹੱਥ ਨਾ ਲਗੀ।"