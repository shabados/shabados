data = "ਸੈਹਥੀ ਦਾ ਵਾਰ ਸਹਿ ਕੇ ਅਤੇ ਅੱਗ ਵਿਚ ਸੜ ਕੇ (ਰਾਜੇ ਨੇ) ਦੋਹਾਂ ਨੂੰ ਬਚਾ ਲਿਆ।"