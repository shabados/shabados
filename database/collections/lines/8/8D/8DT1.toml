[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਇਆ ਬਿਗੂਤੀ; ਬਹੁ ਬਿਧਿ ਭਾਤੀ ॥"
page = 329
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The body is destroyed in various ways and manners."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਤ ਨੂੰ ਸਰੀਰ ਅਨੇਕਾਂ ਢੰਗ ਅਤੇ ਤਰੀਕਿਆਂ ਨਾਲ ਖਤਮ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The body is destroyed by so many ways and means."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਕਾਇਆ) ਦੇਹਾਂ ਬਹੁਤੀ ਪ੍ਰਕਾਰੋਂ ਕੀਆਂ ਹੈ ਔਰ ਬਹੁਤ ਹੀ ਪ੍ਰਕਾਰੋਂ ਸੇ (ਬਿਗੂਤੀ) ਖਰਾਬੁ ਹੋਤੀਆਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਰਨ ਪਿਛੋਂ) ਇਹ ਸਰੀਰ ਕਈ ਤਰ੍ਹਾਂ ਖ਼ਰਾਬ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਗੂਤੀ = ਖ਼ਰਾਬ ਹੁੰਦੀ ਹੈ। ਬਹੁ ਬਿਧਿ ਭਾਤੀ = ਬਹੁ ਬਿਧਿ ਭਾਤੀ, ਕਈ ਤਰ੍ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El cuerpo después de la muerte es desechado de muchas formas,"