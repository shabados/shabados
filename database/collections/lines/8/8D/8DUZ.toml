[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਖੁ ਪਿਤਾ ਪ੍ਰਭ ਮੇਰੇ ॥"
page = 205
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Save me, O my father Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਰਖਿਆ ਕਰ ਹੈ ਮੇਰੇ ਬਾਬਲ ਪਰਮੇਸ਼ਰ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Save me, O My Father God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪਿਤਾ ਪ੍ਰਭੂ! ਰਾਖ ਲੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਿੱਤਰ ਪ੍ਰਭੂ! ਮੈਨੂੰ ਗੁਣ-ਹੀਨ ਨੂੰ ਬਚਾ ਲੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sálvame, oh mi Padre;"