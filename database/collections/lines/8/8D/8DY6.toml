[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਗੈ ਪਾਛੈ; ਹੁਕਮਿ ਸਮਾਇ ॥੨॥"
page = 151
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Before and after this birth, as well, the mortal remain absorbed in His fiat."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਜਨਮ ਦੇ ਅਗਾੜੀ ਤੇ ਪਿਛਾੜੀ ਭੀ ਪ੍ਰਾਣੀ ਉਸ ਦੇ ਫੁਰਮਾਨ ਅੰਦਰ ਲੀਨ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Before and after, His Command is pervading. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਗੇ ਪੀਛੈ ਅਰ ਮਧ ਅਰਥਾਤ ਤੀਨ ਕਾਲ ਮੇਂ ਤੇਰੇ ਹੁਕਮ ਮੇਂ ਹੀ ਸਮਾਇ ਰਹਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਲੋਕ ਪਰਲੋਕ ਵਿਚ ਜੀਵ ਨੂੰ ਉਸ ਦੇ ਹੁਕਮ ਵਿਚ ਟਿਕੇ ਰਹਿਣਾ ਪੈਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਗੈ ਪਾਛੈ = ਲੋਕ ਪਰਲੋਕ ਵਿਚ। ਸਮਾਇ = ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ, ਟਿਕਿਆ ਰਹਿਣਾ ਪੈਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En todos los tiempos su voluntad prevalece. (2)"