type = "primary"
data = "ਤਬ ਹੋਇ ਪੂਰਣ ਕਾਮ ॥੪੭੮॥"
page = 673

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When service will be rendered to him and His Name will be remembered, then all the desires will be fulfilled.478."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਸਾਰੀਆਂ ਕਾਮਨਾਵਾਂ ਪੂਰੀਆਂ ਹੋਣਗੀਆਂ ॥੪੭੮॥"