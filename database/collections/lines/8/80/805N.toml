type = "primary"
data = "ਸਿੱਖ ਉਬਾਰਿ ਅਸਿੱਖ ਸੰਘਰੋ ॥"
page = 1387

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Protect my disciples and destroy my enemies"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੁਸੀਂ) ਸਿੱਖਾਂ ਨੂੰ ਬਚਾਓ ਅਤੇ ਅਸਿੱਖਾਂ ਨੂੰ ਨਸ਼ਟ ਕਰੋ।"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਸਿੱਖ੍ਯ ਉਬਾਰਿ; ਅਸਿੱਖ੍ਯ ਸੰਘਰੋ ॥"