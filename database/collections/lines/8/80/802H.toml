[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਲਤ ਚਲਤ ਸਸੁਰਾਰਿ ਕੌ ਗਾਵ ਪਹੂੰਚ︀ਯੋ ਆਇ ॥"
page = 892

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Walking and walking they reached the village of the in-laws."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੁਰਦੇ ਤੁਰਦੇ ਉਹ ਸੌਹਰੇ ਪਿੰਡ ਆ ਪਹੁੰਚੇ।"