[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕਾ ਦਰਸਨੁ; ਦੇਖਿ ਨਿਹਾਲ ॥"
page = 864
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Seeing the Guru's vision, I am ecstasied."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦਾ ਦੀਦਾਰ ਵੇਖ ਕੇ, ਮੈਂ ਪ੍ਰਸੰਨ ਹੋ ਗਿਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Gazing upon the Blessed Vision of the Guru's Darshan, I am exalted."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕਾ ਦਰਸਨ ਦੇਖ ਕੇ ਨਿਹਾਲ ਹੋਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਗੁਰੂ ਦਾ ਦਰਸ਼ਨ ਕਰ ਕੇ (ਮਨੁੱਖ ਦਾ ਤਨ ਮਨ) ਖਿੜ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਖਿ = ਵੇਖ ਕੇ। ਨਿਹਾਲ = ਪ੍ਰਸੰਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Teniendo la Visión del Guru uno es bendecido;"