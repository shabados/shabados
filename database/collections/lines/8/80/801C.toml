[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਬੀਰ. ਮਹਿਦੀ ਕਰਿ ਕੈ ਘਾਲਿਆ; ਆਪੁ ਪੀਸਾਇ ਪੀਸਾਇ ॥"
page = 947
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Kabir, grinding, grinding, I have made myself into the henna paste."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਪੀਹ, ਪੀਹ ਕੇ, ਮੈਂ ਆਪਣੇ ਆਪ ਨੂੰ ਮਹਿੰਦੀ ਦੀ ਲੇਵੀ ਬਣਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Kabeer, I have ground myself into henna paste."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਸਾਹਿਬ ਜੀ ਕਹਤੇ ਹੈਂ: ਪੁਰਸ ਨੇ ਅਪਨੇ ਸਰੀਰ ਕੋ ਮਹਿੰਦੀ ਕਰ ਪਾਯਾ, ਭਾਵ ਅਤੀ ਕਠਨ ਸਾਧਨ ਕਰ ਕੇ ਦੁਖ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਬੀਰ! ਮੈਂ ਆਪਣੇ ਆਪ ਨੂੰ ਮਹਿਦੀ ਬਣਾ ਕੇ (ਭਾਵ, ਮਹਿਦੀ ਵਾਂਗ) ਪੀਹ ਪੀਹ ਕੇ ਘਾਲ ਕਮਾਈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੁ = ਆਪਣੇ ਆਪ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, he molido mi ser y me convertí en pasta de tinte de Jenna."