type = "primary"
data = "ਲੈ ਬਰਮਾਕ੍ਰਿਤ ਵਾ ਬਧ ਕੈ; ਮਨਿ ਆਪਨੇ ਧਾਮ ਕੀ ਓਰਿ ਸਿਧਾਰਿਯੋ ॥੨੦੬੭॥"
page = 504

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After killing him Kratvarma went to his home.2067."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਮਾਰ ਕੇ ਅਤੇ ਮਣੀ ਲੈ ਕੇ ਬਰਮਾਕ੍ਰਿਤ ਆਪਣੇ ਘਰ ਵਲ ਚਲਾ ਗਿਆ ॥੨੦੬੭॥"