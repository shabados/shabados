[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਖੇਤੈ ਅੰਦਰਿ ਜੰਮਿ ਕੈ; ਸਭ ਦੂੰ ਉੱਚਾ ਹੋਇ ਵਿਖਾਲੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Sesame plant growing in the field seems to be taller than all."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੈਲੀ ਵਿਖੇ ਜੰਮਕੇ ਸਾਰਿਆਂ (ਬੂਟਿਆਂ ਨਾਲੋਂ) ਉਤਕ੍ਰਿਸ਼ਟ ਹੋਕੇ ਦੱਸਦਾ ਹੈ।"