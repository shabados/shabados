data = "ਸਾਡੇ ਪੂਰੇ ਸਤਿਗੁਰੂ ਬੰਦਗੀ ਕਰਣ ਵਾਸਤੇ ਹੁਕਮ ਦਿੰਦੇ ਹਨ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਮੁਰਸ਼ਦਿ ਕਾਮਿਲਿ ਮਾ ਬੰਦਗੀਅਤ ਫ਼ਰਮਾਇਦਾ ॥"

[[content]]
assets = ["KEGP"]
