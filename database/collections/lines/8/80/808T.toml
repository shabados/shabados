data = "ਅਪਨੇ ਕਰਤਬ; ਜਾਨੈ ਆਪਿ ॥"
page = 292
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His affairs He Himself knows."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਕੰਮ ਉਹ ਆਪੇ ਹੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself knows His own ways."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਅਪਨੇ ਗੁਣੋਂ ਕੋ ਆਪ ਹੀ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪਣੇ ਖੇਲ ਆਪ ਜਾਣਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo Él sabe lo que hace,"