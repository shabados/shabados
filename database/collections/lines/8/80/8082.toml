[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਕੈ ਬਜਾਇਬੇ ਕੌ ਸੁਨ ਕੈ; ਮਤਿ ਗ੍ਵਾਰਿਨ ਕੀ ਤਿਹ ਬੀਚ ਫਸੀ ਹੈ ॥੬੪੧॥"
page = 358

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The body of Krishna is like gold and the Glory of the face is like that of the moon, listening to the tune of the flute, the mind of the gopis has only remained entangled teherein.641."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਵਜਾਈ ਹੋਈ (ਬੰਸਰੀ ਨੂੰ) ਸੁਣ ਕੇ ਗੋਪੀਆਂ ਦੀ ਬੁੱਧੀ ਉਸ ਵਿਚ ਫਸ ਗਈ ਹੈ ॥੬੪੧॥"