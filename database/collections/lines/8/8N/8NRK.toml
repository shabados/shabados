[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਤ ਨਾਨਕ; ਜਨੁ ਜਾਗੈ ਸੋਇ ॥"
page = 1128
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, that man alone remains awake,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਫੁਰਮਾਉਂਦੇ ਹਨ, ਕੇਵਲ ਉਹ ਪੁਰਸ਼ ਹੀ ਖਬਰਦਾਰ ਰਹਿੰਦੇ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, that humble being remains awake and aware,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਸੋਈ ਦਾਸ ਜਾਗਤਾ ਹੈ॥☬ਸੋ ਕੌਣ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ ਕਿ ਉਹ ਮਨੁੱਖ ਮਾਇਆ ਦੇ ਮੋਹ ਦੀ ਨੀਂਦ ਤੋਂ ਜਾਗਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨੁ ਸੋਇ = ਉਹੀ ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, sólo está despierto"