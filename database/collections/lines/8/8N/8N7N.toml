[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮ ਤੁਲਿ; ਕਛੁ ਅਵਰੁ. ਨ ਹੋਇ ॥"
page = 265
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is nothing equal to God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦੇ ਬਰਾਬਰ ਕੋਈ ਸ਼ੈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is nothing equal to the Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਨਾਮ ਜਾਪ ਕੇ ਤੁਲ ਕੁਛ ਔਰ ਕਰਮ ਨਹੀਂ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ-ਨਾਮ ਦੇ ਬਰਾਬਰ ਹੋਰ ਕੋਈ (ਪਦਾਰਥ) ਨਹੀਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਮ ਤੁਲਿ = ਨਾਮ ਦੇ ਬਰਾਬਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De entre incontables personas,"