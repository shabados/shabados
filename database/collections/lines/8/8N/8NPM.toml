[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੀ ਕੀਰਤਿ; ਜਪੀਐ ਹਰਿ ਨਾਉ ॥"
page = 897
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This is the Guru's praise, that man utters the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਹੀ ਹੈ ਗੁਰਾਂ ਦੀ ਉਸਤਤੀ ਕਿ ਇਨਸਾਨ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is the Guru's Praise, to chant the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਜਸ ਕਰਨੇ ਸੇ ਹਰੀ ਨਾਮ ਜਪੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਦਾ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪਣਾ ਚਾਹੀਦਾ ਹੈ-ਇਹੀ ਹੈ ਗੁਰੂ ਦੀ ਸੋਭਾ (ਕਰਨੀ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀਰਤਿ = ਸੋਭਾ। ਜਪੀਐ = ਜਪਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ésta, en verdad, es la Oración del Guru: Contempla el Nombre del Señor;"