[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੀਵਤ; ਅਮਰ ਭਏ ਨਿਹਕਾਮ ॥"
page = 887
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Partaking of it, one becomes immortal and desireless."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਨੂੰ ਪੀਣ ਨਾਲ ਬੰਦਾ ਅਬਿਨਾਸੀ ਅਤੇ ਇੱਛਾ ਰਹਿਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Drinking it in, one becomes immortal and free of desire."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਨਿਸਕਾਮ ਹੋਇਕੇ ਨਾਮ ਅੰਮ੍ਰਿਤ ਕੋ ਪੀਆ ਹੈ, ਸੋ ਅਮਰ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨਾਮ-ਅੰਮ੍ਰਿਤ ਨੂੰ ਪੀਂਦਿਆਂ ਹੀ ਮਨੁੱਖ ਅਟੱਲ ਆਤਮਕ ਜੀਵਨ ਵਾਲੇ ਅਤੇ ਵਾਸਨਾ-ਰਹਿਤ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਮਰ = ਅ-ਮਰ, ਜਿਸ ਉਤੇ ਆਤਮਕ ਮੌਤ ਆਪਣਾ ਜ਼ੋਰ ਨ ਪਾ ਸਕੇ। ਨਿਹਕਾਮ = ਵਾਸਨਾ-ਰਹਿਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien La saborea, se vuelve Inmortal y sin deseos,"