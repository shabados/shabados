[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸਾ ਨਾਮੁ ਰਤਨੁ ਨਿਰਮੋਲਕੁ; ਪੁੰਨਿ ਪਦਾਰਥੁ ਪਾਇਆ ॥"
page = 659
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such a Name, an invaluable jewel and he sublime wealth, I have attained through meritorious deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਣਮੁੱਲਾ ਹੀਰਾ ਅਤੇ ਸ੍ਰੇਸ਼ਟ ਦੋਲਤ ਐਹੋ ਜੇਹੇ ਨਾਮ ਨੂੰ ਮੈਂ ਨੇਕ ਅਮਲਾਂ ਦੇ ਰਾਹੀਂ ਪ੍ਰਾਪਤ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such is the Naam, the Name of the Lord, the invaluable jewel, the most sublime wealth, which I have found through good deeds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸਾ ਜੋ ਨਾਮ ਰੂਪੀ ਰਤਨ ਅਮੋਲਕ ਪਦਾਰਥੁ ਹੈ, ਸੋ ਪੂਰਬਲੇ ਪੁੰਨੋਂ ਕਰ ਕੇ ਮੈਨੇ ਸਤਿਗੁਰੋਂ ਸੇ ਪਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਇਕ ਐਸਾ ਅਮੋਲਕ ਪਦਾਰਥ ਹੈ ਜੋ ਭਾਗਾਂ ਨਾਲ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਮੋਲਕੁ = ਜਿਸ ਦਾ ਮੁੱਲ ਨਹੀਂ ਪੈ ਸਕਦਾ, ਜੋ ਕਿਸੇ ਮੁੱਲ ਨਹੀਂ ਮਿਲ ਸਕਦਾ। ਪੁੰਨਿ = ਪੁੰਨ ਨਾਲ, ਭਾਗਾਂ ਨਾਲ। ਪਾਇਆ = ਪਾਈਦਾ ਹੈ, ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal es la joya preciosa del Nombre del Señor que he obtenido por mis acciones pasadas."