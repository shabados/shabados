[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਸੋਭਾ ਕਉ; ਕਰਹਿ ਭਲੀ ਕਰਨੀ ॥"
page = 288
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The glory for which thou performest good acts,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪ੍ਰਭੂਤਾ ਲਈ ਤੂੰ ਚੰਗੇ ਕਰਮ ਕਮਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The glory, for which you perform good deeds"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸੋਭਾ ਹੋਣੇ ਕੌ ਤੂੰ ਜਪ ਤਪ ਆਦੀ ਭਲੀ ਕਰਨੀ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸੋਭਾ ਦੀ ਖ਼ਾਤਰ ਤੂੰ ਨੇਕ ਕਮਾਈ ਕਰਦਾ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਨੀ = ਕੰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las buenas acciones por las que esperas obtener la Gloria,"