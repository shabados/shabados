[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕਿਰਪਾ ਤੇ; ਮੁਗਧ ਮਨੁ ਮਾਨਿਆ ॥੩॥"
page = 864
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's grace, my foolish soul has been propitiated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਰਹਿਮਤ ਦੁਆਰਾ ਮੇਰੀ ਮੂਰਖ ਆਤਮਾ ਦੀ ਤਸੱਲੀ ਹੋ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By the Guru's Mercy, the foolish mind comes to believe. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਤੇ ਏਹ ਮੂਰਖ ਮਨ ਜੀਵ ਜਹਾਂ ਕਹਾਂ ਮਾਨਿਆ ਹੈ ਅਰਥਾਤ ਪ੍ਰਤਿਸਟਾ ਯੁਕਤ ਹੂਆ ਹੈ; ਵਾ ਮੁਗਧ ਕਾ ਮਨ ਕਰਤਾਰ ਮੇਂ ਮਾਨਿਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਮੂਰਖ ਮਨ ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ (ਪ੍ਰਭੂ-ਚਰਨਾਂ ਵਿਚ ਜੁੜਨਾ) ਗਿੱਝ ਜਾਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਗਧ = ਮੂਰਖ। ਮਾਨਿਆ = ਪਤੀਜ ਗਿਆ, ਗਿੱਝ ਗਿਆ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es por la Gracia del Guru que la mente ignorante ha llegado a creer. (3)"