data = "ਸੋ ਮਾਨੀਐ ਸਮ ਰੂਪ ॥"
page = 612

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Only that Lord should be adored consistently, who is beyond attachment, colours and form"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ (ਸਭ ਲਈ) ਸਮਾਨ ਰੂਪ ਵਿਚ ਮੰਨਣਾ ਚਾਹੀਦਾ ਹੈ।"