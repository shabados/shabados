[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਰਥਾ ਭਰਵਾਸਾ ਲੋਕ ॥"
page = 896
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Vain is the mainstay of man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਅਰਥ ਹੈ ਆਦਮੀ ਦਾ ਆਸਰਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Reliance on mortal man is useless."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਲੋਕੋਂ ਕਾ ਭਰਵਾਸਾ ਸਭ ਬਿਅਰਥ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਦੁਨੀਆ ਦੀ ਮਦਦ ਦੀ ਆਸ ਰੱਖਣੀ ਵਿਅਰਥ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਰਥਾ = {वृथा} ਬਿਅਰਥ। ਭਰਵਾਸਾ = ਭਰੋਸਾ, ਸਹਾਇਤਾ ਦੀ ਆਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hombre, el soporte que te da otro hombre es inútil,"