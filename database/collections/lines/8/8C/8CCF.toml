[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪੀਰ ਮੁਰੀਦਾਂ ਪਿਰਹੜੀ, ਗੁਣ ਗੁਣੀ ਪਰੋਵੈ ॥੧੨॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The love between the Sikhs and the Guru, brings the meritorious people closer and makes them one (sangat)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੀਰ ਅਤੇ ਮੁਰੀਦਾਂ ਦੀ ਪ੍ਰੀਤ ਐਸੀ ਹੈ ਜੋ ਗੁਣਾਂ ਨਾਲ ਪ੍ਰੋਕੇ ਗੁਣੀ ਬਣਾ ਲੈਂਦੀ ਹੈ।"