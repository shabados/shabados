[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਬ ਜਮ ਕੀ ਤ੍ਰਾਸ; ਕਹਹੁ ਕਿਸੁ ਹੋਇ ॥"
page = 291
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "say, who then did entertain the fear of death?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੰਸੋ ਓਦੋ ਮੌਤ ਦਾ ਡਰ ਕਿਸ ਨੂੰ ਵਾਪਰਦਾ ਸੀ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then who was afraid of death?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਜਮ ਕੀ ਤ੍ਰਾਸ ਕਹੋ ਤੌ ਕਿਸ ਕੌ ਹੋਵੈ ਅਰਥਾਤ ਨਹੀਂ ਹੋਤੀ ਥੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਦੱਸੋ, ਮੌਤ ਦਾ ਡਰ ਕਿਸ ਨੂੰ ਹੋ ਸਕਦਾ ਸੀ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤ੍ਰਾਸ = ਡਰ। ਜਮ = {Skt. यम} ਮੌਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿quién había que le temiera a la muerte o a la destrucción?"