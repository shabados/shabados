data = "ਪਸੁਨ ਕਰਾ ਜਮ ਧਾਮ ਪਯਾਨਾ ॥੧੧॥"
page = 865

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Also a number of animals killed by the other begums reached the heaven.(11)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਅਤੇ ਇਸ ਤਰ੍ਹਾਂ) ਪਸ਼ੂਆਂ ਨੇ ਯਮ-ਲੋਕ ਵਲ ਚਾਲੇ ਪਾਏ ॥੧੧॥"