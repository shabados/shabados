[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੋ ਐਸੋ ਪੁਨਿ ਤੁਰਤ ਹੀ ਕ︀ਯੋ ਨਹਿ ਲਹਤ ਸਜਾਇ ॥੭੩॥"
page = 936

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Why shouldn’t that woman be punished immediately?(73)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਹ ਫਿਰ ਤੁਰਤ ਹੀ ਅਜਿਹੀ ਸਜ਼ਾ ਕਿਉਂ ਨਹੀਂ ਲੈਂਦੀ ॥੭੩॥"