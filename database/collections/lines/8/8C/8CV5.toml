[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪੋਸਤ ਭਾਗ ਅਫੀਮ ਮੰਗਾਇ; ਪੀਓ ਮਦ ਸੋਕ ਬਿਦਾ ਕਰਿ ਡਾਰਿਯੋ ॥"
page = 509

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They made use of poppy seeds, hemp and opium and drank wine, thereby they removed all their sorrows"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪੋਸਤ, ਭੰਗ, ਅਫੀਮ ਮੰਗਵਾ ਲਈ ਅਤੇ ਸ਼ਰਾਬ ਪੀ ਕੇ ਸਾਰੇ ਗ਼ੰਮ ਦੂਰ ਕਰ ਦਿੱਤੇ।"