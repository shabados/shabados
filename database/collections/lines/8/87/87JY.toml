[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਵਿਲੋਕ ਧਨੀ ਧਨਵਾਨ ਬਡੋ; ਤਿਹ ਜਾਇ ਮਿਲੈ ਮਗ ਮੋ ਠਗ ਜਯੋ ॥"
page = 236

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Like a thug visiting a wealthy person and said,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਵੱਡੇ ਧਨੀ ਨੂੰ ਦੇਖ ਕੇ ਰਸਤੇ ਵਿੱਚ ਉਸ ਨੂੰ ਠੱਗ ਜਾ ਮਿਲਦੇ ਹਨ।"