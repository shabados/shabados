data = "ਦੋਊ ਜੋਧ ਜੈਤਵਾਰੁ ਜੋਧਾ ਪ੍ਰਚੰਡੰ ॥"
page = 147

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Both were the terrible conquerors of the great heroes."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਵੇਂ ਯੋਧਿਆਂ ਨੂੰ ਜਿਤਣ ਵਾਲੇ ਅਤੇ ਖ਼ੁਦ ਪ੍ਰਚੰਡ ਯੋਧੇ ਸਨ।"