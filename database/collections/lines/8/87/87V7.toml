data = "ਜਗ ਜਾਪਨ ਹੈਂ ॥੩੪੩॥"
page = 585

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is Bewitching and Glorious, He is the Affliction-Giver for the enemies and the world remembers Him.343."

