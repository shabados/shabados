[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਇ ਹੈ ਸਸਤ੍ਰ ਸੰਭਾਰਿ ਸਬੈ ਸੰਗ ਸ︀ਯਾਮ ਮਚਾਵਨ ਕਾਜ ਲਰਾਈ ॥"
page = 479

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The whole army got ready to fight with Krishna, holding the weapons"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰੇ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਨਾਲ ਲੜਾਈ ਕਰਨ ਲਈ ਸ਼ਸਤ੍ਰ ਧਾਰਨ ਕਰ ਕੇ ਆ ਗਏ।"