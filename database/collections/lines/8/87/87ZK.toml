[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੇ ਸੰਤ; ਨ ਮੋ ਕਉ ਭਾਵਹਿ ॥"
page = 476
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such saints are not pleasing to me,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਹੋ ਜੇਹੇ ਸਾਧੂ ਮੈਨੂੰ ਚੰਗੇ ਨਹੀਂ ਲੱਗਦੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such 'saints' are not pleasing to me;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਪਾਖੰਡੀ ਸੰਤ ਮੁਝ ਕੋ ਅਛੇ ਨਹੀਂ ਲਗਤੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਅਜਿਹੇ ਸੰਤ ਚੰਗੇ ਨਹੀਂ ਲੱਗਦੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋ ਕਉ = ਮੈਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Yo no me complazco con Santos de tal índole"