[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵਣੁ ਜਾਵਣੁ; ਮਿਰਤੁ ਨ ਹੋਤਾ ॥"
page = 237
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "No coming, going, and death is there."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਕੋਈ ਆਗਮਨ, ਗਵਨ ਅਤੇ ਮੌਤ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "there is no coming or going, and no death there."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਆਵਣਾ ਜਾਵਣਾ ਮ੍ਰਿਤੁ ਜਨਮ ਇਨ ਬਿਕਾਰੋਂ ਕਾ ਸਮੁਦਾਇ ਜਹਾਂ ਨਹੀਂ ਹੋਤਾ ਹੈ। ਭਾਵ ਏਹਿ ਇਨ ਬਿਕਾਰੋਂ ਕੋ ਅਨਾਤਮਾ ਕੇ ਧਰਮ ਜਾਨਤੇ ਹੈਂ ਔਰ ਆਪ ਕੋ ਅਸੰਗ ਮਾਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਜਨਮ ਮਰਨ ਦਾ ਗੇੜ ਨਹੀਂ ਰਹਿੰਦਾ, ਉਥੇ ਆਤਮਕ ਮੌਤ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਰਤੁ = ਮੌਤ, ਮੌਤ ਦਾ ਸਹਮ, ਆਤਮਕ ਮੌਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no hay idas ni venidas, y ninguna muerte de nada."