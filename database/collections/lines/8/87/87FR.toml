[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੇ ਕਾ ਵਾਪਾਰੀ ਹੋਵੈ; ਸਚੋ ਸਉਦਾ ਪਾਇਦਾ ॥੮॥"
page = 1036
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who is the dealer of the True Lord, Loads the true merchandise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੱਚੇ ਸੁਆਮੀ ਦਾ ਵਣਜਾਰਾ ਹੈ, ਉਹ ਸੱਚਾ ਸਉਦਾ ਸੂਤ ਹੀ ਲੱਦਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The trader of Truth becomes true, and obtains the merchandise. ||8||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਸਚੇ ਕਾ ਵਾਪਾਰੀ ਹੋਤਾ ਹੈ ਵਹੁ ਸਚੇ ਹੀ ਸੌਦੇ ਕੋ ਪਾਵਤਾ ਹੈ॥੮॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਵਪਾਰ ਕਰਨ ਲੱਗ ਪੈਂਦਾ ਹੈ, ਉਹ ਇਹ ਸਦਾ-ਥਿਰ ਨਾਮ ਦਾ ਸੌਦਾ ਹੀ ਲੱਦਦਾ ਹੈ ॥੮॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੋ = ਸੱਚ ਹੀ, ਸਦਾ-ਥਿਰ ਨਾਮ ਹੀ ॥੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero sólo aquél que comercia con la Verdad, llega hasta la Sustancia de la Verdad.  (8)"