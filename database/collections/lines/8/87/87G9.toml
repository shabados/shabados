[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚਿਤਮਿਤਾਲੇ ਫੋਫਲੇ; ਫਲ ਬਿਰਖਹੁੰ ਛੁਟੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The betel nut getting pie bald colour is plucked from the tree."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸੁਪਾਰੀਆਂ ਦੇ ਚਿੱਤ੍ਰ ਮਿੱਤ੍ਰੋ ਫੱਲ ਬ੍ਰਿੱਛ ਤੋਂ ਡਿੱਗਦੇ ਹਨ।"