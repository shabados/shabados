[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਰਮੁ ਤੁਮਾਰਾ; ਗੁਰ ਤੇ ਪਾਇਆ ॥"
page = 181
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thy secret, I have obtained form the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਭੇਤ ਮੈਂ ਗੁਰਾਂ ਪਾਸੋਂ ਹਾਸਲ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have obtained Your secret from the Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਏਹੁ ਤੁਮਾਰਾ (ਮਰਮੁ) ਗਿਆਨ ਗੁਰੋਂ ਸੇ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਭੇਦ ਮੈਂ ਗੁਰੂ ਪਾਸੋਂ ਲੱਭਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਰਮੁ = ਭੇਦ। ਤੇ = ਤੋਂ, ਪਾਸੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando Tu Misterio me fue revelado a través del Guru,"