data = "ਕਹਿਓ ਦੈਤ ਆਏ ਪ੍ਰਬਲ; ਕੀਜੈ ਕਹਾ ਉਪਾਇ ॥੬੦॥"
page = 80

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They asked him to take some steps because of the conquest of powerful demos.60.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਿਹਾ ਕਿ ਪ੍ਰਬਲ ਦੈਂਤ ਚੜ੍ਹ ਆਏ ਹਨ, (ਉਨ੍ਹਾਂ ਤੋਂ ਬਚਣ ਦਾ) ਕੋਈ ਉਪਾ ਕਰੋ ॥੬੦॥"