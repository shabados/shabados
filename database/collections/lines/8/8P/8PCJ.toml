[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਰੋਗ; ਨਾਨਕ. ਮਿਟਿ ਜਾਹਿ ॥੧॥"
page = 288
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak all thy maladies shall be dispelled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਤੇਰੀਆਂ ਸਾਰੀਆਂ ਬੀਮਾਰੀਆਂ ਹਟ ਜਾਣਗੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All disease, O Nanak, shall then be dispelled. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਬ ਤੁਮਾਰੇ ਸਰਬ ਰੋਗ ਮਿਟ ਜਾਵੇਂਗੇ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਇਸ ਤਰ੍ਹਾਂ) ਸਾਰੇ ਰੋਗ ਮਿਟ ਜਾਣਗੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Toda aflicción es entonces disipada.(1)"