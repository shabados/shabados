data = "ਕੰਬੋਜੇ ਕਾਸਕਾਰੀ ਕੈ ॥੫੨੬॥"
page = 604

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Before him, the beauty of the women of Kamroop with bewitching eyes and the charm of Kamboj country is devoid of radiance.526."

