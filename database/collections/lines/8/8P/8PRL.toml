[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਸਿਮਰਨਿ; ਤੇਰੀ ਜਾਇ ਬਲਾਇ ॥"
page = 971
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By remembering whom thy calamity shall depart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਚਿੰਤਨ ਕਰਨ ਨਾਲ ਤੇਰੇ ਤੋਂ ਬਲਾ ਟਲ ਜਾਊਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remembering Him in meditation, your troubles will depart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸਿਮਰਨ ਕਰ ਤੇਰੀ ਅਵਿਦ੍ਯਾ ਜਾਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸਿਮਰਨ ਕਰਕੇ ਤੇਰਾ ਆਤਮਕ ਰੋਗ ਕੱਟਿਆ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਲਾਇ = ਰੋਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Contemplando al Señor, uno es liberado de la maldad del deseo;"