[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ; ਹਉ ਕਿਆ ਜਾਨਾ ਕਿਆ ਭਾਵੈ ॥"
page = 978
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Lord, how can I know what pleases Thee?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂਡੇ ਪ੍ਰਭੂ, ਮੈਂ ਕਿਸ ਤਰ੍ਹਾਂ ਜਾਣ ਸਕਦਾ ਹਾਂ ਕਿ ਤੈਨੂੰ ਕੀ ਚੰਗਾ ਲਗਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord, how can I know what pleases You?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਮ! ਮੈਂ ਕਿਆ ਜਾਨੋਂ, ਜੋ ਆਪ ਕੋ ਕਿਆ ਭਾਵਤਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਰਮਾਤਮਾ! ਮੈਂ ਇਹ ਤਾਂ ਨਹੀਂ ਜਾਣਦਾ ਕਿ ਤੈਨੂੰ ਕੀਹ ਚੰਗਾ ਲੱਗਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਹਉਂ, ਮੈਂ। ਜਾਨਾ = ਜਾਨਾਂ, (ਮੈਂ) ਜਾਣਦਾ। ਕਿਆ ਭਾਵੈ = (ਤੈਨੂੰ) ਕੀਹ ਚੰਗਾ ਲੱਗਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, ¿cómo saber lo que te place?"