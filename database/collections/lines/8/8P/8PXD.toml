data = "ਬਿਲੋਕਿ ਲੋਕ ਲੋਭ ਹੀ ॥੧੮੨॥"
page = 569

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing him, all ran away, everyone coveted to see him.182."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਲੋਕਾਂ ਅੰਦਰ (ਉਸ ਨੂੰ) ਵੇਖਣ ਦਾ ਲੋਭ ਹੈ ॥੧੮੨॥"