[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੋਊ ਖਗ ਪਾਣੰ ਦੋਊ ਛੇਤ੍ਰ ਮੰਡੰ ॥੧੩॥੨੩੧॥"
page = 147

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Both had swords in their hands and both were the adornments of th battlefield.13.231."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਹਾਂ ਦੇ ਹੱਥਾਂ ਵਿਚ ਤਲਵਾਰਾਂ ਸਨ ਅਤੇ ਦੋਵੇਂ ਯੁੱਧ-ਭੂਮੀ ਨੂੰ ਸੁਸ਼ੋਭਿਤ ਕਰਨ ਵਾਲੇ ਸਨ ॥੧੩॥੨੩੧॥"