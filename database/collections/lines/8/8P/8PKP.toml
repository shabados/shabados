[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਸਬਦੈ; ਕੋ. ਥਾਇ ਨ ਪਾਈ ॥"
page = 363
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Lord's Name none is approved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਨਾਮ ਦੇ ਬਗੈਰ ਕੋਈ ਵੀ ਕਬੂਲ ਨਹੀਂ ਪੈਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Shabad, no one is approved."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿ ਗੁਰ (ਸਬਦੈ) ਉਪਦੇਸ ਸੇ ਬਿਨਾਂ ਕੋਈ ਸਥਾਨੁ ਨਹੀਂ ਪਾਉਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਨੇ ਉਸ ਨੂੰ ਹੁਕਮ ਕੀਤਾ ਹੋਇਆ ਹੈ ਕਿ) ਗੁਰੂ ਦੇ ਸ਼ਬਦ (ਵਿਚ ਜੁੜਨ) ਤੋਂ ਬਿਨਾ ਕੋਈ ਮਨੁੱਖ (ਉਸ ਦੇ ਦਰ ਤੇ) ਕਬੂਲ ਨਹੀਂ ਹੋ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋ = ਕੋਈ ਮਨੁੱਖ। ਥਾਇ ਨ ਪਾਈ = ਕਬੂਲ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en verdad, sin la Palabra, nadie es aprobado por el Señor."