[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਸਨਾ; ਰਾਮ ਕੋ ਜਸੁ ਗਾਉ ॥"
page = 1220
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my tongue, sing thou thy Lord's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜੀਭੇ! ਤੂੰ ਆਪਣੇ ਪ੍ਰਭੂ ਦੀ ਮਹਿਮਾ ਗਾਇਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my tongue, sing the Praises of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਰਸਨਾ ਕਰ ਕੇ ਰਾਮ ਕੇ ਜਸ ਕੋ ਗਾਵਣਾ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਆਪਣੀ) ਜੀਭ ਨਾਲ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਗਾਇਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸਨਾ = ਜੀਭ ਨਾਲ। ਕੋ = ਦਾ। ਜਸੁ = ਸਿਫ਼ਤ-ਸਾਲਾਹ। ਗਾਉ = ਗਾਇਆ ਕਰੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi boca, recita las Alabanzas del Señor,"