[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਹੁ ਤੋ ਭਾਜ ਕੈ ਜਾਹੁ ਅਬੈ; ਨਹੀ ਅੰਤ ਕੋ ਅੰਤ ਕੇ ਧਾਮਿ ਸਿਧੈ ਹੋ ॥੧੪੪੮॥"
page = 441

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Otherwise ultimately you will have to go to the abode of Yama.”1448."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੇ ਜਾਣਾ ਹੈ ਤਾਂ ਹੁਣੇ ਭਜ ਕੇ ਚਲਾ ਜਾ, ਨਹੀਂ ਤਾਂ ਅੰਤ ਨੂੰ ਯਮ ਦੇ ਘਰ ਨੂੰ ਚਲਾ ਜਾਏਂਗਾ ॥੧੪੪੮॥"