[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਖ ਦੀਵੇ ਲਖ ਤਾਰਿਆਂ; ਜੋਤਿ ਸੂਰਜ ਚੰਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Millions are the lights of millions of lamps, stars, suns and moons;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਲੱਖਾਂ ਦੀਵੇ ਲੱਖਾਂ ਤਾਰੇ, ਸੂਰਜ ਅਤੇ ਚੰਦ ਦੀ (ਜੋਤੀ ਕਹੀਏ) ਪ੍ਰਕਾਸ਼।"