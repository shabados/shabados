[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੋਵਨਹਾਰੈ; ਝੂਠੁ ਕਮਾਨਾ ॥"
page = 389
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The weeper practises falsehood."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੋਣ ਵਾਲਾ ਕੂੜ ਦੀ ਕਮਾਈ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mourner practices falsehood;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਪਦੇਸ਼: ਰੋਵਨ ਹਾਰੇ ਨੇ ਝੂਠਾ ਹੀ ਕਰਮ ਕਮਾਯਾ ਹੈ ਅਰਥਾਤ ਭਾਣਾ ਨਹੀਂ ਮਾਨਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜਿੱਥੇ ਕੋਈ ਮਰਦਾ ਹੈ ਤੇ ਉਸ ਨੂੰ ਕੋਈ ਸੰਬੰਧੀ ਰੋਂਦਾ ਹੈ ਉਹ) ਰੋਣ ਵਾਲਾ ਭੀ (ਆਪਣੇ ਦੁੱਖਾਂ ਨੂੰ ਰੋਂਦਾ ਹੈ ਤੇ ਇਸ ਤਰ੍ਹਾਂ) ਝੂਠਾ ਰੋਣ ਹੀ ਰੋਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੋਵਨਹਾਰੈ = ਰੋਣ ਵਾਲੇ ਨੇ। ਝੂਠੁ ਕਮਾਨਾ = ਝੂਠ-ਮੂਠ ਹੀ ਰੋਣ ਦਾ ਕੰਮ ਕੀਤਾ, ਝੂਠਾ ਰੋਂਦਾ ਹੈ, ਆਪਣੇ ਸੁਆਰਥ ਦੀ ਖ਼ਾਤਰ ਰੋਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno practica la falsedad,"