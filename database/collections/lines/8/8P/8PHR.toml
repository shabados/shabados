type = "primary"
data = "ਤਜਿ ਚਾਲ ਕਲੇਵਰ ਭੂਮਿ ਤਲੰ ॥"
page = 674

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Controlling the wind with the strength of Yoga, relinquishing his body left the earth"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਧਰਤੀ ਤਲ ਉਤੇ (ਆਪਣਾ) ਸ਼ਰੀਰ ਤਿਆਗ ਕੇ ਚਲਦੇ ਬਣੇ।"