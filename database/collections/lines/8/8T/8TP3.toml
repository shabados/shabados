[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸਟ ਮੀਤ; ਜਾਣੁ ਸਭ ਛਲੈ ॥"
page = 889
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Know that all the dear friends are but a delusion."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਮਝ ਲੈ ਕਿ ਸਾਰੇ ਪਿਆਰੇ ਮਿੱਤਰ ਕੇਵਲ ਛਲ-ਫਰੇਬ ਹੀ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Know that all your dear friends are fake."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਿਆਰੇ ਮਿਤ੍ਰ ਭੀ ਸਭ ਛਲ ਰੂਪ ਹੀ ਜਾਨ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਚੇਤਾ ਰੱਖ ਕਿ ਇਹ ਸਾਰੇ ਪਿਆਰੇ ਮਿੱਤਰ (ਤੇਰੇ ਵਾਸਤੇ) ਛਲ-ਰੂਪ ਹੀ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਸਟ = ਪਿਆਰੇ। ਜਾਣੁ = ਚੇਤੇ ਰੱਖ, ਸਮਝ ਲੈ। ਛਲੈ = ਛਲ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos tus amados amigos son pura ilusión;"