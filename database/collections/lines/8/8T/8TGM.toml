data = "ਕਿ ਦਈਤੇਸੁਰਾ ਹੈ ॥੨੯੫॥"
page = 659

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She was like the goddess of the goddesses and the heavenly damsel of the demons.295."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਾਂ ਦੈਂਤਾਂ (ਦੇ ਗੁਰੂ ਦੀ) ਇਸਤਰੀ (ਅਥਵਾ ਰਾਣੀ) ਹੈ ॥੨੯੫॥"