[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੁ ਉਪਦੇਸੁ; ਸੇਵਕ ਕਉ ਦੇਇ ॥"
page = 287
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and gives true instruction to his servant."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੇ ਦਾਸ ਨੂੰ ਸਚੀ ਸਿਖ-ਮਤ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord gives true instruction to His servant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਅਪਨੇ ਸੇਵਕ ਕਉ ਸਚ ਸਰੂਪ ਕਾ ਉਪਦੇਸ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਆਪਣੇ ਸੇਵਕ ਨੂੰ ਭੀ ਇਹੀ ਸੱਚਾ ਉਪਦੇਸ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así transmite la Verdad a sus discípulos."