[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਉਰ ਸਭੈ ਨਿਰਖੇ ਤਿਹ ਮੈ ਪੁਰ; ਬੇਦ ਪੜੈ ਬ੍ਰਹਮਾ ਗਨਿਤਾ ਗਨਿ ॥"
page = 303

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The reciters of Vedas were seen warming themselves with Brahm-fire"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਹੋਰ ਵੀ ਸਭ ਕੁਝ ਉਸ ਵਿਚ ਵੇਖ ਲਿਆ ਅਤੇ ਵੇਦਾਂ ਨੂੰ ਪੜ੍ਹਦਿਆਂ ਬ੍ਰਹਮਾ ਨੂੰ ਵੀ ਵੇਖ ਲਿਆ।"