[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਥੈ ਦੁਖੋ ਦੁਖੁ ਕਮਾਵਣਾ; ਮੁਇਆ ਨਰਕਿ ਨਿਵਾਸੁ ॥"
page = 586
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Here they earn nothing but pain and, on dying, they dwell in hell."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਏਥੇ ਇਹ ਨਿਰੇਪੁਰੇ ਕਸ਼ਟ ਦੀ ਹੀ ਕਮਾਈ ਕਰਦੇ ਹਨ ਤੇ ਮਰ ਕੇ ਉਹ ਦੋਖਕ ਅੰਦਰ ਵਸਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In this world, they earn only pain and suffering, and dying, they go to abide in hell."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਦੁਖ ਹੀ ਦੁਖ ਕਮਾਉਣ ਕਰਤੇ ਹੈਂ, ਮਰ ਕਰ ਨਰਕ ਮੇਂ ਨਿਵਾਸ ਕਰਤੇ ਹੈਂ ਅਰਥਾਤ ਈਹਾਂ ਭੀ ਦੁਖ ਪਾਉਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਜੇਹੇ ਬੰਦੇ ਜਗਤ ਵਿਚ ਨਿਰਾ ਦੁੱਖ ਹੀ ਭੋਗਦੇ ਹਨ ਤੇ ਮੋਇਆਂ ਭੀ ਉਹਨਾਂ ਦਾ ਵਾਸ ਨਰਕ ਵਿਚ ਹੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Obtiene el dolor aquí y muriendo cae en la oscuridad de otro vientre."