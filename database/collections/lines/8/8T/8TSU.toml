[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਖੀਏ ਕਾ; ਮਿਟਾਵਹੁ ਪ੍ਰਭ ਸੋਗੁ ॥"
page = 1146
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of the woe-begone man, the Lord eradicates the sorrow."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੀੜਤ ਪ੍ਰਾਣੀ ਦਾ ਪ੍ਰਭੂ ਗਮ ਦੂਰ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God takes away the sorrows of the suffering."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਆਪ ਦੁਖੀ ਕੇ ਸੋਗੋਂ ਕੋ ਮਿਟਾ ਦੇਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦੁਖੀਏ ਦਾ ਗ਼ਮ ਮਿਟਾ ਦੇਂਦਾ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਗੁ = ਗ਼ਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "logra sentir Júbilo y tener Integridad."