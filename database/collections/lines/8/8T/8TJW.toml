[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਪਤ ਸਮੁੰਦ; ਜਾਂ ਚੈ ਘੜਥਲੀ ॥"
page = 1292
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The seven ocean are whose pitcher stands."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤ ਸਮੁੰਦਰ ਜਿਸ ਦੀਆਂ ਘੜਵੰਜੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The seven seas are His water-pitchers."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤ ਸਮੁੰਦ੍ਰ ਜਿਸ ਪਰਮੇਸ੍ਵਰ ਦੇ ਘੜਿਓਂ ਕੇ ਅਸਥਾਨ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸੱਤੇ ਸਮੁੰਦਰ ਉਸ ਦੀ ਘੜਵੰਜੀ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਪਤ = ਸੱਤ। ਘੜਥਲੀ = ਘੜਵੰਜੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su Dulce es el Río Ganges; Sus Siete Mares son Sus Vasijas de Agua;"