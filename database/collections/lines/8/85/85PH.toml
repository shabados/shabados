[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੇਰਿ ਹਮੈ ਕਬਿ ਸ︀ਯਾਮ ਭਨੈ ਕਬਹੂੰ ਕਰੁਨਾ ਰਸ ਕੇ ਸੰਗਿ ਭੀਜੈ ॥"
page = 522

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O Lord! looking towards me, mercifully, give your consent not to kill Sahasrabahu,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਵੀ ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, ਮੈਨੂੰ ਵੇਖ ਕੇ ਕਦੇ ਤਾਂ ਕਰੁਣ ਰਸ ਨਾਲ ਭਿਜ ਜਾਓ।"