[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਨਾਨਕ ਕੇ ਪ੍ਰਭ ਰਾਖੇ ਸੁਆਮੀ; ਹਮ ਪਾਥਰ ਰਖੁ ਬੁਡਥਈ ॥੪॥੪॥"
page = 1320
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord Master, the Saviour of slave Nanak, save Thou me, the sinking stone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਲੇ ਨਾਨਕ ਦੇ ਰਖਵਾਲੇ ਪ੍ਰਭੂ ਪ੍ਰਮੇਸ਼ਰ! ਤੂੰ ਮੇਰੇ ਵਰਗੇ ਡੁਬਦੇ ਹੋਏ ਪੱਥਰ ਦੀ ਰੱਖਿਆ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O God, my Saving Grace, Lord and Master of servant Nanak, please save me, the sinking stone. ||4||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਸੁਆਮੀ ਪ੍ਰਭੂ ਜਨੋਂ ਕੇ ਰਖਕ! ਹਮ ਪਥਰ ਵਤ ਭਾਰੇ ਹੈਂ ਔਰ ਡੂਬਤੇ ਹੈਂ, ਹਮਾਰੀ ਰਖਿਆ ਕਰੀਏ॥੪॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਾਸ ਨਾਨਕ ਦੇ ਰਖਵਾਲੇ ਮਾਲਕ ਪ੍ਰਭੂ! ਅਸਾਂ ਪੱਥਰ (ਵਾਂਗ) ਡੁੱਬਦੇ ਜੀਵਾਂ ਦੀ ਰੱਖਿਆ ਕਰ ॥੪॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਰਾਖੇ ਸੁਆਮੀ = ਹੇ ਰੱਖਿਆ ਕਰਨ ਵਾਲੇ ਸੁਆਮੀ! ਰਖੁ = ਰੱਖਿਆ ਕਰ। ਬੁਡਥਈ = ਡੁੱਬ ਰਿਹਾਂ ਨੂੰ ॥੪॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, Dios, mi Gracia Salvadora, Señor y Maestro del Sirviente Nanak, Sálvame por favor, pues soy la piedra que se hunde. (4-4)"