[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਕਹਿ ਕਬੋ, ਲੀਜਹੁ ਸਕਲ ਬੀਚਾਰ ॥੬੫੮॥"
page = 747

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Golaa” in the beginning and then adding the word “Muktani” at the end, speak all the names of Tupak thoughtfully.658."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ) ਨੂੰ ਤੁਪਕ ਦਾ ਨਾਂਮ ਕਹਿ ਕੇ ਕਵੀ ਜਨੋ! ਮਨ ਵਿਚ ਵਿਚਾਰ ਲਵੋ ॥੬੫੮॥"