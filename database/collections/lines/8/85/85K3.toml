[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਖ਼ੁਸ਼ਪੀਦ ਯਕ ਜਾ ਯਕੇ ਖ਼ਾਬ ਗਾਹ ॥"
page = 1416

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That is why they went into sleep at the same place and in the same bed."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਹ ਦੋਵੇਂ ਇਕੋ ਥਾਂ ਇਕੱਠੀਆਂ ਸੁੱਤੀਆਂ ਹੋਈਆਂ ਹਨ।"