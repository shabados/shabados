[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਏਕੁ ਧਿਆਇਆ ॥"
page = 210
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, I have remembered the One Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ ਮੈਂ ਇਕ ਸਾਈਂ ਦਾ ਸਿਮਰਨ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, meditate on the One Lord;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਏਕ ਪਰਮੇਸ੍ਵਰ ਕਾ ਧਿਆਨ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਜਿਸ ਮਨੁੱਖ ਨੇ ਇਕ ਪਰਮਾਤਮਾ ਦਾ ਧਿਆਨ ਧਰਿਆ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, aquél que habita en el Uno sólo,"