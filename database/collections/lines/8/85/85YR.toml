[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੇ ਮਨ; ਓਟ ਲੇਹੁ ਹਰਿ ਨਾਮਾ ॥"
page = 901
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul seek thou the shelter of God's Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ! ਤੂੰ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦੀ ਸ਼ਰਣਾਗਤ ਸੰਭਾਲ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mind, take the sheltering support of the Lord's Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਤੂੰ ਹਰੀ ਕੇ ਨਾਮ ਕੀ ਓਟ ਲੇਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਮਨ! ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਆਸਰਾ ਲਿਆ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਟ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente, busca el Santuario del Nombre del Señor;"