[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈ ਅੰਧੁਲੇ; ਹਰਿ ਟੇਕ ਟਿਕਾਈ ॥੪॥੧॥੩੯॥"
page = 164
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I, blind, have set up God as my support."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਅੰਨੇ ਨੇ ਵਾਹਿਗੁਰੂ ਦੀ ਓਟ ਧਾਰੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am blind - I have taken the Lord as my Support. ||4||1||39||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਮੂਰਖ ਨੇ ਤੌ ਹ੍ਰਿਦੇ ਮੇਂ ਹੇ ਹਰੀ! ਤੇਰੀ ਹੀ ਟੇਕ ਟਿਕਾਈ ਹੈ, ਅਰਥਾਤ ਤੇਰੀ ਸਰਣ ਲਈ ਹੈ॥੪॥੧॥੩੯॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹਨਾਂ ਲੋਕਾਂ ਦੇ ਭਾਣੇ ਮੈਂ ਅੰਨ੍ਹਾ ਹਾਂ, ਪਰ) ਮੈਂ ਅੰਨ੍ਹੇ ਨੇ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਆਸਰਾ ਲਿਆ ਹੋਇਆ ਹੈ ॥੪॥੧॥੩੯॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਟੇਕ = ਆਸਰਾ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, eres el Único Soporte para un ciego como yo.  (4-1-39)"