[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਉਨੁ ਮੂਆ ਰੇ; ਕਉਨੁ ਮੂਆ ॥"
page = 885
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Oh, who has died, who has died?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ! ਕੌਣ ਮਰ ਗਿਆ ਹੈ, ਕੌਣ ਮਰ ਗਿਆ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who has died? O, who has died?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਕੌਨ ਮੂਆ ਹੈ? ਦ੍ਰਿੜਤਾ ਕੇ ਲੀਏ ਦੂਸਰੀ ਬੇਰ ਕਹਿਤੇ ਹੈਂ ਨਹੀਂ ਮੂਆ ਹੈ, ਭਾਵ ਦੇਹ ਮਰੀ ਹੈ ਵਾ ਆਤਮਾ ਮਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਅਸਲ ਵਿਚ) ਕੋਈ ਭੀ ਜੀਵਾਤਮਾ ਮਰਦਾ ਨਹੀਂ, ਇਹ ਪੱਕੀ ਗੱਲ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇ = ਹੇ ਭਾਈ! ਕਉਨੁ ਮੂਆ = (ਅਸਲ ਵਿਚ) ਕੋਈ ਭੀ ਨਹੀਂ ਮਰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Quién ha muerto, dime, quién ha muerto?"