[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਠਾਢੇ ਜਹਾ ਸਰਦਾਰ ਬਡੇ; ਕੁਪਿ ਕੌਚ ਕ੍ਰਿਪਾਨ ਕਸੇ ਪਠਨੇਟੇ ॥"
page = 813

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Wherever the fully armed brave enemies assembled,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਵੱਡੇ ਵੱਡੇ ਜਵਾਨ ਸਰਦਾਰ, ਕ੍ਰੋਧ ਨਾਲ ਕਵਚ ਅਤੇ ਕ੍ਰਿਪਾਨਾਂ ਕਸ ਕੇ ਖੜੋਤੇ ਹੋਏ ਹਨ,"