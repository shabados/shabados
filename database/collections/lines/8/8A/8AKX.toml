[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਭੇਟੇ; ਤਾ ਸੁਖੁ ਪਾਏ ॥"
page = 665
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If he meets the True Guru, then attains he the peace,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਉਹ ਸੱਚੇ ਗੁਰਾਂ ਨੂੰ ਮਿਲ ਪਵੇ, ਤਦ ਉਹ ਆਰਾਮ ਪਾ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But if he meets the True Guru, then he finds peace,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸਤਿਗੁਰ ਇਸ ਜੀਵ ਕੋ ਮਿਲੈ ਤਬ ਇਹ ਸੁਖੋਂ ਕੌ ਪਾਵੈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਉਸ ਨੂੰ ਗੁਰੂ ਮਿਲ ਪੈਂਦਾ ਹੈ, ਤਦੋਂ ਉਹ ਆਤਮਕ ਆਨੰਦ ਹਾਸਲ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੇਟੇ = ਮਿਲਦਾ ਹੈ। ਤਾਂ = ਤਦੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ntonces logra la Paz,"