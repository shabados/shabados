[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਰਮਤ ਰਾਮੁ ॥"
page = 1202
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord, my Lord is pervading all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ, ਮੇਰਾ ਸੁਆਮੀ ਸਾਰੇ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord, the Lord is All-pervading."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਰਾਮ ਸਭ ਮੇਂ (ਰਮਤ) ਬ੍ਯਾਪਕ ਹੋ ਰਹਾ ਹੈ॥☬ਪੁਨਹ ਕੈਸਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਰਾਮ ਦਾ) ਜਿਹੜਾ ਸਭ ਥਾਈਂ ਵਿਆਪਕ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਮਤ = ਵਿਆਪਕ, ਹਰ ਥਾਂ ਮੌਜੂਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien es Todo Prevaleciente, Verdad, Verdad es el Señor."