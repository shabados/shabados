[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਝੂਠ ਵਿਕਾਰ; ਮਹਾ ਦੁਖੁ ਦੇਹ ॥"
page = 352
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Falsehood and voice cause great annoyance."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੂੜ ਅਤੇ ਬਦੀ ਬੜੀ ਤਕਲੀਫ ਦਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Falsehood and corruption cause terrible suffering."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਝੂਠ ਬੋਲਣਾ ਵਿਕਾਰ ਕਰਮ ਕਰਨੇ ਏਹ ਮਹਾਂ ਦੁਖੁ ਦੇਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਨ ਮਾਰ ਕੇ ਆਤਮਕ ਆਨੰਦ ਲੈਣ ਵਾਲੇ ਨੂੰ) ਝੂਠ ਆਦਿਕ ਵਿਕਾਰ ਸਰੀਰ ਵਾਸਤੇ ਭਾਰੀ ਕਸ਼ਟ (ਦਾ ਮੂਲ) ਜਾਪਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਹ = ਸਰੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La falsedad y el vicio traen un inmenso dolor al cuerpo"