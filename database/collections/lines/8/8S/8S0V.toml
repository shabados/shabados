[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਨਾਮ ਬਿਨੁ; ਦੂਖੁ ਸਹੀਜੈ ॥੨॥"
page = 905
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Lord's Name, man suffers pain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਨਾਮ ਦੇ ਬਾਝੋਂ ਬੰਦਾ ਦੁੱਖ ਸਹਾਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Lord's Name, they endure suffering and pain. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਮ ਨਾਮ ਕੇ ਜਾਪ ਬਿਨਾ ਜਨਮ ਮਰਨ ਕੇ ਦੂਖ ਸਹਾਰਤੇ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਨ ਤੋਂ ਬਿਨਾ ਦੁੱਖ ਹੀ ਸਹਾਰਨਾ ਪੈਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, sin el Nombre del Señor, uno sólo existe sufriendo.(2)"