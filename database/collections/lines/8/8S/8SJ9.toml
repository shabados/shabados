[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਏ ਖੜਗ ਕਰਿ ਚਾਮ; ਖੜਗ ਸਿੰਘ ਪਰ ਸੋ ਚਲਿਓ ॥੧੩੯੯॥"
page = 437

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "A great warrior Chhalbal Singh went to wage war with Kharag Singh, taking his shield and sword in his hands.1399."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਹੱਥ ਵਿਚ ਤਲਵਾਰ ਅਤੇ ਢਾਲ ਲੈ ਕੇ ਖੜਗ ਸਿੰਘ (ਨਾਲ ਜੂਝਣ ਲਈ) ਨਿਤਰਿਆ ਹੈ ॥੧੩੯੯॥"