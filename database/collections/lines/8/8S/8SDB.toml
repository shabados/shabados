[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਿਸਨ ਮਿਲੇ; ਸਭ ਹੀ ਸਚੁ ਪਾਵੈ ॥੩੭॥"
page = 342
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By meeting God, the entire truth is obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨੂੰ ਭੇਟਣ ਦੁਆਰਾ ਸਮੂਹ ਸੱਚ ਹਾਸਲ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting the Lord, total Truth is obtained. ||37||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰੁ ਸਭ ਹੀ ਗੁਣ ਗਾਵਣੇ ਵਾਲੇ ਬਿਸਨੂ ਕੇ ਸਾਥ ਮਿਲਤੇ ਹੈਂ ਅਰੁ (ਸਚੁ) ਆਤਮ ਸੁਖੁ ਪਾਵਤੇ ਹੈਂ॥੩੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੂੰ ਮਿਲ ਕੇ ਉਹ ਹਰ ਥਾਂ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਨੂੰ ਹੀ ਵੇਖਦਾ ਹੈ ॥੩੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲੇ = ਮਿਲਿ, ਮਿਲ ਕੇ। ਸਭ ਹੀ = ਹਰ ਥਾਂ। ਸਚੁ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਪ੍ਰਭੂ ॥੩੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que se encuentra con su Dios, le es revelada la Verdad entera.  (37)"