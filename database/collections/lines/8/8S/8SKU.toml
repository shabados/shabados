[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਬਾਵਨ ਰੂਪੀ ਆਇ ਕੈ; ਗਰਬੁ ਨਿਵਾਰਿ ਭਗਤ ਉਧਰੰਦਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Lord in the form of a dwarf came to remove his ego and thus liberated him."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਬਾਵਨਰੂਪ ਵਾਲੇ ਨੇ ਆ ਕਰ ਕੇ ਹੰਕਾਰ ਦੂਰ ਕਰ ਕੇ ਭਗਤ ਦਾ ਉਧਾਰ ਕਰ ਦਿੱਤਾ।"