[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕ ਜੋਤਿ ਦੁਇ ਮੂਰਤੀ; ਧਨ ਪਿਰੁ ਕਹੀਐ ਸੋਇ ॥੩॥"
page = 788
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rather they alone are called husband and wife, who have one soul in two bodies."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਗੋਂ ਕੇਵਲ ਉਹ ਹੀ ਪਤੀ ਤੇ ਪਤਨੀ ਕਹੇ ਜਾਂਦੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਦੇ ਦੋ ਸਰੀਰਾਂ ਵਿੱਚ ਆਤਮਾ ਇਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They alone are called husband and wife, who have one light in two bodies. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਜੋਤਿ ਹੈ ਸਤ ਚਿਤ ਆਨੰਦ ਰੂਪ ਔਰੁ ਦੋ ਮੂਰਤੀਆਂ ਹੈਂ ਜੀਵ ਈਸਰ, ਇਸਤ੍ਰੀ ਪਤੀ ਸੋ ਸਾਸਤ੍ਰੋਂ ਮੇਂ ਕਹਤੇ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਦੇ ਦੋਹਾਂ ਜਿਸਮਾਂ ਵਿਚ ਇੱਕੋ ਆਤਮਾ ਹੋ ਜਾਏ ਉਹ ਹੈ ਇਸਤ੍ਰੀ ਤੇ ਉਹ ਹੈ ਪਤੀ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂਰਤੀ = ਜਿਸਮ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo serán cuando los dos cuerpos tengan un Alma, y así se vuelvan uno.(3)"