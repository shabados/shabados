[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਉਦਹ ਲੋਕਨ ਬੀਚ ਸਦਾ ਸੁਕ ਬ︀ਯਾਸ ਮਹਾ ਕਬਿ ਸ︀ਯਾਮ ਸੁ ਗਾਯੋ ॥"
page = 466

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He, whose praises are sung by Shukdev, Vyas etc. in all the fourteen world"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਵੀ ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, ਚੌਦਾਂ ਲੋਕਾਂ ਵਿਚ ਸਦਾ ਹੀ ਮਹਾ ਰਿਸ਼ੀ ਸੁਕਦੇਵ ਅਤੇ ਵਿਆਸ ਗਾਉਂਦੇ ਹਨ।"