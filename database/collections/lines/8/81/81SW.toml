type = "primary"
data = "ਕਰੋ ਖਾਨ ਬਾਨੀਨ ਖਾਲੀ ਪਲਾਣੰ ॥੯॥"
page = 60

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The great hero was struck by an arrow, but he caused the brave Khan to fall from the saddle.9."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਰ ਬਾਂਕੇ ਖ਼ਾਨਾਂ ਦੇ (ਘੋੜਿਆਂ ਦੀਆਂ) ਕਾਠੀਆਂ (ਸਵਾਰਾਂ ਤੋਂ) ਸਖਣੀਆਂ ਕਰ ਦਿੱਤੀਆਂ ॥੯॥"