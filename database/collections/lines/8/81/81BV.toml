[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੁ ਬਗੀਚਾ; ਪੇਡ ਘਨ ਕਰਿਆ ॥"
page = 385
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is a garden, wherein are planted so many plants."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਬਾਗ ਹੈ, ਜਿਸ ਵਿੱਚ ਬਹੁਤੇ ਪੌਦੇ ਲੱਗੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is a garden, in which so many plants have grown."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਬ੍ਰਹਮਾਂਡ ਰੂਪ ਬਗੀਚਾ ਹੈ ਤਿਸ ਮੇਂ (ਪੇਡ) ਬ੍ਰਿਖ ਦੇਵਤਾ ਦੈਤ ਮਾਨੁਖ੍ਯ ਪਸੁ ਪੰਛੀ ਰੂਪ (ਆ) ਸਰਬ ਓਰ ਤੇ ਘਨੇ ਕਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਇਹ ਜਗਤ ਇਕ ਬਗ਼ੀਚਾ ਹੈ ਜਿਸ ਵਿਚ (ਸਿਰਜਣਹਾਰ-ਮਾਲੀ ਨੇ) ਬੇਅੰਤ ਬੂਟੇ ਲਾਏ ਹੋਏ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਗੀਚਾ = ਬਾਗ਼, ਸੰਸਾਰ-ਬਗੀਚਾ। ਪੇਡ = ਰੁੱਖ, ਬੂਟੇ, ਜੀਵ। ਘਨ = ਬਹੁਤ, ਅਨੇਕਾਂ। ਕਰਿਆ = ਪੈਦਾ ਕੀਤੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La asociación de los Santos es un jardín en donde están los árboles frondosos"