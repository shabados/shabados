[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਇਹੁ ਤਤੁ ਬੀਚਾਰੀ ॥"
page = 740
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, I have realised this reality,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਮੈਂ ਇਹ ਅਸਲੀਅਤ ਅਨੁਭਵ ਕਰ ਲਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, I have contemplated this essence of reality;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਹਮ ਤੋ ਏਹ ਬਾਤ (ਤਤੁ) ਸਾਰ ਰੂਪ ਬੀਚਾਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- (ਹੇ ਭਾਈ! ਤੂੰ ਭੀ) ਇਹ ਅਸਲੀਅਤ ਆਪਣੇ ਮਨ ਵਿਚ ਵਸਾ ਲੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕ = ਹੇ ਨਾਨਕ! ਤਤੁ = ਨਿਚੋੜ, ਅਸਲੀਅਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak. Ésta es la Quintaesencia de la Sabiduría:"