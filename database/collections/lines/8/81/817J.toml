[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਨ ਸਮੑਾਰਿ. ਮੇਰਾ ਮਨੁ ਸਧਾਰੇ ॥੨॥"
page = 533
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Reflecting over them, my soul is sanctified."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦਾ ਵਿਚਾਰ ਕਰਨ ਨਾਲ ਮੇਰੀ ਆਤਮਾ ਪਵਿੱਤਰ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Contemplating Your virtues, my mind is sanctified. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਕੇ ਉਨ ਗੁਨੋਂ ਕੋ ਸਿਮਰਨ ਕਰ ਕੇ ਮੇਰਾ ਮਨ (ਸਧਾਰੇ) ਆਧਾਰ ਕੇ ਸਹਿਤ ਹੋ ਜਾਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇਰੇ) ਉਹਨਾਂ (ਗੁਣਾਂ) ਨੂੰ ਚੇਤੇ ਕਰ ਕੇ ਮੇਰਾ ਮਨ ਧੀਰਜ ਫੜਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਨ ਸਮ੍ਹ੍ਹਾਰਿ = (ਤੇਰੇ) ਉਹਨਾਂ (ਗੁਣਾਂ) ਨੂੰ ਚੇਤੇ ਕਰ ਕੇ। ਸਧਾਰੇ = ਸਹਾਰਾ ਫੜਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues es lo único que deseo cosechar. (2)"