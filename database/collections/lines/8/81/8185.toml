[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਕਉ; ਤਜਿ ਗਏ ਹਾਂ ॥"
page = 411
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "all that Thou shalt leave and depart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਸਾਰੇ ਨੂੰ ਤੂੰ ਛੱਡ ਕੇ ਟੁਰ ਜਾਵੇਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "you shall have to leave it all behind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪਦਾਰਥ ਸਭ ਕੋ ਤ੍ਯਾਗ ਜਾਤੇ ਭਏ ਹੈਂ ਕਿਸੀ ਕੇ ਭੀ ਸੰਗ ਨਹੀਂ ਜਾਤੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਖ਼ਰ ਉਸ ਸਾਰੀ ਨੂੰ ਛੱਡ ਕੇ ਇਥੋਂ ਚਲੇ ਗਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭ ਕਉ = ਉਸ ਸਾਰੀ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "lo tendrás que dejar todo, atrás todo;"