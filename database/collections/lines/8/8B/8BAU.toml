data = "ਜੈਸ ਜਗਤ ਮੋ ਕਰਾ ਪਸਾਰਾ ॥"
page = 200

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Now I describe the incarnation Ram  how he exhibited his performance in the world."

[[content]]
