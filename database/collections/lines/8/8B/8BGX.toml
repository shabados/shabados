[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਜਾਚਿਕ. ਦਰਸੁ ਪ੍ਰਭ ਮਾਗੈ; ਸੰਤ ਜਨਾ ਕੀ ਮਿਲੈ ਰਵਾਲ ॥੨॥੧੬॥੧੦੨॥"
page = 824
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Beggar Nanak prays for the vision of the Lord and wishes to be blessed with the dust of the saints' feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੰਗਤਾ ਨਾਨਕ ਸੁਆਮੀ ਦੇ ਦਰਸ਼ਨ ਦੀ ਯਾਚਨਾ ਕਰਦਾ ਹੈ ਅਤੇ ਸਾਧੂਆਂ ਦੇ ਪੈਰਾਂ ਦੀ ਖਾਕ ਦੀ ਦਾਤ ਲੋੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak, a beggar, asks for the Blessed Vision of God's Darshan; please, bless him with the dust of the feet of the Saints. ||2||16||102||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਜਾਚਕ ਤੇਰੇ ਦਰਸਨ ਕੋ ਮਾਂਗਤਾਂ ਹੂੰ ਔ ਤੇਰੀ ਕਿਰਪਾ ਤੇ ਤਿਨ ਤੇਰੇ ਸੰਤ ਜਨੋਂ ਕੀ ਚਰਨ (ਰਵਾਲ) ਧੂੜੀ ਮੇਰੇ ਕੋ ਮਿਲੇ॥੨॥੧੬॥੧੦੨॥☬ਨਾਮ ਸੇ ਲਾਭ ਉਚਾਰਨ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪ੍ਰਭੂ (ਦੇ ਦਰ) ਦਾ ਮੰਗਤਾ ਨਾਨਕ ਉਸ ਦੇ ਦਰਸਨ ਦਾ ਖ਼ੈਰ ਮੰਗਦਾ ਹੈ (ਅਤੇ ਅਰਜ਼ੋਈ ਕਰਦਾ ਹੈ ਕਿ ਉਸ ਦੇ) ਸੰਤ ਜਨਾਂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ਮਿਲ ਜਾਏ ॥੨॥੧੬॥੧੦੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਚਿਕ = ਮੰਗਤਾ। ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਰਵਾਲ = ਚਰਨ-ਧੂੜ ॥੨॥੧੬॥੧੦੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak sólo busca la Visión de su Señor, el Dios, sólo busca ser bendecido con el Polvo de los Pies de los Santos.  (2-16-102)"