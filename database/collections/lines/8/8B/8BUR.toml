[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਸੁਘਰ, ਸੁ ਧਾਰ ॥੬੭੦॥"
page = 748

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Comprehend the names of Tupak correctly by firstly uttering the word “Durjan” and saying the word “Dalni” at the end.670."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਨਾਮ ਤੁਪਕ ਦਾ ਬਣੇਗਾ। ਸਮਝਦਾਰੋ! ਸੋਚ ਲਵੋ ॥੬੭੦॥"