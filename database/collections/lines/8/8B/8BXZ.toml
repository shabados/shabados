[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਊ ਊਨ; ਨ ਕੋਊ ਪੂਰਾ ॥"
page = 252
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "No one is imperfect and no one is perfect."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਨਾਂ-ਮੁਕੰਮਲ ਨਹੀਂ ਅਤੇ ਕੋਈ ਮੁਕੰਮਲ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one is perfect, and no one is imperfect."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਣੇ ਆਪ ਨਾ ਕੋਈ ਊਣਾ ਹੀ ਹੈ ਅਰ ਨਾ ਕੋਈ ਪੂਰਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਆਪਣੀ ਚਤੁਰਾਈ ਨਾਲ) ਨਾਹ ਕੋਈ ਜੀਵ ਪੂਰਨ ਬਣ ਸਕਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਊਨ = ਸੱਖਣਾ, ਊਣਾ, ਘੱਟ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No es ni perfecto"