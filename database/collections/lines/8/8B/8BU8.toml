[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕੈ ਆਤਮੈ; ਹੋਇ ਪਰਗਾਸੁ ॥੧॥"
page = 236
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within his mind, the Divine Light shines."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਹਿਰਦੇ ਅੰਦਰ ਰੱਬੀ ਨੂਰ ਚਮਕਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "their souls are enlightened. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ (ਆਤਮੈ) ਮਨ ਮੇਂ ਗ੍ਯਾਨੁ ਹੋਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਉਸ ਦੇ ਆਤਮਾ ਵਿਚ ਚਾਨਣ ਹੋ ਜਾਂਦਾ ਹੈ (ਉਸ ਨੂੰ ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੂਝ ਪੈ ਜਾਂਦੀ ਹੈ) ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਗਾਸੁ = ਚਾਨਣਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a los diez órganos sensoriales, se ilumina.(1)"