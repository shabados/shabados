[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਖੰਡਿ ਭਗਤਿ ਨਿਰਤਿ; ਦੁਖੁ ਹੋਇ ॥੩॥"
page = 364
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The service and dance of the hypocrite bring sorrow."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੰਭੀ ਦੀ ਸੇਵਾ ਅਤੇ ਨਾਚ ਗ਼ਮ, ਰੰਜ ਉਪਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But the dances and the worship of the hypocrites bring only pain. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪਾਖੰਡ ਭਗਤੀ ਸੇ ਨਿਰਤਿ ਕਰਤੇ ਹੈਂ ਤਿਨ ਕੋ ਸਦਾ ਦੁਖੁ ਹੀ ਹੋਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਿਖਾਵੇ ਦੀ ਭਗਤੀ ਦੇ ਨਾਚ ਦੀ ਰਾਹੀਂ ਦੁੱਖ ਹੁੰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਖੰਡਿ = ਪਖੰਡ ਨਾਲ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero los bailes y la alabanza de los hipócritas traen sólo dolor. (3) P. 365."