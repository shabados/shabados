[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਜਪਤ; ਸਰਬ ਸੁਖੁ ਪਾਈਐ ॥"
page = 104
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By repeating the Name all the comforts are obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦਾ ਉਚਾਰਣ ਕਰਨ ਦੁਆਰਾ ਸਾਰੇ ਆਰਾਮ ਮਿਲ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chanting the Naam, all pleasures are obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਤਿਸ ਕੇ ਨਾਮ ਕੇ ਜਪਨੇ ਸੇ ਸੰਪੂਰਨ ਸੁਖ ਪਾਈਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪਿਆਂ ਹਰੇਕ ਕਿਸਮ ਦਾ ਸੁਖ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਬ = ਹਰੇਕ ਕਿਸਮ ਦਾ {सर्व}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Meditando en el Nombre obtenemos la Paz,"