[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਿਮ ਲਗੋ ਸ੍ਰਾਪ, ਸੁਨ ਭੂਪ, ਤੋਹਿ ॥"
page = 203

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O king! The manner in which we are breathing our last, you will also experience the same situation.”"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਜਨ! ਸੁਣੋ, ਤੁਹਾਨੂੰ ਸਾਡਾ ਇਹੀ ਸਰਾਪ ਲੱਗੇ।"