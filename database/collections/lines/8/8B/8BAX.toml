[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਉ ਲਗੁ ਜੀਉ ਪਰਾਣ; ਸਚੁ ਧਿਆਈਐ ॥"
page = 422
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As long as there are life and breath, meditate thou on the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਤਾਈ ਜਿੰਦਗੀ ਅਤੇ ਸੁਆਸ ਹਨ, ਤੂੰ ਸੱਚੇ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As long as there is the breath of life, meditate on the True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਲ ਲਗ ਜੀਉ ਕੇ ਸਰੀਰ ਮੇਂ ਪ੍ਰਾਣ ਰਹੈਂ, ਹੇ ਸਚੇ! ਤਬ ਤਕ ਤੇਰਾ ਹੀ ਧ੍ਯਾਨ ਕਰੀਐ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਤਕ (ਸਰੀਰ ਵਿਚ) ਜਿੰਦ ਹੈ ਤੇ ਸੁਆਸ ਹਨ (ਤਦ ਤਕ) ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਨੂੰ ਸਿਮਰਨਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਉ ਲਗੁ = ਜਦ ਤਕ। ਜੀਉ = ਜਿੰਦ। ਪਰਾਣ = ਸੁਆਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mientras haya respiración en la vida, medita en el Uno Verdadero,"