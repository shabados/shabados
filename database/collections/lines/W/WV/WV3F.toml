[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਸਕਲ ਬਿਕਲ; ਭ੍ਰਮ ਕਾਟੇ ਮੋਰ ॥"
page = 1195
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who has cut away all my perplexities and doubts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੇ ਮੇਰੇ ਸਾਰੇ ਵਿਆਕੁਲਪਣੇ ਅਤੇ ਸੰਦੇਹ ਕੱਟ ਛੱਡੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You have cut through all my confusion and doubt."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਬਿਅਕਲਪਣਾ ਔ ਮੇਰੇ ਭਰਮੁ ਸਭ ਕਾਟ ਦੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਮੇਰੇ ਸਾਰੇ ਔਖੇ ਭੁਲੇਖੇ ਦੂਰ ਕਰ ਦਿੱਤੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ ਨੇ। ਬਿਕਲ = ਕਠਨ। ਭ੍ਰਮ = ਵਹਿਮ, ਭੁਲੇਖੇ। ਮੋਰ = ਮੇਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien me ha liberado de todos mis temores y dudas."