[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਸਿਮਰਨਿ; ਅਪਦਾ ਟਰੈ ॥"
page = 986
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose meditation calamity is warded off."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਇਬਾਦਤ ਦੁਆਰਾ ਮੁਸੀਬਤ ਟਲ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating on Him, misfortune is avoided."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਸਿਮਰਨੇ ਕਰ ਬਿਪਤਾ ਟਲ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਸਿਮਰਨ ਨਾਲ (ਹਰੇਕ) ਬਿਪਤਾ (ਮਨੁੱਖ ਦੇ ਸਿਰ ਤੋਂ) ਟਲ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਪਦਾ = ਬਿਪਤਾ। ਟਰੈ = ਟਲ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La desgracia no cae sobre la cabeza más."