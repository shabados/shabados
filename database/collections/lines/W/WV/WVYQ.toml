[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਾਦਿ ਵਿਰੋਧਿ; ਨ ਪਾਇਆ ਜਾਇ ॥"
page = 230
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through controversies and contentions the Lord in not procured."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਹਿਸ ਮੁਬਾਹਿਸਿਆਂ ਅਤੇ ਦੰਗੇ-ਫ਼ਸਾਦਾ ਰਾਹੀਂ ਪ੍ਰਭੂ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through argument and debate, He cannot be found."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਾਦਿ ਵਿਰੋਧ ਸੇ ਨਹੀਂ ਪਾਇਆ ਜਾਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਕਿਸੇ ਧਾਰਮਿਕ) ਬਹਸ ਕਰਨ ਨਾਲ (ਜਾਂ ਕਿਸੇ ਧਰਮ ਦਾ) ਖੰਡਨ ਕਰਨ ਨਾਲ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਾਦਿ = ਵਾਦ ਦੀ ਰਾਹੀਂ, ਝਗੜੇ ਦੀ ਰਾਹੀਂ, ਧਾਰਮਿਕ ਬਹਿਸ ਦੀ ਰਾਹੀਂ। ਵਿਰੋਧਿ = ਵਿਰੋਧ ਨਾਲ, ਖੰਡਨ ਕਰਨ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por la riña y la lucha no Lo vas a encontrar, y tu mente y tu cuerpo se volverán inservibles,"