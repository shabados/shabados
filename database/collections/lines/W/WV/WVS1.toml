[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੰਮਣ ਮਰਣ ਕਾ ਮੂਲੁ ਕਟੀਐ; ਤਾਂ ਸੁਖੁ ਹੋਵੀ ਮਿਤ ॥੬੬॥"
page = 1421
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thiswise, thy root of birth and death shall be cut and then thou shall be blest with peace, O friend."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਤੇਰੀ ਜਨਮ ਤੇ ਮਰਨ ਦੀ ਜੜ੍ਹ ਵੱਢੀ ਜਾਊਗੀ ਅਤੇ ਤਦ ਤੂੰ ਆਰਾਮ ਨੂੰ ਪਰਾਪਤ ਹੋ ਜਾਵੇਗਾ ਹੇ ਮਿੱਤਰ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The root of birth and death will be cut away, and then, you shall find peace, O friend. ||66||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਸਤਿਗੁਰੋਂ ਕੀ ਕਿਰਪਾ ਤੇ ਜਬ ਜਨਮ ਮਰਣ ਕਾ ਮੂਲ ਜੋ ਅਗਿਆਨ ਹੈ, ਸੋ ਤੇਰਾ ਕਟਿਆ ਜਾਵੇਗਾ। ਹੇ ਮਿਤ੍ਰ! ਤਬ ਤੁਝ ਕੋ ਸੁਖ ਪ੍ਰਾਪਤਿ ਹੋਵੇਗਾ॥੬੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਤਰ੍ਹਾਂ ਜਦੋਂ) ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਦੀ ਜੜ੍ਹ ਵੱਢੀ ਜਾਂਦੀ ਹੈ, ਤਦੋਂ ਆਤਮਕ ਆਨੰਦ ਪ੍ਰਾਪਤ ਹੁੰਦਾ ਹੈ ॥੬੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂਲੁ = ਮੁੱਢ, ਜੜ੍ਹ। ਕਟੀਐ = ਵੱਢਿਆ ਜਾਂਦਾ ਹੈ। ਮਿਤ = ਹੇ ਮਿੱਤਰ ॥੬੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La raíz del nacimiento y de la muerte será cortada, y entonces encontrarás la Paz, oh amigo. (66)"