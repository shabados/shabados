[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਮ ਮਰਣ ਕਾ ਸਹਸਾ ਚੂਕਾ; ਬਾਹੁੜਿ ਕਤਹੁ. ਨ ਧਾਈ ॥੭॥"
page = 915
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The fear of birth and death is now over and I shall no more wander anywhere."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੰਮਣ ਤੇ ਮਰਨ ਦਾ ਡਰ ਹੁਣ ਮੁੱਕ ਗਿਆ ਹੈ ਅਤੇ ਮੈਂ ਮੁੜ ਕੇ ਕਿਧਰੇ ਭਟਕਾਂਗਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The fear of birth and death is taken away; I shall never wander again. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਸੇ ਮੇਰਾ ਜਨਮ ਔ ਮਰਨ ਕਾ ਸੰਸਾ ਚੂਕ ਗਿਆ ਹੈ, ਪੁਨਃ ਕਿਤੇ ਨਹੀਂ ਪਾਵੋਂਗਾ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਉਸ ਮਨੁੱਖ ਦਾ) ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਦਾ ਸਹਿਮ ਮੁੱਕ ਜਾਂਦਾ ਹੈ, ਉਹ ਫਿਰ ਹੋਰ ਕਿਤੇ (ਕਿਸੇ ਜੂਨ ਵਿਚ) ਨਹੀਂ ਭਟਕਦਾ ਫਿਰਦਾ ॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਸਾ = ਸਹਿਮ। ਚੂਕਾ = ਮੁੱਕ ਜਾਂਦਾ ਹੈ। ਬਾਹੁੜਿ = ਮੁੜ, ਫਿਰ। ਕਤਹੁ = ਕਿਸੇ ਹੋਰ ਪਾਸੇ। ਧਾਈ = ਦੌੜਦਾ, ਭਟਕਦਾ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El miedo de nacimientos y muertes se ha acabado; ya no vagamos más. (7)"