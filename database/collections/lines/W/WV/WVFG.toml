[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹਾ ਰੰਕ, ਰਾਜਾ ਕਵਨ, ਹਰਖ ਸੋਗ ਹੈ ਕਵਨ ॥"
page = 35

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Who are the pauper and the king? What are joy and sorrow?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕੌਣ ਭਿਖਾਰੀ ਹੈ, ਕੌਣ ਰਾਜਾ ਹੈ? ਅਤੇ ਹਰਖ ਅਤੇ ਸੋਗ ਕੀ ਹੈ?"