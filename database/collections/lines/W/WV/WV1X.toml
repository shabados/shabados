[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਜ︀ਯੋ ਨਾਗ ਰਾਜੰ ਤਕ੍ਰਯੋ ਇੰਦ੍ਰ ਲੋਕੰ ॥"
page = 142

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The king of Nagas ran away and took sheleter in the world of Indra."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਾਗ-ਰਾਜ ਤੱਛਕ ਭਜ ਕੇ ਇੰਦਰ ਲੋਕ ਜਾ ਪਹੁੰਚਿਆ।"