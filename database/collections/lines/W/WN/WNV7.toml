data = "ਤਹ ਗਏ ਭੂਪ ॥੩੩੦॥"
page = 233

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Ram had a marvellous body, when he came out after bath, on seeing his beauty the official of the place went to the royal lady Surapanakha.330."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ) ਬਣ ਦੇ ਰਾਖੇ ਉਥੇ ਚਲੇ ਗਏ ॥੩੩੦॥"