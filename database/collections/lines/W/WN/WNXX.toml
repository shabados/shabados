[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੇ ਜੀਅ ਨਿਲਜ; ਲਾਜ ਤੋੁਹਿ ਨਾਹੀ ॥"
page = 330
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O shameless fellow, do thou feel not shame?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੇਸ਼ਰਮ ਬੰਦੇ! ਕੀ ਤੈਨੂੰ ਸ਼ਰਮ ਨਹੀਂ ਆਉਂਦੀ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O shameless being, don't you feel ashamed?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰੇ ਨਿਲਜ੍ਯ ਜੀਵ! ਤੇਰੇ ਕੋ ਲਾਜ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੇਸ਼ਰਮ ਮਨ! ਤੈਨੂੰ ਸ਼ਰਮ ਨਹੀਂ ਆਉਂਦੀ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਲਜ = ਬੇ-ਸ਼ਰਮ। ਤਹਿ = ਤੈਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh sinvergüenza, ¿has perdido todo sentido de vergüenza?"