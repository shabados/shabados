[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਲ ਲਖੇ ਅਪੁਨੋ ਨ ਕਿਨੀ ਜਨ; ਗੋ ਦਵਰੀ ਤਿਹ ਸੋ ਹਿਤ ਕੀਤੋ ॥"
page = 309

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "None other paid attention to his boy  they all loved Krishna"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਨੇ ਵੀ ਆਪਣੇ ਬਾਲਕ ਨਾ ਪਛਾਣੇ ਅਤੇ ਗਊਆਂ ਨੇ ਵੀ ਦੌੜ ਕੇ ਵੱਛਿਆਂ ਨਾਲ ਪੂਰਾ ਹਿਤ ਕੀਤਾ।"