[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਗ ਵਿਚ ਵਡਾ ਦਾਨੋ, ਆਪ ਕਹਾਇਆ ॥"
page = 123

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He caused himself to be called the great demon."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜੋ) ਜਗਤ ਵਿਚ ਆਪਣੇ ਆਪ ਨੂੰ ਵੱਡਾ ਦੈਂਤ ਅਖਵਾਉਂਦਾ ਸੀ।"