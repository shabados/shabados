[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮਸਤਸਤੁ ਦੇਵੈ ॥"
page = 2
line = 14

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਨਮਸਤਸਤ ਦਾ ਉਚਾਰਨ ਨਮਸਤ-ਸੱਤ ਨਹੀਂ ਕਰਨਾ। ਇਹ ਸ਼ਬਦ ਨਮਸਤ+ਅਸਤ ਦਾ ਸੰਧੀ ਵਾਚੀ ਸ਼ਬਦ ਹੈ।"

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Salutation to Thee O Divine Lord!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ (ਕਰਮ-ਫਲ) ਦੇਣ ਵਾਲੇ! ਤੈਨੂੰ ਨਮਸਕਾਰ ਹੈ;"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਨਮਸਤੱਸਤੁ, ਦੇਵੈ ॥"