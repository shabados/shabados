[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹੋ; ਹੋ ਲਿਖੇ ਲਿਲਾਟ ॥੧॥ ਰਹਾਉ ॥"
page = 1297
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The love of God is writ in my brows, destiny. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਦਾ ਪ੍ਰੇਮ ਮੇਰੇ ਮੱਥੇ ਦੀ ਪ੍ਰਾਲਭਧ ਵਿੱਚ ਲਿਖਿਆ ਹੋਇਆ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord has written this destiny on my forehead. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹਰੀ ਕੋ ਤੌ ਭਜੀਤਾ ਹੈ ਜੌ ਸੁਭ ਕਰਮ ਮਸਤਕ ਪਰੁ ਲਿਖੇ ਹੂਏ ਹੋਵੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤੇਰੇ ਮੱਥੇ ਦੇ ਲੇਖ ਉੱਘੜ ਪੈਣਗੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੋ = ਹੇ ਭਾਈ! ਲਿਲਾਟ = ਮੱਥੇ ਉੱਤੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor ha grabado este Destino sobre mi frente. (1-Pausa)"