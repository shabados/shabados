type = "primary"
data = "ਰਣ ਰੰਗਿ ਚਾਰ ਉਤੰਗ ॥੧੮੬॥"
page = 569

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Imbued with the idea of fighting, getting enraged, the warriors riding the horses are swinging their arms and weapons.186."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਯੁੱਧ ਵਿਚ ਉੱਚੇ ਕਦ ਵਾਲੇ ਘੋੜੇ ਨੂੰ ਨਚਾ ਰਹੇ ਹਨ ॥੧੮੬॥"