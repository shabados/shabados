[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਠਾਕੁਰੁ ਏਕੁ; ਸਬਾਈ ਨਾਰਿ ॥"
page = 933
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The spouse is but One and all others are His brides."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੰਤ ਕੇਵਲ ਇੱਕ ਹੈ ਅਤੇ ਹੋਰ ਸਾਰੀਆਂ ਉੱਸ ਦੀਆਂ ਪਤਨੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is one Husband Lord, and all are His brides."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸ੍ਵਰ ਪਤੀ ਏਕ ਹੈ, ਸਭ ਸ੍ਰਿਸ੍ਟੀ ਤਿਸ ਕੀ ਇਸਤ੍ਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪਾਂਡੇ!) ਪ੍ਰਭੂ-ਪਾਲਣਹਾਰ ਇੱਕ ਹੈ, ਤੇ ਸਾਰੇ ਜੀਵ ਉਸ ਦੀਆਂ ਨਾਰੀਆਂ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਬਾਈ = ਸਾਰੀਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Esposo es Uno; los discípulos son todas Sus Novias."