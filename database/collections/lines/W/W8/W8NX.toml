data = "ਸਾਧਨ ਸਿਧਿ ਰੂਪ ਤਿਹ ਬੂਝਾ ॥"
page = 625

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The women considered him s the incarnation of lust and the saints saw him s adept"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਾਧਾਂ ਨੇ ਉਸ ਨੂੰ ਸਿੱਧ ਰੂਪ ਵਿਚ ਵਿਚਾਰਿਆ।"