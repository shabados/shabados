[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਡਰਤ ਬਿਰਹ ਕੀ ਅਗਨਿ ਸੌ; ਜਰਤ ਕਾਠ ਕੀ ਆਗਿ ॥੩੨॥"
page = 921

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Exactly like the dry wood blazes with crackling sounds.’(32)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵਿਯੋਗ ਦੀ ਅੱਗ ਤੋਂ ਡਰਦੀ ਹੋਈ ਕਾਠ ਦੀ ਅੱਗ ਵਿਚ ਸੜਦੀ ਹਾਂ ॥੩੨॥"