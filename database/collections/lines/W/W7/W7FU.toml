[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨੑ ਕਉ; ਹਰਿ ਪ੍ਰਭੁ ਲਏ ਮਿਲਾਇ ॥"
page = 364
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, whom he Lord God blends with himself,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੂੰ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਆਪਣੇ ਨਾਲ ਅਭੇਦ ਕਰ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those, whom the Lord God has blended with Himself"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੋ ਹਰਿ ਪ੍ਰਭੂ ਅਭੇਦ ਕਰ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਨੂੰ ਪਰਮਾਤਮਾ ਆਪਣੇ ਚਰਨਾਂ ਵਿਚ ਜੋੜ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es indescriptible el Estado de Éxtasis en que viven los que el Señor"