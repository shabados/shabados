data = "ਡਿੰਭ ਕਰੇ ਬਿਨੁ ਪਈਯਤ ਨਾਹੀਂ ॥"
page = 158

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Because without heresy, they do not gain money"

[[content]]
