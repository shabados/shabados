[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਖਿ ਲੇਹੁ; ਹਮ ਤੇ ਬਿਗਰੀ ॥"
page = 856
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Preserve me, O Lord, though I have disobeyed Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਰੱਖਿਆ ਕਰ, ਹੇ ਸਾਈਂ! ਭਾਵੇਂ ਮੈਂ ਤੇਰੀ ਅਵੱਗਿਆ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Save me! I have disobeyed You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਦਪਿ ਹਮਾਰੇ ਤੇ ਬਿਗਰੀ ਹੈ ਤਦਪਿ ਹੇ ਸੁਆਮੀ! ਹਮ ਕੋ ਜਨਮ ਮਰਨ ਸੇ ਰਾਖ ਲੇਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੇਰੀ ਲਾਜ ਰੱਖ ਲੈ। ਮੈਥੋਂ ਬੜਾ ਮਾੜਾ ਕੰਮ ਹੋਇਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਮ ਤੇ = ਅਸਾਂ ਜੀਵਾਂ ਤੋਂ, ਮੈਥੋਂ। ਬਿਗਰੀ = ਵਿਗੜੀ ਹੈ, ਵਿਗਾੜ ਹੋਇਆ ਹੈ, ਮਾੜਾ ਕੰਮ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sálvame, oh Dios, sálvame, pues he errado en Tu contra;"