[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਣਿ ਸੁਣਿ ਜੀਵਾ; ਸੋਇ ਤੁਮਾਰੀ ॥"
page = 1077
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I live by hearing and listening to Thy glory."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੀ ਸੋਭਾ ਸੁਣ ਸੁਣ ਕੇ ਜੀਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listening, listening to Your Glory, I live."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤਾਂ ਤੇਰੀ ਸੋਭਾ ਸੁਣ ਸੁਣ ਕੇ ਜੀਵਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰੀ ਸੋਭਾ ਸੁਣ ਸੁਣ ਕੇ ਮੈਂ ਆਤਮਕ ਜੀਵਨ ਹਾਸਲ ਕਰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਣਿ = ਸੁਣ ਕੇ। ਜੀਵਾ = ਜੀਵਾਂ, ਮੈਂ ਆਤਮਕ ਜੀਵਨ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹਾਂ। ਸੋਇ = ਖ਼ਬਰ, ਸੋਭਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vivo sólo si logro escuchar de Ti, oh Dios, ofrezco mi ser en sacrificio a Ti."