[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕਾ ਬਚਨੁ ਬਸੈ ਜੀਅ ਨਾਲੇ ॥"
page = 679
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru's word abides with my soul."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦਾ ਸ਼ਬਦ ਮੇਰੀ ਜਿੰਦਗੀ ਦੇ ਨਾਲ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru's Word abides with my soul."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਤਿਗੁਰੋਂ ਕਾ ਉਪਦੇਸ ਰੂਪ ਬਚਨ ਹਮਾਰੇ ਜੀ ਕੇ ਸਾਥ ਹੀ ਵਸਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਨਾਲ ਭਰਪੂਰ) ਗੁਰੂ ਦਾ ਸ਼ਬਦ ਮੇਰੀ ਜਿੰਦ ਦੇ ਨਾਲ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ ਨਾਲੇ = (ਮੇਰੀ) ਜਿੰਦ ਦੇ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Palabra del Shabd del Guru habita en mi Alma, no se hunde en el mar,"