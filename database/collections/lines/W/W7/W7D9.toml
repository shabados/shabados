[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੁ ਤਉ ਰਚਨੁ ਰਚਿਆ ਕਰਤਾਰਿ ॥"
page = 885
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This creation, the Creator has created."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਖਲਕਤ, ਸਿਰਜਣਹਾਰ ਨੇ ਸਾਜੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator Lord created this creation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੰਸਾਰ ਤੋ ਕਰਤਾਰ ਨੇ ਏਕ (ਰਚਨੁ) ਤਮਾਸ਼ਾ ਰਚਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਇਹ ਜਗਤ ਤਾਂ ਕਰਤਾਰ ਨੇ ਇਕ ਖੇਡ ਰਚੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਤਾਰਿ = ਕਰਤਾਰ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todo lo que se ve y aparece es la Creación del Señor;"