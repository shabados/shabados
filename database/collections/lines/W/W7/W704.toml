[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਪ੍ਰਗਾਸਿਆ; ਮਾਟੀ ਕੁੰਭੇਉ ॥"
page = 1351
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As a pitcher is produced from clay,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਘੜਾ ਮਿੱਟੀ ਤੋਂ ਪੈਦਾ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Just as the pitcher is made from clay,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਮਾਟੀ ਤੇ ਘੜਾ ਉਤਪਤਿ ਕੀਆ ਹੂਆ ਹੈ, ਸੋ ਘੜਾ ਮ੍ਰਿਤਕਾ ਰੂਪੁ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਮਿੱਟੀ ਤੋਂ ਘੜਾ ਬਣ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਉ = ਜਿਵੇਂ। ਕੁੰਭੇਉ = ਕੁੰਭ, ਘੜਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como la vasija se hace de barro, todo lo que existe se ha hecho de la Materia del Bienamado"