[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸੁਖ ਫਲੁ, ਪਾਰ ਉਤਾਰਾ ॥੮॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The gurmukhs who reject all superstitions enjoy happiness with their Lord and get across the world-ocean."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖ ਨੂੰ ਸੁਖ ਫਲ (ਪਾ੍ਰਪਤ ਹੁੰਦਾ ਹੈ) ਇਸ ਕਰ ਕੇ ਪਾਰ ਉਤਾਰਾ (ਪਾਉਂਦੇ ਯਾ ਕਰਦੇ ਹਨ)।"