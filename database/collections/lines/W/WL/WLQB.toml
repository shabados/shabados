[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਲਬਿਖ ਮੇਟੇ; ਸਬਦਿ ਸੰਤੋਖੁ ॥"
page = 1340
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru's holy word, my sins are effaced,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਬਾਣੀ ਰਾਹੀਂ ਮੇਰੇ ਪਾਪ ਮਿਟ ਗਏ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My sins are cut away, through the Word of the Shabad, and I have found contentment."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਗੁਰੋਂ ਕੇ ਸਬਦ ਸੇ ਸੰਤੋਖ ਹੂਆ ਹੈ ਤਿਸ ਕੇ ਕਿਲਬਿਖ ਮੇਟੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਨੇ ਆਪਣੇ) ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ (ਜਿਸ ਮਨੁੱਖ ਦੇ ਸਾਰੇ) ਪਾਪ ਮਿਟਾ ਦਿੱਤੇ (ਅਤੇ ਉਸ ਨੂੰ) ਸੰਤੋਖ ਬਖ਼ਸ਼ਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਲਬਿਖ = ਪਾਪ। ਮੇਟੇ = (ਗੁਰੂ ਨੇ) ਮਿਟਾ ਦਿੱਤੇ। ਸਬਦਿ = ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mis errores fueron borrados mediante la Palabra Bendita del Shabd y ahora he encontrado el Contentamiento,"