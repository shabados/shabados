[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੁਧਵਾਰਿ; ਆਪੇ ਬੁਧਿ ਸਾਰੁ ॥"
page = 841
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wednesday: The Lord Himself blesses man with sublime understanding."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੁੱਧਵਾਰ: ਪ੍ਰਭੂ ਆਪ ਹੀ ਇਨਸਾਨ ਨੂੰ ਸਰੇਸ਼ਟ ਸਮਝ ਪਰਦਾਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wednesday: He Himself bestows sublime understanding."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬੁਧ ਵਾਰ ਦ੍ਵਾਰੇ ਕਹਤੇ ਹੈਂ: ਸੋ ਵਾਹਿਗੁਰੂ ਜਿਸ ਕੋ ਆਪੇ ਹੀ (ਸਾਰੁ) ਸ੍ਰੇਸਟ ਬੁਧੀ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਪਰਮਾਤਮਾ) ਆਪ ਹੀ (ਮਨੁੱਖ ਨੂੰ) ਸ੍ਰੇਸ਼ਟ ਬੁੱਧੀ (ਬਖ਼ਸ਼ਦਾ ਹੈ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੇ = ਆਪ ਹੀ (ਦੇਂਦਾ ਹੈ)। ਬੁਧਿ ਸਾਰੁ = ਬੁੱਧੀ ਦਾ ਸਾਰ, ਸ੍ਰੇਸ਼ਟ ਬੁੱਧੀ {ਸਾਰੁ = ਤੱਤ, ਨਚੋੜ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Miércoles: El Señor Mismo cuida el intelecto del buscador."