[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਤਾ; ਤੂੰ ਸਭਨਾ ਕਾ ਸੋਈ ॥"
page = 360
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou, O maker, art the equal master of all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੇ ਰਚਣਹਾਰ! ਸਾਰਿਆਂ ਦਾ ਇੱਕੋ ਜੇਹਾ ਮਾਲਕ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Creator Lord, You are the Master of all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਰਤਾ ਪੁਰਖ! ਤੂੰ ਸਭ ਕਾ (ਸੋਈ) ਸੁਧ ਲੇਨੇ ਹਾਰਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਰਤਾਰ! ਤੂੰ ਸਭਨਾਂ ਹੀ ਜੀਵਾਂ ਦੀ ਸਾਰ ਰੱਖਣ ਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਤਾ = ਹੇ ਕਰਤਾਰ! ਸੋਈ = ਸਾਰ ਲੈਣ ਵਾਲਾ, ਰਾਖੀ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Creador, Tú perteneces a todos,"