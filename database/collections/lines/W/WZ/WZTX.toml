[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ; ਜਿਸੁ ਰਾਖੈ ਆਪਿ ॥"
page = 1147
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, whom the Lord Himself saves, in his mercy,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਮਿਹਰ ਦੁਆਰਾ ਜਿਸ ਦੀ ਸੁਆਮੀ ਖੁਦ ਰੱਖਿਆ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That person, whom the Lord, in His Mercy, saves"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸ੍ਵਰ ਕਿਰਪਾ ਕਰ ਕੇ ਜਿਸ ਕੀ ਆਪ ਰਖ੍ਯਾ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਆਪਣੀ ਮਿਹਰ ਕਰ ਕੇ ਜਿਸ ਮਨੁੱਖ ਦੀ ਆਪ ਰੱਖਿਆ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A quien el Señor salva, por Su Misericordia,"