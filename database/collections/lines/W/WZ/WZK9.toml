[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਨ ਬਿਧਿ; ਸਾਗਰੁ ਤਰੀਐ ॥"
page = 877
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In this way, the world-ocean is crossed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰੀਕੇ ਨਾਲ ਸੰਸਾਰ ਸਮੁੰਦਰ ਪਾਰ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In this way, you shall cross over the world-ocean."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਬਿਧ ਕਰ ਕੇ ਸੰਸਾਰ ਸਮੁੰਦਰ ਸੇ ਤਰਨਾ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਵਿਚ ਰਹਿੰਦੇ ਹੋਏ ਹੀ ਮਾਇਆ ਤੋਂ ਨਿਰਲੇਪ ਰਹਿਣਾ ਹੈ, ਬੱਸ!) ਇਹਨਾਂ ਤਰੀਕਿਆਂ ਨਾਲ ਹੀ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਲੰਘ ਜਾਈਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así es como uno podrá cruzar el océano del mundo."