type = "primary"
data = "ਰਹੀਮੋ ਕਰੀਮੋ ਮਕੀਨੋ ਮਕਾ ॥"
page = 1427

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is compassionate and provider of shelter"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ ਰਹਿਮ ਕਰਨ ਵਾਲਾ, ਕ੍ਰਿਪਾ ਕਰਨ ਵਾਲਾ, ਮਕਾਨਾਂ ਵਾਲਾ, ਮਕਾਨਾਂ ਵਿਚ ਵਿਆਪਣ ਵਾਲਾ,"