data = "ਬਿਰਹ ਬਿਕਲ ਹ੍ਵੈ ਮੂੰਡੀ ਧੁਨੀ ॥"
page = 1004

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Maulana heard such verbalisation, he became hysterical."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਬਿਰਹੋਂ ਨਾਲ ਵਿਆਕੁਲ ਹੋ ਕੇ ਸਿਰ ਹਿਲਾਉਣ ਲਗਾ।"