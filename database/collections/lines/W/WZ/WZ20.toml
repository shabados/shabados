[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਪਵਣ ਪਾਣੀ ਬੈਸੰਤਰ ॥"
page = 275
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many millions of winds, waters and fires, there are."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਕ੍ਰੋੜ ਹਨ, ਹਵਾਵਾਂ, ਜਲ ਅਤੇ ਅੱਗਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions are the winds, waters and fires."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਈ ਕ੍ਰੋੜੋਂ ਹੀ ਪਵਨ ਔ ਪਾਣੀ ਪੁਨਾ ਬੈਸੰਤਰ ਅਰਥਾਤ ਅਗਨੀ ਆਦੀ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਰੋੜਾਂ ਹਵਾ ਪਾਣੀ ਤੇ ਅੱਗਾਂ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੈਸੰਤਰ = ਅੱਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones los vientos, agua y fuegos."