[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛੂਟੈ ਰਾਮ ਨਾਮਿ; ਦੁਖੁ ਸਾਰਾ ॥"
page = 1176
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and through the Lord's Name, all their sorrows are ended."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸੁਆਮੀ ਦੇ ਨਾਮ ਰਾਹੀਂ ਉਹਨਾਂ ਦੇ ਸਾਰੇ ਦੁਖੜੇ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Lord's Name, all sorrows are eradicated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਮ ਨਾਮ ਕੋ ਜਪ ਕਰ ਸਭ ਦੁਖੋਂ ਸੇ ਛੂਟੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੀ ਬਰਕਤਿ ਨਾਲ ਉਸ ਦਾ ਸਾਰਾ ਦੁੱਖ ਮੁੱਕ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛੂਟੈ = ਮੁੱਕ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero si uno se olvida del Nombre, el sufrimiento lo acoge."