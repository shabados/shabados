[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਰਮੇ ਭੂਲੀ; ਰੇ ਜੈ ਚੰਦਾ ॥"
page = 526
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The world hast gone astray in doubt, O Jaichand,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੁਨੀਆਂ ਵਹਿਮ ਦੇ ਅੰਦਰ ਕੁਰਾਹੇ ਪਈ ਹੋਈ ਹੈ, ਹੇ ਜੈ ਚੰਦ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Deluded by doubt, O Jai Chand,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੈ ਚੰਦਾ! ਪਖੰਡੀ ਭੇਖੀਓਂ ਕੀ ਬੁਧੀ ਭਰਮ ਮੇਂ ਭੂਲੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੈ ਚੰਦ! ਸਾਰੀ ਲੋਕਾਈ (ਇਸੇ ਭੁਲੇਖੇ ਵਿਚ) ਭੁੱਲੀ ਪਈ ਹੈ (ਕਿ ਨਿਰਾ ਫ਼ਕੀਰੀ ਭੇਖ ਧਾਰਿਆਂ ਪਰਮਾਤਮਾ ਮਿਲ ਪੈਂਦਾ ਹੈ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇ = ਹੇ ਭਾਈ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Engañado por la duda, oh Yai Chand,"