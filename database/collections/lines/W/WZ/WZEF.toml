[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੰਗਲ ਸੂਖ ਕਲਿਆਣ ਤਿਥਾਈਂ ॥"
page = 1348
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "instead of worship, penance and self-mortification."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਪਾਸ਼ਨਾ, ਤਪੱਸਿਆ ਅਤੇ ਸਵੈ-ਰਿਆਜਤ ਦੀ ਥਾਂ ਤੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Bliss, peace and salvation are found in that place,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਅਸਥਾਨ ਮੇਂ ਉਤਸਾਹ ਔ ਸੁਖ ਪੁਨਾ ਮੁਕਤੀ ਸਦਾ ਰਹਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਹੀ ਸਾਰੇ ਸੁਖ ਸਾਰੀਆਂ ਖੁਸ਼ੀਆਂ ਸਾਰੇ ਆਨੰਦ ਹੁੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਗਲ = ਖ਼ੁਸ਼ੀਆਂ। ਕਲਿਆਣ = ਸੁਖ-ਸਾਂਦ। ਤਿਥਾਈਂ = ਉਸ ਥਾਂ ਵਿਚ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Éxtasis, Paz y Salvación son encontrados ahí"