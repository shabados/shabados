[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਿ ਕਬੀਰ. ਅਬ ਜਾਨਿਆ; ਗੁਰਿ. ਗਿਆਨੁ ਦੀਆ ਸਮਝਾਇ ॥"
page = 1103
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir, now I know my Lord. The Guru has instructed me in Divine knowledge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ, ਹੁਣ ਮੈਂ ਹਰੀ ਨੂੰ ਜਾਣ ਲਿਆ ਹੈ। ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਬ੍ਰਹਮ-ਵੀਹਾਰ ਦਰਸਾ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, now I know my Lord; the Guru has blessed me with spiritual wisdom."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਬ ਗੁਰੋਂ ਨੇ ਗਿਆਨ ਸਮਝਾਇ ਦੀਆ ਤਬ (ਅਬ) ਅਬਨਾਸੀ ਪੁਰਸੁ ਜਾਨ ਲੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ ਕਿ ਮੈਨੂੰ ਮੇਰੇ ਗੁਰੂ ਨੇ (ਜੀਵਨ ਦੇ ਸਹੀ ਰਸਤੇ ਦਾ) ਗਿਆਨ ਬਖ਼ਸ਼ ਦਿੱਤਾ ਹੈ। ਮੈਨੂੰ ਹੁਣ ਸਮਝ ਆ ਗਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, ahora ya sé, pues el Guru me ha instruido en Su Sabiduría"