[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਨੈ ਬੂਝਨਹਾਰੈ ਖਾਏ ॥੧॥ ਰਹਾਉ ॥"
page = 477
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and some man of understanding has eaten them. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਵਿਚਾਰਵਾਨ ਪੁਰਸ਼ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਖਾਧਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but only the rare man of understanding eats them. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਬੂਝਨੇ ਹਾਰੇ ਨੇ ਇਹ ਆਂਬ ਖਾਏ ਹੈਂ, ਭਾਵ ਕਿਸੀ ਉਤਮ ਅਧਿਕਾਰੀ ਨੇ ਇਹ ਗੁਨ ਧਾਰਨ ਕਰੇ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਖਾਧੇ ਕਿਸੇ ਵਿਰਲੇ ਵਿਚਾਰ ਵਾਲੇ ਨੇ ਹਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਨੈ = ਕਿਸੇ ਵਿਰਲੇ ਨੇ। ਬੂਝਨਹਾਰੈ = ਗਿਆਨਵਾਨ ਨੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero sólo los Sabios conocen su sabor. (1-Pausa)"