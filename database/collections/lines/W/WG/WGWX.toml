[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹਿੰਦੂ ਆਖਨਿ ਰਾਮ ਰਾਮੁ; ਮੁਸਲਮਾਣਾਂ ਨਾਉ ਖੁਦਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Hindus remember Ram-Ram and the Muslims named Him Khuda."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਹਿੰਦੂ ਰਾਮ ਰਾਮ ਆਖਣ ਲੱਗੇ, ਮੁਸਲਮਾਨ ਖੁਦਾਇ ਦਾ ਨਾਉਂ ਲੈਣ ਲੱਗੇ।"