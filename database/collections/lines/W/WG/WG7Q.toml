data = "ਖ਼ਲਾਸਮ ਬਿਦਿਹ ਅਹਦ ਕਰਦਮ ਕਬੂਲ ॥"
page = 1407

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Now, let me go free. I will obey your command,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਇਨ੍ਹਾਂ (ਜਲਾਦਾਂ) ਤੋਂ ਖ਼ਲਾਸ ਕਰਾ। ਮੈਂ ਤੇਰਾ ਬਚਨ ਮੰਨਦਾ ਹਾਂ।"