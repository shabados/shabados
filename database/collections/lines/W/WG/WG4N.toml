[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵੁਠੈ ਜੰਮੈ ਬੀਜਿਆ; ਸਤਿਗੁਰੁ ਮਤਿ ਚਿਤਵੈ ਫਲ ਭੋਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Sown seed sprouts only after it rains but adopting the teachings of the Guru, one attain fruit instantly."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੀਂਹ ਦੇ ਵਰ੍ਹਿਆਂ ਬੀਜਿਆ ਹੋਇਆ ਜੰਮਦਾ ਹੈ, ਸਤਿਗੁਰੂ ਦੀ ਸਿਖਿਆ ਦੇ ਚਿਤਵਣ ਨਾਲ ਹੀ ਛੇਤੀ ਫਲ (ਮਿਲਦਾ) ਹੈ।"