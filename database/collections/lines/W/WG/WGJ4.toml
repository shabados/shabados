[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਰੇ ਆਨਿ ਠਾਢੋ ਭਯੋ; ਸਿੰਘ ਰੋਸ ਕੇ ਸਾਥ ॥੧੭॥"
page = 926

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And down there the lion, which was right furious, took his place.(l7)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ੇਰ ਕ੍ਰੋਧਵਾਨ ਹੋ ਕੇ (ਬ੍ਰਿਛ ਦੇ) ਹੇਠਾਂ ਆ ਕੇ ਖੜੋ ਗਿਆ ॥੧੭॥"