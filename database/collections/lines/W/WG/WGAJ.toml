[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਖੁ ਭੰਨਾ ਭੈ ਭੰਜਨਹਾਰ ॥"
page = 1271
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is the Destroyer of pain and the Remover of fear."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੁਖੜਾ ਹਰਨਹਾਰ ਅਤੇ ਡਰ! ਦੂਰ ਕਰਨ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Destroyer of pain, the Eradicator of fear."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭੈ ਭੰਜਨਹਾਰ ਨੇ ਕਾਲਾਦਿ ਦੁਖ ਕੋ (ਭੰਨਾ) ਤੋੜ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੀਵਾਂ ਦੇ) ਸਾਰੇ ਡਰ ਨਾਸ ਕਰ ਸਕਣ ਵਾਲੇ ਉਸ ਪ੍ਰਭੂ ਨੇ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੰਨਾ = ਭੰਨ ਦਿੱਤਾ, ਦੂਰ ਕਰ ਦਿੱਤਾ। ਭੈ = (ਲਫ਼ਜ਼ 'ਭਉ' ਤੋਂ ਬਹੁ-ਵਚਨ) ਸਾਰੇ ਡਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el Destructor del dolor,"