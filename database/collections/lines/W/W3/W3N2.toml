[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇਤਾ ਦੇਹਿ; ਤੇਤਾ ਹਉ ਖਾਉ ॥"
page = 25
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever Thou givest me, that I eat."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਝ ਤੂੰ ਮੈਨੂੰ ਦਿੰਦਾ ਹੈ, ਉਹੀ ਮੈਂ ਖਾਂਦੀ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever You give me, that is what I eat."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਤਨਾ ਆਪ ਦੇਤੇ ਹੋ, ਉਤਨਾ ਹੀ ਮੈਂ ਖਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜੋ ਕੁਝ ਤੂੰ ਮੈਨੂੰ ਦੇਂਦਾ ਹੈਂ, ਮੈਂ ਉਹੀ ਖਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੇਤਾ = ਜਿਤਨਾ ਕੁਝ। ਦੇਹਿ = ਤੂੰ ਦੇਂਦਾ ਹੈਂ। ਹਉ = ਮੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo que sea que me das eso me como."