[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨਸੈ ਸਗਲ ਸੰਤਾਪੁ ॥"
page = 895
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thus all thine afflictions shall be past."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇੰਞ ਤੇਰੇ ਸਾਰੇ ਕਲੇਸ ਨਾਸ ਹੋ ਜਾਣਗੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and all your troubles shall depart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਤੇ ਸਾਰੇ ਹੀ ਦੁਖ ਬਿਨਸ ਜਾਇੰਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਮ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਸਾਰਾ ਦੁੱਖ-ਕਲੇਸ਼ ਮਿਟ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲ = ਸਾਰਾ। ਸੰਤਾਪੁ = ਦੁੱਖ-ਕਲੇਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y todas tus aflicciones pasarán,"