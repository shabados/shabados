[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਨਾਮ ਬਿਨੁ. ਕੋ ਥਿਰੁ ਨਾਹੀ ਜੀਉ; ਬਾਜੀ ਹੈ ਸੰਸਾਰਾ ॥"
page = 246
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the pervading God's Name, nothing is stable. This world is but a play."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਆਪਕ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦੇ ਬਗੈਰ ਕੁਛ ਭੀ ਮੁਸਤਕਿਲ ਨਹੀਂ। ਇਹ ਜਹਾਨ ਇਕ ਖੇਡ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Lord's Name, nothing is stable. This world is just a drama."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਰਾਮ ਨਾਮ ਬਿਨਾਂ ਕੋਈ ਇਸਥਿਰੁ ਨਹੀਂ ਹੈ। ਇਹੁ ਸੰਸਾਰ ਸਭ ਬਾਜੀ ਅਰਥਾਤ ਨਾਸ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਇਹ ਜਗਤ (ਪਰਮਾਤਮਾ ਦੀ ਰਚੀ ਹੋਈ ਇਕ) ਖੇਡ ਹੈ (ਇਸ ਵਿਚ) ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਤੋਂ ਬਿਨਾ ਹੋਰ ਕੋਈ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋ = ਕੋਈ ਭੀ। ਥਿਰੁ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ। ਬਾਜੀ = ਖੇਡ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nada es eterno excepto el Naam, el Nombre del Señor, oh amigo, y el mundo es solamente un teatro puesto en el escenario."