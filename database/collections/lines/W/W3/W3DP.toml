[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ, ਸਚਾ ਅਮਰਿ ਸੁਹੇਲਾ ॥੧੧॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Guru Amar Das is the truth mate, blest one gurmukh, the Guru oriented."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਚਾ ਗੁਰਮੁਖ ਗੁਰੂ ਅਮਰਦਾਸ ਸੁਖ ਸਰੂਪ ਹੈ।"