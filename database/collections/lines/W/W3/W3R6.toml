data = "ਡਾਰਿ ਮਹਲ ਊਪਰ ਤੇ ਦੀਜੈ ॥੭॥"
page = 997

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Whatever the way you want me to treat him, I will abide by.’(7)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜੇ ਕਹੋ ਤਾਂ) ਉਸ ਨੂੰ ਮਹੱਲ ਦੇ ਉਪਰੋਂ (ਹੇਠਾਂ) ਸੁਟ ਦਿਆਂ ॥੭॥"