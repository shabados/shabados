data = "ਨਾਹਕ ਅਪਨੋ ਮੂੰਡ ਮੁੰਡਾਯੋ ॥੧੪॥"
page = 913

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Neither the friend attained anything rather he got his head shaved off without any purpose (faced humiliation).(14)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵਿਅਰਥ ਵਿਚ ਆਪਣਾ ਸਿਰ ਮੁੰਨਵਾ ਲਿਆ ॥੧੪॥"