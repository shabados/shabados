[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮੋ ਰਾਜਸੰ ਤਾਮਸੰ ਸਾਂਤ ਰੂਪੇ ॥"
page = 10
line = 5

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਸਾਤ ਦਾ ਉਚਾਰਨ ਸ਼ਾਂਤ ਕਰਨਾ ਠੀਕ ਨਹੀਂ। ਭਾਈ ਤਲਵਾੜਾ ਜੀ ਮੁਤਾਬਕ \"ਸਾਂਤ\" ਦੀ ਥਾਂ ਤੇ \"ਸਾਤ\" ਪਾਠ ਸ਼ੁਧ ਹੈ।"

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Salutation to Thee O embodiment of peace! Salutation to Thee O Entity bearing three modes!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਜੋ, ਤਮੋ ਅਤੇ ਸਤੋ ਰੂਪ! (ਤੈਨੂੰ) ਨਮਸਕਾਰ ਹੈ;"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਨਮੋ, ਰਾਜਸੰ ਤਾਮਸੰ; ਸਾਂਤ ਰੂਪੇ ॥"