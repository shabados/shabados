[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇ. ਭਵ ਸਾਗਰ ਉਤਰੇ ਪਾਰਿ ॥੨॥"
page = 1186
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "they cross over the terrible world-ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਭਿਆਨਕ ਸੰਸਾਰ ਸਮੁੰਦਰ ਨੂੰ ਤੁਰ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "cross over the terrifying world-ocean. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇ ਪੁਰਸ ਸੰਸਾਰ ਸਮੁੰਦ੍ਰ ਸੇ ਪਾਰ ਉੱਤਰ ਗਏ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰੇ ਸੰਸਾਰ-ਸਮੁੰਦਰ (ਦੇ ਵਿਕਾਰਾਂ) ਤੋਂ ਪਾਰ ਲੰਘ ਜਾਂਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਉਹ ਮਨੁੱਖ {ਬਹੁ-ਵਚਨ}। ਭਵ ਸਾਗਰ = ਸੰਸਾਰ-ਸਮੁੰਦਰ। ਕੋ = ਦਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "fueron llevados a través del terrible mar de las existencias materiales. (2)"