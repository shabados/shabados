[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ ਸਉ ਕੂੜੀਆ; ਕੂੜੁ ਕਬਾੜੁ ॥"
page = 662
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If a men tells hundreds of lies to conceal his falsehood,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਬੰਦਾ ਆਪਣੇ ਝੂਠ ਨੂੰ ਲੁਕੋਣ ਲਈ ਸੈਂਕੜੇ ਝੂਠ ਪਿਆ ਬੋਲੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He may tell hundreds of lies to conceal his falsehood,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ (ਕੂੜੁ) ਝੂਠੇ ਪੁਰਸ ਜੇਕਰ ਸੈਂਕੜੇ (ਕੂੜੀਆ) ਝੂਠੀਆਂ (ਕਬਾੜੁ) ਗੱਪਾਂ ਮਾਰੇਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਆਪਣਾ ਇਤਬਾਰ ਜਮਾਣ ਲਈ ਚਲਾਕ ਬਣ ਕੇ) ਝੂਠੀਆਂ ਗੱਪਾਂ ਅਤੇ ਝੂਠ ਕਬਾੜ ਦੀਆਂ ਗੱਲਾਂ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੂੜੀਆ = ਝੂਠੀਆਂ ਗੱਲਾਂ। ਕੂੜੁ = ਝੂਠ। ਕਬਾੜੁ = ਕੂੜਾ ਕਰਕਟ, ਟੁੱਟਾ-ਭੱਜਾ ਮਾਲ, ਵਿਅਰਥ ਕੰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aun si el falso, con cien trucos,"