[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਘਟ ਪ੍ਰਤਿਪਾਲ ॥"
page = 838
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God sustains all the hearts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦਿਲਾਂ ਦੀ ਪਰਵਰਿਸ਼ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "cherishes and and sustains every heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ (ਘਟ) ਸਰੀਰ ਧਾਰੀਓਂ ਕੀ ਪਾਲਨਾਂ ਕਰਨਹਾਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਭ ਸਰੀਰਾਂ ਦੇ ਪਾਲਣਹਾਰ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਟ = ਸਰੀਰ। ਪ੍ਰਤਿਪਾਲ = ਹੇ ਪਾਲਣ ਵਾਲੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sostienes a los corazones por todas partes."