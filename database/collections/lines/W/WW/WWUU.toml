[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਚਕ ਜਨ. ਦਾਤਾ ਪਾਇਆ ॥"
page = 655
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "A beggar has found the Giver,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੰਗਤੇ ਨੇ ਦਾਤਾਰ ਨੂੰ ਪਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The humble beggar has found the Great Giver,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੈਂ ਜਾਚਕ ਜਨ ਨੇ ਸਤਿਗੁਰ ਦਾਤਾ ਪਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਮੰਗਤਾ (ਬਣ ਕੇ ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੋਂ ਮੰਗਦਾ) ਹੈ ਉਸ ਨੂੰ ਦਾਤਾ-ਪ੍ਰਭੂ ਆਪ ਮਿਲ ਪੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਚਕ = ਮੰਗਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El buscador ha encontrado al Señor Benévolo y lo que da,"