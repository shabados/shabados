[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਗਿਆਨੀ ਅੰਧੇ ਦੂਜੈ ਲਾਗੇ ॥"
page = 1063
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The blind, ignorant one are yoked to another."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਨ੍ਹੇ, ਬੇਸਮਝ ਹੋਰਸ ਨਾਲ ਜੁੜੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The blind and ignorant are attached to duality."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਗ੍ਯਾਨੀ ਅੰਧੇ ਜੋ ਹੈਂ, ਸੋ ਦ੍ਵੈਤ ਭਾਉ ਮੇਂ ਲਾਗੇ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਅੰਨ੍ਹੇ ਹੋ ਚੁਕੇ ਤੇ ਆਤਮਕ ਜੀਵਨ ਤੋਂ ਬੇ-ਸਮਝ ਮਨੁੱਖ (ਪਰਮਾਤਮਾ ਨੂੰ ਛੱਡ ਕੇ) ਹੋਰ ਹੋਰ ਵਿਚ ਲੱਗੇ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਜੈ = (ਪਰਮਾਤਮਾ ਨੂੰ ਭੁਲਾ ਕੇ) ਹੋਰ ਹੋਰ (ਮੋਹ) ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los ciegos ignorantes viven apegados al otro,"