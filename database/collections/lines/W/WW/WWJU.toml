[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਤਿਹ ਸੁਖੁ ਪਾਇਆ; ਜਾ ਕੈ ਹੀਅਰੈ ਏਕ ॥੧੪॥"
page = 253
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, he within whose heart there is but One Lord, obtain peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਜਿਸ ਦੇ ਦਿਲ ਅੰਦਰ ਕੇਵਲ ਇਕ ਪ੍ਰਭੂ ਹੈ ਉਹ ਆਰਾਮ ਪਾ ਲੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, one whose heart is filled with the One Lord finds peace. ||14||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਨ ਕੇ ਹਿਰਦੇ ਮੇਂ ਏਕੁ ਪਰਮੇਸ੍ਵਰ ਵਸ ਰਹਾ ਹੈ ਤਿਨੋ ਨੇ ਸੁਖ ਪਾਯਾ ਹੈ॥੧੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਇਕ ਪ੍ਰਭੂ ਵੱਸ ਪਿਆ ਹੈ, ਉਸ ਨੇ ਆਤਮਕ ਆਨੰਦ ਹਾਸਲ ਕਰ ਲਿਆ ਹੈ ॥੧੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਹ = ਉਸ ਨੇ। ਹੀਅਰੈ = ਹਿਰਦੇ ਵਿਚ ॥੧੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "dice Nanak, sí, llevando al Señor en el fondo del corazón.(14)"