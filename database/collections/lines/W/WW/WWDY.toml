[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਤ ਹੀ ਅਵਧੇਸ ਕਉ; ਇਹ ਭਾਤਿ ਬੋਲੀ ਬੈਨ ॥"
page = 220

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Going in the presence of king of Oudh, she said this :"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਦੋਂ ਸੁਰਤ ਪਰਤੀ ਤਾਂ) ਜਾਂਦਿਆਂ ਹੀ ਰਾਜੇ ਦਸ਼ਰਥ ਨੂੰ ਇਸ ਤਰ੍ਹਾਂ ਬੋਲਣ ਲੱਗੀ-ਹੇ ਰਾਜਨ!"