[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਤਿਗੁਰਿ ਪੂਰੇ, ਪਾਰਿ ਉਤਾਰੇ ॥੨੦॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The perfect Guru has fetched across the world ocean."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(੯) ਪੂਰੇ ਸਤਿਗੁਰੂ ਨੇ (ਹੀ ਏਹ) ਪਾਰ ਉਤਾਰੇ।"