[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖਿਨੁ ਖਿਨੁ ਨਾਮੁ ਸਮਾਲੀਐ; ਗੁਰਮੁਖਿ ਪਾਵੈ ਕੋਇ ॥"
page = 29
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Every moment remember God's Name. Hardly any one obtains it through the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਮੁਹਤ ਹਰੀ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰ। ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਕੋਈ ਵਿਰਲਾ ਹੀ ਇਸ ਨੂੰ ਪਰਾਪਤ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Each and every moment, dwell on the Naam, the Name of the Lord; the Gurmukhs obtain it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤਿਨ ਗੁਰਮੁਖੋਂ ਕੋ ਮਿਲ ਕਰ ਖਿਨ ਖਿਨ ਮੇਂ ਨਾਮ ਕਾ ਸਮਾਲਨਾ ਕਰੀਏ, ਪਰੰਤੂ ਤਿਨ ਗ੍ਯਾਨਵਾਨ ਪੁਰਸੋਂ ਕੋ ਕੋਈ ਬਿਰਲਾ ਹੀ ਪੁਰਸ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ) ਸੁਆਸ ਸੁਆਸ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਨਾ ਚਾਹੀਦਾ ਹੈ, ਜੇਹੜਾ ਕੋਈ ਨਾਮ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਮਾਲੀਐ = ਸਿਮਰਨਾ ਚਾਹੀਦਾ ਹੈ। ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੋ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nombre del Señor en todo momento, pero sólo los que voltean hacia el Señor lo obtienen."