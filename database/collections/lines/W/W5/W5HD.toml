[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ; ਮੋਹਿ ਦੇਹੁ ਨਾਮੁ ॥੪॥੫॥"
page = 1181
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In Thy mercy, bless Thou me with Thy Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿਹਰ ਧਾਰ ਕੇ ਤੂੰ ਮੈਨੂੰ ਆਪਣਾ ਨਾਮ ਪ੍ਰਦਾਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Be merciful, and bless me with Your Name. ||4||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕ੍ਰਿਪਾ ਦ੍ਰਿਸਟੀ ਕਰ ਕੇ ਮੈਨੂੰ ਆਪਣਾ ਨਾਮ ਬਖਸੀਏ॥੪॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਿਹਰ ਕਰ ਕੇ ਮੈਨੂੰ ਆਪਣਾ ਨਾਮ ਬਖ਼ਸ਼ ॥੪॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਿ = ਮੈਨੂੰ ॥੪॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "muéstrame Tu Compasión y bendíceme con Tu Nombre. (4-5)"