[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬੇਖ ਅਨੂਪ ਸਜੇ ਤਨ ਪੈ; ਤਿਨ ਬੇਖਨ ਕੋ ਬਰਨਿਓ ਨਹੀ ਜਾਈ ॥"
page = 549

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Those women are wearing several unique garbs, which cannot be described"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੇ ਸ਼ਰੀਰਾਂ ਉਤੇ ਅਨੂਪਮ ਵੇਸ ਸਜੇ ਹੋਏ ਹਨ। (ਉਨ੍ਹਾਂ) ਵੇਸਾਂ ਦਾ ਵਰਣਨ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ।"