[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਹ ਕਾਇਆ ਪਵਿਤੁ ਹੈ ਸਰੀਰੁ ॥"
page = 1065
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sanctified is this human body and frame,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਵਨ ਪੁਨੀਤ ਹੈ ਇਹ ਮਨੁੱਖੀ ਜਿਸਮ ਅਥਵਾ ਦੇਹ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This body is sanctified and purified;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਾਇਆ ਸਥੂਲ ਔ ਸਰੀਰ ਸੂਖਮੁ ਤਿਸ ਕੇ ਪਵਿਤ੍ਰ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਨੁੱਖ ਦਾ ਇਹ ਸਰੀਰ (ਵਿਕਾਰਾਂ ਤੋਂ ਬਚ ਕੇ) ਪਵਿੱਤਰ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਇਆ = ਸਰੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, puro y santificado es su cuerpo, pues es a través de la Palabra del Guru,"