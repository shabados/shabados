data = "ਤਾ ਦਿਨ ਬਜੇ ਜੁਝਾਊ ਬਾਜਾ ॥"
page = 606

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the king of Manchuria was conquered, on that day, the war-drums sounded"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਿਨ ਮਾਰੂ ਵਾਜੇ ਵਜਣ ਲਗੇ ਹਨ।"