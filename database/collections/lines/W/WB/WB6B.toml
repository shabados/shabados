[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਿਮਰਣ ਸਾਸਿ ਗਿਰਾਸਿ, ਦੇਸ ਵਿਦੇਸਿਆ ॥੭॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Be they anywhere in the country or abroad they remember God with every inhalation and exhalation of breath."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਨਾਮ ਦਾ) ਸਿਮਰਣ ਸਾਸ ਗਿਰਾਸ ਕਰਦੇ ਹਨ, ਦੇਸ਼ ਵਿਖੇ ਰਹਿਕੇ ਬੀ ਵਿਦੇਸ਼ ਹੀ ਸਮਝਦੇ ਹਨ।"