[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੇਖਨ ਦੇਵ ਅਦੇਵ ਮਹਾ ਹਵ; ਚੜੇ ਬਿਮਾਨ ਸੁਹਾਏ ॥"
page = 685

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The gods and demons ascended their air-vehicles in order to see the war"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ) ਮਹਾਨ ਹਵਨ (ਯੁੱਧ) ਨੂੰ ਵੇਖਣ ਲਈ ਦੇਵਤੇ ਅਤੇ ਦੈਂਤ ਵਿਮਾਨਾਂ ਉਤੇ ਚੜ੍ਹੇ ਹੋਏ ਸ਼ੋਭਾ ਪਾ ਰਹੇ ਹਨ।"