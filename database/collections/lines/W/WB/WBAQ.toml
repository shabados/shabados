[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਸਰੁ ਸਾਗਰੁ; ਨਿਰਮਲੁ ਸੋਈ ॥"
page = 128
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That God is the sublime and pure ocean,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਵਾਹਿਗੁਰੂ ਸਰੇਸ਼ਟ ਅਤੇ ਪਵਿੱਤ੍ਰ ਸਮੁੰਦਰ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is the most pure and sublime Ocean."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਹਰੀ ਕੇ ਸੰਤੋਂ ਕਾ ਸੰਗ ਹੈ, ਸੋ ਮਾਨ ਸਰੋਵਰ ਕੇ (ਸਰੁ) ਸਮ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਉਹ ਪਰਮਾਤਮਾ ਹੀ ਪਵਿਤ੍ਰ ਮਾਨਸਰੋਵਰ ਹੈ ਪਵਿਤ੍ਰ ਸਮੁੰਦਰ ਹੈ (ਪਵਿਤ੍ਰ ਤੀਰਥ ਹੈ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰੁ = (ਮਾਨ-) ਸਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor, el Uno siempre Puro, es el Naad;"