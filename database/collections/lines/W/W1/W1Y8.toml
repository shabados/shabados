[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਿ ਸਿਮਰਿ; ਸਿਮਰਿ ਸੁਖੁ ਪਾਇਆ ॥"
page = 202
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By remembering, remembering, remembering God, I have procured peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦਾ ਆਰਾਧਨ, ਆਰਾਧਨ, ਆਰਾਧਨ ਕਰਨ ਦੁਆਰਾ ਮੈਂ ਆਰਾਮ ਪ੍ਰਾਪਤ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating, meditating, meditating in remembrance, I have found peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸਿਮਰਨੇ ਜੋਗ ਕੇ ਸਿਮਰਨ ਕੋ ਸਿਮਰ ਕਰ ਸੁਖੁ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਗੋਬਿੰਦ ਦਾ ਆਰਾਧਨ ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਹੀ ਮਿਲਦਾ ਹੈ।) ਉਸ ਨੇ ਗੋਬਿੰਦ ਦਾ ਨਾਮ ਸਿਮਰ ਸਿਮਰ ਕੇ ਆਤਮਕ ਆਨੰਦ ਮਾਣਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਮਰਿ = ਸਿਮਰ ਕੇ। ਸੁਖੁ = ਆਤਮਕ ਆਨੰਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Logré la Paz cuando habité en el Naam,"