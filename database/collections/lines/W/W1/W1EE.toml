[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰੈ ਗਜਿੰਦੁ; ਸੁੰਡ ਕੀ ਚੋਟ ॥"
page = 1165
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The elephant struck him a blow with his trunk,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਾਥੀ ਉਸ ਨੂੰ ਆਪਣੀ ਸੁੰਡ ਨਾਲ ਸੱਟ ਮਾਰਦਾ ਸੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The elephant attacked him with his trunk,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਾਥੀ ਸੁੰਡ ਕੀ ਚੋਟ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਾਥੀ ਆਪਣੀ ਸੁੰਡ ਦੀ ਚੋਟ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਜਿੰਦੁ = ਹਾਥੀ, ਵੱਡਾ ਹਾਥੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El elefante torció su tronco como haciéndome un saludo y así fui salvado,"