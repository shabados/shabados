data = "ਸੀਲ ਮੰਜਰੀ ਤਾ ਕੀ ਬਾਮਾ ॥੩॥"
page = 868

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "His name was Udhe Karan, whereas wife was known as Sheel Manjari.(3)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸ਼ੀਲ ਮੰਜਰੀ ਉਸ ਦੀ ਇਸਤਰੀ ਦਾ ਨਾਂ ਸੀ ॥੩॥"