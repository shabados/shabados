[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਖਨਹਾਰ ਸਦਾ ਮਿਹਰਵਾਨ ॥"
page = 1271
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Saviour-Lord is ever merciful,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਖਿਆ ਕਰਨ ਵਾਲਾ-ਸੁਆਮੀ ਸਦੀਵ ਹੀ ਦਇਆਲੂ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Savior Lord is kind and compassionate forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਖ੍ਯਾ ਕਰਨੇ ਵਾਲਾ ਹਰੀ ਸਦਾ ਮਿਹਰਬਾਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰੱਖਿਆ ਕਰਨ ਦੀ ਸਮਰਥਾ ਵਾਲਾ ਪਰਮਾਤਮਾ (ਜੀਵਾਂ ਉੱਤੇ) ਸਦਾ ਦਇਆਵਾਨ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਖਣਹਾਰ = ਰੱਖਿਆ ਕਰ ਸਕਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Señor Salvador es siempre Bondadoso y Compasivo"