[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਭਾਂਤਿ ਕਰਿ; ਸੇਵਾ ਕਰੀਐ ॥"
page = 391
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In various ways, render thou service unto the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਤਰੀਕਿਆਂ ਨਾਲ ਤੂੰ ਸਾਹਿਬ ਦੀ ਘਾਲ ਕਮਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serve Him in many different ways;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਸੁਹਾਗਨੋਂ ਕੀ ਅਨੇਕ ਭਾਂਤ ਕਰ ਕੇ ਟਹਲ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਂ! (ਪ੍ਰਭੂ ਨੂੰ ਪਿਆਰੀ ਹੋ ਚੁਕੀ ਸਤ-ਸੰਗਣ ਜੀਵ-ਇਸਤ੍ਰੀ ਦੀ) ਸੇਵਾ ਅਨੇਕਾਂ ਤਰੀਕਿਆਂ ਨਾਲ ਕਰਨੀ ਚਾਹੀਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਂਤਿ = ਤਰੀਕਾ। ਕਰੀਐ = ਕਰਨੀ ਚਾਹੀਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Realiza Su Servicio de muchas formas,"