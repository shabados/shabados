[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਰ ਧਨ ਗਨੌ ਪਖਾਨ ਸੋ; ਪਰ ਪਤਿ ਪਿਤਾ ਸਮਾਨ ॥"
page = 965

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Another person’s property is like a stone and another person’s husband like father."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਰਾਏ ਧਨ ਨੂੰ ਪੱਥਰ ਵਾਂਗ ਅਤੇ ਪਰਾਏ ਪਤੀ ਨੂੰ ਪਿਤਾ ਸਮਾਨ ਸਮਝ ਕੇ"