[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਤਦਿ; ਸੁਰਗੁ ਮਛੁ ਪਇਆਲਾ ॥"
page = 1035
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then there was no higher middle and lower plane."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਦੋਂ ਨਾਂ ਕੋਈ ਉਪਰਲਾ, ਵਿਚਕਾਰਲਾ ਤੇ ਹੇਠਲਾ ਮੰਡਲ ਸੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There were no heavenly realms, earth or nether regions of the underworld."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਰਗ ਅਰ ਮਾਤ ਲੋਗ ਪੁਨਾ ਪਤਾਲ ਕੀ ਸੰਗਿਆ ਭੀ ਤਬ ਨਹੀਂ ਥੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਨਾਹ ਸੁਰਗ-ਲੋਕ ਸੀ, ਨਾਹ ਮਾਤ-ਲੋਕ ਸੀ ਤੇ ਨਾਹ ਹੀ ਪਤਾਲ ਸੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਦਿ = ਤਦੋਂ। ਮਛੁ = ਮਾਤ ਲੋਕ। ਪਇਆਲਾ = ਪਤਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No estaba el cielo ni la tierra, ni el mundo, ni el bajo mundo."