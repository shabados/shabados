[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਝੁ ਗੁਰੂ; ਹੈ ਅੰਧ ਗੁਬਾਰਾ ॥"
page = 116
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Guru there is pitch darkness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਬਗੈਰ ਅੰਨ੍ਹੇਰ ਘੁਪ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Guru, there is only pitch darkness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਸੇ ਬਿਨਾ ਅਤੀ ਅੰਧੇਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਤੋਂ ਬਿਨਾ (ਜਗਤ ਵਿਚ ਮਾਇਆ ਦੇ ਮੋਹ ਦਾ) ਘੁੱਪ ਹਨੇਰਾ ਪਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਧ ਗੁਬਾਰਾ = ਘੁੱਪ ਹਨੇਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Guru, nos quedamos en la oscuridad absoluta;"