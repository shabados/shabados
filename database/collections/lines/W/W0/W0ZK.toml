data = "ਹਮਰੀ ਦਿਸਿ ਹ੍ਵੈ ਜੁਧੁ ਮਚਾਵੈ ॥੩॥"
page = 942

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘And tell him to come abandoning all his tasks and to go to fight on our behalf.’(3)"

[[content]]
