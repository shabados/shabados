[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਸੂਖ; ਇਹੁ ਆਨੰਦੁ ਲਹਿਆ ॥"
page = 179
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and I have obtained all this comfort and joy."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੈਂ ਇਹ ਸਾਰਾ ਆਰਾਮ ਅਤੇ ਅਨੰਦ ਪ੍ਰਾਪਤ ਕਰ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and so I have obtained all comforts and joy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਤ ਨੇ ਬਿਵਹਾਰਕ ਸੰਪੂਰਨ ਸੁਖ ਹੈਂ ਔਰ ਆਤਮਾ ਨੰਦ ਇਸੀ ਮੇਂ (ਲਹਿਆ) ਜਾਣ ਲੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਸਾਰੇ ਸੁਖਾਂ ਦਾ ਮੂਲ ਇਹ ਆਤਮਕ ਆਨੰਦ ਤਾਂ ਮਿਲਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así obtuve la Paz y la Dicha."