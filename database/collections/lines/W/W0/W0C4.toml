[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੋਟਨ ਸੇ ਜਿਨ ਕੇ ਤਨ ਰਾਜਿਤ; ਬਾਸਵ ਸੌ ਕਬਹੂੰ ਨਹਿ ਹਾਰੇ ॥"
page = 810

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They, with fort like bodies, who had never lost even to (god) Indra,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਦੇ ਸ਼ਰੀਰ ਕਿਲ੍ਹਿਆਂ ਵਾਂਗ ਸ਼ੋਭਦੇ ਸਨ ਅਤੇ ਇੰਦਰ ਤੋਂ ਵੀ ਕਦੇ ਹਾਰੇ ਨਹੀਂ ਸਨ।"