[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਰਤਿ ਮਤਿ ਨਾਹੀ ਚਤੁਰਾਈ ॥"
page = 750
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have no understanding, intellect and cleverness,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਵਿੱਚ ਕੋਈ ਸੋਚ ਸਮਝ, ਅਕਲ ਅਤੇ ਹੁਸ਼ਿਆਰੀ ਨਹੀਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have no understanding, intellect or cleverness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸੁਰਤਿ) ਉਤਮ ਪ੍ਰੀਤੀ (ਮਤਿ) ਬੁਧੀ ਮੇਂ ਚਤੁਰਾਈ ਭੀ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! (ਮੇਰੀ ਉੱਚੀ) ਸੁਰਤ ਨਹੀਂ, (ਮੇਰੇ ਵਿਚ ਕੋਈ) ਅਕਲ ਨਹੀਂ (ਕੋਈ) ਸਿਆਣਪ ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No soy intuitivo, ni inteligente, más bien soy ignorante y tonto;"