[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਵਰ ਸਭ ਮਿਥਿਆ; ਲੋਭ ਲਬੀ ॥"
page = 497
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All other greeds of the greedy soul are false."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲਾਲਚੀ ਆਤਮਾ ਦੇ ਹੋਰ ਸਾਰੇ ਲਾਲਚ ਕੂੜੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All other greeds of the greedy are false."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਲੋਭ ਕਰ ਜਿਨ ਪਦਾਰਥੋਂ ਕਾ ਤੂੰ (ਲਬੀ) ਲਾਲਚੀ ਬਨਾ ਹੈ, ਸੋ ਬਿਨਾਂ ਪਰਮੇਸ੍ਵਰ ਤੇ ਜਿਤਨੇ ਅਵਰ ਪਦਾਰਥ ਹੈਂ, ਸੋ ਝੂਠੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੋਰ ਸਾਰੇ ਲੋਭ ਲਾਲਚ ਝੂਠੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਥਿਆ = ਝੂਠਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Toda la avaricia es vana, pues el Nombre del Señor,"