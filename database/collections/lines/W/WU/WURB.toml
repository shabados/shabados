[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਿਨ ਮੋ ਕੋ ਸੁਭ ਕ੍ਰਿਆ ਪੜ੍ਹਾਈ ॥੫॥"
page = 73

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The mind is my Guru and the discriminating intellect, the Guru’s wife is my mother, who hath taught me all about good deeds.5."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੇ ਮੈਨੂੰ ਸਾਰੀ ਕਾਵਿ-ਕ੍ਰਿਆ ਸਿਖਾਈ ਹੈ ॥੫॥"