[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨੀ ਇਕ ਮਨਿ. ਇਕੁ ਅਰਾਧਿਆ; ਤਿਨ ਸਦ ਬਲਿਹਾਰੈ ਜਾਉ ॥"
page = 958
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who with single mind contemplate the One Lord; unto; them I am ever a sacrifice."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਇਕ ਚਿੱਤ ਇਕੱ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰਦੇ ਹਨ, ਉਨ੍ਹਾਂ ਉਤੋਂ ਮੈਂ ਸਦੀਵ ਹੀ ਘੋਲੀ ਵੰਝਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to those who single-mindedly worship and adore the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਪੁਰਸੋਂ ਨੇ ਇਕਾਗਰ ਮਨ ਹੋਇ ਕੈ ਇਕ ਵਾਹਿਗੁਰੂ ਅਰਾਧਿਆ ਹੈ, ਤਿਨ ਕੇ ਹਮ ਸਦਾ ਬਲਿਹਾਰ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਹਨਾਂ ਬੰਦਿਆਂ ਤੋਂ ਸਦਾ ਸਦਕੇ ਹਾਂ ਜੋ ਇਕ-ਮਨ ਹੋ ਕੇ ਪ੍ਰਭੂ ਨੂੰ ਸਿਮਰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi ser en sacrificio a aquél que mantenga su mente concentrada y contemplando al Único Dios."