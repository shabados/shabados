[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਨਾਮ ਧਾਰਿ ਚੀਤ ॥੧॥ ਰਹਾਉ ॥"
page = 1272
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and enshrine the Master's Name in thy mind. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮਾਲਕ ਦੇ ਨਾਮ ਨੂੰ ਆਪਣੇ ਮਨ ਅੰਦਰ ਟਿਕਾ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Enshrine the Lord's Name in your consciousness. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਮ ਨਾਮ ਕੋ ਚਿਤ ਮੇਂ ਧਾਰਨ ਕਰੁ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਆਪਣੇ ਚਿੱਤ ਵਿਚ ਟਿਕਾਈ ਰੱਖ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੀਤਿ = ਚਿੱਤ ਵਿਚ। ਧਾਰਿ = ਟਿਕਾਈ ਰੱਖ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "enaltece Su Nombre en tu conciencia. (1-Pausa)"