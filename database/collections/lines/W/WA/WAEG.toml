[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੁ ਮਨੁ ਹੋਆ; ਸਾਧ ਧੂਰਿ ॥"
page = 1184
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This soul has become the dust of the saints' feet"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਆਤਮਾਂ ਸੰਤਾਂ ਦੇ ਪੈਰਾਂ ਦੀ ਧੂੜ ਹੋ ਗਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This mind has become the dust of the Holy;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਮਨ ਸਾਧੂ ਕੇ ਚਰਨੋਂ ਕੀ ਧੂਰ ਹੂਆ ਹੈ, ਭਾਵ ਨਿਮ੍ਰ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦਾ ਇਹ ਮਨ ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ਬਣਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧ ਧੂਰਿ = ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando la mente se convierte en el polvo sobre el cual los Santos caminan,"