[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੇਵਡੁ ਆਖਾ ਸਚੁ, ਸਚੇ ਭਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Flow great is the'truth that it is liked by that true One (God)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਿੱਡਾਕੁ ਵੱਡਾ ਮੈਂ ਸੱਚ ਦਾ ਵਰਣਨ ਕਰਾਂ (ਜੋ) ਸੱਚੇ ਅਕਾਲ ਪੁਰਖ ਨੂੰ ਭਾਉਂਦਾ ਹੈ?"