[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਪਕਾ ਰੋਗੀ ਵਿਲਲਾਇ ॥੧॥"
page = 661
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "screams like a chronic patient."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਚਿਰ ਦੇ ਬੀਮਾਰ ਵਾਂਗੂੰ ਵਿਲਕਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "cries out in pain, like a chronic patient. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਪੁਰਸ਼ ਇਸ (ਪਕਾ ਰੋਗੀ) ਕੁਸ਼ਟੀ ਜੈਸਾ ਹੋ ਕਰ ਸਦਾ ਦੁਖ ਸੇ ਵਿਰਲਾਪ ਕਰਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦਾ ਇਉਂ ਵਿਲਕਦਾ ਹੈ ਜਿਵੇਂ ਕੋੜ੍ਹ ਦੇ ਰੋਗ ਵਾਲਾ ਬੰਦਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਕਾ ਰੋਗੀ = ਕੋੜ੍ਹ ਦੇ ਰੋਗ ਵਾਲਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "se aflige de la misma manera como aquél que está atrapado por un mal crónico. (1)"