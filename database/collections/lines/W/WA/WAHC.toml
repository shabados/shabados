data = "ਬਦੰਤ ਕ੍ਰਿਤ ਈਸੁਰੀ ॥੧੨॥੨੦॥"
page = 129

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Even Durga praises the brilliance of that conquering light.12.20."

[[content]]
