data = "ਕੀਰਤ ਦਾ ਬਖਾਨ (ਆਪ) ਈਸ਼ਵਰੀ (ਪਾਰਬਤੀ) ਖੁਦ ਕਰਦੀ ਹੈ ॥੧੨॥੨੦॥"