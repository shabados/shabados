[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਸੰਸਾਰੀ; ਨਾ ਅਉਧੂਤ ॥"
page = 953
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They are neither the true worldly men, nor the true forsakers of the world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਨਾਂ ਸੱਚੇ ਦੁਨੀਆਦਾਰ ਬੰਦੇ ਹਨ ਨਾਂ ਹੀ ਦੁਨੀਆ ਦੇ ਸੱਚੇ ਤਿਆਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They are neither worldly people, nor detached renunciates."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾ ਸੰਸਾਰੀ ਕਿਰਿਆ ਕਾ ਅਭਿਮਾਨੀ ਹੋਵੈ, ਨ ਅਵਧੂਤੀ ਕ੍ਰਿਆ ਕਾ ਅਭਿਮਾਨੀ ਹੋਵੈ, ਸਭ ਮੇਂ ਸਮ ਰਹੇ। ਇਸ ਪਰਕਾਰ ਕੰਨ ਪੜਾਇਕੈ ਸਮਤਾ ਰੂਪ ਭੁਗਤ ਖਾਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅਸਲ ਵਿਚ) ਨਾਹ ਉਹ ਗ੍ਰਿਹਸਤੀ ਹਨ ਤੇ ਨਾਹ ਵਿਰਕਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ellos no son gente mundana ni tampoco ascetas,"