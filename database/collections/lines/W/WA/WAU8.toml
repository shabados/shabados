[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦਿਨੁ ਗੁਣ ਗਾਵੈ ਨਿਤ ਸਾਚੇ; ਕਥੇ ਅਕਥ ਕਹਾਣੀ ॥"
page = 771
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day she ever sings the True Lord's praise and utters the unutterable story."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਦਿਨ ਉਹ ਹਮੇਸ਼ਾਂ ਸੱਚੇ ਸਾਈਂ ਦੇ ਜੱਸ ਨੂੰ ਗਾਇਨ ਕਰਦੀ ਹੈ ਅਤੇ ਅਕਹਿ ਸਾਖੀ ਨੂੰ ਕਹਿੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, she continually sings the Glorious Praises of the True Lord; she speaks the Unspoken Speech."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਦਿਨ ਨਿਤ੍ਯ ਰੂਪ ਸਚੇ ਕੇ ਗੁਣੋਂ ਕੋ ਗਾਵਤੀ ਹੈ, (ਅਕਥ) ਪਰਮੇਸਰ ਕੀ ਜੋ ਕਥਾ ਹੈ, ਸੋ ਕਥਨ ਕਰੀਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਉਹ ਹਰ ਵੇਲੇ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਗਾਂਦੀ ਰਹਿੰਦੀ ਹੈ, ਅਤੇ ਉਸ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੀਆਂ ਗੱਲਾਂ ਕਰਦੀ ਹੈ ਜਿਸ ਦਾ ਸਰੂਪ ਬਿਆਨ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਕਥ = ਜਿਸ ਦਾ ਸਰੂਪ ਬਿਆਨ ਨਾਹ ਕੀਤਾ ਜਾ ਸਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pasas tu vida cantando Su Bella Alabanza y realizas el Evangelio Impronunciable."