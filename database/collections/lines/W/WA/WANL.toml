[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੇ ਸਚੀ ਦਾਤਿ; ਦੇਹਿ ਦਇਆਲੁ ਹੈ ॥"
page = 422
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is the gift, which the True and Merciful Master bestows."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੀ ਸੁੱਚੀ ਹੈ ਬਖਸ਼ੀਸ਼, ਜੋ ਸੱਚਾ ਅਤੇ ਮਿਹਰਬਾਨ ਮਾਲਕ ਬਖਸ਼ਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True is the gift of the True, Compassionate Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਚੇ! ਤੇਰੀ ਦਾਤਿ ਭੀ ਸਚੀ ਹੈ, ਜਿਸ ਪਰ ਦਇਆਲ ਹੋਤਾ ਹੈ ਤਿਸ ਕੋ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ (ਭੀ) ਦਿਨ ਰਾਤ ਉਸ ਪ੍ਰਭੂ ਦਾ ਸਿਮਰਨ ਕਰਦਾ ਹਾਂ ਜਿਸ ਦਾ ਨਾਮ ਅਮੋਲਕ ਹੈ ਜੋ ਸਦਾ ਜੀਵਾਂ ਉਤੇ ਦਇਆ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੇ = ਹੇ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Bendición del Señor Compasivo es también Verdad,"