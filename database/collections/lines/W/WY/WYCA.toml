[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਦਿਨੁ; ਆਵਨ ਲਾਗਾ ॥"
page = 692
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That last day is fast approaching,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਅਖੀਰਲਾ ਦਿਹਾੜਾ ਨੇੜੇ ਢੁਕਣ ਵਾਲਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That day is rapidly approaching."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਬ (ਸੋ) ਉਹ, ਭਾਵ ਮ੍ਰਿਤੂ ਕਾ ਦਿਨ ਆਵਣੇ ਲਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹਰ ਇਕ ਜੀਵ ਦੇ ਸਿਰ ਉੱਤੇ) ਉਹ ਦਿਨ ਆਉਂਦਾ ਜਾਂਦਾ ਹੈ (ਜਦੋਂ ਕਾਲ-ਸ਼ਿਕਾਰੀ ਆ ਪਕੜਦਾ ਹੈ);"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋ ਦਿਨੁ = ਉਹ ਦਿਨ (ਜਦੋਂ ਕਾਲ ਅਹੇਰੀ ਨੇ ਸਾਨੂੰ ਭੀ ਆ ਫੜਨਾ ਹੈ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cerca, muy cerca y a la mano, está ese día. Ni padre, ni madre,"