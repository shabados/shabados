[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜੇਹਾ ਬੀਜੈ ਸੋ ਲੁਣੈ; ਜੇਹਾ ਬੀਉ ਤੇਹਾ ਫਲੁ ਪਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "One reaps what one sows and receives the fruit of seeds offered to earth."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੇਹਾ (ਬੀਜ ਇਸ ਵਿਚ ਕੋਈ) ਬੀਜਦਾ ਹੈ ਤੇਹਾ ਹੀ ਕਟਦਾ ਹੈ, ਜੇਹਾ ਬੀਉ ਹੁੰਦਾ ਹੈ ਤਿਹਾ ਫਲ (ਉਸਦਾ) ਲੈਂਦਾ ਹੈ।"