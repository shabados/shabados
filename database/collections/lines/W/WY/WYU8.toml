data = "ਤਾ ਕੇ, ਕਾਲ ਨਿਕਟਿ ਨਹਿ ਐਹੈ ॥"
page = 1387

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Those who meditate even on the Supreme Destroyer, the death cannot approach them"

