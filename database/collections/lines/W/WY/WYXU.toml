[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੂਚ ਬਿਚਾਰੇ; ਫੂਏ ਫਾਲ ॥"
page = 871
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The poor brushes have gone to pieces."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗਰੀਬੜੇ ਕੁਚ ਟੁੱਟ-ਫੁਟ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The poor brushes are scattered in pieces."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੂਚ ਬਿਚਾਰੇ ਗਰੀਬ ਕਿਤੇ ਫੁਲੇ ਫੈਲੇ ਪਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਿਚਾਰੇ ਕੁੱਚ ਤੀਲਾ ਤੀਲਾ ਹੋ ਰਹੇ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫੂਏ ਫਾਲ = ਤੀਲਾ ਤੀਲਾ ਹੋ ਗਏ ਹਨ, ਖਿਲਰੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las cerdas de su cepillo están regadas;"