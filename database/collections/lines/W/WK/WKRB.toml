[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਦੈਵੰ ਸਦਾ, ਸਿਧ ਬ੍ਰਿਧੰ ਸਰੂਪੇ ॥"
page = 24

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is Eternal, He is the Perfect and Oldest Entity."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਨਿੱਤ ਹੈ, ਸਦਾ-ਸਿੱਧ ਹੈ ਅਤੇ ਬਿਰਧ ਰੂਪ ਵਾਲਾ ਹੈ।"