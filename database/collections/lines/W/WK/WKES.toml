[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਨਾਰਿ ਭਤਾਰਿ ਪਿਆਰੁ ਕਰਿ; ਸਿਹਜਾ ਭੋਗ ਸੰਜੋਗੁ ਬਣੰਦਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Husband meets wife and prepares her for further joy."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਚੰਦ ਦਾ ਉਦੀਪਨ ਪਾਕੇ ਇਸਤ੍ਰੀ (ਆਪਣੇ) ਭਰਤੇ ਦੇ ਮੋਹ ਕਰ ਕੇ ਸਿਹਜਾ ਵਛਾਉਂਦੀ ਅਰ ਭੋਗ ਦੇ ਕਈ (ਸੰਜੋਗ) ਉਪਾਵ ਰਚਦੀ ਹੇ।"