[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁੰਦਰ ਸੋਭਾ ਲਾਲ ਗੋਪਾਲ ਦਇਆਲ ਕੀ; ਅਪਰ ਅਪਾਰਾ ਰਾਮ ॥"
page = 542
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Beautiful is the glory of the merciful and beloved Master who is beyond limit and comprehension."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਹਣੀ ਹੈ ਕੀਰਤੀ ਮਿਹਰਬਾਨ ਅਤੇ ਪਿਆਰੇ ਮਾਲਕ ਦੀ ਜੋ ਪਰ੍ਹੇ ਤੋਂ ਪਰੇਡੇ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Glory of the Beloved, Merciful Lord of the Universe is beautiful; He is infinite and without limit."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਲਾਲ ਗੋਪਾਲ ਦਿਆਲ ਕੀ ਸੋਭਾ ਸੁੰਦਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਇਆ ਦੇ ਘਰ ਗੋਪਾਲ ਪਿਆਰੇ ਦੀ ਸੋਹਣੀ ਸੋਭਾ (ਪਸਰ ਰਹੀ) ਹੈ, ਬੜੀ ਬੇਅੰਤ ਸੋਭਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਪਰ ਅਪਾਰਾ = ਪਰੇ ਤੋਂ ਪਰੇ, ਬੇਅੰਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es lo Principal de todo; la Gloria del Ser Munificente es magnífica,"