[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੁ ਪੂਰਾ ਆਰਾਧਿਆ; ਬਿਨਸੀ ਮੇਰੀ ਪੀਰ ॥"
page = 814
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Contemplating on the Perfect Guru, my anguish is ended."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਾਂ ਦਾ ਧਿਆਨ ਧਾਰਨ ਦੁਆਰਾ ਮੇਰਾ ਦਰਦ ਮਿਟ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Worshipping the Perfect Guru in adoration, my anguish is eradicated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ ਨੇ ਪੂਰਾ ਸਤਿਗੁਰੂ ਅਰਾਧਿਆ ਹੈ। ਤਿਸੀ ਤੇ ਮੇਰੇ ਰਿਦੇ ਮੇਂ ਜੋ ਹਰੀ ਕੇ ਵ੍ਯੋਗ ਕੀ ਪੀੜਾ ਥੀ ਸੋ ਸਰਬ ਦੂਰ ਹੋ ਜਾਤੀ ਭਈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਭੀ ਮਨੁੱਖ ਨੇ) ਪੂਰੇ ਗੁਰੂ ਦਾ ਆਸਰਾ ਲਿਆ ਹੈ। ਉਸ ਦਾ (ਮਾਇਆ ਦੀ) ਮਮਤਾ ਵਾਲਾ ਦੁੱਖ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੇਰੀ ਪੀਰ = ਮਮਤਾ ਦਾ ਦੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hermano, contemplando al Guru Perfecto, mi dolor se ha desvanecido;"