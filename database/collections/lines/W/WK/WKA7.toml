[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਤੇ; ਸਹਜੇ ਸਹਜਿ ਸਮਾਵਾ ॥੧॥ ਰਹਾਉ ॥"
page = 993
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by which I shall easily be absorbed in the Lord. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੁਆਰਾ ਮੈਂ ਸੁਖੈਨ ਹੀ ਸੁਆਮੀ ਅੰਦਰ ਲੀਨ ਹੋ ਜਾਵਾਂਗਾ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "that I may intuitively merge with You. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਰ ਸੁਭਾਵਕ ਹੀ ਹੇ (ਸਹਜਿ) ਸਾਂਤ ਰੂਪ! ਤੇਰੇ ਮੇਂ ਸਮਾਇ ਜਾਵਾਂ॥੧॥ ਰਹਾਉ"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਬਰਕਤਿ ਨਾਲ ਮੈਂ ਸਦਾ ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਲੀਨ ਰਹਾਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਤੇ = ਜਿਸ ਦੀ ਬਰਕਤਿ ਨਾਲ। ਸਹਜੇ = ਸਹਜਿ ਹੀ, ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਹੀ। ਸਮਾਵਾ = ਸਮਾਵਾਂ, ਮੈਂ ਸਮਾਇਆ ਰਹਾਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y me inmerja, de forma espontánea, en el Equilibrio.(1-Pausa)"