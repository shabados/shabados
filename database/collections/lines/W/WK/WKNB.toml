[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਰਨਿ ਮਾਹਿ; ਆਕਾਸ ਪਇਆਲ ॥"
page = 293
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is in earth sky and the under -world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਧਰਤੀ, ਅਸਮਾਨ ਅਤੇ ਪਾਤਾਲ ਵਿੱਚ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the earth, in the Akaashic ethers, and in the nether regions of the underworld"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਧਰਤੀ ਔਰ ਅਕਾਸ, ਪਤਾਲ ਆਦੀ ਮੇਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਧਰਤੀ ਅਕਾਸ਼ ਤੇ ਪਤਾਲ ਵਿਚ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਰਨਿ = ਧਰਤੀ। ਪਇਆਲ = ਪਤਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él se encuentra en el cielo, la tierra, en las regiones obscuras,"