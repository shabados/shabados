[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਰੰਦਏ; ਨ ਗਿਰਾਹ ਜਰ ॥"
page = 144
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The birds have no money in their pockets."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੰਛੀਆਂ ਦੀ ਗੰਢ ਵਿੱਚ ਕੋਈ ਮਾਲ ਧਨ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The birds have no money in their pockets."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਪਰੰਦਏ) ਪੰਛੀਓਂ ਕੇ (ਗਿਰਾਹ) ਗਾਠ ਮੇਂ (ਜਰ) ਧਨ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੰਛੀਆਂ ਦੇ ਗੰਢੇ-ਪੱਲੇ ਧਨ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰੰਦਏ ਗਿਰਾਹ = ਪੰਛੀਆਂ ਦੇ ਗੰਢ-ਪੱਲੇ। ਜਰ = ਜ਼ਰ, ਧਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Un pájaro no tiene pertenencias,"