[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭਹੂ ਕੋ ਰਸੁ; ਹਰਿ ਹੋ ॥੧॥ ਰਹਾਉ ॥"
page = 213
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God is the essence of everything. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਹਰਿ ਸ਼ੈ ਦਾ ਨਚੋੜ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is the essence of all. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਰਬ ਕਾ (ਰਸੁ) ਅਨੰਦ ਭੋਗਤਾ ਹਰੀ ਹੀ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹੀ ਸਭ ਜੀਵਾਂ ਦਾ ਸ੍ਰੇਸ਼ਟ ਆਨੰਦ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋ = ਦਾ। ਸਭਹੂ ਕੋ = ਸਾਰੇ ਹੀ ਜੀਵਾਂ ਦਾ। ਰਸੁ = ਸ੍ਰੇਸ਼ਟ ਆਨੰਦ। ਹੋ = ਹੇ ਭਾਈ! ਹਰਿ = ਹਰਿ ਨਾਮ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, eres la Esencia de todo.(1-Pausa)"