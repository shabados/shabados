[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਟਿਕਿਯੋ ਹਿਰਿਨਾਛ ਤਹ; ਅਵਰ ਨ ਜੋਧਾ ਏਕੁ ॥੩੪॥"
page = 170

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many warriors fled on the thunder of Narsingh and none could stand in battlefield except Hiranayakashipu.34."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਕੇਵਲ ਇਕ ਹਿਰਨਕਸ਼ਪ ਟਿਕਿਆ, ਹੋਰ ਕੋਈ ਇਕ ਵੀ ਨਾ (ਡਟਿਆ) ॥੩੪॥"