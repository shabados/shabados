[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਤਪਸ︀ਯਾ ਕਰਿ ਕੈ ਪ੍ਰਭ ਤੇ ਕਬਿ ਸ︀ਯਾਮ ਕਹੈ ਪਰਿ ਪਾਇਨ ਲਈਯਾ ॥"
page = 382

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And he, whose feet can be realised by meditating on the Lord,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਵੀ ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, ਜੋ ਤਪਸਿਆ ਕਰ ਕੇ ਅਤੇ ਪੈਰੀਂ ਪੈ ਕੇ ਪ੍ਰਭੂ ਤੋਂ ਲਿਆ ਹੈ।"