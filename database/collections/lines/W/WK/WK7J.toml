[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੀ ਕਰਣੀ; ਪਤਿ ਪਰਵਾਣੁ ॥"
page = 1188
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who practice truth obtain honour and become acceptable,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੱਚ ਦੀ ਕਮਾਈ ਕਰਦੇ ਹਨ, ਉਹ ਇੱਜ਼ਤ ਆਬਰੂ ਪਾਉਂਦੇ ਹਨ ਅਤੇ ਕਬੂਲ ਪੈ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who practice Truth are honored and accepted."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨਾਂ ਨੇ ਤਿਸ ਪਰਮੇਸ੍ਵਰ ਕੀ ਭਗਤੀ ਰੂਪ ਸਚੀ ਕਹਣੀ ਕਰੀ ਹੈ, ਤਿਨ ਕੀ ਪਤਿ ਹੂਈ ਹੈ ਔਰ ਵਹੁ ਪ੍ਰਵਾਣੁ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਨੂੰ ਆਪਣਾ ਕਰਤੱਵ ਬਣਾਇਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚੀ = ਸਦਾ ਇਕ-ਰਸ ਰਹਿਣ ਵਾਲੀ, ਸੱਚੀ। ਕਰਣੀ = ਆਚਰਨ। ਪਤਿ = ਇੱਜ਼ਤ। ਪਰਵਾਣੁ = ਕਬੂਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los que practican la Verdad de Dios, su Gloria es reconocida por Dios"