[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਨਿਧਾਨੁ ਸਤਿਗੁਰਿ ਦੀਆ; ਸੁਖੁ ਨਾਨਕ. ਮਨ ਮਹਿ ਮੰਡੁ ॥੪॥੨੦॥੯੦॥"
page = 50
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Guru has given the Name treasure and Nanak has thereby enshrined solace in him mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਨੇ ਨਾਮ ਦਾ ਖ਼ਜ਼ਾਨਾ ਦਿੱਤਾ ਹੈ ਅਤੇ ਉਸ ਦੁਆਰਾ ਨਾਨਕ ਨੇ ਆਪਣੇ ਚਿੱਤ ਅੰਦਰ ਆਰਾਮ ਧਾਰਨ ਕਰ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Guru has bestowed the Treasure of the Naam, the Name of the Lord. O Nanak, the mind is filled with peace. ||4||20||90||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੋ ਗੁਰੋਂ ਨੇ ਨਾਮ ਰੂਪੀ (ਨਿਧਾਨੁ) ਖਜਾਨਾ ਦੀਆ ਹੈ, ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਨੋਂ ਨੇ ਸੁਖ ਸਰੂਪ ਬ੍ਰਹਮ ਕੋ ਮਨ ਮੇਂ (ਮੰਡੁ) ਧਾਰਨ ਕੀਆ ਹੈ॥੪॥੨੦॥੯੦॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਸਤਿਗੁਰੂ ਨੇ ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਖਜ਼ਾਨਾ ਦਿੱਤਾ ਹੈ, ਉਸ ਨੇ ਆਤਮਕ ਆਨੰਦ (ਸਦਾ ਲਈ) ਆਪਣੇ ਮਨ ਵਿਚ ਪਰੋ ਲਿਆ ਹੈ ॥੪॥੨੦॥੯੦॥{49-50}"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਧਾਨੁ = ਖ਼ਜ਼ਾਨਾ। ਸਤਿਗੁਰਿ = ਸਤਿਗੁਰੂ ਨੇ। ਮੰਡੁ = ਮੰਡਿਆ ਹੈ, ਧਾਰਿਆ ਹੈ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, el Guru Verdadero me ha dado el Tesoro del Naam, el  Nombre del Señor, y mi mente se ha llenado de Felicidad. (4-20-90)"