[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਚਿੱਤਰਕਾਰ ਆਪਣੇ ਚਿਤਰਾਣ ਦੇ ਰੰਗਾਣ ਵਿਚ ਹੀ ਲੁਕਅਿਾ ਹੋਇਆ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਨੱਕਾਸ ਦਰੂਨਿ ਨਕਸ਼ ਪਿਨਹਾਣ ਸ਼ੁਦਾ ਅਸਤ ॥੪॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Take it that he has easily leaped over a sky equipped even with nine locks. (277)"