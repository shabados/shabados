[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚਾਰਿ ਵਰਨ ਛਿਅ ਦਰਸਨਾਂ; ਜਤੀ ਸਤੀ ਨਉ ਨਾਥ ਨਿਵਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "All the four vamas, six philosophies, celebates, suttees and nine maths have been made to bow by her."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਨੇ) ਚਾਰੇ ਵਰਣ, ਛੀ ਦਰਸ਼ਨ, ਜਤੀ ਸਤੀ ਅਰ ਨੌਂ ਨਾਥ ਬੀ ਨਿਵਾ ਲੀਤੇ ਹਨ।"