[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਹਰਿ ਜਾਤਾ; ਭੀਤਰਿ ਆਨੈ ॥"
page = 1160
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "restrains his wandering mind,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਬਾਹਰ ਭੱਜੇ ਫਿਰਦੇ ਮਨ ਨੂੰ ਅੰਦਰ ਲੈ ਆਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "gathers in his outgoing mind,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਾਹਰ ਜਾਤੇ ਹੂਏ ਪ੍ਰਾਣ ਪੌਣ ਕੋ (ਭੀਤਰਿ ਆਨੈ) ਅੰਤਰ ਲਿਆਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬਾਹਰ ਦੁਨੀਆ ਦੇ ਪਦਾਰਥਾਂ ਵਲ ਭਟਕਦੇ ਮਨ ਨੂੰ ਅੰਦਰ ਵਲ ਲੈ ਆਉਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਨੈ = ਲਿਆਵੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la de la Sabiduría y la del Desapego, y calmando sus inquietudes y ansiedades,"