[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਰਬਸ ਖੁਆਵਤ ਫਲ ਪਕਰਿ; ਜਾਨ ਬਹੁਰਿ ਘਰ ਦੇਤ ॥੪੯॥"
page = 836

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘And the trees, whose fruit people eat and go home satisfied.’(49)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਬੇਰ ਬ੍ਰਿਛ) ਮਲੋ ਜ਼ੋਰੀ ਪਕੜ ਕੇ ਫਲ ਖੁਆਉਂਦਾ ਹੈ ਅਤੇ ਫਿਰ ਘਰ ਜਾਣ ਦਿੰਦਾ ਹੈ ॥੪੯॥"