[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਆ ਕੈ ਕੁਸਲ; ਨ ਕਤਹੂ ਹੂਏ ॥"
page = 256
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and they obtain not happiness anywhere."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਹਨਾਂ ਨੂੰ ਕਿਧਰੇ ਭੀ ਪਰਸੰਨਤਾ ਨਹੀਂ ਮਿਲਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "they do not find happiness anywhere."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਨ ਕੇ ਮਨ ਮੇਂ (ਕੁਸਲ) ਅਨੰਦ ਕਬੀ ਨਹੀਂ ਹੂਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਦੇ ਅੰਦਰ ਕਦੇ ਆਤਮਕ ਆਨੰਦ ਨਹੀਂ ਆ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y están sordos."