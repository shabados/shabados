[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਹਤ ਅਵਰ; ਕਛੁ ਅਵਰ ਕਮਾਵਤ ॥"
page = 269
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man professes one thing and practices quite another."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਦਮੀ ਕਹਿੰਦਾ ਕੁਛ ਹੈ ਅਤੇ ਕਰਦਾ ਹੈ ਬਿਲਕੁਲ ਹੀ ਕੁਛ ਹੋਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He says one thing, and does something else."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਕਤ ਅੰਤਰ ਸੇ ਔਰ ਪ੍ਰਕਾਰ ਰਹਤੇ ਹੈਂ ਔਰ ਬਾਹਰ ਸੇ ਔਰ ਤ੍ਰਹ ਕਮਾਵਤੇ ਹੈਂ, ਭਾਵ ਦਿਖਲਾਵੇ ਹੇਤ ਪਖੰਡ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਧਰਮ ਦੇ ਬਾਹਰਲੇ ਧਾਰੇ ਹੋਏ ਚਿੰਨ੍ਹ ਹੋਰ ਹਨ ਤੇ ਅਮਲੀ ਜ਼ਿੰਦਗੀ ਕੁਝ ਹੋਰ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਹਤ = ਧਰਮ ਦੇ ਬਾਹਰਲੇ ਚਿੰਨ੍ਹ ਜੋ ਧਾਰੇ ਹੋਏ ਹਨ। ਅਵਰ = ਹੋਰ। ਕਛੁ ਅਵਰ = ਕੁਝ ਹੋਰ। ਕਮਾਵਤ = ਕਮਾਂਦਾ ਹੈ, ਅਮਲੀ ਜ਼ਿੰਦਗੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Muchos van por la vida pregonando una cosa y practicando otra;"