[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਮੋਹੁ ਵਰਤੈ ਸਭ ਅੰਤਰਿ ॥"
page = 1060
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The love of wealth is contained in all the bodies."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨ-ਦੌਲਤ ਦਾ ਪਿਆਰ, ਸਾਰੀਆਂ ਦੇਹਾਂ ਵਿੱਚ ਰਮ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Emotional attachment to Maya rules deep within all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਤ੍ਯਾਦ ਸਭ ਦੇਵਤਿਓਂ ਕੇ ਅੰਤਰ ਮਾਇਆ ਕਾ ਮੋਹ ਵਰਤ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਭ ਜੀਵਾਂ ਦੇ ਅੰਦਰ ਮਾਇਆ ਦਾ ਮੋਹ (ਆਪਣਾ) ਜ਼ੋਰ ਬਣਾਈ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਰਤੈ = ਪ੍ਰਭਾਵ ਪਾ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y los humanos están muy impregnados por la Maya y el deseo."