[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਰਿ ਨਰ ਅਸੁਰ ਅੰਤੁ; ਨਹੀ ਪਾਯਉ ॥"
page = 1405
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The gods, mortals and demons know not His limit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੇਵਤੇ, ਪ੍ਰਾਣੀ ਅਤੇ ਰਾਖਸ਼ ਉਸ ਦੇ ਓੜਕ ਨੂੰ ਨਹੀਂ ਜਾਣਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The angels, human beings and demons have not found His limits."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੇਵਤੇ, ਮਾਨੁਖ, ਦੈਤੋਂ ਮੇਂ ਸੇ ਕਿਸੀ ਨੇ ਤਿਸ ਕਾ ਅੰਤ ਨਹੀਂ ਪਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦੇਵਤੇ, ਮਨੁੱਖ, ਦੈਂਤ, ਕਿਸੇ ਨੇ (ਜਿਸ ਦਾ) ਅੰਤ ਨਹੀਂ ਪਾਇਆ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਰਿ = ਦੇਵਤੇ। ਨਰ = ਮਨੁੱਖ। ਅਸੁਰ = ਦੈਂਤ। ਆਪ ਹੀ = ਆਪਿ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ni lo seres malignos han podido encontrar Sus Límites,"