[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਰਗ ਮਹਲਾ ੫ ਘਰੁ ੬ ਪੜਤਾਲ ॥"
page = 1229
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sarang.5th Guru. Partal"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੰਗ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ। ਪੜਤਾਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Saarang, Fifth Mehl, Sixth House, Partaal:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਸਾਰੰਗ, ਘਰ ੬ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਪੜਤਾਲ'।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sarang, Mejl Guru Aryan Dev, Quinto Canal Divino, Partala."