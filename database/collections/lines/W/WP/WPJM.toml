data = "ਬਡੋ ਛਤ੍ਰਧਾਰੀ ਸੋ ਸੋਭਿਓ ਸਿਪਾਹੰ ॥"
page = 630

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors are wearing beautiful garments"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਬਹੁਤ ਵੱਡਾ ਛਤ੍ਰਧਾਰੀ ਹੈ ਅਤੇ (ਉਸ ਨਾਲ) ਸੈਨਾ ਸ਼ੋਭ ਰਹੀ ਹੈ।"