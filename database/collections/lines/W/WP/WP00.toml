[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਲਾਸ੍ਰੀ ਜਵੀ, ਜਾਮਨੀ ਜਗਕਾਰੀ ॥"
page = 708

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He has conquered in this world all the Yogis, the hermits with matted locks, performers of Yajnas, the water-dwellers and Nishachars etc"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਆਸਰੇ ਜੀਣ ਵਾਲੇ, ਜਵਾਂ ਦਾ ਭੋਜਨ ਕਰਨ ਵਾਲੇ, (ਸਾਰੀ) ਰਾਤ ਜਾਗ ਕੇ ਕਟਣ ਵਾਲੇ ਅਤੇ ਯੱਗ ਕਰਨ ਵਾਲੇ ਹਨ;"