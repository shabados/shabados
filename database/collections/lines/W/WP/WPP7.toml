[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਡ ਪਰਤਾਪੁ ਸੁਨਿਓ ਪ੍ਰਭ ਤੁਮੑਰੋ; ਕੋਟਿ ਅਘਾ. ਤੇਰੋ ਨਾਮ ਹਰਨ ॥੧॥"
page = 828
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Great is Thy glory, I have heard, O Lord. Thy Name destroys millions of sins."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਸ਼ਾਲ ਹੈ ਤੇਰਾ ਤਪ-ਤੇਜ, ਮੈਂ ਸੁਣਿਆ ਹੈ, ਹੇ ਸਾਹਿਬ! ਤੇਰਾ ਨਾਮ ਕ੍ਰੋੜਾਂ ਪਾਪਾਂ ਨੂੰ ਨਸ਼ਟ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your glorious radiance is great! So I have heard, O God. Millions of sins are destroyed by Your Name. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੁਮਾਰਾ ਬਡਾ ਪ੍ਰਤਾਪ ਹਮ ਨੇ ਸੁਨਿਆ ਹੈ। ਕੋਟਾਂਨਕੋਟ (ਅਘਾ) ਪਾਪੋਂ ਕੋ ਹਰਨੇਹਾਰਾ ਤੇਰਾ ਨਾਮੁ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਸੁਣਿਆ ਹੈ ਕਿ ਤੂੰ ਬੜੀ ਸਮਰੱਥਾ ਵਾਲਾ ਹੈਂ, ਤੇਰਾ ਨਾਮ ਕ੍ਰੋੜਾਂ ਪਾਪ ਦੂਰ ਕਰ ਸਕਦਾ ਹੈ (ਮੈਨੂੰ ਭੀ ਆਪਣਾ ਨਾਮ ਬਖ਼ਸ਼) ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਕੋਟਿ = ਕ੍ਰੋੜਾਂ। ਅਘਾ = ਪਾਪ। ਹਰਨ = ਦੂਰ ਕਰਨ ਵਾਲਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Grandiosa es Tu Gloria; Tu Nombre disuelve millones de errores en mí. (1)"