[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਾ ਪ੍ਰਭੁ ਆਰਾਧਿਆ; ਪੂਰਾ ਜਾ ਕਾ ਨਾਉ ॥"
page = 295
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have meditates on the Perfect Lord perfect is whose Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਮੁਕੰਮਲ ਮਾਲਕ ਦਾ ਸਿਮਰਨ ਕੀਤਾ ਹੈ, ਮੁਕੰਮਲ ਹੈ ਜਿਸ ਦਾ ਨਾਮ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I worship and adore the Perfect Lord God. Perfect is His Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਪ੍ਰਭੂ ਕੋ ਹਮ ਨੇ ਅਰਾਧਿਆ ਹੈ ਜਿਸ ਕਾ ਨਾਮ ਸਰਬ ਪ੍ਰਕਾਰ ਸੇ ਪੂਰਨ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਮਨੁੱਖ ਨੇ) ਅਟੱਲ ਨਾਮ ਵਾਲੇ ਪੂਰਨ ਪ੍ਰਭੂ ਨੂੰ ਸਿਮਰਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰਾ = ਮੁਕੰਮਲ, ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ। ਪੂਰਾ ਜਾ ਕਾ ਨਾਉ = ਜਿਸ ਦਾ ਨਾਮ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਹੈ, ਅਟੱਲ ਨਾਮ ਵਾਲਾ। ਆਰਾਧਿਆ = (ਜਿਸ ਮਨੁੱਖ ਨੇ) ਸਿਮਰਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Alabo y Adoro al Perfecto Dios nuestro Señor, Perfecto es Su Nombre,"