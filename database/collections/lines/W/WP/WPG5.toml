[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਜ ਘਰਿ ਵਸਿਆ; ਗੁਣ ਗਾਇ ਅਨੰਤਾ ॥"
page = 371
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I, now, abide in my own home, and sing the praises of the Infinite Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹੁਣ ਆਪਣੇ ਨਿਜ ਦੇ ਗ੍ਰਿਹ ਅੰਦਰ ਰਹਿੰਦਾ ਹਾਂ ਅਤੇ ਬੇਅੰਤ ਸੁਆਮੀ ਦਾ ਜੱਸ ਗਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "And now, I dwell in the home of my own inner self; I sing the Glorious Praises of the Infinite Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਕਾਲ ਪੁਰਖ ਕੇ ਅਨੰਤ ਗੁਣੋਂ ਕੋ ਗਾਇਨ ਕਰ ਕੇ ਤਬ ਮੈਂ ਅਪਨੇ ਨਿਜ ਘਰ ਮੇਂ ਨਿਜਾ ਨੰਦ ਬਾਸ ਕਰਤਾ ਭ੍ਯਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨਾਮ-ਮੰਤ੍ਰ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਬੇਅੰਤ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾ ਗਾ ਕੇ ਮੈਂ ਹੁਣ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਆ ਵੱਸਿਆ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਰਿ = ਘਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "habité en mi Ser y canté las Preciosas Alabanzas del Infinito."