[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਭਗਤੁ ਜੋ ਭਗਤਾ ਓਹਰੀ; ਜਾਪੂਵੰਸੀ ਸੇਵ ਕਮਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "A devotee named Bhagata if Ohari caste and Bhagat of Japuvansi family were two sikhs that served the Guru."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਓਹਰੀ ਜਾਤ ਵਾਲਾ ਭਗਤਾ ਨਾਮੇ ਭਗਤ ਤੇ ਜਾਪੂ ਵੰਸੀ (ਨਾਮੇ ਭਗਤ) ਸੇਵਾ ਕਰਦਾ ਹੁੰਦਾ ਸੀ।"