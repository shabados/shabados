[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਭਗਤਿ ਹੇਤਿ ਪਰਗਾਸੁ ਕਰਿ; ਹੋਇ ਦਇਆਲੁ ਮਿਲੈ ਗਲਿ ਲਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Due to the love for the devotee, God embraced him in person."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਭਗਤ ਦੇ ਪ੍ਰੇਮ ਕਰ ਕੇ ਪ੍ਰਗਾਸ ਕਰ ਕੇ ਦਿਆਲ ਤੇ ਗਲ ਲਾ ਕੇ ਮਿਲ ਪਏ।"