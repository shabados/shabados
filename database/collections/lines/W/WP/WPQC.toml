[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋ ਜਾਰੇ; ਕੋ ਗਡਿ ਲੇ ਮਾਟੀ ॥੨॥"
page = 329
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some burn it and some bury it in the earth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਇਸ ਨੂੰ ਫੁਕਦੇ ਹਨ ਅਤੇ ਕਈ ਇਸ ਨੂੰ ਜਮੀਨ ਵਿੱਚ ਦਬਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some burn it, and some bury it in the earth. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਅਗਨੀ ਮੇਂ ਜਲਾਵਤੇ ਹੈਂ ਕੋਈ ਮਾਟੀ ਮੇਂ ਦਬਾਇ ਦੇਤੇ ਹੈਂ॥੨॥☬ਜੇ ਪਰਮੇਸ੍ਵਰ ਕਹੇ ਜੋ ਤੇਰੀ ਇਛਾ ਹੈ ਕੁਛ ਮਾਂਗ ਲੈ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਇਸ ਨੂੰ ਸਾੜ ਦੇਂਦਾ ਹੈ, ਕੋਈ ਇਸ ਨੂੰ ਮਿੱਟੀ ਵਿਚ ਦੱਬ ਦੇਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋ = ਕਈ ਮਨੁੱਖ। ਜਾਰੇ = ਸਾੜ ਦੇਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mientras unos lo incineran, otros lo entierran en el polvo. (2)"