data = "ਗੁੱਸਾ ਖਾ ਕੇ ਹਨੂਮਾਨ ਨੇ ਉਸ ਥਾਂ ਉੱਤੇ ਪੈਰ ਗੱਡ ਕੇ ਪ੍ਰਹਾਰ ਕੀਤਾ"