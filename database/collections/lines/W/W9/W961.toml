[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਹਾ ਪਤਿਤ; ਤੁਮੑ ਤਾਰੇ ॥"
page = 1278
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou has saved even the great sinners."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਪਰਮ ਪਾਂਥਰਾਂ ਦਾ ਭੀ ਪਾਰ ਉਤਾਰਾ ਕਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You save even the worst sinners."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਹਾਂ ਪਾਪੀ ਤੁਮਨੇ ਤਾਰ ਦੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵੱਡੇ ਵੱਡੇ ਪਾਪੀਆਂ ਨੂੰ ਤੂੰ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘਾਂਦਾ ਆ ਰਿਹਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿਤ = ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗੇ ਹੋਏ ਜੀਵ। ਤਾਰੇ = ਪਾਰ ਲੰਘਾਏ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y salvas hasta a los más malvados. Eres el Purificador de quiénes viven en el error,"