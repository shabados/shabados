data = "ਭਿਛਕਿ ਹੋਇ ਮਾਗਿ ਸੋ ਲੀਜੈ ॥"
page = 452

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Therefore now becoming a beggar, beg this from him"

[[content]]
assets = ["RSJD"]
type = "translation"
