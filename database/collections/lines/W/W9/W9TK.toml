data = "ਨਮੋ ਚਰਬਣੀ ਸਰਬ ਧਰਮੰ ਧੁਜਾਯੰ ॥"
page = 119

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O the masticator of the demons, the manifestation of the banners of all religions"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਭ ਨੂੰ ਚਬਣ ਵਾਲੀ ਅਤੇ ਧਰਮ-ਧੁਜਾ ਰੂਪ ਵਾਲੀ ਨੂੰ ਨਮਸਕਾਰ ਹੈ;"