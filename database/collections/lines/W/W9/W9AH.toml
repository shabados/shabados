[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਧਨ ਕੇ ਹੇਤ ਤੋਹਿ ਹਮ ਗਹਿਯੋ ॥"
page = 940

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘You have not said anything against the Prophet, we have devised this to squeeze your money."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੈਨੂੰ ਅਸੀਂ ਧਨ ਵਾਸਤੇ ਹੀ ਘੇਰਿਆ ਹੈ।"