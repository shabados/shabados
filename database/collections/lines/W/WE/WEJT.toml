[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੁਗ ਛਤੀਹ ਗੁਬਾਰੁ ਕਰਿ; ਵਰਤਿਆ ਸੁੰਨਾਹਰਿ ॥"
page = 555
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "For thirty ages. He created pitch darkness and Himself abided in void."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਛੱਤੀ ਯੁਗਾਂ ਲਈ ਉਸ ਨੇ ਘੁਪ ਅੰਨ੍ਹੇਰਾ ਰੱਚ ਦਿੱਤਾ ਅਤੇ ਖੁਦ ਸੁੰਨਮਸਾਨ ਅੰਦਰ ਵੱਸਦਾ ਸੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "For thirty-six ages, He created the darkness, abiding in the void."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸੁੰਨਾਹਰਿ) ਅਫੁਰ ਪਰਮੇਸ੍ਵਰ ਆਪੇ ਹੀ ਜੁਗੁ ਛਤੀਹ ਅਰਥਾਤ ਬਹੁਤੇ ਜੁਗ ਅੰਧਕਾਰ ਕਰ ਕੇ ਵਰਤਿਆ ਹੈ, ਭਾਵ ਪ੍ਰਲੋ ਹੀ ਰਖੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਯੱਤੀ ਜੁਗਾਂ ਤਕ ਉਸ ਨੇ ਘੁੱਪ ਹਨੇਰਾ ਪੈਦਾ ਕਰ ਕੇ ਆਪ ਸੁੰਨ (ਅਫੁਰ) ਹਾਲਤ ਵਿਚ ਪਰਵੇਸ਼ ਕੀਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੁਗ ਛਤੀਹ = ੩੬ ਜੁਗ, ਬੇਅੰਤ ਸਮਾ। ਸੁੰਨਾਹਰਿ = ਅਫੁਰ ਅਵਸਥਾ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por decenas de miles de años, Él creó la etapa del Caos y habitó en ella, sentado en Su Ser."