[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਸਾ ਅੰਦੇਸਾ; ਬੰਧਿ ਪਰਾਨਾ ॥"
page = 759
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hope and fear have bound the mortal,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਮੀਦ ਅਤੇ ਡਰ ਨੇ ਪ੍ਰਾਣੀ ਨੂੰ ਬੰਨ੍ਹਿਆ ਹੋਇਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mortal is bound and gagged by hope and fear;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਪ੍ਰਾਣਾਂ ਪਰਯੰਤ ਆਸਾ ਤੇ ਸੰਸਿਓਂ ਮੇਂ ਬੰਧਿਆ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਹਰ ਵੇਲੇ ਮਾਇਆ ਦੀ ਆਸਾ ਅਤੇ ਚਿੰਤਾ-ਫ਼ਿਕਰ ਦੇ ਬੰਧਨ ਵਿਚ ਪਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਦੇਸਾ = ਚਿੰਤਾ। ਬੰਧਿ = ਬੰਧਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La angustia y el miedo te tienen amarrado en la vida de los sentidos;"