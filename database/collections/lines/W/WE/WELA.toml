[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਠੇ ਮੰਡਪ ਮਾੜੀਆ; ਲਾਇ ਬੈਠੇ ਕਰਿ ਪਾਸਾਰਿਆ ॥"
page = 472
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They dwell in houses, pavilions and lofty mansions and make ostentation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹੋ ਮਕਾਨਾਂ, ਤੰਬੂਆਂ ਅਤੇ ਉੱਚੇ ਮੰਦਰਾਂ ਅੰਦਰ ਵਸਦੇ ਹਨ ਅਤੇ ਅਡੰਬਰ ਰੱਚਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "in houses and pavilions and lofty mansions, they dwell, making ostentatious shows."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੋਠੇ (ਮੰਡਪ) ਸਭਾ ਅਸਥਾਨ ਮਾੜੀਆਂ ਊਚੇ ਅਟਾਰੀਆਂ, ਤਿਸਮੇਂ ਪੁਤ੍ਰ ਪੋਤ੍ਰ ਪਰਿਵਾਰ ਨੌਕਰ ਆਦਿ ਕਾ ਪਸਾਰਾ ਲਗਾਇ ਕਰ ਬੈਠੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਕੋਠੇ ਮਹਲ ਮਾੜੀਆਂ ਆਦਿਕ ਪਸਾਰੇ ਪਸਾਰ ਕੇ (ਅਹੰਕਾਰੀ ਹੋਇ) ਬੈਠੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਡਪ = ਮਹਲ, ਸ਼ਾਮੀਆਨੇ। ਲਾਇ......ਪਾਸਾਰਿਆ = ਲਾਇ ਕਰਿ ਪਾਸਾਰਿਆ ਬੈਠੇ, ਪਸਾਰੇ ਲਾ ਕੇ ਬੈਠੇ ਹੋਣ, ਸਜਾਵਟਾਂ ਸਜਾ ਕੇ ਬੈਠੇ ਹੋਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sus casas son grandes mansiones con pasillos altos y adornados,"