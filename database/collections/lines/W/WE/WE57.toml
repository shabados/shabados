[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹੂੰ ਅਗਨਿ ਬਾਣੀ ਪੜੈ ਬ੍ਰਹਮ ਅਸਤ੍ਰੰ ॥"
page = 151

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere the manyras of fire-shafts and Brahm-astras were recited"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਿਤੇ ਅਗਨੀ-ਬਾਣ (ਅਤੇ ਕਿਤੇ) ਬ੍ਰਹਮ-ਅਸਤ੍ਰ ਆਦਿ ਪੜ੍ਹੇ ਜਾ ਰਹੇ ਸਨ।"