[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੀ ਕਿੰਗੁਰੀ ਵਜਾਇ ਜੋਗੀ ॥"
page = 908
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Strike thou such strains on thy lyre, O Yogi,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਐਹੋ ਜਿਹੀ ਵੀਣਾ ਵਜਾ, ਹੇ ਯੋਗੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Play that harp, Yogi,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੋਗੀ! ਬ੍ਰਹਮ ਚਿੰਤਨ ਰੂਪ ਜੋ ਕਿੰਗੁਰੀ ਹੈ ਐਸੀ ਤੂੰ ਕਿੰਗੁਰੀ ਬਜਾਇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੋਗੀ! ਤੂੰ ਅਜਿਹੀ ਵੀਣਾ ਵਜਾਇਆ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿੰਗੁਰੀ = ਵੀਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Yogui, toca esas cuerdas de la cítara,"