[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਸਤ੍ਰ ਅਸਤ੍ਰ ਘੋਰਾ ਨਹੀ; ਸਾਥੀ ਸੰਗ ਨ ਕੋਇ ॥"
page = 915

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Neither I have arms, nor I possess any horses. I have no companion."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਵੇਲੇ ਮੇਰੇ ਕੋਲ) ਅਸਤ੍ਰ, ਸ਼ਸਤ੍ਰ, ਅਤੇ ਘੋੜਾ ਨਹੀਂ ਹੈ ਅਤੇ ਨਾ ਹੀ ਕੋਈ ਸੰਗੀ ਸਾਥੀ ਹੈ।"