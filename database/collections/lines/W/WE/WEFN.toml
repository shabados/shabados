[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕ੍ਰੁਧਤ ਹ੍ਵੈ ਬ੍ਰਿਜਰਾਜ ਇਤੈ ਸੁ; ਘਨੇ ਲਖਿ ਕੈ ਤਿਹ ਬਾਨ ਚਲਾਏ ॥"
page = 481

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On this side, Krishna getting infuriated, discharged many arrows"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਧਰੋਂ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਨੇ ਕ੍ਰੋਧਿਤ ਹੋ ਕੇ, ਉਸ ਨੂੰ ਵੇਖ ਕੇ ਬਹੁਤ ਬਾਣ ਚਲਾਏ ਹਨ।"