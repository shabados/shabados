[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਤਿਤ. ਉਧਾਰਣ; ਹਰਿ ਬਿਰਦੁ ਤੁਮਾਰਾ ਰਾਮ ॥"
page = 546
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To save the defaulters, is Thy characteristic, O Lord God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਪੀਆਂ ਨੂੰ ਪਾਰ ਉਤਾਰਨਾ ਤੇਰਾ ਨਿਤ-ਕ੍ਰਮ ਹੈ, ਹੇ ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It is Your Nature, Lord, to save the sinners."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰਿ ਬ੍ਯਾਪਕ! ਤੇਰਾ ਪਤਤ ਉਧਾਰਣ ਬਿਰਦ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇੰਜ ਕਰਨਾ ਤੇਰਾ ਮੁੱਢ-ਕਦੀਮਾਂ ਦਾ ਸੁਭਾਉ ਹੈ, ਹੇ ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗੇ ਹੋਇਆਂ ਨੂੰ (ਡੁੱਬਣੋਂ) ਬਚਾਣ ਵਾਲੇ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿਤ = ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗੇ ਹੋਏ। ਬਿਰਦੁ = ਮੁੱਢ-ਕਦੀਮਾਂ ਦਾ ਸੁਭਾਉ। ਉਧਾਰਣ = (ਵਿਕਾਰਾਂ ਵਿਚ) ਡੁਬਦਿਆਂ ਨੂੰ ਬਚਾਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Maestro Benévolo, Tesoro de Misericordia, yo busco Tu Refugio;"