data = "ਜਨੁ ਮੁਰਿ ਬੋਲੈ ਸੁਨ ਘਨ ਗਾਜਾ ॥੩੫॥"
page = 629

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The intoxicated kings were swinging here and there like the peacocks getting intoxicated hearing the thundering of clouds.35."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਬਦਲ ਦੀ ਗਰਜ ਨੂੰ ਸੁਣ ਕੇ ਮੋਰ ਬੋਲ ਰਹੇ ਹੋਣ ॥੩੫॥"