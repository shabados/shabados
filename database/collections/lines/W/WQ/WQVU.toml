[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਧੇ ਛੁਟਹਿ. ਸਚਿ; ਸਚੁ ਪਛਾਣੀਐ ॥"
page = 1287
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Recognising the Truest of the True, they are freed from the bonds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਚਿਆਰਾ ਦੇ ਪਰਮ ਸਚਿਆਰ ਦੀ ਸਿੰਞਾਣ ਕਰਨ ਦੁਆਰਾ, ਉਹ ਬੰਧਨਾਂ ਤੋਂ ਰਿਹਾ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They are released from bondage, realizing the True Lord as True."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸਚੁ) ਨਿਸਚੈ ਕਰ ਬੰਧੇ ਹੂਏ ਜੀਵ ਤੌ ਛੂਟਤੇ ਹੈਂ ਜਬ ਸਚ ਕੋ ਪਛਾਣ ਲੇਵੇਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਸੱਚੇ ਪ੍ਰਭੂ ਦੀ ਪਛਾਣ ਆ ਜਾਏ (ਜੇ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਨਾਲ ਡੂੰਘੀ ਸਾਂਝ ਬਣ ਜਾਏ) ਤਾਂ ਸਦਾ-ਥਿਰ ਹਰਿ-ਨਾਮ ਦੀ ਰਾਹੀਂ ਹੀ (ਇਹਨਾਂ ਜ਼ੰਜੀਰਾਂ ਵਿਚ) ਬੱਝੇ ਹੋਏ ਛੁੱਟ ਸਕਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਿ = ਸਦਾ-ਥਿਰ ਹਰਿ-ਨਾਮ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero sus amarras pueden ser abolidas al tomar Conciencia del Señor Verdadero."