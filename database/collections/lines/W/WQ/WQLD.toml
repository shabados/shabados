[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੂਝਹਿ ਗੁਰਮੁਖਿ; ਸੇ ਜਨ ਪੂਰੇ ॥"
page = 1025
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Perfect are the persons, who understand this; by Guru's grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਹਨ ਉਹ ਪੁਰਸ਼, ਜੋ ਇਸ ਨੂੰ ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਸਮਝਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukhs understand Him; perfect are those humble beings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਸਮਝਤੇ ਹੈਂ ਸੇ ਪੂਰੇ ਪੁਰਸ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੇ ਮਨੁੱਖ ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੋ ਕੇ ਇਹ ਭੇਦ ਸਮਝ ਲੈਂਦੇ ਹਨ ਉਹ ਅਭੁੱਲ ਆਤਮਕ ਜੀਵਨ ਵਾਲੇ ਬਣ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰੇ = ਸਾਰੇ ਗੁਣਾਂ ਦੇ ਮਾਲਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por la Gracia del Guru, es el que ha perfeccionado su ser."