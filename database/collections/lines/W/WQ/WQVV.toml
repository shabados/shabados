[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਭਾਉ ਭਗਤਿ ਭਉ ਭੇਲੁ; ਸਾਧ ਸਰੇਸਿਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He having the fear of the Lord and a loving devotion, is known as the sadhu of high stature."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਭੈ, ਭਾਉ, ਪ੍ਰੇਮਾਭਗਤੀ ਨਾਲ ਮੇਲ ਹੈ (ਇਸ ਕਰਕੇ) ਸ੍ਰੇਸ਼ਟ ਸਾਧੂ ਹਨ।"