[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਚੇ ਬੀਰ ਬੈਤਾਲਯੰ ਭੂਤ ਪ੍ਰੇਤੰ ॥"
page = 53

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The brave warriors are moving in the battlefield with naked swords, smeared with blood, evil spirits, ghosts, fiends and goblins are dancing."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬੀਰ-ਬੈਤਾਲ, ਭੂਤ ਅਤੇ ਪ੍ਰੇਤ ਆਦਿ (ਯੁੱਧ-ਭੂਮੀ ਵਿਚ) ਨਚ ਰਹੇ ਹਨ।"