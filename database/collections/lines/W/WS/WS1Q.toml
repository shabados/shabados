[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਸ ਕਉ. ਆਪੁ ਮਿਲਾਇਆ ॥"
page = 1278
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself unites His saints with Himself,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਖੁਦ ਹੀ ਆਪਣੇ ਸੰਤਾਂ ਨੂੰ ਆਪਣੇ ਨਾਲ ਮਿਲਾ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He unites us with Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਸਾਥ ਆਪ ਦਾਸ ਕੋ ਮਿਲਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪਣੇ ਆਪ ਨੂੰ ਆਪਣਾ ਆਪ (ਹੀ) ਮਿਲਾਂਦਾ ਹੈ। (ਕਿਉਂਕਿ ਜੀਵਾਂ ਵਿਚ ਭੀ ਉਹ ਆਪ ਹੀ ਹੈ ਅਤੇ ਜੀਵਾਂ ਨੂੰ ਆਪਣੇ ਨਾਲ ਮਿਲਾਣ ਵਾਲਾ ਭੀ ਉਹ ਆਪ ਹੀ ਹੈ।)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪਸ ਕਉ = ਆਪਣੇ ਆਪ ਨੂੰ। ਆਪੁ = ਆਪਣਾ ਆਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él nos une en Su Ser."