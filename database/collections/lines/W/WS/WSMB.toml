[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਗੁਰ ਸੇਵੇ; ਬਹੁਤੁ ਦੁਖੁ ਪਾਈ ॥੭॥"
page = 230
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without serving the Guru, they suffer immense pain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਚਾਕਰੀ ਕਰਨ ਦੇ ਬਿਨਾ ਉਹ ਬੜੀ ਤਕਲੀਫ ਉਠਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without serving the Guru, they suffer in terrible pain. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਸੇਵੇ ਬਿਨਾ ਬਹੁਤ ਦੁਖ ਪਾਵਤਾ ਹੈ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਨ ਨਾਹ ਆਉਣ ਕਰਕੇ ਬਹੁਤ ਦੁੱਖ ਪਾਂਦਾ ਹੈ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sin el Servicio del Guru sufren intenso dolor. (7)"