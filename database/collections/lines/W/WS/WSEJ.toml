[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖੋਜਤ ਚਰਿਓ; ਦੇਖਉ ਪ੍ਰਿਅ ਜਾਈ ॥"
page = 737
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I go out to search and see my dear Spouse."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਪਿਆਰੇ ਪਤੀ ਨੂੰ ਭਾਲਣ ਅਤੇ ਵੇਖਣ ਲਈ ਬਾਹਰ ਜਾਂਦੀ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have gone out searching to find my Beloved Husband Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਖੋਜਤੇ ਹੂਏ ਨੇ ਵਿਚਾਰਿਆ ਕਿ ਕਹੀਂ ਪ੍ਰਭੂ ਕੋ ਜਾਕਰ ਦੇਖਉਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਨੂੰ) ਲੱਭਣ ਚੜ੍ਹ ਪਿਆ (ਕਿ) ਮੈਂ ਪਿਆਰੇ ਦੇ ਰਹਿਣ ਦੀ ਥਾਂ (ਕਿਤੇ) ਵੇਖਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖੋਜਤ ਚਰਿਓ = ਲੱਭਣ ਚੜ੍ਹ ਪਿਆ ਹੈ। ਦੇਖਉ = ਦੇਖਉਂ, ਮੈਂ ਵੇਖਾਂ। ਪ੍ਰਿਅ ਜਾਈ = ਪਿਆਰੇ (ਦੇ ਰਹਿਣ) ਦੀ ਥਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "salgo a buscar a mi Dios."