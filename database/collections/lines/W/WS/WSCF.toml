[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਟਪਟ ਸੁਭਟ ਬਿਕਟ ਕਟੇ; ਝਟਪਟ ਭਈ ਅਭੰਗ ॥"
page = 707

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In that fierce fight the great warriors were chopped quickly"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਝਟਪਟ ਹੀ ਨਾ ਕਟੇ ਜਾ ਸਕਣ ਵਾਲੇ ਯੋਧੇ ਕਟੇ ਗਏ ਹਨ ਅਤੇ ਨਾ ਭੰਗ ਹੋਣ ਵਾਲੇ ਵੀ ਝਟਪਟ (ਭੰਗ) ਹੋ ਗਏ ਹਨ।"