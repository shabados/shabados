data = "ਭਏ ਏਕਠੇ ਭ੍ਰਾਤਿ ਭਾਵੰ ਬਿਚਾਰੀ ॥੨॥"
page = 161

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Considering this gathering as some stratagem against them, the proud demons also gathered together.2."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ ਵੀ) ਭਰਾਪਣੇ ਦੇ ਭਾਵ ਨੂੰ ਵਿਚਾਰ ਕੇ ਇਕੱਠੇ ਹੋ ਗਏ ॥੨॥"