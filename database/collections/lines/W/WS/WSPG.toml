[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵਣ ਜਾਣਾ. ਕਦੇ ਨ ਚੂਕੈ; ਮਾਇਆ ਮੋਹ ਪਿਆਰਾ ॥"
page = 570
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To them, love of wealth is sweet so their comings and goings end not ever."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਨੂੰ ਧੰਨ-ਦੌਲਤ ਦਾ ਪਿਆਰ ਮਿੱਠਾ ਲਗਦਾ ਹੈ, ਇਸ ਲਈ ਉਨ੍ਹਾਂ ਦੇ ਆਉਣੇ ਤੇ ਜਾਣੇ ਕਦਾਚਿੱਤ ਮੁਕਦੇ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Their comings and goings never end; emotional attachment to Maya is dear to them."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਕੋ ਮਾਇਆ ਕਾ ਮੋਹ ਪ੍ਯਾਰਾ ਹੈ, ਤਿਨ ਕਾ ਆਵਾਗਮਨ ਕਦੇ ਨਹੀਂ ਹਟਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਸਦਾ ਮਾਇਆ ਦਾ ਮੋਹ ਪਿਆਰਾ ਲੱਗਦਾ ਹੈ ਉਸ ਦਾ ਜਨਮ ਮਰਨ ਦਾ ਗੇੜ ਕਦੇ ਨਹੀਂ ਮੁੱਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਚੂਕੈ = ਨਹੀਂ ਮੁੱਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "más se envuelven en la contienda. Sin el conocimiento no logran la Felicidad,"