[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੇਦ ਲਹੋ ਇਨ ਕੋ ਤਿਨ ਮੈ; ਭ੍ਰਿਗ ਬੈਠੋ ਹੁਤੋ ਸੋਊ ਦੇਖਨ ਧਾਯੋ ॥੨੪੫੯॥"
page = 547

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In order to understand their tone, Bhrigu, one of the sages sitting there, went away,2459."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਵਿਚ (ਇਕ) ਭ੍ਰਿਗੂ (ਨਾਂ ਦਾ ਰਿਸ਼ੀ) ਬੈਠਾ ਹੋਇਆ ਸੀ। (ਉਸ ਨੇ ਦਾਵਾ ਕੀਤਾ ਕਿ ਮੈਂ) ਇਨ੍ਹਾਂ ਦਾ ਭੇਦ ਪਾ ਲਵਾਂਗਾ। (ਇਸ ਲਈ ਇਨ੍ਹਾਂ ਨੂੰ) ਵੇਖਣ ਲਈ ਉਹ ਤੁਰ ਪਿਆ ॥੨੪੫੯॥"