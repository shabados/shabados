[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਤਨੁ, ਤਾਮਿ ਸਗਾਰਵਾ; ਜਾਂ ਦੇਖਾ ਹਰਿ ਨੈਣੇ ॥"
page = 1317
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The alone my soul and body are embellished, when I see my Lord with my eyes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਜਿੰਦੜੀ ਅਤੇ ਦੇਹ ਕੇਵਲ ਤਦ ਹੀ ਸ਼ਿੰਗਾਰੀਆਂ ਜਾਂਣੀਆਂ ਹਨ, ਜਦ ਆਪਣਿਆਂ ਨੇਤਰਾਂ ਨਾਲ ਮੈਂ ਆਪਣੇ ਪ੍ਰਭੂ ਨੂੰ ਵੇਖਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind and body are embellished and exalted, when I behold the Lord with my eyes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਅਰੁ ਤਨ (ਤਾਮਿ) ਤੌ (ਸਗਾਰਵਾ) ਸਹਤ ਗੌਰਵਤਾ ਦੇ ਹੋਤਾ ਹੈ ਜੇਕਰ ਜੌਹਰੀ ਨੇਤ੍ਰੋਂ ਕਰ ਦੇਖਾ ਜਾਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੇਰਾ ਇਹ) ਮਨ ਅਤੇ ਸਰੀਰ ਤਦੋਂ ਹੀ ਆਦਰ ਜੋਗ ਹੋ ਸਕਦਾ ਹੈ, ਜਦੋਂ ਮੈਂ (ਆਪਣੀਆਂ) ਅੱਖਾਂ ਨਾਲ ਪਰਮਾਤਮਾ ਦਾ ਦਰਸਨ ਕਰ ਸਕਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾਮਿ = ਤਦੋਂ ਹੀ। ਸਗਾਰਵਾ = ਗੌਰਾ, ਆਦਰ = ਜੋਗ। ਦੇਖਾ = ਦੇਖਾਂ, ਮੈਂ ਵੇਖ ਸਕਾਂ। ਨੈਣੇ = ਅੱਖਾਂ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi cuerpo y mente son embellecidos y enaltecidos cuando tengo a mi Señor en mis ojos."