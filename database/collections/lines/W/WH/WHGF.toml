[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਹ ਸਫਲ ਸਦਾ ਸੁਖਦਾਈ ॥"
page = 628
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That is ever fruitful and peace-giving."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦੀਵ ਹੀ ਫਲਦਾਇਕ ਤੇ ਆਰਾਮ ਦੇਣ ਵਾਲੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That is always rewarding and peace-giving."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਬਾਣੀ ਸਦਾ ਸਫਲ ਰੂਪ ਅਰ ਸੁਖ ਕੀ ਦਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਬਾਣੀ ਸਦਾ ਹੀ ਸਾਰੇ ਫਲ ਦੇਣ ਵਾਲੀ ਸੁਖ ਦੇਣ ਵਾਲੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਹ = ਉਹ ਗੁਰਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh mis amigos, pues es Dadora de Paz"