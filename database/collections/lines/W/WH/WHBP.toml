[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਤ ਕਾ ਚਿਤੁ ਅਨੂਪੁ; ਮਰੰਮੁ. ਨ ਜਾਨੀਐ ॥"
page = 1362
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The heart of my friend is supremely beauteous, its mystery can be known not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਿੱਤਰ ਦਾ ਦਿਲ ਪਰਮ ਸੁੰਦਰ ਹੈ। ਇਸਦਾ ਭੇਤ ਜਾਣਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Consciousness of my Friend is incomparably beautiful. Its mystery cannot be known."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਕਾ ਮਿਤ੍ਰ ਰੂਪ ਜੋ ਵਾਹਿਗੁਰੂ ਹੈ ਤਿਸ ਕੇ ਅਨੂਪ ਚਿਤ ਕਾ ਭੇਦ ਕਿਸੀ ਪ੍ਰਕਾਰ ਸੇ ਨਹੀਂ ਜਾਨੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ-) ਮਿੱਤਰ ਦਾ ਚਿੱਤ ਅੱਤਿ ਸੋਹਣਾ ਹੈ, (ਉਸ ਦਾ) ਭੇਤ ਨਹੀਂ ਜਾਣਿਆ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਤ = (ਪ੍ਰਭੂ) ਮਿੱਤਰ। ਅਨੂਪੁ = (ਅਨ-ਊਪ) ਬੇ-ਮਿਸਾਲ, ਅੱਤਿ ਸੋਹਣਾ। ਮਰੰਮੁ = ਭੇਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Conciencia de mi Amigo es de Incomparable Belleza, Su Misterio no se conoce,"