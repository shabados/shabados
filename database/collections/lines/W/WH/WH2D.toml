[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਨਿ ਓਇ ਚੀਤੇ; ਚੀਤਨਹਾਰੇ ॥੧॥"
page = 329
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who is the painter, who has painted them?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਕਿਹੜੇ ਚਿੱਤਰਕਾਰ ਨੇ ਚਿਤਰੇ ਹਨ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- who is the painter who painted them? ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਕਿਸ ਚਤੇਰੇ ਨੇ ਚੀਤੇ ਹੈਂ? ਭਾਵ ਈਸ੍ਵਰ ਰਚਤ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਸ ਚਿੱਤ੍ਰਕਾਰ ਨੇ ਚਿੱਤਰੇ ਹਨ? ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਨਿ = ਕਿਸ ਨੇ? ਚੀਤੇ = ਚਿੱਤਰੇ ਹਨ। ਚੀਤਨਹਾਰੇ = ਚਿੱਤ੍ਰਕਾਰ ਨੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿quién es el que las ha plantado ahí tan alto?  (1)"