[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਮ ਪੁਰਿ; ਫਾਸਹਿਗਾ ਜਮ ਜਾਲੀ ॥"
page = 993
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the city of death, he is caught in the city of Yama's noose."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੌਤ ਦੇ ਸ਼ਹਿਰ ਅੰਦਰੇ ਉਹ ਯਮ ਦੀ ਫਾਹੀ ਵਿੱਚ ਫਸ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the City of Death, you will be caught by the noose of the Messenger of Death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਮ ਪੁਰੀ ਮੇਂ ਜਮੋਂ ਕੀ ਜਾਲੀ ਬੀਚ ਤੂੰ  ਫਸੇਂਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਮ ਦੀ ਨਗਰੀ ਵਿਚ ਜਮ ਦੇ ਜਾਲ ਵਿਚ ਫਸੇਂਗਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਮ ਜਾਲੀ = ਜਮ ਦੇ ਜਾਲ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es atrapado con el lazo ahí donde Yama habita;"