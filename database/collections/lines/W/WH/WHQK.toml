[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਿਤੇ ਸਰਬ ਪਾਰਸ ਨਾਥੰ ਬੁਲਾਏ ॥"
page = 678

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the saints who had come at that place, they were all called by Prasnath"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਸਾਰਿਆਂ ਨੂੰ ਪਾਰਸਨਾਥ ਨੇ ਬੁਲਾ ਲਿਆ।"