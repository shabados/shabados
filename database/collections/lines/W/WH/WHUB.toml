[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਵਤ ਮਰੈ; ਬੁਝੈ ਪ੍ਰਭੁ ਸੋਇ ॥"
page = 741
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who remains dead in life understands the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੀਉਂਦੇ ਜੀ ਮਰਿਆ ਰਹਿੰਦਾ ਹੈ, ਉਹ ਸਾਹਿਬ ਨੂੰ ਸਮਝ ਲੈਂੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who remains dead while yet alive understands God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੰਸਾਰ ਕੀ ਤਰਫੋਂ ਜੀਵਤਾ ਹੀ ਮਰਤਾ ਹੈ ਪੁਨਾ ਸੋਈ ਪ੍ਰਭੂ ਕੋ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੇਹੜਾ ਮਨੁੱਖ ਦੁਨੀਆ ਦੀ ਕਾਰ ਕਰਦਾ ਹੋਇਆ ਹੀ (ਦੁਨੀਆ ਦਾ) ਮੋਹ ਤਿਆਗ ਦੇਂਦਾ ਹੈ, ਉਹ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਨਾਲ ਸਾਂਝ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਵਤ = ਜੀਉਂਦਾ ਹੋਇਆ, ਦੁਨੀਆ ਦੇ ਕੰਮ-ਕਾਰ ਕਰਦਾ ਹੋਇਆ ਹੀ। ਮਰੈ = (ਮੋਹ ਵਲੋਂ) ਮਰਦਾ ਹੈ, ਮੋਹ ਛੱਡ ਦੇਂਦਾ ਹੈ। ਸੋਇ = ਉਹ ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que muere para su ser mientras vive, sólo él conoce a su Señor."