[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਖ ਮਨ ਅੰਤਰਿ; ਸਹਜਿ ਸਮਾਣੀ ॥੨॥"
page = 663
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by which the soul is easily absorbed in peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੁਆਰਾ ਆਤਮਾ ਸੁਖੈਨ ਹੀ ਅਨੰਦ ਵਿੱਚ ਲੀਨ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They bring peace to the mind, and celestial peace is absorbed within. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸੀ ਕਰ ਕੇ ਹਮਾਰੇ ਮਨ ਅੰਤਰ ਸੁਖ ਹੂਆ ਹੈ ਔਰ ਬ੍ਰਿਤੀ (ਸਹਜਿ) ਸਾਂਤੀ ਮੇਂ ਸਮਾਈ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਨੁੱਖ ਦੇ) ਮਨ ਵਿਚ ਆਤਮਕ ਹੁਲਾਰੇ ਪੈਦਾ ਕਰਦੀ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਖ = ਆਤਮਕ ਆਨੰਦ {ਬਹੁ-ਵਚਨ}। ਮਨ ਅੰਤਰਿ = ਮਨ ਵਿਚ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a través de ella el Shushmana llega al Estado de Equilibrio. (2)"