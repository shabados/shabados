[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹੈ ਤੁਮੈ ਸੋ ਕੀਜਿਯਹੁ; ਜੁ ਕਛੁ ਤੁਹਾਰੇ ਸਾਥ ॥੯॥"
page = 834

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘To learn the same you will have to proceed the way I ask.(9)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਮੈਂ ਤੁਹਾਨੂੰ ਕਰਨ ਲਈ ਕਹਾਂ, ਉਹੋ ਤੁਸੀਂ ਕਰੋ ॥੯॥"