[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਜਲ ਮਹਿ ਜਲੁ; ਆਇ ਖਟਾਨਾ ॥"
page = 278
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As water comes and gets blended with water,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਪਾਣੀ ਆ ਕੇ ਪਾਣੀ ਨਾਲ ਮਿਲ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As water comes to blend with water,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਜਲ ਮੇਂ ਜਲ ਆਇ ਕਰਕੈ ਸਮਾਇ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸੋ) ਜਿਵੇਂ ਪਾਣੀ ਵਿਚ ਪਾਣੀ ਆ ਰਲਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖਟਾਨਾ = ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como el agua se incorpora al agua,"