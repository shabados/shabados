[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਮਿਲਿ ਨਾਨਕ; ਕਮਲ ਪ੍ਰਗਾਸ ॥੪॥੧੩॥"
page = 1184
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting with the Guru, O Nanak, the Heart-lotus blossoms."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਨਾਲ ਮਿਲਣ ਦੁਆਰਾ, ਹੇ ਨਾਨਕ! ਦਿਲ ਕੰਵਲ ਵਾਂਗ ਖਿੜ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the heart-lotus of the Gurmukh blossoms forth. ||4||13||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਗੁਰੋਂ ਕੋ ਮਿਲ ਕਰ ਤਿਨ ਕਾ ਰਿਦਾ ਕਮਲ ਪ੍ਰਫੁਲਤ ਹੂਆ ਹੈ॥੪॥੧੩॥☬ਉਪਦੇਸੁ ਹੈ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਗੁਰੂ ਨੂੰ ਮਿਲ ਕੇ (ਨਾਮ ਦੀ ਬਰਕਤਿ ਨਾਲ ਉਹਨਾਂ ਦਾ) ਹਿਰਦਾ-ਕੌਲ ਖਿੜਿਆ ਰਹਿੰਦਾ ਹੈ ॥੪॥੧੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਮਲ ਪ੍ਰਗਾਸ = ਹਿਰਦਾ ਖਿੜ ਪੈਂਦਾ ਹੈ ॥੪॥੧੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y el Loto de Nanak también florece, encontrando al Guru. (4-13)"