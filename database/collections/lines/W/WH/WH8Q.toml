[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੀ ਮਹਿਮਾ; ਕਥਨੁ. ਨ ਜਾਇ ॥"
page = 1271
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru's glory can be uttered not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਪ੍ਰਭਤਾ ਆਖੀ ਨਹੀਂ ਜਾ ਸਕਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru's glorious grandeur cannot be described."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਮਹਿਮਾ ਕਥਨ ਕਰੀ ਨਹੀਂ ਜਾਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਵਡਿਆਈ ਬਿਆਨ ਨਹੀਂ ਕੀਤੀ ਜਾ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਹਿਮਾ = ਵਡਿਆਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Gloriosa Grandeza del Guru es Indescriptible."