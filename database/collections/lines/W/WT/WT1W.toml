[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੂਟਨੁ ਕਿਸੈ ਕਹਹੁ; ਸੰਸਾਰ ॥"
page = 872
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In this world, whom do you call a procurer?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਜਹਾਨ ਅੰਦਰ ਤੁਸੀਂ ਕਿਸ ਨੂੰ ਦਲਾ ਆਖਦੇ ਹੋ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who is called a pimp in this world?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਸਾਰੀ ਲੋਕੋ! ਤੁਮ ਕੂਟਨ ਕਿਸ ਕੋ ਕਹਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਜਗਤ ਦੇ ਲੋਕੋ! ਤੁਸੀ 'ਕੂਟਨ' ਕਿਸ ਨੂੰ ਆਖਦੇ ਹੋ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਸਾਰ = ਹੇ ਸੰਸਾਰ! ਹੇ ਲੋਕੋ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Quién es controlador de prostitutas en este mundo?"