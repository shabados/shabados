[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਤਾ; ਸਭੁ ਕੋ ਤੇਰੈ ਜੋਰਿ ॥"
page = 17
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O My Creator! all are in Thy power."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਕਰਤਾਰ! ਸਾਰੇ ਤੇਰੇ ਵੱਸ ਵਿੱਚ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Creator Lord, all are in Your Power."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਰਤਾਰ! ਸਭ ਕੋਈ ਤੇਰੇ ਹੀ ਬਲ ਕਰ ਇਸਥਿਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਰਤਾਰ! ਹਰੇਕ ਜੀਵ ਤੇਰੇ ਹੁਕਮ ਵਿਚ (ਹੀ ਤੁਰ ਸਕਦਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਤਾ = ਹੇ ਕਰਤਾਰ! ਸਭੁ ਕੋ = ਹਰੇਕ ਜੀਵ। ਤੇਰੈ ਜੋਰਿ = ਤੇਰੇ ਜ਼ੋਰ ਵਿਚ, ਤੇਰੇ ਹੁਕਮ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi Creador todo está bajo Tu Poder,"