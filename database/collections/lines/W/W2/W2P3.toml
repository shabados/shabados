[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਦਰਿ ਮਹਲ ਅਨੇਕ ਹਹਿ; ਜੀਉ ਕਰੇ ਵਸੇਰਾ ॥"
page = 425
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within the body are many mansions, and the soul dwells therein."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਰੀਰ ਦੇ ਵਿੱਚ ਘਣੇਰੇ ਮੰਦਰ ਹਨ ਅਤੇ ਆਤਮਾ ਊਨ੍ਹਾਂ ਅੰਦਰ ਵਸਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There are so many mansions within the body; the soul dwells within them."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੇਕ (ਮਹਲ) ਸਰੀਰੋਂ ਕੇ ਅੰਦਰ ਜੋ ਏਕ ਬ੍ਰਹਮ ਪੂਰਨ ਹੈ, ਜੇ ਕਰ ਜੀਵ ਤਿਸਮੇਂ ਬਾਸਾ ਕਰੇ, ਭਾਵ ਇਸਥਿਤ ਹੋਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਨਾਮ-ਧਨ ਦੇ ਅਨੇਕਾਂ ਖ਼ਜ਼ਾਨੇ ਮੌਜੂਦ ਹਨ, ਜੀਵਾਤਮਾ ਭੀ ਅੰਦਰ ਹੀ ਵੱਸਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਦਰਿ ਮਹਲ = ਸਰੀਰ ਦੇ ਅੰਦਰ। ਅਨੇਕ ਹਹਿ = ਅਨੇਕਾਂ ਰਤਨ ਹਨ। ਜੀਉ = ਜੀਵਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Hay tantas mansiones dentro del cuerpo en las que el Alma habita,"