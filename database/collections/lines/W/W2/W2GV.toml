[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਇ ਪੁਛਹੁ. ਸੋਹਾਗਣੀ ਵਾਹੈ; ਕਿਨੀ ਬਾਤੀ. ਸਹੁ ਪਾਈਐ ॥"
page = 722
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Go and ask the chaste brides, by what actions is the Spouse obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਾ ਕੇ ਸਤਵੰਤਿਆਂ ਵਹੁਟੀ ਕੋਲੋ ਵਹੁਟੀਆਂ ਪਾਸੋਂ ਪਤਾ ਕਰ ਲਓ ਕਿ ਕਿਹੜੀਆਂ ਅਮਲਾਂ ਦੁਆਰਾ ਕੰਤ ਪਾਇਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Go and ask the happy, pure soul-brides, how did they obtain their Husband Lord?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਵਾਹੈ) ਓਹ ਜੋ ਸੰਤ ਜਨ ਰੂਪੀ ਸੋਹਾਗਣੀਆਂ ਹੈਂ ਤਿਨ ਕੇ ਪਾਸ ਜਾਇਕਰ ਪੂਛੇ, ਜੋ ਕਿਨੀ (ਬਾਤੀ) ਗਲਾਂ ਕਰ ਪਤੀ ਕੋ ਪਾਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਨ੍ਹਾਂ ਨੂੰ ਪਤੀ-ਪ੍ਰਭੂ ਮਿਲ ਪਿਆ ਹੈ, ਬੇਸ਼ਕ) ਉਹਨਾਂ ਸੁਹਾਗ ਭਾਗ ਵਾਲੀਆਂ ਨੂੰ ਜਾ ਕੇ ਪੁੱਛ ਵੇਖੋ ਕਿ ਕਿਹਨੀਂ ਗੱਲੀਂ ਖਸਮ-ਪ੍ਰਭੂ ਮਿਲਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਾਹੈ = ਉਹਨਾਂ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ve y pregunta a las verdaderas Esposas, ¿Cómo lograron estar con su Señor?"