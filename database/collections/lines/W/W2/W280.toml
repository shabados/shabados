[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਜਨੁ ਨਿਰਮਲੁ; ਜਿਨਿ ਆਪੁ ਪਛਾਤਾ ॥"
page = 1046
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Immaculate is the man who knows himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤਰ ਹੈ ਉਹ ਪੁਰਸ਼ਾ ਜੋ ਆਪਦੇ ਆਪ ਨੂੰ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That humble being is immaculate, who knows his own self."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪੁਰਸ ਨਿਰਮਲ ਹੈ ਜਿਸ ਨੇ ਆਪਨੇ ਆਪ ਕੋ ਪਛਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਆਪਣੇ ਆਤਮਕ ਜੀਵਨ ਨੂੰ ਪੜਤਾਲਣਾ ਸ਼ੁਰੂ ਕਰ ਦਿੱਤਾ, ਉਹ ਮਨੁੱਖ ਪਵਿੱਤਰ ਜੀਵਨ ਵਾਲਾ ਬਣ ਗਿਆ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਮਨੁੱਖ) ਨੇ। ਆਪੁ = ਆਪਣੇ ਆਪ ਨੂੰ, ਆਪਣੇ ਜੀਵਨ ਨੂੰ। ਪਛਾਤਾ = ਪੜਤਾਲਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo aquél que Lo conoce es Puro e Inmaculado."