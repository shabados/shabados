[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਪਤੁ ਪਰਗਟੁ; ਤੂੰ ਸਭਨੀ ਥਾਈ ॥"
page = 124
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In all the non-apparent and apparent places Thou art O Lord!"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਪੋਸ਼ੀਦਾ ਤੇ ਪਰਤੱਖ ਥਾਵਾਂ ਵਿੱਚ ਤੂੰ ਹੈ, ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the hidden and the revealed in all places."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਗੁਪਤ ਪ੍ਰਗਟ ਸਭ ਅਸਥਾਨੋਂ ਮੇਂ ਜਾਣ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਸਭ ਥਾਵਾਂ ਵਿਚ ਮੌਜੂਦ ਹੈਂ, (ਕਿਸੇ ਨੂੰ) ਪਰਤੱਖ (ਦਿੱਸ ਪੈਂਦਾ ਹੈਂ ਕਿਸੇ ਦੇ ਭਾ ਦਾ) ਲੁਕਿਆ ਹੋਇਆ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú eres lo sutil y lo aparente en todas partes,"