[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਕੇ ਚਾਕਰ; ਤਿਸ ਕੀ ਸੇਵਾ ॥"
page = 1024
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I serve Him whose servant I am."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਸ ਦੀ ਟਹਿਲ ਸੇਵਾ ਕਰਦਾ ਹਾਂ ਜਿਸ ਦਾ ਮੈਂ ਨੌਕਰ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am His servant; I serve Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਚਾਕਰ ਹੋਵੈਂ ਜੇ ਤਿਸ ਕੀ ਸੇਵਾ ਕਰੇ ਤੌ ਸੁਆਮੀ ਪਰਸੰਨ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਉਸ ਪ੍ਰਭੂ ਦੇ ਸੇਵਕ ਬਣ ਕੇ ਉਸ ਦੀ ਸੇਵਾ-ਭਗਤੀ ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸ ਕੇ = ਜਿਸ (ਪ੍ਰਭੂ) ਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Debemos servir a Aquél de Quien somos Sirvientes,"