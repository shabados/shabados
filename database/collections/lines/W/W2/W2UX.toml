type = "primary"
data = "ਡਗ ਡਗ ਹੋਮ ਮੰਤ੍ਰ ਕਰਿ ਛਾਡਾ ॥"
page = 626

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He got planted the columns of Yajnas at short distances and performed heaven at various places by reciting mantras"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪੈਰ ਪੈਰ ਉਤੇ ਮੰਤਰਾਂ ਸਹਿਤ ਹੋਮ ਕਰਵਾ ਦਿੱਤੇ।"