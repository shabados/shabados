[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮੇਰੇ; ਗੁਰਮਤਿ ਕਰਣੀ ਸਾਰੁ ॥"
page = 559
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, under Guru's instruction do thou the good deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਤਾਬੇ ਤੂੰ ਸ਼੍ਰੇਸ਼ਟ ਅਮਲ ਕਮਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, under Guru's Instruction, do good deeds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਗੁਰਮਤ ਸੇ (ਸਾਰੁ) ਸ੍ਰੇਸ਼ਟ (ਕਰਣੀ) ਭਗਤੀ ਕਰ ਵਾ ਗੁਰਮਤ ਧਾਰਨ ਕਰਨਾ ਇਹੀ ਸ੍ਰੇਸ਼ਟ ਕਰਣੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਗੁਰੂ ਦੀ ਮੱਤ ਲੈ ਕੇ ਜੀਵਨ-ਚਾਲ ਚੱਲ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਣੀ = ਜੀਵਨ-ਕਰਤੱਬ। ਸਾਰੁ = ਸੰਭਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, actúa sobre la base de la Instrucción del Guru, pues si uno habita siempre en el Señor y Maestro,"