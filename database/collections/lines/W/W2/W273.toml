[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬੈਰਮ ਖਾ ਮੁਹਿ ਭ੍ਰਿਤ ਕੌ; ਬੀਰਾ ਦਯੋ ਬੁਲਾਇ ॥੯॥"
page = 928

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Bairam Khan has deputed me to fight for him.’(9)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਬੈਰਮ ਖਾਂ ਨੇ ਮੈਨੂੰ ਦਾਸੀ ਨੂੰ ਬੁਲਾ ਕੇ (ਇਸ ਜੰਗ ਨੂੰ ਲੜਨ ਦਾ) ਬੀੜਾ ਦਿੱਤਾ ਹੈ ॥੯॥"