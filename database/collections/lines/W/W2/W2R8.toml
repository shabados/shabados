[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਗੁਰ ਕੇ ਚਰਨ ਸਰੇਵਹੁ; ਜਿਨਿ ਭੂਲਾ ਮਾਰਗਿ ਪਾਇਆ ॥੫॥"
page = 1043
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, worship thou the feet of the Guru, who has put the one who has lost the way on the right path."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਤੂੰ ਗੁਰਾਂ ਦੇ ਪੈਰਾ (ਨਾਮ) ਦੀ ਉਪਾਸਨਾਂ ਕਰ, ਜਿਨ੍ਹਾਂ ਨੇ ਘੁੱਸੇ ਹੋਏ ਨੂੰ ਠੀਕ ਰਾਹੇ ਪਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, dwell upon, and serve at the Guru's feet; He places those who wander back on the Path. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਗੁਰੋਂ ਕੇ ਚਰਨ ਸੇਵਨ ਕਰੋ, ਜਿਨੋਂ ਨੇ ਏਹ ਮਨ ਭੁਲਾ ਹੂਆ ਰਸਤੇ ਮੇਂ ਪਾਇਆ ਹੈ॥੫॥ ਤਾਂ ਤੇ ਐਸੇ ਬੇਨਤੀ ਕਰੇ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਿਸ ਗੁਰੂ ਨੇ ਭੁੱਲੇ ਹੋਏ ਜੀਵ ਨੂੰ ਸਹੀ ਜੀਵਨ-ਰਸਤੇ ਉਤੇ ਪਾਇਆ ਹੈ (ਭਾਵ, ਜੇਹੜਾ ਗੁਰੂ ਭਟਕਦੇ ਜੀਵ ਨੂੰ ਠੀਕ ਰਾਹ ਤੇ ਪਾ ਦੇਂਦਾ ਹੈ) ਉਸ ਗੁਰੂ ਦੇ ਚਰਨ ਪੂਜੋ (ਭਾਵ, ਆਪਾ-ਭਾਵ ਗਵਾ ਕੇ ਉਸ ਗੁਰੂ ਦਾ ਪੱਲਾ ਫੜੋ) ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਗੁਰੂ) ਨੇ। ਸਰੇਵਹੁ = ਪੂਜੋ। ਮਾਰਗਿ = ਸਹੀ ਰਸਤੇ ਉਤੇ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, sirve a los Pies del Guru, Quien toma a los extraviados y los lleva de regreso al Sendero.(5)"