data = "ਧਨੁ ਭੂਪ ਤੇ ਬਹੁ ਪਾਇ ॥੬॥੩੧੭॥"
page = 154

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The animal was burnt in the altar-pit, for which much wealth was received from the king.6.317."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਬ੍ਰਾਹਮਣਾਂ ਨੇ) ਰਾਜ ਤੋਂ ਬਹੁਤ ਧਨ ਪ੍ਰਾਪਤ ਕੀਤਾ ॥੬॥੩੧੭॥"