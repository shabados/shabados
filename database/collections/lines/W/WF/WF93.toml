[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਦਰਗਹ ਸੋਭਾਵੰਤ ॥"
page = 898
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I shall be illustrious in Lord's court,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਦਰਬਾਰ ਅੰਦਰ ਮੈਂ ਕੀਰਤੀਮਾਨ ਹੋਵਾਂਗਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I will be respected in the Court of the Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਦਰਗਾਹਿ ਮੇਂ ਹਮ ਸੋਭਾਵਾਨ ਹੋਵੇਂਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਸੋਭਾ ਵਾਲਾ ਬਣਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En la Corte del Señor,"