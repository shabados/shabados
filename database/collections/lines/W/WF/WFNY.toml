[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਸੰਤਨ ਕੀ; ਕਰਹਿ ਪ੍ਰਤਿਪਾਲਾ ॥"
page = 100
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord! Thou nurturest Thine saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਤੂੰ ਆਪਣੇ ਸਾਧੂਆਂ ਦੀ ਪਰਵਰਸ਼ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You cherish and nurture the Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੰਤ ਜਨੋਂ ਕੀ ਪਾਲਨਾਂ ਕਰਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਪਾਲ-ਪ੍ਰਭੂ! ਹੇ ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਪਾਲਣਹਾਰ! ਤੂੰ ਆਪਣੇ ਸੰਤਾਂ ਦੀ ਸਦਾ ਰੱਖਿਆ ਕਰਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਤਿਪਾਲਾ = ਪਾਲਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú te diviertes con los Santos;"