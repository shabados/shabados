[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕੁ ਮਾਗੈ; ਨਾਮੁ ਦਾਨੁ ॥"
page = 1305
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, Nanak, begs Thee for the bounty of Thy Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਨਾਨਕ ਤੇਰੇ ਪਾਸੋਂ ਨਾਮ ਦੀ ਖੈਰ ਮੰਗਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak begs for the Gift of the Naam, the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤੇਰਾ ਨਾਮੁ ਦਾਨੁ ਮਾਂਗਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇਰਾ ਦਾਸ) ਨਾਨਕ (ਤੇਰੇ ਦਰ ਤੋਂ ਤੇਰਾ) ਨਾਮ-ਦਾਨ ਮੰਗਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕੁ ਮਾਗੈ = ਨਾਨਕ ਮੰਗਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, Señor Misericordioso, bendíceme por favor, con Tu Bondad y Compasión."