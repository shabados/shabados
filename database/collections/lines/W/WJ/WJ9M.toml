[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਹਿਲੇ ਗੁਰਿ ਉਪਦੇਸ ਦੇ; ਸਿਖ ਪੈਰੀ ਪਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "First the Guru making the disciple sit near his feet preaches to him."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਹਿਲੇ ਗੁਰ ਸਿੱਖ ਨੂੰ (ਆਪਣੀ) ਚਰਨੀਂ ਲਾਕੇ ਉਪਦੇਸ਼ ਦਿੰਦੇ ਹਨ।"