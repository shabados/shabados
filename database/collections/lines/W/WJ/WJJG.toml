[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਹਿਲੇ ਦੇ ਪਰਦਖਣਾ; ਪੈਰੀ ਪੈ ਕੇ ਲੈ ਗਲਿ ਲਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "First he circumambulated around Sudama and then touching his feet he embraced him."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਹਿਲੇ ਪ੍ਰਦੱਖਣਾ ਕੀਤੀ, ਪੈਰੀ ਪਏ ਫੇਰ ਗਲ ਨਾਲ ਲਾਯਾ।"