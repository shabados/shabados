[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਸਿਉ ਲੂਕ; ਜੋ ਸਦ ਹੀ ਸੰਗੀ ॥"
page = 376
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He hides from Him, who is ever with him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਉਸ ਪਾਸੋਂ ਲੁਕੋਦਾਂ ਹੈ, ਜਿਹੜਾ ਹਮੇਸ਼ਾਂ ਹੀ ਉਸ ਦੇ ਨਾਲ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He tries to hide from the One who is always with him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਤਿਸ) ਹਰੀ ਸੇ (ਲੂਕ) ਛਪਾਉ ਕਰਤਾ ਹੈ, ਜੋ ਸਰਬਕਾਲ ਸੰਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਪਰਮਾਤਮਾ ਸਦਾ ਹੀ (ਜੀਵ ਦੇ ਨਾਲ) ਸਾਥੀ ਹੈ ਉਸ ਤੋਂ ਓਹਲਾ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੂਕ = ਲੁਕਾਉ, ਓਹਲਾ। ਸੰਗੀ = ਸਾਥੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Se esconde de Aquél que siempre está con él,"