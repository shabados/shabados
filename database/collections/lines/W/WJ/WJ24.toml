[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਪ ਪਥਰ; ਤਰਣੁ. ਨ ਜਾਈ ॥"
page = 990
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sin is a stone which bloats not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਨਾਹ ਇਕ ਪੱਥਰ ਹੈ, ਜੋ ਤਰਦਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sin is a stone which does not float."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਿਰ ਪਰ ਪਾਪੋਂ ਰੂਪ ਪਥਰ ਉਠਾਏ ਹੂਏ ਹੈਂ ਇਸੀ ਤੇ ਤਰਾ ਨਹੀਂ ਜਾਤਾ ਹੈ; ਵਾ ਸਰੀਰੁ ਘਰੁ ਤੇਰਾ ਕਾਲ ਰੂਪ ਘੁੰਮਣਵਾਣੀ ਮੇਂ ਪੜਾ ਹੂਆ ਪੁਨਾ ਪਾਪ ਰੂਪ ਪਥਰੋਂ ਕਰ ਕੇ ਭਰਿਆ ਹੂਆ ਹੈ, ਇਸ ਤੇ ਤਰਿਆ ਨਹੀਂ ਜਾਤਾ॥☬ਪ੍ਰਸਨ: ਤਰਿਆ ਕਿਸ ਪ੍ਰਕਾਰ ਜਾਇ?☬ਉਤ੍ਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਾਪਾਂ ਦੇ ਪੱਥਰ ਲੱਦ ਕੇ ਜ਼ਿੰਦਗੀ ਦੀ ਬੇੜੀ ਇਹਨਾਂ ਘੁੰਮਣ-ਘੇਰੀਆਂ ਵਿਚੋਂ ਪਾਰ ਨਹੀਂ ਲੰਘ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਰਣੁ ਨ ਜਾਈ = ਪਾਰ ਨਹੀਂ ਲੰਘਿਆ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El error es una piedra que no flota,"