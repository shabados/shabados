[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਉ; ਭਈ ਤੁਮਾਰੀ ਧੀਰ ॥"
page = 978
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who has Thine support, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਤੇਰਾ ਆਸਰਾ ਹੈ, ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whoever has You for support,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੋ ਤੁਮਾਰੀ ਧੀਰ ਵਾ ਧੀਰਜਤਾ ਪ੍ਰਾਪਤਿ ਭਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਤੇਰੀ ਦਿੱਤੀ ਧੀਰਜ ਮਿਲ ਗਈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕਉ = ਜਿਸ (ਮਨੁੱਖ) ਨੂੰ। ਧੀਰ = ਧੀਰਜ, ਹੌਸਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien sea que Te tiene como Soporte, el miedo a la muerte"