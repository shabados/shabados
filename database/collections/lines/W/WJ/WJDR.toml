[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਹ ਆਏ ਘਰਿ ਆਪਣੈ; ਚੋਰ ਜਾਰਿ ਲੈ ਗਰਦਨਿ ਮਾਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The rich men handing over the thieves (to the authorities), happily return home but caught from their necks the thieves are beaten hollow."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸ਼ਾਹ ਲੋਕ ਆਪਣੇ ਘਰਾਂ ਵਿਖੇ (ਅਨੰਦ ਕਰਦੇ) ਆਉਂਦੇ ਹਨ, ਚੋਰਾਂ ਯਾਰਾਂ ਨੂੰ ਥਾਂ ਮਾਰਦੇ ਹਨ।"