[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੀ; ਰਾਮ ਨਾਮਿ ਲਿਵ ਲਾਗੀ ॥੧॥"
page = 193
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who has enshrined love for the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਨਾਲ ਪ੍ਰੀਤ ਲਗੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "by those who are lovingly absorbed in the Lord's Name. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕਾ ਦਰਸ਼ਨ ਵਡੇ ਪੁੰਨੋਂ ਕਰ ਪਾਈਏ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਲਗਨ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਿਚ ਲੱਗੀ ਰਹਿੰਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਮ ਨਾਮਿ = ਰਾਮ ਦੇ ਨਾਮ ਵਿਚ। ਲਿਵ = ਲਗਨ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "cuya Alma está entonada en el Naam, el Nombre del Señor.(1)"