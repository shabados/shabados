data = "ਅਤੇ ਜਿਸ ਨੇ ਮੁੱਠੀ ਭਰ ਮਿੱਟੀ ਨੂੰ ਬੋਲਣ ਦੀ ਦਾਤ ਬਖਸ਼ੀ ਹੈ ।"

