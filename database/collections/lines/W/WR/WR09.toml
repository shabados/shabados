[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਨ ਕਮਲ ਅਧਾਰੁ ਜਨ ਕਾ; ਰਾਸਿ ਪੂੰਜੀ ਏਕ ॥"
page = 675
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou Lord's lotus feet are the support of His slave, and they alone are his capital and stock-in-trade."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਚਰਨ-ਕੰਵਲ ਹੀ ਉਸ ਦੇ ਗੋਲੇ ਦਾ ਆਸਰਾ ਹਨ, ਅਤੇ ਕੇਵਲ ਉਹ ਹੀ ਉਸ ਦੀ ਰਾਸ ਤੇ ਮੂੜੀ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The lotus feet of the Lord are the support of His humble servants. They are his only capital and investment."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਚਰਨ ਕਮਲ (ਜਨ) ਦਾਸੋਂ ਕਾ ਆਸਰਾ ਰੂਪ ਹੈ, ਕਿਉਂਕਿ ਤਿਨ ਕੀ (ਰਾਸਿ) ਸਚੀ ਪੂੰਜੀ ਏਕ ਵਾਹਿਗੁਰੂ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਦੇ ਸੋਹਣੇ ਚਰਨ ਹੀ ਭਗਤਾਂ (ਦੇ ਆਤਮਕ ਜੀਵਨ) ਦਾ ਸਰਮਾਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਧਾਰੁ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Pies de Loto del Señor son el Soporte de los Humildes Sirvientes y es el único capital e inversión que poseen."