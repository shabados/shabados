[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧ ਕੈ ਸੰਗਿ; ਨ ਬੀਗਾ ਪੈਰੁ ॥"
page = 271
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By associating with the saints man's feet walk not astray."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤਾਂ ਦੀ ਸੰਗਤ ਕਰਨ ਦੁਆਰਾ ਬੰਦਾ ਟੇਢੇ ਪੈਰ ਨਹੀਂ ਧਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Company of the Holy, one's feet do not wander."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਸੰਤੋਂ ਕੇ ਸੰਗ ਕਰ ਪੈਰ ਵਿੰਗਾ ਅਰਥਾਤ ਵਿਪਰਜੇ ਕਰਮੁ ਨਹੀਂ ਕਰਤਾ, ਭਾਵ ਖੋਟਾ ਆਚਰਨ ਨਹੀਂ ਹੋਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਿਸੇ ਮੰਦੇ ਪਾਸੇ ਪੈਰ ਨਹੀਂ ਪੁੱਟੀਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੀਗਾ = ਵਿੰਗਾ। ਬੀਗਾ ਬੈਰੁ = ਵਿੰਗਾ ਪੈਰ, ਵਿੰਗੇ ਪਾਸੇ ਕਦਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Conviviendo con seres virtuosos se conduce sin desviaciones por la buena Senda y deja de juzgar al prójimo."