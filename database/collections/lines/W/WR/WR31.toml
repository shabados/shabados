[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਰਝਿ ਰਹਿਓ ਸਭ ਸੰਗਿ; ਅਨੂਪ ਰੂਪਾਵਤੀ ॥"
page = 261
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord of peerless beauty is contained with (among) all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲਾਸਾਨੀ ਸੁੰਦਰਤਾ ਵਾਲਾ ਸਾਹਿਬ ਸਮੂਹ ਨਾਲ (ਅੰਦਰ) ਰਮ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord of Incomparable Beauty is involved with all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਤੂੰ ਸਰਬ ਕੇ ਸਾਥ (ਉਰਝਿ) ਫਸ, ਭਾਵ ਤਾਣੇ ਪੇਟੇ ਵਤ ਮਿਲ ਰਹਾ ਹੈਂ ਔਰ ਉਪਮਾ ਤੇ ਰਹਿਤ ਰੂਪ ਵਾਲੀ ਤੇਰੀ ਸੱਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੋਹਣੇ ਰੂਪ ਵਾਲਾ ਪ੍ਰਭੂ ਸਭ ਜੀਵਾਂ ਦੇ ਨਾਲ (ਤਾਣੇ ਪੇਟੇ ਵਾਂਗ) ਮਿਲਿਆ ਹੋਇਆ ਹੈ (ਇਸ ਵਾਸਤੇ ਕੋਈ ਲੇਖ ਗ਼ਲਤ ਨਹੀਂ ਲਿਖਿਆ ਜਾਂਦਾ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਰਝਿ ਰਹਿਓ = ਮਿਲਿਆ ਹੋਇਆ ਹੈ (ਤਾਣੇ ਪੇਟੇ ਵਾਂਗ)। ਅਨੂਪ = ਸੋਹਣਾ। ਰੂਪਾਵਤੀ = ਰੂਪ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y el Señor, Bello y Glorioso, prevalece a través de todos."