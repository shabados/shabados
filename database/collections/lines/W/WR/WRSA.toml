[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਹਾ; ਪ੍ਰੇਮ ਪਿਰੀ ॥੧॥ ਰਹਾਉ ॥"
page = 406
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I seek the love of that beloved of mine. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਸ ਆਪਣੇ ਪ੍ਰੀਤਮ ਦੀ ਪ੍ਰੀਤ ਲੋੜਦਾ ਹਾਂ। ਠਹਿਰਾਉਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I seek the Love of my Beloved. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਓਹੁ ਜੋ ਪਰਮੇਸਰ ਕਾ ਪ੍ਰੇਮ ਹੈ ਤਿਸ ਕੇ ਤੁਲ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੈਨੂੰ ਤਾਂ) ਪਿਆਰੇ (ਪ੍ਰਭੂ) ਦਾ ਉਹ ਪ੍ਰੇਮ ਹੀ (ਚਾਹੀਦਾ ਹੈ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰੇਮ ਪਿਰੀ = ਪਿਆਰੇ ਦਾ ਪ੍ਰੇਮ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Yo busco el Amor de ese Amado mío. (1-Pausa)"