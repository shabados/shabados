[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੀਆ ਹੈ; ਸਫਲ ਜਨਮੁ ਹਮਾਰਾ ॥"
page = 801
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord has made my life fruitful."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ ਮੇਰਾ ਜੀਵਨ ਫਲਦਾਇਕ ਬਣਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord has made my life fruitful and rewarding."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਹਰੀ ਨੇ ਹੀ ਹਮਾਰਾ ਜਨਮ ਸਫਲ ਕਰ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਨੇ ਮੇਰੀ ਜ਼ਿੰਦਗੀ ਕਾਮਯਾਬ ਬਣਾ ਦਿੱਤੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਫਲ = ਕਾਮਯਾਬ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor nos ha emancipado con la forma humana;"