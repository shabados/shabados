[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਨ ਭਾਗ ਭਏ ਜਿਸੁ ਪ੍ਰਾਣੀ ॥"
page = 108
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mortal who is blessed with the perfect Good fortune,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਜੀਵ ਨੂੰ ਮੁਕੰਮਲ ਚੰਗੇ ਨਸੀਬਾਂ ਦੀ ਦਾਤ ਪਰਾਪਤ ਹੋਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That mortal who is blessed by perfect destiny meets the Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪ੍ਰਾਣੀ ਕੇ ਪੂਰਨ ਭਾਗ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਮਨੁੱਖ ਦੇ ਪੂਰੇ ਭਾਗ ਜਾਗ ਪੈਣ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਗ = ਕਿਸਮਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ese mortal que es bendecido por el destino perfecto encuentra al Señor,"