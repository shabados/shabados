[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੁਰਗਾ ਦੀ ਸਾਮ ਤਕਾਈ, ਦੇਵਾਂ ਡਰਦਿਆਂ ॥"
page = 123

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The gods, having been frightened went under the refuge of Durga."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਭੈ-ਭੀਤ ਹੋਏ ਦੇਵਤਿਆਂ ਨੂੰ ਦੁਰਗਾ ਦੀ ਸ਼ਰਨ (ਸਾਮ) ਵਿਚ ਜਾਣਾ ਪਿਆ।"