[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਉ ਬੈਠੁ; ਆਦਰੁ ਸੁਭ ਦੇਊ ॥"
page = 252
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All shall welcome thee saying \"Come, sit down\"."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਇਹ ਆਖ ਕੇ ਤੇਰੀ ਆਓ-ਭਗਤ ਕਰਨਗੇ, \"ਆਓ ਜੀ, ਬੈਠੋ।\""

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everyone shall welcome you, saying, \"Come, and sit down.\""

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਓ ਬੈਠੋ ਐਸੇ ਕਹਿ ਕਰ (ਸੁਭ) ਸ੍ਰੇਸਟ ਪੁਰਸੁ ਆਦਰ ਦੇਵੇਂਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਗੋਂ) ਚੰਗਾ ਆਦਰ ਮਿਲੇਗਾ (ਕਹਿਣਗੇ)-ਆਓ ਬੈਠੋ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਭ = ਚੰਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y todos te darán la bienvenida en tu sitio exaltado."