[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹ ਸਾਧ ਸੰਤਨ; ਹੋਵਹਿ ਇਕਤ੍ਰ ॥"
page = 676
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Where the saints and sages congregate,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਗਿਆਨੀ ਅਤੇ ਰਿਸ਼ੀ ਜੁੜ ਬੈਠਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wherever the Holy Saints gather,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਹਾਂ (ਸਾਧ) ਸ੍ਰੇਸਟ (ਸੰਤਨ) ਸੰਤ ਬਹੁਤੇ ਇਕਤ੍ਰ ਹੋਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਾਧ ਸੰਤ ਜਿੱਥੇ (ਭੀ) ਇਕੱਠੇ ਹੁੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਹ = ਜਿੱਥੇ। ਇਕਤ੍ਰ = ਇਕੱਠੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Donde sea que los Santos se congregan, ahí cantan sólo las Alabanzas del Señor,"