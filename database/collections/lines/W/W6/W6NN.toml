[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਤਿ ਦਿਵਸ ਜਾਗਤ ਉਠਤ; ਬਸਤ ਸੋਵਤੇ ਚਿਤ ॥੨॥"
page = 910

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And this digression tormented him day and night, whether sleeping or awake.(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਹ ਗੱਲ ਰਾਤ ਦਿਨ, ਸੌਂਦਿਆਂ ਜਾਗਦਿਆਂ ਉਸ ਦੇ ਚਿਤ ਵਿਚ ਬਣੀ ਰਹਿੰਦੀ ਸੀ ॥੨॥"