[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਤਾ ਆਪਿ ਅਭੁਲੁ ਹੈ; ਨ ਭੁਲੈ. ਕਿਸੈ ਦਾ ਭੁਲਾਇਆ ॥"
page = 145
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Creator Himself is infallible Duped by any one he errs not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿਰਜਣਹਾਰ ਖੁਦ ਅਚੂਕ ਹੈ। ਕਿਸੇ ਦੇ ਗੁਮਰਾਹ ਕੀਤੇ ਉਹ ਚੌਂਧੀ ਨਹੀਂ ਖਾਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator Himself is infallible. He cannot be fooled; no one can fool Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਕਰਤਾ) ਪਰਮੇਸ੍ਵਰ ਆਪ ਅਭੁਲ ਹੈ ਕਿਸੇ ਕਾ ਭੁਲਾਇਆ ਹੂਆ ਭੂਲਤਾ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਰਤਾਰ ਆਪ ਤਾਂ ਉਕਾਈ ਖਾਣ ਵਾਲਾ ਨਹੀਂ ਹੈ, ਤੇ ਕਿਸੇ ਦਾ ਖੁੰਝਾਇਆ (ਭੀ) ਖੁੰਝਦਾ ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Creador Mismo nunca está en error, y nadie Lo puede desviar."