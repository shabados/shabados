[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਸੇਵਾ ਤੇ. ਲਹੈ ਪਦਾਰਥੁ ॥"
page = 832
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's service, man procures the Name-wealth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਘਾਲ ਰਾਹੀਂ, ਬੰਦਾ ਨਾਮ ਦੀ ਦੌਲਤ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serving the Guru, the treasure is found."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਸੇਵਾ ਹੀ ਸੇ ਯਿਹ ਜੀਵ ਗ੍ਯਾਨ ਪਦਾਰਥ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਦੱਸੀ ਸੇਵਾ ਦੀ ਰਾਹੀਂ ਹੀ ਮਨੁੱਖ ਨਾਮ-ਸਰਮਾਇਆ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਹੈ = ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ। ਪਦਾਰਥੁ = ਨਾਮ-ਵਸਤੁ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es a través del Servicio del Guru que uno obtiene Lo Importante en el interior."