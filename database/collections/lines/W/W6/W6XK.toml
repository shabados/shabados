[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵੇਤਗਾ; ਆਪੇ ਵਤੈ ॥"
page = 471
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the thread the Brahman himself wanders about."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਾਗੇ ਦੇ ਬਗੈਰ ਬ੍ਰਹਿਮਣ ਖੁਦ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Brahmin himself goes to the world hereafter without a sacred thread."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੰਡਤ ਜੀ! ਤੁਮ ਹੀ ਆਪ ਬਿਨਾਂ ਤਗ ਕੇ (ਵਤੈ) ਫਿਰਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪ ਤਾਂ ਇਹੋ ਜਿਹੇ ਜਨੇਊ ਤੋਂ ਵਾਂਜਿਆ ਹੋਇਆ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਤੈ = ਭੌਂਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mismo Brahmán se va al más allá sin su hilo"