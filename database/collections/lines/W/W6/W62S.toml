[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੌ ਕਰਿ ਹੈ ਕੋਊ ਨਿੰਦ; ਕਛੂ ਜਬ ਭੇਦ ਲਹੈਂਗੇ ॥"
page = 834

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Also they would talk only if they learn about the secret."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਹੀ ਕੋਈ ਤੁਹਾਡੀ ਨਿੰਦਿਆ ਕਰੇਗਾ, ਜਦ (ਉਸ ਨੂੰ) ਭੇਦ ਪਤਾ ਲਗੇਗਾ।"