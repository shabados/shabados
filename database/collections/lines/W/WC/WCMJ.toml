[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਜੇ ਰਥੀ ਹਈ ਗਜੀ; ਸੁ ਪਤਿ ਤ੍ਰਾਸ ਧਾਰਿ ਕੈ ॥"
page = 706

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The charioteer, horses and the masters of elephants ran away in fear"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਥਾਂ ਵਾਲੇ, ਘੋੜਿਆਂ ਵਾਲੇ, ਹਾਥੀਆਂ ਵਾਲੇ ਅਤੇ ਪਿਆਦੇ (ਸਿਪਾਹੀ) ਡਰ ਦੇ ਮਾਰੇ ਭਜ ਗਏ ਹਨ।"