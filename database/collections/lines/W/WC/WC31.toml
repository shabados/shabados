data = "ਤੁਮ ਹੋ, ਸਭ ਰਾਜਨ ਕੇ ਰਾਜਾ ॥"
page = 337

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O Lord! Thou art eh king of all kings and Gracious towards the poor"

[[content]]
assets = ["RSJD"]
type = "translation"
