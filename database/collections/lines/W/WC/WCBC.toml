[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਗਨ ਤਿਹ ਪੈ ਹਰਿ ਬਿਧਿ ਆਯੋ ॥"
page = 452

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Hearing this, Krishna and Brahma put on the garb of a Brahmin and went to beg the amulet from him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਅਤੇ ਬ੍ਰਹਮਾ ਉਸ ਕੋਲੋਂ ('ਤੇਤਾ') ਮੰਗਣ ਲਈ ਆਏ।"