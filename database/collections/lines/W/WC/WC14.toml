[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੀਤ ਪੀਤੰਬਰ ਤ੍ਰਿਭਵਣ ਧਣੀ ॥"
page = 1082
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Yellow and Yellow-robed is the Lord of three worlds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੀਲਾ ਤੇ ਪੀਲੇ ਬਸਤਰਾਂ ਵਾਲਾ ਹੈ ਤਿੰਨਾਂ ਜਹਾਨਾਂ ਦਾ ਸੁਆਮੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord of yellow robes, the Master of the three worlds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਪੀਤ) ਪ੍ਰੀਤੀ ਪੀਤ ਬਸਤ੍ਰੋਂ ਮੇਂ ਹੈ ਔ ਤ੍ਰੈ ਭਵਨੋਂ ਕਾ ਧਨੀ ਹੈਂ ਅਰਥਾਤ ਮਾਲਕ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੀਲੇ ਬਸਤ੍ਰਾਂ ਵਾਲੇ! ਹੇ ਤਿੰਨਾਂ ਭਵਨਾਂ ਦੇ ਮਾਲਕ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੀਤ = ਪੀਲਾ। ਪੀਤੰਬਰ = {ਪੀਅੰਬਰ} ਪੀਲੇ ਬਸਤ੍ਰਾਂ ਵਾਲਾ (ਕ੍ਰਿਸ਼ਨ)। ਧਣੀ = ਮਾਲਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el Señor de la Túnica amarilla, el Maestro de los tres mundos,"