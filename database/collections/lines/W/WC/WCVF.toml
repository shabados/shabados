[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਪ੍ਰਸਾਦਿ; ਬਾਗ ਮਿਲਖ ਧਨਾ ॥"
page = 270
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose favour, thou hast gardens property and wealth,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਦਇਆ ਦੁਆਰਾ ਤੇਰੇ ਪੱਲੇ ਬਗੀਚੇ ਜਾਇਦਾਦ ਤੇ ਦੌਲਤ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By His Grace, you have land, gardens and wealth;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਤੁਝ ਕੌ ਬਾਗ ਆਦਿ ਮਿਲਖ ਔਰ ਧਨ ਪ੍ਰਾਪਤਿ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਦਇਆ ਨਾਲ ਬਾਗ ਜ਼ਮੀਨਾਂ ਤੇ ਧਨ (ਤੈਨੂੰ ਨਸੀਬ ਹਨ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਖ = ਜ਼ਮੀਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su Bondad te ha dado tierras, jardines y riqueza;"