assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਲਗੁ; ਮੇਰੀ ਮੇਰੀ ਕਰੈ ॥"
page = 1160
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As long as one says, \"mine, it is mine\"."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਤਾਈ ਬੰਦਾ ਆਖਦਾ ਹੈ, \"ਮੇਰੀ, ਇਹ ਮੇਰੀ ਹੈ\""

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As long as he cries out, Mine! Mine!,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਤਕ ਇਹ ਜੀਉ ਮੇਰੀ ਮਾਯਾ ਮੇਰੀ ਬਿਭੂਤੀ ਐਸੇ ਉਚਾਰਨ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦ ਤਕ ਮਨੁੱਖ ਮਮਤਾ ਦੇ ਗੇੜ ਵਿਚ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mientras uno siga diciendo mío, mío,"