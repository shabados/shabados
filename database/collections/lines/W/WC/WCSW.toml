[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤਾਂ ਭਰਵਾਸਾ ਤੇਰਾ ॥"
page = 629
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints have only Thine reliance."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਨੂੰ ਤੇਰਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the support of the Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨੋਂ ਕੋ ਆਪ ਕਾ ਹੀ ਭਰੋਸਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਸੰਤਾਂ ਨੂੰ (ਭੀ) ਤੇਰਾ ਹੀ ਸਹਾਰਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਰਵਾਸਾ = ਭਰੋਸਾ, ਸਹਾਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tus Santos se apoyan sólo en Ti."