[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਸਥਿਰੁ ਚੀਤੁ; ਮਰਨਿ ਮਨੁ ਮਾਨਿਆ ॥"
page = 932
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Stable comes his mind and his soul likes this death. By Guru's grace, man relishes the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਡੋਲ ਹੋ ਜਾਂਦਾ ਹੈ ਉਸ ਦਾ ਮਨ ਅਤੇ ਉਸ ਦੀ ਜਿੰਦੜੀ ਨੂੰ ਇਹ ਮੌਤ ਚੰਗੀ ਲਗਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His consciousness becomes permanently stable, and his mind accepts death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕਾ ਮਰਨੇ ਮੇਂ ਮਨਿ ਮੰਨਿਆ ਹੈ ਵਹੁ ਅਸਥਿਰ ਚਿਤ ਹੋਏ ਹੈਂ॥☬ਪ੍ਰਸ਼ਨ: ਮਰਨੇ ਮੇਂ ਕਿਨ ਕਾ ਮਨੁ ਮਾਨਿਆ ਹੈ?☬ਉਤ੍ਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਦਾ ਮਨ (ਕਾਮ ਕ੍ਰੋਧ ਆਦਿਕ ਵਲੋਂ) ਅਡੋਲ ਹੋ ਜਾਂਦਾ ਹੈ, ਤੇ ਆਪਾ-ਭਾਵ ਵਲੋਂ ਮਰਨ ਵਿਚ ਖ਼ੁਸ਼ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਸਥਿਰੁ = ਅਡੋਲ। ਮਰਨਿ = ਮਰਨ ਵਿਚ, ਆਪਾ-ਭਾਵ ਮੁਕਾਣ ਵਿਚ, ਹਉਮੈ (ਅਹੰ) ਦੂਰ ਕਰਨ ਵਿਚ। ਮਾਨਿਆ = ਪਤੀਜ ਜਾਂਦਾ ਹੈ, ਸ਼ੌਕ ਪਰਗਟ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su conciencia se convierte permanentemente estable, y su mente acepta la muerte."