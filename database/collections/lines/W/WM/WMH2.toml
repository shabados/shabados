[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਠ ਪਹਰ; ਪ੍ਰਭ ਪੇਖਹੁ ਨੇਰਾ ॥"
page = 293
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The whole day long behold thou the Lord just near thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਾ ਦਿਹਾੜਾ ਤੂੰ ਹੀ ਸਾਹਿਬ ਨੂੰ ਐਨ ਨੇੜੇ ਦੇਖ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Behold God near at hand, twenty-four hours a day."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਆਠੋਂ ਪਹਰ ਪ੍ਰਭੂ ਕੋ ਅਪਨੇ ਸਮੀਪ ਦੇਖੋਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅੱਠੇ ਪਹਰ ਪ੍ਰਭੂ ਨੂੰ ਆਪਣੇ ਅੰਗ-ਸੰਗ ਵੇਖਹੁ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La ignorancia desaparecerá y la oscuridad desvanecerá."