[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਉ ਕਰਿ ਖੋਇਆ; ਕਿਉ ਕਰਿ ਲਾਧਾ ॥"
page = 939
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Q. 19: How does one lose? Q. 20: How does one gain?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰ. 19: ਇਨਸਾਨ ਕਿਸ ਤਰ੍ਹਾਂ ਗੁਆ ਲੈਂਦਾ ਹੈ? ਪ੍ਰ. 20: ਉਹ ਕਿਸ ਤਰ੍ਹਾਂ ਲਾਭ ਉਠਾਉਂਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How does one lose, and how does one gain?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂ ਕਰ ਜਨਮ ਖੋਇਆ ਹੈ ੩, ਕਿਉਂ ਕਰ (ਲਾਧਾ) ਪਾਇਆ ਹੈ ਅਰਥਾਤ ਸਫਲ ਕੀਆ ਹੈ ੪?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਜੀਵ ਨੇ) ਕਿਵੇਂ (ਆਪਣੇ ਜੀਵਨ ਦਾ ਲਾਭ) ਗੰਵਾ ਲਿਆ ਹੈ? ਕਿਵੇਂ (ਮੁੜ ਉਹ ਲਾਹਾ) ਲੱਭ ਸਕੇ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਉ ਕਰਿ = ਕਿਵੇਂ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cómo es que uno pierde o gana?"