[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਗੁਣ ਅਵਗਨ; ਨ ਬੀਚਾਰਿਆ ॥"
page = 72
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord minded not my merits and demerits."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਨੇ ਮੇਰੀਆਂ ਨੇਕੀਆਂ ਤੇ ਬਦੀਆਂ ਵੱਲ ਨਹੀਂ ਤੱਕਿਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has not considered my merits and demerits;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਗੁਣ ਅਤੇ ਅਵਗੁਣੋ ਕਾ ਆਪਨੇ ਬੀਚਾਰ ਨਹੀਂ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ ਨਾਹ ਮੇਰੇ ਗੁਣਾਂ ਦਾ ਖ਼ਿਆਲ ਕੀਤਾ ਹੈ, ਨਾਹ ਮੇਰੇ ਔਗੁਣਾਂ ਦੀ ਪਰਵਾਹ ਕੀਤੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ। ਬਿਰਦੁ = ਮੁੱਢ ਕਦੀਮਾਂ ਦਾ ਸੁਭਾਉ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mira, al Señor no le importan mis méritos o mis deméritos."