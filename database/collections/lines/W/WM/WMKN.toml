[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਰਨਾਪੋ ਬਿਖਿਅਨ ਸਿਉ ਖੋਇਓ; ਬਾਲਪਨੁ ਅਗਿਆਨਾ ॥"
page = 902
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou hast wasted away the youth in sensual pleasures and thy childhood in ignorance,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੀ ਜੁਆਨੀ ਵਿਸ਼ੇ ਵਿਕਾਰਾਂ ਅੰਦਰ ਗਵਾ ਲਈ ਹੈ ਅਤੇ ਆਪਣਾ ਬਚਪਨ ਬੇਸਮਝੀ ਵਿੱਚ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You have wasted your youth in corrupt pleasures, and your childhood in ignorance."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਾਲਪਨ ਤੋ ਅਗ੍ਯਾਤ ਮੇਂ ਗਿਆ ਹੀ ਥਾ, ਪਰੰਤੂ ਜਵਾਨੀ ਕਾ ਵਕਤ ਭੀ ਬਿਸ੍ਯੋਂ ਮੇਂ ਖੋਇ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੀਵ ਭੀ ਅਜਬ ਮੰਦਭਾਗੀ ਹੈ ਕਿ ਇਸ ਨੇ) ਜਵਾਨੀ (ਦੀ ਉਮਰ) ਵਿਸ਼ੇ-ਵਿਕਾਰਾਂ ਵਿਚ ਗਵਾ ਲਈ, ਬਾਲ-ਉਮਰ ਅੰਞਾਣ-ਪੁਣੇ ਵਿਚ (ਗਵਾ ਲਈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਰਨਾਪੋ = {ਤਰੁਣ = ਜੁਆਨ} ਜਵਾਨੀ। ਬਿਖਿਅਨ ਸਿਉ = ਵਿਸ਼ਿਆਂ ਨਾਲ। ਖੋਇਓ = ਤੂੰ ਗਵਾ ਲਿਆ। ਬਾਲਪਨੁ = ਬਾਲ-ਉਮਰ। ਅਗਿਆਨਾ = ਅੰਞਾਣਪੁਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno desperdicia su juventud en el vicio, en la ansiedad de la adolescencia y en la ignorancia;"