[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੀ ਸੇਵਾ; ਸਰਬ ਸੁਖ ਪਾਵਹਿ ॥"
page = 395
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Serve Him in whose service thou shalt attain all the comforts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਟਹਿਲ ਕਮਾ, ਜਿਸ ਦੀ ਟਹਿਲ ਅੰਦਰ ਤੂੰ ਸਾਰੇ ਆਰਾਮ ਪਰਾਪਤ ਕਰ ਲਵੇਗਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serving Him, all peace is obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਸੇਵਾ ਤੇ ਤੂੰ ਸਰਬ ਸੁਖੋਂ ਕੋ ਪ੍ਰਾਪਤਿ ਹੋਹਿਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਸੇਵਾ-ਭਗਤੀ ਕਰ ਕੇ ਤੂੰ ਸਾਰੇ ਸੁਖ ਹਾਸਲ ਕਰ ਲਏਂਗਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਵਹਿ = ਤੂੰ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, en Su Servicio uno recibe toda la Paz"