[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਿਉ ਹਮ ਕੋ ਤੁਮ ਪੀਠ ਦਈ; ਤੁਮ ਕੋ ਤੁਮਰੀ ਮਨ ਭਾਵਤ ਦੀਜੈ ॥੯੭੭॥"
page = 394

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O Krishna! the manner in which you have forgotten us, may your favourite queen also forget you like this.977."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਉਂ ਤੁਸੀਂ ਸਾਨੂੰ ਪਿਠ ਦਿੱਤੀ ਹੈ, (ਉਸੇ ਤਰ੍ਹਾਂ) ਤੁਹਾਡੀ ਪ੍ਰਿਯਾ ('ਮਨ-ਭਾਵਤ') (ਅਰਥਾਤ ਕੁਬਜਾ) ਵੀ (ਪਿਠ) ਵਿਖਾ ਦੇਵੇ ॥੯੭੭॥"