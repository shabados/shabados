[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕੁ ਹਰਿ ਨਿਰਮਲੁ; ਜਾ ਕਾ. ਅੰਤੁ ਨ ਪਾਰੁ ॥੧॥ ਰਹਾਉ ॥"
page = 1158
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Immaculate is the One Lord, who has no end and limit. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਵਨ ਪਵਿੱਤ੍ਰ ਹੈ ਇਕ ਪ੍ਰਭੂ ਜਿਸ ਦਾ ਕੋਈ ਅਖੀਰ ਅਤੇ ਓੜਕ ਨਹੀਂ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Only the One Lord is Immaculate; He has no end or limitation. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕੁ ਹਰੀ ਨਿਰਮਲ ਹੈ ਜਿਸ ਕੇ ਅੰਤ ਕਾ ਪਾਰਾਵਾਰ ਨਹੀਂ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਪਰਮਾਤਮਾ ਹੀ ਪਵਿੱਤਰ ਹੈ, (ਇਤਨਾ ਪਵਿੱਤਰ ਹੈ ਕਿ ਉਸ ਦੀ ਪਵਿੱਤ੍ਰਤਾ ਦਾ) ਅੰਤ ਨਹੀਂ ਪਾਇਆ ਜਾ ਸਕਦਾ, ਪਾਰਲਾ ਬੰਨਾ ਨਹੀਂ ਲੱਭ ਸਕਦਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "lo Único Inmaculado es el Nombre Infinito de Dios. (1-Pausa)"