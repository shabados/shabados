[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਬਲਿਹਾਰੀ; ਸਾਚੇ ਨਾਵੈ ॥"
page = 566
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am a sacrifice unto the True Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੇ ਸੱਚੇ ਨਾਮ ਉੱਤੋਂ ਕੁਰਬਾਨ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to the True Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੇ ਸਚੇ ਨਾਮ ਉਪਰ ਸੇ ਬਲਿਹਾਰ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਮੈਂ ਤੇਰੇ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਨਾਮ ਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਮੈਂ। ਨਾਵੈ = ਨਾਮ ਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi ser en sacrificio al Verdadero Nombre, oh Señor"