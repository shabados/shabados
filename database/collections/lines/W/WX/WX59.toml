[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਮਨ; ਜਪਿ ਹਰਿ ਹਰਿ ਨਾਮੁ ਸਖੇ ॥"
page = 975
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, utter thou the Name of the Lord God, thy Friend."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਤੂੰ ਆਪਣੇ ਮਿਤ੍ਰ ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, chant the Name of the Lord, Har, Har, your only Friend."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ (ਸਖੇ) ਮਿਤ੍ਰ! ਜੋ ਸੰਤ ਹੈਂ ਤਿਨ ਦੁਆਰਾ ਹਰੀ ਕੇ ਹਰਿ ਨਾਮ ਕੋ ਤੂੰ ਜਪੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਸਦਾ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪਿਆ ਕਰ। (ਹਰਿ-ਨਾਮਿ ਹੀ ਅਸਲ) ਮਿੱਤਰ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਸਖੇ = ਸਖਾ, ਮਿੱਤਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, recita el Nombre del Señor, Jar, Jar, en tu Dios, tu Único Amigo."