data = "ਅਧਿਕ ਹ੍ਰਿਦੈ ਭੀਤਰ ਡਰੀ; ਲੋਕ ਲਾਜ ਜਿਯ ਜਾਨਿ ॥੩॥"
page = 825

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "People’s abashment, she was worried.(3)"

[[content]]
