data = "ਮਨ ਵਿਚ ਲੋਕ ਲਾਜ ਨੂੰ ਜਾਣ ਕੇ ਹਿਰਦੇ ਵਿਚ ਬਹੁਤ ਡਰੀ ॥੩॥"