[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ ਤੁਮ ਹੀ ਪ੍ਰਤਿਪਾਲਾ ॥"
page = 744
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Extending Thine grace, Thou cherisheth me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਮਿਹਰ ਧਾਰ ਕੇ ਤੂੰ ਮੇਰੀ ਪਰਵਰਸ਼ ਕਰਦਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please, grant Your Grace, and cherish me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਰਪਾ ਕਰ ਕੇ ਤੁਮ ਹੀ ਸਭ ਕੀ ਪ੍ਰਤਿਪਾਲਾ ਕਰਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਬਿੰਦ! ਤੂੰ ਹੀ ਕਿਰਪਾ ਕਰ ਕੇ (ਅਸਾਂ ਜੀਵਾਂ ਦੀ) ਪਾਲਣਾ ਕਰਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por favor, guárdame en Tu Misericordia, oh mi Señor,"