[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਭ੍ਰਮ ਭਉ ਕਾਟੀਐ; ਚੂਕੈ ਜਮ ਕੀ ਜੋਹ ॥੧॥"
page = 256
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, my doubt and dread are dispelled and the Death's myrmidon eyed me no more."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਮੇਰਾ ਸੰਦੇਹ ਤੇ ਡਰ ਦੂਰ ਹੋ ਗਏ ਹਨ ਅਤੇ ਮੌਤ ਦਾ ਫਰੇਸ਼ਤਾ ਹੁਣ ਮੈਨੂੰ ਨਹੀਂ ਤਕਾਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, my doubts and fears have been dispelled, and the Messenger of Death does not see me any longer. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਨਮਾਦੀ ਭਰਮੁ ਅਰੁ ਭੈ ਅਰ ਜਮ ਕੀ (ਜੋਹ) ਤਕ ਦੇਖਨਾ (ਚੂਕੈ) ਉਠ, ਭਾਵ ਨਿਬ੍ਰਿਤ ਹੋ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਆਖ-) ਮਨ ਦੀ ਭਟਕਣਾ ਤੇ ਸਹਮ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ, ਜਮ ਦੀ ਘੂਰੀ ਭੀ ਮੁੱਕ ਜਾਂਦੀ ਹੈ, (ਮੌਤ ਦਾ ਸਹਮ ਭੀ ਖ਼ਤਮ ਹੋ ਜਾਂਦਾ ਹੈ) ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋਹ = ਤੱਕ, ਘੂਰੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El miedo y la duda desaparecerán y la mirada de Yama, el mensajero de la muerte, no se posará sobre él.(1)"