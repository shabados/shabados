[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਇਹ ਮਨੁੱਖਾਣ ਅਤੇ ਰੂਹਾਣ ਦੇ ਪੈਦਾ ਕਰਨ ਵਾਲੇ ਉਸ ਰੱਬ ਦੀ ਯਾਦ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਯਾਦਿ ਆਣ ਜਾਣ ਆਫਰੀਨਿ ਇਨਸੋ ਜਾਣ ॥੪੫॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Take it that he achieved the treasure of eternal life. (397)"