[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਕਹਿਆ; ਏਹ ਰਸਹਿ ਬਿਖਾਗਨਿ ॥"
page = 1347
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru has told me, that these relishes are like the fire of sins."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਦਸ ਦਿੱਤਾ ਹੈ, ਕਿ ਇਹ ਸੁਆਦ ਤਾਂ ਵਿਸ਼ਿਆਂ ਦੀ ਅੱਗ ਸਮਾਨ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru has told me that these pleasures are the fires of corruption."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਗੁਰੋਂ ਨੇ ਕਹਿਆ ਹੈ ਇਹ ਵਿਸੇ ਰਸ ਅਗਨੀ ਵਤ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਰਸਾਂ ਦੀ ਖ਼ੁਰਾਕ ਅਪੜਾਣੀ ਬੰਦ ਕਰ ਦਿੱਤੀ ਹੈ, ਕਿਉਂਕਿ) ਗੁਰੂ ਨੇ (ਮੈਨੂੰ) ਦੱਸਿਆ ਹੈ ਕਿ ਇਹ ਰਸਾਂ ਦੀ ਆਤਮਕ ਮੌਤ ਲਿਆਉਣ ਵਾਲੀ ਅੱਗ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ। ਰਸਹਿ = ਰਸਾਂ ਦੀ। ਬਿਖਾਗਨਿ = ਬਿਖ-ਅਗਨਿ, ਆਤਮਕ ਮੌਤ ਲਿਆਉਣ ਵਾਲੀ ਜ਼ਹਿਰ-ਅੱਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues el Guru me ha indicado que son la fuente del fuego de a corrupción"