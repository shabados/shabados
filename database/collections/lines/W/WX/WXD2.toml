[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਜਹੁ ਆਜੁ ਤੁਮ ਹਮੈ ਪਿਯਾਰੇ ॥"
page = 844

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The lady said to the twice born (Brahmm), today you love me."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਿਆਰੇ! ਤੂੰ ਅਜ ਮੇਰੇ ਨਾਲ ਭੋਗ ਕਰ।"