[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਦੁਆਰੈ. ਨਾਉ ਪਾਈਐ; ਬਿਨੁ ਸਤਿਗੁਰ ਪਲੈ. ਨ ਪਾਇ ॥"
page = 1015
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It is through the Guru, that one is blessed with the Name, Without the True Guru the Name is obtained not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਹੀ ਨਾਮ ਦੀ ਦਾਤ ਮਿਲਦੀ ਹੈ। ਸੱਚੇ ਗੁਰਾਂ ਦੇ ਬਗ਼ੈਰ ਨਾਮ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Guru's Gate, the Gurdwara, the Name is obtained. Without the True Guru, it is not received."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਦੁਆਰੇ ਹੀ ਨਾਮ ਪਾਈਤਾ ਹੈ, ਸਤਿਗੁਰੋਂ ਸੇ ਬਿਨਾਂ ਨਾਮ ਪਲੇ ਨਹੀਂ ਪੜਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਗੁਰੂ ਦੇ ਦਰ ਤੋਂ ਮਿਲਦਾ ਹੈ, ਗੁਰੂ ਦੀ ਸਰਨ ਤੋਂ ਬਿਨਾ ਪ੍ਰਭੂ-ਨਾਮ ਦੀ ਪ੍ਰਾਪਤੀ ਨਹੀਂ ਹੋ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਆਰੈ = ਦਰ ਤੇ। ਪਲੈ ਨ ਪਾਇ = ਨਹੀਂ ਮਿਲ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Somos bendecidos, a través del Guru, con el Nombre del Señor."