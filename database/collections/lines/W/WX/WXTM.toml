[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰਿਥਮ ਉਪਾਵਹੁ ਜਗਤ ਤੁਮ; ਤੁਮ ਹੀ ਪੰਥ ਬਨਾਇ ॥"
page = 717

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Firstly Thou createst the world, and then the Paths"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਹਿਲਾਂ ਤੁਸੀਂ ਜਗਤ ਨੂੰ ਪੈਦਾ ਕਰਦੇ ਹੋ, (ਫਿਰ) ਤੁਸੀਂ ਹੀ (ਵਖਰੇ ਵਖਰੇ) ਪੰਥ (ਧਰਮ-ਮਾਰਗ-ਸੰਪ੍ਰਦਾਇ) ਬਣਾਉਂਦੇ ਹੋ।"