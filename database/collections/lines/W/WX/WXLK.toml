[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਤੁ ਰੰਗਿ; ਸਾਚੇ ਮਾਹਿ ਸਮਾਏ ॥"
page = 1066
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Dyed this wise, man merges in the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਰੰਗੀਜ, ਬੰਦਾ ਸੱਚੇ ਸਾਈਂ ਵਿੱਚ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Dyed in this color, one merges in the True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਉ ਇਸ ਰੰਗ ਕਰ ਕੇ ਸਾਚੇ ਪਰਮਾਤਮਾ ਮੇਂ (ਸਮਾਏ) ਅਭੇਦ ਹੋ ਜਾਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਇਸ ਰੰਗ ਵਿਚ (ਰੰਗੀਜ ਕੇ) ਸਦਾ-ਥਿਰ ਪਰਮਾਤਮਾ ਵਿਚ ਲੀਨ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਤੁ = ਇਸ ਵਿਚ। ਇਤੁ ਰੰਗਿ = ਇਸ ਰੰਗ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues imbuido de esta forma se inmerge en el Uno Verdadero."