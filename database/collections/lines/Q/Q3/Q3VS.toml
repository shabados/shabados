[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਬਿਨਾਣ ਗੁਰੂ ਦੇ ਰੱਬ ਤਕ ਕੋਈ ਵੀ ਨਹੀਣ ਪਹੁੰਚ ਸਕਦਾ । "

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਗ਼ੈਰਿ ਮੁਰਸ਼ਦ ਕਸ ਨ ਯਾਬਦ ਰਹਿ ਬਦੂ ॥੧੧੨॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Kindly bless me with such a courage and fortitude that I should be prepared to sacrifice my life to venture to go on the road to God. (464)"