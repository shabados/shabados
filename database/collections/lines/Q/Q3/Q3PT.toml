[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਸਕਲ ਤੁਪਕ ਕੇ ਨਾਮ; ਲੀਜੀਐ ਜਾਨਿ ਕੈ ॥੧੨੭੬॥"
page = 805

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Uttering the word “Jaraa” form the mouth, add the word “Ripu” and then the word “Nrip” four times, then adding the word “Dhatru” at the end know the names of Tupak.1276."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝ ਲਵੋ ॥੧੨੭੬॥"