[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੂੜ ਇਕ, ਗੰਢੀ ਸਉ ਫੇਰੇ ॥੭॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The superstitions bind themselves with a hundred knots of falsehood."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(੯) ਇਕ ਝੂਠ ਨੂੰ (ਸਿਰੇ ਚਾੜ੍ਹਨ ਲਈ) ਸੌ ਗੰਢ ਦਾ ਫੇਰ ਦੇਈਦਾ ਹੈ (ਭਾਵ ਝੂਠ ਕਾਇਮ ਨਹੀਂ ਰਹਿੰਦਾ ਨਿਤਰ ਪੈਂਦਾ ਹੈ)।"