[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਭਗਤਨ ਕੋ; ਨਾਮੁ ਅਧਾਰੁ ॥"
page = 889
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Name is the mainstay of God's devoted slaves."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਹੀ ਵਾਹਿਗੁਰੂ ਦੇ ਅਨਿੰਨ ਗੋਲਿਆਂ ਦਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Naam, the Name of the Lord, is the anchor and support of the Lord's devotees."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਭਗਤੋਂ ਕੋ ਨਾਮ ਕਾ ਹੀ ਆਸਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਿੱਤਰ! ਪਰਮਾਤਮਾ ਦੇ ਭਗਤਾਂ ਵਾਸਤੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹੀ ਜੀਵਨ ਦਾ ਆਸਰਾ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਧਾਰੁ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Devoto del Señor se apoya sólo en el Nombre del Señor;"