[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਬ ਸਾਧੂ ਸੰਗਿ ਪਰੀਆ ॥"
page = 746
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Now when he joins in the society of saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਜਦ ਉਹ ਸਤਿ ਸੰਗਤ ਅੰਦਰ ਜੁੜ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But now, he joins the Saadh Sangat, the Company of the Holy,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਇਹੀ ਜੀਵ ਜਬ ਸਾਧ ਸੰਗਤ ਮੇਂ ਪੜ ਜਾਤਾ ਹੈ ਤਬ ਅਬਨਾਸੀ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਮਨੁੱਖਾ ਜਨਮ ਵਿਚ ਜਦੋਂ ਜੀਵ ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਅੱਪੜਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗਿ = ਸੰਗਤਿ ਵਿਚ। ਪਰੀਆ = ਆ ਪਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero cuando se une a la Saad Sangat, la Sociedad de los Santos"