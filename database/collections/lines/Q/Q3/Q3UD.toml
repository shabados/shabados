[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਹਰ ਮਨੁਖ ਇਸ ਜਹਾਨ ਵਿਚ ਵਧਣਾ ਫੁਲਣਾ ਚਾਹੂੰਦਾ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਹਰ ਕਸ ਬ-ਜਹਾ ਨਸ਼ਵੋ ਨੁਮਾ ਮੀ ਖ਼ਾਹਦ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Like that drop of water that fell into a river or ocean, giving up its own identity (showing humility),"