[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੰਧਨ ਕਾਟਿ; ਕੀਏ ਅਪਨੇ ਦਾਸ ॥"
page = 178
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He has cut off my fetters and made me His serf."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਮੇਰੀਆਂ ਬੇੜੀਆਂ ਕਟ ਕੇ ਮੈਨੂੰ ਆਪਣਾ ਗੁਲਾਮ ਬਣਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has cut away my bonds, and made me His slave."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬੰਧਨ ਕਾਟ ਕਰ ਅਪਨੇ ਦਾਸ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸੇਵਕਾਂ ਦੇ ਮਾਇਆ ਦੇ ਮੋਹ ਦੇ) ਬੰਧਨ ਕੱਟ ਕੇ ਪ੍ਰਭੂ ਉਹਨਾਂ ਨੂੰ ਆਪਣੇ ਦਾਸ ਬਣਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਟਿ = ਕੱਟ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él cortó mis amarras y me hizo Suyo."