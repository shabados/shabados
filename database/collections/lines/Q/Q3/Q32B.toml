[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਾਪ ਸਮੁੰਦ ਜੈ ਹੈ ਨ ਤਰਿ ॥੭੭॥"
page = 559

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They will move in the world unashamedly, they will earn through sinful acts and suffer catastrophies and will remain powerless and will not be able to ferry across the sea of sin.7"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪਾਪਾਂ ਦੇ ਸਮੁੰਦਰ ਨੂੰ ਤਰ ਕੇ (ਪਾਰ ਪਹੁੰਚ) ਨਹੀਂ ਸਕਣਗੇ ॥੭੭॥"