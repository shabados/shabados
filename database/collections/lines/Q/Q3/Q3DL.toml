[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੁੰਦ ਸੁ ਜੁਧ ਭਇਓ ਰਨ ਮੈ; ਉਤ ਸੁੰਭ ਇਤੈ ਬਰ ਚੰਡਿ ਸੰਭਾਰੀ ॥"
page = 99

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Ultimately there was battle only between the two, Sumbh from that side and Chandi from this side, sustained their power.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਣ-ਭੂਮੀ ਵਿਚ ਦੁਅੰਦ-ਯੁੱਧ ਹੋ ਰਿਹਾ ਹੈ। ਇਧਰ ਪ੍ਰਚੰਡ ਚੰਡੀ ਅਤੇ ਉਧਰ ਸ਼ੁੰਭ ਡਟੇ ਹੋਏ ਹਨ।"