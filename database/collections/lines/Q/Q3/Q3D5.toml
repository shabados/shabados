[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੰਚਨ ਸੇ ਜਿਨ ਕੋ ਤਨ ਹੈ; ਮੁਖ ਹੈ ਸਸਿ ਸੋ ਤਹ ਰਾਧਿ ਗਚੀ ਹੈ ॥"
page = 356

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Their body is like gold and face like moon"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੇ ਸ਼ਰੀਰ ਸੋਨੇ ਵਰਗੇ (ਚਮਕਦਾਰ) ਹਨ ਅਤੇ ਮੂੰਹ ਚੰਦ੍ਰਮਾ ਦੇ ਸਮਾਨ ਹਨ। (ਇੰਜ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ)"