[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਰਿਦੈ; ਬਸੈ ਹਰਿ ਸੋਇ ॥"
page = 288
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "in whose heart that God abides."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਦਿਲ ਵਿੱਚ ਉਹ ਵਾਹਿਗੁਰੂ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "whose heart is filled with the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਰਿਦੇ ਮੇਂ ਸੋ ਹਰੀ ਨਿਵਾਸ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਹਿਰਦੇ ਵਿਚ ਉਹ ਪ੍ਰਭੂ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que sienta en sí mismo la Presencia de Dios."