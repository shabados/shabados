[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੇਵ ਸਬੈ ਤ੍ਰਾਸਤਿ ਭਏ; ਮਨ ਮੋ ਕੀਯੋ ਬਿਚਾਰ ॥"
page = 104

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the gods were filled with fear and thought in their mind"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਦੇਵਤਿਆਂ ਨੇ ਭੈ-ਭੀਤ ਹੋ ਕੇ ਮਨ ਵਿਚ ਵਿਚਾਰ ਕੀਤਾ।"