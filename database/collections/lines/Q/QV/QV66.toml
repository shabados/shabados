[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਸ ਅਮਿਟ ਬੀਰ ਧੀਰਾ ਬਡੋ; ਅਤਿ ਬਲਿਸਟ ਦੁਰ ਧਰਖ ਰਣਿ ॥"
page = 699

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "His sword is indestructible and he proves to be very strong in severe wars"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਦਾ ਨਾ ਮਿਟਣ ਵਾਲਾ, ਵੱਡੇ ਧੀਰਜ ਵਾਲਾ, ਅਤਿ ਬਲਵਾਨ, ਅਤੇ ਰਣ ਵਿਚ ਨਾ ਜਿਤੇ ਜਾ ਸਕਣ ਵਾਲਾ ਸੂਰਮਾ ਹੈ।"