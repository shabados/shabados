[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਜ਼ਿੰਦਗੀ ਨੇ ਉਮਰ ਦੀ ਪਰਾਪਤੀ ਸਮਝ ਲਈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਜ਼ਿੰਦਗੀਇ ਉਮਰ ਰਾ ਹਾਸਿਲ ਸ਼ਨਾਖ਼ਤ ॥੪੪੯॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Then the life attained the purpose of its existence. (449)"