data = "ਗ੍ਰਿਹ ਕੇ ਲੋਕ ਸਕਲ ਭੇ ਰਾਜੀ ॥੪੦॥"
page = 931

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The victory drum were continuously beaten at her door steps and the people felt exhilarations.(40)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਘਰ ਦੇ ਸਾਰੇ ਲੋਕ ਪ੍ਰਸੰਨ ਹੋ ਗਏ ॥੪੦॥"