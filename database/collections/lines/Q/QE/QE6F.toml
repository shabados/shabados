[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨ ਭੂਮਿ ਕਾ; ਜੋ ਕਰੈ ਗੁਮਾਨੁ ॥"
page = 278
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who takes pride of his wealth and land,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਪਣੀ ਦੌਲਤ ਅਤੇ ਜਮੀਨ ਦਾ ਹੰਕਾਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who takes pride in wealth and lands"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜੋ ਕੋਈ ਧਨ ਅਰ ਪ੍ਰਿਥਵੀ ਕਾ ਹੰਕਾਰ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਧਨ ਤੇ ਧਰਤੀ (ਦੀ ਮਾਲਕੀ) ਦਾ ਅਹੰਕਾਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੂਮਿ = ਧਰਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que se enorgullece de sus bienes"