[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਹੇ ਕੇ ਕਾਜ ਉਰਾਹਨ ਰੀ ਸਹਿ, ਹੋ ਅਪਨੋ ਪਤਿ ਦੇਖਿ ਅਘੈ ਹੋ ॥"
page = 367

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "For what I should endure the sarcasm? I shall remain pleased with my husband"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨੀ! ਮੈਂ ਕਿਸ ਲਈ ਉਲਾਂਭੇ ਸਹਾਰਾਂ, (ਮੈਂ) ਆਪਣੇ ਪਤੀ ਨੂੰ ਹੀ ਵੇਖ ਕੇ ਸੰਤੁਸ਼ਟ ਰਹਾਂਗੀ।"