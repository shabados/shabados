[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੰਧਨਿ ਬਾਧਿਆ; ਆਵੈ ਜਾਇ ॥੩॥"
page = 903
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art bound by bond and shalt continue coming and going."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਜੰਜੀਰਾਂ ਨਾਲ ਜਕੜਿਆ ਹੋਇਆ ਹੈਂ ਅਤੇ ਜੰਮਦਾ ਤੇ ਮਰਦਾ ਰਹੇਗਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Bound in bondage, you come and go. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਬੰਧਨੋਂ ਮੇਂ ਬਾਧਿਆ ਹੂਆ ਆਵਤਾ ਜਾਤਾ ਅਰਥਾਤ ਜਨਮਤਾ ਮਰਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਜੇਹਾ ਮਨੁੱਖ ਮਾਇਆ ਦੀ ਜੇਵੜੀ ਵਿਚ ਬੱਝਾ ਹੋਇਆ ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਵਿਚ ਪਿਆ ਰਹਿੰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੰਧਨਿ = ਬੰਧਨ ਵਿਚ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y amarrado, continúa reencarnando.(3)"