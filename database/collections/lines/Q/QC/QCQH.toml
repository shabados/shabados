type = "primary"
data = "ਏਕ ਪੀਰ ਮੁਲਤਾਨ ਮੈ; ਸੁਤ ਬਿਨੁ ਤਾ ਕੀ ਤ੍ਰੀਯ ॥"
page = 861

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "A Muslim Peer priest used to live in the city of Multan;"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੁਲਤਾਨ ਵਿਚ ਇਕ ਪੀਰ ਸੀ ਜਿਸ ਦੀ ਪੁੱਤਰ ਤੋਂ ਸਖਣੀ ਇਸਤਰੀ ਸੀ।"