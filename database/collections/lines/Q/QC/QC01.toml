[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਧ ਜਨਾ, ਗੁਰ ਚਰਨ ਧਿਆਇਆ ॥੧॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The sadhus adore the Lord in the form of the Guru's feet."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਇਹ (ਲੱਖਤਾ ਕਿਸ ਨੂੰ ਹੁੰਦੀ ਹੈ? ਜਿਨ੍ਹਾਂ ਨੇ) ਸੰਤਾਂ ਦੀ ਸੰਗਤ ਕਰ ਕੇ ਗੁਰੂ ਜੀ ਦੇ ਚਰਨਾਂ ਨੂੰ ਧਿਆਇਆ ਹੈ।"