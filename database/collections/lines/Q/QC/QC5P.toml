[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਹ ਗੁਨਾਹਾਂ ਨੂੰ ਬਖਸ਼ਨ ਵਾਲਾ ਹੈ ਅਤੇ ਜਗਤ ਦਾ ਪੱਖ ਪੂਰਨ ਵਾਲਾ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਕਫ਼ੀਲੁਲ ਜਰਾਇਮ ਵਕੀਲੁਲ ਵਰਾ ॥੬੩॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "He is condoner of the sins and is the supporter of and advocates the cause of the world. (63)"