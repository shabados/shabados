type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਦੀ) ਅਵਾਜ਼ ਅੱਗੇ ਬੱਦਲ ਵੀ ਲਜਾਉਂਦੇ ਸਨ।"