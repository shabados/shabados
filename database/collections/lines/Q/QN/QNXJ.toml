data = "ਤ੍ਰਿਯ ਕਹ ਕਛੂ ਨ ਮੁਖ ਤੇ ਕਹੈ ॥੧॥"
page = 866

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Her husband was a simpleton and he never constrained his wife.(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਆਪਣੀ) ਇਸਤਰੀ ਨੂੰ ਮੂੰਹੋਂ ਕੁਝ ਵੀ ਨਹੀਂ ਕਹਿੰਦਾ ਸੀ ॥੧॥"