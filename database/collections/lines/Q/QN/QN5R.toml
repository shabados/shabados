[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਰਿ ਸਿਰਿ ਕਰਣੈਹਾਰੈ ਸਾਜੇ ॥"
page = 1039
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "are fixed by the Creator-Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲਾਏ ਹਨ ਸਿਰਜਣਹਾਰ-ਸੁਆਮੀ ਨੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the Creator Lord fashioned them for each and every person."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸਿਰਿ ਸਿਰਿ) ਭਿੰਨ ਭਿੰਨ ਕਰਨੇਹਾਰ ਵਾਹਿਗੁਰੂ ਨੇ ਬਣਾਏ ਹੈਂ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਿਰਜਣਹਾਰ ਪ੍ਰਭੂ ਨੇ ਲਾ ਦਿੱਤੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਰਿ ਸਿਰਿ = ਹਰੇਕ ਦੇ ਸਿਰ ਉਤੇ, ਹਰੇਕ ਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mientras que Tú habitas en el Cuarto Estado de Éxtasis."