data = "ਸੰਤ ਕਾ ਦੋਖੀ; ਇਉ ਬਿਲਲਾਇ ॥"
page = 280
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints' slanderer bewails, in such a way,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਨੂੰ ਇਲਜਾਮ ਲਾਉਣ ਵਾਲਾ ਐਉ ਵਿਰਲਾਪ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slanderer of the Saint bewails like this"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਕਾ ਦੋਖੀ ਐਸੇ ਬਿਰਲਾਪ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਦਾ ਨਿੰਦਕ ਇਉਂ ਵਿਲਕਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਲਲਾਇ = ਵਿਲਕਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El que calumnia un Santo, aúlla de dolor;"