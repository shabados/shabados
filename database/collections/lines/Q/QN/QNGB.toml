[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਬਹਿ. ਨ ਘਾਲੈ; ਸੀਧਾ ਪਾਉ ॥"
page = 1151
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and places not his foot on the right path ever."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਦੇ ਭੀ ਠੀਕ ਰਾਹ ਤੇ ਆਪਣਾ ਪੈਰ ਨਹੀਂ ਧਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but he never places his feet on the right path."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਕਬੀ ਸੀਧਾ ਪੈਰੁ ਨਹੀਂ ਪਾਵਤਾ ਹੈ ਅਰਥਾਤ ਸੁਭ ਕਰਮ ਨਹੀਂ ਕਰਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ (ਪਵਿੱਤਰ ਜੀਵਨ ਵਾਲੇ ਰਸਤੇ ਉਤੇ) ਕਦੇ ਭੀ ਸਿੱਧਾ ਪੈਰ ਨਹੀਂ ਧਰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਾਲੈ = ਘੱਲਦਾ, ਧਰਦਾ। ਸੀਧਾ ਪਾਉ = ਸਿੱਧਾ ਪੈਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "tomando cada paso rumbo a la falsedad y a la maldad,"