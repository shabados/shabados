[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਸਰ ਭੂਪ ਚਲਾਵਤ ਹੈ; ਤਿਨ ਕੋ ਬ੍ਰਿਜਨਾਇਕ ਕਾਟਿ ਉਤਾਰੇ ॥"
page = 480

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the arrows discharged by the king had been intercepted by Krishna"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਜਾ ਜੋ ਬਾਣ ਚਲਾਉਂਦਾ ਹੈ, ਉਨ੍ਹਾਂ ਨੂੰ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਕਟ ਕੇ ਹੇਠਾਂ ਸੁਟ ਦਿੰਦੇ ਹਨ।"