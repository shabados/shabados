[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰੇਮ ਭਗਤਿ ਕੈ ਕਾਰਣੈ; ਕਹੁ ਰਵਿਦਾਸ ਚਮਾਰ ॥੩॥੧॥"
page = 346
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ravi Dass, the tanner, prays for Thine love and devotional service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਵਿਦਾਸ ਚਮਾਰ ਤੇਰੀ ਪ੍ਰੀਤ ਤੇ ਅਨੁਰਾਗੀ ਸੇਵਾ ਦੇ ਲਈ ਪ੍ਰਾਰਥਨਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am dedicated to Your loving devotional worship, says Ravi Daas the tanner. ||3||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਵਿਦਾਸ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੈਂ ਤੋ ਨਯੂਨ ਜਾਤੀ ਵਾਲਾ ਚਮਾਰ ਹੂੰ, ਪ੍ਰੇਮਾ ਭਗਤੀ ਕੇ ਵਾਸਤੇ ਇਕ ਛਿਨ ਮਾਤਰ ਦਰਸਨ ਦਿਖਾਵੋ ॥੩॥੧॥☬ਆਵਾਗਵਨ ਕੀ ਨਵਿਰਤੀ ਕੇ ਵਾਸਤੇ ਭਗਤੀ ਗ੍ਯਾਨ ਸੇ ਬਿਨਾਂ ਔਰ ਸਰਬ ਕਰਮੋਂ ਕੀ ਨਖੇਧੀ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਹੇ ਰਵਿਦਾਸ ਚਮਾਰ! ਤੂੰ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਕਰ, ਤਾਕਿ ਤੈਨੂੰ ਪ੍ਰੇਮ ਤੇ ਭਗਤੀ ਦੀ ਦਾਤਿ ਮਿਲ ਸਕੇ ॥੩॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ ਕਾਰਣੈ = ਦੀ ਖ਼ਾਤਰ। ਪ੍ਰੇਮ ਕੈ ਕਾਰਣੈ = ਪ੍ਰੇਮ (ਦੀ ਦਾਤਿ) ਹਾਸਲ ਕਰਨ ਲਈ। ਕਹੁ = ਆਖ। ਗੁਣ ਕਹੁ = ਗੁਣ ਬਿਆਨ ਕਰ, ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਕਰ। ਤੁਅ = ਤੇਰੇ ॥੩॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "estoy dedicado amable y devotamente a tu adoración, Dice Ravi Vidas, el curtidor."