[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੇ ਭਾਣੇ ਨੋ ਕੁਰਬਾਣੁ ॥"
page = 676
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To Thy will, I am a sacrifice."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਰਜ਼ਾ ਉਤੋਂ ਮੈਂ ਬਲਿਹਾਰ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to Your Will."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਤੇਰੇ ਭਾਣੇ ਕੋ ਮੈਂ ਕੁਰਬਾਨ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਤੇਰੀ ਮਰਜ਼ੀ ਤੋਂ ਸਦਕੇ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੋ = ਨੂੰ, ਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ofrezco mi vida en sacrificio a Tu Voluntad."