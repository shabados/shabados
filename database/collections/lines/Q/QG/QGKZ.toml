[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇੰਦ੍ਰ ਚੰਦ ਉਪਿੰਦ੍ਰ ਕੌ; ਪਲ ਮਧਿ ਜੀਤੌ ਜਾਇ ॥"
page = 685

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“I shall conquer even Indra, Chanddra, Upendra in an instant"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇੰਦਰ, ਚੰਦ੍ਰਮਾ ਅਤੇ ਬਾਵਨ ਨੂੰ (ਮੈਂ) ਪਲ ਵਿਚ ਜਾ ਕੇ ਜਿਤ ਲਵਾਂਗਾ।"