[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਗੁਣ ਗਾਵਾ; ਜੀਵਾ ਮੇਰੀ ਮਾਈ ॥"
page = 732
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my mother, I live only by singing God's praises."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਮਾਤਾ! ਮੈਂ ਕੇਵਲ ਵਾਹਿਗੁਰੂ ਦਾ ਜੱਸ ਗਾਇਨ ਕਰਨ ਦੁਆਰਾ ਹੀ ਜੀਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Singing the Glorious Praises of the Lord, I live, O my mother."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਸਖੀ ਰੂਪ ਸੰਤੋ! ਮੈਂ ਹਰੀ ਕੇ ਗੁਣ ਗਾਇਨ ਕਰ (ਜੀਵਾ) ਜੀਵਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਮਾਂ! (ਹੁਣ ਜਿਉਂ ਜਿਉਂ) ਮੈਂ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦਾ ਹਾਂ, ਮੈਨੂੰ ਆਤਮਕ ਜੀਵਨ ਮਿਲ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਾਵਾ = ਗਾਵਾਂ, ਮੈਂ ਗਾਂਦਾ ਹਾਂ। ਜੀਵਾ = ਜੀਵਾਂ, ਮੈਂ ਆਤਮਕ ਜੀਵਨ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹਾਂ। ਮਾਈ = ਹੇ ਮਾਂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi madre, sólo vivo si alabo a mi Señor."