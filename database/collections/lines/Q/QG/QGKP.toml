[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਤੀਤ ਭਏ; ਮਾਰੇ ਬੈਰਾਈ ॥"
page = 840
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who become detached and slay their five adversaries,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਉਪਰਾਮ ਹੋ ਜਾਂਦੇ ਹਨ ਅਤੇ ਆਪਣੇ ਪੰਜੇ ਵੈਰੀਆਂ ਨੂੰ ਮਾਰ ਸੁੱਟਦੇ ਹਨ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who become detached, and conquer the five enemies"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਜਨ ਸੰਸਾਰ ਤੇ (ਅਤੀਤ) ਅਸੰਗ ਹੂਏ ਹੈਂ ਤਿਨੋਂ ਨੇ ਕਾਮ, ਕ੍ਰੋਧ ਆਦੀ ਵੈਰੀ ਮਾਰ ਲਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਨੇ (ਕਾਮਾਦਿਕ) ਸਾਰੇ ਵੈਰੀ ਮੁਕਾ ਲਏ, ਉਹ (ਅਸਲ) ਤਿਆਗੀ ਬਣ ਗਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਤੀਤ = ਵਿਰਕਤ। ਬੈਰਾਈ = (ਕਾਮਾਦਿਕ) ਵੈਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Se vuelve desapegado y destruye a sus cinco adversarios internos,"