[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਕਰੈ ਦੇਹ ਕੋ ਘਾਤ ਬਹੁਰਿ ਕ︀ਯਾ ਪਾਇਯੈ ॥੨੩॥"
page = 866

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘One should not go near such a woman, as one could lose one’s life.’(23)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਦੇਹ ਦਾ ਨਾਸ਼ ਕਰਾ ਕੇ ਫਿਰ ਕੀ ਪ੍ਰਾਪਤ ਕਰਾਂਗੇ ॥੨੩॥"