[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸੁ ਮਨ ਕਉ; ਰੂਪੁ ਨ ਰੇਖਿਆ ਕਾਈ ॥"
page = 330
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This soul has no form or outline."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਆਤਮਾ ਦਾ ਕੋਈ ਸਰੂਪ ਜਾ ਚੱਕਰ-ਚਿਹਨ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This mind has no form or outline."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਇਸ (ਮਨ) ਆਤਮਾ ਕਾ (ਰੂਪੁ) ਅਕਾਰ ਔਰ (ਰੇਖਿ) ਚਿਹਨ ਕਈ ਨਹੀਂ ਹੈ॥☬ਪ੍ਰਸ਼ਨ: ਜੀਵ ਨਾਮ ਕੈਸੇ ਹੂਆ?☬ਉੱਤ੍ਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅਸਲ ਵਿਚ) ਇਸ ਜੀਵ ਦਾ (ਪ੍ਰਭੂ ਤੋਂ ਵੱਖਰਾ) ਕੋਈ ਰੂਪ ਜਾਂ ਚਿਹਨ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੂਪ = ਸ਼ਕਲ। ਰੇਖਿਆ = ਨਿਸ਼ਾਨ, ਚਿਹਨ, ਲਕੀਰ। ਨ ਕਾਈ = ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Alma no tiene ni forma ni seña;"