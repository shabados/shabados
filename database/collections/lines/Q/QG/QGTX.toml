[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਜੰਤ ਕਉ; ਰਿਜਕੁ ਸੰਬਾਹੇ ॥"
page = 1071
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who provides sustenance to all the creatures,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਮੂਹ ਪ੍ਰਾਣਧਾਰੀਆਂ ਨੂੰ ਰੋਜ਼ੀ ਪੁਚਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He gives nourishment to all beings and creatures."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੂਖਮ ਅਸਥੂਲ ਜੀਵੋਂ ਕੋ ਰਿਜਕ ਪਹੁੰਚਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਪਰਮਾਤਮਾ ਸਾਰੇ ਹੀ ਜੀਵਾਂ ਨੂੰ ਰਿਜ਼ਕ ਅਪੜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਸੰਬਾਹੇ = ਅਪੜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, quien provee de sustento a todas Sus Criaturas,"