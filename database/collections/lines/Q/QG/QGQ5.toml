data = "ਏਕ ਰੰਗ ਕਾਹੂ ਨਹੀ ਰਾਤਾ ॥"
page = 11

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is not imbues with undivided love for anyone of them."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਕਿਸੇ ਇਕ ਨਾਲ (ਵਿਸ਼ੇਸ਼ ਰੂਪ ਵਿਚ) ਸੰਬੰਧਿਤ ਨਹੀਂ ਹੈ।"