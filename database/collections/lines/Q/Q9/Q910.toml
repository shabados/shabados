[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇ ਉਧਰੇ; ਜਿਨ ਰਾਮ ਧਿਆਏ ॥"
page = 1312
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They alone are emancipated, who meditate their Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਨ੍ਹਾਂ ਦਾ ਹੀ ਹੀ ਪਾਰ ਉਤਾਰਾ ਹੁੰਦਾ ਹੈ, ਜੋ ਆਪਣੇ ਸਾਈਂ ਦਾ ਸਿਮਰਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They alone are saved, who meditate on the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸੇ ਪੁਰਸ਼ ਉਧਰੇ ਹੈਂ ਜਿਨੋਂ ਨੇ ਰਾਮ ਕੇ ਨਾਮ ਧਿਆਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਨੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਿਆ, ਉਹ (ਵਿਕਾਰਾਂ ਦੀ ਮਾਰ ਤੋਂ) ਬਚ ਗਏ (ਅੰਤ ਵੇਲੇ ਭੀ ਹਰਿ-ਨਾਮ ਹੀ ਉਹਨਾਂ ਦਾ ਸਾਥੀ ਬਣਿਆ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇ = ਉਹ ਮਨੁੱਖ (ਬਹੁ-ਵਚਨ)। ਜਿਨ = ਜਿਨ੍ਹਾਂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo serán salvados quienes mediten en el Señor."