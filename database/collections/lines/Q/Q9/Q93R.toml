[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਹੁ; ਤੁਧੁ ਖੁਆਇਆ ॥"
page = 72
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou Thyself, O Lord! hast misled it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪ ਹੀ, ਹੈ ਸਾਹਿਬ! ਇਸ ਨੂੰ ਗੁਮਰਾਹ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You Yourself, Lord, have led it astray."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਰਮੋਂ ਕੇ ਅਨੁਸਾਰ ਤੈਨੇ ਆਪ ਹੀ ਸ੍ਵਰੂਪ ਸੇ (ਖੁਆਇਆ) ਭੁਲਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਜੀਵਾਂ ਦੇ ਕੀਹ ਵੱਸ? ਹੇ ਪ੍ਰਭੂ!) ਤੂੰ ਆਪ ਹੀ (ਜਗਤ ਨੂੰ) ਆਪਣੇ ਆਪ ਤੋਂ ਵਿਛੋੜਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪਹੁ ਤੁਧੁ = ਤੂੰ ਆਪਣੇ ਆਪ ਤੋਂ (ਹੇ ਪ੍ਰਭੂ!)। ਖੁਆਇਆ = ਖੁੰਝਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero ¿quién lo ha desviado en verdad sino Tú?"