[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜਲ ਅਗਨੀ ਵਿਚਿ ਘਤਿਆ; ਜਲੈ ਨ ਡੁਬੈ ਗੁਰ ਪਰਸਾਦਿ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The malevolent demon picked up the quarrel. Prahlad was thrown into fire and water but with the grace of Guru (the Lord) neither he was burnt nor drowned."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਾਣੀ ਤੇ ਅੱਗ ਵਿਚ ਸਿਟ ਦਿੱਤਾ, (ਪਰੰਤੂ) ਗੁਰੂ ਦੀ ਕ੍ਰਿਪਾ ਨਾਲ (ਅੱਗ ਨੇ ਨਾ) ਸਾੜਿਆ (ਤੇ ਨਾਂ ਪਾਣੀ ਨੇ) ਡੋਬਿਆ।"