[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਹਰਿ ਜੀਉ; ਸਭੁ ਕੋ ਤੇਰੈ ਵਸਿ ॥"
page = 736
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My sire Lord, all are in Thine power."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਾਹਰਾਜ ਮਾਲਕ! ਸਾਰੇ ਤੇਰੇ ਇਖਤਿਆਰ ਵਿੱਚ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my Dear Lord, everything is in Your power."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਵਾਹਿਗੁਰੂ! ਸਭ ਕੁਛ ਤੇਰੇ ਹੀ ਬਸ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪ੍ਰਭੂ ਜੀ! ਹਰੇਕ ਜੀਵ ਤੇਰੇ ਵੱਸ ਵਿਚ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਸਿ = ਵੱਸ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi Dios, todos Tus seres están bajo Tu Designio; nosotros, Tus Criaturas, no tenemos poder."