[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਧੇਰੈ, ਰਾਹੁ ਨ ਕੋਈ ॥"
page = 145
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In darkness, I find no path."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਨ੍ਹੇਰੇ ਵਿੱਚ ਮੈਨੂੰ ਰਸਤਾ ਨਹੀਂ ਲੱਭਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In this darkness, I cannot find the path."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅੰਧੇਰੇ ਮੇਂ ਰਾਹ ਦਸਣੇ ਵਾਲਾ ਅਰਥਾਤ ਸੋ ਮਾਰਗ ਚਲਾਉਣੇ ਵਾਲਾ ਕੋਈ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਨੇਰੇ ਵਿਚ ਕੋਈ ਰਾਹ ਦਿੱਸਦਾ ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Buscar en vano me ha vuelto loco,"