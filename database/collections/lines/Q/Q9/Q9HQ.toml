[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਟਿ ਗਈ ਗਣਤ; ਬਿਨਾਸਿਉ ਸੰਸਾ ॥"
page = 390
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My account is effaced and dispelled is my doubt."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਲੇਖਾ-ਪੱਤਾ ਬਿਨਸ ਗਿਆ ਹੈ ਅਤੇ ਦੂਰ ਹੋ ਗਿਆ ਹੈ ਮੇਰਾ ਵਹਿਮ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The record of my account is erased, and my doubts are dispelled."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਕੀ ਗਿਣਤੀ ਮਿਟਿ ਗਈ ਹੈ ਸੰਦੇਹ ਦੂਰ ਹੋ ਗ੍ਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਉਹਨਾਂ ਦੀ ਹਰੇਕ ਚਿੰਤਾ ਮਿਟ ਜਾਂਦੀ ਹੈ ਉਹਨਾਂ ਦਾ ਹਰੇਕ ਸਹਮ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਣਤ = ਚਿੰਤਾ। ਸੰਸਾ = ਸਹਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mis cuentas son saldadas, mi duda es disipada,"