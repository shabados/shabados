type = "primary"
data = "ਜਿਯ ਅਪਨੇ ਕੋ ਤ੍ਰਾਸ ਨ ਕਰਹੀ ॥੪੪॥"
page = 964

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "While gratifying themselves with love-making, they dreaded not at all.(44)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਹਿਰਦੇ ਵਿਚ ਜ਼ਰਾ ਜਿੰਨੇ ਵੀ ਨਹੀਂ ਡਰੇ ॥੪੪॥"