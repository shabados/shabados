[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮੋ ਆਸ ਆਸੇ, ਨਮੋ ਬਾਂਕ ਬੰਕੇ ॥"
page = 10
line = 9

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Salutation to Thee O Fulfiller of hopes! Salutation to Thee O Most Beautiful!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੁਖਾਂ ਦੇ ਵੀ ਮੁਖ (ਜਾਂ ਆਸ਼ਾਵਾਂ ਦੇ ਵੀ ਆਸ਼ਯ); (ਤੈਨੂੰ) ਨਮਸਕਾਰ ਹੈ; ਹੇ ਬਾਣੀ ('ਬਾਕ') ਦੇ ਵੀ ਸ਼ਿੰਗਾਰ! (ਤੈਨੂੰ) ਨਮਸਕਾਰ ਹੈ।"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਨਮੋ, ਆਸ ਆਸੇ; ਨਮੋ, ਬਾਂਕ ਬੰਕੇ ॥"