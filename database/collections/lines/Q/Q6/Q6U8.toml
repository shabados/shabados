[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਸਿਆਨਪ ਛਾਡਿ ॥"
page = 895
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Forsake thou thy all cleverness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੀ ਸਾਰੀ ਚਤੁਰਾਈ ਨੂੰ ਤਿਆਗ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Abandon all your clever tricks."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਭ ਸਿਆਨਪਾਂ ਕੋ ਛੋਡ ਦੇਹ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਇਹੋ ਜਿਹੇ ਸਾਰੇ ਖ਼ਿਆਲ ਛੱਡ ਦੇਹ ਕਿ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਲੰਘਣ ਲਈ) ਤੂੰ ਬੜਾ ਸਿਆਣਾ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲ ਸਿਆਨਪ = ਸਾਰੀਆਂ ਚਤੁਰਾਈਆਂ, ਇਹੋ ਜਿਹੇ ਖ਼ਿਆਲ ਕਿ ਤੂੰ ਬੜਾ ਸਿਆਣਾ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente mía, haz a un lado tus astucias,"