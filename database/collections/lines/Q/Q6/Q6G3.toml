[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਲੀਆ ਸਾਹਾਰੂ ਭਲੇ; ਛੀਂਬੇ ਗੁਰ ਦਰਗਹ ਦਰਬਾਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many Courtiers of the Gurus court such as Mallia, Saharu, Bhallas and calico-printers have happened."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੱਲੀਆ ਸਹਾਰੂ ਭਲਾ ਛੀਂਬੇ ਗੁਰ ਦਰਬਾਰ ਦੇ ਦਰਬਾਰੀ ਹੋਏ।"