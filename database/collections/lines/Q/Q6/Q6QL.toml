[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਉ ਮਹਲੁ ਹਜੂਰਿ; ਦੂਜੇ ਨਿਵੈ ਕਿਸੁ ॥"
page = 729
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who lives close to his Lord's mansion; why should he bow to another?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇ ਆਪਣੇ ਸਾਹਿਬ ਦੇ ਮੰਦਰ ਦੇ ਨੇੜੇ ਵਸਦਾ ਹੈ, ਉਹ ਹੋਰਸ ਕਿਸੇ ਨੂੰ ਕਿਉਂ ਨਕਸਕਾਰ ਕਰੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "And one who lives in the Mansion of the Lord's Presence, why should he bow down to any other?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨਾਂ ਕੋ ਸ੍ਵਰੂਪ ਸਾਖ੍ਯਾਤ ਹੋਇਆ ਹੈ ਵਹੁ ਦੂਸਰੇ ਕਿਸ ਕੇ ਆਗੇ ਨਿਵੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੇ ਦੱਸੇ ਰਾਹ ਤੇ ਤੁਰ ਕੇ) ਜਿਸ ਬੰਦੇ ਨੂੰ ਪਰਮਾਤਮਾ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਥਾਂ ਮਿਲ ਜਾਂਦਾ ਹੈ ਉਹ ਕਿਸੇ ਹੋਰ ਦੇ ਅੱਗੇ ਤਰਲੇ ਨਹੀਂ ਕਰਦਾ ਫਿਰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਹਲੁ = ਟਿਕਾਣਾ। ਹਜੂਰਿ = ਪ੍ਰਭੂ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que vive en la Presencia del Señor, ¿por qué debe postrarse ante otro?"