[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਜਾਨਹਿ; ਹਰਿ ਪ੍ਰਭ ਧਨੀ ॥"
page = 212
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who knows Lord God as his Master with him,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਵਾਹਿਗੁਰੂ ਨੂੰ ਆਪਣਾ ਮਾਲਕ ਕਰਕੇ ਜਾਣਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who know the Lord God as their Master,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੁਰਸ ਹਰੀ ਪ੍ਰਭੂ ਕੋ ਅਪਨਾ ਮਾਲਕ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜੇਹੜੇ ਮਨੁੱਖ (ਸਭ ਖ਼ਜ਼ਾਨਿਆਂ ਦੇ) ਮਾਲਕ ਹਰਿ-ਪ੍ਰਭੂ ਨਾਲ ਡੂੰਘੀ ਸਾਂਝ ਪਾ ਲੈਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਨਹਿ = ਜਾਣਦੇ ਹਨ, ਡੂੰਘੀ ਸਾਂਝ ਪਾਂਦੇ ਹਨ। ਧਨੀ = ਮਾਲਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que toma al Señor como su Maestro,"