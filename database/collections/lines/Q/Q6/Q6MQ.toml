[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਰੰਗ ਮਹਲਾ ੫ ਸੂਰਦਾਸ ॥"
page = 1253
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sarang 5th Guru Sur Das."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੰਗ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ। ਸੂਰਦਾਸ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Saarang, Fifth Mehl, Sur Daas:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਸਾਰੰਗ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਬਾਣੀ, ਭਗਤ ਸੂਰਦਾਸ ਦੇ ਸਿਰਲੇਖ ਹੇਠ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sarang, Mejl Guru Aryan Dev, Quinto Canal Divino, Surdas."