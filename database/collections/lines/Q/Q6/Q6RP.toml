[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਅਪਨੇ ਕਾ; ਹੁਕਮੁ ਪਛਾਨੈ ॥"
page = 286
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and recognises the order of his Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੇ ਮਾਲਕ ਦੇ ਫੁਰਮਾਨ ਨੂੰ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They recognize God's Own Command."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਤਿਸੀ ਕਾ ਕੀਆ ਹੂਆ ਜਾਨ ਕਰ ਅਪਨੇ ਸ੍ਵਾਮੀ ਕੇ ਹੁਕਮ ਕੋ ਪਛਾਨਤੇ ਹੈਂ, ਭਾਵ ਤਿਸ ਕੇ ਹੁਕਮ ਮੇਂ ਪ੍ਰਸੰਨ ਰਹਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ, ਜੋ ਕੁਝ ਹੋ ਰਿਹਾ ਹੈ, ਉਸ ਨੂੰ (ਰਜ਼ਾ ਵਿਚ) ਜਾਣਦਾ ਹੈ;"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ya sabe que todo proviene de Él."