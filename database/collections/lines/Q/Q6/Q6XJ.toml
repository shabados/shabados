[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਸੋ ਸਾਲਾਹੀਐ; ਜਿ ਸਭਸੈ ਦੇ ਆਧਾਰੁ ॥੨॥"
page = 791
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, praise thou Him who gives support to all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਤੂੰ ਉਸ ਦੀ ਸਿਫ਼ਤ ਕਰ ਜੋ ਸਾਰਿਆਂ ਨੂੰ ਆਸਰਾ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, praise the One who gives Support to all. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਭਾਈ! (ਸੋ) ਉਸ ਕੋ ਸਲਾਹੀਏ ਜੋ ਸਭ ਕੋ (ਆਧਾਰ) ਆਸਰਾ ਦੇਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਪ੍ਰਭੂ ਨੂੰ ਸਿਮਰੀਏ ਜੋ ਸਭ ਦਾ ਆਸਰਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, alaba a Quien da el sustento a todos. (2)"