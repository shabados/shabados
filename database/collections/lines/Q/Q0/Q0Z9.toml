[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸਾ ਗੁਰੁ; ਪਾਈਐ ਵਡਭਾਗੀ ॥"
page = 1339
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the great good fortune is found such a Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੰਗੇ ਭਾਗਾਂ ਰਾਹੀਂ ਐਹੋ ਜੇਹੇ ਗੁਰੂ ਜੀ ਪਰਾਪਤ ਹੁੰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By great good fortune, such a Guru is found;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸਾ ਸਤਿਗੁਰੂ ਬਡੇ ਭਾਗੋਂ ਸੇ ਪਾਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹੋ ਜਿਹਾ ਗੁਰੂ ਵੱਡੀ ਕਿਸਮਤ ਨਾਲ ਹੀ ਮਿਲਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por una Gran Fortuna uno encuentra a Tal Guru."