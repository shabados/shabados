data = "ਸਬ ਰੂਪ ਅਉ ਸਬ ਠਉਰ ॥"
page = 610

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Expect himself, he did not have faith in anyone"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਰੂਪਾਂ ਅਤੇ ਸਥਾਨਾਂ ਵਿਚ ਹੋਰ ਕਿਸੇ ਨੂੰ ਵੀ ਨਾ ਜਾਣਿਆ।"