[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਟਿ ਸਿਲਕ; ਪ੍ਰਭਿ ਸੇਵਾ ਲਾਇਆ ॥"
page = 101
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord has cut my noose and yoked me to His service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਨੇ ਮੇਰੀ ਫਾਹੀ ਕਟ ਸੁਟੀ ਹੈ ਅਤੇ ਮੈਨੂੰ ਆਪਣੀ ਟਹਿਲ ਸੇਵਾ ਅੰਦਰ ਜੋੜ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God has cut the noose from around my neck; He has placed me in His Service."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭ ਜੀ! ਤੈਨੇ (ਸਿਲਕ) ਜੰਜੀਰੀ ਅਰਥਾਤ ਵਾਸਨਾਂ ਰੂਪੀ ਫਾਂਸੀ ਕੋ ਕਾਟ ਕਰ ਅਪਨੀ ਸੇਵਾ ਮੇਂ ਲਗਾਇ ਲੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ (ਜਿਸ ਨੂੰ ਉਸ ਦੀ ਮਾਇਆ ਦੇ ਮੋਹ ਦੀ) ਫਾਹੀ ਕੱਟ ਕੇ ਆਪਣੀ ਸੇਵਾ-ਭਗਤੀ ਵਿਚ ਜੋੜਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਲਕ = ਫਾਹੀ। ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ। ਕਾਟਿ = ਕੱਟ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor ha cortado mis amarras y me ha traído a Su Servicio."