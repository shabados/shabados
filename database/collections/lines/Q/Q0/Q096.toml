[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਮਰ ਚਾਰੁ ਚਹੂੰ ਓਰਿ; ਢੁਰਤ ਸੁੰਦਰ ਛਬਿ ਪਾਵਤ ॥"
page = 699

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The pretty fly-whisks are swinging and the beauty of this hero is fascinating"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਚੌਹਾਂ ਪਾਸੇ ਸੁੰਦਰ ਚੌਰ ਢੁਲਦਾ ਹੋਇਆ ਸੁੰਦਰ ਛਬੀ ਪ੍ਰਾਪਤ ਕਰ ਰਿਹਾ ਹੈ।"