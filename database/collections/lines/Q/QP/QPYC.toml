[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਸ ਦੇਖੀਐ; ਤਰਵਰ ਕੀ ਛਾਇਆ ॥"
page = 325
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The wealth, which appears to be like the shadow of a tree,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੌਲਤ ਜੋ ਦਰਖਤ ਦੀ ਛਾਂ ਦੀ ਤਰ੍ਹਾਂ ਜਾਪਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It is like the shadow of a tree;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਬ੍ਰਿਛ ਕੀ ਛਇਆ ਪ੍ਰਣਾਮੀ ਦੇਖੀਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਰੁੱਖ ਦੀ ਛਾਂ ਵੇਖੀਦੀ ਹੈ (ਭਾਵ, ਜਿਵੇਂ ਰੁੱਖ ਦੀ ਛਾਂ ਸਦਾ ਟਿਕੀ ਨਹੀਂ ਰਹਿੰਦੀ, ਤਿਵੇਂ ਇਸ ਮਾਇਆ ਦਾ ਹਾਲ ਹੈ);"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਸ = ਜਿਵੇਂ। ਤਰਵਰ = ਰੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como la sombra del árbol cambia siempre,"