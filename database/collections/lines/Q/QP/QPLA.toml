[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਆਪਿ ਆਪਿ ਸਾਲਾਹੇ ॥"
page = 1057
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of Himself, the Lord praises Himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖ਼ੁਦ-ਬਖ਼ੁਦ, ਪ੍ਰਭੂ ਆਪਣੇ ਆਪ ਦਾ ਜੱਸ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself praises Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਰੂਪ ਹੋ ਕਰ ਆਪਨੇ ਆਪ ਕੋ ਹੀ ਸਲਾਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇ ਕੋਈ ਵਡਭਾਗੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰ ਰਿਹਾ ਹੈ, ਤਾਂ ਉਸ ਵਿਚ ਬੈਠਾ ਭੀ ਪ੍ਰਭੂ) ਆਪ ਹੀ ਆਪ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੇ = ਆਪ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor, por Sí Mismo, se alaba a Sí Mismo y a Sus Virtudes,"