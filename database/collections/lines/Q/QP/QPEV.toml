[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਸੂਖਮੁ; ਹੋਆ ਅਸਥੂਲੀ ॥"
page = 102
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From being very minute Thou hast become very big."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਿਹਾਇਤ ਹੀ ਮਹੀਨ ਤੋਂ ਤੂੰ ਬਹੁਤ ਹੀ ਵੱਡਾ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "From the very small and subtle, You have become huge and manifest."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੂੰ (ਸੂਖਮੁ) ਨਿਰਗੁਣ ਸਰੂਪੁ ਥਾ ਸੋਈ (ਅਸਥੂਲੀ) ਵੈਰਾਟ ਸਰੂਪ ਹੋਤਾ ਭਯਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਅਦ੍ਰਿਸ਼ਟ ਹੈਂ (ਆਪਣੇ ਅਦ੍ਰਿਸ਼ਟ ਰੂਪ ਤੋਂ) ਦਿੱਸਦਾ ਜਗਤ ਬਣਿਆ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੂਖਮੁ = {सुक्ष्म subtle, minute} ਅਦ੍ਰਿਸ਼ਟ। ਅਸਥੂਲ {स्थुल = gross, coarse} ਦ੍ਰਿਸ਼ਟਮਾਨ ਜਗਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú eres Transparente; Tú, también Manifiesto."