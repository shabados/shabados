[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਨੁ. ਨ ਜਾਈ; ਖੇਲੁ ਤੁਹਾਰਾ ॥"
page = 746
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thine play, O Lord, I can narrate not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਖੇਡ, ਹੇ ਸੁਆਮੀ! ਮੈਂ ਵਰਣਨ ਨਹੀਂ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I cannot describe Your play."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਖੇਲ ਕੁਛ ਕਹਿਆ ਨਹੀਂ ਜਾਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਰਚਿਆ ਜਗਤ-ਖੇਲ ਬਿਆਨ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Señor, no puedo describir Tu Maravilla."