[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋਤ ਭਯੋ ਤਿਹ ਜੁਧ ਬਡੋ; ਦੁਹੂੰ ਓਰਨ ਤੇ ਨ੍ਰਿਪ ਠਾਢਿ ਨਿਹਾਰਿਯੋ ॥੧੧੫੬॥"
page = 413

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They killed everyone who confronted them while shouting “Kill, Kill”, the king Jarasandh saw this terrible war being fought from both sides.1156."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਦੋਹਾਂ ਪਾਸਿਆਂ ਤੋਂ ਬਹੁਤ ਤਕੜਾ ਯੁੱਧ ਹੋਇਆ ਹੈ ਜਿਸ ਨੂੰ ਰਾਜੇ ਨੇ ਖੜੋ ਕੇ ਵੇਖਿਆ ਹੈ ॥੧੧੫੬॥"