[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਨ ਹੋਇ; ਤੁਮਾਰਾ ਕਾਮੁ ॥"
page = 176
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thy affair shall be accomplished."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਕਾਰਜ ਪੂਰਾ ਹੋ ਜਾਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your works shall be brought to fruition."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੁਮਾਰਾ ਸੰਕਲਪ ਪੂਰਨ ਹੋ ਜਾਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਤੇਰਾ (ਮਨੁੱਖਾ ਜੀਵਨ ਦਾ) ਮਨੋਰਥ ਸਿਰੇ ਚੜ੍ਹ ਜਾਇਗਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਮੁ = ਕੰਮ, ਜੀਵਨ-ਮਨੋਰਥ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre del Señor, para que cumplas  tu Destino."