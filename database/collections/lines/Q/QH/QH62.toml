[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੁਹ ਕਾਲੇ ਕੂੜਿਆਰੀਆ; ਕੂੜਿਆਰ. ਕੂੜੋ ਹੋਇ ਜਾਵੈ ॥੬॥"
page = 302
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Black are the faces of the lairs. The false remain but false."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿਆਹ ਹਨ ਚਿਹਰੇ ਝੂਠਿਆਂ ਦੇ। ਝੂਠੇ ਨਿਰੋਲ ਝੁਠੇ ਹੀ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Black are the faces of the false; the false remain just false. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਝੂਠੇ ਪੁਰਸ਼ੋਂ ਕੇ ਮੂੰਹ ਕਾਲੇ ਹੋਤੇ ਹੈਂ ਕਿਉਂਕਿ ਝੂਠਿਓਂ ਕਾ ਕਰਮ ਝੂਠਾ ਹੀ ਹੋ ਜਾਤਾ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੂੜਿਆਰਾਂ ਦੇ ਮੂੰਹ (ਦਰਗਾਹ ਵਿਚ) ਕਾਲੇ ਹੁੰਦੇ ਹਨ (ਕਿਉਂਕਿ) ਉਹਨਾਂ ਦੇ ਕੂੜ ਦਾ ਨਿਤਾਰਾ ਹੋ ਜਾਂਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੂੜੋ = ਕੂੜ ਹੀ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sus semblantes son obscuros; los falsos no permanecen más que falsos.(6)"