[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤ ਕੀ ਨਿੰਦਾ; ਰਾਜ ਤੇ ਟਲੈ ॥੨॥"
page = 1145
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the saints' A calumniation, one loses one loses one's empire."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਦੀ ਬਦਖੋਈ ਰਾਹੀਂ ਇਨਸਾਨ ਰਾਜ ਭਾਗ ਗੁਆ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Slandering the devotees, he loses his realm and power. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭਗਤ ਕੀ ਨਿੰਦਾ ਕਰਨੇਹਾਰਾ ਰਾਜ ਤੇ ਉਤਰ ਜਾਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ, ਉੱਚੀ ਆਤਮਕ ਪਦਵੀ ਤੋਂ ਹੇਠਾਂ ਡਿੱਗ ਪੈਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਜ ਤੇ = ਉੱਚੀ ਆਤਮਕ ਪਦਵੀ ਤੋਂ। ਟਲੈ = ਹੇਠਾਂ ਡਿੱਗ ਪੈਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "calumniando al Santo uno pierde toda Gloria. (2)"