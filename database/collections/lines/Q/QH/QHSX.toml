[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੁਸਿ ਮੁਸਿ ਰੋਵੈ; ਕਬੀਰ ਕੀ ਮਾਈ ॥"
page = 524
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Kabir's mother sobs, sobs and wails,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਦੀ ਮਾਤਾ ਡੁਸਕ ਡੁਸਕ ਦੇ ਵਿਰਲਾਪ ਕਰਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Kabeer's mother sobs, cries and bewails"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕਬੀਰ ਕੀ ਮਾਤਾ ਠੁਸਕ ਠੁਸਕ ਕੇ ਰੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਦੀ ਮਾਂ (ਕਬੀਰ ਆਖਦਾ ਹੈ ਕਿ ਮੇਰੀ ਮਾਂ) ਡੁਸਕ ਡੁਸਕ ਕੇ ਰੋਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਸਿ ਮੁਸਿ = ਡੁਸਕ ਡੁਸਕ ਕੇ। ਮਾਈ = ਮਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La madre de Kabir se acongoja y sufre diciendo,"