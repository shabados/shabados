[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਉਠੰਤ ਛਿਛ ਇਛਯੰ ਪਿਪੰਤ ਮਾਸ ਹਾਰਯੰ ॥੩੧੨॥"
page = 231

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There is flow of arms and the broken limbs were falling down, the waves of the desire of victory are rising and the chopped flesh is falling.312."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਲਹੂ ਦੀਆਂ ਜੋ ਛਿੱਟਾਂ ਉਡਦੀਆਂ ਸਨ (ਉਨ੍ਹਾਂ ਨੂੰ) ਮਾਸਾਹਾਰੀ ਪੀਂਦੇ ਸਨ ॥੩੧੨॥"