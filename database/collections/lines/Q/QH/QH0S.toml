[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਸਬਦੀ ਮਥਿ; ਅੰਮ੍ਰਿਤੁ ਪੀਉ ॥"
page = 226
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's instruction ponder over and quaff the Name Nectar."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਦੁਆਰਾ ਨਾਮ ਸੁਧਾਰਸ ਨੂੰ ਸਿਮਰ ਤੇ ਪਾਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Word of the Guru's Shabad, contemplate this Ambrosial Nectar."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ (ਗੁਰ ਸਬਦੀ) ਗੁਰੋਂ ਕੇ ਸਬਦ ਵਾਲੇ ਜੋ ਪੁਰਸ ਹੈਂ ਤਿਨ੍ਹੋਂ ਕੇ ਦ੍ਵਾਰੇ ਵਿਚਾਰ ਕਰ ਕੇ ਸਿਧਾਂਤ ਰੂਪੀ ਅੰਮ੍ਰਿਤ ਕੋ ਪਾਨ ਕਰੀਏ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ (ਪਰਮਾਤਮਾ ਦੇ ਗੁਣਾਂ ਨੂੰ) ਮੁੜ ਮੁੜ ਵਿਚਾਰ ਕੇ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਰਸ ਪੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਥਿ = ਰਿੜਕ ਕੇ, ਚੰਗੀ ਤਰ੍ਹਾਂ ਵਿਚਾਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cantando la Palabra del Shabd del Guru, bebo del Néctar del Señor,"