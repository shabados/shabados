[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰਾ ਅੰਤੁ. ਨ ਜਾਈ ਲਖਿਆ ॥੧॥ ਰਹਾਉ ॥"
page = 469
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thine limit cannot be comprehended. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਓੜਕ ਜਾਣਿਆਂ ਨਹੀਂ ਜਾ ਸਕਦਾ। ਠਹਿਰਾਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your limits cannot be known. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਅੰਤ ਕਿਸੀ ਸੇ ਲਖਾ ਨਹੀਂ ਜਾਤਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਅੰਤ ਪਾਇਆ ਨਹੀਂ ਜਾ ਸਕਦਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "॥੧॥ਰਹਾਉ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin Límite eres Tú; nadie conoce Tu Fin. (1‑Pausa)"