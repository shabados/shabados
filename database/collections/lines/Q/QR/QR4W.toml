[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚਾ ਵੇਪਰਵਾਹੁ; ਸਬਦਿ ਸੰਤੋਖੀਆਂ ॥"
page = 1288
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The man of contentment Lord through the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਖਵਾਨ ਪੁਰਸ਼ ਨਾਮ ਦੇ ਰਾਹੀਂ, ਸੱਚੇ ਸੁਤੰਤਰ ਸੁਆਮੀ ਨੂੰ ਪਾ ਲੈਂਦੇ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Shabad, the Word of the True and Independent Lord God, one becomes content."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰ ਸਬਦ ਕਰ ਸੰਤੁਸ਼੍ਟ ਹੂਏ ਗੁਰਮੁਖੋਂ ਕੋ ਸਚਾ ਵੇਪਰਵਾਹੁ ਤਿਨ ਦੁਖੋਂ ਸੇ ਬਚਾਇ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰ-ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ ਸੰਤੋਖੀ ਬੰਦਿਆਂ ਨੂੰ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਬੇ-ਮੁਥਾਜ ਪਰਮਾਤਮਾ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ। ਵੇਪਰਵਾਹੁ = ਬੇ-ਮੁਥਾਜ। ਸਬਦਿ = ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mediante el Shabd, la Palabra del Verdadero y Soberano Señor Dios, uno encuentra el Contentamiento."