[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਠਾਕੁਰ ਕੇ ਜਨ ਪ੍ਰੀਤਮ ਪਿਆਰੇ; ਜੋ ਹੋਵਹਿ ਦਾਸਨਿ ਦਾਸਾ ॥੭॥"
page = 1191
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Lords slaves, who are the servants of His servants, are dear and sweet unto Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਾਲਕ ਦੇ ਗੁਮਾਸ਼ਤੇ, ਜਿਹੜੇ ਉਸ ਦੇ ਸੇਵਕਾਂ ਦੇ ਸੇਵਕ ਹਨ, ਉਸ ਨੂੰ ਲਾਡਲੇ ਅਤੇ ਮਿਠੜੇ ਲਗਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The servants of my Lord and Master are loved by the Beloved. They are the slaves of His slaves. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵੋਹੀ ਜਨ ਮੇਰੇ ਠਾਕੁਰ ਕੇ ਪ੍ਯਾਰੇ ਪ੍ਰੀਤਮ ਹੈਂ, ਜੋ ਦਾਸੋਂ ਕੇ ਦਾਸ ਹੋਤੇ ਹੈਂ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੇ ਦਾਸਾਂ ਦੇ ਦਾਸ ਬਣਦੇ ਹਨ, ਉਹ ਪਰਮਾਤਮਾ ਨੂੰ ਪਿਆਰੇ ਲੱਗਦੇ ਹਨ ॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰੀਤਮ ਪਿਆਰੇ = ਪ੍ਰੀਤਮ-ਪ੍ਰਭੂ ਨੂੰ ਪਿਆਰੇ ਲੱਗਦੇ ਹਨ। ਜੋ = ਜਿਹੜੇ। ਹੋਵਹਿ = {ਬਹੁ-ਵਚਨ} ਹੁੰਦੇ ਹਨ। ਦਾਸਨਿ ਦਾਸਾ = ਦਾਸਾਂ ਦੇ ਦਾਸ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sus Méritos se vuelven manifiestos, así los Santos se vuelven muy queridos de Dios, pues se convierten en los esclavos de Sus Esclavos. (7)"