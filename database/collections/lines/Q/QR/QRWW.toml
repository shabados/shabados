[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸ︀ਯਾਮ ਭਨੇ ਅਮਿਟੇਸ ਕੇ ਸਾਮੁਹੇ ਆਹਵ ਮੈ ਕੋਊ ਨ ਠਹਿਰਾਨੇ ॥"
page = 421

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "No one could confront Amit Singh"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਵੀ) ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, ਅਮਿਟ ਸਿੰਘ ਦੇ ਸਾਹਮਣੇ ਯੁੱਧ-ਭੂਮੀ ਵਿਚ ਕੋਈ ਵੀ ਠਹਿਰ ਨਾ ਸਕਿਆ।"