data = "ਨਾਮ ਤੁਪਕ ਕੇ ਸਕਲ ਪਤਿਜੈ ॥੯੭੧॥"
page = 776

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Nishi-Ish-bhagni”, add the words “Jaachar-pati-shatru” and recognize all the naemes of Tupak.971."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਾਰੇ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝੋ ॥੯੭੧॥"