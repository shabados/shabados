type = "primary"
data = "ਮਧੁਕਰ ਸਾਹ ਸੁ ਬੀਰ; ਜਗਤ ਮੈ ਜਾਨਿਯੈ ॥"
page = 816

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And was known as Madhukar Shah."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਮਧੁਕਰ ਸ਼ਾਹ ਨਾਂ ਦਾ ਬਹਾਦਰ ਰਾਜਾ ਜਾਣਿਆਂ ਜਾਂਦਾ ਸੀ।"