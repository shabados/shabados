[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਆਖਨਿ ਸਿਧਿ ਸੁਣਿ ਬਾਲਿਆ; ਆਪਣਾ ਨਾਉ ਤੁਮ ਦੇਹੁ ਬਤਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Siddhs said, (O young man, tell us your name)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਿੱਧ ਬੋਲੇ, “ਸੁਣ ਬਾਲੇ! ਤੂੰ ਆਪਣਾ ਨਾਮ (ਤਾਂ ਸਾਨੂੰ) ਦੱਸ ਦੇਹ”।"