[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਊਆ ਸੁਤ ਚਿਮਟਿਯੋ ਹੀ ਮਾਰਿਯੋ ॥"
page = 894

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then the Shah’s son emancipated the whole village."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਨਾਈ ਦੇ ਪੁੱਤਰ ਨੂੰ ਚਿਮਟਿਆ ਹੋਇਆ ਹੀ ਮਾਰ ਦਿੱਤਾ।"