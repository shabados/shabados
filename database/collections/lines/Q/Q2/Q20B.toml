[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਕ ਅਹੀਰ ਉਪਚਾਰ ਕਰਿ; ਮੋ ਕੌ ਲਿਯੋ ਉਬਾਰਿ ॥"
page = 847

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘One milkman planned and rescued me."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਗੁਜਰ ਨੇ ਉਪਾ ਕਰ ਕੇ ਮੈਨੂੰ ਬਚਾ ਲਿਆ।"