[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਮੰਡਲ ਮਹਿ; ਜਨਮ ਮਰਣੁ ਰਹੈ ॥"
page = 1146
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the society of saints, one is ride of birth and death."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿ ਸੰਗਤ ਦੁਆਰਾ ਜੀਵ ਜੰਮਣ ਅਤੇ ਮਰਣ ਤੋਂ ਖਲਾਸੀ ਪਾ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Realm of the Saints, birth and death are ended."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਮੰਡਲ ਵਿਖੇ ਜਨਮ ਮਰਨ ਨਿਬ੍ਰਤ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਵਿਚ ਰਿਹਾਂ ਜਨਮ ਮਰਨ (ਦਾ ਗੇੜ) ਮੁੱਕ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਹੈ = ਮੁੱਕ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En el Reino de los Santos, uno se sobrepone al nacimiento y a la muerte."