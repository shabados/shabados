[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਰੈ; ਰਾਖੈ ਏਕੋ ਆਪਿ ॥"
page = 281
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The One Lord Himself destroys and projects."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਪ੍ਰਭੂ ਆਪੇ ਹੀ ਮਾਰਦਾ ਤੇ ਰਖਿਆ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One Lord Himself destroys and also preserves."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਵੁਹ ਆਪ ਹੀ ਜੀਵੋਂ ਕੋ ਮਾਰਤਾ ਔ ਰਾਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਹੀ (ਜੀਵਾਂ ਨੂੰ) ਮਾਰਦਾ ਹੈ (ਜਾਂ) ਪਾਲਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo Dios es quien salva o destruye,"