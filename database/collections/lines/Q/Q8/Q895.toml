[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਨ ਪਖਾਰਉ ਕਰਿ ਸੇਵਾ; ਜੇ ਠਾਕੁਰ ਭਾਵੈ ॥"
page = 809
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If it please Thee, O Lord, I shall wash Thine feet and serve Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਤੈਨੂੰ ਚੰਗਾ ਲੱਗੇ, ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਤੇਰੇ ਪੈਰ ਧੌਵਾਂਗਾ ਅਤੇ ਸੇਵਾ ਟਹਿਲ ਕਮਾਵਾਂਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I wash Your Feet and serve You, if it pleases You, O Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਗੁਰੂ ਜੋ ਤੇਰੇ ਸ੍ਵਰੂਪ ਹੈਂ ਤਿਨ ਕੇ ਚਰਨਾਂ ਕਉ (ਪਖਾਰਉ) ਧੋਵੋ ਪੁਨਾ ਅਵਰ ਸੇਵਾ ਕਰੋ, ਪਰੰਤੂ ਹੇ ਠਾਕਰ! ਜੇਕਰ ਤੇਰੇ ਚਿਤ ਬੀਚ ਮੇਰੀ ਸੇਵਾ ਭਾਇ ਜਾਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਹੇ ਮਾਲਕ! ਜੇ ਤੈਨੂੰ ਚੰਗਾ ਲੱਗੇ, ਤਾਂ ਮੈਂ ਤੇਰੀ ਸੇਵਾ-ਭਗਤੀ ਕਰ ਕੇ ਤੇਰੇ ਚਰਨ ਧੋਂਦਾ ਰਹਾਂ (ਭਾਵ, ਹਉਮੈ ਤਿਆਗ ਕੇ ਤੇਰੇ ਦਰ ਤੇ ਡਿੱਗਾ ਰਹਾਂ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਖਾਰਉ = ਪਖਾਰਉਂ, ਮੈਂ ਧੋਵਾਂ। ਕਰਿ = ਕਰ ਕੇ। ਭਾਵੈ = ਚੰਗਾ ਲੱਗੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lavaría Tus Pies y Te serviría si me lo permitieras, oh Maestro;"