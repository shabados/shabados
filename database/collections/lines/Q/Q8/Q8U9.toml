data = "ਪੁੰਨ ਦਾਨ ਦਿਨ ਕਰਤ ਬਿਤਏ ॥੧॥"
page = 60

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When he went to Triveni (Prayag), he passed his days in act of charity.1."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤਾਂ ਉਥੇ) ਪੁੰਨ-ਦਾਨ ਕਰਦਿਆਂ ਕਈ ਦਿਨ ਬਿਤਾ ਦਿੱਤੇ ॥੧॥"