[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਜੋਗੀ ਕੀ ਨਗਰੀ ਸਭੁ ਕੋ ਵਸੈ; ਭੇਖੀ. ਜੋਗੁ ਨ ਹੋਇ ॥"
page = 556
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In that Yogi's body hamlet all the virtues abide. Through religious garb one attains not the True Yoga."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਯੋਗੀ ਦੇ ਦੇਹ-ਰੂਪੀ ਪਿੰਡ ਵਿੱਚ ਸਾਰੀਆਂ ਨੇਕੀਆਂ ਵੱਸਦੀਆਂ ਹਨ। ਧਾਰਮਿਕ ਪਾਖੰਡ ਰਾਹੀਂ ਸੱਚਾ ਯੋਗ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the body-village of that Yogi are all blessings; this Yoga is not obtained by outward show."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਜੋਗੀ ਕੀ ਦੇਹ ਰੂਪੁ ਨਗਰੀ ਮੇਂ ਸਭ ਕੋਇ, ਭਾਵ ਸਭੀ ਸੁਭ ਗੁਨ ਆਇ ਬਸਤੇ ਹੈਂ ਅਰੁ ਭੇਖੋਂ ਕੇ ਧਾਰਨੇ ਮਾਤ੍ਰ ਸੇ ਜੋਗੁ ਨਹੀਂ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਜੋਗੀ ਦੇ ਸਰੀਰ (ਰੂਪ) ਨਗਰ ਵਿਚ ਹਰੇਕ (ਗੁਣ) ਵੱਸਦਾ ਹੈ ਪਰ ਸਿਰਫ਼ ਭੇਖ ਕਰ ਕੇ ਜੋਗੀ ਬਨਣ ਵਾਲਾ ਪ੍ਰਭੂ-ਮੇਲ ਨਹੀਂ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En él están todos los Tesoros, pero con una actitud pretenciosa uno no logra el Estado de Verdadera Yoga."