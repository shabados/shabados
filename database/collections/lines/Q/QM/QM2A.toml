[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਇਸੁ ਦੁਸਮਨੁ; ਨਾ ਇਸੁ ਮੀਤੁ ॥"
page = 868
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He has no enemy, nor has He any friend."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਕੋਈ ਵੈਰੀ ਨਹੀਂ, ਨਾਂ ਹੀ ਉਸ ਦਾ ਕੋਈ ਮਿੱਤਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has no enemy; He has no friend."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਹੀਂ ਇਸ ਕਾ ਕੋਈ ਦੁਸਮਨ ਔ ਕੋਈ ਇਸ ਕਾ ਮੀਤ ਭੀ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਹ ਇਸ ਦਾ ਕੋਈ ਵੈਰੀ ਹੈ ਨਾਹ ਮਿੱਤਰ ਹੈ (ਕਿਉਂਕਿ ਇਸ ਦੇ ਬਰਾਬਰ ਦਾ ਕੋਈ ਨਹੀਂ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no es amiga de nadie ni se aparta de nadie."