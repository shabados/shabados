[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੁਕਮੁ ਪਛਾਣੈ ਖਸਮ ਕਾ; ਤਾ ਸਚੁ ਪਾਵੈ ਕੋਇ ॥"
page = 1244
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If one realises the Master's will, then alone can come one obtain truth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਜੀਵ ਮਾਲਕ ਦੀ ਰਜ਼ਾ ਨੂੰ ਅਨੁਭਵ ਕਰ ਲਵੇ ਕੇਵਲ ਤਦ ਹੀ ਕੋਈ ਜਣਾ ਸੱਚ ਨੂੰ ਪਾ ਸਕਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Only by realizing the Hukam of His Command, is Truth obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਤਿਸ (ਖਸਮ) ਪਤੀ ਕੇ ਹੁਕਮ ਕੋ ਕੋਈ ਪਛਾਣ ਲੇਵੇ ਤੋ (ਸਚੁ) ਸੁਖ ਕੋ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਜੀਵ ਖਸਮ ਦਾ ਹੁਕਮ ਪਛਾਣਦਾ ਹੈ ਤਾਂ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਨੂੰ ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੁ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ (ਖਸਮ)। ਕੋਇ = ਕੋਈ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo entendiendo el Jukam de Su Voluntad, la Verdad es obtenida."