[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਗੁਨੁ ਆਪਿ; ਸਰਗੁਨੁ ਭੀ ਓਹੀ ॥"
page = 287
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself is the Absolute Lord and verily He is the Related One,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਖੁਦ ਨਿਰਸੰਬੰਧਤ ਸੁਆਮੀ ਹੈ ਅਤੇ ਉਹ ਹੀ ਨਿਸਚਿਤ ਸੰਬੰਧਤ ਪੁਰਖ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is absolute and unrelated; He Himself is also involved and related."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਿਰਗੁਣ ਰੂਪ ਭੀ ਆਪ ਹੈ ਔ ਸਰਗੁਨ ਰੂਪ ਭੀ ਵਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪ ਮਾਇਆ ਦੇ ਤਿੰਨਾਂ ਗੁਣਾਂ ਤੋਂ ਵੱਖਰਾ ਹੈ, ਤ੍ਰਿਗੁਣੀ ਸੰਸਾਰ ਦਾ ਰੂਪ ਭੀ ਆਪ ਹੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਗੁਨੁ = ਮਾਇਆ ਦੇ ਤਿੰਨਾਂ ਗੁਣਾਂ ਤੋਂ ਵੱਖਰਾ। ਸਰਗੁਨੁ = ਮਾਇਆ ਦੇ ਤਿੰਨ ਗੁਣਾਂ ਦੇ ਰੂਪ ਵਾਲਾ, ਸਾਰਾ ਦ੍ਰਿਸ਼ਟਮਾਨ ਜਗਤ-ਰੂਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es Absoluto y también Relativo;"