[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਮਹਿ. ਜੀਉ ਜੀਉ ਹੈ ਸੋਈ; ਘਟਿ ਘਟਿ ਰਹਿਆ ਸਮਾਈ ॥"
page = 1273
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the Lord is the life within all the lives and is pervading all the hearts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ ਸਮੂਹ ਜਿੰਦਗੀਆਂ ਅੰਦਰ ਦੀ ਜਿੰਦ-ਜਾਨ ਹੈ ਅਤੇ ਸਾਰਿਆਂ ਦਿਲਾਂ ਅੰਦਰ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the life of the soul in each and every soul; He permeates and pervades each and every heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭੀ ਜੀਵੋਂ ਮੇਂ (ਜੀਉ) ਸਤਾ ਰੂਪ ਸੋਈ ਹੈ ਔਰ (ਘਟਿ ਘਟਿ) ਸਰਬ ਸਰੀਰੋਂ ਮੇਂ ਬ੍ਯਾਪਕ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰੇਕ ਜੀਵ ਵਿਚ ਪ੍ਰਭੂ ਦੀ ਦਿੱਤੀ ਜਿੰਦ ਰੁਮਕ ਰਹੀ ਹੈ, ਉਹ ਪ੍ਰਭੂ ਆਪ ਹੀ ਹਰੇਕ ਦੀ ਜਿੰਦ (ਆਸਰਾ) ਹੈ। ਪ੍ਰਭੂ ਹਰੇਕ ਸਰੀਰ ਵਿਚ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ella es la Vida del Alma en cada uno y prevalece compenetrando todos los corazones."