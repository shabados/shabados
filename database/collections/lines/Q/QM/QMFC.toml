[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਰਮੁ ਭੁਲਾਵਾ ਮਿਟਿ ਗਇਆ; ਪ੍ਰਭ ਪੇਖਤ ਨੇਤ ॥੩॥"
page = 810
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His doubt and misgiving are shattered and he ever sees the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਸੰਦੇਹ ਅਤੇ ਭੁਲੇਖਾ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ ਅਤੇ ਉਹ ਸਦਾ ਹੀ ਸੁਆਮੀ ਨੂੰ ਵੇਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His doubts and misgivings are dispelled, and he sees God everywhere. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨੋਂ ਕਾ ਭਰਮ ਜੰਨ ਭੁਲਾਵਾ ਮਿਟ ਗ੍ਯਾ ਹੈ, ਕ੍ਯੋਂਕਿ ਤਿਸ ਪ੍ਰਭੂ ਕੌ ਅਪਨੇ ਨੇਤ੍ਰੋਂ ਸੇ ਤਿਨੋਂ ਨੇ ਦੇਖ ਲੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਾਧ ਸੰਗਤਿ ਦੀ ਬਰਕਤਿ ਨਾਲ ਹਰ ਥਾਂ) ਅੱਖਾਂ ਨਾਲ ਪਰਮਾਤਮਾ ਦਾ ਦਰਸ਼ਨ ਕਰ ਕੇ ਉਸ ਮਨੁੱਖ ਦੀ ਭਟਕਣਾ ਮੁੱਕ ਜਾਂਦੀ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਰਮੁ = ਭਟਕਣਾ। ਨੇਤ = ਨੇਤ੍ਰੀ, ਅੱਖਾਂ ਨਾਲ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sus falsas ilusiones se desvanecen, pues él puede ver al Señor con sus propios ojos.  (3)"