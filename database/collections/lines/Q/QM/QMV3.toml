[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਤਿਹ ਮਤਿ ਪ੍ਰਗਟੀ ਆਈ ॥੪੩॥"
page = 259
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, his intellect becomes enlightened."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਉਸ ਦੀ ਬੁੱਧੀ ਪ੍ਰਕਾਸ਼ਵਾਨ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- O Nanak, their intellect is enlightened. ||43||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪੁਰਸ ਕੀ ਬੁੱਧੀ ਪ੍ਰਗਟ ਹੋਇ ਆਈ ਹੈ॥੪੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹਨਾਂ ਦੀ ਮਤਿ ਉੱਜਲ ਹੋ ਜਾਂਦੀ ਹੈ (ਤੇ ਉਹ ਬੰਧਨਾਂ ਤੋਂ ਬਚ ਨਿਕਲਦੇ ਹਨ) ॥੪੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "su mente despierta y se ilumina.(43)"