[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਗਮ ਅਗੋਚਰ ਵੇਪਰਵਾਹੇ ॥"
page = 1061
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Inaccessible, Incomprehensible, and care-free Lord!"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਹੁੰਚ ਤੋਂ ਪਰੇ, ਅਗਾਧ ਤੇ ਮੁਛੰਦਗੀ-ਰਹਿਤ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are Inaccessible, Unfathomable and Self-Sufficient."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਗਮ ਅਗੋਚਰ! ਵੇ ਪਰਵਾਹ ਰੂਪ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਪਹੁੰਚ! ਹੇ ਅਗੋਚਰ! ਹੇ ਵੇ-ਪਰਵਾਹ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਮ = ਹੇ ਅਪਹੁੰਚ! ਅਗੋਚਰ = ਹੇ ਅਗੋਚਰ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Imperceptible y Autosuficiente."