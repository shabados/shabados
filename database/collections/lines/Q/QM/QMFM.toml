data = "ਧਰਮ ਰਾਜ ਆਗ︀ਯਾ ਮੁਹਿ ਦਈ ॥੮੭॥"
page = 909

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Listen, when I had died, it was done with the consent of the Lord of Righteousness.’(87)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਧਰਮਰਾਜ ਨੇ ਮੈਨੂੰ ਆਗਿਆ ਦਿੱਤੀ ॥੮੭॥"