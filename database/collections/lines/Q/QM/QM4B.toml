[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੋਇਲ ਅੰਬ ਪਰੀਤਿ ਹੈ, ਮਿਲ ਬੋਲ ਸਰੋਤੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The nightingale and mango tree bear love for each other, and hence it sings thereupon."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕੋਇਲ ਦੀ ਅੰਬ ਨਾਲ ਪ੍ਰੀਤਿ ਹੈ, ਮਿੱਠੇ ਮਿੱਠੇ ਬੋਲਾਂ ਦੀ ਸੁਰ ਕਢਦੀ ਹੈ।"