[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਾਰੇ ਸੱਚ ਦੇ ਉਪਾਸ਼ਕ ਉਸ ਦੀ ਆਗਿਆ ਦਾ ਪਾਲਣ ਕਰਦੇ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਪਜ਼ੀਰਾਇ ਹੁਕਮਸ਼ ਹਮਾਂ ਰਾਸਤਾਂ ॥੪੮॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, all the connoisseurs of truth delightfully accept and follow his command. (48)"