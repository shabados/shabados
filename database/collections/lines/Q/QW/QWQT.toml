[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਖੋਲਿ ਕੈ ਦੁਆਰਾ ਕਿਵਾਰ ਸਭੈ; ਨਿਕਸੀ ਅਸੁਰਾਰਿ ਕੀ ਸੈਨ ਚਲੀ ॥"
page = 81

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Opening all the gates and portals of the citadel, the army of Indra, the enemy of demons marched outside.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਦਰਵਾਜ਼ਿਆਂ ਦੇ ਬੂਹੇ ਖੋਲ੍ਹ ਕੇ ਦੇਵਤਿਆਂ ਦੀ ਸੈਨਾ ਨਿਕਲ ਕੇ ਚਲ ਪਈ।"