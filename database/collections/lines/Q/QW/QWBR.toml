[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਜਗਤੁ ਉਪਾਇਦਾ ਮੇਰੇ ਗੋਵਿਦਾ; ਹਰਿ ਆਪਿ ਖੇਲੈ. ਬਹੁ ਰੰਗੀ ਜੀਉ ॥"
page = 174
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O My Lord God of himself creates the world and Himself plays in many a way."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸੁਆਮੀ! ਵਾਹਿਗੁਰੂ ਖੁਦ ਸ੍ਰਿਸ਼ਟੀ ਨੂੰ ਸਾਜਦਾ ਹੈ, ਅਤੇ ਖੁਦ ਹੀ ਅਨੇਕਾ ਢੰਗ ਨਾਲ ਖੇਡਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself created the world, O my Lord of the Universe; the Lord Himself plays in so many ways!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹਰੀ ਆਪ ਹੀ ਜਗਤ ਕੋ ਉਤਪਤਿ ਕਰਤਾ ਹੈ ਔਰ ਬਹੁਤ ਰੰਗੋਂ ਮੇਂ ਆਪ ਹੀ ਖੇਲਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰਿ-ਪ੍ਰਭੂ ਆਪ ਹੀ ਜਗਤ ਪੈਦਾ ਕਰਦਾ ਹੈ, ਹਰੀ ਆਪ ਹੀ ਅਨੇਕਾਂ ਰੰਗਾਂ ਵਿਚ (ਜਗਤ ਦਾ ਖੇਲ) ਖੇਲ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਹੁ ਰੰਗੀ = ਅਨੇਕਾਂ ਰੰਗਾਂ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, de Sí Mismo, creó el Universo, y Él interviene en ese teatro de muchas, muchas formas."