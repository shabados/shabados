[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਿ ਸਿਮਰਿ ਦਇਆਲਾ ॥"
page = 625
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "On remembering and contemplating on the Merciful Master,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿਹਰਬਾਨ ਮਾਲਕ ਦਾ ਭਜਨ ਤੇ ਆਰਾਧਨ ਕਰਨ ਦੁਆਰਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remembering, remembering the Merciful Lord in meditation,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਿਆਲ ਵਾਹਿਗੁਰੂ! ਤੇਰੇ ਕੋ ਸਿਮਰ ਸਿਮਰ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਦਇਆ ਦੇ ਘਰ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰ ਸਿਮਰ ਕੇ (ਸਿਮਰਨ ਕਰਨ ਵਾਲੇ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਇਆਲਾ = ਦਇਆ-ਦਾ-ਘਰ ਪ੍ਰਭੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Habita en el Guru Perfecto, oh hombre,"