[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਈ ਆਗਿਆ; ਪਿਰਹੁ ਬੁਲਾਇਆ ॥"
page = 1073
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The order arrives and the groom is called back."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੁਕਮ ਆ ਜਾਂਦਾ ਹੈ ਅਤੇ ਪਤੀ ਵਾਪਸ ਬੁਲਾ ਲਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Order comes, and the husband-soul is called."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਆਗ੍ਯਾ ਆਈ ਤਬ (ਪਿਰਹੁ) ਪਤੀ ਬੁਲਾਇ ਲੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਪਤੀ-ਪਰਮਾਤਮਾ ਵਲੋਂ ਹੁਕਮ ਆਉਂਦਾ ਹੈ, ਜਦੋਂ ਉਹ ਸੱਦਾ ਭੇਜਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਗਿਆ ਪਿਰਹੁ = ਪ੍ਰਭੂ-ਪਤੀ ਵਲੋਂ ਹੁਕਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando tal es la Voluntad del Señor, llama de regreso al marido,"