[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਿਹਮਾਣੀ ਮਿਹਮਾਣੁ, ਮਜਲਸਿ ਆਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He understands that he has come to the assembly of this world as a guest."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਸੰਸਾਰ ਰੂਪੀ) ਮਿਹਮਾਣੀ ਵਿਚ (ਐਉਂ) ਹਨ (ਜਿਕੂੰ) ਪਰਾਹੁਣਾ ਮਜਲਸ ਵਿਚ ਆਯਾ ਹੈ।"