[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਕੀਨੑੈ; ਹੋਤ ਬਿਕਾਰ ॥"
page = 1193
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The goods amassing which sins well up;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਪਦਾਰਥਾਂ ਨੂੰ ਇਕੱਤਰ ਕੀਤਿਆਂ ਪਾਪ ਉਤਪੰਨ ਹੁੰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He gathers up that which brings corruption;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਸੰਬੰਧੀਓਂ ਕੇ ਪ੍ਰਸੰਨ ਕਰਨੇ ਹੇਤ ਇਸ ਜੀਵ ਤੇ ਬਿਕਾਰ ਹੋਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਪਦਾਰਥਾਂ ਦੇ ਇਕੱਠੇ ਕਰਦਿਆਂ (ਮਨੁੱਖ ਦੇ ਮਨ ਦੇ ਅਨੇਕਾਂ) ਵਿਕਾਰ ਪੈਦਾ ਹੁੰਦੇ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੈ ਕੀਨ੍ਹ੍ਹੈ = ਜਿਨ੍ਹਾਂ ਪਦਾਰਥਾਂ ਦੇ ਇਕੱਠੇ ਕੀਤਿਆਂ। ਹੋਤ = (ਪੈਦਾ) ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la traición a su Conciencia. Atesorar bienes de la tierra,"