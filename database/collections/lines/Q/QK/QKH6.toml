[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਰਪਤਿ ਆਏ ਪਾਚ ਬਰ; ਕੀਨੋ ਤਿਨ ਕੋ ਨਾਸ ॥੧੩੪੨॥"
page = 431

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Subhat Singh standing firmly in the battlefield waged a violent war and he destroyed all the five kings who had come there.1342."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਹੜੇ) ਪੰਜ ਰਾਜੇ ਆਏ ਸਨ, ਉਨ੍ਹਾਂ ਨੂੰ ਨਸ਼ਟ ਕਰ ਦਿੱਤਾ ॥੧੩੪੨॥"