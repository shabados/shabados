[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਕਉ; ਗੁਰਿ ਕੀਓ ਪ੍ਰਗਾਸਾ ॥੮॥੨॥੫॥"
page = 1157
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, the slave, the Guru has illumined."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੋਲੇ ਨਾਨਕ ਨੂੰ ਗੁਰਦੇਵ ਜੀ ਨੇ ਰੌਸ਼ਨ ਕਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru has blessed Nanak with enlightenment. ||8||2||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹਮ ਕੋ ਗੁਰੋਂ ਨੇ ਗ੍ਯਾਨ ਰੂਪ ਪ੍ਰਕਾਸੁ ਕੀਆ ਹੈ॥੮॥੨॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੈਨੂੰ) ਨਾਨਕ ਨੂੰ ਗੁਰੂ ਨੇ (ਅਜਿਹਾ ਆਤਮਕ) ਚਾਨਣ ਬਖ਼ਸ਼ਿਆ ਹੈ ॥੮॥੨॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਗੁਰਿ = ਗੁਰੂ ਨੇ। ਪ੍ਰਗਾਸਾ = ਆਤਮਕ ਚਾਨਣ ॥੮॥੨॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así es como el Guru ha iluminado mi mente. (8-2-5)"