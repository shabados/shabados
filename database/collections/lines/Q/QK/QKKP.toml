[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੁਕਮੁ ਚਲਾਇ; ਰਹਿਆ ਭਰਪੂਰੇ ॥"
page = 1042
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Pervading God is driving all in His will."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਆਪਕ ਵਾਹਿਗੁਰੂ ਸਾਰਿਆਂ ਨੂੰ ਆਪਣੀ ਰਜ਼ਾ ਅੰਦਰ ਟੋਰ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The all-pervading Lord orchestrates all through His Hukam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੁਕਮ ਕੋ ਚਲਾਇਕੈ ਭਰਪੂਰ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ (ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ ਵਿਚ ਆਪਣਾ) ਹੁਕਮ ਵਰਤਾ ਰਿਹਾ ਹੈ, ਤੇ ਸਾਰੀ ਹੀ ਸ੍ਰਿਸ਼ਟੀ ਵਿਚ ਪੂਰਨ ਤੌਰ ਤੇ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਰਪੂਰ = ਪੂਰਨ ਤੌਰ ਤੇ ਵਿਆਪਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor prevalece en todo y conduce a todos así como es Su Voluntad."