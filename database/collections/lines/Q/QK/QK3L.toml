[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਸੁ ਛੋਡਿ; ਪਰਦੇਸਹਿ ਧਾਇਆ ॥"
page = 1348
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Leaving thy country, thou wander abroad."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮੁਲਕ ਨੂੰ ਛੱਡ ਤੂੰ ਪਰਾਏ ਦੇਸ਼ ਅੰਦਰ ਭਟਕਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Leaving your own country, you wander in foreign lands."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਦੇਸ ਕੋ ਛੋਡ ਕਰ ਕੇ ਪਰਦੇਸੋਂ ਮੇਂ ਭੀ ਧਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਵਤਨ ਛੱਡ ਕੇ ਹੋਰ ਹੋਰ ਦੇਸਾਂ ਵਿਚ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛੋਡਿ = ਛੱਡ ਕੇ। ਧਾਇਆ = ਦੌੜਦਾ ਫਿਰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "abandonas tu hogar y dejando tu propio país vagas por tierras extrañas,"