[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਜੰਤ; ਤੇਰੇ ਆਧਾਰਿ ॥"
page = 1183
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Men and other beings have Thine support."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਨਸਾਨਾਂ ਤੇ ਹੋਰ ਜੀਵਾਂ ਨੂੰ ਤੇਰਾ ਤੇਰਾ ਹੀ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All beings and creatures take Your Support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਸਥੂਲ ਸੂਖਮ ਜੀਵ ਸਭ ਤੇਰੇ ਆਸਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਸਾਰੇ ਜੀਅ ਜੰਤ ਤੇਰੇ ਹੀ ਆਸਰੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਧਾਰਿ = ਆਸਰੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todas las criaturas se apoyan sólo en Ti,"