data = "ਉਹ ਉਸ (ਰਾਜ ਕੁਮਾਰੀ) ਨੂੰ ਆਪ ਨਾਲ ਲੈ ਕੇ (ਰਾਜ ਸਭਾ ਵਿਚ ਆਈ)।"