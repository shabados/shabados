[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਿ ਕਬੀਰ. ਰੰਗਿ ਰਾਤਾ ॥"
page = 655
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir, I am imbued with the Lord's love,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਫੁਰਮਾਉਂਦੇ ਹਨ, ਮੈਂ ਪ੍ਰਭੂ ਦੀ ਪ੍ਰੀਤ ਨਾਲ ਰੰਗਿਆ ਗਿਆ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, I am imbued with the Lord's Love;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕਬੀਰ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਜਬ ਮੇਰਾ ਮਨ ਤਿਸ ਕੇ ਪ੍ਰੇਮ ਮੇਂ ਰਾਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ- ਉਹ ਪ੍ਰਭੂ ਦੇ ਪਿਆਰ ਵਿਚ ਰੰਗਿਆ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੰਗਿ = ਪਿਆਰ ਵਿਚ। ਰਾਤਾ = ਰੰਗਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, ahora estoy entonado en el Amor de Dios;"