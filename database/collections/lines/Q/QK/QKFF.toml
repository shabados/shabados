[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਗਨ ਭਇਆ ਤੇ; ਸੋ ਸਚੁ ਪਾਵੈ ॥੩੧॥"
page = 342
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who obtain the True Lord, get immersed in delight."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੱਚੇ ਸੁਆਮੀ ਨੂੰ ਪਾ ਲੈਂਦੇ ਹਨ, ਉਹ ਖੁਸ਼ੀ ਅੰਦਰ ਭਿੱਜ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who obtain the True Lord are immersed in delight. ||31||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਪਰਸੇਸ਼੍ਵਰ ਮੇਂ ਮਸਤ ਹੋਣੇ ਸੇ ਜੀਵ ਸੋ ਆਤਮ (ਸਚੁ) ਸੁਖ ਕੋ ਪਾਵਤਾ ਹੈ॥੩੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ ਪ੍ਰਭੂ-ਚਰਨਾਂ ਵਿਚ ਜੁੜਨ ਦੀ ਬਰਕਤ ਨਾਲ) ਮਨ (ਪ੍ਰਭੂ ਵਿਚ) ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ, ਅਤੇ ਉਸ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਨੂੰ ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ ॥੩੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਗਨ = ਮਸਤ। ਸਚੁ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਪ੍ਰਭੂ। ਪਾਵੈ = ਲੱਭ ਲੈਂਦਾ ਹੈ। ਤੈ = ਅਤੇ ॥੩੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque sólo aquél que está entonado en el Señor conoce la Verdad.(31)"