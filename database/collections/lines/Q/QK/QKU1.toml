data = "ਕਹੂੰ ਬ੍ਰਹਮ ਬਿਦਿਆ ਪੜੈ ਬ︀ਯੋਮ ਬਾਨੀ ॥"
page = 151

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere Theology and somewhere astronomy was being studied"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ ਬ੍ਰਹਮ-ਵਿਦਿਆ (ਵੇਦਾਂਤ-ਸ਼ਾਸਤ੍ਰ) ਨੂੰ, ਕਿਤੇ ਵਿਓਮ-ਵਿਦਿਆ (ਖਗੋਲ ਸ਼ਾਸਤ੍ਰ) ਨੂੰ ਪੜ੍ਹਦੇ ਸਨ।"