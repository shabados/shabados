[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭਿ; ਅਪਣਾ ਬਿਰਦੁ ਸਮਾਰਿਆ ॥"
page = 72
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Master has honoured His creed of protecting His slave."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਗੋਲੇ ਦੀ ਰਖਿਆ ਕਰਨ ਦੇ ਧਰਮ ਨੂੰ ਮਾਲਕ ਨੇ ਨਿਬਾਹਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "this is God's Own Nature."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਤੈਨੇ ਆਪਣਾ (ਬਿਰਦੁ) ਧਰਮ ਵਾ ਪ੍ਰਣ ਸੰਭਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ ਤਾਂ ਸਿਰਫ਼ ਆਪਣਾ ਮੁੱਢ-ਕਦੀਮਾਂ ਦਾ ਸੁਭਾਉ ਹੀ ਚੇਤੇ ਰੱਖਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਮਾਰਿਆ = ਚੇਤੇ ਰੱਖਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como es la Naturaleza de Su Ser,"