[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਪਾਥਰ ਕੀ; ਪਾਂਈ ਪਾਇ ॥"
page = 1160
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who falls at the feet of the stone;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਪੰਥਰ ਦੇ ਪੈਰੀ ਪੈਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who fall at the feet of a stone god"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪਥਰ ਕੀ ਪੈਰੀ ਪੜਤਾ ਹੈ ਅਰਥਾਤ ਮਥਾ ਟੇਕਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਪੱਥਰ (ਦੀ ਮੂਰਤੀ) ਦੇ ਪੈਰੀਂ ਪੈਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਂਈ = ਪੈਰੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que se postra ante una estatua de piedra, pensando que es Dios,"