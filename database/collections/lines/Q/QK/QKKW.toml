[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰੇਮ ਭਗਤਿ; ਜਿਸ ਕੈ ਮਨਿ ਲਾਗੀ ॥"
page = 109
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, whose mind is attached with Lord's affectionate meditation,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਚਿੱਤ ਪ੍ਰਭੂ ਦੇ ਪਿਆਰੇ ਸਿਮਰਨ ਨਾਲ ਜੁੜਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One whose mind is dedicated to loving devotional worship"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਮਨ ਮੇਂ ਪ੍ਰੇਮਾ ਭਗਤੀ ਲਾਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਮਨ ਵਿਚ ਪਰਮਾਤਮਾ ਦੀ ਪਿਆਰ-ਭਰੀ ਭਗਤੀ (ਦੀ ਲਿਵ) ਲੱਗ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En la mente de aquél en quien el Amor y la Devoción del Señor están,"