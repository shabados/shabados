[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਹੁ ਸੋਹਿਲਾ; ਸਬਦੁ ਸੁਹਾਵਾ ॥"
page = 919
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This beauteous Gurbani is all praise of the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੁੰਦਰ ਗੁਰਬਾਣੀ ਸੁਆਮੀ ਦੀ ਸਿਫ਼ਤ-ਸਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This song of praise is the Shabad, the most beautiful Word of God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ (ਸਬਦੁ) ਗੁਰ ਉਪਦੇਸ ਰੂਪ ਜਸੁ ਬਹੁਤ ਸੁੰਦਰ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਤਿਗੁਰੂ ਦਾ) ਇਹ ਸੋਹਣਾ ਸ਼ਬਦ (ਆਤਮਕ) ਆਨੰਦ ਦੇਣ ਵਾਲਾ ਗੀਤ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਹਿਲਾ = ਖ਼ੁਸ਼ੀ ਦਾ ਗੀਤ, ਆਨੰਦ ਦੇਣ ਵਾਲਾ ਗੀਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Alabanza Verdadera del Señor es Palabra de Inefable Belleza;"