[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਭਾਤਿ ਕਰਿ; ਕਰਹਿ ਉਪਾਇਓ ॥"
page = 250
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Creator has created the creation of all sorts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਚਣਹਾਰ ਨੇ ਰਚਨਾ ਸਮੂਹ ਪਰਕਾਰ ਦੀ ਰਚੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator has created the creation of all sorts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਗਲ ਪ੍ਰਕਾਰ ਕਰ ਤਿਸ ਨੇ ਆਪ ਜਗਤ ਕੋ ਉਪਾਵਣਾ ਕੀਆ ਹੈ॥☬ਜੇ ਕਹੇ ਜੀਵਾਂ ਕੋ ਜਨਮ ਮਰਣ ਕੈਸੇ ਹੂਆ? ਸੋ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਸਾਰੀਆਂ (ਅਨੇਕਾਂ) ਕਿਸਮਾਂ ਬਣਾ ਕੇ ਜਗਤ-ਉਤਪੱਤੀ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਪਾਇਓ = ਉਤਪੱਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así creó Él la creación de diferentes formas,"