[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਚਰਨ ਕਮਲ ਸਰਨਾਇ ਮਨਾ ॥"
page = 899
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, seek thou the refuge of the Lord's lotus feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਤੂੰ ਪ੍ਰਭੂ ਦੇ ਕੰਵਲ ਪੈਰਾਂ ਦੀ ਪਨਾਹ ਲੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Seek the Sanctuary of the Lord's lotus feet, O my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਹਰੀ ਕੇ ਚਰਨ ਕਮਲੋਂ ਕੀ ਸਰਨ ਪੜ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਮਨ! ਪ੍ਰਭੂ ਦੇ ਸੋਹਣੇ ਚਰਨਾਂ ਦੀ ਸਰਨ ਪਿਆ ਰਹੁ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਰਨ ਕਮਲ = ਕੌਲ-ਫੁੱਲ ਵਰਗੇ ਸੋਹਣੇ ਚਰਨ। ਮਨਾ = ਹੇ ਮਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente, busca el Refugio de los Pies del Señor y contempla Su Nombre que nos da siempre compañía."