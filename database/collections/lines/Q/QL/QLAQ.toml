[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੁ ਜਗੁ ਜਨਮਿਆ; ਦੂਜੈ ਭਾਇ ॥"
page = 161
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This world is born out of love of mammon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਜਹਾਨ ਮਾਇਆ ਦੀ ਮਮਤਾ ਵਿਚੋਂ ਪੈਦਾ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This world is born out of the love of duality."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਇਹੁ ਸੰਸਾਰ ਦ੍ਵੈਤ ਭਾਵ ਕਰ ਕੇ ਹੀ ਉਤਪਿਤ ਭਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦੀ ਭਟਕਣਾ ਵਿਚ ਹੀ ਜੰਮਦਾ ਹੈ ਤੇ ਮਾਇਆ ਦੀ ਭਟਕਣਾ ਵਿਚ ਹੀ ਮਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਜੈ ਭਾਇ = ਹੋਰ ਹੋਰ ਪਿਆਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Este mundo ha nacido en la dualidad."