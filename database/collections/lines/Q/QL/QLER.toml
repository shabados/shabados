[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲੋਭ ਮੋਹ ਤੂਟੇ; ਭ੍ਰਮ ਸੰਗਾ ॥੩॥"
page = 1206
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and my association with avarice, worldly love and doubt is surrendered."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਲਾਲਚ, ਸੰਸਾਰੀ ਮਮਤਾ ਅਤੇ ਸੰਦੇਹਿ ਨਾਲੋ ਮੇਰੀ ਸੰਗਤ ਟੁੱਟ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Greed and attachment are gone, along with doubt. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭ੍ਰਮ ਕੇ ਸਹਿਤ ਹੀ ਲੋਭ, ਮੋਹਾਦਿ ਟੂਟ ਗਏ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਲੋਭ ਮੋਹ ਭਟਕਣਾ ਦਾ ਸਾਥ (ਮੇਰੇ ਅੰਦਰੋਂ) ਮੁੱਕ ਗਿਆ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗਾ = ਸਾਥ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y de forma instantánea soy liberado de la lujuria, del apego y de la duda. (3)"