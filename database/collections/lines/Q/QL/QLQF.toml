[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈ. ਨਾਹੀ ਕਿਸੀ ਕਾ ਦੇਨਾ ॥੧॥"
page = 656
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I owe not any one, anything."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕਿਸੇ ਦਾ ਕੁਝ ਦੇਣਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I do not owe anyone anything. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਤੀਨ ਰਿਣ ਜੋ ਦੇਵਤਾ, ਪਿਤਰ, ਰਿਖੀਓਂ ਕੇ ਹੈਂ, ਇਨਮੈਂ ਸੇ ਮੈਨੇ ਕਿਸੀ ਕਾ ਕੁਛ ਰਿਣ ਨਹੀਂ ਦੇਣਾ ਹੈ। ਭਾਵ ਸੇ ਪੁਤ੍ਰ ਉਤਪਤੀ ਕਰਨਾ ਔਰ ਜੱਗ ਕਰਨਾ ਪੁਨਾ ਵਿਦ੍ਯਾ ਪੜ੍ਹਨੀ ਇਹ ਤੀਨੋਂ ਰਿਣ ਸਕਾਮ ਕਰਮੀਓਂ ਪਰ ਹੈਂ, ਪ੍ਰਮੇਸ੍ਵਰ ਕੇ ਪ੍ਰਾਯਣ ਹੋਨੇ ਵਾਲਿਓਂ ਪਰ ਨਹੀਂ ਹੋਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਕਿ ਮੈਂ ਕਿਸੇ ਦਾ ਮੁਥਾਜ ਨਾਹ ਹੋਵਾਂ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero no siento que por eso tengo algún mérito especial. (1)"