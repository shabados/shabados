[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਕਿਛੁ ਕਰੇ; ਸੁ ਆਪੇ ਆਪੈ ॥"
page = 107
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever He does, He does that all by Himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਝ ਉਹ ਕਰਦਾ ਹੈ, ਉਹਨੂੰ ਉਹ ਖੁਦ-ਬ-ਖੁਦ ਹੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever He does, He does all by Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕਿਛੁ ਕਰਤਾ ਹੈ, ਸੋ ਆਪ ਹੀ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੂੰ ਇਹ ਨਿਸਚਾ ਹੋ ਜਾਂਦਾ ਹੈ ਕਿ) ਜੋ ਕੁਝ ਪ੍ਰਭੂ ਕਰਦਾ ਹੈ ਆਪ ਹੀ ਆਪਣੇ ਆਪ ਤੋਂ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੇ = ਆਪ ਹੀ। ਆਪੇ = ਆਪੇ ਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él hace Su Voluntad;"