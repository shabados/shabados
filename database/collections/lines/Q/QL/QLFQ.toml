[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਬ ਹੀ ਰਾਜਾ; ਕਬ ਮੰਗਨਹਾਰੁ ॥"
page = 1192
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sometimes one is a king and sometimes a beggar."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਦੇ ਬੰਦਾ ਪਾਤਿਸ਼ਾਹ ਹੁੰਦਾ ਹੈ ਅਤੇ ਕਦੇ ਮੰਗਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sometimes he is a king, and sometimes he is a beggar."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨੋਰਾਜ ਵਾ ਕਰਮਾਨੁਸਾਰ ਪ੍ਰਤਖ ਕਬੀ ਰਾਜਾ ਹੋ ਜਾਤਾ ਹੈ ਔਰ ਕਬੀ ਭਿਛਕ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਮ ਤੋਂ ਸੱਖਣਾ ਮਨੁੱਖ) ਚਾਹੇ ਕਦੇ ਰਾਜਾ ਹੈ ਚਾਹੇ ਮੰਗਤਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਬ ਹੀ = ਕਦੇ। ਮੰਗਨਹਾਰੁ = ਮੰਗਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así uno es un rey y después un pordiosero y,"