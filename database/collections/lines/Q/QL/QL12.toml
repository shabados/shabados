[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਿਤੜੇ ਲੂਲੇ ਪਿੰਗੁਲੇ; ਕਿਤੜੇ ਕੁੱਬੇ ਹੋਇ ਕੁੜਾਣੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many are suffering for being disabled, cripple and hunchback."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਿੰਨੇ ਲੂਲ੍ਹੇ, ਪਿੰਗੁਲੇ, ਕੁੱਬੇ ਤੇ ਲੱਕ ਦੋਹਰੇ ਵਾਲੇ ਹਨ,"