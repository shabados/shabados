[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧਸੰਗਿ ਰੰਗਿ; ਪ੍ਰਭੁ ਧਿਆਇਆ ॥"
page = 1299
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whosoever, associating with the saints, contemplates his Lord with love;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੋਈ, ਸਤਿਸੰਗਤ ਨਾਲ ਜੁੜ ਆਪਣੇ ਪ੍ਰਭੂ ਨੂੰ ਪਿਆਰ ਨਾਲ ਸਿਮਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Saadh Sangat, lovingly meditate on God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਸਾਧੋਂ ਕੇ ਸੰਗ ਕਰ (ਰੰਗਿ) ਪ੍ਰੇਮ ਕਰ ਕੇ ਪ੍ਰਭੂ ਕੋ ਧਿਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਮਨੁੱਖ) ਨੇ ਗੁਰੂ ਦੀ ਸੰਗਤ ਵਿਚ (ਟਿਕ ਕੇ) ਪਿਆਰ ਨਾਲ ਪਰਮਾਤਮਾ ਦਾ ਸਿਮਰਨ ਕੀਤਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੰਗਿ = ਪਿਆਰ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En la Saad Sangat medita con todo Amor en Dios,"