[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤ੍ਰੈ ਗੁਣ ਪੜਹਿ. ਹਰਿ ਏਕੁ, ਨ ਜਾਣਹਿ; ਬਿਨੁ ਬੂਝੇ. ਦੁਖੁ ਪਾਵਣਿਆ ॥੭॥"
page = 128
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "People read books related to three dispositions and know not the One Lord. Without understanding Him they suffer pain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲੋਕੀਂ ਤਿੰਨਾਂ ਸੁਭਾਵਾਂ ਨਾਲ ਸੰਬੰਧਤ ਪੁਸਤਕਾਂ ਵਾਚਦੇ ਹਨ ਅਤੇ ਇਕ ਪ੍ਰਭੂ ਨੂੰ ਨਹੀਂ ਜਾਣਦੇ। ਉਸ ਨੂੰ ਸਮਝਣ ਦੇ ਬਗੈਰ ਉਹ ਤਕਲੀਫ ਉਠਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They read of the three qualities, but they do not know the One Lord. Without understanding, they obtain only pain and suffering. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੀਨ ਗੁਣ ਰੂਪ ਮਾਇਆ ਵਾਸਤੇ ਬੇਦ ਪੜਤੇ ਹੂਏ ਏਕ ਰੂਪ ਹਰੀ ਕੋ ਨਹੀਂ ਜਾਨਤੇ, ਜਾਨੇ ਬਿਨਾ ਦੁਖ ਪਾਵਤੇ ਹੈਂ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ (ਇਹਨਾਂ ਧਰਮ-ਪੁਸਤਕਾਂ ਨੂੰ) ਤ੍ਰਿਗੁਣੀ ਮਾਇਆ (ਕਮਾਣ) ਦੀ ਖ਼ਾਤਰ ਪੜ੍ਹਦੇ ਹਨ, ਇੱਕ ਪਰਮਾਤਮਾ ਨਾਲ ਸਾਂਝ ਨਹੀਂ ਪਾਂਦੇ (ਧਰਮ-ਪੁਸਤਕਾਂ ਪੜ੍ਹਦੇ ਹੋਏ ਭੀ ਇਸ ਭੇਤ ਨੂੰ) ਸਮਝਣ ਤੋਂ ਬਿਨਾ ਦੁੱਖ (ਹੀ) ਪਾਂਦੇ ਰਹਿੰਦੇ ਹਨ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Caen dentro de los tres tipos de disposiciones sin conocer al Uno, y sin experiencia propia, siempre están afligidos. (7)"