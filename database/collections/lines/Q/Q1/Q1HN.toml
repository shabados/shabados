[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਰਸੁ ਚਾਖਿਆ; ਤਉ ਮਨੁ ਭੀਜਾ ॥"
page = 1345
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When he in-drinks the Lord's elixir, then his soul is imbued with it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਕੋਈ ਪ੍ਰਭੂ ਦਾ ਅੰਮ੍ਰਿਤ ਪਾਨ ਕਰਦਾ ਹੈ, ਤਦ ਉਸ ਦੀ ਆਤਮਾ ਪ੍ਰਸੰਨ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They taste the sublime essence of the Lord, and their minds are drenched with it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਤਿਨੋਂ ਨੇ ਹਰੀ ਨਾਮ ਰਸ ਕੋ ਚਾਖਿਆ ਹੈ ਤਬ ਤਿਨੋਂ ਕਾ ਮਨੁ ਤਿਸ ਨਾਮ ਮੇਂ ਭੀਜਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਮਨੁੱਖ (ਇਕ ਵਾਰੀ) ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਰਸ ਚੱਖ ਲੈਂਦਾ ਹੈ ਤਾਂ ਉਸ ਦਾ ਮਨ (ਸਦਾ ਲਈ ਉਸ ਰਸ ਵਿਚ) ਭਿੱਜ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y saborean la Sublime Esencia del Señor y sus mentes son filtradas en Ella."