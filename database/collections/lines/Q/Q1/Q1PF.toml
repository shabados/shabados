[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖਿ ਸਦਾ ਦੋਹਾਗਣੀ; ਦਰਿ ਖੜੀਆ ਬਿਲਲਾਹਿ ॥"
page = 428
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The perverse ever behave like discarded women and thy bewail standing at the door."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ (ਗੁਰੂ ਪ੍ਰਤੀਕੂਲ)) ਹਮੇਸ਼ਾਂ ਹੀ ਵਿਛੁੜੀਆਂ ਰਹਿੰਦੀਆਂ ਹਨ, ਅਤੇ ਬੂਹੇ ਤੇ ਖਲੋਤੀਆਂ ਊਹ ਵਿਰਲਾਪ ਕਰਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The self-willed manmukhs are forever forsaken brides; they cry out and bewail at the Lord's Gate."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੁਨਮੁਖੀਆ ਨਿਤ੍ਯ ਦੋਹਾਗਣੀ ਹੈ, ਜਮ ਕੇ ਦ੍ਵਾਰੇ ਪਰ ਖੜੀ ਬ੍ਰਲਾਪ ਕਰਤੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੀਆਂ ਜੀਵ-ਇਸਤ੍ਰੀਆਂ ਸਦਾ ਮੰਦ-ਭਾਗਣਾਂ ਰਹਿੰਦੀਆਂ ਹਨ ਉਹ ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ ਖਲੋਤੀਆਂ (ਭੀ) ਵਿਲਕਦੀਆਂ ਹੀ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਮੁਖਿ = ਆਪਣੇ ਮਨ ਦੇ ਪਿਛੇ ਤੁਰਨ ਵਾਲੀਆਂ। ਦਰਿ = ਹਰਿ-ਦਰ ਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En ego los hombres están siempre separados del Señor y se lamentan sin cesar en Su Puerta."