[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੇ ਨਾਮ ਕੇ ਬਿਆਪਾਰੀ ॥"
page = 1123
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have become a dealer in God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਵਣਜਾਰਾ ਹੋ ਗਿਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a trader in the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਨਾਂਮ ਕੇ ਜੋ ਵਪਾਰੀ ਸੰਤ ਜਨ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦਾ ਵਣਜ ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਆਪਾਰੀ = ਵਪਾਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me he convertido en el comerciante del Nombre del Señor, sí,"