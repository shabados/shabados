type = "primary"
data = "ਰਵਾ ਕਰਦ ਲਸ਼ਕਰ ਚੁ ਦਰੀਯਾਇ ਮੌਜ ॥੧੦੭॥"
page = 1421

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She led the army like the flowing river.(107)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਦਰਿਆ ਦੀਆਂ ਲਹਿਰਾਂ ਵਾਂਗ ਫ਼ੌਜ ਨੂੰ ਤੋਰ ਦਿੱਤਾ ॥੧੦੭॥"