[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ ਫਿਰਿ ਮਿਠਾ; ਪੇੜੈ ਪਾਇ ॥"
page = 1243
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If, even afterwards, they are blessed with the sweet Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਮਗਰੋਂ ਭੀ ਉਨ੍ਹਾਂ ਨੂੰ ਮਿਠੜੇ ਨਾਮ ਦੀ ਦਾਤ ਮਿਲ ਜਾਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If, later on, they receive the sweet,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਫੇਰ (ਮਿਠਾ) ਸੁਖ ਰੂਪ ਜੋ ਨਾਮ ਹੈ ਰਿਦੇ ਰੂਪੀ ਪਲੇ ਮੇਂ ਪੜ ਜਾਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਪ੍ਰਭੂ ਦਾ ਨਾਮ-ਰੂਪ ਸੁਆਦਲਾ ਭੋਜਨ ਮੁੜ ਮਿਲ ਜਾਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਠਾ = ਪ੍ਰਭੂ ਦਾ ਨਾਮ-ਰੂਪ ਸੁਆਦਲਾ ਪਦਾਰਥ। ਪੇੜੈ ਪਾਇ = ਪੱਲੇ ਪਏ, ਮਿਲ ਜਾਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el Señor lo bendijera con Su Dulce,"