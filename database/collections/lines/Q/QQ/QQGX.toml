[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗ੍ਰੰਥ ਕਰਾ ਪੂਰਨ ਸੁਭਰਾਤਾ ॥"
page = 1388

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Mother of the world has been kind towards me and I have completed the book this auspicious night"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਅਤੇ ਮੈਂ) ਸ਼ੁਭ ਗੁਣਾਂ ਨਾਲ ਭਰਪੂਰ ('ਸੁਭਰਾਤਾ') ਗ੍ਰੰਥ ਪੂਰਾ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਗ੍ਰੰਥ ਕਰਾ ਪੂਰਨ; ਸੁਭ ਰਾਤਾ ॥"