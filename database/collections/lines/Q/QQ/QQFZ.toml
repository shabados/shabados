[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੈਨਿ ਦਿਨਸੁ ਪ੍ਰਭ ਸੇਵ ਕਮਾਨੀ ॥"
page = 897
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Perform thou the Lord's service night and day."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਦਿਨ ਤੂੰ ਸੁਆਮੀ ਦੀ ਸੇਵਾ ਟਹਿਲ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, serve God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਨੇ ਰਾਤ ਦਿਨ ਆਪਨੇ ਸ੍ਵਾਮੀ ਕੀ ਸੇਵਾ ਕਮਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਦਿਨ ਰਾਤ (ਹਰ ਵੇਲੇ) ਪ੍ਰਭੂ ਦੀ ਸੇਵਾ-ਭਗਤੀ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੈਨਿ = {रजनि} ਰਾਤ। ਸੇਵ = ਸੇਵਾ-ਭਗਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Lo sirve noche y día."