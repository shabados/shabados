[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹੂੰ ਬ੍ਰਿਧ ਅਵਸਥਾ, ਕਹੂੰ ਬਾਲ ਕਰਮੰ ॥"
page = 29

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere Thou art in old age and somewhere actest as a child!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ (ਤੁਸੀਂ) ਬਿਰਧ ਅਵਸਥਾ ਵਾਲੇ ਹੋ ਅਤੇ ਕਿਤੇ ਬਾਲਾਂ ਵਾਲੀ ਚੇਸ਼ਟਾ ਕਰਨ ਵਾਲੇ ਹੋ।"