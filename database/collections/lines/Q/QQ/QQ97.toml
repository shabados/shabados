[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਕਸਿ ਕਸਵਟੀ ਲਾਏ; ਆਪੇ ਕੀਮਤਿ ਪਾਇਆ ॥੧੨॥"
page = 1040
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself tests on His touch-stone and of Himself appraises their worth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪ ਹੀ ਕਸਵੱਟੀ ਤੇ ਪਰਖਦਾ ਹੈ ਅਤੇ ਆਪ ਹੀ ਉਨ੍ਹਾਂ ਦਾ ਮੁਲ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself tests upon His Touchstone, and He Himself estimates the value. ||12||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਹੀ ਸਾਧਨਾ ਕੀ ਕਸ ਰੂਪ ਕਸਵਟੀ ਪਰ ਸਿਖ ਰੂਪ ਸੋਇਨੇ ਕੋ ਲਾਵਤਾ ਹੈ, ਆਪ ਹੀ ਪੁਨਃ ਕੀਮਤ ਕੋ ਪਾਵਤਾ ਹੈ, ਭਾਵ ਅਧਿਕਾਰੀ ਜਾਨ ਕੇ ਉਪਦੇਸ ਦੇਤਾ ਹੈ॥੧੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹਰੇਕ ਜੀਵ-ਵਣਜਾਰੇ ਦੇ ਕੀਤੇ ਵਣਜ ਨੂੰ) ਪ੍ਰਭੂ ਆਪ ਹੀ ਪਰਖਦਾ ਹੈ ਜਿਵੇਂ ਸੁਨਿਆਰਾ ਸੋਨੇ ਨੂੰ ਕਸਵੱਟੀ ਤੇ ਘਸਾ ਕੇ ਪਰਖਦਾ ਹੈ, ਤੇ ਫਿਰ ਪ੍ਰਭੂ ਆਪ ਹੀ (ਉਸ ਵਣਜ ਦਾ) ਮੁੱਲ ਪਾਂਦਾ ਹੈ ॥੧੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਸਿ = ਘਸਾ ਕੇ ॥੧੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, en el interior de la fortaleza del cuerpo está el Castillo del Señor Verdadero, Quien se sienta ahí en Su Trono Real.  (12)"