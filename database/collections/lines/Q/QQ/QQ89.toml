[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕ ਰੂਪ; ਜਾ ਕੇ ਰੰਗ ਅਨੇਕ ॥"
page = 295
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who has one form and many manifestations."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਸਰੂਪ ਇਕ ਤੇ ਅਨੇਕਾਂ ਦ੍ਰਿਸ਼ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has One Form, but He has many manifestations."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਏਕ ਸਰੂਪ ਕੇ ਅਨੇਕ ਰੰਗ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਇੱਕ ਅਕਾਲ ਪੁਰਖ ਦੇ ਅਨੇਕਾਂ ਰੰਗ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él tiene una Forma, pero muchas Manifestaciones."