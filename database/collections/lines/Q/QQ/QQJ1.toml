[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈ ਜੈ ਕਾਰੁ ਕਰੇ ਸਭੁ ਕੋਈ ॥"
page = 629
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and every one, now, applauds me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਲਈ ਹਰ ਕੋਈ ਮੇਰੀ ਸ਼ਲਾਘਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everyone congratulates me on my victory."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕਾ ਸਭ ਕੋਈ ਜੈ ਜੈ ਕਾਰ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰੇਕ ਜੀਵ ਉਸ ਦੀ ਸੋਭਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੈ ਜੈ ਕਾਰੁ = ਸੋਭਾ। ਸਭੁ ਕੋਈ = ਹਰੇਕ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el mundo entero proclama mi Victoria."