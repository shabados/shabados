[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਈ ਨਿਹਚਲੁ; ਸਾਚ ਠਾਇ ॥੩॥"
page = 1180
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone is the solitarian, whose mind is stable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਅਹਿੱਲ ਹੈ, ਜਿਸ ਨੂੰ ਸੱਚਾ ਟਿਕਾਣਾ ਪ੍ਰਾਪਤ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is steady and unmoving, who has found the true place. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਨਿਹਚਲ ਹੈ, ਜੋ ਸਾਚੇ ਠਾਇ ਅਰਥਾਤ ਨਿਜ ਸ੍ਵਰੂਪ ਕੋ ਪ੍ਰਾਪਤਿ ਹੂਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਮਨੁੱਖ ਅਡੋਲ ਚਿੱਤ ਵਾਲਾ ਹੈ, ਜਿਹੜਾ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦੇ ਚਰਨਾਂ ਵਿਚ ਜੁੜਿਆ ਰਹਿੰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਹਚਲੁ = ਅਡੋਲ-ਚਿੱਤ। ਸਾਚ ਠਾਇ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦੇ ਚਰਨਾਂ ਵਿਚ। ਠਾਇ = ਥਾਂ ਵਿਚ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh, sólo es inamovible, aquél que habita en la Verdad. (3)"