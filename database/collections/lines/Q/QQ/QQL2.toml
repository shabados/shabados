[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿੰਦਾ ਜਨ ਕਉ; ਖਰੀ ਪਿਆਰੀ ॥"
page = 339
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Slander is very sweet to God's servant."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਦਖੋਈ ਰੱਬ ਦੇ ਨੌਕਰ ਨੂੰ ਬੜੀ ਮਿੱਠੀ ਲੱਗਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Slander is pleasing to the Lord's humble servant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੁਝ ਜਨ ਕਉ ਨਿੰਦਾ ਅਤੀ ਪਿਆਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਸੇਵਕ ਨੂੰ ਆਪਣੀ ਨਿੰਦਿਆ ਹੁੰਦੀ ਚੰਗੀ ਲੱਗਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨ ਕਉ = ਪ੍ਰਭੂ ਦੇ ਸੇਵਕ ਨੂੰ। ਖਰੀ = ਬਹੁਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aprecio la calumnia,"