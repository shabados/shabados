[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਜਨਾ ਕੇ; ਹਰਿ ਜੀਉ ਕਾਰਜ ਸਵਾਰੇ ॥"
page = 1133
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sire Lord accomplishes the tasks of the saintly persons,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਹਾਰਾਜ ਮਾਲਕ ਸਾਧ ਸਰੂਪ ਪੁਰਸ਼ਾਂ ਦੇ ਸਾਰੇ ਕੰਮ ਰਾਸ ਕਰ ਦਿੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Dear Lord completes the tasks of the Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨੋਂ ਕੇ ਹਰਿ ਜੀ ਆਪ ਸਭ ਕਾਰਜ ਸਵਾਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਸਦਾ ਆਪਣੇ ਭਗਤਾਂ ਦੇ ਸਾਰੇ ਕੰਮ ਸਵਾਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਰਜ = ਸਾਰੇ ਕੰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios realiza las tareas de Sus Devotos,"