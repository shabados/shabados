[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਉਪਦੇਸਿ; ਸਭਿ ਦੁਖ ਪਰਹਰੀ ॥੧॥"
page = 1134
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru's instruction, all the sorrows are eliminated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਸਿੱਖਮਤ ਰਾਹੀਂ ਦੁਖੜੇ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Following the Guru's Teachings, all pains are taken away. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕਾ ਉਪਦੇਸ ਸੰਪੂਰਨ ਦੁਖੋਂ ਕੇ ਪ੍ਰਹਾਰ ਕਰਨੇ ਵਾਲਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਗੁਰੂ ਦੇ ਉਪਦੇਸ਼ ਦੀ ਰਾਹੀਂ (ਹਰਿ-ਨਾਮ ਜਪ ਕੇ ਆਪਣੇ) ਸਾਰੇ ਦੁੱਖ ਦੂਰ ਕਰ ਲੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਪਦੇਸਿ = ਉਪਦੇਸ਼ ਦੀ ਰਾਹੀਂ। ਸਭਿ ਦੁਖ = ਸਾਰੇ ਦੁਖ। ਪਰਹਰੀ = ਪਰਹਰਿ, ਦੂਰ ਕਰ ਲੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, por medio de la Instrucción del Guru, uno se libera de sus aflicciones. (1)"