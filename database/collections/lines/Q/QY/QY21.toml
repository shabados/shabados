[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਮ੍ਰਿਤੁ ਸਾਚਾ ਨਾਉ; ਓਥੈ ਜਾਪੀਐ ॥"
page = 519
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The ambrosial True Name is meditated upon there."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਧਾ-ਸਰੂਪ ਸੱਚਾ ਨਾਮ ਉਥੇ ਸਿਮਰਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There, they meditate on the Ambrosial Nectar of the True Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਸ ਸਾਧ ਸੰਗਤ ਮੇਂ ਹਰਿ ਕਾ ਸਚਾ ਨਾਮੁ ਅੰਮ੍ਰਿਤ ਜਪੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਸੰਗਤ ਵਿਚ ਅਮਰ ਕਰਨ ਵਾਲਾ ਸੱਚਾ ਨਾਮ ਸਿਮਰੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਥੈ = 'ਜਨ' ਦੀ ਸੰਗਤ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la mente de uno se contenta y su hambre se satisface."