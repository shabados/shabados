[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਰਤਾ ਵਹੀ ਮੂਰਤਿ ਤੂ ਪੈ ਹੈ ॥੨੦੨੪॥"
page = 499

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“When, because of Shiva’s anger, your body was burnt to ashes, then I had meditated on Shiva, who, getting pleased, had bestowed on me this boon that the same husband would be attained by me.”2024."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਿ) ਤੂੰ ਉਸੇ ਸਰੂਪ ਵਾਲਾ ਪਤੀ ਪ੍ਰਾਪਤ ਕਰੇਂਗੀ ॥੨੦੨੪॥"