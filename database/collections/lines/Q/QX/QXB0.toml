[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪੰਦ੍ਰਵੇਾਂ ਅਵਤਾਰ ਇਮ; ਧਾਰਤ ਭਯੋ ਮੁਰਾਰਿ ॥੨੦॥"
page = 193

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Vishnu manifested himself ad the fifteenth incarnation in this way.20."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਦਾ ਪੰਦ੍ਰਹਵਾਂ ਅਵਤਾਰ 'ਕਾਲ-ਪੁਰਖ' ('ਮੁਰਾਰਿ') ਨੇ ਧਾਰਨ ਕੀਤਾ ॥੨੦॥"