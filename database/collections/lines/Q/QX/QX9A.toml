[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੀ ਦਰਗਹ; ਪਾਵੈ ਮਾਣੁ ॥੩॥"
page = 1328
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who obtains honour in the True Court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੱਚੇ ਦਰਬਾਰ ਅੰਦਰ ਇਜ਼ਤ ਆਬਰੂ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "if one is honored in the True Court. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੇਰੀ ਸਚੀ ਦਰਗਾਹ ਵਿਖੇ (ਮਾਣੁ) ਆਦਰ ਪਾਵਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਦੀ ਦਰਗਾਹ ਵਿਚ ਇੱਜ਼ਤ ਹਾਸਲ ਕਰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਣੁ = ਇੱਜ਼ਤ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si uno es honrado en la Verdadera Corte. (3)"