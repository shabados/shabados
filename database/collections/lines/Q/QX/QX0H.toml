[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਜੰਤ ਸਗਲੇ ਪ੍ਰਤਿਪਾਲ ॥"
page = 889
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord cherishes all the sentient beings."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਸਾਰੇ ਪ੍ਰਾਣਧਾਰੀ ਜੀਵਾਂ ਨੂੰ ਪਾਲਦਾ-ਪੋਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He cherishes all beings and creatures."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਸੂਖਮ ਅਸਥੂਲ ਜੀਵੋਂ ਕੇ ਪ੍ਰਤਿਪਾਲਕ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਾਰੇ ਜੀਵਾਂ ਦੀ ਪਾਲਣਾ ਕਰਨ ਵਾਲਾ ਪਰਮਾਤਮਾ-"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor sostiene a todas Sus Criaturas"