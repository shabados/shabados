[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਦਰਗਹ; ਪਾਵਹਿ ਮਾਨ ॥"
page = 1337
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thiswise, thou shall obtain honour in the Lord's court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਤੂੰ ਪ੍ਰਭੂ ਦੇ ਦਰਬਾਰ ਅੰਦਰ ਇਜ਼ਤ ਆਬਰੂ ਪਾ ਲਵੇਂਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You shall be honored in the Court of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਤਿਸ ਕੇ ਜਪਣੇ ਕਰ ਹਰੀ ਕੀ ਦਰਗਹ ਮੇਂ ਆਦਰੁ ਪਾਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਮ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਤੂੰ ਪਰਮਾਤਮਾ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਆਦਰ ਹਾਸਲ ਕਰੇਂਗਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਵਹਿ = ਤੂੰ ਹਾਸਲ ਕਰੇਂਗਾ। ਮਾਨ = ਆਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y serás honrado en la Corte del Señor,"