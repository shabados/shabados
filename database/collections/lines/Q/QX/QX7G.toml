type = "primary"
data = "ਬਨਿ ਬੈਠਿ ਸਰਬ ਰਾਜਾਧਿਕਾਰ ॥"
page = 629

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing the splendour here and there, the kings sat down"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਭ ਰਾਜਾਂ ਦੇ ਅਧਿਕਾਰੀ (ਅਰਥਾਤ ਰਾਜੇ) ਬਣ ਠਣ ਕੇ ਬੈਠੇ ਸਨ।"