[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੀ ਅਨਿਕ. ਤੇਰੀ ਅਨਿਕ, ਕਰਹਿ ਹਰਿ ਪੂਜਾ ਜੀ; ਤਪੁ ਤਾਪਹਿ ਜਪਹਿ ਬੇਅੰਤਾ ॥"
page = 348
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Good many and several perform Thy worship, O endless God! They practise penance and repeat Thy Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਜਿਆਦਾ, ਬਹੁਤ ਬਹੁਤ ਤੈਡੀਂ ਉਪਾਸ਼ਨਾ ਕਰਦੇ ਹਨ ਹੇ ਹਦਬੰਨਾ-ਰਹਿਤ ਵਾਹਿਗੁਰੂ। ਉਹ ਤਪੱਸਿਆ ਸਾਧਦੇ ਹਨ ਅਤੇ ਤੇਰੇ ਨਾਮ ਨੂੰ ਉਚਾਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "For You, so many, for You, so very many, O Dear Lord, perform worship and adoration; they practice penance and endlessly chant in meditation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਿ੍ਯੰਤ ਹਰਿ ਜੀ! ਤੇਰੀ ਅਨੇਕ ਪ੍ਰਕਾਰ ਕੀ ਪੂਜਾ ਹੈ ਅਰ ਤੇਰੀ ਪਰਾਪਤੀ ਕੇ ਵਾਸਤੇ ਅਨੇਕ ਹੀ ਪੁਜਾਰੀ ਪੂਜਾ ਕਰਤੇ ਹੈਂ। ਅਨੇਕ ਹੀ ਤੇਰੇ ਹੇਤ ਤਪ ਤਾਪਤੇ ਹੈਂ ਅਰ ਅਨੇਕ ਹੀ ਤੇਰਾ ਜਪ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਅਨੇਕਾਂ ਜੀਵ ਤੇਰੀ ਪੂਜਾ ਕਰਦੇ ਹਨ, ਬੇਅੰਤ ਜੀਵ (ਤੈਨੂੰ ਮਿਲਣ ਲਈ) ਤਾਪ ਸਾਧਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਿਕ = ਅਨੇਕਾਂ। ਤਪੁ = ਧੂਣੀਆਂ ਆਦਿਕ ਦਾ ਸਰੀਰਕ ਔਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Para Ti tantos, para Ti muchísimos más, oh Amado Señor, realizan Alabanza y Adoración, practican Penitencia e interminablemente cantan en Meditación."