[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨੈਸਕਿ ਮੋਰਿ ਗਏ ਅਨਤੈ; ਨਹਿ ਜਾਨਤ ਪ੍ਰੀਤਮ ਜੀਤ ਰਹੈਗੋ ॥"
page = 993

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(Sahiban) ‘I will not like to go anywhere, not even for a moment."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਥੋੜੇ ਜਿੰਨੇ ਸਮੇਂ ਲਈ ਮੇਰੇ ਕਿਤੇ ਹੋਰ (ਵਿਆਹੇ ਹੋਏ) ਚਲੇ ਜਾਣ ਤੇ ਕੀ ਪਤਾ (ਮੇਰਾ) ਪ੍ਰੀਤਮ ਜੀਉਂਦਾ ਰਹੇਗਾ।"