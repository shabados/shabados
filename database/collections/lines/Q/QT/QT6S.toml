[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਨਿਕਟਿ; ਨ ਆਵੈ ਕੋਈ ॥"
page = 386
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He whom no one draws near,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਲਾਗੇ ਭੀ ਕੋਈ ਨਹੀਂ ਲੱਗਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That person, whom no one wants to be near"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਪਾਸ ਕੋਈ ਨਹੀਂ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! (ਕੰਗਾਲ ਜਾਣ ਕੇ) ਜਿਸ ਮਨੁੱਖ ਦੇ ਨੇੜੇ ਭੀ ਕੋਈ ਨਹੀਂ ਸੀ ਢੁਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਕਟਿ = ਨੇੜੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mundo entero lavará los pies de aquél cuya cercanía aún nadie busca,"