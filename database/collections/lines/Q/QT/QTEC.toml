[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਾਸੁ ਕਬੀਰੁ; ਤੇਰੀ ਪਨਹ ਸਮਾਨਾਂ ॥"
page = 1161
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Kabir, Thy slave, has entered into thy refuge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰ ਗੋਲਾ ਕਬੀਰ, ਤੇਰੀ ਸ਼ਰਣ ਅੰਦਰ ਸਮਾ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Slave Kabeer has entered Your Shelter."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੈਂ ਦਾਸ ਤੇਰੀ (ਪਨਹ) ਸਰਣਿ ਮੇਂ ਸਮਾਇ ਰਹਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰਾ ਦਾਸ ਕਬੀਰ ਤੇਰੀ ਸ਼ਰਨ ਆਇਆ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਨਹ = ਪਨਾਹ, ਓਟ, ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, Tu Esclavo, he penetrado en Tu Santuario, oh Alah;"