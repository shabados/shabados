type = "primary"
data = "ਸਤਿਗੁਰ ਭੇਟੇ ਕੀ ਵਡਿਆਈ ॥"
page = 423
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The greatness of meeting the True Guru is this,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਨੂੰ ਮਿਲਣ ਦੀ ਇਹ ਵਿਸ਼ਾਲਤਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The great glory of meeting the True Guru is"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਗੁਰੋਂ ਕੇ ਮਿਲਨੇ ਕੀ ਵਡੀ ਵਡਿਆਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਗੁਰੂ ਨੂੰ ਮਿਲਣ ਦੀ ਹੀ ਬਰਕਤ ਹੈ ਕਿ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੇਟੇ = ਮਿਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con la Bendición del Verdadero Guru,"