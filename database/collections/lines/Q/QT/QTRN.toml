[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਆ ਨਾਗੇ; ਕਿਆ ਬਾਧੇ ਚਾਮ ॥"
page = 324
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What matters is weather man goes naked or wears a (deer) skin,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੀ ਹੋਇਆ, ਜੇਕਰ ਆਦਮੀ ਨੰਗਾ ਫਿਰਦਾ ਹੈ ਜਾਂ (ਹਰਨ ਦੀ) ਖੱਲ ਪਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What does it matter whether someone goes naked, or wears a deer skin,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਨਗਨ ਰਹੇ ਤੌ ਕਿਆ ਹੈ ਔਰ (ਚਾਮ) ਸਰੀਰ ਚਮੜੇ ਕੇ ਬਸਤ੍ਰੋਂ ਕਰ ਬਾਂਧ ਲੀਆ ਅਰਥਾਤ ਢਕ ਲੀਆ ਤੌ ਕਿਆ ਹੈ; ਵਾ (ਚਾਂਮ) ਮ੍ਰਿਗੋਂ ਕੇ ਚਰਮ ਸਰੀਰ ਕੇ ਉਪਰ ਬਾਂਧ ਲੀਏ ਤਬ ਕਿਆ ਲਾਭ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਤਦ ਤਕ ਨੰਗੇ ਰਿਹਾਂ ਕੀਹ ਸੌਰ ਜਾਣਾ ਹੈ ਤੇ ਪਿੰਡੇ ਤੇ ਚੰਮ ਲਪੇਟਿਆਂ ਕੀਹ ਮਿਲ ਜਾਣਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਧੇ ਚਾਮ = (ਮ੍ਰਿਗ ਸ਼ਾਲਾ ਆਦਿਕ) ਚੰਮ (ਸਰੀਰ ਤੇ) ਪਹਿਨਿਆਂ। ਕਿਆ = ਕੀਹ ਲਾਭ ਹੋ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿De qué sirve que uno viva vestido o desnudo,"