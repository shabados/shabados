data = "ਨਾਮ ਤੁਪਕ ਕੇ ਸਭ ਲਹਿ ਲੀਜੋ ॥੧੨੬੪॥"
page = 804

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Vrindraarak, add the word “naayak” three times and then adding the word “ari” at the end, know all the names of Tupak.1264."

