[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕੈ; ਨਿਕਟਿ ਨ ਆਵੈ ਪੀਰ ॥੩॥"
page = 188
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "pain does not come near him,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਨੇੜੇ ਪੀੜ ਨਹੀਂ ਲਗਦੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- pain does not even approach them. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ (ਪੀਰ) ਅਰਥਾਤ ਜਨਮਾਦੀ ਦੁਖ ਨੇੜੇ ਨਹੀਂ ਆਵਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਦੁੱਖ ਕਲੇਸ਼ ਉਸ ਦੇ ਨੇੜੇ ਨਹੀਂ ਢੁਕ ਸਕਦਾ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਕਟਿ = ਨੇੜੇ। ਪੀਰ = ਪੀੜ, ਦੁੱਖ-ਕਲੇਸ਼ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no se le acerca ni el dolor ni la aflicción. (3)"