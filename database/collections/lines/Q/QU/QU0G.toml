[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਨਾਮੁ; ਜਗਤ ਨਿਸਤਾਰਾ ॥"
page = 1129
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Emancipation of the world is through the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰ ਦੀ ਕਲਿਆਣ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੇ ਰਾਹੀਂ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The world is saved through Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਮ ਨਾਮ ਜਗਤ ਕਾ ਨਿਸਤਾਰਾ ਉਧਾਰ ਕਰਨੇ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਦੁਨੀਆ ਦਾ ਪਾਰ-ਉਤਾਰਾ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਗਤ ਨਿਸਤਾਰਾ = ਸੰਸਾਰ ਦਾ ਪਾਰ-ਉਤਾਰਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La emancipación del mundo se da a través del Nombre del Señor."