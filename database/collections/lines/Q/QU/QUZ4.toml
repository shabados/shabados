[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੀ ਗੁਰ ਵਡਿਆਈ ॥"
page = 621
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is the greatness of my Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੀ ਹੈ ਵਿਸ਼ਾਲਤਾ ਮੇਰੇ ਗੁਰਦੇਵ ਦੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True is the glorious greatness of the Guru;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਵਡਿਆਈ ਸਾਚੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰੂ ਦੀ ਆਤਮਕ ਉੱਚਤਾ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਡਿਆਈ = ਆਤਮਕ ਉੱਚਤਾ। ਸਾਚੀ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Verdadera es la Gloria de mi Guru;"