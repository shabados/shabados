[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਪਾਏ; ਹਮ. ਅਵਰੁ ਨ ਭਾਰਿਆ ॥੭॥"
page = 228
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Master I have found, and, now, I search not another."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਲਕ ਨੂੰ ਮੈਂ ਪਾ ਲਿਆ ਹੈ ਅਤੇ ਹੁਣ ਮੈਂ ਹੋਰਸ ਨੂੰ ਨਹੀਂ ਭਾਲਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have found God - I am not searching for any other. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਹੀ ਪੂਰਬੋਕਤ ਪ੍ਰਕਾਰ ਤੇ ਹਮਨੈ ਭੀ ਪ੍ਰਭੂ ਪਾਏ ਹੈਂ ਔਰ ਕਛੁ ਨਹੀਂ ਢੂੰਢਿਆ ਹੈ, ਵਾ ਔਰ ਕਰਮੋਂ ਕਾ ਭਾਰ ਨਹੀਂ ਰਹਾ ਹੈ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਜਿਸ ਨੇ ਜਸ ਕੀਤਾ, ਉਸ ਨੂੰ ਪ੍ਰਭੂ ਜੀ ਮਿਲ ਪਏ। (ਮੈਂ ਭੀ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਹੀ ਕਰਦਾ ਹਾਂ ਤੇ) ਉਸ ਤੋਂ ਬਿਨਾ ਕਿਸੇ ਹੋਰ ਨੂੰ ਨਹੀਂ ਭਾਲਦਾ ॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਰਿਆ = ਭਾਲਿਆ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y cuando uno encuentra al Señor Dios, ya no busca a nadie más.(7)"