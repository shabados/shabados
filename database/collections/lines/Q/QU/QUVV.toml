[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿਧੌ ਸੰਖਨੀ ਚਿਤ੍ਰਨੀ ਪਦਮਨੀ ਹੈ ॥੨੩॥੧੯੧॥"
page = 144

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Or she was the charming replica of Sankhani, Chitrani or Padmini (9 types of women).23.191."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਾਂ ਸੰਖਨੀ, ਚਿਤ੍ਰਨੀ (ਅਥਵਾ) ਪਦਮਨੀ ਹੋਵੇ ॥੨੩॥੧੯੧॥"