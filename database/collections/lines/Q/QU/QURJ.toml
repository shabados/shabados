[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਾਹੁ ਵਾਹੁ ਕਰਤਿਆ; ਸੋਭਾ ਪਾਇ ॥"
page = 514
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By uttering God, God man obtains honour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ, ਵਾਹਿਗੁਰੂ ਦਾ ਉਚਾਰਨ ਕਰਨ ਦੁਆਰਾ ਇਨਸਾਨ ਇੱਜ਼ਤ ਆਬਰੂ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chanting Waaho! Waaho!, one obtains honor."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਾਹੁ ਵਾਹੁ ਕਰਤਿਆਂ ਹੀ ਸੋਭਾ ਪਾਈਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦਿਆਂ ਸੋਭਾ ਮਿਲਦੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Alabando al Señor, uno obtiene la Gloria."