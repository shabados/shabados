data = "ਜਾ ਕੇ ਸਭ ਗੁਨਿਜਨ ਗੁਨ ਜੋਵਹਿ ॥੭੦੪॥"
page = 750

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Dharaaraaj” in the beginning and then adding the word “Prashthani” with it , the names of Tupak are comprehended, which is eulogized by all.704."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਨੂੰ ਸਾਰੇ ਬੁੱਧੀਮਾਨ ਸਮਝ ਲੈਣ ॥੭੦੪॥"