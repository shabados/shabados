[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੋ ਪਰਚਉ; ਪਾਇਓ ॥"
page = 205
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such an intimacy I have developed with the Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਹੋ ਜੇਹੀ ਯਾਰੀ ਮੇਰੀ ਸਾਹਿਬ ਨਾਲ ਪੈ ਗਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am intimate with Him;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਗਵਨ! ਤੈਂ ਹਮਾਰੇ ਮਨ ਮੇਂ ਜਗ੍ਯਾਸਾ ਕਾਲ ਕੇ ਬੀਚ ਅਪਨਾ ਐਸਾ ਪਰਚਾ ਪਾਇਆ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਨਾਲ ਮੇਰੀ) ਇਹੋ ਜਿਹੀ ਸਾਂਝ ਬਣ ਗਈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਚਉ = {परिचय} ਸਾਂਝ, ਮਿਤ੍ਰਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal es mi Relación con el Señor,"