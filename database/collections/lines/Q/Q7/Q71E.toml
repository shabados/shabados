[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਨਹਦ ਰੂਪ, ਅਨਾਹਦ ਬਾਨੀ ॥"
page = 11

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is Limitless Entity and hath infinite celestial strain."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਸਰੂਪ ਸੀਮਾ-ਰਹਿਤ (ਅਪਰ ਅਪਾਰ) ਅਤੇ ਉਸ ਦੀ ਬਾਣੀ ਬਿਨਾ ਕਿਸੇ ਆਘਾਤ ਤੋਂ ਪੈਦਾ ਹੋਣ ਵਾਲੀ ਹੈ।"