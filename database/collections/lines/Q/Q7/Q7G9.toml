type = "primary"
data = "ਮਹਿਖੁਆਸੁ ਕਰਖੇ ॥"
page = 108

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They are striking their weapons, facing the enemy and are pulling their bow-strings."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਧਨੁਸ਼ਾਂ ('ਮਹਿਖੁਆਸ') ਉਤੇ ਚਿੱਲਾ ਚੜ੍ਹਾਉਂਦੇ ਹਨ।"