data = "ਮਹਾ ਕਾਮ ਕਾਮੰ ਮਹਾ ਭੋਗ ਭੋਗੰ ॥੧੦॥"
page = 40

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is the Greatest of the rapturous and the greatest of the Ravishing. 10"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੂੰ) ਕਾਮਨਾਵਾਂ ਦੀ ਵੀ ਕਾਮਨਾ ਅਤੇ ਮਹਾ ਭੋਗਾਂ ਦਾ ਵੀ ਭੋਗ ਹੈਂ ॥੧੦॥"