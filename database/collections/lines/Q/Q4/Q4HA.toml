[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਾਇ ਪਰੀ ਤਿਹ ਕੇ ਤਬ ਹੀ; ਸਭ ਭਾਤਿ ਕਰੀ ਬਹੁ ਤਾਹਿ ਬਡਾਈ ॥"
page = 316

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the gopis falling at the feet of the goddess began to eulogise her in various ways"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸਾਰੀਆਂ ਗੋਪੀਆਂ) ਉਸੇ ਵੇਲੇ ਦੇਵੀ ਦੇ ਚਰਨੀ ਪੈ ਗਈਆਂ ਅਤੇ ਸਭ ਤਰ੍ਹਾਂ ਨਾਲ ਉਸ (ਦੁਰਗਾ) ਦੀ ਬਹੁਤ ਵਡਿਆਈ ਕੀਤੀ"