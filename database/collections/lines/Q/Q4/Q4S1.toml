[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੰਦਾ ਕੋ. ਨ ਅਲਾਏ ॥"
page = 627
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Now no one speaks ill of me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਕੋਈ ਭੀ ਮੈਨੂੰ ਬੁਰਾ ਨਹੀਂ ਆਖਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one speaks ill of me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਤਿਨ ਕੋ ਬੁਰਾ ਨਹੀਂ ਕਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ (ਕਿਸੇ ਨੂੰ) ਕੋਈ ਭੈੜੇ ਬੋਲ ਨਹੀਂ ਬੋਲਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਦਾ ਕੋ = ਕੋਈ ਭੈੜਾ ਬੋਲ। ਅਲਾਏ = ਬੋਲਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora nadie habla mal de mí"