[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਇਕ ਜੋਤਿ ਦੁਇ ਮੂਰਤੀ; ਇਕ ਸਬਦੁ ਸਰਿਸੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The Guru and the disciple are two identities but one shabad, Word permeates through both of them."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਨਾਨਕ ਤੇ ਗੁਰੂ ਅੰਗਦ) ਦੋ ਮੂਰਤਾਂ ਹਨ, ਪਰ ਜੋਤ ਇਕ ਹੈ, ਸਬਦ ਇਕ ਸਾਰਖਾ ਹੈ।"