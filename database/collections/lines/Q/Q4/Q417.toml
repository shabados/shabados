data = "ਕਵੀਸ਼ਰ ਲੋਕ, ਯੋਗੀ ਅਤੇ ਵਾਲਾ ਦੀਆਂ ਲਿਟਾਂ ਧਾਰਨ ਕਰਨ ਵਾਲਿਆਂ,"

[[content]]
assets = ["DSSK"]
