[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਪ੍ਰਭੁ ਅਬਿਨਾਸੀ ॥"
page = 626
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, my Lord is imperishable,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਮੇਰਾ ਸੁਆਮੀ ਅਮਰ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, God is eternal and imperishable."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਪ੍ਰਭੂ ਜੋ ਤੂੰ (ਅਬਿਨਾਸੀ) ਨਿਤ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਬਿਨਾਸ਼ੀ ਪ੍ਰਭੂ (ਐਸਾ ਉਦਾਰ-ਚਿੱਤ ਹੈ ਕਿ)"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, el Señor es Eterno;"