[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਕਾਰ ਕਮਾਇ, ਭਾਣਾ ਭਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They adopt the daily routine of the Gurmukhs, and Gods Will becomes dear to them."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾਂ ਵਾਲੀ ਕਾਰ ਕਮਾਕੇ (ਈਸ਼੍ਵਰ ਦਾ) ਭਾਣਾ ਹੀ ਚੰਗਾ ਜਾਣਦਾ ਹੈ।"