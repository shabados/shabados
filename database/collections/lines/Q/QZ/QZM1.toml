[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਨ ਕਰਾਵਨ ਸੋਈ ॥"
page = 886
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the Lord, is the Doer and Prompter of deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਆਮੀ ਕੰਮਾਂ ਨੂੰ ਕਰਨ ਅਤੇ ਕਰਾਉਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Creator, the Cause of causes;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਰਨੇ ਔ ਕਰਾਵਨ ਕੋ ਵਹੀ ਸਮਰਥ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਹ ਪਰਮਾਤਮਾ ਹੀ ਸਭ ਕੁਝ ਕਰਨ-ਜੋਗ ਹੈ ਅਤੇ (ਸਭ ਵਿਚ ਵਿਆਪਕ ਹੋ ਕੇ ਸਭ ਜੀਵਾਂ ਪਾਸੋਂ) ਕਰਾਵਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਈ = ਉਹ (ਪਰਮਾਤਮਾ) ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor es el Único Hacedor y la Causa;"