[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੇ ਮਨ ਮੇਰੇ; ਤੂੰ ਤਾ ਸਿਉ ਰਾਚੁ ॥"
page = 270
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul get thou merged into Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ! ਤੂੰ ਉਸ ਨਾਲ ਅਭੇਦ ਹੋ ਜਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, merge yourself into Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ ਤਿਸੀ ਬੀਚ ਰਚੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ ਉਸ (ਪ੍ਰਭੂ) ਨਾਲ ਜੁੜਿਆ ਰਹੁ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਚੁ = ਰਚ, ਰੁੱਝ, ਜੁੜਿਆ ਰਹੁ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, mente mía, fúndete en Él."