[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਨਿ ਮੂੰਡ ਮੁੰਡਾਤ ਭੇ; ਸਭ ਰਾਜ ਪਾਟ ਨਿਧਾਨ ॥੧੩੫॥"
page = 646

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They abandoned their royal responsibilities and came to get done their tonsure ceremony.135."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਰਾਜਸੀ ਠਾਠਾਂ ਅਤੇ ਖ਼ਜ਼ਾਨਿਆਂ ਵਾਲਿਆਂ ਨੇ ਆ ਕੇ ਸਿਰ ਮੁਨਵਾ ਲਏ ਹਨ ॥੧੩੫॥"