[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇ ਤੈਂ ਲੀਨੇ; ਭਗਤ ਰਾਖਿ ॥"
page = 1192
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou Thyself emancipate those saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਸਾਧੂਆਂ ਨੂੰ ਤੂੰ ਖੁਦ ਮੁਕਤ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You saved those devotees."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਭਗਤ ਤੈਨੇ ਰਾਖ ਲੀਏ ਹੈਂ, ਭਾਵ ਜਨਮ ਮਰਨ ਤੇ ਰਹਤਿ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਨੂੰ ਤੂੰ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਵਿਚੋਂ) ਬਚਾ ਲਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇ = ਉਹ ਮਨੁੱਖ {ਬਹੁ-ਵਚਨ}। ਰਾਖਿ ਲੀਨੇ = (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਬਚਾ ਲਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "son salvados y emancipados de forma instantánea."