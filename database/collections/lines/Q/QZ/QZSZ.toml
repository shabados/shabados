[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤ ਕਰਨਿ ਹਰਿ ਚਾਕਰੀ; ਜਿਨੀ ਅਨਦਿਨੁ ਨਾਮੁ ਧਿਆਇਆ ॥"
page = 145
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The devotees, who night and day meditate on the Name perform God's service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ਰਧਾਲੂ ਜੋ ਰੈਣ ਦਿਹੁੰ ਨਾਮ ਦਾ ਅਰਾਧਨ ਕਰਦੇ ਹਨ, ਵਾਹਿਗੁਰੂ ਦੀ ਨੌਕਰੀ ਬਜਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The devotees serve the Lord; night and day, they meditate on the Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਿਨ੍ਹੋਂ ਭਗਤੋਂ ਨੇ ਰਾਤ ਦਿਨ ਹਰਿ ਹਰਿ ਕਾ ਨਾਮੁ ਜਪਿਆ ਹੈ, ਸੋ ਹਰੀ ਕੀ ਸੇਵਾ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੀ ਆਪਣੀ ਰਜ਼ਾ ਵਿਚ) ਭਗਤ ਉਸ ਪ੍ਰਭੂ ਦੀ ਬੰਦਗੀ ਕਰ ਰਹੇ ਹਨ, ਉਹ ਹਰ ਵੇਲੇ ਨਾਮ ਸਿਮਰ ਰਹੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਦਿਨੁ = ਹਰ ਰੋਜ਼, ਹਰ ਵੇਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Santos sirven a su Señor, y habitan en Él noche y día. Ellos expulsan al ego de su interior,"