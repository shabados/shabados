[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰੇ ਹਰਿ ਨਿਰਮਲ ਨਾਮ ॥"
page = 895
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "of the Lord God's immaculate Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦੇ ਪਵਿੱਤਰ ਨਾਮ ਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the immaculate Name of the Lord, Har, Har."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਹਰਿ ਹਰਿ ਨਾਮ ਨਿਰਮਲ ਜਾਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਵਿੱਚ ਪਰਮਾਤਮਾ ਦਾ ਪਵਿੱਤਰ ਨਾਮ (ਮਾਨੋ ਧਨ ਹੈ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "del Nombre Inmaculado."