[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਹੀ ਪੁਰਖ. ਨ ਵਿਆਪੈ ਮਾਇਆ ॥"
page = 1086
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the mammon clings not to that person."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੋਹਨੀ ਉਸ ਪੁਰਸ਼ ਨੂੰ ਨਹੀਂ ਚਿਮੜਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "that person is not afflicted by Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪੁਰਖ ਕੋ ਮਾਇਆ ਨਹੀਂ ਵਿਆਪਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਿਰਫ਼ ਉਸ ਮਨੁੱਖ ਉਤੇ ਹੀ ਮਾਇਆ ਆਪਣਾ ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਵਿਆਪੈ = ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no puede ser afectado ni controlado por Maya."