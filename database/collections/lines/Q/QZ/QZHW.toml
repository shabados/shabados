[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਇਆ ਗਇਆ; ਮੁਇਆ ਨਾਉ ॥"
page = 138
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He came and departed and even his Name is dead."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਇਆ ਸੀ ਤੇ ਟੁਰ ਗਿਆ ਹੈ ਅਤੇ ਉਸ ਦਾ ਨਾਮ ਭੀ ਮਰ ਮੁੱਕ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He came and he went, and now, even his name has died."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੀਵ ਇਸ ਸਰੀਰ ਮੇਂ (ਆਇਆ) ਪ੍ਰਾਪਿਤ ਹੂਆ ਥਾ, ਸੋ ਇਸ ਕੋ ਤਿਆਗ ਕਰ ਔਰ ਸਰੀਰ ਮੇਂ ਗਿਆ ਹੈ, ਨਾਮ ਮਾਤ੍ਰ ਮੂਆ ਹੈ। ਵਾ ਨਾਮ ਹੈ ਕਿ ਅਮਕਾ ਮਰ ਗਿਆ ਹੈ ਵਾਸਤਵ ਸੇ ਮੂਆ ਨਹੀਂ ਹੈਂ॥☬ਇਸੀ ਬਾਤ ਕੋ ਸਿਧ ਕਰਤੇ ਹੂਏ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਜਗਤ ਵਿਚ ਆਇਆ ਤੇ ਤੁਰ ਗਿਆ, (ਜਗਤ ਵਿਚ ਉਸ ਦਾ) ਨਾਮ ਭੀ ਭੁੱਲ ਗਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਇਆ = ਭੁੱਲ ਗਿਆ, ਮੁੱਕ ਗਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vino y se fue, y hasta su nombre ha muerto."