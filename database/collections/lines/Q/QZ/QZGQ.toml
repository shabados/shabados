data = "ਨਹੀਂ ਤਾਂ ਮੈਨੂੰ ਇਸ ਤਰਾਂ ਆਉਣ ਦਾ ਕੋਈ ਸ਼ੌਕ ਨਹੀਂ ਸੀ ।"

