[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਦਰ ਦਰਵੇਸੁ; ਸਚੁ ਸੁਹਾਣਿਆ ॥੧॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The truth is pleasing to those gurmukhs who have become dervish at the door of holy congregation."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(੯) (ਜੋ) ਗੁਰਮੁਖ 'ਦਰ' (ਸਤਿਸੰਗ) ਦੇ ਦਰਵੇਸ਼ ਹੋਏ (ਉਨ੍ਹਾਂ ਨੂੰ ਹੀ ਸੱਚ) ਸੁਹਣਾ ਲੱਗਾ ਹੈ।"