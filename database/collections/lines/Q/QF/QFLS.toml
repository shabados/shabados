[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਸੁਖੁ; ਹਮਹੁ. ਨ ਮਾਂਗਿਆ ਭਾਵੈ ॥੧॥"
page = 330
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I like not to ask for that peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਆਰਾਮ ਦੀ ਯਾਚਨਾ ਕਰਨੀ ਮੈਨੂੰ ਚੰਗੀ ਨਹੀਂ ਲਗਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I would rather not beg for that pleasure. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਸੁਖ ਹਮਾਰੇ ਕੋ ਮਾਂਗਿਆ ਨਹੀਂ ਭਾਵਤਾ ਹੈ॥੧॥☬ਪ੍ਰਸ਼ਨ: ਆਪ ਇਸ ਸੇ ਕਿਉਂ ਭੈ ਕਰਤੇ ਹੋ?☬ਉੱਤ੍ਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸੁਖ ਦੇ ਮੰਗਿਆਂ ਦੁੱਖ ਮਿਲਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਮਹੁ = ਸਾਨੂੰ। ਨ ਭਾਵੈ = ਚੰਗਾ ਨਹੀਂ ਲੱਗਦਾ। ਮਾਂਗਿਆ ਨ ਭਾਵੈ = ਮੰਗਣਾ ਚੰਗਾ ਨਹੀਂ ਲੱਗਦਾ, ਮੰਗਣ ਦੀ ਲੋੜ ਨਹੀਂ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿para qué entonces buscar el placer que es vano?(1)"