[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਦਾਸੁ; ਅਦੇਸਾ ਕਾਹੇ ਕਰੈ ॥"
page = 899
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "why should that attendant of the Lord feel any anxiety?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਆਮੀ ਦਾ ਸੇਵਕ ਕਿਉਂ ਕਿਸੇ ਗੱਲ ਦਾ ਫਿਕਰ ਕਰੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru places His hand upon my forehead."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਦਾਸ ਸੰਸਾ ਕਿਉਂ ਕਰੇ, ਭਾਵ ਨਹੀਂ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਦਾ ਉਹ) ਸੇਵਕ ਕਿਸੇ ਤਰ੍ਹਾਂ ਦਾ ਭੀ ਕੋਈ ਚਿੰਤਾ-ਫ਼ਿਕਰ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਦੇਸਾ = ਅੰਦੇਸ਼ਾ, ਚਿੰਤਾ-ਫ਼ਿਕਰ। ਕਾਹੇ = ਕਿਉਂ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nunca pasará preocupaciones ni angustias."