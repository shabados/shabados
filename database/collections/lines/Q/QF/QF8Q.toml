[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੀ ਕਰਣੀ; ਗੁਰ ਕੀ ਸਿਰਕਾਰਾ ॥"
page = 1033
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True are the deeds of those, who are under the sway of the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਹਨ ਅਮਲ ਉਨ੍ਹਾਂ ਦੇ ਜੋ ਗੁਰਾਂ ਦੀ ਹਕੂਮਤ ਤਾਬੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True are the actions of those who are under the Guru's influence."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਗੁਰੋਂ ਕੀ ਕਾਰ ਸਿਰ ਪਰ ਧਾਰੀ ਹੈ, ਭਾਵ ਹੁਕਮ ਮੰਨਿਆ ਹੈ, ਤਿਨ ਕੀ ਕਰਣੀ ਸਚੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਅਗਵਾਈ ਵਿਚ ਤੁਰਨਾ ਹੀ ਸਹੀ ਜੀਵਨ-ਰਸਤਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਰਕਾਰਾ = ਹਕੂਮਤ, ਅਗਵਾਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las acciones de los que están bajo la influencia del Guru, son verdaderas."