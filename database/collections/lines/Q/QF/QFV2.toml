[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਹੁਤੁ ਦਰਬੁ ਕਰਿ; ਮਨੁ ਨ ਅਘਾਨਾ ॥"
page = 179
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With vast wealth man 's mind is not satiated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਧੇਰੇ ਪਦਾਰਥ ਨਾਲ ਇਨਸਾਨ ਦਾ ਚਿੱਤ ਨਹੀਂ ਰੱਜਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Even with vast sums of wealth, the mind is not satisfied."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਹੁਤੁ ਧਨ ਅਕਤ੍ਰ ਕਰਨੇ ਸੇ ਮਨ ਤ੍ਰਿਪਤ ਨਹੀਂ ਹੂਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬਹੁਤਾ ਧਨ ਜੋੜ ਕੇ (ਭੀ) ਮਨ ਰੱਜਦਾ ਨਹੀਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਰਬੁ = {द्रव्य} ਧਨ। ਕਰਿ = (ਇਕੱਠਾ) ਕਰ ਕੇ। ਅਘਾਨਾ = ਰੱਜਦਾ {आघ्राण}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Junta todas las riquezas, pero no por eso tu mente se calmará;"