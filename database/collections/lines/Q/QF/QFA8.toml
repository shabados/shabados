[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਫੇਰਿ ਬੰਧਾਇ ਭਏ ਬ੍ਰਿਜ ਕੇ ਪਤਿ; ਊਖਲ ਸੋ ਧਰਿ ਊਪਰ ਧਾਵੈ ॥"
page = 305

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Ultimately, he was tied with ukhal and began to roll on the earth"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਨੇ (ਆਪਣੇ ਆਪ ਨੂੰ) ਉਖਲ ਨਾਲ ਬੰਨ੍ਹਵਾ ਲਿਆ ਅਤੇ ਧਰਤੀ ਉਤੇ (ਇਧਰ ਉਧਰ) ਭਜਣ ਲਗੇ।"