[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਸੰਚਿ; ਰਾਜੇ ਅਹੰਕਾਰੀ ॥"
page = 1342
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Amassing wealth, the kings become proud."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨ ਇਕੱਤਰ ਕਰਨ ਦੁਆਰਾ, ਪਾਤਿਸ਼ਾਹ, ਮਗਰੂਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Gathering the wealth of Maya, kings become proud and arrogant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਮਾਇਆ ਕੋ (ਸੰਚਿ) ਇਕਤ੍ਰ ਕਰ ਕੇ ਰਾਜੇ ਹੰਕਾਰੀ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਇਕੱਠੀ ਕਰ ਕੇ ਰਾਜੇ ਮਾਣ ਕਰਨ ਲੱਗ ਪੈਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਚਿ = ਜੋੜ ਜੋੜ ਕੇ, ਇਕੱਠੀ ਕਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Atesorando la riqueza de Maya los reyes se han vuelto arrogantes y orgullosos,"