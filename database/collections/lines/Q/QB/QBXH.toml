[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬੋਲਤ ਹੈ ਮੁਖ ਤੇ ਸਭ ਗਵਾਰਿਨ; ਪੁੰਨਿ ਕਰਿਓ ਇਨ ਹੂੰ ਅਤਿ ਮਾਈ ॥"
page = 315

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O mother! This flute has performed many austerities, abstinences and baths at pilgrim-stations"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਗੋਪੀਆਂ ਮੁਖ ਵਿਚੋਂ ਕਹਿੰਦੀਆਂ ਹਨ, ਹੇ ਮਾਤਾ! ਇਸ (ਬੰਸਰੀ ਨੇ) ਕੋਈ ਵੱਡਾ ਪੁੰਨ ਕੀਤਾ ਹੈ,"