data = "ਕਲਿਜੁਗਿ, ਨਾਵੈ ਕੀ ਵਡਿਆਈ ॥੧੬॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In Kaliyug, only repeating the name of Lord is considered grand."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਲਜੁਗ (ਵਿਖੇ ਇਕ) ਨਾਮ ਦੀ ਹੀ ਵਡਿਆਈ ਹੈ।"