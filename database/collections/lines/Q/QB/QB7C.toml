[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਕਰਣ ਕਾਰਣ ਸਮਰਥੁ ਹੈ; ਸਚੁ ਸਿਰਜਣਹਾਰੇ ॥"
page = 589
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou, O True Creator, art Omnipotent to do all the deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੇ ਸੱਚੇ ਕਰਤਾਰ! ਸਾਰੇ ਕੰਮਾਂ ਦੇ ਕਰਨ ਨੂੰ ਸਰਬ-ਸ਼ਕਤੀਵਾਨ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are all-powerful, the Cause of causes, the True Creator Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਚੇ ਸਿਰਜਣਹਾਰੇ! ਤੁਹੀਂ ਕਰਣ ਕਾਰਣ ਸਮਰਥ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਕਰਤਾਰ! ਤੂੰ ਸਭ ਕੁਝ ਕਰਨ ਦੀ ਤਾਕਤ ਰੱਖਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਣ = ਜਗਤ। ਕਾਰਣ = ਮੂਲ, ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres nuestro Señor Creador, Todopoderoso, Verdadero, la Causa de causas."