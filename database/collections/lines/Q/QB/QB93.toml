[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਗ਼ੈਰਿ ਆਣ ਸਰਵਿ ਰਵਾਣ ਹਰਗਿਜ਼ ਨਿਆਇਦ ਦਰ ਨਜ਼ਰ ॥"

[[content]]
assets = ["KEGP"]
