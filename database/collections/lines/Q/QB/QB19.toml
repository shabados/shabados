[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਆਪਿ; ਸਰਬ ਪ੍ਰਤਿਪਾਲ ॥"
page = 887
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself cherishes all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਖੁਦ-ਬ-ਖੁਦ ਹੀ ਸਾਰਿਆਂ ਦੀ ਪਰਵਰਸ਼ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself cherishes all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਆਪ ਵਹੁ ਪਰਮੇਸ੍ਵਰ ਸਰਬ ਕੀ ਪ੍ਰਤਿਪਾਲਨਾ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੂੰ ਇਹ ਦਿੱਸ ਪੈਂਦਾ ਹੈ ਕਿ) ਪਰਮਾਤਮਾ ਆਪ ਹੀ ਸਭਨਾਂ ਦੀ ਪਾਲਣਾ ਕਰਨ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, el Señor Mismo lo sostiene todo y así (4-5-16)"