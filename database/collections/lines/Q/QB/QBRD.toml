data = "ਖੋਜੇ ਹੁਤੇ ਜਾਤ ਨਹਿ ਪਾਏ ॥੨੫॥"
page = 994

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Also she hid away his other weapons so that he could not find them.(25)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਖੋਜਣ ਤੇ ਵੀ ਲਭੇ ਨਹੀਂ ਜਾ ਸਕਦੇ ਸਨ ॥੨੫॥"