[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵਹੋ ਸੰਤ ਜਨਹੁ; ਗੁਣ ਗਾਵਹ ਗੋਵਿੰਦ ਕੇਰੇ ਰਾਮ ॥"
page = 775
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Come holymen, let us sing the glories of the World-Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨੇਕ ਪੁਰਸ਼ੋ! ਆਓ ਆਪਾਂ ਸ਼੍ਰਿਸ਼ਟੀ ਦੇ ਸੁਆਮੀ ਦੀਆਂ ਸਿਫਤਾਂ ਗਾਇਨ ਕਰੀਏ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Come, humble Saints, and sing the Glorious Praises of the Lord of the Universe."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋਂ! ਆਵੋ ਗੋਬਿੰਦ ਕੇ ਗੁਣ ਗਾਵੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! ਆਓ, (ਸਾਧ ਸੰਗਤਿ ਵਿਚ ਮਿਲ ਕੇ) ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦੇ ਰਹੀਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਵਹੋ = ਆਵਹੁ, ਆਓ। ਸੰਤ ਜਨਹੁ = ਹੇ ਸੰਤ ਜਨੋ! ਗਾਵਹ = ਆਓ, ਅਸੀਂ ਗਾਵੀਏ। ਕੇਰੇ = ਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y en nuestro hogar resuena la Melodía Divina."