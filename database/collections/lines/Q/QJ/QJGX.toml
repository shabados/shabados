[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਾਰਸ ਪਰਮ ਤਤ ਕੇ ਬੇਤਾ; ਮਹਾ ਪਰਮ ਕਰ ਮਾਨੇ ॥"
page = 684

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Those who were very wise amongst those hermits with matted locks,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਨ੍ਹਾਂ ਨੇ) ਪਾਰਸ ਨਾਥ ਨੂੰ ਪਰਮਤੱਤ ਦਾ ਜਾਣਨ ਵਾਲਾ ਅਤੇ ਮਹਾਨ ਤੇ ਪਰਮ ਸ੍ਰੇਸ਼ਠ ਕਰ ਕੇ ਮੰਨ ਲਿਆ।"