[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੁ ਮਾਰੇ; ਤਾ ਪਾਏ ਨਾਉ ॥੨॥"
page = 153
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If man effaces his self-conceit, he obtains the Name, then."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਬੰਦਾ ਆਪਣੀ ਸਵੈ-ਹੰਗਤਾ ਨੂੰ ਮੇਟ ਦੇਵੇ ਤਦ ਉਹ ਨਾਮ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Conquering self-conceit, one obtains the Name. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰੁ ਜੋ ਅਹੰ ਭਾਵ ਕੋ ਮਾਰੇਗਾ ਸੋ ਨਾਮ ਕੋ ਪਾਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਆਪਾ-ਭਾਵ ਨੂੰ ਖ਼ਤਮ ਕਰੇ, ਤਾਂ ਹੀ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਪ੍ਰਾਪਤ ਕਰ ਸਕਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੁ = ਆਪਾ-ਭਾਵ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cómo entonces puede uno concebir el Nombre del Señor, si no aporrea su ego? (2)"