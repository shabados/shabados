[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਹਨੇ ਕਰਵਾਰਿਨ ਸੋ; ਤਕਿ ਏਕਨ ਕੇ ਤਨਿ ਬਾਨ ਲਗਾਏ ॥"
page = 506

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many were killed with the sword and many by hitting their bodies with arrows"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕਨਾਂ ਨੂੰ ਤਲਵਾਰਾਂ ਨਾਲ ਮਾਰਿਆ ਅਤੇ ਇਕਨਾਂ ਦੇ ਸ਼ਰੀਰਾਂ ਨੂੰ ਤਕ ਤਕ ਕੇ ਬਾਣ ਮਾਰੇ।"