[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੋਰ ਨ ਦੀਸੈ; ਬੇਦ ਪੁਰਾਣੀ ॥"
page = 1022
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In Vedas and Puranas, I see not another."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵੇਦਾਂ ਅਤੇ ਪੁਰਾਣਾਂ ਵਿੰਚ ਮੈਨੂੰ ਹੋਰ ਕੋਈ ਦਿੱਸ ਨਹੀਂ ਆਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I can see no other in the Vedas and the Puraanas."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬੇਦੋਂ ਪੁਰਾਣੋਂ ਮੇਂ ਔਰ ਕਿਸੀ ਕੀ ਸਾਚੀ ਕੀਰਤੀ ਨਹੀਂ ਦੇਖੀਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵੇਦ ਪੁਰਾਣ ਆਦਿਕ ਧਰਮ-ਪੁਸਤਕਾਂ ਵਿਚ ਭੀ ਇਸ ਰਾਸਿ-ਪੂੰਜੀ ਤੋਂ ਬਿਨਾ ਕੋਈ ਹੋਰ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਪਦਾਰਥ ਨਹੀਂ ਦਿੱਸਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No puedo ver más en los Vedas ni en los Puranas."