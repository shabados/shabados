[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੁ ਨਾਨਕ; ਜਾ ਕਉ ਭਇਆ ਦਇਆਲਾ ॥"
page = 396
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The person unto whom Guru, O Nanak, is merciful,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੁਰਸ਼ ਜਿਸ ਉਤੇ ਗੁਰੂ ਮਿਹਰਬਾਨ ਹਨ, ਹੇ ਨਾਨਕ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That humble being, O Nanak, unto whom the Guru grants His Mercy,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਸ ਪਰ ਗੁਰੂ ਦਿਆਲ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਆਖ-) ਜਿਸ ਮਨੁੱਖ ਉੱਤੇ ਗੁਰੂ ਦਇਆਵਾਨ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਾ ਕਉ = ਜਿਸ ਮਨੁੱਖ ਉਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, aquél sobre quien se posa la Gracia del Guru,"