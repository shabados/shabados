[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰਾ ਸਾਹਿਬੁ ਅਤਿ ਵਡਾ; ਸਚੁ ਗਹਿਰ ਗੰਭੀਰਾ ॥"
page = 511
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Master is infinitely great, true, profound and unfathomable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂਡਾ ਮਾਲਕ ਬੇਅੰਤ ਵਿਸ਼ਾਲ, ਸੱਚਾ, ਡੂੰਘਾ ਅਤੇ ਅਥਾਹ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My Master is so very great, true, profound and unfathomable."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਸ੍ਵਾਮੀ ਬਹੁਤ ਵੱਡਾ ਹੈ, ਸਤ੍ਯ ਸਰੂਪ ਹੈ, ਡੂੰਘਾ ਅਰ ਨਿਹਚਲ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਮਾਲਕ ਪ੍ਰਭੂ ਬਹੁਤ ਹੀ ਵੱਡਾ ਹੈ, ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਹੈ, ਡੂੰਘਾ ਹੈ ਤੇ ਧੀਰਜ ਵਾਲਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਹਿਰ = ਡੂੰਘਾ। ਗੰਭੀਰ = ਧੀਰਜ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Maestro es lo más Alto de lo alto, Verdadero, Profundo e Insondable."