[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਉਸਰੁ ਚੁਕਾ, ਹਥਿ ਨ ਆਵੈ ॥੧੮॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The time lost cannot be regained."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਮਾਨੁਖ ਦੇਹ ਦਾ) ਸਮਾਂ ਚੁਕ ਗਿਆ ਫੇਰ ਹੱਥ ਨਹੀਂ ਆਊੂ।"