[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਗੁਰਮੁਖਿ ਮਿਲਿ ਰਹੇ; ਜਪਿ ਹਰਿ ਨਾਮਾ ਉਰ ਧਾਰਿ ॥੧੦॥"
page = 512
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By remembering God's Name and enshrining it in the mind, the Guru's-wards remain united with Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ ਸਿਮਰਨ ਕਰਨ ਅਤੇ ਇਸ ਨੂੰ ਹਿਰਦੇ ਅੰਦਰ ਟਿਕਾਉਣ ਦੁਆਰਾ, ਗੁਰੂ-ਸਮਰਪਨ ਉਸ ਨਾਲ ਜੁੜੇ ਹੋਏ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Gurmukhs remain united with Him, chanting the Name of the Lord, and enshrining it within their hearts. ||10||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਐਸੇ ਜੋ ਗੁਰਮੁਖ ਹੈਂ, ਸੋ ਹਰਿ ਨਾਮ ਜਪ ਕਰ ਕੇ ਔਰ ਹਰਿ ਕੋ ਅੰਤਸਕਰਨ ਮੇਂ ਧਾਰਨ ਕਰ ਕੇ ਹਰਿ ਮੇਂ (ਮਿਲਿ) ਅਭੇਦ ਹੋ ਰਹੇ ਹੈਂ॥੧੦॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿਣ ਵਾਲੇ ਬੰਦੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹਿਰਦੇ ਵਿਚ ਪਰੋ ਕੇ ਤੇ ਨਾਮ ਜਪ ਕੇ ਪਰਮਾਤਮਾ ਵਿਚ ਜੁੜੇ ਰਹਿੰਦੇ ਹਨ ॥੧੦॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਰ = ਹਿਰਦਾ ॥੧੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que enaltecen el Nombre del Señor en su mente y meditan en Él, es así como se unen con su Señor. (10)"