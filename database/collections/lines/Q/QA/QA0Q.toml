[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁਨਹੁ ਅਹੀਰਨ, ਬੈਨ; ਕਹਾ ਤੁਮ ਕਰਤ ਹੋ ॥"
page = 845

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Listen, you the milkmaid, what are you doing?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਜਰੀ! ਮੇਰੀ ਗੱਲ ਸੁਣ, ਤੂੰ ਕੀ ਕਰ ਰਹੀ ਹੈਂ।"