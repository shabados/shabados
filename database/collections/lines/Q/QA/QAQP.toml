data = "ਤਾ ਕੀ ਨਾਸ ਬਿਵਤ ਜਿਯ ਆਨੀ ॥"
page = 859

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Jat was rightly furious and planned to get rid of her."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਦੇ ਵਿਨਾਸ਼ ਦੀ ਵਿਉਂਤ ਮਨ ਵਿਚ ਵਿਚਾਰੀ।"