[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੈ ਸਿਖਿ; ਸਤਿਗੁਰੂ ਧਿਆਇਆ ॥"
page = 869
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru's Sikh ponders over true Guru alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦਾ ਸਿੱਖ ਕੇਵਲ ਸੱਚੇ ਗੁਰਾਂ ਦਾ ਹੀ ਆਰਾਧਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Sikh of the Guru meditates on the True Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰੋਂ ਕੇ ਸਿਖ ਹੈਂ ਤਿਨੋਂ ਨੇ ਸਤਿਗੁਰੂ ਕਾ ਧਿਆਨੁ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰੂ ਦੇ ਸਿੱਖ ਨੇ ਤਾਂ ਸਦਾ ਆਪਣੇ ਗੁਰੂ (ਦੇ ਚਰਨਾਂ) ਵਿਚ ਸੁਰਤ ਜੋੜੀ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ ਸਿਖਿ = ਦੇ ਸਿੱਖ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Devoto del Guru vive sólo en su Guru Verdadero,"