[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੈ ਬਚਨਿ; ਮੋਹਿ. ਪਰਮ ਗਤਿ ਪਾਈ ॥"
page = 239
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through Guru's Word, I have gained the supreme status."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਬਾਣੀ ਰਾਹੀਂ ਮੈਂ ਮਹਾਨ ਮਰਤਬਾ ਪਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Guru's Word, I have attained the supreme status."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਬਚਨ ਸੇ ਮੈਂ ਪਰਮਗਤੀ ਪਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਉਪਦੇਸ਼ ਉਤੇ ਤੁਰ ਕੇ ਮੈਂ ਸਭ ਤੋਂ ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ਹਾਸਲ ਕਰ ਲਈ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਚਨਿ = ਬਚਨ ਦੀ ਰਾਹੀਂ, ਉਪਦੇਸ਼ ਦੀ ਬਰਕਤਿ ਨਾਲ। ਮੋਹਿ = ਮੈਂ। ਪਰਮ ਗਤਿ = ਸਭ ਤੋਂ ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A través de la Palabra del Guru, he llegado al más Elevado Estado de Éxtasis."