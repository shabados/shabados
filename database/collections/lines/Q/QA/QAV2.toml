[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪੁਨਾ ਕੀਆ; ਜਾਨਹਿ ਆਪਿ ॥"
page = 1236
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His craftsmanship, He Himself knows."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਕਾਰੀਗਰੀ ਨੂੰ ਉਹ ਆਪੇ ਹੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone knows His handiwork."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨਾ ਕੀਆ ਹੂਆ ਜੋ ਪਰਪੰਚ ਹੈ ਤਿਸ ਕੋ ਆਪ ਹੀ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਆਪਣੇ ਰਚੇ (ਜਗਤ) ਨੂੰ ਤੂੰ ਆਪ ਹੀ ਜਾਣਦਾ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਨਹਿ = ਤੂੰ ਜਾਣਦਾ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo Él conoce la extensión de Sus propias acciones"