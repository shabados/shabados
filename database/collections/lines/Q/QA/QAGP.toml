[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਜਨਾ ਕੀ; ਪਗ ਪੰਕਜ ਧੂਰਿ ॥੩॥"
page = 1174
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They deem themselves the dust of the lotus feet of the saintly persons."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਊਹ ਆਪਣੇ ਆਪ ਨੂੰ ਸਾਧ-ਸਰੂਪ ਪੁਰਸ਼ਾਂ ਦੇ ਕੰਵਲ ਰੂਪੀ ਪੈਰਾਂ ਦੀ ਧੂੜ ਖਿਆਲ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They are the dust of the lotus feet of the humble Saints. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨੋਂ ਕੇ ਚਰਨ ਕਮਲੋਂ ਕੀ ਧੂਰੀ ਕੋ ਚਾਹਿਤੇ ਹੈਂ ਔਰ ਤਿਨ ਕਾ ਯੇਹ ਨਿਸਚਾ ਹੋਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸੰਤ ਜਨਾਂ ਦੇ ਸੋਹਣੇ ਚਰਨਾਂ ਦੀ ਧੂੜ (ਆਪਣੇ ਮੱਥੇ ਤੇ ਲਾਂਦੇ ਹਨ) ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੰਕਜ = ਕੌਲ ਫੁੱਲ। ਪਗ = ਪੈਰ। ਪਗ ਪੰਕਜ = ਕੌਲ ਫੁੱਲ ਵਰਗੇ ਸੋਹਣੇ ਚਰਨ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, añoro ser el polvo donde los Pies de Loto de estos Santos pasan a través. (3)"