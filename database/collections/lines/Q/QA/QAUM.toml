[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਜੁ ਮਨ ਮੇਰੇ; ਏਕੋ ਨਾਮ ॥"
page = 193
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meditate thou, O my mind, on the Name alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਕੇਵਲ ਨਾਮ ਦਾ ਆਰਾਧਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate, O my mind, on the One Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਏਕ ਨਾਮ ਕੋ ਜਪ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਇਕ ਪਰਮਾਤਮਾ ਦਾ ਹੀ ਨਾਮ ਸਿਮਰਦਾ ਰਹੁ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ ਮੇਰੇ = ਹੇ ਮੇਰੇ ਮਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Medita, oh mi mente, en el Único Nombre de Dios,"