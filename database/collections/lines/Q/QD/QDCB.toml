[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਹਉ ਕਰਮ ਕਮਾਣੇ ॥"
page = 1004
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As many as the deeds done in ego and pride,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿੰਨੇ ਭੀ ਕੰਮ ਕਾਜ ਹੰਕਾਰ ਅਤੇ ਹੰਗਤਾ ਅੰਦਰ ਕੀਤੇ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All the deeds done in egotism,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਜੀਵ ਨੇ ਹੰਤਾ ਮਮਤਾ ਕਰ ਕੇ ਕਰਮ ਕਮਾਣੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਉਮੈ ਦੇ ਆਸਰੇ ਜੀਵ (ਅਨੇਕਾਂ) ਕਰਮ ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ ਹਉ = ਮੈਂ ਮੈਂ, ਮੈਂ ਵੱਡਾ ਹਾਂ ਮੈਂ ਵੱਡਾ ਹਾਂ। ਕਰਮ = ਕੰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo que hace uno con egoísmo"