[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੁ ਆਦਿ ਪੁਰਖੁ; ਹਰਿ ਪਾਇਆ ॥੨॥"
page = 879
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and have obtained my God, the great Primal Being."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਵਿਸ਼ਾਲ ਪਰਾਪੂਰਬਲੇ ਪ੍ਰਭੂ ਨੂੰ ਪਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Guru, I have found the Lord, the Primal Being. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਤੇ ਆਦ ਪੁਰਖ ਜੋ ਸਭ ਸੇ (ਗੁਰ) ਬਡਾ ਹਰੀ ਹੈ, ਸੋ ਹਮਨੇ ਪਾਇਆ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਸਭ ਤੋਂ ਵੱਡੀ ਹਸਤੀ ਵਾਲਾ ਸਭ ਦਾ ਮੁੱਢ ਸਭ ਵਿਚ ਵਿਆਪਕ ਪ੍ਰਭੂ ਮਿਲ ਪਿਆ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por la Gracia del Guru uno logra al Ser Primordial, al Dios Supremo. (2)"