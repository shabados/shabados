[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਜੀਅ ਵਸਿ ਕੀਨੇ ॥"
page = 626
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and has make all the creatures subject to me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਾਰੇ ਜੀਵ ਇਖਤਿਆਰ ਵਿੱਚ ਕਰ ਦਿੱਤੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has made all creatures subject to me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਭ ਜੀਵ ਹਮਾਰੇ ਵਸ ਕਰ ਦੀਏ ਹੈਂ, ਵਾ ਸਰਬ ਇੰਦ੍ਰ੍ਯ ਹਮਾਰੇ ਜੀਵ ਕੇ ਵਸ ਕਰ ਦੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜੀਵਾਂ ਨੂੰ ਉਸ ਨੇ ਆਪਣੇ ਵੱਸ ਵਿਚ ਕਰ ਰੱਖਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ = {ਲਫ਼ਜ਼ 'ਜੀਵ' ਤੋਂ ਬਹੁ-ਵਚਨ}। ਵਸਿ = ਆਪਣੇ ਵੱਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que la creación entera está ahora influenciada por mí."