[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਤ ਤਪੀਸ੍ਵਰਨਿ ਕੀ ਸੁਨਿ ਬਾਸਵ; ਬੇਗਿ ਚਲਿਯੋ ਜਹਾ ਬਾਲ ਬਿਹਾਰੈ ॥"
page = 971

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Lord, conceding to this lady’s request, started to walk to the place where that Lady was."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਤਪਸਵੀ ਇਸਤਰੀ ਦੀ ਗੱਲ ਸੁਣ ਕੇ ਇੰਦਰ ਉਸ ਪਾਸੇ ਵਲ ਚਲ ਪਿਆ ਜਿਥੇ ਇਸਤਰੀ ਵਿਚਰ ਰਹੀ ਸੀ।"