[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਿਰਿ ਮੇਰ ਗਏ ਸਭ ਹੀ ਮੁਨਿ ਲੈ ਕੈ ॥"
page = 674

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In this way, the sage adopting twenty-four Gurus, went on the Sumeru mountain alongwith other sages"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਾਰਿਆਂ ਮੁਨੀਆਂ ਨੂੰ ਨਾਲ ਲੈ ਕੇ ਸੁਮੇਰ ਪਰਬਤ ਉਤੇ ਚਲਿਆ ਗਿਆ।"