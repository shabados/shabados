[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕਾ ਨਿੰਦਕੁ; ਪਰਮੇਸੁਰਿ ਮਾਰਾ ॥"
page = 280
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The slanderer of the saint is accursed of the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਦੀ ਨਿੰਦਾ ਕਰਨ ਵਾਲਾ ਪਾਰਬ੍ਰਹਮ ਦਾ ਮਾਰਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slanderer of the Saint is cursed by the Transcendent Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਕਾ ਨਿੰਦਕ ਪਰਮੇਸ੍ਵਰ ਕਾ ਮਾਰਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਰੱਬ ਵਲੋਂ ਫਿਟਕਾਰਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਮੇਸੁਰਿ = ਰੱਬ ਵਲੋਂ। ਮਾਰਾ = ਫਿਟਕਿਆ ਹੋਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "maldecido por su Dios."