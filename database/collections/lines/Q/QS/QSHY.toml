[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪੁਨਿ ਜੰਤ੍ਰ ਮੰਤ੍ਰ ਜਹਾ ਤਹਾ; ਨਹੀ ਤੰਤ੍ਰ ਕਰਤ ਕਛੂ ਡਰਹਿ ॥"
page = 554

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many mantras, yantras and tantras will spring up"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਜਿਥੇ ਕਿਥੇ ਜੰਤ੍ਰ ਮੰਤ੍ਰ ਅਤੇ ਤੰਤ੍ਰ ਕਰ ਕੇ (ਪਰਮ ਸੱਤਾ ਤੋਂ) ਡਰਨਾ ਬਿਲਕੁਲ ਛਡ ਦੇਣਗੇ।"