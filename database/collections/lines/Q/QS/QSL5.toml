[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਿਤਾ. ਹਉ ਜਾਨਉ ਨਾਹੀ; ਤੇਰੀ ਕਵਨ ਜੁਗਤਾ ॥"
page = 51
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Father! I know not which is Thy way.2"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਬਾਪੂ! ਮੈਂ ਨਹੀਂ ਜਾਣਦਾ ਤੇਰਾ ਕਿਹੜਾ ਤਰੀਕਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Father, I do not know-how can I know Your Way?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਮੇਸ੍ਵਰ! ਮੈਂ ਜੀਵ ਨਹੀਂ ਜਾਨ ਸਕਤਾ, ਤੇਰੀ ਪ੍ਰਾਪਤੀ ਮੇਂ ਕੌਣ ਸੀ ਜੁਗਤ ਪ੍ਰਧਾਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਿਤਾ-ਪ੍ਰਭੂ! ਮੈਨੂੰ ਪਤਾ ਨਹੀਂ ਕਿ ਤੈਨੂੰ ਪ੍ਰਸੰਨ ਕਰਨ ਦਾ ਕੇਹੜਾ ਤਰੀਕਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੁਗਤਾ = ਤਰੀਕਾ। ਤੇਰੀ ਕਵਨ ਜੁਗਤਾ = ਤੈਨੂੰ ਪ੍ਰਸੰਨ ਕਰਨ ਦਾ ਕੇਹੜਾ ਤਰੀਕਾ ਹੈ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Padre, no conozco cuál es Tu Sendero."