[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ. ਜਿਸੁ ਰਾਖਨਹਾਰਾ ॥"
page = 1148
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He whom the Saviour saves, in His mercy;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਮਿਹਰ ਅੰਦਰ ਜਿਸ ਦੀ ਰੱਖਣ ਵਾਲਾ ਰੱਖਿਆ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Protector, the Savior Lord, bestows His Mercy,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਜਿਸ ਕੋ ਪਰਮੇਸ੍ਵਰ ਰਾਖਨਹਾਰਾ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰੱਖਿਆ ਕਰਨ ਵਾਲਾ ਪ੍ਰਭੂ ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਮਿਹਰ ਕਰ ਕੇ (ਸਿਮਰਨ ਦੀ ਦਾਤ ਦੇਂਦਾ ਹੈ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél a quien el Señor salva en Su Misericordia,"