[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੁਖਿ ਝੂਠੈ. ਝੂਠੁ ਬੋਲਣਾ; ਕਿਉ ਕਰਿ ਸੂਚਾ ਹੋਇ ॥"
page = 56
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With false mouth man utters falsehood. How can he be pure?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੂੜੇ ਮੂੰਹ ਨਾਲ ਆਦਮੀ ਅਸੱਤ ਬੋਲਦਾ ਹੈ। ਉਹ ਕਿਸ ਤਰ੍ਹਾਂ ਪਵਿੱਤ੍ਰ ਹੋ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With false mouths, people speak falsehood. How can they be made pure?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਝੂਠੇ ਪੁਰਸ਼ ਕਾ ਝੂਠੁ ਬੋਲਣਾ ਤੋ ਮੁਖੁ ਹੈ ਔਰ ਸਭ ਗੌਣ ਹੈ, ਤਾਂ ਤੇ ਕਿਸ ਪ੍ਰਕਾਰ ਸੂਚਾ ਹੋਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਜੇਹਾ ਜੀਵ (ਕਿਸੇ ਬਾਹਰਲੇ ਸੁੱਚ ਆਦਿਕ ਕਰਮ ਨਾਲ ਅੰਦਰੋਂ) ਸੁੱਚਾ ਕਦੇ ਭੀ ਨਹੀਂ ਹੋ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si no hablas la Verdad, cómo podrán tus labios permanecer puros."