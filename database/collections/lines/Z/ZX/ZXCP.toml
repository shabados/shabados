data = "ਨਹਿ ਅੰਤ ਦੇਹ ਉਧਾਰ ॥"
page = 611

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "His family will be destroyed and at the and, his body will not be redeemed also"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਦੇਹ ਦਾ ਅੰਤ ਤਕ ਕਲਿਆਣ ਨਹੀਂ ਹੋਵੇਗਾ।"