[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਸੁੰਦਰ ਚਤੁਰ ਅਨੂਪ ਬਿਧਾਤੇ; ਤਿਸ ਸਿਉ ਰੁਚ ਨਹੀ. ਰਾਈ ॥"
page = 1213
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Winsome, wise and incomparable is thy Creator-Lord; with Him thou has not even an iota of love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੋਹਣਾ ਸੁਨੱਖਾ ਸਿਆਣਾ ਅਤੇ ਲਾਚਾਨੀ ਹੈ ਤੇਰਾ ਸਿਰਜਣਹਾਰ-ਸੁਆਮੀ, ਉਸ ਨਾਲ ਤੇਰਾ ਭੋਰਾ ਭਰ ਭੀ ਪਿਆਰ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is Beautiful, Wise and Incomparable; He is the Creator, the Architect of Destiny, but you have no love for Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਜੋ ਰੂਪ ਕਰ ਕੇ ਸੁੰਦ੍ਰ ਹੈ ਔਰ ਗੁਣੋਂ ਕਰ ਚਤੁਰ ਹੈ ਪੁਨਹ ਅਨੂਪਮ ਔ (ਬਿਧਾਤੇ) ਕਰਮ ਫਲ ਦਾਤੇ ਹੈਂ, ਤਿਸ ਕੇ ਸਾਥ (ਰਾਈ) ਰੰਚਕ ਮਾਤ੍ਰ (ਰੁਚ) ਪ੍ਰੀਤੀ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਸੁੰਦਰ ਹੈ, ਸੁਜਾਨ ਹੈ, ਉਪਮਾ-ਰਹਿਤ ਹੈ, ਰਚਨਹਾਰ ਹੈ-ਉਸ ਨਾਲ ਤੇਰੀ ਰਤਾ ਭੀ ਪ੍ਰੀਤ ਨਹੀਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਤੁਰ = ਸਿਆਣੇ। ਅਨੂਪ = {ਅਨ-ਊਪ} ਉਪਮਾ-ਰਹਿਤ। ਬਿਧਾਤੇ = ਸਿਰਜਣਹਾਰ। ਤਿਸੁ ਸਿਉ = ਉਸ ਨਾਲ। ਰੁਚ = ਪ੍ਰੀਤ। ਰਾਈ = ਰਤਾ ਭੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ganador es nuestro Señor, Sabio y de Belleza sin paralelo, nuestro Dios Creador, ¿por qué no estás apegado a Él aunque sea un poco?"