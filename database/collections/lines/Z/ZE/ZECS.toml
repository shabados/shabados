[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮਹਿ; ਕ੍ਰੋਧੁ ਮਹਾ ਅਹੰਕਾਰਾ ॥"
page = 1348
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within man's mind is wrath and excessive self-conceit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਨਸਾਨ ਦੇ ਚਿੱਤ ਅੰਦਰ ਗੁੱਸਾ ਅਤੇ ਅਤਿਅੰਤ ਸਵੈ-ਹੰਗਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Within the mind dwell anger and massive ego."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਮੇਂ ਕਾਮ ਕ੍ਰੋਧ ਅਹੰਕਾਰ ਆਦੀ ਵਿਕਾਰ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਮਨ ਵਿਚ ਕ੍ਰੋਧ ਟਿਕਿਆ ਰਹੇ, ਬਲੀ ਅਹੰਕਾਰ ਵੱਸਿਆ ਰਹੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਹਿ = ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En el interior de la mente habitan el enojo y el ego masivo,"