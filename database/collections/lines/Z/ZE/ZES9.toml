[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੰਚ ਚੋਰ ਕੀ; ਜਾਣੈ ਰੀਤਿ ॥"
page = 344
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and know the way of assault of the five thieves."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪੰਜਾ ਚੋਰਾਂ ਦੇ ਹਮਲਾ ਕਰਨ ਦੇ ਢੰਗ ਨੂੰ ਸਮਝ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "you must know the way the five thieves work."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੰਚ ਚੋਰ ਜੋ ਕਾਮਾਦੀ ਹੈਂ ਤਿਨ ਕੇ ਪਕੜਨੇ ਕੀ ਰੀਤਿ ਕੌ ਜਾਣੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਾਮਾਦਿਕ ਪੰਜ ਚੋਰਾਂ ਦਾ (ਹੱਲਾ ਕਰਨ ਦਾ) ਢੰਗ ਸਮਝ ਲੈਂਦਾ ਹੈ (ਇਸ ਤਰ੍ਹਾਂ ਉਹਨਾਂ ਦਾ ਵਾਰ ਹੋਣ ਨਹੀਂ ਦੇਂਦਾ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਣੈ = ਜਾਣ ਲੈਂਦਾ ਹੈ। ਰੀਤਿ = ਤਰੀਕਾ, ਢੰਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y conocer también la forma en que los cinco ladrones irrumpen en la mente de uno."