[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ; ਜਬ ਭਏ ਦਇਆਲ ॥"
page = 1298
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, when the Transcendent Lord becomes merciful,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਜਦ ਪਰਮ ਪ੍ਰਭੂ ਦਇਆਵਾਨ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Supreme Lord God becomes Merciful,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਪਾਰਬ੍ਰਹਮ ਦ੍ਯਾਲ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ (ਕਿਸੇ ਪ੍ਰਾਣੀ ਉੱਤੇ) ਪ੍ਰਭੂ ਜੀ ਦਇਆਵਾਨ ਹੁੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਇਆਲ = ਦਇਆਵਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando el Supremo Dios Nuestro Señor muestra su Misericordia,"