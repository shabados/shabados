[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੇਮੁਹਤਾਜੁ; ਪੂਰਾ ਪਾਤਿਸਾਹੁ ॥"
page = 184
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is the unconcerned Perfect King."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੁਛੰਦਗੀ-ਰਹਿਤ ਪੂਰਨ ਬਾਦਸ਼ਾਹ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Perfect King is self-sufficient."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਪੂਰਾ ਪਾਤਸ਼ਾਹ ਬੇ ਮੁਹਤਾਜ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਨੂੰ ਕਿਸੇ ਦੀ ਮੁਥਾਜੀ ਨਹੀਂ, ਉਹ ਸਭ ਗੁਣਾਂ ਦਾ ਮਾਲਕ ਹੈ, ਉਸ ਸਭ ਗੁਣਾਂ ਦਾ ਪਾਤਿਸ਼ਾਹ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El perfecto Rey es autosuficiente."