[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਲਧਾ; ਮਨ ਤਨ ਮੰਝਾ ॥੪॥੧੧॥"
page = 373
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak has found the Lord from within his mind and body."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੇ ਆਪਣੇ ਚਿੱਤ ਤੇ ਦੇਹਿ ਅੰਦਰੋਂ ਹੀ ਪ੍ਰਭੂ ਨੂੰ ਭਾਲ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak has found the Lord, within his mind and body. ||4||11||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਪ੍ਰਭੂ ਇਸੀ ਤਨ ਮਨ ਕੇ (ਮੰਝਾ) ਬੀਚ ਹੀ ਮਿਲਾ ਹੈ॥☬ਜੀਵ ਇਸਤ੍ਰੀ ਕੋ ਉਪਾਲੰਭ ਸਹਿਤ ਉਪਦੇਸ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਦੋਂ ਜੀਵ (ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ) ਪ੍ਰਭੂ ਨੂੰ ਮਿਲ ਪਿਆ ਉਸ ਦੀ (ਅੰਦਰਲੀ ਤ੍ਰਿਸ਼ਨਾ ਦੀ) ਭੜਕੀ ਮੁੱਕ ਗਈ, ਉਸ ਨੇ ਆਪਣੇ ਮਨ ਵਿਚ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ (ਵੱਸਦਾ) ਪ੍ਰਭੂ ਲੱਭ ਲਿਆ ॥੪॥੧੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਝਾ = ਵਿਚ ॥੪॥੧੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y oh, dice Nanak, el Señor me fue revelado dentro de mi propio ser. (4‑11)"