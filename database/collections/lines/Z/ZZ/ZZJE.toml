[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੀ ਟੇਕ; ਰਹੈ ਦਿਨੁ ਰਾਤਿ ॥"
page = 1148
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and he leans on the Lord day and night."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇ ਉਹ ਦਿਨ ਰੈਣ ਸਾਈਂ ਦੇ ਆਸਰੇ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Lean on God's Support, day and night."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਪੁਰਸ ਪਰਮੇਸ੍ਵਰ ਕੀ ਸਰਣ ਵਿਖੇ ਰਾਤਿ ਦਿਨ ਰਹਿਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਦਿਨ ਰਾਤ ਪਰਮਾਤਮਾ ਦੇ ਹੀ ਆਸਰੇ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਟੇਕ = ਆਸਰੇ। ਰਹੈ = ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que obtiene la Gracia de Dios,"