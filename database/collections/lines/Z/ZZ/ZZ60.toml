type = "primary"
data = "ਏਕ ਚਿਤ, ਜਿਹ ਇਕ ਛਿਨ ਧਿਆਇਓ ॥"
page = 11

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He Who meditates upon Him with single mind even for an instant"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਜਿਸ ਨੇ ਇਕਾਗ੍ਰ ਚਿੱਤ ਇਕ ਛਿਣ ਲਈ ਵੀ ਧਿਆਨ ਕੀਤਾ ਹੈ,"