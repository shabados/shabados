[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਵਿਚਿ ਦਿਤਾ; ਹਉ ਵਿਚਿ ਲਇਆ ॥"
page = 466
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In pride he gives, in pride he takes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੰਕਾਰ ਅੰਦਰ ਉਹ ਦਿੰਦਾ ਹੈ, ਹੰਕਾਰ ਅੰਦਰ ਹੀ ਉਹ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In ego they give, and in ego they take."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੇਨਾ ਲੇਨਾ ਹੰਕਾਰ ਕਰ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਇਸ ਅੱਡਰੀ ਹੋਂਦ ਦੀ ਹੱਦਬੰਦੀ ਵਿਚ ਹੀ ਰਹਿ ਕੇ ਕਦੇ (ਕਿਸੇ ਲੋੜਵੰਦੇ ਨੂੰ) ਦੇਂਦਾ ਹੈ, ਕਦੇ (ਆਪਣੀ ਲੋੜ ਨੂੰ ਪੂਰੀ ਕਰਨ ਲਈ ਕਿਸੇ ਪਾਸੋਂ) ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En el ego uno es verdadero, o engaña como un vil mentiroso;"