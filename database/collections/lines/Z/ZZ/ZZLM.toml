[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰੀਰਹੁ ਭਾਲਣਿ; ਕੋ ਬਾਹਰਿ ਜਾਏ ॥"
page = 124
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If some one goes beyond one's body (self) in search for the Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਕੋਈ ਜਣਾ ਆਪਣੇ ਤੋਂ ਪਰੇ ਪ੍ਰਭੂ ਦੀ ਢੂੰਡ ਭਾਲ ਵਿੱਚ ਜਾਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who look outside the body, searching for the Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੋਈ ਸਰੀਰ ਕੇ ਬਾਹਰ ਭਾਲਣ ਜਾਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਜੇ ਕੋਈ ਮਨੁੱਖ ਆਪਣੇ) ਸਰੀਰ ਤੋਂ ਬਾਹਰ (ਜੰਗਲ ਵਿੱਚ ਪਹਾੜਾਂ ਦੀਆਂ ਗੁਫ਼ਾਂ ਵਿੱਚ ਇਸ ਆਤਮਕ ਚਾਨਣ ਨੂੰ) ਲੱਭਣ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰੀਰਹੁ ਬਾਹਰਿ = ਸਰੀਰ ਤੋਂ ਬਾਹਰ (ਜੰਗਲਾਂ ਵਿਚ, ਪਹਾੜਾਂ ਦੀਆਂ ਗੁਫ਼ਾਂ ਵਿਚ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Buscando el Nombre del Señor fuera de uno mismo,"