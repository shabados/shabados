[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਮਨਿ ਤਨਿ. ਵਸਿਆ ਸੋਈ ॥"
page = 629
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the Lord abides in my mind and body,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਆਮੀ ਮੇਰੇ ਚਿੱਤ ਤੇ ਸਰੀਰ ਵਿੱਚ ਵਸਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord abides in my mind and body."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸੋਈ) ਹੇ ਸੋਭਾ ਵਾਲੇ ਪਰਮੇਸ੍ਵਰ! ਜਿਸਕੇ ਮਨ ਤਨ ਮੇਂ ਤੂ ਬਸਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਮਨੁੱਖ ਦੇ ਮਨ ਵਿਚ ਤਨ ਵਿਚ ਉਹ ਪਰਮਾਤਮਾ ਹੀ ਵੱਸਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਤਨਿ = ਤਨ ਵਿਚ। ਸੋਈ = ਉਹ (ਪਰਮਾਤਮਾ) ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi cuerpo y mi mente están imbuidos en el Señor;"