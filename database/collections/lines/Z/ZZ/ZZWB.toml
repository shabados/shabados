[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧ ਜਨਾਂ ਕੈ ਚਰਨ ਲਾਗਿ ॥"
page = 1272
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Clinging to the feet of the holy persons,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨੇਕ ਪੁਰਸ਼ਾਂ ਦੇ ਪੈਰਾਂ ਨਾਲ ਜੁੜ ਕੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Grasping the feet of the Holy,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਪ੍ਰਾਣੀ ਸਾਧ ਜਨੋਂ ਕੀ ਚਰਨੀ ਲਾਗ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨਾਂ ਦੇ ਚਰਨਾਂ ਵਿਚ ਜੁੜ ਕੇ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ ਚਰਨ ਲਾਗਿ = ਦੇ ਚਰਨਾਂ ਵਿਚ ਟਿੱਕ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "al aferrarse a los Pies de los Santos."