[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਦਰਿ ਕਰਹਿ. ਜੇ ਆਪਣੀ; ਤਾ ਨਦਰੀ ਸਤਿਗੁਰੁ ਪਾਇਆ ॥"
page = 465
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If the merciful Master shows His mercy, then, is the True Guru obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਮਿਹਰਬਾਨ ਮਾਲਕ ਆਪਣੀ ਮਿਹਰ ਧਾਰੇ, ਤਦ ਹੀ ਸੱਚੇ ਗੁਰੂ ਜੀ ਪਾਏ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If the Merciful Lord shows His Mercy, then the True Guru is found."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਹਰੀ ਅਪਨੀ ਕ੍ਰਿਪਾ ਦ੍ਰਿਸ਼ਟ ਕਰੈ, ਤੋ (ਨਦਰੀ) ਕ੍ਰਿਪਾ ਸੇ ਦੇਖਨੇ ਹਾਰਾ ਅਰਥਾਤ ਰਖ੍ਯਕ ਸਤਿਗੁਰੂ ਪ੍ਰਾਪਤ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜੇ ਤੂੰ (ਜੀਵ ਉੱਤੇ) ਮਿਹਰ ਦੀ ਨਜ਼ਰ ਕਰੇਂ, ਤਾਂ ਉਸ ਨੂੰ ਤੇਰੀ ਕਿਰਪਾ-ਦ੍ਰਿਸ਼ਟੀ ਨਾਲ ਸਤਿਗੁਰੂ ਮਿਲ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਦਰਿ = ਮਿਹਰ ਦੀ ਨਜ਼ਰ। ਕਰਹਿ = (ਹੇ ਪ੍ਰਭੂ! ਤੂੰ) ਕਰਹਿ। ਨਦਰੀ = ਤੇਰੀ ਮਿਹਰ ਦੀ ਨਜ਼ਰ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el Señor muestra Su Misericordia, uno recibe al Verdadero Guru en su corazón"