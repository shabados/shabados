[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕਾ ਉਪਦੇਸੁ ਸੁਨੀਜੈ ॥"
page = 895
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hear thou the Guru's instruction,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਗੁਰਾਂ ਦੀ ਸਿੱਖਮਤ ਸੁਣ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So listen to the Guru's Teachings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕਾ ਉਪਦੇਸ ਤੂੰ ਸੁਣ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਗੁਰੂ ਦਾ (ਇਹ ਨਾਮ ਸਿਮਰਨ ਦਾ) ਉਪਦੇਸ਼ (ਸਦਾ) ਸੁਣਨਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਨੀਜੈ = ਸੁਣਨਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escucha entonces la Instrucción del Gran Guru"