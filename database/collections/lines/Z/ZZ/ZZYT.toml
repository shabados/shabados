[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਾ ਕੈ ਅੰਤਰਿ; ਨਹੀ ਸੰਤੋਖੁ ॥"
page = 872
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within his mind there is no contentment."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਮਨ ਅੰਦਰ ਸੰਤੁਸ਼ਟਤਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Deep within, there is no contentment."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਬਿਨਾ ਭੋਜਨ ਖਾਏ ਉਨ ਪਰਾਹੁਣਿਓਂ ਕੇ ਮਨ ਅੰਤਰ ਸੰਤੋਖ ਨਹੀਂ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਘਰ ਦੇ ਮਾਲਕ ਦੇ ਹਿਰਦੇ ਵਿਚ ਭੀ ਧਰਵਾਸ ਨਹੀਂ ਬਣਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਾ ਕੈ ਅੰਤਰਿ = ਉਸ ਗ੍ਰਿਹਸਤੀ ਦੇ ਮਨ ਵਿਚ ਭੀ। ਸੰਤੋਖੁ = ਖ਼ੁਸ਼ੀ, ਧਰਵਾਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y en lo profundo no hay agradecimiento."