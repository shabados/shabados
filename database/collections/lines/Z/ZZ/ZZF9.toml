[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਮ੍ਰਿਤੁ ਨਾਮੁ ਤੇਰਾ; ਸੋਈ ਗਾਵੈ ॥"
page = 100
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone sings Thine ambrosial Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਤੇਰੇ ਸੁਧਾਰਸ ਨਾਮ ਦਾ ਗਾਇਨ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone sings Your Ambrosial Naam,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਅੰਮ੍ਰਿਤ ਰੂਪ ਨਾਮ ਕੋ ਸੋਈ ਗਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਲਕ-ਪ੍ਰਭੂ! ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਤੇਰਾ ਨਾਮ ਉਹੀ ਮਨੁੱਖ ਗਾ ਸਕਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਮ੍ਰਿਤ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Solamente aquél a quien Tú bendices,"