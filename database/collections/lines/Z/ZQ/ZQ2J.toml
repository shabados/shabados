[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਟਕਾ ਟਕਾ, ਬੀਰਾ ਜੁਤ ਦੈਹੌ ॥"
page = 859

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘No’ she said without any hesitation, ‘I will definitely give each one of them a coin of takka."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪਾਨ ਦੇ ਬੀੜੇ ਸਹਿਤ ਇਕ ਇਕ ਟਕਾ (ਸਭ ਨੂੰ) ਦੇਵਾਂਗੀ।"