[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਕੀ ਸੇਵਾ ਕਰਿ ਨੀਤ ॥"
page = 896
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and always perform thou His service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਤੂੰ ਹਮੇਸ਼ਾਂ ਹੀ ਉਸ ਦੀ ਟਹਿਲ ਕਮਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "And continually serve Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਤਿਸ ਕੀ ਸੇਵਾ ਨਿਤ ਹੀ ਕਰਿ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਿੱਤਰ! ਉਸ ਪ੍ਰਭੂ ਦੀ ਸਦਾ ਸੇਵਾ-ਭਗਤੀ ਕਰਿਆ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੀਤ = ਨਿੱਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en Él y sírvelo"