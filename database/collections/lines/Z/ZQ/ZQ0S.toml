[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੁਰਬਾਣੁ ਜਾਈ; ਗੁਰ ਪੂਰੇ ਅਪਨੇ ॥"
page = 1340
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "A sacrifice am I unto my Perfect Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਲਿਹਾਰ ਵੰਝਦਾ ਹਾਂ, ਮੈਂ ਆਪਣੇ ਪੂਰਨ ਗੁਰਦੇਵ ਜੀ ਤੋਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to my Perfect Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਪੂਰਨ ਸਤਿਗੁਰੋਂ ਪਰ ਮੇਂ ਕੁਰਬਾਨ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਉਸ ਪੂਰੇ ਗੁਰੂ ਤੋਂ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ (ਆਪਣੇ ਆਪ ਨੂੰ ਗੁਰੂ ਦੇ ਹਵਾਲੇ ਕਰਦਾ ਹਾਂ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਈ = ਜਾਈਂ, ਮੈਂ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi ser en sacrificio a mi Guru Perfecto,"