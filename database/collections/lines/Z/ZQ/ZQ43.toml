data = "(ਤੇਰਾ ਸੇਵਕ) ਨਾਨਕ (ਤੇਰੇ ਦਰ ਤੇ) ਇਕ ਅਰਜ਼ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕੁ ਕਰੈ = ਨਾਨਕ ਕਰਦਾ ਹੈ। ਅਰਦਾਸਿ = ਬੇਨਤੀ।"

