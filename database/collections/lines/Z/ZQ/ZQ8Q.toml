[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇੰਦ੍ਰ ਉਪਿੰਦ੍ਰ ਚਕੇ ਸਬੈ; ਚਿਤ ਚਉਕਿਯੋ ਸਸਿ ਭਾਨੁ ॥"
page = 646

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Indra, Upendra, Surya, Chandra etc. all marveled in their mind and"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇੰਦਰ, ਉਪਿੰਦਰ ਆਦਿ ਸਾਰੇ ਚਿਤ ਵਿਚ ਹੈਰਾਨ ਹੋ ਰਹੇ ਹਨ ਅਤੇ ਸੂਰਜ ਤੇ ਚੰਦ੍ਰਮਾ ਵੀ ਚੌਂਕ ਗਏ ਹਨ।"