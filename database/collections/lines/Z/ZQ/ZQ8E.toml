[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਉ; ਆਪਿ ਕਰਹਿ ਫੁਰਮਾਨੁ ॥੩॥"
page = 200
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "for whom, the Lord Himself issues the command."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਲਈ ਪ੍ਰਭੂ ਖੁਦ ਹੁਕਮ ਜਾਰੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the Lord Himself issues His Royal Command. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਤੂੰ ਆਪ ਗੁਰ ਉਪਦੇਸ ਰੂਪ ਹੁਕਮ ਕਰਤਾ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਸੇਵਕ) ਦੇ ਵਾਸਤੇ ਤੂੰ ਆਪ ਹੁਕਮ ਕਰਦਾ ਹੈਂ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫੁਰਮਾਨੁ = ਹੁਕਮ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Honor de uno es aprobado y uno recibe el Sello de la Verdad.(3)"