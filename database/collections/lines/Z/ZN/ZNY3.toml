[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ. ਪੁਰਖ ਗੁਣਤਾਸਿ ॥"
page = 1147
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I make supplication to be merciful unto me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿ ਉਹ ਮੇਰੇ ਉਤੇ ਦਇਆਵਾਨ ਹੋਣ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Primal Lord God, Treasure of Virtue, please bless me with Your Grace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਨੋ ਕੇ (ਤਾਸਿ) ਸਮੂਹ ਪੂਰਨ ਪੁਰਖ! ਹਮਾਰੇ ਪੁਰ ਕ੍ਰਿਪਾ ਦ੍ਰਿਸ੍ਟੀ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ, ਆਖਦਾ ਰਹੁ- ਹੇ ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਮਾਲਕ! ਹੇ ਗੁਣਾਂ ਦੇ ਖ਼ਜ਼ਾਨੇ ਅਕਾਲ ਪੁਰਖ! ਮਿਹਰ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੁਰਖ ਗੁਣਤਾਸਿ = ਹੇ ਗੁਣਾਂ ਦੇ ਖ਼ਜ਼ਾਨੇ ਅਕਾਲ ਪੁਰਖ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ten Compasión de mí, oh Purusha,"