[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਸਨਾ ਰਮਹੁ; ਰਾਮ ਗੁਣ ਨੀਤ ॥"
page = 185
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "if the praises of Pervading God are ever repeated with the tongue."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਜੀਭ ਦੇ ਨਾਲ ਹਮੇਸ਼ਾਂ ਹੀ ਵਿਆਪਕ ਵਾਹਿਗੁਰੂ ਦਾ ਜੱਸ ਉਚਾਰਣ ਕੀਤਾ ਜਾਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Repeat constantly with your tongue the Glorious Praises of the Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਹਬਾ ਕਰ ਕੇ ਨਿਤੰਪ੍ਰਤੀ ਰਾਮ ਕੇ ਗੁਣ ਜਪੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਜੀਭ ਨਾਲ ਸਦਾ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੇ ਗੁਣ ਗਾਂਦਾ ਰਹੁ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸਨਾ = ਜੀਭ (ਨਾਲ)। ਰਮਹੁ = ਸਿਮਰੋ, ਜਪੋ। ਨੀਤ = ਨਿੱਤ, ਸਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Repite con tu lengua las alabanzas del Señor constantemente."