[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਨ ਜਪਹੁ; ਕਵਨ ਮਤਿ ਲਾਗੇ ॥"
page = 792
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou rememberst not the Lord. To what mal-inclinations art thou attached?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਾਹਿਬ ਦਾ ਸਿਮਰਨ ਨਹੀਂ ਕਰਦਾ। ਤੂੰ ਕਿਹੜੀਆਂ ਮੰਦ ਰੁਚੀਆਂ ਨਾਲ ਜੁੜਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You have not meditated on the Lord; what thoughts are you attached to?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਭਾਗੇ ਜੀਵ! ਰਾਮ ਨਹੀਂ ਜਪਤੇ ਕਿਸ ਖੋਟੀ ਸਿਖਿਆ ਮੇਂ ਲਾਗੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਨਹੀਂ ਸਿਮਰਦਾ, ਕਿਹੜੀ (ਕੋਝੀ) ਮੱਤੇ ਲੱਗਾ ਹੋਇਆ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਜਪਹੁ = ਤੂੰ ਨਹੀਂ ਸਿਮਰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No habitas en Dios, entonces, ¿a qué otra cosa te dedicas?"