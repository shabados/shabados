[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਾਵਤ ਗਾਵਤ ਗੀਤ ਸੁਭ; ਬਨ ਮੈ ਧਸਿਯੋ ਨਿਸੰਗ ॥੭॥"
page = 843

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And had proceeded jovially towards the woods, singing all the way.(7)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਗੀਤ ਗਾਉਂਦਾ ਹੋਇਆ ਜੰਗਲ ਵਿਚ ਨਿਸੰਗ ਚਲਾ ਗਿਆ ॥੭॥"