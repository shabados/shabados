[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਹਿਰ ਗੰਭੀਰੁ; ਗਹੀਰੁ ਸੁਜਾਨਾ ॥"
page = 283
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is Unfathomable, profound, Deep and all-wise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਅਥਾਹ, ਸੰਜੀਦਾ, ਡੂੰਘਾ ਅਤੇ ਸਰਬ-ਸਿਆਣਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Unfathomable, Profound, Deep and All-knowing."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਸਰਬ ਸੇ (ਗਹਿਰ) ਡੂੰਘਾ ਔ (ਗੰਭੀਰੁ) ਨਿਰਹਲ (ਗਹੀਰੁ) ਗ੍ਰਹਣ ਕਰਨੇ ਵਾਲਾ (ਸੁਜਾਨਾ) ਚਤਰ ਹੈ॥☬ਤਾਂ ਤੇ ਤਿਸ ਕੇ ਆਗੇ ਐਸੇ ਬੇਨਤੀ ਕਰੋ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਬੜਾ ਗੰਭੀਰ ਹੈ ਤੇ ਡੂੰਘਾ ਹੈ, ਸਿਆਣਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਹੀਰੁ = ਡੂੰਘਾ। ਸੁਜਾਨਾ = ਸਿਆਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es la Profundidad y el Discernimiento."