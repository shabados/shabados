data = "ਤਬ ਹੀ ਤਹ ਕੋ ਬਰ ਦੋਇ ਦੀਏ ॥੧੫॥"
page = 201

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "At that time, the king could not understand the mystery (of the boons) and gave his consent for them.15."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਵੇਲੇ ਉਸ ਨੂੰ ਦੋ ਵਰ ਦੇਣੇ ਮੰਨ ਲਏ ॥੧੫॥"