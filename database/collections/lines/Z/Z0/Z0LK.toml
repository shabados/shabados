[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜ਼ਿ ਖ਼ੰਜਰ ਵ ਗੁਰਜੋ ਵ ਬਕਤਰ ਹਜ਼ਾਰ ॥੯੮॥"
page = 1421

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He provided (them) thousands of daggers, and laced them with armours,(98)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਹਜ਼ਾਰਾਂ ਖ਼ੰਜਰ, ਗੁਰਜ ਅਤੇ ਕਵਚ ਤਿਆਰ ਕਰਵਾਏ ॥੯੮॥"