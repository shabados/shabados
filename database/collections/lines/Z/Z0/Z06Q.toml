[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕਾ. ਹਰਿ ਸਰਨਾਇ ॥੩॥"
page = 838
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak seeks the refuge of God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਵਾਹਿਗੁਰੂ ਦੀ ਪਨਾਹ ਲੋੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak seeks the Sanctuary of the Lord. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਹਰੀ! ਯਾਂ ਤੇ ਹਮ ਤੇਰੀ ਸਰਨ ਆਇ ਪ੍ਰਾਪਤ ਭਏ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਆਖ-) ਹੇ ਹਰੀ! ਮੈਂ ਤੇਰੀ ਸਰਨ ਆਇਆ ਹਾਂ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ = ਹੇ ਹਰੀ! ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por eso busco Tu Santuario, oh Dios.  (3)"