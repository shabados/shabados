[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਗੁਰਮੁਖਿ ਨਾਮੁ ਪਿਆਰਿ ॥੪॥੯॥"
page = 1129
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Nanak, love thou the Lord's Name, by the Guru's grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਤੂੰ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਨਾਲ ਪ੍ਰੇਮ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Gurmukh loves the Naam. ||4||9||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਤਿਸ ਕੇ ਨਾਮ ਜਪਨੇ ਮੇਂ ਪ੍ਯਾਰ ਕਰੋ॥੪॥੯॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਿਹੜਾ ਪਰਮਾਤਮਾ ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ ਦੀ ਮਰਯਾਦਾ ਨੂੰ ਆਪਣੀ ਸੱਤਿਆ ਨਾਲ ਤੋਰ ਰਿਹਾ ਹੈ ॥੪॥੯॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਿਆਰਿ = ਪਿਆਰ ਕਰ, ਪਿਆਰ ਨਾਲ ਹਿਰਦੇ ਵਿਚ ਵਸਾਓ ॥੪॥੯॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ama el Nombre, por la Gracia del Guru. (4-9)"