data = "ਅਬ ਚੇਰੋ ਮੈ ਭਯੋ ਤਿਹਾਰੋ ॥"
page = 992

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Listen, Rani, you have endowed me a new life, now I am your slave."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਮੈਂ ਤੇਰਾ ਦਾਸ ਹੋ ਗਿਆ ਹਾਂ।"