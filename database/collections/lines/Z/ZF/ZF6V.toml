[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹ੍ਵੈ ਪ੍ਰਸੰਨ︀ਯ ਪਾਇਨ ਪਰੀ ਜਗਤ ਗੁਰੂ ਠਹਰਾਇ ॥੨੫॥"
page = 1015

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She was appeased and, believing them to be the gurus of the world, bent and paid her obeisance.(25)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਿਰ (ਉਸ ਨੂੰ) ਜਗਤ ਗੁਰੂ ਮਿਥ ਕੇ ਝੁਕ ਕੇ ਪੈਰੀਂ ਪਈ ॥੨੫॥"