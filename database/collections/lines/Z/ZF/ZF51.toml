[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਭੇਟੇ; ਤਾ ਏਕੋ ਪਾਏ ॥"
page = 842
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If man meets with the True Guru, then attains he to the Unique Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਇਨਸਾਨ ਸੱਚੇ ਗੁਰਾਂ ਨੂੰ ਮਿਲ ਪਵੇ, ਤਦ ਉਹ ਅਦੁੱਤੀ ਸਾਹਿਬ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting the True Guru, one finds the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਕੋ ਮਿਲੇ ਤੇ ਤਿਸ ਏਕ ਸਰੂਪ ਕੋ ਪਾਇ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ (ਮਨੁੱਖ ਨੂੰ) ਗੁਰੂ ਮਿਲ ਪਏ, ਤਾਂ ਉਹ ਉਸ ਪਰਮਾਤਮਾ ਦਾ ਮਿਲਾਪ ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੇਟੇ = ਮਿਲ ਪਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es ungido en la Puerta del Señor con la Palabra del Shabd del Guru."