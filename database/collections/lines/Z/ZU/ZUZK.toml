data = "ਭਾਤ ਭਾਤ ਅਨੇਕ ਧੂਪ; ਸੁ ਧੂਪੀਐ ਤਿਹ ਆਨ ॥"
page = 140

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many types of fragrant materials were ignited there."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਰ੍ਹਾਂ ਤਰ੍ਹਾਂ ਦੇ ਧੂਪ ਲਿਆ ਲਿਆ ਕੇ ਧੁਖਾਏ ਜਾ ਰਹੇ ਸਨ।"