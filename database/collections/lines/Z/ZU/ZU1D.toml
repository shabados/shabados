[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਆ ਮਾਇਆ ਮਹਿ; ਜਨਮਹਿ ਮਰਨਾ ॥"
page = 252
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In this mammon the mortal continues coming and going."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਮੋਹਨੀ ਅੰਦਰ ਪ੍ਰਾਣੀ ਆਉਂਦਾ ਅਤੇ ਜਾਂਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In this Maya, they are born and die."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਮਾਇਆ ਮੇਂ ਲਗ ਕਰ ਕੇ ਜਨਮਣਾ ਅਰ ਮਰਣਾ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਵਿਸ਼ਿਆਂ ਦੇ ਸੁਆਦਾਂ ਨਾਲ ਚੰਬੜੇ ਰਹਿੰਦੇ ਹਨ, ਤੇ ਇਸ ਮਾਇਆ ਵਿਚ ਫਸ ਕੇ ਜਨਮ ਮਰਨ (ਦੇ ਗੇੜ ਵਿਚ ਪੈ ਜਾਂਦੇ ਹਨ।)"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así nace para morir una y otra vez,"