[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਨਾਮੁ ਲਇਆ; ਜੋਤੀ ਜੋਤਿ ਰਲੇ ॥"
page = 705
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's grace, I have uttered the name and my light is merged in the Supreme Light."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਮੈਂ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕੀਤਾ ਹੈ ਅਤੇ ਮੇਰਾ ਪ੍ਰਕਾਸ਼, ਪਰਮ ਪ੍ਰਕਾਸ਼ ਨਾਲ ਅਭੇਦ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As Gurmukh, I chant the Naam, and my light has merged into the Light."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਨਾਮ ਉਪਦੇਸ਼ ਲੀਆ, ਤਿਸੀ ਤੇ ਜੋਤੀ ਕੀ ਜੋਤ ਮੇਂ ਹਮ ਰਲੇ ਹੈਂ ਅਰਥਾਤ ਅਭੇਦ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਨ੍ਹਾਂ ਨੇ ਭੀ) ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਿਆ ਹੈ, ਉਹਨਾਂ ਦੀ ਜਿੰਦ ਪਰਮਾਤਮਾ ਦੀ ਜੋਤੀ ਵਿਚ ਲੀਨ ਰਹਿੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ। ਜੋਤੀ = ਪ੍ਰਭੂ ਦੀ ਜੋਤੀ ਵਿਚ। ਜੋਤਿ = ਸੁਰਤਿ, ਜਿੰਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Como Gurmukj canto el Naam, y mi luz se ha inmergido en la Luz Divina."