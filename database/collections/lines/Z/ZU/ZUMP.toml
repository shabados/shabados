[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਪਨੈ ਬਿੰਦੁ; ਨ ਦੇਈ ਝਰਨਾ ॥"
page = 1160
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who allows not his seed to drop even in dream;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਪਣੇ ਵੀਰਜ ਨੂੰ ਸੁਫਨੇ ਵਿੱਚ ਡਿੱਗਣ ਨਹੀਂ ਦਿੰਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He does not lose his semen, even in his dreams;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਪਨੇ ਮੇਂ ਭੀ (ਬਿੰਦੁ) ਬੀਰਜ ਕੋ ਝਰਨੇ ਨਾ ਦੇਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੁਪਨੇ ਵਿਚ ਭੀ ਕਾਮ ਦੀ ਵਾਸ਼ਨਾ ਮਨ ਵਿਚ ਨਾਹ ਆਉਣ ਦੇਵੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿੰਦੁ = ਬੀਰਜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y no desperdicia su esperma ni aún en sueños."