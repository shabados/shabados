[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਵਹ ਮਾਗਤਿ ਸੋਊ ਦਯੋ; ਤਬ ਦੇਤ ਸਮੈ ਰਸ ਮੈ ਮਨ ਭੀਨੋ ॥"
page = 452

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Whatever they had asked for, the king handed it over affectionately"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਝ ਉਹ ਮੰਗਦੇ ਸਨ, ਓਹੀ ਉਸੇ ਵੇਲੇ ਦੇ ਦਿੱਤਾ ਅਤੇ ਦੇਣ ਵੇਲੇ (ਰਾਜੇ ਦਾ) ਮਨ (ਪ੍ਰੇਮ) ਰਸ ਵਿਚ ਭਿਜਿਆ ਹੋਇਆ ਸੀ।"