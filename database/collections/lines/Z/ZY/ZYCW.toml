[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭਿ ਅਪਨੈ ਵਰ ਦੀਨੇ ॥"
page = 626
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Lord has given me His blessings,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸੁਆਮੀ ਨੇ ਮੈਨੂੰ ਆਪਣੀ ਅਸੀਸ ਦਿੱਤੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My God has given me His Blessing."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਪ੍ਰਭੂ ਨੇ ਹਮ ਕੋ ਐਸੇ ਵਰ ਦੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! ਪਿਆਰੇ ਪ੍ਰਭੂ ਨੇ (ਜੀਵਾਂ ਨੂੰ) ਸਭ ਬਖ਼ਸ਼ਸ਼ਾਂ ਕੀਤੀਆਂ ਹੋਈਆਂ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ। ਵਰ = ਬਖ਼ਸ਼ਸ਼ਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor me ha bendecido con este regalo:"