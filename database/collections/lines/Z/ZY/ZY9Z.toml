[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪੁਨੇ ਸਤਿਗੁਰ ਕਉ; ਸਦ ਬਲਿ ਜਾਈ ॥"
page = 663
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto my True Guru, I am ever a sacrifice."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਸੱਚੇ ਗੁਰਦੇਵ ਜੀ ਉਤੋਂ ਮੈਂ ਹਮੇਸ਼ਾਂ ਹੀ ਵਾਰਨੇ ਵੰਞਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am forever a sacrifice to my True Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸੀ ਤੇ ਹਮ ਅਪਨੇ ਸਤਿਗੁਰੋਂ ਕਉ ਸਦਾ ਬਲਿਹਾਰ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਮੈਂ ਆਪਣੇ ਗੁਰੂ ਤੋਂ ਸਦਾ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ, ਤੋਂ। ਸਦ = ਸਦਾ। ਬਲਿ ਜਾਈ = ਬਲਿ ਜਾਈਂ, ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco para siempre mi ser en sacrificio al Verdadero Guru;"