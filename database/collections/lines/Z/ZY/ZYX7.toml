[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਮਨਿ; ਗੁਰ ਕੀ ਪਰਤੀਤਿ ॥"
page = 283
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He whose heart has faith in the Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਦਿਲ ਅੰਦਰ ਗੁਰਾਂ ਉਤੇ ਭਰੋਸਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who has faith in the Guru in his mind"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਮਨ ਮੇਂ ਗੁਰੋਂ ਕੇ ਸਬਦ ਕੀ ਪਰਤੀਤਿ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਮਨ ਵਿਚ ਸਤਿਗੁਰੂ ਦੀ ਸਰਧਾ ਬਣ ਗਈ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਤੀਤਿ = ਯਕੀਨ, ਸਰਧਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor mora en la vida de aquél que tiene Fe en el Guru."