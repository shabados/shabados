[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਨ ਨਿਹਾਰਿ ਮਨ ਮੈ ਕਹਿਯੋ; ਇਹ ਚਿੰਤਾ ਕੀ ਠੌਰ ॥੧੫੦੨॥"
page = 447

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the god of dissolution came himself in the battlefield, them the field itself indeed became the field of anxiety.1502."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਯੁੱਧ-ਭੂਮੀ ਨੂੰ ਵੇਖ ਕੇ (ਸ਼ਿਵ ਨੇ) ਮਨ ਵਿਚ ਕਿਹਾ ਕਿ ਇਹ ਤਾਂ ਚਿੰਤਾ ਦਾ ਮੌਕਾ ਹੈ ॥੧੫੦੨॥"