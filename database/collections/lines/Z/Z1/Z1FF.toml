[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਨ ਭਏ ਮਨੋਰਥ ਸਾਭ ॥"
page = 891
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Singing His praise, all my desires are fulfilled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਜੱਸ ਗਾਇਨ ਕਰਨ ਦੁਆਰਾ ਮੇਰੀਆਂ ਸਾਰੀਆਂ ਖਾਹਿਸ਼ਾਂ ਪੂਰੀਆਂ ਹੋ ਗਈਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All my hopes have been fulfilled."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਮਨੋਰਥ ਤਿਨੋਂ ਕੇ ਪੂਰਨ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਸਾਰੇ ਮਨੋਰਥ ਪੂਰੇ ਹੋ ਗਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਭ = ਸਭ, ਸਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo a través de Su Alabanza las esperanzas se realizan."