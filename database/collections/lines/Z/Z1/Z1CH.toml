[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਾਤੁਰਤਾ ਸੰਗ ਜੋ ਹਰਿ ਕੋ ਜਸੁ; ਬੀਚ ਕਬਿਤਨ ਕੇ ਸੁ ਬਨੈ ਹੈ ॥"
page = 550

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Whosoever will sing the songs of Krishna with love, describe his glory in a nice way in poetry,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ (ਕਵੀ) ਸਿਆਣਪ ਨਾਲ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਦੇ ਯਸ਼ ਨੂੰ ਕਵਿਤਾ ਵਿਚ ਬੰਨ੍ਹਦਾ ਹੈ।"