[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ ਪੂਰਨ ਬਖਸੰਦ ॥"
page = 866
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The supreme Lord is the Perfect Pardoner."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ਰੋਮਣੀ ਸਾਹਿਬ ਪੂਰਾ ਬਖਸ਼ਣਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Lord God is the Perfect Forgiver."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਪਾਰਬ੍ਰਹਮ ਜੋ ਸਭ ਮੇਂ ਪੂਰਨ ਹੈ ਪੁਨਹ ਦਾਸੋਂ ਕੇ ਔਗਨੇਂ ਕੋ ਬਖਸਨੇ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਰਬ-ਵਿਆਪਕ ਅਤੇ ਬਖ਼ਸ਼ਸ਼ ਕਰਨ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਖਸੰਦ = ਬਖ਼ਸ਼ਸ਼ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues mi Dios Supremo nos bendice a todos."