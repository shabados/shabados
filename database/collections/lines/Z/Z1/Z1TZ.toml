line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many millions are created wealthy."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਕ੍ਰੋੜ ਧਨਾਢ ਬਣਾਏ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions are created wealthy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਈ ਕ੍ਰੋੜੋਂ ਜੀਵ ਵਾਹਿਗੁਰੂ ਨੇ ਧਨਵੰਤ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
