[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮੁ; ਸਾਧ ਰਿਦ ਬਸੈ ॥"
page = 272
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Supreme Lord abides in the mind of a saint."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ਰੋਮਣੀ ਸਾਹਿਬ ਸੰਤ ਦੇ ਮਨ ਅੰਦਰ ਨਿਵਾਸ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Lord God dwells in the hearts of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਪਾਰਬ੍ਰਹਮ ਸੰਤੋਂ ਕੇ ਰਿਦੇ ਮੇਂ ਨਿਵਾਸ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਕਾਲ ਪੁਰਖ ਸੰਤ ਜਨਾਂ ਦੇ ਹਿਰਦੇ ਵਿਚ ਵੱਸਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਿਦ = ਹਿਰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios Mismo reside en el corazón de Su Santo"