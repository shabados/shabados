[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਥਹਰੰਤ ਧੁਜਾ ਚਮਕੰਤ ਅਨੀ ॥"
page = 663

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The king took the four division of his army with him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਝੰਡੇ ਝੁਲ ਰਹੇ ਹਨ ਅਤੇ ਤਿਖੀਆਂ ਤਲਵਾਰਾਂ ਚਮਕ ਰਹੀਆਂ ਹਨ (ਜਾਂ ਝੰਡਿਆਂ ਉਤੇ ਲਗੀਆਂ ਨੋਕਾਂ ਚਮਕ ਰਹੀਆਂ ਹਨ)।"