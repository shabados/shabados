[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜਪੀਐ; ਭਇ ਸਚਿ ਪਿਆਰਿ ॥"
page = 424
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Imbued with His fear and hearty love, One ought to remember God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਡਰ ਅਤੇ ਦਿਲੀ ਪ੍ਰੀਤ ਨਾਲ ਰੰਗੀਜ ਕੇ ਆਦਮੀ ਨੂੰ ਵਾਹਿਗੁਰੂ ਦਾ ਆਰਾਧਨ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate on the Lord, and be imbued with fear and love of the True One."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭੈ ਅਰ ਪਿਆਰ ਧਾਰ ਕਰ ਸਚੇ ਹਰੀ ਕੋ ਜਪੀਐ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਡਰ-ਅਦਬ ਵਿਚ ਰਹਿ ਕੇ ਸਦਾ-ਥਿਰ ਹਰੀ ਦੇ ਪ੍ਰੇਮ ਵਿਚ ਮਸਤ ਹੋ ਕੇ ਹਰੀ-ਨਾਮ ਦਾ ਜਾਪ ਹੀ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਇ = ਭਉ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, uno debe contemplar al Señor e imbuirse en Su Amor y en Su Reverencia,"