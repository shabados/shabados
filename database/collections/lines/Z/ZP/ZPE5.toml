[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਮ ਮਰਣ ਦੂਖ ਤੇ ਰਾਖੈ ॥"
page = 1271
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He saves man from the pain of birth and death,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਬੰਦੇ ਨੂੰ ਜੰਮਣ ਤੇ ਮਰਨ ਦੀ ਪੀੜ ਤੋਂ ਬਣਾ ਲੈਂਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He saves us from the pains of death and birth,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਜਨਮ ਮਰਣ ਕੇ ਦੁਖ ਸੇ ਰਾਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੰਮਣ ਮਰਨ ਦੇ ਗੇੜ ਦੇ ਦੁੱਖਾਂ ਤੋਂ ਬਚਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ। ਰਾਖੈ = ਬਚਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él nos salva de las penas de la muerte y del renacimiento,"