type = "primary"
data = "ਤੁਹੀ ਨੰਦ ਕੇ ਧਾਮ ਮੈ ਔਤਰੈਗੀ ॥"
page = 810

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "You incarnated in the house of Nand (as Krishna),"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਨੰਦ ਦੇ ਘਰ (ਕ੍ਰਿਸ਼ਨ ਰੂਪ ਵਿਚ) ਅਵਤਾਰ ਲੈਣ ਵਾਲੀ ਹੈਂ।"