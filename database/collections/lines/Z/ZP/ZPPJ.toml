type = "primary"
data = "ਇਕ ਚਛ ਭਯੋ ਦਿਜ ਰਾਇ ॥੧੮॥"
page = 172

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "It pierced the eye of Shukrachraya and thus one eye of the preceptor Shukraccharya was lost.18."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨਾਲ) ਸ਼ੁਕ੍ਰਾਚਾਰਯ ਇਕ ਅੱਖ ਵਾਲਾ ਹੋ ਗਿਆ ॥੧੮॥"