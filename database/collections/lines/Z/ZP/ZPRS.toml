[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਧਨੀ ਤ︀ਯਾਗਿ ਨਿਰਧਨ ਕੇ ਕੋ ਗ੍ਰਿਹ ਜਾਵਈ ॥"
page = 831

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Who would like to go to poor man’s house after leaving the richman?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਧਨੀ ਨੂੰ ਤਿਆਗ ਕੇ ਗ਼ਰੀਬ ਦੇ ਘਰ ਕੌਣ ਜਾਵੇਗਾ।"