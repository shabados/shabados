[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿਤੰ ਤਿਆਗ ਰੋਗੰ ॥੨੫੫॥"
page = 655

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He was the goer to all the places, the remover of sins, beyond all ailments and the one who remained a pure Yogi.255."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਰੋਗਾਂ ਨੂੰ ਤਿਆਗਣ ਵਾਲਾ ਹੈ ॥੨੫੫॥"