[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਡਭਾਗੀ ਸਤਿਗੁਰੁ ਮਿਲੈ; ਮੁਖਿ ਅੰਮ੍ਰਿਤੁ ਪਾਈਐ ॥"
page = 163
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the greatest good lock is met the True Guru who puts nectar in his mouth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੁਹੁਤ ਚੰਗੇ ਭਾਗਾਂ ਦੁਆਰਾ ਸੱਚੇ ਗੁਰੂ ਜੀ ਮਿਲਦੇ ਹਨ, ਜੋ ਉਸ ਦੇ ਮੂੰਹ ਵਿੱਚ ਸੁਧਾਰਸ ਪਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By great good fortune, one meets the True Guru, who places the Ambrosial Nectar in the mouth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਵੱਡੇ ਭਾਗੋਂ ਕਰ ਸਤਿਗੁਰੂ ਮਿਲੈ ਤਬ ਨਾਮ ਅੰਮ੍ਰਤ ਕੋ ਮੁਖ ਮੇਂ ਪਾਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਵੱਡੇ ਭਾਗਾਂ ਨਾਲ ਗੁਰੂ ਮਿਲ ਪੈਂਦਾ ਹੈ, ਉਸ ਦੇ ਮੂੰਹ ਵਿਚ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਰਸ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਖਿ = ਮੂੰਹ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por una buena fortuna, nos encontramos con el Guru Verdadero y saboreamos el Néctar del Naam, el Nombre."