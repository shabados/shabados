[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾਣ ਹੋਦੇ; ਹੋਇ ਨਿਤਾਣਾ ॥"
page = 1384
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "be powerless, even when blessed with power,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਕਤਵਰ ਹੁੰਦਾ ਹੋਇਆ ਭੀ ਨਿਤਾਕਤਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "if you are powerful, be weak;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਤਾਣ) ਬਲ ਕੇ ਹੋਤਿਆਂ ਹੀ ਨਿਰਬਲ ਹੋਇ ਰਹੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜ਼ੋਰ ਹੁੰਦਿਆਂ ਕਮਜ਼ੋਰਾਂ ਵਾਂਗ ਜੀਵੇ (ਭਾਵ, ਕਿਸੇ ਉਤੇ ਧੱਕਾ ਨਾ ਕਰੇ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾਣੁ = ਜ਼ੋਰ, ਤਾਕਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si eres poderoso, muéstrate débil;"