[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਖੁ ਦਰਦੁ; ਇਸੁ ਤਨ ਤੇ ਜਾਇ ॥੧॥ ਰਹਾਉ ॥"
page = 741
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Anguish and pain shall thus flee from this body of thine. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਕਸ਼ਟ ਤੇ ਪੀੜ ਤੇਰੀ ਇਸ ਦੇਹ ਤੋਂ ਪਰੇ ਭਜ ਜਾਣਗੇ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Pain and suffering shall leave this body. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਇਸ ਤਨ ਤੇ ਦੂਖ ਜਨ੍ਯ ਦਰਦ ਚਲੇ ਜਾਵੇਂਗੇ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇਹੜਾ ਮਨੁੱਖ ਇਹ ਉੱਦਮ ਕਰਦਾ ਹੈ ਉਸ ਦੇ) ਇਸ ਸਰੀਰ ਤੋਂ ਹਰੇਕ ਕਿਸਮ ਦਾ ਦੁੱਖ-ਕਲੇਸ਼ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ। ਜਾਇ = ਚਲਾ ਜਾਂਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y el dolor y el sufrimiento se alejarán de ti. (1-Pausa)"