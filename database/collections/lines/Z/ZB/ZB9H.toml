type = "primary"
data = "ਜ਼ਿ ਨੇਜ਼ਹ ਵ ਨਾਚਖ਼ ਵ ਨਾਵਕ ਸਿਪਰ ॥੬੫॥"
page = 1402

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Spears, lances, steel-arrows and shields.(65)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨੇਜ਼ਿਆਂ, ਬਰਛਿਆਂ, ਬਾਣਾਂ ਅਤੇ ਢਾਲਾਂ (ਆਦਿ ਅਸਤ੍ਰਾਂ-ਸ਼ਸਤ੍ਰਾਂ) ਨਾਲ ਯੁੱਧ ਹੋਇਆ ॥੬੫॥"