[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਰਬ ਮਾਨ ਤ੍ਰਿਮਾਨ ਦੇਵ; ਅਭੇਵ ਆਦਿ ਉਦਾਰ ॥"
page = 5
line = 2

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Worshipped by all and venerated by three gods, Thou art without difference and art Generous from the very beginning."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਭ ਦਾ ਮਾਣ, ਤਿੰਨ ਦੇਵਤਿਆਂ ਦੁਆਰਾ ਮੰਨਣਯੋਗ, ਅਭੇਦ ਅਤੇ ਮੁੱਢ-ਕਦੀਮ ਤੋਂ ਉਦਾਰ ਹੈਂ;"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਸਰਬ ਮਾਨ ਤ੍ਰਿਮਾਨ ਦੇਵ; ਅਭੇਵ ਆਦਿ ਉਦਾਰ ॥"