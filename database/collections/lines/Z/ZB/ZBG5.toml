[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਉ ਨਾਮਾ. ਹਰਿ ਕਰਤਾ ਰਹੈ ॥੧੩॥"
page = 1166
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "even then, I Nama, shall continue uttering the God's Name\". (N.B. Nama was given three hours to re-animate the cow, otherwise he was to suffer death)."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਭੀ, ਮੈ ਨਾਮਾ, ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਦਾ ਰਹਾਗਾਂ।\" (ਨੋਟ-ਨਾਮੇ ਨੂੰ ਗਾਂ ਸੁਰਜੀਤ ਕਰਨ ਲਈ ਕੇਵਲ ਤਿੰਨ ਘੰਟੇ ਦਿਤੇ ਗਏ ਸਨ)।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I will still continue singing the Praises of the Lord.\" ||13||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੌ ਭੀ ਨਾਮਾ ਤੋ ਹਰੀ ਨਾਮੁ ਜਪੁ ਹੀ ਕਰਤਾ ਰਹੇਗਾ॥੧੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਭੀ ਨਾਮਾ ਹਰੀ ਦੇ ਗੁਣ ਗਾਂਦਾ ਰਹੇਗਾ (ਤੇ ਦਬਾਉ ਵਿਚ ਆ ਕੇ ਖ਼ੁਦਾ ਖ਼ੁਦਾ ਨਹੀਂ ਆਖੇਗਾ) ॥੧੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "seguiría yo cantando siempre el Nombre de Ram. (13)"