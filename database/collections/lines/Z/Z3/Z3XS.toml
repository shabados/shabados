[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤ ਤੇਰੇ ਦਇਆਲ; ਓਨੑਾ ਮਿਹਰ ਪਾਇ ॥"
page = 522
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Merciful Master, Thy slaves are Thine and Thou blesseth them with Thy grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਿਹਰਬਾਨ ਮਾਲਕ! ਤੇਰੇ ਗੋਲੇ ਤੈਂਡੇ ਹੀ ਹਨੈ। ਤੂੰ ਉਹਨਾਂ ਨੂੰ ਆਪਣੀ ਰਹਿਮਤ ਦੀ ਦਾਤ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Merciful Lord, You bless Your devotees with Your Grace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਿਆਲ! ਜੋ ਤੇਰੇ ਭਗਤ ਹੈਂ ਉਨ ਪਰ ਤੂੰ ਮਿਹਰ (ਪਾਇ), ਭਾਵ ਕਰਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਇਆਲ ਪ੍ਰਭੂ! ਬੰਦਗੀ ਕਰਨ ਵਾਲੇ ਬੰਦੇ ਤੇਰੇ ਹੋ ਕੇ ਰਹਿੰਦੇ ਹਨ, ਤੂੰ ਉਹਨਾਂ ਤੇ ਕਿਰਪਾ ਕਰਦਾ ਹੈਂ;"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor Misericordioso, Tú Bendices a Tus Devotos con Tu Gracia."