[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਖ ਨਾਠੇ; ਸੁਖ ਆਇ ਸਮਾਏ ॥"
page = 191
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Pain flees, peace comes and takes its place,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਰਦ ਦੌੜ ਜਾਂਦਾ ਹੈ ਅਤੇ ਆਰਾਮ ਆ ਕੇ, ਉਸ ਦੀ ਥਾਂ ਲੈ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Pain is driven far away, and peace comes in its place;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅੰਤਹਕਰਣ ਸੇ ਦੁਖ ਭਾਗ ਗਏ ਹੈਂ ਔਰ ਸੁਖ ਆਇ ਸਮਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਸਾਰੇ ਦੁੱਖ ਦੂਰ ਹੋ ਗਏ, ਉਸ ਦੇ ਅੰਦਰ (ਸਾਰੇ) ਸੁਖ ਆ ਕੇ ਟਿਕ ਗਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਇ = ਆ ਕੇ। ਸਮਾਇ = ਰਚ ਗਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Al Comando del Guru,"