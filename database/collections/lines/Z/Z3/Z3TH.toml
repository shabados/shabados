data = "ਦਰਿਯਾ ਖਾ ਕੇ ਜਾਤ ਗ੍ਰਿਹ ਭਈ ॥"
page = 910

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The wise maid understood everything and went to the house of Dariya Khan."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਦਰਿਆ ਖਾਂ ਦੇ ਘਰ ਚਲੀ ਗਈ।"