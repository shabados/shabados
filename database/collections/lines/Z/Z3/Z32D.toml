[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮਕਲੀ ਮਹਲਾ ੧ ਦਖਣੀ ਓਅੰਕਾਰੁ ॥"
page = 929
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ramkali 1st Guru Dakhni Onkar."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਮਕਲੀ ਪਹਿਲੀ ਪਾਤਿਸ਼ਾਹੀ ਦੱਖਣੀ ਓਅੰਕਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raamkalee, First Mehl, Dakhanee, Ongkaar:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਰਾਮਕਲੀ ਵਿੱਚ ਗੁਰੂ ਨਾਨਕਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਦਖਣੀ ਓਅੰਕਾਰੁ'।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ramkali, Mejl Guru Nanak, Primer Canal Divino, Dakjani, Ong Kar."