[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਖੇਲਤ ਥੀ ਤੁਮ ਸੋ ਬਨ ਮੈ; ਤਿਹ ਅਉਸਰ ਕੀ ਕਬਹੂੰ ਸੁਧਿ ਕੀਜੈ ॥"
page = 393

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "We used to play with you some time, O Krishna! do remember that occasion some time"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਨ ਵਿਚ ਤੁਹਾਡੇ ਨਾਲ ਖੇਡਦੀ ਸਾਂ, ਉਸ ਅਵਸਰ ਨੂੰ ਕਦੀ ਯਾਦ ਕਰੋ।"