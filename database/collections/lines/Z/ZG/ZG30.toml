[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਛਾਰ ਕਰੋ ਗਰੂਏ ਗਿਰ ਰਾਜਹਿ; ਚੰਡਿ ਪਚਾਰਿ ਹਨੋ ਬਲੁ ਕੈ ਕੈ ॥"
page = 88

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Reduce the great mountain of the goddess to dust and with all your strength challenge and kill her.”,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜਿਸ ਵਡੇ ਪਰਬਤ ਉਤੇ ਚੰਡੀ ਬੈਠੀ ਹੈ, (ਉਸ ਨੂੰ) ਮਿੱਟੀ ਕਰ ਦਿਉ ਅਤੇ ਬਲ ਪੂਰਵਕ ਚੰਡੀ ਨੂੰ ਲਲਕਾਰ ਕੇ ਮਾਰ ਦਿਉ।"