[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਕਿਉ ਬਿਸਰੈ; ਜਿ. ਕੀਆ ਜਾਨੈ ॥"
page = 289
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why forget Him who acknowledges what is done for Him?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕਿਉਂ ਭੁਲਾਈਏ, ਜੋ ਉਸ ਲਈ ਕੀਤੀ ਗਈ ਕਾਰ ਦੀ ਕਦਰ ਕਰਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Why forget Him, who acknowledges what we do?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਸੋ ਕਿਉਂ ਵਿਸਰੈ ਜੋ ਕੀਆ ਹੂਆ ਕਰਮ ਸਭ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੀਤੀ ਕਮਾਈ ਨੂੰ ਚੇਤੇ ਰੱਖਦਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀਆ = ਕੀਤਾ, ਕੀਤੀ ਹੋਈ ਕਮਾਈ। ਜਾਨੈ = ਚੇਤੇ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y que reconoce cualquier cosa que por Él hagamos?"