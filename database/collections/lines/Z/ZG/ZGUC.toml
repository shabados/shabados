[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਰਭ ਘੋਰ ਮਹਿ; ਰਾਖਨਹਾਰੁ ॥"
page = 863
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and who saves the mortal in the terrible womb;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜੋ ਭਿਆਨਕ ਬੱਚੇਦਾਨੀ ਅੰਦਰ ਪ੍ਰਾਣੀ ਦੀ ਰੱਖਿਆ ਕਰਦਾ ਹੈ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "he protects those in the terrible womb."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਗਰਭ ਜੋ (ਘੋਰ) ਭਇਆਨਕ ਨਰਕ ਹੈ ਤਿਸ ਮੇਂ ਸੇ ਭੀ ਵਹੁ ਰਖਿਆ ਕਰਨੇਹਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜੇਹੜਾ ਭਿਆਨਕ ਗਰਭ ਵਿਚ ਰੱਖਿਆ ਕਰਨ ਜੋਗਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘੋਰ = ਭਿਆਨਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien nos protege en las profundidades del vientre materno,"