[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਢਿ ਕਾਗਲੁ; ਦਸੇ ਰਾਹੁ ॥"
page = 471
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Pulling out the calendar, he shows the way."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੱਤ੍ਰੀ ਕੱਢ ਕੇ ਉਹ ਰਸਤਾ ਵਿਖਾਲਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "reading their horoscopes, he shows them the way."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਕਢਿ) ਨਿਕਾਲ ਕਰ (ਕਾਗਲੁ) ਪੁਸਤਕ ਸਗਨ ਸਾਸਤ੍ਰ ਕਾ ਰਸਤਾ ਬਤਾਉਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਪੱਤ੍ਰੀ ਸੋਧ ਸੋਧ ਕੇ ਉਹਨਾਂ ਨੂੰ ਰਸਤਾ ਦੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਗਲੁ = ਕਾਗਦ, ਪੱਤ੍ਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y leyéndole los horóscopos, enseña el camino a todos."