[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਥੋਕ; ਸੁਨੀਅਹਿ ਘਰਿ ਤਾ ਕੈ ॥"
page = 284
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All articles I have heard are in His palace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਵਸਤੂਆਂ, ਮੈਂ ਸੁਣਿਆ ਹੈ, ਉਸ ਦੇ ਮਹਿਲ ਵਿੱਚ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have heard that all things are in His home."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਘਰ ਮੇਂ ਸੰਪੂਰਨ (ਥੋਕ) ਪਦਾਰਥ ਸੁਣੀਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ ਦੇ) ਸਾਰੇ ਪਦਾਰਥ ਉਸ ਦੇ ਘਰ ਵਿਚ (ਮੌਜੂਦ) ਸੁਣੀਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਨੀਅਹਿ = ਸੁਣੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es la total Alegría y la Plenitud del Éxtasis."