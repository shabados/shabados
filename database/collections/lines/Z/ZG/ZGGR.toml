[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਧਨੁ; ਜਾ ਕੈ ਗ੍ਰਿਹਿ ਵਸੈ ॥"
page = 212
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak the distress departs in the company of him,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਉਸ ਦੀ ਸੰਗਤ ਵਿੱਚ ਤਕਲੀਫ ਦੂਰ ਹੋ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those whose inner homes are filled with the Lord's wealth"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਘਰ ਮੇਂ ਹਰੀ ਨਾਮ ਧਨ ਵਸਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਦੇ ਹਿਰਦੇ-ਘਰ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਧਨ ਆ ਵੱਸਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੈ ਗ੍ਰਿਹਿ = ਜਿਨ੍ਹਾਂ ਦੇ ਹਿਰਦੇ-ਘਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que atesora al Señor en su hogar,"