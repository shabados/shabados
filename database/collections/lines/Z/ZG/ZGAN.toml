[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਤੇ ਬਿਸਰਿਓ ਸਗਲੋ ਧੰਧਾ; ਗੁਰ ਕੀ ਚਰਣੀ ਲਾਏ ॥੧॥"
page = 671
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have forsaken all the worldly affairs from me mind and the Lord has attached me to the Guru's feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਚਿੱਤ ਤੋਂ ਸਾਰੇ ਸੰਸਾਰੀ ਕਾਰ ਵਿਹਾਰ ਭੁਲਾ ਛੱਡੇ ਹਨ ਅਤੇ ਸਾਹਿਬ ਨੇ ਮੈਨੂੰ ਗੁਰਾਂ ਦੇ ਪੈਰਾਂ ਨਾਲ ਜੋੜ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have forgotten all worldly entanglements, and I am attached to the Guru's feet. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਪੂਰਨ ਧੰਧਿਓਂ ਕਾ ਸਮੁਦਾਇ ਮਨ ਤੇ ਬਿਨਸ ਗਿਆ ਹੈ ਔਰ ਸਰਬ ਪ੍ਰਕਾਰ ਸੇ ਪ੍ਰਮੇਸ੍ਵਰ ਨੇ ਗੁਰੋਂ ਕੇ ਚਰਨੀ ਲਗਾਏ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਗੁਰੂ ਦੀ ਚਰਨੀਂ ਲਾ ਕੇ ਮਨ ਤੋਂ ਸਾਰਾ ਝਗੜਾ-ਝੰਬੇਲਾ ਲਹਿ ਗਿਆ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ। ਸਗਲੋ ਧੰਧਾ = ਹਰੇਕ ਕਿਸਮ ਦਾ ਝਗੜਾ-ਝੰਬੇਲਾ। ਲਾਏ = ਲਾ ਕੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "me he desecho de mis apegos y me he podido postrar a los Pies del Guru. (1)"