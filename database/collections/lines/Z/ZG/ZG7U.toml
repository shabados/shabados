[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਤਰ ਸਾਠਿ ਮਿਲਿ ਜੋਗਨੀ ਗੀਤ ਗਾਯੋ ॥"
page = 932

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Shiva beat his drum too and all the sixty-four female yogis, began their singing."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਚੌਂਹਠ ਜੋਗਣਾਂ ਨੇ ਮਿਲ ਕੇ ਗੀਤ ਗਾਇਆ।"