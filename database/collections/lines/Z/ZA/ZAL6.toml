type = "primary"
data = "ਤੰਬੋਲੀ, ਤੋਸਕਚੀ ਸੁਹਾਈ ॥੨੦॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Betel sellers and incharge of store room for precious articles of their own glory."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਾਨਾਂ ਵਾਲੇ ਤੇ ਤੋਸ਼ਕਚੀ (ਕਈ) ਸੁਹਾਉਂਦੇ ਹਨ।"