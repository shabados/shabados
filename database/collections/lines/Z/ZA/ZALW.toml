[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਉਣ ਪਾਣੀ ਬੈਸੰਤਰੋ; ਚਉਥੀ ਧਰਤੀ ਸੰਗਿ ਮਿਲਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Air, water, fire and earth was put together."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਵਾਯੂ, ਪਾਣੀ, ਅੱਗ ਤੇ ਚੌਥੀ ਧਰਤੀ ਨਾਲ ਮੇਲ ਦਿੱਤੀ ਤੇ"