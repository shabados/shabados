[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਰੂਪ ਅਨੂਪ ਸਰੂਪ ਅਤਿ; ਗੰਧ ਸੁਗੰਧ ਹੋਇ ਮਹਕੰਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Lotuses are of beautiful form and they make the environment fragrant."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਰੂਪ (ਅਨੁਪਮ) ਸੁੰਦਰ, ਹੈ, ਸਰੂਪ ਡਾਢਾ ਹੈ, (ਹੋਰਾਂ) ਗੰਧਾਂ (ਨਾਲੋਂ) ਸੁਗੰਧੀ (ਬੀ ਅਤਿ ਸੂਖਮ ਤੇ ਨਿਰਾਲੀ) ਮਹਿਕ ਰਖਦੀ ਹੈ।"