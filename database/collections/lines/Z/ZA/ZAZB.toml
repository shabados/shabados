[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਤਾ ਕਉ; ਮਿਲੇ ਮੁਰਾਰੀ ॥੨੪॥"
page = 255
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Nanak, him, Lord, the Killer of Mur (demon) meets."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਨੂੰ ਮੁਰ (ਰਾਖਸ਼) ਦੇ ਮਾਰਨ ਵਾਲਾ ਪ੍ਰਭੂ ਮਿਲ ਪੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, meets the Lord. ||24||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਪੁਰਸ ਕੋ ਵਾਹਗੁਰੂ ਮਿਲਤਾ ਹੈ॥੨੪॥☬ਜੇ ਕਹੇ ਹੰਕਾਰ ਨਿਬ੍ਰਤੀ ਕਾ ਸਾਧਨ ਕਹੀਏ? ਸੋ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸੇ ਨੂੰ ਪਰਮਾਤਮਾ ਮਿਲਦਾ ਹੈ ॥੨੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਰਾਰੀ = ਪਰਮਾਤਮਾ ॥੨੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, sólo recibirá al Señor, (24)"