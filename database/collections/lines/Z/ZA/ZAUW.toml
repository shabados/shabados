[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੂਰਜ ਇੰਦ੍ਰ ਸਨਾਦਿਕ ਜੇ; ਸੁਰ ਹੂੰ ਮਿਲਿ ਕੈ ਜਸੁ ਤਾਹਿ ਉਚਾਰਿਓ ॥"
page = 430

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The gods like Surya, Indra, Sanak, Sanandan etc., began to describe his praises"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੂਰਜ, ਇੰਦਰ, ਸਨਕਾਦਿਕ ਜਿਤਨੇ ਦੇਵਤੇ ਹਨ, (ਉਨ੍ਹਾਂ ਸਾਰਿਆਂ ਨੇ) ਮਿਲ ਕੇ ਉਸ ਦਾ ਯਸ਼ ਗਾਇਆ ਹੈ।"