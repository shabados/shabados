[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਧਾਵਤ ਤੇ ਧੁਰਵਾ ਸੇ ਦਸੋ ਦਿਸਿ; ਤੇ ਝਟ ਦੈ ਪਟਕੈ ਬਿਕਟੀਲੇ ॥"
page = 810

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Those irrefutable warriors were overwhelmed from all over like the dust storm."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਅਕੱਟ ਯੋਧੇ ਧੂੜ ਵਾਂਗ ਦਸਾਂ ਦਿਸ਼ਾਵਾਂ ਤੋਂ ਚੜ੍ਹ ਆਏ ਸਨ, (ਉਨ੍ਹਾਂ ਨੂੰ ਕਾਲੀ ਨੇ) ਭੂਮੀ ਉਤੇ ਪਟਕ ਦਿੱਤਾ ਸੀ।"