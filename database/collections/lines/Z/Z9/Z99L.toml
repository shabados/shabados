data = "ਬ ਕੁਸ਼ਤਨ ਅਦੂਰਾ ਕੁਸ਼ਾਯਦ ਬ ਪੇਸ਼ ॥"
page = 1421

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The defeat of the enemy opened all the annuls to march forward,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਨੇ ਦੁਸ਼ਮਣਾਂ ਨੂੰ ਮਾਰ ਕੇ ਅਗੇ ਦਾ ਰਸਤਾ ਖੋਲ੍ਹ ਲਿਆ।"