[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਮਰੇ ਇਕ ਸਾਸ ਭਰੇ; ਤਰਫੈ ਇਕ ਘਾਇਲ ਭੂ ਪਰ ਆਏ ॥"
page = 478

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many of them died and writhed on being wounded and many were laid down on the earth"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਮਰ ਗਏ ਹਨ, ਇਕ ਲੰਬੇ ਸਾਹ ਲੈ ਰਹੇ ਹਨ, ਇਕ ਘਾਇਲ ਹੋ ਕੇ ਧਰਤੀ ਉਤੇ ਤੜਫ ਰਹੇ ਹਨ।"