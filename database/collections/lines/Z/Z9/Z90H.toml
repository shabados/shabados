[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈਤਸਰੀ ਮਹਲਾ ੫ ਵਾਰ ਸਲੋਕਾ ਨਾਲਿ ॥"
page = 705
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Jaitsri 5th Guru. Ode with Sloks."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੈਤਸਰੀ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ। ਸਲੋਕਾਂ ਰਹਿਤ ਕਵਿਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Jaitsree, Fifth Mehl, Vaar With Saloks:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਜੈਤਸਰੀ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਵਾਰ', ਸਲੋਕਾਂ ਸਮੇਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Yaitsri, Mejl Guru Aryan, Quinto Canal Divino, Var con Sloks."