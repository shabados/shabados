[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਊਤਮ ਸਬਦਿ ਸਵਾਰਣਹਾਰਾ ॥"
page = 930
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The sublime Gurbani, embellishes the mortal."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੇਸ਼ਟ ਗੁਰਬਾਣੀ ਪ੍ਰਾਣੀ ਨੂੰ ਸ਼ਸ਼ੋਭਤ ਕਰ ਦਿੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord embellishes and exalts with the Sublime Word of the Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਉਤਮੁ (ਸਬਦਿ) ਉਪਦੇਸ ਗੁਰੋਂ ਕਾ ਸਿਖ ਕੋ ਸਵਾਰਣਹਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਸਤਿਗੁਰੂ ਦੇ ਸ੍ਰੇਸ਼ਟ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ (ਜਗਤ ਨੂੰ ਸਵਾਰਣਹਾਰ)-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਊਤਮ ਸਬਦਿ = ਗੁਰੂ ਦੇ ਸ੍ਰੇਸ਼ਟ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ। ਸਵਾਰਣਹਾਰਾ = ਜਗਤ ਨੂੰ ਸੋਹਣਾ ਬਨਾਣ ਵਾਲਾ ਪਰਮਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y uno es adornado con la Palabra Sublime."