[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹੀ ਬਸਿਸਟ ਸੁਧਾਰ ਕਰਿ; ਸ੍ਰੀ ਰਘੁਬਰ ਸੋ ਜਾਇ ॥"
page = 224

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Vasishtha said the same thing to Ram in an improved way,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਹ (ਗੱਲ) ਸੁਧਾਰ ਕੇ ਵਸ਼ਿਸ਼ਟ ਨੇ ਸ੍ਰੀ ਰਾਮ ਚੰਦਰ ਨੂੰ ਜਾ ਕੇ ਕਹੀ"