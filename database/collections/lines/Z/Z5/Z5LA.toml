[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਹੋਏ; ਦਾਸਨਿ ਦਾਸ ॥੪॥੭॥੧੮॥"
page = 888
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak has become the slave of the Lord's slaves"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਪ੍ਰਭੂ ਦੇ ਗੋਲਿਆਂ ਦਾ ਗੋਲਾ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak is the slave of His slaves. ||4||7||18||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹਮ ਤਿਸ ਕੇ ਦਾਸੋਂ ਕੇ ਦਾਸ ਹੂਏ ਹੈਂ॥੪॥੭॥੧੮॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਮਨੁੱਖ ਪ੍ਰਭੂ ਦੇ ਦਾਸਾਂ ਦੇ ਦਾਸ ਬਣੇ ਰਹਿੰਦੇ ਹਨ ॥੪॥੭॥੧੮॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਾਸਨਿ ਦਾਸ = ਦਾਸਾਂ ਦੇ ਦਾਸ ॥੪॥੭॥੧੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así uno se convierte en el Esclavo de Sus Esclavos. (4-7-18)"