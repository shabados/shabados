[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਹ ਹੈ ਬਲਵਾਨ ਬਡੋ ਪ੍ਰਗਟਿਯੋ; ਸੋਊ ਕੋ ਇਹ ਸੋ ਛਿਨ ਆਇ ਅਡੈ ॥"
page = 331

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is extremely potent, and there is none who can confront him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਹ ਬਹੁਤ ਵੱਡਾ ਬਲਵਾਨ ਪ੍ਰਗਟ ਹੋਇਆ ਹੈ ਜਿਸ ਨਾਲ ਆ ਕੇ ਕੋਈ ਛਿਣ ਭਰ ਲਈ ਅੜ ਕੇ (ਤਾਂ ਵੇਖੇ)।"