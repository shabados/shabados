[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਡੁਖੇ ਕੋੜਿ. ਨ ਡੁਖ; ਨਾਨਕ. ਪਿਰੀ ਪਿਖੰਦੋ ਸੁਭ ਦਿਸਟਿ ॥੧॥"
page = 1100
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and millions of pains pain not him, O Nanak, on whom the Bridegroom looks with His well-wishing eyes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕ੍ਰੋੜਾਂ ਹੀ ਪੀੜਾਂ ਉਸ ਨੂੰ ਦੁਖੀ ਨਹੀਂ ਕਰਦੀਆਂ, ਜਿਸ ਉਤੇ ਪਤੀ ਆਪਣੇ ਭਲਾ ਚਿਤਵਣ ਵਾਲੇ ਨੇਤ੍ਰਾਂ ਨਾਲ ਵੇਖਦਾ ਹੈ, ਹੇ ਨਾਨਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "millions of pains do not cause him pain. O Nanak, the Husband Lord blesses him with his Glance of Grace. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਨਾਂ ਪਰ ਪਰਮੇਸਰ ਕੀ ਕ੍ਰਿਪਾ ਦ੍ਰਿਸਟੀ ਹੈ, ਜੋ ਕਰੋੜਾਂ ਦੁਖ ਭੀ ਹੋਵੈ, ਤਾਂ ਵੀ ਵਹੁ ਦੁਖ ਨਹੀਂ ਮਾਨਤੇ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਜਿਸ ਮਨੁੱਖ ਵਲ) ਪ੍ਰਭੂ-ਪਤੀ ਸਵੱਲੀ ਨਜ਼ਰ ਨਾਲ ਤੱਕੇ, ਉਸ ਨੂੰ ਕੋਈ ਦੁੱਖ ਨਹੀਂ ਪੋਂਹਦਾ ਚਾਹੇ ਕ੍ਰੋੜਾਂ ਦੁੱਖ ਵਾਪਰਨ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਡੁਖ = ਦੁੱਖ। ਕੋੜਿ = ਕ੍ਰੋੜਾਂ। ਸੁਭ ਦਿਸਟਿ = ਚੰਗੀ ਨਿਗਾਹ ਨਾਲ, ਸਵੱਲੀ ਨਜ਼ਰ ਨਾਲ। ਪਿਖੰਦੋ = ਵੇਖੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "tampoco la intensidad del dolor duele, si Dios posa sobre uno Su Mirada de Gracia. (1)"