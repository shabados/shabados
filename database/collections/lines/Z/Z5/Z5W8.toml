[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੋਰਾ ਗੋਰੋ ਦਿਸਦਾ; ਕਾਲਾ ਕਾਲੋ ਵੰਨੁ ਵਿਸੇਖੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Fair complexion is reflected fair and black one specifically black in it."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਉਸ ਵਿਚ) ਗੋਰੇ ਦਾ ਮੂੰਹ ਗੋਰਾ ਦਿੱਸਦਾ ਹੈ ਤੇ ਕਾਲੇ ਨੂੰ (ਆਪਣਾ) ਕਾਲਾ ਰੰਗ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ।"