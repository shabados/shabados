[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚੂਕੀਅਲੇ; ਮੋਹ ਮਇਆਸਾ ॥"
page = 972
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The attachment of mammon is effaced,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦੀ ਲਗਨ ਮਿਟ ਗਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My attachment to Maya has been eradicated;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਜੋਗੀ ਕੀ ਮੋਹ ਰੂਖ ਆਸਾ ਚੂਕ ਗਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੀਆਂ ਮੋਹ-ਭਰੀਆਂ ਆਸਾਂ ਹੁਣ ਮੁੱਕ ਗਈਆਂ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹ ਮਇ = ਮੋਹ ਦੀ ਭਰੀ ਹੋਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me he liberado de mis apegos a Maya"