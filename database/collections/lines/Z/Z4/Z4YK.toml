[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਗਾ; ਗੁਰ ਕੇ ਬਚਨ ਪਛਾਨਾ ॥"
page = 340
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "G - He who understand Guru's instruction,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗ - ਜੋ ਗੁਰਾਂ ਦੀ ਸਿਖਿਆ ਨੂੰ ਸਮਝਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "GAGGA: One who understands the Guru's Word"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗਗੇ ਅਖਰ ਦ੍ਵਾਰਾ ਕਹਤੇ ਹੈਂ: ਜਿਨੋਂ ਨੇ ਗੁਰੋਂ ਕੇ ਵਾਕੋਂ ਕਰ ਕੇ ਆਤਮਾ ਕੋ ਪਛਾਣਿਆਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਸਤਿਗੁਰੂ ਦੀ ਬਾਣੀ ਦੀ ਰਾਹੀਂ ਪਰਮਾਤਮਾ ਨਾਲ ਸਾਂਝ ਪਾ ਲਈ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਛਾਨਾ = (ਪ੍ਰਭੂ ਨੂੰ) ਪਛਾਣ ਲਿਆ ਹੈ, ਪ੍ਰਭੂ ਨਾਲ ਸਾਂਝ ਪਾ ਲਈ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ga ga Aquél que entiende la Instrucción del Guru,"