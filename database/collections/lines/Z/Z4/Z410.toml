[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਪ੍ਰਭਿ; ਅਪਨੀ ਸੇਵਾ ਲਾਇਆ ॥"
page = 285
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He whom the Lord applies to his service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਸੁਆਮੀ ਆਪਣੀ ਟਹਿਲ ਅੰਦਰ ਜੋੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One whom God applies to His own service, O Nanak"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੇਵਕ ਪ੍ਰਭੂ ਨੇ ਅਪਨੀ ਸੇਵਾ ਮੇਂ ਲਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਜਿਸ ਨੂੰ ਪ੍ਰਭੂ ਨੇ ਆਪ ਆਪਣੀ ਸੇਵਾ ਵਿਚ ਲਾਇਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "uno que decide realizar tu servicio, Oh Nanak,"