[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ ਭਏ ਦਇਆਲ ॥"
page = 1272
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Transcendent Lord becomes Merciful,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਪਰਮ ਪ੍ਰਭੂ ਮਿਹਰਬਾਨ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Lord God has become merciful;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਪਰ ਪਾਰਬ੍ਰਹਮ ਦ੍ਯਾਲ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਜੀ ਉਸ ਉਤੇ ਦਇਆਵਾਨ ਹੋ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios, nuestro Señor Supremo ha mostrado Su Misericordia"