[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚਉਥਾ ਕਰਿ ਨਰਸਿੰਘ ਰੂਪੁ; ਅਸੁਰੁ ਮਾਰਿ ਪ੍ਰਹਿਲਾਦਿ ਉਬਾਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In fourth incarnation he assumed the form of man-lion andeicilling demon (Hiranyakasipu) saved Prahalid."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਚੌਥਾ ਨਰ ਸਿੰਘ ਦਾ ਰੂਪ ਕਰ ਕੇ ਰਾਖਸ਼ ਮਾਰਕੇ ਪ੍ਰਹਿਲਾਦ ਦੀ ਰੱਛਾ ਕੀਤੀ।"