data = "ਅਤਪ ਬੀਰ ਕਉ ਤਾਕਿ; ਬਾਨ ਸਤਰਿ ਮਾਰੇ ਤਪ ॥"
page = 706

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Tapasya inflicted seventy arrows on Atap"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "'ਅਤਪ' (ਨਾਂ ਦੇ) ਸੂਰਮੇ ਨੂੰ 'ਤਪ' (ਯੇਧੇ) ਨੇ ਤਕ ਕੇ ਸੱਤਰ ਬਾਣ ਮਾਰੇ ਹਨ।"