[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਮਨੋਰਥ; ਤਾ ਕੇ ਪੂਰਨ ਕਾਮ ॥੨॥"
page = 197
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "has all his desires and tasks fulfilled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀਆਂ ਸਾਰੀਆਂ ਖਾਹਿਸ਼ਾਂ ਤੇ ਕਾਰਜ ਸੰਪੂਰਨ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "have all their desires and tasks fulfilled. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੇ ਸੰਪੂਰਨ ਮਨੋਰਥ ਤੇ ਕਾਰਜ ਪੂਰਨ ਭਏ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਸਾਰੇ ਕੰਮ ਸਾਰੇ ਮਨੋਰਥ ਸਫਲ ਹੋ ਜਾਂਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕੇ = ਉਸ ਦੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "habita el Nombre del Señor, se realizan. (2)"