[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਲ ਤੇ ਊਠਹਿ, ਅਨਿਕ ਤਰੰਗਾ ॥"
page = 736
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Good many waves arise in the water."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਣੀ ਵਿੱਚ ਬਹੁਤ ਸਾਰੀਆਂ ਲਹਿਰਾਂ ਉਠਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Countless waves rise up from the water."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਜਲ ਤੇ ਅਨੇਕ ਤਰੰਗ ਉਠਤੇ ਹੈਂ, ਜੋ ਜਲ ਰੂਪ ਹੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਾਣੀ ਤੋਂ ਅਨੇਕਾਂ ਲਹਿਰਾਂ ਉਠਦੀਆਂ ਹਨ (ਮੁੜ ਪਾਣੀ ਵਿਚ ਰਲ ਜਾਂਦੀਆਂ ਹਨ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ। ਊਠਹਿ = ਉੱਠਦੇ ਹਨ। ਤਰੰਗ = ਲਹਿਰਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Muchas son las olas que llegan a la playa;"