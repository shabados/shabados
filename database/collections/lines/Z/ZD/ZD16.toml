[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਿਰਦੈ ਫੇਰਿ; ਚਲੈ ਤੁਧੁ ਨਾਲੀ ॥੧॥"
page = 1134
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Tell thou its beads with thy heart and it shall go with thy heart and it shall go with thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਦਿਲ ਨਾਲ ਤੂੰ ਇਸ ਦਾ ਜਾਪ ਕਰ ਅਤੇ ਇਹ ਤੇਰੇ ਨਾਲ ਜਾਵੇਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chant on the beads within your heart, and it shall go along with you. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਹਿਰਦੇ ਵਿਖੇ ਧਾਰਨੀ ਹੈ ਜਪ ਕਰਣੇ ਕੀ ਏਹੀ ਫੇਰਨਾਂ ਕੀਆ ਹੈ, ਜੋ ਹਮਾਰੀ ਪ੍ਰੀਤਿ ਅੰਤ ਪ੍ਰਯੰਤ ਤੇਰੇ ਸਾਥ ਚਲੇ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਹਰਿ-ਨਾਮ ਸਿਮਰਨ ਦੀ ਮਾਲਾ ਨੂੰ ਆਪਣੇ) ਹਿਰਦੇ ਵਿਚ ਫੇਰਿਆ ਕਰ। ਇਹ ਹਰਿ-ਨਾਮ ਤੇਰੇ ਨਾਲ ਸਾਥ ਕਰੇਗਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਿਰਦੈ = ਹਿਰਦੇ ਵਿਚ। ਫੇਰਿ = ਫੇਰਿਆ ਕਰ (ਇਸ ਮਾਲਾ ਨੂੰ)। ਨਾਲੀ = ਨਾਲ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "corre sus cuentas con tu corazón, pues mira, es lo que acompaña siempre a tu Alma. (1)"