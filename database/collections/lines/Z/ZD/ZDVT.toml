[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧੁਰ ਤੇ. ਕਿਰਪਾ ਕਰਹੁ ਆਪਿ; ਤਉ ਹੋਇ ਮਨਹਿ ਪਰਗਾਸੁ ॥"
page = 257
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If the Lord Himself bestows mercy from the beginning then dies the mind become enlightened"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਸਾਹਿਬ ਖੁਦ ਮੁੱਢ ਤੋਂ ਹੀ ਦਇਆ ਧਾਰੇ ਤਦ ਹੀ ਅੰਤਹਕਰਣ ਪ੍ਰਕਾਸ਼ਵਾਨ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If the Lord is Merciful from the very beginning, then one's mind is enlightened."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੀ ਬੇਨਤੀ ਕਰੁ: ਹੇ ਪ੍ਰਭੂ! ਆਪ ਜਿਸ ਪਰ (ਧੁਰਤੇ) ਆਦ ਸੇ ਹੀ ਕ੍ਰਿਪਾ ਦ੍ਰਿਸਟੀ (ਕਰਹੁ) ਕਰਤੇ ਹੋ, ਤਿਸ ਪੁਰਸ਼ ਕੇ ਮਨ ਮੇਂ ਗ੍ਯਾਨ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਇਹ ਕੋਈ ਸੌਖੀ ਖੇਡ ਨਹੀਂ। ਹੇ ਪ੍ਰਭੂ!) ਜਿਸ ਜੀਵ ਉਤੇ ਤੂੰ ਆਪਣੇ ਦਰ ਤੋਂ ਮਿਹਰ ਕਰਦਾ ਹੈਂ, ਉਸੇ ਦੇ ਮਨ ਵਿਚ ਜੀਵਨ ਦੀ ਸਹੀ ਸੂਝ ਪੈਂਦੀ ਹੈ (ਤੇ ਉਸ ਦੀ ਭਟਕਣਾ ਮੁੱਕਦੀ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਰ ਤੇ = ਧੁਰ ਤੋਂ, ਆਪਣੇ ਦਰ ਤੋਂ। ਮਨਹਿ = ਮਨ ਵਿਚ। ਪਰਗਾਸੁ = ਚਾਨਣ, ਸਹੀ ਜੀਵਨ ਦੀ ਸੂਝ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi mente se iluminará si Tú, oh mi Maestro, me bendices con Tu Gracia."