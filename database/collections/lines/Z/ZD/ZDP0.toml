[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੈ ਬੇਸ੍ਵਾ ਇਹ ਬਿਪ੍ਰ ਕੌ; ਸੁਨੁ ਰੇ ਬਚਨ ਅਚੇਤ ॥"
page = 923

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Oh, fool, handover this prostitute to that Brahmin."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ! ਗੱਲ ਸੁਣੋ, ਇਸ ਬ੍ਰਾਹਮਣ ਨੂੰ ਇਹ ਵੇਸਵਾ ਦੇ ਦਿਓ।"