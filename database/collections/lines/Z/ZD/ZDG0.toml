[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾਉ ਦੇ ਮੂਛਿ ਦੁਹੂੰ ਕਰ ਭੂਪਤਿ; ਸੈਨ ਨੈ ਜਾਇ ਨਿਸੰਕ ਪਰਿਯੋ ॥"
page = 455

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The king, twisting his whiskers, fearlessly fell upon the army"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਹਾਂ ਮੁੱਛਾਂ ਨੂੰ ਤਾਉ ਦੇ ਕੇ ਰਾਜਾ (ਖੜਗ ਸਿੰਘ) ਨਿਸੰਗ ਹੋ ਕੇ ਸੈਨਾ ਉਤੇ ਜਾ ਪਿਆ ਹੈ।"