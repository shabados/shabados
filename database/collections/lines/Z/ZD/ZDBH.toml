[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਾਮ ਕਰੋਧੁ ਨ ਸਾਧਿਓ; ਲੋਭੁ ਮੋਹ ਅਹੰਕਾਰੁ ਨ ਮਾਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "But the lust and anger were not sublimited and greed, infatuation and ego were not eschewed."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਮੁਕਦੀ ਗੱਲ ਇਹ ਕਿ) ਕਾਮ ਤੇ ਕ੍ਰੋਧ (ਕਿਸੇ ਬੀ) ਨਾ ਸਾਧਿਆ ਤੇ ਲੋਭ ਮੋਹ ਅਹੰਕਾਰ (ਬੀ ਕਿਸੇ) ਨਾ ਮਾਰਿਆ।"