[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਲਿ ਕਲੇਸ ਸਭ; ਦੂਰਿ ਪਇਆਣੇ ॥"
page = 105
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All my botherations and sufferings have fled far away."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀਆਂ ਸਾਰੀਆਂ ਕਲਪਨਾਂ ਤੇ ਦੁਖੜੇ ਦੁਰੇਡੇ ਨੱਸ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All my troubles and sufferings have run away."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਪੁਰਸੋਂ ਕੈ (ਕਲਿ) ਕਲਪਨਾਂ ਅਰ ਕਲੇਸ⁽¹⁾ ਸਭ ਦੂਰ (ਪਇਆਣੇ) ਚਲੇ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਅੰਦਰੋਂ ਸਭ ਤਰ੍ਹਾਂ ਦੇ ਝਗੜੇ ਦੁੱਖ ਕਲੇਸ਼ ਕੂਚ ਕਰ ਜਾਂਦੇ ਹਨ"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਲਿ = ਝਗੜੇ। ਕਲੇਸ = ਦੁੱਖ। ਪਇਆਣੇ = ਚਲੇ ਗਏ, ਕੂਚ ਕਰ ਗਏ {प्रया = ਕੂਚ ਕਰ ਜਾਣਾ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y toda mi tristeza y dolor son disipados."