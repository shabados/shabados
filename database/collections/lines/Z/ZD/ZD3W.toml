[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨ ਭਾਇ ਭਗਤੀ ਦੇਖਿ ਪ੍ਰੀਤਮ; ਕਾਮ ਕ੍ਰੋਧੁ ਨਿਵਾਰਿਆ ॥"
page = 843
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Beholding His bride's affections and devotion the Beloved rids her of lust and wrath."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਪਤਨੀ ਦੀ ਪ੍ਰੀਤ ਅਤੇ ਸ਼ਰਧਾ ਵੇਖ ਕੇ ਦਿਲਬਰ ਉਸ ਦੀ ਭੋਗ-ਵਾਸ਼ਨਾ ਅਤੇ ਗੁੱਸੇ ਨੂੰ ਦੂਰ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Seeing His bride's loving devotion, the Beloved Lord eradicates unfulfilled sexual desire and unresolved anger."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਤਿਸ (ਧਨ) ਇਸਤ੍ਰੀ ਨੇ ਭਾਇ ਭਗਤੀ ਕਰ ਕੇ ਪ੍ਰੀਤਮ ਵਾਹਿਗੁਰੂ ਕੋ ਦੇਖਿਆ ਹੈ ਔ ਕਾਮ, ਕ੍ਰੋਧ ਆਦੀ ਵਿਕਾਰੋਂ ਕੋ ਨਿਵਾਰਨ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਜਿਹੀ ਜੀਵ-ਇਸਤ੍ਰੀ ਪ੍ਰੀਤਮ-ਪ੍ਰਭੂ ਦੀ ਭਗਤੀ ਦੀ ਰਾਹੀਂ ਪ੍ਰੀਤਮ-ਪ੍ਰਭੂ ਦੇ ਪ੍ਰੇਮ ਵਿਚ ਟਿਕ ਕੇ ਉਸ ਦਾ ਦਰਸਨ ਕਰ ਕੇ ਕਾਮ ਕ੍ਰੋਧ (ਆਦਿਕ ਵਿਕਾਰਾਂ ਨੂੰ ਆਪਣੇ ਅੰਦਰੋਂ) ਦੂਰ ਕਰ ਲੈਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਨ = ਇਸਤ੍ਰੀ, ਜੀਵ-ਇਸਤ੍ਰੀ। ਭਾਇ = ਭਾਉ ਦੀ ਰਾਹੀਂ, ਪ੍ਰੇਮ ਵਿਚ ਜੁੜ ਕੇ। ਭਾਉ = ਪ੍ਰੇਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Observando la Amorosa Adoración de su Esposa, el Señor Bienamado la libera de su lujuria y de su enojo,"