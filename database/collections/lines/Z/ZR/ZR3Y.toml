[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭੇ ਮਾਣਸ. ਦੇਵ ਸਭਿ; ਸਭੇ ਜੋਗ ਧਿਆਨ ॥"
page = 1241
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All mortals, all deities, all unions and all inclination,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਪ੍ਰਾਣੀ, ਸਮੂਹ ਦੇਵਤੇ ਸਾਰੇ ਮੇਲ ਮਿਲਾਪ ਅਤੇ ਸਮੂਹ ਰੁਚੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All mankind, all divinites, all Yoga and meditation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭੇ ਹੀ ਮਾਨੁਖ ਅਰ ਸਭੀ ਦੇਵਤਾ ਔਰ ਸਭੇ ਹੀ ਜੋਗ ਧਿਆਨ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਤੇ ਦੇਵਤੇ; ਜੋਗ ਦੀਆਂ ਸਮਾਧੀਆਂ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖਾਨ = ਖਾਣੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, todas las dichas y albricias en la vida vienen de Dios."