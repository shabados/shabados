[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਵੇ ਜੁਧ ਜੀਤ ਤੇ ਜਾਹਿਗੇ ਕਹਾ ਦੋਇ ਤੇ ਦੀਨ ਨਰ ॥੩੭੭॥"
page = 239

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The person about whom you are talking, both of them are very low and helpless men, how shall then they win the war?377."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕੀ ਉਹ ਦੋ ਦੀਨੇ ਮਨੁੱਖ ਅਜਿਹੇ ਰਾਵਣ ਨੂੰ ਯੁੱਧ ਵਿੱਚ ਜਿੱਤ ਜਾਣਗੇ ॥੩੭੭॥"