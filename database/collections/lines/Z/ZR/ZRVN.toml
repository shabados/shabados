[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਸੀ ਮਗਹਰ; ਸਮ ਬੀਚਾਰੀ ॥"
page = 326
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Banaras and Magahar I consider alike."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਨਾਰਸ ਅਤੇ ਮਗਹਰ ਮੈਂ ਇਕਸਾਰ ਖਿਆਲ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Kaashi and Magahar - I consider them the same."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਨੇ ਤੋ ਕਾਸੀ ਔਰ ਮਗਹਰ ਸਮ ਵੀਚਾਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਰਾਮ! ਲੋਕ ਬੋਲੀ ਮਾਰਦੇ ਹਨ-) ਤੂੰ ਕਾਂਸ਼ੀ ਤੇ ਮਗਹਰ ਨੂੰ ਇਕੋ ਜਿਹਾ ਸਮਝ ਲਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਮ = ਇਕੋ ਜਿਹੇ। ਬੀਚਾਰੀ = ਸਮਝੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Yo veo a Kashi y a Magajar iguales,"