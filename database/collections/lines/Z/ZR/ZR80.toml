[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਸਤ੍ਰ ਬੇਦ; ਪਾਪ ਪੁੰਨ ਵੀਚਾਰ ॥"
page = 385
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Shashtras and Vedas dilate on sin and virtue,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ਾਸਤਰ ਅਤੇ ਵੇਦ ਗੁਨਾਹ ਤੇ ਨੇਕੀ ਦੀ ਸੋਚ ਵਿਚਾਰ ਬਿਆਨ ਕਰਦੇ ਹਨ ਅਤੇ ਕਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Shaastras and the Vedas speak of sin and virtue;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬੇਦ ਸਾਸਤ੍ਰ ਕੋ ਦੇਖੀਏ ਤੌ ਤਿਨ ਮੇਂ ਪੁੰਨ ਪਾਪ ਕਾ ਬਿਚਾਰ ਲਿਖਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮਿੱਤਰ!) ਸ਼ਾਸਤ੍ਰ ਤੇ ਬੇਦ ਪੁੰਨਾਂ ਤੇ ਪਾਪਾਂ ਦੇ ਵਿਚਾਰ ਹੀ ਦੱਸਦੇ ਹਨ (ਇਹ ਦੱਸਦੇ ਹਨ ਕਿ ਫਲਾਣੇ ਕੰਮ ਪਾਪ ਹਨ ਫਲਾਣੇ ਕੰਮ ਪੁੰਨ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Shastras y los Vedas hablan de las pasiones y también de las virtudes,"