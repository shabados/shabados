[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੀ ਪ੍ਰੀਤਿ ਕਰਹੁ; ਮਨ ਮੇਰੇ ॥"
page = 807
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, enshrine thou such an affection for the Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਤੂੰ ਪ੍ਰਭੂ ਨਾਲ ਇਹੋ ਜਿਹਾ ਪ੍ਰੇਮ ਪਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Enshrine such love, O my mind,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ ਪਿਆਰੇ! ਤਿਸ ਵਾਹਿਗੁਰੂ ਕੇ ਚਰਨਾਂ ਮੇਂ ਐਸੀ ਪ੍ਰੀਤਿ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਪਰਮਾਤਮਾ ਨਾਲ ਇਹੋ ਜਿਹਾ ਪਿਆਰ ਬਣਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ama a tu Señor de tal forma,"