[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਈ ਦਿਵਸੁ ਭਲਾ; ਮੇਰੇ ਭਾਈ ॥"
page = 395
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Auspicious is that day, my brother,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਬਾਰਕ ਹੈ ਉਹ ਦਿਹਾੜਾ, ਮੇਰੇ ਵੀਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How blessed is that day, O my Siblings of Destiny,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਭਾਈ! ਵਹੀ ਦਿਨ ਭਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਵੀਰ! ਸਿਰਫ਼ ਉਹੀ ਦਿਨ (ਮਨੁੱਖ ਵਾਸਤੇ) ਸੁਲੱਖਣਾ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਿਵਸੁ = ਦਿਨ। ਭਾਈ = ਹੇ ਵੀਰ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bendecido seré solamente, oh hermano,"