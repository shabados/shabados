[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੀਈ ਭਵਾਰੀ ਪੁਰਖਿ ਬਿਧਾਤੈ; ਬਹੁਰਿ ਬਹੁਰਿ ਜਨਮਾਧੇ ॥੩॥"
page = 403
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Omnipotent scribe of destiny has caused thee to go round again and again in births."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਰਬ-ਸ਼ਕਤੀਵਾਨ ਕਿਸਮਤ ਦੇ ਲਿਖਾਰੀ ਨੇ ਤੈਨੂੰ ਮੁੜ ਮੁੜ ਕੇ ਜਨਮਾਂ ਅੰਦਰ ਜਾਣ ਦੀ ਭੁਆਟਣੀ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The All-powerful Architect of Destiny has ordained that you shall be reincarnated over and over again. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਨ ਕਰਮੋਂ ਕਾ ਫਲ੍ਹ ਤੇ ਪੁਰਖ ਨੇ ਚੌਰਾਸੀ ਮੇਂ ਫਿਰਨ ਰੂਪ ਭਵਾਰੀ ਦੀ ਹੈ, ਤਾਂ ਤੇ ਬਾਰੰਬਾਰ ਜਨਮਤੇ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹਨਾਂ ਕੁਕਰਮਾਂ ਦੇ ਕਾਰਨ ਜਦੋਂ) ਸਿਰਜਨਹਾਰ ਅਕਾਲ ਪੁਰਖ ਨੇ (ਇਸ ਨੂੰ ਚੌਰਾਸੀ ਲੱਖ ਜੂਨਾਂ ਵਾਲੀ) ਭਵਾਟਣੀ ਦੇ ਦਿੱਤੀ ਤਾਂ ਇਹ ਮੁੜ ਮੁੜ ਜੂਨਾਂ ਵਿਚ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੀਈ = ਦਿੱਤੀ। ਭਵਾਰੀ = ਭਵਾਟਣੀ। ਪੁਰਖਿ = ਪੁਰਖ ਨੇ। ਬਿਧਾਤੈ = ਵਿਧਾਤਾ ਨੇ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y el Señor de mi destino hace que tome la ronda de vidas una y otra vez. (3)"