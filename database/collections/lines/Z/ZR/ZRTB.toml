[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੰਕਾਰੁ ਵਸੈ ਮਨਿ ਭਾਵੈ; ਹਉਮੈ ਗਰਬੁ ਗਵਾਇਦਾ ॥੧੧॥"
page = 1034
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he, who banishes his self conceit and ego; The Unique Lord abides within him and becomes pleasing to his mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਪਣੀ ਸਵੈ-ਹੰਗਤਾ ਅਤੇ ਹੰਕਾਰ ਨੂੰ ਛੱਡ ਦਿੰਦਾ ਹੈ; ਅਦੁਤੀ ਸੁਆਮੀ ਉਸ ਦੇ ਅੰਦਰ ਵਸਦਾ ਹੈ ਅਤੇ ਉਸ ਦੇ ਚਿੱਤ ਨੂੰ ਚੰਗਾ ਲਗਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One Universal Creator Lord dwells within, and is pleasing to the mind of those who banishe egotism and pride. ||11||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਏਕ ਸਰੂਪ! ਜਿਸ ਕੀ ਤੂੰ ਦੇਹ ਕੀ ਹੰਤਾ ਔ ਪਦਾਰਥਾਂ ਕੀ ਮਮਤਾ ਔ ਧਨ ਕਾ ਗਰਬ ਗਵਾਵਤਾ ਹੈਂ, ਤਿਸੀ ਕੇ ਤੂੰ ਮਨ ਮੇਂ ਭਾਵਤਾ ਹੈਂ॥੧੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਗੁਰਮੁਖ ਦੇ ਮਨ ਵਿਚ ਉਹੀ ਇੱਕ ਅਕਾਲ ਪੁਰਖ ਵੱਸਦਾ ਹੈ ਤੇ ਮਨ ਵਿਚ ਪਿਆਰਾ ਲੱਗਦਾ ਹੈ (ਇਸ ਦੀ ਬਰਕਤਿ ਨਾਲ ਉਹ ਆਪਣੇ ਅੰਦਰੋਂ) ਹਉਮੈ ਅਹੰਕਾਰ ਦੂਰ ਕਰ ਲੈਂਦਾ ਹੈ ॥੧੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਕੰਕਾਰੁ = ਇਕ ਅਕਾਲ ਪੁਰਖ ॥੧੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "eres Dulce para la mente y habitas ahí, soy purgado de mi ego negativo. (11)"