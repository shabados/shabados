[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾ ਰਸਨਾ ਜਲਿ ਜਾਉ; ਜਿਨਿ ਹਰਿ ਕਾ ਨਾਉ ਵਿਸਾਰਿਆ ॥"
page = 550
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Burnt be the tongue, which has forgotten the Name of God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਜੀਭਾਂ ਸੜ ਮਚ ਜਾਵੇ, ਜਿਸ ਨੇ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਨੂੰ ਭੁਲਾ ਛਡਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Let that tongue, which has forgotten the Name of the Lord, be burnt."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਹਰਿ ਕਾ ਨਾਮੁ ਭੁਲਾਇਆ ਹੈ, ਸੋ ਰਸਨਾ ਜਲ ਜਾਨੇ ਯੋਗ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਜੀਭ ਨੇ ਹਰੀ ਦਾ ਨਾਮ ਵਿਸਾਰਿਆ ਹੈ, ਉਹ ਜੀਭ ਸੜ ਜਾਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quemados sean los labios que abandonan el Nombre del Señor."