[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਬੋਲਤ; ਸਭ ਪਾਪ ਲਹਿ ਜਾਈ ॥੧॥ ਰਹਾਉ ॥"
page = 165
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By repeating God's Name all the sins are washed off. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਜਾਪ ਕਰਨ ਦੁਆਰਾ ਸਮੂਹ ਕਸਮਲ ਧੋਤੇ ਜਾਂਦੇ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chanting the Lord's Name, all sins are washed away. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਹਰੀ ਨਾਮ ਉਚਾਰਣੇ ਸੇ ਸਭ ਪਾਪ ਲਹ ਜਾਤੇ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਦੋਂ ਹੀ) ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਸਿਮਰਿਆਂ ਹਰੇਕ ਕਿਸਮ ਦਾ ਪਾਪ (ਮਨ ਤੋਂ) ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੋਲਤ = ਸਿਮਰਿਆਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre del Señor para que todos sus errores sean borrados.(1-Pausa)"