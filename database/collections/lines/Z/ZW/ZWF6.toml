[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਜੈ ਜੈ ਕਿਤੇ ਕੇਸ ਹੂੰ ਤੇ ਪਛਾਰੇ ॥੧੧॥"
page = 809

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And holding them from their hair knocked them down.( 11)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਜੈ (ਸੂਰਮਿਆਂ ਨੂੰ) ਜਿੱਤ ਕੇ ਅਤੇ ਕੇਸਾਂ ਤੋਂ ਫੜ ਕੇ ਪਛਾੜਿਆ ਹੈ ॥੧੧॥"