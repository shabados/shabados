[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਬਿਨਾਸੀ ਪ੍ਰਭੁ; ਆਪੇ ਆਪਿ ॥"
page = 282
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Imperishable Lord is all-in-all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਮਰ ਮਾਲਕ ਸਾਰਾ ਕੁਛ ਆਪ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Imperishable Lord God is Himself All-in-all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਪ੍ਰਭੂ ਅਬਿਨਾਸੀ ਆਪੇ ਆਪ ਹੈ ਅਰਥਾਤ ਸੁਤੇ ਸਿਧ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਨਾਸ-ਰਹਿਤ ਹੈ ਤੇ ਆਪਣੇ ਜਿਹਾ ਆਪ ਹੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque Él es el Señor Eterno y Él es el Todo que está en todo."