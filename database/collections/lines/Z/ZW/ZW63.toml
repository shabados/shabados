[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੇਪਰਵਾਹੁ ਰਹਤ ਹੈ ਸੁਆਮੀ; ਇਕ ਨਾਮ ਕੈ ਆਧਾਰਾ ॥੨॥"
page = 884
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With the support of Thy Name alone, O Lord, I remain carefree."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤੇਰੇ ਨਾਮ ਦੇ ਆਸਰੇ ਸਹਿਤ, ਹੇ ਸਾਹਿਬ! ਮੈਂ ਬੇਮੁਹਤਾਜ ਵਿਚਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am carefree and independent, when I have the Support of Your Name, O my Lord and Master. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸ੍ਵਾਮੀ! ਇਸੀ ਤੇ ਹਮ ਬੇਪਰਵਾਹ ਰਹਿਤੇ ਹੈਂ ਔਰ ਏਕ ਨਾਮ ਕੇ ਹੀ ਆਸਰੇ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਲਕ-ਪ੍ਰਭੂ! ਸਿਰਫ਼ ਤੇਰੇ ਨਾਮ ਦੇ ਆਸਰੇ ਉਹ ਮਨੁੱਖ (ਦੁਨੀਆ ਦੀਆਂ ਹੋਰ ਗ਼ਰਜ਼ਾਂ ਵਲੋਂ) ਬੇ-ਪਰਵਾਹ ਰਹਿੰਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਹਤ ਹੈ = ਰਹਿੰਦਾ ਹੈ। ਸੁਆਮੀ = ਹੇ ਸੁਆਮੀ! ਕੈ ਆਧਾਰਾ = ਦੇ ਆਸਰੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y vivo sin preocupaciones apoyándome sólo en Tu Nombre.(2)"