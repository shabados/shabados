[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਭਾ ਤਾ ਕੀ; ਅਪਰ ਅਪਾਰ ॥"
page = 1235
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His glory is boundless and infinite."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਪ੍ਰਭਤਾ ਬੇਹੱਦ ਅਤੇ ਬੇਅੰਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His Glory is Infinite and Endless."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੀ ਸੋਭਾ ਭੀ (ਅਪਰ ਅਪਾਰ) ਬਿਅੰਤ ਸੇ ਬਿਅੰਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪ੍ਰਭੂ ਦੀ ਵਡਿਆਈ ਬੇਅੰਤ ਹੈ ਬੇਅੰਤ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਪਰ = ਪਰੇ ਤੋਂ ਪਰੇ (ਅ-ਪਰ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, Infinita y Maravillosa es la Gloria de mi Señor,"