type = "primary"
data = "ਕੁਕ੍ਰਿਆ ਤਿਹ ਨਾਮ ਸੁ ਜੋਧ ਗਨੰ ॥੨੨੩॥"
page = 697

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He (she) is dreadful like the flames of fire, has white sword, pure glory with rows of white teeth   and who is full of pleasure.223."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਯੋਧੇ ਦਾ ਨਾਂ 'ਕੁਕ੍ਰਿਆ' ਗਿਣਿਆ ਜਾਂਦਾ ਹੈ ॥੨੨੩॥"