data = "ਰਾਗੁ ਆਸਾ ਮਹਲਾ ੧ ਛੰਤ ਘਰੁ ੧ ॥"
page = 435
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Asa Measure 1st Guru. A chant"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਆਸਾ ਪਹਿਲੀ ਪਾਤਸ਼ਾਹੀ। ਛੰਦ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Aasaa, First Mehl, Chhant, First House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਆਸਾ, ਘਰ ੧ ਵਿੱਚ ਗੁਰੂ ਨਾਨਕਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਛੰਤ'।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Asa, Mejl Guru Nanak, Primer Canal Divino, Chhant."