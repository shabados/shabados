[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਲਰਿ ਖੇਤੁ ਨ ਜੰਮਈ; ਘਣਹਰੁ ਵਰਸੰਤੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The rains of the clouds cannot make alkaline field grow and produce."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕੱਲਰ ਵਿਖੇ ਖੇਤੀ ਨਹੀਂ ਜੰਮਦੀ ਭਾਵੇਂ ਬੱਦਲ ਕਿੰਨਾ ਹੀ ਵਰਖਾ ਕਰੇ।"