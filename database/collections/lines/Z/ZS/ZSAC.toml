[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕੈ ਦੂਖਨਿ; ਸੋਭਾ ਤੇ ਹੀਨ ॥"
page = 279
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By accusing the saints, man loses his celebrity."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਤੇ ਦੂਸ਼ਨ ਲਾਉਣ ਨਾਲ ਬੰਦਾ ਆਪਣੀ ਕੀਰਤੀ ਗੁਆ ਲੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Slandering the Saints, one's reputation is lost."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਸੰਤੋਂ ਮੇਂ ਦੂਖਣ ਅਰੋਪਣੇ ਕਰ ਕੇ ਸੋਭਾ ਸੇ ਹੀਨ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ (ਜਗਤ ਵਿਚ) ਮਨੁੱਖ ਸੋਭਾ ਤੋਂ ਸੱਖਣਾ ਰਹਿ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੀਨ = ਸੱਖਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y es degradado de cualquier Honor"