[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅੰਤਰਿਜਾਮੀ ਜਾਣੁ; ਹੇਤੁ ਪਛਾਣੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "For him the holy congregation is the basis of his acquaintance with the omniscient Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਗੁਰਮੁਖ) ਅੰਤਰਜਾਮੀ (ਅਕਾਲ ਪੁਰਖ) ਨੂੰ ਦੇਖਕੇ (ਉਸਦੇ) ਹਿਤ ਨੂੰ ਪਛਾਣਦਾ ਹੈ।"