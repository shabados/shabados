[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਆਦਿ ਨ ਅੰਤੁ ਬਿਅੰਤੁ ਹੈ; ਅਗਮ ਅਗੋਚਰ ਫੇਰ ਫਿਰੰਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Beginning and end of those life currents cannot be understood."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅਗਮ ਅਗੋਚਰ' (ਅਕਾਲ ਪੁਰਖ ਰੂਪੀ ਅਸਗਾਹ ਸਮੁੰਦ੍ਰ ਵਿਖੇ) ਘੁੰਮਣ ਘੇਰੀਆਂ ਖਾਂਦੇ ਹਨ।"