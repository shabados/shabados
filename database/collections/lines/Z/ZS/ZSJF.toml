[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਹਿ ਫਿਰੈ ਵੈਰਾਈ, ਤੁਰੇ ਤਤਾਰਚੇ ॥"
page = 249

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "With the sounding of trumpets a terrible war began and the enemies wandered here and there on the fast-moving steeds"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਘੋੜਿਆਂ ਉੱਤੇ ਚੜ੍ਹੇ ਹੋਏ ਯੋਧੇ ਵੈਰੀਆਂ ਉੱਤੇ ਬਾਣ ਚਲਾਉਦੇ ਫਿਰਦੇ ਹਨ।"