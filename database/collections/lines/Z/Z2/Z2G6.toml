[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਪ ਪੁੰਨ; ਹਮਰੈ ਵਸਿ ਨਾਹਿ ॥"
page = 899
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sin and virtue are not under my control."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਨਾਹ ਤੇ ਨੇਕੀ ਮੇਰੇ ਇਖਤਿਆਰ ਵਿੱਚ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Vice and virtue are not under my control."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਾਪ ਔਰ ਪੁੰਨ ਕਰਨਾ ਹਮਾਰੇ ਕੁਛ ਵਸ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਚੰਗੇ ਮਾੜੇ ਕੰਮ ਕਰਨੇ ਅਸਾਂ ਜੀਵਾਂ ਦੇ ਵੱਸ ਵਿਚ ਨਹੀਂ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਮਰੈ ਵਸਿ = ਸਾਡੇ ਵੱਸ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, ni el error ni la virtud están en nuestras manos;"