[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੁਠਾ ਆਪਿ; ਮੁਹਾਏ ਸਾਥੈ ॥"
page = 140
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who himself is beguiled and beguiles his comrades,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਖੁਦ ਠਗਿਆ ਗਿਆ ਹੈ ਅਤੇ ਆਪਣੇ ਸਾਥੀਆਂ ਨੂੰ ਠੱਗਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They are deceived, and they deceive their companions."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਆਪ ਤੋ ਮੰਦ ਕਰਮੋਂ ਨੇ ਠਗਿਆ ਹੈ ਸੰਗੀਆਂ ਕੋ ਠਗਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਆਪ ਤਾਂ ਠੱਗਿਆ ਜਾ ਹੀ ਰਿਹਾ ਹੈ, ਆਪਣੇ ਸਾਥ ਨੂੰ ਭੀ ਲੁਟਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਠਾ = ਠੱਗਿਆ। ਮੁਹਾਏ = ਲੁਟਾਂਦਾ ਹੈ, ਠਗਾਂਦਾ ਹੈ। ਸਾਥੈ = ਸਾਥ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y de esa forma todos sus seguidores son engañados también."