[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਲ ਨੀਸਾਨੁ ਬਹੁਰਿ ਸਿਰਿ ਗਾਜਾ ॥੧੯॥੨੩੭॥"
page = 147

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then, the trumpet of Death sounded over his head.19.237."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਿਰ (ਉਸ ਦੇ) ਸਿਰ ਉਤੇ ਕਾਲ ਦਾ ਨਗਾਰਾ ਵਜਿਆ (ਅਰਥਾਤ ਮਰ ਗਿਆ) ॥੧੯॥੨੩੭॥"