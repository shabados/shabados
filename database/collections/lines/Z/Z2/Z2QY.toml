assets = ["DGDG"]
type = "primary"
data = "ਸੁਰ ਨਰ ਨਾਗ ਅਸੁਰ ਮਨ ਮੋਹੈ ॥"
page = 844

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "His attractiveness was so distinguished that the gods, humans, reptiles and demons relished him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੇਵਤੇ, ਮਨੁੱਖ, ਨਾਗ ਅਤੇ ਦੈਂਤਾਂ ਦੇ ਮਨ ਮੋਹ ਲੈਂਦਾ ਸੀ।"