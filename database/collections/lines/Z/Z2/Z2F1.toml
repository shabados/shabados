[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਤੇਰਾ. ਮਨ ਤਨ ਆਧਾਰੀ ॥"
page = 564
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Name is the support of my soul and body."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਨਾਮ ਮੇਰੀ ਜਿੰਦੜੀ ਤੇ ਦੇਹ ਦਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your Name is the Support of our mind and body."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਨਾਮੁ ਮੇਰੇ ਮਨ ਤਨ ਕੋ ਆਧਾਰ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਤੇਰਾ ਨਾਮ ਮੇਰੇ ਮਨ ਦਾ ਮੇਰੇ ਸਰੀਰ ਦਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ ਤਨ ਆਧਾਰੀ = ਮਨ ਦਾ ਤਨ ਦਾ ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tu Nombre es el Soporte de nuestra mente y cuerpo,"