[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਦਰਗਹ ਪਾਵਹਿ ਮਾਨੁ ॥੩॥"
page = 895
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then shalt thou obtain honour in His court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਹੀ ਤੂੰ ਉਸ ਦੇ ਦਰਬਾਰ ਅੰਦਰ ਇਜਤ ਆਬਰੂ ਪਾਵੇਗਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and then you shall be honored in the Court of the Lord. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੋ ਤੂੰ ਦਰਗਾਹਿ ਮੇਂ ਮਾਨੁ ਪਾਵੈਂਗਾ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਤੂੰ ਪ੍ਰਭੂ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਆਦਰ-ਸਤਕਾਰ ਪ੍ਰਾਪਤ ਕਰੇਂਗਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Tesoro de tesoros, y así serás honrado en la Corte del Señor. (3)"