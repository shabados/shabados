[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਪਾਤਸ਼ਾਹ ਦੀ ਇਹ ਕਥਾ ਗਲੀ ਗਲੀ ਸੁਣੀਂਦੀ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਈਂ ਹਦੀਸਿ ਸ਼ਾਹ ਬਾਸ਼ਦ ਕੂ ਬ ਕੈ ॥੪੭੦॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "This discourse and tale of the true King can be heard in every street after street. (470)"