[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਪੜਹੁ; ਮਨਿ ਕਰਹੁ ਬੀਚਾਰੁ ॥"
page = 230
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Repeat thou the Lord Name and reflect thereon within thy mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦਾ ਜਾਪ ਕਰ ਅਤੇ ਆਪਣੇ ਚਿੱਤ ਅੰਦਰ ਉਸ ਨੂੰ ਸੋਚ ਸਮਝ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Learn of the Lord, and contemplate Him in your mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਰਾਮ ਨਾਮ ਪੜ੍ਹੋ ਔਰ ਮਨ ਮੇਂ ਵੀਚਾਰ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ (ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ) ਪੜ੍ਹੋ, (ਆਪਣੇ) ਮਨ ਵਿਚ (ਪਰਮਾਤਮਾ ਦੇ ਗੁਣਾਂ ਦੀ) ਵਿਚਾਰ ਕਰੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lee acerca del Señor y reflexiona sobre Él en tu pensamiento,"