[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪੂਰੇ ਕੀ; ਸਰਨੀ ਪਰੇ ॥੧॥ ਰਹਾਉ ॥"
page = 181
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They enter the sanctuary of the perfect Guru. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੂਰਨ ਗੁਰਾਂ ਦੀ ਪਨਾਹ ਲੈਂਦੇ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "entering the Sanctuary of the Perfect Guru. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੁਰਸ ਪੂਰੇ ਗੁਰੋਂ ਕੀ ਸਰਨ ਮੇਂ ਪੜੇ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੇ ਮਨੁੱਖ ਪੂਰੇ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਂਦੇ ਹਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰੇ = ਪ੍ਰਫੁਲਤ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así busca el Refugio del Perfecto Guru.  (1-Pausa)"