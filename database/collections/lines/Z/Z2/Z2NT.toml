[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੋ ਭਵਰੁ; ਭਵੈ ਤਿਹੁ ਲੋਇ ॥"
page = 930
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The one soul wanders through the three worlds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇੱਕ ਆਤਮਾ ਤਿੰਨਾਂ ਜਹਾਨਾਂ ਅੰਦਰ ਭਟਕਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One Soul wanders through the three worlds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਓਹੀ (ਭਵਰੁ) ਜੀਵ ਰੂਪ ਹੋ ਕੇ ਤੀਨੋਂ ਲੋਕੋਂ ਮੇਂ ਭਰਮਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਗੁਪਾਲ ਦੀ ਜੋਤਿ ਹੀ ਸਾਰੇ ਜਗਤ ਵਿਚ ਪਸਰ ਰਹੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਕੋ ਭਵਰੁ = ਇਕੋ ਹੀ ਆਤਮਾ, ਇਕ ਪਰਮਾਤਮਾ ਦੀ ਹੀ ਜੋਤਿ। ਭਵੈ = ਪਸਰ ਰਹੀ ਹੈ, ਵਿਆਪਕ ਹੈ। ਤਿਹ ਲੋਇ = ਤਿੰਨਾਂ ਲੋਕਾਂ ਵਿਚ, ਸਾਰੇ ਜਗਤ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Alma divaga a través de todos los tres mundos."