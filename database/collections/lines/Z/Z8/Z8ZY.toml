[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਊਤਮ ਬਾਣੀ, ਸਬਦੁ ਸੁਣਾਏ ॥"
page = 664
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They hear the sublime Gurbani and the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸ੍ਰੇਸ਼ਟ ਗੁਰਬਾਣੀ ਅਤੇ ਨਾਮ ਨੂੰ ਸੁਣਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They listen to the most sublime Word of His Bani, and the Word of His Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਉਤਮ ਬਾਣੀ ਕਾ (ਸਬਦੁ) ਉਪਦੇਸ ਸੁਣਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਨੂੰ ਗੁਰੂ ਦੀ ਬਾਣੀ ਗੁਰੂ ਦਾ ਸ਼ਬਦ ਸੁਣਾਂਦਾ ਹੈ, ਤੇ ਪਵਿਤ੍ਰ ਜੀਵਨ ਵਾਲਾ ਬਣਾ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਊਤਮ = ਸ੍ਰੇਸ਼ਟ (ਜੀਵਨ ਵਾਲੇ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ellos escuchan el Gurbani Sublime y la Palabra de Su Shabd."