[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਿਜੁ ਪਤਿ ਕੋ ਪਾਵਤ ਭਈ; ਸੁਰਪੁਰ ਕਿਯੋ ਪਯਾਨ ॥੨੦॥"
page = 982

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And this way they reached heaven to meet their mate. (20)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਵਰਗ ਸਿਧਾਰ ਕੇ ਆਪਣੇ ਪਤੀ ਨੂੰ ਮਿਲ ਪਈਆਂ ॥੨੦॥"