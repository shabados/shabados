[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਆਪਨ ਆਪੁ; ਆਪਿ ਉਰਿ ਧਾਰੈ ॥"
page = 291
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Lord kept His ownself to His own mind,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਵਾਹਿਗੁਰੂ ਆਪਣੇ ਆਪ ਨੂੰ ਆਪਦੇ ਚਿੱਤ ਵਿੱਚ ਹੀ ਰੱਖਦਾ ਸੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When He kept Himself, All-in-all, unto His Own Heart,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਅਪਨੇ ਆਪ ਵਈਰਾਟ ਸਰੂਪ ਕੋ ਆਪ ਹੀ ਰਿਦੇ ਮੇਂ ਧਾਰ ਰਹਾ ਥਾ, ਭਾਵ ਸੇ ਨਿਰਗੁਨ ਸਰੂਪ ਮੇਂ ਲੀਨ ਕੀਆ ਹੂਆ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਪ੍ਰਭੂ ਆਪਣੇ ਆਪ ਨੂੰ ਆਪ ਹੀ ਆਪਣੇ ਆਪ ਵਿਚ ਟਿਕਾਈ ਬੈਠਾ ਸੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪਨ ਆਪੁ = ਆਪਣੇ ਆਪ ਨੂੰ। ਉਰਿਧਾਰੈ = ਹਿਰਦੇ ਵਿਚ ਟਿਕਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando el Señor habitaba en Su Propio corazón,"