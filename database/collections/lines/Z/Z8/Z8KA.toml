[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਰੰ ਬਾਰ; ਨਰਾਇਣ ਗਾਇਣ ॥"
page = 868
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Over and over again, I hymn the Lord's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁੜ ਮੁੜ ਕੇ ਮੈਂ ਪ੍ਰਭੂ ਦੀ ਕੀਰਤੀ ਗਾਇਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Time and time again, I sing the Lord's Praises."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਵਹੁ ਸੰਤ ਜਨ ਵਾਰੰਵਾਰ ਨਾਰਾਇਣ ਕਾ ਹੀ ਜਸੁ ਗਾਇਨ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੁੜ ਮੁੜ ਉਸ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੇ ਗੀਤ ਗਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਰੰਬਾਰ = ਮੁੜ ਮੁੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ahí cantan por siempre Su Alabanza"