[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਇਸ ਹੱਦੋਂ ਵੱਧ ਹੈਰਾਨੀ ਕਾਰਨ ਬਹੁਤ ਪਰੇਸ਼ਾਨ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਬਸ ਜ਼ ਹੈਰਾਨੀ ਪ੍ਰੀਸ਼ਾਂ ਮਾਂਦਾ ਅੰਦ ॥੨੭੯॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "By nature, he is generous, and comeliness is in his character,"