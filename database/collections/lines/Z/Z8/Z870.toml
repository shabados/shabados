[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੌ ਨਹਿ ਆਵੈ ਤੋ ਪੂਤ ਭਿਜਾਇ ਕਿ ਆਪਨ ਜਾਇ ਉਤਾਇਲ ਲ︀ਯੈਯੈ ॥੫॥"
page = 968

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘If he cannot come himself then, he may be requested to send his son,’(5)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੇ ਉਹ (ਬੰਦਾ ਭੇਜਣ ਤੇ) ਨਹੀਂ ਆਉਂਦਾ ਤਾਂ ਪੁੱਤਰ ਨੂੰ ਭੇਜ ਕੇ ਜਾਂ ਆਪ ਜਾ ਕੇ (ਉਸ ਨੂੰ) ਜਲਦੀ ਲੈ ਆਓ ॥੫॥"