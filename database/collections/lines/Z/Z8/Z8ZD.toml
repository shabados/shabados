data = "ਬ ਬਰਖ਼ੇਜ਼ ਸ਼ੋਲਹ ਬਸੇ ਚੂੰ ਗਹੁਰ ॥੫੦॥"
page = 1402

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The fire sparks flashed out gleaming like gems.(50)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ (ਉਸ ਵਿਚੋਂ) ਮੋਤੀ ਵਾਂਗ ਚਮਕਦੇ ਹੋਏ ਚੰਗਿਆੜੇ ਨਿਕਲੇ ॥੫੦॥"