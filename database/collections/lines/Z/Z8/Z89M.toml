[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸ੍ਰੀ ਮਨ ਮੋਹਨ ਜਗਤ ਗੁਰ; ਨੰਦ ਨੰਦਨ ਬ੍ਰਿਜ ਮੂਰਿ ॥"
page = 400

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Krishna is the preceptor of the world, son of Nand and the source of Braja"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਨ ਨੂੰ ਮੋਹਣ ਵਾਲਾ, ਜਗਤ ਦਾ ਗੁਰੂ, ਨੰਦ ਦਾ ਪੁੱਤਰ ਅਤੇ ਬ੍ਰਜ ਦਾ ਮੂਲ ਧੁਰਾ,"