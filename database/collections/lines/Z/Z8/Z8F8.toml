[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਚੀ ਜਾਨਿ ਕਰਿ ਜਕ ਰਹੈ; ਜਾਹਿ ਆਪੁ ਪੁਰਹੂਤ ॥੨॥"
page = 896

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She was as beautiful as Sachi (the consort of god Indra),(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਸਚੀ ਵਰਗਾ ਸਮਝ ਕੇ ਆਪ ਇੰਦਰ ਹੈਰਾਨ ਹੋ ਜਾਂਦਾ ਸੀ ॥੨॥"