[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸਾ ਗੁਰਮਤਿ; ਰਮਤੁ ਸਰੀਰਾ ॥"
page = 354
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, by Guru's instruction remember such Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਦੁਆਰਾ ਤੂੰ ਐਹੋ ਜੇਹੇ ਸਾਹਿਬ ਦਾ ਸਿਮਰਨ ਕਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Guru's Teachings, realize that He is pervading in all bodies;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰ ਸਿਖ੍ਯਾ ਕਰ ਸਰੀਰੋਂ ਮੇਂ ਬਿਆਪ੍ਯਾ ਹੂਆ ਐਸਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਗੁਰੂ ਦੀ ਮਤਿ ਤੇ ਤੁਰ ਕੇ ਸਾਰੇ ਸਰੀਰਾਂ ਵਿਚ ਵਿਆਪਕ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਐਸਾ ਹਰਿ = ਅਜੇਹਾ ਪਰਮਾਤਮਾ। ਰਮਤੁ ਸਰੀਰਾ = ਜੋ ਸਭ ਸਰੀਰਾਂ ਵਿਚ ਵਿਆਪਕ ਹੈ। ਰਮਤੁ = ਵਿਆਪਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mediante las Enseñanzas del Guru, toma Conciencia de la Compenetración del Señor."