[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਅਰਾਧਹਿ ਜੰਤ ॥"
page = 894
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the beings meditate on God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜੀਵ ਵਾਹਿਗੁਰੂ ਨੂੰ ਸਿਮਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All beings worship and adore Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਜੀਵ ਅਰਾਧਤੇ ਤੋ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜੀਵ ਉਸੇ ਦਾ ਆਰਾਧਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲ ਜੰਤ = ਸਾਰੇ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos Te contemplan, oh Dios"