[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਣੈਹਾਰੁ; ਪਛਾਣੈ ਸੋਇ ॥"
page = 282
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He recognises Him as the Creator."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਉਸ ਨੂੰ ਸਿਰਜਣਹਾਰ ਕਰਕੇ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Acknowledge that Creator Lord;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਤਿਸ ਕਰਨੇ ਹਾਰ ਪ੍ਰਭੂ ਕੌ ਸੋ ਜਨ ਪਛਾਣਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਸਭ ਕੁਝ ਕਰਨ ਵਾਲਾ ਪ੍ਰਭੂ ਨੂੰ ਹੀ ਸਮਝਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así él reconoce al Señor Creador."