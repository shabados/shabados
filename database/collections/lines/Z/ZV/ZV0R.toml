[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਨੁ ਇਕ ਬਿਬੇਕ ਸੁਨਹੋ ਨ੍ਰਿਪਤਿ, ਅਉਰ ਦੂਸਰ ਕੋ ਹਟਕ ਹੈ ॥੧੭੩॥"
page = 692

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The day on which such a joyful atmosphere will present itself with full brilliance, then, O king! tell me, on that day, who will reject its impact Vivek?173."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਜਨ! ਸੁਣੋ, ਇਕ ਬਿਬੇਕ ਤੋਂ ਬਿਨਾ ਹੋਰ ਦੂਜਾ ਕਿਹੜਾ (ਸੂਰਮਾ ਉਸ ਨੂੰ) ਰੋਕੇਗਾ ॥੧੭੩॥"