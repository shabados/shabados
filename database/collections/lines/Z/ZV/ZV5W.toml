type = "primary"
data = "ਸਿਵਹਿ ਰਿਝਾਇ ਮਾਗ ਕਰਿ ਲੀਯੋ ॥"
page = 958

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On top of that she applied poison, which she had obtained from the reptiles after pleasing Shiva."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਸ਼ਿਵ ਨੂੰ ਪ੍ਰਸੰਨ ਕਰ ਕੇ (ਵਰ) ਮੰਗ ਲਿਆ"