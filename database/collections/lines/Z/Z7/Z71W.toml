[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨੇ ਸਤਿਗੁਰ ਕੀ ਵਡਿਆਈ ॥"
page = 626
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Singing the praise of my True Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਮਹਿਮਾ ਗਾਇਨ ਕਰਕੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is the glorious greatness of my True Guru;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹੁ ਸਭ ਅਪਨੇ ਸਤਿਗੁਰੋਂ ਕੀ ਵਡਿਆਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਵੇਖੋ) ਆਪਣੇ ਗੁਰੂ ਦੀ ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਡਿਆਈ = ਵਡੱਪਣ, ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ, ਵੱਡਾ ਜਿਗਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal es la Gloria de mi Guru Perfecto,"