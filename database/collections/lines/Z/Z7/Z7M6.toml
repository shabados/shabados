[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਸਿਉ; ਆਲਸੁ ਕਿਉ ਬਨੈ. ਮਾਇ ॥੧॥"
page = 195
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "how can indolence with Him (in his service) behoove the man, O mother?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨਾਲ (ਉਹ ਦੀ ਸੇਵਾ ਵਿੱਚ) ਸੁਸਤੀ ਕਰਨੀ, ਕਿਸ ਤਰ੍ਹਾਂ ਆਦਮੀ ਲਈ ਵਾਜਬ ਹੈ, ਮੇਰੀ ਮਾਤਾ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "how can laziness help them, O mother? ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਮਾਇ) ਹੇ ਭਾਈ ਤਿਸ ਕੇ ਸਾਥ ਆਲਸ ਕਰਨਾ ਕਿਉਂ ਬਨਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਯਾਦ ਵਲੋਂ ਆਲਸ ਕਰਨਾ ਕਿਸੇ ਤਰ੍ਹਾਂ ਭੀ ਫਬਦਾ ਨਹੀਂ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਉ ਬਨੈ = ਕਿਵੇਂ ਫਬ ਸਕਦਾ ਹੈ? ਨਹੀਂ ਫਬਦਾ। ਮਾਇ = ਹੇ ਮਾਂ! ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿cómo puede la pereza ayudarles, oh madre? (2)"