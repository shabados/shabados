[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਪਉੜੑੇ; ਪ੍ਰਭ ਬਾਲ ਗੋਬਿੰਦ ॥੧॥"
page = 1162
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "where abides my young Lord Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਮੇਰਾ ਨੌਜਵਾਨ ਸੁਆਮੀ ਮਾਲਕ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "where the Eternally Young Lord God abides. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਹਾਂ ਪ੍ਰਭੂ ਜੋ ਬਾਲ ਗੋਬਿੰਦ ਰੂਪ ਹੈ (ਪਉੜੇ) ਬਿਰਾਜਮਾਨ ਹੋ ਰਹੇ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਮ ਸਿਮਰਨ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਜਿਸ ਹਿਰਦੇ ਵਿਚ ਬਾਲ-ਸੁਭਾਉ ਪ੍ਰਭੂ-ਗੋਬਿੰਦ ਆ ਵੱਸਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਹ ਪਉੜ੍ਹ੍ਹੇ = ਜਿਸ ਟਿਕਾਣੇ ਤੇ, ਜਿਸ ਹਿਰਦੇ ਵਿਚ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la Luz de la Sabiduría destella y todo es Éxtasis. (1)"