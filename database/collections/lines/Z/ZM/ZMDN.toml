[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੀਘਰ; ਕਾਰਜੁ ਲੇਹੁ ਸਵਾਰਿ ॥੧॥ ਰਹਾਉ ॥"
page = 176
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and quickly have thine affairs set aright. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਇਸ ਤਰ੍ਹਾਂ) ਛੇਤੀ ਹੀ ਆਪਣੇ ਕੰਮ ਨੇਪਰੇ ਚਾੜ੍ਹ ਲੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and your affairs shall be quickly resolved. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨਾ ਕਾਰਜ (ਸੀਘਰ) ਛੇਤੀ ਸਵਾਰ ਲੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ (ਇਸ ਤਰ੍ਹਾਂ) ਆਪਣਾ ਮਨੁੱਖਾ ਜੀਵਨ ਦਾ ਮਨੋਰਥ ਸਵਾਰ ਲੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੀਘਰ = ਛੇਤੀ। ਕਾਰਜੁ = ਜੀਵਨ-ਮਨੋਰਥ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y todas tus tareas serán cumplidas en un instante. (1-Pausa)"