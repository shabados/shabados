[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਮੂਆ. ਨ ਜੋਹੈ; ਹਰਿ ਕੀ ਸਰਣਾਈ ॥"
page = 231
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If one enters God's sanctuary, death's Courier spits him not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਬੰਦਾ ਵਾਹਿਗੁਰੂ ਦੀ ਪਨਾਹ ਲੈ ਲਵੇ ਤਾਂ ਮੌਤ ਦਾ ਦੂਤ ਉਸ ਨੂੰ ਨਹੀਂ ਤਕਾਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Messenger of Death does not catch sight of those who enter the Sanctuary of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਹਰੀ ਕੀ ਸਰਣ ਆਏ ਹੈਂ ਤਿਨ ਕੋ ਜਮ ਤਕਦਾ ਵਾ ਦਬਾਉਂਦਾ ਨਹੀਂ, ਭਾਵ ਦੁਖ ਨਹੀਂ ਦੇਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜੇਹੜਾ ਮਨੁੱਖ) ਪਰਮਾਤਮਾ ਦੀ ਸਰਨ ਪਿਆ ਰਹਿੰਦਾ ਹੈ, ਵਿਚਾਰਾ ਜਮ ਉਸ ਵਲ ਤੱਕ ਭੀ ਨਹੀਂ ਸਕਦਾ (ਆਤਮਕ ਮੌਤ ਉਸ ਦੇ ਨੇੜੇ ਨਹੀਂ ਢੁੱਕਦੀ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਮੂਆ = ਵਿਚਾਰਾ ਜਮ। ਨ ਜੋਹੈ = ਤੱਕ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si uno busca el Refugio del Señor, se vuelve invisible a Yama."