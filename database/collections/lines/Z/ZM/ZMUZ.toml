[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਇਹ ਅਤੇ ਉਹ ਜਹਾਨ ਦੋਵੇਂ ਸੱਚ ਨਾਲ ਭਰਪੂਰ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਈਂ ਜਹਾਨੋ ਆਂ ਜਹਾਂ ਅਜ਼ ਹੱਕ ਪੁਰ ਅਸਤ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, he is the light and radiance in each and every eye. (152)"