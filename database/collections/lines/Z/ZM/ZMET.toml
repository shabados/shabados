[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਹਿ ਮਰਿਓ ਮੁਰ ਨਾਮ ਅਘਾਸੁਰ; ਪੈ ਬਲਿ ਕੋ ਛਲ ਸੋ ਜੁ ਛਲਿਓ ਹੈ ॥"
page = 334

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He, who killed mUr and Aghasura and duped the king Bali"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਮੁਰ (ਦੈਂਤ) ਅਤੇ ਅਘਾਸੁਰ ਨਾਂ ਵਾਲੇ (ਦੈਂਤ) ਨੂੰ ਮਾਰਿਆ ਹੈ ਅਤੇ ਛਲ ਨਾਲ ਬਲਿ ਰਾਜੇ ਨੂੰ ਛਲਿਆ ਹੈ;"