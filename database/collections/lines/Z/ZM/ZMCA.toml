[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਰਿ ਹਰਉਲ ਭਜਾਇ ਦਏ; ਨ੍ਰਿਪ ਗੋਲ ਕੇ ਮਧਿ ਪਰਿਯੋ ਤਬ ਧਾਯੋ ॥"
page = 481

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He fell upon the group of kings and with his plough, caused all of them to run away"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੂਹਰਲੀ ਸੈਨਾ ਨੂੰ ਮਾਰ ਕੇ ਭਜਾ ਦਿੱਤਾ ਹੈ ਅਤੇ ਰਾਜਾ ਵਿਯੂਹ (ਚੱਕਰ) ਵਿਚ ਘਿਰਨੋ ਭਜ ਨਿਕਲਿਆ ਹੈ।"