[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੇ ਨਾਮ ਕੀ; ਤਿਲੁ ਵਡਿਆਈ ॥"
page = 9
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Recounting the greatness of the True name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਨਸਾਨ ਸੱਚੇ ਨਾਮ ਦੀ ਬਜ਼ੁਰਗੀ ਨੂੰ ਬਿਆਨ ਕਰਦੇ ਹੋਏ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Trying to describe even an iota of the Greatness of the True Name,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿ ਨਾਮ ਕੀ (ਤਿਲੁ) ਥੋੜੀ ਸੀ ਭੀ (ਵਡਿਆਈ) ਸੋਭਾ ਕੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੀ ਰਤਾ ਜਿਤਨੀ ਭੀ ਮਹਿਮਾ…"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਲੁ = ਰਤਾ ਭਰ ਭੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Muchos se han fatigado diciendo lo grande que es el Nombre,"