[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੰਧਨ ਕਾਟਿ; ਸੇਵਕ ਕਰਿ ਰਾਖੇ ॥"
page = 395
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Shattering the shackles the Guru has protected me like his slave"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇੜੀਆਂ ਵੱਢ ਕੇ, ਗੁਰਾਂ ਨੇ ਮੇਰੀ ਆਪਣੇ ਗੋਲੇ ਦੀ ਤਰ੍ਹਾਂ ਰੱਖਿਆ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Shattering his bonds, the Guru has saved His servant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਪਰ ਸਤਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਹੂਈ ਹੈ, ਤਿਨ ਕੇ ਸੁਭਾਸੁਭ ਕਰਮ ਰੂਪ ਬੰਧਨ ਕਾਟਿ ਕਰ ਕੇ ਅਪਨੇ ਦਾਸ ਕਰ ਰਾਖੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ (ਮਾਇਆ ਦੇ ਮੋਹ ਦੇ) ਬੰਧਨ ਕੱਟ ਕੇ ਮੈਨੂੰ ਗੁਰੂ ਨੇ ਆਪਣਾ ਸੇਵਕ ਬਣਾ ਕੇ ਆਪਣੇ ਚਰਨਾਂ ਵਿਚ ਟਿਕਾ ਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਟਿ = ਕੱਟ ਕੇ। ਕਰਿ = ਬਣਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y libres quedan las amarras del Devoto;"