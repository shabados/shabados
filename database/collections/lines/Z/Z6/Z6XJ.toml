[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭਿ ਪਦਾਰਥ ਪਾਈਅਨਿ; ਸਿਮਰਣੁ ਸਚੁ ਲਾਹੁ ॥"
page = 556
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lord's meditation is the true profit, by which all the valuables are obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਦੀ ਬੰਦਗੀ ਸੱਚਾ ਮੁਨਾਫ਼ਾ ਹੈ, ਜਿਸ ਦੁਆਰਾ ਸਾਰੇ ਧਨ-ਪਦਾਰਥ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All treasures are obtained - meditative remembrance on the Lord is the true profit."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਚ ਰੂਪ! ਤੇਰੇ ਨਾਮ ਕੇ ਸਿਮਰਨ ਕੇ ਲਾਹੇ ਸੇ ਸਭ ਪਦਾਰਥ ਪ੍ਰਾਪਤ ਹੋਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਪਦਾਰਥ ਉਹਨਾਂ ਨੂੰ ਮਿਲਦੇ ਹਨ, ਉਹ ਨਾਮ ਸਿਮਰਨ (ਰੂਪ) ਸੱਚਾ ਲਾਹਾ ਖੱਟਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਈਅਨਿ = ਮਿਲਦੇ ਹਨ। ਲਾਹੁ = ਲਾਭ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así viven totalmente satisfechos y cosechan el Fruto de la Contemplación de la Verdad."