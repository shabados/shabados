[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤਹੁ; ਸਾਚੇ ਕੀ ਵਡਿਆਈ ॥"
page = 629
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O saints, Glory be to the True Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਧੂਓ! ਤੁਸੀਂ ਸੱਚੇ ਸਾਈਂ ਦੀ ਪ੍ਰਭਤਾ ਗਾਇਨ ਕਰੋ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Saints, this is the glorious greatness of the True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋਂ! ਹਮ ਸਾਚੇ ਵਾਹਿਗੁਰੂ ਕੀ ਵਡਿਆਈ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! (ਵੇਖੋ) ਵੱਡੀ ਸ਼ਾਨ ਉਸ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚੇ ਕੀ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦੀ। ਵਡਿਆਈ = ਵੱਡੀ ਸ਼ਾਨ, ਵੱਡੀ ਤਾਕਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Santos, Gloria sea al Verdadero Señor,"