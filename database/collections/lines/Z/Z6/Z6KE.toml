[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਰਸੁ ਚਾਖਤ ਧ੍ਰਾਪਿਆ; ਮਨਿ ਰਸੁ ਲੈ ਹਸਨਾ ॥"
page = 811
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man is satiated tasting the Lord's elixir and receiving this elixir his soul blooms."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਅੰਮ੍ਰਿਤ ਨੂੰ ਚੱਖ ਕੇ ਬੰਦਾ ਰੱਜ ਜਾਂਦਾ ਹੈ ਅਤੇ ਇਸ ਅੰਮ੍ਰਿਤ ਨੂੰ ਪਰਾਪਤ ਕਰ, ਉਸ ਦੀ ਆਤਮਾ ਪ੍ਰਫੁਲਤ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Tasting the subtle essence of the Lord, one is satisfied; receiving this essence, the mind becomes happy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਹਰਿ ਨਾਮ ਕੇ ਰਸ ਕੋ ਚਾਖਤੇ ਹੀ ਹਮਾਰਾ ਮਨ (ਧ੍ਰਾਪਿਆ) ਤ੍ਰਿਪਤ ਹੋਇਆ ਹੈ। ਜਨ ਨਾਮ ਰਸ ਮੇਂ ਲੀਨ ਹੋ ਕਰ ਮਨ (ਹਸਨਾ) ਪਰਮ ਪ੍ਰਸੰਨ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ) ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਰਸ ਚੱਖਿਆਂ (ਮਾਇਆ ਦੇ ਲਾਲਚ ਵਲੋਂ) ਰੱਜ ਜਾਈਦਾ ਹੈ, ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਰਸ ਮਨ ਵਿਚ ਵਸਾ ਕੇ ਸਦਾ ਖਿੜੇ ਰਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸੁ = ਸੁਆਦ। ਧ੍ਰਾਪਿਆ = ਰੱਜ ਗਿਆ। ਮਨਿ = ਮਨ ਵਿਚ। ਹਸਨਾ = ਖਿੜ ਪਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno vive saciado, saboreando la Esencia del Señor con su mente en flor."