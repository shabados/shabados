[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਮੇਲੇ ਕਰਣੀ ਸਾਰੀ ॥"
page = 1060
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself provides the occasion to do sublime deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਖ਼ੁਦ ਹੀ ਸ਼੍ਰੇਸ਼ਟ ਅਮਲ ਕਮਾਉਣ ਦਾ ਮੌਕਾ ਬਖ਼ਸ਼ਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself bestows Union through actions of excellence."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਜੀਵ ਕੋ ਸ੍ਰੇਸਟ ਕਰਣੀ ਦੇ ਕੇ ਮੇਲ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਮ ਜਪਣ ਦੀ) ਸ੍ਰੇਸ਼ਟ ਕਰਣੀ ਦੇ ਕੇ ਆਪ ਹੀ (ਜੀਵ ਨੂੰ ਆਪਣੇ ਨਾਲ) ਮਿਲਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਰੀ = ਸ੍ਰੇਸ਼ਟ। ਕਰਣੀ = ਕਰਨ-ਯੋਗ ਕੰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, ¿qué puede hacer la pobre criatura?"