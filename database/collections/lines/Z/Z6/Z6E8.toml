[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਤੇ ਬਿਨਸੈ; ਸਗਲਾ ਭਰਮੁ ॥"
page = 274
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and from his mind all superstition is removed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਚਿੱਤ ਤੋਂ ਸਾਰਾ ਸੰਦੇਹ ਦੂਰ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All doubts are removed from his mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜਿਸ ਕੇ ਸੰਪੂਰਨ ਭ੍ਰਮ ਨਾਸ ਹੋ ਜਾਵੈ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਮਨ ਵਿਚੋਂ ਹਰ ਤਰ੍ਹਾਂ ਦਾ ਵਹਿਮ ਮਿਟ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y liberando su mente de la duda, reconoce la Presencia de Dios en todo."