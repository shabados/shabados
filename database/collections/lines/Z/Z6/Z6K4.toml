[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਹਰਿ ਭਗਤਿ; ਨਹੀ ਛੁਟਕਾਰਾ ॥"
page = 891
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that without the Lord's meditation one is released not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿ ਸੁਆਮੀ ਦੇ ਸਿਮਰਨ ਦੇ ਬਾਝੋਂ ਇਨਸਾਨ ਦੀ ਖਲਾਸੀ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "that without devotional worship of the Lord, no one is saved."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਏਹੀ ਕਰਤੇ ਹੈਂ ਕਿ ਹਰੀ ਭਗਤਿ ਬਿਨਾਂ ਛੁਟਕਾਰਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਤੋਂ ਬਿਨਾ (ਮਾਇਆ ਦੇ ਮੋਹ ਤੋਂ) ਖ਼ਲਾਸੀ ਨਹੀਂ ਹੋ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛੁਟਕਾਰਾ = ਮਾਇਆ ਤੋਂ ਖ਼ਲਾਸੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que sin la Alabanza del Señor, uno no es liberado."