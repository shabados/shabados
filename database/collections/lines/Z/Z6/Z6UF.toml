[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਿਕਸਿ ਆਪਿ ਆਵਤ ਭਈ; ਤਾਲੋ ਦ੍ਰਿੜ ਕਰਿ ਲਾਇ ॥੧੦॥"
page = 849

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And herself locked the door and came down.(10)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪ ਚੰਗੀ ਤਰ੍ਹਾਂ ਤਾਲਾ ਲਗਾ ਕੇ ਨਿਕਲ ਆਈ ॥੧੦॥"