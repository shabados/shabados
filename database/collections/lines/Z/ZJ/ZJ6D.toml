[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਤਨ; ਨਾਮਹਿ ਨਾਮਿ ਸਮਾਨੇ ॥"
page = 286
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "their body and soul merge in the Name alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੀ ਆਤਮਾ ਤੇ ਦੇਹਿ ਕੇਵਲ ਨਾਮ ਅੰਦਰ ਲੀਨ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "their minds and bodies are drenched with the Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਤਨ ਸੇ ਨਾਮੀ ਕੇ ਨਾਮ ਮੇਂ ਹੀ ਸਮਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਦੇ ਮਨ ਤਨ ਕੇਵਲ ਪ੍ਰਭੂ-ਨਾਮ ਵਿਚ ਹੀ ਜੁੜੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਮਹਿ ਨਾਮਿ = ਨਾਮ ਹੀ ਨਾਮ ਵਿਚ, ਕੇਵਲ ਨਾਮ ਵਿਚ ਹੀ। ਸਮਾਨੇ = ਜੁੜੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "se han convertido en Uno con Él."