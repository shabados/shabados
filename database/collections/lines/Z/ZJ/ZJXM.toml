[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਆਪੇ ਜਾਣਹਿ; ਸਰਬ ਵਿਡਾਣੀ ॥"
page = 355
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou, O All-wonder, Thyself knowest every-thing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੇ ਪੂਰਨ ਅਸਚਰਜ ਰੂਪ! ਖੁਦ ਹੀ ਸਾਰਾ ਕੁਛ ਸਮਝਦਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Only You Yourself know, O Lord of total wonder."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਸੇ (ਵਿਡਾਣੀ) ਵਡਾ ਵਾ ਅਸਚਰਜ ਰੂਪ ਪਰਮੇਸ੍ਵਰ ਆਪ ਸਭ ਜੀਵੋਂ ਕੀ ਗਤਿ ਕੋ ਜਾਨਤਾ ਹੈ, ਤੂੰ ਇਸ ਪ੍ਰਕਾਰ ਜਾਨ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ (ਇਸ ਭੇਦ ਨੂੰ) ਆਪ ਹੀ ਜਾਣਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਬ ਵਿਡਾਣੀ = ਹੇ ਸਾਰੇ ਅਸਚਰਜ ਕੌਤਕ ਕਰਨ ਵਾਲੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "cuando Tú, Maravilla Máxima, lo conoces todo?"