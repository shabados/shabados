[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖ ਲੋਭਿ; ਦੂਜੈ ਲੋਭਾਇਆ ॥"
page = 1277
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The avaricious egocentric is enticed away by duality."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲਾਲਚੀ ਮਨਮਤੀਏ ਨੂੰ ਦਵੈਤ-ਭਾਵ ਲੁਭਾਇਮਾਨ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The greedy self-willed manmukh is attracted and engrossed in duality."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ ਲੋਭੀ ਦ੍ਵੈਤ ਮੇਂ ਲੁਭਾਇਆ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਦੇ ਪਿਛੇ ਤੁਰਨ ਵਾਲਾ ਮਨੁੱਖ ਮਾਇਆ ਦੇ ਲੋਭ ਦੇ ਕਾਰਨ (ਪ੍ਰਭੂ ਦੀ ਯਾਦ ਤੋਂ ਬਿਨਾ) ਹੋਰ (ਦੇ ਪਿਆਰ) ਵਿਚ ਮਗਨ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੋਭਿ = ਮਾਇਆ ਦੇ ਲੋਭ ਦੇ ਕਾਰਨ। ਦੂਜੈ = (ਪ੍ਰਭੂ ਦੀ ਯਾਦ ਤੋਂ ਬਿਨਾ) ਹੋਰ ਵਿਚ। ਲੋਭਾਇਆ = ਮਗਨ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El avaro y soberbio Manmukj es atraído y enredado en la dualidad."