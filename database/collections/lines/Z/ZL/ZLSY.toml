[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਯਾ ਅਜਯਾ ਚਰਮਣੀ ਚਾਵਡਾਯੰ ॥"
page = 117

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Unconquerable for ever and conqueror of all, bearer of elegant shield"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਤ ਪ੍ਰਾਪਤ ਕਰਨ ਵਾਲੀ, ਨਾ ਜਿਤੇ ਜਾ ਸਕਣ ਵਾਲੀ, ਚੁੜੇਲਾਂ ਨੂੰ ਚਬਣ ਵਾਲੀ (ਨੂੰ ਨਮਸਕਾਰ ਹੈ);"