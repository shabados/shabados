[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਖੀਰਿ ਖੰਡੁ ਘਿਉ ਮੇਲਿ ਕਰਿ; ਅਤਿ ਵਿਸਮਾਦੁ ਸਾਦ ਰਸ ਕੇਲਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Mixing the milk, sugar, ghee etc. many dainty dishes are prepared."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਖੀਰ' (ਦੁਧ), ਖੰਡ, ਅਰ ਘਿਉ ਮਿਲਕੇ ਵਡੇ ਅਚਰਜ ਰਸ ਵਾਲੀ (ਤਸ਼ਮਈ ਬਣਦੀ ਹੈ) ਜਿਸ ਤੋਂ ਰਸ ਲੈਂਦੇ ਹਨ।"