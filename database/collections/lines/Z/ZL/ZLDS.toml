[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੀ ਕਰਤਾਰਹੁ ਡਰਣਾ ॥੧॥ ਰਹਾਉ ॥"
page = 24
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the same abide in the fear of the Maker. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਹਮ, ਸਾਜਣ-ਹਾਰ ਦੇ ਭੈ ਅੰਦਰ ਰਹੁ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "so live in the Fear of God the Creator. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰੁ ਹੇ ਮੁਲਾਂ! ਤੈਂਨੇ ਭੀ ਮਰਣਾ ਹੈ, ਕਦਾਚਿਤ ਐਸੀ ਆਸੰਕਾ ਹੋਵੇ ਕਿ ਜੇ ਕਰ ਮਰਨਾ ਹੀ ਹੈ, ਤੋ ਫਿਰ ਕਿਯਾ ਡਰਨਾ ਹੈ। ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ: ਹੇ ਭਾਈ! ਯਦਪਿ ਮਰਨਾ ਹੀ ਹੈ ਤਦਪਿ ਕਰਤਾਰ ਸੇ ਡਰਤੇ ਰਹਿਣਾ ਹੀ ਭਲਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਰੱਬ ਤੋਂ ਹੀ ਡਰਨਾ ਚਾਹੀਦਾ ਹੈ (ਰੱਬ ਦੇ ਡਰ ਵਿਚ ਰਹਿਣਾ ਹੀ ਫਬਦਾ ਹੈ। ਭਾਵ, ਰੱਬ ਦੇ ਡਰ ਵਿਚ ਰਿਹਾਂ ਹੀ ਮੌਤ ਦਾ ਡਰ ਦੂਰ ਹੋ ਸਕਦਾ ਹੈ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੀ = ਤਾਂ ਤੇ। ਕਰਤਾਰਹੁ = ਕਰਤਾਰ ਤੋਂ॥੧॥ਰਹਾਉ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué no entonces vivir en el Fervor al Señor? (1-Pausa)"