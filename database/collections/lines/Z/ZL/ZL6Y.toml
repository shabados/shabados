[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਓੜਕੁ ਕੀਤੁਸੁ ਆਪਣਾ; ਆਪ ਗਣਾਇਐ ਭਰਮਿ ਭੁਲਾਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He left no stone unturned but remained misguided in his own so-called greatness."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਓੜਕ ਕੀਤੋਸੁ ਆਪਣਾ=) ਆਪਣੀ ਵਲੋਂ ਸਾਰੀ ਵਾਹ ਲਾ ਥੱਕਾ, ਆਪਣਾ ਆਪ ਗਣਾਕੇ ਭਰਮ ਵਿਖੇ ਹੀ ਭੁੱਲਾ ਰਿਹਾ।"