[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੋਪ ਸਿੰਘ ਕੋ ਹਤ ਕੀਯੋ; ਕੋਟਿ ਸਿੰਘ ਕੋ ਮਾਰਿ ॥"
page = 432

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Kip Singh and Kot Singh were killed"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕੋਪਿ ਸਿੰਘ ਨੂੰ ਨਸ਼ਟ ਕਰ ਕੇ (ਫਿਰ) ਕੋਟਿ ਸਿੰਘ ਨੂੰ ਮਾਰ ਦਿੱਤਾ।"