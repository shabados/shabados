[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਾਤਾ ਸੋ ਸਾਲਾਹੀਐ; ਜਿ ਸਭਸੈ ਦੇ ਆਧਾਰੁ ॥"
page = 1239
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Eulogise thou the Beneficent Lord, who gives sustenance to all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਉਸ ਦੇਣਹਾਰ-ਪ੍ਰਭੂ ਦੀ ਕੀਰਤੀ ਕਰ ਜੋ ਸਾਰਿਆਂ ਨੂੰ ਰੋਜੀ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Praise the Great Giver, who gives sustenence to all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦਾਤਾ ਸੋਈ ਸਲਾਹੀਏ ਜੋ ਸਭ ਜੀਵੋਂ ਕੋ (ਆਧਾਰੁ) ਆਸਰਾ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਇਕ ਦਾਤਾਰ ਦੇ ਗੁਣ ਗਾਓ ਜੋ ਹਰੇਕ ਜੀਵ ਨੂੰ ਆਸਰਾ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿ = ਜਿਹੜਾ। ਸਭਸੈ = ਸਭਨਾਂ ਨੂੰ। ਆਧਾਰੁ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a ese Dios Bondadoso que da sustento a todos."