[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਖ ਉਸਤਤਿ ਉਸਤਤਿ ਕਰੈ; ਉਸਤਤਿ ਨ ਸਿਞਾਣੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Millions of eulogisers recite praise s but they do not understand the real praise."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਲਖਾਂ ਉਸਤਤਾਂ (ਕਰਣਹਾਰੇ ਦੇਵਤਿਆਂ ਦੀਆਂ) ਉਸਤਤੀਆਂ ਕਰਦੇ ਹਨ, (ਪਰ ਉਸ ਵਾਹਿਗੁਰੂ ਦੀ) ਉਸਤਤੀ ਨਹੀਂ ਸਿਾਣਦੇ।"