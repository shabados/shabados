[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਜੈ ਸੁ ਜਾਗਉ; ਆਸ ਪਿਆਸੀ ॥"
page = 357
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Even now, I awake smitten with intense expectation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਭੀ ਮੈਂ ਪਰਮ ਚਾਹਵਾਨ ਹੋ ਜਾਗਦੀ ਰਹਿੰਦੀ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Even now, I am held by hope and desire."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬੀ ਤੌ ਮੈਂ ਮਿਲਨੇ ਕੀ ਆਸ ਕੀ ਪ੍ਯਾਸਾ ਕਰ ਜਾਗਤੀ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮਾਂ! ਜਵਾਨੀ ਤਾਂ ਲੰਘ ਗਈ ਹੈ, ਪਰ ਅਰਦਾਸ ਕਰ) ਅਜੇ ਭੀ ਮੈਂ ਮਾਇਆ ਦੀਆਂ ਆਸਾਂ ਦੀ ਪਿਆਸ ਵਲੋਂ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਜੈ = ਹੁਣ ਭੀ ਜਦੋਂ ਕਿ ਸਰੀਰ ਕਾਇਮ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si pudiera estar despierto para calmar mi sed"