[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੇਵਡੁ ਦਾਤਾ ਆਖੀਐ; ਦੇ ਕੈ ਰਹਿਆ ਸੁਮਾਰਿ ॥"
page = 53
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How great should the Giver be called? He gives bounties beyond enumeration."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਾਤਾਰ ਨੂੰ ਕਿੱਡਾ ਵੱਡਾ ਕਹਿਆ ਜਾਵੇ? ਉਹ ਗਿਣਤੀ ਤੋਂ ਬਾਹਰ ਦਾਤਾਂ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How great should we call the Giver? His Gifts are beyond estimation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਤਿਸ ਕੋ (ਕੇਵਡੁ) ਕਿਤਨਾਕੁ ਵੱਡਾ ਦਾਤਾ ਕਥਨ ਕਰੀਏ, ਭਾਵ ਯਹਿ ਕਿ ਬਿਅੰਤੁ ਹੀ ਕਥਨ ਕਰੀਏ, ਜੋ ਦੇ ਕਰ ਕੇ ਸਮਾਲ ਕਰ ਰਹਾ ਹੈ, ਵਾ ਦੇ ਕੇ ਗਿਣਤੀ ਨਹੀਂ ਕਰਤਾ ਹੈਂ॥ ਤਾਂ ਤੇ ਐਸੇ ਬੇਨਤੀ ਕਰੀਏ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਦੱਸਿਆ ਹੀ ਨਹੀਂ ਜਾ ਸਕਦਾ ਕਿ ਪਰਮਾਤਮਾ ਕਿਤਨਾ ਵੱਡਾ ਦਾਤਾ ਹੈ। ਉਹ ਦਾਤਾਂ ਦੇ ਰਿਹਾ ਹੈ, ਪਰ ਦਾਤਾਂ ਗਿਣਤੀ ਤੋਂ ਪਰੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਮਾਰਿ = ਸ਼ੁਮਾਰ ਤੋਂ, ਗਿਣਤੀ ਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero ni se imaginan lo Bondadoso que es Él."