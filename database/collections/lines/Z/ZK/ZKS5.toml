[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਿਆਏ ਗਾਏ ਕਰਨੈਹਾਰ ॥"
page = 535
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I remember and hymn the Creator alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕੇਵਲ ਕਰਤਾਰ ਨੂੰ ਹੀ ਸਿਮਰਦਾ ਅਤੇ ਗਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I meditate, and sing of the Creator Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਕੇ ਕਰਤਾ ਪਰਮੇਸ੍ਵਰ ਜੀ ਰਿਦੇ ਮੇਂ ਧਿਆਏ ਹੈਂ ਅਰ ਬਾਨੀ ਕਰ ਕੇ ਭੀ ਤਿਸੀ ਕੇ ਗੁਨ ਗਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਸਿਰਜਣਹਾਰ ਕਰਤਾਰ ਦਾ ਧਿਆਨ ਧਰਦਾ ਹੈ ਕਰਤਾਰ ਦੇ ਗੁਣ ਗਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਿਆਏ = ਧਿਆਨ ਕਰਦਾ ਹੈ। ਗਾਏ = ਗਾਂਦਾ ਹੈ। ਕਰਨੈਹਾਰ = ਸਿਰਜਣਹਾਰ ਕਰਤਾਰ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Contempla y cántale sólo al Señor Creador para que quedes libre de miedos y te mantengas en Estado de Éxtasis,"