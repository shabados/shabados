data = "ਸਦੈਵ ਸਰਬ ਪਾਲ ਹੈ ॥੨॥੧੦॥"
page = 128

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is Indiscriminate from the very beginning and always sustains all.2.10."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਦਿ-ਕਾਲ ਵਾਲਾ ਹੈਂ; ਸਦਾ ਸਭ ਦੀ ਪਾਲਣਾ ਕਰਨ ਵਾਲਾ ਹੈਂ ॥੨॥੧੦॥"