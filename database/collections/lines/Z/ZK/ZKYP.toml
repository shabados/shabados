[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹਿਬੇ ਕੌ ਤਨ ਏਕ ਹੀ; ਲਹਿਬੇ ਕੋ ਤਨ ਦੋਇ ॥੨੬॥"
page = 939

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Although they were two bodies, they were one (in soul).(26)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਹਿਣ ਲਈ ਤਾਂ ਇਕ ਹੀ ਤਨ ਸੀ ਪਰ ਵੇਖਣ ਲਈ ਦੋ ਤਨ ਸਨ ॥੨੬॥"