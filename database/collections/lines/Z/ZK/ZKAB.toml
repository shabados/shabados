[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਿਲੈ ਜਿ ਤੀਰਥਿ ਨਾਤਿਆਂ; ਡਡਾਂ ਜਲ ਵਾਸੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "If one could attain liberation by taking bath at pilgrimage centres then (we know that) the frogs always live in water."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੇ ਤੀਰਥ ਨ੍ਹਾਤਿਆਂ (ਮੁਕਤੀ) ਮਿਲਦੀ (ਤਾਂ) ਡੱਡਾਂ ਬੀ ਜਲ ਵਾਸੀ ਹਨ।"