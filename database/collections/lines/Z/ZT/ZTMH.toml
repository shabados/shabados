[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਣਿ ਸਾਜਨ; ਮੇਰੇ ਮੀਤ ਪਿਆਰੇ ॥"
page = 869
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hearken, O my dear friend and intimate."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੰਨ ਕਰ! ਤੂੰ ਹੇ ਮੇਰੇ ਮਿੱਠੜੇ ਮਿੱਤਰ ਅਤੇ ਯਾਰ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen, O my beloved friends and companions:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸਜਣੋਂ ਮਿਤ੍ਰ ਪਿਆਰਿਓ! ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸੱਜਣ! ਹੇ ਪਿਆਰੇ ਮਿੱਤਰ! ਸੁਣ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਜਨ = ਹੇ ਸੱਜਣ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escuchen, oh mis amados amigos y compañeros,"