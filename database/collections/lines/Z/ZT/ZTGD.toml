[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਿਸਮਾਦੈ, ਵਿਸਮਾਦੁ ਮਿਲਾਇਆ ॥੧੩॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Guru Himself is the wonder who is one with the supreme wonder."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(੧੦) ਅਚਰਜ ਰੂਪ ਵਿਖੇ ਅਸਚਰਜ ਰੂਪ ਮਿਲੇ ਹਨ।"