[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਕਰਤਾ; ਅਗਮ ਅਥਾਹਾ ॥"
page = 1261
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Creator Lord, of Himself, is Inaccessible and Infinite."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿਰਜਣਹਾਰ ਸੁਆਮੀ, ਖੁਦ ਪਹੁੰਚ ਤੋਂ ਪਰੇ ਅਤੇ ਅਨੰਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator Himself is Inaccessible and Infinite."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਗਮ ਅਥਾਹ ਪਰਮੇਸ੍ਵਰ ਆਪੇ ਹੀ ਸ੍ਰਬ ਕਾ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ, ਅਪਹੁੰਚ ਅਤੇ ਅਥਾਹ ਕਰਤਾਰ ਆਪ ਹੀ (ਇਹ ਸਾਰੀ ਖੇਡ ਰਿਹਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਮ = ਅਪਹੁੰਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Creador Mismo es Inaccesible e Infinito;"