[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਬਿਘਨ ਹੋਇ; ਸਭ ਥਾਂਈ ਵੂਠੇ ॥"
page = 801
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without any hitch the Lord abides in all the places."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਿਨਾ ਕਿਸੇ ਰੋਕ ਟੋਕ ਦੇ ਸੁਆਮੀ ਸਾਰਿਆਂ ਥਾਵਾਂ ਅੰਦਰ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is unobstructed, dwelling everywhere."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਜਨ ਸਰਬ ਅਸਥਾਨੋਂ ਵਿਖੇ ਨਿਰਵਿਘਨ ਹੋਏ ਕਰ ਵਸੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਜਿੱਥੇ ਭੀ ਵੱਸਦਾ ਹੈ ਹਰ ਥਾਂ (ਵਿਕਾਰਾਂ ਦੀ) ਰੁਕਾਵਟ ਤੋਂ ਬਚਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੋਇ = ਹੋ ਕੇ। ਸਭ ਥਾਂਈ = ਹਰ ਥਾਂ (ਜਿੱਥੇ ਭੀ ਉਹ ਰਹਿੰਦਾ ਹੈ)। ਵੂਠੇ = ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y, en total Paz, veo al Señor habitando en todos los lugares."