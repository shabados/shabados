[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਿ ਕੀਨੋ; ਆਪਨ ਬਿਸਥਾਰੁ ॥"
page = 279
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His expanse, He has Himself made."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਪਸਾਰਾ ਉਸ ਨੇ ਆਪੇ ਹੀ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself created His own expanse."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਅਪਨਾ ਬਿਸਥਾਰ ਤਿਸ ਨੇ ਆਪ ਹੀ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਖਿਲਾਰਾ ਉਸ ਨੇ ਆਪ ਹੀ ਬਣਾਇਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਸਥਾਰੁ = ਖਿਲਾਰਾ। ਆਪਨ = ਆਪਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo Él está en todo,"