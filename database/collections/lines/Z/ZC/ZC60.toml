[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੋਪ ਭਰੇ ਅਰੁ ਬਾਰਿ ਭਰੇ; ਬਧਬੇ ਕਉ ਚਲੇ ਚਰੀਆ ਜੋਊ ਬਾਛੇ ॥"
page = 328

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Having been filled with water and rage"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋਧ ਅਤੇ ਜਲ ('ਬਾਰਿ') ਨਾਲ ਭਰੇ ਹੋਏ ਵੱਛਿਆਂ ਨੂੰ ਚਰਾਉਣ ਵਾਲੇ (ਗਵਾਲਿਆਂ) ਨੂੰ ਮਾਰਨ ਲਈ ਚਲ ਪਏ।"