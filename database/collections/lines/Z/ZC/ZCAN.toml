[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵੇਕੀ ਜੰਤ ਉਪਾਇ; ਅੰਤਰਿ ਕਲ ਧਾਰਿਆ ॥"
page = 1094
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Creating the creatures of various kinds, Thou has infused Thy might within them."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਕਿਸਮਾਂ ਦੇ ਜੀਵ ਪੈਦਾ ਕਰਕੇ, ਤੂੰ ਉਨ੍ਹਾਂ ਅੰਦਰ ਆਪਣੀ ਸ਼ਕਤੀ ਫੂਕੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Creating the beings of various kinds, You infused Your power into them."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭਿੰਨ ਭਿੰਨ ਜੀਵਾਂ ਕੋ ਉਪਾਇ ਕਰ ਤਿਨ ਕੇ ਅੰਤਰਿ ਅਪਨੀ ਸਤਾ ਕੋ ਧਾਰਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਖ ਵਖ ਭਾਂਤ ਦੇ ਜੀਵ ਪੈਦਾ ਕਰ ਕੇ ਤੂੰ (ਜੀਵਾਂ ਦੇ ਅੰਦਰ) ਆਪਣੀ ਸੱਤਿਆ ਕਾਇਮ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵੇਕੀ = ਰੰਗਾ ਰੰਗ ਦੇ। ਅੰਤਰਿ = (ਉਹ ਜੀਵਾਂ ਦੇ) ਅੰਦਰ। ਕਲ = ਸੱਤਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "creaste las criaturas, todas distintas unas de las otras y les informaste de la existencia de su interior con Tu Poder."