[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਘੁਬੰਸਹਿ ਜਿਹ ਜਗਹਿ ਚਲਯੋ ॥"
page = 48

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In this clan, there was a king named Raghu, who was the originator of Raghuvansh (the clan of Raghu) in the world."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤੋਂ ਜਗਤ ਵਿਚ ਰਘੂਬੰਸ ਚਲਿਆ।"