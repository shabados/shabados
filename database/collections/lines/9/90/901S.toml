[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਹਾ ਤਪਤਿ; ਸਾਗਰ ਸੰਸਾਰ ॥"
page = 196
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Exceedingly scorching is the world ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਸਾੜ ਸੁਟਣਹਾਰ ਹੈ ਜਗਤ ਸਮੁੰਦਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The world-ocean is burning hot!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੰਸਾਰ ਸਮੁੰਦ੍ਰ ਹੈ ਏਹ ਮਹਾਂ ਤਪਤ ਸ੍ਵਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਕਾਮਾਦਿਕ ਵਿਕਾਰਾਂ ਦੀ) ਸੰਸਾਰ-ਸਮੁੰਦਰ ਵਿਚ ਬੜੀ ਤਪਸ਼ ਪੈ ਰਹੀ ਹੈ। (ਇਸ ਤਪਸ਼ ਤੋਂ ਬਚਣ ਲਈ ਪ੍ਰਭੂ ਦਾ ਹੀ ਆਸਰਾ ਲਵੋ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਪਤਿ = ਤਪਸ਼, ਸੜਨ। ਸਾਗਰ = ਸਮੁੰਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mar del mundo es de fuego,"