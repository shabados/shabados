[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਿਤੇ ਦੇਵ ਭਜਾਈ ਸਭਨਾ ਰਾਕਸਾਂ ॥"
page = 120

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“All the demons have caused the flight of the gods.\""

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਖਸ਼ਾਂ ਨੇ ਸਾਰੇ ਦੇਵਤੇ (ਅਮਰਾਪੁਰੀ ਤੋਂ) ਭਜਾ ਦਿੱਤੇ ਹਨ।"