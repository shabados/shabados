[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਕੁਦਰਤਿ ਕਰੇ ਵੀਚਾਰਾ ॥"
page = 1073
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself creates nature and gives attention to it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪ ਹੀ ਰੱਬੀ ਬੰਧਾਨ ਨੂੰ ਰਚਦਾ ਤੇ ਇਸ ਵਲ ਧਿਆਨ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He contemplates His own creative power."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਕੁਦਰਤੀ ਤਿਸ ਕਾ ਬੀਚਾਰੁ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਆਪ ਹੀ ਇਹ ਕੁਦਰਤਿ ਰਚਦਾ ਹੈ ਆਪ ਹੀ ਇਸ ਦੀ ਸੰਭਾਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰੇ = ਕਰਿ, ਰਚ ਕੇ। ਵੀਚਾਰਾ = ਖ਼ਿਆਲ, ਸੰਭਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él crea la Naturaleza y entonces Él Mismo le pone atención."