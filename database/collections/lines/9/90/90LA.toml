[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਸਿ ਕੀਤਾ ਹਉਂ ਤੁਧੁ ਅਜੁ; ਬੋਲੈ ਰਾਜਾ ਸੁਣੈ ਲੁਕਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "‘You have overpowered me’, said the king and his words were heard by one and all."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਰਾਜੇ ਕਿਹਾ ਅੱਜ ਤੂੰ ਮੈਨੂੰ ਵੱਸ ਕਰ ਲਿਆ ਹੈ, ਲੋਕ ਬੀ ਸੁਣਦੇ ਸੇ।"