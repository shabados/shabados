[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਸਿਮਰਨਿ; ਰਿਦ ਬਿਗਾਸ ॥"
page = 986
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose meditation heart blooms forth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਇਬਾਦਤ ਦੁਆਰਾ ਦਿਲ ਖਿੜ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating on Him, the heart blossoms forth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਸਿਮਰਨ ਕਰ ਰਿਦੇ ਮੇਂ ਬਿਗਾਸ, ਭਾਵ ਗ੍ਯਾਨ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਸਿਮਰਨ ਕਰਨ ਨਾਲ ਹਿਰਦਾ ਖਿੜਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਿਦ ਬਿਗਾਸ = ਹਿਰਦੇ ਦਾ ਖਿੜਾਉ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Meditando así, el corazón florece,"