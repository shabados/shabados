[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਸਮਝ ਪ੍ਰਬੀਨ ॥੬੦੧॥"
page = 745

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Uttering “Patra-ari-dhanani” and then adding “Ripu”, the names of Tupak are formed.601."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤੁਪਕ ਦਾ ਨਾਮ ਬਣ ਜਾਂਦਾ ਹੈ। ਪ੍ਰਬੀਨੋ! ਸਮਝ ਲਵੋ ॥੬੦੧॥"