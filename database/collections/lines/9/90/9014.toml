[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸਮਝੈ; ਰੋਗੁ. ਨ ਹੋਈ ॥"
page = 1038
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who knows by the Guru's grace, is afflicted not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਜਾਣ ਲੈਂਦਾ ਉਸ ਨੂੰ ਬੀਮਾਰੀ ਨਹੀਂ ਚਿਮੜਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh understands, and does not suffer the disease."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰੋਂ ਦੁਆਰੇ ਸਮਝਤਾ ਹੈ ਤਿਸ ਕੋ ਜਨਮਾਦੀ ਰੋਗ ਨਹੀਂ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ (ਪਰਮਾਤਮਾ ਦੀ ਇਸ ਬੇਅੰਤ ਕਲਾ ਨੂੰ) ਸਮਝਦਾ ਹੈ (ਉਹ ਉਸ ਦੀ ਯਾਦ ਤੋਂ ਨਹੀਂ ਖੁੰਝਦਾ, ਤੇ) ਉਸ ਨੂੰ ਕੋਈ ਰੋਗ (ਵਿਕਾਰ) ਪੋਹ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que Lo conoce a través del Guru, no sufre más,"