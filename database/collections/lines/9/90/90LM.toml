[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਰੂ. ਮੀਹਿ ਨ ਤ੍ਰਿਪਤਿਆ; ਅਗੀ. ਲਹੈ ਨ ਭੁਖ ॥"
page = 148
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The desert is not satiated with rain and the hunger of fire is not quenched."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੇਤਲਾ ਥਲ ਬਾਰਸ਼ ਨਾਲ ਸੰਤੁਸ਼ਟ ਨਹੀਂ ਹੁੰਦਾ ਅਤੇ ਅੱਗ ਦੀ ਖੁਦਿਆ ਨਵਿਰਤ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The desert is not satisfied by rain, and the fire is not quenched by desire."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਮਾਰੂ ਅਸਥਲ ਬਰਖਾ ਕਰ ਕੇ ਤ੍ਰਿਪਤ ਨਹੀਂ ਹੂਆ ਹੈ, (ਅਗੀ) ਅਗਨੀ ਕੀ ਲਕੜੀਓਂ ਕਰ ਛੁਦਾ ਨਿਵਰਤ ਨਹੀਂ ਹੋਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰੇਤ-ਥਲਾ ਮੀਂਹ ਨਾਲ (ਕਦੇ) ਰੱਜਦਾ ਨਹੀਂ, ਅੱਗ ਦੀ (ਸਾੜਨ ਦੀ) ਭੁੱਖ (ਕਦੇ ਬਾਲਣ ਨਾਲ) ਨਹੀਂ ਮਿਟਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਰੂ = ਰੇਤ-ਥਲਾ। ਮੀਹਿ = ਮੀਂਹ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los desiertos buscan la lluvia, y el fuego la madera."