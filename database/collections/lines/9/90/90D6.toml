[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖਰੀ ਸਿਆਣੀ; ਕੰਤ. ਨ ਭਾਣੀ ॥"
page = 750
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The bride, though very wise, is not pleasing to her Groom,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਵੇਂ ਬਹੁਤੀ ਅਕਲਮੰਦ ਭੀ ਕਿਉਂ ਨਾਂ ਹੋਵੇ, ਉਹ ਪਤਨੀ ਆਪਣੇ ਪਤੀ ਨੂੰ ਨਹੀਂ ਭਾਉਂਦੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "She may be very clever, but this does not please her Husband Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਬਿਵਹਾਰੋਂ ਮੇਂ ਜੀਵ ਰੂਪ ਇਸਤ੍ਰੀ (ਖਰੀ) ਅਤੀ ਸਿਆਣੀ ਹੈ ਪਰੰਤੂ ਕੰਤ ਕੋ ਨਹੀਂ ਭਾਉਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ (ਜੀਵ-ਇਸਤ੍ਰੀ ਦੁਨੀਆ ਦੇ ਕਾਰ-ਵਿਹਾਰ ਵਿਚ ਭਾਵੇਂ) ਬਹੁਤ ਸਿਆਣੀ (ਭੀ ਹੋਵੇ, ਪਰ) ਉਹ ਕੰਤ-ਪ੍ਰਭੂ ਨੂੰ ਚੰਗੀ ਨਹੀਂ ਲੱਗਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖਰੀ = ਬਹੁਤ। ਕੰਤ ਨ ਭਾਣੀ = ਕੰਤ ਨੂੰ ਪਸੰਦ ਨ ਆਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿De qué sirve mi astucia si mi Señor no me muestra Su Amor?"