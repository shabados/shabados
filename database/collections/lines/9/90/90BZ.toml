[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਟ ਪਈ ਜਮਧਾਣੀ; ਦਲਾਂ ਮੁਕਾਬਲਾ ॥"
page = 122

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the trumpet, enveloped by the hide of the male buffalo, the vehicle of Yama, sounded, the armies attacked each other."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਹਰੇ ਨਗਾਰੇ (ਜਮਧਾਣੀ) ਉਤੇ ਸੱਟ ਵਜੀ ਅਤੇ ਦਲਾਂ ਵਿਚ ਮੁਕਾਬਲਾ ਸ਼ੁਰੂ ਹੋ ਗਿਆ।"