[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਮਹਿ ਮਰਿ; ਭਗੇ ਹਾਂ ॥"
page = 411
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "they run towards transmigration."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਊਹ ਆਵਾਗਉਣ ਵਲ ਭੱਜ ਕੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "they run toward death and reincarnation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਜਨਮ ਮਰਨ ਮੇਂ (ਭਗੇ) ਦੌੜਤੇ ਫਿਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਵਿਚ ਭਟਕਦੇ ਫਿਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨਮਹਿ = ਜਨਮ ਵਿਚ। ਮਰਿ = ਮਰ ਕੇ। ਭਗੇ = ਦੌੜਦੇ ਰਹੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "se precipitan hacia la muerte y hacia el ciclo de reencarnaciones,"