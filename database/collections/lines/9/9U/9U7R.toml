[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਨਹੁ ਲੋਕਾ; ਮੈ ਪ੍ਰੇਮ ਰਸੁ ਪਾਇਆ ॥"
page = 370
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hear O people, I have obtained the essence of love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਣੋ ਹੇ ਪੁਰਸ਼ੋ! ਮੈਂ ਪ੍ਰੀਤ ਦਾ ਰਸ ਪਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen, O people: I have tasted the elixir of love."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਲੋਕੋ ਸੁਨੋ! ਮੈਨੇ ਪ੍ਰੇਮ ਰਸੁ ਪਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਲੋਕੋ! ਸੁਣੋ, (ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ) ਮੈਂ ਪਰਮਾਤਮਾ ਦੇ ਪਿਆਰ ਦਾ ਆਨੰਦ ਮਾਣਿਆ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escuchen, oh seres humanos, he probado el Sabor del Amor,"