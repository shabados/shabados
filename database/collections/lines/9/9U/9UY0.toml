[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਲਿਆਨ ਮਹਲਾ ੪ ਅਸਟਪਦੀਆ ॥"
page = 1323
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Kalyan 4th Guru. Ashtpadis."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗਲਿਆਨ ਚੌਥੀ ਪਾਤਿਸ਼ਾਹੀ ਅਸ਼ਟਪਦੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Kalyaan, Fourth Mehl, Ashtpadheeyaa:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਕਲਿਆਨੁ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਅੱਠ ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Kalyaan, Mejl Guru Ram Das, Cuarto Canal Divino, Ashtapadis."