[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਨੀ ਮੈਲਾ; ਮਾਟੀ ਗੋਰੀ ॥"
page = 336
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The watery sperm is dirty and the ovarian secretion is crimson."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਣੀ ਵਰਗਾ ਵੀਰਜ ਗੰਦਾ ਹੈ ਅਤੇ ਅੰਡ ਥੈਲੀ ਦੀ ਰਤੂਬਤ ਲਾਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The water of the sperm is cloudy, and the egg of the ovary is crimson."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਿਤਾ ਕਾ ਬੀਰਜ ਰੂਪ ਪਾਨੀ ਅਸੁਧ ਹੈ, ਮਾਤਾ ਕੀ ਰਕਤ ਰੂਪ ਮਿਟੀ (ਗੋਰੀ) ਸੁਰਖ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਅਹੰਕਾਰੀ ਜੀਵ! ਕਿਸ ਗੱਲ ਦਾ ਮਾਣ ਕਰਦਾ ਹੈਂ?) ਪਿਉ ਦੀ ਗੰਦੀ ਬੂੰਦ ਅਤੇ ਮਾਂ ਦੀ ਰਕਤ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਨੀ = ਪਿਤਾ ਦਾ ਬੀਰਜ। ਮੈਲਾ = ਗੰਦਾ। ਮਾਟੀ ਗੋਰੀ = ਲਾਲ ਮਿੱਟੀ, ਮਾਂ ਦੀ ਰਕਤ-ਰੂਪ ਧਰਤੀ ਜਿਸ ਵਿਚ ਪਿਤਾ ਦੀ ਬੂੰਦ-ਰੂਪ ਬੀਜ ਉੱਗਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El esperma acuoso está sucio, el ovario materno es como la tierra roja."