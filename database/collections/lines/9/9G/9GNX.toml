[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਿ ਦਇਆਲਿ; ਦਇਆ ਪ੍ਰਭਿ ਧਾਰੀ ॥"
page = 95
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Merciful Lord has Himself been moved with pity,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿਹਰਬਾਨ ਸੁਆਮੀ ਨੇ ਆਪ ਹੀ ਰਹਿਮਤ ਕੀਤੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God, the Merciful, has Himself bestowed His Mercy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪੁਰਸ ਪਰ ਦਯਾਲੂ ਪੁਰਖ ਪ੍ਰਭੂ ਨੇ ਆਪ ਦਇਆ ਧਾਰਨ ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦਇਆ ਦੇ ਘਰ ਪ੍ਰਭੂ ਨੇ ਜਿਸ ਮਨੁੱਖ ਉੱਤੇ ਮਿਹਰ ਕੀਤੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਇਆਲਿ = ਦਇਆਲ ਨੇ। ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ। ਦਇਆਲ ਪ੍ਰਭਿ = ਦਇਆਲ ਪ੍ਰਭੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, el Señor, es Misericordioso y Benévolo,"