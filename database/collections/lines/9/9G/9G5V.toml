data = "ਐਸਾ; ਜਗੁ ਦੇਖਿਆ ਜੂਆਰੀ ॥"
page = 222
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have seen the world to be such a gambler,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਦੁਨੀਆਂ ਨੂੰ ਐਹੋ ਜੇਹੀ ਜੂਏ ਬਾਜ ਵੇਖਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have seen the world to be such a gambler;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਐਸਾ (ਜੂਆਰੀ) ਮਸਖਰਾ ਵਾ ਛਲੀਆ ਜਗਤ ਦੇਖਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਵੇਖਿਆ ਹੈ ਕਿ ਜਗਤ ਜੂਏ ਦੀ ਖੇਡ ਖੇਡਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal irracionalidad he encontrado en el mundo,"