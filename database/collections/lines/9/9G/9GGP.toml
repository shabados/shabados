data = "ਸੁੰਭ ਨਿਸੁੰਭ ਪਠਾਇਆ, ਜਮ ਦੇ ਧਾਮ ਨੋ ॥"
page = 127

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Sumbh and Nisumbh were dispatched to the abode of Yama"

[[content]]
