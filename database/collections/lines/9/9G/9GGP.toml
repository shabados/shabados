type = "translation"
language = "pa"
data = "(ਦੇਵੀ ਨੇ) ਸ਼ੁੰਭ ਅਤੇ ਨਿਸ਼ੁੰਭ ਨੂੰ ਯਮ-ਲੋਕ ਨੂੰ ਤੋਰ ਦਿੱਤਾ"