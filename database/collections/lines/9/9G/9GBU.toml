[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਪਟ ਸਨੇਹੀ ਹੋਇ ਕੈ; ਸਾਧਸੰਗਤਿ ਵਿਚਿ ਆਇ ਬਹੰਦਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "If a cheat even comes to the holy congregation and sits there."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਝੂਠੇ ਪ੍ਰੇਮੀ (ਮਨਮੁਖ ਲੋਕ) ਸਾਧ ਸੰਗਤ ਵਿਖੇ ਆ ਬੈਠਦੇ ਹਨ (ਭਾਵ ਦੱਸਦੇ ਹਨ ਕਿ ਅਸੀਂ ਵਡੇ ਪ੍ਰੇਮ ਨਾਲ ਆਏ ਹਾਂ)।"