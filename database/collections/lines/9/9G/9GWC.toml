[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਰਿ ਵੇਖੈ. ਕੀਤਾ ਆਪਣਾ; ਜਿਵ ਤਿਸ ਦੀ ਵਡਿਆਈ ॥"
page = 6
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Having created the creation, He as it pleases His Honour, beholds His handiwork."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਚਨਾ ਨੂੰ ਰੱਚ ਕੇ, ਉਹ ਜਿਸ ਤਰ੍ਹਾਂ ਉਸ ਹਜ਼ੂਰ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ, ਆਪਣੇ ਕੀਤੇ ਕੰਮ ਨੂੰ ਦੇਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Having created the creation, He watches over it Himself, by His Greatness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਤਿਸ ਅਕਾਲ ਪੁਰਖ ਕੀ (ਵਡਿਆਈ) ਇੱਛਾ ਹੈ, ਸੋ ਆਪਨੇ ਕੀਏ ਹੂਏ ਜਗਤ ਕੋ ਕਰਿ ਕਰਿ ਕੇ ਦੇਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਜਿਵੇਂ ਉਸ ਦੀ ਰਜ਼ਾ ਹੈ, (ਭਾਵ, ਜੇਡਾ ਵੱਡਾ ਆਪ ਹੈ ਓਡੇ ਵੱਡੇ ਜਿਗਰੇ ਨਾਲ ਜਗਤ ਨੂੰ ਰਚ ਕੇ) ਆਪਣੇ ਪੈਦਾ ਕੀਤੇ ਹੋਏ ਦੀ ਸੰਭਾਲ ਭੀ ਕਰ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵੇਖੈ = ਸੰਭਾਲ ਕਰਦਾ ਹੈ। ਕੀਤਾ ਆਪਣਾ = ਆਪਣਾ ਰਚਿਆ ਹੋਇਆ ਜਗਤ। ਜਿਵ = ਜਿਵੇਂ। ਵਡਿਆਈ = ਰਜ਼ਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el Creador de todo, y Él es quien manifestó este mundo con muchos colores y seres. Él cuida todo lo que ha hecho"