[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਮਨਿ ਚਾਹੈ; ਸੁੰਦਰਿ ਭੋਗੁ ॥"
page = 1187
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The woman desires beauteous pleasures of flesh."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸਤਰੀ ਸੋਹਣਿਆਂ ਭੋਗ ਵਿਲਾਸਾਂ ਨੂੰ ਲੋੜਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The woman desires beauty and pleasure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸਤ੍ਰੀ ਸੁੰਦਰ ਭੋਗੋਂ ਕੋ ਚਾਹਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੁੰਦਰ ਜੀਵ-ਇਸਤ੍ਰੀ ਦੁਨੀਆ ਦੇ ਚੰਗੇ ਪਦਾਰਥਾਂ ਦਾ ਭੋਗ ਲੋੜਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਮਨਿ = ਇਸਤ੍ਰੀ। ਸੁੰਦਰਿ = ਸੋਹਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La esposa ansía tener belleza, disfrutar de su cuerpo,"