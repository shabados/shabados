type = "primary"
data = "ਏ ਆਏ ਮਨ ਮੈ ਰਿਸ ਕੀਨੇ ॥"
page = 445

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They took many Yakshas, the generous bestowers of wealth, and kinnars alongwith them, who, getting enraged, reached the battlefield"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮਨ ਵਿਚ ਕ੍ਰੋਧ ਕਰ ਕੇ ਇਥੇ ਆਇਆ ਹੈ।"