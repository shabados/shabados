[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਖੀ ਸਹੇਲੀ ਗਰਬਿ ਗਹੇਲੀ ॥"
page = 990
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my ego engrossed mate and friend,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਹੰਕਾਰ ਦੀ ਗ੍ਰਸੀ ਹੋਈ ਹੋਈ ਹਮਜੋਲਣੇ ਅਤੇ ਸਜਣੀਏ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O friends and companions, so puffed up with pride,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਖੀ (ਸਹੇਲੀ) ਪਿਆਰੀ! (ਗਰਬਿ) ਹੰਕਾਰ ਕੀ ਪਕੜੀ ਹੋਈਏ ਵਾ ਕਮਲੀ ਕਰੀ ਹੋਈਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਆਪਣੇ ਹੀ ਰਸ-ਮਾਣ ਵਿਚ ਮੱਤੀ ਸਖੀਏ! ਮੇਰੀਏ ਸਹੇਲੀਏ! (ਹੇ ਮੇਰੇ ਕੰਨ! ਹੇ ਮੇਰੀ ਜੀਭ!)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਰਬਿ = ਗਰਬ ਵਿਚ, ਅਹੰਕਾਰ ਵਿਚ। ਗਹੇਲੀ = ਗ੍ਰਸੀ ਹੋਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi compañero ególatra, mi amigo orgulloso,"