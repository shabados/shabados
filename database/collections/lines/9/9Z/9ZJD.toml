[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਧੁਲੇ; ਕਿਆ ਪਾਇਆ ਜਗਿ ਆਇ ॥"
page = 1126
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O blind man, coming into the world, what has thou obtained?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਅੰਨ੍ਹੇ ਇਨਸਾਨ! ਸੰਸਾਰ ਵਿੱਚ ਆ ਕੇ ਤੂੰ ਕੀ ਪਰਾਪਤ ਕੀਤਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O blind man, what have you obtained by coming into the world?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ (ਅੰਧੁਲੇ) ਅਗ੍ਯਾਨੀ ਜੀਵ! ਸੰਸਾਰ ਵਿਖੇ ਆਇਕੇ ਤੁਮ ਨੇ ਕਯਾ ਲਾਭ ਪਾਇਆ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ) ਅੰਨ੍ਹੇ ਹੋਏ ਜੀਵ! ਤੂੰ ਜਗਤ ਵਿਚ ਜਨਮ ਲੈ ਕੇ (ਆਤਮਕ ਜੀਵਨ ਦੇ ਅਸਲੀ ਲਾਭ ਵਜੋਂ) ਕੁਝ ਭੀ ਨਾਹ ਖੱਟਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਗਿ = ਜਗਤ ਵਿਚ। ਆਇ = ਆ ਕੇ, ਜਨਮ ਲੈ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Qué fue lo que lograste, oh ciego, viviendo en el mundo?"