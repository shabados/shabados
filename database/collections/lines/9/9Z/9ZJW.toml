[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਮ੍ਰਿਤ ਨਾਮੁ ਨਿਧਾਨੁ; ਕੰਠਿ ਉਰਿ ਧਾਰਿਆ ॥"
page = 854
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have enshrined the treasure of the ambrosial Name in my throat and heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸੁਧਾ-ਸਰੂਪ ਨਾਮ ਦੇ ਖਜਾਨੇ ਨੂੰ ਆਪਣੇ ਗਲੇ ਅਤੇ ਦਿਲ ਅੰਦਰ ਟਿਕਾਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have enshrined the treasure of the Ambrosial Naam within my throat and heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਰੂਪੀ ਅੰਮ੍ਰਿਤ (ਨਿਧਾਨੁ) ਨਿਧੋਂ ਕਾ ਘਰ ਤਿਸ ਨੇ ਕੰਠ ਔਰ ਰਿਦੇ ਮੇਂ ਧਾਰਨ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਮਨੁੱਖ ਨੇ ਸਾਰੇ ਸੁਖਾਂ ਦਾ ਖ਼ਜ਼ਾਨਾ (ਪਰਮਾਤਮਾ ਦਾ) ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ (ਆਪਣੇ) ਗਲੇ ਵਿਚ (ਆਪਣੇ) ਹਿਰਦੇ ਵਿਚ (ਸਦਾ ਲਈ) ਟਿਕਾ ਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਮ੍ਰਿਤ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ। ਨਿਧਾਨੁ = (ਸਾਰੇ ਸੁਖਾਂ ਦਾ) ਖ਼ਜ਼ਾਨਾ। ਕੰਠਿ = ਗਲ ਵਿਚ। ਉਰਿ = ਹਿਰਦੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ahora atesoro el Nombre del Señor en mi corazón y en mis labios."