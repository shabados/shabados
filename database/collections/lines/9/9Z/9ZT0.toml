[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਤਿਤੁ ਸਚੇ ਦਰਬਾਰ, ਖਰੇ ਡਰਾਵਣੇ ॥੧੪॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "And to this world and look uglier in the true court of the Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਏਹ) ਉਸ (ਅਕਾਲ ਪੁਰਖ ਦੇ) ਸੱਚੇ ਦਰਬਾਰ ਵਿਖੇ ਖਰੇ ਭਿਆਨਕ ਰੂਪ ਹੁੰਦੇ ਹਨ।"