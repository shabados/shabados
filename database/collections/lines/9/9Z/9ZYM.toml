[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੇ ਚਰਨ; ਹਿਰਦੈ ਵਸਾਏ ॥"
page = 1270
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru's feet, I have enshrined within my mind,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਪੈਰ, ਮੈਂ ਆਪਣੇ ਮਨ ਅੰਦਰ ਟਿਕਾ ਲਏ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I enshrine the Lord's Feet within my heart;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਚਰਨ ਹਿਰਦੇ ਮੇਂ ਬਸਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਦਾ ਸੇਵਕ) ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਨੂੰ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਵਸਾਈ ਰੱਖਦਾ ਹੈ."

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਿਰਦੈ = ਹਿਰਦੇ ਵਿਚ। ਵਸਾਏ = ਵਸਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Enaltezco los Pies de Loto del Señor en mi corazón."