[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਿ ਕਬੀਰ; ਹਮਰਾ ਗੋਬਿੰਦੁ ॥"
page = 871
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir The Lord of the world is my Protector."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ, ਸ਼੍ਰਿਸ਼ਟੀ ਦਾ ਸੁਆਮੀ ਮੇਰਾ ਰੱਖਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, such is my Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕਬੀਰ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਹਮਾਰਾ ਤੌ ਮਾਲਕ ਗੋਬਿੰਦ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ-(ਕਾਜ਼ੀ ਨੂੰ ਇਹ ਸਮਝ ਨਾਹ ਆਈ ਕਿ) ਸਾਡਾ (ਪ੍ਰਭੂ ਦੇ ਸੇਵਕਾਂ ਦਾ ਰਾਖਾ) ਪਰਮਾਤਮਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, tal es mi Señor y Maestro,"