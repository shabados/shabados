[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੋ ਏਕੁ. ਰਹਿਆ ਭਰਪੂਰਿ ॥"
page = 1177
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The One Lord is fully filling all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇੱਕ ਸੁਆਮੀ ਹੀ ਸਾਰਿਆਂ ਨੂੰ ਪਰੀਪੂਰਨ ਕਰ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One and Only Lord is present and prevailing everywhere."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਅਸਥਾਨੋਂ ਮੇਂ ਏਕ ਹੀ ਅਦ੍ਵਤੀ ਵਾਹਿਗੁਰੂ ਪੂਰਨ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਂ! ਇਕ ਪਰਮਾਤਮਾ ਹੀ ਹਰ ਥਾਂ ਜ਼ੱਰੇ ਜ਼ੱਰੇ ਵਿਚ ਵੱਸ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, el Señor llena los corazones, pero el alabador de Maya,"