[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਉ ਸਜਣ. ਤੂ ਮੁਖਿ ਲਗੁ; ਮੇਰਾ ਤਨੁ ਮਨੁ ਠੰਢਾ ਹੋਇ ॥੧॥"
page = 1100
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Come and show me Thy face, O my Friend, that my body and soul be cooled down."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆ ਕੇ ਤੂੰ ਮੈਨੂੰ ਆਪਣਾ ਮੁਖੜਾ ਵਿਖਾਲ, ਹੇ ਮੇਰੇ ਮਿੱਤ੍ਰ! ਤਾਂ ਜੋ ਮੇਰੀ ਦੇਹੀ ਤੇ ਆਤਮਾ ਸੀਤਲ ਹੋ ਵੰਝਣ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Come, and show me Your face, O my friend, so that my body and mind may be cooled and soothed. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਜਣ! ਤੂੰ ਆਇ ਕੇ ਮੇਰੇ ਮੁਖ ਲਗ ਅਰਥਾਤ ਸਾਖ੍ਯਾਤਕਾਰ ਹੋਹੁ, ਜਿਸ ਸੇ ਮੇਰਾ ਤਨ ਮਨ (ਠੰਢਾ) ਸੀਤਲ ਹੋਵੇ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਿਤ੍ਰ-ਪ੍ਰਭੂ! ਆ, ਤੂੰ ਮੈਨੂੰ ਦਰਸਨ ਦੇਹ, (ਤੇਰਾ ਦਰਸਨ ਕੀਤਿਆਂ) ਮੇਰੇ ਤਨ ਮਨ ਵਿਚ ਠੰਢ ਪੈਂਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਜਣ = ਹੇ ਮਿਤ੍ਰ-ਪ੍ਰਭੂ! ਮੁਖਿ ਲਗੁ = ਮਿਲ, ਦੀਦਾਰ ਦੇਹ। ਤਨੁ ਮਨੁ ਠੰਢਾ ਹੋਇ = ਤਨ ਮਨ ਵਿਚ ਠੰਢ ਪੈਂਦੀ ਹੈ, ਮਨ ਤੇ ਗਿਆਨ ਇੰਦ੍ਰੇ ਸ਼ਾਂਤ ਹੁੰਦੇ ਹਨ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ven a mí, oh Amigo, para que Te pueda ver, y para que mi mente y mi cuerpo permanezcan en un fresco Bienestar. (1)"