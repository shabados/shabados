[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਖਨਿ ਆਗਹਿ ਠਾਢਿ ਲਗੈ; ਸਖੀ, ਦੇਤ ਨਹੀ ਕਿ ਹੇਤ ਦਿਖਾਈ ॥"
page = 383

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Krishna is always standing before my eyes, therefore I do not see anything else"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਖੀ! (ਕ੍ਰਿਸ਼ਨ) ਅੱਖੀਆਂ ਦੇ ਸਾਹਮਣੇ ਖੜੋਤਾ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ, ਪਰ ਕਿਸ ਲਈ ਵਿਖਾਲੀ ਨਹੀਂ ਦਿੰਦਾ।"