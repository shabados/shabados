data = "ਜਿਨਿ ਲੋਕ ਚਤੁਰਦਸ ਜੀਤ ਲਯੋ ॥੯॥"
page = 178

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After receiving the boon, that demons become so powerful that he conquered all the fourteen regions of the universe.9."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਉਸ ਨੇ ਚੌਦਾਂ ਲੋਕਾਂ ਨੂੰ ਜਿਤ ਲਿਆ ॥੯॥"