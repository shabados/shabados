[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਤਹੂ. ਨ ਜਾਏ; ਘਰਹਿ ਬਸਾਏ ॥"
page = 1307
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I now go no where and abide in my home."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹੁਣ ਕਿਧਰੇ ਨਹੀਂ ਜਾਂਦਾ ਅਤੇ ਆਪਣੇ ਧਾਮ ਅੰਦਰ ਵਸਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I do not go out anywhere; I dwell in my own home."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਹਮਾਰਾ ਮਨ ਕਹੀਂ ਨਹੀਂ ਜਾਤਾ, ਅਪਨੋ ਘਰ ਮੇਂ ਆ ਬਸਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੁਣ ਮੇਰਾ ਮਨ) ਕਿਸੇ ਭੀ ਹੋਰ ਪਾਸੇ ਨਹੀਂ ਜਾਂਦਾ, (ਹਿਰਦੇ-) ਘਰ ਵਿਚ ਹੀ ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਤਹੂ = ਕਿਸੇ ਭੀ ਹੋਰ ਪਾਸੇ। ਘਰਹਿ = ਘਰ ਵਿਚ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No voy a ningún lado y habito en mi hogar."