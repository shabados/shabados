[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਛਿਅ ਘਰਿ ਛਿਅ ਗੁਰਿ ਆਖੀਅਨਿ; ਛਿਅ ਉਪਦੇਸ ਭੇਸ ਅਭਿਆਸੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Six are the Shastras, six their teachers and six their guises, disciplines and teachings."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਛੀ ਸ਼ਾਸਤਰਾਂ ਦੇ ਛੇ ਅਚਾਰਜਾਂ ਨੇ ਛੀ ਉਪਦੇਸ਼ ਭੇਸ਼ ਤੇ ਅਭ੍ਯਾਸ (ਭਿੰਨ ਭਿੰਨ) ਕੀਤੇ ਆਖੀਦੇ ਹਨ।"