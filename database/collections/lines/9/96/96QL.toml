[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲੇਖੈ ਅੰਦਰਿ ਸਭ ਕੋ; ਸਭਨਾ ਮਸਤਕਿ ਲੇਖੁ ਲਿਖਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "All are responsible (for their actions) and carry writ of fate on their forehead."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਫੇਰ) ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ ਲੇਖੇ ਦੇ ਵਿਚ ਹੈ, ਸਾਰਿਆਂ ਦੇ ਮੱਥੇਪੁਰ ਲੇਖ ਲਿਖ ਦਿਤਾ ਹੈ।"