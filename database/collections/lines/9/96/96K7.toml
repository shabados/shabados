type = "primary"
data = "ਕੇਲ ਕਿਯੋ ਇਕ ਪੁਰਖ ਬੁਲਾਈ ॥੨॥"
page = 902

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She could not control herself and called in a man for love-making."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕੇਲ-ਕ੍ਰੀੜਾ ਕਰਨ ਲਈ ਇਕ ਪੁਰਸ਼ ਨੂੰ ਬੁਲਾਇਆ ॥੨॥"