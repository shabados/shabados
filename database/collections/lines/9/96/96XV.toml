[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਈਤ ਊਤ; ਪ੍ਰਭ ਕਾਰਜ ਸਾਰ ॥੩॥"
page = 1183
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and here and hereafter, the Lord shall arrange thy affairs."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਏਥੇ ਤੇ ਓਥੇ ਸੁਆਮੀ ਤੇਰੇ ਕੰਮਕਾਜ ਰਾਸ ਕਰ ਦੇਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Here and hereafter, God shall resolve your affairs. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਲੋਕ ਪ੍ਰਲੋਕ ਕਾ ਕਾਰਜ ਪ੍ਰਭੂ ਪਰਮੇਸ੍ਵਰ (ਸਾਰ) ਸੰਭਾਲਤਾ ਵਾ ਸਿਧ ਕਰਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਲੋਕ ਅਤੇ ਪਰਲੋਕ ਦੇ ਸਾਰੇ ਕੰਮ ਪ੍ਰਭੂ ਹੀ ਸੰਵਾਰਨ ਵਾਲਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਈਤ = ਇਸ ਲੋਕ ਵਿਚ। ਊਤ = ਪਰਲੋਕ ਵਿਚ। ਸਾਰ = ਸਵਾਰਨ ਵਾਲਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y observa cómo Dios satisface tu ser aquí y en el más allá. (3)"