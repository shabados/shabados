[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਤੁਰ ਬੇਦ; ਉਚਰਤ ਦਿਨੁ ਰਾਤਿ ॥"
page = 535
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and the four Vedas proclaim, day and night,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਚਾਰੇ ਵੇਦ ਦਿਹੁੰ ਰੈਣ ਪੁਕਾਰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and the four Vedas proclaim, day and night,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਚਾਰੇ ਬੇਦ ਸਭੀ ਰਾਤ ਦਿਨ ਬਿਅੰਤਤਾ ਉਚਾਰਨ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਚਾਰੇ ਵੇਦ (ਉਸ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣਾਂ ਦਾ) ਦਿਨ ਰਾਤ ਉਚਾਰਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਤੁਰ = ਚਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y los cuatro Vedas, Le cantan sólo a Él."