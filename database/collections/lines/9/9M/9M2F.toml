[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਜਿ ਸਿਲਾ ਤੀਰਥ ਬਨ ਵਾਸਾ ॥"
page = 686
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The man worship stone, abides in holy places and jungles,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਦਮੀ ਪੱਥਰ ਪੂਜਦਾ ਹੈ, ਪਵਿੱਤਰ ਅਸਥਾਨਾਂ ਤੇ ਜੰਗਲਾਂ ਵਿੱਚ ਵਸਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He worships stones, dwells at sacred shrines of pilgrimage and in the jungles,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਪਖੰਡ ਕੋ ਧਾਰ ਕਰ ਪਰੇਮ ਸੇ ਬਿਨਾਂ ਪਾਹਨੋਂ ਕੀ, ਭਾਵ ਸੇ ਠਾਕਰ ਪੂਜਾ ਔ ਤੀਰਥ ਜਾਤ੍ਰਾ ਪੁਨਾ ਬਨ ਮੇਂ ਨਿਵਾਸ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਪੱਥਰ (ਦੀਆਂ ਮੂਰਤੀਆਂ) ਪੂਜਦਾ ਰਿਹਾ, ਤੀਰਥਾਂ ਦੇ ਇਸ਼ਨਾਨ ਕਰਦਾ ਰਿਹਾ, ਜੰਗਲਾਂ ਵਿਚ ਨਿਵਾਸ ਰੱਖਦਾ ਰਿਹਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਜਿ = ਪੂਜ ਕੇ। ਸਿਲਾ = ਪੱਥਰ (ਦੀਆਂ ਮੂਰਤੀਆਂ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si uno alaba alguna piedra o se va a vivir en los bosques o en los lugares santos,"