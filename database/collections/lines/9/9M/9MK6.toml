[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੂਰਖ ਬਾਮਣ; ਪ੍ਰਭੂ ਸਮਾਲਿ ॥"
page = 372
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O silly Brahman, meditate thou on the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ ਬ੍ਰਾਹਮਣ! ਤੂੰ ਆਪਣੇ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O foolish Brahmin, reflect upon God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ ਬ੍ਰਹਮਨ! ਪ੍ਰਭੂ ਅਕਾਲ ਪੁਰਖ ਕੋ ਸਿਮਰਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ ਬ੍ਰਾਹਮਣ! ਪਰਮਾਤਮਾ ਨੂੰ (ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ) ਯਾਦ ਕਰਿਆ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਮਣ = ਹੇ ਬ੍ਰਾਹਮਣ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh tonto Brahmán, ensambla en tu interior al Señor,"