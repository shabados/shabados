[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਯੌ ਕਹਿ ਸੀਸ ਝੁਕਾਇ ਰਹਿਯੋ; ਬਹੁ ਸੋਕ ਬਢਿਯੋ, ਅਤਿ ਰੋਦਨ ਕੀਨੋ ॥੮੯੬॥"
page = 386

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“The Lord-God gave a son in our house, but we do not know, for which sin of our he has snatched him from us?” Saying this Nand bowed his head and began to weep.896."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਕਹਿ ਕੇ (ਉਸ ਨੇ) ਸਿਰ ਨਿਵਾ ਲਿਆ ਅਤੇ ਆਪਣਾ ਸ਼ੋਕ ਬਹੁਤ ਵਧਾ ਲਿਆ ਅਤੇ ਬਹੁਤ ਰੋਇਆ ॥੮੯੬॥"