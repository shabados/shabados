[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਖੜਗੇਸ ਤਿਨੈ ਗਹਿ ਕੇਸਨ ਤੇ; ਝਟਕਿਓ ਅਰੁ ਭੂਮਿ ਬਿਖੈ ਪਟਕਿਓ ॥"
page = 457

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Kharag Singh caught him by his hair, threw him on the ground, with a jerk"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਖੜਗ ਸਿੰਘ ਨੇ ਕੇਸਾਂ ਤੋਂ ਪਕੜ ਕੇ ਝਟਕਾ ਦਿੱਤਾ ਹੈ ਅਤੇ ਧਰਤੀ ਉਤੇ ਪਟਕ ਦਿੱਤਾ ਹੈ।"