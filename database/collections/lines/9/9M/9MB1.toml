[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਿਆਨ ਵਿਹੂਣੀ; ਭਵੈ ਸਬਾਈ ॥"
page = 1034
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Divine knowledge, the entire world wanders bout."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮ ਗਿਆਤ ਦੇ ਬਗ਼ੈਰ ਸਾਰਾ ਜਹਾਨ ਟੱਕਰਾਂ ਮਾਰਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without spiritual wisdom, they all just wander around."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗ੍ਯਾਨ ਸੇ ਬਿਨਾਂ ਸਭ ਸ੍ਰਿਸਟੀ ਭਵਾਈਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਗੱਲ ਦੀ ਸਮਝ (ਕਿ ਪਰਮਾਤਮਾ ਸਾਰੇ ਥਾਵਾਂ ਤੇ ਵਿਆਪਕ ਹੈ) ਤੋਂ ਵਾਂਜੀ ਰਹਿ ਕੇ ਸਾਰੀ ਲੁਕਾਈ ਭਟਕ ਰਹੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਿਹੂਣੀ = ਸੱਖਣੀ। ਸਬਾਈ = ਸਾਰੀ ਲੁਕਾਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin Sabiduría todos vagan de vida en vida."