[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਮ੍ਰਿਤੁ ਹਰਿ ਕੋ ਨਾਮੁ ਲੈਤ; ਮਨਿ ਸਭ ਸੁਖ ਪਾਏ ॥"
page = 1386
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Reciting the ambrosial Name of God, man is blessed with all the comforts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਸੁਧਾ ਸਰੂਪ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਨ ਦੁਆਰਾ, ਆਦਮੀ ਸਾਰੇ ਆਰਾਮ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chanting the Ambrosial Name of the Lord, the mortal is blessed with all comforts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਤੇਰੇ ਅੰਮ੍ਰਿਤ ਰੂਪ ਸਰਬ ਕੇ ਸਿਰੋਮਣੀ ਨਾਮ ਕੋ ਲੇਤਿਆਂ ਹੋਇਆਂ ਜਿਸ ਕਿਸੀ ਨੇ ਸਰਬ ਸੁਖ ਪਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਜਿਨ੍ਹਾਂ ਨੇ ਹਰੀ ਦਾ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ ਲਿਆ ਹੈ, ਉਹਨਾਂ ਨੂੰ ਸਾਰੇ ਸੁਖ ਲੱਭ ਪਏ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Recitando el Nombre Ambrosial del Señor, el mortal es Bendecido con todas las Comodidades."