[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭੁ; ਕਿਨ ਹੀ ਜਾਤਾ ॥੧॥"
page = 71
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "But rare is the one who knows the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰ ਕੋਈ ਵਿਰਲਾ ਪੁਰਸ਼ ਹੀ ਹੈ ਜੋ ਸਾਈਂ ਨੂੰ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but how rare are those who know God! ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ (ਪ੍ਰਭੁ ਕਿਨ ਹੀ ਜਾਤਾ) ਸ੍ਵਾਮੀ ਕੋ ਕਿਸੀ ਨੇ ਹੀ ਜਾਣਿਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਪਰਮਾਤਮਾ ਨੂੰ ਕਿਸੇ ਵਿਰਲੇ ਨੇ ਹੀ ਸਮਝਿਆ ਹੈ (ਭਾਵ, ਇਹਨਾਂ ਤਰੀਕਿਆਂ ਨਾਲ ਪਰਮਾਤਮਾ ਨਹੀਂ ਮਿਲਦਾ) ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਨ ਹੀ = ਕਿਸੇ ਵਿਰਲੇ ਨੇ ਹੀ, ਕਿਨਿ ਹੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero extraordinario es aquél que conoce al Señor.  (1)"