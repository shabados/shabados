[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਉਠਿ ਲਾਗੀ ਪਾਈ ॥"
page = 622
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Every one, then got up and fell at my feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਹਰ ਜਣਾ ਖੜ੍ਹਾ ਹੋ ਮੇਰੇ ਪੈਰਾਂ ਤੇ ਢਹਿ ਪਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "everyone rises up and bows down at my feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਸ੍ਰਿਸ਼ਟੀ ਉਠ ਕਰ ਤਿਸ ਕੇ ਚਰਨੀ ਲਾਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੀ ਲੁਕਾਈ ਉਸ ਦੇ ਪੈਰੀਂ ਉੱਠ ਕੇ ਆ ਲੱਗਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਈ = ਪੈਰੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Soporte y todos se postraron a Sus Pies."