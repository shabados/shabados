[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਤੀ ਸਤੀ; ਕਹ ਰਾਖਹਿ ਪਾਉ ॥੧॥"
page = 349
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Where can men of continence and truth place their feet?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਹੇਜ਼ਗਾਰ ਅਤੇ ਸੱਚੇ ਬੰਦੇ ਆਪਣੇ ਪੈਰ ਕਿੱਥੇ ਰੱਖਣ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "where can the celibates and the men of truth place their feet? ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਜੁਗ ਮੇਂ ਜਤੀ ਸਤੀ ਜੋ ਹੈ, ਸੋ (ਕਹ) ਕਹਾਂ ਪੈਰੁ ਰਾਖੈ, ਅਰਥਾਤ ਕਲਜੁਗ ਮੇਂ ਜਤ ਸਤ ਕਾ ਪ੍ਰਚਾਰ ਕਮ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਤ ਸਤ ਨੂੰ ਸੰਸਾਰ ਵਿਚ ਕਿਤੇ ਥਾਂ ਨਹੀਂ ਰਿਹਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹ = ਕਿਥੇ? ਪਾਉ = ਪੈਰ। ਜਤੀ...ਪਾਉ = ਜਤੀ ਸਤੀ ਕਿਥੇ ਪੈਰ ਰੱਖਣ? ਜਤ ਸਤ ਨੂੰ ਸੰਸਾਰ ਵਿਚ ਥਾਂ ਨਹੀਂ ਰਿਹਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿en donde pueden los seres de Verdad y los célibes posar sus pies? (1)"