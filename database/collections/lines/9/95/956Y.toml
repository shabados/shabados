[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੁ ਸਚਾ ਜਿਨ ਮਨਿ ਭਾਵਦਾ; ਸੇ ਮਨਿ ਸਚੀ ਦਰਗਹ ਲਿਜੈ ॥"
page = 312
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The man to whose mind the Truest of the true is pleasing becomes acceptable in the True court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੁਰਸ਼, ਜਿਸ ਦੇ ਚਿੱਤ ਨੂੰ ਸੱਚਿਆ ਦਾ ਮਹਾਂ ਸੱਚਾ ਚੰਗਾ ਲਗਦਾ ਹੈ, ਸੱਚੇ ਦਰਬਾਰ ਅੰਦਰ ਕਬੂਲ ਪੈ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One whose mind is pleased with the Truest of the True is accepted in the True Court."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੇ ਮਨ ਮੇਂ ਨਿਸਚੇ ਕਰ ਕੇ ਸਚਾ ਭਾਵਤਾ ਹੈ, ਸੋ ਪੁਰਸ ਦਹਗਾਹ ਮੇਂ ਮਾਨ ਲਈਤੇ ਹੈਂ ਅਰਥਾਤ ਤਿਨ ਕਾ ਅਤੀ ਆਦਰ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਦੇ ਮਨ ਵਿਚ ਸੱਚਾ ਹਰੀ ਸਚਮੁਚ ਪਿਆਰਾ ਲੱਗਦਾ ਹੈ ਉਹ ਸੱਚੀ ਦਰਗਾਹ ਵਿਚ ਸਤਕਾਰੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ ਲਿਜੈ = ਮੰਨ ਲਏ ਜਾਂਦੇ ਹਨ, ਆਦਰ ਪਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que ama a su Verdadero Señor es aprobado en la Verdadera Corte."