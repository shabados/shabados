[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਤਿ ਰਖੁ ਬਨਵਾਰੀਆ; ਮੇਰੇ ਮਨਾ ॥੧॥"
page = 410
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Creator has preserved my honour, O my soul."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿਰਜਣਹਾਰ ਨੇ ਮੇਰੀ ਇਜ਼ਤ-ਆਬਰੂ ਬਚਾ ਲਈ ਹੈ, ਹੇ ਮੇਰੀ ਜਿੰਦੇ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator Lord has preserved my honor, O my mind. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਨਵਾਰੀ! ਮੇਰੀ ਪਤਿ ਆਪ ਨੇ ਰਖੀ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਮੇਰੀ (ਸਰਨ ਪਏ ਦੀ) ਇੱਜ਼ਤ ਰੱਖ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿ = ਇੱਜ਼ਤ। ਬਨਵਾਰੀਆ = ਹੇ ਜਗਤ ਦੇ ਮਾਲਕ-ਪ੍ਰਭੂ! ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así ha salvado mi honor. (1)"