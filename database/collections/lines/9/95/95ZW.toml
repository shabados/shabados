[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤ ਜਨਾ ਕੇ ਸਾਸ ਨਿਹਾਰੈ ॥"
page = 1149
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord keeps in His eye every breath of the saintly persons."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਸੰਤ ਸਰੂਪ ਪੁਰਸ਼ਾਂ ਦੇ ਹਰ ਸੁਆਸ ਨੂੰ ਆਪਣੀ ਨਿਗ੍ਹਾ ਵਿੱਚ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He watches over every breath of His humble devotee."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭਗਤ ਜਨੋਂ ਕੇ ਸ੍ਵਾਸੋਂ ਕੋ ਦੇਖਤਾ ਹੈ, ਜੋ ਕਿਸੀ ਤਰਾਂ ਕਾ ਕਸ੍ਟ ਨ ਹੋਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪਣੇ ਭਗਤਾਂ ਦੇ ਸੁਆਸਾਂ ਨੂੰ ਗਹੁ ਨਾਲ ਤੱਕਦਾ ਰਹਿੰਦਾ ਹੈ (ਭਾਵ, ਬੜੇ ਧਿਆਨ ਨਾਲ ਭਗਤ ਜਨਾਂ ਦੀ ਰਾਖੀ ਕਰਦਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਸ = ਸਾਹ {ਬਹੁ-ਵਚਨ}। ਨਿਹਾਰੈ = ਵੇਖਦਾ ਹੈ, ਤੱਕਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "él conserva cada una de sus respiraciones bajo Su Mirada."