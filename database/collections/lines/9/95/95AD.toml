[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰੀਤ ਦੁਹਾਨ ਕੀ ਅਤਿ ਬਢੀ; ਤ੍ਰੀਯ ਪਿਯਾ ਕੇ ਮਾਹਿ ॥"
page = 962

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Their love reached the extremes and she felt as if she was amalgamated with the lover."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸਤਰੀ ਅਤੇ ਪ੍ਰੀਤਮ ਦੋਹਾਂ ਦੀ ਪ੍ਰੀਤ ਬਹੁਤ ਵੱਧ ਗਈ।"