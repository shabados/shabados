[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਕਉ; ਗੁਰਿ ਦੀਆ ਨਾਮੁ ॥"
page = 891
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru has blessed Nanak with the Lord's Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਨੇ ਨਾਨਕ ਨੂੰ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਬਖਸ਼ਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru has blessed Nanak with the Naam;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹਮ ਕੋ ਤੋ ਗੁਰੋਂ ਨੇ ਨਾਮ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਮੈਨੂੰ) ਨਾਨਕ ਨੂੰ ਗੁਰੂ ਨੇ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਬਖ਼ਸ਼ਿਆ ਹੈ, ਸੰਤ ਜਨਾਂ ਦੀ ਟਹਿਲ (ਦੀ ਦਾਤਿ) ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru ha bendecido a Nanak con el Naam,"