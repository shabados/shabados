[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹੋਵੈ ਮਿਸਰੀ ਕਲੀਕੰਦ; ਮਿਠਿਆਈ ਢਾਲਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "It is moulded into lump sugar and variegated sweets."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮਿਸਰੀ, ਕਲਾਕੰਦ ਤੇ ਢਾਲਵੀਂ ਮਠਿਆਈ (ਪੇਠਾ ਆਦਿ) ਬਣਦੀ ਹੈ।"