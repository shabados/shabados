[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦੂਜਾ ਭਾਉ ਕੁਦਾਉ ਹੈ, ਹਾਰਿ ਜਨਮੁ ਖਲੋਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The othemness is a wrong stake which ultimatley makes one lose the (battle of) life."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਦੂਜਾ ਭਾਉ ਖੋਟਾ ਦਾਉ ਹੈ, ਜਨਮ ਨੂੰ (ਦੂਜੇ ਭਾਉ ਵਾਲਾ) ਹਾਰ ਖਲੋਂਦਾ ਹੈ।"