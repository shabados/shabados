[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਕਿਛੁ ਅਵਰੁ; ਨਾਹੀ ਦ੍ਰਿਸਟਾਇਆ ॥"
page = 286
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that Guru-ward beholds no other than God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਗੁਰੂ-ਸਮਰਪਣ ਰੱਬ ਬਿਨਾ ਹੋਰ ਕਿਸੇ ਨੂੰ ਨਹੀਂ ਦੇਖਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "they see no other than God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੌ ਤਿਸ ਨਾਮ ਸਦਰਸ ਔਰ ਕਿਛੁ ਦ੍ਰਿਸ਼ਟੀ ਮੇਂ ਨਹੀਂ ਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਪ੍ਰਭੂ ਤੋਂ ਬਿਨਾ ਕਿਤੇ ਹੋਰ ਕੁਝ ਨਹੀਂ ਦਿੱਸਦਾ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦ੍ਰਿਸਟਾਇਆ = ਵੇਖਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no vuelven a tener ojos para contemplar a nadie más."