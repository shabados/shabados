[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੈ ਠਾਹਰ; ਦੁਹਾ ਬਸੇਰਾ ॥"
page = 476
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "We both abide in one and the same place."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਸੀਂ ਦੋਨੋਂ ਇੱਕੋ ਹੀ ਥਾਂ ਤੇ ਰਹਿੰਦੇ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "We both dwell in the same place."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਏਕ ਹੀ ਅੰਤਸਕਰਣ ਮੇਂ ਮੇਰਾ ਜੀਵ ਕਾ ਔਰ ਪਿਤਾ ਈਸ੍ਵਰ ਸਾਖੀ ਦੋਨੋ ਕਾ ਬਾਸਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਸਾਡਾ ਦੋਹਾਂ ਦਾ (ਹੁਣ) ਇੱਕੋ ਥਾਂ ਹੀ (ਮੇਰੇ ਹਿਰਦੇ ਵਿਚ) ਨਿਵਾਸ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਸੇਰਾ = ਵਾਸਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ambos habitamos en el mismo lugar."