[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਰਠਿ ਮਹਲਾ ੩ ਚੌਤੁਕੇ ॥"
page = 602
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sorath 3rd Guru. Chautuke."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੋਰਠਿ ਤੀਜੀ ਪਾਤਿਸ਼ਾਹੀ। ਚੌਤੁਕੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sorat'h, Third Mehl, Chau-Thukay:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚਾਰ ਤੁਕ ਕੀ ਏਕ ਪੌੜੀ ਹੋਗੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sorath, Mejl Guru Amar Das, Tercer Canal Divino, Cha-Tukas."

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੌਤੁਕੇ = ਉਹ ਸ਼ਬਦ ਜਿਨ੍ਹਾਂ ਦੇ ਹਰੇਕ 'ਬੰਦ' ਵਿਚ ਚਾਰ ਚਾਰ ਤੁਕਾਂ ਹੁੰਦੀਆਂ ਹਨ।"