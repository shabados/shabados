[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦਿਨੁ ਦੁਖ ਕਮਾਵਦੇ; ਨਿਤ ਜੋਹੇ ਜਮ ਜਾਲੇ ॥"
page = 30
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By night and day, they do afflictive deeds, and death's noose ever spies them."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਤ੍ਰੀ ਦਿਹੁੰ ਉਹ ਦੁਖ ਦੇਣ ਹਾਰ ਕਰਮ ਕਰਦੇ ਹਨ ਅਤੇ ਮੌਤ ਦੀ ਫਾਹੀ ਹਮੇਸ਼ਾਂ ਹੀ ਉਨ੍ਹਾਂ ਨੂੰ ਤਾੜਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, they suffer in pain; they see the noose of Death always hovering above them."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਮਨਮੁਖ ਰਾਤ੍ਰੀ ਦਿਨ ਜੋ ਕਰਮ ਕਰਤੇ ਹੈਂ ਤਿਨ ਕਰ ਦੁਖੁ ਕੋ ਹੀ ਪ੍ਰਾਪਤਿ ਹੋਤੇ ਹੈਂ, ਪੁਨਃ ਤਿਨ ਕੋ ਜਮ ਭੀ ਨਿਤ ਹੀ ਵਾਸੀ ਲੇ ਕਰ ਭਾਲ ਰਹਾ ਹੈ, ਭਾਵ ਏਹਿ ਕਿ ਸਦਾ ਹੀ ਜਨਮਤੇ ਔਰੁ ਮਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦਾ ਉਹੀ ਕਰਤੂਤਾਂ ਕਰਦੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਦਾ ਫਲ ਦੁੱਖ ਹੁੰਦਾ ਹੈ। ਉਹ ਸਦਾ ਜਮ ਦੇ ਜਾਲ ਵਿਚ ਜਮ ਦੀ ਤੱਕ ਵਿਚ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋਹੇ = ਤੱਕ ਵਿਚ ਰਹਿੰਦੇ ਹਨ। ਜਮ ਜਾਲੇ = ਜਮ ਜਾਲਿ, ਜਮ ਦੇ ਜਾਲ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "vaga en el dolor día y noche y el mensajero de la muerte le clava la garra en el pescuezo."