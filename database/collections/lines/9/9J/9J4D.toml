[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈ ਅਵਗਣ ਭਰਪੂਰਿ ਸਰੀਰੇ ॥"
page = 561
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My body is brimful with inequities."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਦੇਹ ਅਪਰਾਧਾ ਨਾਲ ਪਰੀਪੂਰਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My body is over-flowing with corruption;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸਰੀਰ ਮੇਂ ਸਭ ਔਗਨ ਭਰਪੂਰ ਹੋ ਰਹੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸਰੀਰ ਵਿਚ ਔਗੁਣ ਹੀ ਔਗੁਣ ਭਰੇ ਪਏ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi cuerpo está repleto de corrupción;"