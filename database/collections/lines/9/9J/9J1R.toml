[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਜੀਵਾਂ; ਸਦਾ ਹਰਿ ਕੇ ਗੁਣ ਗਾਈ ॥"
page = 1262
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I live by ever singing God's praises."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਦੀਵ ਹੀ ਵਾਹਿਗੁਰੂ ਦੀਆਂ ਸਿਫਤਾਂ ਗਾਇਨ ਕਰ ਕੇ ਜੀਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Constantly singing the Glorious Praises of the Lord, I live."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਦਾ ਹਰੀ ਕੇ ਗੁਣ ਗਾਇ ਕਰ ਜੀਵਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਦਾ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦਾ ਰਹਿੰਦਾ ਹਾਂ ਅਤੇ ਆਤਮਕ ਜੀਵਨ ਪ੍ਰਾਪਤ ਕਰਦਾ ਰਹਿੰਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਵਾਂ = ਮੈਂ ਆਤਮਕ ਜੀਵਨ ਹਾਸਲ ਕਰਦਾ ਹਾਂ। ਗਾਈ = ਗਾਈਂ, ਮੈਂ ਗਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vivo cantando constantemente las Gloriosas Alabanzas del Señor."