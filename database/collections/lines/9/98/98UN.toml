[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਗ ਸੁਹਾਵੇ ਸੋਹਣੇ; ਚਲੈ ਹੁਕਮੁ ਅਫਾਰ ॥"
page = 70
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He may have delightful and beauteous gardens and he may issue unchallengeable orders;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਪਾਸ ਮਨੋਹਰ ਤੇ ਸੁੰਦਰ ਚਮਨ ਹੋਣ ਤੇ ਉਹ ਅਮੋੜ ਫੁਰਮਾਨ ਜਾਰੀ ਕਰੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "you may have delightful and beautiful gardens, and issue unquestioned commands;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਬਾਗ਼ ਭੀ ਸੁਭਾਇਮਾਨ ਪ੍ਰਾਪਤਿ ਹੋਇ, ਔਰ ਉਸ ਮੇਂ ਬਡੇ ਬਡੇ ਸੋਹਨੇ ਮੰਦਰ ਭੀ ਬਨੇ ਹੋਇ, ਮੰਦਰ ਕਾ ਅਧ੍ਯਾਰ ਹੈ ਹੁਕਮ ਭੀ (ਅਫਾਰ) ਅਮੋੜ ਚਲੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਉਸ ਦੇ ਪਾਸ ਸੋਹਣੇ ਸੁੰਦਰ ਬਾਗ਼ ਹੋਣ, ਜੇ (ਇਹਨਾਂ ਸਾਰੇ ਪਦਾਰਥਾਂ ਦੀ ਮਲਕੀਅਤ ਦੇ ਕਾਰਨ ਉਸ) ਅਹੰਕਾਰੀ (ਹੋਏ) ਦਾ ਹੁਕਮ ਹਰ ਕੋਈ ਮੰਨਦਾ ਹੋਵੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਫਾਰ = ਆਫਰੇ ਹੋਏ ਦਾ, ਅਹੰਕਾਰੀ ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bellos jardines y el orgullo de comandar todos sus extensos alrededores."