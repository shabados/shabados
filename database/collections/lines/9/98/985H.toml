[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਆਪੇ; ਗੁਰਮੁਖਿ ਮੁਕਤਿ ਕਰਾਇਹਿ ॥"
page = 97
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To the Guruwards Thou Thyself emancipatest."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਸਮਰਪਣਾ ਨੂੰ ਤੂੰ ਆਪ ਹੀ ਬੰਦ-ਖਲਾਸ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You Yourself liberate the Gurmukhs;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੁਮ ਆਪ ਹੀ ਗੁਰਮੁਖੋ ਕੋ ਜਨਮ ਮਰਣ ਸੇ ਮੁਕਤ ਕਰਾਉਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਾਤਾਰ! ਤੂੰ ਆਪ ਹੀ ਜੀਵਾਂ ਨੂੰ ਗੁਰੂ ਦੀ ਸਰਨ ਪਾ ਕੇ (ਮਾਇਆ ਦੇ ਬੰਧਨਾਂ ਤੋਂ) ਆਜ਼ਾਦ ਕਰਾ ਦੇਂਦਾ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਸਰਨ ਪਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú, de Ti Mismo, me liberas a través del Guru."