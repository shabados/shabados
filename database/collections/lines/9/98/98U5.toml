[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਥਰ ਅੰਦਰਿ ਅਸਟ ਧਾਤੁ; ਪਾਰਸੁ ਪਰਸਿ ਸੁਵੰਨੁ ਅਲੋਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Eight metals (alloys) remain amidst stones but they convert into gold by the touch of philosopher's stone alone."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੱਥਰਾਂ ਵਿਖੇ ਹੀ ਅੱਠੇ ਧਾਤਾਂ (ਲੋਹਾ ਆਦਿਕ) ਹਨ, ਪਰ ਪਾਰਸ ਦੇ ਮਿਲਾਪ ਨਾਲ ਸੁਵਰਨ ਦੇਖੀਦੀਆਂ ਹਨ (ਭਾਵ ਉਨ੍ਹਾਂ ਪੁਰ ਅਸਰ ਹੋ ਜਾਂਦਾ ਹੈ)।"