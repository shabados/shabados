[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਤਿਤ; ਉਧਾਰਿ ਲੇਹੁ ਹਾਂ ॥"
page = 410
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, save the defaulters,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਪਾਪੀਆਂ ਨੂੰ ਪਾਰ ਕਰਦੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please, Lord, save the sinners."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਪਤਿਤ ਕੋ ਉਧਾਰ ਲੇਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਾਨੂੰ ਵਿਕਾਰਾਂ ਵਿਚ) ਡਿੱਗੇ ਜੀਵਾਂ ਨੂੰ (ਵਿਕਾਰਾਂ ਤੋਂ) ਬਚਾ ਲੈ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿਤ = ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗੇ ਹੋਏ। ਉਧਾਰਿ ਲੇਹੁ = ਬਚਾ ਲੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, salva a éste, Tu Sirviente, que comete faltas también."