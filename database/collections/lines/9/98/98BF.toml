[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਾਇ ਮੰਡਲ ਜਿਉ ਡੋਰ ਫੜਿ; ਗੁਡੀ ਓਡਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Catching hold of the string, the kite could be made to fly in the sky."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅਕਾਸ਼ ਵਿਖੇ ਡੋਰ ਦੇ ਆਸਰੇ ਨਾਲ ਫੜਕੇ ਗੁਡੀ ਉਡਾਈ ਜਾਂਦੀ ਹੈ।"