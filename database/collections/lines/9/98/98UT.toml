[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਟਿ ਘਟਿ ਅੰਤਰਿ; ਏਕੋ ਹਰਿ ਸੋਇ ॥"
page = 1177
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In all the hearts, He, the one God, is."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਦਿਲਾਂ ਅੰਦਰ ਉਹ ਇਕ ਵਾਹਿਗੁਰੂ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One Lord is deep within each and every heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਘਟੋਂ ਕੇ ਅੰਤਰਿ ਏਕੋ ਸੋ ਹਰੀ ਬ੍ਯਾਪਕ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਂ! ਉਹ ਇਕ ਪਰਮਾਤਮਾ ਹੀ ਹਰੇਕ ਸਰੀਰ ਦੇ ਅੰਦਰ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਟਿ = ਸਰੀਰ। ਘਟਿ ਘਟਿ ਅੰਤਰਿ = ਹਰੇਕ ਸਰੀਰ ਦੇ ਅੰਦਰ। ਏਕੋ = ਇਕ ਆਪ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En cada corazón está el Único Dios,"