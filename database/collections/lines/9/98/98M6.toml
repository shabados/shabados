[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਜਨੁ ਮੀਤੁ; ਤੂੰ ਹਾਂ ॥"
page = 410
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art my friend and intimate, (O my Guru)."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰਾ ਮਿੱਤ੍ਰ ਤੇ ਯਾਰ ਹੈ, ਹੇ ਮੇਰੇ ਗੁਰਦੇਵ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my Friend, my Best Friend."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਪਾਸ ਐਸੇ ਕਹੁ ਜੋ ਹਮਾਰਾ ਮੀਤ ਸਾਜਨ ਤੂੰ ਹੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮੇਰੇ ਪ੍ਰਭੂ!) ਤੂੰ ਹੀ (ਮੇਰਾ) ਸੱਜਣ ਹੈਂ, ਤੂੰ ਹੀ (ਮੇਰਾ) ਮਿੱਤਰ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਜਨੁ = ਸੱਜਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres mi Amigo y Compañero, oh mi Señor;"