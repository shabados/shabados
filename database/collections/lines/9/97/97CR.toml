[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਤਾਰੇ ਤਾਰਣਹਾਰਾ; ਹਉਮੈ ਦੂਜਾ ਪਰਹਰਿਆ ॥੨੫॥"
page = 941
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, the Floater (God) floats the mortal, who stills his ego and duality."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਪਾਰ ਉਤਾਰਨ ਵਾਲਾ (ਪ੍ਰਭੂ) ਉਸ ਦਾ ਪਾਰ ਉਤਾਰਾ ਕਰ ਦਿੰਦਾ ਹੈ ਜੋ ਆਪਣੀ ਹੰਗਤਾ ਤੇ ਦਵੈਤ-ਭਾਵ ਨੂੰ ਮੇਟ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Emancipator emancipates one who drives out egotism and duality. ||25||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਜਿਸ ਨੇ ਹਉਮੈਂ ਔ ਦੂਜਾ ਭਾਵ ਤਿਆਗਿਆ ਹੈ ਤਿਸ ਕੋ ਤਾਰਣਹਾਰਾ ਜੋ ਵਾਹਿਗੁਰੂ ਹੈ, ਸੋ ਤਾਰ ਲੇਤਾ ਹੈ॥੨੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਿਸ ਨੇ ਹਉਮੈ ਤੇ ਦੂਜਾ-ਭਾਵ ਤਿਆਗ ਦਿੱਤਾ ਹੈ ਉਸ ਨੂੰ ਤਾਰਣਹਾਰ ਪ੍ਰਭੂ ਤਾਰ ਲੈਂਦਾ ਹੈ ॥੨੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਹਰਿਆ = ਦੂਰ ਕੀਤਾ ॥੨੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, el Único Señor nos emancipa a todos, elevándonos de nuestro ego hacia la Conciencia Universal.(25)"