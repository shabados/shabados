[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੇ ਦਰਸਨ ਕਉ; ਜਾਈ ਬਲਿਹਾਰੇ ॥੩॥"
page = 563
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto Thy vision, I am a sacrifice."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਦੀਦਾਰ ਉਤੋਂ ਮੈਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to the Blessed Vision of Your Darshan. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਦਰਸਨ ਪਰ ਬਲਿਹਾਰੇ ਜਾਤਾ ਹੂੰ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਮੈਂ ਤੇਰੇ ਦਰਸ਼ਨ ਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਈ = ਜਾਈਂ, ਮੈਂ ਜਾਂਦਾ ਹਾਂ। ਕਉ = ਨੂੰ, ਤੋਂ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Señor, y ofrezco siempre mi ser en sacrificio a Tu Visión. (3)"