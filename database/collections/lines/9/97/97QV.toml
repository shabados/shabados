[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹਾ ਬੋਲ; ਤਹ ਅਛਰ ਆਵਾ ॥"
page = 340
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Where there is speech, there are letters (words)."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਬੋਲੀ ਹੈ, ਉਥੇ ਅੱਖਰ (ਸ਼ਬਦ) ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wherever there is speech, there are letters."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਹਾਂ (ਬੋਲੁ) ਸਬਦ ਕਾ ਉਚਾਰਨ ਹੈ ਤਹਾਂ ਅਖਰ ਹੀ ਆਵੈਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਵਰਤਾਰਾ ਬਿਆਨ ਕੀਤਾ ਜਾ ਸਕਦਾ ਹੈ, ਅੱਖਰ (ਕੇਵਲ) ਉਥੇ (ਹੀ) ਵਰਤੇ ਜਾਂਦੇ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਵਾ = ਆਉਂਦੇ ਹਨ, ਵਰਤੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Donde hay conversación , hay palabras."