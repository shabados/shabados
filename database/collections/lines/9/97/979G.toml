[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਤਿ ਦਸ ਭੂਪ ਸੈਨਾ ਸਹਿਤ ਬਧਹਿ ਧਯਾਇ ਸਮਾਪਤੰ ॥"
page = 431

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "End of the chapter entitled “Killing of Ten Kings alongwith the Army.”"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਥੇ ਦਸ ਰਾਜਿਆਂ ਦੇ ਸੈਨਾ ਸਹਿਤ ਮਾਰੇ ਜਾਣ ਦਾ ਅਧਿਆਇ ਸਮਾਪਤ ॥"