[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਰੀਬ ਨਿਵਾਜੁ; ਦਿਨੁ ਰੈਣਿ ਧਿਆਇ ॥੩॥"
page = 1138
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Day and night meditate thou on God, the Patroniser of the poor."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਅਤੇ ਰਾਤ ਨੂੰ ਮਸਕੀਨਾਂ ਨੂੰ ਮਾਣ ਬਖਸ਼ਣਹਾਰ ਵਾਹਿਗੁਰੂ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate day and night on the Cherisher of the meek and humble. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਰਮੇਸ੍ਵਰ ਗਰੀਬੋਂ ਕੋ (ਨਿਵਾਜ) ਬਡਾਈ ਦੇਣੇ ਵਾਲੇ! ਮੈਂ ਰਾਤ੍ਰਿ ਦਿਨ ਤੇਰੇ ਕੋ ਧਿਆਵਤਾ ਹੂੰ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਗਰੀਬਾਂ ਉੱਤੇ ਮਿਹਰ ਕਰਨ ਵਾਲਾ ਹੈ। ਦਿਨ ਰਾਤ ਉਸ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਿਆ ਕਰ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਰੀਬ ਨਿਵਾਜੁ = ਗਰੀਬਾਂ ਉਤੇ ਮਿਹਰ ਕਰਨ ਵਾਲਾ। ਰੈਣਿ = ਰਾਤ। ਧਿਆਇ = ਸਿਮਰਿਆ ਕਰ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por eso Te contemplo por siempre. (3)"