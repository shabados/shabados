[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਸਹੁ ਨਿੰਮੇ ਮਾਸਹੁ ਜੰਮੇ; ਹਮ ਮਾਸੈ ਕੇ ਭਾਂਡੇ ॥"
page = 1290
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In flesh we are conceived, from flesh we are born and we are the vessel of flesh."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਸ ਅੰਦਰ ਅਸੀਂ ਨਿਪਜੇ ਹਾਂ, ਮਾਸ ਤੋਂ ਅਸੀਂ ਪੈਦਾ ਹੋਏ ਹਾਂ ਅਤੇ ਮਾਸ ਦੇ ਹੀ ਅਸੀਂ ਬਰਤਨ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the flesh we are conceived, and in the flesh we are born; we are vessels of flesh."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਸ ਸੇ ਹੀ ਉਦਰ ਮੇਂ (ਨਿੰਮੇ) ਪ੍ਰਾਪਤਿ ਹੂਏ ਹੈਂ ਔਰ ਮਾਸ ਸੇ ਹੀ ਜਨਮੇ ਹੈ, (ਹਮ) ਤਮਾਮ ਵਾ ਅਸਮਾਦਿਕ (ਭਾਂਡੇ) ਸਰੀਰ ਮਾਸ ਕੇ ਹੀ ਬਣੇ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਸੀਂ ਸਾਰੇ ਮਾਸ ਦੇ ਪੁਤਲੇ ਹਾਂ, ਅਸਾਡਾ ਮੁੱਢ ਮਾਸ ਤੋਂ ਹੀ ਬੱਝਾ, ਅਸੀਂ ਮਾਸ ਤੋਂ ਹੀ ਪੈਦਾ ਹੋਏ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ellos se comen lo incomible, lo que podrían haber comido lo rechazan y abandonan. En realidad tienen un maestro ciego."