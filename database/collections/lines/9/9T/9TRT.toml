[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਗਤੁ ਜਲੰਦਾ ਦੇਖਿ ਕੈ; ਭਜਿ ਪਏ ਸਰਣਾਈ ॥੧॥ ਰਹਾਉ ॥"
page = 424
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Seeing the world in fire, I have hastened to God's sanctuary. Pause"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰ ਨੂੰ ਸੜਦਾ ਹੋਇਆ ਵੇਖ ਕੇ, ਮੈਂ ਦੌੜ ਕੇ ਵਾਹਿਗੁਰੂ ਦੀ ਓਟ ਲਈ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Seeing the world on fire, I have hurried to the Lord's Sanctuary. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਭਾਈ! ਗੁਰੋਂ ਦ੍ਵਾਰਾ ਏਕ ਨਾਮ ਕੋ ਚੇਤ, ਜਗਤ ਕੋ ਆਸਾ ਤ੍ਰਿਸ਼ਨਾ ਰੂਪ ਅਗਨਿ ਮੇਂ ਜਲਤਾ ਹੂਆ ਦੇਖ ਕਰ ਹਮ ਭਾਗ ਕਰ ਗੁਰੋਂ ਕੀ ਸ਼ਰਣ ਪੜੇ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਨੂੰ (ਵਿਕਾਰਾਂ ਵਿਚ) ਸੜਦਾ ਵੇਖ ਕੇ ਮੈਂ ਤਾਂ (ਗੁਰੂ ਦੀ) ਸਰਨ ਦੌੜ ਕੇ ਆ ਪਿਆ ਹਾਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਜਿ = ਦੌੜ ਕੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "viendo el mundo ardiendo en fuego, he buscado el Refugio del Señor. (1‑Pausa)"