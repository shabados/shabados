[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚਾ ਸਾਹਿਬੁ; ਸਾਚੈ ਨਾਇ ॥੧॥ ਰਹਾਉ ॥"
page = 9
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is the Lord and true His Name, O my Mother? Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚਾ ਹੈ ਸੁਆਮੀ ਅਤੇ ਸੱਚਾ ਹੈ ਉਸਦਾ ਨਾਮ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True is the Master, True is His Name. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਸੱਚਾ ਮਾਲਕ ਹੈ ਔਰੁ ਤਿਸ ਕੇ ਨਾਮ ਭੀ ਸੱਚੇ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਉਂ ਜਿਉਂ ਉਸ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਸਿਮਰੀਏ, ਤਿਉਂ ਤਿਉਂ ਉਹ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਮਾਲਕ (ਮਨ ਵਿਚ ਆ ਵੱਸਦਾ ਹੈ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚੈ ਨਾਇ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਹਰਿ-ਨਾਮ ਦੀ ਰਾਹੀਂ, ਜਿਉਂ ਜਿਉਂ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਹਰਿ-ਨਾਮ ਸਿਮਰੀਏ। ਨਾਇ = ਨਾਮ ਦੀ ਰਾਹੀਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Verdad es Él y Verdad es Su Nombre."