[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁ ਜੀਤ ਬਾਹ ਬੀਸ; ਗਰਬ ਈਸ ਕੋ ਮਿਟਾਇ ਹੈਂ ॥੪੦॥"
page = 204

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“He will definitely conquer Lanka and conquering Ravana, he will shatter his pride.40."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵੀਹ ਬਾਂਹਵਾਂ ਵਾਲੇ ਰਾਵਣ ਨੂੰ ਜਿੱਤ ਕੇ ਸ਼ਿਵ ਦਾ ਹੰਕਾਰ ਮਿਟਾਵੇਗਾ ॥੪੦॥"