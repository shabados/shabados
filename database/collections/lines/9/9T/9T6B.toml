data = "ਮਦਰਾ ਸਕਲ ਫੋਰਿ ਘਟ ਗ੍ਵਾਯੋ ॥"
page = 528

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "A monkey came there, who smashed the pitchers full of wine"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੇ) ਸ਼ਰਾਬ ਦਾ ਘੜਾ ਭੰਨ ਕੇ ਸਾਰੀ (ਸ਼ਰਾਬ) ਜ਼ਾਇਆ ਕਰ ਦਿੱਤੀ।"