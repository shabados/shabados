[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੁ ਜਗੁ ਤੇਰਾ; ਸਭ ਤੁਝਹਿ ਧਿਆਏ ॥"
page = 1146
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This entire universe is Thine and it meditates on Thee, O my Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਮੂਹ ਆਲਮ ਤੇਰਾ ਹੈ ਅਤੇ ਇਹ ਤੇਰਾ ਹੀ ਆਰਾਧਨ ਕਰਦਾ ਹੈ, ਹੇ ਮੇਰੇ ਮਾਲਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All this world is Yours; it meditates on You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੰਪੂਰਨ ਸੰਸਾਰ ਤੇਰਾ ਹੈ ਔਰ ਸਭ ਤੇਰੇ ਕੋ ਹੀ ਧ੍ਯਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਇਹ ਸਾਰਾ ਜਗਤ ਤੇਰਾ ਪੈਦਾ ਕੀਤਾ ਹੋਇਆ ਹੈ, ਸਾਰੀ ਲੁਕਾਈ ਤੇਰਾ ਹੀ ਧਿਆਨ ਧਰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭ = ਸਾਰੀ ਲੁਕਾਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mundo entero Te pertenece y medita sólo en Ti."