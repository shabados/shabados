[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਸੁਘਰ ਸੋਰਠਾ ਮਾਝਿ; ਨਿਡਰ ਹੁਇ ਦੀਜੀਐ ॥੧੨੯੯॥"
page = 807

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Purhootari”, then utter the words “ari Pitneesh ari” and know the names of Tupak cleverly for using them unhesitatingly in Soratha.1299."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਦਾ) ਸੋਰਠਾ ਛੰਦ ਵਿਚ ਸੁਘੜਤਾ ਨਾਲ ਪ੍ਰਯੋਗ ਕਰੋ ॥੧੨੯੯॥"