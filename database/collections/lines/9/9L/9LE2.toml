[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਰਾਸੀ; ਕੂੜਾ ਕਰੇ ਵਾਪਾਰੁ ॥"
page = 363
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without capital, he transacts spurious business."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂੰਜੀ ਦੇ ਬਾਝੋਂ ਉਹ ਝੂਠਾ ਵਣਜ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without any capital, he makes false transactions."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਚੀ ਸ੍ਰਧਾ ਰੂਪ (ਰਾਸੀ) ਪੂੰਜੀ ਸੇ ਬਿਨਾਂ ਝੂਠਾ ਬ੍ਯਾਪਾਰ, ਭਾਵ ਮੰਦ ਕਰਮ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਵੇਂ ਕੋਈ ਵਪਾਰੀ) ਸਰਮਾਏ ਤੋਂ ਬਿਨਾ ਠੱਗੀ ਦਾ ਹੀ ਵਪਾਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਸੀ = ਰਾਸਿ, ਪੂੰਜੀ, ਸਰਮਾਇਆ। ਕੂੜਾ = ਝੂਠਾ, ਠੱਗੀ ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sin el Verdadero Capital del Nombre, vano es todo su comercio."