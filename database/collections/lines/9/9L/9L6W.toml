[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਸਰਬ ਰਹਿਆ ਭਰਪੂਰਿ ॥"
page = 876
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself is fulfilling all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪ ਹੀ ਸਾਰਿਆਂ ਨੂੰ ਪਰੀਪੂਰਨ ਕਰ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is all-pervading, permeating everywhere."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂ ਐਸੇ ਹੈ ਕੇ ਆਪ ਹੀ ਹਰੀ ਸਰਬ ਵਸਤੂ ਰੂਪ ਹੋ ਕਰ ਵਾ ਤਿਨੋਂ ਕੇ ਬੀਚ ਪੂਰਨ ਹੋਇ ਰਹਿਆ ਹੈ॥☬ਜੇ ਕਹੇ ਐਸੇ ਕਬ ਜਾਨੀਤਾ ਹੈ?☬ਤਿਸੁ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਸਭ ਜੀਵਾਂ ਵਿਚ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo compenetra todo por todas partes."