[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਰਦੁ ਨਾਚੈ; ਕਲਿ ਕਾ ਭਾਉ ॥"
page = 349
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The hermits like Narad dance under the influence of the Dark-age."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਰਦ ਵਰਗੇ ਰਿਸ਼ੀ, ਕਲਜੁਗ ਦੇ ਪਰਭਾਵ ਹੇਠਾਂ ਨੱਚ ਰਹੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Naarad dances to the tune of the Dark Age of Kali Yuga;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਨਾਰਦੁ) ਮਨ ਜੋ ਚੰਚਲ ਹੈ, ਸੋ ਸੰਕਲਪ ਬਿਕਲਪ ਨਾਚ ਕਰ ਰਹਾ ਹੈ। (ਕਲਿ ਕਾ ਭਾਉ) ਯੇਹ ਕਲਜੁਗ ਕਾ, ਵਾ ਅਵਿਦ੍ਯਾ ਕਾ ਪਰਭਾਉ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ (ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਤੋਂ ਸੁੰਞਾ) ਮਨ (ਮਾਇਆ ਦੇ ਹੱਥਾਂ ਤੇ) ਨੱਚ ਰਿਹਾ ਹੈ। (ਇਸ ਨੂੰ ਕਹੀਦਾ ਹੈ) ਕਲਿਜੁਗ ਦਾ ਪ੍ਰਭਾਵ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਲਿ = ਕਲਿਜੁਗ। ਭਾਉ = ਪ੍ਰਭਾਉ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Naarad danza al son de la Era oscura de Kali Yug,"