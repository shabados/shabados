[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਛਸ ਮਾਰਿ ਲਯੋ ਜਬ ਹੀ; ਤਬ ਰਾਛਸ ਕੋ ਰਿਸ ਕੈ ਦਲੁ ਧਾਯੋ ॥"
page = 438

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When this demon was killed, then the army of demons in their fury, fell upon him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਰਾਖਸ਼ ਨੂੰ ਮਾਰ ਲਿਆ ਗਿਆ, ਤਦੋਂ ਰਾਖਸ਼ ਦੀ ਸੈਨਾ ਨੇ ਕ੍ਰੋਧ ਕਰ ਕੇ ਧਾਵਾ ਕਰ ਦਿੱਤਾ।"