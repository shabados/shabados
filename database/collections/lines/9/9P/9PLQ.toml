[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਬਿਨੁ; ਦੂਜਾ. ਨਾਹੀ ਕੋਇ ॥"
page = 1150
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without Him there is not any other."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਬਗੈਰ ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without Him, there is no one at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਬਿਨਾਂ ਦੂਜਾ ਕੋਈ ਨਹੀਂ ਹੈ, ਭਾਵ ਸਰਬ ਰੂਪ ਓਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਤੋਂ ਬਿਨਾ (ਕਿਤੇ ਭੀ) ਕੋਈ ਹੋਰ ਦੂਜਾ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cruzamos el mar de la existencia, amando el Naam,"