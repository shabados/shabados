[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਥਹੁ ਛੁੜਕਿਆ; ਠਉਰ ਨ ਪਾਇ ॥"
page = 362
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Having lost this chance of human life, he shall find no place of rest."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "(ਮਨੁੱਖਾ ਜਨਮ ਦਾ) ਇਹ ਅਉਸਰ ਗੁਆ ਕੇ ਉਸ ਨੂੰ ਕੋਈ ਆਰਾਮ ਦੀ ਥਾਂ ਨਹੀਂ ਮਿਲਣੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Having lost this opportunity, no place of rest shall be found."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਇਸ ਮਾਨੁਖ ਜਨਮ ਤੇ ਛੂਟੇ ਹੂਏ ਕੋ ਫਿਰ ਠਿਕਾਨਾ ਨਹੀਂ ਮਿਲਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਮਨੁੱਖਾ ਜੀਵਨ ਵਿਚ (ਸਿਮਰਨ ਵਲੋਂ) ਖੁੰਝਿਆ ਹੋਇਆ ਫਿਰ ਆਤਮਕ ਆਨੰਦ ਦੀ ਥਾਂ ਨਹੀਂ ਪ੍ਰਾਪਤ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਥਹੁ ਛੁੜਕਿਆ = ਇਸ ਮਨੁੱਖਾ ਜਨਮ ਦੀ ਵਾਰੀ ਤੋਂ ਖੁੰਝਿਆ। ਠਉਰ = ਟਿਕਾਣਾ, ਥਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sufre de tristeza y, perdiendo esta vida, no encuentra paz en el más allá."