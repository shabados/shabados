[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਸਮਨੁ ਦੁਖੁ ਤਿਸ ਨੋ. ਨੇੜਿ ਨ ਆਵੈ; ਪੋਹਿ. ਨ ਸਕੈ ਕੋਇ ॥"
page = 586
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The enemy and anguish draw not near him and none can even touch him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵੈਰੀ ਅਤੇ ਦੁੱਖ ਉਸ ਦੇ ਲਾਗੇ ਹੀ ਨਹੀਂ ਲੱਗਦੇ ਅਤੇ ਕੋਈ ਉਸ ਨੂੰ ਛੂਹ ਤੱਕ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Enemies and pain cannot come close, and no one can touch him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਤਿਸ ਕੇ ਦੁਸਮਨ ਔ ਦੁਖ ਕਛੁ ਭੀ ਨਿਕਟ ਨਹੀਂ ਆਉਤਾ ਔਰ ਕੋਈ ਪ੍ਰਾਪਤੀ ਤਿਸ ਕੋ (ਪੋਹਿ) ਸਪਰਸ ਨਹੀਂ ਕਰ ਸਕਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਵੈਰੀ ਉਸ ਦੇ ਨੇੜੇ ਨਹੀਂ ਢੁੱਕਦਾ, ਕੋਈ ਦੁਖ ਉਸ ਨੂੰ ਪੋਹ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ningún enemigo lo puede lastimar ni ningún dolor lo puede afligir."