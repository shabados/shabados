[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਕਬੀਰ ਕਉ; ਨਿੰਦਾ ਸਾਰੁ ॥"
page = 339
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To the slave Kabir, calumniation is the best thing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੋਲੇ ਕਬੀਰ ਲਈ ਨਿੰਦਾ ਸਾਰਿਆਂ ਤੋਂ ਚੰਗੀ ਸ਼ੈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Slander is the best thing for servant Kabeer."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੁਝ ਦਾਸ ਕੋ ਤੋ ਨਿੰਦਾ ਹੀ ਸ੍ਰੇਸ਼ਟ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੋ, ਦਾਸ ਕਬੀਰ ਲਈ ਤਾਂ ਉਸ ਦੇ ਔਗੁਣਾਂ ਦਾ ਨਸ਼ਰ ਹੋਣਾ ਸਭ ਤੋਂ ਵਧੀਆ ਗੱਲ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਰੁ = ਸ੍ਰੇਸ਼ਟ ਧਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Para Kabir, el Esclavo del Señor, ser calumniado es lo mejor que le puede pasar,"