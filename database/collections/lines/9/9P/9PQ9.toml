type = "primary"
data = "ਤਾ ਤੇ ਕਾਲ ਨਿਕਟ ਨਹਿ ਆਵੈ ॥੩॥"
page = 838

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘The Sikh, who will find them out for me, will be saved from the clutches of Death.’(3)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਸ ਦੇ ਨੇੜੇ ਕਾਲ ਨਹੀਂ ਆਵੇਗਾ ॥੩॥"