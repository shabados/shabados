[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਣ ਨਿਧਾਨੁ ਘਰਿ ਆਇ ਕੈ; ਭਗਤ ਰੂਪਿ ਲਿਖਿ ਲੇਖੁ ਬਣਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "God, the repository of all virtues in the form of the devotee Himself wrote all the songs for him."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਣਾਂ ਦੇ ਸਮੁੰਦਰ ਨੇ ਘਰ ਆ ਕੇ ਭਗਤ ਰੂਪ (ਧਰਕੇ) ਲੇਖ ਲਿਖ ਕੇ ਬਣਾ ਦਿੱਤਾ।"