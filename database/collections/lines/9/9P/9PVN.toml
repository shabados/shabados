[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਕੋਊ ਹਮਰੋ ਹਿਤੂ; ਤਹ ਮਿਲਿਯੋ ਮੁਹਿ ਆਇ ॥"
page = 918

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Who-so-ever is my lover, may come and meet me there.’"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋਈ ਮੇਰਾ ਹਿਤੂ ਹੋਵੇ, ਮੈਨੂੰ ਉਥੇ ਆ ਕੇ ਮਿਲੇ।"