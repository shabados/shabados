[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬੇ ਆਦਿ. ਪਰਮਲਾਦਿ; ਕਾਸਟ ਚੰਦਨੁ. ਭੈਇਲਾ ॥੨॥"
page = 1351
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God, the source of all, is like the sandal tree, through whom the base wood becomes sandal."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਦਾ ਸੋਮਾ ਵਾਹਿਗੁਰੂ ਚੰਨਣ ਦੇ ਬਿਰਛ ਦੀ ਮਾਨੰਦ ਹੈ, ਜਿਸ ਦੇ ਰਾਹੀਂ ਸਾਧਾਰਨ ਲਕੜੀ ਵੀ ਚੰਨਣ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God, the Primal Source of everything, is like the sandalwood tree; He transforms us woody trees into fragrant sandalwood. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਜੀਵੋਂ ਕੀ ਆਦਿ ਔਰ (ਪਰਮਲਾਦਿ) ਚੰਦਨ ਰੂਪ ਸੰਤੋਂ ਕੀ ਭੀ ਆਦਿ ਰੂਪ ਤੂੰ ਹੀ ਹੈਂ ਔਰ ਕਾਸਟ ਰੂਪ ਅੰਨ੍ਯ ਜੀਵ ਔ ਚੰਦਨ ਰੂਪ ਸੰਤ ਸਰਬ ਰੂਪ ਤੂੰ ਹੀ ਹੋਇ ਰਹਿਆ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਿਵੇਂ, ਉਹ ਸਭ ਜੀਵਾਂ ਦਾ ਮੂਲ ਰਾਮ (ਸਭ ਗੁਣਾਂ-ਰੂਪ) ਸੁਗੰਧੀਆਂ ਦਾ ਮੂਲ ਹੈ (ਉਸ ਦੀ ਸੰਗਤ ਵਿਚ ਸਾਧਾਰਨ ਜੀਵ ਗੁਣਾਂ ਵਾਲੇ ਹੋ ਜਾਂਦੇ ਹਨ) ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਮਲਾਦਿ = ਪਰਮਲ ਆਦਿ, ਸੁਗੰਧੀਆਂ ਦਾ ਮੂਲ। ਕਾਸਟ = (ਸਾਧਾਰਨ) ਕਾਠ। ਭੈਇਲਾ = ਹੋ ਜਾਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios, la Fuente Principal de todo, es como el árbol de Sándalo, nos transforma a nosotros, árboles sin fragancia, en fragancia de Sándalo. (2)"