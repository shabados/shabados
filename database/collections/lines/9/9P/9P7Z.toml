[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹਮਰੋ ਇਹ ਆਇਸ ਹੈ ਤੁਮ ਕੋ; ਜਦੁਬੀਰ ਕੇ ਸਾਮੁਹਿ ਜਾਇ ਲਰੋ ॥"
page = 417

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“We command you to confront and fight with Krishna, the king of Yadavas"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਡੀ ਇਹ ਆਗਿਆ ਹੈ ਕਿ ਤੁਸੀਂ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਦੇ ਸਾਹਮਣੇ ਜਾ ਕੇ ਲੜੋ।"