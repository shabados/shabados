[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤ ਜਨਾ ਕੀ; ਬਰਤਨਿ ਨਾਮੁ ॥"
page = 264
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With the devotees God's Name is an article of every day use."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ ਅਨੁਰਾਗੀਆਂ ਦੇ ਰੋਜ਼ ਦੀ ਵਰਤੋਂ ਦੀ ਸ਼ੈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Unto the devotee, the Naam is an article of daily use."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸ੍ਵਰ ਕੇ ਭਗਤ ਜਨੋਂ ਕੀ ਨਾਮ ਹੀ ਵਰਤਨੇ ਕੌ ਸਮਗ੍ਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ-ਨਾਮ ਭਗਤਾਂ ਦਾ ਹੱਥ-ਠੋਕਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਰਤਨਿ = ਵਰਤੋਂ, ਉਹ ਚੀਜ਼ ਜੋ ਹਰ ਵੇਲੇ ਲੋੜੀਂਦੀ ਹੈ, ਹੱਥ-ਠੋਕਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Nombre es un Recurso permanente para el Gurmukj,"