[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਣ ਸਿਧ ਪ੍ਰਸਿਧ ਸਮ੍ਰਿਧ ਸਨੈ ਕਰ ਉਚਾਇ ਕੈ ਕ੍ਰਿਤ ਸੁਨਾਵਹਿਗੇ ॥"
page = 566

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The famous ganas and adepts will eulogise Him by repeatedly raising their hands"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਗਣ, ਪ੍ਰਸਿੱਧ ਸਿੱਧ ਅਤੇ ਸਿੱਧੀਆਂ ਵਿਚ ਸੰਪੰਨ ਉਚੇ ਹੱਥ ਚੁਕ ਕੇ ਕੀਰਤੀ (ਦੇ ਬੋਲ) ਸੁਣਾਉਣਗੇ।"