[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਪ੍ਰਸਾਦਿ; ਤੇਰਾ ਸੁੰਦਰ ਰੂਪੁ ॥"
page = 270
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose favour thou hast the beauteous form,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਮਿਹਰ ਦੁਆਰਾ ਤੇਰੀ ਸੁਨੱਖੀ ਸ਼ਕਲ ਸੂਰਤ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By His Grace, your form is so beautiful;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਤੇਰਾ ਸੁੰਦਰ ਸਰੂਪ ਭਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਦਇਆ ਨਾਲ ਤੇਰੀ ਸੋਹਣੀ ਸ਼ਕਲ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por Su Gracia, fuiste bendecido con un rostro bello;"