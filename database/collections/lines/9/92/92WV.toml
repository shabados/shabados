[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਉ ਪਿੰਡੁ ਦੇ; ਸਾਜਿਆ ॥"
page = 72
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and himself blessed him with honour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਖੁਦ ਹੀ ਉਸ ਨੂੰ ਇਜ਼ਤ ਆਬਰੂ ਪਰਦਾਨ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He creates and bestows body and soul."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਜੀਉ) ਜੀਵਕਲਾ ਦੇ ਕਰ (ਪਿੰਡੁ) ਸਰੀਰ ਜਿਸ ਤੈਨੇ (ਸਾਜਿਆ) ਬਣਾਇਆ ਹੈ॥☬ਪੁਨ: ਤੂੰ ਕੈਸਾ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿੰਦ ਤੇ ਸਰੀਰ ਦੇ ਕੇ ਆਪ ਹੀ ਉਸ ਨੂੰ ਪੈਦਾ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਉ = ਜਿੰਦ। ਪਿੰਡੁ = ਸਰੀਰ। ਦੇ = ਦੇ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y nos bendice con el cuerpo y el Alma."