[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਹਾਗਨਿ; ਭਵਨ ਤ੍ਰੈ ਲੀਆ ॥"
page = 872
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Mammon has conquered three worlds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਨੇ ਤਿੰਨੇ ਹੀ ਜਹਾਨ ਜਿੱਤ ਲਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This bride has conquered the three worlds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਮਾਇਆ ਨੇ ਤੀਨ ਭਵਨੋਂ ਕੋ ਹੀ ਵਸ ਕਰ ਲੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਮਾਇਆ ਨੇ ਸਾਰੇ ਜਗਤ ਦੇ ਜੀਵਾਂ ਨੂੰ ਵੱਸ ਕੀਤਾ ਹੋਇਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੀਆ = ਵੱਸ ਕੀਤੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Esta esposa se ha ganado el corazón de las tres Gunas,"