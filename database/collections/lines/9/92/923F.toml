[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਕੰਚਨ; ਸੋਹਾਗਾ ਢਾਲੈ ॥"
page = 932
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "as borax melts the Gold."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਸੋਹਾਗਾ ਸੋਨੇ ਨੂੰ ਪਿਘਲਾ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "as gold is dissolved by borax."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਸੁਹਾਗਾ ਕੰਚਨ ਕੋ ਢਾਲਤਾ ਹੈ ਔ ਮੈਲ ਕੋ ਜਲਾਉਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਸੋਹਾਗਾ (ਕੁਠਾਲੀ ਵਿਚ ਪਾਏ) ਸੋਨੇ ਨੂੰ ਨਰਮ ਕਰ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੰਚਨ ਢਾਲੈ = ਸੋਨੇ ਨੂੰ ਨਰਮ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así como la lava derrite el oro."