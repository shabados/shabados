data = "ਚੁੜੇਲਾਂ ਬੋਲ ਰਹੀਆਂ ਸਨ ਅਤੇ ਡਾਕਣੀਆਂ ਡਕਾਰ ਰਹੀਆਂ ਸਨ ॥੩॥੧੫੯॥"