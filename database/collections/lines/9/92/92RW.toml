[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਕੀਮਤਿ. ਕਹਣੁ ਨ ਜਾਇ ॥੪॥੨॥੪੧॥"
page = 361
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, the worth of the Lord cannot be told."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਸੁਆਮੀ ਦਾ ਮੁੱਲ ਦੱਸਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the value of the Lord cannot be described. ||4||2||41||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਪੁਰਸ ਕੀ (ਕੀਮਤਿ) ਮਹਿਮਾਂ ਕਹੀ ਨਹੀਂ ਜਾਤੀ॥੪॥੨॥੪੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਉਸ ਦੇ ਉੱਚੇ ਜੀਵਨ ਦਾ) ਮੁੱਲ ਨਹੀਂ ਦੱਸਿਆ ਜਾ ਸਕਦਾ ॥੪॥੨॥੪੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, uno no puede evaluar al Señor Maravilloso. (4‑2‑41)"