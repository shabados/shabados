[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦ ਬਲਿਹਾਰਿ; ਜਾਈਐ ਕੁਰਬਾਨਾ ॥"
page = 105
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am ever devoted and a sacrifice unto Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹਮੈਸ਼ਾ ਉਸ ਉਤੋਂ ਸਦਕੇ ਤੇ ਵਾਰਣੇ ਜਾਂਦਾ ਹਾਂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am forever devoted, a sacrifice to Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਤਨ ਕਰ ਕੇ ਸਦੀਵ ਕਾਲ ਤੇਰੇ ਬਲਿਹਾਰੇ ਜਾਈਐ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਤੋਂ ਸਦਾ ਸਦਕੇ ਜਾਣਾ ਚਾਹੀਦਾ ਹੈ, ਕੁਰਬਾਨ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਦ = ਸਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Soy por siempre devoto suyo, un sacrificio para El."