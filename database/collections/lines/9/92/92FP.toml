data = "ਉਸ ਨੇ ਸੱਚੇ ਗਿਆਨ ਦਾ ਤਾਜ ਉਸ ਦੇ ਸਿਰ ਉੱਪਰ ਰੱਖ ਦਿੱਤਾ ।"

