[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੀਤ ਚਿਤਾਰਿਯੋ ਆਜੁ ਮੁਹਿ ਧਰਨੀ ਤਲ ਹੌਂ ਧੰਨ︀ਯ ॥੯॥"
page = 913

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And thought, ‘I am very lucky that my lover has remembered me.’(9)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸੋਚਣ ਲਗੀ ਕਿ) ਅਜ ਮਿਤਰ ਨੇ ਮੈਨੂੰ ਯਾਦ ਕੀਤਾ ਹੈ, (ਮੈਂ) ਧਰਤੀ ਉਤੇ ਧੰਨ ਹਾਂ ॥੯॥"