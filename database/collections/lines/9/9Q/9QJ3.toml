[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਇਸੁ ਮਾਰੇ; ਸੁ ਨਾਮਿ ਸਮਾਹਿ ॥"
page = 238
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who kills it, is absorbed in the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਇਸ ਨੂੰ ਨਸ਼ਟ ਕਰ ਦਿੰਦਾ ਹੈ, ਉਹ ਨਾਮ ਵਿੱਚ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who kills this is absorbed in the Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਥਾ ਜੋ ਇਸ ਕੋ ਮਾਰੇ ਸੋ ਨਾਮੀ ਵਾਹਿਗੁਰੂ ਮੇਂ ਸਮਾ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਜੇਹੜਾ ਮਨੁੱਖ ਇਸ ਨੂੰ ਮੁਕਾ ਲੈਂਦਾ ਹੈ, ਉਹ ਸਾਰੇ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਿਚ ਲੀਨ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਮਿ = ਨਾਮ ਵਿਚ। ਸਮਾਹਿ = ਲੀਨ ਰਹਿੰਦੇ ਹਨ {'ਸਮਾਹਿ' ਬਹੁ-ਵਚਨ ਹੈ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "termina y se inmerge en el Naam."