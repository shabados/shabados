type = "primary"
data = "ਸਭ ਗਰਬ ਹੁਐ ਗਯੋ ਛੀਨ ॥"
page = 198

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Because of this the women became modest and all their pride was shattered."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਨ੍ਹਾਂ ਦਾ ਸਾਰਾ ਹੰਕਾਰ ਨਸ਼ਟ ਹੋ ਗਿਆ।"