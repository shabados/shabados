[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਮਨ; ਗੁਰੁ ਅਪਣਾ ਸਾਲਾਹਿ ॥"
page = 1334
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, praise thy Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ! ਤੂੰ ਆਪਣੇ ਗੁਰਾਂ ਦੀ ਸਿਫ਼ਤ ਸ਼ਲਾਘਾ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, praise your Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਅਪਨੇ ਸਤਿਗੁਰੋਂ ਕੋ ਹੀ ਸਲਾਹਿਣਾ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! (ਸਦਾ) ਆਪਣੇ ਗੁਰੂ ਦੀ ਸੋਭਾ ਕਰਿਆ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਸਾਲਾਹਿ = ਵਡਿਆਇਆ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, alaba a tu Dios."