[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਨਾਮੁ; ਰਖਹੁ ਉਰਿ ਧਾਰਿ ॥"
page = 423
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Keep thou, O man, God's Name clasped to thy heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦੇ ਨਾਮ ਨੂੰ ਤੂੰ ਹੇ ਬੰਦੇ! ਆਪਣੇ ਦਿਲ ਨਾਲ ਲਾਈ ਰੱਖ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Keep the Name of the Lord enshrined within your heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਨਾਮ ਕੋ ਉਰ ਮੇਂ ਧਾਰਨ ਕਰ ਰਖਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹ ਵਿਚਾਰ ਇਹ ਹੈ ਕਿ) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਦਾ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਟਿਕਾਈ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਾਰਿ = ਟਿਕਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre del Señor en su corazón,"