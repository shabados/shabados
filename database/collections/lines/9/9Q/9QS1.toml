[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ; ਲੋਚਾ ਪੂਰਨ ਮੇਰੀਆ ॥"
page = 74
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O God! fulfil my desires."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਿਗੁਰੂ! ਮੇਰੀਆਂ ਮਨਸ਼ਾਂ ਪੂਰੀਆਂ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord, please fulfill my desires."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਤੂੰ  ਮੇਰੀ (ਲੋਚਾ) ਚਾਹ ਕੇ ਪੂਰਨ ਕਰਨੇਹਾਰਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਮੇਰੀ ਭੀ ਇਹ ਤਾਂਘ ਪੂਰੀ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰਨ = ਪੂਰੀ ਕਰ। ਲੋਚਾ = ਤਾਂਘ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, haz realidad mis deseos,"