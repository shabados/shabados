[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦੀ ਯਾਦ ਨਾਲੋਂ ਹੋਰ ਕੋਈ ਮਨੋਰਥ ਚੰਗੇਰਾ ਨਹੀਂ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਮੁਦਆ ਬਿਹਤਰ ਜੁਜ਼ ਯਾਦ ਨੀਸਤ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "His word is a diamond which has been blessed with the shine of the real Truth. (29)"