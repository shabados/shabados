[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਸੁਪਨੈ; ਹੋਇ ਬੈਸਤ ਰਾਜਾ ॥"
page = 179
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As when a man sits as a King in a dream,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਸੁਪਨੇ ਵਿੱਚ ਬੰਦਾ ਪਾਤਸ਼ਾਹ ਬਣਕੇ ਬਹਿ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The man sits as a king in his dreams,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੈਸੇ ਰੰਕ ਸੁਪਨੇ ਮੇਂ ਰਾਜਾ ਹੋ ਬੈਠਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਕੋਈ ਮਨੁੱਖ ਸੁਪਨੇ ਵਿਚ ਰਾਜਾ ਬਣ ਕੇ ਬੈਠ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El hombre se sienta como un rey en sus sueños,"