type = "primary"
data = "ਕਲਿਜੁਗਿ ਅੰਦਰਿ, ਭਰਮਿ ਭੁਲਾਏ ॥੧੯॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They all were deluded by kaliyug."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਗੱਲ ਕੀ) ਕੁਲਜੁਗ ਵਿਖੇ (ਲੋਕ) ਭਰਮਾਂ ਵਿਚ ਭੁੱਲ ਗਏ।"