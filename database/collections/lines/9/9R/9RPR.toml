[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਖਤ੍ਰੀ; ਦਰਗਹ ਪਰਵਾਣੁ ॥"
page = 1411
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such a Khatri alone becomes acceptable in the Lord's court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹੋ ਜਿਹਾ ਖੱਤਰੀ ਹੀ ਪ੍ਰਭੂ ਦੇ ਦਰਬਾਰ ਅੰਦਰ ਕਬੂਲ ਪੈ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such a Kh'shaatriyaa is accepted in the Court of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਐਸਾ ਖਤ੍ਰੀ ਹੋਵੈ ਸੋ ਦਰਗਹ ਮੇਂ ਪਰਵਾਣ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਜਿਹਾ ਖੱਤ੍ਰੀ ਪਰਮਾਤਮਾ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਕਬੂਲ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਰਗਹ = ਪਰਮਾਤਮਾ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "tal Kshatrya es aceptado en la Corte del Señor."