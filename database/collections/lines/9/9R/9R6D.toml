[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭਿ ਸਤ. ਸਭਿ ਤਪ; ਸਭਿ ਚੰਗਿਆਈਆ ॥"
page = 349
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All truths, all austerities, all goodnesses;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਸਚਾਈਆਂ, ਸਾਰੀਆਂ ਕਰੜੀਆਂ ਘਾਲਣਾ, ਸਮੂਹ ਨੇਕੀਆਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All Truth, all austerities, all goodness,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਵਾਦ ਆਦਿ ਸਭ ਪ੍ਰਕਾਰ ਕੇ ਗੁਣ ਹੋਂ, ਸਭ ਪ੍ਰਕਾਰ ਕੇ ਤਪ ਅਰ ਸਭ ਪ੍ਰਕਾਰ ਕੀਆਂ ਭਲਿਆਈਆਂ ਹੋਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਵਿਚਾਰਵਾਨ ਕੀਹ ਤੇ ਸਿਧ ਜੋਗੀ ਕੀਹ? ਤੇਰੀ ਵਡਿਆਈ ਦਾ ਅੰਦਾਜ਼ਾ ਤਾਂ ਕੋਈ ਨਹੀਂ ਲਾ ਸਕਿਆ; ਪਰ ਵਿਚਾਰਵਾਨਾਂ ਦੇ) ਸਾਰੇ ਭਲੇ ਕੰਮ, ਸਾਰੇ ਤਪ ਤੇ ਸਾਰੇ ਚੰਗੇ ਗੁਣ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭਿ ਸਤ = ਸਾਰੇ ਭਲੇ ਕੰਮ। ਤਪ = ਕਸ਼ਟ, ਔਖਿਆਈਆਂ। ਚੰਗਿਆਈਆ = ਚੰਗੇ ਗੁਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Toda Verdad, toda Austeridad, toda Bondad,"