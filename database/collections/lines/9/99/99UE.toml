[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਨ ਖੇਲੁ; ਆਪਿ ਵਰਤੀਜਾ ॥"
page = 291
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His play He Himself has spread out."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਖੇਡ ਉਸ ਨੇ ਆਪ ਹੀ ਵਰਤਾਈ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself has staged His own drama;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪ੍ਰਭੂ ਨੇ ਅਪਨਾ (ਖੇਲੁ) ਬਿਲਾਸ ਪ੍ਰਪੰਚ ਆਪ ਹੀ ਵਰਤਾਇਆ ਹੈ, ਭਾਵ ਆਪ ਹੀ ਪ੍ਰਪੰਚ ਰਚਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ ਰੂਪ) ਅਪਾਣੀ ਖੇਡ ਪ੍ਰਭੂ ਨੇ ਆਪ ਬਣਾਈ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਰਤੀਜਾ = ਵਰਤਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todo es Su Juego, Su Trama y Él Mismo lo despliega;"