[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਟ ਨਾਟਿਕ; ਆਖਾਰੇ ਗਾਇਆ ॥"
page = 179
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and actors singing for me at dreams in the arena,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਅਖਾੜਿਆਂ ਦੇ ਰੂਪਕਾ ਵਿੱਚ ਮੇਰੇ ਲਈ ਗਾਉਣ ਵਾਲੇ ਕਲਾਕਾਰ ਹੋਣ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "actors in dramas, singing in theaters"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਟੋਂ ਕੇ ਤਮਾਸ਼ੇ ਦੇਖੇ, ਪੁਨਾ (ਗਾਇਆ) ਗਾਇਕੋਂ ਕੇ ਅਖਾੜੇ ਮੇਂ ਜਾ ਕਰ ਰਾਗ ਸੁਨੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਰੰਗ-ਭੂਮੀ ਵਿਚ ਨਟਾਂ ਦੇ ਨਾਟਕ ਵੇਖੇ ਹਨ, ਤੇ ਉਹਨਾਂ ਦੇ ਗੀਤ ਗਾਏ ਹੋਏ ਸੁਣੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਟ = ਤਮਾਸ਼ਾ ਕਰਨ ਵਾਲੇ। ਆਖਾਰੇ = ਰੰਗ-ਭੂਮੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el ver miles de espectáculos opulentos."