[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਕਾਰ ਸਚੁ ਕਮਾਵਹਿ; ਸਚੇ ਸਚਿ ਸਮਾਵਣਿਆ ॥੭॥"
page = 117
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The pious person does righteous deeds and is absorbed in the Truest of the true."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤਰ ਪੁਰਸ਼ ਸੱਚੇ ਅਮਲ ਕਮਾਉਂਦਾ ਹੈ ਅਤੇ ਸੱਚਿਆਰਾਂ ਦੇ ਪਰਮ ਸਚਿਆਰ ਅੰਦਰ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh practices Truth, and is absorbed in the Truest of the True. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖ ਸਚੀ ਭਗਤੀ ਰੂਪੀ ਕਾਰ ਕਰਤੇ ਹੈਂ, ਯਾਂ ਤੇ ਨਿਹਚੇ ਕਰ ਸਚੇ ਮੇਂ ਸਮਾਵਤੇ ਹੈਂ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿਣ ਵਾਲੇ ਬੰਦੇ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਸਿਮਰਨ (ਦੀ) ਕਾਰ (ਨਿੱਤ) ਕਰਦੇ ਹਨ, (ਇਸ ਤਰ੍ਹਾਂ) ਉਹ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਵਿਚ ਹੀ ਸਦਾ ਲੀਨ ਰਹਿੰਦੇ ਹਨ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "él practica la Verdad del Señor y se inmerge en la Verdad.(7)"