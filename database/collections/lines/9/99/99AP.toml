[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਿੰਘੁ ਬੁਕੇ ਮਿਰਗਾਵਲੀ; ਭੰਨੀ ਜਾਇ, ਨ ਧੀਰਿ ਧਰੋਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "With the roar of the lion in the forest the flocks of escaping deer now cannot have endurance."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸ਼ੇਰ ਦੇ ਭਬਕਿਆਂ ਹਰਨਾਂ ਦੀ ਡਾਰ ਭੱਜਦੀ ਜਾਂਦੀ ਹੈ ਤੇ ਧੀਰਜ ਨਹੀਂ ਧਰਦੀ (ਇਉਂ ਪਾਪਾਂ ਨੂੰ ਭਾਜੜ ਪੈ ਗਈ)।"