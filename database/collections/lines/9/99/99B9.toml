[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛਾਰੁ ਕੀ ਪੁਤਰੀ; ਪਰਮ ਗਤਿ ਪਾਈ ॥"
page = 255
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The puppet of ashes, whom the Saints assist,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਹ ਦੀ ਪੁਤਲੀ ਜਿਸ ਦੀ ਸਾਧੂ ਇਮਦਾਦ ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Even a puppet of ashes attains the supreme status,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਨੇ ਛਾਰ ਭਸਮ ਕੀ ਪੁਤਰੀ ਅਰਥਾਤ ਦੇਹ ਕੋ ਮਿਥ੍ਯਾ ਜਾਣ ਕੇ ਵਾ ਦੇਹ ਦੁਆਰਾ, ਵਾ ਦੇਹ ਕੇ ਹੋਤਿਆਂ ਹੀ (ਪਰਮ ਗਤਿ) ਮੋਖ ਪਦਵੀ ਪਾਇ ਲਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨ ਜਿਸ ਮਨੁੱਖ ਦੀ ਸਹਾਇਤਾ ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛਾਰੁ ਕੀ ਪੁਤਰੀ = ਮਿੱਟੀ ਦੀ ਪੁਤਲੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Señor, nuestro cuerpo, la marioneta de polvo,"