[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਤੀ ਸਤੀ ਪ੍ਰਭੁ ਨਿਰਮਲਾ; ਮੇਰੇ ਹਰਿ ਭਗਵੰਤਾ ॥"
page = 1095
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My fortunate and Immaculate Lord God is true and continent."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਭਾਵਾਂ ਵਾਲਾ ਅਤੇ ਪਵਿੱਤ੍ਰ ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਸੱਚਾ ਅਤੇ ਪ੍ਰਹੇਜ਼ਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Immaculate Lord, my Lord God, is celibate and True."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਹਰਿ ਭਗਵੰਤ ਨਿਰਮਲ ਸਰੂਪ ਸਾਮਰਥ! ਆਪ ਹੀ ਤੂੰ ਜਤੀ ਹੈਂ, ਪੁਨਃ ਆਪ ਹੀ ਸਤੀ ਰੂਪ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਹਰੀ ਭਗਵਾਨ! ਤੂੰ ਆਪ ਹੀ ਜਤੀ ਹੈਂ, ਆਪ ਹੀ ਪਵਿਤ੍ਰ ਆਚਰਨ ਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todopoderoso, Casto, Dios Compasivo,"