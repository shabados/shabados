data = "ਰਣ ਗਾਜ ਬਾਜ ਉਥਕੀਯੰ ॥੨੩॥"
page = 197

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The daggers are glistening and glittering and the elephants and horses are jumping in the battlefield.23."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਰਣ-ਭੂਮੀ ਵਿੱਚ ਹਾਥੀ ਅਤੇ ਘੋੜੇ ਉਛਲਦੇ ਸਨ ॥੨੩॥"