[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਤ ਸਮੁੰਦ ਅਥਾਹ ਕਰਿ; ਰਤਨ ਪਦਾਰਥ ਭਰੇ ਭੰਡਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Variegated forms of agricultural products, medicines,clothings and foods have been created on earth."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਤ ਸਮੁੰਦ੍ਰ ਅਥਾਹ (ਜਿਨ੍ਹਾਂ ਦਾ ਥਾਹ ਨਹੀਂ ਆਵੇ), (ਈਸ਼੍ਵਰ ਨੇ) ਰਚਕੇ ਰਤਨਾਂ ਦੇ ਭੰਡਾਰ ਭਰ ਦਿਤੇ।"