[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਹਿ ਤ; ਧਰਣਿ ਇਕੋਡੀ ਕਰਉ ॥"
page = 1166
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Uttered the Lord: \"If you request, I will turn the earth on its side,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ ਫੁਰਮਾਇਆ: \"ਜੇਕਰ ਤੂੰ ਆਖੇ, ਮੈਂ ਧਰਤੀ ਨੂੰ ਟੇਢੀ ਕਰ ਦਿਆਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord said to him, \"If you wish, I shall turn the earth sideways."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮਦੇਵ ਕੋ ਕਹਤੇ ਹੈਂ: ਜੇਕਰ ਕਹੇ ਤਾਂ ਇਸ ਕੇ ਘਰ ਕੀ ਧਰਤੀ (ਇਕੋਡੀ) ਟੇਡੀ ਕਰ ਦੇਊਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੋਪਾਲ ਨੇ ਆਖਿਆ-ਹੇ ਨਾਮਦੇਵ!) ਜੇ ਤੂੰ ਆਖੇਂ ਤਾਂ ਮੈਂ ਧਰਤੀ ਟੇਢੀ ਕਰ ਦਿਆਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹਹਿ = ਜੇ ਤੂੰ ਆਖੇਂ। ਇਕੋਡੀ = ਟੇਢੀ, ਪੁੱਠੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y a gran voz dijo, si me lo pides, oh Devoto,"