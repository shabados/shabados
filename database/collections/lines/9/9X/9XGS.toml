[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਵ ਸਾਗਰ; ਸੁਖ ਸਾਗਰ ਮਾਹੀ ॥"
page = 323
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the terrible ocean there is an ocean of peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਿਆਨਕ ਸਮੁੰਦਰ ਅੰਦਰ ਇਕ ਆਰਾਮ ਚੈਨ ਦਾ ਸਮੁੰਦਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the terrifying world-ocean, there is an ocean of peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭਵ ਸਾਗਰ ਮੇਂ ਸੁਖ ਸਾਗਰ ਰੂਪ ਜਲ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹ ਭਗਤ ਜਨ ਜਿਨ੍ਹਾਂ ਨੂੰ 'ਰਾਮ-ਉਦਕ' ਨੇ ਸੜਨ ਤੋਂ ਬਚਾਇਆ ਹੈ) ਇਸ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਵਿਚ (ਜੋ ਹੁਣ ਉਹਨਾਂ ਲਈ) ਸੁਖਾਂ ਦਾ ਸਮੁੰਦਰ (ਬਣ ਗਿਆ ਹੈ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਵ ਸਾਗਰ = ਸੰਸਾਰ-ਸਮੁੰਦਰ। ਸੁਖ ਸਾਗਰ = ਸੁਖਾਂ ਦਾ ਸਮੁੰਦਰ। ਮਾਹੀ = ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con el Agua del Señor, el tempestuoso mar de la existencia se convierte en el mar de Paz y Éxtasis,"