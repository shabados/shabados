[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਦਰਹੁ ਬਾਹਰਹੁ ਅੰਧਿਆਂ; ਸੁਧਿ. ਨ ਕਾਈ ਪਾਇ ॥"
page = 647
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From within and without, they are blind and attain not any understanding."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਦਰਹੁ ਬਾਹਰੁ ਉਹ ਅੰਨ੍ਹੇ ਹਨ ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਕੋਈ ਸਮਝ ਨਹੀਂ ਪੈਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They are blind, inwardly and outwardly, and they do not understand anything."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਤਿਨ ਅੰਧਿਓਂ ਕੋ ਅੰਤਰ ਔ ਬਾਹਰ ਸੇਂ ਸੋਝੀ ਕੋਈ ਨਹੀਂ ਪੜਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਅੰਦਰੋਂ ਤੇ ਬਾਹਰੋਂ ਅੰਨ੍ਹਿਆਂ ਨੂੰ ਕੋਈ ਸਮਝ ਨਹੀਂ ਆਉਂਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "permanecen ciegos por dentro y por fuera, y de ninguna forma despiertan."