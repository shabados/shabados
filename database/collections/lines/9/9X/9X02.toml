type = "primary"
data = "ਜਾਨੁਕ ਚੋਟ ਪਰੈ ਘਰਿਯਾਰਾ ॥੭॥"
page = 856

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Using their legs and fists they thrashed like the beat of the pendulum of the clock.(7)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਘੜਿਆਲ ਉਤੇ ਸੱਟਾਂ ਪੈਂਦੀਆਂ ਹੋਣ ॥੭॥"