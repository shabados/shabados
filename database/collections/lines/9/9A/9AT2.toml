data = "ਏਕ ਨ ਉਬਰੀ ਜੀਵਤ ਨਾਰੀ ॥੧੭॥"
page = 982

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The swords were brandished in such intensity that most of the women were killed.(17)"

[[content]]
