[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾਹਿ ਪਠਾਯੋ ਕ੍ਰਿਸਨ ਪ੍ਰਤਿ; ਭੇਦ ਸਕਲ ਸਮਝਾਇ ॥੧੦॥"
page = 822

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She revealed to her all her aspirations, and sent her to Sri Krishna,(10)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਸਾਰੀ ਗੱਲ ਸਮਝਾ ਕੇ ਕ੍ਰਿਸ਼ਨ ਵਲ ਭੇਜ ਦਿੱਤਾ ॥੧੦॥"