type = "primary"
data = "ਸਰੱਕ ਸਸਤ੍ਰ ਝਾਰਹੀ ॥"
page = 50

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They raise their heart-rending shouts and strike their weapons violently."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਨਾਲ ਹੀ) 'ਸੜੱਕ' ਦੀ ਆਵਾਜ਼ ਕਰਦੇ ਸ਼ਸਤ੍ਰ ਚਲਾ ਦਿੰਦੇ ਹਨ।"