assets = ["DGDG"]
type = "primary"
data = "ਕੀਨੇ ਸੁ ਰਾਜ ਪ੍ਰਿਥਮੀ ਸੁਧਾਰਿ ॥੧॥"
page = 615

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "At that time, the clan of demons increased enormously and they ruled over the earth.1."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਨ੍ਹਾਂ ਨੇ) ਬੜੀ ਚੰਗੀ ਤਰ੍ਹਾਂ ਪ੍ਰਿਥਵੀ ਉਤੇ ਰਾਜ ਕੀਤਾ ॥੧॥"