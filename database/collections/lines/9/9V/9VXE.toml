[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ; ਸੋ ਸੇਵੀਐ ਹਾਂ ॥"
page = 409
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My soul, serve thou that Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਡੀ ਜਿੰਦੜੀਏ! ਉਸ ਸਾਹਿਬ ਦੀ ਘਾਲ ਕਮਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, serve Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨਾ! ਉਸ ਪ੍ਰਭੂ ਕਾ ਸੇਵਨ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਮਨ! ਉਸ ਪਰਮਾਤਮਾ ਦੀ ਸੇਵਾ-ਭਗਤੀ ਕਰਨੀ ਚਾਹੀਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਸੋ = ਉਸ ਪ੍ਰਭੂ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es Impenetrable"