[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸੁ ਮਾਰੀ ਬਿਨੁ; ਜੂਠਿ ਨ ਧੋਈ ॥"
page = 238
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without Killing it, Impurity is not washed off."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਨੂੰ ਨਾਸ ਕੀਤੇ ਬਗੈਰ ਅਪਵਿੱਤ੍ਰਤਾ ਧੋਤੀ ਨਹੀਂ ਜਾਂਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without killing this, one's impurity is not washed off."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਇਸ ਕੋ ਮਾਰੇ ਬਿਨਾ ਅੰਤਸਕਰਨ ਕੀ ਜੂਠ ਨਹੀਂ ਧੋਈ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਤੇਰ ਨੂੰ ਮਿਟਾਣ ਤੋਂ ਬਿਨਾ ਮਨ ਵਿਚੋਂ ਵਿਕਾਰਾਂ ਦੀ ਮੈਲ ਨਹੀਂ ਧੁਪਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ni puede lavar sus impurezas."