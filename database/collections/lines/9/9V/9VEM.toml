[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੁਹਿਤਾ ਸਾਹੁ ਫਿਰੰਗ ਕੀ; ਜਾ ਕੋ ਰੂਪ ਅਪਾਰ ॥"
page = 1004

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Shah Farangh had a daughter, who was extremely pretty."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਿਰੰਗ ਸ਼ਾਹ ਦੀ ਇਕ ਪੁੱਤਰੀ ਦਾ ਬਹੁਤ ਸੁੰਦਰ ਰੂਪ ਸੀ।"