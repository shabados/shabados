data = "ਤਬ ਮਾਰ ਮਚੀ ਦੁਹੂੰ ਓਰਨ ਤੇ; ਨ ਰਹਿਓ ਭ੍ਰਮ ਸੂਰਨ ਕੇ ਮਨ ਮੈ ॥"
page = 81

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Undoubtedly horrible playing began from both sides.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਦੋਹਾਂ ਪਾਸਿਆਂ ਤੋਂ ਮਾਰੋ ਮਾਰ ਮੱਚ ਗਈ ਅਤੇ ਸੂਰਮਿਆਂ ਦੇ ਮਨ ਵਿਚ ਕਿਸੇ ਪ੍ਰਕਾਰ ਦਾ ਕੋਈ ਭਰਮ ਨਾ ਰਿਹਾ।"