type = "primary"
data = "ਖੜਗਨ ਸੁ ਪਾਨਿ ਮਹਿਮਾ ਅਪਾਰ ॥੯॥"
page = 615

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There had been one mighty and glorious king named manu.9."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਹੱਥ ਵਿਚ ਤਲਵਾਰ ਰਖਦਾ ਸੀ (ਅਰਥਾਤ-ਤਲਵਾਰ ਦਾ ਧਨੀ ਸੀ) ਅਤੇ ਉਸ ਦੀ ਅਪਾਰ ਮਹਿਮਾ ਸੀ ॥੯॥"