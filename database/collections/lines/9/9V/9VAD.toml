[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੋਰੁ ਸਭੁ ਪਾਖੰਡੁ; ਪੂਜ ਖੁਆਰੁ ॥੬॥"
page = 1343
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ruinous are all other hypocrisies and worships."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਬਾਹ ਕਰਨ ਵਾਲੇ ਹਨ ਹੋਰ ਸਾਰੇ ਧੰਦੇ ਤੇ ਉਪਾਸ਼ਨਾਵਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All other hypocritical actions and devotions bring only ruin. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਸੰਪੂਰਨ ਪਖੰਡ ਕੀ ਪੂਜਾ ਖ੍ਵਾਰ ਕਰਤੀ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਛੱਡ ਕੇ ਨਿਵਲੀ ਆਦਿਕ ਕਰਮ ਕਰਨਾ) ਇਹ ਸਭ ਕੁਝ ਪਖੰਡ ਹੈ (ਇਹਨਾਂ ਕਰਮਾਂ ਦੀ ਰਾਹੀਂ ਲੋਕਾਂ ਪਾਸੋਂ ਕਰਾਈ) ਪੂਜਾ-ਸੇਵਾ (ਆਖ਼ਰ) ਖ਼ੁਆਰ ਕਰਦੀ ਹੈ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "lo demás son devociones hipócritas que sólo te llevan a la ruina. (6)"