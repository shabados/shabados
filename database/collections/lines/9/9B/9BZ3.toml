[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੋਬਿੰਦ. ਹਮ ਐਸੇ ਅਪਰਾਧੀ ॥"
page = 971
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O God, the Lord of the Universe, such sinner am I."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਕੁਲ ਆਲਮ ਦੇ ਸੁਆਮੀ, ਵਾਹਿਗੁਰੂ! ਮੈਂ ਐਹੋ ਜੇਹਾ ਪਾਪੀ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord of the Universe, I am such a sinner!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਬਿੰਦ! ਹਮ ਐਸੇ ਅਪਰਾਧੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਬਿੰਦ! ਅਸੀਂ ਜੀਵ ਅਜਿਹੇ ਵਿਕਾਰੀ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਮ = ਅਸੀਂ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, cometo tal cantidad de errores,"