[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਗ ਕੇ ਰੋਗ ਕਰੇ ਸਬ ਨਾਸਾ ॥"
page = 194

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He spread Ayurveda and destroyed the ailments from the whole world."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜਗਤ ਦੇ ਸਾਰੇ ਰੋਗਾਂ ਨੂੰ ਨਸ਼ਟ ਕਰ ਦਿੱਤਾ।"