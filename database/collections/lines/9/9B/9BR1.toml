[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨ ਦਾਸਨਿ ਦਾਸ ਕਰਹੁ ਹਮ; ਰਾਮਾ ॥"
page = 164
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who meditate on the Name of Lord god."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਅਰਾਧਨ ਕਰਦੇ ਹਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "please make me the slave of their slaves, Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਮ! ਹਮਾਰੇ ਕੋ ਤਿਨ ਕੇ ਦਾਸੋਂ ਕਾ ਦਾਸ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਉਹਨਾਂ ਦੇ ਦਾਸਾਂ ਦਾ ਦਾਸ ਬਣਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਾਸਨਿ ਦਾਸ = ਸੇਵਕਾਂ ਦਾ ਸੇਵਕ। ਰਾਮਾ = ਹੇ ਰਾਮ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "hazme esclavo de sus esclavos, oh Señor."