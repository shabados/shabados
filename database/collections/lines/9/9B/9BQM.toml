[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਸੀਅਰੁ ਸਾਰੰਗ ਧਣਖੁ ਮਦੁ; ਕਉਸਤਕ ਲਛ ਧਨੰਤਰ ਪਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "These jewels are-moon, sarang bow, wine, kaustub mani, Laksmi, the physician;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਚੰਦ੍ਰਮਾ, ਸਾਰੰਗ ਨਾਮਾ ਧਨਖ, ਸ਼ਰਾਬ, ਕੌਸਤਕ ਮਣੀ, ਲੱਛਮੀ, ਧਨੰਤਰ ਨਾਮਾ ਵੈਦ।"