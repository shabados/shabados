[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਗੋਯਾ ਨੇ ਸੱਜਨ ਦੀ ਯਾਦ ਵਿਚ ਅਸਲ ਜੀਵਨ ਪਾ ਲਿਆ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਗੋਯਾ ਜ਼ਿ ਯਾਦਿ ਦੂਸਤ ਹਕੀਕੀ ਹੱਯਾਤ ਯਾਫ਼ਤ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "In fact, it is the (heavy) weight of intense devotion that has bent the back of the heavenly sky. (50) (6)"