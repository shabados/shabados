[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦੀਵਾ ਬਲੈ ਬੈਸੰਤਰਹੁ; ਚਾਨਣੁ ਅਨ੍ਹੇਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Fire lits the lamp and light scatters in the darkness."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅੱਗ ਥੋਂ ਦੀਵਾ ਬਲਕੇ ਹਨੇਰੇ ਵਿਚ ਚਾਨਣ(ਕਰਦਾ ਹੈ)।"