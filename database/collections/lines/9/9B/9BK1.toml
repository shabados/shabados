[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤਾ ਕਾ ਕਾਰਜੁ ਹਰਿ ਅਨੰਦੁ ਹੈ; ਅਨਦਿਨੁ ਹਰਿ ਗੁਣ ਗਾਈ ॥"
page = 600
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord of bliss is the pursuit of the saints and, night and day, they sings God's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਸੰਨਤਾ ਦਾ ਸੁਆਮੀ ਸਾਧੂਆਂ ਦਾ ਕੰਮ-ਧੰਦਾ ਹੈ ਅਤੇ ਉਹ ਰੈਣ ਦਿਹੁੰ ਹਰੀ ਦਾ ਜੱਸ ਗਾਹਿਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord of bliss is his object of devotion; night and day, he sings the Glorious Praises of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰਿ ਅਨੰਦ ਸਰੂਪ! ਤੇਰੇ ਹਰ ਪ੍ਰਕਾਰ ਕੇ ਗੁਨੋਂ ਕੇ ਰਾਤ ਦਿਨ ਗਾਯਨ ਕਰਨੇ ਵਾਲੇ ਬਨੇ ਰਹਨਾ, ਯਹੀ ਭਗਤੋਂ ਕਾ ਕਾਰਜੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਭਗਤਾਂ ਦਾ ਮੁੱਖ ਕੰਮ ਇਹੀ ਹੁੰਦਾ ਹੈ ਕਿ ਉਹ (ਆਪਾ-ਭਾਵ ਗਵਾ ਕੇ) ਹਰ ਵੇਲੇ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੇ ਗੀਤ ਗਾ ਕੇ ਉਸ ਦੇ ਮਿਲਾਪ ਦਾ ਆਨੰਦ ਮਾਣਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਰਜੁ = ਮੁਖ ਕੰਮ। ਹਰਿ ਅਨੰਦੁ = ਹਰੀ (ਦੇ ਮਿਲਾਪ) ਦਾ ਆਨੰਦ। ਗਾਈ = ਗਾਇ, ਗਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Devotos del Señor están comprometidos con el Señor de Éxtasis, y así cantan siempre la Alabanza de su Señor."