[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਉਲੀ ਕਰਮ ਕਰੈ ਬਹੁ ਆਸਨ ॥"
page = 265
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He may practise inner-washing and many meditative postures."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਅੰਦਰ ਧੋਣ ਅਤੇ ਘਣੇਰੇ ਧਿਆਨ ਦੇ ਢੰਗ ਕਰਦਾ ਹੋਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "you may practice techniques of inner cleansing and all sorts of Yogic postures;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਨਿਉਲੀ) ਨੇਤੀ ਧੋਤੀ ਆਦਿ ਜੋ ਸਰੀਰ ਸੁਧੀ ਕੇ ਕਰਮ ਹੈਂ, ਤਿਨੋਂ ਸਹਤ ਬਹੁਤ ਪਦਮਾਸਨ ਆਦਿ ਆਸਨ ਭੀ ਕਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਿਉਲੀ ਕਰਮ ਤੇ ਹੋਰ ਬਹੁਤ ਸਾਰੇ (ਯੋਗ) ਆਸਨ ਕਰੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਉਲੀ ਕਰਮ-ਯੋਗ ਦਾ ਇਕ ਸਾਧਨ ਹੈ ਜਿਸ ਨਾਲ ਆਂਦਰਾਂ ਸਾਫ਼ ਕਰੀਦੀਆਂ ਹਨ। ਸਾਹ ਬਾਹਰ ਨੂੰ ਕੱਢ ਕੇ ਪੇਟ ਨੂੰ ਅੰਦਰ ਵਲ ਖਿੱਚ ਲਈਦਾ ਹੈ, ਫੇਰ ਆਂਦਰਾਂ ਨੂੰ ਇਕੱਠੀਆਂ ਕਰ ਕੇ ਘੁਮਾਈਦਾ ਹੈ। ਇਹ ਸਾਧਨ ਸਵੇਰੇ ਖ਼ਾਲੀ ਪੇਟ ਕਰੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ceremonias de purificación y metas tu cuerpo al fuego."