[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਬਚਨ; ਮੇਰੇ ਮਨਹਿ ਮੰਤ ॥"
page = 987
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints' words are the charm of my soul."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਦੇ ਬਚਨ-ਬਿਲਾਸ ਮੈਂਡੀ ਜਿੰਦੜੀ ਦਾ ਮੰਤ੍ਰ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Words of the Saints are the Mantras of my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੇ ਬਚਨ ਮੇਰੇ ਮਨ ਕੋ ਠਹਿਰਾਵਨ ਕੋ ਮੰਤਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤਾਂ ਦੇ ਬਚਨ-ਮੰਤ੍ਰ ਮੇਰੇ ਮਨ ਵਿਚ ਟਿਕੇ ਰਹਿਣ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਹਿ = ਮਨ ਵਿਚ। ਮੰਤ = ਮੰਤਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Gozo de la Palabra de los Santos;"