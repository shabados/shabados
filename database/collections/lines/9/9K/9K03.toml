type = "primary"
data = "ਸਿ ਪਿਸਰਾ ਦਿਗ਼ਰ ਸ਼ਾਹਿ ਆਜ਼ਾਦ ਕਰਦ ॥"
page = 1397

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Which I may need at the time of struggle,(60)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਾਕੀ ਤਿੰਨ ਪੁੱਤਰਾਂ ਨੂੰ ਬਾਦਸ਼ਾਹੀ ਤੋਂ ਆਜ਼ਾਦ ਕਰ ਦਿੱਤਾ (ਭਾਵ ਵਖਰਾ ਕਰ ਦਿੱਤਾ)"