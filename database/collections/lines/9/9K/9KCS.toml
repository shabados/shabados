[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਜਨਾ ਕਾ; ਨਿਰਮਲ ਮੰਤ ॥"
page = 288
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Pure is the instruction of the saintly persons."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤ੍ਰ ਹੈ ਉਪਦੇਸ਼ ਸਾਧ ਰੂਪ ਪੁਰਸ਼ਾਂ ਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Pure are the instructions of the humble Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨੋਂ ਕਾ ਨਿਰਮਲ ਉਪਦੇਸ ਰੂਪ ਮੰਤਰ ਲੇ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤਾਂ ਦਾ ਇਹੀ ਪਵਿਤ੍ਰ ਉਪਦੇਸ਼ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਤ = ਉਪਦੇਸ਼, ਸਿੱਖਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pura es la enseñanza de los Santos"