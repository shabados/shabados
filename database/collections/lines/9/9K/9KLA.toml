[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਮਾਲੀ ਆਪਿ ਸਭੁ ਸਿੰਚੈ; ਆਪੇ ਹੀ ਮੁਹਿ ਪਾਏ ॥"
page = 554
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Himself is He the gardner Himself irrigates all the plants and Himself puts their fruit in the mouth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪ ਬਾਗਵਾਨ ਹੈ ਆਪੇ ਹੀ ਸਾਰਿਆਂ ਪੌਦਿਆਂ ਨੂੰ ਸਿੰਜਦਾ ਹੈ ਅਤੇ ਉਹ ਆਪ ਹੀ ਉਨ੍ਹਾਂ ਦੇ ਫਲ ਨੂੰ ਮੂੰਹ ਵਿੱਚ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is the Gardener, He Himself irrigates all the plants, and He Himself puts them in His mouth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਆਪ ਹੀ ਮਾਲੀ ਰੂਪ ਹੋ ਕਰ ਸਭ ਕੋ ਸਿੰਚਨ ਕਰਤਾ ਹੈ, ਆਪੇ ਹੀ ਉਨ ਫਲੋਂ ਕੋ ਫਿਰ (ਮੁਹਿ ਪਾਏ) ਮੁਖ ਸੇ ਭੋਜਨ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਮਾਲੀ ਹੈ, ਆਪ ਹੀ ਪਾਣੀ ਦੇਂਦਾ ਹੈ ਤੇ ਆਪ ਹੀ (ਫਲ) ਖਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿੰਚੈ = ਪਾਣੀ ਦੇਂਦਾ ਹੈ। ਮੁਹਿ = ਮੂੰਹ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo es el jardinero, atiende y riega las plantas, y Él Mismo se come la verdura."