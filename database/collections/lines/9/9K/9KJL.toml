[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਸ ਇੰਦ੍ਰੀ; ਕਰਿ ਰਾਖੈ ਵਾਸਿ ॥"
page = 236
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and keeps under his control the ten (five sensory and five motor) organs."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੀ ਦਸੇ (ਪੰਜ ਗਿਆਨ ਤੇ ਪੰਜ ਕਰਮ) ਇੰਦਰੀਆਂ ਨੂੰ ਆਪਣੇ ਕਾਬੂ ਵਿੱਚ ਰਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They keep the ten organs under their control;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਦਸ ਇੰਦ੍ਰੀਓਂ ਕੋ ਵਸ ਕਰ ਰਾਖੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦਸਾਂ ਹੀ ਇੰਦ੍ਰੀਆਂ ਨੂੰ ਆਪਣੇ ਕਾਬੂ ਵਿਚ ਕਰ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਾਸਿ = ਵੱਸ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y mantiene bajo control"