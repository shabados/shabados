[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦ ਮੰਗਲ ਗੁਰ ਚਰਣੀ ਲਾਗੇ; ਪਾਏ ਸੂਖ ਘਨੇਰੇ ਰਾਮ ॥"
page = 925
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Clinging to the Guru's feet, they obtain manifold mirths, glees and comforts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਪੈਰਾਂ ਨਾਲ ਜੁੜ ਕੇ, ਉਹ ਅਨੇਕਾਂ ਖੁਸ਼ੀਆਂ ਹੁਲਾਸ ਅਤੇ ਆਰਾਮ ਪਾ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Ecstasy, bliss and great happiness are obtained by grasping hold of the Guru's feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਮ! ਗੁਰੋਂ ਕੀ ਚਰਨੀ ਲਾਗ ਕਰ ਕੇ ਅਨੰਦ ਮੰਗਲ ਰੂਪ ਸੂਖ ਘਨੇ ਹੀ ਤਿਨੋਂ ਨੇ ਪਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਚਰਨੀਂ ਲੱਗ ਕੇ ਉਹਨਾਂ ਨੂੰ ਅਨੇਕਾਂ ਆਨੰਦ ਖ਼ੁਸ਼ੀਆਂ ਤੇ ਸੁਖ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਦ ਮੰਗਲ = ਅਨੇਕਾਂ ਸੁਖ ਤੇ ਖ਼ੁਸ਼ੀਆਂ। ਲਾਗੇ = ਲਾਗਿ, ਲੱਗ ਕੇ। ਘਨੇਰੇ = ਅਨੇਕਾਂ, ਬਹੁਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Postrándonos a los Pies del Guru, vivimos en Paz y en Éxtasis. Logrando este Tesoro"