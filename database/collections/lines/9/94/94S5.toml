[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਉ ਨਾਮੁ; ਮੋਹਿ ਨਿਸਤਾਰੇ ॥੧॥ ਰਹਾਉ ॥"
page = 1338
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that contemplating the Name, I may be emancipated. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿ ਨਾਮ ਦਾ ਆਰਾਧਨ ਕਰਨ ਦੁਆਰਾ, ਮੇਰਾ ਪਾਰ ਉਤਾਰਾ ਹੋ ਜਾਵੇ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "let me meditate on the Naam, the Name of the Lord, and be emancipated. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤੇ ਨਾਮ ਕਾ ਸਿਮਰਨ ਕਰੋਂ, ਸੋਈ ਮੁਝਕੌ ਨਿਸਤਾਰੇਗਾ, ਭਾਵ ਸੰਸਾਰ ਸਮੁੰਦਰ ਸੇ ਪਾਰ ਕਰੇਗਾ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਦੀ ਰਾਹੀਂ) ਮੈਂ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਦਾ ਰਹਾਂ (ਜਿਹੜਾ ਨਾਮ) ਮੈਨੂੰ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘਾ ਲਏ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਮਰਉ = ਮੈਂ ਸਿਮਰਦਾ ਹਾਂ। ਮੋਹਿ = ਮੈਨੂੰ। ਨਿਸਤਾਰੇ = (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘਾਂਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre de Dios y obtener la Liberación. (1-Pausa)"