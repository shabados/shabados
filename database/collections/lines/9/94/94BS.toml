[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਈਹਾਂ ਊਹਾ ਤਿਨ ਕੇ ਮੁਖ ਕਾਰੇ ॥੭॥"
page = 71

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Those, who turn away their face from the feet of the Guru, their faces are blackened in this and the next world.7."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਲੋਕ-ਪਰਲੋਕ ਵਿਚ ਉਨ੍ਹਾਂ ਦੇ ਮੂੰਹ ਕਾਲੇ ਹੁੰਦੇ ਹਨ ॥੭॥"