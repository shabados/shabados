[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਾਸ ਦਸੰਤਣ ਭਾਇ; ਤਿਨਿ ਪਾਇਆ ॥"
page = 275
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With the sentiment of Lord's slaves slave, he obtains Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਗੋਲੇ ਦੇ ਗੋਲੇ ਵਾਲੇ ਵਲਵਲੇ ਦੁਆਰਾ ਉਹ ਉਸ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Deeming himself to be the slave of the Lord's slaves, he obtains it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸੀ ਤੇ ਤਿਸੀ ਹਰੀ ਕੇ ਦਾਸ ਨੇ ਦਾਸਾ ਪਣੇ ਭਾਵ ਕੌ ਪਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦਾਸਾਂ ਦਾ ਦਾਸ ਹੋਣ ਦੇ ਸੁਭਾਉ ਨਾਲ ਉਸ ਨੇ ਪ੍ਰਭੂ ਨੂੰ ਲੱਭਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਇ = ਭਾਵਨਾ ਨਾਲ, ਸੁਭਾਉ ਦੀ ਰਾਹੀਂ। ਦਾਸ ਦਸੰਤਣ ਭਾਇ = ਦਾਸਾਂ ਦਾ ਦਾਸ ਹੋਣ ਦੀ ਭਾਵਨਾ ਨਾਲ। ਤਿਨਿ = ਉਸ (ਮਨੁੱਖ) ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que prevalece en todo."