[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸ ਕਾ ਬਲੁ; ਨਾਹੀ ਇਸੁ ਹਾਥ ॥"
page = 277
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This mortal's power is not in his own hands."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਪ੍ਰਾਣੀ ਦੀ ਤਾਕਤ ਇਸ ਦੇ ਆਪਣੇ ਹੱਥ ਵਿੱਚ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no power in the hands of mortal beings;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਜੀਵ ਕਾ ਬਲੁ ਇਸ ਕੇ ਹਾਥ ਨਹੀਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ (ਜੀਵ) ਦੀ ਤਾਕਤ ਇਸ ਦੇ ਆਪਣੇ ਹੱਥ ਨਹੀਂ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ningún poder que el hombre maneje está bajo su control;"