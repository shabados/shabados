data = "ਉਸ ਸੂਰਮੇ ਦਾ ਨਾਂ 'ਅਸੋਭ' ਹੈ ਅਤੇ ਉਸ ਨੂੰ ਸਭ ਲੋਗ ਜਾਣਦੇ ਹਨ।"