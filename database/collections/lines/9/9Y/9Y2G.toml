[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁਣਿਯੋ ਨਾਦ ਸ੍ਰਵਣੰ ਕੀਯੋ ਦੇਵਿ ਕੋਪੰ ॥"
page = 105

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the goddess heard voice of the demon-chief, she was greatly enraged."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੇਵੀ (ਨੇ ਕੰਨਾਂ ਨਾਲ ਨਾਦ ਸੁਣ ਕੇ) ਬਹੁਤ ਕ੍ਰੋਧਵਾਨ ਹੋਈ"