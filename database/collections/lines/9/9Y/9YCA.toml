[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਸਾਚਾ ਸਾਹਿਬੁ; ਦਾਸੁ ਤੇਰਾ ਗੋਲਾ ॥"
page = 132
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art the True Lord. I am Thy servant and slave."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੱਚਾ ਸੁਆਮੀ ਹੈ। ਮੈਂ ਤੇਰਾ ਸੇਵਕ ਤੇ ਗੁਲਾਮ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my True Lord and Master. I am Your servant and slave."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਾਚਾ ਸਾਹਿਬ ਹੈਂ ਤੇਰਾ ਮਨ ਤਨ ਕਰ ਦਾਸ ਹਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਮੁੱਲ ਨਹੀਂ ਪੈ ਸਕਦਾ (ਕਿਸੇ ਭੀ ਪਦਾਰਥ ਦੇ ਵੱਟੇ ਤੇਰੀ ਪ੍ਰਾਪਤੀ ਨਹੀਂ ਹੋ ਸਕਦੀ)। ਤੂੰ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਮਾਲਕ ਹੈਂ। ਮੈਂ ਤੇਰਾ ਦਾਸ ਹਾਂ, ਗ਼ੁਲਾਮ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚਾ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ। ਗੋਲਾ = ਗ਼ੁਲਾਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "eres el Verdadero Maestro, y yo soy Tu Esclavo, oh Señor."