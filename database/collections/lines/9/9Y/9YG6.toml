[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਅੰਤਰ ਕੀ; ਉਤਰੈ ਚਿੰਦ ॥"
page = 295
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The anxiety of thy mind and heart shall depart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਚਿੱਤ ਤੇ ਦਿਲ ਦਾ iਫ਼ਕਰ ਦੂਰ ਹੋ ਜਾਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and the anxiety within your mind shall depart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਤੇ ਤੁਮਾਰੇ ਮਨ ਕੇ ਅੰਤਰਿ ਕੀ ਚਿੰਤਾ ਨਾਸ ਹੋ ਜਾਇਗੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਾਂ ਜੁ) ਤੇਰੇ ਮਨ ਦੇ ਅੰਦਰ ਦੀ ਚਿੰਤਾ ਮਿਟ ਜਾਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ ਅੰਤਰ ਕੀ = ਮਨ ਦੇ ਅੰਦਰ ਦੀ। ਚਿੰਦ = ਚਿੰਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y las ansiedades de tu mente se irán."