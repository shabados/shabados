[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਿਹ ਪਾਛੈ ਆਪਨ ਜਰੀ; ਢੋਲ ਮ੍ਰਿਦੰਗ ਬਜਾਇ ॥੧੯॥"
page = 822

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The drums she immolated herself with her husband and became a Sati.(19)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਤੋਂ ਬਾਦ ਆਪ ਢੋਲ ਮ੍ਰਿਦੰਗ ਵਜਾ ਕੇ ਸੜ ਮੋਈ ॥੧੯॥"