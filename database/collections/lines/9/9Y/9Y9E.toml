[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਮ. ਹਰਿ ਸੇਤੀ; ਰਾਤੇ ਸੰਤਹੁ ॥"
page = 209
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Saint-Guru thou art imbued with God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੈ ਸਾਧੂ-ਗੁਰਦੇਵ! ਤੁਸੀਂ ਵਾਹਿਗੁਰੂ ਨਾਲ ਰੰਗੇ ਹੋਏ ਹੋ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Saint, You are attuned to the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤੋ! ਤੁਮ ਹਰੀ ਕੇ ਸਾਥ ਰਾਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! (ਤੁਸੀ ਭਾਗਾਂ ਵਾਲੇ ਹੋ ਕਿ) ਤੁਸੀ ਪਰਮਾਤਮਾ ਨਾਲ ਰੱਤੇ ਹੋਏ ਹੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤਹੁ = ਹੇ ਸੰਤ ਜਨੋ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi Guru Santo, estás siempre imbuido con el Señor;"