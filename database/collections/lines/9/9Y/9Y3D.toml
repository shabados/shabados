data = "ਨਾਮ ਜਥਾ ਮਤਿ ਭਾਖ ਸੁਨਾਊਂ ॥"
page = 49

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "If now you shower your grace upon me, I shall describe (a few) names, as I know them."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤਾਂ ਉਨ੍ਹਾਂ ਦੇ) ਨਾਂ ਯਥਾ-ਬੁੱਧੀ ਆਖ ਸੁਣਾਵਾਂ।"