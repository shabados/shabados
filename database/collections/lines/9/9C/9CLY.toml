[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਦਿ ਪੁਰਖ ਤੇ; ਹੋਇ ਅਨਾਦਿ ॥"
page = 873
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From The Primal Lord wells up corn etc."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਾਪੂਰਬਲੇ ਪ੍ਰਭੂ ਤੋਂ ਹੀ ਅਨਾਜ ਆਦਿਕ ਪੈਦਾ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This grain comes from the Primal Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਦ ਪੁਰਖ ਤੋਂ ਅਨਾਜ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਅੰਨ (ਜਿਸ ਨੂੰ ਤਿਆਗਣ ਵਿਚ ਤੁਸੀ ਭਗਤੀ ਸਮਝਦੇ ਹੋ) ਪਰਮਾਤਮਾ ਤੋਂ ਹੀ ਪੈਦਾ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਦਿ ਪੁਰਖ = ਪਰਮਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es el Ser Primordial Quien nos bendice con el pan de cada día"