[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਆਦਿ ਪੁਰਖ ਆਦੇਸਿ; ਅਲਖੁ ਲਖਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "I bow before the eternal Lord who by his own grace shows his invisible form (in all the creatures)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅਕਾਲ ਪੁਰਖ (ਯਾ ਗੁਰੂ ਨਾਨਕ) ਨੂੰ (ਮੇਰੀ) ਨਮਸ਼ਕਾਰ ਹੈ ਜੋ ਅਲਖ (ਵਸਤੂ) ਦੇ ਲਖਣਹਾਰੇ ਹਨ।"