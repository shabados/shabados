[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜੀਉ; ਤੂ ਸੁਖ ਸੰਪਤਿ ਰਾਸਿ ॥"
page = 619
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O reverend Master, Thou art my bliss, wealth and capital."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਹਾਰਾਜ ਮਾਲਕ! ਤੂੰ ਮੇਰੀ ਖੁਸ਼ੀ, ਧਨ-ਦੌਲਤ ਅਤੇ ਪੂੰਜੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Dear Lord, You are my peace, wealth and capital."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰਿ ਜੀ! ਤੂੰ ਹੀ ਹਮਾਰੇ ਸੁਖ ਔ ਸੰਪਤਾ ਕੀ ਪੂੰਜੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਜੀ! ਤੂੰ ਹੀ ਮੈਨੂੰ ਆਤਮਕ ਆਨੰਦ ਦਾ ਧਨ-ਸਰਮਾਇਆ ਦੇਣ ਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਪਤਿ = ਧਨ। ਰਾਸਿ = ਸਰਮਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, eres mi Tesoro de Éxtasis;"