[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਮਸਕਾਰੁ ਕਰਿ ਹਿਰਦੈ ਮਾਹਿ ॥"
page = 971
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Make thou obeisance unto God within thy mind,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਅੰਦਰ ਤੂੰ ਵਾਹਿਗੁਰੂ ਨੂੰ ਪ੍ਰਣਾਮ ਕਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Bow in humility within your heart,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤੂੰ ਹਿਰਦੇ ਮਾਹਿ ਨਮਸਕਾਰ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੂੰ ਸਦਾ ਸਿਰ ਨਿਵਾ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque abandonando la carga de los errores, uno es emancipado."