[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਮ੍ਰਿਤੁ ਪੀਵਹੁ; ਸਾਧ ਪਿਆਰੇ ॥"
page = 899
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Drink ye the Name-Nectar, O dear saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੁਸੀਂ ਨਾਮ ਦੇ ਸੁਧਾਰਸ ਨੂੰ ਪਾਨ ਕਰੋ, ਹੇ ਸਨੇਹੀ ਸੰਤੋ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Drink in the Ambrosial Nectar, O Beloved Holy people."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਪਿਆਰਿਓ! ਸੰਤੋਂ ਸਾਥ ਮਿਲ ਕੇ ਨਾਮ ਅੰਮ੍ਰਿਤ ਕੋ ਪੀਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਿਆਰੇ ਸੰਤ ਜਨੋ! (ਤੁਸੀ ਭੀ) ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ ਪੀਂਦੇ ਰਹੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧ = ਹੇ ਸੰਤ ਜਨੋ! ਅੰਮ੍ਰਿਤੁ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਰਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Santo, bebe del Néctar del Nombre del Señor"