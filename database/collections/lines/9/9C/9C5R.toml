[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਧਣ ਖੇਤ ਵਿਹਾਣੀ; ਮਹਖੇ ਦੈਤ ਨੂੰ ॥੧੯॥"
page = 122

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On the demon Mahisha the period of agony occurred in the battlefield.19."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਹਿਖਾਸੁਰ ਨੂੰ ਯੁੱਧ-ਭੂਮੀ ਵਿਚ ਦੁਖਦਾਇਕ ਸਮਾਂ (ਬਿੱਧਣ) ਕਟਣਾ ਪਿਆ ॥੧੯॥"