[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਵਿਚਿ ਖਟਿਆ; ਹਉ ਵਿਚਿ ਗਇਆ ॥"
page = 466
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In pride he earns, in pride he losses."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੰਕਾਰ ਅੰਦਰ ਉਹ ਕਮਾਉਂਦਾ ਹੈ, ਹੰਕਾਰ ਅੰਦਰ ਹੀ ਉਹ ਗੁਆ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In ego they earn, and in ego they lose."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਖਟਨਾ ਖੋਵਨਾ ਹੰਕਾਰ ਕਰ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸੇ 'ਮੈਂ, ਮੈਂ' ਦੇ ਖ਼ਿਆਲ ਵਿਚ (ਕਿ ਇਹ ਕੰਮ 'ਮੈਂ' ਕਰਦਾ ਹਾਂ, 'ਮੈਂ' ਕਰਦਾ ਹਾਂ) ਕਦੇ ਖੱਟਦਾ ਕਦੇ ਗਵਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en el ego uno medita en la Virtud y el error."