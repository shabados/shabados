[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਨ ਕ੍ਰਿਪਾਨ ਗਦਾ ਕੇ ਲਗੇ; ਬਹੁ ਜੂਝਿ ਪਰੇ ਕਰਿ ਦੁੰਦ ਲਰਾਈ ॥"
page = 416

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In that war, a great part of the army fell down on the earth with the blows of arrows, swords and maces in that conflict"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਾਣ, ਕ੍ਰਿਪਾਨ, ਗਦਾ (ਆਦਿ ਹਥਿਆਰਾਂ) ਦੇ ਲਗਣ ਨਾਲ ਅਨੇਕ (ਯੋਧੇ) ਦੁਅੰਦ ਯੁੱਧ ਕਰ ਕੇ ਮਰ ਗਏ ਹਨ।"