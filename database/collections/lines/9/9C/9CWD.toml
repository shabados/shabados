[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਗਮ ਅਗਮ; ਊਚਹ ਤੇ ਊਚ ॥"
page = 1182
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou, O Lord, are Unfathomable, Inaccessible and the highest of high."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੇ ਪ੍ਰਭੂ! ਅਥਾਹ ਪਹੁੰਚ ਤੋਂ ਪਰ੍ਹੇ ਅਤੇ ਬੁਲੰਦਾ ਦਾ ਪਰਮ ਬੁਲੰਦ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are Inaccessible and Unfathomable, the Highest of the High."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ (ਅਗਮ) ਸਾਸਤ੍ਰੋਂ ਵਾ ਮਨ ਬਾਣੀ ਕਾ ਪਰਾ ਹੈਂ ਔਰ (ਊਚ) ਬ੍ਰਹਮਾਦਿਕੋਂ ਸੇ ਊਚਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਅਪਹੁੰਚ ਹੈਂ, ਤੂੰ ਅਪਹੁੰਚ ਹੈਂ, ਤੂੰ ਉੱਚਿਆਂ ਤੋਂ ਉੱਚਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਮ = ਅਪਹੁੰਚ। ਤੇ = ਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú eres nuestro Señor Insondable, lo más Alto de lo alto."