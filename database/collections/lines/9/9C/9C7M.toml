[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੈਫ ਸਰੋਹੀ ਸਤ੍ਰੁ ਅਰਿ; ਸਾਰੰਗਾਰਿ ਜਿਹ ਨਾਮ ॥"
page = 718

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art the Saif and Sarohi and Thy Name is the destroyer of the enemies"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੈਫ, ਸਰੋਹੀ, ਸਤ੍ਰੁ ਅਰਿ, ਸਾਰੰਗਾਰਿ (ਧਨੁਸ਼ ਦੀ ਵੈਰਨ) ਜਿਸ ਦੇ ਨਾਮ ਹਨ,"