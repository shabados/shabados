[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਗੁਰੁ ਸੇਵਿ. ਮਨੁ ਨਿਰਮਲਾ; ਹਉਮੈ ਤਜਿ ਵਿਕਾਰ ॥"
page = 34
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If thou servest the True Guru, thy mind becomest pure and thou sheldest thy ego and evil."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਤੂੰ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਸੇਵਾ ਕਰੇ, ਤੇਰੀ ਆਤਮਾ ਸ਼ੁੱਧ ਹੋ ਜਾਵੇ ਅਤੇ ਤੇਰੀ ਹੰਗਤਾ ਤੇ ਬਦੀ ਦੂਰ ਹੋ ਜਾਏ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serving the True Guru, the mind becomes immaculate and pure; egotism and corruption are discarded."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸਤਿਗੁਰੋਂ ਕੋ ਸੇਵਨ ਕਰ ਅਹੰਤਾ ਮਮਤਾ ਤਥਾ ਕਾਮਾਦਿ ਬਿਕਾਰ ਸਭ ਛੋਡ ਦੀਏ, ਤਬ ਮਨੁ ਨਿਰਮਲੁ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਦੱਸੀ ਸੇਵਾ ਕਰ ਕੇ ਹਉਮੈ ਤੋਂ ਪੈਦਾ ਹੋਣ ਵਾਲੇ ਵਿਕਾਰ ਛੱਡ ਕੇ (ਮਨੁੱਖ ਦਾ) ਮਨ ਪਵਿਤ੍ਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵਿ = ਸੇਵ ਕੇ, ਸੇਵਾ ਕਰ ਕੇ। ਤਜਿ = ਤਿਆਗ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si uno sirve al Guru Verdadero, la mente se vuelve pura y uno se libera de la maldad y del ego."