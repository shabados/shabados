[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਉਰਨ ਕੀ ਸਿਖ ਲੈ ਤਬ ਜਿਉ; ਤੈਸੋ ਕਾਜ ਕਰੋ ਜਿਨਿ ਯੌ ਸੁਨਿ ਲੀਜੈ ॥"
page = 543

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Do not conclude anything on being told anything by someone else"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਸੋਧਾ ਨੇ ਕਿਹਾ) ਹੋਰਨਾਂ ਦੀ ਸਿਖਿਆ ਲੈ ਕੇ, ਤਦ (ਤੁਸੀਂ) ਅਜਿਹੇ ਕੰਮ ਕਰੋ ਜਿਨ੍ਹਾਂ ਨੂੰ ਅਸੀਂ ਸੁਣ ਸਕੀਏ।"