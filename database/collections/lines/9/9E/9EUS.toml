[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੁਗ ਛਤੀਹ; ਤਿਨੈ ਵਰਤਾਏ ॥"
page = 1026
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This way, He passed the thirty-six ages."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਉਸ ਨੇ ਛੱਤੀ ਯੁੱਗ ਬਤੀਤ ਕਰ ਦਿਤੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Thirty-six ages passed like this."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਹੁਤੇ ਜੁਗ ਇਸੀ ਪ੍ਰਕਾਰ ਤਿਸ ਨੇ ਵਰਤਾਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਘੁੱਪ ਹਨੇਰੇ ਦੇ) ਛੱਤੀ ਜੁਗ ਉਸ ਪਰਮਾਤਮਾ ਨੇ ਹੀ ਵਰਤਾਈ ਰੱਖੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਨੈ = ਤਿਨਿ ਹੀ, ਉਸ ਪਰਮਾਤਮਾ ਨੇ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así transcurrieron las treinta y seis Yugas,"