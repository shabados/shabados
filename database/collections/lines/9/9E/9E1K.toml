[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੂੜੌ ਰੂੜੌ ਆਖੀਐ ਭਾਈ; ਰੂੜੌ ਲਾਲ ਚਲੂਲੁ ॥"
page = 637
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Beauteous, beauteous in said to be the Lord. He is beautiful like the red poppy-flower."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁੰਦਰ, ਸੁੰਦਰ ਕਿਹਾ ਜਾਂਦਾ ਹੈ ਸੁਆਮੀ। ਸੂਹੇ ਪੋਸਤ ਦੇ ਫੁਲ ਵਰਗਾ ਉਹ ਸੁਨੱਖਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Beautiful, beautiful, the Lord is called, O Siblings of Destiny; beautiful, like the deep crimson color of the poppy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਵਨ ਰੂਪ! ਤੇਰੇ ਕੋ (ਰੂੜੌ ਰੂੜੌ) ਸੁੰਦਰ ਸੁੰਦਰ ਕਰ ਕੇ ਕਹੀਤਾ ਹੈ ਔਰ ਤੂੰ ਸੁੰਦਰ (ਲਾਲ) ਪ੍ਯਾਰਾ ਹੈਂ ਅਰ (ਚਲੂਲੁ) ਗੂੜੇ ਰੰਗ ਵਾਲਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਸੁੰਦਰ-ਸਰੂਪ ਹੈ, ਉਸ ਨੂੰ (ਮਾਨੋ ਪਿਆਰ ਦਾ) ਗੂੜ੍ਹਾ ਲਾਲ ਰੰਗ ਚੜ੍ਹਿਆ ਰਹਿੰਦਾ ਹੈ, ਉਸ ਸੁੰਦਰ ਪ੍ਰਭੂ ਨੂੰ ਸਦਾ ਸਿਮਰਨਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੂੜੌ = ਸੁੰਦਰ, ਸੋਹਣਾ। ਆਖੀਐ = ਸਿਮਰਨਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Muchos Te llaman Bello, y de Maravilloso Encanto, Glorioso como la flor de lirio."