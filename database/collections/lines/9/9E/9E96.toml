[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਨਾਮੁ; ਸੰਗਿ ਉਜੀਆਰਾ ॥"
page = 264
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "there the light of God's Name shall be with thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਤੇਰੇ ਨਾਲ ਚਾਨਣ ਹੋਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the Name of the Lord shall be the Light with you."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਜਮ ਮਾਰਗ ਮੇਂ ਹਰੀ ਕਾ ਨਾਮੁ ਹੀ ਤੇਰੇ ਸਾਥ ਪ੍ਰਕਾਸ ਕਰਨੇ ਹਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਓਥੇ) ਪ੍ਰਭੂ ਦਾ ਨਾਮ (ਜੀਵ ਦੇ) ਨਾਲ ਚਾਨਣ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਜੀਆਰਾ = ਚਾਨਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre te aclarará la mente."