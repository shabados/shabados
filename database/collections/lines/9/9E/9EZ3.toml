[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਬ ਮੈ; ਕਉਨੁ ਉਪਾਉ ਕਰਉ ॥"
page = 685
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What effort should I make, now."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਮੈਂ ਕਿਹੜਾ ਉਪਰਾਲਾ ਕਰਾਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Now, what efforts should I make?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਕਾਲ ਪੁਰਖ! ਅਬ ਮੈਂ ਕਉਨ ਉਪਾਵ ਕਰਉ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹੁਣ ਮੈਂ ਕੇਹੜਾ ਜਤਨ ਕਰਾਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਬ = ਹੁਣ। ਕਉਨੁ = ਕੇਹੜਾ ਜਤਨ। ਕਰਉ = ਕਰਉਂ, ਮੈਂ ਕਰਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, ¿qué puedo hacer para eliminar la duda de mi mente"