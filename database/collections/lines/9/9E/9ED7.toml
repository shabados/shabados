[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭੁ ਕਿਛੁ ਦੇ ਰਹਿਆ; ਹਰਿ ਦੇਵਣਹਾਰਾ ॥"
page = 461
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God, the Giver, continuously gives thee everything."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ, ਦਾਤਾਰ, ਤੈਨੂੰ ਸਾਰਾ ਕੁੱਝ ਦੇਈ ਜਾ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord, the Great Giver, continues to give you everything."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਦੇਨ ਹਾਰਾ ਹਰਿ ਸਭ ਕੁਛੁ ਦੇ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੈਨੂੰ ਇਹ ਗੱਲ ਭੁੱਲ ਚੁਕੀ ਹੋਈ ਹੈ ਕਿ) ਹਰੀ ਦਾਤਾਰ (ਸਭਨਾਂ ਜੀਵਾਂ ਨੂੰ) ਹਰੇਕ ਚੀਜ਼ ਦੇ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando el Señor Mismo te da todo lo que necesitas. ¿Por qué olvidas al Benévolo y Munificente Señor?"