[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੁਕਮੇ; ਸੋਗ ਹਰਖ ਆਨੰਦ ॥"
page = 962
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the Lord's will are pain, peace and pleasure."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੀ ਰਜਾ ਅੰਦਰ ਹੀ ਦੁੱਖ, ਸੁੱਖ ਅਤੇ ਖੁਸ਼ੀ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By His Hukam, they receive pain, happiness and bliss."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੁਕਮ ਕਰ ਕੇ ਹੀ ਸੋਗ ਔ (ਹਰਖ) ਉਤਸਾਹ ਔ ਅਨੰਦ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੁਕਮ ਵਿਚ ਹੀ (ਜੀਵ ਨੂੰ) ਚਿੰਤਾ ਤੇ ਖ਼ੁਸ਼ੀ ਆਨੰਦ ਵਾਪਰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਖ = ਖ਼ੁਸ਼ੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por la Voluntad del Señor los pequeños se vuelven grandes."