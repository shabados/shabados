[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਿ ਕਬੀਰ; ਤੇ ਜਨ ਪਰਵਾਨ ॥"
page = 1158
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir, approved are the persons,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ, ਪ੍ਰਮਾਣੀਕ ਹਨ ਉਹ ਪੁਰਸ਼,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, those humble beings are approved and pure,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਵਹੁ ਪੁਰਸ ਪਰਵਾਨ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ ਕਿ ਸਿਰਫ਼ ਉਹ ਮਨੁੱਖ (ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ) ਕਬੂਲ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਵਾਨ = ਕਬੂਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, sólo serán Aprobados e Inmaculados,"