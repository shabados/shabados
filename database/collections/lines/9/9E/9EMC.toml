[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋਗੀ; ਹਰਿ ਦੇਹੁ ਮਤੀ ਉਪਦੇਸੁ ॥"
page = 368
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O yogi, teach Thine intellect Divine instruction."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਯੋਗੀ! ਆਪਣੀ ਅਕਲ ਨੂੰ ਈਸ਼ਵਰੀ ਸਿਖਿਆ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Yogi, give your intellect the Teachings of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੋਗੀ! ਹਰਿ ਸਿਮਰਨ ਕੀ ਮਤਿ ਕਾ ਉਪਦੇਸ਼ ਦੇਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੋਗੀ! ਤੁਸੀ (ਆਪਣੇ ਮਨ ਨੂੰ) ਹਰਿ-ਨਾਮ ਸਿਮਰਨ ਦੀ ਅਕਲ ਸਿੱਖਿਆ ਦਿਆ ਕਰੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਤੀ = ਮਤਿ, ਅਕਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Yogui, instruye a los hombres en la Sabiduría del Señor;"