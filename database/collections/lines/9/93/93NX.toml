[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੰਡ ਮੁੰਡ ਮਾਰੇ ਦੋਊ; ਕਾਲੀ ਕੋਪਿ ਕ੍ਰਵਾਰਿ ॥"
page = 106

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Kali in great rage, struck down both Chand and Mund and killed them."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਾਲੀ ਨੇ ਕ੍ਰੋਧਿਤ ਹੋ ਕੇ ਤਲਵਾਰ ਨਾਲ ਚੰਡ ਅਤੇ ਮੁੰਡ ਦੋਹਾਂ ਨੂੰ ਮਾਰ ਦਿੱਤਾ।"