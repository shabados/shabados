[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਸੋ ਜਨੁ; ਸਦਾ ਅਰੋਗੁ ॥੨॥"
page = 282
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak that man is ever healthy."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਉਹ ਇਨਸਾਨ ਹਮੇਸ਼ਾਂ ਤੰਦਰੁਸਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- O Nanak, that person is forever healthy. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਸੋ ਜਨ ਸਦਾ ਅਰੋਗ ਰਹਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਮਨੁੱਖ ਸਦਾ ਨਿਰੋਆ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਰੋਗੁ = ਨਿਰੋਆ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "se libera de todos sus pesares. (2)"