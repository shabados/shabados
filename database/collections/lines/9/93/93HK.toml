[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਿਕਸ੍ਰਯੋ ਬ ਗੁਪਾਲ ਉਬਾਰਨ ਕੋ ॥"
page = 167

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When those foolish persons advanced to kill this student, the Lord manifested Himself at the same time in order to protect His disciple."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ (ਬੱਚੇ ਨੂੰ) ਉਬਾਰਨ ਲਈ ਗੋਪਾਲ ਪ੍ਰਗਟ ਹੋ ਗਿਆ।"