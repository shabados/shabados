data = "ਮਹਾ ਜੰਗ ਜੋਧਾ ਮਹਾ ਜਸ ਪੂਰੰ ॥੨੭॥੧੯੫॥"
page = 144

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Who was a great hero, a great warrior and greatly renowned.27.195."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੰਗ ਕਰਨ ਵਾਲਾ ਮਹਾਨ ਯੋਧਾ ਅਤੇ ਵੱਡੇ ਯਸ਼ ਵਾਲਾ ਸੀ ॥੨੭॥੧੯੫॥"