[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰਾ ਪ੍ਰਭੁ; ਸਭੁ ਕਿਛੁ ਜਾਣਦਾ ॥"
page = 72
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Master knows everything."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਮਾਲਕ ਸਭ ਕੁਝ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My God knows everything."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ (ਪ੍ਰਭੁ) ਸਮਰਥ! ਮੇਰਾ ਸਭ ਕੁਛ ਅਰਥਾਤ ਗੁਣ ਔਗੁਣ ਸਭ ਤੂੰ ਜਾਨਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਿਆਰਾ ਪ੍ਰਭੂ ਸੇਵਕ ਦੀ ਹਰੇਕ ਲੋੜ ਆਪ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y despierta en el entendimiento de que el Señor lo sabe todo."