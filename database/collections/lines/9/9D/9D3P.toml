[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧੋਤੀ ਖੋਲਿ; ਵਿਛਾਏ ਹੇਠਿ ॥"
page = 201
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Brahman opens his loin-cloth, and spreads it beneath him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਾਹਮਣ ਆਪਣੇ ਤੇੜ ਦੀ ਚਾਦਰ ਖੋਲ੍ਹ ਕੇ ਆਪਣੇ ਥਲੇ ਵਿਛਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He opens his loin-cloth, and spreads it out beneath him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਧੋਤੀ ਖੋਲਿ ਕਰ ਤੁਮ ਨੀਚੇ ਵਿਛਾਇ ਕਰ ਨਗਨ ਹੋਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ, ਹੇ ਭਾਈ! ਬ੍ਰਾਹਮਣ ਆਪਣੇ ਜਜਮਾਨਾਂ ਨੂੰ ਇਹੀ ਦੱਸਦਾ ਹੈ) ਕਿ ਬ੍ਰਾਹਮਣ ਨੂੰ ਦਿੱਤਾ ਦਾਨ ਹੀ ਮੋਖ-ਪਦਵੀ ਮਿਲਣ ਦਾ ਰਸਤਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧੋਤੀ ਖੋਲਿ = ਧੋਤੀ ਦਾ ਉਪਰਲਾ ਅੱਧਾ ਹਿੱਸਾ ਲਾਹ ਕੇ। ਹੇਠਿ = ਹੇਠ, ਭੁੰਞੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Brahmán tiende su tapete, y en cuclillas,"