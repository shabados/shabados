[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰਿ; ਏਕ ਪਿਰ ਹਾਂ ॥"
page = 409
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within my mind abides the one Beloved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਹਿਰਦੇ ਅੰਦਰ ਇੱਕ ਪ੍ਰੀਤਮ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Deep within dwells the One Husband Lord;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੇ ਮਨ ਕੇ ਅੰਤਰ ਏਕ ਪ੍ਯਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਇਕ ਪਰਮਾਤਮਾ ਦੀ ਯਾਦ ਟਿਕਾਈ ਰੱਖ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਤਰਿ = ਹਿਰਦੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el Señor habita en ti,"