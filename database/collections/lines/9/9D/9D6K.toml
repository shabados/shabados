data = "ਮਰਮ ਸਥਲ ਮਾਰਿਯੋ ਬਿਸਿਖ; ਦੀਨੋ ਤਾਹਿ ਗਿਰਾਇ ॥੧੦॥"
page = 989

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And killed him through the sharp edge ofthe arrow.(10)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਦੇ ਮਰਮ ਸਥਲ ਵਿਚ ਤੀਰ ਮਾਰ ਕੇ ਡਿਗਾ ਦਿੱਤਾ ॥੧੦॥"