[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦਿ; ਪਰਮ ਪਦੁ ਪਾਏ ॥੬॥"
page = 223
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the Guru's grace, he attains to the highest dignity."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਉਹ ਮਹਾਨ ਮਰਤਬਾ ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, the supreme status is obtained. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸਾ ਪੁਰਸ਼ ਗੁਰੋਂ ਕੀ (ਪਰਸਾਦਿ) ਕ੍ਰਿਪਾ ਕਰ ਪਰਮ ਪਦ ਕੋ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਮਨੁੱਖ ਸਭ ਤੋਂ ਉੱਚਾ ਆਤਮਕ ਦਰਜਾ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਮ ਪਦੁ = ਸਭ ਤੋਂ ਉੱਚਾ ਆਤਮਕ ਦਰਜਾ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y por la Gracia del Guru nos permite lograr el más Elevado Estado.(6)"