[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਲਸੂਨ ਕਹ ਮਾਰਿ ਕੈ ਇਹ ਦਿਸਿ ਕੀਓ ਪਿਯਾਨ ॥"
page = 64

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I came to this side after destroying alsun on my way"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਸਤੇ ਵਿਚ ਪੈਂਦੇ ਆਲਸ਼ੂਨ (ਨਾਂ ਦੇ ਪਿੰਡ) ਨੂੰ ਜਿਤ ਕੇ (ਅਸੀਂ) ਇਸ ਪਾਸੇ ਵਲ ਚਲ ਪਏ"