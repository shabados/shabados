[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤ︀ਯਾਗ ਬਿਲੰਬ ਚਲੋ ਤਿਤ ਕੋ ਤੁਮ ਕਾਨਨ ਸੋ ਰਮਨੀਯ ਨਿਹਾਰੈ ॥"
page = 970

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Abandoning this jungle, you must go there because that is much more captivating."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਿਨਾ ਦੇਰ ਕੀਤੇ ਤੁਸੀਂ ਉਥੇ ਚਲੋ, (ਉਹ ਇਸ) ਬਨ ਤੋਂ ਜ਼ਿਆਦਾ ਸੁੰਦਰ ਦਿਸਦਾ ਹੈ।"