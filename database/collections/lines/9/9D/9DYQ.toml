[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੋਵੈ ਰਾਮੁ; ਨਿਕਾਲਾ ਭਇਆ ॥"
page = 953
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rama wept when he was exiled,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਰਾਮਚੰਦਰ ਰੋਇਆ ਸੀ ਜਦੋਂ ਉਸ ਨੂੰ ਦੇਸ਼ ਨਿਕਾਲਾ ਮਿਲਿਆ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Rama wept when he was sent into exile,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਰਾਮ ਜੀ ਕੋ ਸਹਿਰ ਅਜੁਧ੍ਯਾ ਤੇ ਬਨ ਕੋ ਨਿਕਾਲਾ ਭਇਆ, ਭਾਵ ਬਨ ਕੋ ਚਲੇ ਗਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਮ ਜੀ ਭੀ ਰੋਏ, ਜਦੋਂ ਰਾਮ (ਜੀ) ਨੂੰ ਦੇਸ-ਨਿਕਾਲਾ ਮਿਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਕਾਲਾ = ਦੇਸ-ਨਿਕਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rama también se lamentó, cuando fue desterrado,"