[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹ ਮਹਾ ਭਇਆਨ; ਦੂਤ ਜਮ ਦਲੈ ॥"
page = 264
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Where the very terrible myrmidon of Death, shall crush thee,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਮੌਤ ਦਾ ਬਹੁਤ ਹੀ ਡਰਾਉਣਾ ਫ਼ਰਿਸ਼ਤਾ ਤੈਨੂੰ ਦਰੜੇਗਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Where the great and terrible Messenger of Death shall try to crush you,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਹਾਂ ਮਹਾਂ ਭ੍ਯਾਨਕ ਜਮ ਕੇ ਦੂਤ ਤੁਝ ਕੌ ਦਲੈਂਗੇ, ਭਾਵ ਦੁਖ ਦੇਵੇਂਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਵੱਡੇ ਡਰਾਉਣੇ ਜਮਦੂਤਾਂ ਦਾ ਦਲ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਹਾ = ਵੱਡਾ। ਭਇਆਨ = ਭਿਆਨਕ, ਡਰਾਉਣਾ। ਦੂਤ ਜਮ = ਜਮਦੂਤ। ਦੂਤ ਜਮ ਦਲੈ = ਜਮਦੂਤਾਂ ਦਾ ਦਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando cruces el desierto, perseguido por los emisarios de la muerte,"