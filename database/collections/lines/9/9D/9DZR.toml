[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਸਬਦੁ ਸੇਵੇ. ਸਚਿ ਸਮਾਵੈ; ਵਿਚਹੁ ਹਉਮੈ ਮਾਰੇ ॥"
page = 244
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "She who meditates on the great Name and sheds self-conceit from within merges into the True One."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਵਿਸ਼ਾਲ ਨਾਮ ਨੂੰ ਸਿਮਰਦੀ ਹੈ ਅਤੇ ਆਪਣੇ ਅੰਦਰੋਂ ਸਵੈ-ਹੰਗਤਾ ਨੂੰ ਦੂਰ ਕਰ ਦਿੰਦੀ ਹੈ, ਉਹ ਸਤਿਪੁਰਖ ਅੰਦਰ ਲੀਨ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who serves the Word of the Guru's Shabad is absorbed in the True Lord; she eradicates egotism from within."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ (ਸਬਦੁ) ਉਪਦੇਸ ਕੋ ਸੇਵੇ ਅਰਥਾਤ ਕਮਾਵੇ, ਅਰੁ ਰਿਦੇ ਮੇਂ ਹਉਮੈ ਕੋ ਮਾਰੇ ਤਬ ਸਚ ਸਰੂਪ ਮੇਂ ਸਮਾਵਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਜੀਵ-ਇਸਤ੍ਰੀ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਨੂੰ ਸੰਭਾਲਦੀ ਹੈ, ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਵਿਚ ਲੀਨ ਹੋ ਜਾਂਦੀ ਹੈ ਤੇ ਆਪਣੇ ਅੰਦਰੋਂ ਹਉਮੈ ਨੂੰ ਮਾਰ ਮੁਕਾਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚਿ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Habitando en la Palabra del Guru e inmergiéndose en la Verdad aquieta su ego en la mente."