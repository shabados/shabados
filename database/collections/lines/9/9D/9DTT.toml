data = "ਜਦ ਤੋਣ ਉਸ ਦਾ ਪੱਲਾ ਫੜਿਆ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਤਾ ਬਦਾਮਨ ਦਸਤਿ ਖ਼ੁਦ ਅਫ਼ਗੰਦਾ ਏਮ ॥੫੭॥੬॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "They, themselves, are elevated, mature and blessed; anyone who happens to  be bestowed with their company;"