[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਦਇਆ; ਪਤਿਤ ਉਧਾਰਿ ॥"
page = 838
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "mercifully save Thou the sinners."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿਹਰ ਧਾਰ ਕੇ ਤੂੰ ਪਾਪੀਆਂ ਦਾ ਪਾਰ ਉਤਾਰਾ ਕਰ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "be merciful, and save the sinners."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦਯਾ ਕਰ ਕੇ ਮੈਂ (ਪਤਿਤ) ਪਾਪੀ ਕਾ ਉਧਾਰ ਕਰ ਲੇਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਿਹਰ ਕਰ ਕੇ (ਮੈਨੂੰ) ਵਿਕਾਰੀ ਨੂੰ (ਵਿਕਾਰਾਂ ਤੋਂ) ਬਚਾ ਲੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ। ਪਤਿਤ = ਵਿਕਾਰੀ। ਉਧਾਰਿ = ਬਚਾ ਲੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en Tu Misericordia emancípame;  soy un ser malvado."