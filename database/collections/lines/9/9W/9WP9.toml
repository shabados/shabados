[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਹੁਰਿ ਬਹੁਰਿ; ਉਆਹੂ ਲਪਟੇਰਾ ॥"
page = 180
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Again and again he clings to that"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁੜ ਮੁੜ ਕੇ ਉਹ ਉਸ ਨਾਲ ਚਿਮੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Again and again, he clings to it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਾਂ ਤੇ ਵਾਰੰਵਾਰ ਉਸੀ ਸੰਗ ਲੰਪਟ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੁੜ ਮੁੜ ਇਸ ਸਰੀਰ ਨਾਲ ਹੀ ਚੰਬੜਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਹੁਰਿ ਬਹੁਰਿ = ਮੁੜ ਮੁੜ। ਉਆ ਹੂ = ਉਸ (ਤਨ) ਨਾਲ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y se aferra a él con total necedad."