data = "ਉਤਰਤ ਚੜੇ ਦਿਵਸ ਕੇ ਭਯੋ ॥"
page = 994

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He kept on travelling whole night and when day broke he dismounted."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਦਿਨ ਦੇ ਚੜ੍ਹਨ ਤੇ ਉਤਰਿਆ।"