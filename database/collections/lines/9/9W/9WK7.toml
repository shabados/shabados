[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਕਰਤਾ ਦੇਵੈ ਸੋਇ ॥"
page = 1129
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When, He the Creator-Lord, Himself gives,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਹ ਸਿਰਜਣਹਾਰ ਸੁਆਮੀ ਆਪ ਦਿੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Creator Himself gives,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ (ਕਰਤਾ) ਵਾਹਗੁਰੂ ਜਿਸ ਕੋ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਕਰਤਾਰ ਆਪ ਹੀ (ਨਾਮ ਦੀ ਦਾਤਿ) ਦੇਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੇ = ਆਪ ਹੀ। ਸੋਇ ਕਰਤਾ = ਉਹ ਕਰਤਾਰ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero cuando Dios, por Sí Mismo nos bendice, entonces,"