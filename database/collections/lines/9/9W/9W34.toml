[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੈ ਨਾਮਿ; ਸਦਾ ਲਿਵ ਲਾਗੀ ॥"
page = 1044
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "they ever remain absorbed in the love of the True Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦੀਵ ਹੀ ਸਤਿਨਾਮ ਦੀ ਪ੍ਰੀਤ ਅੰਦਰ ਲੀਨ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They remain lovingly focused on the True Name forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੀ ਸਚੇ ਨਾਮ ਮੇਂ ਲਿਵ ਲਾਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਵਿਚ ਉਹਨਾਂ ਦੀ ਸੁਰਤ ਸਦਾ ਜੁੜੀ ਰਹਿੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਮਿ = ਨਾਮ ਵਿਚ। ਸਾਚੈ ਨਾਮਿ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਵਿਚ। ਲਿਵ = ਲਗਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "viven siempre entonados en Dios a través de Su Nombre."