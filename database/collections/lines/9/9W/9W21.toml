[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਤ ਕਤ ਪੇਖਉ; ਤਤ ਤਤ ਸਾਥੈ ॥"
page = 535
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wherever I look, thither I find Him with me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਕਿਤੇ ਭੀ ਮੈਂ ਵੇਖਦਾ ਹਾਂ, ਉਥੇ ਮੈਂ ਉਸ ਨੂੰ ਆਪਣੇ ਨਾਲ ਪਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wherever I look, there, I find Him with me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਤੇ ਜਹਾਂ ਕਹਾਂ ਦੇਖਤਾ ਹੂੰ ਤਹਾਂ ਤਹਾਂ ਪਰਮੇਸ੍ਵਰ ਮੇਰੇ ਸਾਥ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਜਿਧਰ ਵੇਖਦਾ ਹਾਂ ਉਧਰ ਹੀ ਪਰਮਾਤਮਾ ਮੈਨੂੰ ਆਪਣੇ ਨਾਲ ਵੱਸਦਾ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਤ ਕਤ = ਜਿੱਥੇ ਕਿੱਥੇ। ਪੇਖਉ = ਪੇਖਉਂ, ਮੈਂ ਵੇਖਦਾ ਹਾਂ। ਤਤ ਤਤ = ਉੱਥੇ ਉੱਥੇ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo veo siempre en mi compañía y Sus Pies de Loto"