[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਵਣਜਹਿ; ਕੇਈ ਕੇਇ ॥"
page = 126
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rare is the person who buys this merchandise through the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਟਾਵਾਂ ਪੁਰਸ਼ ਹੀ ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਇਸ ਮਾਲ ਨੂੰ ਖਰੀਦਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Rare is that Gurmukh who trades in this."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਕੋਈ ਗੁਰਮੁਖ ਹੀ ਵਣਜਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਅਨੇਕਾਂ (ਵਡ-ਭਾਗੀ) ਮਨੁੱਖ ਨਾਮ-ਵੱਖਰ ਦਾ ਸੌਦਾ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੇਈ ਕੇਇ = ਕਈ ਅਨੇਕਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero extraordinario es aquél que hace sus tratos con Él, por la Gracia del Guru."