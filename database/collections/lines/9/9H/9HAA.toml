[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੈ ਹੁਕਮੇ; ਸਾਵਣੁ ਆਇਆ ॥"
page = 73
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Thine order the month of Sawan has come."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਫੁਰਮਾਨ ਦੁਆਰਾ ਸਉਣ ਦਾ ਮਹੀਨਾ ਆਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Your Command, the month of Saawan has come."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਭਾਣੇ ਕਰ ਕੇ ਮਾਨਸ ਜਨਮ, ਵਾ ਪ੍ਰੇਮ ਰੂਪੀ ਸਾਵਣੁ ਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਤੇਰੇ ਹੁਕਮ ਵਿਚ ਹੀ (ਗੁਰੂ ਦਾ ਮਿਲਾਪ ਹੋਇਆ, ਮਾਨੋ, ਮੇਰੇ ਵਾਸਤੇ) ਸਾਵਣ ਦਾ ਮਹੀਨਾ ਆ ਗਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੁਕਮੈ = ਹੁਕਮ ਵਿਚ। ਸਾਵਣੁ = ਨਾਮ-ਵਰਖਾ ਕਰਨ ਵਾਲਾ ਗੁਰੂ-ਮਿਲਾਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Tu Voluntad, oh Señor, vino Savan, el mes de las lluvias."