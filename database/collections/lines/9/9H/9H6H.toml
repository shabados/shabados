[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਣ ਰੇਣੁ; ਗੁਰ ਕੀ ਮੁਖਿ ਲਾਗੀ ॥"
page = 187
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The dust of Guru's feet has daubed my face,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਚਰਨਾ ਦੀ ਖ਼ਾਕ ਮੇਰੇ ਚਿਹਰੇ ਨੂੰ ਲਗ ਗਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have applied the dust of the Guru's Feet to my face,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮੁਖ ਪਰ ਗੁਰੋਂ ਕੀ ਚਰਨ ਧੂੜ ਲਾਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਮੱਥੇ ਉਤੇ ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ਲੱਗ ਗਈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇਣੁ = ਧੂੜਿ। ਮੁਖਿ = ਮੂੰਹ ਉਤੇ, ਮੱਥੇ ਉਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me froto el Polvo de los Pies del Guru en mi frente,"