[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਬਿਨੁ; ਨਾਹਿ ਕੋਇ ਹਾਂ ॥"
page = 410
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "without him, there is not another."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਬਗੈਰ ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without Him, there is not any other."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਤਿਸ ਪਰਮੇਸਰ ਤੇ ਬਿਨਾਂ ਤੇਰਾ ਦੂਸਰਾ ਕੋਈ ਸਹਾਇਕ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰਮਾਤਮਾ ਤੋਂ ਬਿਨਾ ਹੋਰ ਕੋਈ (ਅਸਲ ਸੱਜਣ ਮਿੱਤਰ) ਨਹੀਂ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque sin Ti, no hay nadie más a quien recurrir."