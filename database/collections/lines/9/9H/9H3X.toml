data = "ਨਹੀ ਤਦਪਿ ਤਾਸ, ਪਾਯਤ ਨ ਅੰਤ ॥"
page = 30

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Still they cannot know the Lord’s end!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਵੀ ਉਸ (ਪ੍ਰਭੂ) ਦਾ ਅੰਤ ਨਹੀਂ ਪਾ ਸਕਦੇ।"