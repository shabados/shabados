[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਿ ਸਿਮਰਿ ਨਾਮੁ; ਬਾਰੰ ਬਾਰ ॥"
page = 295
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remember, remember the Name over and over again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁੜ ਮੁੜ ਕੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਤੇ ਆਰਾਧਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate, meditate in remembrance on the Naam, again and again."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਤਿਸ ਕੇ ਨਾਮ ਕੌ ਜੋ ਵਾਰੰਵਾਰ ਸਿਮਰਨ ਕਰਨਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਨਾਮ ਮੁੜ ਮੁੜ ਯਾਦ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Medita, medita en el Naam, una y otra vez,"