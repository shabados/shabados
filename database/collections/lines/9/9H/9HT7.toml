[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੈਵਰ ਗੈਵਰ; ਰਾਜ ਰੰਗ ॥"
page = 210
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Leaving behind all his horses, elephants and the pomp of empire,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਘੋੜਿਆਂ, ਹਾਥੀਆਂ ਅਤੇ ਪਾਤਸ਼ਾਹੀ ਠਾਠ ਬਾਠ ਨੂੰ ਛਡ ਕੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Horses, elephants and the pleasures of power"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁੰਦ੍ਰ (ਹੈ) ਘੋੜੇ ਪੁਨਾ ਸ੍ਰੇਸਟ (ਗੈ) ਹਾਥੀ ਔਰ ਰਾਜ ਕਾ (ਰੰਗ) ਅਨੰਦ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਵਧੀਆ ਘੋੜੇ, ਵਧੀਆ ਹਾਥੀ ਤੇ ਹਕੂਮਤ ਦੀਆਂ ਮੌਜਾਂ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੈਵਰ = {हय-वर} ਵਧੀਆ ਘੋੜੇ। ਗੈਵਰ {गज-वर} ਵਧੀਆ ਹਾਥੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "También sus territorios, sus caballos y sus elefantes finos,"