language = "pa"
data = "ਉਹ ਆਪਣਾ ਕਾਰ ਵਿਹਾਰ ਕਰਦੇ ਹੋਏ ਵੀ ਕਿਰਤ ਤੋਂ ਆਜ਼ਾਦ ਹਨ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਦਰ ਕਸਬ ਬਾਸ਼ੰਦ ਆਜ਼ਾਦ ਅਜ਼ ਕਸਬ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, admired him with every possible virtue and goodness. (6)"