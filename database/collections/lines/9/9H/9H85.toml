[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੁਨਿ ਜਨ ਸੇਖ; ਨ ਲਹਹਿ ਭੇਵ ॥"
page = 1181
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "whose mystery the silent sages and Sheikhs can know not;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਭੇਤ ਨੂੰ ਖਾਮੋਸ਼ ਰਿਸ਼ੀ ਤੇ ਸ਼ੇਖ ਜਾਣ ਨਹੀਂ ਸਕਦੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The silent sages, the humble, and the religious teachers do not understand His mystery."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੁਨੀ ਜਨ ਔਰ ਸੇਖ ਸਭੀ ਤੇਰੇ ਭੇਦ ਕੋ ਨਹੀਂ ਲਖ ਸਕਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਭੇਤ ਮੁਨੀ ਲੋਕ ਅਤੇ ਸ਼ੇਸ਼-ਨਾਗ ਭੀ ਨਹੀਂ ਪਾ ਸਕਦੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਖ = ਸ਼ੇਸ਼ ਨਾਗ। ਨ ਲਹਹਿ = ਨਹੀਂ ਲੱਭ ਸਕਦੇ {ਬਹੁ-ਵਚਨ}। ਭੇਵ = ਭੇਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Cuyo Misterio no le es revelado siquiera a los que viven en constante silencio,"