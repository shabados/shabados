[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਿੰਤਾ. ਮੂਲਿ ਨ ਹੋਵਈ; ਅਚਿੰਤੁ ਵਸੈ ਮਨਿ ਆਇ ॥"
page = 587
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Anxiety visits him not at all and the care free Lord comes to abide in his mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਉਕਾ ਹੀ ਫਿਰਕ ਅੰਦੇਸਾ, ਨਹੀਂ ਹੁੰਦਾ ਅਤੇ ਫਿਕਰ-ਰਹਿਤ ਸਾਹਿਬ ਉਸ ਦੇ ਚਿੱਤ ਵਿੱਚ ਆ ਟਿਕਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is not troubled by anxiety, and the carefree Lord comes to dwell in the mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਚਿੰਤਾ ਕਦੇ ਨਹੀਂ ਹੋਤੀ ਅਰ (ਅਚਿੰਤ) ਵਾਹਿਗੁਰੂ ਤਿਨ ਕੇ ਮਨ ਮੇਂ ਆਇ ਬਸਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਚਿੰਤਾ ਉੱਕਾ ਹੀ ਨਹੀਂ ਰਹਿੰਦੀ (ਕਿਉਂਕਿ) ਚਿੰਤਾ ਤੋਂ ਰਹਿਤ ਪ੍ਰਭੂ ਮਨ ਵਿਚ ਆ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Intrépido Señor viene a habitar en su mente desplazando todos sus temores."