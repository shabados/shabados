[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੇਟੀਅਲੇ; ਰਾਇ ਨਿਸੰਗਾ ॥੨॥"
page = 972
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and I have dauntlessly met my God, the king"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੈਂ ਨਿਧੜਕ ਹੀ ਆਪਣੇ ਵਾਹਿਗੁਰੂ ਪਾਤਿਸ਼ਾਹ ਨੂੰ ਮਿਲ ਪਿਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and I have met my Sovereign Lord King without fear. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੌ ਪ੍ਰਮੇਸਰ ਰਾਜਾ ਨਿਸੰਗ ਹੀ ਮਿਲ ਗਿਆ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਨਿਸੰਗ ਹੋ ਕੇ ਹੁਣ ਇਹ ਪ੍ਰਭੂ ਨੂੰ ਮਿਲ ਪਿਆ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੇਟੀਅਲੇ = ਮਿਲ ਪੈਂਦਾ ਹੈ। ਰਾਇ = ਰਾਜਾ ਪ੍ਰਭੂ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y quitándome de preocupaciones, puedo encontrar a mi Dios, el Rey.(2)"