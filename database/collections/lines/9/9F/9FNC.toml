[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਜ ਤੇਜ ਅਛਿਜ ਗਾਤਿ; ਅਭਿਜ ਰੂਪ ਦੁਰੰਤ ॥"
page = 697

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Their brilliance is like lightning, their body is imperishable and their figures are horrible"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਨ੍ਹਾਂ ਦਾ) ਬਿਜਲੀ ਵਰਗਾ ਤੇਜ ਹੈ, ਨਾ ਛਿਜਣ ਵਾਲਾ ਸ਼ਰੀਰ ਹੈ ਅਤੇ ਨਾ ਭਿਜਣ ਵਾਲਾ ਡਰਾਉਣਾ ਰੂਪ ਹੈ।"