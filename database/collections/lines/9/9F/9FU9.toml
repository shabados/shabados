[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਰਾਮੁ ਜਾਨਿਆ; ਤਿਨਹਿ ਪਛਾਨਿਆ ॥"
page = 327
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who knows the Lord, realises His relish."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੁਆਮੀ ਨੂੰ ਸਮਝਦਾ ਹੈ, ਉਹੀ ਉਸ ਦੇ ਸੁਆਦ ਨੂੰ ਅਨੁਭਵ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Only one who knows the Lord realizes Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਰਾਮ ਕੋ ਜਾਨਿਆ ਹੈ ਬ੍ਰਹਮ ਪਰਾਪਤੀ ਕਾ ਅਨੰਦ ਤਿਸੀ ਨੇ ਪਛਾਨਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਜਿਸ ਮਨੁੱਖ ਨੇ ਪ੍ਰਭੂ ਨੂੰ (ਆਪਣੇ ਅੰਦਰ) ਜਾਣਿਆ ਹੈ ਉਸ ਨੇ ਹੀ ਉਸ ਨੂੰ ਪਛਾਣਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ ਮਨੁੱਖ ਨੇ। ਤਿਨਹਿ = ਉਸੇ (ਮਨੁੱਖ) ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y se inmerge en la Melodía Inefable de la Palabra."