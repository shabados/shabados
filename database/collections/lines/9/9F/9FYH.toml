[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਗੁਣ ਗਾਵਹਿ; ਸਹਜਿ ਸੁਭਾਏ ॥੩॥"
page = 231
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's praise they automatically laud."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦਾ ਜੱਸ ਉਹ ਸੁਭਾਵਕ ਹੀ ਗਾਇਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They sing the Glorious Praises of the Lord, in the poise of celestial peace. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਂਤੀ ਸੁਭਾਵ ਸੇ ਹਰੀ ਕੇ ਗੁਨੋਂ ਕੋ ਗਾਵਤੇ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਪ੍ਰੇਮ ਵਿਚ ਜੁੜ ਕੇ ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਗਾਂਦੇ ਹਨ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਾਵਹਿ = ਗਾਂਦੇ ਹਨ। ਸੁਭਾਏ = ਸੁਭਾਇ, ਪ੍ਰੇਮ ਨਾਲ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y nosotros cantamos las Alabanzas del Señor de forma espontánea.(3)"