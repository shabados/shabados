[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਡਭਾਗੀ ਤੇ ਜਨ; ਜਗ ਮਾਹਿ ॥"
page = 281
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Very fortunate are those persons in the world,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੁਰਸ਼ ਇਸ ਜਹਾਨ ਅੰਦਰ ਭਾਰੇ ਨਸੀਬਾਂ ਵਾਲੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Very fortunate are those humble beings in this world,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਜਨ ਇਸ ਜਗਤ ਮੇਂ ਵਡਿਭਾਗੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਜਗਤ ਵਿਚ ਵੱਡੇ ਭਾਗਾਂ ਵਾਲੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ ਜਨ = ਉਹ ਬੰਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Benditos en este mundo son aquéllos que cantan Sus Alabanzas."