[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਕ੍ਰਿਪਾ ਕਰੇ ਸੁਖਦਾਤਾ; ਗੁਰਮੁਖਿ ਅੰਮ੍ਰਿਤੁ ਪੀਵਾਂ ॥"
page = 573
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If the Peace-giving Lord Master shows mercy, I drink-in His Nectar, through the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਆਰਾਮ ਬਖਸ਼ਣਹਾਰ ਸੁਆਮੀ ਮਾਲਕ ਮਿਹਰ ਧਾਰੇ ਤਾਂ ਮੈਂ ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਉਸ ਦਾ ਅੰਮ੍ਰਿਤ ਪਾਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord, Har, Har, the Giver of peace, shows His Mercy, and the Gurmukh drinks in the Ambrosial Nectar."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਖਦਾਤਾ ਹਰਿ ਜਬ ਤੂੰ ਗੁਰੋਂ ਦੁਆਰਾ ਕਿਰਪਾ ਕਰੈ ਤਬ ਮੈਂ ਨਾਮ ਅੰਮ੍ਰਿਤ ਕੋ ਪਾਨ ਕਰੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੁਖਾਂ ਦੇ ਦੇਣ ਵਾਲਾ ਪ੍ਰਭੂ ਜੇ ਮੇਹਰ ਕਰੇ, ਤਾਂ ਹੀ ਮੈਂ ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿ ਕੇ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ ਪੀ ਸਕਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੋ ਕੇ। ਅੰਮ੍ਰਿਤੁ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando el Señor, Dador de Éxtasis, muestra su Compasión, pruebo el Néctar a través del Guru."