[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਉ ਪ੍ਰਾਣ; ਜਿਨਿ ਮਨੁ ਤਨੁ ਧਾਰਿਆ ॥"
page = 195
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who has created his soul, very life mind and body,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਉਸ ਦੀ ਆਤਮਾ, ਜਿੰਦ ਜਾਨ ਮਨੂਆ ਅਤੇ ਸਰੀਰ ਸਾਜੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Within their minds, they have forgotten that Lord and Master,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੀਉ ਪ੍ਰਾਣ ਔਰ ਸਰੀਰ ਤਥਾ ਮਨ ਜਿਸ ਨੇ ਧਾਰਿਆ ਹੈ ਅਰਥਾਤ ਰਚ੍ਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਪਰਮਾਤਮਾ ਨੇ ਜੀਵ ਦੀ ਜਿੰਦ ਨੂੰ ਮਨ ਨੂੰ ਸਰੀਰ ਨੂੰ (ਆਪਣੀ ਜੋਤਿ ਦਾ) ਸਹਾਰਾ ਦਿੱਤਾ ਹੋਇਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਪ੍ਰਭੂ) ਨੇ। ਧਾਰਿਆ = (ਆਪਣੀ ਜੋਤਿ ਨਾਲ) ਸਹਾਰਾ ਦਿੱਤਾ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En sus mentes se han olvidado del Señor Maestro,"