[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜੀਵਦਿਆਂ ਮਰਿ ਅਮਰੁ ਹੋਇ; ਸੁਖ ਸਹਜਿ ਸਮੋਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He is dead while being alive i.e. he turns his face from evil propensities."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੀਉੁਂਦਿਆਂ ਹੀ ਮਰਕੇ ਫੇਰ ਅਮਰ ਹੋ ਹੋ ਕੇ ਸਹਿਜ ਸੁਖ ਵਿਖੇ ਸਮਾ ਜਾਂਦੇ ਹਨ।"