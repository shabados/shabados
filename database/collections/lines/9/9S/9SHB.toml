[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਪਰਸਾਦਿ; ਨਵੈ ਨਿਧਿ ਪਾਈ ॥"
page = 177
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose grace I have found the nine treasures."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਦਇਆ ਦੁਆਰਾ ਮੈਨੂੰ ਨੋ ਖਜ਼ਾਨੇ ਪ੍ਰਾਪਤ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "by His Grace, I have obtained the nine treasures."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਿਸ ਕੀ ਕਿਰਪਾ ਸੇ ਨੌ ਨਿਧੀਆਂ ਪਾਈਤੀਆਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਪ੍ਰਭੂ) ਦੀ ਕਿਰਪਾ ਨਾਲ ਮੈਂ (ਧਰਤੀ ਦੇ ਸਾਰੇ) ਨੌ ਹੀ ਖ਼ਜ਼ਾਨੇ ਹਾਸਲ ਕਰ ਰਿਹਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਸਾਦਿ = ਕਿਰਪਾ ਨਾਲ। ਨਵੈ ਨਿਧਿ = ਨੌ ਹੀ ਖ਼ਜ਼ਾਨੇ। ਪਾਈ = ਪਾਈਂ, ਮੈਂ ਹਾਸਲ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Él, Quien por Su Gracia me bendijo con los Nueve Tesoros."