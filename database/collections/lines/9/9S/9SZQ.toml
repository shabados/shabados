data = "ਅਤੇ ਉਸ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪਤੀ ਦੀ ਬਹੁਤ ਅਧਿਕ ਆਸ (ਭਰੋਸਾ) ਸੀ ॥੪੫੧॥"