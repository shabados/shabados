[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਤਿ ਨਾਮੁ ਬਿਨੁ; ਬਾਦਰਿ ਛਾਈ ॥੪੩॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "But without the true Name, these all (powers) are momentary like the Shadow of the clouds."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਫੇਰ ਬੀ) ਸਤਿਨਾਮ ਤੋਂ ਬਿਨਾ (ਇਹ ਸਭ ਕੁਛ) ਬੱਦਲ ਦੀ ਛਾਂ ਹੈ।"