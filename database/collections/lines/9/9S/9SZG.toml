[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਭਸਮ ਲਾਇ ਜੇ ਪਾਈਐ; ਖਰੁ ਖੇਹ ਨਿਵਾਸੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "If it is attained by smearing ashes on body, the ass always rolls in dust."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੇ ਭਬੂਤ (ਸੁਆਹ) ਲਾਇਆਂ ਮਿਲਦੀ ਹੈ ਤਾਂ ਖੋਤਾ ਖੇਹ ਵਿਚ ਹੀ ਲੇਟਦਾ ਹੈ।"