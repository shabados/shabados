[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੀ ਕੋਇ; ਨ ਮੇਟੈ ਦਾਤਿ ॥੧॥"
page = 864
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "No one can hold-back his beneficence."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਬਖਸ਼ਿਸ਼ ਨੂੰ ਕੋਈ ਭੀ ਰੋਕ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one can decrease His bounty. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਗੁਰੋਂ ਕੀ ਨਾਮੁ ਦਾਤ ਦਈ ਹੂਈ ਕੋ ਕੋਈ ਨਹੀਂ ਮੇਟ ਸਕਤਾ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਗੁਰੂ ਦੀ ਬਖ਼ਸ਼ੀ ਹੋਈ ਆਤਮਕ ਜੀਵਨ ਦੀ ਦਾਤ ਨੂੰ ਕੋਈ ਮਿਟਾ ਨਹੀਂ ਸਕਦਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਾਤਿ = ਨਾਮ ਦੀ ਦਾਤ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su Bondad nadie La puede resistir. (1)"