[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਕੀਮਤਿ, ਜਾਣੈ ਕੋਇ ॥"
page = 361
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru, a few know Lord's worth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ, ਬਹੁਤ ਹੀ ਥੋੜੇ ਸਾਈਂ ਦੇ ਮੁੱਲ ਨੂੰ ਜਾਣਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Few are the Gurmukhs who know His worth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖ ਧਰਮ ਕੋ ਅੰਗੀਕਾਰ ਕਰ ਕੇ ਕੋਈ ਉਸ ਕੇ ਭੇਦ ਕੋ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਵਿਰਲਾ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦੀ ਕਦਰ ਸਮਝਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pocos son lo Gurmukhs que, a través del Guru, conocen Su Valor;"