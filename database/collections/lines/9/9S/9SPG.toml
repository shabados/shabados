[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਰਤਨ ਪਦਾਰਥ ਗੁਰ ਸਬਦੁ; ਕਰਿ ਕੀਰਤਨੁ ਖਾਹੁ ॥੧੪॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Who in the form of kirtan, singing of the holy hymns, eat the pearls of the Word of the Guru."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਰਤਨ ਪਦਾਰਥ ਹਨ, (ਏਹ ਹੰਸ) ਕੀਰਤਨ ਕਰਦੇ (ਉਸ ਨੂੰ)ਖਾਂਦੇ ਹਨ।"