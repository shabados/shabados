[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੁਹੀ ਬਿਪ੍ਰ ਚਿੰਤਾਨ ਹੂੰ ਕੋ ਚਬੈ ਹੈ ॥"
page = 810

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Destroy the apprehension of the Brahmins."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਬ੍ਰਾਹਮਣਾਂ ਦੀਆਂ ਚਿੰਤਾਵਾਂ ਨੂੰ ਚਬਣ ਵਾਲੀ ਹੈਂ।"