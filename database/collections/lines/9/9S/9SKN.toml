[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਵੇਖਾਲੇ ਸੋ ਵੇਖੈ; ਜਿਸੁ ਵਸਿਆ ਮਨ ਮਾਹਿ ॥੧॥"
page = 947
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone, in whose mind the Lord abides and to whom He shows, beholds Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਜਿਸ ਦੇ ਹਿਰਦੇ ਵਿੱਚ ਸੁਆਮੀ ਵਸਦਾ ਹੈ ਅਤੇ ਜਿਸ ਨੂੰ ਉਹ ਵਿਖਾਲਦਾ ਹੈ, ਉਸ ਨੂੰ ਦੇਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone sees, whom the Lord causes to see; the Lord comes to dwell in his mind. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਗੁਰੂ ਦਿਖਾਵਤੇ ਹੈਂ, ਸੋ ਦੇਖਤਾ ਹੈ॥☬ਪ੍ਰਸ਼ਨ: ਗੁਰੂ ਕਿਸਕੋ ਦਿਖਾਵਤੇ ਹੈਂ?☬ਉੱਤਰ: ਜਿਸ ਕੇ ਮਨ ਮੇਂ ਗੁਰ ਉਪਦੇਸ਼ ਵਸਿਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਗੱਲ) ਉਹੀ ਮਨੁੱਖ ਵੇਖ ਸਕਦਾ ਹੈ ਜਿਸ ਨੂੰ ਪ੍ਰਭੂ ਆਪ ਵੇਖਣ ਦੀ ਜਾਚ ਸਿਖਾਏ, ਜਿਸ ਦੇ ਮਨ ਵਿਚ ਪ੍ਰਭੂ ਆਪ ਆ ਵੱਸੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues sólo puede ver, en verdad, aquél a quien Dios le permite ver cuando llega a habitar en la mente. (1)"