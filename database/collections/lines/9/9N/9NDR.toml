[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੁੰਤੀ ਸੁਤ ਪਾਇਨ ਲਪਟਾਏ ॥"
page = 531

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The whole army, fully embellished, reached Delhi, where the sons of Kunti clung to the feet of Krishna"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕੁੰਤੀ ਦੇ ਪੁੱਤਰ (ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਦੇ) ਪੈਰਾਂ ਨਾਲ ਲਿਪਟ ਗਏ।"