[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦਾ ਸਦਾ; ਤਿਸ ਕਉ ਨਮਸਕਾਰੁ ॥"
page = 280
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever and ever, I bow unto Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਮੇਸ਼ਾਂ ਤੇ ਹਮੇਸ਼ਾਂ ਮੈਂ ਉਸ ਨੂੰ ਪ੍ਰਣਾਮ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forever and ever, I bow to Him in reverence."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਸਮੇਂ ਮੇਂ ਮਨ ਬਾਣੀ ਸੇ ਤਿਸ ਕੌ ਨਮਸਕਾਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਉਸ ਪ੍ਰਭੂ ਅੱਗੇ ਸਿਰ ਨਿਵਾਓ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien los ha formado y moldeado;"