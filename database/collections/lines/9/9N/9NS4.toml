data = "ਤੁਹੀ ਬਾਲਕਾ ਬ੍ਰਿਧਣੀ ਅਉ ਜੁਆ ਹੈ ॥"
page = 336

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art the three ages of life i.e. childhood, youth and old age"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਬਿਰਧ, ਜਵਾਨ ਅਤੇ ਬਾਲਕ ਅਵਸਥਾ ਹੈਂ।"