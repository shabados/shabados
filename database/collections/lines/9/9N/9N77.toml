[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਗਾਡੀ ਰਾਹੁ, ਸਚੁ ਨਿਬਾਹੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "For gurmukhs only the beautiful highway of truth has been prepared."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾ ਦਾ ਰਸਤਾ ਗਾਡੀ ਰਾਹ ਹੈ (ਖਤਰਨਾਕ ਨਹੀਂ ਹੈ) ਸੱਚ ਨੂੰ ਪਹੁੰਚਾ ਦੇਂਦਾ ਹੈ।"