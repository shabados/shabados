[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਜਾਪੈ; ਤਿਸ ਕੀ ਗਤਿ ਹੋਇ ॥੩॥"
page = 1150
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "whosoever remembers Him, is emancipated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੋਈ ਭੀ ਉਸ ਨੂੰ ਸਿਮਰਦਾ ਹੈ ਉਹ ਮੁਕਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whoever meditates on Him is emancipated. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪਰਮੇਸ੍ਵਰ ਕੇ ਨਾਮ ਕੋ ਜਪਤਾ ਹੈ ਤਿਸ ਕੀ ਮੋਖ ਹੋ ਜਾਤੀ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਭੀ ਮਨੁੱਖ ਨਾਮ ਜਪਦਾ ਹੈ ਉਸ ਦੀ ਆਤਮਕ ਅਵਸਥਾ ਉੱਚੀ ਹੋ ਜਾਂਦੀ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸ ਕੀ = {ਸੰਬੰਧਕ 'ਕੀ' ਦੇ ਕਾਰਨ ਲਫ਼ਜ਼ 'ਤਿਸੁ' ਦਾ (ੁ) ਉਡ ਗਿਆ ਹੈ}। ਗਤਿ = ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es emancipado, sí quien sea que habite en Él. (3)"