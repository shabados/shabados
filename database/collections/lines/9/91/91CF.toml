type = "primary"
data = "ਗਰਾ ਓਰ ਕਹ ਯੌ ਗਈ; ਜਾਤ ਭਏ ਉਠਿ ਲੋਗ ॥"
page = 824

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Declaring so she went out towards the main street. All the strangers immediately got up and left the place."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਕਹਿ ਕੇ ਉਹ ਪਿੰਡ ਵਲ ਚਲੀ ਗਈ ਅਤੇ ਲੋਕੀਂ ਉਠ ਕੇ ਤੁਰ ਗਏ।"