[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਪ੍ਰਭ ਸਰਣਾਗਤੀ; ਸਾਚਾ ਮਨਿ ਜੋਰੁ ॥੨॥੫॥੬੯॥"
page = 818
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak has entered the Lord's sanctuary and the True Ones power is his mind's support."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੇ ਸੁਆਮੀ ਦੀ ਓਟ ਲਈ ਹੈ ਅਤੇ ਸਤਿ ਪੁਰਖ ਦੀ ਸਤਿਆ ਦਾ ਹੀ ਉਸ ਦੇ ਚਿੱਤ ਅੰਦਰ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak has entered the Sanctuary of God; the True Lord has given strength to the mind. ||2||5||69||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਸੋ ਜਨ ਤਿਸ ਪ੍ਰਭੂ ਕੀ ਸਰਣਾਗਤੀ ਭਏ ਹੈਂ॥੨॥੫॥੬੯॥☬ਗੁਰਾਂ ਤੇ ਅਪਨੇ ਕੋ ਲਾਭ ਹੂਆ ਜਨਾਵਤੇ ਹੂਏ ਗੁਰ ਮਹਿਮਾਂ ਉਚਾਰਨ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਅਸੀਂ ਜੀਵ ਉਸ ਪ੍ਰਭੂ ਦੀ ਸਰਨ ਵਿਚ ਹੀ ਰਹਿ ਸਕਦੇ ਹਾਂ, (ਸਾਡੇ) ਮਨ ਵਿਚ ਉਸੇ ਦਾ ਹੀ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਆਸਰਾ ਹੈ ॥੨॥੫॥੬੯॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ। ਮਨਿ = ਮਨ ਵਿਚ। ਜੋਰੁ = ਤਾਕਤ, ਬਲ, ਆਸਰਾ ॥੨॥੫॥੬੯॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak busca sólo el Refugio del Señor, pues Él es nuestro Único Apoyo. (2-5-69)"