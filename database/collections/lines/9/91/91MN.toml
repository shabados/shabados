[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਸਾਹਿਬੁ; ਹਉ ਸੇਵਕੁ ਕੀਤਾ ॥"
page = 1081
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou are my Lord and Thou has made me Thy slave."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰਾ ਸੁਆਮੀ ਹੈਂ ਅਤੇ ਤੂੰ ਮੈਨੂੰ ਆਪਣਾ ਗੋਲਾ ਬਣਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my Lord and Master; You have made me Your servant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰਾ ਸਾਹਿਬ ਹੈਂ, ਮੈਂ ਤੇਰਾ ਸੇਵਕ ਹੂਆ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ (ਮੇਰਾ) ਮਾਲਕ ਹੈਂ, ਮੈਂ ਤੇਰਾ (ਪੈਦਾ) ਕੀਤਾ ਹੋਇਆ ਸੇਵਕ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਹਉਂ, ਮੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, eres mi Maestro y yo soy Tu Alumno,"