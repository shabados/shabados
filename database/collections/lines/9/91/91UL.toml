[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖ ਸਦਾ ਕੂੜਿਆਰ; ਭਰਮਿ ਭੁਲਾਣਿਆ ॥"
page = 144
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thy self-willed are ever false. They are deluded by doubt."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੁਦਰੇ ਸਦੀਵ ਹੀ ਝੂਠੇ ਹਨ, ਵਹਿਮ ਨੇ ਉਹਨਾਂ ਨੂੰ ਕੁਰਾਹੇ ਪਾ ਛੱਡਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The self-willed manmukhs are always false; they are deluded by doubt."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਮਨਮੁਖ ਝੂਠੇ ਭਰਮ ਸਾਦ ਭੂਲੇ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ ਕੂੜ (ਹੀ) ਵਿਹਾਝਦੇ ਹਨ, ਭਟਕਣਾ ਵਿਚ ਖੁੰਝੇ ਫਿਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੂੜਿਆਰ = ਕੂੜ ਦੇ ਵਪਾਰੀ (ਜਿਵੇਂ ਸੁਨਿਆਰ, ਲੋਹਾਰ)"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las criaturas necias son falsas; están engañadas por la duda."