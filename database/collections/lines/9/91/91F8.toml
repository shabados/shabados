[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਸਚਾ ਸਿਰਜਣਹਾਰੁ; ਅਲਖ ਸਿਰੰਦਿਆ ਜੀਉ ॥"
page = 688
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art the True Creator and the unknowable Maker."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੱਚਾ ਕਰਤਾਰ ਅਤੇ ਅਗਾਧ ਰਚਨਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the True Creator Lord, the unknowable Maker."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਲਖ! ਤੂੰ ਸਰਬ (ਸਿਰੰਦਿਆ) ਸਿਰਜਣਹਾਰਿਆ ਬੀਚ ਸੇ ਸਚਾ ਸਿਰਜਣਹਾਰ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਦ੍ਰਿਸ਼ਟ ਰਚਨਹਾਰ! ਤੂੰ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਹੈਂ ਤੇ ਸਭ ਜੀਵਾਂ ਦਾ ਪੈਦਾ ਕਰਨ ਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਲਖ = ਹੇ ਅਦ੍ਰਿਸ਼ਟ! ਸਿਰੰਦਿਆ = ਹੇ ਸਿਰੰਦੇ! ਹੇ ਪੈਦਾ ਕਰਨ ਵਾਲੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú eres el Verdadero Señor Creador, Incognoscible, el Único Ser que en Verdad Crea."