[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੀਮ ਭੇਰੀ ਭੁੰਕੀਅੰ; ਅਰੁ ਧੁੰਕੀਅੰ ਸੁ ਨਿਸਾਣ ॥"
page = 106

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sound of large-sized drums is being heard and the flags are fluttering."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵੱਡੀਆਂ ਭੇਰੀਆਂ ਵਜ ਰਹੀਆਂ ਹਨ ਅਤੇ ਧੌਂਸੇ ਧੁੱਕ ਧੁੱਕ ਕਰ ਰਹੇ ਹਨ।"