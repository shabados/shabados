[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਕੁਰਬਾਨ ਜਾਈਏ ਉਸ ਸਰਬ ਸ਼ਕਤੀਮਾਨ ਤੋਂ, ਜਿਸਨੇ ਪਾਣੀ ਦੇ ਇੱਕ ਕਤਰ ਤੋਂ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਐ ਜ਼ਹੇ ਕਾਦਰ ਕਿ ਅਜ਼ ਯੱਕ ਕਤਰਾ ਆਬ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, he is the shining moon of the elevations of praises and idealism. (124)"