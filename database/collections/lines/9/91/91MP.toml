[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਜੰਤ੍ਰ; ਕਰੇ ਪ੍ਰਤਿਪਾਲ ॥"
page = 987
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who cherishes all the beings and creatures."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਜੋ ਸਾਰਿਆਂ ਜੀਵਾਂ ਜੰਤੂਆਂ ਦੀ ਪ੍ਰਵਰਿਸ਼ ਕਰਦਾ ਹੈ:"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He cherishes all beings and creatures."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੂਖਮ ਅਸਥੂਲ ਜੀਆਂ ਕੀ ਪ੍ਰਤਿਪਾਲ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਭ ਜੀਵਾਂ ਦੀ ਪਾਲਣਾ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ = {ਲਫ਼ਜ਼ 'ਜੀਊ' ਤੋਂ ਬਹੁ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él mantiene a todos los seres y a todas las criaturas."