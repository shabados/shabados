[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰੈ ਗੁਰਿ; ਸਭ ਸੋਝੀ ਪਾਈ ॥"
page = 1052
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Perfect Guru, I know all this."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਾਂ ਦੋ ਰਾਹੀਂ ਮੈਂ ਇਹ ਸਾਰਾ ਕੁਛ ਜਾਣਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Perfect Guru, all this is known."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੋਂ ਨੇ ਮੇਰੇ ਕੋ ਸਭ ਸੋਝੀ ਪਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਇਹ ਸਾਰੀ ਸੂਝ ਪੂਰੇ ਗੁਰੂ ਤੋਂ ਮਿਲੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es a través del Guru Verdadero que puedo saberlo todo"