[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਦਨ ਰਾਇ ਠਗ ਇਮ ਕਹੀ; ਮਨ ਮੈ ਮੰਤ੍ਰ ਬਿਚਾਰਿ ॥"
page = 857

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Madan Rai, the swindler, had said this after careful reflection,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਦਨ ਰਾਇ ਠਗ ਨੇ ਮਨ ਵਿਚ ਵਿਚਾਰ ਕੇ ਇਸ ਤਰ੍ਹਾਂ ਕਿਹਾ"