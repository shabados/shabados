[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਿਸਾ ਚਾਰਿ ਜਾ ਕੀ ਸਦਾ ਲੋਹ ਮਾਨੋ ॥"
page = 922

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘We persist and you must recognise, as our potency is known in all the four directions (of the world).’"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਲੋਹਾ ਚਾਰੇ ਦਿਸ਼ਾਵਾਂ ਮੰਨਦੀਆਂ ਹਨ।"