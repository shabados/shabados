[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਉ; ਅਪੁਨੀ ਕਰੈ ਬਖਸੀਸ ॥"
page = 277
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "On whom he bestows His favours,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਉਤੇ ਉਹ ਆਪਣੀ ਮਿਹਰ ਧਾਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "And that one upon whom He bestows His blessings"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਵਾਹਿਗੁਰੂ ਅਪਨੀ ਬਖਸ਼ਸ਼ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਤੇ ਜਗਤ ਦਾ ਮਾਲਕ ਪ੍ਰਭੂ ਆਪਣੀ ਬਖ਼ਸ਼ਸ਼ ਕਰਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਖਸੀਸ = ਬਖ਼ਸ਼ਸ਼, ਦਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél a quien el Señor Universal acoge en Su Gracia,"