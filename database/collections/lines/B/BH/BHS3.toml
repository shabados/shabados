data = "ਸਿਲਹ ਸੰਜਿ ਸਜੇ ॥੨੭॥"
page = 180

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Bedecked with their armour, they mighty warriors are thundering.27."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਸ਼ਸਤ੍ਰਾਂ ਅਤੇ ਕਵਚਾਂ ਨਾਲ ਸਜੇ ਹੋਏ ਸ ਨਾ ॥੨੭॥"