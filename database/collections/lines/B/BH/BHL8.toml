[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੈ ਕਾਜਿ ਨ; ਗ੍ਰਿਹੁ ਰਾਜੁ ਮਾਲੁ ॥"
page = 889
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thy home, kingdom and riches are of no avail to thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਘਰ, ਪਾਤਿਸ਼ਾਹੀ ਅਤੇ ਧਨ ਪਦਾਰਥ ਤੇਰੇ ਕਿਸੇ ਕੰਮ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your home, power and wealth will be of no use to you."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਮ ਮਾਲ ਔ ਗ੍ਰਹ ਤੇਰੇ ਕਿਸੇ ਅਰਥ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਿੱਤਰ! ਇਹ ਘਰ, ਇਹ ਹਕੂਮਤ, ਇਹ ਧਨ (ਇਹਨਾਂ ਵਿਚੋਂ ਕੋਈ ਭੀ) ਤੇਰੇ (ਆਤਮਕ ਜੀਵਨ ਦੇ) ਕੰਮ ਨਹੀਂ ਆ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇਰੈ ਕਾਜਿ = ਤੇਰੇ ਕੰਮ ਵਿਚ। ਗ੍ਰਿਹੁ = ਘਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tu hogar, tus dominios y posesiones de nada sirven;"