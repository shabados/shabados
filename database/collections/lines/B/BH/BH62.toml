data = "ਉਤਰਿਯੋ ਪੂਛਿ ਕਾਨ ਕਟਿ ਲਯੋ ॥"
page = 926

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When he observed that the lion was dead,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤਾਂ ਬ੍ਰਿਛ ਤੋਂ) ਉਤਰ ਕੇ (ਸ਼ੇਰ ਦੇ) ਕੰਨ ਅਤੇ ਪੂਛਲ ਕਟ ਲਿੱਤੀ।"