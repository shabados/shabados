[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਸਾਧੇ ਅਗਾਧੇ ਅਗੰਜੁਲ ਗਨੀਮੇ ॥"
page = 128

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is Incorrigible, Unfathomable, and Indestructible by enemies."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਸਾਧ, ਅਗਾਧ ਅਤੇ ਵੈਰੀਆਂ ਤੋਂ ਮਾਰੇ ਨਾ ਜਾ ਸਕਣ ਵਾਲਾ ਹੈ;"