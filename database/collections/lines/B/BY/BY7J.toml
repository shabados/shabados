[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਵੇਖੈ ਆਪੇ ਬੂਝੈ; ਆਪੇ ਹੁਕਮੁ ਪਛਾਣੈ ॥"
page = 580
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself sees, Himself understands and Himself realises He, His will."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਵੇਖਦਾ ਹੈ, ਆਪ ਸਮਝਦਾ ਹੈ। ਅਤੇ ਆਪ ਹੀ ਆਪਣੀ ਰਜ਼ਾ ਨੂੰ ਅਨੁਭਵ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself beholds it, and He Himself understands it. He Himself realizes the Hukam of His Command."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਈਸ਼ਵਰ ਆਪੇ ਵੇਖਦਾ ਹੈ ਗਿਆਨੀ ਹੋਇ ਬੂਝ ਪੂਛਤਾ ਜਗਿਆਸੂ ਹੋਇ ਭਗਤ ਹੋਇ ਹੁਕਮ ਪਛਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਹੀ ਸਭ ਦੇ ਕੀਤੇ ਕਰਮਾਂ ਨੂੰ ਵੇਖਦਾ ਹੈ, ਆਪ ਹੀ ਸਭ ਦੇ ਦਿਲਾਂ ਦੀ ਸਮਝਦਾ ਹੈ, ਆਪ ਹੀ ਆਪਣੇ ਹੁਕਮ ਨੂੰ ਪਛਾਣਦਾ ਹੈ (ਕਿ ਕਿਵੇਂ ਇਹ ਹੁਕਮ ਜਗਤ ਵਿਚ ਵਰਤਿਆ ਜਾਣਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵੇਖੈ = ਸੰਭਾਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, medita en Su Creación y Él Mismo pronuncia el Jukam de Su Comando."