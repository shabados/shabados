[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ; ਮੋਹਿ ਸਾਧਸੰਗੁ ਦੀਜੈ ॥੪॥"
page = 739
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and mercifully bless me with the society of saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮਿਹਰ ਧਾਰ ਕੇ ਮੈਨੂੰ ਸਤਿਸੰਗਤ ਦੀ ਦਾਤ ਬਖਸ਼।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Have Mercy upon me, and bless me with the Saadh Sangat, the Company of the Holy. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਕੋ ਕਿਰਪਾ ਕਰ ਕੇ ਸੰਤੋਂ ਕਾ ਸੰਗ ਦੇਵੋ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਰਪਾ ਕਰ ਕੇ ਮੈਨੂੰ ਗੁਰਮੁਖਾਂ ਦੀ ਸੰਗਤਿ ਬਖ਼ਸ਼ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ। ਮੋਹਿ = ਮੈਨੂੰ। ਸੰਗੁ = ਸਾਥ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ten Compasión y bendíceme con la Saad Sangat, la Compañía de los Santos (4)"