[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਦੇ ਵਡਿਆਈਆ; ਆਪੇ ਹੀ ਕਰਮ ਕਰਾਇਦਾ ॥"
page = 472
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thyself Thou grantest glory and Thyself causeth men to do deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੁਦ ਹੀ ਤੂੰ ਸੋਭਾ-ਸ਼ਾਨ ਬਖਸ਼ਦਾ ਹੈਂ ਅਤੇ ਖੁਦ ਹੀ ਬੰਦਿਆਂ ਪਾਸੋਂ ਕੰਮ ਕਰਵਾਉਂਦਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You Yourself grant them glory, and You Yourself cause them to act."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਆਪੇ ਹੀ ਕਰਮ ਕਰਵਾਵਤਾ ਹੈ, ਪੁਨਃ ਆਪ ਹੀ ਬਡਿਆਈਆਂ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ (ਜੀਆਂ ਨੂੰ) ਵਡਿਆਈਆਂ ਬਖ਼ਸ਼ਦਾ ਹੈ ਤੇ ਆਪ ਹੀ ਉਹਨਾਂ ਨੂੰ ਕੰਮ ਵਿਚ ਲਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo confiere la Gloria y hace que los hombres actúen."