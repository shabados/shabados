[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ. ਤਿਨ ਕੈ ਬਲਿਹਾਰਣੈ; ਜਿਨੀ ਸਚੁ ਰਖਿਆ ਉਰਿ ਧਾਰਿ ॥"
page = 1285
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am a sacrifice unto them, who keep the True Lord clasped to their heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਹਨਾ ਉਤੋਂ ਘੋਲੀ ਜਾਂਦਾ ਹਾਂ ਜੋ ਸੱਚੇ ਸੁਆਮੀ ਨੂੰ ਆਪਣੇ ਦਿਲ ਨਾਲ ਲਾਈ ਰਖਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to those who enshrine the True Lord within their hearts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਸਚੇ ਕੋ ਹਿਰਦੈ ਮੇਂ ਧਾਰਨ ਕਰ ਰਖਾ ਹੈ ਮੈਂ ਤਿਨ ਸਤਿਗੁਰੋਂ ਕੇ ਬਲਿਹਾਰਨੇ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਨੇ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਨੂੰ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਵਸਾਇਆ ਹੈ, ਮੈਂ ਉਹਨਾਂ ਤੋਂ ਸਦਕੇ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਰਿ = ਹਿਰਦੇ ਵਿਚ। (ਨੋਟ: 'ਭੂਤਕਾਲ ਕ੍ਰਿਆ' ਦਾ ਅਰਥ 'ਵਰਤਮਾਨ' ਵਿਚ ਕਰਨਾ ਹੈ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi ser en sacrificio a quiénes enaltecen al Señor Verdadero en sus corazones."