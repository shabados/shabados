[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਪ੍ਰਸਾਦਿ; ਸੁਖਿ ਸਹਜੇ ਬਸਨਾ ॥"
page = 270
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose grace thou abidest in ease and comfort,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਦਇਆ ਦੁਆਰਾ ਤੂੰ ਆਰਾਮ ਅਤੇ ਠੰਢ ਚੈਨ ਅੰਦਰ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By His Grace, you abide in peace and ease."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜਿਸ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਸੁਭਾਵਕ ਸੁਖ ਸਾਥ ਵਸਨਾ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਕਿਰਪਾ ਨਾਲ ਸੁਭਾਵਕ ਹੀ ਸੁਖੀ ਵੱਸ ਰਿਹਾ ਹੈਂ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜੇ = ਸੁਭਾਵਕ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por Su Gracia, mueves con soltura tus manos y pies."