data = "ਕਾਲਿ ਹਮਾਰੇ ਬਾਗ; ਕ੍ਰਿਪਾ ਕਰਿ ਆਇਯੌ ॥"
page = 830

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She conveyed this secret to the (second) lover, ‘Come to the garden."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਕਲ ਸਾਡੇ ਬਾਗ਼ ਵਿਚ ਕ੍ਰਿਪਾ ਪੂਰਵਕ ਆਏ।"