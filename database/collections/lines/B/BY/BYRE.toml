data = "ਅਛਤ ਧੂਪ ਕੁੰਕਮਹਿ ਲਾਹੀ ॥"
page = 917

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Men and women would walk to the place burning incense and sprinkling saffron."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਚੌਲ ਕੇਸਰ ਲਗਾਉਂਦੇ ਅਤੇ ਧੂਪ (ਜਗਾਉਂਦੇ ਸਨ)।"