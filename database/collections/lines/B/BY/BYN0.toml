[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਖਣੁ. ਆਖਿ ਨ ਰਜਿਆ; ਸੁਨਣਿ. ਨ ਰਜੇ ਕੰਨ ॥"
page = 147
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mouth is not sated with speech and the ears are not sated with hearing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੂੰਹ ਬਚਨ ਬਿਲਾਸ ਕਰਦਾ ਨਹੀਂ ਧ੍ਰਾਪਦਾ ਅਤੇ ਕੰਨ ਸਰਵਨ ਕਰਨ ਨਾਲ ਨਹੀਂ ਰੱਜਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mouth is not satisfied by speaking, and the ears are not satisfied by hearing."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਆਖਣੁ) ਮੁਖ ਸਬਦੋਂ ਕੋ ਆਖ ਕਰ ਤ੍ਰਿਪਤ ਨਹੀਂ ਹੂਆ ਔਰ ਸਬਦੋਂ ਕੋ ਸੁਣਦੇ ਹੂਏ ਸ੍ਰਵਣ ਨਹੀਂ ਤ੍ਰਿਪਤ ਹੂਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੂੰਹ ਬੋਲ ਬੋਲ ਕੇ ਰੱਜਦਾ ਨਹੀਂ (ਭਾਵ, ਗੱਲਾਂ ਕਰਨ ਦਾ ਚਸਕਾ ਮੁੱਕਦਾ ਨਹੀਂ), ਕੰਨ (ਗੱਲਾਂ) ਸੁਣਨ ਨਾਲ ਨਹੀਂ ਰੱਜਦੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਖਣੁ = ਮੂੰਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los labios no son saciados por hablar, ni los oídos por escuchar."