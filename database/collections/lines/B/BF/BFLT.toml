[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਹਾਂ; ਨਿਰੰਜਨੁ ਰਮਈਆ ਹੋਇ ॥੧॥ ਰਹਾਉ ॥"
page = 974
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Immaculate Omnipresent Lord is seen in that place. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਵਨ ਪਵਿੱਤਰ ਸਰਬ ਵਿਆਪਕ ਪ੍ਰਭੂ ਉਸ ਥਾਂ ਤੇ ਦਿਸ ਆਉਂਦਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The all-pervading immaculate Lord is there. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਹਾਂ ਦਸਮੇਂ ਦਵਾਰ ਮੇਂ ਜਾਇ ਕਰ ਜੀਵ ਨਿਰੰਜਨ ਰਮਈਆ ਕਾ ਸਰੂਪ ਹੋ ਜਾਤਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉੱਥੇ (ਉਸ ਅਵੱਸਥਾ ਵਿੱਚ) ਨਿਰੰਜਨ ਸੋਹਣਾ ਰਾਮ ਪਰਗਟ ਹੁੰਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਮਈਆ = ਸੋਹਣਾ ਰਾਮ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y entiende que ahí habita nuestro Dios Todo Prevaleciente y Desapegado. (1-Pausa)"