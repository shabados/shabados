[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਪ ਪੁੰਨ ਵਰਤੈ ਸੰਸਾਰਾ ॥"
page = 1052
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In vice and virtue the world is involved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਦੀ ਅਤੇ ਨੇਕੀ ਅੰਦਰ ਦੁਨੀਆ ਉਲਝੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The world is engrossed in vice and virtue."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੰਸਾਰ ਪਾਪ ਪੁੰਨ ਕਰਮੋਂ ਮੇਂ ਵਰਤਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜਗਤ ਵਿਚ (ਮਾਇਆ ਦੇ ਪ੍ਰਭਾਵ ਹੇਠ ਹੀ) ਪਾਪਾਂ ਤੇ ਪੁੰਨਾਂ ਦਾ ਵਰਤਾਰਾ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਸਾਰਾ = ਜਗਤ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mundo está involucrado entre la virtud y el vicio,"