[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਨਿ ਪਰਿਓ ਨਾਨਕ; ਹਰਿ ਦੁਆਰੇ ॥੪॥੪॥"
page = 563
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak has taken refuge at God's door."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੇ ਵਾਹਿਗੁਰੂ ਦੇ ਦਰ ਦੀ ਪਨਾਹ ਲਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak seeks the Sanctuary of the Lord's Door. ||4||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਹਰਿ! ਮੈਂ ਆਪ ਕੇ ਦੁਆਰੇ, ਭਾਵ ਸਤਸੰਗ ਮੇਂ ਆਕਰ ਆਪ ਕੀ ਸਰਨਿ ਪੜਾ ਹੂੰ॥੪॥੪॥☬ਪੁਨਾ ਬੇਨਤੀ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ ਆ ਕੇ ਤੇਰੀ (ਪ੍ਰਭੂ ਦੀ) ਸਰਨ ਪਿਆ ਹੈ ॥੪॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਆਰੇ = ਦੁਆਰਿ, ਦਰ ਤੇ ॥੪॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak busca refugio a Tu Puerta. (4‑4)"