data = "ਜਗਤ ਨੂੰ ਧਾਰਨ ਕਰਨ ਵਾਲੀ, ਭਗਤਾਂ ਦੀ ਭਾਰੀ (ਚਿੰਤਾ ਕਰਨ ਵਾਲੀ)"