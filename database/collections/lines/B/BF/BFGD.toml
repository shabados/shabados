data = "ਜਗ ਧਾਰੀ ਭਾਰੀ ਭਗਤਾਯੰ ॥"
page = 679

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O supporter of the world! You are superb for the devotees"

[[content]]
