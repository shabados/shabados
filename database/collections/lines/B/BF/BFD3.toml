[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁਨੈ ਦੇਸਿ ਦੇਸੰ, ਮੁਨੰ ਪਾਪ ਕਰਮਾ ॥"
page = 557

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sages will be noticed to have performed sinful acts in various countries"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੇਸ ਦੇਸਾਂਤਰਾਂ ਵਿਚ ਮੁਨੀ ਲੋਗ ਪਾਪ ਕਰਨ ਵਾਲੇ ਸੁਣੇ ਜਾਣਗੇ।"