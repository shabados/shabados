[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਮ ਜੰਦਾਰੁ. ਨ ਮਾਰੈ ਫੇਟੈ ॥"
page = 1036
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and the tyrant Death's courier strikes him not,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੌਤ ਦਾ ਜ਼ਾਲਮ ਦੂਤ ਉਸ ਨੂੰ ਸੱਟ ਨਹੀਂ ਮਾਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The tyrannical Messenger of Death cannot strike him then."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੌ ਮਿਲੈ ਤੌ ਜਮ ਕਾ ਦੂਤ ਧਕਾ ਵਾ ਚੋਰ ਨਹੀਂ ਮਾਰਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜ਼ਾਲਮ ਜਮ ਉਸ ਉਤੇ ਕੋਈ ਸੱਟ-ਫੇਟ ਨਹੀਂ ਕਰ ਕਰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੰਦਾਰੁ = ਅਵੈੜਾ, ਜ਼ਾਲਮ। ਫੇਟੈ = ਫੇਟ, ਸੱਟ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así Yama salvaje no nos lastima más."