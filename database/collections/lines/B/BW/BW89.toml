[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਊਤਮੁ ਹਰਿ ਪ੍ਰਭ ਨਾਮੁ ਹੈ; ਗੁਰ ਬਚਨਿ ਸਭਾਗੈ ਲੀਤਾ ॥"
page = 1317
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sublime is the Name of God, the Lord Master. The fortunate ones alone utter it through the Guru's word."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੇਸ਼ਟ ਹੈ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਮਾਲਕ ਦਾ ਨਾਮ। ਕੇਵਲ ਚੰਗੀ ਪ੍ਰਾਲਬਧ ਵਾਲੇ ਹੀ ਗੁਰਾਂ ਦੀ ਬਾਣੀ ਰਾਹੀਂ ਇਸ ਦਾ ਉਚਾਰਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Name of the Lord, the Lord God is Sublime. The fortunate ones chant it, through the Word of the Guru's Teachings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰਿ ਹਰਿ ਪ੍ਰਭੂ! ਆਪ ਕਾ ਨਾਮੁ ਉਤਮ ਹੈ, ਗੁਰੋਂ ਕੇ ਬਚਨੋ ਕਰ ਕਿਸੀ ਉਤਮ ਭਾਗ ਵਾਲੇ ਨੇ ਲੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ (ਮਨੁੱਖ ਦੇ ਜੀਵਨ ਨੂੰ) ਉੱਚਾ ਕਰਨ ਵਾਲਾ ਹੈ, ਪਰ ਕਿਸੇ ਭਾਗਾਂ ਵਾਲੇ ਨੇ (ਹੀ) ਗੁਰੂ ਦੇ ਉਪਦੇਸ਼ ਦੀ ਰਾਹੀਂ (ਇਹ ਨਾਮ) ਸਿਮਰਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਊਤਮੁ = (ਜੀਵਨ ਨੂੰ) ਉੱਚਾ ਕਰਨ ਵਾਲਾ। ਗੁਰਬਚਨਿ = ਗੁਰੂ ਦੇ ਉਪਦੇਸ਼ ਦੀ ਰਾਹੀਂ। ਸਭਾਗੈ = ਭਾਗਾਂ ਵਾਲੇ (ਮਨੁੱਖ) ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Nombre del Señor, de Dios, Nuestro Señor es Sublime."