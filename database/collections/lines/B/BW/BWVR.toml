[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਟਿ ਘਟਿ ਰਵਿ ਰਹਿਆ; ਗੁਣਤਾਸ ॥"
page = 900
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God, the Treasure of virtues is pervading all hearts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨੇਕੀਆਂ ਦਾ ਖਜ਼ਾਨਾ ਵਾਹਿਗੁਰੂ ਸਾਰਿਆਂ ਦਿਲਾਂ ਅੰਦਰ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The treasure of virtue pervades and permeates each and every heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਗੁਨੋਂ ਕਾ ਸਮੁੰਦ੍ਰ ਘਟੋਂ ਘਟੋਂ ਮੇਂ ਬਿਆਪ ਰਹਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਗੁਣਾਂ ਦਾ ਖ਼ਜ਼ਾਨਾ ਹਰੇਕ ਹਿਰਦੇ ਵਿਚ ਮੌਜੂਦ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਟਿ ਘਟਿ = ਹਰੇਕ ਸਰੀਰ ਵਿਚ। ਗੁਣਤਾਸ = ਗੁਣਾਂ ਦਾ ਖ਼ਜ਼ਾਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es el Tesoro de Virtud que compenetra todos los corazones;"