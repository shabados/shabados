[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਉ ਕੜੀਐ; ਜੇ ਕਿਛੁ ਜਾਣੈ ਨਾਹੀ ॥"
page = 1140
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then alone should we grieve if the Lord be unaware of any thing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤਾਂ ਹੀ ਅਸੀਂ ਅਫਸੋਸ ਕਰੀਏ ਜੇਕਰ ਸੁਆਮੀ ਕਿਸੇ ਗੱਲ ਤੋਂ ਬੇਖਬਰ ਹੋਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "We should feel sad, if something were not known to the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੌ ਝੂਰਨਾ ਕਰੀਏ ਜੇਕਰ ਹੇ ਵਾਹਗੁਰੂ! ਤੂੰ ਅਨਜਾਣ ਹੋਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਇਹ ਯਕੀਨ ਟਿਕ ਜਾਏ ਕਿ ਪਰਮਾਤਮਾ ਸਾਡੀਆਂ ਲੋੜਾਂ ਜਾਣਦਾ ਨਹੀਂ ਹੈ, ਤਾਂ ਭੀ ਝੁਰਦੇ ਰਹੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sufriríamos si el Señor no conociera nuestro ser interior."