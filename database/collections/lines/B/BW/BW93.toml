[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੁਹੂੰ ਬਿਹਸਿ ਕੈ ਮਾਥੋ ਧੁਨ੍ਰਯੋ ॥"
page = 900

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the Quazi (the justice) and the policeman heard this, they both, laughingly, shook their heads."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤਾਂ) ਦੋਹਾਂ ਨੇ ਹੱਸ ਕੇ ਮੱਥਾ (ਸਿਰ) ਹਿਲਾਇਆ।"