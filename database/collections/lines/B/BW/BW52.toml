[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਮਿਤ ਸੰਗ ਸੈਨਾ ਲਏ; ਸਭੈ ਪਹੂੰਚੈ ਆਇ ॥੨੭॥"
page = 1009

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All those claiming supremacy, reached there with their armies.(27)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬੇਸ਼ੁਮਾਰ ਸੈਨਾ ਲੈ ਕੇ ਉਥੇ ਆਣ ਪਹੁੰਚੇ ॥੨੭॥"