[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਸਤ ਸਿੰਮ੍ਰਿਤਿ; ਸੋਧਿ ਦੇਖਹੁ ਕੋਇ ॥"
page = 229
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Let some one see and study the Shashtras and Simirtis."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਜਣਾ ਸ਼ਾਸਤ੍ਰਾਂ ਅਤੇ ਸਿਮਰਤੀਆਂ ਨੂੰ ਘੋਖ ਕੇ ਵੇਖ ਲਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You may study and examine the Shaastras and the Simritees,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਸਤ੍ਰ ਸਿੰਮ੍ਰਿਤਿਆਂ ਕੋਈ ਵਿਚਾਰ ਕਰ ਦੇਖ ਲੇਵੋ, ਸਭੀ ਕਹਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਬੇ-ਸ਼ੱਕ) ਕੋਈ ਧਿਰ ਸਿਮ੍ਰਿਤੀਆਂ ਸ਼ਾਸਤ੍ਰਾਂ ਨੂੰ ਭੀ ਵਿਚਾਰ ਕੇ ਵੇਖ ਲਵੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਧਿ ਦੇਖਹੁ = ਵਿਚਾਰ ਕੇ ਵੇਖ ਲਵੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Estudia los Shastras o los textos Semíticos;"