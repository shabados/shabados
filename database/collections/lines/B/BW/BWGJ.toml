[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲੇਖ ਅਲੇਖ, ਨ ਕੀਮਤਿ ਪਾਏ ॥੧੦॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The Lord is free from all accounts and none can understand His mystery."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਗੁਰਮੁਖ) ਲੇਖੇ ਥੋਂ ਅਲੇਖ ਹਨ (ਕੋਈ) ਕੀਮਤ ਨਹੀਂ ਪਾ ਸਕਦਾ।"