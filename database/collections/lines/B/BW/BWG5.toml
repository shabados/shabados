[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਜਨੁ; ਪਰਮ ਗਤਿ ਪਾਵੈ ॥"
page = 623
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that man obtains the highest status."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਇਨਸਾਨ ਪਰਮ ਮਰਤਬੇ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "that humble being obtains the supreme status."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪੁਰਸ਼ ਪਰਮ-ਗਤੀ ਕੋ ਪਾਵੈਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਸਭ ਤੋਂ ਆਤਮਕ ਅਵਸਥਾ ਹਾਸਲ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਮ ਗਤਿ = ਸਭ ਤੋਂ ਉਚੀ ਆਤਮਕ ਅਵਸਥਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "recibe el Éxtasis Supremo."