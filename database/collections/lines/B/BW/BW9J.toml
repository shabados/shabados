[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਸੂਚਾ; ਜਿ ਕਰੋਧੁ ਨਿਵਾਰੇ ॥"
page = 1059
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone is pure, who banishes wrath,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਪਵਿੱਤਰ ਹੈ ਜੋ ਆਪਣੇ ਗੁੱਸੇ ਨੂੰ ਦੂਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is pure, who eradicates anger."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕ੍ਰੋਧ ਕੋ ਨਿਵਾਰੇ ਸੋ ਸੂਰਮਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਮਨੁੱਖ (ਆਪਣੇ ਅੰਦਰੋਂ) ਕ੍ਰੋਧ ਦੂਰ ਕਰ ਲੈਂਦਾ ਹੈ, ਉਹ ਪਵਿੱਤਰ ਹਿਰਦੇ ਵਾਲਾ ਬਣ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੂਚਾ = ਸੁੱਚਾ, ਸੁੱਚੇ ਹਿਰਦੇ ਵਾਲਾ। ਜਿ = ਜਿਹੜਾ ਮਨੁੱਖ। ਨਿਵਾਰੇ = ਦੂਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que conquista su temperamento es en verdad puro,"