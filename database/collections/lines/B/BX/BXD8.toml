[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਬਾਹਰਿ ਚਲਿਆ ਕਰਣਿ ਤਪੁ; ਮਨ ਬੈਰਾਗੀ ਹੋਇ ਅਤੀਤਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Listening to this and getting totally detached in his mind Dhru went out (to the jungle) to undertake rigorous discipline."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਇਹ ਸੁਣਕੇ ਧ੍ਰੁਵ ) ਬਾਹਰ ਤਪ ਕਰਨ ਤੁਰ ਪਿਆ, ਮਨ ਵੈਰਾਗਵਾਨ ਤੇ ਅਤੀਤ ਹੋ ਗਿਆ।"