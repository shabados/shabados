[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਉਪਦੇਸੁ ਕਹਿਓ. ਇਹੁ ਸਾਰੁ ॥"
page = 1142
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru has preached this sublime instruction unto me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਇਹ ਸਰੇਸ਼ਟ ਸਿਖ ਮਤ ਉਪਦੇਸ਼ੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru has instructed me in these sublime teachings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਨੇ ਏਹ ਸਾਰ ਉਪਦੇਸ਼ ਕਹਾ ਹੈ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੇ (ਮੈਨੂੰ) ਇਹ ਸਭ ਤੋਂ ਵਧੀਆ ਉਪਦੇਸ਼ ਦੇ ਦਿੱਤਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ। ਸਾਰੁ = ਸ੍ਰੇਸ਼ਟ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La esencia de la Sabiduría del Guru"