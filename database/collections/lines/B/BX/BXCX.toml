[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਆਪੁ ਗਵਾਇ, ਨ ਆਪੁ ਗਣਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Gurmukhs delete ego from the self and never allow themselves to be noticed."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖ ਆਪਾ ਭਾਵ ਗਵਾਕੇ ਆਪਣਾ ਆਪ ਪ੍ਰਗਟ ਨਹੀਂ ਕਰਦੇ (ਜਿਨ ਪਟ ਅੰਦਰਿ ਬਾਹਰਿ ਗੁਦੜੁ ਤੇ ਭਲੇ ਸੰਸਾਰਿ”)।"