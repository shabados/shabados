data = "ਸਕਲ ਤੁਪਕ ਕੇ ਨਾਮ ਪ੍ਰਮਾਨਹੁ ॥੯੫੪॥"
page = 774

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Rain-raman”, add the words “Satchar-pati-shatru” and know all the names of Tupak.954."

