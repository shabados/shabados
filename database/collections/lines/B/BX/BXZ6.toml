[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਸੰਖ ਚੋਰ; ਹਰਾਮਖੋਰ ॥"
page = 4
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Numberless are the thieves and the devourers of other's property."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਣਗਿਣਤ ਤਸਕਰ ਅਤੇ ਹੋਰਨਾਂ ਦਾ ਮਾਲ ਖਾਣ ਵਾਲੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Countless thieves and embezzlers."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਗਿਣਤ ਹੀ ਚੋਰ ਔਰ (ਹਰਾਮਖੋਰ) ਹਰਾਮ ਕੇ ਖਾਨੇ ਵਾਲੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਹੀ ਚੋਰ ਹਨ, ਜੋ ਪਰਾਇਆ ਮਾਲ (ਚੁਰਾ ਚੁਰਾ ਕੇ) ਵਰਤ ਰਹੇ ਹਨ"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਾਮਖੋਰ = ਪਰਾਇਆ ਮਾਲ ਖਾਣ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Incontables los irrespetuosos y ladrones."