[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਖ ਦਰੀਆਉ, ਕਰੋੜ ਜਹਾਜੇ ॥੪॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Lacs of rivers are there on which crores of ships ply."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਲੱਖਾਂ ਦਰੀਆਉ (ਸਮੁੰਦਰ) ਰਚਕੇ ਕਰੋੜਾਂ ਜਹਾਜ ਰਚੇ (ਕਿ ਇਨ੍ਹਾਂ ਦੁਆਰੇ ਲੋਕ ਆਪਣੇ ਨਿਰਬਾਹ ਕੀਤਾ ਕਰਨ)।"