type = "primary"
data = "ਸਭ ਕੋ ਕਾਲ, ਸਭਨ ਕੋ ਕਰਤਾ ॥"
page = 11

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is the Destroyer of all and Creator of all."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਭ ਦਾ ਨਾਸ਼ ਕਰਨ ਵਾਲਾ ਅਤੇ ਸਭ ਦਾ ਸਿਰਜਕ ਹੈ;"