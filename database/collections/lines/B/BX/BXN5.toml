[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜੀਉ ਆਪਿ ਵਸੈ; ਮਨਿ ਆਇ ॥੪॥"
page = 365
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then, the reverend Lord Himself comes and abides in the mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਜਯ ਪ੍ਰਭੂ ਖੁਦ ਆ ਕੇ ਚਿੱਤ ਵਿੱਚ ਟਿੱਕ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and then, the Dear Lord Himself comes to dwell in the mind. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਹਰਿ ਜੀ ਅੰਤਸਕਰਣ ਮੇਂ ਆਪ ਆਇ ਕਰ ਨਿਵਾਸੁ ਕਰਤੇ ਹੈਂ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਹੀ ਮਨੁੱਖ ਦੇ ਮਨ ਵਿਚ ਆ ਵੱਸਦਾ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y el Bienamado Señor viene, de Sí Mismo, a habitar dentro de nosotros. (4)"