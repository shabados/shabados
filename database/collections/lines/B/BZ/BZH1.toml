[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਅੰਤਰਿ ਪ੍ਰਗਟਿਓ ਆਪ ॥"
page = 887
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, within whom the Lord himself becomes manifest,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਅੰਦਰ ਪ੍ਰਭੂ ਆਪੇ ਪ੍ਰਤੱਖ ਹੋ ਵੰਞਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who is illuminated by the Lord's radiance within,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਅੰਤਸਕਰਣ ਮੇਂ ਆਪ ਸਾਖੀ ਰੂਪ ਗੁਰੋਂ ਦੁਆਰੇ ਪ੍ਰਗਟਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਆਪ ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਆਪਣਾ ਪ੍ਰਕਾਸ਼ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੈ ਅੰਤਰਿ = ਜਿਸ ਦੇ ਅੰਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél a quien el Señor se le manifiesta,"