[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਮਾਨੇ ਕਉ; ਗੁਰਿ ਕੀਨੋ ਮਾਨੁ ॥"
page = 395
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto the dishonoured the Guru has bestowed honour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਇਜ਼ਤੇ ਨੂੰ ਗੁਰਾਂ ਨੇ ਇੱਜ਼ਤ ਬਖਸ਼ੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru has given honor to the dishonored."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੋ ਕੋਈ ਮਾਨ ਨਹੀਂ ਦੇਤਾ ਥਾ ਤਿਨ ਕੋ ਗੁਰੋਂ ਨੇ ਮਾਨ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਨਿਮਾਣੇ ਨੂੰ ਗੁਰੂ ਨੇ ਆਦਰ ਦਿੱਤਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el deshonrado es bendecido con Honor,"