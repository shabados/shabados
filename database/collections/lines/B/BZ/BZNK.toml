type = "primary"
data = "ਦੋਊ ਚਿਤ੍ਰ ਜੋਤੀ ਸੁ ਜੋਧਾ ਪ੍ਰਚੰਡੰ ॥"
page = 147

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Both were Glory-incarnate and mighty heroes."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਵੇਂ ਜੋਤਿ ਦਾ ਚਿਤਰ ਸਨ ਅਤੇ ਪ੍ਰਚੰਡ ਯੋਧੇ ਸਨ।"