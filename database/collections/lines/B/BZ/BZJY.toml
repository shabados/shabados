[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਆਸ ਪਰਾਸੁਰ ਸੁਕ ਸਨਾਦਿ; ਸਿਵ ਅੰਤੁ ਨ ਸੁਝੈ ॥"
page = 130

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Vyas, Parashar, Sukhedev, Sanak etc., and Shiva do not know His Limits."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੇਰਾ) ਅੰਤ ਵਿਆਸ, ਪਰਾਸ਼ਰ, ਸੁਕਦੇਵ, ਨੰਦੀ ਸਹਿਤ ਸ਼ਿਵ ਨੂੰ ਨਹੀਂ ਸੁਝਿਆ;"