[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੀਤਾ ਹੋਆ; ਕਰੇ ਕਿਆ ਹੋਇ ॥"
page = 1169
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What can be done the one, who himself is a creation,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਚੇ ਹੋਏ ਦੇ ਕਰਨ ਦੁਆਰਾ ਕੀ ਹੋ ਸਕਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What can the created being do?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੀਤਾ ਹੂਆ ਜੀਉ ਕ੍ਯਾ ਕਰੇ ਅਰੁ ਇਸ ਤੇ ਕਯਾ ਹੋਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਜੀਵਾਂ ਦੇ ਭੀ ਕੀਹ ਵੱਸ?) ਸਭ ਕੁਝ ਪਰਮਾਤਮਾ ਦਾ ਕੀਤਾ ਹੋ ਰਿਹਾ ਹੈ। ਜੀਵ ਦੇ ਕੀਤਿਆਂ ਕੁਝ ਨਹੀਂ ਹੋ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀਤਾ ਹੋਆ = ਸਭ ਕੁਝ ਪਰਮਾਤਮਾ ਦਾ ਕੀਤਾ ਹੋ ਰਿਹਾ ਹੈ। ਕਰੇ ਕਿਆ ਹੋਇ = ਜੀਵ ਦੇ ਕੀਤਿਆਂ ਕੀਹ ਹੋ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, ¿qué es lo que la criatura puede hacer o lograr?"