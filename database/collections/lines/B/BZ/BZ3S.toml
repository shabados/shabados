[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੇ ਭਗਤ. ਤੇਰੇ ਭਗਤ. ਸਲਾਹਨਿ ਤੁਧੁ ਜੀ; ਹਰਿ ਅਨਿਕ ਅਨੇਕ ਅਨੰਤਾ ॥"
page = 11
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In many and various ways, the numberless saint of Thine, saints of Thine, O God! praise Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਹੁਤਿਆਂ ਅਤੇ ਭਿੰਨ ਭਿੰਨ ਤਰੀਕਿਆਂ ਨਾਲ ਬੇਗਿਣਤ ਤੇਰੇ ਸਾਧੂ, ਤੇਰੇ ਸਾਧੂ, ਹੇ ਵਾਹਿਗੁਰੂ! ਤੇਰੀ ਸਿਫ਼ਤ ਸ਼ਲਾਘਾ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your devotees, Your devotees praise You, Dear Lord, in many and various and countless ways."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਨੰਤ ਹਰਿ ਜੀ! ਤੇਰੇ ਅਨੇਕ ਭਗਤ ਤੇਰੀ ਤੀਨੋ ਕਾਲੋਂ ਮੇ (ਸਲਾਹਨਿ) ਸੋਭਾ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਅਨੇਕਾਂ ਤੇ ਬੇਅੰਤ ਤੇਰੇ ਭਗਤ ਤੇਰੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰ ਰਹੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De muchas y variadas formas, los innumerables Santos Tuyos, oh Dios, Te alaban."