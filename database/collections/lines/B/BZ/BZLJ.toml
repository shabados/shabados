[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਤੇ ਕਰਤੈ; ਅਸਥਿਰੁ ਕੀਨੑੇ ॥੧॥ ਰਹਾਉ ॥"
page = 744
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "wherefore the Creator has made me ever stable. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਲਈ ਸਿਰਜਣਹਾਰ ਨੇ ਮੈਂਨੂੰ ਸਦੀਵੀ ਸਥਿਰ ਕਰ ਦਿੱਤਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In this way, the Creator Lord has made me steady and stable. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਧਿਆਨ ਕਰ (ਕਰਤੇ) ਵਾਹਿਗੁਰੂ ਨੇ ਅਸਥਿਰ ਕੀਏ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ (ਪਰਖ) ਦੀ ਬਰਕਤਿ ਨਾਲ ਕਰਤਾਰ ਨੇ (ਉਹਨਾਂ ਨੂੰ) ਅਡੋਲ-ਚਿੱਤ ਬਣਾ ਦਿੱਤਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਤੇ = ਇਸ ਦੇ ਕਾਰਨ। ਕਰਤੈ = ਕਰਤਾਰ ਨੇ। ਅਸਥਿਰੁ = ਅਡੋਲ-ਚਿੱਤ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así, mi Señor Creador me bendice con la Vida Eterna.(1-Pausa)"