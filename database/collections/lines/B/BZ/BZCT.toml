data = "ਟਕ-ਟਕ ਟੋਪਾਂ ਦੀ, ਢਕ-ਢਕ ਢਾਲਾਂ ਦੀ (ਆਵਾਜ਼ ਆ ਰਹੀ ਸੀ)"