data = "ਜੋਗਨ ਮਹਾ ਜੋਗ ਕਰਿ ਦੇਖ︀ਯੋ ॥"
page = 624

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The children saw him as a child and the Yogis as the supreme Yogi"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜੋਗੀਆਂ ਨੇ ਮਹਾਨ ਜੋਗ ਕਰ ਕੇ ਸਮਝਿਆ।"