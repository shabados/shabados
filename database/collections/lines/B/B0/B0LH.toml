[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕੁ ਸਾਚੁ ਕਹੈ ਬੇਨੰਤੀ; ਮਿਲਿ ਸਾਚੇ ਸੁਖੁ ਪਾਇਦਾ ॥੧੬॥੨॥੧੪॥"
page = 1035
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak makes a true supplication; meeting with the True Lord, man obtains peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਸੱਚੀ ਪ੍ਰਾਰਥਨਾ ਕਰਦਾ ਹੈ: ਸੰਚੇ ਸੁਆਮੀ ਨਾਲ ਮਿਲ ਕੇ ਇਨਸਾਨ ਆਰਾਮ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak offers this true prayer; meeting with the True Lord, peace is obtained. ||16||2||14||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੈਂ ਅਪਨਾ ਨਿਹਚਾ ਕਹਿਤਾ ਹੂੰ, ਹੇ ਸਾਚੇ! ਜੋ ਤੁਮ ਕੋ ਬੇਨਤੀ ਪੂਰਬਕ ਮਿਲਤਾ ਹੈ, ਸੋਈ ਸੁਖ ਪਾਵਤਾ ਹੈ ॥੧੬॥੨॥੧੪॥☬ਪ੍ਰਿਥਮ ਪ੍ਰਲੈ ਕਾਲ ਕਾ ਪ੍ਰਕਾਰ ਦਿਖਾਇਕਰ ਪੁਨਃ ਉਤਪਤੀ ਕਾ ਪ੍ਰਕਾਰ ਦਿਖਾਵੇਂਗੇ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜੇਹੜਾ ਮਨੁੱਖ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਨੂੰ ਸਿਮਰਦਾ ਹੈ (ਉਸ ਦੇ ਦਰ ਤੇ) ਬੇਨਤੀਆਂ ਕਰਦਾ ਹੈ, ਉਹ ਉਸ ਸਦਾ-ਥਿਰ ਪਰਮਾਤਮਾ ਨੂੰ ਮਿਲ ਕੇ ਆਤਮਕ ਅਨੰਦ ਮਾਣਦਾ ਹੈ ॥੧੬॥੨॥੧੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਿ = ਮਿਲ ਕੇ ॥੧੬॥੨॥੧੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, la Verdad que logro ver en mi ser interior es que quien sea que encuentre al Uno Verdadero, encuentra el Éxtasis.(16-2-14)"