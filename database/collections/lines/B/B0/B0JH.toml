[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੋਲੈ ਕਉੜਾ; ਜਿਹਬਾ ਕੀ ਫੂੜਿ ॥"
page = 394
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Bitter is her speech and rude her tongue."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੁਰੱਖਤ ਹੈ ਉਸ ਦੀ ਬੋਲਬਾਣੀ ਅਤੇ ਅੱਖੜ ਉਸ ਦੀ ਜੀਭ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Her speech is bitter, and her tongue is rude."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਓਰ ਦੇਖਤੀ ਹੈ ਕਰੂਰ ਦ੍ਰਿਸਟੀ ਸੇ ਦੇਖਤੀ ਹੈ ਔਰ ਕੌੜੇ ਬਚਨ ਬੋਲਤੀ ਹੈ, ਬਾਨੀ ਜਿਸ ਕੀ (ਫੂੜਿ) ਮੋਟੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ (ਸਦਾ) ਕੌੜਾ ਬੋਲਦੀ ਹੈ, ਜੀਭ ਦੀ ਖਰ੍ਹਵੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫੂੜਿ = ਖਰ੍ਹਵੀ"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es cruel, su hablar es muy rudo,"