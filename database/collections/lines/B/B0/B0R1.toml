[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਉ ਪਿੰਡੁ ਸਭੁ ਤਿਸ ਕਾ; ਸਿਫਤਿ ਕਰੇ ਅਰਦਾਸਿ ॥"
page = 86
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He glorifies and supplicates the Lord, to whom belong his soul, body and everything."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਆਮੀ ਦੀ ਮਹਿਮਾ ਤੇ ਉਸ ਦੇ ਮੁਹਰੇ ਬੇਨਤੀ ਕਰਦਾ ਹੈ, ਜੋ ਉਸ ਦੀ ਜਿੰਦੜੀ, ਦੇਹਿ ਤੇ ਹਰ ਸ਼ੈ ਦਾ ਮਾਲਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Body, soul and all things belong to the Lord-praise Him, and offer your prayers to Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੀਉ ਪਿੰਡ ਸਭ ਤਿਸ ਕਾ ਜਾਨ ਕਰ ਸਿਫਤਿ ਕਰਤੇ ਹੂਏ ਬੇਨਤੀ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿੰਦ ਤੇ ਸਰੀਰ ਸਭ ਕੁਝ ਪ੍ਰਭੂ ਦਾ (ਜਾਣ ਕੇ ਉਹ ਪ੍ਰਭੂ ਅੱਗੇ) ਬੇਨਤੀ ਤੇ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el cuerpo y la vida, yo le alabo y le rezo a Él."