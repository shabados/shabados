[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਇਸੁ ਮਾਰੇ; ਸੋਈ ਜਤੀ ॥"
page = 238
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who kills it, is rendered a celibate."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਇਸ ਨੂੰ ਨਸ਼ਟ ਕਰ ਦਿੰਦਾ ਹੈ ਉਹ ਕਾਮ ਚੇਸ਼ਟਾ ਰਹਿਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who kills this is truly a celibate."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜੋ ਇਸ ਕੋ ਮਾਰੇ ਸੋਈ ਜਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਇਸ (ਮੇਰ-ਤੇਰ ਨੂੰ) ਮੁਕਾ ਲੈਂਦਾ ਹੈ, ਉਹੀ ਹੈ ਅਸਲ ਜਤੀ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਤੀ = ਕਾਮਵਾਸਨਾ ਤੇ ਕਾਬੂ ਪਾ ਰੱਖਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que elimina la dualidad, en su mente es el único"