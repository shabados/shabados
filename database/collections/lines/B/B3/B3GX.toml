[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਗੁਰ; ਨਾਮੁ. ਨ ਪਾਇਆ ਜਾਇ ॥"
page = 115
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Guru, the Name cannot be obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਬਾਝੋਂ, ਨਾਮ ਪ੍ਰਾਜਪਤ ਨਹੀਂ ਹੋ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Guru, the Naam cannot be obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਸੇ ਬਿਨਾਂ ਨਾਮੁ ਨਹੀਂ ਜਪਿਆ ਜਾਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਗੁਰੂ (ਦੀ ਸਰਨ) ਤੋਂ ਬਿਨਾ ਨਹੀਂ ਮਿਲਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਨੁ ਗੁਰ = ਗੁਰੂ ਤੋਂ ਬਿਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Guru uno no encuentra el Nombre del Señor;"