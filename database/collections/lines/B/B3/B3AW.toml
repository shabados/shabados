[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੁ ਗੋਵਿੰਦੁ; ਮੇਰੇ ਮਨ ਧਿਆਇ ॥"
page = 1149
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, meditate thou on thy Guru-God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਤੂੰ ਆਪਣੇ ਗੁਰੂ-ਪਰਮੇਸ਼ਰ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, meditate on the Guru, the Lord of the Universe."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਗੁਰੂ ਜੋ ਗੋਬਿੰਦ ਰੂਪ ਹੈ ਤਿਨੋਂ ਕਾ ਧ੍ਯਾਵਣਾ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਗੁਰੂ ਨੂੰ ਗੋਵਿੰਦ ਨੂੰ (ਸਦਾ) ਸਿਮਰਿਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਧਿਆਇ = ਸਿਮਰਿਆ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente mía, habita en tu Dios Guru,"