[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਹਡਿਓ; ਮੂੜ ਨਰਿ ਹਾਂ ॥"
page = 409
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The foolish man is thus stuck up. He makes no other effort."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੂਰਖ ਮਨੁੱਖ ਇਸ ਪ੍ਰਕਾਰ ਖੁਭ ਗਿਆ ਹੈ। ਕੋਈ ਹੋਰ ਉਪਰਾਲਾ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The fool is stuck;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਸ ਕੀ ਚੜ ਮੇਂ ਮੂਰਖਤਾ ਕਰ ਕੇ ਨਰੁ ਜੀਵ (ਗਹਡਿਓ) ਗਡਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੂਰਖ ਮਨੁੱਖ ਨੇ (ਆਪਣਾ ਪੈਰ ਮੋਹ ਦੇ ਚਿੱਕੜ ਵਿਚ) ਫਸਾਇਆ ਹੋਇਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਹਡਿਓ = ਗੱਡਿਆ ਹੋਇਆ ਹੈ, ਫਸਾਇਆ ਹੋਇਆ ਹੈ। ਮੂੜ ਨਰਿ = ਮੂਰਖ ਮਨੁੱਖ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El tonto ignorante está ahí atascado."