data = "ਤਿਹੀ ਭਾਤਿ ਮਿਲਿ ਸਭਨ ਕਮਾਯੋ ॥"
page = 896

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the policemen heard thus, they all agreed upon the scheme."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਸਭ ਨੇ ਮਿਲ ਕੇ ਉਸੇ ਤਰ੍ਹਾਂ ਕੀਤਾ।"