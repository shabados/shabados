[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਜਨਾ ਕੀ ਧੂਰਿ; ਮਸਤਕਿ ਲਾਇਆ ॥"
page = 652
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The dust of the pious persons feet, they, apply to their forehead."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤਰ ਪੁਰਸ਼ਾਂ ਦੇ ਪੈਰਾਂ ਦੀ ਧੂੜ ਉਹ ਆਪਣੇ ਮੱਥੇ ਨੂੰ ਲਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They apply the dust of the feet of the Saints to their foreheads."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਸੰਤ ਜਨੋਂ ਕੀ ਚਰਣਧੂੜੀ ਕੌ ਜਿਨੋਂ ਨੇ ਅਪਨੇ ਮਸਤਕ ਪਰ ਲਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਸੰਤਾਂ ਦੀ ਚਰਨ-ਧੂੜ ਆਪਣੇ ਮੱਥੇ ਤੇ ਲਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਸਤਕਿ = ਮੱਥੇ ਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre de Dios y untan sobre sus frentes el Polvo de los Pies de los Santos."