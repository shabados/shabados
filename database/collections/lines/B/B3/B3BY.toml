data = "ਅਤੇ ਉਸ ਨੂੰ ਪੁੱਤਰਾਂ ਵਾਂਗ ਜਿਵਾਇਆ (ਭਾਵ ਵੱਡਾ ਕੀਤਾ) ॥੭॥"