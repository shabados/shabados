data = "ਮਸਲਤ ਜੋਰਿ ਸੂਰ ਨਿਜੁ ਕਰੀ ॥੨੯॥"
page = 952

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Once she had listened to his sweet talks but now she called a few confidant to consult.(29)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੇ ਸੂਰਮੇ ਇਕੱਠੇ ਕਰ ਕੇ ਸਲਾਹ ਕੀਤੀ ॥੨੯॥"