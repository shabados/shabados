[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਸੰਗ ਰਾਜਾ ਰਮੈ; ਅਧਿਕ ਪ੍ਰੀਤਿ ਜੀਯ ਜਾਨਿ ॥੩॥"
page = 853

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And the Raja used to make love intensively with one.(3)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਨ੍ਹਾਂ ਵਿਚੋਂ) ਇਕ ਨਾਲ ਰਾਜਾ ਮਨੋ ਅਧਿਕ ਪ੍ਰੇਮ ਕਰਦਾ ਹੋਇਆ ਰਮਣ ਕਰਦਾ ਸੀ ॥੩॥"