[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਤਪੀਸਰ; ਤਪ ਹੀ ਕਰਤੇ ॥"
page = 1156
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Millions of penitents just practise penitence."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾਂ ਹੀ ਤਪੀ ਤਪੱਸਿਆ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Millions of austere penitents practice austerities."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜੋਂ ਹੀ ਤਪੀਸ੍ਵਰ ਹੋ ਕੇ ਤੇਰੀ ਪ੍ਰਾਪਤੀ ਨਮਿਤ ਤਪ ਕੋ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦਾ ਦਰਸਨ ਕਰਨ ਲਈ) ਕ੍ਰੋੜਾਂ ਹੀ ਵੱਡੇ ਵੱਡੇ ਤਪੀ ਤਪ ਕਰਦੇ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਪੀਸਰ = ਤਪੀ-ਈਸਰ, ਵੱਡੇ ਵੱਡੇ ਤਪੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por Quien millones de fakires se laceran el cuerpo,"