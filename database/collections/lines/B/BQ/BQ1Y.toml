[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਰਿ ਸਾਹਾ ਪਾਤਿਸਾਹੁ; ਨਿਹਚਲੁ ਚਉਰੁ ਛਤੁ ॥"
page = 964
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art the Emperor over the head of the kings and ever-stable is Thine throne and crown."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਰਾਜਿਆਂ ਦੇ ਸੀਸ ਉਤੇ ਮਹਾਰਾਜਾ ਹੈ ਅਤੇਂ ਸਦੀਵੀ ਸਥਿਰ ਹੈ ਤੇਰਾ ਤਖਤ ਤਾਜ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the Emperor over the heads of kings. Your canopy and chauree (fly-brush) are permanent and unchanging."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਜਸ ਸਰੂਪ ਚੌਰ ਔ ਗਿਆਨ ਰੂਪ ਛਤ੍ਰ ਨਿਸਚਲ ਹੈ, ਤੂੰ ਸਿਰ ਸਾਹਾ ਕੇ ਪਾਤਸਾਹੁ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਚਵਰ ਤੇ ਛਤਰ ਅਟੱਲ ਹੈ, ਤੂੰ (ਦੁਨੀਆ ਦੇ ਸਾਰੇ) ਸ਼ਾਹਾਂ ਦੇ ਸਿਰ ਉਤੇ ਪਾਤਿਸ਼ਾਹ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਰਿ = ਸਿਰ ਉਤੇ। ਛਤੁ = ਛਤਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "eres Rey de reyes, Tu Dosel es Eterno y también el Chauri que ondea sobre Ti."