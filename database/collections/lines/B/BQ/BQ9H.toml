[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਿਰੁ ਉਚਾ ਅਭਿਮਾਨੁ ਵਿਚਿ; ਕਾਲਖ ਭਰਿਆ ਕਾਲੇ ਵਾਲਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Proud head remains erect and high yet it is coveved by the blackness of hair."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਿਰ ਹੰਕਾਰ ਵਿਚ ਉੱਚਾ ਹੈ, ਕਾਲਖ ਦਾ ਭਰਿਆ ਕਾਲੇ ਵਾਲਾਂ ਵਾਲਾ ਹੈ।"