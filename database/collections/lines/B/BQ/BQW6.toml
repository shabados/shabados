[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਇਨਾ ਰੁਪਾ; ਮਾਟੀ ਦਾਮ ॥"
page = 889
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Gold, silver and riches are but dust."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੋਨਾ, ਚਾਂਦੀ ਅਤੇ ਧਨ-ਦੌਲਤ ਨਿਰੀ ਪੁਰੀ ਮਿੱਟੀ ਹੀ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Gold, silver and wealth are just dust."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਇਨਾ ਔ ਚਾਂਦੀ ਆਦਿਕ ਦਾਮ ਰੁਪਯੇ ਸਭ ਮਾਟੀ ਸਰੂਪ ਹੈਂ, ਭਾਵ ਮਿਥ੍ਯਾ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਨਹੀਂ ਸਿਮਰਦਾ, ਤਾਂ) ਸੋਨਾ, ਚਾਂਦੀ, ਰੁਪਇਆ-ਪੈਸੇ (ਤੇਰੇ ਵਾਸਤੇ) ਮਿੱਟੀ (-ਸਮਾਨ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੁਪਾ = ਚਾਂਦੀ। ਦਾਮ = ਰੁਪਏ-ਪੈਸੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "tus riquezas de oro y plata no son más que polvo."