[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹਿਯੋ ਆਜੁ ਤੈ ਦ੍ਰੋਪਤੀ ਧਰਨੀ ਤਲ ਮੈ ਧੰਨ︀ਯ ॥੩੭॥"
page = 1010

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And complimented her saying, ‘You are the supreme.’(37)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਿਹਾ, ਹੇ ਦ੍ਰੋਪਤੀ! ਤੂੰ ਅਜ ਧਰਤੀ ਉਤੇ ਧੰਨ ਹੈਂ ॥੩੭॥"