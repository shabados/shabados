[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿ ਏ ਸ਼ਾਹਿ, ਹੁਸ਼ਿਯਾਰ ਆਜ਼ਾਦ ਮਗ਼ਜ਼ ॥"
page = 1398

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘O, King! You are (man of) unconstrained thinking."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਹਿਣ ਲਗੇ) ਹੇ ਬਾਦਸ਼ਾਹ ਸਲਾਮਤ! ਤੁਸੀਂ ਬਹੁਤ ਸਮਝਦਾਰ ਅਤੇ ਆਜ਼ਾਦ ਦਿਮਾਗ਼ ਵਾਲੇ ਹੋ।"