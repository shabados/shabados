data = "ਕੀਅ ਸੁਚ ਸਰੀਰ ॥੩੨੯॥"
page = 233

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He reached on the bank of Godavari alongwith his heroic brother and there Ram put off his clothes and took a bath, thus cleansing his body.329.­"

