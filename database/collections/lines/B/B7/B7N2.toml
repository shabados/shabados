[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਊ ਗਨੀਐ; ਸਭ ਤੇ ਊਚਾ ॥"
page = 266
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "is counted the highest of all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਸਾਰਿਆਂ ਨਾਲੋਂ ਬੁਲੰਦ ਸਮਝੋ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "shall be accounted as the highest of all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਜਨ ਸਭ ਸੇ ਊਚਾ ਅਰਥਾਤ ਉਤਮ ਗਿਣੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਸਾਰਿਆਂ ਨਾਲੋਂ ਚੰਗਾ ਸਮਝਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਊ = ਉਸੇ ਮਨੁੱਖ ਨੂੰ। ਗਨੀਐ = ਜਾਣੀਏ, ਸਮਝੀਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "será conocido como faro supremo."