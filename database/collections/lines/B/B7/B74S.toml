[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਕਿਉਣ ਜੋ ਅਸਾਣ ਰੱਬ ਦੇ ਬੰਦਿਆਣ ਦੇ ਰਾਹ ਦੀ ਧੂੜ ਨੂੰ ਸੁਰਮਾ ਸਮਝਿਆ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਬਸਕਿ ਖ਼ਾਕਿ ਰਾਹਿ ਮਰਦੁਮ ਤੂਤੀਆ ਫ਼ਹਿਮੀਦਾ ਏਮ ॥੫੪॥੨॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "How fortunate is that eye that has got a glimpse of the face of the Beloved!"