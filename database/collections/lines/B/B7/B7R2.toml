[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਭਾਲਿ; ਵਿਕੁੰਨੀ ਹੋਈ ॥"
page = 145
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In my search, I have become bewildered."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਖੋਜ ਢੂੰਡ ਅੰਦਰ ਮੈਂ ਪਰੇਸ਼ਾਨ ਹੋ ਗਿਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have searched in vain, and I am so confused;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ (ਭਾਲਿ) ਢੂੰਢ ਕਰ (ਵਿਕੁੰਨੀ) ਬਿਆਕੁਲ ਹੋ ਰਹੀ ਹਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਇਸ ਚੰਦ੍ਰਮਾ ਨੂੰ ਲੱਭ ਲੱਭ ਕੇ ਵਿਆਕੁਲ ਹੋ ਗਈ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਮੈ। ਵਿਕੁੰਨੀ = ਵਿਆਕੁਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Buscar en vano me ha vuelto loco, y no puedo ver mi Sendero en la oscuridad."