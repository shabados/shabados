[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਪਿਰੁ ਪਿਆਰਾ. ਮੈ ਨਦਰਿ, ਨ ਦੇਖੈ; ਹਉ. ਕਿਉ ਕਰਿ ਧੀਰਜੁ ਪਾਵਾ ॥"
page = 561
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the dear Spouse does not even cast a glance towards me. How can I be consoled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰੀਤਮ ਪਤੀ ਮੇਰੇ ਵਲ ਝਾਤੀ ਭੀ ਨਹੀਂ ਪਾਉਂਦਾ। ਮੇਰਾ ਹੌਸਲਾ ਕਿਸ ਤਰ੍ਹਾਂ ਬੱਝ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But my Beloved Husband Lord does not even cast a glance in my direction; how can I be consoled?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਜੋ ਪ੍ਯਾਰਾ ਪਤੀ ਮੁਝ ਪਰ ਦ੍ਰਿਸਟ ਦੇ ਕਰ ਦੇਖਤਾ ਹੀ ਨਹੀਂ, ਤੌ ਮੈਂ ਕਿਸ ਪ੍ਰਕਾਰ ਧੀਰਜ ਪਾਊਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਉਹ ਪਿਆਰਾ ਪ੍ਰਭੂ ਮੇਰੇ ਵਲ ਨਿਗਾਹ ਕਰ ਕੇ ਤੱਕਦਾ ਹੀ ਨਹੀਂ ਮੈਂ ਕਿਵੇਂ ਸ਼ਾਂਤੀ ਹਾਸਲ ਕਰ ਸਕਦੀ ਹਾਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧੀਰਜੁ = ਸ਼ਾਂਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero si la Gracia del Señor no está sobre mí, ¿cómo podría complacerlo?"