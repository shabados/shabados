[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਪੂਜਾ; ਜਾ ਕੈ ਹੈ ਧਿਆਨ ॥"
page = 238
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meditating on whom (Him) is equal to millions of worships."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਉਸ) ਦਾ ਸਿਮਰਨ ਕ੍ਰੋੜਾਂ ਹੀ ਉਪਾਸ਼ਨਾ ਦੇ ਤੁੱਲ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating on it is equal to millions of worship ceremonies."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਿਸ ਕੇ ਧਿਆਨ ਕਰਨੇ ਸੇ ਕ੍ਰੋੜੋਂ ਪੂਜਾ ਕਾ ਫਲ੍ਹ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰਮਾਤਮਾ ਦਾ ਧਿਆਨ ਧਰਨ ਵਿਚ ਕ੍ਰੋੜਾਂ ਦੇਵ-ਪੂਜਾ ਆ ਜਾਂਦੀਆਂ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੈ ਧਿਆਨ = ਜਿਸ ਦਾ ਧਿਆਨ ਧਰਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "de abluciones y toda Alabanza."