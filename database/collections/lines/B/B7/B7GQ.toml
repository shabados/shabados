[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕਾ ਦੋਖੀ; ਸਦਾ ਬਿਕਾਰੀ ॥"
page = 280
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints' slanderer, is ever a sinner."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਦਾ ਨਿੰਦਕ ਹਮੇਸ਼ਾਂ ਪਾਪੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slanderer of the Saint is forever corrupt."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਕਾ ਦੋਖੀ ਸਦਾ ਵਿਕਾਰੋਂ ਕੇ ਕਰਨੇ ਹਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਸਦਾ ਮੰਦੇ ਕੰਮ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਕਾਰੀ = ਮੰਦ-ਕਰਮੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y su acontecer es malvado."