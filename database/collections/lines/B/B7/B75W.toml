[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਮਾਰਗੁ ਸਚ ਦਾ; ਪੈਰੀ ਪਵਣਾ ਰਾਜੇ ਰਾਣੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Gurmukh' s way is the way of truth whereby all the kings and emperors fall on his feet."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਇਸੇ ਲਈ ਗੁਰਮੁਖਾਂ ਦਾ ਰਸਤਾ ਸੱਚ ਦਾ ਹੈ, (ਰਾਜੇ) ਵੱਡੇ ਅਤੇ (ਰਾਣੇ) ਛੋਟੇ (ਸਾਰੇ) ਪੈਰੀਂ ਆ ਪੈਂਦੇ ਹਨ।"