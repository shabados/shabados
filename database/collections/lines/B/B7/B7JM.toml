[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਨਾਮੁ ਬੋਹਿਥੁ ਬਡੌ ਕਲਿ ਮੈ; ਭਵ ਸਾਗਰ ਪਾਰਿ ਉਤਾਰਨ ਕਉ ॥੨॥"
page = 1404
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the Dark age, God's Name is a great ship to ferry across the world ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਕਾਲੇ ਯੁਗ ਅੰਦਰ, ਸੰਸਾਰ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਹੋਣ ਲਈ ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ ਇਕ ਵੱਡਾ ਜਹਾਜ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In this Dark Age of Kali Yuga, the Lord's Name is the Great Ship, to carry us all across the terrifying world-ocean, safely to the other side. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਕਲਿਯੁਗ ਮੇਂ ਪੁਰਸ਼ੋਂ ਕੋ ਸੰਸਾਰ ਸਮੁੰਦ੍ਰ ਸੇ ਪਾਰ ਉਤਾਰਨੇ ਕੋ ਬਡਾ (ਬੋਹਿਥੁ) ਜਹਾਜ ਰੂਪ ਹਰਿ ਨਾਮ ਹੀ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਸੰਸਾਰ-ਸਾਗਰ ਤੋਂ ਪਾਰ ਉਤਾਰਨ ਲਈ ਹਰੀ ਦਾ ਨਾਮ ਹੀ ਕਲਜੁਗ ਵਿਚ ਵੱਡਾ ਜਹਾਜ਼ ਹੈ (ਅਤੇ ਉਹ ਨਾਮ ਸਮਰੱਥ ਗੁਰੂ ਤੋਂ ਮਿਲਦਾ ਹੈ) ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੋਹਿਥੁ = ਜਹਾਜ਼। ਕਲਿ ਮੈ = ਕਲਜੁਗ ਵਿੱਚ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En esta Era de oscuridad de Kali, el Nombre del Señor es el Gran Barco, para llevarnos a salvo a través del océano del mundo. (2)"