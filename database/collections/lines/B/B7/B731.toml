[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ; ਮੋ ਕਉ ਹਰਿ ਜਨ ਕਾਰੈ ਲਾਈਐ ॥"
page = 881
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, apply me to the service of the God's slave."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਮੈਨੂੰ ਰੱਬ ਦੇ ਗੋਲੇ ਦੀ ਸੇਵਾ ਅੰਦਰ ਜੋੜ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord, let me work for the humble servants of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਮ! ਮੇਰੇ ਕੋ (ਹਰਿ ਜਨ) ਸੰਤੋਂ ਕੀ ਕਾਰ ਅਰਥਾਤ ਸੇਵਾ ਮੇਂ ਲਾਈਐ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਰਾਮ! ਮੈਨੂੰ (ਆਪਣੇ) ਸੰਤ ਜਨਾਂ ਦੀ ਸੇਵਾ ਵਿਚ ਲਾਈ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਮ = ਹੇ ਰਾਮ! ਮੋ ਕਉ = ਮੈਨੂੰ। ਕਾਰੈ = ਕਾਰ ਵਿਚ, ਸੇਵਾ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, condúceme hasta el Servicio de Tu Santo;"