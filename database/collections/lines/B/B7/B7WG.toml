[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵਣੁ ਜਾਣਾ; ਤੁਮ ਹੀ ਕੀਆ ॥"
page = 563
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Coming and going, Thou hast ordained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੰਮਣਾ ਅਤੇ ਮਰਣਾ ਤੈਂ ਹੀ ਨਿਯੁਕਤ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Coming and going are by Your Will."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਹ ਆਵਾਗਮਨ ਤੁਮ ਨੇ ਹੀ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਜਨਮ ਮਰਨ ਦਾ ਗੇੜ ਤੂੰ ਹੀ ਬਣਾਇਆ ਹੋਇਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਵਣੁ ਜਾਣਾ = ਜਨਮ ਮਰਨ ਦਾ ਗੇੜ"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El ir y venir está sólo en Tu Voluntad,"