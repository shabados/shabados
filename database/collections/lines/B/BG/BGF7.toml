[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਕਲ ਨਾਮ ਸ੍ਰੀ ਪਾਸਿ ਕੇ; ਲੀਜਹੁ ਚਤੁਰ ਪਛਾਨ ॥੨੭੭॥"
page = 730

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Uttering the words “Divaakar Tanuja” in the beginning and then saying the word “Pati” the wise people recognize all the names of Paash.277."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਹ ਪਾਸ ਦੇ ਨਾਮ ਹਨ, ਚਤੁਰ ਲੋਗ ਪਛਾਣ ਲੈਣ ॥੨੭੭॥"