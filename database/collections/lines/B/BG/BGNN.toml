[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲੇ ਬਾਦਿਸਾਹ ਕੇ ਆਗੇ ਧਰੀ ॥੨੦॥"
page = 1166
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nama took and placed it before the emperor."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਨਾਮੇ ਨੇ ਇਸ ਨੂੰ ਲੈ ਕੇ ਪਾਤਿਸ਼ਾਹ ਦੇ ਮੂਹਰੇ ਰਖ ਦਿਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Naam Dayv took it and placed it before the king. ||20||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਵਹੁ ਮਟਕੀ ਲੈ ਕਰ ਕੇ ਬਾਦਸ਼ਾਹਿ ਕੇ ਆਗੇ ਧਰ ਦਈ॥੨੦॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਹ ਲੈ ਕੇ ਬਾਦਸ਼ਾਹ ਦੇ ਅੱਗੇ ਰੱਖ ਦਿੱਤੀ ॥੨੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "puesta ante al Rey, (20)"