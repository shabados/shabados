[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਰਹਰੁ ਲੋਭੁ; ਅਰੁ ਲੋਕਾਚਾਰੁ ॥"
page = 324
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Forsake covetousness and worldly ways."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲਾਲਚ ਅਤੇ ਸੰਸਾਰੀ ਰਸਤਿਆਂ ਨੂੰ ਛੱਡ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Set aside your greed and worldly ways."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਲੋਭ ਕੋ ਔਰ ਜੋ ਲੋਕੋਂ ਕੀ ਪ੍ਰਸਿੰਨਤਾ ਵਾਸਤੇ ਜਪ ਤਪ ਆਦਿ ਕਰਮ ਕਰਤਾ ਹੈਂ ਤਿਨ ਕੋ ਤਿਆਗ ਦੇਹ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਲਾਲਚ, ਵਿਖਾਵੇ ਦਾ ਤਿਆਗ ਕਰ ਦੇਹ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਹਰੁ = {ਸੰ: ਪਰਿ-ਹ੍ਰਿ=ਤਿਆਗ ਦੇਣਾ} ਛੱਡ ਦੇਹ। ਲੋਕਾਚਾਰੁ = ਲੋਕਾਂ ਨੂੰ ਹੀ ਵਿਖਾਉਣ ਵਾਲਾ ਕੰਮ, ਵਿਖਾਵਾ, ਲੋਕ-ਪਤੀਆਵਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Deja tu ansia de tener cosas, y los modos del mundo,"