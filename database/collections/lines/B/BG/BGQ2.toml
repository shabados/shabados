[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਮੋਹੁ ਪਸਰਿਆ ਪਾਸਾਰਾ ॥"
page = 1053
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "stretch out the extension of worldly love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰੀ ਲਗਨ ਦਾ ਖਿਲਾਰਾ ਖਿਲਾਰਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Only extend the extension of attachment to Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੋ ਯਦਪਿ ਬਹੁਤ ਪੜਤੇ ਭੀ ਹੈਂ ਤਦਪਿ ਸਭ ਕੇ ਅੰਤਰ ਮਾਇਆ ਕੇ ਮੋਹ ਕਾ ਹੀ ਪਸਾਰਾ ਪਸਰਿਆ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਉਹਨਾਂ ਵਿਚ) ਮਾਇਆ ਦਾ ਮੋਹ ਹੀ ਹੈ (ਕਰਮ ਕਾਂਡ ਦਾ ਹੀ) ਖਿਲਾਰਾ ਖਿਲਾਰਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero todas éstas abren un panorama muy vasto influenciado por Maya y por las pasiones."