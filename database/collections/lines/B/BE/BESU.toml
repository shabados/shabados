[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਦਾ ਦਿਤਾ; ਸਭੁ ਕਿਛੁ ਲੈਣਾ ॥"
page = 100
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "(Remember the Lord) whose are all the gift which we receive."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "(ਉਸ ਸੁਆਮੀ ਦਾ ਸਿਮਰਣ ਕਰਂ) ਜੀਹਦੀਆਂ ਹਨ ਸਾਰੀਆਂ ਦਾਤਾਂ ਜੋ ਅਸੀਂ ਲੈਂਦੇ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everything we receive is a gift from Him"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਹਾਰਾਜ! ਜਿਸ ਤੇਰਾ ਦੀਆ ਹੂਆ ਹਮ ਜੀਵੋਂ ਨੇ ਸਭ ਕੁਛੁ ਲੈਣਾ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਜਿਸ ਪਰਮਾਤਮਾ ਦਾ ਦਿੱਤਾ ਹੋਇਆ ਸਭ ਕੁਝ ਸਾਨੂੰ ਮਿਲ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los regalos que recibimos vienen del Señor:"