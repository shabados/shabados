[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਦਾਤਿ ਕਰੇ. ਦਾਤਾਰੁ ॥"
page = 1129
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Beneficent Lord Himself gives gifts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੇਣਹਾਰ ਸੁਆਮੀ ਖੁਦ ਹੀ ਬਖਸ਼ੀਸ਼ਾਂ ਬਖਸ਼ਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord, the Great Giver, Himself gives His Gifts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਪਰਮੇਸ੍ਵਰ ਦਾਤਾਰ ਜਿਸ ਕੋ ਭਗਤੀ ਕੀ ਦਾਤਿ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ, ਇਹ ਕਿਸੇ ਦੇ ਵੱਸ ਦੀ ਗੱਲ ਨਹੀਂ) ਨਾਮ ਦੀ ਬਖ਼ਸ਼ਸ਼ ਦਾਤਾਰ ਪ੍ਰਭੂ ਆਪ ਹੀ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੇ = ਆਪ ਹੀ। ਦਾਤਿ = (ਨਾਮ ਦੀ) ਬਖ਼ਸ਼ਸ਼। ਦਾਤਾਰੁ = ਦਾਤਾਂ ਦੇਣ ਵਾਲਾ ਪ੍ਰਭੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Dios Bondadoso, de Sí Mismo, nos da lo que necesitamos."