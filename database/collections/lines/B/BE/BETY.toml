[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਉ ਕਉੜਤਣੁ; ਚੂਕਸਿ ਮਾਇ ॥"
page = 1243
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then shall depart their bitterness, O mother."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਉਨ੍ਹਾਂ ਦਾ ਕਉੜਾ-ਪਣ ਦੂਰ ਹੋ ਜਾਵੇਗਾ, ਹੈ ਮਾਤਾ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then their bitterness shall be gone, O mother."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਮਾਇ) ਹੇ ਭਾਈ! ਤਬ ਦੁਖਾਂ ਰੂਪੀ ਕੌੜਤਣ (ਚੂਕਸਿ) ਉਠ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਹੇ ਮਾਂ! ਵਿਸ਼ੇ-ਭੋਗਾਂ ਤੋਂ ਪੈਦਾ ਹੋਇਆ ਦੁੱਖ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉੜਤਣੁ = ਵਿਸ਼ੇ-ਭੋਗਾਂ ਤੋਂ ਪੈਦਾ ਹੋਇਆ ਦੁੱਖ। ਮਾਇ = ਹੇ ਮਾਂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entonces lo amargo desaparecería de su vida."