[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਜੋ ਭਾਵੈ ਸੋ ਹੋਇ ॥੨॥"
page = 854
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever pleases the Lord, that alone happens, O Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਛ ਸੁਆਮੀ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ, ਕੇਵਲ ਉਹ ਹੀ ਹੁੰਦਾ ਹੈ, ਹੇ ਨਾਨਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, that alone happens, which is pleasing to His Will. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜੋ ਹਰੀ ਕੋ ਭਾਵਤਾ ਹੈ, ਸੋ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੂੰ ਸਮਝ ਆ ਜਾਂਦੀ ਹੈ ਕਿ ਜਗਤ ਵਿਚ) ਉਹੀ ਕੁਝ ਹੁੰਦਾ ਹੈ ਜੋ (ਪਰਮਾਤਮਾ ਨੂੰ) ਚੰਗਾ ਲੱਗਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋ ਭਾਵੈ = ਜੋ ਕੁਝ (ਪਰਮਾਤਮਾ ਨੂੰ) ਚੰਗਾ ਲੱਗਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh, Dice Nanak, lo que el Señor decreta. (2)"