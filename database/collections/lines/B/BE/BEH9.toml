[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਨਿੰਦਕੁ ਨਾਮ ਵਿਹੂਣਿਆ; ਸਤਿਸੰਗ ਨ ਭਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The backbiters being devoid of the neim of the Lord, do not like the holy congregation."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਤਿਹਾ ਹੀ) ਨਿੰਦਕ ਲੋਕ ਨਾਮ ਤੋਂ ਬਿਨਾਂ ਹਨ, ਉਨ੍ਹਾਂ ਨੂੰ ਸਤਿਸੰਗ ਨਹੀਂ ਭਾਉਂਦਾ (ਸਗਮਾਂ ਨਿੰਦਾ ਵਿਖੇ ਲੱਕ ਬੰਨ੍ਹੀ ਰਖਦੇ ਹਨ)।"