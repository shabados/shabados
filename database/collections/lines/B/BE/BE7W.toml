data = "Thou art the illuminator of detachment"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵਿਰਕਤ (ਨਿਰਲੇਪ) ਵਿਅਕਤੀਆਂ ਨੂੰ ਤੂੰ (ਆਪਣੇ ਤੇਜ) ਨਾਲ ਪ੍ਰਕਾਸ਼ਿਤ ਕਰਨ ਵਾਲਾ ਹੈਂ,"