[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਨਘੋਰ ਪ੍ਰੀਤਿ ਮੋਰ ॥"
page = 1272
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The peacock loves the cloud's rumbling,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੋਰ ਬੱਦਲਾਂ ਦੀ ਗਰਜ ਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The peacock loves the thunder of the rain clouds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਬਦਲ ਕਾ (ਘੋਰ) ਸਬਦ ਸੁਨ ਕਰ ਮੋਰ ਕੋ ਪ੍ਰੀਤੀ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਵੇਂ) ਮੋਰ ਦੀ ਪ੍ਰੀਤ ਬੱਦਲਾਂ ਦੀ ਗਰਜ ਨਾਲ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਨਘੋਰ = ਬੱਦਲਾਂ ਦੀ ਗਰਜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Al pavo real le fascinan los truenos y relámpagos de las nubes de lluvia."