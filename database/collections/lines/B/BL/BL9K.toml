[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭਿ ਸੁਖ ਮਾਗੈ; ਨਾਮੁ ਬਿਸਾਰੀ ॥੧॥ ਰਹਾਉ ॥"
page = 222
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that forgetting God's Name, all ask for peace. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿ ਰੱਬ ਦੇ ਨਾਮ ਨੂੰ ਭੁਲਾ ਕੇ ਸਾਰੇ ਹੀ ਆਰਾਮ ਦੀ ਯਾਚਨਾ ਕਰਦੇ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "all beg for peace, but they forget the Naam, the Name of the Lord. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਕੋ ਬਿਸਾਰ ਕਰ ਸਭ ਸੁਖ ਮਾਂਗਤਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਜੇਹੀ (ਖੇਡ ਖੇਡਦਾ ਹੈ ਕਿ) ਸੁਖ ਤਾਂ ਸਾਰੇ ਹੀ ਮੰਗਦਾ ਹੈ, ਪਰ (ਜਿਸ ਨਾਮ ਤੋਂ ਸੁਖ ਮਿਲਦੇ ਹਨ ਉਸ) ਨਾਮ ਨੂੰ ਵਿਸਾਰ ਰਿਹਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭਿ = ਸਾਰੇ। ਬਿਸਾਰੀ = ਵਿਸਾਰ ਕੇ, ਬਿਸਾਰਿ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que los hombres piden tener placeres y se olvidan del Naam, el Nombre del Señor. (1-Pausa)"