[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੇ ਚਰਣ; ਮਨ ਮਾਹਿ ਵਸਾਇ ॥"
page = 1335
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whosoever enshrines the Guru's feet in his mind,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੋਈ ਗੁਰਾਂ ਦੇ ਚਰਨਾ ਨੂੰ ਆਪਣੇ ਰਿਦੇ ਅੰਦਰ ਟਿਕਾ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whoever enshrines the Guru's Feet within his mind,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਮਨ! ਸਤਿਗੁਰੋਂ ਕੇ ਚਰਨੋਂ ਕੋ ਤੂੰ ਅਪਣੇ ਰਿਦੇ ਮੇਂ ਵਸਾਵਣਾ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ (ਸੋਹਣੇ) ਚਰਨ (ਆਪਣੇ) ਮਨ ਵਿਚ ਟਿਕਾਈ ਰੱਖ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਸਾਇ = ਵਸਾਈ ਰੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien enaltece los Pies del Guru en su mente,"