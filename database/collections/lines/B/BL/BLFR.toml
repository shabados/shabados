[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਵਡੁ ਊਚਾ; ਹੋਵੈ ਕੋਇ ॥"
page = 5
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If any one be as great and high as He is"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਕੋਈ ਜਣਾ ਐਡਾ ਵੱਡਾ ਤੇ ਉੱਚਾ ਹੋਵੇ, ਜਿੱਡਾ ਉਹ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Only one as Great and as High as God"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਊਪਰ ਵਡਿਆਈ ਕਹਿ ਆਏ ਹੈਂ, ਜਬ (ਏਵਡੁ) ਇਤਨਾਂ ਵਡਾ ਊਚਾ ਕੋਈ ਹੋਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋਈ ਹੋਰ ਉਸ ਜੇਡਾ ਵੱਡਾ ਹੋਵੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਵਡੁ = ਇਤਨਾ ਵੱਡਾ। ਹੋਵੈ ਕੋਇ = ਜੇ ਕੋਈ ਮਨੁੱਖ ਹੋਵੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Exaltado es el Creador de todo el Juego;"