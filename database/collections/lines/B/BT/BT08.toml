type = "primary"
data = "ਚਰਿਤ ਖੇਲਿ ਯਾ ਕੋ ਪਰਹਰੋ ॥"
page = 836

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘It will be better if I praise her and through dramatisation get rid of her."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਇਸ ਨਾਲ ਚਰਿਤ੍ਰ ਖੇਡ ਕੇ (ਇਸ ਤੋਂ) ਪਿਛਾ ਛੁੜਾਵਾਂ।"