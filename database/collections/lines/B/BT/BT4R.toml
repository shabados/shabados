[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਨਾਨਕ ਕਉ. ਪ੍ਰਭ ਕਿਰਪਾ ਕੀਜੈ; ਕਰਿ ਦਾਸਨਿ ਦਾਸ ਦਸਾਕੀ ॥੪॥੬॥"
page = 668
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, take pity on servant Nanak and make him the slave of the slaves of Thine slaves."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਦਾਸ ਨਾਨਕ ਤੇ ਤਰਸ ਕਰ ਅਤੇ ਉਸ ਨੂੰ ਆਪਣੇ ਗੋਲਿਆਂ ਦੇ ਗੋਲਿਆਂ ਦਾ ਗੋਲਾ ਬਣਾ ਲੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O God, take pity on servant Nanak, and make him the slave of the slave of Your slaves. ||4||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਹੇ ਹਰਿ ਪ੍ਰਭੂ! ਮੈਂ ਜਨ ਕੋ ਐਸੀ ਕ੍ਰਿਪਾ ਕਰੀਏ, ਮੁਝ ਕੋ ਆਪਨੇ ਦਾਸੋਂ ਕੇ ਦਾਸੋਂ ਕਾ ਦਾਸ ਕੀਜੀਏ॥੪॥੬॥☬ਨਾਮ ਔ ਗੁਰੋਂ ਦ੍ਵਾਰਾ ਲਾਭ ਦਿਖਾਵਤੇ ਉਪਦੇਸ਼ ਦੇਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਆਪਣੇ ਦਾਸ ਨਾਨਕ ਉਤੇ ਮੇਹਰ ਕਰ, ਤੇ, ਆਪਣੇ ਦਾਸਾਂ ਦੇ ਦਾਸਾਂ ਦਾ ਦਾਸ ਬਣਾ ਲੈ ॥੪॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ, ਉਤੇ। ਕਰਿ = ਬਣਾ ਲੈ ॥੪॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Señor ten Piedad de Tu Sirviente Nanak y hazlo Esclavo de Tus Esclavos. (4-6)"