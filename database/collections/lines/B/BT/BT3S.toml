data = "ਬਾਲ ਮਤੀ ਕਹ ਸੁ ਕਛੁ ਨ ਕਹਈ ॥੩॥"
page = 878

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "A man called Kandhal used to pursue his wife but he could never check her.(3)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਬਾਲ ਮਤੀ (ਇਸਤਰੀ ਨੂੰ ਉਹ ਜੱਟ) ਕੁਝ ਨਹੀਂ ਕਹਿੰਦਾ ਸੀ ॥੩॥"