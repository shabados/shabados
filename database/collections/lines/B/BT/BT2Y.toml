[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਪਦੇਸੁ ਕਰੈ. ਆਪਿ ਨ ਕਮਾਵੈ; ਤਤੁ ਸਬਦੁ. ਨ ਪਛਾਨੈ ॥"
page = 380
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He imparts instruction, but himself practises not. He realises not the quintessence of the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਿਖ ਮਤ ਦਿੰਦਾ ਹੈ, ਪਰ ਖ਼ੁਦ ਅਮਲ ਨਹੀਂ ਕਰਦਾ। ਉਹ ਨਾਮ ਦੇ ਸਾਰ ਨੂੰ ਅਨੁਭਵ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He teaches, but does not practice what he preaches; he does not realize the essential reality of the Word of the Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਕਮਾਉਤਾ ਨਹੀਂ ਲੋਗੋਂ ਕੋ ਉਪਦੇਸ਼ ਕਰਤਾ ਹੈ ਔਰ ਤਤ੍ਵ ਸਰੂਪ ਜੋ (ਸਬਦ) ਬ੍ਰਹਮ ਹੈ ਤਿਸ ਕੋ ਨਹੀਂ ਪਛਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਹੋਰਨਾਂ ਨੂੰ ਤਾਂ (ਧਰਮ ਦਾ) ਉਪਦੇਸ਼ ਕਰਦਾ ਰਹੇ ਪਰ ਆਪਣਾ ਧਾਰਮਿਕ ਜੀਵਨ ਨਾਹ ਬਣਾਏ, ਤੇ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤਿ ਸਾਲਾਹ ਦੀ ਬਾਣੀ ਦੀ ਸਾਰ ਨ ਸਮਝੇ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Instruye a otros, pero no practica lo que enseña y no conoce la Quintaesencia de la Palabra. Dice Nanak, así como vino,"