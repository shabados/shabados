[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੁ ਸੰਸਾਰੁ ਸਗਲ ਹੈ ਸੁਪਨੋ; ਦੇਖਿ ਕਹਾ ਲੋਭਾਵੈ ॥"
page = 1231
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This world is all a dream, so why are thou coveted on beholding it?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਦੁਨੀਆਂ ਸਮੂਹ ਸੁਫਨਾ ਹੀ ਹੈਠ ਇਸ ਨਹੀਂ ਇਸ ਨੂੰ ਵੇਖ ਤੂੰ ਕਿਉਂ ਲੁਭਾਇਮਾਨ ਹੋ ਗਿਆ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This whole world is just a dream; why does seeing it fill you with greed?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੰਸਾਰ ਸਭ ਸੁਪਨਾ ਰੂਪ ਹੈ, ਇਸ ਕੋ ਦੇਖ ਕਰ ਕਾਹੇ ਕੋ ਲੋਭਾਇ ਰਹਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਾਰਾ ਜਗਤ ਸੁਪਨੇ ਵਾਂਗ ਹੈ, ਇਸ ਨੂੰ ਵੇਖ ਕੇ, ਪਤਾ ਨਹੀਂ, ਮਨੁੱਖ ਕਿਉਂ ਲੋਭ ਵਿਚ ਫਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲ = ਸਾਰਾ। ਦੇਖਿ = ਵੇਖ ਕੇ। ਕਹਾ = ਕਿਉਂ? ਲੋਭਾਵੈ = ਲੋਭ ਵਿਚ ਫਸਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Este mundo es sólo un sueño, ¿Cómo entonces el ser humano es engañado en él?"