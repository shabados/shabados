data = "ਸੋਰਠਿ ਮਹਲਾ ੫ ਪੰਚਪਦਾ ॥"
page = 616
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sorath 5th Guru. Panchpada."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੋਰਠਿ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ। ਪੰਚਪਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sorat'h, Fifth Mehl, Panch-Padhay:"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sorath, Mejl Guru Aryan, Quinto Canal Divino, Panch-Pada."

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੰਚਪਦਾ = ਪੰਜ 'ਬੰਦਾਂ' ਵਾਲਾ ਸ਼ਬਦ।"