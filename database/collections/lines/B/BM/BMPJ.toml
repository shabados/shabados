[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਬੁ ਲੋਭੁ ਜੇ ਕੂੜੁ ਕਮਾਵੈ ॥"
page = 1411
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "However, whosoever practises greed, avarice and falsehood,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੰਤੂ ਜੋ ਕੋਈ ਲਾਲਚ ਤਮ੍ਹਾਂ ਅਤੇ ਝੂਠ ਦੀ ਕਮਾਈ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whoever practices greed, possessiveness and falsehood,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਲਬ, ਲੋਭ ਤਥਾ ਝੂਠ ਕਉ ਕਮਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਜਿਹੜਾ ਮਨੁੱਖ ਲੱਬ ਲੋਭ ਅਤੇ ਹੋਰ ਠੱਗੀ ਆਦਿਕ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien tenga avaricia en su corazón, sea posesivo y viva en la falsedad,"