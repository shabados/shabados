[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੜਿਆ ਅਣਪੜਿਆ; ਪਰਮ ਗਤਿ ਪਾਵੈ ॥੧॥"
page = 197
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "obtains the Supreme Dignity whether he is educated or uneducated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਭਾਵੇਂ ਇਲਮਦਾਰ ਹੋਵੇ ਜਾਂ ਅਨ-ਪੜ੍ਹ ਮਹਾਨ ਮਰਤਬੇ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "whether educated or uneducated, obtains the state of supreme dignity. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੜਾ ਹੂਆ ਹੋਵੇ ਵਾ ਅਨਪੜ ਹੋ ਸੋ ਅਵਸ ਮੋਖ ਕੋ ਪਾਵਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਚਾਹੇ ਵਿਦਵਾਨ ਹੋਵੇ ਚਾਹੇ ਵਿੱਦਿਆ-ਹੀਨ, ਉਹ ਸਭ ਤੋਂ ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ਹਾਸਲ ਕਰਦਾ ਲੈਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਮ ਗਤਿ = ਸਭ ਤੋਂ ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "letrado o iletrado, se remonta al más elevado Estado de Éxtasis.(1)"