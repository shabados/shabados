[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੂੜੁ ਮੰਡਪ. ਕੂੜੁ ਮਾੜੀ; ਕੂੜੁ ਬੈਸਣਹਾਰੁ ॥"
page = 468
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "False is the mansion, false the sky-scraper and false is the dweller therein."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਝੂਠਾ ਹੈ ਮਹਿਲ, ਝੂਠੀ ਹੀ ਉਚੀ ਅਟਾਰੀ ਅਤੇ ਝੂਠਾ ਹੈ ਅੰਦਰ ਰਹਿਣ ਵਾਲਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "False is the mansion, false are the skyscrapers; false are those who live in them."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਮੰਡਪ) ਅਸਥਾਨ (ਮਾੜੀ) ਮੰਦਰ ਔਰ ਤਿਨ ਮੇਂ ਬੈਠਨੇ ਹਾਰੇ ਸੋ ਸਭ ਝੂਠ ਰੂਪ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਜਗਤ ਵਿਚ ਕਿਤੇ ਇਹਨਾਂ ਰਾਜਿਆਂ ਦੇ) ਸ਼ਾਮਿਆਨੇ ਤੇ ਮਹਲ ਮਾੜੀਆਂ (ਹਨ, ਇਹ) ਭੀ ਛਲ ਰੂਪ ਹਨ, ਤੇ ਇਹਨਾਂ ਵਿਚ ਵੱਸਣ ਵਾਲਾ (ਰਾਜਾ) ਭੀ ਛਲ ਹੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਡਪ = ਸ਼ਾਮਿਆਨੇ। ਮਾੜੀ = ਮਹਲ। ਬੈਸਣਹਾਰੁ = (ਮਹਲ ਵਿਚ) ਵੱਸਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Falso es el palacio, falsos son los rascacielos, falsos son los que viven en ellos."