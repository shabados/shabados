[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤ ਜਨਾਂ ਲੇ. ਉਧਰਿਆ ਪਾਰਿ ॥੨੭॥"
page = 1166
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Taking the pious persons with him, Nama ferried across the world-ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤ੍ਰ ਪੁਰਸ਼ਾਂ ਨੂੰ ਨਾਲ ਲੈ ਕੇ ਨਾਮਾ ਸੰਸਾਰ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਹੋ ਗਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The humble devotees were saved and carried across with him. ||27||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮਾ ਔਰ ਭਗਤ ਜਨਾਂ ਕੋ ਪਾਰ ਲੇ ਗ੍ਯਾ ਅਰੁ ਆਪ ਭੀ ਉਧਰਿ ਗਿਆ ਹੈ॥੨੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਪ੍ਰਭੂ ਨੇ ਆਪਣੇ ਭਗਤਾਂ ਨੂੰ, ਆਪਣੇ ਸੇਵਕਾਂ ਨੂੰ ਚਰਨੀਂ ਲਾ ਕੇ ਪਾਰ ਕਰ ਦਿੱਤਾ ਹੈ ॥੨੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues Dios lleva a través a todos Sus Devotos. (27)"