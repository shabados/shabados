[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਹੁ; ਏਕੁ ਨਿਰੰਜਨ ਸੋਊ ॥"
page = 1004
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meditate thou on the one immaculate Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਉਸ ਇਕ ਪਵਿੱਤ੍ਰ ਪ੍ਰਭੂ ਦਾ ਆਰਾਧਨ ਕਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate in remembrance on the One Immaculate Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਏਕ ਨਿਰੰਜਨ ਜੋ ਹੈ, ਸੋਈ ਤੁਮ ਸਿਮਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸੇ ਨਿਰਲੇਪ ਪਰਮਾਤਮਾ ਦਾ ਸਿਮਰਨ ਕਰਦੇ ਰਹੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰੰਜਨ = {ਨਿਰ-ਅੰਜਨ। ਅੰਜਨ = ਮਾਇਆ ਦੇ ਮੋਹ ਦੀ ਕਾਲਖ} ਨਿਰਲੇਪ। ਸੋਊ = ਉਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Contempla al Dios Inmaculado,"