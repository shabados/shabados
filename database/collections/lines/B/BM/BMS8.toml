[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਜੈ ਭਾਇ ਪੜੈ; ਨਹੀ ਬੂਝੈ ॥"
page = 127
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who reads about the love of duality understands not the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਦਵੈਤ-ਭਾਵ ਦੇ ਬਾਰੇ ਵਾਚਦਾ ਹੈ, ਉਹ ਸੁਆਮੀ ਨੂੰ ਨਹੀਂ ਸਮਝਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who reads, while attached to duality, does not understand."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਦੂਜੈ ਭਾਇ ਕਰ ਸਾਸਤ੍ਰੋਂ ਕੋ ਪੜਤਾ ਹੈ, ਸੋ ਧਰਮ ਅਧਰਮ ਕੋ ਨਹੀਂ ਸਮਝਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਮਾਇਆ ਦੇ ਪਿਆਰ ਵਿਚ ਫਸਿਆ ਹੋਇਆ ਹੈ, ਉਹ (ਜੇ ਧਾਰਮਿਕ ਪੁਸਤਕਾਂ) ਪੜ੍ਹਦਾ (ਭੀ) ਹੈ ਤਾਂ ਉਹਨੂੰ ਨੂੰ ਸਮਝਦਾ ਨਹੀਂ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que lee de la dualidad, no conoce al Uno, y las tres Gunas de Maya lo hacen aullar,"