[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵੇਲਿ ਕਤਾਇ ਵੁਣਾਈਐ; ਪੜਦਾ ਕਜਣ ਕਪੜੁ ਪ੍ਰਾਣੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "From cotton, after ginning and spinning, cloth is prepared which covers nudity of the people."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਕਪਾਹ) ਵੇਲ ਕੱਤਕੇ ਉਣਾਈਦੀ ਹੈ, ਫੇਰ ਪ੍ਰਾਣੀਆਂ ਦਾ ਪੜਦਾ ਬੱਜਣ ਅਰ ਕੱਪੜੇ ਬਣਦੀ ਹੈ।"