[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਬ ਤਜੇ ਪ੍ਰਾਣ ਮੁਨ ਬਰ ਉਦਾਰ ॥"
page = 202

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the king pulled out Shravan from the pool, then that ascetic breathed his last."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦੇ ਮਹਾਨ ਮੁਨੀ ਨੇ ਪ੍ਰਾਣ ਤਿਆਗ ਦਿੱਤੇ।"