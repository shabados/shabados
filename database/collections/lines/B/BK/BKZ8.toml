[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਜਾ ਅਵਰ ਤ੍ਰਿਯਾਨ ਬੁਲਾਵੈ ॥"
page = 851

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Raja in fact knew all these happenings but the foolish woman had not discerned."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਜਾ ਹੋਰਨਾਂ ਔਰਤਾਂ ਨੂੰ ਬੁਲਾਉਂਦਾ ਸੀ"