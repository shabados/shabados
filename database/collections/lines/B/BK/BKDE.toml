[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖੇ ਮਨੁ ਨਿਰਮਲੁ ਹੋਆ; ਨਿਰਮਲ ਹਰਿ ਗੁਣ ਗਾਏ ਰਾਮ ॥"
page = 770
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the Guru's grace, their mind becomes pure and they sing the Lord's immaculate praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਉਨ੍ਹਾਂ ਦਾ ਹਿਰਦਾ ਸ਼ੁੱਧ ਹੋ ਜਾਂਦਾ ਹੈ ਅਤੇ ਉਹ ਪਵਿੱਤਰ ਜੱਸ ਗਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mind of the Gurmukh is immaculate and pure; she sings the Immaculate Praises of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੋ ਮੁਖ ਹੈਂ ਤਿਨੋਂ ਕੇ ਉਪਦੇਸ਼ ਕਰ ਕੇ ਮਨ ਨਿਰਮਲ ਹੂਆ ਹੈ। ਕਾਹੇ ਤੇ? ਨਿਰਮਲ ਕਰਨੇ ਵਾਲੇ ਹਰੀ ਰਾਮ ਕੇ ਜੋ ਗੁਣ ਗਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਪਰਮਾਤਮਾ ਦੇ ਪਵਿਤ੍ਰ ਗੁਣ ਗਾ ਗਾ ਕੇ ਉਹਨਾਂ ਦਾ ਮਨ ਪਵਿਤ੍ਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖੇ = ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿ ਕੇ। ਗਾਏ = ਗਾਇ, ਗਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La mente del Gurmukj es Inmaculada y Pura, pues ella canta la Alabanza Inmaculada del Señor,"