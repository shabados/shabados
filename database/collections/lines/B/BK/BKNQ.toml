[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤੁ ਨਹੀ ਕਿਛੁ ਪਾਰਾਵਾਰਾ ॥"
page = 277
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He has no end or limits."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਕੋਈ ਅਖੀਰ ਜਾਂ ਹੱਦਬੰਨਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has no end or limitation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਪਾਰਵਾਰ ਕਾ ਕਿਛ ਅੰਤ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੀ ਤਾਕਤ) ਦਾ ਕੋਈ ਹੱਦ-ਬੰਨਾ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਰਾਵਾਰਾ = ਪਾਰ ਤੇ ਅਵਾਰ, ਪਾਰਲਾ ਤੇ ਉਰਲਾ ਬੰਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él no tiene fin o límite."