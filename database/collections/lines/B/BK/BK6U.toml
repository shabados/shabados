data = "ਤਾ ਕੌ ਗੈਵਰ ਮਤ ਕੋ; ਕਬਹੂੰ ਤ੍ਰਾਸ ਨ ਹੋਇ ॥੮॥"
page = 919

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘He would never be frightened ofthe elephant.’ (8)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਮਸਤ ਹਾਥੀ ('ਗੈਵਰ') ਦਾ ਡਰ ਕਦੇ ਵੀ ਨਹੀਂ ਹੋਏਗਾ ॥੮॥"