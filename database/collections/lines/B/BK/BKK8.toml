[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੀਤੁ ਹਮਾਰਾ ਸੋਈ ਸੁਆਮੀ ॥"
page = 1071
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the Lord, is my Friend."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਹਿਬ ਮੇਰਾ ਮਿੱਤ੍ਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My Lord and Master is my best friend."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੋਈ ਸੁਆਮੀ ਹਮਾਰਾ ਮੀਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਮਾਲਕ-ਪ੍ਰਭੂ ਅਸਾਂ ਜੀਵਾਂ ਦਾ (ਅਸਲ) ਮਿੱਤਰ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, nuestro Maestro, es nuestro mejor Amigo"