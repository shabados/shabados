[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੁਕਮੀ; ਸਗਲ ਕਰੇ ਆਕਾਰ ॥"
page = 150
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Commander has created the entire creation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਾਕਮ ਨੂੰ ਸਮੁਹ ਰਚਨਾ ਰਚੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord, by the Hukam of His Command, has created the entire creation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੁਕਮੀ ਪਰਮੇਸ੍ਵਰ ਨੇ ਸਰਬ ਸਰੀਰ ਰਚੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜੀਅ-ਜੰਤ ਪ੍ਰਭੂ ਆਪ ਹੀ ਆਪਣੇ ਹੁਕਮ-ਅਨੁਸਾਰ ਪੈਦਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਕਾਰ = ਸਰੂਪ, ਜੀਅ ਜੰਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor por su poder y fuerza , a creado todo."