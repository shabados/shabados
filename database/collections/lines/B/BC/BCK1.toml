data = "ਮਨੋ ਸਿੰਧ ਗੰਗੰ ॥"
page = 51

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors are meeting with their lances like the Ganges with the sea."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਸਮੁੰਦਰ ਨਾਲ ਗੰਗਾ ਮਿਲ ਗਈ ਹੋਵੇ।"