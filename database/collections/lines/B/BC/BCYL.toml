data = "ਜਨ ਨਾਨਕ. ਨਾਮੁ ਧਿਆਇਆ ॥"
page = 626
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When slave Nanak, meditated on the Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਗੋਲੇ ਨਾਨਕ ਨੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕੀਤਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Servant Nanak meditates on the Naam, the Name of the Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਜਾਂ ਨਾਮ ਕੋ ਧਿਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਾਸ ਨਾਨਕ! (ਆਖ-ਜਦੋਂ ਭੀ ਕਿਸੇ ਨੇ) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਿਆ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, ahora que habito en el Nombre del Perfecto Señor,"