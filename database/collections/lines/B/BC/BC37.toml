[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਸੈ ਥੋੜਾ. ਕਿਸੈ ਅਗਲਾ; ਖਾਲੀ ਕੋਈ ਨਾਹਿ ॥"
page = 1238
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some the Lord blesses with more and some with less, but no one departs unrewarded."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈਆਂ ਨੂੰ ਸੁਆਮੀ ਬਹੁਤਾ ਬਖਸ਼ਦਾ ਹੈ ਤੇ ਕਈਆਂ ਨੂੰ ਘਟ, ਪ੍ਰੰਤੂ ਕੋਈ ਭੀ ਸੱਖਣੀ ਹੱਥੀ ਨਹੀਂ ਮੁੜਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some have less, and some have more; no one is allowed to leave empty."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਸੀ ਕੋ ਥੋੜਾ ਕਿਸੀ ਕੋ ਬਹੁਤਾ ਹੈ, ਪਰੰਤੂ ਧੰਧੇ ਸੇ ਖਾਲੀ ਕੋਈ ਨਹੀਂ ਰਹਿਤਾ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਜੀਵ (ਮਾਇਆ ਦੇ ਧੰਧੇ ਤੋਂ) ਬਚਿਆ ਹੋਇਆ ਨਹੀਂ, ਕਿਸੇ ਨੂੰ ਥੋੜ੍ਹਾ ਤੇ ਕਿਸੇ ਨੂੰ ਬਹੁਤਾ (ਧੰਧਾ ਉਸ ਨੇ ਚਮੋੜਿਆ ਹੋਇਆ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਲਾ = ਬਹੁਤਾ (ਧੰਧਾ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A algunos los bendice con más y a otros con menos, pero nadie se va con las manos vacías de Su Puerta."