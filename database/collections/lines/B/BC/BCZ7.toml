[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ; ਅਪਣਿਆ ਸੰਤਾ ਦੇਵਹਿ ॥"
page = 626
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To His saints, the Lord gives everything."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਸਾਧੂਆਂ ਨੂੰ ਸਾਹਿਬ ਹਰ ਵਸਤੂ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God gives to His Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਸਦਾ ਅਪਨਿਆਂ ਸੰਤਾਂ ਕੋ ਦੇਤਾ ਹੈ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੇ ਸੰਤਾਂ ਨੂੰ (ਆਪ ਸਭ ਕੁਝ) ਦੇਂਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਦੇਵਹਿ = ਤੂੰ ਦੇਂਦਾ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así los Santos del Señor son bendecidos."