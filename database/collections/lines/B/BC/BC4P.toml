[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਇਕ ਮਨਿ ਇਕੁ, ਅਰਾਧਨਿ ਓਈ ॥੯॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They (Gurmukhs) now with stable mind adore the One (Lord)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਇਕ (ਪਰਮਾਤਮਾ ਦਾ ਹੀ) ਇਕ ਮਨ ਹੋਕੇ ਓਹ ਅਰਾਧਨ ਕਰਦੇ ਹਨ (ਹੋਰ ਸ਼ਗਨਾਂ ਆਦਿ ਝੂਠੇ ਕੰਮਾਂ ਵਿਖੇ ਨਹੀਂ ਫਸਦੇ)।"