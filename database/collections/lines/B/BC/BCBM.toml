[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਵਨ ਰੂਪੁ; ਸਿਮਰਣੁ ਪ੍ਰਭ ਤੇਰਾ ॥"
page = 743
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Life-giving is Thine contemplation, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿੰਦਗੀ-ਬਖਸ਼ਣ ਵਾਲੀ ਹੈ ਤੇਰੀ ਬੰਦਗੀ, ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your meditation and remembrance is life-giving, God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰਾ ਸਿਮਰਣ ਹੀ ਜੀਵਨ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰਾ ਨਾਮ ਸਿਮਰਨਾ (ਅਸਾਂ ਜੀਵਾਂ ਵਾਸਤੇ) ਆਤਮਕ ਜੀਵਨ ਦੇ ਬਰਾਬਰ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, Tu Meditación es dadora de vida,"