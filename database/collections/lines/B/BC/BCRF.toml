[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਨਾਮੁ; ਸਿਮਰਿ ਰਤਨਾਗਰੁ ॥੧॥"
page = 744
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "meditate thou on the Name of the Lord Master, the mine of jewels,."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀਰਿਆਂ ਦੀ ਕਾਣ ਸੁਆਮੀ ਮਾਲਕ ਦੇ ਨਾਮ ਦਾ ਆਰਾਧਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remember in meditation the Name of the Lord, Har, Har, the source of jewels. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਹਰਿ ਨਾਮ ਰਤਨ, ਭਾਵ ਵੈਰਾਗਾਦਿਕੋਂ ਕੀ ਖਾਣ ਸਿਮਰਿਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਤਨਾਂ ਦੀ ਖਾਣਿ ਹਰਿ-ਨਾਮ ਸਿਮਰ ਸਿਮਰ ਕੇ (ਮਨੁੱਖ ਦਾ ਉਧਾਰ ਹੁੰਦਾ ਹੈ) ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਮਰਿ = ਸਿਮਰ ਕੇ। ਰਤਨਾਗਰੁ = {रत्नाकर} ਰਤਨਾਂ ਦੀ ਖਾਣਿ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "recuerda en Meditación el Nombre del Señor, Jar, Jar, la Mina de Joyas. (1)"