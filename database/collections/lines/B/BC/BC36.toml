[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਧਸੰਗਤਿ ਭੈ ਭਾਇ ਵਿਚਿ; ਭਗਤਿ ਵਛਲੁ ਕਰਿ ਅਛਲੁ ਛਲਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In the discipline and love of the holy congregation they fascinate the Lord God also."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਵਿਖੇ (ਦੇਵੀ) ਭੈ ਅਰ ਪ੍ਰੇਮਾ ਭਗਤੀ ਦੇ ਨਾਲੇ ਭਗਤ ਵਛਲ ਜੋ ਕਿਸੇ ਥੋਂ ਛਲਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ, ਉਸਨੂੰ ਛਲ ਲੈਂਦੇ ਹਨ ਪ੍ਰਕਾਰ ਪਿਛੇ ਕਹਿ ਆਏ ਹਾਂ)।"