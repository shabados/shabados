[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛਪਨ ਕੋਟਿ; ਜਾ ਕੇ ਖੇਲ ਖਾਸੀ ॥੧॥"
page = 1161
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and whose courtiers are fifty six millions."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਛਪੰਜਾਂ ਕ੍ਰੋੜ ਹਨ ਜਿਸ ਦੇ ਅਹਿਲਕਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and 56,000,000 attendants. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਸਾਥ (ਖਾਸੀ) ਖਾਸਗੀ ਯਾਰ ਖੇਲਨੇ ਵਾਲੇ ਛਿਪੰਜਾ ਕ੍ਰੋੜ ਜਾਦਵ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਛਵੰਜਾ ਕਰੋੜ ਜਿਸ ਦੇ ਮੁਸਾਹਿਬ (ਤੂੰ ਦੱਸਦਾ ਹੈਂ, ਉਸ ਦੇ ਦਰਬਾਰ ਤਕ) ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖੇਲ ਖਾਸੀ = ਖ਼ਾਸ ਖ਼ੈਲ, ਹਾਜ਼ਰ-ਬਾਸ਼, ਮੁਸਾਹਿਬ।॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "cada uno con cincuenta y cinco legiones más. (1)"