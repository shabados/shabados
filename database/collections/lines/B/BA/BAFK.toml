[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਕ ਠਾਢੇ ਭਏ ਘਿਘਿਯਾਤ ਬਲੀ; ਤ੍ਰਿਨ ਕੋ ਦੁਹੂ ਦਾਤਨ ਮੈ ਗਹਿ ਕੈ ॥੨੨੯੫॥"
page = 529

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Begged for protection and many warriors, holding the blades of grass in their teeth stood imploring humbly.2295."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਈ) ਇਕ ਦੰਦਾਂ ਵਿਚ ਘਾਹ ਲੈ ਕੇ ਤਰਲੇ ਕਰਦੇ ਹੋਏ ਖੜੋਤੇ ਹਨ ॥੨੨੯੫॥"