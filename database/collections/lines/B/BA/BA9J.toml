[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਹੁ; ਅਬਿਨਾਸੀ ਰਾਇਆ ॥"
page = 206
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Imperishable King,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਓ ਮੇਰੇ ਸਦੀਵੀ ਸਥਿਰ ਪਾਤਸ਼ਾਹ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Eternal King."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਓਹੁ) ਹੇ ਅਬਨਾਸ਼ੀ ਰਾਜਾ ਪਰਮੇਸ੍ਵਰ! ਸਰਬ ਰੂਪ ਤੂੰ  ਆਪ ਹੀ ਹੋ ਰਹਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਇਕ) ਉਹ ਰਾਜਾ ਹੈਂ ਜੋ ਕਦੇ ਨਾਸ ਹੋਣ ਵਾਲਾ ਨਹੀਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਇਆ = ਰਾਜਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el Señor Eterno,"