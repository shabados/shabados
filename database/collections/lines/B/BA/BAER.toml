[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮੇਰੇ ਗਹੁ; ਹਰਿ ਨਾਮ ਕਾ ਓਲਾ ॥"
page = 179
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, hold fast the prop of God 's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ! ਰੱਬ ਦੇ ਨਾਮ ਦਾ ਆਸਰਾ ਘੁਟ ਕੇ ਪਕੜ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, hold tight to the Support of the Lord's Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਹਰੀ ਨਾਮ ਕਾ ਆਸਰਾ ਲੇਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਆਸਰਾ ਫੜ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਹੁ = ਫੜ। ਓਲਾ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, busca el Refugio del Naam, el Nombre del Señor,"