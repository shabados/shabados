[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਬਿਆਪਤ; ਬਹੁ ਪਰਕਾਰੀ ॥"
page = 182
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mammon effects in many ways."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੋਹਨੀ ਕਈ ਤਰੀਕਿਆਂ ਨਾਲ ਅਸਰ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Maya torments us in so many ways."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਗਵਨ! ਬਹੁਤ ਪ੍ਰਕਾਰੋਂ ਕਰ ਕੇ ਮਾਇਆ ਬਿਆਪ ਰਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! (ਤੇਰੀ ਰਚੀ) ਮਾਇਆ ਅਨੇਕਾਂ ਤਰੀਕਿਆਂ ਨਾਲ (ਜੀਵਾਂ ਉਤੇ) ਪ੍ਰਭਾਵ ਪਾਈ ਰੱਖਦੀ ਹੈ, (ਤੇ ਆਤਮਕ ਮੌਤੇ ਜੀਵਾਂ ਨੂੰ ਮਾਰ ਦੇਂਦੀ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਹੁ ਪਰਕਾਰੀ = ਕਈ ਤਰੀਕਿਆਂ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Maya nos atormenta de muchas formas;"