[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੀ ਮਹਿਮਾ; ਕਥਨੁ. ਨ ਜਾਇ ॥"
page = 864
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Guru's glory one can utter not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਪ੍ਰਭਤਾ ਕੋਈ ਵਰਣਨ ਨਹੀਂ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru's glory cannot be described."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਮਹਿਮਾ ਕਥੀ ਨਹੀਂ ਜਾਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰੂ ਦੀ ਵਡਿਆਈ ਬਿਆਨ ਨਹੀਂ ਕੀਤੀ ਜਾ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਹਿਮਾ = ਵਡਿਆਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno no podría recitar la Alabanza del Guru,"