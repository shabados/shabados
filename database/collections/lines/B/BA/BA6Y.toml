[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚਾਰਿ ਪਦਾਰਥਿ ਭਿਖ; ਫਕੀਰਾਂ ਪਾਵਣੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They give in charity the four riches (char padarathi) to the beggars."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਚਾਰ ਪਦਾਰਥ (ਧਰਮ, ਅਰਥ, ਕਾਮ, ਮੋਖ) ਦੀ ਭਿੱਖਯਾ 'ਫਕੀਰ' (ਪਰਮੇਸ਼ੁਰ ਦੇ ਪ੍ਯਾਰਿਆਂ ਸਿੱਖਾਂ ਨੇ ਜਗ੍ਯਾਸੂਆਂ) ਨੂੰ ਪਾਉਣੀ ਹੈ।"