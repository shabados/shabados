[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨੇ ਜਨ ਸੰਗਿ ਰਾਤੇ ॥"
page = 1278
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He ever loves His slave,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦਾ ਹੀ ਆਪਣੇ ਗੋਲੇ ਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His humble servants are imbued with His Love."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਦਾਸ ਕੇ ਸੰਗ (ਰਾਤੇ) ਪ੍ਰੀਤ ਕਰਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਜੀ ਆਪਣੇ ਸੇਵਕਾਂ ਨਾਲ ਰੱਤੇ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗਿ = ਨਾਲ। ਰਾਤੇ = ਰੱਤੇ ਹੋਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sus humildes Sirvientes viven inmersos en Su Amor"