[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਤਿਸੁ ਮਰਣੁ; ਨ ਆਵਣੁ ਜਾਣੁ ॥"
page = 686
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He dies not nor suffers he transmigration."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਰਦਾ ਨਹੀਂ, ਨਾਂ ਹੀ ਉਹ ਆਵਾਗਉਣ ਵਿੱਚ ਪੈਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Thereafter, one does not die, and does not come and go in reincarnation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਮਿਲਾਪ ਵਾਲੇ ਕੌ ਨਾ ਤੋ ਜਨਮ, ਮ੍ਰਿਤੂ ਹੀ ਹੋਤਾ ਹੈ ਔਰ ਨਾ ਜੋਨੀਓਂ ਮੇਂ ਆਵਣਾ, ਜਾਣਾ ਹੋਤਾ ਹੈ; ਵਾ ਮਨ ਦਾ ਆਵਣ ਜਾਣ ਨਹੀਂ ਹੋਤਾ, ਭਾਵ ਸੰਕਲਪ ਮਿਟ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਨੁੱਖ ਨੂੰ ਨਾਹ ਆਤਮਕ ਮੌਤ ਆਉਂਦੀ ਹੈ, ਨਾਹ ਹੀ ਜਨਮ ਮਰਨ ਦਾ ਗੇੜ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਰਣੁ = ਆਤਮਕ ਮੌਤ। ਆਵਣੁ ਜਾਣੁ = ਜਨਮ ਮਰਨ ਦਾ ਗੇੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en Verdad, a través de un Estado de Equilibrio, sólo y entonces ese ser no morirá,"