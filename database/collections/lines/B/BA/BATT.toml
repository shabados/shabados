[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਚਿਐ ਟਪਿਐ; ਭਗਤਿ. ਨ ਹੋਇ ॥"
page = 159
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By dancing and jumping Lord's worship is not performed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਿਰਤਕਾਰੀ ਕਰਨ ਤੇ ਕੁੱਦਣ ਨਾਲ ਪ੍ਰਭੂ ਦੀ ਪੂਜਾ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By dancing and jumping, devotional worship is not performed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਨਚਣੇ ਟਪਣੇ ਕਰ ਕੇ ਭਗਤੀ ਨਹੀਂ ਹੋਤੀ॥☬ਪ੍ਰਸ਼ਨ: ਕੈਸੇ ਹੋਤੀ ਹੈ?☬ਉੱਤ੍ਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨੱਚਣ ਟੱਪਣ ਨਾਲ ਭਗਤੀ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Simplemente por bailar, uno no alaba al Señor,"