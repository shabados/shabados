[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਨਾਮ ਜਪਿ; ਏਕੰਕਾਰੁ ॥"
page = 185
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "if thou repeat the Name of the only One omnipresent Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਤੂੰ ਕੇਵਲ ਇਕ ਸਰਬ-ਵਿਆਪਕ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰੇਂਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "if you chant the Name of the One and Only Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੋ ਏਕੰਕਾਰ ਰਾਮ ਨਾਮ ਕੇ (ਜਪਿ) ਜਪਣੇ ਵਾਲੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪ, ਇਕ ਓਅੰਕਾਰ ਨੂੰ ਸਿਮਰਦਾ ਰਹੁ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si alaban el nombre del Único y Verdadero Dios,"