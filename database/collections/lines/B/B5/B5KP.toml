[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧੋ; ਕਉਨ ਜੁਗਤਿ ਅਬ ਕੀਜੈ ॥"
page = 902
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O saints, what way should I now adopt,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤੋ! ਮੈਂ ਹੁਣ ਕਿਹੜਾ ਤਰੀਕਾ ਇਖਤਿਆਰ ਕਰਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Holy people: what way should I now adopt,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤੋ! ਅਬ ਕੌਨ ਦ੍ਰਿਸਟਾਂਤ ਕਰ ਬੀਚਾਰਨ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! ਹੁਣ (ਇਸ ਮਨੁੱਖਾ ਜਨਮ ਵਿਚ ਉਹ) ਕਿਹੜੀ ਵਿਓਂਤ ਕੀਤੀ ਜਾਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧੋ = ਹੇ ਸੰਤ ਜਨੋ! ਕਉਨ ਜੁਗਤਿ = ਕਿਹੜੀ ਵਿਓਂਤ? ਕੀਜੈ = ਕਰਨੀ ਚਾਹੀਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Santos,"