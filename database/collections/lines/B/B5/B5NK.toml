[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ; ਅਪੁਨੇ ਪ੍ਰਭਿ ਕੀਏ ॥"
page = 1339
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Showing His benediction, the Lord God, has made me His own,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਰਹਿਮਤ ਧਾਰ ਕੇ, ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਨੇ ਮੈਨੂੰ ਆਪਣਾ ਨਿਜ ਦਾ ਬਣਾ ਲਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In His Mercy, God has made me His Own."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ ਕਿਰਪਾ ਕਰ ਕੇ ਹਮ ਅਪਨੇ ਦਾਸ ਕਰ ਲੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਹੜੇ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਨ ਪਏ) ਪ੍ਰਭੂ ਨੇ (ਉਹਨਾਂ ਨੂੰ) ਮਿਹਰ ਕਰ ਕੇ ਆਪਣੇ ਬਣਾ ਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ। ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ। ਕੀਏ = ਬਣਾ ਲਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Su Misericordia Dios me ha hecho Suyo, me ha bendecido con el Naam,"