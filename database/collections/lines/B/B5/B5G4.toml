[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਅਮਰਦਾਸ ਕਾਰਣ ਕਰਣ; ਜਿਵ ਤੂ ਰਖਹਿ. ਤਿਵ ਰਹਉ ॥੪॥੧੮॥"
page = 1395
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Guru Amar Dass, thou are the doer of all deeds; as thou keep me, so do I live."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਰੇ ਕੰਮਾਂ ਦੇ ਕਰਨ ਵਾਲੇ, ਗੁਰੂ ਅਮਰਦਾਸ! ਜਿਸ ਤਰ੍ਹਾਂ ਤੂੰ ਮੈਨੂੰ ਰਖਦਾ ਹੈ, ਉਸੇ ਤਰ੍ਹਾਂ ਹੀ ਮੈਂ ਰਹਿੰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Guru Amar Daas, Doer of deeds, Cause of causes, as You keep me, I remain; as You protect me, I survive. ||4||18||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਸਰਬ ਕਾਰਣੋਂ ਕੇ ਕਰਨਹਾਰੇ ਸ੍ਰੀ ਗੁਰੂ ਅਮਰਦਾਸ ਸਾਹਿਬ ਜੀ ਮਹਾਰਾਜ! ਅਬ ਜਿਸ ਪ੍ਰਕਾਰ ਆਪ ਮੁਝ ਕੋ ਰਾਖੋ ਤਿਸੀ ਪ੍ਰਕਾਰ ਮੈਂ ਰਹੂੰ॥੪॥੧੮॥☬ਬ੍ਰਹਮਾ ਜੀ ਕੇ ਅਵਤਾਰ ਜੋ ਸ੍ਰੀ ਭਿਖਾ ਭੱਟ ਜੀ ਹੈਂ, ਸੋ ਉਚਾਰਨ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਕਰਤਾ-ਰੂਪ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ! ਜਿਵੇਂ ਤੂੰ ਮੈਨੂੰ ਰੱਖਦਾ ਹੈਂ ਤਿਵੇਂ ਮੈਂ ਰਹਿੰਦਾ ਹਾਂ ॥੪॥੧੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así como me proteges, sobrevivo. (4-18)"