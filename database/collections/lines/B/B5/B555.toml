[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਨ ਗਾਵਤ; ਮਨਿ ਹੋਇ ਬਿਗਾਸਾ ॥"
page = 1396
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Singing the Lord's praise, the mind blossoms forth,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਦਾ ਜੱਸ ਗਾਇਨ ਕਰਨ ਦੁਆਰਾ, ਮਨੂਆ ਖਿੜ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Singing His Praises, the mind blossoms forth in ecstasy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਸਤਿਗੁਰੋਂ ਕੇ ਗੁਣੋਂ ਕੋ ਗਾਵਤਿਆਂ ਹੋਇਆਂ ਮਨ ਮੇਂ (ਬਿਗਾਸਾ) ਅਨੰਦ ਪ੍ਰਾਪਤਿ ਹੋਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਗੁਣ ਗਾਂਦਿਆਂ ਗਾਂਦਿਆਂ ਮੇਰੇ ਮਨ ਵਿਚ ਖਿੜਾਉ ਪੈਦਾ ਹੋਵੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਬਿਗਾਸਾ = ਖਿੜਾਉ, ਆਨੰਦ, ਖ਼ੁਸ਼ੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Entonando Sus Alabanzas, la mente florece, en total Éxtasis."