[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਖੋਵਤ ਹੈ ਜੀਉ ਕਿਹ ਨਮਿਤ ਤਜਿ ਰਨਿ ਸ︀ਯਾਮ ਪਧਾਰੁ ॥"
page = 422

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O Krishna! why are you bent upon losing your life? Leave the battlefield and run away"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਕ੍ਰਿਸ਼ਨ! ਕਿਸ ਲਈ ਆਪਣੀ ਜਾਨ ਗੁਆਉਂਦਾ ਹੈਂ, ਰਣ-ਭੂਮੀ ਛਡ ਕੇ ਭਜ ਜਾ।"