[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਲਹ ਅਗਮ ਖੁਦਾਈ ਬੰਦੇ ॥"
page = 1083
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O the slave of the Boundless Lord God,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਦਬੰਨਾ-ਰਹਿਤ ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦੇ ਦਾਸ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O slave of the inaccessible Lord God Allah,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਖੁਦਾਇ ਕੇ ਬੰਦੇ! ਅਲਹਿ ਜੋ ਅਗਮੁ ਹੈ ਜੇ ਤੂੰ ਉਸ ਕੋ ਪ੍ਰਾਪਤ ਹੂਆ ਚਾਹਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਅੱਲਾ ਦੇ ਬੰਦੇ! ਹੇ ਅਪਹੁੰਚ ਰੱਬ ਦੇ ਬੰਦੇ! ਹੇ ਖ਼ੁਦਾ ਦੇ ਬੰਦੇ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਮ = ਅਪਹੁੰਚ ਰੱਬ। ਖੁਦਾਈ ਬੰਦੇ = ਖ਼ੁਦਾਈ ਬੰਦੇ, ਹੇ ਖ਼ੁਦਾ ਦੇ ਬੰਦੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, Hombre de Dios, oh criatura del Insondable Alah,"