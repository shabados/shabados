[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੰਡਿਤੁ ਹੋਇ ਕੈ; ਬੇਦੁ ਬਖਾਨੈ ॥"
page = 718
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Becoming a Pandit thou utterest the Vedas,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੰਡਿਤ ਹੋ ਕੇ ਤੂੰ ਵੇਦਾਂ ਦਾ ਉਚਾਰਨ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who become Pandits, religious scholars, recite the Vedas,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਤੋ ਪੰਡਤ ਹੋਇਕੈ ਬੇਦੋਂ ਕੇ ਉਚਾਰਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਿੱਦਿਆ ਹਾਸਲ ਕਰ ਕੇ (ਬ੍ਰਾਹਮਣ ਆਦਿਕ ਤਾਂ) ਵੇਦ (ਆਦਿਕ ਧਰਮ-ਪੁਸਤਕਾਂ) ਦੀ ਵਿਸਥਾਰ ਨਾਲ ਚਰਚਾ ਕਰਦਾ ਫਿਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੰਡਿਤ = {Skt. पंडा = wisdom, learning, learned, wise} ਵਿਦਵਾਨ। ਹੋਇ ਕੈ = ਬਣ ਕੇ। ਬਖਾਨੈ = {Skt. व्याख्या = To dwell at large} ਵਿਸਥਾਰ ਨਾਲ ਵਿਚਾਰ ਕੇ ਸੁਣਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Volviéndose un erudito, uno hace discursos sobre los Vedas"