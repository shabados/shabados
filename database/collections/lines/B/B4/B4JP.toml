[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਨ ਕਮਲ ਸਰਣਾਇ; ਨਾਨਕੁ ਆਇਆ ॥"
page = 705
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak has sought the refuge of the Lord's lotus feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੇ ਪ੍ਰਭੂ ਦੇ ਕੰਵਲ ਚਰਨਾਂ ਦੀ ਪਨਾਹ ਲਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak has come to the Sanctuary of the Lord's lotus feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਤੇ ਮੈਂ ਦਾਸ ਦੁਖੋਂ ਤੇ ਰਹਿਤ ਜੋ ਪਰਮੇਸਰ ਹੈ ਤਿਸ ਕੇ ਚਰਣੋਂ ਕਮਲੋਂ ਕੀ ਸਰਣ ਆਇਆ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਨਾਨਕ (ਤਾਂ ਪ੍ਰਭੂ ਦੇ) ਕੋਮਲ ਚਰਨਾਂ ਦੀ ਸਰਨ ਆ ਪਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਰਨ ਕਮਲ = ਕੌਲ-ਫੁੱਲਾਂ ਵਰਗੇ ਸੋਹਣੇ ਕੋਮਲ ਚਰਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak ha buscado el Refugio de los Pies de Loto del Señor"