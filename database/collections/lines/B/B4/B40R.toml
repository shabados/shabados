[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਜ ਲਉ ਲਾਜ ਰਹੀ ਰਨ ਮੈ; ਸਮ ਜੁਧੁ ਭਯੋ, ਅਜੋ ਬੀਰ ਨ ਛੀਜੈ ॥"
page = 479

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Your honour has remained there till today and you have not confronted Krishna"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਤਕ ਤਾਂ ਯੁੱਧ ਵਿਚ ਲਾਜ ਰਹੀ ਹੈ (ਕਿਉਂਕਿ ਹਾਲਾਂ ਤਕ) ਬਰਾਬਰ ਦਾ ਯੁੱਧ ਹੋਇਆ ਹੈ ਅਤੇ ਅਜੇ (ਚੋਣਵੇਂ) ਸੂਰਮੇ ਮੋਏ ਨਹੀਂ ਹਨ।"