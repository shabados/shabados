data = "ਅਸ ਕੋ ਜੁ ਤਵਾਇਸੁਅੰ ਮਲਯੰ ॥੫੭॥"
page = 43

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Who is the amongst them  who hath the audacity to refuse Thy Command? 57."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਨ੍ਹਾਂ ਵਿਚ) ਅਜਿਹਾ ਕਿਹੜਾ ਹੈ ਜੋ ਤੇਰੀ ਆਗਿਆ ਨੂੰ ਮੇਟ (ਮਲ) ਦੇਵੇ ॥੫੭॥"