[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੇ ਅਪਰੰਪਰ. ਹਰਿ ਹਰੇ; ਹਹਿ ਭੀ ਹੋਵਨਹਾਰ ॥"
page = 261
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Remotest of the remote Lord God, Thou art, wert and shalt be."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਰੇਡੇ ਤੋਂ ਪਰੇਡੇ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ! ਤੂੰ ਹੈ ਸੀਗਾ ਅਤੇ ਹੋਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Most Remote of the Remote, Lord God: You are, You were, and You shall always be."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ (ਅਪਰੰਪਰ) ਅੰਨ੍ਯ ਜੀਵੋਂ ਸੇ ਪਰੇ ਹਰੀ! (ਹਰੇ) ਸਬ ਜੀਵੇਂ ਕੋ ਸੱਤਾ ਸਫੁਰਤੀ ਦੇਣੇ ਵਾਲੇ ਤੂੰ ਅਬ ਭੀ ਹੈਂ, ਪੁਨਃ ਆਗੇ ਕੋ ਹੋਣੇ ਵਾਲਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਰੇ ਤੋਂ ਪਰੇ ਪ੍ਰਭੂ! ਤੂੰ ਹੁਣ ਭੀ ਮੌਜੂਦ ਹੈਂ, ਤੂੰ ਸਦਾ ਲਈ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਪਰੰਪਰ = ਪਰੇ ਤੋਂ ਪਰੇ। ਹਹਿ ਭੀ = ਹੁਣ ਭੀ ਮੌਜੂਦ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor Trascendente, más allá del más allá,"