[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮੇਰੇ; ਗੁਰ ਕੀ ਮੰਨਿ ਲੈ ਰਜਾਇ ॥"
page = 37
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O My Mind! submit to the will of the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੈਡੇਂ ਮਨੂਏ! ਗੁਰਾਂ ਦੇ ਭਾਣੇ ਨੂੰ ਸਵੀਕਾਰ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, surrender to the Guru's Will."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪ੍ਯਾਰੇ! ਤੂੰ  ਸਤਿਗੁਰੂ ਕੀ ਆਗ੍ਯਾ ਕੋ ਮਾਨ ਲੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਗੁਰੂ ਦੇ ਹੁਕਮ ਵਿਚ ਤੁਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਜਾਇ = ਭਾਣਾ, ਮਰਜ਼ੀ, ਹੁਕਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hombre, sométete a la Voluntad del Señor."