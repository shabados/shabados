[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚੀਤਿ. ਨ ਆਇਓ; ਕਰਤਾ ਸੰਗਾ ॥"
page = 392
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He thinks not of the creator, who is with him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਿਰਜਣਹਾਰ ਨੂੰ ਯਾਦ ਨਹੀਂ ਕਰਦਾ ਜੋ ਉਸ ਦੇ ਨਾਲ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He does not think of the Creator, who is ever with him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕਰਤਾ ਪੁਰਖ ਸੰਗ ਹੈ, ਸੋ ਚਿਤ ਮੇਂ ਨਾ ਆਇਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇ ਉਸ ਨੂੰ) ਹਰ ਵੇਲੇ ਨਾਲ-ਵੱਸਦਾ ਕਰਤਾਰ ਕਦੇ ਯਾਦ ਨਾਹ ਆਇਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੀਤਿ = ਚਿੱਤ ਵਿਚ। ਕਰਤਾ = ਕਰਤਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No alaba al Señor, Quien es su Eterno Compañero;"