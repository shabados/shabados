[[content]]
assets = ["AKKB"]
type = "primary"
data = "ਦਾਸ ਗੋਬਿੰਦ ਫ਼ਤਹ ਖ਼ਾਲਸਾ ਦਰਸ ਪਰਸ ਮਿਟੇ ਸੋਗ ॥"

[[content]]
assets = ["SOTK"]
type = "translation"
language = "en"
data = "The servant of Gobind [Singh] proclaims the victory of the Khalsa, the sight and touch [of which] wipes every sadness away. 534 "