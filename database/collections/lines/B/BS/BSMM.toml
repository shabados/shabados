[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੁ ਸਿਮਰਿ. ਮਨ ਮਾਹੀ ॥੧॥ ਰਹਾਉ ॥"
page = 407
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meditate only on the One Lord, in thy mind. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਚਿੱਤ ਅੰਦਰ ਸਿਰਫ ਇਕ ਸੁਆਮੀ ਦਾ ਹੀ ਆਰਾਧਨ ਕਰ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remember the One Lord in meditation within your mind. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਕਰ ਕੇ ਏਕ ਹਰੀ ਕਾ ਸਿਮਰਨ ਕਰੋ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਆਪਣੇ) ਮਨ ਵਿਚ ਇਕ ਪਰਮਾਤਮਾ ਨੂੰ ਸਿਮਰਦਾ ਰਹੁ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ ਮਾਹੀ = ਮਨ ਮਾਹਿ, ਮਨ ਵਿਚ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Contempla sólo al Único Señor en tu mente. (1‑Pausa)"