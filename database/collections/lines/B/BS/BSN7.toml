[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਐਸਾ ਗੁਰੁ; ਬਡਭਾਗੀ ਪਾਈਐ ॥੩॥"
page = 287
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak by the greatest good fortune such Guru is attained to."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਪਰਮ ਚੰਗੇ ਨਸੀਬਾਂ ਦੁਆਰਾ ਐਹੋ ਜੇਹੇ ਗੁਰੂ ਜੀ ਪਾਏ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, such a Guru is obtained by the greatest good fortune. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਐਸਾ ਪੂਰਨ ਸਤਿਗੁਰੂ ਬਡੇ ਭਾਗੋਂ ਸੇ ਹੀ ਪਾਈਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਵੱਡੇ ਭਾਗਾਂ ਨਾਲ ਮਿਲਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mas por Gracia Especial, de pronto despiertas y descubres que Está en ti mismo.  (3)"