[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਨਾਮੁ ਨਿਧਾਨੁ ਹੈ; ਗੁਰਮੁਖਿ ਪਾਇਆ ਜਾਇ ॥"
page = 1316
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Treasure of bliss is the Lord Master's Name. It is by the Guru's grace that one attains it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੁਸ਼ੀ ਦਾ ਖਜਾਨਾ ਹੈ ਸੁਆਮੀ ਮਾਲਕ ਦਾ ਨਾਮ। ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ, ਜੀਵ ਇਸ ਨੂੰ ਹਾਂਸਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Name of the Lord, Har, Har, is the greatest treasure. The Gurmukhs obtain it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਹਰਿ ਕਾ ਨਾਮ ਨਿਧੀਓਂ ਕਾ ਘਰ ਹੈ ਅਰ ਵਹੁ ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਪਾਇਆ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ (ਸਾਰੇ ਸੁਖਾਂ ਦਾ) ਖ਼ਜ਼ਾਨਾ ਹੈ, (ਪਰ) ਇਹ ਮਿਲਦਾ ਹੈ ਗੁਰੂ ਦੀ ਸਰਨ ਪਿਆਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਧਾਨੁ = ਖ਼ਜ਼ਾਨਾ। ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਸਰਨ ਪਿਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Nombre del Señor Jar, Jar, es el más Grandioso Tesoro y el Gurmukj Lo obtiene."