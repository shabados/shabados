[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਲੈਤ; ਦੁਖੁ ਦੂਰਿ ਪਰਾਨਾ ॥"
page = 1142
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Taking the Name, my sorrows are removed away from me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਲੈਣ ਦੁਆਰਾ ਮੇਰੇ ਦੁੱਖੜੇ ਮੇਰੇ ਪਾਸੋਂ ਦੁਰੇਡੇ ਚਲੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Repeating the Naam, the mortal's pains are taken away."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਕੇ ਲੈਨੇ ਕਰ ਦੁਖ ਪਲਾਇ ਕਰ ਦੂਰ ਚਲਾ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪਦਿਆਂ (ਹਰੇਕ) ਦੁੱਖ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਰਿ ਪਰਾਨਾ = ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Recitando el Nombre la tristeza se aleja de mí."