[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੀ ਹਮਾਰੈ ਸਫਲ ਕਾਜ ॥"
page = 987
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Master, fulfil Thou the aim of my life."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂਡੇ ਮਾਲਕਾ! ਤੂੰ ਮੇਰੇ ਇਸ ਜੀਵਨ ਦਾ ਮਨੋਰਥ ਪੂਰਾ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please let my works be rewarding and fruitful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰੇ ਇਹੀ ਕੰਮ ਸਫਲ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ (ਸੰਤ-ਸਰਨ) ਹੀ ਮੇਰੇ ਵਾਸਤੇ ਮੇਰੇ ਮਨੋਰਥਾਂ ਨੂੰ ਸਫਲ ਕਰਨ ਵਾਲੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਹੀ = ਇਹ ਹੀ, ਇਹ (ਸੰਤ-ਸਰਨ) ਹੀ। ਹਮਾਰੈ = ਮੇਰੇ ਵਾਸਤੇ, ਮੇਰੇ ਹਿਰਦੇ ਵਿਚ। ਸਫਲ = ਕਾਮਯਾਬ। ਕਾਜ = ਕੰਮ, ਮਨੋਰਥ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, esta es mi única plegaria:"