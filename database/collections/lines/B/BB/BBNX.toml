type = "primary"
data = "ਜਿਮ ਉਰਬਰਾ ਕ੍ਰਿਸ ਛੀਨ ॥"
page = 634

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Just as a village becomes helpless without a headman, the earth becomes meaningless without fertility,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਖੇਤੀ ਦੇ ਕਟੇ ਜਾਣ ਤੋਂ ਬਿਨਾ ਉਪਜਾਊ ਧਰਤੀ ਹੈ।"