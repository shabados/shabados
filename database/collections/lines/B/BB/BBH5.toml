[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਬ ਰੀਝਿ ਕੈ ਦੇਹੁ ਵਹੈ ਹਮ ਕਉ; ਜੋਊ ਹਉ ਬਿਨਤੀ ਕਰ ਜੋਰਿ ਕਰੋ ॥"
page = 550

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Whatever request I am making with my folded hands, O Lord!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਲਈ) ਹੁਣ ਪ੍ਰਸੰਨ ਹੋ ਕੇ ਮੈਨੂੰ ਉਹੀ (ਵਰ) ਦਿਓ, ਜੋ ਮੈਂ ਹੱਥ ਜੋੜ ਕੇ ਬੇਨਤੀ ਕਰਦਾ ਹਾਂ।"