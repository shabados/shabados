[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ ਵਿਟਹੁ ਵਾਰਿਆ; ਜਿਤੁ ਮਿਲਿਐ ਖਸਮੁ ਸਮਾਲਿਆ ॥"
page = 470
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "A sacrifice am I unto the True Guru, by meeting whom the Lord is remembered."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੁਰਬਾਨ ਹਾਂ ਮੈਂ ਸੱਚੇ ਗੁਰਾਂ ਉੱਤੋਂ ਜਿਨ੍ਹਾਂ ਨੂੰ ਭੇਟਣ ਦੁਆਰਾ ਸਿਮਰਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to the True Guru; meeting Him, I have come to cherish the Lord Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਕੇ (ਵਿਟਹੁ) ਊਪਰ ਸੇ ਬਲਿਹਾਰ ਜਾਈਐ, ਜਿਨ ਕੇ ਮਿਲਨੇ ਸੇ ਸ੍ਵਾਮੀ ਕੋ ਯਾਦ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਸਤਿਗੁਰੂ ਤੋਂ ਸਦਕੇ ਹਾਂ, ਜਿਸ ਨੂੰ ਮਿਲਣ ਕਰ ਕੇ ਮੈਂ ਮਾਲਕ ਨੂੰ ਯਾਦ ਕਰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਿਟਹੁ = ਤੋਂ। ਜਿਤ ਮਿਲਿਐ = ਜਿਸ ਗੁਰੂ ਨੂੰ ਮਿਲਣ ਕਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Yo ofrezco mi ser en sacrificio al Verdadero Guru y Encontrándolo presencio a mi Señor."