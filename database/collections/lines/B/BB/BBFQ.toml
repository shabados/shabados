[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਕੀ ਮਹਿਮਾ; ਕਥੀ ਨ ਜਾਇ ॥"
page = 193
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The praise of God's attendant cannot be described."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦੇ ਟਹਿਲੂਏ ਦੀ ਉਪਮਾ ਬਿਆਨ ਕੀਤੀ ਨਹੀਂ ਜਾ ਸਕਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Glories of the Lord's humble servants cannot be described."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦਾਸ ਕੀ ਉਪਮਾ ਕਥਨ ਕਰੀ ਨਹੀਂ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਇਹੋ ਜਿਹੇ) ਸੇਵਕ ਦੀ ਆਤਮਕ ਉੱਚਤਾ ਬਿਆਨ ਨਹੀਂ ਕੀਤੀ ਜਾ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਹਿਮਾ = ਵਡਿਆਈ, ਆਤਮਕ ਉੱਚਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es imposible hablar de las virtudes del Sirviente de Dios,"