[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਭਾਣਾ; ਤਾਂ ਥਲ ਸਿਰਿ ਸਰਿਆ ॥"
page = 1141
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When He wills, then the river flows on the sandy tract."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਸ ਨੂੰ ਭਾਉਂਦਾ ਹੈ ਤਦ ਰੇਤਲੇ ਮੈਦਾਨ ਉਤੇ ਦਰਿਆ ਵਗ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When it pleases Him, rivers flow across the desert sands."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੈਨੂੰ ਭਾਣਾ ਹੈ ਤਿਸ ਕਾ ਰਿਦਾ ਜੋ ਥਲ ਕੇ ਸਮਾਨ ਉਚਾ ਥਾ ਅਰਥਾਤ ਹੰਕਾਰ ਸਹਿਤ ਥਾ, ਤਿਸ ਕੇ ਸਿਰ ਪਰ ਭਗਤੀ ਰੂਪੀ (ਸਾਰਿਆ) ਸਰਬ ਓਰਤੇ ਨਦੀ ਵਗਾ ਦਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਉਸ ਪ੍ਰਭੂ ਨੂੰ ਚੰਗਾ ਲੱਗੇ ਤਾਂ ਥਲ ਉੱਤੇ ਸਰੋਵਰ ਬਣ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਥਲ ਸਿਰਿ = ਥਲ ਦੇ ਸਿਰ ਉੱਤੇ। ਸਰਿਆ = ਸਰ, ਸਰੋਵਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si esa es Tu Voluntad, de la tierra seca brota el agua;"