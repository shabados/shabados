data = "ਸਕਲ ਪੁਰਖ ਕੋ ਭੇਸ ਬਨਾਯੋ ॥੪॥"
page = 843

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "With sword in her hand and a turban on her head, she disguised herself as a man.(4)"

