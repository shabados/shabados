[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਪੂਰੈ ਨਾਨਕ; ਹਰਿ ਪਾਇਆ ॥੪॥੩॥੫੫॥"
page = 366
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the perfect Guru, O Nanak, the Lord has been obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ, ਨਾਨਕ, ਪ੍ਰਭੂ ਨੂੰ ਪਰਾਪਤ ਕਰ ਲਿਆ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Perfect Guru, O Nanak, the Lord is obtained. ||4||3||55||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਨਕੌ ਗੁਰੂ ਪੂਰੇ ਦ੍ਵਾਰੇ ਹਰਿ ਪ੍ਰਾਪਤ ਹੂਆ ਹੈ॥੪॥੩॥੫੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਨੇ ਪੂਰੇ ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਉਸ ਪਰਮਾਤਮਾ ਨੂੰ ਲੱਭ ਲਿਆ ॥੪॥੩॥੫੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ ਪੂਰੈ = ਪੂਰੇ ਗੁਰੂ ਦੀ ਰਾਹੀਂ ॥੪॥੩॥੫੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak ha obtenido al Señor a través del Perfecto Guru. (4‑3‑55)"