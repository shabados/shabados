[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਥੈ; ਜੋਧ ਮਹਾਬਲ ਸੂਰ ॥"
page = 8
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The very powerful warriors and heroes dwell there."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਮ ਬਲਵਾਨ ਜੋਧੇ ਅਤੇ ਸੂਰਮੇ ਉਥੇ ਨਿਵਾਸ ਰੱਖਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "except the warriors of great power, the spiritual heroes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਉਪਾਸਕੋਂ ਮੈ ਰਹਿਨੇਹਾਰੇ ਜੋਧੇ ਸਰੀਰ ਕੋ ਜਿਤਨੇ ਵਾਲੇ ਰਥੀ ਹੈਂ, ਅਰ ਬਾਣੀ ਆਦਿਕ ਇੰਦ੍ਰਿਆਂ ਕੋ ਜਿਤਨੇ ਵਾਲੇ (ਮਹਾਬਲ) ਮਹਾਰਥੀਂ ਹੈਂ, ਮਨ ਕੇ ਜੀਤਨੇ ਵਾਲੇ (ਸੂਰ) ਅਤਿਰਥੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਅਵਸਥਾ ਵਿਚ(ਜੋ ਮਨੁੱਖ ਹਨ ਉਹ) ਜੋਧੇ, ਮਹਾਂਬਲੀ ਤੇ ਸੂਰਮੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋਧ = ਜੋਧੇ। ਮਹਾਬਲ = ਵੱਡੇ ਬਲ ਵਾਲੇ। ਸੂਰ = ਸੂਰਮੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "excepto los guerreros espirituales de gran poder y los héroes valientes"