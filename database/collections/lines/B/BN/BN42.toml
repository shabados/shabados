[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੇ ਕੀ ਲਿਵ; ਗੁਰਮਤਿ ਜਾਤੀ ॥"
page = 1024
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru's instruction, they realise the worth of the True Lord's love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਸਿਖਮਤ ਰਾਹੀਂ, ਉਹ ਸੱਚੇ ਪ੍ਰਭੂ ਦੀ ਪ੍ਰੀਤ ਦੀ ਕਦਰ ਨੂੰ ਅਨੁਭਵ ਕਰ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Following the Guru's Teachings, they know the Love of the True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਚੇ ਤਿਨੋਂ ਨੇ ਆਪ ਕੀ ਪ੍ਰੀਤੀ ਗੁਰਮਤ ਕਰ ਕੇ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਿੱਖਿਆ ਲੈ ਕੇ ਉਹ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੀ ਲਗਨ (ਦਾ ਆਨੰਦ) ਪਛਾਣ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los arrogantes Manmukjs se la pasan durmiendo y así son ultrajados de sus tesoros internos,"