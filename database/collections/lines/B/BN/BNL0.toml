[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੱਤ੍ਰ ਚੱਕ੍ਰ ਵਰਤੀ ॥"
page = 6
line = 5

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "\"ਚੱਤ੍ਰ\" ਦਾ ਉਚਾਰਨ \"ਤ\" ਤੇ ਔਂਕੜ ਸਹਿਤ ਕਰਨਾ ਹੈ।"

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O the Pervading Lord of the four directions!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਤੂੰ) ਚੌਹਾਂ ਚੱਕਾਂ ਵਿਚ ਵਿਚਰਨ ਵਾਲਾ"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਚੱਤ੍ਰੁ ਚੱਕ੍ਰ, ਵਰਤੀ ॥"