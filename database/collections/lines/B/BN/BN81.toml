[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਾਮ ਕਰੋਧੁ ਵਿਰੋਧੁ ਨਿਤ; ਲੋਭ ਮੋਹ ਧ੍ਰੋਹੁ ਅਹੰਕਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "These couriers are lust, anger, disputation, greed, infatuation, treachery and ego."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਾਮ, ਕ੍ਰੋਧ ਤੇ ਵਿਰੋਧ ਦੇ ਝਗੜੇ ਨਿਤ ਰਹਿੰਦੇ ਹਨ, ਲੋਭ ਮੋਹਾਦਿਕ ਕਈ ਵਿਖਯ ਧ੍ਰੋਹ ਕਰਦੇ ਹਨ।"