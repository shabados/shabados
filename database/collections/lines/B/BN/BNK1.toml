[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦੀ; ਸਹਸਾ ਜਾਏ ॥"
page = 1062
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the Guru's grace, his doubt is removed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਉਸ ਦਾ ਭਰਮ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, his skepticism is removed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਕਿਰਪਾ ਸੇ ਤਿਸ ਕਾ ਸੰਸਾ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ (ਉਸ ਦਾ) ਸਹਮ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਸਾਦੀ = ਪਰਸਾਦਿ, ਕਿਰਪਾ ਨਾਲ। ਸਹਸਾ = ਸਹਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "él, por la Gracia del Guru es liberado de su duda,"