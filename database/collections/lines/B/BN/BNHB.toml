data = "ਕਹੂੰ ਰੰਕ ਕੇ ਰਾਜ, ਕੇ ਧਰਮ ਅਲੂਲੇ ॥"
page = 26

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere Thou art describing the characteristics of a king and the poor!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ (ਤੂੰ) ਭਿਖਾਰੀ ਦੇ ਸੁਭਾ ਵਿਚ ਅਤੇ ਕਿਤੇ (ਤੂੰ) ਰਾਜੇ ਦੇ ਸੁਭਾ ਵਿਚ ਸਥਿਰ ਹੈਂ।"