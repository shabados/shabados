[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਭਜਨੁ; ਪੂਰੇ ਗੁਰ ਸੰਗਿ ॥"
page = 298
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "are obtained by Lord God's meditation in the company of the Perfect Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਕੰਮਲ ਗੁਰਾਂ ਦੀ ਸੰਗਤ ਵਿੱਚ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦੇ ਸਿਮਰਨ ਦੁਆਰਾ ਪਰਾਪਤ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "these are obtained by meditating, vibrating upon the Lord, Har, Har, in the Company of the Perfect Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਪੂਰੇ ਸਤਿਗੁਰੋਂ ਕੇ ਸੰਗ ਮਿਲਿ ਕਰ ਹਰਿ ਹਰਿ ਕਾ ਭਜਨ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਪੂਰੇ ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਰਹਿ ਕੇ ਹਰਿ-ਨਾਮ ਦਾ ਭਜਨ ਕੀਤਾ ਜਾਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗਿ = ਨਾਲ, ਸੰਗਤਿ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno medita en su Señor en la Compañía del Perfecto Guru,"