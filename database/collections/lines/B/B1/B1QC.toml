[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਜਨਮੰ ਨ ਮਰਨੰ, ਨ ਬਰਨੰ ਨ ਬਿਆਧੰ ॥"
page = 23

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is without birth, without death, without colour and without ailment."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਨਾ ਜੰਮਦਾ ਹੈ ਨਾ ਮਰਦਾ ਹੈ, (ਉਸ ਦਾ) ਨਾ ਕੋਈ ਰੰਗ ਹੈ, ਨਾ ਹੀ ਕਲੰਕ ਹੈ,"