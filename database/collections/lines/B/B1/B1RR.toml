[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਸੁਖੁ; ਸਾਧੂ ਸੰਗਿ ਪਰੀਤਿ ॥"
page = 288
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that peace thou shalt have by loving the guild of saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਰਾਮ ਤੈਨੂੰ ਸਾਧ ਸੰਗਤ ਨਾਲ ਪ੍ਰੇਮ ਕਰਨ ਨਾਲ ਮਿਲੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "that peace comes by the love of the Company of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਸੁਖ ਤੁਝ ਕੌ ਸੰਤੋਂ ਕੇ ਸਾਥ ਪ੍ਰੀਤੀ ਕਰਨੇ ਸੇ ਪ੍ਰਾਪਤ ਹੋਇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਖ ਸੰਤਾਂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਪਿਆਰ ਕੀਤਿਆਂ (ਮਿਲਦਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰੀਤਿ = ਪਿਆਰ (ਕਰਨ ਨਾਲ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo podrás hallarla en la Compañía de los Santos."