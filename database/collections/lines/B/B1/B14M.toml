data = "ਬਿਸਮਿਲਿ ਗਊ; ਦੇਹੁ ਜੀਵਾਇ ॥"
page = 1165
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Restore to life of this slaughtered cow,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਜ਼ਿਬ੍ਹਾ ਕੀਤੀ ਹੋਈ ਗਾਂ ਨੂੰ ਜੀਉਂਦੀ ਕਰ ਦੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "\"Bring this dead cow back to life."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਬਿਸਮਿਲਿ) ਮਰੀ ਹੂਈ ਗਊ ਹਮਾਰੀ ਜਿਵਾਇ ਦੇਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੇਰੀ ਇਹ) ਮੋਈ ਹੋਈ ਗਾਂ ਜਿਵਾਲ ਦੇਹ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਸਮਿਲਿ = ਮੋਈ ਹੋਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "O resucitas la vaca muerta que está frente a ti,"