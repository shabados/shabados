[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਪ੍ਰਾਨ; ਘਟ ਘਟ ਆਧਾਰੁ ॥੧॥ ਰਹਾਉ ॥"
page = 391
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who is the support of soul, life and every heart. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨਾਲ, ਜੋ ਆਤਮਾ ਜਿੰਦ-ਜਾਨ ਅਤੇ ਹਰ ਦਿਲ ਦਾ ਆਸਰਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the Support of the soul, the breath of life, of each and every heart. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੀਵੋਂ ਕੇ ਘਟੋਂ ਘਟੋਂ ਮੇਂ ਪ੍ਰਾਣੋਂ ਕਾ (ਆਧਾਰੁ) ਆਸਰਾ ਰੂਪ ਹੋ ਰਹਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਇਹ ਹਰੇਕ ਜੀਵ ਦੀ ਜਿੰਦ ਦਾ ਹਰੇਕ ਜੀਵ ਦੇ ਪ੍ਰਾਣਾਂ ਦਾ ਆਸਰਾ ਬਣ ਜਾਂਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ ਆਧਾਰੁ = ਜਿੰਦ ਦਾ ਆਸਰਾ। ਘਟ ਘਟ = ਹਰੇਕ ਜੀਵ ਦਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Soporte de cada vida y de cada corazón. (1-Pausa)"