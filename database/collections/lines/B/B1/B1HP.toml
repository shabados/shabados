[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਿਹ ਤੇ ਸਭ ਗੋਪਨ ਕੀ ਬਿਪਤਾ; ਹਰਿ ਕੇ ਕੁਪ ਤੇ ਛਿਨ ਮਾਹਿ ਟਲੀ ॥"
page = 330

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Because of the Krishna, the trouble of gopas was finished in an instant and this is the praise of the same Lord,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਾਨ੍ਹ ਦੇ ਕ੍ਰੋਧਿਤ ਹੁੰਦੇ ਹੀ ਗਵਾਲਿਆਂ ਦੀ ਬਿਪਤਾ ਛਿਣ ਵਿਚ ਟਲ ਗਈ ਹੈ।"