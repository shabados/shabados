[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਟ ਘਟ ਅੰਤਰਿ; ਸਰਬ ਸਮਾਹੀ ॥"
page = 866
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is contained in all the hearts and all the things."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰਿਆਂ ਦਿਲਾਂ ਅਤੇ ਸਾਰੀਆਂ ਵਸਤੂਆਂ ਅੰਦਰ ਰਮਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is contained deep within each and every heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਸੋ ਤੂੰ ਸਭ ਕੇ ਘਟ ਘਟ ਮੇਂ ਸਮਾਇਆ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹਰੇਕ ਸਰੀਰ ਵਿਚ ਮੌਜੂਦ ਹੈਂ, ਤੂੰ ਸਾਰੇ ਜੀਵਾਂ ਵਿਚ ਵਿਆਪਕ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਤਰਿ = ਅੰਦਰ। ਘਟ ਘਟ ਅੰਤਰਿ = ਹਰੇਕ ਸਰੀਰ ਵਿਚ। ਸਰਬ ਸਮਾਹੀ = ਤੂੰ ਸਾਰਿਆਂ ਵਿਚ ਸਮਾਇਆ ਹੋਇਆ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él compenetra y llena todos los corazones."