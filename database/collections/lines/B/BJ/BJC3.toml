[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਰਬ ਕਰਤਾ, ਸਰਬ ਹਰਤਾ; ਸਰਬ ਤੇ ਅਨਕਾਮ ॥"
page = 34

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is the Creator and Destroyer of all and the fulfiller of the desires of all."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਸਭ ਦਾ ਕਰਤਾ, ਸਭ ਦਾ ਨਾਸ਼ਕ ਅਤੇ ਸਭ ਦੀਆਂ ਕਾਮਨਾਵਾਂ (ਪੂਰੀਆਂ ਕਰਨ ਵਾਲਾ ਹੈ)।"