[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਬਹੁ ਬੀਰਨ ਕੌ ਦਿਯੋ; ਛਿਨਿਕ ਮੌ ਮਾਰਿ ਕੈ ॥੩੨॥"
page = 1009

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Daropdee leapt ahead, took over bow and shot dead many fighters.(32)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਛਿਣ ਭਰ ਵਿਚ ਬਹੁਤ ਸੂਰਮਿਆਂ ਨੂੰ ਮਾਰ ਦਿੱਤਾ ॥੩੨॥"