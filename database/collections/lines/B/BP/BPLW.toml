[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸਹਜੇ ਅੰਮ੍ਰਿਤੁ ਪੀਵੈ; ਤ੍ਰਿਸਨਾ ਅਗਨਿ ਬੁਝਾਹਾ ਹੇ ॥੫॥"
page = 1056
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru-ward instinctively in drinks the Nectar and quenches the fire of his desires."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ-ਅਨੁਸਾਰੀ ਸੁਤੇਸਿਧ ਹੀ ਅੰਮ੍ਰਿਤ ਪਾਨ ਕਰਦਾ ਤੇ ਆਪਣੀਆਂ ਖ਼ਾਹਿਸ਼ਾ ਦੀ ਅੱਗ ਨੂੰ ਬੁਝਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh intuitively drings in the Ambrosial Nectar, and the fire of desire is quenched. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਗੁਰੋਂ ਦੁਆਰੇ ਨਾਮ ਅੰਮ੍ਰਿਤ ਕੋ ਪਾਨ ਕਰੀਏ। ਜਿਨੋਂ ਨੇ ਪੀਆ ਹੈ ਤਿਨੋਂ ਨੇ (ਸਹਜੇ) ਸੁਭਾਵਕ ਹੀ ਤ੍ਰਿਸਨਾਂ ਅਗਨਿ ਕੋ ਬੁਝਾਇਆ ਹੈ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਟਿਕ ਕੇ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ ਪੀਂਦਾ ਹੈ (ਉਹ ਮਨੁੱਖ ਆਪਣੇ ਅੰਦਰੋਂ ਮਾਇਆ ਦੀ) ਤ੍ਰਿਸ਼ਨਾ ਦੀ ਅੱਗ ਬੁਝਾ ਲੈਂਦਾ ਹੈ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ। ਸਹਜੇ = ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ। ਅੰਮ੍ਰਿਤੁ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El ser con Conciencia de Dios, sorbe del Néctar espontáneamente y el fuego de la ansiedad en su interior es sofocado.(5)"