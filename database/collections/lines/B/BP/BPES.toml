[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਉ ਲਗ ਹੀ ਜੁਤ ਕੋਪ ਕ੍ਰਿਪਾਨਿਧਿ; ਆਹਵ ਕੀ ਛਿਤ ਭੀਤਰ ਆਏ ॥"
page = 516

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then Krishna reached the battlefield, who is the treasure of mercy"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਦੋਂ ਤਕ ਹੀ ਕ੍ਰੋਧਵਾਨ ਹੋਏ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਯੁੱਧ-ਭੂਮੀ ਵਿਚ ਆ ਗਏ।"