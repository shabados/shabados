[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਸੰਤਨ ਪਹਿ; ਵਸਤੁ ਇਕ ਮਾਂਗਉ ॥"
page = 99
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I beg of all the saints to give me a commodity."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਮੁਹ ਸਾਧੂਆਂ ਕੋਲੋਂ ਇਕ ਚੀਜ਼ ਦੀ ਯਾਚਨਾ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I beg of all the Saints: please, give me the merchandise."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਹਾਰਾਜ! ਸਰਬ ਸੰਤ ਜਨੋਂ ਕੇ (ਪਹਿ) ਪਾਸ ਇਕ ਜੋ ਧੂੜੀ ਰੂਪ ਵਸਤੂ ਹੈ, ਸੋ ਮੈਂ ਮਾਂਗਤਾ ਹਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਤੇਰਾ ਭਜਨ ਕਰਨ ਵਾਲੇ ਸਾਰੇ ਬੰਦਿਆਂ ਤੋਂ ਮੈਂ ਤੇਰਾ ਨਾਮ-ਪਦਾਰਥ ਹੀ ਮੰਗਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲ = ਸਾਰੇ। ਪਹਿ = ਪਾਸੋਂ। ਮਾਂਗਉ = ਮੈਂ ਮੰਗਦਾ ਹਾਂ। ਵਸਤੁ = ਚੰਗੀ ਸ਼ੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Les pido a todos los Santos, por favor, bendíganme con un regalo."