data = "ਮਜਲਿਸ ਵਿਚ ਸੂਝਵਾਨ ਅਤੇ ਹੱਥਾਂ ਦਾ ਬਹੁਤ ਚੁਸਤ ਸੀ ॥੧੦੩॥"