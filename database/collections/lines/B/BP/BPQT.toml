[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੋ ਠਾਕੁਰੁ; ਊਚਾ ਹੋਈ ॥"
page = 330
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whose Master is the most high,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਮਾਲਕ ਸਭ ਤੋਂ ਉੱਚਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One whose Lord and Master is the highest and most exalted"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਾ ਠਾਕੁਰ ਊਚਾ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦਾ ਮਾਲਕ ਵੱਡਾ ਹੋਵੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੋ = ਜਿਸ ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Para quien su Maestro es lo más alto de lo alto,"