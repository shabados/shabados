[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ. ਭਰਮੁ, ਗੁਰਿ ਖੋਇਓ; ਜੋਤੀ ਜੋਤਿ ਸਮਹੀ ॥੨॥੬੦॥੮੩॥"
page = 1220
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, the Guru has dispelled my doubt and my light has merged in the Supreme light."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਗੁਰਾਂ ਨੇ ਮੇਰਾ ਸੰਦੇਹ ਨਵਿਰਤ ਕਰ ਦਿੱਤਾ ਹੈ ਅਤੇ ਮੇਰਾ ਨੂਰ ਪਰਮ ਨੂਰ ਅੰਦਰ ਲੀਨ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, the Guru has eradicated my doubt; my light has merged into the Light. ||2||60||83||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਗੁਰੋਂ ਨੇ ਭਰਮ ਖੋਇ ਦੀਆ ਹੈ ਅਰੁ (ਜੋਤੀ) ਵਾਹਿਗੁਰੂ ਮੇਂ (ਜੋਤਿ) ਚੇਤਨਸਤਾ (ਸਮਹੀ) ਸਮਾਈ ਹੈ॥੨॥੬੦॥੮੩॥☬ਉਪਦੇਸ ਕਰਤੇ ਹੂਏ ਕਹਿਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਗੁਰੂ ਨੇ (ਮੇਰੇ ਮਨ ਦੀ) ਭਟਕਣਾ ਦੂਰ ਕਰ ਦਿੱਤੀ ਹੈ, ਮੇਰੀ ਜਿੰਦ ਪ੍ਰਭੂ ਦੀ ਜੋਤਿ ਵਿਚ ਲੀਨ ਰਹਿੰਦੀ ਹੈ ॥੨॥੬੦॥੮੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ। ਭਰਮੁ = ਭਟਕਣਾ। ਖੋਇਓ = ਦੂਰ ਕਰ ਦਿੱਤੀ ਹੈ। ਜੋਤਿ = (ਮੇਰੀ) ਜਿੰਦ। ਜੋਤੀ = ਪ੍ਰਭੂ ਦੀ ਜੋਤਿ ਵਿਚ। ਸਮਹੀ = ਲੀਨ ਰਹਿੰਦੀ ਹੈ ॥੨॥੬੦॥੮੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, ya no tengo dudas, por la Gracia del Guru y mi Alma se ha inmergido en la Toda Alma. (2-60-83)"