[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਪ੍ਰਭ ਕਉ; ਮੂਲਿ. ਨ ਮਨਹੁ ਬਿਸਾਰਿ ॥"
page = 270
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "forget not ever, that Lord from thy mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਸੁਆਮੀ ਨੂੰ ਕਦੇ ਭੀ ਆਪਣੇ ਚਿੱਤ ਵਿਚੋਂ ਨਾਂ ਭੁਲਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "never forget God from your mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤਿਸ ਪ੍ਰਭੂ ਕੋ ਮੂਲ, ਭਾਵ ਕਦੀ ਭੀ ਮਨ ਸੇ ਨ ਭੁਲਾਉ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕਦੇ ਭੀ ਮਨੋਂ ਨ ਭੁਲਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਹੁ = ਮਨ ਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente mía, nunca olvides a Dios."