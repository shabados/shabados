[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪ੍ਰਸਾਦਿ; ਘਟਿ ਘਟਿ ਪਛਾਨੁ ॥੨॥"
page = 1183
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the Guru's grace, realise thou the Lord in all the hearts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਤੂੰ ਪ੍ਰਭੂ ਨੂੰ ਸਾਰਿਆਂ ਦਿਲਾਂ ਅੰਦਰ ਅਨੁਭਵ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, realize the Lord in each and every heart. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ ਨੇ ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਕਰ ਘਟ ਘਟ ਮੇਂ ਪਛਾਨ ਲੀਆ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ (ਤੂੰ ਉਸ ਪਰਮਾਤਮਾ ਨੂੰ) ਹਰੇਕ ਸਰੀਰ ਵਿਚ ਵੱਸਦਾ ਸਮਝ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਸਾਦਿ = ਕਿਰਪਾ ਨਾਲ। ਘਟਿ ਘਟਿ = ਹਰੇਕ ਸਰੀਰ ਵਿਚ (ਵਿਆਪਕ)। ਪਛਾਨੁ = ਸਮਝ ਲੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ve entonces a tu Señor en todos los corazones, oh ser humano. (2)"