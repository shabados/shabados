[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਰਸੁ ਸਰਸੁ. ਆਗਿਆ ॥"
page = 1272
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the will of Lord's, O cloud, burst with happiness,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੀ ਰਜ਼ਾ ਅੰਦਰ ਤੂੰ ਖੁਸ਼ੀ ਨਾਲ ਵਰ੍ਹ, ਹੇ ਬੱਦਲਾ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Rain down with happiness in God's Will."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਰੋ! ਪਰਮੇਸ੍ਵਰ ਕੀ ਆਗ੍ਯਾ ਸੇ ਉਪਦੇਸ ਕੀ ਬ੍ਰਖਾ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਨਾਮ-ਜਲ ਨਾਲ ਭਰਪੂਰ ਗੁਰੂ! ਪਰਮਾਤਮਾ ਦੀ) ਰਜ਼ਾ ਵਿਚ ਆਨੰਦ ਨਾਲ (ਨਾਮ-ਜਲ ਦੀ) ਵਰਖਾ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਰਸੁ = ਵਰਖਾ ਕਰ। ਸਰਸੁ = ਰਸ-ਰਹਿਤ, ਅਨੰਦ ਨਾਲ। ਆਗਿਆ = (ਪਰਮਾਤਮਾ ਦੇ) ਹੁਕਮ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Llueve con toda Felicidad en la Voluntad de Dios."