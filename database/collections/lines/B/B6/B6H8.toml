type = "primary"
data = "ਬਿਅੰਦਾਖ਼ਤ ਸਰ ਖ਼ਾਨਹ ਆਮਦ ਬੁਬਾਜ਼ ॥"
page = 1407

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Throwing the head there, she returned to her house."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਸਿਰ ਉਥੇ ਹੀ ਸੁਟ ਦਿੱਤਾ ਅਤੇ ਮੁੜ ਕੇ ਘਰ ਆ ਗਈ"