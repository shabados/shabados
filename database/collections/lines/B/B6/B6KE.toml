[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਧੋ; ਕੈਸੀ ਬਨੈ ਤੁਮ ਸੰਗੇ ॥"
page = 656
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord of wealth, how can I pull on with Thee?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਇਆ ਦੇ ਸੁਆਮੀ! ਮੇਰੀ ਤੇਰੇ ਨਾਲ ਕਿਸ ਤਰ੍ਹਾਂ ਨਿਭ ਸਕਦੀ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord, how can I be with You?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਧੋ! ਤੁਮਾਰੇ (ਸੰਗੇ) ਸਾਥ ਵਾ ਸੰਕੋਚ ਕਰਨੇ ਸੇ ਬਿਨਾ ਮਾਂਗੋ ਕੈਸੀ ਪਰੀਤੀ ਬਨੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੈਥੋਂ ਸ਼ਰਮ ਕੀਤਿਆਂ ਨਹੀਂ ਨਿਭ ਸਕਣੀ;"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, ¿cómo puedo llegar hasta Ti?, pues si no Te me das"