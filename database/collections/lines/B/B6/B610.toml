data = "ਪਿਲੰਗੀ ਪਵੰਗੀ ਨਮੋ ਚਰਚਿਤੰਗੀ ॥"
page = 119

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O the rider of the steed-like lion"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ੇਰ ਉਤੇ ਘੋੜੇ ਵਾਂਗ ਸਵਾਰੀ ਕਰਨ ਵਾਲੀ ਅਤੇ ਪੂਜੇ ਜਾਣ ਯੋਗ ਅੰਗਾਂ ਵਾਲੀ ਨੂੰ ਨਮਸਕਾਰ ਹੈ;"