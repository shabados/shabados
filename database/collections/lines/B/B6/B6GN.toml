[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਪਨੇ ਜਿਉ ਧਨੁ ਪਛਾਨੁ; ਕਾਹੇ ਪਰਿ ਕਰਤ ਮਾਨੁ ॥"
page = 1352
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Consider thy wealth as just a dream. Why do thou take pride."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਦੌਲਤ ਨੂੰ ਕੇਵਲ ਸੁਫਨੇ ਦੀ ਤਰ੍ਹਾਂ ਜਾਨ। ਤੂੰ ਕਾਹਦੇ ਉਤੋਂ ਹੰਕਾਰ ਕਰਦਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You must understand that this wealth is just a dream. Why are you so proud?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਇਸ ਧਨ ਕੋ ਸ੍ਵਪਨਵਤ ਝੂਠਾ ਹੀ ਪਛਾਨ। ਕਿਸ ਬਾਤ ਪਰ ਤੂੰ (ਮਾਨੁ) ਹੰਕਾਰ ਕਰਤਾ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਧਨ ਨੂੰ ਸੁਪਨੇ (ਵਿਚ ਮਿਲੇ ਪਦਾਰਥਾਂ) ਵਾਂਗ ਸਮਝ, ਤੂੰ ਕਾਹਦੇ ਉੱਤੇ ਅਹੰਕਾਰ ਕਰਦਾ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਹੇ ਪਰਿ = ਕਾਹਦੇ ਉੱਤੇ? ਮਾਨੁ = ਅਹੰਕਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las riquezas son como soñar manjares, ¿por qué tomar orgullo en ellos, oh mortal?"