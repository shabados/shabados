[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਧ ਸਾਧਿਕ ਕੇਤੇ ਮੁਨਿ ਦੇਵਾ ॥"
page = 906
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "None of the many seekers, adepts, silent sages and gods,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਘਣੇਰਿਆਂ ਅਭਿਆਸੀਆਂ, ਸਿੱਧ ਪੁਰਸ਼ਾਂ, ਖਾਮੋਸ਼ ਰਿਸ਼ੀਆਂ ਅਤੇ ਦੇਵਤਿਆਂ ਵਿੱਚੋਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The many Siddhas and seekers, silent sages and demi-gods"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਿਧ ਔ ਸਾਧਨੋਂ ਕੇ ਕਰਨੇਹਾਰੇ ਪੁਨਾ ਮੁਨੀਸ੍ਵਰ ਤਥਾ ਦੇਵਤੇ ਜੋ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਸਿੱਧ ਸਾਧਿਕ ਰਿਸ਼ੀ ਮੁਨੀ (ਹਠ ਨਿਗ੍ਰਹ ਆਦਿਕ ਕਰਦੇ ਹਨ ਪਰ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਧ = ਜੋਗ-ਸਾਧਨਾਂ ਵਿਚ ਪੁੱਗੇ ਹੋਏ ਜੋਗੀ। ਸਾਧਿਕ = ਜੋਗ-ਸਾਧਨ ਕਰਨ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los buscadores, los adeptos, los videntes y los personajes mitológicos,"