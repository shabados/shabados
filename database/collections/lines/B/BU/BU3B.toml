[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਣਿ ਵੇਖਹੁ ਲੋਕਾ; ਏਹੁ ਵਿਡਾਣੁ ॥"
page = 471
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hear and see, ye people, this strange thing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਣੋ ਅਤੇ ਦੇਖੋ, ਤੁਸੀਂ ਹੇ ਲੋਕੋ! ਇਹ ਹੈਰਾਨੀ ਦੀ ਗੱਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Hear, and see, O people, this wondrous thing."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਲੋਕੋ ਸੁਨੋ! ਔਰ ਇਸ (ਵਿਡਾਣੁ) ਅਸਚਰਜ ਕੋ ਦੇਖੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਲੋਕੋ! ਸੁਣੋ, ਵੇਖੋ, ਇਹ ਅਚਰਜ ਤਮਾਸ਼ਾ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਹੁ ਵਿਡਾਣੁ = ਇਹ ਅਚਰਜ ਕੌਤਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escucha, oh gente, y ve la Maravilla de las maravillas:"