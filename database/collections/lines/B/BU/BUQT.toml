[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੰਜਾਗੜਦੀ ਸਕਲ ਜੈ ਜੈ ਜਪੈ; ਸਾਗੜਦੀ ਸੁਰਪੁਰਹਿ ਨਾਰ ਨਰ ॥੩੯੨॥"
page = 241

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And the males and females of the city of gods hailed the victory.392."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੁਅਰਗ ਲੋਕ ਦੇ ਸਾਰੇ ਇਸਤਰੀ ਪੁਰਸ਼ ਜੈ-ਜੈ ਕਾਰ ਜੱਪ ਰਹੇ ਹਨ ॥੩੯੨॥"