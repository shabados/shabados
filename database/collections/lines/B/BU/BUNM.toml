[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੈ ਭੰਜਨ ਅਬਿਨਾਸੀ ਰਾਇ ॥"
page = 1149
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is my ever-stable kind, the destroyer of dread."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੇਰਾ ਡਰ ਨਾਸ ਕਰਨ ਵਾਲਾ ਸਦੀਵ ਸਥਿਰ ਪਾਤਿਸ਼ਾਹ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Destroyer of fear, the Eternal, Unchanging, Sovereign Lord King."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭੈ ਕੇ ਭੰਜਨਹਾਰ ਔ ਅਬਿਨਾਸੀ ਰਾਇ ਕਾ ਸ੍ਵਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਾਤਿਸ਼ਾਹ (ਜੀਵਾਂ ਦੇ ਸਾਰੇ) ਡਰ ਦੂਰ ਕਰਨ ਵਾਲਾ ਹੈ, ਉਹ ਆਪ ਨਾਸ-ਰਹਿਤ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੈ ਭੰਜਨ = ਸਾਰੇ ਡਰਾਂ ਦਾ ਨਾਸ ਕਰਨ ਵਾਲਾ। ਰਾਇ = ਪਾਤਿਸ਼ਾਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la Presencia Divina, el Rey, el Destructor de todos los miedos."