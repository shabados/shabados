[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸੁਧਿ ਨ ਹੋਵੈ ਬਾਲ ਬੁਧਿ; ਬਾਲਕ ਲੀਲਾ ਵਿਚਿ ਵਿਹਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Child's wisdom cares not for anything and he passes his time in joyful activities."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਬਾਲਕ ਬੁੱਧੀ (ਬਾਲਪਨੇ ਦੇ ਦਿਨਾਂ) ਵਿਚ ਸਮਝ ਨਹੀਂ ਹੁੰਦੀ, ਬਾਲਕਾਂ ਦੀ ਖੇਡ ਵਿਚ (ਉਮਰ) ਬੀਤਦੀ ਹੈ।"