[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਕੀ ਰੇਣ ਹੋਵੀਜੈ ॥"
page = 896
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Be thou the dust of all men's feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਾਰਿਆਂ ਬੰਦਿਆਂ ਦੇ ਪੈਰਾਂ ਦੀ ਧੂੜ ਹੋ ਜਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Be the dust of all men's feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਸਭ ਕੀ ਧੂੜ ਹੋਈਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਸਭਨਾਂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ਬਣੇ ਰਹਿਣਾ ਚਾਹੀਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇਣ = ਚਰਨ-ਧੂੜ। ਹੋਵੀਜੈ = ਹੋ ਜਾਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quiero volverme el polvo debajo de los Pies"