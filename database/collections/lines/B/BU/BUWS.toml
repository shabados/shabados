[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇੰਦ੍ਰ ਕੋਟਿ; ਜਾ ਕੇ ਸੇਵਾ ਕਰਹਿ ॥੪॥"
page = 1163
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Millions of Indras perform whose service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾਂ ਹੀ ਇੰਦ੍ਰ ਜਿਸ ਦੀ ਘਾਲ ਕਮਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Millions of Indras serve Him. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਕ੍ਰੋੜੋਂ ਹੀ ਇੰਦ੍ਰੇ ਹੈਂ ਜਿਸ ਤੇਰੇ ਚਰਨੋਂ ਕੀ ਸੇਵਾ ਕਰ ਰਹੇ ਹੈਂ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕ੍ਰੋੜਾਂ ਹੀ ਇੰਦਰ ਦੇਵਤੇ ਜਿਸ ਦੇ ਦਰ ਤੇ ਸੇਵਾ ਕਰ ਰਹੇ ਹਨ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, millones de Indras Te sirven y esperan Tu Mandato. (4)"