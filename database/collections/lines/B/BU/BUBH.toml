[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਮੰਤ੍ਰ ਹੈ ਨ ਮਿਤ੍ਰ ਹੈ; ਨ ਤਾਤ ਹੈ ਨ ਮਾਤ ਹੈ ॥"
page = 32

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He hath no minister, no friend, no father and no mother."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦਾ) ਨਾ (ਕੋਈ) ਸਲਾਹਕਾਰ ਹੈ, ਨਾ ਮਿਤਰ ਹੈ, ਨਾ ਪਿਤਾ ਹੈ ਅਤੇ ਨਾ ਹੀ ਮਾਤਾ ਹੈ;"