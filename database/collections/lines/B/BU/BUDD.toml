[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਪ੍ਰਸਾਦਿ; ਤੇਰਾ ਓਲਾ ਰਹਤ ॥"
page = 270
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose favour thy honour is preserved,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਮਿਹਰ ਦੁਆਰਾ ਤੇਰੀ ਪੱਤ ਆਬਰੂ ਬਣੀ ਹੋਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By His Grace, your honor is preserved;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਤੇਰਾ ਸਰਬ ਪ੍ਰਕਾਰ ਕਾ (ਓਲਾ) ਪੜਦਾ ਰਹਿ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਮਿਹਰ ਨਾਲ ਤੇਰਾ ਪਰਦਾ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਲਾ = ਪਰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por Su Gracia, tu honor es preservado."