[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰਿ ਵਸਤੁ; ਦਿਸੰਤਰਿ ਜਾਇ ॥"
page = 1139
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within him is the commodity, but he goes abroad in search of it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਅੰਦਰਵਾਰ ਹੀ ਵਖਰ ਹੈ ਪਰ ਉਹ ਇਸ ਦੀ ਭਾਲ ਵਿੱਚ ਪਰਦੇਸ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That which he seeks is within his own self, but he looks for it outside."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਤਮ ਵਸਤੂ ਹਿਰਦੇ ਕੇ ਬੀਚ ਹੀ ਹੈ, ਪਰੰਤੂ ਦਿਸਾਂਤਰੋਂ ਮੇਂ ਤਿਸ ਕੇ ਢੂੰਢਣੇ ਕੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਧਨ ਉਸ ਦੇ ਹਿਰਦੇ ਵਿਚ ਵੱਸਦਾ ਹੈ, ਪਰ ਉਹ (ਨਿਰੀ ਮਾਇਆ ਦੀ ਖ਼ਾਤਰ ਹੀ) ਬਾਹਰ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਤਰਿ = ਅੰਦਰ। ਦਿਸੰਤਰਿ = ਦੇਸ ਅੰਤਰਿ, ਹੋਰ ਦੇਸ਼ ਵਿਚ, ਬਾਹਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aunque lo que busca está dentro de él, lo va a buscar por fuera y lejos."