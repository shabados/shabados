data = "ਕਬਹੂ; ਭਲਾ ਭਲਾ ਕਹਾਵੈ ॥"
page = 277
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sometimes he is called extremely good."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਦੇ ਉਹ ਪਰਮ ਚੰਗਾ ਆਖਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sometimes, they are known as very, very good."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਕਬੀ ਅਪਨੇ ਆਪ ਕੌ ਭਲਾ ਭਲਾ ਕਹਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਦੇ ਚੰਗਾ ਅਖਵਾ ਰਿਹਾ ਹੈ;"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y en otro, ensalzado."