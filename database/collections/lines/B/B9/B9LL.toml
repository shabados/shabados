[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਸਬਦੀ. ਚੂਕੈ ਅਭਿਮਾਨੁ ॥੧॥"
page = 1259
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru's word one's ego is stilled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਬਾਣੀ ਰਾਹੀਂ ਜੀਵ ਦਾ ਹੰਕਾਰ ਨਵਿਰਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Word of the Guru's Shabad, his egotistical pride is dispelled. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਸਬਦ ਕਰ ਕੇ ਇਸ ਕਾ ਦੇਹ ਅਭਿਮਾਨ ਦੂਰ ਹੋ ਜਾਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ ਹੀ (ਮਨੁੱਖ ਦੇ ਅੰਦਰੋਂ) ਅਹੰਕਾਰ ਮੁੱਕਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਬਦੀ = ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ। ਚੂਕੈ = ਮੁੱਕਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues a través de la Palabra del Shabd del Guru su orgullo egoísta es disipado. (1)"