[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੀ ਗਤਿ ਮਿਤਿ; ਕਹੀ. ਨ ਜਾਇ ॥"
page = 862
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and whose state and extent can be described not;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜਿਸ ਦੀ ਦਸ਼ਾ ਅਤੇ ਵਿਸਥਾਰ ਬਿਆਨ ਨਹੀਂ ਕੀਤੇ ਜਾ ਸਕਦੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His state and condition cannot be described."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਮਿਰਜਾਦਾ ਕੀ ਗਤੀ ਕਹੀ ਨਹੀਂ ਜਾਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜਿਸ ਦੀ ਬਾਬਤ ਇਹ ਨਹੀਂ ਕਿਹਾ ਜਾ ਸਕਦਾ ਕਿ ਉਹ ਕਿਹੋ ਜਿਹਾ ਹੈ ਅਤੇ ਕੇਡਾ ਵੱਡਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਤਿ = ਆਤਮਕ ਅਵਸਥਾ। ਮਿਤਿ = ਮਾਪ। ਗਤਿ ਮਿਤਿ = ਕਿਹੋ ਜਿਹਾ ਹੈ ਅਤੇ ਕੇਡਾ ਵੱਡਾ ਹੈ = ਇਹ ਗੱਲ। ਜਾ ਕੀ = ਜਿਸ (ਪ੍ਰਭੂ) ਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su Condición y Estado no puede ser descrito,"