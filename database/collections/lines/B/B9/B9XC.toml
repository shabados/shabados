[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਮੀਣਹ ਦੇ ਪਾਣੀ ਵਾਣਗ ਗੁਲਾਬ, ਅੰਬਰ, ਮੁਸ਼ਕ ਤੇ ਅਬੀਰ"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਗੁਲਾਬੋ ਅੰਬਰੋ ਮਸ਼ਕੋ ਅਬੇਰੀ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "I have placed my head at the lotus feet of my great King Master,"