[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਕਤਿ ਸਹਾਇਤ ਕੇ ਨਮਿਤ; ਭੇਜੀ ਰਨਹਿ ਮੰਝਾਰ ॥੧੮੩॥"
page = 95

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And sent the powers for the help of the goddess in the battlefield.183.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਚੰਡੀ ਦੀ) ਸਹਾਇਤਾ ਲਈ (ਸਾਰੀਆਂ) ਦੇਵ-ਸ਼ਕਤੀਆਂ ਰਣ-ਭੂਮੀ ਵਿਚ ਭੇਜ ਦਿੱਤੀਆਂ ॥੧੮੩॥"