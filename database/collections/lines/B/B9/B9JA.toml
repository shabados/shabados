[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੂਰ ਸਸੀ ਨਭਿ ਥਾਪ ਕੈ ਤੇਜੁ ਦੇ; ਆਪ ਤਹਾ ਤੇ ਸੁ ਲੋਪ ਭਈ ਹੈ ॥"
page = 100

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Sabilising the sun and moon in the sky and making them glorious, she herself hath disappeared."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੂਰਜ ਅਤੇ ਚੰਦ੍ਰਮਾ ਨੂੰ ਆਕਾਸ਼ ਵਿਚ ਸਥਿਤ ਕਰ ਕੇ ਅਤੇ ਤੇਜ ਪ੍ਰਦਾਨ ਕਰ ਕੇ (ਚੰਡੀ) ਆਪ ਉਥੋਂ ਲੋਪ ਹੋ ਗਈ।"