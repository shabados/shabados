[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਬਦੁ ਵਸੈ ਸਚੁ ਅੰਤਰਿ ਹੀਆ ॥"
page = 943
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "A. 52: Enshrining the True Name in his mind and with the Lord's love,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉ. 52: ਸੱਚੇ ਨਾਮ ਨੂੰ ਆਪਣੇ ਹਿਰਦੇ ਅੰਦਰ ਟਿਕਾਉਣ ਅਤੇ ਪ੍ਰਭੂ ਦੀ ਪ੍ਰੀਤ ਨਾਲ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With the True Shabad abiding deep within the heart,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰੁ ਜੋ ਸਚੁ ਸਬਦ ਹ੍ਰਿਦੇ ਕੇ ਅੰਤਰ ਬਸੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਗੁਰੂ ਦਾ ਸ਼ਬਦ ਵੱਸਦਾ ਹੈ ਉਸ ਦੇ ਅੰਦਰ ਪ੍ਰਭੂ (ਆਪ) ਵੱਸਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਤਰਿ ਹੀਆ = ਹਿਰਦੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con el Verdadero Shabd uno habita en lo profundo del corazón,"