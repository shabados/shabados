[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਊਚ ਤੇ ਊਚ; ਤਾ ਕਾ ਦਰਬਾਰਾ ॥"
page = 740
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The highest of the high is His court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਚਿਆ ਦੀ ਪਰਮ ਉਚੀ ਹੈ ਉਸ ਦੀ ਕਚਹਿਰੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Royal Court of His Darbaar is the highest of the high."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮਾਦੀ ਦੇਵਤਿਓਂ ਸੇ ਭੀ ਵਾਹਿਗੁਰੂ ਕਾ ਦਰਬਾਰ ਊਚਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹੀ ਜਪ) ਉਸ ਦਾ ਦਰਬਾਰ ਉੱਚੇ ਤੋਂ ਉੱਚਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕਾ = ਉਸ (ਪਰਮਾਤਮਾ) ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En lo más Alto de lo alto está la Corte del Señor,"