[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖੋਜਹਿ; ਜਨ ਮੁਨੀ ਹਾਂ ॥"
page = 409
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Search Him the silent sages."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖਾਮੋਸ਼ ਰਿਸ਼ੀ ਉਸ ਨੂੰ ਭਾਲਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The silent sages search for Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨਾ! ਜਿਸ ਕੋ ਮੁਨਿ ਖੋਜਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਰਿਸ਼ੀ ਮੁਨੀ ਉਸ ਪਰਮਾਤਮਾ ਨੂੰ ਖੋਜਦੇ ਆ ਰਹੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖੋਜਹਿ = ਖੋਜਦੇ ਹਨ। ਜਨ ਮੁਨੀ = ਮੁਨੀ ਜਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal hombre es buscado por los sabios"