[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਹਜਿ ਸਰੋਵਰਿ ਸਚ ਖੰਡਿ; ਸਾਧਸੰਗਤਿ ਸਚ ਤਖਤਿ ਹਰੀੜੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Holy congregation, the abode of truth and throne of the true Lord is the manasarovar for the gurmukhs."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸ਼ਾਂਤੀ ਦਾ ਤਲਾਉ ਤੇ ਸੱਚਾ ਖੰਡ, ਸਾਧ ਸੰਗਤ ਹਰੀ ਦਾ ਸੱਚਾ ਤਖਤ ਹੈ।"