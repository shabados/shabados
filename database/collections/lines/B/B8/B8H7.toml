[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਆਗੈ; ਨਹੀ ਕਿਸੈ ਕਾ ਚਾਰਾ ॥"
page = 1058
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As against Him, no one has any power."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਅੱਗੇ ਕਿਸੇ ਦਾ ਭੀ ਜ਼ੋਰ ਨਹੀਂ ਚਲਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one has any power to stand against Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਆਗੇ ਕਿਸੇ ਕਾ ਬਲ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਸਾਹਮਣੇ ਕਿਸੇ ਦਾ ਜ਼ੋਰ ਨਹੀਂ ਚੱਲ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਾਰਾ = ਜ਼ੋਰ, ਪੇਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y parar a decirle porqué y dónde."