[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕ ਮਨਿ; ਪੁਰਖੁ ਨਿਰੰਜਨੁ ਧਿਆਵਉ ॥"
page = 1396
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Single-mindedly, contemplate thou thy immaculate Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਚਿੱਤ ਨਾਲ, ਤੂੰ ਆਪਣੇ ਪਵਿੱਤਰ ਪ੍ਰਭੂ ਦਾ ਆਰਾਧਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate single-mindedly on the Immaculate Primal Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਕੋ ਇਕਾਗ੍ਰ ਕਰ ਕੇ ਨਿਰੰਜਨ ਪੁਰਖ ਕੋ ਧਿਆਵਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਇਕਾਗ੍ਰ-ਮਨ ਹੋ ਕੇ ਮਾਇਆ ਤੋਂ ਰਹਿਤ ਅਕਾਲ ਪੁਰਖ ਨੂੰ ਸਿਮਰਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਕ ਮਨਿ = ਇਕਾਗ੍ਰ ਮਨ ਦੀ ਰਾਹੀਂ। ਨਿਰੰਜਨੁ = ਅੰਜਨੁ (ਮਾਇਆ) ਤੋਂ ਰਹਤ। ਧਿਆਵਉ = ਮੈਂ ਧਿਆਵਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Medita con tu mente tranquila en el Inmaculado Señor Creador, por la Gracia del Guru"