[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਦਿਆਨ ਬਸਨੰ ਸੰਸਾਰੰ; ਸਨਬੰਧੀ, ਸ੍ਵਾਨ ਸਿਆਲ ਖਰਹ ॥"
page = 1359
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man abides in the world wilderness. His Kinsmen are like dogs, jackals and asses."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਨਸਾਨ ਜਗਤ ਦੇ ਬੀਆਬਾਨ ਅੰਦਰ ਵਸਦਾ ਹੈ। ਉਸ ਦੇ ਸਾਕ-ਸੈਨ ਕੁਤਿਆਂ, ਗਿਦੜਾਂ ਤੇ ਗਧਿਆਂ ਦੀ ਮਾਨੰਦ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Living in the world, it is like a wild jungle. One's relatives are like dogs, jackals and donkeys."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰ ਰੂਪੀ (ਉਦਿਆਨ) ਉਜਾੜ ਮੇਂ ਜੀਵ ਕਾ ਬਸਨਾ ਹੈ। ਊਹਾਂ ਕੁਤੇ ਅਰ ਗਿਦੜ ਅਰ ਗਧੇ ਹੋਤੇ ਹੈਂ, ਈਹਾਂ ਲੋਭੀ ਕੂਕਰ ਔਰ ਆਲਸੀ ਗਿਦੜ ਔ ਇਸਤ੍ਰੀ ਅਧੀਨ ਗਧੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਦਾ ਵਾਸਾ ਇਕ ਐਸੇ ਸੰਸਾਰ-ਜੰਗਲ ਵਿਚ ਹੈ ਜਿਥੇ ਕੁੱਤੇ, ਗਿੱਦੜ, ਖੋਤੇ ਇਸ ਦੇ ਸੰਬੰਧੀ ਹਨ (ਭਾਵ, ਜੀਵ ਦਾ ਸੁਭਾਉ ਕੁੱਤੇ ਗਿੱਦੜ ਖੋਤੇ ਵਰਗਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਦਿਆਨ = ਜੰਗਲ (उद्यान)। ਸ੍ਵਾਨ = ਕੁੱਤਾ (श्वन्)। ਸਿਆਲ = ਗਿੱਦੜ (शृगाल)। ਖਰਹ = ਖੋਤਾ, ਖਰ (खरःक्ष् an ass)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vivir en el mundo es como vivir en la jungla salvaje, los parientes son como perros, jacales y burros."