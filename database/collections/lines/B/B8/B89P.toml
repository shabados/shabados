[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਡਿਆ ਹੰਸੁ; ਦਸਾਏ ਰਾਹ ॥"
page = 137
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The swan (soul!) flies away and inquires about the road to take."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਜ-ਹੰਸ (ਆਤਮਾ) ਉਡ ਜਾਂਦੀ ਹੈ ਅਤੇ ਜਾਣ ਦਾ ਰਸਤਾ ਪੁਛਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The swan of the soul takes flight, and asks which way to go."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਦੇਹ ਭਿੰਨ ਹੂਆ ਜਮਦੂਤੋਂ ਸੇ ਰਾਹ ਕੋ (ਦਸਾਏ) ਪੂਛਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵਾਤਮਾ (ਸਰੀਰ ਵਿਚੋਂ) ਨਿਕਲ ਕੇ (ਅਗਾਂਹ ਦੇ) ਰਾਹ ਪੁੱਛਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਸਾਏ = ਪੁੱਛਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero el pajarito ha volado, y nadie sabe a dónde."