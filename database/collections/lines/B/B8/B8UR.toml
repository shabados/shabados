[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦੀ ਮੁਕਤੁ ਹੋਇ; ਸਾਚੇ ਨਿਜ ਤਾੜੀ ॥੬॥"
page = 1011
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Being attuned to his True Lord, through the Guru's grace, he is emancipated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਆਪਣੇ ਸੰਚੇ ਸਾਹਿਬ ਨਾਲ ਇਕਸੁਰ ਹੋਣ ਦੁਆਰਾ ਉਹ ਮੁਕਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, one is liberated, absorbed in the primal trance of Truth. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਵਾਲੇ ਜੋ ਸਾਚੇ ਪੁਰਸ ਹੈਂ, ਸੋ ਨਿਜ ਸਰੂਪ ਮੇਂ (ਤਾੜੀ) ਸਮਾਧੀ ਕਰ ਕੇ ਮੁਕਤਿ ਹੂਏ ਹੈਂ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਆਪਣੇ ਮਨ ਦੀ ਇਸ ਗ਼ੁਲਾਮੀ ਵਿਚੋਂ ਮਨਮੁਖ ਭੀ) ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਸੁਤੰਤਰ ਹੋ ਕੇ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਵਿਚ ਆਪਣੀ ਸੁਰਤ ਜੋੜ ਲੈਂਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਕਤੁ = ਆਜ਼ਾਦ, ਸੁਤੰਤਰ। ਨਿਜ = ਆਪਣੀ। ਤਾੜੀ = ਸੁਰਤ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero si se entonan en el Uno Verdadero, son emancipados por la Gracia del Guru.(6)"