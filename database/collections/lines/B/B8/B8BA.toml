[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਪ੍ਰਭ ਦਾਤਾ ਏਕੁ ਤੂੰ; ਤੂੰ ਆਪੇ ਬਖਸਿ ਮਿਲਾਇ ॥"
page = 234
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Lord God, Thou alone art the Giver and Thou Thyself forgivest and blendest the mortals with Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ! ਕੇਵਲ ਤੂੰ ਹੀ ਦਾਤਾਰ ਹੈ, ਤੂੰ ਆਪ ਹੀ ਜੀਵਾਂ ਨੂੰ ਮਾਫ ਕਰਕੇ ਆਪਣੇ ਨਾਲ ਅਭੇਦ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord God, You are the One and Only Giver; You forgive us, and unite us with Yourself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ ਸਮਰਥ! ਏਕ ਤੂੰ ਹੀ ਦਾਤਾ ਹੈਂ, ਪੁਨਾ ਤੂੰ ਆਪ ਹੀ ਬਖਸ ਕਰ ਮਿਲਾਇ ਲੇਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਹੇ ਪ੍ਰਭੂ! ਸਿਰਫ਼ ਤੂੰ ਹੀ ਹੈਂ ਜੋ (ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਆਪਣੇ ਨਾਮ ਦੀ)  ਦਾਤ ਦੇਣ ਵਾਲਾ ਹੈਂ, ਤੂੰ ਆਪ ਹੀ ਮਿਹਰ ਕਰ ਕੇ ਮੈਨੂੰ ਆਪਣੇ ਚਰਨਾਂ ਵਿਚ ਜੋੜ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਬਖਸਿ = ਬਖ਼ਸ਼ਸ਼ ਕਰ ਕੇ। ਮਿਲਾਇ = (ਆਪਣੇ ਚਰਨਾਂ ਨਾਲ) ਜੋੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor, el Uno Solo, es Magnánimo; nos perdona y por Su Misericordia nos une Consigo Mismo."