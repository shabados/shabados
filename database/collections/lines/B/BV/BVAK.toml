[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਸਚਿ ਲਾਏ; ਸੋਈ ਲਾਗੈ ॥"
page = 666
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone attaches to Truth, whom the Lord Himself attaches."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਓਹੀ ਸੱਚ ਨਾਲ ਜੁੜਦਾ ਹੈ, ਜਿਸ ਨੂੰ ਸਾਹਿਬ ਆਪ ਜੋੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is attached to Truth, whom the Lord Himself so attaches."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸਕੌ ਅਪਨੇ ਸਚ ਸਰੂਪ ਮੇਂ ਵਾਹਿਗੁਰੂ ਲਗਾਵਤਾ ਹੈ, ਸੋਈ ਲਗਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਕਰਤਾਰ ਜਿਸ ਮਨੁੱਖ ਨੂੰ (ਆਪਣੇ) ਸਦਾ-ਥਿਰ ਨਾਮ ਵਿਚ ਜੋੜਦਾ ਹੈ, ਉਹੀ ਮਨੁੱਖ (ਨਾਮ-ਸਿਮਰਨ ਵਿਚ) ਲੱਗਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚਿ = ਸਦਾ-ਥਿਰ ਨਾਮ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, a través del Nombre,"