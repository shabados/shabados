[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਕਉ; ਗੁਰਿ ਦੀਖਿਆ ਦੀਨੑ ॥"
page = 376
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto Nanak, the Guru has imparted this instruction:"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੂੰ ਗੁਰਾਂ ਨੇ ਇਹ ਸਿੱਖਿਆ ਦਿੱਤੀ ਹੈ ਕਿ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Unto Nanak, the Guru has revealed these instructions:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹਮ ਕੋ ਗੁਰੋਂ ਨੇ ਐਸੀ (ਦੀਖਿਆ) ਸਿਖ੍ਯਾ ਦੀਨੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਗੁਰੂ ਨੇ ਸਿੱਖਿਆ ਦਿੱਤੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਗੁਰਿ = ਗੁਰੂ ਨੇ। ਦੀਖਿਆ = ਸਿੱਖਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A Nanak, el Guru le ha dado tal Instrucción,"