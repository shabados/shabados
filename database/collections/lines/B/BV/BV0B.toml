[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਾਵਨਿ ਤੁਧਨੋ ਇੰਦ੍ਰ. ਇੰਦ੍ਰਾਸਣਿ ਬੈਠੇ; ਦੇਵਤਿਆ ਦਰਿ ਨਾਲੇ ॥"
page = 8
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Indra, seated in his throne, with the deities at Thy gate, sings Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਤਖ਼ਤ ਤੇ ਬੈਠਾ ਹੋਇਆ ਇੰਦਰ, ਤੇਰੇ ਦਰਵਾਜ਼ੇ ਤੇ ਸੁਰਾਂ ਸਮੇਤ ਤੈਨੂੰ ਗਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Indra, seated on His Throne, sings of You, with the deities at Your Door."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੇਵਤਿਓਂ ਕੇ ਸਹਿਤ ਇੰਦ੍ਰ ਪਦ ਕੀ ਜੋ ਗਾਦੀ ਹੈ, ਤਿਸ ਪਰ ਬੈਠੇ ਹੂਏ ਇੰਦ੍ਰ ਭੀ ਤੇਰੇ ਦ੍ਵਾਰੇ ਪਰ ਗਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਈ ਇੰਦਰ ਦੇਵਤੇ ਆਪਣੇ ਤਖ਼ਤ ਉੱਤੇ ਬੈਠੇ ਹੋਏ ਦੇਵਤਿਆਂ ਸਮੇਤ ਤੇਰੇ ਦਰ ਉੱਤੇ ਤੈਨੂੰ ਗਾ ਰਹੇ ਹਨ (ਤੇਰੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੇ ਗੀਤ ਗਾ ਰਹੇ ਹਨ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇੰਦ੍ਰਾਸਣਿ = {ਇੰਦ੍ਰ = ਆਸਣ} ਇੰਦਰ ਦੇ ਆਸਣ ਉੱਤੇ (ਬੈਠੇ ਹੋਏ)। ਦਰਿ = ਤੇਰੇ ਦਰਵਾਜ਼ੇ ਉੱਤੇ। ਦੇਵਤਿਆ ਨਾਲੇ = ਦੇਵਤਿਆਂ ਸਮੇਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "incontables son las voces que cantan. Incontables son las melodías y cantos de esta canción del mundo."