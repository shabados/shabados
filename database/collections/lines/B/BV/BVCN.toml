[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਕੀ ਬੇਨੰਤੀਆ; ਮਿਲੈ ਨਿਥਾਵੇ ਥਾਉ ॥੨॥"
page = 704
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This is the prayer of Nanak, \"O Lord, bless Thou the abodeless beings with an abode\"."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਦੀ ਇਹ ਪ੍ਰਾਰਥਨਾ ਹੈ \"ਹੇ ਪ੍ਰਭੂ! ਥਾਂ ਵਿਹੁਣੇ ਜੀਵਾਂ ਨੂੰ ਤੂੰ ਥਾਂ ਟਿਕਾਣਾ ਪ੍ਰਦਾਨ ਕਰ।\""

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is Nanak's humble prayer, to bless the homeless with a home. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੈਂ ਦਾਸ ਕੀ ਆਪ ਕੇ ਆਗੇ ਇਹੀ ਬੇਨਤੀ ਹੈ, ਜੋ ਮੈਂ ਨਿਥਾਵੇਂ ਕੌ ਸਰੂਪ ਅਸਥਾਨ ਪ੍ਰਾਪਤਿ ਹੋਵੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਦੀ (ਉਸੇ ਦੇ ਦਰ ਤੇ ਹੀ) ਅਰਦਾਸ ਹੈ ਕਿ (ਮੈਨੂੰ) ਨਿਆਸਰੇ ਨੂੰ (ਉਸ ਦੇ ਚਰਨਾਂ ਵਿਚ) ਥਾਂ ਮਿਲ ਜਾਏ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਥਾਵੇ = ਨਿਆਸਰੇ ਨੂੰ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La oración de Nanak es, oh Dios, la que da Tu Soporte a Tus criaturas que no lo tienen. (2)"