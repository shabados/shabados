[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਕਰਤਾ ਹੈ ਅਬਿਨਾਸੀ ॥"
page = 1026
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of Himself, the Creator-Lord is Imperishable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪ ਸਿਰਜਦਹਾਰ ਸੁਆਮੀ ਅਮਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator Lord is eternal and imperishable."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਵਹੁ ਕਰਤਾ ਪੁਰਖ ਆਪੇ ਅਬਨਾਸੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਬਿਨਾਸ਼ੀ ਕਰਤਾਰ ਆਪ ਹੀ (ਹਰੇਕ ਦੇ ਅੰਦਰ ਮੌਜੂਦ) ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuya Esencia es Eterna e Indestructible."