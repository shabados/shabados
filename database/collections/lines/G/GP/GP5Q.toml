[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੂਪਵੰਤੁ; ਸੋ ਚਤੁਰੁ ਸਿਆਣਾ ॥"
page = 198
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That man alone is handsome clever and wise,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹੀ ਆਦਮੀ ਸੁੰਦਰ, ਹੁਸ਼ਿਆਰ ਅਤੇ ਅਕਲਮੰਦ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They alone are handsome, clever and wise,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰੂਪ ਵਾਲਾ ਸੋਈ ਹੈ ਔਰ ਬਾਣੀ ਕਾ ਚਤਰ ਪੁਨਾ ਬੁਧੀ ਕਾ ਸਿਆਣਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਉਹੀ ਮਨੁੱਖ ਰੂਪ ਵਾਲਾ ਹੈ ਉਹੀ ਤੀਖਣ ਬੁੱਧਿ ਵਾਲਾ ਹੈ ਉਹੀ ਸਿਆਣਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੂਪਵੰਤੁ = ਰੂਪ ਵਾਲਾ। ਚਤੁਰੁ = ਤੀਛਣ ਬੁੱਧਿ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo es guapo, astuto y sabio,"