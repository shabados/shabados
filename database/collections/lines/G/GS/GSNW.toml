[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਦ੍ਵੈ ਅਬਿਨਾਸੀ, ਪਰਮ ਪ੍ਰਕਾਸੀ; ਤੇਜ ਸੁਰਾਸੀ ਅਕ੍ਰਿਤ ਕ੍ਰਿਤੰ ॥"
page = 130

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art Non-dual, Indestructible, Illuminator of thy light, the outlay of splendour and Creator of the Uncreated."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦ੍ਵੈਤ ਤੋਂ ਰਹਿਤ, ਅਵਿਨਾਸ਼ੀ, ਪਰਮ ਪ੍ਰਕਾਸ਼ ਵਾਲੇ, ਤੇਜ ਦੀ ਰਾਸ਼ੀ ਵਾਲੇ ਅਤੇ (ਕਿਸੇ ਦੁਆਰਾ) ਨਾ ਬਣਾਏ ਗਏ ਹੋ,"