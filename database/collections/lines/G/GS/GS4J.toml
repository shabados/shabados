[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਨਾਮੁ ਧਿਆਈਐ; ਬੂਝੈ ਵੀਚਾਰਾ ॥"
page = 424
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru, one dwells on the Name and realises the worth of Lord's meditation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ, ਆਦਮੀ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਦਾ ਹੈ, ਤੇ ਸਾਈਂ ਦੀ ਬੰਦਗੀ ਦੀ ਕਦਰ ਨੂੰ ਅਨੁਭਵ ਕਰ ਲੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh meditates on the Naam; he achieves reflective meditation and understanding."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਿ ਜੋ ਹੈਂ ਸਮਝ ਬਿਚਾਰ ਕੇ ਨਾਮ ਧ੍ਯਾਉਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਰਨ ਪਿਆਂ ਹੀ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਸਿਮਰਿਆ ਜਾ ਸਕਦਾ ਹੈ ਤੇ ਇਸ ਵਿਚਾਰ ਨੂੰ ਸਮਝਿਆ ਜਾ ਸਕਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A través del Guru, uno repite el Naam, el Nombre del Señor y conociendo Su Esencia,"