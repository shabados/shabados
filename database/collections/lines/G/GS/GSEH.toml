[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੀ ਟੇਕ; ਬਿਨਸੈ ਜੰਜਾਲੁ ॥੧॥"
page = 1147
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through Thy protection, the involvement are past."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਪਨਾਹ ਰਾਹੀਂ ਪੁਆੜੇ ਮੁਕ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With Your Support, my entanglements vanish. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਓਟ ਕਰ ਸਭ ਜੰਜਾਲ ਮਿਟ ਗਏ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਆਸਰੇ (ਮਨੁੱਖ ਦੀ) ਮਾਇਆ ਦੇ ਮੋਹ ਦੀ ਫਾਹੀ ਟੁੱਟ ਜਾਂਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੰਜਾਲੁ = ਮਾਇਆ ਦੇ ਮੋਹ ਦੀ ਫਾਹੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, cuando me das Tu Soporte todas mis preocupaciones se quedan en el pasado. (1)"