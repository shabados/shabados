[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜਗਮਗ ਜੋਤਿ ਉਦੋਤੁ ਕਰਿ; ਸੂਰਜ ਚੰਦ ਨ ਲਖ ਪੁਜੰਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Myriads of suns and moons cannot reach their effulgence."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਜੋਤ ਨੂੰ ਜਗਮਗ ਕਰ ਕੇ ਉਦੇ ਕਰਦੇ ਹਨ, ਲੱਖ ਸੂਰਜ ਚੰਦ ਭੀ (ਉਸ ਨੂੰ) ਨਹੀਂ ਪਹੁੰਚ ਸਕਦੇ।"