type = "primary"
data = "ਨਮੋ ਭੀਮਿ ਸਰੂਪਾ ਨਮੋ ਲੋਕ ਮਾਤਾ ॥"
page = 119

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O the mother of the universe having large body!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਭਿਆਨਕ ਰੂਪ ਵਾਲੀ ਨੂੰ ਨਮਸਕਾਰ ਹੈ; ਜਗਤ ਮਾਤਾ ਨੂੰ ਨਮਸਕਾਰ ਹੈ;"