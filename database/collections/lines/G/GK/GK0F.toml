data = "ਪਾਰਬ੍ਰਹਮ ਕੋ ਤਿਨੀ ਪਛਾਨਾ ॥੫੫॥"
page = 59

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Only those who controlled their minds, recognized the Supreme Brahman.55."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਨੇ ਹੀ ਬ੍ਰਹਮ ਨੂੰ ਪਛਾਣਿਆ ਹੈ ॥੫੫॥"