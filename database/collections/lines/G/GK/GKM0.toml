[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸਹਿ ਪਰਾਪਤਿ ਸਾਧਸੰਗੁ ॥"
page = 1181
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who is blessed with the saints' society,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਸਤਿਸੰਗਤ ਪ੍ਰਦਾਨ ਹੋਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whoever enters the Saadh Sangat"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਸਤਿਸੰਗੁ ਪ੍ਰਾਪਤਿ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਗੁਰੂ ਦੀ ਸੰਗਤ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸਹਿ = {ਕ੍ਰਿਆ ਵਿਸ਼ੇਸ਼ਣ 'ਹੀ' ਦੇ ਕਾਰਨ ਲਫ਼ਜ਼ 'ਜਿਸੁ' ਦਾ (ੁ) ਉਡ ਗਿਆ ਹੈ}। ਸਾਧ ਸੰਗੁ = ਗੁਰੂ ਦਾ ਸਾਥ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que es bendecido con la Saad Sangat,"