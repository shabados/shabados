data = "ਧਰਿ ਆਨ ਮੋਹਿ ਦਿਖਾਰੀਯੋ ॥੭੭੩॥"
page = 281

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Do not kill the boys of the sages, but bring them and show them to me.”773."

