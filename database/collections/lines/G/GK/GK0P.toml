[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਹੀ ਮਿਲਿ ਕੈ; ਸ੍ਰਿਸਟਿ ਉਪਾਈ ॥"
page = 126
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting together both have created the universe."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੋਨਾਂ ਨੇ ਇਕੱਠੇ ਹੋ ਕੇ ਦੁਨੀਆਂ ਪੈਦਾ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the two joined together, the Universe was produced."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੋਨੋ ਨੇ ਮਿਲ ਕਰ ਸ੍ਰਿਸਟੀ ਉਤਪਤ ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹਨਾਂ ਦੋਹਾਂ ਨੇ ਹੀ ਮਿਲ ਕੇ ਜਗਤ-ਰਚਨਾ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਹੀ = ਦੁਹਾਂ ਨੇ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y de uno a otro el Universo entero se mueve."