data = "ਤਵਨ ਤ੍ਰਿਯਾ ਕੋ ਤੁਰਤੁ ਹੀ; ਡੋਗਰ ਘਾਉ ਉਬਾਰਿ ॥"
page = 855

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That Dogar, very shortly, killed his woman,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ) ਡੋਗਰ ਨੇ ਉਸ ਇਸਤਰੀ ਦੇ ਵਾਰ ਤੋਂ (ਆਪਣੇ ਆਪ ਨੂੰ) ਬਚਾ ਕੇ"