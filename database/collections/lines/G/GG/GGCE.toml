[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰੀ, ਸੁਨ ਗ੍ਵਾਰਨਿ ਮੋ ਬਤੀਯਾ; ਤਿਨ ਹੂੰ ਸੁਨਿ ਸ੍ਰੌਨ ਸੁਨੈਬੇ ਕਉ ਕੀਨੋ ॥"
page = 366

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He has asked me to say something to you for your attention"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਪੀ (ਰਾਧਾ!) ਮੇਰੀਆਂ ਗੱਲਾਂ ਸੁਣ, ਉਨ੍ਹਾਂ ਨੂੰ ਸੁਣਨ ਲਈ ਆਪਣੇ ਕੰਨਾਂ ਨੂੰ ਸੁਣਨ ਯੋਗ ਕਰ।"