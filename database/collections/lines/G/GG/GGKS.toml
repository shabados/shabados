[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ # ਅਜਿਹਾ ਕੌਣ ਹੈ, ਜਿਹੜਾ ਸਿਰ ਤੋਣ ਪੈਰਾਣ ਤਕ ਰੱਬ ਦਾ ਹੀ ਨੂਰ ਨਹੀਣ # "

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਕੀਸਤ ਐ ਜਾਨ ਕੂ ਸਰਾਪਾ ਨੂਰ ਨੀਸਤ ॥੬੨॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Whatever I wanted or needed, I could get that from Him. (414)"