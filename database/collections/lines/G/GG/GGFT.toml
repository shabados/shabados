[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਜਨ; ਰਾਮ ਭਗਤਿ ਹਰਿ ਪਿਆਰਿ ॥"
page = 228
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The persons who bear love to God and Lord's devotional service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਪੁਰਸ਼ ਵਾਹਿਗੁਰੂ ਅਤੇ ਸੁਆਮੀ ਦੀ ਪ੍ਰੇਮ-ਮਈ ਸੇਵਾ ਨੂੰ ਮੁਹੱਬਤ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who worship the Lord and love the Lord"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੁਰਸ ਹਰੀ ਰਾਮ ਕੀ ਭਗਤਿ ਮੇਂ ਪਿਆਰ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੇ ਬੰਦੇ ਹਰਿ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਦੇ ਪਿਆਰ ਵਿਚ (ਜੁੜਦੇ) ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਿਆਰਿ = ਪਿਆਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si alguien alaba, medita y ama al Señor, es porque el Señor,"