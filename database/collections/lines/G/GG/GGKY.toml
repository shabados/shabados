[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁ ਲਜ ਨਾਮ ਸੂਰਮਾ; ਸੁ ਮੰਤ੍ਰਿ ਤਾਸੁ ਮਾਨੀਐ ॥੨੪੮॥"
page = 700

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is the same warrior whose body is indivisible, whose form is powerful and who is modest.21.248."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ 'ਲਜ' (ਲਜਾ) ਨਾਮ ਵਾਲਾ ਸੂਰਮਾ, ਉਸ ਦਾ ਮੰਤਰੀ ਮੰਨਿਆ ਜਾਂਦਾ ਹੈ ॥੨੪੮॥"