[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਸਕਰ ਕੋ ਪਤਿ ਜਾਨਿ ਕੈ; ਦੁਹੂ ਤ੍ਰਿਯਨ ਗਹਿ ਲੀਨ ॥੬॥"
page = 884

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And, mistaking the thief as their husband, they apprehended him.( 6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਚੋਰ ਨੂੰ ਪਤੀ ਸਮਝ ਕੇ ਦੋਹਾਂ ਨੇ ਪਕੜ ਲਿਆ ॥੬॥"