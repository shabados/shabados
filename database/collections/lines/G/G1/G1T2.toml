[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਿਦੈ ਛੁਰੀ ਸੰਧਿਆਨੀ ॥"
page = 1351
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "however, in thy heart thou have drawn a scalpel to stab others."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੰਤੂ ਆਪਣੇ ਦਿਲ ਵਿੱਚ ਹੋਰਨਾਂ ਨੂੰ ਮਾਰਨ ਲਈ ਤੂੰ ਕਰਦ ਖਿਚੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But in your heart, you have drawn out the sword."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਿਦੇ ਮੇਂ ਹਿੰਸਾ ਰੂਪੀ ਛੁਰੀ ਜੋੜੀ ਹੂਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਤੂੰ ਛੁਰੀ ਕੱਸ ਕੇ ਰੱਖੀ ਹੋਈ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਧਿਆਨੀ = ਤੱਕ ਕੇ ਰੱਖੀ ਹੋਈ ਹੈ, ਨਿਸ਼ਾਨਾ ਬੰਨ੍ਹ ਕੇ ਰੱਖੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero en tu corazón has desenvainado la espada,"