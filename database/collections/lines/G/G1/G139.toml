[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਤਪਦਾ ਪਰਉਪਕਾਰ ਨੋ; ਠੰਢੇ ਪਰਉਪਕਾਰ ਵਿਹਾਣੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Whethger hot or cold its purpose always is other's good."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਗੱਲ ਕੀ) ਤਪਣ ਅਤੇ ਸੀਤਲ ਹੋਣ ਵਿਖੇ ਪਰੋਪਕਾਰ ਵਿਖੇ ਹੀ ਲੱਗਦਾ ਹੈ।"