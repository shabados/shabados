[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਲੁ ਮੇਰੇ ਪ੍ਰੀਤਮਾ ਜੀਉ; ਤੁਧੁ ਬਿਨੁ ਖਰੀ ਨਿਮਾਣੀ ॥"
page = 244
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meet me I my honourable Beloved, Without Thee I am greatly dishonoured."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਦਰਸ਼ਨ ਦੇ ਹੇ ਮੇਰੇ ਪਤਵੰਤੇ ਦਿਲਬਰ! ਤੇਰੇ ਬਗੈਰ ਮੈਂ ਬਹੁਤ ਹੀ ਬੇਇਜ਼ਤ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meet me, O my Dear Beloved. Without You, I am totally dishonored."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪ੍ਰੀਤਮ! ਤੂੰ ਮੁਝ ਕੋ ਮਿਲ। ਕਿਉਂਕਿ ਮੈਂ ਤੇਰੇ ਸੇ ਬਿਨਾਂ ਜੀ ਮੇਂ ਖਰੀ ਨਿਮਾਣੀ ਹੋ ਰਹੀ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪ੍ਰੀਤਮ ਪ੍ਰਭੂ ਜੀ! ਮੈਨੂੰ ਮਿਲ, ਤੈਥੋਂ ਬਿਨਾ ਮੈਂ ਬੁਹਤ ਆਜਿਜ਼ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ven a tomarme, oh mi Bienamado; sin Ti, no valgo nada."