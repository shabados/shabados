[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰੁਦ੍ਰ ਕੇ ਭਾਖਬੇ ਕੋ ਸੁ ਕਛੂ ਕਬਿ ਸ︀ਯਾਮ ਭਨੈ ਜੜ ਭੇਦ ਨ ਜਾਨਿਯੋ ॥੨੨੭੯॥"
page = 527

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That fool did not understand the secret of Shiva’s words.2279."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਵੀ ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, ਰੁਦ੍ਰ ਦੇ ਕਹੇ ਦਾ ਉਸ ਮੂਰਖ ਨੇ ਕੁਝ ਭੇਦ ਨਹੀਂ ਜਾਣਿਆ ॥੨੨੭੯॥"