[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਮ ਮਰਣ ਦੁਖ ਖਿਨ ਮਹਿ ਬਿਨਸੇ; ਹਰਿ ਪਾਇਆ ਪ੍ਰਭੁ ਅਬਿਨਾਸੀ ॥"
page = 1116
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The pain of birth and death is stilled in an instant and the Imperishable God Lord is obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੰਮਣ ਅਤੇ ਮਰਣ ਦੀ ਪੀੜ ਇਕ ਮੁਹਤ ਵਿੱਚ ਨਵਿਰਤ ਹੋ ਜਾਂਦੀ ਹੈ ਅਤੇ ਕਾਲ-ਰਹਿਤ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਪਰਾਪਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The pains of birth and death vanish in an instant, and the Eternal, Imperishable Lord God is found."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨੋਂ ਕੇ ਜਨਮ ਮਰਨ ਆਦਿਕ ਦੁਖ ਖਿਨ ਵਿਖੇ ਨਸ੍ਟ ਹੋ ਜਾਤੇ ਭਏ ਔਰ ਹਰਿ ਅਬਿਨਾਸੀ ਪ੍ਰਭੂ ਕੋ ਤਿਨੋਂ ਨੇ ਪਾਇ ਲੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੇ ਦਰਸਨ ਦੀ ਬਰਕਤਿ ਨਾਲ ਉਸ ਮਨੁੱਖ ਨੇ) ਅਬਿਨਾਸ਼ੀ ਪ੍ਰਭੂ (ਦਾ ਮਿਲਾਪ) ਹਾਸਲ ਕਰ ਲਿਆ, ਉਸ ਮਨੁੱਖ ਦੇ ਜਨਮ ਤੋਂ ਮਰਨ ਤਕ ਦੇ ਸਾਰੇ ਦੁੱਖ ਨਾਸ ਹੋ ਗਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨਮ ਮਰਣ ਦੁਖ = ਜਨਮ ਮਰਨ ਦੇ ਦੁੱਖ। ਬਿਨਸੇ = ਨਾਸ ਹੋ ਗਏ। ਅਬਿਨਾਸੀ = ਨਾਸ-ਰਹਿਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el dolor de nacimientos y muertes acalló instantáneamente y ellos obtuvieron al Señor Eterno."