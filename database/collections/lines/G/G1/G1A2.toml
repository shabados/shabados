[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਵਰ ਖੇਲ ਖੇਲਨ ਲਗੇ; ਅਤਿ ਹੀ ਹਰਖ ਬਢਾਇ ॥੯੮੫॥"
page = 395

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Gracefully sustainint the gopas, Krishna in his pleasure absorbed himself in other sports.985."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੁਣ) ਬਹੁਤ ਪ੍ਰਸੰਨ ਹੋ ਕੇ ਹੋਰ ਖੇਡ ਖੇਡਣ ਲਗੇ ॥੯੮੫॥"