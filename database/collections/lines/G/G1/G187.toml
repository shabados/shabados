[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੰਥਰਾ ਇਕ ਗਾਧ੍ਰਬੀ; ਬ੍ਰਹਮਾ ਪਠੀ ਤਿਹ ਕਾਲ ॥"
page = 219

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "At the same time Brahma sent a Gandharva woman named Manthra to the place,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਵੇਲੇ ਬ੍ਰਹਮਾ ਨੇ ਮੰਥਰਾ ਨਾਮ ਦੀ ਇਕ ਗੰਧਰਬਨੀ ਭੇਜ ਦਿੱਤੀ।"