[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਗਨ ਦਾਸ ਤਾ ਕੋ ਹੁਤੋ; ਸੋ ਤਿਨ ਲਿਯੋ ਬੁਲਾਇ ॥"
page = 833

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She had a servant, Magan Das whom she called,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਗਨ ਨਾਂ ਦਾ ਇਕ (ਵਿਅਕਤੀ) ਉਸ (ਰਾਜੇ) ਦਾ ਦਾਸ ਸੀ। ਉਸ ਨੂੰ ਉਸ ਨੇ ਬੁਲਾ ਲਿਆ।"