[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੇ ਦੋਖ; ਮੂੜ ਅੰਧ ਬਿਆਪੇ ॥"
page = 267
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such sins are clung to the blind foolish-man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹੋ ਜੇਹੇ ਪਾਪ ਅੰਨ੍ਹੇ ਮੂਰਖ ਨੂੰ ਚਿੰਮੜੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such sinful mistakes cling to the blind fools;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੂਰਬੋਕਤ ਦੋਖ ਮੂਰਖ ਅਗ੍ਯਾਨੀ ਕੋ ਲਗੇ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਮੂਰਖ ਅੰਨ੍ਹੇ ਜੀਵ (ਭਲਾਈ ਵਿਸਾਰਨ ਵਾਲੇ) ਇਹੋ ਜਿਹੇ ਔਗੁਣਾਂ ਵਿਚ ਫਸੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੋਖ = ਮੰਦੇ ਕਰਮ। ਮੂੜ = ਮੂਰਖ ਜੀਵ। ਬਿਆਪੇ = ਫਸੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y aun así, oh criatura de Maya, te olvidas de Aquél que te dio todo lo que tienes, y te apegas a otros."