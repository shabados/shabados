[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਧ ਅਸਾਧਿ, ਸਾਧਸੰਗਿ ਆਇਆ ॥੨॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "For curing his chronic maladies (of evil propensities) he goes to the holy congregation."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂ ਜੋ) ਸਾਧ ਸੰਗਤ ਵਿਖੇ ਆ ਕਰ ਕੇ ਅਸਾਧ (ਵਾਯੂ ਵਤ ਦੁਸ਼ਕਰ ਮਨ ਨੂੰ) ਵਸੀਕਾਰ ਵਿਚ ਕਰ ਲੀਤਾ ਹੈ।"