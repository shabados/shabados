[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਸਿ ਗਿਰਾਸਿ; ਜਪਉ ਹਰਿ ਹਰੀ ॥੪॥੨੯॥੪੨॥"
page = 1148
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and with every breath and morsel of mine, I now ponder over my Lord Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੇ ਸੁਆਮੀ ਮਾਲਕ ਨੂੰ ਸਿਮਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With every breath and morsel of food, I meditate on the Lord, Har, Har. ||4||29||42||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਾਂ ਤੇ ਸ੍ਵਾਸ ਸ੍ਵਾਸ ਮਨ ਬਾਣੀ ਕਰ ਹਰੀ ਕੋ ਜਪਤਾ ਹੂੰ॥੪॥੨੯॥੪੨॥☬ਨਿਜ ਮਨ ਪ੍ਰਤਿ ਉਪਦੇਸ਼:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਭੀ ਹਰੇਕ ਸਾਹ ਦੇ ਨਾਲ ਹਰੇਕ ਗਿਰਾਹੀ ਦੇ ਨਾਲ ਉਸ ਦਾ ਨਾਮ ਜਪ ਰਿਹਾ ਹਾਂ ॥੪॥੨੯॥੪੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਸਿ = ਹਰੇਕ ਸਾਹ ਦੇ ਨਾਲ। ਗਿਰਾਸਿ = ਹਰੇਕ ਗਿਰਾਹੀ ਦੇ ਨਾਲ। ਜਪਉ = ਜਪਉਂ, ਮੈਂ ਜਪਦਾ ਹਾਂ ॥੪॥੨੯॥੪੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ahora recito a cada momento y con cada respiración el Nombre de Dios. (4-29-42)"