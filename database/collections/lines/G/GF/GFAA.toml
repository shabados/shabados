data = "ਜਗ ਤੇ ਫਿਰਿ ਆਵਨ ਜਾਨ ਮਿਟੈ ॥੩੮੬॥"
page = 666

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "His dirt will be removed with the inner bath and his transmigration will end in the world.386."

[[content]]
