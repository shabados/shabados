[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਭੇਟਤ; ਲਾਗੈ ਪ੍ਰਭ ਰੰਗੁ ॥੧॥"
page = 393
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "meeting which the love for the Lord is embraced."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਮਿਲਣ ਦੁਆਰਾ ਸੁਆਮੀ ਨਾਲ ਪ੍ਰੇਮ ਪੈ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting with them, love for God is embraced. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸੰਗ ਮਿਲਨੇ ਸੇ ਪ੍ਰਭੂ ਮੇਂ ਪ੍ਰੇਮ ਲਾਗਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੂੰ ਮਿਲਿਆਂ ਪਰਮਾਤਮਾ ਦਾ ਪ੍ਰੇਮ (ਹਿਰਦੇ ਵਿਚ) ਪੈਦਾ ਹੋ ਜਾਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸੁ = ਜਿਸ (ਗੁਰਮੁਖਿ) ਨੂੰ। ਭੇਟਤ = ਮਿਲਿਆਂ। ਰੰਗੁ = ਪ੍ਰੇਮ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "los que la constituyen están imbuidos en el Señor. (1)"