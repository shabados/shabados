[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੰਤਰ ਚੀਤੇ; ਅਰੁ ਸਿੰਘਾਤਾ ॥"
page = 1160
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Similarly, the monkeys, leopards and lions,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਏਸੇ ਤਰ੍ਹਾਂ ਹੀ ਬਾਂਦਰ, ਚਿਤਰੇ ਅਤੇ ਸ਼ੇਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Monkeys, leopards and lions,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨ: ਬੰਦਰ ਅਰ (ਚੀਤੇ) ਚਿਤ੍ਰੇ ਅਰੁ (ਸਿੰਘਾਤਾ) ਸਿੰਘ ਵਾ ਸਰਭੇ ਭੀ ਮਾਯਾ ਮਹਿ ਰਾਤੇ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬਾਂਦਰ, ਚਿੱਤ੍ਰੇ, ਸ਼ੇਰ (ਸਭ ਮਾਇਆ ਵਿਚ ਉਲਝੇ ਪਏ ਹਨ।)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੰਤਰ = ਬਾਂਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los changos, los leopardos y los leones también;"