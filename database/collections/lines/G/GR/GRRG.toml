[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਹੁਤਾ ਨਗਰਿ ਦੁਆਰਕਾ; ਸਿੰਘ ਦੁਆਰਿ ਖਲੋਤਾ ਜਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He reached the town of Duaraka and stood before the main gate (of the palace of Krishna)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਦੁਆਰਕਾ ਨਗਰੀ ਪਹੁੰਚਾ ਤੇ ਰਾਜ ਦੁਆਰ ਤੇ ਜਾ ਖੜੋਤਾ।"