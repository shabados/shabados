[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮਤੀ; ਇਕਿ ਭਏ ਉਦਾਸਾ ॥"
page = 412
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Under Guru's instruction some become desireless."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਸਿਖਿਆ ਤਾਬੇ ਕਈ ਖਾਹਿਸ਼-ਰਹਿਤ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Guru's Teachings, some become free of desire."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰੁ ਏਕ ਗੁਰਮਤ ਵਾਲੇ ਗੁਰਮੁਖ ਜਨ ਉਦਾਸ ਹੋ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਕਈ (ਵਡ-ਭਾਗੀ ਮਨੁੱਖ) ਗੁਰੂ ਦੀ ਸਿੱਖਿਆ ਤੇ ਤੁਰ ਕੇ ਮੋਹ ਤੋਂ ਨਿਰਲੇਪ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el deseo y la ilusión, y es a través del Shabd de la Palabra del Guru que uno se vuelve desapegado."