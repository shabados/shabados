[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਸੰਖ ਭਗਤ; ਗੁਣ ਗਿਆਨ ਵੀਚਾਰ ॥"
page = 4
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Countless are the votaries who reflect over the Lord's excellences and theology."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਣਗਿਣਤ ਹਨ ਅਨਿੰਨ ਅਨੁਰਾਗੀ ਜੋ ਪ੍ਰਭੂ ਦੀਆਂ ਉਤਕ੍ਰਿਸਟਾਈਆਂ (ਵਡਿਆਈਆਂ) ਅਤੇ ਬੋਧ ਨੂੰ ਸੋਚਦੇ ਸਮਝਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Countless devotees contemplate the Wisdom and Virtues of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਗਿਣਤ ਹੀ ਭਗਤ, ਪ੍ਰਭੂ ਕੇ ਗੁਣੋਂ ਕੇ ਗਿਆਨ ਕਾ ਵੀਚਾਰ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅਕਾਲ ਪੁਰਖ ਦੀ ਕੁਦਰਤਿ ਵਿਚ) ਅਣਗਿਣਤ ਭਗਤ ਹਨ, ਜੋ ਅਕਾਲ ਪੁਰਖ ਦੇ ਗੁਣਾਂ ਅਤੇ ਗਿਆਨ ਦੀ ਵਿਚਾਰ ਕਰ ਰਹੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਣ ਵੀਚਾਰੁ = ਅਕਾਲ ਪੁਰਖ ਦੇ ਗੁਣਾਂ ਦਾ ਖ਼ਿਆਲ। ਗਿਆਨ ਵੀਚਾਰੁ = (ਅਕਾਲ ਪੁਰਖ ਦੇ) ਗਿਆਨ ਦਾ ਵਿਚਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Incontables lo siguen y contemplan las sabidurías y Virtudes del Señor."