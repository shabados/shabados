[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੇ ਨਾਮ ਕੋ ਆਧਾਰੁ ॥"
page = 1121
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have the support of the Lord's Name alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਕੇਵਲ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦਾ ਹੀ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I take only the Support of the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਮੇਰੇ ਕੋ ਆਪ ਕੇ ਨਾਮ ਕਾ ਹੀ ਆਸਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਸਦਾ) ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਆਸਰਾ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋ = ਦਾ। ਆਧਾਰੁ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me apoyo sólo en el Nombre del Señor."