data = "ਇਕ ਰਹਤ ਤਾਸੁ ਨਾਮੈ ਅਧਾਰ ॥"
page = 647

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many have come under the refuge of the Lord and their support is only the name of the Lord"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਉਸ ਦੇ ਨਾਮ ਦੇ ਆਧਾਰ ਉਤੇ ਰਹਿੰਦੇ ਹਨ।"