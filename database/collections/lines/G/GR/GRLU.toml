[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਹਿ; ਪਾਤਾਲ ਪੁਰੀਆ ਸਚੁ ਸੋਆ ॥"
page = 1079
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The under, worlds and the spheres meditate on that True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਤਾਲ ਅਤੇ ਗੋਲਾਕਾਰ ਉਸ ਸੱਚੇ ਸੁਆਮੀ ਦਾ ਆਰਾਧਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The nether worlds and spheres meditate in remembrance on that True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਚੇ! ਪਾਤਾਲ ਸਭ ਪੁਰੀਆਂ ਕੇ ਲੋਕ ਸੋ ਸਭ ਤੇਰੇ ਕੋ ਸਿਮਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਾਤਾਲ ਅਤੇ ਸਾਰੀਆਂ ਪੁਰੀਆਂ (ਦੇ ਵਾਸੀ) ਉਸ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਨੂੰ ਸਿਮਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੁ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ। ਸਚੁ ਸੋਆ = ਉਸ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "existen sólo para Ti, el Uno Verdadero, oh Dios."