[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੇ ਸਾਹਿਬ ਸਿਰਜਣਹਾਰੇ ॥"
page = 1032
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Lord is the Creator of the universe."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚਾ ਸੁਆਮੀ ਦੁਲ ਆਲਮ ਦਾ ਰਚਣਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Lord is the Creator of the Universe."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਚੇ ਸਾਹਿਬ ਉਤਪਤੀ ਕਰਨਹਾਰੇ ਕੋ ਜਾਣੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਮਾਲਕ! ਹੇ ਜਗਤ ਦੇ ਰਚਣਹਾਰ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚੇ = ਹੇ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ! ਸਿਰਜਣਹਾਰੇ = ਹੇ ਸਿਰਜਣਹਾਰ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Maestro Verdadero es el Creador del Universo entero."