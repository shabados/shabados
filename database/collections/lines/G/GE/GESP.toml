[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਾਗੁ ਗਲੇ; ਸੁਨੁ ਬਿਨਤੀ ਮੇਰੀ ॥੧॥"
page = 484
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Take me to thy bosom and hear my entreaty."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਆਪਣੀ ਛਾਤੀ ਨਾਲ ਲਾ ਅਤੇ ਮੇਰੀ ਪ੍ਰਾਰਥਨਾ ਸ੍ਰਵਣ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Hug me close, and listen to my prayer. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਮੇਰੀ ਬੇਨਤੀ ਸੁਨ ਕਰ ਮੇਰੇ ਗਲੇ ਲਗੋ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਸੱਜਣ ਪ੍ਰਭੂ!) ਮੇਰੀ ਅਰਜੋਈ ਸੁਣ, ਤੇ ਮੇਰੇ ਗਲ ਲੱਗ (ਭਾਵ, ਤੇਰੀ ਯਾਦ ਮੇਰੇ ਗਲ ਦਾ ਹਾਰ ਬਣੀ ਰਹੇ) ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "llévame en Tu Pecho, oh Señor, y escucha mi plegaria. (1)"