[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਕੋ ਮੇਰਾ; ਹਉ ਕਿਸੁ ਕੇਰਾ ॥"
page = 109
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "None is mine, nor am I of any one."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਕੋਈ ਨਹੀਂ, ਨਾਂ ਹੀ ਮੈਂ ਕਿਸੇ ਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one is mine, and I am no one else's."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾ ਕੋਈ ਮੇਰਾ ਹੈ ਨਾ ਮੈਂ ਕਿਸੀ ਕਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਦੁਨੀਆ ਵਿਚ) ਕੋਈ ਭੀ ਮੇਰਾ ਸਦਾ ਦਾ ਸਾਥੀ ਨਹੀਂ ਹੈ, ਮੈਂ ਭੀ ਕਿਸੇ ਦਾ ਸਦਾ ਲਈ ਸਾਥੀ ਨਹੀਂ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਸੁ ਕੇਰਾ = ਕਿਸ ਦਾ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No pertenezco a nadie, ni nadie me pertenece a mí;"