[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਸਾਜੇ; ਅਵਰੁ. ਨ ਕੋਈ ॥"
page = 1060
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself creates. There is not an other."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪ ਹੀ ਰਚਦਾ ਹੈ। ਹੋਰ ਕੋਈ ਹੈ ਹੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself creates - there is no other at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪ ਹੀ ਬਣਾਵਤਾ ਹੈਂ ਹੋਰ ਕੋਈ ਬਣਾਵਣੇ ਵਾਲਾ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪ ਹੀ (ਸ੍ਰਿਸ਼ਟੀ) ਪੈਦਾ ਕਰਦਾ ਹੈ, (ਉਸ ਤੋਂ ਬਿਨਾ ਪੈਦਾ ਕਰਨ ਵਾਲਾ) ਕੋਈ ਹੋਰ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਜੇ = ਪੈਦਾ ਕਰਦਾ ਹੈ। ਅਵਰੁ = ਹੋਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Tú, nuestro Dios Dador de Éxtasis,"