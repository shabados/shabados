[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਪ੍ਰਭੁ; ਜਤ ਕਤ ਪੇਖਿਓ ਨੈਣੀ ॥"
page = 530
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That Lord I have seen with my eyes everywhere."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਹਿਬ ਮੈਂ ਆਪਣੀਆਂ ਅੱਖਾਂ ਨਾਲ ਹਰ ਥਾਂ ਵੇਖਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have seen that God with my eyes everywhere."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ ਨੇ ਸੋ ਪ੍ਰਭੂ ਜਹਾਂ ਕਹਾਂ, ਭਾਵ ਸਭ ਜਗਾ ਅਪਨੇ ਨੇਤ੍ਰੋਂ ਸੇ ਦੇਖਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪ੍ਰਭੂ ਨੂੰ ਮੈਂ (ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ) ਹਰ ਥਾਂ ਆਪਣੀ ਅੱਖੀਂ ਵੇਖ ਲਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਤ ਕਤ = ਜਿਥੇ ਕਿਥੇ, ਹਰ ਥਾਂ। ਪੇਖਿਓ = ਮੈਂ ਵੇਖ ਲਿਆ ਹੈ। ਨੈਣੀ = ਆਪਣੀਆਂ ਅੱਖਾਂ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Al Señor Lo he visto con mis ojos por todas partes;"