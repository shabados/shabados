[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹਰਣਿ ਏਣਰਾਜ ਪਹਿਚਾਨਾ ॥੧੪੪॥"
page = 624

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The earth considered him as a mountain and the does as the king of deer.144."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਹਿਰਨੀਆਂ ਨੇ (ਉਸ ਨੂੰ) ਕਸਤੂਰੀ ਵਾਲਾ ਹਿਰਨ ('ਏਣਰਾਜ') ਦੇ ਰੂਪ ਵਿਚ ਪਛਾਣਿਆ ॥੧੪੪॥"