[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਂ ਤੂੰ ਦੇਹਿ; ਜਪੀ ਨਾਉ ਤੇਰਾ ॥੧॥ ਰਹਾਉ ॥"
page = 357
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If thou givest it to me, I will repeat thy Name. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਤੂੰ ਇਸ ਨੂੰ ਮੈਨੂੰ ਦੇਵੇ, ਤਾਂ ਮੈਂ ਤੇਰੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਾਂਗਾ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If You give it to me, I will chant Your Name. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੂੰ ਅਪਨਾ ਨਾਮ ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਦੇਹਿ ਤੌ ਮੈਂ ਜਪੂੰ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਆਤਮਕ ਜੀਵਨ ਦੀ ਖ਼ਾਤਰ) ਜਦੋਂ ਤੂੰ ਮੈਨੂੰ ਆਪਣਾ ਨਾਮ ਦੇਂਦਾ ਹੈਂ, ਤਦੋਂ ਹੀ ਮੈਂ ਜਪ ਸਕਦਾ ਹਾਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਪੀ = ਮੈਂ ਜਪਦਾ ਹਾਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y cuando me bendices, entonces habito en Tu Nombre. (1‑Pausa)"