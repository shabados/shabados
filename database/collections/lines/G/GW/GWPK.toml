[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸ੍ਵਾਨਨ ਤੇ ਬਹੁਤ ਮ੍ਰਿਗਨ ਗਹਾਵੈ ॥"
page = 961

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the Raja would go for hunting, he would get many deer killed through his dogs."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਕੁਤਿਆਂ ਤੋਂ ਬਹੁਤ ਹਿਰਨ ਪਕੜਵਾਉਂਦਾ ਸੀ।"