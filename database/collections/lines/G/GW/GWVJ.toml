[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਰਖ਼ਤਾ ਸ਼ੁਦਹ ਖ਼ੁਸ਼ਕ ਵ ਦਰਯਾਇ ਆਬ ॥੧੩੯॥"
page = 1423

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And the trees were getting thirsty and river-water was drying.(139)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦਰਖ਼ਤਾਂ ਦੇ ਪੱਤਰ ਅਤੇ ਦਰਿਆਵਾਂ ਦਾ ਪਾਣੀ ਸੁਕ ਗਿਆ ॥੧੩੯॥"