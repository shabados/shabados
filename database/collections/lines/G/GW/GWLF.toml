[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਮ ਮਰਣ ਤਿਹ; ਮੂਲੇ ਨਾਹੀ ॥੩॥"
page = 203
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From birth and Death they are absolutely immune."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੰਮਣ ਤੇ ਮਰਣ ਤੋਂ ਉਹ ਅਸਲੋਂ ਹੀ ਮੁਕਤ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They are not subject to the cycle of birth and death. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਸਤਸੰਗੀਆਂ ਕੋ ਜਨਮ ਮਰਣ ਕਦਾਚਿਤ ਨਹੀਂ ਹੋਤਾ, ਤਾਂ ਤੇ ਤਿਨ ਕੇ ਸਾਥ ਮਿਲ ਕਰ ਐਸੇ ਬੇਨਤੀ ਕਰੇਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਸੰਤ ਜਨਾਂ ਨੂੰ ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਕਦੇ ਭੀ ਨਹੀਂ ਵਿਆਪਦੇ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਹ = ਉਹਨਾਂ ਨੂੰ। ਮੂਲੇ = ਬਿਲਕੁਲ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y después de ello, no volverá a nacer ni a morir. (3)"