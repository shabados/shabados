[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਨ ਕਰਾਵਨਹਾਰ ਸੁਆਮੀ ॥"
page = 1148
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is the Doer and the cause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕਰਨ ਵਾਲਾ ਅਤੇ ਕਰਾਉਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Our Lord and Master is the Creator, the Cause of causes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪੁਰਸ ਐਸੇ ਬੇਨਤੀ ਕਰਤਾ ਹੈ: ਹੇ ਕਰਨ ਕਰਾਵਨਹਾਰ! ਹੇ ਸ੍ਵਾਮੀ! ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਭ ਕੁਝ ਕਰਨ ਜੋਗ ਸੁਆਮੀ! ਹੇ ਜੀਵਾਂ ਪਾਸੋਂ ਸਭ ਕੁਝ ਕਰਾਵਣ ਦੇ ਸਮਰਥ ਸੁਆਮੀ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਆਮੀ = ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nuestro Maestro es el Hacedor y la Causa,"