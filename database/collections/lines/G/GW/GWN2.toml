[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਕਰਤਾ ਸਚਿਆਰੁ; ਮੈਡਾ ਸਾਂਈ ॥"
page = 11
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O God! Thou art the true creator, my Master,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਿਗੁਰੂ! ਤੂੰ ਸੱਚਾ ਸਿਰਜਣਹਾਰ, ਮੇਰਾ ਮਾਲਕ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the True Creator, my Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਰਤਾ ਪੁਰਖੁ! ਜੋ ਤੂੰ  ਹੀ (ਸਚਿਆਰੁ) ਸੱਚਾ ਮੇਰਾ ਸ੍ਵਾਮੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਤੂੰ ਸਭ ਦਾ ਪੈਦਾ ਕਰਨ ਵਾਲਾ ਹੈਂ, ਤੂੰ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਹੈਂ, ਤੂੰ ਹੀ ਮੇਰਾ ਖਸਮ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚਿਆਰੁ = {ਸਚ-ਆਲਯ} ਥਿਰਤਾ ਦਾ ਘਰ, ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ। ਮੈਡਾ = ਮੇਰਾ। ਸਾਂਈ = ਖਸਮ, ਮਾਲਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, eres el Verdadero Creador, mi Maestro."