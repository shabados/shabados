[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਪੰਥੁ ਨਿਹਾਲੇ ਸਾ ਧਨ. ਤੂ ਸੁਣਿ ਆਤਮ ਰਾਮਾ ॥੧॥"
page = 1107
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Nanak, Thy bride is beholding Thy way. Hear Thou, O Omni-present spirit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਤੇਰੀ ਪਤਨੀ ਤੇਰਾ ਰਾਹ ਦੇਖਦੀ ਹੈ। ਤੂੰ ਸ੍ਰਵਣ ਕਰ, ਹੇ ਸਰਬ ਵਿਆਪਕ ਰੂਹੇ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the soul-bride is gazing upon Your Path; please listen, O Supreme Soul. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ (ਆਤਮ) ਸਭ ਕਾ ਆਪਣਾ ਆਪ ਰੂਪ ਪ੍ਰਭੂ! ਮੈਂ (ਸਾ ਧਨ) ਇਸਤ੍ਰੀ ਆਪ ਕਾ (ਪੰਥੁ) ਰਸਤਾ (ਨਿਹਾਲੇ) ਦੇਖਤੀ ਹੂੰ। ਹੇ (ਰਾਮ) ਬ੍ਯਾਪਕ ਰੂਪ! ਤੂੰ ਮੇਰੀ ਬੇਨਤੀ ਸੁਣ, ਭਾਵ ਮੇਰੇ ਕੋ ਪ੍ਰਾਪਤਿ ਹੋਈਏ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਹੇ ਸਰਬ ਵਿਆਪਕ ਪਰਮਾਤਮਾ! ਤੂੰ (ਜੀਵ-ਇਸਤ੍ਰੀ ਦੀ ਅਰਜ਼ੋਈ) ਸੁਣ (ਤੇ ਉਸ ਨੂੰ ਆਪਣਾ ਦਰਸਨ ਦੇਹ), ਜੀਵ-ਇਸਤ੍ਰੀ ਤੇਰਾ ਰਾਹ ਤੱਕ ਰਹੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੰਥੁ = ਰਸਤਾ। ਨਿਹਾਲੇ = ਤੱਕ ਰਹੀ ਹੈ। ਸਾਧਨ = ਜੀਵ-ਇਸਤ੍ਰੀ। ਆਤਮ ਰਾਮਾ = ਹੇ ਸਰਬ-ਵਿਆਪਕ ਪਰਮਾਤਮਾ! ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, La esposa mira hacia afuera para ver si Llegas a ella, escucha, oh Dios Todo Prevaleciente. (1)"