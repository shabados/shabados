[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦਾ ਸਦਾ ਜਾਈਂ︀ ਬਲਿਹਾਰ ॥"
page = 868
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever and ever I am a sacrifice unto Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਮੇਸ਼ਾ, ਹਮੇਸ਼ਾਂ ਹੀ ਮੈਂ ਉਸ ਉਤੋਂ ਘੋਲੀ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forever and ever, I am a sacrifice to Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਉਪਰੋਂ ਨਿਤਯੰਪ੍ਰਤੀ ਬਲਿਹਾਰ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਦਾ ਉਸੇ ਉਤੋਂ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਈ = ਮੈਂ ਜਾਂਦਾ ਹਾਂ। ਬਲਿਹਾਰ = ਕੁਰਬਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, ofrezco mi ser como sacrificio a mi Señor."