[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚੋਆ ਚੰਦਨੁ ਲਾਈਐ; ਕਾਪੜੁ ਰੂਪੁ ਸੀਗਾਰੁ ॥"
page = 63
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He applies essence of aloe wood and sandal and bedecks himself with beautiful clothes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਊਦ ਦੀ ਲੱਕੜੀ ਤੇ ਚੰਨਣ ਦਾ ਅਤਰ ਮਲਦਾ ਹੈ, ਅਤੇ ਸੁੰਦਰ ਕਪੜਿਆਂ ਨਾਲ ਆਪਣੇ ਆਪ ਨੂੰ ਸ਼ਿੰਗਾਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He applies sandalwood and scented oils, and dresses himself in his beautiful clothes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ (ਚੋਆ) ਚੰਦਨ ਕਾ ਅਤ੍ਰ ਲਗਾਈਐ, ਔਰ ਕਪੜਿਓਂ ਕਾ ਸਿੰਗਾਰ ਕਰ ਕੇ ਰੂਪਵਾਨ ਹੋਈਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਸਰੀਰ ਨੂੰ) ਅਤਰ ਤੇ ਚੰਦਨ ਲਾਈਦਾ ਹੈ। ਸੋਹਣਾ ਕੱਪੜਾ, ਰੂਪ, ਗਹਿਣਾ ਆਦਿਕ (ਵੇਖ ਕੇ ਮਨ ਖ਼ੁਸ਼ ਹੁੰਦਾ ਹੈ);"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੋਆ = ਅਤਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nos ponemos esencia de rosas, de sándalo y nos adornamos con ropas bellas."