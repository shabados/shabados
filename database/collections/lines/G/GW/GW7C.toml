[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਨੰਤਾਸਤ੍ਰ ਛੂਟੇ ॥"
page = 110

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many of the tyrants have been killed and consequently countless weapons are lying scattered hither and thither."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਅਨੇਕਾਂ ਅਸਤ੍ਰ ਚਲ ਰਹੇ ਸਨ।"