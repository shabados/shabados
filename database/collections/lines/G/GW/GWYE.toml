[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਰਮੇਸਰੁ; ਆਪਿ ਹੋਆ ਰਖਵਾਲਾ ॥"
page = 622
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Supreme Lord Himself has become Protector."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼੍ਰੋਮਣੀ ਸਾਹਿਬ ਖੁਦ ਮੇਰਾ ਰੱਖਣ ਵਾਲਾ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Transcendent Lord Himself has become my Protector."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸਰ ਹਮਾਰਾ ਆਪ ਰਾਖਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਮਨੁੱਖ ਦਾ ਰਾਖਾ ਪਰਮਾਤਮਾ ਆਪ ਬਣ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਖਵਾਲਾ = ਰਾਖਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Mismo me protegió, la Paz llegó al fondo de mi corazón"