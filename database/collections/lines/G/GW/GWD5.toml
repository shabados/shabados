[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭੁ ਮੇਰਾ; ਹੈ ਸਦਾ ਦਇਆਰੁ ॥"
page = 898
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "my Lord is ever merciful."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਮਾਲਕ ਸਦੀਵ ਹੀ ਮਇਆਵਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "my God is forever merciful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਮੇਰਾ ਸ੍ਵਾਮੀ ਹੈਂ ਔ ਸਦਾ ਦੀਨੋਂ ਪੈ ਦਿਆਲ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਪ੍ਰਭੂ ਸਦਾ ਦਇਆ ਦਾ ਘਰ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਇਆਰੁ = ਦਇਆਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así de Compasivo y Bondadoso es nuestro Dios"