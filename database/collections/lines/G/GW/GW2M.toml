[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇ ਬੈਰਾਗੀ; ਸਤ ਸਮਾਨਿ ॥"
page = 953
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such a desireless person, is like the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਹੋ ਜੇਹਾ ਇੱਛਾ ਰਹਿਤ ਪੁਰਸ਼ ਸੱਚੇ ਸੁਆਮੀ ਦੇ ਤੁੱਲ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such a Bairaagi is just like the True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਬੈਰਾਗੀ ਔ (ਸਤ) ਪ੍ਰਮੇਸਰ ਸਮਾਨ ਹੈ, ਭਾਵ ਏਕ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਜੇਹੇ ਬੈਰਾਗੀ ਪ੍ਰਭੂ ਦਾ ਰੂਪ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਪ੍ਰਭੂ। ਸਮਾਨਿ = ਵਰਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, ese beragui es como el Verdadero Señor."