[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਧੁ ਆਪੇ ਖੇਲੁ ਰਚਾਇ; ਤੁਧੁ ਆਪਿ ਸਵਾਰਿਆ ॥"
page = 642
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou Thyself hast arranged the play and Thou Thyself has attuned it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਖੁਦ ਹੀ ਤਮਾਸ਼ਾ ਬਣਾਇਆ ਹੈ ਅਤੇ ਤੂੰ ਖੁਦ ਹੀ ਇਸ ਨੂੰ ਸੁਰ ਤਾਲ ਵਿੱਚ ਬੰਨ੍ਹਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You Yourself have arranged the play, and You Yourself arrange it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੁਮ ਨੇ ਆਪ ਹੀ ਜਗਤ ਖੇਲ ਕੋ ਰਚਾਇ ਕਰ, ਬਹੁੜੋ ਆਪ ਹੀ ਤਿਨ ਕੋ ਸਵਾਰਨਾ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸੰਸਾਰ-ਰੂਪ) ਖੇਡ ਬਣਾ ਕੇ ਤੂੰ ਆਪ ਹੀ ਇਸ ਨੂੰ ਸੋਹਣਾ ਬਣਾਇਆ ਹੈ; ਸੰਸਾਰ ਰਚਣ ਵਾਲਾ ਤੂੰ ਆਪ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres mi Señor Benévolo; gozas en Tu Ser de Tus Bienaventuranzas."