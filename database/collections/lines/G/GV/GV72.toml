[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਗੁਰ; ਬਿਸੀਅਰੁ ਡਸੈ, ਮਰਿ ਵਾਟ ॥"
page = 942
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Guru, one is stung by the poisonous snake of mammon and he dies in the way."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਬਾਝੋਂ, ਮਾਇਆ ਦਾ ਜ਼ਹਿਰੀਲਾ ਸੰਪ ਬੰਦੇ ਨੂੰ ਡੰਗ ਮਾਰਦਾ ਹੈ ਤੇ ਉਹ ਰਾਹ ਵਿੱਚ ਹੀ ਮਰ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Guru, one is stung by the poisonous snake of Maya, and dies."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਸੇ ਬਿਨਾਂ ਕਾਲ ਰੂਪ (ਬਿਸੀਅਰੁ) ਸਰਪੁ ਡਸਤਾ ਹੈ ਔ (ਮਰਿ) ਜਮ ਕੇ ਬਾਟ ਮੇਂ ਵਾ ਅਧ ਵਿਚਾਲੇ ਮਰ ਜਾਤਾ ਹੈ, ਭਾਵ ਕੋਈ ਕਾਮਨਾ ਪੂਰਨ ਨਹੀਂ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ (ਦੇ ਰਾਹ ਤੇ ਤੁਰਨ) ਤੋਂ ਬਿਨਾ (ਜਗਤ ਦਾ ਮੋਹ-ਰੂਪ) ਸੱਪ ਡੰਗ ਮਾਰਦਾ ਰਹਿੰਦਾ ਹੈ, (ਜ਼ਿੰਦਗੀ ਦੇ ਸਫ਼ਰ ਦੇ) ਅੱਧ ਵਿਚ ਹੀ (ਆਤਮਕ ਮੌਤੇ) ਮਰੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਸੀਅਰੁ = ਸੱਪ (ਜਗਤ ਦਾ ਮੋਹ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "de Maya y muere en el camino."