[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਵਰੁ. ਨ ਕਹੀਐ; ਦੂਜਾ ਕੋਈ ॥"
page = 1079
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is not another, who can be said to be so pervading."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਹੋਰ ਦੂਸਰਾ ਇਸ ਤਰ੍ਹਾਂ ਵਿਆਪਕ ਆਖਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no other said to be so."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਕੋਈ ਦੂਜਾ ਤੇਰੇ ਸਮ ਸਾਮ੍ਰਥ ਨਹੀਂ ਕਹੀਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਤੋਂ ਬਿਨਾ ਕੋਈ ਦੂਜਾ ਦੱਸਿਆ ਹੀ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹੀਐ = ਦੱਸਿਆ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no, no hay nadie más que nuestro Único Dios. El Colirio de la Sabiduría del Guru,"