type = "primary"
data = "ਮਾਰੂ ਕਾਫੀ ਮਹਲਾ ੧ ਘਰੁ ੨ ॥"
page = 1014
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Maru kafi 1st Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਰੂ ਕਾਫ਼ੀ ਪਹਿਲੀ ਪਾਤਿਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Maaroo, Kaafee, First Mehl, Second House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਕਾਲ ਪੁਰਖ ਇੱਕ ਹੈ ਅਤੇ ਸਤਿਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Maru, Mejl Guru Nanak, Primer Canal Divino."