[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਜਾਨੈ; ਸਾਧ ਬਡਾਈ ॥"
page = 271
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself knows the greatness of the man of faith."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਹੀ ਧਰਮਾਤਮਾ ਪੁਰਸ਼ ਦੀ ਵਿਸ਼ਾਲਤਾ ਨੂੰ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself knows the greatness of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਆਪ ਹੀ ਸੰਤ ਜਨੋਂ ਕੀ ਵਡਿਆਈ ਕੌ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਦੀ ਵਡਿਆਈ ਪ੍ਰਭੂ ਆਪ ਹੀ ਜਾਣਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧ ਬਡਾਈ = ਸਾਧ ਦੀ ਵਡਿਆਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal es la Grandeza de Sus Santos que sólo el Señor conoce."