[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੇ ਲੋਗਨ ਸਿਉ; ਕਿਆ ਕਹੀਐ ॥"
page = 332
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What should one say to such people?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹੋ ਜਿਹੇ ਲੋਕਾਂ ਨੂੰ ਬੰਦਾ ਕੀ ਆਖੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What can anyone say to such people?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਲੋਕੋਂ ਸੇ ਕਿਆ ਕਹੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਜਿਹੇ ਬੰਦਿਆਂ ਨੂੰ ਭਲੀ ਮੱਤ ਦੇਣ ਦਾ ਕੋਈ ਲਾਭ ਨਹੀਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਉ = ਨਾਲ, ਨੂੰ। ਕਿਆ ਕਹੀਐ = ਕੀਹ ਆਖੀਏ? ਮੱਤ ਦੇਣ ਦਾ ਕੋਈ ਲਾਭ ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿qué puede uno decir de ellos?"