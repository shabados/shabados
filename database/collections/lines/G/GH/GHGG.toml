[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਜਾਗਿ ਰਹੇ; ਅਉਧੂਤਾ ॥"
page = 904
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's grace, I remain wakeful, immaculate,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ, ਮੈਂ ਖਬਰਦਾਰ, ਪਵਿੱਤਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As Gurmukh, I remain awake and aware, unattached."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਦੁਆਰੇ ਅਪਨੇ ਸਰੂਪ ਮੇਂ ਸੁਧ ਹੋਇਕੈ ਜਾਗ ਰਹੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਸਲ ਤਿਆਗੀ ਉਹੀ ਹੈ ਜੋ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ (ਸਿਮਰਨ ਦੀ ਰਾਹੀਂ ਮਾਇਆ ਦੇ ਹੱਲਿਆਂ ਵਲੋਂ) ਸੁਚੇਤ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਉਧੂਤਾ = ਤਿਆਗੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Gurmukj, el ser desapegado,"