[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੂਰਾਂ ਸ੍ਰਣਤ ਬੀਜ ਨੂੰ, ਘਤਿ ਘੇਰਿ ਖਲੋਈਆਂ ॥"
page = 126

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The heavenly damsels (houris), surrounding Sranwat Beej, are standing"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇੰਜ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ ਕਿ) ਹੂਰਾਂ ਰਕਤ-ਬੀਜ ਨੂੰ ਘੇਰ ਕੇ ਖਲੋ ਗਈਆਂ ਹਨ,"