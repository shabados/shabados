[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਤ ਗਰਭ ਮਹਿ; ਤੁਮ ਹੀ ਪਾਲਾ ॥"
page = 132
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In mother's womb Thou cherisheth the child."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਂ ਦੇ ਪੇਟ ਅੰਦਰ ਤੂੰ ਹੀ ਬੱਚੇ ਨੂੰ ਪਾਲਦਾ-ਪੋਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the womb of the mother, You cherish and nurture the baby."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਤਾ ਕੇ ਗਰਭ ਮੇਂ ਭੀ ਤੂੰ ਹੀ ਪਾਲਨਾ ਕਰਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਂ ਦੇ ਪੇਟ ਵਿਚ ਤੂੰ ਹੀ (ਜੀਵਾਂ ਦੀ) ਪਾਲਣਾ ਕਰਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਰਭ ਮਹਿ = ਪੇਟ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "eres también Quien me alimentó en el vientre de mi madre,"