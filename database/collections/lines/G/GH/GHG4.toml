[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਰਗਹ ਮਿਲੈ, ਤਿਸੈ ਹੀ ਜਾਇ ॥"
page = 677
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he alone obtains a place in His court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਸੇ ਨੂੰ ਹੀ ਉਸ ਦੇ ਦਰਬਾਰ ਵਿੱਚ ਥਾਂ ਮਿਲਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "obtains a place in the Court of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਦਰਗਹ) ਪ੍ਰਲੋਕ ਮੇਂ ਤਿਸੀ ਕੌ ਅਸਥਾਨ ਮਿਲਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸੇ ਨੂੰ ਹੀ ਪਰਮਾਤਮਾ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਥਾਂ ਮਿਲਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਇ = ਥਾਂ। ਜਿ = ਜੇਹੜੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "encuentra un lugar en la Corte del Señor."