[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਤਨ ਪਦਾਰਥ; ਘਟ ਹੀ ਮਾਹੀ ॥"
page = 152
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that invaluable jewel is in thy mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਅਮੋਲਕ ਜਵੇਹਰ ਤੇਰੇ ਮਨਾਂ ਵਿੱਚ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but this priceless jewel is within your own heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਰਤਨ ਰੂਪੁ ਪਦਾਰਥੁ ਚੈਤਨ ਦੇਵ (ਘਟ) ਸਰੀਰ ਮੇਂ ਹੀ ਹੈ॥☬ਜੇ ਕਹੇ ਸਾਸਤ੍ਰੀ ਪੰਡਤਿ ਕਿਉਂ ਨਹੀਂ ਜਾਣਤੇ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਕੀਮਤੀ ਰਤਨ (ਮਨੁੱਖ ਦੇ) ਹਿਰਦੇ ਵਿਚ ਹੀ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਟ ਹੀ ਮਾਹੀ = ਹਿਰਦੇ ਵਿਚ ਹੀ। ਪੜਿ = ਪੜ੍ਹ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "esa Joya, oh hombre, la vas a encontrar en tu propia mente."