data = "ਕਿ ਗਜ ਸਿੰਘ ਅਜ਼ ਅਸਪ ਆਮਦ ਬ ਗਰਦ ॥੪੬॥"
page = 1401

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And Gaj Singh fell down from his horse.(46)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨਾਲ ਗਜ ਸਿੰਘ ਘੋੜੇ ਤੋਂ ਧਰਤੀ ਉਤੇ ਆਣ ਡਿਗਿਆ ॥੪੬॥"