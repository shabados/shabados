[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚਾ ਖੇਲੁ ਤੁਮੑਾਰਾ ॥"
page = 764
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "true is Thine play."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੀ ਹੈ ਤੇਰੀ ਖੇਡ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your play is true."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਤੇ ਤੁਮਾਰਾ ਖੇਲ ਸਾਚਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੰਸਾਰ ਤੇਰੀ ਸਚ-ਮੁਚ ਦੀ ਰਚੀ ਹੋਈ ਖੇਡ ਹੈ (ਭਾਵ, ਹੈ ਤਾਂ ਇਹ ਸੰਸਾਰ ਇਕ ਖੇਡ ਹੀ, ਹੈ ਤਾਂ ਨਾਸਵੰਤ, ਪਰ ਮਨ ਦਾ ਭਰਮ ਨਹੀਂ, ਸਚ-ਮੁਚ ਮੌਜੂਦ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚਾ = ਸਚ-ਮੁਚ ਦੀ ਹੋਂਦ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Infinito, Señor Insondable,"