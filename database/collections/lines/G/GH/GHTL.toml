[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰਾ ਪ੍ਰਭੁ ਪਰਉਪਕਾਰੀ ॥"
page = 627
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Beneficent is my Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਦਾਰਚਿਤ ਹੈ ਮੈਂਡਾ ਸੁਆਮੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My God is so benevolent."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸ੍ਵਾਮੀ! ਤੂੰ ਪਰਉਪਕਾਰੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੇਰਾ ਪ੍ਰਭੂ ਸਭ ਦੀ ਭਲਾਈ ਕਰਨ ਵਾਲਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਉਪਕਾਰੀ = ਦੂਜਿਆਂ ਦੀ ਭਲਾਈ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Señor es Bueno;"