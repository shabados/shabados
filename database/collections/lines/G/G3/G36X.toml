[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਵਤ ਦੇਖਿ ਸਮੁਹੇ ਰਣਿ ਭੂਪੰ ॥"
page = 169

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing the Emperor coming towards him, Narsingh also got infuriated."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ (ਉਸ ਨੇ) ਯੁੱਧ-ਭੂਮੀ ਵਿਚ ਦੈਂਤ ਰਾਜੇ ਨੂੰ ਆਉਂਦਿਆਂ ਵੇਖਿਆ।"