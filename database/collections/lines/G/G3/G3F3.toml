type = "primary"
data = "ਬ ਪਯ ਮੁਰਦ ਸ਼ੁਦ ਹਮ ਚੁ ਜ਼ਖ਼ਮੇ ਯਲਾ ॥੨੧॥"
page = 1425

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And they seemed like the injured soldiers,(21)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਮੁਰਦੇ ਪਏ ਹੋਣ ਜਾਂ ਜ਼ਖ਼ਮੀ ਸੂਰਮੇ ਲੰਬੇ ਪਏ ਹੋਣ ॥੨੧॥"