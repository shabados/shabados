[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਬਾਮੑਨੁ. ਮੈ ਕਾਸੀਕ ਜੁਲਹਾ; ਬੂਝਹੁ ਮੋਰ ਗਿਆਨਾ ॥"
page = 482
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art a Brahman and I am a weaver of Banaras. Fathom thou my Divine comprehension."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਬ੍ਰਹਮਣ ਹੈਂ ਅਤੇ ਮੈਂ ਬਨਾਰਸ ਦਾ ਜੁਲਾਹਾ। ਤੂੰ ਮੇਰੀ ਈਸ਼ਵਰੀ ਗਿਆਤ ਦਾ ਅੰਦਾਜ਼ਾ ਲਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are a Brahmin, and I am a weaver of Benares; can You understand my wisdom?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੁਮ ਤੋ ਬ੍ਰਹਮਣ ਹੋ ਅਰੁ ਮੈਂ ਕਾਸੀ ਕੇ ਰਹਨੇ ਹਾਰਾ ਜੁਲਾਹਾ ਹੂੰ, ਪਰੰਤੂ ਹਮਾਰੇ ਕਰ ਕਹੇ ਹੂਏ ਗਿਆਨ ਕੋ ਸਮਝੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਠੀਕ ਹੈ ਕਿ) ਤੂੰ ਕਾਂਸ਼ੀ ਦਾ ਬ੍ਰਾਹਮਣ ਹੈਂ (ਭਾਵ, ਤੈਨੂੰ ਮਾਣ ਹੈ ਆਪਣੀ ਵਿੱਦਿਆ ਦਾ, ਜੋ ਤੂੰ ਕਾਂਸ਼ੀ ਵਿਚ ਹਾਸਲ ਕੀਤੀ), ਤੇ ਮੈਂ (ਜਾਤ ਦਾ) ਜੁਲਾਹ ਹਾਂ (ਜਿਸ ਨੂੰ ਤੁਹਾਡੀ ਵਿੱਦਿਆ ਪੜ੍ਹਨ ਦਾ ਹੱਕ ਨਹੀਂ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਸੀਕ = ਕਾਂਸ਼ੀ ਦਾ। ਜੁਲਹਾ = ਜੁਲਾਹ। ਮੋਰ = ਮੇਰੀ। ਗਿਆਨਾ = ਵਿਚਾਰ ਦੀ ਗੱਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres un Brahmán y yo sólo un tejedor del pueblo, pero, ¿tienes tú la capacidad de adivinar mi sabiduría?"