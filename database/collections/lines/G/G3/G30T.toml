[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਊਪਰਿ ਬਨੈ ਅਕਾਸੁ; ਤਲੈ ਧਰ ਸੋਹਤੀ ॥"
page = 1362
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The sky above looks graceful and the earth below appears beauteous."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਤੇ ਅਸਮਾਨ ਸੋਹਣਾ ਦਿਸਦਾ ਹੈ ਅਤੇ ਹੇਠਾ ਧਰਤੀ ਸੁੰਦਰ ਜਾਪਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The sky above looks lovely, and the earth below is beautiful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਊਪਰ ਤੇ ਅਕਾਸ ਕਾ ਚੰਦੋਆ ਬਨ ਕਰ ਸੋਭ ਰਹਾ ਹੈ ਔ ਨੀਚੇ ਧਰਤੀ ਫਰਸ ਰੂਪ ਹੋ ਕਰ ਸੋਭਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਹੇਲੀਏ! ਉਤਾਂਹ (ਤਾਰਿਆਂ ਆਦਿਕ ਨਾਲ) ਆਕਾਸ਼ ਫਬ ਰਿਹਾ ਹੈ, ਹੇਠ ਪੈਰਾਂ ਵਾਲੇ ਪਾਸੇ (ਹਰਿਆਵਲ ਆਦਿਕ ਨਾਲ) ਧਰਤੀ ਸਜ ਰਹੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਊਪਰਿ = ਉਤਾਂਹ। ਬਨੈ = ਫਬ ਰਿਹਾ ਹੈ। ਤਲੈ = ਹੇਠ, ਪੈਰਾਂ ਵਾਲੇ ਪਾਸੇ। ਧਰ = ਧਰਤੀ। ਸੋਹਤੀ = (ਹਰਿਆਵਲ ਆਦਿਕ ਨਾਲ) ਸਜੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Arriba el cielo se ve precioso y la tierra también,"