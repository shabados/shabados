[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੂਤ ਉਚਰਿ ਅੰਤ ਅਰਿ ਉਚਰਿ; ਨਾਮ ਬਾਨ ਪਹਿਚਾਨ ॥੧੬੩॥"
page = 725

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Uttering the words “Bhisham and Shantanu”, then adding “Ari” and afterwards saying the words “Sutari”, the names of Baan are recognized.163."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਫਿਰ) 'ਸੂਤ' ਪਦ ਕਹਿ ਕੇ ਅੰਤ ਉਤੇ 'ਅਰਿ' ਦਾ ਕਥਨ ਕਰੋ। (ਇਹ) ਬਾਣ ਦੇ ਨਾਮ ਵਜੋਂ ਪਛਾਣੋ ॥੧੬੩॥"