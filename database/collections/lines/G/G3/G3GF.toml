[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਭੋ ਲੋਕ ਖਯਾਤਾ ਬਿਧਾਤਾ ਪਛਾਨਯੋ ॥"
page = 272

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Everyone considered him as an incarnation of Vishnu and he was famous among the people as the Lord."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਾਰੇ ਲੋਕਾਂ ਨੇ ਸਥਾਪਿਤ 'ਬਿਧਾਤਾ' ਵਜੋਂ ਪਛਾਣ ਲਿਆ।"