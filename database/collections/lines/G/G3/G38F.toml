[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਨ ਤੁਮੑਾਰੇ ਹਿਰਦੈ ਵਾਸਹਿ; ਸੰਤਨ ਕਾ ਸੰਗੁ ਪਾਵਉ ॥"
page = 682
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "May Thine feet abide within my mind and may I obtain the society of saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਪੈਰ ਮੇਰੇ ਮਨ ਅੰਦਰ ਨਿਵਾਸ ਕਰਨ, ਅਤੇ ਮੈਨੂੰ ਸਾਧੂਆਂ ਦੀ ਸੰਗਤ ਪ੍ਰਾਪਤ ਹੋਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "May Your feet abide within my heart, and may I find the Society of the Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਕੇ ਚਰਨ ਕਮਲ ਹਮਾਰੇ ਹਿਰਦੈ ਮੇਂ ਵਾਸ ਕਰੈਂ, ਵਾ ਜਿਨ ਕੇ ਰਿਦੇ ਮੇਂ ਵਸਤੇ ਹੈਂ ਤਿਨ ਸੰਤਨ ਕਾ ਸੰਗ ਮੈਂ ਪਾਵੋਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰੇ ਚਰਨ ਮੇਰੇ ਹਿਰਦੇ ਵਿਚ ਵੱਸਦੇ ਰਹਿਣ, ਮੈਂ ਤੇਰੇ ਸੰਤ ਜਨਾਂ ਦੀ ਸੰਗਤਿ ਹਾਸਲ ਕਰ ਲਵਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਾਸਹਿ = ਵੱਸਦੇ ਰਹਿਣ। ਹਿਰਦੈ = ਹਿਰਦੇ ਵਿਚ। ਸੰਗੁ = ਸਾਥ, ਸੰਗਤਿ। ਪਾਵਉ = ਪਾਵਉਂ, ਮੈਂ ਪ੍ਰਾਪਤ ਕਰਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el ser bendecido con la Sociedad de los Santos,"