[[content]]
assets = ["SSA2"]
type = "primary"
data = "ੜਾੜੈ; ਰੂੜਾ ਹਰਿ ਜੀਉ ਸੋਈ ॥"
page = 936
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "R: Beauteous is that Sire Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ੜ: ਸੁੰਦਰ ਹੈ ਉਹ ਮਹਾਰਾਜ ਮਾਲਕ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Rharha: The Dear Lord is beautiful;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ੜਾੜੇ ਦੁਆਰਾ ਕਹਿਤੇ ਹੈਂ: ਸੁੰਦਰੁ ਸੋਈ ਹਰਿ ਜੀਉ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ ਹੀ (ਸਭ ਤੋਂ ਵਧੀਕ) ਸੁੰਦਰ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੂੜਾ = ਸੁੰਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bello es mi Señor, el Dios;"