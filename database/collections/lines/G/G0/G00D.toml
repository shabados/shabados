[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ; ਚਕਵੀ ਸੂਰਜ ਆਸ ॥"
page = 838
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the shell-duck craves for the sun,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਸੁਰਖਾਬਨੀ ਸੂਰਜ ਨੂੰ ਲੋਚਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As the chakvi bird longs for the sun,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਚਕਵੀ ਕੋ ਸੂਰਜ ਕੇ ਦਰਸਨ ਕੀ ਆਸ ਲਗੀ ਰਹਿਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਚਕਵੀ ਨੂੰ ਸੂਰਜ (ਦੇ ਚੜ੍ਹਨ) ਦੀ ਉਡੀਕ ਲੱਗੀ ਰਹਿੰਦੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como el pájaro Chakvi añora el sol,"