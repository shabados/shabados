[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤੀ ਭਾਇ ਵਿਹੂਣਿਆ; ਮੁਹੁ ਕਾਲਾ. ਪਤਿ ਖੋਇ ॥"
page = 57
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who are bereft of Lord's love and devotion lose honour and their faces are blackened."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਪ੍ਰਭੂ ਦੀ ਪ੍ਰੀਤ ਅਤੇ ਸ਼ਰਧਾ ਅਨੁਰਾਗ ਤੋਂ ਸੱਖਣੇ ਹਨ, ਉਹ ਇੱਜ਼ਤ ਗੁਆ ਲੈਂਦੇ ਹਨ ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ ਚਿਹਰੇ ਸਿਆਹ ਕੀਤੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without loving devotion to God, their faces are blackened, and their honor is lost."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਪ੍ਰੇਮਾਭਗਤੀ ਸੇ ਰਹਤ ਹੈਂ, ਤਿਨ ਕਾ ਮੁਹ ਕਾਲਾ ਹੋਵੇਗਾ ਔਰ ਪ੍ਰਲੋਕ ਮੇਂ ਪਤਿ ਗਵਾਈ ਜਾਏਗੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਤੇ ਪਿਆਰ ਤੋਂ ਵਾਂਜੇ ਬੰਦਿਆਂ ਦਾ ਮੂੰਹ (ਉਸ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ) ਕਾਲਾ (ਦਿੱਸਦਾ ਹੈ), ਉਹ ਆਪਣੀ ਇੱਜ਼ਤ ਗਵਾ ਕੇ (ਜਾਂਦੇ ਹਨ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿ = ਇੱਜ਼ਤ। ਖੋਇ = ਗਵਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Amor a la Devoción, sus semblantes se obscurecen, y son deshonrados."