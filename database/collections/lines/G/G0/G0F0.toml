[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਕਲਿਆਣ ਪ੍ਰਭਿ ਕੀਨੇ ॥"
page = 626
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the comforts, the Lord has blessed me with."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਆਰਾਮ ਸੁਆਮੀ ਨੇ ਮੈਨੂੰ ਬਖਸ਼ਿਸ਼ ਕਰ ਦਿੱਤੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God has bestowed all comforts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਪ੍ਰਕਾਰ ਪ੍ਰਭੂ ਨੇ ਸੁਖ ਪ੍ਰਾਪਤਿ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ ਸਾਰੇ ਸੁਖ ਆਨੰਦ ਆਨੰਦ ਬਖ਼ਸ਼ ਦਿੱਤੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਲਿਆਣ = ਸੁਖ। ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por la Gracia de Dios, toda Dicha es nuestra,"