[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਤੁਝੀ ਤਨੁ; ਸੰਗਤਿ ਪ੍ਰਾਨ ॥"
page = 486
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thine saints are Thy body, and their association is my life."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਸਾਧੂ ਤੇਰੀ ਦੇਹ ਹਨ। ਉਨ੍ਹਾਂ ਦਾ ਮੇਲ-ਮਿਲਾਪ ਮੇਰੀ ਜਿੰਦ-ਜਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your Saints are Your body, and their company is Your breath of life."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਸੰਤ ਜੋ ਤੇਰਾ (ਤਨੁ) ਸਰੀਰ ਹੈਂ ਤਿਨ ਕੀ ਸੰਗਤਿ ਮੇਰੇ ਪ੍ਰਾਨ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦੇਵਾਂ ਦੇ ਦੇਵ ਪ੍ਰਭੂ! ਸੰਤ ਤੇਰਾ ਹੀ ਰੂਪ ਹਨ, ਸੰਤਾਂ ਦੀ ਸੰਗਤਿ ਤੇਰੀ ਜਿੰਦ-ਜਾਨ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੁਝੀ = ਤੇਰਾ ਹੀ। ਤਨੁ = ਸਰੀਰ, ਸਰੂਪ। ਪ੍ਰਾਨ = ਜਿੰਦ-ਜਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Santos son Tu Cuerpo, Tu Respiración de la Vida, oh Señor."