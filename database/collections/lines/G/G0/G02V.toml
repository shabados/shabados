[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਈਅਨਿ ਸਭਿ ਨਿਧਾਨ; ਤੇਰੈ ਰੰਗਿ ਰਤਿਆ ॥"
page = 519
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Imbued with Thy love, O Lord, all the treasure are obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਪ੍ਰੇਮ ਨਾਲ ਰੰਗੀਜਣ ਦੁਆਰਾ, ਹੇ ਪ੍ਰਭੂ! ਸਾਰੇ ਖਜਾਨੇ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All treasures are obtained, when we are attuned to Your Love."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਪ੍ਰੇਮ ਮੇਂ ਮਸਤ ਹੋਇਓਂ ਕੋ ਸਭ ਪ੍ਰਕਾਰ ਕੇ ਖਜਾਨੇ ਮਿਲਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਜੇ ਤੇਰੇ (ਪਿਆਰ ਦੇ) ਰੰਗ ਵਿਚ ਰੰਗੇ ਜਾਈਏ ਤਾਂ, ਮਾਨੋ, ਸਾਰੇ ਖ਼ਜ਼ਾਨੇ ਮਿਲ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਈਅਨਿ = ਪਾਏ ਜਾਂਦੇ ਹਨ {ਵਿਆਕਰਣ ਅਨੁਸਾਰ ਇਹ ਲਫ਼ਜ਼ 'ਪਾਇਨਿ' ਤੋਂ 'ਕਰਮ ਵਾਚ' Passive Voice ਹੈ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Imbuido en Tu Amor, obtengo todos los Tesoros; habitando en Ti, ni me arrepiento ni me lamento."