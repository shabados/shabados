[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨ ਕਉ ਕਰਤੈ ਧੁਰਿ ਲਿਖਿ ਪਾਈ ॥"
page = 1069
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who are so pre-ordained by the Creator Lord;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਲਈ ਸਿਰਜਣਹਾਰ ਸੁਆਮੀ ਨੇ ਮੁੱਢ ਤੋਂ ਐਸੀ ਲਿਖਤਾਕਾਰ ਲਿਖੀ ਹੋਈ ਹੈ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who are so pre-ordained by the Creator,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕਉ ਕਰਤੇ ਨੇ ਆਦੋਂ ਹੀ ਹਰੀ ਕੀ ਭਗਤੀ ਲਿਖ ਪਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ, (ਆਤਮਕ ਆਨੰਦ ਦੀ ਇਹ ਦਾਤ ਉਹਨਾਂ ਨੂੰ ਮਿਲਦੀ ਹੈ) ਜਿਨ੍ਹਾਂ ਦੇ ਭਾਗਾਂ ਵਿਚ ਕਰਤਾਰ ਨੇ ਧੁਰ ਦਰਗਾਹੋਂ ਲਿਖ ਕੇ ਰੱਖ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਤੈ = ਕਰਤਾਰ ਨੇ। ਧੁਰਿ = ਧੁਰ ਤੋਂ। ਲਿਖਿ = (ਕੀਤੇ ਕਰਮਾਂ ਅਨੁਸਾਰ) ਲਿਖ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquéllos que lo tenían en su Destino así escrito por Dios,"