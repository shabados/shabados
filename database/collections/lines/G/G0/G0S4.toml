[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਗੁਣ ਗਾਵਹਿ; ਰਸਨ ਰਸੇਰੇ ॥"
page = 1025
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With their tongue, happily sing they the Lord's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਜੀਭ ਨਾਲ ਉਹ ਖੁਸ਼ੀ ਸਹਿਤ ਸਾਈਂ ਦਾ ਜੱਸ ਗਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They sing the Glorious Praises of the Lord, savoring it with their tongues."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਰਸਨਾ ਕਰ ਤੇਰੇ ਗੁਨ ਗਾਵਤੇ ਹੈਂ, ਤਿਸੀ ਰਸ ਮੇਂ ਰਸੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਜੀਭ ਨਾਲ ਰਸ ਲੈ ਕੇ ਤੇਰੇ ਗੁਣ ਗਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸਨ = ਜੀਭ। ਰਸੇਰੇ = ਰਸ ਆਨੰਦ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Te alaban siempre, endulzándolo todo con Tu Amor."