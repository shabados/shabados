[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਈਹਾ ਊਹਾ; ਤੁਮ ਰਖੇ ॥"
page = 211
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Here and There Thou art my Saviour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਏਥੇ ਅਤੇ ਉਥੇ ਤੂੰ ਮੇਰਾ ਰਾਖਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Here and hereafter, You are my Savior and Protector."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਲੋਕ ਪ੍ਰਲੋਕ ਮੇਂ ਤੁਮ ਹੀ ਰਖ੍ਯਾ ਕਰਨੇ ਵਾਲੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਇਸ ਲੋਕ ਵਿਚ ਤੇ ਪਰਲੋਕ ਵਿਚ ਤੂੰ ਹੀ ਸਭ ਦੀ ਰੱਖਿਆ ਕਰਦਾ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਈਹਾ = ਇਸ ਲੋਕ ਵਿਚ। ਊਹਾ = ਪਰਲੋਕ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Salvas a todos aquí y aquí después,"