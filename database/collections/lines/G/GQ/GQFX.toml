[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਕਤ ਬਚਨ ਬਿਛੂਆ ਜਿਉ ਡਸੀਐ; ਤਜਿ ਸਾਕਤ ਪਰੈ ਪਰਾਰੇ ॥੫॥"
page = 981
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The word of the mammon-worshipper stings like a scorpion. Leave thou the apostate far away."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦੇ ਪੁਜਾਰੀ ਦਾ ਲਫਜ਼ ਅਠੂਹੇ ਦੀ ਮਾਨੰਦ ਡੰਗ ਮਾਰਦਾ ਹੈ। ਤੂੰ ਅਧਰਮੀ ਨੂੰ ਬਹੁਤ ਦੁਰੇਡੇ ਹਟਾ ਛੱਡ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The word of the faithless cynic stings like a scorpion; leave the faithless cynic far, far behind. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਕਤੋਂ ਕੇ ਬਚਨ ਬਿਛੂ ਕੀ ਤਰਾਂ ਡਸਤੇ ਹੈਂ, ਤਾਂ ਤੇ ਸਾਕਤੋਂ ਕੋ ਪਰੇ ਤੇ ਪਰੇ ਤਜੋ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਸਾਕਤ ਦੇ ਬਚਨਾਂ ਨਾਲ ਮਨੁੱਖ ਇਉਂ ਡੰਗਿਆ ਜਾਂਦਾ ਹੈ ਜਿਵੇਂ ਸੱਪ-ਠੂਹੇਂ ਦੇ ਡੰਗ ਨਾਲ। ਸਾਕਤ (ਦਾ ਸੰਗ) ਛੱਡ ਕੇ ਉਸ ਤੋਂ ਪਰੇ ਹੀ ਹੋਰ ਪਰੇ ਰਹਿਣਾ ਚਾਹੀਦਾ ਹੈ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਡਸੀਐ = ਡਸਿਆ ਜਾਂਦਾ ਹੈ। ਤਜਿ = ਤਿਆਗ ਕੇ। ਪਰਾਰੇ = ਹੋਰ ਪਰੇ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues las palabras de esos cínicos provocan una picadura de escorpión, es mejor que abandones cuanto antes su compañía. (5)"