[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਨਹੀ; ਮੋਨਿ ਅਉਧੂਤੁ ਸਦਾਇਆ ॥"
page = 912
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "One call himself a silent anchoret."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਆਪਣੇ ਆਪ ਨੂੰ ਖਾਮੋਸ਼ ਵਿਰੱਕਤ ਅਖਵਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some put themselves on silence, and call themselves hermits."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਸੀ ਨੇ ਮੋਨ ਧਾਰਕੈ ਅਵਧੂਤ ਕਹਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਨੇ ਆਪਣੇ ਆਪ ਨੂੰ ਮੋਨ-ਧਾਰੀ ਤਿਆਗੀ ਸਾਧੂ ਅਖਵਾਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਨਿ = ਸਦਾ ਚੁੱਪ ਰਹਿਣ ਵਾਲਾ। ਅਉਧੂਤੁ = ਤਿਆਗੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "otros han proclamado su desapego guardando silencio."