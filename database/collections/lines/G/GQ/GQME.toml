[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲੋਭ ਮੋਹ ਸਿਉ; ਗਈ ਵਿਖੋਟਿ ॥"
page = 1347
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With avarice and worldly love, I have sundered my ties."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲਾਲਚ ਅਤੇ ਸੰਸਾਰੀ ਮਮਤਾ ਨਾਲੋ ਮੈਂ ਆਪਣਾ ਸੰਬੰਧ ਤੋੜ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have broken my ties with greed and emotional attachment."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸੀ ਕਰ ਲੋਭ, ਮੋਹਿ ਸਿਉਂ ਭੀ ਹਮਾਰੀ (ਵਿਖੋਟਿ) ਪ੍ਰਤੀਤ ਗਈ ਹੈ ਵਾ ਹਮਾਰੀ ਪ੍ਰੀਤੀ ਨਿਖੁਟ ਗਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਲੋਭ ਮੋਹ (ਆਦਿਕ) ਨਾਲੋਂ ਮੇਰਾ ਇਤਬਾਰ ਮੁੱਕ ਗਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਉ = ਨਾਲ। ਵਿਖੋਟਿ = (ਵਿ-ਖੋਟਿ। ਖੋਟ ਦੀ ਅਣਹੋਂਦ) ਇਤਬਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He roto mis amarras con la avaricia y los apegos emocionales,"