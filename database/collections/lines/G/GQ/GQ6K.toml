[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਿ ਸਿਮਰਿ. ਗੋਬਿੰਦ ਨਾਮ ॥"
page = 408
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "remember the Name of the World Master in thy heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੇ ਦਿਲ ਅੰਦਰ ਜਗਤ ਦੇ ਮਾਲਕ ਦੇ ਨਾਮ ਦਾ ਆਰਾਧਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "remember the Name of the Lord of the Universe in your mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਕਰ ਕੇ ਗੋਬਿੰਦ ਨਾਮ ਕਾ ਸਿਮਰਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਆਪਣੇ) ਮਨ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਦਾ ਰਹੁ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y canta el Nombre de tu Señor en tu mente, l"