[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖੋਟੇ. ਠਉਰ ਨ ਪਾਇਨੀ; ਖਰੇ ਖਜਾਨੈ ਪਾਇ ॥"
page = 57
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Counterfeit find not a place and the genuine are but into the treasury."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਾਲ੍ਹੀਆਂ ਨੂੰ ਥਾਂ ਨਹੀਂ ਮਿਲਦੀ ਅਤੇ ਅਸਲੀ ਕੇਸ ਵਿੱਚ ਪਾਏ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The counterfeit have no place there, but the genuine are placed in His Treasury."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਖੋਟੇ ਹੈਂ ਕਿਆ ਕਸਵਟੀ ਨਹੀਂ ਸਹਾਰਤੇ ਸੋ ਸਰੂਪ ਅਸਥਾਨ ਕੋ ਨਹੀਂ ਪਾਵਤੇ ਹੈਂ, ਜੋ ਕਸਵਟੀ ਸਹਾਰਨੇ ਵਾਲੇ ਖਰੇ ਹੈਂ, ਸੋ (ਖਜਾਨੈ ਪਾਇ) ਸਰੂਪ ਮੇਂ ਅਭੇਦ ਕਰੀਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਖੋਟਿਆਂ ਨੂੰ (ਉਸ ਦੇ ਦਰ ਤੇ) ਥਾਂ ਨਹੀਂ ਮਿਲਦੀ, ਖਰਿਆਂ ਨੂੰ ਉਹ ਆਪਣੇ ਖ਼ਜ਼ਾਨੇ ਵਿਚ ਸ਼ਾਮਿਲ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਉਰ = ਥਾਂ। ਨ ਪਾਇਨੀ = ਨ ਪਾਇਨਿ, ਨਹੀਂ ਪੀਂਦੇ, ਨਹੀਂ ਪ੍ਰਾਪਤ ਕਰਦੇ"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las monedas falsas no encuentran lugar, pero las verdaderas las reúne para Su Tesoro."