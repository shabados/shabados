[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਾ ਤੇਰਾ ਪਾਰਾਵਾਰ ਪਾਇਆ ਜਾ ਸਕਦਾ ਹੈ ਅਤੇ ਨਾ ਹੀ ਤੇਰੀ ਉਪਮਾ ਦਿੱਤੀ ਜਾ ਸਕਦੀ ਹੈ ॥੧੨੭॥"

