[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਤੁ ਮੁਖਿ ਨਾਮੁ. ਨ ਊਚਰਹਿ; ਬਿਨੁ ਨਾਵੈ. ਰਸ ਖਾਹਿ ॥"
page = 473
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mouth, which utters not the Name and without the Name, eats delicacies,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੂੰਹ, ਜੋ ਨਾਮ ਦਾ ਉਚਾਰਨ ਨਹੀਂ ਕਰਦਾ, ਅਤੇ ਨਾਮ ਦੇ ਬਗੈਰ ਨਿਆਮਤਾਂ ਛਕਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That mouth which does not chant the Naam, and without the Name eats tasty foods"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਜਿਤੁ) ਜਿਸ ਕੇ ਮੁਖ ਸੇ ਨਾਮ ਕਾ ਉਚਾਰਣ ਨਹੀਂ ਹੋਤਾ ਹੈ ਔ ਬਿਨਾਂ ਨਾਮ ਕੇ ਰਸ ਖਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮੂੰਹ ਨਾਲ ਮਨੁੱਖ ਨਾਮ ਨਹੀਂ ਸਿਮਰਦੇ, ਤੇ ਨਾਮ ਸਿਮਰਨ ਤੋਂ ਬਿਨਾ ਸੁਆਦਲੇ ਪਦਾਰਥ ਖਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਤੁ ਮੁਖਿ = ਜਿਸ ਮੂੰਹ ਨਾਲ। ਰਸ ਖਾਹਿ = ਸੁਆਦਲੇ ਪਦਾਰਥ ਖਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los labios que no pronuncian el Nombre del Señor"