[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਆ ਜਪੁ ਕਿਆ ਤਪੁ ਸੰਜਮੋ; ਕਿਆ ਬਰਤੁ ਕਿਆ ਇਸਨਾਨੁ ॥"
page = 337
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of What avail is recitation, what penance and self-mortification, what fasting and what ablution,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੀ ਲਾਭ ਪਾਠ ਦਾ, ਕੀ ਤਪੱਸਿਆ ਤੇ ਸਵੈ-ਰਿਆਜ਼ਤ ਦਾ, ਕੀ ਹੈ ਨਿਰਾ-ਅਹਾਰ ਰਹਿਣ ਦਾ ਅਤੇ ਕੀ ਨ੍ਹਾਉਣ ਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What good is chanting, penance or self-mortification? What good is fasting or cleansing baths,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਜਪ ਕਿਆ ਹੈ ਤਪ ਔਰ ਸੰਜਮ ਕਿਆ ਹੈ, ਪੁਨਾ ਬ੍ਰਤ ਤਥਾ ਇਸ਼ਨਾਨ ਕਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਦੋਂ ਤੱਕ) ਜਪ ਤਪ, ਸੰਜਮ, ਵਰਤ, ਇਸ਼ਨਾਨ-ਇਹ ਸਭ ਕਿਸੇ ਕੰਮ ਨਹੀਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਆ = ਕਿਸ ਅਰਥ? ਕੀਹ ਲਾਭ? ਸੰਜਮੋ = ਮਨ ਅਤੇ ਇੰਦ੍ਰਿਆਂ ਨੂੰ ਰੋਕਣ ਦਾ ਜਤਨ। ਬਰਤੁ = ਵਰਤ, ਪ੍ਰਣ, ਇਕਰਾਰ (ਆਮ ਤੌਰ ਤੇ ਰੋਟੀ ਨਾਹ ਖਾਣ ਵਾਸਤੇ ਵਰਤੀਦਾ ਹੈ, ਇਹ ਪ੍ਰਣ ਕਿ ਅੱਜ ਕੁਝ ਨਹੀਂ ਖਾਣਾ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿De qué sirve la contemplación, las austeridades o cualquier clase de autodisciplina?"