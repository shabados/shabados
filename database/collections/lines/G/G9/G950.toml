data = "ਅਨਿਕ ਸ੍ਵਾਂਗ ਕਾਛੇ; ਭੇਖਧਾਰੀ ॥"
page = 1299
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The disguiser assumes various garbs,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਰੂਪੀਆ ਅਨੇਕਾਂ ਭੇਸ ਧਾਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "People disguise themselves with all sorts of costumes,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਭੇਖਧਾਰੀ) ਨਟ ਅਨੇਕ ਭਾਂਤ ਸ੍ਵਾਂਗੋ ਕੋ (ਕਾਛੇ) ਬਨਾਉਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸ੍ਵਾਂਗੀ ਮਨੁੱਖ (ਮਾਇਆ ਦੀ ਖ਼ਾਤਰ) ਅਨੇਕਾਂ ਮਨ-ਬਾਂਛਤ ਸ੍ਵਾਂਗ ਬਣਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਛੇ = (कांछित) ਮਨ-ਬਾਂਛਤ। ਭੇਖਧਾਰੀ = ਸ੍ਵਾਂਗ ਰਚਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La gente se disfraza con todo tipo de atuendos,"