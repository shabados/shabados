[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸੁਲਤਾਨੇ ਪੁਰਿ, ਭਗਤਿ ਭੰਡਾਰਾ ॥੨੧॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Sultanpur is the warehouse of devotion (and devotees)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਇਹ ਸਾਰਾ) ਸੁਲਤਾਨ ਪੁਰ (ਨਾਮੇ ਨਗਰ ਵਿਖੇ ਪੰਚਮ ਗੁਰੂ ਜੀ ਦੀ) ਭਗਤੀ ਦਾ ਖਜ਼ਾਨਾ ਹੈ।"