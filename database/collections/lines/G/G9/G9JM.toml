[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁ ਤੁਮ ਨਿਜੁ ਧਨ ਹਿਰਿ ਲੈ ਜਾਵਤ ॥੨॥"
page = 947

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘What type of thief are you? You steel the goods, which are your own wealth.(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਤਾਂ ਤੂੰ ਆਪਣਾ ਧਨ ਹੀ ਲੁਟ ਕੇ ਲੈ ਜਾਂਦਾ ਹੈਂ ॥੨॥"