[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਰਜ ਸਗਲੇ ਸਾਧੇ ॥"
page = 629
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "all the affairs are perfected."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਮੂਹ ਕੰਮ ਰਾਸ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All my affairs have been resolved."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰੇ ਸਰਬ ਕਾਰਜ ਸਿਧ ਭਏ ਹੈਂ; ਵਾ ਪੂਰਾ ਜੋ ਗੁਰੂ ਹੈ ਤਿਸ ਨੂੰ ਜੋ ਕੋਈ ਅਰਾਧੇ ਹੈ, ਸੋ ਸਭੀ ਕਾਰਜ ਸਿੱਧ ਕਰ ਲੇਵੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਆਪਣੇ ਸਾਰੇ ਕੰਮ ਸਵਾਰ ਲਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧੇ = ਸਫਲ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y él me regaló la Plenitud."