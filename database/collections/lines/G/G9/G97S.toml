[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਇਤੁ ਲਾਹੈ ਲਾਇਅਨੁ; ਭਗਤੀ ਦੇਇ ਭੰਡਾਰ ॥੩॥"
page = 428
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, whom the Lord attaches to this profitable concern, them He grants the treasure of His devotional service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੂੰ ਸੁਆਮੀ ਇਸ ਨਫੇਵੰਦ ਵਿਉਹਾਰ ਨਾਲ ਜੋੜਦਾ ਹੈ, ਉਨ੍ਹਾਂ ਨੂੰ ਉਹ ਆਪਣੀ ਪ੍ਰੇਮ ਮਈ ਸੇਵਾ ਦਾ ਖਜ਼ਾਨਾਂ ਬਖਸ਼ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those whom the Lord has attached to this profitable venture, are granted the treasure of devotional worship. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੋ ਇਸ ਲਾਭ ਮੇਂ ਲਗਾਇਆ ਹੈ, ਤਿਨ ਕੋ ਭਗਤੀ ਕਾ ਭੰਡਾਰਾ ਦੀਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਨੂੰ ਪ੍ਰਭੂ ਨੇ ਇਸ ਲਾਭਵੰਦੇ ਕੰਮ ਵਿਚ ਲਾਇਆ ਹੈ ਉਹਨਾਂ ਨੂੰ ਆਪਣੀ ਭਗਤੀ ਦੇ ਖ਼ਜ਼ਾਨੇ ਦੇ ਦੇਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਤੁ ਲਾਹੈ = ਇਸ ਲਾਭ ਵਿਚ। ਲਾਇਅਨੁ = ਲਾਏ ਹਨ ਉਸ (ਪ੍ਰਭੂ) ਨੇ। ਦੇਇ = ਦੇਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquéllos que cosechan este fruto, son bendecidos con el Tesoro de la Alabanza. (3)"