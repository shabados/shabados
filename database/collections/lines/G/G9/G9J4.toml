[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕਿਰਪਾਲ; ਹਰਿ ਭਏ ਸਹਾਈ ॥੩॥"
page = 196
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "when the Succour Guru-God became merciful."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ, ਸਹਾਇਕ, ਗੁਰੂ-ਵਾਹਿਗੁਰੂ ਮਿਹਰਬਾਨ ਹੋ ਗਏ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru, became my Help and Support. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਬ ਗੁਰ ਕ੍ਰਿਪਾਲ ਹੂਏ ਤਬ ਹਰੀ ਸਹਾਇਕ ਭਏ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਸਾਰੇ ਜਪਾਂ ਦੀ, ਸਾਰੇ ਤਪਾਂ ਦੀ, ਸਾਰੇ ਸੰਜਮਾਂ ਦੀ ਵਡਿਆਈ ਪ੍ਰਾਪਤ ਹੋ ਗਈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਾਈ = ਮਦਦ ਕਰਨ ਵਾਲੇ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, en el Soporte del Señor. (3)"