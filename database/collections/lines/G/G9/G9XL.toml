[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕਾ ਕੀਆ; ਮਾਨੈ ਸੋਇ ॥"
page = 878
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the Lord, accepts the lamp made of that clay."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਆਮੀ ਉਸ ਮਿੱਟੀ ਤੋਂ ਬਣੇ ਹੋਏ ਦੀਵੇ ਨੂੰ ਪ੍ਰਵਾਨ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "a lamp made of such clay is acceptable to the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਮਿਟੀ ਕਾ ਕੀਆ ਹੂਆ ਦੀਵਾ (ਸੋਇ) ਪਰਮੇਸਰ ਮਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਿੱਟੀ ਦਾ ਬਣਿਆ ਹੋਇਆ ਦੀਵਾ ਪਰਮਾਤਮਾ ਪਰਵਾਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕੀ = ਉਸ (ਮਿੱਟੀ) ਦਾ ਬਣਾਇਆ ਹੋਇਆ (ਦੀਵਾ)। ਮਾਨੈ = ਪਰਵਾਨ ਕਰਦਾ ਹੈ। ਸੋਇ = ਉਹ ਪਰਮਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sea el barro que moldee esta lámpara, pues tu Señor aprueba tal creación,"