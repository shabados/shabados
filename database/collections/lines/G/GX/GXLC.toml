[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਇਹ ਐਸੀ ਸੱਚੀ ਦੌਲਤ ਹੈ ਜਿਸ ਨੂੰ ਕੋਈ ਨੁਕਸਾਨ ਨਹੀਂ ਹੋ ਸਕਦਾ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਦੌਲਤੇ ਕਾਂ ਰਾ ਨਮੀ ਆਯਦ ਜ਼ਿਆਂ ॥੪੮੫॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "It is such a true wealth that it is above and beyond any damage or loss. (485)"