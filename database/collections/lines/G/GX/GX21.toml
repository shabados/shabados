[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਸਿਖਾ ਗੁਰ ਸਿਖ, ਗੁਰਸਿਖ ਭਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The Sikh has recited the same to others."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸਿੱਖਾਂ ਨੂੰ ਗੁਰ ਸਿਖਾਂ ਦਾ (ਤੇ ਪਰਮੇਸ਼ਰ ਦਾ) ਭਾਣਾ ਚੰਗਾ ਲੱਗਾ ਹੈ।"