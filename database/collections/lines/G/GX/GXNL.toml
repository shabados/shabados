data = "ਸੇਵਾ ਕਰੀ ਅਧਿਕ ਦਿਨ ਰਾਤਾ ॥"
page = 182

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They performed various types of mediation, worship and service day and service day and night for a long time."

[[content]]
