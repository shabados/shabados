[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਲਜੁਗ ਮਹਿ; ਰਾਮ ਨਾਮੁ ਉਰ ਧਾਰੁ ॥"
page = 1129
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the Dark-age, enshrine thou the Lord's Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਲਯੁਗ ਅੰਦਰ ਤੂੰ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਨੂੰ ਆਪਣੇ ਹਿਰਦੇ ਅੰਦਰ ਅਸਥਾਪਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In this Dark Age of Kali Yuga, enshrine the Lord's Name within your heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਲਿਜੁਗ ਵਿਖੇ ਰਾਮ ਨਾਮ ਕੋ ਹਿਰਦੇ ਵਿਚ ਧਾਰਨ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਵਿਕਾਰਾਂ-ਭਰੇ ਜਗਤ ਵਿਚ (ਵਿਕਾਰਾਂ ਤੋਂ ਬਚਣ ਲਈ) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ (ਆਪਣੇ) ਹਿਰਦੇ ਵਿਚ ਵਸਾਈ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਲਜੁਗ ਮਹਿ = ਕਲਜੁਗ ਵਿਚ, ਵਿਕਾਰਾਂ-ਭਰੇ ਜਗਤ ਵਿਚ {ਨੋਟ: ਕਿਸੇ ਖ਼ਾਸ 'ਜੁਗ' ਦਾ ਜ਼ਿਕਰ ਨਹੀਂ ਕਰ ਰਹੇ}। ਉਰ = ਹਿਰਦਾ। ਧਾਰੁ = ਵਸਾਈ ਰੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo el Nombre del Señor emancipa en la Era de Kali."