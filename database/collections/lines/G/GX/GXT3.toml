[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਕਤ; ਥਾਨ ਭਰਿਸਟ. ਫਿਰਾਹੀ ॥੫॥"
page = 239
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The evil-doer wanders about in defiled places."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੁਕਰਮੀ ਪਲੀਤ ਥਾਵਾਂ ਤੇ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The faithless cynic wanders around in polluted places. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਕਤ ਭਰਿਸਟ ਅਸਥਾਨੋਂ ਮੇਂ ਫਿਰਤਾ ਹੈ, ਵਾ ਸਾਕਤ ਸਰੂਪ ਅਸਥਾਨ ਤੇ ਭ੍ਰਿਸਟ ਫਿਰਤਾ ਹੈ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਨਾਲੋਂ ਟੁੱਟੇ ਹੋਏ ਮਨੁੱਖ (ਕੁਕਰਮਾਂ ਵਾਲੇ) ਗੰਦੇ ਥਾਈਂ ਹੀ ਫਿਰਦੇ ਰਹਿੰਦੇ ਹਨ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਰਿਸਟ = ਗੰਦੇ, ਵਿਕਾਰੀ। ਫਿਰਾਹੀ = ਫਿਰਹਿ, ਫਿਰਦੇ ਹਨ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y lleno de maldad, se arrastra por el lodo.  (5)"