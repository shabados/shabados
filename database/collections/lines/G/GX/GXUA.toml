[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਰ ਧਨ ਪਰ ਦਾਰਾ; ਪਰਹਰੀ ॥"
page = 1163
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who forsakes another's wealth and another's woman,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਪਰਾਈ ਦੌਲਤ ਅਤੇ ਪਰਾਈ ਇਸਤਰੀ ਨੂੰ ਤਿਆਗ ਦਿੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who stays away from others' wealth and others' spouses"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਾਯਾ ਧਨੁ ਔ ਪਰਾਈ ਇਸਤ੍ਰੀ ਜਿਸ ਨੇ ਤ੍ਯਾਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਰਾਇਣ ਦਾ ਭਜਨ ਕਰ ਕੇ) ਜਿਸ ਮਨੁੱਖ ਨੇ ਪਰਾਏ ਧਨ ਤੇ ਪਰਾਈ ਇਸਤ੍ਰੀ ਦਾ ਤਿਆਗ ਕੀਤਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਾਰਾ = ਇਸਤ੍ਰੀ। ਪਰਹਰੀ = ਤਿਆਗ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que no envidia las riquezas o la mujer del otro,"