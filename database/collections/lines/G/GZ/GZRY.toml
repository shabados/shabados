[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੂਖ ਸਹਜ ਆਨੰਦਾ ॥"
page = 622
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting the Lord, who is pleasing to my mind,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਜੋ ਮੇਰੇ ਚਿੱਤ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Celestial peace and bliss have come,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀਤੇ ਸੁਖ ਔ ਅਨੰਦ ਸਹਜ ਸੁਭਾਵਕ ਹੀ ਪ੍ਰਾਪਤਿ ਭਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਮੇਰੇ ਅੰਦਰ ਆਤਮਕ ਅਡੋਲਤਾ ਦੇ ਸੁਖ ਆਨੰਦ ਬਣੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜ = ਆਤਮਕ ਅਡੋਲਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He obtenido a mi Señor,"