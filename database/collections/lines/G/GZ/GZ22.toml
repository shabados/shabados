[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁ ਸੇਵ ਕਾਲ ਦੇਵ ਕੀ; ਅਭੇਵ ਜਾਨਿ ਕੀਜੀਐ ॥"
page = 614

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "According to the instructions given in Ramayana, we should ever be in the service of the Lord"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਲਈ ਕਾਲ ਪੁਰਖ ਨੂੰ 'ਅਭੇਵ' ਜਾਣ ਕੇ ਸੇਵਾ ਕਰਨੀ ਚਾਹੀਦੀ ਹੈ।"