[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਜੇ ਜਾਣੁ ਛਤ੍ਰੀ ॥੪੩੧॥"
page = 594

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The arrows, with golden wings and steel tips, were discharged and in this way, the arrows with sharp tips were discharged on the Kshatriyas.431."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਛਤ੍ਰੀਆਂ ਨੇ ਛਡੇ ਹੋਣ ॥੪੩੧॥"