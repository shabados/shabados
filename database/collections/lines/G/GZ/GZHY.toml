[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਖੇਲਤ ਹੈ ਮਨਿ ਆਨੰਦ ਕੈ; ਨ ਕਛੂ ਜਰਰਾ ਮਨਿ ਧਾਰ ਕੈ ਭੈ ਸੇ ॥"
page = 356

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is playing in bliss fearlessly"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਨ ਵਿਚ ਆਨੰਦ ਵਧਾ ਕੇ ਖੇਡਦੇ ਹਨ ਅਤੇ ਮਨ ਵਿਚ ਜ਼ਰਾ ਜਿੰਨਾ ਵੀ ਡਰ ਨਹੀਂ ਧਾਰਦੇ ਹਨ।"