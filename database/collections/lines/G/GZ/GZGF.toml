[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੈਹਾ ਦਿਸੈ ਉਜਲਾ; ਮਸੁ ਅੰਦਰਿ ਚਿਤੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The bronze appears bright but inside it remains blackness ."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕੈਹਾਂ (ਨਾਮ ਵਾਲਾ ਧਾਤੂ) ਚਿੱਟਾ ਦਿਸਦਾ ਹੈ (ਪਰੰਤੂ) ਉਸ ਦੇ ਅੰਦਰ ਕਾਲਖ ਚਿੱਤ੍ਰਤ ਹੈ (ਭਾਵ ਅਭੇਦ ਹੋਈ ਹੋਈ ਹੈ। ਇਸ ਲਈ ਦੁਭਾਂਤੀਆ ਹੈ)।"