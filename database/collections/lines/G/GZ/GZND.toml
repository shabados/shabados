[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਣਿ ਕਰਤਾਰ ਗੋਵਿੰਦ ਗੋਪਾਲ ॥"
page = 890
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Heart thou, O Creator, Master of the universe,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਰਵਣ ਕਰ, ਹੇ ਸਿਰਜਣਹਾਰ! ਆਲਮ ਦੇ ਮਾਲਕ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen, O Creator Lord, Lord of the Universe, Lord of the World,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਰਤਾਰ, ਗੋਬਿੰਦ, ਗੋਪਾਲ! ਤੂੰ ਹਮਾਰੀ ਬੇਨਤੀ ਸੁਣ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਵਿਚਾਰੇ ਕੀਹ ਕਰਨ? ਹੇ ਕਰਤਾਰ! ਹੇ ਗੋਬਿੰਦ! ਹੋ ਗੋਪਾਲ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਤਾਰ = ਹੇ ਕਰਤਾਰ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escúchame, oh Señor Creador, Sostenedor de la Tierra,"