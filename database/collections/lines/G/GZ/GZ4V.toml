[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਧ ਕੂਪ ਤੇ; ਕਾਢਨਹਾਰਾ ॥"
page = 1005
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he pulls out of the blind world-well."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੰਸਾਰ ਦੇ ਅੰਨ੍ਹੇ ਖੂਹ ਵਿਚੋਂ ਬਾਹਰ ਕੱਢ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He lifts them up and pulls him out of the deep dark pit."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅੰਧਾ ਕੂਆ ਜੋ ਸੰਸਾਰ ਹੈ ਪਰਮੇਸਰ ਤਿਸ ਤੇ ਕਾਢਨੇ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸੰਸਾਰ-ਰੂਪ) ਅੰਨ੍ਹੇ ਖੂਹ ਵਿਚੋਂ (ਪ੍ਰਭੂ ਜੀਵ ਨੂੰ) ਕੱਢਣ ਦੇ ਸਮਰੱਥ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੂਪ = ਖੂਹ। ਤੇ = ਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Él emancipa por Su Voluntad a quien sea."