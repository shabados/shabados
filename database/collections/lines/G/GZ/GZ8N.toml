[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਾਨਵ ਦੇਵ ਪਿਸਾਚ ਪ੍ਰੇਤ ਤੇ; ਨੇਤਹ ਨੇਤ ਕਹਾਏ ॥"
page = 711

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "By demons, gods, ghosts, spirits, He was called indescribable,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦਾਨਵ, ਦੇਵਤੇ, ਪਿਸ਼ਾਚ, ਪ੍ਰੇਤ ਵੀ ਉਸ ਨੂੰ ਨੇਤਿ ਨੇਤਿ (ਬੇਅੰਤ ਬੇਅੰਤ) ਕਹਿੰਦੇ ਹਨ।"