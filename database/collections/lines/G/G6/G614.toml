[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਬ ਰਾਜਾ ਢਿਗ ਬੈਠ︀ਯੋ ਤਬ ਦੁਹੂੰਅਨ ਲਪਟਾਇ ॥"
page = 884

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Raja took seat among them, both grasped each other."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦ ਰਾਜਾ ਕੋਲ ਬੈਠ ਗਿਆ ਤਾਂ ਦੋਵੇਂ (ਇਸਤਰੀਆਂ) ਲਿਪਟ ਗਈਆਂ"