[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕਿ ਪੰਚਾ ਮਾਰਿ; ਸਬਦਿ ਹੈ ਲਾਗੇ ॥"
page = 1045
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some there are, who overcoming the five demons, are yoked to the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਪੰਜਾਂ ਵਿਕਾਰਾਂ ਨੂੰ ਵਸ ਕਰਕੇ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਨਾਲ ਜੁੜੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some conquer the five demons, by being attached to the Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਕ ਗੁਰਮੁਖ ਪੰਚ ਕਾਮਾਦਿਕੋਂ ਕੋ ਮਾਰ ਕੇ ਗੁਰੋਂ ਕੇ ਉਪਦੇਸ਼ ਮੇਂ ਲਾਗੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਕਾਮਾਦਿਕ ਪੰਜਾਂ ਨੂੰ ਮਾਰ ਕੇ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਵਿਚ ਲੀਨ ਰਹਿੰਦੇ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਕਿ = {ਲਫ਼ਜ਼ 'ਇਕ' ਤੋਂ ਬਹੁ-ਵਚਨ} ਕਈ। ਮਾਰਿ = ਮਾਰ ਕੇ। ਸਬਦਿ = ਸ਼ਬਦ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunos han conquistado sus pasiones y se han apegado a la Palabra,"