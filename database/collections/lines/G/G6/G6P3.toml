[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧਸੰਗਿ; ਤੁਮਰੇ ਗੁਣ ਗਾਉ ॥"
page = 1144
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and in the society of saints Thy praise is hymned."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਤਿਸੰਗਤ ਅੰਦਰ ਤੇਰੀ ਕੀਰਤੀ ਗਾਇਨ ਕੀਤੀ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Saadh Sangat, the Company of the Holy, I sing Your Glorious Praises."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਸਤਸੰਗ ਦ੍ਵਾਰਾ ਤੁਮਾਰੇ ਗੁਣੋਂ ਕਾ ਗਾਵਨਾ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਿਹਰ ਕਰ ਕਿ) ਮੈਂ ਸਾਧ ਸੰਗਤ ਵਿਚ ਟਿਕ ਕੇ ਤੇਰੇ ਗੁਣ ਗਾਂਦਾ ਰਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧ ਸੰਗਿ = ਗੁਰੂ ਦੀ ਸੰਗਤ ਵਿਚ। ਗਾਉ = ਗਾਉਂ, ਮੈਂ ਗਾਂਦਾ ਰਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y asociándome con los Santos, canto Tu Alabanza."