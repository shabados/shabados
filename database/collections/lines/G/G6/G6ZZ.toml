[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਨੰਦ ਕਰਿ; ਸੰਤ ਹਰਿ ਜਪਿ ॥"
page = 895
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O saint, invoke thy God and make merry."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਧੂ! ਆਪਣੇ ਹਰੀ ਦਾ ਸਿਮਰਨ ਕਰ ਅਤੇ ਮੌਜਾਂ ਮਾਣ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate on the Lord, O Saints, and be in bliss."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਦੁਆਰਾ ਹਰੀ ਜਾਪ ਕੋ ਜਪ ਕੇ ਆਨੰਦ ਕਰਿ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਸ਼ਾਂਤੀ ਦੇ ਸੋਮੇ) ਸੰਤ-ਹਰੀ ਦਾ ਨਾਮ ਜਪਿਆ ਕਰ ਤੇ (ਇਸ ਤਰ੍ਹਾਂ) ਆਤਮਕ ਆਨੰਦ (ਸਦਾ) ਮਾਣ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤ ਹਰਿ ਜਪਿ = ਸੰਤ-ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਜਪਦਾ ਰਹੁ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Santo, contempla a tu Dios y vive en Éxtasis;"