data = "ਤਿਸ ਕੀ ਕੀਮਤਿ; ਕਿਨੈ ਨ ਹੋਈ ॥"
page = 160
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His worth none can appraise,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਮੁੱਲ ਕੋਈ ਨਹੀਂ ਪਾ ਸਕਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one can estimate His value,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੀ ਕੀਮਤਿ ਕਿਸੀ ਸੇ ਨਹੀਂ ਹੋਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰੇਕ ਜੀਵ (ਆਪਣੇ ਵਲੋਂ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ) ਆਖ ਆਖ ਕੇ (ਉਹਨਾਂ ਗੁਣਾਂ ਦਾ) ਵਰਣਨ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਨੈ = ਕਿਸੇ (ਜੀਵ) ਪਾਸੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nadie puede Asignarle un valor,"