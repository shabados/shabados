[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਹ ਸੰਭ੍ਰ ਸੁਭ ਦੇਵਲ ਸੁਭੰਤ ॥੧੭੫॥"
page = 568

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That foolish king called his servants and said, “Kill this Brahmin.” Those tyrants took him to the temple of the goddess.175."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਸੰਭਲ ('ਸੰਭ੍ਰ') ਦਾ ਦੇਵਾਲਾ ਸੁਸ਼ੋਭਿਤ ਸੀ ॥੧੭੫॥"