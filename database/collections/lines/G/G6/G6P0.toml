[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ; ਨਿਰਮਲ ਤੇ ਨਿਰਮਲਾ ॥"
page = 272
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God-awakened is the purest of the pure,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮ-ਬੇਤਾ ਪਵਿੱਤ੍ਰਾਂ ਦਾ ਪਰਮ ਪਵਿੱਤ੍ਰ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The God-conscious being is the purest of the pure;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ ਨਿਰਮਲ ਸੇ ਭੀ ਨਿਰਮਲ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮਗਿਆਨੀ ਮਨੁੱਖ (ਵਿਕਾਰਾਂ ਦੀ ਮੈਲ ਤੋਂ ਸਦਾ ਬਚਿਆ ਰਹਿ ਕੇ) ਮਹਾ ਨਿਰਮਲ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El hombre de Dios ha logrado la mayor pureza,"