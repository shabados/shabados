language = "pa"
data = "ਉਸ ਦੀ ਯਾਦ ਦੋਹਾਂ ਜਹਾਨਾਂ ਦੇ ਦਰਦਾਂ ਦੀ ਦਵਾਈ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਯਾਦਿ ਊ ਦਰਦਿ ਦੋ ਆਲਮ ਰਾ ਦਵਾ-ਸਤ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "The observed and reversed sides of every thing become absolutely clear and apparent. (25)"