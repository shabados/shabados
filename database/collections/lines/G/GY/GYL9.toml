[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਚੀਨਿ ਚਤੁਰ ਚਿਤਿ ਲੇਹੁ ॥੫੯੦॥"
page = 744

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Uttering primarily the words “Hasit-ari-dhanani” and then adding “Ripu Ari” the names of Tupak are formed, which O wise men! you may recognize.590."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਨਾਮ ਤੁਪਕ ਦਾ ਹੋ ਜਾਵੇਗਾ। ਚਤੁਰ ਵਿਅਕਤੀ ਮਨ ਵਿਚ ਵਿਚਾਰ ਕਰ ਲੈਣ ॥੫੯੦॥"