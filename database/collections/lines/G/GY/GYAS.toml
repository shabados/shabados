data = "ਜਬ ਤਕ ਬਨ ਮੇਂ ਸ਼ੇਰ ਰਹਿਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦ ਤਾਈਂ ਇਸ ਹਿਰਦੇ-ਰੂਪ ਜੰਗਲ ਵਿਚ ਅਹੰਕਾਰ-ਸ਼ੇਰ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿੰਘੁ = (ਅਹੰਕਾਰ) ਸ਼ੇਰ। ਬਨ = ਹਿਰਦਾ-ਰੂਪ ਜੰਗਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mientras el tigre del Ego ande por el bosque,"