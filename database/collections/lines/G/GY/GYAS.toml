data = "ਜਬ ਲਗੁ; ਸਿੰਘੁ ਰਹੈ ਬਨ ਮਾਹਿ ॥"
page = 1161
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As long as the tiger inhabits the forest,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਤਾਂਈ ਸ਼ੇਰ ਜੰਗਲ ਵਿੱਚ ਵਸਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As long as the tiger lives in the forest,"

[[content]]
assets = ["NKFT"]
type = "translation"
