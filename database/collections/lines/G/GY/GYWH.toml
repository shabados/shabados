[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਝ ਤੇ ਵਡਾ; ਨਾਹੀ ਕੋਇ ॥"
page = 354
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Than Thee, none is greater, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਨਾਲੋਂ ਵਿਸ਼ਾਲ ਕੋਈ ਨਹੀਂ ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no other as great as You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਸੇ ਬਡਾ ਕੋਈ ਹੈ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬੱਸ! ਇਹੀ ਸੋਚਾਂ ਸੋਚਦਾ ਰਹਿੰਦਾ ਹੈ; ਪਰ ਹੇ ਪ੍ਰਭੂ! ਤੈਥੋਂ ਕੋਈ ਵੱਡਾ ਨਹੀਂ (ਜਿਸ ਨੂੰ ਵਡਿਆਈ ਮਿਲਦੀ ਹੈ, ਤੈਥੋਂ ਹੀ ਮਿਲਦੀ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Como Tú no existe nadie más grandioso, oh Señor."