type = "primary"
data = "ਇਨ ਕੇ ਨਾਮ ਹੇਤ ਰਿਖਿ ਭਯੋ ॥"
page = 470

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“The Yadava clan has still not been destroyed and for their destruction, a sage has been born,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਲਈ) ਇਨ੍ਹਾਂ ਦੇ ਵਿਨਾਸ਼ ਲਈ ਇਕ ਰਿਸ਼ੀ ਪ੍ਰਗਟ ਹੋਇਆ ਹੈ।"