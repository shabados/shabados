[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਟਿ ਗਈ ਭੂਖ; ਮਹਾ ਬਿਕਰਾਲ ॥੨॥"
page = 389
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My most dreadful desire has ended."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਮਹਾਂ ਭਿਆਨਕ ਖਾਹਿਸ਼ ਨਾਸ ਹੋ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The most dreadful desires have been eliminated. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤ੍ਰਿਸਨਾ ਜੋ ਅਤਿ (ਬਿਕਰਾਲ) ਭ੍ਯਦਾਇਕ ਥੀ ਸੋ ਮਿਟ ਗਈ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੇ ਅੰਦਰੋਂ) ਬੜੀ ਡਰਾਉਣੀ (ਮਾਇਆ ਦੀ) ਭੁੱਖ ਦੂਰ ਹੋ ਗਈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਕਰਾਲ = ਡਰਾਉਣੀ, ਭਿਆਨਕ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así la salvaje añoranza dentro de mí se apaciguó. (2)"