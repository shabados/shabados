[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹਉ ਅਪਰਾਧੀ ਗੁਨਹਗਾਰ; ਹਉ ਬੇਮੁਖ ਮੰਦਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "I am a criminal, a sinner, evil and apostate."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਅਪਰਾਧੀ¹, ਕਸੂਰ ਕਰਣ ਵਾਲਾ², ਬੇਮੁਖ³ ਅਤੇ ਮੰਦਾ⁴ ਹਾਂ।"