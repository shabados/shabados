[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ, ਕਲਿ ਵਿਚਿ ਪਰਗਟੁ ਹੋਆ ॥੨੭॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Gurmukh (Guru Nanak) has emerged in this kaliyug, the dark age."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਲਿਜੁਗ ਵਿਖੇ ਸ੍ਰੋਮਣੀ ਗੁਰੂ ਪ੍ਰਗਟ ਹੋ ਪਿਆ।"