[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਤੁ ਮੋਹਿ; ਡੂਬਾ ਸੰਸਾਰੁ ॥"
page = 356
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In this worldly love, the world is drowned."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਸੰਸਾਰੀ ਮਮਤਾ ਅੰਦਰ ਜਗਤ ਡੁੱਬ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In this attachment, the world is drowning."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਮੋਹ ਕਰ ਕੇ ਸੰਸਾਰ ਡੂਬਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਮੋਹ ਵਿਚ ਸਾਰਾ ਜਗਤ ਡੁੱਬਾ ਪਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਤੁ = ਇਸ ਵਿਚ। ਮੋਹਿ = ਮੋਹ ਵਿਚ। ਏਤੁ ਮੋਹਿ = ਇਸ ਮੋਹ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mundo se ahoga en el mar del apego;"