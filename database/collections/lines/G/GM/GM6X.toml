[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਧਿਕ ਪ੍ਰੀਤਿ ਤਾ ਸੋ ਕਰੀ; ਭੇਦ ਪਛਾਨਾ ਨਾਹਿ ॥੧੧॥"
page = 853

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And without understanding the realty, love the wife even more.(11)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੀ ਪਤਨੀ ਨਾਲ ਜ਼ਿਆਦਾ ਪ੍ਰੀਤ ਕਰਨ ਲਗਾ, ਪਰ ਭੇਦ ਨੂੰ ਨਾ ਪਛਾਣਿਆ ॥੧੧॥"