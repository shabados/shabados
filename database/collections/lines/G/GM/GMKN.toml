[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜੀਉ; ਸਤਸੰਗਤਿ ਮੇਲਾਇ ॥"
page = 1130
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Reverend Lord, unite Thou me with the society of saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਪੂਜਯ ਪ੍ਰਭੂ! ਤੂੰ ਮੈਨੂੰ ਸਾਧ ਸੰਗਤ ਨਾਲ ਜੋੜ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Dear Lord, please let me join the Sat Sangat, the True Congregation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੁਰਸ਼! ਹਰਿ ਜੀਉ ਕੀ ਸਤਿਸੰਗਤਿ ਵਿਖੈ ਮਨ ਕੋ ਲਗਾਵਣਾ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਜੀ! (ਮੈਨੂੰ) ਸਾਧ ਸੰਗਤ ਦਾ ਮੇਲ ਮਿਲਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ ਜੀਉ = ਹੇ ਪ੍ਰਭੂ ਜੀ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, guíame hasta la Sociedad de los Santos,"