[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਤਾਗਾ; ਜਗੁ ਏਵੈ ਜਾਣਹੁ ॥"
page = 840
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As is the frail yarn, so know thou the world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਦੀ ਕੱਚੀ ਤੰਦ ਹੈ, ਤੂੰ ਸੰਸਾਰ ਨੂੰ ਏਸੇ ਤਰ੍ਹਾਂ ਦਾ ਹੀ ਸਮਝ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Know that the world is just like this thread."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਕੱਚਾ ਤਾਗਾ ਹੈ ਇਸੀ ਪ੍ਰਕਾਰ ਜਗਤ ਕੋ ਜਾਣੋ, ਭਾਵ ਕਚੇ ਤਾਗੇ ਵਤ ਛਿਨ ਭੰਗਰ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਗਤ (ਦੇ ਸੰਬੰਧ) ਨੂੰ ਇਉਂ ਹੀ ਸਮਝੋ ਜਿਵੇਂ ਕੱਚਾ ਧਾਗਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así de frágil es, así es el mundo,"