[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬੋਲਿ ਉਠਿਯੋ ਸਹਦੇਵ ਤਬੈ; ਬ੍ਰਿਜ ਨਾਇਕ ਲਾਇਕ ਯਾਹਿ ਚੜਇਯੈ ॥"
page = 533

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Sahdev said, “Only Krishna is the most suitable"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਸਹਿਦੇਵ ਬੋਲ ਪਿਆ ਕਿ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ (ਇਸ ਦੇ) ਯੋਗ ਹਨ, (ਇਸ ਲਈ ਤਿਲਕ) ਇਨ੍ਹਾਂ ਨੂੰ ਚੜ੍ਹਾ ਦਿਓ।"