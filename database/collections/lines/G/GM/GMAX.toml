[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਹੀ ਪ੍ਰਭੁ ਰਾਖਤਾ; ਭਗਤਨ ਕੀ ਆਨਿ ॥"
page = 817
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself saves the honour of His saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਖੁਦ ਹੀ ਆਪਣੇ ਸੰਤਾਂ ਦੀ ਇੱਜ਼ਤ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God Himself saves the honor of His devotees."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਭਗਤਾਂ ਕੀ (ਆਨਿ) ਪ੍ਰਤਗ੍ਯਾ ਵਾ ਵਡਿਆਈ ਵਾ ਇਜਤ ਆਪੇ ਹੀ ਪ੍ਰਭੂ ਰਾਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਆਪਣੇ ਭਗਤਾਂ ਦੀ ਇੱਜ਼ਤ ਪਰਮਾਤਮਾ ਆਪ ਹੀ ਬਚਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੇ = ਆਪ ਹੀ। ਆਨਿ = ਇੱਜ਼ਤ, ਲਾਜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Mismo salva el honor de Sus Devotos;"