[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਸੈ ਕਾਨਨੇਸੰ ਸੁਪਾਤ੍ਰੰ ਉਦਾਸੀ ॥"
page = 645

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He used to live in the forest, studying all Shastras, destroying evil actions as a worthy traveler on the path of detachment"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ ਸਦਾ) ਸੰਘਣੇ ਬਨ ਵਿਚ ਰਹਿੰਦਾ ਹੈ ਅਤੇ ਉਦਾਸੀ ਸੁਭਾ ਦਾ ਸੁਪਾਤਰ ਹੈ (ਅਧਿਕਾਰੀ ਹੈ)।"