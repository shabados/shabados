[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਇ ਚਲੇ; ਭਏ ਆਸ ਨਿਰਾਸਾ ॥"
page = 933
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He comes and losing all hope, departs hopeless in the end."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਉਂਦਾ ਹੈ ਅਤੇ ਸਾਰੀ ਉਮੈਦ ਲਾਹ ਕੇ ਅੰਤ ਨੂੰ ਨ-ਉਮੈਦ ਹੋ ਟੁਰ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He comes hopeful, and then goes, without hope."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਏ ਥੇ ਆਸਾ ਤੇ ਨਿਰਾਸ ਹੋਕਰਿ ਚਲਤੇ ਭਏ ਹੈਂ, ਭਾਵ ਜਗਤ ਕੋ ਮਿਥਿਆ ਜਾਨ ਕਰ ਆਸਾ ਨਹੀਂ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਦੁਨੀਆ ਤੋਂ ਕੋਈ ਖੱਟੀ ਖੱਟਣ ਤੋਂ ਬਿਨਾ ਹੀ ਤੁਰ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਸ ਨਿਰਾਸਾ = ਆਸਾਂ ਤੋਂ ਨਿਰਾਸ ਹੋ ਕੇ, ਕੋਈ ਖੱਟੀ ਖੱਟਣ ਤੋਂ ਬਿਨਾ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y uno va y viene y pierde toda esperanza."