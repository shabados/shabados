[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਫਲ ਦੇਹ ਨਾਨਕ; ਹਰਿ ਹਰਿ ਨਾਮ ਲਏ ॥੫॥"
page = 269
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Fruitful is the body, O Nanak which takes the Name of Lord God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਫਲਦਾਇਕ ਹੈ ਉਹ ਸਰੀਰ, ਹੇ ਨਾਨਕ! ਜੋ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦਾ ਨਾਮ ਲੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Fruitful is the body, O Nanak, which takes to the Lord's Name. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਨੋਂ ਨੇ ਹਰਿ ਹਰਿ ਨਾਮ (ਲਏ) ਉਚਾਰਨ ਕਰੇ ਹੈਂ ਤਿਨ ਕੀ ਸਰਬ ਅੰਗੋਂ ਸਹਿਤ ਦੇਹ ਸਫਲ ਭਈ ਹੈ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਸਰੀਰ ਸਫਲ ਹੈ ਜੋ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਜਪਦਾ ਹੈ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਹ = ਸਰੀਰ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Fructífero es el cuerpo, oh, dice Nanak,  que se entona en el Nombre del Señor . (5)"