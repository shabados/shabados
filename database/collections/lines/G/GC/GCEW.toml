data = "ਸਬੈ ਸੂਰ ਲੈ ਕੇ ਸਿਲਾ ਸਾਜ ਸੱਜਿਯੰ ॥੧॥"
page = 66

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then Hussian thundered striking his arms and prepared for attack with all his brave warriors.1."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਾਰਿਆਂ ਸੂਰਮਿਆਂ ਨੂੰ ਨਾਲ ਲੈ ਕੇ ਸ਼ਸਤ੍ਰ ਅਤੇ ਕਵਚ ਸਜਾ ਲਏ ॥੧॥"