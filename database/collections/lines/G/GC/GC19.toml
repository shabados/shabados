[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹੂੰ ਦੇਵ ਬਿਦ︀ਯਾ ਕਹੂੰ ਦੈਤ ਬਾਨੀ ॥"
page = 28

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere Thou art the learning of gods and somewhere Thou art the speech of demons!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ (ਤੁਸੀਂ) ਦੇਵਤਿਆਂ ਦੀ ਵਿਦਿਆ ਹੋ ਅਤੇ ਕਿਤੇ ਦੈਂਤਾਂ ਦੇ ਬੋਲ ਹੋ।"