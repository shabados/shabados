[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਾਖ ਕਰੋਰੀ; ਬੰਧੁ ਨ ਪਰੈ ॥"
page = 264
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Though man be entangles in lacs and millions of bonds,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਵੇਂ ਆਦਮੀ ਲੱਖਾਂ ਤੇ ਕ੍ਰੋੜਾਂ ਜੂੜਾਂ ਅੰਦਰ ਜਕੜਿਆ ਹੋਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Acquiring hundreds of thousands and millions, your desires shall not be contained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਦਪਿ ਲਾਖੋਂ ਕਰੋੜੋਂ ਬੰਧਨੋਂ ਮੇਂ ਜੀਵ ਪੜਾ ਹੋਵੈ, ਵਾ ਜਿਸ ਲਾਖੋਂ ਕਰੋੜੋਂ ਮਾਯਾ ਕੇ ਖਜਾਨੇ ਇਕਤ੍ਰ ਕਰਨੇ ਸੇ ਭੀ ਤ੍ਰਿਸਨਾ ਰੂਪੀ ਨਦੀ ਕਾ ਬੰਧਨ ਹੀ ਪੜਤਾ ਹੈ, ਭਾਵ ਸੇ ਰੁਕਤੀ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਲੱਖਾਂ ਕਰੋੜਾਂ (ਰੁਪਏ) ਕਮਾ ਕੇ ਭੀ (ਮਾਇਆ ਦੀ ਤ੍ਰਿਹ ਵਿਚ) ਰੋਕ ਨਹੀਂ ਪੈਂਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਾਖ ਕਰੋਰੀ = ਲੱਖਾਂ ਕਰੋੜਾਂ (ਰੁਪਇਆਂ) ਨਾਲ, ਲੱਖਾਂ ਕਰੋੜਾਂ ਰੁਪਏ ਕਮਾ ਕੇ ਭੀ। ਬੰਧੁ = ਰੋਕ, ਥੰਮ੍ਹ। ਨ ਪਰੈ = ਨਹੀਂ ਪੈਂਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Honores y riquezas nunca complacen a la mente,"