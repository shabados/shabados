[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਜਉ ਸਾਧਸੰਗੁ ਪਾਇਆ ॥"
page = 913
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, when I found the saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਜਦ ਮੈਨੂੰ ਸਤਿਸੰਗ ਪ੍ਰਾਪਤ ਹੋ ਗਈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, when I found the Saadh Sangat, the Company of the Holy,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਜਬ ਸਾਧ ਸੰਗਤ ਕੋ (ਪਾਇਆ) ਪ੍ਰਾਪਤਿ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਜਦੋਂ (ਕਿਸੇ ਮਨੁੱਖ ਨੇ) ਸਾਧ ਸੰਗਤ ਪ੍ਰਾਪਤ ਕਰ ਲਈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਉ = ਜਦੋਂ। ਸਾਧ ਸੰਗੁ = ਗੁਰਮੁਖਾਂ ਦਾ ਮੇਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, cuando encontré a la Saad Sangat,"