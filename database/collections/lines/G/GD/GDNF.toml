[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੁ ਨਿਰੰਕਾਰੁ; ਜਾ ਕੈ ਨਾਮ ਅਧਾਰ ॥"
page = 863
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They have the support of the Name of the One Formless Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਨੂੰ ਇਕ ਸਰੂਪ-ਰਹਿਤ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਹੀ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They have the Support of the Name of the One Formless Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੇ ਮਨ ਮੇਂ ਏਕ ਪਰਮੇਸ੍ਵਰ ਕਾ ਨਾਮੁ ਕਾ ਹੀ ਆਸਰਾ ਹੈ॥☬ਪ੍ਰਸਨ: ਵਹੁ ਕੌਨ ਪਰਮੇਸ੍ਵਰ ਹੈ?☬ਉਤ੍ਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਦੇ ਹਿਰਦੇ ਵਿਚ (ਹਰ ਵੇਲੇ) ਕੇਵਲ ਪਰਮਾਤਮਾ ਹੀ ਵੱਸਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰੰਕਾਰੁ = ਆਕਾਰ-ਰਹਿਤ ਪ੍ਰਭੂ। ਜਾ ਕੈ = ਜਿਨ੍ਹਾਂ ਦੇ ਹਿਰਦੇ ਵਿਚ। ਨਾਮ ਅਧਾਰ = ਨਾਮ ਦਾ ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues se apoyan sólo en el Nombre Absoluto."