[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਜੁਲੀ ਚਮਕੈ; ਹੋਇ ਅਨੰਦੁ ॥"
page = 1162
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The lightning flashes and bliss reigns in the place,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਥਾਂ ਤੇ ਦਾਮਨੀ ਲਿਸ਼ਕਦੀ ਹੈ ਅਤੇ ਖੁਸ਼ੀ ਹੁੰਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Lightning blazes, and bliss prevails there,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਹਾਂ ਬਿਜਲੀ ਕੇ ਸਮਾਨ ਜੋਤਿ ਚਮਕਤੀ ਹੈ ਤਿਸ ਕਰ ਕੇ ਜੋਗੀ ਕੋ ਆਨੰਦ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਅੰਦਰ, ਮਾਨੋ, ਬਿਜਲੀ ਚਮਕ ਪੈਂਦੀ ਹੈ, ਉੱਥੇ ਸਦਾ ਖਿੜਾਉ ਹੀ ਖਿੜਾਉ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, ahí donde habita mi siempre Joven Señor,"