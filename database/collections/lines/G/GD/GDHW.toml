[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਸੰਤੁ ਮਹਲਾ ੧ ਇਕ ਤੁਕੀਆ ॥"
page = 1189
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Basant 1st Guru. Ik-tukia."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਸੰਤੁ ਪਹਿਲੀ ਪਾਤਿਸ਼ਾਹੀ। ਇਕਤੁਕੀਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Basant, First Mehl, Ik-Tukee:"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Basant Mejl Guru Nanak, Primer Canal Divino, Ik-Tukas."

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਕ ਤੁਕੀਆ = ਉਹ ਅਸਟਪਦੀਆਂ ਜਿਨ੍ਹਾਂ ਦੇ ਹਰੇਕ ਬੰਦ ਵਿਚ ਇਕ ਇਕ ਤੁਕ ਹੈ।"