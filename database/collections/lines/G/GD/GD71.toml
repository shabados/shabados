[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਨਾਮ; ਜਪਿ ਹਿਰਦੇ ਮਾਹਿ ॥"
page = 283
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In thy mind dwell thou on Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੇ ਮਨ ਵਿੱਚ ਸਾਹਿਬ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Dwell upon the Lord's Name in your heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹਿਰਦੇ ਬੀਚ ਰਾਮ ਨਾਮ ਕੋ ਜਪ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਿਰਦੇ ਵਿਚ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਜਪ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Guarda el Naam, el Nombre del Señor como Tesoro en tu corazón"