[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਦਇਆ ਮਿਲਾਵਹੁ; ਤਿਸਹਿ ਮੋਹਿ ॥੧॥"
page = 1181
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "my Guru take thou pity on me and lead me on to Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਗੁਰਦੇਵ ਤੂੰ ਮੇਰੇ ਤੇ ਤਰਸ ਕਰ ਅਤੇ ਮੈਨੂੰ ਉਸ ਨਾਲ ਮਿਲਾ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please, take pity on me, and lead me on to meet Him. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦ੍ਯਾ ਕਰ ਕੇ ਤਿਸ ਸ੍ਵਰੂਪ ਮੇਂ ਮੇਰੇ ਕੋ ਮਿਲਾਵਹੁ, ਭਾਵ ਅਭੇਦ ਕਰ ਲੀਜੀਏ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਿਹਰ ਕਰ ਕੇ ਮੈਨੂੰ ਉਸ ਪ੍ਰਭੂ ਨਾਲ ਮਿਲਾ ਦੇ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਿ = ਮੈਨੂੰ। ਕਰਿ = ਕਰ ਕੇ। ਜਿਸਹਿ = {ਕ੍ਰਿਆ ਵਿਸ਼ੇਸ਼ਣ 'ਹੀ' ਦੇ ਕਾਰਨ ਲਫ਼ਜ਼ 'ਜਿਸੁ' 'ਤਿਸੁ' ਦਾ (ੁ) ਉਡ ਗਿਆ ਹੈ} ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "tómame en Tu Compasión y guíame hasta Él. (1)"