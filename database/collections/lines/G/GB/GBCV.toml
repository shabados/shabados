[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਚਿੰਤ ਹਮਾਰੇ. ਬਿਨਸੇ ਬੈਰ ॥"
page = 1157
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Effortlessly am I rid of the animosities."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਿਰਯਤਨ ਹੀ ਮੈਂ ਦੁਸ਼ਮਨੀਆਂ ਤੋਂ ਛੁਟਕਾਰਾ ਪਾ ਗਿਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Spontaneously, I am rid of hatred."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰੇ ਅਚਾਨਕ ਹੀ ਬੈਰ ਬਿਨਸ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਚਿੰਤਾ ਦੂਰ ਕਰਨ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪ ਕੇ (ਮੇਰੇ ਅੰਦਰੋਂ ਸਾਰੇ) ਵੈਰ-ਵਿਰੋਧ ਨਾਸ ਹੋ ਗਏ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੈਰ = ਵੈਰ-ਵਿਰੋਧ {ਬਹੁ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De forma espontánea soy liberado de todas mis envidias y celos."