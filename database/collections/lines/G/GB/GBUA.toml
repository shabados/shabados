[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਭੇਦੁ; ਵਿਰਲਾ ਕੋ ਲਹੈ ॥੧॥ ਰਹਾਉ ॥"
page = 1139
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rare is the one, who finds this mystery, by the Guru's grace. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਇੱਕ ਅੱਧਾ ਹੀ ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਇਸ ਭੇਤ ਨੂੰ ਪਾਉਂਦਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But rare is that person, who, as Gurmukh, understands this mystery. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਇਸ ਭੇਦ ਕੋ ਕੋਈ ਵਿਰਲਾ ਹੀ ਗੁਰਮੁਖਿ ਲਖਦਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਕੋਈ ਵਿਰਲਾ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਇਸ ਡੂੰਘੀ ਗੱਲ ਨੂੰ ਸਮਝਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੋ ਕੇ। ਲਹੈ = ਲੱਭਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por la Gracia del Guru. (1-Pausa)"