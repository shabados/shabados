[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਜਾਨਾ; ਬੈਕੁੰਠ ਕਹਾ ਹੀ ॥"
page = 325
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I know not where Lord's abode is."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਨਹੀਂ ਜਾਣਦਾ ਕਿ ਸੁਆਮੀ ਦਾ ਭਵਨ ਕਿੱਥੇ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I do not know where heaven is."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਨਹੀਂ ਜਾਨਤਾ ਬੈਕੁੰਠ ਕਹਾਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਤਾਂ ਪਤਾ ਨਹੀਂ, ਉਹ ਬੈਕੁੰਠ ਕਿੱਥੇ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾ ਜਾਨਾ = ਮੈਂ ਨਹੀਂ ਜਾਣਦਾ, ਮੈਨੂੰ ਪਤਾ ਨਹੀਂ। ਕਹਾ ਹੀ = ਕਿਥੇ ਹੈ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ellos no saben, ni siquiera, en donde habita el Señor;"