[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਨ੍ਰਹ ਕੋ ਰੂਪ ਨਿਹਾਰ ਰਹੀ ਤ੍ਰਿਯਾ ਸ︀ਯਾਮ ਕਹੈ ਕਬਿ ਹੋਇ ਇਕਾਠੀ ॥"
page = 339

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Gathering together to women are looking at the form of Krishna and"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ਿਆਮ ਕਵੀ ਕਹਿੰਦੇ ਹਨ, ਸਾਰੀਆਂ ਇਸਤਰੀਆਂ ਇਕੱਠੀਆਂ ਹੋ ਕੇ ਕਾਨ੍ਹ ਦੇ ਰੂਪ ਨੂੰ ਵੇਖ ਰਹੀਆਂ ਹਨ।"