[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਵਣੁ ਆਇਆ ਹੇ ਸਖੀ; ਕੰਤੈ ਚਿਤਿ ਕਰੇਹੁ ॥"
page = 1280
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The month of Swan has come, O my mate. Now think thou of thy Groom."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਉਣ ਦਾ ਮਹੀਨਾ ਆ ਗਿਆ ਹੈ, ਹੇ ਮੇਰੀਏ ਸਹੇਲੀਏ! ਹੁਣ ਤੂੰ ਆਪਣੇ ਭਰਤੇ ਦਾ ਖਿਆਲ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The month of Saawan has come, O my companions; think of your Husband Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜਗਿਆਸੂ ਰੂਪ ਸਖੀਓ! ਮਾਨੁਖਾ ਜਨਮ ਰੂਪ ਸਾਵਨ ਆਇਆ ਹੈ, ਕੰਤ ਪਰਮੇਸਰ ਕੋ ਚਿਤ ਮੇਂ ਧਾਰਨ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਖੀ! ਸਾਵਣ (ਦਾ ਮਹੀਨਾ) ਆਇਆ ਹੈ (ਭਾਵ, ਗੁਰੂ ਵਲੋਂ ਨਾਮ-ਅੰਮ੍ਰਿਤ ਦੀ ਵਰਖਾ ਹੋ ਰਹੀ ਹੈ) ਖਸਮ (-ਪ੍ਰਭੂ) ਨੂੰ ਹਿਰਦੇ ਵਿਚ ਪ੍ਰੋ ਲਉ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਿਤਿ = ਚਿੱਤ ਵਿਚ। ਕੰਤੈ = ਖਸਮ ਪ੍ਰਭੂ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mes de Sawan ha llegado. Oh, compañeros piensen en Su Señor Esposo."