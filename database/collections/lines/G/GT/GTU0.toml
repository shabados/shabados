[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਙਿਆਨੀ ਰਹਤ; ਆਗਿਆ ਦ੍ਰਿੜੁ ਜਾ ਕੈ ॥"
page = 251
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is the Divine, who remains firmly committed to obey Lord's fiat."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਵਾਹਿਗੁਰੂ ਦਾ ਵੀਚਾਰਵਾਨ ਹੈ, ਜੋ ਪ੍ਰਭੂ ਦਾ ਹੁਕਮ ਮੰਨਣ ਵਿੱਚ ਤਤਪਰ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They alone are spiritually wise, who remain firmly committed to the Lord's Command."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗ੍ਯਾਨੀ ਸੋਈ ਹੈ ਜਿਸ ਕੇ ਮਨ ਅੰਤ੍ਰ ਪਰਮੇਸ੍ਵਰ ਕੀ ਆਗ੍ਯਾ (ਦ੍ਰਿੜੁ) ਨਿਸਚੈ ਹੋਈ ਰਹਿਤੀ ਹੈ, ਭਾਵ ਸੇ ਪਰਮੇਸ੍ਵਰ ਕੇ ਹੁਕਮ ਕੋ ਪ੍ਰਸੰਨ ਹੋ ਕਰ ਮਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪਰਮਾਤਮਾ ਦੀ ਰਜ਼ਾ ਪੱਕੀ ਟਿਕੀ ਰਹੇ, ਉਹੀ ਅਸਲ ਗਿਆਨੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਗਿਆ = ਰਜ਼ਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Sabio es el que habita en la Voluntad del Señor"