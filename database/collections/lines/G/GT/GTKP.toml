data = "ਅਧਿਕ ਟੂਕਰੋ ਚਲੈ ਹਮਾਰੋ ॥੯॥"
page = 850

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She wanted Raja to eradicate her so that she could live happily.(9)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤਾਂ ਜੋ) ਚੰਗੀ ਤਰ੍ਹਾਂ ਸਾਡਾ ਅੰਨ ਪਾਣੀ ਚਲਦਾ ਰਹੇ ॥੯॥"