[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧੰਨਿ ਧੰਨਿ ਸੰਜੋਗੁ ਸਭਾਗਾ ॥"
page = 898
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "blest, blest is that fortunate conjecture."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਲੱਖਣਾ, ਸੁਲੱਖਣਾ ਹੈ ਉਹ ਭਾਗਾਂ ਵਾਲਾ ਅਵਸਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Blessed, blessed is this fortunate time of union."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਰ ਮੈਂ ਧੰਨ੍ਯਤਾ ਜੋਗ ਸਭਾਗਾ ਹੂਆ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੰਜੋਗ ਮੁਬਾਰਿਕ ਸੀ, ਮੁਬਾਰਿਕ ਸੀ, ਭਾਗਾਂ ਵਾਲਾ ਸੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧੰਨਿ = ਮੁਬਾਰਿਕ। ਸੰਜੋਗੁ = ਮਿਲਾਪ ਦਾ ਅਵਸਰ। ਸਭਾਗਾ = ਭਾਗਾਂ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mi Estado de Unión con el Guru es Bendito, en verdad."