[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨਵੰਤ; ਨਾਮ ਕੇ ਵਣਜਾਰੇ ॥"
page = 1219
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wealthy are the dealers of the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੌਲਤਮੰਦ ਹਨ, ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੇ ਵਪਾਰੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who deal in the Naam, the Name of the Lord, are wealthy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਮ ਕੇ ਵਣਜਾਰੇ ਸੰਤ ਜਨ ਨਾਮ ਧਨ ਕਰ ਧਨਾਢ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਸਲ ਧਨਾਢ ਮਨੁੱਖ ਉਹ ਹਨ ਜਿਹੜੇ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਵਣਜ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਨਵੰਤ = ਧਨਾਢ, ਅਮੀਰ। ਵਣਜਾਰੇ = ਵਣਜ ਕਰਨ ਵਾਲੇ, ਵਪਾਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ricos son sólo aquéllos que comercian con el Nombre del Señor. P"