[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਬਿਨੁ; ਦੂਸਰ ਹੋਆ ਨ ਹੋਗੁ ॥"
page = 283
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Neither there has been, nor there shall be any but Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਬਾਝੋਂ ਹੋਰ ਦੂਜਾ ਨਾਂ ਕੋਈ ਹੈਸੀ ਤੇ ਨਾਂ ਹੀ ਹੋਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Other than Him, there has never been any other, and there shall never be."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸੇ ਬਿਨਾਂ ਔਰ ਕੋਈ ਦੂਸਰਾ ਨ ਪੀਛੇ ਹੂਆ ਹੈ ਔਰ ਨਾ ਆਗੇ ਹੋਇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਤੋਂ ਬਿਨਾ ਕੋਈ ਦੂਜਾ ਨਾਹ ਹੈ ਤੇ ਨਾਹ ਹੋਵੇਗਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੋਗੁ = ਹੋਵੇਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nada existe ni existirá jamás ajeno a Él."