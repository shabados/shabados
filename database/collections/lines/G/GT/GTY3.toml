[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਆ ਮੁੰਡੀਆ ਸਿਰਿ; ਚਢਿਬੋ ਕਾਲ ॥੧॥"
page = 871
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "On this lad's head, death has alighted."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਮੁੰਡੇ ਦੇ ਸਿਰ ਉਤੇ ਮੌਤ ਸਵਾਰ ਹੋਈ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Death has entered this shaven head. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਮੁੰਡੀਏ ਕੇ ਸਿਰ ਪੈ ਕਾਲ ਚੜ ਰਹਿਆ ਹੈ, ਭਾਵ ਅਬ ਇਹ ਮਰੇਗਾ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਤਾ ਨਹੀਂ ਇਸ ਸਾਧੂ ਦਾ ਕੀਹ ਬਣੇਗਾ), ਇਸ ਸਾਧੂ ਦੇ ਸਿਰ ਮੌਤ ਸਵਾਰ ਹੋਈ ਜਾਪਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਆ ਮੁੰਡੀਆ ਸਿਰਿ = (ਮੇਰੇ) ਇਸ (ਖਸਮ) ਸਾਧੂ ਦੇ ਸਿਰ ਉੱਤੇ। ਚਢਿਬੋ = ਚੜ੍ਹਿਆ ਹੋਇਆ ਹੈ, ਸਵਾਰ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, este muchacho tejedor está invitando a la muerte dentro de su casa (1)"