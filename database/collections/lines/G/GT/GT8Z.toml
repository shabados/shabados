[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚ ਸਬਦ ਬਿਨੁ; ਪਤਿ. ਨਹੀ ਪਾਵੈ ॥"
page = 941
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the True Name, one obtains not honour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਨਾਮ ਦੇ ਬਾਝੋਂ ਬੰਦੇ ਨੂੰ ਇੱਜ਼ਤ ਆਬਰੂ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the True Word of the Shabad, no one receives honor."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚੇ ਉਪਦੇਸ ਬਿਨਾਂ (ਪਤਿ) ਪਰਤਿਸਟਾ ਨਹੀਂ ਪਾਵਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਸ਼ਬਦ ਤੋਂ ਬਿਨਾ ਕੋਈ ਮਨੁੱਖ ਇਜ਼ਤ ਹਾਸਲ ਨਹੀਂ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cierto es, sin la Palabra Verdadera, uno no logra tener Honor."