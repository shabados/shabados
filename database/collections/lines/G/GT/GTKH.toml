[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕਉ ਬਿਘਨੁ; ਨ ਲਾਗੈ ਕੋਇ ॥"
page = 288
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "No harm befalls him,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕੋਈ ਨੁਕਸਾਨ ਨਹੀਂ ਪਹੁੰਚਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No obstacle stands in the way of one"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੌ ਕੋਈ ਵਿਘਨ ਨਹੀਂ ਲਾਗਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਨੁੱਖ ਨੂੰ ਕੋਈ ਔਕੜ ਨਹੀਂ ਪੋਂਹਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕਉ = ਉਸ ਨੂੰ। ਬਿਘਨੁ = ਰੁਕਾਵਟ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ningún daño ha de tocar al hombre"