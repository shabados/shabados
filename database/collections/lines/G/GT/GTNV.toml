[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਚਿੰਤ ਹਮਾਰੈ. ਕਾਰਜ ਪੂਰੇ ॥"
page = 1157
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Mine tasks are spontaneously accomplished."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਕੰਮ ਕਾਜ ਆਪਣੇ ਆਪ ਹੀ ਸੰਪੂਰਨ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Spontaneously, my works are perfectly accomplished."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਚਿੰਤ ਹੀ ਹਮਾਰੇ ਕਾਰਜ ਸਿਧ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਚਿੰਤਾ ਦੂਰ ਕਰਨ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦੀ ਬਰਕਤਿ ਨਾਲ ਮੇਰੇ ਸਾਰੇ ਕੰਮ ਸਫਲ ਹੋ ਰਹੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰੇ = ਸਫਲ ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De forma espontánea todas mis tareas son realizadas."