data = "ਸੁਨਿ ਰਘੁਰਾਈ ॥੮੧੧॥"
page = 285

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O the king of Raghu clan! she has come to the forest and given birth to us and we are two brothers.”811."

