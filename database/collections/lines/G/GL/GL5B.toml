[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਲ ਥਲ ਮਾਹੇ; ਆਪਹਿ ਆਪ ॥"
page = 343
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In sea and land, the Lord is all by Himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਮੁੰਦਰ ਅਤੇ ਧਰਤੀ ਵਿੱਚ ਪ੍ਰਭੂ ਸਾਰਾ ਕੁਛ ਖੁਦ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "On land and sea, He Himself is in Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਲੋਂ ਮੇਂ ਔਰ ਥਲੋਂ ਮੇਂ ਆਪਨਾ ਆਪ ਹੀ ਬਿਆਪਕ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਪਰਮਾਤਮਾ ਜਲ ਵਿਚ, ਧਰਤੀ ਉੱਤੇ (ਹਰ ਥਾਂ) ਆਪ ਹੀ ਆਪ ਵਿਆਪਕ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਹੇ = ਵਿਚ। ਆਪਹਿ ਆਪ = ਆਪ ਹੀ ਆਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Entonces tú te vuelves Él, el Señor,"