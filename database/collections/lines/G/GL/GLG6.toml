[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮ ਬਿਹੂਨ; ਜੀਵਨ ਕਉਨ ਕਾਮ ॥੧॥ ਰਹਾਉ ॥"
page = 188
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Name of what avail id the life. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੇ ਬਗੈਰ ਜਿੰਦਗੀ ਕਿਹੜੇ ਕੰਮ ਦੀ ਹੈ? ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Naam, of what use are their lives? ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਨਾਮ ਜਪਨੇ ਕੇ ਬਿਨਾਂ ਜੀਵਨਾ ਕਿਸ ਕਾਮ ਹੈ, ਅਰਥਾਤ ਨਿਸਫਲ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਤੋਂ ਵਾਂਜੇ ਰਿਹਾਂ ਮਨੁੱਖਾ ਜੀਵਨ ਕਿਸੇ ਭੀ ਕੰਮ ਨਹੀਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਹੂਨ = ਸੱਖਣੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque privados del Naam, el Nombre del Señor, ¿de qué les sirve la vida?  (1-Pausa)"