[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਅਮਰੈ; ਕੈਸੇ ਰਾਜ ਮੰਡਿਤ ॥"
page = 1140
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without rule, what is the glory of the empire?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਕੂਮਤ ਦੇ ਬਾਝੋਂ, ਪਾਤਿਸ਼ਾਹੀ ਦੀ ਕਾਹਦੀ ਸ਼ੋਭਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without power, what is the glory of an empire?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੁਕਮ ਸੇ ਬਿਨਾਂ ਰਾਜ ਕਰ ਕੇ ਰਾਜਾ ਕੈਸੇ ਭੂਖਤ ਹੋ ਸਕਤਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਰਾਜਿਆਂ ਦੇ) ਹੁਕਮ ਤੋਂ ਬਿਨਾ ਰਾਜ ਦੀਆਂ ਸਜਾਵਟਾਂ ਕਿਸੇ ਕੰਮ ਨਹੀਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਮਰ = ਹੁਕਮ। ਰਾਜ ਮੰਡਿਤ = ਰਾਜ ਦੀ ਸਜਾਵਟ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿quién podría regir si Su Comando nadie lo recibiera?"