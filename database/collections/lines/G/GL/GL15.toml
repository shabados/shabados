[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭੁ ਕਾਜੁ ਹਮਾਰਾ ਹੋਇਆ ॥"
page = 627
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and all my affairs have been resolved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੇਰੇ ਸਾਰੇ ਕਾਰਜ ਸੌਰ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All my affairs are resolved."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਸੇ ਸਭ ਕਾਮ ਹਮਾਰਾ ਪੂਰਨ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਅਸਾਂ ਜੀਵਾਂ ਦਾ ਸਾਰਾ ਜੀਵਨ-ਮਨੋਰਥ ਸਫਲ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭੁ = ਸਾਰਾ। ਕਾਜੁ = ਜੀਵਨ-ਮਨੋਰਥ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en mi mente y estoy en verdad Feliz."