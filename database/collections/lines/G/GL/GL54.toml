[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜੀਉ. ਆਪਣੀ ਕ੍ਰਿਪਾ ਕਰੇ; ਤਾ ਲਾਗੈ ਨਾਮ ਪਿਆਰੁ ॥"
page = 34
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If Sire God shows His mercy then does man come to profess love for the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਵਾਹਿਗੁਰੂ ਮਹਾਰਾਜ ਆਪਣੀ ਦਇਆ ਧਾਰੇ ਤਦ ਆਦਮੀ ਦੀ ਪ੍ਰੀਤ ਨਾਮ ਨਾਲ ਲੱਗ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Dear Lord Himself grants His Grace, they are inspired to love the Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਵਾਹਿਗੁਰੂ ਅਪਨੀ ਕ੍ਰਿਪਾ ਕਰੇ, ਤਬ ਨਾਮ ਮੇਂ ਪਿਆਰ ਲਗਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਪਰਮਾਤਮਾ ਆਪ ਆਪਣੀ ਮਿਹਰ ਕਰੇ, ਤਦੋਂ ਹੀ ਜੀਵ ਦਾ ਉਸ ਦੇ ਨਾਮ ਨਾਲ ਪਿਆਰ ਬਣਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si a uno el Señor lo bendice con Su Misericordia, se enamora del Naam, el Nombre del Señor."