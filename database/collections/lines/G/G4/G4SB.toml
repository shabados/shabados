[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਤਾਣ ਆਪ ਹਉਮੈ ਦੇ ਪਰਦੇ ਹੇਠ ਹੈਣ, ਚੰਨ ਵਰਗਾ ਸੋਹਣਾ ਭਲਾ ਕੀ ਕਰੇ #"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਤੂ ਦਰ ਹਿਜਾਬਿ ਖ਼ੁਦੀ ਯਾਰ ਮਹਿ ਲਕਾ ਕਿ ਕੁਨਦ ॥੨੦॥੨॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And it is hanging near your ruby red lips. It is so sensuous and relishable. (34) (4)"