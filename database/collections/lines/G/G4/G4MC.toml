[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਲਿਜੁਗ, ਜੋ ਫੇੜੇ ਸੋ ਪਾਵੈ ॥੧੩॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "But in the kaliyug only he suffers who commits evil deed."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਲਿਜੁਗ ਵਿਖੇ ਜੋ ਕਰਮ ਕਰੂ ਸੋਈ ਪਾਊ।"