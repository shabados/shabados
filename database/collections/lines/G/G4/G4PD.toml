[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬ੍ਰਹਮੈ ਗਰਬੁ ਕੀਆ; ਨਹੀ ਜਾਨਿਆ ॥"
page = 224
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Brahma indulged in ego, and he understood not the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਿਮਾ ਨੇ ਹੰਕਾਰ ਕੀਤਾ ਅਤੇ ਉਸ ਨੇ ਪਾਰਬ੍ਰਹਿਮ ਨੂੰ ਨਾਂ ਸਮਝਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Brahma acted in pride, and did not understand."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੇਖੋ ਬ੍ਰਹਮੇ ਨੇ ਹੰਕਾਰ ਕੀਆ ਔਰ ਅਪਨੇ ਉਤਪਤਿ ਕਰਤਾ ਪਰਮੇਸ੍ਵਰ ਕੋ ਨਹੀਂ ਜਾਨਤਾ ਭਯਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮਾ ਨੇ ਅਹੰਕਾਰ ਕੀਤਾ (ਕਿ ਮੈਂ ਇਤਨਾ ਵੱਡਾ ਹਾਂ, ਮੈਂ ਕਵਲ ਦੀ ਨਾਭੀ ਵਿਚੋਂ ਕਿਵੇਂ ਜੰਮ ਸਕਦਾ ਹਾਂ?) ਉਸ ਨੇ ਪਰਮਾਤਮਾ ਦੀ ਬੇਅੰਤਤਾ ਨੂੰ ਨਹੀਂ ਸਮਝਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬ੍ਰਹਮੈ = ਬ੍ਰਹਮਾ ਨੇ। ਗਰਬੁ = ਅਹੰਕਾਰ {ਬ੍ਰਹਮਾ ਨੇ ਅਹੰਕਾਰ ਕੀਤਾ ਕਿ ਮੈਂ ਕਵਲ ਦੀ ਨਾਭ ਵਿਚੋਂ ਨਹੀਂ ਜੰਮਿਆ, ਮੈਂ ਆਪਣੇ ਆਪ ਤੋਂ ਹੀ ਪੈਦਾ ਹੋਇਆ ਹਾਂ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando Brahma se dejo llevar por su ego,"