[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੰਤ੍ਰ ਭਲੀ ਬਿਧਿ ਸਧੇ; ਜੰਤ੍ਰ ਬਹੁ ਬਿਧਿ ਲਿਖਿ ਡਾਰੇ ॥"
page = 698

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He performed practices of several kinds of Tantras and Yantras"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਚੰਗੀ ਤਰ੍ਹਾਂ ਤੰਤ੍ਰਾਂ ਨੂੰ ਸਾਧਿਆ ਅਤੇ ਬਹੁਤ ਤਰ੍ਹਾਂ ਦੇ ਜੰਤ੍ਰ ਲਿਖ ਦਿੱਤੇ।"