data = "ਜਰਿ ਬਰਿ ਭਸਮ ਸੁ ਨਰ ਹੋ ਜਾਵੈ ॥੨॥"
page = 1013

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Any body, on whose head he placed his hand, he would be reduced to ashes.(2)"

