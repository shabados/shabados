[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ. ਦੇਹੈ ਦੁਖੁ ਲਾਈਐ; ਪਾਪ ਗਰਹ ਦੁਇ ਰਾਹੁ ॥"
page = 142
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Were I to infest my body with pain by means of two sinful stars, Rahu and Ketu;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਮੈਂ ਆਪਣੇ ਸਰੀਰ ਨੂੰ ਦੋ ਪਾਪੀ ਤਾਰਿਆਂ ਰਾਹੂ ਤੇ ਕੇਤੂ ਦੇ ਜ਼ਰੀਏ ਦਰਦ ਚਮੋੜ ਲਵਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If my body were afflicted with pain, under the evil influence of unlucky stars;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਕਰ ਕਿਸੀ ਦੁਸ਼ਮਨ ਕੀ ਦੇਹ ਕੋ ਦੁਖ ਲਗਾਇਆ ਚਾਹੀਏ, ਤੌ ਪਾਪ ਰੂਪ ਜੋ ਦੋ ਗ੍ਰਹ ਹੈਂ ਰਾਹੁ ਅਰ ਕੇਤੁ ਸੋ ਉਸ ਨੂੰ ਲਗਾ ਦੇਈਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ (ਮੇਰੇ) ਸਰੀਰ ਨੂੰ ਦੁੱਖ ਲੱਗ ਜਾਏ, ਦੋਵੇਂ ਮਨਹੂਸ ਤਾਰੇ ਰਾਹੂ ਤੇ ਕੇਤੂ (ਮੇਰੇ ਲਾਗੂ ਹੋ ਜਾਣ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਹੈ = ਸਰੀਰ ਨੂੰ। ਰਾਹੁ = ਰਾਹੂ। ਦੁਇ = ਦੋਵੇਂ ਰਾਹੂ ਤੇ ਕੇਤੂ। ਪਾਪ ਗਰਹ = ਪਾਪਾਂ ਦੇ ਗ੍ਰਹ, ਮਨਹੂਸ ਤਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si mi cuerpo se retorciera de dolor bajo el impacto de estrellas maléficas,"