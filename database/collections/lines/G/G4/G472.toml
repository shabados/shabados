[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਖੀ ਸਹੇਲੀ ਕਉ ਸਮਝਾਵੈ ॥"
page = 737
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "One mate instructs her other mate that"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਸੱਜਣੀ ਆਪਣੀ ਸਹੇਲੀ ਨੂੰ ਸਿਖ-ਮਤ ਦਿੰਦੀ ਹੈ, ਕਿ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One soul-bride counsels another,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਟਸਥ ਹੋ ਕੇ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਉਤਮ ਸਖੀ ਮਧਮ ਸਖੀ ਕੋ ਸਮਝਾਵਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਕ ਸਤਸੰਗੀ) ਸਹੇਲੀ (ਦੂਜੇ ਸਤਸੰਗੀ) ਸਹੇਲੀ ਨੂੰ (ਪ੍ਰਭੂ-ਪਤੀ ਦੇ ਮਿਲਾਪ ਦੇ ਤਰੀਕੇ ਬਾਰੇ) ਸਮਝਾਂਦੀ ਹੈ (ਤੇ ਆਖਦੀ ਹੈ ਕਿ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cumpliendo la Voluntad de su Señor,"