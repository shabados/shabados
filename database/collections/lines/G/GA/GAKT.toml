[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਨੁ ਚੰਡਿ ਕ੍ਰਿਪਾ ਤੁਮਰੀ ਕਬਹੂੰ ਮੁਖ ਤੇ ਨਹੀ ਅਛਰ ਹਉ ਕਰਿ ਹੋਂ ॥"
page = 290

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O Chandi! I cannot utter a syllable from my mouth without Thy Grace"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਚੰਡਿਕਾ! ਤੇਰੀ ਕ੍ਰਿਪਾ ਤੋਂ ਬਿਨਾ ਮੈਂ ਕਦੇ ਇਕ ਅੱਖਰ ਵੀ ਮੂੰਹੋਂ ਕਢ ਸਕਣ ਦੇ ਸਮਰਥ ਨਹੀਂ ਹਾਂ।"