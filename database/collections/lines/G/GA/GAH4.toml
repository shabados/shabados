[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਤੀਆ ਨਾਸਤਿ; ਇਕੁ ਰਹਿਆ ਸਮਾਇ ॥"
page = 1140
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is not another, The one Lord is pervading all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੋਰ ਕੋਈ ਹੈ ਹੀ ਨਹੀਂ। ਇੱਕ ਸਾਹਿਬ ਹੀ ਸਾਰੇ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no other at all; the One Lord is permeating and pervading everywhere."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੂਸਰਾ ਨਹੀਂ ਹੈ ਏਕ ਤੂਹੀ ਸਰਬ ਮੇਂ ਸਮਾਇ ਰਹਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੈਥੋਂ ਬਿਨਾ (ਤੇਰੇ ਬਰਾਬਰ ਦਾ) ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੈ, ਤੂੰ ਹੀ ਹਰ ਥਾਂ ਵਿਆਪਕ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਤੀਆ = ਦੂਜਾ, ਤੈਥੋਂ ਬਿਨਾ ਕੋਈ ਹੋਰ। ਨਾਸਤਿ = ਨ ਅਸਤਿ, ਨਹੀਂ ਹੈ {अस्ति}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues Tú, el Uno, prevalece en todo."