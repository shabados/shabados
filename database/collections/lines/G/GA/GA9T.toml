[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਸਤਿਗੁਰ ਸਦਾ ਦਇਆਲ ॥੪॥੫॥੭੪॥"
page = 177
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, the True Guru, is for ever Kind to him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਉਸ ਉਤੇ ਸੱਚੇ ਗੁਰੂ ਜੀ ਹਮੇਸ਼ਾਂ ਹੀ ਦਇਆਵਾਨ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Unto those whom the Lord Himself has blessed with His Mercy. ||4||5||74||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਪਰ ਸਤਿਗੁਰੂ ਸਦਾ ਦਿਆਲ ਹੋਤਾ ਹੈ॥੪॥੫॥੭੪॥☬ਪਰਮੇਸਰ ਕੇ ਉਪਕਾਰ ਜਨਾਵਤੇ ਹੂਏ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਉਤੇ ਸਤਿਗੁਰੂ ਸਦਾ ਦਇਆ-ਦ੍ਰਿਸ਼ਟੀ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ ॥੪॥੫॥੭੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sobre él también está la Gracia del Señor. (4-5-74)"