[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਢਾਢੀ ਕਰੇ ਪੁਕਾਰ; ਪ੍ਰਭੂ ਸੁਣਾਇਸੀ ॥"
page = 510
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The minstrel utters a cry and the Lord hears."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਢਾਢੀ ਕੂਕ ਪੁਕਾਰ ਕਰਦਾ ਹੈ ਅਤੇ ਪ੍ਰਭੂ ਸੁਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The minstrel cries out, and God hears him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਢਾਢੀ) ਜਸ ਕਰਨੇ ਵਾਲਾ ਜਗਿਆਸੂ (ਪੁਕਾਰ) ਬੇਨਤੀ ਕਰ ਪ੍ਰਭੂ ਕੋ ਸੁਨਾਉਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਮਨੁੱਖ ਢਾਢੀ ਬਣ ਕੇ ਅਰਦਾਸ ਕਰਦਾ ਹੈ ਤੇ ਪ੍ਰਭੂ ਨੂੰ ਸੁਣਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਢਾਢੀ = ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El músico canta en la Puerta del Señor y el Señor lo escucha;"