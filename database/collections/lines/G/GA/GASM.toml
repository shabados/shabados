[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਰੰਗ ਮਹਲ ਰੰਗ ਰੰਗ ਵਿਚਿ; ਦਸਰਥੁ ਕਉਸਲਿਆ ਰਲੀਆਲੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In their pleasure palace, Daisarath and Kaus'alya were absorbed in their joys."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਦਸਰਥ ਦੇ ਰਣਵਾਸ ਵਿਖੇ (ਜਿੱਥੇ) ਵਡੇ ਰਾਗ ਰੰਗ (ਹੁੰਦੇ ਸਨ) ਕੌਸ਼ੱਲਿਆ ਪਟਰਾਣੀ ਗਰਭਵਤੀ ਹੋਈ।"