data = "ਸਬ ਪ੍ਰਸੰਗ ਨਹੀ ਜਾਤ ਉਚਰਾ ॥"
page = 182

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Each one of them wed whomsoever she liked, but all such anecdotes cannot be described"

