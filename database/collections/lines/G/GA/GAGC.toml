[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਤ ਫਿਰੇ ਬਨ ਭੇਖ; ਮੋਹਨ ਰਹਤ ਨਿਰਾਰ ॥੧॥ ਰਹਾਉ ॥"
page = 534
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wearing religious garbs, men wander in woods, but the Beauteous Lord remains unattached. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਜ਼ਹਬੀ ਬਾਣੇ ਪਹਿਣ ਕੇ ਬੰਦੇ ਜੰਗਲਾਂ ਅੰਦਰ ਭਟਕਦੇ ਹਨ, ਪ੍ਰੰਤੂ ਸੁੰਦਰ ਸੁਆਮੀ ਨਿਰਲੇਪ ਵਿਚਰਦਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some wander around the forests, wearing religious robes, but the Fascinating Lord remains distant from them. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪਾਖੰਡ ਕਰ ਭੇਖੋਂ ਕੋ ਧਾਰਨ ਕਰਤੇ ਹੈਂ ਅਰ ਬਨ ਮੇਂ ਫਿਰਤੇ ਹੈਂ, ਪਰੰਤੂ ਮੋਹਨ ਪਿਆਰਾ ਤਿਨ ਸੇ ਨਿਰਾਲਾ ਰਹਤਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇਹੜੇ ਮਨੁੱਖ ਤਿਆਗੀ ਸਾਧੂਆਂ ਵਾਲੇ) ਭੇਖ ਕਰ ਕੇ ਜੰਗਲ ਵਿਚ ਤੁਰੇ ਫਿਰਦੇ ਹਨ, ਸੋਹਣਾ ਪ੍ਰਭੂ ਉਹਨਾਂ ਤੋਂ ਵੱਖਰਾ ਹੀ ਰਹਿੰਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਨ = ਜੰਗਲ। ਭੇਖ = ਸਾਧੂਆਂ ਵਾਲੇ ਪਹਿਰਾਵੇ। ਮੋਹਨ = ਸੋਹਣਾ ਪ੍ਰਭੂ। ਨਿਰਾਰ = ਵੱਖਰਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunos andan por los bosques y se visten como Santos, pero el Fascinante Señor se conserva distinto a ellos. (1‑Pausa)"