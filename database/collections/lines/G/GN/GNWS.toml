type = "primary"
data = "ਜਨੁ ਜੋਗ ਜੀਤ ॥੩੯੯॥"
page = 667

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Enduring coldness on his body, his mind never got impaired and in this way after many years, he had been victorious in Yogs.399."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਉਸ ਨੇ ਯੋਗ ਨੂੰ ਹੀ ਜਿਤ ਲਿਆ ਹੋਵੇ ॥੩੯੯॥"