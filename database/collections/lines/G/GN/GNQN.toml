[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨ ਕਉ; ਤਖਤਿ ਮਿਲੀ ਵਡਿਆਈ ॥"
page = 1023
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They alone are blessed with glory in the Lord's court,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਸਾਈਂ ਦੇ ਦਰਬਾਰ ਅੰਦਰ ਪ੍ਰਭਤਾ ਪਾਉਂਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They alone are blessed with glorious greatness at the Lord's throne,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਪੁਰਸੋਂ ਕੋ ਸਰੂਪ ਕੀ ਪ੍ਰਾਪਤੀ ਰੂਪ ਵਡਿਆਈ ਮਿਲੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹ ਮਨੁੱਖ ਮਾਨੋ, ਆਤਮਕ ਮੰਡਲ ਵਿਚ ਬਾਦਸ਼ਾਹ ਬਣ ਜਾਂਦੇ ਹਨ) ਉਹਨਾਂ ਨੂੰ ਤਖ਼ਤ ਉਤੇ ਬੈਠਣ ਦੀ ਵਡਿਆਈ ਮਿਲਦੀ ਹੈ (ਉਹ ਸਦਾ ਆਪਣੇ ਹਿਰਦੇ-ਤਖ਼ਤ ਉਤੇ ਬੈਠਦੇ ਹਨ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਖਤਿ = ਤਖ਼ਤ ਉਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo serán bendecidos por Dios aquéllos que estén entonados en Él, en el Intrépido Señor."