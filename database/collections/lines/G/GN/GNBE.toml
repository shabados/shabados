[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪੂਰੇ ਕੀ; ਅਕਥ ਕਹਾਨੀ ॥"
page = 1338
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ineffable is the story of the Perfect Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਕਹਿ ਹੇ ਵਾਰਤਾ ਪੂਰਨ ਗੁਰਦੇਵ ਜੀ ਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "through the Unspoken Speech of the Perfect Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਪੂਰੇ ਸਤਿਗੁਰੋਂ ਕੀ ਅਕਥ ਕਥਾ ਹੈ, ਭਾਵ ਕਥਨ ਸੇ ਰਹਿਤ ਬਿਅੰਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਪੂਰੇ ਤੌਰ ਤੇ ਬਿਆਨ ਨਹੀਂ ਕੀਤੀ ਜਾ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਕਥ = (ਅ-ਕਥ) ਜੋ ਬਿਆਨ ਨਾਹ ਕੀਤੀ ਜਾ ਸਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mediante el Discurso Impronunciable del Perfecto Guru."