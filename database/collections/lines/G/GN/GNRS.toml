[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੁ ਪੂਰਾ; ਖਿਨੁ ਖਿਨੁ ਨਮਸਕਾਰੀ ॥"
page = 1085
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Every moment, I make obeisance unto my Perfect Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਮੁਹਤ, ਮੈਂ ਆਪਣੇ ਪੂਰਨ ਗੁਰਾਂ ਨੂੰ ਬੰਦਨਾ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Each and every moment, I humbly bow to the Perfect Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਰਾ ਜੋ ਗੁਰੂ ਹੈ ਤਿਸ ਕੋ ਖਿਨ ਖਿਨ ਮੇਂ ਨਮਸਕਾਰ ਕਰਿ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੂ ਨੂੰ ਹਰੇਕ ਖਿਨ ਨਮਸਕਾਰ ਕਰਦਾ ਰਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖਿਨੁ ਖਿਨੁ = ਹਰੇਕ ਖਿਨ। ਨਮਸਕਾਰੀ = ਨਮਸਕਾਰੀਂ, ਮੈਂ ਨਮਸਕਾਰ ਕਰਦਾ ਰਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "dar obediencia a cada momento a mi Guru Perfecto"