[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਲਰਕਾ ਜਨਿ ਕੈ ਖਿਝ ਹੈ ਜਨ; ਤੋ ਮਿਲਿ ਸੋਟਨ ਸਾਥ ਮਰੈ ਹੈ ॥"
page = 303

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "If someone gets angry with them, considering them as boys, they then beat him with their clubs"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕੋਈ) ਪੁਰਸ਼ ਜੇ ਲੜਕਾ ਜਾਣ ਕਰ ਕੇ ਗੁੱਸੇ ਹੁੰਦਾ ਹੈ, (ਤਾਂ ਉਸ ਨੂੰ ਸਾਰੇ ਬਾਲਕ) ਮਿਲ ਕੇ ਸੋਟਿਆਂ ਨਾਲ ਮਾਰਦੇ ਹਨ।"