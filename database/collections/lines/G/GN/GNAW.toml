[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਉਦਹ ਭਵਣ ਤੇਰੇ ਹਟਨਾਲੇ ॥"
page = 1062
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The fourteen worlds are Thine bazars."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੌਦਾਂ ਪੁਰੀਆਂ ਤੈਂਡੇ ਬਜਾਰ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The fourteen worlds are Your markets."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚੌਦਾਂ ਭਵਨ ਤੇਰੇ (ਹਟਨਾਲੇ) ਬਜਾਰ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਇਹ ਚੌਦਾਂ ਲੋਕ ਤੇਰੇ ਬਾਜ਼ਾਰ ਹਨ (ਜਿੱਥੇ ਤੇਰੇ ਪੈਦਾ ਕੀਤੇ ਬੇਅੰਤ ਜੀਵ ਤੇਰੀ ਦੱਸੀ ਕਾਰ ਕਰ ਰਹੇ ਹਨ। ਇਹ ਸਾਰਾ ਜਗਤ ਤੇਰਾ ਹੀ ਸਰੂਪ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਉਦਹ ਭਵਨ = ਚੌਦਾਂ ਲੋਕ {ਸੱਤ ਆਕਾਸ਼, ਸੱਤ ਪਤਾਲ}, ਸਾਰਾ ਜਗਤ। ਹਟਨਾਲੇ = {ਹੱਟਾਂ ਦੀਆਂ ਕਤਾਰਾਂ} ਬਾਜ਼ਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las catorce esferas son Tus Mercados, el Guru Verdadero las revela,"