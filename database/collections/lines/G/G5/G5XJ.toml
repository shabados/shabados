[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦੂਜਾ ਭਾਉ, ਕੁਦਾਉ ਹਰਾਏ ॥੨੨॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Double-mindedness is an evil stake which ultimately causes defeat."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਦੂਜਾ ਭਾਉ ਖੋਟਾ ਦਾਉ ਹਾਰ ਹੀ ਦਿੰਦਾ ਹੈ।"