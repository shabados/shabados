[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਤੇ; ਸੁਧੁ ਨਾਹੀ. ਮਨੁ ਅਪਨਾ ॥੧॥ ਰਹਾਉ ॥"
page = 485
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "when thine own mind is not immaculate. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਤੇਰਾ ਆਪਣਾ ਨਿੱਜ ਦਾ ਅੰਤਸ਼ਕਰਨ ਨਿਰਮਲ ਨਹੀਂ? ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "when your mind is not pure? ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਪੰਕਤੀ ਕਾ ਭਾਵ ਜਾਪ ਤਿਆਗਣੇ ਕਾ ਨਹੀਂ ਮਨ ਸੁਧ ਕਰਨੇ ਮੇਂ ਭਾਵ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦ ਤਕ (ਅੰਦਰੋਂ) ਆਪਣਾ ਮਨ ਪਵਿੱਤਰ ਨਹੀਂ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਬ ਤੇ = ਜਦ ਤਕ। ਸੁਧੁ = ਪਵਿੱਤਰ ॥॥੧॥ਰਹਾਉ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "cuando tu mente no está purgada de la culpa ni de la vergüenza? (1‑Pausa)"