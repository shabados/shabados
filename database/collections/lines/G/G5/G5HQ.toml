[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਖ਼ੁਦਾ ਮਨ ਪਿਸਰ ਦਾਦ ਈਂ ਹਸਬ ਸੇਸਤ ॥੨੫॥"
page = 1411

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And inside, they found him dazzling like the moon.(25)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੇ ਕਿਹਾ) ਪਰਮਾਤਮਾ ਨੇ ਮੈਨੂੰ ਇਹ ਲੜਕਾ ਪ੍ਰਦਾਨ ਕੀਤਾ ਹੈ। ਇਹ ਬਹੁਤ ਵੱਡੀ ਸੌਗਾਤ ਹੈ ॥੨੫॥"