[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮੁ; ਨਿਕਟਿ ਕਰਿ ਜਾਣੁ ॥"
page = 869
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who deems the Supreme Lord to be near him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸ਼ਰੋਮਣੀ ਸਾਹਿਬ ਨੂੰ ਆਪਣੇ ਨੇੜੇ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "who knows the Supreme Lord God to be close."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪਾਰਬ੍ਰਹਮ ਕੋ ਨਿਕਟ ਕਰਿ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੇਹੜਾ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਨੂੰ ਆਪਣੇ ਨੇੜੇ ਵੱਸਦਾ ਸਮਝਦਾ ਹੈ। (ਪਰਮਾਤਮਾ ਨੂੰ (ਹਰ ਵੇਲੇ ਆਪਣੇ) ਨੇੜੇ ਵੱਸਦਾ ਸਮਝ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਕਟਿ = ਨੇੜੇ। ਕਰਿ = ਕਰ ਕੇ। ਨਿਕਟਿ ਕਰਿ = ਨੇੜੇ-ਵੱਸਦਾ। ਜਾਣੁ = ਸਮਝ ਲੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "al Señor Supremo Lo siento muy cerca de mí."