[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਉ ਕੰਡੈ ਤੋਲੈ ਸੁਨਿਆਰੁ ॥"
page = 1239
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "how can this be weighed by a goldsmith,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਸੁਨਿਆਰਾ ਆਪਣੇ ਤਰਾਜੂ ਨਾਲ ਕਿਵੇਂ ਤੋਲ ਸਕਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- how can the goldsmith weigh it on the scale?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਕੰਡੇ ਮੇਂ ਪਾਇ ਕਰ ਸੁਨਾਰਾ ਕੈਸੇ ਤੋਲ ਸਕੇਗਾ ਅਰਥਾਤ ਨਹੀਂ ਤੋਲ ਸਕਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਭਲਾ ਕੋਈ) ਸੁਨਿਆਰਾ (ਛੋਟੇ ਜਿਹੇ) ਤਰਾਜ਼ੂ ਵਿਚ ਕਿਵੇਂ ਤੋਲ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੰਡੈ = ਕੰਡੇ ਉਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la tierra, el mar o las montañas,"