[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹੋਇ ਨਿਮਾਣੀ ਬਕਰੀ; ਦੀਨ ਦੁਨੀ ਵਡਿਆਈ ਪਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Goat is humble and hence it is respected everywhere."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਬਕਰੀ ਨਿਰਮਾਣ ਹੈ ਇਸ ਲਈ ਦੋਹਾਂ ਲੋਕਾਂ ਵਿਖੇ ਇਸਦੀ ਸ਼ੋਭਾ ਹੈ।"