[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਨਾ ਪਿਛੈ ਜਗੁ; ਭੁੰਚੈ ਭੋਗਈ ॥"
page = 958
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "For their sake, the world eats and enjoys."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੀ ਬਰਕਤ ਦੁਨੀਆ ਖਾਂਦੀ ਪੀਂਦੀ ਅਤੇ ਮੌਜਾਂ ਮਾਣਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "For their sake, the world eats and enjoys."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਨ ਕੇ ਆਸਰੇ ਜਗਤ ਭੋਗੋਂ ਕੋ ਭੋਗਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਜੇਹੇ ਬੰਦਿਆਂ ਦੇ ਪੂਰਨਿਆਂ ਤੇ ਤੁਰ ਕੇ (ਸਾਰਾ) ਜਗਤ (ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ) ਖ਼ੁਰਾਕ ਖਾਂਦਾ ਮਾਣਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੁੰਚੈ = (ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਖ਼ੁਰਾਕ) ਖਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Para ellos el mundo entero disfruta del Sabor de Dios."