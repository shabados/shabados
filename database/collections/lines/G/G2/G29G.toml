[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲੋਭ ਮੋਹ ਮਾਇਆ ਮਮਤਾ ਫੁਨਿ; ਜਿਹ ਘਟਿ ਮਾਹਿ ਪਛਾਨਉ ॥੧॥ ਰਹਾਉ ॥"
page = 685
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within whose mind thou recognizest avarice, worldly attachment, desire for riches and also my-ness. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਮਨ ਅੰਦਰ ਤੂੰ ਲਾਲਚ, ਸੰਸਾਰੀ ਲਗਨ, ਧਨ-ਦੌਲਤ ਦੀ ਇੱਛਾ ਅਤੇ ਮੁੜ ਮੇਰ ਤੇਰ ਨੂੰ ਸਿੰਞਾਣਦਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Understand that his heart is filled with greed, emotional attachment, Maya and egotism. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਮਾਯਾ ਕੀ ਮਮਤਾ ਪੁਨਾ ਲੋਭ, ਮੋਹ ਆਦੀ ਵਿਕਾਰੋਂ ਕਾ ਸਮਦਾਇ ਜਿਸ ਕੇ (ਘਟਿ) ਅੰਤਸਕਰਣ ਮੇਂ ਸਮਾਇ ਰਹਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਜੋਗੀ) ਦੇ ਹਿਰਦੇ ਵਿਚ ਮੈਂ ਲੋਭ ਮਾਇਆ ਦੇ ਮੋਹ ਅਤੇ ਮਮਤਾ (ਦੀਆਂ ਲਹਰਾਂ ਉੱਠ ਰਹੀਆਂ) ਵੇਖਦਾ ਹਾਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫੁਨਿ = ਫਿਰ, ਅਤੇ। ਜਿਹ ਘਟ ਮਾਹਿ = ਜਿਸ (ਜੋਗੀ) ਦੇ ਹਿਰਦੇ ਵਿਚ। ਪਛਾਨਉ = ਪਛਾਨਉਂ, ਮੈਂ ਪਛਾਣਦਾ ਹਾਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "su corazón está infestado de avaricia, apego y orgullo. (1-Pausa)"