[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਸੁਖੁ ਮੋ ਕਉ; ਸੰਤ ਬਤਾਵਹੁ ॥"
page = 179
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Show me that comfort, O saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਉਹ ਠੰਢ-ਚੈਨ ਦਸੋ, ਹੇ ਸਾਧੂਓ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Show me that peace, O Saints,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋਂ! ਮੇਰੇ ਕੋ ਸੋ ਸੁਖ ਕਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! ਮੈਨੂੰ ਉਹ ਆਤਮਕ ਆਨੰਦ ਦੱਸੋ (ਜਿਸ ਨਾਲ ਮੇਰੀ ਮਾਇਆ ਦੀ) ਤ੍ਰਿਸ਼ਨਾ ਮਿਟ ਜਾਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋ ਕਉ = ਮੈਨੂੰ। ਸੰਤ = ਹੇ ਸੰਤ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Santos, ¡díganme de algún placer"