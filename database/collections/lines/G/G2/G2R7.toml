data = "ਚੁ ਯਜ਼ਦਾਂ ਸ਼ਨਾਸੀ ਬ ਜਾਂ ਬਰਤਰੀ ॥੮੪॥"
page = 1393

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "but it is still better to recognize the Lord.84."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੇ ਤੂੰ ਰੱਬ ਨੂੰ ਪਛਾਣੇਗਾ ਤਾਂ ਇਸ ਤੋਂ ਵੀ ਸ੍ਰੇਸ਼ਠ ਹੋ ਜਾਵੇਂਗਾ ॥੮੪॥"