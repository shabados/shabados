[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰਾ ਤਾਣੁ; ਤੂਹੈ ਦੀਬਾਣੁ ॥"
page = 355
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thine is the might and Thou art my prop."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੈਡੀਂ ਹੀ ਸਤਿਆ ਹੈ ਅਤੇ ਤੂੰ ਹੀ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Power is Yours; You are my only Support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰਾ ਹੀ ਹਮ ਕੋ ਬਲ ਹੈ ਔਰ ਤੁਹੀ ਹਮਾਰਾ (ਦੀਬਾਣੁ) ਆਸਾਰਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਗੁਰਮੁਖਿ ਨੂੰ ਤੇਰਾ ਹੀ ਤਾਣ ਹੈ ਤੇਰਾ ਹੀ ਆਸਰਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾਣੁ = ਤਾਕਤ। ਦੀਬਾਣੁ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú eres mi Poder,"