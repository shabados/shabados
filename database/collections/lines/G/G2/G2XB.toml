type = "primary"
data = "ਬਨਿ ਨਿਰਜਨ ਮੋ ਲਖਿ ਬਾਘ ਬੜੇ ॥"
page = 616

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "One day, in a desolate forest, seeing huge lions, he went hunting, along with his army, in order to attack them"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਨਿਰਜਨ ਬਨ ਵਿਚ ਵੱਡੇ ਵੱਡੇ ਬਾਘ ਵੇਖੇ।"