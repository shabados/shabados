[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੈ ਕੈ ਪ੍ਰਨਾਮ ਘਨੇ ਪ੍ਰਭ ਕਉ; ਪੁਨਿ ਆਪਨੇ ਆਸ੍ਰਮ ਮੈ ਫਿਰਿ ਆਯੋ ॥"
page = 548

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He came back to his hermitage after bowing before him,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੂੰ ਬਹੁਤ ਵਾਰ ਪ੍ਰਨਾਮ ਕਰ ਕੇ ਫਿਰ (ਉਹ ਬ੍ਰਾਹਮਣ) ਆਪਣੇ ਆਸ਼੍ਰਮ ਵਿਚ ਪਰਤ ਆਇਆ।"