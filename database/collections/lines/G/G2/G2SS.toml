[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿੰਦਾ ਹਮਰਾ; ਕਰੈ ਉਧਾਰੁ ॥"
page = 339
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Slander effects my salvation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਿੰਦਾ ਮੇਰੀ ਮੁਕਤੀ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Slander is my salvation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਨਿੰਦਾ ਹਮਾਰਾ ਉਧਾਰ ਕਰਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਸਾਡੀ ਨਿੰਦਿਆ ਸਾਨੂੰ ਔਗੁਣਾਂ ਵਲੋਂ ਬਚਾਉਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਧਾਰੁ = ਬਚਾਅ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque el calumniador propicia mi salvación."