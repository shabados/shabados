[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਉਪਰਿ; ਹਰਿ ਕਾ ਮਨੁ ਮਾਨਿਆ ॥"
page = 998
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, with whom the Lord is heartily pleased;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੀਹਦੇ ਨਾਲ ਸੁਆਮੀ ਦਿਲੋਂ ਪ੍ਰਸੰਨ ਹੈ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One whose mind is satisfied with the Lord"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸੇਵਕ ਕੇ ਊਪਰ ਹਰੀ ਕਾ ਮਨ ਮਾਨਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸੇਵਕ ਉੱਤੇ ਪਰਮਾਤਮਾ ਪ੍ਰਸੰਨ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸ ਉਪਰਿ = ਜਿਸ ਜੀਵ ਉਤੇ। ਮਾਨਿਆ = ਪਤੀਜ ਜਾਂਦਾ ਹੈ, ਪ੍ਰਸੰਨ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél con quien el Señor está complacido,"