[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਪਣੇ ਅਪਣੇ ਸਾਹਿਬੈ; ਚਾਕਰ ਜਾਇ ਜੁਹਾਰ ਜੁੜੰਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Servants go and salute their masters."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਆਪਣੇ ਮਾਲਿਕ ਅੱਗੇ ਚਾਕਰ ਜਾਕੇ ਸੇਵਾ ਵਿਚ ਜੁੜਦੇ ਹਨ।"