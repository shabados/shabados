[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਾਹਤ ਭਯੋ ਸੁਭਟਨ ਬਡੇ ਬਾਹਿਤ ਭਯੋ ਹਥਿਆਰ ॥੧੧॥"
page = 71

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And killed many soldiers, wielding his weapons very skillfully.11."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵਡੇ ਵਡੇ ਯੋਧਿਆਂ ਨੂੰ ਗਾਹ ਦਿੱਤਾ ਅਤੇ (ਚੰਗੀ ਤਰ੍ਹਾਂ ਨਾਲ) ਹਥਿਆਰ ਵਾਹੇ ॥੧੧॥"