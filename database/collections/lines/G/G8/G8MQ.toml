data = "ਬਕਰਾ ਯਾ ਮੂਰਖ ਕੋ ਹਰਿਯੈ ॥੧॥"
page = 949

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘We should endeavour and steal a goat from an idiot.’(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਮਾਰਗ ਉਤੇ ਜਾ ਰਹੇ) ਇਸ ਮੂਰਖ ਦਾ ਬਕਰਾ ਖੋਹ ਲੈਣਾ ਚਾਹੀਦਾ ਹੈ ॥੧॥"