[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਦਿਸਾਹੁ ਚੜੑਿਓ ਅਹੰਕਾਰਿ ॥"
page = 1165
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The king flew into pride."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਤਿਸ਼ਾਹ ਹੰਕਾਰ ਵਿੱਚ ਆ ਗਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The arrogant king was enraged at this reply."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਬਾਦਸ਼ਾਹ ਕੋ ਬਡਾ ਹੰਕਾਰ ਚੜ ਗ੍ਯਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬਾਦਸ਼ਾਹ (ਇਹ ਉੱਤਰ ਸੁਣ ਕੇ) ਅਹੰਕਾਰ ਵਿਚ ਆਇਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਹੰਕਾਰਿ = ਅਹੰਕਾਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Rey se enfureció con la respuesta"