[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਈ ਆਖੈ ਆਦਮੀ; ਨਾਨਕੁ ਵੇਚਾਰਾ ॥੧॥"
page = 991
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and some call him a pitiful man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਈ ਉਸ ਨੂੰ ਵਿਚਾਰਾ ਇਨਸਾਨ ਕਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some call him a mere mortal; O, poor Nanak! ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਆਖਤਾ ਹੈ ਇਹੁ ਤਾਂ ਬਿਚਾਰਾ ਨਾਨਕ ਹੈ, ਇਸ ਕੋ ਔਰ ਕਛ ਨਹੀਂ ਚੰਬੜਿਆ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਕੋਈ ਬੰਦਾ ਆਖਦਾ ਹੈ (ਨਹੀਂ) ਨਾਨਕ ਹੈ ਤਾਂ (ਸਾਡੇ ਵਰਗਾ) ਆਦਮੀ (ਹੀ) ਉਂਞ ਹੈ ਆਜਿਜ਼ ਜੇਹਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵੇਚਾਰਾ = ਆਜਿਜ਼, ਨਿਮਾਣਾ ਜੇਹਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunos dicen que soy un simple hombre, olvidado y sin preocupaciones. (1)"