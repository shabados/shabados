[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਹੁ ਰੰਗ ਮਾਇਆ; ਬਹੁ ਬਿਧਿ ਪੇਖੀ ॥"
page = 179
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mammon of many forms, I have seen in many ways."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਸਰੂਪਾ ਵਾਲੀ ਮੋਹਨੀ ਮੈਂ ਅਨੇਕ ਤ੍ਰੀਕਿਆਂ ਨਾਲ ਵੇਖੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have gazed upon the many forms of Maya, in so many ways."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੇਕ ਰੰਗੋਂ ਵਾਲੀ ਜੋ ਮਾਇਆ ਹੈ, ਸੋ ਬਹੁਤ ਬਿਧੋਂ ਕਰ ਕੇ ਸੁਖ ਕੇ ਵਾਸਤੇ ਦੇਖੀ ਹੈ, ਪਰ ਇਸ ਸੇ ਸੁਖ ਕਿਸੀ ਕੋ ਨਹੀਂ ਹੂਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਬਹੁਤ ਰੰਗਾਂ ਵਾਲੀ ਮਾਇਆ ਕਈ ਤਰੀਕਿਆਂ ਨਾਲ ਮੋਂਹਦੀ ਵੇਖੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਧਿ = ਤਰੀਕਾ, ਢੰਗ। ਪੇਖੀ = ਮੈਂ ਵੇਖੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He visto las múltiples facetas de Maya, de muchas formas,"