[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁਆਹਾ ਸੁਧਾਯੰ ਨਮੋ ਸੀਤਲੇਯੰ ॥੨੮॥੨੪੭॥"
page = 119

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art pure fire-manifestation and also cold-incarnate, I salute Thee.28.247."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਵਾਹਾ (ਅਗਨੀਰੂ ਪਾ) ਸੁਧਾ (ਅੰਮ੍ਰਿਤ-ਰੂਪਾ) ਅਤੇ ਸੀਤਲਾ ਨੂੰ ਨਮਸਕਾਰ ਹੈ ॥੨੮॥੨੪੭॥"