type = "primary"
data = "ਭੂਪਤਿ ਸਹਤ ਨ ਜਾਨ︀ਯੋ ਰਾਨੀ ॥"
page = 171

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the Brahmin uttered these words, the king along with the queen could not understand its import."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤਾਂ) ਰਾਣੀ ਸਮੇਤ ਰਾਜੇ ਨੇ (ਇਸ ਦੇ ਭੇਦ ਨੂੰ) ਨਾ ਸਮਝਿਆ।"