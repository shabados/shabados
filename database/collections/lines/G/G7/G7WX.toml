[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਓਟ ਗਹੀ ਜਗਦੀਸੁਰ; ਪੁਨਹ ਪੁਨਹ ਬਲਿਹਾਰਿਓ ॥੨॥੪॥੩੦॥"
page = 534
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak has grasped the protection of the Lord of the universe and he is again, and again, a sacrifice unto Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੇ ਆਲਮ ਦੇ ਸੁਆਮੀ ਦੀ ਸ਼ਰਣ ਲਈ ਹੈ ਅਤੇ ਉਹ ਮੁੜ ਮੁੜ ਕੇ, ਉਸ ਉਤੋਂ ਘੋਲੀ ਵੰਞਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak has grasped the Support of the Lord of the Universe; again and again, he is a sacrifice to Him. ||2||4||30||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਨੋਂ ਨੇ ਜਗਦੀਸ੍ਵਰ ਕੀ ਸਰਨਿ ਪਕੜੀ ਹੈ ਮੈਂ ਤਿਨ ਕੇ (ਪੁਨਹ ਪੁਨਹ) ਬਾਰੰਬਾਰ ਬਲਿਹਾਰੇ ਜਾਤਾ ਹੂੰ॥੨॥੪॥੩੦॥☬ਪਖੰਡ ਕੀ ਨਛੇਦੀ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਸੇਵਕ ਨੇ ਜਗਤ ਦੇ ਮਾਲਕ ਪਰਮਾਤਮਾ ਦਾ ਆਸਰਾ ਲਿਆ ਹੁੰਦਾ ਹੈ, ਮੈਂ ਉਸ ਸੇਵਕ ਤੋਂ ਮੁੜ ਮੁੜ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ ॥੨॥੪॥੩੦॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਟ = ਆਸਰਾ। ਗਹੀ = ਫੜੀ। ਜਗਦੀਸੁਰ = ਜਗਤ ਦੇ ਈਸ਼੍ਵਰ ਦਾ। ਪੁਨਹ ਪੁਨਹ = ਮੁੜ ਮੁੜ ॥੨॥੪॥੩੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak ha buscado el Soporte del Señor del Universo y ofrece su ser en sacrificio a Él por siempre y para siempre. (2‑4‑30)"