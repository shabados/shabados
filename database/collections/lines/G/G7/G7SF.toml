[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰੀਤਮ. ਭਗਵਾਨ ਅਚੁਤ ॥ ਨਾਨਕ ਸੰਸਾਰ ਸਾਗਰ ਤਾਰਣਹ ॥੧੪॥"
page = 1361
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The loved Imperishable Lord, O Nanak, ferries man across the world ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਿਆਰਾ, ਅਬਿਨਾਸੀ ਪ੍ਰਭੂ, ਹੇ ਨਾਨਕ! ਬੰਦੇ ਨੂੰ ਜਗਤ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Beloved Eternal Lord God, O Nanak, carries us across the world-ocean. ||14||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਚੁਤ ਸਰੂਪ ਭਗਵਾਨ ਪ੍ਰੀਤਮ ਹੋ ਕਰ॥ ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਸੰਸਾਰ ਸਮੁੰਦਰ ਸੇ ਤਾਰ ਦੇਤਾ ਹੈ॥੧੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਵਿਨਾਸ਼ੀ ਪਿਆਰੇ ਪਰਮਾਤਮਾ (ਦਾ ਸਿਮਰਨ)-ਹੇ ਨਾਨਕ! ਸੰਸਾਰ-ਸਮੁੰਦਰ (ਦੇ ਵਿਕਾਰਾਂ) ਤੋਂ ਬਚਾ ਲੈਂਦਾ ਹੈ ॥੧੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਚੁਤ = ਅਵਿਨਾਸ਼ੀ (अच्युत)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Bienamado y Eterno Dios nuestro Señor, oh, dice Nanak, nos carga a través del océano del mundo.(14)"