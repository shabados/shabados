[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਤੁ ਤਨਿ ਨਾਮੁ. ਨ ਊਪਜੈ ਭਾਈ; ਸੇ ਤਨ ਹੋਏ ਛਾਰ ॥"
page = 608
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The bodies, in which the Name springs not, O brother, those bodies are reduced to ashes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੀਆਂ ਦੇਹਾਂ ਅੰਦਰ ਨਾਮ ਉਤਪੰਨ ਨਹੀਂ ਹੁੰਦਾ, ਹੇ ਵੀਰ! ਉਹ ਦੇਹਾਂ ਸੁਆਹ ਹੋ ਜਾਂਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those bodies, in which the Name of the Lord does not well up, O Siblings of Destiny - those bodies are reduced to ashes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਸਰੀਰ ਮੇਂ ਨਾਮ ਨਹੀਂ ਉਤਪੰਨ ਹੋਤਾ, ਹੇ ਭਾਈ! ਸੇ ਤਨ ਬਾਰੰਬਾਰ ਭਸਮ ਹੋਏ ਹੈਂ, ਭਾਵ ਸੇ ਵਹੁ ਪੁਰਖ ਜਨਮਤੇ ਮਰਤੇ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਜਿਸ ਸਰੀਰ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਪਰਗਟ ਨਹੀਂ ਹੁੰਦਾ ਉਹ ਸਾਰੇ ਸਰੀਰ ਵਿਅਰਥ ਗਏ ਸਮਝੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਤੁ = ਜਿਸ ਵਿਚ। ਜਿਤੁ ਤਨਿ = ਜਿਤੁ ਜਿਤੁ ਤਨਿ, ਜਿਸ ਜਿਸ ਸਰੀਰ ਵਿਚ। ਸੇ ਤਨ = ਉਹ (ਸਾਰੇ) ਸਰੀਰ। ਛਾਰ = ਸੁਆਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El cuerpo en el que no nace el Nombre del Señor es reducido a polvo."