data = "ਸੈਨਾ ਜੋਰਿ ਦਾਨਵਨ ਭਾਰੀ ॥"
page = 978

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "With the backing of a large number of the army of the devils, he came furious."

[[content]]
