[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਆਨ ਸਿਆਲ; ਮਾਇਆ ਮਹਿ ਰਾਤਾ ॥"
page = 1160
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The dogs and jackals are dyed in mammon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੁੱਤੇ ਅਤੇ ਗਿੱਦੜ ਮਾਇਆ ਵਿੱਚ ਰੰਗੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Dogs and jackals are imbued with Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸੁਆਨ) ਕੁਤੇ ਅਰ (ਸਿਆਲ) ਗਿਦੜ ਭੀ ਮਾਯਾ ਮਹਿ ਰਾਤੇ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੁੱਤੇ, ਗਿੱਦੜ, ਬਾਂਦਰ, ਚਿੱਤ੍ਰੇ, ਸ਼ੇਰ ਸਭ ਮਾਇਆ ਵਿਚ ਰੰਗੇ ਪਏ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਆਲ = ਗਿੱਦੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los perros son embaucados por Maya y también los chacales."