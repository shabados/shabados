[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਸਹ ਕੀ ਮੈ; ਸਾਰ ਨ ਜਾਣੀ ॥੧॥"
page = 357
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and I knew not the worth of my Spouse."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਪਤੀ ਦੀ ਕਦਰ ਦੀ ਮੈਂ ਸਿੰਆਣ ਨਾਂ ਕੀਤੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I did not realize the value of my Husband Lord. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਨੇ ਤਿਸ ਅਪਨੇ (ਸਹੁ) ਸ੍ਵਾਮੀ ਕੇ ਗੁਣੋਂ ਕੀ ਸਾਰ ਨਹੀਂ ਸਮਝੀ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਮੋਹ ਵਿਚ ਫਸ ਕੇ ਹੀ) ਮੈਂ ਉਸ ਖਸਮ-ਪ੍ਰਭੂ (ਦੀ ਮੇਹਰ ਦੀ ਨਜ਼ਰ) ਦੀ ਕਦਰ ਨਹੀਂ ਸਮਝ ਸਕੀ (ਤੇ ਉਸ ਦੇ ਚਰਨਾਂ ਤੋਂ ਵਿਛੁੜੀ ਰਹੀ) ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹ ਕੀ = ਖਸਮ ਦੀ। {ਨੋਟ: ਲਫ਼ਜ਼ 'ਸਹੁ' ਅਤੇ 'ਸਹ' ਦਾ ਫ਼ਰਕ ਚੇਤੇ ਰਖਣ-ਯੋਗ ਹੈ। ਲਫ਼ਜ਼ 'ਸਹੁ' ਕਰਤਾ ਕਾਰਕ ਇਕ-ਵਚਨ ਹੈ ਤੇ (ੁ) ਅੰਤ ਹੈ। ਸੰਬੰਧਕ 'ਕੀ' ਦੇ ਕਾਰਨ ਇਸ ਦਾ ਇਹ (ੁ) ਲਹਿ ਗਿਆ ਹੈ}। ਸਾਰ = ਕਦਰ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y no sabía del Amor de mi Esposo Infinito. (1)"