data = "ਕੋਪੇ ਸੂਰਬੀਰ ਐਠ੍ਰਯਾਰੇ ॥"
page = 930

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Listening to his spirited talk, his egoist ones got ready."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਨ੍ਹਾਂ ਨੂੰ ਸੁਣ ਕੇ) ਹੰਕਾਰੀ ਸੂਰਮੇ ਕ੍ਰੋਧਵਾਨ ਹੋ ਗਏ।"