data = "ਤਿਤਿਓ ਕਾਲ ਖਾਪਿਓ ਨ ਤੇ ਕਾਲ ਘਾਏ ॥੨੮॥"
page = 41

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But they could not destroy him! 28"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਸਭ ਨੂੰ ਕਾਲ ਨੇ ਖਪਾ ਦਿੱਤਾ, ਪਰ ਉਹ ਕਾਲ ਦਾ ਨਾਸ਼ ਨਹੀਂ ਕਰ ਸਕੇ ॥੨੮॥"