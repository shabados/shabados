[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਬ ਬੈਠ ਨਰੇਸ ਬਿਚਾਰ ਕੀਓ ॥"
page = 201

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The king reflected (in his mind) about the son to be born to his daughter."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਦਸ਼ਰਥ ਰਾਜੇ ਨੇ (ਇਹ ਗੱਲ ਸੁਣ ਕੇ) ਬੈਠ ਕੇ ਵਿਚਾਰ ਕੀਤਾ।"