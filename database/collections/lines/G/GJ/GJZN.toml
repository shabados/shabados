[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਗਰ ਤਰੇ. ਭਰਮ ਭੈ ਬਿਨਸੇ; ਕਹੁ ਨਾਨਕ. ਠਾਕੁਰ ਪਰਤਾਪ ॥੨॥੫॥੮੫॥"
page = 821
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, through the Lord's glory, I have crossed the world-ocean and my doubt and dread are dispelled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਫਰਮਾਉਂਦੇ ਹਨ, ਪ੍ਰਭੂ ਦੇ ਤਪ-ਤੇਜ ਰਾਹੀਂ ਮੈਂ ਸੰਸਾਰ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਹੋ ਗਿਆ ਹਾਂ ਅਤੇ ਮੇਰਾ ਵਹਿਮ ਤੇ ਡਰ ਦੂਰ ਹੋ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have crossed over the world-ocean, and my doubt and fear are dispelled, says Nanak, through the glorious granduer of our Lord and Master. ||2||5||85||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸੀ ਤੇ ਸੰਸਾਰ ਸਾਗਰ ਕੇ ਦੁਖੋਂ ਤੇ ਤਰੇ ਹੈਂ ਔ ਭ੍ਰਮ ਭੈ ਸਭ ਨਸਟ ਹੋ ਗਏ ਹੈਂ। ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਠਾਕੁਰ ਕਾ ਐਸਾ ਪ੍ਰਤਾਪੁ ਹੈ॥੨॥੫॥੮੫॥☬ਸ੍ਰੀ ਗੁਰੂ ਹਰਿ ਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਕੇ ਤਾਪ ਨਿਵਰਤ ਹੋਏ ਤੇ ਉਚਾਰਨ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਲੰਘ ਜਾਂਦੇ ਹਨ, ਉਹਨਾਂ ਦੇ ਸਾਰੇ ਡਰ ਭਰਮ ਨਾਸ ਹੋ ਜਾਂਦੇ ਹਨ। ਨਾਨਕ ਆਖਦਾ ਹੈ- ਇਹ ਸਾਰੀ ਵਡਿਆਈ ਮਾਲਕ-ਪ੍ਰਭੂ ਦੀ ਹੀ ਹੈ ॥੨॥੫॥੮੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਗਰ = (ਸੰਸਾਰ-) ਸਮੁੰਦਰ। ਤਰੇ = ਪਾਰ ਲੰਘ ਗਏ। ਭੈ = {ਲਫ਼ਜ਼ 'ਭਉ' ਤੋਂ ਬਹੁ-ਵਚਨ} ਸਾਰੇ ਡਰ। ਠਾਕੁਰ ਪਰਤਾਪ = ਮਾਲਕ-ਪ੍ਰਭੂ ਦੀ ਵਡਿਆਈ ॥੨॥੫॥੮੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He cruzado el Océano del Mundo, mis dudas y miedos se han sublimado, a través de la Gloriosa Grandeza de nuestro Señor y Maestro, oh, dice Nanak."