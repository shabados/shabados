[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪ੍ਰਸਾਦਿ; ਤਤੁ ਸਭੁ ਬੂਝਿਆ ॥"
page = 281
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's grace he comes to know the whole reality."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਮਿਹਰ ਸਦਕਾ ਉਹ ਸਾਰੀ ਅਸਲੀਅਤ ਨੂੰ ਜਾਣ ਲੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, the essence of all reality is understood."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਜਨ ਨੇ ਗੁਰਾਂ ਦੀ ਕ੍ਰਿਪਾ ਸੇ ਸਰਬ ਕੇ (ਤਤੁ) ਸਾਰ ਸਰੂਪ ਕੋ ਸਮਝਿਆ ਹੈ ਮੁਕਤੀ ਕੋ ਪ੍ਰਾਪਤਿ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਭਾਵ) ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ (ਉਸ ਨੂੰ) ਸਾਰੀ ਅਸਲੀਅਤ ਦੀ ਸਮਝ ਆ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਤੁ = ਅਸਲੀਅਤ {Skt. तत्वं = The real nature of the human soul or the material world as being indentical with the Supreme Spirit pervading the Universe. 2. The Supreme being.} ਸੂਖਮੁ = {Skt. सुक्ष्मं The subtle all = pervading spirit, the Supreme Soul} ਸਰਬ-ਵਿਆਪਕ ਜੋਤਿ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "finalmente La encuentra por la Gracia del Guru."