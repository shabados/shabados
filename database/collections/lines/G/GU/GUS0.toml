[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲੇ ਗੁਰ ਪਗ ਰੇਨ ਰਵਾਲ ॥"
page = 977
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Obtain thou the earth and dust of the Guru's feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਗੁਰਾਂ ਦੇ ਪੈਰਾਂ ਦੀ ਖਾਕ ਤੇ ਧੂੜ ਨੂੰ ਪ੍ਰਾਪਤ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Receive the dust of the Guru's feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਗੁਰੂ ਕੇ ਚਰਨੋਂ ਕੀ ਧੂੜ (ਰਵਾਲ) ਥੋੜੇ ਮਾਤ੍ਰ ਲੈਣੀ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ਲੈ ਕੇ (ਆਪਣੇ ਮੱਥੇ ਉੱਤੇ ਲਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੇ = ਲੈ, (ਆਪਣੇ ਮੱਥੇ ਉਤੇ ਲਾ) ਲੈ। ਗੁਰ ਪਗ ਰੇਨ = ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ। ਗੁਰ ਪਗ ਰਵਾਲ = ਗੁਰੂ ਦੇ ਕਦਮਾਂ ਦੀ ਖ਼ਾਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De esta forma tus aflicciones y tu pobreza espiritual desaparecerán y serás bendecido con la Mirada de Gracia del Señor."