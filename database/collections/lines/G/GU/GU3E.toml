[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਮੋਹਿ; ਮੂਠਾ ਹੈ ਮੂੜੁ ॥"
page = 1139
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the love of the worldly valuables, the fool is defrauded."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰੀ ਪਦਾਰਥਾਂ ਦੇ ਪਿਆਰ ਅੰਦਰ ਮੂਰਖ ਠੱਗਿਆ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In love and attachment to Maya, the fool is plundered."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਮੁੜ) ਮੂਰਖ ਜੀਵ ਮਾਇਆ ਮੋਹ ਕਰ ਠਗਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੂਰਖ ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਫਸ ਕੇ (ਆਪਣੀ ਆਤਮਕ ਰਾਜ-ਪੂੰਜੀ) ਲੁਟਾਈ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਿ = ਮੋਹ ਵਿਚ। ਮੂਠਾ ਹੈ = ਠੱਗਿਆ ਜਾ ਰਿਹਾ ਹੈ। ਮੂੜੁ = ਮੂਰਖ ਮਨੁੱਖ {ਇਕ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues el tonto, es engañado por el amor a Maya,"