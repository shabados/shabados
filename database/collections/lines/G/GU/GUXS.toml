[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪੂਜਹੁ ਗਊਅਨ ਅਉ ਮੁਖ ਬਿਪਨ; ਭਈਅਨ ਸੋ ਇਹ ਆਇਸੁ ਕੀਆ ॥"
page = 327

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Agreeing with Krishna, Nand called all the gopas and said, “Worship the Brahmins and the cows,”"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਫਿਰ ਸਾਰਿਆਂ) ਭਰਾਵਾਂ ਨੂੰ ਇਹ ਆਗਿਆ ਕੀਤੀ ਕਿ ਗਊਆਂ ਅਤੇ ਬ੍ਰਾਹਮਣਾਂ ਦੇ ਮੁਖ (ਦੀ ਭੋਜਨ ਦੁਆਰਾ) ਪੂਜਾ ਕਰੋ।"