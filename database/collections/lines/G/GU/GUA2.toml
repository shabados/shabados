[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਣ ਕਰਾਵਨਹਾਰ; ਸੁਆਮੀ ॥"
page = 178
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Doer and Prompter of deeds is the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੰਮਾਂ ਦੇ ਕਰਨ ਵਾਲਾ ਤੇ ਕਰਾਉਣ ਵਾਲਾ ਪ੍ਰਭੂ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Our Lord and Master is the One who acts, and causes others to act."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਰਨ ਕਰਾਵਨੇ ਵਾਲਾ ਜੋ ਸੁਆਮੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਲਕ-ਪ੍ਰਭੂ (ਸਭ ਜੀਵਾਂ ਵਿਚ ਵਿਆਪਕ ਹੋ ਕੇ ਆਪ ਹੀ) ਸਭ ਕੁਝ ਕਰਨ ਦੇ ਸਮਰੱਥ ਹੈ, ਆਪ ਹੀ ਜੀਵਾਂ ਪਾਸੋਂ ਸਭ ਕੁਝ ਕਰਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਣਹਾਰ = ਕਰਨ ਦੇ ਸਮਰੱਥ। ਕਰਾਵਨਹਾਰ = ਜੀਵਾਂ ਪਾਸੋਂ ਕਰਾਣ ਦੀ ਤਾਕਤ ਰੱਖਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Solamente el Maestro hace y hace que otros hagan;"