[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਗਰ ਮੇਰ ਉਦਿਆਨ ਬਨ; ਨਵ ਖੰਡ ਬਸੁਧਾ ਭਰਮ ॥"
page = 1364
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The oceans, mountains, wildernesses, forests, nine regions of the earth and doubts shall all be crossed over,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਮੁੰਦਰ, ਪਹਾੜ, ਬੀਆਬਾਨ ਜੰਗਲ, ਧਰਤੀ ਦੇ ਲੌ ਖਿਤੇ ਅਤੇ ਭਰਮ ਨੂੰ ਪਾਰ ਕਰ ਲਵੇਗਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I would cross the oceans, mountains, wilderness, forests and the nine regions of the earth in a single step,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਮੁੰਦ੍ਰ ਔ ਸੁਮੇਰ ਪਰਬਤ ਔਰ ਜੋ (ਉਦਿਆਨ) ਉਜਾੜ ਹੈ, ਪੁਨਾ (ਬਨ) ਬਾਗੋਂ ਮੇਂ ਔ ਨਵਖੰਡ (ਬਸੁਧਾ) ਧਰਤੀ ਮੇਂ ਜੋ (ਭਰਮ) ਫਿਰਨਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਮੁੰਦਰ, ਪਰਬਤ, ਜੰਗਲ, ਸਾਰੀ ਧਰਤੀ-(ਇਹਨਾਂ ਦੀ ਜਾਤ੍ਰਾ ਆਦਿਕ ਦੀ ਖ਼ਾਤਰ) ਭ੍ਰਮਣ ਕਰਨ ਵਿਚ ਹੀ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਗਰ = ਸਮੁੰਦਰ। ਮੇਰ = ਸੁਮੇਰ ਆਦਿਕ ਪਹਾੜ। ਉਦਿਆਨ = ਜੰਗਲ। ਬਨ = ਜੰਗਲ। ਬਸੁਧਾ = ਧਰਤੀ। ਨਵ ਖੰਡ = ਨੌ ਟੋਟੇ, ਨੌ ਹਿੱਸੇ। ਨਵ ਖੰਡ ਬਸੁਧਾ = ਨੌ ਹਿੱਸਿਆਂ ਵਾਲੀ ਧਰਤੀ, ਸਾਰੀ ਧਰਤੀ। ਭਰਮ = ਭ੍ਰਮਣ, ਤੁਰੇ ਫਿਰਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cruzaría los océanos, montañas, regiones salvajes, bosques, y las nueve regiones de la Tierra de un solo salto,"