[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਨੋ ਮੇਲੇ. ਸੋ ਮਿਲੈ; ਹਉ. ਤਿਸੁ ਬਲਿਹਾਰੈ ਜਾਉ ॥"
page = 39
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He whom God unites, meets Him. I am a sacrifice unto such a person."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ, ਵਾਹਿਗੁਰੂ ਮਿਲਾਉਂਦਾ ਹੈ, ਉਹ ਹੀ ਉਸ ਨੂੰ ਮਿਲਦਾ ਹੈ। ਮੈਂ ਐਸੇ ਪੁਰਸ਼ ਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to those who meet and merge with the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਜਿਸ ਕੋ ਵਾਹਿਗੁਰੂ ਗੁਰੋਂ ਕੇ ਸਾਥ ਮਿਲਾਉਨਾ ਚਾਹੁਤਾ ਹੈ, ਸੋ ਪੁਰਸ ਗੁਰੋਂ ਕੇ ਸਾਥ ਮਿਲਤਾ ਹੈ, ਮੈਂ ਐਸੇ ਪੁਰਸ ਕੇ ਬਲਿਹਾਰ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਜੀਵਾਂ ਦੇ ਭੀ ਕੀਹ ਵੱਸ?) ਜਿਸ (ਭਾਗਾਂ ਵਾਲੇ ਮਨੁੱਖ ਨੂੰ ਪ੍ਰਭੂ (ਆਪਣੇ ਚਰਨਾਂ ਵਿਚ) ਜੋੜਦਾ ਹੈ, ਉਹੀ ਪ੍ਰਭੂ ਨੂੰ ਮਿਲਦਾ ਹੈ। ਮੈਂ ਅਜੇਹੇ ਬੰਦੇ ਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਉ = ਜਾਉਂ, ਮੈਂ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi vida en sacrificio a aquéllos que el Señor ha unido en Sí Mismo."