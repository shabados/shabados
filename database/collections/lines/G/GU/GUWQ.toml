[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਕੇ ਤਾਪ, ਤਨਕ ਮੋ ਹਰਿਹੋ ॥"
page = 1388

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Upon whomsoever Thou dost cast Thy favourable glance, they are absolved of sins instantly"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੇ (ਸਾਰੇ) ਦੁਖ ਛਿਣ ਵਿਚ ਹਰੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਤਾ ਕੇ ਤਾਪ; ਤਨਕ ਮਹਿ ਹਰਿਹੋ ॥"