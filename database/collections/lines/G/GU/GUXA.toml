[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਕਤੈ ਬਕਿ; ਸਬਦੁ ਸੁਨਾਇਆ ॥"
page = 972
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Guru, the utterer, has uttered and preached the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਪਦੇਸ਼ ਕਰਨ ਵਾਲੇ, ਗੁਰਦੇਵ ਨੇ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਅਤੇ ਪ੍ਰਚਾਰ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Speaker has spoken, and proclaimed the Word of the Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋਗੀ ਗੁਰੂ ਨੇ ਜਬ ਕਹ ਕਰ ਉਪਦੇਸ ਸੁਨਾਇਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਪਦੇਸ਼ ਕਰਨ ਵਾਲੇ ਸਤਿਗੁਰੂ ਨੇ ਜਿਸ ਨੂੰ ਆਪਣਾ ਸ਼ਬਦ ਸੁਣਾਇਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਕਤੈ = ਉਪਦੇਸ਼ ਕਰਨ ਵਾਲੇ (ਗੁਰੂ) ਨੇ। ਬਕਿ = ਬੋਲ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru, el Recitador, recita la Palabra,"