[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕੁ ਨੀਚੁ ਕਹੈ; ਬੀਚਾਰੁ ॥"
page = 24
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak the lowly sayeth this thought."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨੀਵਾਂ ਨਾਨਕ ਇਹ ਵੀਚਾਰ ਕਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak describes the state of the lowly."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਇਸ ਪ੍ਰਕਾਰ ਨੀਚੁ ਅਰਥਾਤ ਨਮ੍ਰ ਹੂਆ ਹੂਆ ਮੇਂ ਏਹਿ ਵਿਚਾਰ ਕਰ ਕਹਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੰਦ-ਕਰਮੀ ਨਾਨਕ ਇਹੀ ਗੱਲ ਆਖਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੀਚੁ = ਮੰਦ-ਕਰਮੀ। ਕਰਤਾਰ = ਹੇ ਕਰਤਾਰ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = ". Dice Nanak, el más humilde, después de mucho pensar:"