[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਬਲਿਹਾਰੀ ਤਿਨ ਕਉ; ਸਿਫਤਿ ਜਿਨਾ ਦੈ ਵਾਤਿ ॥"
page = 790
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am a sacrifice unto those, within whose mouth is the Lord's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਨ੍ਹਾਂ ਉਤੋਂ ਘੋਲੀ ਜਾਂਦਾ ਹਾਂ ਜਿਨ੍ਹਾਂ ਦੇ ਮੂੰਹ ਵਿੱਚ ਸੁਆਮੀ ਦੀ ਸਿਫ਼ਤ ਸ਼ਲਾਘਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to those who praise the Lord with their mouths."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੇ ਮੁਖੋਂ ਉਸਤਤੀ ਉਚਾਰਣ ਹੋਤੀ ਹੈ, ਤਿਨ ਕੇ ਮੈਂ ਬਲਿਹਾਰ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਦਕੇ ਹਾਂ ਉਹਨਾਂ ਤੋਂ ਜਿਨ੍ਹਾਂ ਦੇ ਮੂੰਹ ਵਿਚ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੈ = ਦੇ। ਵਾਤਿ = ਵਾਤ ਵਿਚ, ਮੂੰਹ ਵਿਚ। {ਨੋਟ: ਲਫ਼ਜ਼ 'ਦੇ' ਅਤੇ 'ਕੇ' ਤੋਂ 'ਦੈ' ਅਤੇ 'ਕੈ' ਕਿਉਂ ਬਣ ਜਾਂਦਾ ਹੈ, ਇਹ ਸਮਝਣ ਲਈ ਵੇਖੋ \"ਗੁਰਬਾਣੀ ਵਿਆਕਰਣ\"}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi ser en sacrificio a aquéllos en cuyos labios vive el Nombre del Señor,"