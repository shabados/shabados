[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਨਿ ਮੇਰੀ ਮਨਸਾ. ਮਨੈ ਮਾਹਿ; ਸਤਿ ਦੇਖੁ ਬੀਚਾਰਿ ॥"
page = 808
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hear me, O man, behold and consider the True Lord in they mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਗੱਲ ਸੁਣ, ਹੇ ਇਨਸਾਨ! ਸੱਚੇ ਸਾਹਿਬ ਨੂੰ ਆਪਣੇ ਹਿਰਦੇ ਅੰਦਰ ਵੇਖ ਅਤੇ ਵੀਚਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen to me, people: behold, and consider this within your mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹਮਾਰੀ ਮਨਸਾ ਸਿਖ੍ਯਾ ਕੋ ਸ੍ਰਵਨ ਕਰ ਔ ਮਨ ਮੇਂ ਬੀਚਾਰ ਕਰ ਕੇ ਸਤਿ ਕੋ ਦੇਖ ਅਰ ਮਿਥਿਆ ਤੋ ਤਿਆਗ ਜਗਤ ਕੀ ਮਿਥਤਾ ਦੇਖਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ ਦੇ ਫੁਰਨੇ! (ਹੇ ਮੇਰੇ ਭਟਕਦੇ ਮਨ!) ਧਿਆਨ ਨਾਲ ਸੁਣ। ਵਿਚਾਰ ਕੇ ਵੇਖ ਲੈ, (ਇਹ) ਸੱਚ (ਹੈ ਕਿ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਸਾ = {मनीषा = ਮਨ ਦਾ ਫੁਰਨਾ} ਹੇ ਮੇਰੇ ਮਨ! ਮਨੈ ਮਾਹਿ = ਮਨ ਵਿਚ ਹੀ, ਧਿਆਨ ਨਾਲ। ਸਤਿ = ਸੱਚ। ਬੀਚਾਰਿ = ਵਿਚਾਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escuchen, oh mis deseos, si la mente medita en la Verdad del Señor,"