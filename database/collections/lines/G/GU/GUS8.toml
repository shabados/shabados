[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਬਖਸ ਕਰਾਇਦਾ ਪਿਆਰਾ; ਆਪੇ ਸਚੁ ਨੀਸਾਣੁ ॥"
page = 606
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Himself, the Dear Lord, obeys His will, and Himself He gives the command."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਿਆਰਾ ਪ੍ਰਭੂ ਆਪ ਰਜਾ ਦੀ ਪਾਲਣਾ ਕਰਦਾ ਹੈ ਅਤੇ ਆਪ ਹੀ ਹੁਕਮ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Beloved Himself grants His forgiveness, and He Himself bestows the Insignia of Truth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਪਿਆਰਾ ਗੁਰੋਂ ਸੇ ਬਖਸਿਸ ਕਰਾਉਤਾ ਹੈ ਅਰ ਆਪੇ ਹੀ ਨਾਮ ਰੂਪੀ ਸਚਾ (ਨੀਸਾਣੁ) ਪਰਵਾਨਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਹੀ ਸਭ ਉਤੇ ਬਖ਼ਸ਼ਸ਼ ਕਰਦਾ ਹੈ, ਉਹ ਆਪ ਹੀ (ਜੀਵਾਂ ਵਾਸਤੇ) ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਚਾਨਣ-ਮੁਨਾਰਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਖਸ = ਬਖ਼ਸ਼ਸ਼। ਸਚੁ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ। ਨੀਸਾਣੁ = ਨਿਸ਼ਾਨ, ਝੰਡਾ, ਚਾਨਣ-ਮੁਨਾਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo bendice a todos; Él es Quien nos aprueba con la Insignia de la Verdad."