[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ ਕੋ ਸਿਖੁ; ਗੁਰੂ ਸੇਤੀ ਸਨਮੁਖੁ ਹੋਵੈ ॥"
page = 919
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If any disciple becomes truly faithful to the Guru;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਕੋਈ ਮੁਰੀਦ ਗੁਰਾਂ ਦਾ ਸੱਚਾ ਅਗਿਆਦਾਰੀ ਹੋ ਜਾਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If a Sikh turns to the Guru with sincere faith, as sunmukh"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੋਈ ਗੁਰੋਂ ਕਾ ਸਿਖ ਗੁਰੋਂ ਕੇ ਸਾਥ ਸਨਮੁਖ ਹੋਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋਈ ਸਿੱਖ ਗੁਰੂ ਦੇ ਸਾਹਮਣੇ ਸੁਰਖ਼ਰੂ ਹੋਣਾ ਚਾਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਤੀ = ਨਾਲ। ਸਨਮੁਖੁ = ਸਾਹਮਣੇ ਮੂੰਹ ਰੱਖ ਸਕਣ ਵਾਲਾ, ਸੁਰਖ਼ਰੂ। ਹੋਵੈ = ਹੋਣਾ ਚਾਹੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si un Sikj voltea hacia el Guru, con Fe sincera, como Sunmukj,"