[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਜੈ ਲਾਗੇ; ਮਨਮੁਖਿ ਰੋਇ ॥"
page = 1049
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Attached to duality, the egocentrics bewail in the end."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਵੈਤ-ਭਾਵ ਨਾਲ ਜੁੜੇ ਹੋਏ ਆਪ-ਹੁਦਰੇ ਅੰਤ ਨੂੰ ਵਿਰਲਾਪ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The self-willed manmukhs, attached to duality, weep and wail."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਦ੍ਵੈਤ ਮੇਂ ਲਾਗੇ ਹੈਂ ਵਹੁ ਮਨਮੁਖ ਰੋਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਲੱਗ ਕੇ ਮਨ ਦਾ ਮੁਰੀਦ ਜੀਵ ਦੁੱਖੀ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਜੈ = ਮਾਇਆ ਵਿਚ। ਲਾਗੇ = ਲਾਗਿ, ਲੱਗ ਕੇ। ਮਨਮੁਖਿ = ਮਨ ਦਾ ਮੁਰੀਦ ਮਨੁੱਖ। ਰੋਇ = ਰੋਂਦਾ ਹੈ, ਦੁੱਖੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, los ególatras, que están apegados al otro, sufren y se acongojan al final."