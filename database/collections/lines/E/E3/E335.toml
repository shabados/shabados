[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੋਗ ਸੋਗ ਮਿਟੇ; ਪ੍ਰਭ ਧਿਆਏ ॥"
page = 866
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Dwelling on the Lord, ills and woes are annulled;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦਾ ਸਿਮਰਨ ਕਰਨ ਨਾਲ ਬੀਮਾਰੀ ਦੇ ਸ਼ੋਕ ਮਿਟ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Illnesses and pains are dispelled, meditating on God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰੇ (ਧਿਆਏ) ਧਿਆਨ ਸੇ ਰੋਗ ਸੋਗ ਸਭ ਮਿਟ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਇਸ ਨਾਮ ਨੂੰ ਸਿਮਰਦਾ ਹੈ, ਉਸ ਦੇ ਸਾਰੇ ਰੋਗ ਸਾਰੇ ਚਿੰਤਾ-ਫ਼ਿਕਰ ਮਿਟ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਗ = ਚਿੰਤਾ-ਫ਼ਿਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Meditando en el Ser Supremo,"