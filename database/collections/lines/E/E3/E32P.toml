[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੈ ਗ੍ਰਿਹਿ; ਸੇਵਕੁ ਜੋ ਰਹੈ ॥"
page = 286
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The servant who lives in Guru's house,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਟਹਿਲੂਆ ਗੁਰਾਂ ਦੇ ਘਰ ਵਿੱਚ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That selfless servant, who lives in the Guru's household,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੇਵਕ ਗੁਰੋਂ ਕੇ ਗ੍ਰਹਿ ਮੇਂ ਨਿਵਾਸ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਸੇਵਕ (ਸਿੱਖਿਆ ਦੀ ਖ਼ਾਤਰ) ਗੁਰੂ ਦੇ ਘਰ ਵਿਚ (ਭਾਵ ਗੁਰੂ ਦੇ ਦਰ ਤੇ) ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗ੍ਰਿਹਿ = ਘਰ ਵਿਚ। ਗੁਰ ਕੈ ਗ੍ਰਿਹਿ = ਗੁਰੂ ਦੇ ਘਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquel Gurmukj que viva en Casa del Guru,"