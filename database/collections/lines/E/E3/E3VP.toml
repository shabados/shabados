[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਰਕਿਰਤੀ ਹੂ ਬਾਹਰਾ; ਗੁਰਮੁਖਿ ਵਿਰਲੋਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Any rare gurmukh remains away from the effects of maya."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਰਥ ਥੋਂ ਬਾਹਰ ਵਿਰਲੇ ਗੁਰਮੁਖ ਹਨ।"