[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੁ ਅਮਰਦਾਸੁ ਨਿਜ ਭਗਤੁ ਹੈ; ਦੇਖਿ ਦਰਸੁ ਪਾਵਉ ਮੁਕਤਿ ॥੪॥੧੩॥"
page = 1394
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Guru Amar Dass is the Lord's own saint, seeing whose vision, one is blessed with emancipated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਪ੍ਰਭੂ ਦੇ ਨਿਜ ਦੇ ਸੰਤ ਹਨ, ਜਿਨ੍ਹਾਂ ਦਾ ਦਰਸ਼ਨ ਵੇਖ ਇਨਸਾਨ ਨੂੰ ਕਲਿਆਣ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Guru Amar Daas is the Lord's own devotee; gazing upon the Blessed Vision of His Darshan, one is liberated. ||4||13||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਸ੍ਰੀ ਗੁਰੂ ਅਮਰਦਾਸ ਸਾਹਿਬ ਜੀ! ਆਪ ਭਗਤੀ ਕਾ ਅਵਤਾਰ ਭਏ ਹੈਂ। ਆਪ ਕੇ ਦਰਸਨ ਕੋ ਦੇਖ ਕਰ ਮੈਂ ਭੀ ਮੁਕਤੀ ਕੋ ਪਾਵੋਂਗਾ॥੪॥੧੩॥☬ਸਤਿਗੁਰੋਂ ਕੀ ਮਹਿਮਾ ਜਨਾਵਤਾ ਹੂੰ॥ ਜਾਲਪ ਨਾਮ ਭੱਟ ਕਹਿਤਾ ਹੈ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਅਮਰਦਾਸ ਅਕਾਲ ਪੁਰਖ ਦਾ ਪਿਆਰਾ ਭਗਤ ਹੈ। ਮੈਂ (ਉਸ ਦਾ) ਦਰਸ਼ਨ ਦੇਖ ਕੇ ਵਿਕਾਰਾਂ ਤੋਂ ਖ਼ਲਾਸੀ ਹਾਸਲ ਕਰਦਾ ਹਾਂ ॥੪॥੧੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਜ ਭਗਤੁ = ਅਕਾਲ ਪੁਰਖ ਦਾ ਆਪਣਾ ਭਗਤ। ਦੇਖਿ = ਵੇਖ ਕੇ। ਪਾਵਉ = ਮੈਂ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹਾਂ ॥੪॥੧੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Guru Amar Das es el Propio Devoto del Señor, teniendo la Bendita Visión de Su Darshan uno es liberado. (4-13)"