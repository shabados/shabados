type = "primary"
data = "ਦਸ ਚਾਰਿ ਚਾਰਿ ਨਿਧਾਨਿ ॥੮੭॥"
page = 633

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The charming damsel caught the garland in her hand and put it around the neck of the king, expert in eighteen sciences.87."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਅਠਾਰ੍ਹਾਂ ਨਿਧੀਆਂ ਦਾ ਸੁਆਮੀ ਸੀ ॥੮੭॥"