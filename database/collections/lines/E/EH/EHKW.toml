[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਚੀਨਹੁ ਚਤੁਰ, ਨਿਧਾਨ ॥੬੦੨॥"
page = 745

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the words “Taru-ripu-ari-dhanani” and then adding “Ripu”, O wise men! recognize the names of Tupak.602."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਹ ਨਾਮ ਤੁਪਕ ਦਾ ਹੋ ਜਾਵੇਗਾ। ਚਤੁਰੋ! ਸਮਝ ਲਵੋ ॥੬੦੨॥"