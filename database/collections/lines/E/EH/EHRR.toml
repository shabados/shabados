[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦ੍ਰਿਸਟਿ ਆਵੈ; ਸਭੁ ਏਕੰਕਾਰੁ ॥੨॥"
page = 189
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and he sees the One Lord everywhere."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਹ ਹਰ ਥਾਂ ਇਕ ਸੁਆਮੀ ਨੂੰ ਹੀ ਤੱਕਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and the One Lord is seen everywhere. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਸਰਬ ਮੇਂ ਏਕ ਪਰਮੇਸ੍ਵਰ ਦ੍ਰਿਸਟਿ ਆਵਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਰਹਿਣ ਵਾਲੇ ਮਨੁੱਖ ਨੂੰ) ਹਰ ਥਾਂ ਇਕ ਪਰਮਾਤਮਾ ਹੀ ਨਜ਼ਰੀਂ ਆਉਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦ੍ਰਿਸਟਿ ਆਵੈ = ਦਿੱਸਦਾ ਹੈ। ਸਭੁ = ਹਰ ਥਾਂ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y por encima y dentro de todo, uno ve sólo al Uno, el Absoluto.  (2)"