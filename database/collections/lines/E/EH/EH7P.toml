[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਨਾਮ ਧਨੁ; ਸੰਗਿ ਸਖਾਈ ॥"
page = 416
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The wealth of the Lord's Name is my companion and helper."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਪਦਾਰਥ ਮੇਰਾ ਸੰਗੀ ਅਤੇ ਸਹਾਇਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The wealth of the Lord's Name is my Companion and Helper."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਮ ਨਾਮ ਧਨ ਪ੍ਰਲੋਕ ਮੇਂ ਤਿਸ ਕੇ ਸੰਗ ਸਹਾਈ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਧਨ ਹੀ ਮਨੁੱਖ ਦੇ ਨਾਲ ਅਸਲ ਸਾਥੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗਿ = (ਜੀਵ ਦੇ) ਨਾਲ। ਸਖਾਈ = ਸਾਥੀ, ਮਿੱਤਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cómo puede uno obtener el Nombre sin el Guru? Las Riquezas del Naam, el Nombre del Señor siempre nos acompañan,"