[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੰਠਿ ਲਗਾਇ ਲੀਏ ਜਨ ਅਪੁਨੇ; ਰਾਮ ਨਾਮ ਉਰਿ ਧਾਰਿਆ ॥"
page = 782
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord hugs to His neck His slave, who clasp the Lord's Name to their heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਗੋਲਿਆਂ ਨੂੰ, ਜੋ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਨੂੰ ਆਪਣੇ ਦਿਲ ਨਾਲ ਲਾਈ ਰੱਖਦੇ ਹਨ, ਪ੍ਰਭੂ ਆਪਣੇ ਗਲ ਨਾਲ ਲਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He hugs His humble servants close in His Loving Embrace; they enshrine the Lord's Name in their hearts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਰਾਮ ਕਾ ਨਾਮ ਰਿਦੇ ਮੇਂ ਧਾਰਿਆ ਹੈ, ਸੋ ਦਾਸ ਅਪਨੇ ਜਾਨ ਕੇ ਕੰਠ ਸਾਥ ਲਗਾਇ ਲੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਜੀ ਆਪਣੇ ਸੇਵਕ ਨੂੰ (ਆਪਣੇ) ਗਲ ਨਾਲ ਲਾ ਲੈਂਦੇ ਹਨ, (ਉਹਨਾਂ ਦੇ) ਹਿਰਦੇ ਵਿਚ ਆਪਣਾ ਨਾਮ ਵਸਾ ਦੇਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੰਠਿ = ਗਲ ਨਾਲ। ਉਰਿ = ਹਿਰਦੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me ha hecho Suyo llevándome a Su Pecho y así enaltezco Su Nombre en mí interior."