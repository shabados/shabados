[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਈਸਰਾਸਤ੍ਰ ਪੁਨਿ ਭਾਖੀਐ; ਨਾਮ ਪਾਸਿ ਪਹਿਚਾਨ ॥੩੫੭॥"
page = 733

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying primarily the owrd “Vanitaa” and then uttering “Niddhi Ishraastra”, the names of Pash are recognized.357."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਫਿਰ 'ਈਸਰਾਸਤ੍ਰ' ਪਦ ਜੋੜੋ। (ਇਨ੍ਹਾਂ ਨੂੰ) ਪਾਸ ਦੇ ਨਾਮ ਪਛਾਣ ਲਵੋ ॥੩੫੭॥"