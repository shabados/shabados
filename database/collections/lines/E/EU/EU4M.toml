[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਹਮ ਕਰਹ; ਜੁ ਆਪਿ ਕਰਾਏ ॥੪॥"
page = 494
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and I do that which He Himself makes me to do,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜਿਸ ਨੂੰ ਉਹ ਆਪ ਮੇਰੇ ਕੋਲੋਂ ਦਰਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I do that which He makes me to do. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਹਮ ਕਰਤੇ ਹੈਂ ਔ ਜੋ ਆਪ ਹਰਿ ਹਮ ਸੇ ਆਗੇ ਕਰਾਏਗਾ ਸੋ ਕਰੇਂਗੇ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਕੰਮ-ਕਾਰ ਪਰਮਾਤਮਾ ਸਾਥੋਂ ਕਰਾਂਦਾ ਹੈ, ਅਸੀਂ ਉਹੀ ਕੰਮ-ਕਾਰ ਕਰਦੇ ਹਾਂ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਮ = ਸਾਨੂੰ। ਕਰਹ = ਅਸੀਂ ਕਰਦੇ ਹਾਂ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues Él no nos deja hacer otra cosa. (4)"