[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਸੇਖ ਜੁਧ ਮੰਡ ਹੈ; ਅਸੇਖ ਸਸਤ੍ਰ ਬਾਜ ਹੈਂ ॥੩੮੭॥"
page = 589

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After killing the forces, the warriors are thundering and in the dreadful fight, their weapons are colliding.387."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵਿਸ਼ੇਸ਼ ਯੁੱਧ ਮੰਡਿਆ ਹੋਇਆ ਹੈ ਅਤੇ ਬੇਅੰਤ ਸ਼ਸਤ੍ਰ ਵਜ ਰਹੇ ਹਨ ॥੩੮੭॥"