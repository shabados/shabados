[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਆਪਿ; ਆਪਿ ਪ੍ਰਭੁ ਸੋਇ ॥"
page = 279
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That Master is all by Himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਾਲਕ ਸਾਰਾ ਕੁਝ ਖੁਦ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God Himself, of Himself, is unto Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪ੍ਰਭੂ ਤੀਨੋਂ ਕਾਲ ਮੇਂ ਆਪ ਹੀ ਆਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ ਆਪ ਹੀ ਆਪ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En verdad el Señor es el Único,"