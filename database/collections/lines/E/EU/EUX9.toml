[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਇਆਲ ਪੁਰਖ; ਪਰਗਟ ਪਰਤਾਪ ॥"
page = 890
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Manifest is the glory of the Merciful Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜ਼ਾਹਰਾ ਜ਼ਹੂਰ ਹੈ ਤਪ ਤੇਜ, ਮਿਹਰਬਾਨ ਮਾਲਕ ਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The glory of the Merciful Lord is radiant and manifest."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਦਯਾ ਕਾ ਘਰ ਹੈ ਔਰ ਤਿਸ ਕਾ ਪ੍ਰਤਾਪ ਪ੍ਰਗਟ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦਇਆ ਦੇ ਸੋਮੇ ਅਕਾਲ ਪੁਰਖ ਦਾ ਤੇਜ-ਪਰਤਾਪ ਪ੍ਰਤੱਖ (ਹਰ ਥਾਂ ਦਿੱਸ ਰਿਹਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਤਾਪ = ਤੇਜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Compasivo, Cuya Gloria se hace manifiesta,"