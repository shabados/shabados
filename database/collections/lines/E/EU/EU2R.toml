[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਕਛੁ ਪਾਵੈ; ਤਬ. ਗਰਬੁ ਕਰਤੁ ਹੈ ॥"
page = 487
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When he acquires something, he is inflated with ego, then."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਹ ਕੁਝ ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ, ਤਦ ਉਹ ਹੰਕਾਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When he acquires something, he is inflated with ego."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਇਹੁ ਜੀਵ ਕੁਛੁ ਪਾਵਤਾ ਹੈ ਤਬ ਹੰਕਾਰ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ (ਇਸ ਨੂੰ) ਕੁਝ ਧਨ ਮਿਲ ਜਾਂਦਾ ਹੈ ਤਾਂ (ਇਹ) ਅਹੰਕਾਰ ਕਰਨ ਲੱਗ ਪੈਂਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਛੁ = ਕੁਝ ਮਾਇਆ। ਪਾਵੈ = ਹਾਸਲ ਕਰਦਾ ਹੈ। ਗਰਬੁ = ਅਹੰਕਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando logra algo, su ego se infla,"