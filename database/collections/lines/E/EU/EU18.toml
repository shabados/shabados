[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੇਤੜਿਆ ਠਾਠੇਰਿਆ; ਕੇਤੜਿਆਂ ਲੋਹਾਰ ਵਿਚਾਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many are coppersmiths and many are considered ironsmiths."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਈ ਠਠੇਰੇ, ਕਈ ਵਿਚਾਰੇ ਲੋਹਾਰ (ਲੋਹੇ ਦੇ ਕਾਰੀਗਰ)।"