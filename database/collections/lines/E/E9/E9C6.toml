[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਗੁ ਚਲਤ ਹੈ; ਹਮ ਭੀ ਚਲਨਾ ॥"
page = 793
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Our comrades are going, I too must go."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸਾਥੀ ਜਾ ਰਹੇ ਹਨ, ਮੈਂ ਭੀ ਨਿਸਚਿਤ ਹੀ ਤੁਰ ਜਾਣਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Our companions are leaving, and we must leave as well."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਬੂਹ ਸੰਸਾਰ ਜੋ ਚਲਾ ਜਾਤਾ ਹੈ ਹਮ ਨੇ ਭੀ ਇਕ ਦਿਨ ਚਲਨਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਸਾਡਾ ਸਾਥ ਤੁਰਿਆ ਜਾ ਰਿਹਾ ਹੈ, ਅਸਾਂ ਭੀ (ਇਥੋਂ) ਤੁਰ ਜਾਣਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗੁ = ਸਾਥ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mis compañeros se están yendo y yo también tengo que partir."