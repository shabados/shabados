[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬ੍ਰਿਜ ਗੀਤਨ ਕੀ ਅਤਿ ਹਾਸਨ ਸੋ; ਜਹ ਖੇਲਤ ਭੀ ਕਈ ਏਕ ਘਰੀ ॥"
page = 350

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All are continuously playing for a long time, absorbed in laughter and singing songs of Braja"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਜ ਦੇ ਗੀਤਾਂ ਅਤੇ ਹਾਸਿਆਂ ਨਾਲ (ਗੋਪੀਆਂ) ਉਥੇ ਕਈ ਘੜੀਆਂ ਖੇਡਦੀਆਂ ਰਹੀਆਂ ਹਨ।"