[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹ ਆਸਰ; ਪੂਰਨ ਭਏ ਕਾਮ ॥੨॥"
page = 196
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By this support, my affairs have been adjusted."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਆਸਰੇ ਦੁਆਰਾ ਮੇਰੇ ਕਾਰਜ ਰਾਸ ਹੋ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By this Support, my affairs have been resolved. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਆਸਰੇ ਕਰ ਕੇ ਸਰਬ ਕਾਰਜ ਪੂਰਨ ਭਏ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਨਾਮ-ਮੰਤ੍ਰ ਦੇ ਆਸਰੇ ਉਸ ਦੇ ਸਾਰੇ ਮਨੋਰਥ ਪੂਰੇ ਹੋ ਗਏ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਸਰ = ਆਸਰੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y apoyándome en Él, todos mis deseos fueron saciados. (2)"