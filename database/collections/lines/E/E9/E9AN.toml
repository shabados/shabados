[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਸੁ ਜਪਤ; ਸੁਖ ਸਹਜਿ ਨਿਵਾਸੁ ॥੫॥"
page = 236
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By remembering whom one easily dwells in peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ ਬੰਦਾ ਸੁਖੈਨ ਹੀ ਆਰਾਮ ਵਿੱਚ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating on Him, one abides in intuitive peace. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜਿਸ ਕੇ ਜਪਣੇ ਸੇ ਸੁਭਾਵਕ ਹੀ ਸੁਖ ਮੇਂ ਨਿਵਾਸ ਹੂਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਜਿਸ ਦਾ ਨਾਮ ਜਪਿਆਂ ਮਾਨੋ, ਅਨੇਕਾਂ ਬੈਕੁੰਠਾਂ ਦਾ ਨਿਵਾਸ ਹਾਸਲ ਹੋ ਜਾਂਦਾ ਹੈ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜਿ = ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y permanece en Paz y en Equilibrio.(5)"