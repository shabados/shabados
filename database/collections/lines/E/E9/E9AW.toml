[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਈਹਾਂ ਊਹਾਂ; ਚਰਣ ਪੂਜਾਰੇ ॥"
page = 1340
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Here and hereafter, he adores the Lord's feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਏਥੇ ਅਤੇ ਓਥੇ ਉਹ ਪ੍ਰਭੂ ਦੇ ਪੈਰਾਂ ਦੀ ਉਪਾਸ਼ਨਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Here and hereafter, they worship the Lord's Feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਲੋਕ ਮੇਂ ਔਰ ਊਹਾਂ ਪਰਲੋਕ ਮੇਂ ਸਭ ਲੋਕ ਤਿਸ ਕੇ ਪੂਜਾਰੇ ਅਰਥਾਤ ਚਰਨੋਂ ਕੀ ਪੂਜਾ ਕਰਨਹਾਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਨੁੱਖ ਦੀ ਇਸ ਲੋਕ ਅਤੇ ਪਰਲੋਕ ਵਿਚ ਇੱਜ਼ਤ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਈਹਾਂ = ਇਸ ਲੋਕ ਵਿਚ। ਊਹਾਂ = ਪਰਲੋਕ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquí y aquí después ellos alaban los Pies de Su Señor."