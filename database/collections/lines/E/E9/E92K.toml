[[content]]
assets = ["SSKS"]
type = "primary"
data = "ਨਾਮ ਦੋਇ ਪ੍ਰਭ ਏਕ ਟੇਕ ਗੁਰਮੁਖਿ ਠਹਰਾਈ ॥"

[[content]]
assets = ["SSPK"]
type = "translation"
language = "en"
data = "Guru and Gobind though are two different names, in reality He himself is refulgent"

[[content]]
assets = ["SSSK"]
type = "translation"
language = "pa"
data = "ਇਕੋ ਹੀ ਪ੍ਰਭੂ ਦੇ ਦੋ ਨਾਮ ਹਨ। ਗੁਰਮੁਖਾਂ ਨੇ ਏਹੀ ਟੇਕ- ਨਿਸਚਾ ਦ੍ਰਿੜ ਪ੍ਰਪੱਕ ਕਰ ਰਖਿਆ ਹੈ।"