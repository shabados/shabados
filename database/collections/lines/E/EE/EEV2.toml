[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੰਨੈ; ਪਾਵਹਿ ਮੋਖੁ ਦੁਆਰੁ ॥"
page = 3
line = 10

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "\"ਪਾਵਹਿ\" ਦਾ ਕਰਤਾ ਬਹੁਵਚਨ ਹੈ ਇਸ ਕਰਕੇ ਇਸ ਦੀ ਸਿਹਾਰੀ ਤੇ ਹਾਹੇ ਦਾ ਉਚਾਰਨ ਨਾਸਕੀ ਹੈ।"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The obeyer of the Lord's dictates obtains the door of salvation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੀ ਆਗਿਆ ਦਾ ਪਾਲਣ ਕਰਨ ਵਾਲਾ ਮੁਕਤੀ ਦਾ ਦਰਵਾਜ਼ਾ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The faithful find the Door of Liberation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨਨ ਕਰਨ ਹਾਰੇ ਮੁਕਤੀ ਦਾ ਦ੍ਵਾਰ ਗ੍ਯਾਨ ਜੋ ਹੈ, ਸੋ ਪਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਮਨ ਵਿਚ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੀ ਲਗਨ ਲੱਗ ਜਾਏ, ਤਾਂ (ਮਨੁੱਖ) 'ਕੂੜ' ਤੋਂ ਖ਼ਲਾਸੀ ਪਾਣ ਦਾ ਰਾਹ ਲੱਭ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਵਹਿ = ਲੱਭ ਲੈਂਦੇ ਹਨ। ਮੋਖੁ ਦੁਆਰੁ = ਮੁਕਤੀ ਦਾ ਦਰਵਾਜ਼ਾ, 'ਕੂੜ' ਤੋਂ ਖ਼ਲਾਸੀ ਪਾਣ ਦਾ ਰਾਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los fieles hallan la puerta hacia la liberación."