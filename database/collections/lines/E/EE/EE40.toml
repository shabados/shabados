[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਹਮਾਰੈ ਪੂਰਾ ਸਾਹੁ ॥"
page = 1144
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord's Name is my perfect Banker."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਦਾ ਨਾਮ ਮੇਰਾ ਪੂਰਨ ਸ਼ਾਹੂਕਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Naam is my perfect master of wealth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰੇ ਰਿਦੇ ਮੇਂ ਨਾਮ ਹੀ ਪੂਰਾ ਸਾਹੂਕਾਰ ਹੈ; ਵਾ ਨਾਮ ਕਰ ਕੇ ਹਮਾਰੇ ਰਿਦੇ ਪੂਰਾ ਸਾਹੁ ਵਾਹਿਗੁਰੂ ਪ੍ਰਾਪਤ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹੀ (ਮੇਰੇ ਵਾਸਤੇ ਉਹ) ਸ਼ਾਹ ਹੈ ਜਿਸ ਦੇ ਘਰ ਵਿਚ ਕੋਈ ਕਮੀ ਨਹੀਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰਾ ਸਾਹੁ = ਉਹ ਸ਼ਾਹ ਜਿਸ ਦੇ ਘਰ ਵਿਚ ਕੋਈ ਕਿਸੇ ਤਰ੍ਹਾਂ ਦੀ ਕਮੀ ਨਾਹ ਹੋਵੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Nombre es el Perfecto Príncipe Mercader,"