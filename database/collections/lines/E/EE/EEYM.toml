[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛੋਡਿ ਛੋਡਿ ਰੇ; ਬਿਖਿਆ ਕੇ ਰਸੂਆ ॥"
page = 206
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Abandon, abondon, thou O man, the pleasures of sin."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਿਆਗ ਦੇ, ਤਿਆਗ ਦੇ, ਤੂੰ ਹੇ ਬੰਦੇ! ਵਿਸ਼ਿਆਂ ਦੇ ਸੁਆਦ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Give them up - give up the pleasures of corruption;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਾਵਰੇ ਜੀਵ! ਬਿਖਿਓਂ ਕੇ ਰਸੋਂ ਕੋ ਤਿਆਗ ਛੋਡ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮਾਇਆ ਦੇ ਚਸਕੇ ਛੱਡ ਦੇ ਛੱਡ ਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇ = ਹੇ ਭਾਈ! ਬਿਖਿਆ = ਮਾਇਆ। ਰਸੂਆ = ਚਸਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hombre tonto y loco, no te regocijes con el sabor del veneno;"