[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖਸਮੈ ਭਾਵੈ ਸੋ ਕਰੇ; ਮਨਹੁ ਚਿੰਦਿਆ. ਸੋ ਫਲੁ ਪਾਇਸੀ ॥"
page = 471
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who does that what pleases his Master, obtains the fruit his heart desires."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਉਹ ਕੁਛ ਕਰਦਾ ਹੈ, ਜੋ ਉਸ ਦੇ ਮਾਰਗ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ, ਉਹ, ਉਹ ਮੇਵਾ ਹਾਸਲ ਕਰ ਲੈਦਾ ਹੈ, ਜਿਸ ਨੂੰ ਉਸ ਦਾ ਦਿਲ ਲੋੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who acts to please His Lord and Master, obtains the fruits of his mind's desires."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕਰਮ ਸ੍ਵਾਮੀ ਕੋ ਭਾਵਤਾ ਹੈ, ਸੋਈ ਕਰਤਾ ਹੈ, ਸੋ ਸੇਵਕ ਮਨ ਇਛਤ ਫਲ ਪਾਉਤਾ ਹੈ ਵਾ ਪਾਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਸੇਵਕ ਉਹੀ ਕੰਮ ਕਰਦਾ ਹੈ ਜੋ ਖਸਮ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ ਤਾਂ ਉਸ ਨੂੰ ਮਨ-ਭਾਉਂਦਾ ਫਲ ਮਿਲਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਹੁ ਚਿੰਦਿਆ = ਮਨ-ਭਾਉਂਦਾ, ਮਨ-ਇੱਛਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que sigue la Voluntad del Señor, obtiene el deseo de su corazón"