[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਸਾ ਮਾਰਿ; ਮਨ ਮਾਹਿ ਸਮਾਇਆ ॥"
page = 1044
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he silences his desire and merges in the supreme soul."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੀ ਖ਼ਾਹਿਸ਼ ਨੂੰ ਮੇਟ, ਪਰਮ ਆਤਮਾ ਅੰਦਰ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Desires are subdued, and one remains immersed in the mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਮਨਸਾ ਕੋ ਮਾਰ ਕੇ ਗੁਰੋਂ ਕੇ (ਮਨ) ਮੰਤ੍ਰ ਮੇਂ ਸਮਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੇ ਮਨ ਦੇ ਫੁਰਨੇ ਨੂੰ ਮਾਰ ਕੇ ਅੰਤਰ-ਆਤਮੇ ਹੀ ਲੀਨ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਸਾ = {मनीषा} ਮਨ ਦਾ ਫੁਰਨਾ। ਮਾਰਿ = ਮਾਰ ਕੇ। ਮਨ ਮਾਹਿ = ਮਨ ਵਿਚ ਹੀ। ਸਮਾਇਆ = ਲੀਨ ਹੋ ਗਿਆ, ਭਟਕਣੋਂ ਹਟ ਗਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y la Joya del Nombre, así uno calma sus pasiones y la mente se aquieta."