[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹ ਦੇਖਾ; ਤਹ ਅੰਤਰਜਾਮੀ ॥"
page = 1085
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wherever I see, there I see my Lord, the Searcher of hearts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿੱਥੇ ਕਿਤੇ ਮੈਂ ਵੇਖਦਾ ਹਾਂ, ਉਥੇ ਮੈਂ ਦਿਲਾਂ ਦੀਆਂ ਜਾਣਨਹਾਰ ਆਪਣੇ ਸੁਆਮੀ ਨੂੰ ਵੇਖਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wherever I look, there I see the Inner-knower, the Searcher of hearts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਹਾਂ ਸੰਤੋਂ ਨੇ ਦੇਖਿਆ ਹੈ ਤਹਾ ਅੰਤਰਜਾਮੀ ਬਿਆਪਕ ਹੀ ਦੇਖਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੇਕ ਦੇ ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲੇ! ਮੈਂ ਜਿਧਰ ਵੇਖਦਾ ਹਾਂ, ਉਧਰ (ਮੈਨੂੰ ਤੂੰ ਹੀ ਦਿੱਸਦਾ ਹੈਂ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਹ = ਜਿੱਥੇ। ਦੇਖਾ = ਦੇਖਾਂ, ਮੈਂ ਵੇਖਦਾ ਹਾਂ। ਅੰਤਰਜਾਮੀ = ਹੇ ਸਭ ਦੇ ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A donde sea que veo, ahí veo a mi Dios, el Conocedor de lo íntimo de los corazones."