[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਫੇੜੇ ਕਾ ਦੁਖੁ ਸਹੈ ਜੀਉ ॥"
page = 1196
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man suffers pain for the wrought deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੰਦਾ ਕੀਤੇ ਹੋਏ ਕਰਮਾਂ ਦੇ ਬਦਲੇ ਤਕਲੀਫ ਉਠਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The soul suffers in pain for the actions it has committed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੀਉ! (ਫੇੜੇ) ਕੀਏ ਹੂਏ ਕਰਮ ਕਾ ਦੁਖ ਸਹਾਰੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਭਾਵ), ਜੀਵ ਆਪਣੇ ਕੀਤੇ ਮੰਦੇ ਕਰਮਾਂ ਕਰਕੇ ਦੁੱਖ ਸਹਾਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫੇੜੇ = ਕੀਤੇ (ਮੰਦੇ) ਕਰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El dolor de pago de esas consecuencias uno lo tiene que enfrentar"