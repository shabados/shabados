[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਜੇ ਸਰਬ ਆਸਾ ਰਟੈ ਏਕ ਛੰਦੰ ॥"
page = 644

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He had forsaken all the expectations and recited only one mantra"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਆਸਾਂ ਛਡ ਦਿੱਤੀਆਂ ਹਨ, (ਕੇਵਲ) ਇਕ ਛੰਦ (ਅਰਥਾਤ 'ਗੁਰਮੰਤ੍ਰ') ਰਟਦੇ ਹਨ।"