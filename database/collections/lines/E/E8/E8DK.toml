[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਸੀ ਪੁੰਨੂੰ ਦੋਸਤੀ, ਹੁਇ ਜਾਤਿ ਅਜਾਤੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The love of Sassi and Punnü, though of different castes, is everywhere spoken of."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸੱਸੀ ਅਤੇ ਪੁੰਨੂੰ ਜਾਤ ਅਜਾਤ (ਅੱਡੋ ਅੱਡ ਅਣਮਿਲਦੀਆਂ ਜਾਤਾਂ ਦੇ ਹੋਕੇ ਬੀ ਆਪੋ ਵਿਚ) ਪ੍ਰੀਤਵਾਨ ਹੋਏ।"