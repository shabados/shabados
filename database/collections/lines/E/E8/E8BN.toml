[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਕੀ ਸੇਵਾ; ਸਭੁ ਕਿਛੁ ਲਹੈ ॥੧॥"
page = 1182
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through whose service everything is obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਘਾਲ ਰਾਹੀਂ, ਹਰ ਵਸਤੂ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serving Him, everything is obtained. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਜਿਸ ਕੀ ਸੇਵਾ ਸੇ ਇਹ ਜੀਉ ਸਭ ਕਿਛ (ਲਹੈ) ਲੇ ਲੇਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਸੇਵਾ-ਭਗਤੀ ਨਾਲ (ਮਨੁੱਖ) ਹਰੇਕ (ਲੋੜੀਂਦੀ) ਚੀਜ਼ ਹਾਸਲ ਕਰ ਲੈਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭੁ ਕਿਛੁ = ਹਰੇਕ (ਲੋੜੀਂਦੀ) ਚੀਜ਼। ਲਹੈ = (ਮਨੁੱਖ) ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí Sirviéndolo, uno logra todo. (1)"