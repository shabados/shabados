[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਹਜੇ; ਹੋਆ ਸਾਧੂ ਸੰਗੁ ॥"
page = 236
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He easily meets the society of Saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਖੈਨ ਹੀ, ਸਤਿਸੰਗਤ ਨਾਲ ਜੁੜ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They naturally join the Saadh Sangat, the Society of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਸੁਤੇ ਹੀ ਸੰਤੋਂ ਕਾ ਸੰਗ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਹੀ ਉਸ ਨੂੰ ਗੁਰੂ ਦਾ ਮਿਲਾਪ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Equilibrio se encuentra con los Santos, los propios del Señor,"