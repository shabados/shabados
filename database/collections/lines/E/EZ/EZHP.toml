[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਉ ਸਰਣਾਗਤਿ. ਰਹਉ ਪਇਆ ॥੩॥"
page = 1170
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that I may ever abide in Thy refuge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਜੋ ਮੈਂ ਸਦਾ ਹੀ ਤੇਰੀ ਸ਼ਰਣ ਤਾਬੇ ਟਿਕਿਆ ਰਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "May I remain in Your Sanctuary. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਮੇਂ ਸਦੀਵ ਤੇਰੀ ਸਰਣ ਪੜਾ ਰਹੂੰ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਾ ਕਿ) ਮੈਂ ਤੇਰੀ ਸਰਨ ਵਿਚ ਹੀ ਪਿਆ ਰਹਾਂ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਉ = ਤੇਰੀ। ਰਹਉ ਪਇਆ = ਮੈਂ ਪਿਆ ਰਹਾਂ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "para que pueda habitar para siempre en Tu Santuario. (3)"