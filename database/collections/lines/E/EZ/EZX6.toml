[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੁਤ੍ਰ ਕਲਤ੍ਰ ਕਾ; ਕਰਹਿ ਅਹੰਕਾਰੁ ॥"
page = 1196
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man prides on his sons and wife,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੰਦਾ ਆਪਣੇ ਲੜਕਿਆਂ ਅਤੇ ਪਤਨੀ ਦਾ ਹੰਕਾਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The man is so proud of his sons and his wife;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਤ੍ਰ ਔਰ (ਕਲਤ੍ਰ) ਇਸਤ੍ਰੀ ਕਾ ਜੋ ਹੰਕਾਰ ਕਰਤਾ ਹੈ, ਸੋ ਬਿਅਰਥ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਕਾਇਆਂ!) ਤੂੰ ਪੁੱਤਰ ਤੇ ਵਹੁਟੀ ਦਾ ਮਾਣ ਕਰਦੀ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਲਤ੍ਰ = ਇਸਤ੍ਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que siente orgullo por sus hijos o por su esposa,"