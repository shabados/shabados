[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਮ ਕਿਉ ਕਰਿ ਜਪਹ ਇਆਣਿਆ; ਹਰਿ ਤੁਮ ਵਡ ਅਗਮ ਅਗਾਹ ॥"
page = 1314
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How can I, the ignorant one, remember Thee, O God? Thou are Great, Unfathomable and Unweighable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਬੇ-ਸਮਝ, ਕਿਸ ਤਰ੍ਹਾਂ ਤੇਰਾ ਸਿਮਰਨ ਕਰ ਸਕਦਾ ਹਾਂ, ਹੇ ਹਰੀ? ਤੂੰ ਵਿਸ਼ਾਲ, ਬੇਥਾਹ ਅਤੇ ਅਜੋਖ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am ignorant - how can I meditate on You, Lord? You are Great, Unapproachable and Immeasurable."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ (ਇਆਣੇ) ਬਾਲਕ ਕੈਸੇ ਜਪ ਸਕੇਂ? ਹੇ ਹਰੀ! ਤੁਮ ਬਡੇ (ਅਗਮ) ਮਨ ਬਾਣੀ ਕਾ ਪਰਾ ਔਰ (ਅਗਾਹ) ਬੇਅੰਤ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਬਹੁਤ ਅਪਹੁੰਚ ਹੈਂ ਤੇ ਡੂੰਘਾ ਹੈਂ ਅਸੀਂ ਅੰਞਾਣ ਜੀਵ ਤੈਨੂੰ ਕਿਵੇਂ ਜਪ ਸਕਦੇ ਹਾਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਉ ਕਰਿ = ਕਿਵੇਂ? ਜਪਹ = ਅਸੀਂ ਜਪੀਏ। ਇਆਣਿਆ = ਅੰਞਾਣੇ। ਅਗਾਹ = ਅਗਾਧ, (ਉਹ ਸਮੁੰਦਰ) ਜਿਸ ਦੀ ਡੂੰਘਾਈ ਨਾਹ ਲੱਭ ਸਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con mi ignorancia ¿cómo puedo meditar en Ti, oh Señor? Eres Grandioso. Inalcanzable e Inconmensurable."