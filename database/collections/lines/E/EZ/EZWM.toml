[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਣ ਗੋਬਿੰਦ; ਨਿਤ ਰਸਨ ਗਾਇ ॥"
page = 1183
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The praise of the World-Lord sing thou ever with thy tongue."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼੍ਰਿਸ਼ਟੀ ਦੇ ਸੁਆਮੀ ਦੀਆਂ ਸਿਫਤਾਂ, ਤੂੰ ਹਮੇਸ਼ਾਂ ਹੀ ਆਪਣੀ ਜੀਹਭਾ ਨਾਲ ਗਾਇਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So sing the Glorious Praises of the Lord of the Universe with your tongue forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ ਗੋਬਿੰਦ ਕੇ ਗੁਣੋਂ ਕੋ ਨਿਤਾਪ੍ਰਤਿ ਰਸਨਾ ਕਰ ਗਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਗੋਬਿੰਦ ਦੇ ਗੁਣ ਸਦਾ ਆਪਣੀ ਜੀਭ ਨਾਲ ਗਾਇਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸਨ = ਜੀਭ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "reciten entonces oh mis labios, la Alabanza del Señor y el Loto de Nanak también florecerá,"