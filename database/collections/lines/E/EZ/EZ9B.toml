data = "ਕਿ ਬਾਦ੍ਰਿਤ ਬਜੇ ॥੨੮੬॥"
page = 703

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The meditation of the great Sannyasi Shiva has been broken and even he is listening to the thundering of Gandharvas and the playing of the musical instruments.59.286."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵਾਜੇ ਵਜ ਰਹੇ ਹਨ ॥੨੮੬॥"