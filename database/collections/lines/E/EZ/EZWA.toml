[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਇਨਾ ਰੂਪਾ; ਤੁਝ ਪਹਿ ਦਾਮ ॥"
page = 374
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou hast gold, silver and rupees."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਕੋਲ ਸੋਨਾ, ਚਾਂਦੀ ਅਤੇ ਦਮੜੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Gold, silver and wealth may be yours,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪਰ ਤੂੰ ਨਿਰਧਨ ਭੀ ਨਹੀਂ ਹੈ ਸੋਨਾ ਚਾਂਦੀ (ਦਾਮ) ਰੁਪੈ੍ਯਾ ਆਦਿ ਸਭ ਤੇਰੇ ਪਾਸ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਪਾਸ ਸੋਨਾ ਹੈ ਚਾਂਦੀ ਹੈ ਧਨ-ਪਦਾਰਥ ਹੈ (ਹੋਰ ਜੂਨਾਂ ਪਾਸ ਇਹ ਚੀਜ਼ਾਂ ਨਹੀਂ ਹਨ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੂਪਾ = ਚਾਂਦੀ। ਤੁਝ ਪਹਿ = ਤੇਰੇ ਪਾਸ। ਦਾਮ = ਧਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "tienes oro, plata y riquezas,"