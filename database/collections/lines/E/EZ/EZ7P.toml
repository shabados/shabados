[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਸਤਿਗੁਰ ਭੇਟੇ; ਥਾਇ ਨ ਪਾਇ ॥"
page = 314
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without meeting the True Guru he finds no place of rest."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਨੂੰ ਮਿਲਣ ਦੇ ਬਾਝੋਂ ਉਸ ਨੂੰ ਕੋਈ ਭੀ ਆਰਾਮ ਦੀ ਥਾਂ ਨਹੀਂ ਮਿਲਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "without meeting the True Guru, he finds no place of rest."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਕੇ ਮਿਲੇ ਬਿਨਾਂ ਸ੍ਵਰੂਪ ਅਸਥਾਨ ਕੋ ਨਹੀਂ ਪਾਵਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਨੂੰ ਮਿਲਣ ਤੋਂ ਬਿਨਾ (ਦਰਗਾਹ ਵਿਚ) ਕਬੂਲ ਨਹੀਂ ਪੈਂਦਾ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sin encontrar al Verdadero Guru, tampoco encuentra la Paz,"