[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ ਪ੍ਰਭ ਭਏ ਕ੍ਰਿਪਾਲ ॥"
page = 826
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Transcendent Lord Master has become Merciful."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਪ੍ਰਭੂ ਸੁਆਮੀ ਮਿਹਰਬਾਨ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Lord God has become Merciful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਾਰਬ੍ਰਹਮ ਪ੍ਰਭੂ ਅਬ ਹਮਾਰੇ ਪਰ ਕਿਰਪਾਲ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਉਤੇ ਪਰਮਾਤਮਾ ਦਇਆਵਾਨ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕ੍ਰਿਪਾਲ = {ਕ੍ਰਿਪਾ-ਆਲਯ} ਦਇਆਵਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Señor Supremo ha tenido Compasión de mí;"