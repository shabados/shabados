[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਭਾਰੋ ਸੁਆਮੀ ਮੇਰਾ ॥"
page = 629
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art my great Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੈਂਡਾ ਵੱਡਾ ਸਾਹਿਬ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my Great Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰਾ ਸੁਆਮੀ ਅਤੀ ਵਡਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਮੇਰਾ ਵੱਡਾ ਮਾਲਕ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਰੋ = ਵੱਡਾ। ਸੁਆਮੀ = ਮਾਲਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres mi Maestro Grandioso y Bondadoso,"