[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਜੋੜਿ ਵਿਛੋੜੇ ਸੋਈ ॥"
page = 414
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself unites and separates."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਖੁਦ ਹੀ ਮਿਲਾਉਂਦਾ ਅਤੇ ਵਖਰੇ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You Yourself join and separate again."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਤੂੰ ਆਪ ਹੀ ਜੋੜਤਾ ਹੈਂ ਆਪ ਹੀ ਵਿਛੋੜਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਆਪ ਹੀ ਜੀਵਾਂ ਦੇ ਸੰਜੋਗ ਬਣਾਂਦਾ ਹੈ, ਤੇ ਆਪ ਹੀ ਫਿਰ ਵਿਛੋੜਾ ਪਾ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋੜਿ = ਜੋੜ ਕੇ, ਸੰਜੋਗ ਬਣਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú unes a todos Contigo Mismo y luego los separas de Ti;"