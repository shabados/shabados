[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਠਉਰ ਠਉਰ ਨਵ ਮਤ ਚਲੇ; ਉਠਾ ਧਰਮ ਕੋ ਦੌਰ ॥"
page = 559

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "New sects will arise at various places and the impact of dharma will end"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਥਾਂ ਥਾਂ ਤੇ ਨਵੇਂ ਮਤ ਚਲਣਗੇ ਅਤੇ ਧਰਮ ਦਾ ਦੌਰ ਹੀ ਸਮਾਪਤ ਹੋ ਜਾਏਗਾ।"