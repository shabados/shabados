[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇਵਾ ਸੁਰਤਿ. ਨ ਜਾਣਾ ਕਾਈ; ਤੁਮ ਕਰਹੁ ਦਇਆ ਕਿਰਮਾਇਣਾ ॥੧੨॥"
page = 1078
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I know nothing of Thine service and gnosis, My Master, take thou pity on me, a mere worm of Thine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੀ ਟਹਿਲ ਸੇਵਾ ਅਤੇ ਗਿਆਤ ਨੂੰ ਕੁੱਛ ਭੀ ਨਹੀਂ ਜਾਣਦਾ। ਮੈਂਡੇ ਮਾਲਕ, ਤੂੰ ਮੈਂ, ਆਪਦੇ ਤੁੱਛ ਕੀੜੇ, ਉੱਤੇ ਰਹਿਮਤ ਧਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I know nothing about service and awareness; please take pity upon this worm. ||12||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੋ ਸੇਵਾ ਕੀ ਗ੍ਯਾਤ ਕੁਛ ਭੀ ਨਹੀਂ ਜਾਨਤਾ, ਤੁਮ ਮੁਝ ਦਾਸ ਪਰ ਦਇਆ ਕਰਹੁ॥੧੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸੇਵਾ-ਭਗਤੀ ਕਰਨ ਦੀ ਕੋਈ ਸੂਝ ਨਹੀਂ ਜਾਣਦਾ। ਮੈਂ ਨਿਮਾਣੇ ਉੱਤੇ ਤੂੰ ਆਪ ਹੀ ਕਿਰਪਾ ਕਰ ॥੧੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਰਤਿ = ਸੂਝ। ਜਾਣਾ = ਜਾਣਾਂ, ਮੈਂ ਜਾਣਦਾਂ। ਕਾਈ = {ਇਸਤ੍ਰੀ-ਲਿੰਗ ਹੈ। ਪੁਲਿੰਗ ਹੈ 'ਕੋਈ'}। ਕਿਰਮਾਇਣਾ = ਕਿਰਮ ਉੱਤੇ, ਕੀੜੇ ਉਤੇ ॥੧੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Santos, no sé como servirlos, tengan un poco de compasión hacia mí, que soy sólo un gusano. (12)"