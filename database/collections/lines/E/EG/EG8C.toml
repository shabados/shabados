[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਣੇ ਜਨ; ਪ੍ਰਭਿ ਆਪਿ ਰਖੇ ॥"
page = 1183
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His slave, the Lord Himself saves."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਗੋਲਿਆਂ ਦੀ ਸੁਆਮੀ ਆਪੇ ਹੀ ਰੱਖਿਆ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God Himself protects His humble servants."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਣੇ ਦਾਸ ਪ੍ਰਭੂ ਨੇ ਆਪ ਰਾਖੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ ਆਪਣੇ ਸੇਵਕਾਂ ਦੀ ਸਦਾ ਆਪ ਰੱਖਿਆ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨ = ਦਾਸ, ਸੇਵਕ {ਬਹੁ-ਵਚਨ}। ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios Mismo salva a Sus Sirvientes,"