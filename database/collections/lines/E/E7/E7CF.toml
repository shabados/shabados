[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਦਾ ਹੁਕਮੁ; ਮੇਟਿ ਨ ਸਕੈ ਕੋਈ ॥"
page = 118
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His flat no one can undo."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਫੁਰਮਾਨ ਕੋਈ ਮੇਸ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "no one can erase the Hukam of His Command."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਤਿਸ ਕਾ ਹੁਕਮੁ ਕੋਈ ਮੇਟ ਨਹੀਂ ਸਕਤਾ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਭੀ ਜੀਵ ਉਸ ਕਰਤਾਰ ਦਾ ਹੁਕਮ (ਭੀ) ਮੋੜ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸ ਦਾ = {ਲਫ਼ਜ਼ 'ਤਿਸੁ' ਦਾ (ੁ) ਸੰਬੰਧਕ 'ਦਾ' ਦੇ ਕਾਰਨ ਉਡ ਗਿਆ ਹੈ। ਵੇਖੋ 'ਗੁਰਬਾਣੀ ਵਿਆਕਰਣ'}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Jukam de Su Voluntad nadie lo puede borrar."