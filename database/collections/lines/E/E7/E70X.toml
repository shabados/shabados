[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛਾਡਿ ਵਿਡਾਣੀ ਤਾਤਿ; ਮੂੜੇ ॥"
page = 889
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Dismiss thou jealousy of others, O fool."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੋਰਨਾਂ ਨਾਲ ਈਰਖਾ ਕਰਨੀ ਤਿਆਗ ਦੇ, ਹੇ ਮੂਰਖ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Give up your envy of others, you fool!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂੜ! ਬੇਗਾਨੀ ਆਸ ਛੋਡ ਦੇਹ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ! ਦੂਜਿਆਂ ਨਾਲ ਈਰਖਾ ਕਰਨੀ ਛੱਡ ਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾਤਿ = ਈਰਖਾ, ਸਾੜਾ। ਮੂੜੇ = ਹੇ ਮੂਰਖ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh tonto, abandona tu contienda con los demás,"