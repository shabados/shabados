[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੇ ਮੁਸਲੀਧਰ, ਬੁਧਿ ਬਰ, ਸੁਨ ਅਬ ਕਥਾ ਰਸਾਲ ॥੧੭੩੫॥"
page = 471

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The lotus-eyed Krishna said again, “O sagacious Balram! now you listen to the interesting episode,1735"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੁਸਲੀਧਰ! ਹੇ ਸ੍ਰੇਸ਼ਠ ਬੁੱਧੀ ਵਾਲੇ! ਹੁਣ (ਤੂੰ) ਰੋਚਕ ਕਥਾ ਸੁਣ ॥੧੭੩੫॥"