[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਮਲ ਹੋਇ; ਤੁਮੑਾਰੋ ਚੀਤ ॥"
page = 288
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and thy mind shall become pure."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਤੇਰਾ ਮਨ ਪਵਿੱਤ੍ਰ ਹੋ ਜਾਏਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "your consciousness shall become pure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਭਗਤੀ ਸੇ ਤੁਮਾਰਾ ਚਿਤ ਸੁਧ ਹੋ ਜਾਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਤੇਰੀ ਸੁਰਤ ਪਵਿਤ੍ਰ ਹੋਵੇਗੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Adora a Dios devotamente  con el corazon amigo mio,"