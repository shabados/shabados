[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਸਤਿ ਸਰੂਪੁ ਹੈ; ਧਿਆਨ ਮੂਲੁ ਗੁਰ ਮੂਰਤਿ ਜਾਣੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "That the true Guru is the truth incarnate and is the basis of meditation is well known (to gurmukh)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਸਤਿ ਸਰੂਪ ਹੈ, ਧਿਆਨ ਦਾ ਮੁੱਢ ਗੁਰੂ ਦੀ (ਇਸ) ਮੂਰਤ ਨੂੰ (ਗੁਰਮੁਖ) ਜਾਣਦਾ ਹੈ।"