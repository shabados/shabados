[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਸਿਉ ਪ੍ਰੀਤਿ ਛਾਡਿ. ਅਨ ਰਾਤਾ; ਕਾਹੂ ਸਿਰੈ. ਨ ਲਾਵਣਾ ॥੮॥"
page = 1086
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Forsaking His love, thou are imbued with another, This-wise, no end shalt thou reach."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਪ੍ਰੇਮ ਨੂੰ ਤਿਆਗ, ਤੂੰ ਹੋਰਸ ਨਾਲ ਰੰਗਿਆ ਹੋਇਆ ਹੈਂ। ਇਸ ਤਰ੍ਹਾਂ ਤੂੰ ਕਿਸੇ ਕਿਨਾਰੇ ਭੀ ਨਹੀਂ ਲਗਣਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forsaking His Love, you are imbued with another; you shall never achieve your goals like this. ||8||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸਾਥ ਤੌ ਪ੍ਰੀਤੀ ਛੋਡ ਦਈ ਹੈ ਔ ਹੋਰ ਮੇਂ ਤੂੰ ਰਾਤਾ ਹੈਂ। ਇਸ ਪ੍ਰੀਤੀ ਨੇ ਤੇਰੇ ਕੋ ਕਿਸੇ ਸਿਰੇ ਨਹੀਂ ਲਾਵਣਾ ਅਰਥਾਤ ਨਹੀਂ ਪਹੁਚਾਵਣਾ ਹੈ, ਭਾਵ ਤੂੰ ਦੋਨੋ (ਸਿਰੈ) ਦੀਨ ਦੁਨੀ ਤੇ ਗਿਆ ਹੈਂ॥੮॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਮਨੁੱਖ ਉਸ ਪਰਮਾਤਮਾ ਨਾਲ ਪਿਆਰ ਛੱਡ ਕੇ ਹੋਰ ਹੋਰ ਪਦਾਰਥਾਂ ਦੇ ਮੋਹ ਵਿਚ ਮਸਤ ਰਹਿੰਦਾ ਹੈ, ਉਹ ਮਨੁੱਖ ਕਿਸੇ ਪਾਸੇ ਭੀ ਨੇਪਰੇ ਨਹੀਂ ਚੜ੍ਹਦਾ ॥੮॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛਾਡਿ = ਛੱਡ ਕੇ। ਅਨ = {अन्य} ਹੋਰ ਹੋਰ (ਪਦਾਰਥਾਂ ਦੇ ਮੋਹ ਵਿਚ)। ਰਾਤਾ = ਰੱਤਾ, ਮਸਤ। ਕਾਹੂ ਸਿਰੈ = ਕਿਸੇ (ਕੰਮ ਦੇ) ਸਿਰੇ ਤੇ। ਕਾਹੂ...ਲਾਵਣਾ = ਕਿਸੇ ਕੰਮ ਵਿਚ ਸਫਲਤਾ ਨਹੀਂ ਹੁੰਦੀ ॥੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "de Quien nos salvó y nos nutrió en el vientre materno. Entonces ¿quién nos va a llevar a través? (8)"