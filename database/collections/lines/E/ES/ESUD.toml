[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੈ ਭੀ ਸਾਚਾ. ਹੋਸੀ ਸੋਈ ॥"
page = 1060
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Lord is and He shall also be."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚਾ ਸੁਆਮੀ ਹੈ ਅਤੇ ਉਹ ਹੋਵੇਗਾ ਭੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Lord is, and shall always be."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਭੀ ਤੂੰ ਸਾਚਾ ਹੈਂ ਆਗੇ ਭੀ ਤੂੰ (ਸੋਈ) ਤੂੰ ਹੀ ਹੋਸੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਪਰਮਾਤਮਾ ਇਸ ਵੇਲੇ ਭੀ ਮੌਜੂਦ ਹੈ, ਉਹ ਸਦਾ ਕਾਇਮ ਰਹੇਗਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਪਰਮਾਤਮਾ। ਹੋਸੀ = ਕਾਇਮ ਰਹੇਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres Verdad y siempre lo serás, eres Quien ha creado Todo, no, no hay nadie más,"