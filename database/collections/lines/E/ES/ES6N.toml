data = "ਜੇ ਕੋ; ਅਪੁਨੀ ਸੋਭਾ ਲੋਰੈ ॥"
page = 266
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If man desires honour for himself,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋਈ ਆਪਣੇ ਲਈ ਇੱਜ਼ਤ ਆਬਰੂ ਚਾਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If you long for honor for yourself,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋਈ ਅਪਨੀ ਸੋਭਾ ਹੋਈ (ਲੋਰੈ) ਚਾਹਿਤਾ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋਈ ਮਨੁੱਖ ਆਪਣੀ ਸੋਭਾ ਚਾਹੁੰਦਾ ਹੋਵੇ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੋਰੈ = ਚਾਹੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el hombre busca dignidad y reconocimiento,"