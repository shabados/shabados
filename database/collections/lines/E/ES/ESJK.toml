[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਨ ਤ੍ਰਿਪਤਿ ਅਘਾਏ ॥"
page = 1006
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They are sated and satiated perfectly,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੂਰੀ ਤਰ੍ਹਾਂ ਰੱਜ ਤੇ ਧ੍ਰਾਪ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They are perfectly fulfilled and satisfied,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਪੂਰਨ ਕੋ ਜਾਨ ਕੇ ਤ੍ਰਿਪਤਿ ਹੋ ਕੇ ਰਜੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਨ੍ਹਾਂ ਨੂੰ ਨਾਮ-ਲਾਲ ਮਿਲ ਜਾਂਦਾ ਹੈ) ਉਹ ਮਾਇਆ ਦੀ ਤ੍ਰਿਸ਼ਨਾ ਵੱਲੋਂ ਪੂਰਨ ਤੌਰ ਤੇ ਰੱਜੇ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Son saciados y confortados perfectamente,"