[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਿਸਟੁ ਸੁਭਾਈ; ਪਾਇਆ ਮੀਤ ॥"
page = 372
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru, my gentle brother, friend and intercessor,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਸੁਸ਼ੀਲ ਵੀਰ, ਮਿੱਤਰ ਅਤੇ ਵਚੋਲੇ ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my gentle brother, mediator and friend"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਮਿਤ੍ਰ (ਵਿਸਟੁ) ਵਕੀਲ ਸਤਗੁਰੂ (ਸੁਭਾਈ) ਸੋਭਾਇਮਾਨ ਪਾਯਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਦੀ ਮੇਹਰ ਨਾਲ ਮੈਨੂੰ) ਪਿਆਰ-ਭਰੇ ਹਿਰਦੇ ਵਾਲਾ ਵਿਚੋਲਾ ਮਿੱਤਰ ਮਿਲ ਪਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਿਸਟੁ = ਵਕੀਲ, ਵਿਚੋਲਾ। ਸੁਭਾਈ = ਪ੍ਰੇਮ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y así, mediante mi gentil hermano, mi amigo,"