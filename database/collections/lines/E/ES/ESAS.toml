[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਬ ਤੇ ਇਸ ਨੋ; ਸਭੁ ਕਿਛੁ ਸੂਝਿਆ ॥੫॥"
page = 235
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "since then every thing occurs to him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਦੋਂ ਤੋਂ ਉਸ ਨੂੰ ਸਾਰੇ ਕੁਝ ਦੀ ਗਿਆਤ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "he understands everything. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਭੇਦ ਦੂਰ ਹੋ ਗਏ ਤਬ ਹੀ ਇਸ ਕੋ ਸਭ ਕੁਛ ਸੂਝ ਗਿਆ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਇਸ ਨੂੰ (ਸਹੀ ਜੀਵਨ-ਜੁਗਤਿ ਦਾ) ਹਰੇਕ ਅੰਗ ਸੁੱਝ ਪੈਂਦਾ ਹੈ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭੁ ਕਿਛੁ = ਹਰੇਕ ਚੰਗੀ ਜੀਵਨ-ਜੁਗਤਿ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entonces tiene la Visión de la Esencia de todas las cosas. (5)"