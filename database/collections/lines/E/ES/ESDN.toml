[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਿਆਨੁ ਜਨੇਊ; ਧਿਆਨੁ ਕੁਸਪਾਤੀ ॥"
page = 355
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and meditation the leaves of spear grass."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪ੍ਰਭੂ-ਧਿਆਨ (ਸਿਮਰਨ) ਨੂੰ ਦੱਭ ਦੇ ਪੱਤੇ ਬਣਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "let spiritual wisdom be the sacred thread, and meditation the ceremonial ring."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਮਨ ਕੋ ਸੁਧ ਕੀਆ ਹੈ ਗ੍ਯਾਨ ਕਾ ਜਨੇਊ ਪਹਿਰਾ ਹੈ ਔਰ ਧ੍ਯਾਨ ਕੀ (ਕੁਸਪਾਤੀ) ਕੁਸਾ ਕੇ ਛਲੇ ਪਹਰੇ ਹੈਂ, ਸੋ ਬ੍ਰਾਹਮਣ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਨਾਲ ਡੂੰਘੀ ਜਾਣ-ਪਛਾਣ ਜਨੇਊ ਹੈ ਤੇ ਪ੍ਰਭੂ-ਚਰਨਾਂ ਵਿਚ ਜੁੜੀ ਹੋਈ ਸੁਰਤਿ ਦੱਭ ਦਾ ਛੱਲਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਿਆਨੁ = ਪਰਮਾਤਮਾ ਨਾਲ ਡੂੰਘੀ ਸਾਂਝ। ਧਿਆਨੁ = ਪਰਮਾਤਮਾ ਦੀ ਯਾਦ ਵਿਚ ਸੁਰਤਿ ਜੋੜਨੀ। ਕੁਸ = ਦੱਭ। ਕੁਸ ਪਾਤੀ = ਦੱਭ ਦਾ ਛੱਲਾ (ਜੋ ਚੀਚੀ ਦੀ ਨਾਲ ਦੀ ਉਂਗਲੀ ਤੇ ਪਾਈਦਾ ਹੈ ਕੋਈ ਪੂਜਾ ਆਦਿਕ ਕਰਨ ਵੇਲੇ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que Kusha, el anillo sagrado para la ceremonia de Yagna sea la meditación;"