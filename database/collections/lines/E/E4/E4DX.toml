[[content]]
assets = ["SSKS"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸੁਖਫਲ ਮਇਆ ਕੈ ਚਖਾਵੈ ਜਾਹਿ; ਤਾਹਿ ਅਨਰਸ ਨਹੀਂ ਰਸਨਾ ਹਿਤਾਵਹੀ ॥"

[[content]]
assets = ["SSPK"]
type = "translation"
language = "en"
data = "One who is blessed with spiritual pleasure by the True Guru, he does not relish any other pleasures."

[[content]]
assets = ["SSSK"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਸਤਿਗੁਰੂ, ਕਿਰਪਾ ਕਰ ਕੇ ਇਹ ਗੁਰਮੁਖੀ ਸੁਖਫਲ ਚਖਾ ਦੇਣ ਅਨੁਭਵ ਕਰਾ ਦੇਣ, ਤਿਸ ਨੂੰ ਅਨਰਸ ਹੋਰ ਹੋਰ ਸ੍ਵਾਦ ਬਾਹਰਲੇ ਸ੍ਵਾਦ ਰਸਨਾ ਰਸੀਲੇ ਹੋ ਹੋ ਕੇ ਨਹੀਂ ਹਿਤ ਆਉਂਦੇ ਅਰਥਾਤ ਰੁਚ੍ਯਾ ਨਹੀਂ ਕਰਦੇ।"