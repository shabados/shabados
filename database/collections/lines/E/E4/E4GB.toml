[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਮਧਿ; ਏਹੁ ਕੀਰਤਨੁ ਗਾਵੈ ॥"
page = 885
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "out of millions that mortal alone thus sings the Lord's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾਂ ਵਿਚੋਂ ਉਹ ਪ੍ਰਾਣੀ ਹੀ ਇਸ ਤਰ੍ਹਾਂ ਸੁਆਮੀ ਦਾ ਜੱਸ ਗਾਇਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He sings the Lord's Praises in this way."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਕੋਈ ਕ੍ਰੋੜੋਂ ਮੇਂ ਸੇ ਏਕ ਇਸ ਕੀਰਤਨ ਕੋ ਗਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਹ (ਪ੍ਰਭੂ ਦਾ) ਇਹ ਕੀਰਤਨ ਗਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਟਿ ਮਧਿ = ਕ੍ਰੋੜਾਂ ਵਿਚੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ese ser extraordinario canta en realidad la Alabanza del Señor"