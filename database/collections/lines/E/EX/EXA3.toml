[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ ਪ੍ਰਭ ਆਪਣੀ; ਜਪੀਐ ਅੰਮ੍ਰਿਤ ਨਾਮੁ ॥"
page = 46
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Master! show Thine mercy, so that we may meditate on the ambrosial Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਾਲਕ! ਆਪਣੀ ਰਹਿਮਤ ਧਾਰ, ਤਾਂ ਜੋ ਅਸੀਂ ਤੇਰੇ ਸੁਧਾ-ਸਰੂਪ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰੀਏ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please grant Your Grace, God, that we may meditate on Your Ambrosial Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਬ ਪਰਮੇਸ੍ਵਰ ਅਪਣੀ ਕਿਰਪਾ ਕਰੇ, ਤਬ ਅੰਮ੍ਰਿਤ ਰੂਪੀ ਨਾਮ ਕਾ ਜਾਪੁ ਕਰੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਆਪਣੀ ਮਿਹਰ ਕਰ (ਗੁਰੂ ਮਿਲਾ, ਤਾ ਕਿ) ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ (ਤੇਰਾ) ਨਾਮ (ਅਸੀ) ਜਪ ਸਕੀਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭੂ = ਹੇ ਪ੍ਰਭੂ! ਅੰਮ੍ਰਿਤ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y a través de la Gracia del Señor, habitamos en Él."