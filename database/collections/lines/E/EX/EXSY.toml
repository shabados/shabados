[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਬਖਸ਼ਿਸ਼ ਮੇਰੇ ਪਰਾਂ ਨੂੰ ਫੈਲਾ ਕੇ ਮੈਨੂੰ ਉਡਨ ਸ਼ਕਤੀ ਦਿੰਦੀ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਗਰ ਜ਼ਿ ਰਾਹਿ ਕਰਮਿ ਖ਼ੇਸ਼, ਬ-ਬਖ਼ਸ਼ੀ ਪਰੋ ਬਾਲ ॥੫੨॥੪॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "That saintliness is really worthwhile if it is to seek the Truth;"