[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗੁ ਆਸਾਵਰੀ ਘਰੁ ੧੬ ਕੇ ੨ ਮਹਲਾ ੪ ਸੁਧੰਗ ॥"
page = 369
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Asawari Measure. 4th Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਆਸਾਵਰੀ ਚੌਥੀ ਪਾਤਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Aasaavaree, 2 Of Sixteenth House, Fourth Mehl, Sudhang:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸੁਧੰਗ) ਹੇ (ਅੰਗ) ਪਿਆਰੇ ਸੁਧ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਆਸਾਵਰੀ, ਘਰ ੧੬ ਵਿੱਚ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਦੀ ਬਾਣੀ 'ਸੁਗੰਧ'।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Asa vari (de forma pura), Mejl Guru Ram Das, Cuarto Canal Divino."