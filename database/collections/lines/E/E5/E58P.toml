[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਣੇ ਗੁਰ ਕੀ; ਮੰਨਿ ਲੈ ਰਜਾਇ ॥੧॥ ਰਹਾਉ ॥"
page = 560
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and submit to the will of thy Guru. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੇ ਗੁਰਾਂ ਦੇ ਭਾਣੇ ਨੂੰ ਕਬੂਲ ਕਰ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "by submitting to the Will of your Guru. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਗੁਰੂ ਕੀ ਆਗ੍ਯਾ ਮਾਨ ਲੇ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਗੁਰੂ ਦੇ ਹੁਕਮ ਨੂੰ ਮਨ ਕਿ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਜਾਇ = ਹੁਕਮ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sométete a la Verdad de tu Guru. (1‑Pausa)"