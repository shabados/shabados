[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤਾਂ ਸਰਨਿ; ਪਰੁ ਹਾਂ ॥"
page = 410
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Entering the sanctuary of God's devotees,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਅਨੁਰਾਗੀ ਦੀ ਓਟ ਲੈਣ ਨਾਲ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Taking to the Sanctuary of His devotees,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭਗਤੋਂ ਕੀ ਸਰਨਿ ਪੜੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਭਗਤ-ਜਨਾਂ ਦੀ ਸਰਨੀਂ ਪਿਆ ਰਹੁ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰੁ = ਪਉ। ਸਰਨਿ ਪਰੁ = ਆਸਰਾ ਲੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando uno busca el Refugio de los Devotos del Señor,"