[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤ ਸੰਤੋਖਿ; ਰਹਹੁ ਜਨ ਭਾਈ ॥"
page = 1030
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my brother mortals, abide ye in truth and contentment,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਵੀਰ ਪ੍ਰਾਨੀਓ! ਤੁਸੀਂ ਸਚ ਤੇ ਸਬਰ ਸਿਦਕ ਅੰਦਰ ਵਸਾਓ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Abide in truth and contentment, O humble Siblings of Destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ ਜਨੋਂ! ਸਤ ਸੰਤੋਖ ਮੇਂ ਰਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ ਜਨੋ! ਸੇਵਾ ਤੇ ਸੰਤੋਖ ਵਿਚ ਜੀਵਨ ਬਿਤਾਵੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨ ਭਾਈ = ਹੇ ਭਾਈ ਜਨੋ! ਸੰਤੋਖਿ = ਸੰਤੋਖ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ve y escucha que las Almas son Dios"