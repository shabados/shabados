[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਆਦ ਬਾਦ ਈਰਖ ਮਦ ਮਾਇਆ ॥"
page = 741
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Pleasures, strife, jealousy and pride of wealth;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੁਸ਼ੀਆਂ, ਲੜਾਈ, ਝਗੜਾ, ਹਸਦ ਅਤੇ ਧਨ-ਦੌਲਤ ਦਾ ਹੰਕਾਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Tastes and pleasures, conflicts and jealousy, and intoxication with Maya"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਵਾਦ ਝਗੜੇ ਔ ਈਰਖਾ ਤੇ ਮਾਇਆ ਕਾ ਹੰਕਾਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! (ਦੁਨੀਆ ਦੇ ਪਦਾਰਥਾਂ ਦੇ) ਚਸਕੇ, ਝਗੜੇ, ਸਾੜਾ, ਮਾਇਆ ਦਾ ਮਾਣ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਦ = ਝਗੜੇ। ਈਰਖ = ਸਾੜਾ। ਮਦ = ਅਹੰਕਾਰ, ਨਸ਼ਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Se aferra a los placeres, a la contienda y a los celos, intoxicado con Maya."