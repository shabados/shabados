data = "ਇੰਦ੍ਰ ਲੋਕ ਕੇ ਰਾਜ ਹਿਤ; ਚੜਿ ਧਾਏ ਨ੍ਰਿਪ ਸੁੰਭ ॥"
page = 80

[[content]]
assets = ["DSKO"]
