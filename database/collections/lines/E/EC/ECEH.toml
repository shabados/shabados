[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਰਮਯੇ ਕਉ; ਮਿਲੈ ਨ. ਸੁਪਨੈ ॥੨॥"
page = 328
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "meets not the Pervading Lord, even in his dream."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਵਿਆਪਕ ਸੁਆਮੀ ਨੂੰ ਆਪਣੇ ਸੁਪਨੇ ਵਿੱਚ ਭੀ ਨਹੀਂ ਮਿਲਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "does not meet the Lord, even in dreams. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪੁਰਸ (ਰਮਯੇ) ਪਰਮੇਸ੍ਵਰ ਕੋ ਸੁਪਨੇ ਮੇਂ ਅਰਥਾਤ ਕਦਾਚਿਤ ਨਹੀਂ ਮਿਲਤਾ ਹੈ॥੨॥☬ਪ੍ਰਸ਼ਨ: ਇਹ ਤੋ ਦੋਹਾਗਣਿ ਕਾ ਚਿੰਨ ਕਹਾ, ਸੁਹਾਗਣਿ ਕਾ ਚਿੰਨ ਕਿਆ ਹੈ?☬ਉੱਤ੍ਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ ਨੂੰ ਸੁਪਨੇ ਵਿਚ ਭੀ (ਭਾਵ, ਕਦੇ ਭੀ) ਨਹੀਂ ਮਿਲ ਸਕਦਾ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਮਯੇ ਕਉ = ਰਾਮ ਨੂੰ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ni siquiera en sueños. (2)"