[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈ. ਹਰਿ ਬਿਨੁ; ਅਵਰੁ ਨ ਕੋਇ ॥"
page = 81
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have none but Thee, O God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਬਾਝੋਂ ਹੈ ਵਾਹਿਗੁਰੂ! ਮੇਰਾ ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have none other than You, O Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਤੋ ਹਰੀ ਸੇ ਬਿਨਾ ਹੋਰ ਕੋਈ ਆਸਰਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਮੇਰਾ ਤਾਂ ਪਰਮਾਤਮਾ ਤੋਂ ਬਿਨਾ ਕੋਈ ਹੋਰ (ਆਸਰਾ) ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No tengo a nadie más que a Ti, oh Señor."