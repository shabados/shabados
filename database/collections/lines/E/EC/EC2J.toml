[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੂਪ ਲਖ︀ਯੋ ਚਿਤ ਮੈ ਫਸ︀ਯੋ ਆਨਿ ਤ੍ਰਿਯਾ ਕੇ ਹੇਤ ॥"
page = 833

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Raja thought in his mind that he had been entangled in the love,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਜੇ ਨੇ ਚਿਤ ਵਿਚ ਸੋਚਿਆ ਕਿ ਮੈਂ ਇਸਤਰੀ ਦੇ ਪ੍ਰੇਮ ਕਰ ਕੇ ਆ ਫਸਿਆ ਹਾਂ।"