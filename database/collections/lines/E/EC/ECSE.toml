[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਉਡੀ ਬਦਲੈ; ਤਿਆਗੈ ਰਤਨੁ ॥"
page = 892
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In exchange for a trinket, one gives up the gem,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੌਡੀ ਦੇ ਵਟਾਂਦਰੇ ਵਿੱਚ ਬੰਦਾ ਹੀਰੇ ਨੂੰ ਛੱਡ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In exchange for a shell, he gives up a jewel."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੁਛ ਰੂਪੁ ਹੇ ਜੀਵ! ਮਾਇਆ ਦੇ ਵਾਸਤੇ ਤੈਨੇ ਅਮੋਲਕ ਰਤਨ ਵੈਰਾਗ ਵਾ ਭਗਵੰਤ ਭਜਨ ਕੋ ਤਿਆਗ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਅਮੋਲਕ ਰਤਨ ਹੈ, ਇਸ ਦੇ ਟਾਕਰੇ ਤੇ ਮਾਇਆ ਕੌਡੀ ਦੇ ਤੁੱਲ ਹੈ; ਪਰ ਸਾਕਤ ਮਨੁੱਖ) ਕੌਡੀ ਦੀ ਖ਼ਾਤਰ (ਕੀਮਤੀ) ਰਤਨ ਨੂੰ ਛੱਡ ਦੇਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉਡੀ = ਤੁੱਛ ਜਿਹੀ ਚੀਜ਼। ਬਦਲੈ = ਦੇ ਵੱਟੇ ਵਿਚ, ਦੀ ਖ਼ਾਤਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno cambia la Joya Verdadera por una de fantasía;"