[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੀਨੇ ਅਮਿਤ ਦਿਜਨ ਕਹੁ ਦਾਨਾ ॥"
page = 192

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Vishnu then took bath at various pilgrim-stations, and distributed unlimited alms to the Brahmins."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਬੇਸ਼ੁਮਾਰ ਬ੍ਰਾਹਮਣਾਂ ਨੂੰ ਦਾਨ ਦਿੱਤੇ।"