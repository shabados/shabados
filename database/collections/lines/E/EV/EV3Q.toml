data = "ਛਿਜੈ ਨ ਨੈਕ ਖੰਡਿਓ ਨ ਜਾਇ ॥"
page = 139

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "By the blow of thousands of enemies, It is neither wasted away nor fragmented."

