data = "(ਉਹ) ਨਾ ਛਿਜਦਾ ਹੈ ਅਤੇ ਨਾ ਜ਼ਰਾ ਜਿਨ੍ਹਾਂ ਟੁੱਟਦਾ ਹੈ,"