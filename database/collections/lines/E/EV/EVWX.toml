[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਹਥਿ ਸਕਥ ਹਨਿ; ਸਾਧਸੰਗਤਿ ਗੁਰ ਕਾਰ ਕਮਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Worthy are the hands of the Sikh who in the holy congregation do the Guru's work."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਜਿਹੜੇ) ਸਾਧ ਸੰਗਤ ਅਤੇ ਗੁਰਾਂ ਦੀ (ਕਾਰ=) ਸੇਵਾ ਕਰਦੇ ਹਨ।"