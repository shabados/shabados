[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖੋਜਤੀ. ਦਰਸਾਰ ॥੧॥ ਰਹਾਉ ॥"
page = 1230
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "seeking the Lord's vision. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਦਰਸ਼ਨ ਦੀ ਤਲਾਸ਼ ਕਰਦੀ ਹੋਈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I seek only the Blessed Vision of His Darshan. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਪਰਮੇਸ਼੍ਵਰ ਕੇ ਦਰਸ਼ਨ ਕੋ ਢੂੰਢਤੀ ਹੂੰ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਦਾ) ਦਰਸਨ ਕਰਨ ਦਾ ਜਤਨ ਕਰਦੀ ਕਰਦੀ ਮੇਰੀ ਜਿੰਦ (ਵੈਰਾਗਵਾਨ ਹੋ ਰਹੀ ਹੈ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖੋਜਤੀ = ਖੋਜ ਕਰਦੀ ਕਰਦੀ। ਦਰਸਾਰ = ਦਰਸਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "obtener la Visión de mi Dios. (1-Pausa)"