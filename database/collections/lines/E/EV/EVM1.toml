[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਯਹੈ ਰਾਜ ਲੀਜੈ, ਯਾ ਕੋ ਰਾਜਾ ਹ੍ਵੈ ਕੈ ਰਾਜ ਕੀਜੈ; ਹਾਥੁ ਚਾਇ ਦੀਜੈ, ਮੋਹਿ ਯਹੈ ਜਿਯ ਜਾਗੀ ਹੈ ॥"
page = 957

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Come, take over the reigning and rule over the state. I will hand over to you every thing with my own hands."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਥੋਂ ਦਾ ਰਾਜ ਲੈ ਲੌ ਅਤੇ ਰਾਜਾ ਬਣਾ ਕੇ ਇਥੇ ਰਾਜ ਕਰੋ; ਹੱਥ ਚੁਕ ਕੇ ਮੈਨੂੰ ਉਹੋ ਕੁਝ ਦੇ ਦਿਓ ਜਿਸ (ਦੀ ਇੱਛਾ) ਮੇਰੇ ਮਨ ਵਿਚ ਪੈਦਾ ਹੋਈ ਹੈ।"