data = "ਲੈ ਰਾਜਾ ਜੀ, ਤੁਮ ਕੌ ਦਈ ॥੭॥"
page = 888

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘And I picked it up. Now Raja, please you take it.’(7)"

