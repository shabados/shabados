[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਨਾਨਕ; ਏਕੋ ਜਾਣੈ ॥੬੯॥"
page = 946
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru-ward knows the One Lord alone, O Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਅਨੁਸਾਰੀ ਕੇਵਲ ਇਕ ਪ੍ਰਭੂ ਨੂੰ ਹੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Gurmukh knows the One Lord alone. ||69||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਗੁਰਮੁਖ ਇਕ ਵਾਹਿਗੁਰੂ ਕੋ ਹੀ ਜਾਨਤੇ ਹੈਂ॥੬੯॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਗੁਰੂ ਦੇ ਹੁਕਮ ਵਿਚ ਤੁਰਨ ਵਾਲਾ ਮਨੁੱਖ ਇੱਕ ਪ੍ਰਭੂ ਨੂੰ (ਹਰ ਥਾਂ ਵਿਆਪਕ) ਜਾਣਦਾ ਹੈ ॥੬੯॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh, dice Nanak, el Gurmukj conoce al Señor Absoluto.(69)"