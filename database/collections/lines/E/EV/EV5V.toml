data = "ਗਏ ਧਾਮ ਤੇ ਕਹਿਯੋ; ਮਿਤ੍ਰ ਕੌ ਕਰ ਪਕਰਿ ॥"
page = 828

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When they had gone away, holding Raja’s arm she said,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੇ ਘਰੀਂ ਜਾਣ ਤੇ, (ਇਸਤਰੀ ਨੇ) ਮਿਤਰ ਦਾ ਹੱਥ ਪਕੜ ਕੇ ਕਿਹਾ,"