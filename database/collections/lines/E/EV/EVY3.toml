[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਘੁਘੂ ਸੁਝੁ ਨ ਸੁਝਈ; ਕਰਮਾ ਦਾ ਹੀਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "So unfortunate is owl that it never beholds sun."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਉੱਲੂ ਨੂੰ (ਚਾਨਣਾ) ਸੂਰਜ ਨਹੀਂ ਦਿੱਸਦਾ, ਕਰਮਾਂ ਦਾ ਹੀਣਾ ਹੈ।"