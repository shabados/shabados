[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ ਪ੍ਰਭ ਭਾਵੈ; ਤਾ ਮਹਲਿ ਬੁਲਾਵੈ ॥"
page = 839
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If the Lord so wills, then summons He the mortal into His presence."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਸੁਆਮੀ ਨੂੰ ਇਸ ਤਰ੍ਹਾਂ ਚੰਗਾ ਲੱਗੇ ਤਦ ਉਹ ਪ੍ਰਾਣੀ ਨੂੰ ਆਪਣੀ ਹਜ਼ੂਰੀ ਵਿੱਚ ਸੱਦ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If God wills it so, then one is summoned to the Mansion of His Presence."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਤਿਸ ਪ੍ਰਭੂ ਕਉ ਭਾਵੈ ਤਬ ਇਸ ਜੀਵ ਕੋ (ਮਹਲਿ) ਸਰੂਪ ਮੇਂ ਬੁਲਾਇ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਪ੍ਰਭੂ ਨੂੰ (ਕੋਈ ਵਡ-ਭਾਗੀ) ਚੰਗਾ ਲੱਗ ਪਏ, ਤਾਂ ਉਸ ਨੂੰ ਪ੍ਰਭੂ ਆਪਣੇ ਚਰਨਾਂ ਵਿਚ ਜੋੜ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ ਭਾਵੈ = ਪ੍ਰਭੂ ਨੂੰ ਪਸੰਦ ਆ ਜਾਏ। ਮਹਲਿ = ਆਪਣੀ ਹਜ਼ੂਰੀ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el Señor lo desea, Él llama a alguno a Su Presencia;"