[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਕਰਣਾ; ਸੋ ਕਰਿ ਕਰਿ ਵੇਖੈ ॥"
page = 1021
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who has created the universe, sees what he has created and fashioned."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਆਲਮ ਨੂੰ ਰਚਿਆ ਹੈ, ਉਹ ਆਪਣੇ ਰਚੇ ਤੇ ਸਾਜੇ ਹੋਏ ਨੂੰ ਦੇਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He who created the creation, beholds what He has created."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤੈਨੇ (ਕਰਣਾ) ਪਰਪੰਚ ਕੀਆ ਹੈ, ਸੋਈ ਤੂੰ ਇਨ ਕੇ (ਕਰਿ) ਕਰਤਤ ਕਰੇ ਹੋਏ ਕੋ ਵੇਖਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਰਤਾਰ ਦਾ ਇਹ ਰਚਿਆ ਸੰਸਾਰ ਹੈ ਉਹ ਇਸ ਨੂੰ ਰਚ ਰਚ ਕੇ ਆਪ ਹੀ ਇਸ ਦੀ ਸੰਭਾਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸੁ ਕਰਣਾ = ਜਿਸ ਪਰਮਾਤਮਾ ਦਾ ਰਚਿਆ ਜਗਤ। ਵੇਖੈ = ਸੰਭਾਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, Quien crea las cosas, también las observa"