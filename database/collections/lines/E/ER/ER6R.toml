[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਕੁੰਚਰੁ; ਕਾਇਆ ਉਦਿਆਨੈ ॥"
page = 221
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mind is an elephant in the body forest."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੇਹਿ ਦੇ ਜੰਗਲ ਅੰਦਰ ਮਨੂਆਂ ਇਕ ਹਾਥੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mind is an elephant in the forest of the body."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹ ਮਨ ਰੂਪੀ ਹਸਤੀ ਹੈ ਔਰ (ਕਾਇਆ) ਸਰੀਰ ਰੂਪੀ (ਉਦਿਆਨੈ) ਜੰਗਲ ਮੇਂ ਰਹਿਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ) ਸਰੀਰ ਜੰਗਲ ਵਿਚ ਮਨ ਹਾਥੀ (ਸਮਾਨ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੁੰਚਰੁ = ਹਾਥੀ। ਕਾਇਆ = ਸਰੀਰ। ਉਦਿਆਨੈ = ਜੰਗਲ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La mente es el elefante salvaje en la jungla del cuerpo;"