[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੈ ਨਾਮਿ; ਉਧਰੇ ਜਨ ਕੋਟਿ ॥"
page = 264
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By God's Name, millions of men have been saved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦੁਆਰਾ ਕ੍ਰੋੜਾਂ ਹੀ ਇਨਸਾਨ ਪਾਰ ਉਤਰ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By the Name of the Lord, millions have been saved."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਨਾਮ ਸਿਮਰਨ ਸੇ ਕ੍ਰੋੜੋਂ ਜਨ ਉਧਰੇ ਹੈਂ ਵਾ ਉਧਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ-ਨਾਮ ਦੀ ਰਾਹੀਂ ਕਰੋੜਾਂ ਬੰਦੇ (ਵਿਕਾਰਾਂ ਤੋਂ) ਬਚ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ ਕੈ ਨਾਮਿ = ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੀ ਰਾਹੀਂ। ਜਨ = ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mediante nombre del Señor millones han sido salvos."