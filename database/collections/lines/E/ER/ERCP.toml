[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰਭੁ ਜੋਤਹਿ ਜੋਤਿ ਮਿਲਾਇ ਲਏ ॥"
page = 616

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "How many kings were there and how many of them were merged by the Lord in his light? To what extent should I describe them."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ (ਉਨ੍ਹਾਂ ਦੀ) ਜੋਤਿ ਆਪਣੀ ਜੋਤਿ ਵਿਚ ਮਿਲਾ ਲਈ ਹੈ।"