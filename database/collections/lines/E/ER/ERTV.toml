[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਿਣੁ ਨਾਵੈ; ਕੋ ਮੁਕਤਿ. ਨ ਹੋਇ ॥੬॥"
page = 229
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Name none is emancipated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੇ ਬਾਝੋਂ ਕੋਈ ਭੀ ਮੁਕਤ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but without the Name, no one is liberated. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਸੇ ਬਿਨਾ ਕੋਈ ਜੀਵ ਮੁਕਤ ਨਹੀਂ ਹੋਤਾ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਤੋਂ ਬਿਨਾ ਕੋਈ ਮਨੁੱਖ ਮਾਨਸਕ ਅਪਵਿਤ੍ਰਤਾ ਤੋਂ ਖ਼ਲਾਸੀ ਨਹੀਂ ਪਾ ਸਕਦਾ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋ = ਕੋਈ ਮਨੁੱਖ। ਮੁਕਤਿ = ਸੂਤਕ ਤੋਂ ਖ਼ਲਾਸੀ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ellos también te dicen que sin el Nombre, la Liberación no se alacanza. (6)"