[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਾਦੁ ਵਖਾਣਹਿ; ਮੋਹੇ ਮਾਇਆ ॥"
page = 128
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Infatuated by mammon they enter into controversies."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨ ਦੌਲਤ ਦੇ ਬੁੱਧੀ-ਹੀਣ ਕੀਤੇ ਹੋਏ ਉਹ ਬਹਿਸ ਮੁਬਾਹਿਸੇ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Intoxicated with Maya, they argue and debate."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਮਾਇਆ ਕੇ ਮੋਹੇ ਹੂਏ ਬਿਅਰਥ ਹੀ ਵਾਕ ਕਾ ਵੈਰ ਝਗੜੇ ਕੀਆਂ ਕਥਾ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਵੇਦ ਆਦਿਕ ਪੜ੍ਹ ਕੇ ਤਾਂ ਉਹ ਸਿਰਫ਼ ਕੋਈ ਨਾ ਕੋਈ) ਧਰਮ-ਚਰਚਾ, ਬਹਸ ਹੀ (ਹੋਰਨਾਂ ਨੂੰ) ਸੁਣਾਂਦੇ ਹਨ (ਆਪ ਉਹ) ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਹੀ ਟਿਕੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਾਦੁ = ਝਗੜਾ, ਬਹਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquéllos a quienes les fascina revolcarse en la ignorancia, están siempre en la oscuridad;"