[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਦਿ ਅੰਤ ਨ ਮਧ ਜਾ ਕੋ; ਭੂਤ ਭਬ ਭਵਾਨ ॥"
page = 34

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is devoid of beginning, middle and end and also of past, present and future."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ) ਦਾ ਆਦਿ, ਅੰਤ ਅਤੇ ਮੱਧ ਅਤੇ ਭੂਤ, ਭਵਿਖ ਅਤੇ ਵਰਤਮਾਨ (ਕੁਝ ਵੀ ਨਹੀਂ ਹੈ)"