[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਪੂਰੈ; ਪ੍ਰਭ ਸਿਉ ਲੈ ਮੇਲੇ ॥"
page = 1340
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Perfect Guru, makes them meet with the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਦੇਵ ਜੀ ਉਨ੍ਹਾਂ ਨੂੰ ਮਾਲਕ ਨਾਲ ਮਿਲਾ ਦਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Perfect Guru leads them to meet God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੂਰੇ ਗੁਰੋਂ ਨੇ ਅਪਨੇ ਸਾਥ ਲੈਕਰ ਪ੍ਰਭੂ ਕੇ ਸਾਥ ਮੇਲੇ ਅਰਥਾਤ ਅਭੇਦ ਕਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੂੰ ਪੂਰੇ ਗੁਰੂ ਨੇ ਪਰਮਾਤਮਾ ਨਾਲ ਲਿਆ ਜੋੜਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਉ = ਨਾਲ। ਲੈ = ਫੜ ਕੇ। ਮੇਲੇ = ਮਿਲਾ ਦਿੱਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Guru Perfecto los guía a conocer a Dios,"