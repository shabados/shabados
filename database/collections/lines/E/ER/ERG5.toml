[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਕਤਿ ਸਿਆਨਪ ਕਿਛੂ; ਨ ਜਾਨਾ ॥"
page = 387
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I know no argumentation and wisdom."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕੋਈ ਦਲੀਲ-ਬਾਜੀ ਅਤੇ ਚਤੁਰਾਈ ਨਹੀਂ ਜਾਣਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I know nothing of arguments or cleverness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! (ਉਕਤਿ) ਕਥਨੀ (ਸਿਆਨਪ) ਬੁਧੀ ਕੀ ਚਤੁਰਾਈ ਯਹ ਮੈਂ ਕੁਛੁ ਨਹੀਂ ਜਾਨਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਕੋਈ ਦਲੀਲ (ਦੇਣੀ) ਨਹੀਂ ਜਾਣਦਾ ਮੈਂ ਕੋਈ ਸਿਆਣਪ (ਦੀ ਗੱਲ ਕਰਨੀ) ਨਹੀਂ ਜਾਣਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਕਤਿ = ਯੁਕਤਿ, ਦਲੀਲ। ਕਿਛੂ = ਕੁਝ ਭੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No conozco ningún artefacto ni ninguna destreza."