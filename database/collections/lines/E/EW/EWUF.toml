[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਜਨਮ ਕੇ; ਗਏ ਕਲੇਸ ॥"
page = 1339
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The suffering of millions of my births are over."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਕ੍ਰੋੜਾ ਹੀ ਜਨਮਾਂ ਦੇ ਦੁਖੜੇ ਦੂਰ ਹੋ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The suffering of millions of incarnations is gone;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜੋਂ ਜਨਮੋਂ ਕੇ ਕਲੇਸ਼ ਤਿਨ ਕੇ ਗਏ ਹੈਂ ਅਰਥਾਤ ਦੂਰ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹਰਿ-ਨਾਮ ਨਾਲ ਪ੍ਰੀਤ ਦੀ ਬਰਕਤਿ ਨਾਲ ਉਹਨਾਂ ਦੇ) ਕ੍ਰੋੜਾਂ ਜਨਮਾਂ ਦੇ ਦੁੱਖ-ਕਲੇਸ਼ ਦੂਰ ਹੋ ਗਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਟਿ = ਕ੍ਰੋੜਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y el dolor de millones de encarnaciones se ha ido."