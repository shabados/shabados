[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਤ ਬ੍ਰਹਮ ਕੇ ਬਾਦਿ ਕੌ; ਉਚਰਤ ਭਯੋ ਬਨਾਇ ॥੧੨॥"
page = 903

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And commenced to explain the essence of Brahma, the Creator.(12)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਬ੍ਰਹਮ-ਤੱਤ ਦੇ ਸਿੱਧਾਂਤ ਬਾਰੇ ਦਸਣ ਲਗਿਆ ॥੧੨॥"