[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਇੱਕ ਛਿਣ ਲਈ ਵੀ ਉਸ ਦੀ ਯਾਦ ਬਿਨਾਣ ਨਹੀਣ ਰਹਿਣਾ ਚਾਹੀਦਾ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਯੱਕ ਨਫ਼ਸ ਖ਼ਾਲੀ ਨਮੀ ਬਾਸ਼ਦ ਅਜ਼ੂ ॥੧੩੪॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "That I should be able to divert the minds of everyone towards the true path.\" (50)\nThe Guru said, \"I am no where near such a miracle,"