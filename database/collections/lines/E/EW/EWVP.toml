data = "ਕਾਮ ਦੇਵ ਠਟਕੇ ਰਹਤ; ਰਤਿ ਸਮ ਤਾਹਿ ਪਛਾਨਿ ॥੨॥"
page = 869

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "who was adjudged as exquisite as the Cupid.(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਰਤੀ ਸਮਾਨ ਸਮਝ ਕੇ ਕਾਮ ਦੇਵ ਵੀ ਰੁਕ ਜਾਂਦਾ ਸੀ ॥੨॥"