[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉਮੈ ਜਾਇ; ਪਰਮ ਪਦੁ ਪਾਈਐ ॥੧॥ ਰਹਾਉ ॥"
page = 226
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When self-conceit departs the highest rank is attained. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਸਵੈ-ਹੰਗਤਾ ਦੁਰ ਹੋ ਜਾਂਦੀ ਹੈ ਤਾਂ ਮਹਾਨ ਮਰਤਬਾ ਹਾਸਲ ਹੋ ਜਾਂਦਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But when egotism departs, then the state of supreme dignity is obtained. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਹੰਤਾ ਮਮਤਾ ਜਾਤੀ ਹੈ ਤਬ (ਪਰਮ ਪਦੁ) ਮੁਕਤੀ ਕੀ ਪ੍ਰਾਪਤੀ ਹੋਤੀ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਇਹ ਹਉਮੇ ਦੂਰ ਹੋਵੇ, ਤਦੋਂ ਹੀ ਸਭ ਤੋਂ ਉੱਚਾ ਆਤਮਕ ਦਰਜਾ ਹਾਸਲ ਕਰ ਸਕੀਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਮ ਪਦੁ = ਸਭ ਤੋਂ ਉੱਚਾ ਆਤਮਕ ਦਰਜਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero cuando nos quitamos del ego, llegamos al más elevado Estado de Éxtasis. (1-Pausa)"