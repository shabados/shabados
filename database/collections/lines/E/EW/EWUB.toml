[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੈ ਬੋਹਿਥ ਸਾਗਰ ਪ੍ਰਭ ਚਰਣਾ; ਕੇਤੇ ਪਾਰਿ ਲਘਾਏ ॥"
page = 577
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru's feet are the ship, which has ferried many across the terrible world ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਪੈਰ ਜਹਾਜ਼ ਹਨ ਜਿਸ ਨੇ ਘਣੇਰਿਆਂ ਨੂੰ ਭਿਆਨਕ ਸੰਸਾਰ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God's Feet are the boat, which carries so many across the terrifying world-ocean."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭੈਦਾਇਕ ਸੰਸਾਰ ਸਮੁੰਦਰ ਸੇ ਪ੍ਰਭ ਕੇ ਚਰਣਾਰਬਿੰਦ ਰੂਪੀ (ਬੋਹਿਥ) ਜਹਾਜ ਨੇ ਕਿਤਨੇ, ਭਾਵ ਬਹੁਤੇ ਹੀ ਜੀਵ ਪਾਰ ਕਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਭਿਆਨਕ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਲੰਘਣ ਵਾਸਤੇ ਪਰਮਾਤਮਾ ਦੇ ਚਰਨ ਜਹਾਜ਼ ਹਨ (ਆਪ ਨਾਮ ਜਪਣ ਵਾਲੇ ਮਨੁੱਖ) ਅਨੇਕਾਂ ਨੂੰ (ਪ੍ਰਭੂ-ਚਰਨਾਂ ਵਿਚ ਜੋੜ ਕੇ) ਪਾਰ ਲੰਘਾ ਦੇਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੈ ਸਾਗਰ = ਭਿਆਨਕ ਸਮੁੰਦਰ। ਬੋਹਿਥ = ਜਹਾਜ਼। ਕੇਤੇ = ਬੇਅੰਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Pies del Señor son el Barco con el que millones han podido cruzar el mar de la existencia."