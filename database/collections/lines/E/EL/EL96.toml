[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਸਤ੍ਰ ਵੇਦ ਪੁਰਾਣ ਸਭ; ਸੁਣਿ ਸੁਣਿ ਆਖਣੁ ਆਖ ਸੁਣਾਵਹਿ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Having listened to the Shastras, Vedas and Puranas people further recite and listen to them."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਛੀ) ਸ਼ਾਸਤ੍ਰ (ਚਾਰ) ਵੇਦ (ਅਠਾਰਾਂ) ਪੁਰਾਣ ਸੱਭ ਬੁੱਧਿਮਾਨਾਂ ਤੋਂ ਸੁਣ ਸੁਣ ਕੇ ਕਥਾ ਵਖਯਾਨ ਕਰਦੇ ਹਨ।"