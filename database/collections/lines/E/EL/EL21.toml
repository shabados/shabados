data = "(ਬਾਦਸ਼ਾਹ ਨੇ) ਉਨ੍ਹਾਂ ਨੂੰ ਵੱਡੇ ਦਰਿਆ ਵਿਚ ਵੱਖਰਾ ਵੱਖਰਾ ਚਲਾ ਦਿੱਤਾ।"