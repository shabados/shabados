[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਿਸਿ ਦਿਨ ਰਹੈ ਏਕ ਲਿਵ ਲਾਈ ॥੨੦੮॥"
page = 652

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sins and ailments of all were destroyed, all remained engrossed in the meditation of one Lord.208."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਦਿਨ (ਨਾਮ ਸਿਮਰਨ ਵਿਚ) ਲਿਵ ਲਗਾਈ ਰਖਦੇ ਹਨ ॥੨੦੮॥"