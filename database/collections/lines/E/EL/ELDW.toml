[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਵਿਰਲੇ; ਕਿਸੈ ਬੁਝਾਏ ॥"
page = 993
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "rare, indeed, is such a Guru-ward."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਈਸ਼ਵਰੀ ਗਿਆਤ ਦਰਸਾਉਂਦਾ ਹੈ; ਕੋਈ ਇਕ ਅੱਧਾ ਹੀ ਐਹੋ ਜੇਹਾ ਗੁਰੂ-ਅਨੁਸਾਰੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Understands, and whom the True Lord links to His Praise."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸੁ ਕਿਸੇ ਵਿਰਲੇ ਗੁਰਮੁਖ ਕੋ ਸਮਝ ਆਵਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜਿਸ ਕਿਸੇ ਵਿਰਲੇ ਬੰਦੇ ਨੂੰ ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਪਰਮਾਤਮਾ ਆਪਣੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਕਦਰ ਸਮਝਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਜੋ ਮਨੁੱਖ ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੈ, ਜੋ ਗੁਰੂ ਦੇ ਦੱਸੇ ਰਾਹ ਤੇ ਤੁਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "al cual Su Verdad le es revelada,"