[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸੁਹਣੇ ਅੰਦਰਿ ਜਾਇ ਕੈ; ਦੇਸੰਤਰਿ ਭਉਂਦਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Entering into the dreams He wanders through far off regions."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਫੇਰ) ਸੁਪਨੇ ਵਿਖੇ ਜਾ ਕੇ (ਕਈ) ਦੇਸ਼ਾਂ ਵਿਖੇ ਫਿਰਦਾ ਹੈ।"