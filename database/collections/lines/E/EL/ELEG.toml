[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਭ ਸ੍ਰੀ ਨਾਮ ਤੁਪਕ ਕੇ ਜਾਨੋ ॥੮੬੬॥"
page = 765

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Utter firstly the words “Balbhadar-bhraatinani”, then add the words “Jaachar, nayak and shatru” and in this way know all the names of Tupak.866."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਤੁਪਕ ਦਾ ਨਾਮ ਕਰ ਕੇ ਜਾਣੋ ॥੮੬੬॥"