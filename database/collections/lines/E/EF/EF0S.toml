[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁੰਦਰ ਧਿਆਨੁ ਧਾਰੁ ਦਿਨੁ ਰੈਨੀ; ਜੀਅ ਪ੍ਰਾਨ ਤੇ ਪਿਆਰਾ ॥੧॥ ਰਹਾਉ ॥"
page = 532
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Day and night I cherish the idea of Thy beauteous vision. Thou art dearer to me even than my soul and life. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਸੁਹਣੇ ਦਰਸ਼ਨ ਦਾ ਖਿਆਲ ਦਿਹੁੰ ਰਾਤ ਮੈਂ ਧਾਰੀ ਰੱਖਦਾ ਹੈ। ਆਪਣੀ ਜਿੰਦੜੀ ਤੇ ਜਿੰਨ-ਜਾਨ ਨਾਲੋਂ ਤੂੰ ਮੈਨੂੰ ਲਾਡਲਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I cherish this beautiful meditation day and night; You are dearer to me than my soul, dearer than life itself. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁੰਦਰ ਹੈ ਅਰੁ ਰਾਤ ਦਿਨ ਧ੍ਯਾਨ ਧਾਰਨੇ ਜੋਗ ਔਰ ਹਮ ਕੋ ਪ੍ਰਾਨੋਂ ਸੇ ਭੀ ਪ੍ਯਾਰਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਰਾਤ ਮੈਂ ਤੇਰੇ ਸੋਹਣੇ ਸਰੂਪ ਦਾ ਧਿਆਨ ਧਰਦਾ ਰਹਾਂ ਤੇ ਤੇਰਾ ਦਰਸਨ ਮੈਨੂੰ ਆਪਣੀ ਜਿੰਦ ਨਾਲੋਂ ਪ੍ਰਾਣਾਂ ਨਾਲੋਂ ਪਿਆਰਾ ਲੱਗੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਾਰੁ = ਧਾਰਉਂ, ਮੈਂ ਧਰਾਂ। ਰੈਨੀ = ਰਾਤ। ਜੀਅ ਤੇ = ਜਿੰਦ ਨਾਲੋਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues Te amo más que a mi vida. (1-Pausa)"