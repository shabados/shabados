[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਤਿ ਆਨੰਦ ਪ੍ਰਾਪਤਿ ਭੇ ਤਿਨ ਕੋ; ਦੁਖ ਥੇ ਜੁ ਜਿਤੇ, ਸਭ ਹੀ ਘਰਖੇ ॥"
page = 371

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They were extremely delighted and all their sufferings ended"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਨੂੰ ਬਹੁਤ ਆਨੰਦ ਪ੍ਰਾਪਤ ਹੋਇਆ ਅਤੇ ਜਿਤਨੇ ਵੀ ਦੁਖ ਸਨ, ਸਾਰੇ ਘਟ ਗਏ ਹਨ।"