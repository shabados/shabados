[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਸਨ ਸੀਤ ਸਮਸਰਿ ਸਭ; ਤਾ ਕੈ ॥"
page = 251
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Heat and cold are all alike to him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗਰਮੀ ਅਤੇ ਸਰਦੀ ਸਮੂਹ ਉਸ ਨੂੰ ਇਕ ਸਮਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Heat and cold are all the same to them."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ (ਉਸਨ) ਤਪਤ ਅਰ (ਸੀਤ) ਠੰਢ ਅਰਥਾਤ ਇਸਟ ਅਨਿਸ੍ਟ ਸਭ ਤਿਸ ਗ੍ਯਾਨੀ ਕੇ (ਸਮਸਰਿ) ਤੁਲ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਸਾਰਾ ਦੁਖ-ਸੁਖ ਇਕ-ਸਮਾਨ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਸਨ = ਗਰਮੀ, ਦੁੱਖ। ਸੀਤ = ਸਰਦੀ, ਸੁਖ। ਸਮਸਰਿ = ਬਰਾਬਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ve al dolor y al placer de la misma forma,"