[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਆਮਦ ਦੇ ਰਾਹ ਉੱਤੇ ਵਿਛਾ ਦਿੱਤਾ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਦੀਦਾ ਓ ਦਿਲ ਰਾ ਕਿ ਬੂਦਾ ਦਰ-ਬਸਾਤ ॥੪੪॥੨॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "You are just a drop of water, and the radiance (life) in you is the bestowal of Akaalpurakh. (54)"