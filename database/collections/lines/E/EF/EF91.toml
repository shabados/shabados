data = "(ਉਹ ਭਾਵੇਂ) ਹਜ਼ਾਰ ਕੌਤਕ ਕਿਉਂ ਨਾ ਕਰੇ, (ਉਨ੍ਹਾਂ ਨੂੰ) ਵਿਚਾਰ ਪੂਰਵਕ ਸ਼ਬਦਾਂ ਵਿਚ ਗੁੰਦਣਾ ॥੪੦॥"