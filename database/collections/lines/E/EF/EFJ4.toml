[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਦਾਸ ਸਦਾ ਬਲਿਹਾਰੀ ॥"
page = 742
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Slave Nanak is ever a sacrifice unto,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੋਲਾ ਨਾਨਕ ਸਦੀਵ ਹੀ ਘੋਲੀ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Slave Nanak is forever a sacrifice"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੈਂ ਦਾਸ ਤਿਸ ਕੇ ਸਦਾ ਬਲਿਹਾਰ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਆਖ-) ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਤੇਰੇ ਸੇਵਕਾਂ ਸੰਤਾਂ ਤੋਂ ਸਦਾ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak, el Sirviente del Señor, ofrece su ser siempre en sacrificio a Él"