[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰੁ ਗਹਿ ਲੀਨੀ ਪਾਰਬ੍ਰਹਮਿ; ਬਹੁੜਿ. ਨ ਵਿਛੁੜੀਆਹੁ ॥"
page = 135
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "She, whom the Supreme Lord has grasped by hand separates not again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼੍ਰੋਮਣੀ ਸਾਹਿਬ ਨੇ ਜਿਸ ਦਾ ਹੱਥ ਪਕੜ ਲਿਆ ਹੈ, ਉਹ ਮੁੜ ਕੇ ਜੁਦਾ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Supreme Lord God grasps someone's hand, he shall never again suffer separation from Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਾਰਬ੍ਰਹਮ ਨੇ ਜੋ ਜੀਵ ਰੂਪੀ ਇਸਤ੍ਰੀ ਮਨ ਰੂਪੀ ਹਾਥ ਸੇ ਪਕੜ ਲਈ ਹੈ, ਸੋ ਫਿਰ ਭਿੰਨ ਨਹੀਂ ਹੋਤੀ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਾਰਬ੍ਰਹਮ ਨੇ (ਉਸ ਦਾ) ਹੱਥ ਫੜ ਕੇ (ਉਸ ਨੂੰ ਆਪਣੇ ਚਰਨਾਂ ਵਿਚ) ਜੋੜਿਆ ਹੁੰਦਾ ਹੈ, ਉਹ ਮੁੜ (ਉਸ ਦੇ ਚਰਨਾਂ ਤੋਂ) ਵਿੱਛੁੜਦੀ ਨਹੀਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰੁ = ਹੱਥ। ਗਹਿ = ਫੜ ਕੇ। ਪਾਰਬ੍ਰਹਮਿ = ਪਾਰਬ੍ਰਹਮ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si Dios te toma de la mano acercándote hacia Él, no te separarás otra vez."