[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਮੈ ਕਾ ਫਲੁ ਪਾਇਆ ॥"
page = 132
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and I have obtained the fruit of life."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੈਂ ਜੀਵਨ ਦਾ ਮੇਵਾ ਪਰਾਪਤ ਕਰ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have obtained the fruits of life's rewards."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪੁਰਸ਼ ਨੇ ਜਨਮੇ ਕਾ ਫਲ੍ਹ ਪਾਇ ਲੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਮਨੁੱਖਾ ਜਨਮ ਦਾ ਫਲ ਪ੍ਰਾਪਤ ਕਰ ਲਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y recogido el fruto de la vida."