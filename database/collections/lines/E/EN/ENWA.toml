[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਛਾਡਤ ਜ੍ਵਾਲ ਲਏ ਕਰ ਬ੍ਰਯਾਲ; ਸੁ ਕਾਲ ਸਦਾ ਪ੍ਰਤਿਪਾਲ ਤਿਹਾਰੋ ॥੧੭॥"
page = 810

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Your viperous hands are snarling out flames.And God Almighty is your protector.(17)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੱਥ ਵਿਚ ਲਏ ਹੋਏ ਸੱਪ ਅੱਗ ਛਡ ਰਹੇ ਹਨ। (ਹੇ ਦੇਵੀ!) ਕਾਲ ਸਦਾ ਤੇਰਾ ਪ੍ਰਤਿਪਾਲਕ ਹੈ ॥੧੭॥"