data = "ਤੁ ਮਾਰਾ ਬਿਕੁਨ ਯਾ ਬਿਗੀਰੀ ਕਮਾ ॥੮੧॥"
page = 1403

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Either you accept me or take up the bow to fight with me.‘(81)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰੇ ਨਾਲ ਵਿਆਹ ਕਰ ਲੈ ਜਾਂ ਫਿਰ ਕਮਾਨ ਪਕੜ ਲੈ ॥੮੧॥"