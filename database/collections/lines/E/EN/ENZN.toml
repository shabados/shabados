[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਹਿ ਨਾਮੁ; ਕਰਿ ਅਪਣੇ ਚੇਰੇ ॥੧॥ ਰਹਾਉ ॥"
page = 742
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Bless me with Thy Name and make me Thy slave. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਆਪਣਾ ਨਾਮ ਬਖਸ਼ ਅਤੇ ਮੈਨੂੰ ਆਪਣਾ ਗੋਲਾ ਬਣਾ ਲੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please bless me with Your Name, and make me Your chaylaa, Your disciple. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰੇ ਕੋ ਅਪਨੇ ਦਾਸ ਜਾਨ ਕਰ ਨਾਮ ਕਾ ਸਿਮਰਣ ਦੇਵੋ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਰਾਹੀਂ) ਮੈਨੂੰ ਆਪਣਾ ਸੇਵਕ ਬਣਾ ਕੇ (ਆਪਣਾ) ਨਾਮ ਬਖ਼ਸ਼ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਬਣਾ ਕੇ। ਚੇਰੇ = ਸੇਵਕ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "bendíceme con Tu Nombre y conviérteme en Tu Chela, en Tu Discípulo. (1-Pausa)"