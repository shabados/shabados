data = "ਨਾ ਟੁੱਟਣ ਵਾਲੇ, ਨਾ ਖ਼ਤਮ ਹੋਣ ਵਾਲੇ, ਮਹਾਨ ਅਤੇ ਪ੍ਰਬਲ ਹੋ ॥੯॥੨੯੯॥"