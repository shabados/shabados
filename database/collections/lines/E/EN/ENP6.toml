type = "primary"
data = "ਛੋਰੈ ਚੋਟ ਕਹੂੰ ਕਹੂੰ ਜਾਵੈ ॥੧੧॥"
page = 1001

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Being not able to see at night, their arrows would go astray.(11)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ ਤੀਰ ਦੀ) ਚੋਟ ਕਿਧਰੇ ਕਰਦੇ, ਪਰ (ਉਹ) ਕਿਤੇ ਹੋਰ ਹੀ ਜਾ ਕੇ ਡਿਗਦੇ ॥੧੧॥"