[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਨਾਮਿ ਅਰਾਧਿਐ; ਬਿਘਨੁ. ਨ ਲਾਗੈ ਕੋਇ ॥੨॥"
page = 521
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Contemplating on the Name, O Nanak, no calamity befalls the mortal."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਨਾਮ ਦਾ ਚਿੰਤਨ ਕਰਨ ਦੁਆਰਾ, ਪ੍ਰਾਣੀ ਨੂੰ ਕੋਈ ਮੁਸੀਬਤ ਨਹੀਂ ਵਾਪਰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, worshipping the Naam, the Name of the Lord, the mortal encounters no misfortune. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਸ ਕੇ ਨਾਮ ਕੇ ਅਰਾਧਨੇ ਕਰ ਫਿਰ ਕੋਈ ਬਿਘਨ ਨਹੀਂ ਲਗਤਾ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜੇ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਸਿਮਰੀਏ ਤਾਂ (ਜੀਵਨ-ਰਾਹ ਵਿਚ) ਕੋਈ ਰੁਕਾਵਟ ਨਹੀਂ ਪੈਂਦੀ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਮਿ = {ਅਧਿਕਰਣ ਕਾਰਕ, ਇਕ-ਵਚਨ}। ਨਾਮਿ ਅਰਾਧਿਐ = (ਪੂਰਬ ਪੂਰਨ ਕਾਰਦੰਤਕ, Locative Absolute) ਜੇ ਨਾਮ ਸਿਮਰੀਏ} ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, si uno medita en el Nombre del Señor, jamás volverá a sentir tristeza. (2)"