[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਿਉ ਖਗਰਾਜ ਬਡੋ ਅਹਿਰਾਜ; ਸਮਾਜ ਕੇ, ਕਾਟਿ ਕਤਾ ਕਰਿ ਲੀਨੋ ॥੩੬॥"
page = 78

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That Garuda had chopped the snakes into bits and thrown them helter-skelter.36."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਗਰੁੜ (ਖਗ ਰਾਜ) ਨੇ ਸੱਪਾਂ ਦੇ ਸਮੂਹ (ਸਮਾਜ) ਨੂੰ ਕਟ ਕੇ ਟੋਟੇ ਟੋਟੇ ਕਰ ਦਿੱਤਾ ਹੈ ॥੩੬॥"