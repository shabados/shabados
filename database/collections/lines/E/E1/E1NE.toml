[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵੇਸੁਆ ਪੁਤੁ, ਨਿਨਾਉ ਸਦਾਵੈ ॥੧੭॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "And similar to courtesan's son bearing no name of his father, the apostate is also not owned by anyone."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਵੇਸ਼ਵਾ ਦਾ ਪੁੱਤ੍ਰ ਨਿਨਾਵਾਂ ਸਦਾਉਂਦਾ ਹੈ।"