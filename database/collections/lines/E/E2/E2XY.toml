[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਉ ਨਾਨਕ; ਮੋਖੰਤਰੁ ਪਾਏ ॥੨॥"
page = 470
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "it is then, O Nanak that he obtains salvation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਹੀ ਹੇ ਨਾਨਕ, ਉਹ ਮੁਕਤੀ ਨੂੰ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, salvation is attained. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਰਿਦੇ ਕੇ ਅੰਦਰ ਮੋਖ੍ਯ ਪਾਵਤਾ ਹੈ ਵਾ ਅੰਤਰ ਭੇਦ ਮੋਖ੍ਯ ਪਾਵਤਾ ਹੈ ਅਰਥਾਤ ਅਭੇਦ ਨਿਸਚਯ ਹੋਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਉਹ ਮੁਕਤੀ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "será emancipado! (2)"