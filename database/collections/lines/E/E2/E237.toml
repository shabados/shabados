[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਜੀਆ ਪੁਤ੍ਰ ਦਿਖਿਯੋ ਡਰੇ ਦੋਇ ਭ੍ਰਾਤੰ ॥"
page = 152

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Both the brothers were frightened on seeing the son of the maid-servant."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਜੀਆ (ਦਾਸੀ) ਦੇ ਪੁੱਤਰ (ਅਜੈ ਸਿੰਘ) ਨੂੰ ਵੇਖ ਕੇ ਦੋਵੇਂ (ਰਾਜਕੁਮਾਰ) ਭਰਾ ਡਰ ਗਏ।"