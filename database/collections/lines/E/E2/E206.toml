[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਠਾਕੁਰ ਅਪੁਨੇ; ਜੋ ਜਨੁ ਭਾਇਆ ॥"
page = 256
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The person, who is pleasing to His Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਪੁਰਸ਼ ਆਪਣੇ ਪ੍ਰਭੂ ਨੂੰ ਚੰਗਾ ਲਗਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That humble being, who is pleasing to his Lord and Master"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੁਰਸ਼ ਅਪਨੇ ਠਾਕੁਰ ਕੋ ਭਾਇ ਗਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਪਿਆਰੇ ਪਰਮਾਤਮਾ ਨੂੰ ਚੰਗਾ ਲੱਗ ਪੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਇਆ = ਪਿਆਰਾ ਲੱਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que cuenta con el Placer del Señor,"