[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰਾ. ਅੰਤੁ ਨ ਪਾਰਾਵਾਰਾ ॥"
page = 1004
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou, O Lord, has no limit, this or that end,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੈਂਡਾ ਹੇ ਸਾਈਂ ਕੋਈ ਓੜਕ ਇਹ ਜਾਂ ਉਹ ਕਿਨਾਰਾ ਨਹੀਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You have no end or limitation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਾਰ ਉਰਾਰ ਕਥਨ ਕਰ ਤੇਰਾ ਅੰਤ ਨਹੀਂ ਪਾਇਆ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਗੁਣਾਂ ਦਾ ਅੰਤ ਨਹੀਂ ਪੈ ਸਕਦਾ, ਤੇਰੀ ਹਸਤੀ ਦਾ ਉਰਲਾ ਪਾਰਲਾ ਬੰਨਾ ਨਹੀਂ ਲੱਭ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No Tienes fin o límite"