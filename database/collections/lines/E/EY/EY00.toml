data = "ਗਹੀ ਸਰਣ ਬਿਪ੍ਰੰ ਬੁਲਿਯੋ ਏਵ ਬਾਤੰ ॥"
page = 152

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They took shelter of the Brahmin and said:"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਨ੍ਹਾਂ ਨੇ ਸਨੌਢੀਏ) ਬ੍ਰਾਹਮਣ ਦੀ ਸ਼ਰਨ ਲੈ ਕੇ ਇਸ ਤਰ੍ਹਾਂ ਗੱਲ ਕਰਨ ਲਗੇ"