data = "ਨਿਕਸਿ ਆਪੁ ਠਾਢੀ ਭਈ; ਗ੍ਰਿਹ ਕੌ ਆਗਿ ਲਗਾਇ ॥੯॥"
page = 819

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And came outside the house and stood there.(9)"

[[content]]
