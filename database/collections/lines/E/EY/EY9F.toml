[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜਿਉ ਨੀਵਾਨਿ, ਨੀਰੁ ਚਲਿ ਜਾਈ ॥੪॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Just as the water flows down towards low"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜਿੱਕੁਰ ਪਾਣੀ ਨਿਵਾਣ ਨੂੰ ਤੁਰਕੇ ਜਾਂਦਾ ਹੈ।"