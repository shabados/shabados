[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਭਾਵੈ; ਤਿਸੁ ਲਏ ਲੜਿ ਲਾਇ ॥"
page = 269
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He attaches to His skirt Him, whom he likes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਉਸ ਨੂੰ ਆਪਣੇ ਪੱਲੇ ਨਾਲ ਜੋੜ ਲੈਂਦਾ ਹੈ ਜਿਹੜਾ ਉਸ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those with whom He is pleased are attached to the hem of His robe."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਚਾਹੁਤਾ ਹੈ ਤਿਸੁ ਜਨ ਕੋ ਵਹੁ ਅਪਨੇ ਲੜ ਅਰਥਾਤ ਆਸਰੇ ਵਾ ਚਰਨੋਂ ਸਾਥ ਲਗਾਇ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ (ਜੀਵ) ਉਸ ਨੂੰ ਭਾਉਂਦਾ ਹੈ ਉਸ ਨੂੰ ਆਪਣੇ ਲੜ ਲਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸ ਭਾਵੈ = ਜੋ ਤਿਸੁ ਭਾਵੈ, ਜੋ ਉਸ ਨੂੰ ਭਾਉਂਦਾ ਹੈ। ਤਿਸੁ = ਉਸ ਨੂੰ। ਥਾਨ"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él toma en Su Regazo a quien escoge,"