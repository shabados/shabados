data = "ਰੇ ਮਨ, ਐਸੋ ਕਰ ਸੰਨਿਆਸਾ ॥"
page = 709

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O mind! the asceticism be practised in this way :"

[[content]]
