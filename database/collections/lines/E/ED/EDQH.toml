[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੇ ਸੂਚੇ; ਮੈਲੁ ਨ ਭਾਵੈ ॥"
page = 222
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True and Pure Lord likes not filth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚਾ ਤੇ ਪਵਿੱਤ੍ਰ ਪ੍ਰਭੂ ਮਲੀਣਤਾ ਨੂੰ ਪਸੰਦ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Pure True Lord is not pleased by filth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਪੁਰਸ ਸਾਚੇ ਨਾਮ ਕਰ ਕੇ (ਸਾਚੇ) ਪਵਿਤ੍ਰ ਭਏ ਹੈਂ ਤਿਨ ਕੋ ਅਸੁਧ ਪਦਾਰਥ ਰੂਪੀ ਮੈਲ ਭਾਵਤੀ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਤੇ (ਵਿਕਾਰਾਂ ਦੀ ਭਿੱਟ ਤੋਂ) ਸੁੱਚੇ ਪਰਮਾਤਮਾ ਨੂੰ (ਮਨੁੱਖ ਦੇ ਮਨ ਦੀ ਇਹ) ਮੈਲ ਚੰਗੀ ਨਹੀਂ ਲੱਗਦੀ (ਇਸ ਵਾਸਤੇ ਇਹ ਪਰਮਾਤਮਾ ਤੋਂ ਵਿਛੁੜਿਆ ਰਹਿੰਦਾ ਹੈ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero el Alma pura no consiente que la mente titubee en sus andanzas."