[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਾਗੀ ਪ੍ਰੀਤਿ; ਨ ਤੂਟੈ ਮੂਲੇ ॥"
page = 105
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Love contracted with the Lord never sunders."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਨਾਲ ਪਿਰਹੜੀ ਪਾਈ ਹੋਈ ਕਦਾਚਿਤ ਨਹੀਂ ਟੁਟਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The bonds of love with the Lord are never broken."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਉਨੋਂ ਕੀ ਪੂਰਬੋਕਤ ਪ੍ਰਕਾਰ ਸੇ ਆਪ ਮੇਂ ਐਸੀ ਪ੍ਰੀਤਿ ਲਗੀ ਹੈ ਕਿ ਜੋ (ਮੂਲੇ) ਕਦਾਚਿਤ ਨਹੀਂ ਤੁਟਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਚਰਨਾਂ ਨਾਲ ਲੱਗੀ ਹੋਈ ਉਸ ਦੀ ਪ੍ਰੀਤਿ ਉੱਕਾ ਹੀ ਨਹੀਂ ਟੁੱਟਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂਲੇ = ਮੂਲਿ, ਬਿਲਕੁਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi apego al Señor no puede ser quebrantado;"