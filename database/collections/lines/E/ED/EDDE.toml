[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕ੍ਰਿਸਨ ਕ੍ਰਿਸਨ ਮੁਖ ਤੇ ਕਹੈ; ਛੋਰਿ ਧਾਮ ਕੋ ਕਾਮ ॥"
page = 902

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Abandoning all the household work, she would always recount, ‘Krishna. Krishna.’"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਘਰ ਦੇ ਕੰਮ ਕਾਰ ਛਡ ਕੇ (ਉਹ ਸਦਾ) ਮੁਖ ਤੋਂ 'ਕ੍ਰਿਸ਼ਨ ਕ੍ਰਿਸ਼ਨ' ਕਹਿੰਦੀ ਰਹਿੰਦੀ"