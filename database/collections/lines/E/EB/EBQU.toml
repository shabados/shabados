[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕੈ ਸੰਗਿ; ਅਬਿਨਾਸੀ ਵਸਿਆ ॥੬॥"
page = 237
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With him abides the Eternal Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਨਾਲ ਅਮਰ ਠਾਕੁਰ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Imperishable Lord abides with them. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੇ ਸਾਥ ਅਬਿਨਾਸੀ ਬਸਿਆ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਹਿਰਦੇ ਵਿਚ ਅਬਿਨਾਸੀ ਪਰਮਾਤਮਾ ਆ ਵੱਸਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "dentro de él habita el Señor Eterno. (6)"