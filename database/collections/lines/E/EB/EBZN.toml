[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਨਾਮੁ. ਨ ਜਪਹਿ; ਕਰਤ ਬਿਪਰੀਤਿ ॥"
page = 298
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mortals utter not God's Name and take to evil ways."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਨਹੀਂ ਕਰਦੇ ਅਤੇ ਖੋਟੇ ਰਾਹੀਂ ਪੈਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "People do not chant the Lord's Name; instead, they practice evil."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਹਰੀ ਕਾ ਨਾਮ ਜਪਤੇ ਨਹੀਂ ਹੈਂ ਜਪਨ ਉਪਲਖਤ ਸਰਬ ਇੰਦ੍ਰੀਓਂ ਕਰ ਭਗਤੀ ਨਹੀਂ ਕਰਤੇ ਹੈਂ, ਭਗਤੀ ਸੇ (ਬਿਪਰੀਤਿ) ਉਲਟੇ ਸਾਕਤਪਣੇ ਕਾ ਕਾਮ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਨਹੀਂ ਜਪਦੇ। ਉਹ (ਮਨੁੱਖਤਾ ਦੀ ਮਰਯਾਦਾ ਦੇ) ਉਲਟ (ਮੰਦੇ) ਕਰਮ ਕਰਦੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਪਰੀਤਿ = ਉਲਟੀ ਰੀਤਿ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si uno no contempla el Nombre y se conduce por el camino de la maldad,"