[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪੂਰੇ ਕੀ ਸਰਣੀ ਪਰੇ ॥੩॥"
page = 1185
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have sought the protection of the perfect Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਪੂਰਨ ਗੁਰਾਂ ਦੀ ਪਨਾਹ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have sought the Sanctuary of the Perfect Guru. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੁਰਸ ਪੂਰੇ ਗੁਰੋਂ ਕੀ ਸਰਨੀ ਪੜੇ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਮਨੁੱਖ ਪੂਰੇ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਗਏ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así pude buscar el Santuario del Perfecto Guru. (3)"