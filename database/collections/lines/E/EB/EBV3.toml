[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਨਾ ਸਰਨ ਤਾ ਕੀ ਨ ਕੋਟੈ ਉਪਾਯੰ ॥੭੬॥"
page = 45

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Without coming under His shelter, millions of measures for protection will be useless. 76."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸਭ) ਉਸ ਦੀ ਓਟ ਤੋਂ ਬਿਨਾ ਕਰੋੜਾਂ ਉਪਾ (ਕਰਨ ਨਾਲ ਵੀ ਕਾਲ ਦੀ ਮਾਰ ਤੋਂ ਬਚ) ਨਹੀਂ ਸਕਦੇ ॥੭੬॥"