[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨੇ ਭਗਤ. ਕਰਹਿ ਪ੍ਰਤਿਪਾਲਾ ॥"
page = 630
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou cherisheth Thine saints, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੇ ਸੰਤਾਂ ਦੀ ਪਾਲਣਾ-ਪੋਸਣਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You cherish Your devotees."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਅਪਨੇ ਭਗਤੋਂ ਕੀ ਤੂੰ ਵਸੇਸ ਕਰ ਪ੍ਰਤਿਪਾਲਾ ਕਰਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੇ ਭਗਤਾਂ ਦੀ ਰਖਵਾਲੀ ਆਪ ਹੀ ਕਰਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਹਿ = ਤੂੰ ਕਰਦਾ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "elevas a Tus Devotos, Maravillosa es Tu Gloria."