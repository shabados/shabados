data = "ਸਦਾ ਸੁ ਬਨ ਕੇ ਬੀਚ ਬਿਹਾਰੈ ॥"
page = 961

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Remaining always in the jungle, he used to kill many deer."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਦਾ ਬਨ ਵਿਚ ਹੀ ਘੁੰਮਦਾ ਰਹਿੰਦਾ ਸੀ।"