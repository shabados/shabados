[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਲਿਨ ਭਈ ਮਤਿ. ਮਾਧਵਾ; ਤੇਰੀ ਗਤਿ. ਲਖੀ ਨ ਜਾਇ ॥"
page = 346
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My understanding is gone dirty and I cannot understand Thy condition O Lord of light."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਸਮਝ ਮਲੀਨ ਹੋ ਗਈ ਹੈ ਅਤੇ ਮੈਂ ਤੇਰੀ ਦਸ਼ਾ ਨੂੰ ਨਹੀਂ ਸਮਝ ਸਕਦਾ, ਹੇ ਪ੍ਰਕਾਸ਼ ਦੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My intellect is polluted; I cannot understand Your state, O Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਧਵੇ! ਮੇਰੀ ਬੁਧੀ ਬਿਸ੍ਯੋਂ ਕਰ ਮਲਿਨ ਭਈ ਹੈ, ਯਾਂ ਤੇ ਤੇਰੀ ਗਤ ਲਖੀ ਨਹੀਂ ਜਾਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੇਰੀ ਅਕਲ (ਵਿਕਾਰਾਂ ਨਾਲ) ਮੈਲੀ ਹੋਈ ਪਈ ਹੈ, (ਇਸ ਵਾਸਤੇ) ਮੈਨੂੰ ਤੇਰੀ ਗਤੀ ਦੀ ਪਛਾਣ ਨਹੀਂ ਆਉਂਦੀ (ਭਾਵ, ਮੈਨੂੰ ਸਮਝ ਨਹੀਂ ਪੈਂਦੀ ਕਿ ਤੂੰ ਕਿਹੋ ਜਿਹਾ ਹੈਂ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਲਿਨ = ਮਲੀਨ, ਮੈਲੀ। ਮਤਿ = ਅਕਲ। ਮਾਧਵਾ = ਹੇ ਪ੍ਰਭੂ! ਗਤਿ = ਹਾਲਤ। ਲਖੀ ਨ ਜਾਇ = ਪਛਾਣੀ ਨਹੀਂ ਜਾ ਸਕਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Muchos son los discursos sobre la fe, y muchos son los adeptos también, pero,"