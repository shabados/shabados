[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੀ ਮੇਰੀ ਧਾਰੀ ॥"
page = 1004
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To harbour egoism and self-hood,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੁਦੀ ਤੇ ਅਪਣਤ ਕਰਨੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Harboring self-conceit and self-interest"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਇਸ ਜੀਵ ਨੇ ਮੇਰੀ ਮੇਰੀ ਮਨ ਮੇਂ ਧਾਰੀ ਹੈ ਅਰਥਾਤ ਇਹੁ ਮੇਰੀ ਜਾਤੀ ਇਤ੍ਯਾਦਿ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਮਮਤਾ ਵਸਾਈ ਰੱਖਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੇਰੀ ਮੇਰੀ = ਮਮਤਾ। ਧਾਰੀ = ਹਿਰਦੇ ਵਿਚ ਵਸਾਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el sentido de posesión que agarra nuestra mente,"