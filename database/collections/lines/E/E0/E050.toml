[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੁ ਵੇਲਾ ਮੂਰਤੁ ਸਚੁ; ਜਿਤੁ ਸਚੇ ਨਾਲਿ ਪਿਆਰੁ ॥"
page = 565
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is the time and true the trice when men enshrines affection for the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚਾ ਹੈ ਉਹ ਵਕਤ ਅਤੇ ਸੱਚਾ ਉਹ ਮੁਹਤ, ਜਦ ਬੰਦੇ ਦੀ ਸੱਚੇ ਸਾਈਂ ਨਾਲ ਪ੍ਰੀਤ ਪੈਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True is the time, and true is the moment, when one falls in love with the True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮੇਂ ਸਚੇ ਕੇ ਸਾਥ ਪਿਆਰ ਲਗ ਜਾਵੇ ਵਹੁ ਸਮ੍ਯ ਭੀ ਸਚਾ ਹੈ ਅਰ ਵਹੁ ਘੜੀ ਸਚੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਵੇਲਾ ਸਫਲ ਹੈ, ਉਹ ਮੁਹੂਰਤ ਸਫਲ ਹੈ ਜਦੋਂ ਕਿਸੇ ਦਾ ਪਿਆਰ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਨਾਲ ਬਣ ਜਾਂਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੁ = ਸਫਲ। ਮੂਰਤੁ = ਮੁਹੂਰਤ। ਜਿਤੁ = ਜਿਸ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Auspicioso es el momento en el que uno ama la Verdad; entonces uno ve la Verdad, habla la Verdad"