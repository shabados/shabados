[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਵਢੇ ਗਨ ਤਿਖਾਣੀ; ਮੂਏ ਖੇਤ ਵਿਚ ॥"
page = 122

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The demons are lying dead in the battlefield like the pieces of wood sawed by the carpenter."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਦੈਂਤ ਇਸ ਤਰ੍ਹਾਂ) ਯੁੱਧ-ਭੂਮੀ ਵਿਚ ਮਰੇ ਪਏ ਸਨ (ਜਿਵੇਂ) ਤਿਖਾਣ ਨੇ (ਲਕੜੀ ਦੇ) ਮੋਛੇ ਵੱਢ ਦੇ (ਸੁਟੇ ਹਨ)।"