[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਜਨੁ; ਮਿਲਿਆ ਹਰਿ ਪਾਸੀ ॥"
page = 801
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that person meets with his God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੁਰਸ਼ ਆਪਣੇ ਵਾਹਿਗੁਰੂ ਨਾਲ ਮਿਲ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "such a humble being meets with his Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਸੰਤ ਜਨ ਜੋ (ਪਾਸੀ) ਨਿਕਟ ਹੀ ਥੀ, ਤਿਸ ਹਰੀ ਕੇ ਸਰੂਪ ਮੇਂ ਮਿਲਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੇ ਚਰਨਾਂ ਵਿਚ ਮਿਲਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋ ਜਨੁ = ਉਹ ਮਨੁੱਖ। ਪਾਸੀ = ਪਾਸਿ, ਨੇੜੇ, ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "encuentra a su Señor, el Dios."