[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪੀਊ ਦਾਦੇ ਜੇਵੇਹਾ; ਪੜਦਾਦੇ ਪਰਵਾਣੁ ਪੜੋਤਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Grand father Guru Nanak, the grand son ( Guru Rain Das) has become great Like (spiritual) father Guru AmarDas, grand father Guru Angad and accepted (by sangat)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਿਤਾ (ਗੁਰੂ ਅਮਰ) ਦਾਦਾ (ਗੁਰੂ ਅੰਗਦ) ਪੜਦਾਦਾ (ਗੁਰੂ ਨਾਨਕ ਦੀ ਕੁਲ ਵਿਖੇ) ਉਹਨਾਂ ਵਰਗਾ ਪ੍ਰਮਾਣੀਕ ਪੜੋਤਾ ਹੋਇਆ।"