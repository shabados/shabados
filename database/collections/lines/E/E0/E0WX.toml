[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਆ ਹੋਵੈ. ਕਿਸੈ ਹੀ ਦੈ ਕੀਤੈ; ਜਾਂ ਧੁਰਿ ਕਿਰਤੁ ਓਸ ਦਾ. ਏਹੋ ਜੇਹਾ ਪਇਆ ॥"
page = 653
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What can be done by any body's doing, when he is so destined by God for his past deeds?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਜਣੇ ਦੇ ਕਰਨ ਨਾਲ ਕੀ ਹੋ ਸਕਦਾ ਹੈ, ਜਦ ਕਿ ਉਸ ਦੇ ਪੂਰਬਲੇ ਕਰਮਾਂ ਕਾਰਣ, ਵਾਹਿਗੁਰੂ ਨੇ ਉਸ ਲਈ ਐਹੋ ਜਿਹਾ ਲਿਖ ਛੱਡਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What can anyone do? Such is his destiny, according to his past deeds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਸੀ ਕੇ ਕੀਤੇ ਸੇ ਕਿਆ ਹੋਤਾ ਹੈ, ਜੋ ਤਿਸ ਕਾ ਕਰਮ ਹੀ ਆਦ ਸੇ ਐਸਾ ਪੜਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਦੇ ਭੀ ਕੀਤਿਆਂ ਕੁਝ ਨਹੀਂ ਹੋ ਸਕਦਾ (ਭਾਵ, ਕੋਈ ਉਸ ਨੂੰ ਸੁਮੱਤ ਨਹੀਂ ਦੇ ਸਕਦਾ), ਕਿਉਂਕਿ ਮੁੱਢ ਤੋਂ (ਕੀਤੇ ਮੰਦੇ ਕਰਮਾਂ ਦੇ ਸੰਸਕਾਰਾਂ ਅਨੁਸਾਰ ਹੁਣ ਭੀ) ਇਹੋ ਜਿਹੀ (ਭਾਵ, ਨਿੰਦਾ ਦੀ ਮੰਦੀ) ਕਮਾਈ ਕਰਨੀ ਪਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਰਤੁ = ਪਿਛਲੀ ਕੀਤੀ ਕਮਾਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Se revuelca como un loco, y calumniando a otros, muere."