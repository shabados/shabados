[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਸਾਥੀ ਅਤੇ ਤੇਰੀ ਹਾਣ ਨਾਲ ਹਾਣ ਮਿਲਾਣ ਵਾਲਾ ਤਾਣ ਬਾਦਸ਼ਾਹ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਸ਼ਾਹ ਬਾ ਤੂ ਹਮਨਸ਼ੀਨੋ ਹਮ ਜ਼ੁਬਾਣ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Then, all your desires in this world would be fulfilled,"