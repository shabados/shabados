[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਹਿ ਸਾਧ; ਕਰਹਿ ਆਨੰਦੁ ॥"
page = 199
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints remember God, and make merry."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਹਰੀ ਨੂੰ ਯਾਦ ਕਰਦੇ ਹਨ ਅਤੇ ਮੌਜਾਂ ਮਾਣਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Holy Saints meditate in remembrance, in ecstasy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਜਨ ਪਰਮੇਸ੍ਵਰ ਕੋ ਸਿਮਰਤੇ ਹੈਂ ਔਰ ਆਨੰਦ ਕੋ ਧਾਰਨ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜੇਹੜੇ) ਗੁਰਮੁਖ ਬੰਦੇ (ਹਰਿ-ਨਾਮ) ਸਿਮਰਦੇ ਹਨ, ਉਹ ਆਤਮਕ ਆਨੰਦ ਮਾਣਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧ = ਗੁਰਮੁਖ ਬੰਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Al contemplar a Dios, el Santo se llena de total regocijo;"