[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕ ਟੇਕ ਏਕੋ ਆਧਾਰੁ ॥"
page = 1139
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord alone is my refuge and He alone my support."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਸੁਆਮੀ ਹੀ ਮੇਰੀ ਪਨਾਹ ਹੈ ਅਤੇ ਕੇਵਲ ਉਹ ਹੀ ਮੇਰਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One and only Lord is my Support and Protection."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਮਨ ਬਾਣੀ ਕਰ ਕੇ ਏਕ ਵਾਹਗੁਰੂ ਕਾ ਹੀ (ਆਧਾਰੁ) ਆਸਰਾ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅਸਾਂ ਜੀਵਾਂ ਦੀ) ਉਹੀ ਟੇਕ ਹੈ ਉਹੀ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਧਾਰੁ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Apoyémonos entonces en el Único Soporte,"