[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹਿਤੂ ਹੇਤੁ ਗਿਰਿ ਪਰੀ ਧਰਨਿ; ਦੁਖੁ ਪਾਇ ਕੈ ॥"
page = 1015

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When she reached there, looking at her condition she fell flat."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ (ਆਪਣੀ) ਪਿਆਰੀ ਲਈ ਦੁਖੀ ਹੋ ਕੇ ਧਰਤੀ ਉਤੇ ਡਿਗ ਪਈ।"