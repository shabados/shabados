[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕ ਘੜੀ ਮਹਿ; ਥਾਪਿ ਉਥਾਪਿ ॥"
page = 364
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In an instant He establishes and disestablishes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਮੁਹਤ ਵਿੱਚ ਉਹ ਬਣਾ ਅਤੇ ਢਾਹ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In an instant, He establishes, and disestablishes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚਾਹੇ ਤੋ ਏਕ ਘੜੀ ਮੇਂ ਸੰਸਾਰ ਕੋ ਸਥਾਪਨ ਕਰ ਦੇ ਚਾਹੈ (ਉਥਾਪਿ) ਉਠਾਇ, ਭਾਵ ਪ੍ਰਲ੍ਯ ਕਰਦੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਇਕ ਘੜੀ ਵਿਚ ਪੈਦਾ ਕਰ ਕੇ ਤੁਰਤ ਨਾਸ ਭੀ ਕਰ ਸਕਦਾ ਹੈ'-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਥਾਪਿ = ਥਾਪ ਕੇ, ਬਣਾ ਕੇ। ਉਥਾਪਿ = ਉਥਾਪੇ, ਨਾਸ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y en un instante establece o quita todo."