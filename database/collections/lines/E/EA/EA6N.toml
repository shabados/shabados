[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੰਗ ਲਏ ਬਨਿਤਾ ਅਪੁਨੀ; ਬਨਿ ਕੈ ਜੁਗਿਯਾ ਬਨ ਓਰ ਸਿਧਾਯੋ ॥"
page = 909

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He took his wife with him, became yogi and travelled towards the jungle."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਇਸਤਰੀ ਨੂੰ ਨਾਲ ਲੈ ਕੇ ਅਤੇ ਜੋਗੀ ਬਣ ਕੇ ਬਨ ਵਲ ਚਲ ਪਿਆ।"