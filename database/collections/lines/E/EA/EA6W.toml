[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਲਪ ਬ੍ਰਿਛ ਕੁਬ੍ਰਿਤਨ ਕ੍ਰਿਪਾਨ; ਜਸ ਤਿਲਕ ਸੁਭਟ ਅਤਿ ॥"
page = 698

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is like Elysian tree (Kalapvrikasha) and chops the evil modification with his sword"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਲਪ ਬ੍ਰਿਛ (ਵਾਂਗ ਇੱਛਾਵਾਂ ਪੂਰੀਆਂ ਕਰਨ ਵਾਲਾ) ਕੁਵ੍ਰਿੱਤੀਆਂ ਨੂੰ ਕ੍ਰਿਪਾਨ (ਨਾਲ ਕਟਣ ਵਾਲਾ) ਜਸ ਦਾ ਤਿਲਕ ਰੂਪ ਬਹੁਤ ਤਕੜਾ ਸੂਰਮਾ ਹੈ।"