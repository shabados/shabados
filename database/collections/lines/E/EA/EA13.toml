[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਹਾ ਰੁਦ੍ਰ ਹੂੰ ਰਿਸਿ ਕਰੇ; ਕਾਮਦੇਵ ਪਹਿਚਾਨਿ ॥੬॥"
page = 812

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Who was as powerful as Shiva and passionate like Kamdev, the Cupid.(6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੂੰ) ਕਾਮ ਦੇਵ ਸਮਝ ਕੇ ਸ਼ਿਵ ਕ੍ਰੋਧਿਤ ਹੋ ਰਿਹਾ ਸੀ ॥੬॥"