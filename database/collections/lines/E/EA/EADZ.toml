data = "ਰਾਜਾ ਕੌ ਮਨ ਤੇ ਬਿਸਰਾਯੋ ॥"
page = 998

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She fell for this friend so much that she wiped out love for Raja."

[[content]]
