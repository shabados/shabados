[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੋਜ ਭੁਜੇ, ਤਉ ਛੂਟੇ ਕਰਮਾ ॥੫॥੨੯੫॥"
page = 152

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“If we eat their food, then we pollute our Karmas.”5.295."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜੇ ਭੋਜਨ ਕਰ ਲਈਏ ਤਾਂ ਕਰਮਾਂ ਦਾ ਨਾਸ਼ ਹੋ ਜਾਏਗਾ ॥੫॥੨੯੫॥"