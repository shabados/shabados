[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਪ੍ਰਸਾਦਿ; ਹਸਤ ਕਰ ਚਲਹਿ ॥"
page = 270
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose grace thine hands move and do the work,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਦਇਆ ਦੁਆਰਾ ਤੂੰ ਤੇਰੇ ਹੱਥ ਹਿਲਦੇ ਅਤੇ ਕੰਮ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By His Grace, your hands move and work."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਤੂੰ ਹਾਥੋਂ ਸੇ ਪਦਾਰਥ ਪਕੜਨਾ ਕਰਤਾ ਹੈਂ ਅਰ ਚਰਨੋਂ ਕਰ ਕੇ (ਚਲਹਿ) ਵਿਚਰਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਦਇਆ ਨਾਲ ਤੇਰੇ ਹੱਥ (ਆਦਿਕ ਸਾਰੇ ਅੰਗ) ਕੰਮ ਦੇ ਰਹੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਸਤ = ਹੱਥ। ਕਰ = ਹੱਥ। ਚਲਹਿ = ਚੱਲਦੇ ਹਨ, ਕੰਮ ਦੇਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por su Gracia , eres lleno."