data = "ਨਾਮ ਤੁਪਕ ਕੇ ਸਭ ਜੀਅ ਜਾਨਹੁ ॥੯੪੫॥"
page = 773

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Rain-raatnani”, add the words “Jaachar-nayak-shatru” nod know all the names of Tupak.945."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਮਨ ਵਿਚ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝ ਲਵੋ ॥੯੪੫॥"