[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਗੁਰ ਸਾਚੇ; ਨਹੀ ਜਾਇ ॥"
page = 1183
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the True Guru, there is no other place of rest,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਦੇ ਬਾਝੋਂ, ਹੋਰ ਕੋਈ ਆਰਾਮ ਦਾ ਟਿਕਾਣਾ ਨਹੀਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the True Guru, there is no place to go."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਚੇ ਗੁਰੋਂ ਸੇ ਬਿਨਾਂ ਔਰ ਕੋਈ ਸੁਖਦਾਯਕ (ਜਾਇ) ਜਗਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸੇਵਕਾਂ ਨੂੰ) ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਰੂਪ ਗੁਰੂ ਤੋਂ ਬਿਨਾ ਹੋਰ ਕੋਈ ਆਸਰਾ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਇ = ਥਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Guru no hay Refugio,"