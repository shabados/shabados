data = "ਤਾ ਕੀ ਕਰੀ ਸਿਫਤਿ ਬਹੁ ਭਾਰਾ ॥"
page = 859

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Next day the court settled and the Shah assigned that woman to the thief."

