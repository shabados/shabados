[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੈਣਿ ਦਿਨਸੁ; ਜਪਉ ਹਰਿ ਨਾਉ ॥"
page = 893
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day invoke I the Lord's Name and,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਤੇ ਦਿਨ ਮੈਂ ਸਾਹਿਬ ਦੇ ਨਾਮ ਨੂੰ ਸਿਮਰਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, I chant the Lord's Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਰਾਤ ਦਿਨ ਹਰੀ ਕੇ ਨਾਮ ਕੋ ਜਪੋ॥☬ਪ੍ਰਸ਼ਨ: ਫਲ ਕਿਆ ਹੋਗਾ?☬ਉੱਤਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਕਿਰਪਾ ਕਰ) ਮੈਂ ਦਿਨ ਰਾਤ ਹਰਿ-ਨਾਮ ਜਪਦਾ ਰਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੈਣਿ = {रजनि} ਰਾਤ। ਦਿਨਸੁ = ਦਿਨ। ਜਪਉ = ਜਪਉਂ, ਮੈਂ ਜਪਦਾ ਰਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Contemplo el Nombre del Señor noche y día,"