[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੋਪ ਓਪ ਬਿਲੋਕਿ ਅਤਿਭੁਤ; ਦਾਨਵੰ ਬਿਸਮੈ ਭਏ ॥"
page = 106

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing this all the demons were filled with anger and astonishment."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋਧਵਾਨ ਹੋਏ ਦਾਨਵ (ਇਸ) ਅਜੀਬ (ਕੌਤਕ) ਨੂੰ ਵੇਖ ਕੇ ਹੈਰਾਨ ਹੋ ਗਏ।"