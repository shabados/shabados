[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਊਣੀ ਆਸ; ਮਿਥਿਆ ਸਭਿ ਬੋਲਾ ॥"
page = 1004
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His hope is fulfilled not and vain is all his utterance."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਉਮੈਦ ਪੂਰਨ ਨਹੀਂ ਹੁੰਦੀ ਅਤੇ ਬੇਫਾਇਦਾ ਹੈ ਉਸ ਦੀ ਸਾਰੀ ਗਲ-ਬਾਤ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His hopes are not fulfilled, and all his words are false."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਆਸਾ ਭੀ ਪੂਰੀ ਨਹੀਂ ਹੋਤੀ। ਜੇ ਕਹੇ ਹਮ ਬਿਸ੍ਯੋਂ ਸੇ ਤ੍ਰਿਪਤ ਹੈਂ। ਏਹੁ ਸਭਿ ਬੋਲ ਝੂਠੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇਰੀ ਰੱਜਣ ਦੀ) ਆਸ (ਕਦੇ) ਪੂਰੀ ਨਹੀਂ ਹੁੰਦੀ। ਨਾਸਵੰਤ ਮਾਇਆ ਦੀ ਖ਼ਾਤਰ ਹੀ ਤੇਰੀਆਂ ਸਾਰੀਆਂ ਗੱਲਾਂ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਊਣੀ = ਪੂਰੀ ਨਹੀਂ ਹੁੰਦੀ। ਮਿਥਿਆ = ਨਾਸਵੰਤ (ਮਾਇਆ ਖ਼ਾਤਰ ਹੀ)। ਸਭਿ = ਸਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y falso será todo lo que salga de sus labios."