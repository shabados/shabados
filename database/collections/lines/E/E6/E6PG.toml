[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੁਰਛਾਇ ਲੁਭਾਇ ਰਹੀ ਅਬਲਾ; ਲਖਿ ਲਾਲਚੀ ਲਾਲ ਤਿਸੀ ਛਿਨ ਮੈ ॥"
page = 951

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "His sensual body was making them to swoon and ponder,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਇਸਤਰੀਆਂ (ਉਸ ਨੂੰ) ਵੇਖ ਕੇ ਉਸੇ ਛਿਣ ਲਲਚਾ ਕੇ ਬੇਹੋਸ਼ ਹੋ ਰਹੀਆਂ ਸਨ।"