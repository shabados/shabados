[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਪਵਨ ਪਾਵਕ; ਅਰੁ ਨੀਰ ॥"
page = 1236
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Myriads are winds, fires and waters."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਟਾ ਹੀ ਹਨ ਹਵਾਵਾਂ, ਅੱਗਾ ਅਤੇ ਪਾਣੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many winds, fires and waters."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੇਕ ਹੀ ਪਵਨ ਦੇਵਤਾ ਅਰ ਅਗਨ ਦੇਵਤਾ ਅਰ (ਨੀਰ) ਜਲ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਸੰਤ ਜਨੋ! ਪਰਮਾਤਮਾ ਦਾ ਦਰਬਾਰ ਹੈਰਾਨ ਕਰਨ ਵਾਲਾ ਹੈ, ਉਸ ਦੇ ਪੈਦਾ ਕੀਤੇ ਹੋਏ) ਅਨੇਕਾਂ ਹੀ ਹਵਾ ਪਾਣੀ ਅਤੇ ਅੱਗ (ਆਦਿਕ) ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਵਨ = ਹਵਾ। ਪਾਵਕ = ਅੱਗ। ਅਰੁ = ਅਤੇ (ਅਰਿ = ਵੈਰੀ)। ਨੀਰ = ਪਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De Él salen los vientos, las aguas y los fuegos, millones de océanos de"