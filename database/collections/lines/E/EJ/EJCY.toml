[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੈ ਜਗਤੁ ਡਹਕਾਇਆ; ਕਹਣਾ ਕਛੂ ਨ ਜਾਇ ॥"
page = 492
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Lord has hook-winked the world and the man has no say therein."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਸਾਹਿਬ ਨੇ ਜਹਾਨ ਨੂੰ ਗੁੰਮਰਾਹ ਕੀਤਾ ਹੋਇਆ ਹੈ। ਆਦਮੀ ਦੀ ਇਸ ਵਿੱਚ ਕੁਝ ਆਖਣ ਦੀ ਮਜਾਲ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Lord has fooled the world - no one has any say in this at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚੇ ਪਰਮੇਸ੍ਵਰ ਨੇ ਸੰਸਾਰ ਕੋ (ਡਹਕਾਇਆ) ਭਰਮਾਇਆ ਹੈ, ਕੁਛ ਕਹਾ ਨਹੀਂ ਜਾਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ, ਹੇ ਪੰਡਿਤ! ਪਰਮਾਤਮਾ ਦੀ ਰਜ਼ਾ ਬਾਰੇ) ਕੁਝ ਕਿਹਾ ਨਹੀਂ ਜਾ ਸਕਦਾ, ਉਸ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਨੇ ਆਪ ਹੀ ਜਗਤ ਨੂੰ ਮਾਇਆ ਦੀ ਭਟਕਣਾ ਵਿਚ ਪਾਇਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਡਹਕਾਇਆ = ਭਟਕਣਾ ਵਿਚ ਪਾਇਆ। ਤਿਸੁ ਭਾਵੈ = ਉਸ ਪ੍ਰਭੂ ਨੂੰ ਭਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Mismo ha arrojado al mundo dentro de la duda, y así, ¿qué puede uno decir?"