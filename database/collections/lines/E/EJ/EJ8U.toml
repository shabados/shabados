[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਫਲੁ ਲਾਗਾ; ਤਬ ਫੂਲੁ ਬਿਲਾਇ ॥"
page = 1167
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When it fruitions, then the flowers decay."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਫਲ ਲੱਗ ਜਾਂਦਾ ਹੈ, ਤਦ ਫੁਲ ਨਾਸ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the fruit is produced, the flowers wither away."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਫਲ ਲਗ ਜਾਤਾ ਹੈ ਤਬ ਫੂਲ (ਬਿਲਾਇ) ਨਸਟ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਫਲ ਲੱਗਦਾ ਹੈ ਫੁੱਲ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਲਾਇ = ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero ve, cuando el fruto se asoma, la flor se va."