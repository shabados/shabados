[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਉਰਤ ਬੀਚ ਕਬੰਧ ਫਿਰੈ; ਜਿਹ ਦੇਖਤ, ਕਾਇਰ ਹੈ ਡਰ ਪਾਤੇ ॥"
page = 76

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The trunks are also twirling there, seeing which the cowards are frightened."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਰਣ-ਭੂਮੀ) ਵਿਚ ਧੜ ('ਕਬੰਧ') ਦੌੜਦੇ ਫਿਰਦੇ ਹਨ ਜਿਨ੍ਹਾਂ ਨੂੰ ਵੇਖਕੇ ਡਰਪੋਕ ਡਰ ਰਹੇ ਹਨ।"