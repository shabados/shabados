[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਵਰਨ ਕੇ ਸਿਰਿ ਦੈ ਬੁਰਿਆਈ ॥"
page = 155

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And imposes the villainy over the head of others"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸਾਰੀ ਕਾਰਵਾਈ ਖੁਦ ਕਰਦਾ ਹੈ, ਪਰ) ਬੁਰਿਆਈ ਹੋਰਨਾਂ ਦੇ ਸਿਰ ਦਿੰਦਾ ਹੈ।"