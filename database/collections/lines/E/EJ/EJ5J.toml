data = "Asa 3rd Guru. Rhythm."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਸਾ ਤੀਜੀ ਪਾਤਸ਼ਾਹੀ। ਛੰਦ।"

[[content]]
assets = ["DSSK"]
type = "translation"
