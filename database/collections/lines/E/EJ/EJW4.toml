[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਵਿ ਰਹਿਆ ਪ੍ਰਭੁ; ਸਭ ਮਹਿ ਆਪੇ ॥"
page = 804
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself is contained amongst all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਖੁਦ ਸਾਰਿਆਂ ਅੰਦਰ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God Himself is pervading, and permeating all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪ੍ਰਭੂ ਵਾਹਿਗੁਰੂ! ਤੂੰ ਆਪ ਹੀ ਸਰਬ ਵਿਖੇ ਪੂਰਨ ਹੋਇ ਰਹਿਆ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਜੇਹੜਾ) ਪਰਮਾਤਮਾ ਆਪ ਹੀ ਸਭ ਜੀਵਾਂ ਵਿਚ ਵਿਆਪਕ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਵਿ ਰਹਿਆ = ਮੌਜੂਦ ਹੈ। ਆਪੇ = ਆਪ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor prevalece en todos los corazones;"