[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਇਕ ਥਾਉਂ, ਦੁਇ ਨਾਉਂ ਧਰਾਏ ॥੨॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The ultimate shelter for both is the same one; only they have given different names to it."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਇਕੋ ਥਾਉਂ (ਉਤਪਤੀ ਦਾ ਥਾਉਂ ਇਕੋ ਈਸ਼੍ਵਰ ਹੈ) ਨਾਉਂ ਦੋ ਧਰ ਲੀਤੇ ਹਨ।"