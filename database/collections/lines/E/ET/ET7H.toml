type = "primary"
data = "ਸਾਚ ਕਲਾ ਸਸਿ ਕੀ ਦੁਰ ਗਈ ॥"
page = 552

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In every home, in the dark night of falsehood, the phases of the moon of truth are hidden"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸੱਚ ਰੂਪ ਚੰਦ੍ਰਮਾ ਦੀ ਕਲਾ ਲੁਕ ਛਿਪ ਗਈ ਹੈ।"