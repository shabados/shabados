[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈਲਾ; ਪਉਨੁ ਪਾਵਕੁ ਅਰੁ ਨੀਰੁ ॥੩॥"
page = 1158
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Impure are wind, fire and water."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਪਵਿੱਤ੍ਰ ਹਨ ਹਵਾ, ਅੱਗ ਅਤੇ ਪਾਣੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wind, fire and water are polluted. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਵਨ ਅਰੁ ਅਗਨੀ ਅਰੁ ਜਲੁ ਭੀ ਮੈਲਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਵਾ, ਅੱਗ ਤੇ ਪਾਣੀ ਭੀ ਮੈਲੇ ਹਨ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਵਕੁ = ਅੱਗ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh, manchado está el aire, el agua y el fuego. (3)"