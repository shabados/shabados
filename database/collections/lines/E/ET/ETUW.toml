[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚੋਆ ਚੰਦਨੁ; ਮਰਦਨ ਅੰਗਾ ॥"
page = 325
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The body to whose limbs thou appliest the otto of sandal,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਦੇਹਿ ਜਿਸ ਦੇ ਭਾਗਾਂ ਨੂੰ ਤੂੰ ਚੰਨਣ ਦਾ ਅਤਰ ਮਲਦਾ ਹੈਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You apply sandalwood oil to your limbs,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਿਸ ਸਰੀਰ ਕੇ ਅੰਗੋਂ ਕੋ ਚੋਆ ਚੰਦਨ ਮਲੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਸਰੀਰ ਦੇ) ਅੰਗਾਂ ਨੂੰ ਅਤਰ ਤੇ ਚੰਦਨ ਮਲੀਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੋਆ = ਅਤਰ। ਮਰਦਨ = ਮਾਲਸ਼। ਅੰਗਾ = ਸਰੀਰ ਦੇ ਅੰਗਾਂ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cada día uno aplica esencia de sándalo en el cuerpo,"