[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚਾ ਸਾਹਿਬੁ ਸਚੁ ਦਰਬਾਰੁ ॥"
page = 677
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is the Lord and true is His court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚ ਹੈ ਸੁਆਮੀ ਅਤੇ ਸੱਚੀ ਹੈ ਦਰਗਾਹ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True is the Lord, and True is His Court."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚਾ ਸੋ ਸਾਹਿਬੁ ਹੈ ਔਰ ਤਿਸ ਕਾ (ਦਰਬਾਰੁ) ਸਤਸੰਗ ਭੀ ਸਚਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮਾਲਕ-ਪ੍ਰਭੂ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਹੈ, ਉਸ ਦਾ ਦਰਬਾਰ (ਭੀ) ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Verdad es el Maestro, Verdad es Su Corte,"