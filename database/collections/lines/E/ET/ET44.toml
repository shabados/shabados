[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਦਾਤਾ; ਨਾਮੁ ਪਰਵਾਣੁ ॥੧॥"
page = 795
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art the beneficent Lord and at Thy door, the Name alone is accepted."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਦਰਿਆਦਿਲ ਸੁਆਮੀ ਹੈਂ ਤੇਰੇ ਦਰ ਤੇ ਕੇਵਲ ਨਾਮੀ ਹੀ ਕਬੂਲ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the Great Giver; Your Name alone is approved. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪ ਹੀ ਨਾਮ ਕਾ ਦਾਤਾ ਹੈਂ, ਜਿਨ ਕੋ ਨਾਮਦਾਨ ਤੈਂਨੇ ਦੀਆ ਹੈ, ਸੋ ਸੰਤ ਜਨ ਤੇਰੀ ਦਰਗਾਹ ਮੇਂ ਪ੍ਰਵਾਨ ਭਏ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ (ਜੀਵਾਂ ਨੂੰ ਸਭ ਦਾਤਾਂ) ਦੇਣ ਵਾਲਾ ਹੈਂ, (ਜਿਸ ਨੂੰ ਤੂੰ ਆਪਣਾ ਨਾਮ ਬਖ਼ਸ਼ਦਾ ਹੈਂ, ਉਹ ਤੇਰੇ ਦਰ ਤੇ) ਕਬੂਲ ਹੋ ਜਾਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਵਾਣੁ = ਕਬੂਲ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Señor; Eres Tú Quien observas Tu Poder. Eres el Señor Benévolo; sólo Tu Nombre tiene Tu Aprobación.(1)"