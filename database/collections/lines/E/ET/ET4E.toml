[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੀਤਾ ਲੋੜਹਿ; ਸੋ ਪ੍ਰਭ ਹੋਇ ॥"
page = 736
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever the Lord wishes to do that alone happens."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਛ ਸੁਆਮੀ ਕਰਨਾ ਚਾਹੁੰਦਾ ਹੈ, ਕੇਵਲ ਓਹੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever God wills, that alone happens."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜੋ ਤੂੰ ਕੀਆ ਚਾਹਤਾ ਹੈਂ ਸੋਈ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜੋ ਕੁਝ ਤੂੰ ਕਰਨਾ ਚਾਹੁੰਦਾ ਹੈਂ। (ਜਗਤ ਵਿਚ) ਉਹੀ ਕੁਝ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀਤਾ ਲੋੜਹਿ = ਤੂੰ ਕਰਨਾ ਚਾਹੁੰਦਾ ਹੈਂ। ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, todo lo que Tú deseas,"