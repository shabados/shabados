[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਸੰਗਤਿ ਮੇਲਾਪੁ; ਜਿਥੈ ਹਰਿ ਗੁਣ ਸਦਾ ਵਖਾਣੀਐ ॥"
page = 1280
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the society of the saints, where the Lord's praises are ever uttered, union with him is obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਰਾਹੀਂ, ਜਿਥੇ ਸਦੀਵ ਹੀ ਸੁਆਮੀ ਦੀਆਂ ਸਿਫਤਾਂ ਉਚਾਰਨ ਕੀਤੀਆਂ ਜਾਂਦੀਆਂ ਹਨ, ਉਸ ਦੇ ਨਾਲ ਮਿਲਾਪ ਪਰਾਪਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Sat Sangat, the True Congregation, Union with Him is obtained; there, the Glorious Praises of the Lord are chanted forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਸੰਗਤ ਕਰ ਤਿਸ ਕਾ ਮਿਲਾਪੁ ਹੋਤਾ ਹੈ॥☬ਜੇ ਕਹੇ ਸਤਸੰਗਤਿ ਕੈਸੀ ਹੋਤੀ ਹੈ? ਸੋ ਕਹਤੇ ਹੈਂ: ਜਹਾਂ ਸਦੀਵ ਹਰੀ ਕੇ ਗੁਣੋਂ ਕੋ ਕਥਨ ਕਰੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਪ੍ਰਭੂ ਦਾ) ਮਿਲਾਪ ਸਤਸੰਗ ਵਿਚ ਹੋ ਸਕਦਾ ਹੈ ਜਿਥੇ ਸਦਾ ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਕਥੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y en la Saad Sangat, la Verdadera Congregación, la Unión con Él es obtenida, pues es ahí donde las Gloriosas Alabanzas del Señor son entonadas para siempre."