[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਮੋਰੁ. ਕੁਹੁਕਿਅੜਾ; ਸਬਦੁ. ਮੁਖਿ ਪਾਇਆ ॥"
page = 173
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By tasting the Name - Nectar, my mind 's pea - cock has begun to chirp"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਅੰਮ੍ਰਿਤ ਨੂੰ ਚਖ ਕੇ ਮੇਰੇ ਮਨੂਏ ਦਾ ਸਿਖਾਧਾਰਬ ਚਹਿਚਹਾਉਣ ਲਗ ਪਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The peacock of the mind chirps, and receives the Word of the Shabad, in its mouth;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਸ਼ਬਦ ਮੁਖ ਮੇਂ ਪਾਇਆ ਤਬ ਮਨ ਰੂਪੀ ਮੋਰ ਅਨੰਦਤ ਹੂਆ ਬੋਲਿਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਬੱਦਲ ਨੂੰ ਵੇਖ ਵੇਖ ਕੇ) ਮੋਰ ਆਪਣੀ ਮਿੱਠੀ ਬੋਲੀ ਬੋਲਦਾ ਹੈ, (ਤਿਵੇਂ ਗੁਰੂ) ਨਾਮ-ਅੰਮ੍ਰਿਤ ਨਾਲ ਜਗਤ ਨੂੰ ਪ੍ਰਭਾਵਿਤ ਕਰਦਾ ਹੈ (ਜਿਸ ਵਡ-ਭਾਗੀ ਉਤੇ ਮਿਹਰ ਹੁੰਦੀ ਹੈ ਉਸ ਦਾ) ਮਨ ਉਛਾਲੇ ਮਾਰਦਾ ਹੈ (ਉਹ ਮਨੁੱਖ ਗੁਰੂ ਦੇ) ਸ਼ਬਦ ਨੂੰ ਆਪਣੇ ਮੂੰਹ ਵਿਚ ਪਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੁਹੁਕਿਅੜਾ = 'ਕੁਹ ਕੁਹ' ਕਰਦਾ ਹੈ, ਆਪਣੀ ਮਿੱਠੀ ਬੋਲੀ ਬੋਲਦਾ ਹੈ। ਮੁਖਿ = ਮੂੰਹ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre, y la  mente, como pavorreal, danza al ritmo y tono de la Palabra del Shabd;"