data = "ਅਭੂਤੰ ਭਯਾਣੰ ॥"
page = 46

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He hath manifested Himself without elements."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ) ਤੱਤ੍ਵਾਂ ਤੋਂ ਬਿਨਾ ਹੋਂਦ ਵਾਲੇ! (ਤੈਨੂੰ ਨਮਸਕਾਰ ਹੈ)।"