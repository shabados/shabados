[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਤੇਰਾ ਜਪੀ ਦਿਨੁ ਰਾਤਿ ॥੪॥੮॥੧੪॥"
page = 740
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that night and day, he may meditate on Thy Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿ ਦਿਨ ਰਾਤ ਉਹ ਤੇਰੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "that he may chant Your Name, day and night. ||4||8||14||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੇਰਾ ਨਾਮ ਦਿਨ ਰਾਤ ਜਪਾਂ॥੪॥੮॥੧੪॥☬ਅਪਨਾ ਨਿਸਚਾ ਪ੍ਰਗਟ ਕਰਤੇ ਹੂਏ ਸਨਮੁਖ ਬੇਨਤੀ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ (ਨਾਨਕ) ਦਿਨ ਰਾਤ ਤੇਰਾ ਨਾਮ ਜਪਦਾ ਰਹਾਂ ॥੪॥੮॥੧੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਪੀ = ਜਪੀਂ, ਮੈਂ ਜਪਦਾ ਰਹਾਂ ॥੪॥੮॥੧੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "de poder habitar en Tu Nombre noche y día.(4-8-14)"