type = "primary"
data = "ਰਹਗੇ ਜਨੁ ਕਿੰਸਕ ਸ੍ਰੋਣ ਸਨੇ ॥"
page = 189

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The helmets broke and fell in eh battlefield like the flowers saturated with blood."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜੋ) ਲਹੂ ਨਾਲ ਭਿਜੇ (ਇਉਂ ਮਲੂਮ ਹੁੰਦੇ ਸਨ) ਮਾਨੋ ਕੇਸੂ ਝੜੇ ਪਏ ਹੋਣ।"