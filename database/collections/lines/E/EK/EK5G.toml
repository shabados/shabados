[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਸਤਿਗੁਰ ਮੁਕਤਿ. ਕਿਨੈ, ਨ ਪਾਈ ॥"
page = 1343
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the True Guru, no one is emancipated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਦੇ ਬਗੈਰ, ਕਿਸੇ ਨੂੰ ਭੀ ਕਲਿਆਣ ਪਰਾਪਤ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the True Guru, no one is liberated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਸਤਿਗੁਰੋਂ ਤੇ ਬਿਨਾ ਕਿਸੀ ਨੇ ਮੁਕਤੀ ਨਹੀਂ ਪਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਰਨ ਤੋਂ ਬਿਨਾ ਕਦੇ ਕਿਸੇ ਨੂੰ (ਮਾਇਆ ਦੇ ਮੋਹ ਤੋਂ) ਖ਼ਲਾਸੀ ਨਹੀਂ ਮਿਲਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues sin el Guru Verdadero nadie logra la Liberación y sólo vienen y se van,"