[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਪੰਤ ਜਾਪੁ ਜਾਪਣੀ ॥੪੭੯॥"
page = 599

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The goddess Kali is seriously enumerating the corpses and filling her bowl with blood, is looking magnificent, she is moving carelessly and seems like a portrait, she is repeating the Lord’s Name.479."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਪਣ ਵਾਲੀਆਂ (ਜੰਗ ਦੇ) ਜਾਪ ਨੂੰ ਜਪ ਰਹੀਆਂ ਹਨ ॥੪੭੯॥"