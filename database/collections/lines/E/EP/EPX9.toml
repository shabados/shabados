[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰਿ ਮੋ ਕਉ; ਦੀਆ ਉਪਦੇਸੁ ॥"
page = 371
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Guru has imparted instruction unto me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਸਿਖਮੱਤ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Guru has imparted the Teachings to me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਗੁਰੋਂ ਨੇ ਮੁਝ ਕੋ ਐਸਾ ਉਪਦੇਸੁ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਨੇ ਮੈਨੂੰ ਸਿੱਖਿਆ ਦਿੱਤੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰਿ = ਗੁਰੂ ਨੇ। ਮੋ ਕਉ = ਮੈਨੂੰ। ਕਉ = ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Verdadero Guru de Sí Mismo me dio el conocimiento"