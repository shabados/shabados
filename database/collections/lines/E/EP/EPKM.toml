[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛਾਡਿ ਸਿਆਨਪ; ਬਹੁ ਚਤੁਰਾਈ ॥"
page = 190
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Shed thy wit and excessive cleverness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਅਕਲਮੰਦੀ ਅਤੇ ਘਣੀ ਚਾਲਾਕੀ ਤਿਆਗ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Renounce your cleverness, and your cunning tricks."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਿਆਣਪ ਔਰ ਬਾਣੀ ਕੀ ਚਤੁਰਾਈ ਛੋੜ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਖ਼ਿਆਲ ਛੱਡ ਦੇ ਕਿ ਤੂੰ ਬੜਾ ਸਿਆਣਾ ਤੇ ਚਤੁਰ ਹੈਂ (ਤੇ ਜੀਵਨ-ਮਾਰਗ ਨੂੰ ਆਪ ਹੀ ਸਮਝ ਸਕਦਾ ਹੈਂ)"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Deja tu astucia intelectual,"