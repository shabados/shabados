[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਾਰਬ੍ਰਹਮ; ਏਕੈ ਹੀ ਜਾਨੇ ॥੨॥"
page = 887
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then mortal deems Guru and God as one and the same."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਪ੍ਰਾਣੀ ਗੁਰੂ ਤੇ ਵਾਹਿਗੁਰੂ ਨੂੰ ਐਨ ਇਕ ਹੀ ਜਾਣ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "one sees the Guru and the Supreme Lord God as one and the same. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਗੁਰੂ ਔ ਪਾਰਬ੍ਰਹਮ ਏਕ ਰੂਪ ਹੀ ਕਰ ਕੇ ਜਾਨਿਆ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਗੁਰੂ ਅਤੇ ਪਰਮਾਤਮਾ ਇੱਕ-ਰੂਪ ਦਿੱਸ ਰਹੇ ਹਨ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entonces uno realiza que Dios y el Guru son uno.  (2)"