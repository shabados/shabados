[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਉ ਦੁਖੁ ਚੂਕੈ; ਬਿਨੁ ਗੁਰ ਮੇਰੇ ॥"
page = 1189
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How can the disease be eradicated without my Guru?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਗੁਰਾਂ ਦੇ ਬਗੈਰ ਬੀਮਾਰੀ ਕਿਸ ਤਰ੍ਹਾਂ ਕੱਟੀ ਜਾ ਸਕਦੀ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How can this disease be cured, without my Guru?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਗੁਰੂ ਸੋ ਬਿਨਾਂ ਇਹੁ ਦੁਖੁ ਕਿਸ ਤਰਾਂ (ਚੂਕੈ) ਦੂਰ ਹੋਵੇ, ਭਾਵ ਦੂਰ ਨਹੀਂ ਹੋਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਪਿਆਰੇ ਗੁਰੂ (ਦੀ ਸਹੈਤਾ) ਤੋਂ ਬਿਨਾ ਇਹ ਦੁੱਖ ਦੂਰ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਉ ਚੂਕੇ = ਨਹੀਂ ਮੁੱਕ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero sin el Guru mi dolor no se va,"