[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ; ਮੈ. ਹਰਿ ਹਰਿ ਨਾਮੁ ਮਨਿ ਭਾਇਆ ॥"
page = 882
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Master, the Lord-God's Name is pleasing to my mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਾਲਕ, ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ ਮੇਰੇ ਚਿੱਤ ਨੂੰ ਚੰਗਾ ਲਗਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Name of my Lord, Har, Har, is pleasing to my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੇਰੇ ਮਨ ਮੇਂ ਹਰਿ ਹਰਿ ਨਾਮ ਹੀ ਭਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਰਾਮ! ਹੇ ਹਰੀ! ਮੇਰੇ ਮਨ ਵਿਚ ਤੇਰਾ ਨਾਮ ਪਿਆਰਾ ਲੱਗਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਮ = ਹੇ ਰਾਮ! ਮੈ ਮਨਿ ਭਾਇਆ = ਮੇਰੇ ਮਨ ਵਿਚ ਚੰਗਾ ਲੱਗਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Nombre de mi Señor, Jar, Jar, complace mi mente,"