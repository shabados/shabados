[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੜਿ ਪੜਿ ਪੋਥੀ; ਸਿੰਮ੍ਰਿਤਿ ਪਾਠਾ ॥"
page = 226
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mortal reads and studies books, recites Simritis,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਪੁਸਤਕਾਂ ਨੂੰ ਪੜ੍ਹਦਾ ਤੇ ਵਾਚਦਾ ਹੈ, ਸਿਮ੍ਰਤੀਆਂ ਦਾ ਪਾਠ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You may read, recite and study the scriptures,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਿੰਮ੍ਰਤੀਓਂ ਕੋ ਪੜ ਕਰ ਪੁਨਾ ਅੰਨ੍ਯ ਪੁਸਤਕੋਂ ਪੜ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਵਿਦਵਾਨ ਪੰਡਿਤ) ਧਰਮ ਪੁਸਤਕਾਂ ਦੇ ਪਾਠ;"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno lee los textos semíticos,"