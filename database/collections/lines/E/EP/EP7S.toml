[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੈਨਹਾਰੁ; ਸਦ ਜੀਵਨਹਾਰਾ ॥"
page = 257
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Giver is for ever alive."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੇਣ ਵਾਲਾ ਸਦੀਵੀ ਸੁਰਜੀਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Great Giver is alive forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੇਨੇ ਹਾਰਾ ਵਾਹਿਗੁਰੂ ਸਦੀਵ ਜੀਵਨੇ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦਾਤਾਰ ਜੋ ਸਦਾ ਤੇਰੇ ਸਿਰ ਤੇ ਮੌਜੂਦ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੈਨਹਾਰੁ = ਦਾਤਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, el Dador está por siempre Vivo y Despierto,"