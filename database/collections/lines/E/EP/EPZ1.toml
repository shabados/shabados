data = "ਗਾਵਤ ਗੀਤ ਬਜਾਵਤ ਤਾਰੀ ॥੪॥"
page = 847

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Every house was showered with bliss and they revelled in singing with clapping hands.(4)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਲੋਕੀਂ) ਤਾੜੀਆਂ ਵਜਾ ਕੇ ਗੀਤ ਗਾਉਣ ਲਗੇ ॥੪॥"