[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਤਰਿਆ ਦੁਖੁ ਮੰਦ ॥੧॥"
page = 1304
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "my pain and wickedness are effaced."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਪੀੜ ਅਤੇ ਬੁਰਾਈ ਮਿਟ ਗਈਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "pain and wickedness have been dispelled. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਮੰਦ) ਬੁਰਾ ਸੁਭਾਉ ਅਰ ਜਨਮਾਦਿ ਦੁਖ ਰਿਦੇ ਤੋਂ ਉਤਰ ਗਿਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੇਰੇ ਅੰਦਰੋਂ) ਭੈੜਾ (ਸਾਰਾ) ਦੁੱਖ ਦੂਰ ਹੋ ਗਿਆ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਦ = ਭੈੜਾ, ਚੰਦਰਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el dolor y la maldad han desaparecido. (1)"