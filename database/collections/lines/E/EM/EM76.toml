data = "ਆਸਾ ਬਿਰਹਤਿ ਹਰਿ ਕੋ ਅਧੀਨ ॥"
page = 640

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Obedient to the Lord and abiding beyond the desires, Dutt prostrated before the Lord in various ways"

[[content]]
