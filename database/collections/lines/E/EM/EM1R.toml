[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਵਨ ਅਰਥ; ਮਿਰਤਕ ਸੀਗਾਰ ॥੨॥"
page = 188
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of what use are the decorations of the dead?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਰਦੇ ਦੇ ਹਾਰ ਸ਼ਿੰਗਾਰ ਕਿਹੜੇ ਫ਼ਾਇਦੇ ਦੇ ਹਨ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- what use are the ostentatious displays of the dead? ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੈਸੇ ਜੈਸੇ ਮ੍ਰਿਤੂ ਹੂਏ ਪੁਰਸ਼ ਕੋ ਸਿੰਗਾਰ ਕਰਨਾ ਬੇਅਰਥ ਹੈ॥੨॥☬ਜੇ ਕਹੇ ਮਾਨੁਖ ਸਰੀਰ ਕਾ ਹੋਨਾ ਤਾਂ ਵੀ ਔਰ ਜੂਨੋਂ ਸੇ ਸ੍ਰੇਸ੍ਟ ਹੈ, ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਕਿਸੇ ਮੁਰਦੇ ਨੂੰ ਹਾਰ ਸ਼ਿੰਗਾਰ ਲਾਉਣੇ, ਤੇ) ਮੁਰਦੇ ਨੂੰ ਸ਼ਿੰਗਾਰਨ ਦਾ ਕੋਈ ਭੀ ਲਾਭ ਨਹੀਂ ਹੁੰਦਾ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਰਤਕ = ਮੁਰਦਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿de qué sirve el embellecimiento de los muertos? (2)"