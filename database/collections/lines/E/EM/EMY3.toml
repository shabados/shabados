type = "primary"
data = "ਦਮਾਂ ਅਜ਼ਦਹਾਇ ਬ ਮੈਦਾਨਿ ਰਜ਼ਮ ॥੧੨੩॥"

[[content]]
assets = ["KEGP"]
type = "translation"
