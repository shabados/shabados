[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਨਾਉ ਪਾਇਆ; ਸੋ ਧਨਵੰਤਾ ਜੀਉ ॥"
page = 217
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who has obtained the Name, is wealthy."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਨਾਮ ਪ੍ਰਾਪਤ ਕੀਤਾ ਹੈ ਉਹ ਅਮੀਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who has obtained the Name is wealthy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਤੇਰਾ ਨਾਮ ਪਾਇਆ ਹੈ, ਸੋ ਧਨਵਾਨ ਹੈ"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਧਨ ਲੱਭ ਲਿਆ ਉਹ ਧਨਾਢ ਬਣ ਗਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que obtiene el Nombre del Señor es el maestro de las riquezas;"