[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਬਲਿਹਾਰੀ ਤਿੰਨ ਕੰਉ; ਜੋ ਗੁਰਮੁਖਿ ਸਿਖਾ ॥"
page = 650
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am a sacrifice unto those, who are the God-conscious sikhs of the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਨ੍ਹਾਂ ਉਤੋਂ ਕੁਰਬਾਨ ਵੰਞਦਾ ਹਾਂ ਜਿਹੜੇ ਰੱਬ ਨੂੰ ਜਾਨਣ ਵਾਲੇ ਗੁਰਸਿੱਖ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to those Sikhs who are Gurmukhs."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰੋਂ ਕੇ ਮੁਖ ਸਿਖ ਹੈਂ, ਮੈਂ ਤਿਨੋਂ ਕੇ ਬਲਿਹਾਰ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਿੱਖ ਸਤਿਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹਨ, ਮੈਂ ਉਹਨਾਂ ਤੋਂ ਸਦਕੇ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi vida en sacrificio a los Devotos sabios en Dios;"