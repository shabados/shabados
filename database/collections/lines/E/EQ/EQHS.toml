[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦੁਆਪੁਰਿ ਦੁਇ ਪਗ ਧਰਮ ਦੇ; ਪੂਜਾ ਚਾਰ ਪਖੰਡੁ ਅਲੀਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In Dvapar remained only two feet of dharma and now people began to remain absorbed only ritualistic worship."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਦੁਆਪਰ ਵਿਖੇ ਧਰਮ ਦੇ ਦੋ ਪੈਰ ਘਟ ਗਏ; (ਲੋਕ) ਪੂਜਾ ਚਾਰਾਂ ਦੇ ਪਖੰਡਾਂ ਵਿਖੇ ਮਸਤ ਹੋ ਗਏ।"