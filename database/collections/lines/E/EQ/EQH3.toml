[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਸਰਣਾਈ ਭਜਿ ਪਏ; ਬਖਸੇ ਬਖਸਣਹਾਰ ॥੩॥"
page = 430
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who hasten to Guru's refuge, them pardons the Pardoner."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰਾਂ ਦੀ ਛਤ੍ਰ-ਛਾਇਆ ਹੇਠ, ਦੌੜ ਕੇ ਚਲੇ ਜਾਂਦੇ ਹਨ, ਉਨ੍ਹਾਂ ਨੂੰ ਮਾਫੀ ਦੇਣ ਵਾਲਾ ਮਾਫੀ ਦੇ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He hurries to the Guru's Sanctuary, and is forgiven by the Forgiving Lord. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਗੁਰੋਂ ਕੀ ਸਰਣ ਮੇਂ ਦੌੜ ਕਰ ਗਿਰੈ ਤਬ ਬਖਸਨ ਹਾਰ ਗੁਰ ਬਖਸ ਲੇਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਗੁਰੂ ਦੀ ਸਰਨ ਹੀ ਪਏ ਰਹਿੰਦੇ ਹਨ, ਬਖ਼ਸ਼ਸ਼ਾਂ ਕਰਨ ਵਾਲਾ ਬਖ਼ਸ਼ਿੰਦ ਹਰੀ ਉਹਨਾਂ ਉਤੇ ਬਖ਼ਸ਼ਸ਼ ਕਰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Se va al Refugio del Guru y el Señor lo toma en Su Abrazo. (3)"