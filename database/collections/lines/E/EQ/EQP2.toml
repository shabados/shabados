[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਣ ਰਾਸਿ; ਬੰਨੑਿ ਪਲੈ ਆਨੀ ॥"
page = 372
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Having tied the capital of virtues in my skirt, I have brought it with me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨੇਕੀਆਂ ਦੀ ਪੂੰਜੀ ਆਪਣੇ ਲੜ ਬਣ ਕੇ ਮੈਂ ਆਪਣੇ ਨਾਲ ਲਿਆਇਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have gathered in my pockets my capital of virtue, and I have brought it here with me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਚਤੁਸ੍ਟ੍ਯ ਸਾਧਨ ਰੂਪ ਗੁਣੋਂ ਕੀ ਰਾਸ ਪਲੇ ਮੇਂ ਬਾਂਧ ਕਰ ਲ੍ਯਾਯਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਰੂ! ਮੈਂ ਗੁਣਾਂ ਦਾ ਸਰਮਾਇਆ ਪੱਲੇ ਬੰਨ੍ਹ ਕੇ ਲਿਆਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੰਨ੍ਹ੍ਹਿ = ਬੰਨ੍ਹ ਕੇ। ਪਲੈ = ਪੱਲੈ, ਪੱਲੇ ਵਿਚ। ਆਨੀ = ਲਿਆਂਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y escuchando aquí que podría comprar algo de Belleza Incomparable,"