[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗੁ ਬਿਹਾਗੜਾ ਛੰਤ ਮਹਲਾ ੪ ਘਰੁ ੧ ॥"
page = 537
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rag Bihagra Chhant. 4th Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਬਿਹਾਗੜਾ ਛੰਤ ਚੋਥੀ ਪਾਤਿਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Bihaagraa, Chhant, Fourth Mehl, First House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਬੇਹਾਗੜਾ, ਘਰ ੧ ਵਿੱਚ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਦੀ ਬਾਣੀ 'ਛੰਤ'।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Bijagra, Mejl Guru Ram Das, Cuarto Canal Divino, Chant."