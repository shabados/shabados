[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਯੌ ਡਹਕੀ ਬਹਕੀ ਛਬਿ ਯਾਰ; ਪੀਯਾ ਹੂੰ ਕੋ ਪਾਇ ਪਤੀਜਤ ਨਾਹੀ ॥੨੩॥"
page = 952

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She became so mad in fondness for him that she would not feel satiated.(23)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ (ਸਸਿਯਾ) ਕਮਲੀ ਹੋਈ ਯਾਰ ਦੀ ਛਬੀ ਨੂੰ ਪ੍ਰਾਪਤ ਕਰ ਕੇ ਤ੍ਰਿਪਤ ਨਹੀਂ ਹੁੰਦੀ ॥੨੩॥"