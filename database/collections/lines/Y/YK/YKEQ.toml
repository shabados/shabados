[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ ਕੈ; ਧੀਰਜੁ ਏਕ ॥"
page = 272
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The knower of God has even patience,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਨਾਂ ਜਾਨਣ ਵਾਲੇ ਦੀ ਸਹਿਨੀਲਤਾ ਇਕਸਾਰ ਹੁੰਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The God-conscious being has a steady patience,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ ਕੇ ਰਿਦੇ ਮੇਂ ਏਕ ਧੀਰਜ ਹੀ ਮੁਖ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕੋਈ ਭਲਾ ਕਹੇ ਭਾਵੇਂ ਬੁਰਾ, ਪਰ) ਬ੍ਰਹਮਗਿਆਨੀ ਮਨੁੱਖਾਂ ਦੇ ਅੰਦਰ ਇਕ-ਤਾਰ ਹੌਸਲਾ (ਕਾਇਮ ਰਹਿੰਦਾ) ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਕ = ਇਕ-ਤਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El hombre de Dios se mantiene estable en la paciencia,"