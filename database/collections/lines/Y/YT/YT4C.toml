[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਨਿਹਫਲੁ, ਅਹਿਲਾ ਜਨਮੁ ਗਵਾਏ ॥੧॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They lose their life uselessly."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁੰਦਰ (ਮਨੁੱਖਾ) ਜਨਮ ਐਵੇਂ ਗੁਆ ਬੈਠਦਾ ਹੈ।"