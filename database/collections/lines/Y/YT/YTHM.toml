[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਾ ਬੁਝਾਰਤਿ; ਬੂਝੈ ਡੋਰਾ ॥"
page = 267
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How can a deaf man understand the riddle?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੋਲਾ ਆਦਮੀ ਬਾਤ ਕਿਸ ਤਰ੍ਹਾਂ ਬੁੱਝ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How can a riddle be understood by the deaf?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ (ਡੋਰਾ) ਬੋਲਾ ਪੁਰਸ਼ ਕੈਸੇ ਬੁਝਾਰਤ ਕੋ ਸਮਝੇਗਾ ਅਰਥਾਤ ਨਹੀਂ ਸਮਝਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬੋਲਾ ਮਨੁੱਖ (ਨਿਰੀ) ਸੈਨਤ ਨੂੰ ਕੀਹ ਸਮਝੇ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੁਝਾਰਤਿ = ਸੈਨਤ। ਡੋਰਾ = ਬੋਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Un sordo no escucha la palabra gentil;"