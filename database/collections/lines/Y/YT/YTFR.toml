[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਲਾਹੀ ਸਾਲਾਹਿ; ਏਤੀ ਸੁਰਤਿ ਨ ਪਾਈਆ ॥"
page = 5
line = 5

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "੧. ਸਾਲਾਹੀ - ਬਿਹਾਰੀ ਤੇ ਬਿੰਦਾ ਨਹੀਂ ਉਚਾਰਨਾ ਕਿਉਂਕਿ ਇਹ ਕਿਰਿਆ ਨਹੀਂ ਬਲਕਿ ਨਾਂਵ ਹੈ ਤੇ ਇਸ ਦਾ ਮਤਲਬ ਹੈ ਸਾਲਾਹਣਯੋਗ ਵਾਹਿਗੁਰੂ। ੨. ਸਾਲਾਹਿ - ਸਿਹਾਰੀ ਤੇ ਬਿੰਦਾ ਉਚਾਰਨਾ ਹੈ ਕਿਉਂਕਿ ਇਸ ਕਿਰਿਆ ਦਾ ਕਰਤਾ ਬਹੁਵਚਨ ਹੈ।"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The praisers praise the Lord, but they obtain not this understanding"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ਲਾਘਾ ਕਰਨ ਵਾਲੇ ਸਾਹਿਬ ਦੀ ਸ਼ਲਾਘਾ ਕਰਦੇ ਹਨ, ਪਰ ਉਨ੍ਹਾਂ ਨੂੰ ਏਨੀ ਸਮਝ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦੀ"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The praisers praise the Lord, but they do not obtain intuitive understanding"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਿਧੋ! (ਸਾਲਾਹੀ) ਉਸਤੁਤਿ ਕਰਨੇ ਕੇ, ਜੋਗ ਅਕਾਲ ਪੁਰਖ ਕੀ ਉਸਤੁਤੀ ਤੋ ਸਭ ਨੇ ਕਰੀ ਹੈ। ਵਾ ਸਾਲਾਹਨੇ ਵਾਲੇ ਜੋ ਸੰਤ ਹੈਂ, ਤਿਨੋ ਨੇ ਉਸਤਤੀ ਤੋ ਕਰੀ ਹੈ ਪਰੰਤੂ ਉਸ ਕੀ (ਏਤੀ) ਇਤਨੀ ਮਹਿਮਾ ਹੈ, ਏਹ (ਸੁਰਤਿ) ਗ੍ਯਾਤ ਉਨ ਕੋ ਭੀ ਪ੍ਰਾਪਤਿ ਨਹੀਂ ਭਈ, ਅਰਥਾਤ ਇਦੰਤਾ ਕਾ ਵਿਖੇ ਨਹੀ ਹੂਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਲਾਹੁਣ-ਜੋਗ ਅਕਾਲ ਪੁਰਖ ਦੀਆਂ ਵਡਿਆਈਆਂ ਆਖ ਆਖ ਕੇ ਕਿਸੇ ਮਨੁੱਖ ਨੇ ਇਤਨੀ ਸਮਝ ਨਹੀਂ ਪਾਈ ਕਿ ਅਕਾਲ ਪੁਰਖ ਕੇਡਾ ਵੱਡਾ ਹੈ। (ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਨ ਵਾਲੇ ਮਨੁੱਖ ਉਸ ਅਕਾਲ ਪੁਰਖ ਦੇ ਵਿਚੇ ਹੀ ਲੀਨ ਹੋ ਜਾਂਦੇ ਹਨ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਲਾਹੀ = ਸਲਾਹੁਣ-ਯੋਗ ਪਰਮਾਤਮਾ। ਸਾਲਾਹਿ = ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰ ਕੇ। ਏਤੀ ਸੁਰਤ = ਇਤਨੀ ਸਮਝ (ਕਿ ਅਕਾਲ ਪੁਰਖ ਕੇਡਾ ਵੱਡਾ ਹੈ)। ਨ ਪਾਈਆ = ਕਿਸੇ ਨੇ ਨਹੀਂ ਪਾਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquéllos que cantan Su Alabanza, no saben lo Grande que es Él."