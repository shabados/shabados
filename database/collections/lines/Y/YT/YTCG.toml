[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪੀਰ ਪੈਕੰਬਰ ਔਲੀਏ; ਗੌਸ ਕੁਤਬ ਉਲਮਾਉ ਘਨੇਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many are the pirs, prophets, auliyas, gauris, qutubs and ulemas (all spiritual designations among Muslims)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੀਰ ਪੈਕੰਬਰ ਔਲੀਆ, ਗ਼ੌਸ, ਕੁਤਬ, ਆਲਮ ਲੋਕ (ਵਿਦਵਾਨ) ਘਣੇ (ਹੋ ਗੁਜ਼ਰੇ) ਹਨ।"