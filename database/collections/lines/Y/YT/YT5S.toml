data = "ਦਿਵਸ ਚਰਾਇ ਰਾਤਿ ਘਰ ਆਵੈ ॥੧੨॥"
page = 892

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Give him a few goats. He will take them out for grazing and will come back in the evening.’(12)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਨੂੰ ਚਰਾ ਕੇ ਰਾਤ ਨੂੰ ਘਰ ਆ ਜਾਵੇ ॥੧੨॥"