[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸਹਿ; ਕ੍ਰਿਪਾਲੁ ਹੋਇ ਹਾਂ ॥"
page = 411
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He to whom the Lord is merciful,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਉਤੇ ਪ੍ਰਭੂ ਮਿਹਰਬਾਨ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who is blessed with the Lord's Mercy,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰ ਸਤਗੁਰ ਕ੍ਰਿਪਾਲ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਉਤੇ ਪ੍ਰਭੂ ਦਇਆਵਾਨ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸਹਿ = ਜਿਸ ਉੱਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien es bendecido con la Misericordia del Señor,"