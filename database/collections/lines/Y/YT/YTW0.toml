[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਹ ਲਹਤ ਤੇਗ ਤ੍ਰਮੰਕਯੰ ॥"
page = 110

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The tobors are resounding and the swords are glistening."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਲਹ ਲਹ ਕਰਕੇ ਤੇਗਾਂ ਚਮਕਦੀਆਂ ('ਤ੍ਰਮੰਕਯੰ') ਸਨ।"