[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਨਾਮ ਸਿਉ; ਕਰਿ ਬਿਉਹਾਰੋ ॥"
page = 255
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by having dealings with the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਨਾਮ ਦਾ ਵਣਜ-ਵਪਾਰ ਕਰਨ ਦੁਆਰਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "when you deal with the Lord's Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਵਾਸਤੇ ਰਾਮ ਕੇ ਨਾਮ ਸਾਥ ਆਪਣਾ ਬ੍ਯੋਹਾਰ ਕਰੁ, ਅਰਥਾਤ ਨਾਮ ਕੋ ਜਪਤਾ ਰਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਨਾਲ ਵਣਜ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El que alaba a Maya muere en el sufrimiento,"