[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੂਰਖ ਕੇ ਕਿਆ ਲਖਣ ਹੈ; ਕਿਆ ਮੂਰਖ ਕਾ ਕਰਣਾ ॥"
page = 953
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What are the signs for a fool? What deeds fool does?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਵਕੂਫ ਦੇ ਕੀ ਚਿੰਨ੍ਹ ਹਨ? ਬੇਵਕੂਫ ਦੇ ਕੀ ਕਰਮ ਹਨ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What are the signs of the fool? What does the fool do?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੂਰਖ ਕੇ ਚਿਹਨ ਕਿਆ ਹੈਂ ਪੁਨਾ ਮੂਰਖ ਕਾ ਕਰਣਾ ਕਿਆ ਹੈ?☬ਉੱਤਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੂਰਖ ਦੇ ਲੱਛਣ ਕੀਹ ਹਨ? ਮੂਰਖ ਦੀ ਕਰਤੂਤ ਕੈਸੀ ਹੁੰਦੀ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਖਣ = ਲੱਛਣ, ਇਲਾਮਤਾਂ। ਕਰਣਾ = ਕਰਤੱਬ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Di, ¿cuáles son las características de un tonto? ¿Qué es lo que hace?"