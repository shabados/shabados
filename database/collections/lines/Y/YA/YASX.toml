[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਨ ਕੀ ਸੇਵਾ; ਸੋਈ ਲਾਗੈ ॥"
page = 282
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Only that man applies himself to His service,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਓਹੀ ਬੰਦਾ ਉਸ ਦੀ ਟਹਿਲ ਅੰਦਰ ਜੁੜਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is committed to serve them,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਹਰਿ ਜਨੋਂ ਕੀ ਸੇਵਾ ਮੇਂ ਸੋਈ ਲਾਗਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਮਨੁੱਖ ਉਹਨਾਂ (ਸੇਵਕਾਂ) ਦੀ ਸੇਵਾ ਵਿਚ ਰੁੱਝਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "para encontrar la Paz que da la Meditación en el Nombre."