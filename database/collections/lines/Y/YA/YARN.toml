[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਧੂ ਏਕ ਬਨ ਮੈ ਬਸੈ; ਤਿਹ ਤੁਮ ਬਰੋ ਪ੍ਰਬੀਨ ॥੮੬॥"
page = 83

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“One beautiful woman lives in the forest, O adept one, marry her.”86.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਇਸਤਰੀ ਬਨ ਵਿਚ ਵਸਦੀ ਹੈ, ਹੇ ਪ੍ਰਬੀਨ (ਰਾਜੇ)! ਤੁਸੀਂ ਉਸ ਨੂੰ ਵਰ ਲਵੋ ॥੮੬॥"