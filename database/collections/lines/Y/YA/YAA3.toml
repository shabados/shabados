type = "primary"
data = "ਜੋਗਿਨ ਮਹਾ ਜੋਗ ਕਰ ਬੂਝਾ ॥"
page = 625

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He appeared to the kshatris as Soverign and to the Yogis as Supreme Yogi"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜੋਗੀਆਂ ਨੇ ਮਹਾਨ ਜੋਗੀ ਵਜੋਂ ਬੁਝਿਆ।"