[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਜੀਗਰਿ ਇਕ ਬਾਜੀ ਪਾਈ ॥"
page = 1061
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The juggler has staged a play."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਦਾਰੀ ਨੇ ਇੱਕ ਖੇਡ ਰਚੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Juggler has staged His juggling show."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਰਮੇਸ਼ਰ ਬਾਜੀਗਰ! ਤੈਨੇ ਸੰਸਾਰ ਰੂਪੀ ਇਕ ਬਾਜੀ ਪਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ-) ਬਾਜੀਗਰ ਨੇ (ਇਹ ਜਗਤ) ਇਕ ਤਮਾਸ਼ਾ ਰਚਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਜੀਗਰਿ = ਬਾਜੀਗਰ ਨੇ। ਬਾਜੀ ਪਾਈ = ਤਮਾਸ਼ਾ ਰਚਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es por el Perfecto Guru que uno ve que el mundo no es más que el escenario del juglar."