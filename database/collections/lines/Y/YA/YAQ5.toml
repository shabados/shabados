[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭਨਾ ਕਰਤੇ; ਤੇਰੀ ਟੇਕਾ ॥"
page = 841
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Creator, everyone has Thine prop."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸਿਰਜਣਹਾਰ ਸਾਰਿਆ ਨੂੰ ਤੇਰਾ ਹੀ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Creator Lord, You are the Support of all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਰਤਾ ਪੁਰਖ! ਸਭ ਕੋਈ ਤੇਰੀ ਹੀ ਟੇਕ ਹੈ ਅਰਥਾਤ ਆਸਰਾ ਹੈ, ਤਾਂ ਤੇ ਐਸੇ ਬੇਨਤੀ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਰਤਾਰ! ਸਭ ਜੀਵਾਂ ਨੂੰ ਤੇਰਾ ਹੀ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਤੇ = ਹੇ ਕਰਤਾਰ! ਟੇਕਾ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios Creador, todos se apoyan en Ti al fin y al cabo."