data = "ਅਬ ਸੋ ਸਾਚ ਤਵਨ ਕੋ ਲਹਿਯੋ ॥੧੨॥"
page = 891

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Roop Kala was after all not telling lies. I have recognised her truthfulness now.’(12)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਮੈਂ ਉਸ ਦੇ ਸਚ ਨੂੰ ਸਮਝ ਲਿਆ ਹੈ ॥੧੨॥"