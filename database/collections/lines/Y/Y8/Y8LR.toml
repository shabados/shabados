[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਕਿਉ ਵਿਸਰੈ; ਸਭ ਮਾਹਿ ਸਮਾਨਾ ॥"
page = 159
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why forget Him, who is contained amongst all?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕਿਉਂ ਭੁਲਾਈਏ, ਜੋ ਸਾਰਿਆਂ ਅੰਦਰ ਰਮਿਆ ਹੋਇਆ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Why forget Him, who is all-pervading?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੂੰ ਸਭ ਮੇਂ ਸਮਾ ਰਹਾ ਹੈਂ, ਸੋ ਤੂੰ ਕਿਉਂ ਵਿਸੁਰ ਜਾਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕਦੇ ਭੀ (ਮਨ ਤੋਂ) ਭੁਲਾਣਾ ਨਹੀਂ ਚਾਹੀਦਾ, ਜੇਹੜਾ ਪਰਮਾਤਮਾ ਸਭ ਜੀਵਾਂ ਵਿਚ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਹਿ = ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué olvidarlo a Él, Quien prevalece en todo?"