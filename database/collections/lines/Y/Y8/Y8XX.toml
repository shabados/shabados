[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਡੈ ਭਾਗਿ; ਪੂਜ ਗੁਰ ਚਰਨਾ ॥"
page = 395
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the greatest good luck I have adored the Guru's Feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਰੇ ਚੰਗੇ ਨਸੀਬਾਂ ਰਾਹੀਂ ਮੈਂ ਗੁਰਾਂ ਦੇ ਪੈਰਾਂ ਦੀ ਉਪਾਸ਼ਨਾ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By great good fortune, I worship the Guru's feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਡੇ ਭਾਗੋਂ ਕਰ ਕੇ ਗੁਰੋਂ ਕੇ ਚਰਨੋਂ ਕੀ ਪੂਜਾ ਪ੍ਰਾਪਤਿ ਹੋਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਵੱਡੀ ਕਿਸਮਤਿ ਨਾਲ ਮੈਨੂੰ ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਦੀ ਪੂਜਾ (ਦਾ ਅਵਸਰ ਮਿਲਿਆ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਡੈ ਭਾਗਿ = ਵੱਡੀ ਕਿਸਮਤ ਨਾਲ। ਪੂਜ = ਪੂਜਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bendito es quien alaba los Pies del Guru,"