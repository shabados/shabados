[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਤ ਗਰਭ ਮਹਿ. ਆਪਨ ਸਿਮਰਨੁ ਦੇ; ਤਹ ਤੁਮ ਰਾਖਨਹਾਰੇ ॥"
page = 613
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Blessing with Thine meditation in the mother's womb, Thou O saviour, didst save the mortal there."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਂ ਦੇ ਪੇਟ ਵਿੱਚ ਆਪਣੀ ਬੰਦਗੀ ਦੀ ਦਾਤ ਦੇ ਕੇ, ਹੇ ਬਚਾਉਣਹਾਰ, ਤੂੰ ਮੇਰੀ ਓਥੇ ਵੀ ਰੱਖਿਆ ਕੀਤੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In our mother's womb, You blessed us with Your meditative remembrance, and You preserved us there."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ (ਰਾਖਨਹਾਰੇ) ਵਾਹਗੁਰੂ! ਜੈਸੇ ਮਾਤਾ ਕੇ ਗਰਭ ਮੇਂ ਤੂੰ ਅਪਨਾ ਹੀ ਸਿਮਰਨ ਦੇ ਕੇ ਰੱਖ੍ਯਾ ਕਰਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘਾਣ ਦੀ ਸਮਰਥਾ ਰੱਖਣ ਵਾਲੇ! ਮਾਂ ਦੇ ਪੇਟ ਵਿਚ ਸਾਨੂੰ ਤੂੰ ਆਪਣਾ ਸਿਮਰਨ ਦੇ ਕੇ ਉੱਥੇ ਸਾਡੀ ਰੱਖਿਆ ਕਰਨ ਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਰਭ ਮੋਹਿ = ਪੇਟ ਵਿਚ। ਆਪਨ = ਆਪਣਾ। ਦੇ = ਦੇ ਕੇ। ਤਹ = ਉਥੇ, ਮਾਂ ਦੇ ਪੇਟ ਵਿਚ। ਰਾਖਨਹਾਰੇ = ਬਚਾਣ ਦੀ ਸਮਰਥਾ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Contemplándote fui conservado en el vientre materno;"