[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਘਟਿ ਘਟਿ ਪੂਰਨੁ ਬ੍ਰਹਮੁ ਹੈ; ਗੁਰਮੁਖਿ ਵੇਖਾਲੈ ॥੬॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The perfect Lord resides in all the selves and is visualised by a rare gurmukh."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਇਸੀ ਤਰ੍ਹਾਂ ਘਟ ਘਟ ਵਿਚ ਪੂਰਨ ਬ੍ਰਹਮ ਹੈ, ਪਰ ਗੁਰਮੁਖ ਦਿਖਾਲਦਾ ਹੈ।"