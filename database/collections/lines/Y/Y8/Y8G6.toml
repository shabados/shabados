[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਿਰਲਾ ਕੋ ਪਾਏ; ਗੁਰ ਸਬਦਿ ਵੀਚਾਰਾ ॥"
page = 160
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's instruction, only a few attain to Master's meditation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਦੁਆਰਾ ਬਹੁਤ ਹੀ ਥੋੜ੍ਹੇ ਮਾਲਕ ਦੀ ਬੰਦਗੀ ਨੂੰ ਪ੍ਰਾਪਤ ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How rare are those who contemplate the Word of the Guru's Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਗੁਰੋਂ ਕਾ ਉਪਦੇਸ ਵਿਚਾਰ ਕਰ ਕੋਈ ਵਿਰਲਾ ਹੀ ਇਸ ਤਤ ਕੋ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਵਿਰਲਾ ਮਨੁੱਖ ਹੀ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਵਿਚ ਜੁੜ ਕੇ ਇਹ ਵਿਚਾਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero extraordinario es aquél que habita en la Palabra del Shabd del Guru,"