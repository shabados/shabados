[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਸੇਈ ਤੰਨ ਫੁਟੰਨਿ; ਜਿਨਾ ਸਾਂਈ ਵਿਸਰੈ ॥੧॥"
page = 323
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, burst out hose bodies who forget the Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਉਹ ਸਰੀਰ ਪਾਟ ਜਾਂਦੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਇਕ ਸਾਹਿਬ ਭੁੱਲ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the bodies of those who forget their Master shall burst apart. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਨ ਕੇ ਸਰੀਰ ਫੂਟ ਜਾਤੇ ਹੈਂ ਅਰਥਾਤ ਕੁਸਟੀ ਵਤ ਦੁਖੀ ਰਹਤੇ ਹੈਂ ਤਿਨ ਕੋ ਸਾਂਈ ਕਾ ਨਾਮ ਵਿਸਰ ਜਾਤਾ ਹੈ॥੧॥☬ਵਾਹਿਗੁਰੂ ਕਾ ਉਪਕਾਰ ਸੂਚਨ ਕਰਾਵਤੇ ਹੂਏ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਹੇ ਨਾਨਕ! ਉਹ ਸਰੀਰ ਵਿਕਾਰਾਂ ਨਾਲ ਗੰਦੇ ਹੋ ਜਾਂਦੇ ਹਨ ਜਿਨ੍ਹਾਂ ਨੂੰ ਮਾਲਕ ਪ੍ਰਭੂ ਭੁੱਲ ਜਾਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੰਨ = ਸਰੀਰ। ਫੁਟੰਨਿ = ਫੁੱਟ ਜਾਂਦੇ ਹਨ, ਵਿਕਾਰਾਂ ਨਾਲ ਗੰਦੇ ਹੋ ਜਾਂਦੇ ਹਨ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, aquéllos que se olvidan de su Dios son los seres más desafortunados.  (1)"