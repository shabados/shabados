type = "primary"
data = "ਝਰਨਨ ਤੇ ਝਾਈ ਪਰੀ; ਰਾਨੀ ਲਯੋ ਬੁਲਾਇ ॥੨॥"
page = 915

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Rani looked at him through the ventilator and called him in.(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਝਰੋਖੇ ਰਾਹੀਂ (ਰਾਣੀ ਨੂੰ ਉਸ ਦੀ) ਪਰਛਾਈ ਪਈ ਅਤੇ ਰਾਣੀ ਨੇ ਉਸ ਨੂੰ ਬੁਲਾ ਲਿਆ ॥੨॥"