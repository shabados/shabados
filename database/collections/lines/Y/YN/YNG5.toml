[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਲੀ ਬੀਸਿ ਬਾਣਾਨਿ ਬਿਗ੍ਰਯਾਨ ਬੇਧ੍ਰਯੋ ॥੩੦੭॥"
page = 705

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He pierced the limbs of Nem (principle) with his nine arrows and with twenty arrows, he attacked the mighty warrior Vigyan (Science).80.307."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵੀਹ ਤੀਰਾਂ ਨਾਲ ਬਲੀ 'ਬਿਗ੍ਯਾਨ' ਨੂੰ ਵਿੰਨ੍ਹ ਦਿੱਤਾ ਹੈ ॥੩੦੭॥"