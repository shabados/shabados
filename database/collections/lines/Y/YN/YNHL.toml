[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹਿ ਧਾਤ ਸਬੈ ਉਪਧਾਤ ਭਨੋ ॥"
page = 162

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After counting the greater and minor jewels, now I count the metals and afterwards I shall count the lesser metals."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਧਾਤਾਂ ਕਹਿ ਕੇ (ਫਿਰ) ਉਪਧਾਤਾਂ ਕਹਾਂਗਾ।"