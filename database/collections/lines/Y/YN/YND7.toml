[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਪੂਜੈ; ਸਗਲ ਪਾਰਬ੍ਰਹਮੁ ॥"
page = 274
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He realises the Supreme Lord to be amongst all and adores Him alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਰਮ ਪ੍ਰਭੂ ਨੂੰ ਸਾਰਿਆਂ ਅੰਦਰ ਅਨੁਭਵ ਕਰਦਾ ਹੈ ਅਤੇ ਕੇਵਲ ਉਸੇ ਦੀ ਹੀ ਉਪਾਸ਼ਨਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He performs devotional service to the Supreme Lord God in all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਸਰਬ ਕੌ ਪਾਰਬ੍ਰਹਮ ਰੂਪ ਕਰ ਕੇ ਪੂਜਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਅਕਾਲ ਪੁਰਖ ਨੂੰ ਹਰ ਥਾਂ ਮੌਜੂਦ ਜਾਣ ਕੇ ਪੂਜਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal hombre cultiva la Compañía de los Santos"