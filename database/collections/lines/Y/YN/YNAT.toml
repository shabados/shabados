[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕੈ, ਸਦ ਬਲਿਹਾਰੈ ਜਾਉ ॥"
page = 152
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am forever a sacrifice unto him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਮੇਸ਼ਾਂ ਹੀ ਮੈਂ ਉਸ ਉਤੋਂ ਕੁਰਬਾਨ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who understands and believes in the Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਸਦਾ ਬਲਿਹਾਰੇ ਜਾਵਾਂ॥☬(ਦਖਣੀ) ਜਾਤੀ ਵਸੇਸ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਸ ਤੋਂ ਸਦਾ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "conoce y cree en el Naam,"