[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਲਿ ਥਲਿ ਪੂਰਿ ਰਹਿਆ; ਗੋਸਾਈ ॥"
page = 1075
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord of universe is fully-filling the ocean and the earth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਲਮ ਦਾ ਸੁਆਮੀ ਸਮੁੰਦਰ ਅਤੇ ਧਰਤੀ ਨੂੰ ਪਰੀਪੂਰਨ ਕਰ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord of the Universe is permeating and pervading the water and the land."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਲੋਂ ਅਰ ਥਲੋਂ ਮੇਂ ਸੁਆਮੀ ਪੂਰਨ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸ੍ਰਿਸ਼ਟੀ ਦਾ ਮਾਲਕ ਜਲ ਵਿਚ ਧਰਤੀ ਵਿਚ (ਹਰ ਥਾਂ) ਵਿਆਪਕ ਹੈ, ਉੱਚੇ ਤੇ ਖ਼ਾਲੀ ਸਭ ਥਾਈਂ ਇਕੋ ਜਿਹਾ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਲਿ = ਜਲ ਵਿਚ। ਥਲਿ = ਧਰਤੀ ਵਿਚ। ਪੂਰਿ ਰਹਿਆ = ਵਿਆਪਕ ਹੈ। ਗੋਸਾਈ = ਸ੍ਰਿਸ਼ਟੀ ਦਾ ਮਾਲਕ-ਪ੍ਰਭੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, Él, el Maestro de la Tierra, está tanto en la tierra como en el mar,  y ante Él, el que está arriba y el que está abajo son iguales."