data = "ਕਿ ਪਰਵਾਨਹੇ ਚੂੰ ਦਰਾਮਦ ਬਜੋਸ਼ ॥੪੭॥"
page = 1401

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And flew like a moth approaching the naked light (to burn).(47)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਪਰਵਾਨਾ ਪੂਰੇ ਜੋਸ਼ ਨਾਲ (ਦੀਪਕ ਉਤੇ) ਆਉਂਦਾ ਹੈ ॥੪੭॥"