[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਨ ਕਲ ਜਿਨਿ ਧਾਰੀ ॥"
page = 627
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "in whose Being Omnipotence is manifest."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਸਰੂਪ ਵਿੱਚ ਪੂਰੀਆਂ ਸ਼ਕਤੀਆਂ ਪ੍ਰਗਚ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His Almighty Power is manifest."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤੈਨੇ ਅਪਨੀ ਪੂਰਨ ਚੇਤਨ ਸ਼ਕਤੀ ਸੰਸਾਰ ਮੇਂ ਧਾਰੀ ਹੂਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਸਾਰੇ ਜਗਤ ਵਿਚ ਆਪਣੀ ਸ਼ਕਤੀ ਟਿਕਾਈ ਹੋਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਲ = ਸੱਤਿਆ, ਸ਼ਕਤੀ। ਜਿਨਿ = ਜਿਸ (ਪ੍ਰਭੂ) ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en Su Ser la Esencia del Poder se vuelve manifiesta."