[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੁਹੀ ਬਿਪ੍ਰ ਛਤ੍ਰੀ ਤੁਹੀ; ਤੁਹੀ ਰੰਕ ਅਰੁ ਰਾਉ ॥"
page = 717

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art the Brahmin, Kshatriya, the king and the poor"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਬ੍ਰਾਹਮਣ ਹੈਂ, ਅਤੇ ਤੂੰ ਹੀ ਛਤ੍ਰੀ ਹੈਂ ਅਤੇ ਤੂੰ ਆਪ ਹੀ ਕੰਗਾਲ ਤੇ ਆਪ ਹੀ ਰਾਜਾ ਹੈਂ।"