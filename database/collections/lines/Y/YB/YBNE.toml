[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਰਮਿ ਭੁਲਾਨੇ; ਜਾਣਹਿ ਦੋਇ ॥"
page = 880
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Straying in doubt, men thought the Creator and creation separate."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਦੇਹ ਵਿੱਚ ਭਟਕ ਕੇ, ਬੰਦੇ ਰਚਣਹਾਰ ਤੇ ਰਚਨਾ ਨੂੰ ਅਡਰੇ ਜਾਣਨ ਲੱਗ ਪਏ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Deluded by doubt, they knew duality."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਭਰਮ ਮੇਂ ਭੂਲੇ ਕਿ ਦੋਇ ਜਾਨਤੇ ਭਏ, ਭਾਵ ਪਰਸਪਰ ਵੈਰੁ ਅਧਕ ਹੋ ਗ੍ਯਾ ਸੰਮਤੀ ਨਾ ਰਹੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਲੋਕਾਂ ਦੇ ਹਿਰਦੇ ਵਿਚ ਵਿਤਕਰਾ ਜ਼ੋਰ ਪਾ ਗਿਆ, ਭਟਕਣਾ ਵਿਚ ਪੈ ਕੇ ਲੋਕ ਕੁਰਾਹੇ ਪੈ ਗਏ, ਮੇਰ-ਤੇਰ ਨੂੰ ਹੀ (ਚੰਗੀ) ਜਾਣਨ ਲੱਗ ਪਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਰਮਿ = ਭਟਕਣਾ ਵਿਚ। ਭੁਲਾਨੇ = ਕੁਰਾਹੇ ਪੈ ਗਏ। ਜਾਣਹਿ = ਜਾਣਦੇ ਹਨ। ਦੋਇ = ਮੇਰ-ਤੇਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y en general todos vivían engañados por la dualidad y la duda."