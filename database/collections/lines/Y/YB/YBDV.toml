[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਚਤੁਰ ਪ੍ਰਮਾਨ ॥੫੦੫॥"
page = 740

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Kripanani” in the beginning and then adding “Ripu Ari”, the names of Tupak are formed.505."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਨਾਮ ਤੁਪਕ ਦਾ ਬਣਦਾ ਹੈ। ਚਤੁਰ ਲੋਗੋ! ਸੋਚ ਲਵੋ ॥੫੦੫॥"