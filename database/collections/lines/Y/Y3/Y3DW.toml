[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਗੁਣਾ ਕੇ ਦਾਤੇ ਸੁਆਮੀ; ਬਿਨਉ ਸੁਨਹੁ ਇਕ ਦੀਨਾ ॥"
page = 1117
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, the Giver of all virtues, hear Thou the supplication of a meek man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਰੀਆਂ ਨੇਕੀਆਂ ਬਖਸ਼ਣਹਾਰ ਪ੍ਰਭੂ! ਤੂੰ ਇਕ ਮਸਕੀਨ ਮਲੁੱਖ ਦੀ ਪ੍ਰਾਰਥਨਾ ਸੁਣ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Giver of all Virtue, O my Lord and Master, please hear the prayer of this humble person."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸ੍ਵਾਂਮੀ! ਸਰਬ ਗੁਣੋਂ ਕੇ ਦਾਤੇ ਮੁਝ ਦੀਨ ਕੀ ਏਕ ਬੇਨਤੀ ਸ੍ਰਵਣ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਰੇ ਗੁਣ ਦੇਣ ਵਾਲੇ ਮਾਲਕ! ਮੇਰੀ ਗਰੀਬ ਦੀ ਇਕ ਬੇਨਤੀ ਸੁਣ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਾਤੇ = ਹੇ ਦੇਣ ਵਾਲੇ! ਸੁਆਮੀ = ਹੇ ਮਾਲਕ! ਬਿਨਉ = {विनय} ਬੇਨਤੀ। ਬਿਨਉ ਦੀਨਾ = ਦੀਨ ਦੀ ਬੇਨਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nos bendices con la Virtud, escucha entonces la oración de Nanak,"