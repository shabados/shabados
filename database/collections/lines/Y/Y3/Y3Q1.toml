[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤ ਜਨਾ ਕੈ; ਮਨਿ ਬਿਸ੍ਰਾਮ ॥ ਰਹਾਉ ॥"
page = 262
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is peace within the mind of Lord's slaves. Pause"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਗੋਲਿਆਂ ਦੇ ਚਿੱਤ ਅੰਦਰ ਅਮਨ-ਚੈਨ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The minds of the devotees abide in a joyful peace. ||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਭਗਤੋਂ ਕੇ ਮਨ ਬੀਚ ਇਸ ਕਾ ਬਿਸ੍ਰਾਮ ਅਰਥਾਤ ਨਿਵਾਸ ਹੈ॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਦਾ ਟਿਕਾਣਾ ਭਗਤਾਂ ਦੇ ਹਿਰਦੇ ਵਿਚ ਹੈ।ਰਹਾਉ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਭਗਤ ਜਨਾ ਕੈ ਮਨਿ = ਭਗਤ ਜਨਾਂ ਦੇ ਮਨ ਵਿਚ। ਬਿਸ੍ਰਾਮ = ਟਿਕਾਣਾ।ਰਹਾਉ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es enaltecido en la Conciencia de los Gurmukjs."