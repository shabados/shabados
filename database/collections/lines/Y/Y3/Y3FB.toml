[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਉਥਿ ਉਪਾਏ; ਚਾਰੇ ਬੇਦਾ ॥"
page = 839
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The fourth (lunar day): The Lord created the four Vedas,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੌਥੀ (ਤਿੱਥ): ਸੁਆਮੀ ਨੇ ਚਾਰੇ ਵੇਦ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Fourth Day: He created the four Vedas,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚਉਥ ਦ੍ਵਾਰੇ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਨੇ ਆਪ ਹੀ ਪੁਨਾ ਚਾਰੋਂ ਬੇਦ ਉਤਪਤ ਕਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਨੇ ਆਪ ਹੀ ਚਾਰ ਵੇਦ ਪੈਦਾ ਕੀਤੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਉਥਿ = ਪੂਰਨਮਾਸ਼ੀ ਤੋਂ ਪਿਛੋਂ ਚੌਥੇ ਦਿਨ। ਚਾਰੇ ਬੇਦ = ਰਿਗ, ਜਜੁਰ, ਸਾਮ, ਅਥਰਬਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Chauth, Cuarto día: Él creó los cuatro Vedas"