[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਤੇ; ਛੁਟੇ ਆਪ ਹਾਂ ॥"
page = 410
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From the time I am rid of self conceit,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਤੋਂ ਮੈਂ ਸਵੈ-ਹੰਗਤਾ ਤੋਂ ਖਲਾਸੀ ਪਾ ਗਿਆ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Ever since I rid myself of my self-conceit,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸੇ ਆਪਾ ਭਾਉ ਸੇ ਛੁਟੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮਨ!) ਜਿਸ ਵੇਲੇ (ਮਨੁੱਖ ਦੇ ਅੰਦਰੋਂ) ਹਉਮੈ ਅਹੰਕਾਰ ਮੁੱਕ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪਾ = ਆਪਾ-ਭਾਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Desde entonces fui liberado de mi ego"