[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਬਹੁ ਦੀਨ ਨਹੀ ਪੀਠਿ; ਅਨਿਕ ਜੀਤੇ ਜਿਹ ਨ੍ਰਿਪ ਗਣ ॥"
page = 693

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There is one invincible warriors named Shaturta (enmity) who has never shown his back and has conquered many kings"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਕਦੇ ਵੀ ਪਿਠ ਨਹੀਂ ਦਿੱਤੀ ਅਤੇ ਅਨੇਕਾਂ ਰਾਜਿਆਂ ਦੇ ਸਮੂਹ ਜਿਤ ਲਏ ਹਨ।"