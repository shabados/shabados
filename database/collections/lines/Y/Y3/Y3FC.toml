[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਸ ਅਕਾਲਪੁਰਖ ਦੀ ਮਾਲਕੀ ਅਤੇ ਪਿਆਰ ਵਾਲਾ ਬੰਦਾ ਚਿਰੰਜੀਵ ਹੁੰਦਾ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਬਰ ਖ਼ੁਦਾ ਵੰਦੀਸ਼ ਅਰਜ਼ਾਨੀ ਬਵਦ ॥੪੦॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Then, you will discover all types of material and non-material wealth and treasures inside you. (392)"