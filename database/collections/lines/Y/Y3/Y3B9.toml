[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਰ ਭੂਤ ਸਤਿ; ਹਰਿ ਕੋ ਨਾਉ ॥"
page = 289
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The real thing is God's True Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਸਲ ਵਸਤੂ ਵਾਹਿਗੁਰੂ ਦਾ ਸੱਚਾ ਨਾਮ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The essential reality is the True Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਮੇਂ ਸੇ ਸਾਰ ਰੂਪ ਜੋ (ਸਤਿ) ਨਿਹਚੇ ਕਰ ਕੇ ਹਰੀ ਕਾ ਨਾਮ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਹੀ ਸਭ ਪਦਾਰਥਾਂ ਤੋਂ ਉੱਤਮ ਪਦਾਰਥ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਰ = ਸ੍ਰੇਸ਼ਟ, ਸਭ ਤੋਂ ਚੰਗੀ। ਭੂਤ = ਪਦਾਰਥ, ਚੀਜ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues cualquiera que Lo escuche, Lo declame"