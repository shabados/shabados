[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ ਕੀ ਲਾਗਉ ਸੇਵ ॥"
page = 862
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Attach thou thyself to the service of the transcendent Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੇ ਆਪ ਨੂੰ ਪਰਮ ਪ੍ਰਭੂ ਦੀ ਟਹਿਲ ਸੇਵਾ ਅੰਦਰ ਜੋੜ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Commit yourself to the service of the Transcendent Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਯਾਰਯੋ! ਪਾਰਬ੍ਰਹਮ ਕੀ ਸੇਵਾ ਮੇਂ ਲਾਗੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੈਂ ਤਾਂ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਵਿਚ ਲੱਗਣਾ ਚਾਹੁੰਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਾਗਉ = ਲਾਗਉਂ, ਮੈਂ ਲੱਗਦਾ ਹਾਂ, ਮੈਂ ਲੱਗਣਾ ਚਾਹੁੰਦਾ ਹਾਂ। ਸੇਵ = ਸੇਵਾ-ਭਗਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Compromete tu ser al Servicio del Señor Trascendente."