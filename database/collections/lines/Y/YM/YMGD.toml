[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧਸੰਗਿ; ਵਿਰਲਾ ਕੋ ਪਾਏ ॥"
page = 1004
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rare is the mortal, who obtains the society of saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਟਾਂਵਾਂ ਟੱਲਾ ਪ੍ਰਾਨੀ ਹੀ ਸਤਿਸੰਗਤ ਨੂੰ ਪ੍ਰਾਪਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Rare is that being, who finds the Saadh Sangat, the Company of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਸੰਤੋਂ ਕੇ ਸੰਗ ਦੁਆਰਾ ਗੋਬਿੰਦ ਕਾ ਜਾਪ ਕੋਈ ਵਿਰਲਾ ਹੀ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ, ਕੋਈ ਵਿਰਲਾ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸੰਗਤ ਵਿਚ ਰਹਿ ਕੇ ਨਾਮ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋ = ਕੋਈ ਮਨੁੱਖ। ਸਾਧ ਸੰਗਿ = ਗੁਰੂ ਦੀ ਸੰਗਤ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, raro es aquél que llega hasta la Sociedad de los Santos."