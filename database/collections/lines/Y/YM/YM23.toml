[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮੋ ਹਿੰਗੁਲਾ ਪਿੰਗੁਲਾਯੰ ਅਨੂਪਾ ॥੮॥੨੨੭॥"
page = 117

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art seated at Hinglaj and Pinglaj, Thou art unique! I salute Thee.8.227."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹਿੰਗੁਲਾ, ਪਿੰਗੁਲਾ ਅਤੇ ਅਨੂਪਮਾ ਨੂੰ ਨਮਸਕਾਰ ਹੈ ॥੮॥੨੨੭॥"