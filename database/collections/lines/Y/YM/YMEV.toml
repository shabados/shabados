[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਸਿਮਰਤ; ਹੋਤ ਸੂਕੇ ਹਰੇ ॥"
page = 182
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By remembering whom, what is dry becomes green."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੀਹਦਾ ਆਰਾਧਨ ਕਰਨ ਦੁਆਰਾ ਜੋ ਸੁੱਕਾ-ਸੜਿਆ ਹੈ, ਉਹ ਸਰ-ਸਬਜ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remembering Him in meditation, the dry branches become green again."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਸਿਮਰਨੇ ਸੇ ਸੂਕੇ ਹੂਏ ਹਰੇ ਹੋਤੇ ਹੈਂ, ਅਰਥਾਤ ਜੋ ਸੁਭ ਗੁਨੋਂ ਸੇ ਰਹਤ ਹੈਂ, ਸੋ ਗੁਨੋਂ ਸੇ ਸਪੰਨ ਹੋ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰਮਾਤਮਾ ਦਾ ਸਿਮਰਨ ਕੀਤਿਆਂ ਨਿਰਦਈ ਮਨੁੱਖ ਨਰਮ-ਦਿਲ ਹੋ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੂਕੇ = ਨਿਰਦਈ, ਖੁਸ਼ਕ-ਦਿਲ। ਹਰੇ = ਨਰਮ-ਦਿਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél, en Quien al meditar hasta las ramas secas reverdecen otra vez."