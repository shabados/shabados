[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੀਨੇ ਪ੍ਰੀਤਿ ਭਈ; ਜਲਿ ਨਾਇ ॥"
page = 164
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The fish loves to bathe in water."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੱਛੀ ਦਾ ਪਿਆਰ ਪਾਣੀ ਵਿੱਚ ਨ੍ਹਾਉਣ ਨਾਲ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The fish loves to bathe in the water."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਛੀ ਕੀ ਪ੍ਰੀਤੀ ਜਲ ਕੇ ਅਸਨਾਨ ਮੇਂ ਹੈ, ਅਰਥਾਤ ਜਲ ਕੇ ਰਹਣੇ ਪਰ ਪ੍ਰਸਿੰਨ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਾਣੀ ਵਿਚ ਨ੍ਹਾ ਕੇ ਮੱਛੀ ਨੂੰ ਖ਼ੁਸ਼ੀ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੀਨੇ = ਮੱਛੀ ਨੂੰ। ਜਲਿ = ਪਾਣੀ ਵਿਚ। ਨਾਇ = ਨ੍ਹਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El pez es feliz cuando se ha bañado en el agua."