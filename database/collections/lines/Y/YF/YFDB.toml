[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਮਰੇ ਕਪਰੇ; ਨਿੰਦਕੁ ਧੋਇ ॥੧॥"
page = 339
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the slanderer washes my clothes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਕਲੰਕ ਲਾਉਣ ਵਾਲਾ ਮੇਰੇ ਕਪੜੇ ਧੋਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then the slanderer washes my clothes. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੌ ਨਿੰਦਕ ਹਮਾਰੇ ਅੰਤਹਕਰਣ ਰੂਪੀ ਕਪੜੇ ਧੋਤਾ ਹੈ ਅਰਥਾਤ ਪਾਪ ਕੋ ਲੇ ਲੇਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਨਿੰਦਕ ਸਾਡੇ ਮਨ ਨੂੰ ਪਵਿੱਤਰ ਕਰਨ ਵਿਚ ਸਹਾਇਤਾ ਕਰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਪਰੇ ਧੋਇ = ਕੱਪੜੇ ਧੋਂਦਾ ਹੈ, ਮਨ ਦੀ ਵਿਕਾਰਾਂ ਦੀ ਮੈਲ ਦੂਰ ਕਰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el calumniador sólo se traga la mugre que se pega a mi ropa.  (1)"