[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਰਾਮ ਨਾਮੁ ਜਪਿ ਲਾਹਾ ॥"
page = 530
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Utter thou the Lord God's Name as in it is thy profit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ ਉਚਾਰ। ਇਸ ਵਿੱਚ ਤੇਰਾ ਲਾਭ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chant the Lord's Name, and earn the profit."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹਰੀ ਕਾ ਨਾਮ ਜਪ ਤੇਰੇ ਕੋ ਲਾਭ ਮਿਲੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪ ਜਪ ਕੇ ਮਨੁੱਖਾ ਜਨਮ ਦਾ ਲਾਭ ਖੱਟ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਪਿ = ਜਪ ਕੇ। ਲਾਹਾ = ਲਾਭ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Verdadero Fruto está en contemplar el Nombre, pues en la Emancipación está la Paz,"