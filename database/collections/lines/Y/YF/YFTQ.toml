[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਿੰਡ ਪੁਤ੍ਰ ਹੀ ਦੇਹਿ; ਪ੍ਰੀਤਿ ਪੂਤੋ ਉਪਜਾਵਹਿ ॥"
page = 906

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The dead are honoured through sons."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪੁੱਤਰ ਹੀ (ਮਰਨ ਉਪਰੰਤ) ਪਿੰਡ ਦਿੰਦੇ ਹਨ ਅਤੇ ਪੁੱਤਰਾਂ ਨਾਲ ਹੀ ਪ੍ਰੀਤ ਪੈਦਾ ਹੁੰਦੀ ਹੈ।"