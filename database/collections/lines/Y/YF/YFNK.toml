[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਨਾ ਤਜਿ ਅਭਿਮਾਨੁ ॥"
page = 895
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lay aside thou thy self-conceit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੀ ਸਵੈ-ਹੰਗਤਾ ਨੂੰ ਛੱਡ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Leave your egotistical pride behind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨਾ ਅਭਿਮਾਨ ਤੂੰ ਸਭ ਤਿਆਗ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ (ਸਿਆਣਪ ਦਾ) ਮਾਣ ਛੱਡ ਦੇਹ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਜਿ = ਛੱਡ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y haz a un lado tu ego;"