[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਸਾਡੀਆਣ ਅੱਖਾਣ ਦੀਆਣ ਪੁਤਲੀਆਣ ਨੂੰ ਸੁਰਮੇ ਦੀ ਕੋਈ ਲੋੜ ਨਹੀਣ, "

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਮਰਦੁਮਾਨਿ ਚਸ਼ਮਿ ਮਾ ਰਾ ਏਹਤਿਆਜਿ ਸੁਰਮਾ ਨੀਸਤ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "In fact, religious devotion (and prayers) is a good cure to put this life in the proper perspective. (217)"