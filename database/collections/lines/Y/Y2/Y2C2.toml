data = "ਮਰਾ ਮਸਲਿਹਤ ਦਿਹ ਵਫ਼ਾਦਾਰ ਮਾ ॥੨੨॥"
page = 1415

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Oh, my lady, please counsel me what to do?’(22)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਵਫ਼ਾਦਾਰ! ਮੈਨੂੰ ਆਪਣੀ ਸਲਾਹ ਦੇ (ਕਿ ਕੀ ਕਰਾਂ) ॥੨੨॥"