[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੰਚ ਦੂਤ ਭਾਗੇ ਬਿਕਰਾਲ ॥"
page = 866
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The five hideous demons have hastened away"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੰਜ ਭਿਆਨਕ ਭੂਤਨੇ ਦੌੜ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The five hideous demons have run away."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਪੰਚ ਦੂਤ ਜੋ ਕਾਮਾਦਿ ਬਿਕਰਾਲ ਸੇ ਵਹੁ ਹਮਾਰੇ ਸੇ ਡਰ ਕੇ ਭਾਗ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਾਮਾਦਿਕ) ਪੰਜੇ ਡਰਾਉਣੇ ਵੈਰੀ ਉਹਨਾਂ ਤੋਂ ਪਰੇ ਭੱਜ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਤ = ਵੈਰੀ। ਬਿਕਰਾਲ = ਡਰਾਉਣੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así los cinco enemigos, los cinco desgraciados se van,"