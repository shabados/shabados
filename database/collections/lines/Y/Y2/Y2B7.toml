[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਪਰ ਦਰਬ ਕਉ ਹਿਰਹਿ ॥"
page = 275
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many myriads steel others wealth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਕਰੋੜ ਹੋਰਨਾ ਦਾ ਧੰਨ ਚੁਰਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions steal the wealth of others."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਈ ਕ੍ਰੋੜੋਂ ਪਰਾਏ ਧਨ ਕੋ ਹਿਰਤੇ ਹੈਂ ਅਰਥਾਤ ਚੁਰਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਰੋੜਾਂ ਬੰਦੇ ਦੂਜਿਆਂ ਦਾ ਧਨ ਚੁਰਾਉਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਰਬ = ਧਨ। ਪਰ = ਪਰਾਇਆ, ਬਿਗਾਨਾ। ਹਿਰਹਿ = ਚੁਰਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones roban lo que pertenece al otro."