[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਛਨ ਜੀਤਿ ਫਿਰਿਓ ਸਹਦੇਵ; ਘਨੋ ਚਿਤ ਮੈ ਤਿਨਿ ਓਜ ਜਨਾਯੋ ॥"
page = 531

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Bhim came after conquering East, Arjuna after conquering North and Sahdev came back with pride after conquering the South"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੱਖਣ (ਦਿਸ਼ਾ) ਨੂੰ ਜਿਤ ਕੇ ਸਹਿਦੇਵ ਮੁੜ ਆਇਆ ਅਤੇ ਉਸ ਨੇ ਮਨ ਵਿਚ ਬਹੁਤ ਬਹਾਦਰੀ ਨੂੰ ਜਤਾਇਆ।"