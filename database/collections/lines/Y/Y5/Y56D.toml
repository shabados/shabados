[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਹਿਬੁ ਸੋ ਸਾਲਾਹੀਐ; ਜਿਨਿ ਕਾਰਣੁ ਕੀਆ ॥"
page = 766
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Praise thou the Lord, who has created the universe."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਉਸ ਸੁਆਮੀ ਦੀ ਕੀਰਤੀ ਕਰ ਜਿਸ ਨੇ ਆਲਮ ਰਚਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So praise your Lord and Master, who created the creation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਮਹਿਤਵ ਆਦਿਕ ਜਗਤ ਕੇ ਕਾਰਣੋਂ ਕੋ ਜਿਸ ਨੇ ਉਤਪੰਨ ਕੀਆ ਹੈ ਤਿਸ (ਸਾਹਿਬ) ਸੁਆਮੀ ਪਰਮੇਸਰ ਕੋ ਸਲਾਹੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਾਲਕ-ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਕਰਨੀ ਚਾਹੀਦੀ ਹੈ ਜਿਸ ਨੇ ਜਗਤ ਪੈਦਾ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਸਾਹਿਬ) ਨੇ। ਕਾਰਣੁ = ਜਗਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Alaba al Señor que creó la Creación."