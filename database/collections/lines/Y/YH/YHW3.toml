[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਹੀ ਨਿਰੰਜਨੁ; ਰਹਿਆ ਸਮਾਈ ॥"
page = 221
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In that very Name, the Pure One remains permeated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨਾਮ ਅੰਦਰ ਹੀ ਪਵਿੱਤਰ ਪੁਰਖ ਲੀਨ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In it, the Immaculate Lord is permeating and pervading."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਜਿਨ੍ਹੋਂ ਨੇ ਨਾਮ ਜਪਿਆ ਹੈ, ਨਿਰੰਜਨ ਪਰਮੇਸ੍ਵਰ ਤਿਨਹੋਂ ਮੇਂ ਸਮਾਇ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਹੀ ਮਾਇਆ ਦੇ ਪ੍ਰਭਾਵ ਤੋਂ ਰਹਿਤ ਪਰਮਾਤਮਾ ਹਰ ਵੇਲੇ ਮੌਜੂਦ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰੰਜਨੁ = ਮਾਇਆ-ਰਹਿਤ ਪ੍ਰਭੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Ello habita el Señor, el Uno Inmaculado,"