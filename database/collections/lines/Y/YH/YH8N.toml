[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਕਹਿਆ; ਤਿਨਿ ਕਹਨੁ ਵਖਾਨਿਆ ॥"
page = 221
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who says, merely describes a saying."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੇਵਲ ਆਖਦਾ ਹੀ ਹੈ, ਉਹ ਨਿਰਾਪੁਰਾ ਇਕ ਅਖਾਣ ਹੀ ਬਿਆਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who speaks, merely describes speech."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸਨੈ ਧਾਰੈ ਬਿਨਾ ਕੇਵਲ ਕਥਨ ਹੀ ਕੀਆ ਹੈ ਤਿਸਨੈ ਕੇਵਲ (ਕਹਨੁ) ਕਹਾਨੀਆਂ ਕੋ (ਵਖਾਨਿਆ) ਕਥਨ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ (ਨਿਰੀ ਮਨ ਦੀ ਚਤੁਰਾਈ ਨਾਲ ਹੀ ਇਹ) ਕਹਿ ਦਿੱਤਾ (ਕਿ ਪਰਮਾਤਮਾ ਤਿੰਨਾਂ ਭਵਨਾਂ ਵਿਚ ਹਰ ਥਾਂ ਮੌਜੂਦ ਹੈ) ਉਸ ਨੇ ਜ਼ਬਾਨੀ ਜ਼ਬਾਨੀ ਹੀ ਆਖ ਦਿੱਤਾ (ਉਸ ਦਾ ਮਨ-ਹਾਥੀ ਅਜੇ ਭੀ ਅਮੋੜ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਜੀਵ) ਨੇ। ਕਹਨੁ ਵਖਾਨਿਆ = ਨਿਰਾ ਜ਼ਬਾਨੀ ਆਖ ਦਿੱਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que habla sin conocer, se está consintiendo con vanos parloteos,"