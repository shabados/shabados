[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਾਨ ਸਰੋਵਰੁ ਛਡਿ ਕੈ; ਹੋਰਤੁ ਥਾਇ ਨ ਜਾਇ ਬਹੰਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Leaving Manasarovar, they go nowhere to sit or reside."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮਾਨਸਰ ਨੂੰ ਤਿਆਗ ਕੇ ਹੋਰ ਥਾਵਾਂ ਵਿਚ ਨਹੀਂ ਬੈਠਦੇ।"