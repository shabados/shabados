data = "ਸਭ ਮਨ ਕੀ ਚਿੰਤਾ ਪਰਹਰੀ ॥੨੩੧੨॥"
page = 531

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They served Krishna heartily and relinquished all the afflictions of the mind.2312."

