data = "ਕਬਹੂ; ਸੋਇ ਰਹੈ ਦਿਨੁ ਰਾਤਿ ॥"
page = 277
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sometimes he remains asleep day and night."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਦੇ ਉਹ ਦਿਨ ਰਾਤ ਸੁੱਤਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sometimes, they remain asleep day and night."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਕਬੀ ਦਿਨੇ ਰਾਤ ਸੋਇ ਹੀ ਰਹਿਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਦੇ ਦਿਨੇ ਰਾਤ ਸੁੱਤਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਇ ਰਹੈ = ਸੁੱਤਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
