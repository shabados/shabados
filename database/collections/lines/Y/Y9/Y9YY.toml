[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇੰਦ੍ਰ ਮੁਖੀ ਰਾਨੀ ਰਹੈ; ਤਾ ਕੇ ਰੂਪ ਅਨੂਪ ॥"
page = 896

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "His Rani, Indra Mukhi, was wondrously pretty."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਇੰਦ੍ਰ ਮੁਖੀ ਨਾਂ ਦੀ ਬਹੁਤ ਸੁੰਦਰ ਰਾਣੀ ਸੀ।"