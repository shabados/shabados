[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਤੁਹਾਡਾ ਮੁਖੜਾ ਉਹ ਪਵਿੱਤ੍ਰ ਕਿਤਾਬ ਹੈ ਜੋ ਹਰ ਹਾਲ ਵਿਚ ਹਰ ਇੱਕ ਦੀ ਰਾਖੀ ਕਰਦੀ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਮੁਸਹਫ਼ਿ ਰੂਇ ਤੂ ਹਾਫ਼ਿਜ਼ ਹਮਾ ਰਾ ਹਮਾ ਦਰ ਹਾਲ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "That group of persons is evil and dissolute where Satan/Devil is playing its role;"