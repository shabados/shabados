[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਲਿਜੁਗਿ ਕੇ ਉਪਕਾਰਿ ਸੁਣਿ; ਜੈਸੇ ਬੇਦ ਅਥਰਵਣ ਗਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "As has been said in the Atharvaveda, listen to the redeeming features of kaliyug."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਲਿਜੁਗ ਦੇ ਉਪਕਾਰ ਸੁਣ, ਜਿਵੇਂ ਕਿ ਅਰਥਬਣ ਬੇਦ ਗਵਾਹੀ ਦਿੰਦਾ ਹੈ। (ਹੁਣ ਆਪਣਾ ਨੋਟ ਦਿੰਦੇ ਹਨ: -)"