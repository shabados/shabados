[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਓਨਾ ਕਾ; ਤੇਰੇ ਓਹਿ ॥੨॥"
page = 25
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Still Thou art theirs and they are Thine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਭੀ, ਤੂੰ ਉਨ੍ਹਾਂ ਦਾ ਹੈਂ ਅਤੇ ਉਹ ਤੇਰੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "still, You are theirs, and they are Yours. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੋ ਭੀ ਤੂੰ  ਉਨ ਸਭ ਜੀਵੋਂ ਕਾ ਸ੍ਵਾਮੀ ਹੈਂ ਔਰ ਵਹੁ ਤੇਰੇ ਦਾਸ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਉਹਨਾਂ ਦਾ ਮਾਲਕ ਹੈਂ, ਉਹ ਸਾਰੇ ਤੇਰੇ ਹੀ ਬਣਾਏ ਹੋਏ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਹਿ = ਉਹ ਸਾਰੇ ਜੀਵ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ellos son Tuyos y Tú de ellos. (2)"