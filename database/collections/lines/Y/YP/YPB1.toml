data = "ਤਿਨ ਊਪਰਿ; ਜਾਈਐ ਕੁਰਬਾਣੁ ॥"
page = 200
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak is a sacrifice unto those,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਉਨ੍ਹਾਂ ਉਤੇ ਬਲਿਹਾਰਨੇ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak is a sacrifice to those"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੇ ਊਪਰਿ ਸੇ ਕੁਰਬਾਨ ਜਾਈਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਉਤੋਂ (ਸਦਾ) ਸਦਕੇ ਜਾਣਾ ਚਾਹੀਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਈਐ = ਜਾਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
