[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਮੁਗਧੌ ਦਾਦਰੁ; ਭਗਤਿਹੀਨੁ ॥"
page = 1188
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Lord's devotion, the mind is foolish like a frog."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਵੈਰਾਗ ਦੇ ਬਗੈਰ, ਮਨੂਆ ਡੱਡੂ ਦੀ ਮਾਨੰਦ ਮੂਰਖ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mind is like a foolish frog, without devotional worship."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਮੂਰਖ ਡਡੂ ਭਗਤੀ ਸੇ ਹੀਨ ਹੈ, ਭਾਵ ਸੰਸਾਰ ਰੂਪ ਚਿਕੜ ਮੇਂ ਫਸਾ ਹੂਆ ਬਿਸੈ ਸਿਵਾਲ ਕੋ ਖਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੂਰਖ ਮਨ ਭਗਤੀ ਤੋਂ ਵਾਂਜਿਆ ਰਹਿੰਦਾ ਹੈ, (ਇਹ ਮੂਰਖ ਮਨ, ਮਾਨੋ) ਡੱਡੂ ਹੈ (ਜੋ ਨੇੜੇ ਹੀ ਉੱਗੇ ਹੋਏ ਕੌਲ ਫੁੱਲ ਦੀ ਕਦਰ ਨਹੀਂ ਜਾਣਦਾ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਗਧੌ = ਮੂਰਖ। ਦਾਦਰੁ = ਡੱਡੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La mente privada de la Devoción no tiene Sabiduría,"