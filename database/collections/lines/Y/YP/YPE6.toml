[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਰਾਇਣ. ਨਿੰਦਸਿ ਕਾਇ; ਭੂਲੀ ਗਵਾਰੀ ॥"
page = 695
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why slanderest Thou the Lord, O erring and ignorant woman?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਭੁਲੜ ਅਤੇ ਬੇਸਮਝ ਇਸਤਰੀਏ! ਤੂੰ ਕਿਉਂ ਪ੍ਰਭੂ ਨੂੰ ਦੂਸ਼ਨ ਲਾਉਂਦੀ ਹੈਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Why do you slander the Lord? You are ignorant and deluded."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭ੍ਰਮ ਕਰ ਭੂਲੀ ਹੂਈ (ਗਵਾਰੀ) ਮੂਰਖੇ! ਵੀਚਾਰ ਬਿਨਾਂ ਨਾਰਾਇਣ ਕੋ ਕਿਉਂ ਨਿੰਦਤੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭੁੱਲੜ ਮੂਰਖ ਜਿੰਦੇ! ਤੂੰ ਪਰਮਾਤਮਾ ਨੂੰ ਕਿਉਂ ਦੋਸ ਦੇਂਦੀ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿੰਦਸਿ ਕਾਇ = ਤੂੰ ਕਿਉਂ ਨਿੰਦਦੀ ਹੈਂ? ਭੂਲੀ ਗਵਾਰੀ = ਹੇ ਭੁੱਲੀ ਹੋਈ ਮੂਰਖ ਜੀਵ-ਇਸਤ੍ਰੀ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué insultar a Tu Dios, oh mujer ignorante?"