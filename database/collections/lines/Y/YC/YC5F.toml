[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਥਮੇ; ਤਿਆਗੀ ਹਉਮੈ ਪ੍ਰੀਤਿ ॥"
page = 370
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Firstly, I have given up the love of pride."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਹਿਲਾਂ ਮੈਂ ਹੰਗਤਾ ਦਾ ਪਿਆਰ ਛੱਡ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "First, I renounced my egotistical love of myself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਥਮ ਹਮਨੇ ਹੰਤਾ ਮਮਤਾ ਕੀ ਪ੍ਰੀਤੀ ਤ੍ਯਾਗੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਦੋਂ ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਮੈਨੂੰ ਪ੍ਰਭੂ-ਪਤੀ ਮਿਲਿਆ, ਤਾਂ ਸਭ ਤੋਂ) ਪਹਿਲਾਂ ਮੈਂ ਹਉਮੈ ਨੂੰ ਪਿਆਰਨਾ ਛੱਡ ਦਿੱਤਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਥਮੈ = ਪਹਿਲਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Primero dejé el amor a mi ego;"