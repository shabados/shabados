data = "ਮਨਮ ਦੁਖ਼ਤਰੇ ਸ਼ਾਹਿਜਾ ਬਿਲਸਿਤਾ ॥੨੮॥"
page = 1414

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘I am the daughter of the King of Zablistan.’(28)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੈਂ 'ਬਿਲਸਿਤਾਂ' ਦੇਸ਼ ਦੇ ਬਾਦਸ਼ਾਹ ਦੀ ਬੇਟੀ ਹਾਂ ॥੨੮॥"