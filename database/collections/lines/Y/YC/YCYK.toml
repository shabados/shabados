[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਹਰਿ; ਅੰਧੁਲੇ ਕੀ ਲਾਕਰੀ ॥੧॥"
page = 874
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the Lord is the staff of the blind-man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਆਮੀ ਅੰਨ੍ਹੇ ਆਦਮੀ ਦੀ ਡੰਗੋਰੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is the walking stick of the blind. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਹਰੀ ਕਾ ਜਾਪ ਮੇਰਾ ਤੈਸੇ ਆਸਰਾ ਹੈ ਜੈਸੇ ਅੰਧਲੇ ਕੀ (ਲਾਕਰੀ) ਛਟੀ ਆਸਰਾ ਰੂਪ ਹੋਤੀ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਹਰਿ-ਨਾਮ ਹੀ ਮੈਂ ਅੰਨ੍ਹੇ ਦਾ ਆਸਰਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਾਕਰੀ = ਲੱਕੜੀ, ਟੋਹਣੀ, ਡੰਗੋਰੀ, ਆਸਰਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, el Señor es para el Devoto lo mismo que el palo para el ciego.(1)"