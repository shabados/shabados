[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਸਤਿਗੁਰ; ਬਾਟ. ਨ ਪਾਵੈ ॥੧॥"
page = 1353
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the True Guru, man finds not the way."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਦੇ ਬਾਝੋਂ, ਇਨਸਾਨ ਨੂੰ ਰਸਤਾ ਨਹੀਂ ਲਭਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the True Guru, no one finds the Way. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਇਹ ਜੀਵ ਸਤਿਗੁਰੋਂ ਤੇ ਬਿਨਾਂ ਧਿਆਨ ਕਾ (ਬਾਟ) ਮਾਰਗ ਨਹੀਂ ਪਾਵਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਰਸਤਾ ਸਤਿਗੁਰੂ ਤੋਂ ਬਿਨਾ ਨਹੀਂ ਲੱਭਦਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਟ = (वाट) ਰਸਤਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nadie logra encontrar el Sendero. (1)"