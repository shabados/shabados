[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧ ਰੂਪ; ਅਪਨਾ ਤਨੁ ਧਾਰਿਆ ॥"
page = 1005
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of himself, the Saint-Guru is the embodiment of the Lord's body."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤ-ਗੁਰਦੇਵ ਜੀ ਖ਼ੁਦ ਸੁਆਮੀ ਦੇ ਸਰੀਰ ਦਾ ਸਰੂਪ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Holy Saint is the very embodiment of the Lord's form."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭਗਵਤ ਨੇ ਸਾਧੂਆਂ ਕਾ ਰੂਪ ਅਪਨਾਂ ਸਰੀਰ ਧਾਰਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਨੇ ਗੁਰੂ-ਰੂਪ ਆਪਣਾ ਸਰੀਰ (ਆਪ ਹੀ ਸਦਾ) ਧਾਰਨ ਕੀਤਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧ = ਗੁਰੂ। ਤਨੁ = ਸਰੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y redime a aquél a quien Lo adora Amorosamente."