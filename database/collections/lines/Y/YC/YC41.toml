[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੀ ਭਗਤਿ; ਕਰਹੁ ਮਨੁ ਲਾਇ ॥"
page = 288
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Heartily apply thyself to God's meditation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਦਿਲ ਲਾ ਕੇ ਵਾਹਿਗੁਰੂ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Worship the Lord with whole-hearted devotion."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਭਾਈ! ਹਰੀ ਕੀ ਭਗਤੀ ਮਨ ਕੋ ਲਗਾਇ ਕਰ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨ ਲਾ ਕੇ ਕੇਵਲ ਪ੍ਰਭੂ ਦੀ ਹੀ ਭਗਤੀ ਕਰੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Alaba al Señor con toda Devoción en tu corazón,"