type = "primary"
data = "ਬਚੇ ਭਾਜੇ ਭਿਰੇ ਤੇ ਮਾਰੇ ॥"
page = 1010

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In the first place, he had killed the intrepid, and those who were left,ran away."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਲੜੇ ਉਹ ਮਾਰੇ ਗਏ, ਜੋ ਭਜੇ ਉਹ ਬਚ ਗਏ।"