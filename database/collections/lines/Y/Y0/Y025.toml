[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰ ਚੇਲਾ, ਚੇਲਾ ਗੁਰੂ; ਪਰਚਾ ਪਰਚਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Now the disciple and the Guru become identical. They become one and merge in one another."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਚੇਲਾ ਤੇ ਚੇਲਾ ਗੁਰੂ ਹੋ ਕੇ ਪ੍ਰੇਮ ਵਿਖੇ (ਪਰਚੇ=) ਪਰਚ ਗਿਆ ਹੈ।"