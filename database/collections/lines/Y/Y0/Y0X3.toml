[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭਿ ਅਧ੍ਰੁਵ ਡਿਠੇ ਜੀਉ; ਤਾ ਚਰਨ ਕਮਲ, ਚਿਤੁ ਲਾਇਆ ॥"
page = 785
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have seen everything perishable It is then that I have attached my mind to the Lord's lotus-feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹਰ ਸ਼ੈ ਨਾਸਵੰਤ ਦੇਖੀ ਹੈ ਤਦ ਹੀ ਮੈਂ ਕੰਵਲ ਰੂਪੀ ਪੈਰਾਂ ਨਾਲ ਆਪਣਾ ਮਨ ਜੋੜਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have seen that everything is transitory and perishable, and so I have linked my consciousness to the Lotus Feet of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸਭ ਪਦਾਰਥ (ਅਧ੍ਰੁਵ) ਚਲ ਰੂਪ ਦੇਖੇ ਤਬ ਵਾਹਿਗੁਰੂ ਕੇ ਚਰਣ ਕਮਲੋਂ ਮੇਂ ਚਿਤ ਲਗਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਮੈਂ ਵੇਖਿਆ ਕਿ (ਜਗਤ ਦੇ) ਸਾਰੇ (ਪਦਾਰਥ) ਨਾਸਵੰਤ ਹਨ, ਤਦੋਂ ਮੈਂ ਪ੍ਰਭੂ ਦੇ ਸੋਹਣੇ ਚਰਨਾਂ ਵਿਚ (ਆਪਣਾ) ਮਨ ਜੋੜ ਲਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭਿ = ਸਾਰੇ। ਅਧ੍ਰੁਵ = {ਅ-ਧ੍ਰੁਵ} ਸਦਾ ਨਾਹ ਟਿਕੇ ਰਹਿਣ ਵਾਲੇ, ਨਾਸਵੰਤ। ਜੀਉ = ਹੇ ਭਾਈ! ਚਰਨ ਕਮਲ = ਸੋਹਣੇ ਚਰਨਾਂ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Señor es Inmortal y yo Su Esclavo, pues Él no va ni viene."