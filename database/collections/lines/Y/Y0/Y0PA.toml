data = "ਜੀਵਤ ਰਹੇ ਮ੍ਰਿਤਕ ਨਹਿ ਭਏ ॥੧੨॥"
page = 990

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Raja fell down in the field but was still alive and had not died.(12)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਰ ਜੀਉਂਦਾ ਰਿਹਾ, ਮਰਿਆ ਨਹੀਂ ॥੧੨॥"