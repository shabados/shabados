[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਮ੍ਰਿਤ ਨਾਮੁ; ਰਿਦ ਮਾਹਿ ਸਮਾਇ ॥"
page = 263
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and the ambrosial Name is absorbed in the heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇ ਸੁਧਾ-ਸਰੂਪ ਨਾਮ ਦਿਲ ਅੰਦਰ ਰਸ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Ambrosial Naam, the Name of the Lord, is absorbed into the heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਨਾਮ ਅੰਮ੍ਰਿਤ ਰਿਦੇ ਮੇਂ ਆਇ ਕਰ ਸਮਾਇ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ (ਪ੍ਰਭੂ ਦਾ) ਅਮਰ ਕਰਨ ਵਾਲਾ ਨਾਮ ਟਿਕ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਿਦ ਮਾਹਿ = ਹਿਰਦੇ ਵਿਚ। ਸਮਾਇ = ਟਿਕ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y su corazón se inunda del Dulce Nombre."