[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਾਂ ਪਿਉ ਪਰਹਰਿ ਸੁਣੈ ਵੇਦੁ; ਭੇਦੁ ਨ ਜਾਣੈ ਕਥਾ ਕਹਾਣੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Renouncing the parents, the listener of Vedas cannot understand their mystery."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮਾਪਿਆਂ ਨੂੰ ਤਿਆਗ ਕੇ ਧਰਮ ਪੁਸਤਕ ਸੁਣੇ (ਉਹ ਭੇਦ) ਨਹੀਂ ਜਾਣੇਗਾ, ਕਥਾ ਸੁਣੇ (ਤਾਂ ਉਹ) ਕਹਾਣੀ ਹੀ ਹੈ।"