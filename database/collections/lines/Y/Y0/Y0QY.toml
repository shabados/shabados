[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਜ ਮੰਦਰਿ ਪਿਰੀਆ ॥"
page = 746
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In His mansion lives my love,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਹਿਲ ਅੰਦਰ ਮੇਰਾ ਪ੍ਰੀਤਮ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "my Beloved lives in the temple of my inner self."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਮਾਨੁਖ ਸਰੀਰ ਪਰਮੇਸਰ ਕਾ ਅਪਨਾ ਖਾਸ ਮੰਦਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਿਆਰਾ ਪ੍ਰਭੂ (ਹਰੇਕ ਸਰੀਰ-ਕੋਠੜੀ ਵਿਚ) ਆਪਣੇ ਮੰਦਰ ਵਿਚ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਜ ਮੰਦਰਿ = ਆਪਣੇ ਮੰਦਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En el templo de mi ser habita mi Amor"