[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਤਜਿ; ਅਨ ਲਗੇ ਹਾਂ ॥"
page = 411
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Forsaking God, who cling to another,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨੂੰ ਛੱਡ ਕੇ, ਜੋ ਹੋਰਸੁ ਨਾਲ ਚਿਮੜਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forsaking the Lord, and clinging to another,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਹਰਿ ਕੋ ਤ੍ਯਾਗ ਕਰ ਆਨ ਪ੍ਰਪੰਚ ਮੇਂ ਲਗੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੇ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਨੂੰ ਭੁਲਾ ਕੇ ਹੋਰ ਹੋਰ ਪਦਾਰਥਾਂ ਦੇ ਮੋਹ ਵਿਚ ਫਸੇ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਜਿ = ਤਿਆਗ ਕੇ। ਅਨ = ਹੋਰ (ਪਦਾਰਥਾਂ) ਵਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tantos dejan al Señor, y aferrándose al otro,"