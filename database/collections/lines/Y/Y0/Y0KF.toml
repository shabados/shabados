[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਸਿਖਾ ਪਰਦਖਣਾਂ; ਪੈਰੀ ਪੈ ਰਹਰਾਸਿ ਕਰੰਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Who adopt the custom of circumambulating the Guru's Sikhs and falling at their feet."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰ ਸਿਖਾਂ ਦੀ ਪਰਕਰਮਾਂ ਕਰ ਕੇ ਪੈਰੀਂ ਪੈ ਕੇ (ਨਿੰਮ੍ਰਤਾ ਦੀ) ਰਹੁਰੀਤਿ (ਯਾ ਪ੍ਰੀਤ) ਕਰਦੇ ਹਨ।"