[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਭਉ ਦਾਤਾ ਹਰਿ ਜੀਉ; ਮੇਰੈ ਨਾਲਿ ॥"
page = 1154
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Said Prahlad, \"The sire, Fearless, Beneficient God is with me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਹਿਲਾਦ ਨੇ ਆਖਿਆ: \"ਮਹਾਰਾਜ, ਨਿੱਡਰ, ਦਾਤਾਰ ਵਾਹਿਗੁਰੂ ਮੇਰੇ ਅੰਗ ਸੰਗ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He answered, \"The Great Giver, my Fearless Lord God is always with me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਹਿਲਾਦ ਜੀ ਕਹਤੇ ਹੈਂ: (ਨਿਰਭਉ) ਭੈ ਸੇ ਰਹਿਤ ਸੁਖੋਂ ਕਾ ਦਾਤਾ ਹਰਿ ਜੀਉ ਮੇਰੇ ਸਾਥ ਹੈ, ਭਾਵ ਯਹਿ ਕਿ ਜਬ ਹਰੀ ਨਿਰਭੈ ਕਰਤਾ ਮੇਰੇ ਸਾਥ ਹੈ, ਤੋ ਫੇਰ ਕਿਸ ਕਾ ਭੈ ਹੈ॥☬ਜੇ ਕਹੇ ਹਰੀ ਛੋਡ ਕੇ ਹਰਨਾਖਸ ਕਾ ਨਾਮ ਜਪਣੇ ਸੇ ਸਭ ਬਿਆਧਿ ਨਿਬ੍ਰਿਤ ਹੋ ਸਕੇਗੀ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਪ੍ਰਹਲਾਦ ਨੇ ਇਹੀ ਉੱਤਰ ਦਿੱਤਾ-) ਕਿਸੇ ਪਾਸੋਂ ਨਾਹ ਡਰਨ ਵਾਲਾ ਪਰਮਾਤਮਾ (ਸਦਾ) ਮੇਰੇ ਨਾਲ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Prehlad le contestó, el Intrépido Señor, el Señor Bondadoso habita en mi Alma,"