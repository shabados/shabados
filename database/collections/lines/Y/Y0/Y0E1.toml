[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੇ ਪਦ ਪੰਕਜ ਕੇਸਵ ਕੇ ਅਬ; ਊਧਵ ਲੈ ਕਰ ਮੈ ਸਹਰਾਏ ॥੯੯੦॥"
page = 396

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Those feet, on which the adepts meditate in their trance, now Udhava is pressing those feet with great affection.990."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕੇਸ਼ਵ (ਕ੍ਰਿਸ਼ਨ) ਦੇ ਉਨ੍ਹਾਂ ਚਰਨ-ਕਮਲਾਂ ਨੂੰ ਊਧਵ ਆਪਣੇ ਹੱਥਾਂ ਵਿਚ ਲੈ ਕੇ ਪਲੋਸ ਰਿਹਾ ਹੈ ॥੯੯੦॥"