[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਭਾਗਿ; ਓਹ ਪਾਛੈ ਪਰੈ ॥"
page = 871
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "She runs after and pursues the saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਭੱਜ ਕੇ ਸਾਧੂਆਂ ਦੇ ਪਿਛੇ ਪੈਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "She runs around, chasing after the Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਭਾਗ ਕੇ ਉਸ ਕੋ ਤਿਆਗਤੇ ਹੈਂ ਵਹੁ ਬਹੁਤ ਪੀਛੇ ਪਰਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਮਾਇਆ) ਭੱਜ ਕੇ ਸੰਤਾਂ ਦੇ ਲੜ ਲੱਗਣ ਦੀ ਕੋਸ਼ਸ਼ ਕਰਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਹ = ਉਹ ਮਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vaga salvajemente atrás de los Santos,"