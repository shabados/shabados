[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਹਲਾਦ ਉਧਾਰੇ; ਅਨਿਕ ਬਾਰ ॥੫॥੪॥"
page = 1194
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He saved saints like Prahlad many times."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਪ੍ਰਹਿਲਾਦ ਵਰਗੇ ਸੰਤਾਂ ਦਾ ਅਨੇਕਾਂ ਦਫਾ ਪਾਰ ਉਤਾਰਾ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He saves His devotees like Prahlaad over and over again. ||5||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸ੍ਵਰ ਨੇ ਪ੍ਰਹਲਾਦ ਜੀ ਅਨੇਕ ਬਾਰ ਅਗਨੀ ਪ੍ਰਬਤ ਆਦਿ ਸੇ ਬਚਾਏ ਹੈਂ; ਵਾ ਆਗੇ ਪ੍ਰਹਲਾਦ ਨੇ ਉਪਦੇਸ ਦੇ ਕਰ ਅਨੇਕ ਬਾਲਕ ਉਧਾਰੇ ਹੈਂ॥੫॥੪॥☬ਬੇਨਤੀ ਕਰਤੇ ਹੂਏ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਨੇ) ਪ੍ਰਹਿਲਾਦ ਨੂੰ ਅਨੇਕਾਂ ਕਸ਼ਟਾਂ ਤੋਂ ਬਚਾਇਆ ॥੫॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਧਾਰੇ = ਬਚਾਇਆ। ਅਨਿਕ ਬਾਰ = ਅਨੇਕਾਂ ਵਾਰੀ, ਅਨੇਕਾਂ ਕਸਟਾਂ ਤੋਂ ॥੫॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él ha liberado a miles de Prehladas un sin número de veces. (5-4)"