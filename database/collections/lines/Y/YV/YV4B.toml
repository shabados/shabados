[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਰਤ ਹਉ ਤੁਮ ਕੌ ਅਬ ਹੀ; ਰਹੁ ਠਾਢ ਅਰੇ, ਇਹ ਭਾਤ ਉਚਾਰਿਯੋ ॥"
page = 512

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He said, “O king! stay there, I shall kill you now"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵੈਰੀ ਨੂੰ ਵੰਗਾਰਦੇ ਹੋਇਆਂ ਇਸ ਤਰ੍ਹਾਂ ਕਿਹਾ, ਓਇ! ਖੜਾ ਰਹਿ, ਮੈਂ ਹੁਣੇ ਹੀ ਤੈਨੂੰ ਮਾਰਦਾ ਹਾਂ।"