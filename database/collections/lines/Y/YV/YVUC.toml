[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਤੇ ਰਮਈਆ; ਘਟਿ ਘਟਿ ਚੀਨਾ ॥੧॥"
page = 235
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "on that account, he beholds the pervading God in every heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਕਾਰਣ ਉਹ ਵਿਆਪਕ ਵਾਹਿਗੁਰੂ ਨੂੰ ਹਰ ਦਿਲ ਅੰਦਰ ਵੇਖ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then it recognizes the Lord in each and every heart. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਸੇ (ਰਮਈਆ) ਪਰਮੇਸ੍ਵਰ ਕੋ ਘਟੋਂ ਘਟੋਂ ਮੇਂ ਜਾਣਿਆਂ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਇਸ ਨੇ ਸੋਹਣੇ ਰਾਮ ਨੂੰ ਹਰੇਕ ਸਰੀਰ ਵਿਚ ਵੇਖ ਲਿਆ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਤੇ = ਤਦੋਂ ਤੋਂ। ਰਮਈਆ = ਸੋਹਣਾ ਰਾਮ। ਚੀਨਾ = ਪਛਾਣ ਲਿਆ। ਘਟਿ ਘਟਿ = ਹਰੇਕ ਸਰੀਰ ਵਿਚ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "él ve al Todo Prevaleciente Señor en todos los corazones.(1)"