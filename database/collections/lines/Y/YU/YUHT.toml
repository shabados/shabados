[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਣਿ ਸੰਤਹੁ; ਨਿਰਮਲ ਬੀਚਾਰ ॥"
page = 891
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hear, O saints this immaculate philosophy."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ੍ਰਵਣ ਕਰੋ ਹੇ ਸਾਧੂਓ! ਇਹ ਪਵਿੱਤਰ ਸੋਚ ਵਿਚਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen, O Saints: this is the pure philosophy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤੋਂ! ਨਿਰਮਲ ਬੀਚਾਰ ਸੁਣੌ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! ਜੀਵਨ ਨੂੰ ਪਵਿੱਤਰ ਕਰਨ ਵਾਲੀ ਇਹ ਵਿਚਾਰ ਸੁਣੋ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤਹੁ = ਹੇ ਸੰਤ ਜਨੋ! ਨਿਰਮਲ = ਪਵਿੱਤਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Nombre del Señor no hay salvación alguna,"