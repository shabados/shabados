[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰ ਹਰਿ ਕਰਮ; ਸ੍ਰਵਨਿ ਹਰਿ ਕਥਾ ॥"
page = 281
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Perform God's service and hear God's discourse."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦੀ ਟਹਿਲ ਕਮਾ ਅਤੇ ਰੱਬ ਦੀ ਹੀ ਵਾਰਤਾ ਸੁਣ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So do the Lord's Work, and listen to the Lord's Sermon."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਹਾਥੋਂ ਕਰ ਹਰੀ ਨਮਿਤ ਕਰਮ ਕਰ, ਜੋ ਹਰਿ ਕੀਆਂ ਕਥਾ ਹੈਂ ਤਿਨੋਂ ਕੋ ਤੂੰ ਸ੍ਰਵਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੱਥਾਂ ਨਾਲ ਪ੍ਰਭੂ (ਦੇ ਰਾਹ) ਦੇ ਕੰਮ ਕਰ ਤੇ ਕੰਨ ਨਾਲ ਉਸ ਦੀ ਵਡਿਆਈ (ਸੁਣ);"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰ = ਹੱਥਾਂ ਨਾਲ। ਕਰਮ = ਕੰਮ। ਸ੍ਰਵਨਿ = ਕੰਨਾਂ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Haz con tus manos Su Trabajo y escucha con tus oídos Su Palabra,"