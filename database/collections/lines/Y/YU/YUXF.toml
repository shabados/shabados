[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਿਸਮਾਦੁ ਪਉਣੁ; ਵਿਸਮਾਦੁ ਪਾਣੀ ॥"
page = 464
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wonderful is Thy wind and wonderful Thy water."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਲੌਕਿਕ ਹੈ ਤੇਰੀ ਹਵਾ ਅਤੇ ਅਲੌਕਿਕ ਤੇਰਾ ਜਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wonderful is the wind, wonderful is the water."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੌਣ ਅਸਚਰਜ ਰੂਪ ਹੈ ਪਾਣੀ ਭੀ ਆਸਚਰਜ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ ਪਉਣ ਹੈ ਅਤੇ ਕਿਤੇ ਪਾਣੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Maravilloso es el aire, maravillosa es el agua."