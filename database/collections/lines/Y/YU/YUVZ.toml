[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧ ਕੀ ਸੋਭਾ; ਸਾਧ ਬਨਿ ਆਈ ॥"
page = 272
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The celebrity of saint behoves the saint alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਦੀ ਕੀਰਤੀ ਕੇਵਲ ਸੰਤ ਨੂੰ ਹੀ ਫਬਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The glory of the Holy people is theirs alone;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਕੀ ਸੋਭਾ ਸਾਧ ਕੌ ਹੀ ਬਨਿ ਆਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਦੀ ਸੋਭਾ ਸਾਧੂ ਨੂੰ ਹੀ ਫਬਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧ ਬਨਿ ਆਈ = ਸਾਧੂ ਨੂੰ ਹੀ ਫਬਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Gloria de las personas Santas, es sólo suya."