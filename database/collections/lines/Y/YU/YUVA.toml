[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਝ ਬਿਨੁ ਠਾਕੁਰ; ਕਵਨੁ ਹਮਾਰਾ ॥੧॥ ਰਹਾਉ ॥"
page = 743
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "without Thee who is mine, O Lord. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਬਾਝੋਂ ਮੇਰਾ ਕਾਉਣ ਹੈ, ਹੇ ਸੁਆਮੀ! ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without You, O my Lord and Master, who belongs to me? ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਬਿਨਾਂ ਹੇ ਪਰਮੇਸਰ! ਮੇਰਾ ਕੌਨ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਲਕ ਤੇਰੇ ਬਿਨਾ ਮੇਰਾ ਹੋਰ ਕੋਈ ਆਸਰਾ ਨਹੀਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਕੁਰ = ਹੇ ਮਾਲਕ! ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pues qué hay ahí que sea mío, oh Maestro, sin Ti no tengo nada.  (1-Pausa)"