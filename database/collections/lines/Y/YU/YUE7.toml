[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਥੈ ਓਥੈ; ਤੂੰਹੈ ਰਖਵਾਲਾ ॥"
page = 132
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Here and hereafter Thou art the Protector."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਏਥੇ ਅਤੇ ਉਥੇ ਤੂੰ ਹੀ ਰਖਿਆ ਕਰਨ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Here and hereafter, You are our Protector."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਲੋਕ ਪ੍ਰਲੋਕ ਮੇਂ ਤੂੰ ਹੀ ਰਖਵਾਲਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਇਸ ਲੋਕ ਵਿਚ ਪਰਲੋਕ ਵਿਚ ਤੂੰ ਹੀ (ਸਭ ਜੀਵਾਂ ਦਾ) ਰਾਖਾ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres nuestro Protector aquí y aquí después;"