[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਤਰੁ; ਸੋ ਤਰੈ ਹਾਂ ॥"
page = 410
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "crosses the terrible world ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਭੈਦਾਇਕ ਸੰਸਾਰ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "crosses over the terrifying world-ocean."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ (ਦੁਤਰ) ਦੁਸਤਰ ਸੰਸਾਰ ਮੇਂ ਤਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਇਸ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਲੰਘ ਜਾਂਦਾ ਹੈ, ਜਿਸ ਵਿਚੋਂ ਪਾਰ ਲੰਘਣਾ ਬਹੁਤ ਔਖਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਤਰੁ = {दुस्तर} ਜਿਸ ਤੋਂ ਪਾਰ ਲੰਘਣਾ ਔਖਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo él cruza el terrible océano de las existencias."