[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਪ੍ਰਭੂ ਦਇਆਲੁ ਹੈ; ਆਪੇ ਦੇਇ ਬੁਝਾਇ ॥"
page = 37
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself is Merciful and He Himself imparts understanding."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਆਪ ਹੀ ਮਿਹਰਬਾਨ ਹੈ ਤੇ ਆਪ ਹੀ ਸਮਝ ਪਰਦਾਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God Himself is Merciful; He Himself bestows understanding."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੇ ਊਪਰ ਸੋ ਪ੍ਰਭੂ ਆਪ ਦ੍ਯਾਲ ਹੋਤਾ ਹੈ, ਤਿਨ ਕੋ ਅਪਨਾ ਸ੍ਵਰੂਪ ਆਪੇ (ਬੁਝਾਇ) ਸਮਝਾਇ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ ਆਪ ਹੀ (ਜਦੋਂ) ਦਿਆਲ ਹੁੰਦਾ ਹੈ (ਤਦੋਂ) ਆਪ ਹੀ (ਸਹੀ ਜੀਵਨ ਦੀ) ਸਮਝ ਬਖ਼ਸ਼ਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੁਝਾਇ ਦੇਇ = ਸਮਝਾ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando Él riega Su Gracia, Lo concebimos y Lo conocemos bien."