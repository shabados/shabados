[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਛਾ ਹੋਇ ਧ੍ਰਿਕਾਨੂਆ ਕਿਉ; ਵੁੜੀਐ ਦਾਖੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Why should the bunch of the bead tree be compared with grapes."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਧਿਰਕੌਨਿਆਂ ਦਾ ਗੁੱਛਾ ਦਾਖ ਦਾ ਗੁੱਛਾ ਕਿਉਂਕਰ ਕਹੀਦਾ ਹੈ? (ਨਹੀਂ)।"