[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਣ ਨਾਨਕੁ ਬੋਲੈ; ਭਲੀ ਬਾਣਿ ॥"
page = 1190
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak utters the meritorious and sublime Gurbani."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਗੁਣਾਂ ਵਾਲੀ ਅਤੇ ਸਰੇਸ਼ਟ ਗੁਰਬਾਨੀ ਉਚਾਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak chants the sublime, glorious Bani of the Word."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਗੁਣ ਉਚਾਰਨ ਰੂਪ ਬਾਣੀ ਭਲੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਤਾਂ ਪਰਮਾਤਮਾ ਦੀਆਂ ਸਿਫ਼ਤਾਂ ਦੀ ਬਾਣੀ ਉਚਾਰਦਾ ਹੈ, ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਵਾਲੀ ਬਾਣੀ ਹੀ ਸੁੰਦਰ ਬਾਣੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਣ ਬਾਣਿ = ਗੁਣਾਂ ਵਾਲੀ ਬਾਣੀ, ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਵਾਲੀ ਬਾਣੀ। ਭਲੀ = ਚੰਗੀ, ਸੋਹਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak pronuncia Su Discurso íntegro para tu Bien,"