[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਊਚ ਮੂਚੌ; ਬਹੁ ਅਪਾਰ ॥"
page = 987
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art very high, great and Infinite."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਨਿਹਾਇਤ ਹੀ ਬੁਲੰਦ, ਵੱਡਾ ਅਤੇ ਬੇਅੰਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are lofty and high, utterly great and infinite."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ  ਬਡਾ ਊਚਾ ਹੈਂ ਔ ਬਹੁਤ ਜੋ ਬ੍ਰਹਮਾਦੀ ਸਾਮਰਥ ਹੈਂ ਤਿਨੋਂ ਸੇ ਵੀ ਤੂੰ ਅਪਾਰ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਤੂੰ ਉੱਚਾ ਹੈਂ, ਤੂੰ ਵੱਡਾ ਹੈਂ, ਤੂੰ ਬੇਅੰਤ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂਚੌ = ਵੱਡਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aun yo, que cometo errores todo el tiempo,"