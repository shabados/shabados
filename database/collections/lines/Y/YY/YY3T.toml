data = "This powerful hero known by the name of Vigyan (Science)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨਿਡਰ ਸੂਰਮੇ ਦਾ ਨਾਂ 'ਬਿਗ੍ਯਾਨ' ਹੈ। ਉਸ ਨੂੰ ਅਤਿ ਬਲਵਾਨ ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ।"