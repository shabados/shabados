[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੋਰਤੁ ਭਗਤਿ; ਨ ਪਾਏ ਕੋਈ ॥"
page = 122
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By no others means the Lord's devotional service can any one obtain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਹੋਰਸ ਜਰੀਏ ਨਾਲ ਸਾਹਿਬ ਦੀ ਪ੍ਰੇਮ-ਮਈ ਸੇਵਾ ਕੋਈ ਜਣਾ ਪਰਾਪਤ ਨਹੀਂ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This devotional worship is not obtained by any other means."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਉਪਾਇ ਕਰ ਭਗਤੀ ਕੋਈ ਨਹੀਂ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਤੋਂ ਬਿਨਾਂ) ਕਿਸੇ ਭੀ ਹੋਰ ਤਰੀਕੇ ਨਾਲ ਕੋਈ ਮਨੁੱਖ ਪ੍ਰਭੂ ਦੀ ਭਗਤੀ ਪ੍ਰਾਪਤ ਨਹੀਂ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੋਰਤੁ = ਕਿਸੇ ਹੋਰ ਤਰੀਕੇ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a través de ninguna otra Alabanza, el Señor puede ser obtenido."