[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਤਿ ਹੀ ਚੂਕ ਮੋ ਤੇ ਭਈ; ਛਿਮੀਯੈ ਸੋ ਮਹਾਰਾਜ ॥੮੩੪॥"
page = 379

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O Lord! I have greatly and extremely erred, forgive me for this.834."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਕੋਲੋਂ ਵੱਡੀ ਭੁਲ ਹੋ ਗਈ ਹੈ, ਹੇ ਮਹਾਰਾਜ! (ਮੈਨੂੰ) ਖਿਮਾ ਕਰ ਦਿਓ ॥੮੩੪॥"