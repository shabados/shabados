[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੇ ਚਰਣ ਊਪਰਿ ਬਲਿ ਜਾਈ ॥"
page = 628
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto the Guru's feet, I am a sacrifice."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਪੈਰਾਂ ਉਤੋਂ ਮੈਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to the Guru's Feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰੋਂ ਕੇ ਚਰਨੋਂ ਪਰ ਸੇ ਬਲਿਹਾਰਨੇ ਜਾਈਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੈਂ (ਆਪਣੇ) ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਤੋਂ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਲਿ ਜਾਈ = ਬਲਿ ਜਾਈਂ, ਮੈਂ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi ser en sacrificio a los Pies del Guru;"