[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਲਉ ਗੁਪਾਲ; ਨੀਸਾਨੁ ਬਜਾਈ ॥੩॥"
page = 1164
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by which I shall meet Lord with the beat of drum."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੁਆਰਾ ਮੈਂ ਆਪਣੇ ਪ੍ਰਭੂ ਨੂੰ ਵਜਦੇ ਨਗਾਰੇ ਮਿਲ ਪਵਾਂਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I will meet with my Lord by the beat of the drum. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਰਾਮ ਨਾਮ ਰੂਪੀ (ਨੀਸਾਨੁ) ਨਗਾਰਾ ਬਜਾਇ ਕਰ ਗੁਪਾਲ ਕੋ ਮਿਲੋਂਗੀ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਮੈਂ ਲੋਕਾਂ ਦੀ ਨਿੰਦਾ ਵਲੋਂ ਬੇ-ਪਰਵਾਹ ਹੋ ਕੇ ਆਪਣੇ ਪ੍ਰਭੂ ਨੂੰ ਮਿਲ ਰਹੀ ਹਾਂ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਉ = ਮੈਂ ਮਿਲ ਰਹੀ ਹਾਂ। ਨੀਸਾਨੁ ਬਜਾਈ = ਢੋਲ ਵਜਾ ਕੇ, ਲੋਕਾਂ ਦੀ ਨਿੰਦਾ ਵਲੋਂ ਬੇ-ਪਰਵਾਹ ਹੋ ਕੇ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que ahora me encuentro con Él en cada latido de mi corazón. (3)"