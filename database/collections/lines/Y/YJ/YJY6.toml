[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਰਿਧੀ ਸਿਧੀ ਜੋਗ ਭੋਗ; ਅਭਰਣ ਸੀਗਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Riddhis, siddhis (miraculous powers), renunciations, enjoyments, ornaments. embellishments;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਰਿੱਧੀਆਂ (ਕਈ) ਸਿੱਧੀਆਂ ਦੇ ਜੋਗ (ਮਿਲਾਪ) ਤੇ ਭੋਗ ਕਈ ਗਹਿਣਿਆਂ ਦੇ ਸ਼ਿੰਗਾਰ।"