[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਿਹ ਭਾਵੈ ਤਾ ਕੋ ਧਨੁ ਦੇਵੈ ॥"
page = 956

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She would sit down in the balcony to watch the dance and shower wealth indiscriminately."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜਿਸ ਨੂੰ ਚਾਹੁੰਦੀ, ਉਸ ਨੂੰ ਧਨ ਪ੍ਰਦਾਨ ਕਰਦੀ ਸੀ।"