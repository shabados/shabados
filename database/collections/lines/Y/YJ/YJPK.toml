[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਉ ਦਰਸਨ ਕੀ; ਕਰਉ ਸਮਾਇ ॥"
page = 721
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "For Thy sight, I make a mumper's call."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਦੀਦਾਰ ਲਈ ਮੈਂ ਮੰਗਤੇ ਵਾਲੀ ਸਦਾਅ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I long for the Blessed Vision of Your Darshan."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਕਾਲ ਪੁਰਖ ਜੀ! ਮੈਂ ਸਦਾ ਤੇਰੇ ਦਰਸਨ ਕੀ (ਸਮਾਇ) ਇਛਾ ਕਰਤਾ ਹਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਮੈਂ ਤੇਰੇ ਦੀਦਾਰ ਦੀ ਸਦਾਅ ਕਰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਉ = ਤੇਰਾ। ਕਰਉ = ਮੈਂ ਕਰਦਾ ਹਾਂ। ਸਮਾਇ = ਸਦਾਅ, ਆਵਾਜ਼ਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pido sólo para que me pueda iluminar con la Visión de tu Darshan."