data = "ਪਾਨ ਡਰਾਇ ਕਸੁੰਭੜੋ ਰੂਰੋ ॥੨੧॥"
page = 962

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Also obtained wine, marijuana and weeds and chewed beetle-nuts laden with safflowers.(21)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੁੰਦਰ ਕਸੁੰਭੜੇ ਦੇ ਫੁਲ ਪਾ ਕੇ ਪਾਨ ਤਿਆਰ ਕਰਵਾਏ ॥੨੧॥"