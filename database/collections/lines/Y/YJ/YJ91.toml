[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਸਟਾ ਅੰਦਰਿ ਕੀਟ ਸੇ; ਪਇ ਪਚਹਿ ਵਾਰੋ ਵਾਰ ॥"
page = 85
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They fall as worms into ordure and perish over and over again there-in."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਟੱਟੀ ਵਿੱਚ ਕਿਰਮ ਹੋ ਕੇ ਪੈਦੇ ਹਨ। ਅਤੇ ਮੁੜ ਮੁੜ ਕੇ ਉਸੇ ਅੰਦਰ ਬਿਨਸਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Like worms, they live in manure, and in it, they die over and over again."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਫੁਨਾ: ਬਿਸਟਾ ਬੀਚ ਕੇ ਕੀਟੋਂ ਸਮਾਨ ਵਹੁ ਮੂਰਖ ਲੋਗ ਵਾਰੰਵਾਰ ਜੋਨੀਓਂ ਮੇਂ ਪੈ ਕਰ ਜਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਬਿਸ਼ਟੇ ਵਿਚ ਪਏ ਹੋਏ ਕੀੜੇ ਵਿਲੂੰ ਵਿਲੂੰ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀਟ = ਕੀੜੇ। ਪਇ = ਪੈ ਕੇ। ਵਾਰੋ ਵਾਰ = ਮੁੜ ਮੁੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "vivieron en la mugre y como gusanos perdieron la vida."