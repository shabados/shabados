[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਦਰਸਨਿ; ਉਧਰੈ ਸੰਸਾਰਾ ॥"
page = 361
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through Guru's way the world is saved,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਰਸਤੇ ਦੁਆਰਾ ਜੱਗ ਪਾਰ ਉੱਤਰ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Guru's system, the world is saved,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਗੁਰੋਂ ਕੇ ਦਰਸਨ ਕਰ ਸੰਸਾਰ ਸੇ ਉਧਰ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਗੁਰੂ ਦੇ ਸ਼ਾਸਤ੍ਰ ਦੀ ਬਰਕਤਿ ਨਾਲ (ਵਿਕਾਰਾਂ ਤੋਂ) ਬਚ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਧਰੈ = (ਵਿਕਾਰਾਂ ਤੋਂ) ਬਚ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A través del Sistema del Guru el mundo entero es salvado,"