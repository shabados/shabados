[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੂਝੀ ਨਹੀ; ਕਾਜੀ ਅੰਧਿਆਰੈ ॥੩॥"
page = 870
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Even then the blind Qazi could comprehend it not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਭੀ ਅੰਨ੍ਹਾ ਕਾਜ਼ੀ ਇਸ ਨੂੰ ਸਮਝ ਨਾਂ ਸਕਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Qazi could not understand it; he was blind. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੌ ਭੀ ਕਾਜੀ ਨੇ (ਅੰਧਿਆਰੈ) ਮੂਰਖਪਨੇ ਮੇਂ ਸਮਝੀ ਨਹੀਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਕਾਜ਼ੀ ਨੂੰ (ਤੁਅੱਸਬ ਦੇ) ਹਨੇਰੇ ਵਿਚ ਇਹ ਸਮਝ ਹੀ ਨਹੀਂ ਆਈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਧਿਆਰੈ = ਹਨੇਰੇ ਵਿਚ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero el Quazi, en su ceguera, no puede entender, pues está ciego. (3)"