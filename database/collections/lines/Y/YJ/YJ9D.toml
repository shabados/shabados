[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਈ ਆਸ, ਨ ਪੁੰਨੀਆ; ਨਿਤ ਪਰ ਮਲੁ ਹਿਰਤੇ ॥"
page = 317
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "No desire of his is fulfilled. He ever steals other's filth (slander other)."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਕੋਈ ਭੀ ਉਮੀਦ ਪੂਰੀ ਨਹੀਂ ਹੁੰਦੀ ਉਹ ਹਮੇਸ਼ਾਂ ਹੋਰਨਾ ਦੀ ਗੰਦਗੀ ਚੋਰੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "None of his desires are fulfilled; he continually steals the filth of others."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਿਤ (ਪਰਮਲੁ) ਪਰਾਈ ਪਾਪੋਂ ਰੂਪੀ ਮੈਲ ਕੋ ਨਿੰਦਿਆ ਕਰ (ਹਿਰਤੇ) ਲੇਤੇ ਥੇ, ਤਿਨ ਕੀ ਕੋਈ ਆਸ ਭੀ ਪੂਰੀ ਨ ਹੋਈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਪਰਾਈ ਮੈਲ ਚੁਰਾਉਂਦੇ ਦੀ (ਭਾਵ, ਨਿੰਦਾ ਕਰ ਕੇ ਸਦਾ ਪਰਾਏ ਪਾਪ ਸਿਰ ਤੇ ਲੈਂਦੇ ਦੀ) ਕੋਈ ਆਸ ਭੀ ਪੂਰੀ ਨਹੀਂ ਹੁੰਦੀ (ਲੋਕ ਤੇ ਪਰਲੋਕ ਦੋਵੇਂ ਜ਼ਾਇਆ ਜਾਂਦੇ ਹਨ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੁੰਨੀਆ = ਸਿਰੇ ਚੜ੍ਹੀ, ਪੂਰੀ ਹੋਈ। ਪਰ ਮਲੁ = ਪਰਾਈ ਮੈਲ। ਹਿਰਤੇ = ਚੁਰਾਂਦਿਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Denigrando a otros, uno come y come mugre, y debido a la insatisfacción y a la ingratitud,"