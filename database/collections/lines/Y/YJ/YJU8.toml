[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਉ ਸਾਜਨ ਸੰਤ ਮੀਤ ਪਿਆਰੇ ॥"
page = 104
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Come, my dear friends, saints and intimates."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਓ, ਮੇਰੇ ਸਨੇਹੀ ਯਾਰੋ, ਸਾਧੂਓ ਅਤੇ ਮਿਤਰੋ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Come, dear friends, Saints and companions:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ ਤਨ ਬਾਣੀ ਕੇ ਮਿਤ੍ਰ ਸੰਤ ਜਨੋਂ! ਆਓ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪਿਆਰੇ ਮਿੱਤ੍ਰੋ! ਹੇ ਸੰਤ ਜਨੋ! ਹੇ ਮੇਰੇ ਸੱਜਣੋ! ਆਓ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਿ = ਮਿਲ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vengan mis amigos, mis compañeros, mis amores,"