[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਟਾਨੇ ਸਭਿ ਕਲਿ ਕਲੇਸ ॥"
page = 898
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All my strifes and sufferings have ended,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸਾਰੇ ਝਗੜੇ ਤੇ ਦੁਖੜੇ ਮੁੱਕ ਗਏ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All my troubles and sufferings have been taken away;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਤੇ ਕਲਪਨਾ ਦੇਨੇ ਵਾਲੇ ਪੰਚ ਕਲੇਸ ਸਭ ਮਿਟ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੇ ਮਿਲਾਪ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਸਾਰੇ (ਮਾਨਸਕ) ਝਗੜੇ ਤੇ ਦੁੱਖ ਮਿਟ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭਿ = ਸਾਰੇ। ਕਲਿ = ਝਗੜੇ। ਕਲੇਸ = ਦੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Toda pena y tristeza son borradas,"