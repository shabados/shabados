[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਟੀ ਤੇਲੁ, ਦੀਵਾ ਹੋਇ ਬਲਣਾ ॥੧੭॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They, in the form of lamp becoming wick and oil, burn themselves (for lighting others)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਵੱਟੀ ਤੇਲ ਦੇ ਦੀਵੇ ਵਾਂਙੂ ਬਲਦੇ ਹਨ।"