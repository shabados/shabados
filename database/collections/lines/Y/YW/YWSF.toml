[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਓਹੁ ਬੈਸਨੋ; ਪਰਮ ਗਤਿ ਪਾਵੈ ॥੨॥"
page = 274
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak such a Vaishnav obtains the supreme salvation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਇਹੋ ਜਿਹਾ ਵੈਸ਼ਨਵ ਮਹਾਨ ਮੁਕਤੀ ਨੂੰ ਪਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, such a Vaishnaav obtains the supreme status. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਵਹੁ ਵੈਸਨਵ ਭਗਤ ਪਰਮਗਤੀ ਕੌ ਪਾਵਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਵੈਸ਼ਨੋ ਉੱਚਾ ਦਰਜਾ ਹਾਸਲ ਕਰਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal Vishnuita vive en Estado de Éxtasis.(2)"