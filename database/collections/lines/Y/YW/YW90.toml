[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਣਤ ਗਣੀਐ; ਸਹਸਾ ਦੁਖੁ ਜੀਐ ॥"
page = 904
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By making calculations, doubt and sorrow enter the mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲੇਖਾ ਪੱਤਾ ਕਰਨ ਦੁਆਰਾ, ਸੰਦੇਹ ਅਤੇ ਸ਼ੱਕ ਚਿੱਤ ਅੰਦਰ ਪ੍ਰਵੇਸ਼ ਕਰ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Making his calculations, cynicism and suffering afflict his soul."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਗਿਣਤੀਆਂ ਗਿਣੀਐ ਤੋ ਜੀਉ ਕੋ ਸੰਸਿਆਂ ਕਾ ਦੁਖੁ ਹੀ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਉਂ ਜਿਉਂ ਸ਼ੁਭ ਅਸ਼ੁਭ ਮੁਹੂਰਤਾਂ ਦੇ ਲੇਖੇ ਗਿਣਦੇ ਰਹੀਏ ਤਿਉਂ ਤਿਉਂ ਜਿੰਦ ਨੂੰ ਸਦਾ ਸਹਿਮ ਦਾ ਰੋਗ ਲੱਗਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਸਾ = ਸਹਿਮ। ਜੀਐ = ਜਿੰਦ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cálculos acerca del futuro crean duda y tristeza en el interior,"