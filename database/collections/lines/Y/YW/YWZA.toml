[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਹ ਤਹ ਕਰਨ ਕੁਕਰਮ; ਪ੍ਰਜਾ ਰਾਜਾ ਨਰ ਨਾਰੀ ॥"
page = 564

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And because of such conduct of the king and his subject and the character of men and women"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਕਿਥੇ ਰਾਜਾ ਅਤੇ ਪ੍ਰਜਾ, ਔਰਤਾਂ ਅਤੇ ਮਰਦ ਕੁਕਰਮ ਕਰਨ ਲਗ ਗਏ ਹਨ।"