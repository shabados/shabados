[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਦਰੁ. ਕੈਸੇ ਛੋਡੀਐ; ਜੋ ਦਰੁ ਐਸਾ ਹੋਇ ॥੬੬॥"
page = 1367
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "how can that kind of door be left, which is such a type?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਸ ਬੂਹੇ ਨੂੰ ਕਿਸ ਤਰ੍ਹਾਂ ਛਡ ਸਕਦਾ ਹਾਂ ਜਿਹੜਾ ਐਹੋ ਜੇਹੀ ਕਿਸਮ ਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- how can I leave such a door as that? ||66||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਜੋ ਐਸਾ ਅਰੋਕ ਦਰ ਹੋਵੇ ਤਿਸ ਦਰ ਕੋ ਕਿਸ ਪ੍ਰਕਾਰ ਛੋਡੀਏ? ਭਾਵ ਯੇਹ ਸਦਾ ਸੰਗ ਹੀ ਕਰਨਾ ਯੋਗ ਹੈ॥੬੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਦਰਵਾਜ਼ਾ ਅਜੇਹਾ ਹੈ ਉਹ ਦਰ ਕਦੇ ਛੱਡਣਾ ਨਹੀਂ ਚਾਹੀਦਾ ॥੬੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈਸੇ ਛੋਡੀਐ = ਛੱਡਣਾ ਨਹੀਂ ਚਾਹੀਦਾ। ਐਸਾ = ਅਜੇਹਾ। ਦਰੁ = ਦਰਵਾਜ਼ਾ, ਪ੍ਰਭੂ ਦੇ ਚਰਨ, ਪ੍ਰਭੂ ਦਾ ਆਸਰਾ ॥੬੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a través de la cual la gente no para de ir y venir?(66)"