[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨਸੇ ਦੁਖ ਸਬਾਇਆ ॥੧॥"
page = 629
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All my sufferings are ended."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸਾਰੇ ਦੁੱਖੜੇ ਮੁੱਕ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All my pains and sufferings are over. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੁਖ ਸਭੀ ਨਸ਼ਟ ਭਏ ਹੈਂ ਔਰ ਸਭ ਮੇਂ ਪਰਮੇਸ਼ਰ ਕੋ ਆਇਆ ਹੂਆ ਜਾਨਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਸਾਰੇ ਹੀ ਦੁੱਖ ਦੂਰ ਹੋ ਗਏ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਬਾਇਆ = ਸਾਰੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "todas mis aflicciones han pasado. (1)"