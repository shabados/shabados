[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਹੇ ਕਉ ਤੁਝੁ; ਇਹੁ ਮਨੁ ਲਾਇਆ ॥"
page = 939
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Q. 28: With what hast thou attached this mind of thine?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰ. 28: ਤੂੰ ਆਪਣੇ ਇਸ ਮਨ ਨੂੰ ਕਿਸ ਦੇ ਨਾਲ ਜੋੜਿਆ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With what have you linked your mind?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਸ ਵਸਤੂ ਮੇਂ ਤੁਮ ਨੇ ਇਸ ਮਨ ਕੋ ਲਗਾਇਆ ਹੈ ੨ ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣਾ ਇਹ ਮਨ ਕਿਸ ਵਿਚ ਜੋੜਿਆ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਹੇ ਕਉ = ਕਿਸ ਨਾਲ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en quién estás entonado y para qué?"