[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਨਾਵੈ ਮੁਕਤਿ; ਨ ਪਾਵੈ ਕੋਈ ॥"
page = 1046
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Name, none attains emancipation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੇ ਬਾਝੋਂ, ਕਿਸੇ ਨੂੰ ਭੀ ਮੋਖਸ਼ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Name, no one attains liberation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਿਨਾਂ ਨਾਮ ਸੇ ਮੁਕਤੀ ਕੋਈ ਨਹੀਂ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ, ਨਾਮ (ਜਪਣ) ਤੋਂ ਬਿਨਾ ਕੋਈ ਮਨੁੱਖ (ਲੋਭ ਆਦਿਕ ਵਿਕਾਰਾਂ ਤੋਂ) ਖ਼ਲਾਸੀ ਨਹੀਂ ਪਾ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਕਤਿ = (ਲੋਭ ਆਦਿਕ ਵਿਕਾਰਾਂ ਤੋਂ) ਖ਼ਲਾਸੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, sin el Nombre, no hay nadie que esté emancipado,"