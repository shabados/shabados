[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਿਤੜੇ ਸੂਦ ਸਦਾਇਏ; ਕਿਤੜੇ ਕਾਇਥ ਲਿਖਣਹਾਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many are Sud and many are kaith, the bookkeepers."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਈ ਸੂਦ ਸਦਾਉਂਦੇ ਹਨ, ਕਈ ਕਾਇਥ ਮੁਨਸ਼ੀ ਲੋਕ (ਜੋ ਫਾਰਸੀ ਪੜ੍ਹੇ ਹੋਏ ਹਨ)।"