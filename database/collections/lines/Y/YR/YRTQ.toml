[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਹੁ ਬਿਧਿ; ਬੇਦ ਪਾਠ ਸਭਿ ਸੋਧਾ ॥"
page = 1019
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "inspite of reciting and scrutinizing all the Vedas in various ways,."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਵੇਂ ਉਹ ਸਾਰਿਆਂ ਵੇਦਾਂ ਨੂੰ ਅਨੇਕਾਂ ਤਰੀਕਿਆਂ ਨਾਲ ਪੜ੍ਹਦੇ ਅਤੇ ਘੋਖਦੇ ਹੋਣ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and all those who study and recite the Vedas in so many ways."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਬਿਧੋਂ ਕਰਿ ਬੇਦ ਭੀ ਸਭ ਭਾਂਤ ਸੋਧ ਕਰਿ ਪਾਠ ਕੀਏ ਹੈਂ, ਸੋ ਇਹ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਭਾਵੇਂ ਉਸ ਨੇ ਕਈ ਤਰੀਕਿਆਂ ਨਾਲ ਸਾਰੇ ਵੇਦ-ਪਾਠ ਸੋਧੇ ਹੋਣ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਹੁ ਬਿਧਿ = ਕਈ ਤਰੀਕਿਆਂ ਨਾਲ। ਸਭਿ = ਸਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y esos textos declaran que apegarse al hogar lo hace a uno vivir en el sufrimiento, con enojos y tristezas,"