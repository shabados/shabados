[[content]]
assets = ["DGDG", "DDTK"]
type = "primary"
data = "ਜੱਛ ਭੁਜੰਗ ਸੁ ਦਾਨਵ ਦੇਵ; ਅਭੇਵ ਤੁਮੈ ਸਭ ਹੀ ਕਰ ਧਿਆਵੈ ॥"
page = 37

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Yakshas, serpents, demons and gods meditate on Thee considering Thee as Indiscriminant."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਯਕਸ਼, ਸੱਪ, ਦੈਂਤ ਅਤੇ ਦੇਵਤੇ ਆਦਿ ਸਾਰੇ ਤੁਹਾਨੂੰ ਅਭੇਦ ਕਰ ਕੇ ਧਿਆਉਂਦੇ ਹਨ।"

