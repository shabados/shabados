[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨੰਦ ਜਸੋਮਤਿ ਪੰਡੁ ਕੇ ਪੁਤ੍ਰਨ; ਸੰਗਿ ਮਿਲੇ, ਅਤਿ ਹੇਤੁ ਬਢਾਏ ॥"
page = 543

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Nand and Yashoda were also pleased on meeting the Pandavas"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨੰਦ, ਜਸੋਧਾ, ਪੰਡੁ ਦੇ ਪੁੱਤਰਾਂ (ਅਰਥਾਤ ਪੰਜ ਪਾਂਡਵਾਂ) ਨਾਲ ਮਿਲ ਕੇ ਬਹੁਤ ਸਨੇਹ ਪ੍ਰਗਟਾਇਆ।"