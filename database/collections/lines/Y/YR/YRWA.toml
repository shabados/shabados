[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵਾ ਗਉਣੁ; ਕੀਆ ਕਰਤਾਰਿ ॥"
page = 842
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Coming and going the Creator Lord has ordained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਉਣਾ ਅਤੇ ਜਾਣਾ ਸਿਰਜਣਹਾਰ ਸੁਆਮੀ ਨੇ ਹੁਕਮ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Coming and going were created by the Creator Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਤੈਸੇ ਹੀ ਸਾਰੇ ਸੰਸਾਰ ਕਾ ਕਰਤਾਰ ਨੇ ਆਵਾਗਵਨ ਕੀਆ ਹੈ, ਭਾਵ ਯਹਿ ਕਿ ਚੌਰਾਸੀ ਮੇਂ ਜੀਵ ਭਰਮਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਰਤਾਰ ਨੇ (ਆਪ ਹੀ ਜੀਵਾਂ ਵਾਸਤੇ) ਜਨਮ ਮਰਨ ਦਾ ਗੇੜ ਬਣਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਵਾਗਉਣ = ਜਨਮ ਮਰਨ ਦਾ ਗੇੜ। ਕਰਤਾਰਿ = ਕਰਤਾਰ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así el mundo fluye y va y viene según la Voluntad del Señor Creador."