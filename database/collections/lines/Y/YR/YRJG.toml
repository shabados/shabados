[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤਾ ਟੇਕ ਤੁਮਾਰੀ ਸੁਆਮੀ; ਤੂੰ ਸੰਤਨ ਕਾ ਸਹਾਈ ॥"
page = 381
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints have thine support, O Lord and to the saints thou art the succourer."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਨੂੰ ਤੇਰਾ ਆਸਰਾ ਹੈ, ਹੇ ਪ੍ਰਭੂ! ਸਾਧੂਆਂ ਦਾ ਤੂੰ ਹੀ ਸਹਾਇਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Saints have Your Support, O Lord and Master; You are the Saints' Help and Support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਕਾਲ ਪੁਰਖ! ਸੰਤੋਂ ਕੋ ਤੁਮਾਰੀ ਟੇਕ ਹੈ ਔਰ ਤੁਮਹੀ ਸੰਤੋਂ ਕੇ ਸਹਾਯਕ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਲਕ-ਪ੍ਰਭੂ! ਤੇਰੇ ਸੰਤਾਂ ਨੂੰ (ਜੀਵਨ-ਅਗਵਾਈ ਵਾਸਤੇ) ਸਦਾ ਤੇਰਾ ਆਸਰਾ ਰਹਿੰਦਾ ਹੈ, ਤੂੰ (ਸੰਤਾਂ ਦਾ ਜੀਵਨ ਉੱਚਾ ਕਰਨ ਵਿਚ) ਮਦਦਗਾਰ ਭੀ ਬਣਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਾਈ = ਮਦਦਗਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues Tus Santos, oh Señor, buscan Tu Refugio y Tu eres el Protector de los Santos."