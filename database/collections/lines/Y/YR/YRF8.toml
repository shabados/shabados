[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੁਖਿ ਬੇਦ ਚਤੁਰ ਪੜਤਾ ॥੨॥"
page = 873
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "to recite the four Vedas by heart,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚਾਰੇ ਹੀ ਵੇਦਾਂਦਾ ਮੂੰਹ-ਜ਼ਬਾਨੀ ਪਾਠ ਕਰਨਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "reciting the four Vedas by heart;||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਚਾਰੇ ਬੇਦ ਮੁਖਿ ਕੰਠ ਸੇ ਪੜਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਮੂੰਹੋਂ ਚਾਰੇ ਵੇਦ (ਜ਼ਬਾਨੀ) ਪੜ੍ਹਦਾ ਹੋਵੇ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਖਿ = ਮੂੰਹੋਂ। ਚਤੁਰ = ਚਾਰ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ási cerca de Kashi y recita con su corazón los cuatro Vedas.(2)"