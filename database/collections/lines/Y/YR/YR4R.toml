[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਗੁਰਿ. ਭਰਮੁ ਚੁਕਾਇਆ ॥੪॥"
page = 738
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, The Guru has dispelled my doubt."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਗੁਰੂ ਨੇ ਮੇਰਾ ਸੰਦੇਹ ਦੂਰ ਕਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, the Guru has dispelled my doubt. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਜਬ ਗੁਰੋਂ ਨੇ ਭ੍ਰਮ ਦੂਰ ਕੀਆ ਹੈ॥੪॥☬ਇਸੀ ਕੋ ਫੇਰ ਸਫੁਟ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਗੁਰੂ ਨੇ ਮੇਰੀ ਭਟਕਣਾ ਦੂਰ ਕਰ ਦਿੱਤੀ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ। ਚੁਕਾਇਆ = ਦੂਰ ਕਰ ਦਿੱਤਾ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues el Señor ha destruido su duda. (4)"