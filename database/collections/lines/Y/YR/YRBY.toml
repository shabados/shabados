data = "ਜਦ ਮਨੁੱਖ ਦਾ ਦਿਲ ਰੱਬ ਦੇ ਸਿਮਰਨ ਦੇ ਰਾਹ ਪੈ ਗਿਆ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਚੂੰ ਦਿਲਿ ਬੰਦਾ ਬਜ਼ਿਕਰਸ਼ ਰਾਹ ਯਾਫ਼ਤ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Become legitimate recipients of his bountiful blessings. (132)"