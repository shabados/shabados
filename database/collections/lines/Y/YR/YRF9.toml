data = "ਸਦਾ ਸਦਾ ਰਾਤ ਦਿਨ ਸਿਮਰਨੁ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਦਿਨ ਰਾਤ, ਹਰ ਵੇਲੇ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Contempla a Dios siempre y para siempre,"