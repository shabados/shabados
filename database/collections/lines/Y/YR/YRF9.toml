data = "ਸਦਾ ਸਦਾ ਸਿਮਰਿ ਦਿਨੁ ਰਾਤਿ ॥"
page = 971
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever, ever, day and night,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਮੇਸ਼ਾ, ਹਮੇਸ਼ਾਂ ਹੀ ਤੂੰ ਦਿਹੁੰ ਰੈਣ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forever and ever, remember Him, day and night,"

[[content]]
assets = ["NKFT"]
type = "translation"
