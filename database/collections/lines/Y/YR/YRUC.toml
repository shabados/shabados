[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਿਰੇ ਮੂਰਛਨਾ ਹ੍ਵੈ ਧਰਨਿ; ਲਗੇ ਬਿਨਾ ਸਰ ਚੋਟਿ ॥੧੨॥"
page = 865

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That they, without any hits, sacrificed their lives.(l2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਬਿਨਾ ਬਾਣ ਲਗੇ ਧਰਤੀ ਉਤੇ ਮੂਰਛਿਤ ਹੋ ਕੇ ਡਿਗ ਪਏ ॥੧੨॥"