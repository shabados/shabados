[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕਾ ਦੋਖੀ; ਕਿਤੈ ਕਾਜਿ. ਨ ਪਹੂਚੈ ॥"
page = 280
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints' calumniator can accomplish task."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਦਾ ਨਿੰਦਕ ਕੋਈ ਕੰਮ ਨੇਪਰੇ ਨਹੀਂ ਚਾੜ੍ਹ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slanderer of the Saint cannot accomplish his tasks."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਸੰਤ ਕਾ ਦੋਸੀ ਕਿਸੀ ਕਾਰਜ ਕੌ ਪਹੁੰਚ ਨਹੀਂ ਸਕਤਾ ਹੈ, ਅਰਥਾਤ ਤਿਸ ਕਾ ਕੋਈ ਕਾਰਜ ਪੂਰਨ ਨਹੀਂ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਕੰਮ ਵਿਚ ਨੇਪਰੇ ਨਹੀਂ ਚੜ੍ਹਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਤੈ ਕਾਜਿ = ਕਿਸੇ ਕੰਮ ਕਾਜ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y nunca podrá concluir nada."