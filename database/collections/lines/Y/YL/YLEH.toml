[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਠਾਕੁਰ; ਹੋਏ ਆਪਿ ਦਇਆਲ ॥"
page = 499
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself has become merciful."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਖੁਦ ਮਿਹਰਬਾਨ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord and Master Himself has become merciful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਠਾਕਰ ਜੀ ਆਪ ਦਿਆਲੂ ਭਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਜੀਵਾਂ ਉਤੇ ਪ੍ਰਭੂ ਜੀ ਆਪ ਦਇਆਵਾਨ ਹੁੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਕੁਰ = ਮਾਲਕ-ਪ੍ਰਭੂ ਜੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Maestro Benéfico tiene Misericordia de mí."