[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲੋਥ ਕ੍ਰਿਪਾਲਹਿ ਕੀ ਨਮਿਤ ਕੋਪਿ ਪਰੇ ਅਰਰਾਇ ॥੫੯॥"
page = 69

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors of Katoch came with great rage in order ot take away the dead body of their Raja Kirpal.59."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕ੍ਰਿਪਾਲ ਚੰਦ ਦੀ ਲੋਥ ਲੈਣ ਲਈ ਵੈਰੀ-ਰਾਜੇ (ਭੀਮ ਚੰਦ ਆਦਿ) ਕ੍ਰੋਧਵਾਨ ਹੋ ਗਏ ॥੫੯॥"