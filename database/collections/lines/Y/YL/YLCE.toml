[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੈ ਨਿਵਾਰਿ, ਨਿਰਭੈ ਹੁਇ ਕਹੀਐ ॥੧੧੮੮॥"
page = 796

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Avneeshani”, add the word “mathani” and know fearlessly all the names of Tupak.1188."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਭੈ ਨੂੰ ਤਿਆਗ ਕੇ ਨਿਡਰ ਹੋ ਕੇ ਡਟ ਕੇ ਕਹੋ ॥੧੧੮੮॥"