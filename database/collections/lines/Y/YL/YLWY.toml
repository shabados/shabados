[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੀ ਟੇਕ; ਰਹਹੁ ਦਿਨੁ ਰਾਤਿ ॥"
page = 864
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Day and night I lean, on the Guru's support."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਰਾਤ ਮੈਨੂੰ ਗੁਰਦੇਵ ਜੀ ਦਾ ਹੀ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I lean upon the Support of the Guru, day and night."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਤੇ ਗੁਰੋਂ ਕੀ ਟੇਕ ਮੇਂ ਰਾਤ ਦਿਨ ਰਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਉਸ ਗੁਰੂ ਦੇ ਆਸਰੇ ਦਿਨ ਰਾਤ ਟਿਕਿਆ ਰਹੁ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ten al Guru como tu Único Soporte,"