[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੋਹੁ ਕ੍ਰਿਪਾਲ ਸੁਆਮੀ ਮੇਰੇ; ਸੰਤਾਂ ਸੰਗਿ ਵਿਹਾਵੇ ॥"
page = 961
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Be Thou merciful, O my Lord, that I may pass my life in the society of saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮਿਹਰਬਾਨ ਥੀ ਵੰਝ, ਹੇ ਮੇਰੇ ਮਾਲਕ ਹਰੀ! ਤਾਂ ਜੋ ਮੇਰੀ ਜ਼ਿੰਦਗੀ ਸਤਿਸੰਗਤ ਅੰਦਰ ਬਤੀਤ ਹੋਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Be Merciful, O my Lord and Master, that I may pass my life in the Society of the Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸੁਆਮੀ! ਮੇਰੇ ਪਰ ਕ੍ਰਿਪਾਲ ਹੋ ਕੇ ਇਹੁ ਦਾਨੁ ਦੇਵੋ, ਜੋ ਮੇਰੀ ਅਵਸਥਾ ਸੰਤਾਂ ਕੇ ਸੰਗ ਮੈਂ ਬੀਤੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸੁਆਮੀ! ਮੇਰੇ ਉਤੇ ਦਇਆ ਕਰ, ਮੇਰੀ ਉਮਰ ਸੰਤਾਂ ਦੀ ਸੰਗਤ ਵਿਚ ਰਹਿ ਕੇ ਬੀਤੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਿਹਾਵੇ = ਬੀਤ ਜਾਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, Dios, ten Compasión de mí para que pase mis días en la Sociedad de los Santos,"