[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਨਿਰਸੰਦੇਹ ਉਹ ਨਿਰੰਜਨ ਅਤੇ ਨਿਰੰਕਾਰ ਦਾ ਹੀ ਰੂਪ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਹਮਾਨਾ ਨਿਰੰਜਨ ਨਿਰੰਕਾਰ ਰੂਪ ॥੧॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Without doubt, he is the image of the Formless and the Immaculate. (1)"