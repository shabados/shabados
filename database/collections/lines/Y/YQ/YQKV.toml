[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੁਭੀ ਰਹੀ ਸ੍ਰੁਤਿ ਪ੍ਰਭੁ ਚਰਨਨ ਮਹ ॥"
page = 55

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I had no desire to come, because I was totally absorbed in devotion for the Holy feet of the Lord."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ (ਸਾਡੀ) ਸੁਰਤਿ ਪ੍ਰਭੂ ਦੇ ਚਰਨਾਂ ਵਿਚ ਲਗੀ ਹੋਈ ਸੀ।"