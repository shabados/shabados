[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਧੰਨਾ ਕਰਦਾ ਜੋਦੜੀ; ਮੈ ਭਿ ਦੇਹ ਇਕ ਜੇ ਤੁਧੁ ਭਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Dhanna requested, “O brahman, if you agree kindly give one to me.”"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਹੁਣ) ਧੰਨਾ ਮਿੰਨਤ ਕਰਨ ਲੱਗਾ ਕਿ (ਠਾਕੁਰ) ਮੈਨੂੰ ਭੀ ਦੇਹ ਜੇ ਤੈਨੂੰ ਭਾਵੇ ਹੈ ਤਾਂ।"