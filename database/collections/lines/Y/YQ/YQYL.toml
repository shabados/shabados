[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ ਪਾਰਿ ਉਤਾਰਿਆ ॥੧੩॥"
page = 470
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Showering his benediction, he ferries them across."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਮਿਹਰ ਧਾਰ ਕੇ ਉਹ ਉਨ੍ਹਾਂ ਨੂੰ ਪਾਰ ਕਰ ਦਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Granting His Grace, He carries them across. ||13||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਬੀਚਾਰ ਕੀਆ ਹੈ ਤਿਸ ਕੋ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਸੰਸਾਰ ਸਮੁੰਦਰ ਸੇ ਪਾਰ ਉਤਾਰ ਦੀਆ ਹੈ॥੧੩॥☬ਦੰਭ ਕੀ ਨਿਖੇਧੀ ਮੇਂ ਦ੍ਰਿਸ਼ਟਾਂਤ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੇਰੇ ਸਤਿਗੁਰੂ ਨੇ) ਮਿਹਰ ਕਰ ਕੇ ਮੈਨੂੰ (ਇਸ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਕਰ ਦਿੱਤਾ ਹੈ ॥੧੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "xxx ॥੧੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es por Su Gracia que somos llevados a través. (13)"