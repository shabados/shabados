[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋਊ ਆਇ ਮਨੋਰਥ ਕੈ ਮਨ ਮੈ; ਸਮ ਓਰਨ ਕੀ ਸੋਊ ਹੈ ਗਰ ਗੇ ॥"
page = 373

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The object for which he had come, was defeated"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਦੰਦ ਮਨ ਵਿਚੋਂ (ਬਾਂਹ ਨੂੰ ਕਟਣ ਦੇ) ਮਨੋਰਥ ਨਾਲ ਆਏ ਸਨ, ਉਹ ਗੜਿਆਂ ਵਾਂਗ ਗਲ ਗਏ।"