data = "ਛੜੀਦਾਰ, ਦਰਵਾਨ ਖਲੀਰਾ ॥੧੯॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many stick-holding gatekeepers stand and wait."

