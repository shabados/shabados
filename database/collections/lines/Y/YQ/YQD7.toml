[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਦੋਇ ਜੀਵਤ ਬਚੇ; ਰਨ ਤਜਿ ਗਏ ਪਰਾਇ ॥੧੨੭੩॥"
page = 424

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Two supreme divisions of army and all the five kings were killed and those one or two who survived, left the war-arena and ran away.1273."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਦੋ (ਯੋਧੇ ਜੋ) ਜੀਵਿਤ ਬਚੇ, ਉਹ ਰਣ-ਭੂਮੀ ਨੂੰ ਤਿਆਗ ਕੇ ਚਲੇ ਗਏ ਹਨ ॥੧੨੭੩॥"