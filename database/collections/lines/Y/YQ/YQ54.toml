[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਆਠ ਪਹਰ; ਤਾ ਕਾ ਜਸੁ ਗਾਵੀਜੈ ॥"
page = 269
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, throughout the eight watches (of the day) sing His praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੈ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਅੱਠੇ ਪਹਿਰ ਹੀ ਉਸ ਦੀ ਕੀਰਤੀ ਗਾਇਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, sing His Praises, twenty-four hours a day."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤਿਸੀ ਵਾਹਿਗੁਰੂ ਕਾ ਜਸ ਮਨ ਕਰ ਕੇ ਆਠੋਂ ਪਹਰ ਗਾਵਣਾ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਉਸ ਪ੍ਰਭੂ ਦਾ ਜਸ ਅੱਠੇ ਪਹਰ ਗਾਉਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਾਵੀਜੈ = ਗਾਉਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, medita siempre en Él."