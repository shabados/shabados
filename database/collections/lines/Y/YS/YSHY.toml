[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬ੍ਰਹਮਾ ਬਿਸਨੁ ਮਹੇਸੁ ਦੁਆਰੈ ॥"
page = 1022
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Standing at His door are Brahma, Vishnu and Shiva,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਬੂਹੇ ਤੇ ਖੜੇਤੇ ਹਨ ਬ੍ਰਹਮਾ, ਵਿਸ਼ਨੂੰ ਅਤੇ ਸ਼ਿਵਜੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Brahma, Vishnu and Shiva stand at His Door;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮਾਂ, ਬਿਸਨ, ਸਿਵ, ਤੀਨ ਹੀ ਦੇਵਤਾ ਤੇਰੇ ਦੁਆਰੇ ਪਰ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਵੱਡੇ ਵੱਡੇ ਦੇਵਤੇ ਭੀ ਪ੍ਰਭੂ ਦੇ) ਦਰ ਤੇ ਕੀਹ ਬ੍ਰਹਮਾ, ਕੀਹ ਵਿਸ਼ਨੂੰ ਤੇ ਕੀਹ ਸ਼ਿਵ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਆਰੈ = (ਪ੍ਰਭੂ ਦੇ) ਦਰ ਤੇ। ਮਹੇਸੁ = ਸ਼ਿਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Su Gloriosa Puerta están Brahma, Vishnu y Shiva,"