[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਲਤਾਨੁ ਹੋਵਾ. ਮੇਲਿ ਲਸਕਰ; ਤਖਤਿ. ਰਾਖਾ ਪਾਉ ॥"
page = 14
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Were I to become an emperor, raise a huge army, set my foot on the throne,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਮੈਂ ਮਹਾਰਾਜਾ ਹੋ ਜਾਵਾਂ, ਭਾਰੀ ਸੈਨਾ ਜਮ੍ਹਾ ਕਰ ਲਵਾਂ ਅਤੇ ਰਾਜ ਸਿੰਘਾਸਨ ਉਤੇ ਆਪਣਾ ਪੈਰ ਟਿਕਾ ਲਵਾਂ ਤੇ ਤਖਤ ਦੇ ਉਤੇ ਬਹਿ ਕੇ ਜੇਕਰ ਮੈਂ ਫੁਰਮਾਨ ਜਾਰੀ ਕਰਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If I were to become an emperor and raise a huge army, and sit on a throne,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਪਾਤਿਸ਼ਾਹ ਹੋ ਕਰ ਫੌਜਾਂ ਕੋ ਏਕਠੀ ਕਰੂੰ, ਔਰ (ਤਖਤਿ) ਸੰਘਾਸਨ ਪਰ ਪੈਰ ਰਖੂੰ ਅਰਥਾਤ ਬੈਠੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਮੈਂ ਫ਼ੌਜਾਂ ਇਕੱਠੀਆਂ ਕਰ ਕੇ ਬਾਦਸ਼ਾਹ ਬਣ ਜਾਵਾਂ ਅਤੇ ਤਖ਼ਤ ਉੱਤੇ ਪੈਰ ਰੱਖਾਂ (ਦੁਨੀਆਂ ਦਾ ਹਕੂਮਤ ਪ੍ਰਾਪਤ ਕਰ ਲਵਾਂ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੇਲਿ = ਇਕੱਠਾ ਕਰ ਕੇ। ਲਸਕਰ = ਫ਼ੌਜਾਂ। ਤਖਤਿ = ਤਖ਼ਤ ਉੱਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si me volviera emperador, levantaría enormes ejércitos, me sentaría en suntuoso trono"