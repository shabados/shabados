[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਦਿ ਜੁਗਾਦੀ; ਰਹਿਆ ਸਮਾਇ ॥੧॥"
page = 868
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the beginning and from commencement of ages, He is contained everywhere."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਰੰਭ ਅਤੇ ਯੁੱਗ ਦੇ ਸ਼ੁਰੂ ਵਿੱਚ ਉਹ ਹਰ ਥਾਂ ਰਮ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the beginning, and throughout the ages, He is permeating everywhere. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਸਦਾ ਇਹ ਸਮਾਇ ਰਹਿਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਤਾਂ ਸ਼ੁਰੂ ਤੋਂ ਹੀ, ਜੁਗਾਂ ਦੇ ਸ਼ੁਰੂ ਤੋਂ ਹੀ (ਹਰ ਥਾਂ) ਵਿਆਪਕ ਚਲਿਆ ਆ ਰਿਹਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਦਿ = ਮੁੱਢ ਤੋਂ। ਜੁਗਾਦੀ = ਜੁਗਾਦਿ, ਜੁਗਾਂ ਦੇ ਮੁੱਢ ਤੋਂ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues desde tiempo inmemorial vive inmergida en su propio ser. (1)"