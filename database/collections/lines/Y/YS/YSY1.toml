[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਿ ਜੀਵਾ; ਪ੍ਰਭ ਚਰਣ ਤੁਮਾਰੇ ॥੧॥ ਰਹਾਉ ॥"
page = 563
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Lord, I live by dwelling on Thy feet. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਮੈਂ ਤੇਰੇ ਚਰਣਾ ਦਾ ਆਰਾਧਨ ਕਰਨ ਦੁਆਰਾ ਜੀਉਂਦਾ ਹਾਂ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I live by meditating on Your Feet, God. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੁਮਾਰੇ ਚਰਣੋਂ ਕੋ ਜਪ ਕਰ ਕੇ ਜੀਵਤਾ ਰਹੂੰ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਮੈਂ ਤੇਰੇ ਚਰਨ ਹਿਰਦੇ ਵਿਚ ਵਸ ਕੇ ਆਤਮਕ ਜੀਵਨ ਪ੍ਰਾਪਤ ਕਰਾਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਪਿ = ਜਪ ਕੇ, ਹਿਰਦੇ ਵਿਚ ਵਸਾ ਕੇ। ਜੀਵਾ = ਜੀਵਾਂ, ਮੈਂ ਆਤਮਕ ਜੀਵਨ ਪ੍ਰਾਪਤ ਕਰਾਂ। ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es que pueda vivir habitando en Tus Pies. (1‑Pausa)"