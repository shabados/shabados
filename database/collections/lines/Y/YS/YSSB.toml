[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਤਨੁ ਮਨੁ ਦੀਆ. ਸੁਰਤਿ ਸਮੋਈ ॥"
page = 1027
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who has blessed me with body and soul and has infused into me understanding."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਮੈਨੂੰ ਦੇਹ ਅਤੇ ਜਿੰਦੜੀ ਬਖ਼ਸ਼ੀ ਹੈ ਅਤੇ ਮੇਰੇ ਅੰਦਰ ਸਮਝ ਪਾਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He gave me body and mind, and infused consciousness into my being."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਸਰੀਰ ਔ ਮਨ ਦੀਆ ਹੈ ਪੁਨਃ ਸਰੀਰ ਕੇ ਬੀਚ ਗਿਆਤ (ਸਮੋਈ) ਮਿਲਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਹੀ ਹੈ) ਜਿਸ ਨੇ ਮੈਨੂੰ ਇਹ ਸਰੀਰ ਦਿੱਤਾ ਇਹ (ਮਨ) ਜਿੰਦ ਦਿੱਤੀ ਤੇ ਮੇਰੇ ਅੰਦਰਿ ਸੁਰਤ ਟਿਕਾ ਦਿੱਤੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਪ੍ਰਭੂ) ਨੇ। ਸੁਰਤਿ = ਸੂਝ। ਸਮੋਈ = ਟਿਕਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él nos ha bendecido con el cuerpo, la mente y con una conciencia también."