[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਆਪੇ ਆਪਿ ਵਰਤਦਾ; ਤੂ ਆਪੇ ਕਰਹਿ ਸੁ ਹੋਗੀਆ ॥"
page = 1313
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou Thyself pervade everywhere and what Thou Thyself do, that alone comes to pass."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੇ ਆਪ ਹੀ ਸਾਰੇ ਰਮ ਰਿਹਾ ਹੈਂ ਅਤੇ ਜੋ ਤੂੰ ਆਪ ਕਰਦਾ ਹੈਂ, ਕੇਵਲ ਉਹ ਹੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You Yourself are All-pervading; whatever You do comes to pass."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ  ਆਪ ਸਰਬ ਮੇਂ ਬਰਤ ਰਹਾ ਹੈਂ ਔਰ ਤੂੰ ਆਪੇ ਹੀ ਜੋ ਕੁਛ ਆਗੇ ਪਿਛੇ ਕਰਤਾ ਹੈਂ, ਸੋ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ ਜੋਗੀਆਂ ਵਿਚ ਭੀ ਤੇ ਗ੍ਰਿਹਸਤੀਆਂ ਵਿਚ ਭੀ ਹਰ ਥਾਂ) ਤੂੰ ਆਪ ਹੀ ਆਪ ਮੌਜੂਦ ਹੈਂ, ਜੋ ਕੁਝ ਤੂੰ ਕਰਦਾ ਹੈਂ, ਉਹੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਰਤਦਾ = ਮੌਜੂਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Tú Mismo prevaleces en todo. Lo que sea que haces eso sucede."