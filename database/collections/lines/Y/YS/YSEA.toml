data = "ਤੰਤਰੀ ਭਿੰਭਰੀ ਛਤ੍ਰਣੀ ਛਿੰਛਲਾ ॥੭੩॥"
page = 681

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "You are the mistress of the Tantas You are all pervading and have canopy over your head.73."

