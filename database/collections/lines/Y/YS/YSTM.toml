[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਧਮੁ ਲਭਣਹਾਰੁ; ਕਰਮੁ ਕਰੰਦੋ ਮਾ ਪਿਰੀ ॥"
page = 521
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Beloved took pity on me and I have found my Find."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਪ੍ਰੀਤਮ ਨੇ ਮੇਰੇ ਤੇ ਤਰਸ ਕੀਤਾ ਹੈ ਅਤੇ ਮੈਂ ਲੱਭਣ-ਯੋਗ (ਵਾਹਿਗੁਰੂ) ਨੂੰ ਲੱਭ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have found the object of my search - my Beloved took pity on me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਰਿਪਾ ਕਰਨੇ ਹਾਰਾ ਮੇਰਾ ਪਤੀ (ਲਭਣਹਾਰੁ) ਖੋਜਨੇ ਹਾਰੋਂ ਨੇ (ਲਧਮੁ) ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਮੇਰੇ ਪਿਆਰੇ ਖਸਮ ਨੇ (ਮੇਰੇ ਉੱਤੇ) ਬਖ਼ਸ਼ਸ਼ ਕੀਤੀ ਤਾਂ ਮੈਂ ਲੱਭਣ-ਜੋਗ ਪ੍ਰਭੂ ਨੂੰ ਲੱਭ ਲਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਭਣਹਾਰੁ = ਲੱਭਣ-ਯੋਗ ਪ੍ਰਭੂ। ਕਰਮੁ = ਬਖ਼ਸ਼ਸ਼। ਮਾ ਪਿਰੀ = ਮੇਰੇ ਪਿਰ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Señor es Misericordioso puesto que he encontrado el objeto de mi búsqueda."