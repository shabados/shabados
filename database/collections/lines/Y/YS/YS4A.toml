[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਚੁ ਸਚਾ, ਕੂੜੁ ਕੂੜੁ ਵਿਖੋਆ ॥੧੦॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The adopter of truth is ever known as truthful and the follower of falsehood is ever considered a Tier."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੱਲ ਕੀ ਸੱਚ ਸੱਚਾ ਹੈ, ਕੂੜ ਝੂਠਾ ਹੀ ਦੇਖੀਦਾ ਹੈ। (ਯਥਾ-'ਉਘਰਿ ਗਇਆ ਜੈਸਾ ਖੋਟਾ ਢਬੂਆ ਨਦਰਿ ਸਰਾਫਾ ਆਇਆ')।"