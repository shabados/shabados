[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਗੁ ਨਹੀ ਚਲੈ; ਹਰਿ ਹਾਂ ॥"
page = 409
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man's feet, therefore, walk not towards God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਦਮੀ ਦੇ ਪੈਰ ਇਸ ਲਈ ਰੱਬ ਵਲ ਨਹੀਂ ਤੁਰਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Stuck in it, his feet cannot walk towards the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮੇਂ ਪਗ ਹਰੀ ਕੀ ਓਰ ਚਲ ਨਹੀਂ ਸਕਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੈਰ ਪਰਮਾਤਮਾ ਵਾਲੇ ਪਾਸੇ ਨਹੀਂ ਤੁਰ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਗੁ = ਪੈਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y por eso uno no puede tomar un paso hacia Dios."