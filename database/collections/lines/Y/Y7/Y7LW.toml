[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਮਨੋਰਥ; ਮੁਕਤਿ ਪਦੁ ਦੀਤੁ ॥੧॥"
page = 195
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God gives him all the riches and the status of salvation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਉਸ ਨੂੰ ਸਮੂਹ ਦੌਲਤ ਅਤੇ ਮੋਖਸ਼ ਦੀ ਪਦਵੀ ਪ੍ਰਦਾਨ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He fulfills all their desires, and blesses them with the state of liberation. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੋ ਭੀ ਸਭ ਮਨੋਰਥੋਂ ਕੇ ਪੂਰਨ ਕਰਨੇ ਸਹਤ ਮੁਕਤੀ ਕਾ ਪਦ ਦੀਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਫਿਰ ਭੀ ਉਹ ਉਸ ਦੇ) ਸਾਰੇ ਮਨੋਰਥ ਪੂਰੇ ਕਰ ਦੇਂਦਾ ਹੈ (ਤੇ ਉਸ ਨੂੰ) ਉਹ ਆਤਮਕ ਅਵਸਥਾ ਭੀ ਦੇ ਦੇਂਦਾ ਹੈ ਜਿੱਥੇ ਕੋਈ ਵਾਸਨਾ ਪੋਹ ਨਹੀਂ ਸਕਦੀ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਕਤਿ ਪਦੁ = ਉਹ ਆਤਮਕ ਦਰਜਾ ਜਿਥੇ ਕੋਈ ਵਾਸਨਾ ਪੋਹ ਨਹੀਂ ਸਕਦੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo para satisfacer sus deseos, aun a él, el Señor lo satisface y lo emancipa.(1)"