[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰਥਮ ਮਾਨਿ ਤੁਮ ਕੋ ਕਹੋ; ਜਥਾ ਬੁਧਿ ਬਲੁ ਹੋਇ ॥"
page = 812

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Believing You be the omnipresent, I say, that I have rendered this"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਹਿਲਾ ਤੁਹਾਨੂੰ ਮੰਨਾ ਕੇ ਯਥਾ ਬੁੱਧੀ ਬਲ (ਰਚਨਾ) ਕਥਨ ਕਰਦਾ ਹਾਂ।"