[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਇਹੁ ਰਾਜ; ਨ ਭੀਖ ਮੰਗਾਸੀ ॥"
page = 871
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Neither it is a king, nor a mumper."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਂ ਇਹ ਪਾਤਿਸ਼ਾਹ ਹੈ, ਨਾਂ ਹੀ ਭਿਖਿਆ ਮੰਗਣ ਵਾਲਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It is not a king, and it is not a beggar."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਰਾਜਾ ਭੀ ਨਹੀਂ ਹੈ ਔਰ (ਭੀਖ ਮੰਗਾਸੀ) ਭਿਛਕ ਭੀ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਹ ਇਹ ਰਾਜਾ ਹੈ ਨਾਹ ਮੰਗਤਾ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੀਖ ਮੰਗਾਸੀ = ਮੰਗਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no es un rey ni tampoco un pordiosero."