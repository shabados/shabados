[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਗੈ ਜੌਨ ਕੇ ਤਾਹਿ ਪਾਰੈ ਪਧਾਰੇ ॥੧੨॥"
page = 61

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He discharged sharp arrows in great rage and whosoever was struck, left for the other world.12."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਜਿਨ੍ਹਾਂ ਨੂੰ ਲਗੇ ਉਹ (ਸੰਸਾਰ ਤੋਂ) ਪਰਲੇ ਪਾਸੇ ਚਲੇ ਗਏ ॥੧੨॥"