[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਡਾ ਬੇਪਰਵਾਹ, ਅੰਤੁ ਨ ਜਾਣੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He, the great, is nonchalant and his mystery cannot be understood"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਬੇਪਰਵਾਹ ਹੈ (ਉਸਦਾ) ਅੰਤ ਨਹੀਂ ਲੱਭਦਾ।"