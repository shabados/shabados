[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨੇ ਹੀ ਸੁਖ ਸਿਉ ਸਭ ਲਾਗੇ; ਕਿਆ ਦਾਰਾ ਕਿਆ ਮੀਤ ॥੧॥ ਰਹਾਉ ॥"
page = 536
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Every, whether wife whether friend is intent on his own happiness. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਜਣੇ ਦਾ, ਕੀ ਪਤਨੀ, ਕੀ ਮਿੱਤ੍ਰ, ਆਪਦੀ ਖੁਸ਼ੀ ਨਾਲ ਹੀ ਸਰੋਕਾਰ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whether they are spouses or friends, all are concerned only with their own happiness. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚਾਹੇ ਮਿਤ੍ਰ ਹੈ ਚਾਹੇ ਇਸਤ੍ਰੀ ਹੈ, ਸਭ ਸਨਬੰਧੀ ਅਪਨੇ ਹੀ ਸੁਖ ਕੇ ਸਾਥ ਲਗ ਰਹੇ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਚਾਹੇ ਇਸਤ੍ਰੀ ਹੈ ਚਾਹੇ ਮਿੱਤਰ ਹਨ-ਸਾਰੇ ਆਪੋ ਆਪਣੇ ਸੁਖ ਦੀ ਖ਼ਾਤਰ ਹੀ (ਮਨੁੱਖ ਦੇ) ਨਾਲ ਤੁਰੇ ਫਿਰਦੇ ਹਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਉ = ਨਾਲ, ਦੀ ਖ਼ਾਤਰ। ਸਭਿ = ਸਾਰੇ (ਸਨਬੰਧੀ)। ਕਿਆ = ਕੀਹ, ਚਾਹੇ, ਭਾਵੇਂ। ਦਾਰਾ = ਇਸਤ੍ਰੀ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero para satisfacer su placentero interés, sea amigo o esposa. (1‑Pausa)"