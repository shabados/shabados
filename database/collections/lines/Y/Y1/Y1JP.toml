[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ; ਜੋਤਿ ਸਰੂਪੀ ਬਾਲਾ ॥"
page = 1021
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou Thyself are ever-young and the embodiment of light,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪ ਹੀ ਸਦੀਵੀ-ਜੁਆਨ ਅਤੇ ਪ੍ਰਕਾਸ਼-ਰੂਪ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You Yourself are the embodiment of light, forever young."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਤੂੰ ਜੋਤ ਸਰੂਪ ਬਡਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਨਿਰਾ ਚਾਨਣ ਹੀ ਚਾਨਣ ਹੈ ਤੇ ਸਭ ਦਾ ਵੱਡਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਲਾ = ਵੱਡਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Siempre Joven y Siempre Fresco, también es el Sanyasa de cabello engreñado y desarrapado,"