[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਯੌ ਕਹਿ ਰੋਵਤ ਭੀ ਲਲਨਾ; ਅਪਨੇ ਮਨ ਮੈ ਅਤਿ ਸੋਕ ਬਢਾਯੋ ॥"
page = 391

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying thus, Radha in great grief, began to weep bitterly"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਹ ਕਹਿ ਕੇ ਲਲਨਾ (ਰਾਧਾ) ਰੋਣ ਲਗ ਗਈ ਅਤੇ ਆਪਣੇ ਮਨ ਵਿਚ ਬਹੁਤ ਸ਼ੋਕ ਵਧਾ ਲਿਆ।"