[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੈ ਮਨਿ; ਐਸੀ ਭਗਤਿ ਬਨਿ ਆਈ ॥"
page = 368
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within my mind such a devotion has been produced."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਡੇ ਚਿੱਤ ਅੰਦਰ ਐਹੋ ਜੇਹਾ ਅਨੁਰਾਗ ਪੈਦਾ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such is the devotional love which has been produced in my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੇਰੇ ਮਨ ਸੇ ਤੋ ਐਸੀ ਭਗਤਿ ਬਨ ਆਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਮੇਰੇ ਮਨ ਵਿਚ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਇਹੋ ਜਿਹੀ ਬਣੀ ਪਈ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En mi mente hay tal Devoción por el Señor"