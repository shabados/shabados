[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨੰਨਾਕਾਰੁ; ਨ ਕੋਇ ਕਰੇਈ ॥"
page = 221
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "No one says \"No\", unto them."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਭੀ ਉਨ੍ਹਾਂ ਨੂੰ ਨਾਹ ਨਹੀਂ ਆਖਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one can say no to them."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕਾਮਾਦਿਕੋਂ ਕੋ ਕੋਊ (ਨੰਨਾਕਾਰੁ) ਨਿਰਾਦਰ ਨਹੀਂ ਕਰ ਸਕਤਾ, ਭਾਵ ਏਹਿ ਕਿ ਤਿਨ ਕੋ ਕੋਊ ਜੋ ਨਹੀਂ ਕਰ ਸਕਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਮਨ ਏਨਾ ਆਕੀ ਹੋਇਆ ਪਿਆ ਹੈ ਕਿ ਕੋਈ ਜੀਵ ਇਸ ਦੇ ਅੱਗੇ ਨਾਂਹ-ਨੁੱਕਰ ਨਹੀਂ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੰਨਾਕਾਰੁ = ਨਾਂਹ-ਨੁੱਕਰ, ਇਨਕਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor solamente encauza a nuestras mentes"