data = "ਪੀਰ, ਬਚਨ ਜੋ ਤੁਮ ਕਰਿਯੋ; ਲੌਗ ਦਯੋ ਤ੍ਰਿਯ ਹਾਥ ॥"
page = 861

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘When the Peer had given her his blessings along with a clove in her hand,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੀਰ ਜੀ! ਤੁਸੀਂ ਇਸਤਰੀ ਨੂੰ ਲੌਂਗ ਦੇਣ ਵੇਲੇ ਜੋ ਬਚਨ ਕੀਤਾ ਸੀ,"