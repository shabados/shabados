[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕ ਭੀ ਨ ਦੇਇ; ਦਸ ਭੀ ਹਿਰਿ ਲੇਇ ॥"
page = 268
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If the Lord gives not even one thing, and takes, away the ten,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਪ੍ਰਭੂ ਇਕ ਚੀਜ਼ ਭੀ ਨਾਂ ਦੇਵੇ, ਅਤੇ ਦੱਸ ਭੀ ਖੋਹ ਲਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But what if that one thing were not given, and the ten were taken away?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਏਕ ਕੋ ਭੀ ਨ ਦੇਵੇ (ਭੀ) ਬਹੁੜੋ ਦਸੇ ਹਰ ਲੇਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇ ਪ੍ਰਭੂ) ਇਕ ਚੀਜ਼ ਭੀ ਨਾਹ ਦੇਵੇ, ਤੇ, ਦਸ (ਦਿੱਤੀਆਂ ਹੋਈਆਂ) ਭੀ ਖੋਹ ਲਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਿਰਿ ਲੇਇ = ਖੋਹ ਲਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Qué haría ese iluso si Dios ya no repartiera más dones y retirara los que ya ha otorgado?"