[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾ ਦਿਨ ਮੋਰੇ ਪਤਿ ਮਰੇ; ਮੋ ਸੌ ਕਹਿਯੋ ਬੁਲਾਇ ॥"
page = 825

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘The day my husband expired, he told me,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਹਿਣ ਲਗੀ) ਜਿਸ ਦਿਨ ਮੇਰਾ ਪਤੀ ਮਰਿਆ ਸੀ, (ਉਸ ਦਿਨ) ਉਸ ਨੇ ਮੈਨੂੰ ਸਦ ਕੇ ਕਿਹਾ ਸੀ"