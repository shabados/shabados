[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਿਰਮ ਪਿਆਲਾ ਪਾਕ; ਅਮਿਅ ਰਸੁ ਪੀਵਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Sacred is the cup of the love of the beloved; he should quaff that only."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਿਰੀ ਦੇ ਪਿਆਲੇ ਦੇ ਪਵਿੱਤ੍ਰ ਅੰਮ੍ਰਿਤ ਰਸ ਨੂੰ ਪਾਨ ਕਰੋ।"