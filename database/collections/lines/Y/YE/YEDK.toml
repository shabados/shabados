[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਸਨਾ ਉਚਰੰਤਿ ਨਾਮੰ; ਸ੍ਰਵਣੰ ਸੁਨੰਤਿ. ਸਬਦ ਅੰਮ੍ਰਿਤਹ ॥"
page = 709
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With my tongue, I utter the Lord's Name and with mine ears, I hear the Nectar. Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਜੀਭ ਨਾਲ ਮੈਂ ਸਾਈਂ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਦਾ ਹਾਂ ਅਤੇ ਆਪਣੇ ਕੰਨਾਂ ਨਾਲ ਮੈਂ ਅੰਮ੍ਰਿਤ-ਪਾਨ ਨੂੰ ਸੁਣਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With my tongue, I chant the Lord's Name; with my ears, I listen to the Ambrosial Word of His Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੁਰਸ਼ ਰਸਨਾ ਕਰ ਕੇ ਨਾਮ ਉਚਾਰਤੇ ਹੈਂ ਔ ਸਰਵਣੋਂ ਕਰ ਕੇ ਸਤਿਗੁਰੋਂ ਕੇ ਅੰਮ੍ਰਿਤ ਰੂਪ ਸਬਦ ਕੋ ਸ੍ਰਵਣ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਜੀਭ ਨਾਲ ਪਾਰਬ੍ਰਹਮ ਦਾ ਨਾਮ ਉਚਾਰਦੇ ਹਨ, ਜੋ ਕੰਨਾਂ ਨਾਲ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੀ ਪਵਿਤ੍ਰ ਬਾਣੀ ਸੁਣਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸਨਾ = ਜੀਭ। ਸਬਦ ਅੰਮ੍ਰਿਤਹ = ਪਵਿਤ੍ਰ ਸਬਦ, ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੀ ਪਵਿਤ੍ਰ ਬਾਣੀ। ਸ੍ਰਵਣ = ਕੰਨਾਂ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me ofrezco siempre en sacrificio a aquéllos que recitan el Nombre del Señor con Fe y escuchan la Palabra Ambrosial,"