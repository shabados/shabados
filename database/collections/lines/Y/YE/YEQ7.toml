[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਉਗਣਵੰਤੀ ਕਾਮਣੀ; ਦੁਖੁ ਲਾਗੈ ਬਿਲਲਾਇ ॥੩॥"
page = 559
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The sinful bride suffers pain and bewails."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਪ ਭਰੀ ਪਤਨੀ ਕਸ਼ਟ ਝੱਲਦੀ ਹੈ ਅਤੇ ਵਿਰਲਾਪ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The unvirtuous woman suffers, and cries out in pain. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਇਸਤ੍ਰੀ ਅਉਗਣਵੰਤੀ ਹੈ, ਜਬ ਤਿਨ ਕੋ ਦੁਖ ਲਗਤਾ ਹੈ ਤਬ ਬ੍ਰਿਲਾਪ ਕਰਤੀ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਔਗੁਣਾਂ-ਭਰੀ ਜੀਵ-ਇਸਤ੍ਰੀ ਨੂੰ ਦੁੱਖ ਚੰਬੜਿਆ ਰਹਿੰਦਾ ਹੈ ਉਹ ਸਦਾ ਵਿਲਕਦੀ ਰਹਿੰਦੀ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਮਣੀ = (ਜੀਵ-) ਇਸਤ੍ਰੀ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero la que tiene maldad en su mente, sufre dolor y se acongoja. (3)"