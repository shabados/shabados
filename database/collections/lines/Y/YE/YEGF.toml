[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇੰਦ੍ਰਪੁਰੀ ਤੇ ਧਾਵਣਾ; ਵਡ ਜੋਧੀ ਮਤਾ ਪਕਾਇਆ ॥"
page = 122

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The great fighters decided to rush towards the kingdom of Indra."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵਡਿਆਂ (ਰਾਖਸ਼) ਯੋਧਿਆਂ ਨੇ ਇੰਦਰਪੁਰੀ ਉਤੇ ਹਮਲਾ ਕਰਨ ਦਾ ਵਿਚਾਰ ਕੀਤਾ (ਯੋਜਨਾ ਬਣਾਈ)।"