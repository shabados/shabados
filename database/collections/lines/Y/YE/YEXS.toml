[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਕਿਛੁ ਸੇਵਾ; ਨਾ ਕਰਮਾਰੇ ॥"
page = 913
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I serve Thee not, nor do I good deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੀ ਘਾਲ ਨਹੀਂ ਕਮਾਉਂਦਾ, ਨਾਂ ਹੀ ਚੰਗੇ ਕਰਮ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I do not serve You, or do any good deeds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ ਸੇ ਨਾ ਕਛੁ ਸੇਵਾ ਹੀ ਹੋਤੀ ਹੈ ਔ ਨਾ ਕੋਈ ਸੁਭ ਕਰਮ ਹੀ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਸੀਂ ਨਾਹ ਕੋਈ ਸੇਵਾ-ਭਗਤੀ ਕਰਦੇ ਹਾਂ, ਨਾਹ ਹੀ ਸਾਡੇ ਕੰਮ ਚੰਗੇ ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਮਾਰੇ = ਚੰਗੇ ਕਰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no hacemos buenas acciones ni tampoco Te servimos."