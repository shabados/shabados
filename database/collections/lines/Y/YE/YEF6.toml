[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਰਚੇ; ਕੇਵਲ ਨਾਮ ਮੁਰਾਰੀ ॥੨॥"
page = 914
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints are absorbed in only the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਕੇਵਲ ਸੁਆਮੀ ਦੇ ਨਾਮ ਅੰਦਰ ਹੀ ਸਮਾਏ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Saints are absorbed only in the Name of the Lord. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਕੇਵਲ ਮੁਰਾਰੀ ਕੇ ਨਾਮ ਸੇ ਰਚੇ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਹੀ ਸਿਰਫ਼ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਿਚ ਮਸਤ ਰਹਿੰ​‍ਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਚੇ = ਮਸਤ ਰਹਿੰ​‍ਦੇ ਹਨ। ਕੇਵਲ = ਸਿਰਫ਼। ਮੁਰਾਰੀ = {ਮੁਰ-ਅਰਿ} ਪਰਮਾਤਮਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero los Santos viven embebidos sólo con el Nombre del Señor.(2)"