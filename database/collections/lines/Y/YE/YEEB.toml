[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਠ ਪਹਰ; ਅਪੁਨੀ ਲਿਵ ਲਾਇ ॥"
page = 1339
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Let me be attuned to Thyself through all the eight watches,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੱਠੇ ਪਹਿਰ ਮੈਨੂੰ ਆਪਣੇ ਪਿਆਰ ਨਾਲ ਜੋੜੀ ਰੱਖ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Twenty-four hours a day, I am lovingly attuned to You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰੇ ਕੌ ਆਠੋਂ ਪਹਰ ਅਪਨੀ (ਲਿਵ) ਪ੍ਰੀਤੀ ਲਗਾਉ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੇਰੇ ਅੰਦਰ) ਅੱਠੇ ਪਹਰ ਆਪਣੀ ਲਗਨ ਲਾਈ ਰੱਖ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਿਵ ਲਾਇ = ਪਿਆਰ ਬਣਾਈ ਰੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "las veinticuatro horas del día permanezco constantemente entonado en Ti."