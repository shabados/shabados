data = "ਸੋ ਸਭ ਹੀ ਤੈ ਕਾਟਿ ਗਿਰਾਏ ॥"
page = 989

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘So far, all the arrow I shot, you have cut them."

[[content]]
