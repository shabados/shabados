[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਕ੍ਰ ਬਕ੍ਰ ਕਰ ਧਰੇ; ਚਾਰੁ ਬਾਗਾ ਤਨਿ ਧਾਰੇ ॥"
page = 696

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is wearing the curved discus and fine garments on his body"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਨੇ) ਭਿਆਨਕ ਚਕ੍ਰ ਹੱਥ ਵਿਚ ਪਕੜਿਆ ਹੋਇਆ ਹੈ ਅਤੇ ਤਨ ਉਤੇ ਸੁੰਦਰ ਪੋਸ਼ਾਕ ('ਬਾਗਾ') ਧਾਰਨ ਕੀਤੀ ਹੋਈ ਹੈ।"