[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੇ ਦਾਸ; ਚਰਨ ਸਰਨਾਇਆ ॥੧॥ ਰਹਾਉ ॥"
page = 1348
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thine slaves, O Lord, seek the refuge of Thine feet. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰੇ ਗੋਲੇ ਤੇਰੇ ਪੈਰਾਂ ਦੀ ਪਨਾਹ ਲੋੜਦੇ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your slaves seek the Sanctuary of Your Feet. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਦਾਸੋਂ ਕੇ ਚਰਨੋਂ ਕੀ ਮੈਂ ਸਰਨ ਆਇਆ ਹੂੰ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਹੜਾ) ਤੇਰੇ ਦਾਸਾਂ ਦੇ ਚਰਨਾਂ ਦੀ ਸਰਨ ਆ ਪਿਆ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇਰੇ ਦਾਸ ਚਰਨ = ਤੇਰੇ ਦਾਸਾਂ ਦੇ ਚਰਨਾਂ ਦੀ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tus Esclavos buscan el Santuario de Tus Pies. (1-Pausa)"