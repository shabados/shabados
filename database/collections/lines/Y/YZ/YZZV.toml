[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਟ ਪਟੰਬਰ; ਪਹਿਰਿ ਹਢਾਵਉ ॥"
page = 225
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I may wear and carry on my body silk and silk clothes,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਦੇਹਿ ਨੂੰ ਰੇਸ਼ਮ ਅਤੇ ਰੇਸ਼ਮੀ ਬਸਤਰ ਪਾਵਾਂ ਓਢਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I may dress up and wear silk and satin clothes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਰੇਸ਼ਮੀ ਆਦਿਕ ਬਸਤ੍ਰੋਂ ਕੋ ਸਮੈ ਪਰ ਪਹਰੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਮੈਂ ਰੇਸ਼ਮ ਰੇਸ਼ਮੀ ਕੱਪੜੇ ਪਹਿਨ ਕੇ ਹੰਢਾਵਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਟ = ਪੱਟ, ਰੇਸ਼ਮ। ਪਟੰਬਰ = ਪੱਟ ਦੇ ਅੰਬਰ। ਅੰਬਰ = ਕੱਪੜੇ। ਪਹਿਰਿ = ਪਹਿਨ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y se vista de seda, sin el Señor,"