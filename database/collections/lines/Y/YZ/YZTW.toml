[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਮ ਚਾਤ੍ਰਿਕ ਦੀਨ; ਸਤਿਗੁਰ ਸਰਣਾਈ ॥"
page = 95
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am a poor pied-cuckoo, in the sanctuary of the True Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਗਰੀਬ ਪਪੀਹਾ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਤਾਬੇ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am just a poor song-bird, in the Sanctuary of the True Guru,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ ਜਗ੍ਯਾਸੂ ਰੂਪੀ (ਚਾਤ੍ਰਿਕ) ਪਪੀਹੇ ਦੀਨ ਹੋ ਕਰ ਸਤਿਗੁਰੋਂ ਕੀ ਸਰਣ ਕੋ ਪ੍ਰਾਪਤਿ ਭਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਾਸ ਨਾਨਕ! (ਆਖ-) ਅਸੀਂ ਨਿਮਾਣੇ ਚਾਤ੍ਰਿਕ ਹਾਂ ਤੇ ਗੁਰੂ ਦੀ ਸਰਨ ਆਏ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਾਤ੍ਰਿਕ = ਪਪੀਹੇ {ਨੋਟ: ਪ੍ਰਚਲਤ ਖ਼ਿਆਲ ਹੈ ਕਿ ਪਪੀਹਾ ਸ੍ਵਾਂਤੀ ਨਛੱਤ੍ਰ ਸਮੇ ਪਈ ਬੂੰਦ ਨੂੰ ਹੀ ਪੀਂਦਾ ਹੈ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Yo soy como el pajarillo Cuclillo en el Santuario del Guru;"