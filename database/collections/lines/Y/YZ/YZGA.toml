[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਨੀ ਨਵਰੰਗ ਰਾਇ ਕੌ; ਤਬ ਹੀ ਲਿਯਾ ਬੁਲਾਇ ॥"
page = 848

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Rani, then, called Navrang at that instant."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਣੀ ਨੇ ਨਵਰੰਗ ਰਾਇ ਨੂੰ ਉਸੇ ਵੇਲੇ ਬੁਲਾ ਲਿਆ"