[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਾਪਰਾਧ; ਚਿਤਵਹਿ ਬੁਰਿਆਈ ॥੧॥ ਰਹਾਉ ॥"
page = 372
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "as they think of doing evil to the innocent."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਬੇਗੁਨਾਹਾਂ ਦਾ ਬੁਰਾ ਕਰਨ ਦਾ ਖ਼ਿਆਲ ਕਰਦੇ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "they think of doing evil to the innocent. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਅਪਰਾਧ ਤੇ ਬਿਨਾਂ ਪਰਾਈ ਬੁਰਾਈ ਚਿਤਵਤੇ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੇ ਨਿਦੋਸੇ ਬੰਦਿਆਂ ਨੂੰ ਭੀ ਨੁਕਸਾਨ ਅਪੜਾਨ ਦੀਆਂ ਸੋਚਾਂ ਸੋਚਦੇ ਰਹਿੰਦੇ ਹਨ (ਉਚੀ ਜਾਤਿ ਦਾ ਹੋਣਾ, ਜਾਂ ਵੇਦ ਸ਼ਾਸਤ੍ਰ ਪੜ੍ਹੇ ਹੋਣਾ ਭੀ ਉਹਨਾਂ ਦੇ ਆਤਮਕ ਜੀਵਨ ਨੂੰ ਗ਼ਰਕ ਹੋਣੋਂ ਨਹੀਂ ਬਚਾ ਸਕਦਾ, ਜੇ ਉਹ ਦੂਜਿਆਂ ਦਾ ਬੁਰਾ ਤੱਕਦੇ ਰਹਿੰਦੇ ਹਨ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਾਪਰਾਧ = ਨਿਰ-ਅਪਰਾਧ, ਨਿਦੋਸਿਆਂ ਦੀ। ਚਿਤਵਹਿ ਬੁਰਿਆਈ = ਨੁਕਸਾਨ ਕਰਨ ਦੀਆਂ ਸੋਚਾਂ ਸੋਚਦੇ ਰਹਿੰਦੇ ਹਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que sin motivo alguno, pensaron en hacernos mal. (1‑Pausa)"