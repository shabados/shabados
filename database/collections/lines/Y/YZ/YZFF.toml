[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਜਾਨ ਬਾਹ ਅਨਭਉ ਅਜੀਤ ॥"
page = 640

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is supremely immaculate, sacred, pure, long-armed, fearless and unconquerable"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਗੋਡਿਆਂ ਤਕ ਲੰਬੀਆਂ ਬਾਂਹਵਾਂ ਵਾਲਾ, ਭੈ ਤੋਂ ਰਹਿਤ ਅਤੇ ਨਾ ਜਿਤੇ ਜਾ ਸਕਣ ਵਾਲਾ ਹੈ।"