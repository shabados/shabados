[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹ ਬੈਸਹੁ. ਕਹ ਰਹੀਐ ਬਾਲੇ; ਕਹ ਆਵਹੁ. ਕਹ ਜਾਹੋ ॥"
page = 938
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Q. 5: Where is thy seat? Q. 6: Where abidest thou, O boy?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰ. 5: ਤੇਰਾ ਟਿਕਾਣਾ ਕਿੱਥੇ ਹੈ? ਪ੍ਰ. 6: ਤੂੰ ਕਿੱਥੇ ਵਸਦਾ ਹੈਂ, ਹੇ ਬਾਲਕੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Where is your seat? Where do you live, boy? Where did you come from, and where are you going?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਾਲੇ! ਕਹਾਂ ਬੈਠਤੇ ਹੋ ੧, ਅਰ ਕਹਾਂ ਰਹਿਤੇ ਹੋ ੨, ਔ ਕਹਾਂ ਤੇ ਆਏ ਹੋ ੩, ਔ ਕਹਾਂ ਜਾਹੁਗੇ ੪?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਚਰਪਟ ਦਾ ਪ੍ਰਸ਼ਨ) ਹੇ ਬਾਲਕ! ਤੁਸੀ ਕਿਸ ਦੇ ਆਸਰੇ ਸ਼ਾਂਤ-ਚਿੱਤ ਹੋ? ਤੁਹਾਡੀ ਸੁਰਤ ਕਿਸ ਵਿਚ ਜੁੜਦੀ ਹੈ? ਕਿੱਥੋਂ ਆਉਂਦੇ ਹੋ? ਕਿੱਥੇ ਜਾਂਦੇ ਹੋ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹ = ਕਿਥੇ? ਕਿਸ ਦੇ ਆਸਰੇ? ਬੈਸਹੁ = (ਤੁਸੀ) ਬੈਠਦੇ ਹੋ, ਸ਼ਾਂਤ-ਚਿੱਤ ਹੁੰਦੇ ਹੋ। ਬਾਲੇ = ਹੇ ਬਾਲਕ! ਕਹ = ਕਿਥੇ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dijeron los Yoguis: ¿Dónde vives, joven? ¿De dónde vienes? ¿A dónde vas?"