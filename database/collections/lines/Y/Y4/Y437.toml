[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾ ਰੁਤਿ ਸੁਹਾਵੀ; ਜਿਤੁ ਹਰਿ ਚਿਤਿ ਆਵੈ ॥"
page = 1183
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Beauteous is the season, when the Lord is meditated upon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁੰਦਰ ਹੈ ਉਹ ਮੌਸਮ ਜਦ ਸੁਆਮੀ ਸਿਮਰਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How beautiful is that season, when the Lord fills the mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸੋਈ ਰੁਤ ਸੋਭਨੀਕ ਹੈ ਜਿਸ ਵਿਖੇ ਹਰੀ ਚਿਤ ਮੇਂ ਯਾਦ ਆਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਨੁੱਖ ਵਾਸਤੇ) ਉਹ ਰੁੱਤ ਸੋਹਣੀ ਹੁੰਦੀ ਹੈ ਜਦੋਂ ਪਰਮਾਤਮਾ ਉਸ ਦੇ ਚਿੱਤ ਵਿਚ ਆ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾ = ਉਹ {ਇਸਤ੍ਰੀ ਲਿੰਗ}। ਸੁਹਾਵੀ = ਸੁਖਦਾਈ। ਜਿਤੁ = ਜਿਸ (ਰੁੱਤ) ਵਿਚ। ਚਿਤਿ = ਚਿੱਤ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bendita es la estación en la que Dios es elevado en la mente,"