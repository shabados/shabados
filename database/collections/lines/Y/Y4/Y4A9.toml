[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਤਿਸੁ ਜਨ ਕਉ; ਸਦਾ ਨਮਸਕਾਰੁ ॥੮॥੨੩॥"
page = 295
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto that slave of the Lord Nanak ever makes an obeisance."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਦੇ ਉਸ ਨਫਰ ਨੂੰ ਨਾਨਕ, ਹਮੇਸ਼ਾਂ ਹੀ, ਪ੍ਰਣਾਮ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, to that humble servant, I bow in reverence forever. ||8||23||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਸੰਤ ਜਨ ਕੋ ਹਮਾਰੀ ਸਦਾ ਨਮਸਕਾਰ ਹੈ॥੮॥੨੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਐਸੇ (ਉੱਤਮ) ਮਨੁੱਖ ਨੂੰ ਸਾਡੀ ਸਦਾ ਪ੍ਰਣਾਮ ਹੈ ॥੮॥੨੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¡Rindamos homenaje a tal hombre! (8-23)"