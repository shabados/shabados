type = "primary"
data = "ਕਿ ਈਂ ਤਰਜ਼ ਲਾਲਾਇ ਬਰਗੇ ਸਮਨ ॥"
page = 1401

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Here is she, who is delicate like the leaf of a flower,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਹ (ਰਾਜ ਕੁਮਾਰੀ) ਲਾਲਹ (ਪੋਸਤ) ਦੇ ਫੁਲ (ਵਾਂਗ ਸੁੰਦਰ) ਅਤੇ ਚਮੇਲੀ ਦੇ ਪੱਤਰ (ਵਰਗੀ ਕੋਮਲ) ਹੈ।"