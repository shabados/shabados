[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹਥੈ ਹਰ ਦੁ ਠੋਕੈ ਭੁਜਾ ਪਾਇ ਗਾਜੈ ॥"
page = 147

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Both struck their arms with their hands and shouted loudly."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਵੇਂ ਡੌਲਿਆਂ (ਭੁਜਾਵਾਂ) ਨੂੰ ਹੱਥਾਂ ਨਾਲ ਠੋਕਦੇ ਸਨ ਅਤੇ (ਧਰਤੀ ਉਤੇ) ਪੈਰ (ਮਾਰ ਕੇ) ਗਜਦੇ ਸਨ।"