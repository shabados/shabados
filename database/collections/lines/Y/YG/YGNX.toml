[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਪਾਪ; ਤਾ ਕੇ ਪਾਨੀਹਾਰ ॥"
page = 888
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "myriads of sins are his water-carriers,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਹੀ ਪਾਪ ਉਸ ਦੇ ਮਾਸ਼ਕੀ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "countless sins are his water-carriers;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੇਕ ਪਾਪ ਤਾਕੇ ਪਾਨੀ ਕੋ ਭਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ ਦੇ) ਅਨੇਕਾਂ ਵਿਕਾਰ ਉਸ ਦਾ ਪਾਣੀ ਭਰਨ ਵਾਲੇ ਬਣ ਜਾਂਦੇ ਹਨ (ਉਸ ਉੱਤੇ ਆਪਣਾ ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕਦੇ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਨੀਹਾਰ = ਪਾਣੀ ਭਰਨ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "millones de errores le son borrados"