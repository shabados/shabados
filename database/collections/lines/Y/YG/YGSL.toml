[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੰਕੇਤ ਕਰਿ ਇਤੇ ਭਨੈ ॥੧੦੭॥"
page = 622

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the immaculate kings ultimately merged in the Lord after their rule, which poet can enumerate their names? Therefore, I have only hinted about them.107."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੰਕੇਤ ਮਾਤਰ ਇਥੇ ਕਹਿ ਦਿੱਤੇ ਹਨ ॥੧੦੭॥"