[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਰਸ ਕਸ ਰੂਪ ਨ ਰੇਖਿ ਵਿਚਿ; ਰਾਗ ਰੰਗ ਨਿਰਲੇਪੁ ਰਹੰਦਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He is away from enjoyments, repulsions, forms and even being amidst festivities, he remains detached and stabilized."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਰਸ, ਕਸ, ਰੂਪ, ਰੇਖ, ਰਾਗ, ਰੰਗ ਥੋਂ ਨਿਰਲੇਪ ਹਨ।"