[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕਉ ਸਿਮਰਹਿ; ਸੇ ਮੁਖ ਸੁਹਾਵੇ ॥"
page = 263
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Beauteous are the faces of those who contemplate over the Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁੰਦਰ ਹਨ ਉਨ੍ਹਾਂ ਦੇ ਚਿਹਰੇ ਜੋ ਮਾਲਕ ਦਾ ਆਰਾਧਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who remember God - their faces are beautiful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪ੍ਰਭੂ ਕੋ ਸਿਮਰਤੇ ਹੈਂ ਤਿਨ ਕੇ ਮੁਖ (ਸੁਹਾਵੇ) ਸੋਭਨੀਕ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਪ੍ਰਭੂ ਨੂੰ ਸਿਮਰਦੇ ਹਨ ਉਹਨਾਂ ਦੇ ਮੂੰਹ ਸੋਹਣੇ (ਲੱਗਦੇ) ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਹਾਵੇ = ਸੋਹਣੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y viven en una Paz continua."