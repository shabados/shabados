[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਧੀਰਜ ਧਰਮ ਨ ਪੁਜਨੀ; ਲਖ ਲਖ ਪਰਬਤ ਲਖ ਧਰਤੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Lacs of forbearing earths and mountains cannot equate the teachings of the true Guru in perseverance and righteousness."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਧੀਰਜ, ਧਰਮ ਲਖਾਂ ਪਰਬਤ, ਲੱਖਾਂ ਧਰਤੀਆਂ (ਗੁਰੂ ਧੀਰਜ ਨੂੰ) ਨਹੀਂ ਪੁਜ ਸਕਦੇ।"