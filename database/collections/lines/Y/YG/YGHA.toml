[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੀ; ਮਹਾ ਬਿਖੜੀ ਕਾਰ ॥"
page = 837
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Immensely arduous is His service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਕਠਨ ਹੈ ਉਸ ਦੀ ਟਹਿਲ ਸੇਵਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It is so very difficult to serve Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਭਗਤੀ ਰੂਪੀ ਕਾਰ ਕਰਨੀ (ਮਹਾ ਬਿਖੜੀ) ਅਤੀ ਕਠਨੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਪਰਮਾਤਮਾ) ਦੀ (ਸੇਵਾ-ਭਗਤੀ ਦੀ) ਕਾਰ ਬਹੁਤ ਔਖੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੀ = ਜਿਸ (ਪਰਮਾਤਮਾ) ਦੀ। ਬਿਖੜੀ = ਔਖੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero servir a nuestro Señor y Maestro es inmensamente difícil."