type = "primary"
data = "ਤਿਨੈ ਨ ਦ੍ਰਿਸਟ ਤਰੇ ਆਨਤ ਭਯੋ ॥"
page = 66

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Slimilarly the slave Hussain was puffed up with ego, he did not care to notice them."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਨਜ਼ਰ ਥਲੇ ਹੀ ਨਾ ਲਿਆਂਦਾ।"