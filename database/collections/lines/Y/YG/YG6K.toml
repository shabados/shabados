[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੈਣਿ ਦਿਨਸੁ ਕਰ ਜੋੜਿ; ਹਰਿ ਹਰਿ ਧਿਆਈਐ ॥੧॥"
page = 398
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With joined hands night and day meditate on the Lord God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੱਥ ਬੰਨ੍ਹ ਕੇ ਰਾਤ ਦਿਨ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, with your palms pressed together, meditate on the Lord, Har, Har. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਤ੍ਰਿ ਦਿਨ ਹਾਥ ਜੋੜਿ ਕਰ ਤਿਸੁ ਹਰਿ ਕੇ ਨਾਮ ਕਾ ਹਰ ਪ੍ਰਕਾਰ ਸੇ ਜਾਪੁ ਕਰੀਏ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਅੱਗੇ ਦੋਵੇਂ ਹੱਥ ਜੋੜ ਕੇ ਸਦਾ ਉਸ ਦਾ ਧਿਆਨ ਧਰਨਾ ਚਾਹੀਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੈਣਿ = ਰਾਤ। ਕਰ ਜੋੜਿ = (ਦੋਵੇਂ) ਹੱਥ ਜੋੜ ਕੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué no habitar en Él día y noche, y con nuestras palmas juntas meditar en Él, Jar, Jar? (1)"