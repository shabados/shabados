[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਡਰਿਆ ਡਰੁ ਜਾਣੀਐ; ਬਾਝੁ ਗੁਰੂ. ਗੁਬਾਰੁ ॥੩॥"
page = 54
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Know that dread is for those who fear not the Lord. Without the Guru there is pitch darkness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਾਣ ਲੈ ਕਿ ਭੈ ਉਨ੍ਹਾਂ ਲਈ ਹੈ ਜੋ ਸਾਹਿਬ ਤੋਂ ਨਹੀਂ ਡਰਦੇ। ਗੁਰਦੇਵ ਜੀ ਦੇ ਬਗ਼ੈਰ ਘੁੱਪ ਅਨ੍ਹੇਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who does not fear God shall live in fear; without the Guru, there is only pitch darkness. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਿਗੁਰੂ! ਜੋ ਤੇਰੇ ਭੈ ਸੇ ਰਹਤ ਹੈਂ ਤਿਨ ਕੋ ਜਮ ਕਾ ਭੈ ਪ੍ਰਾਪਤਿ ਹੋਵੇਗਾ, ਏਹੁ ਸਾਸਤ੍ਰੋਂ ਦ੍ਵਾਰਾ ਜਾਣੀਤਾ ਹੈ, ਕਿਉਂਕਿ ਗੁਰੋਂ ਸੇ ਬਿਨਾ ਅਗ੍ਯਾਨ ਰੂਪੁ ਅੰਧਕਾਰੁ ਹੋ ਰਹਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਰਨ ਤੋਂ ਬਿਨਾ (ਇਹ ਜੀਵਨ-ਸਫ਼ਰ ਜੀਵਾਂ ਵਾਸਤੇ) ਘੁੱਪ ਹਨੇਰਾ ਹੈ। ਹੇ ਪ੍ਰਭੂ! ਜੇਹੜੇ ਜੀਵ ਤੇਰਾ ਡਰ-ਭਉ ਨਹੀਂ ਰੱਖਦੇ, ਉਹਨਾਂ ਨੂੰ ਦੁਨੀਆ ਦਾ ਸਹਮ ਸਹਾਰਨਾ ਪੈਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਬਾਰੁ = ਘੁੱਪ ਹਨੇਰਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y aquél que no tiene Temor Reverencial por el Señor, vive en el miedo, pues sin Él, todo es oscuridad. (3)"