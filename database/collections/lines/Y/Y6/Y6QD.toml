[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਉਨ ਸਮੈ ਸੁਖਦਾਇਕ ਥੀ ਰਿਤੁ; ਅਉਸਰ ਯਾਹਿ ਭਈ ਦੁਖਦਾਈ ॥੮੭੫॥"
page = 383

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They all looked fine, that time was very comfortable and now this time has become extremely agonising.875."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਵੇਲੇ (ਇਹ) ਰੁਤ ਸੁਖਦਾਇਕ ਸੀ, (ਪਰ) ਇਸ ਅਵਸਰ ਤੇ ਦੁਖਦਾਇਕ ਹੋ ਗਈ ਹੈ ॥੮੭੫॥"