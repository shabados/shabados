[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਉਖੀ ਘੜੀ. ਨ ਦੇਖਣ ਦੇਈ; ਅਪਨਾ ਬਿਰਦੁ ਸਮਾਲੇ ॥"
page = 682
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Aware of His innate nature, the Lord lets not His slave see the difficult hour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਧਰਮ ਨੂੰ ਚੇਤੇ ਕਰਦਾ ਹੋਇਆ, ਸੁਆਮੀ ਆਪਣੇ ਗੋਲੇ ਨੂੰ ਔਖਾ ਵੇਲਾ ਨਹੀਂ ਦੇਖਣ ਦਿੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He does not let His devotees see the difficult times; this is His innate nature."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਦਾਸੋਂ ਕੋ ਸ੍ਵਾਮੀ ਔਖੀ ਘੜੀ, ਭਾਵ ਕਸਟ ਕਾ ਸਮਾਂ ਦੇਖਣੇ ਨਹੀਂ ਦੇਤਾ ਹੈ, ਅਪਨਾ ਬਿਰਦ ਸਮਾਲਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਉਹ ਪ੍ਰਭੂ ਆਪਣੇ ਸੇਵਕ ਨੂੰ) ਕੋਈ ਦੁੱਖ ਦੇਣ ਵਾਲਾ ਸਮਾ ਨਹੀਂ ਵੇਖਣ ਦੇਂਦਾ, ਉਹ ਆਪਣਾ ਮੁੱਢ-ਕਦੀਮਾਂ ਦਾ (ਪਿਆਰ ਵਾਲਾ) ਸੁਭਾਉ ਸਦਾ ਚੇਤੇ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਉਖੀ = ਦੁੱਖ ਦੇਣ ਵਾਲੀ। ਦੇਈ = ਦੇਂਦਾ। ਬਿਰਦੁ = ਮੁੱਢ-ਕਦੀਮਾਂ ਦਾ (ਪਿਆਰ ਵਾਲਾ) ਸੁਭਾਉ। ਸਮਾਲੇ = ਚੇਤੇ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor no trae ningún sufrimiento a Sus sirvientes y así cumple con Su Naturaleza Esencial."