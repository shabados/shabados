[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਡਾਰਤ ਹੈ ਅਲਿਤਾ ਬਨਿਤਾ; ਛਟਿਕਾ ਸੰਗਿ ਮਾਰਤ ਬੈਸਨ ਥੋਰੀ ॥"
page = 314

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Various colours were splashed on women and the women beat the men with staffs (with affection)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਛੋਟੀ ਉਮਰ ਦੇ (ਬਾਲਕ) ਅਲਤਾ (ਗੁਲਾਲ) ਪਾਉਂਦੇ ਹਨ, ਪਿਚਕਾਰੀਆਂ ਨਾਲ (ਰੰਗ) ਛਿੜਕਦੇ ਹਨ।"