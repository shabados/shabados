[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਸਮਝੋ, ਉਹ ਸਾਰੇ ਫਿਕਰਾਣ ਅਤੇ ਅੰਦੇਸ਼ਿਆਣ ਤੋਣ ਮੁਕਤ ਹੋ ਗਿਆ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਗਸ਼ਤ ਫ਼ਾਰਿਗ ਅਜ਼ ਹਮਾ ਤਸ਼ਵੀਸ਼ੋ ਰੰਜ ॥੧੭੦॥"

[[content]]
assets = ["KEGP"]
