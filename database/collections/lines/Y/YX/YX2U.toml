[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਸਇ ਕਰੋਧੁ; ਸਰੀਰਿ ਚੰਡਾਰਾ ॥"
page = 759
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wrath, the pariah, abides within the body."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁੱਸਾ, ਚੰਡਾਲ, ਦੇਹ ਦੇ ਅੰਦਰ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Anger is the outcaste which hides within his body;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਰੋਧ ਚੰਡਾਲ ਸਰੀਰ ਮੇਂ ਬਸਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਦੇ ਸਰੀਰ ਵਿਚ ਚੰਡਾਲ ਕ੍ਰੋਧ ਵੱਸਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਸਇ = ਬਸੈ, ਵੱਸਦਾ ਹੈ। ਸਰੀਰਿ = ਸਰੀਰ ਵਿਚ। ਚੰਡਾਰਾ = ਚੰਡਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El enojo es el descastado que se esconde en tu interior"