[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਰੈ ਲਾਗਿ ਸੰਨ︀ਯਾਸ ਜੋਗ ਅਪ੍ਰਮਾਨੰ ॥੧੩੪॥"
page = 645

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And many people wearing matted locks on their head, practiced Yoga and Sannyas.134."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬੇਅੰਤ ਲੋਗ ਸੰਨਿਆਸ ਯੋਗ ਕਰਨ ਲਗ ਗਏ ਹਨ ॥੧੩੪॥"