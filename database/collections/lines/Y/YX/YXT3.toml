data = "ਤੁਮਰੇ ਅਰਥਹਿ ਬੈਦ; ਬੋਲਿ ਮੈ ਰਾਖਿਯੋ ॥"
page = 817

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Just for him (Zaahid Khan)."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਮੈਂ ਤੁਹਾਡੇ ਲਈ ਹੀ ਵੈਦ ਬੁਲਾ ਰਖਿਆ ਹੈ।"