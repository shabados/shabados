[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਸਮਗ੍ਰੀ; ਜਾ ਕਾ ਤਨਾ ॥"
page = 294
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The whole creation is His Body."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੀ ਰਚਨਾ ਉਸ ਦੀ ਦੇਹਿ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All the creation is His Body."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੰਪੂਰਨ ਸਮਗਰੀ ਸੰਸਾਰ ਜਿਸ ਕਾ (ਤਨਾ) ਸਰੂਪ ਵਾ ਤਾਣਿਆ ਹੂਆ ਵਾ ਪੁਤ੍ਰ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ ਦੇ) ਸਾਰੇ ਪਦਾਰਥ ਜਿਸ ਪ੍ਰਭੂ ਦਾ ਸਰੀਰ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਨਾ = ਸਰੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La creación entera forma parte de Su Cuerpo"