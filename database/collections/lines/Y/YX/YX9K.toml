[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਾਚਹਿ ਪੁਸਤਕ ਵੇਦ ਪੁਰਾਨਾਂ ॥"
page = 1043
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some read books, the Vedas and Puranas."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਗ੍ਰੰਥਾ, ਵੇਦਾਂ ਅਤੇ ਪੁਰਾਣਾ ਨੂੰ ਪੜ੍ਹਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some read scriptures, the Vedas and the Puraanas."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬੇਦੋਂ ਪੁਰਾਨੋਂ ਕੇ ਪੁਸਤਕੋਂ ਕੋ ਇਕ ਵਾਚਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਤੋਂ ਖੁੰਝ ਕੇ ਪੰਡਿਤ ਲੋਕ) ਵੇਦ ਪੁਰਾਣ ਆਦਿਕ (ਧਰਮ-) ਪੁਸਤਕਾਂ ਪੜ੍ਹਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਾਚਹਿ = ਪੜ੍ਹਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno lee los Vedas, los Puranas y otros Textos Sagrados,"