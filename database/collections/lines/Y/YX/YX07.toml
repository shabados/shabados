[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕਿ ਉਦਾਸੀ; ਇਕਿ ਘਰ ਬਾਰੀ ॥"
page = 1076
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some are renouncers and some who keep the household."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਤਿਆਗੀ ਹਨ ਅਤੇ ਕਈ ਗ੍ਰਿਹਸਤੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some turn away from the world in renunciation, and some maintain their households."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਕ ਉਦਾਸੀ ਔ ਇਕ ਘਰਬਾਰੀ ਅਰਥਾਤ ਗ੍ਰਸਤੀ ਉਤਪਤ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਈ ਤਿਆਗੀ ਤੇ ਕਈ ਗ੍ਰਿਹਸਤੀ ਬਣਾ ਦਿੱਤੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਦਾਸੀ = ਵਿਰਕਤ। ਘਰਬਾਰੀ = ਗ੍ਰਿਹਸਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mientras que otros se recluyen o se conservan en su hogar."