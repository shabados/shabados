[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹਉਮੈ ਦੁਰਮਤਿ ਪਰਹਰੀ; ਗੁਰਮਤਿ ਸਤਿਗੁਰ ਪੁਰਖੁ ਆਰਾਧੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He renounces egotist ill thoughts and adopting the teachings of the true Guru adores the Timeless Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਹਉਮੈ ਅਰ ਦੁਰਮਤ ਤਿਆਗ ਦਿੱਤੀ ਹੈ ਗੁਰਮਤ ਲੈਕੇ ਸਤਿਗੁਰ ਪੁਰਖ (ਗੁਰੂ ਨਾਨਕ ਦੇਵ) ਦਾ ਅਰਾਧਨ ਕਰਦੇ ਹਨ।"