type = "primary"
data = "ਜੈਸਕ ਲੰਕਿ ਰਾਵਣ ਅਰੁ ਰਾਮਾ ॥੪੪॥"
page = 186

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "A fierce fighting ensued and it appeared that the war was going on between Rama and Ravana in Sri Lanka.44."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਹਾ ਕਿ ਲੰਕਾ ਵਿਚ ਰਾਵਣ ਅਤੇ ਰਾਮ ਚੰਦਰ ਵਿਚ ਹੋਇਆ ਸੀ ॥੪੪॥"