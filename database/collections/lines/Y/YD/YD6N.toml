[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਕਾਰਣਿ; ਸਦ ਹੀ ਝੂਰੈ ॥"
page = 893
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou ever longest for worldly valuable,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੰਸਾਰੀ ਪਦਾਰਥਾਂ ਲਈ ਹਮੇਸ਼ਾਂ ਹੀ ਲੋਚਦਾ ਰਹਿੰਦਾ ਹੈਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You continually yearn for Maya,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਯਾ ਕੇ ਵਾਸਤੇ ਤੂੰ ਸਦਾ ਹੀ ਝੂਰਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਸਾਕਤ ਮਨੁੱਖ) ਸਦਾ ਹੀ ਮਾਇਆ ਦੀ ਖ਼ਾਤਰ ਚਿੰਤਾ-ਫ਼ਿਕਰ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਦ ਹੀ = ਸਦਾ ਹੀ। ਕਾਰਣਿ = ਦੀ ਖ਼ਾਤਰ। ਝੂਰੈ = ਚਿੰਤਾ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Te preocupa Maya constantemente,"