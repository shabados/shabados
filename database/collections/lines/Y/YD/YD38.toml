[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖਾਲਕ ਕਉ ਆਦੇਸੁ; ਢਾਢੀ ਗਾਵਣਾ ॥"
page = 148
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I, the minstrel, make obeisance unto the Creator and sing His praises."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕੀਰਤਨੀਆਂ, ਸਿਰਜਣਹਾਰ ਨੂੰ ਪ੍ਰਣਾਮ ਕਰਦਾ ਅਤੇ ਉਸ ਦਾ ਜੱਸ ਅਲਾਪਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I humbly bow to the Creator Lord; I am a minstrel singing His Praises."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਖਾਲਕ) ਸ੍ਰਿਸਟੀ ਕੇ ਰਚਨੇ ਵਾਲੇ ਪ੍ਰਮੇਸ੍ਵਰ ਕੋ (ਆਦੇਸੁ) ਨਮਸਕਾਰ ਕਰ ਕੇ ਤਿਸ ਕੇ ਜਸ ਕੋ ਢਾਢੀ ਸਮ ਗਾਵਣਾ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਾਲਕ-ਪ੍ਰਭੂ ਨੂੰ ਸਿਰ ਨਿਵਾਂਦਾ ਹੈ, ਢਾਢੀ ਬਣ ਕੇ ਉਸ ਦੇ ਗੁਣ ਗਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਦੇਸੁ = ਨਮਸਕਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Yo saludo a mi Creador, pues soy un trovador en Su Puerta."