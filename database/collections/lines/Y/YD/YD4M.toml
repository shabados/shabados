[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੋ ਰੇ; ਹਰਿ ਰਸੁ ਮੀਠਾ ॥"
page = 886
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man, so sweet is the Lord's elixir."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੰਦੇ! ਐਹੋ ਜਿਹਾ ਮਿੱਠੜਾ ਹੈ ਪ੍ਰਭੂ ਦਾ ਅੰਮ੍ਰਿਤ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such is the sweet, subtle essence of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭਾਈ ਐਸਾ ਜੋ ਹਰੀ ਹੈ ਤਿਸ ਕਾ ਆਨੰਦ ਮੀਠਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਸੁਆਦ ਅਸਚਰਜ ਹੈ ਮਿੱਠਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇ = ਹੇ ਭਾਈ! ਐਸੋ = (ਭਾਵ) ਅਸਚਰਜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Esencia del Señor es Dulce,"