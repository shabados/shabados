[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਯਹ ਤ੍ਰਿਯ ਹਠੀ ਰਾਵਹੂੰ ਜਾਨ︀ਯੋ ॥"
page = 927

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In spite of beating she did not confess and the Raja thought she was stubborn."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਇਹ ਇਸਤਰੀ ਬਹੁਤ ਹਠ ਵਾਲੀ ਹੈ।"