[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਜੇ ਚਰਮ ਬਰਮੰ ਧਰੇ ਸੀਸਿ ਟੋਪੰ ॥"
page = 105

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She bedecked herself with shield and armour and wore the steel-helmet on her head."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਿਰ ਉਤੇ (ਲੋਹੇ ਦਾ) ਟੋਪ ਰਖ ਕੇ ਢਾਲ ਅਤੇ ਕਵਚ ਸਜਾ ਲਿਆ।"