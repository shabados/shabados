data = "ਦੇਵਾਨ ਦੇਵ ਮਹਿਮਾ ਅਨੂਪ ॥੯੯॥"
page = 642

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is Vice-less, indivisible, God of gods and unique.99."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜੋ) ਦੇਵਤਿਆਂ ਦਾ ਦੇਵਤਾ ਅਤੇ ਅਨੂਪਮ ਮਹਿਮਾ ਵਾਲਾ ਹੈ ॥੯੯॥"