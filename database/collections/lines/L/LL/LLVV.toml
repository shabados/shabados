[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਨਿ ਤਾ ਕੈ; ਮਿਟਹਿ ਸੰਤਾਪ ॥"
page = 1142
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By His meditations suffering is effaced."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਊਸ ਦੀ ਬੰਦਗੀ ਦੁਆਰਾ ਦੁਖ ਕੱਟੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating in remembrance on Him, sufferings are erased."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਸਿਮਰਨੇ ਸੇ ਅਨੇਕ ਸੰਤਾਪ ਮਿਟ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਨ ਦੀ ਬਰਕਤ ਨਾਲ (ਸਾਰੇ) ਦੁੱਖ-ਕਲੇਸ਼ ਮਿਟ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕੈ ਸਿਮਰਨਿ = ਉਸ (ਪ੍ਰਭੂ) ਦੇ ਸਿਮਰਨ ਦੀ ਬਰਕਤਿ ਨਾਲ। ਮਿਟਹਿ = ਮਿਟ ਜਾਂਦੇ ਹਨ {ਬਹੁ-ਵਚਨ}। ਸੰਤਾਪ = ਦੁੱਖ-ਕਲੇਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Contemplándolo todos nuestros sufrimientos son erradicados,"