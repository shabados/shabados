[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਹਜੇ. ਕਾਲੁ ਵਿਡਾਰਿਆ; ਸਚ ਸਰਣਾਈ ਪਾਇ ॥"
page = 68
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By entering the sanctuary of the True One, death is easily destroyed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿਪੁਰਖ ਦੀ ਸਰਣਾਗਤ ਲੈਣ ਦੁਆਰਾ, ਮੌਤ ਸੂਖੈਨ ਹੀ ਮਾਰੀ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the poise of intuitive balance, death is destroyed, entering the Sanctuary of the True One."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸਹਜੇ) ਸਚੇ ਪ੍ਰਮੇਸ੍ਵਰ ਕੀ ਸਰਣਿ ਕੋ ਪ੍ਰਾਪਤਿ ਹੋ ਕਰ ਕੇ ਸੁਭਾਵਕ ਹੀ ਤਿਨ੍ਹੋਂ ਨੇ ਕਾਲ ਕੋ ਮਾਰ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦੀ ਸਰਨ ਪੈ ਕੇ ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਟਿਕ ਕੇ ਜਿਨ੍ਹਾਂ ਨੇ ਆਤਮਕ ਮੌਤ ਨੂੰ ਮਾਰ ਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਲੁ = ਮੌਤ, ਮੌਤ ਦਾ ਡਰ, ਆਤਮਕ ਮੌਤ। ਵਿਡਾਰਿਆ = ਮਾਰਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En el Estado de Serenidad, uno mata a la muerte y se va al Santuario del Uno Verdadero."