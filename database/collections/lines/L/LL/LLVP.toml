[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੁ ਨਾਨਕੁ ਬੋਲੈ; ਦਰਗਹ ਪਰਵਾਨੁ ॥੨॥੬॥੮੬॥"
page = 821
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever Guru Nanak utters, that is approved in the Lord's court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਛ ਭੀ ਗੁਰੂ ਨਾਨਕ ਜੀ ਉਚਾਰਦੇ ਹਨ, ਉਹ ਸਾਹਿਬ ਦੇ ਦਰਬਾਰ ਅੰਦਰ ਕਬੂਲ ਪੈ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Guru Nanak speaks - it is confirmed in the Court of the Lord. ||2||6||86||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜੋ ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਤਿਸ ਕੇ ਜਸ ਕੋ (ਬੋਲੈ) ਉਚਾਰਤੇ ਹੈਂ, ਸੋ (ਦਰਗਾਹ) ਸਤਸੰਗ ਵਾ ਸਚਖੰਡ ਮੇਂ ਪ੍ਰਵਾਨ ਹੋਤੇ ਹੈਂ॥੨॥੬॥੮੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਚੇਤਾ ਰੱਖ) ਗੁਰੂ ਨਾਨਕ (ਉਹੀ ਕੁਝ) ਆਖਦਾ ਹੈ (ਜੋ ਪਰਮਾਤਮਾ ਦੀ) ਦਰਗਾਹ ਵਿਚ ਪਰਵਾਨ ਹੈ ॥੨॥੬॥੮੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਵਾਨੁ = ਕਬੂਲ ॥੨॥੬॥੮੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak, el Guru, recita, es aprobado por Dios. (2-6-86)"