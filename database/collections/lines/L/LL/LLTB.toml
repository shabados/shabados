[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤ੍ਰਿਯਾ ਚਰਿਤ੍ਰ ਨ ਕਿਨਹੂੰ ਪਾਯੋ ॥੩੦॥"
page = 814

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But his ministers made him to perceive that the Chritars were not easily discernable.(30)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਇਸਤਰੀਆਂ ਦੇ ਚਰਿਤ੍ਰਾਂ ਦਾ ਕਿਸੇ ਨੇ ਵੀ ਅੰਤ ਨਹੀਂ ਪਾਇਆ ਹੈ ॥੩੦॥"