[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ. ਕਿਉ ਕਰਿ; ਪਿਰ ਕਉ ਮਿਲਉ ਇਆਣੀ ॥"
page = 561
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How can I, the childish one, meet with my Spouse?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਨਾਦਾਨ ਆਪਣੇ ਪਤੀ ਨੂੰ ਕਿਸ ਤਰ੍ਹਾਂ ਮਿਲ ਸਕਦੀ ਹਾਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How can I meet with my Husband? I don't know."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ (ਇਆਣੀ) ਮੂਰਖ ਅਪਨੇ ਪਤੀ ਤੇਰੇ ਸੇ ਕੈਸੇ ਕਰ ਕੇ ਮਿਲੂੰ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਮੂਰਖ ਹਾਂ, ਮੈਂ ਪ੍ਰਭੂ-ਪਤੀ ਨੂੰ ਕਿਵੇਂ ਮਿਲ ਸਕਦੀ ਹਾਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਮਿਲਉ = ਮਿਲਉਂ, ਮੈਂ ਮਿਲਾਂ। ਇਆਣੀ = ਅੰਞਾਣ, ਮੂਰਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cómo podré entonces yo, el ignorante, encontrar a mi Señor?"