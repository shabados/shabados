data = "ਕੀਤੇ ਕੈ ਕਹਿਐ; ਕਿਆ ਹੋਇ ॥੧॥"
page = 25
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What can be done at the bidding of the created one?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਣਾਏ ਹੋਏ ਦੇ ਆਖਣ ਤੇ ਕੀ ਹੋ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What can be done by the order of the created beings? ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਤਪਤਿ ਕਰੇ ਹੂਏ ਜੀਵ ਕੇ ਕਹਿਨੇ ਸੇ ਕ੍ਯਾ ਹੋ ਸਕਤਾ ਹੈ॥੧॥☬ਔਰ ਤੂੰ  ਕੈਸਾ ਹੈਂ?☬ਸੋ ਆਗੇ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੈਦਾ ਕੀਤੇ ਜੀਵ ਦੇ ਆਖਿਆਂ ਕੁਝ ਨਹੀਂ ਬਣ ਸਕਦਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ ਕਹਿਐ = ਦੇ ਕਹਿਣ ਨਾਲ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Qué es lo que la criatura puede hacer por sí misma? (1)"