data = "ਤੁਮ ਕੋ ਜੋ ਪ੍ਰਾਨਨ ਤੇ ਪ︀ਯਾਰੀ ॥੯੯॥"
page = 876

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Listen my Master, I am your wife, and love you more than my life.’(99)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੁਹਾਨੂੰ ਜੋ ਪ੍ਰਾਣਾਂ ਤੋਂ ਪਿਆਰੀ ਹੈ ॥੯੯॥"