[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਨੁ ਭਜਨੁ ਦਇਆ. ਨਹੀ ਕੀਨੀ; ਤਉ ਮੁਖਿ ਚੋਟਾ ਖਾਹਿਗਾ ॥੨॥"
page = 1106
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou do not remember or contemplate on God and practise not compassion, so thou shall suffer strokes on thy face."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹਰੀ ਦਾ ਚਿੰਤਨ ਤੇ ਆਰਾਧਨ ਨਹੀਂ ਕਰਦਾ ਅਤੇ ਤਰਸ਼ ਨਹੀਂ ਖਾਂਦਾ; ਇਸ ਲਈ ਤੂੰ ਆਪਣੇ ਮੂੰਹ ਉਤੇ ਸੱਟਾਂ ਸਹਾਰੇਗਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You do not remember the Lord, or vibrate upon Him in meditation, and you do not practice compassion; you shall be beaten on your face. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਕਰ ਕੇ ਸਿਮਰਨ ਔ ਬਾਣੀ ਕਰ ਕੇ ਭਜਨ ਪੁਨਃ ਸਰੀਰ ਕਰ ਕਿਸੇ ਪਰ ਦਇਆ ਭੀ ਨਹੀਂ ਕਰੀ ਹੈ, ਤਿਸ ਤੇ ਤੂੰ ਮੂੰਹ ਪਰ ਚੋਟਾਂ ਖਾਂਹਿਗਾ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੁਣ ਪ੍ਰਭੂ ਦਾ ਸਿਮਰਨ ਭਜਨ ਨਹੀਂ ਕਰਦਾ, ਤੂੰ ਦਇਆ ਨਹੀਂ ਪਾਲਦਾ, ਮਰਨ ਵੇਲੇ ਦੁਖੀ ਹੋਵੇਂਗਾ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਖਿ = ਮੂੰਹ ਉਤੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ni practicado la Compasión, te vas a estrellar de cara. (2)"