[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੰਡਿਤ ਲੋਗਹ ਕਉ; ਬਿਉਹਾਰ ॥"
page = 343
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To join letters is the business of the literate person."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੱਖਰਾਂ ਨੂੰ ਜੋੜਨਾ ਵਿਦਵਾਨ ਪੁਰਸ਼ਾਂ ਦਾ ਕਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It is the business of the scholarly person to join letters."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਲੋਕਕ ਪੰਡਤੋਂ ਕਾ ਏਹ ਬਿਉਹਾਰ ਹੀ ਮਾਨਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਪੰਡਿਤ ਲੋਕਾਂ ਨੂੰ ਤਾਂ ਇਹ ਵਿਹਾਰ ਲੱਭਾ ਹੋਇਆ ਹੈ (ਕਿ ਅੱਖਰ ਜੋੜ ਕੇ ਹੋਰਨਾਂ ਨੂੰ ਸੁਣਾ ਦੇਂਦੇ ਹਨ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ, ਦਾ। ਬਿਉਹਾਰ = ਵਿਹਾਰ, ਰੋਜ਼ੀ ਕਮਾਵਣ ਦਾ ਢੰਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los eruditos comercian sólo con palabras,"