[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾਨਿ ਕਮਾਨਨਿ ਮਾਰਤ ਬਾਨਨ; ਸੂਰਨ ਕੇ ਚਿਤ ਚਉਪ ਚਢਿਯੋ ਹੈ ॥੧੭੦੬॥"
page = 468

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors also pulled their bows and began to discharge arrows in excitement.1706."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਧੁਨਸ਼ ਨੂੰ ਕਸ ਕਸ ਕੇ ਬਾਣ ਮਾਰਦਾ ਹੈ ਅਤੇ ਸੂਰਮਿਆਂ ਦੇ ਚਿਤ ਵਿਚ ਉਤਸਾਹ ਵਧਿਆ ਹੋਇਆ ਹੈ ॥੧੭੦੬॥"