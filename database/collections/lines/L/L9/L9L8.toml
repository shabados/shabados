[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸਾ ਜੋਗੀ; ਨਉ ਨਿਧਿ ਪਾਵੈ ॥"
page = 477
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such a Yogi obtains the nine treasures."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਹੋ ਜੇਹਾ ਯੋਗੀ ਨੌਂ ਖਜਾਨੇ ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such a Yogi obtains the nine treasures."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸਾ ਜੋ ਜੋਗੀ ਹੈ, ਸੋ ਨਉ ਨਿਧਿਓਂ ਕੋ ਪਾਉਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਹੈ ਅਸਲ ਜੋਗੀ, ਉਸ ਨੂੰ (ਮਾਨੋ) ਨੌ ਖ਼ਜ਼ਾਨੇ ਮਿਲ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਉ ਨਿਧਿ = ਨੌ ਖ਼ਜ਼ਾਨੇ। ਬ੍ਰਹਮੁ = ਪਰਮਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal Yogui realiza los Nueve Tesoros del ser,"