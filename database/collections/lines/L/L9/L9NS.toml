[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਹੁਰਿ ਕਮਾਵਹਿ; ਹੋਇ ਨਿਸੰਕ ॥"
page = 1348
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He then commits sins again without any fear."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਫਿਰ ਨਿੱਡਰ ਹੋ ਪਾਪ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Then they commit them again, without fear of the consequences."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਨਿਸੰਕ ਹੋਇ ਕਰ ਕੇ ਔਰ ਪਾਪ ਕਮਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇ) ਝਾਕਾ ਲਾਹ ਕੇ ਮੁੜ ਮੁੜ (ਉਹੀ ਪਾਪ) ਕਰੀ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਹੁਰਿ = ਮੁੜ, ਫਿਰ। ਨਿਸੰਕ = ਝਾਕਾ ਲਾਹ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y claman que han sido limpiados totalmente, pero vuelven a cometerlos sin ningún temor a las consecuencias."