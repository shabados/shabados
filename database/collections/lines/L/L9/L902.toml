[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "is to abide with the vipers,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਗਾ ਦੇ ਨਲ ਵਸਣਾ ਹੈ।"

