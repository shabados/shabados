assets = ["DSSK"]
type = "translation"
language = "en"
data = "is to live with poisonous snakes;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੰਗ (ਭੁਇਅੰਗਨਿ) ਸਰਪੋਂ ਕਾ (ਬਸਰੀਆ) ਬਾਸਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੱਪਾਂ ਨਾਲ ਵਾਸ (ਦੇ ਬਰਾਬਰ) ਹੈ,"

