[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਸਿਧ ਜਤੀ ਜੋਗੀ ॥"
page = 275
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many millions are the seers celibates and Yogis."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਕ੍ਰੋੜ ਹਨ, ਕ੍ਰਾਮਾਤੀ ਬੰਦੇ, ਬ੍ਰਹਿਮਚਾਰੀ ਅਤੇ ਯੋਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions are Siddhas, celibates and Yogis."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਈ ਕ੍ਰੋੜੋਂ ਸਿਧ ਔ ਜਤੀ ਪੁਨਾ ਜੋਗੀ ਜਨ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਸ੍ਰਿਸ਼ਟਿ-ਰਚਨਾ ਵਿਚ) ਕਰੋੜਾਂ ਪੁੱਗੇ ਹੋਏ, ਤੇ ਕਾਮ ਨੂੰ ਵੱਸ ਵਿਚ ਰੱਖਣ ਵਾਲੇ ਜੋਗੀ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਧ = ਪੁੱਗਿਆ ਹੋਇਆ ਜੋਗੀ। ਜਤੀ = ਉਹ ਮਨੁੱਖ ਜਿਸ ਨੇ ਕਾਮ ਨੂੰ ਵੱਸ ਵਿਚ ਰੱਖਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Existen tantos célibes, Yoguis y videntes;"