[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹ ਪਸਰੈ ਪਾਸਾਰੁ; ਸੰਤ ਪਰਤਾਪਿ ॥"
page = 292
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wherever He spreads out creation that is for the glory of His saint."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਕਿਤੇ ਉਹ ਰਚਨਾ ਖਿਲਾਰਦਾ ਹੈ, ਉਹ ਉਸ ਦੇ ਸਾਧੂ ਦੇ ਤੇਜ ਲਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He unfolds the expanse of His creation for the glory of His Saint."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਹਾਂ ਅਪਨੀ ਈਸ੍ਵਰਜਤਾ ਕਾ ਪਸਾਰਾ ਪਸਾਰਿਆ ਹੈ, ਸੋ ਭੀ ਸੰਤ ਕੇ ਪ੍ਰਤਾਪ ਕੀ ਅਧਿਕਤਾ ਲੀਏ ਪਸਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰ ਥਾਂ ਸੰਤਾਂ ਦੀ ਮਹਿਮਾ ਵਾਸਤੇ ਪ੍ਰਭੂ ਜਗਤ ਦਾ ਖਿਲਾਰਾ ਖਿਲਾਰ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤ ਪਰਤਾਪਿ = ਸੰਤਾਂ ਦੇ ਪਰਤਾਪ ਵਾਸਤੇ, ਸੰਤਾਂ ਦੀ ਮਹਿਮਾ ਵਧਾਉਣ ਲਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todo lo que Dios ha creado, ha sido para la Gloria de Sus Santos."