[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰਾ ਮਨੁ; ਏਕੈ ਹੀ ਪ੍ਰਿਅ ਮਾਂਗੈ ॥"
page = 1209
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My soul longs for its only Beloved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਜਿੰਦੜੀ ਕੇਵਲ ਆਪਣੇ ਪ੍ਰੀਤਮ ਨੂੰ ਹੀ ਚਾਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind longs for the One Beloved Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਮਨ ਏਕ ਹੀ (ਪ੍ਰਿਅ) ਪਤੀ ਵਾਹਿਗੁਰੂ ਕੋ (ਮਾਗੈ) ਚਾਹਤਾ ਹੈ॥☬ਜੇ ਕਹੇ ਭਲਾ ਕੋਈ ਵੈਸਾ ਔਰ ਭੀ ਹੈ? ਸੋ ਕਹਿਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਮਨ ਸਿਰਫ਼ ਪਿਆਰੇ ਪ੍ਰਭੂ ਦਾ ਹੀ ਦਰਸਨ ਮੰਗਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਕੈ ਹੀ ਪ੍ਰਿਅ = ਏਕੈ ਪ੍ਰਿਅ ਹੀ, ਸਿਰਫ਼ ਪਿਆਰੇ ਪ੍ਰਭੂ ਦਾ (ਦਰਸਨ) ਹੀ। ਮਾਂਗੈ = ਮੰਗਦਾ ਹੈ {ਇਕ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi mente añora a Su Único Señor,"