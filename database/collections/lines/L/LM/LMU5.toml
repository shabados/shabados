[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਪਾਰਿ. ਗੋਵਿੰਦ ਨਾਏ ॥"
page = 408
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By dealing in the Lord's, Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਨਾਮ ਦੇ ਵਣਜ ਦੁਆਰਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Dealing in the Name of the Lord of the Universe,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਨੇ ਗੋਬਿੰਦ ਕੇ ਨਾਮ ਕਾ ਬਾਪਾਰ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦੇ ਵਪਾਰ ਵਿਚ ਲੱਗ ਪੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਪਾਰਿ = ਵਪਾਰ ਵਿਚ, ਵਣਜ ਦੀ ਰਾਹੀਂ। ਨਾਏ = ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tratando con el Naam, el Nombre del Señor,"