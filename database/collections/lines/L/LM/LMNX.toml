[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਹੈ ਰਾਮੁ; ਹੋਇ ਹੈ ਸੋਇ ॥੪॥"
page = 1165
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever the Lord does, that alone takes place\"."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਛ ਪ੍ਰਭੂ ਕਰਦਾ ਹੈ, ਕੇਵਲ ਉਹ ਹੀ ਹੁੰਦਾ ਹੈ।\""

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever the Lord does, that alone happens.\" ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਰਾਮ ਕਰੇਗਾ ਸੋ ਹੋਵੇਗਾ॥੪॥☬ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਬ ਇਹ ਉਤ੍ਰ ਨਾਮਦੇਵ ਨੇ ਕਹਾ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਕੁਝ ਹੁੰਦਾ ਹੈ ਜੋ ਪਰਮਾਤਮਾ ਕਰਦਾ ਹੈ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues lo que sea que viene, viene de Dios. (4)"