[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਤਾਂਬਾ; ਕੰਚਨੁ ਹੋਇ ਨਿਬਰਿਓ ॥੩॥"
page = 1158
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that copper is transmuted into gold."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਹ ਤਾਂਬਾ ਸੋਨੇ ਵਿੱਚ ਤਬਦੀਲ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "that copper is transformed into gold. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਤਾਂਬਾ (ਕੰਚਨੁ) ਸ੍ਵਰਨ ਰੂਪ ਹੀ ਹੋਇ ਨਿਬੜਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਉਹ ਤਾਂਬਾ ਸੋਨਾ ਹੀ ਬਣ ਜਾਂਦਾ ਹੈ ਤੇ ਆਪਣਾ ਆਪ ਮੁਕਾ ਦੇਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੰਚਨੁ = ਸੋਨਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así ese cobre se transforma en oro. (3)"