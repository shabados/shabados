[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੰਡਿਤ ਦਹੀ ਵਿਲੋਈਐ ਭਾਈ; ਵਿਚਹੁ ਨਿਕਲੈ ਤਥੁ ॥"
page = 635
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Pandit, if thou churnest curd, the butter comes out of it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੰਡਤ ਜੇਕਰ ਤੂੰ ਦਹੀ ਨੂੰ ਰਿੜਕੇ, ਤਾਂ ਇਸ ਵਿਚੋਂ ਮੱਖਣ ਨਿਕਲ ਆਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Pandit, by churning cream, butter is produced."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੰਡਤ ਜੀ! ਜੇਕਰ ਦਹੀਂ ਕੋ (ਬਿਲੋਈਐ) ਰਿੜਕੀਏ ਤੌ ਬੀਚ ਮੇਂ ਸੇ (ਤਥੁ) ਸਾਰ ਮਾਖਨ ਨਿਕਸਤਾ ਹੈ। ਭਾਵ ਯਹ ਕਿ ਜੌ ਤੱਤ ਸਿਖ੍ਯਾ ਕਾ ਵੀਚਾਰ ਕਰੀਏ ਤੌ ਆਤਮ ਅਨੰਦ ਰੂਪੀ ਤੱਤ ਨਿਕਸਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਦੀ ਖ਼ਾਤਰ) ਝੂਠ ਬੋਲ ਬੋਲ ਕੇ ਉਹ ਮਨੁੱਖ (ਆਤਮਕ ਮੌਤ ਲਿਆਉਣ ਵਾਲਾ ਇਹ ਝੂਠ-ਰੂਪ) ਜ਼ਹਿਰ ਖਾਂਦਾ ਰਹਿੰਦਾ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੰਡਿਤ = ਹੇ ਪੰਡਿਤ! ਵਿਲੋਈਐ = (ਜੇ) ਰਿੜਕੀਏ। ਤਥੁ = ਅਸਲ ਚੀਜ਼, ਮੱਖਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh erudito, si uno bate la crema de Dios, obtiene la mantequilla, la Esencia, pero si uno bate el agua del mundo,"