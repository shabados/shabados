[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਘਟਾ; ਕਰਤ ਪ੍ਰਤਿਪਾਲ ॥"
page = 290
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He nourishes all the beings."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰਿਆਂ ਜੀਵਾਂ ਦੀ ਪਰਵਰਿਸ਼ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the Nourisher of all beings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਸਰਬ ਘਟੋਂ ਕੀ ਪ੍ਰਤਿਪਾਲਨਾ ਕਰਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਰੇ ਸਰੀਰਾਂ ਦੀ ਪਾਲਣਾ ਕਰਨ ਵਾਲੇ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਤਿਪਾਲ = ਪਾਲਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el Protector de la Tierra."