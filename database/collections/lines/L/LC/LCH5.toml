[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੈ ਹੀ ਭਯੋ ਜਗਤ ਕੋ ਕਰਤਾ; ਜੋ ਮੈ ਕਰੌ ਸੁ ਹੋਈ ॥੧੦੫॥"
page = 685

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I am the creator of the world and whatever I shall do, that will happen.31.105."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹੀ ਜਗਤ ਦਾ ਕਰਤਾ ਹੋਇਆ ਹਾਂ, ਜੋ ਮੈਂ ਕਰਾਂਗਾ ਉਹੀ ਹੋਵੇਗਾ ॥੧੦੫॥"