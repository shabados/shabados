[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹਾ ਬਸਹਿ; ਪੀਤੰਬਰ ਪੀਰ ॥੧॥"
page = 478
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "where abide the religious guides with yellow robe."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਪੀਲੇ ਬਸਤਰਾ ਵਾਲੇ ਧਾਰਮਕ ਆਗੂ ਵੱਸਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the spiritual teacher in his yellow robes dwells there. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਸੰਤੋਂ ਮੇਂ (ਪੀਤੰਬਰ) ਪੀਤ ਬਿਸ਼ਨ ਧਾਰੀ ਬਿਸ਼ਨੂੰ ਪੀਰ ਬਸਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਸ੍ਰੀ ਪ੍ਰਭੂ ਜੀ ਵੱਸ ਰਹੇ ਹਨ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਹਾ = ਜਿੱਥੇ। ਬਸਹਿ = ਵੱਸ ਰਹੇ ਹਨ। ਪੀਤੰਬਰ ਪੀਰ = ਪ੍ਰਭੂ ਜੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el maestro de vestimenta amarilla vive ahí. (1)"