[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਣ ਗਾਵਤ; ਅਚੁਤ ਅਬਿਨਾਸੀ ॥"
page = 744
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I sing the praises of the immovable and imperishable Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਅਹਿੱਲ ਅਤੇ ਅਮਰ ਸਾਈਂ ਦਾ ਜੱਸ ਗਾਉਂਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I sing the Glorious Praises of the unchanging, eternal Lord God,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਅਚੁਤ) ਅਗਿੜ ਔ (ਅਬਿਨਾਸੀ) ਜਨਮ ਮਰਣ ਰਹਿਤ ਵਾਹਿਗੁਰੂ ਕੇ ਗੁਣ ਗਾਇਨ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਅਟੱਲ ਅਬਿਨਾਸੀ ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਗਾਂਦਿਆਂ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਚੁਤ = {अच्युत} ਕਦੇ ਨਾਹ ਡਿੱਗਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora canto la Alabanza de mi Eterno e Inamovible Señor,"