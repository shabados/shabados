[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਚਨੁ ਗੁਰੂ ਜੋ ਪੂਰੈ ਕਹਿਓ; ਮੈ ਛੀਕਿ ਗਾਂਠਰੀ ਬਾਧਾ ॥੧॥ ਰਹਾਉ ॥"
page = 1204
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The word, which the Perfect Guru has uttered; that I have firmly tied to my skirt. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਬਾਣੀ ਪੂਰਨ ਗੁਰਾਂ ਨੇ ਉਚਾਰਨ ਕੀਤੀ ਹੈ, ਉਸ ਨੂੰ ਘੁਟ ਕੇ ਆਪਣੇ ਪੱਲੇ ਨਾਲ ਬੰਨ੍ਹ ਲਿਆ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Word which the Perfect Guru has spoken, I have tied to my robe. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੂਰੇ ਗੁਰੋਂ ਨੇ (ਬਚਨ) ਉਪਦੇਸ ਕਹਿਓ ਹੈ, ਸੋ ਮੈਂ ਹਿਰਦੇ ਰੂਪੀ ਗਠੜੀ ਮੇਂ (ਛੀਕਿ) ਖੈਂਚ ਕਰ ਕੇ ਬਾਂਧ ਲੀਆ, ਭਾਵ ਦ੍ਰਿੜ ਕੀਆ ਹੈ॥੧॥ ਰਹਾਉ॥☬ਜੇ ਕਹੇਂ ਗੁਰੋਂ ਨੇ ਕਿਆ ਉਪਦੇਸ ਕੀਆ ਹੈ? ਸੋ ਕਹਿਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਜਿਹੜਾ ਬਚਨ (ਮੈਨੂੰ) ਪੂਰੇ ਗੁਰੂ ਨੇ ਦੱਸਿਆ ਹੈ, ਮੈਂ ਇਸ ਨੂੰ ਘੁੱਟ ਕੇ ਆਪਣੇ ਪੱਲੇ ਬੰਨ੍ਹ ਲਿਆ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰੂ ਪੂਰੈ = ਪੂਰੇ ਗੁਰੂ ਨੇ। ਛੀਕਿ = ਖਿੱਚ ਕੇ। ਗਾਂਠਰੀ = ਪੱਲੇ। ਬਾਧਾ = ਬੰਨ੍ਹ ਲਿਆ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, lo que sea que el Guru Perfecto ha decretado, eso es lo que he acumulado en mi túnica. (1-Pausa"