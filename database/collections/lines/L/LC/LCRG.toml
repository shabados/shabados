[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਚਕ ਜਨੁ ਜਾਚੈ; ਪ੍ਰਭ ਦਾਨੁ ॥"
page = 289
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I, a beggarly man beg a gift of Thee, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਇਕ ਮੰਗਤਾ ਮਨੁੱਖ, ਤੇਰੇ ਕੋਲੋ ਇਕ ਦਾਤ ਮੰਗਦਾ ਹਾਂ, ਹੇ ਸੁਆਮੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a beggar; I beg for this gift from You:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਜਾਚਕ ਜਨ ਤੁਝ ਸੇ ਇਹੁ ਦਾਨ ਮਾਂਗਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! (ਇਹ) ਮੰਗਤਾ ਦਾਸ (ਤੇਰੇ ਨਾਮ ਦਾ) ਦਾਨ ਮੰਗਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਚਕ ਜਨੁ = ਮੰਗਤਾ ਮਨੁੱਖ। ਜਾਚੈ = ਮੰਗਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, Tu Humilde Servidor Te pide un regalo,"