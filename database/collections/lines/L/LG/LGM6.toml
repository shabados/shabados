[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਬ ਦੈਤਨ ਕੋ ਮਨ ਡਰਿਓ; ਹਾ ਹਾ, ਕੀਓ ਬਖਾਨ ॥੧੩੧੮॥"
page = 428

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "With the infliction of the dagger, that mighty warrior breathed his last and all the mighty warriors, having fears in their minds, lamented.1318."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਦੈਂਤਾਂ ਦੇ ਮਨ ਡਰ ਗਏ ਹਨ ਅਤੇ ਹਾਇ ਹਾਇ ਕਰ ਕੇ ਬੋਲਣ ਲਗ ਗਏ ਹਨ ॥੧੩੧੮॥"