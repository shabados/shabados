data = "ਨਾਮ ਸੁਦਰਸਨ ਕੇ ਸਭੈ; ਨਿਕਸਤ ਜਾਹਿ ਅਪਾਰ ॥੫੭॥"
page = 720

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "many names of Sudarshan continue to be formed.57."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਸਾਰੇ ਨਾਮ 'ਸੁਦਰਸ਼ਨ' (ਚਕ੍ਰ) ਦੇ ਹਨ, (ਇਸ ਤਰ੍ਹਾਂ) ਅਪਾਰਾਂ ਨਾਂ ਨਿਕਲਦੇ ਆਣਗੇ ॥੫੭॥"