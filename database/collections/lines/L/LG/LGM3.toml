[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਗੁਣ ਕਉ; ਸੰਗਿ ਲੇਹੁ ਰਲਾਏ ॥"
page = 1078
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Blend Thou me, the meritless one, with Thee, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੈਨੂੰ, ਗੁਣ-ਵਿਹੂਣ ਨੂੰ, ਆਪਣੇ ਨਾਲ ਅਭੇਦ ਕਰ ਲੈ, ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am unworthy; please merge me into Yourself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਨਿਰਗੁਣ ਕੋ ਅਪਨੇ ਸੰਤੋਂ ਕੇ ਸੰਗ ਮਿਲਾਇ ਲੇਵਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਨੂੰ ਗੁਣ-ਹੀਣ ਨੂੰ ਗੁਰੂ ਦੀ ਸੰਗਤ ਵਿਚ ਰਲਾਈ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਗੁਣ = ਗੁਣ-ਹੀਨ। ਕਉ = ਨੂੰ। ਸੰਗਿ = ਗੁਰੂ ਦੀ ਸੰਗਤ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por favor, déjenme asociarme con ustedes, pues me encuentro sin ningún mérito."