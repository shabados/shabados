data = "ਬਸੇ ਤੀਰੁ ਸ਼ਮਸ਼ੇਰ ਕੀਮਤ ਗਿਰਾ ॥੪੯॥"
page = 1396

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And associating with his name, it was called Delhi.(49)"

