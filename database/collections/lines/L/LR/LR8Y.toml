[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਗੁਰ ਕੈ; ਸਦਾ ਬਲਿ ਜਾਈਐ ॥"
page = 1338
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am ever a sacrifice unto that Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਦੀਵ ਹੀ ਉਸ ਗੁਰੂ ਗੁਰੂ ਤੋਂ ਘੋਲੀ ਵੰਞਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am forever a sacrifice to that Guru;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸਤਿਗੁਰ ਕੈ ਊਪਰ ਸਦਾ ਬਲਿਹਾਰਨੇ ਜਾਈਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਗੁਰੂ ਤੋਂ ਸਦਾ ਕੁਰਬਾਨ ਜਾਣਾ ਚਾਹੀਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ ਬਲਿ ਜਾਈਐ = ਤੋਂ ਸਦਕੇ ਜਾਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ofrezco para siempre mi ser en sacrificio al Guru,"