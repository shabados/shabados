[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮੁ; ਜਿਸੁ ਕਿਰਪਾ ਕਰੈ ॥"
page = 899
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, to whom the Transcendent Lord shows mercy"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਉਤੇ ਪਰਮ ਪ੍ਰਭੂ ਮਿਹਰ ਧਾਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who is blessed by the Grace of the Supreme Lord God,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਊਪਰ ਪਰਮੇਸ੍ਵਰ ਕ੍ਰਿਪਾ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਉਤੇ ਪਰਮਾਤਮਾ ਮਿਹਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que goza de la Compasión del Señor"