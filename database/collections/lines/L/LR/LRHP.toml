[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਨਿ ਮੋਹੇ. ਬਹੁਤੇ ਬ੍ਰਹਮੰਡ ॥"
page = 892
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "She has bewitched good many worlds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਘਣੇਰੀਆਂ ਪੁਰੀਆਂ ਨੂੰ ਮੋਹਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "She has bewitched a great many worlds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਾਯਾ ਨੇ ਤੋ ਬਹੁਤੇ ਬ੍ਰਹਮੰਡ ਮੋਹ ਲੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਾਇਆ ਨੇ ਅਨੇਕਾਂ ਬ੍ਰਹਮੰਡਾਂ (ਦੇ ਜੀਵਾਂ) ਨੂੰ ਆਪਣੇ ਮੋਹ ਵਿਚ ਫਸਾਇਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਨਿ = ਉਸ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ella ha embrujado a muchos, muchos mundos,"