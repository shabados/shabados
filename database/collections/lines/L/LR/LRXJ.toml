[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚਾ ਨਾਮੁ; ਮੇਰਾ ਆਧਾਰੋ ॥"
page = 917
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Name is my only support."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਸੱਚਾ ਨਾਮ ਹੀ ਮੇਰਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Name is my only support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚਾ ਨਾਮੁ ਹੀ ਮੇਰਾ ਆਸਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਦੀ ਮੇਹਰ ਨਾਲ ਉਸ ਦਾ) ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਨਾਮ ਮੇਰੀ ਜ਼ਿੰਦਗੀ ਦਾ ਆਸਰਾ (ਬਣ ਗਿਆ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਧਾਰੋ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Nombre Verdadero del Señor es mi Único Soporte;"