[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਦਾ ਸੱਚਦਾਨੰਦ ਸਰਬੰ ਪ੍ਰਣਾਸੀ ॥"
page = 4
line = 4

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art ever Lord Truth, Consciousness and Bliss"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਦਾ ਸੱਤ, ਚਿਤ, ਆਨੰਦ ਸਰੂਪ ਅਤੇ ਸਭ ਦਾ ਨਾਸ਼ ਕਰਨ ਵਾਲੇ!"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਸਦਾ ਸੱਚਦਾਨੰਦ; ਸਰਬੰ ਪ੍ਰਣਾਸੀ ॥"