[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਭਲਾ ਨ ਹੇਤੁ ਵਿਸਾਰਦਾ; ਬੁਰਾ ਨ ਵੈਰੁ ਮਨਹੁ ਵਿਸਰਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The noble one never forgets good done to him whereas the evil doer does not forget enmity."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਭਲਾ ਹਿਤ ਨਹੀਂ ਛੱਡਦਾ, ਬੁਰਾ ਮਨੋਂ ਵੈਰ ਨਹੀਂ ਛੱਡਦਾ।"