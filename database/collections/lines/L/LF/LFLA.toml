[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਸਕਲ ਤੁਪਕ ਕੇ ਨਾਮ; ਸੁਬੁਧਿ ਬਿਚਾਰੀਐ ॥੧੦੦੦॥"
page = 778

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying “Tamchar-bhaginin”, utter the words “Jaachar-pati-shaatru” and consider all the names of Tupak.1000."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਾਰੇ ਬੁੱਧੀਮਾਨੋ! ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝ ਲਵੋ ॥੧੦੦੦॥"