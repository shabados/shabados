[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਕਉ; ਤੂੰ ਪ੍ਰਭ ਭਇਆ ਸਹਾਈ ॥"
page = 132
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He whose helper Thou hast become, O Lord!"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਸਹਾਇਕ ਤੂੰ ਬਣਿਆ ਹੈ, ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O God, that one, unto whom You have given shelter,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪੁਰਸ਼ ਕੋ, ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਸਹਾਇਤਾ ਕਰਣੇ ਵਾਲਾ ਹੋਇਆ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜਿਸ ਮਨੁੱਖ ਵਾਸਤੇ ਤੂੰ ਰਾਖਾ ਬਣ ਜਾਂਦਾ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਾਈ = ਮਦਦਗਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél a quien has hospedado, oh Señor,"