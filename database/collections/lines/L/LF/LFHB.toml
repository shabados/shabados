[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮੰਤੁ ਨ ਹੋਇ ਅਠੂਹਿਆਂ; ਹਥੁ ਸਪੀਂ ਪਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "It is such a person as not knowing even the mantra of a centipede lays his hand on a snake."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਬਿੱਛੁ ਦਾ ਮੰਤ੍ਰ ਨਹੀਂ ਆਉਂਦਾ ਪਰ ਸੱਪਾਂ ਨੂੰ ਹੱਥ ਪਾਉਂਦਾ ਹੈ।"