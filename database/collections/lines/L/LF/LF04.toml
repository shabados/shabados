[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਸਤਿਗੁਰ. ਕੋ ਨਾਉ, ਨ ਪਾਏ; ਪ੍ਰਭਿ ਐਸੀ ਬਣਤ ਬਣਾਈ ਹੇ ॥੯॥"
page = 1046
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the True Guru, no one finds the Name. Such is the rule, which my Lord has established."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਦੇ ਬਗ਼ੈਰ ਕੋਈ ਭੀ ਮੋਖਸ਼ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦਾ। ਐਹੋ ਜੇਹੀ ਮਰਯਾਦਾ ਮੇਰੇ ਸਾਈਂ ਨੇ ਕਾਇਮ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the True Guru, no one finds the Name. Such is the making which God has made. ||9||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰ ਸੇ ਬਿਨਾਂ ਕੋਈ ਨਾਮ ਨਹੀਂ ਪਾਵਤਾ, ਪ੍ਰਭੂ ਨੇ ਇਹ ਬਣਤ ਐਸੀ ਬਣਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ ਅਜਿਹੀ ਮਰਯਾਦਾ ਬਣਾ ਰੱਖੀ ਹੈ ਕਿ ਗੁਰੂ (ਦੀ ਸਰਨ ਪੈਣ) ਤੋਂ ਬਿਨਾ ਕੋਈ ਮਨੁੱਖ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਪ੍ਰਾਪਤ ਨਹੀਂ ਕਰ ਸਕਦਾ ॥੯॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋ = ਕਈ ਮਨੁੱਖ। ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ। ਬਣਤ = ਮਰਯਾਦਾ ॥੯॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sin el Guru Verdadero, nadie encuentra el Nombre, pues tal es la Voluntad de Dios.(9)"