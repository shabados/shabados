[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਗ ਮਹਿ ਆਇਆ; ਸੋ ਪਰਵਾਣੁ ॥"
page = 198
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In this world, his advent is approved,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਜਹਾਨ ਅੰਦਰ ਉਸ ਦਾ ਆਗਮਨ ਕਬੂਲ ਪੈਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Blessed is their coming into this world,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਮੇਂ ਜਨਮ ਧਾਰਨਾ ਤਿਸੀ ਕਾ (ਪਰਵਾਣੁ) ਸਫਲ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜਿਸ ਮਨੁੱਖ ਨੇ ਮਾਲਕ-ਪ੍ਰਭੂ ਨੂੰ ਹਰੇਕ ਸਰੀਰ ਵਿਚ ਵੱਸਦਾ ਪਛਾਣ ਲਿਆ ਹੈ) ਉਹੀ ਮਨੁੱਖ ਜਗਤ ਵਿਚ ਆਇਆ ਸਫਲ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਵਾਣੁ = ਕਬੂਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El advenimiento al mundo"