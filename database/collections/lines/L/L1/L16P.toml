[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਤ੍ਰਿਯਾ ਗਈ ਬਾਗ ਮੈ; ਰਮੀ ਔਰ ਸੋ ਜਾਇ ॥"
page = 824

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "A woman named Puhap Mati went into to a garden and started loving some else."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਇਸਤਰੀ ਬਾਗ਼ ਵਿਚ ਗਈ ਅਤੇ ਉਥੇ ਕਿਸੇ ਹੋਰ ਨਾਲ ਰਮਣ ਕਰਨ ਲਗ ਗਈ।"