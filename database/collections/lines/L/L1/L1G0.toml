[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜਨਮੁ ਪਦਾਰਥੁ ਹਾਰਿਆ; ਜਿਉ ਜੂਏ ਖੇਲਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Like the playing of gamble, he loses the invaluable stake of life in this game."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਮਾਨੁਖ) ਜਨਮ ਪਦਾਰਥ ਹੱਥ ਲੱਗਾ ਸੀ, (ਓਹ ਮਾਨੋਂ ਜੂਏ ਦੀ ਖੇਡ ਵਿਖੇ (ਭਾਵ ਵਿਖਿਆਂ ਵਿਖੇ ਲੱਗਕੇ) ਹਾਰ ਦਿੱਤਾ ਹੈ।"