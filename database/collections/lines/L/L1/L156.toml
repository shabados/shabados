[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਰੰਗੇ; ਸੇ ਭਏ ਨਿਹਾਲ ॥"
page = 194
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, whom the Guru stains with Lord's love become happy."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾ ਨੂੰ ਗੁਰੂ ਜੀ ਪ੍ਰਭੂ ਦੀ ਪ੍ਰੀਤ ਨਾਲ ਰੰਗਦੇ ਹਨ, ਉਹ ਪ੍ਰਸੰਨ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who are imbued with love by the Guru become happy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰੋਂ ਨੇ ਰੰਗੇ ਹੈਂ, ਸੋ (ਨਿਹਾਲ) ਨਿਰਦੁਖ ਭਏ ਹੈਂ॥☬ਕਦਾਚਿਤ ਐਸੀ ਅਸੰਕਾ ਹੋ ਕਿ ਗੁਰੋਂ ਨੈ ਕੌਨ ਸੇ ਰੰਗੇ ਹੈਂ? ਤਾਂ ਪੈ ਕਹੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੂੰ ਗੁਰੂ ਨੇ ਪਰਮਾਤਮਾ ਦੇ ਪ੍ਰੇਮ-ਰੰਗ ਵਿਚ ਰੰਗ ਦਿੱਤਾ ਹੈ, ਉਹ ਸਦਾ ਖਿੜੇ ਜੀਵਨ ਵਾਲੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ। ਸੇ = ਉਹ ਬੰਦੇ {ਬਹੁ-ਵਚਨ}। ਨਿਹਾਲ = ਪ੍ਰਸੰਨ, ਖਿੜੇ ਹੋਏ ਜੀਵਨ ਵਾਲੇ"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quienes están imbuidos en el Amor del Guru están felices,"