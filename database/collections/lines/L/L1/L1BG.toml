[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਕੀਨੀ; ਸਭ ਪੂਰਨ ਆਸਾ ॥"
page = 177
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who has fulfilled all the desires."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਸਾਰੀਆਂ ਖਾਹਿਸ਼ਾਂ ਪੂਰੀਆਂ ਕੀਤੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has fulfilled all desires;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਿਸ ਨੇ ਸੰਪੂਰਨ ਆਸਾ ਭਗਤੋਂ ਕੀ ਪੂਰੀ ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਕਰਤਾਰ) ਨੇ ਮੇਰੀ ਹਰੇਕ ਆਸ (ਹੁਣ ਤਕ) ਪੂਰੀ ਕੀਤੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀਨੀ = ਕੀਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Él, Quien satisfizo todos tus deseos."