[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨ ਕੈ ਹਿਰਦੈ; ਏਕੋ ਭਾਇਆ ॥"
page = 1190
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who heartily love the One Lord;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਇਕ ਪ੍ਰਭੂ ਨੂੰ ਦਿਲੋਂ ਪਿਆਰ ਕਰਦੇ ਹਨ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who love the One Lord with all their heart"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੇ ਹਿਰਦੇ ਮੇਂ ਏਕੋ ਪਰਮੇਸ੍ਵਰ ਭਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਬੰਦਿਆਂ ਨੂੰ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਇਕ ਪਰਮਾਤਮਾ ਹੀ ਪਿਆਰਾ ਲੱਗਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਇਆ = ਚੰਗਾ ਲੱਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los que aman a su Único Señor, el Dios,"