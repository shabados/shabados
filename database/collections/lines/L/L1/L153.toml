[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧੁਰਿ ਮਸਤਕਿ ਲੇਖ ਲਿਖੇ; ਹਰਿ ਪਾਈ ॥"
page = 732
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By virtue of the pre-ordained destiny on my brow, I have obtained the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮੱਥੇ ਦੀ ਮੁੱਢਲੀ ਲਿਖੀ ਹੋਈ ਪ੍ਰਾਲਬਧ ਦੀ ਬਦੌਲਤ, ਮੈਂ ਪ੍ਰਭੂ ਨੂੰ ਪਰਾਪਤ ਕਰ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By the pre-ordained destiny inscribed upon my forehead, I have found the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਦੋਂ ਮਸਤਕ ਮੇਂ ਲੇਖ ਲਿਖੇ ਅਨੁਸਾਰ ਵਾਹਿਗੁਰੂ ਕੀ ਖਬਰ ਪਾਈ ਹੈ,॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਧੁਰ ਦਰਗਾਹ ਤੋਂ (ਜਿਸ ਮਨੁੱਖ ਦੇ) ਮੱਥੇ ਉੱਤੇ ਪ੍ਰਭੂ-ਮਿਲਾਪ ਦਾ ਲਿਖਿਆ ਲੇਖ ਉੱਘੜਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧੁਰਿ = ਧੁਰ ਦਰਗਾਹ ਤੋਂ। ਮਸਤਕਿ = ਮੱਥੇ ਉੱਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal es el decreto de mi Destino, obtener a mi Señor."