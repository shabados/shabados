[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਪੂਰੈ; ਕਰਿ ਦੀਨੋ ਵਿਸਾਹੁ ॥੩॥"
page = 189
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Perfect Guru, has established his credit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਾਂ ਨੇ ਉਸ ਦੀ ਸ਼ਾਖ਼ ਬਣਾ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Perfect Guru has established their line of credit. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੋ ਪੂਰਨ ਗੁਰੋਂ ਨੇ (ਵਿਸਾਹ) ਭਰੋਸਾ ਕਰ ਦੀਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੂ ਨੇ (ਪਰਮਾਤਮਾ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਉਸ ਦੀ) ਸਾਖ ਬਣਾ ਦਿੱਤੀ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ। ਵਿਸਾਹੁ = ਇਤਬਾਰ, ਸਾਖ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y el Guru da Su Palabra por él.  (3)"