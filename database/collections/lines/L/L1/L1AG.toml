[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਕਿਉ ਵਿਸਰੈ; ਮੇਰੀ ਮਾਇ ॥"
page = 349
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How can He be forgotten O my Mother?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਕਿਸ ਤਰ੍ਹਾਂ ਭੁਲਾਇਆ ਜਾ ਸਕਦਾ ਹੈ, ਹੇ ਮੇਰੀ ਮਾਤਾ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So how could I ever forget Him, O my Mother?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਮੁਝੇ ਕ੍ਯੋਂ ਬਿਸਰ ਜਾਵੇ, ਭਾਵ ਨਹੀਂ ਬਿਸਰਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਮਾਂ! (ਅਰਦਾਸ ਕਰ ਕਿ) ਉਹ ਪ੍ਰਭੂ ਮੈਨੂੰ ਕਦੇ ਨ ਭੁੱਲੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੇਰੀ ਮਾਇ = ਹੇ ਮੇਰੀ ਮਾਂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cómo puedo entonces Olvidarlo, oh Madre mía?"