[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਝ ਵੀ ਉਨ੍ਹਾਂ ਦੇ ਦੁਨਿਆਵੀ ਸਾਮਾਨ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਹਰ ਚਿ ਸ਼ਾਂ ਅੰਦਰ ਖ਼ਿਲਾਫ਼ਤ ਦਾਸ਼ਤੰਦ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "That even the brave Arjun could not do on the day of the battle. (159)"