[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਸਦੀ ਵਡਿਆਈ ਸਾਡੀ ਜੇਭਾ ਦੇ ਕਥਨ ਤੋਂ ਬਾਹਰ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਅਜ਼ਾਂ ਬਰਤਰੀਂ ਤਰ ਕਿ ਗੋਇਦ ਜ਼ੁਬਾਂ ॥੧੬੯॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Our tongue is incapable to describe his praises and glory. (169)"