[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਲ ਭਿਰੈ ਕਹੂ ਮਤ ਕਰੀ ਕਹੂ ਨਾਚਤ ਬੇਸਯਨ ਕੇ ਸੁ ਅਖਾਰੇ ॥"
page = 536

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere the wrestlers were fighting, and somewhere the intoxicated elephants were clashing among themselves, somewhere the female dancers were dancing"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਧਰੇ ਪਹਿਲਵਾਨ ਘੁਲ ਰਹੇ ਹਨ ਅਤੇ ਕਿਤੇ ਮਸਤ ਹਾਥੀ (ਲੜ ਰਹੇ ਹਨ) ਅਤੇ (ਕਿਧਰੇ) ਵੇਸਵਾਵਾਂ ਅਖਾੜਿਆਂ ਵਿਚ ਨਚ ਰਹੀਆਂ ਹਨ।"