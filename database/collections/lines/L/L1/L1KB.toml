[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਧਵਾ ਬਧੂ ਖੇਦ ਨਹਿ ਪਾਵੈ ॥੫॥"
page = 900

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The thief used to perform her all the domestic errands, and she never worried for any thing.(5)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਵਿਧਵਾ ਇਸਤਰੀ ਨੂੰ ਕੋਈ ਖੇਚਲ ਨਹੀਂ ਹੁੰਦੀ ਸੀ ॥੫॥"