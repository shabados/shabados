[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ; ਪੂਰਨ ਸੁਖਦਾਤੇ ॥"
page = 1270
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Bliss-giving perfect Lord, show Thou mercy unto me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਖੁਸ਼ੀ-ਬਖਸ਼ਣਹਾਰ, ਪੂਰੇ ਪ੍ਰਭੂ! ਤੂੰ ਮੇਰੇ ਉਤੇ ਮਿਹਰ ਧਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please be merciful to me, O Perfect Giver of peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੂਰਨ ਸੁਖੋਂ ਕੇ ਦਾਤੇ! ਹਮਾਰੇ ਪੁਰ ਕ੍ਰਿਪਾ ਦ੍ਰਿਸਟੀ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਰਬ-ਵਿਆਪਕ! ਹੇ ਸੁਖ ਦੇਣ ਵਾਲੇ ਪ੍ਰਭੂ! ਮਿਹਰ ਕਰ (ਮੇਰੇ ਚਿੱਤ ਵਿਚ ਆ ਵੱਸ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ ਕਿਰਪਾ = ਮਿਹਰ ਕਰ। ਪੂਰਨ = ਹੇ ਸਰਬ-ਵਿਆਪਕ! ਸੁਖਦਾਤੇ = ਹੇ ਸੁਖ ਦੇਣ ਵਾਲੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por favor, ten Misericordia de mí, oh, Dador Perfecto de Paz."