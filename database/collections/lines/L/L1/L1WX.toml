[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਠਾਕੁਰ; ਤੁਮੑ ਸਰਣਾਈ ਆਇਆ ॥"
page = 1218
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, I have sought Thy refuge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਮੈਂ ਤੇਰੀ ਸ਼ਰਣਾਗਤ ਸੰਭਾਲੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my Lord and Master, I have come to Your Sanctuary."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਠਾਕੁਰ ਜੀ! ਮੈਂ ਤੁਮਾਰੀ ਸਰਨ ਆਯਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਮਾਲਕ-ਪ੍ਰਭੂ! (ਮੈਂ) ਤੇਰੀ ਸਰਨ ਆਇਆ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਕੁਰ = ਹੇ ਮਾਲਕ-ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, he buscado sólo Tu Refugio"