type = "primary"
data = "ਅਧਿਕ ਦਰਬੁ ਦੈ ਧਾਮ ਪਠਾਏ ॥"
page = 859

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the priests were entertained with meals and they bid farewell with meals and they bid farewell with sufficient amount of money."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਬਹੁਤ ਸਾਰਾ ਧਨ ਦੇ ਕੇ ਘਰਾਂ ਨੂੰ ਭੇਜਿਆ।"