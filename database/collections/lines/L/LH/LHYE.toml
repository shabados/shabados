[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗੁ ਆਸਾ ਛੰਤ ਮਹਲਾ ੪ ਘਰੁ ੧ ॥"
page = 442
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Asa Measure 4th Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਆਸਾ ਚੌਥੀ ਪਾਤਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Aasaa, Chhant, Fourth Mehl, First House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਆਸਾ, ਘਰ ੧ ਵਿੱਚ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਦੀ ਬਾਣੀ 'ਛੰਤ'।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Asa, Mejl Guru Ram Das, Cuarto Canal Divino, Chhant."