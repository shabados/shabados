[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਯਯਾ; ਜਾਰਉ ਦੁਰਮਤਿ ਦੋਊ ॥"
page = 253
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Y: Burn thou thy evil-intellect and duality."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਯ-ਆਪਣੀ ਮੰਦੀ ਅਕਲ ਤੇ ਦਵੈਤ-ਭਾਵ ਨੂੰ ਸਾੜ ਸੁਟ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "YAYYA: Burn away duality and evil-mindedness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਯੇ ਅਖਰ ਦ੍ਵਾਰਾ ਕਹਤੇ ਹੈਂ: ਦੁਰਮਤਿ ਅਰ ਦ੍ਵੈਤ ਕੋ ਜਲਾਇ ਦੇਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਭੈੜੀ ਮਤ ਤੇ ਮਾਇਆ ਦਾ ਪਿਆਰ ਸਾੜ ਦਿਉ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਰਉ = ਜਾਰਹੁ, ਸਾੜ ਦਿਉ। ਦੋਊ = ਦੂਜਾ ਭਾਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "YAYYA: Elimina de tu ser la idea de la dualidad,"