[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਚੀ ਮਟੁਕੀ; ਬਿਨਸਿ ਬਿਨਾਸਾ ॥"
page = 374
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The bodily earthen vessel shall definitely break."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "(ਸਰੀਰ ਰੂਪੀ) ਕੱਚਾ ਭਾਂਡਾ ਜਰੂਰ ਹੀ ਟੁੱਟ ਜਾਊਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The clay pot of the body shall be broken."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਕਾਚੀ ਮਟੁਕੀ) ਇਸ ਦੇਹ ਕੋ (ਬਿਨਸਿ) ਨਾਸ ਰੂਪ ਜਾਨ ਕਰ (ਬਿਨਾਸਾ) ਆਸਾ ਸੇ ਰਹਿਤ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜਿਵੇਂ) ਕੱਚਾ ਘੜਾ ਜ਼ਰੂਰ ਨਾਸ ਹੋਣ ਵਾਲਾ ਹੈ (ਤਿਵੇਂ ਮਾਇਆ ਨਾਲੋਂ ਭੀ ਸਾਥ ਆਖ਼ਰ ਜ਼ਰੂਰ ਟੁੱਟਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਟੁ = ਵੱਡਾ ਘੜਾ। ਮਟੁਕੀ = ਘੜੀ, ਛੋਟਾ ਘੜਾ। ਬਿਨਸਿ ਬਿਨਾਸਾ = ਜ਼ਰੂਰ ਨਾਸ ਹੋਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El jarrón del cuerpo se rompe al final,"