[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹਾ ਨ ਕੀਨਾ ਤਿਨ ਤਰੁਨਿ; ਦਿਯੇ ਕੁਠੋਰਹਿ ਡਾਰਿ ॥੯॥"
page = 859

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Never harking to anyone, the woman put herself in trouble.(9) ."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਰ ਉਸ ਇਸਤਰੀ ਨੇ ਕਿਹਾ ਨਾ ਮੰਨਿਆ ਅਤੇ (ਪਿੰਡ ਨੂੰ) ਮਾੜੀ ਥਾਂ ਉਤੇ ਸੁਟ ਦਿੱਤਾ ॥੯॥"