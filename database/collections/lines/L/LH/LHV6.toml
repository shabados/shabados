[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਦਸਹੁ ਸੰਤਹੁ ਜੀ; ਹਰਿ ਖੋਜੁ ਪਵਾਈ ਜੀਉ ॥"
page = 175
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O honourable saints, tell me about God. I am on the look-out of the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਤਵੰਤੇ ਸਾਧੂਓ! ਮੈਨੂੰ ਵਾਹਿਗੁਰੂ ਦਾ ਥਹੁ ਪਤਾ ਦਿਓ। ਮੈਂ ਸੁਆਮੀ ਦੀ ਢੂੰਡ ਭਾਲ ਕਰਵਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Show me the way to the Lord, Dear Saints; I am searching all over for Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ ਕੇ ਸੰਤਹੁ ਜੀ! ਮੈਂ (ਖੋਜੁ ਪਵਾਈ) ਤਲਾਸ਼ ਕਰਤਾ ਹਾਂ ਮੇਰੇ ਕੋ ਹਰੀ ਬਤਾਓ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! (ਮੈਨੂੰ ਉਸ ਦਾ ਪਤਾ) ਦੱਸੋ, ਮੈਂ ਉਸ ਹਰੀ-ਸੱਜਣ ਦੀ ਭਾਲ ਕਰਦਾ ਫਿਰਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖੋਜੁ = ਭਾਲ। ਪਵਾਈ = ਮੈਂ ਪਵਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo busco por todas partes, díganme por favor, oh Santos, por dónde debo de ir."