data = "ਫਟਕਾਚਲ ਲਖਿ ਤਾਹਿ ਲਜਾਹੀ ॥੩੪॥"
page = 921

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The temple was lofty and its grace was unsurpassable.(34)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਵੇਖ ਕੇ ਕੈਲਾਸ਼ ਪਰਬਤ ('ਫਟਕਾਚਲ') ਵੀ ਲਜਾਉਂਦਾ ਸੀ ॥੩੪॥"