[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈ. ਗੁਰ ਪਰਸਾਦੀ ਜਾਨੀ ॥੨॥"
page = 657
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's grace I have known it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ, ਮੈਂ ਇਸ ਨੂੰ ਜਾਣ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "by Guru's Grace, I know this. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਮੈਨੇ ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਜਾਣੀ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਮੈਂ ਉਸ ਜੋਤਿ ਨੂੰ ਪਛਾਣ ਲਿਆ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਪਰਸਾਦੀ = ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ। ਜਾਨੀ = ਜਾਣੀ ਹੈ, ਸਾਂਝ ਪਈ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es por la Gracia del Guru que conozco esto. (2)"