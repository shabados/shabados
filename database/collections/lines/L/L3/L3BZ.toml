[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੀਮਤਿ ਕਹਣੁ. ਨ ਜਾਈ ॥੧॥ ਰਹਾਉ ॥"
page = 890
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man can describe not its worth. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਨਸਾਨ ਇਸ ਦਾ ਮੁੱਲ ਦੱਸ ਨਹੀਂ ਸਕਦਾ। ਠਹਿਰਾਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Its value cannot be described. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿ ਜਿਸ ਕੀ ਕੀਮਤ ਕਹੀ ਨਹੀਂ ਜਾਤੀ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰਿ-ਨਾਮ ਦਾ ਮੁੱਲ ਪਾਇਆ ਨਹੀਂ ਜਾ ਸਕਦਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "uno no podría describir Su Valor.(1-Pausa)"