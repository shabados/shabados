[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਹ ਇੱਜ਼ਤ ਸਤਿਕਾਰ ਅਤੇ ਮਰਤਬੇ ਦੇ ਮੁਖੜੇ ਨੂੰ ਰੌਣਕ ਬਖਸ਼ਣ ਵਾਲਾ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਰੁਖ਼ਿ ਇੱਜ਼ਤੋ ਜਾਹ ਰਾ ਇੰਜਲਾ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "He blesses the face of respectability and status with happy disposition,"