[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਤ ਪਿਤਾ ਭਾਈ ਸੁਤ ਬਨਿਤਾ; ਤਿਨ ਭੀਤਰਿ ਪ੍ਰਭੂ ਸੰਜੋਇਆ ॥"
page = 77
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mother, father, brother, son and wife, amongst them the Lord united him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਂ, ਪਿਉ, ਭਰਾ, ਪੁਤ੍ਰ ਅਤੇ ਪਤਨੀ, ਉਨ੍ਹਾਂ ਦੇ ਅੰਦਰ ਸਾਹਿਬ ਨੇ ਉਸ ਨੂੰ ਜੋੜ ਦਿੱਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God placed you with your mother, father, brothers, sons and wife."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਤਾ, ਪਿਤਾ, ਭਾਈ, ਪੁਤ੍ਰ ਤਥਾ ਇਸਤ੍ਰੀ ਤਿਨ ਸਭ ਕੇ ਬੀਚ ਵਾਹਿਗੁਰੂ ਨੇ (ਸੰਜੋਇਆ) ਮਿਲਾਇ ਦੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਂ ਪਿਓ ਭਰਾ ਪੁੱਤਰ ਇਸਤ੍ਰੀ (ਆਦਿਕ) ਇਹਨਾਂ ਸੰਬੰਧੀਆਂ ਵਿਚ ਪ੍ਰਭੂ ਜੀਵ ਨੂੰ ਰਚਾ-ਮਚਾ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਤ = ਪੁੱਤਰ। ਬਨਿਤਾ = ਇਸਤ੍ਰੀ। ਤਿਨ ਭਤਿਰਿ = ਉਹਨਾਂ (ਪੁੱਤਰ ਇਸਤ੍ਰੀ ਆਦਿਕ ਸਨਬੰਧੀਆਂ) ਵਿਚ। ਸੰਜੋਇਆ = ਰਲਾ ਦਿੱਤਾ, ਪਰਚਾ ਦਿੱਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él te unió con tu madre, tu padre, hermanos, hijos y esposa."