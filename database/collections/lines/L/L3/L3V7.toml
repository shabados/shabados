[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਾਰਥ ਧਨੁ ਕਰਖਤ ਭਏ; ਬਰਖੇ ਫੂਲ ਅਨੇਕ ॥"
page = 1008

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When he had stretched the bow, all the gods were delighted and theyshowered the flowers."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਰਜਨ ('ਪਾਰਥ') ਦੇ ਧਨੁਸ਼ ਨੂੰ ਖਿਚਣ ਨਾਲ ਫੁਲਾਂ ਦੀ ਬਹੁਤ ਬਰਖਾ ਹੋਣ ਲਗੀ।"