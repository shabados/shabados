[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਮਤ; ਕਸ. ਨ ਮੁਓ, ਅਪਰਾਧੀ ॥੧॥ ਰਹਾਉ ॥"
page = 328
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "why did such a wicked man not die at his very birth? Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਗੁਨਾਗਾਰ ਜੰਮਦੇ ਸਾਰ ਹੀ ਕਿਉਂ ਨਾਂ ਮਰ ਗਿਆ? ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- why didn't such a sinful man die at birth? ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਓਹ (ਅਪਰਾਧੀ) ਮਹਾਂ ਪਾਪੀ ਜਨਮਤਾ ਹੀ ਕੈਸੇ ਨ ਮਰ ਗਿਆ ਅਰਥਾਤ ਤਿਸ ਕਾ ਮਰਨਾ ਹੀ ਅਛਾ ਥਾ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਅਪਰਾਧੀ ਜੰਮਦਾ ਹੀ ਕਿਉਂ ਨਹੀਂ ਮਰ ਗਿਆ? ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨਮਤ = ਜੰਮਦਾ ਹੀ। ਅਪਰਾਧੀ = ਪਾਪੀ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si tampoco contempló al Señor, su Dios?(1-Pausa)"