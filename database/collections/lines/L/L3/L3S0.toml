data = "ਖਾਟਿ ਕਮਾਇ ਤੁਮੈ ਧਨੁ ਲਯੈਹੌਂ ॥੨॥"
page = 901

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I am going abroad, and will come back after earning lot of money.’(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਥੋਂ) ਖਟ ਕਮਾ ਕੇ ਤੈਨੂੰ ਧਨ ਲਿਆ ਕੇ ਦਿਆਂਗਾ ॥੨॥"