[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ; ਤਿਸੁ ਸੰਗਿ ਮਿਲਾਵੈ ॥੧॥ ਰਹਾਉ ॥"
page = 183
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "And mercifully unites with Him. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮਿਹਰ ਕਰ ਕੇ ਉਸਦੇ ਨਾਲ ਮਿਲਾ ਦੇਂਦਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By His Grace, He leads us to merge with Him. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਤਿਸ ਵਾਹਿਗੁਰੂ ਕੇ ਸਾਥ ਮਿਲਾਇ ਦੇਵੇ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਮਿਹਰ ਕਰ ਕੇ ਉਸ ਪਰਮਾਤਮਾ ਦੇ ਨਾਲ ਜੋੜਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸੁ ਸੰਗਿ = ਉਸ (ਪਰਮਾਤਮਾ) ਦੇ ਨਾਲ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es el Dador de Paz, y por su Gracia, nos une con el Señor.  (1-Pausa)"