[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਲਕ ਏਕ ਬੀਤੀ ਨਹੀ; ਤਹਾ ਪਹੂੰਚੀ ਆਨਿ ॥੧੧॥"
page = 969

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And in the twinkling of eyes, arrived at the place.(11)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਅਜੇ) ਇਕ ਪਲਕ ਝਪਕਣ ਦਾ ਸਮਾਂ ਵੀ ਬੀਤਿਆ ਨਹੀਂ ਸੀ ਕਿ ਉਥੇ ਆ ਪਹੁੰਚੀ ॥੧੧॥"