[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਲਾਗੀ; ਭਰਮਿ ਭੁਲਾਣੀ ॥੫॥"
page = 750
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who is clung to mammon and is strayed by superstition."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਧਨ-ਦੌਲਤ ਨੂੰ ਚਿਮੜੀ ਹੋਈ ਹੈ ਅਤੇ ਜਿਸ ਨੂੰ ਸੰਦੇਹ ਨੇ ਕੁਰਾਹੇ ਪਾਇਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Attached to Maya, she is deluded by doubt. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਮਾਯਾ ਕੇ ਕਾਰਜੋਂ ਮੇਂ ਲਾਗਕੇ ਭਰਮ ਮੇਂ ਹੀ ਭੂਲੀ ਹੂਈ ਹੈ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੀ ਮਾਇਆ (ਦੇ ਮੋਹ) ਵਿਚ ਫਸੀ ਰਹੇ, ਭਟਕਣਾ ਵਿਚ ਪੈ ਕੇ ਜੀਵਨ-ਰਾਹ ਤੋਂ ਖੁੰਝੀ ਰਹੇ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aferrándome a la ilusión, soy desviado por la duda.(5)"