[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਚਰਨ; ਨਾਨਕ ਆਸਰੋ ॥"
page = 1119
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak has the support of the Lord's feet alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੂੰ ਕੇਵਲ ਸੁਆਮੀ ਦੇ ਚਰਨਾਂ ਦਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak takes the Support of God's Feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਪ੍ਰਭੂ! ਮੇਰੇ ਕੋ ਤੇਰੇ ਹੀ ਚਰਨੋਂ ਕਾ ਆਸਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਨਾਨਕ ਨੂੰ ਤੇਰੇ ਹੀ ਚਰਨਾਂ ਦਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, sólo Tus Pies son mi Barco,"