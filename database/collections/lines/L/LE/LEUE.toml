[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੈ ਅੰਦਰਿ ਮਹਲਿ; ਸਚਿ ਬੁਲਾਈਐ ॥"
page = 145
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The true ones are called within the mansion of the True Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਚਿਆਰ ਸੱਚੇ ਮਾਲਕ ਦੇ ਮੰਦਰ ਵਿੰਚ ਬੁਲਾ ਲਏ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Lord calls the true ones to the Mansion of His Presence."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚੇ ਨਾਮ ਜਪਨੇ ਵਾਲੇ ਕੋ (ਸਚਿ) ਨਿਹਚੇ ਕਰ ਕੇ ਸ੍ਵਰੂਪ ਮੇਂ ਬੁਲਾ ਲਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਇਸ ਸੱਚੇ ਨਾਮ ਦੀ ਰਾਹੀਂ ਸੱਚੇ ਪ੍ਰਭੂ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਥਾਂ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚਿ = ਸਚੇ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando alcanzamos la Puerta Verdadera, no hablamos nada más que la Verdad, y es entonces cuando el Uno Verdadero nos llama a Su Recinto de Verdad."