[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੋ ਕਰਤਾ. ਆਪੇ ਆਪ ॥"
page = 1271
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Unique Creator is all by Himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਦੁਤੀ ਸਿਰਜਣਹਾਰ ਸਾਰਾ ਕੁਛ ਆਪ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One and Only Creator Lord is Himself by Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਆਪ ਏਕ ਹੀ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਰਤਾਰ ਆਪ ਹੀ ਆਪ (ਹਰ ਥਾਂ ਮੌਜੂਦ) ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੇ = ਆਪ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Único Señor Creador es Él Mismo en Su Ser,"