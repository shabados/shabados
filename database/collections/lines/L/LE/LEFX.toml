[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇ ਅਸਥਿਰ; ਜਿਨ ਗੁਰਸਬਦੁ ਕਮਾਇਆ ॥੪॥"
page = 374
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who act up to Guru's instruction, become stable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਦੀ ਕਮਾਈ ਕਰਦੇ ਹਨ, ਉਹ ਅਹਿਲ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who practice the Guru's Teachings, become steady and stable. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਸਿਥਰ ਹੂਏ ਹੈਂ ਜਿਨੋਂ ਨੇ ਗੁਰ ਕਾ ਸਬਦੁ ਕਮਾਇਆ ਹੈ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ, ਜਿਨ੍ਹਾਂ ਨੇ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਨੂੰ (ਆਪਣੇ ਜੀਵਨ ਵਿਚ) ਵਰਤਿਆ ਹੈ ਉਹ (ਮਾਇਆ ਦੇ ਮੋਹ ਵਲੋਂ) ਅਡੋਲ-ਚਿੱਤ ਰਹਿੰਦੇ ਹਨ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਸਥਿਰ = ਅਡੋਲ-ਚਿੱਤ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque solamente son eternos e inamovibles los que practican la Palabra del Guru. (4)"