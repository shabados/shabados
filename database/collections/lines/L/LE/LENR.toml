[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਉ ਕਿਰਪਾ ਤੇ; ਹਉਮੈ ਤੁਟੈ ॥੧॥"
page = 180
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Thy grace egotism is dispelled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਰਹਿਮਤ ਸਦਕਾ ਹੰਕਾਰ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Your Grace, egotism is eradicated. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਥਾ ਤੇਰੀ ਕਿਰਪਾ ਸੇ ਹੰਕਾਰ ਛੂਟ ਜਾਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰੀ ਕਿਰਪਾ ਨਾਲ (ਸਾਡੀ ਜੀਵਾਂ ਦੀ) ਹਉਮੈ ਦੂਰ ਹੁੰਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por Tu Gracia, oh Señor, me libero de mi ego.(1)"