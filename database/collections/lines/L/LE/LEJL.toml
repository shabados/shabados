[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੁ ਸੇਵਉ; ਕਰਿ ਨਮਸਕਾਰ ॥"
page = 1180
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I serve my Guru, and pay homage unto Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਗੁਰਾਂ ਦੀ ਘਾਲ ਕਮਾਉਂਦਾ ਤੇ ਉਹਨਾਂ ਨੂੰ ਬੰਦਨਾ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I serve the Guru, and humbly bow to Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਮਸਕਾਰ ਕਰ ਗੁਰੋਂ ਕੋ ਸੇਵਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਗੁਰੂ ਅੱਗੇ ਸਿਰ ਨਿਵਾ ਕੇ ਗੁਰੂ ਦੀ ਸੇਵਾ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵਉ = ਸੇਵਉਂ, ਮੈਂ ਸੇਵਾ ਕਰਦਾ ਹਾਂ। ਕਰਿ = ਕਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sirvo a mi Guru y Lo saludo con toda mi Fe, pues el día de hoy"