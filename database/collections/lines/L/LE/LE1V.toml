[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰੁ ਸਬਦੀ, ਵਡੀ ਵਡਿਆਈ ॥੧੦॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Real excellence is achieved by cultivating the Guru's word."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰ ਸ਼ਬਦ ਦੀ ਵੱਡੀ ਵਡਿਆਈ ਹੈ (ਜਦ ਗੁਰੂ ਸ਼ਬਦ ਦੀ ਵਰਖਾ ਕਰਦੇ ਹਨ ਤਾਂ ਚੌਰਾਸੀ ਕੱਟੀ ਜਾਂਦੀ ਹੈ।"