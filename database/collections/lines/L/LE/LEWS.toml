type = "primary"
data = "ਮੇਰੋ ਨਾਮ ਬਸੈ ਰਿਦ ਮਾਹੀ ॥੧੭੩੭॥"
page = 471

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There is no warrior amongst the warriors like him, in whose heart abides my Name with such profundity.1737."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਦੇ) ਹਿਰਦੇ ਵਿਚ ਮੇਰਾ ਨਾਮ ਵਸਦਾ ਹੈ ॥੧੭੩੭॥"