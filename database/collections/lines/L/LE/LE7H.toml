[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ; ਹਰਿ ਪਰਗਟੀ ਆਇਆ ॥"
page = 375
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Showing His mercy, God has revealed Himself unto me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨੇ ਮਿਹਰ ਧਾਰ ਕੇ ਆਪਣੇ ਆਪ ਨੂੰ ਮੇਰੇ ਤੇ ਜ਼ਾਹਰ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Showing His Mercy, the Lord has revealed Himself to me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਹਰਿ ਅੰਤਸਕਰਣ ਮੇਂ ਪ੍ਰਗਟ ਹੋ ਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਵੀਰ!) ਪਰਮਾਤਮਾ ਕਿਰਪਾ ਕਰ ਕੇ ਉਸ ਮਨੁੱਖ ਦੇ ਅੰਦਰ ਆਪ ਆ ਪਰਤੱਖ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por Su Misericordia el Señor se me revela."