[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਜੰਤ; ਸਭਿ ਤੇਰਾ ਖੇਲੁ ॥"
page = 365
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the organisms and being are Thine playthings."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਮੂਹ ਪ੍ਰਾਣਧਾਰੀ ਤੇਰੇ ਖਿਡਾਉਣੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All beings and creatures are your play-things."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਛੋਟੇ ਬਡੇ ਜੀਵ ਸਭ ਤੇਰਾ ਖੇਲੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ ਦੇ ਇਹ) ਸਾਰੇ ਜੀਅ ਜੰਤ ਤੇਰਾ (ਰਚਿਆ) ਤਮਾਸ਼ਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭਿ = ਸਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Toda la creación es Tu Propio Milagro;"