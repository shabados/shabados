[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਗਨਤ ਦਲੁ ਇਕ ਪਲ ਮੈ ਮਾਰਿਓ ॥੧੪੯੫॥"
page = 446

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He held up the bow and arrows in his hands and killed innumerable soldiers in an instant.1495."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਇਕ ਪਲ ਵਿਚ ਅਣਗਿਣਤ (ਵੈਰੀ) ਦਲ ਨੂੰ ਮਾਰ ਦਿੱਤਾ ॥੧੪੯੫॥"