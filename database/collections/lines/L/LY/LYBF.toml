[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਚਰਨ; ਰਿਦੈ ਉਰ ਧਾਰੇ ॥"
page = 718
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord God's feet, I have enshrined within my mind and heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦੇ ਚਰਨ, ਮੈਂ ਆਪਣੇ ਮਨ ਅਤੇ ਦਿਲ ਅੰਦਰ ਟਿਕਾਏ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have enshrined the Lord's Feet within my heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਕੇ ਚਰਨ ਕਮਲ ਹਮ ਨੇ (ਉਰ) ਵਸੇਸ ਕਰ ਕੇ ਹਰ ਪ੍ਰਕਾਰ ਸੇ ਰਿਦੇ ਮੇਂ ਧਾਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਦੇ ਚਰਨ ਸਦਾ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਚੰਗੀ ਤਰ੍ਹਾਂ ਸਾਂਭ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਿਦੈ = ਹਿਰਦੇ ਵਿਚ। ਉਰ ਧਾਰੇ = ਉਰ ਧਾਰਿ, {ਉਰ = ਹਿਰਦਾ} ਹਿਰਦੇ ਵਿਚ ਟਿਕਾਈ ਰੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He enaltecido los Pies del Señor en mi corazón;"