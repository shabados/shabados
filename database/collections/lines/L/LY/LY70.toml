[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਜਿਨਿ. ਸਾਧਸੰਗੁ ਪਾਇਆ ॥"
page = 622
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who-so-ever attains the saints society,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੋਈ ਭੀ ਸਤਿ ਸੰਗਤ ਨਾਲ ਜੁੜਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whoever finds the Saadh Sangat, the Company of the Holy,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਜਿਸ ਨੇ ਤੇਰੇ ਸੰਤੋਂ ਕਾ ਸੰਗ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਜਿਸ ਮਨੁੱਖ ਨੇ ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਪ੍ਰਾਪਤ ਕੀਤੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਮਨੁੱਖ) ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquéllos que se unen a la Sociedad de los Santos,"