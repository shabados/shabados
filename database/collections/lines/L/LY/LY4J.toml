[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ ਨਾਮੁ ਦੇਵਸੀ; ਫਿਰਿ ਲੇਖੁ. ਨ ਲਿਖਿਆ ॥"
page = 787
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In His Mercy, the Lord blesses man with His Name and then no writ of weal and woe is written."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਰਹਿਮਤ ਦੁਆਰਾ ਸੁਆਮੀ ਆਪਣਾ ਨਾਮ ਬਖਸ਼ਦਾ ਹੈ, ਅਤੇ ਤਦ ਖੁਸ਼ੀ ਤੇ ਗਮੀ ਦੀ ਕੋਈ ਲਿਖਤ ਲਿਖੀ ਨਹੀਂ ਜਾਂਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In His Mercy, He blesses us with the Naam, and then, the writ of pain and pleasure is not written."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਤੂੰ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਨਾਮੁ ਦੇਵੇਂਗਾ, ਫੇਰ ਉਸ ਕੇ ਕਰਮਾਂ ਕਾ ਲੇਖਾ ਨਹੀਂ ਲਿਖਿਆ ਜਾਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਮਿਹਰ ਕਰ ਕੇ ਪ੍ਰਭੂ 'ਨਾਮ' ਦੇਂਦਾ ਹੈ, ਉਸ (ਦੇ ਚੰਗੇ ਮੰਦੇ ਕਰਮਾਂ) ਦਾ ਲੇਖ ਮੁੜ ਨਹੀਂ ਲਿਖਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél a quien bendices con Tu Nombre y por Tu Misericordia, no es llamado a entregar cuentas."