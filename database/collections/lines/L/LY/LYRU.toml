[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਖਿਆ ਬਨ ਤੇ; ਜੀਉ ਉਧਾਰਹੁ ॥"
page = 1004
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and save thy soul from the water of sin."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੀ ਆਤਮਾ ਨੂੰ ਵਿਸ਼ਿਆਂ ਦੇ ਪਾਣੀ ਤੋਂ ਬਚਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Save your soul from the waters of corruption."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਿਸਅਹੁ ਰੂਪ (ਬਨ) ਜਲ ਸੇ ਵਾ (ਧਨ) ਉਜਾੜ ਸੇ ਅਪਨੇ ਜੀਵ ਕੋ ਉਧਾਰੋ ਅਰਥਾਤ ਨਿਕਾਲੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਇਸ ਤਰ੍ਹਾਂ ਮਾਇਆ (ਸਾਗਰ ਦੇ ਠਾਠਾਂ ਮਾਰ ਰਹੇ) ਪਾਣੀ ਤੋਂ (ਆਪਣੀ) ਜਿੰਦ ਨੂੰ ਬਚਾ ਲਵੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਖਿਆ = ਮਾਇਆ। ਬਨ = ਪਾਣੀ। ਤੇ = ਤੋਂ। ਜੀਉ = ਜਿੰਦ। ਉਧਾਰਹੁ = ਬਚਾ ਲਵੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y salva tu Alma de las aguas turbias y contaminadas del error."