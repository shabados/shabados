[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਪੰਤ ਕੁੰਦਨੋ ਗਿਰੰ, ਤ੍ਰਸੰਤ ਸਰਬਤੋ ਦਿਸੰ ॥੨੧੬॥"
page = 572

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Yoginis are dancing in the fourteen directions and the Sumeru mountain are trembling.216."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਦਿਸ਼ਾਵਾਂ ਡਰ ਰਹੀਆਂ ਹਨ ਅਤੇ ਸੁਮੇਰ ਪਰਬਤ ('ਕੁੰਦਨੋ ਗਿਰੰ') ਕੰਬ ਰਿਹਾ ਹੈ ॥੨੧੬॥"