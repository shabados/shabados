data = "ਸਭ ਸ੍ਰੀ ਨਾਮ ਤੁਪਕ ਕੇ ਮਾਨਹੁ ॥੯੦੨॥"
page = 769

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Jalvaasananani”, add the words “Jaachar-nayak-shatru” and know all the names of Tupak.902."

