[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਪਤਿ ਬਿਪਤਿ; ਪਟਲ ਮਾਇਆ ਧਨੁ ॥"
page = 486
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Prosperity, adversity, property and wealth are but the delusions."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕਬਾਲ ਮੁਸੀਬਤ, ਜਾਇਦਾਦ ਅਤੇ ਦੌਲਤ ਕੇਵਲ ਧੋਖੇ ਹੀ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Prosperity, adversity, property and wealth are just Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਪਤਿ ਕਾਲ ਮੇਂ ਧਨ ਕਾ ਪ੍ਰਾਪਤ ਹੋਨਾ ਵਾ ਬਿਪਤ ਕਾ ਪ੍ਰਾਪਤ ਹੋਨਾ ਯਹ ਮਾਯਾ ਕਾ (ਪਟਲੁ) ਪੜਦਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੌਖ, ਬਿਪਤਾ, ਧਨ-ਇਹ ਮਾਇਆ ਦੇ ਪਰਦੇ ਹਨ (ਜੋ ਮਨੁੱਖ ਦੀ ਮੱਤ ਉਤੇ ਪਏ ਰਹਿੰਦੇ ਹਨ);"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਪਤਿ = {Skt. संपत्ति = prosperity, increase of wealth} ਧਨ ਦੀ ਬਹੁਲਤਾ। ਬਿਪਤਿ = {Skt. विपत्ति = A calamity, misfortune} ਬਿਪਤਾ, ਮੁਸੀਬਤ। ਪਟਲ = ਪਰਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La riqueza, la contienda del mundo y las recompensas de Maya"