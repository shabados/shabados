[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਝੂਠ ਬਿਕਾਰ; ਮਹਾ ਲੋਭ ਧ੍ਰੋਹ ॥"
page = 267
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "falsehood, sin, excessive greed and deceit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੂੜ, ਪਾਪ, ਪਰਮ ਲਾਲਚ ਅਤੇ ਛਲ-ਕਪਟ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "falsehood, corruption, immense greed and deceit:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਝੂਠ ਲੋਭ ਧ੍ਰੋਹ) ਛਲ ਆਦਿ ਮਹਾ ਵਿਕਾਰੋਂ ਮੇਂ ਲਗ ਰਹਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਝੂਠ, ਮੰਦੇ ਕਰਮ, ਭਾਰੀ ਲਾਲਚ ਤੇ ਦਗ਼ਾ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧ੍ਰੋਹ = ਠੱਗੀ, ਦਗ਼ਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¡Falsedad y vicio, engaño y avaricia!"