[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪੀਲੂ ਪੇਝੂ ਬੇਰ ਬਹੁ; ਕੇਲੇ ਤੇ ਅਖਨੋਟ ਬਣੰਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Pilu, pejhu, ber, walnut, bananas, (all small and big Indian fruits) also grow on (Indian) trees."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੀਲੂੰ, ਪੇਂਝੂ, ਬੇਰ, ਬਾਹਲੇ ਕੇਲੇ ਤੇ ਅਖਰੋਟ ਲਗਦੇ ਹਨ।"