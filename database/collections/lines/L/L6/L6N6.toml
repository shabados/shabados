[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਸੂ ਪਰੇਤ ਮੁਗਧ ਤੇ ਬੁਰੀ ॥"
page = 890
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Is worse than a beast, a demon and an idiot,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਡੰਗਰ, ਜਿੰਨ-ਭੂਤ ਅਤੇ ਇਕ ਬੁੱਧੂ ਨਾਲੋਂ ਭੀ ਭੈੜੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Worse than a beast, a demon or an idiot,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ! ਏਹ ਦੇਹੀ ਪਸੂ ਔ ਪ੍ਰੇਤ ਤੇ ਭੀ ਬੁਰੀ, ਭਾਵ ਅਤੀ ਅਪਾਵਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਮ ਤੋਂ ਬਿਨਾ, ਵਿਕਾਰਾਂ ਦੇ ਕਾਰਨ) ਮੂਰਖ ਜੀਵ ਦੀ ਇਹ ਦੇਹੀ ਪਸ਼ੂਆਂ ਤੇ ਪਰੇਤਾਂ ਨਾਲੋਂ ਭੀ ਭੈੜੀ (ਸਮਝੋ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ। ਬੁਰੀ = ਭੈੜੀ। ਮੁਗਧ = {मुग्ध} ਮੂਰਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tu cuerpo ahora es peor que el de un cuadrúpedo salvaje"