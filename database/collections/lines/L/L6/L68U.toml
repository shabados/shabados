[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਗੁਰਮੁਖਿ ਰਤਨੁ ਸੋ ਲੇਵੈ ॥੨॥"
page = 145
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, through the Guru he (such a man) receives the Name jewel."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਗੁਰਾਂ ਦੁਆਰਾ ਊਹ (ਐਸਾ ਇਨਸਾਨ) ਨਾਮ ਦੇ ਜਵੇਹਰ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Gurmukh receives the jewel. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਸੋਈ ਗੁਰੋਂਦ੍ਵਾਰਾ ਕੀਰਤੀ ਰੂਪ ਰਤਨ ਕੋ ਲੇਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਮਨੁੱਖ ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੋ ਕੇ (ਨਾਮ-ਰੂਪ) ਰਤਨ ਲੱਭ ਲੈਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y entonces dice Nanak, recibe la joya del Naam, el Nombre del Señor, a través del Guru. (2)"