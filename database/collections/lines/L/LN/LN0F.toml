[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜਿਉ ਧੂਅਰੁ ਝੜੁਵਾਲ ਦੀ; ਕਿਉ ਵਰਸੈ ਪਾਣੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "How out of clouds of smoke rain could take place."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜਿੱਕੁਰ ਧੂਏਂ ਥੋਂ (“ਝੜਵਾਲ ਦੀ”) ਬੱਦਲ ਵਾਲੀ ਬਰਖਾ ਨਹੀਂ ਵਰਸਦੀ ਹੈ, (ਪਾਠਾਤ੍ਰ 'ਧੁੰਅਰ' ਹੈ ਗਯਾਨੀ ਕਹਿੰਦੇ ਹਨ ਕਿ ਝੜ ਵਾਲੀ ਕੁਹੀੜ ਵਿਚੋਂ ਮੀਂਹ ਨਹੀਂ ਵਸਦਾ)।"