[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲੈ ਮਨਿ ਸੂਰਜ ਤੇ ਅਰਿ ਜੀਤ ਜੁ; ਤਾ ਦਿਨ ਆਪਨੇ ਧਾਮਹਿ ਆਯੋ ॥"
page = 501

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Satrajit after taking the jewel from Surya came to his home"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੂਰਜ ਤੋਂ ਮਣੀ ਲੈ ਕੇ ਸਤ੍ਰਾਜਿਤ ਉਸੇ ਦਿਨ ਘਰ ਆਇਆ ਸੀ।"