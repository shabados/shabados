[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਏ ਕ੍ਰਿਪਾਲ ਗੁਸਾਈ ਮੇਰੇ ॥"
page = 1078
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Lord has become merciful,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਡਾਂ ਸੁਆਮੀ ਮਿਹਰਬਾਨ ਹੋ ਗਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My World-Lord has become merciful,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਪਰ ਜਬ ਸੁਆਮੀ ਕ੍ਰਿਪਾਲ ਭਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ (ਹੁਣ) ਮੇਰਾ ਮਾਲਕ-ਪ੍ਰਭੂ ਦਇਆਵਾਨ ਹੋਇਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਸਾਈ = ਮਾਲਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, El Señor me mostró Su Compasión y a través del Guru Perfecto,"