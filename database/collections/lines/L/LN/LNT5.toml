[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਿਸੀ ਰੰਗ ਕੈ ਕਾਛ ਕਾਛੇ ਨਿਹਾਰੇ ॥੬੯੪॥"
page = 272

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "With whatever feeling one thought of him, Ram seemed to him in the same colour.694."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ (ਉਨ੍ਹਾਂ ਨੂੰ) ਉਸੇ ਰੰਗ ਦੇ ਰੂਪ (ਕਾਛ) ਵਿੱਚ ਸਜਿਆ ਹੋਇਆ ਵੇਖਿਆ ਹੈ ॥੬੯੪॥"