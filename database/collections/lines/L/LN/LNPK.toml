[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਭ ਮਿਹਰ ਅਤੇ ਬਖ਼ਸ਼ਿਸ਼ ਉਨ੍ਹਾਂ ਦੀ ਸੰਗਤ ਦੀ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਈਂ ਹਮਾ ਫ਼ੈਜ ਅਜ਼ ਤੁਫ਼ੈਲਿ ਸੁਹਬਤ ਅਸਤ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, has placed him on a higher place out of all high places. (3)"