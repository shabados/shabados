[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ; ਸਾਚੇ ਲਗੈ ਧਿਆਨੁ ॥੧॥"
page = 559
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru, man's attention is fixed on the True One."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਆਦਮੀ ਦੀ ਬਿਰਤੀ ਸਤਿਪੁਰਖ ਨਾਲ ਜੁੜ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh meditates on the True Lord. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖੋਂ ਕਾ ਸਚੇ ਪਰਮੇਸਰ ਵਿਖੇ ਧਿਆਨ ਲਗਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਰਨ ਪਿਆਂ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਵਿਚ ਸੁਰਤ ਜੁੜੀ ਰਹਿੰਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚੇ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਵਿਚ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, el Gurmukj medita en el Verdadero Señor. (1)."