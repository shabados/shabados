[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ; ਪੂਰਨ ਪੁਰਖੁ ਬਿਧਾਤਾ ॥"
page = 273
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The knower of God is the perfect Lord Creator."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨੂੰ ਜਾਨਣ ਵਾਲਾ ਪੂਰਾ ਸੁਆਮੀ ਸਿਰਜਣਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The God-conscious being is the Perfect Supreme Being, who orchestrates all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ ਸਰਬ ਮੇਂ ਪੂਰਨ ਰੂਪ ਬਿਧਾਤਾ ਪੁਰਖ ਕਾ ਸਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਪੂਰਨ ਪੁਰਖ ਤੇ ਕਾਦਰ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਧਾਤਾ = ਪੈਦਾ ਕਰਨ ਵਾਲਾ। ਪੂਰਨ ਪੁਰਖੁ = ਸਭ ਵਿਚ ਵਿਆਪਕ ਪ੍ਰਭੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El ser conciente de Dios, es el Perfecto Ser Supremo, Quien lo orquestra todo."