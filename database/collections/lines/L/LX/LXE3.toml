[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭੁ ਤਨੁ ਮਨੁ ਦੇਹ; ਹਰਿ ਲੀਨੀ ॥"
page = 655
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then the body, soul and person are all absorbed in God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਜਿਸਮ ਆਤਮਾ ਤੇ ਸਰੀਰ ਸਮੂਹ ਹਰੀ ਵਿੱਚ ਸਮਾ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "one's body, mind and entire being are absorbed into the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ (ਤਨੁ) ਸੂਖਮ ਜੋ ਮਨ ਹੈ ਅਰ ਅਸਥੂਲ ਦੇਹ ਮਨ ਕੀ ਮਮਤਾ ਮੇਰੀ ਸਭ ਹਿਰ ਲਈ ਹੈ, ਵਾ (ਹਰਿ ਲੀਨੀ) ਹਰਿ ਮੇਂ ਲੀਨ ਭਈ ਹੈ ਅਰਥਾਤ ਤੀਨੋਂ ਸਰੀਰੋਂ ਕੋ ਹਰੀ ਰੂਪ ਜਾਨਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਤਨ ਤੇ ਮਨ ਸਭ ਹਰੀ ਵਿਚ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ ਲੀਨੀ = ਹਰੀ ਵਿਚ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mi cuerpo y mi mente ahora están inmersos en Dios."