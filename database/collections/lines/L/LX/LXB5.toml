[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਬੁਧਿ ਕਰਨ ਤੇ ਲੋਕ ਹਟਾਇ ॥੨੯॥"
page = 57

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“You go therefore for the spread of Dharma (righteousness) and cause people to retrace their steps from evil actions”.29."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਦੁਰਮਤਿ ਕਰਨ ਤੋਂ ਲੋਕਾਂ ਨੂੰ ਹਟਾਉਣਾ ਹੈ ॥੨੯॥"