[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਛੁ ਨਾਹੀ; ਤਾ ਕੈ ਕਮੀ ॥੨॥"
page = 212
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "there is no paucity of anything for him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕਿਸੇ ਭੀ ਚੀਜ਼ ਦਾ ਘਾਟਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "do not lack anything. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੋ ਕੁਛ ਕਮੀ ਨਹੀਂ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਦੇ ਘਰ ਵਿਚ ਕਿਸੇ ਚੀਜ਼ ਦੀ ਕੋਈ ਥੁੜ ਨਹੀਂ ਰਹਿੰਦੀ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕੈ = ਉਹਨਾਂ ਦੇ ਘਰ ਵਿਚ। ਕਮੀ = ਘਾਟ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no es privado de nada.(2)"