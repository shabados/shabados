[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੋ ਹਰਿ ਸੰਗੇ; ਮਨ ਮੋਹ ॥"
page = 1272
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such love my soul has with the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਹੋ ਜੇਹਾ ਪਿਆਰ ਮੇਰੀ ਜਿੰਦੜੀ ਦਾ ਪ੍ਰਭੂ ਨਾਲ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- so is my mind enticed by the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਸੀ ਪ੍ਰਕਾਰ ਹਰੀ ਕੇ ਸੰਗ ਮਨ ਕੋ ਮੋਹ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਿਵੇਂ (ਤੂੰ ਭੀ) ਪਰਮਾਤਮਾ ਨਾਲ (ਆਪਣੇ) ਮਨ ਦਾ ਪਿਆਰ ਜੋੜ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਐਸੋ = ਇਸੇ ਤਰ੍ਹਾਂ। ਮਨ ਮੋਹ = ਮਨ ਦਾ ਮੋਹ, ਮਨ ਦਾ ਪਿਆਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mi mente es atraída por la Fascinación por Dios."