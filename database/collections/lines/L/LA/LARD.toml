[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਲਿ ਪੰਚਹੁ; ਨਹੀ ਸਹਸਾ ਚੁਕਾਇਆ ॥"
page = 621
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting with the elect my doubt was dispelled not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਖੀ ਜਨਾਂ ਨੂੰ ਮਿਲ ਕੇ, ਮੇਰਾ ਸੰਦੇਹ ਨਵਿਰਤ ਨਾਂ ਹੋਇਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting with the council, my doubts were not dispelled."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ ਪ੍ਰਥਮ ਕਾਲ ਮੇਂ ਜਗ੍ਯਾਸਾ ਧਾਰ ਕੈ (ਪੰਚਹੁ) ਪੰਡਤੋਂ ਕੋ ਮਿਲੇ ਤੌ ਉਨੋਂ ਨੇ ਭੀ ਹਮਾਰਾ ਸੰਸਾ ਨ (ਚੁਕਾਇਆ) ਦੂਰ ਕੀਆ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਨਗਰ ਦੇ ਪੈਂਚਾਂ ਨੂੰ ਮਿਲ ਕੇ (ਕਾਮਾਦਿਕ ਵੈਰੀਆਂ ਤੋਂ ਪੈ ਰਿਹਾ) ਸਹਿਮ ਦੂਰ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਿ = ਮਿਲ ਕੇ {ਲਫ਼ਜ਼ 'ਮਿਲਿ' ਅਤੇ ਅਖ਼ੀਰਲੀ ਤੁਕ ਦੇ ਲਫ਼ਜ਼ 'ਮਿਲੁ' ਦਾ ਫ਼ਰਕ ਧਿਆਨ ਨਾਲ ਵੇਖੋ}। ਮਿਲਿ ਪੰਚਹੁ = (ਨਗਰ ਦੇ) ਪੈਂਚਾਂ ਨੂੰ ਮਿਲ ਕੇ। ਸਹਸਾ = (ਕਾਮਾਦਿਕ ਵੈਰੀਆਂ ਵਲੋਂ ਪੈ ਰਿਹਾ) ਸਹਿਮ। ਚੁਕਾਇਆ = ਮੁਕਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El anciano de la villa no pudo liberarme de mi duda,"