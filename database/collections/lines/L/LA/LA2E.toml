[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਤੇ ਖਾਲੀ ਕੋਈ ਨਾਹੀ; ਐਸਾ ਪ੍ਰਭੂ ਹਮਾਰਾ ॥"
page = 778
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such is my Lord, bereft of whom there is not any one."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹੋ ਜਿਹਾ ਹੈ ਮੇਰਾ ਸੁਆਮੀ ਜਿਸ ਤੋਂ ਸੱਖਣਾ ਕੋਈ ਜਣਾ ਭੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one lacks this Support; such is my God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤੇਰੇ ਸੇਂ ਖਾਲੀ ਕੋਈ ਨਹੀਂ ਜਾਤਾ ਤੂੰ ਐਸਾ ਹਮਾਰਾ ਸਮਰਥ ਸ੍ਵਾਮੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਇਹੋ ਜਿਹਾ ਸਾਡਾ ਮਾਲਕ ਹੈਂ, ਜਿਸ (ਦੇ ਦਰ) ਤੋਂ ਕਦੇ ਕੋਈ ਖ਼ਾਲੀ (ਬੇ-ਮੁਰਾਦ) ਨਹੀਂ ਜਾਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸ ਤੇ = {ਸੰਬੰਧਕ 'ਤੇ' ਦੇ ਕਾਰਨ ਲਫ਼ਜ਼ 'ਜਿਸੁ' ਦਾ (ੁ) ਉਡ ਗਿਆ ਹੈ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "eres tan Compasivo, oh mi Maestro,"