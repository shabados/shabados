[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਰਗਹਿ. ਲੇਖਾ ਮੰਗੀਐ; ਕੋਈ ਅੰਤਿ. ਨ ਸਕੀ ਛਡਾਇ ॥"
page = 1422
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He shall be called to account in the Lord's Court. No one can save him in the end."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਦਰਬਾਰ ਅੰਦਰ ਉਸ ਪਾਸੋ ਹਿਸਾਬ ਕਿਤਾਬ ਪੁਛਿਆ ਜਾਵੇਗਾ। ਅਖੀਰ ਨੂੰ ਉਸ ਨੂੰ ਕੌਈ ਭੀ ਬੰਦ-ਖਲਾਸ ਨਹੀਂ ਕਰਵਾ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He shall be called to account in the Court of the Lord, and in the end, no one will be able to save him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਤਿਸ ਮਨਮੁਖ ਸੇ (ਦਰਗਹਿ) ਪ੍ਰਲੋਕ ਕੇ ਬੀਚ ਲੇਖਾ ਮੰਗੀਏਗਾ ਤਬ ਅੰਤ ਕੋ ਜਮਦੂਤੋਂ ਸੇ ਤਿਸ ਕੋ ਕੋਈ ਛੁਡਾਇ ਨਹੀਂ ਸਕੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੀ ਦਰਗਾਹ ਵਿਚ (ਕੀਤੇ ਕਰਮਾਂ ਦਾ) ਹਿਸਾਬ (ਤਾਂ) ਮੰਗਿਆ (ਹੀ) ਜਾਂਦਾ ਹੈ, (ਮਾਇਆ ਦੇ ਮੋਹ ਦੀ ਫਾਹੀ ਤੋਂ) ਅੰਤ ਵੇਲੇ ਕੋਈ ਛੁਡਾ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਰਗਹਿ = ਪ੍ਰਭੂ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ। ਮੰਗੀਐ = ਮੰਗਿਆ ਜਾਂਦਾ ਹੈ। ਅੰਤਿ = ਅੰਤ ਵੇਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pareja y parientes se incrementa.Él será llamado a entregar cuentas en la Corte del Señor y al final nadie podrá salvarlo."