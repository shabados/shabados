data = "ਅਤਿ ਦੁਖ ਦੇਹ ਆਪਨੀ ਲਹਿ ਹੋ ॥"
page = 887

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(‘The priest had told Raja,) “You would stay at the gate for a few days and try to tolerate the distress"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੀ ਦੇਹ ਨੂੰ ਬਹੁਤ ਦੁਖ ਦਿੰਦੇ ਹੋਏ ਟਿਕੇ ਰਹੋ।"