data = "ਤਬ ਲਉ ਭਈ ਕੈਕਈ ਸਾਤਾ ॥"
page = 288

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many rituals were performed for the salvation of the mother and by that time Kaikeyi had also passed away."

[[content]]
