[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਜਿ ਤੁਹਾਰੈ; ਨਾਹੀ ਹੋਰੁ ॥੧॥ ਰਹਾਉ ॥"
page = 238
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of no avail, is anything else to thee. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਲਾਭ ਦੀ ਹੋਰ ਕੋਈ ਭੀ ਸ਼ੈ ਨਹੀਂ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nothing else is of any use to you. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਕੋਈ ਵਸਤੂ ਹਰੀ ਨਾਮ ਬਿਨਾ ਤੁਮਾਰੇ ਕਾਮ ਨ ਆਵੇਗੀ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਨਾਲ ਪ੍ਰੀਤਿ ਬਣਾਣ ਤੋਂ ਬਿਨਾ) ਕੋਈ ਹੋਰ ਉੱਦਮ ਤੇਰੇ ਕਿਸੇ ਕੰਮ ਨਹੀਂ ਆਵੇਗਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਜਿ = ਕੰਮ ਵਿਚ। ਹੋਰੁ = ਕੋਈ ਹੋਰ ਉੱਦਮ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque ningún otro asunto te será provechoso.  (1-Pausa)"