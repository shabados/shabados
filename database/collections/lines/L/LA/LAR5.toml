[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਰ ਕੇ ਜਿਠੇਰੇ ਕੀ; ਚੂਕੀ ਕਾਣਿ ॥"
page = 370
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have given up the dependence of my husband's elder brother."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਘਰ ਵਾਲੇ ਦੇ ਵੱਡੇ ਭਾਈ ਦੀ ਮੁਹਤਾਜੀ ਛੱਡ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am no longer swayed by the fear of Death (my elder brother-in-law)."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਘਰ ਕੇ ਜਿਠੇਰੇ) ਧਰਮਰਾਇ ਕੀ ਕਾਨ ਭੀ ਛੁਟ ਗਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੇਰੇ ਉਤੇ) ਜੇਠ (ਧਰਮ-ਰਾਜ) ਦੀ ਭੀ ਧੌਂਸ ਨਹੀਂ ਰਹੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਠੇਰਾ = ਸਰਬ-ਰਾਜ। ਕਾਣਿ = ਧੌਂਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La muerte, el hermano mayor de mi Esposo,"