[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮਹਿ ਰਾਖਉ; ਏਕ ਅਸਾਰੇ ॥"
page = 533
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within my mind I have the prop of the Lord alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਚਿੱਤ ਅੰਦਰ ਕੇਵਲ ਪ੍ਰਭੂ ਦਾ ਹੀ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Within my mind, I have the Support of the One Lord alone."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਨੇ ਮਨ ਮੇਂ ਏਕ ਤੇਰਾ ਹੀ ਆਸਰਾ ਰਖਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਮਨ ਵਿਚ ਸਿਰਫ਼ ਤੇਰੀ ਹੀ ਸਹਾਇਤਾ ਦੀ ਆਸ ਰੱਖਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਖਉ = ਰਾਖਉਂ, ਮੈਂ ਰੱਖਦਾ ਹਾਂ। ਅਸਾਰੇ = ਆਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, el Uno es lo Único importante en mí porque el Señor"