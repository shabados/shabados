data = "ਰਚਿ ਅੰਡਜ ਸੇਤਜ ਉਤਭੁਜੰ ॥"
page = 31

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He Created many beings of the divisions of creation including Andaja Suetaja and Uddhihibhijja!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅੰਡੇ, ਪਸੀਨੇ ਤੋਂ ਪੈਦਾ ਹੋਣ ਵਾਲੀਆਂ ਵਸਤੂਆਂ ਅਤੇ ਬਨਸਪਤੀ ਦੀ ਰਚਨਾ ਕੀਤੀ ਹੈ,"