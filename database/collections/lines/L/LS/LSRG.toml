[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਈ ਬ੍ਰਹਮਣੁ; ਪੂਜਣ ਜੁਗਤੁ ॥੧੬॥"
page = 1411
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such a Brahman alone is worthy of being worshipped."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਇਹੋ ਜਿਹਾ ਬ੍ਰਹਮਣ ਹੀ ਉਪਾਸ਼ਨਾ ਕਰਨ ਦੇ ਲਾਇਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such a Brahmin is worthy of being worshipped. ||16||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਇਨ ਲਖਣੋਂ ਵਾਲਾ ਬ੍ਰਹਮਣ ਪੂਜਣੇ ਯੋਗ ਹੋਤਾ ਹੈ॥੧੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਬ੍ਰਾਹਮਣ ਆਦਰ-ਸਤਕਾਰ ਦਾ ਹੱਕਦਾਰ ਹੈ ॥੧੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਜਣ ਜੁਗਤੁ = ਪੂਜਣ ਦੇ ਲਾਇਕ ॥੧੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal Brahmán es digno de ser alabado. (16)"