[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿ ਮਾ ਹਮ ਬਸਾ ਫ਼ੀਲ ਬਖ਼ਸ਼ੀਦਹਅਮ ॥੪੦॥"
page = 1396

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘You, the one deserving royal canopy and the throne,(40)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜੋ ਬਚੇ ਸਨ, ਉਹ (ਲੋਕਾਂ-ਸੇਵਕਾਂ ਨੂੰ) ਬਖ਼ਸ਼ ਦਿੱਤੇ। (ਹੁਣ ਮੇਰੇ ਪਾਸ ਕੋਈ ਵੀ ਨਹੀਂ) ॥੪੦॥"