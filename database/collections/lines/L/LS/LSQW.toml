[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਿਪੁ ਕੇ ਬਚਨ ਸੁੰਨਤ ਹੀ ਸਿੰਘ ਭਈ ਅਸਵਾਰ ॥"
page = 84

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Hearing the words of the enemy, the goddess mounted her lion.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵੈਰੀ ਦੇ ਬੋਲ ਸੁਣਦਿਆਂ ਹੀ (ਚੰਡੀ ਦੇਵੀ) ਸ਼ੇਰ ਉਤੇ ਸਵਾਰ ਹੋ ਗਈ"