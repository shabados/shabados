[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਗ ਰਚਨਾ ਤੈਸੇ ਰਚੀ; ਕਹੁ ਨਾਨਕ. ਸੁਨਿ ਮੀਤ ॥੨੫॥"
page = 1427
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "So was the creation of the world made, says Nanak, hearken thou, O friend of mine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਏਸੇ ਤਰ੍ਹਾਂ ਹੀ ਇਸ ਸੰਸਾਰ ਦੀ ਉਤਪਤੀ ਕੀਤੀ ਗਈ ਹੈ, ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਤੂੰ ਸੁਣ, ਹੇ ਮੇਰੇ ਮਿੱਤਰ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "so is the universe created; says Nanak, listen, O my friend! ||25||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਪ੍ਰਕਾਰ ਜਗਤ ਕੀ ਰਚਨਾ ਕਰਤਾਪੁਰਖ ਨੇ ਰਚੀ ਹੈ॥੨੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਹੇ ਮਿੱਤਰ! ਸੁਣ, ਤਿਵੇਂ ਹੀ (ਪਰਮਾਤਮਾ ਨੇ) ਜਗਤ ਦੀ (ਇਹ) ਖੇਡ ਬਣਾਈ ਹੋਈ ਹੈ ॥੨੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਚੀ = ਬਣਾਈ ਹੋਈ ਹੈ। ਮੀਤ = ਹੇ ਮਿੱਤਰ! ॥੨੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así es el Universo Creado, dice Nanak, escucha oh amigo mío. (25)"