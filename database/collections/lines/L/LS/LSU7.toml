[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਰਾਮਦਾਸ ਘਰਿ; ਕੀਅਉ ਪ੍ਰਗਾਸਾ ॥"
page = 1407
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He made himself manifest in the house of Guru Ram Dass,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਗੁਰੂ ਰਾਮਦਾਸ ਦੇ ਧਾਮ ਅੰਦਰ ਪ੍ਰਗਟ ਹੋਏ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He was revealed in the House of Guru Raam Daas,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਰਾਮਦਾਸ ਸਾਹਿਬ ਜੀ ਕੇ ਘਰ ਮੇਂ ਆਪ ਨੇ ਪ੍ਰਕਾਸ ਕੀਆ ਹੈ, ਭਾਵ ਪ੍ਰਗਟ ਭਏ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਆਪ ਨੇ) ਗੁਰੂ ਰਾਮਦਾਸ (ਜੀ) ਦੇ ਘਰ ਵਿਚ ਜਨਮ ਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਰਾਮਦਾਸ ਘਰਿ = ਗੁਰੂ ਰਾਮਦਾਸ (ਜੀ) ਦੇ ਘਰ ਵਿਚ। ਕੀਅਉ ਪ੍ਰਗਾਸਾ = ਪ੍ਰਗਟ ਹੋਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él fue revelado en la Casa de Guru Ram Das, y todas las esperanzas y añoranzas fueron satisfechas."