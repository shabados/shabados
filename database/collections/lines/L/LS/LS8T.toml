[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੀਤਿ ਜੀਤਿ ਲਯੋ ਜਿਨੈ; ਕਈ ਬਾਰ ਇੰਦ੍ਰ ਉਪੇਾਂਦ੍ਰ ॥"
page = 106

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Who had several times conquered the king and other chieftains of gods."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੇ ਕਈ ਵਾਰ ਇੰਦਰ ਅਤੇ ਉਪੇਂਦਰ ਨੂੰ ਜਿਤ ਲਿਆ ਹੈ"