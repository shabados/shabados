[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਹਾ ਰੁਦ੍ਰ ਜੂ ਕੋ ਪਕਰਿ; ਤਾਹਿ ਨ ਦਯੋ ਜਰਾਇ ॥੨੩॥"
page = 834

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Why didn’t Ruder, the Great (Shiva) decimated it (sexual desire).’(23)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਸ਼ਿਵ ਜੀ ਨੇ ਪਕੜ ਕੇ ਸਾੜ ਹੀ ਕਿਉਂ ਨਾ ਦਿੱਤਾ (ਤਾਂ ਜੋ ਮੇਰੀ ਅਜਿਹੀ ਦਸ਼ਾ ਨਾ ਕਰ ਸਕਦਾ) ॥੨੩॥"