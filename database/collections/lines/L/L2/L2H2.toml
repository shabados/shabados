[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕਿ ਦਾਤੇ. ਇਕਿ ਭੇਖਾਰੀ ਜੀ; ਸਭਿ ਤੇਰੇ ਚੋਜ ਵਿਡਾਣਾ ॥"
page = 11
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some are the givers and some the mumpers. All these are Thine worderous frolics."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਸਖ਼ੀ ਹਨ, ਅਤੇ ਕਈ ਮੰਗਤੇ। ਇਹ ਸਾਰੀਆਂ ਤੇਰੀਆਂ ਅਸਚਰਜ ਖੇਡਾਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some are givers, and some are beggars. This is all Your Wondrous Play."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰਿ ਜੀ! ਸੰਸਾਰ ਮੈ ਜੋ ਏਕ ਦਾਤੇ ਬਨੇ ਹੂਏ ਹੈਂ ਔਰੁ ਏਕ ਭਿੱਛਕ ਬਨੇ ਹੂਏ ਹੈਂ। ਏਹ ਸਭ (ਵਿਡਾਣਾ) ਅਸਚਰਜ ਰੂਪ ਤੇਰੇ ਹੀ (ਚੋਜ) ਤਮਾਸ਼ੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਫਿਰ ਭੀ) ਕਈ ਜੀਵ ਦਾਨੀ ਹਨ, ਕਈ ਜੀਵ ਮੰਗਤੇ ਹਨ-ਇਹ ਸਾਰੇ ਤੇਰੇ ਹੀ ਅਚਰਜ ਤਮਾਸ਼ੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਕਿ = {ਲਫ਼ਜ਼ 'ਇਕ' ਤੋਂ ਬਹੁ-ਵਚਨ} ਕਈ ਜੀਵ। ਦਾਤੇ = ਦਾਨੀ। ਭੇਖਾਰੀ = ਮੰਗਤੇ। ਸਭਿ = ਸਾਰੇ। ਵਿਡਾਣ = ਅਚਰਜ। ਚੋਜ = ਕੌਤਕ, ਤਮਾਸ਼ੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunos son los que dan y otros los pordioseros que toman, todo esto es Tu Maravilloso Juego."