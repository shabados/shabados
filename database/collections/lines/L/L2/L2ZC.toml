[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਗੁਰ ਬੂਝੇ; ਜਮ ਕੀ ਫਾਸੀ ॥"
page = 1344
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without knowing the Guru, he is caught in the Yama's noose."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਨੂੰ ਜਾਣਨ ਦੇ ਬਾਝੋਂ, ਉਹ ਯਮ ਦੀ ਫਾਹੀ ਵਿੱਚ ਜਾ ਫਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without knowing the Guru, they cannot escape the noose of Death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਦ੍ਵਾਰਾ ਸ੍ਵੈ ਸਰੂਪ ਸਮਝੇ ਤੇ ਬਿਨਾਂ ਜਮੋਂ ਕੀ ਫਾਸੀ ਮੇਂ ਪੜਤਾ ਹੈ, ਭਾਵ ਪੀੜਾ ਕੋ ਸਹਾਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਤੋਂ ਬਿਨਾ ਸਹੀ ਜੀਵਨ-ਰਾਹ ਨਹੀਂ ਸਮਝਦਾ ਤੇ ਜਮ ਦੀ ਫਾਹੀ (ਇਸ ਦੇ ਗਲ ਵਿਚ ਪਈ ਰਹਿੰਦੀ ਹੈ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin conocer al Guru, nunca podrás escapar del dogal de la muerte."