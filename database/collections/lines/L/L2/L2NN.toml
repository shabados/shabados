[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਸਤਿਗੁਰਿ ਨਾਮੁ ਦ੍ਰਿੜਾਇਆ; ਤਿਨਿ ਹੰਉਮੈ ਦੁਬਿਧਾ ਭੰਨੀ ॥"
page = 590
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The great True Guru implants the Name in them, and that stills their ego and duality."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵੱਡੇ ਸੱਚੇ ਗੁਰੂ ਜੀ ਉਨ੍ਹਾਂ ਦੇ ਹੰਕਾਰ ਤੇ ਦਵੈਤ-ਭਾਵ ਨੂੰ ਨਾਸ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru, the True Guru, implants the Naam within them, and their egotism and duality are silenced."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੋ ਪੂਜ੍ਯ ਸਤਿਗੁਰੋਂ ਨੇ ਨਾਮੁ ਦ੍ਰਿਢ ਕਰਾਇਆ ਹੈ, ਇਸਸੇ ਤਿਨੋਂ ਨੇ ਹੰਤਾ ਮਮਤਾ ਔ ਦੁਬਿਧਾ ਤੋੜ ਦੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਨੇ (ਜਿਸ ਦੇ ਭੀ ਹਿਰਦੇ ਵਿਚ) ਨਾਮ ਦ੍ਰਿੜ੍ਹ ਕੀਤਾ ਹੈ ਉਸ ਨੇ ਹਉਮੈ ਤੇ ਦੁਬਿਧਾ (ਹਿਰਦੇ ਵਿਚੋਂ) ਭੰਨ ਸੁੱਟੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਨਿ = ਉਸ ਨੇ। ਭੰਨੀ = ਨਾਸ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Naam les es implantado, y logran calmar su egoísmo y su dualidad."