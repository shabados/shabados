[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਬਦਿ ਮੁਏ; ਮਨੁ. ਮਨ ਤੇ ਮਾਰਿਆ ॥"
page = 796
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who dies by the name, conquers his mind through the mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਮ ਦੁਆਰਾ ਮਰ ਜਾਂਦਾ ਹੈ; ਉਹ ਮਨੂਏ ਰਾਹੀਂ ਹੀ ਆਪਣੇ ਮਨੂਏ ਨੂੰ ਜਿੱਤ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who dies in the Word of the Shabad conquers his mind, through his mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਜੋ ਪੁਰਖ ਸਤਗੁਰੋਂ ਕੇ (ਸਬਦਿ) ਉਪਦੇਸ ਕਰ ਜੀਵ ਭਾਵ ਸੇ ਮਰੇ ਹੈਂ, ਤਿਨੋਂ ਨੇ ਅਪਨੇ ਮਨ ਕੌ ਮੈਂ ਮੇਰੀ ਮਨੌਤ ਤੇ ਮਾਰਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਮਨੁੱਖ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਵਿਚ ਜੁੜ ਕੇ ਆਪਾ-ਭਾਵ ਮੁਕਾਂਦੇ ਹਨ ਆਪਣੇ ਮਨ ਨੂੰ ਮਾਇਕ ਫੁਰਨਿਆਂ ਵਲੋਂ ਰੋਕ ਲੈਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਬਦਿ = ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ, ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ ਵਿਚ (ਜੁੜ ਕੇ)। ਮੁਏ = ਜੋ ਮਨੁੱਖ ਆਪਾ-ਭਾਵ ਵਲੋਂ ਮਰੇ ਹਨ। ਮਨ ਤੇ = ਮਨ ਤੋਂ, ਮਾਨਸਕ ਫੁਰਨਿਆਂ ਤੋਂ, ਮਾਇਕ ਫੁਰਨਿਆਂ ਵਲੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A través de la Palabra del Shabd, muere para su ego y a través de la disciplina conquista su mente."