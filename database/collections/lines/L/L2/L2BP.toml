[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੋਲੈ ਈਸਰੁ ਸਤਿ ਸਰੂਪੁ ॥"
page = 952
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, hear thou, O Ishar the Lord is the Embodiment of truth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਫੁਰਮਾਉਂਦੇ ਹਨ, ਤੂੰ ਸੁਣ, ਹੇ ਈਸ਼ਰ! ਪ੍ਰਭੂ ਸੱਚ ਦਾ ਪੁੰਜ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Eeshar, the Lord is the embodiment of Truth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਈਸਰ ਕੋ ਕਹਿਤੇ ਹੈਂ: ਜੋ ਪਰਮੇਸਰ ਸਤ ਸਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਈਸ਼ਰ (ਜੋਗੀ ਭੀ ਅਸਲ ਗ੍ਰਿਹਸਤੀ ਵਾਲੀ ਇਹ ਜੁਗਤਿ ਵਰਤ ਕੇ) ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਨੂੰ ਜਪੇ ਤਾਂ ਇਹ ਭੀ ਪਰਮ ਬ੍ਰਹਮ ਵਿਚ ਲੀਨ ਹੋ ਜਾਏ, ਇਸ ਦਾ ਕੋਈ (ਵੱਖਰਾ) ਰੂਪ ਰੇਖ ਨਾਹ ਰਹਿ ਜਾਏ (ਭਾਵ, ਹੇ ਈਸ਼ਰ ਜੋਗੀ! ਜੇ ਤੂੰ ਭੀ ਉਪਰ-ਦੱਸੀ ਜੁਗਤਿ ਨਾਲ ਪ੍ਰਭੂ ਨੂੰ ਜਪੇਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿ = ਪਰਮ ਜੋਤਿ, ਪਰਮ ਆਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Ishar, el Yogui, nuestro Dios Benévolo es la Encarnación de la Verdad;"