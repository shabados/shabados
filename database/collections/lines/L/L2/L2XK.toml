[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਮੋਹਿ; ਦੂਜੈ ਜੰਤ ਪਾਜੇ ॥"
page = 1053
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and attaches them with mammon, worldly love and duality."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਧਨ-ਦੌਲਤ ਸੰਸਾਰੀ ਮਮਤਾ ਅਤੇ ਦਵੈਤ-ਭਾਵ ਨਾਲ ਜੋੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and attaches them to duality, attachment and Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਕੇ ਮੋਹ ਕਰ ਕੇ ਦ੍ਵੈਤ ਭਾਵ ਮੇਂ ਜੰਤ (ਪਾਜੇ) ਜੋੜੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ, ਮੇਰ-ਤੇਰ ਵਿਚ ਭੀ ਜੀਵ (ਉਸ ਨੇ ਆਪ ਹੀ) ਪਾਏ ਹੋਏ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਿ = ਮੋਹ ਵਿਚ। ਦੂਜੈ = ਮੇਰ-ਤੇਰ ਵਿਚ। ਪਾਜੇ = ਪਾਏ ਹੋਏ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero entregándose al amor de la ilusión, esa criatura se apega al otro."