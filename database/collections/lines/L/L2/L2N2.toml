data = "ਜਿਸ ਦੀ ਦੇਵਤੇ, ਦੈਂਤ ਅਤੇ ਮਨੁੱਖ ਬੰਦਨਾ ਕਰਦੇ ਹਨ ॥੧੫॥੧੫੫॥"