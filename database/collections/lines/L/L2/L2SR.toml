[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈਸੀ ਮੂੜ; ਕੁਟੰਬ ਪਰਾਇਣ ॥"
page = 1164
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and as a fool is dedicated unto is his dear ones,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜਿਸ ਤਰ੍ਹਾਂ ਮੂਰਖ ਆਪਣੇ ਪਰਵਾਰ ਦੇ ਸਮਰਪਨ ਹੋਇਆ ਹਇਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and as the fool is attached to his family"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੀ (ਮੂੜ) ਮੂਰਖ ਪੁਰਸ ਕੀ ਸਨਬੰਧੀਓਂ ਕੇ ਸਨੇਹ ਮੇਂ ਤਤਪਰ ਰਹਣੇ ਕੀ ਪ੍ਰੀਤਿ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਕੋਈ ਮੂਰਖ ਆਪਣੇ ਟੱਬਰ ਦੇ ਆਸਰੇ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂੜ = ਮੂਰਖ ਬੰਦੇ। ਕੁਟੰਬ = ਪਰਵਾਰ। ਪਰਾਇਣ = ਆਸਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como la mujer ignorante se apoya en su familia,"