[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ ਕੀ ਸੇਵਾ; ਇਹੁ ਤਪੁ ਪਰਵਾਣੁ ॥"
page = 948
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The penitence of the, service of the True Guru; alone is acceptable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਟਹਿਲ ਸੇਵਾ ਕੇਵਲ ਇਹ ਤਪਸਿਆ ਹੀ ਕਬੂਲ ਪੈਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serving the True Guru - this is the only acceptable disciplined meditation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਕੀ ਜੋ ਸੇਵਾ ਕਰਨੀ ਹੈ, ਇਹੀ ਤਪ ਪਰਮੇਸ੍ਵਰ ਕੀ ਦਰਗਾਹ ਮੇਂ ਪਰਵਾਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰ ਦੀ (ਦੱਸੀ ਹੋਈ) ਕਾਰ ਕਰਨੀ-ਇਹ ਤਪ (ਪ੍ਰਭੂ ਦੀਆਂ ਨਜ਼ਰਾਂ ਵਿਚ) ਕਬੂਲ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El servir al Guru es la austeridad aprobada por Dios;"