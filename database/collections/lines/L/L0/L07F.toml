[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਣਹਾਰ ਕੀ ਸੇਵ; ਨ ਸਾਧੀ ॥੧॥"
page = 741
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and performs not the service of his Creator."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੇ ਕਰਤਾਰ ਦੀ ਘਾਲ ਨਹੀਂ ਕਮਾਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has not performed any service to the Creator Lord. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜਗਤ ਕੇ ਕਰਣਹਾਰ! ਹਮ ਨੇ ਤੇਰੀ ਸੇਵਾ ਨਹੀਂ ਕਰੀ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਾਨੂੰ ਪੈਦਾ ਕਰਨ ਵਾਲਾ ਹੈਂ, ਅਸੀਂ ਤੇਰੀ ਸੇਵਾ-ਭਗਤੀ ਨਹੀਂ ਕਰਦੇ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵ = ਭਗਤੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No ha ofrecido ningún servicio a su Señor Creador.(1)"