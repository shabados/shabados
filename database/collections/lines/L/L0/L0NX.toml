type = "primary"
data = "ਸਹੀ ਕਾਮ ਲੇਖੈ ॥"
page = 209

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The women of the city look (toward Ram), they considered him Kamdev (Cupid) in reality."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਹੀ ਕਾਮ ਰੂਪ ਕਰ ਕੇ ਸਮਝਿਆ।"