[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਫੇਰਿ ਲਗਿਯੋ ਤਿਨ ਕੋ ਹਰਿ ਮਾਰਨ; ਜੁਧਹ ਕੇ ਰਸ ਮੋ ਅਨੁਰਾਗਿਯੋ ॥"
page = 379

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Krishna also absorbed in fighting also began to kill them"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਉਨ੍ਹਾਂ ਨੂੰ ਫਿਰ ਮਾਰਨ ਲਗ ਗਏ, (ਉਹ) ਯੁੱਧ ਦੇ ਰਸ ਵਿਚ (ਪੂਰੀ ਤਰ੍ਹਾਂ) ਗੜੁਚ ਸਨ।"