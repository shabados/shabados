[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਤੈ ਪ੍ਰਕਾਰਿ; ਨ ਤੂਟਉ ਪ੍ਰੀਤਿ ॥"
page = 684
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, so immaculate should be the way of life of Thy slave,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਕਿਸੇ ਤਰ੍ਹਾਂ ਭੀ ਉਸ ਦਾ ਤੇਰੇ ਨਾਲੋਂ ਪਿਆਰ ਨਾਂ ਟੁੱਟੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The lifestyle of Your slave is so pure,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਿਗੁਰੂ! ਜੋ ਕਿਸੀ ਪ੍ਰਕਾਰ ਤੇਰੀ ਪ੍ਰੀਤੀ ਨ ਤੂਟੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਕਿਸੇ ਤਰ੍ਹਾਂ ਭੀ (ਤੇਰੇ ਦਾਸਾਂ ਦੀ) ਪ੍ਰੀਤਿ (ਕਿਧਰੇ ਤੇਰੇ ਨਾਲੋਂ) ਟੁੱਟ ਨਾਹ ਜਾਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਤੈ ਪ੍ਰਕਾਰਿ = ਕਿਸੇ ਤਰ੍ਹਾਂ ਭੀ। ਨ ਤੂਟਉ = ਟੁੱਟ ਨਾਹ ਜਾਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, no permitas que haga a un lado Tu Amor, por ningún motivo."