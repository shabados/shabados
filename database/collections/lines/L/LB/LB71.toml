data = "ਪਾਰਬ੍ਰਹਮ ਜਬ ਭਏ ਕ੍ਰਿਪਾਲ ॥"
page = 863
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When He, the Transcendent Lord, becomes merciful,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਹ ਪਰਮ ਪ੍ਰਭੂ ਦਇਆਵਾਨ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Supreme Lord God becomes merciful,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਪਾਰਬ੍ਰਹਮ ਕ੍ਰਿਪਾਲ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਦੋਂ ਪ੍ਰਭੂ ਜੀ ਦਇਆਵਾਨ ਹੁੰਦੇ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando, Él, el Señor Trascendente, nos muestra Su Misericordia,"