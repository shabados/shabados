[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿ ਕਿਸ਼ਤੀ ਬਰ ਆਮਦ ਜ਼ਿ ਦਰੀਯਾ ਕਿਨਾਰ ॥੬੯॥"
page = 1419

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The boat reached the safety of the bank.(69)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਕਿਸ਼ਤੀ ਦਰਿਆ ਤੋਂ ਬਾਹਰ ਕੰਢੇ ਉਤੇ ਆ ਪਹੁੰਚੀ ॥੬੯॥"