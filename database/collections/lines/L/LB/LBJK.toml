[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕਿ ਗ੍ਰਿਹ ਕੁਟੰਬ ਮਹਿ; ਸਦਾ ਉਦਾਸੀ ॥"
page = 1046
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "some there are who ever detached midst their home and kith and kin,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਆਪਣੇ ਘਰ ਅਤੇ ਪਰਵਾਰ ਅੰਦਰ ਹਮੇਸ਼ਾਂ ਨਿਰਲੇਪ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some, in the midst of their household and family, remain always unattached."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਕ ਘਰ ਅਰ ਕੁਟੰਬ ਮੇਂ ਰਹਿ ਕੇ ਹੀ ਸਦਾ ਉਦਾਸੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ, ਕਈ ਐਸੇ ਹਨ ਜੋ ਗ੍ਰਿਹਸਤ ਵਿਚ ਪਰਵਾਰ ਵਿਚ (ਰਹਿੰਦੇ ਹੋਏ ਹੀ) ਸਦਾ ਨਿਰਮੋਹ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਦਾਸੀ = ਨਿਰਮੋਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunos permanecen desapegados aun en medio de su hogar,"