data = "ਕਾਹੂ ਬਿਹਾਵੈ; ਬਾਲ ਪੜਾਵਤ ॥"
page = 914
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some pass their life teaching the Children."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਆਪਣਾ ਜੀਵਨ ਬੱਚਿਆਂ ਨੂੰ ਪੜਾਉਦਿਆਂ ਬਿਤਾ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some pass their lives teaching children."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਸੀ ਕੀ ਬਾਲਕੋਂ ਕੇ ਪੜਾਵਨੇ ਮੇਂ ਹੀ ਬੀਤਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਮਨੁੱਖ ਦੀ ਉਮਰ ਮੁੰ​‍ਡੇ ਪੜ੍ਹਾਉਂਦਿਆਂ ਲੰਘ ਜਾਂਦੀ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਲ ਪੜਾਵਤ = ਮੁੰ​‍ਡੇ ਪੜ੍ਹਾਂਦਿਆਂ।"

