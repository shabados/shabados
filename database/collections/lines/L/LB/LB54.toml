[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵਤ ਜਾਤ; ਨਰਕ ਅਵਤਾਰ ॥"
page = 299
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It comes, goes and fall into hell."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਆਉਂਦਾ ਜਾਂਦਾ ਅਤੇ ਦੋਜ਼ਕ ਵਿੱਚ ਪੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It comes and goes, and is reincarnated in hell."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਾਂ ਤੇ ਜਨਮਤਾ ਮਰਤਾ ਪੁਨਾ ਨਰਕ ਮੇਂ (ਅਵਤਾਰ) ਜਨਮ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਕਰਕੇ ਇਹ) ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਵਿਚ ਪਿਆ ਰਹਿੰਦਾ ਹੈ, ਦੁੱਖਾਂ ਵਿਚ ਹੀ ਜੰਮਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਵਤਾਰ = ਜਨਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así viene y va y cae en la oscuridad de la conciencia."