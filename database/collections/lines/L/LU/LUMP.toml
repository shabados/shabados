[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਲੁ ਨਾਨਕ ਦੇਵ; ਜਗਤ ਗੁਰ ਕੇਰੈ ॥੨॥੧॥੩੪॥"
page = 1304
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Luminous, Lord, the Guru of the universe, meet Thou with Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਸਾਰ ਦੇ ਗੁਰੂ, ਪ੍ਰਕਾਸ਼ਵਾਨ ਪ੍ਰਭੂ! ਤੂੰ ਨਾਨਕ ਨੂੰ ਮਿਲ ਪਊ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please come and meet Nanak, O Divine Guru of the World. ||2||1||34||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਾਂ ਤੇ ਹੇ ਜਗਤ ਕੇ ਗੁਰੂ ਹਰੀ! ਮੇਰੇ ਕੋ ਮਿਲੋ॥੨॥੧॥੩੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਜਗਤ ਦੇ ਗੁਰਦੇਵ! (ਮੈਨੂੰ) ਨਾਨਕ ਨੂੰ ਮਿਲ ॥੨॥੧॥੩੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲੁ ਨਾਨਕ = ਨਾਨਕ ਨੂੰ ਮਿਲ। ਦੇਵ ਜਗਤ ਗੁਰ ਕੇਰੈ = ਹੇ ਜਗਤ ਕੇਰੈ ਗੁਰਦੇਵ! ॥੨॥੧॥੩੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por favor ven y encuentra a Nanak, oh Divino Guru del Mundo. (2-1-34)"