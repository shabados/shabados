[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੇ ਜਨ; ਕੈ ਸਿਉ ਕਰਹੁ ਪੁਕਾਰਾ ॥"
page = 1128
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man, before whom are thou to lodge a complaint?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੰਦੇ! ਤੂੰ ਕੀਹਦੇ ਮੂਹਰੇ ਫਰਿਆਦ ਕਰਨੀ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mortal, unto whom will you complain?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜਨੋ! ਕਿਸ ਪਾਸ ਪੁਕਾਰ ਕਰੋਗੇ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਕੋਈ ਔਕੜ ਆਉਣ ਤੇ ਤੁਸੀਂ ਪਰਮਾਤਮਾ ਨੂੰ ਛੱਡ ਕੇ) ਕਿਸੇ ਹੋਰ ਅੱਗੇ ਤਰਲੇ ਨਾਹ ਕਰਦੇ ਫਿਰੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇ ਜਨ = ਹੇ ਭਾਈ! ਕੈ ਸਿਉ = (ਪਰਮਾਤਮਾ ਨੂੰ ਛੱਡ ਕੇ ਹੋਰ) ਕਿਸ ਅੱਗੇ? ਕਰਹੁ = ਤੁਸੀਂ ਕਰਦੇ ਹੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh seres humanos, ¿a quién le podemos ir a llorar?,"