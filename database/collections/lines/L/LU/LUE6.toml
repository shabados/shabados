[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਥ ਇੰਦ੍ਰ ਆਇ ਦਰਸਨ ਕੀਆ ਅਰੁ ਬੇਨਤੀ ਕਰਤ ਭਯਾ ॥"
page = 333

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Now begins the description of Indra’s coming to see Krishna and supplicate to him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਇੰਦ੍ਰ ਨੇ ਆ ਕੇ ਦਰਸ਼ਨ ਕੀਤਾ ਅਤੇ ਬੇਨਤੀ ਕਰਨ ਲਗਾ"