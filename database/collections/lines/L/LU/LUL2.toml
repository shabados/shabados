[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਮੁ ਕ੍ਰੋਧੁ ਜਿਹ ਪਰਸੈ ਨਾਹਨਿ; ਤਿਹ ਘਟਿ ਬ੍ਰਹਮੁ ਨਿਵਾਸਾ ॥੨॥"
page = 633
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and whom lust and wrath touch not, within his mind abides the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜਿਸ ਨੂੰ ਭੋਗ-ਬਿਲਾਸ ਅਤੇ ਗੁੱਸਾ ਪੋਹਦਾ ਨਹੀਂ, ਉਸ ਦੇ ਹਿਰਦੇ ਅੰਦਰ ਪ੍ਰਭੂ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "who is not touched by sexual desire or anger - within his heart, God dwells. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਾਮ, ਕ੍ਰੋਧਾਦਿਕ ਬਿਕਾਰ ਜਿਸ ਕੋ ਸਪਰਸ ਨਹੀ ਕਰਤੇ ਹੈਂ, ਤਿਸ ਪੁਰਸ ਕੇ ਰਿਦੇ ਮੇਂ ਬ੍ਰਹਮ ਕਾ ਨਿਵਾਸ ਹੈ, ਭਾਵ ਤਿਸ ਕੋ ਬ੍ਰਹਮ ਸਾਖ੍ਯਾਤ ਹੂਆ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਨਾਹ ਕਾਮ-ਵਾਸਨਾ ਛੋਹ ਸਕਦੀ ਹੈ ਨਾਹ ਕ੍ਰੋਧ ਛੋਹ ਸਕਦਾ ਹੈ, ਉਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਨਿਵਾਸ ਹੋ ਜਾਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਹ ਘਟਿ = ਉਸ ਦੇ ਹਿਰਦੇ ਵਿਚ। ਬ੍ਰਹਮੁ ਨਿਵਾਸਾ = ਪਰਮਾਤਮਾ ਦਾ ਨਿਵਾਸ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A Quien la lujuria y el enojo no lo visitan y habita en la Conciencia de Dios. (2)"