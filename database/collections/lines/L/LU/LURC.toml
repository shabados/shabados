[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੁਨ ਆਪੁ; ਆਪ ਹੀ ਉਪਾਯਉ ॥"
page = 1405
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His ownself, He Himself has created."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਆਪ, ਉਸ ਨੇ ਆਪੇ ਹੀ ਰਚਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself created Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਅਪਨਾ ਆਪ ਰੂਪ ਜਗਤ ਮੇਂ ਆਪ ਹੀ ਉਪਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਆਪ (ਜਿਸ ਨੇ) ਆਪ ਹੀ ਪੈਦਾ ਕੀਤਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੁਨ ਆਪੁ = ਆਪਣਾ ਆਪ। ਉਪਾਯਉ = ਪੈਦਾ ਕੀਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo se creó a Sí Mismo. Ni los ángeles, ni los seres humanos,"