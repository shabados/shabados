[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੂਡ ਮੁੰਡਾਏ; ਜੌ ਸਿਧਿ ਪਾਈ ॥"
page = 324
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If perfection be obtained by shaving the head,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਸਿਰ ਮੁੰਨਾਉਣ ਦੁਆਰਾ ਪੂਰਨਤਾ ਮਿਲ ਜਾਂਦੀ ਹੋਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If the spiritual perfection of the Siddhas could be obtained by shaving the head,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਸਿਰ ਮੁਨਾ ਲੈਣੇ ਕਰ ਜੇ (ਸਿਧਿ) ਮੋਖ ਪਾਈਤੀ ਹੋਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਸਿਰ ਮੁਨਾਇਆਂ ਸਿੱਧੀ ਮਿਲ ਸਕਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂੰਡ = ਸਿਰ। ਜੌ = ਜੇਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Acaso no sabe que de ser a así,"