[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਛੋਰਿ ਅਖੇਟਕ ਦੀਨ ਦੁਹੂੰ; ਚਲਿ ਕੈ ਪ੍ਰਭ ਜੂ ਜਮਨਾ ਤਟਿ ਆਯੋ ॥੨੦੯੨॥"
page = 506

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Both of them left hunting and went towards the bank of Yamuna.2092."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਹਾਂ ਨੇ ਸ਼ਿਕਾਰ ਛਡ ਦਿੱਤਾ ਅਤੇ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ (ਅਤੇ ਅਰਜਨ) ਚਲ ਕੇ ਜਮਨਾ ਦੇ ਕੰਢੇ ਉਤੇ ਆਏ ॥੨੦੯੨॥"