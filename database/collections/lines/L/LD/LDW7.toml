[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰਿਆ ਭਗਤਾ ਕਉ ਬਲਿਹਾਰਾ ॥"
page = 1185
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto Thine devotees, I am a sacrifice."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰਿਆਂ ਵੈਰਾਗੀਆਂ ਉਤੋਂ ਮੈਂ ਘੋਲੀ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to Your devotees."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੇ ਭਗਤੋਂ ਕੇ ਬਲਿਹਾਰਨੇ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਤੇਰੇ ਭਗਤਾਂ ਤੋਂ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ, ਤੋਂ। ਬਲਿਹਾਰਾ = ਸਦਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, ofrezco mi ser en sacrificio a Tus Devotos."