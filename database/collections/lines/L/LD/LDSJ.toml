type = "primary"
data = "ਤਾਹਿ ਭਜਾਵੈ ਬਿਲਮੁ ਨ ਕਰੈ ॥੧੫੩੮॥"
page = 451

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Even if Vishnu comes to fight with him, he will cause him to run away without delay.1538."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਸ ਨੂੰ ਵੀ ਭਜਾ ਦੇਣ ਵਿਚ (ਇਹ) ਦੇਰ ਨਹੀਂ ਕਰੇਗਾ ॥੧੫੩੮॥"