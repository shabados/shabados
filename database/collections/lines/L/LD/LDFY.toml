data = "ਇਹ ਬਿਧਿ ਕਹਿਯੋ ਤੁਮਹੁ ਜਗਮਾਤਾ ॥"
page = 115

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Shiva said to the demon-king, “Listen to my words, the mother of she universe hath said this"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੈਨੂੰ ਦੁਰਗਾ ਮਾਤਾ ਨੇ ਇਸ ਤਰ੍ਹਾਂ ਕਿਹਾ ਹੈ"