[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈਸੇ ਕਿਰਸਾਣੁ. ਬੋਵੈ ਕਿਰਸਾਨੀ ॥"
page = 375
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man, just as a husbandman (land-tiller) shown his crop and cuts down,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੀਵ! ਜਿਸ ਤਰ੍ਹਾਂ ਜਿਮੀਦਾਰ ਆਪਣੀ ਫਸਲ ਨੂੰ ਬੀਜ ਕੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Just like the farmer, He plants His crop,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਾਣੀ! ਕ੍ਰਿਸਾਨ ਖੇਤੀ ਕਰਨੇ ਵਾਲਾ ਅਪਨੀ ਖੇਤੀ ਕੋ ਬੀਜਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਾਣੀ! (ਜਿਵੇਂ) ਕੋਈ ਕਿਸਾਨ ਖੇਤੀ ਬੀਜਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਰਸਾਣੁ = ਕਿਸਾਨ। ਕਿਰਸਾਨੀ = ਖੇਤੀ, ਪੈਲੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como la paisana siembra su tierra,"