[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਚਿੰਤਤ; ਸਗਲੇ ਫਲ ਪਾਏ ॥"
page = 395
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and I have received all the fruits my heart desired."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੈਂ ਆਪਣੇ ਦਿਲ ਲੁੜੀਦੇ (ਚਿੱਤ ਚਾਹੁੰਦੇ) ਮੇਵੇ ਪਾ ਲਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have received all the fruits of my heart's desires."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਸੇ ਮਨ ਚਿੰਤਤ ਸਮਗ੍ਰ ਫਲ ਪਾਇ ਲੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਸਾਰੇ ਮਨ-ਇੱਛਤ ਫਲ ਮਿਲ ਰਹੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ ਚਿੰਤਤ = ਮਨ-ਇੱਛਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "los Pies de Loto del Señor, recibe el fruto de sus deseos."