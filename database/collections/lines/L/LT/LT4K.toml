[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਕਾਮਣਿ ਨਾਹ ਪਿਆਰੀ; ਜਾ ਹਰਿ ਕੇ ਗੁਣ ਸਾਰੇ ॥੧॥"
page = 244
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, the bride becomes sweet unto her Husband when she sings the praises of God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਪਤਨੀ ਆਪਣੇ ਪਤੀ ਨੂੰ ਮਿੱਠੜੀ ਲੱਗਣ ਲਗ ਜਾਂਦੀ ਹੈ, ਜਦ ਉਹ ਵਾਹਿਗੁਰੂ ਦੇ ਗੁਣਾਵਾਦ ਗਾਇਨ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the soul-bride is loved by her Husband, when she dwells upon the Glorious Praises of the Lord. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਬ ਮੈਨੇ ਹਰੀ ਕੇ ਗੁਣ ਸੰਭਾਲੇ ਤਬ ਮੈਂ ਇਸਤ੍ਰੀ ਅਪਨੇ ਪਤੀ ਕੀ ਪਿਆਰੀ ਭਈ ਹੂੰ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜੀਵ-ਇਸਤ੍ਰੀ ਜਦੋਂ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਵਸਾਂਦੀ ਹੈ, ਤਦੋਂ ਉਹ ਪ੍ਰਭੂ-ਪਤੀ ਨੂੰ ਪਿਆਰੀ ਲੱਗਣ ਲੱਗ ਪੈਂਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਮਣਿ = ਜੀਵ-ਇਸਤ੍ਰੀ। ਨਾਹ = ਖਸਮ। ਸਾਰੇ = ਸੰਭਾਲਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, La novia es la Bienamada del Señor si ella se concentra en las Virtudes del Señor.(1)"