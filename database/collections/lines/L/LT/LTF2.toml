[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਿਗ਼ਰ ਜਾ ਸ਼ੁਨੀਦੇ ਦਵੀਦੇ ਦਲੇਰ ॥੯੦॥"
page = 1421

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And would do the same at any other rebellious place.(90)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਕਿਸੇ ਹੋਰ ਥਾਂ ਕਿਸੇ ਨੂੰ (ਆਕੜਿਆ ਹੋਇਆ) ਸੁਣਦਾ ਸੀ ਤਾਂ ਬੜੀ ਦਲੇਰੀ ਨਾਲ ਉਸ ਉਤੇ ਜਾ ਪੈਂਦਾ ਸੀ ॥੯੦॥"