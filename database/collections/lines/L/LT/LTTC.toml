[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੋਗ ਗਏ; ਸਗਲੇ ਸੁਖ ਪਾਏ ॥੧॥"
page = 806
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My diseases are dispelled and I have obtained all the comforts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀਆਂ ਬੀਮਾਰੀਆਂ ਦੂਰ ਹੋ ਗਈਆਂ ਹਨ ਅਤੇ ਮੈਨੂੰ ਸਾਰੇ ਆਰਾਮ ਪਰਾਪਤ ਹੋ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Disease is gone, and I have found total peace. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਤੇ ਤਨ ਮਨ ਕੇ ਰੋਗ ਸਭੀ ਦੂਰ ਭਏ ਔ ਸੰਪੂਰਨ ਸੁਖ ਪਾਇ ਲੀਏ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਸਾਰੇ ਰੋਗ ਦੂਰ ਹੋ ਗਏ, ਉਸ ਨੇ ਸਾਰੇ ਸੁਖ ਪ੍ਰਾਪਤ ਕਰ ਲਏ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲੇ = ਸਾਰੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "todas mis aflicciones se han disipado y he obtenido el Éxtasis.(1)"