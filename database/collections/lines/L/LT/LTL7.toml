[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦੁਰਮਤਿ, ਦੂਜਾ ਭਾਉ ਮਿਟਾਇਆ ॥੧੬॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The wisdom of the Guru decimates duality."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਉਸਦੀ ਦੁਰਬੁਧੀ ਤੇ ਦੁਵੈਤ ਭਾਵ ਮਿਟਾ ਦਿੰਦੇ ਹਨ।"