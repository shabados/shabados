[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਮੇਰਾ ਕਰਤਾ; ਹਉ ਸੇਵਕੁ ਤੇਰਾ ॥"
page = 389
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art my creator and I am a servant of Thine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰਾ ਸਿਰਜਣਹਾਰ ਹੈ ਅਤੇ ਮੈਂ ਤੇਰਾ ਟਹਿਲੂਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my Creator, and I am Your servant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰਾ ਕਰਤਾ ਹੈਂ, ਮੈਂ ਤੇਰਾ ਦਾਸ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਮੇਰਾ ਪੈਦਾ ਕਰਨ ਵਾਲਾ ਹੈਂ, ਮੈਂ ਤੇਰਾ ਦਾਸ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਤਾ = ਪੈਦਾ ਕਰਨ ਵਾਲਾ। ਹਉ = ਮੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres mi Creador y yo Tu Sirviente;"