[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਤਾ ਕੈ ਸਦ ਬਲਿਹਾਰਾ ॥੩॥"
page = 250
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak is, ever, a sacrifice unto him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਹਮੇਸ਼ਾਂ, ਉਸ ਉਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak is forever a sacrifice to them. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਕੇ ਸਦੀਵ ਬਲਿਹਾਰਨੇ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਆਖ)-ਮੈਂ ਉਸ ਤੋਂ ਸਦਾ ਸਦਕੇ ਹਾਂ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak ofrece su Ser siempre en sacrificio a él.(3)"