[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭ੍ਰਮਤ ਬਿਆਪਤ; ਜਰੇ ਕਿਵਾਰਾ ॥"
page = 759
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The shutters of engrossment in doubt are fixed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਦੇਹ ਅੰਦਰ ਖੱਚਤ ਹੋਣ ਦੇ ਦਰਵਾਜੇ ਜੜੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Afflicted by doubt, the shutters are shut tight;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭ੍ਰਮ ਮੇਂ ਅਤੀ ਲਗਾ ਹੂਆ ਹੈ ਇਹੀ (ਕਿਵਾਰਾ) ਤਖਤੇ ਲਗੇ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਭਟਕਣਾ ਅਤੇ ਮਾਇਆ ਦਾ ਦਬਾਉ-(ਹਰ ਵੇਲੇ) ਇਹ ਦੋ ਕਿਵਾੜ ਵੱਜੇ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭ੍ਰਮਤ = ਭਟਕਣਾ। ਬਿਆਪਤ = ਮਾਇਆ ਦਾ ਜ਼ੋਰ। ਜਰੇ = ਜੜੇ। ਕਿਵਾਰਾ = ਕਿਵਾੜ, ਭਿੱਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las dos puertas son: la distracción de la mente y la relación con Maya;"