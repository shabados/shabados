[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਸੇਵਹੁ ਪੂਰਾ ਸਤਿਗੁਰੂ, ਮੇਰੇ ਲਾਲ ਜੀਉ; ਜਮ ਕਾ ਮਾਰਗੁ ਸਾਧੇ ਰਾਮ ॥"
page = 542
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Let us perform the Perfect True Guru's service, O my beloveds and smoothen the way of death."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਓ ਆਪਾਂ ਪੂਰਨ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਘਾਲ ਕਮਾਈਏ, ਹੇ ਮੇਰੀ ਪਿਆਰੀਓ! ਅਤੇ ਮੌਤ ਦੇ ਰਸਤੇ ਨੂੰ ਪੱਧਰਾ ਕਰੀਏ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Let's serve the Perfect True Guru, O my dear beloveds, and clear away the Path of Death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪਿਆਰੇ ਜੀ! ਜੋ ਪੂਰਾ ਸਤਿਗੁਰੂ ਹੈ ਤਿਸ ਕੀ ਹਾਥੋਂ ਸੇ ਸੇਵਾ ਕਰੋ। ਜਿਸ ਕਰ ਕੇ ਤੁਮ ਜਮ ਮਾਰਗ ਸਾਧ ਲੇਵੋ, ਭਵ ਜਮ ਕੇ ਰਸਤੇ ਨਾ ਜਾਨਾ ਪੜੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪਿਆਰੇ! ਗੁਰੂ ਨੂੰ ਅਭੁੱਲ ਮੰਨ ਕੇ ਗੁਰੂ ਦੀ ਸਰਨ ਪਵੋ ਇੰਜ ਜਮ ਦੇ ਰਸਤੇ ਨੂੰ (ਆਤਮਕ ਮੌਤ) ਨੂੰ ਚੰਗਾ ਬਣਾ ਲਵੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ ਪੂਰਾ = ਅਭੁੱਲ ਮੰਨ ਕੇ। ਮਾਰਗੁ = ਰਸਤਾ। ਸਾਧੇ = ਸਾਧਦਾ ਹੈ, ਚੰਗਾ ਬਣਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vamos a servir a nuestro Guru Perfecto para que conquistemos el terror de la muerte."