[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਮਰਾ ਜੋਰੁ ਸਭੁ; ਰਹਿਓ ਮੇਰੇ ਬੀਰ ॥"
page = 494
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All my strength is an nothing, O my brother."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਸਾਰੀ ਤਾਕਤ ਕੁਝ ਭੀ ਨਹੀਂ ਹੇ ਮੇਰੇ ਭਰਾਵਾ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have given up all my strength, O my brother."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ (ਬੀਰ) ਭਾਈ! ਹਮਾਰਾ ਬਲੁ ਰਹਿ ਚੁਕਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਵੀਰ! (ਪਰਮਾਤਮਾ ਦੇ ਟਾਕਰੇ ਤੇ) ਸਾਡਾ ਕੋਈ ਜ਼ੋਰ ਚੱਲ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭੁ = ਸਾਰਾ। ਰਹਿਓ = ਕੰਮ ਨਹੀਂ ਕਰਦਾ, ਨਹੀਂ ਚੱਲਦਾ। ਬੀਰ = ਹੇ ਵੀਰ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hermano, he entregado todo mi poder,"