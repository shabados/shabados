[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਉ ਸੁਖੁ ਪਾਵੈ; ਦੂਐ ਤੀਐ ॥"
page = 1023
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through duality and three dispositions, how can one attain peace?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਵੈਤ-ਭਾਵ ਅਤੇ ਤਿੰਨਾਂ ਸੁਭਾਵਾਂ ਦੇ ਰਾਹੀਂ ਇਨਸਾਨ ਆਰਾਮ ਕਿਸ ਤਰ੍ਹਾਂ ਪਾ ਸਕਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How can one find peace, through duality and the three gunas - the three qualities?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦ੍ਵੈਤ ਔ ਤੀਨੋਂ ਗੁਣੋਂ ਮੇਂ ਹੋਇਕੈ ਵਾ ਦੋ ਕਰਮ ਕੀਏ, ਤਿਨ ਜਗ ਕੀਏ, ਇਨ ਕਰ ਇਹ ਜੀਵ ਕੈਸੇ ਸੁਖ ਪਾਵੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਹ ਹੀ ਪ੍ਰਭੂ ਤੋਂ ਬਿਨਾ ਕਿਸੇ ਹੋਰ ਝਾਕ ਵਿਚ ਤੇ ਨਾਹ ਹੀ ਤ੍ਰਿਗੁਣੀ ਮਾਇਆ ਦੀ ਲਗਨ ਵਿਚ-ਸੁਖ ਕਿਤੇ ਨਹੀਂ ਮਿਲਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਐ = ਦੂਜੇ ਭਾਵ ਵਿਚ। ਤੀਐ = ਤ੍ਰਿਗੁਣੀ ਮਾਇਆ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, ¿cómo puede uno lograr la Bondad a través de la dualidad o de los tres mundos?"