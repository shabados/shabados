[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਆਪਿ ਆਪਿ ਨਿਰੰਕਾਰੁ ॥"
page = 1001
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he, the Formless Lord who is Himself all-in-all;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਰੂਪ-ਰਹਿਤ ਸੁਆਮੀ ਸਾਰਾ ਕੁੱਛ ਖ਼ੁਦ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself, the Formless Lord, is Himself by Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਤੀਨ ਕਾਲ ਮੇਂ ਆਪਿ ਹੀ ਅਕਾਰ ਰਹਿਤ ਸੋ ਵਾਹਿਗੁਰੂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਨਿਰੰਕਾਰ ਸਦਾ ਆਪ ਹੀ ਆਪ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰੰਕਾਰੁ = ਨਿਰ-ਆਕਾਰ, ਜਿਸ ਦਾ ਕੋਈ ਖ਼ਾਸ ਸਰੂਪ ਨਹੀਂ ਦੱਸਿਆ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, el Uno Sin Forma es Todo en todo."