[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਇੰਦ੍ਰ; ਊਭੇ ਦਰਬਾਰ ॥੩॥"
page = 1236
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Millions of Indras stand at the Lord's door."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾ ਹੀ ਇੰਦ੍ਰ ਪ੍ਰਭੂ ਦੇ ਬੂਹੇ ਤੇ ਖੜੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many Indras stand at the Lord's Door. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੇਕ ਹੀ ਇੰਦ੍ਰ ਤਿਸ ਕੇ ਦਰਬਾਰ ਮੇਂ (ਊਭੇ) ਖੜੇ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਹੀ ਇੰਦਰ ਦੇਵਤੇ ਉਸ ਦੇ ਦਰ ਤੇ ਖਲੋਤੇ ਰਹਿੰਦੇ ਹਨ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਊਭੇ = ਖਲੋਤੇ ਹੋਏ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, millones de Indras más están postrados a la Puerta de este Señor, mi Dios. (3)"