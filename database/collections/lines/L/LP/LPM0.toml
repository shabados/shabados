[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਰੈ; ਕਛੂ. ਨ ਕਿਨਹੂ ਕੀਆ ॥"
page = 261
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Here, none has accomplished any thing, by himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਏਥੇ ਕਿਸੇ ਨੇ ਕੁਝ ਭੀ ਆਪਣੇ ਆਪ ਸੰਪੂਰਨ ਨਹੀਂ ਕੀਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In this world, no one accomplishes anything by himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪਰਮੇਸ੍ਵਰ ਸੇ ਉਰੇ ਕਿਸੀ ਨੇ ਭੀ ਕੁਛ ਨਹੀਂ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਮਨੁੱਖ ਨੂੰ ਇਹ ਨਿਸ਼ਚਾ ਹੋ ਜਾਂਦਾ ਹੈ ਕਿ) ਪਰਮਾਤਮਾ ਤੋਂ ਉਰੇ ਹੋਰ ਕੋਈ ਕੁਝ ਕਰਨ-ਜੋਗਾ ਨਹੀਂ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਰੈ = ਪਰਮਾਤਮਾ ਤੋਂ ਉਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, nadie más que Él puede hacer nada,"