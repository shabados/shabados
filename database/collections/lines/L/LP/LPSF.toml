data = "ਅਨੰਤੇ ਬਿਅੰਤੇ ਅਭੂਮੇ ਅਭਰਮੰ ॥੫॥"
page = 127

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art endless, boundless, all-pervasive and illusionless.5."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਨੰਤ, ਬੇਅੰਤ, ਅਭੂਮ (ਧਰਤੀ ਤੋਂ ਪਰੇ) ਅਤੇ ਅਭਰਮ (ਭਰਮਾਂ ਤੋਂ ਰਹਿਤ) ਹੈਂ ॥੫॥"