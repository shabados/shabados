[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਨਿਧਾਨ; ਪੇਖੇ ਮਨ ਮਾਹਿ ॥"
page = 178
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the treasures I have seen within my mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਖਜਾਨੇ, ਮੈਂ ਆਪਣੇ ਹਿਰਦੇ ਅੰਦਰ ਵੇਖ ਲਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have seen all the treasures within my own mind;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਸਰਬ ਨਿਧੀ ਰੂਪ ਪਰਮੇਸ੍ਵਰ ਮਨ ਮੇਂ ਦੇਖੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਨੇ ਸਾਰੇ ਖ਼ਜ਼ਾਨੇ ਆਪਣੇ ਮਨ ਵਿਚ ਹੀ ਵੇਖ ਲਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਧਾਨ = ਖ਼ਜ਼ਾਨੇ। ਪੇਖੇ = ਵੇਖ ਲਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pude ver los Nueve Tesoros dentro de mi mente,"