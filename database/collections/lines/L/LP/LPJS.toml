[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਜੁ ਉਆ ਕੋ ਲੇ ਸਵਾਰਿਓ; ਤਿਲੁ. ਨ ਦੀਨੋ ਦੋਸੁ ॥੧॥"
page = 1017
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It serves his purpose and blames him not even to the extent of a sesame."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਉਸ ਦੇ ਕੰਮ ਨੂੰ ਰਾਸ ਕਰ ਦਿੰਦਾ ਹੈ ਅਤੇ ਇਹ ਤਿਲ ਮਾਤ੍ਰ ਭੀ ਉਸ ਨੂੰ ਬੁਰਾਈ ਨਹੀਂ ਦਿੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It serves the purpose of the cutter, and does not blame him at all. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਗੋਂ ਧੀਰਜ ਕੋ ਲੈ ਕੇ ਉਸ ਕਾ ਕਾਜ ਸਵਾਰਿਆ, ਜਰਾ ਮਾਤ੍ਰ ਭੀ ਉਸ ਪੁਰਸ ਕੋ ਦੋਸ ਨਹੀਂ ਦੀਆ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਗੋਂ ਰੁੱਖ ਨੇ) ਉਸ ਦਾ ਕੰਮ ਸਵਾਰ ਦਿੱਤਾ, ਤੇ, (ਉਸ ਨੂੰ) ਰਤਾ ਭਰ ਭੀ ਕੋਈ ਦੋਸ਼ ਨਾਹ ਦਿੱਤਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਆ ਕੋ = ਉਸ (ਮਨੁੱਖ) ਦਾ। ਤਿਲੁ = ਰਤਾ ਭਰ ਭੀ। ਦੋਸੁ = ਗਿਲਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sirve aún a aquél que lo dañó, sin culparlo de nada.(1)"