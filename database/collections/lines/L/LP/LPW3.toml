[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਹ੍ਰਿਦੈ; ਵਸਿਆ ਪ੍ਰਭੁ ਸੋਇ ॥"
page = 1338
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "in whose mind, He, the Lord, abides."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਮਨ ਅੰਦਰ ਉਹ ਸੁਆਮੀ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "within whose hearts God dwells."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜਿਸ ਕੇ ਹਿਰਦੇ ਮੇਂ ਸੋ ਤੇਰਾ ਜਸ ਵਸਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਮਨੁੱਖ) ਦੇ ਹਿਰਦੇ ਵਿਚ ਉਹ ਪਰਮਾਤਮਾ ਆ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ ਹ੍ਰਿਦੈ = ਹਿਰਦੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en el corazón de los cuales Dios habita,"