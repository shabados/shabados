[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿ ਗੁਫ਼ਤਹ ਕਿ ਏ ਸ਼ਾਹ ਸ਼ਾਹਾਨ ਵੇਸ਼ ॥੧੭੧॥"
page = 1424

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And said, ‘Oh, you the king of kings,(171)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਹਿਣ ਲਗੀ ਕਿ ਐ ਸੁੰਦਰ ਬਸਤ੍ਰ ਵਾਲੇ ਬਾਦਸ਼ਾਹਾਂ ਦੇ ਬਾਦਸ਼ਾਹ! ॥੧੭੧॥"