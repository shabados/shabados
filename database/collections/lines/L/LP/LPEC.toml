[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮੋ ਰੂਪ ਕਾਲੀ ਕਪਾਲੀ ਅਨੰਦੀ ॥"
page = 118

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O Kali, with the begging bowl, and the besttower of bliss! I salute Thee."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਾਲੀ, ਕਪਾਲੀ ਅਤੇ ਆਨੰਦ-ਰੂਪਾ ਨੂੰ ਨਮਸਕਾਰ ਹੈ;"