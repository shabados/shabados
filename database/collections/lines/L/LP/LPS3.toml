[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੁ. ਤਾ ਪਰੁ ਜਾਣੀਐ; ਜਾ ਜੁਗਤਿ ਜਾਣੈ ਜੀਉ ॥"
page = 468
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then alone is the man deemed to be true, if the knows the true way of life."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤਦ ਹੀ ਇਨਸਾਨ ਸੱਚਾ ਸਮਝਿਆ ਜਾਂਦਾ ਹੈ, ਜੇਕਰ ਉਹ ਜੀਵਨ ਦੇ ਸੱਚੇ ਰਸਤੇ ਨੂੰ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One knows the Truth only when he knows the true way of life."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭਲੀ ਪ੍ਰਕਾਰ ਸਚ ਤੌ ਜਾਨਾ ਜਾਤਾ ਹੈ, ਜੋ ਜੀਉ ਵਾਹਿਗੁਰੂ ਮੇਂ ਬ੍ਰਿਤੀ ਕਾ (ਜੁਗਤਿ) ਜੋੜਨਾ ਜਾਨੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਦੇ ਅਸਲੇ ਪ੍ਰਭੂ ਦੀ ਸਮਝ ਤਦੋਂ ਪੈਂਦੀ ਹੈ, ਜਦੋਂ ਮਨੁੱਖ ਰੱਬੀ ਜੀਵਨ (ਗੁਜ਼ਾਰਨ ਦੀ) ਜੁਗਤੀ ਜਾਣਦਾ ਹੋਵੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੁਗਤਿ = ਜ਼ਿੰਦਗੀ ਸੋਹਣੇ ਤਰੀਕੇ ਨਾਲ ਗੁਜ਼ਾਰਨ ਦਾ ਢੰਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nuestra mente está complacida y obtenemos la Puerta de la Salvación."