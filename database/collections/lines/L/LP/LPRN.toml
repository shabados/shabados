data = "ਰੁਦ੍ਰ ਕਲਾ ਦੁਹਿਤਾ ਗ੍ਰਿਹ ਵਾ ਕੇ ॥੧॥"
page = 976

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Jantar Kala was one of its Ranis; she had a daughter named Ruder Kala.(1)"

[[content]]
