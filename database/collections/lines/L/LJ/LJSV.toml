[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹਰਿ ਕੀ ਪ੍ਰੀਤ ਰੀਤਿ ਨ ਬਿਚਾਰੀ ॥੨੪॥"
page = 57

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "His disciples wear rings in their ears and do not know the love of the lord.24."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਰ ਪਰਮਾਤਮਾ ਦੇ ਪ੍ਰੇਮ ਦੀ ਰੀਤ ਨੂੰ ਨਾ ਵਿਚਾਰਿਆ ॥੨੪॥"