[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧਸੰਗ ਕੈ; ਨਾਹੀ ਨੇਰਿ ॥"
page = 180
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Society of Saints, he does not meet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿਸੰਗਤ ਦੇ ਉਹ ਨੇੜੇ ਨਹੀਂ ਲਗਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He does not even approach the Saadh Sangat, the Company of the Holy;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੀ ਸੰਗਤ ਕੇ ਨਿਕਟ ਨਹੀਂ ਆਵਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ-ਗ੍ਰਸਿਆ ਮਨੁੱਖ) ਸਾਧ ਸੰਗਤਿ ਦੇ ਨੇੜੇ ਨਹੀਂ ਢੁਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੇਰਿ = ਨੇੜੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No se acerca a los Santos,"