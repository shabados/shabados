[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਹਜੇ; ਕੀਨੋ ਜੀਅ ਕੋ ਦਾਨੁ ॥"
page = 237
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Instinctively he gives alms to the needy beings."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਭਾਵਕ ਹੀ ਉਹ ਲੋੜਵੰਦੇ ਜੀਵਾਂ ਨੂੰ ਖ਼ੈਰਾਤ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In peace and poise, they give to the poor."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰੁ ਸੁਭਾਵਕ ਹੀ ਔਰ ਜੀਵੋਂ ਕੋ ਦਾਨੁ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਆਤਮਕ ਅਡੋਲਤਾ ਦੀ ਬਰਕਤਿ ਨਾਲ ਉਹ (ਹੋਰਨਾਂ ਨੂੰ ਭੀ) ਆਤਮਕ ਜੀਵਨ ਦੀ  ਦਾਤ ਦੇਂਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ ਕੋ = ਆਤਮਕ ਜੀਵਨ ਦਾ। ਕੋ = ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es espontáneamente bendecido con el Despertar de su Alma."