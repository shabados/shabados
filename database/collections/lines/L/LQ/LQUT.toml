data = "ਉਥੇ ਹਜ਼ਾਰ ਸਖੀਆਂ ਨਾਲ ਪਰੀ ਵਰਗੀ ਸੁੰਦਰੀ ਖੜੋਤੀ ਸੀ ॥੨੧॥"