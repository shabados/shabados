data = "ਬਕਰਾ ਸ੍ਵਾਨਿ ਜਾਨਿ ਤਜਿ ਦਯੋ ॥੫॥"
page = 949

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He believed them to be true and threw down the goat deeming it to be dog.(5)"

[[content]]
