[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਖੇਲਤ ਹੈ ਸੋਊ ਗਊਅਨ ਮੈ; ਜੋਊ ਹੈ ਜਗ ਕੋ ਕਰਤਾ ਬਧ ਸਤ੍ਰੀ ॥"
page = 333

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“The same Krishna is playing with his cows and the same Krishna is the killer of enemies and the creator of the whole world"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਸਤ੍ਰ ਧਾਰੀ (ਹੋ ਕੇ) ਜਗਤ ਨੂੰ ਬੱਧ ਕਰਨ ਵਾਲਾ ਹੈ, ਉਹੋ (ਗੁਆਲਾ ਹੋ ਕੇ) ਗਊਆਂ ਵਿਚ ਖੇਡ ਕਰਦਾ ਹੈ।"