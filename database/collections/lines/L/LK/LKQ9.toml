[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੋਊ ਕ੍ਰੂਰ ਕਰਮੰ ਦੋਊ ਜਾਨ ਬਾਹੰ ॥"
page = 146

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Both the heroes of violent actions had long arms like gods."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਵੇਂ ਕਠੋਰ ਕਰਮ ਕਰਨ ਵਾਲੇ ਸਨ ਅਤੇ ਦੋਹਾਂ ਦੀਆਂ ਭੁਜਾਵਾਂ ਗੋਡਿਆਂ ਤਕ ਲੰਬੀਆਂ ਸਨ।"