[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹੁਕਮੀ ਬੰਦਾ ਹੋਇ ਕੈ; ਨਿਤ ਉਠਿ ਜਾਇ ਸਲਾਮ ਕਰੰਦਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Becoming errand boy of man he goes daily to salute him."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਹੁਕਮ ਦਾ ਤਾਬੇਦਾਰ ਹੋਕੇ ਰੋਜ਼ (ਤੜਕੇ) ਉੱਠਕੇ ਸਲਾਮ ਕਰਦਾ ਹੈ।"