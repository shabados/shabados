[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਧਿਆਨੀ. ਧਰਤ ਧਿਆਨੁ ॥"
page = 1156
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Millions of contemplators contemplate Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾਂ ਹੀ ਚਿੰਤਨ ਕਰਨ ਵਾਲੇ ਉਸ ਦਾ ਚਿੰਤਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Millions of meditators focus on His meditation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜੋਂ ਹੀ ਧਿਆਨੀ ਹੋ ਕੇ ਤੇਰੇ ਵਿਖੇ ਧ੍ਯਾਨ ਕੋ (ਧਰਤ) ਲਗਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਮਾਧੀਆਂ ਲਾਣ ਵਾਲੇ ਕ੍ਰੋੜਾਂ ਹੀ ਸਾਧੂ (ਉਸ ਵਿਚ) ਸੁਰਤ ਜੋੜੀ ਰੱਖਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਿਆਨੀ = ਸਮਾਧੀ ਲਾਣ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien es contemplado por millones de meditadores,"