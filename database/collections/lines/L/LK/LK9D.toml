data = "ਸੁੰਦਰ ਅੰਗ ਬੰਸ ਉਜਿਯਾਰੀ ॥"
page = 912

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Rajo, a damsel lived there. She was endowed with a charming body."

[[content]]
