[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਬਹੂ; ਹੋਇ ਬਹੈ ਬਡ ਰਾਜਾ ॥"
page = 277
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sometimes, he sits as a great king."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਦੇ ਉਹ ਵੱਡਾ ਪਾਤਸ਼ਾਹ ਹੋ ਬੈਠਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sometimes, they sit as great kings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਬੀ ਤੌ ਵੱਡਾ ਰਾਜਾ ਹੋਇ ਬੈਠਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਦੇ ਵੱਡਾ ਰਾਜਾ ਬਣ ਬੈਠਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਡ = ਵੱਡਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A veces, aparece como el mayor de los magnates"