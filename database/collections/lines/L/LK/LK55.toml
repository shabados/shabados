[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਗੀ ਲਾਟ ਉਚਾਟ ਹੈ; ਸਿਰੁ ਉਚਾ ਕਰਿ ਕਰੈ ਕੁਚਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The flame of fire goes up and like an egotist behaves viciously."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅੱਗ ਦੀ ਲਾਟ ਵਿਖੇ ਘਬਰਾਹਟ ਹੈ (ਕਿਉਂ ਜੋ) ਸਿਰ ਉੱਚਾ ਕਰ ਕੇ ਕੁਕਰਮ ਕਰਦੀ ਹੈ (ਭਾਵ ਜਿਸਨੂੰ ਲੱਗੇ, ਸਾੜ ਦੇਂਦੀ ਹੈ)।"