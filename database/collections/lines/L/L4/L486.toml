[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸਬਦੁ; ਅੰਮ੍ਰਿਤੁ ਹੈ ਸਾਰੁ ॥"
page = 932
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Exalted Guru's word is the sublime Nectar."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਖੀ ਗੁਰਾਂ ਦੀ ਬਾਣੀ ਸ੍ਰੇਸ਼ਟ ਅੰਮ੍ਰਿਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "For the Gurmukh, the Shabad is the most excellent Ambrosial Nectar."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖੋਂ ਕਾ ਉਪਦੇਸ ਅੰਮ੍ਰਿਤ ਤੋਂ ਭੀ ਸ੍ਰੇਸਟ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਤਿਗੁਰੂ ਦਾ) ਸ਼ਬਦ ਗੁਰਮੁਖ ਲਈ ਸ੍ਰੇਸ਼ਟ ਅੰਮ੍ਰਿਤ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਮਨੁੱਖ। ਸਾਰੁ = ਸ੍ਰੇਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Palabra es para él la Esencia y la Ambrosía."