[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਰਮ ਅਰਥ ਅਰੁ ਕਾਮ ਮੋਖ; ਮੁਕਤਿ ਪਦਾਰਥ ਨਾਥ ॥"
page = 927
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is the Giver of emancipation and the four cardinal boons of faith, wealth, success and salvation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕਲਿਆਣ ਅਤੇ ਈਮਾਨ, ਧਨ-ਦੌਲਤ ਕਾਮਯਾਬੀ ਤੇ ਮੋਖਸ਼ ਦੀਆਂ ਚਾਰ ਉਤਮ ਦਾਤਾਂ ਬਖਸਣਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Righteous faith, wealth, fulfilment of desires and salvation; the Lord bestows these four blessings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਧਰਮ, ਅਰਥ, ਕਾਮ, ਮੋਖ ਔ ਕੈਵਲ੍ਯ ਮੁਕਤੀ ਇਨ ਪਦਾਰਥੋਂ ਕਾ ਸ੍ਵਾਮੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਦੁਨੀਆ ਦੇ ਪ੍ਰਸਿੱਧ ਚਾਰ ਪਦਾਰਥ) ਧਰਮ ਅਰਥ ਕਾਮ ਅਤੇ ਮੋਖ ਦਾ ਮਾਲਕ ਪ੍ਰਭੂ ਆਪ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਰੁ = ਅਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor nos bendice con el Dharma, el mundo exterior, placeres sensuales y la Emancipación;"