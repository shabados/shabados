[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿੰਬ ਬਿਨਾ; ਕੈਸੇ ਕਪਰੇ ਧੋਈ ॥"
page = 872
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "as the clothes can not be washed without water,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਪਾਣੀ ਦੇ ਬਗੈਰ ਕਪੜੇ ਕਿਸ ਤਰ੍ਹਾਂ ਧੋਂਤੇ ਜਾ ਸਕਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "just so, without water, how can the clothes be washed?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਜਲ ਸੇ ਬਿਨਾ ਕੈਸੇ ਕਪੜਿਓਂ ਕੋ ਧੋਵੇਗਾ ਅਰਥਾਤ ਨਹੀਂ ਧੋਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਾਣੀ ਤੋਂ ਬਿਨਾ ਕੱਪੜੇ ਨਹੀਂ ਧੁਪਦੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿੰਬ = ਪਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sin agua uno no puede lavar su ropa manchada."