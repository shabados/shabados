[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਰਖੁ ਜਮਿਓ ਹੈ; ਪਾਰਜਾਤ ॥"
page = 1180
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The elysian tree has sprung for me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਲਈ ਸਵਰਗੀ ਬਿਰਛ ਲੈਂਦਾ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The wish-fulfilling Elysian Tree has sprouted and grown."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅੰਤਹਕਰਨ ਰੂਪੀ ਭੂਮੀ ਮੇਂ ਨਾਮ ਰੂਪੀ ਕਲਪ ਬ੍ਰਿਛੁ ਉਤੰਪਨ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਰਕਤਿ ਨਾਲ ਮੇਰੇ ਅੰਦਰੋਂ, ਮਾਨੋ, ਸਾਰੀਆਂ ਮਨੋ-ਕਾਮਨਾ ਪੂਰੀਆਂ ਕਰਨ ਵਾਲਾ ਸਵਰਗੀ) ਪਾਰਜਾਤ ਰੁੱਖ ਉੱਗ ਪਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਰਖੁ = ਰੁੱਖ। ਜਮਿਓ ਹੈ = ਉੱਗ ਪਿਆ ਹੈ। ਪਾਰਜਾਤ ਬਿਰਖੁ = ਪਾਰਜਾਤ ਰੁੱਖ, ਮਨੋ-ਕਾਮਨਾ ਪੂਰੀਆਂ ਕਰਨ ਵਾਲਾ ਸਵਰਗ ਦਾ ਰੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En mi interior ha nacido el Verdadero Árbol Eliseo,"