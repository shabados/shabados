[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਰੂ ਭੀਤਿ ਬਨਾਈ ਰਚਿ ਪਚਿ; ਰਹਤ ਨਹੀ ਦਿਨ ਚਾਰਿ ॥"
page = 633
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As a wall of sand, built and plastered with care, lasts not even for four days,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਬਣਾਈ ਅਤੇ ਖਿਆਲ ਕਰ ਕੇ ਲਿੱਪੀ-ਪੋਚੀ ਹੋਈ ਰੇਤੇ ਦੀ ਕੰਧ ਚਾਰ ਦਿਹਾੜੇ ਭੀ ਨਹੀਂ ਕੱਟਦੀ, ਉਸੇ ਤਰ੍ਹਾਂ ਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Like a wall of sand, built up and plastered with great care, which does not last even a few days,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਕਿਸੀ ਨੇ (ਬਾਰੂ) ਮੋਟੇ ਰੇਤੇ ਕੀ (ਭੀਤਿ) ਕੰਧ (ਪਚਿ) ਖਚਤ ਹੋ ਕਰ (ਰਚਿ) ਉਪਾਉ ਕਰ ਬਨਾਈ, ਸੋ ਥਿਰ ਨਹੀਂ ਰਹਿਤੀ ਚਾਰ ਕੁ ਦਿਨ ਮੇਂ ਗਿਰ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਜਿਵੇਂ ਕਿਸੇ ਨੇ) ਰੇਤ ਦੀ ਕੰਧ ਉਸਾਰ ਕੇ ਪੋਚ ਕੇ ਤਿਆਰ ਕੀਤੀ ਹੋਵੇ; ਪਰ ਉਹ ਕੰਧ ਚਾਰ ਦਿਨ ਭੀ (ਟਿਕੀ) ਨਹੀਂ ਰਹਿੰਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਰੂ = ਰੇਤ। ਭੀਤਿ = ਕੰਧ। ਰਚਿ = ਰਚ ਕੇ, ਉਸਾਰ ਕੇ। ਪਚਿ = ਪੋਚ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La vida es así como la muralla de arena: aunque construida con mucho cuidado,"