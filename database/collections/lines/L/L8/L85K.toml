[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੀ ਓਟ; ਗਹਹੁ ਮਨ ਮੇਰੇ ॥"
page = 1150
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, grasp thou thy Lord's protection."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ! ਤੂੰ ਆਪਣੇ ਪ੍ਰਭੂ ਦੀ ਪਨਾਹ ਪਕੜ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Grab hold of the Support of God, O my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ ਪ੍ਰਭੂ ਕੀ ਸਰਣਿ ਕੋ ਗ੍ਰਹਣ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਪਰਮਾਤਮਾ ਦਾ ਆਸਰਾ ਲਈ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਟ = ਆਸਰਾ, ਸਹਾਰਾ। ਗਹਹੁ = ਫੜੋ, ਲਵੋ। ਮਨ = ਹੇ ਮਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente mía, penetra en el Santuario de tu Dios,"