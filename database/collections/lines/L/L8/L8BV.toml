[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਨਧ ਬਧ ਉਦਿਤੰ, ਸੁ ਕੋਪ ਓਪ ਦੇ ਨਰੰ ॥"
page = 572

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing the unique beauty, the warriors are getting infuriated and wearing their weapons are reaching in the war-arena"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹਥਿਆਰ ਸਜਾ ਕੇ, ਕ੍ਰੋਧ ਨੂੰ ਪ੍ਰਗਟ ਕਰਦੇ ਹਨ।"