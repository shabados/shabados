data = "who will be the witness on the day of Judgement.81."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਿਨ ਤੂੰ ਆਪਣਾ ਗਵਾਹ ਆਪ ਬਣ ਜਾਵੇਂਗਾ। (ਅਰਥਾਤ ਸੱਚਾਈ ਦਾ ਤੈਨੂੰ ਪਤਾ ਲਗ ਜਾਏਗਾ) ॥੮੧॥"