[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖ ਕਾ; ਇਹੁ ਬਾਦਿ ਆਚਾਰੁ ॥"
page = 1277
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This is the useless way of life of the egocentric,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਹੈ ਫ਼ਜੂਲ ਜੀਵਨ ਰਹੁ-ਰੀਤੀ ਮਨਮਤੀਏ ਦੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is the useless way of life of the self-willed manmukh."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਪਰਕਾਰ ਮਨਮੁਖੋਂ ਕਾ ਇਹ (ਆਚਾਰੁ) ਕਰਤਬ (ਬਾਦਿ) ਬਿਅਰਥ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਿਵੇਂ) ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ ਮਨੁੱਖਾਂ ਦਾ ਇਹ ਰਵਈਆ ਵਿਅਰਥ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਮੁਖ = ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲਾ। ਬਾਦਿ = ਵਿਅਰਥ। ਆਚਾਰੁ = ਰਵਈਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así es el inútil modo de vida del soberbio Manmukj,"