data = "ਰਾਤਿ ਅੰਧੇਰੀ ਤੁਰੈ ਧਵਾਵੈ ॥"
page = 1001

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(It was announced,) ‘Primarily the person should blindfold both hiseyes and then travel when it is dark at night."

