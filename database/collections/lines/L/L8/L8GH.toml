[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਤਿ ਬਢਾ ਗਰਬ ॥੮੧॥"
page = 620

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Your sons, thinking that the horse had gone to the nether-world, had dug the whole of the earth and in this way, their pride had enormously increased.81."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਉਨ੍ਹਾਂ ਦਾ) ਹੰਕਾਰ ਬਹੁਤ ਵਧ ਗਿਆ ॥੮੧॥"