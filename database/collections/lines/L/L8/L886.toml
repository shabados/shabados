[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕਿ ਪਠਾਏ; ਦੇਸ ਦਿਸੰਤਰਿ ॥"
page = 1081
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some Thou wander in the country and foreign lands."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈਆਂ ਨੂੰ ਤੂੰ ਮੁਲਕ ਅਤੇ ਪ੍ਰਦੇਸੀ ਅੰਦਰ ਰਟਨ ਕਰਵਾਉਂਦਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some wander across the country and through foreign lands."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਦੇਸੋਂ ਦਿਸਾਂਤ੍ਰੋਂ ਮੇਂ ਭੇਜੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਈ ਐਸੇ ਹਨ ਜਿਨ੍ਹਾਂ ਨੂੰ ਤੂੰ ਹੋਰ ਹੋਰ ਦੇਸਾਂ ਵਿਚ ਭੇਜਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਠਾਏ = ਭੇਜੇ। ਦੇਸ ਦਿਸੰਤਰਿ = ਦੇਸ ਦੇਸ ਅੰਤਰਿ, ਹੋਰ ਹੋਰ ਦੇਸਾਂ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mientras que a otros los haces vagar de lugar en lugar."