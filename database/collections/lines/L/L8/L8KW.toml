data = "ਰਵਾ ਕਰਦ ਅਸਪਸ਼ ਚੁ ਬਾਦੇ ਨਸੀਮ ॥੩੫॥"
page = 1414

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And he galloped his horse at the speed of an arrow.(35)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਹਵਾ ਦੀ ਚਾਲ ਵਾਲਾ ਘੋੜਾ ਉਸ ਦੇ ਪਿਛੇ ਲਗਾ ਦਿੱਤਾ ॥੩੫॥"