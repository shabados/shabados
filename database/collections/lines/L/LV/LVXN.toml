type = "primary"
data = "ਪਗ ਛੋਰਿ ਆਨ, ਤਿਹ ਧਰੋ ਟੇਕ ॥੧੦੮॥"
page = 643

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He, was has manifested Himself in more than one forms meditate only on His Feet.108."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੋਰਨਾਂ ਦੇ ਚਰਨਾਂ ਨੂੰ ਛਡ ਕੇ ਉਸ ਦੀ ਟੇਕ ਧਾਰਨ ਕਰੋ ॥੧੦੮॥"