[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਛਤ੍ਰਨਿ ਕੇ ਕੁਲ ਮੈ ਉਪਜੇ; ਕਿਹ ਭਾਤਿ ਪਰਾਵਤ ਹੋ, ਬਲੁ ਹਾਰੇ ॥"
page = 420

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Balram said to the running away Yadava army, “O warriors born in the clans of Kshatriyas! why are you running away?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਛਤ੍ਰੀਆਂ ਦੇ ਕੁਲ ਵਿਚ ਪੈਦਾ ਹੋ ਕੇ ਇਸ ਤਰ੍ਹਾਂ ਬਲ ਨੂੰ ਹਾਰ ਕੇ ਭਜੇ ਜਾ ਰਹੇ ਹੋ।"