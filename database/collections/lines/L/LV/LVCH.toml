[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਿਹ ਰਾਜ ਕਰਯੋ ਪੁਰ ਅਉਧ ਘਣੰ ॥"
page = 200

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The king Raghu looked very impressive as a gem in the necklace of raghu clan. He ruled over Oudh for a long time."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਅਯੁਧਿਆ ਪੁਰੀ ਵਿੱਚ ਬਹੁਤ ਚਿਰ ਰਾਜ ਕੀਤਾ।"