[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਕਉ ਦੂਖਿ ਪਚੈ; ਦੁਖੁ ਹੋਈ ॥੯॥"
page = 225
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who teases God's slave himself putrefies in pain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਰਬ ਦੇ ਗੋਲੇ ਨੂੰ ਦੁਖ ਦਿੰਦਾ ਹੈ, ਉਹ ਖੁਦ ਪੀੜਾ ਅੰਦਰ ਗਲ ਸੜ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who makes the Lord's humble servant suffer, shall himself suffer and rot. ||9||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਜੋ ਕੋਈ ਪਰਮੇਸ੍ਵਰ ਕੇ ਭਗਤ ਜਨੋਂ ਕੋ ਦੁਖ ਦੇਤਾ ਹੈ, ਤਿਸ ਕੋ ਦੁਖ ਪ੍ਰਾਪਤਿ ਕਰ ਜਲਨਤਾ ਹੋਤੀ ਹੈ॥੯॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਜੇਹੜਾ ਪਰਮਾਤਮਾ ਦੇ ਦਾਸ ਨੂੰ (ਦੁੱਖ ਦੇਂਦਾ ਹੈ ਉਹ ਉਸ) ਦੁੱਖ ਦੇ ਕਾਰਨ ਆਪ ਹੀ ਖ਼ੁਆਰ ਹੁੰਦਾ ਹੈ, ਉਸ ਨੂੰ ਆਪ ਨੂੰ ਹੀ ਉਹ ਦੁੱਖ (ਮਾਰੂ ਹੋ ਢੁਕਦਾ) ਹੈ ॥੯॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que infringe dolor a los Devotos del Señor, es destruido con toda seguridad.(9)"