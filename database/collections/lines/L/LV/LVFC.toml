[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੇਵਲ ਨਾਮੁ; ਰਿਦੇ ਮਹਿ ਦੀਜੈ ॥੪॥੨੬॥੭੭॥"
page = 389
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Into his mind and heart, infuse Thy Name alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਹਿਰਦੇ ਅੰਦਰ ਸਿਰਫ ਆਪਣਾ ਨਾਮ ਰਮਾ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "please, infuse Your Name into his heart. ||4||26||77||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਕੇਵਲੁ) ਏਕ ਨਾਮ ਮੇਰੇ ਹ੍ਰਿਦ੍ਯ ਮੇਂ ਦੀਜੀਏ ॥੪॥੨੬॥੭੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਨਕ ਨੂੰ ਆਪਣਾ) ਸਿਰਫ਼ ਨਾਮ ਹਿਰਦੇ ਵਿਚ (ਵਸਾਣ ਲਈ) ਦੇਹ ॥੪॥੨੬॥੭੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਿਦੇ ਮਹਿ = ਹਿਰਦੇ ਵਿਚ। ਦੀਜੈ = ਦੇਹ ॥੪॥੨੬॥੭੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y infunde Tu Nombre en su corazón. (4-26-77)"