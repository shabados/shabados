[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਭੋਗ; ਬਿਖਿਆ ਕੇ ਕਰੈ ॥"
page = 279
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man indulges in the enjoyment of many evil passions,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਦਮੀ ਘਨੇਰੇ ਮੰਦ ਵਿਸ਼ੇ-ਵੇਗ ਮਾਨਣ ਵਿੱਚ ਲੱਗਾ ਹੋਇਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He may enjoy all sorts of corrupt pleasures,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨਿਕ ਪ੍ਰਕਾਰ ਕਰ ਵਿਸਿਅਹੁ ਕੇ ਭੋਗੋਂ ਕੌ ਭੋਗਤਾ ਹੂਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦੀਆਂ ਅਨੇਕਾਂ ਮੌਜਾਂ ਮਾਣਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਖਿਆ = ਮਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Se entregará sin freno a los placeres de la vida en la dualidad,"