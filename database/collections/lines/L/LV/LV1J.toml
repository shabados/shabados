[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਇਕੁ ਕਵਾਉ ਪਸਾਉ, ਨਦਰਿ ਨਿਹਾਲਿਆ ॥੧੭॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "With one vibrational throb he expanded the whole creation and delighted it through his graceful glance."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਏਹ ਸਾਰਾ ਪਸਾਰਾ) ਇਕ ਬਚਨ ਥੋਂ ਪਸਾਰਕੇ (ਆਪ) ਨਦਰ ਨਾਲ ਡਿੱਠਾ ('ਕਰਿ ਆਸਣੁ ਡਿਠੋ ਚਾਉ')।"