[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧਸੰਗਤਿ ਅਰੁ ਗੁਰ ਕੀ ਕ੍ਰਿਪਾ ਤੇ; ਪਕਰਿਓ ਗਢ ਕੋ ਰਾਜਾ ॥੫॥"
page = 1161
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Associating with the saints and by the Guru's grace, I captured the king of the fortress."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿ ਸੰਗਤ ਕਰ ਅਤੇ ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਮੈਂ ਕਿਲ੍ਹੇ ਦੇ ਪਾਤਿਸ਼ਾਹ ਨੂੰ ਪਕੜ ਲਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Saadh Sangat, the Company of the Holy, and by Guru's Grace, I have captured the king of the fortress. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਸਾਧਸੰਗਤਿ ਔਰ ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਹੋਣੇ ਤੇ ਗਢ ਕਾ ਰਾਜਾ ਮਨੁ ਪਕੜ ਲੀਆ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਤੇ ਸਤਸੰਗ ਦੀ ਮਿਹਰ ਨਾਲ ਮੈਂ ਕਿਲ੍ਹੇ ਦਾ (ਆਕੀ) ਰਾਜਾ ਫੜ ਲਿਆ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entonces asociándose con los Santos y por la Gracia del Guru uno captura vivo al rey de la fortaleza. (5)"