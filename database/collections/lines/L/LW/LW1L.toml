[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਠ ਪਹਰ ਗੁਣ ਗਾਈ ॥"
page = 626
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day through, I sing the Lord's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਰਾਤ ਮੈਂ ਪ੍ਰਭੂ ਦੀ ਕੀਰਤੀ ਗਾਇਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Twenty-four hours a day, I sing His Glorious Praises."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀਤੇ ਹਮ ਆਠ ਪਹਰ ਹੀ ਵਾਹਗੁਰੂ ਕੇ ਗੁਨ ਗਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅੱਠੇ ਪਹਿਰ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੇ ਗੀਤ ਗਾਣੇ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਠ ਪਹਿਰ = ਹਰ ਵੇਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las veinticuatro horas del día canto la Alabanza del Señor"