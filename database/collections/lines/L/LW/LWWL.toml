[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਚਤੁਰ, ਪਛਾਨ ॥੫੧੯॥"
page = 741

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly “Baan-Varjani” and uttering the word “Ripuni” at the end, the names of Tupak are formed.519."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤੁਪਕ ਦਾ ਨਾਮ ਬਣਦਾ ਹੈ। ਚਤੁਰ ਲੋਗੋ! ਪਛਾਣ ਲਵੋ ॥੫੧੯॥"