type = "primary"
data = "ਨਚੇ ਕੰਧ ਹੀਣੰ ਕਮੱਧੰ ਅਚੇਤੰ ॥"
page = 160

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The headless trunks began to dance unconsciously in the war."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਿਤੇ) ਕੰਧ (ਗਰਦਨ) ਤੋਂ ਬਿਨਾ ਧੜ ਅਚੇਤ ਅਵਸਥਾ ਵਿਚ ਨਚ ਰਹੇ ਸਨ।"