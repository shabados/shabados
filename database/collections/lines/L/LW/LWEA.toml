[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਹੀਐ ਜਹਾ, ਤਹੀ ਪਦ ਦੀਜੈ ॥੭੨੧॥"
page = 752

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And knowing all the names of Tupak (Truphang), you may use them, wherever you want,721."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਚਾਹੋ, ਉਥੇ ਵਰਤ ਲਵੋ ॥੭੨੧॥"