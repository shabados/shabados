[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ ਬਾਝਹੁ. ਮੁਕਤਿ ਕਿਨੇਹੀ ॥"
page = 1027
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the True Guru, how can there be emancipation?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਚੇ ਗੁਰਾਂ ਦੇ ਬਿਨਾ ਕਲਿਆਨ ਕਿਸ ਤਰ੍ਹਾਂ ਹੋ ਸਕਦੀ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the True Guru, how can anyone be liberated?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਤੇ ਬਿਨਾਂ ਮੁਕਤਿ ਕੀ ਪ੍ਰਾਪਤੀ ਕੈਸੀ ਅਰਥਾਤ ਨਹੀਂ ਪਰਾਪਤੀ ਹੋਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੂੰ ਮਿਲਣ ਤੋਂ ਬਿਨਾ (ਮਾਇਆ ਦੇ ਮੋਹ-ਸਮੁੰਦਰ ਤੋਂ) ਖ਼ਲਾਸੀ ਨਹੀਂ ਮਿਲਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਨੇਹੀ = ਕਿਹੋ ਜਿਹੀ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, ¿cómo puede uno encontrar Emancipación sin el Dios Guru,"