[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦ ਬਿਨੋਦ; ਭਰੇਪੁਰਿ ਧਾਰਿਆ ॥"
page = 376
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Joys and merry-makings the All-pervading Lord has established."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੁਸ਼ੀਆਂ ਅਤੇ ਮੌਜ ਬਹਾਰਾਂ ਸਰਬ-ਵਿਆਪਕ ਸੁਆਮੀ ਨੇ ਅਸਥਾਪਨ ਕੀਤੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The All-pervading Lord has established joys and celebrations."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੰਦ ਰੂਪ ਅਕਾਲ ਪੁਰਖ ਹੈ। ਏਹ ਜਿਤਨੇ (ਬਿਨੋਦ) ਬਿਲਾਸ ਹੈਂ ਸਭ (ਭਰੇਪੁਰਿ) ਪੂਰਨ ਹੋ ਕਰ ਆਪ ਹੀ ਸਰਬ ਕੋ ਧਾਰਿਆ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਦੇ ਸਾਰੇ ਕੌਤਕ-ਤਮਾਸ਼ੇ ਉਸ ਸਰਬ-ਵਿਆਪਕ ਪਰਮਾਤਮਾ ਦੇ ਹੀ ਰਚੇ ਹੋਏ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਨੋਦ = ਕੌਤਕ, ਤਮਾਸ਼ੇ। ਭਰੇਪੁਰਿ = ਭਰਪੂਰ ਪ੍ਰਭੂ ਨੇ, ਸਰਬ-ਵਿਆਪਕ ਪਰਮਾਤਮਾ ਨੇ। ਧਾਰਿਆ = ਧਾਰੇ ਹਨ, ਰਚੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Todo Prevaleciente creó todas las dichas y los juegos,"