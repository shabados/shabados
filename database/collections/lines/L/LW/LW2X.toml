data = "ਕਿਉਣ ਜੋ ਸਾਡੀ ਰੀਤ ਵਿਚ ਹੀਲ ਹੁੱਜਤ ਦੀ ਕੋਈ ਥਾਣ ਨਹੀਣ ।"

[[content]]
