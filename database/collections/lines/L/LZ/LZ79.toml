[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੁ ਪੁੰਨੁ ਪਦਾਰਥੁ ਤੇਰਾ ॥"
page = 625
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The gifts and the wealth are all Thine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਦਾਤਾਂ ਅਤੇ ਦੌਲਤ ਸਮੂਹ ਤੇਰੀਆਂ ਹੀ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "These blessings and wealth are Yours."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਤਨਾ ਹਮਾਰੇ ਪਾਸ ਪਦਾਰਥ ਹੈ ਇਹ ਸਭ ਤੇਰਾ ਹੀ ਪੁੰਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਨਾਮ-ਪਦਾਰਥ (ਜੋ ਮੈਨੂੰ ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਮਿਲਿਆ ਹੈ) ਤੇਰੀ ਹੀ ਬਖ਼ਸ਼ਸ਼ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੁੰਨੁ = ਬਖ਼ਸ਼ੀਸ਼। ਪਦਾਰਥੁ = ਨਾਮ-ਵਸਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "todas mis Bendiciones son Tuyas."