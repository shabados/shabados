[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਸੁ ਜਪਤ; ਫਿਰਿ. ਦੂਖੁ ਨ ਲਾਗੈ ॥"
page = 236
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By remembering whom, trouble overtakes not again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ, ਤਕਲਫ਼ਿ ਮੁੜ ਕੇ ਨਹੀਂ ਚਿਮੜਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating on Him, suffering shall never again overtake you."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਜਪਨੇ ਸੇ ਫਿਰ ਕੋਈ ਦੁਖ ਨਹੀਂ ਲਾਗਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਨਾਮ ਜਪਿਆਂ ਫਿਰ ਕੋਈ ਦੁੱਖ ਪੋਹ ਨਹੀਂ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਲਾਗੈ = ਪੋਹ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Meditando en El, el sufrimiento no te atormentara."