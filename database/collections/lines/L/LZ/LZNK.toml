[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੁਖ ਬਾਏ ਮੂਰਖ ਰਹਿਯੋ; ਭੇਦ ਨ ਸਕਿਯੋ ਪਾਇ ॥੯॥"
page = 1011

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And the husband’s head was left hanging without knowing the secret.(9)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੂਰਖ (ਪਤੀ) ਮੂੰਹ ਅਡੀ ਰਹਿ ਗਿਆ, ਪਰ ਭੇਦ ਨੂੰ ਨਾ ਪਾ ਸਕਿਆ ॥੯॥"