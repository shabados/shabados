data = "ਤੁਧੁ ਬਿਨੁ ਦੂਜਾ; ਅਵਰੁ ਨ ਕੋਈ ॥"
page = 130
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that besides Thee there is not any other."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿ ਤੇਰੇ ਬਿਨਾ ਹੋਰ ਕੋਈ ਵੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without You, there is no other at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਬਿਨਾਂ ਦੂਸਰਾ ਔਰ ਕੋਈ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੈਥੋਂ ਬਿਨਾ (ਤੇਰੇ ਵਰਗਾ) ਹੋਰ ਕੋਈ ਜੀਵ ਨਹੀਂ ਹੈ।"

[[content]]
