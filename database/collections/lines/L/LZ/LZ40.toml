[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸੁ ਧਰਤੀ ਮਹਿ; ਤੇਰੀ ਸਿਕਦਾਰੀ ॥"
page = 374
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In this world, thine is the sovereignty."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਜਹਾਨ ਅੰਦਰ ਤੇਰਾ ਰਾਜ ਭਾਗ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "in this world, you may be a ruler."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਧਰਤੀ ਮੇਂ ਤੇਰੀ (ਸਿਕਦਾਰੀ) ਸਰਦਾਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਧਰਤੀ ਉਤੇ ਤੇਰੀ ਹੀ ਸਰਦਾਰੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਕਦਾਰੀ = ਸਰਦਾਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por ti y eres regente del mundo entero,"