[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਤਿ ਪੋਤਿ; ਭਗਤਨ ਸੰਗਾਨਿ ॥"
page = 892
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Like warp and woof, He is with His saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਣੇ ਪੇਟੇ ਦੀ ਤਰ੍ਹਾਂ ਉਹ ਆਪਣੇ ਸੰਤਾਂ ਦੇ ਅੰਗ ਸੰਗ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is with His devotees, through and through."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਣੇ ਪੇਟੇ ਵਤ ਭਗਤੋਂ ਕਾ ਸੰਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੇ ਭਗਤਾਂ ਨਾਲ ਇਉਂ ਮਿਲਿਆ ਰਹਿੰਦਾ ਹੈ ਜਿਵੇਂ ਤਾਣਾ ਪੇਟਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਤ = ਉਣਿਆ ਹੋਇਆ। ਪ੍ਰੋਤ = ਪ੍ਰੋਤਾ ਹੋਇਆ। ਓਤਿ ਪੋਤਿ = ਜਿਵੇਂ ਉਣਿਆ ਹੋਇਆ ਪ੍ਰੋਤਾ ਹੋਇਆ ਹੋਵੇ, ਤਾਣੇ ਪੇਟੇ ਵਾਂਗ। ਸੰਗਾਨਿ = ਸੰਗਿ, ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él habita en Sus Devotos como trama y urdimbre."