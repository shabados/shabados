[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸ ਪਤੀਆ ਕਾ; ਇਹੈ ਪਰਵਾਨੁ ॥"
page = 1166
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The object of this miracle is that,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਕਰਾਮਾਤ ਦਾ ਇਹ ਮਲੋਰਥ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The purpose of this miracle is"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਬਾਦਸ਼ਾਹ ਕੀ ਦੀਨਤਾ ਪਰ ਨਾਮਦੇਵ ਜੀ ਦਯਾਲ ਹੂਏ ਤਬ ਕਹਤੇ ਹੈਂ: ਹੇ ਬਾਦਸ਼ਾਹ! ਇਸ ਪਰਚੇ ਕਾ ਏਹ (ਪਰਵਾਨੁ) ਨਿਸਚਾ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਇਕਰਾਰ ਦਾ ਮਾਪ ਇਹ ਹੋਵੇਗਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਵਾਨ = ਮਾਪ, ਅੰਦਾਜ਼ਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo mejor es que de aquí en adelante caminaras"