data = "ਯਾ ਮੈ ਕਛੂ ਭੇਦ ਨਹੀ ਜਾਨਹੁ ॥੬੮੮॥"
page = 749

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Say firstly the word “Bhoomi” and then add the word “Ruha”, and comprehend in this way all the names of Tupak unhesitatingly.688."

