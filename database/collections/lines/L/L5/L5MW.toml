[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਬਰਖ; ਕੀਏ ਜਪ ਤਾਪਾ ॥"
page = 98
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "For many years he may perform recitation and penance,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਸਾਲਾਂ ਨਹੀਂ ਉਹ ਪਾਠ ਤੇ ਤਪਸਿਆ ਪਿਆ ਕਰੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They chant and meditate, practicing austere self-discipline for years and years;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਅਨਿਕ ਬਰਖ ਜਪ ਤਪ ਕੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋਗੀ ਲੋਕ ਅਨੇਕਾਂ ਸਾਲ ਜਪ ਕਰਦੇ ਹਨ, ਤਪ ਸਾਧਦੇ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਰਖ = ਬਰਸ, ਵਰ੍ਹੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Durante años, el Yogui medita y practica una disciplina severa,"