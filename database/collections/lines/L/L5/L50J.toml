[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਨਹੁ ਮਧਿ ਮਹਾ ਬਨ ਕੇ; ਪਲ ਕੇ ਹਿਤ ਹ੍ਵੈ ਬਰ ਸਿੰਘ ਅਰੇ ਹੈ ॥੧੮੭੬॥"
page = 485

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They appear like lion ready for hunting.1876."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇੰਜ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ) ਮਾਨੋ ਬਹੁਤ ਵਡੇ ਬਨ ਵਿਚ ਮਾਸ ਲਈ ਬਲਵਾਨ ਸ਼ੇਰ ਹੋ ਕੇ ਅੜੇ ਖੜੋਤੇ ਹੋਣ ॥੧੮੭੬॥"