[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਨੁ ਬਨੁ; ਖੋਜਤ ਫਿਰਤ ਬੈਰਾਗੀ ॥"
page = 203
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The renouncer goes searching God in various woods."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਿਆਗੀ ਅਨੇਕਾਂ ਜੰਗਲਾਂ ਵਿੱਚ ਹਰੀ ਨੂੰ ਢੁੰਡਣ ਲਈ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The renunciate goes out into the woods, searching for Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਦਾਸੀਨਤਾ ਕਾ ਚਿੰਨ੍ਹ ਧਾਰ ਕਰ ਬਨ ਬਨ ਮੇਂ ਵਾ ਸੰਨਿਆਸੀ ਉਦਾਸੀ ਬਨ ਬਨ ਕੇ ਖੋਜਤੇ ਫਿਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਨੂੰ ਮਿਲਣ ਵਾਸਤੇ ਜੇ) ਕੋਈ ਮਨੁੱਖ ਗ੍ਰਿਹਸਤ ਤੋਂ ਉਪਰਾਮ ਹੋ ਕੇ ਹਰੇਕ ਜੰਗਲ ਢੂੰਡਦਾ ਫਿਰਦਾ ਹੈ (ਤਾਂ ਇਸ ਤਰ੍ਹਾਂ ਪਰਮਾਤਮਾ ਨਹੀਂ ਮਿਲਦਾ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਨੁ ਬਨੁ = ਹਰੇਕ ਜੰਗਲ। ਬੈਰਾਗੀ = ਵਿਰਕਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Hay hombres que renuncian al mundo y se van a los bosques en busca del Señor,"