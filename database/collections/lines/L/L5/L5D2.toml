[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਗਿਆਨਵਾਨ, ਪੁਹੰਚੇ ਹੋਏ, ਪੂਰਨ ਅਤੇ ਉਸ ਸ਼ਹੁ ਨਾਲ ਮਿਲ ਚੁਕੇ ਪ੍ਰੇਮੀ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਆਰਿਫ਼ਾਨੋ ਕਾਮਿਲਾਨੋ ਵਾਸਿਲਾਂ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "He is the abundance of beneficence and ultimate in generosity. (55)"