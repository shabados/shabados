[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਯਾ ਜਗ ਕੇ ਸੁਖ ਤੇ ਗਯੋ; ਜਨਮ ਬ੍ਰਿਥਾ ਗੇ ਕੀਯ ॥੧੪॥"
page = 903

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Rather the auspicious birth is wasted and the worldly bliss is gained not.(14)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਜਗਤ ਦੇ ਸੁਖ ਤੋਂ ਵਾਂਝਿਆ ਗਿਆ ਅਤੇ ਵਿਅਰਥ ਵਿਚ ਜਨਮ ਗੰਵਾ ਦਿੱਤਾ ॥੧੪॥"