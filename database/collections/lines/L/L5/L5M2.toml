type = "primary"
data = "ਜਨੁ ਤੈ ਦਾਸ ਮੋਲ ਕੋ ਲਯੋ ॥"
page = 1010

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Without any monetary compensation, I am yours like a servant."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇੰਜ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ) ਮਾਨੋ ਤੂੰ ਦਾਸ ਮੁੱਲ ਲੈ ਲਿਆ ਹੋਵੇ।"