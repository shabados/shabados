data = "ਬਾਜਸਾਲ ਤੇ ਹੈ ਇਕ ਲਿਯੋ ॥"
page = 843

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Nirat Mati (that lady) devised a scheme and sent for a horse from the stable."

