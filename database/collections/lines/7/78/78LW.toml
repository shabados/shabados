[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬ੍ਰਹਮੁ ਪਾਤੀ. ਬਿਸਨੁ ਡਾਰੀ; ਫੂਲ ਸੰਕਰਦੇਉ ॥"
page = 479
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Brahms is in the leaves, Vishnu in the boughs and God Shiva in the flowers."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਿਮਾ ਪੱਤਿਆਂ ਵਿੱਚ ਹੈ, ਵਿਸ਼ਨੂੰ ਟਹਿਣੀਆਂ ਵਿੱਚ ਅਤੇ ਸ਼ਿਵਜੀ ਦੇਵਤਾ ਫੁੱਲਾਂ ਵਿੱਚ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Brahma is in the leaves, Vishnu is in the branches, and Shiva is in the flowers."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਾਤ ਬ੍ਰਹਮਾ ਰੂਪ ਹੈਂ, ਡਾਲੀ ਬਿਸਨ ਰੂਪ ਹੈਂ, ਫੂਲ ਸ਼ੰਕਰ ਦੇਵ ਕਾ ਰੂਪ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮਾਲਣ!) ਪੱਤਰ ਬ੍ਰਹਮਾ-ਰੂਪ ਹਨ, ਡਾਲੀ ਵਿਸ਼ਨੂ-ਰੂਪ ਅਤੇ ਫੁੱਲ ਸ਼ਿਵ-ਰੂਪ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬ੍ਰਹਮੁ = ਬ੍ਰਹਮਾ। ਡਾਰੀ = ਡਾਲੀ, ਟਹਿਣੀ। ਸੰਕਰ = ਸ਼ਿਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las hojas son Brahma, las ramas y flores Vishnú y Shiva;"