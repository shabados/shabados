[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰਗਟ ਤੀਨਿ ਸੈ ਸਾਠਿ ਤ੍ਰਿਯ; ਨਾਚਤ ਜਹਾ ਬਨਾਇ ॥੯॥"
page = 920

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In whose court three hundred and sixty damsels used to dance.(9)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਥੇ (ਰਾਜੇ ਦੇ) ਸਾਹਮਣੇ ੩੬੦ ਇਸਤਰੀਆਂ ਨਾਚ ਕਰਦੀਆਂ ਹੁੰਦੀਆਂ ਸਨ ॥੯॥"