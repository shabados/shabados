type = "primary"
data = "ਆਪੁਨੇ ਦਲਹਿਾਂ ਜਗਾਇ; ਕਹੋ ਜੂਝ ਏਊ ਕਰਹਿਾਂ ॥੧੫੪੦॥"
page = 451

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Move to the battlefield, after calling all these warriors and challenging the king, make your army fight with him.1540."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਸੈਨਾ ਨੂੰ ਸਚੇਤ ਕਰ ਕੇ ਕਹੋ ਕਿ ਇਹ ਵੀ ਯੁੱਧ ਕਰਨ ॥੧੫੪੦॥"