data = "ਮੁਖੰ ਮਾਰ ਬੋਲੰ ॥"
page = 51

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere the double-edged swords and helmets lie broken, somewhere the warriors shout “kill, kill”."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਿਤੇ ਸੂਰਮੇ) ਮੂੰਹ ਤੋਂ ਮਾਰੋ-ਮਾਰੋ ਬੋਲ ਰਹੇ ਹਨ।"