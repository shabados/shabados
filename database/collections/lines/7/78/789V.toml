[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਚ ਸਬਦੁ ਗੁਰਿ ਸਉਪਿਆ; ਸਚ ਟਕਸਾਲਹੁ ਸਿਕਾ ਚਲਿਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The ture word has been handed over ( to Guru Angad) by the Guru (Nanak) as if the coin has been issued from the mint"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸੱਚ ਸਬਦ' (ਸਤਿਨਾਮ ਕਰਤਾ ਪੁਰਖ) ਗੁਰੂ (ਨਾਨਕ) ਨੇ ਸਉਂਪਿਆ ਹੈ, ਸੱਚੀ ਟਕਸਾਲ ਥੋਂ 'ਸਿੱਕਾ' ਤੁਰ ਪਿਆ।"