[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਸੁਖ ਕਉ; ਨਿਤ ਬਾਛਹਿ ਮੀਤ ॥"
page = 288
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The peace which thou ever desirest O friend,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਆਰਾਮ ਦੀ ਤੂੰ ਨਿਤਾ ਪ੍ਰਤੀ ਇੱਛਾ ਧਾਰਦਾ ਹੈ, ਹੇ ਮਿੱਤ੍ਰ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The peace, which you always yearn for, O friend"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਹੇ ਮਿਤ੍ਰ! ਜਿਸ ਨਿਤ ਸੁਖ, ਭਾਵ ਆਤਮ ਸੁਖ ਹੋਨੇ ਕੌ ਤੂੰ ਚਾਹਿਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਿਤ੍ਰ! ਜਿਸ ਸੁਖ ਨੂੰ ਤੂੰ ਸਦਾ ਤਾਂਘਦਾ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਛਹਿ = ਚਾਹੁੰਦਾ ਹੈਂ। ਮੀਤ = ਹੇ ਮਿਤ੍ਰ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La felicidad que día tras día has anhelado,"