[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜੋਗ ਭੋਗ ਜਪ ਤਪ ਘਣੇ; ਲੋਕ ਵੇਦ ਸਿਮਰਣੁ ਨ ਸੁਹਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "God does not like the hypocrisy of yoga, hedonism, recitation, asceticism, common customary acts etc."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੋਗ, ਭੋਗ, ਜਪ, ਤਪ, ਅਤੇ ਵੇਦਾਂ ਦਾ ਸਿਮਰਨ ਘਣੇ ਲੋਕ (ਦਿਖਾਵੇ ਲਈ ਕਰਦੇ ਹਨ, ਓਹ ਈਸ੍ਵਰ ਨੂੰ) ਚੰਗੇ ਨਹੀਂ ਲਗਦੇ।"