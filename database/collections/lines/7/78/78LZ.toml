data = "ਨ੍ਰਿਕਾਮੰ ਬਿਭੂਤੇ, ਸਮਸਤੁਲ ਸਰੂਪੇ ॥"
page = 10
line = 15

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Salutation to Thee O Desireless, Glorious and All-Pervading Lord!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਾਮਨਾਵਾਂ ਤੋਂ ਰਹਿਤ ਸੰਪੱਤੀ ਵਾਲੇ ਅਤੇ ਸਾਰਿਆਂ ਦੇ ਸਰੂਪ ਵਾਲੇ (ਪ੍ਰਭੂ ਨੂੰ ਮੇਰਾ ਪ੍ਰਨਾਮ ਹੈ)।"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਨ੍ਰਿਕਾਮੰ ਬਿਭੂਤੇ; ਸਮਸਤੁਲ ਸਰੂਪੇ ॥"