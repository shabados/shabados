[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪੂਰੇ; ਰਾਖਿਆ ਦੇ ਹਾਥ ॥"
page = 396
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Giving his hand the perfect Guru has protected the child."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਹੱਥ ਦੇ ਕੇ ਪੂਰਨ ਗੁਰਾਂ ਨੇ ਬੱਚੇ ਨੂੰ ਬਚਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Giving His Hand, the Perfect Guru has protected the child."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੂ ਨੇ ਮੇਰੇ ਕੋ ਹਾਥ ਦੇ ਕਰ ਰਖ੍ਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਸੇਵਕ ਨੂੰ ਪੂਰਾ ਗੁਰੂ ਆਪਣਾ ਹੱਥ ਦੇ ਕੇ (ਵਿਕਾਰ ਆਦਿਕ ਤੋਂ ਬਚਾ ਕੇ) ਰੱਖਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰਾ = ਸਭ ਗੁਣਾਂ ਨਾਲ ਭਰਪੂਰ। ਦੇ = ਦੇ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Perfecto Guru ha protegido a mi hijo con Su Mano."