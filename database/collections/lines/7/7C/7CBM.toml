[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅੰਦਰਿ ਸਭਾ ਦੁਸਾਸਣੈ; ਮਥੇਵਾਲਿ ਦ੍ਰੋਪਤੀ ਆਂਦੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Dragging Daropati by the hair, Dusasanai brought her into the assembly."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਦੁਸਾਸਨ ਨੇ ਸਭਾ ਵਿਚ ਦ੍ਰੋਪਤੀ ਜੂੜੇ ਤੋਂ ਫੜਕੇ ਆਂਦੀ।"