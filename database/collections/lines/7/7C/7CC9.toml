[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਖੁ ਜਗਤੁ ਸਗਲ, ਦੇ ਹਥਾ ਰਾਮ ॥"
page = 578
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Giving His hand, He preserves the whole world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਹੱਥ ਦੇ ਕੇ ਉਹ ਸਾਰੇ ਸੰਸਾਰ ਦੀ ਰੱਖਿਆ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He preserves the whole world, reaching out with His hand."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨਾ ਹਾਥ ਦੇ ਕਰ ਸਾਰੇ ਸੰਸਾਰ ਕੀ ਰਖ੍ਯਾ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਆਪਣਾ) ਹੱਥ ਦੇ ਕੇ ਸਾਰੇ ਜਗਤ ਦੀ ਰੱਖਿਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲ = ਸਾਰਾ। ਦੇ = ਦੇ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por Su Gracia conserva al mundo íntegro. Todopoderoso, Refugio Invaluable, Tesoro de Misericordia,"