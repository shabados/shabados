[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖੁ ਅੰਧਾ; ਅੰਧੁ ਕਮਾਏ ॥"
page = 1068
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The blind perverse person does blind deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਨ੍ਹਾਂ ਮਨਮੁੱਖ ਪੁਰਸ਼ ਅੰਨ੍ਹੇ ਕੰਮ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The blind, self-willed manmukh acts blindly."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ ਅਗ੍ਯਾਨੀ (ਅੰਧੁ) ਖੋਟੇ ਕਰਮਾਂ ਕੋ ਕਮਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ, ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲਾ ਮਨੁੱਖ (ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ) ਅੰਨ੍ਹਾ ਹੋਇਆ ਰਹਿੰਦਾ ਹੈ, ਉਹ ਸਦਾ ਅੰਨ੍ਹਿਆਂ ਵਾਲਾ ਕੰਮ ਹੀ ਕਰਦਾ ਹੈ (ਔਝੜੇ ਪਿਆ ਰਹਿੰਦਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਮੁਖ = ਆਪਣੇ ਮਨ ਵਲ ਮੂੰਹ ਕਰੀ ਰੱਖਣ ਵਾਲਾ ਮਨੁੱਖ, ਮਨ ਦਾ ਮੁਰੀਦ। ਅੰਧਾ = (ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ) ਅੰਨ੍ਹਾ। ਅੰਧੁ = ਅੰਨ੍ਹਿਆਂ ਵਾਲਾ ਕੰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El ególatra ciego hace actos obscuros,"