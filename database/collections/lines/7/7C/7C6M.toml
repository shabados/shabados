[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਹਰਿ ਕੀਆ; ਤਨੁ ਸਭੁ ਸਾਜਿਆ ॥"
page = 1337
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God created the soul and fashioned the whole body."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਨੇ ਆਤਮਾ ਰਚੀ ਹੈ ਅਤੇ ਸਾਰੇ ਸਰੀਰ ਨੂੰ ਘੜਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord created the mind, and fashioned the entire body."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਕਾ ਮਨ ਹਰੀ ਨੇ ਕੀਆ ਹੈ ਔਰ ਸਭ ਅੰਗੋਂ ਸਹਤ ਤਨ ਉਤਪਤ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰਮਾਤਮਾ ਨੇ (ਤੇਰਾ) ਮਨ ਬਣਾਇਆ, (ਤੇਰਾ) ਸਰੀਰ ਬਣਾਇਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਜਿਆ = ਪੈਦਾ ਕੀਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor creó la mente y diseñó el cuerpo entero,"