[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੀਰੀ ਤੇਗੀ ਜਮਧੜੀ, ਰਣ ਵੰਡੀ ਭਾਜੀ ॥"
page = 126

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They are inviting the warriors in the battlefield through the medium of arrows, swords and daggers."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੀਰਾਂ, ਤਲਵਾਰਾਂ ਅਤੇ ਕਟਾਰਾਂ ('ਜਮਧੜੀ') ਦੀ ਰਣ ਵਿਚ ਭਾਜੀ ਵੰਡੀ ਗਈ।"