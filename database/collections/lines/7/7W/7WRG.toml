data = "ਜਾ ਕੋ ਸਕਲ ਸੁਕਬਿ ਮਿਲ ਜੋਵੈ ॥੧੦੮੫॥"
page = 787

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Maatangani”, add the word “ari” and know all the names of Tupak.1085."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਨੂੰ ਸਾਰੇ ਕਵੀ ਮਿਲ ਕੇ ਵਿਚਾਰ ਲਵੋ ॥੧੦੮੫॥"