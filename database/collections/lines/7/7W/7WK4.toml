[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਪ੍ਰਭ ਬਿਨਉ ਸੁਨੀਜੈ ॥"
page = 738
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, hear my supplication O Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਫਰਮਾਉਂਦੇ ਹਨ, ਹੇ ਸੁਆਮੀ! ਮੇਰੀ ਬੇਨਤੀ ਸੁਣੋ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, hear my prayer, God:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਐਸੇ ਬੇਨਤੀ ਕਰੇ: ਹੇ ਪ੍ਰਭੂ! ਹਮਾਰੀ ਏਕ ਬੇਨਤੀ ਸੁਨੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਹੇ ਪ੍ਰਭੂ! ਮੇਰੀ ਬੇਨਤੀ ਸੁਣ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕ = ਹੇ ਨਾਨਕ! ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਬਿਨਉ = {विनय} ਬੇਨਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, oh Señor escucha mi oración"