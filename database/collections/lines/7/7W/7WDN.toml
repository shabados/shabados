[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਸਾ; ਸੋ ਨੀਕਾ ਕਰਿ ਸੋਧਹੁ ॥"
page = 342
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "S--Discipline the mind perfectly well."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ-ਉਸ ਮਨ ਦੀ ਪੂਰੀ ਤਰ੍ਹਾਂ ਤਾੜਨਾ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "SASSA: Discipline your mind with sublime perfection."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਸੇ ਅਖਰ ਦੁਆਰਾ ਕਹਤੇ ਹੈਂ: ਉਸ ਪਰਮੇਸ੍ਵਰ ਕੋ (ਨੀਕਾ) ਭਲੀ ਪ੍ਰਕਾਰ ਕਰ ਕੇ (ਸੋਧਹੁ) ਵਿਚਾਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਚੰਗੀ ਤਰ੍ਹਾਂ ਉਸ ਪਰਮਾਤਮਾ ਦੀ ਸੰਭਾਲ ਕਰੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋ = ਉਸ ਪ੍ਰਭੂ ਨੂੰ। ਨੀਕਾ ਕਰਿ = ਚੰਗੀ ਤਰ੍ਹਾਂ। ਸੋਧਹੁ = ਸੰਭਾਲ ਕਰੋ, ਯਾਦ ਕਰੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sa ssa Disciplina perfectamente tu mente,"