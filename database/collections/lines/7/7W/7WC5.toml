[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਦਿਸਹਿ; ਹਾਜਰੁ ਜਾਹਰਾ ॥"
page = 74
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God is apparently seen to be present."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਪਰਤੱਖ ਹੀ ਹਾਜ਼ਰ ਨਾਜ਼ਰ ਦਿਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is seen to be manifest and present."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਤੂੰ  ਪ੍ਰਗਟ ਹੀ ਸਮੀਪ ਦ੍ਰਿਸਟਿ ਆਵਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਭੀ, ਹੇ ਹਰੀ! ਤੂੰ (ਸਾਰੇ ਜਗਤ ਵਿਚ ਪ੍ਰਤੱਖ ਦਿੱਸਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ = ਹੇ ਹਰੀ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin embargo, Tu Presencia está tan manifiesta, oh mi Amado."