[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਧਵੇ; ਐਸੀ ਦੇਹੁ ਬੁਝਾਈ ॥"
page = 609
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O the Lord of wealth, grant me such an understanding,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਇਆ ਦੇ ਸੁਆਮੀ! ਮੈਨੂੰ ਏਹੋ ਜਿਹੀ ਸਮਝ ਦੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord, grant me such understanding,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਧਵੇ! ਐਸੀ ਸਮਝ ਦੇਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਨੂੰ ਇਹੋ ਜਿਹੀ ਅਕਲ ਬਖ਼ਸ਼,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਧਵੇ = {ਮਾ = ਮਾਇਆ। ਧਵ = ਪਤੀ} ਹੇ ਲੱਛਮੀ-ਪਤੀ! ਹੇ ਪ੍ਰਭੂ! ਬੁਝਾਈ = ਮਤਿ, ਸਮਝ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, instrúyeme, para que pueda servir sólo a Tus Santos,"