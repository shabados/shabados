[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉਮੈ ਮਾਰੇ; ਸਬਦੇ ਜਾਗੈ ॥"
page = 415
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If one stills ego, he remains awake to the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਬੰਦਾ ਹੰਕਾਰ ਨੂੰ ਮਾਰ ਲਵੇ, ਤਾਂ ਉਹ ਨਾਮ ਵਲ ਜਾਗਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Conquering ego, he remains awake to the Word of the Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਹੰਕਾਰ ਕੋ ਮਾਰਤਾ ਹੈ ਤਬ ਗੁਰ ਉਪਦੇਸ਼ ਕਰ ਮੋਹ ਨਿੰਦ੍ਰਾ ਸੇ ਜਾਗਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਹੀ ਗੁਰ-ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ ਉਹ ਹਉਮੈ ਨੂੰ ਮਾਰ ਕੇ (ਇਸ ਵਲੋਂ ਸਦਾ) ਸੁਚੇਤ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਬਦੇ = ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo abrazo y despierto en la Palabra."