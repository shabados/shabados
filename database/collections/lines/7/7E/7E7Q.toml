[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਖੀ ਜਾਗੀ; ਗੁਰਮੁਖਿ ਜਾਣੀ ॥੨॥"
page = 974
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It is by the Guru's grace, that the Lord's discourse becomes manifest and is understood."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਹੀ ਪ੍ਰਭੂ ਦੀ ਵਾਰਤਾ ਪ੍ਰਗਟ ਹੁੰਦੀ ਅਤੇ ਸਮਝੀ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh becomes aware, and knows the Teachings. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਮਾਧੀ ਕਾਲ ਮੇਂ ਜਿਨਾਂ ਕੀ ਗੁਰ ਸਿਖ੍ਯਾ ਕਰ ਕੇ ਬਿਰਤੀ ਜੋਗ ਮੇਂ ਜਾਗੀ ਹੈ, ਤਿਨੋਂ ਨੇ ਦਸਮੇਂ ਦੁਆਰ ਕੀ ਜਗਾ ਵਾ ਮਹਿਮਾ ਜਾਣੀ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਦੀ ਸੁਰਤ ਗੁਰੂ ਦੀ ਸਿੱਖਿਆ ਨਾਲ ਜਾਗ ਪੈਂਦੀ ਹੈ, ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਸੂਝ ਪੈ ਜਾਂਦੀ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਖੀ = ਸਿੱਖਿਆ ਨਾਲ। ਜਾਗੀ = (ਸੁਰਤ) ਜਾਗ ਪੈਂਦੀ ਹੈ। ਜਾਣੀ = ਸੂਝ ਪੈ ਜਾਂਦੀ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y la Palabra de Dios se vuelve manifiesta a través del Guru.(2)"