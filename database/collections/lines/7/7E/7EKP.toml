[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗੁ ਆਸਾ ਮਹਲਾ ੧ ਪਟੀ ਲਿਖੀ ॥"
page = 432
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Asa Measure 1st Guru. The writing of a tablet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਸਾ ਪਹਿਲੀ ਪਾਤਸ਼ਾਹੀ। ਫੱਟੀ ਦਾ ਲਿਖਣਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Aasaa, First Mehl, Patee Likhee ~ The Poem Of The Alphabet:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਆਸਾ ਵਿੱਚ ਗੁਰੂ ਨਾਨਕਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਪਟੀ ਲਿਖੀ'।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Asa, Mejl Guru Nanak, Primer Canal Divino, Patti Likje, Poema del Alfabeto."