[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਿ ਪਰਤੀਤਿ ਬਨੀ; ਪ੍ਰਭ ਤੇਰੀ ॥"
page = 1072
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Lord, within my mind, I have enshrined faith in Thee,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸੁਆਮੀ! ਆਪਣੇ ਚਿੱਤ ਅੰਦਰ ਮੈਂ ਤੇਰੇ ਉੱਤੇ ਭਰੋਸਾ ਧਾਰ ਲਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O God, I have enshrined faith in You within my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜਬ ਤੇ ਮਨ ਮੇਂ ਤੇਰੀ ਪ੍ਰਤੀਤ ਬਨੀ ਅਰਥਾਤ ਧਾਰੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜਿਸ ਮਨੁੱਖ ਦੇ ਮਨ ਵਿਚ ਤੇਰੀ ਸਰਧਾ ਬਣ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = (ਜਿਸ ਮਨੁੱਖ ਦੇ) ਮਨ ਵਿਚ। ਪਰਤੀਤਿ = ਸਰਧਾ। ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, en lo más íntimo de mi ser,"