[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭਨਾ ਸਚੁ ਵਸੈ ਮਨ ਮਾਹੀ ॥"
page = 1069
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within the minds of all abides the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਦੇ ਹਿਰਦਿਆਂ ਅੰਦਰ ਸੱਚਾ ਸਾਈਂ ਨਿਵਾਸ ਰਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Lord dwells within the minds of all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭਨਾਂ ਜੀਆਂ ਕੇ ਮਨ ਮੇਂ ਸਚ ਹੀ ਵਸਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਂਞ ਤਾਂ) ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਸਭ ਜੀਵਾਂ ਦੇ ਮਨ ਵਿਚ ਵੱਸਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਹੀ = ਮਾਹਿ, ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En la mente de todos habita el Señor Verdadero,"