[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਜੰਤ ਸਭਿ; ਤਿਸ ਕੇ ਥਾਪੇ ॥"
page = 1007
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the sentient beings, He Himself establishes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਪ੍ਰਾਣਧਾਰੀਆਂ ਨੂੰ ਉਹ ਆਪ ਹੀ ਅਸਥਾਪਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He created and established all beings and creatures."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੂਖਮ ਅਸਥੂਲ ਜੀਵ ਤਿਸੀ ਪਰਮਾਤਮਾ ਕੇ (ਥਾਪੇ) ਬਨਾਏ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜੀਵ ਉਸ (ਪਰਮਾਤਮਾ) ਦੇ ਹੀ ਪੈਦਾ ਕੀਤੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭਿ = ਸਾਰੇ। ਤਿਸ ਕੇ = ਉਸ (ਪਰਮਾਤਮਾ) ਦੇ। ਥਾਪੇ = ਪੈਦਾ ਕੀਤੇ ਹੋਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y quienes parten habiendo sido victoriosos en esta vida humana,"