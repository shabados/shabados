data = "ਦੂਖ ਬਿਨਾਸਨੀ; ਹਾਂ ॥"
page = 409
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is the Destroyer of distress."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਦਰਦ ਦੂਰ ਕਰਨ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Dispeller of distress."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੁਖਾਂ ਦੇ ਨਾਸ ਕਰਨੇ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਸਾਰੇ ਦੁੱਖਾਂ ਦਾ ਨਾਸ ਕਰਨ ਵਾਲਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਖ ਬਿਨਾਸਨੀ = ਦੁੱਖਾਂ ਦਾ ਨਾਸ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en el mundo, se conciba al Señor."