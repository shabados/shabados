[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਪ੍ਰਭੁ ਸਿਮਰਹੁ; ਸਦਾ ਅਨੂਪੁ ॥"
page = 270
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "contemplate over that, ever Incomparable Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਸਦੀਵੀ ਲਾਸਾਨੀ ਸਾਹਿਬ ਦਾ ਭਜਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "constantly remember God, the Incomparably Beautiful One."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਸੋ ਤਿਸ ਪ੍ਰਭੂ ਅਨੂਪ ਕੌ ਸਦਾ ਸਿਮਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਸੋਹਣੇ ਮਾਲਕ ਨੂੰ ਸਦਾ ਸਿਮਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨੂਪੁ = ਅਨ ਊਪ, ਉਪਮਾ-ਰਹਿਤ, ਜਿਸ ਵਰਗਾ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "medita constantemente en Dios, el Ser de Belleza sin igual."