data = "ਸਕਲ ਕਾਲ ਕਾ ਕੀਆ ਤਮਾਸਾ ॥੩੮੩॥"
page = 1386

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All this is the play of the Temporal Lord.383."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮਹਾਕਾਲ! ਤੁਸੀਂ ਹੀ) ਸਾਰਿਆਂ ਕਾਲਾਂ ਦਾ ਕੌਤਕ ਰਚਾਇਆ ਹੋਇਆ ਹੈ ॥੩੮੩॥"

[[content]]
