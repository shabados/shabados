[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਚਉ. ਸਜਣ ਮੈਡਿਆ; ਡੇਈ. ਸਿਸੁ ਉਤਾਰਿ ॥"
page = 1094
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If Thou say so, I would cut off my head and give it to Thee, O my Friend."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਤੂੰ ਅੰਕੁਰ ਆਖੇਂ, ਮੈਂ ਆਪਣਾ ਸਿਰ ਵੱਢ ਕੇ ਤੈਨੂੰ ਸਮਰਪਣ ਕਰ ਦਿਆਂਗਾ, ਹੇ ਮੇਰੇ ਮਿੱਤ੍ਰਾ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If You tell me to, O my Friend, I will cut off my head and give it to You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸਜਨ! ਜੇ ਤੂੰ ਕਹੇਂ ਤੌ ਮੈਂ ਅਪਨਾ ਸੀਸ ਉਤਾਰ ਕੇ ਤੁਝ ਕੋ ਦੇਵੋਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸੱਜਣ! ਤੂੰ ਆਖ (ਭਾਵ, ਜੇ ਤੂੰ ਆਖੇਂ ਤਾਂ) ਮੈਂ ਆਪਣਾ ਸਿਰ ਭੀ ਲਾਹ ਕੇ ਭੇਟ ਕਰ ਦਿਆਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਉ = ਕਹੁ, ਦੱਸ। ਸਜਣ ਮੈਡਿਆ = ਹੇ ਮੇਰੇ ਸੱਜਣ! ਡੇਈ = ਡੇਈਂ, ਮੈਂ ਦਿਆਂ। ਸਿਸੁ = ਸੀਸ, ਸਿਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Amor, si lo pides, Te ofrezco mi cabeza."