[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਨਾਮਿ ਰਤੇ ਜਨ ਨਿਰਮਲੇ; ਸਹਜੇ ਸਚਿ ਸਮਾਉ ॥੨॥"
page = 1286
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, they who are imbued with the Name, they are the pure persons and easily merge in the True one."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਜੋ ਨਾਮ ਨਾਲ ਰੰਗੀਜੇ ਹਨ, ਉਹ ਪਵਿੱਤਰ ਪੁਰਸ਼ ਹਨ ਅਤੇ ਸੁਖੈਨ ਹੀ ਸਤਿਪੁਰਖ ਅੰਦਰ ਲੀਨ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, those humble beings who are imbued with the Naam are pure and immaculate. They are intuitively merged in the True Lord. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜੋ ਪੁਰਸ਼ ਨਾਮ ਮੇਂ ਰਤੇ ਹੈਂ, ਸੋ ਨਿਰਮਲ ਹੂਏ ਹੈਂ ਔਰ ਸਹਿਜੇ ਹੀ ਤਿਨ ਕਾ ਸਚ ਮੇਂ ਸਮਾਵਣਾ ਹੂਆ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਮਨੁੱਖ ਪਵਿੱਤ੍ਰ ਹਨ ਜੋ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਵਿਚ ਰੰਗੇ ਹੋਏ ਹਨ, ਉਹ ਆਤਮਕ ਅਡੋਲਤਾ ਦੀ ਰਾਹੀਂ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਵਿਚ ਜੁੜੇ ਰਹਿੰਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਮਿ = ਵਿਚ। ਸਹਜੇ = ਸਹਜਿ, ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਟਿਕ ਕੇ। ਸਚਿ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਵਿਚ। ਸਮਾਉ = ਲੀਨਤਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, esos seres humildes que viven imbuidos en el Naam son inmaculados y puros. De manera intuitiva se funden en el Verdadero Señor. (2)"