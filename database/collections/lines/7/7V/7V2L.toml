[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨਾਸਰੀ ਮਹਲਾ ੧ ਆਰਤੀ ॥"
page = 663
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Dhanasri 1st Guru. Present adoration."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨਾਸਰੀ ਪਹਿਲੀ ਪਾਤਿਸ਼ਾਹੀ। ਸਨਮੁੱਖ ਉਪਾਸ਼ਨਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Dhanaasaree, First Mehl, Aartee:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਧਨਾਸਰੀ ਵਿੱਚ ਗੁਰੂ ਨਾਨਕਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਆਰਤੀ'।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dhanasri, Mejl Guru Nanak, Primer Canal Divino, Arti."