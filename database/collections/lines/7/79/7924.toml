data = "ਕਿ ਰਾਜੇਸ੍ਵਰੀ ਛੈ ॥੨੯੬॥"
page = 659

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She was looking like Savitri, Gayatri, the supreme goddess amongst the goddesses and the chief queen amongst the queens.296."

