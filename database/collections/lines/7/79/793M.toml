[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚੰਚਲ ਚਲਿਤ ਪਖੰਡ ਬਹੁ; ਵਲ ਛਲ ਕਰਿ ਪਰਪੰਚ ਵਧਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Through their deceptive and frolicsome characters, they increased delusions, deceits and convolutions."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਚੰਚਲਤਾਈ ਦੇ ਕੌਤਕ, ਪਖੰਡ, ਵਲ ਛਲ ਕਰ ਕੇ ਕਈ (ਪਰਪੰਚ) ਪਸਾਰੇ ਵਧਾ ਦਿਤੇ।"