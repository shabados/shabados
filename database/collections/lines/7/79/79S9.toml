[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੀਯੋ ਤ ਪਿਯ ਕੇ ਸਹਿਤ ਹੀ; ਮਰੌ ਤ ਪਤਿ ਕੇ ਪਾਸ ॥੪੩॥"
page = 964

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘I will live or die with my lover.’(43)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਫਿਰ ਸੋਚਣ ਲਗੀ ਕਿ) ਜੇ ਜੀਵਾਂਗੀ ਤਾਂ ਪ੍ਰੀਤਮ ਦੇ ਨਾਲ ਅਤੇ ਜੇ ਮਰਾਂਗੀ ਤਾਂ ਵੀ ਪ੍ਰੀਤਮ ਦੇ ਕੋਲ (ਹੀ ਮਰਾਂਗੀ) ॥੪੩॥"