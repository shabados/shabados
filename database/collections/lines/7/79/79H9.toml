[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਣਰੰਗਿ ਸੁ ਚਾਚਰ ਮਚਹਿਗੇ ॥੩੨੦॥"
page = 583

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The swords will clatter and the jingling of the steel armours will be heard, the sharp-edged weapons will produce knocking sounds and the Holi of the war will be played.320."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਯੁੱਧ-ਭੂਮੀ ਵਿਚ ਫਾਗ ਮਚੇਗੀ ॥੩੨੦॥"