[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਰਦਾਸਿ ਕਰੀ; ਪੂਰੇ ਗੁਰ ਪਾਸਿ ॥"
page = 395
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I make supplication in the presence of the Perfect Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਪੁਰਨ ਗੁਰਾਂ ਦੀ ਹਜ਼ੂਰੀ ਵਿੱਚ ਪ੍ਰਾਰਥਨਾ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I offer this prayer to the Perfect Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਪੂਰੇ ਗੁਰੋਂ ਪਾਸ ਬੇਨਤੀ ਕਰਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੈਂ ਤਾਂ ਪੂਰੇ ਗੁਰੂ ਕੋਲ ਹੀ ਅਰਦਾਸ ਕਰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰੀ = ਕਰੀਂ, ਮੈਂ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak Le reza ahora al Perfecto Guru,"