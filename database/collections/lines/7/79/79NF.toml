data = "ਸਾਗੜਦੰ ਸੈਣੰ ਫਾਗੜਦੰ ਫੇਰੀ ॥੪੪੪॥"
page = 595

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There was the sound of arrows and the trumpets sounded, the kettledrums were played and the armies roamed.444."

