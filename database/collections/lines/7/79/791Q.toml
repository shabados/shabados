[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਾਤਿ ਭਾਤਿ ਕੇ ਸਸਤ੍ਰ ਲੈ; ਸੂਰਾ ਸਭੈ ਬੁਲਾਇ ॥"
page = 1016

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He gathered all the fighters along with their weapons."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਬਾਣਾਸੁਰ ਨੇ) ਭਾਂਤ ਭਾਂਤ ਦੇ ਹਥਿਆਰਾਂ ਨਾਲ ਲੈਸ ਸਾਰਿਆਂ ਸੂਰਮਿਆਂ ਨੂੰ ਬੁਲਾ ਲਿਆ।"