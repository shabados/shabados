[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਠ ਪਹਰ; ਜਿਨਿ ਖਸਮੁ ਧਿਆਇਆ ॥"
page = 1077
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who having been born in this world, contemplates his Lord, the eight watches through."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਇਸ ਜਹਾਨ ਵਿੱਚ ਪੈਦਾ ਹੋ, ਦਿਨ ਦੇ ਅੱਠੇ ਪਹਿਰ ਹੀ ਆਪਣੇ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and meditate on their Lord and Master, twenty-four hours a day."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸਨੇ ਅਠੇ ਪਹਿਰ ਅਪਨੇ ਖਸਮ ਕੋ ਧਿਆਇਆ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਅੱਠੇ ਪਹਰ ਮਾਲਕ-ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਯਾਦ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਮਨੁੱਖ) ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que contempla a su Maestro las ocho rondas del día y de la noche,"