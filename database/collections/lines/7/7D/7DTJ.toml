[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ ਪ੍ਰਭ ਸੂਖ ਨਿਧਾਨ ॥"
page = 1146
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Transcendent Lord Master is the Treasure of bliss."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ਰੋਮਣੀ ਸੁਆਮੀ ਮਾਲਕ ਪ੍ਰਸੰਨਤਾ ਦਾ ਖਜਾਨਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Lord God is the Treasure of Peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਾਰਬ੍ਰਹਮ ਸਮਰਥ ਸੁਖੋਂ ਕੇ ਸੁਮੰਦ੍ਰ! ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸਰ ਪ੍ਰਭੂ ਸਾਰੇ ਸੁਖਾਂ ਦਾ ਖ਼ਜ਼ਾਨਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਧਾਨ = ਖ਼ਜ਼ਾਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Dios Trascendente, el Dios es el Tesoro de Éxtasis"