[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨਾ ਭਗਤ ਜਨਾ ਕਉ. ਸਦ ਨਮਸਕਾਰੁ ਕੀਜੈ; ਜੋ ਅਨਦਿਨੁ ਹਰਿ ਗੁਣ ਗਾਵਣਿਆ ॥੧॥ ਰਹਾਉ ॥"
page = 123
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever make obeisance unto those pious person who night and day chant God's glories. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਦੀਵ ਹੀ ਉਨ੍ਹਾਂ ਪਵਿੱਤ੍ਰ ਪੁਰਸ਼ਾ ਨੂੰ ਪ੍ਰਣਾਮ ਕਰ ਜਿਹੜੇ ਰਾਤ੍ਰੀ ਤੇ ਦਿਹੁੰ ਵਾਹਿਗੁਰੂ ਦੀ ਸਿਫ਼ਤ ਸ਼ਲਾਘਾ ਗਾਹਿਨ ਕਰਦੇ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I humbly bow to those devotees who chant the Glorious Praises of the Lord, night and day. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਰਾਤ ਦਿਨ ਹਰੀ ਕੇ ਗੁਣ ਗਾਵਤੇ ਹੈਂ ਤਿਨ ਭਗਤ ਜਨਾਂ ਕਉ ਸਦਾ ਨਮਸਕਾਰ ਕਰੀਏ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹੋ ਜਿਹੇ ਭਗਤਾਂ ਅੱਗੇ ਸਦਾ ਸਿਰ ਨਿਵਾਣਾ ਚਾਹੀਦਾ ਹੈ, ਜੇਹੜੇ ਹਰ ਰੋਜ਼ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦੇ ਹਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਸਦ = ਸਦਾ। ਕੀਜੈ = ਕਰਨੀ ਚਾਹੀਦੀ ਹੈ। ਅਨਦਿਨੁ = ਹਰ ਰੋਜ਼ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me postro en Reverencia ante tales Devotos, por siempre y para siempre, ante aquéllos que en la Alabanza, conciben a su Señor. (1-Pausa)"