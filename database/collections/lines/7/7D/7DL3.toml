[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਉਪਜੈ; ਸੋ ਆਵੈ ਜਾਇ ॥"
page = 352
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who is born, continues coming and going."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੰਮਿਆ ਹੈ, ਉਹ ਆਉਂਦਾ ਤੇ ਜਾਂਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whoever is born, continues to come and go."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਉਪਜੈ ਹੈਂ, ਸੋ ਜਨਮਤੇ ਮਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਯਕੀਨ ਰਹਿੰਦਾ ਹੈ ਕਿ ਜਗਤ ਤਾਂ ਪੈਦਾ ਹੁੰਦਾ ਤੇ ਨਾਸ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਪਜੈ = ਜੰਮਦਾ ਹੈ। ਜਾਇ = ਚਲਾ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que nace en el mundo de las formas sólo va y viene."