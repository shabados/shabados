[[content]]
assets = ["SSKS"]
type = "primary"
data = "ਅੰਤ ਅਨੰਤ ਨ ਜਾਨੀਐ ਆਦ ਪਰਮ ਪਰਮਾਦਿ ॥੨॥੬॥"

[[content]]
assets = ["SSPK"]
type = "translation"
language = "en"
data = "That perspective is infinite and no one can understand it. It is beyond, away and still away out of the reach of mortals."

[[content]]
assets = ["SSSK"]
type = "translation"
language = "pa"
data = "ਓਨਾਂ ਅਨੰਤ ਰੂਪ ਸ੍ਰੀ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਦਾ ਅੰਤ ਓੜਕ ਨਹੀਂ ਜਾਣਿਆਂ ਜਾ ਸਕਦਾ, ਉਹ ਬਿਸਮਾਦ ਰੂਪ ਸਭ ਦੀ ਪਰਾ ਕਾਸ਼ਟਾ ਪਰਮ ਹੱਦ ਆਦਿ ਹਨ। ਭਾਵ ਓਨਾਂ ਦੀ ਆਦਿ ਕੋਈ ਨਹੀਂ ॥੧੭॥"