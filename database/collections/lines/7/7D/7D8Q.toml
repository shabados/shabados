[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੈ ਬਚਨਿ; ਹਰਿ ਕੇ ਗੁਣ ਗਾਇ ॥੨॥"
page = 177
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru 's word, he sings the praises of God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਸ਼ਬਦ ਰਾਹੀਂ ਉਹ ਵਾਹਿਗੁਰੂ ਦਾ ਜੱਸ ਗਾਇਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "through the Guru's Word, we sing the Glorious Praises of the Lord. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਬਚਨ ਦ੍ਵਾਰਾ ਹੀ ਹਰੀ ਕੇ ਗੁਨ ਗਾਯਨ ਕਰੀਤੇ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਉਪਦੇਸ਼ (ਦੀ ਬਰਕਤਿ) ਨਾਲ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦਾ (ਰਹਿੰਦਾ) ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਾਇ = ਗਾਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a través de la Palabra del Shabd del Guru uno canta las Alabanzas del 2Señor.(2)"