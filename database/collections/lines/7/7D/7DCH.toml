[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ; ਮਾਇਆ ਕੈ ਹਾਥਿ ਬਿਕਾਨਉ ॥੧॥ ਰਹਾਉ ॥"
page = 710
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My soul is sold out in the mammon's hand. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਆਤਮਾ ਮੈਂ ਮੋਹਨੀ ਦੇ ਹੱਥ ਵੇਚ ਛੱਡੀ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind has sold out, and is in Maya's hands. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਮੇਰਾ ਮਨ ਤੇਰੀ ਮਾਇਆ ਕੇ ਹਾਥ ਬਿਕਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣਾ ਮਨ ਮਾਇਆ ਦੇ ਹੱਥ ਵੇਚ ਚੁਕਿਆ ਹਾਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਕਾਨਉ = ਮੈਂ ਵੇਚ ਦਿੱਤਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, yo no sé nada; mi mente la he vendido a Maya. (1-Pausa)"