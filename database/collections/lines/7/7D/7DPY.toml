[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਪ ਹੀ ਹਾਕ ਹਥਿਯਾਰ ਹਠੀ; ਗਹਿ ਸ੍ਰੀ ਰਘੁਨੰਦਨ ਸੋ ਰਣ ਠਾਨਯੋ ॥"
page = 264

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Shouting loudly and holding his weapons in his hands, he came straight towards Ram and fought with him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਖ਼ੁਦ ਹੀ ਲਲਕਾਰਾ ਮਾਰ ਕੇ ਅਤੇ ਹਥਿਆਰ ਫੜ ਕੇ ਹਠੀ (ਰਾਵਣ) ਨੇ ਸ੍ਰੀ ਰਾਮ ਨਾਲ ਯੁੱਧ ਸ਼ੁਰੂ ਕਰ ਦਿੱਤਾ।"