data = "ਕੋਟਿ ਤੀਰਥ ਇਸਨਾਨੁ ਕਰੀਜਾ ॥"
page = 1349
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and taking bath at millions of pilgrim places,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕ੍ਰੋੜਾਂ ਹੀ ਧਰਮ ਅਸਥਾਨਾਂ ਦੇ ਮਜਨ ਕਰਨੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and taking millions of cleansing baths at sacred shrines of pilgrimage"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਰੋੜੋਂ ਤੀਰਥੋਂ ਕਾ ਇਸਨਾਨ ਭੀ ਕਰ ਲੀਆ ਹੈ॥☬ਸੋ ਕਿਆ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੇ ਮਾਨੋ) ਕ੍ਰੋੜਾਂ ਤੀਰਥਾਂ ਦਾ ਇਸ਼ਨਾਨ ਕਰ ਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਟਿ = ਕ੍ਰੋੜਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "servicio de alabanzas y millones de baños de limpia en lugares sagrados,"