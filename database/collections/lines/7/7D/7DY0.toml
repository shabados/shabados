[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੇਵ ਸਭੈ ਹਰਖਤ ਭਏ; ਹਰਖਿਯੋ ਹਠੀ ਨ ਏਕ ॥੨੦॥"
page = 1008

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But stubborn competitors were not pleased.(20)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਦੇਵਤੇ ਪ੍ਰਸੰਨ ਹੋ ਗਏ, ਪਰ (ਉਥੇ ਮੌਜੂਦ) ਹਠੀ ਰਾਜਿਆਂ ਵਿਚੋਂ ਕੋਈ ਵੀ ਪ੍ਰਸੰਨ ਨਾ ਹੋਇਆ ॥੨੦॥"