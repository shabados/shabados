[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਨਿਰਤਿ; ਹਰਿ ਲਾਗੈ ਭਾਉ ॥"
page = 364
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "For the pious person, embracing love for God is the dance,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤ੍ਰ ਪੁਰਸ਼ ਲਈ, ਵਾਹਿਗੁਰੂ ਨਾਲ ਪ੍ਰੀਤ ਪਾਉਣੀ ਨ੍ਰਿਤਕਾਰੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh's dance is to embrace love for the Lord;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾਂ ਕੀ ਨਿਰਤਕਾਰੀ ਏਹੀ ਹੈ, ਜੋ ਹਰੀ ਮੇਂ ਪ੍ਰੇਮੁ ਲਗ ਜਾਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿਣਾ ਹੀ ਨਾਚ ਹੈ (ਇਸ ਤਰ੍ਹਾਂ) ਪਰਮਾਤਮਾ ਨਾਲ ਪਿਆਰ ਬਣਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਉ = ਪ੍ਰੇਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La danza del Gurmukj es aquélla en donde él ama a su Dios,"