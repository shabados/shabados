[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਸੰਗ ਸੋ ਬਾਤੈਂ ਸਦਾ; ਡਰ ਤੇ ਭਯਾ ਨਿਰਾਸ ॥੨੭॥"
page = 866

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And, then on, always remained cautious of women.(27)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ (ਇਸਤਰੀ) ਨਾਲ ਗੱਲਾਂ ਕਰਨੋ ਸਦਾ ਡਰਦਾ ਹੋਇਆ ਨਿਰਾਸ ਹੋ ਗਿਆ ॥੨੭॥"