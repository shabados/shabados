[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਟ ਸਤਾਣੀ; ਪ੍ਰਭ ਜੀਉ ਮੇਰੈ ॥"
page = 1214
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have the powerful support of my Sire Master,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਆਪਣੇ ਮਹਾਰਾਜ ਮਾਲਕ ਦਾ ਜੋਰਾਵਰ ਆਸਰਾ ਹੈ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have the Almighty Support of my Dear Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਜੀ! ਮੇਰੇ ਕੋ ਸਹਤ ਬਲ ਕੇ ਆਪ ਕੀ ਓਟ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਜੀ! ਮੇਰੇ ਹਿਰਦੇ ਵਿਚ ਤੇਰਾ ਹੀ ਤਕੜਾ ਸਹਾਰਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਟ = ਆਸਰਾ। ਸਤਾਣੀ = ਤਾਣ ਵਾਲੀ, ਤਕੜੀ। ਮੇਰੈ = ਮੇਰੇ ਅੰਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios mío, Tú eres mi Refugio más Poderoso, oh Señor, toda mi Dicha es Tuya,"