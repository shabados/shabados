[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਰ ਕੇ ਭੂਪ ਗਏ ਤਿਹ ਠਾ; ਜਹ ਬਾਧੇ ਕਈ ਪੁਨਿ ਭੂਪ ਪਰੇ ॥"
page = 532

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After killing Jarasandh, they all went to that place, where he had imprisoned many kings"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਜਾ (ਜਰਾਸੰਧ) ਨੂੰ ਮਾਰ ਕੇ, ਫਿਰ (ਕ੍ਰਿਸ਼ਨ) ਉਸ ਸਥਾਨ ਤੇ ਗਏ ਜਿਥੇ ਬੰਨ੍ਹੇ ਹੋਏ ਕਈ ਰਾਜੇ ਪਏ ਸਨ।"