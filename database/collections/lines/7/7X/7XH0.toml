[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਸੋਈ ਸੇਵੀਐ; ਸਦਾ ਸਦਾ ਜੋ ਦੇਇ ॥"
page = 956
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, serve thou Him ever, who ever and ever guides thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਤੂੰ ਹਮੇਸ਼ਾਂ ਉਸ ਦੀ ਸੇਵਾ ਕਰ ਜੋ ਸਦੀਵ ਤੇ ਸਦੀਵ ਹੀ ਤੈਨੂੰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, serve Him, who gives to you forever and ever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਸੋ ਸੇਵਣਾ ਚਾਹੀਤਾ ਹੈ, ਜੋ ਸਦਾ ਸਦਾ ਖਾਨ ਪਹਿਰਾਨ ਆਦਿ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜੋ ਪ੍ਰਭੂ ਸਦਾ ਹੀ (ਜੀਵਾਂ ਨੂੰ ਦਾਤਾਂ) ਦੇਂਦਾ ਹੈ ਉਸ ਨੂੰ ਸਿਮਰਨਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਇ = ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Elévalo en tu mente, sírvelo siempre pues te bendice con Sus Bondades Infinitas."