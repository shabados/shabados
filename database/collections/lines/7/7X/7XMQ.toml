[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੀ ਪ੍ਰੀਤਿ; ਗੋਬਿੰਦ ਸਿਉ ਲਾਗੀ ॥"
page = 186
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, whose love is with Lord of the Universe,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਪਿਰਹੜੀ ਆਮਲ ਦੇ ਸੁਆਮੀ ਨਾਲ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who are in love with the Lord of the Universe"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਪ੍ਰੀਤ ਗੋਬਿੰਦ ਕੇ ਸਾਥ ਲਾਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਮਨੁੱਖ ਦਾ ਪਿਆਰ ਪਰਮਾਤਮਾ ਨਾਲ ਬਣ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਉ = ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quienes aman al Señor del Universo,"