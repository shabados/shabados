[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਗਾਧੇ ਅਭੈ, ਆਦਿ ਅਦ੍ਵੈ ਅਬਿਨਾਸੀ ॥"
page = 21

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is Unfathomable, Fearless, Primal, Non-dual and Indestructible."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ ਪਰਮਾਤਮਾ) ਅਤਿ ਗੰਭੀਰ, ਭੈ-ਰਹਿਤ, ਆਦਿ, ਦ੍ਵੈਤ-ਰਹਿਤ ਅਵਿਨਾਸ਼ੀ ਹੈ।"