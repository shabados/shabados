[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਜਨਾ ਕੀ; ਹਰਿ ਹਰਿ ਟੇਕ ॥"
page = 1145
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "have the support of the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਨੂੰ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਹੀ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "have the Support of the Lord, Har, Har."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਸਗਲ ਜਨਾ ਕੀ ਹਰਿ ਹਰਿ ਨਾਮ ਹੀ ਟੇਕ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ (ਦਾ ਨਾਮ) ਹੀ ਸਾਰੇ ਜੀਵਾਂ ਦਾ ਸਹਾਰਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਟੇਕ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Dios hace que se apoye sólo en Él, en el Verdadero Soporte de los Santos."