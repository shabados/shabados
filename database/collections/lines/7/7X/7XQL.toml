[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਭਗਤਿ; ਜੁਗਤਿ ਸਚੁ ਸੋਇ ॥"
page = 364
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The service of the pious, is the true way to that Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤ੍ਰ ਪੁਰਸ਼ਾਂ ਦੀ ਸੇਵਾ ਉਸ ਸੁਆਮੀ ਵੱਲ ਜਾਣ ਦਾ ਸੱਚਾ ਮਾਰਗ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "For the Gurmukh, loving devotional worship is the way to the True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਚੀ ਭਗਤਿ ਸੇ ਜੁਗਤਿ ਹੈਂ ਸੋਈ ਗੁਰਮੁਖਿ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿ ਕੇ ਕੀਤੀ ਹੋਈ ਭਗਤੀ ਹੀ (ਸਹੀ) ਤਰੀਕਾ ਹੈ (ਜਿਸ ਨਾਲ) ਉਹ ਪਰਮਾਤਮਾ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੁ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਪ੍ਰਭੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Para el Gurmukh, la Alabanza Devocional Amorosa es el Camino al Señor."