[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਹ ਬਾਦਸ਼ਾਹੀ ਕਿਸ ਕੰਮ, ਜਿਹੜੀ ਬਿਅਰਥ ਹੋਵੇ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਬਾਦਸ਼ਾਹੀਂ ਚੀਸਤ ਕਾਂ ਨਾਹੱਕ ਬਵਦ ॥੨੦੮॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "All the seven skies are the dust of the feet of Guru Gobind Singh,"