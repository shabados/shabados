[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਮੋਹਿ; ਸਭੋ ਜਗੁ ਬਾਧਾ ॥"
page = 394
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the love of wealth the whole world is bound."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨ-ਪਦਾਰਥ ਦੀ ਮਮਤਾ ਦੇ ਜਰੀਏ ਸਾਰਾ ਜਹਾਨ ਜਕੜਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Attached to Maya, the whole world is in bondage."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਯਾ ਕੇ ਮੋਹ ਮੇਂ ਸਾਰਾ ਸੰਸਾਰ ਬਾਂਧਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਸਾਰਾ ਜਗਤ ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਬੱਝਾ ਪਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਿ = ਮੋਹ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mundo está subyugado por el amor a Maya"