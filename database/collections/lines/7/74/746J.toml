[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How can one praise or slander another,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਕਿਸੇ ਦੀ ਵਡਿਆਈ ਜਾ ਬਦਖੋਈ ਕਿਸ ਤਰ੍ਹਾਂ ਕਰ ਸਕਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How can anyone praise or slander anyone else?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਕੀ ਕੋਈ ਉਸਤਤੀ ਨਿੰਦਾ ਕਿਆ ਕਰੇਗਾ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਖੀ! (ਹੁਣ) ਕਿਸੇ ਦੀ ਕੀਤੀ ਉਸਤਤਿ ਜਾਂ ਨਿੰਦਾ ਦਾ ਹੁਣ ਮੇਰੇ ਉਤੇ ਕੋਈ ਅਸਰ ਨਹੀਂ ਪੈਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਸਤਤਿ = ਸੋਭਾ। ਕਰੇ ਕਿਆ ਕੋਈ = ਕਿਸੇ ਦੀ ਕੀਤੀ ਦਾ ਮੇਰੇ ਉਤੇ ਅਸਰ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cómo puede uno alabar o criticar a otro,"