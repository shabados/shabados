[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਦੀਨ ਅਤੇ ਦੁਨੀਆ ਸਾਡੇ ਉਸ ਪਰੀ-ਚਿਹਰਾ ਦੋਸਤ ਦੀ ਫਾਹੀ ਵਿਚ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਦੀਨੋ ਦੁਨੀਆ ਦਰ ਕਮੰਦਿ ਆਂ ਪਰੀ ਰੁਖ਼ਸਾਰਿ ਮਾ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Both the worlds, this and the next, are (not) equal to or match the price (weight) of just one hair of my friend-mentor, Guru Gobind Singh Ji. (2) (1)"