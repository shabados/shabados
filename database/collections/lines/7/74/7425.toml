[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲੇ ਦੂਖ ਮਿਟਾਈ ॥"
page = 631
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord has dispelled all the ills;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਨੇ ਸਾਰੇ ਦੁੱਖੜੇ ਦੂਰ ਕਰ ਦਿੱਤੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All suffering has been dispelled."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਪੂਰਨ ਦੁਖੋਂ ਕੀ ਪੰਕਤੀ ਮਿਟਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਉਹਨਾਂ ਦੇ ਸਾਰੇ ਦੁੱਖ ਦੂਰ ਕਰ ਦਿੱਤੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲੇ = ਸਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Habita tú también en Él,"