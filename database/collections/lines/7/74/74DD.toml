[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰ ਮੂਰਤਿ ਪੂਰਨ ਬ੍ਰਹਮੁ; ਅਬਿਗਤੁ ਅਬਿਨਾਸੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Guru is replica of the perfect Braham who is unmanifest and indestructible."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨਾਸ਼ ਤੋਂ ਰਹਿਤ ਤੇ ਗਤੀ ਤੋਂ ਰਹਿਤ ਪੂਰਨ ਬ੍ਰਹਮ ਦੀ ਮੂਰਤ (ਵਾਗੂੰ ਹੈ)।"