[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਦਤਿ ਜੈਦੇਉ. ਜੈਦੇਵ ਕਉ ਰੰਮਿਆ; ਬ੍ਰਹਮੁ ਨਿਰਬਾਣੁ ਲਿਵ ਲੀਣੁ ਪਾਇਆ ॥੨॥੧॥"
page = 1106
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Jaidev, I have medicated on the Triumphant, Luminous Lord and becoming absorbed in His love, have obtained the Detached Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੈਦੇਵ ਜੀ ਆਖਦੇ ਹਨ, ਮੈਂ ਵਿਜੋਈ ਪ੍ਰਕਾਸ਼ਵਾਨ ਪ੍ਰਭੂ ਦਾ ਸਿਮਰਨ ਕੀਤਾ ਹੈ ਅਤੇ ਉਸ ਦੀ ਪ੍ਰੀਤ ਅੰਦਰ ਸਮਾ ਕੇ, ਮੈਂ ਨਿਰਲੇਪ ਪ੍ਰਭੂ ਨੂੰ ਪਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Jai Dayv, I meditate and contemplate the Luminous, Triumphant Lord. I am lovingly absorbed in the Nirvaanaa of God. ||2||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਜੈ ਦੇਉ ਜੀ ਕਹਤੇ ਹੈਂ: (ਜੈ) ਉਤਮ (ਦੇਵ) ਪ੍ਰਕਾਸ ਸਰੂਪ ਕੌ ਜਬ ਜਪਣਾ ਕੀਆ ਤਬ ਬ੍ਰਹਮ ਨਿਰਬਾਣ ਪਦ ਪਾਇਆ ਹੈ ਔ ਬ੍ਰਿਤੀ ਤਿਸ ਮੇਂ ਲੀਨ ਹੋ ਗਈ॥੨॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਦੈਵ-ਪ੍ਰਭੂ ਦਾ ਸਿਮਰਨ ਕੀਤਿਆਂ ਉਹ ਵਾਸ਼ਨਾਂ-ਰਹਿਤ ਬੇ-ਪਰਵਾਹ ਪ੍ਰਭੂ ਮਿਲ ਪੈਂਦਾ ਹੈ ॥੨॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਦਤਿ = ਆਖਦਾ ਹੈ। ਜੈਦੇਵ = ਪਰਮਾਤਮਾ, ਉਹ ਦੇਵ ਜਿਸ ਦੀ ਸਦਾ ਜੈ ਹੁੰਦੀ ਹੈ। ਰੰਮਿਆ = ਸਿਮਰਿਆਂ। ਨਿਰਬਾਣੁ = ਵਾਸ਼ਨਾ ਰਹਿਤ। ਲਿਵਲੀਣੁ = ਆਪਣੇ ਆਪ ਵਿਚ ਮਸਤ ਪ੍ਰਭੂ ॥੨॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Yaidev, cuando contemplo el Nombre de Dios, me acerco hasta el Todo Prevaleciente y Desapegado Señor. (2-1)"