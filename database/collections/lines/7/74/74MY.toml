[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਖੀ ਨਾਲਿ ਵਸਾ, ਅਪੁਨੇ ਨਾਹ ਪਿਆਰੇ; ਮੇਰਾ ਮਨੁ ਤਨੁ. ਹਰਿ ਸੰਗਿ ਹਿਲਿਆ ॥"
page = 249
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my mate, I now abide with my Beloved Husband. My Mind and body are domesticated with God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਸਹੇਲੀਏ! ਮੈਂ ਹੁਣ ਆਪਣੇ ਪ੍ਰੀਤਵਾਨ ਪਤੀ ਨਾਲ ਰਹਿੰਦੀ ਹਾਂ। ਮੇਰੀ ਆਤਮਾ ਅਤੇ ਦੇਹਿ ਵਾਹਿਗੁਰੂ ਨਾਲ ਗਿੱਝ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my companions, now I dwell with my Beloved Husband; my mind and body are attuned to the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨ ਸਖੀ! ਅਬ ਮੈਂ ਅਪਨੇ ਪਿਆਰੇ ਪਤੀ ਸਾਥ ਵਸਤੀ ਹੂੰ। ਕਿਉਂਕਿ ਮੇਰਾ ਮਨ ਤਨ ਤਿਸ ਹਰੀ ਸਾਥ ਹਿਲਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਹੇਲੀਏ! (ਸਾਧ ਸੰਗਤਿ ਦੀ ਬਰਕਤਿ ਨਾਲ ਹੁਣ) ਮੈਂ (ਸਦਾ) ਆਪਣੇ ਖਸਮ-ਪ੍ਰਭੂ ਨਾਲ ਵੱਸਦੀ ਹਾਂ, ਮੇਰਾ ਮਨ ਉਸ ਹਰੀ ਨਾਲ ਗਿੱਝ ਗਿਆ ਹੈ, ਮੇਰਾ ਤਨ (ਹਿਰਦਾ) ਉਸ ਹਰੀ ਨਾਲ ਇਕ-ਮਿੱਕ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਖੀ = ਹੇ ਸਹੇਲੀਏ! (ਹੇ ਸਤਿਸੰਗੀ ਸੱਜਣ!)। ਵਸਾ = ਵਸਾਂ, ਮੈਂ ਵੱਸਦੀ ਹਾਂ। ਅਪੁਨੇ ਨਾਹ ਨਾਲਿ = ਆਪਣੇ ਖਸਮ ਨਾਲ। ਸੰਗਿ = ਨਾਲ। ਹਿਲਿਆ = ਗਿੱਝ ਗਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi compañero, busco siempre habitar en mi Esposo; mi cuerpo y mi mente ahora están acostumbrados a Él."