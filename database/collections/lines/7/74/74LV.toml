[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਪਜਤ ਬਿਨਸਤ; ਰੋਵਤ ਰਹਿਬੋ ॥੧॥ ਰਹਾਉ ॥"
page = 325
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he continues coming, going and bemoaning. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਉਂਦਾ ਜਾਂਦਾ ਅਤੇ ਵਿਰਲਾਪ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the person continues coming and going in reincarnation, crying out in pain. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਉ ਜਨਮਤਾ ਮਰਤਾ ਰੋਤਾ ਹੀ ਰਹੇਗਾ॥੧॥ ਰਹਾਉ ॥☬ਜੇ ਕਹੇ ਧਨ ਕਰ ਹਮਾਰੀ ਬਡਾਈ ਹੈ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦ ਤਕ ਜੰਮਦੇ ਮਰਦੇ ਤੇ (ਇਸੇ ਦੁੱਖ ਵਿਚ) ਰੋਂਦੇ ਰਹੋਗੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਪਜਤ = ਜੰਮਦੇ। ਬਿਨਸਤ = ਮਰਦੇ। ਰੋਵਤ = ਰੋਂਦੇ। ਰਹਿਬੋ = ਰਹੋਗੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "tanto cuanto uno va a ir  y a regresar y además a lamentarse siempre. (1-Pausa)"