[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰੈ ਸਤਿਗੁਰਿ. ਦੀਆ ਦਿਖਾਇ ॥"
page = 663
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Perfect Guru has shown it to me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਾਂ ਨੇ ਇਹ ਮੈਨੂੰ ਵਿਖਾਲ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Perfect True Guru has revealed it to me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਸਤਿਗੁਰੋਂ ਨੇ ਗੁਰਮੁਖੋਂ ਕੋ ਵਾ ਹਮ ਕੋ ਸੋ ਨਾਮ ਧਨ ਦਿਖਾਇ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਧਨ ਦੀ ਇਹ ਸਿਫ਼ਤਿ ਮੈਨੂੰ) ਪੂਰੇ ਗੁਰੂ ਨੇ ਵਿਖਾ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰਿ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es por la Gracia el Guru Perfecto que he podido ver este Tesoro."