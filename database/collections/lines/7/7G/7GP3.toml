data = "ਅਸ ਰਣ ਕੀਨਾ ॥੮੧੭॥"
page = 285

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They were not even turning around to see Ram, and being helpless they fled away to whichever side they could.817."

