data = "(ਆਪਣੀ) ਸੌਂਕਣ ਨੂੰ ਆਪਣੇ ਹੱਥਾਂ ਨਾਲ ਮਾਰ ਕੇ ਅਤੇ ਰਾਜੇ ਨੂੰ ਵਿਖਾ ਕੇ"