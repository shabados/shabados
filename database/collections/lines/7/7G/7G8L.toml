data = "ਸਵਤਿ ਮਾਰਿ ਨਿਜੁ ਕਰਨ ਸੌ; ਔਰ ਨ੍ਰਿਪਹਿ ਦਿਖਰਾਇ ॥"
page = 985

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "By killing the co-wife, and showing her to the Raja,"

