data = "ਤ੍ਰਿਣ ਕਾਸਟ ਘਿਰਤ ਅਸੇਖ ॥"
page = 709

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then with many grass-blades, the faggots alongwith ghee (clarified butter),"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਵਿਚ) ਬਹੁਤ ਸਾਰੇ ਕੱਖ, ਲਕੜਾਂ ਅਤੇ ਘਿਓ (ਪਾਇਆ ਹੋਇਆ ਸੀ)।"