[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਮੁਖ ਮਾਗੈ ਵਹ ਬਰੁ ਪਾਵੈ ॥੧੬੬॥"
page = 626

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "None was afflicted with suffering and hunger and whosoever asked with suffering and hunger and whosoever asked for anything, he obtained the same.166."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੂੰਹੋਂ ਜੋ ਕੁਝ ਵੀ ਕੋਈ ਮੰਗਦਾ ਸੀ, ਉਹੀ ਵਰ ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦਾ ਸੀ ॥੧੬੬॥"