[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੀ ਭਗਤਿ; ਫਲ ਦਾਤੀ ॥"
page = 628
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's meditation is the grantor of boons."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦੀ ਬੰਦਗੀ ਮੁਰਾਦਾਂ ਬਖਸ਼ਣਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Devotional worship to the Lord is what gives rewards."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਕੀ ਭਗਤੀ ਸਰਬ ਫਲੋਂ ਕੀ ਦਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਸਾਰੇ ਫਲ ਦੇਣ ਵਾਲੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫਲ ਦਾਤੀ = ਫਲ ਦੇਣ ਵਾਲੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Muchas son las recompensas de ser el Devoto del Señor."