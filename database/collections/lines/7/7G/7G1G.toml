[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਤੁ ਜਿਤੁ ਲਾਇਆ; ਤਿਤੁ ਤਿਤੁ ਕੋ ਲਾਗੈ ॥੩॥"
page = 743
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To whatsoever the Lord attaches any one, to that he is attached."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਿਸੇ ਨਾਲ ਸੁਆਮੀ ਕਿਸੇ ਨਾਲ ਜੋੜਦਾ ਹੈ ਉਸ ਦੇ ਨਾਲ ਹੀ ਉਹ ਜੁੜ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As He attaches us, so are we attached. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਤ ਜਿਤ ਕਰਮ ਮੇਂ ਜਿਸ ਜਿਸ ਕੋ ਲਗਾਇਆ ਹੈ, ਤਿਸ ਤਿਸ ਕਰਮ ਮੇਂ ਸੋ ਲਗੇ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਜਿਸ ਕੰਮ ਵਿਚ ਪਰਮਾਤਮਾ ਲਾਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਤੁ = ਜਿਸ ਪਾਸੇ। ਕੋ = ਕੋਈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y por la razón que sea, que el hombre busque a Dios, Lo encontrará y su deseo será cumplido. (3)"