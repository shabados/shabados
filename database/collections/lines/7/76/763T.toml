[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਬੀਹਾ. ਭਿੰਨੀ ਰੈਣਿ ਬੋਲਿਆ; ਸਹਜੇ ਸਚਿ ਸੁਭਾਇ ॥"
page = 1283
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In a dewy night, the sparrow hawk, instinctively utters the True Name, with love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿੰਨੀ ਰਾਤ੍ਰੀ ਅੰਦਰ ਪਪੀਹਾ ਸੁਭਾਵਕ ਹੀ ਪਿਆਰ ਨਾਲ ਸੰਚੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The night is wet with dew; the rainbird sings the True Name with intuitive ease."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਚਾਤ੍ਰਿਕ ਜੀਵ (ਭਿੰਨੀ) ਸਨਿਗਧ ਅਵਸਥਾ ਰਾਤ੍ਰੀ ਮੇਂ ਸਹਿਜ ਸੁਭਾਇ ਹੀ ਸਚ ਨਾਮੁ ਬੋਲਿਆ ਹੈ, ਸੋ ਕਹਿਤਾ ਹੈ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਦੋਂ) (ਜੀਵ-) ਪਪੀਹਾ ਅੰਮ੍ਰਿਤ ਵੇਲੇ ਅਡੋਲ ਅਵਸਥਾ ਵਿਚ ਪ੍ਰਭੂ-ਚਰਨਾਂ ਵਿਚ ਜੁੜ ਕੇ (ਜੁੜੇ) ਮਨ ਦੀ ਮੌਜ ਨਾਲ ਅਰਜ਼ੋਈ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਿੰਨੀ ਰੈਣਿ = (ਤ੍ਰੇਲ-) ਭਿੱਜੀ ਰਾਤ ਵੇਲੇ, ਅੰਮ੍ਰਿਤ ਵੇਲੇ। ਸਹਜੇ = ਅਡੋਲ ਅਵਸਥਾ ਵਿਚ। ਸਚਿ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਵਿਚ (ਜੁੜ ਕੇ)। ਸੁਭਾਇ = ਸੁਭਾਵਿਕ ਹੀ, ਜੁੜੇ-ਮਨ ਦੀ ਮੌਜ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La noche está cubierta de rocío, el Chatvik canta el Nombre Verdadero con facilidad e intuición."