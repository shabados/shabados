[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘੜੀਐ ਸਬਦੁ; ਸਚੀ ਟਕਸਾਲ ॥"
page = 8
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thus in the true mint the Divine word is fashioned."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਸੱਚੀ ਸਿਕਸ਼ਾਲਾ ਅੰਦਰ ਰੱਬੀ ਕਲਾਮ ਰਚੀ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and mint the True Coin of the Shabad, the Word of God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਸਚੀ ਟਕਸਾਲ ਸਾਧ ਸੰਗਤ ਮੇ ਜੀਵ ਹੀ (ਸਬਦੁ) ਬ੍ਰਹਮ ਰੂਪੁ ਘੜਾ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ ਇਹੋ ਜਿਹੀ ਹੀ) ਸੱਚੀ ਟਕਸਾਲ ਵਿਚ (ਗੁਰੂ ਦਾ) ਸ਼ਬਦ ਘੜਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘੜੀਐ = ਘੜੀਦਾ ਹੈ, ਘੜਿਆ ਜਾਂਦਾ ਹੈ। ਘੜੀਐ ਸਬਦੁ = ਸ਼ਬਦ ਘੜਿਆ ਜਾਂਦਾ ਹੈ। ਸੱਚੀ ਟਕਸਾਲ = ਇਸ ਉੱਪਰ-ਦੱਸੀ ਹੋਈ ਸੱਚੀ ਟਕਸਾਲ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y acuña la Verdadera Moneda del Shabd, la Palabra de Dios."