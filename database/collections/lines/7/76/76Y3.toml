[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਟਟਾ; ਬਿਕਟ ਘਾਟ. ਘਟ ਮਾਹੀ ॥"
page = 341
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "T-The difficult way to God is within man's mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਟ-ਵਾਹਿਗੁਰੂ ਦਾ ਔਖਾ ਮਾਰਗ ਇਨਸਾਨ ਦੇ ਮਨ ਵਿੱਚ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "TATTA: It is such a difficult path, to find Him within your own heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਟਕਾਰ ਅਖਰ ਦੁਆਰਾ ਕਹਤੇ ਹੈਂ: ਤੋ ਘਟ ਮੇਂ ਹੀ ਪਰੰਤੂ ਅਸਥਾਨ (ਬਿਕਟ) ਕਠਨ ਹੈ, ਭਾਵ ਸੇ ਵਾਸ਼ਨਾ ਕਾ ਤਿਆਗ ਰੂਪ ਕਠਨਤਾ ਹੈ; ਵਾ ਪੰਚ ਕੋਸ ਰੂਪ ਕਠਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਦੇ ਮਹਿਲ ਵਿਚ ਅਪੜਾਣ ਵਾਲਾ) ਔਖਾ ਪੱਤਣ ਹੈ (ਪਰ ਉਹ ਪੱਤਣ) ਹਿਰਦੇ ਵਿਚ ਹੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਟਟਾ = ਅੱਖਰ ਟੈਂਕਾ। ਬਿਕਟ = {ਸੰ: ਵਿਕਟ} ਬਿਖੜਾ, ਔਖਾ। ਘਾਟ = ਪੱਤਣ। ਘਟ ਮਾਹੀ = ਹਿਰਦੇ ਵਿਚ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ta tta El sendero que parece tan traicionero está dentro del corazón."