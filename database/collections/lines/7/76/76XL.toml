[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਖਟ ਦਰਸਨ ਕੌ ਮਾਨਈ; ਰਾਖਤ ਸਭ ਕੋ ਭਾਵ ॥੧॥"
page = 931

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He believed in six Shastras and loved every body.(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਛੇ ਸ਼ਾਸਤ੍ਰਾਂ ਨੂੰ ਮੰਨਦਾ ਸੀ ਅਤੇ ਸਭ ਨਾਲ ਪ੍ਰੇਮ ਰਖਦਾ ਸੀ ॥੧॥"