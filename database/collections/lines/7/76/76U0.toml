[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਨ ਕਮਲ ਬਸਿਆ ਰਿਦ ਭੀਤਰਿ; ਸਾਸਿ ਗਿਰਾਸਿ ਉਚਾਰਿਓ ॥"
page = 534
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lord's lotus feet abide within his mind, and with his every breath and morsel, he repeats Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਦੇ ਕੰਵਲ ਪੈਰ ਉਸ ਦੇ ਹਿਰਦੇ ਅੰਦਰ ਵਸਦੇ ਹਨ ਅਤੇ ਆਪਣੇ ਹਰ ਸਾਹ ਅਤੇ ਬੁਰਕੀ ਨਾਲ ਉਹ ਸਾਈਂ ਦਾ ਨਾਮ ਜੱਪਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lotus Feet of the Lord abide within his heart, and with every breath and morsel of food, he chants the Lord's Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੇ ਹ੍ਰਿਦ੍ਯ ਮੇਂ ਹਰੀ ਕੇ ਚਰਨ ਕਮਲੋਂ ਕਾ ਪ੍ਰੇਮ ਬਸਿਆ ਹੈ ਔਰ ਸਾਸ ਗਿਰਾਸ ਹਰਿ ਕਾ ਉਚਾਰਨ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੇਵਕ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪਰਮਾਤਮਾ ਦੇ ਸੋਹਣੇ ਚਰਨ ਸਦਾ ਵੱਸਦੇ ਰਹਿੰਦੇ ਹਨ, ਸੇਵਕ ਹਰੇਕ ਸਾਹ ਨਾਲ ਹਰੇਕ ਗਿਰਾਹੀ ਨਾਲ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਿਦ = ਹਿਰਦਾ। ਸਾਸਿ ਗਿਰਾਸਿ = ਹਰੇਕ ਸਾਹ ਤੇ ਗਿਰਾਹੀ ਦੇ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él alaba en su corazón el Loto de los Pies del Señor. En cada respiración y bocado de alimento canta el Nombre del Señor."