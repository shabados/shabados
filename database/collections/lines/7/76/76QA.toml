[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵੈ ਨਾਹੀ ਕਛੂ ਰੀਤਿ ॥"
page = 1182
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I know not the way to meet with Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਤੇਰੇ ਨਾਲ ਮਿਲਣ ਦਾ ਮਾਰਗ ਨਹੀਂ ਆਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I do not know the way to meet You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਜਪ ਤਪਾਦਿਕੋਂ ਕੀ ਕੋਈ ਕਛੁ ਰੀਤੀ ਨਹੀਂ ਆਵਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਧਾਰਮਿਕ ਰੀਤ-ਰਸਮ ਕਰਨੀ ਭੀ ਮੈਨੂੰ ਨਹੀਂ ਆਉਂਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੀਤਿ = (ਧਾਰਮਿਕ) ਰਸਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ni tampoco he realizado buenas acciones,"