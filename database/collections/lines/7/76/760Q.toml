[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਨੀ ਮੈ ਬੇਖਰਚਿ ਹੌਂ ਕਛੁ ਮੁਹਿ ਦੇਹੁ ਪਠਾਇ ॥੯॥"
page = 915

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I have no money to spend, please send me some.(9)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਹੇ ਰਾਣੀ! ਮੈਂ ਖ਼ਰਚੋਂ ਥੁੜ ਗਿਆ ਹਾਂ, ਮੈਨੂੰ ਕੁਝ (ਧਨ) ਭੇਜ ਦੇ ॥੯॥"