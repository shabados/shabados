[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤ ਕੀ ਬੇਲਾ; ਲਏ ਛਡਾਈ ॥੧॥"
page = 895
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord shall deliver thee at the last moment."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਖੀਰ ਦੇ ਵੇਲੇ ਪ੍ਰਭੂ ਤੈਨੂੰ ਬੰਦਖਲਾਸ ਕਰ ਦੇਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "At the very last moment, He will save you. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਪ੍ਰਾਣ ਅੰਤ ਕੀ (ਬੇਲਾ) ਬੇਰ ਤੇਰੇ ਕੋ ਜਮਾਂ ਤੇ ਛੁਡਾਈ ਲਏ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ) ਤੈਨੂੰ ਅਖ਼ੀਰ ਵੇਲੇ ਭੀ (ਮਾਇਆ ਦੇ ਮੋਹ ਦੇ ਬੰਧਨਾਂ ਤੋਂ) ਛਡਾ ਲਏਗੀ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੇਲਾ = ਵੇਲੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y cuando dejes este mundo te vuelvas Eterno.(1)"