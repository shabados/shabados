data = "ਬਹੁਰਿ; ਨ ਤ੍ਰਿਸਨਾ ਲਾਗੈ ਆਇ ॥"
page = 281
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and he feels not thirst, again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੁੜ ਉਸ ਨੂੰ ਤਰੇਹ ਨਹੀਂ ਵਿਆਪਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and we suffer from thirst no longer."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਕਿਸੀ ਪਦਾਰਥ ਕੀ ਤ੍ਰਿਸਨਾ ਆਇਕਰ ਨਹੀਂ ਲਾਗਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
