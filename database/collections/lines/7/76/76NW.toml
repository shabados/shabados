[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੰਡ ਪ੍ਰਚੰਡ ਅਖੰਡ ਲੀਏ ਕਰਿ; ਕਾਲਿਕਾ ਕਾਲ ਹੀ ਜਿਉ ਅਰਜੀ ਹੈ ॥੭੫॥"
page = 83

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Highly glorious Chandi, in her blanced state, creating Kalika like death, spoke thus.75.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਚੰਡ ਤਿਖੀ ਅਖੰਡ (ਤਲਵਾਰ) ਹੱਥ ਵਿਚ ਲੈ ਕੇ ਕਾਲਕਾ ਕਾਲ ਵਾਂਗ ਪ੍ਰਗਟ ਹੋਈ ਹੈ ॥੭੫॥"