[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਬ ਮੋਹਿ; ਨਾਚਨੋ ਨ ਆਵੈ ॥"
page = 483
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Now I know not how to dance (at the beck and call of mammon)."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਮੈਨੂੰ (ਮਾਇਆ ਅਧੀਨ) ਨਿਰਤਕਾਰੀ ਕਰਨੀ ਨਹੀਂ ਆਉਂਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Now, I no longer dance to the tune."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਮੁਝ ਕੋ ਚੋਰਾਸੀ ਲਾਖ ਜੋਨ ਮੇਂ ਭ੍ਰਮਨ ਰੂਪ ਨ੍ਰਿਤ੍ਯ ਕਰਨਾ ਨਹੀਂ ਆਉਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਦੀ ਕਿਰਪਾ ਨਾਲ) ਹੁਣ ਮੈਂ (ਮਾਇਆ ਦੇ ਹੱਥਾਂ ਤੇ) ਨੱਚਣੋਂ ਹਟ ਗਿਆ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਿ = ਮੈਨੂੰ। ਨਾਚਨੋ = ਮਾਇਆ ਦੇ ਹੱਥਾਂ ਉੱਤੇ ਨੱਚਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora ya no puedo bailar más al son de la música del mundo,"