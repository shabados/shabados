[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੇ ਮਨ; ਤੂ ਭੀ ਭਜੁ ਗੋਬਿੰਦ ॥੨॥"
page = 1192
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my mind, thou too meditate on the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨੂਏ! ਤੂੰ ਭੀ ਆਪਣੇ ਸਾਹਿਬ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, you too must meditate and vibrate on the Lord of the Universe. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ ਭੀ ਗੋਬਿੰਦ ਕੋ ਭਜੁ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਮਨ! ਤੂੰ ਭੀ ਪਰਮਾਤਮਾ ਦਾ ਭਜਨ ਕਰਿਆ ਕਰ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਜੁ = ਜਪਿਆ ਕਰ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "contempla entonces tú también a Dios, oh mi mente. (2)"