[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਿਰਿਯੋ ਮੂਰਛਨਾ ਧਰਨਿ; ਨ ਨੈਕ ਸੰਭਾਰਿਯੋ ॥"
page = 1009

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He threw one arrow towards Arjan; he could not balance and becameunconscious."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਜ਼ਰਾ ਵੀ ਸੰਭਲ ਨਾ ਸਕਿਆ ਅਤੇ ਮੂਰਛਿਤ ਹੋ ਕੇ ਧਰਤੀ ਤੇ ਡਿਗ ਪਿਆ।"