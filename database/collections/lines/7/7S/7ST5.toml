[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਟੂਟੀ ਗਾਢਨਹਾਰ ਗੋੁਪਾਲ ॥"
page = 282
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The world -cherisher is the Mender of the broken."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ੍ਰਿਸ਼ਟੀ ਦਾ ਪਾਲਣਹਾਰ ਟੁੱਟਿਆ ਨੂੰ ਜੋੜਨ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord of the World is the Mender of the broken."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਜੀਵ ਕੀ ਟੂਟੀ ਹੋਈ ਪ੍ਰੀਤ ਵਾ ਅਵਸਥਾ ਕੌ (ਗਾਂਢਨ) ਜੋੜਨੇ ਹਾਰਾ ਗੋਪਾਲ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੀਵਾਂ ਦੀ ਦਿਲ ਦੀ) ਟੁੱਟੀ ਹੋਈ (ਤਾਰ) ਨੂੰ (ਆਪਣੇ ਨਾਲ) ਗੰਢਣ ਵਾਲਾ ਗੋਪਾਲ ਪ੍ਰਭੂ ਆਪ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਪਾਲ = {ਨੋਟ: ਅੱਖਰ 'ਗ' ਨਾਲ ਦੋ 'ਲਗਾਂ' ਵਰਤੀਆਂ ਗਈਆਂ ਹਨ। ਅਸਲੀ ਲਫ਼ਜ਼ 'ਗੋਪਾਲ' ਹੈ, ਪਰ ਛੰਦ ਦੀ ਚਾਲ ਤਾਂ ਹੀ ਪੂਰੀ ਰਹਿ ਸਕਦੀ ਹੈ ਜੇ 'ਗੁਰੂ' ਮਾਤ੍ਰਾ' (ੋ) ਦੇ ਥਾਂ 'ਲਘੂ' ਮਾਤ੍ਰਾ (ੁ) ਵਰਤੀ ਜਾਏ। ਸੋ, ਪਾਠ ਵਿਚ ਲਫ਼ਜ਼ 'ਗੁਪਾਲ' ਪੜ੍ਹਨਾ ਹੈ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor es Quien sana las heridas de la humanidad entera;"