[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਪ੍ਰਭੁ ਧਿਆਇਆ. ਤਿਨਿ ਸੁਖੁ ਪਾਇਆ; ਵਡਭਾਗੀ ਦਰਸਨੁ ਪਾਈਐ ॥"
page = 777
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who contemplate their Lord, obtain peace. By great good fortune their vision is obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਪਣੇ ਸਾਹਿਬ ਦਾ ਆਰਾਧਨ ਕਰਦੇ ਹਨ, ਉਹ ਆਰਾਮ ਪਾਉਂਦੇ ਹਨ। ਪਰਮ ਚੰਗੇ ਨਸੀਬਾਂ ਦੁਆਰਾ ਉਨ੍ਹਾਂ ਦਾ ਦੀਦਾਰ ਪਰਾਪਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who meditate on God find peace. By great good fortune, the Blessed Vision of their Darshan is obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨਾਂ ਨੇ ਪ੍ਰਭੂ ਕੋ ਧਯਾਯਾ ਹੈ ਤਿਨੋਂ ਨੇ ਸੁਖ ਪਾਯਾ ਹੈ ਔਰ ਤਿਨ ਕਾ ਦਰਸਨ ਵੱਡੇ ਭਾਗੋਂ ਕਰ ਕੇ ਪਾਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ (ਮਨੁੱਖ) ਨੇ ਪਰਮਾਤਮਾ ਦਾ ਸਿਮਰਨ ਕੀਤਾ ਹੈ, ਉਸ ਨੇ ਆਤਮਕ ਆਨੰਦ ਪ੍ਰਾਪਤ ਕਰ ਲਿਆ ਹੈ। ਵੱਡੇ ਭਾਗਾਂ ਨਾਲ (ਪਰਮਾਤਮਾ ਦਾ) ਦਰਸਨ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਮਨੁੱਖ) ਨੇ। ਤਿਨਿ = ਉਸ ਨੇ। ਪਾਈਐ = ਪ੍ਰਾਪਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los que viven en Dios logran el Éxtasis y es por una buena fortuna que uno tiene su Visión."