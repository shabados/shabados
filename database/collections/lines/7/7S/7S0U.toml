[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕੈ ਦੂਖਨਿ; ਸਭੁ ਕੋ ਛਲੈ ॥"
page = 279
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By slandering the saints, the mortal deceives everyone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਦੀ ਨਿੰਦਾ ਕਰਨ ਵਾਲਾ ਹਰ ਇਕਸ ਨਾਲ ਠੱਗੀ ਠੋਰੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Slandering the Saints, one tries to deceive everyone."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੇ ਦੂਖਣ ਕਰ ਕੇ ਸਭ ਵਿਕਾਰ ਇਸ ਕੋ ਛਲ ਲੇਤੇ ਹੈਂ, ਵਾ ਏਹ ਸਭ ਕਿਸੀ ਕੋ ਛਲਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ, ਹਰੇਕ ਮਨੁੱਖ ਨੂੰ ਧੋਖਾ ਦੇਂਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭੁ ਕੋ = ਹਰੇਕ ਪ੍ਰਾਣੀ ਨੂੰ। ਛਲੈ = ਧੋਖਾ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Calumniando a los Santos uno engaña a todos."