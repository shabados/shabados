[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਬਿਗਤਿ ਗਤਿ ਅਸਗਾਹੁ, ਨ ਅਲਖੁ ਲਖਾਈਐ ॥੧੯॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The dynamics of the Lord is unmanifest, deep and unfathomable; it cannot be known."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਉਸਦੀ) ਗਤਿ (ਗ੍ਯਾਨ ਅਥਵਾ ਪ੍ਰਾਪਤੀ ਕਠਨ ਅਤੇ ਅਸਗਾਹ ਹੈ, (ਉਹ ਅਲਖ ਹੈ ਨਹੀਂ ਲਖਿਆ ਜਾਂਦਾ।"