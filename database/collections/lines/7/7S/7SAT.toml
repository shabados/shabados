[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਤਨੁ ਰਤਾ; ਰਾਮ ਪਿਆਰੇ ॥"
page = 108
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My soul and body are dyed with the beloved pervading God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਆਤਮਾ ਤੇ ਦੇਹਿ ਪ੍ਰੀਤਮ ਵਿਆਪਕ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਲ ਰੰਗੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind and body are imbued with love for the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕਾ ਮਨ ਤਨ ਰਾਮ ਪਿਆਰੇ ਸੇ ਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜੇ ਤੂੰ ਇਹ ਲੋੜਦਾ ਹੈਂ ਕਿ ਤੇਰਾ) ਮਨ (ਤੇਰਾ) ਸਰੀਰ ਪਿਆਰੇ ਪ੍ਰਭੂ (ਦੇ ਪ੍ਰੇਮ-ਰੰਗ) ਵਿਚ ਰੰਗਿਆ ਰਹੇ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Deja que tu mente y cuerpo estén imbuidos en el Amor del Señor,"