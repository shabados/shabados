[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਸਕਲ ਤੁਪਕ ਕੇ ਨਾਮ; ਪ੍ਰਬੀਨ ਪ੍ਰਮਾਨੀਐ ॥੮੯੯॥"
page = 769

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Utter firstly the word “Jalvaasanani”, then add “Jaachar-naath-shatru” and in this way know all the names of Tupak.899."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਾਰੇ ਪ੍ਰਬੀਨ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝਣ ॥੮੯੯॥"