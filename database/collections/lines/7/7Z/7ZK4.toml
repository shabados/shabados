[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕਾ ਦੋਖੀ; ਮਹਾ ਅਹੰਕਾਰੀ ॥"
page = 280
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints' slanderer, is exceedingly proud."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਦਾ ਨਿੰਦਕ ਵੱਡਾ ਮਗਰੂਰ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slanderer of the Saint is totally egocentric."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਕਾ ਦੋਖੀ ਮਹਾਂ ਹੰਕਾਰੀ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਦੀ ਨਿੰਦਿਆ ਕਰਨ ਵਾਲਾ ਬੜਾ ਆਕੜ-ਖਾਨ ਬਣ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vive absorto en su propio ego"