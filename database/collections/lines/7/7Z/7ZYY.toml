type = "primary"
data = "ਤਬ ਧਰਤ ਬਿਸਨ ਰੁਦ੍ਰਾਵਤਾਰ ॥੭॥"
page = 178

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then she goes and shouts loudly in the milk-ocean and the Rudra incarnation of Vishnu is manifested.7."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਵਿਸ਼ਣੂ ਰੁਦਰ ਅਵਤਾਰ ਧਾਰਨ ਕਰਦਾ ਹੈ ॥੭॥"