[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਖੁਲੇ ਖੱਗ ਖਤ੍ਰੀ ਅਭੂਤੰ ਭਯਾਣੰ ॥"
page = 53

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The youthful warriors are moving in this great war, with naked swords the fighters look wonderfully terrible."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਿਆਨ ਵਿਚੋਂ ਤਲਵਾਰਾਂ ਕਢ ਕੇ ਸੂਰਮੇ ਅਦੁੱਤੀ ਅਤੇ ਭਿਆਨਕ (ਰੂਪ ਵਾਲੇ) ਹੋ ਗਏ ਹਨ।"