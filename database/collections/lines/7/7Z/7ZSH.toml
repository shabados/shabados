[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਦਰੁ ਸੀਤਲੁ ਸਾਂਤਿ ਹੈ; ਹਿਰਦੈ ਸਦਾ ਸੁਖੁ ਹੋਇ ॥"
page = 851
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then there is coolness and calmness within the mortal and his mind is ever at peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਪ੍ਰਾਣੀ ਦੇ ਅੰਦਰ ਠੰਢ-ਚੈਨ ਹੁੰਦੀ ਹੈ ਅਤੇ ਉਸ ਦਾ ਮਨ ਹਮੇਸ਼ਾਂ ਸੁਖੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It brings a cooling, soothing tranquility deep within the heart, and eternal peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਨਾਮ ਕਰ ਅੰਤਸਕਰਨ ਕੇ ਅੰਦਰ ਸਾਂਤੀ ਕਰ ਸੀਤਲਤਾ ਹੋਤੀ ਹੈ ਔਰ ਹਿਰਦੇ ਮੇਂ ਸਦਾ ਸੁਖ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਮ ਦੀ ਬਰਕਤ ਨਾਲ ਮਨੁੱਖ ਦਾ) ਮਨ ਠੰਢਾ-ਠਾਰ ਹੋ ਜਾਂਦਾ ਹੈ (ਮਨੁੱਖ ਦੇ) ਹਿਰਦੇ ਵਿਚ ਸਦਾ ਆਨੰਦ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਦਰੁ = ਮਨ, ਹਿਰਦਾ। ਹਿਰਦੈ = ਹਿਰਦੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nuestro interior se refresca, nos sentimos acogidos y nuestro corazón está en Paz."