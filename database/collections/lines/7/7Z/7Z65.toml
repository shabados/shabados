[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦਾਤਿ ਲੁਭਾਇ, ਵਿਸਾਰਨਿ ਦਾਤਾ ॥੧੩॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "All got engrossed in the gifts of that Lord and that bestower has been forgotten."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਦਾਤ (ਮਾਇਆ) ਵਿਚ ਲੁਭਾਇਮਾਨ ਹੋਕੇ ਦਾਤੇ ਨੂੰ ਵਿਸਾਰ ਦੇਂਦੇ ਹਨ।"