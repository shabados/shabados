[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦਾ ਸਦਾ; ਜਾਈ ਬਲਿਹਾਰੀ ॥"
page = 563
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever and forever I am a sacrifice unto Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਮੇਸ਼ਾਂ! ਹਮੇਸ਼ਾਂ! ਮੈਂ ਤੇਰੇ ਉਤੋਂ ਕੁਰਬਾਨ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forever and ever, I am a sacrifice to You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਨਿਤ ਨਿਤ ਆਪ ਕੇ ਬਲਿਹਾਰੇ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਮੈਂ ਸਦਾ ਹੀ ਸਦਾ ਹੀ ਤੈਥੋਂ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਈ = ਜਾਈਂ, ਮੈਂ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por siempre y para siempre ofrezco mi ser en sacrificio a Ti,"