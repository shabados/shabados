[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਹੀ ਨਾਮ ਠਾਮ ਅਨਭਵ ਅਭੇਖ ॥"
page = 642

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He has no form or line, no attachment or detachment"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਦਾ) ਕੋਈ ਨਾਂ ਅਤੇ ਥਾਂ ਨਹੀਂ ਹੈ ਅਤੇ ਜੋ ਸੁਤਹ ਪ੍ਰਮਾਣ ਅਤੇ ਭੇਖ ਰਹਿਤ ਹੈ।"