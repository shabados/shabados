data = "ਇਨ ਮੈ ਉਨ ਮੈ ਇਕ ਭੇਦੁ ਰਹਿਓ ॥੧੪॥੩੦੪॥"
page = 153

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There is one difference between the former and the latter.14.304."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "\"ਇਨ੍ਹਾਂ (ਬ੍ਰਾਹਮਣਾਂ) ਅਤੇ ਉਨ੍ਹਾਂ (ਰਾਜਕੁਮਾਰਾਂ) ਵਿਚ (ਅਜੇ) ਇਕ ਭੇਦ ਰਹਿੰਦਾ ਹੈ\" ॥੧੪॥੩੦੪॥"