[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੀ ਤੂੰਹੈ ਸਾਲਾਹਣਾ; ਆਖਣ. ਲਹੈ ਨ ਚਾਉ ॥੧॥"
page = 142
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Even then, I would admire Thee, O Lord! and my yearning to utter Thine praises shall not abate."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਭੀ ਮੈਂ ਤੇਰਾ ਜੰਸ ਹੀ ਕਰਾਂਗਾ, ਹੇ ਸੁਆਮੀ! ਅਤੇ ਤੇਰੀ ਕੀਰਤੀ ਆਲਾਪਣ ਦੀ ਮੇਰੀ ਉਮੰਗ ਮੁੱਕੇਗੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "-even then, I would worship and adore You, and my longing to chant Your Praises would not decrease. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੌ ਭੀ ਤੇਰਾ ਸਲਾਹੁਣਾ ਕਰੀਏ ਔਰ ਜਸ ਉਚਾਰਨ ਕਰਤੇ ਹੂਏ ਚਾਉ ਨ ਲਹੈ, ਭਾਵ ਇਹ ਬਾਰੰਬਾਰ ਸਲਾਹੁਤਾ ਰਹੂੰ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਭੀ (ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਇਹਨਾਂ ਪਦਾਰਥਾਂ ਵਿਚ ਨਾਹ ਫਸਾਂ ਤੇ) ਤੇਰੀ ਹੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਾਂ, ਤੇਰੀ ਵਡਿਆਈ ਕਰਨ ਦਾ ਮੇਰਾ ਚਾਉ ਮੁੱਕ ਨਾਹ ਜਾਏ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਖਣ ਚਾਉ = ਤੇਰੀ ਵਡਿਆਈ ਕਰਨ ਦਾ ਚਾਉ। ਤੂੰ ਹੈ = ਤੈਨੂੰ ਹੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aun así yo Te alabaría, oh Señor, y mi deseo por recitar Tu Alabanza no se acabaría jamás.(1)"