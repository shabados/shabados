[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਧਨ ਕਉ. ਤੁਮ ਦੇਵਹੁ ਧਨਾ ॥"
page = 1146
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou bless the poor with wealth, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਗਰੀਬਾਂ ਨੂੰ ਦੌਲਤ ਬਖਸ਼ਦਾ ਹੈ, ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You bless the poor with wealth, O Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਸੇ ਰਹਿਤ ਨਿਰਧਨੋਂ ਕੋ ਤੁਮ ਹੀ ਨਾਮ ਕਾ ਧਨ ਦੇਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ (ਜਿਸ) ਕੰਗਾਲ ਨੂੰ (ਆਪਣਾ ਨਾਮ-) ਧਨ ਦੇਂਦਾ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਧਨ ਕਉ = ਕੰਗਾਲ ਨੂੰ। ਦੇਵਹੁ = ਤੂੰ ਦੇਂਦਾ ਹੈਂ। ਧਨਾ = ਨਾਮ-ਧਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, tú bendices al pobre con Riquezas,"