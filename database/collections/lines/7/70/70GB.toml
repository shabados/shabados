[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਇਆ ਧਾਰੀ ਤਿਨਿ ਸਿਰਜਨਹਾਰੇ ॥"
page = 103
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That Creator has showered His benediction,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਕਰਤਾਰ ਨੇ ਆਪਣੀ ਰਹਿਮਤ ਨਿਛਾਵਰ ਕੀਤੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator has showered His Kindness;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਿਰਜਨਹਾਰ! ਜਿਸ ਤੈਨੇ ਛੋਟੇ ਔਰ ਬਡੇ ਸੰਪੂਰਨ ਜੀਵ ਪ੍ਰਤਿਪਾਲੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਸਿਰਜਨਹਾਰ ਪ੍ਰਭੂ ਨੇ (ਮਿਹਰ ਕੀਤੀ) (ਤੇ ਗੁਰੂ ਘੱਲਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਨਿ = ਉਸ ਨੇ। ਸਿਰਜਨਹਾਰੇ = ਸਿਰਜਨਹਾਰਿ, ਸਿਰਜਨਹਾਰ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Creador ha vertido Su Gracia sobre mí,"