[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਨ੍ਰਹ ਬਡੋ ਸਠ ਅਉ ਮੁਸਲੀ; ਹਮਹੂੰ ਤੁਮਹੂੰ ਸਠ ਸੇ ਲਖ ਪਾਏ ॥"
page = 323

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Krishna and Balram are very foolish do you consider all of us as fools?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਾਨ੍ਹ ਅਤੇ ਬਲਰਾਮ ਦੋਵੇਂ ਵੱਡੇ ਝੂਠੇ ਹਨ ਅਤੇ ਅਸੀਂ ਤੁਹਾਨੂੰ ਵੀ (ਉਨ੍ਹਾਂ ਵਰਗਾ) ਝੂਠਾ ਜਾਣ ਲਿਆ ਹੈ।"