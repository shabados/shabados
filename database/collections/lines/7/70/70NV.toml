[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰਿ ਤੇਰੈ ਹਰਿ ਵਸੈ; ਗੁਰਮੁਖਿ ਸਦਾ ਹਜੂਰਿ ॥"
page = 1283
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within thee abides thy Lord and by the Guru's grace, He is seen ever present."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਅੰਦਰ ਤੇਰਾ ਸੁਆਮੀ ਵਸਦਾ ਹੈ ਅਤੇ ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ, ਉਹ ਹਮੇਸ਼ਾਂ ਹਾਜ਼ਰ ਨਾਜ਼ਰ ਦਿੱਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Deep within your inner being, the Lord abides. The Gurmukh beholds Him ever-present."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਰਿਦੇ ਮੇਂ ਹਰੀ ਬਸਤਾ ਹੈ, ਤਾਂ ਤੇ ਗੁਰਮੁਖ ਹੋਇਕਰ ਤਿਸ ਕੋ ਸਦੀਵ ਨਿਕਟ ਹੀ ਵੇਖ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਜੀਵ-) ਪਪੀਹੇ! ਤੇਰੇ ਅੰਦਰ ਹੀ ਰੱਬ ਵੱਸਦਾ ਹੈ, ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੋਇਆਂ ਸਦਾ ਅੰਗ-ਸੰਗ ਦਿੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਜੂਰਿ = ਅੰਗ-ਸੰਗ। ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਿਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La viciosa e indigna permanece lejos. Profundamente, en el interior de tu ser, el Señor habita."