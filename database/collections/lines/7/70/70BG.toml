[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਤੂ ਵੁਠਾ ਚਿਤਿ; ਤਿਸੁ ਕਦੇ. ਨ ਹਾਰਣੋ ॥"
page = 963
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, within whose mind, Thou, O Lord, abidest; he loses not ever."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਮਨ ਅੰਦਰ ਤੂੰ ਵਸਦਾ ਹੈਂ, ਹੇ ਸੁਆਮੀ! ਉਹ ਕਦਾਚਿਤ ਨਹੀਂ ਹਾਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those, within whose consciousness You dwell, never lose."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਤੂੰ ਚਿਤ ਮੈਂ ਵਸਿਆ ਹੈਂ, ਸੋ ਕਦੇ ਨਹੀਂ ਹਾਰਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਮਨ ਵਿਚ ਤੂੰ ਵੱਸ ਪੈਂਦਾ ਹੈਂ, ਉਹ ਮਨੁੱਖਾ ਜਨਮ ਦੀ ਬਾਜ਼ੀ ਕਦੇ ਹਾਰਦਾ ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél en quien habitas, nunca es derrotado;"