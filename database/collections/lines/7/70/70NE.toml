[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰਾ ਮਨੁ ਲੋਚੈ; ਗੁਰ ਦਰਸਨ ਤਾਈ ॥"
page = 96
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My soul longs for a sight of the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਆਤਮਾ ਗੁਰਾਂ ਦੇ ਦੀਦਾਰ ਲਈ ਤਰਸ ਰਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind longs for the Blessed Vision of the Guru's Darshan."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਰੋ! ਆਪ ਕੇ ਦਰਸਨ ਕੇ ਵਾਸਤੇ ਮੇਰਾ ਮਨੁ ਚਾਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦਾ ਦਰਸਨ ਕਰਨ ਲਈ ਮੇਰਾ ਮਨ ਬੜੀ ਤਾਂਘ ਕਰ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੋਚੈ = ਲੋਚਦਾ ਹੈ, ਤਾਂਘਦਾ ਹੈ। ਤਾਈ = ਤਾਈਂ, ਵਾਸਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "bañado en lágrimas"