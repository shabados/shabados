[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਸਰਤ ਨਾਹਿ; ਮਨ ਤੇ ਹਰੀ ॥"
page = 1120
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From my mind, I forget not my God now."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਚਿੱਤ ਤੋਂ ਹੁਣ ਮੈਂ ਆਪਣੇ ਵਾਹਿਗੁਰੂ ਨੂੰ ਨਹੀਂ ਭੁਲਾਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I do not forget the Lord in my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਨ ਤੇ ਹਰੀ ਬਿਸਰਤਾ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਮਨੁੱਖ ਦੇ) ਮਨ ਤੋਂ ਪਰਮਾਤਮਾ ਨਹੀਂ ਭੁੱਲਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ। ਹਰੀ = ਪਰਮਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Kedara, Mejl Guru Aryan, Quinto Canal Divino.Ahora ya no me olvido de mi Dios dentro de mi ser."