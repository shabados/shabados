[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਿਤ੍ਰਕਲਾ ਜੋ ਸਹਚਰੀ; ਸੋ ਨ੍ਰਿਪ ਰੂਪ ਨਿਹਾਰਿ ॥"
page = 819

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On the sight of the Raja, Chitarkala herself fell flat on the ground"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਚਿਤ੍ਰਕਲਾ ਸਖੀ ਸੀ ਉਹ ਰਾਜੇ ਦਾ ਰੂਪ ਵੇਖ ਕੇ ਬੇਹੋਸ਼ ਹੋ ਕੇ ਧਰਤੀ ਉਤੇ ਡਿਗ ਪਈ।"