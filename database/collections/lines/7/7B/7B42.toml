[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬ੍ਰਿਖਭਾਨ ਸੁਤਾ ਪਿਖਿ ਗ੍ਵਾਰਿਨ ਕੋ; ਨਿਹੁਰਾਇ ਕੈ ਨੀਚੇ ਰਹੀ ਅਖੀਆ ॥"
page = 360

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing gopise with her Radha lowered down her eyes"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਧਾ (ਹੋਰਨਾਂ) ਗੋਪੀਆਂ ਨੂੰ (ਨੇੜੇ ਆਇਆ) ਵੇਖ ਕੇ ਝੁਕ ਗਈ ਅਤੇ ਅੱਖੀਆਂ ਨੀਵੀਆਂ ਕਰ ਲਈਆਂ।"