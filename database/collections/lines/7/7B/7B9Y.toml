[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਧਨੁ ਸੰਚੀਐ ਭਾਈ ॥"
page = 734
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Amass thou God's wealth, O brother,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਵਾਹਿਗੁਰੂ ਦੀ ਦੌਲਤ ਇਕੱਤਰ ਕਰ, ਹੇ ਵੀਰ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So gather in the wealth of the Lord, O Siblings of Destiny,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹਰੀ ਰੂਪ ਧਨ ਇਕਤ੍ਰ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਸ ਹਰੀ ਦਾ ਨਾਮ-ਧਨ ਇਕੱਠਾ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਚੀਐ = ਇਕੱਠਾ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ। ਭਾਈ = ਹੇ ਭਾਈ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Reúnan entonces la Riqueza del Señor, oh Hermanos del Destino,"