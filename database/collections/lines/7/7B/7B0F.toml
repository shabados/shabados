data = "ਖੁਲੇ ਖੇਤ ਮੋ ਖੱਗ ਖੂਨੀ ਖਿਮੰਕੇ ॥"
page = 160

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He bloody daggers coming out (from) the scabbards) glistened in the battlefield."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੈਦਾਨੇ-ਜੰਗ ਵਿਚ ਲਹੂ ਭਰੀਆਂ ਕ੍ਰਿਪਾਨਾਂ ਚਮਕਣ ਲਗੀਆਂ।"