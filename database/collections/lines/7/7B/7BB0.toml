[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਬ ਮੋਰੈ ਮਨਿ; ਭਇਆ ਅਨੰਦ ॥"
page = 392
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Now, there is happiness within my mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਮੇਰੇ ਚਿੱਤ ਅੰਦਰ ਖੁਸ਼ੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Now, my mind is filled with bliss;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਅਬ ਮੇਰੇ ਮਨ ਮੇਂ ਅਨੰਦ ਪ੍ਰਾਪਤ ਭਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਮੇਰੇ ਮਨ ਵਿਚ ਆਤਮਕ ਆਨੰਦ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਰੈ ਮਨਿ = ਮੇਰੇ ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora hay una gran Dicha en mi mente;"