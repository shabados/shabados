[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਮ ਜਨਮ ਕੇ; ਕਿਲਬਿਖ ਜਾਵਹਿ ॥"
page = 104
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The sins of many births will depart,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਜਨਮਾਂ ਦੇ ਪਾਪ ਦੂਰ ਹੋ ਜਾਣਗੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The sins of countless incarnations depart,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੋ ਜੀਵ ਹਰੀ ਕੋ ਧਿਆਵਤੇ ਹੈਂ ਤਿਨ ਕੇ ਜਨਮ ਜਨਮਾਂਤ੍ਰੋਂ ਕੇ ਪਾਪ ਜਾਤੇ ਰਹਿਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇਹੜੇ ਬੰਦੇ ਪਰਮਾਤਮਾ ਦਾ ਧਿਆਨ ਧਰਦੇ ਹਨ, ਉਹਨਾਂ ਦੇ) ਜਨਮਾਂ ਜਨਮਾਂਤਰਾਂ ਦੇ (ਕੀਤੇ ਹੋਏ) ਪਾਪ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਲਬਿਖ = ਪਾਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mediten en Él, en Aquél que los ha creado; sus errores a través de todas las épocas desaparecerán,"