[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਮਿਲਿ ਬਛਰੇ; ਗਊ ਪ੍ਰੀਤਿ ਲਗਾਵੈ ॥"
page = 164
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As a cow shows love to her strayed calf on meeting it,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਆਪਣੇ ਗੁਆਚੇ ਹੋਏ ਵੱਡੇ ਨੂੰ ਮਿਲ ਕੇ ਗਾਂ ਪਿਆਰ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As the cow shows her love to her strayed calf when she finds it,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਬਛਰੇ ਕੋ ਮਿਲ ਕਰ ਗਊ ਪ੍ਰੀਤੀ ਲਗਾਵੈ ਅਰਥਾਤ ਕਰਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ (ਆਪਣੇ) ਵੱਛੇ ਨੂੰ ਮਿਲ ਕੇ ਗਾਂ ਖ਼ੁਸ਼ ਹੁੰਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਿ = ਮਿਲ ਕੇ। ਬਛਰੇ = ਵੱਛੇ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como la vaca está complacida al ver a su becerro,"