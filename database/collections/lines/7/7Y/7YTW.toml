[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਨੀਆ ਸਾਗਰੁ. ਦੁਤਰੁ ਕਹੀਐ; ਕਿਉ ਕਰਿ ਪਾਈਐ ਪਾਰੋ ॥"
page = 938
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "(The Yogis say) \"The world-ocean is said to be impassable. Q. 10: How can one cross it?\""

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "(ਯੋਗੀ ਪੁਛਦੇ ਹਨ) ਪ੍ਰ. 10: ਜਗਤ ਇਕ ਪਾਰ ਨਾਂ ਕੀਤਾ ਜਾਣ ਵਾਲਾ ਸਮੁੰਦਰ ਆਖਿਆ ਜਾਂਦਾ ਹੈ। ਬੰਦਾ ਇਸ ਤੋਂ ਕਿਸ ਤਰ੍ਹਾਂ ਪਾਰ ਹੋ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "\"The world-ocean is treacherous and impassable; how can one cross over?\""

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹ ਜੋ ਦੁਨੀਆਂ ਦੁਸ੍ਤਰ ਸਮੁੰਦਰ ਕਹੀਤਾ ਹੈ ਇਸ ਕੇ ਪਾਰ ਕੋ ਕੈਸੇ ਪਾਈਏ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਚਰਪਟ ਦਾ ਪ੍ਰਸ਼ਨ) ਜਗਤ (ਇਕ ਐਸਾ) ਸਮੁੰਦਰ ਕਿਹਾ ਜਾਂਦਾ ਹੈ ਜਿਸ ਨੂੰ ਤਰਨਾ ਔਖਾ ਹੈ, (ਇਸ ਸਮੁੰਦਰ ਦਾ) ਪਾਰਲਾ ਕੰਢਾ ਕਿਵੇਂ ਲੱਭੇ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਤਰੁ = ਦੁੱਤਰੁ, ਦੁਸ-ਤੁਰ, ਜਿਸ ਨੂੰ ਤਰਨਾ ਔਖਾ ਹੈ। ਕਿਉਕਰਿ = ਕਿਵੇਂ? ਕਿਸ ਤਰ੍ਹਾਂ? ਪਾਰੋ = ਪਾਰਲਾ ਕੰਢਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Preguntó Charpat, el Yogui: se considera que el mar del mundo es imposible de cruzar, ¿cómo entonces puede uno ir a través?"