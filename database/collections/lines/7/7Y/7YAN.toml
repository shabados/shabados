type = "primary"
data = "ਮਦਰੋ ਅਧਿਕ ਪਿਵਾਇ ਕੈ; ਮੂੰਡ ਮੂੰਡ ਲੈ ਜਾਇ ॥੧੬॥"
page = 949

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "influence of wine got his head shaved off (lost all his wealth).(l6)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੂੰ) ਜ਼ਿਆਦਾ ਸ਼ਰਾਬ ਪਿਲਾ ਕੇ (ਉਸ ਦਾ ਸਾਰਾ ਧਨ) ਲੁਟ ਕੇ ਲੈ ਜਾਂਦਾ ॥੧੬॥"