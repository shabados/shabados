[[content]]
assets = ["SSKS"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ ਪੂਰਨ ਬ੍ਰਹਮ ਸਤਿਗੁਰ ਨਾਨਕ ਦੇਵ ॥੨॥੨॥"

[[content]]
assets = ["SSPK"]
type = "translation"
language = "en"
data = "Satgur (True Guru) Nanak Dev is the immanent form of God."

[[content]]
assets = ["SSSK"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਪਾਰਬ੍ਰਹਮ ਪੂਰਣ ਬ੍ਰਹਮ ਸਤਿਗੁਰੂ ਨਾਨਕ ਦੇਵ ਹੈ ॥੫॥"