[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦੀ ਪਾਇ; ਜਿਥਹੁ ਹਉਮੈ ਜਾਈਐ ॥"
page = 951
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art obtained by the grace of the Guru, through whom self-conceit is stilled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਐਸੇ ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਪਾਇਆ ਜਾਂਦਾ ਹੈ, ਜਿਨ੍ਹਾਂ ਦੀ ਰਾਹੀਂ ਸਵੈ-ਹੰਗਤਾ ਦੂਰ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, I find You; You eradicate egotism from within."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਏਹ ਸਮਝ ਪਾਈਤੀ ਹੈ ਔਰ ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਤਹਾਂ ਹੋਤੀ ਹੈ ਜਹਾਂ ਸੇ ਹਉਮੈ ਜਾਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "('ਅੰਮ੍ਰਿਤ') ਸਤਿਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਮਿਲਦਾ ਹੈ, ਜਿਥੋਂ (ਭਾਵ, ਗੁਰੂ ਤੋਂ ਹੀ) ਹਉਮੈ ਨਾਸ ਹੁੰਦੀ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਥਹੁ = (ਭਾਵ) ਸਤਿਗੁਰੂ ਤੋਂ"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por la Gracia del Guru uno llega a Ti y así se libera de su ego."