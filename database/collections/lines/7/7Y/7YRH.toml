[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰਾ ਕੀਤਾ; ਜਿਸੁ ਲਾਗੈ ਮੀਠਾ ॥"
page = 131
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The person, unto whom Thine doings taste sweet,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੁਰਸ਼ ਜਿਨ੍ਹਾਂ ਨੂੰ ਤੇਰੇ ਕੰਮ ਮਿਠੜੇ ਲੱਗਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That person, unto whom Your actions seem sweet,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਕੀਆ ਜਿਸ ਕੋ ਮੀਠਾ ਲਾਗਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਤੇਰਾ ਭਾਣਾ ਮਿੱਠਾ ਲੱਗਣ ਲੱਗ ਪੈਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél a quien Tus hechos le saben dulces,"