[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਸਤਿਗੁਰ ਭੇਟੇ; ਮਹਾ ਦੁਖੁ ਪਾਇ ॥"
page = 946
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without meeting the True Guru, one suffers immense pain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਦੇ ਮਿਲਣ ਬਾਝੋਂ ਇਨਸਾਨ ਪਰਮ ਕਸ਼ਟ ਉਠਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without meeting the True Guru, one suffers in terrible pain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਸਤਿਗੁਰੋਂ ਸੇ ਮਿਲਿਆਂ ਬਿਨਾਂ ਬੜਾ ਦੁਖ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੂੰ ਮਿਲਣ ਤੋਂ ਬਿਨਾ ਮਨੁੱਖ ਬੜਾ ਕਸ਼ਟ ਉਠਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Guru Verdadero uno sufre terrible dolor."