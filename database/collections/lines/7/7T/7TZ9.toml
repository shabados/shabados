[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਹਿਬ ਦੇ ਰੰਗ ਵਿਚ ਸਾਡਾ ਖਿਆਲ ਕਰਦਾ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਊ ਬਰੰਗਿ ਸਾਹਿਬੀ ਦਾਰਦ ਨਜ਼ਰ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And he is spotted and smeared with the name of Guru Gobind Singh (157)"