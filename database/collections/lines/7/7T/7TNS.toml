[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਇ. ਨ ਜਾਣੈ ਤੇਰਾ ਪਰਵਾਰਾ ॥"
page = 1060
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "no one knows thine bounds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਭੀ ਤੇਰੇ ਹਦਬੰਨੇ ਨੂੰ ਨਹੀਂ ਜਾਣਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "no one knows Your extent."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਪਾਰ ਔ ਉਰਾਰ ਕੋਈ ਨਹੀਂ ਜਾਨਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਭੀ ਜਾਣ ਨਹੀਂ ਸਕਦਾ ਕਿ ਤੇਰਾ ਕੇਡਾ ਵੱਡਾ ਪਰਵਾਰ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਵਾਰਾ = ਪੈਦਾ ਕੀਤੇ ਹੋਏ ਜੀਅ ਜੰਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no hay nadie que conozca Tu Extensión."