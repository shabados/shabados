[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੋਹ ਠਗਉਰੀ ਭਰਮੁ ਨਿਵਾਰਹਿ ॥"
page = 1068
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "discard the poisonous potion of worldly love and dispel their doubt."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੰਸਾਰੀ ਮਮਤਾ ਦੀ ਜ਼ਹਿਰੀਲੀ ਦਵਾਈ ਨੂੰ ਛੱਡ ਦਿੰਦੇ ਹਨ ਅਤੇ ਆਪਣੇ ਸੰਦੇਹ ਨੂੰ ਨਵਿਰਤ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remove the poisonous drug of emotional attachment, and eradicate doubt."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੋਹ ਜੋ ਭਰਮ ਕੀ ਠਗਬੂਟੀ ਹੈ ਤਿਸ ਕੋ ਨਿਵਾਰਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਮੋਹ ਦੀ ਠੱਗ-ਬੂਟੀ ਨਹੀਂ ਖਾਂਦੇ, ਉਹ ਮਨੁੱਖ (ਆਪਣੇ ਅੰਦਰੋਂ) ਭਟਕਣਾ ਦੂਰ ਕਰ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਗਉਰੀ = ਠਗ-ਮੂਰੀ, ਠਗ-ਬੂਟੀ, ਉਹ ਬੂਟੀ ਜਿਸ ਨਾਲ ਠਗ ਲੋਕ ਮੁਸਾਫ਼ਿਰਾਂ ਨੂੰ ਠੱਗਦੇ ਹਨ (ਧਤੂਰਾ ਆਦਿਕ)। ਭਰਮੁ = ਭਟਕਣਾ। ਨਿਵਾਰਹਿ = ਦੂਰ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "deshazte del embrujo venenoso de las pasiones y erradica tu duda,"