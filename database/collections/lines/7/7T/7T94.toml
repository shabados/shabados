[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਛਰੀ ਜ︀ਯੋ ਤਰਫੈ ਪਰੀ ਚੁਭੀ ਚਖਨ ਕੀ ਚੋਟ ॥੨੭॥"
page = 814

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Without the touch of your beautiful eyes I am writhing like a fish (out of water).’(27)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੁਹਾਡੇ) ਨੈਣਾਂ ਦੀ ਚੋਟ ਖਾ ਕੇ ਮੱਛਲੀ ਵਾਂਗ ਤੜਪ ਰਹੀ ਹਾਂ ॥੨੭॥"