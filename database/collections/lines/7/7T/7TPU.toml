data = "ਜਿਹ ਅਮਿਤ ਤੇਜ, ਅਛੈ ਅਤੋਲ ॥"
page = 29

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Whose light is unlimited and who is Invincible and Unweighable!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਤੇਜ ਅਮਿਤ ਹੈ ਅਤੇ ਜੋ ਨਾਸ਼-ਰਹਿਤ ਅਤੇ ਅਤੋਲ ਹੈ।"