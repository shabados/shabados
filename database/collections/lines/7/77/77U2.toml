[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹ ਬੈਸਉ; ਤਹ ਨਾਲੇ ਬੈਸੈ ॥"
page = 371
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wherever I sit, there she sits with me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਮੈਂ ਬੈਠਦਾ ਹਾਂ, ਉਥੇ ਇਹ ਮੇਰੇ ਨਾਲ ਬੈਠਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wherever I sit, she sits there with me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਹਾਂ ਬੈਠਤਾ ਹਾਂ ਤਹਾਂ ਸੰਗ ਬੈਠਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਜਿਥੇ ਭੀ (ਜਾ ਕੇ) ਬੈਠਦਾ ਹਾਂ (ਇਹ ਮਾਇਆ) ਮੇਰੇ ਨਾਲ ਹੀ ਆ ਬੈਠਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਹ = ਜਿਥੇ। ਬੈਸਉ = ਮੈਂ ਬੈਠਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Donde sea que alguien habita, ahí habita ella también,"