[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਤੇ ਕਹਿਯੋ ਸੁਨਿ ਲੈ ਹਮਰੋ; ਗ੍ਰਿਹ ਕੋ ਤਜਿ ਆਹਵ ਜਾਹੁ ਪਰਾਏ ॥੧੧੮੬॥"
page = 416

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“We have brought four such units in great anger, therefore, you may leave the war-arena and run away to your home.”1186."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਲਈ ਸਾਡੀ ਗੱਲ ਸੁਣ ਲੈ, ਰਣ-ਭੂਮੀ ਨੂੰ ਛਡ ਕੇ ਘਰ ਨੂੰ ਦੌੜ ਜਾ ॥੧੧੮੬॥"