[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਰੈ ਚਿਤ ਪਾਵਿਤ੍ਰ ਬਾਚਿਤ੍ਰ ਕਰਮੰ ॥੫॥੨੨੩॥"
page = 146

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And was performing wonderful and holy Karmas.5.223."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਚਿੱਤ ਨੂੰ ਪਵਿੱਤਰ ਕਰਨ ਵਾਲੇ ਵਿਚਿਤ੍ਰ ਕਰਮ (ਯੁੱਧ ਕੌਤਕ) ਕਰ ਰਿਹਾ ਸੀ ॥੫॥੨੨੩॥"