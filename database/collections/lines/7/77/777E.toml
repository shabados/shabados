[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਠ ਪਹਰ; ਹਰਿ ਕੇ ਗੁਣ ਗਾਉ ॥"
page = 866
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Throughout the eight watches of the day celebrate thou the Lord's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਦੇ ਅੱਠੇ ਪਹਿਰ ਹੀ ਤੂੰ ਪ੍ਰਭੂ ਦੀ ਕੀਰਤੀ ਗਾਇਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Twenty-four hours a day, sing the Glorious Praises of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਠੇ ਪਹਰ ਹਰੀ ਕੇ ਗੁਨੋਂ ਕੋ ਗਾਉ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਅੱਠੇ ਪਹਿਰ (ਹਰ ਵੇਲੇ) ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦਾ ਰਿਹਾ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਾਉ = ਗਾਇਆ ਕਰੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canta siempre la Alabanza de tu Señor,"