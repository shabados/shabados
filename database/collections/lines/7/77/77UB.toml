[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਰੂਪ ਰੰਗ ਭੋਗ ਰਸੈ ॥"
page = 890
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and he enjoys various spectacles, revelments and delicacies,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਹ ਅਨੇਕਾਂ ਦ੍ਰਿਸ਼ਯ ਰੰਗਰਲੀਆਂ ਤੇ ਨਿਆਮਤਾਂ ਮਾਣਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He enjoys the various shows and forms, pleasures and delicacies;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਭੋਗੋਂ ਕੇ ਰਸ ਤਿਸ ਕੋ ਪ੍ਰਾਪਤ ਹੋਏ ਹੈਂ, ਭਾਵ ਇਨ ਸਭ ਕੀ ਤਰਫੋਂ ਮਨੁ ਤ੍ਰਿਪਤ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ (ਮਾਨੋ) ਅਨੇਕਾਂ ਰੂਪਾਂ ਰੰਗਾਂ ਅਤੇ ਮਾਇਕ ਪਦਾਰਥਾਂ ਦਾ ਰਸ ਮਾਣਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸੈ = ਰਸ ਮਾਣਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él obtiene el fruto de millones de meditaciones y austeridades, el gozo de todo Amor, Belleza y Excelencia,"