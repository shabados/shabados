[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੇ ਮੂੜੑੇ; ਆਨ ਕਾਹੇ ਕਤ ਜਾਈ ॥"
page = 1213
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O fool, why go thou any where else?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ! ਤੂੰ ਹੋਰ ਕਿਧਰੇ ਕਿਉਂ ਜਾਂਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You fool: why are you going somewhere else?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ ਜੀਵ! ਔਰ ਕਹੀਂ ਕਾਹੇ ਕੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ! ਤੂੰ ਹੋਰ ਕਿਤੇ ਕਿਉਂ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇ ਮੂੜ੍ਹ੍ਹੇ = ਹੇ ਮੂਰਖ! ਆਨ ਕਤ = ਹੋਰ ਕਿਤੇ। ਕਾਹੇ = ਕਿਉਂ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh tonto ignorante, ¿por qué ir a otro?, en tu interior está atesorado el Néctar total del Señor,"