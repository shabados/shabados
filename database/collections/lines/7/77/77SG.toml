[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਘਾਲਿ ਖਾਇ ਸੇਵਾ ਕਰੈ; ਗੁਰ ਉਪਦੇਸੁ ਅਵੇਸੁ ਵਿਸੇਖੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "One should eat the fruit of one's own labour, do service and could always remain inspired by the teachings of the Guru."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਮਾਈ ਕਰ ਕੇ ਖਾਵੇ (ਆਏ ਗਏ ਦੀ) ਸੇਵਾ ਕਰੇ, ਗੁਰ ਉਪਦੇਸ਼ ਵਿਖੇ ਪ੍ਰਵੇਸ਼ ਰੱਖੇ।"