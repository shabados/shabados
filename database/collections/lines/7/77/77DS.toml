[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰੁ ਪਰਮੇਸਰੁ ਇਕੁ ਜਾਨਿ; ਗੁਰਮੁਖਿ ਦੂਜਾ ਭਾਉ ਮਿਟਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Accepting Guru and God as one, the gurmukh has erased the sense of duality."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖ (ਲੋਕਾਂ) ਨੇ ਗੁਰੂ ਅਤੇ ਪਰਮੇਸ਼ਰ ਨੁੰ ਇਕ (ਰੂਪ) ਜਾਣਕੇ ਦੂਜੇ ਭਾਵ ਦਾ ਖੁਰਾ ਖੋਜ ਮਿਟਾ ਦਿੱਤਾ ਹੈ।"