[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੋਰਨ ਭੋਰ, ਕਰੋਰਨ ਮੋਰਨ; ਤਾਸੁ ਸਹੀ ਘਨ ਕੈ ਅਵਿਰੇਖਿਓ ॥"
page = 632

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The thieves saw him s early morn and the peacocks as cloud"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਚੋਰਾਂ ਨੇ ਪ੍ਰਭਾਤ ਦੇ ਸਮੇਂ ਵਜੋਂ ਅਤੇ ਕਰੋੜਾਂ ਮੋਰਾਂ ਨੇ ਉਸ ਨੂੰ ਸਹੀ ਕਾਲੇ ਬਦਲ ਵਜੋਂ ਵਿਚਾਰਿਆ ਹੈ।"