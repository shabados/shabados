[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਉ ਘਰ ਥਾਪੇ; ਥਾਪਣਹਾਰੈ ॥"
page = 1036
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To it the Creator has fixed the nine doors."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਨੂੰ ਸਿਰਜਣਹਾਰ ਨੇ ਨੌ ਦਰਵਾਜ਼ੇ ਲਾਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator established the nine gates."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਉਂ (ਘਰ) ਗੋਲਕਾ ਥਾਪਨਹਾਰੇ ਤੈਨੇਂ ਬਨਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬਣਾਣ ਦੀ ਤਾਕਤ ਰੱਖਣ ਵਾਲੇ ਪ੍ਰਭੂ ਨੇ ਇਸ ਸਰੀਰ ਦੇ ਨੌ ਘਰ (ਕਰਮ ਇੰਦ੍ਰੇ) ਬਣਾਏ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਰ = ਗੋਲਕਾਂ, ਇੰਦ੍ਰੇ। ਥਾਪਣਹਾਰੈ = ਬਣਾਣ ਦੀ ਸਮਰੱਥਾ ਰੱਖਣ ਵਾਲੇ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahí, el Señor Creador instaló las nueve puertas y dentro de la Décima,"