data = "ਸਿਤਾ ਅਸਿਤਾ ਰਾਜ ਕ੍ਰਾਤੀ ਅਨੰਤੀ ॥"
page = 119

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "White-black and red-coloured."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਗੋਰੇ, ਕਾਲੇ ਅਤੇ ਰਾਜ-ਗਰਦੀ ਆਦਿ ਅਨੰਤ ਰੂਪਾਂ ਵਾਲੀ (ਨੂੰ ਨਮਸਕਾਰ ਹੈ);"