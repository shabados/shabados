[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਲਹ ਅਲਖ ਅਪਾਰ ॥"
page = 896
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is Invisible and Invisible and Infinite."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਅਦ੍ਰਿਸ਼ਟ ਹੈ ਅਤੇ ਅਨੰਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is unseen and infinite."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਿੰਦੂ ਅਗਮੁ ਅਲਖ ਅਪਾਰ ਕਹਿਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਅੱਲਾਹ! ਹੇ ਅਲੱਖ! ਹੇ ਅਪਾਰ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਲਹ = ਰੱਬ {ਪ੍ਰਭੂ ਦਾ ਮੁਸਲਮਾਨੀ ਨਾਮ}। ਅਲਖ = ਅਲੱਖ, ਜਿਸ ਦਾ ਸਹੀ ਸਰੂਪ ਬਿਆਨ ਨ ਹੋ ਸਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres Infinito e Invisible,"