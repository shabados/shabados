[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿੰਦਕ ਕਉ; ਫਿਟਕੇ ਸੰਸਾਰੁ ॥"
page = 1151
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The world curses the slanderer."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਦਖੋਈ ਕਰਨ ਵਾਲੇ ਨੂੰ ਜਗਤ ਫਿਟ-ਲਾਣ੍ਹਤ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The entire universe curses the slanderer."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਿੰਦਕ ਕੋ ਸਭ ਸੰਸਾਰ (ਫਿਟਕੇ) ਧ੍ਰਿਕਾਰ ਹੀ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨਾਂ ਉਤੇ ਤੁਹਮਤਾਂ ਲਾਣ ਵਾਲੇ ਮਨੁੱਖ ਨੂੰ ਸਾਰਾ ਜਗਤ ਫਿਟਕਾਰਾਂ ਪਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿੰਦਕ = ਦੂਜਿਆਂ ਉੱਤੇ ਚਿੱਕੜ ਸੁੱਟਣ ਵਾਲਾ, ਦੂਜਿਆਂ ਉੱਤੇ ਤੁਹਮਤਾਂ ਲਾਣ ਵਾਲਾ। ਕਉ = ਨੂੰ। ਫਿਟਕੇ = ਫਿਟਕਾਰਾਂ ਪਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El que calumnia a los Santos es maldecido por el mundo entero,"