[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਕਤ ਕੀ; ਓਹ ਪਿੰਡ ਪਰਾਇਣਿ ॥"
page = 871
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "She is the body and very life of an apostate."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਧਰਮੀ ਦੀ ਉਹ ਦੇਹ ਤ ਜਿੰਦ-ਜਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "She is the body, the breath of life, of the faithless cynics."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਸਾਕਤੋਂ ਕੇ ਸਰੀਰ ਕੋ ਤੌ ਵਹੁ ਪ੍ਰਾਣ ਰੂਪ ਹੈ, ਉਨ ਕੀ ਦੇਹ ਮੇਂ ਤਤਪਰ ਹੋ ਰਹੀ ਹੈ; ਵਾ ਸਾਕਤੋਂ ਕੇ ਸਰੀਰੋਂ ਕੀ ਉਹੀ ਮਾਇਆ ਹੈ ਤਤਪਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਮਾਇਆ ਪ੍ਰਭੂ ਨਾਲੋਂ ਟੁੱਟੇ ਹੋਏ ਬੰਦਿਆਂ ਦੀ ਜਿੰਦ-ਜਾਨ ਬਣੀ ਰਹਿੰਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਿੰਡ ਪਰਾਇਣਿ = ਸਰੀਰ ਦਾ ਆਸਰਾ, ਜਿੰਦ-ਜਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ella es el único sustento de aquéllos que la alaban,"