[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਸਕਲ ਤੁਪਕ ਕੇ ਨਾਮ; ਚਹੋ ਤਹ ਦੀਜੀਐ ॥੯੭੫॥"
page = 776

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Say the word “Bhag” after “Rainraavani”, then speak the words “Jaachar-naath-shatru” and make the desired use of the names of Tupak.975."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਜਿਥੇ ਚਾਹੋ, ਤੁਪਕ ਦੇ ਨਾਮ ਵਜੋਂ ਦਿਓ ॥੯੭੫॥"