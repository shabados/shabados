[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੇਵ ਅਦੇਵ ਖਪੇ ਅਹੰਮੇਵ; ਨ ਭੇਵ ਲਖਿਓ, ਭ੍ਰਮ ਸਿਓ ਭਰਮਾਏ ॥"
page = 37

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The goods and demons have been consumed in ego, but could not know the mystery of the Lord, being engrossed in delusion."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੇਵਤੇ ਅਤੇ ਦੈਂਤ ਹੰਕਾਰ ਕਾਰਨ ਖੱਪ ਗਏ, (ਕਿਸੇ ਨੇ ਉਸਦਾ) ਭੇਦ ਨਾ ਪਾਇਆ, (ਉਹ) ਭਰਮਾਂ ਵਿਚ ਹੀ ਭਰਮਦੇ ਰਹੇ।"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਦੇਵ ਅਦੇਵ ਖਪੇ ਅਹੰਮੇਵ; ਨ ਭੇਵ ਲਖਿਓ, ਭ੍ਰਮ ਸਿਉ ਭਰਮਾਏ ॥"