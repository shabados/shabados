data = "ਨਹਿ ਦੇਵਿ ਜਾਪੁ ਭਣੰਤ ॥"
page = 610

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "No one the repeats the name of the Lord-God or the name of any other God goddess"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਾ ਹੀ ਦੇਵ (ਭਗਵਾਨ) ਦਾ (ਕੋਈ) ਸਿਮਰਨ ਕਰਦਾ ਹੈ।"