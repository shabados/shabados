[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਰਪੰਤ ਹਰੀਅੰ; ਮਤਿ ਤਤੁ ਗਿਆਨੰ ॥"
page = 1355
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By God's grace, real understanding enters man's mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਦੀ ਦਇਆ ਦੁਆਰਾ, ਅਸਲੀ ਗਿਆਤ ਮਨੁਸ਼ ਦੇ ਮਨ ਵਿੱਚ ਆ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By the Grace of God, genuine understanding comes to the mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਇਸ ਜੀਵ ਪਰ ਹਰੀ ਕੀ (ਕਿਰਪੰਤ) ਕ੍ਰਿਪਾ ਹੋਤੀ ਹੈ ਤਬ ਇਸ ਕੀ (ਮਤਿ) ਬੁਧੀ ਮੇਂ (ਤਤੁ) ਯਥਾਰਥ ਆਤਮ ਗਿਆਨ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਪਰਮਾਤਮਾ ਦੀ ਕਿਰਪਾ ਹੋਵੇ ਉਥੇ ਮਨੁੱਖ ਦੀ ਅਕਲ ਨੂੰ ਸਹੀ ਜੀਵਨ ਦੀ ਸੂਝ ਆ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਰਪੰਤ = ਕਿਰਪਾ (कृपा)। ਹਰੀਅੰ = ਹਰੀ, ਪਰਮਾਤਮਾ (हरि)।ਤਤੁ ਗਿਆਨ = ਅਸਲੀਅਤ ਦੀ ਸਮਝ, ਸਹੀ ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੂਝ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El intelecto florece y encontramos un lugar en el reino de la Dicha Celestial,"