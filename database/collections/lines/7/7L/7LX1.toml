[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖ ਭੂਲੇ; ਮੁਏ ਬਿਲਲਾਇ ॥"
page = 1065
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mind-wards go astray and die bewailing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਨ-ਮੱਤੀਏ ਕੁਰਾਹੇ ਪੈਂਦੇ ਹਨ ਅਤੇ ਰੋਂਦੇ ਪਿਟਦੇ ਮਰ ਮੁੱਕ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The self-willed manmukhs are deluded, and die weeping and wailing."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨਮੁਖ ਭੂਲੇ ਹੈਂ, ਸੋ ਬਿਸ੍ਯਾਂ ਕੋ (ਖਾਇ) ਭੋਗਤੇ ਰੋਂਦੇ ਮਰ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ ਮਨੁੱਖ ਕੁਰਾਹੇ ਪਏ ਰਹਿੰਦੇ ਹਨ, ਬੜੇ ਦੁੱਖੀ ਹੋ ਹੋ ਕੇ ਆਤਮਕ ਮੌਤ ਸਹੇੜੀ ਰੱਖਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਮੁਖ = ਆਪਣੇ ਮਨ ਦੇ ਪਿਛੇ ਤੁਰਨ ਵਾਲੇ। ਭੂਲੇ = ਕੁਰਾਹੇ ਪਏ ਰਹਿੰਦੇ ਹਨ। ਮੁਏ = ਆਤਮਕ ਮੌਤ ਸਹੇੜਦੇ ਹਨ। ਬਿਲਲਾਇ = ਵਿਲਕ ਕੇ, ਦੁਖੀ ਹੋ ਹੋ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "los ególatras son desviados del Sendero y mueren afligidos."