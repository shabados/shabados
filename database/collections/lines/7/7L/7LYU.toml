[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਣ ਗੰਧ੍ਰਬ ਭੂਤ ਪਿਸਾਚ ਤਬੈ ॥੩੮੮॥"
page = 666

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the animals, birds, gandharvas, ghosts, fiends etc. were wonder-struck.388."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਗਣ, ਗੰਧਰਬ, ਭੂਤ, ਪਿਸ਼ਾਚ ਆਦਿ ਸਾਰੇ ਜੀਵ ਉਸ ਵੇਲੇ (ਹੈਰਾਨੀ ਦੀ ਅਵਸਥਾ ਵਿਚ ਹੋ ਗਏ) ॥੩੮੮॥"