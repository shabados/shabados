[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁਨਿ ਮਰਯੋ ਪੁਤ੍ਰ, ਤੇਊ ਹੋਹਿ ਛੀਨ ॥੨੩॥"
page = 202

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Do not say anything me to them, otherwise they will die in extreme agony.”23."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਉਹ ਪੁੱਤਰ ਦਾ ਮਰਨਾ ਸੁਣਦਿਆਂ ਨਿਰਬਲ ਹੋ ਕੇ ਮਰ ਜਾਣਗੇ ॥੨੩॥"