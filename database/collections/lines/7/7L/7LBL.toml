[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰ ਕੀ ਮਲੁ. ਦਿਲ ਤੇ ਧੋਵੈ ॥"
page = 1084
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He ought to cleanse his inner pollution from his mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਆਪਣੀ ਅੰਦਰ ਦੀ ਪਲੀਤੀ ਆਪਣੇ ਮਨ ਤੋਂ ਧੋ ਸੁਟਣੀ ਚਾਹੀਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and wash away pollution from within the heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭੇਦ ਕੀ ਜੋ ਮੈਲ ਹੈ, ਸੋ ਦਿਲ ਸੇ ਧੋ ਦੇਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜੋ ਆਪਣੇ ਦਿਲ ਤੋਂ ਅੰਦਰਲੀ (ਵਿਕਾਰਾਂ ਦੀ) ਮੈਲ ਧੋ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਤਰ ਕੀ = ਅੰਦਰ ਦੀ, ਅੰਦਰਲੀ। ਤੇ = ਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que con ese corazón se limpia del polvo interno,"