[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਥੈ ਸੋਹਨਿ; ਪੰਚ ਪਰਵਾਣੁ ॥"
page = 7
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There the accepted saints look graceful"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਕਬੂਲ ਪਏ ਹੋਏ ਸਾਧੁ ਸੁੰਦਰ ਲੱਗਦੇ ਹਨ"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There, in perfect grace and ease, sit the self-elect, the self-realized Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪ੍ਰਮਾਣੀਕ (ਪੰਚ) ਸੰਤ ਹੈਂ, ਸੋ ਤਿਸ ਦਰਬਾਰ ਮੈ ਬੈਠੇ ਸੋਭਾ ਪਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਰਬਾਰ ਵਿਚ ਸੰਤ ਜਨ ਪਰਤੱਖ ਤੌਰ 'ਤੇ ਸੋਭਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਥੈ = ਅਕਾਲ ਪੁਰਖ ਦੇ ਦਰਬਾਰ ਵਿਚ। ਸੋਹਨਿ = ਸੋਭਦੇ ਹਨ। ਪਰਵਾਣੁ = ਪਰਤੱਖ ਤੌਰ 'ਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En su Corte, en su perfecta misericordia y gracia se sientan los galardonados y santos por merito."