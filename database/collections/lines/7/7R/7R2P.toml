[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਲੁ ਸਬਦਿ ਸੁਭਾਏ. ਆਪੁ ਗਵਾਏ; ਰੰਗ ਸਿਉ ਰਲੀਆ ਮਾਣੇ ॥"
page = 772
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Obtaining the Name, I am embellished. Shedding my ego, I revel in joy with love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਨੂੰ ਪਾ ਕੇ ਮੈਂ ਸ਼ਸ਼ੋਭਤ ਹੋ ਗਈ ਹਾਂ। ਆਪਣੀ ਹੰਗਤਾ ਨੂੰ ਤਿਆਗ, ਮੈਂ ਪਿਆਰ ਨਾਲ ਅਨੰਦ ਭੋਗਦੀ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Merging in the Word of the Shabad, I am lovingly embellished; my ego is eradicated, and I revel in joyous love."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਪਾ ਭਾਵ ਗਵਾਇਕੇ ਸਬਦ ਉਪਦੇਸ ਸੇ ਸੁਭਾਏਮਾਨ ਜੋ ਗੁਰੂ ਹੈਂ ਤਿਨੋਂ ਕੇ ਸਾਥ ਜੋ ਮਿਲੇ ਹੈਂ, ਸੋ ਅਨੰਦ ਸਾਥ ਖੁਸੀਆਂ ਮਾਣਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ ਉਹ ਜੀਵ-ਇਸਤ੍ਰੀ ਪ੍ਰਭੂ ਵਿਚ ਮਿਲ ਕੇ ਪ੍ਰਭੂ ਦੇ ਪ੍ਰੇਮ ਵਿਚ ਟਿਕ ਕੇ (ਆਪਣੇ ਅੰਦਰੋਂ) ਆਪਾ-ਭਾਵ ਦੂਰ ਕਰ ਲੈਂਦੀ ਹੈ, ਅਤੇ ਪ੍ਰੇਮ ਵਿਚ ਪ੍ਰਭੂ ਦਾ ਮਿਲਾਪ ਮਾਣਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਿ = ਮਿਲ ਕੇ। ਆਪੁ = ਆਪਾ-ਭਾਵ। ਸਿਉ = ਨਾਲ। ਰਲੀਆ = ਰਲੀਆਂ, ਆਤਮਕ ਆਨੰਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y de forma espontánea, hago a un lado mi ego, y me regocijo en Su Amor."