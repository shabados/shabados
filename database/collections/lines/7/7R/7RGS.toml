[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਲ ਮਹਿ; ਪਾਹਣੁ ਲੈ ਲਟਕਾਵੈ ॥੧॥"
page = 739
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and suspends a stone-god round his neck."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੀ ਗਰਦਨ ਨਾਲ ਇਕ ਪੱਥਰ ਦਾ ਦੇਵ ਲਟਕਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "And yet, around his neck, he hangs a stone god. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਪਥਰੋਂ ਕੋ ਲੈਕਰ ਗਲ ਮੇਂ ਲਟਕਾਉਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੱਥਰ (ਦੀ ਮੂਰਤੀ) ਲੈ ਕੇ ਆਪਣੇ ਗਲ ਵਿਚ ਲਟਕਾਈ ਫਿਰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਹਣੁ = ਪੱਥਰ, ਪੱਥਰ ਦੀ ਮੂਰਤੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero se cuelga un amuleto de piedra como si fuera su dios alrededor del cuello.(1)"