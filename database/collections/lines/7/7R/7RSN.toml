[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਉਤੀ; ਰਹਤ ਜੁਗਤਾ ॥"
page = 71
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The worshipper lives under discipline."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਪਾਸ਼ਕ ਜ਼ਾਬਤੇ ਅੰਦਰ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The worshipper of Bhagaauti practices self-discipline,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਭਗਉਤੀ) ਨਿਰਤਿ ਕਰਨੇ ਵਾਲੇ ਭਗਤ ਸੋ ਨਿਰਤ ਮੇਂ ਹੀ ਜੁੜੇ ਰਹਿਨੇ ਕੋ ਮੁਕਤਿ ਮਾਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵੈਸ਼ਨਵ ਭਗਤ (ਵਰਤ, ਤੁਲਸੀ ਮਾਲਾ, ਤੀਰਥ ਇਸ਼ਨਾਨ ਆਦਿਕ) ਸੰਜਮਾਂ ਵਿਚ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਗਉਤੀ = ਵੈਸ਼ਨਵ ਭਗਤ। ਜੁਗਤਾ = ਵਰਤ, ਤੁਲਸੀ ਮਾਲਾ ਆਦਿਕ ਸੰਜਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Vaishnava practica la disciplina exterior."