[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਕਿਰਪਨ ਕਠੋਰ ॥"
page = 275
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many myriads are stone-hearted misers."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕ ਕ੍ਰੋੜ ਪੱਥਰ-ਦਿਲ ਕੰਜੂਸ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions are stone-hearted misers."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਈ ਕ੍ਰੋੜੋਂ ਕ੍ਰਿਪਨ ਅਰਥਾਤ ਸੂਮ ਔ ਰਿਦੇ ਕੇ ਕਠੋਰ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਰੋੜਾਂ (ਮਨੁੱਖ) ਸ਼ੂਮ ਤੇ ਪੱਥਰ-ਦਿਲ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਰਪਨ = ਕੰਜੂਸ। ਕਠੋਰ = ਸਖ਼ਤ-ਦਿਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones son miserables avaros de duro corazón."