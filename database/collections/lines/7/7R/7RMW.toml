data = "ਤਰੁ ਸਣੈ ਸਮੂਲ ਉਪਾਰਹਿਗੇ ॥੩੪੨॥"
page = 234

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The corpses will be scattered on the earth and the great warriors will uproot the trees.342."

[[content]]
