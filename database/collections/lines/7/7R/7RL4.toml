[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਸਗਾ; ਅਸ ਉਸਗਾ ॥"
page = 693
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Everything is of that Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਚੀਜ਼ ਓਸ ਸੁਆਮੀ ਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All that is, is His."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਿਖ! (ਅਸਗਾ) ਇਸ ਜੀਵ ਕਾ ਜੀਵ ਭਾਵ ਔਰ (ਉਸਗਾ) ਉਸ ਈਸ੍ਵਰ ਕਾ ਈਸਰ ਭਾਵ ਤਿਆਗ ਕਰ ਦੋਨੋਂ ਏਕ ਰੂਪ (ਅਸ) ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਮਾਇਆ ਦਾ ਅਤੇ ਉਸ ਅਕਾਲ ਪੁਰਖ ਦਾ (ਮੇਲ ਹੋਇਆ) (\"ਕਰਿ ਆਸਣੁ ਡਿਠੋ ਚਾਉ\")।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਸ ਗਾ = ਇਸ ਦਾ। ਅਸ = ਅਤੇ। ਉਸ ਗਾ = ਉਸ ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues este mundo es el Jardín del Señor que baila Su Melodía"