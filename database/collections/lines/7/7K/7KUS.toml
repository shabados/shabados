[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਰਗੁ ਸੰਤਿ ਬਤਾਇਆ; ਤੂਟੇ ਜਮ ਜਾਲ ॥੧॥"
page = 819
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saint has shown me the way and the death's noose is cut for me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਨੇ ਮੈਨੂੰ ਰਸਤਾ ਵਿਖਾਲ ਦਿੱਤਾ ਹੈ ਅਤੇ ਮੇਰੇ ਲਈ ਮੌਤ ਦੀ ਫਾਹੀ ਕੱਟੀ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Saint has shown me the Way, and the noose of Death has been cut away. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਨੇ (ਮਾਰਗੁ) ਰਸਤਾ ਦਸਿਆ ਹੈ, ਤਿਸ ਕਰ ਜਮ ਕੇ ਜਾਲ ਸਭ ਟੂਟ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਗੁਰੂ ਨੇ (ਸਹੀ ਜੀਵਨ ਦਾ) ਰਸਤਾ ਦੱਸ ਦਿੱਤਾ, ਉਸ ਦੀਆਂ ਜਮ ਵਾਲੀਆਂ ਸਾਰੀਆਂ ਫਾਹੀਆਂ ਟੁੱਟ ਜਾਂਦੀਆਂ ਹਨ (ਉਸ ਦੇ ਉਹ ਮਾਨਸਕ ਬੰਧਨ ਟੁੱਟ ਜਾਂਦੇ ਹਨ, ਜੇਹੜੇ ਆਤਮਕ ਮੌਤ ਲਿਆਉਂਦੇ ਹਨ) ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਰਗੁ = (ਜੀਵਨ ਦਾ ਸਹੀ) ਰਸਤਾ। ਸੰਤਿ = ਗੁਰੂ ਨੇ, ਸੰਤ ਨੇ। ਜਮ ਜਾਲ = ਜਮ ਦੀਆਂ ਫਾਹੀਆਂ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Santo me mostró el Sendero y el mensajero de la muerte ha quitado su garra de mi cuello.(1)"