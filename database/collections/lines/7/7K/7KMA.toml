language = "pa"
data = "ਜਿੱਥੋਂ ਤੱਕ ਹੋ ਸਕੇ ਤੂੰ ਸੇਵਕ ਬਣ, ਸਾਹਿਬ ਨ ਹੋ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਤਾ ਤਵਾਨੀ ਬੰਦਾ ਸ਼ੌ ਸਾਹਿਬ ਮਬਾਸ਼ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "As far as possible, you should become an humble person like a servant, and not an arrogant master,"