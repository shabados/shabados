[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਫਿਰੀ ਆਨ ਰਾਮੰ ਸਿਰੰ ਸਰਬ ਰਾਜੰ ॥"
page = 272

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In this way sufficient time elapsed in Ram’s kingdom and Ram began to rule magnificently"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਰਾਜਿਆਂ ਦੇ ਸਿਰ ਉਤੇ ਸ੍ਰੀ ਰਾਮ ਦੀ ਮਰਯਾਦਾ ਸਥਾਪਿਤ ਹੋ ਗਈ।"