[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸੋ ਗੁਰੁ, ਸੋਈ ਸਿਖੁ ਹੈ; ਜੋਤੀ ਜੋਤਿ ਸਮਾਣੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Externally the Sikh and Guru remain as they were, but internally, the light of the one permeates the other."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਉਹੋ ਗੁਰੂ ਉਹੋ ਸਿਖ ਹੈ, ਜੋਤ ਵਿਚ ਜੋਤ ਸਮਾ ਗਈ ਹੈ, (ਭਾਵ ਇਕ ਆਸ਼ਯ ਹੈ)।"