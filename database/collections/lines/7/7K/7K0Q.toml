[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਾਗਤ ਕਾਹੇ ਕੇ ਹੇਤ, ਸੁਨੋ; ਹਮ ਹੂੰ ਤੇ ਤੂੰ ਕਿਉ ਸੁਨਿ ਗ੍ਵਾਰਿਨ ਰਾਨੀ ॥"
page = 360

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After catching Radha, Krishna spoke these nectar-like sweet words to her, “O queen of gopis! Why are you running away from me?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਪੀਆਂ ਦੀ ਰਾਣੀ! ਸੁਣ, ਤੂੰ ਮੇਰੇ ਕੋਲੋਂ ਕਿਸ ਲਈ ਭਜਦੀ ਹੈਂ।"