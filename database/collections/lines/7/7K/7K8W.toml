type = "primary"
data = "ਝਮਕਤ ਖਗ ਅਦਗ ਅਪਾਰਾ ॥੧੩॥"
page = 188

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The steel collided with the steel dreadfully and the daggers glittered with infinite beauty.13."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਵਿਚ) ਵੱਡੀ ਚਮਕ ਵਾਲੇ ਅਪਾਰਾ ਖੜਗ ਚਮਕਣ ਲਗੇ ॥੧੩॥"