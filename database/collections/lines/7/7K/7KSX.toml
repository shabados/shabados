[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਈ ਜੀਉ. ਨ ਵਜਦਾ; ਜਿਸੁ ਅਲਹੁ ਕਰਦਾ ਸਾਰ ॥੧੧੦॥"
page = 1383
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that person alone dances not, who is under the Lord's care."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਜੀਵ ਹੀ ਨਾਚ ਨਹੀਂ ਕਰਦਾ, ਜਿਸ ਦੀ ਸੁਆਮੀ ਰਖਵਾਲੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That soul alone does not dance with it, who is under the care of the Lord God. ||110||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਜਿਸ ਕੀ ਵੋਹ ਆਪ ਅਲਖ ਵਾ ਪਵਿਤ੍ਰ ਸਰੂਪ ਸਮਾਲ ਕਰਤਾ ਹੈ, ਭਾਵ ਯੇਹ ਜਿਸ ਕੋ ਅਪਨਾ ਜਾਨ ਕਰ ਕੇ ਰਖ ਲੇਤਾ ਹੈ। ਸੋ ਜੀਵ ਅਗਿਆਨ ਅਨੁਸਾਰ ਚੇਸਟਾ ਨਹੀਂ ਕਰਤਾ, ਸ਼ਾਸਤ੍ਰ ਅਨੁਸਾਰ ਚੇਸਟਾ ਕਰਤਾ ਹੈ॥੧੧੦॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ (ਭਾਗਾਂ ਵਾਲਾ) ਜੀਵ (ਮਾਇਆ ਦਾ ਵਜਾਇਆ ਹੋਇਆ) ਨਹੀਂ ਵੱਜਦਾ, ਜਿਸ ਦੀ ਸੰਭਾਲ (ਰਾਖੀ) ਪਰਮਾਤਮਾ ਆਪ ਕਰਦਾ ਹੈ (ਸੋ, ਅੰਮ੍ਰਿਤ ਵੇਲੇ ਉੱਠ ਕੇ ਉਸ ਦੀ ਯਾਦ ਵਿਚ ਜੁੜ, ਤਾਕਿ ਤੇਰੀ ਭੀ ਸੰਭਾਲ ਹੋ ਸਕੇ) ॥੧੧੦॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸੁ = ਜਿਸ ਦੀ। ਸਾਰ = ਸੰਭਾਲ। ਅਲਹੁ = ਪਰਮਾਤਮਾ ॥੧੧੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero el Alma que está bajo la protección del Señor Dios, no baila al mismo son. (110)"