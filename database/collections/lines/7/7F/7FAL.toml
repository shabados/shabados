[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇਵਕ ਕਉ; ਗੁਰੁ ਸਦਾ ਦਇਆਲ ॥"
page = 286
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto his attendant the Guru is ever merciful."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਟਹਿਲੂਏ ਉਤੇ ਗੁਰੂ ਜੀ ਹਮੇਸ਼ਾਂ ਮਿਹਰਬਾਨ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru is always merciful to His servant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਸਤਿਗੁਰੂ ਸੇਵਕੋਂ ਪਰ ਸਦਾ ਦਿਆਲੂ ਰਹਿਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਆਪਣੇ ਸੇਵਕ ਉਤੇ ਸਦਾ ਮੇਹਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ, ਉਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Le ayuda a purificar su mente mal encausada"