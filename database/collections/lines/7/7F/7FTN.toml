[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਮੁਕਤਾ; ਸਾਗਰ ਸੰਸਾਰਾ ॥"
page = 101
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "is delivered from the world ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਜਗਤ ਸਮੁੰਦਰ ਤੋਂ ਮੁਕਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Is liberated from the world-ocean."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪੁਰਸ਼ ਸੰਸਾਰ ਸਮੁੰਦ੍ਰ ਸੇ (ਮੁਕਤਾ) ਛੂਟ ਜਾਤਾ ਹੈ, ਭਾਵ ਪਾਰ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਇਸ ਸੰਸਾਰ-ਸਮੁੰਦਰ (ਦੇ ਵਿਕਾਰਾਂ) ਤੋਂ ਮੁਕਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਕਤਾ = ਵਿਕਾਰਾਂ ਤੋਂ ਆਜ਼ਾਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno es llevado a través de este mar de la existencia."