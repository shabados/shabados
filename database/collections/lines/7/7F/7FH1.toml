[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਪਰੁ ਪਹਿਰਿ; ਕਰਹਿ ਸਂ‍ੀਗਾਰਾ ॥"
page = 1165
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "wears fine clothes and adorns herself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੋਹਣੇ ਕਪੜੇ ਪਾਉਂਦੀ ਤੇ ਆਪਣੇ ਆਪ ਨੂੰ ਸ਼ਿੰਗਾਰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "wearing beautiful clothes, decorated and adorned."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਵਹੁ ਸੁੰਦਰ ਬਸਤ੍ਰ ਪਹਰ ਕੇ ਨਾਨਾ ਸਿੰਗਾਰ ਕਰਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸੁਹਣੀ ਸੁਹਣੀ) ਪੁਸ਼ਾਕ ਪਾ ਕੇ ਸਿੰਗਾਰ ਕਰਦੀਆਂ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ella se encuentra atractiva y sensual y baila para envolver y cautivar,"