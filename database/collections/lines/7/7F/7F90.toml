[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਸਤਤਿ ਮਨ ਮਹਿ; ਕਰਿ ਨਿਰੰਕਾਰ ॥"
page = 281
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Utter the praise of the Formless One in thy heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਦਿਲ ਅੰਦਰ ਆਕਾਰ-ਰਹਤਿ ਪੁਰਖ ਦਾ ਜੱਸ ਉਚਾਰਣ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Praise the Formless Lord in your mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮਨ ਕੇ ਬੀਚ ਤਿਸ ਨਿਰੰਕਾਰ ਕੀ ਹੀ ਉਸਤਤੀ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਅੰਦਰ ਅਕਾਲ ਪੁਰਖ ਦੀ ਵਡਿਆਈ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਸਤਤਿ = ਵਡਿਆਈ, ਸਿਫ਼ਤਿ-ਸਾਲਾਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Permite que tu mente recite las Alabanzas del Señor; oh mente mía,"