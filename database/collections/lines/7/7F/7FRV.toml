type = "primary"
data = "ਜਨੁ ਬਿਜੁਲ ਜੁਆਲ ਕਰਾਲ ਕਸੈ ॥੪੭੪॥"
page = 599

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thousands of swords were looking magnificent and it appeared that the snakes were stinging every limb, the swords seemed smiling like the flash of the dreadful lightning.474."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਬਿਜਲੀ ਦੀ ਭਿਆਨਕ ਲਾਟ (ਲਕੀਰ) ਖਿਚੀ ਗਈ ਹੋਵੇ ॥੪੭੪॥"