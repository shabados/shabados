[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਪਾਵ ਛੋਡਿ; ਗਹੁ ਤਿਸ ਕੀ ਓਟ ॥"
page = 177
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Abandon contrivances and grasp His protection."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀਆਂ ਯੁਕਤੀਆਂ ਤਿਆਗ ਤੇ ਉਸ ਦੀ ਪਨਾਹ ਪਕੜ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Abandon your clever devices, and grasp hold of His Support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਸਭ ਉਪਾਵ ਛੋਡ ਕੇ ਤਿਸ ਕੀ ਸ਼ਰਣ ਗ੍ਰਹਣ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਹੀਲੇ-ਜਤਨ ਛੱਡ ਕੇ ਉਸ ਪਰਮਾਤਮਾ ਦਾ ਆਸਰਾ-ਪਰਨਾ ਫੜ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਪਾਵ = (ਲਫ਼ਜ਼ 'ਉਪਾਉ' ਤੋਂ ਬਹੁ-ਵਚਨ। ਸੰਸਕ੍ਰਿਤ ਲਫ਼ਜ਼ ਹੈ उपाय) ਢੰਗ, ਜਤਨ। ਗਹੁ = ਫੜ। ਓਟ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "haz a un lado tus demás esfuerzos,"