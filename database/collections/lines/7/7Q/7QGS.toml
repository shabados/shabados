type = "primary"
data = "ਤਾ ਤੇ ਦੁਰਾਚਾਰ ਕਛੁ ਕਰਿਯੈ ॥"
page = 850

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘And Brahmins (priests) would not accept alms through my hands and populace would taunt me.(5)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਲਈ ਕੁਝ ਦੁਰਾਚਾਰ ਕਰ ਕੇ (ਪੁੱਤਰ ਪੈਦਾ ਕਰੀਏ)"