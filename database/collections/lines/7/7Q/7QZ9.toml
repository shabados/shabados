[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਧੁ ਜੇਵਡੁ; ਮੈ ਹੋਰੁ. ਨ ਕੋਈ ॥"
page = 112
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As great as Thou, I see none else."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਜਿੱਡਾ ਵੱਡਾ ਮੈਨੂੰ ਹੋਰ ਕੋਈ ਨਹੀਂ ਦਿਸਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "For me, there is no other as Great as You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਜੈਸੇ ਵੱਡਾ ਮੇਰੇ ਕੋ ਔਰ ਕੋਈ ਨਹੀਂ ਦ੍ਰਿਸਟਿ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰੇ ਬਰਾਬਰ ਦਾ ਮੈਨੂੰ ਕੋਈ ਹੋਰ ਨਹੀਂ ਦਿੱਸਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nadie se encuentra tan elevado como Tú, mi Señor;"