[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਧਸੰਗਤਿ ਰਹਰਾਸਿ, ਪੈਰੀਂ ਪਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Maintaining the discipline of the holy congregation has come to fall at the feet (of the Guru)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤਿ ਦੀ ਰਹੁਰੀਤ ਪੈਰੀਂ ਪੈਣਾ ਹੈ, (ਭਾਵ ਨਿਰਭਿਮਾਨ ਰਹਿੰਦੇ ਹਨ)।"