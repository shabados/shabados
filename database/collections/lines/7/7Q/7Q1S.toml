[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁੰਦਰ ਮੰਦਰ ਸੈਣਹ; ਜੇਣ ਮਧੵ ਹਰਿ ਕੀਰਤਨਹ ॥"
page = 1360
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Beauteous is that palace, in which the Lord's praises are sung."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੋਹਣਾ ਹੈ ਉਹ ਮਹਲ, ਜਿਸ ਅੰਦਰ ਸੁਆਮੀ ਦਾ ਜਸ ਗਾਇਨ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That palace is beautiful, in which the Kirtan of the Lord's Praises are sung."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਬੀਚ ਹਰੀ ਕਾ ਕੀਰਤਨ ਹੋਤਾ ਹੈ (ਸੈਣਹ) ਸੋਈ ਮੰਦਰ ਸੁੰਦਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਘਰਾਂ ਵਿਚ ਵੱਸਣਾ ਹੀ ਸੁਹਾਵਣਾ ਹੈ ਜਿਨ੍ਹਾਂ ਵਿਚ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਹੁੰਦੀ ਹੋਵੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਦਰ = ਘਰ (मन्दिर = a dwelling)। ਸੈਣਹ = ਸੌਣਾ, ਵੱਸਣਾ (स्वप्ह= to lie down, to rest)। ਜੇਣ ਮਧ੍ਯ੍ਯ = ਜਿਨ੍ਹਾਂ ਦੇ ਅੰਦਰ (येनां मध्ये)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ese lugar donde el Kirtan de las Alabanzas del Señor son entonadas,"