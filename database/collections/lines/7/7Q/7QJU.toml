[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਠਵੈ; ਕ੍ਰੋਧੁ ਹੋਆ ਤਨ ਨਾਸੁ ॥"
page = 137
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the eighth stage his body is wasted in wrath."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਠਵੀਂ ਹਾਲਤ ਵਿੱਚ ਉਸ ਦੀ ਦੇਹਿ ਗੁੱਸੇ ਅੰਦਰ ਬਰਬਾਦ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "eighth, he becomes angry, and his body is consumed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਠਵੇਂ ਏਹ ਦਸ਼ਾ ਹੂਈ ਕੇ ਬੁਢੇਪੇ ਮੇਂ ਕ੍ਰੋਧੁ ਅਧਿਕ ਹੂਆ ਔਰ ਸਰੀਰ (ਨਾਸੁ) ਖੀਣ ਹੂਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਠਵੀਂ ਅਵਸਥਾ ਵਿਚ (ਜੀਵ ਦੇ ਅੰਦਰ) ਗੁੱਸਾ (ਪੈਦਾ ਹੁੰਦਾ ਹੈ ਜੋ) ਸਰੀਰ ਦਾ ਨਾਸ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Después su cuerpo envejece y se retuerce de rabia,"