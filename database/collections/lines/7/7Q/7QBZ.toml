[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਮਲੀ ਹੋਇ, ਸੁ ਮਜਲਸ ਆਵੈ ॥੧੩॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Its addicts come to parties to sip it."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਅਮਲ ਦਾ) ਅਮਲੀ ਹੋਵੇ ਉਸੇ ਹੀ ਮਜਲਸ ਵਿਚ ਰਲਦਾ ਹੈ।"