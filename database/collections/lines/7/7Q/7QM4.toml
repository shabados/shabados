[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਪ੍ਰਭ; ਰਹਨੁ. ਨ ਜਾਇ. ਘਰੀ ॥"
page = 1215
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Lord, I can live not even for a moment."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਬਗੈਰ, ਮੈਂ ਇਕ ਮੁਹਤ ਭਰ ਭੀ ਰਹਿ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without God, I cannot survive, even for an instant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਸੇ ਬਿਨਾ ਮੇਰੇ ਸੇ ਘਰੀ ਭੀ ਰਹਾ ਨਹੀਂ ਜਾਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੀ ਯਾਦ ਤੋਂ ਬਿਨਾ ਇਕ ਘੜੀ ਭੀ ਨਹੀਂ ਰਹਿ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਰੀ = (ਇਕ) ਘੜੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin Dios no puedo estar ni por un instante, sí, sólo Él está en Perfecto Éxtasis,"