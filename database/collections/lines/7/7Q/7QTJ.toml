[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹਰੇ ਸਰਬ ਗਰਬੰ ਕਰੇ ਪੁਰਬ ਭਾਰੀ ॥੬੮੭॥"
page = 272

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The kings were sent to far off places with to canopy of Ram, they smashed the pride of all and arranged festivities.687."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਭ ਦੇ ਹੰਕਾਰ ਖ਼ਤਮ ਕਰ ਦਿੱਤੇ ਗਏ ਅਤੇ ਵੱਡੇ ਜਸ਼ਨ ਮਨਾਏ ਗਏ ॥੬੮੭॥"