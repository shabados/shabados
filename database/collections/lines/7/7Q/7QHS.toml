[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮ ਕੀ ਮਹਿਮਾ; ਸੰਤ ਰਿਦ ਵਸੈ ॥"
page = 265
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The praise of the Name abides within the mind of the saint."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੀ ਉਸਤਤੀ ਸਾਧੂ ਦੇ ਚਿੱਤ ਅੰਦਰ ਨਿਵਾਸ ਰਖਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Glory of the Naam abides in the hearts of His Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਕੀ ਮਹਿਮਾ ਸੰਤੋਂ ਕੇ ਰਿਦੇ ਮੇਂ ਵਸਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਦੇ) ਨਾਮ ਦੀ ਵਡਿਆਈ ਸੰਤਾਂ ਦੇ ਹਿਰਦੇ ਵਿਚ ਵੱਸਦੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Santo sabe como glorificar el Nombre,"