type = "primary"
data = "ਪੌਤ੍ਰ ਬਧੂ ਲੈ ਡੇਰਨ ਆਯੋ ॥"
page = 516

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Krishna also made them understand and came to his place taking his daughter-in-law with him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪੋਤਰੇ ਦੀ ਵਹੁਟੀ ਲੈ ਕੇ (ਆਪਣੇ) ਡੇਰੇ ਵਚ ਆ ਗਏ।"