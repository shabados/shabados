[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਵਨੁ ਜੋਧੁ; ਜੋ ਕਾਲੁ ਸੰਘਾਰੈ ॥"
page = 943
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Q. 61: Who is the warrior, that slays death?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰ. 61: ਉਹ ਕਿਹੜਾ ਸੂਰਮਾ ਹੈ ਜੋ ਮੌਤ ਨੂੰ ਮਾਰ ਮੁਕਾਉਂਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who is the warrior, who conquers Death?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਕਵਨੁ (ਜੋਧੁ) ਸੂਰਮਾਂ ਹੈ, ਜੋ ਕਾਲ ਕੋ (ਸੰਘਾਰੈ) ਮਾਰਤਾ ਹੈ ੫?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਕੇਹੜਾ ਸੂਰਮਾ ਹੈ ਜੋ ਮੌਤ ਨੂੰ (ਮੌਤ ਦੇ ਭਉ ਨੂੰ) ਮਾਰ ਲੈਂਦਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋਧੁ = ਸੂਰਮਾ। ਸੰਘਾਰੈ = ਮਾਰ ਦੇਵੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Quién es el guerrero que vence a la muerte?"