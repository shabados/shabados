[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਹਾ ਅਨੰਦੁ ਸਹਜੁ ਭਇਆ; ਮਨਿ ਤਨਿ ਸੁਖੁ ਪਾਇਆ ॥"
page = 441
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I naturally got exceedingly delighted and obtain the peace of mind and body."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸੁਭਾਵਕ ਹੀ ਪਰਮ ਪ੍ਰਸੰਨ ਹੋ ਗਿਆ ਅਤੇ ਮੈਨੂੰ ਦਿਲ ਅਤੇ ਦੇਹਿ ਦਾ ਆਰਾਮ ਪ੍ਰਾਪਤ ਹੋ ਗਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I became so very blissful, and my mind and body found such a natural peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਿਸ ਪਿਆਰੇ ਕੇ ਆਗਮਨ ਕਰ ਕੇ ਸ੍ਵਭਾਵਕ (ਮਹਾ ਅਨੰਦੁ) ਬ੍ਰਹਮਾਨੰਦ ਪ੍ਰਾਪਤ ਹੋਤਾ ਭਇਆ ਹੈ ਔਰ ਮਨ ਤਨ ਮੇਂ ਸੁਖ ਪ੍ਰਾਪਤ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਅੰਦਰ ਬੜਾ ਆਨੰਦ ਪੈਦਾ ਹੋਇਆ, ਮੇਰੇ ਅੰਦਰ ਆਤਮਕ ਅਡੋਲਤਾ ਪੈਦਾ ਹੋ ਗਈ, ਮੇਰੇ ਮਨ ਨੇ ਮੇਰੇ ਹਿਰਦੇ ਨੇ ਸੁਖ ਅਨੁਭਵ ਕੀਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜੁ = ਆਤਮਕ ਅਡੋਲਤਾ। ਮਨਿ = ਮਨ ਨੇ। ਤਨਿ = ਤਨ ਨੇ, ਹਿਰਦੇ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dentro de mí habita la inmensa Paz y el Éxtasis, y mi mente y mi cuerpo han sido refrescados."