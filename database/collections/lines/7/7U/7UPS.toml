type = "primary"
data = "ਹੋ ਤਬ ਯਾ ਕੇ ਖਾਇਨ ਪਰ; ਦ੍ਰਿਸਟਿ ਸੁ ਕੀਜਿਯੋ ॥੫॥"
page = 861

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "You go and try to chew his testicles.’(5)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਉਸ ਦੇ ਅੰਡਕੋਸ਼ ਉਤੇ ਅੱਖ ਰਖੋ ॥੫॥"