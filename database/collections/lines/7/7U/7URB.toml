[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਾ ਸਤਿਗੁਰੁ ਤਾਂ ਮਿਲੈ; ਜਾਂ ਨਦਰਿ ਕਰੇਈ ॥"
page = 424
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If the Lord casts His merciful glance, then alone the perfect Guru is met."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਸਾਹਿਬ ਆਪਣੀ ਮਿਹਰ ਦੀ ਨਿਗ੍ਹਾ ਧਾਰੇ, ਕੇਵਲ ਤਦ ਹੀ ਪੂਰਨ ਗੁਰੂ ਜੀ ਮਿਲਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One meets the Perfect True Guru only when the Lord bestows His Glance of Grace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਪੂਰਾ ਸਤਿਗੁਰ ਤਬ ਮਿਲਤਾ ਹੈ, ਜਬ ਵਾਹਗੁਰੂ ਦ੍ਰਿਸ੍ਟ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਪੂਰਾ ਗੁਰੂ ਭੀ ਤਦੋਂ ਹੀ ਮਿਲਦਾ ਹੈ, ਜਦੋਂ ਪਰਮਾਤਮਾ ਆਪ ਮੇਹਰ ਦੀ ਨਿਗਾਹ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰੇਈ = ਕਰੇਇ, ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando por la Misericordia del Señor encuentras al Perfecto Guru,"