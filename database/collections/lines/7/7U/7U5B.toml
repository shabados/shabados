[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਚੀ ਸਉਦੀ; ਤੋਟਾ ਆਵੈ ॥"
page = 1032
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Loss accrues from the false dealings,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੂੜੇ ਵਣਜ ਵਾਪਾਰ ਦੁਆਰਾ ਘਾਟਾ ਪੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The false dealings lead only to loss."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਚੇ ਝੂਠੇ ਮਾਇਕ ਸੌਦੇ ਸੇ ਤੋਟਾ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਿਰੇ ਮਾਇਆ ਵਾਲੇ ਹੋਛੇ ਵਣਜ ਕੀਤਿਆਂ (ਆਤਮਕ ਜੀਵਨ ਵਿਚ) ਘਾਟਾ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਉਦੀ = ਸੌਦਿਆਂ ਵਿਚ। ਤੋਟਾ = ਘਾਟਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno pierde de seguro si uno tiene demasiadas preocupaciones,"