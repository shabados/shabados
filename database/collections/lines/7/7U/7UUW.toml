[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਤੂ. ਤਾ ਮੈ ਸਭੁ ਕੋ; ਤੂ ਸਾਹਿਬੁ. ਮੇਰੀ ਰਾਸਿ ਜੀਉ ॥"
page = 762
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When I have Thee, then have I every-thing Thou O Lord, art capital."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਤੂੰ ਮੇਰਾ ਹੈ, ਤਦ ਹਰ ਸ਼ੈ ਮੇਰੀ ਹੈ, ਤੂੰ ਹੀ, ਹੇ ਸੁਆਮੀ! ਮੇਰੀ ਪੂੰਜੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When I have You, then I have everything. O my Lord and Master, You are my wealth and capital."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਰਮੇਸਰ! ਜਾਂ ਤੂੰ ਮੇਰਾ ਰਖਕ ਹੈ ਤਾਂ ਮੇਰਾ ਸਭੁ ਕੋਈ ਹਿਤੂ ਹੀ ਹੈ ਅਰ ਤੂੰ ਹੀ ਮੇਰਾ ਸਹਿਬ ਹੈਂ ਅਰੁ ਮੇਰੀ ਪੂੰਜੀ ਭੀ ਤੂੰਹੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜਦੋਂ ਤੂੰ (ਮੇਰੇ ਵਲ ਹੁੰਦਾ ਹੈਂ) ਤਦੋਂ ਹਰੇਕ ਜੀਵ ਮੈਨੂੰ (ਆਦਰ ਦੇਂਦਾ ਹੈ)। ਤੂੰ ਹੀ ਮੇਰਾ ਮਾਲਕ ਹੈਂ, ਤੂੰ ਹੀ ਮੇਰਾ ਸਰਮਾਇਆ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ = ਜਦੋਂ। ਤਾ = ਤਦੋਂ। ਸਭੁ ਕੋ = ਹਰੇਕ ਜੀਵ। ਰਾਸਿ = ਪੂੰਜੀ, ਸਰਮਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando Estás conmigo, yo logro todo; Tú, oh Señor, eres mi Maestro, mi único Capital."