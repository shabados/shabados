data = "ਤੁਹਿ ਤਸਕਰ, ਜਮਧਾਮ ਪਠੈ ਹੈ ॥੩॥"
page = 837

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "People shouted at him and expressed that he should be sent to the hell.(3)"

