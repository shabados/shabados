[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਮੁਲੁ ਬਖਸੀਸ; ਅਮੁਲੁ ਨੀਸਾਣੁ ॥"
page = 5
line = 17

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਵਿਸ਼ੇਸ਼ ਧੁਨੀ: ਬਖਸੀਸ, ਨੀਸਾਣੁ - ਖਖੇ ਤੇ ਸਸੇ ਦੇ ਪੈਰਾਂ ਵਿਚ।"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Priceless are Thine gifts and priceless Thy mark of approval."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨਮੁਲ ਹਨ ਤੇਰੀਆਂ ਦਾਤਾਂ ਅਤੇ ਅਨਮੁਲ ਹੈ ਤੇਰੀ ਪਰਵਾਨਗੀ ਦਾ ਚਿੰਨ੍ਹ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Priceless are His Blessings, Priceless is His Banner and Insignia."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਕਾ ਉਪਦੇਸ ਰੂਪੁ ਜੋ ਬਖਸੀਸ ਹੈ, ਸੋ ਭੀ ਅਮੋਲੁ ਹੈ, ਤਿਸ ਕਰ ਜੋ ਆਤਮਾ ਕਾ (ਨੀਸਾਣੁ) ਪ੍ਰਗਟ ਹੋਣਾ ਸੋ ਬੀ ਅਮੋਲੁ ਹੈ। ਵਾ ਭਗਤੀ ਕਾ (ਨੀਸਾਣੁ) ਚਿੰਨ੍ਹ ਜੋ ਸਤਗੁਰੋਂ ਨੇ ਦੀਆ ਹੈ, ਸੋ ਭੀ ਅਮੋਲੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਬਖ਼ਸ਼ਸ਼ ਤੇ ਬਖ਼ਸ਼ਸ਼ ਦੇ ਨਿਸ਼ਾਨ ਭੀ ਅਮੋਲਕ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਖਸੀਸ = ਰਹਿਮਤ, ਦਇਆ। ਨੀਸਾਣੁ = ਅਕਾਲ ਪੁਰਖ ਦੀ ਬਖਸ਼ਸ਼ ਦਾ ਨਿਸ਼ਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "incontables tus misericordias, e incalculable tu Escudo e Insignia."