[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੇਤੜਿਆਂ ਹੀ ਕੋਰਚੀ; ਆਮਲੁ ਪੋਸ ਸਿਲਹ ਸੁਖਦਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many are the keepers of army store and many are officers who wear comfortable suit of armor."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਿਤਨੇ ਹੀ ਬਸਤਨੀਏਂ ਹਾਕਮ ਤੇ ਸੰਜੋਅ ਪਹਿਨਣ ਵਾਲੇ (ਪਰਜਾ ਨੂੰ) ਸੁਖ ਦੇਣ ਵਾਲੇ ਹਨ।"