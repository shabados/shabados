[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੂਝੈ ਬੂਝਨਹਾਰੁ. ਬਿਬੇਕ ॥"
page = 285
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Only an acute discerner understands it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤੀਬਰ ਵੀਚਾਰਵਾਨ ਹੀ ਇਸ ਨੂੰ ਸਮਝਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is understood only by one of discerning understanding."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਮਝਣ ਹਾਰਾ ਜਗ੍ਯਾਸੂ ਇਸ ਬਿਬੇਕ ਕਉ ਸਮਝਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਇਸ ਵਿਚਾਰ ਨੂੰ ਵਿਚਾਰਨ ਵਾਲਾ (ਕੋਈ ਵਿਰਲਾ) ਸਮਝਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਬੇਕ = ਵਿਚਾਰ, ਪਰਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no puede decirse para ser separado."