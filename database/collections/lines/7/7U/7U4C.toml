[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਉ; ਤੁਮ ਦੀਨੀ ਪ੍ਰਭ ਧੀਰ ॥"
page = 188
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, whom though givest Thy consolation,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਜਿਸ ਨੂੰ ਤੂੰ ਆਪਣਾ ਦਿਲ ਦਿੰਦਾ ਹੈਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those, unto whom You give Your consolation, God"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜਿਸ ਕੋ ਤੈਨੇ ਧੀਰਜਤਾ ਦਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਤੂੰ ਧੀਰਜ ਦਿੱਤੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਧੀਰ = ਧੀਰਜ, ਸਹਾਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél cuyo Consuelo eres Tú,"