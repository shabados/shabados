[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਲੰਕੰ ਬਿਨਾ ਨੇਕਲੰਕੀ ਸਰੂਪੇ ॥"
page = 3
line = 16

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਆਪ ਕਲੰਤ ਤੋਂ ਬਿਨਾ ਹੋ ਤੇ ਕਲੰਕ ਰਹਿਤ ਸਰੂਪ ਹੋ।"

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Salutation to Thee O Supreme Sovereign Lord! Salutation to Thee O Most Beautiful Lord!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਲੰਕ-ਰਹਿਤ, ਨਿਸ਼ਕਲੰਕ ਸਰੂਪ ਵਾਲੇ,"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਕਲੰਕੰ ਬਿਨਾ; ਨੇਕਲੰਕੀ ਸਰੂਪੇ ॥"