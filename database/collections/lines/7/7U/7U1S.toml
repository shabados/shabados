[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਹੁ ਕਹਿਯੋ ਉਨ ਕੀ ਪਤਨੀ ਪਹਿ; ਬਿਪ ਬਡੇ ਮਤਿ ਕੇ ਅਤਿ ਬਉਰੇ ॥"
page = 324

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing them very hungry, Krishna said, “You may do this: go to the wives of Brahmins, these Brahmins have low intellect"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕ੍ਰਿਸ਼ਨ ਨੇ) ਕਿਹਾ, ਤੁਸੀਂ ਉਨ੍ਹਾਂ ਬ੍ਰਾਹਮਣਾਂ ਦੀਆਂ ਇਸਤ੍ਰੀਆਂ ਕੋਲ ਜਾਉ (ਅਤੇ ਖਾਣ ਲਈ ਭੋਜਨ ਮੰਗੋ।) ਇਹ ਬ੍ਰਾਹਮਣ ਤਾਂ ਬਹੁਤ ਪਾਗਲ ਹਨ"