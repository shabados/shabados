[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕ੍ਰਿਪਾਲ; ਦਇਆ ਮਇਆ ਧਾਰਿ ॥"
page = 1305
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Benevolent Lord, show Thou mercy and compassion unto me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਿਹਰਬਾਨ ਮਾਲਕ! ਤੂੰ ਮੇਰੇ ਉਤੇ ਰਹਿਮਤ ਅਤੇ ਮਿਹਰ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Merciful Lord, please bless me with Your Kindness and Compassion."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਕ੍ਰਿਪਾਲ! ਮੇਰੇ ਪੁਰ ਅਤੀ ਕ੍ਰਿਪਾ ਧਾਰਨ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਿਰਪਾ ਦੇ ਸੋਮੇ ਪ੍ਰਭੂ! (ਮੇਰੇ ਉਤੇ ਸਦਾ) ਮਿਹਰ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕ੍ਰਿਪਾਲ = ਹੇ ਕਿਰਪਾਲ! ਮਇਆ ਧਾਰਿ = ਮਿਹਰ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el Señor Fascinante, Misericordioso con el desamparado y el humilde."