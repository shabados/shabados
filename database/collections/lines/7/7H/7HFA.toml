[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਬਿਨੁ ਦੂਜਾ; ਅਵਰੁ. ਨ ਕੋਊ ॥"
page = 1001
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without Him, there is not any other second."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਬਾਝੌਂ ਹੋਰ ਦੂਸਰਾ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is none other than Him at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਨੋਂ ਸੰਤੋਂ ਨੇ ਤਿਸ ਵਾਹਿਗੁਰੂ ਬਿਨਾਂ ਔਰ ਦੂਸਰਾ ਕੋਈ ਨਹੀਂ ਜਾਨਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਤੋਂ ਬਿਨਾ ਉਹਨਾਂ ਨੂੰ ਹੋਰ ਕੋਈ ਸਹਾਰਾ ਨਹੀਂ ਦਿੱਸਦਾ (ਜੋ ਸਦਾ ਕਾਇਮ ਰਹਿ ਸਕੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਊ = ਕੋਈ ਭੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues sin Él, mi Único Dios, no hay nadie más,"