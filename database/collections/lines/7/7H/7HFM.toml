[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਵ ਹਿਤ ਧਰੀ ਬਨਾਇ ਕੈ; ਚਲਹੁ ਮਿਠਾਈ ਖਾਹੁ ॥੧੩॥"
page = 914

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘I have prepared sweetmeats for you, come and relish some.’(13)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਮੈਂ) ਤੁਹਾਡੇ ਲਈ ਮਠਿਆਈ ਬਣਾਈ ਹੈ, ਚਲ ਕੇ ਉਸ ਨੂੰ ਖਾਓ ॥੧੩॥"