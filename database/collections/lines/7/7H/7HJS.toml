[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੀਆ ਆਦਰੁ. ਲੀਆ ਬੁਲਾਇ ॥੨॥"
page = 1159
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the latter respects and welcomes the rich-man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗਰੀਬ ਧਨੀ ਦੀ ਇਜ਼ਤ ਅਤੇ ਆਉਭਗਤ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the poor man welcomes him with respect. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਵਹੁ ਆਗੇ ਤੇ ਆਦਰ ਦੇ ਕਰ ਬੁਲਾਇ ਲੀਆ ਕਰਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਦਰ ਦੇਂਦਾ ਹੈ, ਜੀ-ਆਇਆਂ ਆਖਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "éste lo honra y le da la bienvenida. (2)"