[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਧਿਕ ਮਹੀਨੋ ਅਪਨ ਕਰਾਯੋ ॥੧੯॥"
page = 926

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He came down, cut the ear and the tail and showed to the Raja to claim more wages.(l9)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣਾ ਬਹੁਤ ਸਾਰਾ ਮਹੀਨਾ ਕਰਵਾ ਲਿਆ (ਅਰਥਾਤ ਚੰਗੀ ਤਨਖਾਹ ਲਗਵਾ ਲਈ) ॥੧੯॥"