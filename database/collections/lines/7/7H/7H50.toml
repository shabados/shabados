[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਭਾਵੈ; ਤਿਉ ਰਾਖਹਿ ਰਾਖੁ ॥"
page = 933
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As it pleases Thee, so keepest Thou us all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਤੈਨੂੰ ਚੰਗਾ ਲਗਦਾ ਹੈ ਉਸੇ ਤਰ੍ਹਾਂ ਹੀ ਤੂੰ ਸਾਨੂੰ ਸਾਰਿਆਂ ਨੂੰ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As it pleases You, You protect and preserve us."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਖਦੇ ਜੋਗ ਵਾਹਿਗੁਰੂ! ਜਿਉਂ ਤੁਮ ਕੋ ਭਾਵੈ ਤਿਉਂ ਹੀ ਹਮਾਰੇ ਕੋ ਜਨਮ ਮਰਣ ਸੇ ਰਖ ਲੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪਾਂਡੇ! ਗੋਪਾਲ ਓਅੰਕਾਰ ਅੱਗੇ ਅਰਦਾਸ ਕਰ ਤੇ ਆਖ-ਹੇ ਪ੍ਰਭੂ!) ਜਿਵੇਂ ਤੂੰ (ਮੈਨੂੰ) ਰੱਖਣਾ ਚਾਹੁੰਦਾ ਹੈਂ ਤਿਵੇਂ ਰੱਖ;"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y según Su Voluntad nos sostiene a todos."