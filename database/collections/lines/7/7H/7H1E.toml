[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਹਵ ਸਿੰਘ ਬਲੀ ਹਰਿ ਕੋ ਭਟ; ਸੋ ਤਿਹ ਉਪਰ ਕੋਪ ਕੈ ਧਾਯੋ ॥"
page = 426

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Ahav Singh, the warrior of Krishna, in his fury, fell upon Samar Singh and"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਦਾ ਸੂਰਮਾ ਆਹਵ ਸਿੰਘ, ਕ੍ਰੋਧ ਕਰ ਕੇ ਉਸ (ਸਮਰ ਸਿੰਘ) ਉਪਰ ਭਜ ਕੇ ਪਿਆ।"