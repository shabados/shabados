[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਰਤਣਿ ਵਰਤਿਆ; ਸਰਬ ਜੰਜਾਲੁ ॥"
page = 1287
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All mortals are involvements and entanglements."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਪ੍ਰਾਣੀ ਸੰਸਾਰੀ ਫਸਤਿਆਂ ਅਤੇ ਅਲਸੇਟਿਆਂ ਅੰਦਰ ਫਸੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All are involved and entangled in worldly entanglements."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਸਰਬ ਜੰਜਾਲੋਂ ਕੇ (ਵਰਤਣਿ) ਵਾਲੇ ਵਿਓਂ ਮੇਂ ਬਰਤਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਦਾ ਵਰਤਣਿ-ਵਲੇਵਾ (ਜੀਵ ਲਈ) ਸਾਰਾ ਫਾਹੀ ਬਣਦਾ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਰਤਣਿ = ਜਗਤ ਦਾ ਵਰਤਣ-ਵਲੇਵਾ। ਜੰਜਾਲੁ = ਫਾਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todo mundo está involucrado y enredado en los asuntos mundanos, y de manera equívoca,"