[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਵਕੁ ਸਗਰਾਇਆ ॥੩॥"
page = 746
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It is but all fire."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਨਿਰੀ ਪੁਰੀ ਸਾਰੀ ਅੱਗ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "it is all on fire. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਸੰਸਾਰ ਅਗਨਿ ਕਾ ਸਾਗਰ ਹੈ ਇਸ ਕੇ ਬਚਾਉ ਲੀਏ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਵਿਚ ਸਾਰੀ (ਤ੍ਰਿਸ਼ਨਾ ਦੀ) ਅੱਗ ਹੀ ਅੱਗ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਵਕੁ = (ਤ੍ਰਿਸ਼ਨਾ ਦੀ) ਅੱਗ। ਸਗਰਾਇਆ = ਸਾਰਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "hay fuego por todas partes.(3)"