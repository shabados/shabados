[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲੂਣੁ ਵਣੋਟਾ ਖਾਇ ਕੈ; ਹਥ ਜੋੜਿ ਖੜੋਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The salt eater servant always stands with folded hands."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਸ਼ਾਹ ਦਾ) ਗੁਮਾਸ਼ਤਾ ਲੂਣ ਖਾਕੇ (ਮਾਲਕ ਦੇ ਅੱਗੇ) ਹਥ ਜੋੜਕੇ ਖੜੋਂਦਾ ਹੈ।"