[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮ ਬਿਨਾ; ਕੈਸੇ ਸੁਖੁ ਲਹੀਐ ॥"
page = 200
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Name how can peace be obtained?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੇ ਬਗੈਰ, ਆਰਾਮ ਕਿਸ ਤਰ੍ਹਾਂ ਪ੍ਰਾਪਤ ਹੋ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Naam, the Name of the Lord, how anyone find peace?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਗੁਰੂ! ਤੇਰੇ ਨਾਮ ਸੇ ਬਿਨਾਂ ਕੈਸੇ ਸੁਖ ਪਾਈਏ ਅਰਥਾਤ ਨਹੀਂ ਪਾਈਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਨ ਤੋਂ ਬਿਨਾ ਕਦੇ ਸੁਖ ਨਹੀਂ ਮਿਲ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈਸੇ ਲਹੀਐ = ਕਿਵੇਂ ਲੱਭ ਸਕਦਾ ਹੈ? ਕਦੇ ਨਹੀਂ ਲੱਭ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cómo puede uno obtener Paz sin el Nombre del Señor?"