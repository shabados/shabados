[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਨ ਗਾਵਤ; ਮਨਿ ਹੋਇ ਅਨੰਦ ॥"
page = 1338
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Singing the Lord's praises, the mind is enraptured."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੀਆਂ ਸਿਫਤਾਂ ਗਾਹਿਨ ਕਰਨ ਦੁਆਰਾ ਚਿੱਤ ਪ੍ਰਸੰਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Singing His Glorious Praises, the mind is in ecstasy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਗੁਣੋਂ ਕੋ ਗਾਵਤੇ ਹੂਏ ਮਨ ਮੇਂ ਅਨੰਦ ਹੋਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦਿਆਂ ਮਨ ਵਿਚ ਆਨੰਦ ਪੈਦਾ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਾਵਤ = ਗਾਂਦਿਆਂ। ਮਨਿ = ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cantando Sus Gloriosas Alabanzas, mi mente está en Éxtasis."