[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਜਪਿਆ. ਨਾਮੁ ਰਮਾਣਾ ॥"
page = 628
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then repeated I the pervading God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਹੀ ਮੈਂ ਵਿਆਪਕ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕੀਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then I chanted the Naam, the Name of the Pervading Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਹਮਨੇ (ਰਮਾਣਾ) ਰਮਣ ਰੂਪ ਵਾਹਗੁਰੂ ਕੇ ਨਾਮ ਕੋ ਜਪਣਾ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਹੀ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪਿਆ ਜਾ ਸਕਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ = ਤਦੋਂ। ਰਮਾਣਾ = ਰਾਮ ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "habité en Su Nombre;"