data = "ਪ︀ਯਾਰੋ ਮਿਤ੍ਰ ਨ ਛੋਰਿਯੋ ਜਾਈ ॥"
page = 992

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The woman thought, too, that it would be difficult to desertthe lover."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਪਿਆਰੇ ਮਿਤਰ ਨੂੰ ਛਡਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।"