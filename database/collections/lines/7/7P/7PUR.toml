[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਯਕ ਦਾਨ ਬੇਗਾਨ ਰੇਜ਼ਦ ਜੁਦਾ ॥੯॥"
page = 1425

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘That no one can plunder even an iota of other’s rights.(9)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਉਸ ਨੂੰ ਇਕ ਵੀ ਬਾਹਰਲਾ ਦਾਣਾ ਰਲਿਆ ਦਿਖੇ, ਤਾਂ ਵਖ ਕਰ ਦਿੰਦਾ ਹੈ ॥੯॥"