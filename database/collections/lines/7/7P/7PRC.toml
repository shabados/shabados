[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕ ਤੂਹੀ. ਦੀਨ ਦਇਆਲ ॥"
page = 1119
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou alone are compassionate to the meek."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤੂੰ ਹੀ ਮਸਕੀਨ ਉਤੇ ਮਿਹਰਬਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You alone are Merciful to the meek."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਤੂੰ ਹੀ ਦੀਨੋਂ ਪਰ ਦਯਾਲਤਾ ਕਰਨੇ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦੀਨਾਂ ਉਤੇ ਦਇਆ ਕਰਨ ਵਾਲੇ! (ਮੇਰਾ) ਸਿਰਫ਼ ਤੂੰ ਹੀ (ਰਾਖਾ) ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੀਨ ਦਇਆਲ = ਹੇ ਦੀਨਾਂ ਉਤੇ ਦਇਆ ਕਰਨ ਵਾਲੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo Tú eres Compasivo con el débil,"