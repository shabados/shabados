[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਾ ਸੁਆਨ ਕਉ; ਸਿਮ੍ਰਿਤਿ ਸੁਨਾਏ ॥"
page = 481
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What avails it to read Simritis to a dog?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੁੱਤੇ ਨੂੰ ਸਿੰਮ੍ਰਿਤੀਆਂ ਪੜ੍ਹ ਕੇ ਸੁਣਾਉਣ ਦਾ ਕੀ ਫਾਇਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Why bother to read the Simritees to a dog?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੂਕਰ ਕੋ ਸਿੰਮ੍ਰੀਤੀਓਂ ਕਾ ਪਾਠ ਸੁਨਾਉਨੇ ਸੇ ਕਿਆ ਲਾਭ ਹੋਗਾ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਵੇਂ) ਕੁੱਤੇ ਨੂੰ ਸਿੰਮ੍ਰਿਤੀਆਂ ਸੁਣਾਉਣ ਦਾ ਕੋਈ ਲਾਭ ਨਹੀਂ ਹੁੰਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹਾ = ਕੀਹ ਲਾਭ? ਕੋਈ ਲਾਭ ਨਹੀਂ ਹੁੰਦਾ। ਸੁਆਨ = ਕੁੱਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué recitar los Smritis ante los perros?"