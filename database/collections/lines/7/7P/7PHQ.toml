[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਵਰ ਛੂਟੀ ਸਭ ਆਸ ॥"
page = 896
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have forsaken all other hopes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹੋਰ ਸਾਰੀਆਂ ਆਸਾਂ ਉਮੈਦਾਂ ਲਾਹ ਸੁੱਟੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have discarded all other hopes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਔਰ ਆਸ ਸਭ ਛੁਟੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਉਸ ਮਨੁੱਖ ਦੀ ਦੁਨੀਆ ਤੋਂ ਕਿਸੇ ਮਦਦ ਦੀ) ਹਰੇਕ ਆਸ ਮੁੱਕ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛੂਟੀ = ਮੁੱਕ ਗਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "descansar tu esperanza"