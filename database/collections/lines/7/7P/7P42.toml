data = "ਨ ਦੇਵੇਤਿ ਪੀਠੰ ॥੨੬੯॥"
page = 577

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The cries of “kill, kill” are being heard in all the four directions, the warriors are closing in and are not backing out.269."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਅਤੇ) ਪਿਠ ਨਹੀਂ ਵਿਖਾ ਰਹੇ ਹਨ ॥੨੬੯॥"