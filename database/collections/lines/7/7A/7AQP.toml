[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਇ ਬੁਝਾਰਤ ਸਾਰਤਾ; ਸੇ ਅਖੀ ਡਿਠੜਿਆ ॥"
page = 217
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The riddles and hints are given. The mortal sees them with his eyes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਹੇਲੀਆਂ ਤੇ ਇਸ਼ਾਰੇ ਦਿਤੇ ਗਏ ਹਨ। ਉਨ੍ਹਾਂ ਨੂੰ ਜੀਵ ਆਪਣੇ ਨੈਣਾਂ ਨਾਲ ਵੇਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The riddles and hints are given, and he sees them with his eyes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬੇਦ ਸ਼ਾਸਤ੍ਰ ਮਰਨੇ ਕੀ (ਬੁਝਾਰਤ) ਰਮਜ ਦੇਤੇ ਹੈਂ ਔਰ ਸੰਤ ਜਨ ਭੀ ਮੌਤ ਕੇ ਇਸ਼ਾਰੇ ਦੇਤੇ ਹੈਂ। ਪੁਨਾ ਸੇ ਮਰਨੇ ਜਨਮਣੇ ਕੀ ਬਾਤਾਂ ਅੱਖੀਂ ਭੀ ਦੇਖੀਆਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋਈ ਗੁਰਮੁਖਿ ਕੋਈ ਇਸ਼ਾਰਾ ਜਾਂ ਬੁਝਾਉਣੀ ਦੇਂਦਾ ਭੀ ਹੈ (ਕਿ ਇਥੇ ਸਦਾ ਨਹੀਂ ਬਹਿ ਰਹਿਣਾ, ਫਿਰ) ਉਹ ਗੱਲਾਂ ਅੱਖੀਂ ਭੀ ਵੇਖ ਲਈਦੀਆਂ ਹਨ (ਕਿ ਸਭ ਤੁਰੇ ਜਾ ਰਹੇ ਹਨ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਇ = ਦੇਂਦਾ ਹੈ। ਸਾਰਤਾ = ਇਸ਼ਾਰਾ। ਅਖੀ = ਅੱਖਾਂ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por la Gracia del Guru fui instruido, y también Lo vi con mis propios ojos,"