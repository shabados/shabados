[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਸਤਿਗੁਰੁ ਧਨੁ ਧੰਨੁ; ਜਿਨਿ ਭਰਮ ਗੜੁ ਤੋੜਿਆ ॥"
page = 522
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Blessed! blessed! is the True Guru, who has demolished the fortress of doubt."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਬਾਰਕ! ਮੁਬਾਰਕ! ਹਨ ਉਹ ਸੱਚੇ ਗੁਰੂ ਜੀ, ਜਿਨ੍ਹਾਂ ਨੇ ਵਹਿਮ ਦਾ ਕਿਲ੍ਹਾ ਢਾਅ ਸੁੱਟਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Blessed, blessed is the True Guru, who has demolished the fortress of doubt."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਸਤਿਗੁਰ ਧੰਨ ਧੰਨ ਹੈਂ ਜਿਨੋਂ ਨੇ ਭਰਮ ਗਢ ਤੋੜ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਧੰਨ ਹੈ ਉਹ ਸਤਿਗੁਰੂ ਜਿਸ ਨੇ (ਅਸਾਡਾ) ਭਰਮ ਦਾ ਕਿਲ੍ਹਾ ਤੋੜ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਗੁਰੂ) ਨੇ। ਭਰਮ ਗੜੁ = ਭਰਮ ਦਾ ਕਿਲ੍ਹਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Gloria al Verdadero Guru, Quien ha destruido la fortaleza de mi duda."