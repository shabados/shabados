[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਰੋਮ ਰੋਮ ਵਿਚਿ ਰਖਿਓਨੁ; ਓਅੰਕਾਰ ਅਕਾਰੁ ਵਿਥਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In each particle that Lord has extended Himself."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਰੋਮ ਰੋਮ ਵਿਚ ਓਅੰਕਾਰ ਦੇ ਅਕਾਰ ਦਾ ਵਿਸਥਾਰ ਰੱਖਿਆ ਹੈ।"