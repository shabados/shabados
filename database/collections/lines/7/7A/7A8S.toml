[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਰਸ ਕਸ ਲਖ ਸੁਆਦ, ਚਖਿ ਚਖਾਵਹੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Millions taste and make others taste the edibles and inedibles."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਈ ਰਸ ਕਸਾਂ ਦੇ ਲੱਖ ਸੁਵਾਦਾਂ ਨੂੰ (ਆਪ) ਚੱਖਕੇ (ਹੋਰਾਂ ਨੂੰ) ਚਖਾਂਵਦੇ ਹਨ (ਭਾਵ ਕਈਆਂ ਨੂੰ ਭੋਜਨਾਂ ਦਾ ਹੀ ਵਿਸ਼ਾ ਪੈ ਰਿਹਾ ਹੈ)।"