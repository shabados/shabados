[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਖਿਆ ਕੀ ਬਾਸਨਾ; ਮਨਹਿ ਕਰੇਇ ॥"
page = 1172
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His desire for sins, the Lord effaces."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਪਾਪਾਂ ਦੀ ਜ਼ਾਹਿਸ਼ ਨੂੰ ਸਾਈਂ ਮੇਟ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Thus, the desire for sin and corruption is ended."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਿਸ੍ਯੋਂ ਕੀ ਵਾਸਨਾ ਕੋ (ਮਨਹਿ ਕਰੇਇ) ਹਟਾ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੇ ਅੰਦਰੋਂ) ਮਾਇਆ ਦੀ ਲਾਲਸਾ ਰੋਕ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਖਿਆ = ਮਾਇਆ। ਬਾਸਨਾ = ਲਾਲਸਾ। ਮਨਹਿ ਕਰੇਇ = ਰੋਕ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así se libera del deseo por el vicio."