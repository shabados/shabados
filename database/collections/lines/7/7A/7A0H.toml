[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਣਿ ਮਨ ਮੇਰੇ; ਤਤੁ ਗਿਆਨੁ ॥"
page = 423
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, hear thou the real Divine knowledge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ! ਤੂੰ ਅਸਲੀ ਬ੍ਰਹਿਮ ਬੀਚਾਰ ਨੂੰ ਸ੍ਰਵਣ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen, O my mind, to the essence of spiritual wisdom."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ ਤੱਤ ਗ੍ਯਾਨ ਕੋ ਸੁਨ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! (ਪਰਮਾਤਮਾ ਬਾਰੇ ਇਹ) ਇਹ ਅਸਲੀਅਤ ਦੀ ਗਲ ਸੁਣ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਤਤੁ = ਅਸਲੀਅਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, escucha la Esencia de la Sabiduría;"