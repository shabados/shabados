[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੋਵਿੰਦ ਗੁਣ ਗਾਵਹੁ; ਮੇਰੇ ਭਾਈ ॥"
page = 193
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Chant the glories of the world Lord O my brother."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਸੁਆਮੀ ਦੀ ਕੀਰਤੀ ਗਾਇਨ ਕਰੋ, ਹੇ ਮੇਰੇ ਵੀਰ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sing the Glorious Praises of the Lord of the Universe, O my Siblings of Destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਭਾਈ: ਗੋਵਿੰਦ ਕੇ ਗੁਣ ਗਾਇਨ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਭਾਈ! ਗੋਬਿੰਦ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੇ ਗੀਤ ਗਾਂਦੇ ਰਹੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਈ = ਹੇ ਭਾਈ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canta las Gloriosas Alabanzas del Señor del Universo."