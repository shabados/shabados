[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੀਤਲ ਭਏ; ਕੀਨੀ ਪ੍ਰਭ ਦਾਤਿ ॥੧॥"
page = 191
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All are rendered clam. The Lord has given His gift;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਸ਼ਾਂਤ ਹੋ ਗਏ ਹਨ। ਸਾਹਿਬ ਨੇ ਆਪਣੀ ਬਖ਼ਸ਼ਸ਼ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "A cooling peace prevails; God has granted this gift. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਪ੍ਰਭੂ ਨੇ ਹੀ ਜਬ ਦਾਤ ਕਰੀ ਹੈ ਤਬ ਬਾਨੀ ਕਰ ਕੇ ਭੀ ਸੀਤਲ ਭਏ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਨੇ ਉਹਨਾਂ ਦੇ ਅੰਦਰ ਐਸੀ ਆਤਮਕ ਠੰਢ ਵਰਤਾ ਦਿੱਤੀ ਹੁੰਦੀ ਹੈ ਕਿ ਉਹਨਾਂ ਦੇ ਸਾਰੇ ਤਾਪ-ਕਲੇਸ਼ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੀਤਲ = ਠੰਡੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Esta es la Bendición del Señor: “Que la Paz sea contigo”. (1)"