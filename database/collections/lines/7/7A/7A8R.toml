[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰਾ ਮਨੁ; ਰਾਮ ਨਾਮਿ ਮਨੁ ਮਾਨੀ ॥"
page = 1199
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My mind and heart are pleased with the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਚਿੱਤ ਅਤੇ ਦਿਲ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਨਾਲ ਪ੍ਰਸੰਨ ਹੋ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind is pleased and appeased by the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਮਨ ਜੋ ਮਾਨੀ ਥਾ, ਸੋ ਰਾਮ ਨਾਮ ਕੋ ਮਨਨ ਕਰਨੇ ਲਗਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਦੋਂ ਤੋਂ) ਮੇਰਾ ਮਨ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਿਚ ਗਿੱਝ ਗਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਮਿ = ਨਾਮ ਵਿਚ। ਮਾਨੀ = ਮੰਨ ਗਿਆ ਹੈ, ਗਿੱਝ ਗਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi mente está complacida con el Nombre del Señor y en mi interior está el Amor del Señor por la Gracia del Guru."