[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨੰਦ ਚਲਿਯੋ ਜਸੁਧਾਊ ਚਲੀ; ਭਗਵਾਨ ਚਲੇ ਮੁਸਲੀ ਸੰਗਿ ਭਾਈ ॥੩੪੫॥"
page = 327

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Nand, Yashoda, Krishna and Balram also went.345."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨੰਦ ਚਲਿਆ, ਜਸੋਧਾ ਚਲੀ ਅਤੇ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਵੀ ਆਪਣੇ ਭਰਾ ਬਲਰਾਮ ਨੂੰ ਨਾਲ ਲੈ ਕੇ ਚਲ ਪਏ ॥੩੪੫॥"