[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਕਾ ਰਖਵਾਲਾ; ਆਪਿ ਸੋਇ ॥"
page = 1183
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the Lord, Himself is the saviour of His slave."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਹਿਬ ਖੁਦ ਹੀ ਆਪਣੇ ਗੋਲੇ ਦਾ ਰਾਖਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord Himself is the Protector of His humble servants."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦਾਸੋਂ ਕਾ ਰਖਕ ਸੋਇ ਪ੍ਰਭੂ ਆਪ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਸੇਵਕ ਦਾ ਰਾਖਾ ਪ੍ਰਭੂ ਆਪ ਬਣਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਇ = ਉਹ (ਪ੍ਰਭੂ) ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Mismo es el Refugio de Sus Sirvientes"