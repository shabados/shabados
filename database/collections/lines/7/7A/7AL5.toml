[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਥਮੇ; ਛੋਡੀ ਪਰਾਈ ਨਿੰਦਾ ॥"
page = 1147
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Firstly, I have given up the calumniation of others,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੱਵਲ, ਮੈਂ ਹੋਰਨਾਂ ਦੀ ਬਦਖੋਈ ਕਰਨੀ ਛੱਡ ਦਿੱਤੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "First, I gave up slandering others."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਹਿਲੇ ਜਿਸ ਨੇ ਪਰਾਈ ਨਿੰਦਾ ਛੋਡ ਦਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅਸਲ ਵੈਸ਼ਨਵ) ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਦੂਜਿਆਂ ਦੇ ਐਬ ਲੱਭਣੇ ਛੱਡ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਥਮੇ = ਸਭ ਤੋਂ ਪਹਿਲਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Primero dejé de calumniar a otros"