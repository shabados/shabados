data = "ਨ੍ਰਿਪ ਕੋ ਕਵਨ ਨਿਰਖਿ ਹੈ ਆਈ ॥੬॥"
page = 850

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘I must manage to get a boy when the Raja comes to visit me,’(6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਰਾਜੇ ਦਾ ਹੈ, ਕੌਣ ਆ ਕੇ ਵੇਖਣ ਲਗੇਗਾ ॥੬॥"