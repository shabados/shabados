[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਵਾਰੀ; ਮੁਖੁ ਫੇਰਿ ਪਿਆਰੇ ॥"
page = 484
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am a sacrifice unto thee. Turn thy face towards me, O my beloved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੇ ਉਤੋਂ ਘੋਲੀ ਵੰਞਦੀ ਹਾਂ। ਆਪਣਾ ਮੁੱਖੜਾ ਮੇਰੇ ਵਲ ਮੋੜ, ਹੇ ਮੈਡੇ ਪ੍ਰੀਤਮ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to You - please, turn Your face to me, O Beloved Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਯਾਰੇ! ਮੈਂ ਬਲਿਹਾਰ ਜਾਉਂ ਮੇਰਾ ਅਪਰਾਧ ਖ੍ਯਮਾ ਕਰੋ ਔਰ ਮੇਰੀ ਓਰ ਮੁਖ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਿਆਰੇ ਪ੍ਰਭੂ! ਮੈਂ ਤੈਥੋਂ ਕੁਰਬਾਨ! ਮੇਰੇ ਵੱਲ ਤੱਕ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ ਵਾਰੀ = ਮੈਂ ਤੈਥੋਂ ਸਦਕੇ। ਪਿਆਰੇ = ਹੇ ਪਿਆਰੇ ਪ੍ਰਭੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Bienamado, vuelve Tu Mirada hacia mí, pues yo ofrezco mi ser en sacrificio a Ti."