data = "ਤੈ ਪੁਤ੍ਰਵੰਤ ਹੂਜੋ ਕੁਮਾਰਿ ॥੨੪॥"
page = 636

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then Brahma said, “O Kumar! You will be blessed with a son.”24."

