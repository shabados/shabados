[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਤੁ; ਪਾਰਬ੍ਰਹਮੁ ਚਿਤਿ ਆਇਆ ॥"
page = 625
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Where the Transcendent Lord is ever cherished,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਪਰਮ ਪ੍ਰਭੂ ਦਾ ਆਰਾਧਨ ਕੀਤਾ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Lord God has established that home,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਰਿਦੇ ਘਰ ਮੇਂ ਪਰਮੇਸਰ ਚਿਤ ਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਦੇ ਹਿਰਦੇ-ਘਰ ਵਿਚ ਪਰਮਾਤਮਾ ਆ ਵੱਸਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਤੁ = ਜਿਸ ਵਿਚ। ਚਿਤਿ = ਚਿੱਤ ਵਿਚ, ਹਿਰਦੇ ਵਿਚ। ਜਿਤੁ ਚਿਤਿ = ਜਿਸ ਹਿਰਦੇ-ਘਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor me ha construido ese Hogar"