[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਸੇਤੀ ਰੰਗਿ ਰਵਿ ਰਹੇ; ਸਭ ਸਾਸ ਗਿਰਾਸਾ ॥"
page = 1247
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With every breath and morsel, they remain blended with the love of God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਸੁਆਸ ਅਤੇ ਬੁਰਕੀ ਨਾਲ ਉਹ ਵਾਹਿਗੁਰੂ ਦੇ ਪਿਆਰ ਨਾਲ ਅਭੇਦ ਹੋਏ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They remain immersed and absorbed in the love of the Lord, with every breath and morsel of food."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਸਭ ਸੁਆਸ ਗਿਰਾਸੋਂ ਕਰ (ਰੰਗਿ) ਪ੍ਰੇਮ ਸਾਥ ਹਰੀ ਕੋ ਜਪ ਰਹੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੁਆਸ ਸੁਆਸ, ਖਾਂਦਿਆਂ ਖਾਂਦਿਆਂ (ਹਰ ਵੇਲੇ) ਉਹ ਪ੍ਰੇਮ ਨਾਲ ਪ੍ਰਭੂ ਵਿਚ ਰਚੇ-ਮਿਚੇ ਰਹਿੰਦੇ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੰਗਿ = ਪ੍ਰੇਮ ਨਾਲ। ਰਵਿ ਰਹੇ = ਰਚ-ਮਿਚ ਜਾਂਦੇ ਹਨ। ਸਾਸ ਗਿਰਾਸਾ = ਸਾਹ ਲੈਂਦਿਆਂ ਤੇ ਗਿਰਾਹੀ ਖਾਂਦਿਆਂ, ਸੁਆਸ ਸੁਆਸ ਖਾਂਦਿਆਂ ਪੀਂਦਿਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Viven imbuidos en el Amor a Dios, por siempre y para siempre;"