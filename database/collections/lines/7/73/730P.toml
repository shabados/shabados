[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਓਹੁ ਆਵੈ; ਨਾ ਓਹੁ ਜਾਇ ॥"
page = 832
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then he comes not, nor goes he."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਉਹ ਆਉਂਦਾ ਨਹੀਂ ਨਾਂ ਹੀ ਉਹ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He does not come, and he does not go."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾ ਓਹ ਆਵਤਾ ਹੈ, ਨਾ ਕਹੀਂ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਵਿਚੋਂ ਬਚ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਹੁ = ਉਹ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así las idas y venidas cesarán y,"