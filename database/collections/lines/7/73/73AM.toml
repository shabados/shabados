[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਚਿ ਹਰਿ ਧਨੁ. ਪੂਜਿ ਸਤਿਗੁਰੁ; ਛੋਡਿ ਸਗਲ ਵਿਕਾਰ ॥"
page = 51
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Amass God's wealth, worship the True Guru and eschew all the sins."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੀ ਦੌਲਤ ਨੂੰ ਜਮ੍ਹਾਂ ਕਰ, ਸਚੇ ਗੁਰਾਂ ਦੀ ਉਪਾਸ਼ਨਾ ਕਰ ਅਤੇ ਸਮੂਹ ਪਾਪਾਂ ਨੂੰ ਤਿਆਗ ਦੇ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Gather in the Wealth of the Lord, worship the True Guru, and give up all your corrupt ways."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹਰੀ ਨਾਮ ਧਨ ਕੋ ਇਕਤ੍ਰ ਕਰੁ, ਔਰ ਸਤਿਗੁਰੋਂ ਕੋ ਪੂਜ, ਸੰਪੂਰਨ ਕਾਮ ਕ੍ਰੋਧਾਦਿ ਵਿਕਾਰੋਂ ਕੋ ਛੋਡ ਦੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਧਨ ਇਕੱਠਾ ਕਰ, ਆਪਣੇ ਗੁਰੂ ਦਾ ਆਦਰ-ਸਤਕਾਰ ਹਿਰਦੇ ਵਿਚ ਵਸਾ (ਤੇ ਇਸ ਤਰ੍ਹਾਂ) ਸਾਰੇ ਵਿਕਾਰ ਛੱਡ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਚਿ = ਇਕੱਠਾ ਕਰ। ਪੂਜਿ = ਆਦਰ-ਸਤਕਾਰ ਨਾਲ ਹਿਰਦੇ ਵਿਚ ਵਸਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Junta la Riqueza del Nombre del Señor, alaba al Guru Verdadero y lava tus errores."