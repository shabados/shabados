[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਸਮਗ੍ਰੀ; ਗ੍ਰਿਹ ਜਾ ਕੈ ਪੂਰਨ ॥"
page = 395
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whose house is brimful with all sorts of articles,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਘਰ ਵਿੱਚ ਸਾਰੀਆਂ ਵਸਤੂਆਂ ਪਰੀਪੂਰਨ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His house is filled with all sorts of articles;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਅਕਾਲ ਪੁਰਖ ਕੇ ਘਰ ਮੇਂ ਸਭ ਸਮਗ੍ਰੀ ਪੂਰਨ ਹੋ ਰਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ (ਪ੍ਰਭੂ) ਦੇ ਘਰ ਵਿਚ (ਜੀਵਾਂ ਵਾਸਤੇ) ਸਾਰੇ ਪਦਾਰਥ ਭਰੇ ਪਏ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲ ਸਮਗ੍ਰੀ = ਸਾਰੇ ਪਦਾਰਥ। ਪੂਰਨ = ਭਰੇ ਹੋਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De Aquél, Cuyo hogar está lleno con todos los objetos de la vida,"