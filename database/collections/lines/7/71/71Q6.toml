[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੇਤੇ ਕਹਿ ਕਹਿ; ਉਠਿ ਉਠਿ ਜਾਹਿ ॥"
page = 6
line = 2

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਅਨਪੁਰਖ ਬਹੁਵਚਨ ਕਿਰਿਆ"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many have repeatedly described Thee and arising and getting ready have departed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਹੁਤਿਆਂ ਨੇ ਤੈਨੂੰ ਬਾਰੰਬਾਰ ਬਿਆਨ ਕੀਤਾ ਅਤੇ ਉਹ ਖੜੇ ਤੇ ਤਿਆਰ ਹੋ ਟੁਰ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many have spoken of Him over and over again, and have then arisen and departed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਤਨੇ ਹੀ ਭੂਤ ਕਾਲ ਮੈ ਕਹਿ ਕਹਿ ਕਰ ਕੇ ਉਠ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬੇਅੰਤ ਜੀਵ ਅੰਦਾਜ਼ਾ ਲਾ ਲਾ ਕੇ ਇਸ ਜਗਤ ਤੋਂ ਤੁਰੇ ਜਾ ਰਹੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹਿ ਕਹਿ = ਆਖ ਆਖ ਕੇ, ਅਕਾਲ ਪੁਰਖ ਦਾ ਮੁੱਲ ਪਾ ਪਾ ਕੇ, ਅਕਾਲ ਪੁਰਖ ਦਾ ਅੰਦਾਜ਼ਾ ਲਾ ਲਾ ਕੇ। ਉਠਿ ਉਠਿ ਜਾਹਿ = ਜਹਾਨ ਤੋਂ ਚਲੇ ਜਾ ਰਹੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "millones han hecho descripciones de Ti y han partido de esta tierra."