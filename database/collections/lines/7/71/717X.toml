data = "ਚਰਿਤ ਚੰਚਲਾ ਐਸੋ ਕੀਨੋ ॥੨੨॥"
page = 968

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The principal Rani slew Raja, then cast off her life.(22)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਢੰਗ ਨਾਲ (ਉਸ) ਚੰਚਲਾ ਨੇ ਚਰਿਤ੍ਰ ਕੀਤਾ ॥੨੨॥"