[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੂਪ ਲਖਿਓ ਹਰਿ ਆਵਤ ਹੀ; ਸੰਗ ਲੈ ਪ੍ਰਿਤਨਾ ਤਬ ਆਪੁ ਹੀ ਧਾਯੋ ॥"
page = 471

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the king saw Krishna coming, he marched forward alongwith his army"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਨੂੰ ਆਉਂਦਿਆਂ ਰਾਜੇ ਨੇ ਵੇਖਿਆ ਤਾਂ ਸੈਨਾ ਲੈ ਕੇ ਆਪ ਹੀ ਅਗੇ ਨੂੰ ਵਧ ਚਲਿਆ।"