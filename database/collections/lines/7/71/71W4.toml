data = "ਅਨਰੁਧ ਸੁਨਿ ਐਸੇ ਬਚਨ; ਤਹ ਤੇ ਕਿਯੋ ਪਯਾਨ ॥"
page = 1016

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Harkening to the plea, Anuradh agreed to accompany,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਨਰੁਧ ਇਸ ਤਰ੍ਹਾਂ ਦੇ ਬਚਨ ਸੁਣ ਕੇ ਉਥੋਂ ਚਲ ਪਿਆ।"