[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਦਰਸਨ ਦਾਨੁ ॥੯॥"
page = 838
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Bless thou Nanak, with the gift of Thine vision."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਨਾਨਕ ਨੂੰ ਆਪਣੇ ਦੀਦਾਰ ਦੀ ਦਾਤ ਪਰਦਾਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please bless Nanak with the gift of the Blessed Vision of Your Darshan. ||9||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੇਰੇ ਨੇਤ੍ਰ ਤੇਰੇ ਦਰਸਨ ਕੋ ਦੇਖੈਂ, ਹੇ ਵਾਹਿਗੁਰੂ! ਯਹੀ ਦਾਨ ਮੁਝ ਕੋ ਦੀਜੀਏ॥੯॥☬ਅਬ ਵਾਹਿਗੁਰੂ ਕੇ ਗੁਣੋਂ ਕਾ ਮਹਾਤਮ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ! (ਪਰਮਾਤਮਾ ਦੇ) ਦਰਸਨ ਦੀ ਦਾਤ (ਮੰਗਦਾ ਰਹਿੰਦਾ ਹੈ) ॥੯॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਰਸਨ ਦਾਨੁ = ਦਰਸਨ ਦੀ ਦਾਤ ॥੯॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por favor, bendice a Nanak con la Preciosa Visión de Tu Darshan.  (9)"