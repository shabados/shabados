[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਵਿਚਹੁ; ਹਉਮੈ ਜਾਇ ॥"
page = 230
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru ego goes from within."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਹੰਕਾਰ ਅੰਦਰੋਂ ਚਲਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh eradicates egotism from within."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖੋਂ ਕੇ ਹਿਰਦੇ ਮੇਂ ਸੇ ਹੰਤਾ ਮਮਤਾ ਜਾਤੀ ਰਹਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪੰਡਿਤ!) ਗੁਰੂ ਦੀ ਸਰਨ ਪਿਆਂ ਮਨ ਵਿਚੋਂ ਹਉਮੈ ਦੂਰ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਿਚਹੁ = ਮਨ ਵਿਚੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por la Gracia del Guru, el ego desaparece;"