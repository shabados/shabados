[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਦਾਸੁ; ਦਰਗਹ ਪਰਵਾਨੁ ॥"
page = 275
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "becomes acceptable in His court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਦਰਬਾਰ ਵਿੱਚ ਕਬੂਲ ਪੈ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such a servant is honored in the Court of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਹਰੀ ਕਾ ਦਾਸ (ਦਰਗਹ) ਸਤਸੰਗ ਵਾ ਪ੍ਰਲੋਕ ਮੇਂ ਪ੍ਰਵਾਨ ਭਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੇਵਕ ਦਰਗਾਹ ਵਿਚ ਕਬੂਲ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "será el siervo aceptado en la Corte del Señor."