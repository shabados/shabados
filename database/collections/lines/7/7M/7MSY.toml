data = "ਏਕ ਤਹਾ ਰਾਜਾ ਰਹੈ; ਅਮਿਤ ਤੇਜ ਕੀ ਖਾਨ ॥"
page = 862

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There lived a Raja, who was the epitome of beauty,"

