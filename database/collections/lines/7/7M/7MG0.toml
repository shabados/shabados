[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਬਿਸੀਅਰ ਗਰੜੈ ਡਿਠਿਆ; ਖੁਡੀ ਵੜਿਦੇ ਲਖ ਪਲੋਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Seeing the large vulture (garur) the snakes crawl into their holes."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗਰੜ ਨੂੰ ਦੇਖਕੇ ਲੱਖਾਂ ਸੱਪ ਖੁਡਾਂ ਵਿਖੇ ਨੱਸਕੇ ਵੜ ਜਾਂਦੇ ਹਨ।"