[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪੁਨਿ ਵੈ ਸਭ ਸੈਨ ਮਲੇਛਨ ਤੇ ਕਬਿ ਸ︀ਯਾਮ ਕਹੈ ਨਹਿ ਏਕੁ ਬਚਿਯੋ ॥੧੯੧੫॥"
page = 488

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And in this way none of the soldiers survived from the malechha army.1915."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਮਲੇਛਾਂ ਦੀ ਉਸ ਸਾਰੀ ਸੈਨਾ ਵਿਚੋਂ, ਕਵੀ ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, ਇਕ ਵੀ ਨਹੀਂ ਬਚਿਆ ਸੀ ॥੧੯੧੫॥"