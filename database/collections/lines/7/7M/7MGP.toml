[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਹਿਬ ਭਾਵੈ; ਸੇਵਕੁ ਸੇਵਾ ਕਰੈ ॥"
page = 1170
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If the Lord wills, the Lord's slave serves Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਸੁਆਮੀ ਨੂੰ ਚੰਗਾ ਲੱਗੇ, ਸੁਆਮੀ ਦਾ ਗੋਲਾ ਉਸ ਦੀ ਟਹਿਲ ਕਮਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When it pleases our Lord and Master, His servant serves Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ (ਸਾਹਿਬ) ਸ੍ਵਾਮੀ! ਜੋ ਸੇਵਕ ਤੇਰੇ ਕੋ ਭਾਵਤਾ ਹੈ, ਸੋਈ ਤੇਰੀ ਸੇਵਾ ਕੋ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਮਾਲਕ-ਪ੍ਰਭੂ ਨੂੰ ਪਸੰਦ ਆਵੇ ਤਾਂ ਹੀ (ਕੋਈ) ਸੇਵਕ ਪ੍ਰਭੂ ਦੀ ਸੇਵਾ (ਭਗਤੀ) ਕਰ ਸਕਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਹਿਬ ਭਾਵੈ = ਜੇ ਮਾਲਕ ਨੂੰ ਚੰਗਾ ਲੱਗੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el Señor así lo desea, uno sirve a Dios"