[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਭਏ ਬੈਰਾਗੀ ॥"
page = 276
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many millions have become lovers of Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਕ੍ਰੋੜ ਪ੍ਰਭੂ ਦੇ ਪ੍ਰੀਤਵਾਨ ਹੋ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions become Bairaagees, who renounce the world."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਤਿਸ ਵਾਹਿਗੁਰੂ ਕੀ ਰਚਨਾ ਮੇਂ ਕਈ ਕ੍ਰੋੜੋਂ (ਬੈਰਾਗੀ) ਵਈਰਾਗਵਾਨ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਰਚਨਾ ਵਿਚ) ਕਰੋੜਾਂ ਜੀਵ ਵੈਰਾਗ ਵਾਲੇ ਹੋਏ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones son los que se vuelven Beraguis"