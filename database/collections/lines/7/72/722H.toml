[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ ਗਿਆਨੁ; ਮਿਲਿਆ ਪ੍ਰੀਤਮੁ ਮੇਰਾ ॥"
page = 798
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting with my friend the True Guru, I have obtained the Divine knowledge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਿੱਤ੍ਰ, ਸੱਚੇ ਗੁਰਾਂ ਨਾਲ ਮਿਲ ਕੇ ਮੈਨੂੰ ਬ੍ਰਹਿਮ ਬੋਧ ਪਰਾਪਤ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting with my Friend, the True Guru, I have obtained spiritual wisdom."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸਤਿਗੁਰਾਂ ਨੇ ਗ੍ਯਾਨੁ ਦੀਆ ਤਬ ਮੇਰਾ (ਪ੍ਰੀਤਮ) ਹਰੀ ਮਿਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੂੰ ਗੁਰੂ ਦਾ ਬਖ਼ਸ਼ਿਆ ਗਿਆਨ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦਾ ਹੈ ਉਹਨਾਂ ਨੂੰ ਪਿਆਰਾ ਪ੍ਰਭੂ ਮਿਲ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando uno obtiene la Sabiduría del Guru, uno obtiene al Señor."