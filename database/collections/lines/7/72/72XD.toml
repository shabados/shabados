[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ ਪ੍ਰਭਿ; ਕੀਨੋ ਦਾਨੁ ॥"
page = 1183
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Showering His benediction, the Lord has blest me with this gift."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਰਹਿਮਤ ਧਾਰ ਕੇ ਸੁਆਮੀ ਨੇ ਮੈਨੂੰ ਇਹ ਦਾਤ ਬਖਸ਼ੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Granting His Grace, God has blessed me with this Gift."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਪ੍ਰਭੂ ਨੇ ਦਾਨ ਕੀਆ ਹੈ ਅਰ ਐਸੇ ਬੇਨਤੀ ਕਰਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ ਮਿਹਰ ਕਰ ਕੇ (ਜਿਸ ਉੱਤੇ) ਬਖ਼ਸ਼ਸ਼ ਕੀਤੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ। ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y el Señor, en Su Misericordia me ha bendecido."