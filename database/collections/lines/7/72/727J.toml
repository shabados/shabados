[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਸਦ ਬਲਿਹਾਰੀ ਸਚੇ ਵਿਟਹੁ; ਆਪੇ ਕਰੇ ਕਰਾਏ ॥੪॥੪॥"
page = 246
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, is ever, a sacrifice unto the True Lord, who Himself does and causes to do everything."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਹਮੇਸ਼ਾਂ ਹੀ ਸੱਚੇ ਸਾਹਿਬ ਉਤੇ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹੈ, ਜੋ ਆਪ ਹੀ ਸਾਰਾ ਕੁਛ ਕਰਦਾ ਤੇ ਕਰਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak is forever a sacrifice to the True Lord, who Himself is the Doer, the Cause of causes. ||4||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਸਚੇ ਕੇ ਊਪਰਿ ਸੇ ਮੈਂ ਸਦਾ ਬਲਿਹਾਰਨੇ ਜਾਤਾ ਹੂੰ। ਜੋ ਆਪੇ ਹੀ ਜੀਵੋਂ ਕਾ ਕਰਤਾ ਔਰ ਆਪ ਹੀ ਇਨ ਸੇ ਕਰਮ ਕਰਾਵਤਾ ਹੈ॥੪॥੪॥☬ਸੁਭ ਬੁਧੀ ਰੂਪੀ ਇਸਤ੍ਰੀ ਜੀਵ ਰੂਪੀ ਪਤੀ ਕੋ ਉਪਦੇਸ ਕਰਤੀ ਹੈ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਆਖ-ਮੈਂ) ਉਸ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਤੋਂ ਸਦਾ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ, ਉਹ ਆਪ ਹੀ ਸਭ ਕੁਝ ਕਰਦਾ ਹੈ ਤੇ ਆਪ ਹੀ ਸਭ ਕੁਝ ਕਰਾਂਦਾ ਹੈ ॥੪॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਿਟਹੁ = ਤੋਂ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak ofrece su ser en sacrificio al Uno Verdadero, el Hacedor y la Causa.  (4-4)"