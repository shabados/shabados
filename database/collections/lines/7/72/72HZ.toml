data = "ਕਸ਼ੀਦਨ ਯਕੇ ਤੇਗ਼ ਗਰਰਾ ਅਜ਼ੀਮ ॥੧੫॥"
page = 1427

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And roaring drew his sword from the scabbard(15)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਇਕ ਤਲਵਾਰ ਨੂੰ ਮਿਆਨ ਵਿਚੋਂ ਖਿਚ ਲਿਆ ਅਤੇ ਬਹੁਤ ਜ਼ੋਰ ਨਾਲ ਗਜਿਆ ॥੧੫॥"