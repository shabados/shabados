[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੋ ਗੁਰ ਪ੍ਰਸਾਦਿ; ਮਨੁ ਮਾਨਿਆ ॥੪॥੫॥"
page = 655
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "And his soul is reconciled to the Lord, by Guru's grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ, ਹੁਣ ਉਸ ਦੀ ਆਤਮਾ ਪ੍ਰਭੂ ਨਾਲ ਹਿੱਲ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "by Guru's Grace, his mind is reconciled with the Lord. ||4||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੁਝ ਗੁਰੂ ਰੂਪ ਸੇ ਜਬ ਮੇਰਾ ਮਨ ਪਤੀਆਇਆ॥੪॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਮੇਰਾ ਮਨ ਉਸ ਵਿਚ ਪਰਚ ਗਿਆ ਹੈ ॥੪॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "con la que mi mente es confortada por la Gracia del Guru. (4‑5)"