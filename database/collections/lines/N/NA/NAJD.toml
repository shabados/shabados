[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨੇ ਸੇਵਕ ਕੀ; ਸਰਪਰ ਰਾਖੈ ॥"
page = 285
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of His serf, he assuredly preserves the honour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੇ ਗੁਮਾਸ਼ਤੇ ਦੀ ਨਿਸ਼ਚਿਤ ਹੀ ਇੱਜ਼ਤ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He surely preserves the honor of His servant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਆਪਨੇ ਸੇਵਕ ਕੀ ਪਤਿਸਟਾ (ਸਰਪਰ) ਅਵਸ ਹੀ ਰਾਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਉਸ ਦੀ ਲਾਜ ਜ਼ਰੂਰ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਪਰ = ਜ਼ਰੂਰ। ਰਾਖੈ = (ਲਾਜ) ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "le ofrece siempre un Refugio"