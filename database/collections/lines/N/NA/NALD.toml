[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਵਿਰਲੈ ਕਿਨੈ. ਥਾਨੁ ਪਾਇਆ ॥"
page = 1064
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru's grace, some rare one, attains unto the said places."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ, ਕੋਈ ਟਾਂਵਾਂ ਜਣਾ ਹੀ ਉਪ੍ਰੋਕਤ ਅਸਥਾਨਾਂ ਨੂੰ ਪ੍ਰਾਪਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But rare is that person who, as Gurmukh, finds these places."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਗੁਰਮੁਖ ਵਿਰਲੇ ਨੇ ਵਹ ਅਸਥਾਨ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਉਸ ਵਿਰਲੇ ਮਨੁੱਖ ਨੂੰ ਇਹ ਥਾਂ ਪ੍ਰਾਪਤ ਹੁੰਦਾ ਹੈ ਜੋ ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero extraordinario es el que se sienta ahí y logra encontrar la Paz,"