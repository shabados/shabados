[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਰਿ ਸਚੈ; ਸਦ ਸੋਭਾ ਪਾਏ ॥"
page = 841
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the Lord's True Court, he ever obtains glory."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੀ ਸੱਚੀ ਦਰਗਾਹ ਅੰਦਰ ਉਹ ਹਮੇਸ਼ਾਂ ਪ੍ਰਭਤਾ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Court of the True Lord, he obtains lasting glory."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚੇ ਕੇ ਦਰਬਾਰ ਪਰਲੋਕ ਵਾ ਸਤਸੰਗ ਮੇਂ ਸੋਭਾ ਪਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ, ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ ਸਦਾ ਸੋਭਾ ਖੱਟਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਰਿ = ਦਰ ਤੇ। ਦਰਿ ਸਚੈ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ। ਸਦ = ਸਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él obtiene la Gloria en la Puerta del Señor, es imbuido en Su Nombre,"