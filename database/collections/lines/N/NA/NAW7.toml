[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਭੀਤਰਿ; ਹੋਵੈ ਪਰਗਾਸੁ ॥"
page = 1235
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Divine light shall shine in thy mind,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਈਸ਼ਵਰੀ ਨੂਰ ਤੇਰੇ ਹਿਰਦੇ ਅੰਦਰ ਚਮਕ ਪਵੇਗਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His Light shall radiate deep within your mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਜਿਨ ਕੀ ਕਿਰਪਾ ਕਰ ਮਨ ਕੇ ਅੰਤਰ (ਪਰਗਾਸੁ) ਗਿਆਨ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨ ਵਿਚ ਆਤਮਕ ਜੀਵਨ ਦਾ ਚਾਨਣ ਪੈਦਾ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਗਾਸੁ = ਚਾਨਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mira, mi mente se ha iluminado desde el interior"