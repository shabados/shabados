data = "ਦੁਹੂੰਅਨ ਬਿਸਰਿ ਸਕਲ ਸੁਧਿ ਗਈ ॥"
page = 946

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Such a love affair flourished in them that they both lost their awareness."

[[content]]
