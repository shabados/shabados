[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕਾ ਦੋਖੀ; ਰਾਜ ਤੇ ਟਾਲਿ ॥੨॥"
page = 867
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From the saints' enemy, He snatches the empire."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਦੇ ਵੈਰੀ ਪਾਸੋਂ ਉਹ ਰਾਜ ਭਾਗ ਖੋਹ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He takes the power away from the enemies of the Saints. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕਾ ਦੋਖੀ ਜੋ ਹੋਇ ਤਿਸ ਕੋ ਰਾਜ ਤੇ ਟਾਲ ਦੇਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਦਾ ਬੁਰਾ ਮੰਗਣ ਵਾਲੇ ਨੂੰ ਪ੍ਰਭੂ ਰਾਜ ਤੋਂ (ਭੀ) ਹੇਠਾਂ ਡੇਗ ਦੇਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੋਖੀ = ਵੈਰੀ, ਬੁਰਾ ਚਿਤਵਨ ਵਾਲਾ। ਟਾਲਿ = ਟਾਲੈ, ਸੁੱਟ ਦੇਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "cae muy lejos de Su Gloria. (2)"