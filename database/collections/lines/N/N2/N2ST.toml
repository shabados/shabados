[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁੰਕਤ ਸਾਪ, ਬਕਾਰਤ ਬਾਘ; ਭਕਾਰਤ ਭੂਤ, ਮਹਾ ਦੁਖ ਪੈਹੈ ॥"
page = 224

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“The serpents hiss there, the tiger thunder and there are also extremely agonizing ghosts and fiends."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੱਪ ਸ਼ੂਕਦੇ ਹਨ, ਬਾਘ ਘੁਰਾਂਦੇ ਹਨ, ਭੂਤ ਭਕਾਰਦੇ ਹਨ, (ਇਸ ਲਈ) ਬਹੁਤ ਦੁਖ ਪਾਏਂਗੀ।"