[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ ਵਸਹੁ ਮੇਰੈ ਹਿਰਦੈ; ਹੋਇ ਸਹਾਈ ਆਪਿ ॥੧॥ ਰਹਾਉ ॥"
page = 405
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Show Thine mercy and abide within, and Thyself be my succour. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਮਿਹਰ ਧਾਰ ਅਤੇ ਮੇਰੇ ਚਿੱਤ ਅੰਦਰ ਨਿਵਾਸ ਕਰ ਅਤੇ ਖੁਦ ਮੇਰਾ ਮਦਦਗਾਰ ਬਣ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Bestow Your Mercy, and dwell within my heart; please, become my Helper. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਮ! ਆਪ ਸਹਾਈ ਹੋ ਕਰ ਮੇਰੇ ਹਿਰਦੇ ਮੇਂ ਬਸਹੁ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਤੂੰ ਮੇਰਾ ਮਦਦਗਾਰ ਬਣੇਂ ਤੇ (ਮੇਰੇ ਉਤੇ) ਕਿਰਪਾ ਕਰਕੇ, ਮੇਰੇ ਹਿਰਦੇ ਵਿਚ ਆ ਵੱਸੇਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਿਰਦੈ = ਹਿਰਦੇ ਵਿਚ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canto el Nombre de Dios, en el interior de mi mente,"