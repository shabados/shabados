[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਐਸੋ ਪ੍ਰਨ ਲੈਹੌ, ਪਿਯ ਕਹੈ ਸੋਈ ਕਾਜ ਕੈਹੌ; ਅਤਿ ਹੀ ਰਿਝੈਹੌ, ਯਹੈ ਸਿਛਾ ਰਾਜਨੀਤ ਕੀ ॥"
page = 952

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘I will sacrifice my parents, and this is the criteria of my life. ‘I swear to do whatever he asks."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਮੈਂ ਤਾਂ) ਅਜਿਹਾ ਪ੍ਰਣ ਲਵਾਂਗੀ ਕਿ ਜੋ ਪ੍ਰੀਤਮ ਕਹੇਗਾ, ਉਹੀ ਕੰਮ ਕਰਾਂਗੀ, (ਉਸ ਨੂੰ) ਬਹੁਤ ਪ੍ਰਸੰਨ ਕਰਾਂਗੀ, ਇਹੀ ਰਾਜਨੀਤੀ ਦੀ ਸਿਖਿਆ ਹੈ।"