[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਚਕਵੀ; ਸੂਰਜ ਕੀ ਆਸ ॥"
page = 914
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the shell-duck longs for the sun,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਸੁਰਖਾਬਨੀ ਭਾਨ ਦੀ ਉਡੀਕ ਕਰਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As the chakvi bird longs for the sun,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਚਕਵੀ ਕੋ ਸੂਰਜ ਕੀ ਆਸ ਲਗੀ ਰਹਿਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਚਕਵੀ (ਚਕਵੇ ਨੂੰ ਮਿਲਣ ਵਾਸਤੇ) ਸੂਰਜ (ਦੇ ਚੜ੍ਹਨ) ਦੀ ਉਡੀਕ ਕਰਦੀ ਰਹਿੰਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਸ = ਉਡੀਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como el pájaro Chakvi añora al sol,"