[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਮਮਤਾ; ਛੋਡੀ. ਨ ਜਾਈ ॥"
page = 1024
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "One can abandon not mammon's love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਨਸਾਨ ਧਨ-ਦੌਲਤ ਦੇ ਪਿਆਰ ਨੂੰ ਛੱਡ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Love and attachment to Maya cannot be abandoned."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਕੀ ਮਮਤਾ ਛੋਡੀ ਨਹੀਂ ਜਾਤੀ ਥੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਮਾ ਕੋਈ ਭੀ ਹੋਵੇ) ਮਾਇਆ ਦੀ ਅਪਣੱਤ ਛੱਡੀ ਨਹੀਂ ਜਾ ਸਕਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No abandonan a Maya ni la idea de lo mío."