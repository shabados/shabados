[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਧਰਮੀ ਡਿਠਾ ਧਰਮਰਾਇ; ਪਾਪੁ ਕਮਾਇ ਪਾਪੀ ਜਮ ਡਿਠਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "People see him pious and righteous in the form of Dharmaraj but the wicked sinner as Yama."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਧਰਮੀਆਂ ਨੇ ਧਰਮਰਾਜ ਅਰ ਪਾਪ ਕਮਾਵਣ ਵਾਲਿਆਂ ਨੇ ਉਸੇ ਨੂੰ ਜਮ ਰੂਪ ਕਰ ਕੇ (ਦੁਖਦਾਈ) ਦੇਖਿਆ।"