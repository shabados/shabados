[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਜਣ ਮੇਲੁ ਸੁ ਢੰਗ, ਚੋਜ ਵਿਡਾਣਿਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Meeting with such persons is wonderfully delightful."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸੱਜਣਾਂ ਦਾ ਮੇਲ ਸੁੰਦਰ ਢੰਗ ਵਾਲਾ ਹੈ ਇਹ ਵੱਡਾ ਅਚਰਜ ਕੌਤਕ ਹੈ;"