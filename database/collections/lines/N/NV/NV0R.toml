[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਿਆਨ ਅੰਜਨੁ; ਜਾ ਕੀ ਨੇਤ੍ਰੀ ਹੋਇ ॥੬॥੨॥"
page = 1128
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who applies to his eyes the collyrium of Divine knowledge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਪਣੀਆਂ ਅੱਖਾਂ ਵਿੱਚ ਬ੍ਰਹਮ ਬੋਧ ਦਾ ਸੁਰਮਾ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "who applies the ointment of spiritual wisdom to his eyes. ||6||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਬੁਧੀ ਰੂਪਾ ਨੇਤ੍ਰੋਂ ਮੇਂ ਗਿਆਨ (ਅੰਜਨੁ) ਸੁਰਮਾ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥੬॥੨॥☬ਪੁਨ: ਉਪਦੇਸ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀਆਂ ਅੱਖਾਂ ਵਿਚ ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੂਝ ਦਾ ਸੁਰਮਾ ਪਿਆ ਹੁੰਦਾ ਹੈ ॥੬॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੀ ਨੇਤ੍ਰੀ = ਜਿਸ ਦੀਆਂ ਅੱਖਾਂ ਵਿਚ। ਗਿਆਨ = ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੂਝ। ਅੰਜਨੁ = ਸੁਰਮਾ ॥੬॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aquél que aplica a sus ojos el Colirio de la Sabiduría. (6-2)"