[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਾ; ਇਕ ਦੇਹਿ ਬੁਝਾਈ ॥"
page = 2
line = 12

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਗੁਰਾਂ ਨੇ ਇਕ ਸਿਖਿਆ ਬੁਝਾ ਦਿਤੀ ਹੈ। ਦੇਹਿ = ਦਿਤੀ ਹੈ।"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru has explained one thing to me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੇ ਮੈਨੂੰ ਇਕ ਗਲ ਸਮਝਾ ਦਿਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru has given me this one understanding:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਨੇ ਮੁਝ ਕੋ ਏਕ ਬੂਝ ਦਿਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਾਂ ਤੇ) ਹੇ ਸਤਿਗੁਰੂ! (ਮੇਰੀ ਤੇਰੇ ਅੱਗੇ ਇਹ ਅਰਦਾਸ ਹੈ ਕਿ) ਮੈਨੂੰ ਇਕ ਇਹ ਸਮਝ ਦੇਹ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru me ha enseñado esto,"