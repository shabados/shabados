[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੈਤ ਅਨੇਕ ਭਏ ਤਿਹ ਤੇ; ਬਲਵੰਡ ਕੁਰੂਪ ਭਯਾਨਕ ਕੀਨੇ ॥"
page = 442

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That arrow created dreadful demons, who had discs, axes,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ (ਤੀਰ) ਤੋਂ ਅਨੇਕ ਦੈਂਤ ਪੈਦਾ ਹੋ ਗਏ ਜੋ ਬਹੁਤ ਹੀ ਭਿਆਨਕ, ਕੁਰੂਪ ਅਤੇ ਬਲਵਾਨ ਰੂਪ ਵਾਲੇ ਸਨ।"