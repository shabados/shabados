[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਤਿਨ ਸੰਗਿ ਦੁਖੁ ਨਸੈ ॥੪॥੯॥੧੪੭॥"
page = 212
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "in whose heart-home God's wealth is treasured up."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਦਿਲ-ਘਰ ਅੰਦਰ ਵਾਹਿਗੁਰੂ ਦਾ ਪਦਾਰਥ ਪਰੀਪੂਰਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- says Nanak, in their company, pain departs. ||4||9||147||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਨ ਮਹਾਤਮਾ ਕੇ ਸੰਗ ਕਰ ਦੁਖ ਨਵਿਰਤ ਹੋਤਾ ਹੈ॥੪॥੯॥੧੪੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਉਹਨਾਂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਰਿਹਾਂ ਹਰੇਕ ਕਿਸਮ ਦਾ ਦੁੱਖ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ ॥੪॥੯॥੧੪੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਨ ਸੰਗਿ = ਉਹਨਾਂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਰਿਹਾਂ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "dice Nanak, en Su Compañía todas las penas se van. (4-9-147)"