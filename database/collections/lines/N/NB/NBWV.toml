[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਧਸੰਗਤਿ; ਗੁਰ ਸਬਦ ਵਿਲੋਵੈ ॥੯॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In such a life the word of the Guru is churned in the holy congregation."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਧਸੰਗਤ ਵਿਖੇ (ਮਿਲਕੇ) ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦਾ ਮਥਨ ਕਰੇ (ਅਰਥਾਤ ਸਮਝਕੇ ਨਿਧ੍ਯਾਸਨ ਕਰੇ)।"