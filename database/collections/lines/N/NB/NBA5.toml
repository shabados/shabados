[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਤ੍ਰਪਤ੍ਰ ਸਿਰਿ ਢਾਰਿ ਨਵੀਨਾ ॥੧੩੫॥"
page = 624

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The king Rahghu ruled over the world and wore new arms, weapons and canopies.135."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਆਪਣੇ) ਸਿਰ ਉਤੇ ਨਵੇਂ ਰਾਜਸੀ ਛਤ੍ਰ ਅਤੇ ਚਿੰਨ੍ਹ ਧਾਰਨ ਕਰ ਲਏ ॥੧੩੫॥"