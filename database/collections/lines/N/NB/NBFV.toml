[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੇਤੜਿਆ ਕਾਰੂੰਜੜੇ; ਕੇਤੜਿਆ ਦਬਗਰ ਕਾਸਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many are green grocers, many are makers of kuppas, large vessels made from raw hide usually for holding and carrying oil, and may more are butchers."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਿਨੇ ਕਰੂੰਜੜੇ, ਕਿਤਨੇ ਦਬਗਰ ਤੇ ਕਸਾਈ ਹਨ।"

[[content]]
assets = ["VBGS"]
type = "note"
language = "pa"
data = "ਕਰੂੰਜੜੇ=ਸਬਜ਼ੀ ਵੇਚੂ। ਦਬਗਰ=ਕੁੱਪੇ ਬਨਾਉਣ ਵਾਲੇ।"