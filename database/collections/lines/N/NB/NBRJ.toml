[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂਹੈ ਰਾਖਹਿ; ਸਾਰਿ ਸਮਾਲਿ ॥੧॥"
page = 200
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou alone carefully preservest me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤੂੰ ਹੀ ਗਹੁ ਨਾਲ ਮੇਰੀ ਰੱਖਿਆ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You preserve, protect and care for me. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਤੂੰ ਹੀ ਹਰ ਪਰਕਾਰ ਕੀ (ਸਾਰਿ) ਖਬਰ ਰਖਤਾ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ (ਜੀਵਾਂ ਦੀ) ਸਾਰ ਲੈ ਕੇ ਸੰਭਾਲ ਕਰ ਕੇ ਰੱਖਿਆ ਕਰਦਾ ਹੈਂ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਰਿ = ਸਾਂਭ ਕੇ, ਸਾਰ ਲੈ ਕੇ। ਸਮਾਲਿ = ਸੰਭਾਲ ਕਰ ਕੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo Tú me cuidas. (1)"