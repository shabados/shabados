[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਚਰੁ ਵਸੀ; ਪਿਤਾ ਕੈ ਸਾਥਿ ॥"
page = 371
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As long as she dwelt with her Father(Satguru),"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਤੋੜੀਂ ਉਹ ਆਪਣੇ ਬਾਬਲ ਨਾਲ ਰਹਿੰਦੀ ਸੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As long as she lived with her father,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਤਕ ਪਿਤਾ, ਭਾਵ ਗੁਰੂ ਕੇ ਸਾਥ ਬਸੀ ਥੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਭਗਤੀ-ਰੂਪ ਇਸਤ੍ਰੀ) ਜਿਤਨਾ ਚਿਰ ਗੁਰੂ ਦੇ ਪਾਸ ਹੀ ਰਹਿੰਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਚਰੁ = ਜਿਤਨਾ ਚਿਰ। ਪਿਤਾ = (ਭਾਵ) ਗੁਰੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice la Novia que el tiempo que vivió con el padre,"