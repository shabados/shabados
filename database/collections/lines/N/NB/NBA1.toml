[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਲਵੰਤ; ਬਲਾਤ ਕਾਰਣਹ ॥"
page = 1359
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "dominating even the very powerful ones."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿ ਉਹ ਪਰਮ ਬਲਵਾਨ ਤੇ ਭੀ ਭਾਰੂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and asserting their power over others,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਆਪ ਕੋ ਬਲਵੰਤ ਮਾਨਕਰ (ਬਲਾਤ ਕਾਰਣਹ) ਅਵਸ ਹੀ ਹੰਕਾਰ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਆਪ ਨੂੰ ਬਲਵਾਨ ਜਾਣ ਕੇ ਅਹੰਕਾਰ ਕਰਦਾ ਹੈ, ਤੇ (ਹੋਰਨਾਂ ਉਤੇ) ਧੱਕਾ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਲਾਤ ਕਾਰਣਹ = ਵਧੀਕੀਆਂ ਕਰਨ ਵਾਲਾ (बलात्कारःक्ष् violence)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "quienes fuerzan su poder sobre otros y nunca meditan en los Pies de Loto del Señor,"