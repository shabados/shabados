[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬ੍ਰਹਮੇ. ਨਹੀ ਜਾਨਹਿ ਭੇਦ ॥"
page = 894
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Brahmas can not realise His secrets."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਿਮੇ ਉਸ ਦੇ ਭੇਤਾਂ ਨੂੰ ਅਨੁਭਵ ਨਹੀਂ ਕਰ ਸਕਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Brahma does not know His mystery."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮੋ ਭੀ ਭੇਦ ਕੋ ਨਹੀਂ ਜਾਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਬ੍ਰਹਮਾ ਭੀ (ਉਸ ਦੇ) ਦਿਲ ਦੀ ਗੱਲ ਨਹੀਂ ਜਾਣਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬ੍ਰਹਮੇ = ਅਨੇਕਾਂ ਬ੍ਰਹਮਾ {ਬਹੁ-ਵਚਨ}। ਭੇਦ = (ਪਰਮਾਤਮਾ ਦੇ) ਦਿਲ ਦੀ ਗੱਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Dios; ni Brahma conoce todo Tu Misterio."