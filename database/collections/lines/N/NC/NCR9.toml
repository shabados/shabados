[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਚਰਣੀ ਮਨੁ ਲਾਗਾ ॥"
page = 627
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His mind alone gets attached to the Lord's feet,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਸੇ ਦਾ ਹੀ ਹਿਰਦਾ ਸੁਆਮੀ ਦੇ ਪੈਰਾਂ ਨਾਲ ਜੁੜਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His mind is attached to God's feet,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕੇ ਚਰਣੋਂ ਮੇਂ ਮਨ ਤਿਸ ਕਾ ਲਾਗਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਸ ਮਨੁੱਖ ਦਾ ਮਨ ਪਰਮਾਤਮਾ ਦੇ ਚਰਨਾਂ ਵਿਚ ਲੀਨ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo aquél cuyo Destino es Perfecto,"