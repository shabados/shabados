[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਤੁ ਭਾਵੈ; ਤਿਤੁ ਕਾਰੈ ਲਾਏ ॥"
page = 123
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He yokes man to the task which He likes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਬੰਦੇ ਨੂੰ ਉਸ ਕੰਮ ਲਾਉਂਦਾ ਹੈ ਜਿਹੜਾ ਉਸ ਨੂੰ ਚੰਗਾ ਲਗਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As He pleases, He applies us to our tasks."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜਿਸ ਕਾਰ ਮੇਂ ਚਾਹੇ ਉਸ ਕਾਰ ਮੇਂ ਲਗਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਉਹ ਜੀਵਾਂ ਨੂੰ ਉਸ ਕੰਮ ਵਿਚ ਲਾਂਦਾ ਹੈ ਜਿਸ ਵਿਚ ਲਾਣਾ ਉਸ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਤੁ ਕਾਰੈ = ਜਿਸ ਕਾਰ ਵਿਚ। ਤਿਤੁ = ਉਸ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nos asigna las faenas, así como es Su Voluntad."