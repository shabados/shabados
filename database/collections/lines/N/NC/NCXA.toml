[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਧੌ; ਤੂ ਠਾਕੁਰੁ ਸਿਰਿ ਮੋਰਾ ॥"
page = 613
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, Thou art the Master over my head."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਤੂੰ ਮੇਰੇ ਸੀਮ ਉਪਰਲਾ ਮਾਲਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord, You are the Master above my head."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਇਆ ਕੇ ਪਤੀ ਠਾਕੁਰ! ਤੂੰ ਹੀ ਸਭ ਮੇਂ ਸਿਰੋਮਣੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਮੇਰੇ ਸਿਰ ਉੱਤੇ ਰਾਖਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਧੌ = {ਮਾ-ਧਵ = ਮਾਇਆ ਦਾ ਪਤੀ} ਹੇ ਪ੍ਰਭੂ! ਸਿਰਿ ਮੋਰਾ = ਮੇਰੇ ਸਿਰ ਉੱਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, eres mi Único Maestro,"