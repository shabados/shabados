[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਤਿ ਕਾ ਧਨੁ ਪੂਰਾ ਹੋਆ; ਲਾਗਾ ਸਹਜਿ ਧਿਆਨੁ ॥੩॥"
page = 1168
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He obtains the full wealth of honour, and his attention is easily fixed on the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਇਜ਼ਤ ਆਬਰੂ ਦੀ ਮੁਕੰਮਲ ਦੌਲਤ ਮਿਲ ਜਾਂਦੀ ਹੈ ਅਤੇ ਉਸ ਦੀ ਬਿਰਤੀ ਸੁਖੈਨ ਹੀ ਸਾਈਂ ਨਾਲ ਜੁੜ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "attains the perfect wealth of honor, and intuitively focuses his meditation on the Lord. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਭ ਸਾਧਨਾਂ ਰੂਪ ਪਤੀ ਪ੍ਰਾਪਤੀ ਕਾ ਧਨੁ ਤਿਸ ਕੋ ਪੂਰਾ ਪ੍ਰਾਪਤਿ ਹੂਆ ਹੈ ਔਰ ਸਹਜ ਪਦ ਮੇਂ ਧਿਆਨੁ ਲਾਗਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਲੋਕ ਪਰਲੋਕ ਦੀ ਇੱਜ਼ਤ ਦਾ ਸੰਪੂਰਨ ਧਨ ਮਿਲ ਜਾਇਗਾ, ਅਡੋਲਤਾ ਵਿਚ ਸਦਾ ਉਸ ਦੀ ਸੁਰਤ ਟਿਕੀ ਰਹੇਗੀ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿ = ਇੱਜ਼ਤ। ਸਹਜਿ = ਸਹਜ, ਅਡੋਲਤਾ ਵਿਚ। ਧਿਆਨੁ = ਟਿਕਾਉ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y uno es entonado en Dios en el Estado de Equilibro. (3)"