[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦ ਹੀ ਨਿਬਹੈ; ਤੇਰੈ ਨਾਲਿ ॥੧॥ ਰਹਾਉ ॥"
page = 1129
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "it shall stand by thee for ever. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਦੀਵ ਹੀ ਤੇਰਾ ਪੱਖ ਪੂਰੇਗਾ। ਠਹਿਰਾਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It shall stand by you forever. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਨਾਮ ਸਦੀਵਕਾਲ ਤੇਰੇ ਨਾਲ ਨਿਭੇਗਾ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਹਰਿ-ਨਾਮ ਸਦਾ ਹੀ ਤੇਰੇ ਨਾਲ ਸਾਥ ਦੇਵੇਗਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਦ = ਸਦਾ। ਨਿਬਹੈ = ਸਾਥ ਦੇਂਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ésta permanecerá contigo por siempre y para siempre. (1-Pausa)"