[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਨਦਰਿ ਕਰੇ; ਜਾ ਸੋਇ ॥"
page = 878
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When that Lord Himself showers His benediction,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਹ ਸੁਆਮੀ ਆਪ ਆਪਣੀ ਰਹਿਮਤ ਧਾਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When He Himself grants His Grace,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰ ਸੋ ਵਾਹਿਗੁਰੂ ਆਪ ਕ੍ਰਿਪਾ ਦ੍ਰਿਸ੍ਟੀ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਪ੍ਰਭੂ ਆਪ ਹੀ ਮੇਹਰ ਦੀ ਨਜ਼ਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Mismo entonces nos bendice con Su Gracia,"