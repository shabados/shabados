[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ ਲੋੜਹਿ; ਸਦਾ ਸੁਖੁ ਭਾਈ ॥"
page = 1182
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If thou desire ever-lasting peace, O brother,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਤੂੰ ਸਦੀਵੀ ਆਰਾਮ ਚਾਹੁੰਦਾ ਹੈ, ਹੇ ਵੀਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If you long for eternal peace, O Siblings of Destiny,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੇਕਰ ਸਦਾ ਸੁਖ ਪਾਯਾ ਚਾਹਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੇ ਤੂੰ ਚਾਹੁੰਦਾ ਹੈਂ ਕਿ ਸਦਾ ਆਤਮਕ ਆਨੰਦ ਮਿਲਿਆ ਰਹੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਈ = ਹੇ ਭਾਈ! {ਸੰਬੋਧਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si uno busca Paz y Éxtasis para su Alma,"