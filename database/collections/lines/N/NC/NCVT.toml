[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਾ ਹਾ. ਪ੍ਰਭ ਰਾਖਿ ਲੇਹੁ ॥"
page = 675
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Lord, do Thou save me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ, ਹੇ ਮੇਰੇ ਸੁਆਮੀ! ਤੂੰ ਮੇਰੀ ਰੱਖਿਆ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O God, please save me!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਾ ਕਸ਼ਟ ਹਾ ਕਸ਼ਟ ਹੇ ਪ੍ਰਭੂ! ਹਮ ਕੌ ਦੁਖੋਂ ਸੇ ਰਾਖ ਲੇਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਸਾਨੂੰ ਬਚਾ ਲੈ, ਸਾਨੂੰ ਬਚਾ ਲੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਾ ਹਾ = ਹਾਏ! ਹਾਏ! ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sálvame, oh, sálvame Dios mío, pues no puedo hacer nada sin Ti,"