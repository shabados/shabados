[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਬ ਮੈ ਸੁਖੁ ਪਾਇਓ; ਗੁਰ ਆਗੵਿ ॥"
page = 701
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Bowing before the Guru, I have, now, attained peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਮੂਹਰੇ ਬੰਦਨਾ ਕਰ ਕੇ, ਹੁਣ ਮੈਂ ਆਰਾਮ ਪਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Now, I have found peace, bowing before the Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਮੈਨੇ ਗੁਰੋਂ ਕੀ (ਆਗ੍ਯ੍ਯਿ) ਆਗਿਆ ਮਾਨ ਕਰ ਸੁਖ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹੁਣ ਮੈਂ ਗੁਰੂ ਦੀ ਆਗਿਆ ਵਿਚ (ਤੁਰ ਕੇ) ਆਨੰਦ ਪ੍ਰਾਪਤ ਕਰ ਲਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਗ੍ਯ੍ਯਿ = ਆਗਿਆ {आज्ञा} ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He obtenido Paz postrando mi ser ante el Guru."