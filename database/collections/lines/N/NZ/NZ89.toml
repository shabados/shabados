[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਭਲੇ ਭਲੇ ਕਰਿ ਮੰਨੀਅਨਿ; ਬੁਰਿਆਂ ਦੇ ਹਰਿ ਕਾਜ ਸਵਾਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The good is said good by everyone but the works of the evil doers are set right by the Lord only."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਭਲੇ ਤਾਂ ਭਲੇ ਕਰ ਕੇ ਮੰਨੇ ਹੀ ਜਾਂਦੇ ਹਨ, ਹਰੀ ਪਾਪੀਆਂ ਦੇ ਕਾਰਜ ਸਵਾਰ ਦਿੰਦਾ ਹੈ।"