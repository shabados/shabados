line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He whom He Himself preserves,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਓਹ ਖੁਦ ਰੱਖਿਆ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
