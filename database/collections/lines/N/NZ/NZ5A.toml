[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ) ਆਪ ਹੀ ਜਿਸ ਮਨੁੱਖ ਨੂੰ (ਵਿਕਾਰਾਂ ਵਲੋਂ) ਬਚਾਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
