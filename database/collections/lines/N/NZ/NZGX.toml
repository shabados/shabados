[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਬਾ. ਹੋਰੁ ਚੜਣਾ; ਖੁਸੀ ਖੁਆਰੁ ॥"
page = 16
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Brother! the glee of other rides is ruinous."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹੋਰਨਾਂ ਸਵਾਰੀਆਂ ਦਾ ਹੁਲਾਸ ਬਰਬਾਦ ਕਰਨ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Baba, the pleasures of other rides are false."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਾਬਾ! ਹੋਰ ਮਨ ਕੀ ਖੁਸੀ ਅਨੁਸਾਰ ਜੋ ਸਵਾਰੀ ਉਪਰ ਚੜਨਾ ਹੈ, ਸੋ ਖੁਆਰੁ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਹ ਘੋੜ-ਸਵਾਰੀ ਤੇ ਉਸ ਦਾ ਚਾਉ ਖ਼ੁਆਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Madre, el regocijo en otros amores es ruinoso para el hombre."