[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਸੇਵੇ; ਭਰਮੁ ਚੁਕਾਏ ॥"
page = 843
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who serves the True Guru drives out his doubt,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਘਾਲ ਕਮਾਉਂਦਾ ਹੈ, ਉਸ ਦਾ ਸੰਦੇਹ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serving the True Guru, doubt is driven away."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਕੋ ਸੇਵਨ ਕਰ ਜਿਨੋਂ ਨੇ ਸਭ ਭਰਮ (ਚੁਕਾਏ) ਦੂਰ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਂਦਾ ਹੈ, ਉਹ (ਆਪਣੇ ਅੰਦਰੋਂ) ਭਟਕਣਾ ਮੁਕਾ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵੇ = ਸਰਨ ਪੈਂਦਾ ਹੈ। ਭਰਮੁ = ਭਟਕਣਾ। ਚੁਕਾਏ = ਦੂਰ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que sirve al Guru Verdadero, se quita de sus falsas ilusiones"