[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਕੀਆ; ਸੋ ਗੁਰ ਤੇ ਜਾਨਿਆ ॥"
page = 864
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who created me; Him I know through the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਮੈਨੂੰ ਰਚਿਆ ਹੈ, ਉਸ ਨੂੰ ਮੈਂ ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਜਾਣਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Guru, know the One who created you."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਇਸ ਸੰਸਾਰ ਕੋ ਰਚਨਾ ਕੀਆ ਹੈ, ਸੋ ਪਰਮੇਸਰ ਗੁਰੋਂ ਤੇ ਜਾਨਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਉਸ ਪਰਮਾਤਮਾ ਨਾਲ ਜਾਣ-ਪਛਾਣ ਬਣ ਜਾਂਦੀ ਹੈ ਜਿਸ ਨੇ (ਇਹ ਸਾਰਾ ਜਗਤ) ਪੈਦਾ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਪ੍ਰਭੂ) ਨੇ। ਤੇ = ਤੋਂ, ਦੀ ਰਾਹੀਂ। ਜਾਨਿਆ = ਜਾਣ ਲਿਆ, ਸਾਂਝ ਪਾ ਲਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es iluminada. Ahora a través del Guru he conocido a mi Creador;"