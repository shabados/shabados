[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਾਂਡਾ ਆਣਗੁ ਰਾਸਿ; ਜਾਂ ਤਿਸੁ ਭਾਵਸੀ ॥"
page = 1411
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When it pleases Him, He sets the vessel aright."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਸ ਨੂੰ ਚੰਗਾ ਲਗਦਾ ਹੈ, ਉਹ ਬਰਤਨ ਨੂੰ ਦਰੁਸਤ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When it pleases Him, He makes it right."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸੀ ਕਾ ਸਰੀਰ ਭਾਂਡਾ ਰਾਸ ਆਵੇਗਾ ਜੋ ਤਿਸ ਵਾਹਿਗੁਰੂ ਨੂੰ ਭਾਵੇਗਾ॥☬ਪ੍ਰਸ਼ਨ: ਕੈਸੇ ਭਾਵੇਗਾ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਾਂ, ਜਦੋਂ ਉਸ ਪਰਮਾਤਮਾ ਦੀ ਰਜ਼ਾ ਹੁੰਦੀ ਹੈ (ਮਨੁੱਖ ਨੂੰ ਗੁਰੂ ਮਿਲਦਾ ਹੈ, ਗੁਰੂ ਮਨੁੱਖ ਦੇ) ਸਰੀਰ-ਭਾਂਡੇ ਨੂੰ ਪਵਿੱਤਰ ਕਰ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਣਗੁ = ਲਿਆਵੇਗਾ। ਆਣਗੁ ਰਾਸਿ = (ਗੁਰੂ) ਸੁੱਧ-ਪਵਿੱਤਰ ਕਰ ਦੇਵੇਗਾ। ਜਾਂ = ਜਦੋਂ। ਤਿਸੁ = ਉਸ (ਪਰਮਾਤਮਾ) ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "lo hace correctamente. La Luz Suprema brilla,"