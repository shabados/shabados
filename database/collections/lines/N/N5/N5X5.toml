[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸਾ ਸਿਮਰਨੁ; ਕਰਿ ਮਨ ਮਾਹਿ ॥"
page = 971
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Embrace thou such meditation within thy mind,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਹੋ ਜੇਹੀ ਬੰਦਗੀ ਤੂੰ ਆਪਣੇ ਹਿਰਦੇ ਅੰਦਰ ਧਾਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Practice such meditative remembrance in your mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਕੇ ਬੀਚ ਐਸਾ ਸਿਮਰਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤੂੰ ਆਪਣੇ ਮਨ ਵਿਚ ਅਜਿਹਾ (ਬਲ ਰੱਖਣ ਵਾਲਾ) ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Medita en tu mente, pues sin habitar en el Señor,"