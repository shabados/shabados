type = "primary"
data = "ਖਿਸਿਯਾਨ ਹੰਸ ਅਵਿਲੋਕਿ ਚਾਲ ॥"
page = 636

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing her arms, the lotus-stalk felt she and the swans, seeing her gait got angry"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਚਾਲ ਨੂੰ ਵੇਖ ਕੇ ਹੰਸ ਖਿਝਦਾ ਹੈ।"