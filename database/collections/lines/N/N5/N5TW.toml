[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਣ ਪਖਾਰਿ; ਕਰੀ ਨਿਤ ਸੇਵਾ ਜੀਉ ॥"
page = 217
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I wash Thine feet and ever perform Thy service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੇ ਚਰਨ ਧੋਂਦੀ, ਅਤੇ ਸਦੀਵੀ ਹੀ ਤੇਰੀ ਚਾਕਰੀ ਵਜਾਉਂਦੀ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I wash Your Feet, and constantly serve You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਨਿਤਾਪ੍ਰਤੀ ਤੁਮਾਰੇ ਚਰਨ ਧੋਵਾਂ ਔਰ ਸੇਵਾ ਕਰੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮੇਰੇ ਰਾਮ ਜੀ! ਮਿਹਰ ਕਰ, ਮੈਂ ਤੇਰੇ ਸੰਤ ਜਨਾਂ ਦੇ) ਚਰਨ ਧੋ ਕੇ ਉਹਨਾਂ ਦੀ ਸਦਾ ਸੇਵਾ ਕਰਦਾ ਰਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਖਾਰਿ = ਧੋ ਕੇ। ਕਰੀ = ਕਰੀਂ, ਮੈਂ ਕਰਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lavo Tus Pies, y Te sirvo siempre, oh Amado;"