[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹ ਦੇਖਾ. ਤਹ ਏਕੁ ਹੈ; ਗੁਰਮੁਖਿ ਪਰਗਟੁ ਹੋਇ ॥੮॥"
page = 1413
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wherever I see, there I see the One Lord. It is by the Guru's grace, that He becomes manifest."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਭੀ ਮੈਂ ਵੇਖਦਾ ਹਾਂ, ਉਥੇ ਮੈਂ ਇਕ ਪ੍ਰਭੂ ਨੂੰ ਹੀ ਵੇਖਦਾ ਹਾਂ। ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਉਹ ਪਰਤਖ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wherever I look, I see the One Lord. He reveals Himself to the Gurmukh. ||8||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਜਹਾਂ ਮੈਂ ਦੇਖਤਾ ਹੂੰ ਤਹਾਂ ਏਕ ਪਾਰਬ੍ਰਹਮ ਹੈ, ਪਰੰਤੂ ਗੁਰਾਂ ਦ੍ਵਾਰੇ ਪ੍ਰਗਟ ਹੋਤਾ ਹੈ॥੮॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਜਿਥੇ (ਭੀ) ਵੇਖਦਾ ਹਾਂ, ਉਥੇ ਸਿਰਫ਼ ਪਰਮਾਤਮਾ ਹੀ ਹੈ, ਪਰ ਗੁਰੂ ਦੀ ਸਰਨ ਪਿਆਂ ਹੀ ਇਹ ਸਮਝ ਆਉਂਦੀ ਹੈ ॥੮॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਖਾ = ਦੇਖਾਂ, ਮੈਂ ਵੇਖਦਾ ਹਾਂ। ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਸਰਨ ਪਿਆਂ ॥੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "donde sea que volteo a ver, ahí veo al Señor. Él Mismo se le revela al Gurmukj. (8)"