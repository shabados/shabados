[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਡਭਾਗੀ ਮਿਲੁ ਸੰਗਤੀ; ਸਚਾ ਸਬਦੁ ਵਿਸਾਹੁ ॥"
page = 46
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting with the society of saints, O very lucky Fellow purchase thou the True name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿਸੰਗਤ ਨਾਲ ਜੁੜ ਕੇ, ਹੇ ਭਾਰੇ ਨਸੀਬਾਂ ਵਾਲਿਆਂ! ਤੂੰ ਸੱਚੇ ਨਾਮ ਨੂੰ ਵਿਹਾਝ ਲੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O most fortunate ones, join the Sangat, the Blessed Congregation; purchase the True Word of the Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਅਤਿ ਪੁੰਨਵਾਨ ਪੁਰਸ ਹੈਂ, ਸੋ ਸਤਿਸੰਗਤਿ ਮੇਂ ਮਿਲ ਕਰ (ਗੁਰੋਂ ਕਾ) ਸਚਾ ਉਪਦੇਸ਼ (ਵਿਸਾਹੁ) ਖਰੀਦਤੇ ਹੈਂ। ਭਾਵ ਯਹਿ ਕਿ ਸਰਧਾ ਰੂਪੀ ਪੂੰਜੀ ਦੇ ਕਰ ਉਪਦੇਸ਼ ਰੂਪੁ ਉੱਤਮ ਵਸਤੂ ਮੋਲ ਲੇਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਭਾਗਾਂ ਵਾਲੇ (ਮਨ!) ਸਾਧ ਸੰਗਤਿ ਵਿਚ ਮਿਲ ਬੈਠ, (ਤੇ ਉਥੋਂ) ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ (ਦਾ ਸੌਦਾ) ਖ਼ਰੀਦ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਡਭਾਗੀ = ਹੇ ਵੱਡੇ ਭਾਗਾਂ ਵਾਲੇ (ਮਨ)! ਵਿਸਾਹੁ = ਵਿਹਾਝ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Anda ve, oh afortunado, a la Congregación de los Santos y pon tu confianza en la Verdadera Palabra,"