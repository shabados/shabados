[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਨਿ ਪਰੇ ਹਠ ਠਾਨਿ ਤਹੀ; ਸਿਰਦਾਰਨ ਤੇਟਿ ਬਰੰਗਨਿ ਭੇਟੇ ॥"
page = 813

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The heroes pounced upon them."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਹਠ ਪੂਰਵਕ ਉਥੇ ਆ ਪਏ ਹਨ। (ਉਥੇ) ਸਰਦਾਰਾਂ ਨੂੰ ਤਾੜ ਕੇ ਅਪੱਛਰਵਾਂ ਮਿਲ ਰਹੀਆਂ ਹਨ।"