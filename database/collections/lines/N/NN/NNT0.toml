[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਤੇ, ਕਛੂ ਨ ਮੁਖ ਤੇ ਭਾਖੋ ॥"
page = 885

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘If thief came, we will keep him as our son and will say nothing more."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੁਖ ਤੋਂ ਕੁਝ ਨਹੀਂ ਕਹਾਂਗੇ।"