type = "primary"
data = "ਮੂਰਖ ਪਰਿਯੋ ਦੇਗ ਮੈ ਜਾਵੈ ॥"
page = 912

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She was taking him to get him killed, but the fool in the cookingvessel was happily to be moved."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਉਹ) ਮੂਰਖ ਦੇਗ ਵਿਚ ਪਿਆ ਹੋਇਆ ਜਾ ਰਿਹਾ ਸੀ।"