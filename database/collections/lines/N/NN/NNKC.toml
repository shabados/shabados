[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਬਿਗਤਿ ਗਤਿ ਅਗਾਧ ਬੋਧ; ਅਪਰੰਪਰੁ ਬਾਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "His unmanifest position is unknowable and His form and guise is formless."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਗਤੀ ਅਬਗਤ ਹੈ (ਭਾਵ ਜਾਣੀ ਨਹੀਂ ਜਾਂਦੀ, 'ਅਗਾਧ') ਡੂੰਘੀ ਹੈ (ਉਸ ਦਾ) 'ਬੋਧ' ਪਾਰ ਤੋਂ ਰਹਿਤ ਸਰੂਪ ਵਾਲਾ ਹੈ।"