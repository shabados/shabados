[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਗਨਿ ਸੀਤ ਕਾ; ਲਾਹਸਿ ਦੂਖ ॥"
page = 179
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "as the heat of fire removes the pain of cold,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਅੱਗ ਠੰਢ ਦੀ ਪੀੜ ਨੂੰ ਦੂਰ ਕਰ ਦਿੰਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "like fire which takes away the pain of cold"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਅਗਨੀ ਸੀਤ ਕਾ ਦੁਖ ਲਾਹੁਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ, ਅੱਗ ਪਾਲੇ ਦਾ ਦੁੱਖ ਦੂਰ ਕਰ ਦੇਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੀਤ = ਠੰਡ। ਲਾਹਸਿ = ਲਾਹ ਦੇਂਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así como el fuego nos calienta en el frío,"