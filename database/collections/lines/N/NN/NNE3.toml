[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਜਨਮੁ ਸਕਾਰਥਾ; ਗੁਰਬਾਣੀ ਪੜ੍ਹਿ ਸਮਝਿ ਸੁਣੇਹੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Man by becoming gurmukh- Guru oriented, makes his life meaningful; he reads Gurbani and makes others understand (the importance of) bani."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਉਨ੍ਹਾਂ) ਗੁਰਮੁਖਾਂ ਦਾ ਜਨਮ ਸਫਲ ਹੈ (ਜੋ) ਗੁਰੂ ਜੀ ਦੀ ਬਾਣੀ (ਆਪ) ਪੜ੍ਹਕੇ ਤੇ ਸਮਝਕੇ ਸੁਣਾਉਂਦੇ ਹਨ; (ਭਾਵ ਦੀਵਾ ਬਾਲਕੇ ਪੜੋਪੇ ਹੇਠ ਨਹੀਂ ਲੁਕਾਉਂਦੇ, ਹੋਰਨਾਂ ਨੂੰ ਵੀ ਚਾਨਣ ਕਰਦੇ ਹਨ)।"