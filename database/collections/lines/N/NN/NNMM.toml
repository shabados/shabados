[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਕਲ ਨਾਮ ਜਮਦਾੜ ਕੇ; ਲੀਜਹੁ ਸੁਕਬਿ ਸੁਧਾਰਿ ॥੩੮॥"
page = 719

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "then O poets! Then the names of Jamadaadh can be understood correctly.38."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਸਾਰੇ 'ਨਾਮ' 'ਜਮਦਾੜ੍ਹ' (ਦੇ ਹੋ ਜਾਣਗੇ)। ਕਵੀ ਜਨ (ਮਨ ਵਿਚ ਇਹ) ਧਾਰ ਲੈਣ ॥੩੮॥"