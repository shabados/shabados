[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਖਤ ਸ੍ਵਰਗ ਭਹਰਾਤ; ਘੋਰ ਆਭਾ ਲਖਿ ਕੈ ਜਿਹ ॥"
page = 694

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Having dreadful form and repeating the dreadful mantra, seeing whom even the heaven becomes fearful,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਭਿਆਨਕ ਚਮਕ ਦਮਕ ਵੇਖ ਕੇ 'ਸਵਰਗ' (ਨਾਂ ਵਾਲਾ ਯੋਧਾ ਵੀ) ਕੰਬਦਾ ਹੈ।"