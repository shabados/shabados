[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਉ ਭਰਮੁ ਬਿਨਸੇ ਬਿਕਾਰ ॥"
page = 1340
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and is rid of his fears, doubts and sins."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਦੇ ਡਰ, ਸੰਦੇਹ ਅਤੇ ਪਾਪ ਨਾਸ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "they are rid of fear, doubt and corruption."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਨਮ ਮ੍ਰਿਤ ਕਾ ਭੈ ਔ ਪਾਂਚ ਪ੍ਰਕਾਰ ਕਾ ਭਰਮ ਔਰ ਵਿਕਾਰੋਂ ਕੇ ਸਮਦਾਯ ਤਿਨੋਂ ਕੇ ਨਾਸ ਹੋ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹਨਾਂ ਦੇ ਅੰਦਰੋਂ) ਡਰ ਭਟਕਣਾ (ਆਦਿਕ ਸਾਰੇ) ਵਿਕਾਰ ਨਾਸ ਹੋ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਰਮੁ = ਵਹਿਮ, ਭਟਕਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y liberados del miedo, la duda y la corrupción."