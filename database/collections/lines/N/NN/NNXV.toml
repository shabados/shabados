[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਫਿਰੈ ਰੁੰਡ ਮੁੰਡੰ ਸੁ ਝੁੰਡੰ ਨਿਸਾਨੰ ॥"
page = 244

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The chopped trunks of the elephants are falling down and the torn banners are swinging hither and thither"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਿਰ ਅਤੇ ਧੜ ਭੱਜੇ ਫਿਰਦੇ ਸਨ। ਝੰਡਿਆਂ ਦੇ ਢੇਰ ਲੱਗੇ ਪਏ ਸਨ।"