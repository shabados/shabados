[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੁ ਸਾਗਰੁ. ਪੂਰਾ ਭੰਡਾਰ ॥"
page = 363
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru is an ocean and perfect treasure,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਸਮੁੰਦਰ ਹੈ, ਉਸ ਦਾ ਪੂਰਨ ਖ਼ਜ਼ਾਨਾ ਅਨਗਿਣਤ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru is the ocean, the perfect treasure,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰ (ਸਾਗਰੁ) ਸਮੁੰਦ੍ਰ ਰੂਪ ਹੈਂ ਪੁਨਾ ਤਿਨ ਕਾ ਭੰਡਾਰ ਪੂਰਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਸਮੁੰਦਰ ਹੈ ਅਤੇ ਉਸ ਦਾ ਖ਼ਜ਼ਾਨਾ ਅਖੁੱਟ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਗਰੁ = ਸਮੁੰਦਰ। ਪੂਰਾ = ਭਰਿਆ ਹੋਇਆ। ਭੰਡਾਰ = ਖ਼ਜ਼ਾਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru es el Mar, el Tesoro Perfecto,"