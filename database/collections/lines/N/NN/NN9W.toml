[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਿਰੁ ਕਲਵਤੁ ਲੈ ਲਖ ਵਾਰ; ਹੋਮੇ ਕਟਿ ਕਟਿ ਤਿਲੁ ਤਿਲੁ ਦੇਹੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "If a saw is held one's head and the body is cut piece by piece to be put as burnt offerings;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਿਰ ਪੁਰ ਕੁਲਵੱਤ੍ਰ ਭਾਵੇਂ ਲਖ ਵਾਰ ਲਵੇ ਤੇ ਦੇਹੀ ਨੂੰ ਰਤਾ ਰਤਾ ਕਟਾਕੇ ਹਵਨ ਕਰੇ।"