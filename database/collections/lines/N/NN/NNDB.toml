[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਉਕ ਪਰੀ ਨਹੀ ਪੀਯ ਪਿਖਿਯੋ ਕਬਿ ਸ︀ਯਾਮ ਕਹੈ ਤਿਨ ਸੋਕ ਜਨਾਯੋ ॥੨੧੯੨॥"
page = 518

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She, being startled, awoke and became agitated.2192."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਵੀ ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, (ਉਹ) ਚੌਂਕ ਕੇ (ਉਠ) ਬੈਠੀ, (ਪਰ) ਪ੍ਰਿਯ ਨੂੰ ਨਾ ਵੇਖ ਕੇ ਉਸ ਨੇ ਸੋਗ ਮੰਨਾਇਆ ॥੨੧੯੨॥"