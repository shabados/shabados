[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਖਣਿ ਆਖੈ; ਬਕੈ ਸਭੁ ਕੋਇ ॥"
page = 362
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Utter they all through words and speech."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਲਫ਼ਜ਼ਾਂ ਅਤੇ ਬਚਨਾਂ ਦੁਆਰਾ ਕਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everyone talks and speaks through speech;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਆਖਣਿ) ਆਖ੍ਯਾਨ ਜੋ ਪੂਰਬ ਰਿਖੀਓਂ ਨੇ ਪੌਰਾਣਿਕ (ਆਖੈ) ਕਹੇ ਹੂਏ ਹੈਂ ਤਿਨ ਕੋ ਸਭ ਕੋਈ (ਬਕੈ) ਕਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਰਿਵਾਜੀ ਤੌਰ ਤੇ ਹਰੇਕ ਮਨੁੱਖ ਆਖਦਾ ਹੈ, ਸੁਣਾਂਦਾ ਹੈ ਕਿ (ਪਰਮਾਤਮਾ) ਹਰੇਕ ਦੇ ਨੇੜੇ ਵੱਸਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਖਣਿ ਆਖੈ = ਆਖਣ ਨੂੰ ਆਖਦਾ ਹੈ, ਰਿਵਾਜੀ ਤੌਰ ਤੇ ਆਖਦਾ ਹੈ। ਬਕੈ = ਬੋਲਦਾ ਹੈ। ਸਭੁ ਕੋਇ = ਹਰੇਕ ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Podrán recitar palabras y hacer discursos,"