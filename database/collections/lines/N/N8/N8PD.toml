[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਾਰਿ ਪਹਰ; ਚਹੁ ਜੁਗਹ ਸਮਾਨੇ ॥"
page = 375
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The four watches of the day are like the four ages."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਦੇ ਚਾਰੇ ਪਹਿਰ ਚਹੁੰ ਜੁਗਾਂ ਦੇ ਮਾਨੰਦ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The four watches of the day are like the four ages."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚਾਰ ਪਹਰ ਦਿਨ ਕੇ ਮੁਝੇ ਚਾਰੋਂ ਜੁਗੋਂ ਕੇ ਸਮਾਨ ਬੀਤਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਦਿਨ ਦੇ) ਚਾਰ ਪਹਰ (ਵਿਛੋੜੇ ਵਿਚ ਮੈਨੂੰ) ਚਾਰ ਜੁਗਾਂ ਦੇ ਬਰਾਬਰ ਜਾਪਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਮਾਨੇ = ਸਮਾਨ, ਬਰਾਬਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los cuatro turnos del día son tan largos como épocas"