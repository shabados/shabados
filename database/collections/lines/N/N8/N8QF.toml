[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਓਅੰਕਾਰੁ ਆਕਾਰੁ ਕਰਿ; ਹੋਇ ਪਿੰਡ ਪਰਾਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The same Formless Lord assuming different forms is residing in all the bodies."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਤਿਕੂੰ) ਓਅੰਕਾਰ ਸਰੂਪ ਰਚਕੇ ਦੇਹ ਤੇ ਜਿੰਦ ਹੋ ਜਾਂਦਾ ਹੈ।"