[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਸਮਝੇ; ਜਮ ਕਾ ਦੁਖੁ ਸਹਸੀ ॥"
page = 415
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "without (true) understanding, it shall suffer the torture of death."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੀ ਸਮਝ ਦੇ ਬਗੈਰ, ਇਹ ਮੌਤ ਦਾ ਕਸ਼ਟ ਸਹਾਰੇਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without understanding, it shall suffer the pains of death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਿਨਾਂ ਸਮਝੇ ਜਮ ਕਾ ਦੁਖੁ ਹੀ ਸਹਾਰੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਅਸਲੇ ਦੀ ਸੂਝ ਤੋ ਬਿਨਾ ਇਹ ਮਨ ਆਤਮਕ ਮੌਤ ਦਾ ਦੁੱਖ ਸਹਾਰੇਗਾ ਹੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਮ ਕਾ ਦੁਖ = ਆਤਮਕ ਮੌਤ ਦਾ ਦੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pues sin el conocimiento va a sufrir las convulsiones de la muerte."