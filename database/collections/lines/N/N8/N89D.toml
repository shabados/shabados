[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਤੇ ਊਚ ਭਗਤ; ਜਾ ਕੈ ਸੰਗਿ ॥"
page = 1236
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is the Highest of the high, with whom abide His saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਬੁੰਲਦਾਂ ਦਾ ਪਰਮ ਬੁਲੰਦ ਹੈ, ਜਿਸ ਦੇ ਨਾਲ ਵਸਦੇ ਹਨ ਉਸ ਦੇ ਸਾਧੂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is above all, and yet He dwells with His devotees."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਤੇ ਊਚਾ ਹੈ ਔਰ ਭਗਤ ਜਿਸ ਕੇ ਸੰਗ ਮੇਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! ਉਹ ਪਰਮਾਤਮਾ ਸਭ ਤੋਂ ਉੱਚਾ ਹੈ ਜਿਸ ਦੇ ਦਰ ਤੇ ਅਨੇਕਾਂ ਭਗਤ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੈ ਸੰਗਿ = ਜਿਸ ਦੇ ਨਾਲ, ਜਿਸ ਦੇ ਦਰ ਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél con quien Dios está, es lo más Alto de lo alto"