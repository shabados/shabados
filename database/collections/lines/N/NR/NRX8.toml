data = "ਸੁਨਹੁ ਰਾਇ, ਇਕ ਬਾਤ ਹਮਾਰੀ ॥"
page = 839

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Minister started narration and said, ‘My Raja, listen to another anecdote."

[[content]]
