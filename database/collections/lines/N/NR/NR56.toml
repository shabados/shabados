[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਟੀਐ ਤੇਰਾ; ਅਹੰ ਰੋਗੁ ॥"
page = 211
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thy ailment of ego shall be eradicated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਹੰਕਾਰ ਦੀ ਬੀਮਾਰੀ ਨਵਿਰਤਾ ਹੋ ਜਾਏਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The disease of your ego shall be eradicated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਹੰਕਾਰ ਰੂਪੀ ਰੋਗ ਕਟ ਜਾਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਹਰਿ-ਨਾਮ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਤੇਰਾ ਹਉਮੈ ਦਾ ਰੋਗ ਕੱਟਿਆ ਜਾ ਸਕਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਟੀਐ = ਕੱਟਿਆ ਜਾ ਸਕਦਾ ਹੈ। ਅਹੰ = ਹਉਮੈ {अहं = ਮੈਂ ਮੈਂ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La aflicción del ego te deja"