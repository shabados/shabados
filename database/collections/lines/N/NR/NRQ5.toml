[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਣੈਹਾਰੁ ਪਛਾਨਿਆ ॥"
page = 212
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who realises the Creator,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਿਰਜਣਹਾਰ ਨੂੰ ਅਨੁਭਵ ਕਰ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who realize the Creator Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜਿਸ ਨੇ ਕਰਣੇਹਾਰ ਕੋ ਪਛਾਣਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਮਨੁੱਖ ਨੇ ਸਿਰਜਣਹਾਰ ਕਰਤਾਰ ਨਾਲ ਸਾਂਝ ਪਾ ਲਈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਣੈਹਾਰੁ = ਸਿਰਜਣਹਾਰ ਕਰਤਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que toma Conciencia del Señor Creador,"