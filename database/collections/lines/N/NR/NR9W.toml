[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸੁਖ ਫਲੁ, ਅਲਖ ਲਖੋਈ ॥੨੦॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Gurmukhs beholding the invisible Lord receive the fruits of that pleasure."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾਂ ਨੂੰ ਸੁਖ ਫਲ (ਅਰਥਾਤ) ਅਲਖ ਨਿਰੰਕਾਰ ਦੀ ਲੱਖਤਾ ਹੁੰਦੀ ਹੈ।"