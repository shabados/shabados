[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਰੇ; ਦੂਜਾ ਭਾਉ ਚੁਕਾਇ ॥"
page = 33
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Soul! forsake another's love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਆਤਮਾ! ਹੋਰਸੁ ਦੀ ਪ੍ਰੀਤ ਨੂੰ ਤਿਆਗ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mind, give up the love of duality."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ ਪ੍ਯਾਰੇ! ਤੂੰ  ਦ੍ਵੈਤ ਭਾਵਨਾ ਕੋ ਰਿਦੇ ਸੇ (ਚੁਕਾਇ) ਦੂਰ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! (ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਆਪਣੇ ਅੰਦਰੋਂ) ਮਾਇਆ ਦਾ ਪਿਆਰ ਦੂਰ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, haz a un lado tus dudas."