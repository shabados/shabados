[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਫੋਕਟਿ ਧਰਮੀ, ਭਰਮਿ ਭੁਲਾਵੈ ॥੧੮॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "These all are religious hypocrities and are tossing in delusions."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਫੋਕੇ ਧਰਮੀ ਭਰਮ ਵਿਚ ਹੀ ਭੁੱਲ ਗਏ।"