[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਥੀ ਪਉਦੀ; ਕਾਹੇ ਰੋਵੈ ॥੩॥"
page = 989
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why weeps he, when he falls into the hands of death's myrimidons?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਹ ਮੌਤ ਦੇ ਫ਼ਰੇਸ਼ਤਿਆਂ ਦੇ ਹੱਥੀ ਹੜ੍ਹਦਾ ਹੈ, ਤਾਂ ਉਹ ਕਿਉਂ ਵਿਰਲਾਪ ਕਰਦਾ ਹੈਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When he falls into the hands of the Messenger of Death, what good does it do to cry out? ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਜਮੋਂ ਨੇ ਆਇਕੇ ਹਾਥ ਪਾਏ ਅਰਥਾਤ ਜਬ ਪਕੜ ਲੀਆ ਫੇਰ ਕਿਉਂ ਬਚੇਗਾ? ਪੁਨਾ ਤੇਰੇ ਕੋ ਤੋ ਰੋਣਾ ਹੀ ਹੋਵੇਗਾ, ਭਾਵ ਵੈਰਾਗ ਕਰ ਹੁਣ ਰੁਦਨ ਕਰੁ; ਵਾ ਜਿਸ ਕਰ ਰੋਣਾ ਨ ਪੜੇ ਸੋ ਜਤਨ ਕਰੁ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਜਮਾਂ ਦੇ ਹੱਥ ਪੈਂਦੇ ਹਨ, ਤਦੋਂ ਰੋਣ ਪਛੁਤਾਣ ਦਾ ਕੋਈ ਲਾਭ ਨਹੀਂ ਹੋ ਸਕਦਾ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਥੀ ਪਉਦੀ = ਜਦੋਂ (ਜਮਾਂ ਦੇ) ਹੱਥ ਪੈਂਦੇ ਹਨ। ਕਾਹੇ ਰੋਵੈ = ਕਿਉਂ ਰੋਂਦਾ ਹੈ? ਰੋਣ ਦਾ ਕੋਈ ਲਾਭ ਨਹੀਂ ਹੁੰਦਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el mensajero de la muerte, ¿por qué nos afligimos?(3)"