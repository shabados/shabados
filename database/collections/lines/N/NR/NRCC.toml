[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੁਕਤਿ ਜੁਗਤਿ ਏਹਾ ਨਿਧਾਨ ॥"
page = 987
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This is the way of emancipation and this lone is my treasure."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਹੇ ਮਾਰਗ ਮੋਖ਼ਸ਼ ਦਾ ਅਤੇ ਕੇਵਲ ਇਹ ਹੀ ਹੈ ਮੇਰਾ ਖ਼ਜ਼ਾਨਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This way of liberation is my treasure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੁਕਤੀ ਕੀ ਜੁਗਤੀ ਭੀ ਇਹੀ ਹੈ ਪੁਨਾ ਨਿਧੋਂ ਕਾ ਖਜਾਨਾ ਭੀ ਏਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤਾਂ ਦੀ ਸੰਗਤ ਹੀ ਮੇਰੇ ਵਾਸਤੇ ਸਾਰੇ ਖ਼ਜ਼ਾਨੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਕਤਿ ਜੁਗਤਿ = ਵਿਕਾਰਾਂ ਤੋਂ ਖ਼ਲਾਸੀ ਪਾਣ ਦਾ ਤਰੀਕਾ। ਨਿਧਾਨ = ਖ਼ਜ਼ਾਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Este es el Sendero de la Liberación, este es mi Tesoro,"