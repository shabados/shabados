[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੋਹਨਿ. ਮੋਹਿ ਲੀਆ; ਮਨੁ ਮੋਹਿ ॥"
page = 1187
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My fascinating Lord, has fascinated my mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਨਮੋਹਨ ਸੁਆਮੀ ਨੇ ਮੇਰਾ ਚਿੱਤ ਮੋਹਿਤ ਕਰ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My Fascinating Lord has fascinated my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰਾ ਮਨੁ ਤੌ (ਮੋਹਨਿ) ਪਰਮੇਸ੍ਵਰ ਨੇ ਮੋਹ ਲੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੈਂ ਮੋਹਨ ਨੇ (ਆਪਣੇ ਕੌਤਕਾਂ ਨਾਲ) ਮੇਰਾ ਮਨ ਮੋਹ ਲਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਨਿ = ਮੋਹਨ ਨੇ। ਮਨੁ ਮੋਹਿ = ਮੇਰਾ ਮਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Fascinante Señor, Le has fascinado a mi mente,"