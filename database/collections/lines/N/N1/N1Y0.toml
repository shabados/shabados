[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਸਾਹਿਬ ਕੀ ਟੇਕ; ਨਾਨਕ. ਮਨੈ ਮਾਹਿ ॥"
page = 517
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In his mind, Nanak has the mainstay of the Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਦੇ ਹਿਰਦੇ ਅੰਦਰ ਉਸ ਸੁਆਮੀ ਦਾ ਆਸਰਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That Lord and Master is my Anchor and Support; O Nanak, hold firm in your mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਸਚੇ ਸਾਹਿਬ ਕੀ ਟੇਕ ਮਨ ਮੇਂ ਰਖੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਦੇ ਮਨ ਵਿਚ ਭੀ ਉਸ ਮਾਲਕ ਦਾ ਆਸਰਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ese Señor y Maestro es mi Ancla y mi Soporte, oh Nanak, mantente firme en tu mente."