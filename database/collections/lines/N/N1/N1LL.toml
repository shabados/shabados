[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਗਿਆਨੁ ਰਤਨੁ; ਹਿਰਿ ਲੀਨੑ ॥੧॥ ਰਹਾਉ ॥"
page = 482
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "which has snatched away from me the gem of Divine Knowledge. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਮੇਰੇ ਕੋਲੋਂ ਬ੍ਰਹਿਮ-ਬੋਧ ਦਾ ਜਵੇਹਰ ਖੱਸ ਲਿਆ ਹੈ। ਠਹਿਰਾਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "which has taken the jewel of spiritual wisdom away from me. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਾਇਆ ਮੋਹ ਨੇ ਗਿਆਨ ਰਤਨ ਕੋ ਹਿਰ ਲਿਆ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਸਾਡਾ ਗਿਆਨ-ਰੂਪ ਹੀਰਾ ਚੁਰਾ ਲਿਆ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਮੋਹ-ਪਿਆਰ) ਨੇ। ਹਿਰਿ ਲੀਨ੍ਹ੍ਹ = ਚੁਰਾ ਲਿਆ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "quien ha arrancado de mí la Joya de la Sabiduría. (1‑Pausa)"