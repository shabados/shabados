[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਖ ਲਖ ਜੋਗ ਧਿਆਨ ਮਿਲਿ; ਧਰਿ ਧਿਆਨੁ ਬਹੰਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "If lacs of yogis sit in meditation jointly;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਲਖਾਂ ਜੋਗੀ ਲੋਕ, ਲੱਖਾਂ ਧਿਆਨੀ ਮਿਲਕੇ ਧਿਆਨ ਲਾਕੇ ਬੈਠਦੇ ਹਨ।"