[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸੂਲੀ ਉਪਰਿ ਖੇਲਣਾ; ਪਿਛੋਂ ਦੇ ਸਿਰਿ ਛਤ੍ਰੁ ਧਰਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "First that poppy suffers on a long thorn but afterwards becoming circular assumes the shape of canopy."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸੂਲੀ' ਡੰਡੀ ਉਪਰ ਪੋਸਤ ਖੇਲਦਾ ਹੈ, ਪਿਛੋਂ ਸਿਰ ਪੁਰ ਛਤਰ ਧਾਰਦਾ ਹੈ। (ਭਾਵ ਛਤ੍ਰਾਕਾਰ ਹੋ ਜਾਂਦਾ ਹੈ)।"