[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕੁ ਦੀਨੁ; ਜਾਚੈ ਤੇਰੀ ਸੇਵ ॥"
page = 867
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meek Nanak desires to serve Thee, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਸਕੀਨ ਨਾਨਕ ਤੇਰੀ ਘਾਲ ਕਮਾਉਣੀ ਲੋੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak, the meek, desires only to serve You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਮੈਂ ਦੀਨ ਹੋਇ ਕੈ ਤੇਰੀ ਸੇਵਾ ਹੀ ਮਾਂਗਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇਰਾ ਦਾਸ) ਗਰੀਬ ਨਾਨਕ (ਤੈਥੋਂ) ਤੇਰੀ ਭਗਤੀ ਮੰਗਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕੁ ਜਾਚੈ = ਨਾਨਕ ਮੰਗਦਾ ਹੈ {ਨਾਨਕ = ਹੇ ਨਾਨਕ!}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak sólo busca servirte, oh Señor;"