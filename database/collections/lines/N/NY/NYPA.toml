[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਤਿਸੁ ਬਿਨੁ. ਘੜੀ ਨ ਜੀਵਊ; ਬਿਨੁ ਦੇਖੇ. ਮਰਿ ਜਾਉ ॥੬॥"
page = 759
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without him, I can live not even for an instant. I die if I see him not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਬਗੈਰ ਮੈਂ ਇਕ ਮੁਹਤ ਭਰ ਲਈ ਭੀ ਜਿਊ ਨਹੀਂ ਸਕਦਾ। ਉਸ ਨੂੰ ਵੇਖਣ ਦੇ ਬਾਝੋਂ ਮੈਂ ਮਰ ਮੁਕਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without Him, I cannot live, even for an instant. If I do not see Him, I die. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਮੈਂ ਤਿਸ ਗੁਰੂ ਬਿਨਾਂ ਏਕ ਘੜੀ ਭੀ ਨਹੀਂ ਜੀਵਤਾ, ਬਿਨ ਦੇਖੇ ਮਰ ਜਾਤਾ ਹੂੰ, ਭਾਵ ਅਤੀ ਦੁਖਤ ਹੋਤਾ ਹੂੰ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਸ ਗੁਰੂ ਤੋਂ ਬਿਨਾ ਇਕ ਘੜੀ ਭਰ ਭੀ ਆਤਮਕ ਜੀਵਨ ਕਾਇਮ ਨਹੀਂ ਰੱਖ ਸਕਦਾ। ਗੁਰੂ ਦਾ ਦਰਸਨ ਕਰਨ ਤੋਂ ਬਿਨਾ ਮੇਰੀ ਆਤਮਕ ਮੌਤ ਹੋ ਜਾਂਦੀ ਹੈ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਮੈਂ। ਨ ਜੀਵਊ = (ਆਤਮਕ ਜੀਵਨ) ਜੀਊ ਨਹੀਂ ਸਕਦਾ। ਮਰਿ ਜਾਉ = ਮਰਿ ਜਾਉਂ, ਮੇਰੀ ਆਤਮਕ ਮੌਤ ਹੋ ਜਾਂਦੀ ਹੈ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que sin Él no puedo vivir ni por un instante, si no Lo veo, muero(6)"