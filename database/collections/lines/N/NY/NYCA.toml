[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਵਰੇ ਤੈ; ਗਿਆਨ ਬੀਚਾਰੁ. ਨ ਪਾਇਆ ॥"
page = 793
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O mad man, thou hast gained not the Lord's gnosis and meditation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਗਲੇ ਪ੍ਰਾਣੀ! ਤੁੰ ਪ੍ਰਭੂ ਦੀ ਗਿਆਤ ਅਤੇ ਬੰਦਗੀ ਪਰਾਪਤ ਨਹੀਂ ਕੀਤੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mad man, you have not obtained spiritual wisdom and meditation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਾਵਰੇ! ਤੈਂਨੇ ਗਯਾਨ ਦਾ ਜਨਕੁ ਬੀਚਾਰੁ ਨਹੀਂ ਪਾਯਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਮਲੇ ਮਨੁੱਖ! ਤੂੰ (ਪਰਮਾਤਮਾ ਨਾਲ) ਜਾਣ-ਪਛਾਣ (ਕਰਨ) ਦੀ ਸੂਝ ਪ੍ਰਾਪਤ ਨਹੀਂ ਕੀਤੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਵਰੇ = ਹੇ ਕਮਲੇ! ਤੈ = ਤੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh tonto, no has sido bendecido con Sabiduría"