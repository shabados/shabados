[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਉ ਜਮੁ. ਕਹਾ ਕਰੇ; ਮੋ ਸਿਉ ਆਗੈ ॥੧॥ ਰਹਾਉ ॥"
page = 356
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then, what can the death's courier, do unto me, hereafter? Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਮੌਤ ਦਾ ਦੂਤ ਅੱਗੇ ਮੈਨੂੰ ਕੀ ਕਰ ਸਕਦਾ ਹੈ? ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So what can the Messenger of Death do to me hereafter? ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਆਗੇ ਪਰਲੋਕ ਮੇਂ ਮੇਰੇ ਕੋ ਜਮੁ ਕਿਆ ਕਰੇਗਾ ਅਰਥਾਤ ਕੁਛ ਨਹੀਂ ਕਰੇਗਾ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਪਰਲੋਕ ਵਿਚ ਜਮ ਮੇਰਾ ਕੁਝ ਭੀ ਨਹੀਂ ਵਿਗਾੜ ਸਕਦਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਗੈ = ਪਰਲੋਕ ਵਿਚ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Que podría entonces Yama, el mensajero de la muerte hacer a aquél en el más allá? (1-Pausa)"