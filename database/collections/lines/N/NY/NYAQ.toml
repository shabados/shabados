[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਰਾਗ ਰੰਗ ਰਸ ਰੂਪ ਲਖ; ਬਹੁ ਭੋਗ ਭੁਲਾਵਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Lacs of sounds, colours, flowers and forms delude people in enjoyments."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਰਾਗ, ਰੰਗ ਰਸ ਅਤੇ ਰੂਪ ਲਖਾਂ ਭੋਗਾਂ ਦੇ ਭੁਲਾਏ ਬਾਹਲੇ।"