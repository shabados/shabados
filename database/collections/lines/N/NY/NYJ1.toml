[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ; ਸੇ ਜਨ ਭਏ ॥"
page = 272
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Only those persons, become God-divines,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਓਹੀ ਪੁਰਸ਼ ਵਾਹਿਗੁਰੂ ਨੂੰ ਜਾਨਣ ਵਾਲੇ ਥੀਵਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They alone become God-conscious beings,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਐਸੇ ਬ੍ਰਹਮ ਗਿਆਨੀ ਸੋਈ ਜਨ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਮਨੁੱਖ ਬ੍ਰਹਮਗਿਆਨੀ ਬਣਦੇ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Solamente aquél que es visitado por la Perfecta Gracia del Señor,"