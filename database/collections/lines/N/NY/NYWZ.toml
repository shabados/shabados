[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਧਨੁ ਪਾਰਥ ਕੋ ਤਿਹ ਕਾਟਿ ਦਯੋ; ਪੁਨਿ ਕਾਟਿ ਕੈ ਭੀਮ ਗਦਾ ਊ ਗਿਰਾਈ ॥"
page = 458

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He caused the bow of Arjuna to fall down and also the mace of Bhima"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ (ਖੜਗ ਸਿੰਘ) ਨੇ ਅਰਜਨ ਦਾ ਧਨੁਸ਼ ਤੋੜ ਸੁਟਿਆ ਹੈ ਅਤੇ ਫਿਰ ਭੀਮ ਸੈਨ ਦੀ ਗਦਾ ਨੂੰ ਵੀ ਕਟ ਕੇ ਸੁਟ ਦਿੱਤਾ ਹੈ।"