[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਰਮੇਸਰੁ ਹੋਆ ਦਇਆਲੁ ॥"
page = 1271
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Transcendent Lord has become merciful,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਪ੍ਰਭੂ ਮਿਹਰਬਾਨ ਹੋ ਗਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Transcendent Lord God has become merciful;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸ੍ਵਰ ਹਮਾਰੇ ਪਰ ਦ੍ਯਾਲ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਮਨੁੱਖ ਉੱਤੇ) ਪਰਮਾਤਮਾ ਦਇਆਵਾਨ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਮੇਸਰੁ = ਪਰਮ-ਈਸਰੁ, ਸਭ ਤੋਂ ਵੱਡਾ ਮਾਲਕ-ਪ੍ਰਭੂ। ਦਇਆਲੁ = ਦਇਆਵਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios, nuestro Señor Trascendente nos ha mostrado Su Misericordia,"