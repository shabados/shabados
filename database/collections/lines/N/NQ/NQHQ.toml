data = "ਜੂਨਿ ਸਯਾਲ ਜਾਟ ਕੀ ਧਰੋ ॥"
page = 937

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘You go to the domain of humanity and take birth into the family of Sial Jat.’"

[[content]]
assets = ["RSJD"]
type = "translation"
