[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਚਰਣੀ; ਨਾਨਕ. ਮਨੁ ਲਾਗਾ ॥੪॥੧੪॥੧੬॥"
page = 867
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and with the Lord's feet his soul is attached, O Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪ੍ਰਭੂ ਦੇ ਚਰਨਾਂ ਦੇ ਨਾਲ ਉਸ ਦੀ ਆਤਮਾ ਜੁੜ ਗਈ ਹੈ, ਹੇ ਨਾਨਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, his mind is attached to the Lord's Feet. ||4||14||16||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਨ ਕਾ ਮਨ ਹਰੀ ਕੇ ਚਰਨੋਂ ਮੇਂ ਲਾਗਾ ਹੈ॥੪॥੧੪॥੧੬॥☬ਬ੍ਰਹਮਾਦਿ ਸਭ ਸੇ ਅਗਾਧ ਗਤੀ ਕਹ ਕਰ ਪਰਮੇਸਰ ਕੇ ਸਨਮੁਖ ਬੇਨਤੀ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਦਾ ਮਨ ਪਰਮਾਤਮਾ ਦੇ ਚਰਨਾਂ ਵਿਚ ਜੁੜਿਆ ਰਹਿੰਦਾ ਹੈ ॥੪॥੧੪॥੧੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "su mente despierta es entonada a los Pies del Maestro. (4-14-16)"