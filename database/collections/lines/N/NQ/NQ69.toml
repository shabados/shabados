[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਰਵਿਦਾਸ; ਅਬ ਤ੍ਰਿਸਨਾ ਚੂਕੀ ॥"
page = 875
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Ravidas, my desire has now been quenched."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਵਿਦਾਸ ਜੀ ਆਖਦੇ ਹਨ, ਹੁਣ ਮੇਰੀ ਖਾਹਿਸ਼ ਬੁੱਝ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Ravi Daas, now my thirst is quenched;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਰਵਿਦਾਸ ਜੀ ਕਹਤੇ ਹੈਂ: ਅਬ ਔਰ ਤ੍ਰਿਸਨਾ ਤੌ ਚੂਕ ਗਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਵਿਦਾਸ ਆਖਦਾ ਹੈ- ਹੁਣ ਮੇਰੀ ਤ੍ਰਿਸ਼ਨਾ ਮੁੱਕ ਗਈ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੂਕੀ = ਮੁੱਕ ਗਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Ravidas, mi ansiedad se ha disuelto para siempre"