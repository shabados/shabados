data = "ਮਾਗਤ ਭੀਖਿ ਹਮਾਰੇ ਆਈ ॥"
page = 927

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There was a daughter of a Jat, the peasant, she came to us for begging."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਭਿਖਿਆ ਮੰਗਦੀ ਸਾਡੇ ਕੋਲ ਆਈ।"