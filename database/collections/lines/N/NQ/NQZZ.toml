[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਸਤੁ. ਨ ਹੋਤਾ, ਬੇਦੁ. ਨ ਹੋਤਾ; ਕਰਮੁ ਕਹਾਂ ਤੇ ਆਇਆ ॥੨॥"
page = 973
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When there were no Shastras and no Vedas, whence did good and bad actions come then?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਨਾਂ ਸ਼ਾਸਤਰ ਸਨ ਅਤੇ ਨਾਂ ਹੀ ਵੇਦ, ਤਦ ਚੰਗੇ ਤੇ ਮੰਦੇ ਅਮਲ ਕਿੱਥੋਂ ਆਏ ਸਨ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When there were no Shaastras and no Vedas, then where did karma come from? ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸਾਸਤ੍ਰ ਨਹੀਂ ਥਾ ਔ ਬੇਦ ਭੀ ਨਹੀਂ ਥਾ ਤਬ ਕਰਮ ਕਾਂਡ ਕਹਾਂ ਸੇ ਆਇਆ ਥਾ ਅਰਥਾਤ ਕਰਮੋਂ ਕਾ ਅਭਾਵ ਥਾ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਕੋਈ ਵੇਦ ਸ਼ਾਸਤਰ ਭੀ ਨਹੀਂ ਸਨ; ਤਦੋਂ (ਹੇ ਪ੍ਰਭੂ!) ਕਰਮਾਂ ਦੀ ਕੋਈ ਹਸਤੀ ਹੀ ਨਹੀਂ ਸੀ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਮੁ ਕਹਾਂ ਤੇ ਆਇਆ = ਜੀਵ ਦੇ ਕੀਤੇ ਕਰਮਾਂ ਦੀ ਅਜੇ ਹਸਤੀ ਹੀ ਨਹੀਂ ਸੀ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y no existían ni los Vedas ni los Shastras, ¿de dónde entonces se originó el Karma?  (2)"