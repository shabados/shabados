[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਉਣ ਪਾਣੀ; ਬੈਸੰਤਰ ਮਾਹਿ ॥"
page = 294
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is in wind water and fire."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਹਵਾ, ਜਲ ਅਤੇ ਅੱਗ ਅੰਦਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He permeates the winds and the waters."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੌਣ, ਪਾਣੀ ਪੁਨਾ ਅਗਨੀ ਬੀਚ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਉਣ ਵਿਚ, ਪਾਣੀ ਵਿਚ, ਅੱਗ ਵਿਚ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੈਸੰਤਰ = ਅੱਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él abarca el aire, el agua y el fuego,"