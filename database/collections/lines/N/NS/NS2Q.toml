[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਕਉ; ਪ੍ਰਭ ਅਪਨੇ ਕਾ ਤਾਣੁ ॥"
page = 677
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is the only support of His slave."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਹੀ ਆਪਣੇ ਦਾਸ ਦਾ ਇਕੋ ਇਕ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is the strength of His humble servants."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਦਾਸੋਂ ਕੌ ਅਪਨੇ ਪ੍ਰਭੂ ਕਾ ਹੀ (ਤਾਣੁ) ਬਲ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪ੍ਰਭੂ ਦੇ ਸੇਵਕ ਨੂੰ ਆਪਣੇ ਪ੍ਰਭੂ ਦਾ ਆਸਰਾ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਤਾਣੁ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No tengo ningún otro soporte más que el Tuyo,"