[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਖ ਸੂਖ ਬਾਧੌ ਸੰਸਾਰ ॥"
page = 1192
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To pain and pleasure the world is bound."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੀੜ ਤੇ ਪ੍ਰਸੰਨਤਾ ਨਾਲ ਦੁਨੀਆਂ ਬੱਧੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The world is bound by pleasure and pain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੁਖ ਔਰ ਸੁਖ ਕਰ ਸਾਰਾ ਸੰਸਾਰੁ ਬਾਂਧਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦਾ ਜਗਤ ਦੇ ਦੁੱਖਾਂ ਸੁਖਾਂ ਵਿਚ ਜਕੜਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਧੌ = ਬੱਝਾ ਹੋਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "estando determinado por el placer y el dolor,"