[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖ ਅਗਿਆਨੀ ਅੰਧੁਲੇ; ਜਨਮਿ ਮਰਹਿ ਫਿਰਿ ਆਵੈ ਜਾਏ ॥"
page = 851
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The unwise perverse persons are blind. They are born to die and come and go over and over again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਸਮਝ ਪ੍ਰਤੀਕੂਲ ਪੁਰਸ਼ ਅੰਨ੍ਹੇ ਹਨ। ਉਹ ਜੰਮਦੇ ਮਰਦੇ ਅਤੇ ਮੁੜ ਮੁੜ ਕੇ ਆਉਂਦੇ ਤੇ ਜਾਂਦੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The ignorant self-willed manmukhs are blind. They are born, only to die again, and continue coming and going."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਮਨਮੁਖ ਅਗ੍ਯਾਨ ਕਰ ਅੰਧੇ ਹੂਏ ਜਨਮਤੇ ਮਰਤੇ ਫਿਰ ਜੋਨੀਓਂ ਮੇਂ ਆਵਤੇ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ ਮਨੁੱਖ ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੂਝ ਤੋਂ ਸੱਖਣੇ ਰਹਿੰਦੇ ਹਨ, ਜੀਵਨ ਦਾ ਸਹੀ ਰਸਤਾ ਉਹਨਾਂ ਨੂੰ ਨਹੀਂ ਦਿੱਸਦਾ (ਇਸ ਵਾਸਤੇ ਉਹ) ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਵਿਚ ਪਏ ਰਹਿੰਦੇ ਹਨ। ਮਨਮੁਖ ਬੰਦਾ ਮੁੜ ਮੁੜ ਜੰਮਦਾ ਮਰਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਮੁਖ = ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ। ਅਗਿਆਨੀ = ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੂਝ ਤੋਂ ਸੱਖਣੇ। ਅੰਧੁਲੇ = ਜਿਨ੍ਹਾਂ ਨੂੰ ਜੀਵਨ ਦਾ ਸਹੀ ਰਸਤਾ ਨਹੀਂ ਦਿੱਸਦਾ। ਜਨਮਿ ਮਰਹਿ = ਜਨਮ ਕੇ ਮਰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los arrogantes Manmukjs están ciegos, nacen sólo para morir una y otra vez."