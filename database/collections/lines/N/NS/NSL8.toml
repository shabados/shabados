[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਕਾ ਅਮਰੁ; ਨ ਮੇਟੈ ਕੋਇ ॥"
page = 1152
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His order, no one can undo."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਹੁਕਮ ਨੂੰ ਕੋਈ ਭੀ ਮੇਟ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one can erase His Eternal Decree."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਹੁਕਮ ਕੋ ਕੋਈ ਮੇਟ ਨਹੀਂ ਸਕਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ (ਪਰਮਾਤਮਾ) ਦਾ ਹੁਕਮ ਕੋਈ ਜੀਵ ਮੋੜ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਮਰੁ = ਹੁਕਮ। ਨ ਮੇਟੈ = ਮੋੜ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿quién podría ir en contra de Su Escrito?"