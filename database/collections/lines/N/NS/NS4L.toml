[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੀ ਸੇਵਾ; ਸਰਬ ਨਿਧਾਨੁ ॥"
page = 184
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Serve Him, in whose service are all the treasures."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਟਹਿਲ ਕਮਾ, ਜਿਸ ਦੀ ਚਾਕਰੀ ਵਿੱਚ ਸਾਰੇ ਖਜਾਨੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serving Him, all treasures are obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਭਗਤੀ ਸਰਬ ਨਿਧੀ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਸੇਵਾ-ਭਗਤੀ ਵਿਚ ਹੀ (ਜਗਤ ਦੇ) ਸਾਰੇ ਖ਼ਜ਼ਾਨੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਧਾਨ = ਖ਼ਜ਼ਾਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, que sirviéndolo te trae todos los Tesoros;"