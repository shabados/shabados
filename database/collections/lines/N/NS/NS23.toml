[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਾਕਾਰਾ ਆਇਆ. ਜਾ ਤਿਸੁ ਭਾਇਆ; ਰੁੰਨੇ ਰੋਵਣਹਾਰੇ ॥"
page = 582
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The messenger comes, when it pleases Him and the mourners begin to weep."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਸ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ, ਹਲਕਾਰਾ ਆ ਜਾਂਦਾ ਹੈ ਤੇ ਰੋਣ ਵਾਲੇ ਰੋਣ ਲੱਗ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The messenger comes, when it pleases the Lord, and the mourners begin to mourn."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਤਿਸ ਮਾਲਕ ਕੋ ਅਛਾ ਲਗਾ ਹੈ ਤਬ ਬੁਲਾਵਾ ਆਇਆ ਹੈ, ਰੋਨੇ ਹਾਰੇ ਰੋਤੇ ਹੈਂ॥☬ਕੌਨ ਰੋਤੇ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਪਰਮਾਤਮਾ ਨੂੰ (ਆਪਣੀ ਰਜ਼ਾ ਵਿਚ) ਚੰਗਾ ਲੱਗਦਾ ਹੈ, ਤਾਂ (ਜੀਵ ਵਾਸਤੇ ਕੂਚ ਦਾ) ਸੱਦਾ ਆ ਜਾਂਦਾ ਹੈ, ਰੋਣ ਵਾਲੇ ਸੰਬੰਧੀ ਰੋਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ = ਜਦੋਂ। ਤਿਸੁ = ਉਸ ਪ੍ਰਭੂ ਨੂੰ। ਰੋਵਣਹਾਰੇ = ਰੋਣ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mensajero vino de la Corte cuando tal fue la Voluntad del Señor, y quienes se tenían que afligir,"