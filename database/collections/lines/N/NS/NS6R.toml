[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਛੁ ਸਾਸਤ੍ਰ ਨ ਮਾਨਤ, ਸਿਮ੍ਰਿਤ ਨ ਜਾਨਤ; ਬੋਲਤ ਕੁਬਿਧਿ ਪ੍ਰਕਾਰ ॥"
page = 562

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They will not accept the Shastras and Smritis and will only talk in uncivilized way"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ਾਸਤ੍ਰਾਂ ਨੂੰ ਕੁਝ ਵੀ ਨਹੀਂ ਮੰਨਣਗੇ, ਸਿਮ੍ਰਿਤੀਆਂ ਨੂੰ ਨਹੀਂ ਸਮਝਣਗੇ ਅਤੇ ਭੈੜੇ ਢੰਗ ਨਾਲ ਬੋਲਣਗੇ।"