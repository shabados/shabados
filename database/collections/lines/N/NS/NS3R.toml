[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਾਗ ਦੋਸ ਮੁਹਿ. ਚਲਿਆ ਲਾਇ ॥"
page = 662
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who departs bearing the stains of sins on his face,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਪਣੇ ਚਿਹਰੇ ਉਤੇ ਪਾਪ ਦਾ ਠੱਪਾ ਲੁਆ ਕੇ ਤੁਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who departs, with these black stains of sin on his face"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਪ੍ਰਕਾਰ ਜਬ ਦੋ ਸਰੂਪ (ਦਾਗ) ਕਲੰਕੋਂ ਕੋ ਮੁਖ ਪਰ ਲਗਾਇ ਚਲਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਿਮਰਨ ਤੋਂ ਸੁੰਞਾ ਰਹਿ ਕੇ ਵਿਕਾਰਾਂ ਵਿਚ ਫਸ ਕੇ) ਮਨੁੱਖ ਵਿਕਾਰਾਂ ਦੇ ਦਾਗ਼ ਆਪਣੇ ਮੱਥੇ ਤੇ ਲਾ ਕੇ (ਇਥੋਂ) ਚੱਲ ਪੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਾਗ ਦੋਸ = ਦੋਸਾਂ ਦੇ ਦਾਗ਼। ਮੁਹਿ = ਮੂੰਹ ਉਤੇ। ਲਾਇ = ਲਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "traicionando su Conciencia"