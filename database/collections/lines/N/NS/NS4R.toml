[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦਿਨੁ ਸਚੁ ਸਲਾਹਣਾ; ਧਨੁ ਧਨੁ ਵਡਭਾਗ ਹਮਾਰਾ ॥੧॥"
page = 564
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day, I praise the True Lord. Blessed, blessed is the greatest good fortune of mine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੈਣ ਦਿਹੁੰ ਮੈਂ ਸੱਚੇ ਪ੍ਰਭੂ ਦੀ ਪ੍ਰਸੰਸਾ ਕਰਦਾ ਹਾਂ। ਮੁਬਾਰਕ! ਮੁਬਾਰਕ ਹੈ ਮੇਰੀ ਪਰਮ ਸ਼੍ਰੇਸ਼ਟ ਕਿਸਮਤ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, I praise the True Lord. Blessed, blessed is my great good fortune. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਰਾਤ੍ਰਿ ਦਿਨ ਸਚ ਕਾ ਹੀ ਸਲਾਹਨਾ ਕਰਤੇ ਹੈਂ, ਇਸੀ ਤੇ ਹਮਾਰਾ ਬਡਾ ਭਾਗ ਹੈ ਅਰ ਹਮ ਧੰਨ ਧੰਨ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਮੈਂ ਹਰ ਵੇਲੇ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦਾ ਹਾਂ, ਮੇਰੇ ਵੱਡੇ ਭਾਗ ਜਾਗ ਪਏ ਹਨ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਦਿਨੁ = ਹਰ ਰੋਜ਼, ਹਰ ਵੇਲੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Enaltezco la Verdad del Señor en mi corazón para siempre. ¡Qué afortunado soy! (1)"