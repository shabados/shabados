[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਸਭੁ ਕਿਛੁ; ਤਿਸ ਕਾ ਦੀਆ ਦਰਬੈ ॥"
page = 282
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "when all the riches are His gifts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਸਾਰੀਆਂ ਦੌਲਤਾਂ ਉਸ ਦੀਆਂ ਦਾਤਾਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All riches are His gifts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸਭ ਕੁਛ ਤਿਸ ਪ੍ਰਭੂ ਕਾ ਹੀ ਦੀਆ ਹੂਆ ਧਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਸਾਰਾ ਧਨ ਉਸ ਪ੍ਰਭੂ ਦਾ ਹੀ ਬਖ਼ਸ਼ਿਆ ਹੋਇਆ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ = ਜਦੋਂ। ਦਰਬੈ = ਧਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "todo proviene de Dios."