data = "ਹਮ ਪਰ ਅਧਿਕ ਕ੍ਰਿਪਾ ਤੁਮ ਕਰਿਯਹੁ ॥੨੯॥"
page = 881

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘My love, please do consider for sake of our love and help me.(29)"

