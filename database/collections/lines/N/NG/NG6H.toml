[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਸਿਮਰਨੁ; ਰਾਮ ਨਾਮ ਅਧਾਰੁ ॥"
page = 971
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Make thou the contemplation of the Lord's Name thy support."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਉਸ ਸਾਹਿਬ ਦੇ ਨਾਮ ਦੇ ਭਜਨ ਨੂੰ ਆਪਣਾ ਆਸਰਾ ਬਣਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Make this meditative remembrance of the Lord's Name your Support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਰਾਮ ਨਾਮ ਰੂਪ ਸਿਮਰਨ ਕਾ ਹੀ ਆਸਰਾ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੇ ਉਸ ਸਿਮਰਨ ਨੂੰ (ਆਪਣੀ ਜਿੰਦ ਦਾ) ਆਸਰਾ ਬਣਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਧਾਰੁ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, Contemplando el Nombre del Señor, tu Dios,"