[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਸਹਜਿ ਭਾਇ ਗੁਣ ਗਾਇ ॥੮॥੨॥"
page = 686
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak instinctively, sings Thine praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਸੁਤੇ ਸਿਧ ਹੀ, ਤੇਰੀ ਕੀਰਤੀ ਗਾਇਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak, with intuitive poise and natural love, sings Your Glorious Praises. ||8||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਤਾਂ ਤੇ ਏਹੀ ਕਿਰਪਾ ਕਰ ਜੋ (ਸਹਜਿ) ਸੁਭਾਵਕ ਹੀ (ਭਾਇ) ਪ੍ਰੇਮ ਕਰ ਕੇ ਤੇਰੇ ਗੁਣੋਂ ਕੋ ਗਾਵਤਾ ਰਹੂੰ॥੮॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- (ਹੇ ਪ੍ਰਭੂ! ਤੇਰਾ ਦਾਸ) ਅਡੋਲ ਆਤਮਕ ਅਵਸਥਾ ਵਿਚ ਟਿਕ ਕੇ ਤੇਰੇ ਪ੍ਰੇਮ ਵਿਚ ਟਿਕ ਕੇ ਤੇਰੇ ਗੁਣ ਗਾਵੇ ॥੮॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "para que pueda yo entonar Tu Alabanza de manera espontánea. (8-2"