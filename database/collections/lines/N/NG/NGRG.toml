[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਸਾਜਨੁ ਸੰਗੀ ਪ੍ਰਭੁ ਮੇਰਾ; ਕਾਹੇ ਜੀਅ ਡਰਾਹੀ ॥੧॥"
page = 378
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou O Lord! art my friend and comrade. Therefore why should my soul be afraid?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੇ ਸਾਹਿਬ! ਮੇਰਾ ਮਿੱਤਰ ਅਤੇ ਸਾਥੀ ਹੈਂ। ਮੇਰੀ ਆਤਮਾ ਕਿਉਂ ਭੈ-ਭੀਤ ਹੋਵੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my Friend and Companion, God; why should my soul be afraid? ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰਹੀਂ ਮੇਰਾ ਮਿਤ੍ਰ ਹੈਂ, ਤੂੰ ਹੀਂ ਮੇਰਾ ਸਾਥੀ ਹੈਂ, ਹੇ ਪ੍ਰਭੂ ਅਕਾਲ ਪੁਰਖ! ਫਿਰ ਹਮ ਜੀਅ ਕਿਉਂ (ਡਰਾਹੀ) ਡਰੈਂ ਅਰਥਾਤ ਨਹੀਂ ਡਰਤੇ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਮੇਰਾ ਸੱਜਣ ਹੈਂ, ਤੂੰ ਹੀ ਮੇਰਾ ਸਾਥੀ ਹੈਂ ਤੂੰ ਹੀ ਮੇਰਾ ਮਾਲਕ ਹੈਂ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗੀ = ਸਾਥੀ। ਜੀਅ = ਹੇ ਜਿੰਦੇ! ਕਾਹੇ ਡਰਾਹੀ = ਕਿਉਂ ਡਰਦੀ ਹੈਂ? ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Al ser mi Amigo y Compañero, mi mente no tiene miedo. (1)"