[[content]]
assets = ["SSKS"]
type = "primary"
data = "ਫਲ ਦ੍ਰੁਮ ਗੁਰਸਿਖ ਸੰਧ ਗਤਿ ਆਦਿ ਅੰਤ ਬਿਸਮਾਦਿ ॥"

[[content]]
assets = ["SSPK"]
type = "translation"
language = "en"
data = "Guru Ram Das caused the meeting of Guru and Sikh in the same wondrous way of fruit and tree."

[[content]]
assets = ["SSSK"]
type = "translation"
language = "pa"
data = "ਫਲੁ ਅਰੁ ਬਿਰਛ ਦੇ ਚਕ੍ਰਾਕਾਰ ਚਾਲੇ ਵਤ ਜਿਨ੍ਹਾਂ ਨੇ, ਗੁਰੂ ਸਿਖ ਮਿਲਾਪ ਦੀ ਰੀਤੀ ਨੂੰ ਆਦਿ ਅੰਤ ਵਿਖੇ ਹੀ, ਬਿਸਮਾਦ ਰੂਪ ਵਰਤਾਇਆ।"