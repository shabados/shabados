[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰੂਪ ਨਿਹਾਰ ਸਚੀ ਲਲਚਾਯੋ ॥੬॥"
page = 974

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After getting the rule of Indra, when he noticed the beauty of Sachee (Indra’s consort), he was enticed.(6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ (ਉਹ) ਸਚੀ ਦਾ ਰੂਪ ਵੇਖ ਕੇ ਲਲਚਾਇਆ ॥੬॥"