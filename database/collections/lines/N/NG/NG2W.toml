data = "ਤੁਮਰਾ ਲਖਾ ਨ ਜਾਇ ਪਸਾਰਾ ॥"
page = 1387

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The limits of Thy creation cannot be known"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਤੁਹਾਡੇ ਪਸਾਰੇ ਨੂੰ ਸਮਝਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਤੁਮਰਾ ਲਖਾ ਨ ਜਾਇ; ਪਸਾਰਾ ॥"