[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰਣਾਮੰ ਕੀਯੋ ਆਨ ਕੈ ਕੈ ਨਰੇਸੰ ॥੨॥"
page = 53

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the reciters of the Vedas came to Madra Desha and made obeisance to the king.2."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਨੇ ਆ ਕੇ (ਲਵਬੰਸੀਆਂ ਦੇ ਰਾਜੇ ਨੂੰ) ਪ੍ਰਨਾਮ ਕੀਤਾ ॥੨॥"