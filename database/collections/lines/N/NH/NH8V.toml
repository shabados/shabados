[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੋਰਠਿ ਸੁਧ ਮਲਾਰ ਕਿਧੌ; ਸੁਰ ਮਾਲਸਿਰੀ ਕੀ ਮਹਾ ਸੁਖਦਾਈ ॥"
page = 358

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The peace-giving tune is being played n the flute concerning the musical modes of Devgandhari, Vibhas, Bilawal, Sarang Sorath, Shuddh Malhar and Malshri"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੋਰਠ, ਸ਼ੁੱਧ ਮਲ੍ਹਾਰ ਜਾਂ ਮਾਲਸਿਰੀ ਦੀ ਸੁਰ ਬਹੁਤ ਸੁਖ ਦੇਣ ਵਾਲੀ ਹੈ।"