[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਣ ਗਾਵਾ; ਗੁਣ ਬੋਲੀ ਬਾਣੀ ॥"
page = 367
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I sing God's praise, and God's, praise do I utter through Gurbani."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਵਾਹਿਗੁਰੂ ਦਾ ਜੱਸ ਗਾਉਂਦਾ ਹਾਂ ਅਤੇ ਵਾਹਿਗੁਰੂ ਦੇ ਜੱਸ ਦਾ ਹੀ ਗੁਰਬਾਣੀ ਦੇ ਜ਼ਰੀਏ ਉਚਾਰਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I sing His Glorious Praises, and through the Word of His Bani, I speak His Glorious Praises."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਾਹਗੁਰੂ ਕੇ ਗੁਣ ਜੋ ਭਗਤੋਂ ਪਰ ਕ੍ਰਿਪਾ ਦ੍ਰਿਸ੍ਟੀ ਕਰੀ ਹੈ; ਵਾ ਅਜਰ ਅਮਰਾਦਿ ਤਿਨ ਹੀ ਕੋ ਰਾਗ ਮੇਂ ਭੀ ਗਾਉਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਮੈਂ ਭੀ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦਾ ਰਹਿੰਦਾ ਹਾਂ, ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ ਉਚਾਰਦਾ ਰਹਿੰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਾਵਾ = ਗਾਵਾਂ, ਮੈਂ ਗਾਂਦਾ ਹਾਂ। ਬੋਲੀ = ਬੋਲੀਂ, ਮੈਂ ਉਚਾਰਦਾ ਹਾਂ। ਗੁਣ ਬਾਣੀ = ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canta Su Alabanza, canta la Alabanza del Señor a través de la Palabra."