[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਯੌ ਬਰੁ ਲੈ ਕੇ ਸਿਵਾ ਤੇ; ਪ੍ਰਸੰਨ ਚਲੀ ਹੁਇ ਚਿਤ ॥"
page = 496

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After getting this boon from Chandika, and being pleased, she mounted on her chariot"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਦੁਰਗਾ ਤੋਂ ਵਰ ਲੈ ਕੇ ਅਤੇ ਚਿਤ ਵਿਚ ਪ੍ਰਸੰਨ ਹੋ (ਉਥੋਂ) ਚਲ ਪਈ ਹੈ।"