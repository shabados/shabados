[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੂਖ ਲਗੀ ਜਬ ਹੀ ਹਰਿ ਕੋ; ਤਬ ਪੈ ਜਸੁਧਾ ਥਨ ਕੌ ਤਿਨਿ ਚਾਹਿਯੋ ॥"
page = 300

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Krishna became hungry, he wanted to drink his mother Yashoda’s milk"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਕ੍ਰਿਸ਼ਨ ਨੂੰ ਭੁਖ ਲਗੀ ਤਦੋਂ ਉਨ੍ਹਾਂ ਨੇ ਜਸੋਧਾ ਦਾ ਥਣ (ਚੁੰਘਣਾ) ਚਾਹਿਆ;"