[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਰ ਅੰਤ ਕੀ; ਹੋਇ ਸਹਾਇ ॥"
page = 1187
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "At the last moment, God shall be thy succourer."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਖੀਰ ਦੇ ਵੇਲੇ, ਵਾਹਿਗੁਰੂ ਤੇਰਾ ਸਹਾਇਕ ਹੋਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "At the very last instant, He shall be your Help and Support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਵਾਹਿਗੁਰੂ ਅੰਤ ਕੇ ਸਮੇਂ ਤੇਰਾ ਸਹਾਈ ਹੋਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਖ਼ੀਰਲੇ ਸਮੇ ਪਰਮਾਤਮਾ ਹੀ ਮਦਦਗਾਰ ਬਣਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਰ ਅੰਤ ਕੀ = ਅੰਤ ਦੇ ਸਮੇ। ਸਹਾਇ = ਸਹਾਈ, ਮਦਦਗਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En nuestra mente Dios es nuestro Único Refugio hasta el final,"