[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮੁ. ਨ ਬੋਲਹਿ; ਪਾਡੇ ਦੋਜਕੁ ਭਰਹਿ ॥੧॥ ਰਹਾਉ ॥"
page = 970
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If thou utterest not the Master's Name, then thou shalt suffer great agony. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇ ਤੂੰ ਮਾਲਕ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਨਹੀਂ ਕਰਦਾ, ਤਾਂ ਤੂੰ ਬੜੀ ਮੁਸੀਬਤ ਭੋਗੇਂਗਾ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If you don't chant the Lord's Name, O Pandit, you will only suffer in hell. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੰਡਤ! ਤੂੰ ਰਾਮ ਨਹੀਂ ਬੋਲਤਾ ਔ ਵਤੰਡਾ ਕਰਤਾ ਹੈਂ। ਇਸੀ ਤੇ ਦੋਜਕ ਮਰਤਾ ਹੈਂ ਵਾ ਦੋਜਖ ਮੇਂ ਇਨ ਮੰਦਕਰਮੋਂ ਕਾ ਫਲ੍ਹ ਦੁਖ (ਭਰੈ) ਪਾਵੈਗਾ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੰਡਿਤ! ਤੂੰ ਰਾਮ ਨਹੀਂ ਬੋਲਦਾ, ਤੇ ਦੋਜਕ (ਦਾ ਦੁੱਖ) ਸਹਾਰ ਰਿਹਾ ਹੈਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que no recita el Nombre del Señor cae presa del pozo oscuro de sus pasiones.(1-Pausa)"