[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿ ਧਰਮੇਸ ਧਾਮੀ ॥੨੩੫॥"
page = 654

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That Sannyasi king was the destroyer of impiety, he went everywhere in his kingdom and was the abode of Dharma.235."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੇਸ਼ਠ ਧਰਮ ਧਾਮ ਵਾਲਾ ਹੈ ॥੨੩੫॥"