[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮਧੇ; ਜਾਨੈ ਜੇ ਕੋਇ ॥"
page = 1162
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If any one realises the Lord in his mind, he is fulfilled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਕੋਈ ਜਣਾ ਪ੍ਰਭੂ ਨੂੰ ਆਪਣੇ ਹਿਰਦੇ ਅੰਦਰ ਅਨੁਭਵ ਕਰ ਲਵੇ, ਉਹ ਸੰਪੂਰਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who knows the Lord in the mind"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਕੇ (ਮਧੇ) ਬੀਚ ਹੀ ਹੈ ਪਰ ਜੋ ਕੋਈ ਜਾਨੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਪ੍ਰਭੂ ਨੂੰ ਆਪਣੇ ਮਨ ਵਿਚ ਵੱਸਦਾ ਪਛਾਣ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que ve a Dios en el interior de su mente,"