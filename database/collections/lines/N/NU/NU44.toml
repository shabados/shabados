[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਡਗੀ ਭੂਮਿ ਸਰਬੰ ਉਠਿਯੋ ਕਾਪ ਗੈਣੰ ॥"
page = 165

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The war was waged for eight days and eight nights, in which the earth and the sky trembled."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੀ ਭੂਮੀ ਡਾਵਾਂ-ਡੋਲ ਹੋ ਗਈ ਅਤੇ ਆਕਾਸ਼ ਵੀ ਕੰਬ ਉਠਿਆ।"