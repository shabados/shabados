[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕੈ ਦਰਸਨਿ; ਸਦਾ ਨਿਹਾਲ ॥"
page = 1143
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by His sight one is ever in bliss."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਦੀਦਾਰ ਦੁਆਰਾ ਇਨਸਾਨ ਸਦੀਵ ਹੀ ਪ੍ਰਸੰਨ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "by the Blessed Vision of his Darshan, I am forever enraptured."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਦਰਸਨ ਕਰ ਕੇ ਔਰ ਜੀਵ ਸਦੀਵ ਨਿਹਾਲ ਹੋਤੇ ਹੈਂ ਅਰਥਾਤ ਦੁਖ ਰਹਿਤ ਹੋਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਦਰਸਨ ਦੀ ਬਰਕਤਿ ਨਾਲ ਸਦਾ ਨਿਹਾਲ ਹੋ ਜਾਈਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕੈ ਦਰਸਨਿ = ਉਸ ਦੇ ਦਰਸਨ ਨਾਲ। ਨਿਹਾਲ = ਪ੍ਰਸੰਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "al tener Su Visión, ese ser es para siempre bendecido."