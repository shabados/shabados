type = "primary"
data = "ਕਿ ਬੇਰੂੰ ਨਿਆਮਦ ਬ ਹੁਕਮੇ ਖ਼ੁਦਾ ॥੬੬॥"
page = 1419

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But, by God’s grace, it did not occur.(66)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਵੇਂ (ਦਰਿਆ ਤੋਂ) ਬਾਹਰ ਨਾ ਆਏ (ਅਰਥਾਤ-ਡੁਬ ਗਏ) ॥੬੬॥"