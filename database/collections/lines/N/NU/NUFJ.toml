[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਦਾਤਾ; ਕਰਣਹਾਰੁ ਕਰਤਾਰੁ ॥੧॥ ਰਹਾਉ ॥"
page = 354
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art the Bestower, Doer and the Creator. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਦਾਨ ਦੇਣਹਾਰ, ਕਾਰਜ ਸਾਧਣ ਵਾਲਾ ਅਤੇ ਸਿਰਜਣਹਾਰ ਹੈਂ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the Great Giver, the Doer, the Creator. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਕਰਣਹਾਰੁ ਕਰਤਾਰ ਮੇਰਾ ਦਾਤਾ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ (ਸਭ ਦਾਤਾਂ) ਦੇਣ ਵਾਲਾ ਹੈਂ, ਤੂੰ ਸਭ ਕੁਝ ਕਰਨ ਦੇ ਸਮਰੱਥ ਹੈਂ, ਤੂੰ ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਪੈਦਾ ਕਰਨ ਵਾਲਾ ਹੈਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਾਤਾ = ਦੇਣ ਵਾਲਾ। ਕਰਣਹਾਰੁ = ਕਰਨ ਦੇ ਸਮਰੱਥ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Creador de toda la creación. (1-Pausa)"