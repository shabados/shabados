[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਨਾਨਕ. ਨਾਮੁ ਧਿਆਇਆ; ਗੁਰਮੁਖਿ ਧਨਵੰਤਾ ॥੨੦॥"
page = 650
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Deliberating over the Name, through the Guru, slave Nanak has become wealthy."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਨਾਮ ਦਾ ਆਰਾਧਨ ਕਰ ਕੇ ਗੋਲਾ ਨਾਨਕ ਘਨਾਢ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Servant Nanak meditates on the Naam, the Name of the Lord; as Gurmukh, he has become truly wealthy. ||20||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਜਿਸ ਜਨ ਨੇ ਗੁਰੋਂ ਦੁਆਰੇ ਤਿਸ ਕੇ ਨਾਮ ਕੋ ਧਿਆਇਆ ਹੈ, ਸੋਈ ਧਨਵੰਤਾ ਹੈ॥੨੦॥☬ਜੋ ਪੜ ਕਰ ਹੰਕਾਰੀ ਹੈਂ ਤਿਨ ਪ੍ਰਤੀ ਕਹਿਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਾਸ ਨਾਨਕ! ਜਿਨ੍ਹਾਂ ਨੇ ਸਤਿਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੋ ਕੇ ਨਾਮ ਸਿਮਰਿਆ ਹੈ, ਉਹ (ਅਸਲ) ਧਨੀ ਹੁੰਦੇ ਹਨ ॥੨੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak ha contemplado el Nombre del Señor y a través del Guru ha obtenido Su Riqueza. (20)"