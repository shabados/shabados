[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰਿ ਰਤਨੁ ਬੀਚਾਰੇ ॥"
page = 775
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Name seems sweet to the Guru-ward,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਗੁਰੂ-ਅਨੁਸਾਰੀ ਨੂੰ ਨਾਮ ਮਿੱਠੜਾ ਲੱਗਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh loves the Name of the Lord;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੇ ਰਿਦੇ ਮੇਂ ਬੀਚਾਰ ਰੂਪੀ ਰਤਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਹੜਾ ਮਨੁੱਖ ਆਪਣੇ ਅੰਦਰ ਪ੍ਰਭੂ ਦੀ ਅਮੋਲਕ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਨੂੰ ਪ੍ਰੋ ਰੱਖਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਤਰਿ = ਹਿਰਦੇ ਵਿਚ। ਰਤਨੁ = ਨਾਮ-ਰਤਨ ਨੂੰ, ਪ੍ਰਭੂ ਦੀ ਅਮੋਲਕ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਨੂੰ। ਬੀਚਾਰੇ = ਵਿਚਾਰਦਾ ਹੈ, ਆਤਮਕ ਮੰਡਲ ਵਿਚ ਪ੍ਰੋਈ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que medita en la Joya de Dios,"