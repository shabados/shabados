[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਤਿਸੁ ਸਰਣਾਗਤੀ; ਜਿ ਸਗਲ ਘਟਾ ਆਧਾਰੁ ॥੪॥੧੮॥੮੮॥"
page = 49
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak has sought the sanctuary of Him, who is the support of all the hearts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੇ ਉਸ ਦੀ ਸ਼ਰਣ ਸੰਭਾਲੀ ਹੈ, ਜੋ ਸਾਰਿਆਂ ਦਿਲਾਂ ਦਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak seeks the Sanctuary of the One who is the Support of every heart. ||4||18||88||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਭਾਈ! ਜੋ ਸਰਬ ਘਟਾਂ ਕਾ ਆਸਰਾ ਵਾਹਿਗੁਰੂ ਹੈ, ਤਿਸ ਕੀ ਸਰਣ ਮੇਂ (ਆਗਤੀ) ਆਉਨਾ ਕਰ॥੪॥੧੮॥੮੮॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਪ੍ਰਭੂ ਦੀ ਸਰਨ ਪਉ ਜੋ ਸਾਰੇ ਸਰੀਰਾਂ ਦਾ (ਜੀਵਾਂ ਦਾ) ਆਸਰਾ ਹੈ ॥੪॥੧੮॥੮੮॥{48-49}"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿ = ਜੇਹੜਾ (ਪ੍ਰਭੂ)। ਘਟਾ = ਘਟਾਂ, ਸਰੀਰਾਂ ਦਾ। ਆਧਾਰੁ = ਆਸਰਾ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, busca el Santuario de Él, quién es el Soporte de todos los corazones. (4-18-88)"