[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ ਜੇਵਡੁ; ਅਵਰੁ. ਨ ਕੋਇ ॥"
page = 1271
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "No one else is as great as the True Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਹੋਰ ਜਣਾ ਸੱਚੇ ਗੁਰਾਂ ਜਿਡਾ ਵੱਡਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one else is as great as the True Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਜੇਹਾ ਵੱਡਾ ਔਰ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਬਖ਼ਸ਼ਸ਼ਾਂ ਕਰਨ ਵਿਚ) ਗੁਰੂ ਦੇ ਬਰਾਬਰ ਦਾ ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੇਵਡੁ = ਜੇਡਾ ਵੱਡਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nadie es tan Grandioso como el Guru Verdadero,"