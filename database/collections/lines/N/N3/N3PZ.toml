[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ ਰਾਖਿਓ ਦਾਸੁ ਅਪਨਾ; ਸਦਾ ਸਦਾ ਸਾਚਾ ਬਖਸਿੰਦ ॥੧॥ ਰਹਾਉ ॥"
page = 899
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In His mercy, the Lord has protected His slave, The True Master is ever, ever the Forgiver. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਰਹਿਮਤ ਧਾਰ ਕੇ ਸਾਹਿਬ ਨੇ ਆਪਣੇ ਗੋਲੇ ਦੀ ਰੱਖਿਆ ਕੀਤੀ ਹੈ। ਸੱਚਾ ਮਾਲਕ, ਹਮੇਸ਼ਾਂ, ਹਮੇਸ਼ਾਂ ਹੀ ਬਖਸ਼ਣਹਾਰ ਹੈ। ਠਹਿਰਾਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In His Mercy, He protects His slave; the True Lord is forever and ever the forgiver. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਭਗਵੰਤ ਨੇ ਅਪਨਾ ਦਾਸੁ ਜਨਮ ਮਰਨ ਤੇ ਰਾਖ ਲੀਆ ਹੈ, ਸੋ ਸਚਾ ਸਦਾ ਸਦਾ ਬਖਸੰਦ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਦਾਸ ਨੂੰ ਪਰਮਾਤਮਾ ਨੇ ਕਿਰਪਾ ਕਰ ਕੇ (ਆਪ ਹੀ ਕਾਮਾਦਿਕ ਵਿਕਾਰੋਂ ਤੋਂ) ਬਚਾ ਰੱਖਿਆ ਹੈ। ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਮਾਲਕ ਸਦਾ ਹੀ ਬਖ਼ਸ਼ਸ਼ਾਂ ਕਰਨ ਵਾਲਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ। ਸਾਚਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ। ਬਖਸਿੰਦ = ਬਖ਼ਸ਼ਸ਼ ਕਰਨ ਵਾਲਾ, ਬਖ਼ਸ਼ਿੰਦ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues Él es siempre el Verdadero Perdonador."