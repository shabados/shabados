[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਊਧਵ, ਤਾ ਸੰਗ ਯੌ ਕਹੀਯੌ; ਬਹੁਰੋ ਫਿਰਿ ਆਇ ਕੈ ਮਾਖਨ ਖਈਯੈ ॥੯੫੯॥"
page = 393

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Yashoda also said, ‘Request my son on my behald to come again and eat the butter.’959."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਊਧਵ! ਉਸ ਪਾਸ ਇਸ ਤਰ੍ਹਾਂ ਕਹਿ ਦੇਣਾ ਕਿ ਫਿਰ (ਉਥੇ) ਆ ਕੇ ਮੱਖਣ ਖਾ ਲਵੋ ॥੯੫੯॥"