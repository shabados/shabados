[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅੰਜਨੁ ਵਿਚਿ, ਨਿਰੰਜਨੁ ਪਾਇਆ ॥੧੫॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Such true persons while being amidst maya have attained that immaculate Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਅਜਿਹੇ ਸਤਿ ਪੁਰਖਾਂ ਨੇ) ਮਾਯਾ ਵਿਚ ਹੀ ਨਿਰੰਕਾਰ ਨੂੰ ਪਾ ਲੀਤਾ ਹੈ।"