[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਅੰਕਾਰਿ ਉਤਪਾਤੀ ॥"
page = 1003
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The One Lord has created the creation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਸੁਆਮੀ ਨੇ ਹੀ ਰਚਨਾ ਰਚੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One Universal Creator Lord created the creation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਓਅੰਕਾਰਿ) ਬ੍ਰਹਮਾ ਤੇ ਉਤਪਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਰਬ-ਵਿਆਪਕ ਪਰਮਾਤਮਾ ਨੇ ਜਗਤ ਦੀ ਉਤਪੱਤੀ ਕੀਤੀ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਅੰਕਾਰਿ = ਓਅੰਕਾਰ ਨੇ, ਸਰਬ-ਵਿਆਪਕ ਪਰਮਾਤਮਾ ਨੇ। ਉਤਪਤੀ = ਉਤਪੱਤੀ, ਸ੍ਰਿਸ਼ਟੀ ਦੀ ਰਚਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Ser Supremo crea a todos los seres,"