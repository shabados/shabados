type = "primary"
data = "ਇਹ ਕੀ ਅਗ੍ਰਜ ਦ੍ਰਿਸਟਿ ਨਚਾਵਹੁ ॥"
page = 451

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Then call all the heavenly damsels and make them dance before him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਇਸ (ਖੜਗ ਸਿੰਘ) ਦੀ ਨਜ਼ਰ ਦੇ ਸਾਹਮਣੇ ਨਚਾਓ।"