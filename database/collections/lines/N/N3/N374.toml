[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਲੀ ਸਮੇਤ ਸਭੈ ਸਕਤੀ ਮਿਲਿ; ਦੀਨੋ ਖਪਾਇ ਸਭੈ ਦਲੁ ਬਾਨੀ ॥"
page = 98

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Alongwith Kali and other powers thou hast destroyed all the parts of my army.”,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਚੰਡੀ! ਤੂੰ) ਕਾਲੀ ਸਮੇਤ ਸਾਰੀਆਂ ਸ਼ਕਤੀਆਂ ਨੂੰ ਨਾਲ ਮਿਲਾ ਕੇ ਸਾਰੇ ਦਲਾਂ ਦੇ ਬਾਨੀਆਂ (ਮੁਖੀਆਂ) ਨੂੰ ਨਸ਼ਟ ਕਰ ਦਿੱਤਾ ਹੈ।"