[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪੁਤੁ ਨ ਮੰਨੈ ਮਾਪਿਆਂ; ਕਮਜਾਤੀਂ ਵੜੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "If the son disobeys the parents, he is considered a bastard."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੇ ਪੁੱਤ ਮਾਪਿਆਂ ਨੂੰ ਨਾ ਮੰਨੇ ਉਹ ਕਮਜਾਤਾਂ ਵਿਚ ਗਿਣਿਆ ਜਾਂਦਾ ਹੈ।"