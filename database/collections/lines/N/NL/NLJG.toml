[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚੋਆ ਚੰਦਨੁ; ਅੰਕਿ ਚੜਾਵਉ ॥"
page = 225
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If my apple otto of aloe wood and sandal to my body limbs,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਅਗਰ ਤੇ ਚੰਨਣ ਦਾ ਅਤਰ ਆਪਣੀ ਦੇਹਿ ਦੇ ਅੰਗਾਂ ਨੂੰ ਮਲਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I may anoint my limbs with sandalwood oil."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚੰਦਨਾਦਿ ਚੋਆ ਅੰਗ ਮੇਂ ਲਗਾਵੋ, ਸਾਧਾਰਨ ਬਸਤ੍ਰੋਂ ਕੋ ਸਦਾ ਪਹਿਰ ਕਰ ਹੰਢਾਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਮੈਂ ਅਤਰ ਅਤੇ ਚੰਦਨ ਆਪਣੇ ਸਰੀਰ ਉਤੇ ਲਾ ਲਵਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੋਆ = ਅਤਰ। ਅੰਕਿ = ਸਰੀਰ ਉਤੇ। ਚੜਾਵਉ = (ਜੇ) ਮੈਂ ਲਾ ਲਵਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aunque uno use perfume"