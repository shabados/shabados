[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲੋਭਿ ਵਿਆਪੀ; ਝੂਠੀ ਦੁਨੀਆ ॥"
page = 1004
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In avarice the false world is involved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲਾਲਚ ਅੰਦਰ ਕੂੜਾ ਜਹਾਨ ਗ੍ਰਸਿਆ ਹੋਇਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The false world is engrossed in greed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਕੇ ਲੋਭ ਮੇਂ ਝੂਠੀ ਦੁਨੀਆ ਵਿਆਪ ਰਹੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੀ ਲੁਕਾਈ ਨਾਸਵੰਤ ਦੁਨੀਆ ਦੇ ਲੋਭ ਵਿਚ ਫਸੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੋਭਿ = ਲੋਭ ਵਿਚ। ਵਿਆਪੀ = ਫਸੀ ਹੋਈ ਹੈ। ਝੂਠੀ ਦੁਨੀਆ ਲੋਭਿ = ਨਾਸਵੰਤ ਜਗਤ ਦੇ ਲੋਭ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y el mundo ilusorio está afligido por la avaricia."