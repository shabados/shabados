[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਬ ਛੂਟੇ; ਜਬ ਸਾਧੂ ਪਾਇਆ ॥੫॥੫॥੧੩॥"
page = 1160
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When one meets with the saint, then alone man is freed from mammon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤਾਂ ਹੀ ਬੰਦਾ ਮਾਇਆ ਤੋਂ ਛੁਟਕਾਰਾ ਪਾਉਂਦਾ ਹੈ ਜਦ ਉਹ ਸੰਤ ਨੂੰ ਮਿਲ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mortal is emancipated only when he meets the Holy Saint. ||5||5||13||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸੰਤੁ ਦੁਆਰਾ ਨਾਮੁ ਪਾਇਆ ਜਾਵੇ ਤਬ ਜੀਵ ਮਾਇਆ ਸੇ ਛੂਟ ਜਾਤਾ ਹੈ। ਭਾਵ ਯਿਹ ਕਿ ਜਬ ਸਤਸੰਗ ਦ੍ਵਾਰਾ ਖਾਨ ਪਾਨ ਆਦਿ ਪ੍ਰਾਣੋਂ ਕਾ ਧਰਮ ਮਾਨ ਕਰ ਅਸੰਗ ਰਹਿਤਾ ਹੈ ਤਬ ਜਨਮ ਮਰਣ ਰੂਪ ਮਾਯਾ ਸੇ ਛੂਟਤਾ ਹੈ॥੫॥੫॥੧੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਗੁਰੂ ਮਿਲੇ ਤਦੋਂ ਹੀ ਜੀਵ ਮਾਇਆ ਦੇ ਪ੍ਰਭਾਵ ਤੋਂ ਬਚਦਾ ਹੈ ॥੫॥੫॥੧੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sólo será liberado si se postra ante el Santo. (5-5-13)"