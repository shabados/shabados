[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ ਕੋ ਮੰਨਿ ਜਾਣੈ; ਮਨਿ ਕੋਇ ॥੧੪॥"
page = 3
line = 9

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਨਾਮ ਨਿਰੰਜਨ (ਮੈਲ ਰਹਿਤ) ਦੀ ਸੋਝੀ ਕਿਸ ਨੂੰ ਆਉਂਦੀ ਹੈ: \"ਜੇ ਕੋਈ, ਮਨ ਕਰਕੇ ਮੰਨ ਲਵੇ, ਪਰ ਐਸਾ ਕੋਈ ਹੀ ਹੁੰਦਾ ਹੈ\"।"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If someone puts faith in the Lord's Name, he shall, then understand it within his mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਕੋਈ ਜਣਾ ਸਾਈਂ ਦੇ ਨਾਮ ਉਤੇ ਭਰੋਸਾ ਧਾਰਨ ਕਰ ਲਵੇ, ਤਦ ਉਹ ਆਪਣੇ ਚਿੱਤ ਅੰਦਰ ਇਸ ਨੂੰ ਸਮਝ ਲਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Only one who has faith comes to know such a state of mind. ||14||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੋਈ ਮਨਨ ਕਰਤਾ ਹੈ, ਸੋਈ ਕੋਈ ਮਨ ਮੇਂ ਮਹਾਤਮ ਜਾਨਤਾ ਹੈ॥੧੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋਈ ਮਨੁੱਖ ਆਪਣੇ ਮਨ ਵਿਚ ਹਰਿ-ਨਾਮ ਦੀ ਲਗਨ ਪੈਦਾ ਕਰ ਲਏ ॥੧੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo quien tiene Fe llega a tener ese estado mental. (14)"