[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਿਣੁ ਨਾਵੈ ਹੋਰੁ ਮੰਗਣਾ; ਸਿਰਿ ਦੁਖਾਂ ਦੇ ਦੁਖ ਸਬਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Desiring anything except the Nam of the Lord, is invitation to multiplying sufferings."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਇਸ ਲਈ ਕਿ) ਨਾਮ ਤੋਂ ਬਾਝ ਹੋਰ ਸਭਨਾਂ (ਪਦਾਰਥਾਂ) ਦੇ ਮੰਗਣ ਵਿਖੇ ਭਾਰੀ ਕਸ਼ਟ ਤੇ ਵਿਪਦਾ ਹਨ।"