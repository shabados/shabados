[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਤਿ ਸੰਤੋਖ ਦਇਆ ਧਰਮੁ; ਲਖ ਅਰਥ ਮਿਲਾਹੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "If truth, contentment, compassion, dharma and wealth worth lacs are combined;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਤ, ਸੰਤੋਖ, ਦਇਆ ਤੇ ਧਰਮ, ਲਖਾਂ ਅਰਥਾਂ ਦਾ ਮੇਲ ਹੋਣਾ।"