[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਹੁ ਮਨੁ ਮਾਰਿਆ. ਨਾ ਮਰੈ; ਜੇ ਲੋਚੈ ਸਭੁ ਕੋਇ ॥"
page = 1089
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By subduing this mind is subdued not, even though everyone may so desire."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਸ ਕਰਨ ਦੁਆਰਾ ਇਹ ਮਨੂਆ ਵਸ ਨਹੀਂ ਆਉਂਦਾ, ਭਾਵੇਂ ਹਰ ਜਣਾ ਇਸ ਤਰ੍ਹਾਂ ਪਿਆ ਚਾਹੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This mind is not conquered by conquering it, even though everyone longs to do so."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਿਨਾਂ ਵਿਚਾਰ ਤੋਂ ਏਹ ਮਨੁ ਮਾਰਿਆ ਹੂਆ ਨਹੀਂ ਮਰਤਾ, ਜੇ ਸਭ ਕੋਈ ਮਾਰਿਆ ਚਾਹੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਹੀਂ ਤਾਂ ਉਂਞ) ਭਾਵੇਂ ਕੋਈ ਕਿਤਨੀ ਹੀ ਤਾਂਘ ਕਰੇ ਇਹ ਮਨ ਜਤਨ ਕੀਤਿਆਂ ਵੱਸ ਵਿਚ ਨਹੀਂ ਆਉਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭੁ ਕੋਇ = ਹਰੇਕ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, La mente es controlada sólo meditando en la Palabra del Guru. Todos buscan calmar la mente, pero no lo logran. Sí,"