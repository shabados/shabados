[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਹਿ; ਪਾਪ ਪੁੰਨ ਬਿਸਥਾਰਾ ॥"
page = 251
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He himself diffuses sins and noble deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪੇ ਹੀ ਬਦੀਆਂ ਤੇ ਨੇਕੀਆਂ ਫੈਲਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself distributes sins and noble acts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਆਪ ਹੀ ਤਿਸ ਨੇ ਪਾਪ ਅਰ ਪੁੰਨ ਕਾ ਵਿਸਥਾਰ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਆਪ ਹੀ ਚੰਗੇ ਮੰਦੇ ਕੰਮਾਂ ਦਾ ਖਿਲਾਰਾ ਖਿਲਾਰਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਪ ਪੁੰਨ = ਮੰਦੇ ਚੰਗੇ ਕੰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A través de Él viene lo bueno y lo malo,"