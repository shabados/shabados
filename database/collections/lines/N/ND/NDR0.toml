[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਛੁਤਾਇ ਗਯੋ ਮਘਵਾ ਗ੍ਰਿਹ ਕੋ; ਨ ਰਹੀ ਤਿਹ ਕੀ ਪਤਿ ਏਕ ਰਤੀ ॥"
page = 331

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Indra went back to his home repenting and he lost all his self-respect"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇੰਦਰ ਪਛਤਾਵਾ ਕਰਦਾ ਹੋਇਆ ਘਰ ਨੂੰ ਚਲਿਆ ਗਿਆ ਅਤੇ ਉਸ ਦੀ ਰਤਾ ਜਿੰਨੀ ਇਜ਼ਤ ਨਾ ਰਹੀ।"