data = "ਤੋ ਮੈ ਆਪਨ ਆਪ ਹੀ; ਮਰੋ ਕਟਾਰੀ ਮਾਰਿ ॥੭॥"
page = 940

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "We would have killed ourselves with daggers too.(7)"

