[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤਸੰਗਤਿ ਮਿਲਿ; ਭਇਆ ਪ੍ਰਗਾਸ ॥"
page = 1341
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Associating with the saints' society my mind is illumined."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਨਾਲ ਜੁੜਨ ਦੁਆਰਾ, ਮੇਰਾ ਮਨ ਰੌਸ਼ਨ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Joining the Society of the Saints, I am illumined and enlightened."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੀ ਸੰਗਤ ਮੇਂ ਮਿਲ ਕਰ ਹਮ ਕੋ ਤਿਸ ਕੇ ਸਰੂਪ ਕਾ ਪ੍ਰਕਾਸ਼ ਭਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸੰਗਤ ਵਿਚ ਮਿਲ ਕੇ (ਬੈਠਿਆਂ ਮਨੁੱਖ ਦੇ ਅੰਦਰ ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੂਝ ਦਾ) ਚਾਨਣ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤ ਸੰਗਤਿ = ਗੁਰੂ ਦੀ ਸੰਗਤ। ਮਿਲਿ = ਮਿਲ ਕੇ। ਪ੍ਰਗਾਸ = (ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੂਝ ਦਾ) ਚਾਨਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Acercándome a la Saad Sangat, he sido Iluminado."