[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਤਿਹੂ ਮਧਿ ਲੋਕਾਨਿ ਧਨਿ ॥"
page = 636

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing the devotion of the sage, all were pleased and all blessed him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਤਿੰਨਾਂ ਲੋਕਾਂ ਵਿਚ ਧੰਨ ਮੰਨਿਆ ਜਾਂਦਾ ਹੈ।"