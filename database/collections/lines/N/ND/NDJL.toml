[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਰੀ ਗੁਰੂ ਸਿਰੀ ਗੁਰੂ; ਸਿਰੀ ਗੁਰੂ ਸਤਿ ਜੀਉ ॥"
page = 1403
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The venerable Guru, the highly venerable Guru, True indeed is the most venerable Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਣਨੀਯ ਗੁਰੂ ਜੀ, ਮਹਾਨ ਮਾਣਨੀਯ ਗੁਰੂ ਜੀ, ਸੱਚੇ ਹਨ ਪਰਮ ਮਾਣਨੀਯ ਗੁਰੂ ਜੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Guru, the Supreme Guru, the Supreme Guru, the True, Dear Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਸਤਿਗੁਰੂ ਜੀ ਤੀਨੋਂ ਕਾਲ ਮੇਂ ਸਤ ਸਰੂਪ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਹੀ ਸਦਾ-ਥਿਰ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿ = ਸਦਾ ਅਟੱਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Supremo Guru, el Supremo Guru, el Supremo Guru, el Verdadero y Adorado Señor."