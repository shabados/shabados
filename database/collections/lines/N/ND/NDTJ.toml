[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਅੰਧਿਆਰੈ; ਦੀਪਕੁ ਪਰਗਾਸਾ ॥"
page = 100
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the lamp lights the darkness,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਚਰਾਗ ਅਨ੍ਹੇਰੇ ਨੂੰ ਪ੍ਰਕਾਸ਼ ਕਰ ਦਿੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Just as the darkness is lit up by the lamp,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਅੰਧੇਰੇ ਮੇਂ ਦੀਪਕ ਕੇ ਪਰਕਾਸ ਹੋਨੇ ਕਰ ਕੇ ਅਨੰਦ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਹਨੇਰੇ ਵਿਚ ਦੀਵਾ ਚਾਨਣ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਧਿਆਰੈ = ਹਨੇਰੇ ਵਿਚ। ਦੀਪਕੁ = ਦੀਵਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Como la luz disipa la oscuridad,"