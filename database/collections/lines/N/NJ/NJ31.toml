[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਰਬੁ ਕਰਤੁ ਹੈ ਦੇਹ ਕੋ; ਬਿਨਸੈ ਛਿਨ ਮੈ ਮੀਤ ॥"
page = 1428
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou entertain pride of thy body, which perishes in a moment, O friend."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਅਪਣੇ ਸਰੀਰ ਦਾ ਹੰਕਾਰ ਕਰਦਾ ਹੈਂ, ਜੋ ਕਿ ਇਕ ਮੁਹਤ ਵਿੱਚ ਨਾਸ ਹੋ ਜਾਂਦਾ ਹੈ, ਹੇ ਮਿੱਤਰ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are so proud of your body; it shall perish in an instant, my friend."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਿਤ੍ਰ ਮਨ! ਜਿਸ ਦੇਹ ਕੋ ਅਪਨੀ ਮਾਨਕਰ ਤੂੰ ਹੰਕਾਰ ਕਰਤਾ ਹੈਂ ਸੋਈ ਤੇਰੀ ਦੇਹੀ ਏਕ ਖ੍ਯਣ ਮੇਂ ਨਾਸ ਹੋ ਜਾਏਗੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਿੱਤਰ! (ਜਿਸ) ਸਰੀਰ ਦਾ (ਮਨੁੱਖ ਸਦਾ) ਮਾਣ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ (ਕਿ ਇਹ ਮੇਰਾ ਆਪਣਾ ਹੈ, ਉਹ ਸਰੀਰ) ਇਕ ਛਿਨ ਵਿਚ ਹੀ ਨਾਸ ਹੋ ਜਾਂਦਾ ਹੈ। (ਹੋਰ ਪਦਾਰਥ ਦਾ ਮੋਹ ਤਾਂ ਕਿਤੇ ਰਿਹਾ, ਆਪਣੇ ਇਸ ਸਰੀਰ ਦਾ ਮੋਹ ਭੀ ਝੂਠਾ ਹੀ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਰਬੁ = (गर्व) ਅਹੰਕਾਰ। ਦੇਹ ਕੋ = (ਜਿਸ) ਸਰੀਰ ਦਾ। ਬਿਨਸੈ = ਨਾਸ ਹੋ ਜਾਂਦਾ ਹੈ। ਮੀਤ = ਹੇ ਮਿੱਤਰ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Estás tan orgulloso de tu cuerpo, pero se acabará en un instante. Mi amigo,"