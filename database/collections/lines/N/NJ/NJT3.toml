[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਪ੍ਰਭ ਸਰਣਾਈ ॥"
page = 629
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak has sought the Lord's refuge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੇ ਸੁਆਮੀ ਦੀ ਸ਼ਰਣਾਗਤਿ ਲਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak has entered God's Sanctuary."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਆਪ ਕੀ ਸਰਣ ਹੂਆ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜੇਹੜਾ ਮਨੁੱਖ ਪ੍ਰਭੂ ਦੀ ਸ਼ਰਨ ਪਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak busca Tu Refugio, oh Señor,"