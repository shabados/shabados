data = "ਆਪ ਹਾਥ ਦੈ ਲਯੋ ਬਚਾਇ ॥੨॥"
page = 73

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Considering me as His Servant, He hath helped me, and hath protected me with His own hands.2."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਹੱਥ ਦੇ ਕੇ ਬਚਾ ਲਿਆ ਹੈ ॥੨॥"