[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨ ਕੈ; ਹਮ ਸਦ ਲਾਗਹ ਪਾਇ ॥੧॥"
page = 361
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I ever fall at their feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਦੀਵ ਹੀ ਉਨ੍ਹਾਂ ਦੇ ਪੈਰਾਂ ਉੱਤੇ ਡਿਗਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I fall at their feet forever and ever. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ ਤਿਨ ਕੇ ਸਦੀਵ ਚਰਨੋਂ ਮੇਂ ਲਗਤੇ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਸੀਂ (ਮੈਂ) ਸਦਾ ਉਹਨਾਂ ਦੀ ਚਰਨੀਂ ਲੱਗਦੇ (ਲੱਗਦਾ) ਹਾਂ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਦ = ਸਦਾ। ਲਾਗਹ = (ਅਸੀ) ਲਗਦੇ ਹਾਂ। ਪਾਇ = ਪੈਰੀਂ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y a Sus Pies me postro siempre y para siempre. (1) P"