[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਪ੍ਰਸਾਦਿ; ਤੂੰ ਪਾਵਹਿ ਸਾਚੁ ॥"
page = 270
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose kindness thou obtainest the truth,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਮਿਹਰਬਾਨੀ ਦੁਆਰਾ ਤੈਨੂੰ ਸੱਚ ਪਰਾਪਤ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By His Grace, you find the Truth;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਤੂੰ ਸਾਚ ਸਰੂਪ ਕੌ ਪਾਇ ਲੇਵੈਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਬਰਕਤਿ ਨਾਲ ਤੈਨੂੰ ਸੱਚ ਪਰਾਪਤ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por Su Gracia, encuentras la Verdad."