[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਾਣੀ; ਗੁਰਮੁਖਿ ਨਾਮੁ ਧਿਆਈ ॥"
page = 1265
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O mortal, contemplate thou thy Lord's Name by the Guru's grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਫਾਨੀ ਬੰਦੇ! ਤੂੰ ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਆਪਣੇ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mortal, as Gurmukh, meditate on the Naam, the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਾਣੀ! ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਧ੍ਯਾਵਣੇ ਵਾਲਾ ਹੋਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਾਣੀ! ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਿਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਾਣੀ = ਹੇ ਪ੍ਰਾਣੀ! ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mortal, como Gurmukj medita en el Naam, el Nombre del Señor, Jar, Jar,"