[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾਹੀ ਕੌ ਅਸਿ ਛੀਨਿ ਕੈ; ਤਾਹਿ ਚੰਡਾਰਹਿ ਘਾਇ ॥੬॥"
page = 888

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And taking his awn sward she killed him (the warrior).(6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਚੰਡਾਲ ਦੀ ਕ੍ਰਿਪਾਨ ਲੈ ਕੇ ਉਸ ਨੂੰ ਮਾਰ ਦਿੱਤਾ ॥੬॥"