data = "ਤਿਨ ਕੇ ਧਾਮ ਗਿਰਾਵਤ ਭਏ ॥੪॥"
page = 71

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Those who had left me in distrust, their homes were demolished by him.4."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੇ ਘਰ (ਅਹਿਦੀਏ ਨੇ) ਢਵਾ ਦਿੱਤੇ ॥੪॥"