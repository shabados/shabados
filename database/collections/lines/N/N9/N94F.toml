[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੈ ਸਬਦਿ; ਹੁਕਮੁ ਪਛਾਣੁ ॥੮॥"
page = 223
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Under Guru's instruction recognise His order."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਤਾਬੇ ਉਸ ਦੇ ਫੁਰਮਾਨ ਨੂੰ ਸਿੰਞਾਣ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Word of the Guru's Shabad, recognize the Hukam of the Lord's Command. ||8||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਗੁਰੋਂ ਕੇ ਉਪਦੇਸ ਦ੍ਵਾਰਾ ਤਿਸ ਕੇ ਹੁਕਮ ਕੋ ਪਹਿਚਾਨੋ॥੮॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਵਿਚ ਜੁੜ ਕੇ (ਸਾਰੇ ਜਗਤ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਹੀ) ਹੁਕਮ ਚੱਲਦਾ ਪਛਾਣ ॥੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh hombre, a través de la Palabra del Shabd, date cuenta de esto, por Su Voluntad.(8)"