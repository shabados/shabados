[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਮਰਾ ਕਹਾ ਕਰੈ ਸੰਸਾਰੁ ॥"
page = 875
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then, what can the world do unto me?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਜਗਤ ਮੈਨੂੰ ਕੀ ਕਰ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then what can the world do to me?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੌ ਸੰਸਾਰੁ ਹਮਾਰਾ ਕਿਆ ਕਰ ਸਕਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ (ਮੈਨੂੰ ਚਮਾਰ ਚਮਾਰ ਆਖਣ ਵਾਲੇ ਇਹ) ਲੋਕ ਮੇਰਾ ਕੁਝ ਭੀ ਵਿਗਾੜ ਨਹੀਂ ਸਕਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹਾ ਕਰੈ = ਕੁਝ ਵਿਗਾੜ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿qué mal nos puede hacer el mundo?"