[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛਿਅ ਵਰਤਾਰੇ; ਵਰਤਹਿ ਪੂਤ ॥"
page = 953
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Becoming disciples, people engage in the six system."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੇਲੇ ਹੋ ਕੇ ਲੱਕ ਦੇ ਭੇਖਾਂ ਅੰਦਰ ਪਰਵਿਰਤ ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The students follow the six systems."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਖਟ ਭੇਖ ਜੋ ਵਰਤ ਰਹੇ ਹੈਂ ਇਨ ਮੇਂ (ਪੂਤ) ਪਵਿਤ੍ਰ ਰਹੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਥ ਦੇ) ਚੇਲੇ (ਭਾਵ, ਜੋਗੀ ਲੋਕ) (ਜੋ ਨਿਰੇ) ਛੇ ਭੇਖਾਂ ਵਿਚ ਹੀ ਰੁੱਝੇ ਹੋਏ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛਿਅ ਵਰਤਾਰੇ = ਛੇ ਭੇਖਾਂ ਵਿਚ। ਪੂਤ = ਚੇਲੇ (ਜੋਗੀਆਂ ਦੇ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los alumnos siguen los seis sistemas,"