[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਝੂਰਤ ਝੂਰਤ; ਸਾਕਤ ਮੂਆ ॥"
page = 255
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He dies in excessive grief,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਬੜੇ ਰੰਜ-ਗ਼ਮ ਅੰਦਰ ਮਰ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The faithless cynic dies in sorrow and pain;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਸਾਕਤ ਜਬ ਝੂਰ ਝੂਰ ਕਰ ਮੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨਾਲੋਂ ਵਿੱਛੁੜਿਆ ਬੰਦਾ ਚਿੰਤਾ-ਝੋਰਿਆਂ ਵਿਚ ਹੀ ਆਤਮਕ ਮੌਤੇ ਮਰਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਕਤ = ਮਾਇਆ-ਗ੍ਰਸਿਆ ਜੀਵ, ਰੱਬ ਨਾਲੋਂ ਟੁੱਟਾ ਹੋੲਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues en su corazón está el amor al otro."