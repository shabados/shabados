[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਭ ਦੂੰ ਨੀਵੀਂ ਹੋਇ ਰਹੀ; ਤਿਸ ਮਣੀ ਨ ਕੂੜੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "It remains under the feet and this humility is true and not false."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਥੋ ਨੀਵੀਂ ਹੋ ਰਹੀ ਹੈ ਉਸਦੀ (ਨਿੰਮ੍ਰਤਾਂ ਦੀ) ਮਨੌਤ ਸੱਚੀ ਹੈ।"