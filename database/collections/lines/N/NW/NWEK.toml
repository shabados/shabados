data = "ਗ੍ਰਿਹ ਪਲਟ ਜਾਨ ਕੀ ਤਜੀ ਆਸ ॥੨੫॥"
page = 202

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then the king became very sad and abandoned the idea of returning to his home.25."

