[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਉਬਾਲੀ ਦਰਗਾਹ, ਆਖਿ ਵਖਾਣੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "His court is also anxiety free."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਉਸਦੀ) ਦਰਗਾਹ ਬੇਪਰਵਾਹ ਹੈ, (ਬੇਪਰਵਾਹ ਕਰ ਕੇ ਹੀ ਉਸ ਦਰਗਾਹ ਨੂੰ) ਵਰਣਨ ਕਰਦੇ ਹਨ।"