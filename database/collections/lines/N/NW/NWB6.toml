[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਰਭ ਭਯੋ ਤਬ ਰੁਕਮਨੀ; ਪ੍ਰਭ ਤੇ ਪਰਮ ਪੁਨੀਤ ॥੨੦੧੫॥"
page = 499

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The husband and wife passed many days in comfort and then Rukmani became pregnant.2015."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਤੋਂ ਰੁਕਮਨੀ ਨੂੰ ਪਰਮ ਪਵਿਤਰ ਗਰਭ ਹੋ ਗਿਆ ॥੨੦੧੫॥"