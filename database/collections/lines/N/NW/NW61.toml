[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕਿ ਮਿਟੀਆ ਮਹਿ; ਮਿਟੀਆ ਖਾਹਿ ॥"
page = 144
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some abide in the earth and eat the mud."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਧਰਤੀ ਅੰਦਰ ਰਹਿੰਦੇ ਹਨ ਅਤੇ ਮਿੱਟੀ ਖਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "while others live in the dirt and eat mud."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਬੁਹਤ ਪ੍ਰਕਾਰੋਂ ਕੇ ਜੀਵ ਮ੍ਰਿਤਕਾ ਮੇਂ ਰਹਤੇ ਹੂਏ ਮ੍ਰਿਤਕਾ ਖਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਕਈ ਮਿੱਟੀ ਵਿਚ (ਰਹਿ ਕੇ) ਮਿੱਟੀ ਖਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunos habitan en la tierra y comen polvo;"