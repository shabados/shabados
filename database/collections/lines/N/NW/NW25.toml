[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਨਿਧਾਨ. ਮਹਾ ਬੀਚਾਰ ॥"
page = 866
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the Lord's supreme meditation, are all the treasures."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਪਰਮ ਸਿਮਰਨ ਅੰਦਰ ਸਾਰੇ ਖਜਾਨੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Contemplating Him is the greatest of all treasures."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ (ਮਹਾ) ਬਹੁਤ ਬੀਚਾਰ ਕਰਨੇ ਮੇਂ ਸਭ ਖਜਾਨੇ ਪ੍ਰਾਪਤਿ ਹੋਤੇ ਹੈਂ, ਭਾਵ ਸੇ ਦੈਵੀ ਸੰਪਤੀ ਪ੍ਰਾਪਤਿ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਉੱਚੇ ਗੁਣਾਂ ਦਾ ਵਿਚਾਰ ਕਰਨਾ ਹੀ (ਜੀਵ ਵਾਸਤੇ) ਸਾਰੇ ਖ਼ਜ਼ਾਨੇ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਧਾਨ = ਖ਼ਜ਼ਾਨੇ। ਮਹਾ ਬੀਚਾਰ = ਪ੍ਰਭੂ ਦੇ ਗੁਣਾਂ ਦੇ ਉੱਚੇ ਵਿਚਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el meditar en Él, en el Ser Grandioso, es obtener todos los tesoros de la tierra."