[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਖ ਚਉਰਾਸੀਹ ਜੀਅ ਉਪਾਏ ॥"
page = 1044
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God has created eighty-four lakhs of species."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨੇ ਚੁਰਾਸੀ ਲੱਖ ਜੂਨੀਆਂ ਰਚੀਆਂ ਹਨ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He created the 8.4 millions species of beings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚੌਰਾਸੀ ਲਖ ਜੀਵ ਉਤਪੰਨ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਪਰਮਾਤਮਾ ਨੇ ਹੀ) ਚੌਰਾਸੀ ਲੱਖ ਜੂਨਾਂ ਦੇ ਜੀਵ ਪੈਦਾ ਕੀਤੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ = {ਲਫ਼ਜ਼ 'ਜੀਉ' ਤੋਂ ਬਹੁ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor ha creado ochenta y cuatro millones de especies."