[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਈ ਸੰਤੁ; ਜਿ ਭਾਵੈ ਰਾਮ ॥"
page = 867
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone is the saint, who is pleasing to the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਸਾਧੂ ਹੈ ਜੋ ਸੁਆਮੀ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is a Saint, who is pleasing to the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਸੋਈ ਹੈ, ਜੋ ਰਾਮ ਕੋ ਭਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੇਹੜਾ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਨੂੰ ਪਿਆਰਾ ਲੱਗਣ ਲੱਗ ਪੈਂਦਾ ਹੈ, ਉਹੀ ਹੈ ਸੰਤ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਈ = ਉਹੀ (ਮਨੁੱਖ)। ਜਿ = ਜਿਹੜਾ। ਭਾਵੈ ਰਾਮ = ਰਾਮ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Santo es aquél con quien el Señor está complacido;"