[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸੂਰਜੁ ਇਕੁ ਵਰਤਦਾ; ਲੋਕੁ ਵੇਦ ਅਲਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "But as say the knowledgeable persons the sun remains the same among these all."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸੂਰਜ ਇਕ ਵਰਤਦਾ ਹੈ (ਆਮ) ਲੋਕੀ ਤੇ ਗ੍ਯਾਨੀ ਆਖਦੇ ਹਨ।"