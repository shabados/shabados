[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏ ਦ੍ਵੈ ਟੂਟੇ ਨ ਜੁਰਹਿ; ਏਕੁ ਸੀਸ ਅਰੁ ਚਿਤ ॥੪੧॥"
page = 853

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But the broken mind and thought cannot be reconciled.(41)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਰ ਇਹ ਦੋ (ਚੀਜ਼ਾਂ) ਟੁਟੀਆਂ ਹੋਈਆਂ ਨਹੀਂ ਜੁੜਦੀਆਂ। ਇਕ ਸਿਰ ਅਤੇ ਦੂਜਾ ਚਿਤ ॥੪੧॥"