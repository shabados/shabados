[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭਨੀ ਥਾਂਈ; ਰਵਿਆ ਆਪਿ ॥"
page = 801
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself is pervading all places,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਖੁਦ ਸਾਰੀਆਂ ਥਾਵਾਂ ਅੰਦਰ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is pervading everywhere;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਸਰਬ ਅਸਥਾਨੋਂ ਮੇਂ ਆਪ ਵਿਆਪਕ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਪ੍ਰਭੂ ਆਪਣੀ ਸੇਵਾ-ਭਗਤੀ ਵਿਚ ਜੋੜਦਾ ਹੈ, ਉਸ ਨੂੰ) ਉਹ ਪ੍ਰਭੂ ਹੀ ਹਰ ਥਾਂ ਮੌਜੂਦ ਦਿੱਸਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਵਿਆ = ਵਿਆਪਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor prevalece en todos los lugares;"