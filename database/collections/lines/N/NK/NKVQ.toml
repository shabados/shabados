[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਜਨੀ. ਕੀਆ ਉਪਦੇਸੁ ॥"
page = 1183
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints have instructed me thus."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਨੇ ਮੈਨੂੰ ਇਸ ਤਰ੍ਹਾਂ ਸਿਖ ਮਤ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Saints have shared the Teachings with me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨੋਂ ਨੇ ਇਹ ਉਪਦੇਸ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨਾਂ ਨੇ ਇਹ ਸਿੱਖਿਆ ਦਿੱਤੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨੀ = ਜਨਾਂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ésta en verdad es la Instrucción de los Santos,"