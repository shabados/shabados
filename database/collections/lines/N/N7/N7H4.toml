[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਤਿਸੁ ਭਾਵੈ; ਤਾ ਗੁਰੂ ਮਿਲਾਏ ॥"
page = 1064
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When it pleases Him, then He introduces one to the Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਸ ਨੂੰ ਚੰਗਾ ਲਗਦਾ ਹੈ, ਤਦ ਉਹ ਮਿਲਾ ਦਿੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When it pleases His Will, He leads us to meet the Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ (ਤਿਸੁ) ਤੇਰੇ ਕੋ ਭਾਵੈ ਤਾਂ ਤੂੰ ਗੁਰੂ ਮਿਲਾਵਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਉਸ ਪਰਮਾਤਮਾ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ, ਤਦੋਂ ਉਹ (ਕਿਸੇ ਵਡਭਾਗੀ ਨੂੰ) ਗੁਰੂ ਮਿਲਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸੁ ਭਾਵੈ = ਉਸ ਪ੍ਰਭੂ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ। ਜਾ = ਜਾਂ, ਜਦੋਂ। ਤਾ = ਤਾਂ, ਤਦੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando el Señor así lo desea, nos conduce hasta el Guru"