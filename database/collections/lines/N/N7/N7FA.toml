[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦਿ; ਰਹਿਆ ਭਰਪੂਰਿ ॥"
page = 363
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's grace he finds God fully-pervading."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਮਿਹਰ ਸਦਕਾ ਉਹ ਹਰੀ ਨੂੰ ਪਰੀਪੂਰਨ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, he sees the Lord permeating and pervading everywhere."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਬਾਣ ਤ੍ਰਿਣ ਮੇਂ ਭੀ ਭਰਪੂਰ ਹੋ ਰਹਾ ਹਰੀ ਹੀ ਕੋ ਦੇਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਉਸ ਨੂੰ ਪਰਮਾਤਮਾ ਹਰ ਥਾਂ ਵਿਆਪਕ ਦਿੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਸਾਦਿ = ਕਿਰਪਾ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a través de la Gracia del Guru, se sumerge en Dios."