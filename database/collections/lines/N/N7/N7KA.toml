[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਨਿਧਾਨ ਗੁਣ; ਤੁਮ ਹੀ ਪਾਸਿ ॥"
page = 180
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The treasure of all the excellences is with Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਮੂਹ ਚੰਗਿਆਈਆਂ ਦਾ ਖਜਾਨਾ ਤੇਰੇ ਕੋਲ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The treasure of all excellence is with You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਿਗੁਰੂ! ਸੰਪੂਰਨ ਨਿਧੀਆਂ ਔਰ ਗੁਣ ਤੇਰੇ ਪਾਸ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਸਾਰੇ ਖ਼ਜ਼ਾਨੇ ਸਾਰੇ ਗੁਣ ਤੇਰੇ ਹੀ ਵੱਸ ਵਿਚ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਧਾਨ = ਖ਼ਜ਼ਾਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú eres el Tesoro de todas las Virtudes, oh Señor."