[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੀ ਪ੍ਰੀਤਿ. ਤਿਨ ਊਪਜੀ; ਹਰਿ ਪ੍ਰੇਮ ਕਸਾਏ ॥"
page = 513
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's love breaks forth within them and with God's love they are attracted."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦਾ ਪਿਆਰ ਉਨ੍ਹਾਂ ਅੰਦਰ ਪੈਂਦਾ ਹੋ ਜਾਂਦ ਹੈ ਅਤੇ ਵਾਹਿਗੁਰੂ ਦੇ ਪਿਆਰ ਨਾਲ ਹੀ ਉਹ ਖਿੱਚੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord's Love wells up in them; they are attracted by the Lord's Love."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਕੀ ਪ੍ਰੀਤਿ ਤਿਨ ਕੋ ਉਤਪਤ ਭਈ ਹੈ ਔ ਹਰਿ ਕੇ ਪ੍ਰੇਮ ਮੇਂ (ਕਸਾਏ) ਖੀਚੇ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਦੇ ਅੰਦਰ ਪ੍ਰਭੂ ਦਾ ਪਿਆਰ ਪੈਦਾ ਹੁੰਦਾ ਹੈ, (ਉਹ) ਪ੍ਰਭੂ ਦੇ ਪਿਆਰ ਦੇ ਖਿੱਚੇ ਹੋਏ (ਹਨ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰੇਮ ਕਸਾਏ = ਪ੍ਰੇਮ ਦੇ ਖਿੱਚੇ ਹੋਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ellos han sido seducidos por el Amor del Señor y Su Amor llena su mente."