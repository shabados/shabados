[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛਛਾ; ਛੋਹਰੇ ਦਾਸ ਤੁਮਾਰੇ ॥"
page = 254
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Chh: I am a slave boy of Thine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਛ- ਮੈਂ ਤੇਰਾ ਗੁਲਾਮ ਛੋਕਰਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "CHHACHHA: I am Your child-slave."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਛਛੇ ਦ੍ਵਾਰਾ ਕਹਤੇ ਹੈਂ: ਜੋ ਆਪ ਕੇ (ਛੋਹਰੇ) ਛੋਟੇ ਬਾਲਕ ਕੇ ਸਮਾਨ ਦਾਸ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰਾ ਦਾਸ ਹਾਂ, ਤੇਰਾ ਬੱਚਾ ਹਾਂ (ਮਿਹਰ ਕਰ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛੋਹਰੇ = ਬਾਲਕੇ, ਦਾਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "CHHACHHA: Somos Tus niños, Tus esclavos, oh Señor;"