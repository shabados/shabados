[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਟੋਡੀ ਮਹਲਾ ੫ ਘਰੁ ੩ ਚਉਪਦੇ ॥"
page = 715
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Todi 5th Guru. Chaupadas."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਟੋਡੀ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ। ਚਉਪਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Todee, Fifth Mehl, Third House, Chau-Padhay:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਟੋਡੀ, ਘਰ ੩ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਚਾਰ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todi, Mejl Guru Aryan, Quinto Canal Divino, Chau-Padas."