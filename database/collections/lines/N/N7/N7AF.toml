[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕਾ ਬਚਨੁ; ਤਿਨਿ. ਬਾਧਿਓ ਪਾਲਾ ॥"
page = 1348
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he puts his mind to the Guru's word."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਗੁਰਾਂ ਦੀ ਬਾਣੀ ਨੂੰ ਉਹ ਆਪਣੇ ਪੱਲੇ ਨਾਲ ਬੰਨ੍ਹ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "sews the Word of the Guru's Shabad into his robes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕਾ ਬਚਨੁ ਅਰਥਾਤ ਉਪਦੇਸੁ ਤਿਨੋਂ ਨੇ ਅਪਨੇ ਪਲੇ ਮੇਂ ਬਾਂਧ ਲੀਆ ਹੈ, ਭਾਵ ਰਿਦੇ ਮੇਂ ਦ੍ਰਿੜ ਕਰ ਧਾਰਨ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਗੁਰੂ ਦਾ ਬਚਨ (ਆਪਣੇ) ਪੱਲੇ ਬੰਨ੍ਹ ਲਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਨਿ = ਉਸ ਨੇ। ਪਾਲਾ = ਪੱਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entreteje la Palabra del Shabd del Guru en su túnica."