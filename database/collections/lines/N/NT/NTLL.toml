[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਜੈ ਭਾਇ; ਬਾਧਾ ਜਮ ਫਾਸੀ ॥"
page = 1047
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Attached to another's love, one falls into the Yama's noose."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੋਰਸ ਦੇ ਪਿਆਰ ਨਾਲ ਜੁੜਨ ਦੁਆਰਾ ਇਨਸਾਨ ਯਮ ਦੀ ਫਾਹੀ ਵਿੱਚ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the love of duality, they are caught by the noose of the Messenger of Death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਜੀਵ ਦ੍ਵੈਤ ਭਾਵ ਕਰ ਕੇ ਜਮ ਕੀ ਫਾਸੀ ਮੇਂ ਬਾਂਧਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਮਾਇਆ ਦੇ ਮੋਹ ਦੇ ਕਾਰਨ (ਜੀਵ) ਆਤਮਕ ਮੌਤ ਦੀ ਫਾਹੀ ਵਿਚ ਬੱਝ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਜੈ ਭਾਇ = (ਪ੍ਰਭੂ ਤੋਂ ਬਿਨਾ) ਹੋਰ ਦੇ ਪਿਆਰ ਵਿਚ। ਭਾਇ = ਪਿਆਰ ਵਿਚ। ਬਾਧਾ = ਬੱਝਾ ਹੋਇਆ। ਜਮ = ਮੌਤ, ਆਤਮਕ ਮੌਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, aquél a quien el Guru Verdadero salva, nada hasta la otra orilla,"