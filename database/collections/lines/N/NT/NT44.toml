[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮੇਰੇ; ਚਰਨ ਕਮਲ ਸੰਗਿ ਰਾਚੁ ॥"
page = 500
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My soul, remain thou merged with Lord, lotus feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਜਿੰਦੇ! ਤੂੰ ਸੁਆਮੀ ਦੇ ਕੰਵਲ ਪੈਰਾਂ ਨਾਲ ਲੀਨ ਹੋਈ ਰਹੁ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, immerse yourself in the Lord's lotus feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ ਅਕਾਲ ਪੁਰਖ ਕੇ ਚਰਨ ਕਮਲੋਂ ਕੇ ਸਾਥ (ਰਾਚੁ) ਖਚਤ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ ਉਸ ਦੇ ਸੋਹਣੇ ਕੋਮਲ ਚਰਨਾਂ ਨਾਲ ਪਿਆਰ ਕਰਿਆ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਸੰਗਿ = ਨਾਲ। ਰਾਚੁ = ਮਸਤ ਰਹੁ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, alaba los Pies de Loto del Señor;"