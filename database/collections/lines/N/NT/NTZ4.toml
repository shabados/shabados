[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਰ ਸੈ ਨਾਰਿ ਹੋਇ ਅਉਤਰੈ ॥੩॥"
page = 874
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "is born as a woman instead of man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਦਮੀ ਤੋਂ ਤੀਵੀਂ ਹੋ ਕੇ ਜੰਮਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "will be reincarnated as a woman, and not a man. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪੁਰਸੁ ਇਸਤ੍ਰੀ ਹੋਇ ਕੈ ਸੰਸਾਰ ਮੇਂ ਅਵਤਾਰ ਲੇਤਾ ਹੈ, ਵਾ ਸ਼ੇਰ ਰੂਪ ਹੋਤਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਤੋਂ ਜ਼ਨਾਨੀ ਬਣ ਕੇ ਜਨਮ ਲੈਂਦਾ ਹੈ (ਕਿਉਂਕਿ ਪੂਜਾ ਕਰਨ ਵਾਲਾ ਆਪਣੇ ਪੂਜਯ ਦਾ ਰੂਪ ਹੀ ਬਣ ਸਕਦਾ ਹੈ) ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੈ = ਤੋਂ। ਹੋਇ = ਬਣ ਕੇ। ਅਉਤਰੈ = ਜੰਮਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "reencarna en un estado inferior. (3)"