[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੁ ਪਛਾਨੈ; ਆਪੈ ਆਪ ॥"
page = 327
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When man himself understands his ownself,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਇਨਸਾਨ ਖੁਦ ਆਪਣੇ ਆਪ ਨੂੰ ਸਮਝ ਲੈਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When someone understands his own self,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਅਪਨੇ ਆਪ ਕੋ ਬ੍ਰਹਮ ਰੂਪ ਜਾਨਿਆ ਤਬ ਸਰਬ ਜਗਤ ਅਪਨਾ ਹੀ ਹੈ ਦੂਜਾ ਕੋਈ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੇਰੇ ਮਨ ਨੇ) ਆਪਣੇ ਅਸਲ ਸਰੂਪ ਨੂੰ ਪਛਾਣ ਲਿਆ ਹੈ (ਹੁਣ ਇਸ ਨੂੰ) ਪ੍ਰਭੂ ਹੀ ਪ੍ਰਭੂ ਦਿੱਸ ਰਿਹਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੁ = ਆਪਣੇ ਆਪ ਨੂੰ। ਆਪੈ ਆਪ = ਪ੍ਰਭੂ ਹੀ ਪ੍ਰਭੂ (ਦਿੱਸ ਰਿਹਾ ਹੈ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que conoce su Ser, ve al Señor prevaleciendo en todo;"