[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ; ਊਨ ਨਾਹੀ ਕਾਹੂ ਬਾਤ ॥"
page = 238
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In whose Home, there is dearth of nothing,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਘਰ ਵਿੱਚ ਕਿਸੇ ਚੀਜ਼ ਦੀ ਭੀ ਕਮੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is not lacking in anything."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਕਿਸੀ ਬਾਤ ਕੀ (ਊਨ) ਕਮਤੀ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਜਿਸ ਪਰਮਾਤਮਾ ਦੇ ਘਰ ਵਿਚ ਕਿਸੇ ਚੀਜ਼ ਦੀ ਕਮੀ ਨਹੀਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੈ = ਜਿਸ ਦੇ ਘਰ ਵਿਚ। ਊਨ = ਘਾਟ, ਕਮੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios nunca es deficiente en nada;"