[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਊ ਜੀਅ; ਬਹੁਤੁ ਗ੍ਰਭ ਵਾਸੇ ॥"
page = 251
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This soul has dwelt in many wombs."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਆਤਮਾ ਅਨੇਕਾਂ ਰਹਿਮਾਂ ਅੰਦਰ ਰਹਿ ਆਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This soul has lived in many wombs."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਹ ਜੋ ਜੀਵ ਹੈ ਬਹੁਤੇ ਗਰਭ ਮੇਂ ਨਿਵਾਸ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਜੀਵ ਅਨੇਕਾਂ ਜੂਨਾਂ ਵਿਚ ਵਾਸ ਲੈਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਊ ਜੀਅ = ਇਹ ਜੀਵ {ਬਹੁ-ਵਚਨ}। ਗ੍ਰਭ = ਜੂਨਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Alma pasa a través de muchos, muchos vientres"