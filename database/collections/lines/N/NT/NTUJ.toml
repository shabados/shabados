[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਰਸ ਤੇਰੇ ਕੀ ਪਿਆਸ ਮਨਿ ਲਾਗੀ ॥"
page = 389
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My soul is thirsty for thy vision,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਆਤਮਾ ਨੂੰ ਤੈਡੇ ਦੀਦਾਰ ਦੀ ਤੇਹ ਲੱਗੀ ਹੋਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind thirsts for Your Vision;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਕਾਲ ਪੁਰਖ! ਜਿਸ ਕੇ ਮਨ ਮੇਂ ਤੇਰੇ ਦਰਸਨ ਕੀ ਪ੍ਯਾਸ ਲਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜਿਸ ਮਨੁੱਖ ਦੇ ਮਨ ਵਿਚ ਤੇਰੇ ਦਰਸ਼ਨ ਦੀ ਤਾਂਘ ਪੈਦਾ ਹੁੰਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tengo sed de Tu Visión,"