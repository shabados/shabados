[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੀਸਉ ਚਰਣ ਪਖਾਰਿ; ਆਪੁ ਤਿਆਗੀਐ ॥"
page = 457
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Let us grind their corn, wash their feet and shed our self-conceit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਓ, ਆਪਾਂ ਉਸ ਦੇ ਦਾਣੇ ਪੀਹੀਏ! ਉਸ ਦੇ ਪੈਰ ਧੋਈਏ ਅਤੇ ਆਪਣੀ ਸਵੈ-ਹੰਗਤਾ ਨੂੰ ਛੱਡੀਏ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Let us grind their corn, wash their feet and so renounce our self-conceit."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪਾ ਭਾਉ ਕੋ ਤ੍ਯਾਗੀਏ ਔ ਤਿਨ ਕੇ ਚਰਨੋਂ ਕੋ ਧੋਈਏ, ਤਿਨ ਕਾ ਅੰਨ ਪੀਸੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਖੀ! (ਮੇਰਾ ਜੀ ਕਰਦਾ ਹੈ) ਮੈਂ (ਗੁਰੂ ਕੇ ਲੰਗਰ ਵਾਸਤੇ ਚੱਕੀ) ਪੀਹਾਂ, ਮੈਂ (ਗੁਰੂ ਦੇ) ਚਰਨ ਧੋਵਾਂ। ਹੇ ਸਖੀ! ਗੁਰੂ ਦੇ ਦਰ ਤੇ ਜਾ ਕੇ ਅਹੰਕਾਰ ਤਿਆਗ ਦੇਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੀਸਉ = ਪੀਸਉਂ, ਮੈਂ ਪੀਹਾਂ। ਪਖਾਰਿ = ਪਖਾਰੀਂ, ਮੈਂ ਧੋਵਾਂ। ਆਪੁ = ਆਪਾ-ਭਾਵ, ਅਹੰਕਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vamos a moler Su maíz y a lavar Sus Pies para así elevar nuestro ser."