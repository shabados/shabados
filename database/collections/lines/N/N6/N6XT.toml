[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਕੈ ਮਨਿ; ਇਹੁ ਪੁਰਖਾਰਥੁ ॥"
page = 1151
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within the mind of Nanak is this support,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਦੇ ਮਨ ਅੰਦਰ ਇਹ ਆਸਰਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak's mind is encouraged by this hope,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹਮਾਰੇ ਮਨ ਬੀਚ ਇਹੁ ਪੁਰਸਾਰਥੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਦੇ ਮਨ ਵਿਚ (ਭੀ) ਇਹੀ ਹੌਸਲਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ ਮਨਿ = ਦੇ ਮਨ ਵਿਚ। ਪੁਰਖਾਰਥੁ = ਹੌਸਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La mente de Nanak se apoya sólo en la esperanza de que el Señor Todopoderoso"