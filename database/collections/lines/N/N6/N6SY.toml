[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪੁਨੇ ਜਨ ਕਾ; ਪਰਦਾ ਢਾਕੈ ॥"
page = 285
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of His serf the Lord screens the faults."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪਣੇ ਗੁਮਾਸ਼ਤੇ ਦੇ ਕਸੂਰਾਂ ਨੂੰ ਕੱਜ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He covers the faults of His servant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਵਾਹਿਗੁਰੂ ਅਪਨੇ ਦਾਸ ਕਾ ਪੜਦਾ ਢਕਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪਣੇ ਸੇਵਕ ਦਾ ਪਰਦਾ ਢੱਕਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਦਾ ਢਾਕੈ = ਲਾਜ ਰੱਖਦਾ ਹੈ, ਔਗੁਣਾਂ ਤੇ ਪਰਦਾ ਪਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios defiende la Dignidad de Su Sirviente,"