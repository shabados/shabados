data = "ਕਿ ਮਾਰਾ ਚਿਯਾਰੀ ਅਜ਼ੀਂ ਕਾਰ ਬੇਸ਼ ॥੨੦॥"
page = 1407

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Then what would you not do to me?(20)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਮੇਰੇ ਨਾਲ ਇਸ ਤੋਂ ਵੱਧ ਦੋਸਤੀ ਦਾ ਕੀ ਕੰਮ ਕਰੇਂਗੀ ॥੨੦॥"