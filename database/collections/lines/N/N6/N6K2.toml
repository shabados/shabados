[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਣਸ ਸੇਵਾ; ਖਰੀ ਦੁਹੇਲੀ ॥"
page = 1182
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Very painful is the service of man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੜੀ ਦੁਖਦਾਈ ਹੈ ਮਨੁੱਖ ਦੀ ਟਹਿਲ ਸੇਵਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It is so painful to serve only mortal beings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਤਰ ਮਨੁਖੋਂ ਕੀ ਸੇਵਾ ਅਤ੍ਯੰਤ (ਦੁਹੇਲੀ) ਕਠਨ ਵਾ ਦੁਖਦਾਇਕ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਦੀ ਖ਼ਿਦਮਤ ਬਹੁਤ ਦੁਖਦਾਈ ਹੋਇਆ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖਰੀ = ਬਹੁਤ। ਦੁਹੇਲੀ = ਦੁਖਦਾਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El servicio al ser humano te lleva al dolor,"