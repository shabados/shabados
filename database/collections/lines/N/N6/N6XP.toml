data = "ਸਦਾ ਸੁਨਤ ਬੁਧਿਜਨਨ ਭਣੀਜੈ ॥੧੧੬੦॥"
page = 793

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Kshmeshani”, add the word “mathani” and know the names of Tupak for causing the wise men to listen to them.1160."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬੁੱਧੀਮਾਨਾਂ ਵਿਚ ਸੁਣਾ ਕੇ ਕਹਿ ਦਿਓ ॥੧੧੬੦॥"