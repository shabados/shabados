[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਅੰਕਾਰ; ਲਖੈ ਜਉ ਕੋਈ ॥"
page = 340
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If someone sees the one Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਕੋਈ ਇਕ ਸਾਈਂ ਨੂੰ ਵੇਖ ਲਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If someone knows the One, the Universal Creator,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੋਈ ਓਅੰਕਾਰ ਕੋ ਲਖੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋਈ ਮਨੁੱਖ ਉਸ ਸਰਬ-ਵਿਆਪਕ ਪਰਮਾਤਮਾ ਨੂੰ ਸਮਝ ਲਏ (ਭਾਵ, ਆਪਣੇ ਅੰਦਰ ਅਨੁਭਵ ਕਰ ਲਏ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਉ = ਜੇ। ਲਖੈ = ਸਮਝ ਲਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues quien conoce al Señor"