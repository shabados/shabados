[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੇ ਮਨ ਮੂੜ; ਤੂ ਤਾ ਕਉ ਜਾਪੁ ॥"
page = 270
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my foolish soul, do thou meditate upon Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਮੂਰਖ ਜਿੰਦੜੀਏ! ਤੂੰ ਉਸ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O foolish mind, meditate on Him!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ ਮਨ! ਤਿਸ ਕੋ ਤੂੰ ਜਪੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ ਮਨ! ਤੂੰ ਉਸ ਪ੍ਰਭੂ ਨੂੰ ਜਪ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂੜ = ਮੂਰਖ। ਤਾ ਕਉ = ਉਸ ਨੂੰ। ਜਾਪੁ = ਯਾਦ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente tonta, medita en Él."