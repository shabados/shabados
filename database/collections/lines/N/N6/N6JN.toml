data = "ਨਹੀ ਤਾਸ ਚਿਤ ਕਿਨੋ ਸੁਮਾਰ ॥"
page = 630

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The princess looked towards the group of princes and did not even like the prince of Sindhu-kingdom"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਮਨ ਵਿਚ ਕੋਈ ਮਹਤਵ ਨਾ ਦਿੱਤਾ।"