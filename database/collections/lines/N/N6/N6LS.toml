[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇ ਕੰਨੁ; ਸੁਣਹੁ ਅਰਦਾਸਿ ਜੀਉ ॥"
page = 74
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lend Thy ear and hear my supplication O Lord!"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਕੰਨ ਦੇ ਕੇ ਮੇਰੀ ਪ੍ਰਾਰਥਨਾ ਸੁਣ, ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please hear my prayer, O Dear Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਾਂ ਤੇ ਮੇਰੀ ਬੇਨਤੀ ਕੰਨ ਦੇ ਕਰ ਸ੍ਰਵਨ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਤੂੰ (ਹਰੇਕ ਜੀਵ ਦੀ) ਅਰਦਾਸ ਧਿਆਨ ਨਾਲ ਸੁਣਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇ ਕੰਨੁ = ਕੰਨ ਦੇ ਕੇ, ਪੂਰੇ ਧਿਆਨ ਨਾਲ। ਸੁਣਹੁ = (ਹੇ ਪ੍ਰਭੂ ਜੀ!) ਤੁਸੀ ਸੁਣਦੇ ਹੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú prestas oídos a todas nuestras oraciones,"