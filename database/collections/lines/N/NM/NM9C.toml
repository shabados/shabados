[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੁਧੁ ਕਰਤ ਹੈ ਬੀਰ ਬਰ; ਰਨ ਦੁੰਦਭੀ ਬਜਾਇ ॥੧੨੭੧॥"
page = 424

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The armies of both the sides, in great anger, gathered together and the warriors playing upon their trumpets etc. began to wage war.1271."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਹਾਦੁਰ ਯੋਧੇ ਰਣ-ਭੂਮੀ ਵਿਚ ਨਗਾਰੇ ਵਜਾ ਕੇ ਯੁੱਧ ਕਰਦੇ ਹਨ ॥੧੨੭੧॥"