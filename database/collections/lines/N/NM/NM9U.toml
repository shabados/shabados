[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ ਪ੍ਰਭ ਆਪਣੀ; ਜਨ ਧੂੜੀ ਸੰਗਿ ਸਮਾਉ ॥"
page = 137
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Shower Thine benediction, O Lord that I may blend with the dust of Thine slave's feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਰਹਿਮਤ ਧਾਰ, ਹੇ ਸੁਆਮੀ! ਤਾਂ ਜੋ ਮੈਂ ਤੇਰੇ ਗੋਲਿਆਂ ਦੀ ਪੈਰਾਂ ਦੀ ਖਾਕ ਦੇ ਨਾਲ ਮਿਲ ਜਾਵਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Grant Your Grace, God, and bless me, that I may merge into the dust of the feet of the humble."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਅਪਨੀ ਐਸੇ ਕਿਰਪਾ ਕਰ ਜੋ ਤੇਰੇ ਦਾਸੋਂ ਕੀ ਚਰਣ ਧੂੜ ਸਾਥ ਮਿਲ ਰਹਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਆਪਣੀ ਮਿਹਰ ਕਰ ਮੈਂ ਤੇਰੇ ਸੰਤ ਜਨਾਂ ਦੀ ਚਰਨ-ਧੂੜ ਵਿਚ ਸਮਾਇਆ ਰਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਸਮਾਉ = ਸਮਾਉਂ, ਮੈਂ ਸਮਾਇਆ ਰਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, sé Misericordioso conmigo y haz que yo pueda mezclarme con el Polvo debajo de los Pies de Tus Santos."