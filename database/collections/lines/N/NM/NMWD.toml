[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਤ੍ਰਿਸਨ ਬੁਝੀ; ਮਨਿ ਤਨਿ ਸੁਖੁ ਪਾਇਆ ॥੫॥੬॥੪॥੬॥੧੦॥"
page = 798
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, my desire is quenched and my soul and body are comforted."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਮੇਰੀ ਖਾਹਿਸ਼ ਬੁਝ ਗਈ ਹੈ ਅਤੇ ਮੇਰੀ ਜਿੰਦੜੀ ਤੇ ਜਿਸਮ ਨੂੰ ਠੰਢ-ਚੈਨ ਪਰਾਪਤ ਹੋ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, my thirst is quenched, and my mind and body have found peace. ||5||6||4||6||10||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਕਰ ਹਮਾਰੀ ਤ੍ਰਿਸਨਾ ਰੂਪੀ ਅਗਨ ਨਿਬ੍ਰਿਤ ਭਈ ਹੈ ਅਰੁ ਮਨ ਤਨ ਸੇ ਸੁਖ ਕੋ ਪਾਇ ਲੀਆ ਹੈ॥੫॥੬॥੧੦॥☬ਅਬ ਸ੍ਰੀ ਗੁਰੂ ਰਾਮ ਦਾਸ ਜੀ ਚੌਥੀ ਪਾਤਿਸ਼ਾਹੀ ਸ੍ਰੀ ਅਕਾਲ ਪੁਰਖ ਜੀ ਆਗੇ ਬੇਨਤੀ ਉਚਾਰਨ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਦੇ ਅੰਦਰੋਂ ਮਾਇਆ ਦੀ ਤ੍ਰੇਹ ਬੁੱਝ ਗਈ। ਉਸ ਨੂੰ ਆਪਣੇ ਮਨ ਵਿਚ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਆਨੰਦ ਹੀ ਆਨੰਦ ਹਾਸਲ ਹੋ ਗਿਆ ॥੫॥੬॥੪॥੬॥੧੦॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਤਨਿ = ਸਰੀਰ ਵਿਚ ॥੫॥੬॥੪॥੬॥੧੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la ansiedad se calma y el cuerpo y la mente se tranquilizan.(5-6-4-6-10)"