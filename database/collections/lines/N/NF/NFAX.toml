[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮ੍ਰਿਦੁਹਾਸਾ ਨਾਸਾ ਖੰਕਾਲੀ ॥"
page = 661

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Her laughter was like lightning amongst the clouds and her nostril was extremely glorious"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸੇ ਤਰ੍ਹਾਂ ਉਸ ਦਾ) ਕੋਮਲ ਹਾਸਾ ਹੈ, ਉਸ ਦਾ ਨਕ ਭੈਰਵੀ ਸ਼ਕਤੀ ਰਖਣ ਵਾਲਾ ਹੈ।"