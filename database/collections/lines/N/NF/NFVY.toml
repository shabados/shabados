type = "primary"
data = "ਆਨਿ ਸੁੰਭ ਪੈ ਤਿਨ ਕਹੀ; ਸਕਲ ਜੁਧ ਕੀ ਬਾਤ ॥"
page = 98

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He told Sumbh all that had happened in the war.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਆ ਕੇ ਸ਼ੁੰਭ ਕੋਲ ਯੁੱਧ ਦੀ ਸਾਰੀ ਵਾਰਤਾ ਕਹੀ"