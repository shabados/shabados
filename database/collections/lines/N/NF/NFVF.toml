data = "ਧਰਮ ਭਗਨਿ ਮੁਹਿ ਸੰਗ ਲੈ; ਰੁਦ੍ਰ ਦੇਹਰੇ ਜਾਇ ॥"
page = 984

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘The righteous-sister has taken me to the temple,"

