data = "ਮੇਰੀ ਧਰਮ ਭੈਣ ਮੈਨੂੰ ਨਾਲ ਲੈ ਕੇ ਰੁਦ੍ਰ ਦੇ ਮੰਦਿਰ ਵਿਚ ਗਈ"