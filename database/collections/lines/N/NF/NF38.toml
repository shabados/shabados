data = "ਸਕਲ ਤੁਪਕ ਕੇ ਨਾਮ ਬਿਚਾਰਹੁ ॥੯੨੭॥"
page = 771

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the words “Vyaahanani” (Vyas), add the words “Jaachar-nayak-shatru” and know all the names of Tupak.927."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਤੁਪਕ ਦਾ ਨਾਮ ਵਿਚਾਰੋ ॥੯੨੭॥"