[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੰਸੁ ਚਲਿਆ; ਕਾਇਆ ਕੁਮਲਾਨੀ ॥੨॥"
page = 792
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the soul swan departs, the body withers away."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਰੂਹ ਪਾ ਰਾਜ-ਹੰਸ ਟੁਰ ਜਾਂਦਾ ਹੈ ਤਾਂ ਦੇਹ ਮੁਰਝਾ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "when the soul-swan departs, the body withers away. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਜੀਵ ਰੂਪ ਹੰਸ ਚਲਿਆ ਜਾਤਾ ਹੈ ਤਬ ਕਾਇਆਂ ਕੁਮਲਾਇ ਜਾਤੀ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸੁਆਸ ਬੀਤਦੇ ਗਏ, ਹੁਣ) ਸਰੀਰ ਕੁਮਲਾ ਰਿਹਾ ਹੈ ਤੇ (ਜੀਵ-) ਭੌਰ ਉਡਾਰੀ ਮਾਰਨ ਨੂੰ ਤਿਆਰ ਹੈ (ਪਰ ਆਪਣਾ ਕੁੱਝ ਭੀ ਨਾਹ ਸਵਾਰਿਆ) ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੰਸੁ = ਜੀਵ-ਆਤਮਾ। ਕਾਇਆ = ਸਰੀਰ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así el cuerpo se desintegra cuando el Alma cisne parte. (2)"