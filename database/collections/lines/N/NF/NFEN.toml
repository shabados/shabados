data = "ਸਕਲ ਗੁਨਿਜਨਨ, ਸੁਨਤ ਭਨੀਜੈ ॥੧੧੮੪॥"
page = 796

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Vaaridhini”, add the word “Pati ari” and speak the names of Tupak for the talented people.1184."

[[content]]
assets = ["RSJD"]
type = "translation"
