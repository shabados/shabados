[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਵਨ ਜੋਗ, ਕੋ ਭੋਗ ਹੈ, ਕਵਨ ਕਰਮ ਅਪਕਰਮ ॥੪॥੨੦੪॥"
page = 35

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "What are enjoyment and ecstasy? What are virtue and vice? 4.204."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਯੋਗ ਕੀ ਹੈ, ਭੋਗ ਕੀ ਹੈ, ਸੁਕਰਮ ਕੀ ਹੈ ਅਤੇ ਕੁਕਰਮ ਕੀ ਹੈ? ॥੪॥੨੦੪॥"