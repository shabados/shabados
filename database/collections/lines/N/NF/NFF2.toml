[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਗਮ ਅਲਖ ਕਾਰਣ ਪੁਰਖ; ਜੋ ਫੁਰਮਾਵਹਿ ਸੋ ਕਹਉ ॥"
page = 1395
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever is the command of the Unfathomable and Unseen Lord, who is the cause of all causes, that alone I recite."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਛ ਬੇਥਾਹ, ਅਦ੍ਰਿਸ਼ਟ ਅਤੇ ਹੇਤੂਆਂ ਦਾ ਹੇਤੂ ਸੁਆਮੀ ਹੁਕਮ ਦਿੰਦਾ ਹੈ, ਕੇਵਲ ਉਹ ਹੀ ਮੈਂ ਉਚਾਰਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Unfathomable and Unseen Primal Lord God, the Cause of causes - as He orders, so do I speak."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ ਬਾਣੀ ਸੇ ਅਗੰਮ ਅਲਖ ਸਰੂਪ ਸਰਬ ਕੇ ਕਾਰਣ ਪੁਰਖ! ਜੋ ਜੋ ਆਪ ਫਰਮਾਵਤੇ ਹੋ ਸੋ ਸੋ ਮੈਂ ਕਰਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਗਮ-ਰੂਪ ਸਤਿਗੁਰੂ! ਹੇ ਅਲੱਖ ਹਰੀ-ਰੂਪ ਗੁਰੂ! ਹੇ ਕਾਰਣ ਪੁਰਖ-ਰੂਪ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ! ਜੋ ਤੂੰ ਹੁਕਮ ਕਰਦਾ ਹੈਂ, ਮੈਂ ਸੋਈ ਆਖਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਮ = ਹੇ ਅਗਮ ਹਰੀ-ਰੂਪ ਸਤਿਗੁਰੂ! ਫੁਰਮਾਵਹਿ = ਤੂੰ ਹੁਕਮ ਕਰਦਾ ਹੈਂ। ਕਾਰਣ ਕਰਣ = ਸ੍ਰਿਸ਼ਟੀ ਦਾ ਕਰਤਾ। ਅਗਮ = ਅਪਹੁੰਚ। ਅਲਖ = ਅਲੱਖ, ਜਿਸ ਦਾ ਸਰੂਪ ਦੱਸਿਆ ਨਾਹ ਜਾ ਸਕੇ। ਕਰਣ = ਸ੍ਰਿਸ਼ਟੀ। ਕਾਰਣ = (ਸ੍ਰਿਸ਼ਟੀ ਦਾ) ਮੂਲ। ਪੁਰਖ = ਸਰਬ-ਵਿਆਪਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Guru Amar Das, el Hacedor, la Causa de causas, así como Tú me conservas yo permanezco,"