data = "ਨਾਮ ਤੁਪਕ ਕੇ ਸਭ ਹੀ ਲਹੀਐ ॥੯੫੫॥"
page = 774

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Rain-raajnan”, add the words “Satchar, Pati and Shatru” and in this way know all the names of Tupak.955."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਹੀ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝੋ ॥੯੫੫॥"