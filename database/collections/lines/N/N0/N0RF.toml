[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈ ਜੈ ਕਾਰੁ; ਕਰੈ ਸਭੁ ਲੋਗੁ ॥੨॥"
page = 869
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within the saints mind is the supreme bliss."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜਣੇ ਗੁਰਾਂ ਦੀ ਫਤਹ ਦੇ ਨਾਅਰੇ ਲਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All the people celebrate His victory. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਤੇ ਸਭ ਲੋਗ ਗੁਰੋਂ ਕਾ ਜੈਕਾਰ ਕਹਤੇ ਹੈਂ ਅਰਥਾਤ ਧੰਨਵਾਦ ਕਰਤੇ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਉਸ ਮਨੁੱਖ ਦੀ) ਸਾਰਾ ਜਗਤ ਸਦਾ ਸੋਭਾ ਕਰਦਾ ਹੈ (ਜੋ ਗੁਰੂ ਦੀ ਸਰਨ ਪਿਆ ਰਹਿੰਦਾ ਹੈ) ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੈ ਜੈਕਾਰੁ = (ਹਰ ਵੇਲੇ) ਸੋਭਾ। ਸਭੁ ਲੋਗੁ = ਸਾਰਾ ਜਗਤ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, la Victoria del Guru es aclamada por todos.  (2)"