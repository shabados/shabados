language = "pa"
data = "ਕਿਸੇ ਹੋਰ ਨੂੰ ਆਪਣਾ ਸਮਝਣਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Of the many emotional attachments,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਨ ਬਸਤੂ ਹੈ, ਭਾਵ ਸ੍ਵਰੂਪ ਤੇ ਭਿੰਨ ਦੇਹ ਹੈ, ਤਿਨ ਕੋ ਮੇਰੀ ਹੈ, ਐਸੇ ਮਾਨ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਤੋਂ ਬਿਨਾ) ਹੋਰ ਹੋਰ ਪਦਾਰਥਾਂ ਨੂੰ 'ਮੇਰੇ, ਮੇਰੇ' ਰਟਦਾ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨ ਕਉ = ਹੋਰਨਾਂ (ਪਦਾਰਥਾਂ) ਨੂੰ।"

