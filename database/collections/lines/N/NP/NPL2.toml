[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲੋਕ ਪਚਾਰਾ; ਕਰੈ ਦਿਨੁ ਰਾਤਿ ॥"
page = 267
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He humbugs people day and night."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਦਿਨ ਰਾਤ ਬੰਦਿਆਂ ਨਾਲ ਜਾਹਰਦਾਰੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They curse others day and night."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਲੋਕੋਂ ਕੋ (ਪਚਾਰਾ) ਦਿਖਲਾਵਾ ਦਿਨ ਰਾਤ ਕਰਤਾ ਰਹਿਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਂਞ) ਦਿਨ ਰਾਤ ਲੋਕਾਂ ਵਾਸਤੇ ਵਿਖਾਵਾ ਕਰ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਚਾਰਾ = (Skt. ऊपचार) ਵਿਖਾਵਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero con frecuencia se comporta de manera absurda."