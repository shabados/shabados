data = "ਨਿਜੁ ਪਤਿ ਲੈ ਪੁਰਵਾ ਕਹ ਗਈ ॥੭॥"
page = 888

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She did not care far any body, took her husband and brought him home.(7)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੇ ਪਤੀ ਨੂੰ ਲੈ ਕੇ ਨਗਰ ਵਿਚ ਵਾਪਸ ਆ ਗਈ ॥੭॥"