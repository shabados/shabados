[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਤਿ ਚਿਤ ਚਿਰਤ ॥੨੪੦॥"
page = 575

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Holding their swords in fury, the warriors are fighting and fighting with the strength of their mind, they are not moving back.240."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਚਿਤ ਵਿਚ ਬਹੁਤ ਖਿਝਦੇ (ਚਿੜ੍ਹਦੇ) ਹਨ ॥੨੪੦॥"