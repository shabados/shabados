[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਘਰ ਹੀ ਵਿਚਿ ਉਦਾਸੁ; ਸਚੁ ਸੁਚੇਉ ਹੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Being indifferent to household (pleasures) they are truth-oriented."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਘਰ ਹੀ ਵਿਖੇ (ਭਾਵ ਗ੍ਰਿਹਸਥ ਵਿਖੇ) ਉਦਾਸ ਤੇ (ਮਨੋਂ ਤਨੋਂ) ਸੱਚੇ ਤੇ ਸੁੱਚੇ ਹਨ।"