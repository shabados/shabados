[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਬ ਰਾਕਸ ਮਾਰਨ ਕੀ ਸੁ ਕਥਾ; ਕਛੁ ਥੋਰੀ ਅਹੈ, ਸੁਨ ਲੇਹੁ ਅਬੈ ॥੬੪੫॥"
page = 358

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Now listen to the short story about the killing of the demon.645."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੁਣ (ਇਕ) ਰਾਖਸ਼ ਨੂੰ ਮਾਰਨ ਦੀ ਕੁਝ ਕੁ ਥੋੜੀ ਜਿੰਨੀ ਕਥਾ ਹੈ, ਉਹ ਵੀ ਸੁਣ ਲਵੋ ॥੬੪੫॥"