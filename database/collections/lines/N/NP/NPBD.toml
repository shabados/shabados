[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਜੋ ਤਿਸੁ ਭਾਵੈ ਸੋ ਥੀਐ; ਇਨਾ ਜੰਤਾ. ਵਸਿ ਕਿਛੁ ਨਾਹਿ ॥੮॥੪॥"
page = 55
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak whatever pleases Him, that come to pass. Nothing is in the power of these creatures."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਜੋ ਕੁਝ ਉਸ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ, ਉਹੀ ਹੁੰਦਾ ਹੈ। ਇਨ੍ਹਾਂ ਜੀਵਾਂ ਦੇ ਅਖ਼ਤਿਆਰ ਵਿੱਚ ਕੁਝ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, whatever pleases His Will comes to pass. Nothing is in the hands of these beings. ||8||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਭਾਈ! ਜੋ ਤਿਸੁ ਪਰਮੇਸ੍ਵਰ ਕੋ ਭਾਵਤਾ ਹੈ, ਸੋਈ ਹੋਤਾ ਹੈ, ਇਨ ਜੀਵੋਂ ਕੇ ਵਸ ਕਿਛੂ ਨਹੀਂ ਹੈ॥੮॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹੀ ਕੁਝ ਹੁੰਦਾ ਹੈ ਜੋ ਉਸ ਪਰਮਾਤਮਾ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ, ਇਹਨਾਂ ਜੀਵਾਂ ਦੇ ਵੱਸ ਵਿਚ ਕੁਝ ਨਹੀਂ ॥੮॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, sólo pasa lo que Él desea, pues nada está en las manos del hombre. (8-4)"