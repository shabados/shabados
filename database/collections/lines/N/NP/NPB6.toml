[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੁ ਹਰਿ ਨਾਮੁ; ਸਚੁ ਹੈ ਸਰਣਾ ॥"
page = 1040
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is the Lord's Name and true His refuge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚਾ ਹੈ ਸਾਹਿਬ ਦਾ ਨਾਮ ਅਤੇ ਸੱਚੀ ਉਸ ਦੀ ਸ਼ਰਣਾਗਤ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True is the Lord's Name, and True is His Sanctuary."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਹਰੀ ਕਾ ਨਾਮ ਹੈ ਔ ਸਚ ਹਰੀ ਕੀ ਸਰਣ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਹੈ, ਉਸ ਦਾ ਆਸਰਾ-ਪਰਨਾ ਭੀ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੁ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Verdad es el Nombre del Señor, Verdad es Su Refugio, aferrándose al Ser con el Cual uno nada a través"