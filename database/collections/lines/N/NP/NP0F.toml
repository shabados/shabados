[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਮਲ; ਜਪਿ ਨਾਮੁ ਹਰਿ ਹਰਿ ॥"
page = 895
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remember thou the pure Name of the Lord God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦੇ ਪਵਿੱਤਰ ਨਾਮ ਦਾ ਭਜਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chant the Immaculate Name of the Lord, Har, Har."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਨਿਰਮਲ ਜੋ ਹਰੀ ਹਰਿ ਨਾਮ ਹੈ ਤਿਸ ਕੋ ਜਪ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਪਵਿੱਤਰ ਨਾਮ ਸਦਾ ਜਪਦਾ ਰਹੁ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entona el Nombre Inmaculado de tu Señor, Jar, Jar."