[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਗਤ ਪਾਸ ਤੇ; ਲੇਤੇ ਦਾਨੁ ॥"
page = 865
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They exact tribute from the world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰ ਪਾਸੋਂ ਉਹ ਖਿਰਾਜ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They collect taxes from the world,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਜਗਤ ਹੈ ਤਿਸ ਸੇ ਵਹੁ (ਦਾਨੁ) ਡੰਨ ਲੇਤੇ ਹੈਂ, ਭਾਵ ਸੁਭ ਗੁਨੋਂ ਕੋ ਖੋਸ ਲੇਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਇਹ ਪੰਜ ਚੌਧਰੀ ਦੁਨੀਆ (ਦੇ ਲੋਕਾਂ) ਪਾਸੋਂ ਡੰਨ ਲੈਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਸ ਤੇ = ਪਾਸ ਤੋਂ, ਪਾਸੋਂ। ਦਾਨੁ = ਡੰਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ellos ponen sus demandas en el mundo entero,"