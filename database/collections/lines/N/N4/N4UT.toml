[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਗੁਰ ਊਪਰਿ; ਸਦਾ ਹਉ ਵਾਰਿਆ ॥੩॥"
page = 1338
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto that Guru, I am ever a sacrifice."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਗੁਰਦੇਵ ਜੀ ਦੇ ਉਤੋਂ ਮੈਂ ਹਮੇਸ਼ਾਂ ਹੀ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am forever a sacrifice to that Guru. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸਤਿਗੁਰ ਕੇ ਊਪਰ ਮੈਂ ਸਦਾ ਅਪਨਾ ਤਨੁ ਮਨੁ ਵਾਰਿਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਸ ਗੁਰੂ ਤੋਂ ਸਦਾ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਹਉਂ, ਮੈਂ। ਵਾਰਿਆ = ਕੁਰਬਾਨ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "yo ofrezco mi ser en sacrificio a ese Guru. (3)"