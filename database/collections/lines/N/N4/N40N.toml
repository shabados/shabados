type = "primary"
data = "ਨਾਤਰ ਧਰੋ ਦੁਜਨਵਾ ਤੋਹੂ ॥"
page = 152

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O thou shalt be considered like them"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਹੀਂ ਤਾਂ ਤੁਹਾਨੂੰ ਵੀ ਉਨ੍ਹਾਂ ਦੋਹਾਂ ਨਾਲ ਮਿਲਾ ਦੇਵਾਂਗੇ (ਮਾਰ ਦੇਵਾਂਗੇ)।"