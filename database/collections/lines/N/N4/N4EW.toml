data = "ਜਬ ਚਾਹਤ ਤਬ ਦੇਤ ਉਠਾਈ ॥"
page = 867

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Rani took total control of the Raja as she had won him through charms and incantations."

