[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇਤੇ ਸਾਸ ਗ੍ਰਾਸ ਮਨੁ ਲੇਤਾ; ਤੇਤੇ ਹੀ ਗੁਨ ਗਾਈਐ ॥"
page = 213
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As many breaths and morsels dost thou take, O may soul, so many times dost thou sing Lord's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿੰਨ੍ਹੇ ਸੁਆਸ ਤੇ ਗ੍ਰਾਹੀਆਂ ਤੂੰ ਲੈਂਦੀ ਹੈ ਮੇਰੀ ਹੈ, ਜਿੰਦੜੀਏ! ਓਨੀ ਵਾਰੀ ਹੀ ਤੂੰ ਪ੍ਰਭੂ ਦੀ ਉਸਤਤੀ ਗਾਇਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As many breaths and morsels as you take, O my mind - so many times, sing His Glorious Praises."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਜਿਤਨੇ ਸਾਸ ਗ੍ਰਾਸ ਤੂੰ ਲੇਤਾ ਹੈਂ ਤੇਤੇ ਹੀ ਗੁਣ ਗਾਵਤੇ ਰਹੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜੀਵ ਜਿਤਨੇ ਭੀ ਸਾਹ ਲੈਂਦਾ ਹੈ ਜਿਤਨੀਆਂ ਹੀ ਗ੍ਰਾਹੀਆਂ ਖਾਂਦਾ ਹੈ (ਹਰੇਕ ਸਾਹ ਤੇ ਗ੍ਰਾਹੀ ਦੇ ਨਾਲ ਨਾਲ) ਉਤਨੇ ਹੀ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦਾ ਰਹੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੇਤੇ = ਜਿਤਨੇ। ਸਾਸ = ਸਾਹ। ਗ੍ਰਾਸ = ਗ੍ਰਾਹੀਆਂ। ਮਨੁ = (ਭਾਵ,) ਜੀਵ {ਲਫ਼ਜ਼ 'ਮਨ' ਅਤੇ 'ਮਨੁ' ਦਾ ਫ਼ਰਕ ਚੇਤੇ ਰਹੇ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuantas veces uno respire y cuantas veces uno coma, uno debería de alabar al Señor."