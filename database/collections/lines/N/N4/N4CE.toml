[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਗੈ; ਦਰਗਹ ਪਾਵਉ ਥਾਉ ॥"
page = 893
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "hereafter, I shall obtain a seat in the Lord's court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਅੱਗੇ, ਸਾਹਿਬ ਦੇ ਦਰਬਾਰ ਅੰਦਰ ਮੈਨੂੰ ਟਿਕਾਣਾ ਮਿਲ ਜਾਊਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Hereafter, I shall obtain a seat in the Court of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਗੇ ਦਰਗਾਹਿ ਮੇਂ ਥਾਉਂ ਪਾਵੋਗੇ, ਭਾਵ ਪਰਲੋਕ ਮੇਂ ਤੁਮਾਰਾ ਆਦਰ ਹੋਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇ ਇਸ ਤਰ੍ਹਾਂ) ਪਰਲੋਕ ਵਿਚ ਤੇਰੀ ਹਜ਼ੂਰੀ ਵਿਚ ਥਾਂ ਪ੍ਰਾਪਤ ਕਰ ਲਵਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਗੈ = ਪਰਲੋਕ ਵਿਚ। ਪਾਵਉ = ਪਾਵਉਂ, ਮੈਂ ਹਾਸਲ ਕਰ ਲਵਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues al final encontraré un asiento en Su Corte."