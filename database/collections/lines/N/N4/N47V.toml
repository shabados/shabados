[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਬ ਘੇਰਿ ਲਈ ਚਹੂੰ ਓਰ ਤੇ ਦੈਤਨ; ਇਉ ਉਪਮਾ ਉਪਜੀ ਮਨ ਮੈ ॥"
page = 79

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the demons besieged the goddess from all the four sides, the poet felt like this in his mind,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ (ਦੇਵੀ ਨੂੰ) ਦੈਂਤਾਂ ਨੇ ਚੌਹਾਂ ਪਾਸਿਆਂ ਤੋਂ ਘੇਰ ਲਿਆ।"