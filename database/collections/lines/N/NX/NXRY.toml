[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਸਮ ਕਥਾ ਭਾਗੌਤ ਕੀ; ਭਾਖਾ ਕਰੀ ਬਨਾਇ ॥"
page = 550

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I have composed the discourse of the tenth part (Skandh) of Bhagavat in the vernacular"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਭਾਗਵਤ (ਪੁਰਾਣ) ਦੇ ਦਸਮ (ਸਕੰਧ) ਦੀ ਕਥਾ (ਮੈਂ) ਭਾਖਾ ਵਿਚ ਰਖੀ ਹੈ।"