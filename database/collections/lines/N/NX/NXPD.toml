[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਮਾਥਾ; ਸੰਤ ਚਰਨ ॥੪॥੨॥"
page = 986
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak places his forehead on the saints' feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਪਣਾ ਮੱਥਾ ਸਾਧੂਆ ਦੇ ਪੈਰਾ ਉਤੇ ਰਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak lays his forehead on the feet of the Saints. ||4||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਵਾਹਿਗੁਰੂ ਇਹੁ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਸੰਤੋਂ ਕੇ ਚਰਨੋਂ ਪਰ ਮੇਰਾ (ਮਾਥਾ) ਸੀਸ ਸਦੀਵ ਪੜਾ ਰਹੇ॥੪॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਦਾ ਮੱਥਾ ਸੰਤਾਂ ਦੇ ਚਰਨਾਂ ਉਤੇ ਪਿਆ ਹੈ ॥੪॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤ ਚਰਨ = ਸੰਤਾਂ ਦੇ ਚਰਨਾਂ ਉਤੇ। ਨਾਨਕ ਮਾਥਾ = ਨਾਨਕ ਦਾ ਮੱਥਾ ॥੪॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "postro mi frente a Sus Pies.(4-2)"