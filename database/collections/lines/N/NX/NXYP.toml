[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਅੰਮ੍ਰਿਤੁ ਏਕੁ ਹੈ; ਦੂਜਾ ਅੰਮ੍ਰਿਤੁ ਨਾਹਿ ॥"
page = 1238
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, there is but one Name-Nectar. Any other Nectar there is not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਕੇਵਲ ਇਕ ਹੀ ਨਾਮ-ਸੁਧਾਰਸ ਹੈ ਕੋਈ ਹੋਰ ਸੁਧਾਰਸ ਹੈ ਹੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, there is only One Ambrosial Nectar; there is no other nectar at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਏਕ ਆਤਮਾ ਅਨੰਦ ਹੀ ਅੰਮ੍ਰਿਤ ਹੈ ਦੂਸਰਾ ਸ੍ਵਰਗਾਦਿਕੋਂ ਕਾ ਅੰਮ੍ਰਿਤ ਸਤ੍ਯ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਉਹਨਾਂ ਲਈ) ਇਕ ਨਾਮ ਹੀ ਅੰਮ੍ਰਿਤ ਹੈ ਹੋਰ ਕਿਸੇ ਚੀਜ਼ ਨੂੰ ਉਹ ਅੰਮ੍ਰਿਤ ਨਹੀਂ ਮੰਨਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਮ੍ਰਿਤੁ = ਅਮਰ ਕਰਨ ਵਾਲਾ ਜਲ, ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, hay sólo un Elixir, el Nombre, sí, y no hay ningún otro."