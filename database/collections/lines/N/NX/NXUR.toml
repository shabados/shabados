data = "ਜਦੁਪਤਿ ਮੋਹਿ ਸਨਾਥ ਕੀਯੋ ॥"
page = 455

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘O the Lord of Yadavas! you have given me your support"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਨੇ ਮੈਨੂੰ ਸਨਾਥ ਕੀਤਾ ਹੈ।"