[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਜਾ ਨਿਆਉ ਕਰੇ; ਹਥਿ ਹੋਇ ॥"
page = 350
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The King administers justice only if his palm is greased,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਤਿਸ਼ਾਹ ਓਦੋ ਇਨਸਾਫ ਕਰਦਾ ਹੈ, ਜਦ ਉਸਦੀ ਤਲੀ ਤੇ ਕੁਛ ਧਰ ਦਿੱਤਾ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The king administers justice only if his palm is greased."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਜਾ ਭੀ ਕਲਿ ਕਾ ਨ੍ਯਾਉ ਉਸ ਕਾ ਕਰਤਾ ਹੈ ਜਿਸ (ਹਥਿ), ਭਾਵ ਪਾਸ ਪਦਾਰਥ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਥੋਂ ਤਕ ਕਿ) ਰਾਜਾ ਭੀ (ਹਾਕਮ ਭੀ) ਤਦੋਂ ਹੀ ਇਨਸਾਫ਼ ਕਰਦਾ ਹੈ ਜੇ ਉਸ ਨੂੰ ਦੇਣ ਲਈ (ਸਵਾਲੀ ਦੇ) ਹੱਥ ਪੱਲੇ ਮਾਇਆ ਹੋਵੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਆਉ = ਇਨਸਾਫ਼। ਹਥਿ ਹੋਇ = ਹੱਥ ਵਿਚ ਹੋਵੇ, ਕੁਝ ਦੇਣ ਨੂੰ ਪੱਲੇ ਹੋਵੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El rey administra justicia sólo si la palma de su mano es engrasada,"