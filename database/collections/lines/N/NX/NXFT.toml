[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤ ਜਨਾ ਕਉ ਰਾਖਦਾ; ਆਪਣੀ ਕਿਰਪਾ ਧਾਰਿ ॥"
page = 46
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Showering His benediction, the Lord protects the pious person."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਦਇਆ ਕਰਕੇ ਸੁਆਮੀ ਪਵਿੱਤ੍ਰ ਪੁਰਸ਼ਾਂ ਦੀ ਰਖਿਆ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His humble devotees are protected and saved; He Himself showers His Blessings upon us."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਮੇਸ੍ਵਰ ਅਪਣੀ ਕਿਰਪਾ ਧਾਰਿ ਕਰ ਕੇ ਭਗਤ ਜਨੋਂ ਕੀ ਰਖਿਆ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਕਿਰਪਾ ਕਰ ਕੇ ਪਰਮਾਤਮਾ ਆਪਣੇ ਭਗਤਾਂ ਨੂੰ (ਕਾਮ ਕ੍ਰੋਧ ਲੋਭ ਆਦਿ ਵਿਕਾਰਾਂ ਤੋਂ) ਬਚਾ ਕੇ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਧਾਰਿ = ਧਾਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por Su Gracia Él protege a sus Devotos."