[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੀਠੀ ਕਰਿ ਕਰਿ; ਬਿਖਿਆ ਖਾਇ ॥੨॥"
page = 178
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Deeming it as sweet, he eats poison."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਨੂੰ ਮਿੱਠੀ ਜਾਣ ਕੇ ਉਹ ਜ਼ਹਿਰ ਨੂੰ ਖਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Believing it to be sweet, the fools eat poison. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਮੀਠੀ) ਸੁਖ ਰੂਪ ਜਾਨ ਕਰ ਕੇ ਬਿਖੈ ਰੂਪ ਬਿਖ ਕੋ ਭੋਗਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੂਰਖ ਮਨੁੱਖ (ਆਤਮਕ ਮੌਤ ਲਿਆਉਣ ਵਾਲੀ) ਮਾਇਆ (-ਜ਼ਹਰ) ਮਿੱਠੀ ਜਾਣ ਜਾਣ ਕੇ ਖਾਂਦਾ ਰਹਿੰਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਖਿਆ = ਮਾਇਆ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero, para él, el veneno sabe dulce.(2)"