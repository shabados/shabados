[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਬ ਤੇ ਦੂਖ; ਡੰਡ ਅਰੁ ਖੇਦਾ ॥"
page = 235
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "since then he suffers pain, punishment and affliction."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਦੋਂ ਤੋਂ ਉਹ ਤਕਲਫ਼ਿ ਸਜ਼ਾ ਅਤੇ ਅਪਦਾ ਸਹਾਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then he suffers pain, punishment and sorrow."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਸੇ ਇਸ ਕੋ ਜਮੋਂ ਕਾ ਡੰਡ ਔਰ ਤਨ ਮਨ ਕਰ ਖੇਦ ਪ੍ਰਾਪਤਿ ਹੂਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦ ਤਕ ਇਸ ਦੀ ਆਤਮਾ ਨੂੰ ਦੁੱਖਾਂ-ਕਲੇਸ਼ਾਂ ਦੀਆਂ ਸਜ਼ਾਵਾਂ ਮਿਲਦੀਆਂ ਰਹਿੰਦੀਆਂ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਰੁ = ਅਤੇ {ਲਫ਼ਜ਼ 'ਅਰੁ' ਅਤੇ 'ਅਰਿ'}। ਖੇਦਾ = ਕਸ਼ਟ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sufre dolor y vive en la tristeza,"