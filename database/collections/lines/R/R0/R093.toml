[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੇ ਭਗਤਿ ਭਰੇ ਭੰਡਾਰਾ ॥"
page = 1052
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's treasure are brimful with devotion,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਖ਼ਜ਼ਾਨੇ, ਸ਼ਰਧਾ ਪ੍ਰੇਮ ਨਾਲ ਪਰੀਪੂਰਨ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Devotion to the Lord is a treasure overflowing."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਵਹੁ ਤੇਰੇ ਭਗਤੀ ਕੇ ਭੰਡਾਰੇ ਭਰੇ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਦੇ ਖ਼ਜ਼ਾਨੇ ਵਿਚ ਭਗਤੀ ਦੇ ਭੰਡਾਰੇ ਭਰੇ ਪਏ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੰਡਾਰਾ = ਖ਼ਜ਼ਾਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, de Tu Tesoro se desborda Devoción"