[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਹਰਿ ਸਿਉ; ਰਹੈ ਸਮਾਇ ॥੬॥੨੩॥"
page = 356
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The man then, remains blended with God, `Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਨਸਾਨ ਵਾਹਿਗੁਰੂ ਨਾਲ ਅਭੇਦ ਹੋਇਆ ਰਹਿੰਦਾ ਹੈ, ਹੇ ਨਾਨਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, then one remains merged in the Lord. ||6||23||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਬ ਹਰੀ ਮੇਂ (ਸਮਾਇ) ਅਭੇਦ ਹੋ ਰਹਤਾ ਹੈ॥੬॥੨੩॥☬ਸਨਮੁਖ ਬੇਨਤੀ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਸਦਾ ਪਰਮਾਤਮਾ (ਦੀ ਯਾਦ) ਵਿਚ ਲੀਨ ਰਹਿੰਦਾ ਹੈ ॥੬॥੨੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਹੈ ਸਮਾਇ = ਲੀਨ ਹੋਇਆ ਰਹਿੰਦਾ ਹੈ ॥੬॥੨੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y uno se funde en el Mismo Señor. (6-23)"