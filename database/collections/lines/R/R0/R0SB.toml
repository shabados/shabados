[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਰਖ਼ਸ਼ ਅੰਦਰ ਆਮਦ ਚੁ ਤੇਗ਼ੋ ਨਿਹੰਗ ॥੧੨੨॥"
page = 1422

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The swords of the warriors were striking sparklingly.(122)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸੇ ਤਰ੍ਹਾਂ ਸੂਰਮਿਆਂ ਦੀਆਂ ਤਲਵਾਰਾਂ ਚਮਕ ਰਹੀਆਂ ਸਨ ॥੧੨੨॥"