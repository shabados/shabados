[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨੁ ਲੋਕਾਂ; ਤਨੁ ਭਸਮੈ ਢੇਰੀ ॥"
page = 832
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ultimately his wealth passes on to other persons and his body becomes a heap of ashes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਓੜਕ ਨੂੰ ਉਸ ਦੀ ਦੌਲਤ ਹੋਰਨਾਂ ਪੁਰਸ਼ਾਂ ਕੋਲ ਚਲੀ ਜਾਂਦੀ ਹੈ। ਉਸ ਦੀ ਦੇਹ ਸੁਆਹ ਦਾ ਅੰਬਾਰ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But his wealth will pass on to other people, and his body will be reduced to ashes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅੰਤ ਕੋ ਧਨ ਲੋਕੋਂ ਕਾ ਹੋ ਜਾਏਗਾ ਔ (ਤਨੁ) ਸਰੀਰ ਭਸਮ ਕੀ ਢੇਰੀ ਹੋਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਮੌਤ ਆਉਣ ਤੇ) ਧਨ (ਹੋਰ) ਲੋਕਾਂ ਦਾ ਬਣ ਜਾਂਦਾ ਹੈ ਤੇ ਇਹ ਸਰੀਰ ਮਿੱਟੀ ਦੀ ਢੇਰੀ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਸਮੈ = ਸੁਆਹ ਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero nuestras riquezas son expropiadas por otros, y el cuerpo regresa al polvo."