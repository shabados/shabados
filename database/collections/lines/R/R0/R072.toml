[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਲ ਪੁਰਖ ਤਬ ਹੋਤ ਕ੍ਰਿਪਾਰਾ ॥੨॥"
page = 190

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then the earth, pressed under the load of sins, calls for help, and then the destroyer Lord becomes kind.2."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ 'ਕਾਲ ਪੁਰਖ' ਧਰਤੀ ਉਤੇ ਕ੍ਰਿਪਾਲੂ ਹੁੰਦੇ ਹਨ ॥੨॥"