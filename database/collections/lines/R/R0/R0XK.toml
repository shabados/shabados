[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿ ਸਤਿ; ਸਤਿ ਪ੍ਰਭੁ ਜਾਤਾ ॥"
page = 1072
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True, true, true, I know my Lord to be."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਸੁਆਮੀ ਨੂੰ ਸੱਚਾ, ਸੱਚਾ ਸੱਚਾ ਜਾਣਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True, True, True is God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਤ ਸਰੂਪ ਪ੍ਰਭੂ! ਮੈਨੇ ਨਿਹਚੇ ਕਰਤੇ ਤੇਰੇ ਕੋ ਹੀ ਸਤ ਜਾਣਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਪਰਮਾਤਮਾ ਨੂੰ ਸਦਾ-ਥਿਰ ਸਦਾ-ਥਿਰ ਜਾਣ ਲਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Verdad, Verdad, siempre Verdad es Él, nuestro Dios,"