[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪੂਰਾ ਪੂਰੇ ਵਟਿ; ਕਿ ਆਖਿ ਸਲਾਹੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "How to praise Him? The measuring criteria of the perfect Lord are perfect."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ (ਸੰਤਾਂ) ਦਾ (ਵਿਚਾਰ ਰੂਪ) ਵੱਟ ਪੂਰਾ ਹੈ, ਕੀ ਕਹਿਕੇ ਸਲਾਹੀਏ।"