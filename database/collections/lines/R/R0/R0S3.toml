[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਖਿੰਜੋਤਾਣੁ, ਕਰੇਨਿ ਧਿਙਾਣਾ ॥੧੦॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They both have in vain created many tensions."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(੯) (ਗੱਲ ਕੀ ਆਪੋ ਆਪਣੇ ਪਾਸੇ) ਧਿੰਗਾ ਸ਼ਾਹੀ ਨਾਲ ਖਿੱਚਾ ਖਿੱਚੀ ਕਰ ਰਹੇ ਹਨ।"