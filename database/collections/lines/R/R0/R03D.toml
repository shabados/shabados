[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਖਿ ਕੈ ਜਲ ਕੋ ਸੰਗ ਗੋਪਿਨ ਕੇ; ਭਗਵਾਨ ਮਹਾ ਉਪਹਾਸ ਕਰੇ ॥"
page = 344

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On seeing the gopis and the water (of Yamuna), Krishna laughed heartily"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਲ ਨੂੰ ਤਰਨ ਉਪਰੰਤ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਨੇ ਗੋਪੀਆਂ ਨਾਲ ਬਹੁਤ ਠੱਠਾ ਮਖ਼ੌਲ ਕੀਤਾ।"