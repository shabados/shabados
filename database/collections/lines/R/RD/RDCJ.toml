[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਲਤਿ ਪਲਤਿ; ਤੇਰਾ ਊਜਲ ਮੁਖਾ ॥੩॥"
page = 896
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and here and hereafter thy face shall become bright."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਐਥੇ ਤੇ ਓਥੇ ਤੇਰਾ ਚਿਹਰਾ ਕੀਰਤੀਮਾਨ ਹੋ ਜਾਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Here and hereafter, your face shall be radiant and bright. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਲੋਕ ਪ੍ਰਲੋਕ ਮੇਂ ਤੇਰਾ ਮੁਖੁ ਉਜਲਾ ਹੋਵੈ, ਸੋ ਸਿਮਰੁ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਲੋਕ ਵਿਚ ਅਤੇ ਪਰਲੋਕ ਵਿਚ ਤੇਰਾ ਮੂੰਹ ਉਜਲਾ ਰਹੇਗਾ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਲਤਿ = ਇਸ ਲੋਕ ਵਿਚ। ਪਲਤਿ = ਪਰਲੋਕ ਵਿਚ। ਊਜਲ = ਸਾਫ਼, ਬੇ-ਦਾਗ਼। ਮੁਖਾ = ਮੂੰਹ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y entonces aquí y en el más allá es santificado.(3)"