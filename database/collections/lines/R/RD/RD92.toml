data = "ਸਲ ਜਰਾ ਜੋਰ ਮਹਾਨ ॥"
page = 709

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That pyre continued to burn for several years, when the body of the king was reduced to ashes"

