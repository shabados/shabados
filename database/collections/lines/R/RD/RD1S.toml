[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰੂ ਸਤਿਗੁਰੂ; ਸਤਿਗੁਰੁ ਗੁਬਿੰਦ ਜੀਉ ॥"
page = 1403
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Guru, True Guru, True Guru is the embodiment of the Sire Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰੂ ਜੀ, ਸੱਚੇ ਗੁਰੂ ਜੀ, ਸੱਚੇ ਗੁਰੂ ਜੀ ਮਹਾਰਾਜ ਸੁਆਮੀ ਦੇ ਸਰੂਪ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Guru, the True Guru, the True Guru is the Lord of the Universe Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸ੍ਰੀ ਸਤਿਗੁਰੂ! ਆਪ ਤੀਨੋਂ ਕਾਲੋਂ ਮੇਂ ਗੋਬਿੰਦ ਸਰੂਪ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਗੋਬਿੰਦ-ਰੂਪ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru Verdadero, el Guru Verdadero, el Guru Verdadero es Él Mismo,"