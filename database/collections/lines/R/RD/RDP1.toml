[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੰਚ ਤਤੁ ਮਿਲਿ; ਇਹੁ ਤਨੁ ਕੀਆ ॥"
page = 1039
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Uniting the five elements together this body is made."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੰਜਾਂ ਮੂਲ ਅੰਸ਼ਾਂ ਨੂੰ ਇਕੱਠਾ ਕਰਕੇ ਇਹ ਦੇਹ ਬਣਾਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "From the union of the five elements, this body was made."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੰਜਾਂ ਤਤਾ ਕੋ ਮਿਲਾਇਕੇ ਤੈਨੇ ਇਹ ਤਨ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਰਬ-ਵਿਆਪਕ ਪਰਮਾਤਮਾ ਦੀ ਰਜ਼ਾ ਵਿਚ) ਪੰਜਾਂ ਤੱਤਾਂ ਨੇ ਮਿਲ ਕੇ ਇਹ (ਮਨੁੱਖਾ) ਸਰੀਰ ਬਣਾਇਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਨੁ = ਸਰੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De cinco elementos este cuerpo fue creado,"