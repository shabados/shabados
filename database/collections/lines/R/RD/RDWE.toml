[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਡਭਾਗੀਆ; ਵਾਹੁ ਵਾਹੁ ਮੁਹਹੁ ਕਢਾਈ ॥"
page = 514
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Very fortunate are they who with their mouth utter the Lord's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਰੇ ਨਸੀਬਾਂ ਵਾਲੇ ਹਨ ਉਹ, ਜੋ ਆਪਣੇ ਮੂੰਹ ਨਾਲ ਸੁਆਮੀ ਦਾ ਜੱਸ ਉਚਾਰਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How very fortunate are those, who with their mouths, chant Waaho! Waaho!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵੱਡੇ ਭਾਗੋਂ ਵਾਲੋਂ ਕੇ ਮੁਖ ਸੇ ਸਤਿਗੁਰੂ ਵਾਹੁ ਵਾਹੁ ਕਹਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵੱਡੇ ਭਾਗਾਂ ਵਾਲਿਆਂ ਦੇ ਮੂੰਹ ਵਿਚੋਂ ਪ੍ਰਭੂ 'ਵਾਹੁ ਵਾਹੁ' ਅਖਵਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Afortunados son aquéllos que alaban al Señor, y se ven bellos y el mundo entero los aclama."