[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧ ਤੇਰੇ ਕੀ; ਚਰਨੀ ਪਾਉ ॥"
page = 283
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "May I fall at the feet of Thine saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਸੰਤਾਂ ਦੇ ਪੈਰੀ ਢਹਿ ਪਵਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "To fall at the Feet of Your Holy Beings"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੇ ਸੰਤੋਂ ਕੀ ਚਰਨੀ ਪਵੋਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੇ ਸਾਧਾਂ ਦੀ ਚਰਨੀਂ ਪਵਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਉ = ਮੈਂ ਪਵਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Servir a los Pies de Sus Santos,"