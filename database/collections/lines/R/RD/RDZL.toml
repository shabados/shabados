data = "ਸੁਗਤੰ ਗੰਤਾ ॥੪੨੧॥"
page = 669

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "These vow-observing Yogis of good conduct and sinless Karmas had given up all evil actions.421."

