data = "ਸਭੈ ਚਿਤ ਕੇ ਦੂਰਿ ਕੈ ਸੋਕ ਡਾਰੈ ॥੧੩॥"
page = 830

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "We eliminate all our tribulations.’(13)"

