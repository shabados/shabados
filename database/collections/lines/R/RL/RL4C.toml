[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਨ ਲਾਲ ਗਾਵਉ; ਗੁਰ ਦੇਖੇ ॥"
page = 1230
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Seeing the vision of my Guru, I sing the praises of my love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਗੁਰਾਂ ਦਾ ਦਰਸ਼ਨ ਵੇਖਣ ਦੁਆਰਾ, ਮੈਂ ਆਪਣੇ ਪਿਆਰੇ ਦੀਆਂ ਸਿਫਤਾਂ ਗਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Gazing upon my Guru, I sing the Praises of my Beloved Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰੋਂ ਕੋ ਦੇਖ ਕਰ ਕੇ (ਲਾਲ) ਪਰਮੇਸ਼੍ਵਰ ਕੇ ਗੁਣੋਂ ਕੋ ਗਾਵਣ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਗੁਰੂ ਦਾ ਦਰਸਨ ਕਰ ਕੇ ਮੈਂ ਸੋਹਣੇ ਹਰੀ ਦੇ ਗੁਣ ਗਾਂਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਨ ਲਾਲ = ਸੋਹਣੇ ਪ੍ਰਭੂ ਦੇ ਗੁਣ। ਗਾਵਉ = ਗਾਵਉਂ, ਮੈਂ ਗਾਂਦਾ ਹਾਂ। ਗੁਰ ਦੇਖੇ = ਗੁਰ ਦੇਖਿ, ਗੁਰੂ ਦਾ ਦਰਸਨ ਕਰਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando tengo la Visión del Guru, comienzo a recitar la Alabanza del Señor,"