[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਪੂਰੈ. ਪੂਰਾ ਭਇਆ; ਜਪਿ ਨਾਨਕ ਸਚਾ ਸੋਇ ॥੪॥੯॥੭੯॥"
page = 45
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the accomplished Guru the mortal becomes perfect by meditating on that True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਾਮਲ ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਉਸ ਸੱਚੇ ਸਾਹਿਬ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ ਪ੍ਰਾਨੀ ਪੂਰਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Perfect Guru, one becomes perfect; O Nanak, meditate on the True One. ||4||9||79||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਪੂਰਨ ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਜਿਨੋਂ ਨੇ ਸਚੇ ਨਾਮ ਕੋ ਜਪਿਆ ਹੈ, ਤਿਨ ਕੋ ਸੋ ਪੂਰਾ ਪਰਮੇਸ੍ਵਰ ਪ੍ਰਾਪਤਿ ਭਯਾ ਹੈ॥੪॥੯॥੭੯॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜੇਹੜਾ ਮਨੁੱਖ ਪੂਰੇ ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਉਸ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਨੂੰ ਸਿਮਰਦਾ ਹੈ, ਉਹ (ਸਭ ਗੁਣਾਂ ਨਾਲ) ਮੁਕੰਮਲ ਹੋ ਜਾਂਦਾ ਹੈ ॥੪॥੯॥੭੯॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਦੀ ਰਾਹੀਂ। ਸਚਾ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਪ੍ਰਭੂ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Contemplando al Uno Verdadero, a través del Guru Perfecto, oh, dice Nanak, uno se vuelve Perfecto también. (4-9-79)"