[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜਿਉ ਚਕਚੂੰਧਰ ਸਪ ਦੀ; ਅੰਨ੍ਹਾ ਕੋੜ੍ਹੀ ਕਰਿ ਦਿਖਲਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Mole caught by snake makes it blind or leper."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜਿੱਕੁਰ ਸੱਪ ਨੂੰ ਕੋੜ ਕਿਰਲੀ (ਖਾਧਿਆਂ) ਕੋੜ੍ਹੀ ਤੇ (ਛੱਡਿਆਂ ਸੱਪ ਨੂੰ) ਅੰਨ੍ਹਾ ਕਰ ਕੇ ਦੱਸਦੀ ਹੈ।"