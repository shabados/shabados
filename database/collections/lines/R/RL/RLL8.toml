[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕਾ ਸਬਦੁ; ਭਇਓ ਸਾਖੀ ॥"
page = 622
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru's world has become manifest unto me,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਬਾਣੀ ਮੇਰੇ ਤੇ ਪ੍ਰਗਟ ਹੋਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Word of the Guru's Shabad has become manifest,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕਾ ਉਪਦੇਸ਼ ਜੋ ਹਮਾਰਾ ਸਾਖੀ ਦੇਣੇ ਵਾਲਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਜਿਸ ਮਨੁੱਖ ਦੇ ਅੰਦਰ) ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਨੇ ਆਪਣਾ ਪ੍ਰਭਾਵ ਪਾਇਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਖੀ = ਸਾਖਿਆਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y La Gloria de la Palabra del Shabd del Guru se volvió manifiesta."