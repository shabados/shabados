[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕੁ ਬੋਲੈ ਅੰਮ੍ਰਿਤ ਬਾਣੀ ॥"
page = 877
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak utters the Nectareal-Gurbani."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਅੰਮ੍ਰਿਤ-ਰੂਪੀ ਗੁਰਬਾਣੀ ਉਚਾਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak chants the Ambrosial Bani."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਪਰਮੇਸ੍ਵਰ ਸਬੰਧੀ ਅੰਮ੍ਰਿਤ ਰੂਪ ਬਾਣੀ ਕੋ ਬੋਲੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲੀ ਬਾਣੀ ਆਖਦਾ ਹੈ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਮ੍ਰਿਤ ਬਾਣੀ = ਅਮਰ ਕਰਨ ਵਾਲੀ ਬਾਣੀ, ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak recita nada más que la Palabra Ambrosial del Shabd de Dios;"