type = "primary"
data = "ਦੁਸਟ ਦੋਖੀਅਨਿ ਪਕਰਿ ਪਛਾਰੋ ॥੪੨॥"
page = 58

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Lord asked me to spread Dharma, and vanquish the tyrants and evil-minded persons. 42."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਦੁਸ਼ਟਾਂ ਅਤੇ ਦੋਖੀਆਂ ਨੂੰ ਪਕੜ ਕੇ ਪਛਾੜ ਦਿਓ ॥੪੨॥"