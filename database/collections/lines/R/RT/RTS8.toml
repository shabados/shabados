[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੁਧੀ ਬਾਜੀ; ਉਪਜੈ ਚਾਉ ॥"
page = 151
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The desire for worldly plays arises in man's intellect."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰੀ ਖੇਡਾਂ ਦੀ ਖਾਹਿਸ਼ ਇਨਸਾਨ ਦੀ ਅਕਲ ਅੰਦਰ ਪੈਦਾ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The desire for the worldly drama arises in the intellect,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰੁ ਤਿਨ ਕੀ ਬੁਧੀ ਮੇਂ ਬਾਜੀਗਰ ਕੀ ਬਾਜੀ ਸਮਝੋ, ਸੰਸਾਰੁ ਨਾਸ ਰੂਪੁ ਹੈ, ਤਿਸੀ ਕਾ ਚਾਉ ਉਤਪਤਿ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ ਮਨੁੱਖ ਦੀ ਬੁੱਧੀ ਜਗਤ-ਖੇਡ ਵਿਚ ਲੱਗੀ ਰਹਿੰਦੀ ਹੈ, (ਜਗਤ-ਤਮਾਸ਼ਿਆਂ ਦਾ ਹੀ) ਚਾਉ ਉਸ ਦੇ ਅੰਦਰ ਪੈਦਾ ਹੁੰਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਜੀ = ਸੰਸਾਰ-ਖੇਡ। ਚਾਉ = ਸੰਸਾਰਕ ਚਾਉ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El juego del intelecto nos mete en la dualidad y,"