[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਸੋਇਆ; ਮਾਇਆ ਬਿਸਮਾਦਿ ॥੧॥"
page = 182
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mind is asleep in the poisonous intoxication of wealth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧੰਨ ਦੌਲਤ ਦੇ ਜ਼ਹਿਰੀਲੇ ਨਸ਼ੇ ਅੰਦਰ ਮਨੂਆਂ ਸੁੱਤਾ ਪਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mind is asleep, fascinated by Maya. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਮਨ ਮਾਇਆ ਕੀ ਅਸਚਰਜਤਾ ਮੇਂ ਮੋਇਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨ ਮਾਇਆ ਦੇ ਅਸਚਰਜ ਤਮਾਸ਼ੇ ਵਿਚ ਸੁੱਤਾ ਰਹਿੰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਸਮਾਦਿ = ਅਸਚਰਜ ਤਮਾਸ਼ੇ ਵਿਚ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y mi mente duerme siendo atontada por el embelezo de la Maya. (1)"