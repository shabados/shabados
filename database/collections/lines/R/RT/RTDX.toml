[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੈਥੰ ਸੜੱਕ ਧੱਕੰ ਧਹਾਕਿ ॥੪੪॥"
page = 68

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The helmets are being knocked at and the guns are booming. The daggers are clattering and there is violent pushing. 44."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਿਤੇ) ਸੈਹੱਥੀਆਂ ਸਰਕ ਰਹੀਆਂ ਸਨ ਅਤੇ (ਕਿਤੇ) ਧੱਕਮ-ਧੱਕੀ ਹੋ ਰਹੀ ਸੀ ॥੪੪॥"