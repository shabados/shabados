[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਨੋ ਕਿਰਪਾਲੁ ਹੋਵੈ ਹਰਿ ਆਪੇ; ਤਿਸ ਨੋ ਹੁਕਮੁ ਮਨਾਵੈ ॥੬॥"
page = 551
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, to whom the Lord Himself becomes merciful, him, He causes to walk in His will."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਉੱਤੇ ਮਾਲਕ ਖੁਦ ਮਿਹਰਬਾਨ ਹੋ ਜਾਂਦਾ ਹੈ, ਉਸ ਨੂੰ ਉਹ ਆਪਣੀ ਰਜ਼ਾ ਅੰਦਰ ਤੋਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One whom the Lord Himself blesses with His Mercy - the Lord causes him to walk according to His Will. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਆਪ ਹੀ ਹਰੀ ਕ੍ਰਿਪਾਲ ਹੋਤਾ ਹੈ ਤਿਸ ਸੇ ਅਪਨਾ ਹੁਕਮੁ ਮਨਾਉਤਾ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਉਤੇ ਪ੍ਰਭੂ ਆਪ ਦਇਆਲ ਹੁੰਦਾ ਹੈ ਉਸ ਨੂੰ ਆਪਣੀ ਰਜ਼ਾ (ਮਿੱਠੀ ਕਰ ਕੇ) ਮਨਾਂਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo llama a la gente a comer, Él Mismo les sirve la comida. Sí, aquél a quien El Señor le otorga Su Compasión, Él Mismo lo hace caminar en Su Voluntad. (6)"