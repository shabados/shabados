[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੰਮਣੁ ਮਰਣਾ. ਹੁਕਮੁ ਪਛਾਣੁ ॥੧॥ ਰਹਾਉ ॥"
page = 412
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Know that birth and death is subject to Lord's will. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਾਣ ਲੈ ਕਿ ਪੈਦਾਇਸ਼ ਅਤੇ ਮੌਤ ਸੁਆਮੀ ਦੀ ਰਜਾ ਦੇ ਤਾਬੇ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Understand that birth and death come according to the Lord's Will. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਨਮ ਮਰਨ ਸਭ ਉਸ ਕੇ ਹੁਕਮ ਮੇਂ ਸਮਝ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੰਮਣਾ ਮਰਨਾ ਭੀ ਤੂੰ ਉਸ ਪਰਮਾਤਮਾ ਦਾ ਹੁਕਮ ਹੀ ਸਮਝ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el nacimiento y la muerte son la Expresión de Su Voluntad. (1‑Pausa)"