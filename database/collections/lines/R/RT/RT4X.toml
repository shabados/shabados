data = "ਪਿਤੁ ਕੀ ਥਿਤਿ ਤਿਨ ਹੂੰ ਸੁਨਿ ਪਾਈ ॥"
page = 859

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The day for commemoration of his dead parents came, and he wanted to solemnize the occasion for his father,"

