[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਮ ਘਰਿ ਆਵਹੁ; ਮੇਰੇ ਮੀਤ ॥"
page = 678
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my friend, come thou into my home."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੈਂਡੇ ਮਿੱਤਰ! ਤੂੰ ਮੇਰੇ ਗ੍ਰਿਹ ਵਿੱਚ ਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Come back to your home, O my friend."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਿਤ੍ਰ ਰੂਪ ਵਾਹਿਗੁਰੂ ਕੀ ਅੰਸ! ਤੁਮ ਘਰ ਮੇਂ ਆਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਿੱਤਰ (ਮਨ)! (ਹੁਣ) ਤੂੰ ਹਿਰਦੇ-ਘਰ ਵਿਚ ਟਿਕਿਆ ਰਹੁ (ਆ ਜਾ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੇਰੇ ਮੀਤ = ਹੇ ਮੇਰੇ ਮਿੱਤਰ ਮਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh amigo, ven ya de regreso a tu Hogar, pues todos tus adversarios han sido controlados por Dios"