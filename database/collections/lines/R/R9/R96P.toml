[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੋ ਰਾਮ ਰਾਇ ਅੰਤਰਜਾਮੀ ॥"
page = 1318
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Sovereign Lord, the inner Knower, is so seeing everything,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਦਰਲੀਆਂ ਜਾਣਨਹਾਰ, ਪਾਤਿਸ਼ਾਹ ਪਰਮੇਸ਼ਰ ਹਰ ਸ਼ੈ ਨੂੰ ਇਸ ਤਰ੍ਹਾਂ ਵੇਖ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such is the Sovereign Lord, the Inner-knower, the Searcher of Hearts;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ ਜਨੋਂ! ਅੰਤਰਜਾਮੀ ਰਾਮ ਰਾਇ ਐਸਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੁੱਧ-ਸਰੂਪ ਪਰਮਾਤਮਾ ਐਸਾ ਹੈ ਕਿ ਉਹ ਹਰੇਕ ਜੀਵ ਦੇ ਅੰਦਰ ਬੈਠਾ ਹੋਇਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਮ ਰਾਇ = ਪਰਕਾਸ਼-ਰੂਪ ਪਰਮਾਤਮਾ, ਸੁੱਧ ਸਰੂਪ ਹਰੀ। ਅੰਤਰਜਾਮੀ = (अन्तर-या। ਯਾ = ਜਾਣਾ, ਪਹੁੰਚਣਾ। ਅੰਤਰ = ਅੰਦਰ) ਹਰੇਕ ਜੀਵ ਦੇ ਧੁਰ ਅੰਦਰ ਅਪੜਨ ਵਾਲਾ, ਹਰੇਕ ਦੇ ਅੰਦਰ ਬੈਠਾ ਹੋਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal es el Soberano Señor, el Conocedor Íntimo de todos los corazones."