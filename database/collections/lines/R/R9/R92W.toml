[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਨਤ ਸਕਲ ਪੁਰਖ ਅਰੁ ਬਾਮਾ ॥੪੦॥੧੯੬॥"
page = 115

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Since that day, the name of Durga became\" shiv- Duti\" ( the messenger of shiva ), all men and women know this.40.196."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਗੱਲ ਨੂੰ ਸਭ ਇਸਤਰੀਆਂ ਅਤੇ ਮਰਦ ਜਾਣਦੇ ਹਨ ॥੪੦॥੧੯੬॥"