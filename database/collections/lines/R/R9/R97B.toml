[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰੀਤਿ ਬਢਾਇ ਇਤੀ ਇਨ ਸੋ ਅਬ ਤ︀ਯਾਗ ਗਏ ਕਹੁ ਕਾਰਨ ਕੈਸੇ ॥"
page = 394

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O Krishna! Vidyuchhata and Mainprabha have said this to you, “When you increased so much love, why are you forsaking it?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਨ੍ਹਾਂ ਨਾਲ ਪ੍ਰੀਤ ਵਧਾ ਕੇ, ਹੁਣ ਤਿਆਗ ਗਏ ਹੋ, ਦਸੋ, (ਇਸ ਦਾ) ਕੀ ਕਾਰਨ ਹੈ।"