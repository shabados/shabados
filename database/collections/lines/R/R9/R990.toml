[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦੀਨ ਦੁਨੀ ਦਾ ਥੰਮੁ ਹੁਇ; ਭਾਰੁ ਅਥਰਬਣ ਥੰਮ੍ਹਿ ਖਲੋਤਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "For dharma and the world he stands like a supporting pillar."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਦੀਨ ਦੁਨੀ) ਲੋਕ ਪ੍ਰਲੋਕ ਦਾ ਥੰਮ੍ਹ ਹੋਕੇ ਭਾਰੀ ਭਾਰ ਨੂੰ ਥੰਮ੍ਹ ਖਲੋਤਾ।"