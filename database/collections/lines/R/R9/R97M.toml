data = "ਜੁ ਵੈ ਤਰਾਕ ਪਨੀਨ ਕੇ; ਪਰੈ ਤਿਹਾਰੇ ਕਾਨ ॥"
page = 864

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She said, ‘My friend listen to me, I have beaten Quazi enough,"

