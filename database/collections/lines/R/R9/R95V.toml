type = "primary"
data = "ਅਰਿ ਅਨੇਕ ਜੀਤੇ ਜਿਨ ਜਲਿ ਥਲਿ ॥"
page = 103

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They conquered many enemies in water and on land."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੇ ਜਲ ਅਤੇ ਥਲ ਦੇ ਅਨੇਕਾਂ ਵੈਰੀਆਂ ਨੂੰ ਜਿਤ ਲਿਆ।"