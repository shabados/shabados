[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਖੁ ਅੰਮ੍ਰਿਤੁ; ਕਰਤਾਰਿ ਉਪਾਏ ॥"
page = 1172
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Poison and nectar, the Creator has created."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜ਼ਹਿਰ ਤੇ ਆਬਿ-ਹਿਯਾਤ, ਰਚਨਹਾਰ ਨੇ ਰਚੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator created both poison and nectar."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਰਤਾਰ! ਤੈਨੇ ਕਰਮਾਂ ਅਨੁਸਾਰ (ਬਿਖੁ) ਦੁਖ ਔਰ (ਅੰਮ੍ਰਿਤ) ਸੁਖ ਉਤਪਤਿ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਤਮਕ ਮੌਤ ਲਿਆਉਣ ਵਾਲੀ ਮਾਇਆ ਅਤੇ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਇਹ ਕਰਤਾਰ ਨੇ (ਹੀ) ਪੈਦਾ ਕੀਤੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਖੁ = ਜ਼ਹਰ, ਆਤਮਕ ਮੌਤ ਲਿਆਉਣ ਵਾਲੀ ਮਾਇਆ। ਅੰਮ੍ਰਿਤੁ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਫਲ। ਕਰਤਾਰਿ = ਕਰਤਾਰ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es Dios Quien crea el veneno y el Néctar,"