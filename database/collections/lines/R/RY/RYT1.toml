[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਰਾਮ; ਵੀਸਰਿ. ਨਹੀ ਜਾਇ ॥"
page = 865
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Forget thou not he Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੁਆਮੀ ਦੇ ਨਾਮ ਨੂੰ ਨਾਂ ਭੁਲਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Never forget the Lord, Raam, Raam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਮ ਨਾਮ ਜਪਨਾਂ ਵਿਸਰ ਨਾ ਜਾਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਵੇਖੀਂ!) ਕਿਤੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਤੈਨੂੰ ਭੁੱਲ ਨਾਹ ਜਾਏ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nunca te olvides de Él,"