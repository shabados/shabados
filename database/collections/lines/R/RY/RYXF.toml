[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦੁਬਿਧਾ, ਅਉਗੁਣਹਾਰੁ ਪਰੋਵੈ ॥੬॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Similarly doubt or double-mindedness weaves for it the garland of vices."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਦੁਬਿਧਾ ਅਉਗੁਣਾਂ ਦਾ ਹਾਰ ਹੀ ਪੁਰੋਂਦੀ ਹੈ। (ਇਸ ਲਈ ਸਾਰੇ ਧਿਕਾਰਾਂ ਮਿਲਦੀਆਂ ਹਨ)।"