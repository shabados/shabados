[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰੇ ਗੁਰ ਕਾ; ਨਿਰਮਲ ਮੰਤੁ ॥੩॥"
page = 197
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Pure is the teaching of the perfect Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤਰ ਹੈ ਪੂਰਨ ਗੁਰਾਂ ਦਾ ਉਪਦੇਸ਼।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Teachings of the Perfect Guru are immaculate and pure. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਸੇ ਪੂਰਨ ਗੁਰੋਂ ਕਾ ਨਿਰਮਲ ਮੰਤ੍ਰ ਧਾਰਨ ਕੀਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੂੰ ਭੀ) ਪੂਰੇ ਗੁਰੂ ਦਾ ਉਪਦੇਸ਼ (ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਵਸਾ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਤੁ = ਉਪਦੇਸ਼ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Mantra del Verdadero Guru en su mente, obtiene la Gloria.(3)"