[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਪਵਿਤ੍ਰੁ ਪਰਮ ਪਦੁ ਪਾਵੈ ॥"
page = 941
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru-ward, attains the pure supreme status."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ-ਸਮਰਪਨ ਪਾਵਨ ਮਹਾਨ ਮਰਤਬੇ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh attains the supreme, sanctified status."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰੁ ਗੁਰਮੁਖਿ ਹੀ ਪਵਿਤ੍ਰ ਪਰਮਪਦ ਕੋ ਪਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇ ਇਸ ਤਰ੍ਹਾਂ) ਪਵਿਤ੍ਰ ਤੇ ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ਹਾਸਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਮ ਪਦੁ = ਸਭ ਤੋਂ ਉੱਤਮ ਦਰਜਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y logra el Estado de Éxtasis Puro;"