[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਧਸੰਗਤਿ, ਗੁਰਸਿਖ ਪੁਜੰਦੇ ॥੩॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Similarly, the Sikhs of Guru, associate themselves with the company of the holy persons."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਤਿਵੇਂ ਗੁਰੂ ਕੇ ਸਿੱਖ ਸਾਧਸੰਗਤਿ ਵਿਚ ਪਹੁੰਚਦੇ ਹਨ।"