[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹ ਦੇਖਾ; ਤਹ ਰਹਿਆ ਸਮਾਇ ॥"
page = 661
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wherever I see, there I see the Lord pervading."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਕਿਤੇ ਮੈਂ ਵੇਖਦਾ ਹਾਂ, ਉਥੇ ਮੈਂ ਸਾਈਂ ਨੂੰ ਵਿਆਪਕ ਵੇਖਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wherever I look, there I see Him, pervading and permeating."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਹਾਂ ਕਹਾਂ ਤਿਸਕੌ ਤਿਨ ਸੰਤੋਂ ਨੇ ਸਮਾਇ ਰਹਿਆ ਦੇਖਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਜਿੱਧਰ ਮੈਂ ਵੇਖਦਾ ਹਾਂ ਉਧਰ ਹੀ ਤੂੰ ਮੌਜੂਦ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਹ = ਜਿੱਥੇ। ਦੇਖਾ = ਮੈਂ ਵੇਖਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Donde sea que veo, veo al Señor prevaleciendo en todo."