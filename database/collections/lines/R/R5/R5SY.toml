[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਹੇ ਸੋਚ ਕਰਹਿ; ਰੇ ਪ੍ਰਾਣੀ ॥"
page = 286
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why entertainest thou anxiety, O Mortal?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਕਿਉਂ iਫ਼ਕਰ ਅੰਦੇਸਾ ਕਰਦਾ ਹੈ, ਹੇ ਫ਼ਾਨੀ ਬੰਦੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So why are you so anxious, O mortal?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਭਾਈ! ਕਿਉਂ ਅਨੇਕ ਤ੍ਰਹ ਕੀ ਚਿੰਤਾ ਕਰਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਾਣੀ! ਤੂੰ ਕਿਉਂ ਫ਼ਿਕਰ ਕਰਦਾ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਹੇ = ਕਿਉਂ? ਕਿਸ ਲਾਭ ਹਿਤ? ਕਰਹਿ = ਤੂੰ ਕਰਦਾ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué te preocupas entonces, oh mortal?"