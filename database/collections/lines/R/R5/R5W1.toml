[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਉ ਮੈ, ਕੀਓ ਸਗਲ ਸੀਗਾਰਾ ॥"
page = 373
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When I made all the decoration,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਮੈਂ ਸਾਰੇ ਹਾਰ-ਸ਼ਿੰਗਾਰ ਕਰ ਲਏ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Even though I totally decorated myself,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਦ੍ਯਪਿ ਮੈਨੇ ਬਹੁਤ ਸੇ ਸਿੰਗਾਰ, ਭਾਵ ਸਾਧਨ ਭੀ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਮੈਂ ਹਰੇਕ ਕਿਸਮ ਦਾ ਸਿੰਗਾਰ ਕੀਤਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਉ = ਜਦੋਂ, ਜੇ। ਕੀਓ = ਕੀਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mientras más me adorno,"