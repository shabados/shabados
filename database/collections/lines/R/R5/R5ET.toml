[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉਮੈ ਮਾਰੇ; ਸਬਦਿ ਨਿਵਾਰੇ ॥"
page = 1045
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Lord's Name I have stilled and silenced my self conceit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੇ ਰਾਹੀਂ ਮੈਂ ਆਪਣੀ ਸਵੈ-ਹੰਗਤਾ ਮੇਟ ਅਤੇ ਦੂਰ ਕਰ ਛੱਡੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Egotism is conquered and subdued by the Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੰਤਾ ਕੋ ਗੁਰ ਉਪਦੇਸ਼ ਕਰ ਨਿਵਾਰੇ ਜਿਸ ਹੰਤਾ ਨੇ ਜੀਵ ਮਾਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪੂਰਨ ਸੇਵਕ) ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ ਆਪਣੀ ਹਉਮੈ ਮਾਰ ਮੁਕਾਂਦਾ ਹੈ, ਆਪਾ-ਭਾਵ ਦੂਰ ਕਰ ਦੇਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਰੇ = ਮੁਕਾ ਦੇਂਦਾ ਹੈ। ਸਬਦਿ = ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ। ਨਿਵਾਰੇ = ਆਪਾ-ਭਾਵ ਦੂਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que se sobrepone a su ego, a través de la Palabra"