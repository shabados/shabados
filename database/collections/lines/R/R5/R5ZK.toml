[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਿਣੁ ਨਾਵੈ; ਕਿਛੁ. ਥਾਇ ਨ ਪਾਈ ॥"
page = 467
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Name, nothing becomes acceptable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੇ ਬਾਝੋਂ ਕੋਈ ਚੀਜ ਭੀ ਕਬੂਲ ਨਹੀਂ ਪੈਂਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Name, nothing is of any use."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਸੇ ਬਿਨਾਂ ਕੋਈ ਕਰਮ (ਥਾਇ) ਠਿਕਾਨੇ ਨਹੀਂ ਲਗਤਾ, ਭਾਵ ਸਭ ਸਫਲ ਨਹੀਂ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਤੋਂ ਬਿਨਾ ਹੋਰ ਕੋਈ ਉੱਦਮ ਪਰਵਾਨ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él vive en la maleza o en el campo de cremación,"