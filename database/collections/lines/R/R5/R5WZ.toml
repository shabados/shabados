[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲੈ ਕਰਵਾਰ ਅਉ ਢਾਰ ਸੰਭਾਰ ਕੈ; ਸਿੰਘ ਕੋ ਦਉਰ ਕੈ ਜਾਇ ਹਕਾਰਿਓ ॥"
page = 91

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Holding his sword and controlling his shield, he ran forward and challenged the lion.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਲਵਾਰ ਅਤੇ ਢਾਲ ਨੂੰ ਸੰਭਾਲ ਕੇ ਦੌੜਦੇ ਹੋਇਆਂ ਸ਼ੇਰ ਨੂੰ ਜਾ ਲਲਕਾਰਿਆ।"