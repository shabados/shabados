[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਰਸਨੁ ਹਰਿ; ਦੇਖਣ ਕੈ ਤਾਈ ॥"
page = 757
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "for the sake of seeing the Lord's sight."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦਾ ਦੀਦਾਰ ਵੇਖਣ ਦੀ ਖਾਤਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I long for the Blessed Vision of the Lord's Darshan."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੋ ਦਰਸਨ ਦੇਖਨੇ ਵਾਸਤੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤਾਂ ਤੇਰਾ ਦਰਸਨ ਕਰਨ ਵਾਸਤੇ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ ਤਾਈ = ਕੈ ਤਾਈਂ, ਵਾਸਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el Señor muestra Su Compasión por mí,"