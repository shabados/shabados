[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਪ੍ਰਭੁ ਅਪੁਨਾ. ਸਦਾ ਧਿਆਈਐ; ਸੋਵਤ ਬੈਸਤ ਖਲਿਆ ॥"
page = 782
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever contemplate thou that Lord of thine, whether sleeping, sitting or standing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੌਂਦਾ, ਬਹਿੰਦਾ ਜਾਂ ਖਲੋਤਾ ਹੋਇਆ ਤੂੰ ਸਦਾ ਹੀ ਉਸ ਆਪਣੇ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate forever on your God, when you sleep and sit and stand."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਸੋ ਐਸਾ ਜੋ ਅਪਨਾ ਪ੍ਰਭੂ ਹੁਕਮ ਕਰਨੇ ਵਾਲਾ ਹੈ, ਤਿਸ ਕੋ ਸਦਾ ਹੀ ਸੋਤੇ ਬੈਠੇ ਖੜੇ ਹੂਏ ਧ੍ਯਾਈਐ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸੁੱਤਿਆਂ ਬੈਠਿਆਂ ਖਲੋਤਿਆਂ (ਹਰ ਵੇਲੇ) ਉਸ ਪਰਮਾਤਮਾ ਦਾ ਧਿਆਨ ਧਰਨਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਿਆਈਐ = ਸਿਮਰਨਾ ਚਾਹੀਦਾ ਹੈ। ਸੋਵਤ ਬੈਸਤ ਖਲਿਆ = ਸੁੱਤਿਆਂ, ਬੈਠਿਆਂ, ਖਲੋਤਿਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Meditemos por siempre en el Señor, parados o sentados, despiertos o soñando."