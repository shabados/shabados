[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਊਚੇ ਤੇ ਊਚਾ ਦਰਬਾਰਾ ॥"
page = 1079
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The highest of the high is the Lord's court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉੱਚਿਆਂ ਤੋਂ ਉੱਚਾ ਹੈ ਸੁਆਮੀ ਦਾ ਦਰਬਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord's Court is the highest of the high."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਦਰਬਾਰ ਊਚੇ ਸੇ ਊਚਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰਾ ਦਰਬਾਰ ਸਭ (ਦਰਬਾਰਾਂ) ਨਾਲੋਂ ਉੱਚਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ। ਊਚੇ ਤੇ ਊਚਾ = ਸਭ ਤੋਂ ਉੱਚਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo más Alto de lo alto, la Más Sublime,"