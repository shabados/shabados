[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਆ ਕਾ ਅੰਤੁ; ਨ ਜਾਨੈ ਕੋਊ ॥"
page = 251
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His limit no one knows."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਓੜਕ ਕੋਈ ਨਹੀਂ ਜਾਣਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one knows His limits."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਸ ਪਰਮੇਸ੍ਵਰ ਕਾ ਕੋਈ ਅੰਤੁ ਨਹੀਂ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪ੍ਰਭੂ ਦੇ ਗੁਣਾਂ ਦਾ ਕੋਈ ਜੀਵ ਅੰਤ ਨਹੀਂ ਜਾਣ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਆ ਕਾ = ਉਸ ਪ੍ਰਭੂ ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sus límites no son conocidos por nadie"