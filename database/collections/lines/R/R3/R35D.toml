[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜਸੁ. ਰੇ ਮਨਾ ਗਾਇ ਲੈ; ਜੋ ਸੰਗੀ ਹੈ ਤੇਰੋ ॥"
page = 727
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, sing thou the praise of God, who is thy real friend."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਤੂੰ ਵਾਹਿਗੁਰੂ ਦੀ ਮਹਿਮਾ ਗਾਇਨ ਕਰ, ਜੋ ਤੇਰਾ ਸੱਚਾ ਸਾਥੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sing the Lord's Praises, O mind; He is your only true companion."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਭਾਈ ਪ੍ਯਾਰਿਆ! ਹਰੀ ਕੇ ਜਸੁ ਕੋ ਗਾਇਨ ਕਰ ਲੈ ਜੋ ਤੇਰਾ ਸਾਥੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦਾ ਗੀਤ ਗਾਇਆ ਕਰ, ਇਹ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਹੀ ਤੇਰਾ ਅਸਲੀ ਸਾਥੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਸੁ = ਸਿਫ਼ਤਿ-ਸਾਲਾਹ। ਸੰਗੀ = ਸਾਥੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canta las Alabanzas del Señor, oh mente mía, Él es tu Único y Verdadero Compañero,"