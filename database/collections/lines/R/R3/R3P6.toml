[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਹਾ ਬਿਖਮੁ ਸੰਸਾਰੁ; ਵਿਰਲੈ ਪੇਖਿਆ ॥"
page = 398
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Very difficult to cross is the world ocean but only a few realise it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਰ ਹੋਣ ਲਈ ਜਗਤ ਸਮੁੰਦਰ ਪਰਮ ਔਖਾ ਹੈ ਬਹੁਤ ਹੀ ਥੋੜੇ ਇਸ ਨੂੰ ਅਨੁਭਵ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How very treacherous is this world-ocean; how very few realize this!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੰਸਾਰ ਮਹਾ ਬਿਖਮ ਹੈ ਕਿਸੀ ਬਿਰਲੇ ਪੁਰਖ ਨੇ ਯਥਾਰਥ ਕਰ ਇਸ ਕੋ ਗ੍ਯਾਨ ਨੇਤ੍ਰੋਂ ਸੇ ਦੇਖਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਵਿਰਲੇ (ਭਾਗਾਂ ਵਾਲੇ) ਨੇ ਵੇਖਿਆ ਹੈ ਕਿ ਇਹ ਸੰਸਾਰ-(ਸਮੁੰਦਰ) ਬੜਾ ਭਿਆਨਕ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਖਮੁ = ਬਿਖੜਾ, ਔਖਾ। ਵਿਰਲੇ = ਕਿਸੇ ਵਿਰਲੇ ਮਨੁੱਖ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Temible es el océano del ir y venir, pero extraordinario es aquél que sabe,"