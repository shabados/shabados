[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜੀਉ; ਤੂ ਮੇਰਾ ਇਕੁ ਸੋਈ ॥"
page = 1333
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Sire God, Thou alone are my Sublime Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਹਾਰਾਜ ਵਾਹਿਗੁਰੂ ਕੇਵਲ ਤੂੰ ਹੀ ਮੇਰਾ ਸ੍ਰੇਸ਼ਟ ਸੁਆਮੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Dear Lord, You are my One and Only."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰਿ ਜੀ! ਜੇ ਏਕ ਤੂੰ ਭਗਤਾਂ ਕਾ ਸਹਾਇਕ ਹੈਂ ਸੋਈ ਤੂੰ ਮੇਰਾ ਸੁਆਮੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਜੀ! ਮੇਰੀ ਸਾਰ ਲੈਣ ਵਾਲਾ ਸਿਰਫ਼ ਇਕ ਤੂੰ ਹੀ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਈ = ਸਾਰ ਲੈਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi Amado Señor, eres mi Uno y mi Único, medito en Ti"