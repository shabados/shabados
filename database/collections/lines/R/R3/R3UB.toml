[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬੰ ਸਾਚਾ ਏਕੁ ਹੈ; ਦੂਜਾ ਨਾਹੀ ਕੋਇ ॥"
page = 660
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the whole world, there is but One True Lord and there is not any other."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਸੰਸਾਰ ਅੰਦਰ ਕੇਵਲ ਇਕ ਸੱਚਾ ਸਾਹਿਬ ਹੈ। ਹੋਰ ਕੋਈ ਹੈ ਹੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In all the world, there is only the One True Lord; there is no other at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਚ ਸਰੂਪ! ਸਰਬ ਰੂਪ ਏਕ ਤੂੰ  ਹੀ ਹੈਂ, ਤੇਰੇ ਬਿਨਾਂ ਔਰ ਦੂਸਰਾ ਕੋਈ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਪਰਮਾਤਮਾ ਹੀ ਸਭ ਥਾਈਂ ਮੌਜੂਦ ਹੈ, ਉਸ ਤੋਂ ਬਿਨਾ ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਬੰ = ਹਰ ਥਾਂ। ਸਾਚਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Verdadero es el Único; no hay nadie más;"