type = "primary"
data = "ਤੁ ਗੋਈ ਮਨਈਂ ਜਾ ਗੁਰੇਜ਼ਾ ਸ਼ਵਮ ॥"
page = 1415

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘If you say so, I will run away from this place."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੇ ਤੂੰ ਕਹੇਂ ਤਾਂ ਮੈਂ ਇਸ ਥਾਂ ਤੋਂ ਗੁੰਮ ਹੋ ਜਾਵਾਂ।"