[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬੀਤੇ ਸੌ ਬਰਖ ਰੀਝੇ ਗੁਰਦੇਵ ॥"
page = 615

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The lowly gods served the Lord for a hundred years, when he (the Guru-Lord) was pleased"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੌ ਵਰ੍ਹਿਆਂ ਦੇ ਬੀਤਣ ਤੋਂ ਬਾਦ ਗੁਰੂ ਦੇਵ ਪ੍ਰਸੰਨ ਹੋਏ।"