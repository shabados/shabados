[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਪਰਪੰਚ ਉਦਰ ਨਿਜ ਪੋਖਿਓ; ਪਸੁ ਕੀ ਨਿਆਈ ਸੋਇਓ ॥੧॥"
page = 633
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Practising hypocrisy, thou fillest thy belly, and sleepst like a beast."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਖੰਡ ਰੱਚ ਕੇ ਤੂੰ ਆਪਣੇ ਢਿੱਡ ਨੂੰ ਭਰਦਾ ਹੈ ਅਤੇ ਡੰਗਰ ਦੀ ਮਾਨੰਦ ਸੋਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Practicing hypocrisy, you fill your belly, and then sleep like an animal. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੇਕ (ਪਰਪੰਚ) ਛਲੋਂ ਕੋ ਕਰ ਕੇ ਪਸ਼ੂ ਕੀ ਨ੍ਯਾਈਂ ਪੇਟ ਭਰ ਲੀਆ ਅਰ ਸੋਇ ਰਹਾ ਤੋ ਕ੍ਯਾ ਹੂਆ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਲੋਕਾਂ ਨਾਲ) ਛਲ ਕਰ ਕੇ ਆਪਣਾ ਪੇਟ ਪਾਲਦਾ ਰਿਹਾ, ਤੇ, ਪਸ਼ੂਆਂ ਵਾਂਗ ਸੁੱਤਾ ਰਿਹਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਪੰਚ = ਪਖੰਡ, ਛਲ। ਉਦਰ ਨਿਜ = ਆਪਣਾ ਪੇਟ। ਪੋਖਿਓ = ਪਾਲਿਆ। ਪਸੁ ਕੀ ਨਿਆਈ = ਪਸ਼ੂਆਂ ਵਾਂਗ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por medio de trucos, llenaste tu estómago y después dormiste como perro callejero. (1)"