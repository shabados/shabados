assets = ["DGDG"]
type = "primary"
data = "ਬਿ ਰਫ਼ਤੰਦ ਕਿਸ਼ਤੀ ਬ ਦਰੀਯਾਇ ਗਾਰ ॥"
page = 1419

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The boats had floated and entered into the deep waters."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਸ਼ਤੀ ਤੁਰ ਪਈ ਅਤੇ ਡੂੰਘੇ ਦਰਿਆ ਵਿਚ ਪਹੁੰਚ ਗਈ।"