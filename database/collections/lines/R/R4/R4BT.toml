[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਡੋਰੀ ਹਾਥਿ ਤੁਮਾਰੇ ॥"
page = 626
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord. Their nose-string is in Thy hand."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਤੇ ਉਨ੍ਹਾਂ ਦੀ ਨਕੇਲ ਤੇਰੇ ਹੱਥ ਵਿੱਚ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O God, their reins are in Your hands."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਇਨ ਕੀ ਪ੍ਰਾਰਬਧ ਵਾ ਪ੍ਰਾਣ ਰੂਪ ਡੋਰੀ ਤੁਮਾਰੇ ਹੀ ਹਾਥ ਮੇਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅਸਾਂ ਜੀਵਾਂ ਦੀ ਜ਼ਿੰਦਗੀ ਦੀ) ਡੋਰ ਤੇਰੇ ਹੱਥ ਵਿਚ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਾਥਿ = ਹੱਥ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Dios, y el báculo está en Tus Manos."