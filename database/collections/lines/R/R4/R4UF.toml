data = "ਪਾਪ ਕਰਮ ਤੇ ਸਬੈ ਹਟਾਏ ॥੫॥"
page = 177

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the subjects began to tread the path of Dharma and abandoned the sinful actions.5."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪਾਪ ਕਰਮਾਂ ਤੋਂ ਸਭ ਨੂੰ ਹਟਾਇਆ ॥੫॥"