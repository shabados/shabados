[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਹਜ ਬਿਨੋਦ ਚੋਜ ਆਨੰਤਾ ॥"
page = 1157
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I, now, easily enjoy infinite revelments and wondrous plays."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹੁਣ ਬੇਅੰਤ ਰੰਗਰਲੀਆਂ ਅਤੇ ਅਸਚਰਜ ਖੇਡਾਂ ਸੁਖੈਨ ਹੀ ਮਾਣਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Now, I intuitively enjoy endless pleasures and wondrous play."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਭਾਵਕ ਹੀ (ਚੋਜ) ਕੌਤਕ ਅਰ ਅਨੰਤ ਹੀ ਬਿਲਾਸ ਪ੍ਰਾਪਤਿ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੁਣ ਮੇਰੇ ਅੰਦਰ) ਆਤਮਕ ਅਡੋਲਤਾ ਦੇ ਬੇਅੰਤ ਆਨੰਦ-ਤਮਾਸ਼ੇ ਬਣੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜ ਬਿਨੋਦ = ਆਤਮਕ ਅਡੋਲਤਾ ਦੇ ਆਨੰਦ। ਆਨੰਤਾ = ਬੇਅੰਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Infinitas son las Dichas de Equilibrio que da,"