[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੁ ਮਨੁ ਬਡਾ; ਕਿ ਜਾ ਸਉ ਮਨੁ ਮਾਨਿਆ ॥"
page = 331
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Is this soul greater, or He to whom this soul is attuned?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੀ ਇਹ ਆਤਮਾ ਵੱਡੀ ਹੈ ਜਾਂ ਉਹ ਜਿਸ ਨਾਲ ਇਹ ਆਤਮਾ ਹਿਲੀ ਹੋਈ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Is this mind greater, or the One to whom the mind is attuned?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹੁ ਮਨ ਵੱਡਾ ਹੈ ਕਿ ਜਿਸ ਕੇ ਸਾਥ ਮਨ ਮਾਨਿਆ ਹੈ ਵਹੁ ਬਡਾ ਹੈ?☬ਉੱਤਰ: ਜਿਸ ਪਰਮੇਸ੍ਵਰ ਸੇ ਮਨ ਮਾਨਿਆ ਹੈ ਵੁਹੀ ਵੱਡਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੀ ਇਹ ਮਨ ਬਲਵਾਨ ਹੈ ਜਾਂ (ਇਸ ਤੋਂ ਵਧੀਕ ਬਲਵਾਨ ਉਹ ਪ੍ਰਭੂ ਹੈ) ਜਿਸ ਨਾਲ ਮਨ ਪਤੀਜ ਜਾਂਦਾ ਹੈ (ਤੇ ਭਟਕਣੋਂ ਹਟ ਜਾਂਦਾ ਹੈ)?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਡਾ = ਵੱਡਾ, ਸਤਕਾਰ-ਯੋਗ। ਕਿ = ਜਾਂ। ਜਾ ਸਉ = ਜਿਸ (ਪ੍ਰਭੂ) ਨਾਲ। ਮਾਨਿਆ = ਮੰਨ ਗਿਆ ਹੈ, ਪਤੀਜ ਗਿਆ ਹੈ, ਟਿਕ ਗਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Es la mente grandiosa, o es el Señor, al Cuál está entonada?"