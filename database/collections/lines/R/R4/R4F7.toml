data = "ਕਿਉ ਕਰਿ. ਭਵਜਲੁ ਲੰਘਸਿ ਪਾਰਾ ॥"
page = 1029
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How can he cross the terrible world-ocean?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਕਿਸ ਤਰ੍ਹਾਂ ਭਿਆਨਕ ਸੰਸਾਰ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਉੱਤਰ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How can he cross the terrifying world-ocean?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਸ ਪ੍ਰਕਾਰ ਕਰਿ ਸੰਸਾਰ ਸਮੁੰਦਰ ਸੇ ਪਾਰ ਲੰਘੇਂਗੇ॥"

[[content]]
assets = ["PSST"]
