[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੰਮਣੁ ਮਰਣਾ ਹੈ ਸੰਸਾਰੁ ॥"
page = 364
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The world is subject to coming and going."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਹਾਨ ਆਉਣ ਤੇ ਜਾਣ ਦੇ ਅਧੀਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The world is tied to birth and death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰ ਤੋ ਜਨਮ ਮਰਨ ਕਾ ਹੀ ਨਾਮ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ ਮਨੁੱਖ ਵਾਸਤੇ) ਜਗਤ ਜਨਮ ਮਰਨ (ਦਾ ਗੇੜ ਹੀ) ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Qué es este mundo? Es un constante ir y venir."