[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛਿਅ ਜਤੀ; ਮਾਇਆ ਕੇ ਬੰਦਾ ॥"
page = 1160
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The six celibates are the slaves of mammon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਛੇ ਬ੍ਰਹਮਚਾਰੀ ਮਾਇਆ ਦੇ ਗੋਲੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The six celibates are slaves of Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਛੇ ਜਤੀ ਭੀ ਮਾਯਾ ਕੇ ਦਾਸ ਹੂਏ ਹੈਂ॥☬ਜਤੀ ਏਹ ਹਨ-ਭੈਰੋਂ ੧, ਗੋਰਖ ੨, ਲਛਮਣ ੩, ਹਨੂਮਾਨ ੪, ਦਤਾਤ੍ਰੇ ੫ ਔ ਭੀਛਮ ਪਿਤਾਮਾ ੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਤੀ ਭੀ ਮਾਇਆ ਦੇ ਹੀ ਗ਼ੁਲਾਮ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛਿਅ ਜਤੀ = ਛੇ ਜਤੀ, (ਹਨੂਮਾਨ, ਭੀਸ਼ਮ ਪਿਤਾਮਾ, ਲਛਮਨ, ਭੈਰਵ, ਗੋਰਖ, ਦੱਤਾਤ੍ਰੇਯ)। ਬੰਦਾ = ਗ਼ੁਲਾਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los seres castos como Bhairo, Hanuman, Lakhman, Gorakj,"