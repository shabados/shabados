[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਰਾਮਦਾਸਹੁ ਅਰਜਨੁ ਗੁਰੂ; ਦਰਸਨੁ ਦਰਪਨਿ ਵਿਚਿ ਦਿਖਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Guru Arjan Dev by Guru Ram 'Ws was ated as if he is the image of the latter in the mirror."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਰਾਮਦਾਸਹੁੰ ਅਰਜਨ ਗੁਰੂ ਹੋਏ, ਜਿੱਕੁਰ ਸ਼ੀਸ਼ੇ ਵਿਚ ਪ੍ਰਤਿਬਿੰਬ ਦਿਖਾਈਦਾ ਹੈ।"