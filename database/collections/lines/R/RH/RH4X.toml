[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਨਿਕ ਛੁਅਤ ਤਾ ਕੇ ਤੁਰਤ; ਬਾਧਿ ਗਯੋ ਤਤਕਾਲ ॥"
page = 988

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Through her touch, she immediately made him prisoner."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਜ਼ਰਾ ਜਿੰਨਾ ਛੋਹਣ ਨਾਲ (ਉਹ) ਤੁਰਤ ਬੰਨ੍ਹਿਆ ਗਿਆ।"