data = "ਦਰਸਨੁ ਕਰੀਆ ॥"
page = 746
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he sees the Lord's vision."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ ਦਾ ਦੀਦਾਰ ਦੇਖ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He obtains the Blessed Vision of the Lord's Darshan."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕਾ ਦਰਸਨ ਕਰਕੇ, ਭਾਵ ਅਭੇਦ ਹੋ ਕੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਦਾ) ਦਰਸਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El obtiene la visión del Darshan del Señor;"