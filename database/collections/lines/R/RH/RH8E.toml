[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਜਿਨਿ ਕੀਨੀ; ਮੇਰੇ ਗੁਰ ਕੀ ਆਸਾ ॥"
page = 239
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who-ever has placed confidence in my Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਿਸੇ ਨੇ ਮੇਰੇ ਗੁਰਦੇਵ ਜੀ ਤੇ ਭਰੋਸਾ ਧਾਰਨ ਕੀਤਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whoever places his hopes in my Guru,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਪੁਰਸੋਂ ਨੇ ਮੇਰੇ ਗੁਰੋਂ ਕੀ ਆਸ ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਜਿਸ ਮਨੁੱਖ ਨੇ ਮੇਰੇ ਗੁਰੂ ਦੀ ਆਸ (ਆਪਣੇ ਮਨ ਵਿਚ) ਧਾਰ ਲਈ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ ਨੇ। ਕੀਨੀ = ਕੀਤੀ, ਬਣਾਈ, ਧਾਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que descansa sus esperanzas en el Guru,"