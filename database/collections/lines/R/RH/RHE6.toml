data = "ਅਜ਼ਾਰਸ਼ ਬੁਗੋ ਤਾ ਇਲਾਜੇ ਕੁਨਮ ॥"
page = 1418

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Tell us about your afflictions so that we can suggest you remedies."

