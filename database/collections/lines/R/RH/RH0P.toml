[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਚੁ ਨੀਸਾਣੁ ਅਪਾਰੁ; ਜੋਤਿ ਉਜਾਲਿਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Hail the Lord! His mark is truth and He shines in bright effulgent flame."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਉਸਦਾ) ਨੀਸਾਣ (ਪਰਵਾਨ) ਅਪਾਰ ਤੇ ਸੱਚਾ ਹੈ, (ਸਾਰੇ ਉਸੇ ਦੀ) ਜੋਤੀ ਦਾ ਪ੍ਰਕਾਸ਼ ਹੈ।"