[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਬ ਕਹਾ ਕਰਹੁਗੇ ਐਸੀ ॥੧॥ ਰਹਾਉ ॥"
page = 658
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such being my love for Thee, what shalt Thou do now with me? Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਨਾਲ ਮੇਰੀ ਐਹੋ ਜੇਹੀ ਪ੍ਰੀਤ ਹੁੰਦਿਆਂ, ਹੁਣ ਤੂੰ ਮੇਰੇ ਨਾਲ ਕੀ ਕਰਨੂੰਗਾ? ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Now, what will You do? ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਐਸੀ ਕਿਆ ਕਰੋਗੇ ਕਿ ਅਪਨੀ ਪ੍ਰੀਤਿ ਮੇਰੇ ਸੇ ਛੁਡਾਇ ਲੇਵੌਗੇ ਅਰਥਾਤ ਨਹੀਂ ਛੁਡਾਇ ਸਕਤੇ ਹੋ॥੧॥ ਰਹਾਉ ॥☬ਜੇ ਕਹੋ ਵਹੁ ਪ੍ਰੀਤੀ ਤੁਮਾਰੀ ਕੈਸੇ ਨਹੀਂ ਛੂਟਤੀ? ਤਿਸ ਪਰ ਦ੍ਰਿਸ਼ਟਾਂਤ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਜਿਹੀ ਪ੍ਰੀਤਿ ਦੇ ਹੁੰਦਿਆਂ ਤੂੰ ਜ਼ਰੂਰ ਉਹਨਾਂ ਨੂੰ ਮੋਹ ਤੋਂ ਬਚਾਈ ਰੱਖਦਾ ਹੈਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਐਸੀ = ਅਜਿਹੀ ਪ੍ਰੀਤ ਦੇ ਹੁੰਦਿਆਂ। ਕਹਾ ਕਰਹੁਗੇ = ਕੀਹ ਕਰੇਂਗਾ? ਇਸ ਤੋਂ ਬਿਨਾ ਹੋਰ ਕੀਹ ਕਰੇਂਗਾ? (ਭਾਵ, ਤੂੰ ਜ਼ਰੂਰ ਆਪਣੇ ਭਗਤਾਂ ਨੂੰ ਮੋਹ ਤੋਂ ਬਚਾਈ ਰੱਖੇਂਗਾ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ahora ¿qué Puedes hacer? (1‑Pausa)"