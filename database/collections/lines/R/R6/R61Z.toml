[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਨ ਕਰਮ ਤਾ ਕੇ ਆਚਾਰ ॥੨॥"
page = 1340
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "perfect become his deeds and conduct."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਕੰਮਲ ਥੀ ਵੰਞਦੇ ਹਨ ਉਸ ਦੇ ਅਮਲ ਅਤੇ ਚਾਲ-ਚਲਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- they have perfect karma and conduct. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਸਰਬ ਪਵਿਤਰ ਅਚਾਰ ਔ ਬਿਧੀ ਪੂਰਬਕ ਕਰਮ ਪੂਰਨ ਹੋ ਜਾਤੇ ਹੈਂ, ਭਾਵ ਸਫਲੇ ਹੋ ਜਾਤੇ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਨੁੱਖ ਦੇ ਸਾਰੇ ਕਰਮ ਸਾਰੇ ਕਰਤੱਬ ਸਫਲ ਹੋ ਜਾਂਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਚਾਰ = ਕਰਤੱਬ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "logran un muy buen Karma y una Perfecta Conducta. (2)"