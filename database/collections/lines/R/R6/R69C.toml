[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਿ ਹਰਿ ਹਰਿ ਨਾਮੁ ਧਿਆਇਆ; ਬਿਖੁ ਹਉਮੈ ਕਢੀ ਮਾਰਿ ॥"
page = 1314
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Contemplating the Lord God's Name within my mind, I am rid of the poison of my self conceit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਰਿਦੇ ਅੰਦਰ ਸਾਈਂ ਹਰੀ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ ਮੈਂ ਆਪਣੀ ਸਵੈ-ਹੰਗਤਾ ਦੀ ਜ਼ਹਿਰ ਤੋਂ ਖਲਾਸੀ ਪਾ ਗਿਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating on the Name of the Lord, Har, Har, within the mind, the poison of egotism is eradicated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਮਨ ਮੇਂ ਹਰਿ ਹਰਿ ਨਾਮੁ ਧ੍ਯਾਯਾ ਹੈ ਤਿਨੋਂ ਨੇ ਬਿਖ ਰੂਪ ਹੰਤਾ, ਮਮਤਾ ਅੰਤਹਕਰਨ ਸੇ ਮਾਰ ਕਢੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਮਨੁੱਖ ਨੇ ਆਪਣੇ) ਮਨ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਨਾ ਸ਼ੁਰੂ ਕਰ ਦਿੱਤਾ, (ਉਸ ਨੇ ਆਪਣੇ ਅੰਦਰੋਂ ਆਤਮਕ ਮੌਤ ਲਿਆਉਣ ਵਾਲੀ) ਹਉਮੈ-ਜ਼ਹਰ ਮਾਰ ਕੇ ਕੱਢ ਦਿੱਤੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਬਿਖੁ ਹਉਮੈ = (ਆਤਮਕ ਜੀਵਨ ਨੂੰ ਮੁਕਾਣ ਵਾਲੀ) ਹਉਮੈ-ਜ਼ਹਰ। ਮਾਰਿ = ਮਾਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "meditando en el Nombre del Señor Jar, Jar, en el interior de la mente, el veneno del egoísmo es removido;"