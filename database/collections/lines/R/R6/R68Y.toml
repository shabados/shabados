[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਰਿ ਸਮੑਾਲੇ. ਸਾਚਾ ਸੋਇ ॥"
page = 1151
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the True Lord, takes care of all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੱਚਾ ਸੁਆਮੀ, ਸਾਰਿਆਂ ਦੀ ਰਖਵਾਲੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Lord takes care of all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਸਚਾ ਵਾਹਿਗੁਰੂ ਸਰਬ ਜੀਵੋਂ ਕੀ ਸਾਰ ਕੋ ਸਮਾਲਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਬੜੇ ਗਹੁ ਨਾਲ (ਆਪਣੇ ਭਗਤਾਂ ਦੀ) ਸੰਭਾਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਰਿ = ਸਾਰ ਲੈ ਕੇ, ਗਹੁ ਨਾਲ। ਸਮ੍ਹ੍ਹਾਲੇ = ਸੰਭਾਲ ਕਰਦਾ ਹੈ। ਸਾਚਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, ese Uno Verdadero que siempre nos cuida."