[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕਹਿ ਆਪਿ ਕਰਾਵਨਹਾਰਾ ॥"
page = 251
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord alone causes the mortals to act."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਪ੍ਰਭੂ ਹੀ ਪ੍ਰਾਣੀਆਂ ਪਾਸੋਂ ਕਾਰਜ ਕਰਵਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One Lord Himself is the Cause of all actions."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਪਰਮੇਸ੍ਵਰ ਆਪ ਹੀ ਸਭ ਕਰਮੋਂ ਕੇ ਕਰਾਵਨੇ ਹਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੀਵਾਂ ਪਾਸੋਂ ਚੰਗੇ ਮੰਦੇ ਕੰਮ) ਕਰਾਵਣ ਵਾਲਾ ਪ੍ਰਭੂ ਸਿਰਫ਼ ਆਪ ਹੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਕਹਿ = ਸਿਰਫ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, el Uno lo hace todo Él Mismo."