[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਖੰਡਿ; ਪਾਰਬ੍ਰਹਮੁ ਕਦੇ ਨ ਪਾਏ ॥"
page = 88
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through hypocrisy he shall never obtain the Supreme Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੰਭ ਦੇ ਰਾਹੀਂ ਉਸ ਨੂੰ ਪਰਮ ਪ੍ਰਭੂ ਕਦਾਚਿੱਤ ਪਰਾਪਤ ਨਹੀਂ ਹੋਣਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through hypocrisy, he shall never attain the Supreme Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪਾਖੰਡੀ ਪਾਰਬ੍ਰਹਮ ਕੋ ਕਭੀ ਨਹੀਂ ਪਾਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ (ਇਸ) ਪਖੰਡ ਨਾਲ ਪਰਮਾਤਮਾ ਨੂੰ ਨਹੀਂ ਮਿਲ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਖੰਡ = ਵਿਖਾਵੇ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero no encontrará al Señor Supremo a través de la hipocresía,"