[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਇਆ ਧਾਰੀ ਗੋਵਿਦ ਗੋੁਸਾਈ ॥"
page = 891
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Master has taken pity on me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਮਾਲਕ ਨੇ ਮੇਰੇ ਉਤੇ ਰਹਿਮਤ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord of the Universe, the Lord of the World, has taken pity on me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਪਰ ਗੋਵਿੰਦ ਸ੍ਵਾਮੀ ਨੇ ਕਿਰਪਾ ਧਾਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਉਤੇ ਧਰਤੀ ਦਾ ਖਸਮ ਪ੍ਰਭੂ ਦਇਆ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਸਾਈ = {ਅਸਲ ਲਫ਼ਜ਼ 'ਗੋਸਾਈ' ਹੈ, ਇਥੇ 'ਗੁਸਾਈ' ਪੜ੍ਹਨਾ ਹੈ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor del Universo, el Señor del mundo ha tenido Compasión de mí,"