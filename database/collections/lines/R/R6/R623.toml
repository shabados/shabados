[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਨਾਮੁ ਜਪਤ; ਆਘਾਵੈ ॥"
page = 264
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By meditation on God's Name he is satiated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ ਉਹ ਰੱਜ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chanting the Name of the Lord, you shall be satisfied."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰੁ ਹਰੀ ਕਾ ਨਾਮ ਜਪਤਾ ਹੂਆ ਇਹੁ ਜੀਵ ਤ੍ਰਿਪਤ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਜਪਿਆਂ (ਮਨੁੱਖ ਮਾਇਆ ਵਲੋਂ) ਰੱਜ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਘਾਵੈ = ਰੱਜ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero sólo aliviarás la Sed del Espíritu repitiendo el Nombre."