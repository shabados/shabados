[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਗਿਆਨੀ ਜਗੁ ਜੀਤਾ; ਜਗਿ ਜੀਤਾ ਸਭੁ ਕੋਇ ॥"
page = 548
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, the divine has conquered the world but the world has conquered all others."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਬ੍ਰਹਮ ਬੇਤੇ (ਪੁਰਖ) ਨੇ ਸੰਸਾਰ ਨੂੰ ਜਿੱਤ ਲਿਆ ਹੈ, ਪ੍ਰੰਤੂ ਸੰਸਾਰ ਨੇ ਹੋਰ ਸਭਨਾ ਨੂੰ ਜਿੱਤ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the spiritually wise one has conquered all others."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਗਿਆਨੀਓਂ ਨੇ (ਜਗ) ਜਨਮ ਮਰਨ ਕੋ ਜੀਤਾ ਹੈ ਅਰ ਗਿਆਨੀਓਂ ਬਿਨਾਂ (ਜਗ) ਜਨਮ ਮਰਨ ਨੇ ਸਭ ਕੋਈ ਜੀਤ ਲੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਗਿਆਨਵਾਨ ਮਨੁੱਖ ਨੇ ਸੰਸਾਰ ਨੂੰ (ਭਾਵ, ਮਾਇਆ ਦੇ ਮੋਹ ਨੂੰ) ਜਿੱਤ ਲਿਆ ਹੈ, (ਤੇ ਗਿਆਨੀ ਤੋਂ ਬਿਨਾ) ਹਰ ਇਕ ਮਨੁੱਖ ਨੂੰ ਸੰਸਾਰ ਨੇ ਜਿੱਤਿਆ ਹੈ, (ਗਿਆਨੀ ਦੇ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਗਿ = ਜਗਤ ਨੇ। ਸਭੁ ਕੋਇ = ਹਰੇਕ ਜੀਵ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, los Sabios han conquistado al mundo, el mundo conquista todo, excepto a los Sabios."