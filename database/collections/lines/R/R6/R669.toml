[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਦੀਪਕੁ; ਅਮਰਕੁ ਸੰਸਾਰਿ ॥"
page = 971
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That lamp renders the world immortal,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਦੀਵਾ ਜਗਤ ਨੂੰ ਸਦ-ਜੀਵੀ ਬਣਾ ਦਿੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That lamp makes the world immortal;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਦੀਵਾ ਸੰਸਾਰ ਮੇਂ ਅਮਰ ਕਰਨੇ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਦੀਵਾ (ਜਿਸ ਮਨੁੱਖ ਦੇ ਅੰਦਰ ਜਗ ਪਏ ਉਸ ਨੂੰ) ਸੰਸਾਰ ਵਿਚ ਅਮਰ ਕਰ ਦੇਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਮਰਕੁ = ਅਮਰ ਕਰਨ ਵਾਲਾ। ਸੰਸਾਰਿ = ਸੰਸਾਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Su Luz lo vuelve a uno eterno en el mundo."