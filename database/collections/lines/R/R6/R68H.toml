[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਾਰਸੁ ਪਰਸਿ ਨ ਪਥਰਹੁ; ਕੰਚਨੁ ਹੋਇ ਨ ਅਘੜੁ ਘੜਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Touching the philosopher's stone another stone does not transform into gold nor can it be chiselled into an ornament."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਾਰਸ ਨਾਲ ਪਰਸ ਕੇ ਪੱਥਰ ਤੋਂ ਸੋਨਾ ਨਹੀਂ ਹੋ ਸਕਦਾ, ਨਾ ੳਹਾ ਅਘੜ (ਸੋਨੇ ਦੇ ਵਾਂਗੂ ਘੜਿਆ ਹੀ ਜਾਂਦਾ ਹੈ।"