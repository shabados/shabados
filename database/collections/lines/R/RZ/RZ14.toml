[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਮਨ ਬੈਰਾਗੀਆ; ਤੂੰ ਬੈਰਾਗੁ ਕਰਿ, ਕਿਸੁ ਦਿਖਾਵਹਿ ॥"
page = 440
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my detached soul, whom showest thou thy indifference towards the world?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਤਿਆਗਣ ਜਿੰਦੜੀਏ! ਤੂੰ ਸੰਸਾਰ ਵਲੋਂ ਆਪਣੀ ਉਪਰਾਮਤਾ ਕਿਸ ਨੂੰ ਵਿਖਾਲਦੀ ਹੈਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my detached mind, unto whom do you show your detachment?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ ਬੈਰਾਗੀ! ਤੂੰ ਝੂਠੇ ਬੈਰਾਗ ਕੇ ਚਿਹਨ ਕਿਸ ਕੋ ਦਿਖਾਉਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਵੈਰਾਗ ਵਿਚ ਆਏ ਹੋਏ ਮੇਰੇ ਮਨ! ਤੂੰ ਵੈਰਾਗ ਕਰ ਕੇ ਕਿਸ ਨੂੰ ਵਿਖਾਂਦਾ ਹੈਂ? (ਇਸ ਉਪਰੋਂ ਉਪਰੋਂ ਵਿਖਾਏ ਹੋਏ ਵੈਰਾਗ ਨਾਲ ਤੇਰੇ ਅੰਦਰ ਆਤਮਕ ਆਨੰਦ ਨਹੀਂ ਬਣ ਸਕੇਗਾ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੈਰਾਗੀਆ = ਵੈਰਾਗ ਵਿਚ ਆਇਆ ਹੋਇਆ। ਕਰਿ = ਕਰ ਕੇ। ਕਿਸੁ = ਕਿਸ ਨੂੰ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente desolada, ¿para quién finges que nada te importa ya?"