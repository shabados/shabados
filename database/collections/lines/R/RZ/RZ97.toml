[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਬਲਦੀ ਅੰਦਰਿ ਤੇਲੁ ਪਾਇ; ਕਿਉ ਮਨੁ ਮੂਰਖੁ ਅਗਿ ਬੁਝਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "How could a manmukh extinguish fire by putting oil on it?"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਬਲਦੀ ਹੋਈ ਅੱਗ ਵਿਚ ਤੇਲ ਪਾਉਣ ਨਾਲ ਕਿੱਕੁਰ ਮੂਰਖ ਦਾ ਮਨ ਅੱਗ ਬੁਝਾ ਸਕਦਾ ਹੈ?"