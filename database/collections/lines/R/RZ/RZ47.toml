[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਸੁਕਬਿ, ਬਿਚਾਰ ॥੪੮੯॥"
page = 739

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Ashtakvachani” in the beginning and then adding “Ripu Ari”, the names of Tupak are formed.489."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤੁਪਕ ਦਾ ਨਾਮ ਹੋ ਜਾਂਦਾ ਹੈ। ਕਵੀਓ! ਚੇਤੇ ਕਰ ਲਵੋ ॥੪੮੯॥"