[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਤਨੁ ਤੇਰਾ; ਧਨੁ ਭੀ ਤੇਰਾ ॥"
page = 106
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My soul and body are Thine, my wealth too is Thine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਆਤਮਾ ਤੇ ਦੇਹਿ ਤੇਰੀਆਂ ਹਨ, ਮੇਰੀ ਦੌਲਤ ਭੀ ਤੇਰੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Mind and body are Yours; all wealth is Yours."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਔਰ ਤਨ ਤੇਰਾ ਹੈ ਪੁਨਾ ਧਨ ਭੀ ਤੇਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਪਾਲਕ! ਮੈਨੂੰ ਇਹ ਮਨ (ਜਿੰਦ) ਇਹ ਸਰੀਰ ਤੈਥੋਂ ਹੀ ਮਿਲਿਆ ਹੈ, (ਇਹ) ਧਨ ਭੀ ਤੇਰਾ ਹੀ ਦਿੱਤਾ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tuyo es el cuerpo, Tuya la mente, Tuyas las riquezas,"