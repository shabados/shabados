[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉਮੈ ਮਾਇਆ; ਸਬਦਿ ਜਲਾਈ ॥"
page = 798
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ego and mammon I have burnt with the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੰਕਾਰ ਅਤੇ ਮੋਹਨੀ ਮੈਂ ਹੰਕਾਰ ਨਾਮ ਨਾਲ ਸਾੜ ਸੁੱਟੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Word of the Shabad, I have burnt away egotism and Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਕਰ ਜੋ (ਹਉਮੈ) ਹੰਤਾ ਮਮਤਾ ਸੀ, ਸੋ ਤਿਨੋਂ ਨੇ ਸਤਿਗੁਰੋਂ ਕੇ ਉਪਦੇਸ ਦ੍ਵਾਰਾ ਜਲਾਇ ਦਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ (ਆਪਣੇ ਅੰਦਰੋਂ) ਮਾਇਆ ਦੇ ਕਾਰਨ ਪੈਦਾ ਹੋਈ ਹਉਮੈ ਸਾੜ ਲਈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਬਦਿ = ਸ਼ਬਦ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A través de la Palabra, mi ego y el amor a Maya desaparecen,"