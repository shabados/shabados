data = "ਭਾਤਿ ਭਾਤਿ ਸੌ ਪਾਇਨ ਪਰਹੀ ॥੨੫॥"
page = 841

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And, through numerous ways, paid their obeisance at his feet.(25)"

