[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕ ਭਗਤਿ ਭਗਵਾਨ; ਜਿਹ ਪ੍ਰਾਨੀ ਕੈ ਨਾਹਿ ਮਨਿ ॥"
page = 1428
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mortal, who enshrines not the devotion of One Lord in his mind,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਜੀਵ ਦੇ ਅੰਤਰ ਆਤਮੇ ਇਕ ਪ੍ਰਭੂ ਦਾ ਅਨੁਰਾਗ ਨਹੀਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That person, who does not feel devotion to God in his mind"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਭਗਵਾਨ ਕੀ ਭਗਤੀ ਜਿਸ ਸਰੀਰ ਧਾਰੀ ਕੇ ਮਨ ਮੇਂ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਮਨ ਵਿਚ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਨਹੀਂ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ ਮਨਿ = ਦੇ ਮਨ ਵਿਚ। ਜਿਹ ਪ੍ਰਾਨੀ ਕੈ ਮਨਿ = ਜਿਸ ਪ੍ਰਾਣੀ ਦੇ ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sabe que el cuerpo de quien no siente en su mente Devoción por Dios,"