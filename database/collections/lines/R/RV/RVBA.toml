[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪ੍ਰਸਾਦਿ; ਨਾਨਕ ਕੋ ਤਰਿਆ ॥੪॥੧॥੧੬॥"
page = 715
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, rare is the person, who is saved through the Guru's grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਕਿਸੇ ਵਿਰਲੇ ਪੁਰਸ਼ ਦਾ ਹੀ, ਗੁਰਾਂ ਦੀ ਦਇਆ ਰਾਹੀਂ ਪਾਰ ਉਤਾਰਾ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, O Nanak, a rare few are saved. ||4||1||16||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਇਸ ਸੇ ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਹੀ ਕੋਈ ਵਿਰਲਾ ਤਰਿਆ ਹੈ॥੪॥੧॥੧੬॥☬ਜੇਕਰ ਕਹੇ ਆਪ ਮਾਇਆ ਮੇਂ ਕਿਉਂ ਨਹੀਂ ਲਿਪਟੇ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਤੇਰੇ ਭੀ ਕੀਹ ਵੱਸ?) ਕੋਈ ਵਿਰਲਾ ਮਨੁੱਖ ਹੇ ਨਾਨਕ! (ਆਖ-) ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ (ਇਸ ਖੂਹ ਵਿਚੋਂ) ਪਾਰ ਲੰਘਦਾ ਹੈ ॥੪॥੧॥੧੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਪ੍ਰਸਾਦਿ = ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ। ਕੋ = ਕੋਈ ਵਿਰਲਾ ॥੪॥੧॥੧੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y extraordinario es aquél, oh dice Nanak, que es salvado por la Gracia del Guru.(4-1-16)"