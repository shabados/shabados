[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨਿ ਧਨਿ; ਤੂ ਮਾਤਾ ਦੇਵਕੀ ॥"
page = 988
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Blessed, blessed thou art, O mother Devki,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਬਾਰਕ, ਮੁਬਾਰਕ! ਹੈਂ ਤੂੰ, ਹੇ ਮਾਤਾ ਦੇਵਕੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Blessed, blessed are you, O mother Dayvakee;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਤਾ ਦੇਵਕੀ! ਤੂੰ ਧੰਨਿ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਂ ਦੇਵਕੀ! ਤੈਥੋਂ (ਭੀ) ਕੁਰਬਾਨ ਹਾਂ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, Devaki, madre de Krishna, bendita seas;"