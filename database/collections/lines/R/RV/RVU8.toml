[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮੰਧੇ; ਪ੍ਰਭੁ ਅਵਗਾਹੀਆ ॥"
page = 132
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within my mind I have meditated on the Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਅੰਤਸ਼ਕਰਨ ਅੰਦਰ ਮੈਂ ਮਾਲਕ ਦਾ ਸਿਮਰਨ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Within my mind, I meditate on God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹੋਂ ਨੇ (ਮਨ ਮੰਧੇ) ਮਨ ਵਿਖੇ ਜੋ ਪ੍ਰਭੂ ਕੇ ਸਰੂਪ ਕਾ (ਅਵਗਾਹੀਆ) ਵਿਚਾਰ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਆਪਣੇ ਮਨ ਵਿਚ ਹੀ ਚੁੱਭੀ ਲਾਉ ਤੇ ਪ੍ਰਭੂ ਦਾ ਦਰਸਨ ਕਰੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਧੇ = {मध्य} ਵਿਚਿ। ਅਵਗਾਹੀਆ = {अवगाह, to bathe one self into, to plunge} ਚੁੱਭੀ ਲਾਣੀ ਚਾਹੀਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En mi mente he habitado en el Señor,"