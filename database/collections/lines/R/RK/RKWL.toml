[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨ ਦੇਵ ਦਾਨਵਾ; ਨਰਾ ॥"
page = 143
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Neither gods, nor demons or men,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਂ ਦੇਵਤੇ, ਦੈਂਤ ਨਾਂ ਮਨੁੱਖ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Neither the angels, nor the demons, nor human beings,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੇਵਤੇ ਅਰੁ ਦੈਂਤ ਅਰੁ ਮਨੁਖ ਸਤ ਨਹੀਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਹ ਦੇਵਤੇ, ਨਾਹ ਦੈਂਤ, ਨਾਹ ਮਨੁੱਖ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਾਨਵਾ = ਦੈਂਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ni ángeles, ni seres malvados, ni hombres;"