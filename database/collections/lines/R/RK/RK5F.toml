[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਤੁ ਦੁਆਰੈ ਧੋਇ; ਹਛਾ ਹੋਇਸੀ ॥"
page = 730
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When washed in this way then the vessel is rendered clean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਧੋਤਾ ਜਾਵੇ ਤਾਂ ਬਰਤਨ ਸਾਫ ਸੁਥਰਾ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By being washed through this Gate, it becomes pure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਏਤੁ ਦੁਆਰੈ) ਏਸ ਦਰਵਾਜੇ, ਭਾਵ ਗੁਰਾਂ ਦੁਆਰੇ ਸੁਧ ਕਰੇ ਤੋ ਚੰਗਾ ਹੋਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਦਰ ਤੇ ਰਹਿ ਕੇ ਹੀ (ਵਿਕਾਰਾਂ ਦੀ ਮੈਲ) ਧੋਤਿਆਂ ਹਿਰਦਾ ਪਵਿਤ੍ਰ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਤੁ ਦੁਆਰੈ = ਇਸ ਦਰ ਤੇ, ਗੁਰੂ ਦੇ ਦਰ ਤੇ। ਧੋਇ = ਧੋ ਕੇ, ਸੁੱਧ ਕੀਤਿਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y lavándolo a través de esta Puerta, se vuelve Puro."