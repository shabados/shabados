[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਠ ਪਹਰ; ਕਰ ਜੋੜਿ ਧਿਆਵਉ ॥"
page = 393
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Day and night, with folded hands, I contemplate over the Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਿਹੁੰ ਰੈਣ ਹੱਥ ਬੰਨ੍ਹ ਕੇ ਮੈਂ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Twenty-four hours a day, with palms pressed together, I meditate;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਅਸ੍ਟ ਪਹਰ ਹਾਥ ਜੋੜ ਕਰ ਏਹ ਧ੍ਯਾਉਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਅੱਠੇ ਪਹਿਰ ਦੋਵੇਂ ਹੱਥ ਜੋੜ ਕੇ ਤੇਰਾ ਧਿਆਨ ਧਰਦਾ ਰਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰ ਜੋੜਿ = (ਦੋਵੇਂ) ਹੱਥ ਜੋੜ ਕੇ। ਧਿਆਵਉ = ਧਿਆਵਉਂ, ਮੈਂ ਧਿਆਵਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Noche y día rezo"