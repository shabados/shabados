[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਧੁ ਬਿਨੁ; ਦੂਜਾ ਅਵਰੁ ਨ ਕੋਇ ॥"
page = 365
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Besides thee, there is no other second."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਬਾਝੋਂ ਹੋਰ ਦੂਸਰਾ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without You, there is no other at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਸੇ ਬਿਨਾਂ ਦੂਸਰਾ ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੈਥੋਂ ਬਿਨਾ ਕੋਈ ਹੋਰ ਕੁਝ ਕਰਨ ਵਾਲਾ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aparte de Ti, no hay nada;"