[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਹਮਾਰੈ. ਮਨ ਕਾ ਸੁਆਉ ॥"
page = 1144
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Name is the very object of my mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਹੀ ਮੇਰੇ ਚਿੱਤ ਦਾ ਮਨੋਰਥ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Naam is the objective of my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰੇ ਮਨ ਕਾ (ਸੁਆਉ) ਪ੍ਰਜੋਜਨ ਭੀ ਨਾਮੁ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰਿ-ਨਾਮ ਮੇਰੇ ਮਨ ਦੀ ਹਰ ਵੇਲੇ ਦੀ ਮੰਗ ਹੋ ਗਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਆਉ = ਸੁਆਰਥ, ਮਨੋਰਥ, ਮੰਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, es el Objeto Vital para mi mente."