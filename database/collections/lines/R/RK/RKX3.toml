[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੇ ਸੇਤੀ ਰਤਿਆ; ਜਨਮੁ ਨ ਦੂਜੀ ਵਾਰ ਜੀਉ ॥੧॥"
page = 751
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Being imbued with the True Lord, the mortal is not born a second time."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਸਾਹਿਬ ਨਾਲ ਰੰਗੀਜਣ ਦੁਆਰਾ, ਪ੍ਰਾਣੀ ਦੂਜੀ ਵਾਰ ਜਨਮ ਨਹੀਂ ਧਾਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But those who are attuned to the True Lord, are not reincarnated again. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਪਰਮੇਸਰ ਕੇ ਸਾਥ ਰਤੇ ਹੈਂ ਤਿਨ ਕੋ ਦੂਸਰੀ ਵਾਰ ਜਨਮ ਨਹੀਂ ਹੋਵੇਗਾ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੇ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਪਿਆਰ-ਰੰਗ ਵਿਚ ਰੰਗੇ ਜਾਈਏ, ਤਾਂ ਮੁੜ ਮੁੜ ਜਨਮ (ਦਾ ਗੇੜ) ਮੁੱਕ ਜਾਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਤੀ = ਨਾਲ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero aquellos que viven entonados en el Señor Verdadero, no vuelven a reencarnar otra vez. (1)"