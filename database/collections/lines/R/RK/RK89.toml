[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਸ ਮੇਰੇ; ਬੇਅੰਤ ਅਪੂਛੇ ॥"
page = 1141
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My countries are unquestionably infinite."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮੁਲਕ ਬਿਨਾਂ ਪੁਛੇ ਅਨੰਤ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My countries are infinite and uncountable."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ (ਦੇਸ) ਸਾਸਤ੍ਰ, ਵੇਦ ਬੇਅੰਤ ਹੈਂ, ਭਾਵ ਅਨੇਕ ਮਤੋਂ ਵਾਲੇ ਔਰੁ (ਅਪੂਛੇ) ਪੂਛਨੇ ਸੇ ਬਿਨਾਂ ਹੈਂ, ਭਾਵ ਪ੍ਰਗਟ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਜਿੰਦ ਦੇ ਆਤਮਕ ਅਸਥਾਨ ਇਤਨੇ ਉੱਚੇ ਹੋ ਗਏ ਕਿ ਜਮ-ਰਾਜ ਉੱਥੇ ਕੁਝ ਪੁੱਛਣ-ਜੋਗਾ ਹੀ ਨਾਹ ਰਿਹਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਸ ਮੇਰੇ = ਮੇਰੀ ਜਿੰਦ ਦੇ ਆਤਮਕ ਟਿਕਾਣੇ। ਅਪੂਛੇ = (ਜਮ ਦੀ) ਪੁੱਛ ਤੋਂ ਪਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y mi País es lugar del Infinito, más allá del influjo de la muerte."