data = "ਬਿਦਿਆ ਤਪੁ ਜੋਗੁ; ਪ੍ਰਭ ਧਿਆਨੁ ॥"
page = 295
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "learning, penance, union with and meditation on the Master,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਲਮ, ਤਪੱਸਿਆ, ਮਾਲਕ ਦਾ ਮਿਲਾਪ ਅਤੇ ਸਿਮਰਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "learning, penance, Yoga and meditation on God;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਿਦਿਆ ਤਪ ਪ੍ਰਾਣਾਜਾਮ ਰੂਪ ਯੋਗ ਪੁਨਾ ਪ੍ਰਭ ਕਾ ਧਿਆਨੁ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਿੱਦਿਆ, ਤਪ, ਜੋਗ, ਅਕਾਲ ਪੁਰਖ ਦਾ ਧਿਆਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Conocimiento, Disciplina y Yoga; toda cualidad existe cuando se recuerda a diario el Naam, el Nombre del Señor."