type = "translation"
language = "pa"
data = "ਉਸਦਾ ਮੁਖੜਾ ਰੱਬ ਦੀ ਰਹਿਮਤ ਸਦਕਾ ਸਦਾ ਰੌਸ਼ਨ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਰੁਖ਼ਸ਼ ਰੌਸ਼ਨ ਅਜ਼ ਰਹਿਮਤਿ ਕਿਬਰੀਆ ॥੧੭੦॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "His face, with Waaheguru's magnanimity and munificence, is always radiant and shininmg. (170)"