[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਮ੍ਰਿਤ ਨਾਮ; ਮਹਾ ਰਸ ਪੀਨੇ ॥੨॥"
page = 201
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He has quaffed the great essence of the ambrosial name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਸੁਧਾਸਰੂਪ ਨਾਮ ਦਾ ਪਰਮ ਜੌਹਰ ਪਾਨ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "he drinks deeply of the most sublime essence of the Ambrosial Naam. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਮਹਾਂ ਅੰਮ੍ਰਿਤ ਰਸੁ ਪੀ ਰਹੇ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸਰ ਦੇ ਸੇਵਕ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਪਰਮੇਸਰ ਦਾ ਸਭ ਰਸਾਂ ਤੋਂ ਮਿੱਠਾ ਨਾਮ-ਰਸ ਪੀਂਦੇ ਰਹਿੰਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੀਨੇ = ਪੀਂਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "de aquél que bebe del Néctar de la Gran Esencia.  (2)"