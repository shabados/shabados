[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਿਰਮ ਪਿਆਲਾ ਪਾਇ, ਅਜਰੁ ਜਰਾਇਆ ॥੪॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They bear the effect of this unbearable in their mind."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੇਮ ਦਾ ਪਿਆਲਾ ਪੀਕੇ 'ਅਜਰ' ਨੂੰ ਜਰ ਜਾਂਦੇ ਹਨ।"