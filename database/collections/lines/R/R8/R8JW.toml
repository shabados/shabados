[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਠਾਕੁਰ ਪ੍ਰੀਤਮ ਪ੍ਰਭ ਮੇਰੇ ॥"
page = 894
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Beloved Lord Master!"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੈਡੇ ਪਿਆਰੇ ਸੁਆਮੀ ਮਾਲਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my Beloved God, my Lord and Master,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪ੍ਰੀਤਮ ਠਾਕੁਰ ਸਾਮਰਥ! ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪ੍ਰੀਤਮ ਪ੍ਰਭੂ! ਹੇ ਮੇਰੇ ਠਾਕੁਰ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਕੁਰ = ਹੇ ਠਾਕੁਰ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Maestro mío, oh Dios mío, oh mi Amor, no hay nadie sin Ti."