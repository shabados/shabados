[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਮਲੁ ਨਿਰਾਹਾਰੁ ਨਿਹਕੇਵਲੁ ॥"
page = 840
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Immaculate Lord is self sustained and detached,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤਰ ਪ੍ਰਭੂ ਸਵੈ-ਤ੍ਰਿਪਤ ਅਤੇ ਨਿਰਲੇਪ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is immaculate, self-sustaining and unattached."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਹਰੀ ਨਿਹਕੇਵਲੁ ਸੁਧੁ ਸਰੂਪੁ (ਨਿਰਾਹਾਰ) ਅਭੋਗਤਾ ਹੈ ਔ (ਨਿਹਕੇਵਲ) ਅਦੁਤੀਯ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਨੂੰ ਵਿਕਾਰਾਂ ਦੀ ਮੈਲ ਨਹੀਂ ਲੱਗਦੀ, ਪਰਮਾਤਮਾ ਨੂੰ ਕਿਸੇ ਖ਼ੁਰਾਕ ਦੀ ਲੋੜ ਨਹੀਂ (ਉਹ ਹਰ ਵੇਲੇ ਹੀ ਬ੍ਰਤ-ਧਾਰੀ ਹੈ), ਪਰਮਾਤਮਾ ਸੁੱਧ-ਸਰੂਪ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਾਹਾਰੁ = {ਨਿਰ-ਆਹਾਰੁ} ਜਿਸ ਨੂੰ ਕਿਸੇ ਖ਼ੁਰਾਕ ਦੀ ਲੋੜ ਨਹੀਂ। ਨਿਹਕੇਵਲੁ = {निष्कैवल्य} ਸੁੱਧ ਸਰੂਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor es Inmaculado, Autónomo y Desapegado,"