[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸੇਖ ਮਸਾਇਕ ਆਖੀਅਨਿ; ਲਖ ਲਖ ਦਰਿ ਦਰਿਵੇਸ ਵਖਾਣੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Millions of sheikhs , mashaiks (practitioners) and dervishes are described in it."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਲੱਖਾਂ ਸ਼ੇਖ, (ਲੱਖਾਂ) ਮਸਾਇਕ ਆਖੀਦੇ ਹਨ, ਲੱਖਾਂ (ਖੁਦਾ ਦੇ) ਦਰਵਾਜ਼ੇ ਦੇ ਦਰਵੇਸ਼ ਕਹੀਦੇ ਹਨ।"