[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਉਠਿ ਕਰਿ ਆਪੁ ਬਿਲੋਕਿਯੈ; ਤੋਰ ਕਿ ਮੋਰੋ ਹੋਇ ॥੮॥"
page = 868

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Let us try and ascertain who is he, whether your husband or mine.(8)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਠ ਕੇ ਆਪ ਵੇਖ ਲੈ ਕਿ ਤੇਰਾ ਪਤੀ ਹੈ ਜਾਂ ਮੇਰਾ ॥੮॥"