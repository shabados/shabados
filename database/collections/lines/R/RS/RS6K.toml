[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲੀ ਸਿੰਮ੍ਰਿਤਿ; ਸ੍ਰਵਨੀ ਸੁਨੈ ॥"
page = 875
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and hears with his ears all the Simirtis,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੇ ਕੰਨਾਂ ਨਾਲ ਸਾਰੀਆਂ ਸਿਮਰਤੀਆਂ ਨੂੰ ਸ੍ਰਵਣ ਕਰ ਲਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and listen to all the Simritees,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਸਭ ਸਿਮ੍ਰਤੀਆਂ ਕੋ ਭੀ ਅਪਨੀ ਸ੍ਰਵਨੀ ਸੁਨੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਸਿਮ੍ਰਿਤੀਆਂ ਧਿਆਨ ਨਾਲ ਸੁਣੇ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸ੍ਰਵਨੀ = ਕੰਨਾਂ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "escuchando con sus propios oídos todos los textos semíticos,"