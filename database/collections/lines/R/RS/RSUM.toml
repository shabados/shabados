data = "ਪਰ ਬਲਵਾਨ ਸ਼ੇਰ ਨੇ ਉਸ ਨੂੰ ਪੰਜੇ (ਹੱਥ) ਨਾਲ ਹੀ ਮਾਰ ਦਿੱਤਾ ॥੨੨॥"