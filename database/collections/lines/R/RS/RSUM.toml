data = "ਬਲੀ ਸਿੰਘ ਸੋ ਹਾਥ ਸੋ ਮਾਰਿ ਡਾਰੰ ॥੨੨॥"
page = 102

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But the brave lion killed him with his hands.22."

[[content]]
