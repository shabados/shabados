[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਟੀ ਕਾ; ਲੇ ਦੇਹੁਰਾ ਕਰਿਆ ॥"
page = 913
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who gathering dust did make thy temple of body."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਮਿੱਟੀ ਨੂੰ ਲੈ ਕੇ ਤੇਰਾ ਸਰੀਰ ਬਣiਾੲਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "From clay, He fashioned your body."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਟੀ ਉਪਲਖਤ ਪੰਚ ਤੱਤੋਂ ਕੋ ਲੈਕਰ ਏਹ ਸਰੀਰ ਰੂਪ ਦੇਹੁਰਾ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਇਹ ਮਿੱਟੀ ਦਾ ਪੁਤਲਾ ਘੜ ਦਿੱਤਾ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੇ = ਲੈ ਕੇ। ਦੇਹੁਰਾ = ਦੇਹ, ਸਰੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que infundió en ti la respiración en el polvo de tu cuerpo,"