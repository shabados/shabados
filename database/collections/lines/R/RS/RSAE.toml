[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਟਿ ਬਾਟਿ ਸਬੋ ਲਏ; ਨਵਖੰਡ ਦ੍ਵੀਪ ਦੁਰੰਤ ॥"
page = 618

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They all distributed the Nav-Khand continents among themselves"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਸੀਮ ('ਦੁਰੰਤ') ਨੌ ਖੰਡ ਦੀਪਾਂ ਨੂੰ (ਉਨ੍ਹਾਂ) ਸਾਰਿਆਂ ਨੇ ਵੰਡ ਲਿਆ।"