[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਆ ਉਪਮਾ ਤੇਰੀ; ਆਖੀ ਜਾਇ ॥"
page = 350
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What glory of Thine, O Lord, can be uttered?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਕਿਹੜੀ ਕਿਹੜੀ ਪ੍ਰਭਤਾ, ਹੈ ਸੁਆਮੀ, ਕਹੀ ਜਾ ਸਕਦੀ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What Glories of Yours can be chanted?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਕਾਲ ਪੁਰਖ! ਤੇਰੀ ਉਸਤਤ ਕਿਆ ਕਹੀ ਜਾਇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਤੇਰੀ ਵਡਿਆਈ ਬਿਆਨ ਨਹੀਂ ਕੀਤੀ ਜਾ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਪਮਾ = ਵਡਿਆਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cuáles de Tus Glorias puede uno entonar?"