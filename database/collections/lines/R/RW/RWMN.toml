[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਟ ਘਟ ਅੰਤਰਿ; ਰਵਿਆ ਸੋਈ ॥੨॥"
page = 387
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the Lord, is contained in all the hearts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਆਮੀ ਸਾਰਿਆਂ ਦਿਲਾਂ ਵਿੱਚ ਰਮਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is contained in each and every heart. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਸਭ ਘਟੋਂ ਘਟੋਂ ਮੇਂ ਰਮ ਰਹਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਰਮਾਤਮਾ ਹੀ ਹਰੇਕ ਸਰੀਰ ਦੇ ਅੰਦਰ ਵੱਸ ਰਿਹਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਈ = ਉਹ ਪਰਮਾਤਮਾ ਹੀ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, el Señor, prevalece en todos los corazones. (2)"