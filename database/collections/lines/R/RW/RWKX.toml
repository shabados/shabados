[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਜਿ ਅਭਿਮਾਨ; ਭਏ ਨਿਰਵੈਰ ॥"
page = 183
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Shedding my ego, I have become uninominal."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਹੰਗਤਾ ਛੱਡ ਕੇ ਮੈਂ ਦੁਸ਼ਮਨੀ-ਰਹਿਤ ਹੋ ਗਿਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Shedding my ego, I have become free of hate."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਹਮ ਅਭਿਮਾਨ ਕੋ ਤਜ ਕਰ ਕੇ ਨਿਰਵੈਰ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਮੰਤਰ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਉਹ ਅਹੰਕਾਰ ਛੱਡ ਕੇ ਨਿਰਵੈਰ ਹੋ ਗਏ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਜਿ = ਛੱਡ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora que me he liberado de mi ego negativo,"