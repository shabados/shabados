data = "ਰੀਝੰਤ ਦੇਵ ਮੁਨਿ ਮਨਿ ਡੁਲੰਤ ॥੫੧੬॥"
page = 603

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The gods playing their lyres, are pleasing the mind of sages.516."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਨ੍ਹਾਂ ਨੂੰ ਵੇਖ ਕੇ) ਦੇਵ ਰੀਝ ਰਹੇ ਹਨ ਅਤੇ ਮੁਨੀਆਂ ਦੇ ਮਨ ਡੋਲ ਰਹੇ ਹਨ ॥੫੧੬॥"