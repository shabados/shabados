type = "translation"
language = "pa"
data = "ਗੋਯਾ ਦੇ ਦਿਲ ਦੀ ਤਰਹ ਸੰਤੋਖੀ ਅਤੇ ਹਰਿਆ ਭਰਿਆ ਰਹੁ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਮੁਦਾਮ ਸ਼ਾਕਿਰੋ ਸ਼ਾਦਾਬ ਚੂੰ ਦਿਲਿ ਗੋਯਾ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "The only person who is honest and religious-minded is the one"