language = "pa"
data = "ਹੇ ਵਾਹਿਗੁਰੂ # ਤੂੰ ਹਰ ਬੇਅਦਬ ਨੂੰ ਅਦਬ ਗਖਸ਼,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਐ ਖ਼ੁਦਾ ਹਰ ਬੇ ਅਦਬ ਰਾ ਦਿਹ ਅਦਬ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Was able to dispel all the darkness and tyranny from this world and made it clean and chaste. (92)"