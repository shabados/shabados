[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਵ ਧਾਰ ਅਪਾਰਹਿ ਪਾਰ ਪਰੈ ॥"
page = 664

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In this way, whosoever loves the Lord, he crosses this infinite ocean of existence"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਸੰਸਾਰ ਸਾਗਰ ਦੀ ਅਥਾਹ ਧਾਰ ਤੋਂ ਪਾਰ ਹੋ ਜਾਏਗਾ।"