data = "ਤਿਹ ਆਗੇ ਕ︀ਯਾ ਮਨੁਖ ਬਿਚਾਰੋ ॥"
page = 866

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘A person who can kill a lion, to that person what is a human being?"

[[content]]
