page = 46

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Salutation to Him, who is Fearless."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੈਨੂੰ) ਨਮਸਕਾਰ ਹੈ। (ਹੇ) ਡਰ ਤੋਂ ਰਹਿਤ! (ਤੈਨੂੰ) ਨਮਸਕਾਰ ਹੈ।"