[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ; ਕਹ ਅਹੰਕਾਰਿ ਅਫਾਰਾ ॥"
page = 530
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man, why art thou puffed up with pride?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੰਦੇ! ਕਿਉਂ ਗਰੂਰ ਨਾਲ ਫੁੱਲਿਆ ਫਿਰਦਾ ਹੈਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mind, why are you so puffed up with egotism?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਹੰਕਾਰ ਕਰ ਕੇ ਕਿਆ (ਅਫਾਰਾ) ਅਮੋੜ ਹੋ ਰਹਾ ਵਾ ਫੁਲਾ ਬੈਠਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਤੂੰ ਕਿਉਂ ਅਹੰਕਾਰ ਨਾਲ ਆਫਰਿਆ ਹੋਇਆ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਕਹ = ਕਾਹੇ? ਕਿਉਂ? ਅਹੰਕਾਰਿ = ਅਹੰਕਾਰ ਨਾਲ। ਅਫਾਰਾ = ਆਫਰਿਆ ਹੋਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente, ¿por qué te has inflado de ego?"