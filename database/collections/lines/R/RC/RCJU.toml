[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਥਾਵੇ ਕਉ; ਗੁਰਿ. ਦੀਨੋ ਥਾਨੁ ॥"
page = 395
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To the shelterless the Guru has given the shelter."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਸਰਾ ਵਿਹੂਣ ਨੂੰ ਗੁਰੂ ਨੇ ਆਸਰਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru has given shelter to the shelterless."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੋ ਕੋਈ ਅਸਥਾਨ ਨਹੀਂ ਥਾ ਤਿਨ ਕੋ ਗੁਰੋਂ ਨੇ ਅਸਥਾਨ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਪਹਿਲਾਂ ਕਿਤੇ ਢੋਈ ਨਹੀਂ ਸੀ ਮਿਲਦੀ ਗੁਰੂ ਨੇ ਮੈਨੂੰ (ਆਪਣੇ ਚਰਨਾਂ ਵਿੱਚ) ਥਾਂ ਦਿੱਤਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਥਾਵਾ = ਜਿਸ ਨੂੰ ਕਿਤੇ ਢੋਈ ਨਾਹ ਮਿਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El vagabundo encuentra un lugar a través del Guru;"