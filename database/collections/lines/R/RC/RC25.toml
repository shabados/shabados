[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗਦਹੁੰ ਚੰਦਨ ਲਦੀਐ; ਨਹਿੰ ਗਾਂਧੀ ਗਾਜੁ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Laden with sandalwood, the donkey cannot be called a perfumer."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਖੋਤੇ ਉਤੇ ਚੰਦਨ ਲੱਦ ਦੇਈਏ) ਤਾਂ ਉਹ ਗਾਂਧੀ ਨਹੀਂ ਕਹੀਦਾ।"