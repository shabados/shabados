[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿ ਪੁਰਖ ਤੇ; ਭਿੰਨ ਨ ਕੋਊ ॥"
page = 250
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "None is separate from the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਭੀ ਸੱਚੇ ਸੁਆਮੀ ਨਾਲੋਂ ਵੱਖਰਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one is separate from the True Primal Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਪੁਰਖ ਪਰਮੇਸ੍ਵਰ ਤੇ ਨ੍ਯਾਰਾ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਸਦਾ-ਥਿਰ ਵਿਆਪਕ ਪ੍ਰਭੂ ਤੋਂ ਵੱਖਰੀ ਹਸਤੀ ਵਾਲਾ ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No, nadie está separado del Verdadero Purusha."