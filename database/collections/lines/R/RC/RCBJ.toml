[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਪਰ ਦੂਖਨਾ ਕਰਹਿ ॥"
page = 275
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many myriads indulge in slandering others."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਕ੍ਰੋੜ ਹੋਰਨਾਂ ਦੀ ਨਿੰਦਾ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions slander others."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਕਈ ਕ੍ਰੋੜੋਂ (ਪਰ) ਅੰਨ ਪੁਰਸੋਂ ਮੇਂ ਵਿਸੇਸ ਕਰ ਕੇ ਦੂਖਣੋਂ ਕੌ ਹੀ ਅਰੋਪਣ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਰੋੜਾਂ ਹੀ ਦੂਜਿਆਂ ਦੀ ਨਿੰਦਿਆ ਕਰਦੇ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਖਨਾ = ਨਿੰਦਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones son los envidiosos que calumnian a otros."