[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਚੀ ਕਲ ਸਰੋਸਰੀ; ਕਲ ਨਾਰਦ ਡਉਰੂ ਵਾਇਆ ॥"
page = 120

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The discord danced over all the heads and Kal and Narad sounded their tabor."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹਰ ਇਕ ਦੇ) ਸਿਰ ਉਤੇ ਕਲਹ-ਕਲੇਸ਼ ਸਵਾਰ ਹੋ ਗਿਆ ਅਤੇ ਕਲ ਅਤੇ ਨਾਰਦ ਨੇ ਡਉਰੂ ਵਜਾ ਦਿੱਤਾ।"