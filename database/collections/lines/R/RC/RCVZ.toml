[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਵ ਰੰਕ ਜਾ ਕੋ ਸਦਾ; ਨਿਸ ਦਿਨ ਜਾਪਹਿ ਜਾਪ ॥੧॥"
page = 884

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All, the rich and the poor, revered him.(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਅਮੀਰ ਗ਼ਰੀਬ ਰਾਤ ਦਿਨ ਜਾਪ ਜਪਦੇ ਰਹਿੰਦੇ ਸਨ ॥੧॥"