[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੋਜਨ ਕੈ ਟਿਕ ਗੇ ਹਰਿ ਜੀ; ਪਲਕਾ ਪਰ ਅਉਰ ਕਰੈ ਜੁ ਕਹਾਨੀ ॥"
page = 311

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Krishna slept after taking meal and dreamt that after drinking good deal of water,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਭੋਜਨ ਕਰ ਕੇ ਮੰਜੀ ਉਤੇ ਸੌਂ ਗਏ ਅਤੇ (ਮਾਤਾ) ਕਹਾਣੀ ਕਰਨ ਲਗ ਗਈ।"