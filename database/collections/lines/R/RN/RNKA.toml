[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਸਭਾ ਕੀ; ਲਗਹੁ ਸੇਵ ॥੩॥"
page = 1182
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is obtained by being yoked to the service of the society of saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਤਿਸੰਗਤ ਦੀ ਸੇਵਾ ਟਹਿਲ ਅੰਦਰ ਜੁੜਨ ਦੁਆਰਾ ਪ੍ਰਾਪਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "To find Him, commit yourself to the service of the Society of the Saints. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਇਹ ਹੈ ਕਿ ਸੰਤ ਸਭਾ ਕੀ ਸੇਵਾ ਮੇਂ ਲਗੋ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਦੀ ਸੇਵਾ ਕਰਿਆ ਕਰ (ਸਾਧ ਸੰਗਤ ਵਿਚੋਂ ਹੀ ਨਾਮ-ਸਿਮਰਨ ਦੀ ਦਾਤ ਮਿਲਦੀ ਹੈ) ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "dedica tu vida entonces a la Sociedad de los Santos. (3)"