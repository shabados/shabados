[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੋ ਕਉ; ਇਹ ਬਿਧਿ ਕੋ ਸਮਝਾਵੈ ॥"
page = 215
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who can make me understand this state?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਇਸ ਦਸ਼ਾ ਨੂੰ ਕੌਣ ਸਮਝਾ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who can help me understand my condition?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਸ਼ਨ: ਮੇਰੇ ਕੋ ਇਹ ਬਿਧੀ ਜੋ ਆਗੈ ਪੂਛਨੀ ਹੈ ਕੌਣ ਸਮਝਾਵੈ, ਵਾ ਕੋਈ ਸਮਝਾਇ ਦੇਵੇ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਹੋਰ ਕੌਣ ਮੈਨੂੰ ਇਸ ਤਰ੍ਹਾਂ ਸਮਝ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋ ਕਉ = ਮੈਨੂੰ। ਕੋ = ਕੌਣ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Quién me puede revelar el Misterio del Señor Creador?"