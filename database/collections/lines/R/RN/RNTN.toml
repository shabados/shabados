[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਾ ਕੀਆ; ਸਭੁ ਕਿਛੁ ਹੋਇ ॥"
page = 182
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose doing, everything is done,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਕਰਨ ਦੁਆਰਾ ਸਭ ਕੁਝ ਹੋ ਆਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everything is done by His doing;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜਿਸ ਕਾ ਕੀਆ ਹੂਆ ਸਭ ਕਿਛੁ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰਮਾਤਮਾ ਦਾ ਕੀਤਾ ਹੋਇਆ ਹੀ (ਜਗਤ ਵਿਚ) ਸਭ ਕੁਝ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél, El que realiza lo que Le place."