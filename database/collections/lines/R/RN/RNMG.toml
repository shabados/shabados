[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਥਿਆ ਤਨੁ ਧਨੁ; ਕੁਟੰਬੁ ਸਬਾਇਆ ॥"
page = 268
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Perishable are the body, wealth and all the relations."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਸਵੰਤ ਹਨ ਦੇਹਿ, ਦੌਲਤ ਅਤੇ ਸਾਰੇ ਸਨਬੰਧੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "False are body, wealth, and all relations."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਇਹੁ (ਤਨੁ) ਸਰੀਰ ਔਰ ਧਨ ਸੰਪੂਰਨ ਕੁਟੰਬ ਮਿਥਿਆ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਦ ਇਹ) ਸਰੀਰ, ਧਨ ਤੇ ਸਾਰਾ ਪਰਵਾਰ ਨਾਸਵੰਤ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਥਿਆ = ਸਦਾ ਨਾਹ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ, ਜਿਸ ਦਾ ਮਾਣ ਕਰਨਾ ਝੂਠਾ ਹੋਵੇ। ਕੁਟੰਬੁ = ਪਰਵਾਰ। ਸਬਾਇਆ = ਸਾਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todo amor propio, tal como el apego a los bienes materiales, a los parientes y a las cosas,"