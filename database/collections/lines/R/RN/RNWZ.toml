[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਘੇਰ ਲਯੋ ਹਰਿ ਨੈਕੁ ਨ ਡਰੇ ॥"
page = 475

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then all the enemies were filled with rage and they fearlessly surrounded Krishna"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਅਤੇ ਉਨ੍ਹਾਂ ਨੇ) ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਨੂੰ ਘੇਰ ਲਿਆ ਹੈ, ਪਰ ਬਿਲਕੁਲ ਡਰੇ ਨਹੀਂ ਹਨ।"