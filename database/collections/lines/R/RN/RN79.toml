[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਥਿਆ ਰਥ ਹਸਤੀ; ਅਸ੍ਵ ਬਸਤ੍ਰਾ ॥"
page = 268
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Perishable are chariots, elephants, horses and raiments."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਸਵੰਤ ਹਨ ਸੁੰਦਰ ਗੱਡੀਆਂ, ਹਾਥੀ, ਘੋੜੇ ਅਤੇ ਪੁਸ਼ਾਕਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "False are chariots, elephants, horses and expensive clothes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਰਥ ਔ ਹਾਥੀ, (ਅਸ੍ਵ) ਘੋੜੇ, ਬਸਤ੍ਰ ਆਦਿਕ ਭੀ ਸਭ ਝੂਠੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਥ, ਹਾਥੀ, ਘੋੜੇ ਤੇ (ਸੁੰਦਰ) ਕੱਪੜੇ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਨਹੀਂ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਸਤੀ = ਹਾਥੀ। ਅਸ੍ਵ = ਘੋੜੇ। ਬਸਤ੍ਰਾ = ਕੱਪੜੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tampoco durarán sus carruajes, caballos y elefantes,"