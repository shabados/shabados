data = "ਐਸਾ ਦੀਵਾ; ਨੀਰਿ ਤਰਾਇ ॥"
page = 878
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Float thou such a lamp on the water."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਐਹੋ ਜਿਹਾ ਚਰਾਗ ਪਾਣੀ ਉਤੇ ਤਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Float such a lamp upon the water;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤੂੰ ਐਸਾ ਦੀਵਾ ਜਲ ਪਰ ਤਾਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਤੂੰ ਪਾਣੀ ਉਤੇ ਇਹੋ ਜੇਹਾ ਦੀਵਾ ਤਾਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੀਰਿ = ਪਾਣੀ ਉਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Esa Luz es la que te hace nadar a través del mar de la existencia,"