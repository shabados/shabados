[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੈ ਸੰਗਿ; ਸਗਲ ਨਿਸਤਾਰਾ ॥੩॥"
page = 864
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the Guru's association all are emancipated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਸੰਗਤ ਅੰਦਰ ਸਾਰੇ ਪਾਰ ਉਤਰ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With the Guru, all are saved. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਸੰਗ ਕਰ ਕੇ ਸਕਲ ਜਾਤੀ ਕਾ ਨਿਸਤਾਰਾ ਹੋਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਰਿਹਾਂ ਸਾਰੇ ਜੀਵਾਂ ਦਾ ਪਾਰ-ਉਤਾਰਾ ਹੋ ਜਾਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ ਸੰਗਿ = ਦੀ ਸੰਗਤਿ ਵਿਚ। ਸਗਲ = ਸਾਰੇ ਜੀਵ। ਨਿਸਤਾਰਾ = ਪਾਰ-ਉਤਾਰਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es en la asociación con el Guru que uno es totalmente redimido. (3)"