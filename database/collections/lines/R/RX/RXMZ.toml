[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਤ ਭੂਲਹੁ. ਮਾਨੁਖ ਜਨ; ਮਾਇਆ ਭਰਮਾਇਆ ॥"
page = 812
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Be thou not led astray, O mortal by the illusion of worldly valuables."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰੀ ਪਦਾਰਥਾਂ ਦੇ ਵਲਛਲ ਦੁਆਰਾ, ਹੇ ਪ੍ਰਾਣੀ! ਤੂੰ ਕੁਰਾਹੇ ਨਾਂ ਪਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Don't be fooled, O mortal being, by the illusion of Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨੁਖ ਜਨੋ! ਮਾਇਆ ਕੇ ਭ੍ਰਮਾਏ ਹੂਏ ਮਤ ਹਰੀ ਕੇ ਨਾਮ ਸੇ ਭੂਲੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨੁੱਖੋ! ਮਾਇਆ ਦੀ ਭਟਕਣਾ ਵਿਚ ਪੈ ਕੇ ਇਹ ਗੱਲ ਭੁੱਲ ਨਾਹ ਜਾਣੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਨੁਖ ਜਨ = ਹੇ ਮਨੁੱਖੋ! ਮਾਇਆ ਭਰਮਾਇਆ = ਮਾਇਆ ਦੀ ਭਟਕਣਾ ਵਿਚ ਪੈ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh seres humanos, no se dejen desviar por la ilusión de Maya,"