[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਨਿ ਪਰਿਓ ਨਾਨਕ ਪ੍ਰਭ ਤੁਮਰੀ; ਦੇ ਰਾਖਿਓ ਹਰਿ ਹਾਥ ॥੪॥੨॥੩੨॥"
page = 503
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak has entered Thy asylum O Master and giving His hand God has protected Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੇ ਤੇਰੀ ਓਟ ਲਈ ਹੈ, ਹੇ ਮਾਲਕ! ਆਪਣਾ ਹੱਥ ਦੇ ਕੇ ਵਾਹਿਗੁਰੂ ਨੇ ਉਸ ਨੂੰ ਬਚਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak has entered Your Sanctuary, God; giving him His hand, the Lord has protected him. ||4||2||32||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਤੇਰੀ ਸਰਨਿ ਪੜਾ ਹੂੰ ਔਰੁ ਹੇ ਹਰੀ! ਤੁਮ ਨੇ ਹਮਾਰੇ ਸਿਰ ਪਰ ਹਾਥ ਦੇ ਰਖਾ ਹੈ॥੪॥੨॥੩੨॥੭॥੭॥੪੮॥☬ਕਾਮਾਦਿਕੋਂ ਕੇ ਪ੍ਰਤਿ ਬੰਧਕ ਦੇਖਾਵਤੇ ਹੂਏ ਵਿਰਾਟ ਰੂਪ ਕਾ ਕਥਨ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਆਖ-) ਹੇ ਪ੍ਰਭੂ! ਜੇਹੜਾ ਮਨੁੱਖ ਤੇਰੀ ਸਰਨ ਆ ਪਿਆ, ਹੇ ਹਰੀ! ਤੂੰ ਉਸ ਨੂੰ ਆਪਣੇ ਹੱਥ ਦੇ ਕੇ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਬਚਾਂਦਾ ਹੈਂ ॥੪॥੨॥੩੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭੂ = ਮਾਲਕ। ਦੇ = ਦੇ ਕੇ। ਹਰਿ = ਹੇ ਹਰੀ! ॥੪॥੨॥੩੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak busca Tu Refugio; protégelo con Tus Manos. (4‑2-32)"