type = "primary"
data = "ਗਯੋ ਬਾਲਮੀਕੰ ਰਿਖਿਸਥਾਨ ਤਾਜੀ ॥"
page = 276

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Wandering in the four direction the horse also reached the hermitage of the sage Valmiki"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਘੋੜਾ ਬਾਲਮੀਕ ਰਿਸ਼ੀ ਦੇ ਸਥਾਨ 'ਤੇ ਚਲਾ ਗਿਆ।"