[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧਸੰਗਮਿ ਹਰਿ ਅਰਾਧੇ; ਸਗਲ ਕਲਮਲ ਦੁਖ ਜਲੇ ॥"
page = 548
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meditating on God in the saints society, all my sins and suffering are burnt off."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਅੰਦਰ ਵਾਹਿਗੁਰੂ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ ਮੇਰੇ ਸਾਰੇ ਪਾਪ ਤੇ ਦੁਖੜੇ ਸੜ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Worshipping the Lord in the Saadh Sangat, all my sins and sufferings are burnt away."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਮੇਂ ਹਰਿ ਕਾ ਅਰਾਧਨ ਕਰ ਕੇ ਤੇਰੇ ਸਭ (ਕਲਮਲ) ਪਾਪ ਅਰ ਦੁਖ ਭਸਮ ਹੋ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰੂ ਦੀ ਸੰਗਤ ਵਿਚ ਟਿਕ ਕੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਦਾ ਰਹਿੰਦਾ ਹੈ ਉਸ ਦੇ ਸਾਰੇ ਪਾਪ ਸਾਰੇ ਦੁੱਖ ਸੜ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗਮਿ = ਸੰਗਤ ਵਿਚ। ਕਲਮਲ = ਪਾਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y ahí contemplo a mi Señor y me deshago de mis faltas y de mis aflicciones."