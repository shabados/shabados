[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੇ ਗੁਣ; ਹਿਰਦੈ ਉਰ ਧਾਰਹਿ ॥"
page = 1067
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's virtues, they enshrine in their mind and heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੀਆਂ ਨੇਕੀਆਂ ਉਹ ਆਪਣੇ ਮਨ ਤੇ ਦਿਲ ਵਿੱਚ ਟਿਕਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They enshrine the Lord's Glories in their hearts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਗੁਣ ਬਡੇ ਜਾਨ ਕੇ ਤਿਨੋਂ ਨੇ ਰਿਦੇ ਮੇਂ ਧਾਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਟਿਕਾਈ ਰੱਖਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਿਰਦੈ = ਹਿਰਦੇ ਵਿਚ। ਉਰ = ਹਿਰਦਾ। ਧਾਰਹਿ = ਵਸਾ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "su muerte queda santificada y enaltecen las Virtudes del Señor en su corazón."