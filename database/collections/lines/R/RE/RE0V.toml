data = "ਚੁ ਖ਼ੁਸ਼ ਗਸ਼ਤ ਸ਼ੌਹਰ ਨ ਦੀਦਸ਼ ਚੁ ਨਰ ॥"
page = 1428

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Her husband was satisfied that there was no other person there"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ (ਉਥੇ) ਕੋਈ ਹੋਰ ਮਰਦ ਨਾ ਦਿਸਿਆ, ਤਾਂ ਪਤੀ ਖ਼ੁਸ਼ ਹੋ ਕੇ ਪਰਤ ਗਿਆ"