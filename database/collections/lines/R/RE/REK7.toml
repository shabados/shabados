[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੇ ਬਚਨ ਅਮਰ ਜੀਵਨ ਦਾ ਪਾਠ ਹਨ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਹਰਫ਼ਿ ਸ਼ਾਂ ਤਾਅਲੀਮਿ ਉਮਰਿ ਜਾਵਿਦਾਂ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And thousands of Asfand Yaars, the son of Gustapus who was blinded by Rustam with his arrow and then killed, are his slaves. (43)"