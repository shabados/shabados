data = "ਮੰਡਿਯੋ ਜੁਧੁ ਬਹੁਰਿ ਬਿਧਿ ਨਾਨਾ ॥੨੫॥"
page = 190

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Now, Rudra getting mightier than before began to wage wr.25."

