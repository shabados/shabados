type = "primary"
data = "ਨਟ ਨਾਰਾਇਨ ਮਹਲਾ ੫ ਦੁਪਦੇ ॥"
page = 978
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nat Narain. 5th Guru Dupadas."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਟ ਨਾਰਾਇਨ। ਪੰਜਵੀਂ ਪਾਤਸ਼ਾਹੀ ਦੁਪਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Nat Naaraayan, Fifth Mehl, Dho-Padhay:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਨਟ-ਨਾਰਾਇਨ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਦੋ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Nat, Narayan, Mejl Guru Aryan, Quinto Canal Divino, Du-Padas."