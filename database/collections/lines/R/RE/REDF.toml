[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਆਏ ਸੇ ਪਰਵਾਣੁ ਹੈ; ਜਿਨ ਹਰਿ ਵੁਠਾ ਚਿਤਿ ॥"
page = 320
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Acceptable is the advent of those within whose mind the Lord abides."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੂਲ ਹੈ, ਉਨ੍ਹਾਂ ਦਾ ਆਗਮਨ, ਜਿਨ੍ਹਾਂ ਦੇ ਮਨ ਵਿੱਚ ਪ੍ਰਭੂ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, approved is the birth of those, within whose consciousness the Lord abides."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਸੋ ਪੁਰਸ ਆਏ ਪਰਵਾਣ ਹੈਂ ਜਿਨੋਂ ਕੇ ਚਿਤ ਮੇਂ ਹਰੀ (ਵੁਠਾ) ਵਸਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਦੇ ਚਿੱਤ ਵਿਚ ਪਰਮਾਤਮਾ ਆ ਵੱਸਿਆ ਹੈ ਉਹਨਾਂ ਦਾ ਆਉਣਾ ਸਫਲ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Auspicioso es el advenimiento al mundo de aquél que enaltece al Señor en su mente."