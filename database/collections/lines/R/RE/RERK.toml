[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਊਚ ਨੀਚ ਕਾਤਰ ਸੁਭਟ; ਸਭ ਕੀਨੇ ਇਕ ਸਾਰ ॥੧੭॥"
page = 973

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The strong, the weak, the brave and the coward were becoming indistinguishable.( 17)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਰ ਕੇ ਉੱਚੇ ਨੀਵੇਂ, ਬਹਾਦਰ ਅਤੇ ਡਰਪੋਕ ਸਭ ਇਕ ਸਮਾਨ ਹੋ ਗਏ ॥੧੭॥"