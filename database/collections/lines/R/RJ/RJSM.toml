[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਜਾਚਾਰ ਕਰਤ ਮੇਲੰਗਾ ॥"
page = 1305
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sitting cross-legged they perform worship and good-deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੌਕੜੀ ਮਾਰ ਕੇ ਬੈਠ ਉਹ ਉਪਾਸ਼ਨਾ ਅਤੇ ਚੰਗੇ ਕਰਮ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They sit cross-legged, perform worship services and do good deeds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅੰਗੋਂ ਕੋ (ਮੇਲ) ਸੰਕੋਚ ਕਰ ਕੇ ਪੂਜਾ ਕਾ ਆਚਾਰ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਆਸਣ ਜਮਾ ਦੇ ਪੂਜਾ ਆਦਿਕ ਦੇ ਕਰਮ ਕਰਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਜਾਚਾਰ = ਪੂਜਾ-ਆਚਾਰ, ਪੂਜਾ ਆਦਿਕ ਦੇ ਕਰਮ। ਮੇਲੰਗਾ = ਅੰਗਾਂ ਨੂੰ ਮੇਲ ਕੇ, ਆਸਣ ਜਮਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Se sientan con las piernas cruzadas, realizando servicios de alabanza y haciendo buenas obras,"