[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਵਡਭਾਗੀ ਪਾਈਐ ॥੪॥੬॥"
page = 1339
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, it is only through the supreme good fortune that the Lord is attained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਫਰਮਾਉਂਦੇ ਹਨ, ਸੁਆਮੀ ਪਰਮ ਚੰਗੇ ਕਰਮਾਂ ਰਾਹੀਂ ਹੀ ਪਾਇਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, by great good fortune, He is found. ||4||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਸੋ ਨਾਮ ਕਾ ਜਪ ਵਡੇ ਭਾਗੋਂ ਕਰ ਪਾਈਤਾ ਹੈ॥੪॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ, ਨਾਨਕ ਆਖਦਾ ਹੈ- ਇਹ ਦਾਤ ਵੱਡੀ ਕਿਸਮਤ ਨਾਲ ਮਿਲਦੀ ਹੈ ॥੪॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਈਐ = ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ ॥੪॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, por una grandiosa Fortuna Dios es encontrado. (4-6)"