[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਸਿ ਬਾਸੁਰ; ਪ੍ਰਿਅ ਸੰਗਿ ਅਨੰਦ ॥੨॥"
page = 372
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day, I make merry, with my Beloved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੈਣ ਦਿਹੂੰ, ਮੈਂ ਆਪਣੈ ਪ੍ਰੀਤਮ ਨਾਲ ਅਨੰਦ ਮਾਣਦੀ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, I have fun with my Beloved. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਪ੍ਯਾਰੇ ਕੇ ਸੰਗ ਮਿਲ ਕਰ ਕੇ ਮੈਂ ਰਾਤ ਦਿਨ ਆਨੰਦ ਕੋ ਪ੍ਰਾਪਤ ਹੋ ਰਹੀ ਹੂੰ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਰਾਤ ਦਿਨ ਪਿਆਰੇ (ਪ੍ਰਭੂ-ਪਤੀ) ਨਾਲ ਆਨੰਦ ਮਾਣ ਰਹੀ ਹਾਂ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਸਿ = ਰਾਤ। ਬਾਸੁਰ = ਦਿਨ। ਸੰਗਿ = ਨਾਲ, ਸੰਗਤਿ ਵਿਚ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y noche y día me regocijo con mi Esposo Divino. (2)"