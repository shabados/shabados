data = "ਹੱਥ ਵਿਚ ਤਲਵਾਰ ਧਾਰਨ ਕਰਨ ਵਾਲੀ, ਮਾਣ ਪ੍ਰਾਪਤ ਕਰਾਉਣ ਵਾਲੀ, ਦੇਵਤਿਆਂ ਦੀ ਸ਼ਕਤੀ,"