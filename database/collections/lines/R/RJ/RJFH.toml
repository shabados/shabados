[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੀਮਤਿ ਪਾਈ ਪਾਵਣਹਾਰੈ ॥"
page = 1036
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Appraiser Himself appraises the Thing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਲ ਪਾਉਣਹਾਰ ਖ਼ੁਦ ਹੀ ਚੀਜ਼ ਦਾ ਮੁਲ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Appraiser appraises its value."

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਦਰ ਸਮਝਣ ਵਾਲਾ ਪ੍ਰਭੂ ਹੀ ਆਪਣੇ ਨਾਮ-ਰਤਨ ਦੀ ਕਦਰ ਪਾ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo da valor al Nombre, y mira, tan Independiente es Él que Su Tesoro es Inagotable."