[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਧਾਇ ਪਰਿਯੋ ਕਰਿ ਲੈ ਬਰਛਾ; ਲਲਕਾਰ ਕੈ ਸ੍ਰੀ ਹਰਿ ਊਪਰਿ ਝਾਰਿਯੋ ॥"
page = 407

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Ran Singh was killed with the dagger, then Dhan Singh ran in fury and taking his spear in his hand white shouting, he inflicted a blow on Krishna"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੱਥ ਵਿਚ ਬਰਛਾ ਲੈ ਕੇ ਆ ਪਿਆ ਅਤੇ ਲਲਕਾਰਾ ਮਾਰ ਕੇ ਕ੍ਰਿਸ਼ਨ ਉਪਰ ਝਾੜ ਦਿੱਤਾ।"