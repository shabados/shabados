[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੋਰ ਹੁਤੇ ਗਰਜੈ ਲਰਜੈ; ਬਰਜੈ ਸਭ ਲੋਗ ਰਹੈ ਨਹਿ ਠਾਨੀ ॥"
page = 860

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In the morning, the stream was roaring and the people came there to watch,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਸਵੇਰ ਹੋਣ ਤੇ ਗੱਜਣ (ਅਰਥਾਤ ਬਕਵਾਦ ਕਰਨ) ਅਤੇ ਲੜਨ ਲਗ ਜਾਂਦੀ ਹੈ। ਸਭ ਲੋਕ ਮੰਨਾ ਕਰ ਥਕਦੇ ਹਨ, (ਪਰ ਉਹ) ਰੁਕਦੀ ਨਹੀਂ ਹੈ।"