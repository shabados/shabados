[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਰਸੁ; ਜਨ ਚਾਖਹੁ ਜੇ ਭਾਈ ॥"
page = 733
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O brother saint, if thou tastest God's ambrosia;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਵੀਰ ਸਾਧੂਆ! ਜੇਕਰ ਤੂੰ ਵਾਹਿਗੁਰੂ ਦੇ ਅੰਮ੍ਰਿਤ ਨੂੰ ਚੱਖ ਲਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If you taste the subtle essence of the Lord, O humble Siblings of Destiny,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ ਜਨੋਂ! ਜੇ ਹਰੀ ਕੇ ਰਸ ਕੋ ਚਾਖੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਿਆਰੇ ਸੱਜਣੋ! ਜੇ ਤੁਸੀ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਸੁਆਦ ਚੱਖ ਲਵੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਈ ਜਨ = ਹੇ ਭਾਈ ਜਨੋ! ਹੇ ਪਿਆਰੇ ਸੱਜਣੋ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh devoto hermano, si uno probara el Sabor de la Esencia del Señor,"