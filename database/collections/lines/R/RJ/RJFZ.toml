[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਹ ਕਉਨੁ ਕਥੈ; ਕਉਨੁ ਸੁਨਨੈਹਾਰਾ ॥"
page = 291
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who was the utterer and who the hearer then?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉੱਥੇ ਕੌਣ ਕਹਿਣ ਵਾਲਾ ਅਤੇ ਕੌਣ ਸੁਣਨ ਵਾਲਾ ਸੀ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then who spoke and who listened?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਕੌਨ ਕਥਨ ਕਰਤਾ ਔਰ ਕੌਨ ਸੁਨਨੇ ਹਾਰਾ ਥਾ ਅਰਥਾਤ ਕੋਈ ਨਹੀਂ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਕੌਣ ਬੋਲਦਾ ਸੀ, ਤੇ ਕੌਣ ਸੁਣਨ ਵਾਲਾ ਸੀ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Entonces , quien escucho y quien hablo?"