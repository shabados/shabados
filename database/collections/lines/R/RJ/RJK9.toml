[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਜੀਆ ਕਉ ਦੇਵਣਹਾਰਾ ॥"
page = 106
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is the giver of all the living beings."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਸਾਰਿਆਂ ਜੀਵਾਂ ਨੂੰ ਦੇਣਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Giver of all souls."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਵਾਹਿਗੁਰੂ ਸਰਬ ਜੀਵੋਂ ਕੋ ਦਾਨ ਦੇਵਣੇ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਪ੍ਰਭੂ ਸਭ ਜੀਵਾਂ ਨੂੰ ਦਾਤਾਂ ਦੇਣ ਦੀ ਸਮਰੱਥਾ ਰੱਖਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਊ = ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, el Señor, es el Dador de todo;"