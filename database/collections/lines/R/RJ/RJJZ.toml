[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗੁੰਜਤ ਗੂੜ ਗਜਾਨ ਕੇ ਸੁੰਦਰ ਹਿੰਸਤ ਹੈਂ ਹਯਰਾਜ ਹਜਾਰੇ ॥"
page = 13

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Along with many beautiful roaring elephants and thousands of neighing houses of best breed."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੁੰਦਰ ਹਾਥੀਆਂ ਦੇ ਸਮੂਹ ਚਿੰਘਾੜਦੇ ਹੋਣ ਅਤੇ ਹਜ਼ਾਰਾਂ ਹੀ ਸ੍ਰੇਸ਼ਠ ਘੋੜੇ ਹਿਣਕਦੇ ਹੋਣ;"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਗੁੰਜਤ ਗੂੜ ਗਜਾਨ ਕੇ ਸੁੰਦਰ; ਹਿੰਸਤ ਹੀ ਹਯਰਾਜ ਹਜਾਰੇ ॥"