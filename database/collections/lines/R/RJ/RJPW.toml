[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਆਪੁ ਗਵਾਇ ਵਿਗੁਚਣਾ; ਦਰਗਹ ਪਾਏ ਮਾਣੁ ਨਿਮਾਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The man who has eschewed his ego and has subsumed in the Lord is respected in the court of Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਆਪ ਗਣਾਇਕੇ ਖਰਾਬ ਹੋਈਦਾ ਹੈ, ਦਰਗਾਹ ਵਿਖੇ ਨਿਮਾਣਾ ਹੀ ਮਾਣ ਪਾਉਂਦਾ ਹੈ।"