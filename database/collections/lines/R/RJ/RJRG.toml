[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਜੁ ਕਾਲੑਿ. ਤਜਿ ਜਾਹੁਗੇ; ਜਿਉ ਕਾਂਚੁਰੀ ਭੁਯੰਗ ॥੪੦॥"
page = 1366
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou shall leave it today or tomorrow as a serpent does its slough."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਅੱਜ ਜਾ ਭਲਕੇ ਸੱਪ ਦੀ ਆਪਣੀ ਕੁੰਜ ਲਾਹ ਸੁੱਟਣ ਦੀ ਮਾਨੰਦ ਇਸ ਨੂੰ ਛਡ ਜਾਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Today or tomorrow, you will have to leave it behind, like the snake shedding its skin. ||40||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਇਸ ਸੁਰੰਗ ਦੇਹੀ ਕੋ ਆਜ ਕਾਲ ਮੇਂ ਹੀ ਤਿਆਗ ਕਰ ਚਲੇ ਜਾਵੋਗੇ, ਜੈਸੇ ਸਰਪ (ਕਾਂਚੁਰੀ) ਕੁੰਜ ਕੋ ਤਿਆਗ ਜਾਤਾ ਹੈ॥੪੦॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਰੀਰ ਭੀ ਥੋਹੜੇ ਦਿਨਾਂ ਵਿਚ ਹੀ ਛੱਡ ਜਾਉਗੇ ਜਿਵੇਂ ਸੱਪ ਕੁੰਜ ਲਾਹ ਦੇਂਦਾ ਹੈ (ਜਿੰਦ ਤੇ ਸਰੀਰ ਦਾ ਭੀ ਪੱਕਾ ਸਦਾ-ਨਿਭਵਾਂ ਸਾਥ ਨਹੀਂ ਹੈ) ॥੪੦॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਜੁ ਕਾਲ੍ਹ੍ਹਿ = ਅੱਜ-ਕੱਲ, ਅੱਜ-ਭਲਕ, ਥੋਹੜੇ ਹੀ ਚਿਰ ਵਿਚ। ਕਾਂਚੁਰੀ = ਕੁੰਜ। ਭੁਯੰਗ = ਸੱਪ ॥੪੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "hoy, mañana o pasado lo tendrás que dejar como la serpiente que cambia de piel.(40)"