[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰਿ ਬਾਹਰਿ; ਏਕੋ ਜਾਣੈ ॥"
page = 943
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "A. 55: One should deem the One Lord pervading (here and there)or (Within and without)."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉ. 55: ਇਨਸਾਨ ਨੂੰ ਇੱਕ ਸੁਆਮੀ ਨੂੰ ਏਥੇ ਅਤੇ ਓਥੇ ਜਾਂ ਅੰਦਰ ਤੇ ਬਾਹਰ ਵਿਆਪਕ ਜਾਣਨਾ ਉਚਿੱਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Know the One Lord, inside and out."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਅੰਤਰ ਬਾਹਰ ਏਕ ਬ੍ਰਹਮ ਕੋ ਸਮਾਇ ਜਾਣੈ ੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ (ਆਪਣੇ) ਅੰਦਰ ਤੇ ਬਾਹਰ (ਸਾਰੇ ਜਗਤ ਵਿਚ) ਇਕ ਪ੍ਰਭੂ ਨੂੰ (ਮੌਜੂਦ) ਸਮਝਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak el fuego es apagado"