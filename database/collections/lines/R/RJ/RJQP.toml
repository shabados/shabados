[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਟ ਘਟ ਅੰਤਰਿ; ਤੁਮਹਿ ਸਮਾਣੇ ॥੨॥"
page = 1144
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Amongst all the hearts Thou are contained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਦੇ ਦਿਲਾਂ ਅੰਦਰ ਤੂੰ ਹੀ ਰਮਿਆ ਹੋਇਆ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are deep within each and every heart. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਘਟ ਘਟ) ਸਰਬ ਜੀਵੋਂ ਵਿਖੇ ਤੁਮ ਹੀ ਬ੍ਯਾਪਕ ਜਾਨੇ ਹੋ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਹਰੇਕ ਸਰੀਰ ਵਿਚ ਤੂੰ ਹੀ ਮੌਜੂਦ ਹੈਂ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਟ ਘਟ ਅੰਤਰਿ = ਹਰੇਕ ਸਰੀਰ ਵਿਚ। ਤੁਮਹਿ = ਤੂੰ ਹੀ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues eres Tú Quien llena los corazones por todas partes. (2)"