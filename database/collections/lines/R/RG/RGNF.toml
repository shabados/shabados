[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੋਲਾ ਮਾਸਾ; ਰਤਕ ਪਾਇ ॥"
page = 1239
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "with his balance using the weights of a tola, 1/12 of a tola and a jequitery?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਤੋਲੇ ਮਾਸੇ ਅਤੇ ਰੱਤੀ ਦੇ ਵੱਟਿਆ ਨੂੰ ਵਰਤ ਕੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What weights can balance the scale?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਜੇ ਤੋਲਾ ਮਾਸਾ ਰਤਕ ਕੋ ਪਾਇ ਕਰਕੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੋਲੇ ਮਾਸੇ ਰੱਤਕਾਂ ਪਾ ਕੇ (ਇਹ ਤੋਲੇ ਨਹੀਂ ਜਾ ਸਕਦੇ)। (ਇਹੀ ਹਾਲ ਹੋਰ ਮੱਤਾਂ ਤੇ ਗੱਲਾਂ ਦਾ ਸਮਝੋ, ਜੋ, ਮਾਨੋ, ਤੋਲੇ ਮਾਸੇ ਤੇ ਰੱਤਕਾਂ ਹੀ ਹਨ);"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਇ = ਪਾ ਕੇ, ਰੱਖ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ni siquiera su mente intelectual sirve para ello,"