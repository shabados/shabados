type = "primary"
data = "ਚੰਡ ਅਰ ਮੁੰਡ ਪਠਾਏ, ਬਹੁਤਾ ਕਟਕੁ ਦੈ ॥"
page = 123

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Chand and Mund were sent with huge forces."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਫਿਰ) ਚੰਡ ਅਤੇ ਮੁੰਡ ਨੂੰ ਬਹੁਤ ਸਾਰੀ ਸੈਨਾ ਦੇ ਕੇ (ਰਣ-ਭੂਮੀ ਵਲ) ਭੇਜਿਆ ਗਿਆ"