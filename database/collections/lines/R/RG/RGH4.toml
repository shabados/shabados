[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਨਾਮੁ; ਪਤਿਤ. ਪਾਵਨੋ ॥੧॥ ਰਹਾਉ ॥"
page = 1323
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord's Name is the purifier of the sinner. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦਾ ਨਾਮ ਪਾਪੀਆਂ ਨੂੰ ਪਵਿੱਤਰ ਕਰਨ ਵਾਲਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God's Name is the Purifier of sinners. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰਾ ਨਾਮ ਪਾਪੀਓਂ ਕੇ ਪਵਿਤਰ ਕਰਨੇ ਵਾਲਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਵਿਕਾਰੀਆਂ ਨੂੰ ਪਵਿੱਤਰ ਬਣਾਣ ਵਾਲਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ ਨਾਮੁ = ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ। ਪਤਿਤ = ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗੇ ਹੋਏ। ਪਾਵਨ = ਪਵਿੱਤਰ (ਕਰਨ ਵਾਲਾ)। ਪਤਿਤ ਪਾਵਨੋ = ਵਿਕਾਰੀਆਂ ਨੂੰ ਪਵਿੱਤਰ ਕਰਨ ਵਾਲਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre de Dios es el Purificador de los que cometen faltas y viven en el error. (1-Pausa)"