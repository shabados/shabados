[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਨੁਕ ਤੀਰ ਸਿੰਧ ਮਥਿਆਨੀ ॥"
page = 966

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Krishna Kunwar was his principal Rani; she looked like being churned out of the sea of milk."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਛੀਰ ਸਮੁੰਦਰ ਨੂੰ ਮੱਥ ਕੇ ਕਢੀ ਹੋਵੇ।"