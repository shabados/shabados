[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਿਆਨੀ ਧਿਆਨੀ ਆਖਿ ਸੁਣਾਏ ॥"
page = 1045
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This is what the theologians and the visualisers utter an proclaim."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਹੈ ਜੋ ਬ੍ਰਹਮ ਬੇਤੇ ਅਤੇ ਵਿਚਾਰਵਾਨ ਕਹਿੰਦੇ ਅਤੇ ਪੁਕਾਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The spiritual teachers and meditators proclaim this."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗਿਆਨੀ ਔ ਧਿਆਨੀ ਭੀ ਆਖ ਕਰ ਕੇ ਏਹੀ ਸੁਨਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਿਆਣੇ ਮਨੁੱਖ ਤੇ ਸਮਾਧੀਆਂ ਲਾਣ ਵਾਲੇ ਭੀ (ਇਹੀ ਗੱਲ) ਆਖ ਕੇ ਸੁਣਾ ਗਏ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਖਿ = ਆਖ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, esto es lo que los Sabios recitan y proclaman."