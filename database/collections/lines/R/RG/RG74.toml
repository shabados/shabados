[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤ ਜਨਾ ਕਉ; ਦ੍ਰਿਸਟਿ ਨ ਪੇਖਾ ॥੪॥"
page = 393
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "but the saintly persons, they see not with the eye."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰ ਨੇਕ ਪੁਰਸ਼ ਨੂੰ ਅੱਖ ਨਾਲ ਨਹੀਂ ਵੇਖਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but they cannot even see the Lord's humble devotees. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਭਗਤ ਜਨੋਂ ਕੀ ਓਰ ਤਿਨੋਂ ਨੇ ਨੇਤ੍ਰ ਉਠਾਇ ਕਰ ਭੀ ਨਹੀਂ ਦੇਖਾ ਹੈ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਕਰਨ ਵਾਲਿਆਂ ਬੰਦਿਆਂ ਵਲ ਉਹ ਅੱਖ ਪੁੱਟ ਕੇ ਭੀ ਨਹੀਂ ਤੱਕ ਸਕਦੇ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਦ੍ਰਿਸਟਿ ਨ ਪੇਖਾ = ਨਿਗਾਹ ਮਾਰ ਕੇ ਭੀ ਨਹੀਂ ਵੇਖ ਸਕਦੇ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no ponen sus ojos en los Devotos del Señor. (4)"