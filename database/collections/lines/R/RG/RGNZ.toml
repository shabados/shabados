[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਤਿ; ਬਾਪੁ ਖੇਲਾਇਆ ॥"
page = 1194
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The son makes his father play."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੁੱਤ੍ਰ ਆਪਣੇ ਪਿਤਾ ਨੂੰ ਖਿਡਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The son leads his father in play."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਬਾਪੁ) ਈਸਰ ਨੇ ਮਨ ਪੁਤ੍ਰ ਕੋ ਖਿਲਾਯਾ, ਭਾਵ ਸੱਤਾ ਦੇ ਕਰ ਬਿਚਰਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨ-ਪੁੱਤਰ ਨੇ ਪਿਉ-ਜੀਵਾਤਮਾ ਨੂੰ ਖੇਡੇ ਲਾਇਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਤਿ = ਪੁੱਤਰ (ਮਨ) ਨੇ। ਖੇਲਾਇਆ = ਖੇਡੇ ਲਾਇਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sobrepasa aún a su padre, el Alma y la hace mamar la leche del deseo,"