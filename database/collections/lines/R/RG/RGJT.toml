[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਗਰੁ ਅਗਮੁ ਅਥਾਹੁ ਮਥਿ; ਚਉਦਹ ਰਤਨ ਅਮੋਲ ਕਢਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "It is said that after churning the Unfathomable Ocean, fourteen jewels were brought out of it."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅਗਮ ਅਤੇ ਅਥਾਹ ਸਾਗਰ ਨੂੰ ਰਿੜਕਵਾਕੇ ਚੌਦਹ ਅਮਲੋਕ (ਦੇਵਤੇ ਅਤੇ ਦਾਨਵਾਂ ਪਾਸੋਂ) ਕਢਵਾਏ।"