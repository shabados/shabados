[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਬਖਸੰਦ; ਦੀਨ ਦਇਆਲ ॥"
page = 290
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is the Pardoner and Merciful to the meek."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਮਾਫ ਕਰ ਦੇਣ ਵਾਲਾ ਅਤੇ ਮਸਕੀਨਾ ਤੇ ਮਿਹਰਬਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God, the Forgiving Lord, is kind to the poor."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਬਖਸਿੰਦ ਦੀਨ ਦਇਆਲ! ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਖ਼ਸ਼ਨਹਾਰ ਪ੍ਰਭੂ! ਹੇ ਗਰੀਬਾਂ ਤੇ ਤਰਸ ਕਰਨ ਵਾਲੇ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ ਬਖਸੰਦ = ਹੇ ਬਖ਼ਸ਼ਨਹਾਰ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios, el Señor Compasivo, es Bondadoso con los desamparados;"