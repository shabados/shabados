[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਰ ਮਹਿ ਵਸਤੁ; ਅਗਮ ਅਪਾਰਾ ॥"
page = 1175
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within the house is an inaccessible and infinite commodity."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਾਮ ਦੇ ਅੰਦਰ ਹੀ ਅਪੁਜ ਅਤੇ ਅਨੰਤ ਵਸਤੂ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Within the home of the inner self is the inaccessible and infinite substance."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਅਗਮ ਅਪਾਰਾ) ਪਰਮੇਸ੍ਵਰ ਰੂਪ ਵਸਤੂ ਰਿਦੇ ਮੇਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਪਹੁੰਚ ਅਤੇ ਬੇਅੰਤ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਪਦਾਰਥ (ਮਨੁੱਖ ਦੇ) ਹਿਰਦੇ ਵਿਚ ਹੀ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਸਤੁ = ਹਰਿ-ਨਾਮ ਪਦਾਰਥ। ਅਗਮ ਅਪਾਰਾ ਵਸਤੁ = ਅਪਹੁੰਚ ਤੇ ਬੇਅੰਤ ਹਰੀ ਦਾ ਨਾਮ-ਪਦਾਰਥ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En el interior del ser está el Infinito, lo Insondable,"