data = "(ਇਸ ਤਰ੍ਹਾਂ ਇਹ) ਸਾਰੇ ਨਾਮ 'ਸਿਲੀਮੁਖ' (ਤੀਰ) ਦੇ ਬਣਦੇ ਜਾਂਦੇ ਹਨ ॥੭੭॥"