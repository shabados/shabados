[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਖਨਹਾਰੁ; ਸਮ੍ਹਾਰਿ ਜਨਾ ॥"
page = 913
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man, remember thou thy Protector-Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੰਦੇ! ਤੂੰ ਆਪਣੀ ਰੱਖਿਆ ਕਰਨ ਵਾਲੇ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Contemplate your Savior Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੁਰਸ਼! ਤੂੰ ਤਿਸ ਰਖਿਆ ਕਰਨਹਾਰੇ ਕੋ ਸੰਭਾਲ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਰੱਖਿਆ ਕਰ ਸਕਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਨੂੰ ਯਾਦ ਕਰਿਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਮ੍ਹਾਰਿ = ਸੰਭਾਲ, ਯਾਦ ਰੱਖ। ਜਨਾ = ਹੇ ਜਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Alaba a ese Señor, tu Protector,"