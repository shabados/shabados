[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧ ਕੈ ਸੰਗਿ; ਸਦਾ ਪਰਫੁਲੈ ॥"
page = 271
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the society of saints the mortal ever flowers."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤਾਂ ਦੀ ਸੰਗਤ ਅੰਦਰ ਪ੍ਰਾਣੀ ਹਮੇਸ਼ਾਂ ਫਲਦਾ ਫੁਲਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Company of the Holy, one flourishes forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੇ ਸੰਗ ਸੇ ਮਨ ਸਦਾ ਪ੍ਰਫੁਲਤ ਰਹਿਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮਨੁੱਖ ਸਦਾ ਖਿੜੇ ਮੱਥੇ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਫੁਲੈ = ਖਿੜਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y su vida desborda Plenitud."