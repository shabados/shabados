[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਭਜਿ; ਪਰਿ ਹੈ ਗੁਰ ਕੀ ਸਰਨਾ ॥"
page = 1165
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he hastens and enters the Guru's sanctuary."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਦੌੜ ਕੇ ਗੁਰਾਂ ਦੀ ਸ਼ਰਣਾਗਤ ਆ ਪੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "hurries to enter the Guru's Sanctuary."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਇਸ ਤਰਫੋਂ ਮੁੜ ਕੇ ਦੌੜ ਕਰ ਕੇ ਸਤਿਗੁਰੋਂ ਕੀ ਸਰਨ ਕੋ ਪ੍ਰਾਪਤ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ (ਵਿਕਾਰਾਂ ਵਲੋਂ) ਹਟ ਕੇ ਸਤਿਗੁਰੂ ਦੀ ਸ਼ਰਨ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਜਿ = ਦੌੜ ਕੇ। ਪਰਿ ਹੈ = ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "se acerca al Santuario del Guru."