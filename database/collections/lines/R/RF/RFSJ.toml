[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਿਤੜੇ ਦਰਜੀ ਧੋਬੀਆਂ; ਕਿਤੜੇ ਜਰ ਲੋਹੇ ਸਿਰ ਹਾਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many are tailors, washermen, and goldplaters."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਿਤਨੇ ਦਰਜੀ ਛੀਂਬੇ ਤਸ ਲੋਹੇ ਉਤੇ ਸੋਨੇ ਦਾ ਕੰਮ ਕਰਨ ਵਾਲੇ।"

[[content]]
assets = ["VBGS"]
type = "note"
language = "pa"
data = "ਜ਼ਰ ਲੋਹੇ ਸਿਰ ਹਾਰੀ=ਮੁਲੱਮਾ ਕਰਨ ਵਾਲੇ, ਸੋਨਾ ਲੋਹੇ ਤੇ ਚੜ੍ਹਾਉਣ ਵਾਲੇ।"