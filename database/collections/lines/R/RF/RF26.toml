[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧਸੰਗਿ; ਸਰਪਰ ਨਿਸਤਰੈ ॥"
page = 272
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the guild of saints he is assuredly saved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿ ਸੰਗਤ ਅੰਦਰ ਉਹ ਨਿਸਚਿਤ ਹੀ ਪਾਰ ਉੱਤਰ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Company of the Holy, you shall surely be saved."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੇ ਸੰਗ ਕਰ ਸਰਪਰ ਅਰਥਾਤ ਨਿਸਚੇ ਕਰ ਕੇ ਤਰ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਜਨਾਂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਮਨੁੱਖ ਜ਼ਰੂਰ (ਵਿਕਾਰਾਂ ਤੋਂ) ਬਚ ਨਿਕਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਪਰ = ਜ਼ਰੂਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En la Compañía de los Santos, de seguro serás salvado."