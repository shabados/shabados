[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਰਨਿ ਨ ਸਾਕਉ. ਤੁਮਰੇ ਰੰਗਾ; ਗੁਣ ਨਿਧਾਨ ਸੁਖਦਾਤੇ ॥"
page = 207
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I cannot describe Thine manifestations, O Treasure of Merits and Bestower of Peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੇ ਕੌਤਕ ਬਿਆਨ ਨਹੀਂ ਕਰ ਸਕਦਾ ਹੈ ਖੁਬੀਆਂ ਦੇ ਖ਼ਜ਼ਾਨੇ ਅਤੇ ਠੰਡ-ਚੈਨ ਬਖਸ਼ਣਹਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I cannot describe Your Manifestations, O Treasure of Excellence, O Giver of peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਨੋਂ ਕੇ ਖਜਾਨੇ ਸੁਖ ਕੇ ਦਾਤੇ! ਤੇਰੇ ਰੰਗੋਂ ਕੋ ਮੈਂ ਕਹਿ ਨਹੀਂ ਸਕਤਾ ਹਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਣਾਂ ਦੇ ਖ਼ਜ਼ਾਨੇ ਪ੍ਰਭੂ! ਹੇ ਸੁਖ ਦੇਣ ਵਾਲੇ ਪ੍ਰਭੂ! ਮੈਂ ਤੇਰੇ ਗੁਣ ਬਿਆਨ ਨਹੀਂ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੰਗਾ = ਚੋਜ। ਗੁਣ ਨਿਧਾਨ = ਹੇ ਗੁਣਾਂ ਦੇ ਖ਼ਜ਼ਾਨੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No puedo describir Tus Maneras, oh Tesoro de Virtud, Dador de Paz."