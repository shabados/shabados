data = "ਨਾਮ ਸੈਹਥੀ ਕੇ ਸਕਲ; ਨਿਕਸਤ ਜਾਹਿ ਅਨੇਕ ॥੪੭॥"
page = 719

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "all the names of Saihathi are uttered.47."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਤਰ੍ਹਾਂ) 'ਸੈਹਥੀ' (ਬਰਛੀ) ਦੇ ਸਾਰੇ ਨਾਮ ਅਨੇਕਾਂ ਹੀ ਨਿਕਲਦੇ ਜਾਣਗੇ ॥੪੭॥"