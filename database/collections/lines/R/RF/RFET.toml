[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਰਤਨੁ ਵਿਸਾਹੇ ਲੇਵੈ; ਆਪੇ ਕੀਮਤਿ ਪਾਇਦਾ ॥੪॥"
page = 1036
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord himself purchases the emerald and Himself evaluates its worth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਆਪ ਹੀ ਮਾਣਕ ਨੂੰ ਖਰੀਦਦਾ ਹੈ ਅਤੇ ਆਪ ਹੀ ਇਸ ਦਾ ਮੁਲ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself buys the jewel, and He Himself appraises its value. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਆਪ ਹੀ ਰਤਨ ਵੈਰਾਗ ਕੋ ਖਰੀਦ ਲੇਤਾ ਹੈ ਔ ਆਪ ਹੀ ਵੈਰਾਗ ਸਰੂਪ ਕੀ ਕੀਮਤ ਪਾਵਤਾ ਹੈ, ਭਾਵ ਯਥਾਰਥ ਬੋਧੁ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਹੀ ਨਾਮ-ਰਤਨ ਵਿਹਾਝਦਾ ਹੈ, ਆਪ ਹੀ ਨਾਮ ਰਤਨ ਦਾ (ਠੀਕ) ਮੁੱਲ ਪਾਂਦਾ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਿਸਾਹੇ = ਖ਼ਰੀਦਦਾ ਹੈ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y mira, nuestro Señor Mercader, evalúa Sus Activos en la Balanza de la Verdad.  (4)"