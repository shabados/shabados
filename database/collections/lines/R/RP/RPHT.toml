[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ ਕੋ ਐਸਾ; ਸੰਜਮੀ ਹੋਇ ॥"
page = 1169
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If there be such a practiser of self-control,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਕੋਈ ਇਹੋ ਜਿਹਾ ਸਵੈ-ਜ਼ਬਤ ਕਮਾਉਣ ਵਾਲਾ ਹੋਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Even if someone practices such self-discipline,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋ ਐਸਾ ਸੰਜਮੀ ਕਿਆ ਅਤੀ ਇੰਦ੍ਰੇਜਿਤ ਹੋਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋਈ ਅਜੇਹਾ ਬੰਦਾ ਭੀ ਹੋਵੇ ਜੋ ਆਪਣੇ ਇੰਦ੍ਰਿਆਂ ਨੂੰ ਵੱਸ ਕਰਨ ਦੇ ਜਤਨ ਕਰਦਾ ਹੋਵੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਜਮੀ = ਸੰਜਮ ਰੱਖਣ ਵਾਲਾ, ਇੰਦ੍ਰਿਆਂ ਨੂੰ ਕਾਬੂ ਕਰਨ ਦਾ ਜਤਨ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si practicas el autocontrol y alabas a Dios de alguna forma especial."