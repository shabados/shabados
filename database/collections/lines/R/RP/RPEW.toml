[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਸਤਿਗੁਰ; ਸਭ ਮੋਹੀ ਮਾਇਆ ॥੧॥"
page = 1139
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the True Guru, the entire world is bewitched by mammon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਦੇ ਬਗੈਰ ਸਾਰੇ ਸੰਸਾਰ ਨੂੰ ਮੋਹਨੀ ਨੇ ਫਰੇਫਤਾ ਕਰ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the True Guru, all are enticed by Maya. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਸੇ ਬਿਨਾਂ ਸਭ ਸ੍ਰਿਸ਼ਟੀ ਮਾਯਾ ਨੇ ਮੋਹਤ ਕਰ ਛੋਡੀ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਣ ਤੋਂ ਬਿਨਾ ਸਾਰੀ ਲੁਕਾਈ ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਫਸੀ ਰਹਿੰਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭ = ਸਾਰੀ ਲੁਕਾਈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues sin el Guru, todos son engañados por Maya. (1)"