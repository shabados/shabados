[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੁ ਮੁੰਡੀਆ; ਸਗਲੋ ਦ੍ਰਬੁ ਖੋਈ ॥"
page = 871
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This lad has lost all his wealth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਮੁੰਡੇ ਨੇ ਆਪਣਾ ਸਾਰਾ ਧਨ ਗੁਆ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This shaven-headed mendicant has wasted all his wealth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹੁ ਜੋ ਕਬੀਰ (ਮੁੰਡੀਆ) ਫਕੀਰੁ ਹੈ ਵਾ ਲੜਕਾ ਸਰਬ ਧਨ ਕਾ (ਖੋਈ) ਗਵਾਵਨੇ ਵਾਲਾ ਹੈ ਅਰਥਾਤ ਔਖੀ ਹੂਈ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੇਰਾ) ਇਹ (ਖਸਮ) ਸਾਧੂ ਸਾਰਾ (ਕਮਾਇਆ) ਧਨ ਗਵਾਈ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦ੍ਰਬੁ = ਧਨ। ਖੋਈ = ਗਵਾ ਰਿਹਾ ਹੈ (ਨੋਟ: ਔਖਿਆਈ ਇਹ ਨਹੀਂ ਸੀ ਕਿ ਕਬੀਰ ਜੀ ਕਮਾਂਦੇ ਨਹੀਂ ਸਨ, ਸਗੋਂ ਇਹ ਕਿ ਸਤਸੰਗੀਆਂ ਨੂੰ ਖੁਆ ਦੇਂਦੇ ਸਨ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El pobre desafortunado ha desperdiciado todo su dinero;"