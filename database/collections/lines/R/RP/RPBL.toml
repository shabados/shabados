[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਹੁ ਬੇਅੰਤੁ; ਅੰਤੁ. ਕਿਨਿ ਲਹੀਐ ॥"
page = 1188
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is Illimitable, who can find His limit?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਓੜਕ-ਰਹਤਿ ਹੈ, ਉਸ ਦੇ ਓੜਕ ਨੂੰ ਕੌਣ ਪਾ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is endless; who can find His limits?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਬ੍ਯੰਤ ਹੈ। ਤਿਸ ਕਾ ਅੰਤ ਕਿਸ ਨੇ ਲੀਆ ਹੈ, ਭਾਵ ਕਿਸੇ ਨੇ ਨਹੀਂ ਲੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਬੇਅੰਤ ਹੈ ਤੇ ਜਿਸ ਦਾ ਅੰਤ ਕਿਸੇ ਜੀਵ ਨੇ ਨਹੀਂ ਲੱਭਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਨਿ = ਕਿਸ ਨੇ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, Infinito es Él, nadie puede encontrar Sus límites."