data = "ਜਬ ਇਨਿ; ਕਰਣੈਹਾਰੁ ਪਛਾਤਾ ॥"
page = 235
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When he recognises the Creator,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਇਹ ਆਪਣੇ ਸਿਰਜਣਹਾਰ ਨੂੰ ਸਿੰਞਾਣ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But when he recognizes the Creator Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਬ ਇਸ ਨੇ ਕਰਨੇਹਾਰ ਵਾਹਿਗੁਰੂ ਕੋ ਪਛਾਨ ਲੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਜਦੋਂ ਇਸ ਨੇ (ਹਰ ਥਾਂ) ਸਿਰਜਣਹਾਰ ਨੂੰ ਹੀ (ਵੱਸਦਾ) ਪਛਾਣ ਲਿਆ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero cuando concibe al Creador de su vida,"