data = "ਸਭੰ ਸੀਸ ਕੇ ਸੰਗ ਸ੍ਰੀ ਕਾਲ ਨਾਚੈ ॥੬੦॥"
page = 44

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Since the KAL dances over the heads of all.60."

