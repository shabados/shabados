type = "primary"
data = "ਕਿ ਈਂ ਰਾ ਬ ਕੁਸ਼ਤ ਅਸਤ ਰਾਜਹ ਹੁਮਾ ॥੩੦॥"
page = 1407

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That the Raja had killed the Quazi.(30)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਇਸ ਰਾਜੇ ਨੇ ਉਸ ਦਾ ਕਤਲ ਕੀਤਾ ਹੈ ॥੩੦॥"