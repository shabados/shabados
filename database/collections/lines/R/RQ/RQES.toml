[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੈ ਮਨਿ. ਚੀਤਿ ਆਏ; ਪ੍ਰਿਅ ਰੰਗਾ ॥"
page = 1210
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within my mind, remember I my Blissful Beloved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਰਿਦੇ ਅੰਦਰ, ਮੈਂ ਆਪਣੇ ਰੰਗੀਲੇ ਪ੍ਰੀਤਮ ਨੂੰ ਯਾਦ ਕਰਦੀ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Love of my Beloved comes into my conscious mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੰਦ ਰੂਪ (ਪ੍ਰਿਅ) ਪਤੀ ਪਰਮੇਸ੍ਵਰ ਜੀ ਮੇਰੇ ਮਨ ਮੇਂ ਚਿਤ ਯਾਦ ਆਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਦੋਂ ਤੋਂ ਸਾਧ ਸੰਗਤ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਪਿਆਰੇ ਪ੍ਰਭੂ ਦੇ ਕੌਤਕ ਮੇਰੇ ਮਨ ਵਿਚ ਮੇਰੇ ਚਿੱਤ ਵਿਚ ਆ ਵੱਸੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੇਰੈ ਮਨਿ = ਮੇਰੇ ਮਨ ਵਿਚ। ਮੇਰੈ ਚੀਤਿ = ਮੇਰੇ ਚਿੱਤ ਵਿਚ। ਪ੍ਰਿਅ ਰੰਗਾ = ਪਿਆਰੇ ਦੇ ਕੌਤਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A mi mente le fascina el Juego Amoroso de mi Señor y mi relación con Maya ha terminado, l"