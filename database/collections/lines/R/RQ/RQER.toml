[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੋ ਸਿੰਮ੍ਰਿਤਨ ਕੇ ਰਾਹ ਨ ਆਯੋ ॥੧੮॥"
page = 56

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Those who devoted themselves to the Feet of the Lord, they did not adopt the path of the Smritis.18."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਮ੍ਰਿਤੀਆਂ ਦੇ (ਧਰਮ) ਮਾਰਗ ਉਤੇ ਨਹੀਂ ਚਲੇ ॥੧੮॥"