[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਮਾਇਆ ਲੈ ਗਾਡੈ ਧਰੈ ॥"
page = 1252
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That wealth, he takes and buries in the ground."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੌਲਤ ਨੂੰ ਲੈ ਕੇ ਉਹ ਜਮੀਨ ਵਿੱਚ ਦਬ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He takes the wealth of Maya, and buries it in the ground."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਸੋ ਮਾਯਾ ਲੈਕਰ ਕੇ ਧਰਤੀ ਮੇਂ ਗਾਡਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕਮਾ ਕੇ ਧਰਤੀ ਵਿਚ ਨੱਪ ਰੱਖਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਾਡੈ = (ਧਰਤੀ ਵਿਚ) ਦੱਬ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y va y esconde la bolsa en el seno de la tierra"