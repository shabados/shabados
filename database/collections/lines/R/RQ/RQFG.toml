[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਹੁ ਪੁਰਖਨ ਸੌ ਰਤਿ ਕਰੈ; ਊਚ ਨ ਜਾਨੈ ਨੀਚ ॥੨॥"
page = 825

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She would offer love to various people with no discrimination of caste.(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਬਿਨਾ ਊਚ ਨੀਚ ਜਾਣੇ ਬਹੁਤ ਮਰਦਾਂ ਨਾਲ ਪ੍ਰੇਮ-ਕ੍ਰੀੜਾ ਕਰਦੀ ਸੀ ॥੨॥"