[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਕੰਮੁ ਸੁਹੇਲਾ; ਜੋ ਤੇਰੀ ਘਾਲੀ ॥"
page = 97
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sublime is the work which is dome is Thy service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਰੇਸ਼ਟ ਹੈ ਉਹ ਕਾਰਜ ਜਿਹੜਾ ਤੇਰੀ ਸੇਵਾ ਵਿੱਚ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sublime is that work which is done for You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਵਹੁ ਕਾਰਜੁ ਭੀ (ਸੁਹੇਲਾ) ਸੁਖਦਾਇਕ ਹੈ ਜਿਸ ਮੇਂ ਆਪ ਕੀ ਘਾਲ ਘਾਲੀ ਜਾਵੇ, ਭਾਵ ਏਹ ਕਿ ਆਪ ਕੀ ਸੇਵਾ ਹੋਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜੇਹੜਾ ਕੰਮ ਮੈਂ ਤੇਰੀ ਸੇਵਾ ਵਾਸਤੇ ਕਰਦਾ ਹਾਂ, ਉਹ ਕੰਮ ਮੈਨੂੰ ਸੁਖਾਵਾਂ ਲੱਗਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਹੇਲਾ = ਸੁਖਦਾਈ। ਘਾਲੀ = ਸੇਵਾ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bendito es el trabajo que hago para Ti."