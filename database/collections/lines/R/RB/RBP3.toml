[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਹਾ ਤੂਰ ਭੇਰੀ, ਮਹਾ ਸੰਖ ਬਾਜੇ ॥"
page = 704

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors thundering in the battlefield and the kettledrums and conches etc. sounded there"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਤੂਰ, ਭੇਰੀ ਅਤੇ ਵੱਡੇ ਸੰਖ ਵਜ ਰਹੇ ਹਨ।"