[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੋ ਕਉ ਦੋਨਉ ਵਖਤ ਜਿਵਾਲੇ ॥੨॥"
page = 656
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "which shall feet me two times a day."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਇਸ ਨੂੰ ਮੈਂ ਦੋਨਾਂ ਵੇਲਿਆਂ ਵਿੱਚ ਖਾ ਲਵਾਂਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "which I shall eat twice a day. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਨਮ ਮਰਨ ਰੂਪੀ ਵਖਤ ਪੜੇ ਹੂਏ ਅਰਥਾਤ ਕਸ਼੍ਟ ਹੈਂ, ਤਿਨ ਸੇ ਮੁਝ ਕੋ ਜਿਵਾਇ ਲੇ ਅਰਥਾਤ ਰਾਖ ਲੇਹੁ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਚੀਜ਼ਾ ਮੇਰੇ ਦੋਹਾਂ ਵੇਲਿਆਂ ਦੀ ਗੁਜ਼ਰਾਨ ਲਈ ਕਾਫ਼ੀ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਵਾਲੇ = ਜੀਊਂਦਿਆਂ ਰੱਖੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "para que pueda comer dos veces al día. (2)"