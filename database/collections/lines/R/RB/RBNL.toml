[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੁ ਪੂਰਾ; ਪਾਈਐ ਵਡਭਾਗੀ ॥"
page = 864
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By great good destiny the Perfect Guru is attained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਰੀ ਚੰਗੀ ਪ੍ਰਾਲਭਧ ਦੁਆਰਾ ਪੂਰਨ ਗੁਰੂ ਪਰਾਪਤ ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Perfect Guru is found, by great good fortune."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਗੁਰ ਪੂਰਾ ਵਡੇ ਭਾਗੋਂ ਕਰ ਕੇ ਪਾਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਵੱਡੀ ਕਿਸਮਤ ਨਾਲ ਪੂਰਾ ਗੁਰੂ ਮਿਲ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਡਭਾਗੀ = ਵੱਡੇ ਭਾਗਾਂ ਨਾਲ। ਪਾਈਐ = ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por una buena fortuna uno encuentra al Guru Perfecto"