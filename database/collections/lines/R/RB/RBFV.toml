[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਬਾਣੀ ਗਾਵਹ ਭਾਈ ॥"
page = 628
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sing thou the Guru's word, O brother."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਗੁਰਬਾਣੀ ਨੂੰ ਗਾਇਨ ਕਰ, ਹੇ ਵੀਰ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sing the Word of the Guru's Bani, O Siblings of Destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰੋਂ ਕੀ ਬਾਣੀ ਕੋ ਗਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਆਓ ਅਸੀਂ ਭੀ ਗੁਰੂ ਦੀ ਬਾਣੀ ਗਾਵਿਆ ਕਰੀਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਾਵਹ = ਆਓ ਅਸੀਂ ਗਾਵੀਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canten la Palabra del Shabd del Guru,"