[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸੁ ਮਨ ਕਉ; ਮਮਤਾ ਕਿਥਹੁ ਲਾਗੀ ॥੧॥"
page = 1261
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Where has mine-ness clung to this mind?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਮਨੂਏ ਨੂੰ ਮੈਂ-ਮੇਰੀ ਕਿੱਥੋ ਚਿਮੜ ਗਈ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How has this mind been gripped by possessiveness? ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੰਡਿਤ! ਇਸ ਮਨ ਤੇ ਤਾਂਈ ਮਮਤਾ ਕਹਾਂ ਸੇ ਲਾਗੀ ਹੈ? ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੰਡਿਤ! (ਇਹ ਭੀ ਵਿਚਾਰਿਆ ਕਰ ਕਿ) ਇਸ ਮਨ ਨੂੰ ਮਮਤਾ ਕਿਥੋਂ ਆ ਚੰਬੜਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਮਤਾ = ਅਪਣੱਤ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cómo es que esta mente ha sido atrapada por la avaricia? (1)"