[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਗੁ. ਨ ਪਾਇਓ ਅਪੁਨੇ ਭਰਤੇ; ਪੇਖਿ ਪੇਖਿ ਦੁਖੁ ਪਾਇਆ ॥੨॥"
page = 712
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "But, if she obtains not the company of her husband, she is pained looking at her decorations."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰ ਜੇ ਉਸ ਨੂੰ ਆਪਣੇ ਕੰਤ ਦਾ ਸੰਜੋਗ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦਾ, ਤਾਂ ਉਹ ਆਪਣੀਆਂ ਸਜਾਵਟਾਂ ਨੂੰ ਵੇਖ ਵੇਖ ਕੇ ਦੁੱਖ ਉਠਾਉਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But if she does not obtain the company of her Husband Lord, the sight of these decorations only brings her pain. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਤਿਸ ਨੇ ਜਬ ਅਪਨੇ ਪਤੀ ਕਾ ਸੰਗ ਨ ਪਾਯਾ, ਭਾਵ ਸੇ ਪਤੀ ਨਾ ਮਿਲਾ, ਤਬ ਉਸ ਥਾਟ ਕੌ ਦੇਖ ਦੇਖ ਕਰ ਕੇ ਤਿਸ ਨੇ ਮਹਾਂ ਦੁਖ ਕੋ ਪਾਇਆ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਉਸ ਨੂੰ ਆਪਣੇ ਖਸਮ ਦਾ ਮਿਲਾਪ ਹਾਸਲ ਨਹੀਂ ਹੁੰਦਾ। (ਉਹਨਾਂ ਗਹਣਿਆਂ ਆਦਿ ਨੂੰ) ਵੇਖ ਵੇਖ ਕੇ ਉਸ ਨੂੰ ਸਗੋਂ ਦੁੱਖ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗੁ = ਮਿਲਾਪ। ਪੇਖਿ = ਵੇਖ ਕੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero si su Esposo no la viene a acompañar, con todos sus adornos se pone a llorar. (2)"