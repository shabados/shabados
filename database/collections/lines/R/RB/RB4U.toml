[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ; ਹਰਿ ਰਸੁ ਚਾਖੈ ਕੋਇ ॥"
page = 664
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rare is the one, who, through the grace of the Guru, enjoys God's elixir."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ, ਕੋਈ ਵਿਰਲਾ ਹੀ ਹਰੀ ਦੇ ਅੰਮ੍ਰਿਤ ਨੂੰ ਮਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How rare is that Gurmukh who tastes the sublime essence of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਗੁਰਮੁਖ ਹੀ ਹਰੀ ਰਸ ਕੋ ਚਾਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੇਹੜਾ ਭੀ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਸੁਆਦ ਚੱਖਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ। ਕੋਇ = ਜੇਹੜਾ ਕੋਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Extraordinario es aquél que, por la Gracia del Guru, prueba la Esencia del Señor y está siempre en Éxtasis."