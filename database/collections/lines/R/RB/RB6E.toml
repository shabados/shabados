[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸਹਿ ਸਹਾਈ ਹੋਇ ਭਗਵਾਨ ॥"
page = 888
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He whose helper is the Fortunate Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਮੱਦਦਗਾਰ ਭਾਗਾਂ ਵਾਲਾ ਪ੍ਰਭੂ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who has the Lord God as his help and support"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਾ ਭਗਵਾਨ ਸਹਾਈ ਹੋਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਮਨੁੱਖ ਦਾ ਮਦਦਗਾਰ ਪਰਮਾਤਮਾ (ਆਪ) ਬਣਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਾਈ = ਮਦਦਗਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos los esfuerzos de aquél que cuenta con el Socorro del Señor,"