[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰਿ ਸੇਵਿਐ; ਰਿਦੈ ਸਮਾਣੀ ॥"
page = 119
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By serving the True Guru, Gurbani gets permeated in the mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਟਹਿਲ ਕਮਾਉਣ ਦੁਆਰਾ ਗੁਰਬਾਣੀ ਹਿਰਦੇ ਅੰਦਰ ਰਮ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serving the True Guru, it permeates the heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਸਤਿਗੁਰੂ ਸੇਵਿਆ ਹੈ, ਤਿਨ ਕੇ ਰਿਦੇ ਮੇਂ ਸਮਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਸਤਿਗੁਰੂ ਦਾ ਆਸਰਾ-ਪਰਨਾ ਲਿਆ ਜਾਏ, ਤਦੋਂ ਹੀ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਵੱਸ ਸਕਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰਿ ਸੇਵਿਆ = ਜੇ ਗੁਰੂ ਦਾ ਆਸਰਾ ਲਿਆ ਜਾਏ। ਰਿਦੈ = ਹਿਰਦੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es Amrit y sirviendo al Guru, compenetra nuestro corazón."