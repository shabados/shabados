[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਡਾਰ ਦਈ ਲਸੀਆ ਅਰੁ ਅਛਤ; ਬਾਹਰਿ ਭੀਤਰਿ ਧੂਪ ਜਗਾਏ ॥"
page = 306

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They sprinkled buttermild and fragrances and burnt incenses within their houses and outside"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕੱਚੀ ਲਸੀ ਅਤੇ ਚਾਵਲਾਂ ਦੇ ਛੱਟੇ ਦੇ ਕੇ ਅਤੇ ਘਰਾਂ ਦੇ ਅੰਦਰ ਬਾਹਰ ਧੂਪ ਜਗਾ ਕੇ (ਰਹਿਣ ਲਗੇ ਹਨ)।"