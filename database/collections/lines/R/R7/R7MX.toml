[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁਭਟ ਸਿੰਘ ਸੁੰਦਰ ਸੁਘਰ; ਬਰਹੋ ਵਹੈ ਕੁਮਾਰ ॥੬॥"
page = 869

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And said that she would get married with Subhat Singh.(6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੁਭਟ ਸਿੰਘ ਬਹੁਤ ਸੁੰਦਰ ਅਤੇ ਸੁਘੜ ਹੈ, ਉਸੇ ਰਾਜ ਕੁਮਾਰ ਨਾਲ ਵਿਆਹ ਕਰਾਂਗੀ ॥੬॥"