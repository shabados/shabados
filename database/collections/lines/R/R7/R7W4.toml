[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੀ ਭਗਤਿ ਕਰਹੁ; ਤਜਿ ਮਾਨੁ ॥"
page = 299
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Shed thy ego and embrace God's devotional service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਹੰਗਤਾ ਛੱਡ ਦੇ ਅਤੇ ਹਰੀ ਦੀ ਪ੍ਰੇਮ-ਮਈ ਸੇਵਾ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Worship the Lord with devotion, and get rid of your pride."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਅਭਿਮਾਨ ਤਿਆਗ ਕਰ ਹਰੀ ਕੀ ਭਗਤੀ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਨ ਵਿਚੋਂ) ਅਹੰਕਾਰ ਛੱਡ ਕੇ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਕਰਦੇ ਰਹੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਜਿ = ਛੱਡ ਕੇ। ਮਾਨੁ = ਅਹੰਕਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Deshazte de tu ego y contempla a tu Señor,"