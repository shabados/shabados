[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ੍ਰਿਪ ਸਾਥ ਰਹੈ ਨਹੀ ਏਊ ਮਰੈ ॥੧੨॥੩੦੨॥"
page = 153

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "So that they may not offend the king and also save the two refugees.12.302."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਜੇ ਨਾਲ ਵੀ ਰਹਿ ਆਵੇ ਅਤੇ ਇਹ (ਦੋਵੇਂ ਵੀ) ਨਾ ਮਰਨ ॥੧੨॥੩੦੨॥"