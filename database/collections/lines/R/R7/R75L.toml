[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਦਰੀਆਉ; ਸਭ ਤੁਝ ਹੀ ਮਾਹਿ ॥"
page = 365
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art the river and all are within Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਦਰਿਆ ਹੈਂ ਅਤੇ ਸਾਰੇ ਤੇਰੇ ਅੰਦਰ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the River - all are within You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਦਰੀਆਉ ਰੂਪ ਹੈਂ ਔਰ ਸਭ ਜੀਵ ਤੇਰੇ ਹੀ ਬੀਚ ਹੈਂ, ਭਾਵ ਤਰੰਗ ਰੂਪ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਤੂੰ (ਜ਼ਿੰਦਗੀ ਦਾ ਇਕ ਵੱਡਾ) ਦਰੀਆ ਹੈਂ, ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ ਤੇਰੇ ਵਿਚ (ਜੀਊ ਰਹੀ) ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਹਿ = ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú eres el río, todas Tus criaturas habitan en Ti."