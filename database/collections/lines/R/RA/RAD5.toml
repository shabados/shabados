[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕ੍ਰਿਪਾ ਕਰੇ ਜੇ ਆਪਣੀ; ਤਾ ਹਰਿ ਰਖਾ ਉਰ ਧਾਰਿ ॥੧॥"
page = 589
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If God shows His mercy, then alone can I keep Him enshrined within my mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਵਾਹਿਗੁਰੂ ਆਪਣੀ ਰਹਿਮਤ ਧਾਰੇ, ਤਦ ਹੀ ਮੈਂ ਉਸ ਨੂੰ ਆਪਣੇ ਰਿਦੇ ਵਿੱਚ ਟਿਕਾਈ ਰੱਖ ਸਕਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If the Lord shows His Mercy, then I keep Him enshrined within my heart. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਹਰੀ ਅਪਨੀ ਕ੍ਰਿਪਾ ਕਰੇ ਤਾਂ ਮੈਂ ਤਿਸ ਹਰਿ ਕੇ ਨਾਮ ਕੋ ਉਰ ਮੇਂ ਧਾਰਨ ਕਰ ਰਖਾਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਪਰਮਾਤਮਾ ਆਪਣੀ ਮੇਹਰ ਕਰੇ, ਤਾਂ ਮੈਂ ਭੀ ਉਸ ਦਾ ਨਾਮ ਹਿਰਦੇ ਵਿਚ ਪਰੋ ਰੱਖਾਂ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਖਾ = ਮੈਂ ਰੱਖਾਂ। ਉਰ ਧਾਰਿ = ਹਿਰਦੇ ਵਿਚ ਟਿਕਾ ਕੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando el Señor así nos bendice, enaltecemos al Guru en la mente. (1)"