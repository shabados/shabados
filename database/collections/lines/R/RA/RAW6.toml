[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇਹੀ ਸੁਰਤਿ; ਤੇਹਾ ਤਿਨ ਰਾਹੁ ॥"
page = 25
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As is the consciousness, so is their way."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਹੋ ਜੇਹੀ ਗਿਆਤ ਹੈ, ਉਹੋ ਜੇਹਾ ਉਨ੍ਹਾਂ ਦਾ ਰਸਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As is their awareness, so is their way."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੀ ਜੀਵਾਂ ਮੇਂ (ਸੁਰਤਿ) ਗ੍ਯਾਤ ਰਖਤਾ ਹੈਂ, ਤੈਸਾ ਹੀ ਤਿਨ ਜੀਵੋਂ ਕਾ (ਰਾਹੁ) ਚਲਨੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੋ ਜਿਹੀ ਸੂਝ (ਪ੍ਰਭੂ ਜੀਵਾਂ ਨੂੰ ਦੇਂਦਾ ਹੈ) ਉਹੋ ਜਿਹਾ ਜੀਵਨ-ਰਸਤਾ ਉਹ ਫੜ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਨ ਰਾਹੁ = ਉਹਨਾਂ ਜੀਵਾਂ ਦਾ ਜੀਵਨ-ਰਸਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y así como es nuestra conciencia, así es nuestro sendero."