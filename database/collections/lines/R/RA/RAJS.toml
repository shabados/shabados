[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਜੇ ਭਾਤਿ ਜੈਸੀ ਸਬੈ ਰਾਜ ਓ ਭੀ ॥੬੦॥"
page = 631

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There are kings and kings on all the four sides, but you have equally abandoned them all.60."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਰਾਜਿਆਂ ਨੂੰ ਵੀ ਪਹਿਲਿਆਂ ਵਾਂਗ (ਰਾਜ ਕੁਮਾਰੀ ਨੇ) ਛਡ ਦਿੱਤਾ ਹੈ ॥੬੦॥"