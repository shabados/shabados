[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈ ਜੈ ਕਾਰੁ ਗੁਸਾਈ ॥"
page = 625
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hail! hail! unto the World-Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿ! ਵਾਹਿ! ਹੈ ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਸੁਆਮੀ ਨੂੰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Hail! Hail to the Lord of the world,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਿਥਵੀ ਕੇ ਪਤੀ! ਸਭ ਸ੍ਰੀ ਅੰਮ੍ਰਿਤਸਰ ਜੀ ਕੇ ਨਿਵਾਸੀ ਤਿਸ ਤੇਰਾ ਧੰਨ੍ਯਬਾਦ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਵਾਸਤੇ, ਹੇ ਭਾਈ!) ਉਸ ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਮਾਲਕ-ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦੇ ਰਿਹਾ ਕਰੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੈ ਜੈ ਕਾਰੁ = ਸੋਭਾ, ਸਿਫ਼ਤ-ਸਾਲਾਹ। ਗੁਸਾਈ = ਸ੍ਰਿਸ਼ਟੀ ਦਾ ਮਾਲਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¡Victoria para el Maestro de la tierra,"