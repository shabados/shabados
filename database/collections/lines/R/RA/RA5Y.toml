[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛੁਟਕੀ ਹਉਮੈ ਸੋਰੋ ॥"
page = 1306
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The noise of thy self conceit shall be stilled;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਤੇਰੀ ਸਵੈ-ਹੰਗਤਾ ਦਾ ਰੌਲਾ ਮਿਟ ਜਾਵੇਗਾ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The turmoil of egotism shall be silenced."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੰਤਾ, ਮਮਤਾ ਕੀ (ਸੋਰੋ) ਸੁਹਰਤ ਖਬਰ ਛੁਟ ਗਈ ਹੈ; ਵਾ ਹੰਤਾ ਛੁਟੀ ਹੈ ਅਰੁ (ਸੋਰੋ) ਰੌਲਾ ਛੁਟ ਗ੍ਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੇ ਅੰਦਰੋਂ) ਹਉਮੈ ਦਾ ਰੌਲਾ ਮੁੱਕ ਗਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਰੋ = ਸ਼ੋਰ, ਰੌਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y el loto invertido de tu corazón florecerá. El remolino del egoísmo se acallará."