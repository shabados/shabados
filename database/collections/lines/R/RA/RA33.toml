[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨੑ. ਨਾਹਿ ਨਰਕ ਨਿਵਾਸੁ ॥"
page = 837
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They dwell not in hell,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਦੋਜ਼ਕ ਅੰਦਰ ਨਹੀਂ ਵਸਦੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who constantly remember God,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨੋਂ ਕਾ ਕਬੀ ਨਰਕ ਮੇਂ ਨਿਵਾਸ ਨਹੀਂ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਹਨਾਂ ਨੂੰ ਨਰਕਾਂ ਦਾ ਨਿਵਾਸ ਨਹੀਂ ਮਿਲਦਾ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que vive en Dios, el Tesoro de Virtud,"