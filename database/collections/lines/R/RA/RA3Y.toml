[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਪ੍ਰਸਾਦਿ; ਸਗਲ ਦੁਖ ਮਿਟੇ ॥"
page = 183
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By saints' favour all the pains are effaced."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਸਾਰੀ ਪੀੜ ਰਫ਼ਾ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By the Grace of the Saints, all pains are erased."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਸੰਪੂਰਨ ਦੁਖ ਮਿਟ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸਦਾ ਨਤੀਜਾ ਇਹ ਨਿਕਲਦਾ ਹੈ ਕਿ) ਸਤਿਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਮਨੁੱਖ ਦੇ ਸਾਰੇ ਦੁੱਖ-ਕਲੇਸ਼ ਮਿਟ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por la Gracia del Santo Guru, todas nuestras aflicciones se van"