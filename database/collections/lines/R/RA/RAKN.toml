[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਹ ਪੂਛਹੁ, ਤੁਹਿ ਕਵਨ ਪਠਾਯੋ ॥"
page = 878

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She told every body to announce that he had come to kill the Raja."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਨੂੰ ਪੁਛੋ ਕਿ ਇਸ ਨੂੰ ਕਿਸ ਨੇ ਭੇਜਿਆ ਸੀ?"