[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਤਿਹ ਜਨ; ਮਿਲੀ ਵਡਾਈ ॥੩੫॥"
page = 257
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Nanak, he obtains greatness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਮਹਿਮਾ ਨੂੰ ਪਰਾਪਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, obtains glorious greatness. ||35||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਪੁਰਸ਼ ਕੋ ਬਡਾਈ ਮਿਲੀ ਹੈ॥੩੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹਨਾਂ ਨੂੰ (ਲੋਕ ਪਰਲੋਕ ਵਿਚ) ਵਡਿਆਈ ਮਿਲਦੀ ਹੈ ॥੩੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "logra la Gloria y la Magnificencia.(35)"