[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਝੂਠ ਧੋਹ ਸਿਉ; ਰਚਿਓ ਮੀਠਾ ॥"
page = 676
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Deeming falsehood and deception sweet, he is attached with them."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੂੜ ਅਤੇ ਠੱਗੀ ਠੋਰੀ ਨੂੰ ਮਿੱਠਾ ਜਾਣ ਕੇ ਉਹ ਉਨ੍ਹਾਂ ਨਾਲ ਜੁੜਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is attached to falsehood and deception; they seem sweet to him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਝੂਠ ਔਰ (ਧੋਹ) ਛਲ ਕੇ ਸਾਥ ਮੀਠਾ ਜਾਨ ਕਰ ਰਚ ਰਹਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਝੂਠ ਨੂੰ ਠੱਗੀ ਨੂੰ ਮਿੱਠਾ ਜਾਣ ਕੇ ਇਹਨਾਂ ਨਾਲ ਮਸਤ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧੋਹ = ਠੱਗੀ। ਸਿਉ = ਨਾਲ। ਮੀਠਾ = ਮਿੱਠਾ (ਜਾਣ ਕੇ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Religión y la Verdad y en cambio se involucra en la falsedad y en el engaño,"