[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲੋਕ ਲਾਜ ਕਉ ਛਾਡਿ; ਕਛੂ ਕਾਰਜ ਨਹਿ ਕਰਿਯਹੁ ॥"
page = 837

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘No act is performed keeping in view the public opinion."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਲੋਕ ਲਾਜ ਨੂੰ ਛਡ ਕੇ ਕੋਈ ਕੰਮ ਨਾ ਕਰੋ।"