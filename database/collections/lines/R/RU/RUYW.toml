[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਿ ਬਸੰਤੁ; ਤਨੁ ਮਨੁ ਹਰਿਆ ਹੋਇ ॥"
page = 1176
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When there is spring in the mind, the body and soul are reverdured."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਚਿੱਤ ਬਹਾਰ ਹੁੰਦੀ ਹੈ, ਦੇਹਿ ਅਤੇ ਜਿੰਦੜੀ ਹਰੇ ਭਰੇ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the mind is in spring, the body and mind are rejuvenated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਪਰਮੇਸ੍ਵਰ ਮਨ ਮੇਂ ਬਸਤਾ ਹੈ ਤਬ ਤਨੁ ਮਨੁ ਹਰਿਆ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਮਨ ਵਿਚ ਸਦਾ ਖਿੜੇ ਰਹਿਣ ਵਾਲਾ ਹਰੀ ਆ ਵੱਸਦਾ ਹੈ, ਉਸ ਦਾ ਤਨ ਆਤਮਕ ਜੀਵਨ ਵਾਲਾ ਹੋ ਜਾਂਦਾ ਹੈ ਉਸ ਦਾ ਮਨ ਆਤਮਕ ਜੀਵਨ ਵਾਲਾ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿਆ = ਆਤਮਕ ਜੀਵਨ ਨਾਲ ਭਰਪੂਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si la mente está en flor, el cuerpo también lo está."