data = "ਜਦ ਰਾਤ ਹੋ ਗਈ ਜਾਣ ਲੈਂਦਾ ਤਦ (ਉਹ ਬਾਹਰ ਨਿਕਲ ਕੇ) ਪ੍ਰਹਾਰ ਕਰਦਾ।"