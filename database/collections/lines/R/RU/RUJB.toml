data = "ਲਹੈ ਨਿਸਾ ਇਕ ਜਬ ਭਯੋ; ਤਬ ਵਹ ਕਰਤ ਪ੍ਰਹਾਰ ॥"
page = 989

[[content]]
assets = ["DSKO"]
type = "translation"
