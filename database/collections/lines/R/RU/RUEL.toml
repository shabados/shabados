[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹ ਮਹਾ ਭਇਆਨ; ਤਪਤਿ ਬਹੁ ਘਾਮ ॥"
page = 264
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Where there is very terrible heat and great sunshine,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਅਤੀ ਭਿਆਨਕ ਗਰਮੀ ਅਤੇ ਬਹੁਤ ਹੀ ਧੁੱਪ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Where there is awesome and terrible heat and blazing sunshine,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਹਾਂ ਮਹਾਂ ਭੈ ਕੇ ਦੇਨੇ ਹਾਰੀ ਤੁਝ ਕੌ (ਘਾਮ) ਧੂਪ ਕੀ ਬਹੁਤ ਤਪਤਿ ਹੋਵੈਗੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ (ਜ਼ਿੰਦਗੀ ਦੇ ਸਫ਼ਰ ਵਿਚ) (ਵਿਕਾਰਾਂ ਦੀ) ਬੜੀ ਭਿਆਨਕ ਤਪਸ਼ ਤੇ ਗਰਮੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਇਆਨ = ਭਿਆਨਕ, ਡਰਾਉਣਾ। ਤਪਤਿ = ਤਪਸ਼। ਘਾਮ = ਗਰਮੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando estés bajo el abrasante sol del desierto,"