data = "ਕਾਹੂ ਕੀ ਸੰਕਾ ਨਹਿ ਕਰੈ ॥"
page = 888

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She had been collecting the cakes of horses’ dung so that no body could suspect."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਿਸੇ ਦੀ ਵੀ ਕੋਈ ਪਰਵਾਹ ਨਾ ਕੀਤੀ।"