type = "primary"
data = "ਤਿਹ ਗਰਭ ਰਹਿਯੋ ॥੩੩॥"
page = 617

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After that woman having enjoyed the sexual sport, came out of that cottage, the king went away and Shakuntala became pregnant.33."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ (ਸ਼ਕੁੰਤਲਾ) ਨੂੰ ਗਰਭ ਠਹਿਰ ਗਿਆ ॥੩੩॥"