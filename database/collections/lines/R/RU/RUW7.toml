data = "ਕੇਹਰਿ ਦੁਇ ਜਨੁ ਬਨ ਮੈ ਲਰੈ ॥੨੧੭੪॥"
page = 516

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And all the people saw this wonderful drama, both fought in their fury like the two lions in the forest.2174."

[[content]]
