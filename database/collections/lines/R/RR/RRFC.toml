[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਆਸਾ ਕੀਤੀ; ਤਿਸ ਨੋ ਜਾਨੁ ॥੨॥"
page = 424
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Do thou realise Him who has created desire in thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਉਸ ਨੂੰ ਅਨੁਭਵ ਕਰ, ਜਿਸ ਨੇ ਤੇਰੇ ਅੰਦਰ ਖ਼ਾਹਿਸ਼ ਪੈਦਾ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So know the One, who created hope and desire. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਯਹ ਆਸਾ ਉਤਪੰਨ ਕਰੀ ਹੈ ਤਿਸ ਕੋ ਤੂੰ ਜਾਨਣਾ ਕਰ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪਰਮਾਤਮਾ ਨਾਲ ਡੂੰਘੀ ਸਾਂਝ ਬਣਾ ਜਿਸ ਨੇ ਆਸਾ (ਮਨੁੱਖ ਦੇ ਮਨ ਵਿਚ) ਪੈਦਾ ਕੀਤੀ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ ਪਰਮਾਤਮਾ ਨੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sirviendo al Verdadero Guru serás aprobado. (2)"