[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਹੁ ਨ ਮੂਆ; ਜੋ ਦੇਖਣਹਾਰੁ ॥੨॥"
page = 152
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, Who is the seer, dies not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਵੇਖਣ ਵਾਲਾ ਹੈ, ਉਹ ਫੌਤ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but the One who sees does not die. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਵਹੁ ਨਹੀਂ ਮੂਆ ਜੋ ਚੈਤੱਨੁ (ਦੇਖਣਹਾਰੁ) ਸਰਬ ਇੰਦ੍ਰੀਓਂ ਮੇਂ ਇਸਥਿਤ ਹੋ ਕਰ ਦੇਖਤਾ ਸੁਨਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਉਹ (ਆਤਮਾ) ਨਹੀਂ ਮਰਦਾ ਜੋ ਸਭ ਦੀ ਸੰਭਾਲ ਕਰਨ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦੀ ਅੰਸ਼ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਹੁ = ਉਹ (ਜੀਵਾਤਮਾ) ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Vidente, el Ser Inmortal dentro de ti sigue sin cambio. (2)"