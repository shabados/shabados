[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸ੍ਰੀ ਪ੍ਰਹਲਾਦ ਭਗਤ ਉਧਰੀਅੰ ॥"
page = 1401
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Reverend Guru emancipated Prahlad, the saint,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਜਨੀਯ ਗੁਰਾਂ ਨੇ ਸੰਤ ਪ੍ਰਹਿਲਾਦ ਦੀ ਕਲਿਆਣ ਕਰ ਦਿੱਤੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He saved the devotee Prahlaad,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਸ੍ਰੀ ਪ੍ਰਲਿਹਾਦ ਭਗਤ ਕਾ ਉਧਾਰ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਹਲਾਦ ਭਗਤ ਨੂੰ ਬਚਾਇਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਧਰੀਅੰ = ਬਚਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "salvó al Devoto Prahlaad,"