[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਧਿਆਇ ਧਿਆਇ ਥਕੇ ਸਭੈ; ਕਰ ਕੋਟਿ ਕਸਟ ਦੁਰੰਤ ॥"
page = 34

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Practising millions of arduous hardships and meditations all have got tired."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਰੋੜਾਂ ਕਸ਼ਟ ਪੂਰਨ ਔਖੇ ਯਤਨ ਵਾਲੀ (ਉਸ ਦੀ) ਆਰਾਧਨਾ ਕਰਦੇ ਕਰਦੇ ਥਕ ਗਏ ਹਨ;"