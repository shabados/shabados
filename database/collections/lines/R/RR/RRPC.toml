[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਂਖੀ; ਏਕੈ ਦਰਸ ਤੁਹਾਰੋ ॥"
page = 262
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who are desirous of Thine sight alone,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਕੇਵਲ ਤੇਰੇ ਦੀਦਾਰ ਦੇ ਚਾਹਵਾਨ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who yearn only for the blessing of Your Darshan"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਿਗੁਰੂ! ਜੋ ਐਸੇ ਸਿਮਰਨ ਕਰਨ ਵਾਲੇ ਸੰਤ ਏਕ ਤੇਰੇ ਦਰਸਨ ਕਰਨੇ ਕੇ (ਕਾਂਖੀ) ਚਾਹਵੰਤ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਅਕਾਲ ਪੁਰਖ!) ਜੋ ਮਨੁੱਖ ਤੇਰੇ ਦੀਦਾਰ ਦੇ ਚਾਹਵਾਨ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਂਖੀ = ਚਾਹਵਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a través de Su Alabanza, no tiene límite ni cuenta."