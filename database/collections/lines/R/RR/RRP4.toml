[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਵ; ਸੰਸੈ ਗਾਂਠਿ. ਨ ਛੂਟੈ ॥"
page = 974
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, the knot of doubt unravels not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਵਹਿਮ ਦੀ ਗੰਢ ਖੁਲ੍ਹਦੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Divine Lord, the knot of skepticism cannot be untied."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸੰਸੇ ਕੀ ਗਾਂਠ ਨਹੀਂ ਛੁਟਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! (ਨਿਤਾਣੇ ਹੋ ਜਾਣ ਦੇ ਕਾਰਨ ਜੀਵਾਂ ਦੇ ਅੰਦਰੋਂ) ਸਹਿਮ ਦੀ ਗੰਢ ਨਹੀਂ ਖੁਲ੍ਹਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਸੈ = ਸੰਸੇ ਦੀ, ਡਰ ਦੀ, ਸਹਿਮ ਦੀ। ਗਾਂਠਿ = ਗੰਢ। ਨ ਛੂਟੈ = ਨਹੀਂ ਖੁਲ੍ਹਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El nudo de la duda no es aflojado por Dios;"