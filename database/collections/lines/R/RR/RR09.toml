[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਉਪਾਈ ਮੇਦਨੀ; ਸੋਈ ਕਰਦਾ ਸਾਰ ॥"
page = 724
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who has created the world, takes care of it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਸ਼੍ਰਿਸ਼ਟੀ ਸਾਜੀ ਹੈ ਉਹ ਹੀ ਇਸ ਦੀ ਸੰਭਾਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One who created the world, takes care of it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਐਸੇ ਸਾਹਿਬ ਨੇ (ਮੇਦਨੀ) ਧਰਤੀ ਉਪਲਖਤ ਵਾ ਗੁਰੂ ਸੰਕੇਤੁ ਸ੍ਰਿਸਟਿ ਉਤਪਤਿ ਕਰੀ ਹੈ, ਸੋਈ ਸਰਬ ਜੀਵਾਂ ਕੀ ਖਬਰ ਲੇ ਕਰ ਪਾਲਨਾ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਪਰਮਾਤਮਾ ਨੇ ਸ੍ਰਿਸ਼ਟੀ ਪੈਦਾ ਕੀਤੀ ਹੈ, ਉਹੀ (ਇਸ ਦੀ) ਸੰਭਾਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੇਦਨੀ = ਧਰਤੀ। ਸਾਰ = ਸੰਭਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, Quien creó la tierra, Él Mismo también la conserva,"