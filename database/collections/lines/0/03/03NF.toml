[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਧੰ ਉਰਧਰੇਤੇ ਬਰੰ ਬ੍ਰਹਮਚਾਰੀ ॥੧੩੨॥"
page = 645

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All Atev Agnihotris, controlling the world and the perfect celibates adopting celibacy at all levels were also in his refuge.132."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਧਮ, ਵੀਰਜ ਰੋਕਣ ਵਾਲੇ ਅਤੇ ਸ੍ਰੇਸ਼ਠ ਬ੍ਰਹਮਚਾਰੀ ॥੧੩੨॥"