type = "primary"
data = "ਨ ਯਕ ਮੂਇ ਓ ਰਾ ਆਜ਼ਾਰ ਆਵੁਰਦ ॥੧੧੧॥੧॥"
page = 1394

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "but he cannot harm even one hair (if God is friendly).111."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਵੀ ਉਹ ਉਸ ਨੂੰ ਇਕ ਵਾਲ ਵਿੰਗਾ ਕਰਨ ਜਿੰਨਾ ਵੀ ਦੁਖ ਨਹੀਂ ਦੇ ਸਕੇਗਾ ॥੧੧੧॥੧॥"