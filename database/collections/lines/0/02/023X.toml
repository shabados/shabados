[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹਾ ਬਾਪੁਰੀ ਤ੍ਰਿਯਾ; ਨੇਹ ਜਾ ਸੌ ਅਤਿ ਕਰਿ ਹੈ ॥"
page = 906

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘What is the criteria of a woman who is loved so much?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਹ ਇਸਤਰੀ ਵਿਚਾਰੀ ਕੀ ਹੈ ਜਿਸ ਨਾਲ ਬਹੁਤ ਪ੍ਰੇਮ ਕੀਤਾ ਜਾਏ।"