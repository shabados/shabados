[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਖਾ ਸੈਨੁ; ਪ੍ਰੇਮੁ ਗੋਬਿੰਦ ॥"
page = 352
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lord's love is mortals friend and relation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੀ ਪ੍ਰੀਤ ਪ੍ਰਾਣੀ ਦੀ ਮ੍ਰਿੱਤ ਤੇ ਸਨਬੰਧੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Love of the Lord God is one's family and friends."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਖਾ ਔਰ (ਸੈਨੁ) ਸਾਥੀ ਜਿਨ ਕੋ ਏਕ ਗੋਬਿੰਦ ਕਾ ਪ੍ਰੇਮ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੋਬਿੰਦ ਦੇ ਪ੍ਰੇਮ ਨੂੰ ਆਪਣਾ ਸਾਥੀ ਮਿਤ੍ਰ ਬਣਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੈਨੁ = ਮਿਤ੍ਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues para el Devoto del Señor su único amigo es el Amor del Señor."