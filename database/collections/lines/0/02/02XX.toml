data = "ਪਗ ਦ੍ਵੈ ਨ ਭਜਤ ॥੨੩੭॥"
page = 575

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Because of the sound of the musical instruments of the battlefield the clouds are feeling shy and the bedecked warriors are not retracing, even slightly.237."

