data = "ਸੰਕਰ ਬਰਨ ਪ੍ਰਜਾ ਸਬ ਹੋਈ ॥੧੫॥"
page = 553

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There will be no Kshatriyas and Brahmins and all the subjects will become hybrid.15."

