[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਉ ਸਹਜ. ਨ ਮਿਲਿਓ ਸੋਈ ॥੧॥"
page = 655
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If divine knowledge is not gained therewith."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਉਸ ਦੇ ਨਾਲ ਗਿਆਨ ਪ੍ਰਾਪਤ ਕਰਨ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "if celestial peace is not attained? ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ (ਸਹਜ) ਗਿਆਨ ਕਰ ਕੇ ਸੋ ਪ੍ਰਮੇਸ੍ਵਰ ਨ ਮਿਲਿਆ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪ੍ਰਭੂ ਦਾ ਮਿਲਾਪ ਹੀ ਨਾਹ ਹੋਵੇ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਉ = ਜੇ। ਸਹਜ = {Skt. सहज = as a natural result of} ਕੁਦਰਤੀ ਨਤੀਜੇ ਦੇ ਤੌਰ ਤੇ, ਸੁਭਾਵਿਕ ਹੀ। ਸੋਈ = ਉਹ ਪ੍ਰਭੂ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si la Paz Celestial no es obtenida? (1)"