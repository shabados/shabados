[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੋਬਿੰਦ; ਸਤਸੰਗਤਿ ਮੇਲਾਇ ॥"
page = 164
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Master of the Universe, unite me with the Saints congregation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੈ ਆਲਮ ਦੇ ਮਾਲਕ! ਮੈਨੂੰ ਸਾਧ ਸਮੇਲਨ ਨਾਲ ਜੋੜ ਦੇ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord of the Universe, unite me with the Sat Sangat, the True Congregation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਆਪ ਕੋ ਗੋਬਿੰਦ ਕੀ ਸਤਸੰਗਤਿ ਮੇਂ ਮਿਲਾਇ ਦੇ ਅਰਥਾਤ ਸਤਸੰਗ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਬਿੰਦ! (ਮੈਨੂੰ) ਸਾਧ ਸੰਗਤਿ ਦਾ ਮਿਲਾਪ ਬਖ਼ਸ਼,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੋਬਿੰਦ = ਹੇ ਗੋਬਿੰਦ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, el Señor, te une con la Sociedad de los Santos"