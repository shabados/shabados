[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੀਨੋ ਬਡੋ ਕਲੂ ਮਹਿ ਸਾਕਾ ॥"
page = 55

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He protected the forehead mark and sacred thread (of the Hindus) which marked a great event in the Iron age."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਰੂਪ ਵਿਚ ਉਨ੍ਹਾਂ ਨੇ) ਕਲਿਯੁਗ ਵਿਚ ਇਕ ਵੱਡਾ ਸਾਕਾ ਕਰ ਵਿਖਾਇਆ।"