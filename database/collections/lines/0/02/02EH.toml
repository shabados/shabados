[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੈਲਾਖਰ ਕੇ ਰਾਵ ਕੀ; ਏਕ ਹੁਤੀ ਬਰ ਨਾਰਿ ॥"
page = 842

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Raja of Kailakhar had a very pretty lady."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕੈਲਾਖਰ ਦੇ ਰਾਜੇ ਦੀ ਇਕ ਸੁੰਦਰ ਇਸਤਰੀ ਹੁੰਦੀ ਸੀ।"