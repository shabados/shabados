[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਥੈ ਹਟੁ. ਨ ਚਲਈ; ਨਾ ਕੋ ਕਿਰਸ ਕਰੇਇ ॥"
page = 955
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "No one runs any shop there, nor engages in tillage."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਜਣਾ ਉੱਥੇ ਹੱਟੀ ਨਹੀਂ ਕਰਦਾ, ਨਾਂ ਹੀ ਕੋਈ ਵਾਹੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There are no stores open there, and no one farms there."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਸ ਜਲ ਮੇਂ ਕੋਈ ਹਟੀ ਭੀ ਨਹੀਂ ਚਲਤੀ ਪੁਨਾ ਨਾ ਕੋਈ ਖੇਤੀ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਾਣੀ ਵਿਚ ਨਾਹ ਕੋਈ ਦੁਕਾਨ ਚੱਲਦੀ ਹੈ ਨਾਹ ਓਥੇ ਕੋਈ ਵਾਹੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਥੈ = ਪਾਣੀ ਵਿਚ। ਕਿਰਸ = ਖੇਤੀ, ਵਾਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahí ellos no tienen fábricas ni tampoco tiendas;"