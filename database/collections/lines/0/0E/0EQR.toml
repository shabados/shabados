[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਸਰਣਿ; ਨਾਨਕ ਪਰੇ ॥੪॥੭॥"
page = 1182
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak has sought the saints refuge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੇ ਸਾਧੂਆਂ ਦੀ ਪਨਾਹ ਲਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak seeks the Sanctuary of the Saints. ||4||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹਮ ਤਿਨ ਤੇਰੇ ਸੰਤੋਂ ਕੀ ਸਰਣ ਪੜੇ ਹੈਂ॥੪॥੭॥☬ਦੋ ਸਬਦੋਂ ਕਰ ਉਪਦੇਸੁ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਤੇਰੇ ਸੰਤ ਜਨਾਂ ਦੀ ਸਰਨ ਪਏ ਰਹਿੰਦੇ ਹਨ ॥੪॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕ = ਹੇ ਨਾਨਕ ॥੪॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "busco entonces el Refugio de los Santos, oh Señor. (4-7)"