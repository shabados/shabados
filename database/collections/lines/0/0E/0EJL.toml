[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾ ਕੀ ਮਾਤ. ਪਿਤਾ ਕਹੁ ਕਾ ਕੋ; ਕਵਨ ਪੁਰਖ ਕੀ ਜੋਈ ॥"
page = 478
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Say, whose is the mother and whose the father, and which man has a wife?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਸ! ਕਿਸ ਦੀ ਮਾਂ ਹੈ ਅਤੇ ਕੀਹਦਾ ਪਿਓ ਕਿਹੜੇ ਇਨਸਾਨ ਦੀ ਵਹੁਟੀ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Tell me, whose mother is that, whose father is that, and which man has a wife?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਤਾ ਕਿਸ ਕੀ ਹੈ ਔਰ ਪਿਤਾ ਕਹੋ ਕਿਸ ਕਾ ਹੈ ਔ ਕਿਸ ਪੁਰਖ ਕੀ (ਜੋਈ) ਇਸਤ੍ਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇੱਥੇ ਦੱਸੋ, ਕਿਸ ਦੀ ਮਾਂ? ਕਿਸ ਦਾ ਪਿਉ? ਤੇ ਕਿਸ ਦੀ ਵਹੁਟੀ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾ ਕੀ = ਕਿਸ ਦੀ? ਜੋਈ = ਜੋਰੂ, ਇਸਤ੍ਰੀ, ਵਹੁਟੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿De quién es el padre y la madre? ¿De quién es la esposa?"