data = "ਤੁਮੀ ਬਰਾਹਣੀ ਹ੍ਵੈ ਹਿਰਨਾਛ ਮਾਰਿਯੋ ॥"
page = 336

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "As the power of Brahm and as the lion."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਬਰਾਹ ਦੀ ਸ਼ਕਤੀ ਹੋ ਕੇ ਹਿਰਨਾਖਸ ਨੂੰ ਮਾਰਿਆ ਸੀ"