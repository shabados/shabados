[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਤਦਿਨ ਸੁਪਨਿ ਤੁਹਿ ਦੈਹੋ; ਹੌ ਹੂੰ ਆਇ ਕੈ ॥੭॥"
page = 825

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I will come, then, and meet you in the dream.”(7)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਿਨ ਸੁਪਨੇ ਵਿਚ ਆ ਕੇ ਮੈਂ (ਤੈਨੂੰ) ਵਿਖਾਈ ਦੇਵਾਂਗਾ ॥੭॥"