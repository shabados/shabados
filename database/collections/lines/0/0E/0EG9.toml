[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਰਗਹ ਬੈਸਣ, ਹੋਵੈ ਥਾਉ ॥"
page = 354
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thus shall I secure room to sit in God's court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਮੈਂ ਰੱਬ ਦੇ ਦਰਬਾਰ ਅੰਦਰ ਬਹਿਣ ਨੂੰ ਥਾਂ ਪਾ ਲਵਾਂਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Thus I find my seat in the Court of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਦਹਗਾਹ ਮੇਂ ਬੈਠਨੇ ਕੀ ਜਗਹਿ ਹੋਇ ਜਾਇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਤੇਰੀ ਹਜ਼ੂਰੀ ਵਿਚ ਮੈਨੂੰ ਬੈਠਣ ਲਈ ਥਾਂ ਮਿਲ ਸਕਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y obtengo un sitio en Tu Corte Sublime."