[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਕਥ ਕਥਾ, ਅਬਿਗਤਿ ਪਰਗਾਸੀ ॥੨੧॥੧੫॥ ਪੰਦ੍ਰਾਂ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "(Through the Guru) that ineffable story and unmenifest light of the Lord becomes known (to the world)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਦੋਵੇਂ) ਅਕਥ ਕਥਾ ਵਾਲੇ ਅਵਿਗਤ, (ਅਬਿਨਾਸੀ ਅਤੇ) ਪ੍ਰਕਾਸ਼ ਸਰੂਪ ਹਨ।"