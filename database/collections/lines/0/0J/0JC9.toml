[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੇਸਵਾ ਜੋਨਿ; ਵਲਿ ਵਲਿ ਅਉਤਰੈ ॥੨॥"
page = 526
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he is born again and again as a prostitute."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਹ ਮੁੜ ਮੁੜ ਕੇ ਵੇਸਵਾ ਦੀ ਜੂਨੀ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "shall be reincarnated over and over again as a prostitute. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੋ ਬਾਰੰਬਾਰ ਬੇਸਿਆ ਕੀ ਜੂਨ ਮੇਂ ਆਵਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੁੜ ਮੁੜ ਵੇਸਵਾ ਦਾ ਜਨਮ ਲੈਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "renace una y otra vez como prostituta. (2)"