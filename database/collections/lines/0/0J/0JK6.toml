[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਹੋਵਤ; ਪ੍ਰਭ ਕੇਵਲ ਧਨੀ ॥"
page = 291
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Lord was the sole Master,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਠਾਕੁਰ ਹੀ ਕੱਲਮਕੱਲਾ ਮਾਲਕ ਸੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When there was only God the Master,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਪ੍ਰਪੰਚ ਰੂਪੀ ਮੈਲ ਸੇ ਰਹਿਤ ਕੇਵਲ ਸੁਧ ਰੂਪ ਪ੍ਰਭੂ ਆਪ ਧਨੀ ਹੋਤਾ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਮਾਲਕ ਪ੍ਰਭੂ ਸਿਰਫ਼ (ਆਪ ਹੀ) ਸੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਨੀ = ਮਾਲਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando Dios, el Maestro, estaba solo,"