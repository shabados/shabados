[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੁਧਵਾਰਿ; ਬੁਧਿ ਕਰੈ ਪ੍ਰਗਾਸ ॥"
page = 344
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "On Wednesday man should enlighten his understanding."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੁਧਵਾਰ ਨੂੰ ਬੰਦੇ ਨੂੰ ਆਪਣੀ ਸਮਝ ਉੱਜਲ ਕਰਨੀ ਉੱਚਿੱਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "On Wednesday, one's understanding is enlightened."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬੁਧਵਾਰ ਦ੍ਵਾਰੇ ਕਹਤੇ ਹੈਂ: ਉਤਮ ਬੁਧੀ ਕਾ ਪ੍ਰਕਾਸ ਕਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "('ਬਾਰ ਬਾਰ ਹਰਿ ਕੇ ਗੁਨ' ਗਾ ਕੇ, ਮਨੁੱਖ ਆਪਣੀ) ਸੂਝ ਵਿਚ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦਾ ਚਾਨਣ ਪੈਦਾ ਕਰ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੁਧਿ = ਅਕਲ। ਪ੍ਰਗਾਸੁ = ਚਾਨਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En miércoles, uno debe iluminar su mente"