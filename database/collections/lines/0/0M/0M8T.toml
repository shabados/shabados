[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿ ਇਲਮਸ਼ ਰਵਦ ਦਸਤ ਹੋਸ਼ ਅਜ਼ ਜਹਾ ॥੨੫॥"
page = 1417

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And they neglected their education and the worldly awareness.(25)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪੜ੍ਹਾਈ ਕਰਨੀ ਵਿਸਰ ਗਈ ਅਤੇ ਸੰਸਾਰ ਦੀ ਸੁਰਤ ਜਾਂਦੀ ਰਹੀ ॥੨੫॥"