[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਖਾਧ ਕੋ ਬਿਖਾਧ ਕੈ ਨ ਬ੍ਰਿਧ ਤਾਹਿ ਕੋ ਗਨ︀ਯੋ ॥੩੧੯॥"
page = 706

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Vishaad (hatred), though considered old one, ws not let off.92.319."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "'ਬਿਖਾਧ' ਨੂੰ ਬਿਖਾਧ (ਲੜਾਈ ਝਗੜੇ) ਕਰ ਕੇ ਵੱਡਾ ਨਹੀਂ ਮੰਨਿਆ ਹੈ ॥੩੧੯॥"