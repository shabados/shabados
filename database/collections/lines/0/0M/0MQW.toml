[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਰਤੂਤੀ ਆਚਾਰਿ, ਕਰਿ ਜਸੁ ਲੇਵਹੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The thinkers also could know nothing about His mystery."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਰਤੂਤਾਂ ਕਰਨਹਾਰੇ 'ਅਚਾਰ' (ਯੱਗ ਆਦਿਕ) ਵਡੇ ਕਰਮ ਕਰ ਕੇ ਜੱਸ ਲੈਂਦੇ ਹਨ।"