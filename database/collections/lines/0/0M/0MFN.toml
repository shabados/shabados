[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਗੁਰ ਤੇ ਪਾਇਆ ॥੪॥੭॥੨੩॥"
page = 1006
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It is through the Guru, that they obtain it, O Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਉਹ ਇਸ ਨੂੰ ਪ੍ਰਾਪਤ ਹੁੰਦੇ ਹਨ, ਹੇ ਨਾਨਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, through the Guru, they attain it. ||4||7||23||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਨੋਂ ਨੇ ਗੁਰੋਂ ਸੇ ਪਾਇਆ ਹੈ॥੪॥੭॥੨੩॥☬ਇਹ ਸਬਦ ਮਨ ਕੇ ਪ੍ਰਥਾਇ ਕਰਿ ਉਚਾਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ, ਹੇ ਨਾਨਕ! (ਇਹ ਖ਼ਜ਼ਾਨਾ) ਗੁਰੂ ਪਾਸੋਂ ਹੀ ਮਿਲਦਾ ਹੈ ॥੪॥੭॥੨੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues tal es la Bendición que el Guru ha puesto sobre ellos.(4-7-23)"