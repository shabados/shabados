[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਯੋ ਸਾਮੁਹੇ ਸਸਤ੍ਰ ਅਸਤ੍ਰੰ ਸੰਭਾਰੀ ॥"
page = 163

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Manifesting himself as Nar and Narayan, Vishnu, managing his weapons and arms, came in front of the demon-forces."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਅਸਤ੍ਰ-ਸ਼ਸਤ੍ਰ ਸੰਭਾਲ ਕੇ (ਦੈਂਤਾਂ ਦੀ ਸੈਨਾ ਦੇ) ਸਾਹਮਣੇ ਹੋਇਆ।"