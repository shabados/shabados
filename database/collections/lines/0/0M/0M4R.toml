data = "ਤਾ ਕੇ ਰਾਜਾ ਸੰਗ ਬਿਹਾਰੈ ॥੫॥"
page = 1002

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And whom so ever that Rani praised, Raja would play with her.(5)"

