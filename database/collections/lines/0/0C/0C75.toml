language = "pa"
data = "ਇਹ ਨਕੋ-ਨੱਕ ਭਰਿਆ ਪਿਆਲਾ ਭਲਾ ਸਾਨੂੰ ਕਿੱਥੋਣ ਪਰਾਪਤ ਹੋਇਆ#"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਈਣ ਜਾਮਿ ਲਬਾ-ਲਬ ਅਜ਼ ਕੁਜਾ ਯਾਫ਼ਤਾਏਮ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "The Creator and His creations are one and the same,"