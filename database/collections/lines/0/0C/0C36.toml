[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁਮਿਤ੍ਰੇਸ ਮਹੀਪ ਭਯੋ ਜਬ ਤੇ ॥"
page = 200

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Dharma of sacrifice was extensively propagated, when Dasrath, the Lord of Sumitra became the king."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦ ਤੋਂ ਦਸ਼ਰਥ (ਸੁਮਿਤ੍ਰੇਸ) ਰਾਜਾ ਹੋਇਆ।"