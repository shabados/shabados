[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਨਰ; ਰਾਮੁ ਰਿਦੈ ਹਰਿ ਰਾਸਿ ॥"
page = 154
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within whose mind has the capital of the Omnipresent God's Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪ੍ਰਾਣੀ ਦੇ ਅੰਤਰ-ਆਤਮੇ ਸਰਬ-ਵਿਆਪਕ ਸੁਆਮੀ ਅਤੇ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦੀ ਪੂੰਜੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those whose hearts are filled with the Lord's essence are blessed and acclaimed,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਰਿਦੇ ਮੇਂ ਰਮਣ ਰੂਪ ਕੀ ਸਰਧਾ ਰੂਪ ਪੂੰਜੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਹਰੀ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਰਾਸ-ਪੂੰਜੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸੁ ਨਰ ਰਿਦੈ = ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que enaltece el Nombre del Señor en su corazón, como su más grande Tesoro,"