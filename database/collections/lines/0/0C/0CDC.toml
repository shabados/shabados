data = "ਸਿਤੰ ਸਾਇ ਕੈਸੇ ॥੬੩੭॥"
page = 266

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He absorbed himself in the minds of all and all of them pursued him like shadow.637."

