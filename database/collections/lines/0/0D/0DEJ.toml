type = "primary"
data = "ਨ੍ਰਿਪ ਬਰ ਪ੍ਰਬੀਨ ॥੮੦॥"
page = 620

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The messengers told this that his sons, causing their horse to move on all the earth, had conquered all the kings and had taken them along with themselves.80."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਭ ਨੂੰ ਨਾਲ ਮਿਲਾ ਲਿਆ ॥੮੦॥"