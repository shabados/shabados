[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਂਛਤ ਨਾਹੀ; ਸੁ ਬੇਲਾ ਆਈ ॥"
page = 378
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The time (of death and disease) which man desires not arrives."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "(ਦੁੱਖ ਤੇ ਮੌਤ ਦਾ) ਉਹ ਸਮਾਂ, ਜਿਸ ਨੂੰ ਬੰਦਾ ਚਾਹੁੰਦਾ ਨਹੀਂ, ਆ ਪੁੱਜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That time, which the mortal does not wish for, eventually comes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਬੇਲੇ ਕੀ ਜੀਵ ਇਛਾ ਨਹੀਂ ਕਰਤਾ ਹੈ, ਸੋ ਮਰਨੇ ਕੀ ਬੇਲਾ ਨਿਕਟ ਆਈ ਖੜੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਨੂੰ ਕੋਈ ਭੀ ਪਸੰਦ ਨਹੀਂ ਕਰਦਾ, ਮੌਤ ਦਾ ਉਹ ਸਮਾ ਜ਼ਰੂਰ ਆ ਜਾਂਦਾ ਹੈ (ਮਨੁੱਖ ਫਿਰ ਭੀ ਨਹੀਂ ਸਮਝਦਾ ਕਿ ਮੌਤ ਜ਼ਰੂਰ ਆਉਣੀ ਹੈ।)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਂਛਤ ਨਾਹੀ = ਪਸੰਦ ਨਹੀਂ ਕਰਦਾ। ਸੁ ਬੇਲਾ = ਉਹ ਵੇਲਾ, ਮੌਤ ਦਾ ਵੇਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ese momento en el que uno no desea atestiguar, llega implacablemente al final."