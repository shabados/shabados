[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੋਹ ਲੋਭ ਡੂਬੌ ਸੰਸਾਰ ॥"
page = 1192
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In worldly love and greed the world is drowned."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰੀ ਮਮਤਾ ਤੇ ਲਾਲਚ ਅੰਦਰ ਜੱਗ ਡੁੱਬ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The world is drowning in attachment and greed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੋਹ ਔਰ ਲੋਭ ਮੇਂ ਸੰਸਾਰ ਡੂਬਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਦੇ ਮੋਹ ਅਤੇ ਲੋਭ ਵਿਚ ਉਹ ਸਦਾ ਡੁੱਬਾ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "día con día, y apegado a la avaricia y al deseo, uno es ahogado."