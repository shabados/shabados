[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਨਾਮੁ; ਊਹਾ ਸੰਗਿ ਤੋਸਾ ॥"
page = 264
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's Name shall there be the viaticum with thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ ਉਥੇ ਤੇਰੇ ਨਾਲ ਸਫਰ-ਖਰਚ ਹੋਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "there, the Name of the Lord shall be your sustenance."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹਰੀ ਕਾ ਨਾਮ ਹੀ ਊਹਾਂ ਤੇਰੇ ਸਾਥ (ਤੋਸਾ) ਖਰਚ ਵਾ ਭੋਜਨ ਹੋਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਥੇ (ਭਾਵ, ਉਸ ਲੰਮੇ ਸਫ਼ਰ ਵਿਚ) ਪ੍ਰਭੂ ਦਾ ਨਾਮ (ਜੀਵ ਦੇ) ਨਾਲ (ਰਾਹ ਦੀ) ਰਾਸ-ਪੂੰਜੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਊਹਾ = ਓਥੇ। ਸੰਗਿ = (ਤੇਰੇ) ਨਾਲ। ਤੋਸਾ = ਖ਼ਰਚ, ਪੂੰਜੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo el Nombre te alentará."