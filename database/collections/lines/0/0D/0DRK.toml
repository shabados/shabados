[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੂੜੀ ਕੂੜੀ; ਮੁਖਹੁ ਵਖਾਣੈ ॥੩॥"
page = 1151
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With his mouth, he utters falsehood."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮੂੰਹ ਨਾਲ ਨਿਰੋਲ ਝੂਠ ਹੀ ਬਕਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He speaks falsehood, only falsehood, with his mouth. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਝੂਠੀ ਝੂਠੀ ਮੁਖ ਸੇ ਠਗੋਂ ਵਤ ਰਾਮ ਰਾਮ ਕਹਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹਾਂ) ਝੂਠ-ਮੂਠ (ਲੋਕਾਂ ਨੂੰ ਠੱਗਣ ਲਈ ਆਪਣੇ) ਮੂੰਹੋਂ (ਰਾਮ ਰਾਮ) ਉਚਾਰਦਾ ਰਹਿੰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੂੜੀ ਕੂੜੀ = ਝੂਠ-ਮੂਠ। ਮੁਖਹੁ = ਮੂੰਹੋਂ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y todo lo que habla es totalmente falso. (3)"