[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਤਜੀ; ਮਨੈ ਕੀ ਕਾਮ ਕਰਾ ॥"
page = 408
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have renounced all the affairs of my mind's desire."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਚਿੱਤ ਦੀ ਖਾਹਿਸ਼ ਦੇ ਸਾਰੇ ਕੰਮ ਛੱਡ ਛੱਡੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have renounced all of the affairs of my mind's desires."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਮਨ ਕੀ ਜੋ ਕਾਮ ਕਲਾ ਵਾ ਕਲਪਨਾ ਥੀ ਸੋ ਸਭ ਤਜੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੇ ਮਨ ਦੀਆਂ ਸਾਰੀਆਂ ਵਾਸ਼ਨਾਂ ਤਿਆਗ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨੈ ਕੀ = ਮਨ ਦੀ। ਕਾਮ ਕਰਾ = ਵਾਸ਼ਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He renunciado y parado todos los deseos de mi mente,"