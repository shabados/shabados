[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੇ ਚਾਕਰ; ਸੇ ਭਲੇ ॥"
page = 211
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who are Lord's serfs are good."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਸੁਆਮੀ ਦੇ ਨਫ਼ਰ ਹਨ, ਉਹ ਚੰਗੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slaves of God are good."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜੋ ਆਪ ਕੇ ਚਾਕਰ ਹੈਂ, ਸੋ ਭਲੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇਹੜੇ ਮਨੁੱਖ) ਪਰਮਾਤਮਾ ਦੇ ਸੇਵਕ ਬਣਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇ = {ਬਹੁ-ਵਚਨ} ਉਹ ਬੰਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Radiantes están los semblantes de los Sirvientes del Señor;"