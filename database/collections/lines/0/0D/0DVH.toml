[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸੁ ਮਨ; ਮਾਇਆ ਮੋਹਿ ਬਿਨਾਸੁ ॥"
page = 1344
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The love of riches ruins this soul."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨ-ਦੌਲਤ ਦਾ ਪਿਆਰ ਇਸ ਜਿੰਦੜੀ ਨੂੰ ਤਬਾਹ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This mind is ruined by its attachment to Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਮਨ ਕੇ ਤਾਈਂ ਮਾਯਾ ਕਾ ਮੋਹਿ ਹੀ ਨਾਸੁ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ (ਫਸ ਕੇ) ਇਸ ਮਨ ਦੀ ਆਤਮਕ ਮੌਤ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਿ = ਮੋਹ ਵਿਚ। ਬਿਨਾਸੁ = ਆਤਮਕ ਮੌਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La mente es arruinada por su apego a Maya,"