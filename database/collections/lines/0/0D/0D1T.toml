[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਇਹੁ ਜਤੀ ਕਹਾਵੈ ਸੇਉ ॥"
page = 871
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It is neither called a celibate, not the worshipper of Shiva."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਂ ਇਹ ਬ੍ਰਹਿਮਚਾਰੀ ਆਖਿਆ ਜਾਂਦਾ ਹੈ, ਨਾਂ ਹੀ ਸ਼ਿਵਜੀ ਦਾ ਉਪਾਸ਼ਕ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It is not called celibate, or a worshipper of Shiva."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ (ਜਤੀ) ਸੰਨਿਆਸੀ ਭੀ ਇਹੁ ਨਹੀਂ ਹੈ ਔ ਨਾ ਸਿਵ ਉਪਾਸਕ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਹ ਜਤੀ ਹੈ ਨਾਹ ਸ਼ਿਵ-ਉਪਾਸ਼ਕ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਉ = ਸ਼ਿਵ ਦਾ ਉਪਾਸ਼ਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no es asceta ni tampoco hedonista."