[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੁ ਦਾਤਾ; ਦਇਆਲ ਬਖਸਿੰਦੁ ॥"
page = 897
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru is bounteous, compassionate and forgiving."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਦਾਤਾਰ, ਮਿਹਰਬਾਨ ਤੇ ਮਾਫੀ ਦੇਣਹਾਰ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru is the Great Giver, merciful and forgiving."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਗੁਰੂ ਹੀ ਸਭ ਪਦਾਰਥੋਂ ਕੇ ਦਾਤਾ ਹੈਂ ਔ ਦਇਆ ਦੇ ਘਰ ਔ ਅਵਗੁਨੋਂ ਕੋ ਬਖਸਨੇਹਾਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦਾਤਾਰ (ਪ੍ਰਭੂ ਦਾ ਰੂਪ) ਹੈ, ਗੁਰੂ ਦਇਆ ਦੇ ਸੋਮੇ ਬਖ਼ਸ਼ਣਹਾਰ ਪ੍ਰਭੂ (ਦਾ ਰੂਪ) ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "tu Guru siempre perdona y es Bueno."