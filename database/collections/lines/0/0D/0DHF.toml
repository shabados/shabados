[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ; ਆਪਿ ਨਿਰੰਕਾਰੁ ॥"
page = 274
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The knower of God is himself the Formless Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨੂੰ ਜਾਨਣ ਵਾਲਾ ਆਪੇ ਹੀ ਚਕ੍ਰ-ਚਿਨ੍ਹ-ਰਹਿਤ ਪ੍ਰਭੂ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The God-conscious being is himself the Formless Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਸੇ ਬ੍ਰਹਮ ਗਿਆਨੀ ਆਪ ਨਿਰੰਕਾਰ ਸਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ (ਤਾਂ ਪ੍ਰਤੱਖ) ਆਪ ਹੀ ਰੱਬ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El ser conciente de Dios, es Él Mismo el Señor Sin Forma."