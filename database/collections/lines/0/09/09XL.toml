[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹਉਮੈ ਗਰਬੁ ਨਿਵਾਰਿ, ਮਨਿ ਵਸਿ ਆਣੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They lose their ego and control their minds."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਤਿਵੇਂ ਹੀ ਗੁਰਮੁਖ ਲੋਕ) ਹਉਮੈਂ ਦੇ ਗਰਬ ਨੂੰ ਹਟਾਕੇ ਮਨ ਨੂੰ ਵੱਸ ਕਰਦੇ ਹਨ।"