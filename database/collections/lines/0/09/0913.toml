[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਤਿਸੁ ਕਿਰਪਾਲੁ ਬਿਧਾਤਾ ॥੪॥੭੧॥੧੪੦॥"
page = 194
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Nanak, unto him, God the describer of destiny is Merciful."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਉਸ ਉਤੇ ਕਿਸਮਤ ਦਾ ਲਿਖਾਰੀ ਵਾਹਿਗੁਰੂ ਦਇਆਵਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- O Nanak, the Lord, the Architect of Destiny, is merciful to them. ||4||71||140||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਪੁਰਸ਼ ਪਰ ਪਰਮੇਸ੍ਵਰ ਕ੍ਰਿਪਾਲ ਹੈ॥੪॥੭੧॥੧੪੦॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਸਿਰਜਣਹਾਰ ਪ੍ਰਭੂ ਉਸ ਉਤੇ ਦਇਆਵਾਨ ਹੁੰਦਾ ਹੈ ॥੪॥੭੧॥੧੪੦॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਧਾਤਾ = ਸਿਰਜਣਹਾਰ ਪ੍ਰਭੂ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre del Señor, oh dice Nanak, el Señor, Arquitecto del Destino, les muestra Su Misericordia.(4-71-140)"