[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਗੁਰਮੁਖਿ; ਹਰਿ ਸਿਮਰਨੁ ਤਿਨਿ ਪਾਇਆ ॥੮॥੧॥"
page = 263
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Nanak! that Guru-ward obtains the boon of God's meditation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਗੁਰੂ-ਸਮਰਪਣ ਵਾਹਿਗੁਰੂ ਦੇ ਭਜਨ ਦੀ ਦਾਤ ਪਾ ਲੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Gurmukh attains the remembrance of the Lord. ||8||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸੀ ਨੇ ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਹਰੀ ਕਾ ਸਿਮਰਨ ਪਾਯਾ ਹੈ॥੮॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਮਨੁੱਖ ਨੇ ਗੁਰੂ ਦੁਆਰਾ ਸਿਮਰਨ (ਦੀ ਦਾਤ) ਪ੍ਰਾਪਤ ਕਰ ਲਈ ਹੈ ॥੮॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕ = ਹੇ ਨਾਨਕ! ਤਿਨਿ = ਉਸ ਮਨੁੱਖ ਨੇ। ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਰਾਹੀਂ ॥੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, el Gurmukj obtiene la Meditación en Dios. (8-1)"