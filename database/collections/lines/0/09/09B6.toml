[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚਾਰਿ ਵਰਨ ਛਿਅ ਦਰਸਨਾਂ; ਨਾਮੁ ਦਾਨੁ ਇਸਨਾਨੁ ਕਰੰਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The followers of six philosophies and the four varnas make recitations, charities and take ablutions there."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਚਾਰ ਵਰਣ ਛੀ ਦਰਸ਼ਨ, ਨਾਮ, ਦਾਨ, ਸ਼ਨਾਨ ਕਰਦੇ ਹਨ।"