[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਬ ਲਗਿ ਬਨਿਯਾ ਹ੍ਵੈ ਦੁਖੀ; ਇਮਿ ਕਾਜੀ ਸੋ ਬੈਨ ॥"
page = 857

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Shah too, in agony begged the Quazi,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਦੋਂ ਤਕ ਬਨੀਆ ਵੀ ਦੁਖੀ ਹੋ ਕੇ ਕਾਜ਼ੀ ਨੂੰ ਇਸ ਤਰ੍ਹਾਂ ਕਹਿਣ ਲਗਾ"