[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਨੋ ਮੰਨੇ ਆਪਿ; ਸੋਈ ਮਾਨੀਐ ॥"
page = 398
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whom Thou Thyself acceptest O Lord he alone is honoured."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਤੂੰ ਕਬੂਲ ਕਰਦਾ ਹੈ, ਹੇ ਸਾਈਂ! ਕੇਵਲ ਓਸੇ ਦੀ ਹੀ ਇਜ਼ਤ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those whom You approve, are approved."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਤੂੰ ਆਪ ਮਾਨਤਾ ਹੈਂ ਵਹੀ ਦਾਸ ਸਭ ਜਗਹ ਮਾਨੇ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਪਰਮਾਤਮਾ ਆਪ ਆਦਰ ਦੇਂਦਾ ਹੈ ਉਹ (ਹਰ ਥਾਂ) ਆਦਰ ਪਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਨੇ = ਆਦਰ ਦੇਂਦਾ ਹੈ। ਸੋਈ = ਉਹੀ ਮਨੁੱਖ। ਮਾਨੀਐ = ਮੰਨਿਆ ਜਾਂਦਾ ਹੈ, (ਹਰ ਥਾਂ) ਆਦਰ ਪਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo aquél que el Señor aprueba, es reconocido."