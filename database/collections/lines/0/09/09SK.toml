[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁਰ ਅਸੁਰ ਅਰੁ ਨਰ ਨਾਰਿ; ਜਛ ਗੰਧ੍ਰਬ ਗੁਨ ਗਾਵਤ ॥"
page = 693

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Demons, Yakshas, Gandharvas, men, women all sing his praises"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੇਵਤੇ, ਦੈਂਤ ਅਤੇ ਨਰ-ਨਾਰੀ, ਯਕਸ਼, ਗੰਧਰਬ (ਸਭ ਉਸ ਦੇ) ਗੁਣ ਗਾਉਂਦੇ ਹਨ।"