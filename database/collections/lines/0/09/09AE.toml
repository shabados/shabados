[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਬ ਤੇ ਗਿਰਿਯੋ ਇੰਦ੍ਰਤੁ ਤੇ; ਪਰਿਯੋ ਪ੍ਰਿਥੀ ਪਰ ਆਨ ॥੧੩॥"
page = 974

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Through which he was dethroned from Indra’s domain and thrown on the earth."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਵੇਲੇ ਤੋਂ (ਉਹ) ਇੰਦਰ ਦੀ ਪਦਵੀ ਤੋਂ ਡਿਗ ਪਿਆ ਅਤੇ ਧਰਤੀ ਉਤੇ ਆ ਪਿਆ ॥੧੩॥"