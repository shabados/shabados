data = "ਰਿੱਧਿ ਸਿੱਧਿ, ਘਰ ਮੋ ਸਭ ਹੋਈ ॥"
page = 1388

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They have all the worldly and spiritual pleasures in their homes"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਨ੍ਹਾਂ ਦੇ) ਘਰ ਵਿਚ ਸਭ ਰਿਧੀਆਂ ਅਤੇ ਸਿਧੀਆਂ ਹੋ ਜਾਂਦੀਆਂ ਹਨ"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਰਿੱਧਿ ਸਿੱਧਿ; ਘਰ ਮੋ ਸਭ ਹੋਈ ॥"