[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਧੁਰਿ ਲਿਖਿਆ; ਸੁ ਕਰਮ ਕਮਾਇਆ ॥"
page = 1044
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What is pre-ordained for man, that deed he does."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁੱਛ ਬੰਦੇ ਲਈ ਮੁੱਢ ਤੋਂ ਲਿਖਿਆ ਹੋਇਆ ਹੈ, ਉਹੀ ਕੰਮ ਉਹ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He acts according to his pre-ordained destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਦੋਂ ਮਸਤਕ ਪਰ ਲਿਖਿਆ ਹੈ, ਸੋਈ ਕਰਮ ਇਸ ਜੀਵ ਨੇ ਕਮਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਾਰੀ ਖੇਡ ਪਰਮਾਤਮਾ ਦੀ ਰਜ਼ਾ ਵਿਚ ਹੋ ਰਹੀ ਹੈ) ਧੁਰ ਦਰਗਾਹ ਤੋਂ (ਰਜ਼ਾ ਅਨੁਸਾਰ ਜੀਵ ਦੇ ਮੱਥੇ ਉਤੇ ਜੋ ਲੇਖ) ਲਿਖਿਆ ਜਾਂਦਾ ਹੈ, ਉਹੀ ਕਰਮ ਜੀਵ ਕਮਾਂਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧੁਰਿ = ਪ੍ਰਭੂ ਦੀ ਹਜ਼ੂਰੀ ਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo que está inscrito para uno por Dios, eso sucede,"