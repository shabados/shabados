[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਓਅੰਕਾਰ ਅਕਾਰ ਕਰਿ; ਇਕੁ ਕਵਾਉ ਪਸਾਉ ਪਸਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The Maar assuming form created the whole world by His one commanding vibration."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਓਅੰਕਾਰ ਨੇ ਇਕ ਵਾਕ ਕਰ ਕੇ ਪਸਾਰਾ ਪਸਾਰ ਦਿਤਾ।"