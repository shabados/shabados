[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਸਰੰਜਾਮ; ਕਰੇ ਪ੍ਰਭੁ ਆਪੇ ॥"
page = 805
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the arrangements the Lord Himself makes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਇੰਤਜਾਮ ਸੁਆਮੀ ਆਪ ਹੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God Himself makes all arrangements."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰੇ ਸੁਖ ਕੇ (ਸਰੰਜਾਮ) ਉਪਾਵ ਆਪ ਹੀ ਪ੍ਰਭੂ ਨੇ ਕਰ ਦੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪ੍ਰਭੂ ਆਪ ਹੀ (ਸਰਨ ਪਏ ਮਨੁੱਖ ਦੇ) ਸਾਰੇ ਕੰਮ ਸਿਰੇ ਚਾੜ੍ਹਨ ਦੇ ਪ੍ਰਬੰਧ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰੰਜਾਮ = ਕੰਮ ਸਿਰੇ ਚਾੜ੍ਹਨ ਦੇ ਉੱਦਮ। ਸਗਲ = ਸਾਰੇ। ਆਪੇ = ਆਪ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, el Señor, nos colma con todos los bienes y necesidades;"