[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਜਨੁ ਮੀਤੁ; ਸਖਾ ਕਰਿ ਏਕੁ ॥"
page = 192
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Make the One Lord, thy friend intimate and comrade."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਦੁੱਤੀ ਸਾਹਿਬ ਨੂੰ ਤੂੰ ਆਪਨਾ ਦੋਸਤ ਯਾਰ ਅਤੇ ਸਾਥੀ ਬਣਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Make the One Lord your friend, intimate and companion."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਬਚ ਕਰਮ ਕਰ ਕੇ ਏਕ ਹਰੀ ਕੋ ਹੀ ਮਿਤ੍ਰ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਉਸ) ਇੱਕ ਗੋਬਿੰਦ ਨੂੰ ਆਪਣਾ ਸੱਜਣ ਮਿੱਤਰ ਸਾਥੀ ਬਣਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਖਾ = ਮਿੱਤਰ। ਕਰਿ = ਬਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sé el amigo de Dios solamente,"