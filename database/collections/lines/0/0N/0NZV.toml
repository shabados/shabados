[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਰਿ ਬਡੇ ਰਿਪੁ ਕੋ ਹਰਿ ਜੂ; ਸੰਗਿ ਗਊਅਨ ਲੈ ਸੁ ਗਏ ਬਨ ਮੈ ॥"
page = 373

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After killing the great enemy, Krishna went to the forest with his cows"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਵੱਡੇ ਵੈਰੀ ਨੂੰ ਮਾਰ ਕੇ ਕ੍ਰਿਸ਼ਨ ਜੀ ਗਊਆਂ ਨੂੰ ਲੈ ਕੇ ਬਨ ਵਿਚ ਚਲੇ ਗਏ।"