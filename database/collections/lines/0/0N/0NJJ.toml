[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਹੇ ਲਿਖੇ. ਨ ਚਲਨੀ; ਜਿੰਦੂ ਕੂੰ ਸਮਝਾਇ ॥"
page = 1377
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The recorded time of marriage cannot the altered. Explain thou this unto thy soul."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਆਹ ਦਾ ਲਿਖਿਆ ਹੋਇਆ ਵੇਲਾ ਬਦਲਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ। ਤੂੰ ਇਹ ਗੱਲ ਆਪਣੀ ਜਿੰਦੜੀ ਨੂੰ ਸਮਝਾ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That pre-ordained time of marriage cannot be avoided. Explain this to your soul."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਜੌਨ ਸੇ ਸ੍ਵਾਸੋਂ ਕੇ ਸੰਕੇਤ ਰੂਪ ਸਾਹੇ ਲਿਖੇ ਗਏ ਹੈਂ, ਸੋ ਚਲਾਇਵਾਨ, ਭਾਵ ਦੂਰ ਨਹੀਂ ਹੋਤੇ ਹੈਂ। ਤਿਸੀ ਤੇ ਹੇ ਭਾਈ! ਇਸ ਜਿੰਦ ਕੋ ਸਮਝਾਵਣਾ ਕਰ ਜੋ ਭਜਨ ਪਰਾਇਣ ਹੋਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿੰਦ ਨੂੰ (ਇਹ ਗੱਲ) ਸਮਝਾ ਕਿ (ਮੌਤ ਦਾ) ਇਹ ਮਿਥਿਆ ਹੋਇਆ ਸਮਾ ਟਲ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਚਲਨੀ = ਨਹੀਂ ਟਲ ਸਕਦੇ। ਜਿੰਦੁ ਕੂੰ = ਜਿੰਦ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ese momento ya está fijado y no se puede evitar, explícale esto a tu Alma."