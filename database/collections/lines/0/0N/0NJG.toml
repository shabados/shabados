[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਿਰੇ ਬੀਰ ਧੀਰੰ ਛੁਟੇ ਸਸਤ੍ਰ ਧਾਰੰ ॥੧੬॥੧੮੪॥"
page = 143

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And with the blows of weapons, the bold warriors were falling.16.184."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ਸਤ੍ਰਾਂ ਦੀਆਂ ਧਾਰਾਂ ਨਾਲ (ਵੱਡੇ ਵੱਡੇ) ਧੀਰਜਵਾਨ ਸੂਰਮੇ ਡਿਗੇ ਪਏ ਸਨ ॥੧੬॥੧੮੪॥"