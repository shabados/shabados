[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਤੇਰਹ ਪਦ ਕਰਿ ਜਗ ਵਿਚਿ; ਪਿਤਰਿ ਕਰਮ ਕਰਿ ਭਰਮਿ ਭੁਲਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The ritualistic people have overawed the people in their thirteen types of rituals."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੱਗ ਵਿਚ ਪਿਤਰ ਕਰਮ (ਆਦੀ) ਤੇਰਾਂ ਪਦ (ਕਰਮਾਂ ਦੇ) ਕਰ ਕੇ (ਸੰਸਾਰ ਨੂੰ ਕਰਮ ਕਾਂਡੀਆਂ ਨੇ) ਭਰਮਾਂ ਵਿਚ ਭੁਲਾ ਦਿੱਤਾ ਹੈ।"