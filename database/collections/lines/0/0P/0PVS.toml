[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਖ ਸੁਰਗ ਸਿਰਤਾਜ; ਗਲਾ ਪੀਹਾਵਣੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Grinding of corn (for the holy congregation) is more than the pleasure of myriads of heavens."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਣਕ ਪੀਹਣ ਦੀ (ਸਾਧ ਸੰਗਤ ਵਾਸਤੇ ਜੋ ਸੇਵਾ ਹੈ ਉਹ) ਲੱਖਾਂ ਸੁਰਗਾਂ ਦੀ ਸਿਰਤਾਜ ਹੈ।"