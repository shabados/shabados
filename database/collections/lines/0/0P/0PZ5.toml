[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਨਾਮੁ ਸਾਲਾਹਹ. ਦਿਨੁ ਰਾਤਿ; ਏਹਾ ਆਸ ਆਧਾਰੋ ॥"
page = 450
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's Name, I praise day and night, and this alone is my hope and support."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦੇ ਨਾਮ ਦੀ ਮੈਂ ਰਾਤ ਦਿਨ ਸਿਫ਼ਤ ਕਰਦਾ ਹਾਂ। ਕੇਵਲ ਇਹ ਹੀ ਮੇਰੀ ਆਸ ਤੇ ਆਸਰਾ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I praise the Lord's Name, day and night; this alone is my hope and support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਹਮ ਕੇਵਲ ਤੇਰੇ ਨਾਮ ਕੀ ਰਾਤ ਦਿਨ ਸੋਭਾ ਕਰਤੇ ਹੈਂ ਔਰ ਨਾਮ ਹੀ ਕਾ ਤਨ ਮਨ ਕਰ ਆਸਰਾ ਰਖਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਅਸੀਂ ਤਾਂ ਦਿਨੇ ਰਾਤ ਤੇਰੇ ਨਾਮ ਦੀ ਹੀ ਵਡਿਆਈ ਕਰਦੇ ਹਾਂ, ਸਾਡੇ ਜੀਵਨ ਦਾ ਇਹੀ ਸਹਾਰਾ ਹੈ ਇਹੀ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਲਾਹਹ = ਅਸੀਂ ਸਲਾਹੁੰਦੇ ਹਾਂ। ਆਧਾਰੋ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Alabo Tu Nombre por siempre, porque ésta es mi única Esperanza, lo primordial."