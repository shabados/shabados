[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਰਾਮ ਨਾਮੁ ਸਲਾਹਿ ਹਰਿ ਪ੍ਰਭ; ਹਰਿ ਭਗਤਿ ਹਰਿ ਜਨ ਮੰਗੀਆ ॥"
page = 576
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's slave begs for the Lord God's Name, the Lord God's praise and the Lord's devotional service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦਾ ਗੋਲਾ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦੇ ਨਾਮ, ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦੇ ਜੱਸ ਤੇ ਸੁਆਮੀ ਦੀ ਪ੍ਰੇਮਮਈ ਸੇਵਾ ਦੀ ਮੰਗ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord's humble servant begs for the Lord's Name, for the Lord's Praises, and for devotional worship of the Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਜਨੋਂ ਨੇ ਹਰਿ ਰਾਮ ਨਾਮ ਕੀ ਸੋਭਾ ਕਹ ਕਰ ਕੇ ਹਰਿ ਪ੍ਰਭੂ ਕੀ ਭਗਤੀ ਮਾਂਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਭਗਤ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦੀ ਵਡਿਆਈ ਕਰ ਕੇ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ (ਦੀ ਦਾਤਿ) ਮੰਗਦੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਲਾਹਿ = ਸਲਾਹ ਕੇ। ਹਰਿ ਜਨ = ਹਰੀ ਦੇ ਭਗਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "del Nombre del Señor, de las Alabanzas del Señor, y pide por la Devoción en el Servicio a Dios nuestro Señor."