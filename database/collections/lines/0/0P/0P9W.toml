[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਪ੍ਰਸਾਦਿ; ਰੰਗ ਰਸ ਭੋਗ ॥"
page = 269
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose favour thou enjoyest love and pleasures,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਦਇਆ ਦੁਆਰਾ ਤੂੰ ਪਿਆਰ ਅਤੇ ਖੁਸ਼ੀਆਂ ਮਾਣਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By His Grace, you enjoy tastes and pleasures;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਤੂੰ ਰਸੋਂ ਕੋ ਭੋਗ ਕਰ (ਰੰਗ) ਅਨੰਦ ਹੋਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਪ੍ਰਭੂ) ਦੀ ਬਖ਼ਸ਼ਸ਼ ਕਰਕੇ ਚੋਜ-ਤਮਾਸ਼ੇ, ਸੁਆਦਲੇ ਖਾਣੇ ਤੇ ਪਦਾਰਥ (ਨਸੀਬ ਹੁੰਦੇ ਹਨ)"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él te ha dado la alegría del amor y el tesoro de la vida, sólo Él merece tu Devoción."