[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੀ ਸਰਣਿ ਪੂਰੇ ਗੁਰਦੇਵ ॥"
page = 893
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Perfect great God, I seek Thy protection,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪੂਰਨ ਵਿਸ਼ਾਲ ਵਾਹਿਗੁਰੂ! ਮੈਂ ਤੇਰੀ ਪਨਾਹ ਲੋੜਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my Protection, O perfect Divine Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੂਰਨ ਪੁਰਖ ਪੁਨਹ ਸਰਬ ਕਰ ਕੇ ਪੂਜ੍ਯ ਪ੍ਰਕਾਸ ਸਰੂਪ! ਮੈਨੇ ਤੇਰੀ ਸਰਨ ਲਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਰਬ-ਗੁਣ ਭਰਪੂਰ ਤੇ ਸਭ ਤੋਂ ਵੱਡੇ ਦੇਵਤੇ! ਮੈਂ ਤੇਰੀ ਸਰਨ ਆਇਆ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਦੇਵ = ਹੇ ਗੁਰਦੇਵ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios Perfecto, busco Tu Santuario,"