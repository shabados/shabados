data = "ਕਿਯੋ ਪਯਾਨੌ ਮੀਤ ਪਹਿ; ਉਦਰ ਕਟਾਰੀ ਮਾਰ ॥੩੫॥"
page = 995

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And thrust it into her own abdomen and fell near’the friend.(35)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਪੇਟ ਵਿਚ ਮਾਰ ਕੇ ਯਾਰ ਦੇ ਪਾਸ ਚਲੀ ਗਈ ॥੩੫॥"