[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਬ ਪੂਛੇ; ਕਿਆ ਕਹਾ ॥"
page = 1203
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If questioned, what can man say now?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਪੁਛਿਆ ਜਾਵੇ ਤਾਂ ਆਦਮੀ ਹੁਣ ਕੀ ਆਖ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Now if he is asked, what can he say?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! (ਅਬ) ਪਰਮੇਸ਼ਰ ਜੋ ਪੂਛੇਗਾ ਕਿ ਤੈਨੇ ਮਾਨੁਖ ਜਨਮ ਪਾਇ ਕਰ ਕਿਆ ਕੀਆ ਤਬ ਕਿਆ ਉਤਰ ਕਹੇਗਾ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਾਵਰੇ! ਹੁਣ ਜੇ ਤੈਨੂੰ ਪੁੱਛਿਆ ਜਾਏ ਤਾਂ ਕੀਹ ਦੱਸੇਂਗਾ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਛੇ = ਜੇ (ਤੈਨੂੰ) ਪੁੱਛਿਆ ਜਾਏ। ਕਿਆ ਕਹਾ = ਕੀਹ ਦੱਸੇਂਗਾ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el que anda perdido viene a mí ahora, haciendo preguntas, ¿qué le voy a decir?"