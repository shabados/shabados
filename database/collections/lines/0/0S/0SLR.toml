[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਨਤ ਜੀਓ; ਜਾਸੁ ਨਾਮੁ ॥"
page = 987
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is such, hearing whose Name, one comes to life,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਐਸਾ ਹੈ ਜਿਸ ਦਾ ਨਾਮ ਸੁਣ ਕੇ ਇਨਸਾਨ ਜੀਉ ਉਠਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Hearing His Name, one comes to life."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਨਾਮ ਕੋ ਸੁਨ ਕੇ ਜੀਵਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸੁਣਦਿਆਂ ਆਤਮਕ ਜੀਵਨ ਮਿਲਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਓ = ਆਤਮਕ ਜੀਵਨ ਮਿਲਦਾ ਹੈ। ਜਾਸੁ = {यस्य} ਜਿਸ ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escuchando Su Nombre uno vuelve a la vida,"