[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਰਿ ਦੀਓ ਜੀਅਤ ਨ ਉਠਾਵਾ ॥੬੮॥"
page = 70

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Gopal heard these words, he killed Himmat and did not allow him to get up alive. 68."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ (ਉਸ ਨੇ ਹਿੰਮਤ ਨੂੰ) ਮਾਰ ਦਿੱਤਾ ਅਤੇ ਜੀਉਂਦਾ ਨਾ ਉਠਣ ਦਿੱਤਾ ॥੬੮॥"