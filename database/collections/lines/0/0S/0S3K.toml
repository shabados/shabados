[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭਿ ਜਾਚਿਕ; ਪ੍ਰਭ ਤੁਮੑ ਦਇਆਲ ॥"
page = 1181
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, Thou are Merciful, all are Thine beggars."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਈਂ! ਤੂੰ ਮਿਹਰਬਾਨ ਹੈ, ਸਾਰੇ ਹੀ ਤੇਰੇ ਮੰਗਤੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "We are all beggars, O God; You are merciful to us."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਿਆਲ ਪ੍ਰਭੂ! ਸਭ ਜੀਵ ਤੇਰੇ ਭਿਛਕ ਹੈਂ ਅਰੁ ਤੁਮ ਦਾਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਸਾਰੇ ਜੀਵ (ਤੇਰੇ ਦਰ ਦੇ) ਮੰਗਤੇ ਹਨ, ਤੂੰ ਸਭ ਉੱਤੇ ਦਇਆ ਕਰਨ ਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭਿ = ਸਾਰੇ (ਜੀਵ)। ਜਾਚਿਕ = ਮੰਗਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, todos Te buscan pues eres el Único Señor Bondadoso"