[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਜਿ ਅਭਿਮਾਨੁ; ਲੇਹੁ ਮਨ ਮੋਲਿ ॥"
page = 283
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Give up arrogance, use your mind as measure,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਸਵੈ-ਹੰਗਤਾ ਛੱਡ ਦੇ, ਤੇ ਮਨ ਦੇ ਵਟੇ ਖਰੀਦ ਲੈ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Renounce your egotistical pride, and with your mind,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੰਕਾਰ ਕੋ ਤਿਆਗ ਕਰ ਮਨ ਕੋ ਦੇ ਕੇ ਰਾਮ ਨਾਮ ਮੋਲ ਲੇਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਵਾਸਤੇ) ਅਹੰਕਾਰ ਛੱਡ ਦੇਹ, ਤੇ ਮਨ ਦੇ ਵੱਟੇ (ਇਹ ਵੱਖਰ) ਖ਼ਰੀਦ ਲੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਜਿ = ਛੱਡ ਦੇਹ। ਮਨ ਮੋਲਿ = ਮਨ ਦੇ ਮੁੱਲ ਤੋਂ, ਮਨ ਦੇ ਵਟਾਂਦਰੇ, ਮਨ ਦੇ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Renuncia a tu ego negativo y con tu mente"