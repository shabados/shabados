[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੁ ਪੂਰਾ ਪਾਇਓ; ਮੇਰੇ ਭਾਈ ॥"
page = 395
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The perfect Guru I have obtained O my brother."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਾਂ ਨੂੰ ਪਰਾਪਤ ਕਰ ਲਿਆ ਹੈ, ਹੇ ਮੈਡੇ ਵੀਰ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have obtained the Perfect Guru, O my Siblings of Destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਭਾਈ! ਮੈਨੇ ਪੂਰਾ ਗੁਰੂ ਪਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਵੀਰ! ਜਦੋਂ ਦਾ ਮੈਨੂੰ ਪੂਰਾ ਗੁਰੂ ਮਿਲਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਈ = ਹੇ ਭਾਈ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando uno encuentra al Guru Perfecto, oh querido,"