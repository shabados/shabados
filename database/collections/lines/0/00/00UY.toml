[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਥੈ ਭਾਗੁ. ਤ ਪਾਵਉ ਸੰਗੁ ॥"
page = 391
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If good destiny be recorded on my brow, then do I obtain their society."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਚੰਗੀ ਕਿਸਮਤ ਮੇਰੇ ਮੱਥੇ ਤੇ ਲਿਖੀ ਹੋਈ ਹੋਵੇ, ਤਦ ਹੀ ਮੈਂ ਉਨ੍ਹਾਂ ਦੀ ਸੰਗਤ ਨੂੰ ਪਰਾਪਤ ਹੁੰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By that good destiny inscribed upon my forehead, I obtain their society."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੌ ਮੇਰੇ ਮਾਥੇ ਉਤਮ ਭਾਗ ਲਿਖਾ ਹੋਇ ਤੋ ਉਨ ਕਾ ਸਤਸੰਗ ਪਾਵੋਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮੱਥੇ ਉੱਤੇ (ਪੂਰਬਲੇ ਕਰਮਾਂ ਦਾ) ਭਾਗ ਜਾਗ ਪਏ ਤਾਂ ਮੈਂ ਉਹਨਾਂ ਸੁਹਾਗਣਾਂ ਦੀ ਸੰਗਤਿ ਹਾਸਲ ਕਰਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਥੈ = ਮੱਥੇ ਉਤੇ। ਸੰਗੁ = ਸਾਧ, ਸੰਗਤਿ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando soy afortunado, me asocio con ellos,"