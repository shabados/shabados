[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਪੰਚ ਸੈਲ ਸੁਖ ਮਾਨੈ ॥"
page = 655
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that elite, enjoys mountain of bliss."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੁੱਖੀ ਜਨ ਪਹਾੜ ਜਿੰਨੀ ਖੁਸ਼ੀ ਭੋਗਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Enjoy great peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ (ਪੰਚ) ਸੰਤੋਂ ਕਾ ਜੋ ਅਚਲ ਸੁਭਾਵ ਆਤਮ ਸੁਖੁ ਹੈ ਤਿਸ ਅਨੰਦ ਕੋ ਭੋਗਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੰਤਾਂ ਵਾਲੇ ਅਟੱਲ ਆਤਮਕ ਸੁਖ ਨੂੰ ਮਾਣਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੈਲ = ਸਿਲਾ ਵਰਗਾ, ਪਹਾੜ ਵਰਗਾ ਅਟੱਲ। ਮਾਨੈ = ਮਾਣਦਾ ਹੈ। ਪੰਚ = ਸੰਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo él camina a través de la vida con facilidad."