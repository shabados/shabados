[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ; ਬੰਧਨ ਤੇ ਮੁਕਤਾ ॥"
page = 273
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The knower of God is free from entanglements."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨੂੰ ਜਾਨਣ ਵਾਲਾ ਉਲਝੇਵਿਆਂ ਤੋਂ ਆਜ਼ਾਦ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The God-conscious being is free from entanglements."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ ਬੰਧਨੋਂ ਸੇ ਮੁਕਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮਗਿਆਨੀ (ਮਾਇਆ ਦੇ) ਬੰਧਨਾਂ ਤੋਂ ਆਜ਼ਾਦ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਕਤਾ = ਆਜ਼ਾਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El ser conciente de Dios está libre de enredos."