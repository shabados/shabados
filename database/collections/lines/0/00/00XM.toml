type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਸਭ ਪਹਿਚਾਨੋ ॥੭੯੮॥"
page = 759

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Utter firstly the word “Ambujani” and then “Jaa-char-pati-shatru” and comprehend the names of Tupak.798."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਾਰੇ ਤੁਪਕ ਦੇ ਨਾਮ ਵਜੋਂ ਪਛਾਣੋ ॥੭੯੮॥"