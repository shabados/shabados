[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਤੋ ਜਾਇ; ਕਹਾ ਤੇ ਆਵੈ ॥"
page = 152
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Can it be known, whence the man has come?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੀ ਇਹ ਜਾਣਿਆ ਜਾ ਸਕਦਾ ਹੈ ਕਿ ਆਦਮੀ ਕਿਥੋਂ ਆਇਆ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How can we know where we came from?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਰੋ! ਏਹ ਜਾਣਿਆਂ ਜਾਵੇ ਕਿ ਜੀਵ ਕਹਾਂ ਤੇ ਆਵਤਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਇਹ ਕਿਵੇਂ ਸਮਝ ਆਵੇ ਕਿ (ਇਹ ਵਾਸਨਾ) ਕਿਥੋਂ ਆਉਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਤੋ ਜਾਇ = (ਕਿਵੇਂ) ਜਾਤੋ ਜਾਇ, ਕਿਵੇਂ ਸਮਝਿਆ ਜਾਏ? {\"ਤੇਰਾ ਕੀਤਾ ਜਾਤੋ ਨਾਹੀ\"}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El hombre nace y luego muere."