data = "ਭਰੇ ਨੇਹ ਗੇਹੰ ਗਏ ਕੰਕ ਬੰਕੰ ॥"
page = 119

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The comely crows and vultures having liking for that place have also departed for their homes,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਆਪਣੇ) ਘਰਾਂ ਪ੍ਰਤਿ ਨੇਹ ਨਾਲ ਭਰੇ ਹੋਏ ਭਿਆਨਕ ('ਬੰਕੰ') ਕਾਂ ਚਲੇ ਗਏ ਸਨ"