[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਨੋ ਬਖਸੇ, ਦੇ ਵਡਿਆਈ ॥"
page = 159
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord grants glory to Him, whom He forgives."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਉਸ ਨੂੰ ਸੋਭਾ ਬਖਸ਼ਦਾ ਹੈ ਜਿਸ ਨੂੰ ਉਹ ਮਾਫ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He grants greatness to those whom He forgives."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੋ ਅਪਨੇ ਨਾਮ ਕੀ ਵਡਿਆਈ ਦੇ ਕਰ ਬਖਸ਼ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਮਨੁੱਖ ਉਤੇ ਪਰਮਾਤਮਾ ਮਿਹਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸ ਨੋ = {ਲਫ਼ਜ਼ 'ਜਿਸੁ' ਦਾ (ੁ) ਸੰਬੰਧਕ 'ਨੋ' ਦੇ ਕਾਰਨ ਲੋਪ ਹੋ ਗਿਆ ਹੈ। ਵੇਖੋ 'ਗੁਰਬਾਣੀ ਵਿਆਕਰਣ'}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A través de la Gracia del Guru,"