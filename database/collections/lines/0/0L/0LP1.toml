[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਹਿਨਿਸਿ; ਫੂਲ ਬਿਛਾਵੈ ਮਾਲੀ ॥"
page = 225
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Day and night the flower-girls may scatter flowers thereon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਰੈਣ ਮਾਲਣ ਉਸ ਉਤੇ ਪੁਸ਼ਪ ਖਿਲਾਰਦੀ ਹੋਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "day and night, the flower-girls scatter flower petals;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਦਿਨੇ ਮਾਲੀ ਫੁਲੋਂ ਕੇ ਬਿਛਾਉਨੇ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਉਤੇ ਮਾਲੀ ਦਿਨ ਰਾਤ ਫੁੱਲ ਵਿਛਾਂਦਾ ਰਹੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਹਿ = ਦਿਨ। ਨਿਸਿ = ਰਾਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el jardinero podrá llenar de flores su aposento,"