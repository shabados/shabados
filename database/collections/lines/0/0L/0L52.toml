data = "ਆਸਾ ਮਹਲਾ ੪ ਛੰਤ ਘਰੁ ੫ ॥"
page = 451
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Asa 4th Guru. Chhant"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਸਾ ਚੌਥੀ ਪਾਤਸ਼ਾਹੀ। ਛੰਦ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Aasaa, Fourth Mehl, Chhant, Fifth House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਆਸਾ, ਘਰ ੫ ਵਿੱਚ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਦੀ ਬਾਣੀ 'ਛੰਤ'।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Asa, Mejl Guru Ram Das, Cuarto Canal Divino."