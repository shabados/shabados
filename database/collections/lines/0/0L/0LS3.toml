type = "primary"
data = "ਬਹੇ ਖੱਗਯੰ ਖੇਤ ਖਿੰਗੰ ਸੁ ਧੀਰੰ ॥"
page = 160

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sword and daggers of the warriors with the power of endurance have been struck"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਯੁੱਧ-ਭੂਮੀ ਵਿਚ ਘੋੜਿਆਂ ਉਤੇ ਚੜ੍ਹੇ ਧੀਰਜਵਾਨ ਸੂਰਮਿਆਂ ਦੀਆਂ ਤਲਵਾਰਾਂ ਚਲਣ ਲਗੀਆਂ ਸਨ"