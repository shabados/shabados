[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੁ. ਤਾ ਪਰੁ ਜਾਣੀਐ; ਜਾ ਸਚਿ ਧਰੇ ਪਿਆਰੁ ॥"
page = 468
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then alone, man is known as true, if he bears love to the True One."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤਦ ਹੀ ਬੰਦਾ ਸੱਚਾ ਜਾਣਿਆਂ ਜਾਂਣਾ ਹੈ, ਜੇਕਰ ਉਹ ਸਤਿਪੁਰਖ ਨੂੰ ਪ੍ਰੇਮ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One knows the Truth only when he bears love to the True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚ ਤੌ ਭਲੀ ਪ੍ਰਕਾਰ ਜਾਨਾ ਜਾਤਾ ਹੈ, ਜਬ ਸਚੇ ਵਾਹਿਗੁਰੂ ਸੇ ਪ੍ਰੇਮ ਧਾਰਨ ਕਰੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਛਲ ਵਲੋਂ ਮਨ ਦੇ ਫੁਰਨੇ ਹਟ ਕੇ, ਕੁਦਰਤ ਦੇ) ਅਸਲੇ ਦੀ ਸਮਝ ਤਦੋਂ ਹੀ ਆਉਂਦੀ ਹੈ, ਜਦ ਮਨੁੱਖ ਉਸ ਅਸਲੇ ਵਿਚ ਮਨ ਜੋੜਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Conocemos la Verdad cuando amamos la Verdad."