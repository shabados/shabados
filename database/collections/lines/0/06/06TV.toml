[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਿ ਕਬੀਰ; ਭਜਿ ਰਾਮ ਨਾਮ ॥੩॥੨॥"
page = 1194
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that man may contemplate the Lord's Name, Says Kabir."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਇਹ ਆਖਦੇ ਹਨ, ਕਿ ਬੰਦਾ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "says Kabeer, is to meditate and vibrate on the Lord's Name. ||3||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਇਸ ਕੋ ਭਜੁ॥੩॥੨॥☬ਇਸ ਸਬਦ ਕੇ ਦੋ ਅਰਥ ਹੈਂ: ਏਕ ਅਤ੍ਯੰਤਾ, ਭਾਵ ਮੇਂ ਦੂਸਰਾ ਸਿਧਾਂਤ ਮੇਂ ਸੇ ਸਿਧਾਂਤ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ ਕਿ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਸਿਮਰ (ਕੇ ਸੁਚੇਤ ਰਹੁ) ॥੩॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es lo más eficaz de todo. (3-2)"