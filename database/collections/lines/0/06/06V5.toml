[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਿਨ ਕੀ ਠਉਰ ਦੇਵਤਾ ਥਾਪੇ ॥"
page = 55

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I destroyed them in no time and created gods in their place."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੀ ਥਾਂ ਤੇ ਦੇਵਤਿਆਂ ਦੀ ਸਥਾਪਨਾ ਕੀਤੀ।"