[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨੇ ਦਾਸ ਕਉ; ਦੇਇ ਵਡਾਈ ॥"
page = 285
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "On His attendant the Lord bestows glory."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਟਹਿਲੂਏ ਤੇ ਸਾਈਂ ਪ੍ਰਭੁਤਾ ਨਿਛਾਵਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He blesses His slave with greatness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਦਾਸ ਕੋ ਵਡਿਆਈ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪਣੇ ਸੇਵਕ ਨੂੰ ਮਾਣ ਬਖ਼ਸ਼ਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਡਾਈ = ਵਡਿਆਈ, ਮਾਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y le inspira a meditar en el Nombre."