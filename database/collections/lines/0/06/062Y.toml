[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚਾ ਸਬਦੁ. ਸਚੀ ਹੈ ਬਾਣੀ ॥"
page = 1044
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is the Lord and true is His Gurbani."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚਾ ਹੈ ਸੁਆਮੀ ਅਤੇ ਸੱਚੀ ਹੈ ਉਸ ਦੀ ਗੁਰਬਾਣੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True is the Word of the Shabad, and True is the Bani of His Word."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨਾਂ ਨੇ ਸਚਾ ਉਪਦੇਸ਼ ਧਾਰਨ ਕੀਆ ਹੈ, ਤਿਨ ਕੀ ਬਾਣੀ ਸਚੀ ਹੂਈ ਹੈ, ਭਾਵ ਵਹੁ ਸਤਵਾਦੀ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ-ਥਿਰ ਪਦਾਰਥ ਗੁਰ-ਸ਼ਬਦ ਹੀ ਹੈ, ਸਦਾ-ਥਿਰ ਵਸਤ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ ਹੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚਾ = ਸੱਚਾ, ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ। ਸਚੀ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Verdadera, siempre Verdadera es la Palabra del Guru,"