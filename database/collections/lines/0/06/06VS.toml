[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸੁਹਦੇ ਲਖ ਸਹੀਦ ਹੋਇ; ਲਖ ਅਬਦਾਲ ਮਲੰਗ ਮਿਲਾਣੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Millions of mean people, martyrs, faquirs and carefree persons are there."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਲੱਖਾਂ ਸ਼ੁਹਦੇ, ਲੱਖਾਂ ਸ਼ਹੀਦ, ਲੱਖਾਂ ਅਬਦਾਲ (ਫਕੀਰੀ ਦਾ ਦਰਜਾ), ਲੱਖਾਂ ਮਲੰਗ (ਫਕੀਰੀ ਦੇ ਦਰਜੇ) ਮਿਲਦੇ ਹਨ।"