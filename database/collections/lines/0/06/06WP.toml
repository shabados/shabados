[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਹਿ ਏਕੁ; ਆਪਿ ਬਿਸਥਾਰੁ ॥"
page = 292
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself is One and Himself many."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪੇ ਹੀ ਇਕੱਲਾ ਹੈ ਅਤੇ ਆਪੇ ਹੀ ਅਨੇਕ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is the One, and He Himself is the many."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਏਕ ਰੂਪ ਹੈਂ ਪੁਨਾ ਆਪ ਹੀ ਅਪਨੇ ਸੇ ਬਿਸਥਾਰ ਕਰ ਲੇਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਇੱਕ ਹੈ (ਸ੍ਰਿਸ਼ਟੀ ਰਚਣ ਤੋਂ ਪਹਿਲਾਂ), ਤੇ ਆਪ ਹੀ (ਜਗਤ ਨੂੰ ਆਪਣੇ ਵਿਚ) ਸਮੇਟ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪਹਿ = ਆਪ ਹੀ। ਬਿਸਥਾਰੁ = ਖਿਲਾਰਾ, ਪਸਾਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el Uno y también el Infinitamente Variado."