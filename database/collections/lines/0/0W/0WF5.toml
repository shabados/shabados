[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਾ ਅੰਦਰਿ ਸਚੇ ਕਾ ਭਉ ਨਾਹੀ; ਨਾਮਿ. ਨ ਕਰਹਿ ਪਿਆਰੁ ॥"
page = 587
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who in their mind, fear not the True Lord and love not the Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਪਣੇ ਹਿਰਦੇ ਵਿੱਚ ਸੱਚੇ ਸੁਆਮੀ ਤੋਂ ਨਹੀਂ ਡਰਦੇ ਅਤੇ ਨਾਮ ਨਾਲ ਪ੍ਰੀਤ ਨਹੀਂ ਕਰਦੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They do not fear the True Lord within their hearts, and they do not love the Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੇ ਅੰਦਰ ਸਚੇ ਕਾ ਭ੍ਯ ਨਹੀਂ ਹੈ ਪੁਨਾ ਨਾਮ ਮੇਂ ਪਿਆਰ ਨਹੀਂ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਡਰ ਨਹੀਂ, ਜੋ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਿਚ ਕਦੇ ਪਿਆਰ ਨਹੀਂ ਪਾਉਂਦੇ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin Reverencia por el Uno Verdadero y sin Amor al Nombre,"