[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਮ ਮਰਨ; ਮਨ ਮੋਹੁ ਬਢਾਇਓ ॥"
page = 250
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Worldly love, the root of birth and death, the Master has increased in man's mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੰਮਣ, ਮਰਣ ਦੀ ਜੜ੍ਹ, ਸੰਸਾਰੀ ਮਮਤਾ, ਮਾਲਕ ਨੇ ਮਨੁੱਸ਼ ਦੇ ਮਨੂਏ ਅੰਦਰ ਘਨੇਰੀ ਕਰ ਦਿਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The attachment of the mind has led to birth and death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਮੇਂ ਜੋ ਮੋਹ ਵਧਾਇ ਦੀਆ ਹੈ, ਇਸ ਤੇ ਜਨਮ ਮਰਨ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਨਮ ਮਰਨ ਦਾ ਮੂਲ ਜੀਵਾਂ ਦੇ ਮਨ ਦਾ ਮੋਹ ਭੀ ਤੂੰ ਹੀ ਵਧਾਇਆ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el nacimiento, la mente, su proyección y  la muerte"