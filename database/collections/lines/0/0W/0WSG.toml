[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਨਾਮੁ ਅਪੁਨਾ ਦੇਹੁ ॥"
page = 838
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Bless me with Thine Name, O God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਆਪਣਾ ਨਾਮ ਪਰਦਾਨ ਕਰ, ਹੇ ਵਾਹਿਗੁਰੂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please bless me with Your Name, Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਅਪਨਾ ਨਾਮ ਮੁਝ ਕੋ ਦੇਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਨੂੰ ਆਪਣਾ ਨਾਮ ਬਖ਼ਸ਼!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y bendíceme con Tu Nombre;"