[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਨੀ, ਮੈ ਯਹ ਕਛੂ ਨ ਪਾਯੋ ॥"
page = 996

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(He said) ‘Some body has toppled over my bed, and, Rani, I could not discern.’"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਣੀ! ਮੈਂ ਇਹ ਕੁਝ ਨਹੀਂ ਸਮਝ ਸਕਿਆ।"