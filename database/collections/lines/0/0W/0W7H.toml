[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਨੑ ਬਿਧਿ; ਪਾਸਾ ਢਾਲਹੁ ਬੀਰ ॥"
page = 1185
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In this way, throw your dice, O brothers."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰੀਕੇ ਨਾਲ ਆਪਣੀਆਂ ਨਰਦਾਂ ਸੁੱਟੋ, ਹੇ ਭਰਾਓ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In this way, throw the dice, O brothers."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ (ਬੀਰ) ਭਾਈ! ਇਸ ਪ੍ਰਕਾਰ ਪਾਸਾ ਢਾਲਹੁ॥☬ਜੇ ਕਹੇ ਕੈਸੇ? ਸੋ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਵੀਰ! ਇਸ ਤਰ੍ਹਾਂ (ਇਸ ਜੀਵਨ-ਖੇਡ ਵਿਚ) ਦਾਅ ਚਲਾਵੋ (ਪਾਸਾ ਸੁੱਟੋ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਨ ਬਿਧਿ = ਇਸ ਤਰੀਕੇ ਨਾਲ। ਪਾਸਾ ਢਾਲਹੁ = ਪਾਸਾ ਸੁੱਟੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hermanos, tiren los dados y contemplen siempre el Nombre,"