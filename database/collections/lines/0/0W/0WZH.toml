[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਜਦ ਤਕ ਰੱਬ ਕਾਇਮ ਹੈ, ਉਹ ਵੀ ਅਮਰ ਹੋ ਜਾਣਦਾ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਤਾ ਖ਼ੁਦਾ ਕਾਇਮ ਬਵਦ ਦਾਇਮ ਬਵਦ ॥੨੭॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Then, how can his mind turn away from this royal kingdom? (379)"