[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਠਾਕੁਰ; ਐਸੋ ਨਾਮੁ ਤੁਮੑਾਰੋ ॥"
page = 498
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, such is the glory of Thy Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਐਹੋ ਜਿਹੇ ਹੈ ਪ੍ਰਤਾਪ ਤੇਰੇ ਨਾਮ ਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord Master, such is Your Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਠਾਕੁਰ! ਤੁਮਾਰਾ ਨਾਮ ਐਸਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਲਕ-ਪ੍ਰਭੂ! ਤੇਰਾ ਨਾਮ ਅਸਚਰਜ ਸ਼ਕਤੀ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਕੁਰ = ਹੇ ਠਾਕੁਰ! ਐਸੋ = ਅਜੇਹੀ ਸਮਰਥਾ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Maestro, tal es Tu Nombre Grandioso;"