[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਹਿ; ਨਰ ਨਾਰੀ ਆਸਰਮਾ ॥"
page = 1079
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All men, women and the four institutions dwell upon the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਮੂਹ ਮਰਦ, ਇਸਤ੍ਰੀਆਂ ਅਤੇ ਚਾਰੇ ਸ਼੍ਰੇਣੀਆਂ ਸਾਹਿਬ ਦਾ ਭਜਨ ਕਰਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Men and women, throughout the four stages of life, meditate in remembrance on You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਰਸ ਇਸਤ੍ਰੀ ਔ ਚਾਰੋਂ ਆਸ੍ਰਮ ਤੇਰੇ ਕੋ ਸਿਮਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਚੌਹਾਂ ਆਸ਼੍ਰਮਾਂ ਦੇ ਨਰ ਤੇ ਨਾਰੀਆਂ ਪ੍ਰਭੂ ਦਾ ਸਿਮਰਨ ਕਰ ਰਹੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਸਰਮਾ = {ਬ੍ਰਹਮਚਰਜ, ਗ੍ਰਿਹਸਤ, ਵਾਨਪ੍ਰਸਥ, ਸੰਨਿਆਸ) ਚੌਹਾਂ ਆਸ਼੍ਰਮਾਂ ਦੇ ਪ੍ਰਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, en Ti habitan hombres y mujeres, a través de las cuatro épocas."