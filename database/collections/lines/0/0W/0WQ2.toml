[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੂਖ ਸਹਜ; ਆਨੰਦ ਬਿਸ੍ਰਾਮ ॥੩॥"
page = 210
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In peace equipoise and bliss is my abode now."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਰਾਮ, ਅਡੋਲਤਾ ਅਤੇ ਪਰਸੰਨਤਾ ਅੰਦਰ ਮੇਰਾ ਹੁਣ ਵਾਸਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Now, I dwell in peace, poise and bliss. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਨਾਮ ਕੀ ਕਿਰਪਾ ਸੇ ਹੀ ਆਤਮ ਸੁਖ ਕਾ ਜੋ ਅਨੰਦ ਹੈ ਤਿਸ ਮੇਂ ਬਿਸਰਾਮ ਹੂਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਅੰਦਰ ਆਤਮਕ ਅਡੋਲਤਾ ਦੇ ਸੁਖ ਆਨੰਦ ਵੱਸ ਪੈਂਦੇ ਹਨ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜ = ਆਤਮਕ ਅਡੋਲਤਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ahora vivo siempre en Éxtasis, en Paz y en Equilibrio. (3)"