[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਬ੍ਰਹਮਾ ਬਿਸਨੁ ਮਹੇਸੁ ਸਾਜਿ; ਦਸ ਅਵਤਾਰ ਚਲਿਤ ਵਰਤਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Creating Brahma, Visnu and Mahes'a he performed the sports of ten incarnations."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮਾਂ (ਰਜੋ ਗੁਣ), ਬਿਸ਼ਨੂੰ (ਸਤੋ ਗੁਣ), ਮਹੇਸ਼ (ਤਮੋ ਗੁਣ ਬਣਾਕੇ) ਦਸ ਅਵਤਾਰਾਂ ਦੇ ਕੌਤਕ ਦਾ ਖੇਲ ਰਚ ਦਿੱਤਾ।"