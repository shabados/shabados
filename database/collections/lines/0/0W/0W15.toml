[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਡਾ ਸਾਹਿਬੁ; ਊਚਾ ਥਾਉ ॥"
page = 5
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Great is the Lord and high his seat."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਸ਼ਾਲ ਹੈ ਸੁਆਮੀ ਅਤੇ ਬੁਲੰਦ ਉਸ ਦਾ ਆਸਣ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Great is the Master, High is His Heavenly Home."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਕਰ ਕੇ ਵਹੁ ਸਾਹਿਬੁ ਭੀ ਵਡਾ ਊਚਾ ਹੈ, ਔਰ ਉਸ ਕਾ (ਥਾੳ) ਸਚਖੰਡੁ ਬੈਕੁੰਠ ਧਾਮੁ ਭੀ ਵਡਾ ਊਚਾ ਹੈ ਅਰਥਾਤ ਸਭ ਤੇ ਪਰੇ ਹੈ। ਗੀਤਾ ਮੈ ਭੀ ਲਿਖਾ ਹੈ, ਕਿ ਜਹਾਂ ਪਹੁਚ ਕਰ ਕੇ ਫਿਰ ਗਿਰਤਾ ਨਹੀਂ, ਸੋ ਮੇਰਾ ਪਰਮ ਧਾਮੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਕਾਲ ਪੁਰੱਖ ਵੱਡਾ ਹੈ, ਉਸ ਦਾ ਟਿਕਾਣਾ ਉੱਚਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਥਾਉ = ਅਕਾਲ ਪੁਰਖ ਦੇ ਨਿਵਾਸ ਦਾ ਟਿਕਾਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Exaltado es el Creador de todo el Juego; más allá de nuestra imaginación está Su Inmensidad."