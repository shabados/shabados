[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਮੇਰੀ ਓਟ; ਤੂੰ ਹੈ ਮੇਰਾ ਤਕੀਆ ॥੩॥"
page = 181
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art my Shelter, and thou art my prop."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰੀ ਪਨਾਹ ਹੈ ਅਤੇ ਤੂੰ ਹੀ ਮੇਰਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my Shelter; You are my Anchoring Support. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰੇ ਮਨ ਕੀ ਓਟ ਹੈਂ ਔਰ ਤਨ ਕਾ ਭੀ (ਤਕੀਆ) ਆਸਰਾ ਤੂੰ ਹੀ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਮੇਰੀ ਓਟ ਹੈਂ ਤੂੰ ਹੀ ਮੇਰਾ ਆਸਰਾ ਹੈਂ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਕੀਆ = ਸਹਾਰਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "eres mi Gloria y me entono en Ti.  (6)"