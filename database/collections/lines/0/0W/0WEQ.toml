[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰਜਾਮੀ ਕਰਤਾ ਸੋਇ ॥"
page = 1152
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the Creator-Lord is the inner-knower."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਿਰਜਣਹਾਰ ਸੁਆਮੀ ਅੰਦਰਲੀਆਂ ਜਾਣਨਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator is the Inner-knower, the Searcher of hearts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਅੰਤਰਜਾਮੀ ਕਰਤਾ ਜੋ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਕਰਤਾਰ ਆਪ ਹੀ ਹਰੇਕ ਦੇ ਦਿਲ ਦੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਤਰਜਾਮੀ = ਹਰੇਕ ਦੇ ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Creador, el Conocedor Intimo es el Uno Solo,"