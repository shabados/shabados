type = "primary"
data = "ਮੋਹੁ ਬਢਿਯੋ ਅਤਿ ਹੀ ਚਿਤ ਮੈ; ਕਰੁਨਾ ਰਸੁ ਸੋ ਢੁਰਿ ਬੈਨ ਸੁਨਾਏ ॥"
page = 501

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In her attachment she said modestly,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਰੁਣ ਰਸ ਨਾਲ ਭਰੇ ਹੋਏ ਬਚਨ (ਕਹਿ ਕੇ) ਸੁਣਾਏ।"