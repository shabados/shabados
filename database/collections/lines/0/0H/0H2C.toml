[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਲਗੇ ਭਟ ਘਾਇਨ ਕੇ; ਤਜਿ ਦੇਹ ਕੋ ਪ੍ਰਾਨ ਗਏ ਜਮ ਕੇ ਘਰਿ ॥"
page = 479

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many warriors, getting wounded, went to the abode of Yama"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਈ ਸੂਰਮੇ ਘਾਉ ਲਗਣ ਕਾਰਨ ਦੇਹ ਨੂੰ ਛਡ ਕੇ ਪ੍ਰਾਣਾਂ ਨੂੰ ਯਮਰਾਜ ਦੇ ਘਰ ਲੈ ਗਏ ਹਨ।"