assets = ["DGDG"]
type = "primary"
data = "ਬੇਦ ਪੁਰਾਨ ਬਿਖੈ ਅਤਿ ਗੁਨੀ ॥"
page = 995

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There had been a Rani called Sumat Kumari who was adept in Vedas and Puranas."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਵੇਦਾਂ ਅਤੇ ਪੁਰਾਣਾਂ ਵਿਚ ਬਹੁਤ ਗੁੜ੍ਹੀ ਹੋਈ ਸੀ।"