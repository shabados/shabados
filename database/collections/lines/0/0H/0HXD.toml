[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਸਦੀ ਸਿਫਤ ਦੀ ਗਲ ਕਰਨ ਦੀ ਨਾ ਕੋਈ ਹੱਦ ਹੈ ਅਤੇ ਨਾ ਕਿਸੇ ਨੂੰ ਮਜਾਲ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਸਖ਼ੁਨ ਰਾ ਬ-ਵਸਫ਼ਸ਼ ਚਿ ਹੱਦੋ ਮਜਾਲ ॥੫੧॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Neither any one can describe his eclat to any limits nor has enough courage to do so. (51)"