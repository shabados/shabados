[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਡਾ ਸਾਹਿਬੁ ਅਗਮ ਅਥਾਹਾ ॥"
page = 1076
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The great Lord is Unapproachable and Unfathomable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਸ਼ਾਲ ਸੁਆਮੀ ਪਹੁੰਚ ਤੋਂ ਪਰੇ ਅਤੇ ਥਾਹ-ਰਹਿਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Great Lord and Master is inaccessible and unfathomable."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਵੱਡਾ ਸੁਆਮੀ ਅਗਮ ਔ ਅਥਾਹ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਅਪਹੁੰਚ ਹੈ, ਅਥਾਹ ਹੈ, ਵੱਡਾ ਮਾਲਕ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਮ = ਅਪਹੁੰਚ। ਅਥਾਹਾ = ਡੂੰਘਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor es Grandioso, Insondable e Infinito."