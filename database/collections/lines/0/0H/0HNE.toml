[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਹਿ; ਸੁ ਹੋਈਐ ਹਾਂ ॥"
page = 410
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What Thou doesn't that comes to pass."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਛ ਤੂੰ ਕਰਦਾ ਹੈ, ਓਹੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever You do, comes to pass."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੂੰ ਕਰਤਾ ਹੈਂ ਸੋਈ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜੋ ਕੁਝ ਤੂੰ ਕਰਦਾ ਹੈਂ ਉਹੀ (ਜਗਤ ਵਿਚ) ਵਰਤਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਹਿ = (ਜੋ ਕੁਝ) ਤੂੰ ਕਰਦਾ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque sólo sucede lo que haces Tú."