[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭੇ ਬੁਧੀ. ਸੁਧਿ ਸਭਿ; ਸਭਿ ਤੀਰਥ. ਸਭਿ ਥਾਨ ॥"
page = 1241
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All intellects, all ingenuities all holies and all places,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਅਕਲਮੰਦੀਆਂ, ਸਾਰੀਆਂ ਪ੍ਰਬੀਨਤਾਈਆਂ, ਸਾਰੇ ਧਰਮ ਅਸਥਾਨ ਅਤੇ ਸਾਰੇ ਅਸਥਾਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All intellect, all enlightenment, all sacred shrines of pilgrimage."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭੇ ਬੁਧੀਆਂ ਅਰ ਸਭੀ ਸੁਧੀਆਂ ਅਰ ਸਭੀ ਤੀਰਥ ਅਰ ਸਭੀ (ਥਾਨ) ਦੇਵ ਸਥਾਨ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉੱਚੀ ਬੁੱਧ ਤੇ ਚੰਗੀ ਅਕਲ; ਤੀਰਥ-ਅਸਥਾਨ (ਆਦਿਕਾਂ ਦੇ ਇਸ਼ਨਾਨ);"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਧਿ = ਸੂਝ, ਚੰਗੀ ਅਕਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y todo canto, el intelecto y la intuición, los lugares de peregrinaje"