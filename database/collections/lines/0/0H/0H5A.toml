[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਵਹੁ ਬੇੜੀ. ਹਾਥਹੁ ਤਾਲ ॥"
page = 1166
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With fetters on His feet, by beating tune with his hands,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੈਰੀ ਬੇਡੀਆਂ ਲੱਗੀਆਂ ਹੋਈਆਂ ਸਮੇਤ, ਹੱਥਾਂ ਨਾਲ ਸੁਰਤਾਲ ਮੇਲ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With his feet in chains, Naam Dayv kept the beat with his hands,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਨਾਮਦੇਵ ਜੀ ਕੇ ਪੈਰੋਂ ਮੇਂ ਤੋ ਬੇੜੀ ਪੜੀ ਹੂਈ ਹੈਂ ਔਰ ਹਾਥੋਂ ਸੇ ਤਾਲ ਬਜਾਤਾ ਹੈ ਵਾ ਹਾਥ ਮੇਂ ਛੈਣੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਮਦੇਵ ਦੇ ਪੈਰਾਂ ਵਿਚ ਬੇੜੀਆਂ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਵਹੁ = ਪੈਰਾਂ ਵਿਚ। ਹਾਥਹੁ = ਹੱਥਾਂ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sus pies estaban amarrados pero Namdev aplaudió sus manos"