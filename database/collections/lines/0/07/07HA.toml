data = "ਰਾਜਿ ਜੋਗ ਦੋਨੋ ਹੀ ਕੀਜਹੁ ॥੩੧॥"
page = 905

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Not to keep the Ranis in adversity and not to abandon the kingship.(31)"

[[content]]
