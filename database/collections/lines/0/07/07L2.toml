[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪੀਰ ਮੁਰੀਦਾਂ ਪਿਰਹੜੀ, ਗੁਰਮੁਖਿ ਮਤਿ ਪੂਰੀ ॥੧੯॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The Sikhs loving the Guru make their wisdom complete."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੋ ਮੁਰੀਦ ਪੀਰਾਂ ਨਾਲ (ਉਕਤ) ਪ੍ਰੀਤ ਕਰਦੇ ਹਨ (ਉਨ੍ਹਾਂ) ਗੁਰਮੁਖਾਂ ਦੀ ਮਤਿ ਪੂਰੀ ਹੈ।"