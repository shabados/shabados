[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਬਦੇ ਸੇਵੈ; ਸੋ ਜਨੁ ਧ੍ਰਾਪੈ ॥"
page = 1055
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who serves the Lord, is satiated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਾਈਂ ਦੀ ਸੇਵਾ ਕਰਦਾ ਹੈ, ਉਹ ਇਨਸਾਨ ਰੱਜ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That humble being who serves the Shabad, is comforted and fulfilled."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰ ਉਪਦੇਸ ਕੋ ਸੇਵਤੇ ਹੈਂ, ਸੋ ਜਨ (ਧ੍ਰਾਪੈ) ਤ੍ਰਿਪਤਿ ਹੋਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਮਨੁੱਖ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ ਸੇਵਾ-ਭਗਤੀ ਕਰਦਾ ਹੈ ਉਹ ਮਨੁੱਖ (ਮਾਇਆ ਦੀ ਤ੍ਰਿਸ਼ਨਾ ਵੱਲੋਂ) ਰੱਜਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਬਦੇ = ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ। ਧ੍ਰਾਪੈ = (ਮਾਇਆ ਦੀ ਤ੍ਰਿਸ਼ਨਾ ਵੱਲੋਂ) ਰੱਜ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y quien sea que Lo sirve, a través de la Palabra es confortado,"