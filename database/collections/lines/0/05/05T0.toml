[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਭਾਇ ਭਗਤਿ ਭੈ ਸੇਵਦੇ; ਗੁਰਪੁਰਬ ਕਰਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Serving through loving devotion, the servants of the Lord celebrate the anniversaries."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਿੱਖ ਪ੍ਰੈਮਾ ਭਗਤੀ ਨਾਲ ਟਹਿਲ ਕਰਦੇ ਤੇ ਗੁਰਪੁਰਬ ਕਰਦੇ ਹਨ।"