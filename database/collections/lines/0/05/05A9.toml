[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਨਿਬਹੀ; ਖੇਪ ਹਮਾਰੀ ॥੪॥"
page = 295
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, my merchandise has safely arrived."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਮੇਰਾ ਵੱਖਰ ਸਹੀ-ਸਲਾਮਤ ਪੁੱਜ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, my merchandise has arrived save and sound. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਬ ਇਹ ਸੁਖਮਨੀ ਸਾਹਿਬ ਜੀ ਕੀ ਵਾ ਭਗਤੀ ਰੂਪੀ ਹਮਾਰੀ ਖੇਪ ਨਿਭੀ ਹੈ॥੪॥☬ਅਬ ਚਾਰ ਪਉੜੀਓਂ ਕਰ ਕੇ ਇਸ ਬਾਣੀ ਕੇ ਪਾਠ ਕਰਨੇ ਕਾ ਔਰ ਸ੍ਰਵਨ ਕਰਨੇ ਕਾ ਮਹਾਤਮ ਉਚਾਰਨ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਤੇ ਸਾਡਾ ਕੀਤਾ ਹੋਇਆ ਵਣਜ ਦਰਗਾਹੇ ਕਬੂਲ ਹੋ ਗਿਆ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖੇਪ = ਲੱਦਿਆ ਹੋਇਆ ਸੌਦਾ, ਕੀਤਾ ਹੋਇਆ ਵਣਜ। ਨਿਬਹੀ = ਕਬੂਲ ਹੋ ਗਈ ਹੈ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh, dice Nanak, mi mercancía ha llegado sana y salva,(4)"