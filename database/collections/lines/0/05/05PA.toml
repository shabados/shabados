[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਝੂਠੇ ਕਉ; ਨਾਹੀ ਪਤਿ ਨਾਉ ॥"
page = 839
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The false one has no honour and renown."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੂੜੇ ਦੀ ਕੋਈ ਇੱਜ਼ਤ ਆਬਰੂ ਅਤੇ ਨਾਮਵਰੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The false one has no honor or fame;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਝੂਠੇ ਪੁਰਸ਼ ਕੋ ਇਜ਼ਤ ਔਰ ਨਾਮ ਨਹੀਂ ਪ੍ਰਾਪਤ ਹੋਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਮਨੁੱਖ ਦੁਨੀਆ ਦੇ ਪਦਾਰਥਾਂ ਦਾ ਹੀ ਪ੍ਰੇਮੀ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ, ਉਸ ਨੂੰ (ਲੋਕ ਪਰਲੋਕ ਵਿਚ ਕਿਤੇ ਭੀ) ਇੱਜ਼ਤ-ਆਦਰ ਨਸੀਬ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਝੂਠਾ = ਕੂੜ ਦਾ ਵਪਾਰੀ ਜੀਵ। ਪਤਿ = ਇੱਜ਼ਤ। ਨਾਉ = ਨਾਮਣਾ, ਇੱਜ਼ਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El falso no tiene ni honor, ni nombre,"