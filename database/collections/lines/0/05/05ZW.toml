[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਧੰਨਿ ਹੀ ਧੰਨਿ ਕਹਿਯੋ ਸਭ ਹੀ; ਜਬ ਸਾਤ ਹੀ ਬੈਲਨ ਕੋ ਨਥਿ ਆਏ ॥੨੧੦੪॥"
page = 508

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Krishna stringed all the seven bulls, then all the spectators hailed him.2104."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦ ਸੱਤਾਂ ਹੀ ਬਲਦਾ ਨੂੰ ਨੱਥ ਲਿਆ, (ਤਦ) ਸਭ ਨੇ ਧੰਨ ਧੰਨ ਕਿਹਾ ॥੨੧੦੪॥"