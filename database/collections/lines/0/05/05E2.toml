[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਂਚ. ਨ ਲਾਗੈ, ਅਗਨਿ ਸਾਗਰ ਤੇ; ਸਰਨਿ ਸੁਆਮੀ ਕੀ ਅਹੀਐ ॥੧॥"
page = 531
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The heat of the ocean of fire affects not him who longs for the Lord's protection."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੱਗ ਦੇ ਸਮੁੰਦਰ ਦੀ ਗਰਮੀ ਉਸ ਨੂੰ ਨਹੀਂ ਪਹੁੰਚਦੀ, ਜੋ ਸਾਹਿਬ ਦੀ ਓਟ ਦੀ ਚਾਹਨਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The heat of the ocean of fire does not affect one who longs for the Lord and Master's Sanctuary. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਐਸੇ ਸੁਆਮੀ ਕੀ ਸਰਨ (ਅਹੀਐ) ਚਾਹਨੇ ਕਰ ਕੇ (ਅਗਨਿ ਸਾਗਰ), ਭਾਵ ਨਰਕੋਂ ਕੀ ਵਾ ਅਗਨੀ ਕੇ ਸਮੁੰਦਰ ਸੰਸਾਰ ਕੀ (ਆਂਚ) ਤਾਵਨੀ ਨਹੀਂ ਲਗਤੀ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਵਿਕਾਰਾਂ ਦੀ) ਅੱਗ ਦੇ ਸਮੁੰਦਰ ਤੋਂ ਸੇਕ ਨਹੀਂ ਲੱਗਦਾ ਜੇ ਮਾਲਕ-ਪ੍ਰਭੂ ਦੀ ਸਰਨ ਮੰਗੀਏ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਂਚ = ਸੇਕ। ਸਾਗਰ = ਸਮੁੰਦਰ। ਤੇ = ਤੋਂ। ਅਹੀਐ = ਤਾਂਘ ਕਰਨੀ ਚਾਹੀਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mientras busco el Refugio del Maestro, el mar de fuego no me toca. (1)"