data = "ਭਭਕੰਤ ਭੂਤ ਭੈਰੋ ਬਿਸਾਲ ॥"
page = 604

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The dreadful Kali laughed and the huge Bhairavas and the ghosts shouted, the arrows were inflicted"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਭੂਤ ਅਤੇ ਭੈਰੋ ਭਭਕਾਂ ਮਾਰ ਰਹੇ ਹਨ।"