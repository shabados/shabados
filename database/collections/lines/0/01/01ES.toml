[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿੰਕਰੀ; ਬਿਕਾਰ ॥"
page = 1229
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why do thou evil deeds?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮਾੜੇ ਕਰਮ ਕਿਉਂ ਕਰਦੀ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Why are you indulding in corrupt actions?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਿਕਾਰੋਂ ਕੋ (ਕਿੰ) ਕਿਆ (ਕਰੀ) ਕਰਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਿਕਾਰਾਂ ਦੀ ਦਾਸੀ (ਹੋ ਚੁਕੀ ਜੀਵ-ਇਸਤ੍ਰੀ)!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿੰਕਰੀ = ਦਾਸੀ {ਕਿੰਕਰ = ਦਾਸ}। ਕਿੰਕਰੀ ਬਿਕਾਰ = ਹੇ ਵਿਕਾਰਾਂ ਦੀ ਦਾਸੀ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué te comportas con maldad en tu corazón?,"