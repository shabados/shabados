[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕਉ ਸਿਮਰਹਿ; ਸੇ ਧਨਵੰਤੇ ॥"
page = 263
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who remember the Master are wealthy."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਾਲਕ ਦਾ ਚਿੰਤਨ ਕਰਦੇ ਹਨ, ਉਹ ਧਨਾਡ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who remember God are wealthy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪ੍ਰਭੂ ਕੋ ਸਿਮਰਤੇ ਹੈਂ, ਸੋ ਨਾਮੁ ਧਨ ਵਾਲੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਪ੍ਰਭੂ ਨੂੰ ਸਿਮਰਦੇ ਹਨ, ਉਹ ਧਨਾਢ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਮਰਹਿ = (ਜੋ) ਸਿਮਰਦੇ ਹਨ। ਸੇ = ਉਹ ਮਨੁੱਖ। ਧਨਵੰਤੇ = ਧਨ ਵਾਲੇ, ਧਨਾਢ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo aquéllos que aman el Nombre experimentan Su Divina Riqueza;"