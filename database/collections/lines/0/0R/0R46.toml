[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਧਸੰਗਤਿ ਸਚ ਖੰਡਿ ਜਾਇ; ਹੋਇ ਅਲਖ ਅਲੇਖੈ ॥੧੦॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Reaching the holy congregation, the abode of truth, he himself becomes like that imperceptible and ineffable Lord"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਦੇ ਸੱਚ ਖੰਡ ਵਿਖੇ ਜਾ ਕੇ ਅਲਖ ਤੇ ਅਲੇਖ ਹੋ ਜਾਂਦੇ ਹਨ।"