[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਆ ਦੇਹੀ; ਪਰਮਲ ਮਹਕੰਦਾ ॥"
page = 325
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mortal perfumes this body with sandal,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਾਣੀ ਇਸ ਸਰੀਰ ਨੂੰ ਚੰਨਣ ਨਾਲ ਮਹਿਕਾਉਂਦਾ ਹੈ"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "People anoint their bodies with fragrant oils,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਸਗਰ ਪਰ (ਦੇਹੀ) ਜੀਵ (ਪਰਮਲ) ਚੰਦਨ ਉਪਲਖਤ ਸਰਬ ਸੁਗੰਧੀਆਂ ਲਗਾਇ ਕਰ ਸਰੀਰ ਕੋ (ਮਹਕੰਦਾ) ਸੁਗੰਧਤ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੀਵ) ਇਸ ਸਰੀਰ ਤੇ ਕਈ ਸੁਗੰਧੀਆਂ ਮਹਿਕਾਉਂਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਆ ਦੇਹੀ = ਇਸ ਸਰੀਰ ਨੂੰ। ਪਰਮਲ = ਖ਼ੁਸ਼ਬੋਆਂ। ਮਹਕੰਦਾ = ਮਹਿਕਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno se aplica perfumes para que el cuerpo esté fragante,"