[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਸੁਮਤਿ, ਸੁ ਧਾਰ ॥੬੦੮॥"
page = 745

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying “Tur-ari-naadini” primarily and then adding “Ripu ari” at the end, the names of Tupak are formed.608."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤੁਪਕ ਦਾ ਨਾਮ ਬਣ ਜਾਂਦਾ ਹੈ। ਵਿਦਵਾਨੋ! ਵਿਚਾਰ ਕਰ ਲਵੋ ॥੬੦੮॥"