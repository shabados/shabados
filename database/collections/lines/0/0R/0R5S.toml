[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗ੍ਰਿਹ ਆਏ ਉਠਿ ਪਾਚ ਨ੍ਰਿਪ; ਜਾਮ ਏਕ ਗਈ ਰਾਤਿ ॥"
page = 424

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the five kings came to their places and on this side one pahar of night had passed"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਪਹਿਰ ਰਾਤ ਬੀਤ ਗਈ, (ਤਾਂ) ਪੰਜ ਰਾਜੇ (ਸਭਾ ਤੋਂ) ਉਠ ਕੇ ਘਰ ਆ ਗਏ।"