[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਵਨੁ ਕਵਨੁ. ਨਹੀ ਪਤਰਿਆ; ਤੁਮੑਰੀ ਪਰਤੀਤਿ ॥"
page = 815
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Placing reliance on thee, O my mind, who is it that has not fallen?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਤੇ ਭਰੋਸਾ ਧਾਰ ਕੇ, ਹੇ ਮੇਰੇ ਮਨੂਏ! ਕਉਣ ਹੈ ਜੋ ਡਿੱਗਿਆ ਨਹੀਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who? Who has not fallen, by placing their hopes in you?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਮਨ ਤੁਮਾਰੇ ਪਰ ਪ੍ਰਤੀਤ ਕਰਨੇ ਸੇ ਭਜਨ ਜਪ ਕਰਨ ਤੇ ਕੌਨ ਕੌਨ ਨਹੀਂ (ਪਤਰਿਆ) ਗਿਰਿਆ, ਭਾਵ ਯਹ ਬਹੁਤ ਗਿਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਤੇਰਾ ਇਤਬਾਰ ਕਰ ਕੇ ਕਿਸ ਕਿਸ ਨੇ ਧੋਖਾ ਨਹੀਂ ਖਾਧਾ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਰਿਆ = {प्रतारय = to deceive, to cheat. ਪਤਾਰਨਾ = ਬਦਨਾਮ ਕਰਨਾ} ਧੋਖਾ ਖਾ ਗਿਆ, ਬਦਨਾਮ ਹੋਇਆ। ਪਰਤੀਤਿ = ਇਤਬਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente, ¿quién no ha caído por apoyarse en ti?"