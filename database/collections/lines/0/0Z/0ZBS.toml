[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੁਕਤਿ ਪਦਾਰਥੁ ਪਾਈਐ; ਅਵਗਣ ਮੇਟਣਹਾਰੁ ॥੧॥"
page = 59
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "We obtain the wealth of Salvation, which is the obliterator of demerits,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਨੂੰ ਮੋਖਸ਼ ਦੀ ਦੌਲਤ ਜੋ ਬਦੀਆਂ ਨੂੰ ਨਾਮੂਦ ਕਰਨਹਾਰ ਹੈ, ਪਰਾਪਤ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "We find the wealth of liberation, and our demerits are erased. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੁਕਤਿ ਰੂਪੀ ਪਦਾਰਥੁ ਪਾਈਤਾ ਹੈ, ਪੁਨਾ ਪਿਆਰੁ ਅਵਗੁਣੋਂ ਕੇ ਮੇਟਨੇ ਵਾਲਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ) ਨਾਮ-ਪਦਾਰਥ ਮਿਲਦਾ ਹੈ, ਜੋ ਵਿਕਾਰਾਂ ਤੋਂ ਖ਼ਲਾਸੀ ਦਿਵਾਂਦਾ ਹੈ ਜੋ ਔਗੁਣ ਮਿਟਾਣ ਦੇ ਸਮਰੱਥ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਕਤਿ = ਵਿਕਾਰਾਂ ਤੋਂ ਖ਼ਲਾਸੀ। ਪਦਾਰਥੁ = ਕੀਮਤੀ ਚੀਜ਼ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Recibimos el regalo de la Salvación y nuestras faltas son borradas.  (1)"