[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾ ਕੋ ਧ︀ਯਾਨ ਰਾਮ ਨਿਤਿ ਮੁਨਿ ਜਨ ਧਰਤਿ ਹ੍ਰਿਦੈ ਨਹੀ ਆਯੋ ॥"
page = 455

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘He, who is ever meditated upon by the sages, but still they can’t perceive him in their heart"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਮ (ਕਵੀ ਕਹਿੰਦੇ ਹਨ) ਜਿਸ ਦਾ ਧਿਆਨ ਮੁਨੀ ਜਨ ਸਦਾ ਧਰਦੇ ਹਨ,"