type = "primary"
data = "ਕਿ ਦੀਦਨ ਜਹਾ ਰਾ ਬ ਕਿਰਦਾਰ ਖ਼ੇਸ਼ ॥੨੧॥"
page = 1415

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘All my planning will be dismantled.(21)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਫਿਰ ਸੰਸਾਰ ਵਿਚ ਮੇਰਾ ਕੀ ਕਿਰਦਾਰ ਹੋਵੇਗਾ ॥੨੧॥"