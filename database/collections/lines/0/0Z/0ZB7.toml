[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮਹੀਨ; ਕਾਲਖ ਮੁਖਿ ਮਾਇਆ ॥"
page = 366
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mortals without the Name get soot rubbed on their faces."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਵਿਹੂਣ ਪ੍ਰਾਣੀਆਂ ਦੇ ਚਿਹਰੇ ਉਤੇ ਦੁਨੀਆਂਦਾਰੀ ਦੀ ਕਾਲਖ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who lack the Naam have their faces rubbed in the dirt of Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਸੇ ਜੋ ਰਹਿਤ ਹੈਂ ਤਿਨ ਕੇ ਮੁਖ ਪਰ ਮਾਯਾ ਕੀ ਸ੍ਯਾਹੀ ਲਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮੇਰੇ ਮਿੱਤਰੋ!) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਨ ਤੋਂ ਬਿਨਾ ਜੀਊਣਾ ਫਿਟਕਾਰ-ਜੋਗ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਖਿ = ਮੂੰਹ ਉਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pobre de aquél que vive sin el Naam, el Nombre del Señor;"