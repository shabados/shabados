data = "ਤ੍ਰਾਸ ਦਿਖਾਯੋ ਤਾਹਿ; ਮਿਲਨ ਹਿਤ ਰਾਇ ਕੈ ॥"
page = 828

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "To frighten the Raja."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਰਾਜੇ ਨੂੰ ਮਿਲਣ ਲਈ ਡਰਾਉਣ ਲਗੀ।"