[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉਮੈ ਮਮਤਾ; ਸਬਦੇ ਖੋਵੈ ॥"
page = 116
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through God's Name self-hood and secular love depart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦੇ ਨਾਮ ਰਾਹੀਂ ਸਵੈ-ਹੰਗਤਾ ਤੇ ਮੋਹ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Word of the Shabad eradicates egotism and possessiveness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰੁ ਗੁਰੋਂ ਕੇ ਉਪਦੇਸ਼ ਸੇ ਅਹੰਤਾ ਮਮਤਾ ਕੋ ਦੂਰ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਵਿਚ ਜੁੜ ਕੇ (ਆਪਣੇ ਅੰਦਰੋਂ) ਹਉਮੈ ਤੇ ਅਪਣੱਤ ਦੂਰ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਮਤਾ = ਅਪਣੱਤ। ਸਬਦੇ = ਸਬਦਿ, ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y por la Palabra se va desvaneciendo el afán por el yo soy."