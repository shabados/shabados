[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਹਿ ਗਹਿ ਗੁਰਜ ਗਰਬਿਯਾ ਗਾਜੇ ॥"
page = 931

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The trumpets blew in the town as the intrepid roared."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਹੰਕਾਰੀ ਸੂਰਮੇ ('ਗਰਬਿਯਾ') ਗੁਰਜ ਪਕੜ ਪਕੜ ਕੇ ਗੱਜਣ ਲਗੇ।"