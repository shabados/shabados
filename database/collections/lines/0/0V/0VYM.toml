[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਿਖ︀ਯ ਤੁਰਤੁ ਸਿਵ ਕੋ ਕਿਯੋ ਐਸੋ ਚਰਿਤ ਸੁਧਾਰਿ ॥੧੨॥"
page = 996

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Through this manoeuvre, Rani turned Raja into a devotee of Shiva.(12)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੁਰਤ ਸ਼ਿਵ ਦਾ ਸ਼ਿਸ਼ ਬਣਾਇਆ, ਇਸ ਤਰ੍ਹਾਂ ਦਾ ਚਰਿਤ੍ਰ ਕੀਤਾ ॥੧੨॥"