[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਫੁਲਾਂ ਅੰਦਰਿ ਵਾਸੁ ਲੈ; ਫਲੁ ਸਾਉ ਸਮ੍ਹਾਲੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Taking fragrance from the flowers He Himself is the flavour in them."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਜਿਕੂੰ) ਫੁਲਾਂ ਵਿਚ ਵਾਸ਼ਨਾਂ (ਨੂੰ) ਲੈਂਦਾ ਤੇ ਫਲਾਂ ਵਿਚੋਂ ਰਸ ਨੂੰ ਸੰਮ੍ਹਾਲਦਾ (ਚੱਖਦਾ) ਹੈ।"