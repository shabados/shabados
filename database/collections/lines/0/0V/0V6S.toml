[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧੂ ਕੈ; ਠਾਢੀ ਦਰਬਾਰਿ ॥"
page = 872
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Standing art the saints' door, she says,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਦੇ ਬੂਹੇ ਦੇ ਖਲੋ ਕੇ ਉਹ ਆਖਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Standing at the door of the holy man,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਸਾਧੂਆਂ ਕੇ ਦਰਬਾਰ ਮੇਂ ਖੜੀ ਅਰਜ ਕਰਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਭਗਤ-ਜਨ ਦੇ ਦਰ ਤੇ ਖਲੋਤੀ (ਪੁਕਾਰਦੀ ਹੈ ਕਿ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਢੀ = ਖਲੋਤੀ। ਦਰਬਾਰਿ = ਦਰ ਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Parada a la puerta del Santo ella reza,"