[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੈ ਸਬਦਿ; ਸਦਾ ਗੁਣ ਗਾਏ ॥"
page = 1055
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then through the True Gurbani, he sings ever the Lord's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਸੱਚੀ ਗੁਰਬਾਣੀ ਦੇ ਰਾਹੀਂ, ਉਹ ਸਦੀਵ ਹੀ ਸਾਹਿਬ ਜਾ ਜਸ ਗਾਇਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the True Word of the Shabad, they sing His Glorious Praises forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਸਚੇ ਉਪਦੇਸ਼ ਕਰ ਕੇ ਸਦਾ ਭਗਵਤ ਕੇ ਗੁਣੋਂ ਕੋ ਗਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਗਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੈ ਸਬਦਿ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así cantamos para siempre las Alabanzas del Señor a través de la Verdadera Palabra."