[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਦਾਸੁ; ਕਿਛੁ ਬੁਰਾ. ਨ ਮਾਗੈ ॥"
page = 1152
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's slave wishes ill to no one."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦਾ ਗੋਲਾ ਕਿਸੇ ਦਾ ਭੀ ਬੁਰਾ ਨਹੀਂ ਮੰਗਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord's slave does not wish anyone ill."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕਾ ਦਾਸ (ਕਿਛੁ) ਅਲਪ ਮਾਤ੍ਰ ਭੀ ਕਿਸੀ ਕਾ ਬੁਰਾ ਨਹੀਂ ਚਿਤਵਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਭਗਤ (ਉਸ ਦੋਖੀ ਦਾ ਭੀ) ਰਤਾ ਭਰ ਭੀ ਬੁਰਾ ਨਹੀਂ ਮੰਗਦਾ (ਇਹ ਨਹੀਂ ਚਾਹੁੰਦਾ ਕਿ ਉਸ ਦਾ ਕੋਈ ਨੁਕਸਾਨ ਹੋਵੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਮਾਗੈ = ਨਹੀਂ ਮੰਗਦਾ, ਨਹੀਂ ਚਾਹੁੰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Sirviente del Señor no desea mal a nadie,"