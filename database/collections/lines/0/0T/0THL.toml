[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਨੈਨਹੁ; ਜਗਤੁ ਨਿਹਾਰਿਆ ॥"
page = 655
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and without the eyes the world is seen."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨੇਤ੍ਰਾਂ ਦੇ ਬਾਝੋਂ ਸੰਸਾਰ ਦੇਖ ਲਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "without eyes, the world is seen."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੋਨੋਂ ਕੋ ਨਿਰਉਪਾਧ ਕਰ ਕੇ ਤਿਨੋਂ ਨੇ ਇਨ ਨੇਤ੍ਰੋਂ ਸੇ ਬਿਨਾ ਬੁਧੀ ਰੂਪੀ ਨੇਤ੍ਰੋਂ ਕਰ ਕੇ ਇਸ ਜਗਤ ਕੋ ਬ੍ਰਹਮ ਰੂਪ ਕਰ ਦੇਖਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਆਪਣੀਆਂ ਅੱਖਾਂ ਨੂੰ ਜਗਤ-ਤਮਾਸ਼ੇ ਵਲੋਂ ਹਟਾ ਕੇ ਜਗਤ (ਦੀ ਅਸਲੀਅਤ) ਨੂੰ ਵੇਖ ਲਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਨੁ ਨੈਨਹੁ = ਅੱਖਾਂ ਤੋਂ ਬਿਨਾ, ਇਹਨਾਂ ਅੱਖਾਂ ਨੂੰ ਰੂਪ ਆਦਿਕ ਤੱਕਣ ਦੀ ਬਾਣ ਵਲੋਂ ਹਟਾ ਕੇ। ਨਿਹਾਰਿਆ = ਵੇਖ ਲਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sin ver, uno ve la invisible realidad del mundo."