[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਰੂਪੈ ਕਾਮੈ ਦੋਸਤੀ, ਜਗ ਅੰਦਰਿ ਜਾਣੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Friendship of beauty and lust is known all over the world."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਾਮੀ ਦੀ ਰੂਪ ਨਾਲ ਪ੍ਰੀਤ ਹੈ। (ਇਹ ਗੱਲ ਜਗਤ ਵਿਖੇ ਜਾਣੀ ਹੋਈ ਹੈ।"