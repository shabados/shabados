[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਜੰਤ. ਤੇਰੇ ਧਾਰੇ ॥"
page = 626
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mortals and other creatures are established by Thee,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਾਣੀ ਤੇ ਹੋਰ ਜੀਵ ਮੇਰੇ ਅਸਥਾਪਨ ਕੀਤੇ ਹੋਏ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The beings and creatures are Your creation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹ ਸਭ ਜੀਅ ਜੰਤ ਤੇਰੇ ਹੀ (ਧਾਰੇ) ਆਸਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਸਾਰੇ ਜੀਵ ਤੇਰੇ ਹੀ ਆਸਰੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਾਰੇ = ਸਹਾਰੇ ਹੋਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los seres y criaturas son Tu Creación,"