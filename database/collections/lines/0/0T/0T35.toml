type = "primary"
data = "ਤੁਰਤੁ ਦੂਤ ਗ੍ਰਿਹ ਤਾਹਿ ਪਠਾਯੋ ॥੨॥"
page = 948

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "As he felt to make love with him to seek comfort, he immediately sent him his emissary.(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੁਰਤ ਉਸ ਨੇ ਦੂਤ ਨੂੰ ਉਸ ਦੇ ਘਰ ਭੇਜਿਆ ॥੨॥"