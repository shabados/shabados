[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦੇ ਪਿਆਰਿਆਂ ਦੀ ਸੰਗਤ ਇੱਕ ਵੱਡੀ ਦੌਲਤ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਸੁਹਬਤਿ ਮਰਦਾਨਿ ਹੱਕ ਖ਼ੁਸ਼ ਦੌਲਤ ਅਸਤ ॥੨੩੧॥"

[[content]]
assets = ["KEGP"]
