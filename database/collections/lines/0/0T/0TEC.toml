[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਮੰਤ੍ਰੁ; ਗੁਰਿ ਦੀਨੋ ਜਾ ਕਹੁ ॥"
page = 257
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "whom the Guru has given the spell of the name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੂੰ ਗੁਰਾਂ ਨੇ ਨਾਮ ਦਾ ਜਾਦੂ ਬਖਸ਼ਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Shall not be turned away."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੋ ਗੁਰੋਂ ਨੇ ਨਾਮ ਰੂਪ ਮੰਤ੍ਰ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੂੰ ਗੁਰੂ ਨੇ ਨਾਮ-ਮੰਤ੍ਰ ਦੇ ਦਿੱਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਤ੍ਰੁ = ਉਪਦੇਸ਼। ਜਾ ਕਹੁ = ਜਿਨ੍ਹਾਂ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no le será negado nada en la vida."