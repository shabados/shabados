[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧ੍ਰੂ ਪ੍ਰਹਲਾਦ ਕਬੀਰ ਤਿਲੋਚਨ; ਨਾਮੁ ਲੈਤ. ਉਪਜੵੋ ਜੁ ਪ੍ਰਗਾਸੁ ॥"
page = 1406
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Reciting the Lord's Name, the Divine Light welled up in Dhru, Prahlad, Kabir and Trilochan."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਨ ਦੁਆਰਾ, ਧੁਰੂ, ਪ੍ਰਹਿਲਾਦ, ਕਬੀਰ ਅਤੇ ਤ੍ਰਿਲੋਚਨ ਅੰਦਰ ਈਸ਼ਵਰੀ ਨੂਰ ਉਤਪੰਨ ਹੋ ਗਿਆ ਸੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Dhroo, Prahlaad, Kabeer and Trilochan chanted the Naam, the Name of the Lord, and His Illumination radiantly shines forth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਧ੍ਰੂ ਔਰ ਪ੍ਰਹਿਲਾਦ, ਕਬੀਰ ਪੁਨਾ ਤ੍ਰਿਲੋਚਨ ਜੀ ਆਦਿ ਭਗਤੋਂ ਕੋ ਜਿਸ ਕੇ ਨਾਮ ਜਪਣੇ ਤੇ ਜੋ ਗਿਆਨ ਰੂਪ ਪ੍ਰਕਾਸ਼ ਉਪਜਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਸਿਮਰ ਕੇ ਧ੍ਰੂ ਪ੍ਰਹਲਾਦ ਕਬੀਰ ਅਤੇ ਤ੍ਰਿਲੋਚਨ ਨੂੰ ਜੋ ਚਾਨਣ (ਦਿੱਸਿਆ ਸੀ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੁ ਪ੍ਰਗਾਸੁ = ਜਿਹੜਾ ਚਾਨਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dru, Prahlaad, Kabir y Trilochan, recitaron el Naam, el Nombre del Señor, y Su Iluminación brilla por todas partes."