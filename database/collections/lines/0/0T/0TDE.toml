[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੁਸਲ ਖੇਮ ਸਭ ਥੀਆ ॥੩॥"
page = 622
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "For me, then ensued all pleasure and peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਲਈ ਤਦ ਸਮੂਹ ਖੁਸ਼ੀਆਂ ਤੇ ਆਰਾਮ ਉਤਪੰਨ ਹੋ ਗਏ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All joy and pleasure then came to me. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੋ ਸਭ ਪ੍ਰਕਾਰ ਕਲਿਆਣ ਔ ਸੁਖ ਹੂਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਅੰਦਰ ਸਦਾ ਆਤਮਕ ਆਨੰਦ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੁਸਲ ਖੇਮ = ਸੁਖ ਆਨੰਦ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "de Su Nombre y todo se vuelve Bondad y Paz para ellos. (3)"