[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪੁਲਿਕ ਪਸੀਜਤ ਤਨ ਭਯੋ; ਬਿਰਹ ਬਿਕਲ ਭਯੋ ਅੰਗ ॥੧੪॥"
page = 1014

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "With dream of love she sweated and all the parts of her body ached.(14)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਸ਼ਰੀਰ ਰੋਮਾਂਚਿਤ ਹੋ ਗਿਆ ਅਤੇ ਬਿਰਹੋਂ ਕਰ ਕੇ ਅੰਗ ਵਿਆਕੁਲ ਹੋ ਗਏ ॥੧੪॥"