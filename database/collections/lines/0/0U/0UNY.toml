[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਊਣਾ; ਕਛਹੂ ਨਾਹਿ ॥੧॥"
page = 187
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "in whom nothing is wanting."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਵਿੱਚ ਕਿਸੇ ਸ਼ੈ ਦੀ ਕਮੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "who lacks nothing. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਕਿਛੂ ਭੀ ਤੋਟਾ ਨਹੀਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਘਰ ਵਿਚ ਕਿਸੇ ਚੀਜ਼ ਦੀ ਭੀ ਘਾਟ ਨਹੀਂ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੈ = ਜਿਸ ਦੇ ਘਰ ਵਿਚ। ਊਣਾ = ਊਣਤਾ, ਘਾਟ, ਕਮੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien no está privado de nada. (1)"