[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਤੂ ਆਵਹਿ ਚਿਤਿ; ਤਿਸ ਨੋ ਸਦਾ ਸੁਖ ॥"
page = 960
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, within whose mind Thou enterest, O Lord, obtains ever lasting. Peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਅੰਤਰ ਆਤਮੇ ਤੂੰ ਪ੍ਰਵੇਸ਼ ਕਰਦਾ ਹੈਂ, ਹੇ ਸੁਆਮੀ! ਉਹ ਸਦੀਵੀ ਸੁਖ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who is conscious of You finds everlasting peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਜਿਸ ਕੋ ਤੂੰ ਯਾਦ ਆਵੈਂ ਤਿਸ ਕੋ ਅਚੁਤ ਸੁਖ ਕੀ ਪ੍ਰਾਪਤੀ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਵੱਸ ਪਏਂ, ਉਸ ਨੂੰ ਸਦਾ ਦੇ ਸੁਖ ਮਿਲ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਿਤਿ = ਚਿੱਤ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que Te alaba, oh Dios, está siempre en Éxtasis."