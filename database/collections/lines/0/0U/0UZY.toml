[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹਠੀ ਦੁਸਟਿ ਜਿਤੇ ਭਜੇ ਦੈਤ ਸਬੰ ॥"
page = 165

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then he placed all the four Vedas on the protruding part of his teeth and caused the death and fall of the persistent inimical demons"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਕ) ਹਠੀ ਦੁਸ਼ਟ (ਹਰਨਾਖਸ਼) ਦੇ ਜਿਤੇ ਜਾਣ ਨਾਲ ਸਾਰੇ ਦੈਂਤ ਭਜ ਗਏ।"