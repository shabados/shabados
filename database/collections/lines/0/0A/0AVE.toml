[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਸਦਾ ਹਦੂਰਿ ਹੈ ॥੪॥੧॥੧੩੯॥"
page = 210
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak but he is ever present near."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਪਰ ਉਹ ਹਮੇਸ਼ਾਂ ਹੀ ਅੰਗ ਸੰਗ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, he is Ever-present! ||4||1||139||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਸੋ ਸਦਾ ਨੇੜੇ ਹੈ॥੪॥੧॥੧੩੯॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਨਾਨਕ ਆਖਦਾ ਹੈ- ਪਰਮਾਤਮਾ ਸਦਾ (ਹਰੇਕ ਜੀਵ ਦੇ ਅੰਗ ਸੰਗ ਵੱਸਦਾ ਹੈ ॥੪॥੧॥੧੩੯॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਦੂਰਿ = ਹਾਜ਼ਰ-ਨਾਜ਼ਰ, ਅੰਗ-ਸੰਗ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sin saber que Él está siempre presente ante nosotros. (4-1-139)"