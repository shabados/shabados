[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਹ ਬੇਲਾ; ਕਛੁ. ਚੀਤਿ ਨ ਆਵੈ ॥"
page = 178
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man thinks not of that time of death."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੌਤ ਦੇ ਉਸ ਵਕਤ ਨੂੰ ਇਨਸਾਨ ਯਾਦ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one thinks of the time of death;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਰਣੇ ਕਾ ਜੋ ਸਮਾਂ ਹੈ ਵਹੁ ਜੀਵ ਕੋ ਕੁਛ ਯਾਦ ਨਹੀਂ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੂਰਖ ਮਨੁੱਖ ਨੂੰ) ਉਹ ਸਮਾ ਰਤਾ ਭੀ ਚੇਤੇ ਨਹੀਂ ਆਉਂਦਾ (ਜਦੋਂ ਵੱਡੇ-ਵਡੇਰਿਆਂ ਵਾਂਗ ਸਭ ਕੁਝ ਇੱਥੇ ਹੀ ਛੱਡ ਜਾਣਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੇਲਾ = ਸਮਾ। ਚੀਤਿ = ਚਿੱਤ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Se olvidan con una facilidad increíble de la inevitable muerte"