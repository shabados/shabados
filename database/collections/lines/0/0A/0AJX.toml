[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਮੁ ਹੋਵੈ ਤਾ ਸਤਿਗੁਰੁ ਸੇਵੇ; ਸਹਜੇ ਹੀ ਸੁਖੁ ਪਾਇਦਾ ॥੧੦॥"
page = 1061
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If God's grace be upon him, then serves he the True Guru and easily obtains peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਰੱਬ ਦੀ ਮਿਹਰ ਉਸ ਉਤੇ ਹੋਵੇ, ਤਦ ਉਹ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਟਹਿਲ ਕਮਾਉਂਦਾ ਹੈ ਤੇ ਸੁਖੈਨ ਹੀ ਆਰਾਮ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But if they are blessed by God's Grace, they serve the True Guru, and easily obtain peace. ||10||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਮਸਤਕ ਪਰ ਭਲੇ ਕਰਮ ਹੋਤੇ ਹੈਂ, ਸੋ ਸਤਿਗੁਰੋਂ ਕੋ ਸੇਵਤਾ ਹੈ, ਜੋ ਸੇਵਤਾ ਹੈ, ਸੋ ਸੁਤੇ ਹੀ ਸੁਖ ਪਾਵਤਾ ਹੈ॥੧੦॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਉਸ ਉਤੇ ਪਰਮਾਤਮਾ ਦੀ ਮਿਹਰ ਹੁੰਦੀ ਹੈ, ਤਦੋਂ ਉਹ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਂਦਾ ਹੈ, ਤੇ, ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਟਿਕਿਆ ਰਹਿ ਕੇ ਆਤਮਕ ਆਨੰਦ ਮਾਣਦਾ ਹੈ ॥੧੦॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਮੁ = ਮਿਹਰ, ਬਖ਼ਸ਼ਸ਼। ਸਹਜੇ = ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ। ਸੁਖੁ = ਆਤਮਕ ਆਨੰਦ ॥੧੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "uno sirve al Guru Verdadero, en el Estado de Éxtasis, pero esto sólo ocurre de forma espontánea. (10)"