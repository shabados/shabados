[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕਿਰਪਾ ਤੇ; ਬੰਧਨ ਤੂਟੈ ॥"
page = 278
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Lord's grace, mortal's shackles are shattered."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੀ ਦਇਆ ਦੁਆਰਾ ਪ੍ਰਾਣੀ ਦੀਆਂ ਬੇੜੀਆਂ ਕੱਟੀਆਂ ਜਾਂਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By God's Grace, his bonds are shattered;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕੀ ਕਿਰਪਾ ਤੇ ਜਿਨ ਕੇ ਬੰਧਨ ਤੂਟੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਦੇ) ਬੰਧਨ ਪ੍ਰਭੂ ਦੀ ਮੇਹਰ ਨਾਲ ਟੁੱਟਦੇ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero, si por la Gracia de Dios, sus velos fueran quitados,"