[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਭਉ ਹੋਇ; ਭਜਹੁ ਭਗਵਾਨ ॥"
page = 201
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Fearlessly meditate on the fortunate Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਿਡੱਰ ਹੋ ਕੇ ਭਾਗਾਂ ਵਾਲੇ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate fearlessly on the Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਭੈ ਸੇ ਰਹਤ ਹੋ ਕਰ ਪਰਮੇਸਰ ਕਾ ਭਜਨ ਕਰਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪਿਆਰੇ ਭਗਤ-ਜਨੋ!) ਤੁਸੀ ਸਾਧ ਸੰਗਤਿ ਵਿਚ ਮਿਲ ਕੇ ਨਿਡਰ ਹੋ ਕੇ ਭਗਵਾਨ ਦਾ ਨਾਮ ਸਿਮਰਦੇ ਰਹੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਿ = ਮਿਲ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y sin miedo y sin temor medita en el Señor Supremo,"