[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕਉ ਦੁਖੁ; ਸੁਪਨੈ ਭੀ ਨਾਹੀ ॥੧॥ ਰਹਾਉ ॥"
page = 193
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "gets not pain even in dream. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਸੁਪਨੇ ਵਿੱਚ ਵੀ ਪੀੜ ਨਹੀਂ ਵਾਪਰਦੀ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "do not suffer pain, even in dreams. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੋ ਸ੍ਵਪਨ ਮਾਤ੍ਰ ਭੀ ਦੁਖ ਨਹੀਂ ਹੋਤਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਨੁੱਖ ਨੂੰ ਕਦੇ ਸੁਪਨੇ ਵਿਚ ਭੀ (ਕੋਈ) ਦੁੱਖ ਪੋਹ ਨਹੀਂ ਸਕਦਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕਉ = ਉਸ (ਮਨੁੱਖ) ਨੂੰ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no conoce la tristeza, ni siquiera en sueños.  (1-Pausa)"