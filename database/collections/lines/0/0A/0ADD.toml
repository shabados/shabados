data = "ਪਰਉਪਕਾਰੀ, ਗੁਰੂ ਪਿਆਰੇ ॥੭॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Such beneficent persons are dear to the Guru."

