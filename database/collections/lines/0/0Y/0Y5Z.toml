[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬ੍ਰਿਜ ਨਾਇਕ ਠਾਢਿ ਭਏ ਉਠ ਕੈ; ਸਭ ਗੁਆਰਨਿ ਕਉ ਐਸੇ ਗਿਆਨ ਦ੍ਰਿੜਾਏ ॥"
page = 543

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Krishna got up after imparting to them the instructions about knowledge in this way"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਗੋਪੀਆਂ ਨੂੰ ਇਸ ਤਰ੍ਹਾਂ ਦਾ ਉਪਦੇਸ਼ ਦੇ ਕੇ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਉਠ ਕੇ ਖੜੋ ਗਏ।"