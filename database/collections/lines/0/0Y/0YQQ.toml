[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਫਿਰਿ ਫਿਰਿ ਜੋਗੀ; ਆਵੈ ਜਾਈ ॥੩॥"
page = 886
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Yogi, thou shalt come and go again and again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਯੋਗੀ! ਤੂੰ ਮੁੜ ਮੁੜ ਕੇ ਮਰਦਾ ਤੇ ਜੰਮਦਾ ਰਹੇਗਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Again and again, Yogi, you come and go. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੋਗੀ! ਤੂੰ ਇਸੀ ਤੇ ਬਾਰੰਬਾਰ ਜਨਮਤਾ ਮਰਤਾ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹੋ ਜਿਹਾ) ਜੋਗੀ ਤਾਂ ਮੁੜ ਮੁੜ ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਵਿਚ ਪਿਆ ਰਹਿੰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫਿਰਿ = ਮੁੜ ਮੁੜ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "tu Dios, y así vienes y vas una y otra vez. (3)"