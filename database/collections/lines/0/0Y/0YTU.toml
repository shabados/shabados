type = "primary"
data = "ਤਿਹੱ ਆਗੈ ਹਿੰਦੂ ਕਿਆ ਤੁਰਕਾ ॥੧੯॥"
page = 157

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Before that Lord, none is a Hindu of a Muslim.19."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਲਈ ਨਾ ਕੋਈ ਹਿੰਦੂ ਹੈ ਅਤੇ ਨਾ ਹੀ ਤੁਰਕ ॥੧੯॥"