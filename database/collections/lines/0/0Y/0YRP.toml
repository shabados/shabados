data = "ਚਿ ਬਖ਼ਸ਼ੀਦ ਸ਼ੁਦ ਬਖ਼ਸ਼ ਹਰਕਸ ਅਜ਼ਾ ॥੩੭॥"
page = 1396

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(He replied), ‘I have given out some in charity and rest faced the death.‘(37)"

