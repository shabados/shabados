[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦਾ ਸਦਾ ਪ੍ਰਭੁ; ਜੀਅ ਕੈ ਸੰਗਿ ॥"
page = 1339
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord, now, abides within my soul, ever and forever."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਹੁਣ ਸਦੀਵ ਅਤੇ ਹਮੇਸ਼ਾਂ ਹੀ ਮੇਰੀ ਜਿੰਦੜੀ ਨਾਲ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forever and ever, God is with my soul."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਸਮੇਂ ਮੇਂ ਸਦਾ ਸੋ ਪ੍ਰਭੂ ਹਮਾਰੇ ਜੀ ਕੇ ਸਾਥ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਹਰ ਵੇਲੇ ਹੀ ਜਿੰਦ ਦੇ ਨਾਲ (ਵੱਸਦਾ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ ਕੈ ਸੰਗਿ = ਜਿੰਦ ਦੇ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues por siempre y para siempre Dios está en mi Alma."