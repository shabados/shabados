[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਨਗਰੀ ਮਹਿ; ਭਗਤਿ ਦ੍ਰਿੜਾਈ ॥"
page = 1154
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Prahlad implanted the Lord's love-worship in the whole city."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ਹਿਰ ਦੇ ਸਾਰੇ ਲੋਕਾਂ ਵਿੱਚ ਪ੍ਰਹਿਲਾਦ ਨੇ ਪ੍ਰਭੂ ਦੀ ਪਿਆਰੀ ਉਪਾਸ਼ਨਾ ਪੱਕੀ ਕਰ ਦਿਤੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He instigated devotional worship in the townspeople.\""

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਹਿਲਾਦ ਨੇ ਸੰਪੂਰਨ ਨਗਰੀ ਬੀਚ ਭਗਤੀ ਦ੍ਰਿੜ ਕਰਾ ਦਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਸ਼ਹਰ ਵਿਚ ਹੀ ਇਸ ਨੇ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਲੋਕਾਂ ਦੇ ਦਿਲਾਂ ਵਿਚ ਪੱਕੀ ਕਰ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦ੍ਰਿੜਾਈ = ਪੱਕੀ ਕਰ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "convirtiendo a todo el pueblo en Devotos de Dios"