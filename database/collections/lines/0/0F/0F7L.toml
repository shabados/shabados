[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋਨ ਲਾਗੇ ਜੁਧ ਕੇ; ਜਹਾ ਤਹਾ ਸਬੈ ਬਿਧਾਨ ॥"
page = 592

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In order to kill Kalki, the warriors cautiously marched forward and began to wage war here, there and everywhere"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਕਿਥੇ ਯੁੱਧ ਦੇ ਵਿਧਾਨ ਹੋਣ ਲਗੇ ਹਨ।"