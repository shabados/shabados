[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਖੀ ਵੇਖਿ ਨ ਰਜੀਆ, ਬਹੁ ਰੰਗ ਤਮਾਸੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The eyes are not satisfied with beholding sights and exhibitions;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅੱਖਾਂ ਨਾਨਾ ਪ੍ਰਕਾਰ ਦੇ ਰੰਗ ਤਮਾਸ਼ੇ ਦੇਖਦੀਆਂ ਹੋਈਆਂ ਰੱਜੀਆਂ ਨਹੀਂ।"