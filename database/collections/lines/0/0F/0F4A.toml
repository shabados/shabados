[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਸੁਕਬਿ, ਸੁ ਧਾਰ ॥੫੮੪॥"
page = 744

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the words “Anik-piyar-naadini” and then adding “Ripu Ari” at the end, the names of Tupak are formed.584."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤੁਪਕ ਦਾ ਨਾਮ ਬਣ ਜਾਵੇਗਾ। ਕਵੀਓ! ਮਨ ਵਿਚ ਧਾਰਨ ਕਰ ਲਵੋ ॥੫੮੪॥"