[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਤ ਪ੍ਰਤਿਪਾਰੈ; ਬਾਪ ਜੈਸੇ ਮਾਈ ॥੧॥"
page = 202
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever, He cherishes him like Father and Mother."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਿਓ ਤੇ ਮਾਂ ਦੀ ਤਰ੍ਹਾਂ ਉਹ ਸਦੀਵ ਹੀ ਉਸ ਦੀ ਪ੍ਰਵਰਸ਼ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He always cherishes them, like their father and mother. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਮਾਤ ਪਿਤਾ ਹੈਂ ਤੈਸੇ ਨਿਤਾਪ੍ਰਤੀ ਪਾਲਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ (ਆਪਣੇ ਸੇਵਕ ਦੀ) ਸੰਭਾਲ ਕਰਦਾ ਹੈ ਜਿਵੇਂ ਮਾਂ ਤੇ ਪਿਉ (ਆਪਣੇ ਬੱਚੇ ਦੀ ਸੰਭਾਲ ਕਰਦੇ ਹਨ) ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਤ = ਸਦਾ। ਪ੍ਰਤਿਪਾਰ = ਪਾਲਣਾ ਕਰਦਾ ਹੈ, ਸੰਭਾਲ ਕਰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y lo sostiene y lo protege así como los padres  hacen con su hijo. (1)"