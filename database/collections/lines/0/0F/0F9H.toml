[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਉ ਛੂਟੈ; ਜਾ ਖਸਮੁ ਛਡਾਏ ॥"
page = 839
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then alone one is emancipated, when the Lord sets him free."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤਾਂ ਹੀ ਬੰਦਾ ਬੰਦਖਲਾਸ ਹੁੰਦਾ ਹੈ, ਜਦ ਸੁਆਮੀ ਉਸ ਨੂੰ ਰਿਹਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is emancipated, whom the Lord and Master emancipates."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਇਹ ਜੀਵ ਬੰਧਨੋਂ ਸੇ ਛੂਟਤਾ ਹੈ, ਜਬ ਆਪ (ਖਸਮੁ) ਵਾਹਿਗੁਰੂ ਇਸ ਕੋ ਛੁਡਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਹੀ ਪਿੰਜਰੇ ਵਿਚੋਂ ਆਜ਼ਾਦ ਹੋਵੇਗਾ ਜੇ ਉਸ ਦਾ ਮਾਲਕ ਉਸ ਨੂੰ ਆਜ਼ਾਦੀ ਦੇਵੇ (ਤਿਵੇਂ ਹੀ ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਕੈਦ ਹੋਏ ਜੀਵ ਨੂੰ ਮਾਲਕ-ਪ੍ਰਭੂ ਆਪ ਹੀ ਖ਼ਲਾਸੀ ਦੇਂਦਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਉ = ਤਦੋਂ ਹੀ। ਖਸਮੁ = ਮਾਲਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno es emancipado sólo si el Señor lo desea,"