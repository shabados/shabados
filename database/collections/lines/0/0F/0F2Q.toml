[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਮਲੁ ਸਾਚੋ ਮਨਿ ਵਸੈ; ਸੋ ਜਾਣੈ ਅਭ ਪੀਰ ॥"
page = 57
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Immaculate True Lord abides within the mind and He understands the heat's pang."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੁਨੀਤ ਸਚਾ ਸਾਹਿਬ ਚਿੱਤ ਅੰਦਰ ਨਿਵਾਸ ਰੱਖਦਾ ਹੈ ਅਤੇ ਉਹ ਦਿਲ ਦੀ ਪੀੜ ਨੂੰ ਸਮਝਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Pure, True Lord abides within the mind; He knows the pain of our hearts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਨਿਰਮਲੁ) ਸੁਧੁ ਸਾਚਾ ਪਰਮੇਸ੍ਵਰ ਹੀ ਮਨ ਮੇਂ ਵਸਤਾ ਹੈ, ਸੋਈ (ਅਭ) ਰਿਦੇ ਕੀ ਪੀੜ ਕੋ (ਜਾਣੋ) ਅਨੁਭਵ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ) ਉਹ ਸਦਾ-ਥਿਰ ਪਵਿਤ੍ਰ ਪ੍ਰਭੂ ਜੋ ਮਨੁੱਖ ਦੀ ਅੰਦਰਲੀ ਵੇਦਨ ਜਾਣਦਾ ਹੈ ਮਨੁੱਖ ਦੇ ਮਨ ਵਿਚ ਆ ਪਰਗਟਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਅਭ ਪੀਰ = ਹਿਰਦੇ ਦੀ ਪੀੜ, ਅੰਦਰਲੀ ਵੇਦਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, el Verdadero, el Inmaculado, viene a nuestra mente, pues Él conoce los recovecos de nuestro corazón."