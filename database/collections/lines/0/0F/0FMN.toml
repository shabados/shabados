[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮੋ ਭਾਵਨੀ ਭੂਤ ਹੰਤਾ ਭੜਿੰਗੀ ॥"
page = 119

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O Bhavani of beautiful limbs! Thou art the destroyer of all engaged in the war."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ਰਧਾ ਰੂਪਾ, ਭੂਤਾਂ ਨੂੰ ਮਾਰਨ ਵਾਲੀ ਅਤੇ ਯੁੱਧ ਕਰਨ ਵਾਲੀ ਨੂੰ ਨਮਸਕਾਰ ਹੈ;"