[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਾ ਹੁਕਮੁ; ਨ ਮੇਟੈ ਕੋਇ ॥"
page = 1144
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, whose order no one can undo."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਫੁਰਮਾਨ ਨੂੰ ਕੋਈ ਨਹੀਂ ਮੇਟ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one can erase the Hukam of His Command."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਹੁਕਮ ਕੋ ਕੋਈ ਹਟਾ ਨਹੀਂ ਸਕਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਭੀ ਜੀਵ ਉਸ ਦਾ ਹੁਕਮ ਮੋੜ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਮੇਟੈ = ਮੋੜ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél Cuya Voluntad nadie puede retar,"