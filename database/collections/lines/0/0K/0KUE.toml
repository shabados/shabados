[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਦਾਸੀ; ਭਗਤਾ ਕੀ ਕਾਰ ਕਮਾਵੈ ॥"
page = 231
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Mammon is the hand-maid of God's devotees, and performs their service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੋਹਨੀ ਵਾਹਿਗੁਰੂ ਦੇ ਅਨਰਾਗੀਆਂ ਦੀ ਬਾਂਦੀ ਹੈ ਅਤੇ ਉਨ੍ਹਾਂ ਦੀ ਚਾਕਰੀ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Maya is the slave of the Lord's devotees; it works for them."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਭੀ ਦਾਸੀ ਹੋ ਕਰ ਭਗਤੋਂ ਕੀ ਕਾਰ ਕਮਾਵਤੀ ਹੈ॥☬ਜੇ ਕਹੇ ਕਿਉਂ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜੇਹੜੇ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਕਰਦੇ ਹਨ, ਮਾਇਆ ਉਹਨਾਂ ਦੀ ਦਾਸੀ ਬਣੀ ਰਹਿੰਦੀ ਹੈ, ਤੇ ਉਹਨਾਂ ਦੀਆਂ ਲੋੜਾਂ ਪੂਰੀਆਂ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Maya es la esclava obediente de los Devotos del Señor;"