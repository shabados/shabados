data = "ਜਦ ਉਹ ਇਸਤਰੀ ਖਿੜਕੀ ਖੋਲ ਕੇ ਅਤੇ ਅੱਖਾਂ ਪਸਾਰ ਕੇ ਵੇਖੇਗੀ,"