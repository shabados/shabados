data = "ਜਬ ਵਹੁ ਤਾਕੀ ਛੋਰਿ ਤ੍ਰਿਯ; ਨਿਰਖੈ ਨੈਨ ਪਸਾਰਿ ॥"
page = 869

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘When, through the open window, she sees you with eyes wide open,"

