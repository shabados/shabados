data = "ਮਗ ਲਗੀਆ ਪੂਰਤ ਨਾਦ ਧੁਨੰ ॥"
page = 662

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Adopting the fourteenth Guru, the sage Dutt, blowing his conch, moved further"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸੰਖ) ਨਾਦ ਕਰਦਾ ਹੋਇਆ ਰਾਹੇ ਪੈ ਗਿਆ ਹੈ।"