[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਬੂਝੇ. ਵਡਾ ਫੇਰੁ ਪਇਆ; ਫਿਰਿ ਆਵੈ ਜਾਈ ॥"
page = 511
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without understanding the reality, one has to traverse a big circuit, and he continues coming and going, again and again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਸਲੀਅਤ ਨੂੰ ਸਮਝਣ ਦੇ ਬਾਝੋਂ ਬੰਦੇ ਨੂੰ ਲੰਮਾ ਚੱਕਰ ਕੱਟਣਾ ਪੈਂਦਾ ਹੈ ਅਤੇ ਉਹ ਮੁੜ ਮੁੜ ਕੇ ਆਉਂਦਾ ਤੇ ਜਾਂਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without understanding, one must wander around the cycle of reincarnation, and continue coming and going."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਜੀਵ ਕੋ ਗੁਰ ਉਪਦੇਸ ਬੂਝੇ ਸੇ ਬਿਨਾ ਬਡਾ ਚੋਰਾਸੀ ਕਾ ਫੇਰੁ ਪੜ ਗਇਆ ਹੈ, ਫਿਰ ਫਿਰ ਆਵਤਾ ਜਾਤਾ ਹੈ, ਭਾਵ ਯਹ ਕਿ ਜਨਮਤਾ ਮਰਤਾ ਰਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਗੱਲ) ਸਮਝਣ ਤੋਂ ਬਿਨਾ (ਕਿ 'ਗੁਰ ਪਰਸਾਦੀ ਪਾਈਐ', ਮਨੁੱਖ ਨੂੰ) ਜਨਮ ਮਰਨ ਦਾ ਲੰਮਾ ਚੱਕਰ ਲਾਣਾ ਪੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਨੁ ਬੂਝੇ = (ਇਹ ਗੱਲ) ਸਮਝਣ ਤੋਂ ਬਿਨਾ (ਕਿ 'ਗੁਰ ਪਰਸਾਦੀ ਪਾਈਐ' , ਵੇਖੋ ਪਉੜੀ ਨੰ: ੭)। ਫੇਰੁ = ਗੇੜ, ਜਨਮ ਮਰਨ ਦਾ ਲੰਮਾ ਚੱਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin conocer la Realidad, uno siempre hace las rondas y va y viene una y otra vez."