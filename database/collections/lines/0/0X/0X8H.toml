[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਹੇ ਸਸਤ੍ਰ ਅਸਤ੍ਰੰ, ਨਚੇ ਭੂਤ ਪ੍ਰੇਤੰ ॥੨੯੭॥"
page = 704

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The arms and weapons were struck and the ghosts and fiends danced.70.297."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ਸਤ੍ਰ ਅਤੇ ਅਸਤ੍ਰ ਚਲਦੇ ਹਨ ਅਤੇ ਭੂਤ ਪ੍ਰੇਤ ਨਚ ਰਹੇ ਹਨ ॥੨੯੭॥"