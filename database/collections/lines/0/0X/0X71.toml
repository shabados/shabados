[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਉਤਰਿ ਭੂਪ ਸੁਤ ਤਾਲ ਬਜਾਯੋ ॥"
page = 816

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Next morning when the Yogi went to the town, the Raja’s son came down and clapped his hands."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤਦ) ਰਾਜੇ ਦੇ ਪੁੱਤਰ ਨੇ (ਬ੍ਰਿਛ ਤੋਂ) ਉਤਰ ਕੇ ਤਾੜੀ ਵਜਾਈ।"