[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਤੇ ਕੁਸਲ; ਨ ਕਾਹੂ ਥੀਆ ॥"
page = 258
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "from who, none had derived happiness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਤੋਂ ਕਿਸੇ ਨੂੰ ਭੀ ਖੁਸ਼ੀ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੋਈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "no one has obtained happiness from these."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਾਂਗਨੇ ਸੇ ਕਿਸੀ ਕੋ ਭੀ (ਕੁਸਲ) ਸੁਖ ਨਹੀਂ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਤੋਂ ਕਦੇ ਕਿਸੇ ਨੂੰ ਭੀ ਆਤਮਕ ਸੁਖ ਨਹੀਂ ਮਿਲਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੁਸਲ = ਆਤਮਕ ਸੁਖ। ਕਾਹੂ = ਕਿਸੇ ਨੂੰ ਭੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no dan la alegría a nadie?"