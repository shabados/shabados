[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੀ ਅਕਥ ਕਹਾਣੀ ॥"
page = 626
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ineffable is the Lord's discourse."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਕਹਿ ਹੈ ਸੁਆਮੀ ਦੀ ਕਥਾ-ਵਾਰਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God's sermon is inexpressible."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸਰ ਕੀ ਕਥਾ ਅਕੱਥ ਹੈ, ਭਾਵ ਸੇ ਬ੍ਯੰਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਦੇ ਸਰੂਪ ਦੀ ਗੱਲ-ਬਾਤ ਦੱਸੀ ਨਹੀਂ ਜਾ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਕਥ: ਬਿਆਨ ਨਾਹ ਹੋ ਸਕਣ ਵਾਲੀ। ਕਹਾਣੀ = ਸਰੂਪ ਦਾ ਵਰਣਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Alabanza del Señor es Inefable;"