[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਨ ਸੰਤਨ ਕੈ; ਮਾਥਾ ਮੇਰੋ ॥੧॥"
page = 1303
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My forehead rests on the saints feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਮਸਤਕ ਸਾਧਾਂ ਦੇ ਪੈਰਾਂ ਉਤੇ ਟਿਕਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I touch my forehead to the feet of the Saints. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਤੇ ਸੰਤੋਂ ਕੇ ਚਰਨੋਂ ਪਰ ਮੇਰਾ ਮਾਥਾ ਰਖਾ ਹੂਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੇਰਾ ਮੱਥਾ (ਤੇਰੇ) ਸੰਤ ਜਨਾਂ ਦੇ ਚਰਨਾਂ ਉਤੇ ਟਿਕਿਆ ਰਹੇ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਰਨ ਸੰਤਨ ਕੈ = ਸੰਤ ਜਨਾਂ ਦੇ ਚਰਨਾਂ ਉੱਤੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así poso mi frente a los Pies de los Santos. (1)"