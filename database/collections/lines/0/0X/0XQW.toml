assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰਦਛਨਾ ਅਨੇਕ ਕੈ ॥"
page = 171

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The king quaffed the water, with which the feet of the Brahmin had been washed and offered charities."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੇ ਅਨੇਕ ਵਾਰ ਪ੍ਰਦਖਣਾ ਕੀਤੀ।"