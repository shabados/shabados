[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਰੋਗ ਕਾ; ਬਿਨਸਿਆ ਥਾਉ ॥੨॥"
page = 191
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the abode of all the diseases is destroyed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਮੂਹ ਬੀਮਾਰੀਆਂ ਦਾ ਡੇਰਾ ਪੁਟਿਆ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the dwelling of all disease is destroyed. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਰੋਗੋਂ ਕਾ ਅਸਥਾਨ ਜੋ ਅਗ੍ਯਾਨ ਹੈ, ਸੋ ਨਾਸ ਭਯਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਰੋਗਾਂ ਦਾ ਨਿਸ਼ਾਨ ਹੀ ਮਿਟ ਜਾਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲ = ਸਾਰੇ। ਥਾਉ = ਥਾਂ, ਨਿਸ਼ਾਨ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la fuente de toda inquietud es destruida. (2)"