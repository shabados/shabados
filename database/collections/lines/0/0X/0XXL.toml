data = "ਗੂਜਰੀ ਮਹਲਾ ੫ ਦੁਪਦੇ ਘਰੁ ੨ ॥"
page = 498
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Gujri 5th Guru. Dupade."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੂਜਰੀ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ ਦੁਪਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Goojaree, Fifth Mehl, Dho-Padhay, Second House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਗੂਜਰੀ, ਘਰ ੨ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਦੋ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Guyeri, Mejl Guru Aryan, Quinto Canal Divino, Du-Padas."