[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਸ ਕਾਜੀ ਕੋ ਪਸਰਿਯੋ ਠਗ ਭਾਖ︀ਯੋ ਸਭ ਗਾਉ ॥"
page = 858

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The swindler praised the Quazi all over the town and said,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਾਜ਼ੀ ਦਾ ਜਸ ਪਸਰ ਗਿਆ ਅਤੇ ਠਗ ਨੇ ਸਾਰੇ ਪਿੰਡ ਵਿਚ ਦਸ ਦਿੱਤਾ"