[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੂਅ ਤਛਕ ਕੇ ਜਨੁ ਰੂਪ ਮਢੇ ॥੩੪੩॥"
page = 235

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The shafts were being taken out from quivers and the serpent-like arrows were struck like the messengers of death.343."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ (ਤੀਰਾਂ ਨੇ) ਤੱਛਕ ਦੇ ਬੱਚਿਆਂ ਦਾ ਰੂਪ ਧਾਰਨ ਕਰ ਰੱਖਿਆ ਹੋਵੇ ॥੩੪੩॥"