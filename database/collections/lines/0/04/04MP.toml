[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਪ੍ਰਭ ਕਉ ਖੋਜੰਤੇ ॥"
page = 276
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many millions search for the Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਕ੍ਰੋੜਾਂ ਸੁਆਮੀ ਨੂੰ ਲਭਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions are searching for God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਕਈ ਕ੍ਰੋੜੋਂ ਤਿਸ ਪ੍ਰਭੂ ਕੇ ਨਿਰਗੁਣ ਸਰੂਪ ਕੌ ਖੋਜਤੇ ਹੈਂ, ਭਾਵ ਸਾਧਨ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਰੋੜਾਂ ਬੰਦੇ ਪ੍ਰਭੂ ਨੂੰ ਖੋਜਦੇ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones se ocupan en la búsqueda de Dios,"