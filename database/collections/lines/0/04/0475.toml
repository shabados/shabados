[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਇਨੇ ਕਾ ਚਉਕਾ; ਕੰਚਨ ਕੁਆਰ ॥"
page = 1168
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Cooking place is of gold, and of gold are the vessels."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੌਕਾਂ ਸੋਨੇ ਦਾ ਹੈ ਅਤੇ ਸੋਨੇ ਦੇ ਹੀ ਹਨ ਬਰਤਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The kitchen is golden, and the cooking pots are golden."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਵਰਨ ਕਾ ਚੌਕਾ ਹੋਵੇ ਔਰ (ਕੰਚਨ) ਸ੍ਵਰਨ ਕੀਆਂ ਹੀ (ਕੁਆਰ) ਕੋਰੀਆਂ ਅਰਥਾਤ ਗਾਗਰਾਂ ਹੋਨ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇ ਕੋਈ ਮਨੁੱਖ) ਸੋਨੇ ਦਾ ਚੌਂਕਾ (ਤਿਆਰ ਕਰੇ), ਸੋਨੇ ਦੇ ਹੀ (ਉਸ ਵਿਚ) ਭਾਂਡੇ (ਵਰਤੇ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਉਕਾ = ਰਸੋਈ ਤੋਂ ਬਾਹਰ ਖੁਲ੍ਹੇ ਥਾਂ ਰੋਟੀ ਪਕਾਣ ਵਾਸਤੇ ਵਲਿਆ ਹੋਇਆ ਥਾਂ। ਕੰਚਨ = ਸੋਨਾ। ਕੁਆਰ = ਕਰਵੇ, ਗਾਗਰਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si la cocina fuera de oro,"