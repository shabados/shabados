[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕੀ ਕੀਮਤਿ; ਕਿਨੈ ਨ ਪਾਈ ॥"
page = 287
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His worth no one has ascertained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਮੁੱਲ ਦਾ ਕਿਸੇ ਨੂੰ ਥਹੁ ਨਹੀਂ ਪਾਇਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one can estimate His worth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੀ ਕੀਮਤਿ ਕਿਸੀ ਨੇ ਨਹੀਂ ਪਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਜੀਵ ਉਸ (ਦੇ ਗੁਣਾਂ) ਦਾ ਮੁੱਲ ਨਹੀਂ ਪਾ ਸਕਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nadie puede decir cuál es el Valor del Señor."