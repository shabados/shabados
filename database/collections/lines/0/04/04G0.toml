[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਸੁਖਾ ਬਨੇ; ਤੇਰੈ ਓਲੑੈ ॥"
page = 385
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In Thy shelter, I obtain all the comforts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਸ਼ਰਨ ਅੰਦਰ ਮੈਂ ਸਾਰੇ ਆਰਾਮ ਪਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All comforts are obtained in Your Shelter."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸ੍ਵਾਮੀ! ਤੇਰੇ (ਓਲੈ) ਆਸਰੇ ਹੋਨੇ ਕਰ ਸਰਬ ਸੁਖਾਂ ਕੇ ਸਮਦਾਯ ਬਨੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! (ਉਦੋਂ ਤੋਂ) ਤੇਰੇ ਆਸਰੇ-ਪਰਨੇ ਰਹਿਣ ਨਾਲ ਮੇਰੇ ਵਾਸਤੇ ਸਾਰੇ ਸੁਖ ਹੀ ਸੁਖ ਬਣ ਗਏ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇਰੈ ਓਲ੍ਹ੍ਹੈ = ਤੇਰੇ ਆਸਰੇ (ਰਹਿਣ ਨਾਲ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando busco Tu Refugio estoy siempre en Paz,"