[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਬਿਨਾਸੀ ਪ੍ਰਭਿ ਖੇਲੁ ਰਚਾਇਆ; ਗੁਰਮੁਖਿ ਸੋਝੀ ਹੋਈ ॥"
page = 946
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Imperishable Lord has staged this play. It is through the Guru, that one understands it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਸ ਰਹਿਤ ਸੁਆਮੀ ਨੇ ਇਹ ਖੇਡ ਬਣਾਈ ਹੈ। ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਹੀ ਇਨਸਾਨ ਇਸ ਨੂੰ ਸਮਝਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The eternal imperishable Lord God has staged this play; the Gurmukh understands it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਬਨਾਸੀ ਪ੍ਰਭੂ! ਤੈਨੇ ਏਹ ਸਭ ਖੇਲ ਰਚਾਇਆ ਹੋਇਆ ਹੈ, ਇਹ (ਸੋਝੀ) ਖਬਰ ਗੁਰੋਂ ਦਵਾਰੇ ਹੋਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਬਿਨਾਸੀ ਪ੍ਰਭੂ ਨੇ (ਇਹ ਜਗਤ ਦੀ) ਖੇਡ ਰਚੀ ਹੈ ਗੁਰਮੁਖ ਮਨੁੱਖ ਨੂੰ ਇਹ ਸਮਝ ਪੈਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Eterno e Imperecedero ha instalado Su Obra y el Gurmukj la comprende,"