[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦੇ ਬੰਦਿਆਣ, ਸੰਤਾਣ ਮਹਾਤਮਾਣ, ਦੀ ਸਿਫਤ ਕਿੱਥੋਣ ਤਕ ਕਰਾਣ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਤਾ ਕੁਜਾ ਔਸਾਫ਼ਿ ਮਰਦਾਨਿ ਖ਼ੁਦਾ-ਸਤ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "The last letter in his name, 'Daal' is the cure for all diseases and pains and is above and beyond progression and recession. (54)"