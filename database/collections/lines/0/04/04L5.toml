[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਰਝਿ ਰਹਿਓ; ਬਿਖਿਆ ਕੈ ਸੰਗਾ ॥"
page = 759
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man is entangled in the company of sin."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਦਮੀ ਪਾਪ ਦੀ ਸੁਹਬਤ ਅੰਦਰ ਫਾਬਾ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is entangled in sinful associations;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਜੀਵ ਬਿਸ੍ਯੋਂ ਕੇ ਸਾਥ ਫਸ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਮਾਇਆ ਦੀ ਸੰਗਤਿ ਵਿਚ ਫਸਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਰਝਿ ਰਹਿਓ = ਉਲਝਿਆ ਹੋਇਆ ਹੈ, ਫਸਿਆ ਪਿਆ ਹੈ। ਬਿਖਿਆ = ਮਾਇਆ (ਦਾ ਮੋਹ)। ਕੈ ਸੰਗਾ = ਦੇ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Suji, Mejl Guru Aryan, Quinto Canal Divino, Ashtapadis."