data = "Who had earlier owned allegiance to the king.1.251."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ (ਪਹਿਲਾਂ) ਰਾਜੇ ਤੋਂ (ਆਪਣੀਆਂ ਕਾਮਨਾਵਾਂ ਦੀ ਪੂਰਤੀ ਦੀ) ਆਸ ਰਖਦੇ ਸਨ ॥੧॥੨੫੧॥"