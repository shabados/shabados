data = "ਰਾਜਾ ਕੌ ਕਰਿ ਬਸਿ ਲਿਯੋ; ਦੀਨੋ ਜਾਰ ਨਿਕਾਰਿ ॥"
page = 1000

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After getting the paramour to escape, she had won over the Raja,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਰਾਜੇ ਨੂੰ ਵਸ ਵਿਚ ਕਰ ਲਿਆ ਅਤੇ ਯਾਰ ਨੂੰ ਕੱਢ ਦਿੱਤਾ।"