[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਿਆਨੋ ਖੰਡਾ ਧੂਹਿਆ; ਮਹਖਾਸੁਰ ਭਾਰੀ ॥"
page = 122

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Mahishasura pulled out his huge double-edged sword from his scabbard."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਹਿਖਾਸੁਰ ਨੇ ਮਿਆਨ ਵਿਚੋਂ ਭਾਰੀ ਖੰਡਾ ਖਿਚ ਲਿਆ।"