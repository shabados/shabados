[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖਰਚੁ ਬੰਨੁ ਚੰਗਿਆਈਆ; ਮਤੁ ਮਨ ਜਾਣਹਿ ਕਲੁ ॥"
page = 595
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Tip up merits for thy travelling expenses and in thy mind think thou not of to-morrow."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਸਤੇ ਦੇ ਖਰਚ ਲਈ ਤੂੰ ਨੇਕੀਆਂ ਪੱਲੇ ਬੰਨ੍ਹ ਲੈ ਤੇ ਆਪਣੇ ਚਿੱਤ ਵਿੱਚ ਆਉਣ ਵਾਲੀ ਸਵੇਰ ਦਾ ਖਿਆਲ ਨਾਂ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Gather up merits for your travelling expenses, and do not think of tomorrow in your mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਚੰਗਿਆਈਆ) ਸਭੁ ਕਰਮ ਰੂਪੀ ਭਲਿਆਈਓਂ ਕਾ ਖਰਚ ਅਪਨੇ ਪੱਲੇ ਬਾਂਧ ਰਖ। ਔਰ ਮਨ ਮੇਂ ਯਹ (ਮਤ) ਨ ਜਾਨੇ ਕਿ ਕਲ ਕਰੋਂਗਾ, ਕਿੰਤੂ ਇਹੁ ਸੌਦਾਗਰੀ ਇਸ ਮਾਨੁਖ ਸਰੀਰ ਮੇਂ ਅਬੀ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਚੰਗੇ ਗੁਣਾਂ ਨੂੰ ਜੀਵਨ-ਸਫ਼ਰ ਦਾ ਖ਼ਰਚ ਬਣਾ। ਹੇ ਮਨ! (ਇਸ ਵਪਾਰ ਦੇ ਉੱਦਮ ਨੂੰ) ਕੱਲ ਤੇ ਨਾਹ ਪਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਮਤੁ ਜਾਣਹਿ ਕਲੁ = ਮਤਾਂ ਕੱਲ ਜਾਣੇ, ਕੱਲ ਤੇ ਨਾਹ ਪਾਈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ahorra los méritos para tus gastos de viaje, y no dejes para mañana habitar en tu mente."