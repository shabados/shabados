[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਨਾਮੁ ਦਇਆਲੁ ਧਿਆਹਾ ॥"
page = 698
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remember thou the Name of the merciful Lord Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮਿਹਰਬਾਨ ਸੁਆਮੀ ਮਾਲਕ ਦੇ ਨਾਮ ਦਾ ਆਰਾਧਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate on the Name of the Merciful Lord, Har, Har."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਦਿਆਲ ਕੇ ਹਰਿ ਨਾਮ ਕੋ ਧਿਆਵਣਾ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਦਇਆ ਦਾ ਸੋਮਾ ਹੈ, ਉਸ ਦਾ ਨਾਮ ਸਦਾ ਸਿਮਰਦੇ ਰਹੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਇਆਲੁ = ਦਇਆ ਦਾ ਘਰ, ਦਇਆ ਦਾ ਪੁੰਜ। ਧਿਆਹਾ = ਧਿਆਵੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente, vive en el Nombre del Señor Benévolo;"