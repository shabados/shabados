[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗੁ ਸੂਹੀ ਛੰਤ ਮਹਲਾ ੪ ਘਰੁ ੩ ॥"
page = 775
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rag Suhi Chhant 4th Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਸੂਹੀ ਛੰਤ ਚੌਥੀ ਪਾਤਿਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Soohee, Chhant, Fourth Mehl, Third House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਸੂਹੀ, ਘਰ ੩ ਵਿੱਚ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਦੀ ਬਾਣੀ 'ਛੰਤ' (ਛੰਦ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Suji, Chant, Mejl Guru Ram Das, Cuarto Canal Divino."