[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੋਈ ਪੜ੍ਹਤ ਕੁਰਾਨ ਕੋ ਕੋਈ ਪੜ੍ਹਤ ਪੁਰਾਨ ॥"
page = 58

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Someone studies the Quran and someone studies the Puranas."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਕੁਰਾਨ ਨੂੰ ਪੜ੍ਹਦਾ ਹੈ ਅਤੇ ਕੋਈ ਪੁਰਾਣ ਪੜ੍ਹਦਾ ਹੈ।"