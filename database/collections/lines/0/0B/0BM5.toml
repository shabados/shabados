[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਉ ਪਾਈ ਗੁਰੁ; ਜਿਤੁ ਲਗਿ ਪਿਆਰਾ ਦੇਖਸਾ ॥"
page = 452
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How shall I find the Guru, by clinging to whom I can see my Beloved?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਗੁਰਾਂ ਨੂੰ ਕਿਸ ਤਰ੍ਹਾਂ ਪ੍ਰਾਪਤ ਹੋਵਾਂਗਾ, ਜਿਨ੍ਹਾਂ ਨਾਲ ਲੱਗ ਕੇ ਮੈਂ ਆਪਣੈ ਦਿਲਬਰ ਨੂੰ ਵੇਖ ਸਕਦਾ ਹਾਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How can I find the Guru? Grasping hold of Him, I behold my Beloved."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸਾ ਗੁਰੂ ਕਿਸ ਪ੍ਰਕਾਰ ਪਾਈਐ ਜਿਸ ਸੇ ਮਿਲਕਰ ਪਿਆਰੇ ਕੋ ਦੇਖਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪਿਆਰੇ! ਦੱਸ) ਮੈਂ ਕਿਵੇਂ ਗੁਰੂ ਨੂੰ ਲੱਭਾਂ ਜਿਸ ਦੀ ਰਾਹੀਂ ਹੀ ਮੈਂ ਤੇਰਾ ਦਰਸ਼ਨ ਕਰ ਸਕਾਂਗੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਉ = ਕਿਵੇਂ? ਪਾਈ = ਪਾਈਂ, ਮੈਂ ਲੱਭਾਂ। ਜਿਤੁ = ਜਿਸ ਦੀ ਰਾਹੀਂ। ਲਗਿ = (ਜਿਸ ਦੀ ਚਰਨੀਂ) ਲੱਗ ਕੇ। ਦੇਖਸਾ = ਦੇਖਸਾਂ, ਮੈਂ ਵੇਖਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿cómo puedo llegar hasta el Guru? Encontrándome con Él podré ver a mi Bienamado Señor."