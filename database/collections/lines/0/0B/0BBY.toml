[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਮ ਰਾਮ ਰਾਮ ਮਾਲ ॥"
page = 1271
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Associating with the God's associates,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਸਾਥੀਆਂ ਦੀ ਸੰਗਤ ਕਰਨ ਦੁਆਰਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They dwell on the Lord, Raam, Raam, chanting on their malas;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਰਮ) ਸੁੰਦ੍ਰ ਰਾਮ ਰਾਮ ਉਚਾਰਨ ਰੂਪ ਮਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਸੇਵਕ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦੀ ਸੁੰਦਰ ਮਾਲਾ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਮ = ਸੁੰਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Meditando con su Mala ellos habitan en el Señor, Ram, Ram."