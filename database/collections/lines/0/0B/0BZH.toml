[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰੈ ਸਤਿਗੁਰਿ; ਬੂਝ ਬੁਝਾਈ ॥"
page = 1052
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Perfect True Guru has imparted me this understanding,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਸੱਚੇ ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਇਹ ਸਮਝ ਦਰਸਾਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Perfect True Guru has imparted this understanding."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਸਤਿਗੁਰੋਂ ਨੇ ਏਹੁ ਸਮਝ ਸਮਝਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੂ ਨੇ (ਸਾਨੂੰ ਇਹ) ਸਮਝ ਬਖ਼ਸ਼ੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰਿ = ਗੁਰੂ ਨੇ। ਬੂਝ = ਸਮਝ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es a través del Guru Perfecto que esta Verdad es revelada:"