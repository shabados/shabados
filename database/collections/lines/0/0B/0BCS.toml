[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਊਪਰਿ; ਪ੍ਰਭੁ ਕਿਰਪਾ ਕਰੈ ॥"
page = 1146
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "One, on whom is the Lord's grace"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਉਤੇ ਸੁਆਮੀ ਦੀ ਰਹਿਮਤ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That person, upon whom God showers His Mercy"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਊਪਰ ਪਰਮੇਸਰ ਕ੍ਰਿਪਾ ਦ੍ਰਿਸ੍ਟੀ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਜਿਸ ਮਨੁੱਖ ਉੱਤੇ ਮਿਹਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸੁ ਊਪਰ ਤੇ = ਉਸ ਦੇ ਸਿਰ ਉੱਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, aquél a quien Dios salva, la tristeza a ese ser no le aflige."