[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੁੰਗੂ ਚੰਨਣੁ ਫੁਲ ਚੜਾਏ ॥"
page = 1241
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou offer it saffron, sandal and flowers."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਇਸ ਨੂੰ ਕੇਸਰ, ਚੰਦਨ ਅਤੇ ਫੁਲ ਪੇਟਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You offer saffron, sandalwood and flowers."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੇਸਰ ਚੰਦਨ ਲਗਾਵਤਾ ਹੈ ਔਰ ਫੂਲੋਂ ਕੋ ਚੜਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੇਸਰ ਚੰਦਨ ਤੇ ਫੁੱਲ (ਉਸ ਮੂਰਤੀ ਦੇ ਅੱਗੇ) ਭੇਟ ਧਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੁੰਗੂ = ਕੇਸਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la baña y la alaba, también le pone la marca de azafrán y la pasta de sándalo,"