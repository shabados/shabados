[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਪਟਿ ਰਹੇ ਮਾਇਆ ਰੰਗ ਮਾਤੇ; ਲੋਚਨ. ਕਛੂ ਨ ਸੂਝੀ ॥੧॥"
page = 672
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Intoxicated with the pleasure of wealth, they remain engrossed in it and their eyes see not anything else."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨ-ਦੌਲਤ ਦੀ ਖੁਸ਼ੀ ਵਿੱਚ ਮਤਵਾਲੇ ਹੋਏ ਹੋਏ, ਉਹ ਇਸ ਵਿੱਚ ਖੱਚਤ ਰਹਿੰਦੇ ਹਨ। ਉਹਨਾਂ ਨੂੰ ਅੱਖਾਂ ਤੋਂ ਹੋਰ ਕੁਝ ਦਿਸਦਾ ਹੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They remain engrossed in Maya, intoxicated with the pleasures of their wealth; their eyes see nothing else at all. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਯਾ ਕੇ (ਰੰਗ) ਅਨੰਦ ਮੇਂ ਮਸਤ ਹੂਏ ਤਿਸੀ ਮੇਂ ਹੀ ਲੰਪਟ ਹੋ ਰਹੇ, ਤਿਨੋਂ ਕੋ ਨੇਤ੍ਰੋਂ ਕਰ ਸੰਸਾਰ ਕੀ ਅਨਿਤਤਾ ਕੁਛ ਨ ਸੁਝਤੀ ਭਈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਾਇਆ ਦੇ ਕੌਤਕਾਂ ਵਿਚ ਮਸਤ ਰਹਿੰਦੇ ਹਨ, ਮਾਇਆ ਨਾਲ ਚੰਬੜੇ ਰਹਿੰਦੇ ਹਨ। (ਮਾਇਆ ਤੋਂ ਬਿਨਾ) ਹੋਰ ਕੁਝ ਉਹਨਾਂ ਨੂੰ ਅੱਖੀਂ ਦਿੱਸਦਾ ਹੀ ਨਹੀਂ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਪਟਿ ਰਹੇ = ਚੰਬੜੇ ਰਹਿੰਦੇ ਹਨ। ਮਾਤੇ = ਮਸਤ। ਲੋਚਨ = ਅੱਖਾਂ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues sus ojos no podían ver. (1)"