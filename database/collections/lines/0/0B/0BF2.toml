[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮਤਿ ਪਾਇਆ ਨਾਮੁ ਤੁਮਾਰਾ ॥"
page = 1043
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru's instruction, I am blessed with Thy Name, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਸਿੱਖਮਤ ਰਾਹੀਂ, ਮੈਨੂੰ ਤੇਰਾ ਨਾਮ ਪ੍ਰਦਾਨ ਹੋਇਆ ਹੈ, ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Guru's Teachings, I have obtained Your Name, Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਗੁਰੋਂ ਕੀ ਸਿਖ੍ਯਾ ਲੈ ਕੇ ਤੁਮਾਰਾ ਨਾਮ ਪਾਇਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰਾ ਨਾਮ ਗੁਰੂ ਦੀ ਮੱਤ ਤੇ ਤੁਰਿਆਂ ਹੀ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, de la Alabanza del Señor y a través de la Sabiduría del Guru Perfecto, son bendecidos con el Nombre de Dios."