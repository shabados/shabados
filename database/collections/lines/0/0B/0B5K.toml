[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹੂੰ ਮਲੇਛ ਭਾਖਿਆ, ਕਹੂੰ ਬੇਦ ਰੀਤੰ ॥"
page = 29

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere Thou art the language of malechhas (barbarians), somewhere about the Vedic rituals!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ (ਤੁਸੀਂ) ਮੁਸਲਮਾਨੀ ਦੇਸਾਂ ਦੀ ਭਾਸ਼ਾ ਹੋ ਅਤੇ ਕਿਤੇ (ਤੁਸੀਂ) ਵੇਦ ਦੀ ਮਰਯਾਦਾ (ਨੂੰ ਕਾਇਮ ਕਰਨ ਵਾਲੀ ਭਾਸ਼ਾ ਹੋ)।"