[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਲਤੀ ਬਾਰ; ਤੇਰੋ ਕਛੂ ਨਾਹਿ ॥੪॥"
page = 1189
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nothing shall be thine at the time of departure."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੂਚ ਕਰਨ ਦੇ ਵੇਲੇ ਤੇਰਾ ਕੁਝ ਭੀ ਨਹੀਂ ਹੋਣਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When you must leave, nothing shall go along with you. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅੰਤ ਕੋ ਚਲਣੇ ਕੇ ਸਮੇਂ ਤੇਰੋ ਕੁਛ ਭੀ ਸਹਾਈ ਨਹੀਂ ਹੋਵੇਗਾ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰ ਤੋਂ ਕੂਚ ਕਰਨ ਵੇਲੇ (ਧਨ ਮਾਲ ਵਿਚੋਂ) ਕੋਈ ਭੀ ਚੀਜ਼ ਤੇਰੀ ਨਹੀਂ ਹੋਵੇਗੀ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਲਤੀ ਬਾਰ = ਸੰਸਾਰ ਤੋਂ ਕੂਚ ਕਰਨ ਵੇਲੇ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "cuando nada se va con uno al final? (4)"