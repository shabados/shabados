[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੀ ਦਰਗਹ; ਮਹਲਿ ਬੁਲਾਏ ॥"
page = 109
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and are called to the True Court in His presence."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਚੇ ਦਰਬਾਰ ਨੂੰ ਉਸ ਦੀ ਹਜ਼ੂਰੀ ਵਿੱਚ ਸੱਦੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and all are called to the Mansion of His Presence, the True Court of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ (ਸਬਾਏ) ਸੰਪੂਰਨ ਹੀ (ਸਚੀ ਦਰਗਹ) ਸਤਸੰਗ ਦੁਆਰੇ ਤੈਨੇ ਅਪਨੇ (ਮਹਲਿ) ਸਰੂਪ ਮੇਂ ਬੁਲਾਏ ਹੈਂ, ਭਾਵ ਏਹ ਕਿ ਅਪਨੇ ਮੇਂ ਮਿਲਾਇ ਲੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰੇ ਤੇਰੀ ਸਦਾ-ਥਿਰ ਦਰਗਾਹ ਵਿਚ ਤੇਰੇ ਮਹਲ ਵਿਚ ਸੱਦ ਲਏ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਹਲਿ (ਪਰਮਾਤਮਾ ਦੀ) ਹਜ਼ੂਰੀ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y es llamado a la Mansión Divina, de la Corte del Señor."