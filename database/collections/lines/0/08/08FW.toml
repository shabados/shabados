[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਹਿਨਿਸਿ ਬਨੀ. ਪ੍ਰੇਮ ਲਿਵ ਲਾਗੀ; ਸਬਦੁ ਅਨਾਹਦ ਗਹਿਆ ॥੧॥ ਰਹਾਉ ॥"
page = 360
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By fixing attention on God's affection and hearing celestial strain, day and night become fruitful. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਪਿਆਰ ਨਾਲ ਬਿਰਤੀ ਜੋੜਣ ਅਤੇ ਬੈਕੁੰਠੀ ਕੀਰਤਨ ਸੁਣਨ ਦੁਆਰਾ, ਰਾਤ ਦਿਨ ਸਫਲ ਹੋ ਜਾਂਦੇ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, remaining attached to the Love of the Lord, the celestial music of the Shabad resounds. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਦਿਨ ਪ੍ਰੇਮ ਕਰ ਕੇ ਸ੍ਰੇਸ੍ਟ ਬਨੀ ਹੂਈ ਲਿਵ ਲਗ ਰਹੀ ਹੈ ਔਰ ਅਨਾਹਦ (ਸਬਦੁ) ਬ੍ਰਹਮ ਕੋ ਗ੍ਰਹਣ ਕੀਆ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਪ੍ਰਭੂ-ਚਰਨਾਂ ਦੇ ਪ੍ਰੇਮ ਦੀ ਇਤਨੀ ਲਿਵ ਲਗਦੀ ਹੈ ਕਿ ਦਿਨ ਰਾਤ ਬਣੀ ਰਹਿੰਦੀ ਹੈ, ਜੋ ਆਪਣੇ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਨੂੰ ਸਦਾ ਇਕ-ਰਸ ਆਪਣੇ ਅੰਦਰ ਟਿਕਾਈ ਰੱਖਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਹਿ = ਦਿਨ। ਨਿਸਿ = ਰਾਤ। ਅਨਾਹਦ = ਇਕ-ਰਸ, ਲਗਾਤਾਰ। ਗਹਿਆ = ਪਕੜਿਆ, ਗ੍ਰਹਣ ਕੀਤਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y estando entonado siempre en Él, la Melodía Divina de la Palabra resuena en la mente. (1‑Pausa)"