[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਚਨੁ ਸੋਇ; ਜੁ ਮਨ ਸਿਉ ਨਾਚੈ ॥"
page = 872
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he alone is the dancer who dances with his mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਨਚਾਰ ਹੈ ਜੋ ਆਪਣੇ ਮਨੂਏ ਨਾਲ ਨੱਚਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is a dancer, who dances with his mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਨਾਚਨੁ) ਨਾਚਨੇ ਵਾਲਾ, ਭਾਵ ਕੰਜਰ ਤੋ ਸੋਇ ਹੈ, ਜੋ ਮਨ ਕੇ ਸਾਥ ਨਾਚੇ, ਭਾਵ ਮਨ ਕਰ ਪਰਮੇਸ੍ਵਰ ਕਾ ਨਿਰਨਾ ਕਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੁਸੀ 'ਨਾਚਨ' ਕੰਜਰ ਨੂੰ ਆਖਦੇ ਹੋ, ਪਰ ਸਾਡੇ ਖ਼ਿਆਲ ਅਨੁਸਾਰ) 'ਨਾਚਨ' ਉਹ ਹੈ ਜੋ (ਸਰੀਰ ਨਾਲ ਨਹੀਂ) ਮਨ ਨਾਲ ਨੱਚਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਚਨੁ = {Skt. नर्तक A dancer.} ਕੰਜਰ। ਮਨ ਸਿਉ = ਮਨ ਦੀ ਰਾਹੀਂ; ਮਨ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El verdadero bailarín es aquél que baila con su mente despierta,"