[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਦਾਸ; ਸਾਧ ਸਰਣਾਈ ॥"
page = 378
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Slave Nanak has entered the sanctuary of the saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਫਰ ਨਾਨਕ ਨੇ ਸੰਤਾਂ ਦੀ ਸ਼ਰਣਾਗਤ ਸੰਭਾਲੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Servant Nanak has entered the Sanctuary of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਸਾਧੂ ਕੀ ਸਰਣਾਗਤਿ ਹੋਨੇ ਸੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਾਸ ਨਾਨਕ! ਗੁਰੂ ਦੀ ਸਰਨ ਪਿਆਂ ਹੀ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧ = ਗੁਰੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, el Esclavo del Señor, busca el Refugio del Santo"