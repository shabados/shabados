data = "ਰਹਿਯੋ ਬਿਲੋਕਿ ਚੋਰ ਨਹਿ ਪਾਏ ॥"
page = 999

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She took Raja to the whole palace but no thief was found."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵੇਖ ਹਟੇ, ਪਰ ਚੋਰ ਨਜ਼ਰ ਨਾ ਪਿਆ।"