[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਕ੍ਰਿਤੁ ਕੀਤਾ. ਰਹਸੀ ਮੇਰੇ ਜੀਅੜੇ; ਬਹੁੜਿ. ਨ ਆਵੈ ਵਾਰੀ ॥੧॥ ਰਹਾਉ ॥"
page = 154
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The good deeds done shall abide with thee, O my soul, thou shalt not, again find such opportunity. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨੇਕ ਅਮਲ ਕਮਾਏ ਹੋਏ ਤੇਰੇ ਨਾਲ ਰਹਿਣਗੇ, ਹੇ ਮੇਰੀ ਆਤਮਾ! ਐਹੋ ਜੇਹਾ ਮੌਕਾ ਮੁੜ ਕੇ ਤੇਰੇ ਹੱਥ ਨਹੀਂ ਲਗਣਾ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Only the good deeds which you have done shall remain with you, O my soul. This opportunity shall not come again! ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁੰਨ ਕੀਤਾ ਹੂਆ ਤੇਰੇ ਨਾਲ ਰਹੇਗਾ, ਮਨੁਖ ਜਨਮ ਕੀ ਵਾਰੀ ਫੇਰ ਨਹੀਂ ਆਵੇਗੀ॥੧॥ ਰਹਾਉ ॥☬ਜੀਵ ਕਹਿਤਾ ਹੈ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੀਤੀ ਹੋਈ ਨੇਕ ਕਮਾਈ ਹੀ ਤੇਰੇ ਨਾਲ ਨਿਭੇਗੀ। (ਜੇ ਇਹ ਮਨੁੱਖਾ ਜਨਮ ਗਵਾ ਲਿਆ), ਤਾਂ ਮੁੜ (ਛੇਤੀ) ਵਾਰੀ ਨਹੀਂ ਮਿਲੇਗੀ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਕ੍ਰਿਤੁ = ਨੇਕ ਕਮਾਈ। ਰਹਸੀ = ਨਾਲ ਨਿਭੇਗੀ। ਬਹੁੜਿ = ਮੁੜ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo el ser virtuoso perdura, y tal vez esta vida sea tu última oportunidad. (1-Pausa)"