[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਜੀਵਹਿ; ਪ੍ਰਭ ਓਟ ਤੁਮਾਰੀ ॥੧॥ ਰਹਾਉ ॥"
page = 182
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "But the saints under Thy Protection, O Lord pass their life unaffected by it. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਪਨਾਹ ਤਾਬੇ ਹੇ ਸਾਹਿਬ! ਸਾਧੂ ਇਸ ਦੇ ਅਸਰ ਤੋਂ ਬਿਨਾ ਹੀ ਆਪਣਾ ਜੀਵਨ ਬਤੀਤ ਕਰਦੇ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But the Saints live under Your Protection, God. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਹੇ ਪ੍ਰਭੂ! ਸੰਤ ਤੁਮਾਰੀ ਓਟ ਜੀਵਤੇ ਹੈਂ ਅਰਥਾਤ ਮਾਯਾ ਸੇ ਬਚੇ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਸੰਤ ਤੇਰੇ ਆਸਰੇ ਆਤਮਕ ਜੀਵਨ ਮਾਣਦੇ ਹਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo los Santos viven bajo Tu Protección, oh Señor.(1-Pausa)"