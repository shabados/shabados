[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਬਨਜਾਰੋ. ਰਾਮ ਕੋ; ਸਹਜ ਕਰਉ ਬੵਾਪਾਰੁ ॥"
page = 346
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am the merchant of the Lord and deal in Divine knowledge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਪ੍ਰਭੂ ਦਾ ਵਾਪਾਰੀ ਹਾਂ ਅਤੇ ਬ੍ਰਹਮ-ਗਿਆਨ ਦੀ ਸੁਦਾਗਰੀ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am the merchant of the Lord; I deal in spiritual wisdom."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਰਾਮ ਕਾ ਬਨਜਾਰਾ ਸੁਭਾਵਕ ਹੀ ਬਪਾਰ ਕਰਤਾ ਹੂੰ॥☬ਪ੍ਰਸ਼ਨ: ਤੁਮ ਨੇ ਕਿਆ ਬਨਜ ਕੀਆ ਹੈ?☬ਉੱਤਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦਾ ਵਪਾਰੀ ਹਾਂ; ਮੈਂ ਇਹ ਐਸਾ ਵਪਾਰ ਕਰ ਰਿਹਾ ਹਾਂ ਜਿਸ ਵਿਚੋਂ ਮੈਨੂੰ ਸਹਿਜ ਅਵਸਥਾ ਦੀ ਖੱਟੀ ਹਾਸਲ ਹੋਵੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜ ਬ੍ਯ੍ਯਾਪਾਰੁ = ਸਹਜ ਦਾ ਵਾਪਾਰ, ਅਡੋਲਤਾ ਦਾ ਵਣਜ, ਉਹ ਵਣਜ ਜਿਸ ਵਿਚੋਂ ਸ਼ਾਂਤੀ-ਰੂਪ ਖੱਟੀ ਹਾਸਲ ਹੋਵੇ। ਕਰਉ = ਕਰਉਂ, ਮੈਂ ਕਰਦਾ ਹਾਂ। ਹਉ = ਮੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Soy mercader del Señor, mi negocio es la Sabiduría,"