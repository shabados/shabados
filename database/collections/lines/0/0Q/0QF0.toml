[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਨਾਮੁ ਰਿਦੈ; ਸੋ ਵੇਪਰਵਾਹਾ ॥"
page = 1156
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Care-free is he, within whose mind the Name is."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਛੰਦਗੀ-ਰਹਿਤ ਹੈ ਉਹ, ਜਿਸ ਦੇ ਮਨ ਅੰਦਰ ਨਾਮ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who keeps the Naam in his heart is carefree and independent."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਰਿਦੇ ਮੇਂ ਨਾਮੁ ਹੈ, ਸੋ ਪੁਰਸ ਬੇਪਰਵਾਹ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਆ ਵੱਸਦਾ ਹੈ, ਉਹ ਬੇ-ਮੁਥਾਜ ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien en su corazón deja que habite el Naam, el Nombre del Señor, vive sin preocupación."