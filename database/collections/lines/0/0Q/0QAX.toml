[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਭ ਦੇਖਤ ਦਿਨ ਕਾਢਿਯੋ; ਨ੍ਰਿਪਹਿ ਮਠਾਈ ਖ੍ਵਾਇ ॥੨੦॥"
page = 915

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And she accomplished this just by making Raja to eat some sweetments.(20)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਜੇ ਨੂੰ ਮਠਿਆਈ ਖਵਾ ਕੇ ਸਾਰਿਆਂ ਦੇ ਵੇਖਦਿਆਂ ਦਿਨ ਦਿਹਾੜੇ ਕਢ ਦਿੱਤਾ ॥੨੦॥"