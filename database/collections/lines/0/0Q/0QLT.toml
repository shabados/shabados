[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਘਾਇ ਲਗੇ ਇਕ ਘੂਮਤ ਘਾਇਲ; ਸ੍ਰਉਨ ਸੋ ਏਕ ਫਿਰੈ ਚੁਚਵਾਤੇ ॥"
page = 472

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Someone is wounded and swinging and the blood is oozing out from the body of someone"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜ਼ਖ਼ਮ ਲਗਣ ਨਾਲ ਕਈ ਘਾਇਲ (ਸੂਰਮੇ) ਘੁੰਮੇਰੀਆਂ ਖਾ ਰਹੇ ਹਨ ਅਤੇ ਕਈਆਂ ਦੇ ਲਹੂ ਟਪਕ ਰਿਹਾ ਹੈ।"