[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤ੍ਰਸੇ ਤੇਜ ਤਤੇ ॥"
page = 175

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All being absorbed and dyed with the dye of war, feared the glory of others."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਦੂਜਿਆਂ ਦੇ) ਤੀਬਰ ਤੇਜ ਤੋਂ ਡਰ ਰਹੇ ਸਨ।"