[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਤਨ ਪ੍ਰਮੁਦ ਕਰ ਬਚਨ; ਚੀਨਿ ਤਾ ਮੈ ਗਚੌ ॥"
page = 74

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I shall find and set the delight-giving gem-like words."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਸੰਨ ਕਰਨ ਵਾਲੇ ਰਤਨਾਂ ਦੇ ਤੁਲ ਬਚਨਾਂ ਨੂੰ ਚੁਣ ਕੇ ਉਸ ਵਿਚ ਜੜ੍ਹਾਂ।"