[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰੰਕਾਰਿ; ਜੋ ਰਹੈ ਸਮਾਇ ॥"
page = 953
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who remains absorbed in the formless Lord;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਰੂਪ ਰਹਿਤ ਸੁਆਮੀ ਅੰਦਰ ਲੀਨ ਹੋਇਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who remains absorbed in the Formless Lord"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ (ਨਿਰੰਕਾਰਿ) ਪ੍ਰਮਾਤਮਾ ਮੇਂ ਸਮਾਇ ਰਹੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਇਕ ਨਿਰੰਕਾਰ ਵਿਚ ਜੁੜਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰੰਕਾਰਿ = ਨਿਰੰਕਾਰ ਵਿਚ।॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "quien permanece absorto en el Señor sin Forma,"