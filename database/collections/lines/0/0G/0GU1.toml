[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਦੀਪ; ਪਤਨ ਪਤੰਗ ॥"
page = 838
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the moth falls on the lamp,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਪਰਵਾਨਾ ਦੀਵੇ ਉਤੇ ਡਿੱਗਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As the moth falls into the lamp,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਪਤੰਗ ਦੀਪਕ ਮੇਂ ਪਰੀਤੀ ਕਰ (ਪਤਨ) ਪੜਤਾ ਹੈ ਵਾ (ਪਤਨ) ਨਸਟ ਹੋ ਜਾਤਾ ਹੈ, ਤਦਪ ਪੀਛੇ ਮੁੜਤਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ (ਪ੍ਰੇਮ ਦੇ ਬੱਝੇ) ਭੰਬਟ ਦੀਵੇ ਉਤੇ ਡਿੱਗਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੀਪ = ਦੀਵਾ। ਪਤਨ = ਡਿੱਗਣਾ {पत् = to fall}। ਪਤੰਗ = ਭੰਬਟ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como la palomilla se dirige y se funde con la llama,"