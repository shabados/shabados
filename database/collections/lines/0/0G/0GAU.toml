[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰਿ ਬਾਹਰਿ ਭਗਤੀ ਰਾਤੇ; ਸਚਿ ਨਾਮਿ ਲਿਵ ਲਾਗੀ ॥"
page = 570
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From within and without they are imbued with Lord's devotion and enshrine affection for the True Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਦਰੋਂ ਤੇ ਬਾਹਰੋਂ ਉਹ ਪ੍ਰਭੂ ਦੇ ਪ੍ਰੇਮ ਵਿੱਚ ਰੰਗੇ ਹੋਏ ਹਨ ਅਤੇ ਸਤਿਨਾਮ ਨਾਲ ਉਹ ਪ੍ਰੀਤ ਗੰਢਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Inwardly and outwardly, they are imbued with devotion, and they enshrine love for the True Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਅੰਤਰਿ ਬਾਹਰਿ ਸੇ, ਭਾਵ ਮਨ ਤਨ ਕਰ ਕੇ ਭਗਤੀ ਮੇਂ ਮਸਤ ਹੈਂ ਔਰ ਤਿਨ ਕੀ ਇਸ ਪ੍ਰਕਾਰ ਸਚੇ ਨਾਮ ਮੇਂ ਲਿਵ ਲਾਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਦੁਨੀਆ ਨਾਲ ਕਾਰ-ਵਿਹਾਰ ਕਰਦੇ ਹੋਏ ਵੀ ਅੰਤਰ-ਆਤਮੇ ਭਗਤੀ-ਰੰਗ ਨਾਲ ਰੰਗੇ ਰਹਿੰਦੇ ਹਨ ਤੇ ਸਦਾ-ਥਿਰ ਹਰਿ-ਨਾਮ ਵਿਚ ਉਹਨਾਂ ਦੀ ਲਗਨ ਲੱਗੀ ਰਹਿੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਤਰਿ = ਹਿਰਦੇ ਵਿਚ। ਬਾਹਰਿ = ਦੁਨੀਆ ਨਾਲ ਕਾਰ-ਵਿਹਾਰ ਕਰਦਿਆਂ। ਲਿਵ = ਲਗਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Afortunados son aquéllos que Lo conocen; están impregnados de Devoción interna y externamente,"