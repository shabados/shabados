[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁੰਨਹੁ; ਰਾਤਿ ਦਿਨਸੁ ਦੁਇ ਕੀਏ ॥"
page = 1037
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From His absolute-self, He has made both the night and day."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਨਿਰਗੁਣ ਵਿਅਕਤੀ ਤੋਂ ਉਸ ਨੇ ਦੌਵੇਂ ਰਾਤ ਅਤੇ ਦਿਨ ਬਣਾਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "From this Primal Void, He made both night and day;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁੰਨ ਥੀਂ ਹੀ ਰਾਤ ਦਿਨ ਦੋਨੋਂ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਿਰੋਲ ਆਪਣੇ ਆਪੇ ਤੋਂ ਹੀ ਪਰਮਾਤਮਾ ਨੇ ਦੋਵੇਂ ਦਿਨ ਤੇ ਰਾਤ ਬਣਾ ਦਿੱਤੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਇ = ਦੋਵੇਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, de Su Ser Absoluto, vino la noche y el día,"