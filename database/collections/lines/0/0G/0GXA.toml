assets = ["DGDG"]
type = "primary"
data = "ਤੇ ਤੇ ਲੋਕ ਲਾਜ ਤਜਿ ਨਾਚੇ ॥"
page = 157

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They forsake their shyness and dance in ecstasy"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰੇ ਲੋਕ ਲਾਜ ਤੋਂ ਉੱਚੇ ਉਠ ਕੇ (ਬ੍ਰਹਮ ਆਨੰਦ ਵਿਚ) ਝੂਮ ਰਹੇ ਹਨ।"