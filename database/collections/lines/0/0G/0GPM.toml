[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋਰੁ ਨ ਸੁਰਤੀ; ਗਿਆਨਿ ਵੀਚਾਰਿ ॥"
page = 7
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have no power to gain understanding of Divine Knowledge and Lord's meditation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਕੋਲਿ ਸਮਝ ਈਸ਼ਵਰੀ ਗਿਆਤ ਅਤੇ ਸਾਹਿਬ ਦਾ ਸਿਮਰਨ ਪਰਾਪਤ ਕਰਨ ਦੀ ਕੋਈ ਤਾਕਤ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No power to gain intuitive understanding, spiritual wisdom and meditation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੁਤੀ ਵੇਦ ਕਾ ਪਠਨਾ ਔਰੁ ਗ੍ਯਾਨ ਕਾ ਵਿਚਾਰੁ ਕਰਨਾ, ਇਸ ਮੇ ਭੀ ਬਲੁ ਨਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਤਮਾਕ ਜਾਗ ਵਿਚ, ਗਿਆਨ ਵਿਚ ਅਤੇ ਵਿਚਾਰ ਵਿਚ ਰਹਿਣ ਦੀ ਭੀ ਸਾਡੀ ਸਮਰਥਾ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਰਤੀ = ਸੁਰਤ ਵਿਚ, ਆਤਮਕ ਜਾਗ ਵਿਚ। ਗਿਆਨਿ = ਗਿਆਨ (ਪ੍ਰਾਪਤ ਕਰਨ) ਵਿਚ। ਵੀਚਾਰਿ = ਵੀਚਾਰ (ਕਰਨ) ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin poder para despertar mi Alma hacia Ti,"