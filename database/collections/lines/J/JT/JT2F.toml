[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਾਈ ਰੇ; ਹਰਿ ਹੀਰਾ. ਗੁਰ ਮਾਹਿ ॥"
page = 22
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Brother! God, the jewel, resides in the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਵੀਰ! ਵਾਹਿਗੁਰੂ ਜਵੇਹਰ ਗੁਰਾਂ ਅੰਦਰ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Siblings of Destiny, the Diamond of the Lord is within the Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹਰੀ ਰੂਪੁ ਹੀਰਾ ਗੁਰੂ ਰਿਦੇ ਕੇ (ਮਾਂਹਿ) ਬੀਚ ਹੀ ਦਿਖਾਇ ਦੇਤੇ ਹੈਂ, ਪਰੰਤੂ ਹਰੀ ਰੂਪੁ ਹੀਰੇ ਕੌ ਤਬ ਪਾਈਐ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਇਹ ਕੀਮਤੀ ਹਰਿ-ਨਾਮ ਗੁਰੂ ਦੇ ਕੋਲ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਮਾਹਿ = ਗੁਰੂ ਵਿਚ, ਗੁਰੂ ਦੇ ਕੋਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hermano, Dios, la Joya, reside en el Guru. En la Saad Sangat, la Sociedad de los Santos,"