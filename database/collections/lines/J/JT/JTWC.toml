[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਮੁ ਮੰਜਾਰੁ; ਕਹਾ ਕਰੈ ਮੋਰ ॥੨॥"
page = 323
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What can the cat of death do unto me?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੌਤ ਦਾ ਬਿੱਲਾ ਮੇਰਾ ਕੀ ਕਰ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So what can the cat of death do to me? ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਜਮ ਰੂਪੀ ਬਿਲਾ ਮੇਰੇ ਕੋ ਕਿਆ ਕਰ ਸਕਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇਰੇ ਆਸਰੇ ਰਿਹਾਂ) ਜਮ-ਰੂਪ ਬਿੱਲਾ ਮੇਰਾ ਕੀਹ ਵਿਗਾੜ ਸਕਦਾ ਹੈ? ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਜਾਰੁ = ਬਿੱਲਾ। ਕਹਾ ਕਰੈ = ਕੀਹ ਕਰ ਸਕਦਾ ਹੈ? ਕੀਹ ਵਿਗਾੜ ਸਕਦਾ ਹੈ? ਮੋਰ = ਮੇਰਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ahí, siendo Tuyo, estoy a salvo del gato de Yama, el mensajero de la muerte. (2)"