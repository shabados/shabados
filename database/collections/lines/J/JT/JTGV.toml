[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਵਨ ਮੂਲ ਤੇ; ਕਵਨ ਦ੍ਰਿਸਟਾਨੀ ॥"
page = 266
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What thy origin is and what thou lookest like."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਕੀ ਮੁੱਢ ਹੈ ਅਤੇ ਤੂੰ ਕੇਹੋ ਜੇਹਾ ਦਿਸਦਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "what is your origin, and what is your appearance?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ (ਕਵਨ ਮੂਲ ਤੇ) ਕਿਆ ਮਾਤਾ ਪਿਤਾ ਕੇ ਰਕਤ ਬੀਰਜ ਤੁਛ ਵਸਤੂ ਸੇ ਇਹੁ ਕਿਆ ਸੁੰਦਰ ਦੇਹੀ ਰਚ ਕਰ ਤੁਝ ਕੋ ਦਿਖਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਵੇਖ) ਕਿਸ ਮੁੱਢ ਤੋਂ (ਤੈਨੂੰ) ਕੇਹਾ (ਸੋਹਣਾ ਬਣਾ ਕੇ ਉਸ ਨੇ) ਵਿਖਾਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦ੍ਰਿਸਟਾਨੀ = ਵਿਖਾ ਦਿੱਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien de la nada te hizo surgir en toda tu complejidad y belleza."