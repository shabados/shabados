data = "ਬਾਈਸਵੋ ਅਰਜੁਨ ਅਵਤਾਰਾ ॥੭॥"
page = 552

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "What should I think of the long story? I say only this that Arjuna was the twenty-second incarnation.7."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਬਸ) ਅਰਜਨ ਬਾਈਵਾਂ ਅਵਤਾਰ ਹੋਇਆ ॥੭॥"