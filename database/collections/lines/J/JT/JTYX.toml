[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੀ ਦਰਗਹਿ; ਪਾਈਐ ਮਾਨੁ ॥"
page = 1271
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and he attains honour, in the True Court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਹ ਸੱਚੇ ਦਰਬਾਰ ਵਿੱਚ ਇਜ਼ਤ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Honor is obtained in the True Court of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚੀ ਦਰਗਾਹ ਮੇਂ ਮਾਨੁ ਪਾਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੀ ਰੱਬੀ ਦਰਗਾਹ ਵਿਚ ਆਦਰ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚੀ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੀ। ਮਾਨੁ = ਆਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y el Honor es obtenido en la Corte Verdadera del Señor."