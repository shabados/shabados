[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹਰਿ ਦਰ ਰਾਗ ਅਲਾਪਿਯਤ; ਘਰ ਘਰ ਬਜਤ ਮੁਚੰਗ ॥੧੦॥"
page = 847

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The harmonies were flowing at every door-step and music was report in all the households.(10)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹਰ ਘਰ ਦੇ ਦੁਆਰ ਉਤੇ ਰਾਗ ਅਲਾਪਿਆ ਜਾ ਰਿਹਾ ਹੈ ਅਤੇ ਘਰ ਘਰ ਵਿਚ ਮਧੁਰ ਆਵਾਜ਼ ਵਾਲੇ ਵਾਜੇ ਵਜ ਰਹੇ ਹਨ ॥੧੦॥"