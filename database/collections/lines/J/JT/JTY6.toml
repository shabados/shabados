[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਣੇ ਦਾਸ ਕਉ; ਨਦਰਿ ਨਿਹਾਲਿ ॥"
page = 1183
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "behold Thou Thy slave with Thy eye of grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੇ ਗੋਲੇ ਨੂੰ ਆਪਣੀ ਮਿਹਰ ਤੀ ਅੱਖ ਨਾਲ ਤੱਕ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "please bless Your slave with Your Glance of Grace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਦਾਸੋਂ ਕੋ ਕ੍ਰਿਪਾ ਨਜਰ ਸੇ ਦੇਖ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਦਾਸ ਨੂੰ ਮਿਹਰ ਦੀ ਨਿਗਾਹ ਨਾਲ ਵੇਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਨਦਰਿ = ਮਿਹਰ ਦੀ ਨਿਗਾਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "bendíceme también con Tu Mirada de Gracia."