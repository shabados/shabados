[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਧਸੰਗਤਿ, ਸਤਿਗੁਰ ਸਰਣਾਈ ॥੧੩॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In fact, going to the holy congregation is the same as going to the shelter of the true Guru."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਤਿਸੰਗਤ ਦੀ ਸ਼ਰਨ (ਆਉਣਾ) ਸਤਿਗੁਰੂ ਦੀ ਸ਼ਰਨ (ਆਉਂਣਾ ਹੈ)।"