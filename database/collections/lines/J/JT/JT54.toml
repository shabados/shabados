data = "ਸਭ ਸ੍ਰੀ ਨਾਮ ਤੁਪਕ ਕੇ ਜਾਨੋ ॥੮੬੦॥"
page = 765

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly “Jagteshvarni”, then add “Jaachar-nayak-shatru” and know all the names of Tupak.860."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਨੂੰ ਸਭ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝੋ ॥੮੬੦॥"