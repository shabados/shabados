[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈਸੇ ਬਾਰਿਕ; ਮੁਖਹਿ ਖੀਰ ॥੧॥"
page = 987
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the child is satiated by oozing milk in the mouth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰਾਂ ਮੂੰਹ ਵਿੱਚ ਦੁਧ ਚੋਣ ਨਾਲ ਬੱਚਾ ਤ੍ਰਿਪਤ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It is like milk poured into the baby's mouth. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਬਾਰਕ ਭੂਖੇ ਕੋ ਮੁਖ ਮੇਂ ਦੂਧ ਮਿਲ ਜਾਇ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ (ਭੁੱਖ ਨਾਲ ਵਿਲਕ ਰਹੇ) ਬੱਚੇ ਦੇ ਮੂੰਹ ਵਿਚ ਦੁੱਧ ਪੈ ਜਾਏ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਖਹਿ = ਮੂੰਹ ਵਿਚ। ਖੀਰ = ਦੁੱਧ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "como la leche que llega a la boca del bebé. (1)"