[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤਹੁ. ਤਿਸੁ ਬਿਨੁ; ਅਵਰੁ ਨ ਕੋਈ ॥"
page = 626
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O saints, without Him, there is not any other."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਧੂਓ! ਉਸ ਦੇ ਬਗੈਰ ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Saints, without Him, there is no other at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤੋ! ਹਮਾਰਾ ਤਿਸ ਵਾਹਿਗੁਰੂ ਸੇ ਬਿਨਾਂ ਔਰ ਰਖਿ੍ਯਕ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! ਉਸ ਪਰਮਾਤਮਾ ਤੋਂ ਬਿਨਾ (ਜੀਵਾਂ ਦਾ) ਕੋਈ ਹੋਰ (ਰਾਖਾ) ਨਹੀਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸੁ ਬਿਨੁ = ਉਸ ਪਰਮਾਤਮਾ ਤੋਂ ਬਿਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Santos, sin Él no hay nadie más,"