[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਤਨ ਕੀ ਸਭ ਮਿਟੈ ਬਲਾਇ ॥"
page = 867
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the calamity of thy mind and body shall be eradicated,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਆਤਮਾ ਅਤੇ ਦੇਹ ਦੀ ਸਾਰੀ ਮੁਸੀਬਤ ਨਾਸ ਹੋ ਜਾਵੇਗੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All the misfortunes of your mind and body shall be taken away,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਮਨ ਤਨ ਕੀ (ਬਲਾਇ) ਆਸਾ ਤ੍ਰਿਸਨਾ ਮਿਟ ਜਾਵੈਗੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮਿੱਤਰ! ਨਾਮ ਜਪਿਆਂ) ਮਨ ਦੀ ਸਰੀਰ ਦੀ ਹਰੇਕ ਬਿਪਤਾ ਮਿਟ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਟੈ = ਮਿਟ ਜਾਂਦੀ ਹੈ। ਬਲਾਇ = ਬਿਪਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "todos los males de tu mente y de tu cuerpo desaparecerán"