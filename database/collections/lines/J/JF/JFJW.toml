[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਸਟ ਧਾਤੁ ਇਕ ਧਾਤੁ ਹੋਇ; ਪਾਰਸ ਪਰਸੈ ਕੰਚਨੁ ਸੋਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "With the touch of the philosopher's stone (paras) all the mixed light metals are transformed into gold."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਾਰਸ ਦੇ ਪਰਸਿਆਂ ਅੱਠੇ ਧਾਤਾਂ (ਉਹੋ ਸੋਨਾ-) ਇਕ ਧਾਤ ਬਣ ਜਾਂਦੀਆਂ ਹਨ।"