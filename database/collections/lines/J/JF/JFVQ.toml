[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਥਾ ਸਕਤ ਤਬ ਧਰਮ ਚਲਾਯੋ ॥"
page = 60

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When I obtained the position of responsibility, I performed the religious acts to the best of my ability."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ (ਅਸਾਂ) ਆਪਣੀ ਵਿਤ ਅਨੁਸਾਰ ਧਰਮ ਦਾ ਪ੍ਰਚਲਨ ਕੀਤਾ।"