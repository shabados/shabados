[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਧਸੰਗਤਿ ਗੁਰ ਸਬਦ ਵਿਣੁ; ਲਖ ਚਉਰਾਸੀਹ ਜੂਨਿ ਭਵਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Without holy congregation and bereft of Guru-word he transmigrates into infinite species of life."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਤੇ ਗੁਰ ਸ਼ਬਦ ਬਾਝ ਚੌਰਾਸੀ ਲੱਖ ਜੂਨਾਂ ਵਿਚ ਪਿਆ ਭਟਕਦਾ ਹੈ।"