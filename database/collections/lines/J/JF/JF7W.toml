[[content]]
assets = ["SSKS"]
type = "primary"
data = "ਨਾਦ ਬਾਦ ਬਿਸਮਾਦ ਰਾਗ ਰਾਗਨਿ ਗੁਨ ਗਾਵਹਿ ॥"

[[content]]
assets = ["SSPK"]
type = "translation"
language = "en"
data = "They along with minstrels of heaven sing his praises to the accompaniment of musical instruments producing ecstatic music."

[[content]]
assets = ["SSSK"]
type = "translation"
language = "pa"
data = "ਨਾਦ ਅਰੁ ਬਾਦ ਬਾਜੇ ਸਾਜ ਆਦਿ ਵਲੋਂ ਬਿਸਮਾਦ ਹਰਾਨ ਹੋ ਕੇ ਛੀਏ ਹੀ ਰਾਗ ਆਪੋ ਆਪਣੀਆਂ ਰਾਗਨੀਆਂ ਸਮੇਤ ਗੁਰੂ ਮਹਾਰਾਜ ਦੇ ਗੁਣਾਂ ਦਾ ਗਾਯਨ ਕਰਦੇ ਰਹਿੰਦੇ ਹਨ।"