[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਣ ਕਮਲ ਸਿਉ; ਲਾਗੋ ਮਾਨੁ ॥"
page = 376
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With the Lord's lotus feet my mind is attached."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਕੰਵਲ ਪੈਰਾਂ ਨਾਲ ਮੇਰਾ ਮਨ ਜੁੜਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind is attached to the Lord's Lotus Feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਮਨ ਚਰਨ ਕਮਲ ਮੇਂ ਲਗ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਉਸ ਮਨੁੱਖ ਦਾ ਮਨ ਪਰਮਾਤਮਾ ਦੇ ਸੋਹਣੇ ਚਰਨਾਂ ਨਾਲ ਜੁੜ ਗਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਉ = ਨਾਲ। ਮਾਨੁ = ਮਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando mi mente se entona en los Pies de Loto del Señor,"