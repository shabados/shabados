[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਿ ਰਵਿਦਾਸ; ਸਰਨਿ ਪ੍ਰਭ ਤੇਰੀ ॥"
page = 793
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Ravidas, I have sought Thy protection, O Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਵਿਦਾਸ ਜੀ ਆਖਦੇ ਹਨ, ਹੇ ਸੁਆਮੀ! ਮੈਂ ਤੇਰੀ ਪਨਾਹ ਲਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Ravi Daas, I seek Your Sanctuary, God;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਵਿਦਾਸ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਪ੍ਰਭੂ! ਤੇਰੀ ਸਰਨ ਲਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਵਿਦਾਸ ਆਖਦਾ ਹੈ-ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਤੇਰੀ ਸ਼ਰਨ ਆਇਆ ਹਾਂ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Ravidas, oh Dios, busco Tu Refugio;"