[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੂ ਬਿਨਾ; ਮੈ. ਨਾਹੀ ਹੋਰੁ ॥੨॥"
page = 864
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Guru, I have not another."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਬਗੈਰ ਮੋਰਾ ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Guru, I have no other at all. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਗੁਰੋਂ ਸੇ ਬਿਨਾ ਮੇਰਾ ਔਰ ਆਸਰਾ ਨਹੀਂ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਤੋਂ ਬਿਨਾ ਮੈਨੂੰ ਕੋਈ ਹੋਰ ਆਸਰਾ ਨਹੀਂ ਸੁੱਝਦਾ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੋਰੁ = ਹੋਰ ਥਾਂ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y no tengo a nadie en quien apoyarme más que en Él. (2)"