[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੋਗ ਕਰੋਗੀ ਜੋਗ ਤਜਿ; ਅਧਿਕ ਰਿਝੈਹੋ ਤੋਹਿ ॥੧੬॥"
page = 816

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘I will abandon the Yogi and make passionate love with you.’(16)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਜੋਗੀ ਨੂੰ ਤਿਆਗ ਕੇ (ਤੇਰੇ ਨਾਲ) ਭੋਗ-ਵਿਲਾਸ ਕਰਾਂਗੀ ਅਤੇ ਤੈਨੂੰ ਬਹੁਤ ਰਿਝਾਵਾਂਗੀ ॥੧੬॥"