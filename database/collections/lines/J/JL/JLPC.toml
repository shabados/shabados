[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੁਧ ਭਯੋ ਤਿਹ ਠਉਰ ਬਡੋ; ਚਢਿ ਕੈ ਸਭ ਦੇਵ ਬਿਵਾਨਨਿ ਆਏ ॥"
page = 411

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "A dreadful war was fought"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਥਾਂ ਉਤੇ ਬਹੁਤ ਭਾਰਾ ਯੁੱਧ ਹੋਇਆ, ਸਾਰੇ ਦੇਵਤੇ (ਯੁੱਧ ਵੇਖਣ ਲਈ) ਬਿਮਾਨਾਂ ਉਤੇ ਚੜ੍ਹ ਆਏ।"