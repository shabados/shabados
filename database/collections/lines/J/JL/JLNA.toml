[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਿਹ ਸਤੂਆ ਕੀ ਕਰੀ ਬਨਾਯੋ ॥੩॥"
page = 918

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Taking her clothes off, she made love with him and, then, (on reaching home) she cooked barley-meal.(3)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਥੇ ਮਾਲੀ ਦੇ ਸਾਥੀਆਂ ਨੇ ਪੋਟਲੀ ਨਾਲੋਂ) ਉਹ ਸਤੂ (ਖੋਲ੍ਹ ਕੇ) ਹਾਥੀ ('ਕਰੀ') ਬਣਾ ਦਿੱਤਾ ॥੩॥"