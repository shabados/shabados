[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦਾ ਧਰਮੁ; ਜਾ ਕੈ ਦੀਬਾਣਿ ॥"
page = 987
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, in whose court justice is ever administered;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ, ਜਿਸ ਦੇ ਦਰਬਾਰ ਵਿੱਚ ਹਮੇਸ਼ਾਂ ਨਿਆਂ ਹੀ ਹੁੰਦਾ ਹੈ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Righteous justice is dispensed in His Court forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਕਚੈਹਰੀ ਮੇਂ ਵਾ ਜਿਸ ਕੇ ਆਸ੍ਰੇ ਮੇਂ ਸਦਾ ਹੀ ਧਰਮ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਕਚਹਿਰੀ ਵਿਚ ਸਦਾ ਨਿਆਂ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਰਮੁ = ਇਨਸਾਫ਼। ਜਾ ਕੈ ਦੀਬਾਣਿ = ਜਿਸ ਦੀ ਕਚਹਿਰੀ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo en Su Corte se practica la Rectitud"