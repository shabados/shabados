[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਮੈਣ ਉਸ ਪਿਆਰੇ ਦਾ ਦੀਵਾਨਾ ਹਾਣ, ਜੋ ਮੇਰਾ ਮਤਵਾਲਾ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਆਸ਼ੁਫ਼ਤਾਇ ਆਨੇਮ ਕਿ ਆਸ਼ੁਫ਼ਤਾਇ ਮਾ ਹਸਤ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "But this world keeps wandering and straying in all directions to find out as to where He is. (240)"