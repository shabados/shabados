[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਜਿ; ਆਨ ਕਤਹਿ. ਨ ਜਾਹਿ ॥੧॥"
page = 837
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Leaving them I go no where else,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਨੂੰ ਛੱਡ ਕੇ, ਮੈਂ ਹੋਰ ਕਿਧਰੇ ਨਹੀਂ ਜਾਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If I were to abandon Them, there is nowhere else I could go. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਤਿਨ ਕੋ ਤਿਆਗ ਕਰ ਮੇਰਾ ਮਨ ਔਰ ਕਹੀਂ ਨਹੀਂ ਜਾਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹ ਮਨੁੱਖ ਪ੍ਰਭੂ ਦਾ ਦਰ) ਛੱਡ ਕੇ ਕਿਸੇ ਭੀ ਹੋਰ ਥਾਂ ਨਹੀਂ ਜਾਂਦੇ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਨ ਕਤਹਿ = ਕਿਸੇ ਭੀ ਹੋਰ ਥਾਂ। ਜਾਹਿ = ਜਾਹਿਂ, ਜਾਂਦੇ {ਬਹੁ-ਵਚਨ} ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "voy sólo hacia Él y hacia nadie más.  (1)"