[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਵਤ ਥੋ ਰਥ ਬੀਚ ਚੜਿਯੋ; ਚਲਿ ਕੈ ਤਿਹ ਠਉਰ ਬਿਖੈ ਸੋਊ ਆਈ ॥"
page = 377

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The direction in which the chariot was going, all of them gathered there,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਥ ਵਿਚ ਚੜ੍ਹ ਕੇ (ਜਿਸ ਪਾਸਿਓਂ) ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਆ ਰਿਹਾ ਸੀ, ਉਹ (ਇਸਤਰੀਆਂ) ਚਲ ਕੇ ਉਸ ਸਥਾਨ ਤੇ ਪਹੁੰਚ ਗਈਆਂ।"