[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਨੋ. ਤੂ ਸੰਤੁਸਟੁ; ਕਲਮਲ ਤਿਸੁ ਖਈ ॥"
page = 961
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, with whom Thou art pleased, O Lord; his sins are effaced."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੀਹਦੇ ਨਾਲ ਤੂੰ ਪ੍ਰਸੰਨ ਹੈਂ, ਹੇ ਸਾਈਂ! ਉਸਦੇ ਪਾਪ ਕੱਟੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sins are erased, when You are thoroughly pleased."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਤੁਮ ਪ੍ਰਸੰਨ ਹੂਏ ਹੋ ਤਿਸ ਕੇ ਪਾਪੋਂ ਕੀ ਸਮਗ੍ਰੀ ਨਸ਼ਟ ਹੂਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਉਤੇ ਤੂੰ ਖ਼ੁਸ਼ ਹੋ ਜਾਏਂ ਉਸ ਦੇ ਸਾਰੇ ਪਾਪ ਮੁੱਕ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤੁਸਟੁ = ਪ੍ਰਸੰਨ। ਕਲਮਲ = ਪਾਪ। ਖਈ = ਨਾਸ ਹੋ ਗਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél a quien Tú bendices, es purgado de todos sus errores."