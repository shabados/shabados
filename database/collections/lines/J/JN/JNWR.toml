[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਹਤ ਨਾਰਿ ਨਿਹੁਰਾਇ ਕਰਿ; ਨਿਜ ਘਟਿ ਰੂਪ ਬਿਚਾਰਿ ॥੩॥"
page = 971

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Always looked towards her to correlate their beauty.(3)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੇ ਰੂਪ ਨੂੰ ਘਟ ਸਮਝ ਕੇ ਗਰਦਨ ਝੁਕਾ ਦਿੰਦੀਆਂ ਸਨ ॥੩॥"