[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਚਛ ਤਾ ਕੋ ਰਹੈ; ਬਿਰਧਿ ਆਪੁ ਤ੍ਰਿਯ ਜ੍ਵਾਨ ॥"
page = 815

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He was blind of one eye and much older in age than his wife."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਆਦਮੀ ਦੀ ਇਕ ਅੱਖ ਸੀ ਅਤੇ ਉਹ ਬੁੱਢਾ ਸੀ ਅਤੇ ਇਸਤਰੀ ਜਵਾਨ ਸੀ।"