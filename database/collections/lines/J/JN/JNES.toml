[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਰਉਪਕਾਰੀ, ਮਿਲਨਿ ਹਸੰਦੇ ॥੧੪॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The altruist Sikhs always come up smiling."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਰਉਪਕਾਰੀ ਲੋਕ ਸਦਾ ਖਿੜੇ ਮੱਥੇ ਮਿਲਦੇ ਹਨ।"