[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾਲਕੇਤੁ ਲਾਗਲਿ ਉਚਰਿ; ਕ੍ਰਿਸਨਾਗ੍ਰਜ ਪਦ ਦੇਹੁ ॥"
page = 723

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Uttering the words “Taalketu, Langali”, then adding Krishagraj"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਲਕੇਤੁ (ਤਾਲ ਬ੍ਰਿਛ ਦੇ ਚਿੰਨ੍ਹ ਵਾਲੇ ਝੰਡੇ ਵਾਲਾ, ਬਲਰਾਮ) ਲਾਗਲਿ (ਹਲ ਵਾਲਾ, ਬਲਰਾਮ) ਕ੍ਰਿਸ਼ਨਾਗ੍ਰਜ (ਸ਼ਬਦ ਪਹਿਲਾਂ) ਉਚਾਰ ਕੇ,"