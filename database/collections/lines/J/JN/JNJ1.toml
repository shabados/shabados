[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਜਨੁ ਆਇਆ; ਪ੍ਰਭ ਕੀ ਸਰਨਾ ॥"
page = 1150
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that man comes to the Lord's refuge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੁਰਸ਼ ਸਾਈਂ ਦੀ ਛਤ੍ਰਛਾਇਆ ਹੇਠ ਆਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "that humble being enters the Sanctuary of God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਪੁਰਸੁ ਪਰਮੇਸਰ ਕੀ ਸਰਨ ਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੀ ਸਰਨ ਵਿਚ ਆ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋ = ਉਹ {ਇਕ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo él llega hasta el Santuario de Dios,"