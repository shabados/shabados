[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਘੈ. ਘਾਲ ਸੇਵਕੁ ਜੇ ਘਾਲੈ; ਸਬਦਿ ਗੁਰੂ ਕੈ ਲਾਗਿ ਰਹੈ ॥"
page = 432
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Gh:-- The attendant who performs Guru's service remains attached to Guru's hymns."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਘ-ਟਹਿਲੂਆ, ਜਿਹੜਾ ਗੁਰਾਂ ਦੀ ਸੇਵਾ ਕਮਾਉਂਦਾ ਹੈ ਅਤੇ ਗੁਰਾਂ ਦੀ ਬਾਣੀ ਨਾਲ ਜੁੜਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Ghagha: The servant who performs service, remains attached to the Word of the Guru's Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੰਡਤ ਜੀ! ਘਘੇ ਅਖਰ ਨੇ ਏਹ ਕਹਾ ਹੈ: ਜੋ ਸੇਵਕ ਹੋ ਕਰ (ਘਾਲ) ਸੇਵਾ (ਘਾਲੈ) ਕਰੈ ਔਰ ਗੁਰ ਸਬਦ ਮੇਂ ਲਗਾ ਰਹੈ, ਕਿਆ ਬੀਚਾਰਤਾ ਰਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਮਨੁੱਖ ਸੇਵਕ (-ਸੁਭਾਉ) ਬਣ ਕੇ (ਸੇਵਕਾਂ ਵਾਲੀ) ਕਰੜੀ ਮੇਹਨਤ ਕਰੇ, ਜੇ ਆਪਣੀ ਸੁਰਤਿ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਵਿਚ ਜੋੜੀ ਰੱਖੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਾਲ ਘਾਲੈ = ਕਰੜੀ ਮਿਹਨਤ ਕਰੇ। ਸਬਦਿ = ਸ਼ਬਦ ਵਿਚ। ਲਾਗਿ ਰਹੈ = ਜੁੜਿਆ ਰਹੇ, ਆਪਣੀ ਸੁਰਤਿ ਟਿਕਾਈ ਰੱਖੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Gjaggja: El Sirviente del Guru está entonado en Su Palabra"