[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਸੰਕ ਤਿਆਗ ਨਿਰਸੰਕ; ਉਚਾਰਨ ਕੀਜੀਅਹਿ ॥੧੨੧੯॥"
page = 799

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the words “Durandar-Ishani”, add the words “Ishani mathani” and know all the names of Tupak, uttering them unhestitatingly.1219."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ੰਕਾ ਨੂੰ ਤਿਆਗ ਕੇ ਨਿਸੰਗ ਉਚਾਰਨ ਕਰੋ ॥੧੨੧੯॥"