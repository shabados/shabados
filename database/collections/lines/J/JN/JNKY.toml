[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈਸੇ ਸਿੰਬਲੁ ਦੇਖਿ; ਸੂਆ ਬਿਗਸਾਨਾ ॥"
page = 1165
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is like the parrot, who is pleased to see the tree of Bombax hepta phylum,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਉਸ ਤੋਤੇ ਵਰਗਾ ਹੈ, ਜੋ ਸਿੰਮਲ ਦੇ ਰੁਖ ਨੂੰ ਵੇਖ ਕੇ ਖੁਸ਼ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is like the parrot, who is pleased to see the simbal tree;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪ੍ਰਕਾਰ ਸਿੰਬਲ ਕੇ ਬ੍ਰਿਛ ਕੋ (ਸੂਆ) ਤੋਤਾ ਦੇਖ ਕਰ ਬਹੁਤ ਪ੍ਰਸੰਨ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਾਈ ਨਾਰ ਨੂੰ ਵੇਖ ਕੇ ਉਹ ਇਉਂ ਹੀ ਖ਼ੁਸ਼ ਹੁੰਦਾ ਹੈ) ਜਿਵੇਂ ਤੋਤਾ ਸਿੰਬਲ ਰੁੱਖ ਨੂੰ ਵੇਖ ਕੇ ਖ਼ੁਸ਼ ਹੁੰਦਾ ਹੈ (ਪਰ ਉਸ ਸਿੰਬਲ ਤੋਂ ਉਸ ਤੋਤੇ ਨੂੰ ਹਾਸਲ ਕੁਝ ਨਹੀਂ ਹੁੰਦਾ);"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੂਆ = ਤੋਤਾ। ਬਿਗਸਾਨਾ = ਖ਼ੁਸ਼ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es como el perico que está contento por un tiempo posado sobre el árbol de Simmal,"