data = "ਦ੍ਰਿਗ ਪਰ ਹਾਥ ਰਾਖਿ ਤ੍ਰਿਯ ਜਾਵੈ ॥੫॥"
page = 878

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "If the husband awoke, she would place her hand on his eyes.(5)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਇਸਤਰੀ ਉਸ ਦੀ ਅੱਖ ਉਤੇ ਹੱਥ ਧਰ ਦਿੰਦੀ ॥੫॥"