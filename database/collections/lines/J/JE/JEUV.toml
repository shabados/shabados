[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਸ਼ਸਤੰਦ ਸ਼ਬ ਰੰਗ ਜ਼ਰਰੀਂ ਕੁਲਾਹ ॥੮੦॥"
page = 1420

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The king was as dark as night, and that black-ruler had a golden cap on.(80)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਵਰਗੇ ਕਾਲੇ ਰੰਗ ਵਾਲਾ ਬਾਦਸ਼ਾਹ ਸੁਨਹਿਰੀ ਰੰਗ ਦਾ ਤਾਜ ਧਾਰਨ ਕੀਤੇ ਹੋਏ ਸੁਸ਼ੋਭਿਤ ਸੀ ॥੮੦॥"