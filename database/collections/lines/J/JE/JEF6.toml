[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕ ਆਪੇ ਗੁਰਮੁਖਿ ਕੀਤਿਅਨੁ; ਬੂਝਨਿ ਵੀਚਾਰਾ ॥"
page = 425
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some He Himself has consecrated and they understand and remember Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈਆਂ ਨੂੰ ਉਸ ਨੇ ਆਪੇ ਹੀ ਪਵਿੱਤਰ ਕੀਤਾ ਹੈ, ਅਤੇ ਉਹ ਸੁਆਮੀ ਨੂੰ ਸਮਝਦੇ ਅਤੇ ਸਿਮਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has sanctified those few Gurmukhs who understand Him, and reflect upon Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਕਨੋਂ ਕੋ ਆਪ ਹੀ ਗੁਰੋਂ ਕੇ ਸਨਮੁਖ ਕੀਆ ਹੈ ਅਰੁ ਵਿਚਾਰ ਕਰ ਤਿਸ ਹਰੀ ਕੋ ਵਹੁ ਬੂਝਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਈ ਮਨੁੱਖਾਂ ਨੂੰ ਪ੍ਰਭੂ ਨੇ ਆਪ ਹੀ ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿਣ ਵਾਲੇ ਬਣਾ ਦਿੱਤਾ ਉਹ (ਸਹੀ ਆਤਮਕ ਜੀਵਨ ਦੀ) ਵਿਚਾਰ ਸਮਝਣ ਲੱਗ ਪਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਕਿ = {ਲਫ਼ਜ਼ 'ਇਕ' ਤੋਂ ਬਹੁ-ਵਚਨ}। ਕੀਤੀਅਨੁ = ਉਸ ਨੇ ਕੀਤੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A algunos los despierta a su realidad y conocen y meditan en la Esencia."