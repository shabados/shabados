data = "ਮਹਾ ਰੁਦ੍ਰ ਕਉ ਰੁਦ੍ਰ ਲਖਿ; ਚਿੰਤ ਬਢੀ ਅਪ੍ਰਮਾਨ ॥੧॥"
page = 977

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing god Ruder in disturbing situation, he got worried.(1)"

[[content]]
