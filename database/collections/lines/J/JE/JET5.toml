data = "ਮਹਾ ਰੁਦ੍ਰ ਨੂੰ ਭਿਆਨਕ ਰੂਪ ਵਿਚ ਵੇਖ ਕੇ ਬਹੁਤ ਚਿੰਤਾ ਹੋਈ ॥੧॥"