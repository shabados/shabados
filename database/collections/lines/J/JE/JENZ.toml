[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਪਿ ਕਰਾਹੀ ਚਾਰਿ ਕੈ; ਲੀਨੇ ਬਰੇ ਪਕਾਇ ॥੮॥"
page = 849

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And herself, putting the saucepan on fire, commenced cooking.(8)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪ ਕੜਾਹੀ ਚੜ੍ਹਾ ਕੇ ਵੜੇ ਪਕਾ ਲਏ ॥੮॥"