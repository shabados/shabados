[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦ ਮੰਗਲ ਗੁਨ ਗਾਉ ਸਹਜ ਧੁਨਿ; ਨਿਹਚਲ ਰਾਜੁ ਕਮਾਉ ॥੧॥"
page = 678
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In blissful melody sing thou the praise of God, with gladness and glee and thus acquire an eternal empire."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ਾਂਤਮਈ ਰਾਗ ਅੰਦਰ ਤੂੰ ਖੁਸ਼ੀ ਅਤੇ ਮਲ੍ਹਾਰ ਨਾਲ ਵਾਹਿਗੁਰੂ ਦੀ ਕੀਰਤੀ ਗਾਇਨ ਕਰ, ਅਤੇ ਇਸ ਤਰ੍ਹਾਂ ਸਦੀਵੀ ਤੋਂ ਸਥਿਰ ਪਾਤਿਸ਼ਾਹੀ ਨੂੰ ਪ੍ਰਾਪਤ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In bliss and ecstasy, sing His Glorious Praises; by this celestial tune, you shall acquire your everlasting kingdom. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੰਦ ਮੰਗਲ ਰੂਪ ਵਾਹਿਗੁਰੂ ਕੇ ਗੁਣੋਂ ਕੋ ਸਾਂਤੀ ਪੂਰਬਕ ਗਾਇਨ ਕਰੋ ਔਰ ਗੁਰਿਆਈ ਕੇ ਤਖਤ ਪਰ ਇਸਥਿਤ ਹੋ ਕਰ ਅਚਲ ਰਾਜ ਕੋ ਕਮਾਵੋਗੇ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਜਿੰਦੇ! ਆਤਮਕ ਅਡੋਲਤਾ ਦੀ ਰੌ ਵਿਚ, ਆਨੰਦ ਖ਼ੁਸ਼ੀ ਪੈਦਾ ਕਰਨ ਵਾਲੇ ਹਰਿ-ਗੁਣ ਗਾਇਆ ਕਰ (ਇਸ ਤਰ੍ਹਾਂ ਕਾਮਾਦਿਕ ਵੈਰੀਆਂ ਉਤੇ) ਅਟੱਲ ਰਾਜ ਕਰ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਗਲ = ਖ਼ੁਸ਼ੀ। ਧੁਨਿ = ਰੌ। ਨਿਹਚਲ ਰਾਜੁ = ਅਟੱਲ ਹੁਕਮ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canta entonces las Alabanzas del Señor con toda Dicha y Equilibrio y vive eternamente en Éxtasis. (1)"