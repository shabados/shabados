[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੇ ਚਰਣ; ਵਸੇ ਮਨ ਮਾਹੀ ॥"
page = 107
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and the Guru's feet I have places within my mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੈਂ ਗੁਰਾਂ ਦੇ ਪੈਰ ਆਪਣੇ ਚਿੱਤ ਵਿੱਚ ਟਿਕਾ ਲਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the Guru's Feet have come to dwell within my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੇ ਰਿਦੇ ਮੇਂ ਗੁਰੂ ਕੇ ਚਰਨ ਵਸੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਮਨ ਵਿਚ ਗੁਰੂ ਦੇ ਚਰਣ ਵੱਸ ਪਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਹੀ = ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "yo fijo mi mente en los Pies del Guru."