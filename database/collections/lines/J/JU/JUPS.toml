[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਬਾ. ਹੋਰੁ ਪੈਨਣੁ; ਖੁਸੀ ਖੁਆਰੁ ॥"
page = 16
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Brother! the happiness of other raiments is ruinous."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਵੀਰ! ਹੋਰਨਾ ਬਸਤਰਾਂ ਦੀ ਪ੍ਰਸੰਨਤਾ ਤਬਾਹ ਕਰਨ ਵਾਲੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Baba, the pleasures of other clothes are false."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਿਤਾ ਜੀ! ਹੋਰੁ ਜੋ ਮਨ ਕੀ ਪ੍ਰਸੰਨਤਾ ਅਨੁਸਾਰ ਪਹਿਰਨਾ ਹੈ, ਸੋ ਖੁਆਰੁ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਇਹੋ ਜਿਹਾ ਪਹਿਨਣ ਦਾ ਸ਼ੌਂਕ ਤੇ ਚਾਉ ਖ਼ੁਆਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hermano, la felicidad de cualquier otra cosa es la ruina,"