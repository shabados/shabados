[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੀ ਆਗਿਆ; ਮਨ ਮਹਿ ਸਹੈ ॥"
page = 286
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "should heartily obey Guru's command."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਗੁਰਾਂ ਦਾ ਹੁਕਮ ਦਿਲੋਂ ਸਵੀਕਾਰ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "is to obey the Guru's Commands with all his mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਆਗ੍ਯਾ ਕੋ ਮਨ ਮੇਂ ਸਹਾਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਗੁਰੂ ਦਾ ਹੁਕਮ ਮਨ ਵਿਚ ਮੰਨਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹੈ = ਸਹਾਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "deberá acatar la voluntad y las disposiciones de su Maestro."