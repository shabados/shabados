[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੇਊ ਜੀਵਤ ਥੇ ਕਰਿ ਆਯੁਧ ਲੈ; ਅਰਰਾਇ ਪਰੇ ਬਰਬੀਰ ਘਨੇ ॥"
page = 428

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Who was alive and carrying weapons in his hands ,many warriors writhed"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ (ਦੈਂਤ) ਜੀਉਂਦੇ ਸਨ, ਹੱਥ ਵਿਚ ਸ਼ਸਤ੍ਰ ਲੈ ਕੇ (ਉਹ ਸਾਰੇ) ਸੂਰਮੇ ਅਰੜਾ ਕੇ (ਸ਼ਕਤਿ ਸਿੰਘ) ਉਪਰ ਆ ਪਏ।"