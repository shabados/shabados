data = "ਲਗੇ ਯਾ ਲਗੇ ਨਾ ਕਛੂ ਜਾਨਿ ਪਾਏ ॥੧੮॥"
page = 64

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Another three I discharged with my left hand, whether they struck anybody, I do not know. 18."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਤੀਰ (ਕਿਸੇ ਨੂੰ) ਲਗੇ ਜਾਂ ਨਾ ਲਗੇ, (ਇਸ ਬਾਰੇ) ਕੁਝ ਪਤਾ ਨਹੀਂ ॥੧੮॥"