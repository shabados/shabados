[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਗੜਦੀ ਇਕ ਲੈ ਚਲੈਂ ਇਕ ਕਹੁ ਇਕ ਉਚਕਹਿ ॥"
page = 241

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The weapons were struck and they rose high and then fell down."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕਨਾਂ ਯੋਧਿਆਂ ਨੂੰ ਇਕ ਯੋਧੇ ਲੈ ਚਲੇ ਹਨ ਅਤੇ ਇਕ ਉਛਲ ਰਹੇ ਹਨ।"