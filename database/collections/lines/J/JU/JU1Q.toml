[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਸਮਨੁ ਦੂਖੁ. ਨ ਆਵੈ ਨੇਰੇ ॥"
page = 1340
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Enemy and pain come not near him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵੈਰੀ ਅਤੇ ਪੀੜ ਉਸ ਦੇ ਲਾਗੇ ਨਹੀਂ ਲਗਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Enemies and pains do not even approach them."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਸਤ੍ਰੂ ਔ ਦੂਖ ਤਿਨੋਂ ਕੇ ਨਿਕਟ ਨਹੀਂ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਵੈਰੀ ਦੁੱਖ ਉਹਨਾਂ ਦੇ ਨੇੜੇ ਨਹੀਂ ਢੁਕ ਸਕਦਾ (ਉਹਨਾਂ ਉਤੇ ਆਪਣਾ ਦਬਾਉ ਨਹੀਂ ਪਾ ਸਕਦਾ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੇਰੇ = ਨੇੜੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "los enemigos y el dolor ni siquiera se les acercan,"