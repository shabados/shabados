[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਉਤਮੁ ਗੁਰਮੁਖਿ ਪੰਥੁ, ਆਪੁ ਗਵਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Moving on greatest path of the Guru orientated, the self has lost the ego."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਮਨੁੱਖਾ ਜਨਮ ਵਿਖੇ) ਗੁਰਮੁਖਾਂ ਦਾ ਪੰਥ ਉੱਤਮ ਹੈ, (ਕਿਉਂ ਜੋ) ਆਪਾ ਭਾਵ ਗਵਾ ਦਿਤਾ ਹੈ।"