[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਜਹੁ ਰਾਮੁ; ਏਕੁ ਹੀ ਦੇਵਾ ॥"
page = 484
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Worship only the one Lord God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਇਕ ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦੀ ਹੀ ਉਪਾਸ਼ਨਾ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Worship the One Divine Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹ (ਹੀ ਦੇਵਾ) ਪ੍ਰਕਾਸ਼ ਰੂਪ ਰਾਮ ਕੋ ਪੂਜੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੋ, ਇਕ ਪਰਮਾਤਮਾ ਦੇਵ ਦਾ ਭਜਨ ਕਰੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਵਾ = ਪ੍ਰਕਾਸ਼-ਰੂਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Alaba sólo al Único Señor, pues la Verdadera"