[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੰਨ ਪੜਾਇ; ਕਿਆ ਖਾਜੈ ਭੁਗਤਿ ॥"
page = 953
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What is the use of taking food by having the ears torn?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੰਨਾਂ ਨੂੰ ਪੜਵਾ ਕੇ ਟੁਕੱੜ ਖਾਣ ਦਾ ਕੀ ਲਾਭ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What is the use of piercing the ears, or begging for food?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਾਨ ਛਿਦਾਇ ਕੈ ਕਯਾ (ਭੁਗਤਿ) ਭੋਜਨ ਖਾਈਐ ੩?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੰਨ ਪੜਵਾ ਕੇ ਚੂਰਮਾ ਖਾਣ ਦਾ ਕੋਈ (ਆਤਮਕ) ਲਾਭ ਨਹੀਂ (ਕਿਉਂਕਿ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਆ ਖਾਜੈ = ਖਾਣ ਦਾ ਕੀਹ ਲਾਭ? ਭੁਗਤਿ = ਜੋਗੀਆਂ ਦਾ ਚੂਰਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Para qué mantenerse a costa de los sostenedores de hogar después de desgarrarse las orejas?"