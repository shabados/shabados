[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਖ ਉਘਾਰ ਲਖੈ ਕਹਾ ਮੁਨ; ਸਰਪ ਦੇਖ ਡਰਾਨ ॥"
page = 141

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "What did the sage see on opening his eyes? He was frightened to see the snake (around his neck)."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੁਨੀ ਨੇ ਅੱਖ ਉਘਾੜ ਕੇ ਵੇਖਿਆ ਅਤੇ ਸੱਪ ਨੂੰ ਵੇਖ ਕੇ ਡਰ ਗਿਆ।"