type = "primary"
data = "ਗੋਪਾਲੈ ਸੁ ਧਰਮੁ ਦੇ ਲਿਆਏ ॥੧੩॥"
page = 66

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I had sent Sangatia Singh there for making peace (among the chief), he brought Gopal on oath of God.13."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜੋ) ਗੁਪਾਲ ਨੂੰ ਧਰਮ-ਸਾਖੀ ਦੇ ਕੇ ਲੈ ਆਇਆ ॥੧੩॥"