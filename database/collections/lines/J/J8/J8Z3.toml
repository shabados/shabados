[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਆ ਖਾਧੈ; ਕਿਆ ਪੈਧੈ ਹੋਇ ॥"
page = 142
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What can be achieved by eating and what by dressing so long as that True Lord abides not in the man's mind?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖਾਣ ਦੁਆਰਾ ਅਤੇ ਪਹਿਨਣ ਦੁਆਰਾ ਕੀ ਬਣ ਸਕਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What good is food, and what good are clothes,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਦਾਰਥੋਂ ਕੇ ਖਾਣੇ ਸੇ ਕਿਆ ਹੋਤਾ ਹੈ ਔਰ ਬਸਤ੍ਰੋਂ ਕੇ ਪਹਰਨੇ ਸੇ ਕਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸੋਹਣੇ ਭੋਜਨ) ਖਾਣ ਤੇ (ਸੋਹਣੇ ਕਪੜੇ) ਹੰਢਾਣ ਦਾ ਕੀਹ ਸੁਆਦ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿De qué sirve la comida o la ropa fina,"