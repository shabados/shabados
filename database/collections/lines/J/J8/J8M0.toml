[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦਰਬ ਭਰੇ ਭੰਡਾਰ, ਗਣਤ ਗਣਾਵਣੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "That continuous counting goes on there (to avoid any deficiency)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਕਈ) ਮਾਯਾ ਦੇ ਭੰਡਾਰੇ ਭਰਕੇ ਗਿਣਤੀਆ ਹੀ ਗਿਣਾਉਂਦੇ ਰਹਿੰਦੇ ਹਨ।"