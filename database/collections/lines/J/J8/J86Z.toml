[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਰਿਧਿ ਸਿਧਿ; ਸਚੁ ਸੰਜਮੁ ਸੋਈ ॥"
page = 117
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "For the Guruward that True One is the wealth, miracle and self-mortification."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਸਮਰਪਣ ਲਈ ਉਹ ਸਤਿਪੁਰਖ ਹੀ ਧਨ ਸੰਪਦਾ, ਕਰਾਮਾਤ ਤੇ ਸਵੈ-ਰਿਆਜਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "To the Gurmukh, the True Lord is wealth, miraculous spiritual powers and strict self-discipline."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖੋਂ ਨੇ ਰਿਧੀ ਸਿਧੀ ਤਥਾ ਸੰਜਮ ਔਰ ਸਚ ਕੋ ਹੀ ਜਾਣਿਆਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੇ ਮਨੁੱਖ ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿੰਦੇ ਹਨ, ਉਹਨਾਂ ਵਾਸਤੇ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ (ਦਾ ਨਾਮ) ਹੀ ਰਿੱਧੀਆਂ ਸਿੱਧੀਆਂ ਤੇ ਸੰਜਮ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੁ ਸੋਈ = ਉਹ ਸਦਾ-ਥਿਰ ਪਰਮਾਤਮਾ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Para los fieles de Dios, Él es el Único Milagro, y Su Sendero es la Verdadera Disciplina Asceta."