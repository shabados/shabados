type = "primary"
data = "ਕਿਤੇ ਕੰਠ ਕੰਠੀ ਜਟਾ ਸੀਸ ਧਾਰੀ ॥"
page = 44

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many have worn Kanthi (necklace) on their necks and have matted hair on their heads."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਈਆਂ ਨੇ ਗਲ ਵਿਚ ਕੰਠੀ ਅਤੇ ਸਿਰ ਉਤੇ ਜਟਾਵਾਂ ਧਾਰੀਆਂ,"