[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਤੁ ਗੰਢਿ; ਵਰਤੈ ਸੰਸਾਰੁ ॥"
page = 143
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such are the alliances which prevail in this world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਹੋ ਜੇਹੇ ਮੇਲ-ਮਿਲਾਪ ਇਸ ਜਹਾਨ ਅੰਦਰ ਪਰਚਲਤ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such are the bonds which prevail in the world."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਨ੍ਹੋਂ ਗੰਢੋਂ ਕੇ ਸਮੁਦਾਇ ਮੇਂ ਸੰਸਾਰ ਵਰਤ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸੋ) ਇਸ ਤਰ੍ਹਾਂ ਦੇ ਸੰਬੰਧ ਨਾਲ ਜਗਤ (ਦਾ ਵਿਹਾਰ) ਚੱਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਤੁ ਗੰਢਿ = ਇਸ ਗਾਂਢੇ ਨਾਲ, ਇਸ ਸੰਬੰਧ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tales son las distintas cosas que remiendan y unen,"