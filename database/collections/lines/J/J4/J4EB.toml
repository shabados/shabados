[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਾਰੇ ਛਿਮੋ ਹਮਰੋ ਤੁਮ ਅਉਗਨ; ਹੁਇ ਮਤਿਮੰਦਿ ਕਰੀ ਜੁ ਢਿਠਾਈ ॥"
page = 304

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“I am of low intellect, forgive all my vices"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸਾਰੇ ਅਵਗੁਣ ਖਿਮਾ ਕਰ ਦਿਉ ਜੋ (ਮੈਂ) ਤੁੱਛ ਬੁੱਧੀ ਵਾਲੀ ਨੇ ਢੀਠਤਾ ਨਾਲ ਕੀਤੇ ਹਨ।"