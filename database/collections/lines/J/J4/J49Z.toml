[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਦਾਸੀ; ਉਦਾਸਿ ਰਾਤਾ ॥੩॥"
page = 71
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The stoic is imbued in dispassion."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਿਆਗੀ ਵੈਰਾਗ ਅੰਦਰ ਰੰਗਿਆ ਹੋਹਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and the Udaasees abide in detachment. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਦਾਸੀ ਉਦਾਸੀਨਤਾ ਹੀ ਮੇਂ ਮਸਤ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਉਦਾਸੀ ਉਦਾਸ-ਭੇਖ ਵਿਚ ਮਸਤ ਰਹਿੰਦੇ ਹਨ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਦਾਸਿ = ਉਦਾਸੀ ਭੇਖ ਵਿਚ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El estoico evita las pasiones.  (3)"