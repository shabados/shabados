[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜ਼ਿ ਕਾਮਲ ਜ਼ਿ ਜ਼ਾਯਲ ਜ਼ਿ ਨਾਰਦ ਸਿਯਰ ॥੧੮॥"
page = 1417

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Irrespective of the fact whether they were intelligent or irrational.(18)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪੜ੍ਹਾਈ ਸੰਬੰਧੀ ਇਕ ਦੂਜੇ ਨਾਲ ਗੱਲਾਂ ਕਰਦੇ ਹੁੰਦੇ ਸਨ ॥੧੮॥"