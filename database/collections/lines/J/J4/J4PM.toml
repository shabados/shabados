[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਹੁਰ ਤ੍ਰਿਯਾ ਤਿਹ ਰਾਇ ਸੋ; ਯੌ ਬਚ ਕਹਿਯੋ ਸੁਨਾਇ ॥"
page = 836

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then she declared loudly and told, the Raja."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਿਰ (ਉਸ) ਇਸਤਰੀ ਨੇ ਰਾਜੇ ਨੂੰ ਇਹ ਬੋਲ ਕਹਿ ਕੇ ਸੁਣਾਏ।"