[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਆਸਾ ਮਨਸਾ ਵਿਸਰੀ; ਮਨਿ ਚੂਕਾ ਆਲ ਜੰਜਾਲੁ ॥"
page = 1315
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have forgotten all my hopes and desires and my mind is rid of the worldly entanglements."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੀਆਂ ਸਾਰੀਆਂ ਉਮੈਦਾਂ ਤੇ ਖਾਹਿਸ਼ਾ ਭੁਲਾ ਛੱਡੀਆਂ ਹਨ ਅਤੇ ਮੇਰਾ ਮਨੂਆ ਸੰਸਾਰੀ ਪੁਆੜਿਆ ਤੋਂ ਖਲਾਸੀ ਪਾ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All my hopes and desires have been forgotten; my mind is rid of its worldly entanglements."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭੀ ਆਸਾ ਮਨਸਾ ਬਿਸਰ ਗਈ ਹੈ ਔਰ ਮਨ ਸੇ (ਆਲ) ਘਰ ਕਾ ਧੰਧਾ ਭੀ ਚੁਕ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੀ ਆਸਾ ਤੇ ਤ੍ਰਿਸ਼ਨਾ ਵਿੱਸਰ ਗਈ, ਮਨ ਵਿਚ (ਟਿਕਿਆ ਹੋਇਆ) ਘਰ ਦਾ ਮੋਹ (ਭੀ) ਮੁਕ ਗਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਸਾ = ਮਨ ਦਾ ਫੁਰਨਾ। ਮਨਿ = ਮਨ ਵਿਚ (ਟਿਕਿਆ ਹੋਇਆ)। ਆਲ = (ਆਲਯ) ਘਰ। ਆਲ ਜੰਜਾਲ = ਘਰ ਦਾ ਬੰਧਨ, ਘਰ ਦਾ ਮੋਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todas mis ansiedades y deseos se han quedado atrás y mi mente se ha liberado de sus enredos mundanos."