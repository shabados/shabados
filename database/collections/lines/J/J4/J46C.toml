[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕੁ ਨਾਮੁ; ਬੋਵਹੁ ਬੋਵਹੁ ॥"
page = 1185
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sow, sow thou the one Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਇੱਕ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਨੂੰ ਹੀ ਬੀਜ, ਬੀਜ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Plant the Naam, the Name of the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਕ ਪਰਮੇਸ੍ਵਰ ਕੇ ਨਾਮ ਰੂਪ ਬੀਜ ਕੋ ਬਾਰੰਬਾਰ ਬੀਜੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਆਪਣੀ ਹਿਰਦੇ ਦੀ ਪੈਲੀ ਵਿਚ) ਸਿਰਫ਼ ਹਰਿ-ਨਾਮ ਬੀਜ, ਸਿਰਫ਼ ਹਰਿ-ਨਾਮ ਬੀਜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "siembra entonces el Naam, el Nombre del Señor."