[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਨੁ ਗ੍ਰਿਹੁ; ਸਮਸਰਿ ਹਾਂ ॥"
page = 409
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The forest and home are alike to me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੰਗਲ ਅਤੇ ਘਰ ਮੇਰੇ ਲਈ ਇੱਕ ਬਰਾਬਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wilderness and household are the same."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੋ ਬਨ ਅਰੁ ਘਰੁ ਸਮਾਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਤਨਾ ਅਡੋਲ ਕਿ) ਜੰਗਲ ਅਤੇ ਘਰ ਇਕ-ਸਮਾਨ ਪ੍ਰਤੀਤ ਹੋਣ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਨੁ = ਜੰਗਲ। ਗ੍ਰਿਹੁ = ਘਰ। ਸਮਸਰਿ = ਬਰਾਬਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "vas a ver que el hogar y el retiro son lo mismo."