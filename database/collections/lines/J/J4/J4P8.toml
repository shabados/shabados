[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਪੂਰਾ ਜੇ ਮਿਲੈ ਪਿਆਰੇ; ਸੋ ਜਨੁ ਹੋਤ ਨਿਹਾਲਾ ॥"
page = 802
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, whom the Perfect True Guru meets, O my dear; that person is rendered blissful."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਪੂਰਨ ਸੱਚੇ ਗੁਰੂ ਜੀ ਮਿਲ ਪੈਂਦੇ ਹਨ, ਹੇ ਮੇਰੇ ਪਿਆਰਿਆ! ਉਹ ਪੁਰਸ਼ ਪਰਸੰਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who meets with the Perfect True Guru, O Beloved, that humble person is enraptured."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਮੇਰਾ ਪ੍ਰੀਤਮ ਪੂਰਾ ਸਤਗੁਰੂ ਜਿਸ ਜਨ ਕੋ ਮਿਲੈ ਤਬ ਸੋ ਜਨ ਨਿਹਾਲ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਪੂਰਾ ਗੁਰੂ ਮਿਲ ਪਏ, ਉਹ ਸਦਾ ਖਿੜਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋ ਜਨੁ = ਉਹ ਬੰਦਾ। ਨਿਹਾਲਾ = ਆਨੰਦ-ਭਰਪੂਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que encuentra al Guru Verdadero es emancipado."