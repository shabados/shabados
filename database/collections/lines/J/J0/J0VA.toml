[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਪੁ ਤਾਪਸ ਸਰਬ ਜਲੇ ਰੁ ਥਲੰ ॥"
page = 30

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "For whose realization all the ascetics of water and land perform austerities!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਲਾਂ ਥਲਾਂ ਦੇ ਸਾਰੇ ਤਪਸਵੀ (ਜਿਸ ਨੂੰ ਪ੍ਰਾਪਤ ਕਰਨ ਲਈ) ਤਪ ਕਰਦੇ ਹਨ"