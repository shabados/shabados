[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਧੁ ਸੰਗਿ ਦੁਲੰਭੁ ਹੈ; ਗੁਰਮੁਖਿ ਸੁਖ ਫਲੁ ਭਗਤਿ ਪਿਆਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Also rare is the holy congregation and loving devotion, the pleasure fruit of gurrnukhs."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਤਿਸੰਗ ਸਭ ਤੋਂ ਦੁਰਲੱਭ ਹੈ ਗੁਰਮੁਖ ਲੋਕ ਸੁਖ ਫਲ ਜਾਣਕੇ ਭਗਤੀ ਹੀ ਪਿਆਰੀ ਜਾਣਦੇ ਹਨ। (ਹੁਣ ਆਮ ਦਸ਼ਾ ਕਰਦੇ ਹਨ)।"