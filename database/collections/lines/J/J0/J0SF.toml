[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕਿ ਸਤੀ ਕਹਾਵਹਿ; ਤਿਨੑ ਬਹੁਤੁ ਕਲਪਾਵੈ ॥"
page = 370
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some who call themselves as greatly torments."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ, ਜੋ ਆਪਣੇ ਆਪ ਨੂੰ ਦਾਨੀ ਅਖਵਾਉਂਦੇ ਹਨ, ਉਨ੍ਹਾਂ ਨੂੰ ਇਹ ਖਰਾ ਸਤਾਉਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some call themselves men of charity, and she torments them terribly."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਸਤੀ ਕਹਾਵਤੇ ਹੈਂ ਕਿ ਹਮ ਮਿਥ੍ਯਾ ਕਬਹੀ ਨਹੀਂ ਕਹੈਂਗੇ ਜੁਧਿਸ੍ਟਰਾਦਿਕ, ਤਿਨ ਕੋ ਭੀ ਮਾਯਾ ਬਹੁਤ ਕਲਪਾਵਤੀ ਹੈ ਯਹ ਪ੍ਰਸੰਗ ਭਾਗਵਤਾਦਿ ਗ੍ਰੰਥੋਂ ਮੇਂ ਪ੍ਰਸਿਧ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਬੰਦੇ (ਆਪਣੇ ਆਪ ਨੂੰ) ਦਾਨੀ ਅਖਵਾਂਦੇ ਹਨ, ਉਹਨਾਂ ਨੂੰ (ਭੀ) ਇਹ ਬਹੁਤ ਦੁਖੀ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤੀ = ਦਾਨੀ। ਕਲਪਾਵੈ = ਦੁੱਖੀ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero no los tendrán por mucho tiempo. Algunos son aclamados como seres de caridad, pero a ellos Maya,"