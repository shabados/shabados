[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਏ ਟੂਕ ਟੂਕੰ ਰਣੰ ਬੀਰ ਧੀਰੰ ॥"
page = 169

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "With the clattering of swords and the crackling noise of the arrows, the mighty and the enduring heroes were chopped into bits"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਧੀਰਜਵਾਨ ਯੋਧੇ ਰਣ-ਭੂਮੀ ਵਿਚ ਟੋਟੇ ਟੋਟੇ ਹੋ ਗਏ ਸਨ।"