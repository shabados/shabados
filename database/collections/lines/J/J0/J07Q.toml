[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਹ ਦਿਸ ਇਹੁ ਮਨੁ ਧਾਵਦਾ; ਗੁਰਿ. ਠਾਕਿ ਰਹਾਇਆ ॥"
page = 789
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This mind hastens in ten directions. The Guru stops and holds it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਮਨੂਆ ਦਸੀਂ ਪਾਸੀਂ ਭੱਜਿਆ ਫਿਰਦਾ ਹੈ। ਗੁਰੂ ਜੀ ਇਸ ਨੂੰ ਹੋੜ ਕੇ ਰੋਕ ਰੱਖਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mind runs around in the ten directions; the Guru holds it still."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦਸਾਂ ਦਿਸਾਂ ਮੇਂ ਏਹ ਮਨ ਧਾਵਤਾ ਥਾ, ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਰੋਕ ਕਰ ਰਖਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਦਾ ਇਹ ਮਨ ਦਸੀਂ ਪਾਸੀਂ ਦੌੜਦਾ ਹੈ, (ਸਰਨ ਆਏ ਮਨੁੱਖ ਦਾ ਮਨ) ਗੁਰੂ ਨੇ (ਹੀ) ਰੋਕ ਕੇ ਰੱਖਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਹਦਿਸ = ਦਸੀਂ ਪਾਸੀਂ। ਗੁਰਿ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Esta mente que vaga por todas partes es entonces tranquilizada por la Gracia del Guru."