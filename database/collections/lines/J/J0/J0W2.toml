[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਮੁ ਚਿਤੈ; ਕਾਮਣਿ ਹਿਤਕਾਰੀ ॥"
page = 225
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The lover of a woman thinks of lust."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤ੍ਰੀਮਤ ਦਾ ਆਸ਼ਕ, ਭੋਗ-ਬਿਲਾਸ ਦਾ ਖਿਆਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The lover of women is obsessed with sex."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਾਮ ਕਰ ਆਤਰ ਹੂਆ ਇਸਤ੍ਰੀ ਕੋ ਹਿਤੁਕਾਰੀ ਹੋ ਕਰ ਚਿੰਤਨ ਕਰਤਾ ਵਾ ਦੇਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਦੁਰਮਤਿ ਦੇ ਅਧੀਨ ਹੋ ਕੇ) ਇਸਤ੍ਰੀ ਦਾ ਪ੍ਰੇਮੀ ਮਨੁੱਖ ਸਦਾ ਕਾਮ-ਵਾਸਨਾ ਹੀ ਚਿਤਵਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਿਤੈ = ਚਿਤਵਦਾ ਹੈ। ਹਿਤਕਾਰੀ = ਹਿਤ ਕਰਨ ਵਾਲਾ, ਪ੍ਰੇਮੀ। ਕਾਮਣਿ = ਇਸਤ੍ਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin ver la Divinidad en ella, el amante de una mujer está ofuscado en la lujuria,"