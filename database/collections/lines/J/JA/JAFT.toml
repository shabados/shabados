[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੈ ਸਬਦੇ ਸਚਿ ਸੁਹਾਵੈ ॥"
page = 1050
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the True Name, they are truly embellished."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਨਾਮ ਰਾਹੀਂ ਉਹ ਵਾਸਤਵ ਵਿੱਚ ਸ਼ਸ਼ੋਭਤ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They are embellished with the True Word of the Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚੇ ਗੁਰ ਉਪਦੇਸ ਸੇ ਵਹੁ ਨਿਸਚੇ ਕਰ ਸੋਭਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ ਦੀ ਰਾਹੀਂ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਵਿਚ ਟਿਕ ਕੇ ਮਨੁੱਖ ਆਪਣਾ ਜੀਵਨ ਸੋਹਣਾ ਬਣਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੈ ਸਬਦੇ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ ਦੀ ਰਾਹੀਂ। ਸੁਹਾਵੈ = ਸੋਹਣੇ ਜੀਵਨ ਵਾਲਾ ਬਣ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ellos se ven Bellos a través de la Verdad, siendo bendecidos con la Palabra Verdadera."