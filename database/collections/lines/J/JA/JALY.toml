[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਹੰਤ ਤੀਛਣੋ ਸਰੰ ਝਲੰਤ ਝਾਲ ਖੜਿਗਿਣੰ ॥"
page = 672

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sharp arrows were being seen"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਿਖੇ ਤੀਰ ਵਰ੍ਹਾਉਂਦੇ ਸਨ ਅਤੇ ਤਲਵਾਰਾਂ ਦੀਆਂ ਤਿਖੀਆਂ ਧਾਰਾਂ (ਆਪਣੇ ਉਤੇ) ਝਲਦੇ ਸਨ।"