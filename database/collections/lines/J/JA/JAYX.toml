[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਗਤੁ ਉਪਾਇ ਖੇਲੁ ਰਚਾਇਆ ॥"
page = 1031
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Creating the world, the Lord has staged His play."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰ ਨੂੰ ਸਾਜ ਕੇ ਸੁਆਮੀ ਨੇ ਆਪਣੀ ਖੇਡ ਰਚੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Creating the world, He has set His play into motion."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਨੇ ਜਗਤ ਕੋ ਉਤਪਤ ਕਰ ਕੇ ਖੇਲ ਬਨਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਪੈਦਾ ਕਰ ਕੇ ਪ੍ਰਭੂ ਨੇ (ਮਾਨੋ, ਇਕ) ਖੇਡ ਬਣਾ ਦਿੱਤੀ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਪਾਇ = ਪੈਦਾ ਕਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él crea el mundo y así establece Su Obra."