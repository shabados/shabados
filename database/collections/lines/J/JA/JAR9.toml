type = "primary"
data = "ਸੁ ਪ੍ਰਭਾ ਧਰ ਹੈਂ ॥੩੫੦॥"
page = 586

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "His eyes are like the deer’s eyes and lotus, He is full of Mercy and Glory.350."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੁੰਦਰ ਪ੍ਰਭਾ ਨੂੰ ਧਾਰਨ ਕਰਨ ਵਾਲੇ ਹਨ ॥੩੫੦॥"