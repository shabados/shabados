[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮਸਤੁਲ ਪ੍ਰਣਾਮੇ, ਸਮਸਤੁਲ ਪ੍ਰਣਾਸੇ ॥"
page = 10
line = 14

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Salutation to Thee O Most Venerated and Destroyer of all Lord!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਭਨਾਂ ਦੁਆਰਾ ਨਮਸਕਾਰੇ ਜਾਣ ਵਾਲੇ (ਉਸ ਪ੍ਰਭੂ ਨੂੰ) ਮੇਰਾ ਪ੍ਰਨਾਮ ਹੈ, ਜੋ ਸਭ ਦਾ ਸੰਘਾਰਕ ਹੈ, ਨਾਸ਼ ਤੋਂ ਪਰੇ ਹੈ,"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਨਮਸਤੁਲ ਪ੍ਰਨਾਮੇ; ਸਮਸਤੁਲ ਪ੍ਰਣਾਸੇ ॥"