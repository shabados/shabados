[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤ ਸਚੇ ਦਰਿ ਸੋਹਦੇ; ਅਨਦ ਕਰਹਿ ਦਿਨ ਰਾਤਿ ॥"
page = 218
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lord's devoted salves look beauteous in the true Court. Day and night they make merry."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਜਾਂ-ਨਿਸਾਰ ਗੋਲੇ ਸੱਚੇ ਦਰਬਾਰ ਵਿੱਚ ਸੁੰਦਰ ਲਗਦੇ ਹਨ। ਦਿਨ ਰੈਣ ਉਹ ਮੌਜ ਮਾਣਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The devotees look beautiful in the True Court; night and day, they are happy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਚੇ ਪਰਮੇਸ੍ਵਰ! ਭਗਤ ਜਨ ਤੇਰੇ ਸੰਤ ਸੰਗ ਰੂਪੀ ਦਰ ਮੇਂ ਸੋਭਤੇ ਹੈਂ ਔਰ ਦਿਨ ਰਾਤ ਅਨੰਦ ਕਾ ਭੋਗਨਾ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਕਰਨ ਵਾਲੇ ਬੰਦੇ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦੇ ਦਰ ਤੇ ਸੋਭਾ ਪਾਂਦੇ ਹਨ, ਤੇ ਦਿਨ ਰਾਤ ਆਤਮਕ ਆਨੰਦ ਮਾਣਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੇ ਦਰਿ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tus Devotos, oh Señor, se ven bellos en Tu Puerta, se regocijan día y noche,"