[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੀ ਜੋਤਿ; ਜੀਅ ਪਰਗਾਸ ॥"
page = 184
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "with whose light the soul is illumined,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਨੂਰ ਨਾਲ ਆਤਮ ਪਰਕਾਸ਼ ਹੁੰਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The soul is illumined with His Light;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਸਤਾ ਕਾ ਜੀਵੋਂ ਮੇਂ ਚਾਂਦਨਾ ਹੋ ਰਹਾ ਹੈ, ਭਾਵ ਏਹ ਕਿ ਸਰਬ ਇੰਦ੍ਰੇ ਸ੍ਵੈ ਸ੍ਵੈ ਵਿਖੇ ਕੋ ਗ੍ਰਹਣ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਜੋਤਿ ਸਾਰੇ ਜੀਵਾਂ ਵਿਚ ਚਾਨਣ ਕਰ ਰਹੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ = ਸਭ ਜੀਵਾਂ ਵਿਚ। ਪਰਗਾਸ = ਚਾਨਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El alma es iluminada con su resplandor."