[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਗੁਰੂ ਨ ਚੇਤਨੀ; ਮਨਿ ਆਪਣੈ ਸੁਚੇਤ ॥"
page = 463
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, they who think not of the Guru and in their heart deem themselves very clever,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਜੋ ਗੁਰੂ ਜੀ ਨੂੰ ਚੇਤੇ ਨਹੀਂ ਕਰਦੇ ਅਤੇ ਆਪਣੇ ਦਿਲ ਵਿੱਚ ਆਪਣੇ ਆਪ ਨੂੰ ਬਹੁਤਾ ਚਤੁਰ ਖਿਆਲ ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, those who do not think of the Guru, and who think of themselves as clever,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜੋ ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਨਹੀਂ ਚਿੰਤਨ ਕਰਤੇ, ਅਪਨੇ ਮਨ ਸੇ ਆਪ ਹੀ ਸੁਚੇਤ ਬਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਜੋ ਮਨੁੱਖ) ਗੁਰੂ ਨੂੰ ਚੇਤੇ ਨਹੀਂ ਕਰਦੇ ਆਪਣੇ ਆਪ ਵਿਚ ਚਤਰ (ਬਣੇ ਹੋਏ) ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕ = ਹੇ ਨਾਨਕ! ਨ ਚੇਤਨੀ = ਨਹੀਂ ਚੇਤਦੇ। ਮਨਿ ਆਪਣੈ = ਆਪਣੇ ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak, ¡Quienes no habitan en su Guru se creen sabios por ellos mismos!"