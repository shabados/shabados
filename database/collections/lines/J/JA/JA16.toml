[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਮੑ ਦੇਵਹੁ ਸਭੁ ਕਿਛੁ. ਦਇਆ ਧਾਰਿ; ਹਮ ਅਕਿਰਤਘਨਾਰੇ ॥"
page = 809
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In Thine mercy, Thou blesseth me with everything, while I am an ungrateful fellow."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਕਿਰਪਾ ਕਰ ਕੇ ਤੂੰ ਮੈਂ ਨਾਂ-ਸ਼ੁਕਰੇ ਨੂੰ ਹਰ ਵਸਤੂ ਪ੍ਰਦਾਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You bless me with everything, showering me with Mercy; And I am such an ungrateful wretch!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੁਮ ਅਪਨੀ ਦਇਆ ਧਾਰ ਕਰ ਸਰਬ ਸੁਖ ਦੇ ਰਹੇ ਹੋ, ਪਰੰਤੂ ਹਮ ਕ੍ਰਿਤਘਨ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਅਸੀਂ (ਜੀਵ) ਨਾ-ਸ਼ੁਕਰੇ ਹਾਂ; ਤੂੰ (ਫਿਰ ਭੀ) ਮੇਹਰ ਕਰ ਕੇ ਸਾਨੂੰ ਹਰੇਕ ਚੀਜ਼ ਦੇਂਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭੁ ਕਿਛੁ = ਹਰੇਕ ਚੀਜ਼। ਅਕਿਰਤਘਨਾਰੇ = {कृतघ्न = ਕੀਤੇ (ਉਪਕਾਰ) ਨੂੰ ਭੁਲਾਣ ਵਾਲੇ} ਨਾ-ਸ਼ੁਕਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me bendices en Tu Misericordia mientras que yo, el pobre desgraciado, no me doy cuenta."