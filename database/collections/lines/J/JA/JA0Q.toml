[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਐਸਿ ਭਾਤਿ ਕੀਓ ਤਹਾ; ਬਹੁ ਬਰਖ ਲਉ ਤਿਹ ਰਾਜ ॥"
page = 141

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In this way he ruled there for many years."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਨਾਲ ਉਸ ਨੇ ਬਹੁਤ ਵਰ੍ਹਿਆਂ ਤਕ ਉਥੇ ਰਾਜ ਕੀਤਾ।"