[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੇਟਤ ਸਾਧੂ ਸੰਗ; ਜਮ ਪੁਰਿ ਨਹ ਜਾਈਐ ॥"
page = 456
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting with the saints, man goes not to the Death-Courier's City."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤਾਂ ਨਾਲ ਮਿਲ ਕੇ ਬੰਦਾ ਮੌਤ ਦੇ ਦੂਤਾਂ ਦੇ ਸ਼ਹਿਰ ਨੂੰ ਨਹੀਂ ਜਾਂਦਾ (ਵੱਸ ਨਹੀਂ ਪੈਂਦਾ)।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting with the Saadh Sangat, the Company of the Holy, you shall not have to go to the City of Death."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਓਂ ਕੇ ਸੰਗਿ ਮਿਲਨੇ ਸੇ ਜਮ ਪੁਰ ਨਹੀਂ ਜਾਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਮਿਲਿਆਂ (ਤੇ ਹਰਿ-ਨਾਮ ਜਪਿਆਂ) ਜਮ ਦੀ ਪੁਰੀ ਵਿਚ ਨਹੀਂ ਜਾਣਾ ਪੈਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੇਟਤ = ਮਿਲਿਆਂ। ਸਾਧੂ = ਗੁਰੂ। ਸੰਗਿ = ਨਾਲ। ਜਮਪੁਰਿ = ਜਮ ਦੀ ਪੁਰੀ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues meditando con los Santos te alejas del recinto de la muerte."