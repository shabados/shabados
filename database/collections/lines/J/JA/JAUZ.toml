[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਪੇਖੀਐ ਬਿਸਮਾਦ ॥"
page = 837
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Seeing my Lord, I have been wonder-struck,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਨੂੰ ਵੇਖ ਕੇ ਮੈਂ ਚਕ੍ਰਿਤ ਹੋ ਗਿਆ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Gazing upon God, I am wonderstruck."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਪ੍ਰਕਾਰ ਤਿਸ (ਬਿਸਮਾਦ) ਅਸਚਰਜ ਰੂਪ ਪ੍ਰਭੂ ਕੋ ਜਬ ਦੇਖਣਾ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਅਸਚਰਜ-ਰੂਪ ਪ੍ਰਭੂ ਦਾ ਦਰਸਨ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੇਖੀਐ = ਵੇਖ ਸਕੀਦਾ ਹੈ, ਦਰਸਨ ਕਰ ਸਕੀਦਾ ਹੈ। ਪ੍ਰਭੂ ਬਿਸਮਾਦ = ਅਸਚਰਜ-ਰੂਪ ਪ੍ਰਭੂ (ਨੂੰ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Estoy maravillado con la Visión de mi Dios;"