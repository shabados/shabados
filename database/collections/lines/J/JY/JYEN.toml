[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਇ ਭੀ ਲਾਗੇ; ਕਾਢੁ ਸਵੇਰਾ ॥੨॥"
page = 794
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Take him out quickly."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਨੂੰ ਛੇਤੀ ਬਾਹਰ ਲੈ ਜਾਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "\"Take his body out, immediately!\" ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਓਇ ਭੀ ਕਹਨੇ ਲਾਗੇ (ਕਾਢੁ ਸਵੇਰਾ) ਮੁਰਦੇ ਕੋ ਘਰ ਤੇ ਕਾਢੋ ਸੀਘ੍ਰਤਾ ਕਰੋ ਅਬ ਵਖਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਾਰੇ ਹੀ ਆਖਣ ਲੱਗ ਪੈਂਦੇ ਹਨ ਕਿ ਇਸ ਨੂੰ ਹੁਣ ਛੇਤੀ ਬਾਹਰ ਕੱਢੋ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਾਗੇ = ਕਹਿਣ ਲੱਗ ਪੈਂਦੇ ਹਨ। ਸਵੇਰਾ = ਸੁਵਖਤੇ, ਛੇਤੀ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "llévenselo de aquí tan pronto como sea posible.  (2)"