data = "ਰਾਵੀ ਨਦਿ ਊਪਰ ਬਸੈ; ਨਾਰਿ ਸਾਹਿਬਾ ਨਾਮ ॥"
page = 992

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On the banks of Ravi, there used to live a woman called Sahiban."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਵੀ ਨਦੀ ਦੇ ਕੰਢੇ ਸਾਹਿਬਾਂ ਨਾਂ ਦੀ ਇਕ ਇਸਤਰੀ ਵਸਦੀ ਸੀ,"