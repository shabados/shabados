[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ, ਇਕੁ ਮਨਿ ਇਕੁ ਧਿਆਏ ॥੩॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "With concentrated mind, gurmukhs adore only one Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖ ਇਕ (ਅਕਾਲ ਪੁਰਖ ਦਾ) ਇਕਾਗ੍ਰ ਮਨ ਧਿਆਨ ਕਰਦੇ ਹਨ।"