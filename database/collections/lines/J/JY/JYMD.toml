[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੰਗਲੁ ਨਾਰੀ ਗਾਵਹਿ ਆਏ ॥"
page = 798
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The women come and sing the Lord's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸਤ੍ਰੀਆਂ ਆ ਕੇ ਸੁਆਮੀ ਦੀ ਉਸਤਤੀ ਗਾਇਨ ਕਰਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The women come and sing the songs of joy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨ ਰੂਪੀ ਇਸਤ੍ਰੀਆਂ ਵਾਹਗੁਰੂ ਕਾ ਜਸ ਰੂਪੀ ਮੰਗਲ ਗੁਰਾਂ ਪਾਸ ਆਇਕਰ ਗਾਇਨ ਕਰਤੀਆਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਸਾਰੇ ਗਿਆਨ-ਇੰਦ੍ਰੇ ਰਲ ਕੇ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦਾ ਗੀਤ ਗਾਂਦੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਰੀ ਗਾਵਹਿ = ਨਾਰੀਆਂ ਗਾਂਦੀਆਂ ਹਨ, ਇੰਦ੍ਰੇ ਗਾਂਦੇ ਹਨ। ਮੰਗਲੁ = (ਪ੍ਰਭੂ ਦੀ) ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦਾ ਗੀਤ। ਆਇ = ਆਇ; ਆ ਕੇ, ਰਲ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En su hogar es cantada la Canción de Éxtasis y,"