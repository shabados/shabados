[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਦੀਏ ਤੁਧੁ; ਬਨਿਤਾ ਅਰੁ ਮੀਤਾ ॥"
page = 913
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and who blessed thee with wife and friends;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇ ਜਿਸ ਨੇ ਤੈਨੂੰ ਪਤਨੀ ਅਤੇ ਮਿੱਤਰ ਬਖਸ਼ੇ ਹਨ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "he gave you your spouse and friends;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਤੇਰੇ ਕੋ ਇਸਤ੍ਰੀ ਔਰ ਮਿਤ੍ਰ ਦੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪ੍ਰਭੂ ਨੇ ਤੈਨੂੰ ਇਸਤ੍ਰੀ ਅਤੇ ਸੱਜਣ-ਮਿੱਤਰ ਦਿੱਤੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੁਧੁ = ਤੈਨੂੰ। ਬਨਿਤਾ = ਇਸਤ੍ਰੀ। ਅਰੁ = ਅਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que te bendijo con una amada esposa y amigos,."