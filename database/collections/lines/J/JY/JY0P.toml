type = "primary"
data = "ਮਹਾਜੰਗ ਜੋਧਾ ਸੁ ਸਸਤ੍ਰੰ ਪ੍ਰਧਾਨੰ ॥"
page = 144

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He was a great warrior in the battlefield and adept in warfare."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਮਹਾਨ ਯੋਧਾ ਅਤੇ ਸ਼ਸਤ੍ਰ-ਵਿਦਿਆ ਵਿਚ ਪ੍ਰਬੀਨ ਸੀ।"