[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਬੈ ਬਨਿਕ ਤੈਸੇ ਕਿਯਾ ਜ︀ਯੋਂ ਤ੍ਰਿਯ ਕਹਿਯੋ ਰਿਸਾਇ ॥"
page = 844

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The moneylender agreed to do whatever the lady said."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਉਸ ਬਨੀਏ ਨੇ ਉਸੇ ਤਰ੍ਹਾਂ ਕੀਤਾ ਜਿਵੇਂ ਇਸਤਰੀ ਨੇ ਕ੍ਰੋਧਵਾਨ ਹੋ ਕੇ ਕਿਹਾ ਸੀ।"