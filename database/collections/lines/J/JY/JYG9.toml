[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹਰਿਚੰਦਉਰੀ ਨਗਰ ਵਾਂਗੁ; ਕੂੜੁ ਸਚੁ ਪਰਗਟੁ ਪਾਹਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The falsehood is like imaginary city in the sky whereas the truth is like manifest world."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕੂੜ ਗੰਧਰਬ ਨਗਰੀ ਹੈ ਅਰ ਸੱਚ ਪ੍ਰਗਟ ਪਹਾੜ ਵਾਂਙੂ ਹੈ।"