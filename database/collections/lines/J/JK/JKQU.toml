[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤਹੁ; ਐਸੀ ਕਥਹੁ ਕਹਾਣੀ ॥"
page = 883
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O saints, recite to me such gospel of God,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋਂ ਮੈਨੂੰ ਐਹੋ ਜਿਹੀ ਵਾਹਿਗੁਰੂ ਦੀ ਵਾਰਤਾ ਸੁਣਾਓ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Saints, speak that speech which purifies the gods and sanctifies the divine beings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤੋ! ਐਸੀ ਕਹਾਣੀ ਕਥਾ ਕਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! ਇਹੋ ਜਿਹੀ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਕਰਦੇ ਰਹੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤਹੁ = ਹੇ ਸੰਤ ਜਨੋ! ਕਥਹੁ = ਆਖੋ, ਉਚਾਰੋ। ਕਹਾਣੀ = ਸਿਫ਼ਤਿ-ਸਾਲਾਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Santos, recítenme la Palabra del Shabd de Dios aunque sea por un corto instante;"