[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਉ ਸੁਪ੍ਰਸੰਨ ਹੋਇਓ; ਪ੍ਰਭੁ ਮੇਰਾ ॥"
page = 388
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When my master is mightily pleased with me,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਮੇਰਾ ਮਾਲਕ ਮੇਰੇ ਉਤੇ ਪਰਮ ਖੁਸ਼ ਹੋ ਗਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When my God is totally pleased with me,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰਾ ਪ੍ਰਭੂ! ਜੋ ਤੂੰ  ਪ੍ਰਸੰਨ ਹੋਯਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਦੋਂ ਮੇਰਾ ਪ੍ਰਭੂ (ਕਿਸੇ ਮਨੁੱਖ ਉਤੇ) ਬਹੁਤ ਪ੍ਰਸੰਨ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਉ = ਜਦੋਂ। ਸੁਪ੍ਰਸੰਨ = ਬਹੁਤ ਖ਼ੁਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si mi Maestro está complacido conmigo,"