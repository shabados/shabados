[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਰਿ ਵਥੁ ਛੋਡਹਿ; ਬਾਹਰਿ ਧਾਵਹਿ ॥"
page = 1058
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who wander outside by ignoring the thing within;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਪਦੇ ਹਿਰਦੇ ਅੰਦਰ ਦੀ ਵਸਤੂ ਨੂੰ ਛੱਡ ਕੇ ਬਾਹਰ ਭਟਕਦੇ ਹਨ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who forsake the object within their own hearts, wander outside."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅੰਤਸਕਰਣ ਮੇਂ ਬ੍ਰਹਮ ਰੂਪ ਵਸਤੂ ਕੋ ਛੋਡਕੈ ਬਾਹਰ ਕੋ ਧਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਮਨੁੱਖ ਹਿਰਦੇ-ਘਰ ਵਿਚ ਵੱਸ ਰਹੇ ਨਾਮ-ਪਦਾਰਥ ਨੂੰ ਛੱਡ ਦੇਂਦੇ ਹਨ, ਤੇ, ਬਾਹਰ ਭਟਕਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਰਿ = ਘਰ ਵਿਚ, ਸਰੀਰ ਵਿਚ, ਹਿਰਦੇ ਵਿਚ। ਵਥ = ਵਸਤੁ, ਨਾਮ-ਪਦਾਰਥ। ਛੋਡਹਿ = ਛੱਡ ਦੇਂਦੇ ਹਨ {ਬਹੁ-ਵਚਨ}। ਧਾਵਹਿ = ਦੌੜਦੇ ਹਨ {ਬਹੁ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que no logra sensibilizarse en su interior y su búsqueda la hace por fuera,"