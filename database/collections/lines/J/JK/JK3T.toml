type = "primary"
data = "ਦ੍ਵੈ ਤੇ ਏਕ ਰੂਪ ਹ੍ਵੈ ਗਯੋ ॥"
page = 55

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In this way, my meditation reached its zenith and I became One with the Omnipotent Lord."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦ੍ਵੈਤ ਤੋਂ ਅਦ੍ਵੈਤ ਰੂਪ ਹੋ ਗਏ।"