[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੋਪ ਓਪ ਦੈ ਹਠੀ; ਸੁ ਧਾਇ ਕੈ ਪਰੇ ਸਬੈ ॥"
page = 589

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the warriors in their fury, took their arms and weapons in their hands, moved forward with persistence and shouting loudly fell upon the opponents"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹਠੀ ਸੂਰਮੇ ਉਤਸਾਹ ਪੂਰਵਕ ਹਮਲਾ ਕਰ ਕੇ ਪੈ ਗਏ ਹਨ।"