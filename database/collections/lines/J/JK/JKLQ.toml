[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਤਿਆਗਿ; ਕਰੇ ਅਨ ਕਾਜ ॥"
page = 240
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Abandoning Lord's Name, if man engages in other occupations,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਨੂੰ ਛੱਡ ਕੇ ਜੇਕਰ ਆਦਮੀ ਹੋਰ ਧੰਦੇ ਕਰਦਾ ਹੈ,।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who renounces the Naam and engages in other occupations,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਨਾਮ ਕੋ ਤਿਆਗ ਕਰ ਕੇ ਔਰ ਕਾਮ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜੇਹੜਾ ਮਨੁੱਖ) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਛੱਡ ਕੇ ਹੋਰ ਹੋਰ ਕੰਮ-ਕਾਜ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨ ਕਾਜ = ਹੋਰ ਹੋਰ ਕੰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Naam, lo que sea que uno haga"