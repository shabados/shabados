[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦੀ; ਕੀਮਤਿ ਪਾਈ ॥"
page = 1044
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and thus by the Guru's grace, man comes to know the Lord's worth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇ ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਉਹ ਸਾਈਂ ਦੇ ਮੁੱਲ ਨੂੰ ਜਾਣ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, one comes to know the Lord's worth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਕਰਿ ਸਤਿਸੰਗ ਕੀ ਕੀਮਤ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ (ਉਹ ਮਨੁੱਖ ਇਸ ਮਨੁੱਖਾ ਜਨਮ ਦੀ) ਕਦਰ ਸਮਝਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਸਾਦੀ = ਪਰਸਾਦਿ, ਕਿਰਪਾ ਨਾਲ। ਕੀਮਤਿ = ਕਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, es por la Gracia del Guru, que uno conoce el Valor de Dios."