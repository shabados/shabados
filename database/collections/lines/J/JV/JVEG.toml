[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨਉ ਕਰੈ ਨਾਨਕੁ; ਕਰ ਜੋਰਿ ॥੪॥੭॥"
page = 563
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With joined hands, Nanak makes a supplication before Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੱਥ ਜੋੜ ਕੇ ਨਾਨਕ ਤੇਰੇ ਮੂਹਰੇ ਪ੍ਰਾਰਥਨਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak offers this prayer with his palms pressed together. ||4||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਇਸੀ ਸੇ ਮੈਂ ਆਪ ਕੇ ਅਗੇ ਹਾਥ ਜੋੜ ਕਰ ਬੇਨਤੀ ਕਰਤਾ ਹੂੰ॥੪॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ (ਤੇਰੇ ਅੱਗੇ) ਹੱਥ ਜੋੜ ਕੇ ਬੇਨਤੀ ਕਰਦਾ ਹੈ ॥੪॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਨਉ = ਬੇਨਤੀ। ਨਾਨਕੁ ਕਰੈ = ਨਾਨਕ ਕਰਦਾ ਹੈ {ਲਫ਼ਜ਼ 'ਨਾਨਕ' ਅਤੇ 'ਨਾਨਕੁ' ਦਾ ਫ਼ਰਕ ਚੇਤੇ ਰੱਖੋ}। ਕਰ = (ਦੋਵੇਂ) ਹੱਥ। ਜੋਰਿ = ਜੋੜ ਕੇ ॥੪॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y en total humildad, Nanak Te ofrece su Oración. (4-7)"