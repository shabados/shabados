[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪੂਜਤ ਤੇ ਜਗ ਮਾਤ ਸਭੈ ਜਨ; ਪੂਜਿ ਸਭੈ ਤਿਹ ਡੇਰਨ ਆਏ ॥"
page = 371

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the people returned to their homes after worshipping the goddess of the world"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਗਵਾਲੇ ਜਗ ਮਾਤ (ਦੇਵੀ) ਦੀ ਪੂਜਾ ਕਰਨ ਲਗੇ ਅਤੇ ਉਹ ਸਾਰੇ ਪੂਜ ਕੇ ਆਪਣਿਆਂ ਡੇਰਿਆਂ ਨੂੰ ਆ ਗਏ।"