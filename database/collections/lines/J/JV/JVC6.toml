[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮੂਰਖ; ਕਿਉ ਤਾਹਿ ਬਿਸਾਰਾ ॥"
page = 257
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O foolish man why hast thou forgotten Him?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੈ ਮੂੜ ਮਨੁੱਖ! ਤੂੰ ਉਸ ਨੂੰ ਕਿਉਂ ਭੁਲਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O foolish mind, why have you forgotten Him?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ ਮਨ! ਤੈਨੇ ਤਿਸ ਕੋ ਕਿਸ ਵਾਸਤੇ ਬਿਸਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ ਮਨ! ਤੂੰ ਉਸ ਨੂੰ ਕਿਉਂ ਭੁਲਾਂਦਾ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾਹਿ = ਉਸ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿por qué entonces, oh mi mente tonta, te has olvidado de tu Señor?"