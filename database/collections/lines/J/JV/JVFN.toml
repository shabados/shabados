[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ; ਰਾਮ ਨਾਮ ਕਰਿ ਆਸਾ ॥"
page = 801
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul rest thy hope on the Lord's Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ ਤੂੰ ਆਪਣੀ ਉਮੈਦ ਸੁਆਮੀ ਦੇ ਨਾਮ ਤੇ ਬੰਨ੍ਹ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mortal, place your hopes in the Name of the Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਮਨ! ਰਾਮ ਨਾਮ ਜਪਨੇ ਕੀ ਸਦਾ (ਆਸਾ) ਇਛਾ ਧਾਰਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਮਨ! ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਉਤੇ ਹੀ ਡੋਰੀ ਰੱਖ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente, descansa tus esperanzas en el Nombre del Señor"