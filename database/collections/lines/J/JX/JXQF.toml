[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚਰਣੋਦਕੁ ਹੋਇ ਸੁਰਸਰੀ; ਤਜਿ ਬੈਕੁੰਠ ਧਰਤਿ ਵਿਚਿ ਆਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Ganges, the wash of the Lords' feet, left heavens and came down to arth."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਲੋਕ ਪ੍ਰਸਿੱਧ ਕਥਾ ਹੈ ਕਿ) ਗੰਗਾ (ਬਾਵਨ ਦੇ ਚਰਨਾਂ) ਦਾ ਚਰਣਾਮ੍ਰਿਤ ਹੋਣ ਕਰ ਕੇ ਬੈਕੁੰਠ ਛਡ ਕੇ ਧਰਤੀ ਵਿਖੇ ਆਈ।"