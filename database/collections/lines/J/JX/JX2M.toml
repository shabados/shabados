assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੱਗ ਵਿੱਚ ਅੱਗ ਮਿਲ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
