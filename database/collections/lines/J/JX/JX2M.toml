data = "ਜੋਤੀ ਮਹਿ; ਜੋਤਿ ਰਲਿ ਜਾਇਆ ॥"
page = 885
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In fire, the fire is mingled."

