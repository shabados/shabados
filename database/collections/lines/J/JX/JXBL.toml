data = "ਤਾ ਕੀ ਕੀਮਤਿ; ਕਹਣੁ ਨ ਜਾਈ ॥"
page = 621
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "whose worth cannot be described."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਮੁੱਲ ਪਾਇਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His worth cannot be described."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੀ ਕੀਮਤਿ ਕਹੀ ਨਹੀਂ ਜਾਤੀ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਕਦਰ-ਕੀਮਤ ਨਹੀਂ ਦੱਸੀ ਜਾ ਸਕਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su Valor no lo puedo descifrar."