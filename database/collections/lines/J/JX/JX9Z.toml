[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਜਉ ਤਿਆਗਿ ਦਈ ॥"
page = 891
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, when man abandons mammon,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਜਦ ਬੰਦਾ ਮਾਇਆ ਨੂੰ ਛੱਡ ਦਿੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, when you abandon it,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਜਬ ਇਹ ਮਾਇਆ ਤਿਆਗ ਦਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਜਦੋਂ ਕਿਸੇ ਮਨੁੱਖ ਨੇ ਇਸ ਨੂੰ (ਮਨੋਂ) ਛੱਡ ਦਿੱਤਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਉ = ਜਦੋਂ। ਤਿਆਗਿ ਦਈ = ਛੱਡ ਦਿਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak: Cuando la hice a un lado y la abandoné en mi meditación,"