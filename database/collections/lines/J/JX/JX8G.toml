[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤ੍ਰੈ ਗੁਣ ਕੀ; ਓਸੁ ਉਤਰੀ ਮਾਇ ॥"
page = 888
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Mammon of three qualities departs from him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਿੰਨਾਂ ਲੱਛਣਾਂ ਵਾਲੀ ਮਾਇਆ ਉਸ ਕੋਲੋਂ ਦੂਰ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Maya, of the three qualities, leaves him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਸੀ ਪੰਡਤ ਕੀ ਤ੍ਰਿਗੁਣੀ ਮਾਇਆ ਉਤਰੀ ਹੈ, ਭਾਵ ਸਤੋ, ਰਜੋ, ਤਮੋ, ਸੇ ਓਹੀ ਰਹਿਤ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਿੰਨਾਂ ਗੁਣਾਂ ਵਾਲੀ ਇਹ ਮਾਇਆ ਉਸ ਮਨੁੱਖ ਉਤੇ ਆਪਣਾ ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਸੁ = ਉਸ ਮਨੁੱਖ ਦੀ। ਉਤਰੀ = ਲਹਿ ਜਾਂਦੀ ਹੈ। ਤ੍ਰੈ ਗੁਣ ਕੀ ਮਾਇ = ਤਿੰਨ ਗੁਣਾਂ ਵਾਲੀ ਮਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y se libera del cochambre de la Maya de las tres cualidades."