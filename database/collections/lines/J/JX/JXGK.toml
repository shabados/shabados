[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਸੁਮਤਿ ਸੁ ਧਾਰ ॥੬੨੧॥"
page = 745

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying “Ghari-ari-naadani” in the beginning and then adding “Ripu Ari” at the end, the names of Tupak are formed.621."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤੁਪਕ ਦਾ ਨਾਮ ਹੋ ਜਾਏਗਾ। ਸੂਝਵਾਨ ਮਨ ਵਿਚ ਸੋਚ ਲੈਣ ॥੬੨੧॥"