[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਬਦੇ; ਵਿਚਹੁ ਭਰਮੁ ਚੁਕਾਏ ॥"
page = 1067
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and through the Name, drives out doubt from within him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਨਾਮ ਦੇ ਰਾਹੀਂ ਉਸ ਦੇ ਅੰਦਰ ਸੰਦੇਹ ਬਾਹਰ ਕੱਢ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Within the Shabad, doubt is driven out."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਗੁਰ ਉਪਦੇਸ਼ ਕਰ ਕੇ ਵਿਚੋਂ ਭਰਮ ਚੁਕਾਇ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ ਹੀ (ਉਸ ਦੇ) ਅੰਦਰੋਂ ਭਟਕਣਾ ਦੂਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਬਦੇ = ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ। ਵਿਚਹੁ = ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚੋਂ। ਭਰਮੁ = ਭਟਕਣਾ। ਚੁਕਾਏ = ਦੂਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "uno es liberado de la duda."