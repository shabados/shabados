data = "(ਕਵੀ) ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, (ਉਸ ਨੇ) ਮਨ ਵਿਚ ਕ੍ਰੋਧ ਵਧਾ ਲਿਆ ਹੈ ॥੧੮੪੧॥"