[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਰਹ ਕੀ ਜੈਸੀ; ਤੇਰੀ ਚਾਲ ॥"
page = 1196
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thy gait is like that of a cow, o man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਟੋਰ ਗਾਂ ਵਰਗੀ ਹੈ, ਹੇ ਬੰਦੇ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You walk like a cow."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸੁਰਹ) ਦੇਵਤੋ ਸਾਰਖੀ ਤੇਰੀ (ਚਾਲ) ਰਹਿਣੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਕੁੱਤੇ!) ਗਾਂ ਵਰਗੀ ਤੇਰੀ ਤੋਰ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਰਹ = {Skt. सुरभि} ਗਾਂ। ਚਾਲ = ਤੋਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Caminas como vaca,"