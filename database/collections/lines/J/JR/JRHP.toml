data = "ਸੁਤਸਿੰਧ ਅਧੋ ਮੁਖ ਤਾਪ ਤਪੈ ॥"
page = 31

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The son of ocean ie moon with face upside down performs austerities for His realization!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਮੁੰਦਰ ਦਾ ਪੁੱਤਰ (ਚੰਦ੍ਰਮਾ ਜਿਸ ਦਾ) ਮੂਧੇ ਮੂੰਹ ਤਪ ਕਰ ਰਿਹਾ ਹੈ;"