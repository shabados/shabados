[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਸਾਸ ਬਿਨਾ; ਮਿਰਤਕ ਕੀ ਲੋਥਾ ॥"
page = 280
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "as the corpse of a dead man is without breath."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਮਰੇ ਹੋਏ ਬੰਦੇ ਦੀ ਲਾਸ਼ ਸਾਹ ਦੇ ਬਗੈਰ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "like the corpse of a dead man, without the breath of life."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਸ੍ਵਾਸ ਬਿਨਾਂ ਮ੍ਰਿਤਕ ਕੀ ਲੋਥ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਪ੍ਰਾਣਾਂ ਤੋਂ ਬਿਨਾ ਮੁਰਦਾ ਲੋਥ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਰਤਕ = ਮੁਰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "como si fuera un cadáver;"