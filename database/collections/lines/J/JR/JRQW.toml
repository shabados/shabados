language = "pa"
data = "ਦੋਵੇਂ ਜਹਾਨ ਉਸ ਦੇ ਹੁਕਮ ਦੀ ਪਾਲਨਾ ਕਰਨ ਵਾਲੇ ਹੋ ਜਾਂਦੇ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਹਰ ਦੋ ਆਲਮ ਬੰਦਾਇ ਫ਼ਰਮਾਨਿ ਊ ॥੩੪੩॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "He is the lighted oil lamp of the long and wedding night of confluence,"