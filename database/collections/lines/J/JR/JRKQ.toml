[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਸਥਿਰ ਰਹਹੁ. ਡੋਲਹੁ ਮਤ ਕਬਹੂ; ਗੁਰ ਕੈ ਬਚਨਿ ਅਧਾਰਿ ॥"
page = 678
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remain firm, wobble thou never, and have the mainstay of the Guru's word."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦ੍ਰਿੜ, ਰਹੁ, ਤੂੰ ਕਦਾਚਿਤ ਡਿਕੋਡੋਲੇ ਨਾਂ ਖਾ ਅਤੇ ਗੁਰਾਂ ਦੀ ਬਾਣੀ ਦੀ ਓਟ ਲੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remain firm and steady, and do not ever waver; take the Guru's Word as your Support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਕੇ ਬਚਨੋਂ ਕੇ ਆਸਰੇ ਹੋ ਕਰ ਸਦਾ ਇਸਥਿਤ ਰਹੋ, (ਮਤ) ਕਬੀ ਡੁਲਾਇਵਾਨ ਨ ਹੋਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਜਿੰਦੇ!) ਗੁਰੂ ਦੇ ਉਪਦੇਸ਼ ਉਤੇ ਤੁਰ ਕੇ, ਗੁਰੂ ਦੇ ਆਸਰੇ ਰਹਿ ਕੇ, ਤੂੰ ਭੀ (ਕਾਮਾਦਿਕ ਵੈਰੀਆਂ ਦੇ ਟਾਕਰੇ ਤੇ) ਪੱਕੇ ਪੈਰਾਂ ਤੇ ਖਲੋ ਜਾ, ਵੇਖੀਂ, ਹੁਣ ਕਦੇ ਭੀ ਨਾਹ ਡੋਲੀਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਬਹੂ = ਕਦੇ ਭੀ। ਕੈ ਬਚਨਿ = ਦੇ ਬਚਨ ਵਿਚ। ਕੈ ਅਧਾਰਿ = ਦੇ ਆਸਰੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Estate en Paz ahora y no te preocupes, sólo apóyate en la Palabra del Shabd del Guru"