[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਕਜ ਕਜਣੋ ਕ੍ਰਿਤੰ ਨ੍ਰਿਲਜ ਸਰਬਤੋ ਫਿਰੰ ॥"
page = 555

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Making the announcement of wicked action, the people .will roam unashamedly"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਾ ਲੁਕਾਉਣ ਵਾਲੇ ਕਰਮਾਂ ਨੂੰ ਲੁਕਾਉਣਗੇ ਅਤੇ ਸਾਰਿਆਂ ਵਿਚ ਨਿਰਲਜ ਹੋ ਕੇ ਫਿਰਨਗੇ।"