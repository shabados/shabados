[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਹ ਵੇਲਾ ਹਥਿ. ਨ ਆਵੈ; ਫਿਰਿ ਪਛੁਤਾਵਣਾ ॥੬॥"
page = 645
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That time, when he could meditate on God, returns not to man's hand again and he ultimately regrets."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਵਕਤ, ਮੁੜ ਕੇ ਉਸ ਦੇ ਹੱਥ ਨਹੀਂ ਆਉਂਦਾ ਅਤੇ ਉਹ ਆਖਿਰ ਨੂੰ ਅਫਸੋਸ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That lost opportunity will not come into his hands again, and in the end, he regrets and repents. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਮਾਨੁਖ ਜਨਮ ਕਾ ਸਮਾਂ ਪੁਨਾ: ਹਾਥ ਆਵਤਾ ਨਹੀਂ ਹੈ, ਤਿਸ ਤੇ ਪੁਨਃ ਪਛਤਾਵਤਾ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਨੁੱਖ-ਜਨਮ ਵਾਲਾ) ਉਹ ਸਮਾ ਫੇਰ ਮਿਲਦਾ ਨਹੀਂ, ਇਸ ਵਾਸਤੇ ਪਛੁਤਾਉਂਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo queda lamentarse y arrepentirse! (6)"