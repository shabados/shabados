type = "primary"
data = "ਗਿਰੇ ਭਾਤਿ ਐਸੀ ਸੁ ਮਾਨੋ ਮੁਨਾਰੇ ॥੨੫॥"
page = 1009

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Some had their stomachs gashed and fell like minarets.(25)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਡਿਗ ਪਏ ਹਨ ਮਾਨੋ ਮੁਨਾਰੇ ਹੋਣ ॥੨੫॥"