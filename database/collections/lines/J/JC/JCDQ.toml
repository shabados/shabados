[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਜਾਣੈ; ਸਾਚਾ ਸੋਇ ॥"
page = 6
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Nanak! Only the True Lord Himself knows His greatness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਆਪਣੀ ਵਿਸ਼ਾਲਤਾ ਉਹ ਸੱਚਾ ਸਾਈਂ ਖੁਦ ਹੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the True Lord knows."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਸੋਈ ਸਚਾ ਸਭ ਨੂੰ ਜਾਣਦਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਹਰੀ ਆਪ ਹੀ ਜਾਣਦਾ ਹੈ (ਕਿ ਉਹ ਕੇਡਾ ਵੱਡਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚਾ ਸੋਇ = ਉਹ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਅਕਾਲ ਪੁਰਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, el Verdadero Señor sabe"