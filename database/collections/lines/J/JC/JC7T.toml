[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕਉ; ਸਦ ਬਲਿ ਜਾਈ ਜੀਉ ॥੨॥"
page = 217
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto my Lord., I am, ever, a sacrifice."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਸਾਹਿਬ ਉਤੋਂ ਮੈਂ ਸਦੀਵ ਹੀ ਕੁਰਬਾਨ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am forever a sacrifice to God. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਆਪ ਕੇ ਸਦਾ ਬਲਿਹਾਰੇ ਜਾਤਾ ਹੂੰ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਦਾ ਉਸ ਪ੍ਰਭੂ ਤੋਂ ਹੀ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ, ਤੋਂ। ਬਲਿ ਜਾਈ = ਮੈਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ofrezco mi ser siempre en sacrificio a mi Señor.(2)"