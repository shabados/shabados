[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਨਾਮੁ; ਦੀਓ ਗੁਰਿ ਮੰਤ੍ਰੁ ॥"
page = 190
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru has given me the mantra of god's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਰੱਬ ਦੇ ਨਾਮ ਦਾ ਮੰਤ੍ਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru has given me the Mantra of the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਨੇ ਹਰੀ ਨਾਮ ਰੂਪੀ ਮੰਤ੍ਰ ਦੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਗੁਰੂ ਨੇ (ਜਿਸ ਮਨੁੱਖ ਨੂੰ) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਮੰਤ੍ਰ ਦਿੱਤਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru me dio el Mantra del Naam, el Nombre del Señor,"