[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦਾ ਸੰਗਿ; ਤਾ ਕਉ ਮਨ ਜਾਪਿ ॥"
page = 183
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul remember Him who is ever with Thee,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਆਤਮਾ ਉਸ ਦਾ ਸਿਮਰਣ ਕਰ, ਜੋ ਹਮੇਸ਼ਾਂ ਹੀ ਤੇਰੇ ਅੰਗ ਸੰਗ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, meditate on the One who is always with you."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਜੋ ਸਦਾ ਸੰਗ ਹੈ ਤਿਸ ਕੋ ਜਪੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਹਰ ਵੇਲੇ ਤੇਰੇ ਅੰਗ-ਸੰਗ ਹੈ, ਉਸਦਾ ਭਜਨ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕਉ = ਉਸ ਪ੍ਰਭੂ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Él solamente está siempre con nosotros. ¡Medita en Él, oh mi mente,"