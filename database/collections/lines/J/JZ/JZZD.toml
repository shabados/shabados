[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਵਨਹਾਰ ਦਾਤਾਰ ॥"
page = 895
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Beneficent Lord is the Giver of all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਰਿਆ ਦਿਲ ਪ੍ਰਭੂ ਸਾਰਿਆਂ ਨੂੰ ਦੇਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord God is the Great Giver."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪਰਮੇਸਰ ਦੇਵਨਹਾਰ ਦਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਇਹ ਯਾਦ ਰੱਖ ਕਿ) ਦਾਤਾਂ ਦੇਣ ਵਾਲਾ ਪ੍ਰਭੂ (ਸਭ ਕੁਝ) ਦੇਣ ਦੇ ਸਮਰੱਥ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਵਨਹਾਰ = ਸਭ ਕੁਝ ਦੇਣ ਦੀ ਤਾਕਤ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tu Señor Benévolo es el Único Dador;"