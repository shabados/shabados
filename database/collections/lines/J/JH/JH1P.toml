[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਟ ਬਾਹ ਕਟੀ ਜਨੁ ਇੰਦ੍ਰ ਧੁਜੰ ॥"
page = 167

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The chopped long arms of the warriors look like the flag of Indra"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਯੋਧਿਆਂ ਦੀਆਂ ਕਟੀਆਂ ਬਾਂਹਵਾਂ (ਇੰਜ ਪ੍ਰਤੀਤ ਹੋ ਰਹੀਆਂ ਸਨ) ਮਾਨੋ ਇੰਦਰ ਦੀ ਧੁਜਾ ਹੋਵੇ।"