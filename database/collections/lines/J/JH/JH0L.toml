[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਯੋਂ ਕਹਿ ਪਾਇਨ ਪੈ ਹਮਰੇ ਹਮ ਸੰਗ ਕਹ︀ਯੋ ਸੁ ਤਹਾ ਤੁਮ ਜਾਵਹੁ ॥"
page = 393

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“The gopis falling at my feet said, ‘O Udhava! go and ask Krishna to come"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਕਹਿ ਕੇ ਪੈਰੀਂ ਪੈ ਕੇ ਸਾਡੇ ਵਲੋਂ ਕਹਿਣਾ ਹੈ ਕਿ ਤੁਸੀਂ ਉੱਥੇ ਜਾਓ।"