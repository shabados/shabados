data = "ਜਿਨ ਕੈ ਹਿਰਦੈ; ਹਰਿ ਹਰਿ ਸੋਈ ॥"
page = 228
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In whose heart that Lord God abides,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਦੇ ਦਿਲ ਵਿੱਚ ਉਹ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਵਸਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those whose hearts are filled with the Lord, Har, Har"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੇ ਹਿਰਦੇ ਮੇਂ ਭਗਤੋਂ ਕੇ ਕਲੇਸ਼ ਹਰਤਾ ਹਰੀ ਬਸਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਦੇ ਹਿਰਦੇ ਵਿਚ ਉਹ (ਦਇਆ-ਨਿਧਿ) ਪਰਮਾਤਮਾ ਵੱਸਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquellos cuyos corazones son llenos con el Señor. Jar , Jar"