[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵੈ ਜਾਇ; ਦੂਜੈ ਲੋਭਾਇ ॥"
page = 664
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Fascinated by another, he comes and goes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਵੈਤ ਵਿੱਚ ਫੱਸਿਆ ਉਹ ਆਉਂਦਾ (ਜੰਮਦਾ) ਤੇ ਜਾਂਦਾ (ਮਰਦਾ) ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In attachment to duality, it comes and goes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਤੇ ਇਹ ਜੀਵ ਦ੍ਵੈਤ ਮੇਂ ਲੁਭਾਯਾ ਹੂਆ ਆਵਤਾ ਜਾਤਾ ਅਰਥਾਤ ਜਨਮਤਾ ਮਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਵਿਚ ਪਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਵੈ ਜਾਇ = ਜੰਮਦਾ ਹੈ ਮਰਦਾ ਹੈ। ਦੂਜੈ = ਪਰਮਾਤਮਾ ਤੋਂ ਬਿਨਾ ਹੋਰ ਵਿਚ, ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ। ਲੋਭਾਇ = ਲੋਭ ਕਰ ਕੇ, ਫਸ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y en la fascinación por el otro, va y viene."