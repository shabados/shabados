[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਿ ਅਖਾੜਾ ਪਾਇਦਾ ਪਿਆਰਾ; ਕਰਿ ਵੇਖੈ ਆਪਿ ਚੋਜਾਹਾ ॥"
page = 606
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Himself, the Beloved sets up the arena, and performing the plays Himself, He beholds them."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਹੀ ਪਿਆਰਾ-ਪ੍ਰਭੂ ਪਿੜ ਬੰਨ੍ਹਦਾ ਹੈ ਅਤੇ ਤਮਾਸ਼ੇ ਰੱਚ ਕੇ ਆਪੇ ਹੀ ਉਨ੍ਹਾਂ ਨੂੰ ਦੇਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Beloved Himself sets the stage; He performs the plays, and He Himself watches them."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਹੀ ਮਲ ਅਖਾੜਾ ਪਾਉਤਾ ਹੈ, ਆਪੇ ਹੀ ਪ੍ਯਾਰਾ ਤਿਸ (ਚੋਜਾਹਾ) ਕੌਤਕ ਕੋ ਕਰ ਕੇ ਦੇਖਤਾ ਭਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪ੍ਰਭੂ ਆਪ ਹੀ (ਇਹ ਜਗਤ ਦਾ) ਅਖਾੜਾ ਬਣਾਣ ਵਾਲਾ ਹੈ, (ਇਸ ਜਗਤ-ਅਖਾੜੇ ਵਿਚ) ਆਪ ਹੀ ਕੌਤਕ-ਤਮਾਸ਼ੇ ਰਚ ਕੇ ਵੇਖ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਖਾੜਾ = (ਜਗਤ-) ਪਿੜ। ਚੋਜਾਹਾ = ਤਮਾਸ਼ੇ, ਖੇਡਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo levanta el escenario; Él Mismo está complacido con Su obra."