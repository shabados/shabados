[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਝੁ ਗੁਰੂ; ਗੁਬਾਰਾ ॥"
page = 1004
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Guru, there is pitch darkness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਬਾਝੌ ਕਾਲਾ ਬੋਲਾ ਅਨੇਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Guru, there is only pitch darkness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਿਨਾਂ ਗੁਰੋਂ ਸੇ ਅੰਧ ਗੁਬਾਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਤੋਂ ਬਿਨਾ (ਜਗਤ ਵਿਚ ਆਤਮਕ ਜੀਵਨ ਵਲੋਂ) ਹਨੇਰਾ (ਹੀ ਹਨੇਰਾ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਬਾਰਾ = ਹਨੇਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Guru, todo es oscuridad,"