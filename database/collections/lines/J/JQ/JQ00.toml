[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਮ ਜਨਮ ਕਾ ਸੋਇਆ ਜਾਗੈ ॥੩॥"
page = 1144
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Asleep for millions of births, he then wakes up."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾਂ ਹੀ ਜਨਮਾਂ ਦਾ ਸੁੱਤਾ ਹੋਇਆ, ਤਦ ਉਹ ਜਾਗ ਉਠਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Asleep for countless incarnations, he now awakens. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਨਮ ਜਨਮ ਕਾ ਸੋਯਾ ਹੂਆ ਜੀਵ ਜਾਗ ਪੜਤਾ ਹੈ॥੩॥☬ਜਾਗ ਕਰ ਐਸੇ ਬੇਨਤੀ ਕਰਤਾ ਹੈ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਮਨੁੱਖ (ਮਾਇਆ ਦੇ ਮੋਹ ਦੀ ਨੀਂਦ ਵਿਚ) ਅਨੇਕਾਂ ਜਨਮਾਂ ਦਾ ਸੁੱਤਾ ਹੋਇਆ ਜਾਗ ਪੈਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਗੈ = ਜਾਗ ਪੈਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ese ser despierta en su Destino verdadero después de vagar a través de millones de nacimientos y muertes. (3)"