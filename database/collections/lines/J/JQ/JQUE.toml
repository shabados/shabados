[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਨਾਉ ਅਤਿ ਵਡ ਊਚਾ; ਊਚੀ ਹੂ ਊਚਾ ਹੋਈ ॥"
page = 1416
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Supremely great and high and the highest of the high is the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਹਾਨ ਭਾਰੀ ਉਚਾ ਅਤੇ ਉਚਿਆ ਦਾ ਪਰਮ ਉਚਾ ਹੈ ਪ੍ਰਭੂ ਦਾ ਨਾਮ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Name of the Lord is utterly great, lofty and high, the highest of the high."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕਾ ਨਾਮ ਜੋ ਸਭ ਸੇ ਅਤਸੈ ਕਰ ਬਡਾ ਊਚਾ ਹੈ ਤਿਸ ਕੋ ਜਪ ਕਰ ਪੁਰਸ਼ ਉਚੇ ਦੇਵਤਿਓਂ ਆਦਿਕੋਂ ਤੇ ਭੀ ਊਚਾ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮਣਾ ਬਹੁਤ ਵੱਡਾ ਹੈ, ਬੇਅੰਤ ਉੱਚਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਉ = ਨਾਮਣਾ, ਵਡਿਆਈ। ਊਚੀ ਹੂ ਊਚਾ = ਉੱਚੇ ਤੋਂ ਉੱਚਾ, ਬਹੁਤ ਹੀ ਉੱਚਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Nombre del Señor es Grandioso, Lo más Elevado de lo elevado,"