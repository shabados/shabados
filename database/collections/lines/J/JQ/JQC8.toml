[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਢਾਢੀ ਗੁਣ ਗਾਵੈ ਨਿਤ; ਜਨਮੁ ਸਵਾਰਿਆ ॥"
page = 790
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Bard ever sings God's praises to embellish his life."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਜੀਵਨ ਸ਼ਸ਼ੋਭਤ ਕਰਨ ਲਈ, ਭੱਟ ਸਦਾ ਵਾਹਿਗੁਰੂ ਦੀਆਂ ਸਿਫਤਾਂ ਗਾਇਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The minstrel continually sings the Glorious Praises of the Lord, to embellish his life."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਢਾਢੀ) ਜਸ ਕਰਨੇ ਵਾਲਾ ਨਿਤ੍ਯ ਹੀ ਗੁਣੋਂ ਕੋ (ਗਾਵੈ) ਗਾਵਤਾ ਹੈ, ਅਰ ਤਿਸ ਨੇ ਅਪਨਾ ਜਨਮੁ ਸਵਾਰਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਢਾਢੀ ਸਦਾ ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਗਾਉਂਦਾ ਹੈ ਤੇ ਆਪਣਾ ਜੀਵਨ ਸੋਹਣਾ ਬਣਾਂਦਾ ਹੈ;"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El músico, oh Dios, canta Tu Alabanza para que bendigas su vida."