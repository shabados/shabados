[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਿ ਤਨਿ; ਰਾਮ ਕੋ ਬਿਉਹਾਰੁ ॥"
page = 1222
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints ' mind and body deal only in the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤਾਂ ਦਾ ਚਿੱਤ ਤੇ ਦੇਹਿ ਕੇਵਲ ਸਾਹਿਬ ਦਾ ਹੀ ਵਣਜ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind and body deal only in the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨ ਮਨ ਤਨ ਕਰ ਕੇ ਰਾਮ ਨਾਮ ਕਾ ਬਿਉਹਾਰ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਦੇ ਮਨ ਵਿਚ ਹਿਰਦੇ ਵਿਚ (ਸਦਾ) ਪਰਮਾਤਮਾ ਦਾ (ਨਾਮ ਸਿਮਰਨ ਦਾ ਹੀ) ਆਹਰ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਤਨਿ = ਤਨ ਵਿਚ। ਕੋ = ਦਾ। ਬਿਉਹਾਰੁ = ਆਹਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi ser comercia sólo en referencia a Dios,"