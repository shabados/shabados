data = "ਵਹ ਜਾਨੈ ਮੇਰੇ ਹੀ ਜੈਹੈ ॥੩॥"
page = 884

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "One thought he would come to her and other thought he would come to her.(3)"

[[content]]
