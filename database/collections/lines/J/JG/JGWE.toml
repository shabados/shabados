language = "pa"
data = "ਅਤੇ ਉਹ (ਦੂਜੀ) ਸੋਚਦੀ ਕਿ ਮੇਰੇ ਘਰ ਖਾਣਾ ਖਾਵੇਗਾ ॥੩॥"