[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਸਦੀ ਕਰਾਮਾਤ ਅਤੇ ਉਸਦੇ ਚੋਜ ਦੈਵੀ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਕਰਾਮਾਤੋ ਇਹਜਾਜ਼ਿ ਊ ਕਿਬਰੀਆ ॥੫੦॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, His miracles and antics are divine and celestial. (50)"