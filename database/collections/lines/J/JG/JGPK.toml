[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕਾ ਬਚਨੁ; ਕਤਹੁ ਨ ਜਾਇ ॥"
page = 177
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru 's word (stays with the man, and) never goes anywhere."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦਾ ਸ਼ਬਦ (ਇਨਸਾਨ ਦੇ ਨਾਲ ਰਹਿੰਦਾ ਹੈ ਅਤੇ) ਕਦਾਚਿੱਤ ਕਿਧਰੇ ਨਹੀਂ ਜਾਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru's Word never goes away;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰ ਕਾ ਬਚਨ ਕਬੀ ਵਿਅਰਥ ਨਹੀਂ ਜਾਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦਾ ਉਪਦੇਸ਼ ਕਦੇ ਵਿਅਰਥ ਨਹੀਂ ਜਾਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਤਹੁ = ਕਿਤੇ ਭੀ। ਜਾਇ = ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Shabd del Guru se queda siempre contigo;"