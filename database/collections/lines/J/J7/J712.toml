data = "ਜੈ ਸਬਦ ਦੇਵ ਭਾਖਤ ਪੁਕਾਰ ॥੫੧੨॥"
page = 253

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "These brave fighters are absorbed in fight and on the other hand, the gods are raising the sound of victory.512."

