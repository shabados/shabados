[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲੋਭ ਮੋਹ ਅਹੰਕਾਰ, ਧੋਹ ਕਮਾਵਣੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many, controlled by greed, infatuation and ego, go on swindling and cheating."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਕਈ) ਲੋਭ, ਮੋਹ, ਹੰਕਾਰ ਤੇ ਛਲਾਂ (ਵਿਚ ਹੀ ਉਮਰ ਕੱਟਦੇ ਹਨ।"