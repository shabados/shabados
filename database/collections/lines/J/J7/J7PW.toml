[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕਿ. ਰਾਜੁ ਚਲਾਇਆ; ਸਚੁ ਕੋਟੁ ਸਤਾਣੀ ਨੀਵ ਦੈ ॥"
page = 966
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak established the Lord's empire and laid a very strong foundation of the fortress of truth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੇ ਪ੍ਰਭੂ ਦੀ ਪਾਤਿਸ਼ਾਹੀ ਕਾਇਮ ਕੀਤੀ ਅਤੇ ਸੱਚ ਦੇ ਕਿਲ੍ਹੇ ਦੀ ਨਿਹਾਇਤ ਮਜ਼ਬੂਤ ਬੁਨਿਆਦ ਰੱਖੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak established the kingdom; He built the true fortress on the strongest foundations."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਨਾਨਕ ਸਾਹਿਬ ਜੀ ਨੇ ਐਸਾ ਰਾਜ ਚਲਾਇਆ ਹੈ, ਜੋ ਸਚੇ ਨਾਮ ਕਾ ਕੋਟੁ ਕੀਆ ਹੈ ਔਰ (ਸਤਾਣੀ) ਸਹਿਤ ਬਲ ਕੇ ਸਰਧਾ ਭਗਤੀ ਕੀਨੀ ਵਾ ਦਿਤੀ, ਭਾਵ (ਰਾਜੁ) ਪ੍ਰਕਾਸ ਅਰਥਾਤ ਗਿਆਨ ਦੁਆਰੇ ਸੈਂ ਸਰੂਪ ਮੇਂ ਇਸਥਿਤ ਹੋਣੇ ਕੇ ਵਾਸਤੇ ਭਗਤੀ ਕੀ ਮੁਖਤਾ ਰਖੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਉੱਚੇ ਨਾਮਣੇ ਵਾਲੇ ਗੁਰੂ) ਨਾਨਕ ਦੇਵ ਜੀ ਨੇ ਸੱਚ-ਰੂਪ ਕਿਲ੍ਹਾ ਬਣਾ ਕੇ ਅਤੇ ਪੱਕੀ ਨੀਂਹ ਰੱਖ ਕੇ (ਧਰਮ ਦਾ) ਰਾਜ ਚਲਾਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕਿ = ਨਾਨਕ ਨੇ। ਕੋਟੁ = ਕਿਲ੍ਹਾ। ਸਤਾਣੀ = ਤਾਣ ਵਾਲੀ, ਬਲ ਵਾਲੀ। ਨੀਵ = ਨੀਂਹ। ਦੈ = ਦੇ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo los que son bendecidos, son aprobados."