[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ; ਕੇਵਲ ਨਾਮੁ ਅਧਾਰੀ ॥੧॥ ਰਹਾਉ ॥"
page = 207
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "whose sole support is God's Name. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਆਸਰਾ ਸਿਰਫ ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ ਹੀ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "who take the Support of the Naam. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਏਕ ਨਾਮ ਕਾ ਹੀ (ਅਧਾਰੀ) ਆਸਰਾ ਕਰਨੇ ਵਾਲੇ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਦੇ ਹਿਰਦੇ ਵਿਚ ਸਿਰਫ਼ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ (ਹੀ ਜ਼ਿੰਦਗੀ ਦਾ) ਆਸਰਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੈ = ਜਿਸ ਦੇ ਹਿਰਦੇ ਵਿਚ। ਅਧਾਰੀ = ਆਸਰਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que se apoya solamente en el Naam, el Nombre del Señor.  (1-Pausa)"