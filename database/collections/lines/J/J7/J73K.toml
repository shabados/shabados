[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮੁ ਕਰਿ ਦੇਖਹਿ ਨਾਲੀ ॥"
page = 1085
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that they ever see the Transcendent Lord with them."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿ ਉਹ ਪਰਮ ਪ੍ਰਭੂ ਨੂੰ ਸਦਾ ਆਪਣੇ ਨਾਲ ਵੇਖਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "they behold the Supreme Lord God with them."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਾਰਬ੍ਰਹਮ ਕੋ ਸਾਥ ਕਰ ਦੇਖਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਉਹ ਪਰਮਾਤਮਾ ਨੂੰ (ਸਦਾ ਆਪਣੇ) ਨਾਲ ਹੀ ਵੱਸਦਾ ਵੇਖਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ, ਸਮਝ ਕੇ। ਨਾਲੀ = (ਆਪਣੇ) ਨਾਲ ਹੀ। ਦੇਖਹਿ = ਵੇਖਦੇ ਹਨ {ਬਹੁ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ellos logran ver a Su Dios en el Interior de Su Ser"