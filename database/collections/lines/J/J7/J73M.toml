[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕੇ ਅੰਤ; ਨ ਪਾਏ ਜਾਹਿ ॥"
page = 5
line = 9

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਅਨਪੁਰਖ ਬਹੁਵਚਨ ਕਿਰਿਆ"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "but His limits are not found."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੰਤੂ ਉਸਦੇ ਓੜਕਾਂ ਦਾ ਪਤਾ ਨਹੀਂ ਲੱਗਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but His limits cannot be found."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਅਕਾਲ ਪੁਰਖ ਕੇ ਗੁਣੋਂ ਕੇ ਅੰਤ ਤਿਨਸੇਂ ਨਹੀਂ ਪਾਏ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਉਸ ਦੇ ਹੱਦ-ਬੰਨੇ ਲੱਭੇ ਨਹੀਂ ਜਾ ਸਕਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕੇ ਅੰਤ = ਉਸ ਅਕਾਲ ਪੁਰਖ ਦੇ ਹੱਦ-ਬੰਨੇ। ਨ ਪਾਏ ਜਾਹਿ = ਲੱਭੇ ਨਹੀਂ ਜਾ ਸਕਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero sus poderes no tienen limites."