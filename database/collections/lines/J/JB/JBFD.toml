[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਫਿਰਿ ਵੇਲਾ ਹਥਿ. ਨ ਆਵਈ; ਜਮਕਾਲਿ ਵਸਿ ਕਿਤਾ ॥"
page = 787
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When death's myrmidon seizes him, then the opportunity is lost."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਮੌਤ ਦੇ ਫ਼ਰਿਸ਼ਤੇ ਨੇ ਉਸ ਨੂੰ ਪਕੜ ਲਿਆ ਤਦ ਉਸ ਨੂੰ ਇਹ ਮੌਕਾ ਹੱਥ ਨਹੀਂ ਲੱਗਣਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This opportunity will not come into his hands again; the Messenger of Death will seize him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਮਕਾਲ ਕਰਤਾ ਨੇ ਜਬ ਜੀਵ ਕੋ ਅਪਣੇ ਵਸ ਕੀਆ ਫੇਰ ਇਸ ਕੋ ਏਹੁ (ਵੇਲਾ) ਮਾਨੁਖ ਜਨਮ ਕਾ ਸਮਾਂ ਹਾਥ ਨਹੀਂ ਆਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਜਦੋਂ ਮੌਤ ਨੇ ਆ ਨੱਪਿਆ ਤਦੋਂ ਇਹ ਗੁਆਚਾ ਸਮਾ ਮੁੜ ਮਿਲਦਾ ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando la muerte lo apergolla, no le queda oportunidad para escapar."