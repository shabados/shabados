[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਦਇਆਲਿ; ਪੂਰੀ ਮੇਰੀ ਆਸ ॥"
page = 1182
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The compassionate Guru has fulfilled my desire."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਇਆਵਾਨ ਗੁਰਾਂ ਨੇ ਮੇਰੀ ਖਾਹਿਸ਼ ਪੂਰਨ ਕਰ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Merciful Guru has fulfilled my hopes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਗੁਰੂ ਨੇ ਦ੍ਯਾਲ ਹੋ ਕੇ ਮੇਰੀ ਆਸ ਪੂਰੀ ਕਰ ਦਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦਇਆਵਾਨ ਗੁਰੂ ਨੇ ਮੇਰੀ (ਚਿਰਾਂ ਦੀ) ਆਸ ਪੂਰੀ ਕਰ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ। ਦਇਆਲਿ = ਦਇਆਲ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh ¡qué Bondadoso es mi Guru que me ha dado la Satisfacción de mi ser!"