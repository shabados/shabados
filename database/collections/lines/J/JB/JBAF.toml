[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਹੁੜਿ; ਜਨਮੁ ਨ ਹੋਇ ਹੈ ਮਰਣਾ ॥੧॥ ਰਹਾਉ ॥"
page = 154
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Again, he is not born and he dies not. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁੜ ਕੇ ਉਸ ਦਾ ਜਨਮ ਨਹੀਂ, ਹੁੰਦਾ ਤੇ ਉਹ ਮਰਦਾ ਨਹੀਂ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Then, one is not born again, and is not subject to death. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਫੇਰ ਜਨਮੁ ਮਰਨੁ ਨਹੀਂ ਹੋਤਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇਹੜਾ ਲੰਘ ਜਾਂਦਾ ਹੈ ਉਸ ਨੂੰ) ਮੁੜ ਨਾਹ ਜਨਮ ਹੁੰਦਾ ਹੈ ਨਾਹ ਮੌਤ। (ਉਸ ਅਵਸਥਾ ਨੂੰ ਤੁਰੀਆ ਅਵਸਥਾ ਕਹਿ ਲਵੋ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y entonces uno ni nace ni muere otra vez. (1-Pausa)"