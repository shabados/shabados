[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਿ ਗੁਪਾਲ ਦਇਆਲ ਸਤਸੰਗਤਿ; ਨਾਨਕ. ਜਗੁ ਜਾਨਤ ਸੁਪਨਾ ॥੪॥"
page = 1387
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, in the saints' society, remember thou the Merciful Master, the Cherisher of the universe and deem the world to be just a dream."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਸਾਧ ਸਭਾ ਅੰਦਰ ਤੂੰ ਆਲਮ ਦੇ ਪਾਲਣਹਾਰ ਮਿਹਰਬਾਨ ਮਾਲਕ ਦਾ ਚਿੰਤਨ ਕਰ ਅਤੇ ਸੰਸਾਰ ਨੂੰ ਕੇਵਲ ਇਕ ਸੁਫਨਾ ਹੀ ਜਾਣ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate in remembrance on the Merciful Lord of the World, O Nanak, in the Sat Sangat, the True Congregation. Know that the world is just a dream. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਹੇ ਭਾਈ! ਜੋ ਜਗਤ ਕੋ ਸੁਪਨੇ ਵਤ ਅਸੱਤ ਜਾਨਤੇ ਹੈਂ ਐਸੇ ਜੋ ਸੰਤ ਪਰਮ ਦਿਆਲੂ ਹੈਂ, ਤਿਨ ਕੀ ਸੰਗਤਿ ਕਰ ਕੇ ਗੋਪਾਲ ਕਾ ਸਿਮਰਨ ਕਰ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ (ਦੇ ਮਨ!) ਸੰਸਾਰ ਨੂੰ ਸੁਫ਼ਨਾ ਜਾਣ ਕੇ ਸਤ-ਸੰਗਤ ਵਿਚ (ਟਿਕ ਕੇ) ਗੋਪਾਲ ਦਇਆਲ ਹਰੀ ਨੂੰ ਸਿਮਰ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਨਤ = ਜਾਣ ਕੇ, ਜਾਣਦਾ ਹੋਇਆ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Medita en el Misericordioso Señor del mundo, oh dice Nanak, en la Compañía de la Saad Sangat y entiende que el mundo es sólo un sueño. (4)"