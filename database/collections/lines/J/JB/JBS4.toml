[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਈ ਭਗਤੁ; ਸੁਘੜੁ ਸੋੁਜਾਣਾ ॥"
page = 1335
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he alone is an accomplished and wise saint."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਕਾਮਲ ਅਤੇ ਸਿਆਣਾ ਹੈ ਸੰਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "is a wise and knowing devotee."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਭਗਤੁ (ਸੁਘੜੁ) ਉਤਮ ਘਾੜਤ ਵਾਲਾ ਔ (ਸਜਾਣਾ) ਚਤਰੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਹੜਾ ਮਨੁੱਖ ਰਜ਼ਾ ਨੂੰ ਮੰਨ ਲੈਂਦਾ ਹੈ) ਉਹੀ ਹੈ ਸੋਹਣਾ ਸੁਚੱਜਾ ਸਿਆਣਾ ਭਗਤ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਘੜੁ = ਸੋਹਣੀ ਮਾਨਸਕ ਘਾੜਤ ਵਾਲਾ, ਸੁਚੱਜਾ। ਸਜਾਣਾ = (ਅੱਖਰ 'ਸ' ਦੇ ਨਾਲ ਦੋ ਲਗਾਂ ਹਨ: (ੋ) ਅਤੇ (ੁ) ਅਸਲ ਲਫ਼ਜ਼ 'ਸੁਜਾਣਾ' ਹੈ, ਇਥੇ 'ਸੋਜਾਣਾ' ਪੜ੍ਹਨਾ ਹੈ) ਸਿਆਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "se vuelve sabio y conocedor"