[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਬ੍ਰਹਮੰਡ ਕੋ ਠਾਕੁਰੁ ਸੁਆਮੀ; ਸਰਬ ਜੀਆ ਕਾ ਦਾਤਾ ਰੇ ॥"
page = 612
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is the Master of millions of universes and He is the Donor of all the creatures."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕ੍ਰੋੜਾਂ ਹੀ ਆਲਮਾਂ ਦਾ ਮਾਲਕ ਹੈ। ਉਹ ਸਾਰਿਆਂ ਜੀਵਾਂ ਨੂੰ ਦੇਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is the Lord and Master of millions of universes; He is the Giver of all beings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਸ੍ਵਾਮੀ ਅਨੰਤ ਬ੍ਰਹਮੰਡੋਂ ਕਾ ਠਾਕੁਰ, ਪੁਨਃ ਵਹੁ ਸਰਬ ਸੂਖਮ ਅਸਥੂਲ ਜੀਵੋਂ ਕਾ ਦਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੇਹੜਾ ਕ੍ਰੋੜਾਂ ਬ੍ਰਹਮੰਡਾਂ ਦਾ ਪਾਲਣਹਾਰ ਮਾਲਕ ਹੈ, ਜੇਹੜਾ ਸਾਰੇ ਜੀਵਾਂ ਨੂੰ (ਰਿਜ਼ਕ ਆਦਿਕ) ਦਾਤਾਂ ਦੇਣ ਵਾਲਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬ੍ਰਹਮੰਡ = ਸ੍ਰਿਸ਼ਟੀ। ਕੋ = ਦਾ। ਠਾਕੁਰੁ = ਪਾਲਣਹਾਰ। ਰੇ = ਹੇ ਭਾਈ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor es el Maestro de millones de universos y el Sostenedor de toda la vida."