[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਜਨਨੀ ਸੁਤੁ ਜਣਿ ਪਾਲਤੀ; ਰਾਖੈ ਨਦਰਿ ਮਝਾਰਿ ॥"
page = 168
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the mother having given birth to a son, nourishes him, and keeps him in her view."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਮਾਤਾ ਪੁੱਤ੍ਰ ਨੂੰ ਜਨਮ ਦੇ ਕੇ ਉਸ ਨੂੰ ਪਾਲਦੀ ਪੋਸਦੀ ਹੈ, ਅਤੇ ਉਸ ਨੂੰ ਆਪਣੀ ਨਿਗ੍ਹਾ ਵਿੱਚ ਰਖਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Just as the mother, having given birth to a son, feeds him and keeps him in her vision"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਮਾਤਾ ਪੁਤ੍ਰ ਕੋ ਉਤਪਤ ਕਰ ਕੇ ਪਾਲਤੀ ਹੈ ਔਰ ਨਜਰ ਮੇਂ ਰਾਖਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਮਾਂ ਪੁੱਤਰ ਨੂੰ ਜਨਮ ਦੇ ਕੇ (ਉਸ ਨੂੰ) ਆਪਣੀ ਨਜ਼ਰ ਹੇਠ ਰੱਖਦੀ ਹੈ ਤੇ ਪਾਲਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨਨੀ = ਮਾਂ। ਜਣਿ = ਜੰਮ ਕੇ, ਜਨਮ ਦੇ ਕੇ। ਨਦਰਿ ਮਝਾਰਿ = ਨਜ਼ਰ ਹੇਠ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como la madre cría a su hijo y lo cuida;"