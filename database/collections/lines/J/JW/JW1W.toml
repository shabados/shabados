[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧ੍ਰਿਗੁ ਇਵੇਹਾ ਜੀਵਿਆ; ਕਿਆ ਜੁਗ ਮਹਿ ਪਾਇਆ ਆਇ ॥"
page = 510
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "accursed is such a life of his. What has he gained by coming into this world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲਾਨ੍ਹਤ ਹੈ ਉਸ ਦੇ ਐਹੋ ਜੇਹੇ ਜੀਵਨ ਨੂੰ। ਇਸ ਸੰਸਾਰ ਵਿੱਚ ਆ ਕੇ ਉਸ ਨੇ ਕੀ ਲਾਭ ਉਠਾਇਆ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "cursed is such a life. What has he gained by coming into the world?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕਾ ਐਸਾ ਜੀਵਿਆ ਧਿਕਾਰ ਹੈ, ਇਸ ਜੁਗ ਮੇਂ ਆਇ ਕਰ ਤਿਸ ਨੇ ਕਿਆ ਪਾਇਆ ਹੈ ਅਰਥਾਤ ਕੁਛ ਨਹੀਂ ਪਾਯਾ ਹੈ॥☬ਜੇ ਕਹੇ ਮਾਇਆ ਤਾਂ ਪਾਈ ਹੈ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਫਿਟੇ-ਮੂੰਹ ਇਸ ਜੀਊਣ ਨੂੰ! ਮਨੁੱਖਾ-ਜਨਮ ਵਿਚ ਆ ਕੇ ਕੀਹ ਖੱਟਿਆ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧ੍ਰਿਗੁ = ਫਿਟਕਾਰ-ਯੋਗ। ਜੁਗ = ਜਨਮ, ਮਨੁੱਖਾ ਜਨਮ।"