[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਨੁਕ ਦੁਤੀ ਦਤ ਅਵਤਾਰੀ ॥੭॥"
page = 676

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The king was pleased in his heart on seeing him wearing matted locks and it appeared to him that he was the second incarnation of Dutt.7."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇੰਜ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਸੀ) ਮਾਨੋ ਦੱਤ ਨੇ ਦੂਜਾ ਅਵਤਾਰ ਲਿਆ ਹੋਵੇ ॥੭॥"