[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਪਾਸਿ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਚਤੁਰ, ਪਛਾਨ ॥੩੮੪॥"
page = 735

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The names of Paash are formed by uttering “Hardhrad, Jaldhrad, Varidhrad, Vidhipati and Astra”, which O wise men, You may recognize.384."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ ਸਾਰੇ) ਪਾਸ ਦੇ ਨਾਮ ਬਣ ਜਾਂਦੇ ਹਨ। ਸੂਝਵਾਨੋ! ਸਮਝ ਲਵੋ ॥੩੮੪॥"