[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਖਰੁ ਹਿਕੁ ਅਪਾਰੁ; ਨਾਨਕ. ਖਟੇ ਸੋ ਧਣੀ ॥੧॥"
page = 965
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, he alone is the banker, who buys the one invaluable commodity of God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਕੇਵਲ ਉਹ ਹੀ ਸ਼ਾਹੂਕਾਰ ਹੈ, ਜੋ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦੇ ਇਕ ਅਮੋਲਕ ਸੌਦੇ ਨੂੰ ਖਰੀਦਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, he alone is truly a banker, who buys the infinite commodity. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸਤਿਸੰਗ ਮੇਂ ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਏਕ (ਅਪਾਰੁ) ਪਰਮੇਸਰ ਕੇ ਨਾਮ ਰੂਪ ਵਖਰ ਕੋ ਖੋਜਤਾ ਹੈ, ਸੋ ਧਨੀ ਧਨਾਢ ਹੈ ਵਾ ਸਭ ਕਾ ਮਾਲਕ ਹੈ॥੧॥☬ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਅਪਨੀ ਬਾਣੀ ਕੀ ਕਬੀਰ ਜੀ ਕੀ ਬਾਣੀ ਸੇ ਅਭੇਦਤਾ ਦਿਖਾਵਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਇਸ ਜਗਤ-ਮੰਡੀ ਵਿਚ) ਉਹ ਮਨੁੱਖ ਧਨਵਾਨ ਹੈ ਜੋ ਇਕ ਅਖੁੱਟ (ਹਰਿ-ਨਾਮ) ਸੌਦਾ ਹੀ ਖੱਟਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਖਰੁ = ਪ੍ਰਭੂ-ਨਾਮ ਦਾ ਸੌਦਾ। ਹਿਕੁ = ਇੱਕ। ਧਣੀ = ਧਨਾਢ, ਧਨਵੰਤ। ਅਪਾਰੁ = ਕਦੇ ਨਾਹ ਮੁੱਕਣ ਵਾਲਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "lo que se vende es el Infinito y quien lo compra es bendecido. (1)"