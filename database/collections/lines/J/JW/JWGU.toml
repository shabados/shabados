page = 1162
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Bhairo Kabir Ji Ashtpadis."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭੈਰਉ ਕਬੀਰ ਜੀ ਅਸਟਪਦੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Bhairao, Kabeer Jee, Ashtpadheeyaa, Second House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਭੈਰਉ, ਘਰ ੨ ਵਿੱਚ ਭਗਤ ਕਬੀਰ ਜੀ ਦੀ ਅੱਠ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bhairo Kabir yi, Ashtapadis."