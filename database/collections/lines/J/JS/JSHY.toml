[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੀ ਜ਼ਿੰਦਗੀ ਵਿਚ ਸੁਆਸ ਸੁਆਸ ਰੱਬ ਦਾ ਸਿਮਰਨ ਅਤੇ ਜ਼ਿਕਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਜ਼ਿਕਰਿ ਮੌਲਾ ਦਮ ਬ-ਦਮ ਦਰ ਜਾਨਿ ਊ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "He meditates and describes His virtues every breath of his life,"