data = "ਨਾਤਰ ਧਾਮ ਨ ਤੁਮਰੇ ਰਹਊ ॥੫॥"
page = 975

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘I must ask you one thing, I will stay if you agree, and otherwise I will leave.’(5)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਹੀਂ ਤਾਂ ਤੇਰੇ ਘਰ ਨਹੀਂ ਰਹਾਂਗਾ ॥੫॥"