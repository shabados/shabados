[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਝਮੀ ਤੇਗ ਤੇਜੰ ਸਰੋਸੰ ਪ੍ਰਹਾਰੰ ॥"
page = 165

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The war began and the clattering of the glistening swords and the sound of the furious blows was heard"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋਧ ਨਾਲ ਚਲਾਈਆਂ ਜਾ ਰਹੀਆਂ ਤਿਖੀਆ ਤਲਵਾਰਾਂ (ਇੰਜ ਚਲਦੀਆਂ ਪ੍ਰਤੀਤ ਹੁੰਦੀਆਂ ਸਨ)"