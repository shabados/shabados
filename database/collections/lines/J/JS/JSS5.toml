[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਆ ਜਾਨਉ; ਸਹ ਕਉਨ ਪਿਆਰੀ ॥੨॥"
page = 327
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "what do I know, who is dear to the Bridegroom (God)."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕੀ ਜਾਣਦਾ ਹਾਂ ਕਿ ਕੰਤ (ਪਰਮਾਤਮਾ) ਦੀ ਕਿਹੜੀ ਲਾਡਲੀ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "how can I know which ones are dear to the Husband Lord? ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਕਿਆ ਜਾਨੀਏ ਪਤੀ ਕੋ ਕੌਨ ਪਿਆਰੀ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਮੈਂ ਕੀਹ ਜਾਣਾਂ ਕਿ ਕਿਹੜੀ (ਜੀਵ-ਇਸਤ੍ਰੀ) ਪ੍ਰਭੂ-ਪਤੀ ਦੀ ਪਿਆਰੀ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਆ ਜਾਨਉ = ਮੈਂ ਕੀਹ ਜਾਣਾ, ਮੈਨੂੰ ਕੀਹ ਪਤਾ? ਸਹ ਪਿਆਰੀ = ਪਤੀ ਦੀ ਪਿਆਰੀ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿quién sabe a cuál de ellos Dios escoja?(2)"