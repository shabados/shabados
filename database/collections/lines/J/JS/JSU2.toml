[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਠਾਕੁਰੁ ਹਮਰਾ ਸਦ ਬੋਲੰਤਾ ॥"
page = 1160
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Lord ever speaks."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਸੁਆਮੀ ਹਮੇਸ਼ਾਂ ਹੀ ਬੋਲਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My Lord and Master speaks forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰਾ ਠਾਕੁਰ ਸਦਾ ਬੋਲਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਡਾ ਠਾਕੁਰ ਸਦਾ ਬੋਲਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਦ = ਸਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Maestro se expresa siempre por todas partes"