[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਪਾਸਿ ਕੇ ਹੋਤ ਹੈ; ਚੀਨੀਅਹੁ ਪ੍ਰਗਿਆਵਾਨ ॥੩੪੩॥"
page = 733

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying primarily the words “Jagat-Pitaa” and adding the word “Sut” at the end, O talented persons! Recognise the names of Paash.343."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਪਾਸ ਦਾ ਨਾਮ ਹੋ ਜਾਂਦਾ ਹੈ। ਬੁੱਧੀਮਾਨੋ! ਸਮਝ ਲਵੋ ॥੩੪੩॥"