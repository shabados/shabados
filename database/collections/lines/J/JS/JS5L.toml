[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੁ ਨਿਰੰਜਨੁ; ਗੁਰਮੁਖਿ ਜਾਤਾ ॥"
page = 223
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The pious person Know the Pure One alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤ੍ਰ ਮਨੁੱਖ ਕੇਵਲ ਪਾਵਨ ਪੁਰਖ ਨੂੰ ਹੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh knows the One Immaculate Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਗੁਰਮੁਖੋਂ ਨੇ ਏਕ ਹੀ ਨਿਰੰਜਨ ਜਾਨਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੁੰਦਾ ਹੈ, ਉਹ ਇਹ ਜਾਣ ਲੈਂਦਾ ਹੈ ਕਿ ਇਕ ਨਿਰੰਜਨ ਹੀ ਹਰ ਥਾਂ ਮੌਜੂਦ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਵਲ ਮੂੰਹ ਕਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A través del Guru conocí al Uno, el Señor Inmaculado,"