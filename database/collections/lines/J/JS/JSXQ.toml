[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਜਾ ਕੌ ਨਿਜੁ ਬਸ ਕਿਯੋ; ਐਸੋ ਚਰਿਤ ਬਨਾਇ ॥੧੪॥"
page = 985

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "With deception, she had won the favour ofthe sovereign.(14)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਚਰਿਤ੍ਰ ਰਾਹੀਂ ਰਾਜੇ ਨੂੰ ਆਪਣੇ ਵਸ ਵਿਚ ਕਰ ਲਿਆ ॥੧੪॥"