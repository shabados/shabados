[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੂਜਰੀ ਮਹਲਾ ੫ ਪੰਚਪਦਾ ਘਰੁ ੨ ॥"
page = 497
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Gujri 5th Guru. Panchpada."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੂਜਰੀ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ ਪੰਚਪਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Goojaree, Fifth Mehl, Panch-Pada, Second House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਗੂਜਰੀ, ਘਰ ੨ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਪੰਜ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੰਚਪਦਾ = ਪੰਜ ਬੰਦਾਂ ਵਾਲਾ ਸ਼ਬਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Guyeri, Mejl Guru Aryan, Quinto Canal Divino, Panch-Padas."