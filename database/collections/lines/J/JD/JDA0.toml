[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਬੰਦਗੀ ਬਿਨਾਂ ਹੋਰ ਕੋਈ ਗਲ ਬਾਤ ਕਰਨੀ ਸਭ ਸ਼ਰਮਿੰਦਗੀ ਹੀ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਗੁਫ਼ਤਗੂਹਾਇ ਦਿਗਰ ਸ਼ਰਮਿੰਦਗੀਸਤ ॥੪੭੮॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "To get involved in any conversation other than the meditation will be nothing but an utter shame. (478)"