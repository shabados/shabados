[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋਤਿ ਸਰੂਪ; ਜਾ ਕੀ ਸਭ ਵਥੁ ॥"
page = 1150
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is the embodiment of light, to whom belong all the things."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਨੂਰ ਦਾ ਰੂਪ ਹੈ, ਜਿਸ ਦੀ ਮਲਕੀਅਤ ਹਨ ਸਾਰੀਆਂ ਵਸਤੂਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Embodiment of Light; all beings belong to Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਪੂਰਨ ਵਸਤੂ ਜਿਸ ਪਰਮੇਸ੍ਵਰ ਕੀ ਰਚੀ ਹੋਈ ਹੈ ਵਹੁ ਚੈਤੰਨ ਸ੍ਵਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਇਹ ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ ਜਿਸ (ਪਰਮਾਤਮਾ) ਦੀ (ਰਚੀ ਹੋਈ ਹੈ) ਉਹ ਨਿਰਾ ਨੂਰ ਹੀ ਨੂਰ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋਤਿ ਸਰੂਪ = ਨਿਰੀ ਜੋਤਿ ਹੀ ਜੋਤਿ, ਨਿਰਾ ਚਾਨਣ ਹੀ ਚਾਨਣ। ਜਾ ਕੀ = ਜਿਸ (ਪਰਮਾਤਮਾ) ਦੀ। ਸਭ ਵਥੁ = ਸਾਰੀ ਵਸਤ, ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es la Encarnación de la Luz y todas las cosas Le pertenecen,"