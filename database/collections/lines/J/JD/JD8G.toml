data = "ਨਾਮ ਤੁਫੰਗ ਚੀਨ ਚਿਤਿ ਲੀਜੈ ॥੭੫੨॥"
page = 755

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After that speaking the word “Ripu”, recognize all the names of Tupak.752."

