[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਜਹ ਜਹ ਸਬਦ ਚਹੀਜੈ; ਤਹ ਤਹ ਦੀਜੀਐ ॥੧੧੧੩॥"
page = 789

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Anugani”, add the word “Hanani” at the end and know all the names of Tupak.1113."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਕਿਥੇ ਲੋੜ ਸਮਝਣ, (ਇਹ) ਸ਼ਬਦ ਵਰਤ ਲੈਣ ॥੧੧੧੩॥"