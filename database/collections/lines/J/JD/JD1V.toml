[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਘਾਇਲ ਘੂਮਤ ਹੈ ਰਨ ਮੈ; ਇਕ ਲੋਟਤ ਹੈ ਧਰਨੀ ਬਿਲਲਾਤੇ ॥"
page = 76

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many wounded warriors are rolling in the battlefield and many of them are writhing and crying on the ground."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਈ ਯੋਧੇ) ਰਣ-ਭੂਮੀ ਵਿਚ ਘਾਇਲ ਘੁੰਮਦੇ ਹਨ ਅਤੇ ਕਈ ਧਰਤੀ ਉਤੇ ਪਏ ਕਰਾਹ ਰਹੇ ਹਨ।"