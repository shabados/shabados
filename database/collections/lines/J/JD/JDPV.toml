[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਸੇਵਾ. ਸੇਵਕ ਸਾਜਿ ॥"
page = 895
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Making thy mind the Lord's slave, perform thou His service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਨੂੰ ਪ੍ਰਭੂ ਦਾ ਗੋਲਾ ਬਣਾ ਕੇ, ਤੂੰ ਉਸ ਦੀ ਟਹਿਲ ਸੇਵਾ ਕਮਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Become His servant, and serve Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੇਵਕੋਂ ਕਾ ਸਾਜ ਸਾਜਕੇ ਤੂੰ ਸਤਿਗੁਰੋਂ ਕੀ ਸੇਵਾ ਕਰ, ਭਾਵ ਅਤੀ ਨਿਮ੍ਰ ਹੋਇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੇਵਕ ਵਾਲੀ ਭਾਵਨਾ ਨਾਲ (ਗੁਰੂ ਦੇ ਦਰ ਤੇ) ਸੇਵਾ ਕਰਿਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵਕ ਸਾਜਿ = ਸੇਵਕ ਦੀ ਮਰਯਾਦਾ ਨਾਲ, ਸੇਵਕ ਬਣ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sirve a tu Señor haciendo de tu mente Su Esclava."