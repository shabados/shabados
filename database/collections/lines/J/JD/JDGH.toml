[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗੋਪ ਕੋ ਭੇਖ ਕਬੈ ਧਰਿ ਹੈ ਹਰਿ; ਕੁੰਜ ਗਰੀ ਕਬ ਆਨਿ ਬਸੈ ਹੈ ॥"
page = 823

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘You had told me that he often passed through the streets in the guise of a cowherd."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੂੰ ਕਹਿੰਦੀ ਹੁੰਦੀ ਸੀ ਕਿ) ਗਵਾਲੇ ਦੇ ਰੂਪ ਵਿਚ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਕਦੀ ਇਨ੍ਹਾਂ ਕੁੰਜਗਲੀਆਂ ਵਿਚ ਆ ਕੇ ਵਸਣਗੇ।"