[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਾਤਿ ਜੋਤਿ; ਸਭ ਸੂਰਤਿ ਤੇਰੀ ॥"
page = 1251
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All gifts, light and beauty are Thine, O Lord!"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਬਖਸ਼ਸ਼ਾਂ ਨੂਰ ਤੇ ਸੁੰਦਰਤਾ ਤੇਰੀਆਂ ਹਨ, ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All gifts, light and beauty are Yours."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੋਤੀ! ਦਾਤ ਅਰ (ਸੂਰਤਿ) ਸੁੰਦਰਤਾ ਸਭ ਤੇਰੀ ਦੀ ਹੂਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਇਹ ਜਿੰਦ ਤੇ ਇਹ ਸਰੀਰ ਸਭ ਤੇਰੀ ਬਖ਼ਸ਼ੀ ਹੋਈ ਦਾਤ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋਤਿ = ਜਿੰਦ। ਸੂਰਤਿ = ਸਰੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, toda Belleza y toda Luz son Tu Bendición"