[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਬੋਲ, ਅਮੋਲ ਰਤੰਨਾ ॥੧੨॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Sayings of gurmukhs are invaluable like jewels."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਇਸੇ ਲਈ) ਗੁਰਮੁਖਾਂ ਦੇ ਬੋਲ (ਅਰਥਾਤ ਮਿਸ਼ਟ ਬਚਨ) ਅਮੋਲਕ ਰਤਨ ਰੂਪ ਹਨ (ਇਸ ਲਈ ਕਿ ਜਨਮ ਮਰਣ ਆਦਿ ਰੋਗ ਦੇ ਨਾਸ਼ਕ ਹਨ)।"