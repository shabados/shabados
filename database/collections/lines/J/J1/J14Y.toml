[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੋਬਿੰਦ ਮਿਲਣ ਕੀ; ਇਹ ਤੇਰੀ ਬਰੀਆ ॥"
page = 378
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This is thy chance to meet the Lord of the world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਸੁਆਮੀ ਨੂੰ ਮਿਲਣ ਦਾ ਏਹੀ ਤੇਰਾ ਮੌਕਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is your chance to meet the Lord of the Universe."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੋਬਿੰਦ ਜੀ ਕੋ ਮਿਲਣੇ ਕੀ ਤੇਰੀ ਏਹੀ ਬਾਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹੀ ਹੈ ਸਮਾ ਪਰਮਾਤਮਾ ਨੂੰ ਮਿਲਣ ਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਰੀਆ = ਵਾਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ahora es el momento de obtener al Señor."