[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਲਾਇਕ ਸਿਫ਼ਤ ਚੂੰ ਸੁਰੱਯਾ ਸ਼ਿਕੋਹ ॥੯੩॥"
page = 1393

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "You are like angels wielding high splendour.93."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੇਰੀਆਂ ਦੇਵਤਿਆਂ ਵਰਗੀਆਂ ਸਿਫ਼ਤਾਂ ਹਨ। ਤੇਰਾ ਪ੍ਰਤਾਪ ਆਕਾਸ਼ ਦੀ ਚੋਟੀ ਤਕ ਵਿਆਪਕ ਹੈ ॥੯੩॥"