[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਨ ਤੋਹਿ ਬਤਾਇ ਹੈ; ਨ੍ਰਿਪ, ਭਾਖਿ ਹੋ ਜੁ ਅਨੇਕ ॥"
page = 689

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O king! go and ask him, all these kings, who have been invited by you will not be able to tell you anything"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹੀ) ਤੁਹਾਨੂੰ ਠੀਕ ਦਸੇਗਾ, ਹੇ ਰਾਜਨ! (ਉਹ) ਹੋਰ ਅਨੇਕ (ਗੱਲਾਂ ਵੀ) ਦਸੇਗਾ।"