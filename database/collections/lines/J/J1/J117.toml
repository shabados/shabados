[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਸਾਹਿਬ ਕੈ; ਹਉ ਕੁਰਬਾਣੈ ॥"
page = 1070
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "unto that Lord, I am a sacrifice."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਪ੍ਰਭੂ ਉੱਤੋਂ ਮੈਂ ਘੋਲੀ ਵੰਝਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "unto that Lord and Master, I am a sacrifice."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸ੍ਵਾਮੀ ਕੇ ਮੇਂ ਕੁਰਬਾਨ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤਾਂ ਉਸ ਮਾਲਕ ਤੋਂ ਸਦਾ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ = ਤੋਂ। ਹਉ = ਹਉਂ, ਮੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a Dios, ofrezco mi ser en sacrificio."