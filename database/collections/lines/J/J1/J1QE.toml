[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੋਹਿ ਨਿਸਤਾਰਹੁ ਨਿਰਗੁਨੀ ॥੧॥ ਰਹਾਉ ॥"
page = 1186
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O God, emancipate Thou me, the meritless one. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਿਗੁਰੂ! ਤੂੰ ਮੈਂ, ਨੇਕੀ ਵਿਹੂਣਾ ਦਾ ਪਾਰ ਉਤਾਰਾ ਕਰ ਦੇ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am unworthy, but please save me anyway. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੁਝ ਨਿਰਗੁਨੀ ਕੋ ਸੰਸਾਰ ਸਮੁੰਦ੍ਰ ਸੇ ਤਾਰ ਲੀਜੀਏ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਗੁਣ-ਹੀਨ ਨੂੰ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਿ = ਮੈਨੂੰ। ਮੋਹਿ ਨਿਰਗੁਨੀ = ਮੈਨੂੰ ਗੁਣ-ਹੀਨ ਨੂੰ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ibérame aunque esté corto de todo Mérito. (1-Pausa)"