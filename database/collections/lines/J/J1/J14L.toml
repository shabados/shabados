[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਿਹ ਸਤ੍ਰ ਮਿਤ੍ਰ ਦੋਊ ਏਕ ਸਾਰ ॥"
page = 37

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "For Him the enemies and friends are the same!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਲਈ ਵੈਰੀ ਅਤੇ ਮਿਤਰ ਦੋਵੇਂ ਇਕ-ਸਮਾਨ ਹਨ।"