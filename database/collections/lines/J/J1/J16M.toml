[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਗਾਧੇ ਅਬਾਧੇ ਅਗੰਤੰ ਅਨੰਤੰ ॥"
page = 127

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art unfathomable, unattached, inaccessible and endless."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੂੰ) ਅਗਾਧ (ਜਿਸ ਦੀ ਥਾਹ ਨਾ ਪਾਈ ਜਾ ਸਕੇ) ਅਬਾਧ (ਜੋ ਪਕੜਿਆ ਨਾ ਜਾ ਸਕੇ) ਅਗੰਤ (ਜੋ ਗਮਨ ਨਹੀਂ ਕਰਦਾ) ਅਤੇ ਅਨੰਤ (ਅੰਤ ਤੋਂ ਰਹਿਤ) ਹੈਂ;"