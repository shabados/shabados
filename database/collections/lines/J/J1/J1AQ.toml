[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਕੀਏ ਰਤਨ ਸਮੁਦ ॥"
page = 276
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many millions of oceans with pearls have been made."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਕ੍ਰੋੜ ਮੋਤੀਆਂ ਵਾਲੇ ਸਮੁੰਦਰ ਸਾਜੇ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions are the pearls of the oceans."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਈ ਕ੍ਰੋੜੋਂ ਰਤਨੋਂ ਵਾਰੇ ਸਮੁੰਦਰ ਵਾ ਰਤਨ ਔ ਸਮੁੰਦ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਮੁੰਦਰ ਵਿਚ ਕਰੋੜਾਂ ਰਤਨ ਪੈਦਾ ਕਰ ਦਿੱਤੇ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones las perlas de los océanos,"