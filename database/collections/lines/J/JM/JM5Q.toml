type = "primary"
data = "ਅਥਿਤ ਭੇਖ ਸਜਿ ਆਪੁ ਨ੍ਰਿਪ; ਗਯੋ ਬਿਪ੍ਰ ਕੇ ਕਾਮ ॥"
page = 923

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Disguising himself as Brahmin priest, he went there,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋਗੀ ('ਅਤਿਥ') ਦਾ ਰੂਪ ਧਾਰ ਕੇ ਰਾਜਾ (ਬਿਕ੍ਰਮ) ਆਪ ਬ੍ਰਾਹਮਣ ਦੇ ਕੰਮ ਲਈ (ਉਥੇ) ਗਿਆ"