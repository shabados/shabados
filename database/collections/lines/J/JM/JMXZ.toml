[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਅਨਿਕ ਬਾਰ ਨਮੋ ਨਮਹ ॥੬੩॥"
page = 1359
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Over and over again, Nanak makes obeisance unto his Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਾਰੰਬਾਰ ਨਾਨਕ ਆਪਣੇ ਸੁਆਮੀ ਨੂੰ ਨਮਸਕਾਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak bows in humble worship, countless times, over and over again. ||63||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਤਾਂ ਤੇ ਤੇਰੇ ਕੋ ਹਮਾਰੀ ਮਨ, ਬਾਣੀ ਕਰ ਅਨੇਕ ਵਾਰ ਨਮਸਕਾਰ ਹੈ॥੬੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਅਨੇਕਾਂ ਵਾਰੀ (ਪਰਮਾਤਮਾ ਅੱਗੇ) ਨਮਸਕਾਰ ਕਰ ॥੬੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak se postra incontables veces, una y otra más, en humilde Alabanza. (63)"