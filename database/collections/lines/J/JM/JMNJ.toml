[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਾਗ ਬਡੇ ਦੁਰ ਬੁਧਨਿ ਕੇ; ਭਗਵਾਨਹਿ ਕੌ ਜਿਨਿ ਅਸਥਨ ਦੀਨੋ ॥"
page = 299

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That woman of vicious intellect had been very fortunate because she made the Lord to drink milk from her teats"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ) ਮੰਦ ਬੁੱਧੀ ਵਾਲੀ ਪੂਤਨਾ ਦੇ ਚੰਗੇ ਭਾਗ ਸਨ, ਜਿਸ ਨੇ ਭਗਵਾਨ ਨੂੰ ਥਣ ਚੁੰਘਾਇਆ।"