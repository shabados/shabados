type = "primary"
data = "ਜੈਸੇ ਅੰਤ ਕਾਲ ਸਿਵ ਬਲੀ ॥"
page = 515

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Amongst all of them Balram was roaming like a ghost like Kali on the doomsday"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਪਰਲੋ ਵਾਲੇ ਦਿਨ ਬਲਵਾਨ ਸ਼ਿਵ (ਫਿਰ ਰਿਹਾ ਹੈ)।"