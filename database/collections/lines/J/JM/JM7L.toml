[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਸੁ ਕਾਰਣਿ; ਇਹੁ ਭੇਖੁ ਨਿਵਾਸੀ ॥"
page = 939
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Q. 24: What is the reason that thou hast adopted this dress?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰ. 24: ਕੀ ਸਬੱਬ ਹੈ ਕਿ ਤੂੰ ਇਹ ਲਿਬਾਸ ਧਾਰਨ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Why have you adopted these religious robes?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਕਿਸ ਨਮਿਤ ਇਸ ਭੇਖ ਕੇ ਨਿਵਾਸੀ ਹੂਏ ਹੈਂ ੨?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਉਂ ਇਹ (ਉਦਾਸੀ-) ਭੇਖ ਧਾਰਿਆ ਸੀ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਵਾਸੀ = ਧਾਰਨ ਵਾਲੇ (ਹੋਏ ਸੀ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dinos ¿Porqué te has puesto los ropajes de un mendigante?"