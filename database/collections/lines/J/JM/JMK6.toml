[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਿ ਸਿਮਰਿ; ਜੀਵਾ ਗੋਵਿੰਦ ॥"
page = 899
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I live by contemplating and remembering my Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਸੁਆਮੀ ਦਾ ਆਰਾਧਨ ਤੇ ਚਿੰਤਨ ਕਰ ਕੇ ਜੀਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating, meditating in remembrance on the Lord of the Universe, I live."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ ਤੋ ਗੋਬਿੰਦ ਕੋ ਸਿਮਰ ਸਿਮਰ ਕੇ ਜੀਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੈਂ ਪਰਮਾਤਮਾ (ਦਾ ਨਾਮ) ਮੁੜ ਮੁੜ ਸਿਮਰ ਕੇ ਆਤਮਕ ਜੀਵਨ ਹਾਸਲ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਵਾ = ਜੀਵਾਂ, ਮੈਂ ਜੀਊਂਦਾ ਹਾਂ, ਮੈਂ ਆਤਮਕ ਜੀਵਨ ਹਾਸਲ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vivo contemplando a Dios; en Su Misericordia el Señor protege a Sus Sirvientes, (1-Pausa)"