[[content]]
assets = ["SSKS"]
type = "primary"
data = "ਜੈਸੇ ਦ੍ਰੁਮ ਸਫਲ ਫਲਤ ਫਲ ਖਾਤ ਨਾਂਹਿ; ਪਥਕ ਪਖੇਰੂ ਤੋਰ ਤੋਰ ਲੇ ਜਾਤ ਹੈ ॥"

[[content]]
assets = ["SSPK"]
type = "translation"
language = "en"
data = "Just as a tree bears sweet fruits but does not eat them itself. Instead birds, travellers pluck and eat them."

[[content]]
assets = ["SSSK"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਫਲਾਂ ਸਹਿਤ ਫਲਦਾ ਬ੍ਰਿਛ ਆਪ ਫਲ ਨਹੀਂ ਖਾਂਦਾ, ਪਰ ਰਾਹੀ ਤੇ ਪੰਛੀ ਤੋੜ ਤੋੜ ਕੇ ਲੈ ਜਾਂਦੇ ਹਨ।"