[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬੈਸ ਕਿਸੋਰ ਮਨੋਹਰਿ ਮੂਰਤਿ; ਲੈ ਹੋ ਕਹਾ, ਲਖਿ ਜੁਧ ਹਮਾਰੋ ॥"
page = 418

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Amit Singh spoke again in the battlefield, “Still you rage is much less and it will be of no value to you, if you see me fighting"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਕ੍ਰਿਸ਼ਨ!) ਤੇਰੀ ਉਮਰ ਛੋਟੀ ਹੈ, ਸ਼ਕਲ ਮਨ ਨੂੰ ਮੋਹਣ ਵਾਲੀ ਹੈ, ਕੀ ਲਏਂਗਾ ਮੇਰੇ ਨਾਲ ਯੁੱਧ ਕਰ ਕੇ।"