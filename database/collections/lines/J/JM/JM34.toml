type = "primary"
data = "ਪੁਨਿ ਲਈ ਜੋਤਿ ਜੋਤਹਿ ਮਿਲਾਇ ॥੪੧॥"
page = 170

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Destroying all the tyrants and vicious people, Narsingh merged his light in the Supreme Light.41."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਫਿਰ (ਆਪਣੀ) ਜੋਤਿ ਬ੍ਰਹਮ-ਜੋਤਿ ਵਿਚ ਮਿਲਾ ਦਿੱਤੀ ॥੪੧॥"