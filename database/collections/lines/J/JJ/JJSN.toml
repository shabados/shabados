[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੰਚ ਸਤਾਵਹਿ ਦੂਤ; ਕਵਨ ਬਿਧਿ ਮਾਰਣੇ ॥"
page = 1363
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The five adversaries torture me, In what way can I destroy them?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੰਜ ਦੁਸ਼ਮਨ ਮੈਨੂੰ ਤੰਗ ਕਰਦੇ ਹਨ। ਕਿਸ ਤਰੀਕੇ ਨਾਲ ਮੈਂ ਉਨ੍ਹਾਂ ਨੂੰ ਮਾਰ ਸਕਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The five evil enemies are tormenting me; how can I destroy them?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹੁ ਕਾਮ, ਕ੍ਰੋਧਾਦੀ ਪੰਚ ਦੂਤ ਜੋ ਮੁਝ ਕੋ ਦੁਖ ਦੇਤੇ ਹੈਂ, ਤਿਨੋਂ ਕੋ ਕਿਸ ਪ੍ਰਕਾਰ ਕਰ ਮਾਰਨੇ ਕਰੋਂ?☬ਉਤ੍ਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਇਹ ਕਾਮਾਦਿਕ) ਪੰਜ ਵੈਰੀ ਸਤਾਂਦੇ (ਹੀ) ਰਹਿੰਦੇ ਹਨ। (ਇਹਨਾਂ ਨੂੰ) ਕਿਸ ਤਰੀਕੇ ਨਾਲ ਮਾਰਿਆ ਜਾਏ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਤ = (ਕਾਮਾਦਿਕ) ਪੰਜ ਵੈਰੀ। ਮਤਾਵਹਿ = ਸਤਾਂਦੇ ਰਹਿੰਦੇ ਹਨ (ਬਹੁ-ਵਚਨ)। ਕਵਨ ਬਿਧਿ = ਕਿਸ ਤਰੀਕੇ ਨਾਲ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "los cinco malvados enemigos me atormentan, ¿cómo podría destruirlos?"