[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਹ ਦੇਖਿਓ; ਰੂਪ ਰੰਗ ਸਂ‍ੀਗਾਰੋ ॥"
page = 372
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nor have been my beauty, colour and decorations looked to."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਂ ਹੀ ਮੇਰੀ ਸੁੰਦਰਤਾ, ਰੰਗ ਤੇ ਹਾਰ ਸ਼ਿੰਗਾਰ ਵੱਲ ਤਕਿਆ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He does not look at my beauty, color or decorations."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਮੇਰੇ ਰੂਪ ਚਿਤ ਕੀ ਸੁਧਤਾ (ਰੰਗ) ਪ੍ਰੇਮ (ਸਿੰਗਾਰੋ) ਸਾਧਨ ਸਪੰਨਤਾ ਕੁਛੁ ਭੀ ਨਹੀਂ ਦੇਖੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਮੇਰਾ ਰੂਪ ਨਹੀਂ ਵੇਖਿਆ, ਰੰਗ ਨਹੀਂ ਵੇਖਿਆ, ਸਿੰਗਾਰ ਨਹੀਂ ਵੇਖਿਆ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no consideró mi color, mi belleza ni embellecimientos,"