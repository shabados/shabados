[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਦੂਤ. ਮੇਰੀ ਸੇਵਾ ਲਾਏ ॥"
page = 1347
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the demons, He yoked to my service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਭੂਤਨਿਆਂ ਨੂੰ ਉਸ ਨੇ ਮੇਰੀ ਮੇਰੀ ਟਹਿਲ ਅੰਦਰ ਜੋੜ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He made all the demons perform service for me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਪੂਰਨ ਕਾਮ ਕ੍ਰੋਧਾਦੀ ਦੂਤ ਮੇਰੀ ਸੇਵਾ ਮੇਂ ਲਗਾਏ ਹੈਂ, ਭਾਵ ਯੇਹਿ ਕਿ ਸਭ ਮੇਰੇ ਅਧੀਨ ਕਰ ਦੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ (ਕਾਮਾਦਿਕ ਇਹ) ਸਾਰੇ ਵੈਰੀ ਮੇਰੀ ਸੇਵਾ ਵਿਚ ਲਾ ਦਿੱਤੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਤ = ਵੈਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y en Su Veredicto hizo que todos los seres malignos me sirvieran,"