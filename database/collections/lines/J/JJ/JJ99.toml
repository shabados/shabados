[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਲੂਸਾਹੀ ਸੂਰਮਾ; ਵਡਾ ਭਗਤੁ ਭਾਈ ਕੇਦਾਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Sikh named Mallu was very brave and Bhai Kedara was a great devotee."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੱਲੂ ਸ਼ਾਹੀ ਸਿਪਾਹੀ ਤੇ ਭਾਈ ਕਿਦਾਰੀ ਵੱਡਾ ਭਗਤ ਹੋਇਆ।"