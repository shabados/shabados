[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਜਾ ਤਿਲਕ; ਕਰਤ ਇਸਨਾਨਾਂ ॥"
page = 201
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He performs worship and ablution, and puts sacred mark on his brow."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੂਜਾ ਤੇ ਇਸ਼ਨਾਨ ਕਰਦਾ ਹੈ ਅਤੇ ਆਪਣੇ ਮੱਥੇ ਉਤੇ ਟਿੱਕਾ ਲਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He performs worship ceremonies, applies the ceremonial tilak mark to his forehead, and takes his ritual cleansing baths;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੂਜਾ ਤਿਲਕ ਇਸਨਾਨ ਕਰਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਬ੍ਰਾਹਮਣ) ਇਸਨਾਨ ਕਰਕੇ, ਤਿਲਕ ਲਾ ਕੇ ਪੂਜਾ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él se lava, se unta perfumes y alaba las deidades;"