data = "ਅਵਰ ਸਿਆਨਪ; ਸਗਲੀ ਛਾਡੁ ॥"
page = 286
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Renounce thou all other cleverness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੋਰ ਸਾਰੀ ਚਤੁਰਾਈ ਤਿਆਗ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So renounce all other clever devices,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਔਰ ਸਰਬ ਸਿਆਣਪ ਕੋ ਤਿਆਗ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੋਰ ਚੁਤਰਾਈ ਛੱਡ ਦੇਹ,"

