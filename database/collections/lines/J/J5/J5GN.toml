[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਲਪ ਸਿੰਘ ਅਰੁ ਗਜਾ ਸਿੰਘ; ਅਤਿ ਕੋਪ ਬਢਾਏ ॥"
page = 433

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Karam Singh, Jai Singh, Jalap Singh, Gaja Singh etc., came into the battlefield in increased anger"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਾਲਪ ਸਿੰਘ ਅਤੇ ਗਜਾ ਸਿੰਘ ਨੇ ਬਹੁਤ ਕ੍ਰੋਧ ਵਧਾਇਆ ਹੋਇਆ ਹੈ।"