[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕਹਿ ਏਕ; ਜਪਹੁ ਜਪੁ ਸੋਈ ॥"
page = 258
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by meditating on that One and One alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਅਦੁੱਤੀ ਅਤੇ ਕੇਵਲ ਅਦੁੱਤੀ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "if you chant and meditate on the One and Only Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਵਾਸਤੇ ਹੇ ਭਾਈ ਜਨੋਂ! (ਏਕ) ਅਦੁਤੀ ਵਾਹਿਗੁਰੂ (ਸੋਈ) ਸੋਭਾਵਾਨ ਕੇ ਜਪ ਕੋ ਜਪਨਾ ਕਰੋ, ਅਰ ਐਸੇ ਬੇਨਤੀ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਇਕ ਪਰਮਾਤਮਾ ਦਾ ਜਾਪ ਕਰਿਆ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si meditas en el Uno y el Uno solamente."