[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਥ ਪੰਚਮੋ ਅਵਤਾਰ ਬ੍ਰਹਮਾ ਬਿਆਸ ਮਨੁ ਰਾਜਾ ਕੋ ਰਾਜ ਕਥਨੰ ॥"
page = 615

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Now being the description of Vyas, the fifth incarnation of Brahma and the description of the rule of king menu."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਬ੍ਰਹਮਾ ਦੇ ਪੰਜਵੇਂ ਅਵਤਾਰ ਬਿਆਸ ਦਾ ਪ੍ਰਸੰਗ ਮਨੁ ਰਾਜਾ ਦੇ ਰਾਜ ਦਾ ਕਥਨ"