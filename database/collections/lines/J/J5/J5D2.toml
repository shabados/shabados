[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਦੇਇ. ਸੁ ਪਾਈਐ; ਗੁਰਿ. ਬੂਝ ਬੁਝਾਈ ॥੩॥"
page = 425
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What the Lord Himself gives that the man receives. The Guru has imparted this understanding to me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਛ ਪ੍ਰਭੂ ਆਪ ਦਿੰਦਾ ਹੈ, ਉਸ ਨੂੰ ਹੀ ਇਨਸਾਨ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ। ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਇਹ ਸਮਝ ਪ੍ਰਦਾਨ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever He gives, is received. The Guru has imparted this understanding to me. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਜਿਸ ਕੋ ਦੇਤਾ ਹੈ, ਸੋ ਪਾਉਤਾ ਹੈ, ਏਹ ਬੂਝ ਸਤਿਗੁਰੋਂ ਨੇ ਬੁਝਾਈ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੇ ਇਹ ਗੱਲ ਸਮਝਾਈ ਹੈ ਕਿ ਜੋ ਕੁਝ ਉਹ ਪ੍ਰਭੂ ਆਪ ਹੀ ਦੇਂਦਾ ਹੈ ਉਹੀ ਸਾਨੂੰ ਮਿਲ ਸਕਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno recibe lo que el Señor Mismo da; éste es el misterio revelado por el Guru. (3)"