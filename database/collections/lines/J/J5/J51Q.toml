[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜ਼ਿ ਕਰਦਹ ਤੁ ਮਨ ਦਰ ਨਿਯਾਜ਼ ਆਮਦਮ ॥੨੧॥"
page = 1407

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Your deed has dreaded me.’(21)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਇਸ ਕਾਰਨਾਮੇ ਕਰ ਕੇ ਮੈਂ ਤੇਰੀ ਕ੍ਰਿਪਾ ਚਾਹੁੰਦਾ ਹਾਂ ॥੨੧॥"