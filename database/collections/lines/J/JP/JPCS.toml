[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਧਰੀ ਨੀਸਾਨੀ ਕਉਸਿ ਦੀ; ਮਕੇ ਅੰਦਰਿ ਪੂਜ ਕਰਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Wooden sandal (of Baba Nanak ) was kept as a memory and he was woshipped in Mecca."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੱਕੇ ਵਿਚ (ਆਪਣੀ) ਪੂਜਾ ਕਰਵਾਈ ਤੇ ਕੌਂਸ ਦੀ ਨਿਸ਼ਾਨੀ ਧਰੀ (ਅਥਵਾ ਦਿੱਤੀ)।"