[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਹੂ ਬਿਹਾਵੈ; ਸੋਧਤ ਜੀਵਤ ॥"
page = 914
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some pass their life reforming other men's lives."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਹੋਰਨਾਂ ਦੇ ਜੀਵਨ ਸੁਧਾਰਨ ਵਿੱਚ ਆਪਣੀ ਜਿੰਦਗੀ ਬਿਤਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some pass their lives exploring life's mysteries."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਕੀ ਜੀਵਨੇ ਕੋ ਸੋਧਤਿਆਂ ਹੀ ਬੀਤਤੀ ਹੈ। ਭਾਵ ਜੋਤਸ ਸ਼ਾਸਤ੍ਰ ਦੁਆਰਾ ਮਰਨੇ ਕੇ ਦਿਨ ਹੀ ਗਿਨਤਾ ਹੈ; ਵਾ ਜੀਵਤ ਸੋਧਤ ਕੀ ਤਤਤ੍ਵੰ ਪਦ ਕਾ ਸੋਧਨ ਕਰਤਿਆਂ ਅਵਸਥਾ ਬੀਤਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਮਨੁੱਖ ਦੀ ਸਾਰੀ ਉਮਰ ਖੋਜ-ਭਾਲ ਕਰਦਿਆਂ ਬੀਤਦੀ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਧਤ = ਸੋਧਦਿਆਂ, ਖੋਜ-ਭਾਲ ਕਰਦਿਆਂ। ਜੀਵਤ = ਜਿਤਨਾ ਚਿਰ ਜੀਊਂਦੇ ਹਨ, ਸਾਰੀ ਉਮਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues tal es su necesidad,"