data = "ਨਾਮ ਤੁਪਕ ਕੇ ਸਕਲ ਪਤੀਜੈ ॥੯੬੭॥"
page = 775

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Dinas-ari-ramnan”, utter the words “Jaachar-nayak-shatru”, know all the names of Tupak.967."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝੋ ॥੯੬੭॥"