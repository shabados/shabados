[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਸਾਚੇ ਕੀ. ਸਾਚੀ ਕਾਰ ॥"
page = 665
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is the service of the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੀ ਹੈ ਸੇਵਾ ਸੱਚੇ ਸੁਆਮੀ ਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True is service to the True Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸਚੇ ਪ੍ਰਭੂ ਕੀ ਸਚੀ (ਕਾਰ) ਸੇਵਾ ਜੋ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਦੀ ਇਹ ਅਟੱਲ ਮਰਯਾਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚੀ ਕਾਰ = ਅਟੱਲ ਮਰਯਾਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Verdadero es el Servicio al Señor Verdadero."