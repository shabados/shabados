[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਗ ਮਹਿ ਕੋਈ ਰਹਣੁ. ਨ ਪਾਏ; ਨਿਹਚਲੁ ਏਕੁ ਨਾਰਾਇਣਾ ॥੧॥"
page = 1077
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "None is allowed to stay in this world, Ever-stable is the One Lord alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਜਹਾਨ ਅੰਦਰ ਕਿਸੇ ਨੂੰ ਭੀ ਠਹਿਰਨਾ ਨਹੀਂ ਮਿਲਦਾ। ਸਦੀਵੀ ਸਥਿਰ ਹੈ ਕੇਵਲ ਇੱਕ ਪ੍ਰਭੂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one can remain in this world; only the One Lord is permanent and unchanging. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਜਗਤ ਮੇਂ ਤਾਂ ਕੋਈ ਭੀ ਰਹਿਣਾ ਨਹੀਂ ਪਾਵਤਾ ਸਭ ਚਲਾਏਮਾਨ ਹੈ, ਪਰੰਤੂ ਏਕ ਨਾਰਾਇਣ ਹੀ ਨਿਸਲ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਵਿਚ ਕੋਈ ਭੀ ਸਦਾ ਲਈ ਟਿਕਿਆ ਨਹੀਂ ਰਹਿ ਸਕਦਾ, ਸਿਰਫ਼ ਇਕ ਪਰਮਾਤਮਾ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਹਚਲੁ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, nadie habita eternamente en el mundo, excepto tu Dios. (1)"