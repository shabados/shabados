data = "ਛੇਰੀ ਲਗੀ ਭੂੰਮ ਮੈ ਰਹਿ ਹੈ ॥੧੭॥"
page = 892

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Which ever the goat you would order to get stuck, that will go to sleep.(17)"

[[content]]
