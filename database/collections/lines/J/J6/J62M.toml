[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰਾ ਕੀਆ. ਕਿਰਮ ਜੰਤੁ ॥"
page = 1176
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The wormy mortal is created by Thee, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੀੜੇ ਵਰਗਾ ਜੀਵ ਤੂੰ ਹੀ ਰਚਿਆ ਹੈ, ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am just a worm, created by You, O Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਗਵਨ! ਮੈਂ (ਕਿਰਮ ਜੰਤੁ) ਤੁਛ ਜੀਵ ਤੇਰਾ ਕੀਆ ਹੂਆ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਤੇਰਾ ਹੀ ਪੈਦਾ ਕੀਤਾ ਹੋਇਆ ਤੁੱਛ ਜੀਵ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀਆ = ਪੈਦਾ ਕੀਤਾ ਹੋਇਆ। ਕਿਰਮ = ਕੀੜਾ। ਕਿਰਮ ਜੰਤੁ = ਨਿਮਾਣਾ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Soy sólo un simple gusano, creado por Ti, oh Dios,"