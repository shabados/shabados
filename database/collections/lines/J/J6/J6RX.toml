[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਖ ਦਰੀਆਉ ਸਮੁੰਦ੍ਰ ਵਿਚਿ; ਸਤ ਸਮੁੰਦ੍ਰ ਗੜਾੜਿ ਸਮੋਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Lacs of rivers flow into seas, and all the seven seas merge in the oceans."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਲਖਾਂ ਦਰੀਆਉ, ਸਮੁੰਦਰ ਵਿਖੇ ਮਿਲਦੇ ਹਨ, ਸੱਤੇ ਸਮੁੰਦਰ ਮਹਾਂ ਸਾਗਰ ਵਿਖੇ ਖਪਦੇ ਹਨ।"