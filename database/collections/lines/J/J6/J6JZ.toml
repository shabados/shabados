[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵੇਮੁਹਤਾਜੁ; ਪੂਰਾ ਪਾਤਿਸਾਹੁ ॥"
page = 893
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is the Independent, Perfect Sovereign."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਖੁਦ-ਮੁਖਤਿਆਰ ਮੁਕੰਮਲ ਸੁਲਤਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the independent, perfect Lord King."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬੇਪਰਵਾਹੁ ਅਰੁ ਵਹੀ ਪੂਰਾ ਪਾਤਸਾਹੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੈਨੂੰ ਕਿਸੇ ਦੀ ਮੁਥਾਜੀ ਨਹੀਂ, ਤੂੰ ਸਭ ਤਾਕਤਾਂ ਦਾ ਮਾਲਕ ਪਾਤਿਸ਼ਾਹ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵੇਮੁਹਤਾਜੁ = ਜਿਸ ਨੂੰ ਕਿਸੇ ਦੀ ਮੁਥਾਜੀ ਨਹੀਂ, ਕਿਸੇ ਗੋਚਰੀ ਗ਼ਰਜ਼ ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "tu Dios Verdadero, Independiente y Perfecto en todo."