data = "ਰੱਬ ਦੀ ਯਾਦ ਦੇ ਚਾਉ ਨੇ ਉਸ ਨੂੰ ਵਡਿਆਈ ਬਖ਼ਸ਼ੀ ਹੈ,"

[[content]]
