[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਹਮਾਰੈ ਨਿਹਚਲ ਧਨੀ ॥"
page = 1144
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Name is my Immovable Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਮੇਰਾ ਅਹਿਲ ਮਾਲਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Naam is my unmoving, unchanging Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰੇ ਨਾਮ ਹੀ ਅਚਲ ਧਨੀ ਹੈ; ਵਾ (ਨਿਹਚਲ ਧਨੀ) ਅਚਲ ਧਨੀ ਵਾਹਿਗੁਰੂ ਕਾ ਨਾਮ ਹੀ ਹਮਾਰੇ ਰਿਦੇ ਮੇਂ ਹੈ, ਭਾਵ ਯਹਿ ਕਿ ਸਰਬ ਫਲ ਪ੍ਰਦਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹੀ (ਮੇਰੇ ਸਿਰ ਉਤੇ) ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਮਾਲਕ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਹਚਲ ਧਨੀ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਮਾਲਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Nombre es mi Maestro Inmutable y Eterno,"