[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਹ ਸੱਚਾ ਪਤਿਸ਼ਾਹ ਤੇਰੀ ਸ਼ਹਿਰਗ ਤੋਂ ਵੀ ਨੇੜੇ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਚੂੰ ਜ਼ ਸ਼ਹਿਰਗ਼ ਹਸਤ ਸ਼ਾਹ ਨਜ਼ਦੀਕ ਤਰ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Even the heart of a lion is scorched with his arrow. (157)"