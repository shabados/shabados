[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧੰਨੁ ਸੁ ਤੇਰਾ ਥਾਨੁ ॥੧॥ ਰਹਾਉ ॥"
page = 50
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Blessed is that seat of Thine (O Master!). Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਬਾਰਕ ਹੈ ਤੇਰਾ ਉਹ ਟਿਕਾਣਾ (ਹੇ ਮਾਲਕ!) ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Blessed is Your Place. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੇਰਾ ਥਾਨੁ ਸਤਸੰਗੁ ਵਾ ਬੈਕੁੰਠੁ ਸੋ ਧੰਨ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਹਰੀ!) ਉਹ ਸਰੀਰ ਭਾਗਾਂ ਵਾਲਾ ਹੈ ਜਿਸ ਵਿਚ ਤੇਰਾ ਨਿਵਾਸ ਹੈ (ਜਿੱਥੇ ਤੈਨੂੰ ਯਾਦ ਕੀਤਾ ਜਾ ਰਿਹਾ ਹੈ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧੰਨੁ = ਭਾਗਾਂ ਵਾਲਾ। ਸੁ = ਉਹ (ਸਰੀਰ)। ਥਾਨੁ = ਨਿਵਾਸ॥੧॥ਰਹਾਉ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bendito, bendito es Tu Lugar Eterno."