[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੈ ਤਖਤਿ; ਬੁਲਾਵੈ ਸੋਇ ॥"
page = 355
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the Lord, summons the righteous to His throne,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਆਮੀ ਸਚਿਆਰਾਂ ਨੂੰ ਆਪਣੇ ਰਾਜ ਸਿੰਘਾਸਣ ਉਤੇ ਸੱਦ ਘਲਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He summons the truthful to His Heavenly Throne"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸਚੈ ਤਖਤਿ) ਸਰੂਪ ਮੇਂ ਵਾ ਬੈਕੁੰਠ ਮੇਂ ਸੋ ਪਰਮਾਤਮਾ ਬੁਲਾਉਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਸਦਾ-ਅਟੱਲ ਤਖ਼ਤ ਉਤੇ (ਬੈਠਾ ਹੋਇਆ ਪ੍ਰਭੂ) ਉਸ ਸੇਵਕ ਨੂੰ ਸੱਦਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਖਤਿ = ਤਖ਼ਤ ਉਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien al escuchar nuestras plegarias, nos Bendice a todos."