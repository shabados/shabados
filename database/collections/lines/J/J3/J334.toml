[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਹੁ ਸੁੰਦਰਤਾ ਰਮਾ ਦਈ; ਤਿਨ ਬਿਮਲ ਅਮਲ ਮਤਿ ॥"
page = 470

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Lakshmi gave him the beauty of the body and pure intellect"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਮਾ (ਲੱਛਮੀ) ਨੇ ਉਸ ਨੂੰ ਬਹੁਤ ਸੁੰਦਰਤਾ ਦਿੱਤੀ ਹੈ, (ਇਸ ਲਈ ਉਸ ਦੀ) ਬੁੱਧੀ ਨਿਰਮਲ ਅਤੇ ਉਜਲੀ ਹੈ।"