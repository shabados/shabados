[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਜੇ ਹੋਵੀ ਭਾਗੁ ॥"
page = 372
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, if such good be thy fate,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ ਜੇਕਰ ਤੇਰੀ ਚੰਗੀ ਕਿਸਮਤ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, if this is your destiny,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜੋ ਤੇਰਾ ਅਛਾ ਭਾਗ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਅਜੇਹੇ ਬ੍ਰਾਹਮਣ ਨੂੰ ਆਖ-) ਜੇ ਤੇਰੇ ਭਾਗ ਜਾਗਣ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੋਵੀ = ਹੋਵੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, si buscas la Liberación de tu destino,"