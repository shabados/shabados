[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਉਦਾਸੀ ਕਾ; ਪੜੈ ਨ ਕੰਧੁ ॥"
page = 952
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of that renunciator, the body-wall falls not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਉਪਰਾਮਤਾਵਾਨ ਦੀ ਦੇਹ ਦੀ ਦੀਵਾਰ ਢਹਿੰਦੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The body-wall of such an Udasi does not collapse."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਉਦਾਸੀ ਕਾ (ਕੰਧੁ) ਸਰੀਰ ਮੇਂ ਪੜਨਾ ਨਹੀਂ ਹੋਤਾ, ਭਾਵ ਜਨਮ ਮਰਨ ਸੇ ਰਹਤ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਵਿਰਕਤ ਮਨੁੱਖ ਦਾ ਸਰੀਰ (ਵਿਕਾਰਾਂ ਵਿਚ) ਨਹੀਂ ਡਿੱਗਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੜੈ ਨ = ਨਹੀਂ ਢਹਿੰਦਾ। ਕੰਧੁ = ਸਰੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal udasi nunca será destruido. Dice Gopi Chand, el Yogui,"