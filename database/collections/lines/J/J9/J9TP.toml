[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਹ ਬਰਨ ਬਰਨ; ਨਹ ਕੁਲਹ ਕੁਲ ॥"
page = 1231
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Amongst castes, Thou has no caste and amongst families no family."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਾਤਾਂ ਵਿਚੋਂ ਤੇਰੀ ਕੋਈ ਜਾਤੀ ਨਹੀਂ ਅਤੇ ਵੰਸ਼ਾਂ ਵਿਚੋਂ ਕੋਈ ਵੰਸ਼ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You have no caste or social class, no ancestry or family."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਰਨੋਂ ਮੇਂ ਤੇਰਾ ਕੋਈ ਬਰਣਨ ਨਹੀਂ ਔਰ (ਕੁਲਹ) ਸਮੂਹ ਕੁਲਾਂ ਭੀ ਤੇਰੇ ਮੇਂ ਨਹੀਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਲੋਕਾਂ ਦੇ ਮਿਥੇ ਹੋਏ) ਵਰਣਾਂ ਵਿਚੋਂ ਤੇਰਾ ਕੋਈ ਵਰਣ ਨਹੀਂ ਹੈ (ਲੋਕਾਂ ਦੀਆਂ ਮਿਥੀਆਂ) ਕੁਲਾਂ ਵਿਚੋਂ ਤੇਰੀ ਕੋਈ ਕੁਲ ਨਹੀਂ (ਤੂੰ ਕਿਸੇ ਖ਼ਾਸ ਕੁਲ ਖ਼ਾਸ ਵਰਣ ਦਾ ਪੱਖ ਨਹੀਂ ਕਰਦਾ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No tienes color, ni casta alguna, ni tampoco familia,"