[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਭਜ ਕਾਤਰੋ ਕਿਤੰ ਗਜੰਤ ਜੋਧਣੋ ਜੁਧੰ ॥"
page = 282

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many wounded warriors after being shot by sharp arrows began to wander and many warriors began to wander and many warriors began to roar and many of them becoming helpless breathed their last"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤਨੇ ਕਾਇਰ ਭੱਜ ਗਏ ਹਨ ਅਤੇ ਯੋਧੇ ਰਣ ਵਿੱਚ ਗੱਜਦੇ ਹਨ।"