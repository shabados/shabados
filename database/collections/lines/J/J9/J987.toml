data = "ਤਾ ਕੌ ਪੀਠਿ ਜਿਯਤ ਨਹਿ ਦੀਜੈ ॥"
page = 965

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘The one who adores some one, one must not back out,"

