[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਸਾਰ ਬਿਰਖ ਕਉ; ਦੁਇ ਫਲ ਲਾਏ ॥"
page = 1172
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To the world-plant, He has attached two fruits."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਦੇ ਬ੍ਰਿਛ ਨੂੰ ਉਸ ਨੇ ਦੋ ਮੇਵੇ ਲਾ ਦਿਤੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He attached these two fruits to the world-plant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰ ਰੂਪ ਬ੍ਰਿਛ ਕੋ ਏਹ ਪੁਰਬੋਕਤ ਦੋ ਫਲ ਲਗਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ-ਰੁੱਖ ਨੂੰ ਉਸ ਨੇ ਇਹ ਦੋਵੇਂ ਫਲ ਲਾਏ ਹੋਏ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਰਖ = ਰੁੱਖ। ਕਉ = ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, estos son los frutos que el mundo ofrece."