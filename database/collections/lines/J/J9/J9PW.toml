[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਸਤ੍ਰਨ ਸੋ ਅਤਿ ਹੀ ਰਨ ਭੀਤਰ; ਜੂਝਿ ਮਰੋ ਕਹਿ ਸਾਚ ਪਤੀਜੈ ॥"
page = 487

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "If I fall a martyr while fighting with my enemies then I shall think that I have realised Truth"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "'ਬਹੁਤ ਵਡੇ ਯੁੱਧ ਵਿਚ ਸ਼ਸਤ੍ਰਾਂ ਸਹਿਤ ਲੜ ਮਰਾਂ', ਸਚ ਕਹਿੰਦਾ ਹਾਂ, ਨਿਸਚਾ ਕਰ ਲਵੋ।"