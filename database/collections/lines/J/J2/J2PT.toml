[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਦਾਨ ਇਸਨਾਨੰ; ਅਨਿਕ ਸੋਧਨ ਪਵਿਤ੍ਰਤਹ ॥"
page = 706
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "One obtains the merit of millions of charities and ablutions and of various purifications and pieties,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਕ੍ਰੋੜਾਂ ਹੀ ਪੁੰਨਾਂ ਤੇ ਇਸ਼ਨਾਨਾਂ ਦਾ ਅਤੇ ਅਨੇਕਾਂ ਸੁੱਚਮਾਂ ਤੇ ਪਵਿੱਤਰਤਾਈਆਂ ਦਾ ਫਲ ਪਾ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The benefits of millions of charitable donations and cleansing baths, and countless ceremonies of purification and piety,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜੋਂ ਦਾਨ ਔ ਤੀਰਥ ਇਸਨਾਨ ਔ ਵਿਚਾਰ ਸਹਿਤ ਅਨੇਕ ਪਵਿਤ੍ਰਤਾ ਤਿਸ ਨੇ ਕਰ ਲਈਆਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਨੇ (ਮਾਨੋ) ਕ੍ਰੋੜਾਂ (ਰੁਪਏ) ਦਾਨ ਕਰ ਲਏ, ਕ੍ਰੋੜਾਂ ਵਾਰੀ ਤੀਰਥ-ਇਸ਼ਨਾਨ ਕਰ ਲਏ ਹਨ ਤੇ ਅਨੇਕਾਂ ਹੀ ਸੁੱਚ ਤੇ ਪਵਿਤ੍ਰਤਾ ਦੇ ਸਾਧਨ ਕਰ ਲਏ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਟਿ = ਕ੍ਰੋੜਾਂ। ਅਨਿਕ = ਅਨੇਕਾਂ। ਸੋਧਨ = ਸੁੱਚ ਰੱਖਣ ਵਾਲੇ ਸਾਧਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las faltas de aquél que repite el Nombre de Dios con Fe, son lavadas."