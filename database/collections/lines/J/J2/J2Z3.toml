[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਤੁ ਕੋ ਲਾਇਆ; ਤਿਤ ਹੀ ਲਾਗਾ ॥"
page = 239
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What the Lord attaches the mortal with, therewith he gets attached."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਨਾਲ ਸਾਹਿਬ ਪ੍ਰਾਣੀ ਨੂੰ ਜੋੜਦਾ ਹੈ, ਉਸ ਦੇ ਨਾਲ ਉਹ ਲੱਗ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As the Lord attaches someone, so is he attached."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਕੋ ਹਰੀ ਨੇ ਜਿਸ ਤਰਫ ਲਗਾਯਾ ਹੈ, ਤਿਸੀ ਤਰਫ ਲਾਗਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰੇਕ ਜੀਵ ਉਸੇ ਪਾਸੇ ਹੀ ਲੱਗਾ ਹੋਇਆ ਹੈ ਜਿਸ ਪਾਸੇ ਪਰਮਾਤਮਾ ਨੇ ਉਸ ਨੂੰ ਲਾਇਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਤੁ = ਜਿਸ (ਕੰਮ) ਵਿਚ। ਤਿਤ ਹੀ = {ਲਫ਼ਜ਼ 'ਤਿਤੁ' ਦਾ (ੁ) ਕ੍ਰਿਆ ਵਿਸ਼ੇਸ਼ਣ 'ਹੀ' ਦੇ ਕਾਰਨ ਉਡ ਗਿਆ ਹੈ} ਉਸ ਵਿਚ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, todos estamos como es Su Voluntad,"