[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇਹੀ ਤੂੰ ਮਤਿ ਦੇਹਿ; ਤੇਹੀ ਕੋ ਪਾਵੈ ॥"
page = 351
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As is the understanding thou givest any one, the like-wise he receives."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਹੋ ਜੇਹੀ ਸਮਝ ਤੂੰ ਕਿਸੇ ਨੂੰ ਦਿੰਦਾ ਹੈ, ਉਹੋ ਜੇਹੀ ਹੀ ਉਹ ਹਾਸਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As is the understanding which You bestow, so do we receive."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੀ ਤੂੰ  ਬੁਧਿ ਦੇਤਾ ਹੈ ਤੈਸੀ ਹੀ ਕੋਈ ਪਾਉਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਜਿਹੋ ਜਿਹੀ ਅਕਲ ਬਖ਼ਸ਼ਦਾ ਹੈਂ, ਉਹੀ ਅਕਲ ਜੀਵ ਗ੍ਰਹਣ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como lo instruyes, de esa manera él se hace sabio"