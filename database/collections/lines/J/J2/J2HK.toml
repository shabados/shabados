[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਦਿਨ ਤੇ ਪਰ ਨਾਰਿ ਕੌ; ਹੇਰਤ ਕਬਹੂੰ ਨਾਹਿ ॥੫੦॥"
page = 829

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘The same determination is abiding in my mind and I will never attend to another’s woman.(50)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਿਨ ਤੋਂ (ਮੈਂ ਕਿਸੇ) ਪਰਾਈ ਇਸਤਰੀ ਨੂੰ ਨਹੀਂ ਵੇਖਦਾ ॥੫੦॥"