[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਵ ਸਿਵ ਕਰਤੇ; ਜੋ ਨਰੁ ਧਿਆਵੈ ॥"
page = 874
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The man, who uttering the Name of Shiva and worships him;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਇਨਸਾਨ ਸ਼ਿਵਜੀ ਦਾ ਨਾਮ ਉਚਾਰਦਾ ਅਤੇ ਉਸ ਦੀ ਪੂਜਾ ਕਰਦਾ ਹੈ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That man who chants \"Shiva, Shiva\", and meditates on him,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਿਵ ਸਿਵ ਕਰਤੇ ਹੂਏ ਜੋ ਨਰ ਸਿਵ ਕੋ ਧਿਆਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਸ਼ਿਵ ਦਾ ਨਾਮ ਜਪਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que contempla a Shiva, como Shiva,"