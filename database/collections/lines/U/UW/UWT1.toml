[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੂਲ ਛਿਮੋ ਹਮਰੀ ਪ੍ਰਭ ਆਪਨ ਭੂਲਨਹਾਰ ਕਹੂੰ ਕੋਊ ਮੋ ਸੋ ॥"
page = 46

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O Lord! Forgive me for my mistakes, because who is there so much blunderhead like me?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਆਪ ਮੇਰੀ ਭੁਲ ਬਖਸ਼ ਦਿਓ (ਕਿਉਂਕਿ) ਮੇਰੇ ਵਰਗਾ ਹੋਰ ਕੋਈ ਭੁਲਣਹਾਰ ਨਹੀਂ ਹੈ।"