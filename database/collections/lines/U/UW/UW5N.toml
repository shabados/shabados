[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁ ਕੋਪ ਸੁਧ ਸਿੰਘ ਕੀ; ਸਮਾਨ ਸੂਰ ਪੇਖੀਐ ॥"
page = 701

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "This warrior of indivisible and powerful beauty looks highly infuriated like a lion"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਦੋਂ) ਉਹ ਕ੍ਰੋਧ ਕਰਦਾ ਹੈ ਤਾਂ (ਉਸ ਦਾ) ਰੂਪ ਨਿਰੋਲ ਸ਼ੇਰ ਵਰਗਾ ਦਿਸ ਪੈਂਦਾ ਹੈ।"