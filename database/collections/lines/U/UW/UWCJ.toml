[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਇ ਬਸਹਿ; ਸਾਧੂ ਕੈ ਸੰਗੇ ॥"
page = 252
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He comes and associates with the Saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆ ਕੇ ਸੰਤਾਂ ਨਾਲ ਮੇਲ-ਮਿਲਾਪ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They come and dwell with the Saadh Sangat, the Company of the Holy;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੁਰਸ ਸਾਧੂ ਕੇ ਸੰਗ ਮੇਂ ਆਇ ਕਰ ਨਿਵਾਸ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇਹੜੇ ਬੰਦੇ) ਗੁਰੂ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਆ ਟਿਕਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧੂ = ਗੁਰੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "de aquél que habita en la Saad Sangat, la Sociedad de los Santos,"