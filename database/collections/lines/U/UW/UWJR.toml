data = "ਚਲ ਚੌਦਹੂੰ ਚੱਕ੍ਰਨ ਚੱਕ੍ਰ ਫਿਰੰ ॥"
page = 43

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thy weapons are used in all the fourteen worlds alongwith Thy Command  the empty ones."

[[content]]
