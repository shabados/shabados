type = "primary"
data = "ਰਣਿ ਸਾਜਹਿਗੇ ॥੩੩੨॥"
page = 584

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors will be showered, there will be the twang of the bows, the sworeds will collide and the war will continue.332."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਤਰ੍ਹਾਂ) ਰਣ-ਭੂਮੀ ਸਜ ਜਾਵੇਗੀ ॥੩੩੨॥"