data = "ਅਤੇ ਬੈਠ ਕੇ ਵਿਚਾਰ ਕਰਨ ਲਗੇ ਕਿ ਕਿਹੜਾ (ਉਪਾ ਕੀਤਾ ਜਾਏ ਕਿ)"