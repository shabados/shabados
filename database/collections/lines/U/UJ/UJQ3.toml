[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲੰਕਾ ਗਢੁ; ਸੋਨੇ ਕਾ ਭਇਆ ॥"
page = 1158
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The fortress of Ceylon was made gold,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲੰਕਾਂ ਦਾ ਕਿਲ੍ਹਾ ਸੋਨੇ ਦਾ ਬਣਿਆ ਹੋਇਆ ਸੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The fortress of Sri Lanka was made out of gold,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਲੰਕਾ ਜੋ ਇਕ ਸ੍ਵਰਨ ਕਾ (ਗਢੁ) ਕਿਲਾ ਜਿਸ ਕਾ ਬਨਾ ਹੂਆ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਲੋਕ ਆਖਦੇ ਹਨ ਕਿ) ਲੰਕਾ ਦਾ ਕਿਲ੍ਹਾ ਸੋਨੇ ਦਾ ਬਣਿਆ ਹੋਇਆ ਸੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਢੁ = ਕਿਲ੍ਹਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ravana mandó construir la Fortaleza de Lanka de oro puro."