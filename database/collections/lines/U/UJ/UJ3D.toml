[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚੋਆ ਚੰਦਨੁ ਅਰਗਜਾ; ਹੁਇ ਦੁਰਗੰਧ ਸੁਗੰਧ ਹੁਰੇਹੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Sandal scent, and joss sticks etc also get converted into fowl smell."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਚੋਆ, ਚੰਦਨ, ਅਰਗਜਾ ਤੇ ਹੋਰ ਸੁਗੰਧੀਆਂ ਬੀ ਦੁਰਗੰਧ ਹੁੰਦੀਆਂ ਹਨ।"