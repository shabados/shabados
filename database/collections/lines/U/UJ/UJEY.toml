[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮਹੀਣ ਫਿਰਹਿ ਸੇ ਨਕਟੇ; ਤਿਨ ਘਸਿ ਘਸਿ ਨਕ ਵਢਾਇਆ ॥੩॥"
page = 882
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The shameless ones, They wander about without the Name. Their noses are gratingly shorn off."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਸ਼ਰਮ ਬੰਦੇ ਨਾਮ ਦੇ ਬਿਨਾਂ ਭਟਕਦੇ ਫਿਰਦੇ ਹਨ। ਉਹਨਾਂ ਦੇ ਨੱਕ ਰਗੜ ਰਗੜ ਕੇ ਵੱਢੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who lack the Naam, wander in shame; their noses are chopped off, bit by bit. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਮੁ ਤੇ ਹੀਣ ਰਹਿਤੇ ਹੈਂ, ਸੋ ਨਕ ਕਟੇ ਫਿਰਤੇ ਹੈਂ, ਭਾਵ ਸੇ ਵਹੁ ਇਸ ਲੋਗ ਮੇਂ ਜਸ ਰਹਿਤ ਹੈਂ; ਪੁਨਹ ਪ੍ਰਲੋਕ ਮੇਂ ਤਿਨਕਾ ਨਕ ਰਗੜ ਰਗੜ ਕੇ ਧਰਮ ਰਾਇ ਨੇ ਅਪੁਨੇ ਦੂਤੋਂ ਸੇ (ਵਢਾਇਆ) ਕਟਾਇਆ ਹੈ, ਭਾਵ ਤਿਨ ਕੋ ਬਹੁਤ ਸ਼ਰਮਿੰਦਾ ਕੀਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੇਹੜੇ ਮਨੁੱਖ ਨਾਮ ਤੋਂ ਵਾਂਜੇ ਰਹਿੰਦੇ ਹਨ, ਉਹ ਬੇਸ਼ਰਮਾਂ ਵਾਂਗ (ਦੁਨੀਆ ਵਿਚ) ਤੁਰੇ ਫਿਰਦੇ ਹਨ, ਉਹ ਅਨੇਕਾਂ ਵਾਰੀ ਬੇ-ਇੱਜ਼ਤੀ ਕਰਾ ਕੇ ਖ਼ੁਆਰ ਹੁੰਦੇ ਹਨ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫਿਰਹਿ = ਫਿਰਦੇ ਹਨ। ਸੇ = ਉਸ {ਬਹੁ-ਵਚਨ}। ਨਕਟੇ = ਨਿ-ਲੱਜ, ਬੇ-ਸ਼ਰਮ। ਘਸਿ ਘਸਿ = ਮੁੜ ਮੁੜ ਘਸ ਕੇ, ਬਹੁਤ ਬੇ-ਇੱਜ਼ਤੀ ਕਰਾ ਕੇ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no tienen honor y desperdician su vida en vano.  (3)"