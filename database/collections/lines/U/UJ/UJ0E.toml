[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਸਰ ਕਉਨੁ; ਕਹੈ ਬੀਚਾਰੁ ॥"
page = 280
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who else can say of deliberate upon it?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੋਰ ਕਿਹੜਾ ਇਸ ਨੂੰ ਆਖ ਜਾ ਸੋਚ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who else can speak or deliberate upon this?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕਾ ਵੀਚਾਰ ਔਰ ਦੂਸਰਾ ਕੌਨ ਕਹੈ ਅਰਥਾਤ ਕੋਈ ਨਹੀਂ ਕਹ ਸਕਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੌਣ ਕੋਈ ਦੂਜਾ ਸਲਾਹ ਦੱਸ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਸਰੁ = ਦੂਜਾ। ਬੀਚਾਰੁ = ਖ਼ਿਆਲ। ਜਨ"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Habría acaso alguien que pudiera agregar algo a Su Obra?"