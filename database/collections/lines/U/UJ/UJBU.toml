[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਉਪਜਾ ਅਧਿਕ ਪ੍ਰਜਾ ਕੋ ਸੋਗਾ ॥"
page = 194

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the people got worried about their ailments and the subjects became extremely distressed."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪਰਜਾ ਲਈ ਬਹੁਤ ਦੁਖ ਪੈਦਾ ਹੈ ਗਏ।"