[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈ ਨਾਹੀ; ਪ੍ਰਭ ਸਭੁ ਕਿਛੁ ਤੇਰਾ ॥"
page = 827
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am nothing, everything is Thine, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕੁਛ ਭੀ ਨਹੀਂ ਸਭ ਕੁਛ ਤੇਰਾ ਹੀ ਹੈ, ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am nothing, God; everything is Yours."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਅਬ ਮੈਂ ਕੁਛ ਨਹੀਂ ਵਾ ਮੈਂਨੇ ਆਪਨਾ ਕੁਛ ਨਹੀਂ ਮੰਨਿਆ ਹੈ, ਮਨ ਤਨ ਆਦੀ ਸਭ ਕਿਛ ਤੇਰਾ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੇਰੀ (ਆਪਣੇ ਆਪ ਵਿਚ) ਕੋਈ ਪਾਂਇਆਂ ਨਹੀਂ ਹੈ। (ਮੇਰੇ ਪਾਸ) ਹਰੇਕ ਚੀਜ਼ ਤੇਰੀ ਹੀ ਬਖ਼ਸ਼ੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਸਭੁ ਕਿਛੁ = ਹਰੇਕ ਚੀਜ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, no soy nadie y todo pertenece a Ti;"