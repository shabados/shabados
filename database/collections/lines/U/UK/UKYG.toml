[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਹਚਲ ਰਾਜੁ ਹੈ ਸਦਾ ਤਿਸੁ ਕੇਰਾ; ਨਾ ਆਵੈ. ਨਾ ਜਾਈ ॥"
page = 592
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever immovable is His empire and he neither comes nor goes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਦੀਵ ਸਥਿਰ ਹੈ ਉਸ ਦਾ ਰਾਜ ਭਾਗ। ਉਹ ਨਾਂ ਆਉਂਦਾ ਹੈ ਅਤੇ ਨਾਂ ਹੀ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His rule is unchanging and eternal; He does not come or go."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਸੇ ਉਸ ਕਾ ਰਾਜੁ ਸਦਾ ਨਿਹਚਲ ਹੈ, ਕਿਉਂਕਿ ਨ ਕਹੀਂ ਸੇ ਆਉਤਾ ਹੈ ਔਰ ਨ ਜਾਤਾ ਹੈ, ਭਾਵ ਜਨਮ ਮਰਣ ਸੇ ਰਹਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਰਾਜ ਸਦਾ ਅਟੱਲ ਹੈ, ਨਾ ਉਹ ਜੰਮਦਾ ਹੈ ਨਾ ਮਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios no tiene igual, ni rival que le aflija; Su Reino es Eterno e Inmutable, no viene ni va."