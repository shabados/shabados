[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਨਿਰੰਤਰਿ; ਏਕੋ ਜਾਗੈ ॥"
page = 743
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Amidst all, the One Lord lies awake."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਅੰਦਰ ਪ੍ਰਭੂ ਸੁਚੇਤ ਹੋ ਕੇ ਵਿਚਰ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Within and among all, the One Lord is awake."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਕੇ ਬੀਚ ਏਕ ਰਸ ਤੂੰ  ਹੀ ਪਰਕਾਸਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਜੀਵਾਂ ਦੇ ਕੀਹ ਵੱਸ?) ਹਰੇਕ ਜੀਵ ਉਸੇ ਉਸੇ ਕੰਮ ਵਿਚ ਲੱਗਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਬ ਨਿਰੰਤਰਿ = ਸਭਨਾਂ ਦੇ ਅੰਦਰ ਇਕ-ਰਸ {ਅੰਤਰੁ = ਵਿੱਥ}। ਏਕੋ = ਇਕ ਪਰਮਾਤਮਾ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En lo más profundo de todos los seres, el Uno Solo permanece Despierto,"