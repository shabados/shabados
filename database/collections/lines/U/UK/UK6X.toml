[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭਿ ਆਪੇ ਪੈਜ ਰਖਾਈ ॥੧॥"
page = 626
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself saves my honour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਆਪੇ ਹੀ ਮੇਰੀ ਇੱਜ਼ਤ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God Himself preserves my honor. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੈਨੇ ਆਪ ਹੀ (ਪੈਜ) ਪ੍ਰਤਿਸ਼ਟਾ ਹਮਾਰੀ ਗੁਰੋਂ ਸੇ ਰਖਾਈ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਸ਼ਰਨ ਪਏ ਜੀਵ ਦੀ) ਪ੍ਰਭੂ ਨੇ ਆਪ ਹੀ ਇੱਜ਼ਤ (ਸਦਾ) ਰਖਾਈ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ। ਆਪੇ = ਆਪ ਹੀ। ਪੈਜ = ਇੱਜ਼ਤ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Dios; ¡salva mi honor! (1)"