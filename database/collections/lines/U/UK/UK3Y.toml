[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਿਤ ਚਾਹਤ ਹੈ ਚਹਿ ਹੈ ਤਿਹ ਤੇ; ਫੁਨਿ ਏਕਲੇ ਕੈ ਕਰਿ ਖਗ ਗਹਿਓ ॥"
page = 531

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then he also, according to his desire kept a sword with him and concealed it"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਚਿਤ ਕਰਦਾ ਹੈ ਕਿ ਉਸ ਨੂੰ ਇਕਲਿਆਂ ਕਰ ਕੇ ਯੁੱਧ ਦੀ ਚਾਹ ਕਰੀਏ ਅਤੇ ਹੱਥ ਵਿਚ ਖੜਗ ਧਾਰਨ ਕਰ ਲਈਏ।"