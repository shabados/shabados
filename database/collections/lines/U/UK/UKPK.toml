data = "ਜਾਤ ਪਾਤ ਜਿਹ ਚਿਹਨ ਨ ਬਰਨਾ ॥"
page = 11

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He Who is without caste, lineage, mark and colour."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਜਾਤਿ, ਬਰਾਦਰੀ, ਚਿੰਨ੍ਹ ਅਤੇ ਵਰਨ ਨਹੀਂ ਹੈ।"