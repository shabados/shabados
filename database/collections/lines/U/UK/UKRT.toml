[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਉ ਜੋਤੀ ਸੰਗਿ; ਜੋਤਿ ਸਮਾਨਾ ॥"
page = 278
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "so does his lights blend with the Supreme Light."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਏਸੇ ਤਰ੍ਹਾਂ ਹੀ ਉਸ ਦਾ ਨੂਰ ਪਰਮ-ਨੂਰ ਨਾਲ ਅਭੇਦ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "his light blends into the Light."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੈਸੇ ਵਹੁ ਜਨ ਤਿਸ ਜੋਤੀ ਸਾਥ ਜੋਤਿ ਰੂਪ ਹੋ ਕਰ ਸਮਾਨਾ ਹੈ, ਭਾਵ ਅਭੇਦ ਹੋਇ ਗਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਿਵੇਂ (ਸਤਸੰਗ ਵਿਚ ਟਿਕੇ ਹੋਏ ਦੀ) ਆਤਮਾ ਪ੍ਰਭੂ ਦੀ ਜੋਤਿ ਵਿਚ ਲੀਨ ਹੋ ਜਾਂਦੀ ਹੈ;"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "su luz se funde en la Luz Divina"