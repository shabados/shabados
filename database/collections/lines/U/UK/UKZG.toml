[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਮਹਿ ਵਰਤੈ ਏਕੋ ਸੋਇ ॥"
page = 931
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the one Lord, is contained amongst all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਇੱਕ ਸੁਆਮੀ ਹੀ ਸਾਰਿਆਂ ਅੰਦਰ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One Lord is contained among all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਮੇਂ (ਸੋਇ) ਪੂਰਬੁਕਤ ਏਕ ਹੀ ਵਰਤਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਝੱਲ-ਪੁਣੇ ਵਿਚ ਨਹੀਂ ਸਮਝਦਾ ਕਿ ਭਾਵੇਂ ਕੋਈ ਗ਼ਰੀਬ ਹੈ ਭਾਵੇਂ ਅਮੀਰ) ਉਹ (ਗੋਪਾਲ) ਆਪ ਹੀ ਸਭ ਜੀਵਾਂ ਵਿਚ ਮੌਜੂਦ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਕੋ ਸੋਇ = ਉਹ (ਗੋਪਾਲ) ਆਪ ਹੀ। ਵਰਤੈ = ਮੌਜੂਦ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Único Señor prevalece en todos los seres,"