data = "ਪੂਤ ਤਿਹੂੰ ਕਉ ਰਚਯੋ ਬਿਯਾਹਾ ॥"
page = 215

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "With great enthusiasm the marriage of the three remaining sons was fixed."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਰਾਜੇ ਨੇ) ਤਿੰਨਾਂ ਪੁੱਤਰਾਂ ਦਾ ਵਿਆਹ ਰਚਾਇਆ।"