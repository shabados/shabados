[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਡੇ ਬਡੇ ਛਤ੍ਰੀ ਬਸੁਧਾ ਕੇ; ਲੀਨੇ ਨਿਕਟਿ ਬੁਲਾਈ ॥"
page = 683

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "One day, the king held his court, wherein he had invited the chief kings of the earth"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਧਰਤੀ ਦੇ ਵੱਡੇ ਵੱਡੇ ਰਾਜਿਆਂ ਨੂੰ ਕੋਲ ਬੁਲਾ ਲਿਆ।"