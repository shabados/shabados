[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹ ਸੰਤ ਨਿਰਮਲ ਰੀਤਿ ॥"
page = 837
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This is the immaculate way of the saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਾਧੂਆਂ ਦੀ ਪਵਿੱਤਰ ਮਰਿਯਾਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is the Immaculate Way of the Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਸੰਤੋਂ ਕੀ ਇਹੁ ਨਿਰਮਲ ਰੀਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨਾਂ ਦੀ ਦੱਸੀ ਹੋਈ ਇਹ (ਜੀਵਨ ਨੂੰ) ਪਵਿੱਤਰ ਕਰਨ ਵਾਲੀ ਮਰਯਾਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਮਲ ਰੀਤਿ = ਪਵਿੱਤਰ ਕਰਨ ਵਾਲੀ ਮਰਯਾਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues ese es el Sendero Inmaculado de los Santos."