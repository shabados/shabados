[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੈ ਗੈ ਰਥ ਪੈਦਲ ਘਨੇ; ਨ੍ਰਿਪ ਉਠਿ ਚਲੇ ਅਨੇਕ ॥੬॥"
page = 931

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Some became foot-soldiers, and some took Raja’s horses, elephants and chariots.( 6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਘੋੜੇ, ਹਾਥੀ, ਰਥ, ਪੈਦਲ ਅਤੇ ਅਨੇਕ ਰਾਜੇ ਉਠ ਕੇ ਚਲ ਪਏ ॥੬॥"