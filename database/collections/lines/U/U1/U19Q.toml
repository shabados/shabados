[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤ੍ਰਿਸਨਾ ਅਗਨਿ; ਪ੍ਰਭਿ ਆਪਿ ਬੁਝਾਈ ॥"
page = 684
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself quenches his fire of desires."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪੇ ਹੀ ਉਸ ਦੀ ਖਾਹਿਸ਼ਾਂ ਦੀ ਅੱਗ ਨੂੰ ਬੁਝਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God Himself quenches the fires of desire."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨੋਂ ਕੀ ਤ੍ਰਿਸ਼ਨਾ ਅਗਨੀ ਪ੍ਰਭੂ ਨੇ ਆਪ ਬੁਝਾਈ, ਭਾਵ ਦੂਰ ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਜੇਹੜੇ ਮਨੁੱਖ ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਗਾਂਦੇ ਹਨ) ਉਹਨਾਂ ਦੀ ਤ੍ਰਿਸ਼ਨਾ ਦੀ ਅੱਗ ਪ੍ਰਭੂ ਨੇ ਆਪ ਬੁਝਾ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El fuego de las ansiedades es sofocado por el Mismo Dios,"