[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੁ ਸਲਾਹੀ ਸਚੁ ਮਨਿ; ਦਰਿ ਸਚੈ ਸਚਿਆਰੁ ॥੨੦॥"
page = 756
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Praising the True Lord with the true heart, man becomes true in the True Court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਸੁਆਮੀ ਦੀ ਸੱਚੇ ਦਿਲ ਨਾਲ ਸਿਫ਼ਤ ਕਰਨ ਦੁਆਰਾ ਇਨਸਾਨ ਸੱਚੇ ਦਰਬਾਰ ਅੰਦਰ ਸੱਚਾ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Praising the True Lord with a truthful mind, he becomes true in the Court of the True Lord. ||20||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਸੱਚ ਕਾ ਹੀ ਸਲਾਹੀ ਹੋਤਾ ਹੈ ਔਰ ਸੱਚ ਹੀ ਮਨ ਮੇਂ ਧਾਰਤਾ ਹੈ ਪੁਨਾ ਸਚੇ ਕੀ ਦਰਗਾਹ ਮੇਂ ਸਚਿਆਰ ਹੋਤਾ ਹੈ॥੨੦॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤੂੰ (ਸਾਧ ਸੰਗਤਿ ਵਿਚ ਟਿਕ ਕੇ) ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਕਰਿਆ ਕਰ, ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਨੂੰ ਆਪਣੇ ਮਨ ਵਿਚ ਵਸਾ ਲੈ, (ਇਸ ਤਰ੍ਹਾਂ) ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ ਸੁਰਖ਼-ਰੂ ਹੋਵੇਂਗਾ ॥੨੦॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਲਾਹੀ = ਸਾਲਾਹਿ, ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਕਰ। ਮਨਿ = ਮਨ ਵਿਚ। ਦਰਿ ਸਚੈ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ। ਸਚਿਆਰੁ = ਸੁਰਖ਼-ਰੂ ॥੨੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "alaba al Uno Verdadero, Lo eleva en su mente y es aclamado Verdadero en la Corte del Señor. (20)"