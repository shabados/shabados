[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਸਤਿਗੁਰ ਕਿਨੈ. ਨ ਪਾਇਓ; ਮਨਿ ਵੇਖਹੁ ਕੋ ਪਤੀਆਇ ॥"
page = 1277
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the True Guru no one attains unto the Lord, Let any one examine and see it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਦੇ ਬਗੈਰ, ਕਿਸੇ ਨੂੰ ਭੀ ਪ੍ਰਭੂ ਪਰਾਪਤ ਨਹੀਂ ਹੁੰਦਾ। ਬੇਸ਼ਕ ਕੋਈ ਜਣਾ ਇਸ ਦਾ ਪਰਤਾਵਾ ਕਰ ਕੇ ਦੇਖ ਲਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the True Guru, no one finds the Lord; anyone can try and see."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਸੇ ਬਿਨਾਂ ਗੁਣੋਂ ਕੋ ਕਿਸੀ ਨੇ ਨਹੀਂ ਪਾਇਆ, ਕੋਈ ਮਨ ਮੇਂ (ਪਤੀਆਇ) ਨਿਸਚੇ ਕਰ ਕੇ ਦੇਖ ਲੇਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬੇਸ਼ੱਕ ਕੋਈ ਧਿਰ ਮਨ ਵਿਚ ਨਿਰਨਾ ਕਰ ਕੇ ਵੇਖ ਲਵੇ, ਗੁਰੂ (ਦੀ ਸਰਨ) ਤੋਂ ਬਿਨਾ ਕਿਸੇ ਨੇ ਭੀ (ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਧਨ) ਹਾਸਲ ਨਹੀਂ ਕੀਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਨੈ = ਕਿਸੇ ਨੇ ਭੀ। ਮਨਿ = ਮਨ ਵਿਚ। ਕੋ = ਕੋਈ ਧਿਰ। ਪਤਿਆਇ = ਪਰਤਾਵਾ ਕਰ ਕੇ, ਨਿਰਨਾ ਕਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Guru Verdadero nadie encuentra al Señor, quién quiera puede tratar y ver."