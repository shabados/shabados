[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਕੀਤੇ; ਸੋਈ ਬਿਧਿ ਜਾਣੈ ॥"
page = 118
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who created them, knows their condition."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਸਾਜਿਆ ਹੈ, ਊਹੀ ਉਨ੍ਹਾਂ ਦੀ ਦਸ਼ਾ ਨੂੰ ਸਮਝਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One who created them, knows their condition."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਬਿਧਾਤਾ ਨੇ ਉਤਪਤਿ ਕਰੇ ਹੈਂ ਸੋਈ ਇਨ ਕੀ ਗਤੀ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰਮਾਤਮਾ ਨੇ ਜੀਵ ਪੈਦਾ ਕੀਤੇ ਹਨ, ਉਹੀ ਇਹਨਾਂ ਨੂੰ ਨਰੋਆ ਕਰਨ ਦਾ ਢੰਗ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਪਰਮਾਤਮਾ) ਨੇ। ਕੀਤੇ = ਪੈਦਾ ਕੀਤੇ। ਬਿਧਿ = ਤਰੀਕਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Solamente Aquél que creó a los hombres, conoce el camino;"