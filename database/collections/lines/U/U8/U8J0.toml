[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈ ਕਾਰਣਿ; ਤਟਿ ਤੀਰਥ ਜਾਹੀ ॥"
page = 152
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The reason thou goest to the banks of the holy streams,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਖਾਤਰ ਤੂੰ ਪਵਿੱਤ੍ਰ ਨਦੀਆਂ ਦੇ ਕਿਨਾਰਿਆਂ ਤੇ ਜਾਂਦਾ ਹੈਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "For the sake of it, you journey to sacred shrines and holy rivers;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਪ੍ਰਾਪਤੀ ਕੇ ਵਾਸਤੇ ਤੀਰਥੋਂ ਕੇ ਕਨਾਰੇ ਪਰ ਜਾ ਕਰ ਬੈਠਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ (ਨਾਮ-ਰਤਨ) ਦੀ ਖ਼ਾਤਰ ਲੋਕ ਤੀਰਥਾਂ ਦੇ ਕੰਢੇ ਤੇ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੈ ਕਾਰਣਿ = ਜਿਸ (ਰਤਨ ਪਦਾਰਥ) ਦੀ ਖ਼ਾਤਰ। ਤਟਿ = ਕੰਢੇ ਉੱਤੇ। ਤਟਿ ਤੀਰਥ = ਤੀਰਥਾਂ ਦੇ ਕੰਢੇ ਤੇ। ਜਾਹੀ = ਜਾਹਿ, ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El estado de conciencia que tú buscas encontrar en lugares santos,"