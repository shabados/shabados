[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਖ ਸਾਗਰੁ ਹਰਿ ਨਾਮੁ ਹੈ; ਗੁਰਮੁਖਿ ਪਾਇਆ ਜਾਇ ॥"
page = 29
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "An ocean of peace is the Name of God. By Guru's grace it is procured."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ ਸ਼ਾਂਤੀ ਦਾ ਸਮੁੰਦਰ ਹੈ। ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਇਹ ਪ੍ਰਾਪਤ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Name of the Lord is the Ocean of Peace; the Gurmukhs obtain it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਸੁਖੋਂ ਕਾ (ਸਾਗਰੁ) ਸਮੁੰਦ੍ਰ ਏਕ ਹਰੀ ਕਾ ਨਾਮੁ ਹੈ, ਵਹੁ ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸੁਖਾਂ ਦਾ ਸਮੁੰਦਰ ਹੈ, ਪਰ ਇਹ ਮਿਲਦਾ ਹੈ ਗੁਰੂ ਦੀ ਸਰਨ ਪਿਆਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਗਰੁ = ਸਮੁੰਦਰ। ਗੁਰਮੁਖਿ = ਗੁਰੂ ਵਲ ਮੂੰਹ ਕੀਤਿਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Nombre del Señor es el Océano de Paz. A través del Guru, el Señor es obtenido."