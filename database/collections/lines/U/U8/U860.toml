[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗੁ ਬਿਲਾਵਲੁ ਮਹਲਾ ੫ ਘਰੁ ੧੩ ਪੜਤਾਲ ॥"
page = 830
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rag Bilawal.5th Guru. Partal."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਬਿਲਾਵਲ। ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ। ਪੜਤਾਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Bilaaval, Fifth Mehl, Thirteenth House, Partaal:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਬਿਲਾਵਲੁ, ਘਰ ੧੩ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਪੜਤਾਲ'।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੜਤਾਲ = ਪਟਹ ਤਾਲ {ਪਟਨ = ਢੋਲ} ਢੋਲ ਦੇ ਵੱਜਣ ਵਾਂਗ ਖੜਕਵਾਂ ਤਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Bilawal, Quinto Canal Divino, Partala."