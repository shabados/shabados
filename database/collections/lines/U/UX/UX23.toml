data = "ਤਬ ਭਾਖੀਅਉ ਮੁਹਿ ਰਾਇ ॥੧੬੩॥"
page = 691

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O sage! tell me, who is that king, whom I should conquer? And then you will call me the greatest Sovereign on all.”163."

