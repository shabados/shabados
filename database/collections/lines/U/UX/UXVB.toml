[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਹਰਿ ਟੋਲੈ; ਸੋ ਭਰਮਿ ਭੁਲਾਹੀ ॥"
page = 102
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who seeks without is lost in doubt."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਬਾਹਰਵਾਰ ਢੂੰਡਦਾ ਹੈ, ਉਹ ਸੰਸੇ ਅੰਦਰ ਘੁਸ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who searches outside is deluded by doubt."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੁਰਸ ਭਰਮ ਕਰ ਕੇ ਭੂਲੇ ਹੈਂ, ਸੋ ਬਾਹਿਰ ਢੂੰਢਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਬਾਹਰ ਸੁੱਖ ਦੀ ਭਾਲ ਕਰਦਾ ਹੈ (ਉਹ ਸੁਖ ਨਹੀਂ ਲੱਭ ਸਕਦਾ) ਅਜੇਹੇ ਬੰਦੇ ਤਾਂ ਭਟਕਣਾ ਵਿਚ ਪੈ ਕੇ ਕੁਰਾਹੇ ਪਏ ਰਹਿੰਦੇ ਹਨ"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਟੋਲੈ = (ਸੁਖ ਦੀ) ਭਾਲ ਕਰਦਾ ਹੈ। ਭਰਮਿ = ਭਟਕਣਾ ਵਿਚ (ਪੈ ਕੇ)। ਭੁਲਾਹੀ = ਭੁਲਾਹਿ, ਕੁਰਾਹੇ ਪਏ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que busca afuera, se pierde en la duda."