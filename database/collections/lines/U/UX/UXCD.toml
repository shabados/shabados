[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਹੁ ਤ ਏਕੋ ਨਾਮਾ ॥"
page = 728
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Contemplate thou the one Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਇਕ ਨਾਮ ਦਾ ਆਰਾਧਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chant the Name of the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮਾਨੁਖੁ ਜਨਮ ਕੀ ਜੇ ਸਫਲਤਾ ਚਾਹੋ ਤੋ ਭੇਖਾਂ ਕਾ ਅਭਿਮਾਨ ਤ੍ਯਾਗ ਕੇ ਜਪਣਾ ਹੈ (ਤ) ਏਕ ਨਾਮ ਕੋ ਹੀ ਜਪਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜੇ ਪ੍ਰਭੂ ਨੂੰ ਪ੍ਰਸੰਨ ਕਰਨਾ ਹੈ) ਤਾਂ ਸਿਰਫ਼ ਪ੍ਰਭੂ-ਨਾਮ ਹੀ ਜਪੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਕੋ ਨਾਮਾ = ਸਿਰਫ਼ ਪ੍ਰਭੂ-ਨਾਮ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canta el Nombre del Señor"