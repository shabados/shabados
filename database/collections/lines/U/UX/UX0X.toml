[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੀਨੋ ਰੀ; ਸਗਲ ਸਂ‍ੀਗਾਰ ॥"
page = 1271
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have made all the decorations,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਾਰੇ ਹਾਰ ਸ਼ਿੰਗਾਰ ਲਾਏ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have made all my decorations,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰੀ ਸਖੀ! ਸਾਧਨਾ ਰੂਪੀ ਸਭ ਸੀਂਗਾਰ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਸਾਰੇ (ਆਤਮਕ) ਸਿੰਗਾਰ ਕਰ ਲਏ (ਭਾਵ, ਉਸ ਦੇ ਅੰਦਰ ਉੱਚੇ ਆਤਮਕ ਗੁਣ ਪੈਦਾ ਹੋ ਗਏ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੀ = ਹੇ ਸਖੀ! ਸਗਲ ਸੀਗਾਰ = ਸਾਰੇ (ਆਤਮਕ) ਸੁਹਜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Misericordioso Señor, he decorado mi ser"