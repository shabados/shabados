[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵਨੁ ਜਾਵਨੁ; ਮਾਇਆ ਧੰਧ ॥੧॥"
page = 888
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Involved in worldly affairs, thou shalt continue coming and going."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰੀ ਵਿਹਾਰਾਂ ਅੰਦਰ ਫਸ ਕੇ, ਤੂੰ ਜੰਮਦਾ ਤੇ ਮਰਦਾ ਰਹੇਗਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You come and go, entangled in Maya. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਵਨਾ ਪੁਨਹ ਜਾਵਨਾ ਇਹ ਸਭ ਮਾਯਾ ਕਾ ਹੀ ਧੰਧ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦੇ ਧੰਧਿਆਂ ਦੇ ਕਾਰਨ ਜਨਮ ਮਰਨ ਦਾ ਗੇੜ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਵਨੁ ਜਾਵਨੁ = ਜਨਮ ਮਰਨ ਦਾ ਗੇੜ। ਧੰਧ = ਧੰਧੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así va y viene y se involucra en Maya (1)"