[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁ ਰਸੁ; ਕਬੀਰੈ ਜਾਨਿਆ ॥"
page = 655
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That elixir, has Kabir quaffed,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਨੇ ਉਹ ਅੰਮ੍ਰਿਤ ਪਾਨ ਕੀਤਾ ਹੈ"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Kabeer has tasted that subtle essence;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਬੀਰ ਜੀ! ਤਬ ਸੋ ਉਤਮ ਰਸ ਆਤਮਾ ਅਨੰਦ ਮੈਨੇ ਜਾਨਾ ਹੈ"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅੱਗੋਂ ਜਾਗੀ ਹੋਈ ਜਿੰਦ ਉੱਤਰ ਦੇਂਦੀ ਹੈ) ਹੇ ਕਬੀਰ! ਸਤਿਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਮੇਰੀ ਉਸ ਆਤਮਕ ਆਨੰਦ ਨਾਲ ਜਾਣ-ਪਛਾਣ ਹੋ ਗਈ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸੁ = ਆਤਮਕ ਅਨੰਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "he probado esa Esencia de Dios"