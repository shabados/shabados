[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੇ ਨਾਮ ਕੀ ਵਡਿਆਈ ॥"
page = 626
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The glory is in the God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਜ਼ੁਰਗੀ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਵਿੱਚ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is the glorious greatness of the Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹ ਸਭ ਹਰੀ ਨਾਮ ਕੀ ਵਡ੍ਯਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਨੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਡਿਆਈ = ਸੋਭਾ, ਸਿਫ਼ਤ-ਸਾਲਾਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¡Gloria al Nombre del Señor!"