[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜੰਮਣਿ ਭਦਣਿ ਮੰਗਣੈ; ਮਰਣੈ ਪਰਣੇ ਕਰਦੇ ਢੋਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They carry the messages on births, the mundan (shaving of head) ceremonies, betrothals, marriages and deaths"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੰਮਣ, ਸਿਰ ਮੁੰਡਨ, ਸਗਾਈ, ਮਰਣੇ, ਪਰਣਿਆਂ ਵਿਖੇ (ਸਮੱਗਰੀਆਂ) ਕਠੀਆਂ ਕਰਦੇ ਹਨ।"