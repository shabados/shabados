[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਆ ਤੂ ਜੋਗੀ; ਗਰਬਹਿ ਪਰਿਆ ॥੧॥"
page = 886
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then, why art thou involved in ego, O Yogi?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਤੂੰ ਕਿਉਂ ਹੰਕਾਰ ਅੰਦਰ ਫਾਥਾ ਹੋਇਆ ਹੈਂ, ਹੇ ਯੋਗੀ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Yogi, why are you so proud? ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੋਗੀ: ਤੂੰ ਕਿਆ ਹੰਕਾਰ ਮੇਂ ਧਰਿਆ ਹੈਂ ਵਾ ਤੂੰ ਕਿਆ ਪਿਆ ਗਰਬਤਾ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੋਗੀ! ਤੂੰ (ਆਪਣੀ ਗੋਦੜੀ ਦਾ) ਕੀਹ ਪਿਆ ਮਾਣ ਕਰਦਾ ਹੈਂ? ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਰਬਹਿ = ਅਹੰਕਾਰ ਵਿਚ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Entonces, ¿de qué te sientes orgulloso, oh Yogui?(1)"