[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪੂਰੇ ਤੇ ਪਾਵੈ ॥"
page = 629
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who is blessed with it by the Perfect Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੂਰਨ ਗੁਰਾਂ ਪਾਸੋਂ ਇਸ ਨੂੰ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is obtained from the Perfect Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੂਰੇ ਗੁਰੋਂ ਸੇ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ, ਜੇਹੜਾ (ਇਹ ਦਾਤਿ) ਪੂਰੇ ਗੁਰੂ ਤੋਂ ਹਾਸਲ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ, ਪਾਸੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, uno es bendecido con el Nombre por el Perfecto Guru,"