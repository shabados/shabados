[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਧਰਮ; ਅਨਿਕ ਕੁਮੇਰ ॥"
page = 1236
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There are countless the righteous judges and countless the gods of wealth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਣਗਿਣਤ ਹਨ ਧਰਮਰਾਜੇ ਅਤੇ ਅਣਗਿਣਤ ਦੌਲਤ ਦੇ ਦੇਵਤੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many righteous judges of Dharma, many gods of wealth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੇਕ ਹੀ ਧਰਮਰਾਜ ਹੈਂ ਔਰ ਅਨੇਕ ਹੀ ਕੁਬੇਰ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! (ਉਸ ਪਰਮਾਤਮਾ ਦੇ ਪੈਦਾ ਕੀਤੇ ਹੋਏ) ਅਨੇਕਾਂ ਧਰਮਰਾਜ ਹਨ ਅਨੇਕਾਂ ਹੀ ਧਨ ਦੇ ਦੇਵਤੇ ਕੁਬੇਰ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਰਮ = ਧਰਮਰਾਜ। ਕੁਮੇਰ = ਕੁਬੇਰ, ਧਨ ਦਾ ਦੇਵਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones de millones, los Dharmarayas y los Kuberas,"