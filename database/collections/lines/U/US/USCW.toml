[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਨਿਤ ਜਪਿਹੁ ਜੀਅਹੁ; ਲਾਹਾ ਖਟਿਹੁ ਦਿਹਾੜੀ ॥"
page = 921
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever utter thou the Lord's Name O my soul and thou shalt daily gain profit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਦਾ ਹੀ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰ ਹੇ ਮੇਰੀ ਜਿੰਦੇ! ਅਤੇ ਤੂੰ ਹਰ ਰੋਜ਼ ਹੀ ਨਫ਼ਾ ਕਮਾਵੇਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate continually on the Lord, Har, Har, O my soul, and you shall collect your profits daily."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੀਵ! ਤੁਮ ਭੀ ਹਰਿ ਹਰਿ ਨਾਮ ਕੋ ਨਿਤ ਹੀ ਜਪੋ ਪੁਨਾ (ਦਿਹਾੜੀ) ਦਿਨ ਦਿਨ ਵਿਖੇ ਏਹੀ ਲਾਭ ਖਟੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੁਸੀ ਭੀ ਪ੍ਰੇਮ ਨਾਲ ਸਦਾ ਹਰੀ ਦਾ ਨਾਮ ਜਪਿਆ ਕਰੋ, ਤੇ ਹਰ ਰੋਜ਼ (ਆਤਮਕ ਆਨੰਦ ਦਾ) ਲਾਭ ਖੱਟੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅਹੁ = ਦਿਲੋਂ, ਪੂਰੇ ਪ੍ਰੇਮ ਨਾਲ। ਦਿਹਾੜੀ = ਹਰ ਰੋਜ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así lo entendí del Guru: contempla siempre a tu Señor y disfruta de Sus Ganancias."