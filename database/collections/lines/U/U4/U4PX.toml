[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮਕਲੀ ਮਹਲਾ ੩ ਅਸਟਪਦੀਆ ॥"
page = 908
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ramkali 3rd Guru. Ashtpadis"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਮਕਲੀ ਤੀਜੀ ਪਾਤਿਸ਼ਾਹੀ। ਅਸ਼ਟਪਦੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raamkalee, Third Mehl, Ashtpadheeyaa:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਰਾਮਕਲੀ ਵਿੱਚ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਦੀ ਅੱਠ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ramkali, Mejl Guru Amar Das, Tercer Canal Divino, Ashtapadis."