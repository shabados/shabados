[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਜੂਨੀ ਸੰਭਉ ॥"
page = 1201
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "unborn and self-illumined."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਵੈ-ਪ੍ਰਕਾਸ਼ਵਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "beyond birth, Self-existent."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਜੂਨੀ ਹੈ, ਸ੍ਵੰਭਵ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੂਨਾਂ ਵਿਚ ਨਹੀਂ ਆਉਂਦਾ, ਜੋ ਆਪਣੇ ਆਪ ਤੋਂ ਪਰਗਟ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਜੂਨੀ = ਜੋ ਜੂਨਾਂ ਵਿਚ ਨਹੀਂ ਪੈਂਦਾ। ਸੰਭਉ = {स्वयंभु } ਜੋ ਆਪਣੇ ਆਪ ਤੋਂ ਪਰਗਟ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, medita noche"