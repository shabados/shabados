[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਕਲਾ; ਖੇਲੈ ਗੋਪਾਲ ॥੫॥"
page = 1163
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In millions of ways the Lord plays,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾਂ ਹੀ ਤਰੀਕਿਆਂ ਨਾਲ ਸੁਅਮੀ ਖੇਡਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord plays in countless ways. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜੋਂ ਸ਼ਕਤੀਆਂ ਕੋ ਧਾਰ ਕਰ ਗੋਪਾਲ ਹੀ ਸਰਬ ਰੂਪ ਹੋ ਕਰ ਖੇਲ ਰਹੇ ਹੈਂ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਜਿਸ ਗੋਪਾਲ ਦੇ ਦਰ ਤੇ ਕ੍ਰੋੜਾਂ ਸ਼ਕਤੀਆਂ ਖੇਡਾਂ ਕਰ ਰਹੀਆਂ ਹਨ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਲਾ = ਸ਼ਕਤੀਆਂ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, millones de Tus Poderes se manifiestan época tras época, ¡oh, Gopal! (5)"