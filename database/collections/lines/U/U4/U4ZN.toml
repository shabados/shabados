[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਤੀ ਸੂਕੀ; ਤੇਲੁ ਨਿਖੂਟਾ ॥"
page = 478
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The wick has dried up and the oil has exhausted."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੱਤੀ ਸੁੱਕ ਗਈ ਹੈ ਅਤੇ ਤੇਲ ਮੁੱਕ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The wick has dried up, and the oil is exhausted."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਸਾ ਰੂਪ ਬਾਤੀ ਸੂਕ ਗਈ ਕ੍ਯੋਂਕਿ ਲੋਭ ਤੇਲ (ਨਿਖੂਟਾ) ਨਹੀਂ ਰਹਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਮਾਇਆ ਦੇ ਮੋਹ ਦਾ ਤੇਲ (ਜੀਵ ਦੇ ਅੰਦਰੋਂ) ਮੁੱਕ ਜਾਂਦਾ ਹੈ, ਉਸ ਦੀ ਸੁਰਤ (ਮਾਇਆ ਵਾਲੇ ਪਾਸੇ ਤੋਂ) ਹਟ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇਲੁ = ਮਾਇਆ ਦਾ ਮੋਹ-ਰੂਪ ਤੇਲ। ਬਾਤੀ = ਵੱਟੀ ਜਿਸ ਦੇ ਆਸਰੇ ਤੇਲ ਬਲਦਾ ਹੈ ਤੇ ਦੀਵਾ ਜਗਦਾ ਰਹਿੰਦਾ ਹੈ; ਮਨ ਦੀ ਸੁਰਤਿ ਜੋ ਮੋਹ ਵਿਚ ਫਸਾਈ ਰੱਖਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La mecha está seca y el aceite se acabó; el tambor ya no resuena,"