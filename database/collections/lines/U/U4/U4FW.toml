[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧਸੰਗਿ; ਕਿਸ ਸਿਉ. ਨਹੀ ਬੈਰੁ ॥"
page = 271
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By associating with the saints he bears enmity to none."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤਾਂ ਦੀ ਸੰਗਤ ਕਰਨ ਦੁਆਰਾ ਉਹ ਕਿਸੇ ਨਾਲ ਦੁਸ਼ਮਨੀ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Company of the Holy, no one is hated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੇ ਸੰਗ ਕਰ ਕਿਸੀ ਸਾਥ ਇਸ ਕਾ ਵੈਰ ਨਹੀਂ ਰਹਿਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤਾਂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਬੈਠਿਆਂ ਕਿਸੇ ਨਾਲ ਵੈਰ ਨਹੀਂ ਰਹਿ ਜਾਂਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੈਰੁ = ਵੈਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "desterrando de sí mismo cualquier rencor,"