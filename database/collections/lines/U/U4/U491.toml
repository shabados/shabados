[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮੋ ਇੰਦ੍ਰ ਇੰਦ੍ਰੇ ਅਨਾਦੰ ਬਿਭੂਤੇ ॥੧੮੭॥"
page = 10
line = 8

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Salutation to Thee O Indra of Indras! Salutation to Thee O Beginningless Effulgence! 187."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਇੰਦਰਾਂ ਦੇ ਵੀ ਇੰਦਰ, (ਤੈਨੂੰ) ਨਮਸਕਾਰ ਹੈ; ਹੇ ਆਦਿ-ਰਹਿਤ ਸੰਪੱਤੀ ਵਾਲੇ! (ਤੈਨੂੰ ਨਮਸਕਾਰ ਹੈ) ॥੧੮੭॥"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਨਮੋ, ਇੰਦ੍ਰ ਇੰਦ੍ਰੇ; ਅਨਾਦੰ ਬਿਭੂਤੇ ॥੧੮੭॥"