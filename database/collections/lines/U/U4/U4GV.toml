[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਸਦੇ ਚਰਨ ਧੋਣ ਕਰਕੇ ਮੁਰਦੇ ਵੀ ਜੀ ਪੈਂਦੇ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਜ਼ਿ ਪਾ-ਸ਼ੁਇ ਊ ਮੁਰਦਗਾਂ ਰਾ ਹਯਾਤ ॥੧੪੩॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "By washing his lotus feet, even the dead become alive, are revived. (143)"