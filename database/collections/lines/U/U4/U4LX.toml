[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਉ; ਗੁਰੁ ਹਰਿ ਮੰਤ੍ਰੁ ਦੇ ॥"
page = 211
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He whom the Guru gives God's Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਗੁਰੂ ਜੀ ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ ਦਿੰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those unto whom the Guru gives the Mantra of the Lord's Name,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਗੁਰੋਂ ਨੇ ਹਰੀ ਨਾਮ ਮੰਤ੍ਰ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਗੁਰੂ ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਮੰਤ੍ਰ ਦੇਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਮੰਤ੍ਰ = ਉਪਦੇਸ਼। ਦੇ = ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél a quien el Guru bendice con el Mantra del Señor,"