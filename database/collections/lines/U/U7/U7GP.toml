[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੀਵਾ ਬਲੈ; ਨ ਸੋਝੀ ਪਾਇ ॥੧॥"
page = 364
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The lamp of gnosis burns not, nor is the understanding attained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "(ਗਿਆਨ ਦਾ) ਲੈਪਂ ਜਲਦਾ ਨਹੀਂ ਨਾਂ ਹੀ ਗਿਆਤ ਪਰਾਪਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The lamp of knowledge is not burning, and understanding is not obtained. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਕਰ ਕੇ ਬਿਬੇਕ ਰੂਪੁ ਦੀਪਕੁ ਬਲਦਾ ਨਹੀਂ ਔਰੁ ਆਤਮ ਬੋਧ ਰੂਪੁ ਸੂਝ ਪ੍ਰਾਪਤਿ ਨਹੀਂ ਹੋਤੀ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ (ਸਹੀ ਜੀਵਨ ਦੀ) ਸਮਝ ਨਹੀਂ ਹਾਸਲ ਕਰ ਸਕਦਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así la lámpara del espíritu no se puede prender y no conoce uno la Esencia. (1)"