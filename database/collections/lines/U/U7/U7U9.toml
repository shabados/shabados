[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗੁ ਸੂਹੀ ਅਸਟਪਦੀਆ ਮਹਲਾ ੪ ਘਰੁ ੨ ॥"
page = 757
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Suhi Measure Ashtpadian 4th Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਸੂਹੀ ਅਸ਼ਟਪਦੀਆਂ ਚੌਥੀ ਪਾਤਿਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Soohee, Ashtpadheeyaa, Fourth Mehl, Second House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਸੂਹੀ, ਘਰ ੨ ਵਿੱਚ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਦੀ ਅੱਠ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Suji, Ashtapadis, Cuarto Canal Divino."