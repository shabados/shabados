[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰਿ; ਮੋ ਕਉ ਏਕੁ ਬੁਝਾਇਆ ॥੫॥"
page = 223
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Guru has caused me to understand the One Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਇਕ ਮਾਲਕ ਦਰਸਾ ਦਿਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Guru has led me to understand the One Lord. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਸਤਿਗੁਰੋਂ ਨੇ ਮੁਝ ਕੋ ਸੋ ਏਕ ਪਰਮੇਸ੍ਵਰ ਬਤਾਇਆ ਹੈ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਮੈਨੂੰ ਇਹ ਸਮਝ ਦੇ ਦਿੱਤੀ ਕਿ ਹਰ ਥਾਂ ਇਕ ਪਰਮਾਤਮਾ ਹੀ ਵੱਸ ਰਿਹਾ ਹੈ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰਿ = ਸਤਿਗੁਰੂ ਨੇ। ਮੋ ਕਉ = ਮੈਨੂੰ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El verdadero Guru me ha enseñado el camino al Verdadero Guru.(5)"