[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਓਸੁ ਦੂਖੁ; ਨ ਹਮ ਕਉ ਦੂਖੇ ॥੧॥"
page = 391
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Neither He is in pain, nor do I suffer agony."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਂ ਉਸ ਨੂੰ ਤਕਲੀਫ ਹੈ ਅਤੇ ਨਾਂ ਹੀ ਮੈਂ ਕਸ਼ਟ ਉਠਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is not in pain, so I do not suffer. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾ ਉਸ ਕੋ ਦੁਖੁ ਹੈ ਨ ਹਮ ਕੋ ਦੁਖੁ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕੋਈ ਦੁੱਖ ਨਹੀਂ ਪੋਂਹਦਾ, ਸਾਨੂੰ ਭੀ ਕੋਈ ਦੁੱਖ ਨਹੀਂ ਪੋਹਣਾ ਚਾਹੀਦਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ni Él tiene aflicción ni yo estoy en la miseria. (1)"