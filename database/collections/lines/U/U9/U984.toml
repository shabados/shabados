[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਟੂਟੋ ਅਮਲ ਅਫੀਮਿਯਹਿ; ਜਨੁ ਪਸਵਾਰੇ ਲੇਤ ॥੨੬॥"
page = 921

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Like an addict of opium, she tossed around in the dust.(26)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਅਮਲ ਤੋਂ ਟੁਟਿਆ ਅਫ਼ੀਮਚੀ ਪਲਸੇਟੇ ਮਾਰ ਰਿਹਾ ਹੋਵੇ ॥੨੬॥"