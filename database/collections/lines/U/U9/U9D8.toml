[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਹ ਸਰੀਰਿ ਸੁਖੁ ਹੋਵੈ; ਸਬਦਿ ਹਰਿ ਨਾਇ ॥"
page = 560
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the body frame prevails the peace by pondering over the Lord God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਆਰਾਧਨ ਕਰਨ ਦੁਆਰਾ ਜਿਸਮ ਦੇ ਢਾਂਚੇ ਅੰਦਰ ਠੰਢ-ਚੈਨ ਵਰਤ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The frame of my body is at peace, through the Shabad, and the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰ ਉਪਦੇਸ ਕਰ ਹਰੀ ਨਾਮ ਜਪਨੇ ਤੇ ਅਸਥੂਲ ਦੇਹ ਔ ਸੂਖਮ ਸਰੀਰ ਮੇਂ ਸੁਖੁ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸ਼ਬਦ ਦੀ ਬਰਕਤ ਨਾਲ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਿਚ ਜੁੜਿਆਂ ਸਰੀਰ ਵਿਚ ਆਨੰਦ ਪੈਦਾ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਹ = ਸਰੀਰ। ਸਰੀਰਿ = ਸਰੀਰ ਵਿਚ। ਸਬਦਿ = ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ। ਨਾਇ = ਨਾਮ ਵਿਚ (ਜੁੜਿਆਂ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A través de la Palabra del Nombre del Señor, el cuerpo goza de Bondad, y el Nombre,"