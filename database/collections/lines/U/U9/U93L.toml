[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਰੇ ਪੰਚ; ਅਪੁਨੈ ਵਸਿ ਕੀਏ ॥"
page = 415
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Overpowering and arresting the five evil passions"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੰਜੇ ਵਿਸ਼ੇ ਵੇਗਾਂ ਨੂੰ ਕਾਬੂ ਅਤੇ ਗ੍ਰਿਫਤਾਰ ਕਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Overpowering and subduing the five passions,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖੋਂ ਨੇ ਕਮਾਦਿ ਪੰਚ ਬਿਕਾਰ ਮਾਰ ਕਰ ਅਪਨੇ ਬਸ ਮੇਂ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਾਮਾਦਿਕ ਪੰਜਾਂ (ਵੈਰੀਆਂ) ਨੂੰ ਮਾਰ ਦੇਂਦਾ ਹੈ, ਆਪਣੇ ਵੱਸ ਵਿਚ ਕਰ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਪੁਨੈ ਵਸਿ = ਆਪਣੇ ਵੱਸ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y manteniendo su ego bajo el mando de su Conciencia,"