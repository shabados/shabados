[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜੀ ਅਚਿੰਤੁ ਵਸੈ. ਮਨਿ ਆਈ ॥"
page = 114
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and venerable God automatically comes to dwell in the mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪੂਜਯ ਵਾਹਿਗੁਰੂ ਸੁੱਤੇ ਸਿੱਧ ਹੀ ਚਿੱਤ ਅੰਦਰ ਆ ਨਿਵਾਸ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Dear Lord automatically comes to dwell in the mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਹਰਿ ਜੀ ਅਕਸਮਾਤ ਹੀ ਮਨ ਮੇਂ ਆਇ ਵਸਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਉਹ ਪਰਮਾਤਮਾ ਉਸ ਦੇ ਮਨ ਵਿਚ ਆ ਵੱਸਦਾ ਹੈ ਜਿਸ ਨੂੰ ਦੁਨੀਆ ਵਾਲੀ ਕੋਈ ਚਿੰਤਾ ਪੋਹ ਨਹੀਂ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਚਿੰਤੁ = ਜਿਸ ਨੂੰ ਕੋਈ ਚਿੰਤਾ ਪੋਹ ਨ ਸਕੇ। ਮਨਿ = ਮਨ ਵਿਚ। ਆਈ = ਆਇ, ਆ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y cosecharás en tu mente a tu Amado Señor sin dificultad."