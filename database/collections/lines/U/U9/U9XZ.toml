type = "primary"
data = "ਤੇਲ ਡਾਰਿ ਤਰ ਦਿਯੋ; ਕਰਾਹ ਚੜਾਇ ਕੈ ॥"
page = 1007

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Underneath there, an open cauldron with oil in it, will be placed."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇਠਾਂ ਤੇਲ ਪਾ ਕੇ ਕੜਾਹ ਚੜ੍ਹਾ ਦਿੱਤਾ।"