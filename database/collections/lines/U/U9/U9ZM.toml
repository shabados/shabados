[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤੁ ਨ ਪਾਵਹਿ; ਅਲਖ ਅਭੇਵਾ ॥"
page = 1053
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They can know not the limit of the Invisible and inscrutable Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਅਦ੍ਰਿਸ਼ਟ ਅਤੇ ਭੇਦ-ਰਹਿਤ ਪ੍ਰਭੂ ਦੇ ਓੜਕ ਨੂੰ ਨਹੀਂ ਜਾਣ ਸਕਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Even they cannot find the limits of the unseen, unknowable Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਉਸ ਅਲਖ ਅਭੇਵ ਕਾ ਅੰਤ ਨਹੀਂ ਪਾਵਤੇ ਔਰ ਐਸੇ ਕਹਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਵੱਡੇ ਵੱਡੇ ਦੇਵਤੇ ਭੀ ਉਸ) ਅਲੱਖ ਅਤੇ ਅਭੇਵ ਪਰਮਾਤਮਾ (ਦੇ ਗੁਣਾਂ) ਦਾ ਅੰਤ ਨਹੀਂ ਪਾ ਸਕਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਵਹਿ = ਪਾ ਸਕਦੇ, ਪਾਂਦੇ {ਬਹੁ-ਵਚਨ}। ਅਲਖ = ਜਿਸ ਦਾ ਸਹੀ ਸਰੂਪ ਬਿਆਨ ਨ ਕੀਤਾ ਜਾ ਸਕੇ। ਅਭੇਵਾ = ਜਿਸ ਦਾ ਭੇਤ ਨਾਹ ਪਾਇਆ ਜਾ ਸਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, nadie puede sondear al Misterioso e Insondable Señor."