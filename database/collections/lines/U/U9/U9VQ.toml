[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਲਿ ਸਤਿਗੁਰ; ਧਨੁ ਪੂਰਾ ਪਾਇਆ ॥੧॥"
page = 375
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting the True Guru, I have received the perfect wealth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਨੂੰ ਭੇਟ ਕੇ ਮੈਂ ਪੂਰਨ ਪਦਾਰਥ ਪਰਾਪਤ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting the True Guru, I have received the perfect wealth. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸਤਿਗੁਰੋਂ ਸੇ ਮਿਲਕਰ (ਪੂਰਾ ਧਨ) ਨਾਮ ਪਾਯਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਸਤਿਗੁਰੂ ਨੂੰ ਮਿਲ ਕੇ ਕਦੇ ਨਾਹ ਘਟਣ ਵਾਲਾ ਨਾਮ-ਧਨ ਹਾਸਲ ਕਰ ਲਿਆ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਿ = ਮਿਲ ਕੇ। ਧਨੁ ਪੂਰਾ = ਕਦੇ ਨਾਹ ਘਟਣ ਵਾਲਾ ਨਾਮ-ਧਨ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Encontrando al Verdadero Guru, recibí el Tesoro Perfecto del Naam, el Nombre del Señor. (1)"