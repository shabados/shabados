[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਧਿਕ ਨਿਹੋਰੌ ਰਾਇ ਕਰਿ; ਰਾਨੀ ਲਈ ਮਨਾਇ ॥"
page = 868

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "With great humility, Raja got Rani to come to good terms."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਤਰਲੇ ਕਰ ਕੇ ਰਾਜੇ ਨੇ ਰਾਣੀ ਨੂੰ ਮਨਾ ਲਿਆ"