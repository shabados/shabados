[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਸਚਾ ਪਾਤਿਸਾਹੁ; ਕੂੜੇ ਬਾਦਿਸਾਹ ਦੁਨੀਆਵੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The true Guru (God) is the true emperor; all other worldly kinds are fake ones."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਸੱਚੇ ਪਾਤਸ਼ਾਹ ਹਨ ਹੋਰ ਦੁਨੀਆਂ ਦੇ ਪਾਤਸ਼ਾਹ ਝੂਠੇ ਹਨ।"