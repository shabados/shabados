[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧ੍ਰਾਪਸਿ ਨਾਹੀ, ਤ੍ਰਿਸਨਾ ਭੂਖ ॥੨॥"
page = 675
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His thirst and hunger are allayed not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਤ੍ਰੇਹ ਅਤੇ ਭੁੱਖ ਬੁਝਦੀਆਂ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Hunger and thirst are not satisfied. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤ੍ਰਿਸਨਾ ਭੂਖ ਲਗਨੇ ਕਰ ਕੇ (ਧ੍ਰਾਪਸਿ) ਤ੍ਰਿਪਤ ਨਹੀਂ ਹੋਤਾ ਹੂੰ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵ (ਮਾਇਆ ਵਲੋਂ ਕਿਸੇ ਵੇਲੇ) ਰੱਜਦਾ ਨਹੀਂ, ਇਸ ਨੂੰ ਮਾਇਆ ਦੀ ਤ੍ਰੇਹ ਮਾਇਆ ਦੀ ਭੁੱਖ ਚੰਬੜੀ ਰਹਿੰਦੀ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧ੍ਰਾਪਸਿ ਨਾਹੀ = ਰੱਜਦਾ ਨਹੀਂ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ahora en el dolor, las hambres de uno no se satisfacen nunca. (2)"