[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਗਿਆਕਾਰੀ ਸੁਘੜ ਸਰੂਪ ॥"
page = 371
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "she is obedient, sagacious and beauteous."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਫ਼ਰਮਾ ਬਰਦਾਰ ਸਿਆਣੀ ਅਤੇ ਸੁੰਦਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "And her generations are unblemished."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਕੈਸੀ ਹੈ? ਆਗਿਆਰੀ ਹੈ (ਸੁਘੜ) ਚਤੁਰ ਸਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਇਸਤ੍ਰੀ) ਆਗਿਆ ਵਿਚ ਤੁਰਨ ਵਾਲੀ ਹੈ, ਸੁਚੱਜੀ ਹੈ, ਸੋਹਣੇ ਰੂਪ ਵਾਲੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਘੜ = ਸੁਚੱਜੀ। ਸਰੂਪ = ਸੁੰਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y la Verdad ahora es su familia."