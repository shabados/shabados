[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਹਿਨਿਸਿ ਨਿਰਮਲੁ; ਹਰਿ ਲਿਵ ਲਾਈ ॥੧॥"
page = 416
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Immaculate is he, who day and night, fixes his attention on God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤ੍ਰ ਹੈ ਉਹ ਜੋ ਦਿਹੁੰ ਰੈਣ ਆਪਣੀ ਬਿਰਤੀ ਵਾਹਿਗੁਰੂ ਨਾਲ ਜੋੜੀ ਰਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, center your loving attention on the Immaculate Lord. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਰਾਤ ਦਿਨ ਸੁਧ ਹਰਿ ਮੇਂ ਬ੍ਰਿਤੀ ਲਗਾਈ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਦਿਨ ਰਾਤ ਆਪਣੀ ਸੁਰਤਿ ਪ੍ਰਭੂ (-ਚਰਨਾਂ) ਵਿਚ ਜੋੜਦਾ ਹੈ ਉਸ ਦਾ ਜੀਵਨ ਪਵਿਤ੍ਰ ਹੋ ਜਾਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਹਿ = ਦਿਨ। ਨਿਸਿ = ਰਾਤ। ਅਹਿਨਿਸਿ = ਦਿਨ ਰਾਤ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y aquél que está entonado en el Señor, es para siempre Inmaculado. (1)"