[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਤ ਕਬੀਰ; ਹਉ ਕਹਉ ਪੁਕਾਰਿ ॥"
page = 1160
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir, I proclaim with a loud voice,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ, ਮੈਂ ਉੱਚੀ ਆਵਾਜ ਨਾਲ ਕਹਿੰਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, I proclaim this out loud"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਕਹਤੇ ਹੈਂ: ਜੋ ਕਬੀਰ ਜੀ ਨੇ ਕਹਾ ਹੈ, ਸੋ ਮੈਂ ਪੁਕਾਰ ਕਰ ਕਹਿਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ ਕਿ ਮੈਂ ਪੁਕਾਰ ਪੁਕਾਰ ਕੇ ਆਖਦਾ ਹਾਂ"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੁਕਾਰਿ = ਕੂਕ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, proclamo la Verdad desde la azotea,"