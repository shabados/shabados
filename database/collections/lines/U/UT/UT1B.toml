[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਸਾ. ਏਕ ਮਾਨਿ ਹਾਂ ॥"
page = 409
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Cherish but one desire."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਇਕ ਇੱਛਿਆ ਹੀ ਧਾਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Cherish one desire only:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੰਤ ਬੁਧੀ ਮੇਂ ਏਕ ਕੋ ਹੀ ਮਾਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮੇਰੇ ਮਨ!) ਇਕ (ਪਰਮਾਤਮਾ ਦੇ ਮਿਲਾਪ) ਦੀ ਤਾਂਘ (ਆਪਣੇ ਅੰਦਰ) ਕਾਇਮ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਸਾ = {मनीषा} ਇੱਛਾ। ਮਾਨਿ = ਮੰਨ, ਪੱਕੀ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ten este único deseo,"