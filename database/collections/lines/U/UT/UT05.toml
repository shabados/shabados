[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦ੍ਰਿਸਟਿ ਨਾਹੀ ਰੇ ਪੇਖਤ ਅੰਧੇ ॥"
page = 738
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O blind man, see thou not with thine eyes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਅੰਨ੍ਹੇ ਮਨੁੱਖ! ਤੂੰ ਆਪਣੀਆਂ ਅੱਖਾਂ ਨਾਲ ਵੇਖਦਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You do not see with your eyes - you are so blind!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰੇ ਅੰਧੇ ਜੀਵ! ਵਿਚਾਰ ਦ੍ਰਿਸ਼ਟੀ ਕਰ ਕੇ ਨਹੀਂ ਦੇਖਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਅੰਨ੍ਹੇ! ਤੂੰ ਅੱਖਾਂ ਨਾਲ (ਕਿਉਂ) ਨਹੀਂ ਵੇਖਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇ ਅੰਧੇ = ਹੇ ਅੰਨ੍ਹੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hombre ciego, ¿cómo no puedes darte cuenta de que en el final,"