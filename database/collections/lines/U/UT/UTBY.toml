[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਦ ਲਛਮੀ ਪਿਆਵੰਤ; ਬੇਦ ਮੁਖ ਬ੍ਰਹਮੁ ਉਚਾਰਤ ॥"
page = 238

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Lakshmi, the goddess of wealth, serves drinks to me and Brahma recites the Vedic mantras for me."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਲੱਛਮੀ ਮੈਨੂੰ ਸ਼ਰਾਬ ਪਿਲਾਉਂਦੀ ਹੈ ਅਤੇ ਬ੍ਰਹਮਾ (ਮੇਰੇ ਲਈ) ਵੇਦ ਪਾਠ ਕਰਦਾ ਹੈ।"