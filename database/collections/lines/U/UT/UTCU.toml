[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੰਕ ਛੋਰਿ, ਬਿਨੁ ਸੰਕ ਬਖਾਨਹੁ ॥੧੧੮੬॥"
page = 796

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Lorbhareshani”, add the word “mathani” and recognize all the names of Tupak.1186."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ੰਕਾ ਛਡ ਕੇ ਨਿਸੰਗ ਹੋ ਕੇ ਇਸ ਦਾ ਬਖਾਨ ਕਰੋ ॥੧੧੮੬॥"