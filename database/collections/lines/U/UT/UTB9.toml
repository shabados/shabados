[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਉਖਲੀਆਂ ਨਾਸਾ ਜਿਨਾ ਮੁਹਿ ਜਾਪਨ ਆਲੇ ॥"
page = 121

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Their nostrils are like mortars and the mouths seem like niches."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਦੀਆਂ ਨਾਸਾਂ ਉਖਲੀਆਂ ਅਤੇ ਮੂੰਹ ਆਲੇ ਜਾਪਦੇ ਸਨ।"