[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਮਸਕਾਰ ਡੰਡਉਤਿ ਬੰਦਨਾ; ਅਨਿਕ ਬਾਰ ਜਾਉ ਬਾਰੈ ॥੧॥ ਰਹਾਉ ॥"
page = 820
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I make obeisance and prostration to Thee and many a time am a sacrifice unto Thee. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੇ ਅੱਗੇ ਬੰਦਗੀ ਅਤੇ ਲੰਮੇ ਪੈ ਪ੍ਰਾਰਥਨਾ ਕਰਦਾ ਹਾਂ ਅਤੇ ਬਹੁਤ ਵਾਰੀ ਤੇਰੇ ਉਤੋਂ ਘੋਲੀ ਜਾਂਦਾ ਹਾਂ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I bow in humility and reverence to You; so many times, I am a sacrifice. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਮੈਂ ਤੁਝ ਕੋ ਮਨ ਕਰ ਨਮਸਕਾਰ ਔ ਤਨ ਕਰ ਭੰਡਉਤ ਔ ਬਾਣੀ ਕਰ ਬੰਦਨਾ ਕਰਤਾ ਹੂੰ, ਪੁਨਾ ਅਨੇਕ ਵਾਰ ਤੇਰੇ ਪਰ ਬਲਿਹਾਰੇ ਜਾਤਾ ਹੂੰ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਤੇਰੇ ਹੀ ਅੱਗੇ ਨਮਸਕਾਰ ਕਰਦਾ ਹਾਂ, ਚੁਫਾਲ ਲੰਮਾ ਪੈ ਕੇ ਨਮਸਕਾਰ ਕਰਦਾ ਹਾਂ। ਮੈਂ ਅਨੇਕਾਂ ਵਾਰੀ ਤੈਥੋਂ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਡੰਡਉਤਿ ਬੰਦਨਾ = ਡੰਡੇ ਵਾਂਗ ਸਿੱਧਾ ਚੁਫਾਲ ਲੰਮਾ ਪੈ ਕੇ ਨਮਸਕਾਰ {दण्डवत}। ਬਾਰ = ਵਾਰੀ। ਬਾਰੈ = ਵਾਰਨੇ, ਸਦਕੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco siempre mi ser en sacrificio a Ti. (1-Pausa)"