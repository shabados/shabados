[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਨੇ ਉਸ ਨੂੰ ਸਾਰੇ ਪਤਵੰਤਿਆਂ ਨਾਲੋਂ ਵਡੇਰਾ ਬਣਾਇਆ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਹੱਕਸ਼ ਦਾਦ ਬਰ ਜੁਮਲਾ ਮੁਕਬਲ ਸਬੱਕ ॥੨੦॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Akaalpurakh has designated him superior than all the other selected nobles and the elite. (20)"