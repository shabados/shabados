type = "primary"
data = "ਤੁਮੀ ਸੁੰਭ ਨੈਸੁੰਭ ਦਾਨੋ ਖਪਾਯੋ ॥੪੩੨॥"
page = 336

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou didst destroy the demons Sumbh and Nisumbh.432."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਸੁੰਭ ਅਤੇ ਨਿਸੁੰਭ ਦੈਂਤਾਂ ਨੂੰ ਖਪਾਇਆ ਸੀ ॥੪੩੨॥"