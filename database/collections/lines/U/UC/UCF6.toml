[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੱਤ੍ਰ ਚੱਕ੍ਰ ਪਾਲੇ ॥"
page = 6
line = 6

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "\"ਚੱਤ੍ਰ\" ਦਾ ਉਚਾਰਨ \"ਤ\" ਤੇ ਔਂਕੜ ਸਹਿਤ ਕਰਨਾ ਹੈ।"

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O the Sustainer Lord of all the four directions!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਭ ਦੀ ਪਾਲਨਾ ਕਰਨ ਵਾਲਾ"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਚੱਤ੍ਰੁ ਚੱਕ੍ਰ, ਪਾਲੇ ॥"