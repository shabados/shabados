[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਤਿਗੁਰ ਅਗਮ ਅਗਾਧਿ ਪੁਰਖੁ; ਕੇਹੜਾ ਝਲੇ ਗੁਰੂ ਦੀ ਝਾਲਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "This true Guru (Nanak) was unfathomable supreme purusa and who could bear with his effulgence."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਵੱਡੇ ਅਗਮ ਤੇ ਪੂਰਣ ਪੁਰਖ (ਸਨ, ਉਸ) ਗੁਰੂ ਦੀ ਝਾਲ ਕੌਣ ਝੱਲੇ?"