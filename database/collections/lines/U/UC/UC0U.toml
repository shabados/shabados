[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What deeds have the loved brides done."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਤੀ-ਪਿਆਰੀ ਪਤਨੀਆਂ ਨੇ ਕਿਹੜੇ ਅਮਲ ਕਮਾਏ ਹਨ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What actions have the happy soul-brides performed?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਹਾਗਣੀਆਂ ਨੇ ਕਿਆ ਕਰਮੁ ਕੀਆ ਹੈ?☬ਉੱਤਰੁ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੀਆਂ ਜੀਵ-ਇਸਤ੍ਰੀਆਂ ਭਾਗਾਂ ਵਾਲੀਆਂ ਅਖਵਾਂਦੀਆਂ ਹਨ ਉਹਨਾਂ ਕੇਹੜਾ (ਚੰਗਾ ਕੰਮ) ਕੀਤਾ ਹੋਇਆ ਹੈ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cómo se comporta la esposa amada?"