[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮ ਬਿਨਾ; ਨਾਹੀ ਨਿਜ ਠਾਉ ॥"
page = 222
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Name one attains not one's own place."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੇ ਬਗੈਰ, ਆਦਮੀ ਆਪਣੇ ਨਿੱਜ ਦੇ ਅਸਥਾਨ ਨੂੰ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Naam, none obtain their own place."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਭਾਈ! ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਜਾਪ ਜਪਨੇ ਸੇ ਬਿਨਾਂ ਨਿਜ (ਠਾਉ) ਸ੍ਵਰੂਪ ਅਸਥਾਨ ਕਬੀ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਤੋਂ ਬਿਨਾ ਮਨ ਇੱਕ ਟਿਕਾਣੇ ਉਤੇ ਆ ਹੀ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਜ ਠਾਉ = ਆਪਣਾ ਅਸਲ ਟਿਕਾਣਾ, ਸ਼ਾਂਤੀ, ਅਡੋਲਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Nombre del Señor, uno no toma Conciencia de su Ser."