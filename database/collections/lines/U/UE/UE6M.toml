[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੈ ਸਿਮਰਨਿ; ਨਿਹਚਲ ਆਸਨੁ ॥"
page = 263
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through Lord meditation he finds an immovable seat."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਭਜਨ ਰਾਹੀਂ ਉਹ ਅਹਿਲ ਟਿਕਾਣਾ ਪਾ ਲੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remembering God, one attains the unchanging position."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕੇ ਸਿਮਰਨ ਸੇ ਹੀ ਨਿਸਚਲ ਸਰੂਪ ਮੇਂ (ਆਸਨੁ) ਇਸਥਿਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦਾ ਸਿਮਰਨ ਕਰਨ ਨਾਲ ਮਨੁੱਖ ਦਾ (ਮਨ ਰੂਪੀ) ਆਸਨ ਡੋਲਦਾ ਨਹੀਂ"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਹਚਲ = ਟਿਕਵਾਂ, ਨਾਹ ਹਿੱਲਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Meditando en Dios uno obtiene una inalterable postura."