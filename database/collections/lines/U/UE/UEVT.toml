[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਸਚੁ ਦਾਤਾਰੁ ਹੈ; ਮਾਣਸ ਜਨਮੁ ਅਮੋਲੁ ਦਿਵਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The true Guru is truly benevolent as he has granted us the human life."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "“ਸਤਿਗੁਰੂ” ਜੀ ਸੱਚੇ ਦਾਨੀ ਹਨ (ਜਿਨ੍ਹਾਂ ਨੇ) ਅਮੋਲਕ ਮਾਨਸ ਜਨਮ ਸਾਨੂੰ ਦਿਵਾਇਆ ਹੈ।"