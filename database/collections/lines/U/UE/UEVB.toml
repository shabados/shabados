[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਇ ਕਰੀ ਉਪਮਾ ਹਰਿ ਕੀ ਬਹੁ ਭਾਤਿਨ ਸੋ ਕਬਿ ਸ︀ਯਾਮ ਬਡਾਈ ॥"
page = 333

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The poet Shyam says that she eulogised Krishna in various ways"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੇ ਵੀ) ਆ ਕੇ ਕ੍ਰਿਸ਼ਨ ਦੀ ਬਹੁਤ ਤਰ੍ਹਾਂ ਨਾਲ ਉਪਮਾ ਕੀਤੀ, ਕਵੀ ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, (ਉਹ ਬਹੁਤ) ਵਡਿਆਈ ਸੀ।"