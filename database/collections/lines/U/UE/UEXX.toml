[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਮ੍ਰਿਤੁ ਪੀਵੈ; ਜਿਸ ਨੋ ਆਪਿ ਪੀਆਏ ॥"
page = 119
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, whom the Lord Himself causes to drink, quaffs the Name Nectar."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਸੁਆਮੀ ਖੁਦ ਪਿਆਉਂਦਾ ਹੈ ਉਹੀ ਨਾਮ ਸੁਧਾ-ਰਸ ਨੂੰ ਪਾਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They alone drink in this Amrit, whom the Lord Himself inspires to do so."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਪੁਰਸ ਨਾਮ ਅੰਮ੍ਰਿਤ ਪੀਵਤਾ ਹੈ ਜਿਸ ਕੋ ਆਪ ਵਾਹਿਗੁਰੂ ਪਿਲਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਜੀਵਾਂ ਦੇ ਭੀ ਕੀਹ ਵੱਸ?) ਉਹੀ ਮਨੁੱਖ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ ਪੀਂਦਾ ਹੈ, ਜਿਸ ਨੂੰ ਪਰਮਾਤਮਾ ਆਪ ਪਿਲਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੋ = ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por la especial Bendición de Dios, uno bebe el Néctar y,"