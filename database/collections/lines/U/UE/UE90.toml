[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਾਣੀ ਅੰਦਰਿ ਸਟੀਐ; ਤੜਭੜ ਡੁਬੈ ਭਾਰ ਭੁਲਾਣੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Thrown in water, the stone full of pride of its weight sinks at once."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਜਦ) ਉਹ ਪਾਣੀ ਵਿਖੇ ਸਿੱਟੀਦਾ ਹੈ ਤਾਂ ਤਾਬੜਤੋੜ ਡੁਬ ਜਾਂਦਾ ਹੈ, ਅਭਿਮਾਨ ਵਿਖੇ ਭੁੱਲਿਆ ਰਹਿੰਦਾ ਹੈ (ਕਿ ਮੈਂ ਭਾਰੀ ਵਸਤੂ ਹਾਂ)।"