[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਫਾਸ ਬੰਧ ਬਹੁ ਬੰਧੇ; ਹਰਿ ਜਪਿਓ ਖੁਲ ਖੁਲਨੇ ॥"
page = 976
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mortals are bound in the many bonds of mammon's noose. Contemplating the Lord, their bonds are loosened,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਾਨੀ ਮੋਹਨੀ ਦਾ ਫਾਹੀ ਦੇ ਅਨੇਕਾਂ ਜੂੜਾਂ ਅੰਦਰ ਜਕੜੇ ਹੋਏ ਹਨ। ਸਾਹਿਬ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ ਉਨ੍ਹਾਂ ਦੇ ਜੂੜ ਕੱਟੇ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mortals are bound by the many bonds of Maya's noose. Meditating on the Lord, the knot is untied,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਫਾਸੀ ਕੇ ਬੰਧਨੋਂ ਮੇਂ ਬਹੁਤ ਪ੍ਰਕਾਰ ਸੇ ਬੰਧੇ ਹੂਏ ਥੇ। ਹੇ ਹਰੀ! ਜਬ ਤੇਰੇ ਕੋ ਖੁਲ ਕਰ, ਭਾਵ ਅਤੀ ਬਹੁਤ ਜਪਿਆ ਹੈ ਤੌ ਬੰਧਨ (ਖੁਲਨੇ) ਖੁਲ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਜੀਵ ਮਾਇਆ ਦੇ ਮੋਹ ਦੀਆਂ ਫਾਹੀਆਂ, ਮਾਇਆ ਦੇ ਮੋਹ ਦੇ ਬੰਧਨਾਂ ਵਿਚ ਬਹੁਤ ਬੱਝੇ ਰਹਿੰਦੇ ਹਨ। ਹੇ ਮਨ! ਜਿਨ੍ਹਾਂ ਨੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪਿਆ, ਉਹਨਾਂ ਦੇ ਬੰਧਨਾਂ ਖੁਲ੍ਹ ਗਏ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫਾਸ = ਫਾਹੀਆਂ। ਬੰਧ = ਬੰਧਨ। ਬੰਧੇ = ਬੱਝੇ ਹੋਏ। ਖੁਲ ਖੁਲਨੇ = ਪੂਰੇ ਤੌਰ ਤੇ ਖੁਲ੍ਹ ਗਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones de apegos a Maya amarran al hombre, pero meditando en Dios, uno es liberado íntegramente,"