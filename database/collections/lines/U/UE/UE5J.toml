[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂਹੈ ਸਚਾ, ਸਚੁ ਤੂ; ਸਭ ਦੂ ਉਪਰਿ. ਤੂ ਦੀਬਾਣੁ ॥"
page = 307
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art the Truest of the true The most exalted is thine court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਚਿਆਰਾ ਦਾ ਪਰਮ ਸਚਿਆਰ ਹੈਂ। ਤੇਰੀ ਕਚਹਿਰੀ ਸਾਰੀਆਂ ਨਾਲੋਂ ਉੱਚੀ ਹੈ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the Truest of the True; Your Regal Court is the most exalted of all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਿਸਚੇ ਕਰ ਕੇ ਤੂੰ ਸਚਾ ਹੈਂ ਔਰ ਸਭ ਕੇ ਊਪਰ ਔਰ ਤੂੰ (ਦੀਬਾਣੁ) ਆਸਰਾ ਰੂਪ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ) ਤੂੰ ਸਦਾ ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਹੈ, ਤੂੰ ਹੀ (ਜੀਵਾਂ ਦਾ) ਸਭ ਤੋਂ ਵੱਡਾ ਆਸਰਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂ = ਤੋਂ। ਉਪਰਿ = ਵੱਡਾ। ਦੀਬਾਣੁ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú eres el Único Ser Verdadero, oh Señor, el Comando de Tu Corte rige sobre todos."