[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮੁ ਝੁਰੈ ਦਲ ਮੇਲਵੈ; ਅੰਤਰਿ ਬਲੁ ਅਧਿਕਾਰ ॥"
page = 1412
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With great mental effort Ram Chander gathered his army, in utter sadness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਦੇ ਬਹੁਤੇ ਜੋਰ ਨਾਲ, ਰਾਮ ਚੰਦ੍ਰ ਉਦਾਸੀਨ ਹੋ ਆਪਣੀ ਸੈਨਾ ਇਕੱਤਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raam Chand, sad at heart, assembled his army and forces."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਮਚੰਦ੍ਰ ਭੀ ਸਰੀਰ ਸਬੰਧ ਕਰ ਕਪੋਂ ਕੇ ਦਲ ਕੋ ਇਕਤ੍ਰ ਕਰ ਕੇ ਝੂਰਤੇ ਭਏ ਹੈਂ। ਜਦਪਿ ਰਿਦੇ ਬੀਚ ਸ੍ਰਿਸਟੀ ਕੇ ਉਲਟਾਵਨੇ ਕਾ ਬਲ ਭੀ ਥਾ ਤਦਪਿ ਤਿਸ ਬਲ ਕੇ ਦਿਖਾਵਨੇ ਕਾ ਅਧਿਕਾਰ ਨ ਸਮਝਿਆ, ਭਾਵ ਯੇਹ ਕਿ ਮਾਨਸ ਜਨਮ ਕੇ ਧਾਰਨੇ ਸੇ ਉਸੀ ਤਰਹ ਕੀ ਚੇਸ਼ਟਾ ਕਰਨੀ ਚਾਹੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸ੍ਰੀ ਰਾਮਚੰਦ੍ਰ ਉਸ ਕਰਤਾਰ ਦੀ ਬਰਾਬਰੀ ਨਹੀਂ ਕਰ ਸਕਦਾ। ਵੇਖੋ! ਰਾਵਣ ਨਾਲ ਲੜਾਈ ਕਰਨ ਵਾਸਤੇ) ਸ੍ਰੀ ਰਾਮਚੰਦ੍ਰ ਫ਼ੌਜਾਂ ਇਕੱਠੀਆਂ ਕਰਦਾ ਹੈ, (ਉਸ ਦੇ) ਅੰਦਰ (ਫ਼ੌਜਾਂ ਇਕੱਠੀਆਂ ਕਰਨ ਦੇ) ਅਧਿਕਾਰ ਦੀ ਤਾਕਤ ਭੀ ਹੈ, (ਫਿਰ ਭੀ ਸ੍ਰੀ) ਰਾਮਚੰਦ੍ਰ ਦੁਖੀ ਹੁੰਦਾ ਹੈ"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਮੁ = (ਸ੍ਰੀ) ਰਾਮਚੰਦ੍ਰ। ਝੁਰੈ = ਦੁਖੀ ਹੁੰਦਾ ਹੈ। ਦਲ = ਫ਼ੌਜਾਂ। ਮੇਲਵੈ = ਇਕੱਠੀਆਂ ਕਰਦਾ ਹੈ। ਅੰਤਰਿ = (ਸ੍ਰੀ ਰਾਮਚੰਦ੍ਰ ਦੇ) ਅੰਦਰ। ਅਧਿਕਾਰ = ਇਖ਼ਤਿਆਰ। ਬਲੁ ਅਧਿਕਾਰ = ਅਧਿਕਾਰ ਦੀ ਤਾਕਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ram Chand, con tristeza en su corazón, reunió a su ejército con sus refuerzos,"