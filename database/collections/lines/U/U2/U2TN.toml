[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਭ ਚਿਤਵਨਿ ਦਾਸ ਤੁਮਾਰੇ ॥"
page = 627
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thine slaves, O Lord, think of sublime things."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਗੋਲੇ, ਹੇ ਸਾਈਂ! ਸ੍ਰੇਸ਼ਟ ਗੱਲਾਂ ਸੋਚਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your slaves, O Lord, focus on pure thoughts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੁਮਾਰੇ ਦਾਸੋਂ ਕੀ ਸੁਭ ਚਿਤਵਨੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰੇ ਸੇਵਕ ਸਭ ਦਾ ਭਲਾ ਮੰਗਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਭ = ਭਲਾਈ, ਸਭ ਦੀ ਭਲਾਈ। ਚਿਤਵਨਿ = ਚਿਤਵਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tus Devotos, oh Señor, contemplan sólo lo Bueno,"