[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਸ ਹੀ ਧੜਾ ਕੀਆ; ਸਿਕਦਾਰ ਚਉਧਰੀ ਨਾਲਿ. ਆਪਣੈ ਸੁਆਈ ॥"
page = 366
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some join in faction with their chiefs and headmen for selfish motives."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਸਵੈ-ਮਨੋਰਥ ਲਈ ਆਪਣੇ ਸਰਦਾਰਾਂ ਅਤੇ ਪੈਚਾਂ ਨਾਲ ਪਾਰਟੀ ਬਣਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some form alliances with chiefs and leaders for their own selfish motives."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਸੀ ਨੇ (ਸਿਕਦਾਰ) ਸਰਦਾਰ ਅਰ ਚੌਧਰੀ ਕੇ ਸਾਥ ਅਪਨੇ (ਸੁਆਈ) ਸ੍ਵਾਰਥ ਬਸ ਹੋ ਕਰ ਧੜਾ ਬਾਂਧਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਮਨੁੱਖ ਨੇ ਆਪਣੀ ਗ਼ਰਜ਼ ਦੀ ਖ਼ਾਤਰ (ਪਿੰਡ ਦੇ) ਸਰਦਾਰ ਨਾਲ ਚੌਧਰੀ ਨਾਲ ਧੜਾ ਬਣਾਇਆ ਹੋਇਆ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਕਦਾਰ = ਸਰਦਾਰ। ਸੁਆਈ = ਸੁਆਇ, ਸੁਆਰਥ ਵਾਸਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Otros la depositan en los jefes o líderes para lograr sus propios pequeños objetivos,"