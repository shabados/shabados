[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਯਾਹਿ ਸਖੀ, ਜਿਹਿ ਬਿਧਿ ਸੌ; ਪਿਯਹਿ ਮਿਲਾਇਯੈ ॥"
page = 1015

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(In her mind) ‘I must strive to make her meet her lover,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਖੀ! ਕਿਸੇ ਤਰ੍ਹਾਂ ਉਸ ਪ੍ਰੀਤਮ ਨਾਲ ਇਸ ਨੂੰ ਮਿਲਾ ਦੇਈਏ।"