[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਮੇਰਾ ਸਤਿਗੁਰੁ ਪੂਰਾ ॥੪॥੪੫॥੧੧੪॥"
page = 188
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, my True Guru is perfect."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਫ਼ੁਰਮਾਉਂਦੇ ਹਨ ਕਿ ਮੇਰਾ ਸੱਚਾ ਗੁਰੂ ਪੂਰਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, my True Guru is Perfect. ||4||45||114||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਐਸਾ (ਪੂਰਾ) ਬ੍ਰਹਮ ਨੇਸਟੀ ਔਰ ਬ੍ਰਹਮ ਸ੍ਰੋਤ੍ਰੀ ਮੇਰਾ ਸਤਿਗੁਰੂ ਹੈ॥੪॥੪੫॥੧੧੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਮੇਰਾ ਅਭੁੱਲ ਗੁਰੂ ਮਿਲ ਪੈਂਦਾ ਹੈ ॥੪॥੪੫॥੧੧੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, tal es mi Guru, Perfecto y Verdadero.(4-45-114)"