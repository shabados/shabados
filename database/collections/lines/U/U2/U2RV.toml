[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਗੁਰ; ਘਾਲ. ਨ ਪਵਈ ਥਾਇ ॥"
page = 942
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Guru, the service bears not fruit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਬਾਝੋਂ ਟਹਿਲ ਸੇਵਾ ਸਫ਼ਲ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Guru, one's work is useless."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਬਿਨਾਂ ਗੁਰੋਂ ਸੇ ਕਮਾਈ ਥਾਇ ਨਹੀ ਪੜਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰ-ਸਰਣ ਤੋਂ ਬਿਨਾ ਕੋਈ ਮੇਹਨਤ ਕਬੂਲ ਨਹੀਂ ਪੈਂਦੀ (ਕਿਉਂਕਿ \"ਹਉ\" ਟਿਕੀ ਰਹਿੰਦੀ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਥਾਇ ਨ ਪਵਈ = ਕਬੂਲ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y los esfuerzos no dan fruto."