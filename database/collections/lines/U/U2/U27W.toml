[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਟ ਗਹੀ ਸੁਆਮੀ ਸਮਰਥਹ; ਨਾਨਕ ਦਾਸ. ਸਦਾ ਬਲਿਹਾਰੀ ॥੯॥"
page = 1389
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have sought the protection of the Omnipotent Lord. Slave Nanak is ever a sacrifice unto Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਰਬ-ਸ਼ਕਤੀਵਾਨ ਪ੍ਰਭੂ ਦੀ ਪਨਾਹ ਲਈ ਹੈ। ਗੋਲਾ ਨਾਨਕ ਉਸ ਉਤੋਂ ਹਮੇਸ਼ਾਂ ਹੀ ਘੋਲੀ ਵੰਞਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have grasped the Shelter and Support of my All-powerful Lord and Master; slave Nanak is forever a sacrifice to Him. ||9||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਸਮਰਥ ਸ੍ਵਾਮੀ ਕੀ ਓਟ ਗ੍ਰਹਿਣ ਕਰੀ ਹੈ। ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਹਮ ਤਿਸ ਹਰੀ ਪਰ ਸਦਾ ਬਲਿਹਾਰੀ ਜਾਤੇ ਹੈਂ॥੯॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਸਾਂ ਸਮਰੱਥ ਮਾਲਕ ਦੀ ਓਟ ਪਕੜੀ ਹੈ, ਨਾਨਕ (ਉਸ ਦਾ) ਦਾਸ ਉਸ ਤੋਂ ਸਦਾ ਸਦਕੇ ਹੈ ॥੯॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਹੀ = ਪਕੜੀ ਹੈ। ਸੁਆਮੀ ਸਮਰਥਹ = ਸਮਰਥ ਮਾਲਕ ਦੀ ॥੯॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He llegado al Refugio del Soporte de mi Señor Maestro, Todopoderoso. El Esclavo Nanak ofrece su vida para siempre en sacrificio a Él. (9)"