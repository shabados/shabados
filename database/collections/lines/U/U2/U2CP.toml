[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸ ਹੀ ਮਧੇ; ਬਸਤੁ ਅਪਾਰ ॥"
page = 181
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within it is the unrivalled commodity."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਦੇ ਅੰਦਰ ਲਾਸਾਨੀ ਵੱਖਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The infinite substance is within it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਅੰਤਹਕਰਣ ਪ੍ਰਧਾਨ ਲਿੰਙ ਸਰੀਰ ਮੇਂ ਗੁਣੋਂ ਰੂਪੀ ਅਪਾਰ ਵਸਤੂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਮਨ-ਮੰਦਰ ਦੇ ਅੰਦਰ ਹੀ ਬੇਅੰਤ ਪ੍ਰਭੂ ਦੀ ਨਾਮ-ਪੂੰਜੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਸ ਹੀ ਮਧੇ = ਇਸ (ਮਨ) ਦੇ ਵਿਚ ਹੀ। ਬਸਤੁ = ਵਸਤੂ, ਨਾਮ-ਰਾਸਿ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En el interior está la Sustancia Infinita,"