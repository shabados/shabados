[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੈ ਸਿਮਰਨਿ; ਦੁਖੁ ਨ ਸੰਤਾਪੈ ॥"
page = 262
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Lord's meditation is sorrow troubles not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੀ ਬੰਦਗੀ ਦੁਆਰਾ ਗ਼ਮ ਦੁਖਾਤ੍ਰ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remembering God, one does not suffer sorrow."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕੇ ਸਿਮਰਨੇ ਸੇ ਕੋਈ ਦੁਖ ਨਹੀਂ ਸੰਤਾਪ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ (ਕੋਈ) ਦੁੱਖ ਵਿਆਕੁਲ ਨਹੀਂ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤਾਪੈ = ਤੰਗ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Meditando en el Señor, se van los sufrimientos y las aflicciones."