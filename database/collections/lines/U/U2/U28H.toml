[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕਉ ਬਹੁਰਿ; ਨ ਲਾਗਹਿ ਦੂਖਾ ॥"
page = 887
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Him pain touches not again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਪੀੜ ਛੂੰਹਦੀ ਤੱਕ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "does not suffer in pain any longer."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੋ ਫੇਰ ਦੂਖ ਨਹੀਂ ਲਾਗਤੇ॥☬ਕਿਉਂ ਵਹੁ ਜਾਨਤਾ ਹੈ ਕਿ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਉੱਤੇ ਦੁੱਖ ਮੁੜ ਆਪਣਾ ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਹੁਰਿ = ਮੁੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ni el dolor, ni las aflicciones se le acercan."