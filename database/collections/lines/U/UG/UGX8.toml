[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੰਚ ਤਤੁ; ਸੁੰਨਹੁ ਪਰਗਾਸਾ ॥"
page = 1038
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From the Absolute Lord, have become manifest the five elements."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਿਰਗੁਣ ਸਰੂਪ ਸੁਆਮੀ ਤੋਂ ਹੀ ਪੰਜ ਮੂਲ ਅੰਸ਼ ਪ੍ਰਗਟ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "From the Primal Void, the five elements became manifest."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੰਚ ਤਤੋਂ ਕਾ ਭੀ ਸੁੰਨ ਸੇ ਹੀ ਪ੍ਰਕਾਸ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੰਜਾਂ ਤੱਤਾਂ ਤੋਂ ਬਣਿਆ ਇਹ ਮਾਨੁਖੀ ਸਰੀਰ ਨਿਰੋਲ ਪ੍ਰਭੂ ਦੇ ਆਪਣੇ ਆਪੇ ਤੋਂ ਹੀ ਪਰਗਟ ਹੋਇਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੰਚ ਤਤੁ = ਪੰਜ ਤੱਤਾਂ ਤੋਂ ਬਣਿਆ ਸਰੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De Su Ser Absoluto salieron los cuatro elementos"