[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੁਹੀ ਭੈਰਵੀ ਭੂਪਣੀ ਸੁਧ ਸਿਧਿਆ ॥"
page = 336

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art in the form of Syllable (Akshana), heavenly damsels, Buddha, Bhairavi, Sovereign and an adept"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਭੈਰਵੀ, ਮਹਾਰਾਣੀ ਅਤੇ ਸਹੀ ਰੂਪ ਵਿਚ ਸਿੱਧੀ ਹੈਂ।"