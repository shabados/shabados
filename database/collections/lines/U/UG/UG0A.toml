[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦ ਕਰਹਿ. ਨਰ ਨਾਰੀ ॥"
page = 627
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The men and women make merry, as,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਰਦ ਤੇ ਜਨਾਨੀਆਂ ਮੌਜਾਂ ਮਾਣਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The men and women celebrate."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਨਰ ਹੋਵੈ ਵਾ ਨਾਰੀ ਹੋਵੈ ਸਭ ਆਨੰਦ ਹੀ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰੇ ਜੀਵ ਆਤਮਕ ਆਨੰਦ ਮਾਣਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਹਿ = ਕਰਦੇ ਹਨ। ਨਰ ਨਾਰੀ = (ਉਹ ਸਾਰੇ) ਨਰ ਨਾਰ, ਉਹ ਸਾਰੇ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Hombres y mujeres celebran,"