[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਹੁ ਸਰੀਰੁ ਸਭ. ਮੂਲੁ ਹੈ ਮਾਇਆ ॥"
page = 1065
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This body becomes the source of all the sins,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਦੇਹ ਸਮੂਹ ਪਾਪਾਂ ਦਾ ਨਿਕਾਸ ਬਣ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This body is the source of all Maya;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਜੋ ਸਰੀਰ ਹੈ ਇਨ ਸਭ ਕਾ ਮੂਲੁ ਮਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਉਸ ਮਨੁੱਖ ਦਾ ਇਹ ਸਰੀਰ ਨਿਰਾ ਮਾਇਆ ਦੇ ਮੋਹ ਦਾ ਕਾਰਨ ਬਣ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂਲੁ = ਮੁੱਢ, ਕਾਰਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin embargo, el cuerpo se vuelca hacia la fuente de Maya,"