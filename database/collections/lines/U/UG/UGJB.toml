[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮੋਸਤ ਅਬੰਧੇ ॥੨੪॥"
page = 2
line = 18

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "\"ਨਮੋਸਤ\" ਦਾ ਉਚਾਰਨ \"ਨਮੋ ਸੱਤ\" ਕਰਨਾ ਗਲਤ ਹੈ। ਇਹ ਸ਼ਬਦ \"ਨਮੋ+ਅਸਤ\" ਦਾ ਸੰਧੀ ਵਾਚੀ ਸ਼ਬਦ ਹੈ।"

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Salutation to Thee O Detached Lord! 24"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੰਧਨਾਂ ਤੋਂ ਮੁਕਤ! ਤੈਨੂੰ ਨਮਸਕਾਰ ਹੈ ॥੨੪॥"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਨਮੋਸਤ, ਅਬੰਧੇ ॥੨੪॥"