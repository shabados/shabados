[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨਾ ਖੇਲੁ; ਆਪਿ ਕਰਨੈਹਾਰੁ ॥"
page = 280
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself is the Doer of His play."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਖੇਡ ਦਾ ਉਹ ਆਪੇ ਹੀ ਰਚਨਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is the play, and He Himself is the actor."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨਾ ਖੇਲੁ ਆਪ ਹੀ ਕਰਣੇਹਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ-ਰੂਪ) ਆਪਣੀ ਖੇਡ ਆਪ ਹੀ ਕਰਨ ਜੋਗਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todo forma parte de Su Juego y Él es el Único Jugador."