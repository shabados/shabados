[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਕਿਛੁ ਕਰਣਾ. ਸੋ ਕਰਿ ਰਹਿਆ; ਅਵਰੁ. ਨ ਕਰਣਾ ਜਾਈ ॥"
page = 350
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever He is to do, that He is doing. None else can do anything."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਝ ਉਸ ਨੇ ਕਰਨਾ ਹੈ, ਉਸ ਨੂੰ ਉਹ ਕਰ ਰਿਹਾ ਹੈ। ਹੋਰ ਕੋਈ ਜਣਾ ਕੁਛ ਨਹੀਂ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever He is to do, that is what He is doing. No one else can do anything."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਗੁਰੂ! ਤੈਨੇ ਜੋ ਕੁਛ ਕਰਨਾ ਥਾ, ਸੋ ਕਰ ਰਹਾ ਹੈਂ, ਅਵਰ ਕੁਛ ਕਿਸੀ ਤੇ ਕਰਾ ਨਹੀਂ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ ਵਿਚ) ਜੋ ਕੁਝ ਵਰਤ ਰਿਹਾ ਹੈ ਪ੍ਰਭੂ ਆਪ ਹੀ ਕਰ ਰਿਹਾ ਹੈ (ਪ੍ਰਭੂ ਤੋਂ ਆਕੀ ਹੋ ਕੇ ਕਿਸੇ ਹੋਰ ਜੀਵ ਪਾਸੋਂ) ਕੁਝ ਕੀਤਾ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਕਰਣਾ ਜਾਈ = ਕੀਤਾ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo que se requiere que Él haga eso es lo que Él está haciendo, nadie más puede hacer nada,"