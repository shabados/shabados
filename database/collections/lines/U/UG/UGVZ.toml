[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵੈ ਜਾਇ ਭਵਾਈਐ; ਮਨਮੁਖੁ ਅਗਿਆਨੁ ॥"
page = 786
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The ignorant ego-centric comes and goes and is caused to wander is existences."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਸਮਝ ਆਪ-ਹੁਦਰਾ ਆਉਂਦਾ ਤੇ ਜਾਂਦਾ ਹੈ ਅਤੇ ਜੂਨੀਆਂ ਅੰਦਰ ਭਟਕਾਇਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The ignorant, self-willed manmukh comes and goes, wandering in reincarnation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਨ ਬਿਕਾਰੋਂ ਮੇਂ ਜੋ ਮਨਮੁਖਤਾ ਕਰ ਕੇ ਅਗ੍ਯਾਨੀ ਪੜੇ ਹੈਂ, ਸੋ ਆਵਣੇ ਜਾਣੇ ਮੇਂ ਭਵਾਈਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗਿਆਨ-ਹੀਨ ਆਪ-ਹੁਦਰਾ ਮਨੁੱਖ (ਇਹਨਾਂ ਵਿਚ ਫਸ ਕੇ) ਭਟਕਦਾ ਹੈ ਤੇ ਜੰਮਦਾ ਮਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਿਆਨੁ = ਅ-ਗਿਆਨੁ, ਗਿਆਨ-ਹੀਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El arrogante Manmukj va y viene por su ignorancia y vaga eternamente."