[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਿਰਮ ਪਿਆਲਾ ਪਤ, ਭੋਜਨੁ ਭਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Cup of love is the bowl, which is filled with the food of affection."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੇਮ ਦਾ ਪਿਆਲਾ ਰਖਦੇ ਹਨ (ਅਤੇ 'ਪਤ' ਕਹੀਏ) ਗਿਆਨ ਦਾ ਭੋਜਨ ਭਾਉਂਦਾ ਹੈ।"