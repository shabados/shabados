data = "ਇਹ ਫਲ; ਤਿਸੁ ਜਨ ਕੈ ਮੁਖਿ ਭਨੇ ॥"
page = 296
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "these gifts are obtained by the man,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਦਾਤਾਂ ਉਸ ਇਨਸਾਨ ਨੂੰ ਮਿਲਦੀਆਂ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- these blessings come to one who,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੌ ਏਹੁ ਪੂਰਬੋਕਤ ਸਰਬ ਫਲ ਪ੍ਰਾਪਤ ਹੋਤੇ ਹੈਂ ਔਰ ਹੋਏਂਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਾਰੇ ਫਲ; ਹੇ ਨਾਨਕ! ਉਸ ਮਨੁੱਖ ਦੇ ਅੰਦਰ ਆ ਵੱਸਦੇ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਹ ਫਲ = ਇਹ ਸਾਰੇ ਫਲ (ਜਿਨ੍ਹਾਂ ਦਾ ਜ਼ਿਕਰ ਉਪਰ ਕੀਤਾ ਹੈ)। ਮੁਖਿ = ਮੂੰਹ ਤੋਂ। ਭਨੇ = ਉਚਾਰਿਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Estas Bendiciones le vienen a aquél, que a través de Guru Nanak,"