[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਪਕੜਾਏ; ਪ੍ਰਭ ਕੇ ਪੈਰਾ ॥"
page = 1085
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru has make me grasp the Lord feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਸੁਆਮੀ ਦੇ ਚਰਣ ਫੜਾਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru has led me to grasp the feet of God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਆਪ ਕੇ ਚਰਨ ਸਤਿਗੁਰੋਂ ਨੇ ਪਕੜਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੇ ਮੈਨੂੰ ਪ੍ਰਭੂ ਦੇ ਪੈਰ ਫੜਾਏ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "yo soy Tuyo. Sí, mi Guru me ha inspirado a aferrarme sólo a Tus Pies y así,"