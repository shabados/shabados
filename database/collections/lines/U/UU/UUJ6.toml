[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੋਸੁ. ਨ ਦੀਜੈ; ਕਾਹੂ ਲੋਗ ॥"
page = 888
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Find thou fault with none, O man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਕਿਸੇ ਤੇ ਭੀ ਇਲਜਾਮ ਨਾਂ ਲਾ, ਹੇ ਇਨਸਾਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Don't blame others, O people;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਕਿਸੇ ਲੋਗ ਕੋ ਦੋਸ ਨਾਹੀ ਦੇਈਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਸੰਤ ਜਨਾਂ ਨੇ ਇਉਂ ਸਮਝਿਆ ਹੈ ਕਿ ਆਪਣੀ ਕਿਸੇ ਔਖਿਆਈ ਬਾਰੇ) ਕਿਸੇ ਹੋਰ ਪ੍ਰਾਣੀਆਂ ਨੂੰ ਦੋਸ ਨਹੀਂ ਦੇਣਾ ਚਾਹੀਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਹੂ ਲੋਗ = ਕਿਸੇ ਪ੍ਰਾਣੀ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué hablar mal de los demás"