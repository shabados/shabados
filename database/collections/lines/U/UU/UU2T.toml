[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚਿ ਰਹਸੇ; ਪੂਰੇ ਹਰਿ ਲੋਗ ॥"
page = 153
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lord's perfect people rejoice in Truth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਪੂਰਨ ਪੁਰਸ਼ ਸੱਚ ਅੰਦਰ ਪ੍ਰਸੰਨ ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord's perfect people rejoice in the Truth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਚ ਕੋ ਪਾਇ ਕਰ (ਰਹਸੇ) ਅਨੰਦ ਹੂਏ ਹੈਂ ਵਹੁ ਹਰੀ ਕੇ ਪੂਰੇ ਲੋਕ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੂਰੇ ਪੁਰਸ਼ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਵਿਚ ਜੁੜ ਕੇ ਖਿੜੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚਿ = ਸੱਚ ਵਿਚ, ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਵਿਚ। ਰਹਸੇ = ਖਿੜੇ ਹੋਏ, ਪ੍ਰਸੰਨ। ਦੇ = ਦੇ ਕੇ, ਅਰਪਨ ਕਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y si le place a la Verdad del Señor, Dios lo toma como Suyo."