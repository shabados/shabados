[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਦਿ ਜੁਗਾਦਿ ਦਇਆਪਤਿ ਦਾਤਾ ॥"
page = 1060
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From the very beginning and the beginning of ages, the Lord of mercy is the Giver of the beings."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਨ ਆਰੰਭ ਅਤੇ ਯੁੱਗਾਂ ਦੇ ਆਰੰਭ ਤੋਂ ਰਹਿਮਤ ਦਾ ਸੁਆਮੀ ਜੀਵਾਂ ਦਾ ਦਾਤਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "From the very beginning of time, and throughout the ages, the Merciful Lord has been the Great Giver."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਸਦਾ ਤੂੰ ਸਰਬ ਜੀਆਂ ਕਾ ਦਾਤਾ ਹੈਂ। ਹੇ ਪਤੀ! ਮੇਰੇ ਪਰ ਦਇਆ ਕਰ ਤਿਨ ਕਾ ਮੇਰੇ ਕੋ ਮੇਲ ਦੇਹ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ (ਜਗਤ ਦੇ) ਸ਼ੁਰੂ ਤੋਂ, ਜੁਗਾਂ ਦੇ ਸ਼ੁਰੂ ਤੋਂ ਦਇਆ ਦਾ ਮਾਲਕ ਹੈਂ (ਸਾਰੇ ਸੁਖ ਪਦਾਰਥ) ਦੇਣ ਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਦਿ = (ਜਗਤ ਦੇ) ਸ਼ੁਰੂ ਤੋਂ। ਜੁਗਾਦਿ = ਜੁਗਾਂ ਦੇ ਸ਼ੁਰੂ ਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Benévolo existe desde tiempo inmemorial y es vivenciado"