[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਨ ਪੁਰਖ; ਨਹੀ ਡੋਲਾਨੇ ॥"
page = 289
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They become perfect persons and waver not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੁਕੰਮਲ ਇਨਸਾਨ ਹੋ ਜਾਂਦੇ ਹਨ ਅਤੇ ਡਿੱਕਡੋਲੇ ਨਹੀਂ ਖਾਂਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They are fulfilled and realized beings - they do not waver."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪੂਰਨ ਪੁਰਖ ਹੋ ਕਰ ਕਬੀ ਡੋਲਤੇ ਨਹੀਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੂਰਨ ਮਨੁੱਖ ਬਣ ਗਏ ਹਨ, ਕਦੇ (ਮਾਇਆ ਦੇ ਲਾਹੇ ਘਾਟੇ ਵਿਚ) ਡੋਲਦੇ ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en un Estado de Fe constante"