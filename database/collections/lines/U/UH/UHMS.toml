[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਰਭਵਤੀ ਇਕ ਤ੍ਰਿਯ ਹੁਤੀ; ਲੀਨੀ ਨਿਕਟਿ ਬੁਲਾਇ ॥"
page = 842

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There was a pregnant lady, which she called to her house."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਗਰਭਵਤੀ ਇਸਤਰੀ ਹੁੰਦੀ ਸੀ, (ਉਸ ਨੂੰ ਰਾਣੀ ਨੇ) ਕੋਲ ਬੁਲਾ ਲਿਆ।"