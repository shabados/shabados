[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਟਿਕਣੁ; ਨ ਪਾਵੈ ਰਾਈ ॥"
page = 1003
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The soul is not allowed to stay even for a moment."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਤਮਾ ਨੂੰ ਇਕ ਮੁਹਤ ਭਰ ਪੀ ਠਹਿਰਣਾ ਨਹੀਂ ਮਿਲਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mind cannot hold still, even for an instant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਮਨ ਥੋੜਾ ਭੀ ਟਿਕਨਾ ਨਹੀਂ ਪਾਵਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੀਵ ਦਾ) ਮਨ ਰਤਾ ਭਰ ਭੀ ਨਹੀਂ ਟਿਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਈ = ਰਤਾ ਭਰ ਭੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y la mente no se mantiene en calma ni por un instante."