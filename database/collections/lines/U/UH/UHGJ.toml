[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਬ ਹੋਏ ਮਨ ਸੁਧ; ਪਰਾਨੀ ॥"
page = 898
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then is his mind rendered pure"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਉਸ ਦਾ ਚਿੱਤ ਨਿਰਮਲ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the mortal's mind is purified."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਹਮਾਰੇ ਅੰਤਸਕਰਣ ਸੁਧ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਉਹਨਾਂ ਦੇ ਮਨ ਪਵਿੱਤ੍ਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਾਨੀ = ਹੇ ਪ੍ਰਾਣੀ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Visión del Sirviente del Señor se vuelve fructífera,"