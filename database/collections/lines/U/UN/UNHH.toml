data = "ਕਾਮਾਤੁਰ ਹ੍ਵੈ ਜੋ ਤਰੁਨਿ; ਆਵਤ ਪਿਯ ਕੇ ਪਾਸ ॥"
page = 827

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘If a woman comes to her husband tormented with the sexual desire,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਾਮ ਨਾਲ ਪੀੜਿਤ ਹੋ ਕੇ ਜੋ ਇਸਤਰੀ ਪ੍ਰਿਯ ਦੇ ਕੋਲ ਆਉਂਦੀ ਹੈ।"