[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਸ ਅਠ; ਲੀਖੇ ਹੋਵਹਿ ਪਾਸਿ ॥"
page = 1169
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Though man may have with him eighteen Puranas written in his hand,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਵੇਂ ਆਦਮੀ ਕੋਲ ਆਪਦੇ ਹਥ ਨਾਲ ਲਿਖੇ ਹੋਏ ਅਠਾਰਾ ਪੁਰਾਣ ਹੋਣ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One may have the eighteen Puraanas written in his own hand;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਠਾਰਾਂ ਪੁਰਾਣ ਪਾਸ ਲਿਖੇ ਹੂਏ ਹੋਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਕਿਸੇ ਪੰਡਿਤ ਨੇ ਅਠਾਰਾਂ ਪੁਰਾਣ ਲਿਖ ਕੇ ਕੋਲ ਰੱਖੇ ਹੋਏ ਹੋਣ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਸ ਅਠ = ਅਠਾਰਾਂ ਪੁਰਾਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si uno tuviera los dieciocho Puranas escritos en su mano"