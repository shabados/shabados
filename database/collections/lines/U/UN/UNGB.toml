[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਿਤਿ ਆਵੈ ਓਸੁ ਪਾਰਬ੍ਰਹਮੁ; ਲਗੈ ਨ. ਤਤੀ ਵਾਉ ॥੧॥"
page = 70
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If he then remembers the Supreme Lord, even the hot wind shall not touch him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਤਦ ਉਹ ਸ਼ਰੋਮਣੀ ਸਾਹਿਬ ਨੂੰ ਯਾਦ ਕਰ ਲਵੇ ਤਾਂ ਉਸ ਨੂੰ ਗਰਮ ਹਵਾ ਭੀ ਨਹੀਂ ਛੂਹੇਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "-if you then come to remember the Supreme Lord God, even the hot wind shall not touch you. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਵਿਪਦਾਵਾਨ ਪੁਰਸ ਕੋ ਜੋ ਪਾਰਬ੍ਰਹਮ ਚਿਤ ਆਵੈ ਅਰਥਾਤ ਪਰਮੇਸ੍ਵਰ ਯਾਦ ਆਵੈ, ਤੋ ਤੱਤੀ ਪਉਣ ਭੀ ਨਹੀਂ ਲਗ ਸਕਤੀ, ਭਾਵ ਏਹਿ ਕਿ ਕਿਸੀ ਪ੍ਰਕਾਰ ਕਾ ਦੁਖ ਨਹੀਂ ਲਗ ਸਕਤਾ। ਐਸੇ ਤਿਸ ਦੀ ਕ੍ਰਿਪਾ ਕਾ ਫਲੁ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਉਸ (ਬਿਪਤਾ ਮਾਰੇ) ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪਰਮਾਤਮਾ (ਯਾਦ) ਆ ਜਾਏ, ਤਾ ਉਸ ਦਾ ਵਾਲ ਭੀ ਵਿੰਗਾ ਨਹੀਂ ਹੁੰਦਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਸੁ ਚਿਤਿ = ਉਸ ਦੇ ਚਿੱਤ ਵਿੱਚ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si ahí él recuerda al Señor, ni siquiera los vientos calientes lo tocan.(1)"