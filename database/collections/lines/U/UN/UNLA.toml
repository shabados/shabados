[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਆਫਸੋਸ ਹੈ ਸਾਡੀ ਅਣਗਹਿਲੀ ਤੇ, ਅਫਸੋਸ ਹੈ ਸਾਡੀ ਗ਼ਫਲਤ ਤੇ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਅਲਗ਼ਿਆਸ ਅਜ਼ ਗ਼ਫਲਤਿ ਮਾ ਅਲਗ਼ਿਆਸ ॥੧੫॥੨॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "What can I do? No one else can give me any solace and console me.\" (24) (7)\nWhat would happen if you would show your full-moon-like gracious face?\nO my beloved! There would be just no cause of any damage if you would kindly show your face tonight.\" (25) (1)"