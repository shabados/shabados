[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਰਬ ਗੰਜਨ, ਸਰਬ ਭੰਜਨ; ਆਦਿ ਰੂਪ ਅਸੂਤ ॥"
page = 5
line = 13

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou, the Unborn Primal Entity, art the Destroyer of all egocentric people."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੰਕਾਰ ਨੂੰ ਤੋੜਨ ਵਾਲਾ, ਸਭ ਨੂੰ ਭੰਨਣ ਵਾਲਾ ਆਦਿ ਰੂਪ ਅਤੇ ਅਜਨਮਾ ਹੈ;"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਗਰਬ ਗੰਜਨ ਸਰਬ ਭੰਜਨ; ਆਦਿ ਰੂਪ ਅਸੂਤ ॥"