[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਿਆਨੁ ਧਿਆਨੁ; ਸਭੁ ਕੋਈ ਰਵੈ ॥"
page = 728
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Every one speaks of gnosis and meditation,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਕੋਈ ਬ੍ਰਹਿਮਬੋਧ ਤੇ ਬੰਦਗੀ ਦੀਆਂ ਗੱਲਾਂ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everyone speaks of wisdom and meditation;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗਿਆਨ ਔ ਧਿਆਨ ਕੀਆਂ ਬਾਤਾਂ ਤੋ ਸਭ ਕੋਈ (ਰਵੈ) ਉਚਾਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜ਼ਬਾਨੀ ਜ਼ਬਾਨੀ ਤਾਂ ਹਰ ਕੋਈ ਆਖਦਾ ਹੈ ਕਿ ਮੈਨੂੰ ਗਿਆਨ ਪ੍ਰਾਪਤ ਹੋ ਗਿਆ ਹੈ, ਮੇਰੀ ਸੁਰਤ ਜੁੜੀ ਹੋਈ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਿਆਨੁ = ਆਤਮਕ ਵਿੱਦਿਆ ਦੀ ਸੂਝ। ਧਿਆਨੁ = ਸੁਰਤ ਜੋੜਨੀ, ਮਨ ਇਕਾਗਰ ਕਰਨਾ। ਰਵੈ = ਜ਼ਬਾਨੀ ਜ਼ਬਾਨੀ ਆਖਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Muchos hablan de la sabiduría y del conocimiento,"