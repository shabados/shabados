[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਸਿਮਰਨਿ; ਨਾਹੀ ਤੁਹਿ ਕਾਨਿ ॥"
page = 971
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Contemplating whom thou shalt not be subservient to another."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਚੇਤੇ ਕਰਨ ਨਾਲ ਤੈਨੂੰ ਕਿਸੇ ਦੀ ਮੁਛੰਦਗੀ ਨਹੀਂ ਰਹੇਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remembering Him in meditation, you shall not be obligated to others."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸਿਮਰਨ ਕਰਨੇ ਤੇ ਕਿਸੀ ਕੀ ਤੇਰੇ ਕੋ ਕਨੌਡ ਨਹੀਂ ਹੋਵੈਗੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸਿਮਰਨ ਨਾਲ ਤੈਨੂੰ ਕਿਸੇ ਦੀ ਮੁਥਾਜੀ ਨਹੀਂ ਰਹਿੰਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਨਿ = ਕਾਣ, ਮੁਥਾਜੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Contemplando al Señor, uno no necesita apoyarse en nadie más;"