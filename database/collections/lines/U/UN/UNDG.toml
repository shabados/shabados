data = "ਪੈਠਿਯੋ ਮਧ ਕਮੰਡਲ ਭੂਪਾ ॥੧੫॥"
page = 172

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Shukracharya transformed himself into a small fish and seated himself in the mendicant’s pot.15."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਰਾਜੇ ਦੇ ਕਮੰਡਲ ਦੀ ਟੂਟੀ ਵਿਚ ਬੈਠ ਗਿਆ ॥੧੫॥"