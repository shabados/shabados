[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਮਾਰਗਿ ਚਲਣਾ; ਛਡਿ ਖਬੈ ਸਜੈ ॥੧੫॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The way of the gurmukhs is also the same; they without the caring for the loss and the profit go on moving further and further."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਤਾਂਤੇ ਹੇ ਭਾਈਓ!) ਗੁਰਮੁਖ ਮਾਰਗ ਉਤੇ ਚੱਲਣਾ ਸ੍ਰੇਸ਼ਟ (ਹੈ) ਅਰ ਸੱਜੇ ਖੱਬੇ (ਦੇ ਖਤਰਨਾਕ ਰਸਤੇ) ਛੱਡਣੇ (ਚੰਗੇ ਹਨ)।"