[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਗੇ ਸਚਾ ਸਚਿ ਨਿਆਇ; ਆਪ ਹਜੂਰਿ ਦੋਵੈ ਝਗੜਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Dispenser of the true justice made them to debate their points there."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅੱਗੇ ਸੱਚਾ (ਹਾਕਮ) ਸੱਚਾ ਨਿਆਉਂ ਕਰਦਾ ਹੈ, ਆਪਣੇ ਹਜ਼ੂਰ ਦੋਹਾਂ ਦੇ ਇਜ਼ਹਾਰ ਲੈਂਦਾ ਹੈ।"