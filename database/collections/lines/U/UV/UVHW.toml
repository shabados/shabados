[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਹਰਿ ਰਸ; ਸੁਖੁ ਤਿਲੁ. ਨਹੀ ਲਾਧਾ ॥"
page = 1072
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "but without the Lord's nectar, she fins not even an iota of peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੰਤੂ ਸੁਆਮੀ ਦੇ ਅੰਮ੍ਰਿਤ ਦੇ ਬਾਝੋਂ, ਉਸ ਨੂੰ ਇਕ ਭੋਗ ਭਰ ਭੀ ਆਰਾਮ ਨਹੀਂ ਲੱਭਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but without the sublime essence of the Lord, not an iota of peace is found."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਹਰੀ ਨਾਮ ਰਸ ਸੇ ਬਿਨਾਂ ਤਿਲ ਮਾਤ੍ਰ ਭੀ ਸੁਖ ਨਹੀਂ ਪ੍ਰਾਪਤਿ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰਿ-ਨਾਮ ਦੇ ਸੁਆਦ ਤੋਂ ਬਿਨਾ ਕਿਸੇ ਨੂੰ ਭੀ ਰਤਾ ਭਰ ਸੁਖ ਨਹੀਂ ਲੱਭਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਲੁ = ਰਤਾ ਭਰ ਭੀ। ਲਾਧਾ = ਲੱਭਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando el Señor muestra Su Misericordia,"