[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਜਪਤ; ਪਾਵਹਿ ਬਿਸ੍ਰਾਮੁ ॥"
page = 282
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who utter the Name obtain rest."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਦੇ ਹਨ, ਉਹ ਆਰਾਮ ਪਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who chant the Naam find their place of rest."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਜਨ ਨਾਮ ਕੋ ਜਪਤਿਆਂ ਹੋਇਆਂ ਬਿਸ੍ਰਾਮ ਪਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹ ਸੇਵਕ) ਨਾਮ ਜਪ ਕੇ ਅਡੋਲ ਅਵਸਥਾ ਹਾਸਲ ਕਰਦੇ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਸਰਾਮੁ = ਟਿਕਾਣਾ, ਦੁੱਖਾਂ ਤੋਂ ਬਚਾਉ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los que invocan al Naam encuentran descanso,"