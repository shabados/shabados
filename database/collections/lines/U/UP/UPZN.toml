[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਜਿਸੁ ਪੂਰਾ ਭਾਗੁ ॥"
page = 189
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, whose destiny is perfect,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨਾਨਕ ਜੀ ਆਖਦੇ ਹਨ ਜਿਸ ਦੀ ਪ੍ਰਾਲਬੰਧ ਪੂਰਨ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, those who have perfect destiny"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਸ ਕਾ ਪੂਰਨ ਪੁੰਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਜਿਸ ਮਨੁੱਖ ਦੀ ਵੱਡੀ ਕਿਸਮਤ ਹੁੰਦੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, debido a un perfecto Destino"