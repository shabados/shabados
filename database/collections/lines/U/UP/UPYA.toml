[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਪੁਤ੍ਰੰ ਨ ਮਿਤ੍ਰੰ, ਨ ਸਤ੍ਰੰ ਨ ਭਾਮੰ ॥"
page = 19

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is without son, without friend, without enemy and without wife."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਾ ਪੁੱਤਰ ਹੈ, ਨਾ ਮਿਤਰ ਹੈ, ਨਾ ਵੈਰੀ ਹੈ, ਨਾ ਇਸਤਰੀ।"