[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ; ਮਹਲੀ, ਮਹਲੁ ਪਛਾਨੁ ॥"
page = 414
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru, the Master's mansion is recognised."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਮਾਲਕ ਦਾ ਮੰਦਰ ਸਿਆਣਿਆਂ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh realizes the Mansion of the Lord's Presence."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖੋਂ ਨੇ (ਮਹਲੀ) ਅਕਾਲ ਪੁਰਖ ਕੇ (ਮਹਲੁ) ਸ੍ਵਰੂਪ ਕੋ ਪਛਾਨਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਤੂੰ ਆਪਣੇ ਅੰਦਰ ਪ੍ਰਭੂ ਦਾ ਟਿਕਾਣਾ ਪਛਾਣ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਹਲੀ = ਮਹਲ ਦਾ ਮਾਲਕ, ਪਰਮਾਤਮਾ। ਮਹਲੁ = ਘਰ, ਟਿਕਾਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A través del Guru se logra la realización de la Casa del Señor."