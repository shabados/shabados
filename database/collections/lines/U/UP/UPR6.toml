[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਠ ਪੜੈ; ਲੇ ਲੋਕ ਸੁਣਾਵੈ ॥"
page = 905
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Studying religious texts and reading them to people,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਾਰਮਕ ਗ੍ਰੰਥ ਵਾਚਣ ਅਤੇ ਲੋਕਾਂ ਨੂੰ ਸੁਣਾਉਣ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Studying the scriptures, reading them to other people,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੀਤਾ ਆਦਿਕੋਂ ਕੇ ਪਾਠ ਪੜਕੇ ਲੋਗੋਂ ਕੋ ਸੁਨਾਇ ਵਡਿਆਈ ਕੋ (ਲੇ) ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ (ਲੋਕ-ਵਿਖਾਵੇ ਦੀ ਖ਼ਾਤਰ) ਧਾਰਮਿਕ ਪੁਸਤਕਾਂ ਪੜ੍ਹਦਾ ਹੈ, ਪੁਸਤਕਾਂ ਲੈ ਕੇ ਲੋਕਾਂ ਨੂੰ (ਹੀ) ਸੁਣਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੇ = ਲੈ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aunque estudie las escrituras, leyéndoselas a otros,"