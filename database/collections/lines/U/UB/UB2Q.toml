[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਪ੍ਰਭਿ ਅਪਦਾ ਕਾਟੀ ॥੪॥੭੪॥੧੪੩॥"
page = 194
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, the Lord has annulled my affliction."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਠਾਕੁਰ ਨੇ ਮੇਰੀ ਬਿਪਤਾ ਮੇਟ ਸਟੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, God has relieved my pain. ||4||74||143||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਨ ਕੀ ਜਨਮ ਮਰਨ ਰੂਪ ਅਪਦਾ ਗੁਰੋਂ ਨੈ ਕਾਟ ਦਈ ਹੈ॥੪॥੭੪॥੧੪੩॥☬ਉਪਦੇਸ਼:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਪਰਮਾਤਮਾ ਨੇ ਉਸ ਦੀ ਹਰੇਕ ਕਿਸਮ ਦੀ ਬਿਪਤਾ ਦੂਰ ਕਰ ਦਿੱਤੀ ਹੈ ॥੪॥੭੪॥੧੪੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ। ਅਪਦਾ = ਬਿਪਤਾ, ਮੁਸੀਬਤ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "dice Nanak, Dios ha aliviado mi dolor.(4-74-143)"