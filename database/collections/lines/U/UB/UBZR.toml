[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸੁ ਸੁਖ ਤੇ; ਸਿਵ ਬ੍ਰਹਮ ਡਰਾਨਾ ॥"
page = 330
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This worldly pleasure, ever Shiva and Brahma dread."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਸੰਸਾਰੀ ਖੁਸ਼ੀ ਪਾਸੋਂ ਸ਼ਿਵਜੀ ਅਤੇ ਬ੍ਰਰਮਾ ਭੀ ਭੈ ਖਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Even Shiva and Brahma are afraid of this pleasure,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਸੁਖ ਸੇ ਸਿਵ ਔਰ ਬ੍ਰਹਮ ਭੀ ਡਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ (ਮਾਇਆ-) ਸੁਖ ਤੋਂ ਤਾਂ ਸ਼ਿਵ ਜੀ ਤੇ ਬ੍ਰਹਮਾ (ਵਰਗੇ ਦੇਵਤਿਆਂ) ਨੇ ਭੀ ਕੰਨਾਂ ਨੂੰ ਹੱਥ ਲਾਏ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਡਰਨਾ = ਡਰ ਗਏ, ਕੰਨਾਂ ਨੂੰ ਹੱਥ ਲਾਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aun Shiva y Brahma tienen miedo de tal placer;"