[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲੀਨੇ ਹੀ ਰੋਸੁ ਫਿਰੈਂ ਜੀਅ ਸਾਥੰ ॥"
page = 198

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(This was the situation at that time) that the wife did no service to her husband and ever remained displeased with him."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸਗੋਂ) ਮਨ ਵਿੱਚ ਗੁੱਸਾ ਲਈ ਫਿਰਦੀਆਂ ਸਨ।"