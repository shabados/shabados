[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਹੋਵੈ ਭਾਗੁ ਮਥਾਣੈ ॥੩॥"
page = 1004
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "recognises the One Lord meeting with the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਗੁਰਾਂ ਨਾਲ ਮਿਲ ਕੇ ਇਕ ਸਾਂਈਆ ਨੂੰ ਸਿੰਝਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "who has such destiny written on his forehead. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਮਥੇ ਕੇ ਵੱਡੇ ਭਾਗ ਹੋਵੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਮੱਥੇ ਉਤੇ ਭਾਗ ਜਾਗ ਪੈਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸੁ ਮਥਾਣੈ = ਜਿਸ ਦੇ ਮੱਥੇ ਉਤੇ। ਭਾਗੁ = ਚੰਗੀ ਕਿਸਮਤ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "quien carga tal Destino sobre su frente.(3)"