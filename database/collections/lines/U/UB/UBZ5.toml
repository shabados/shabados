[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਿ ਜਪਾਏ; ਤ ਨਾਨਕ. ਜਾਪ ॥੬॥"
page = 282
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak if He causes man to remember Him then does he remember Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਜੇਕਰ ਉਹ ਬੰਦੇ ਪਾਸੋਂ ਆਪਣਾ ਸਿਮਰਨ ਕਰਾਵੇ ਤਦ ਹੀ ਉਹ ਸਿਮਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As He inspires us to meditate, O Nanak, so do we meditate. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੌ ਅਪਨਾ ਨਾਮ ਆਪ ਜਪਾਵਤਾ ਹੈ, ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਸੋਈ ਨਾਮ ਜਪਤਾ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜੇ ਉਹ ਆਪ ਆਪਣਾ ਜਾਪ ਕਰਾਏ ਤਾਂ ਹੀ ਜੀਵ ਜਾਪ ਕਰਦੇ ਹਨ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤ = ਤਾਂ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo lo alabará aquel a quien Él Mismo elija. (6)"