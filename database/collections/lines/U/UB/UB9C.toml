[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਓਅੰਕਾਰ, ਸਬਦਿ ਧਿਆਈਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Amidst the gurmukhs the Oankar Word is remembered."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਓਅੰਕਾਰ ਸ਼ਬਦ (ਮੂਲ ਮੰਤ੍ਰ) ਗੁਰਮੁਖ ਦੁਆਰਾ ਧਿਆਈਦਾ ਹੈ।"