data = "ਸੋ ਸਭ ਆਜੁ ਅਸਰਫੀ ਪਾਵੈ ॥੨੩॥"
page = 858

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘The person who tells the date of minting will take over the coins.’(23)"

[[content]]
