type = "primary"
data = "ਬਹੁਕਮੇ ਸ਼ੁਮਾ ਮਨ ਖ਼ਤਾ ਕਰਦਹਅਮ ॥"
page = 1407

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘If I disobeyed you, I committed a sin."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੇ ਹੁਕਮ ਨੂੰ ਨਾ ਮੰਨ ਕੇ ਖ਼ਤਾ ਕੀਤੀ ਹੈ।"