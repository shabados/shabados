[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨਿ. ਸਗਲੀ ਚਿੰਤ ਮਿਟਾਈ ॥"
page = 628
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and it has effaced all the anxiety."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਇਸ ਨੇ ਸਾਰਾ ਫਿਕਰ ਦੂਰ ਕਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It eradicates all anxiety."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨੋਂ ਨੇ ਸਰਬ ਪ੍ਰਕਾਰ ਕੀ ਚਿੰਤਾ ਮਿਟਾਇ ਦਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਆਪਣੀ ਸਾਰੀ ਚਿੰਤਾ ਦੂਰ ਕਰ ਲਈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਨਿ = ਉਸ (ਮਨੁੱਖ) ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y toda ansiedad ha sido erradicada."