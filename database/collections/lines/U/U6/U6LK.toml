[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸੁ ਗ੍ਰਿਹ ਮਹਿ; ਕੋਈ ਜਾਗਤੁ ਰਹੈ ॥"
page = 182
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rare is the person, who remains awake in this house."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਵਿਰਲਾ ਪੁਰਸ਼ਾ ਹੀ ਇਸ ਘਰ ਅੰਦਰ ਜਾਗਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who remain awake in this house are very rare;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਸਰੀਰ ਘਰ ਮੇਂ ਜੋ ਕੋਈ ਨਿੰਦ੍ਰਾ ਸੇ ਜਾਗਤਾ ਰਹਿਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਇਸ ਸਰੀਰ-ਘਰ ਵਿਚ ਕੋਈ ਵਿਰਲਾ ਮਨੁੱਖ ਸੁਚੇਤ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗ੍ਰਿਹ ਮਹਿ = ਸਰੀਰ-ਘਰ ਵਿਚ। ਕੋਈ = ਕੋਈ ਵਿਰਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Extraordinario es aquél que se conserva despierto en su hogar,"