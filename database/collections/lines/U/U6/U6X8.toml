data = "ਤਹਾ ਭੂਰਪਾਲੰ ਧੂਰਾ ਰੰਗੁ ਰਚ︀ਯੋ ॥"
page = 147

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There that Gandharva adopted a wonderful garb."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਭੂਰਪਾਲ ਨੇ ਵਿਚਿਤ੍ਰ ਧੁੰਧਲਾ ਰੰਗ ਫੈਲਾ ਦਿੱਤਾ।"