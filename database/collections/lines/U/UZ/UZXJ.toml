[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸਾ ਨਾਮੁ ਜਪਹੁ; ਮਨ ਰੰਗਿ ॥"
page = 264
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such Name O my soul, repeat thou with love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹੋ ਜਿਹੇ ਨਾਮ ਦਾ, ਹੇ ਮੇਰੀ ਜਿੰਦੇ! ਤੂੰ ਪ੍ਰੇਮ ਨਾਲ ਉਚਾਰਣ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chant such a Name with love, O my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਐਸਾ ਨਾਮ (ਰੰਗਿ) ਪ੍ਰੇਮ ਕਰ ਕੇ ਜਪੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! (ਪ੍ਰਭੂ ਦਾ) ਅਜੇਹਾ ਨਾਮ ਪਿਆਰ ਨਾਲ ਜਪ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਰੰਗਿ = ਰੰਗ ਵਿਚ, ਪਿਆਰ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi Alma, ¡enaltece siempre el Nombre!(3)"