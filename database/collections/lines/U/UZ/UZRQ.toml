data = "(ਉਸ ਦੇ ਗੱਲੇ ਵਿਚ ਪਈ ਨਰ-ਮੁੰਡ-ਮਾਲਾ ਵਿਚੋਂ) ਚੋਂਦਾ ਹੋਇਆ ਲਹੂ (ਇਤਨਾ) ਸੋਭ ਰਿਹਾ ਹੈ"