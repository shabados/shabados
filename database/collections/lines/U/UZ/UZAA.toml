[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਗਿਆਨੁ ਗੁਰੂ; ਹਰਿ ਮੰਗੀਆ ਰਾਮ ॥"
page = 575
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From the Guru I ask for the knowledge of the great God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਪਾਸੋਂ ਮੈਂ ਵਿਸ਼ਾਲ ਵਾਹਿਗੁਰੂ ਦੀ ਗਿਆਤ ਦੀ ਯਾਚਨਾ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "From the Guru, I ask for the Lord's spiritual wisdom."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਗੁਰੋਂ ਸੇ ਬੜਾ ਹਰਿ ਕਾ ਗ੍ਯਾਨ ਮਾਂਗਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰੂ ਪਾਸੋਂ ਆਤਮਕ ਜੀਵਨ ਦੀ ਸ੍ਰੇਸ਼ਟ ਸੂਝ ਮੰਗਦੀ ਰਹਿੰਦੀ ਹੈ, ਜੋ (ਗੁਰੂ ਪਾਸੋਂ) ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੂਝ ਮੰਗਦੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "busco, del Guru, la Sabiduría del Señor. Pido por la Sabiduría Espiritual del Señor y Su Sublime Sermón,"