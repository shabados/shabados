[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਤਿ ਅਸਤ੍ਰਾਤਿ ਉਚਾਰੀਐ; ਨਾਮ ਪਾਸਿ ਲਖਿ ਲੇਹੁ ॥੨੮੩॥"
page = 730

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Uttering primarily the word “Karisan”, then adding the word “Vallabha and then uttering the words “Pati Astar”, all the names of Paash are known.283."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਮਗਰੋਂ) ਅੰਤ ਤੇ 'ਪਤਿ' ਅਤੇ 'ਅਸਤ੍ਰ' ਉਚਾਰਨ ਕਰੋ। (ਇਹ) ਪਾਸ ਦਾ ਨਾਮ ਸਮਝ ਲਵੋ ॥੨੮੩॥"