[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਜਨਿ ਧਿਆਇਆ ਖਸਮੁ; ਤਿਨਿ ਸੁਖੁ ਪਾਇਆ ॥"
page = 523
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whosoever, meditates on the Lord, he obtains peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਇਨਸਾਨ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰਦਾ ਹੈ, ਉਹ ਆਰਾਮ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whoever meditates on the Lord and Master obtains peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਜਿਸ ਦਾਸ ਨੇ ਅਪਨੇ ਸ੍ਵਾਮੀ ਕਾ ਧ੍ਯਾਨ ਕੀਆ ਹੈ ਤਿਸ ਤਿਸ ਨੇ ਸੁਖ ਪਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਖਸਮ (-ਪ੍ਰਭੂ) ਨੂੰ ਸਿਮਰਿਆ ਹੈ ਉਸ ਨੇ ਸੁਖ ਪਾਇਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨਿ = ਜਨ ਨੇ। ਜਿਨਿ ਜਨਿ = ਜਿਸ ਮਨੁੱਖ ਨੇ। ਤਿਨਿ = ਉਸ ਮਨੁੱਖ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues aquéllos que meditaron en su Señor obtuvieron la Paz."