[[content]]
assets = ["SSKS"]
type = "primary"
data = "ਬਾਇਸ ਨ ਜਾਨਤ ਮਰਾਲ ਮਾਲ ਸੰਗਤਿ ਕੋ; ਮਰਕਟ ਮਾਨਕੁ ਹੀਰਾ ਨ ਪਹਿਚਾਨਈ ॥"

[[content]]
assets = ["SSPK"]
type = "translation"
language = "en"
data = "Just as a crow cannot know the importance of the company of swans nor can a monkey appreciate the value of gems and diamonds."

[[content]]
assets = ["SSSK"]
type = "translation"
language = "pa"
data = "ਕਾਂ ਨਹੀਂ ਜਾਣਦਾ ਹੈ ਹੰਸਾਂ ਦੀ ਪੰਗਤ ਦੀ ਸੰਗਤ ਨੂੰ ਤੇ ਬਾਂਦਰ ਹੀਰੇ ਮਣੀਆਂ ਨੂੰ ਨਹੀਂ ਪਛਾਣ ਸੱਕਦਾ।"