[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕੁ ਬੋਲੈ ਅੰਮ੍ਰਿਤ ਬਾਣੀ ॥"
page = 1137
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak utters the ambrosial Gurbani."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਅੰਮ੍ਰਿਤਮਈ ਬਾਣੀ ਉਚਾਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak utters the Ambrosial Bani of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਾਂ ਤੇ ਜੀਵ ਰਾਮ ਨਾਮ ਅੰਮ੍ਰਿਤ ਬਾਣੀ ਕੇ (ਬੋਲੈ) ਉਚਾਰਨ ਕਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ (ਇਹ) ਬਚਨ ਆਖਦਾ ਹੈ"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕੁ ਬੋਲੈ = ਨਾਨਕ ਬੋਲਦਾ ਹੈ। ਅੰਮ੍ਰਿਤ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak hace conocida la Verdad"