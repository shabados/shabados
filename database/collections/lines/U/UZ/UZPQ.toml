[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦੀ; ਸਾਗਰੁ ਤਰਿਆ ॥"
page = 197
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the Guru's grace the world-ocean is crossed,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਸੰਸਾਰ-ਸੰਮੁਦਰ ਤੋਂ ਪਾਰ ਉਤਰਿਆ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, one crosses over the world-ocean;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨੋਂ ਨੈ ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਸੰਸਾਰ ਸਮੁੰਦ੍ਰ ਕੋ ਤਰਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ (ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹਿਰਦੇ ਵਿਚ ਸਾਂਭ ਕੇ ਸੰਤ ਜਨ) ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਲੰਘ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਸਾਦੀ = ਪਰਸਾਦਿ, ਕਿਰਪਾ ਨਾਲ। ਸਾਗਰੁ = (ਸੰਸਾਰ-) ਸਮੁੰਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por la Gracia del Guru, nadan a través del océano del mundo,"