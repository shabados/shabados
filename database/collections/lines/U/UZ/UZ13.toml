[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਹਵ ਜੁਕਤਿ ਜਿਤੀਕ ਹੁਤੀ; ਜਗ ਸਰਬਨ ਮੈ ਸਬ ਹੀ ਅਨੁਮਾਨ੍ਰਯੋ ॥"
page = 677

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He knew all the arts of warfare,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਤਰ੍ਹਾਂ ਦਾ) ਚੌਹਾਂ ਚਕਾਂ ਵਿਚ ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ। ਜਗਤ ਵਿਚ ਜਿਤਨੀਆਂ ਵੀ ਯੁੱਧ ਦੀਆਂ ਜੁਗਤਾਂ ਹਨ, ਉਨ੍ਹਾਂ ਸਭ ਦਾ (ਉਸ ਨੇ) ਅਨੁਮਾਨ ਕਰ ਲਿਆ ਹੈ।"