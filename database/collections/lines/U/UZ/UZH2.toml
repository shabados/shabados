[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਿ ਉਪਾਏ; ਧੰਧੈ ਲਾਏ ॥"
page = 112
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thyself Thou created the beings and engages them to their jobs."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਹੀ ਤੂੰ ਜੀਵ ਪੈਦਾ ਕੀਤੇ ਤੇ ਆਪੋ ਆਪਣੇ ਕੰਮੀ ਲਾ ਦਿੱਤੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself creates, and He Himself assigns us to our tasks."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਵਾਹਿਗੁਰੂ ਨੇ ਜੀਵ ਉਪਾਇ ਕਰ ਧੰਧਿਓਂ ਮੇਂ ਲਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਹੀ ਜੀਵਾਂ ਨੂੰ ਪੈਦਾ ਕਰਦਾ ਹੈ ਤੇ ਆਪ ਹੀ ਮਾਇਆ ਦੀ ਦੌੜ ਭੱਜ ਵਿਚ ਜੋੜ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧੰਧੈ = ਝੰਬੇਲੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, el Señor Mismo, crea; Él Mismo nos pone a trabajar;"