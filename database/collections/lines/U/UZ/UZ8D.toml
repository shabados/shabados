[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਜਾ ਸੀਸ ਨ੍ਰਿਪ ਜੋਰਿ ਉਤਾਲਾ ॥੪੮॥"
page = 187

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Hearing these words, Rudra become gracious and he caused Daksha to become alive again and get up.48."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਛੇਤੀ ਨਾਲ ਬਕਰੇ ਦਾ ਸਿਰ ਰਾਜੇ (ਦੇ ਧੜ) ਨਾਲ ਜੋੜ ਦਿੱਤਾ ॥੪੮॥"