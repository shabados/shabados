data = "(ਹੇ ਵਿਸ਼ਈ ਮਨੁੱਖ!) ਤੂੰ ਹਰ ਰੋਜ਼ ਆਪਣੇ ਸਰੀਰ ਨੂੰ ਇਸ਼ਨਾਨ ਕਰਾਂਦਾ ਹੈਂ,"

