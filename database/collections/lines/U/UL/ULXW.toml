[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੀਰਥ ਨਾਇ; ਨ ਉਤਰਸਿ ਮੈਲੁ ॥"
page = 890
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Bathing at shrines, the filth departs not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਰਮ ਅਸਥਾਨਾਂ ਤੇ ਨ੍ਹਾਉਣ ਨਾਲ ਗੰਦਗੀ ਲਹਿੰਦੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Bathing at sacred shrines of pilgrimage, filth is not washed off."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੀਰਥੋਂ ਮੇਂ ਨ੍ਹਾਵਨੇ ਤੇ ਇਸ ਜੀਵ ਕੀ ਮੈਲ ਨਹੀਂ ਉਤਰਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਮਾਇਆ ਦੇ ਮੋਹ ਦੀ ਇਹ) ਮੈਲ ਤੀਰਥਾਂ ਉਤੇ ਇਸ਼ਨਾਨ ਕਰ ਕੇ ਨਹੀਂ ਉਤਰੇਗੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੀਰਥ ਨਾਇ = ਤੀਰਥਾਂ ਉਤੇ ਇਸ਼ਨਾਨ ਕਰ ਕੇ। ਨਾਇ = ਨ੍ਹਾਇ। ਉਤਰਸਿ = ਉਤਰੇਗੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bañándose en las aguas santas uno no limpia sus impurezas;"