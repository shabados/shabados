[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਮਲ ਜੋਤਿ; ਸਭ ਮਾਹਿ ਸਮਾਣੀ ॥"
page = 121
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Immaculate is the Lord's light which is contained amongst all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦਾ ਨੂਰ ਜੋ ਸਾਰਿਆਂ ਅੰਦਰ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Light which is pervading among all is Immaculate."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਨਿਰਮਲ ਰੂਪ ਪਰਮੇਸ੍ਵਰ ਕੀ ਜੋਤ ਸਭ ਮੇਂ ਸਮਾਈ ਹੂਈ ਤਿਨੋਂ ਨੇ ਜਾਣੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੀ ਪਵਿੱਤ੍ਰ ਜੋਤਿ ਸਭ ਜੀਵਾਂ ਵਿਚ ਸਮਾਈ ਹੋਈ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pura es la Palabra, puro el Canto del Guru; Inmaculada es la Luz del Señor que prevalece en todo."