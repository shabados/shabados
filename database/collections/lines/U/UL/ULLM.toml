[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕਾ ਖੋਜੈ; ਏਕ ਪ੍ਰੀਤਿ ॥"
page = 1180
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whosoever searches and loves the One alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੋਈ ਕੇਵਲ ਇੱਕ ਨੂੰ ਹੀ ਲੱਭਦਾ ਹੈ ਤੇ ਪਿਆਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He seeks the One Lord, and loves the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕਾ ਏਕੀ ਪਰਮੇਸ੍ਵਰ ਕੋ ਜੋ ਪ੍ਰੀਤੀ ਕਰ ਕੇ ਖੋਜਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ (ਹਰ ਥਾਂ) ਇਕ ਪਰਮਾਤਮਾ ਨੂੰ ਹੀ ਭਾਲਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖੋਜੈ = ਭਾਲਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, uno busca y ama al Uno Solo"