[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਡੋਲੈ ਬਹੁ ਬਿਧੀ; ਮਨੁ ਲਪਟਿਓ ਤਿਹ ਸੰਗ ॥"
page = 258
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through wealth the mind wavers in many ways and clings there with."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨ-ਦੌਲਤ ਦੇ ਰਾਹੀਂ ਮਨੂਆਂ ਅਨੇਕਾਂ ਤਰਾਂ ਡਿਕਡੋਲੇ ਖਾਂਦਾ ਹੈ ਅਤੇ ਉਸ ਨਾਲ ਚਿਮੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Maya clings to the mind, and causes it to waver in so many ways."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਤੇਰੀ ਮਾਇਆ ਬਹੁਤ ਬਿਧੀਓਂ ਕਰ ਕੇ ਡੋਲਤੀ, ਭਾਵ ਵਿਚਰਤੀ ਹੈ। ਵਾ ਮਾਇਆ ਕੇ ਵਾਸਤੇ ਬਹੁਤੁ ਪ੍ਰਕਾਰ ਜੀਵ ਡੋਲਤਾ ਹੈ ਅਰ ਮਨੁ ਤਿਸੁ ਮਾਇਆ ਕੇ ਸੰਗ ਲੰਪਟ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਦਾ ਮਨ ਕਈ ਤਰੀਕਿਆਂ ਨਾਲ ਮਾਇਆ ਦੀ ਖ਼ਾਤਰ ਹੀ ਡੋਲਦਾ ਰਹਿੰਦਾ ਹੈ, ਮਾਇਆ ਦੇ ਨਾਲ ਹੀ ਚੰਬੜਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਇਆ = ਮਾਇਆ ਵਿਚ, ਮਾਇਆ ਦੀ ਖ਼ਾਤਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La mente está distraída; divaga seducida por Maya y está apegada a sus vacilaciones."