[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਮਾਰਗਿ ਚਲਣਾ; ਆਸ ਨਿਰਾਸੀ ਝੀੜ ਉਝੀੜੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The gurmukhs repudiating all hopes and desires move on the way of detachment and tear down the veil of Maya."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾਂ ਦੇ ਰਸਤੇ ਚੱਲਣਾ ਤਾਂ ਹੁੰਦਾ ਹੈ ਜਦ ਸੂਖਮ ਤੇ ਸੂਖਮ ਬੀ ਆਸਾ ਤੋਂ ਨਿਰਾਸੀ (ਬੁਧ) ਹੋ ਜਾਵੇ, (ਭਾਵ ਰੰਚਕ ਬੀ ਆਸ ਨਾ ਫੁਰੇ)।"