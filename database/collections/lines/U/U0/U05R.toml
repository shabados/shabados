[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਭਗਤਿ ਪ੍ਰਭ ਸਾਰੁ ॥"
page = 865
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, sublime is the Lord's devotion."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਸਰੇਸ਼ਟ ਹੈ ਉਨ੍ਹਾਂ ਦੀ ਪ੍ਰੇਮ-ਭਾਵਨਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, devotion to God is noble and sublime."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਭਗਤੀ ਪ੍ਰਭੂ ਕੀ ਸ੍ਰੇਸ੍ਟ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- (ਹੇ ਭਾਈ!) ਪ੍ਰਭੂ ਦੀ ਭਗਤੀ ਕਰਿਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਰੁ = ਸੰਭਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, vive con la Devoción del Señor en tu mente,"