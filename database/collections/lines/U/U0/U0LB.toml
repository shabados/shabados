[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਕਉ ਸਦਾ ਮਨ ਜਾਪਿ ॥"
page = 896
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever remember thou Him, O my soul,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਦੀਵ ਹੀ ਉਸ ਦਾ ਭਜਨ ਕਰ, ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate on Him forever, O my mind,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਜੀਵ! ਤਿਸ ਕੋ ਸਦਾ ਮਨ ਕਰ ਕੇ ਜਪੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਸਦਾ ਸਿਮਰਿਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸ ਕਉ = {ਸੰਬੰਧਕ 'ਕਉ' ਦੇ ਕਾਰਨ ਲਫ਼ਜ਼ 'ਤਿਸ' ਦਾ (ੁ) ਉਡ ਗਿਆ ਹੈ}। ਮਨ = ਹੇ ਮਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mente mía, habita siempre"