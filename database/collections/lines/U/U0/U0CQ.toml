[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਲੈਤ; ਜਮੁ ਨੇੜਿ. ਨ ਆਵੈ ॥"
page = 1142
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Uttering the Name, death's courier comes not near man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦਾ ਊਚਾਰਨ ਕਰਨ ਦੁਆਰਾ ਮੌਤ ਦਾ ਦੂਤ ਇਨਸਾਨ ਦੇ ਲਾਗੇ ਨਹੀਂ ਲੱਗਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Repeating the Naam, the Messenger of Death does not draw near."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਜਪਣੇ ਕਰ ਜਮ ਨੇੜੇ ਨਹੀਂ ਆਵਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪਦਿਆਂ ਜਮ (ਮਨੁੱਖ ਦੇ) ਨੇੜੇ ਨਹੀਂ ਆਉਂਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੇੜਿ = ਨੇੜੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Recitando el Nombre, Yama no se le acerca a uno."