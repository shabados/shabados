[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਮਿਲਿ ਪ੍ਰਭੂ ਚਿਤਾਰਿਆ ॥"
page = 627
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting with the Guru, I have cherished the Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਨਾਲ ਮਿਲ ਕੇ, ਮੈਂ ਸੁਆਮੀ ਦਾ ਆਰਾਧਨ ਕੀਤਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting with the Guru, I contemplate God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਨੋਂ ਨੇ ਗੁਰੋਂ ਸਾਥ ਮਿਲ ਕੇ ਪ੍ਰਭੂ ਕੋ ਯਾਦ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! (ਜਿਸ ਮਨੁੱਖ ਨੇ) ਗੁਰੂ ਨੂੰ ਮਿਲ ਕੇ ਪਰਮਾਤਮਾ ਨੂੰ ਯਾਦ ਕਰਨਾ ਸ਼ੁਰੂ ਕਰ ਦਿੱਤਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਮਿਲਿ = ਗੁਰੂ ਨੂੰ ਮਿਲ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Encontrando al Guru,"