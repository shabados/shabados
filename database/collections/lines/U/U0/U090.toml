[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਆਵੈ ਜਾਇ ਭਵਾਈਐ; ਭਵਜਲੁ ਅੰਦਰਿ ਹੋਇ ਖੁਆਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Such a creature entangled in the cycle of the transmigration goes on suffering disgrace in the world-ocean."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਆਵਣ ਜਾਣ ਵਿਚ ਭਵਾਈਦਾ ਹੈ, ਸੰਸਾਰ ਸਮੁੰਦਰ ਵਿਚ ਸਦਾ ਭਸ ਖਰਾਬੀ ਰਹਿੰਦੀ ਹੈ।"