[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਅਪਰਾਧੀ; ਗਤਿ. ਨਹੀ ਕਾਈ ॥"
page = 1031
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the sinner, obtains not salvation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਪਾਪੀ ਨੂੰ ਮੁਕਤੀ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "such a sinner does not obtain salvation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਪਰਾਧੀ ਜੀਵ! ਤਿਸ ਅਸਥਾਨ ਮੇਂ ਤੇਰੀ ਕੋਈ ਸੁਭ ਗਤੀ ਨਹੀਂ ਹੋਵੇਗੀ, ਭਾਵ ਮੰਦ ਗਤੀ ਹੋਵੇਗੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ (ਵਿਚਾਰੇ) ਮੰਦ-ਕਰਮੀ ਦਾ ਭੈੜਾ ਹਾਲ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਤਿ = ਹਾਲਤ, ਦਸ਼ਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y mira, no hay nadie que lo pueda liberar, nadie que lo pueda redimir."