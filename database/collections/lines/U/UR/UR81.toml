[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬੁਲੇ ਬਿਪ ਜਗਯੰ ਤਜਯੋ ਏਕ ਬਾਜੰ ॥"
page = 276

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On that side the boys were brought up and on this side Ram, the king of Avadh called the Brahmins and performed a Yajna"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸ੍ਰੀ ਰਾਮ) ਨੇ ਯੱਗ ਲਈ ਬ੍ਰਾਹਮਣ ਬੁਲਾਏ ਅਤੇ ਇਕ ਘੋੜਾ ਛੱਡ ਦਿੱਤਾ।"