[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਉ ਭਾਉ ਸਭੁ ਤਿਸ ਦਾ; ਸੋ ਸਚੁ ਵਰਤੈ ਸੰਸਾਰਿ ॥੯॥"
page = 788
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Fear and love all belong to Him. He, the True Lord is pervading the Universe."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਡਰ ਅਤੇ ਪ੍ਰੇਮ ਸਭ ਉਸ ਦੀ ਮਲਕੀਅਤ ਹਨ। ਉਹ ਸੱਚਾ ਸਾਹਿਬ ਆਲਮ ਅੰਦਰ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Fear and love all belong to Him; He is the True Lord, permeating and pervading the Universe. ||9||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭੈ ਔ ਪ੍ਰੇਮ ਹਰੀ ਹੈ ਅਰੁ ਸੋ ਸਚੁ ਸਰੂਪੁ ਸੰਸਾਰ ਮੇਂ ਵਰਤਤਾ ਹੈ॥੯ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਡਰ ਤੇ ਪ੍ਰੇਮ ਸਭ ਕੁਝ ਜਿਸ ਪ੍ਰਭੂ ਦਾ (ਬਖ਼ਸ਼ਿਆ ਮਿਲਦਾ) ਹੈ ਉਹ ਆਪ ਜਗਤ ਵਿਚ (ਹਰ ਥਾਂ) ਮੌਜੂਦ ਹੈ ॥੯॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél a Quien uno entrega su Amor y su Temor Reverencial, ese Uno Verdadero prevalece en el mundo entero. (9)"