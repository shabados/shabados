[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਜਨਮੁ ਸਵਾਰਿ, ਦਰਗਹ ਚਲਿਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Spending this life fruitfully gurmukh goes to the other world."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖ ਆਪਣਾ ਜਨਮ ਸਵਾਰ ਕੇ (ਭਾਵ ਸਫਲ ਕਰਕੇ) ਪਰਲੋਕ ਨੂੰ ਪਧਾਰਦੇ ਹਨ। (ਉਥੇ ਜਾਕੇ ਕੀ ਕਰਦੇ ਹਨ)?"