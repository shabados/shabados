[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤ੍ਰਿਤੀਏ ਮਹਿ; ਕਿਛੁ ਭਇਆ ਦੁਤੇੜਾ ॥"
page = 886
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the Treta-age, there was some falling off."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤ੍ਰੇਤੇ ਯੁਗ ਅੰਦਰ ਕੁਝ ਕੁ ਝੜ ਗਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Silver Age of Traytaa Yuga, things began to decline."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤ੍ਰੇਤੇ ਮੇਂ ਕੁਛ ਦੁਤੇੜਾ, ਭਾਵ ਕਛੁ ਝੂਠ ਬੋਲਨੇ ਲਗੇ ਅਰੁ ਕਲੇਸ ਹੋਤਾ ਭ੍ਯਾ ਦੋ ਚਰਨ ਰਹੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਤ੍ਰੇਤੇ ਜੁਗ ਵਿਚ (ਧਰਮ ਦੇ ਅੰਦਰ) ਕੁਝ ਤ੍ਰੇੜ ਆ ਗਈ (ਧਰਮ-ਬਲਦ ਦੀਆਂ ਤਿੰਨ ਲੱਤਾਂ ਰਹਿ ਗਈਆਂ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤ੍ਰਿਤੀਏ ਮਹਿ = ਤ੍ਰੇਤੇ ਜੁਗ ਵਿਚ। ਦੁਤੇੜਾ = ਦੁਫੇੜਾ, ਕਮੀ, ਘਾਟ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero en la Treta Yug empezó a declinar."