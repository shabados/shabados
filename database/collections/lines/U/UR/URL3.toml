[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਾਗੜਦੀ ਲੁਥ ਬਿਥੁਰੀ ਭਾਗੜਦੀ ਭਟ ਘਾਇ ਭਭਕੈ ॥"
page = 240

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The corpses are lying scattered and the blood is gushing out of the bodies of the warriors"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਲੋਥਾਂ ਖਿਲਰੀਆਂ ਪਈਆਂ ਹਨ ਅਤੇ ਸੂਰਮਿਆਂ ਦੇ ਘਾਉ ਭਕ-ਭਕ ਕਰਦੇ ਹਨ,"