[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨ ਕਮਾਇਐ; ਆਪੇ ਬਾਧੇ ॥"
page = 199
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They are bound by their own actions."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਅਮਲਾ ਦੇ ਕਾਰਨ ਉਹ ਆਪ ਹੀ ਬਝ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By their own actions, they are bound and gagged."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਮੰਦਕਰਮ ਕਰਨੇ ਸੇ ਮਰਵਾਹੇ ਆਪ ਹੀ (ਬਾਧੇ) ਨਾਸ ਹੂਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਆਪਣੇ ਕੀਤੇ ਕਰਮਾਂ ਅਨੁਸਾਰ ਜੀਵ ਆਪ ਹੀ (ਮੋਹ ਦੇ ਬੰਧਨਾਂ ਵਿਚ) ਬੱਝੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਪਨ ਕਮਾਇਐ = ਆਪਣੇ ਕੀਤੇ ਕਰਮਾਂ ਅਨੁਸਾਰ। ਆਪੇ = ਆਪ ਹੀ। ਬਾਧੇ = ਬੱਝੇ ਹੋਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Estamos atados por las consecuencias de nuestras propias acciones,"