type = "primary"
data = "ਹਰਿ ਹਰਿ ਕੂਕੇ ॥੭੪੮॥"
page = 278

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sky was filled with dust because of the movement of army, all the soldiers rushed forth from all the four directions and began to remember the name of the Lord.748."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੂੰਹੋਂ ਹਰਿ ਹਰਿ ਬੋਲਦੇ ਹਨ ॥੭੪੮॥"