[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਕਤ. ਬੇਸੁਆ ਪੂਤ; ਨਿਨਾਮ ॥੩॥"
page = 239
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The infidel is nameless like a prostitute's son."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਧਰਮੀ ਕੰਜਰੀ ਦੇ ਪੁੱਤ ਦੀ ਤਰ੍ਹਾਂ ਬੇ-ਨਾਮਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The faithless cynic is nameless, like the prostitute's son. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਕਤ ਬੇਸਵਾ ਕੇ ਪੂਤ ਸਮ ਨਾਮ ਸੇ ਰਹਤ ਹੈਂ। ਭਾਵ ਜੈਸੇ ਤਿਸ ਵੇਸਵਾ ਕੇ ਪੁਤ੍ਰ ਕਾ ਪਿਤਾ ਨਿਹਚੇ ਨਹੀਂ ਹੋ ਸਕਤਾ, ਤੈਸੇ ਤਿਸ ਕਾ ਗੁਰੂ ਪੀਰ ਨਿਹਚੇ ਨਹੀਂ ਹੋ ਸਕਤਾ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਨਾਲੋਂ ਟੁਟੇ ਹੋਏ ਮਨੁੱਖ ਵੇਸਵਾ ਇਸਤ੍ਰੀਆਂ ਦੇ ਪੁੱਤਰਾਂ ਵਾਂਗ (ਨਿਲੱਜ) ਹੋ ਜਾਂਦੇ ਹਨ ਜਿਨ੍ਹਾਂ ਦੇ ਪਿਉ ਦਾ ਨਾਮ ਨਹੀਂ ਦੱਸਿਆ ਜਾ ਸਕਦਾ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਕਤ = ਪਰਮਾਤਮਾ ਨਾਲੋਂ ਟੁਟੇ ਹੋਏ ਮਨੁੱਖ। ਨਿਨਾਮ = ਜਿਨ੍ਹਾਂ ਦੇ ਪਿਉ ਦਾ ਨਾਮ ਨਹੀਂ ਦੱਸਿਆ ਜਾ ਸਕਦਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin la Meditación, el amante de Maya está sin padre, como el hijo de una ramera.  (3)"