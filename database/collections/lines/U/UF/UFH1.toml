[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਮਨੁ ਜੀਤ ਸਕਾ ਨਹੀਂ ਕਾਹੂ ॥੫੮॥"
page = 59

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They cannot go to heavens with the movement of the hands, because they could not control their minds in any way. 58."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦ ਤਕ ਕੋਈ ਮਨ ਉਤੇ ਜਿਤ ਪ੍ਰਾਪਤ ਨਹੀਂ ਕਰ ਸਕਦਾ ॥੫੮॥"