[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏ ਸੂਤੇ; ਅਪਣੈ ਅਹੰਕਾਰੀ ॥੧॥"
page = 1128
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "they all are asleep in their self-conceit and"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਾਰੇ ਆਪਣੀ ਸਵੈ-ਹੰਗਤਾ ਅੰਦਰ ਸੁੱਤੇ ਪਏ ਹਨ ਤੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- they are all asleep in egotism. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹ ਸਭੀ ਅਪਣੇ ਅਹੰਕਾਰੋਂ ਵਿਖੇ ਸੋਏ ਹੂਏ ਹੈਂ; ਵਾ ਏਹ ਸਭ ਹੰਕਾਰੀ ਸ੍ਵੈ ਸਰੂਪ ਸੇ ਭੂਲੇ ਹੂਏ ਮੋਹ ਨਿੰਦ੍ਰਾ ਮੇਂ ਵਾ ਅਗ੍ਯਾਨ ਨਿੰਦ੍ਰਾ ਕਰ ਸੋ ਰਹੇ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਾਰੇ ਆਪੋ ਆਪਣੇ (ਕਿਸੇ) ਅਹੰਕਾਰ ਵਿਚ (ਪੈ ਕੇ ਪ੍ਰਭੂ ਦੀ ਯਾਦ ਵਲੋਂ) ਗ਼ਾਫ਼ਿਲ ਹੋਏ ਰਹਿੰਦੇ ਹਨ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏ = {ਬਹੁ-ਵਚਨ} ਇਹ ਸਾਰੇ। ਸੂਤੇ = ਸੁੱਤੇ ਹੋਏ ਹਨ। ਅਪਣੈ ਅਹੰਕਾਰੀ = ਅਪਣੈ ਅਹੰਕਾਰਿ, ਆਪੋ ਆਪਣੇ ਅਹੰਕਾਰ ਵਿਚ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "todos estos están dormidos debido a su ego, están todos ellos dormidos,(1)"