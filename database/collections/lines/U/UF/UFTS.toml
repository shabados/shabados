[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰੋਹ ਹੋਇ ਚਲਾਈ, ਰਾਕਸਿ ਰਾਇ ਨੂੰ ॥"
page = 123

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Having been infuriated, she struck it on the king of the demons."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਦੇਵੀ ਨੇ) ਗੁੱਸੇ ਵਿਚ ਆ ਕੇ ਰਾਖਸ਼ ਰਾਜੇ (ਧੂਮ੍ਰ-ਨੈਨ) ਉਤੇ ਤਲਵਾਰ ਚਲਾ ਦਿੱਤੀ।"