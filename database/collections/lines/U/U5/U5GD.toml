[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਨਦੀਆ ਨਾਲੇ ਵਾਹੜੇ; ਮਿਲਿ ਗੰਗ ਗੰਗੋਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Rivers, streams and brooks after joining the Ganges are known by the name of Ganges."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਨਦੀਆਂ, ਨਾਲੇ ਤੇ ਨਿੱਕੇ ਨਾਲੇ ਗੰਗਾ ਨਾਲ ਮਿਲਕੇ ਗੰਗਾ ਹੋ ਜਾਂਦੇ ਹਨ।"