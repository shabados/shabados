[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਹਿਬੁ ਸੇਵਕੁ ਇਕੁ; ਇਕੁ ਦ੍ਰਿਸਟਾਇਆ ॥"
page = 524
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Master and the Serf then become one and seem not separate from each other."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਲਕ ਤੇ ਨੌਕਰ ਤਦ ਇਕੋ ਹੀ ਹੋ ਜਾਂਦੇ ਹਨ ਅਤੇ ਇਕ ਦੂਸਰੇ ਨੂੰ ਵੱਖਰਾ ਮਾਲੂਮ ਨਹੀਂ ਹੁੰਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Master and the servant have become one, with no sense of separation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਸਾਹਿਬ ਔਰ ਸੇਵਕ ਏਕ ਹੀ ਏਕ ਦਿਖਲਾਈ ਪੜਤਾ ਹੈ ਅਰਥਾਤ ਦੋਨੋਂ ਅਭਿੰਨ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਅਵਸਥਾ ਵਿਚ ਅੱਪੜਿਆ ਹੋਇਆ) ਸੇਵਕ ਤੇ ਮਾਲਕ-ਪ੍ਰਭੂ ਇਕ-ਰੂਪ ਨਜ਼ਰੀਂ ਆਉਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦ੍ਰਿਸਟਾਇਆ = ਨਜ਼ਰੀਂ ਆਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, el Sirviente y el Maestro se vuelven Uno, y no aparecen separados"