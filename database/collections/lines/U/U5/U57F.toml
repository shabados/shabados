[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਾ ਜਨੁ; ਕਾਰ ਕਮਾਵੈ ਕੋਈ ॥"
page = 161
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Very few perfect persons perform this deed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਹੀ ਥੋੜੇ ਪਵਿੱਤ੍ਰ ਪੁਰਸ਼ ਇਸ ਕੰਮ ਨੂੰ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Very few are those perfect ones who do this good deed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਤਿਸ ਸੇਵਾ ਰੂਪੀ ਕਾਰ ਕੋ ਕੋਈ ਪੂਰਾ ਪੁਰਸ ਹੀ ਕਮਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਪੂਰਨ ਮਨੁੱਖ ਹੀ ਗੁਰੂ ਦੀ ਦੱਸੀ ਕਾਰ (ਪੂਰੀ ਸ਼ਰਧਾ ਨਾਲ) ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero es el ser perfecto quien realiza esta acción."