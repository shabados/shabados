[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਬ੍ਰਾਹਮਣੁ; ਜੋ ਬ੍ਰਹਮੁ ਬੀਚਾਰੈ ॥"
page = 662
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone is a Brahman, who reflects upon the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਓਹੀ ਬ੍ਰਾਹਮਣ ਹੈ, ਜੋ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is a Brahmin, who contemplates God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮਣ ਸੋਈ ਸ੍ਰੇਸ਼ਟ ਹੈ, ਜੋ ਬ੍ਰਹਮ ਕਾ ਬੀਚਾਰ ਕਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਾਹਮਣ ਉਹ ਹੈ ਜੋ ਸਰਬ-ਵਿਆਪਕ ਪ੍ਰਭੂ ਵਿਚ ਸੁਰਤਿ ਜੋੜਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬ੍ਰਹਮੁ = ਪਰਮਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo será Brahmán aquél que medite en Brama,"