[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਬਹੂ ਰਾਜਾ ਛਤ੍ਰਪਤਿ; ਕਬਹੂ ਭੇਖਾਰੀ ॥੨॥"
page = 326
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sometimes I became a King, the Lord of throne and sometimes a beggar."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਦੇ ਮੈਂ ਤਖਤ ਦਾ ਸੁਆਮੀ, ਪਾਤਸ਼ਾਹ ਬਣਿਆਂ ਤੇ ਕਦੇ ਮੰਗਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sometimes I was a king, sitting on the throne, and sometimes I was a beggar. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਬੀ ਚਕ੍ਰਵਰਤੀ ਰਾਜਾ ਹੂਏ ਕਭੀ ਭਿਖ੍ਯਾ ਮਾਂਗਨੇ ਵਾਲੇ ਹੂਏ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਦੇ ਛਤ੍ਰਪਤੀ ਰਾਜੇ ਬਣੇ ਕਦੇ ਮੰਗਤੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "también fui un rey y me senté en un trono, y también fui pordiosero.(2)"