[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹੋਇ ਨਿਮਾਣਾ ਢਹਿ ਪਵੈ; ਦਰਗਹ ਮਾਣੁ ਨਿਮਾਣਾ ਪਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He should fall on the feet (of Lord) in humility because only the humble are honoured in the court of the Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਨਿਮਾਣਾ ਹੋਕੇ (ਗੁਰਮੁਖ) ਡਿੱਗ ਪੈਂਦਾ ਹੈ (ਫਲ ਇਹ ਕਿ) ਦਰਗਾਹ ਵਿਖੇ (ਉਹ) ਨਿਮਾਣਾ ਆਦਰ ਪਾਉਂਦਾ ਹੈ।"