[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਜਨਮ ਭ੍ਰਮੇ ਜੋਨਿ ਮਾਹਿ ॥"
page = 1192
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "For many births, the mortal wandered in the existences."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਜਨਮ, ਪ੍ਰਾਣੀ ਜੂਨੀਆਂ ਅੰਦਰ ਭਟਕਦਾ ਰਿਹਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mortal wanders in reincarnation through countless lifetimes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੀਵ ਅਨੇਕ ਹੀ ਜਨਮ ਜੋਨੀਓਂ ਮੇਂ ਭ੍ਰਮੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਅਨੇਕਾਂ ਜੂਨਾਂ ਅਨੇਕਾਂ ਜਨਮਾਂ ਵਿਚ ਭਟਕਦੇ ਫਿਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭ੍ਰਮੇ = ਭਟਕਦੇ ਹਨ। ਮਾਹਿ = ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He vagado por millones de nacimientos, pero sin meditar en el Señor,"