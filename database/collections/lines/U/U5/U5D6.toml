[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁਨੋ ਰਾਇ, ਇਕ ਤ੍ਰਿਯਾ ਸੁਭ; ਤਾਹਿ ਬੁਲਾਇਯੈ ॥"
page = 851

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Listen, my Raja, a female is very auspicious,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਜਨ! ਸੁਣੋ; ਇਕ ਬਹੁਤ ਚੰਗੀ ਇਸਤਰੀ ਹੈ, ਉਸ ਨੂੰ ਬੁਲਾਓ।"