[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜੀਅ ਸਭੇ ਪ੍ਰਤਿਪਾਲਦਾ; ਘਟਿ ਘਟਿ ਰਮਈਆ ਸੋਇ ॥"
page = 81
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Venerable God nurtures one and all. In every heart is that Omnipresent Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਜਯ ਵਾਹਿਗੁਰੂ ਸਾਰਿਆਂ ਦੀ ਪਾਲਣਾ-ਪੋਸਣਾ ਕਰਦਾ ਹੈ। ਹਰ ਦਿਲ ਅੰਦਰ ਉਹ ਸਰਬ-ਵਿਆਪਕ ਸੁਆਮੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord cherishes all beings. He permeates each and every heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਸਭੀ ਜੀਵੋਂ ਕੀ ਪ੍ਰਤਿਪਾਲਾ ਕਰਤਾ ਹੈ, ਔਰ ਸਰਬ ਸਰੀਰੋਂ ਮੇਂ ਸੋ ਹਰੀ ਬ੍ਯਾਪਕ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਹਰੀ ਸਾਰੇ ਜੀਵਾਂ ਦੀ ਪਾਲਣਾ ਕਰਦਾ ਹੈ, ਤੇ ਉਹ ਸੋਹਣਾ ਰਾਮ ਹਰੇਕ ਸਰੀਰ ਵਿਚ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el Soporte de todo y prevalece en los corazones y por todas partes"