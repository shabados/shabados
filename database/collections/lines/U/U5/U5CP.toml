type = "primary"
data = "ਤਾ ਕੋ ਕਾਲ ਨ ਕਬਹੂੰ ਦਲਹੀ ॥੨੩॥"
page = 904

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘They proceed on the way of Satnam and the demons of death do not trouble them.’(23)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕਾਲ ਕਦੇ ਨਾਸ਼ ਨਹੀਂ ਕਰਦਾ ॥੨੩॥"