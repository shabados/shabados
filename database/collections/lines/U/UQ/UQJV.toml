data = "ਨਾਮ ਤੁਪਕ ਕੇ ਸਕਲ ਬਿਚਾਰੋ ॥੭੧੦॥"
page = 751

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Uttering firstly the word “Phal”, then the word “Naayak” and then saying the word “Prashthani”, all the names of Tupak are comprehended.710."

