[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੂਪਤਿ ਮਾਨਹੁ ਸੀਸਨ ਕੀ; ਸਭ ਸੂਰਨ ਹੂੰ ਕੀ ਜਗਾਤਿ ਲਈ ਹੈ ॥੧੮੬੧॥"
page = 483

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He destroyed the army of Krishna and scattered it on the earth, it appeared that the king had realized the tax of their heads from the warriors.1861."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇੰਜ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ) ਮਾਨੋ ਰਾਜੇ ਨੇ ਸਾਰਿਆਂ ਸੂਰਮਿਆਂ ਤੋਂ ਸਿਰਾਂ ਦੇ ਰੂਪ ਵਿਚ ਕਰ ਵਸੂਲ ਕੀਤਾ ਹੋਵੇ ॥੧੮੬੧॥"