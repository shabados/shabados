[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੇ ਘਰ; ਹਮ ਬਹੁਤੁ ਬਸਾਏ ॥"
page = 326
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I had occupied many such homes,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਐਹੋ ਜੇਹਿਆਂ ਬਹੁਤਿਆਂ ਗ੍ਰਿਹਾਂ ਅੰਦਰ ਨਿਵਾਸ ਕੀਤਾ ਸੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I lived in many such homes, O Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਐਸੇ ਘਰ ਹਮਨੇ ਬਹੁਤ ਬਸਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਮ! ਅਸੀਂ ਇਹੋ ਜਿਹੇ ਕਈ ਸਰੀਰਾਂ ਵਿਚੋਂ ਦੀ ਲੰਘ ਕੇ ਆਏ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਸਾਏ = ਵਸਾਏ, ਆਬਾਦ ਕੀਤੇ। ਘਰ = (ਭਾਵ) ਜੂਨਾਂ, ਸਰੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He vivido a través de muchas vidas,"