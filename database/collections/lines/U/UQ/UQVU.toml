[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੇਲ ਕਰਹਿ; ਸੰਤ ਹਰਿ ਲੋਗ ॥"
page = 888
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There the saints, God's people play with their Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਬੰਦੇ ਸਾਧੂ ਓਥੇ ਆਪਣੇ ਸੁਆਮੀ ਨਾਲ ਖੇਡਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Saintly people play there with the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜੋ ਹਰੀ ਕੇ ਲੋਗ ਹੈਂ, ਸੋ ਅਨੰਦ ਕੀ ਲੀਲਾ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਸਾਧ ਸੰਗਤਿ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਪ੍ਰਭੂ ਦੇ ਸੰਤ-ਜਨ (ਉਸ ਅਵਸਥਾ ਵਿਚ ਪਹੁੰਚ ਕੇ) ਆਤਮਕ ਆਨੰਦ ਮਾਣਦੇ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੇਲ = ਆਤਮਕ ਆਨੰਦ, ਕਲੋਲ। ਕੇਲ ਕਰਹਿ = ਆਤਮਕ ਆਨੰਦ ਮਾਣਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahí los Santos se divierten con su Señor"