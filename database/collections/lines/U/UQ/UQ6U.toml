[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਬੀਨੀ, ਨ ਬੀਨਾਯਗੀ, ਹਰ ਦੁ ਗੋਸ਼ ॥੧੪॥"
page = 1398

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Neither he can smell and see, nor can hear from both the ears.(14)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਾਸ ਨਾ ਨਕ ਹੈ, ਨਾ ਨਜ਼ਰ ਹੈ ਅਤੇ ਨਾ ਹੀ ਦੋ ਕੰਨ ਹਨ ॥੧੪॥"