[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੂਜਰੀ ਮਹਲਾ ੫ ਘਰੁ ੪ ਦੁਪਦੇ ॥"
page = 502
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Gujri 5th Guru. Dupade."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੂਜ਼ਰੀ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ। ਦੁਪਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Goojaree, Fifth Mehl, Fourth House, Dho-Padhay:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਗੂਜਰੀ, ਘਰ ੪ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਦੋ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Guyeri, Mejl Guru Aryan, Quinto Canal Divino, Du-Padas."