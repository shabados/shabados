[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਟੋਡੀ ਮਹਲਾ ੫ ਘਰੁ ੪ ਦੁਪਦੇ ॥"
page = 715
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Todi 5th Guru. Dupadas."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਟੋਡੀ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ। ਦੁਪਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Todee, Fifth Mehl, Fourth House, Dho-Padhay:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਟੋਡੀ, ਘਰ ੪ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਦੋ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todi, Mejl Guru Aryan, Quinto Canal Divino, Du-Padas."