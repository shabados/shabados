[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਹਿ ਅਨੰਦੁ; ਸਚਾ ਮਨਿ ਸੋਇ ॥"
page = 8
line = 5

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਅਨਪੁਰਖ ਬਹੁਵਚਨ ਕਿਰਿਆ"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They make merry, That True Lord is in their hearts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੌਜਾਂ ਮਾਣਦੇ ਹਨ। ਉਹ ਸੱਚਾ ਸੁਆਮੀ ਉਨ੍ਹਾਂ ਦੇ ਦਿਲਾਂ ਅੰਦਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They celebrate; their minds are imbued with the True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਸਚਾ ਅਕਾਲ ਪੁਰਖੁ ਤਿਨ ਕੇ ਮਨ ਮੇ ਵਸਤਾ ਹੈ, ਤਾਂ ਤੇ ਅਨੰਦ ਕਾ ਭੋਗੁਨਾਂ ਕਰਤੇ ਹੈਂ। ਭਾਵ ਏਹ ਕਿ ਤਹਾਂ ਫਿਰ ਦੁਖ ਕਲੇਸੁ ਨਹੀ ਰਹਿਤਾ ਹੈ। ਸਤਚਿਤਾਨੰਦ ਮੇ ਸਤਚਿਤਾਨੰਦ ਹੂਏ ਹੂਏ ਵਿਚਰਤੇ ਹੈਂ॥☬ਪ੍ਰਸ਼ਨ: ਜਿਸ ਕੀ ਉਪਾਸਕ ਉਪਾਸਨਾਂ ਕਰਤੇ ਹੈਂ, ਸੋ ਨਿਰੰਕਾਰੁ ਕਹਾਂ ਰਹਿਤਾ ਹੈ?☬ਉੱਤਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਦਾ ਖਿੜੇ ਰਹਿੰਦੇ ਹਨ, (ਕਿਉਂਕਿ) ਉਹ ਸੱਚਾ ਅਕਾਲ ਪੁਰਖ ਉਹਨਾਂ ਦੇ ਮਨ ਵਿਚ (ਮੌਜੂਦ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਹਿ ਅਨੰਦ = ਅਨੰਦ ਕਰਦੇ ਹਨ, ਸਦਾ ਖਿੜੇ ਰਹਿੰਦੇ ਹਨ। ਸਚਾ ਸੋਇ = ਉਹ ਸੱਚਾ ਹਰੀ। ਮਨਿ = (ਉਹਨਾਂ ਦੇ) ਮਨ ਵਿਚ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "celebrando, conservan sus mentes imbuidas en el Señor Verdadero."