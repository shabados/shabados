[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਰਾਖਹੁ; ਕ੍ਰਿਪਾ ਧਾਰਿ ॥"
page = 233
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord God, show mercy and deliver me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੈ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ! ਰਹਿਮ ਕਰੋ ਤੇ ਮੈਨੂੰ ਬਚਾ ਲਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord, please shower Your Mercy upon me, and save me!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੇ ਕਰਨੇ ਵਾਲੇ ਹਰੀ! ਮੇਰੇ ਕੋ ਅਪਨੀ ਕ੍ਰਿਪਾ ਧਾਰ ਕਰ ਰਾਖੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਹੇ ਹਰੀ! ਮਿਹਰ ਕਰ, (ਮੈਨੂੰ ਮਾਇਆ ਦੇ ਪੰਜੇ ਤੋਂ) ਬਚਾ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ = ਹੇ ਰਹੀ! ਧਾਰਿ = ਧਾਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sálvame, oh Señor Bondadoso,"