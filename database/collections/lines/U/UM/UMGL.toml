[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਧ੍ਰਿਗੁ ਜੀਵਣੁ, ਬੇਮੁਖ ਬੇਤਾਲੇ ॥੨੦॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Is opposed to Guru and the life of such an imbalanced person is opprobrious."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਐਸੇ) ਬੇਮੁਖਾਂ ਬੇਤਾਲਿਆਂ ਦਾ ਜੀਉਣਾ ਧ੍ਰਿਗ ਹੈ।"