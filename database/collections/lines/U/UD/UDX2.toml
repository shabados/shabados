[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਡ੍ਰਯੋ ਜਗ ਥੰਭੰ ਕਰਿਯੋ ਹੋਮ ਕੁੰਡੰ ॥"
page = 144

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The columns of the sacrificial place were fixed and the sacrificial altar was constructed."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਫਿਰ) ਯੱਗ ਦਾ ਖੰਭਾ ਗਡ ਦਿੱਤਾ ਅਤੇ ਯੱਗ-ਕੁੰਡ ਬਣਾ ਲਿਆ।"