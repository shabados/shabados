[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਏਵੈ ਜਾਣੀਐ; ਸਭੁ ਕਿਛੁ ਤਿਸੈ ਰਜਾਇ ॥੨॥"
page = 1091
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, know thou like this, that all that happens is in His will."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਤੂੰ ਐਸ ਤਰ੍ਹਾਂ ਜਾਣ ਲੈ ਕਿ ਜਹਿੜਾ ਕੁਝ ਭੀ ਹੁੰਦਾ ਹੈ, ਉਹ ਸਾਰਾ ਉਸ ਦੇ ਭਾਣੇ ਅੰਦਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, know this well; all that happens is according to His Will. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਇਸ ਪ੍ਰਕਾਰ ਜਾਣੀਤਾ ਹੈ ਸਭ ਕਿਛੁ ਤਿਸੀ ਕੀ (ਰਜਾਇ) ਆਗ੍ਯਾ ਮੇਂ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਹੁਕਮ ਵਿਚ ਤੁਰਿਆਂ ਹੀ ਇਹ ਸਮਝ ਪੈਂਦੀ ਹੈ ਕਿ ਸਭ ਕੁਝ ਪ੍ਰਭੂ ਦੀ ਰਜ਼ਾ ਵਿਚ ਹੋ ਰਿਹਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਵੈ = ਇਸੇ ਤਰ੍ਹਾਂ ਹੀ, (ਭਾਵ,) ਹੁਕਮ ਮੰਨਣ ਨਾਲ ਹੀ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, tenemos que entender que todo lo que sucede es por la Voluntad de Dios. (2)"