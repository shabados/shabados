data = "ਨਾਮ ਚੀਨ ਤੁਪਕ ਕੋ ਲੀਜੈ ॥੬੭੩॥"
page = 748

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The names of Tupak can be thought out by uttering the words “Kaashth-Prashthani” and then adding the words “Bhoomij-Prashthani”, the names of Tupak can be recognized.673."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਨਾਮ ਤੁਪਕ ਦੇ ਸਮਝ ਲਵੋ ॥੬੭੩॥"