[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਜਨਾ ਕੀ ਕਥਾ. ਨ ਭਾਵੈ; ਓਇ ਡੂਬੇ ਸਣੁ ਪਰਵਾਰੀ ॥੫॥"
page = 507
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The gospel of the saintly persons they love not and they get drowned along with their family."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸਰੂਪ ਪੁਰਸ਼ਾਂ ਦੀ ਗਿਆਨ ਗੋਸ਼ਟ ਨੂੰ ਉਹ ਪਿਆਰ ਨਹੀਂ ਕਰਦੇ। ਉਹ ਆਪਣੇ ਟੱਬਰ ਕਬੀਲੇ ਸਮੇਤ ਡੁੱਬ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They do not love the sermon of the humble Saints, and they are drowned along with their families. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੋ ਸੰਤ ਜਨੋਂ ਕੀ ਕਥਾ ਅਛੀ ਨਹੀਂ ਲਗਤੀ ਹੈ, ਵਹੁ ਸਾਰੇ ਪ੍ਰਵਾਰ ਕੇ ਸਹਿਤ ਡੂਬ ਗਏ ਹੈਂ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ ਬੰਦਿਆਂ ਨੂੰ) ਸੰਤ ਜਨਾਂ ਦੀ (ਕੀਤੀ ਹੋਈ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ) ਗੱਲ ਨਹੀਂ ਸੁਖਾਂਦੀ (ਇਸ ਵਾਸਤੇ) ਉਹ ਆਪਣੇ ਪਰਵਾਰ ਸਮੇਤ (ਵਿਕਾਰ-ਭਰੇ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਵਿਚ) ਡੁੱਬ ਜਾਂਦੇ ਹਨ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਭਾਵੈ = ਚੰਗੀ ਨਹੀਂ ਲੱਗਦੀ। ਓਇ = {ਲਫ਼ਜ਼ 'ਓਹ' ਤੋਂ ਬਹੁ-ਵਚਨ}। ਸਣੁ = ਸਮੇਤ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No aman el mensaje de los Santos y son ahogados con todos los suyos. (5)"