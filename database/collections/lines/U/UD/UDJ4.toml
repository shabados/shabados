[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਮਹਿਮਾ; ਜਾ ਕੀ ਨਿਰਮਲ ਹੰਸ ॥"
page = 1156
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whose pure praise is sung by millions of swan-souls."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਪਵਿੱਤਰ ਜੱਸ ਕ੍ਰੋੜਾ ਹੀ ਰਾਜਹੰਸ ਰੂਹਾਂ ਗਾਉਂਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Millions of swan-souls sing His Immaculate Praises."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜ ਪ੍ਰਕਾਰ ਕੀ ਜੋ ਤੇਰੀ ਮਹਿਮਾ ਸੂਰਜ ਵਤ ਨਿਰਮਲ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹ ਸਾਡਾ ਗੋਬਿੰਦ ਐਸਾ ਹੈ) ਕਿ ਕ੍ਰੋੜਾਂ ਹੀ ਪਵਿੱਤਰ ਜੀਵਨ ਵਾਲੇ ਜੀਵ ਉਸ ਦੀ ਮਹਿਮਾ ਕਰ ਰਹੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਮਲ ਹੰਸ = ਪਵਿੱਤਰ ਜੀਵਨ ਵਾਲੇ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél Cuyas Alabanzas son cantadas por millones de Almas graciosas,"