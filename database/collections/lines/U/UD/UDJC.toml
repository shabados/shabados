[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਬਚਲੁ ਰਾਜੁ, ਹੋਆ ਸਣਖਤਾ ॥੧੯॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The kingdom of knowledgeable (Guru Arjan Dev) is immutable."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਅਰਜਨ ਜੀ ਦਾ) ਰਾਜ ਅਬਚਲ ਹੈ ਅਰ ('ਸਣਖੱਤਾ') ਸ੍ਰੇਸ਼ਟ ਹੈ।"