[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਨਹੁ ਇੰਦ੍ਰ ਕੇ ਆਗਮ ਤੇ; ਡਰ ਭੂ ਧਰ ਕੈ ਧਰਿ ਪੰਖ ਪਧਾਰੇ ॥੧੧੧੨॥"
page = 408

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The poet says that that spectacle appeared to him like the mountains growing wings were flying away, realizing the approach of god Indra.1112."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਇੰਦਰ ਦੇ ਆਉਣ ਦੇ ਡਰ ਕਰ ਕੇ ਪਰਬਤ ਖੰਭ ਲਾ ਕੇ ਉਡ ਗਏ ਹੋਣ ॥੧੧੧੨॥"