[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰੂਪ ਰੰਗ ਨ ਜਾਤਿ ਪਾਤਿ; ਸੁ ਜਾਨਈ ਕਿਂਹ ਜੇਬ ॥"
page = 5
line = 7

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਜ਼ੇਬ = ਸੁੰਦਰਤਾ, ਆਭਾ।"

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "How to know Thee when thou art Formless, Colourless, Casteless and without lineage?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਦਾ) ਰੂਪ, ਰੰਗ, ਜਾਤਿ-ਪਾਤਿ ਪਤਾ ਨਹੀਂ ਕਿਹੋ ਜਿਹਾ ਹੈ;"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਰੂਪ ਰੰਗ ਨ ਜਾਤਿ ਪਾਤਿ; ਸੁ ਜਾਨਈ ਕਿਹ ਜੇਬ ॥"