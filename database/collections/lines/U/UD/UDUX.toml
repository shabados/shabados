[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਮਝ ਲੇਹੁ ਸਾਧੂ ਸਭ ਮਨ ਮੰ ॥"
page = 58

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I have taken birth of this purpose, the saints should comprehend this in their minds."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਧੂ ਪੁਰਸ਼ੋ! ਇਸ ਨੂੰ ਚੰਗੀ ਤਰ੍ਹਾਂ ਮਨ ਵਿਚ ਸਮਝ ਲਵੋ।"