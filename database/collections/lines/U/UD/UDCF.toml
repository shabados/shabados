[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਰਮਤ ਭਰਮਤ; ਮਹਾ ਦੁਖੁ ਪਾਇਆ ॥"
page = 898
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In roaming and rambling, thou has suffered great anguish,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਟਕਣ ਅਤੇ ਭੌਣ ਅੰਦਰ ਤੂੰ ਭਾਰੀ ਕਸ਼ਟ ਉਠਾਇਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wandering and roaming around, you suffer terrible pain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋਨੀਓਂ ਮੇਂ ਭ੍ਰਮਤਿਆਂ ਭ੍ਰਮਤਿਆਂ ਬਡਾ ਦੁਖੁ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਭਟਕਦਿਆਂ ਭਟਕਦਿਆਂ ਇਸ ਨੇ ਬੜਾ ਕਸ਼ਟ ਪਾਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਰਮਤ = ਭਟਕਦਿਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no vives satisfecho y tu mente vaga y sufre llena de un inmenso dolor,"