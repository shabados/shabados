[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਵਸਿ ਹੈ ਸਗਲ ਸੰਸਾਰੁ ॥"
page = 1001
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, in whose sway is the entire universe;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਇਖ਼ਤਿਆਰ ਵਿੱਚ ਹੈ ਸਮੂਹ ਆਲਮ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The entire universe is under His control."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਵਸ ਮੇਂ ਸਭ ਸੰਸਾਰੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਵਿਚ ਸਾਰਾ ਜਗਤ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੈ ਵਸਿ = ਜਿਸ ਦੇ ਵੱਸ ਵਿਚ। ਸਗਲ = ਸਾਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Dios controla el mundo entero,"