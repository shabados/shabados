[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਮਨੋਰਥ ਪੂਰਨ ਹੋਏ; ਕਦੇ. ਨ ਹੋਇ ਦੁਖਾਲਾ ਜੀਉ ॥੪॥੩੩॥੪੦॥"
page = 106
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All his heart's desires are fulfilled and he shall never more be distressed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਦਿਲ ਦੀਆਂ ਖਾਹਿਸ਼ਾਂ ਸਾਰੀਆਂ ਪੂਰੀਆਂ ਹੋ ਗਈਆਂ ਹਨ ਅਤੇ ਉਹ ਮੁੜ ਕੇ ਕਦਾਚਿੱਤ ਦੁਖੀ ਨਹੀਂ ਹੋਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All my hopes and desires are fulfilled; I shall never again suffer sorrow. ||4||33||40||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਸੰਪੂਰਨ ਮਨ ਕੇ ਮਨੋਰਥ ਪੂਰੇ ਹੂਏ ਹੈਂ, ਔਰ ਕਭੀ ਭੀ ਹਮਾਰਾ ਚਿਤ ਦੁਖ ਵਾਲਾ ਵਾ ਦੁਖ ਕਾ ਘਰੁ ਨਹੀਂ ਹੋਤਾ ਹੈ॥੪॥੩੩॥੪੦॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀਆਂ ਸਾਰੀਆਂ ਲੋੜਾਂ ਪੂਰੀਆਂ ਹੋ ਜਾਂਦੀਆਂ ਹਨ, ਉਹ ਕਦੇ ਦੁਖੀ ਨਹੀਂ ਹੁੰਦਾ ॥੪॥੩੩॥੪੦॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲ = ਸਾਰੇ। ਦੁਖਾਲਾ = {ਦੁਖ-ਆਲਯ} ਦੁਖੀ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos sus deseos están satisfechos, y nunca más estará triste. (4-33-40)"