data = "ਦੁਰਬਲ ਹੁਤੇ ਪੁਸਟ ਹ੍ਵੈ ਗਏ ॥"
page = 905

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(On the other side) The disciples were getting very happy, and the weaklings were getting plump."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਦੁਰਬਲ ਹੁੰਦੇ ਸਨ, (ਹੁਣ) ਤਕੜੇ ਹੋ ਗਏ ਹਨ।"