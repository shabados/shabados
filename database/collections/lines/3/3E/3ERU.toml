[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਿ; ਹਰਿ ਹਰਿ ਜਪਨੁ ਕਰੇ ॥"
page = 82
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul! repeat thou the Name of God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ! ਤੂੰ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਣ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mind, chant the Name of the Lord, Har, Har."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਪ੍ਯਾਰੇ! ਮਨ ਕਰ ਕੇ ਹਰਿ ਹਰਿ ਨਾਮ ਕੋ ਜਪਨਾ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੀ) ਜਿੰਦੇ! ਮਨ ਵਿਚ ਹਰੀ ਪਰਮਾਤਮਾ ਦਾ ਜਾਪ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਕਰੇ = ਕਰਿ, ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, medita en el Señor."