[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈ ਛਡਿਆ ਸਭੋ ਧੰਧੜਾ ॥"
page = 73
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have abandoned all mine avocations."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੀ ਸਾਰੇ ਕਾਰ-ਵਿਹਾਰ ਤਿਆਗ ਦਿਤੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have forsaken all my entanglements;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਨੇ ਸੰਸਾਰ ਕਾ ਸਭ ਧੰਧਾ ਛੋਡ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਸਿਮਰਨ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਮੈਂ ਦੁਨੀਆ ਵਾਲਾ ਸਾਰਾ ਲਾਲਚ ਛੱਡ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭੋ = ਸਭੁ, ਸਾਰਾ। ਧੰਧੜਾ = ਮਾਇਆ ਵਾਲੀ ਦੌੜ-ਭੱਜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me he desecho de todos mis lazos emocionales"