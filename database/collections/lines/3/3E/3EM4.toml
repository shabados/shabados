[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰੇ ਗੁਰ ਕੈ ਸਬਦਿ ਪਛਾਤਾ ॥"
page = 1060
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is realised through the Perfect Guru's word."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੂਰਨ ਗੁਰਾਂ ਦੀ ਬਾਣੀ ਰਾਹੀਂ ਅਨੁਭਵ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Shabad, the Word of the Perfect Guru, He is realized."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਪੂਰੇ ਗੁਰੋਂ ਕੇ ਉਪਦੇਸ ਕਰ ਤੇਰੇ ਕੋ ਪਛਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ ਤੇਰੇ ਨਾਲ ਜਾਣ-ਪਛਾਣ ਬਣ ਸਕਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਕੈ ਸਬਦਿ = ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a través de la Palabra del Guru Perfecto."