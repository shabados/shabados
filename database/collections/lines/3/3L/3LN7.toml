[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਤਿ ਸਤਿ ਤਿਨ ਕਹਾ; ਹਮ ਸੁਨੇ ਤਰਾਕੇ ਕਾਨ ॥"
page = 864

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(He replied,) ‘It is true i heard the noises too.’"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਕਿਹਾ ਸਚ ਹੈ, ਮੈਂ ਵੀ ਕੰਨਾਂ ਨਾਲ ਤੜਾਕ (ਦੀ ਆਵਾਜ਼) ਸੁਣੀ ਹੈ।"