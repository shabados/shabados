[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੀਤੁ ਸਾਜਨੁ ਸਖਾ; ਪ੍ਰਭੁ ਏਕ ॥"
page = 197
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The One Lord is my Intimate Friend and Comrade."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਸੁਆਮੀ ਹੀ ਮੇਰਾ ਯਾਰ, ਦੌਸਤ ਅਤੇ ਸਾਥੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One God is my Intimate, Best Friend and Companion."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਬਚ ਕ੍ਰਮ ਕਰ ਕੇ ਮਿਤ੍ਰ ਸਾਜਨ ਤਥਾ ਸਖਾਏ ਸਭ ਏਕੁ ਪਰਮੇਸ੍ਵਰ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਉਸ ਮਾਲਕ-ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਹੀ (ਸਾਡੀ ਜ਼ਿੰਦਗੀ ਦਾ) ਸਹਾਰਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਖਾ = ਸਾਥੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, el Uno, es tu Único Amigo"