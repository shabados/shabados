[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੂਖ ਸਹਜ ਆਨੰਦ ਸੁਹੇਲੀ ॥੧॥"
page = 379
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and she then attains celestial peace and joy and is ever comfortable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਹ ਬੈਕੁੰਠੀ ਆਰਾਮ ਤੇ ਖੁਸ਼ੀ ਹਾਂਸਲ ਕਰ ਲੈਂਦੀ ਹੈ ਅਤੇ ਹਮੇਸ਼ਾਂ ਲਈ ਸੁਖੀ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and she attains celestial peace, joy and comfort. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਸਹਜ ਸੁਖ ਰੂਪ ਜੋ ਬ੍ਰਹਮ ਹੈ ਤਿਸ ਕੇ ਅਨੰਦ ਕੋ ਪਾਇ ਕਰ (ਸੁਹੇਲੀ) ਅਤ੍ਯੰਤ ਸੁਖੀ ਭਈ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਅੰਦਰ ਸੁਖ ਆਨੰਦ ਆਤਮਕ ਅਡੋਲਤਾ ਆ ਵੱਸਦੇ ਹਨ ਉਸ ਦਾ ਜੀਵਨ ਸੁਖੀ ਹੋ ਜਾਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜ = ਆਤਮਕ ਅਡੋਲਤਾ। ਸੁਹੇਲੀ = ਸੁਖੀ, ਸੁਖ-ਭਰੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así está siempre en Equilibrio Dichoso y en la Tranquilidad del Éxtasis. (1)"