[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਕਰਤੈ; ਭਗਤਿ ਕਰਾਈ ॥"
page = 831
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Creator Himself yokes man to His service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿਰਜਣਹਾਰ ਆਪ ਹੀ ਆਪਣੀ ਸੇਵਾ ਵਿੱਚ ਜੋੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator Lord Himself inspires us to His devotional worship."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਸੇ ਆਪ ਹੀ ਕਰਤਾ ਪੁਰਖ ਨੇ ਅਪਨੀ ਭਗਤੀ ਕਰਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਜੀਵ ਦੇ ਭੀ ਕੀਹ ਵੱਸ?) ਪਰਮਾਤਮਾ ਆਪ ਹੀ ਆਪਣੀ ਭਗਤੀ (ਜੀਵਾਂ ਪਾਸੋਂ) ਕਰਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਤੈ = ਕਰਤਾਰ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor nos permite alabar Su Ser"