[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਤੁਰਾਈ. ਨ ਪਾਇਆ ਕਿਨੈ; ਤੂ ਸੁਣਿ ਮੰਨ ਮੇਰਿਆ ॥"
page = 918
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By cleverness no one has obtained God, hearken thou, O my soul!"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚਲਾਕੀ ਦੁਆਰਾ ਕਿਸੇ ਨੂੰ ਵਾਹਿਗੁਰੂ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੋਇਆ ਤੂੰ ਕੰਨ ਕਰ ਹੇ ਮੇਰੀ ਜਿੰਦੇ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through cleverness, no one has found Him; listen, O my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰਿਆ ਮਨ! ਤੂੰ ਸੁਣੁ ਚਤੁਰਾਈ ਕਰ ਕੇ ਕਿਸੀ ਨੇ ਨਹੀਂ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ (ਧਿਆਨ ਨਾਲ) ਸੁਣ ਲੈ ਕਿ ਕਿਸੇ ਜੀਵ ਨੇ ਭੀ ਚਤੁਰਾਈ ਨਾਲ (ਪਰਮਾਤਮਾ ਦੇ ਮਿਲਾਪ ਦਾ ਆਨੰਦ) ਪ੍ਰਾਪਤ ਨਹੀਂ ਕੀਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਨ ਮੇਰਿਆ = ਹੇ ਮੇਰੇ ਮਨ! {ਲਫ਼ਜ਼ 'ਮੰਨ' ਦੀ (ੰ) ਇਕ ਮਾਤ੍ਰਾ ਵਧਾਣ ਵਾਸਤੇ ਹੀ ਹੈ, ਅਸਲ ਲਫ਼ਜ਼ 'ਮਨ' ਹੀ ਹੈ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "al Señor por medio de astucias."