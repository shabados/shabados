[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਜਾਤਾ; ਤਿਸ ਕੀ ਇਹ ਰਹਤ ॥"
page = 294
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This is the way of life if him who knows the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਉਸ ਦੀ ਜੀਵਨ ਰਹੁ-ਰੀਤੀ ਹੈ ਜੋ ਪ੍ਰਭੂ ਨੂੰ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is the way of life of one who knows God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਵਾਹਿਗੁਰੂ ਕੋ ਜਾਣਿਆ ਹੈ, ਤਿਸੀ ਕੀ ਏਹ (ਰਹਤ) ਧਾਰਨਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਜਿਸ ਸੰਤ ਜਨ ਨੇ (ਪ੍ਰਭੂ ਨੂੰ) ਜਾਣ ਲਿਆ ਹੈ ਉਸ ਦੀ ਰਹਿਣੀ ਹੀ ਇਹ ਹੋ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਸਾਧੂ) ਨੇ। ਰਹਤ = ਰਹਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Santos hablan solamente Verdades Eternas;"