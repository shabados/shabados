data = "ਬਬਾੜੇ ਬੀਰੰ ਹਾਬੀਰੰ ॥"
page = 212

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The thundering musical instruments were played in the war and the brave soldiers roared."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੂਰਮਿਆਂ ਨੂੰ ਮਾਰਨ ਵਾਲੇ ਸੂਰਮੇ ਲਲਕਾਰ ਰਹੇ ਸਨ।"