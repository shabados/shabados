[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਜਨ ਊਪਰਿ. ਤੇਰੀ ਕਿਰਪਾ; ਤਿਸ ਕਉ. ਬਿਪੁ ਨ ਕੋਊ ਭਾਖੈ ॥੨॥"
page = 383
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The man, on whom is Thy grace, him no suffering can swallow."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਇਨਸਾਨ ਤੇ ਤੇਰੀ ਰਹਿਮਤ ਹੈ, ਉਸ ਨੂੰ ਕੋਈ ਤਕਲੀਫ ਨਿਗਲ ਨਹੀਂ ਸਕਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That humble being, upon whom You bestow Your Grace, is not touched by slander or suffering. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾਸੁ ਕੇ ਊਪਰ ਤੇਰੀ ਕ੍ਰਿਪਾ ਹੈ ਤਿਸ ਕੋ (ਬਿਪੁ) ਬਿਪਰਜੈ ਬਚਨ ਕੋਈ ਨਹੀਂ ਕਹਤਾ ਹੈ ਵਾ ਤਿਸ ਕੋ ਕੋਈ ਬਿਪਤਾ ਨਹੀਂ ਭਖ੍ਯਨ ਕਰਤੀ ਹੈ, ਭਾਵ ਸੰਤ ਜਨ ਸੁਖੁ ਦੁਖ ਮੇਂ ਸਮਾਨ ਰਹਤੇ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਉਤੇ ਤੇਰੀ (ਮੇਹਰ ਦੀ) ਨਜ਼ਰ ਹੋਵੇ ਉਸ ਨੂੰ ਕੋਈ ਮਨੁੱਖ ਮੰਦਾ ਬਚਨ ਨਹੀਂ ਆਖਦਾ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਬਿਪੁ = {विप्रेय} ਮੰਦਾ ਬਚਨ। ਭਾਖੈ = ਆਖਦਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "se vuelve un auténtico Gurmukj. (2)"