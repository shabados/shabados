[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਉ ਗੁਰਦੇਉ; ਤ ਬੈਕੁੰਠ ਤਰੈ ॥"
page = 1166
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Guru-God is Merciful, then one swims over to the Lord's realm."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਗੁਰੂ-ਪ੍ਰਮੇਸ਼ਰ ਮਿਹਰਬਾਨ ਹੁੰਦੇ ਹਨ ਤਦ ਜੀਵ ਬ੍ਰਹਮ ਲੋਕ ਨੂੰ ਤਰ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By the Grace of the Divine Guru, one swims across to heaven."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਗੁਰ ਕ੍ਰਿਪਾਲ ਹੋਵੈ, ਤੌ ਨਰਕ ਤੇ ਤਰ ਕਰ ਬੈਕੁੰਠ ਮੇਂ ਪ੍ਰਾਪਤਿ ਹੋਵੇ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਗੁਰੂ ਮਿਲ ਪਏ ਤਾਂ (ਇੱਥੋਂ) ਤਰ ਕੇ ਬੈਕੁੰਠ ਵਿਚ ਜਾ ਅੱਪੜਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el Guru nos muestra su Compasión, uno es transportado hasta los Cielos de Dios."