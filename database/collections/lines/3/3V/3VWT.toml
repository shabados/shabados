[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਸਰਣਾਈ ਸਦਾ ਰਹੁ; ਦੂਖੁ ਨ ਵਿਆਪੈ ਕੋਇ ॥੧॥ ਰਹਾਉ ॥"
page = 47
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever remain under Lord's protection and no affliction shall overtake thee. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਦੀਵ ਹੀ ਸੁਆਮੀ ਦੀ ਪਨਾਹ ਵਿੱਚ ਵਿਚਰ ਅਤੇ ਤੈਨੂੰ ਕੋਈ ਅਪਦਾ ਨਹੀਂ ਵਾਪਰੇਗੀ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remain in God's Sanctuary forever, and no suffering shall afflict you. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਐਸੇ ਪ੍ਰਭੂ ਕੇ (ਸਰਣਾਈ) ਆਸਰੇ ਸਦਾ ਰਹੁ, ਤੇਰੇ ਕੋ ਕੋਈ ਦੁਖ ਨਹੀਂ ਬਿਆਪੇਗਾ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਦਾ ਪਰਮਾਤਮਾ ਦੀ ਸਰਨ ਪਿਆ ਰਹੁ। ਕੋਈ ਭੀ ਦੁੱਖ ਤੇਰੇ ਉੱਤੇ ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕੇਗਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਵਿਆਪੈ = ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕਦਾ॥੧॥ਰਹਾਉ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Busca el Santuario de tu Señor para que no tengas más sufrimientos. (1-Pausa)"