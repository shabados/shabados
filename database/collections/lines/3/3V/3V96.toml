[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਿਆਰਹ ਰੁਦ੍ਰਨਿ ਕੇ ਅਗਨੰ ਗਨ; ਮਾਰਿ ਲਏ ਹਰਿ ਲੋਕਿ ਸਿਧਾਰੇ ॥"
page = 465

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Killing innumerable ganas of eleven Rudras, he despatched them to the next world"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਗਿਆਰਾਂ ਰੁਦਰਾਂ ਦੇ ਅਣਗਿਣਤ ਗਣ ਮਾਰ ਦਿੱਤੇ ਹਨ (ਅਤੇ ਉਹ) ਸ਼ਿਵ ਲੋਕ ਨੂੰ ਚਲੇ ਗਏ ਹਨ।"