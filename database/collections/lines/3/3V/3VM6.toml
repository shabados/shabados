[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਣ ਕਾਰਣ ਸਮਰਥੁ ਹੈ; ਕਹੁ ਨਾਨਕ ਬੀਚਾਰਿ ॥"
page = 148
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Potent to do all the works is the Lord. After deep deliberation Nanak says this."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਕੰਮ ਨੇਪਰੇ ਚਾੜ੍ਹਨ ਦੇ ਯੋਗ ਹੈ ਸੁਆਮੀ। ਗੂੜ੍ਹੀ ਸੋਚ ਵਿਚਾਰ ਮਗਰੋਂ ਨਾਨਕ ਇਹ ਆਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is the All-powerful Cause of causes, says Nanak after deep deliberation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜੋ (ਕਾਰਣ) ਮਾਯਾ ਮਹਤਵਾਦਿਕ ਜਗਤ ਕੇ ਕਾਰਣ ਹੈਂ, ਵਾ (ਕਾਰਣ) ਜਗਤ ਤਿਸ ਕੇ ਕਰਣ ਕੇ ਜੋ ਸਾਮਰਥ ਹੈਂ ਤਿਸ ਕਾ ਵੀਚਾਰ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜੋ ਪ੍ਰਭੂ ਜਗਤ ਦਾ ਮੂਲ ਸਭ ਕੁਝ ਕਰਨ-ਜੋਗ ਹੈ, ਉਸ ਦਾ ਧਿਆਨ ਧਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਣ = ਜਗਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor tiene el Poder de realizar lo que sea, y así lo ha entendido Nanak después de una profunda deliberación."