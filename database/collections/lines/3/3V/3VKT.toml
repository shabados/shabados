[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਿ ਏਕ ਪ੍ਰਭੂ, ਅਨੇਕ ਰਵਿਆ; ਸਰਬ ਮੰਡਲਿ ਛਾਇਆ ॥"
page = 782
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remember thou the one Lord, who is contained in the Myriads of beings and is pervading the whole universe."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਇਕ ਸਾਈਂ ਦਾ ਆਰਾਧਨ ਕਰ, ਜੋ ਕ੍ਰੋੜਾਂ ਹੀ ਜੀਵਾਂ ਅੰਦਰ ਰਮਿਆ ਹੋਇਆ ਹੈ ਅਤੇ ਸਾਰੇ ਆਲਮ ਵਿੱਚ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chant, and meditate on the One God, who permeates and pervades the many beings of the whole Universe."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਪ੍ਰਭੂ ਕੋ ਜਪਿਆ ਹੈ, ਜੋ ਅਨੇਕ ਨਾਮ ਰੂਪ ਮੇਂ ਰਵਿਆ ਹੂਆ ਹੈ, ਅਰ ਜਿਸ ਕਾ ਜਸ ਸਰਬ (ਮੰਗਲ) ਦੇਸੋਂ ਮੇਂ ਛਾਇਆ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਹੇਲੀਓ! ਉਹ ਇੱਕ ਪਰਮਾਤਮਾ ਅਨੇਕਾਂ ਵਿਚ ਵਿਆਪਕ ਹੈ, ਸਾਰੇ ਜਗਤ ਵਿਚ ਵਿਆਪਕ ਹੈ, ਇਹ ਸਾਰਾ ਜਗਤ-ਖਿਲਾਰਾ ਪ੍ਰਭੂ ਆਪ ਹੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਪਿ = ਜਪ ਕੇ। ਰਵਿਆ = ਵਿਆਪਕ, ਮੌਜੂਦ। ਮੰਡਲਿ = ਮੰਡਲ ਵਿਚ, ਜਗਤ ਵਿਚ। ਛਾਇਆ = ਵਿਆਪਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Véanlo esparcido en todo, véanlo compenetrando el Universo entero."