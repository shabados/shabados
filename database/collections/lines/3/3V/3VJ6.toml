[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਸਰੀ. ਤਿਆਸ ਬਿਡਾਨੀ ॥੧॥"
page = 1119
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have forgotten other thirsts now."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਹੁਣ ਹੋਰ ਤਰੇਹਾਂ (ਪਿਆਸਾਂ) ਭੁਲ ਗਈਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have forgotten other thirsts. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬੇਗਾਨੀ ਪ੍ਯਾਸ ਅਰਥਾਤ ਇਛਾ ਬਿਸਰ ਗਈ ਹੈ॥੧॥☬ਜੇ ਕਹੇ ਕੈਸੇ ਨਿਬ੍ਰਿਤ ਭਈ? ਸੋ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਹੋਰ ਹੋਰ ਪਾਸੇ ਦੀ ਪਿਆਸ ਭੁੱਲ ਜਾਂਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਆਸ = ਤ੍ਰਿਹ, ਪਿਆਸ। ਬਿਡਾਨੀ = ਬਿਗਾਨੀ, ਹੋਰ ਹੋਰ ਪਾਸੇ ਦੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, no hay nada más que ella añore. (1)"