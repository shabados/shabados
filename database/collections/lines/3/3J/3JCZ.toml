[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੰਮਿ ਨ ਆਵੈ, ਭਾਂਡਾ ਭੰਨਾ ॥੧੧॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Like a broken pot, it is of no use."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਭੰਨੇ ਹੋਏ ਭਾਂਡੇ (ਵਾਂਙੂੰ) ਕੰਮ ਨਹੀਂ ਆਉਂਦਾ।"