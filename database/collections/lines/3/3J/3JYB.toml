[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਨੋ ਮਹਾ ਪ੍ਰਲਏ ਬਹੇ ਪਉਨ; ਸੋ ਆਪਸਿ ਮੈ ਭਿਰ ਹੈ ਗਿਰਿ ਭਾਰੇ ॥੧੪੩॥"
page = 89

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That with blowing of the wind each other.143.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਮਹਾ ਪਰਲੋ ਵੇਲੇ ਹਵਾ ਦੇ ਚਲਣ ਨਾਲ ਵਡੇ ਵਡੇ ਪਹਾੜ ਆਪਸ ਵਿਚ ਟਕਰਾ ਰਹੇ ਹੋਣ ॥੧੪੩॥"