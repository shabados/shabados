[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਇਆ ਕੋਟੁ ਗੜੈ ਮਹਿ ਰਾਜਾ ॥"
page = 1037
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mind king abides in the fortress of the body."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਨ ਪਾਤਿਸ਼ਾਹ ਰਹਿੰਦਾ ਹੈ ਦੇਹ ਦੇ ਮਜ਼ਬੂਤ ਕਿਲ੍ਹੇ ਅੰਦਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the strong fortress of the body with its beautiful doors,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਸਥੂਲ ਦੇਹ ਕੋਟ ਹੈ ਤਿਸ ਮੇਂ ਅੰਤਹਕਰਣ ਗੜੁ ਮੇਂ ਪਰਮਾਤਮ ਰਾਜਾ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਦੇ ਹੁਕਮ ਵਿਚ ਹੀ) ਸਰੀਰ ਕਿਲ੍ਹਾ ਬਣਿਆ ਹੈ, ਇਸ ਕਿਲ੍ਹੇ ਵਿਚ ਆਪ ਹੀ ਰਾਜਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਟੁ = ਕਿਲ੍ਹਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En la fortaleza del cuerpo, habita el rey,"