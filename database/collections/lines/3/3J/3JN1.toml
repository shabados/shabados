type = "primary"
data = "ਮਨੋ ਜੁੱਧ ਖੰਭੰ ਰਣੰ ਭੂਮ ਗਾਡੰ ॥"
page = 69

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There Hussain stood quite alone like the pole of a flagg fixed in the ground."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਰਣ-ਭੂਮੀ ਵਿਚ ਯੁੱਧ ਦਾ ਖੰਭਾ ਗਡਿਆ ਹੋਵੇ।"