[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵਣੁ ਵੰਞਣੁ ਡਾਖੜੋ; ਛੋਡੀ ਕੰਤਿ ਵਿਸਾਰਿ ॥੪॥"
page = 56
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hard is the coming and going of her who is deserted and for gotten by her husband."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਠਨ ਹੈ ਉਸ ਦਾ ਆਉਣਾ ਅਤੇ ਜਾਣਾ, ਜਿਸ ਨੂੰ ਉਸ ਦੇ ਖਸਮ ਨੇ ਤਿਆਗ ਤੇ ਭੁਲਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Coming and going are very difficult for that bride who is abandoned and forgotten by her Husband Lord. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ (ਆਵਣੁ) ਜਨਮ ਔਰ (ਵੰਞਣੁ) ਮਰਣ ਕਰ (ਡਾਖਣੋ) ਦੁਖੀ ਹੋਤੀ ਹੈ, ਔਰ ਕੰਤ ਨੇ ਵਿਸਾਰ ਛੋਡੀ ਹੈ॥੪॥☬ਪ੍ਰਸ਼ਨ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੇ ਵਾਸਤੇ) ਜਨਮ ਮਰਨ ਦਾ ਔਖਾ ਗੇੜ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ ਕਿਉਂਕਿ) ਕੰਤ-ਪ੍ਰਭੂ ਨੇ ਉਸ ਨੂੰ ਭੁਲਾ ਦਿੱਤਾ ਹੁੰਦਾ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਵਣੁ ਵੰਞਣੁ = ਜਨਮ ਮਰਨ (ਦਾ ਗੇੜ)। ਡਾਖੜੋ = ਔਖਾ, ਦੁਖਦਾਈ। ਕੰਤਿ = ਕੰਤ ਨੇ। ਵਿਸਾਰਿ ਛੋਡੀ = ਭੁਲਾ ਦਿੱਤੀ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su Esposo la dejó y sus transmigraciones son muy duras. (4)"