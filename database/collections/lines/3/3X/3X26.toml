[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਆਠ ਪਹਰ ਹਥ ਜੋੜਿ ਕੈ; ਹੋਇ ਹਜੂਰੀ ਖੜਾ ਰਹੰਦਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "All the twenty four hours (eight pahars) with folded hands he stands before his master."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅੱਠੇ ਪਹਿਰ ਹੱਥ ਜੋੜਕੇ ਹਾਜ਼ਰ ਬਾਸ਼ੀ ਹੋਕੇ ਖਲੋਤਾ ਰਹਿੰਦਾ ਹੈ।"