[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਪੁਸਤਕ ਪੋਥਨਿ ਮਾਝ; ਨਿਸੰਕ ਬਖਾਨੀਐ ॥੧੨੪੬॥"
page = 802

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the words “Naaginaahinaa Ishani”, add the words “mathani” at the end and know all the names of Tupak for mentioning them in books.1246."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਦਾ) ਪੁਸਤਕਾਂ ਪੋਥੀਆਂ ਵਿਚ ਖੁਲ੍ਹ ਕੇ ਬਖਾਨ ਕਰੋ ॥੧੨੪੬॥"