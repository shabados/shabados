type = "primary"
data = "ਆਪ ਚਲੇ ਜੂਝਨ ਅਭਿਮਾਨੀ ॥"
page = 115

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The demon-king Sumbh did not accept this proposal and in his pride, marched forward for war."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਅਭਿਮਾਨੀ (ਦੁਰਗਾ ਨਾਲ) ਲੜਨ ਲਈ ਆਪ ਤੁਰ ਪਿਆ।"