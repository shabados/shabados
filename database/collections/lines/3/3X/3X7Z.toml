type = "primary"
data = "ਤਬ ਕਾਲ ਦੇਵ ਰੀਝੇ ਨਿਦਾਨ ॥"
page = 640

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When he practiced Yoga for a long time, Kaldev (the Lord) was pleased with him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਅੰਤ ਵਿਚ ਕਾਲ ਦੇਵ ਉਸ ਉਤੇ ਪ੍ਰਸੰਨ ਹੋਇਆ।"