[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੇ ਦਾ ਸਚਾ ਢੋਆ ॥"
page = 628
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is the support of the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚਾ ਹੈ ਆਸਰਾ ਸੱਚੇ ਸੁਆਮੀ ਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True is the support of the True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ (ਸਚੇ) ਵਾਹਿਗੁਰੂ ਕਾ (ਢੋਆ) ਮਿਲਾਪ ਭੀ ਸਚਾ ਹੈ॥☬ਐਸੇ ਬੇਨਤੀ ਕਰੁ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਮੇਹਰ ਨਾਲ) ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਦੀ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੀ ਸਿਫ਼ਤਿ ਸਾਲਾਹ ਦੀ ਦਾਤਿ ਮਿਲਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੇ ਦਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦਾ। ਸਚਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ। ਢੋਆ = ਤੋਹਫ਼ਾ, ਬਖ਼ਸ਼ਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Verdad es el Refugio del Uno Verdadero."