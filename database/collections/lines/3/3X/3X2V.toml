[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਤਮ ਰਾਮੁ ਸੰਸਾਰਾ ॥"
page = 764
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O the All-pervading soul of the world,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸ਼੍ਰਿਸ਼ਟੀ ਦੀ ਸਰਬ-ਵਿਆਪਕ ਰੂਹ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Supreme Soul of the World,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਐਸੇ ਬੇਨਤੀ ਕਰ: ਹੇ ਰਾਮ ਏਹੁ ਸੰਸਾਰ ਖੇਲ ਤੇਰਾ ਅਪਨਾਂ ਆਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਸੰਸਾਰ ਦੀ ਜਿੰਦ-ਜਾਨ ਹੈਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਤਮ ਰਾਮੁ = ਜਿੰਦ-ਜਾਨ। ਰਾਮੁ = {रमते इति राम } ਸਰਬ-ਵਿਆਪਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Verdad es Tu Obra,"