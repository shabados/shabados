[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭੁ ਜਨਮੁ ਸਫਲਿਉ ਕੀਆ ਕਰਤੈ; ਹਰਿ ਰਾਮ ਨਾਮਿ ਵਖਾਣੀਆ ॥"
page = 576
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord God's Name, I have uttered. The creator has rendered fruitful my entire life."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਮੈਂ ਉਚਾਰਨ ਕੀਤਾ ਹੈ। ਸਿਰਜਣਹਾਰ ਨੇ ਮੇਰਾ ਸਾਰਾ ਜੀਵਨ ਫਲਦਾਇਕ ਬਣਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator has made my life totally fruitful; I chant the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਹਰਿ ਬ੍ਯਾਪਕ ਕਾ ਨਾਮ ਉਚਾਰਨ ਕੀਆ ਹੈ, ਤਿਨ ਕਾ ਜਨਮ ਕਰਤੇ ਪੁਰਸ ਨੇ ਸਫਲ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਰਤਾਰ ਨੇ ਸਾਰਾ ਜਨਮ ਸਫਲ ਕਰ ਦਿੱਤਾ ਹੈ, ਕਿਉਂਕਿ ਉਹ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਿਚ ਲੀਨ ਰਹਿੰਦੀ ਹੈ, ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਉਚਾਰਦੀ ਰਹਿੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਤੈ = ਕਰਤਾਰ ਨੇ। ਨਾਮਿ = ਨਾਮ ਵਿਚ। ਵਖਾਣੀਆ = ਉਚਾਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Creador ha hecho totalmente fructífera mi vida y así entono el Nombre del Señor. El Humilde Sirviente del Señor, pide la limosna"