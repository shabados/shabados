[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਮਨ; ਗੁਰ ਜੇਵਡੁ. ਅਵਰੁ ਨ ਕੋਇ ॥"
page = 49
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My mind, none else is so great as the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਜਿੰਦੜੀਏ! ਗੁਰਾਂ ਜਿੱਡਾ ਵੱਡਾ ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, there is no other as great as the Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਗੁਰੋਂ ਕੇ ਬਰਾਬਰ ਔਰ ਕੋਈ ਬਡਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਗੁਰੂ ਜੇਡਾ ਵੱਡਾ (ਉੱਚ ਜੀਵਨ ਵਾਲਾ ਜਗਤ ਵਿਚ) ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਜੇਵਡੁ = ਜੇਡਾ ਵਡਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, no existe nadie que iguale al Señor."