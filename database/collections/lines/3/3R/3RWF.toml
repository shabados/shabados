[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨ ਭੀਜੈ; ਬਾਹਰਿ ਬੈਠਿਆ ਸੁੰਨਿ ॥"
page = 1237
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sitting outside alone in wilderness, He is softened not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁੰਨਮਸਾਨ ਅੰਦਰ ਬਾਹਰਵਾਰ ਇਕੱਲਿਆਂ ਬਹਿਣ ਨਾਲ, ਉਹ ਦ੍ਰਵਦਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is not won over by living alone in the wilderness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਾਹਰ (ਸੁੰਨਿ) ਉਜਾੜ ਮੇਂ ਬੈਠਣੇ ਸੇ ਨਹੀਂ ਪ੍ਰਸੰਨ ਹੋਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਬਾਹਰ (ਜੰਗਲਾਂ ਵਿਚ) ਸੁੰਨ-ਮੁੰਨ ਬੈਠਿਆਂ ਭੀ ਨਹੀਂ ਪਸੀਜਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁੰਨਿ = ਸੁੰਨ-ਅਵਸਥਾ ਵਿਚ, ਚੁੱਪ-ਚਾਪ ਰਹਿ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tampoco dando regalos y caridades,"