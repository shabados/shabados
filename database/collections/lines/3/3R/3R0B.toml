[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੀ ਭਗਤੀ ਸਚਿ ਰਤੇ; ਦਰਿ ਸਚੈ ਸਚਿਆਰ ॥"
page = 66
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Theirs is the genuine worship they are imbued with Truth and at the True Door they are found true."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੀ ਅਸਲੀ ਉਪਾਸ਼ਨਾ ਹੈ, ਉਹ ਸੱਚ ਨਾਲ ਰੰਗੀਜੇ ਹੋਏ ਹਨ ਅਤੇ ਸਚੇ ਬੂਹੇ ਉਤੇ ਉਹ ਸੱਚੇ ਪਾਏ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through true devotional worship, they are attuned to Truth; at the True Door, they are found to be true."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਿਸਚੇ ਕਰ ਕੇ ਨਿਰਦੰਭ ਭਗਤੀ ਮੇਂ ਰਤੇ ਹੈਂ, ਯਾਂ ਤੇ ਸਚੇ ਵਾਹਿਗੁਰੂ ਕੇ ਦ੍ਵਾਰੇ ਪਰ ਸੋ ਗੁਰਮੁਖਿ ਸਚੇ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ ਦੀ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੀ ਭਗਤੀ ਕਰਦੇ ਹਨ, ਉਹ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ (ਦੇ ਪ੍ਰੇਮ-ਰੰਗ) ਵਿਚ ਰੰਗੇ ਰਹਿੰਦੇ ਹਨ, (ਇਸ ਵਾਸਤੇ ਉਹ) ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ ਸੁਰਖ਼ਰੂ ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਰਿ = ਦਰ ਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mediante la Alabanza Verdadera, ellos se funden en la Verdad y en la Puerta Verdadera son reconocidos Verdaderos."