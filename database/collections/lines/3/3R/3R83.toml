[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਮ੍ਰਿਤੁ; ਗੁਰ ਪਰਸਾਦੀ ਪਾਏ ॥"
page = 118
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Nectar (Name) he receives by the Guru's grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਬਿ-ਹਿਯਾਤ (ਨਾਮ) ਊਹ ਗੁਰਾਂ ਦੀ ਮਿਹਰ ਦੁਆਰਾ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, they receive this Amrit."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਅਮਰਤਾ ਕੋ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਉਸ ਜੀਵਨ-ਦਾਤੇ ਨੂੰ ਮਿਲ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por la Gracia del Guru, reciben el Amrit del Guru y cantan con sus lenguas el Nombre Ambrosial."