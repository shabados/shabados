[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸਤਿਗੁਰ ਵਾਹੁ, ਸਬਦਿ ਸਲਾਹੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Gurmukh eulogises the wondrous Lord in the form."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖ ਸਤਿ ਰੂਪ (ਗੁਰ+ਵਾਹ=) ਵਾਹਿਗੁਰੂ ਸ਼ਬਦ ਨੂੰ ਸਲਾਹੁੰਦੇ ਹਨ।"