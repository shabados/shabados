[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਖ਼ਾਵਤਾਂ ਕਰਕੇ ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ, ਉਹ ਸੁਗਾਤਾਂ ਕਰਕੇ ਯਾਦ ਰਹਿੰਦਾ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਅਮੂਮੁਲ-ਅਤਾਇਆ ਸ਼ਮੂਮਲ ਨਵਾਲ ॥੫੨॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "He is known for his generosities, and is remembered for his unlimited gifts. (52)"