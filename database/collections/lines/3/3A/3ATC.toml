[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਾਖਿ ਬਹਿਨਿ ਤਾ ਸੋ ਲਪਟਾਈ ॥"
page = 1011

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Along with her husband she reached Ganga, and there, calling him sister, embraced him."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਭੈਣ ਕਹਿ ਕੇ ਉਸ (ਮਿਤਰ) ਨਾਲ ਲਿਪਟ ਗਈ।"