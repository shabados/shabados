[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਆ ਕਥੀਐ; ਕਿਛੁ ਕਥਨੁ. ਨ ਜਾਈ ॥"
page = 822
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What should I say, I can say not anything."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕੀ ਆਖਾਂ, ਮੈਂ ਕੁਝ ਆਖ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What can I say? I cannot say anything."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਆ ਕਥਨ ਕਰੀਏ ਤੇਰਾ ਸਰੂਪ ਬਾਣੀ ਕਰ ਕਛ ਕਥਨ ਕਰਿਆ ਨਹੀਂ ਜਾਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਪਰਮਾਤਮਾ ਕਿਹੋ ਜਿਹਾ ਹੈ?-ਇਹ ਗੱਲ) ਕੀਹ ਦੱਸੀਏ? ਦੱਸੀ ਨਹੀਂ ਜਾ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਆ ਕਥੀਐ = ਕੀਹ ਦੱਸੀਏ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Qué puedo decir yo? Nada en verdad,"