[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਰੇ; ਸਤਿਗੁਰੁ ਸੇਵਿ ਸਮਾਇ ॥"
page = 1276
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man, be thou absorbed in the True Guru's service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੰਦੇ! ਤੂੰ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਟਹਿਲ-ਸੇਵਾ ਅੰਦਰ ਲੀਨ ਹੋ ਜਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mortal, immerse yourself in service to the True Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਸਤਿਗੁਰੋਂ ਕੀ ਸੇਵਾ ਮੇਂ ਸਮਾਵਣਾ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਮਨ! ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ (ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਿਚ) ਲੀਨ ਹੋਇਆ ਰਹੁ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵਿ = ਸਰਨ ਪੈ ਕੇ। ਸਮਾਇ = (ਹਰਿ-ਨਾਮ ਵਿਚ) ਲੀਨ ਹੋਇਆ ਰਹੁ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, mortal, fúndete en el Servicio del Guru Verdadero."