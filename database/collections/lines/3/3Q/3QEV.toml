[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਗੁਰ ਕਉ; ਹਉ ਸਦ ਬਲਿ ਜਾਈ ॥"
page = 1339
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am ever a sacrifice unto the Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹਮੇਸ਼ਾਂ ਉਨ੍ਹਾਂ ਗੁਰਾਂ ਉਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am forever a sacrifice to the Guru;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸਤਿਗੁਰ ਪਰ ਮੈਂ ਸਦਾ ਬਲਿਹਾਰੀ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਸ ਗੁਰੂ ਤੋਂ ਸਦਾ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਹਉਂ, ਮੈਂ। ਸਦ = ਸਦਾ। ਬਲਿ ਜਾਈ = ਬਲਿ ਜਾਈਂ, ਮੈਂ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi ser en sacrificio al Guru,"