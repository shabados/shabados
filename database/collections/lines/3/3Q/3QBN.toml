data = "ਨੈਨ ਨਚਾਇ ਬਜਾਵਤ ਤਾਰੀ ॥੧੬੧॥"
page = 216

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The energetic women began to sing and reveal their joy by dancing their eyes and clapping their hands.161."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਨੈਣਾਂ ਨੂੰ ਮਟਕਾ ਕੇ ਹੱਥਾਂ ਦੀ ਤਾੜੀ ਵਜਾ ਰਹੀਆਂ ਸਨ ॥੧੬੧॥"