data = "ਜਿਹ ਸਤ੍ਰ ਮਿਤ੍ਰ, ਨਹਿ ਜਨਮ ਜਾਤ ॥"
page = 29

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art that Ultimate Reality which is without enemy friend birth and caste !"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਉਹ ਹੈਂ) ਜਿਸ ਦਾ ਕੋਈ ਵੈਰੀ, ਮਿਤਰ, ਜਨਮ, ਜਾਤਿ ਨਹੀਂ ਹੈ,"