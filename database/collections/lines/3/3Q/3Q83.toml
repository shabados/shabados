[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਪ੍ਰਭ ਤੇ; ਸਗਲੀ ਉਤਪਤਿ ॥"
page = 294
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "From that Lord has originated the entire creation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਸੁਆਮੀ ਤੋਂ ਸਮੂਹ ਰਚਨਾ ਉਤਪੰਨ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The entire creation came from God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਤਿਸ ਪ੍ਰਭੂ ਸੇ ਹੀ ਸਭ ਕੀ ਉਤਪਤੀ ਭਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ ਉਸ ਪ੍ਰਭੂ ਤੋਂ ਹੋਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਤਪਤਿ = ਪੈਦਾਇਸ਼, ਸ੍ਰਿਸ਼ਟੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ya que todo lo existente ha nacido de Él."