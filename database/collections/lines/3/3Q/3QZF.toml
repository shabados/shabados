[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭੁ ਨਾਰਾਇਣੁ; ਗਰਬ ਪ੍ਰਹਾਰੀ ॥"
page = 224
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The pervading Lord Master is the destroyer of pride."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਆਪਕ ਮਾਲਕ ਪਰਮਾਤਮਾ ਹੰਕਾਰ ਨੂੰ ਨਾਸ ਕਰਣਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God, the Lord of all, is the Destroyer of pride."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨਾਰਾਇਣ ਜੋ ਗਰਬ ਕੇ ਨਾਸ ਕਰਨੇ ਵਾਲੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਨਾਰਾਇਣ ਪ੍ਰਭੂ ਆਪ ਹੀ (ਅਹੰਕਾਰੀਆਂ ਦਾ) ਅਹੰਕਾਰ ਦੂਰ ਕਰਨ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਹਾਰੀ = ਨਾਸ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Señor en la forma de hombre león mató su ego,"