[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਵਨ ਬੇਗ ਰਥ ਚਲਤ ਭ੍ਰਮਨ; ਬਘੂਲਾ ਲਖਿ ਲਜਿਤ ॥"
page = 693

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "His chariot moving with the speed of wind, causes the deer to feel shy"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਦਾ) ਰਥ ਹਵਾ ਦੇ ਵੇਗ ਵਾਂਗ ਚਲਦਾ ਹੈ, (ਜਿਸ ਨੂੰ) ਭ੍ਰਮਦਿਆਂ ਵੇਖ ਕੇ ਵਾ-ਵਰੋਲਾ ਵੀ ਲਜਿਤ ਹੁੰਦਾ ਹੈ।"