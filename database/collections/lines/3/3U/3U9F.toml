[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਸੰਗਿ ਰਾਤੇ; ਮਤਿ ਊਤਮ ਹੋਇ ॥"
page = 201
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Being tinged with the Lord, the intellect is rendered exquisite."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਨਾਲ ਰੰਗੇ ਜਾਣ ਦੁਆਰਾ ਅਕਲ ਸਰੇਸ਼ਟ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who is attuned to the Lord, has the most sublime and exalted intellect."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਸਾਥ ਰਾਤੇ ਕੀ ਮਤਿ ਉਤਮ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਦੀ ਯਾਦ ਵਿਚ ਰੱਤੇ ਰਿਹਾਂ ਮਨੁੱਖ ਦੀ ਅਕਲ ਸੁਅੱਛ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Unión con el Señor el intelecto es iluminado;"