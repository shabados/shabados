[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੀਜੈ ਹਲੇਮੀ; ਚਉਥੈ ਖੈਰੀ ॥"
page = 1084
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "third humility and fourth alms-giving."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੀਜੀ ਨਿਮਰਤ; ਅਤੇ ਚੌਥੀ ਖ਼ੈਰਾਤ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "third, humility, and fourth, giving to charities."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੀਜੀ ਨਿਮਾਜ ਨਿਮ੍ਰਤਾ ਹੈ, ਚੌਥੀ ਇਹ ਹੈ, ਜੋ ਹਾਥ ਸੇ ਖੁਦਾਇ ਕੇ ਨਾਮ ਪਰ ਖੈਰ ਦੇਣਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਿਮਾਜ਼ ਦੇ ਤੀਜੇ ਵਕਤ ਵਿਚ ਤੂੰ ਨਿਮ੍ਰਤਾ ਧਾਰਨ ਕਰੇਂ, ਜੇ ਚੌਥੇ ਵਕਤ ਵਿਚ ਤੂੰ ਸਭ ਦਾ ਭਲਾ ਮੰਗੇਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੀਜੈ = (ਨਿਮਾਜ਼ ਦੇ) ਤੀਜੇ (ਵਕਤ) ਵਿਚ। ਹਲੇਮੀ = ਨਿਮ੍ਰਤਾ। ਚਉਥੈ = ਚੌਥੈ (ਵਕਤ) ਵਿਚ। ਖੈਰੀ = ਸਭ ਦਾ ਭਲਾ ਮੰਗਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "luego la Humildad, después la disposición a la Caridad y por último,"