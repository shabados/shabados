[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈਤਸਰੀ ਮਹਲਾ ੫ ਛੰਤ ਘਰੁ ੧ ॥"
page = 703
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Jaitsri 5th Guru. Chhant."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੈਤਸਰੀ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ। ਛੰਤ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Jaitsree, Fifth Mehl, Chhant, First House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਜੈਤਸਰੀ, ਘਰ ੧ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਛੰਤ' (ਛੰਦ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Yaitsri, Mejl Guru Aryan, Quinto Canal Divino, Chant."