[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੋਸੁ ਨਹੀ; ਕਾਹੂ ਕਉ ਮੀਤਾ ॥"
page = 257
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "None is at fault, O my friend."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਦਾ ਕਸੂਰ ਨਹੀਂ, ਹੈ ਮੇਰੀ ਮਿੱਤ੍ਰ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one is at fault, my friend."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਿਤ੍ਰ! ਕਿਸੀ ਜੀਵ ਕੋ ਕੁਛ ਦੋਸ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਹੇ ਮਿੱਤਰ! ਕਿਸੇ ਜੀਵ ਨੂੰ ਇਹ ਦੋਸ਼ ਭੀ ਨਹੀਂ ਦਿੱਤਾ ਜਾ ਸਕਦਾ (ਕਿ ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਫਸ ਕੇ ਤੂੰ ਦਾਤਾਰ ਨੂੰ ਕਿਉਂ ਵਿਸਾਰ ਰਿਹਾ ਹੈਂ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੀਤਾ = ਹੇ ਮਿੱਤਰ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin embargo, ¿quién es el responsable de esto"