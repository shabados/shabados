[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੀਰਤਿ ਕਰਹਿ ਸੁਆਮੀ; ਤੇਰੈ ਦੁਆਰੇ ॥"
page = 567
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "standing at Thy Gate, have sung Thy praises."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਦਰ ਤੇ ਖਲੋ ਕੇ ਤੇਰਾ ਜੱਸ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord Master, at Your Door."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਹੇ ਸੁਆਮੀ! ਤੇਰੇ ਦ੍ਵਾਰੇ ਪਰ ਪੜੇ ਤੇਰੀ ਕੀਰਤੀ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ, ਹੇ ਸੁਆਮੀ! ਤੇਰੇ ਦਰ ਤੇ ਤੇਰੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀਰਤਿ = ਸਿਫ਼ਤ-ਸਾਲਾਹ। ਤੇਰੈ ਦੁਆਰੇ = ਤੇਰੇ ਦਰ ਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "desde el comienzo de los tiempos."