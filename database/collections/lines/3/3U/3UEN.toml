[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਮਹਿ ਗੁਪਤੁ ਵਰਤਦਾ; ਗੁਰਮੁਖਿ ਪ੍ਰਗਟਾਇਆ ॥"
page = 954
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is Unmanifestly pervading amongst all. It is through the Guru, that he is revealed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਅਦ੍ਰਿਸ਼ਟ ਤੌਰ ਤੇ ਸਾਰਿਆਂ ਅੰਦਰ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ। ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਹੀ ਉਹ ਜਾਹਰ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is hidden, and yet pervading all. He is revealed to the Gurmukh."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਕਰਤਾ ਸਭ ਮੇਂ ਗੁਪਤ ਹੋ ਕੇ ਵਰਤਤਾ ਹੈ, ਗੁਰਮੁਖੋਂ ਕੇ (ਪ੍ਰਗਟਾਇਆ) ਪ੍ਰਗਟ ਹੋ ਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਸਭ ਜੀਵਾਂ ਵਿਚ ਲੁਕਿਆ ਹੋਇਆ ਮੌਜੂਦ ਹੈ, ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਪਰਗਟ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਪਤੁ = ਲੁਕਿਆ ਹੋਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ese Señor trabaja a través de todo invisiblemente, pero se vuelve manifiesto sólo a través del Guru."