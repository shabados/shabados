[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਵੰਞਾ ਕੁਰਬਾਣੁ; ਸਾਈ ਆਪਣੇ ॥"
page = 397
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am a sacrifice to my Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਮਾਲਕ ਉਤੋਂ ਬਲਿਹਾਰਨੇ ਜਾਂਦੀ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to my Lord Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਅਪਨੇ (ਸਾਈ) ਸ੍ਵਾਮੀ ਕੇ ਊਪਰ ਬਲਿਹਾਰ (ਵੰਞਾ) ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਂ! ਮੈਂ ਆਪਣੇ ਖਸਮ-ਪ੍ਰਭੂ ਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦੀ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਮੈਂ। ਵੰਞਾ = ਜਾਂਦੀ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Yo ofrezco mi ser en sacrificio a mi Maestro Sublime;"