[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੂਤ ਉਚਰਿ ਰਿਪੁ ਪੁਨਿ ਉਚਰਿ; ਨਾਮ ਬਾਨ ਲਖਿ ਲੇਹੁ ॥੧੬੫॥"
page = 725

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Adding the word “Ari” at the end of the words “Taalketu and Savita”, Uttering the word “Soot” and then “Ripu”, all the names of Baan are known.165."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਮਗਰੋਂ) 'ਸੂਤ' ਸ਼ਬਦ ਉਚਾਰ ਕੇ ਫਿਰ 'ਰਿਪੁ' ਪਦ ਉਚਾਰੋ। (ਇਹ) ਬਾਣ ਦੇ ਨਾਮ ਸਮਝ ਲਵੋ ॥੧੬੫॥"