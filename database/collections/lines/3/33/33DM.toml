[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਮੰ ਸਰਬ ਬਿਪ੍ਰਾਨ ਕਉ ਜਾਰਿ ਮਾਰਿਓ ॥੩੪॥੨੦੨॥"
page = 144

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And thus all the Brahmins were burnt and killed.34.202."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਸਾਰਿਆਂ ਬ੍ਰਾਹਮਣਾਂ ਨੂੰ ਸਾੜ ਕੇ ਮਾਰ ਦਿੱਤਾ ॥੩੪॥੨੦੨॥"