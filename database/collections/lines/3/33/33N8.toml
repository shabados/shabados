[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਿਜੁ ਮਨ ਕੀ ਕਛੁ ਬਾਤ; ਨ ਤ੍ਰਿਯ ਕੋ ਦੀਜਿਯੈ ॥"
page = 822

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Never let a woman know what is in your mind."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਦੀ ਗੱਲ ਇਸਤਰੀ ਨੂੰ ਕਦੇ ਵੀ ਦਸਣੀ ਨਹੀਂ ਚਾਹੀਦੀ।"