type = "primary"
data = "ਸਰਿਤਨ ਕੀ ਸੈਨਾ ਸੰਗਿ ਲਿਯਾਏ ॥੧੪੮੨॥"
page = 445

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Varuna reached there, assuming the form of a lion and brought with him the army of streams.1482."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਨਦੀਆਂ ਦੀ ਸੈਨਾ ਨਾਲ ਲਿਆਇਆ ॥੧੪੮੨॥"