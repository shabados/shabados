[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਨਾਨਕ. ਤਿਨ ਕਉ ਵਾਰਿਆ; ਜਿਨ ਜਪਿਆ ਸਿਰਜਣਹਾਰੁ ॥੧॥"
page = 302
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Slave Nanak is a sacrifice unto those, who have contemplated over their creator."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੋਲਾ ਨਾਨਕ ਉਨ੍ਹਾਂ ਉਤੋਂ ਬਲਿਹਾਰਨੇ ਜਾਂਦਾ ਹੈ, ਜਿਨ੍ਹਾਂ ਨੇ ਆਪਣੇ ਕਰਤਾਰ ਦਾ ਆਰਾਧਨ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Servant Nanak is a sacrifice to those who have meditated on the Creator Lord. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਨ੍ਹਾਂ ਨੇ ਸਿਰਜਨਹਾਰ ਜਪਿਆ ਹੈ, ਮੈਂ ਤਿਨ ਕੇ ਵਾਰਨੇ ਜਾਤਾ ਹੂੰ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਆਖ) ਹੇ ਨਾਨਕ! ਮੈਂ ਸਦਕੇ ਹਾਂ, ਉਹਨਾਂ ਹਰੀ ਦੇ ਦਾਸਾਂ ਤੋਂ ਜਿਨ੍ਹਾਂ ਨੇ ਸਿਰਜਣਹਾਰ ਨੂੰ ਆਰਾਧਿਆ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਾਰਿਆ = ਸਦਕੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me postro en Reverencia ante el Guru; Nanak ofrece su ser en sacrificio a aquél que contempla al Señor Creador.(1)"