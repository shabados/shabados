[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਧਕਾਰ; ਦੀਪਕ ਪਰਗਾਸੇ ॥"
page = 287
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In Pitch darkness a lamp shines for him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨ੍ਹੇਰ ਘੁੱਪ ਵਿੱਚ ਉਸ ਦੇ ਲਈ ਦੀਵਾ ਰੌਸ਼ਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the pitch darkness, a lamp shines forth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਗਿਆਨ ਰੂਪੀ ਅੰਧਕਾਰ ਕਾ ਵਿਰੋਧੀ ਤਿਸ ਕੇ ਰਿਦੇ ਮੇਂ ਗਿਆਨ ਦੀਪਕ ਪ੍ਰਕਾਸਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਦੇ ਅੰਦਰੋਂ) (ਨਾਮ-ਰੂਪ) ਦੀਵੇ ਦੇ ਨਾਲ (ਅਗਿਆਨਤਾ ਦਾ) ਹਨੇਰਾ (ਹਟ ਕੇ) ਚਾਨਣ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਧਕਾਰ = ਹਨੇਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La oscuridad de su mente es disipada"