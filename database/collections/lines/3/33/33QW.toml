[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤ ਸੋਹਹਿ ਸਦਾ; ਹਰਿ ਪ੍ਰਭ ਦੁਆਰਿ ॥"
page = 1173
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His saints ever look beauteous at the Lord God's door."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਸੰਤ, ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦੇ ਬੂਹੇ ਤੇ ਹਮੇਸ਼ਾਂ ਸੁੰਦਰ ਲਗਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His devotees are forever beauteous at the Door of the Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭਗਤ ਸਦੀਵ ਹਰੀ ਪ੍ਰਭੂ ਕੇ ਦ੍ਵਾਰ ਪਰ ਸੋਭਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੀ ਬੰਦਗੀ ਕਰਨ ਵਾਲੇ ਮਨੁੱਖ ਸਦਾ ਪਰਮਾਤਮਾ ਦੇ ਦਰ ਤੇ ਸੋਭਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਹਹਿ = ਸੋਭਦੇ ਹਨ। ਪ੍ਰਭ ਦੁਆਰਿ = ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Devotos se ven bellos en la Puerta del Señor,"