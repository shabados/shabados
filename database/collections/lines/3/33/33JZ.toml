[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਲਖ ਅਭੇਵੀਐ; ਹਾਂ ॥"
page = 410
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is Unrealizable and Inscrutable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਅਨੁਭਵ-ਰਹਿਤ ਅਤੇ ਭੇਦ-ਰਹਿਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is unknowable and inscrutable."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਅਲਖ ਅਭੇਵ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਸਹੀ-ਸਰੂਪ ਦੱਸਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ ਤੇ ਜਿਸ ਦਾ ਭੇਤ ਪਾਇਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਲਖ = ਜਿਸ ਦਾ ਸਹੀ ਸਰੂਪ ਬਿਆਨ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ। ਅਭੇਵੀਐ = ਅਭੇਵ, ਜਿਸ ਦਾ ਭੇਤ ਨਹੀਂ ਪਾਇਆ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "e Incognoscible, enaltece tu Amor por Él,"