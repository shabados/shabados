[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੁਹੀ ਦੇਵਤੇ ਸੇਸਣੀ ਦਾਨੁ ਵੇਸਾ ॥"
page = 336

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art the power of gods and the vision of the demons"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਦੇਵਤਿਆਂ ਦੇ ਸੁਆਮੀ ਇੰਦਰ ਦੀ ਸ਼ਕਤੀ ਹੈਂ ਅਤੇ ਦਾਨਵਾਂ ਦੇ ਸੁਆਮੀ ਦੀ ਸ਼ਕਤੀ ਹੈਂ।"