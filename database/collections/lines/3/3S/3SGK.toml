[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੁਹੀ ਪ੍ਰਾਤ ਸੰਧ੍ਰਯਾ ਅਰੁਨ ਬਸਤ੍ਰ ਧਾਰੇ ॥"
page = 809

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Adoring red apparels, it is you, and in white clothes you are Usha"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਲਾਲ ਬਸਤ੍ਰ ਧਾਰਨ ਵਾਲੀ ਊਸ਼ਾ ਅਤੇ ਸੰਧਿਆ ਹੈਂ।"