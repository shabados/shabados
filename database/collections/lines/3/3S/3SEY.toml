[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਹਦਿਆ ਉਠਦਿਆ; ਨੀਤਾ ਨੀਤਿ ॥"
page = 350
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "whether sitting or standing and for ever."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੈਠਦਿਆਂ ਅਤੇ ਖਲੋਦਿਆਂ ਤੇ ਸਦਾ ਲਈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and keep up, whether sitting or standing."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬੈਠਤੇ ਉਠਤੇ (ਨੀਤਾ ਨੀਤਿ) ਨਿਤ੍ਯੰਪ੍ਰਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਠਦਿਆਂ ਬੈਠਦਿਆਂ ਸਦਾ ਹਰ ਵੇਲੇ (ਪ੍ਰਭੂ ਦਾ ਡਰ ਮਨ ਵਿਚ ਬਣਿਆ ਰਹੇ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੀਤਾ ਨੀਤ = ਨਿੱਤ ਨਿੱਤ, ਸਦਾ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ya sea sentado o parado, continúa."