[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਿਯ ਤੇ ਜਿਯਤ ਨਿਕਾਰਿਯੈ; ਭੋਜਨ ਭਲੋ ਖਵਾਇ ॥੯॥"
page = 819

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Dainty food to my husband and send him away.’(9)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸੋਚਿਆ ਕਿ ਰਾਜੇ ਨੂੰ) ਚੰਗੀ ਤਰ੍ਹਾਂ ਭੋਜਨ ਕਰਾ ਕੇ ਜੀਉਂਦੇ ਜੀ ਘਰੋਂ ਕਢ ਦੇਣਾ ਚਾਹੀਦਾ ਹੈ ॥੯॥"