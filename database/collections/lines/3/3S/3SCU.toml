[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਜਿ ਅਭਿਮਾਨੁ; ਸੁਖ ਰਲੀਆ ਮਾਨੈ ॥"
page = 793
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Shedding her ego, she enjoys peace and pleasure."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਹੰਗਤਾ ਛੱਡ ਕੇ, ਉਹ ਆਰਾਮ ਤੇ ਅਨੰਦ ਭੋਗਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Renouncing pride, she enjoys peace and pleasure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਭਿਮਾਨੁ ਕੋ ਤ੍ਯਾਗ ਕਰ ਸੁਖ ਪੂਰਬਕ ਖੁਸੀਆਂ ਮਾਣਤੀਆਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਅਹੰਕਾਰ ਛੱਡ ਕੇ (ਪ੍ਰਭੂ-ਚਰਨਾਂ ਵਿਚ ਜੁੜ ਕੇ ਉਸ ਮਿਲਾਪ ਦਾ) ਸੁਖ-ਆਨੰਦ ਮਾਣਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਜਿ = ਛੱਡ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la esposa que hace a un lado su ego y se regocija en Paz con su Señor"