[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨੰਦ ਸੁਨੈ ਜਸੁਧਾ ਤਪਤੈ; ਤਿਹ ਤੇ ਤੁਮ ਕਾਨ੍ਰਹ ਭਏ ਹਰਕਾ ਹੋ ॥"
page = 319

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Nand and Yashoda will listen, then you will feel more inferior with shame"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ ਗੱਲ) ਨੰਦ ਅਤੇ ਜਸੋਧਾ ਸੁਣਨਗੇ (ਤਾਂ) ਕਲਪਣਗੇ, (ਤੂੰ ਕਿਤੇ) ਹਲਕਾ ਹੋ ਗਿਆ ਹੈਂ (ਸੋਚਦਾ ਹੀ ਨਹੀਂ)।"