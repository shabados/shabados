language = "pa"
data = "ਮੈਂ ਤਾਂ ਕੁਝ ਵੀ ਨਹੀਂ, ਇਹ ਸਭ ਕੁਝ ਤੇਰੀ ਹੀ ਬਖ਼ਸ਼ਿਸ਼ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਮਨ ਨੀਅੱਮ ਈਂ ਜੁਮਲਾ ਅਜ਼ ਅਲਤਾਫ਼ਿ ਤੂ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "He is the abundance of blessings and representative of the competent, dexterous and the intelligent. (70)"