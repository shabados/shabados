data = "ਲਗ︀ਯੋ ਆਨ ਤਾ ਕੋ ਰਹ︀ਯੋ ਤਾਹਿ ਗਰਭੰ ॥"
page = 144

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He copulated with her and made her pregnant."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ (ਘੋੜੀ) ਨੂੰ ਆਣ ਲਗਿਆ, (ਜਿਸ ਦੇ ਫਲਸਰੂਪ) ਉਸ ਨੂੰ ਗਰਭ ਹੋ ਗਿਆ।"