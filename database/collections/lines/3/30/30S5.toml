[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੁਮੀ ਕ੍ਰਿਸਨ ਹ੍ਵੈ ਕੰਸ ਕੇਸੀ ਖਪਾਯੋ ॥"
page = 809

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And turning into Krishana terminated Kans, the semi-bestial."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਕ੍ਰਿਸ਼ਨ (ਦਾ ਰੂਪ) ਹੋ ਕੇ ਕੰਸ ਅਤੇ ਕੇਸੀ ਨੂੰ ਨਸ਼ਟ ਕੀਤਾ ਸੀ।"