[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਦਾਸ; ਸਦਾ ਬਲਿਹਾਰ ॥੨॥"
page = 292
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Serf Nanak is ever a sacrifice unto Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਫ਼ਰ ਨਾਨਕ ਹਮੇਸ਼ਾਂ ਉਸ ਉਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Slave Nanak is forever a sacrifice to Him. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹਮ ਸਦਾ ਤਿਸ ਕੇ ਬਲਿਹਾਰਨੇ ਜਾਤੇ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਆਖ, ਪ੍ਰਭੂ ਦੇ) ਸੇਵਕ ਉਸ ਤੋਂ ਸਦਕੇ ਹਨ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Yo como Su humilde Esclavo, Le ofrezco mi vida.  (2)"