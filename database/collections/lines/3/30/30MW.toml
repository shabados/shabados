[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਤਾ ਤੇ ਹਮਰੋ ਚਿਤ; ਤੁਮੈ ਲਖਿ ਅਧਿਕ ਲੁਭਾਯੋ ॥੧੦॥"
page = 1006

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And, consequently my heart has fallen in love with you.’(10)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਲਈ ਤੁਹਾਨੂੰ ਵੇਖ ਕੇ ਮੇਰਾ ਚਿਤ ਬਹੁਤ ਲਲਚਾਇਆ ਹੈ ॥੧੦॥"