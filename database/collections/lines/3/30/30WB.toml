[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਰਿਦ ਜਿਉ ਬਰਸਤ ਰਹੈ; ਜਸੁ ਅੰਕੁਰ ਜਿਹ ਹੋਇ ॥"
page = 723

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That which rains like the cloud and whose creation is “Yash”   though it is not the cloud,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜੋ) ਬਦਲ ਵਾਂਗ ਵਸਦਾ ਰਹਿੰਦਾ ਹੈ ਅਤੇ (ਜਿਸ ਨਾਲ) ਯਸ਼ ਦੀ ਖੇਤੀ ਪੈਦਾ ਹੁੰਦੀ ਹੈ।"