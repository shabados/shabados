[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੂਆ ਡੋਲੈ; ਨਰਕੇ ਪਾਈ ॥"
page = 906
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His mind wanders and he falls into hell."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਮਨ ਭਟਕਦਾ ਹੈ ਤੇ ਦੋਜ਼ਕ ਵਿੱਚ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His mind wavers, and he falls into hell."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਡੋਲਨੇ ਸੇ ਹੀ ਏਹ ਜੀਵ ਨਰਕ ਮੇਂ ਪਾਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨ ਡੋਲਦਾ ਹੀ ਰਹਿੰਦਾ ਹੈ ਤੇ ਜੀਵ ਨਰਕ ਵਿਚ ਹੀ ਪਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਰਕੇ = ਨਰਕ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la mente vaga y cae en la oscuridad de la conciencia,"