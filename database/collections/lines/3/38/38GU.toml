[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਜਾਣੈ; ਸਰਬ ਵੀਚਾਰ ॥"
page = 150
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself understands the mental out-look of all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਖੁਦ ਹੀ ਸਰਿਆਂ ਦੇ ਆਤਮਕ ਨੁਕਤਾ-ਨਿਗਾਹ ਨੂੰ ਸਮਝਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself knows the inner nature of all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਸਰਬ ਕੇ ਵੀਚਾਰ ਕੋ ਆਪ ਹੀ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜੀਵਾਂ ਬਾਰੇ ਵਿਚਾਰਾਂ (ਉਹਨਾਂ ਨੂੰ ਕੀਹ ਕੁਝ ਦੇਣਾ ਹੈ) ਪ੍ਰਭੂ ਆਪ ਹੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਬ ਵੀਚਾਰ = ਸਭ ਜੀਵਾਂ ਬਾਰੇ ਵਿਚਾਰਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Solamente Dios conoce todos los pensamientos."