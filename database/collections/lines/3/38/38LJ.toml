[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੰਗ ਹਲੀ ਹਰਿ ਜੀ ਸਭ ਗ੍ਵਾਰ; ਕਹੀ ਸਭ ਤੀਰ ਸੁਨੋ ਇਹ ਭਈਯਾ ॥"
page = 310

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the gopis went with Krishna and said to him."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਲਰਾਮ ਸਹਿਤ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਨੇ ਸਾਰੇ ਗਵਾਲ ਬਾਲਕਾਂ ਕੋਲ ਕਿਹਾ, ਹੇ ਭਰਾਓ! (ਸਾਰੇ) ਇਹ ਸੁਣ ਲਵੋ।"