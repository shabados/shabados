[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋਗੀ ਹੋਵਾ ਜਗਿ ਭਵਾ; ਘਰਿ ਘਰਿ ਭੀਖਿਆ ਲੇਉ ॥"
page = 1089
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If I become a Yogi and wander through the world, receiving, alms from door to door;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਮੈਂ ਯੋਗੀ ਬਣ ਜਾਵਾਂ ਅਤੇ ਬੂਹੇ ਬੂਹੇ ਤੋਂ ਖ਼ੈਰ ਲੈਂਦਾ ਹੋਇਆ ਸੰਸਾਰ ਦਾ ਰਟਨ ਕਰਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If I were to become a Yogi, and wander around the world, begging from door to door,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਜੋਗੀ ਹੋਵਾਂ ਅਰ ਜਗਤ ਮੇਂ ਭ੍ਰਮਾ ਪੁਨਃ ਘਰ ਘਰ ਸੇ ਭੀਖਿਆ ਲੇਵੋਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਮੈਂ ਜੋਗੀ ਬਣ ਜਾਵਾਂ, ਜਗਤ ਵਿਚ ਭੌਂਦਾ ਫਿਰਾਂ ਤੇ ਘਰ ਘਰ ਤੋਂ (ਨਿਰਾ) ਖੈਰ ਹੀ ਲੈਂਦਾ ਰਹਾਂ"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਰਿ = ਘਰ ਵਿਚ। ਘਰਿ ਘਰਿ = ਹਰੇਕ ਘਰ ਵਿਚ। ਭੀਖਿਆ = ਖੈਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si fuera un Yogui y vagara por el mundo, pidiendo de puerta en puerta,"