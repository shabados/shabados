[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਰਮ ਰਾਇ ਹੈ ਹਰਿ ਕਾ ਕੀਆ; ਹਰਿ ਜਨ ਸੇਵਕ. ਨੇੜਿ ਨ ਆਵੈ ॥"
page = 555
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Righteous Judge is the creation of God and he comes not near the God's serf and servant."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਰਮ-ਰਾਜਾ ਵਾਹਿਗੁਰੂ ਦਾ ਕੀਤਾ ਹੋਇਆ ਹੈ, ਉਹ ਵਾਹਿਗੁਰੂ ਦੇ ਨਫਰ ਤੇ ਨੌਕਰ ਦੇ ਲਾਗੇ ਵੀ ਨਹੀਂ ਲੱਗਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Righteous Judge of Dharma is a creation of the Lord; he does not approach the humble servant of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਹ ਧਰਮ ਰਾਜਾ ਹਰਿ ਕਾ ਕੀਆ ਹੂਆ ਹੈ, ਹਰਿ ਕੇ ਸੇਵਕ ਜਨੋਂ ਕੇ ਨਿਕਟ ਨਹੀਂ ਆਉਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਧਰਮ ਰਾਜ ਭੀ ਜੋ ਪ੍ਰਭੂ ਦਾ ਹੀ ਬਣਾਇਆ ਹੋਇਆ ਹੈ ਤੇ ਉਹ ਪ੍ਰਭੂ ਦੇ ਸੇਵਕ ਦੇ ਨੇੜੇ ਨਹੀਂ ਆਉਂਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dharmaraya, el justiciero, que es también la creación de Dios, no se acerca al Sirviente del Señor. A aquél que ama a su Señor, el"