[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ; ਦੀਜੈ ਪ੍ਰਭ ਦਾਨੁ ॥"
page = 193
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Master, be kind and grant that boon,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਾਲਕ, ਮਿਹਰਬਾਨੀ ਕਰਕੇ ਦਾਤ ਬਖਸ਼,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please grant Your Grace, God, and bestow this gift"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਅਪਨੀ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਯਹ ਦਾਨ ਦੀਜੀਯੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮਿਹਰ ਕਰ ਕੇ ਆਪਣੇ ਨਾਮ ਦੀ  ਦਾਤ ਬਖ਼ਸ਼,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, sé Misericordioso con Nanak y bendícelo"