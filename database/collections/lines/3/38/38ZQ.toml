type = "primary"
data = "ਸਕਲ ਸੁਜਨ ਜਨ ਸੁਨਤੇ ਕਹੋ ॥੧੧੮੧॥"
page = 795

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Sindhuni”, add the word “ardani” afterwards and know all the names of Tupak.1181."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਨੂੰ ਸਾਰੇ ਵਿਦਵਾਨਾਂ ਨੂੰ ਸੁਣਾ ਕੇ ਕਥਨ ਕਰੋ ॥੧੧੮੧॥"