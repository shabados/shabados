[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕਿਰਪਾ ਤੇ; ਗੁਨ ਗਾਇ ਅਪਾਰ ॥"
page = 1235
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the Guru's grace sing thou the praise of the Infinite Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਅਰਾ, ਤੂੰ ਬੇਅੰਤ ਪ੍ਰਭੂ ਦੀ ਮਹਿਮਾ ਗਾਇਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, sing the Glorious Praises of the Infinite Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਕਰ ਤਿਸ (ਅਪਾਰ) ਵਾਹਿਗੁਰੂ ਕੇ ਗੁਨ ਗਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਮਿਹਰ ਨਾਲ ਬੇਅੰਤ ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਗਾ ਕੇ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ, ਦੀ ਰਾਹੀਂ। ਗੁਨ ਅਪਾਰ ਗਾਇ = ਬੇਅੰਤ ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਗਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues es por Su Gracia que puedo cantar la Alabanza Infinita de mi Señor."