data = "ਕਾਢਿ ਕ੍ਰਿਪਾਨ ਪਹੂੰਚਿਯੋ; ਤਬੈ ਤੁਰਤ ਹੀ ਜਾਰ ॥"
page = 879

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He took out his sword and stepped forward."

