[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੇ ਸਿਰਜਣਹਾਰ ਮੁਰਾਰੈ ॥"
page = 1022
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the True Creator, is the enemy of ego."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੱਚਾ ਕਰਤਾਰ, ਹੰਕਾਰ ਦਾ ਵੈਰੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Creator Lord is the Enemy of ego."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਚੇ! (ਮੁਰਾਰੈ) ਪਰਮੇਸੁਰ ਉਤਪਤ ਕਰਨਹਾਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਹੈ, ਸਭ ਜੀਵਾਂ ਦਾ ਪੈਦਾ ਕਰਨ ਵਾਲਾ ਹੈ, ਤੇ ਦੈਂਤਾਂ ਦਾ ਨਾਸ ਕਰਨ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਰਾਰਿ = ਪਰਮਾਤਮਾ {मुर = अरि}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el Verdadero Señor Creador y el Destructor de los malvados."