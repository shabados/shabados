[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਿਨ ਆਨ ਸ੍ਰੀ ਰਘੁਰਾਜ ਕੇ; ਕਪਿਰਾਜ ਪਾਇਨ ਡਾਰਯੋ ॥"
page = 237

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Hanuman brought Sugriva the king of monkeys to fall at the feet of Ram."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਹਨੂਮਾਨ ਨੇ ਸੁਗ੍ਰੀਵ (ਕਪਿਰਾਜ) ਨੂੰ ਲਿਆ ਕੇ ਸ੍ਰੀ ਰਾਮ ਦੇ ਪੈਰਾਂ ਵਿੱਚ ਪਾ ਦਿੱਤਾ।"