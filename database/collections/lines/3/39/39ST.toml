[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਕਬੀਰ; ਸੁਨਹੁ ਰੇ ਗੁਨੀਆ ॥"
page = 325
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir hear me, O virtuous men."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ, ਮੇਰੀ ਗੱਲ ਸੁਣੋ, ਹੇ ਨੇਕ ਬੰਦਿਓ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, listen, O virtuous people:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਭਾਈ ਗੁਨਵਾਨੋਂ! ਸੁਨੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ- ਹੇ ਵਿਚਾਰਨ ਮਨੁੱਖ! ਚੇਤੇ ਰੱਖ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇ ਗੁਨੀਆ = ਹੇ ਵਿਚਾਰਵਾਨ ਮਨੁੱਖ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, escúchenme, oh sabios,"