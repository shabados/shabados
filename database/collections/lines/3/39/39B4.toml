data = "ਕਾਮਕੰਦਲਾ (ਮਾਧਵਾਨਲ ਦੇ) ਬਚਨ ਸੁਣ ਕੇ ਬੇਹੋਸ਼ ਹੋ ਕੇ ਧਰਤੀ ਉਤੇ ਡਿਗ ਪਈ,"