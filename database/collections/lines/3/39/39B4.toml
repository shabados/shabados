data = "ਸੁਨਤ ਬਚਨ ਕਾਮਾ ਤਬੈ; ਭੂਮਿ ਪਰੀ ਮੁਰਛਾਇ ॥"
page = 921

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Hearing the advice, the lady became unconscious and fell flat on the ground,"

