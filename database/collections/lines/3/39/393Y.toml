[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਓਹੁ ਨਿਰਧਨੁ; ਨਾ ਹਮ ਭੂਖੇ ॥"
page = 391
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is not poor, nor am I hungry."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਗਰੀਬ ਨਹੀਂ, ਨਾਂ ਹੀ ਮੈਂ ਭੁੱਖਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is not poor, so I do not hunger."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾ ਵਹੁ ਨਿਰਧਨ ਹੈ ਨਾ ਹਮ ਹੀ ਭੂਖੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ ਕੰਗਾਲ ਨਹੀਂ ਹੈ, ਅਸੀਂ ਭੀ ਆਪਣੇ ਆਪ ਨੂੰ ਭੁੱਖੇ-ਗਰੀਬ ਨਾਹ ਸਮਝੀਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਧਨੁ = ਕੰਗਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ni Él es pobre ni yo tengo hambre,"