[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਿਸਮਾਦੀ ਵਿਸਮਾਦੁ ਲਖ; ਅਕਥ ਕਥਾ ਵਿਚਿ ਸਹਮਿ ਸਹਕੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Millions are awe-struck, with the ineffable story of that wondrous Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਵਿਸਮਾਦਾਂ ਵਿਚ ਲਖਾਂ ਵਿਸਮਾਦੀ (ਲੋਕ ਅਤੇ ਉਸ ਪਰਮਾਤਮਾਂ ਦੀਆਂ) ਅਕੱਥ ਕਥਾ ਵਿਚ ਵਿਚ ਸਹਿਮ (ਡਰ) ਨਾਲ ਸਹਿਕਦੇ ਹਨ।"