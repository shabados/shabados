[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੋ ਸਚੁ; ਵਖਾਣੈ ਕੋਇ ॥"
page = 952
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who utters the Name of the Truest of the true,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਚਿਆਰਾਂ ਦੇ ਧਰਮ ਸਚਿਆਰ ਦੇ ਨਾਮ ਨੂੰ ਉਚਾਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who speaks the True Name of the True Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਚ ਹੀ ਸਚ ਕੋ ਵਖਿਆਨ ਕਰੇਗਾ, ਭਾਵ ਨਾਮੁ ਜਪੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ (ਐਸ ਜਨਮ ਵਿਚ) ਕੇਵਲ ਸੱਚੇ ਰੱਬ ਨੂੰ ਯਾਦ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੋ ਸਚੁ = ਕੇਵਲ ਸੱਚੇ ਪ੍ਰਭੂ ਨੂੰ। ਕੋਇ = ਜੋ ਕੋਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "quien recita sólo la Verdad del Señor,"