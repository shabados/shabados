[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਤੁਰ ਚਾਰ ਦੇਸੰ ॥"
page = 209

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The chief sage Vishwamitra had heard about it."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਚੌਹਾਂ ਕੁੰਟਾਂ ਅਤੇ ਦਿਸ਼ਾਵਾਂ (ਤੋਂ ਰਾਜ ਕੁਮਾਰ ਆ ਰਹੇ ਹਨ)।"