[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧੂ ਸੰਗਮਿ; ਹੈ ਨਿਸਤਾਰ ॥੨॥"
page = 200
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the guild of the righteous emancipation is obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿਸੰਗਤ ਅੰਦਰ ਕਲਿਆਣ ਦੀ ਪ੍ਰਾਪਤੀ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Saadh Sangat, the Company of the Holy, you shall be emancipated. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਸੰਤੋਂ ਕੇ ਸੰਗ ਕਰ ਨਿਸਤਾਰਾ ਹੋਤਾ ਹੈ, ਅਰਥਾਤ ਸਤਿਸੰਗ ਕਰੋ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਰਹਿ ਕੇ ਉਸ ਦਾ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ-ਉਤਾਰਾ ਹੋ ਜਾਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਸਤਾਰ = ਪਾਰ-ਉਤਾਰਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Trascendente y libérate en la Compañía de los Santos. (2)"