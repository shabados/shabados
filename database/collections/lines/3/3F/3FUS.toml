[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਾ ਰੂਪ; ਨਾਨਾ ਜਾ ਕੇ ਰੰਗ ॥"
page = 284
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Various are the forms and various His colours."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਸਰੂਪ ਹਨ ਅਤੇ ਅਨੇਕਾਂ ਉਸ ਦੀਆਂ ਰੰਗਤਾਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many are His forms; many are His colors."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਨਾ ਪ੍ਰਕਾਰ ਜਿਸ ਕੇ ਰੂਪ ਹੈਂ ਔਰ ਨਾਨਾ ਭਾਂਤ ਕੇ ਰੰਗ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ, ਜਿਸ ਦੇ ਕਈ ਰੂਪ ਤੇ ਰੰਗ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਾ = ਕਈ ਕਿਸਮ ਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Incontables son las Manifestaciones de Dios y numerosos Sus Atributos."