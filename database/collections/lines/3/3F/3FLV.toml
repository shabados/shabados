[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨਵੰਤਿ ਨਾਨਕ. ਭਰਮਹਿ ਭ੍ਰਮਾਏ; ਖਿਨੁ ਏਕੁ ਟਿਕਣੁ, ਨ ਪਾਵਹੀ ॥੨॥"
page = 705
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Supplicates Nanak, man wanders in doubt and obtains not rest even for a moment."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਬਿਨੈ ਕਰਦੇ ਹਨ, ਇਨਸਾਨ ਸੰਸੇ ਅੰਦਰ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ ਅਤੇ ਇਕ ਮੁਹਤ ਲਈ ਭੀ ਆਰਾਮ ਨਹੀਂ ਪਾਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Prays Nanak, wandering in doubt, he does not find any rest, even for an instant. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਵਹੁ ਭਰਮ ਕੇ ਭ੍ਰਮਾਏ ਹੂਏ ਜੋਨੀਓਂ ਕੋ ਪਾਵਤੇ ਏਕ ਖਿਨ ਮਾਤ੍ਰ ਭੀ ਟਿਕਣਾ ਅਰਥਾਤ ਇਸਥਿਤੀ ਨਹੀਂ ਪਾਵਤੇ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਬੇਨਤੀ ਕਰਦਾ ਹੈ ਅਜੇਹੇ ਮਨੁੱਖ (ਮਾਇਆ ਦੀ ਹੱਥੀਂ) ਕੁਰਾਹੇ ਪਏ ਹੋਏ (ਜੂਨਾਂ ਵਿਚ) ਭਟਕਦੇ ਫਿਰਦੇ ਹਨ, (ਜੂਨਾਂ ਦੇ ਗੇੜ ਵਿਚੋਂ) ਇਕ ਛਿਨ ਭਰ ਭੀ ਟਿਕ ਨਹੀਂ ਸਕਦੇ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਰਮਹਿ = ਭਟਕਦੇ ਹਨ। ਭਰਮਾਏ = ਕੁਰਾਹੇ ਪਾਏ ਹੋਏ। ਨ ਪਾਵਹੀ = ਨ ਪਾਵਹਿ, ਨਹੀਂ ਪਾਂਦੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, uno es desviado por la duda y así no conoce la Paz. (2)"