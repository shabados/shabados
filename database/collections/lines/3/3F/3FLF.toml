[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੁ ਤਪਾਵਸੁ. ਸਚੇ ਕੇਰਾ ॥"
page = 1074
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is the justice of the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚਾ ਹੈ ਇਨਸਾਫ਼ ਸੱਚੇ ਸੁਆਮੀ ਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True is the justice of the True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚੇ ਵਾਹਿਗੁਰੂ ਕਾ ਸਚਾ (ਤਪਾਵਸੁ) ਨਿਆਉਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ-ਥਿਰ ਪਰਮਾਤਮਾ ਦਾ ਨਿਆਂ ਭੀ ਅਟੱਲ (ਅਭੁੱਲ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਪਾਵਸੁ = ਨਿਆਂ, ਇਨਸਾਫ਼। ਕੇਰਾ = ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Verdadera es la Justicia de nuestro Señor Verdadero,"