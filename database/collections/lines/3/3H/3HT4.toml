data = "ਬਹੁਰਿ ਮਿਤ੍ਰ ਸੌ ਭੋਗ ਕਮਾਯੋ ॥"
page = 861

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After making love she sent him out. Then she got the friend out and they sat down on the bed.(7)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਮਿਤਰ ਨਾਲ ਭੋਗ ਕੀਤਾ।"