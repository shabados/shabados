[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਰਲਾ ਜੁਆਣੀ ਆਪਿ ਭਾਣੀ; ਇਛ ਮਨ ਕੀ ਪੂਰੀਏ ॥"
page = 567
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thy budding youth is pleasing to Thee and its sight fulfills the heart's desires."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਚੜ੍ਹਦੀ ਜੁਆਨੀ ਤੈਨੂੰ ਚੰਗੀ ਲਗਦੀ ਹੈ। ਇਸ ਦਾ ਦਰਸ਼ਨ ਦਿਲ ਦੀਆਂ ਖਾਹਿਸ਼ਾ ਪੂਰੀਆਂ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your youthful beauty is so alluring; it pleases You, and it fulfills the heart's desires."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚੰਚਲ ਜੁਬਾ ਅਵਸਥਾ ਆਪ ਕੋ ਭਾਈ ਹੈਂ, ਸੋ ਆਪ ਮਨ ਕੀ ਇਛਾ ਪੂਰਨ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਚੜ੍ਹਦੀ ਜੁਆਨੀ ਮਨ-ਭਾਉਂਦੀ ਹੈ ਤੇ ਦਿਲ ਦੀਆਂ ਖਾਹਿਸ਼ਾ ਪੂਰੀਆਂ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਣੀ = ਪਿਆਰੀ ਲੱਗੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tu Juventud es radiante y Tu Visión lo abarca todo. Con pasos medidos como los del elefante,"