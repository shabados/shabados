[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਘਟਿ ਸਿਮਰਨੁ ਰਾਮ ਕੋ; ਸੋ ਨਰੁ ਮੁਕਤਾ ਜਾਨੁ ॥"
page = 1428
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, within whose mind is the Lord's meditation, consider him to be emancipated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਹਿਰਦੇ ਅੰਦਰ ਪ੍ਰਭੂ ਦੀ ਬੰਦਗੀ ਹੈ, ਤੂੰ ਉਸ ਇਨਸਾਨ ਨੂੰ ਮੋਖਸ਼ ਹੋਇਆ ਹੋਇਆ ਸਮਝ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That person, who meditates in remembrance on the Lord in his heart, is liberated - know this well."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਜਿਸ ਕੇ ਅੰਤਸਕਰਨ ਮੇਂ ਰਾਮ ਨਾਮ ਕਾ ਸਿਮਰਨ ਹੈ, ਐਸੇ ਤੂੰ ਜਾਨ ਸੋ ਮੁਕਤ ਪੁਰਖ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਸਿਮਰਨ (ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ) ਉਸ ਮਨੁੱਖ ਨੂੰ (ਮੋਹ ਦੇ ਜਾਲ ਤੋਂ) ਬਚਿਆ ਹੋਇਆ ਸਮਝ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਹ ਘਟਿ = ਜਿਸ (ਮਨੁੱਖ) ਦੇ ਹਿਰਦੇ ਵਿਚ। ਕੋ = ਦਾ। ਮੁਕਤਾ = ਵਿਕਾਰਾਂ ਤੋਂ ਬਚਿਆ ਹੋਇਆ। ਜਾਨੁ = ਸਮਝੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La persona con cuyo corazón medita en el Señor, es liberada, aprende esto, no hay diferencia entre ella y el Señor."