[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮੇਰੇ; ਮੈ. ਹਰਿ ਹਰਿ ਕਥਾ ਮਨਿ ਭਾਣੀ ॥"
page = 997
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, the Lord's discourse is pleasing to my mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦੀ ਕਥਾ ਵਾਰਤਾ ਮੇਰੇ ਚਿੱਤ ਨੂੰ ਚੰਗੀ ਲੱਗਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, the sermon of the Lord, Har, Har, is pleasing to my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪਯਾਰੇ ਮਨ! ਮੈਂ ਤੌ ਹਰਿ ਹਰਿ ਕੀ ਕਥਾ ਇਸ ਹੇਤੂ ਤੇ ਹੀ ਭਾਣੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਮੈਨੂੰ ਆਪਣੇ ਅੰਦਰ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਪਿਆਰੀ ਲੱਗਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਮਨਿ = ਮਨ ਵਿਚ। ਭਾਣੀ = ਪਿਆਰੀ ਲੱਗਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente mía, el Evangelio del Señor, Jar, Jar, está complaciendo a mi mente, sí, continuamente y para siempre entónate en el Evangelio del Señor, Jar, Jar."