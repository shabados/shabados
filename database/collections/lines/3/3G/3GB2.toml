[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈ ਤਨਿ; ਬਾਣੀ ਵਿਸਰਿ ਜਾਇ ॥"
page = 661
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The body, that forgets the Guru's world,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸਰੀਰ ਨੂੰ ਗੁਰਬਾਣੀ ਭੁੱਲ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That body, which forgets the Word of the Guru's Bani,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ (ਤਨਿ) ਸਰੀਰ ਵਾ ਅੰਤਸ਼ਰਕਰਨ ਤੇ (ਬਾਣੀ) ਵਾਹਿਗੁਰੂ ਕਾ ਨਾਮ ਰੂਪ ਬਾਣੀ ਵਿਸਰ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸਰੀਰ ਵਿਚ (ਭਾਵ, ਜਿਸ ਮਨੁੱਖ ਨੂੰ) ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ ਭੁੱਲ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੈ ਤਨਿ = ਜਿਸ ਸਰੀਰ ਵਿਚ। ਵਿਸਰਿ ਜਾਇ = ਭੁੱਲ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que abandona la Palabra del Shabd,"