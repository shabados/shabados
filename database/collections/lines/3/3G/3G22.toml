[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਐਸੇ ਕਹਿਯੋ ਜਦੁਬੀਰ ਅਬੈ; ਅਤਿ ਹੀ ਹਿਤ ਭਾਵ ਤੇ ਥਾਪ ਥਪੈਹਉ ॥"
page = 430

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I shall establish the goddess with utmost devotion so that she may manifest herself,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕ੍ਰਿਸ਼ਨ ਨੇ ਇਸ ਤਰ੍ਹਾਂ ਕਿਹਾ ਕਿ ਮੈਂ ਹੁਣੇ ਬਹੁਤ ਹਿਤ ਨਾਲ ਉਸ ਦੀ ਆਰਾਧਨਾ (ਸਥਾਪਨਾ) ਕਰਦਾ ਹਾਂ।"