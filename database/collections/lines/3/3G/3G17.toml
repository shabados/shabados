[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦਿਨੁ ਨਾਮੁ ਜਪਹੁ ਬਨਵਾਰੀ ॥"
page = 1070
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day meditate thou on the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਦਿਨ ਤੂੰ ਆਪਣੇ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਆਰਾਧਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, chant the Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਦਿਨ (ਬਨਵਾਰੀ) ਪਰਮੇਸੁਰ ਕਾ ਨਾਮ ਜਪ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰ ਵੇਲੇ ਪਰਮਾਤਮਾ ਦਾ ਹੀ ਨਾਮ ਜਪਦੇ ਰਹੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਦਿਨੁ = ਹਰ ਰੋਜ਼, ਹਰ ਵੇਲੇ। ਬਨਵਾਰੀ ਨਾਮੁ = ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ {ਬਨ ਹੈ ਮਾਲਾ ਜਿਸ ਦੀ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, medita siempre en el Nombre del Señor,"