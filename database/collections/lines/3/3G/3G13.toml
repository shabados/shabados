[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰਥਮ ਲਾਗਿਲੀ ਕੌ ਨਿਰਖਿ; ਪੁਨਿ ਨਿਰਖੇ ਜਦੁਰਾਇ ॥"
page = 1015

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "First she saw Balbhadar and then Krishna."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਹਿਲਾਂ ਬਲਭਦ੍ਰ ('ਲਾਗਿਲੀ') ਨੂੰ ਵੇਖਿਆ, ਫਿਰ ਕ੍ਰਿਸ਼ਨ ਨੂੰ ਵੇਖਿਆ।"