type = "primary"
data = "ਅਪਨੀ ਜਾਨਿ ਅਧਿਕ ਸੁਖਿ ਪਾਵੈ ॥੫॥"
page = 858

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘They used to manipulate a woman. Both claimed that she was there to appease their minds.(5)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਉਸ ਨੂੰ) ਆਪਣੀ (ਇਸਤਰੀ) ਸਮਝ ਕੇ ਬਹੁਤ ਸੁਖ ਪ੍ਰਾਪਤ ਕਰਦੇ ਸਨ ॥੫॥"