[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੇਤੜਿਆਂ ਪਰਚੂਨੀਏ; ਕੇਤੜਿਆਂ ਦਲਾਲ ਬਜਾਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many are retailers and many are brokers in the market."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਿੰਨੇ ਪਰਚੂਨੀਏ, ਕਿੰਨੇ ਬਜ਼ਾਰਾਂ ਦੇ ਦਲਾਲ ਹਨ।"

[[content]]
assets = ["VBGS"]
type = "note"
language = "pa"
data = "ਪਰਚੂਨੀਏ=ਥੋਕ ਵਾਲਿਆਂ ਤੋ ਮਾਲ ਕੱਠਾ ਲੈ ਕੇ ਥੋੜਾ ਥੋੜਾ ਵੇਚਣ ਵਾਲੇ।"