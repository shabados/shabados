[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰਾ ਨਾਮੁ ਸਚਾ ਜੀਉ; ਸਬਦੁ ਸਚਾ ਵੀਚਾਰੋ ॥"
page = 243
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is Thy Name, O reverend Lord and true is the meditation of the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਨਾਮ ਸੱਚਾ ਹੈ, ਹੈ ਪੂਜਯ ਪ੍ਰਭੂ! ਅਤੇ ਸੱਚਾ ਹੈ ਤੇਰੇ ਨਾਮ ਦਾ ਸਿਮਰਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True is Your Name, O Dear Lord; True is contemplation of Your Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਿਗੁਰੂ! ਤੇਰਾ ਨਾਮ ਹੀ ਸੱਚਾ ਹੈ। ਪੁਨਾ ਤੇਰਾ ਬ੍ਰਹਮ ਸਰੂਪ ਕਾ ਵਾ ਗੁਰ ਉਪਦੇਸ ਕਾ ਵੀਚਾਰ ਸੱਚਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਜੀ! ਤੇਰਾ ਨਾਮ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਹੈ, ਤੇਰੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ ਅਟੱਲ ਹੈ, ਤੇਰੇ ਗੁਣਾਂ ਦੀ ਵਿਚਾਰ ਸਦਾ-ਥਿਰ (ਕਰਮ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚਾ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Verdad es Tu Nombre, oh mi Bienamado, Verdad es la contemplación en Tu Palabra."