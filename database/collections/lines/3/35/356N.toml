[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੰਗਿ ਰਤਾ; ਨਚੈ ਨੰਗੁ ॥"
page = 142
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "imbued with such pleasures the mortal dances shamelessly."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੀ ਖੁਸ਼ੀ ਨਾਲ ਰੰਗੀਜਿਆਂ ਹੋਇਆਂ ਪ੍ਰਾਣੀ ਬੇਸ਼ਰਮ ਹੋ ਕੇ ਨੱਚਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They delight in their pleasures, and dance about shamelessly."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਨ ਪਦਾਰਥੋਂ ਕੇ (ਰੰਗਿ) ਪ੍ਰੇਮ ਮੇਂ ਰਤਾ ਹੂਆ ਨੰਗਾ ਨਾਚ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਇਸ ਮੋਹ ਵਿਚ ਮਸਤਿਆ ਹੋਇਆ ਬੇ-ਸ਼ਰਮ ਹੋ ਕੇ ਨੱਚਦਾ ਹੈ (ਭਾਵ, ਮੱਚਦਾ ਹੈ, ਆਕੜਦਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੰਗੁ = ਪਿਆਰ। ਨੰਗੁ = ਬੇ-ਸ਼ਰਮ, ਨਿਲੱਜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "baila su propio son sin vergüenza,"