[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਰੇ; ਮਨ ਸਿਉ ਰਹਉ ਸਮਾਈ ॥"
page = 1260
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, remain thou blended with the Supreme Soul."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਆਤਮਾ! ਤੂੰ ਪਰਮ ਆਤਮਾ ਨਾਲ ਅਭੇਦ ਹੋਈ ਰਹੁ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mind, remain absorbed in the Mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ ਮੇਰੇ (ਮਨ)! ਪਰਮਾਤਮਾ ਕੇ ਸਾਥ ਸਮਾਇ ਰਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਮਨ! ਮੈਂ (ਤਾਂ ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੋ ਕੇ ਹੀ ਪ੍ਰਭੂ-ਚਰਨਾਂ ਵਿਚ) ਟਿਕਿਆ ਰਹਿ ਸਕਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ ਸਿਉ = ਮਨ ਨਾਲ, ਸੁਰਤ ਜੋੜ ਕੇ। ਰਹਉ ਸਮਾਈ = (ਪ੍ਰਭੂ-ਚਰਨਾਂ ਵਿਚ) ਮੈਂ ਲੀਨ ਰਹਿੰਦਾ ਹਾਂ (ਰਹਉਂ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, mente mía, consérvate absorta en el Señor, la mente del Gurmukj es complacida con el Nombre de Dios"