[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕਉ ਕੋਇ, ਨ ਸਾਕਸਿ ਮਾਰਾ ॥"
page = 1070
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "him no one can slay."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕੋਈ ਭੀ ਮਾਰ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who is saved by the Savior Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੋ ਕੋਈ ਮਾਰ ਨਹੀਂ ਸਕਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕੋਈ ਮਾਰ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਕਸਿ ਮਾਰਾ = ਮਾਰ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a ese ser nadie lo puede destruir."