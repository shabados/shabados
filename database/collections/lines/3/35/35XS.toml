[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਾਚ ਕਹਤ ਜਿਯ ਕੀ ਤੁਮੈ; ਸੁਨਿਹੌ ਮੀਤ, ਬਨਾਇ ॥"
page = 992

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Listen, my friend, I am speaking from my heart,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਿਤਰ! (ਮੈਂ) ਤੈਨੂੰ ਆਪਣੇ ਮਨ ਦੀ ਸੱਚੀ ਗੱਲ ਕਹਿੰਦੀ ਹਾਂ, ਚੰਗੀ ਤਰ੍ਹਾਂ ਸੁਣ ਲਵੋ।"