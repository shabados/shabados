[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਣ ਕਮਲ ਜਾਈ ਬਲਿਹਾਰਾ ॥"
page = 743
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and am a sacrifice unto Thine lotus feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਤੇਰਿਆਂ ਕੰਵਲ ਰੂਪ ਚਰਨਾਂ ਤੋਂ ਘੋਲੀ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to Your Lotus Feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਤੇਰੇ ਚਰਨ ਕਮਲੋਂ ਸੇ ਬਲਿਹਾਰ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੇ ਸੋਹਣੇ ਚਰਨਾਂ ਤੋਂ ਸਦਕੇ ਹੁੰਦਾ ਰਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਈ = ਜਾਈਂ, ਮੈਂ ਜਾਵਾਂ। ਬਲਿਹਾਰਾ = ਸਦਕੇ, ਕੁਰਬਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ofrezco siempre mi ser en sacrificio a Tus Pies de Loto."