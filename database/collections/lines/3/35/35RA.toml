[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਨ ਰਾਮ ਕੋ ਇਕੁ ਨਾਮ ॥"
page = 1221
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord's Name alone is worthy of meditation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਸੁਆਮੀ ਦਾ ਨਾਮ ਹੀ ਆਰਾਧਨ-ਯੋਗ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate in remembrance on the Naam, the Name of the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਇਕ ਰਾਮ ਕੇ ਨਾਮ ਕੋ ਸਿਮਰਨੇ ਕਰਕੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਸਿਰਫ਼ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਹੀ ਕੀਤਾ ਜਾਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਕੁ = ਸਿਰਫ਼। ਕੋ = ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Medita sólo en tu Señor, el Dios, así, la consecuencia de tus acciones desaparecerá de forma instantánea."