data = "ਤੁਮਰੋ ਤਊ ਨ ਪਾਵਤ ਪਾਰਾ ॥੬॥"
page = 47

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Even then he hath not know the end of Thy Names.6."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਵੀ (ਉਹ) ਤੇਰੇ ਨਾਂਵਾਂ ਦਾ ਅੰਤ ਨਹੀਂ ਪਾ ਸਕਿਆ ਹੈ ॥੬॥"