data = "ਬਾਜੀਗਰ ਸ੍ਵਾਂਗੁ ਸਕੇਲਾ ॥"
page = 655
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the magician winds up his play,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਮਦਾਰੀ ਆਪਣੀ ਖੇਡ ਨੂੰ ਸਮੇਟ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the magician winds up his show,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜਬ ਬਾਜੀਗਰ ਨੇ ਤਿਸ ਅਪਨੇ ਸ੍ਵਾਂਗ ਕੋ (ਸਕੇਲਾ) ਇਕਤ੍ਰ ਕਰ ਲੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਜਦੋਂ ਉਹ ਬਾਜੀਗਰ ਖੇਲ ਸਮੇਟਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸ੍ਵਾਂਗੁ = ਸਾਂਗ, ਤਮਾਸ਼ਾ। ਸਕੇਲਾ = ਸਮੇਟਿਆ, ਸਾਂਭਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero cuando la obra termina,"