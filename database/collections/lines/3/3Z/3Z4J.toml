[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ; ਕਰਨ ਕਰਾਵਨ ਜੋਗੁ ॥"
page = 275
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself is able to act and cause others to act."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਖੁਦ ਕੰਮ ਕਰਨ ਅਤੇ ਕਰਾਉਣ ਦੇ ਸਮਰਥ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is the Doer, the Cause of causes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਆਪ ਹੀ ਸਰਬ ਕਾਰਣੋਂ ਕੋ ਕਰਾਵਣੇ ਯੋਗ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਹੀ (ਸਭ ਕੁਝ) ਕਰਨ ਦੀ (ਤੇ ਜੀਵਾਂ ਪਾਸੋਂ) ਕਰਾਉਣ ਦੀ ਤਾਕਤ ਰੱਖਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋਗੁ = ਸਮਰੱਥ, ਤਾਕਤ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios es el Único Actor"