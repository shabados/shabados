data = "ਖਾਟ ਮਾਂਗਉ ਚਉਪਾਈ ॥"
page = 656
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I ask for a cot, with four legs as also,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਮੰਗਦਾ ਹਾਂ ਚਾਰ ਪੈਰਾਂ ਵਾਲਾ ਮੰਜਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I ask for a cot, with four legs,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾਂ ਖਟ ਸ਼ਾਸਤ੍ਰੋਂ ਕਾ ਔ ਚਾਰ ਵੇਦੋਂ ਕੇ ਸਿਧਾਂਤ ਕਾ ਪਾਵਣਾ ਮਾਂਗਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਬਤ ਮੰਜੀ ਮੰਗਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖਾਟ = ਮੰਜੀ। ਚਉਪਾਈ = ਚਾਰ ਪਾਵਿਆਂ ਵਾਲੀ, ਸਾਬਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Apenas necesito un aposento para reposar,"