[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹਤ ਕਬੀਰ; ਅਵਰ ਨਹੀ ਕਾਮਾ ॥"
page = 692
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir, nothing else is of any avail,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ, ਹੋਰ ਕੋਈ ਚੀਜ਼ ਭੀ ਕੰਮ ਨਹੀਂ ਆਉਣੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, nothing else is of any use."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਇਸੀ ਤੇ ਔਰ ਕੋਈ ਪਦਾਰਥ ਹਮਾਰੇ ਕਾਮ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ-(ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਤੋਂ ਖੁੰਝ ਕੇ) ਹੋਰ ਕੋਈ ਕੰਮ ਕਿਸੇ ਅਰਥ ਨਹੀਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਵਰ = ਹੋਰ (ਕੰਮ)। ਨਹੀ ਕਾਮਾ = ਕਿਸੇ ਮਤਲਬ ਦੇ ਨਹੀਂ, ਕੋਈ ਲਾਭ ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, a todos he encontrado vanos;"