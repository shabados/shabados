[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਾਸ ਅਪੁਨੇ ਕਉ ਰਾਖਨਹਾਰੁ ॥੧॥"
page = 1151
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is the saviour of His slave."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਆਪਣੇ ਗੋਲੇ ਦਾ ਰਖਿਅਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is the Saving Grace and the Protector of His slave. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਅਪਨੇ ਦਾਸ ਕੋ ਰਾਖਨਹਾਰਾ ਹੋਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਪਰਮਾਤਮਾ ਆਪਣੇ ਸੇਵਕ ਨੂੰ (ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗਣ ਤੋਂ) ਆਪ ਬਚਾਈ ਰੱਖਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਖਨਹਾਰੁ = (ਵਿਕਾਰਾਂ ਤੋਂ) ਬਚਾ ਸਕਣ ਵਾਲਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero el Sirviente del Señor, es salvado por Dios. (1)"