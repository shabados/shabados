[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਪ੍ਰਭ ਭਾਵੈ; ਤਾ ਕਿਰਪਾ ਧਾਰੈ ॥"
page = 1076
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Lord wills, then takes he pity one him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਸਾਈਂ ਨੂੰ ਚੰਗਾ ਲਗਦਾ ਹੈ, ਤਦ ਉਹ ਉਸ ਉੱਤੇ ਮਿਹਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When God pleases, He takes pity on him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਜੀ! ਤੇਰੇ ਕੋ ਭਾਵੈ ਤਾਂ ਕ੍ਰਿਪਾ ਧਾਰ ਕੈ ਦੇਹ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਪ੍ਰਭੂ ਦੀ ਰਜ਼ਾ ਹੁੰਦੀ ਹੈ ਤਦੋਂ ਉਹ ਕਿਰਪਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ = ਜਾਂ, ਜਦੋਂ। ਪ੍ਰਭ ਭਾਵੈ = ਪ੍ਰਭੂ ਨੂੰ ਚੰਗਾ ਲੱਗੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Señor, y cuando así es Tu Voluntad, le muestras Tu Compasión."