[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਭ ਦਿਵਸ ਆਏ. ਸਹਜਿ ਪਾਏ; ਸਗਲ ਨਿਧਿ ਪ੍ਰਭ ਪਾਗੇ ॥"
page = 459
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Auspicious days came and I attained poise. All the treasures are in Lord's Feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਬਾਰਕ ਦਿਹਾੜੇ ਆ ਗਏ ਤੇ ਮੈਂ ਆਰਾਮ ਪਾ ਲਿਆ। ਸਾਰੇ ਖਜਾਨੇ ਸਾਹਿਬ ਦੇ ਪੈਰਾਂ ਵਿੱਚ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The appointed day came, and I attained peace and poise; all treasures are in the feet of God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੇਸਟ ਦਿਨ ਆਵਤੇ ਭਏ ਹੈਂ ਔ ਸਾਂਤ ਆਦਿ ਗੁਣ ਪਾਵਤੇ ਭਏ ਹੈਂ। ਸਭ ਨਿਧ ਰੂਪ ਜੋ ਪ੍ਰਭ ਹੈ ਤਿਸ ਮੇਂ ਮਨ ਕਰ ਕੇ ਪਾਗੇ, ਭਾਵ ਮਿਲਤੇ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨਾਂ ਵਾਸਤੇ (ਜੀਵਨ ਦੇ ਇਹ) ਭਲੇ ਦਿਨ ਆਏ ਹੁੰਦੇ ਹਨ, ਉਹ ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਟਿਕ ਕੇ ਸਾਰੇ ਗੁਣਾਂ ਦੇ ਖ਼ਜ਼ਾਨੇ ਪ੍ਰਭੂ ਦੇ ਚਰਨ ਪਰਸਦੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜਿ = ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ। ਨਿਧਿ = ਖ਼ਜ਼ਾਨਾ। ਪਾਗੇ = ਪਗ, ਚਰਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mis días se volvieron auspiciosos y encontré la calma y todos los Tesoros los descubrí a los Pies del Señor."