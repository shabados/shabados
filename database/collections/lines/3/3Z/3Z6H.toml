assets = ["DGDG"]
type = "primary"
data = "ਵਾਰ ਅਪਾਰ ਬਹੇ ਕਈ ਬਾਰ; ਗਏ ਛੁਟਿ ਕੰਚਨ ਕੋਟਿ ਕਨੂਕੇ ॥"
page = 928

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Raids after raids, produced fire sparks,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਈ ਵਾਰ ਅਣਗਿਣਤ ਪ੍ਰਹਾਰ ਹੋਏ ਹਨ ਅਤੇ ਸੋਨੇ (ਵਰਗੇ ਸੂਰਮਿਆਂ ਦੇ ਸ਼ਰੀਰ) ਚਿੰਗਾਰੇ ਬਣ ਕੇ ਉਡ ਗਏ ਹਨ।"