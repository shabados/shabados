[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਹਸਾ ਰੋਗੁ. ਨ ਛੋਡਈ; ਦੁਖ ਹੀ ਮਹਿ ਦੁਖ ਪਾਹਿ ॥"
page = 645
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Their disease of doubt departs not and, in pain, they obtain more pain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦਾ ਸੰਦੇਹ (ਸੰਸੇ) ਦੀ ਬੀਮਾਰੀ ਦੂਰ ਨਹੀਂ ਹੁੰਦੀ ਅਤੇ ਪੀੜ ਅੰਦਰ ਉਹ ਹੋਰ ਪੀੜ ਪਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The disease of doubt does not depart, and they find only pain and more pain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੋ ਸੰਸਾ ਰੂਪੀ ਰੋਗ ਛੋਡਤਾ ਨਹੀਂ ਹੈ, ਤਿਸੀ ਤੇ ਵਹੁ ਦੁਖ ਬੀਚ ਦੁਖ ਪਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਨੂੰ ਚਿੰਤਾ ਦਾ ਰੋਗ ਕਦੇ ਨਹੀਂ ਛੱਡਦਾ, ਸਦਾ ਦੁਖੀ ਹੀ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su mente se encuentra dividida por la duda y el dolor le acarrea más dolor."