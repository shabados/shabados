[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮ ਮੰਤ੍ਰੁ; ਜਾ ਕਉ ਗੁਰਿ ਦੀਨ ॥੩॥"
page = 1298
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "whom the Guru blesses with the Name's spell."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਗੁਰੂ ਜੀ ਨਾਮ ਦਾ ਗੁਰਮੰਤ੍ਰ ਬਖਸ਼ਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "are wise, and blessed with all powers. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪੁਰਸ਼ ਕੋ ਗੁਰੋਂ ਨੇ ਨਾਮ ਮੰਤ੍ਰ ਦੀਆ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਗੁਰੂ ਨੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਮੰਤ੍ਰ ਦੇ ਦਿੱਤਾ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਤ੍ਰੁ = ਉਪਦੇਸ਼। ਗੁਰਿ = ਗੁਰੂ ਨੇ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "se vuelven sabios y son bendecidos con todo tipo de poderes. (3)"