[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਮਾਰੈ; ਏਹ ਕਿਰਪਾ ਕੀਜੈ ॥"
page = 1321
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Master, bless thou me with thy mercy."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਾਲਕ! ਤੂੰ ਮੇਰੇ ਉਤੇ ਮਿਹਰ ਧਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please grant me this blessing:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਰਮੇਸ੍ਵਰ! ਹਮਾਰੇ ਊਪਰ ਇਹ ਕਿਰਪਾ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੇਰੇ ਉੱਤੇ ਇਹ ਮਿਹਰ ਕਰ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਮਾਰੈ = ਸਾਡੇ ਉੱਤੇ, ਮੇਰੇ ਉੱਤੇ। ਕੀਜੈ = ਕਰੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Concédeme la Bendición para que la abeja humilde de mi mente se inmerja una"