[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੈ ਬਚਨਿ; ਧਿਆਇਓ ਮੋਹਿ ਨਾਉ ॥"
page = 239
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's world I have remembered the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਕਲਾਮ ਦੁਆਰਾ ਮੈਂ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Guru's Word, I meditate on the Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰੋਂ ਕੇ ਬਚਨ ਸੇ ਮੈਂ ਨਾਮ ਧਿਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਗੁਰੂ ਦੇ ਉਪਦੇਸ਼ ਦੀ ਬਰਕਤਿ ਨਾਲ ਮੈਂ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਿਆ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A través de la Palabra, habité en el Nombre"