[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹ ਸ੍ਰਪਨੀ; ਤਾ ਕੀ ਕੀਤੀ ਹੋਈ ॥"
page = 481
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This mammon is created by Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਮਾਇਆ ਉਸ ਦੀ ਪੈਦਾ ਕੀਤੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This she-serpent is created by Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਮਾਯਾ ਤਿਸ ਵਾਹਿਗੁਰੂ ਕੀ ਕਰੀ ਹੂਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਮਾਇਆ ਉਸ ਪਰਮਾਤਮਾ ਦੀ ਬਣਾਈ ਹੋਈ ਹੈ, (ਜਿਸ ਨੇ ਸਾਰਾ ਜਗਤ ਰਚਿਆ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕੀ = ਉਸ (ਪਰਮਾਤਮਾ) ਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Esa serpiente fue creada por el Mismo Señor;"