language = "en"
data = "Thou art everlasting like the Bunyan-seed"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਾ ਬਣਾਏ ਜਾ ਸਕਣ ('ਅਠਟ') ਵਾਲੀ (ਬ੍ਰਹਮ ਰੂਪ) ਗੋਲੀ ('ਬਟਕੰ') ਨੂੰ ਵਟਦੇ ਹੋ,"