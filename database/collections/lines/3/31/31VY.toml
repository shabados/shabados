[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਉਦੇ ਨਦ ਨਾਦੰ ਕੜਕੇ ਕਮਾਣੰ ॥"
page = 106

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The jingling sound of bows appears like the sound of flowing stream."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਧੌਂਸਿਆਂ ਤੋਂ ਗੰਭੀਰ ਧੁਨੀ ਅਤੇ ਕਮਾਨਾਂ ਤੋਂ ਕੜਾਕ (ਦੀ ਆਵਾਜ਼) ਪੈਦਾ ਹੋ ਰਹੀ ਹੈ।"