data = "ਕਿ ਭੂਤੇਸ ਪਿਆਰੀ ॥੩੧੯॥"
page = 660

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She was a Gandharva woman or a Vidyadhar girl or the spring like lady or a beloved of all the people.319."

