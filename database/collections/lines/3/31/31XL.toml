[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇਵਕ ਸੇਵਿ; ਸਦਾ ਸੋਹੰਤੇ ॥੧॥"
page = 1339
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and serving Him, the Lord's slaves look beauteous."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਦੀ ਘਾਲ ਕਮਾ, ਸਾਹਿਬ ਦੇ ਗੋਲੇ ਸਦੀਵ ਹੀ ਸੁੰਦਰ ਦਿਸਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "serving Him, they look beauteous forever. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਦਾਸੋਂ ਕੋ ਸੇਵ ਕਰ ਸਦਾ ਹੀ ਸੋਭਤੇ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਭਗਤ (ਪਰਮਾਤਮਾ ਦੀ) ਭਗਤੀ ਕਰ ਕੇ ਸਦਾ (ਲੋਕ ਪਰਲੋਕ ਵਿਚ) ਸੋਹਣੇ ਲੱਗਦੇ ਹਨ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵਿ = ਸੇਵਾ ਕਰ ਕੇ, ਭਗਤੀ ਕਰ ਕੇ। ਸੋਹੰਤੇ = ਸੋਹਣੇ ਲੱਗਦੇ ਹਨ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "teniendo Su Visión se muestran bellos por siempre. (1)"