[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਤ ਜਉਨ ਦਿਸਾਨ ਕੇ ਪਛ; ਲਾਗ ਹੀ ਸਿਰਦਾਰ ॥"
page = 141

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Wherever the horse named Sri Barn goes, the army chiefs follow him."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਿਸ਼ਾ ਵਿਚ (ਉਹ ਯੱਗ-ਘੋੜਾ) ਜਾਂਦਾ ਸੀ (ਉਸ) ਪਿਛੇ (ਫੌਜੀ) ਨਾਇਕ ਲਗ ਤੁਰਦੇ ਸਨ।"