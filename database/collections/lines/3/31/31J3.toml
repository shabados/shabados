[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਨਤ ਕਮਾਵਤ; ਹੋਤ ਉਧਾਰ ॥"
page = 295
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who hears them and acts thereon is saved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਉਨ੍ਹਾਂ ਨੂੰ ਸੁਣਦਾ ਅਤੇ ਉਨ੍ਹਾਂ ਤੇ ਅਮਲ ਕਰਦਾ ਹੈ, ਉਹ ਬਚ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who listens and acts on them is saved."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਬਚਨੋਂ ਕੋ ਜੋ ਸੁਨਤੇ ਔਰ ਕਮਾਵਤੇ ਹੈਂ, ਤਿਨ ਕਾ ਉਧਾਰ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹਨਾਂ ਬਚਨਾਂ ਨੂੰ) ਸੁਣਿਆਂ ਤੇ ਕਮਾਇਆਂ ਬੇੜਾ ਪਾਰ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él mismo nada a través y salva a otros también,"