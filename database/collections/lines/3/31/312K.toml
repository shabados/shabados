[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ ਕਾ ਅੰਤੁ ਨ. ਤੇਹਿ ॥੭॥"
page = 1236
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They know not the limit of the Lofty Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸ਼ਰੋਮਣੀ ਸਾਹਬਿ ਦੇ ਓੜਕਾਂ ਨੂੰ ਨਹੀਂ ਜਾਣਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They do not know the limits of the Supreme Lord God. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ (ਤੇਹਿ) ਤਿਨ ਕੋ ਪਾਰਬ੍ਰਹਮ ਕਾ ਅੰਤ ਨਹੀਂ ਆਵਤਾ ਹੈ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! ਉਹਨਾਂ ਵਿਚੋਂ ਕਿਸੇ ਨੇ ਉਸ (ਦੇ ਗੁਣਾਂ) ਦਾ ਅੰਤ ਨਹੀਂ ਲੱਭਾ ॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇਹਿ = ਉਹਨਾਂ ਨੇ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero aún ellos no conocen los Límites del Señor. (7)"