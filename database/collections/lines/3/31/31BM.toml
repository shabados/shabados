type = "primary"
data = "ਕਰਉ ਬੇਨਤੀ; ਸੰਤਨ ਪਾਸੇ ॥"
page = 759
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "A request is made to the saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਕੋਲ ਪ੍ਰਾਰਥਨਾ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak offers this prayer to the Saints"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸੰਤੋਂ ਕੇ ਪਾਸ ਬੇਨਤੀ ਕਰਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਤੇਰੇ ਸੰਤ ਜਨਾਂ ਅੱਗੇ ਬੇਨਤੀ ਕਰਦਾ ਹਾਂ, ਅਰਜ਼ੋਈ ਕਰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਉ = ਕਰਉਂ, ਮੈਂ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rezo a los Santos: únanme,"