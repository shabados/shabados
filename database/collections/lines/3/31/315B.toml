[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਸੰਤ ਦੰਤਣੰ ਦੁਤੰ ਖਿਮੰਤ ਜਾਣੁ ਦਾਮਿਣੀ ॥੪੫੬॥"
page = 672

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The evil Kinnar women were getting angry and other pretty ladies laughingly exhibited their teeth making the lightning shyful.456."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੇ ਚਮਕਦੇ ਦੰਦਾਂ ਦੀ ਚਮਕ ਅਜਿਹੀ ਸੀ, ਮਾਨੋ ਬਿਜਲੀ ਖਿਮ ਰਹੀ ਹੋਵੇ ॥੪੫੬॥"