[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਰਮਹਿ ਜੋਨਿ ਅਸੰਖ; ਮਰਿ ਜਨਮਹਿ ਆਵਹੀ ॥"
page = 705
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He wanders about in myriad of existences, dies and is born again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਅਣਗਿਣਤ ਜੂਨੀਆਂ ਅੰਦਰ ਭਟਕਦਾ ਹੈ, ਮਰ ਜਾਂਦਾ ਹੈ ਅਤੇ ਮੁੜ ਜੰਮ ਪੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He wanders around in countless incarnations; he dies, only to be born again."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਤੇ ਅਨੇਕ ਜੋਨੀ ਮੇਂ ਭਰਮੇਂਗਾ ਮਰ ਕਰ ਜਨਮੋਂ ਮੇਂ ਆਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਅਣਗਿਣਤ ਜੂਨਾਂ ਵਿਚ ਭਟਕਦੇ ਫਿਰਦੇ ਹਨ, ਆਤਮਕ ਮੌਤ ਸਹੇੜ ਕੇ (ਮੁੜ ਮੁੜ) ਜੰਮਦੇ ਹਨ (ਮੁੜ ਮੁੜ ਜਗਤ ਵਿਚ) ਆਉਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਰਮਹਿ = ਭਟਕਦੇ ਹਨ। ਅਸੰਖ = ਅਣਗਿਣਤ। ਮਰਿ = ਮਰ ਕੇ, ਆਤਮਕ ਮੌਤ ਸਹੇੜ ਕੇ। ਜਨਮਹਿ = ਜੰਮਦੇ ਹਨ। ਆਵਹੀ = ਆਵਹਿ, (ਜੂਨਾਂ ਵਿਚ) ਆਉਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así vaga a través de millones de encarnaciones, naciendo para morir una y otra vez."