type = "translation"
language = "pa"
data = "ਬਾਹਰੋਂ ਭਾਵੇਂ ਉਹ ਇਸਤਰੀ ਅਤੇ ਬੱਚੇ ਦੇ ਮੋਹ ਵਿਚ ਦਿਸਦਾ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਜ਼ਾਹਿਰ ਅੰਦਰ ਮਾਇਲਿ ਫਰਜ਼ੰਦੋ ਜ਼ਨ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, he is the new sprouting fruit for the tree of generosity. (110)"