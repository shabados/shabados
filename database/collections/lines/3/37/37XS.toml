[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੀ ਟੇਕ; ਤੇਰਾ ਮਨਿ ਤਾਣੁ ॥"
page = 1147
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within my mind is Thine prop and power."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਚਿੱਤ ਅੰਦਰ ਤੇਰਾ ਆਸਰਾ ਅਤੇ ਸਤਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With Your Support, my mind is filled with Your Power."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਓਟ ਸਰੀਰ ਕੋ ਹੈ ਔ ਤੇਰਾ ਹੀ ਮਨਿ ਵਿਖੇ (ਤਾਣੁ) ਬਲੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਸਭ ਜੀਵਾਂ ਨੂੰ ਤੇਰਾ ਹੀ ਆਸਰਾ ਹੈ, ਸਭ ਦੇ ਮਨ ਵਿਚ ਤੇਰੇ ਨਾਮ ਦਾ ਹੀ ਸਹਾਰਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਤਾਣੁ = ਬਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "cuando me apoyo sólo en Ti, mi mente desborda de Tu Poder,"