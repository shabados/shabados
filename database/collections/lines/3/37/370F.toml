[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਹਿਬ ਕੀ; ਸੇਵਕੁ ਰਹੈ ਸਰਣਾਈ ॥"
page = 842
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If the Lord's slave remains under His protection,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਪ੍ਰਭੂ ਦਾ ਗੋਲਾ ਉਸ ਦੀ ਪਨਾਹ ਹੇਠਾਂ ਰਹੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord's servant remains under His protection;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਸਾਹਿਬ ਕੀ ਜੋ ਸੇਵਕ ਸਰਣ ਮੇਂ ਰਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਸੇਵਕ (ਆਪਣੇ) ਮਾਲਕ-ਪ੍ਰਭੂ ਦੀ ਸਰਨ ਪਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਹੈ = ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ni puede provocar que desperdicie su vida."