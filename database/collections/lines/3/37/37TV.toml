[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੇਵਡੁ ਆਖਾਂ ਭਾਉ ਭਉ; ਸਾਂਤਿ ਸਹਜਿ ਉਪਕਾਰ ਵਿਕਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "What could be told about love, fear, peace, equipoise, altruism and evil propensities?"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਕਈ) ਭਾਉ ਭਉ (ਰੱਖਕੇ) ਸ਼ਾਂਤਿ ਦੇ ਸਵਭਾਵਕ ਉਪਕਾਰ (ਹੀ ਕਰਦੇ ਹਨ, ਕਈ) ਵਿਕਾਰਾਂ (ਵਿਚ ਮਸਤ ਹਨ, ਐਸੇ) ਕਿੰਨੇ ਕੁ (ਆਖਾਂ)?"