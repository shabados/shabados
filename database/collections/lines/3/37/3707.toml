data = "ਬਿਗੋਯਦ ਕਿ ਮਾਰਾ ਪਨਾਹੇ ਖ਼ੁਦਾਸਤ ॥੪੦॥"
page = 1410

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘He is Forgiver and, I am sure, He will excuse my lie.‘(40)"

[[content]]
