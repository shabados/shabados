data = "ਬ ਮਨ ਹਾਲ ਗੋ ਤਾ ਚਿ ਗੁਜ਼ਰਦ ਤੁਰਾ ॥"
page = 1418

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘You tell me, how are you savouring?"

