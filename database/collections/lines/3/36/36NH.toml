data = "ਸ਼ੁਨੀਦਨ ਨ ਬਦ ਸੁਖ਼ਨ, ਕਸਰਾ ਬਗੋਸ਼ ॥"
page = 1399

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘One who does not listen to the back-biting talks,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਕਿਸੇ ਦੀਆਂ ਮਾੜੀਆਂ ਗੱਲਾਂ ਕੰਨਾਂ ਨਾਲ ਨਹੀਂ ਸੁਣਦਾ।"