[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪ੍ਰਸਾਦਿ ਸਿਮਰਤ ਰਹੈ; ਜਾਹੂ ਮਸਤਕਿ ਭਾਗ ॥"
page = 254
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, on whose forehead good destiny is recorded continues to remember God by Guru's grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਮੱਥੇ ਉਤੇ ਚੰਗੀ ਕਿਸਮਤ ਲਿਖੀ ਹੋਈ ਹੈ, ਉਹ ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਰੱਬ ਦਾ ਚਿੰਤਨ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, one who has such good destiny written on his forehead remembers the Lord in meditation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪੁਰਸ ਕੇ ਮਸਤਕ ਕਾ ਉਤਮ ਭਾਗ ਹੈ ਵਹੁ ਪੁਰਸ ਗੁਰੋਂ ਕੀ ਪ੍ਰਸੰਨਤਾ ਕਰ ਨਾਮ ਕੋ ਸਿਮਰਤਾ ਰਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਮੱਥੇ ਉਤੇ ਭਾਗਾਂ ਦਾ ਲੇਖ ਉੱਘੜੇ, ਉਹ ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਸਦਾ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਸਿਮਰਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਹੂ ਮਸਤਕਿ = ਜਿਸ ਦੇ ਮੱਥੇ ਉਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquéllos que por la Gracia del Guru habitan en el Señor, por buena fortuna, son bendecidos, pues,"