[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਦਿਲ ਦੀ ਖੇਤੀ ਦੀ ਸੈਰ ਕਰ, ਗਿਆਨ ਦਾ ਦਾਨਾ ਇਸੇ ਵਿਚ ਹੀ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਸੈਰ ਕੁਨ ਦਰ ਕਿਸ਼ਤਿ ਦਿਲ ਈਂ ਦਾਨਾ ਹਸਤ ॥੪੨੩॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "You should walk around your heart's field of crops; the grain of enlightenment is there only inside it. (423)"