type = "primary"
data = "ਅਤਿ ਤੇਜੁ ਪ੍ਰਚੰਡ ਪ੍ਰਤਾਪੁ ਬਢ︀ਯੋ ॥"
page = 154

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "His glory and magnificence increased enormously."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦਾ) ਤੇਜ ਪ੍ਰਚੰਡ ਹੋ ਗਿਆ ਅਤੇ ਪ੍ਰਤਾਪ ਬਹੁਤ ਵੱਧ ਗਿਆ।"