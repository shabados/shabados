data = "ਨ ਦੀਦੇਮ ਦੁਸ਼ਮਨ ਨ ਦੋਜ਼ਨ ਬਤੀਰ ॥"
page = 1416

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Neither I got hold of the enemy, nor could I pierce an arrow,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਨਾ ਦੁਸ਼ਮਨ ਨੂੰ ਵੇਖਿਆ ਹੈ ਅਤੇ ਨਾ ਹੀ ਉਸ ਨੂੰ ਤੀਰ ਵਿਚ ਪਰੋਇਆ ਹੈ।"