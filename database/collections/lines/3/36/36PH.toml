[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚਲੀ ਪੀੜੀ ਸੋਢੀਆ; ਰੂਪੁ ਦਿਖਾਵਣਿ ਵਾਰੋ ਵਾਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Now the Sodhi lineage has started and they all will show their selves turn by turn."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਹੁਣ) ਸੋਢੀਆਂ ਦੀ ਪੀਹੜੀ (ਅਗੋਂ) ਤੋਰ ਪਈ, ਵਾਰੋ ਵਾਰੀ (ਗੁਰੂ) ਰੂਪ ਦੱਸਣਗੇ।"