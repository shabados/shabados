[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦੁਨੀਆ ਵਿਚਿ ਪਰਾਹੁਣਾ; ਦਾਵਾ ਛਡਿ ਰਹੈ ਲਾ ਦਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "That is why foregoing all claims, he lives without making any claim for himself."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰ ਵਿਖੇ (ਆਪ ਨੂੰ) ਪਰਾਹੁਣਾ ਜਾਣਕੇ ਦਾਵਾ ਛਡਕੇ ਬੇਦਾਵੇ ਹੋ ਰਹੇ।"