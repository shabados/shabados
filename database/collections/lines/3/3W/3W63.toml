[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨਵੰਤਾ ਹੋਇ ਕਰਿ; ਗਰਬਾਵੈ ॥"
page = 278
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who being wealthy feels proud of his riches,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਧਨਾਢ ਆਪਣੀ ਦੌਲਤ ਦਾ ਗੁਮਾਨ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who becomes wealthy and takes pride in it"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਪਾਏ ਤੇ ਏਹ ਜੀਵ ਧਨਵੰਤ ਹੋ ਕਰ ਹੰਕਾਰੀ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਧਨ ਵਾਲਾ ਹੋ ਕੇ ਮਾਣ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਨਵੰਤਾ = ਧਨ ਵਾਲਾ, ਧਨਾਢ। ਗਰਬਾਵੈ = ਗਰਬ (ਮਾਣ) ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando un hombre rico se vanagloria de su riqueza,"