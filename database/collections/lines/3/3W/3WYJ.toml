[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਮਾਤ ਪਿਤਾ; ਅਪਣੇ ਦਾਸ ਕਾ ਰਖਵਾਲਾ ॥"
page = 1137
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is the Mother, Father and the Protector of His servant."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਆਪਣੇ ਸੇਵਕਾਂ ਦੀ ਅੰਮੜੀ ਬਾਬਲ ਅਤੇ ਰਾਖਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is the Mother, the Father and the Protector of His slave."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭ) ਪਰਮੇਸ੍ਵਰ ਮਾਤਾ, ਪਿਤਾ ਵਤ ਆਪਣੇ ਦਾਸੋਂ ਕਾ ਸਦੀਵ (ਰਖਵਾਲਾ) ਰਖਕ ਹੋਤਾ ਭਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਂ ਪਿਉ (ਵਾਂਗ) ਪ੍ਰਭੂ ਆਪਣੇ ਸੇਵਕ ਦਾ ਸਦਾ ਆਪ ਰਾਖਾ ਬਣਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor es el padre y la madre y el Protector de Sus Sirvientes,"