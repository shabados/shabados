[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਡਭਾਗੀ ਗੁਰੁ ਪੂਰਾ ਪਾਈਐ ॥"
page = 563
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By great good fortune the perfect Guru is attained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਰੇ ਚੰਗੇ ਨਸੀਬਾਂ ਦੁਆਰਾ ਪੂਰਨ ਗੁਰੂ ਜੀ ਪ੍ਰਾਪਤ ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By great good fortune, one meets the Perfect Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਡੇ ਭਾਗ ਸੇ ਪੂਰਾ ਸਤਿਗੁਰੂ ਪਾਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੂਰਾ ਗੁਰੂ ਵੱਡੀ ਕਿਸਮਤ ਨਾਲ ਮਿਲਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con gran fortuna, uno recibe al Guru Perfecto,"