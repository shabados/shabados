[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਹੈ ਸਜਾਈਂ ਨਰਕ ਵਿਚਿ; ਉਹੁ ਖਰਾ ਦੁਹੇਲਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In dilemma he stands and suffers hell."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਉਹ ਨਰਕ ਦੀ ਪੀੜਾਂ ਸਹਾਰਦਾ ਅਰ ਖਰਾ ਦੁਖੀ ਹੁੰਦਾ ਹੈ।"