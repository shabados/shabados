[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪੂਜਹੁ ਬਿਪਨ ਕੋ ਮੁਖ ਗਊਅਨ; ਪੂਜਨ ਜਾ ਗਿਰਿ ਹੈ ਤਹ ਜਈਯੈ ॥"
page = 327

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "You may worship Brahmins, cows and the mountain,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਾਹਮਣਾਂ ਦੇ ਮੁਖ ਅਤੇ ਗਊਆਂ ਦੀ ਪੂਜਾ ਕਰੋ ਅਤੇ ਪੂਜਾ ਲਈ ਜਿਥੇ ਗਵਰਧਨ ਪਰਬਤ ਹੈ,"