[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਜ ਸਬੈ ਹਨਿ ਹੋ ਰਨ ਮੈ; ਕਹਿ ਯੌ ਬਤੀਯਾ, ਧਨੁ ਬਾਨ ਗਹਿਓ ਹੈ ॥"
page = 443

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Today I shall knock down all of you,” saying this, he held up his bow and arrows"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਜ ਸਾਰਿਆਂ ਨੂੰ ਰਣ ਵਿਚ ਮਾਰਦਾ ਹਾਂਇਹ ਗੱਲ ਕਹਿ ਕੇ ਧਨੁਸ਼ ਅਤੇ ਬਾਣ ਗ੍ਰਹਿਣ ਕਰਦਾ ਹੈ।"