[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਬ ਮਨਿ ਬਸਿਆ; ਕਰਨੈਹਾਰਾ ॥"
page = 202
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Now, my soul abides in the Creator."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਮੇਰੀ ਆਤਮਾ ਸਿਰਜਣਹਾਰ ਅੰਦਰ ਵਸਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind now dwells in the Creator Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰੇ ਤੋ ਅਬ ਮਨ ਮੇਂ ਕਰਨੇ ਹਾਰ ਵਾਹਗੁਰੂ ਵਸਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਸਭ ਕੁਝ ਕਰਨ ਦੀ ਸਮਰੱਥਾ ਰੱਖਣ ਵਾਲਾ ਪਰਮਾਤਮਾ (ਮੇਰੇ) ਮਨ ਵਿਚ ਆ ਵੱਸਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਬ = ਹੁਣ। ਮਨਿ = ਮਨ ਵਿਚ। ਕਰਨੈਹਾਰਾ = ਪੈਦਾ ਕਰਨ ਵਾਲਾ ਪ੍ਰਭੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora mi mente habita en el Señor Creador,"