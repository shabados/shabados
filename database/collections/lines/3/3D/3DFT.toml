[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਠ ਪਹਰ; ਨਿਕਟਿ ਕਰਿ ਜਾਨੈ ॥"
page = 392
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Throughout the eight watches, the saint realises the nearness of the Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੱਠੇ ਪਹਿਰ ਸਾਧੂ ਸਾਹਿਬ ਦੀ ਹਜੂਰੀ ਅਨੁਭਵ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Twenty-four hours a day, he knows the Lord to be near at hand;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਸੰਤ ਅਕਾਲ ਪੁਰਖ ਕੋ ਅਸ੍ਟ ਪਹਰ ਅਪਨੇ ਸੰਗ ਸਮਝਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਭਗਤ ਪਰਮਾਤਮਾ ਨੂੰ ਅੱਠੇ ਪਹਿਰ ਆਪਣੇ ਨੇੜੇ ਵੱਸਦਾ ਸਮਝਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਕਟਿ = ਨੇੜੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Santos realizan la cercanía de Dios día y noche"