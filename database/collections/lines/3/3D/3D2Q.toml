type = "primary"
data = "ਗਾੜੀ ਰੇਤੀ ਮਾਝ; ਸੁ ਸਭਨ ਦਿਖਾਰਿ ਕੈ ॥"
page = 1001

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Displaying to every body she dug it in the sand."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਭ ਨੂੰ ਵਿਖਾ ਕੇ ਚੰਗੀ ਤਰ੍ਹਾਂ ਰੇਤ ਵਿਚ ਗਡ ਦਿੱਤੀ।"