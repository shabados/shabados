[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਜ ਘਰਿ ਵਸੈ; ਸਹਜਿ ਸੁਭਾਇ ॥"
page = 1129
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He naturally abides in his own Home."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਭਾਵਕ ਹੀ ਆਪਣੇ ਨਿਜ ਦੇ ਘਰ ਵਿੱਚ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He naturally, intuitively dwells within the home of his own inner being."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਓਹ ਪੁਰਸ਼ ਆਪਣੇ ਸ੍ਵਰੂਪ ਮੇਂ ਇਸਥਿਤ ਹੋਤਾ ਹੈ, ਪੁਨਃ ਸਾਂਤੀ ਸੁਭਾਵ ਵਾਲਾ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਟਿਕ ਕੇ, ਪ੍ਰਭੂ-ਪਿਆਰ ਵਿਚ ਟਿਕ ਕੇ, ਪ੍ਰਭੂ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਨਿਵਾਸ ਕਰੀ ਰੱਖਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਜ ਘਰਿ = ਆਪਣੇ (ਅਸਲ) ਘਰ ਵਿਚ, ਪ੍ਰਭੂ-ਚਰਨਾਂ ਵਿਚ। ਸਹਜਿ = ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ। ਸੁਭਾਇ = ਪ੍ਰੇਮ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De forma espontánea entonces uno viene a habitar en el Recinto del Ser"