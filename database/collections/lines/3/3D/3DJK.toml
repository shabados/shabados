[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਦਾਸ; ਤਰੀ ਤਿਨਿ ਮਾਇਆ ॥੪॥੫॥੫੬॥"
page = 385
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O slave Nanak, he crosses over the world's ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਲੇ ਨਾਨਕ! ਉਹ ਸੰਸਾਰ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- O Nanak, such a servant crosses over the ocean of Maya. ||4||5||56||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸੀ ਦਾਸ ਨੇ ਮਾਯਾ ਤਰੀ ਹੈ ਅਰਥਾਤ ਮਾਯਾ ਸੇ ਪਾਰ ਹੂਆ ਹੈ॥੪॥੫॥੪੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਾਸ ਨਾਨਕ! (ਆਖ-) ਉਸ ਨੇ ਮਾਇਆ (ਦੀ ਨਦੀ) ਪਾਰ ਕਰ ਲਈ ਹੈ ॥੪॥੫॥੫੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਰੀ = ਪਾਰ ਕਰ ਲਈ, ਪਾਰ ਲੰਘ ਗਿਆ। ਤਿਨਿ = ਉਸ (ਮਨੁੱਖ) ਨੇ ॥੪॥੫॥੫੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre del Señor, ese Devoto, oh, dice Nanak, cruza el mar de la Maya. (4‑5‑56)"