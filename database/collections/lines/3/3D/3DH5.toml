[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਰੂ ਕੀ ਭੀਤਿ ਜੈਸੇ; ਬਸੁਧਾ ਕੋ ਰਾਜੁ ਹੈ ॥੧॥"
page = 1352
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The empire of the earth is like the wall of sand."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਿਥਵੀ ਦੀ ਪਾਤਿਸ਼ਾਹੀ ਰੇਤੇ ਦੀ ਕੰਧ ਦੀ ਮਾਨੰਦ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The empires of the earth are like walls of sand. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਬਾਰੂ) ਮੋਟੇ ਰੇਤੇ ਕੀ ਦੀਵਾਰ ਜੈਸੇ ਇਸਥਿਤ ਨਹੀਂ ਰਹਿਤੀ ਤੈਸੇ ਹੀ ਇਹੁ (ਬਸੁਧਾ) ਪ੍ਰਿਥਵੀ ਕਾ ਰਾਜੁ ਹੈ, ਭਾਵ ਏਹ ਖਿ੍ਯਨ ਭੰਗਰ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਾਰੀ) ਧਰਤੀ ਦਾ ਰਾਜ (ਭੀ) ਰੇਤ ਦੀ ਕੰਧ ਵਰਗਾ ਹੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਰੂ = ਰੇਤ। ਭੀਤਿ = ਕੰਧ। ਬਸੁਧਾ = ਧਰਤੀ। ਕੋ = ਦਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las reglas del mundo son como murallas de arena. (1)"