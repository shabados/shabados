[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੀਤੇ ਕਾ; ਨਾਹੀ ਕਿਹੁ ਚਾਰਾ ॥"
page = 1042
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The created one no power before Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਚੇ ਹੋਏ ਦੀ ਉਸ ਦੇ ਅਗੇ ਕੋਈ ਸੱਤਿਆ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Created beings have no power over Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਊਪਰ ਇਸ ਕੀਏ ਹੂਏ ਜੀਵ ਕਾ ਕੁਛ ਬਲ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਜੀਵ ਉਸ ਦੀ ਤਾਕਤ ਦੇ ਅੱਗੇ ਅੜਨਾ ਚਾਹੇ, ਤਾਂ) ਉਸ ਦੇ ਪੈਦਾ ਕੀਤੇ ਹੋਏ ਜੀਵ ਦੀ ਪੇਸ਼ ਨਹੀਂ ਜਾ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਹੁ = ਕੁਝ ਭੀ। ਚਾਰਾ = ਜ਼ੇਰ, ਉਜ਼ਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, la criatura, es insignificante ante Él."