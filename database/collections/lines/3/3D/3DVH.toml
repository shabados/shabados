[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਧੂਹਿ ਮਿਆਨੋ ਲਈਆਂ, ਜੁਆਨੀ ਸੂਰਮੀ ॥"
page = 125

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The youthful warriors pulled out their swords from their scabbards."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਲਵਾਨ ਸੂਰਮਿਆਂ ਨੇ (ਤਲਵਾਰਾਂ) ਮਿਆਨਾਂ ਵਿਚੋਂ ਖਿਚ ਲਈਆਂ।"