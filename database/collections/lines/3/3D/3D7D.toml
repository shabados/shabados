data = "ਕਿਮ ਦੇਖੀਐ ਮੁਨਿ ਦੇਵ ॥੧੪੭॥"
page = 690

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O chief Guru! tell me the mystery as to how the sage can be seen ?”147."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਕਿਵੇਂ ਮੁਨੀ ਦੇਵ ਦੇ ਦਰਸ਼ਨ ਪ੍ਰਾਪਤ ਕਰਾਂ ॥੧੪੭॥"