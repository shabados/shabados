[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੁਗਾ ਜੁਗੰਤਰਿ; ਖਾਹੀ ਖਾਹਿ ॥"
page = 2
line = 2

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "\"ਖਾਹੀ\" ਦਾ ਉਚਾਰਨ \"ਖਾਹੀਂ\" ਕਰਨਾ ਠੀਕ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the ages through the partakers partake of His provision."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਮੂਹ ਜੁਗਾਂ ਅੰਦਰ ਖਾਣ ਵਾਲੇ ਉਸ ਦੇ ਪਦਾਰਥਾਂ ਨੂੰ ਖਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Throughout the ages, consumers consume."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੁਗੋਂ ਜੁਗੋਂ ਮੈ ਤਿਸਕੇ ਦੀਏ (ਥਾਹੀ) ਪਦਾਰਥੋਂ ਕੋ ਖਾਤੇ ਹੈਂ॥ ਵਾ ਪੁਨਃ ਪੁਨਃ ਖਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਭ ਜੀਵ) ਸਦਾ ਤੋਂ ਹੀ (ਰੱਬ ਦੇ ਦਿੱਤੇ ਪਦਾਰਥ) ਖਾਂਦੇ ਚਲੇ ਆ ਰਹੇ ਹਨ। ***"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੁਗਾ ਜੁਗੰਤਰਿ = ਜੁਗ ਜੁਗ ਅੰਤਰਿ, ਸਾਰੇ ਜੁਗਾਂ ਵਿਚ ਹੀ, ਸਦਾ ਤੋਂ ਹੀ। ਖਾਹੀ ਖਾਹਿ = ਖਾਂਦੇ ਹੀ ਖਾਂਦੇ ਹਨ, ਵਰਤਦੇ ਚਲੇ ਆ ਰਹੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por generaciones los consumidores consumen,"