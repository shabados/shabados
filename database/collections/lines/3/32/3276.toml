[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਆਗਿ ਚਲਿਓ ਹੈ; ਮੂੜ ਨੰਗ ॥੨॥"
page = 210
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the fool departs naked."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਲਾਂਜਲੀ ਦਾ ਮੂਰਖ ਨੰਗ-ਧੜੰਗਾ ਟੁਰ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- leaving these behind, the fool must depart naked. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੂਰਖ ਜੀਵ ਤਿਆਗ ਕਰ ਨਗਨ ਹੂਆ ਜਾਤਾ ਹੈ, ਭਾਵ ਏਹ ਕਿ ਸਰਬੰਸ ਸੇ ਰਹਤ ਹੂਆ ਖਾਲੀ ਚਲਾ ਜਾਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੂਰਖ ਮਨੁੱਖ ਇਹਨਾਂ ਨੂੰ ਛੱਡ ਕੇ (ਆਖ਼ਿਰ) ਨੰਗਾ ਹੀ (ਇਥੋਂ) ਤੁਰ ਪੈਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂੜ = ਮੂਰਖ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y dejando todo atrás, el ignorante parte desnudo.(2)"