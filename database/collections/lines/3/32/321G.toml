type = "primary"
data = "ਧਰਮ ਕਰਨ ਕੋ ਰਾਹੁ ਨ ਡਾਰਾ ॥੪੪॥"
page = 58

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They did not strike the tyrants and did not make them follow th path of Dharma.44."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਨਾ ਹੀ (ਲੋਕਾਂ ਨੂੰ) ਧਰਮ ਕਰਨ ਵਾਲੇ ਰਾਹ ਉਤੇ ਪਾਇਆ ਹੈ ॥੪੪॥"