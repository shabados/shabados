[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੈ ਮਘਵਾ ਬਲੁ ਕੈ ਛਲੁ ਕੈ; ਹਮਰੇ ਤਪ ਕੋ ਅਵਿਲੋਕਨ ਆਯੋ ॥"
page = 969

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘It could be Lord Indra, himself, who had grown them to test me,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਾਂ ਇੰਦਰ ਛਲ ਦੇ ਬਲ ਨਾਲ ਮੇਰੇ ਤਪ ਨੂੰ ਵੇਖਣ ਤਾਂ ਨਹੀਂ ਆਇਆ।"