[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਦਇਆ; ਲੇਹੁ ਲੜਿ ਲਾਇ ॥"
page = 838
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Mercifully attach me to Thy skirt."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿਹਰ ਧਾਰ ਕੇ ਮੈਨੂੰ ਆਪਣੇ ਪੱਲੇ ਨਾਲ ਜੋੜ ਲੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Be Merciful, and attach me to the hem of Your robe."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦਯਾ ਕਰ ਕੇ ਮੁਝ ਕੋ ਅਪਨੇ ਲੜ ਲਗਾਇ ਲੇਵਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਿਹਰ ਕਰ ਕੇ ਮੈਨੂੰ ਆਪਣੇ ਲੜ ਨਾਲ ਲਾ ਲੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ। ਲੜਿ = ਪੱਲੇ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ten Compasión de mí y deja que me aferre a Tu Túnica;"