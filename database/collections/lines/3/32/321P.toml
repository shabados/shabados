[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੁੰਢਹੁ ਭੁਲੇ ਮੁੰਢ ਤੇ; ਕਿਥੈ ਪਾਇਨਿ ਹਥੁ ॥"
page = 315
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who go astray from the Primal being from the very beginning where can they find refuge?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਰੰਭ ਤੋਂ ਹੀ ਆਦਿ ਪੁਰਖ ਪਾਸੋਂ ਖੁੰਝ ਗਏ ਹਨ, ਉਹ ਕਿਥੇ ਪਨਾਹ ਹਾਸਲ ਕਰ ਸਕਦੇ ਹਨ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who went astray from the Primal Being in the very beginning - where can they find refuge?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ (ਮੁੰਢਤੇ) ਮੂਲ ਰੂਪ ਪਰਮੇਸ੍ਵਰ ਸੇ (ਮੁੰਢਹੁ) ਆਦੋਂ ਜਨਮ ਕਾਲ ਸੇ ਹੀ ਭੂਲ ਗਏ ਹੈਂ, ਵਹੁ ਕਹਾ ਹਾਥ ਪਾਵੈ, ਭਾਵ ਯੇਹਿ ਕਿ ਉਨ ਕੋ ਕੋਈ ਆਸਰਾ ਨਹੀਂ ਮਿਲਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਪਹਿਲੋਂ ਤੋਂ ਹੀ ਪ੍ਰਭੂ ਵਲੋਂ ਖੁੰਝੇ ਹੋਏ ਹਨ, ਉਹ ਹੋਰ ਕਿਹੜਾ ਆਸਰਾ ਲੈਣ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Dónde pueden buscar refugio los que se alejaron del Señor desde el principio?"