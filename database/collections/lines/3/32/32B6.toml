[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛਤੀਹ ਅੰਮ੍ਰਿਤ ਪਰਕਾਰ ਕਰਹਿ; ਬਹੁ ਮੈਲੁ ਵਧਾਈ ॥"
page = 1246
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Eating ambrosial delicacies of thirty-six sorts, man greatly increases his filth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਛੱਤੀ ਕਿਸਮ ਦੇ ਅੰਮ੍ਰਿਤ-ਮਈ ਨਿਆਮਤਾਂ ਛਕ ਆਦਮੀ ਆਪਣੀ ਗੰਦਗੀ ਨੂੰ ਘਣੇਰੀ ਜਿਆਦਾ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Eating the thirty-six delicacies, they become bloated with pollution."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਛਤੀ ਪਰਕਾਰ ਕੇ ਅੰਮ੍ਰਿਤ ਰੂਪ ਭੋਜਨੋਂ ਕਾ ਜੋ ਖਾਣਾ ਕਰਤੇ ਹੈਂ ਤਿਸ ਕਰ ਦੇਹ ਰੂਪ ਬਹੁਤ ਮੈਲ ਵਧਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਕਈ ਕਿਸਮਾਂ ਦੇ ਸੁੰਦਰ ਸੁਆਦਲੇ ਖਾਣੇ ਖਾਂਦੇ ਹੋਣ (ਤਾਂ ਭੀ) ਬਹੁਤਾ ਵਿਸ਼ਟਾ ਹੀ ਵਧਾਂਦੇ ਹਨ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੈਲ = ਵਿਸ਼ਟਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Se alimenta sólo de delicias, pero la traición a su Conciencia continúa."