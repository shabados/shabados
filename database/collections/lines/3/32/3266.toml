[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਸਾਲਾਹੈ ਆਪ ਕਉ; ਵਡਹੁ ਵਡੇਰੀ ਹੋਇ ॥"
page = 58
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Every one lauds himself and deems himself the greatest of the great."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਕੋਈ ਆਪਣੇ ਆਪ ਦੀ ਪਰਸੰਸਾ ਕਰਦਾ ਹੈ ਅਤੇ ਆਪਣੇ ਆਪ ਨੂੰ ਮਹਾਨਾਂ ਦਾ ਪਰਮ ਮਹਾਨ ਖਿਆਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All praise themselves, and call themselves the greatest of the great."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਯਾਰੇ! ਸਭ ਕੋਈ ਅਭਮਾਨੁ ਕਰ ਕੇ ਅਪਨੇ ਕੋ ਸਲਾਹਤਾ ਹੈ ਕਿ ਮੇਰੀ ਸੋਭਾ ਬਡੋਂ ਸੇ ਬਡੀ ਹੋਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੀ ਦੁਨੀਆ ਆਪਣੇ ਆਪ ਨੂੰ ਸਾਲਾਹੁੰਦੀ ਹੈ ਕਿ ਸਾਡੀ ਵਧੀਕ ਤੋਂ ਵਧੀਕ ਵਡਿਆਈ-ਇੱਜ਼ਤ ਹੋਵੇ (ਆਪਣੇ ਆਪ ਦੀ ਸੂਝ ਤੋਂ ਬਿਨਾ ਇਹ ਲਾਲਸਾ ਬਣੀ ਹੀ ਰਹਿੰਦੀ ਹੈ।)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪ ਕਉ = ਆਪਣੇ ਆਪ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cada uno grita más fuerte, uno más que el otro, pero sin el Guru, no conocemos nuestro ser interior,"