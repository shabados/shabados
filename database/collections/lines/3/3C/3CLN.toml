[[content]]
assets = ["SSKS"]
type = "primary"
data = "ਜੈਸੇ ਮ੍ਰਿਦ ਸੌਰਭ ਕਮਲ ਓਰ ਧਾਇ ਜਾਇ; ਮਧੁਪ ਸਮੂਹ ਸੁਭ ਸਬਦ ਉਚਾਰਹੀ ॥"

[[content]]
assets = ["SSPK"]
type = "translation"
language = "en"
data = "Just as attracted by the fragrance, a bunch of bumble bees invade lotus flowers resoundingly."

[[content]]
assets = ["SSSK"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਕੋਮਲ ਕਵਲ ਫੁੱਲ ਦੀ ਸੁਗੰਧੀ ਵਲ ਸਮੂਹ ਭੌਰੇ ਸੋਹਣਾ ਸ਼ਬਦ ਕਰਦੇ ਹੋਏ ਦੌੜ ਕੇ ਜਾਂਦੇ ਹਨ।"