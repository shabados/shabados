[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸੁਖ ਫਲੁ, ਆਸ ਨਿਰਾਸਾ ॥੧੩॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Remaining detached amidst hopes and desires is the pleasure fruit for the gurmukhs."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ ਜੋ) ਗੁਰਮੁਖ (ਹਨ) ਆਸਾ ਥੋਂ ਨਿਰਾਸ ਰਹਿੰਦੇ ਨ, (ਏਸ ਲਈ) ਸੁਖ ਫਲ (ਉਹਨਾਂ ਨੂੰ) ਪ੍ਰਾਪਤ ਹੁੰਦਾ ਹੈ।"