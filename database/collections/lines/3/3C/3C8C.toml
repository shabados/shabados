[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁਨੁ ਸਾਚ ਨ੍ਰਿਪੰ ॥੪੦॥"
page = 617

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“If now you are forsaking me, then why did you own me at that time? O king! I am saying the truth that he is your son.40."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਜਨ! ਸੁਣੋ, (ਮੈਂ) ਸੱਚ ਕਹਿ ਰਹੀ ਹਾਂ ॥੪੦॥"