[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਬਲਿ ਰਾਜਾ ਘਰਿ ਆਪਣੈ; ਅੰਦਰਿ ਬੈਠਾ ਜਗਿ ਕਰਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Bali, the king, was busy in performing a yajna in his palace."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਰਾਜਾ ਬਲਿ ਆਪਣੇ ਘਰ ਅੰਦਰ ਬੈਠਾ ਜੱਗ ਕਰਾਉਂਦਾ ਸੀ।"