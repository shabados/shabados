[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਬੁਲੁ ਮੇਰਾ ਵਡ ਸਮਰਥਾ; ਕਰਣ ਕਾਰਣ ਪ੍ਰਭੁ ਹਾਰਾ ॥"
page = 778
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Father is very powerful. The Lord is the doer of all the deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਪਿਤਾ ਬੜਾ ਬਲਵਾਨ ਹੈ। ਸੁਆਮੀ ਸਾਰਿਆਂ ਕੰਮਾਂ ਦਾ ਕਰਨ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My Father is absolutely all-powerful. God is the Doer, the Cause of causes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਿਤਾ ਮੇਰਾ ਵਾਹਗੁਰੂ ਜੋ ਹੈ ਵਹੁ ਵਡਾ ਸਾਮ੍ਰਥੁ ਹੈ, ਵਹੁ ਪ੍ਰਭੂ ਕਾਰਣ ਜੋ ਮਹਿਤਤ੍ਵਾਦਿ ਹੈਂ, ਸੋ ਸਭ ਕੇ ਕਰਣੇਹਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੇਰਾ ਪ੍ਰਭੂ-ਪਿਤਾ ਬੜੀਆਂ ਤਾਕਤਾਂ ਦਾ ਮਾਲਕ ਹੈ, ਉਹ ਪ੍ਰਭੂ ਹਰੇਕ ਸਬਬ ਬਣਾ ਸਕਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਬੁਲੁ = ਪਿਤਾ-ਪ੍ਰਭੂ। ਸਮਰਥਾ = ਤਾਕਤਾਂ ਦਾ ਮਾਲਕ। ਕਰਣ ਕਾਰਣ ਹਾਰਾ = ਕਾਰਣ ਕਰਣਹਾਰਾ, ਹਰੇਕ ਸਬਬ ਬਣਾ ਸਕਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Padre es Todopoderoso, Dios es el Hacedor y la Causa de causas,"