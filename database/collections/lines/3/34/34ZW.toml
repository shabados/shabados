[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਨ ਕਮਲ ਕੀ ਮਉਜ ਮਹਿ; ਰਹਉ. ਅੰਤਿ ਅਰੁ ਆਦਿ ॥੧੨੦॥"
page = 1370
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In enjoy abiding in the Lord's lotus feet, in the beginning and at the end."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਰੰਭ ਅਤੇ ਅਖੀਰ ਵਿੱਚ ਮੈਂ ਪ੍ਰਭੂ ਦੇ ਕੰਵਲ ਪੈਰਾਂ ਦੀ ਖੁਸ਼ੀ ਅੰਦਰ ਵਸਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "From beginning to end, I abide in the joy of the Lord's Lotus Feet. ||120||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਤਿਨ ਸਤਿਗੁਰੋਂ ਕੇ ਚਰਨ ਕਮਲੋਂ ਕੀ ਖੁਸ਼ੀ ਮੇਂ ਹੀ ਆਦਿ ਔਰ ਅੰਤ, ਭਾਵ ਸਦਾ ਹੀ ਰਹਿਤਾ ਹੂੰ॥੧੨੦॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤਾਂ ਸਦਾ ਹੀ ਪਰਮਾਤਮਾ ਦੇ ਸੋਹਣੇ ਚਰਨਾਂ (ਦੀ ਯਾਦ) ਦੇ ਹੁਲਾਰੇ ਵਿਚ ਰਹਿੰਦਾ ਹਾਂ ॥੧੨੦॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਉਜ = ਲਹਰ, ਹੁਲਾਰਾ। ਅੰਤਿ ਅਰੁ ਆਦਿ = ਸ਼ੁਰੂ ਤੋਂ ਅਖ਼ੀਰ ਤਕ, ਸਦਾ ਹੀ ॥੧੨੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "de principio a fin me regocijo en la Dicha de los Pies de Loto del Señor. (120)"