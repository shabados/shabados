[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹੂੰ ਨ ਪਾਵਤਿ ਹੋਨਿ ਅਨੀਤਾ ॥"
page = 624

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The traditions of Dharma became prevalent in all directions and there was no misconduct anywhere"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਿਤੇ ਵੀ ਅਨੀਤੀ ਨਹੀਂ ਹੋ ਸਕਦੀ ਸੀ।"