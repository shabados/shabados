[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਛਬਿ ਕੀ ਉਪਮਾ ਅਤਿ ਹੀ; ਕਬਿ ਨੇ ਮੁਖ ਤੇ ਇਮ ਭਾਖਿ ਸੁਣਾਈ ॥"
page = 311

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The poet has described that scene like this,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੀ ਮਹਾਨ ਸੁੰਦਰਤਾ ਦੀ ਉਪਮਾ ਕਵੀ ਨੇ ਮੂੰਹ ਤੋਂ ਇਸ ਤਰ੍ਹਾਂ ਦੀ ਕਹਿ ਕੇ ਸੁਣਾਈ"