type = "primary"
data = "ਘਨੌ ਸੀਂਚਿ ਕੈ ਬਾਰਿ ਗੁਲਾਬ ਵਾ ਕੌ ॥"
page = 1002

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "People came running, lifted him up and sprinkled rose water over him."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਉਤੇ ਗੁਲਾਬ ਦਾ ਬਹੁਤ ਅਰਕ ਛਿੜਕਿਆ।"