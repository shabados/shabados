[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ ਪੂਰਨ ਨਿਰਜੋਗ ॥੧॥"
page = 888
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remaining perfectly detached, the saints contemplate their Supreme Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰੀ ਤਰ੍ਹਾਂ ਨਿਰਲੇਪ ਰਹਿੰਦੇ ਹੋਏ, ਸੰਤ ਆਪਣੇ ਸ਼੍ਰੋਮਣੀ ਸਾਹਿਬ ਦਾ ਸਿਮਰਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They remain totally detached, absorbed in the Supreme Lord God. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਾਰਬ੍ਰਹਮ ਪੂਰਨ ਕੇ ਸਾਥ ਤਿਨ ਕਾ ਵਿਸੇਸ ਕਰ ਕੇ (ਜੋਗ) ਮਿਲਾਪ ਹੂਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਪ੍ਰਭੂ ਨਾਲ ਜੁੜੇ ਰਹਿੰਦੇ ਹਨ ਜੋ) ਨਿਰਲੇਪ ਤੇ ਸਰਬ-ਵਿਆਪਕ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਜੋਗ = ਨਿਰਲੇਪ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y viviendo desapegados, están íntegramente entonados en su Dios Trascendente. (1)"