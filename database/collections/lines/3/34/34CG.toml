type = "primary"
data = "ਕਰੀ ਮਤ ਪਾਛੈ ਤਵ ਧਾਯੋ ॥"
page = 918

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "’I was in deep slumber, when I saw an elephant charging after you."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਮਸਤ ਹਾਥੀ ਤੁਹਾਡੇ ਪਿਛੇ ਪਿਆ ਹੋਇਆ ਹੈ।"