[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਰੀਮੇ ਖ਼ਤਾ ਬਖ਼ਸ਼ ਦਾਨਸ਼ ਪਜ਼ੀਰ ॥੨॥"
page = 1406

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "You recognise our deficiency, and are our redeemer.(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਕ੍ਰਿਪਾ ਕਰਨ ਵਾਲਾ, ਖਿਮਾ ਕਰਨ ਵਾਲਾ ਅਤੇ ਅੰਦਰ ਦੀਆਂ ਜਾਣਨ ਵਾਲਾ ਹੈਂ ॥੨॥"