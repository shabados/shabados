[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੁਦਰਤਿ ਬੀਚਾਰੇ ਧਾਰਣ ਧਾਰੇ; ਜਿਨਿ ਕੀਆ ਸੋ ਜਾਣੈ ॥"
page = 580
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who has created the universe, gives thought to His creation. He, who has created, alone knows."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਆਲਮ ਰੱਚਿਆ ਹੈ, ਉਹੀ ਆਪਣੀ ਰਚਨਾ ਵੱਲ ਧਿਆਨ ਦਿੰਦਾ ਹੈ। ਜਿਸ ਨੇ ਰੱਚਿਆ ਹੈ, ਉਹੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He contemplates His creative potency, having established the Universe. He who created it, He alone knows."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੀ ਮਾਇਆ ਕਰ ਜਗਤ ਕੀ ਧਾਰਣਾ ਧਾਰ ਰਿਹਾ ਹੈ, ਪੁਨਾ ਜੀਵਾਂ ਕੇ ਸੁਭ ਅਸੁਭ ਕਰਮ ਬੀਚਾਰ ਕੇ ਜਿਨ ਕੀਤਾ ਹੈ ਜਗਤ ਕੋ ਸੋਈ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪਣੀ ਰਚੀ ਰਚਨਾ ਦਾ ਖ਼ਿਆਲ ਰੱਖਦਾ ਹੈ, ਇਸ ਨੂੰ ਆਸਰਾ-ਸਹਾਰਾ ਦੇਂਦਾ ਹੈ, ਜਿਸ ਨੇ ਜਗਤ ਰਚਿਆ ਹੈ ਉਹੀ ਇਸ ਦੀਆਂ ਲੋੜਾਂ ਭੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਾਰਣ ਧਾਰੇ = ਆਸਰਾ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor crea todo, lo observa todo, y medita en Su Creación;"