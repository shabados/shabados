[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੀਤ ਪ੍ਰੀਤ ਤਜਿ ਕੈ ਹਨਾ; ਸਤੁਦ੍ਰਵ ਦਯੋ ਬਹਾਇ ॥੧੨॥"
page = 878

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And he was killed and thrown in the River Satluj.(12)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਿਤਰ ਦੇ ਪ੍ਰੇਮ ਨੂੰ ਤਿਆਗ ਕੇ ਉਸ ਨੂੰ ਮਾਰ ਦਿੱਤਾ ਅਤੇ ਸਤਲੁਜ ਨਦੀ ਵਿਚ ਰੋੜ੍ਹ ਦਿੱਤਾ ॥੧੨॥"