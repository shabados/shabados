[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਕਬੀਰ; ਇਕ ਬੁਧਿ ਬੀਚਾਰੀ ॥"
page = 328
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir, I have obtained one piece of knowledge by reflection,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ, ਸੋਚ ਵਿਚਾਰ ਦੁਆਰਾ ਮੈਂ ਇਕ ਗਿਆਤ ਪ੍ਰਾਪਤ ਕੀਤੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, through contemplation, I have obtained this one understanding."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਏਕ ਬਾਤ ਬੁਧੀ ਮੇਂ ਵੀਚਾਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ- ਅਸਾਂ ਇਕ ਸੋਚ ਸੋਚੀ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੁਧਿ = ਅਕਲ, ਸੋਚ। ਬੀਚਾਰੀ = ਵਿਚਾਰੀ ਹੈ, ਸੋਚੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, he meditado sobre la maldad en el mundo, pero,"