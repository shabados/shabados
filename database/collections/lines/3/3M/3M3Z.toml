data = "ਸਿਮਰਿ ਸਿਮਰਿ; ਸਿਮਰਿ ਪ੍ਰਭੁ ਸੋਇ ॥"
page = 281
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remember, remember, remember that Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਯਾਦ ਕਰ, ਯਾਦ ਕਰ, ਯਾਦ ਕਰ ਉਸ ਸੁਆਮੀ ਨੂੰ,"

[[content]]
