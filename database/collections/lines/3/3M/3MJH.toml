[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੁਰਝਾਇ ਗਏ ਬਿਨੁ ਤੈ ਹਰਿ ਜੂ; ਨਹਿ ਖੇਲਤ ਹੈ ਫੁਨਿ ਗ੍ਵਾਰਿਨ ਮੈ ॥"
page = 366

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Krishna has withered without you and he does not even play with other gopis now"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਬਿਨਾ ਕ੍ਰਿਸ਼ਨ ਜੀ ਮੁਰਝਾ ਗਏ ਹਨ ਅਤੇ ਫਿਰ ਗੋਪੀਆਂ ਵਿਚ ਆ ਕੇ ਖੇਡਦੇ ਨਹੀਂ ਹਨ।"