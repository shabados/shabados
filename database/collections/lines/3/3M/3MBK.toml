[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਰੇ; ਕਹਾ ਭਇਓ ਤੈ ਬਉਰਾ ॥"
page = 220
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man, why hast thou become crazy?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਇਨਸਾਨਾਂ ਤੂੰ ਝੱਲਾ ਕਿਉਂ ਹੋ ਗਿਆ ਹੈਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mind, why have you gone crazy?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਤੂੰ ਕਹਾਂ ਬਉਰਾ ਹੋ ਰਹਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਮਨ! ਤੂੰ ਕਿੱਥੇ (ਲੋਭ ਆਦਿਕ ਵਿਚ ਫਸ ਕੇ) ਪਾਗਲ ਹੋ ਰਿਹਾ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹਾ = ਕਿਥੇ? ਬਉਰਾ = ਪਾਗਲ, ਕਮਲਾ, ਝੱਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente, ¿Por qué te has vuelto loca?"