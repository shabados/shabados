[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੜ ਕੋ ਕਹਾ ਸੰਘਾਰਿਬੈ, ਜਾ ਕੋ ਰਿਝਲ ਸੁਭਾਵ ॥੬॥"
page = 910

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Only the simpleton, who is very naive, is easy to annihilate.’(6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਮੂਰਖ ਨੂੰ ਮਾਰਨਾ (ਕੀ ਔਖਾ ਹੈ) ਜਿਸ ਦਾ ਸੁਭਾ ਜਲਦੀ ਰੀਝ ਪੈਣ ਵਾਲਾ ਹੋਵੇ ॥੬॥"