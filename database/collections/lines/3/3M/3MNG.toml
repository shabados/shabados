[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਹੁ ਪਾਤਿਸਾਹੁ ਸਭੁ ਹਰਿ ਕਾ ਕੀਆ; ਸਭਿ ਜਨ ਕਉ ਆਇ ਕਰਹਿ ਰਹਰਾਸਿ ॥"
page = 305
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Kings and emperors are all created by God. They all come and make obeisance unto the Lord's servant."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਜੇ ਅਤੇ ਮਹਾਰਾਜੇ ਸਾਰੇ ਵਾਹਿਗੁਰੂ ਦੇ ਕੀਤੇ ਹੋਏ ਹਨ। ਉਹ ਸਾਰੇ ਆ ਕੇ ਸੁਆਮੀ ਦੇ ਗੋਲੇ, ਮੂਹਰੇ ਬੰਦਨਾ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Kings and emperors are all created by the Lord; they all come and bow in reverence to the Lord's humble servant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਹੂਕਾਰ ਔਰ ਪਾਤਸਾਹ ਸਭੀ ਹਰੀ ਕਾ ਕੀਆ ਹੂਆ ਹੈ, ਭਗਤ ਜਨੋਂ ਕੋ ਸਭ ਆਇ ਕਰ (ਰਹਰਾਸਿ) ਨਮਸਕਾਰ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਥੋਂ ਤਕ ਕਿ) ਸ਼ਾਹ ਪਾਤਸ਼ਾਹ (ਭੀ) ਸਾਰੇ ਹਰੀ ਦੇ ਦਾਸ ਦੇ ਅੱਗੇ ਸਿਰ ਨਿਵਾਉਂਦੇ ਹਨ (ਕਿਉਂਕਿ ਉਹ ਭੀ ਤਾਂ) ਸਾਰੇ ਪ੍ਰਭੂ ਦੇ ਹੀ ਬਣਾਏ ਹੋਏ ਹਨ (ਪ੍ਰਭੂ ਦੇ ਦਾਸ ਤੋਂ ਆਕੀ ਕਿਵੇਂ ਹੋਣ)?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਹਰਾਸਿ = ਬੇਨਤੀ, ਅਰਦਾਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es el Señor Quien instala a los hombres como emperadores y reyes, y aquél que ha sido ungido por el Señor es aclamado y reverenciado por todos los hombres."