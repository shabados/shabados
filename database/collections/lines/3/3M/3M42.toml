[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸ︀ਯਾਮ ਚਿਤਾਰਿ ਸਭੈ ਤਹ ਗ੍ਵਾਰਨਿ ਸ︀ਯਾਮ ਕਹੈ ਜੁ ਹੁਤੀ ਬਡਭਾਗੀ ॥"
page = 384

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The poet Shyam says, “Those very fortunate gopis are remembering Krishna"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਵੀ) ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, ਜੋ ਉਥੇ ਵਡਭਾਗਣਾਂ (ਗੋਪੀਆਂ) ਸਨ, ਉਹ ਸਾਰੀਆਂ ਗੋਪੀਆਂ ਕ੍ਰਿਸ਼ਨ ਨੂੰ ਯਾਦ ਕਰਦੀਆਂ ਹਨ।"