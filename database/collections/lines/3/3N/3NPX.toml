[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਗੁਰ ਕੈ ਜਾਈਐ ਬਲਿਹਾਰੀ; ਸਦਾ ਸਦਾ ਹਉ ਵਾਰਿਆ ॥੧॥ ਰਹਾਉ ॥"
page = 1218
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto that Guru, I am a sacrifice. Ever, ever devoted unto him, am I. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਗੁਰਾਂ ਉਤੋਂ, ਮੈਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ। ਹਮੇਸ਼ਾ, ਹਮੇਸ਼ਾਂ ਹੀ ਹਾਂ ਮੈਂ ਸਦਕੇ, ਉਸ ਗੁਰਦੇਵ ਉਤੋਂ, ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to that Guru; I am devoted to Him, forever and ever. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਗੁਰੂ ਕੇ ਤਨ ਕਰ ਕੇ ਬਲਿਹਾਰਨੇ ਜਾਤਾ ਹੂੰ ਔਰ ਮਨ ਕਰ ਕੇ ਭੀ (ਸਦਾ ਸਦਾ) ਨਿਤੰਪ੍ਰਤੀ ਵਾਰਨੇ ਜਾਤਾ ਹੂੰ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਗੁਰੂ ਤੋਂ ਸਦਕੇ ਜਾਣਾ ਚਾਹੀਦਾ ਹੈ। ਮੈਂ (ਉਸ ਗੁਰੂ ਤੋਂ) ਸਦਾ ਹੀ ਸਦਾ ਹੀ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ = ਤੋਂ। ਵਾਰਿਆ = ਸਦਕੇ, ਕੁਰਬਾਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ofrezco así mi ser en sacrificio a Él. (1-Pausa)"