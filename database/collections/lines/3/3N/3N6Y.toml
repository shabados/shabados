[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰੋਗ ਸੋਗ ਤੇ ਰਾਖੁ ਅਬਿਨਾਸੀ ॥੫॥"
page = 190

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Therefore, I narrate it in brief and O Lord! protect me form ailment and suffering.5."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਬਿਨਾਸੀ! (ਮੇਰੀ) ਰੋਗਾਂ ਸੋਗਾਂ ਤੋਂ ਰਖਿਆ ਕਰੋ ॥੫॥"