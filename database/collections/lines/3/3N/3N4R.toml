[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਪੂਰੇ ਗੁਰ ਤੇ; ਸੋਝੀ ਹੋਈ ॥"
page = 1039
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who has obtained understanding from the Perfect Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਪੂਰਨ ਗੁਰਾਂ ਪਾਸੋਂ ਗਿਆਤ ਪ੍ਰਾਪਤ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "who obtains perfect understanding from the Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਪੂਰੇ ਗੁਰੋਂ ਤੇ ਸੋਝੀ ਹੋਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਪੂਰੇ ਗੁਰੂ ਤੋਂ (ਉੱਚੀ) ਸਮਝ ਮਿਲਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਤੇ = ਗੁਰੂ ਤੋਂ, ਗੁਰੂ ਪਾਸੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aquél cuya mente está despierta a través del Guru Perfecto."