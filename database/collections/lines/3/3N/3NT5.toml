[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਰੰ ਬਾਮ ਚਾਪਿਯੰ ਕ੍ਰਿਪਾਣੰ ਕਰਾਲੰ ॥"
page = 41

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He holds the bow in His left hand and the terrible sword (in the right)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਦੇ) ਖਬੇ ਹੱਥ ਵਿਚ ਧਨੁਸ਼ (ਅਤੇ ਸਜੇ ਹੱਥ ਵਿਚ) ਭਿਆਨਕ ਤਲਵਾਰ ਹੈ।"