[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨਿ. ਪ੍ਰਭਿ ਮਾਰੇ ਨਾਨਕਾ; ਹੋਇ ਹੋਇ ਮੁਏ ਹਰਾਮੁ ॥੧॥"
page = 315
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They are smitten by that Lord and they die a miserable death, O Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਸਾਹਿਬ ਨੇ ਉਨ੍ਹਾਂ ਨੂੰ ਮਾਰਿਆਂ ਹੈ ਅਤੇ ਉਹ ਕੁਮੈਤੇ ਮਰਦੇ ਹਨ, ਹੇ ਨਾਨਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They are struck down by God, O Nanak, and they die a most miserable death. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਨ ਅਕਿਰਤਘਣੋਂ ਕੋ ਪ੍ਰਭੂ ਮਾਰਤਾ ਹੈ, (ਹਰਾਮੁ) ਅਧਰਮੀ ਹੋਇ ਹੋਇ ਕਰ ਮਰੇ ਹੈਂ॥੧॥☬ਜੇ ਕਹੇ ਜੋ ਨਿੰਦਕੋਂ ਕੋ ਔਰ ਅਕਿਰਤਘਣੋਂ ਕੋ ਦੁਖ ਹੋਤਾ ਹੈ। ਬ੍ਰਹਮਾ ਜੀ ਨੇ ਤਿਸ ਕੀ ਕੁਛ ਔਸ਼ਧੀ ਭੀ ਰਚੀ ਹੋਵੇਗੀ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਇਹਨਾਂ ਦੁੱਖਾਂ ਵਿਚ) ਪ੍ਰਭੂ ਦੁਆਰਾ ਆਤਮਿਕ ਮੌਤੇ ਮਾਰੇ ਹੋਏ ਉਹ ਖ਼ੁਆਰ ਹੋ ਹੋ ਕੇ ਮਰਦੇ ਹਨ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "los malagradecidos son conducidos ahí, y abandonados por el Señor, son destruidos. (1)"