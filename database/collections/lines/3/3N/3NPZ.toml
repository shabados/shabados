data = "ਘਾਟ ਗੜਨ ਹਿਤ ਤਾਹਿ ਬੁਲਾਯੋ ॥੧॥"
page = 895

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She called him to get the ornaments made.(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ (ਗਹਿਣਿਆਂ ਦੀ) ਘਾੜਤ ਘੜਨ ਲਈ ਬੁਲਾ ਲਿਆ ॥੧॥"