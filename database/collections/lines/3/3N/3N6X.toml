[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਲਭ ਦੇਹ; ਹੋਈ ਪਰਵਾਨੁ ॥"
page = 193
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then the difficult to obtain body is approved,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਦੋਂ ਮੁਸ਼ਕਲ ਨਾਲ ਮਿਲਣ ਵਾਲਾ ਸਰੀਰ ਕਬੂਲ ਪੈ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This human body, so difficult to obtain, is redeemed"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤਿਨ ਪੁਰਸ਼ੋਂ ਕੀ ਦੁਰਲਭ ਦੇਹ ਪਰਵਾਨ ਭਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮੇਰੇ ਭਾਈ!) ਉਹਨਾਂ ਦਾ ਮਨੁੱਖਾ ਸਰੀਰ-ਬੜੀ ਕਠਨਤਾ ਨਾਲ ਮਿਲਿਆ ਹੋਇਆ ਮਨੁੱਖਾ ਸਰੀਰ-(ਪਰਮਾਤਮਾ ਦੀਆਂ ਨਜ਼ਰਾਂ ਵਿਚ) ਕਬੂਲ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਹ = ਸਰੀਰ, ਮਨੁੱਖਾ ਸਰੀਰ। ਦੁਲਭ = ਜੇਹੜਾ ਬੜੀ ਮੁਸ਼ਕਲ ਨਾਲ ਮਿਲਦਾ ਹੈ। ਤੇ = ਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Este cuerpo humano, tan difícil de obtener, es redimido"