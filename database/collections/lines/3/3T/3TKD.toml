type = "primary"
data = "ਜਾਇ ਤਵਨ ਕੌ ਤੁਰਤ ਹਕਾਰੈ ॥"
page = 989

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "If anyone going astray from his way came across, he would invite hirn immediately."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤਾਂ) ਉਸ ਨੂੰ ਤੁਰਤ ਜਾ ਕੇ ਵੰਗਾਰਦਾ।"