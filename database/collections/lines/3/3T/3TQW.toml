[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਰਿ ਕਰਿ ਵੇਖੈ ਚਾਉ, ਲਖ ਪਰਤਾਪਦਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He sees His own activities with great enthusiasm and makes many a man glorious"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਉਹ ਅਪਣੀ ਰਚਨਾਂ ਨੂੰ) ਕਰ ਕਰ ਕੇ ਚਾਉ ਨਾਲ ਦੇਖਦਾ ਅਰ ਲੱਖਾਂ ਨੂੰ ਪ੍ਰਤਾਪਵਾਨ ਕਰ ਰਿਹਾ ਹੈ।"