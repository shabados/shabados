[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਮ੍ਰਿਤ ਰਸੁ ਹਰਿ ਪਾਇਆ; ਬਿਖਿਆ ਰਸ ਫੀਕੇ ਰਾਮ ॥"
page = 848
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have obtained the Nectar of God's love and the revelments of sins seem insipid unto me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਵਾਹਿਗੁਰੂ ਦੇ ਪ੍ਰੇਮ ਦਾ ਆਬਿ-ਹਿਯਾਤ ਪਰਾਪਤ ਕਰ ਲਿਆ ਹੈ ਅਤੇ ਪਾਪਾਂ ਦੇ ਸੁਆਦ ਮੈਨੂੰ ਫਿਕੇ ਭਾਸਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have obtained the Ambrosial Nectar of the Lord's Love, and now the taste of corruption is insipid and tasteless to me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕਾ ਰਾਮ ਨਾਮ ਅੰਮ੍ਰਤ ਰਸ ਹਮਨੇ ਪਾਇਆ ਹੈ, ਤਿਸੀ ਤੇ ਔਰ ਵਿਸਿਓਂ ਕੇ ਰਸ ਸਭ ਫੀਕੇ ਲਾਗੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਪਰਮਾਤਮਾ ਦਾ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਰਸ ਪ੍ਰਾਪਤ ਕਰ ਲਿਆ, ਉਸ ਨੂੰ ਮਾਇਆ ਦੇ ਸਾਰੇ ਸੁਆਦ ਫਿੱਕੇ ਜਾਪਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਮ੍ਰਿਤ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ। ਬਿਖਿਆ ਰਸ = ਮਾਇਆ ਦੇ ਸੁਆਦ। ਫੀਕੇ = ਬੇ-ਸੁਆਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y todos los demás sabores se vuelven insípidos y viciosos."