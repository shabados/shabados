data = "ਕੈ ਭਜੀਐ ਕੈ ਜੂਝ ਮਰਈਯੈ ॥੧੯੩੬॥"
page = 491

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Tell us some remedy, so that either we may die fighting or run away.1936."

