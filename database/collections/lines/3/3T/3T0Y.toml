[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤੁ ਭਗਤੁ; ਸੁਨੀਐ ਤਿਹੁ ਲੋਇ ॥"
page = 283
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within whose mind is the Unique Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਤਿੰਨਾਂ ਜਹਾਨਾਂ ਅੰਦਰ ਸੰਤ ਤੇ ਅਨੁਰਾਗੀ ਪਰਸਿਧ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is acclaimed as a devotee, a humble devotee throughout the three worlds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਜਨੁ ਭਗਤੁ ਭਗਤੁ ਤੀਨੋਂ ਲੋਕੋਂ ਮੇਂ ਸੁਣੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਸਾਰੇ ਜਗਤ ਵਿਚ ਭਗਤ ਭਗਤ ਸੁਣੀਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਨੀਐ = ਸੁਣਿਆ ਜਾਂਦਾ ਹੈ। ਤਿਹੁ ਲੋਇ = ਤਿੰਨਾਂ ਲੋਕਾਂ ਵਿਚ, ਤ੍ਰਿਲੋਕੀ ਵਿਚ, ਸਾਰੇ ਜਗਤ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es considerado devoto , devoto humilde alrededor de los tres mundos."