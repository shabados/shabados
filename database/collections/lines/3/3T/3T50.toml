[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਨੁ ਮਨੁ ਸਭੁ ਸੀਤਲੁ ਭਇਆ; ਪਾਇਆ ਸੁਖੁ ਬੀਰ ॥੧॥ ਰਹਾਉ ॥"
page = 814
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My body and soul are all cooled and I have obtained peace, O brother. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਦੇਹ ਅਤੇ ਆਤਮਾ ਠੰਢੜੇ ਹੋ ਗਏ ਹਨ ਅਤੇ ਮੈਂ ਆਰਾਮ ਪਰਾਪਤ ਕਰ ਲਿਆ ਹੈ, ਹੇ ਭਾਰਾਵਾਂ! ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My body and mind are totally cooled and soothed; I have found peace, O my brother. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਬੀਰ) ਹੇ ਭਾਈ! ਤਿਸੀ ਸਮੇਂ ਹਮਾਰਾ ਤਨੁ ਮਨੁ ਸਰਬ ਸੀਤਲੁ ਭਯਾ ਹੈ ਅਰੁ ਸੁਖ ਕੋ ਪਾਇ ਲੀਆ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਸ ਦਾ ਮਨ ਉਸ ਦਾ ਤਨ ਠੰਢਾ-ਠਾਰ ਹੋ ਜਾਂਦਾ ਹੈ, ਉਸ ਨੂੰ ਆਤਮਕ ਆਨੰਦ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੀਤਲੁ = ਸ਼ਾਂਤ। ਬੀਰ = ਹੇ ਭਾਈ! ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mi cuerpo y mi mente se han confortado y he encontrado el Éxtasis.(1-Pausa)"