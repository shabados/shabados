[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਚੀਨ ਚਤੁਰ ਚਿਤਿ ਲੇਹੁ ॥੬੮੩॥"
page = 749

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The names of Tupak are formed by firstly uttering the word “Neer” and then adding the words “Taru-Prashthani”.683."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤੁਪਕ ਦਾ ਨਾਮ ਬਣ ਜਾਵੇਗਾ। ਸੂਝਵਾਨੋ! ਵਿਚਾਰ ਲਵੋ ॥੬੮੩॥"