type = "primary"
data = "ਅਖੈਦਾਨ ਖੇਦਨ ਅਖਿਜ; ਅਨਛਿਦ੍ਰ ਅਛੇਦਨ ॥"
page = 130

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Affliction of the Unafflicted, Blissful without blemish and the Unassailable."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੁਖਾਂ ਤੋਂ ਰਹਿਤ ਨੂੰ ਦੁਖ ਪਹੁੰਚਾਉਣ ਵਾਲੇ, ਨਾ ਖਿਝਣ ਵਾਲੇ, ਨਾ ਛੇਦੇ ਜਾ ਸਕਣ ਵਾਲੇ,"