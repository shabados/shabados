[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਹਿ ਭਗਤਿ ਅਰੁ ਰੰਗ ਅਪਾਰਾ ॥"
page = 1074
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints meditate on Thee and bear Thee infinite love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਤੈਨੂੰ ਆਰਾਧਦੇ ਅਤੇ ਬੇਅੰਤ ਪਿਆਰ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your devotees worship You with infinite love."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਪਾਰ! ਤੇਰੇ ਪ੍ਰੇਮ ਕੋ ਧਾਰ ਕੇ ਪੁਨਃ ਤੇਰੇ ਭਗਤ ਜਨ ਭਗਤੀ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅਨੇਕਾਂ ਭਗਤ) ਬੇਅੰਤ ਪ੍ਰਭੂ ਦੀ ਭਗਤੀ ਕਰਦੇ ਹਨ ਅਤੇ ਆਤਮਕ ਆਨੰਦ ਮਾਣਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਹਿ = ਕਰਦੇ ਹਨ। ਅਰੁ = ਅਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones hay que Te alaban y Te adoran amorosamente."