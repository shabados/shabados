[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸਫਲ ਜਨੰਮੁ, ਜਗਿ ਵਿਚਿ ਆਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Blest is the birth of a gurmukh and his coming to this world."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾ ਨੇ ਜਗ ਵਿਖੇ ਆਕੇ ਆਪਣਾ ਜਨਮ (ਭਜਨ ਕਰ ਕੇ ਸਫਲ) ਕਰ ਲੀਤਾ ਹੈ।"