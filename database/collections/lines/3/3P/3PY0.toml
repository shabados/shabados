[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੀ ਸੇਵਾ; ਸੋ ਜਨੁ ਪਾਏ ॥"
page = 1270
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That person alone is blessed with the service of the Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਸ ਪੁਰਸ਼ ਨੂੰ ਹੀ ਗੁਰਾਂ ਦੀ ਚਾਕਰੀ ਪਰਾਪਤ ਹੁੰਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That humble being serves the Guru,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਸੇਵਾ ਜੋ ਪੁਰਸ ਪਾਵਤਾ ਹੈ ਅਰਥਾਤ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਉਹ ਮਨੁੱਖ (ਹੀ) ਗੁਰੂ ਦੀ ਸੇਵਾ (ਦਾ ਅਵਸਰ) ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ese humilde ser sirve al Guru,"