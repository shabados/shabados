line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is surrounded by sins."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਾਪਾਂ ਦਾ ਘੇਰਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and is surrounded by corruption and sin."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਿਖ੍ਯੋਂ ਕਾ ਅਵਰਿਆ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਿਸ਼ੇ-ਵਿਕਾਰਾਂ ਵਿਚ ਘਿਰਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਖਨਾ = ਵਿਸ਼ਿਆਂ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "rodeado por la maldad por todas partes."