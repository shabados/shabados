[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਏ ਕ੍ਰਿਪਾਲ; ਗੁਪਾਲ ਗੋਬਿੰਦ ॥"
page = 391
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the world-Cherisher and the master of the universe, becomes merciful,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ੍ਰਿਸ਼ਟੀ ਦਾ ਪਾਲਣ ਪੋਸਣਹਾਰ ਅਤੇ ਆਲਮ ਦਾ ਮਾਲਕ ਮਿਹਰਵਾਨ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord of the Universe, the Cherisher of the World, has become merciful;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਪ੍ਰੀਤੀ ਕਰਤਿਆਂ ਜਬ ਸੇਵਾ ਸੇ ਗੋਬਿੰਦ ਕ੍ਰਿਪਾਲ ਹੂਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬਖ਼ਸ਼ਣਹਾਰ ਗੁਪਾਲ ਗੋਬਿੰਦ-ਪ੍ਰਭੂ ਜੀ ਉਸ ਉਤੇ ਦਇਆਵਾਨ ਹੋ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਪਾਲ = ਧਰਤੀ ਦਾ ਪਾਲਣਹਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Soporte de la Tierra y así como me uno a la Sociedad de los Santos,"