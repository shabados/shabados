[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ; ਹਿਰਦੈ ਵਸਿਆ ਸਚੁ ਸੋਇ ॥"
page = 232
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "when that True One abides within his mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਹ ਸਤਿਪੁਰਖ ਉਸ ਦੇ ਮਨ ਵਿੱਚ ਵਸ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "when the True Lord abides within the heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸੇ ਸਚਾ ਵਾਹਿਗੁਰੂ ਹਿਰਦੇ ਮੇਂ ਵਸਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਹਿਰਦੇ ਵਿਚ ਉਹ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਪਰਮਾਤਮਾ ਆ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ = ਜਦੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por la Gracia del Guru, el Uno Verdadero habita en su corazón;"