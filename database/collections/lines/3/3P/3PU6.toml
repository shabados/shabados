[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੋਇ ਅਉਧੂਤ; ਬੈਠੇ ਲਾਇ ਤਾਰੀ ॥"
page = 1004
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Becoming ascetics some sit in trance."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਰੱਕਤ ਹੋ, ਕਈ ਸਮਾਧੀਆਂ ਲਾ ਕੇ ਬਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some become hermits, and sit in meditative trances."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਅਉਧੂਤ) ਤਿਆਗੀ ਹੋਇ ਕਰਿ ਤਾੜੀ ਭੀ ਲਾਇ ਬੈਠੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਈ ਐਸੇ ਹਨ ਜੋ ਤਿਆਗੀ ਬਣ ਕੇ ਸਮਾਧੀ ਲਾ ਕੇ ਬੈਠਦੇ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਉਧੂਤ = ਤਿਆਗੀ। ਤਾਰੀ = ਤਾੜੀ, ਸਮਾਧੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunos los hay que se vuelven hermitaños y se sientan en trance meditativo,"