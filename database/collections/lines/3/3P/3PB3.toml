[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਿਤੇ ਨਿਧਨ ਕਹੁੰ ਪ੍ਰਾਪਤਿ ਭਏ ॥"
page = 114

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All those demons, carrying their weapons, came in front of the goddess were all subjected to death."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ (ਸਾਰਿਆਂ ਦੀ) ਮ੍ਰਿਤੂ ਹੋ ਗਈ।"