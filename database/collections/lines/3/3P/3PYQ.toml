[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਸਥਿਰੁ; ਸੇ ਭਏ ਹਾਂ ॥"
page = 410
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They alone become eternal,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਓਹੀ, ਨਿਹਚਲ ਹੁੰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They alone become eternal,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਇਸਥਰ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਅਡੋਲ ਆਤਮਕ ਜੀਵਨ ਵਾਲੇ ਬਣ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇ = ਉਹ ਬੰਦੇ। ਅਸਥਿਰੁ = ਅਡੋਲ ਆਤਮਕ ਜੀਵਨ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, se vuelve eterno y siempre duradero"