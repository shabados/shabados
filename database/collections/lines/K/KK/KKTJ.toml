[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਬੈ ਬਿਉਤ ਡਾਰੇ ਬਗਾ ਸੇ ਅਸ੍ਵਾਰੰ ॥੫੦॥"
page = 69

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The heroes of Jaswal ran towards him. The horsemen were cut in the manner the cloth is cut (by the tailor).50."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਨ੍ਹਾਂ ਨੇ) ਸਾਰਿਆਂ ਸਵਾਰਾਂ ਨੂੰ ਕਪੜਿਆਂ ਵਾਂਗ ਵਿਉਂਤ ਦਿੱਤਾ (ਅਰਥਾਤ ਕਤਰ ਦਿੱਤਾ।)॥੫੦॥"