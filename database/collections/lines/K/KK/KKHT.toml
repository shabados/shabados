[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਲ ਪਾਇ ਕਟ︀ਯੋ ਤਬੈ ਤਹਿ ਆਨ ਕੈ ਅਹਿਰਾਇ ॥੭॥੧੬੩॥"
page = 141

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But within the due time, the king snakes came there and bit (the king).7.163."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਪਰੰਤੂ) ਵਕਤ ਆਉਣ ਤੇ ਸੱਪਾਂ ਦੇ ਰਾਜੇ (ਤੱਛਕ) ਨੇ ਤਦੋਂ ਉਥੇ ਆ ਕੇ ਡਸ ਲਿਆ ॥੭॥੧੬੩॥"