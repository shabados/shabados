[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਾਇ ਸਮਾਇਣੁ, ਦਹੀ ਬਿਲੋਵੈ ॥੭॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Further, the curd is made by mixing a small quantity of rennet into milk (and thus butter is obtained)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਨਿੱਕੀ) ਜਾਗ ਲਾਕੇ ਲੋਕ ਦਹੀਂ ਰਿੜਕਦੇ ਹਨ।"