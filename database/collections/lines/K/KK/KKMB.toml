[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਉ ਜੀਵਨੁ; ਪ੍ਰੀਤਮ ਬਿਨੁ. ਮਾਈ ॥"
page = 1207
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How can I live without my Love, O mother?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਪਿਆਰੇ ਦੇ ਬਗੈਰ ਕਿਸ ਤਰ੍ਹਾਂ ਜੀ ਸਕਦੀ ਹਾਂ, ਹੇ ਮਾਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How can I live without my Beloved, O my mother?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮਾਈ) ਸੰਤ ਜਨੋ! ਮੇਰਾ ਪ੍ਰੀਤਮ ਪਰਮੇਸ੍ਵਰ ਸੇ ਬਿਨਾ ਕੈਸੇ ਜੀਵਨਾ ਹੋਵੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੀ) ਮਾਂ! ਉਸ ਪ੍ਰੀਤਮ ਪ੍ਰਭੂ ਦੀ ਯਾਦ ਤੋਂ ਬਿਨਾ ਆਤਮਕ ਜੀਵਨ ਹਾਸਲ ਨਹੀਂ ਹੋ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਉਂ = ਕਿਵੇਂ? ਨਹੀਂ ਹੋ ਸਕਦਾ। ਜੀਵਨੁ = ਆਤਮਕ ਜੀਵਨ। ਪ੍ਰੀਤਮ ਬਿਨੁ = ਪਿਆਰੇ ਪ੍ਰਭੂ (ਦੀ ਯਾਦ) ਤੋਂ ਬਿਨਾ। ਮਾਈ = ਹੇ ਮਾਂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh madre, ¿cómo estar sin mi Amor?"