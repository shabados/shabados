[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੀ ਗਤਿ ਮਿਤਿ ਲਖੀ. ਨ ਜਾਇ; ਹਉ ਤੁਧੁ ਬਲਿਹਾਰੀਐ ॥੧॥"
page = 518
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thine condition and extent cannot be known, I am a sacrifice unto Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਅਵਸਥਾ ਅਤੇ ਵਿਸਥਾਰ ਜਾਣੇ ਨਹੀਂ ਜਾ ਸਕਦੇ। ਮੈਂ ਤੇਰੇ ਉਤੋਂ ਕੁਰਬਾਨ ਵੰਞਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your condition and state cannot be known; I am a sacrifice to You. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਗਤੀ ਔ ਮਰਜਾਦਾ ਸਮਝੀ ਨਹੀਂ ਜਾਤੀ, ਤਾਂ ਤੇ ਮੈਂ ਤੇਰੇ ਪਰ ਬਲਿਹਾਰ ਜਾਤਾ ਹੂੰ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਗੱਲ ਬਿਆਨ ਨਹੀਂ ਕੀਤੀ ਜਾ ਸਕਦੀ ਕਿ ਤੂੰ ਕਿਹੋ ਜਿਹਾ ਹੈਂ ਤੇ ਕੇਡਾ ਵੱਡਾ ਹੈਂ, ਮੈਂ ਤੈਥੋਂ ਸਦਕੇ ਹਾਂ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਤਿ = ਹਾਲਤ। ਮਿਤਿ = ਮਿਣਤੀ, ਅੰਦਾਜ਼ਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tu Estado nadie lo conoce; oh, yo ofrezco mi ser en sacrificio a Ti. (1)"