[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਿਸਦਾ ਸਭੁ ਕਿਛੁ ਚਲਸੀ; ਮੇਰੇ ਪ੍ਰਭ ਭਾਇਆ ॥"
page = 1250
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All that comes to view, shall pass away. This is the will of my Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਾ ਕੁਝ ਜੋ ਨਜ਼ਰੀ ਪੈਦਾ ਹੈ, ਨਾਸ ਹੋ ਜਾਏਗਾ। ਇਹ ਹੈ ਰਜਾ ਮੇਰੇ ਸੁਆਮੀ ਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All that is seen shall pass away. This is the Will of my God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਦ੍ਰਿਸਟ ਆਵਤਾ ਹੈ ਸਭੀ ਕਿਛ ਚਲਾ ਜਾਵੇਗਾ, ਮੇਰੇ ਪ੍ਰਭੂ ਕੋ ਏਹੀ ਭਾਇਆ ਹੈ॥☬ਪ੍ਰਸ਼ਨ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ, ਮੇਰੇ ਪ੍ਰਭੂ ਦਾ ਭਾਣਾ ਇਹ ਹੈ ਕਿ ਜੋ ਕੁਝ (ਅੱਖੀਂ) ਦਿੱਸਦਾ ਹੈ ਇਹ ਸਭ ਨਾਸ ਹੋ ਜਾਣਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਲਸੁ = ਨਾਸ ਹੋ ਜਾਇਗੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero mira, todo lo que parece desvanecerá, tal es la Voluntad del Señor."