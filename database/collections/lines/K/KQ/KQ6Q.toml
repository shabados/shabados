type = "primary"
data = "ਤੌ ਦਾਤਾ ਤੂ ਜਾਨ ਹਮਾਰੈ ॥੭॥"
page = 981

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘If you give me all your arms, only then I will consider you benevolent person.’(7)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੁਸੀਂ (ਆਪਣੇ ਆਪ ਨੂੰ) ਸਾਡਾ ਦਾਤਾ ਸਮਝੋ ॥੭॥"