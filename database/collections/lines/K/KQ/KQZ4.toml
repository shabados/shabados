[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਚੁ ਕੂੜੈ ਲੈ, ਨਿਹਣਿ ਬਹੰਦਾ ॥੬॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The truth ultimately puts shackles around the falsehood."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸੱਚ ਕੂੜੇ ਨੂੰ ਕੈਦੀ ਕਰ ਕੇ (ਕੈਦ ਵਿਖੇ) ਬਿਠਾ ਰੱਖਦਾ ਹੈ।"