[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋਰ ਪ੍ਰਨਾਮ ਕਰੋ ਹਮ ਕੋ ਕਰ; ਸਉਹ ਲਗੈ ਤੁਮ ਮੇਰੀ ਹਹਾ ਹੈ ॥"
page = 320

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Bow before me with folded hands  I tell you on oath that from today you are mine,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੱਥ ਜੋੜ ਕੇ ਮੈਨੂੰ ਪ੍ਰਣਾਮ ਕਰੋ (ਅਤੇ ਬਸਤ੍ਰ ਲੈ ਲਵੋ)। (ਜੇ ਨਹੀਂ ਕਰੋਗੀਆਂ ਤਾਂ) ਤੁਹਾਨੂੰ ਮੇਰੀ ਸੌਂਹ ਲਗੇ।"