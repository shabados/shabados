[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਡਿਠਾ ਸਭੁ ਸੰਸਾਰੁ; ਸੁਖੁ ਨ. ਨਾਮ ਬਿਨੁ ॥"
page = 322
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have seen the whole world, there is no peace without the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਾਰਾ ਜਹਾਨ ਵੇਖ ਲਿਆ ਹੈ, ਬਗੈਰ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੇ ਕੋਈ ਆਰਾਮ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have seen the whole world - without the Lord's Name, there is no peace at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਪੂਰਨ ਜਗਤ ਦੇਖਿਆ ਹੈ ਨਾਮ ਸੇ ਬਿਨਾਂ ਸੁਖ ਕਿਸੀ ਕੋ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰਾ ਸੰਸਾਰ (ਟੋਲ ਕੇ) ਵੇਖਿਆ ਹੈ, ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਤੋਂ ਬਿਨਾ ਸੁਖ ਨਹੀਂ ਮਿਲਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He visto el mundo entero en todos sus aspectos y he concluido que no hay Paz sin el Naam."