[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇਵਕ ਭਾਇ ਮਿਲੇ ਵਡਭਾਗੀ; ਜਿਨ ਗੁਰ ਚਰਨੀ ਮਨੁ ਲਾਗਾ ॥"
page = 572
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The fortunate ones, whose mind is attached to Guru's feet, meet the Lord through the servant's sentiments."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੰਗੇ ਕਰਮਾਂ ਵਾਲੇ ਜਿਨ੍ਹਾਂ ਦਾ ਚਿੱਤ ਗੁਰਾਂ ਦੇ ਪੈਰਾਂ ਨਾਲ ਜੁੜਿਆ ਹੋਇਆ ਹੈ, ਦਾਸ-ਭਾਵਨਾ ਰਾਹੀਂ ਸਾਹਿਬ ਨੂੰ ਮਿਲ ਪੈਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through their loving service, those very fortunate ones, whose minds are attached to the Guru's Feet, meet Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕਾ ਗੁਰ ਚਰਨੋਂ ਮੇਂ ਮਨ ਲਾਗਾ ਹੈ, ਸੋਈ ਵਡਭਾਗੀ ਸੇਵਕ ਭਾਇ ਕਰ ਗੁਰੋਂ ਮੇਂ ਮਿਲੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਵੱਡੇ ਭਾਗਾਂ ਵਾਲੇ ਮਨੁੱਖਾਂ ਦਾ ਮਨ ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਵਿਚ ਜੁੜ ਗਿਆ, ਉਹ ਸੇਵਕ ਭਾਵਨਾ ਦੀ ਰਾਹੀਂ (ਪਰਮਾਤਮਾ ਵਿਚ) ਮਿਲ ਗਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵਕ ਭਾਇ = ਸੇਵਕ ਵਾਲੀ ਭਾਵਨਾ ਨਾਲ, ਸੇਵਕ ਵਾਲੇ ਪਿਆਰ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, el Señor Mismo nos une en Su Ser, y encontrando al Verdadero Guru,"