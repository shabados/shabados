data = "ਸਾ ਬੰਦੀ ਤੇ; ਲਈ ਛਡਾਇ ॥"
page = 374
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "is delivered from the bondage."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਕੈਦ ਤੋਂ ਖਲਾਸੀ ਪਾ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "is delivered from bondage."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਸੰਸਾਰ ਕੇ ਜਨਮ ਮਰਨ ਰੂਪ (ਬੰਦੀ) ਬੰਦੀਖਾਨੇ ਸੇ ਛੁਡਾਇ ਲਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਉਹ (ਲੋਭ ਕ੍ਰੋਧ ਕਾਮ ਆਦਿਕ ਦੀ) ਕੈਦ ਤੋਂ ਛਡਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੰਦੀ = ਗ਼ੁਲਾਮੀ, ਕੈਦ।"

[[content]]
