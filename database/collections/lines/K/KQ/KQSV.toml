[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਰਿ ਸਚੈ ਸਚੀ ਵਡਿਆਈ; ਸਹਜੇ ਸਚਿ ਸਮਾਉ ॥"
page = 31
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the True Court they obtains true honour and are easily absorbed in the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਦਰਬਾਰ ਅੰਦਰ ਉਹ ਸੱਚਾ ਮਾਣ ਪਾਉਂਦੇ ਹਨ ਅਤੇ ਸੁਖੈਨ ਹੀ ਸੱਚੇ ਸਾਈਂ ਅੰਦਰ ਲੀਨ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Court of the True One, they are blessed with true greatness; they are intuitively absorbed into the True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚੇ ਵਾਹਿਗੁਰੂ ਕੇ ਦ੍ਵਾਰੇ ਤਿਨ ਕੋ ਸੱਚੀ ਵਡਿਆਈ ਪ੍ਰਾਪਤ ਹੋਤੀ ਹੈ, ਪੁਨਃ ਸਹਿਜੇ ਹੀ ਸਚੇ ਪਰਮੇਸ੍ਵਰ ਮੇਂ ਸਮਾਇ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਨੂੰ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ ਸਦਾ ਲਈ ਇੱਜ਼ਤ ਮਿਲ ਜਾਂਦੀ ਹੈ, ਆਤਮਕ ਅਡੋਲਤਾ ਦੀ ਬਰਕਤਿ ਨਾਲ ਉਹਨਾਂ ਨੂੰ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਵਿਚ ਲੀਨਤਾ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਰਿ = ਦਰ ਤੇ। ਸਚੀ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ellos se funden en la Verdad, en Estado de Equilibrio y cantan las Alabanzas del Señor en Su Puerta."