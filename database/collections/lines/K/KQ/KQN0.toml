[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮੁ; ਐਸੋ ਆਗਨਤਾ ॥"
page = 260
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "So Infinite is the Supreme Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹੋ ਜਿਹਾ ਅਨੰਤ ਹੈ ਪਰਮ ਪ੍ਰਭੂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such is the Infinite, Supreme Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਪਾਰਬ੍ਰਹਮ) ਵਾਹਿਗੁਰੂ ਐਸਾ ਅਗਿਨਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਾਰਬ੍ਰਹਮ ਬੜਾ ਬੇਅੰਤ ਹੈ (ਬੇ-ਪਰਵਾਹ ਹੈ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਗਨਤਾ = ਬੇਅੰਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal es el Indescriptible Señor,"