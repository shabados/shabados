data = "ਹਮ ਯਹੀ ਸੁਖ ਕਰ ਕੇ ਜਾਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮੇਰੇ ਮਨ!) ਇਸੇ ਨੂੰ ਹੀ ਸੁਖ (ਦਾ ਮੂਲ) ਸਮਝਣਾ ਚਾਹੀਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਨੀਐ = ਪਰਵਾਨ ਕਰੀਏ।"

[[content]]
assets = ["SNST"]
