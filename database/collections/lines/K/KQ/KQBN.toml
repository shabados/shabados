[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Undersatnd that happiness lies in,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਾਣ ਲੈ ਕਿ ਖੁਸ਼ੀ ਕੇਵਲ ਇਸ ਵਿੱਚ ਹੈ,"

[[content]]
assets = ["DSSK"]
