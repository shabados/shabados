[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧੂ ਕੇ; ਪੂਰਨ ਉਪਦੇਸੇ ॥"
page = 287
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by the perfect instruction of the saint."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਦੀ ਪੂਰੀ ਸਿਖ-ਮਤ ਦੁਆਰਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "by the perfect Teachings of the Holy Saint."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਜਨੋਂ ਕੌ ਪੂਰਨ ਸੰਤੋਂ ਕੇ ਉਪਦੇਸ ਹੋਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਗੁਰੂ ਦੇ ਉਪਦੇਸ਼ ਦਾ ਸਦਕਾ ਹੀ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧੂ = ਗੁਰੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por la Perfecta Enseñanza del Santo,"