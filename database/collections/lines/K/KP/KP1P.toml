[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ ਪ੍ਰਭ ਭਏ ਦਇਆਲਾ; ਦੁਖੁ ਮਿਟਿਆ ਸਭ ਪਰਵਾਰੀ ॥੧॥"
page = 620
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Transcendent Lord Master has become merciful and the entire family, is rid off the malady."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਪ੍ਰਭੂ ਸੁਆਮੀ ਮਿਹਰਬਾਨ ਹੋ ਗਿਆ ਹੈ, ਅਤੇ ਮੇਰੇ ਸਾਰੇ ਟੱਬਰ-ਕਬੀਲੇ ਦਾ ਦੁੱਖੜਾ ਦੂਰ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Lord God has become kind and compassionate, and my whole family is now free of pain and suffering. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਾਰਬ੍ਰਹਮ ਸਮਰਥ ਹਮਾਰੇ ਪਰ ਐਸੇ ਦਿਆਲ ਹੂਏ ਹੈਂ ਕਿ ਸਭ ਪਰਵਾਰ ਕੇ ਪੁਰਸੋਂ ਕਾ ਦੁਖ ਮਿਟ ਗਇਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਇਆਵਾਨ ਹੋਇਆ ਹੈ, ਸਾਰੇ ਪਰਵਾਰ ਦਾ ਦੁੱਖ ਮਿਟ ਗਿਆ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਵਾਰੀ = ਪਰਵਾਰ ਦਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, el Señor Trascendente es Compasivo y mi familia se ha liberado de su mal. (1)"