[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਚੇਤਿ; ਮਨ ਮੇਰੇ ॥ ਰਹਾਉ ॥"
page = 1185
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, remember thou thy God. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਤੂੰ ਆਪਣੇ ਵਾਹਿਗੁਰੂ ਦਾ ਸਿਮਰਨ ਕਰ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, remain conscious of the Lord. ||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ (ਮਨਿ) ਹਰੀ ਪ੍ਰਭੂ ਸਮਰਥ ਕੋ ਚੇਤੋ॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਪਰਮਾਤਮਾ ਨੂੰ ਯਾਦ ਕਰਦਾ ਰਹੁ ॥ ਰਹਾਉ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਰਹਾਉ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Mente mía, alaba solo a tu Señor. (Pausa"