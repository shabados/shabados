[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਨ ਸੁਹੇਲਾ; ਪਰਪੰਚੁ ਹੀਲਾ ॥੩॥"
page = 179
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the heart becomes not happy by such deceptive efforts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਛਲੀਏ ਹੀਲਿਆਂ ਦੁਆਰਾ, ਦਿਲ ਪਰਸੰਨ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- but still, the mind is not made happy by such illusory diversions. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਮਨ ਸੁਖੀ ਨ ਹੂਆ॥☬ਪ੍ਰਸ਼ਨ: ਕਿਆ ਕਾਰਣ?☬ਉਤਰੁ: ਏਹਿ ਜਗਤ (ਹੀਲਾ) ਦੁਖ ਰੂਪ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹਨਾਂ ਸਭਨਾਂ ਨਾਲ ਭੀ) ਮਨ ਸੁਖੀ ਨਹੀਂ ਹੁੰਦਾ। ਇਹ ਸਾਰਾ ਜਤਨ ਛਲ ਹੀ ਸਾਬਤ ਹੁੰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਹੇਲਾ = ਸੌਖਾ। ਪਰਪੰਚੁ = ਛਲ। ਹੀਲਾ = ਉੱਦਮ, ਜਤਨ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nada de eso ha hecho a la mente feliz, sólo han probado ser pura ilusión.(3)"