[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਾਇ ਰਹੀ ਉਰ ਸੋ ਤਿਹ ਕੋ; ਮੁਖ ਤੇ ਕਹਿਯੋ ਬਾਤ ਸੁਨੋ ਮਤਵਾਰੇ ॥"
page = 297

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Devaki had hugged the female infant to her bosom  she said,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਦੇਵਕੀ) ਉਸ ਨੂੰ ਛਾਤੀ ਨਾਲ ਲਗਾ ਰਹੀ ਸੀ ਅਤੇ ਮੂੰਹੋਂ ਕੰਸ ਨੂੰ ਕਹਿ ਰਹੀ ਸੀ, ਹੇ ਪਾਗਲ!"