[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚਾਰਿ ਵਰਨ ਗੁਰਸਿਖ ਹੋਇ; ਸਾਧਸੰਗਤਿ ਸਤਿਗੁਰ ਸਰਣਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "All the four vamas come to the shelter of the true Guru in the form of holy congregation"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਚਾਰੇ ਵਰਣ ਗੁਰੂ ਦੇ ਸਿਖ ਹੋਕੇ, ਸਾਧ ਸੰਗਤ ਦੁਆਰਾ ਸਤਿਗੁਰੂ ਦੀ ਸ਼ਰਣ ਆਏ।"