[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਖੁ ਸੁਖੁ; ਸਾਚੁ ਕਰਤੇ ਪ੍ਰਭ ਪਾਸਿ ॥੧॥ ਰਹਾਉ ॥"
page = 352
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Woe and weal are in the hand of Lord, the true creator. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗ਼ਮੀ ਤੇ ਖੁਸ਼ੀ ਸੱਚੇ ਸਿਰਜਣਹਾਰ ਸੁਆਮੀ ਦੇ ਹੱਥ ਵਿੱਚ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Pain and pleasure are in the Hands of God, the True Creator. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨਾ ਦੁਖ ਸੁਖ ਸਚ ਰੂਪ ਕਰਤਾ ਪੁਰਖ ਕੇ ਪਾਸ ਨਿਵੇਦਨ ਕਰਤੇ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਯਕੀਨ ਜਾਣੋ ਕਿ ਹਰੇਕ ਜੀਵ ਦਾ ਦੁੱਖ-ਸੁਖ ਉਹ ਕਰਤਾਰ ਪ੍ਰਭੂ ਜਾਣਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚੁ = ਇਹ ਯਕੀਨ ਜਾਣੋ। ਪ੍ਰਭ ਪਾਸਿ = ਪ੍ਰਭੂ ਦੇ ਕੋਲ, ਪ੍ਰਭੂ ਜਾਣਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues el dolor, el placer y la Verdad están en las Manos del Señor. (1-Pausa)"