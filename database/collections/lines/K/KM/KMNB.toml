[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਪਨੇ ਸੇਤੀ ਚਿਤੁ; ਮੂਰਖਿ ਲਾਇਆ ॥"
page = 707
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The fool attaches his mind with the dream."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੂੜ ਆਪਣੇ ਮਨ ਨੂੰ ਸੁਫਨੇ ਦੇ ਨਾਲ ਜੋੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The fool attaches his consciousness to the dream."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਪਨੇ ਕੇ ਪਦਾਰਥੋਂ ਸਾਥ ਇਸ ਮੂਰਖ ਜੀਵ ਨੇ ਅਪਨਾ ਚਿਤ ਲਗਾਇਆ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੂਰਖ ਮਨੁੱਖ ਨੇ ਸੁਪਨੇ ਨਾਲ ਪਿਆਰ ਪਾਇਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਤੀ = ਨਾਲ। ਮੂਰਖਿ = ਮੂਰਖ ਨੇ। ਜਾਗਤ = ਜਾਗਦਾ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que no conoce otra cosa, enamorado de su sueño,"