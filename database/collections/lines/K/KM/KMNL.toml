data = "ਦੁ ਕਸ ਰਾ ਬਜ਼ਾਂ ਕੁਸ਼ਤ ਹਮ ਜਾਂ ਸਪੁਰਦ ॥੩੩॥"
page = 1391

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "and was drenched with last.33."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਡੇ ਦੋ ਆਦਮੀ ਮਾਰ ਦਿੱਤੇ ਅਤੇ (ਆਪਣੀ) ਜਾਨ ਵੀ ਸਪੁਰਦ ਕਰ ਗਿਆ (ਅਰਥਾਤ ਮਰ ਗਿਆ) ॥੩੩॥"