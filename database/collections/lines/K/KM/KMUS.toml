[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਦਾ ਏਕ ਰੂਪੰ ਸਦਾ ਨਿਰਬਿਕਾਰੰ ॥"
page = 46

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Who is ever monomorphic and ever without vices."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ) ਸਦਾ ਇਕ ਰੂਪ ਅਤੇ ਵਿਕਾਰਾਂ ਤੋਂ ਰਹਿਤ! (ਤੈਨੂੰ) ਨਮਸਕਾਰ ਹੈ।"