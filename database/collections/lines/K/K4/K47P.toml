[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁ ਕੋ ਅਜੀਤ ਹੈ ਰਹਾ, ਉਚਾਰ ਤਾਸੁ ਕੀਜੀਯੈ ॥"
page = 691

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“You may tell me the name of that mighty one unhesitatingly, who is still unconquerable."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੋ ਕੌਣ ਅਜਿਤ ਰਹਿ ਗਿਆ ਹੈ, ਉਸ ਬਾਰੇ ਦਸ ਦਿਓ।"