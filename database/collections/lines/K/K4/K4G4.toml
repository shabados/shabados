[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕੁ ਗਰੀਬੁ ਬੰਦਾ ਜਨੁ ਤੇਰਾ ॥"
page = 676
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Poor Nanak is a slave and a serf of Thine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗਰੀਬੜਾ ਨਾਨਕ, ਤੇਰਾ ਗੋਲਾ ਅਤੇ ਗੁਮਾਸ਼ਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Poor Nanak is Your slave, Your humble servant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਮੈਂ ਜਨੁ ਗਰੀਬ ਤੇਰਾ (ਬੰਦਾ) ਦਾਸ ਹਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗਰੀਬ ਨਾਨਕ ਤੇਰਾ ਦਾਸ ਹੈ ਤੇਰਾ ਗ਼ੁਲਾਮ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨੁ = ਦਾਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, ese pobre ser es Tu Esclavo, oh Señor,"