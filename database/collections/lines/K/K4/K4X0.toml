[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਰੇ; ਗਹਿਓ ਨ. ਗੁਰ ਉਪਦੇਸੁ ॥"
page = 633
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man, thou hast not embraced the Guru's teaching."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੰਦੇ! ਤੈਂ ਗੁਰਾਂ ਦੀ ਸਿੱਖਿਆ ਨੂੰ ਗ੍ਰਹਿਣ ਨਹੀਂ ਕੀਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mind, you have not accepted the Guru's Teachings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਜਿਸ ਨੇ ਗੁਰੋਂ ਕਾ ਉਪਦੇਸ਼ ਗ੍ਰਹਣ ਨਹੀਂ ਕੀਆ ਹੂਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਤੂੰ ਗੁਰੂ ਦੀ ਸਿੱਖਿਆ ਗ੍ਰਹਿਣ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਹਿਓ = ਫੜਿਆ, ਗ੍ਰਹਿਣ ਕੀਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, no aceptaste la Sabiduría del Guru;"