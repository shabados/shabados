[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਮਰੀ ਕ੍ਰਿਪਾ ਮਹਿ; ਸੂਖ ਘਨੇਰੇ ॥"
page = 268
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In Thine grace lie many comforts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਦਇਆਲਤਾ ਅੰਦਰ ਬਹੁਤ ਆਰਾਮ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In Your Grace, there are so many joys!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਤੁਮਾਰੀ ਕ੍ਰਿਪਾ ਸੇ ਹੀ ਹਮ ਕੋ ਬਹੁਤ ਸੁਖ ਪਾ੍ਰਪਤ ਹੋਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਮੇਹਰ (ਦੀ ਨਜ਼ਰ) ਵਿਚ ਬੇਅੰਤ ਸੁਖ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਨੇਰੇ = ਬਹੁਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y nuestra alegría depende de Tu Gracia."