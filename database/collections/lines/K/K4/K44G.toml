[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਠਾਕੁਰ ਸਿਉ; ਨਾਹੀ ਚਾਰਾ ॥"
page = 268
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord with whom force is of no avail,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸੁਆਮੀ ਮੂਹਰੇ ਜੋਰ ਨਹੀਂ ਚਲਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Our Lord and Master cannot be moved by force."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਭਾਈ! ਜਿਸ ਸ੍ਵਾਮੀ ਸਾਥ ਕੁਛ (ਚਾਰਾ) ਬਲ ਨਾ ਚਲ ਸਕੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਾਲਕ ਦੇ ਨਾਲ ਪੇਸ਼ ਨਹੀਂ ਜਾ ਸਕਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਾਰਾ = ਜ਼ੋਰ, ਪੇਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Maestro, ante Quien todos somos impotentes."