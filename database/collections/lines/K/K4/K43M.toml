[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਾਹੁ ਵਾਹੁ ਸਤਿਗੁਰੁ ਸਤਿ ਪੁਰਖੁ ਹੈ; ਜਿਸ ਨੋ ਸਮਤੁ ਸਭ ਕੋਇ ॥"
page = 1421
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hail, hail is unto the True Guru, the Truth incarnate, in whose eyes all are alike."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ਾਬਾਸ਼, ਸ਼ਾਬਾਸ਼! ਹੈ ਸੱਚ ਦੇ ਅਵਤਾਰ ਸਚੇ ਗੁਰਾਂ ਨੂੰ ਜਿਨ੍ਹਾਂ ਦਿਆ ਲੇਤ੍ਰਾਂ ਅੰਦਰ ਸਾਰੇ ਇਕ-ਸਮਾਨ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Waaho! Waaho! Blessed and Great is the True Guru, the True Primal Being, who looks upon all alike."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸਤਿਗੁਰ ਸਤਪੁਰਖ ਕਉ ਧੰਨ ਧੰਨ ਹੈ ਜਿਨ ਕੋ ਸਭ ਕੋਈ ਸਮ ਹੀ ਦ੍ਰਿਸਟ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਸੱਤ ਪੁਰਖ ਸਲਾਹੁਣ-ਜੋਗ ਹੈ ਧੰਨ ਹੈ, ਕਿਉਂਕਿ ਉਸ ਨੂੰ ਹਰੇਕ ਜੀਵ ਇਕੋ ਜਿਹਾ (ਦਿੱਸਦਾ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸ ਨੋ = (ਸੰਬੰਧਕ 'ਨੋ' ਦੇ ਕਾਰਨ ਲਫ਼ਜ਼ 'ਜਿਸੁ' ਦਾ (ੁ) ਉਡ ਗਿਆ ਹੈ)। ਸਮਤੁ = ਇਕੋ ਜਿਹਾ। ਸਭ ਕੋਇ = ਹਰੇਕ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él ha encontrado al Señor Verdadero. Encontrándolo,"