[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਫੇਰਿ ਕਹੀ ਮੁਖਿ ਤੇ ਗੁਪੀਆ; ਹਮਰੇ ਪਟ ਦੇਹੁ ਕਹਿਯੋ ਨੰਦ ਲਾਲਾ ॥"
page = 318

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The gopis said again, “O son of Nand! give us the clothes, we are good women"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਗੋਪੀਆਂ ਨੇ ਫਿਰ ਮੂੰਹ ਤੋਂ ਇਹ ਗੱਲ ਕਹੀ, ਹੇ ਨੰਦ ਲਾਲ! ਸਾਡੇ ਕਪੜੇ ਦੇ ਦਿਓ!"