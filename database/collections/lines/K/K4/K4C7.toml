[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੰਧਨ ਮੁਕਤਾ; ਜਾਤੁ. ਨ ਦੀਸੈ ॥੧॥"
page = 1318
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is free from entanglements and does not seem to belong to any casts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਬੰਧਨਾਂ ਤੋਂ ਆਜ਼ਾਦ ਹੈ ਅਤੇ ਕਿਸੇ ਭੀ ਜਾਤ ਨਾਲ ਸਬੰਧਤ ਦਿਸ ਨਹੀਂ ਆਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is liberated from bondage; He does not belong to any social class. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬੰਧਨੋਂ ਸੇ ਰਹਿਤ ਹੈ ਔਰ (ਜਾਤੁ) ਜਨਮਤਾ ਮਰਤਾ ਭੀ ਦ੍ਰਿਸਟਿ ਨਹੀਂ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ (ਸਦਾ ਮਾਇਆ ਦੇ) ਬੰਧਨਾਂ ਤੋਂ ਨਿਰਾਲਾ ਹੈ, ਕਦੇ ਭੀ ਉਹ (ਬੰਧਨਾਂ ਵਿਚ ਫਸਿਆ) ਨਹੀਂ ਦਿੱਸਦਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਤੁ = (Skt. जातु = at all, ever, at any time, possibly. न जातु = not at all, never, not at any time) ਕਦੇ ਭੀ, ਕਿਸੇ ਵਕਤ। {ਨੋਟ: ਇਸ ਲਫ਼ਜ਼ ਦਾ ਜੋੜ ਗਹੁ ਨਾਲ ਤੱਕੋ, ਅਖ਼ੀਰ ਤੇ (ੁ) ਹੈ। ਜਿਸ ਲਫ਼ਜ਼ 'ਜਾਤਿ' ਦਾ ਅਰਥ ਹੈ 'ਕੁਲ', ਉਸ ਦੇ ਅਖ਼ੀਰ ਵਿਚ (ਿ) ਹੈ। ਸੋ, ਲਫ਼ਜ਼ 'ਜਾਤੁ' ਤੇ 'ਜਾਤਿ' ਇੱਕੋ ਚੀਜ਼ ਨਹੀਂ}। ਨ ਜਾਤੁ = ਕਦੇ ਭੀ ਨਹੀਂ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él no tiene amarras y no pertenece a ninguna clase social. (1)"