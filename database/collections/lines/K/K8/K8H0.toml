[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ; ਸਾਚੀ ਸਿਖ ਸੁਣਾਈ ॥"
page = 117
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Guru has given the True piece of advice."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਨੇ ਸੱਚੀ ਸਿੱਖ-ਮਤ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Guru has imparted the True Teachings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹ ਸਚੀ ਸਿਖਯਾ ਸਤਿਗੁਰੂ ਨੇ ਸੁਣਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਮੈਂ ਤੈਨੂੰ) ਗੁਰੂ ਦੀ ਸਦਾ ਅਟੱਲ ਰਹਿਣ ਵਾਲੀ ਸਿੱਖਿਆ ਸੁਣਾਈ ਹੈ (ਕਿ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰ ਸਿਖ = ਗੁਰੂ ਦੀ ਸਿੱਖਿਆ। ਸਾਚੀ = ਅਟੱਲ, ਕਦੇ ਉਕਾਈ ਨਾਹ ਖਾਣ ਵਾਲੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru te ha otorgado la auténtica Enseñanza;"