[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨਾ ਜਨੁ; ਆਪਹਿ ਆਪਿ ਉਧਾਰਿਓ ॥"
page = 979
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord of Himself emancipates His serf."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਖੁਦ ਹੀ ਆਪਣੇ ਨਫਰ ਦਾ ਪਾਰ ਉਤਾਰਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself saves His humble servant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪਨਾ ਦਾਸ ਆਪ ਹੀ ਉਧਾਰਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਨੇ ਸਦਾ ਆਪ ਹੀ ਆਪਣੇ ਸੇਵਕ ਨੂੰ ਵਿਕਾਰਾਂ ਤੋਂ ਬਚਾਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨੁ = ਸੇਵਕ, ਭਗਤ, ਦਾਸ। ਆਪਹਿ ਆਪਿ = ਆਪ ਹੀ ਆਪ। ਉਧਾਰਿਓ = (ਵਿਕਾਰਾਂ ਤੋਂ) ਬਚਾਇਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo salva a Su humilde Sirviente."