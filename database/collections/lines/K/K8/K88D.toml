[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹੂੰ ਔਖਧੀ, ਰੋਗ ਕੇ ਸੋਕ ਸੋਖੰ ॥"
page = 28

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere Thou art the medicine, drying up the grief of malady!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ ਔਸ਼ਧੀ ਹੋ ਕੇ ਰੋਗ ਦੇ ਦੁਖ ਨੂੰ ਨਸ਼ਟ (ਸੋਖੰ) ਕਰਦੇ ਹੋ।"