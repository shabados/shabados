data = "ਤਬ ਬਨੀ ਤਾ ਕੀ ਬਾਤ ॥੪॥"
page = 635

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Brahma had also become egoistic in his mind and the evil notions arose there, but when he took birth for seven times, he was then redeemed.4."

