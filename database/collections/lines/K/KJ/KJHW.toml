[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕੇ ਨਿੰਦਕ ਕਉ; ਸਦਾ ਬਿਜੋਗ ॥"
page = 280
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The slanderer of the saint ever suffers separation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਦੀ ਨਿੰਦਾ ਕਰਨ ਵਾਲਾ ਹਮੇਸ਼ਾਂ ਵਿਛੋੜਾ ਸਹਾਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slanderer of the Saint is forever separated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਕੇ ਨਿੰਦਕ ਕੋ ਸਦਾ ਵਿਯੋਗ ਰਹਿਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਉਸ ਨੂੰ (ਸੁਖਾਂ ਦੇ ਸੋਮੇ ਪ੍ਰਭੂ ਤੋਂ) ਸਦਾ ਵਿਛੋੜਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਜੋਗ = (ਰੱਬ ਨਾਲੋਂ) ਵਿਛੋੜਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y de manera continua se aleja de su Señor."