[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸ੍ਰਿਸਟਿ ਉਪਾਈ; ਜੋਤੀ ਤੂ ਜਾਤਿ ॥"
page = 413
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou, O Lord, hast created the world and Thine is the luminous personality."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੇ ਸੁਆਮੀ ਜਗਤ ਰਚਿਆ ਹੈ, ਅਤੇ ਪ੍ਰਕਾਸ਼ਵਾਨ ਹੈ ਤੇਰੀ ਵਿਅਕਤੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He created the Universe, and by His Divine Nature, instilled His Divine Light into it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਐਸੇ ਜਾਨ ਜੋ ਜੋਤੀ ਹੀ ਨੈ ਸ੍ਰਿਸਟਿ ਉਪਾਈ ਹੈ ਅਰ ਜਾਤੋਂ ਕਾ ਭੇਦ ਬਨਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੋਤਿ-ਰੂਪ ਪ੍ਰਭੂ! ਤੂੰ ਆਪ ਹੀ ਸ੍ਰਿਸ਼ਟੀ ਪੈਦਾ ਕੀਤੀ ਹੈ, ਤੂੰ ਆਪ ਹੀ ਅਨੇਕਾਂ ਜਾਤੀਆਂ ਪੈਦਾ ਕਰ ਦਿੱਤੀਆਂ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋਤੀ = ਹੇ ਜੋਤਿ-ਰੂਪ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Creó la Creación y Él, por Su Naturaleza, lo Ilumina todo."