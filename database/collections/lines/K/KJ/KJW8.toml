[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏ ਮਨ ਮੇਰਿਆ; ਤੂ ਛੋਡਿ ਆਲ ਜੰਜਾਲਾ. ਰਾਮ ॥"
page = 1112
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, abandon thou the household involvements."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਤੂੰ ਘਰੇਲੂ ਪੁਆੜਿਆਂ ਨੂੰ ਛੱਡ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, abandon your household entanglements."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ (ਆਲ) ਘਰ ਕੇ ਸਭ ਧੰਧਿਓਂ ਕੋ ਛੋਡ ਕਰ ਰਾਮ ਨਾਮ ਕਾ ਸਿਮਰਨੁ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਘਰ ਦੇ ਮੋਹ ਦੀਆਂ ਫਾਹੀਆਂ ਛੱਡ ਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਲ = {आलय} ਘਰ। ਆਲ ਜੰਜਾਲਾ = ਘਰ ਦੇ ਜੰਜਾਲ, ਘਰ ਦੀਆਂ ਫਾਹੀਆਂ, ਘਰ ਦੇ ਮੋਹ ਦੀਆਂ ਫਾਹੀਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente mía, deja a un lado los apegos al hogar, sirve al Dios Desapegado,"