[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਵਿਸਰਿਐ; ਇਕ ਨਿਮਖ. ਨ ਸਰੈ ॥੭॥"
page = 913
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by forgetting whom, it cannot do even for an instant."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਭੁਲਾ ਕੇ ਇਸ ਦਾ ਇਥ ਮੁਹਤ ਭਰ ਲਈ ਭੀ ਗੁਜ਼ਾਰਾ ਨਹੀਂ ਹੋਣਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "forgetting Him, I cannot survive, even for an instant. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਵਿਸਰਨੇ ਸੇ ਏਕ ਨਿਮਖ ਮਾਤ੍ਰ ਭੀ ਨਹੀਂ ਸਰਤਾ ਹੈ॥੭॥☬ਤਾਂ ਤੇ ਤਿਸ ਪਾਸ ਐਸੇ ਬੇਨਤੀ ਕਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਵਿਸਾਰਿਆਂ ਇਕ ਪਲ-ਭਰ ਸਮਾ ਭੀ ਸੌਖਾ ਨਹੀਂ ਲੰਘ ਸਕਦਾ ॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸੁ ਵਿਸਰਿਐ = ਜਿਸ ਨੂੰ (ਵਿਸਾਰਿਆਂ)। ਨਿਮਖ = ਅੱਖ ਝਮਕਣ ਜਿਤਨਾ ਸਮਾ। ਨ ਸਰੈ = ਨਹੀਂ ਨਿਭ ਆਉਂਦੀ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sin cuya Gracia no puedes transcurrir ni un instante? (7)"