[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਬੈ ਸੂਰ ਕੋਊ ਤੁਮ ਸੰਗ ਲਰਿ ਹੈ ॥੨੧੯੦॥"
page = 518

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Hearing this, Shiva got enraged and said, “When your banner will fall down, then someone will come to fight with you.”2190."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਕੋਈ ਯੋਧਾ ਤੇਰੇ ਨਾਲ ਯੁੱਧ ਕਰੇਗਾ ॥੨੧੯੦॥"