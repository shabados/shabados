[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਿਰਦੈ ਨਾਮੁ; ਸਦਾ ਕਿਰਤਾਰਥੁ ॥"
page = 832
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With the Name in his mind he is ever benefited."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਮਨ ਅੰਦਰ ਨਾਮ ਹੋਣ ਨਾਲ ਉਹ ਹਮੇਸ਼ਾਂ ਲਾਭ ਉਠਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With the Naam in the heart, one always prospers."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਿਦੇ ਵਿਖੇ ਨਾਮ ਪ੍ਰਾਪਤ ਹੋਣੇ ਸੇ ਸਦਾ (ਕਿਰਤਾਰਥੁ) ਕਲ੍ਯਾਣ ਰੂਪ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਦਾ ਵੱਸਦਾ ਹੈ ਉਹ (ਜੀਵਨ-ਜਾਤ੍ਰਾ ਵਿਚ) ਸਫਲ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਰਤਾਰਥੁ = ਸਫਲ, ਕਾਮਯਾਬ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno vive satisfecho porque trae el Nombre del Señor en su corazón."