[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੂ ਦੁਆਰੈ ਹੋਇ; ਸੋਝੀ ਪਾਇਸੀ ॥"
page = 730
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru, the mortal obtains understanding."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੁਆਰੇ ਪ੍ਰਾਣੀ ਨੂੰ ਸਮਝ ਪਰਾਪਤ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Gurdwara, the Guru's Gate, one obtains understanding."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਗੁਰੂ ਜੀ ਕੇ ਅਨੁਸਾਰ ਹੋਇ ਤੋ ਅੰਤਸਕਰਨ ਕੇ ਸੁਧ ਕਰਨੇ ਕੀ (ਸੋਝੀ) ਗਿਆਤ ਪਾਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਗੁਰੂ ਦੇ ਦਰ ਤੇ (ਆਪਾ-ਭਾਵ ਦੂਰ ਕਰ ਕੇ ਸਵਾਲੀ) ਬਣੀਏ, ਤਾਂ ਹੀ (ਹਿਰਦੇ ਨੂੰ ਪਵਿਤ੍ਰ ਕਰਨ ਦੀ) ਅਕਲ ਮਿਲਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਆਰੈ = ਦਰ ਤੇ। ਹੋਇ = ਹੋ ਕੇ, ਮੰਗਤਾ ਬਣ ਕੇ। ਸੋਝੀ = (ਹਿਰਦੇ ਨੂੰ ਪਵਿਤ੍ਰ ਕਰਨ ਦੀ) ਅਕਲ। ਪਾਇਸੀ = ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A Través del Gurdwara, la Puerta del Guru uno obtiene el Entendimiento,"