[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਲਖ ਨਿਰੰਜਨੁ ਆਖੀਐ; ਅਕਲ ਅਜੋਨਿ ਅਕਾਲ ਅਪਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "That Lord is without blemish, beyond birth, beyond time and is infinite."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਲਖਣ ਤੋਂ ਅਰ ਮਾਯਾ ਥੋਂ ਪਰੇ ਕਹੀਦੇ ਹਨ, ਅਕਲ, ਅਜੋਨੀ, ਅਕਾਲ, (ਆਦਿ) ਅਪਾਰ (ਨਾਮ ਹਨ)।"