[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿਧੌ ਪਤ੍ਰ ਪਾਨੰ ਨਚੈ ਕਉਲ ਨਾਲੰ ॥੨੨॥੧੯੦॥"
page = 143

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Or the drops of water were dancing on the lotus leaf.22.190."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਾਂ ਪਾਨ ਦੇ ਪੱਤਰ (ਜਾਂ) ਕਮਲ ਦੀ ਡੰਡੀ (ਵਾਂਗ) ਨਚ ਰਹੀ ਹੋਵੇ ॥੨੨॥੧੯੦॥"