[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਘੂਮਤਿ ਹੈ ਕਹੂੰ ਘਾਇ ਲਗੇ ਭਟ; ਬੋਲ ਸਕੈ ਨ, ਗਏ ਬਲ ਹਾਰੀ ॥"
page = 457

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The elephants had fallen after swinging"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ ਘਾਇਲ ਯੋਧੇ ਘੁੰਮੇਰੀਆਂ ਖਾ ਰਹੇ ਹਨ, ਬੋਲ ਨਹੀਂ ਸਕਦੇ ਅਤੇ (ਉਨ੍ਹਾਂ ਦਾ) ਬਲ ਨਸ਼ਟ ਹੋ ਗਿਆ ਹੈ।"