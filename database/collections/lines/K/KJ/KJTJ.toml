[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ; ਨਦਰਿ ਨਿਹਾਲਿਆ ॥"
page = 1184
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Showing His mercy, the. Lord beholds me with His eye of grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਮਿਹਰ ਧਾਰ ਕੇ ਸੁਆਮੀ ਮੈਨੂੰ ਆਪਣੀ ਰਹਿਮਤ ਦੀ ਅੱਖ ਨਾਲ ਵੇਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Bestowing His Mercy, He blesses us with His Glance of Grace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਰਿਪਾ ਕੀ ਨਜਰ ਕਰ ਮੈਂ ਦਾਸ ਕੋ ਹਰੀ ਨੇ (ਨਿਹਾਲਿਆ) ਦੇਖਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ ਆਪਣੇ ਦਾਸ ਦੀ (ਸਦਾ) ਆਪ ਸੰਭਾਲ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ। ਨਦਰਿ = ਮਿਹਰ ਦੀ ਨਿਗਾਹ ਨਾਲ। ਨਿਹਾਲਿਆ = ਤੱਕਿਆ, ਵੇਖਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor, en Su Misericordia, nos bendice con Su Mirada de Gracia"