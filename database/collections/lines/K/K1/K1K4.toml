[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਜ ਘਰਿ ਬੈਸਿ; ਸਹਜ ਘਰੁ ਲਹੀਐ ॥"
page = 227
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By sitting in your own home, you can attain the Home, of Bliss."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਨਿੱਜ ਦੇ ਧਾਮ ਅੰਦਰ ਬੈਠ ਕੇ, ਪਰਸੰਨਤਾ ਦਾ ਗ੍ਰਹਿ ਪ੍ਰਾਪਤ ਕਰ ਸਕਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Dwelling in the home of your own being within, you shall find the home of intuitive peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਸ੍ਵਰੂਪ ਮੇਂ ਇਸਥਿਤ ਹੋ ਕਰ ਸਾਂਤੀ ਕਾ ਘਰ ਜੋ ਨਿਰਵਿਕਲਪ ਸਮਾਧੀ ਹੈ ਤਿਸ ਕੋ ਲਹੀਏ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਿਜ ਘਰ ਵਿਚ ਟਿਕੇ ਰਹਿ ਸਕੀਦਾ ਹੈ, ਤੇ ਉਸ ਸ੍ਵੈ-ਸਰੂਪ ਵਿਚ ਬੈਠ ਕੇ ਆਤਮਕ ਅਡੋਲਤਾ ਦਾ ਟਿਕਾਣਾ ਲੱਭ ਸਕੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੈਸਿ = ਬੈਠ ਕੇ, ਟਿਕ ਕੇ। ਸਹਜ ਘਰੁ = ਆਤਮਕ ਅਡੋਲਤਾ ਦੇਣ ਵਾਲਾ ਘਰ। ਲਹੀਐ = ਪ੍ਰਾਪਤ ਕਰ ਸਕੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "habita contenido en tu propio ser, logra el Equilibrio,"