[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਪ੍ਰਭਿ. ਕਿਰਪਾ ਧਾਰੀ ॥੧॥"
page = 627
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God, the Lord Master, has extended His mercy to them."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਮਾਲਕ ਨੇ ਉਨ੍ਹਾਂ ਤੇ ਆਪਣੀ ਮਿਹਰ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord God, Har, Har, has extended His Mercy. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਪਰ ਹਰੀ ਨੇ ਹਰ ਪ੍ਰਕਾਰ ਕ੍ਰਿਪਾ ਕਰੀ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਉੱਤੇ ਪ੍ਰਭੂ ਨੇ (ਇਹ) ਕਿਰਪਾ ਕਰ ਦਿੱਤੀ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues el Señor Dios, Jar, Jar, ha mostrado Su Misericordia. (1)"