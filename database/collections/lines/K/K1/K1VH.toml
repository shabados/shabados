[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਤਰਣਿ ਕਤਰੈ ਕਤਰਣੀ; ਹੋਇ ਦੁਮੂਹੀ ਚੜ੍ਹਦੀ ਸਾਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "His double-blade honed scissors cuts the cloth."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕੈਂਚੀ ਕਾਤਰਾਂ ਨੂੰ ਕਤਰਦੀ ਹੈ, ਦੁਮੂੰਹੀ ਹੋਕੇ ਸਾਣ ਪੁਰ ਚੜ੍ਹਦੀ ਹੈ।"