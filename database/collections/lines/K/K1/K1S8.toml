language = "pa"
data = "ਉਹ ਪਲ ਭਰ ਵੀ ਰੱਬ ਦੀ ਯਾਦ ਤੋਂ ਬਿਨਾਂ ਨਹੀਂ ਗੁਜ਼ਾਰਦੇ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਯੱਕ ਨਫ਼ਸ ਬੇ ਯਾਦਿ ਹੱਕ ਨਭਗੁਜ਼ਾਸ਼ਤੰਦ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Whether it be the officials of the South or those fortunate Raos (40)"