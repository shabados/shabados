data = "(ਕਈਆਂ ਦੇ) ਸ਼ਰੀਰ ਛਾਨਣੀ ਵਾਂਗ ਛੇਕ ਛੇਕ ਹੋ ਕੇ ਰਣ-ਭੂਮੀ ਵਿਚ ਡਿਗ ਪਏ।"