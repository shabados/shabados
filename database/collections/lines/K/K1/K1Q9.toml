[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਆਪੇ ਆਪਿ; ਆਪਿ ਖੁਆਈਐ ॥"
page = 369
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, by his own deeds, the mortal destroys his ownself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਪਣੇ ਨਿੱਜ ਦੇ ਅਮਲਾਂ ਦੁਆਰਾ ਪ੍ਰਾਣੀ ਆਪਣੇ ਆਪ ਨੂੰ ਨਸ਼ਟ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, his identity consumes his identical identity."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਵਹੁ ਆਪ ਹੀ ਆਪ ਜੋ ਅਕਾਲ ਪੁਰਖ ਹੈ, ਸੋ ਤਬ ਮਿਲਤਾ ਹੈ, ਜਬ (ਆਪ ਖੁਆਈਐ) ਆਪਾ ਭਾਉ ਖੋਇ ਦੀਜੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਮਨਮੁਖ ਮਨੁੱਖ ਸਦਾ ਆਪ ਹੀ (ਆਪਣੀ ਹੀ ਮਨਮੁਖਤਾ ਦੇ ਕਾਰਨ) ਪਰਮਾਤਮਾ ਤੋਂ ਵਿੱਛੁੜਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕ = ਹੇ ਨਾਨਕ! ਆਪੇ = ਆਪ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, en ego uno se destruye a sí mismo,"