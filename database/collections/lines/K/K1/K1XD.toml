[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਬਿਨਾ; ਨਾਹੀ ਹੋਰੁ ॥"
page = 1307
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Lord, there is not another."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਬਗੈਰ ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without God, there is no other at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਸੇ ਬਿਨਾਂ ਔਰ ਕੋ ਨਹੀਂ ਜਾਨਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਬਿਨਾ (ਮੇਰਾ) ਕੋਈ ਹੋਰ (ਆਸਰਾ) ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues sin Dios no hay nada más. Noche y día"