[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧਾ ਕੀ ਧੂਰੀ, ਨਾਵੈ ॥"
page = 623
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He bathes in the dust of saints feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੰਤਾਂ ਦੇ ਪੈਰਾਂ ਦੀ ਧੂੜੀ ਵਿੱਚ ਨਹਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and bathes in the dust of the feet of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੇ ਚਰਨੋਂ ਕੀ ਧੂਰੀ ਮੇਂ ਦਾਸ ਨ੍ਹਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੇਵਕ ਗੁਰਮੁਖਾਂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ਵਿਚ ਇਸ਼ਨਾਨ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ (ਆਪਾ-ਭਾਵ ਮਿਟਾ ਕੇ ਸੰਤ ਜਨਾਂ ਦੀ ਸ਼ਰਨ ਪਿਆ ਰਹਿੰਦਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਵੈ = ਨ੍ਹਾਵੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y se baña en el Polvo que han pisado los Santos."