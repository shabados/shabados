[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਪਤਿਵੰਤਾ ਸੋ ਧਨਵੰਤਾ ॥"
page = 1071
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone is honorable and he alone is wealthy,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਇੱਜ਼ਤ ਵਾਲਾ ਹੈ ਤੇ ਕੇਵਲ ਉਹ ਹੀ ਮਾਲਦਾਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is honorable, and he alone is wealthy,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪਤ ਵਾਲਾ ਹੈ ਔ ਸੋਈ ਧਨ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ (ਅਸਲ) ਇੱਜ਼ਤ-ਦਾਰ ਹੈ ਉਹੀ (ਅਸਲ) ਧਨਾਢ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿਵੰਤਾ = ਇੱਜ਼ਤ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo es rico, sólo es honorable,"