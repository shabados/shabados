[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੁ ਅੰਨੁ ਅਸਾਡਾ ਫਿਟੈ ॥"
page = 472
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "otherwise, this food of ours will be polluted\"."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਹੀਂ ਤਾਂ ਸਾਡਾ ਇਹ ਭੋਜਨ ਪਲੀਤ ਹੋ ਜਾਵੇਗਾ।\""

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Or it will be polluted!\""

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਤੁਮਾਰੇ ਛੂਹਨੇ ਸੇ ਏਹੁ (ਅਸਾਡਾ) ਹਮਾਰਾ ਅੰਨੁ (ਫਿਟੈ) ਵਿਗੜ ਜਾਇਗਾ, ਭਾਵ ਅਸੁਧ ਹੋ ਜਾਇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਾਡਾ ਅੰਨ ਖ਼ਰਾਬ ਨਾਹ ਹੋ ਜਾਏ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫਿਟੈ = ਖ਼ਰਾਬ ਹੋ ਜਾਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "“no toquen nuestra comida porque se contamina”;"