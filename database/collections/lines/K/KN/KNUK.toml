data = "ਕਿ ਸਾਜੋਜ ਮੁਕਤਾ ॥੨੪੦॥"
page = 654

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He was the destroyer of impiety, a devotee of the path of Sannyas, of Jivan-mukta (redeemed while living) and was skilful in all learnings.240."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਾਯੁਜ ਮੁਕਤੀ ਵਾਲਾ ਹੈ ॥੨੪੦॥"