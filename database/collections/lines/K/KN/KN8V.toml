[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕੀ ਕੀਮਤਿ; ਕਹੀ. ਨ ਜਾਇ ॥੧॥"
page = 1270
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The worth of His slave can not be told."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਗੋਲੇ ਦਾ ਮੁੱਲ ਆਖਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His worth cannot be expressed. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸੇਵਕ ਕੀ ਕੀਮਤ ਕਹੀ ਨਹੀਂ ਜਾਤੀ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ (ਮਾਲਕ ਦਾ) ਵਡੱਪਣ ਬਿਆਨ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕੀ = ਉਸ (ਪ੍ਰਭੂ) ਦੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su valor no puede ser expresado. (1)"