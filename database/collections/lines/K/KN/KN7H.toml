[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਸਤ੍ਰ ਸਿਮ੍ਰਿਤਿ; ਬੇਦ ਪੂਕਾਰੇ ॥"
page = 260
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have become weary of repeating Shashtras, Simritis and the Vedas."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ਾਸਤ੍ਰਾਂ, ਸਿੰਮ੍ਰਤੀਆਂ ਅਤੇ ਵੇਦਾਂ ਦੇ ਉਚਾਰਣ ਕਰਨ ਤੋਂ ਹਾਰ ਹੁਟ ਕੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am so tired of reciting the Shaastras, the Simritees and the Vedas."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਸਤਾਈ ਸਿੰਮ੍ਰਤੀਆਂ, ਖਟ ਸਾਸਤ੍ਰ ਅਰ ਚਾਰੋਂ ਬੇਦ ਸਤ ਕਰ ਕੇ ਪੁਕਾਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪੰਡਿਤ ਲੋਕ) ਸਿਮ੍ਰਤੀਆਂ ਸ਼ਾਸਤ੍ਰ ਵੇਦ (ਆਦਿਕ ਧਰਮ-ਪੁਸਤਕ) ਉੱਚੀ ਉੱਚੀ ਪੜ੍ਹਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਸਤ੍ਰ = ਹਿੰਦੂ ਫ਼ਿਲਾਸਫ਼ੀ ਦੇ ਛੇ ਪੁਸਤਕ = ਸਾਂਖ, ਜੋਗ, ਨਿਆਇ, ਮੀਮਾਂਸਾ, ਵੈਸ਼ੇਸਕ, ਵੇਦਾਂਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ni los Vedas, los Shastras o los Smritis hablan de nadie más."