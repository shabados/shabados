[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਬਖਸਿ; ਕਰੇ ਜੀਅ ਸਾਰਾ ॥"
page = 106
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself gives gifts to all the beings."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਖੁਦ ਹੀ ਸਾਰਿਆਂ ਜੀਵਾਂ ਨੂੰ ਦਾਤਾਂ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He gives and forgives all beings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਆਪ ਹੀ ਬਖਸਸ ਕਰਤਾ ਹੈ ਔਰ ਜੀਵੋਂ ਕੀ (ਸਾਰਾ) ਸੰਭਾਲ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਮਿਹਰ ਕਰ ਕੇ ਸਭ ਜੀਵਾਂ ਦੀ ਸੰਭਾਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ ਸਾਰਾ = ਜੀਵਾਂ ਦੀ ਸਾਰ, ਜੀਵਾਂ ਦੀ ਸੰਭਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, en Su Misericordia cuida nuestra Alma,"