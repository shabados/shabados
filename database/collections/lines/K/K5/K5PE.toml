[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ ਤੇ ਪਾਵੈ; ਘਰੁ ਦਰੁ ਮਹਲੁ ਸੁ ਥਾਨੁ ॥"
page = 1259
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the True Guru, one obtains the sublime place and the door of the Lord's Home and Mansion."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਬੰਦਾ ਸਰੇਸ਼ਟ ਅਸਥਾਨ ਅਤੇ ਪ੍ਰਭੂ ਦੇ ਧਾਮ ਮੰਦਰ ਦੇ ਬੂਹੇ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the True Guru, the mortal obtains the special place, the Mansion of the Lord's Presence in his own home."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਤਿਗੁਰੋਂ ਤੇ ਹੀ ਇਹ ਜੀਵ ਸਰੀਰ ਘਰ ਮੇਂ ਜੋ ਸ੍ਰੇਸਟ ਅਸਥਾਨ ਅੰਤਸਕਰਨ ਹੈ ਤਿਸ ਮੇਂ (ਮਹਲੁ) ਸਰੂਪ ਕੇ ਦਰ ਗਿਆਨ ਕੋ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਗੁਰੂ ਪਾਸੋਂ ਹੀ ਪਰਮਾਤਮਾ ਦਾ ਘਰ ਪ੍ਰਭੂ ਦਾ ਦਰ ਪ੍ਰਭੂ ਦਾ ਮਹਲ ਅਤੇ ਥਾਂ ਲੱਭ ਸਕਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ, ਪਾਸੋਂ। ਘਰੁ ਦਰੁ ਮਹਲੁ = ਪਰਮਾਤਮਾ ਦਾ ਘਰ ਦਰ ਮਹਲ। ਸੁ = ਉਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mediante el Guru Verdadero, el mortal obtiene un lugar especial, la Mansión de la Presencia del Señor en su propio hogar,"