[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲੈ ਲੈ; ਮੁਕਰਿ ਪਉਦੇ ਕਾਚੇ ॥"
page = 1024
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The false ones receive and deny their receipt."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਝੂਠੇ ਜੀਵ ਲੈਂਦੇ ਹਨ ਅਤੇ ਉਨ੍ਹਾਂ ਦੀ ਵਸੂਲੀ ਤੋਂ ਮੁਨਕਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The false ones receive, and then deny having received."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਲੈ ਲੈ ਕੇ ਇਹ ਕਾਚੇ ਜੀਵ ਮੁਕਰ ਪੜਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਥੋੜ੍ਹ-ਵਿਤੇ ਜੀਵ ਦਾਤਾਂ ਲੈ ਲੈ ਕੇ (ਭੀ) ਮੁੱਕਰ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਚੇ = ਥੋੜ੍ਹ-ਵਿਤੇ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y los falsos aunque pudieran recibirlo, Lo niegan cada vez más y más."