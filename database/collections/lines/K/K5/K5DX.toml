data = "ਜਗਜੀਤ ਸੁਯੰਬਰ ਮੋ ਸੁ ਪ੍ਰਭਾ ॥੫॥"
page = 178

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I shall also tell how he wedded Parbati after conquering her in the Swayyamvara (self-selection of a husband from amongst the suitors).5."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਉਸ) ਸੁੰਦਰੀ ਨੂੰ ਸੁਅੰਬਰ ਵਿਚ ਜਿਤਿਆ ॥੫॥"