[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਵਪ੍ਰਸਾਦਿ ਮੈ ਸਖੀ, ਆਜੁ ਸਾਜਨ ਕੋ ਪਾਯੋ ॥"
page = 1016

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘My friend, through your benevolence, I have achieved my sweetheart."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਖੀ! ਤੇਰੀ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਅਜ ਮੈਂ ਸਜਨ ਨੂੰ ਪ੍ਰਾਪਤ ਕੀਤਾ ਹੈ।"