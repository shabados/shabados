data = "ਤੂੰ ਸਥਾਪਨਾ ਤੋਂ ਪਰੇ ਹੈਂ (ਦੇਵ-ਮੂਰਤੀਆਂ ਵਾਂਗ ਸਥਾਪਿਤ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ)"

