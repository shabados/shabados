[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਨਾਮੁ ਪਵਿਤੁ ਹੈ; ਨਾਮੁ ਜਪਤ ਦੁਖੁ ਜਾਇ ॥"
page = 1313
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Immaculate is the Lord God's Name. Uttering the Name, man is rid of his pain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਵਨ ਪੁਨੀਤ ਹੈ ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ। ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਨ ਦੁਆਰਾ, ਬੰਦੇ ਦੀ ਪੀੜ ਨਵਿਰਤ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Name of the Lord, Har, Har, is Sacred and Immaculate. Chanting the Naam, pain is dispelled."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕਾ ਹਰ ਇਕ ਨਾਮ, ਭਾਵ ਜਿਤਨੇ ਨਾਮ ਹੈਂ, ਸੋ ਸਭ ਪਵਿਤ੍ਰ ਹੈਂ। ਨਾਮ ਕੇ ਜਪਣੇ ਕਰ ਦੁਖ ਦੂਰ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ (ਆਤਮਕ ਜੀਵਨ ਨੂੰ) ਸੁੱਚਾ ਬਨਾਣ-ਜੋਗ ਹੈ, ਨਾਮ ਜਪਿਆਂ (ਹਰੇਕ) ਦੁੱਖ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਵਿਤੁ = (ਆਤਮਕ ਜੀਵਨ ਨੂੰ) ਸੁੱਚਾ (ਬਨਾਣ ਵਾਲਾ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Nombre del Señor Jar, Jar, es Sagrado e Inmaculado. Cantando el Naam el dolor es disipado."