type = "primary"
data = "ਮੇਰੇ ਸਕਲੋ ਸੁਖ ਬਿਧਿ ਹਰਿਯੋ ॥"
page = 895

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘My son named Bandon has died and God has revoked all his bliss.’"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵਿਧਾਤਾ ਨੇ ਮੇਰੇ ਸਾਰੇ ਸੁਖ ਹਰ ਲਏ ਹਨ।"