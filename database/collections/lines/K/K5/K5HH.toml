[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹੋਇ ਫਿਰੰਗੀ ਅਰਮਨੀ; ਰੂਮੀ ਗਰਬਾਣੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Some are blackclad recluses and dervishes wearing bunches of cowaries"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਫਿਰਗਸਤਾਨੀ, 'ਇਰਮਨੀ' (ਆਰਮੀਨੀਆਂ ਵਾਸੀ) ਰੂਮੀ ਹੰਕਾਰ ਵਿਖੇ ਮਸਤ ਹਨ।"