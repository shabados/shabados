[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਨਿਰਮਲੁ ਨੀਰੁ ਵਖਾਣੀਐ; ਸਿਰੁ ਨੀਵਾਂ ਨੀਵਾਣਿ ਚਲੰਦਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The water is known as pure because it flows downward."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜਲ ਨਿਰਮਲ ਕਹੀਦਾ ਹੈ (ਕਿਉਂ ਜੇ) ਸਿਰ ਨੀਵਾਂ ਕਰ ਕੇ ਨੀਵਾਣਾਂ ਨੂੰ ਹੀ ਚਲਦਾ ਹੈ।"