[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਨਾਮੁ; ਲਹਿਓ ਮੈ ਲਾਹਾ ॥੩॥"
page = 524
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have reaped the profit of the God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦੀ ਮੈਂ ਖੱਟੀ ਖੱਟੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but I have earned the profit of the Name of the Lord. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਨੇ ਹਰਿ ਨਾਮ ਕਾ ਲਾਹਾ ਲਿਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਮੈਂ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਰੂਪ ਨਫ਼ਾ (ਇਸ ਮਨੁੱਖਾ-ਜਨਮ ਦੇ ਵਪਾਰ ਵਿਚ) ਖੱਟ ਲਿਆ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਾਹਾ = ਲਾਭ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero he cosechado el Fruto del Nombre del Señor. (3)"