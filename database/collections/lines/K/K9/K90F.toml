[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਹਜੇ ਜਾਗਣੁ; ਸਹਜੇ ਸੋਇ ॥"
page = 236
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In peace he is awake and in peace sleeps."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਰਾਮ ਅੰਦਰ ਉਹ ਜਾਗਦਾ ਹੈ ਤੇ ਆਰਾਮ ਅੰਦਰ ਸੌਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They awaken in peace and poise; they sleep in peace and poise."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਭਾਵਕ ਹੀ ਜਾਗਣਾਂ ਹੋਤਾ ਹੈ ਔਰ ਸੁਤੇ ਹੀ ਸੋਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਚਾਹੇ ਜਾਗਦਾ ਹੈ, ਚਾਹੇ ਸੁੱਤਾ ਹੋਇਆ ਹੈ, ਉਹ ਸਦਾ ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਹੀ ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜੇ = ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ। ਸੋਇ = ਸੌਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Duerme en el Estado de Equilibrio y así se levanta,"