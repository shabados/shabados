[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਾਵਨ ਮੋ ਮਨ ਭਾਵਨ ਕੇ ਲੀਏ; ਸਾਤ ਸਮੁੰਦ੍ਰਨ ਕੇ ਤਰਿ ਜਾਊ ॥"
page = 958

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘To satiate myself! can cross over even seven seas."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਵਣ ਦੇ ਮਹੀਨੇ ਵਿਚ ਪ੍ਰੀਤਮ ਨੂੰ ਮਿਲਣ ਲਈ ਸੱਤ ਸਮੁੰਦਰ ਵੀ ਤਰ ਸਕਦੀ ਹਾਂ।"