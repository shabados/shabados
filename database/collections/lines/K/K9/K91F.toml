[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੇ ਚਾਕਰ ਕਉ; ਨਹੀ ਬਾਨ ॥"
page = 238
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whose attendant is under no restriction;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਸੇਵਕ ਕਿਸੇ ਕੈਦ ਅੰਦਰ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His servant suffers no loss."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਿਸ ਕੇ ਸੇਵਕ ਕਾ ਖੋਟਾ (ਬਾਨ) ਸੁਭਾਉ ਨਹੀਂ ਹੋਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰਮਾਤਮਾ ਦੇ ਸੇਵਕ-ਭਗਤ ਨੂੰ ਕੋਈ ਐਬ ਨਹੀਂ ਚੰਬੜ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਨ = {वयस्न} ਐਬ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ni sufrirás pérdida,"