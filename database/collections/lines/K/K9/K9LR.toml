[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਬਿਯਕਤ ਤੇਜ ਮਹਿਮਾ ਮਹਾਨ ॥"
page = 642

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The enemies and friends are alike for Him and His invisible Lustre and Praise are Supreme"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਦਾ) ਤੇਜ ਪ੍ਰਗਟ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ ਅਤੇ (ਜਿਸ ਦੀ) ਮਹਿਮਾ ਮਹਾਨ ਹੈ।"