[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਗੁਰ ਕੈ ਉਪਦੇਸਿਐ; ਬਿਨਸੇ ਸਰਬ ਜੰਜਾਲ ॥"
page = 48
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the instruction of the True Guru all the worldly entanglement are annulled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਸਿਖਿਆ ਦੁਆਰਾ ਸਮੂਹ ਸੰਸਾਰੀ ਅਲਸੇਟੇ ਮੁੱਕ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Teachings of the True Guru, all worldly entanglements are eliminated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਕੇ ਉਪਦੇਸ਼ ਦੇਨੇ ਸੇ ਸੰਪੂਰਨ (ਜੰਜਾਲ) ਬੰਧਨ ਨਾਸ ਹੋ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਉਪਦੇਸ਼ ਦੀ ਬਰਕਤਿ ਨਾਲ ਉਸ ਮਨੁੱਖ ਦੇ (ਮਾਇਆ-ਮੋਹ ਵਾਲੇ) ਸਾਰੇ ਜੰਜਾਲ ਨਾਸ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A través de la Instrucción del Guru, todos mis apegos se han desvanecido."