[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਤੀ ਰੁਤੀ; ਥਿਤੀ ਵਾਰ ॥"
page = 7
line = 11

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਇਸ ਪਉੜੀ ਤੋਂ ਪੰਜ ਖੰਡਾਂ ਦੀ ਅਗੰਮ ਤੇ ਬਿਸਮਾਦੀ ਕਥਾ ਸ਼ੁਰੂ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God created nights, seasons, lunar days, week days,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨੇ ਰਾਤਾਂ, ਮੌਸਮ, ਚੰਦ ਦੇ ਦਿਨ, ਹਫਤੇ ਦੇ ਦਿਹਾੜੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nights, days, weeks and seasons;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਿਧੋ! (ਰਾਤੀ) ਰਾਤ੍ਰਾਂ ,(ਰੁਤੀ) ਬਸੰਤ ੧, ਗ੍ਰੀਖਮ ੨, ਵਰਸਾਤ ੩, ਸਰਦ ੪, ਹਿਮੰਤ ੫, ਸਿਸਰ ੬, ਥਿੱਤੀ ੧੫, ਵਾਰ ੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਤਾਂ, ਰੁੱਤਾਂ, ਥਿਤਾਂ ਅਤੇ ਵਾਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਤੀ = ਰਾਤਾਂ। ਰੁਤੀ = ਰੁੱਤਾਂ। ਥਿਤੀ = ਥਿੱਤਾਂ। ਵਾਰ = ਦਿਹਾੜੇ, ਦਿਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él creó la noche junto con el día,"