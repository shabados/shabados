[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਿ ਨਾਨਕ; ਦਰਗਹਿ ਪਰਵਾਨੁ ॥੨॥"
page = 288
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Utter it, O Nanak and thou shalt be acceptable in God's court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਸਦਾ ਉਚਾਰਨ ਕਰ, ਹੇ ਨਾਨਕ! ਤੂੰ ਰੱਬ ਦੇ ਦਰਬਾਰ ਅੰਦਰ ਕਬੂਲ ਪੈ ਜਾਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chant it, O Nanak, and be accepted in the Court of the Lord. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਕੋ ਜਪ ਇਸ ਤੇ ਤੂੰ ਹਰੀ ਕੀ ਦਰਗਾਹ ਮੇਂ ਪ੍ਰਵਾਨ ਹੋਵੇਂਗਾ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਨਾਮ) ਜਪ, ਦਰਗਾਹ ਵਿਚ ਕਬੂਲ (ਹੋਵੇਂਗਾ) ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Medita en Él y serás aceptado en la Corte del Señor. (2)"