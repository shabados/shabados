[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਆ ਬਗੁ ਬਪੁੜਾ; ਛਪੜੀ ਨਾਇ ॥"
page = 685
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "what avails the poor crane to bathe at the puddle?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਚਾਰੇ ਬਗਲੇ ਨੂੰ ਟੋਭੇ ਵਿੱਚ ਨ੍ਹਾਉਣ ਦਾ ਕੀ ਲਾਭ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What can the poor crane accomplish by bathing in the mud puddle?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਸੰਗ ਰੂਪੀ ਛਪੜੀ ਮੇਂ ਨਾਤਾ ਹੈ, ਸੋ ਮਨਮੁਖ ਦੰਭੀ ਬਗਲਾ ਕਿਆ ਹੈ ਅਰਥਾਤ ਤੁਛ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਿਚਾਰਾ ਬਗਲਾ ਛਪੜੀ ਵਿਚ ਕਾਹਦੇ ਲਈ ਨ੍ਹਾਉਂਦਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਗੁ = ਬਗਲਾ। ਬਪੁੜਾ = ਵਿਚਾਰਾ। ਨਾਇ = ਨ੍ਹਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La grulla se baña en el charco en balde, pues ella se hunde"