[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਪ੍ਰਭੁ ਮੇਰੈ ਸਾਥੇ ॥"
page = 621
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, the Lord is ever with me,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਸੁਆਮੀ ਸਦਾ ਹੀ ਮੇਰੇ ਨਾਲ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, God is always with me;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਪਰਮੇਸਰ ਮੇਰੇ ਸਾਥ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਆਖ-ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਹਰਿ-ਨਾਮ ਹਿਰਦੇ ਵਿਚ ਵਸਾਇਆਂ) ਪਰਮਾਤਮਾ ਮੇਰੇ ਅੰਗ-ਸੰਗ (ਵੱਸਦਾ ਪ੍ਰਤੀਤ ਹੋ ਰਿਹਾ ਹੈ)"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, el Señor está siempre conmigo y el miedo"