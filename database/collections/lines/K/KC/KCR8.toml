[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਅ ਚਰਨ ਆਸਰੋ; ਈਸ ॥"
page = 1228
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have the support of Thine feet, O my Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਤੇਰੇ ਚਰਨਾਂ ਦਾ ਆਸਰਾ ਹੈਂ, ਹੇ ਮੇਰੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord, I take the Support of Your Lotus Feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਈਸ਼੍ਵਰ! ਮੇਰੇ ਕੋ ਤੇਰੇ ਚਰਨੋਂ ਕਾ ਆਸਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਈਸ਼੍ਵਰ! (ਅਸਾਂ ਜੀਵਾਂ ਨੂੰ) ਤੇਰੇ ਚਰਨਾਂ ਦਾ (ਹੀ) ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੁਅ ਚਰਨ ਆਸਰੋ = ਤੇਰੇ ਚਰਨਾਂ ਦਾ ਆਸਰਾ। ਈਸ = ਈਸ਼, ਹੇ ਈਸ਼੍ਵਰ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, Tus Pies de Loto son mi Único Refugio, sólo Te conozco a Ti mi Señor y me relaciono sólo Contigo,"