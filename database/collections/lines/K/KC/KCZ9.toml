[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਧਸੰਗਤਿ, ਕਿਤੁ ਮੁਹਿ ਸਾਲਾਹੀ ॥੧੫॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "How could one eulogise the holy congregation."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ (ਦੀ ਮਹਿਮਾਂ) ਕਿਸ ਮੁਖ ਨਾਲ ਸਲਾਹੀਏ।"