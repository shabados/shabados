[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਹੁ ਕਾਸਟ ਅਗਨ ਦ੍ਵੈ ਦੇਇ ਮੰਗਾਇ ॥੩੨॥"
page = 202

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then the king Dasrath, on their bidding, asked some attendant to bring good deal of wood for burning.32."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਸਾਰੀਆਂ ਲੱਕੜਾਂ ਅਤੇ ਅੱਗ ਇਹ ਦੋਵੇਂ (ਚੀਜ਼ਾਂ) ਮੰਗਵਾ ਦੇ ॥੩੨॥"