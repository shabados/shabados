[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਛ ਗੰਧ੍ਰਬ ਕਿੰਨ੍ਰ ਕੋਰ; ਕਰੋਰ ਮੋਰਿ ਧਰੋ ॥"
page = 685

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“On getting slightly angry, I can dry up all the seven oceans and can throw away by twisting crores of Yakshas, gandharvas and Kinnars"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਯਕਸ਼, ਗੰਧਰਬ ਅਤੇ ਕਿੰਨਰ ਕਰੋੜਾਂ (ਨੂੰ ਮੈਂ) ਅੱਖ ਦੇ ਪਲਕਾਰੇ ('ਕੋਰ') ਵਿਚ ਮਰੋੜ ਕੇ ਰਖ ਦਿਆਂਗਾ।"