[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਿਚਹੁ ਆਪੁ ਗਵਾਇ ਕੈ; ਰਹਨਿ ਸਚਿ ਲਿਵ ਲਾਇ ॥"
page = 88
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Having effaced their self-conceit from within them, they remain absorbed in the love of the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਅੰਦਰੋਂ ਸਵੈ-ਹੰਗਤਾ ਨੂੰ ਮੇਸ ਕੇ ਉਹ ਸੱਚੇ ਸਾਹਿਬ ਦੀ ਪ੍ਰੀਤ ਅੰਦਰ ਲੀਨ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They eradicate selfishness and conceit from within; they remain lovingly absorbed in the True One."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਵਹੁ (ਆਪੁ) ਹੰਕਾਰ ਕੋ ਬੀਚ ਸੇ ਗਵਾਇ ਕਰ ਕੇ ਸਚੇ ਵਾਹਿਗੁਰੂ ਮੇਂ ਬ੍ਰਿਤੀ ਲਗਾਇ ਰਖਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਜੇਹੇ ਮਨੁੱਖ ਹਿਰਦੇ ਵਿਚੋਂ ਅਹੰਕਾਰ ਦੂਰ ਕਰ ਕੇ ਸੱਚੇ ਨਾਮ ਵਿਚ ਬਿਰਤੀ ਜੋੜੀ ਰੱਖਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues conquista su ego y vive en Comunión con la Verdad del Señor."