[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਫਿਰਿ ਮਰੈ; ਨ ਆਵੈ ਜਾਇ ॥"
page = 364
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He dies not again and comes and goes not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੁੜ ਮਰਦਾ ਨਹੀਂ ਅਤੇ ਆਉਂਦਾ ਤੇ ਜਾਂਦਾ ਭੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He does not die any more, and he does not come or go."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਨ ਵਹੁ ਮਰ ਕਰ ਜਾਤਾ ਹੈ ਨ ਜਨਮ ਕਰ ਆਉਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੁੜ ਆਤਮਕ ਮੌਤੇ ਨਹੀਂ ਮਰਦਾ, ਉਹ ਮੁੜ ਮੁੜ ਜੰਮਦਾ ਮਰਦਾ ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De esta manera no muere otra vez, ni va ni viene más,"