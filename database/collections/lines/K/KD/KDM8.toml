[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਜਿ ਚਿਤ੍ਰੈ; ਚਿਤੁ ਰਾਖਿ ਚਿਤੇਰਾ ॥੧੨॥"
page = 340
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Dismiss picture and keep thy mind on the Painter."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੂਹਤ ਨੂੰ ਛੱਡ ਕੇ, ਚਿਤ੍ਰਕਾਰ ਤੇ ਆਪਣਾ ਮਨ ਜੋੜ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forget this picture and focus your consciousness on the Painter. ||12||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਨਾਨਾ ਪ੍ਰਕਾਰ ਕੇ ਪ੍ਰਪੰਚ ਕੋ ਤਿਆਗ ਕਰ ਕੇ ਤਿਸ ਮੇਂ ਚਿਤ ਰਾਖੁ ਜੋ ਚਿਤੇਰਾ ਹੈ ਅਰਥਾਤ ਪਰਮੇਸ੍ਵਰ ਕਾਰੀਗਰ ਕੋ ਸਿਮਰ॥੧੨॥☬ਪ੍ਰਸ਼ਨ: ਵਹੁ ਚਿਤੇਰਾ ਕਹਾਂ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸੋ, ਇਸ ਮੋਹ ਤੋਂ ਬਚਣ ਲਈ) ਤਸਵੀਰ (ਦਾ ਖ਼ਿਆਲ) ਛੱਡ ਕੇ ਤਸਵੀਰ ਬਣਾਉਣ ਵਾਲੇ ਵਿਚ ਆਪਣੇ ਚਿੱਤ ਨੂੰ ਪ੍ਰੋ ਰੱਖ ॥੧੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਿਤੇਰਾ = ਚਿਤ੍ਰ ਬਣਾਉਣ ਵਾਲਾ ॥੧੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Deja a un lado tus pensamientos de la pintura y medita en el gran Pintor, el Único Dios.  (12)"