[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੁਖਿ ਤੇ ਉਚਰੈ ਇਹ ਭਾਤਿ ਸਭੈ; ਇਤਨੋ ਸੁਖ ਨ ਹਰਿ ਧਉਲਨ ਕੋ ॥"
page = 316

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They are all saying that such comfort is even not in the palaces of Indra"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਮੂੰਹੋਂ ਇਸ ਤਰ੍ਹਾਂ ਉਚਾਰਦੀਆਂ ਹਨ (ਕਿ) ਇੰਦਰ ਦੇ (ਮਹੱਲਾਂ) ਵਿਚ ਵੀ ਇੰਨਾ ਸੁਖ ਨਹੀਂ ਹੈ।"