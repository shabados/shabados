[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੀਨ ਦਇਆਲ ਦਇਆ ਕਰ ਸ੍ਰੀ ਪਤਿ; ਸੁੰਦਰ ਸ੍ਰੀ ਪਦਮਾਪਤਿ ਏਹੈ ॥੪॥੨੪੬॥"
page = 37

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He, the Lord of maya, is Compassionate to the Lowly, source of Mercy and most beautiful.4.246."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੀਨ-ਦਿਆਲ, ਦਇਆ ਦੀ ਖਾਣ, ਮਾਇਆ ਦਾ ਸੁਆਮੀ ਸੁੰਦਰ ਪ੍ਰਭੂ ਉਹੀ ਹੈ ॥੪॥੨੪੬॥"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਦੀਨ ਦਇਆਲ ਦਇਆ ਕਰ ਸ੍ਰੀ ਪਤਿ; ਸੁੰਦਰ ਸ੍ਰੀ ਪਦਮਾਪਤਿ ਏ ਹੈ ॥੪॥"