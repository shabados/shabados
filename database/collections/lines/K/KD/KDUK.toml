[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਨੁ ਦੋਖਨ ਕੇ ਤਰੁ ਸੁਧ ਬਨੇ ॥"
page = 560

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They will commit new sins and talking about the blemishes of others, they themselves will remain pure"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਦੋਖਾਂ (ਔਗੁਣਾਂ) ਦੇ ਸ਼ੁੱਧ ਬ੍ਰਿਛ ਬਣੇ ਹੋਣਗੇ।"