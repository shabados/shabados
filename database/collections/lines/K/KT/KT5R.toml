[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉਮੈ ਖਪਹਿ; ਜਨਮਿ ਮਰਿ ਆਵਹਿ ॥੨॥"
page = 226
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By pride they are ruined and die to be born again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੰਕਾਰ ਦੁਆਰਾ ਉਹ ਬਰਬਾਦ ਹੋ ਜਾਂਦੇ ਹਨ ਅਤੇ ਉਹ ਮਰ ਕੇ ਮੁੜ ਆਉਣ ਲਈ ਪੈਦਾ ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But through their egotism, they are ruined; they die, only to be reborn over and over again. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੰਤਾ ਮਮਤਾ ਮੇਂ ਹੀ (ਖਪਹਿ) ਨਸਟ ਹੋਤੇ ਜਨਮ ਕਰ ਆਉਤੇ ਔਰ ਮਰ ਕਰ ਜਾਤੇ ਹੈਂ ਫਿਰ ਆਉਤੇ ਹੈਂ, ਭਾਵ ਏਹਿ ਕਿ ਚੌਰਾਸੀ ਸੇ ਨਹੀਂ ਛੂਟਤੇ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਵਡੱਪਣ ਦੇ ਮਾਣ ਵਿਚ ਦੁਖੀ ਹੁੰਦੇ ਹਨ (ਸਿੱਟਾ ਇਹ ਨਿਕਲਦਾ ਹੈ ਕਿ ਪ੍ਰਭੂ ਦੀ ਯਾਦ ਭੁਲਾ ਕੇ) ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਵਿਚ ਪਏ ਰਹਿੰਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖਪਹਿ = ਖ਼ੁਆਰ ਹੁੰਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en ego son destruidos y nacen para morir otra vez.  (2)"