[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਲੈਤ; ਸਭ ਦੂਖਹ ਨਾਸੁ ॥"
page = 1150
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Uttering the Name all the sufferings depart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਜਪਣ ਦੁਆਰਾ ਸਾਰੇ ਦੁਖੜੇ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Repeating the Naam, all pains vanish."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਜਪਨੇ ਸੇ ਸੰਪੂਰਨ ਦੁਖੋਂ ਕਾ ਨਾਸੁ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਜਪਦਿਆਂ ਸਾਰੇ ਦੁੱਖਾਂ ਦਾ ਨਾਸ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਖਹ = ਦੁੱਖਾਂ ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Recitando el Nombre uno es liberado de sus penas."