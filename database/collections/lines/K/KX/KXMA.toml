[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਾਤਿ ਭਾਤਿ ਆਸਨ ਕਰੈ; ਤਰੁਨ ਤਰੁਨਿ ਲਪਟਾਇ ॥"
page = 962

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Cuddling and cuddling each other they indulged in taking various position,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਭਾਂਤ ਭਾਂਤ ਦੇ ਆਸਨ ਕਰ ਕੇ ਪ੍ਰੇਮੀ-ਪ੍ਰੇਮਿਕਾ ਆਪਸ ਵਿਚ ਲਿਪਟਦੇ ਰਹੇ।"