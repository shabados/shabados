[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਤਵਾਰੋ; ਮਾਇਆ ਸੋਇਆ ॥"
page = 210
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Intoxicated by mammon the man is asleep."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੋਹਨੀ ਦਾ ਨਸ਼ਈ ਕੀਤਾ ਹੋਇਆ ਬੰਦਾ ਸੁੱਤਾ ਪਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Intoxicated with Maya, the people are asleep."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਗਾਫਲ ਮਾਇਆ ਮੇਂ ਸੋਇਆ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਮਾਇਆ ਵਿਚ ਮਸਤ ਹੋਇਆ ਮਨੁੱਖ (ਮੋਹ ਦੀ ਨੀਂਦ ਵਿਚ) ਸੁੱਤਾ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਤਵਾਰੋ = ਮਸਤ, ਮਤਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La mente duerme, intoxicada por Maya,"