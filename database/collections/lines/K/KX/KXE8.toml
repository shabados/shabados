[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਤ ਅਨੰਦ ਸੁਖ ਪਾਇਆ ॥"
page = 628
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I ever attain pleasure and peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਦਾ ਖੁਸ਼ੀ ਤੇ ਆਰਾਮ ਪਾਉਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have found lasting peace and bliss."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਿਤ ਸੁਖ ਕੇ ਅਨੰਦ ਕੋ ਹਮਨੇ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਸਦਾ ਆਤਮਕ ਸੁਖ ਆਤਮਕ ਆਨੰਦ ਮਾਣਨ ਲੱਗ ਪਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਤ = ਸਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Hemos obtenido Éxtasis,"