[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸੁਝੈ, ਸਿਰਜਣਹਾਰਾ ॥੧੯॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Only gurmukh possesses the knowledge of that creator Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾਂ ਨੂੰ ਸਿਰਜਣਹਾਰ (ਪਰਮਾਤਮਾ) ਸੁਝਦਾ ਹੈ।"