[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੋੜੀ ਹੋਆ ਗੋਪਿ ਗੁਰ; ਨਿਗੁਰੇ ਤੰਤੁ ਨ ਮੰਤੁ ਸੁਖਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Its master remains unknown and on this unprincipled creature no mantra works."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੂੰ ਗੋਪ (ਛਿਪਾਕੇ) ਕੋੜ੍ਹੀ ਹੁੰਦਾ ਹੈ, ਇਹ ਨਿਗੁਰਾ (ਤੰਤ) ਤਵੀਤ ਮੰਤ੍ਰ ਕੋਈ ਨਹੀਂ ਮੰਨਦਾ।"