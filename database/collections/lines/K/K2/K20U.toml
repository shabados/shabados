data = "ਤਾ ਕੋ ਤੁਮ ਕੋ ਮਾਸੁ ਖਵਾਊ ॥੬੨॥"
page = 936

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He added, ‘If you say so, I will go and kill that deer and bring its meat for your eating.’(62)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਦਾ ਮਾਸ ਤੈਨੂੰ ਖਵਾਵਾਂ ॥੬੨॥"