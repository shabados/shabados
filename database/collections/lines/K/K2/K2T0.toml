data = "ਕਿਨੇ ਨ ਜਿਤਾ ਜਾਈ ਮਹਖੇ ਦੈਤ ਨੂੰ ॥"
page = 120

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“None hath gone and conquered Mahikha, the demon.\""

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਕਿਸੇ ਤੋਂ ਵੀ ਮਹਿਖਾਸੁਰ ਜਿਤਿਆ ਨਹੀਂ ਜਾ ਸਕਿਆ।"