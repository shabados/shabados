[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਿ ਦਇਆਲਿ ਦਇਆ ਪ੍ਰਭਿ ਧਾਰੀ ॥"
page = 1040
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The compassionate Lord Himself shows mercy."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿਹਰਬਾਨ ਮਾਲਕ ਖ਼ੁਦ ਹੀ ਮਿਹਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God Himself, the Merciful Lord, grants His Grace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਦਇਆਲ ਪ੍ਰਭੂ ਨੇ ਦਇਆ ਧਾਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਉਤੇ ਦਇਆ-ਦੇ-ਘਰ ਪ੍ਰਭੂ ਨੇ ਮੇਹਰ ਕੀਤੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਇਆਲਿ ਪ੍ਰਭਿ = ਦਇਆਲ ਪ੍ਰਭੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los catorce mundos y las dos lámparas,"