data = "ਅਮਲ ਕਹਿਯੋ ਸੋ ਤੁਰਤ ਮੰਗਾਯੋ ॥੪੦॥"
page = 828

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Being too happy, she arranged all the intoxicants which were asked for.(40)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਨਸ਼ੇ (ਜੋ ਰਾਜੇ ਨੇ) ਕਹੇ ਸਨ, ਤੁਰਤ ਮੰਗਵਾ ਲਏ ॥੪੦॥"