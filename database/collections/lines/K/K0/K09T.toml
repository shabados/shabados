[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਹਿ ਟਿਕਾ ਦਿਤੋਸੁ; ਜੀਵਦੈ ॥੧॥"
page = 966
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Guru Nanak, the King, whilst alive gave the apostolic mark to Angad."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨਾਨਕ ਪਾਤਸ਼ਾਹ ਨੇ, ਜੀਉਂਦੇ ਜੀ ਹੀ, ਗੁਰਿਆਈ ਦਾ ਤਿਲਕ ਅੰਗਦ ਨੂੰ ਦੇ ਦਿੱਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The King, while still alive, applied the ceremonial mark to his forehead. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਮਰਜਾਦਾ ਏਹੁ ਕਰੀ ਹੈ, ਜੋ ਸ੍ਵਾਮੀ ਸ੍ਰੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਨੇ (ਟਿਕਾ) ਤਿਲਕ ਗੁਰਿਆਈ ਕਾ ਲਹਣੇ ਜੀ ਕੋ ਅਪਨੇ ਜੀਵਤੇ ਹੀ ਦੀਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਸਤਿਗੁਰੂ ਜੀ ਨੇ ਜਿਊਂਦਿਆਂ ਹੀ (ਗੁਰਿਆਈ ਦਾ) ਤਿਲਕ (ਬਾਬਾ ਲਹਣਾ ਜੀ ਨੂੰ) ਦੇ ਦਿੱਤਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਿ = ਸਹੁ ਨੇ, ਮਾਲਕ ਨੇ, ਗੁਰੂ ਨੇ। ਦਿਤੋਸੁ = ਦਿੱਤਾ, ਉਸ ਨੂੰ ਦਿੱਤਾ। ਜੀਵਦੈ = ਜਿਊਂਦਿਆਂ ਹੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y estando aun en vida, se postró ante su discípulo; lo ungió como Guru mientras estaba vivo. (1)"