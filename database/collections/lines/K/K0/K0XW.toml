type = "primary"
data = "ਧਰਮ ਕ੍ਰਿਆ ਯਾ ਜਗ ਤੇ ਗਈ ॥੮੨॥"
page = 559

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sinful tendencies will prevail in such a way that all the religious acts will be finished in the world.82."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਧਰਮ ਦੀ ਕ੍ਰਿਆ ਇਸ ਸੰਸਾਰ ਤੋਂ ਚਲੀ ਜਾਏਗੀ ॥੮੨॥"