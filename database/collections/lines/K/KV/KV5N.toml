[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਿੰਨੀ ਰੈਨੜੀਐ; ਚਾਮਕਨਿ ਤਾਰੇ ॥"
page = 459
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The night is wet with dew and the stars glitter;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤ੍ਰੇਲੀ ਹੋਈ ਰਾਤ੍ਰੀ ਵਿੱਚ ਨੱਖਤ੍ਰ (ਤਾਰੇ) ਲਿਸ਼ਕਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The night is wet with dew, and the stars twinkle in the heavens."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਭਿੰਨੀ ਰਾਤਿ ਮੇਂ ਜਿਸ ਮੇਂ ਤਾਰੇ ਚਮਕ ਰਹੇ ਹੈਂ, ਜਾਗਤੇ ਹੈਂ ਵਾ ਅਵਸਥਾ ਰਾਤ੍ਰਿ ਪ੍ਰੇਮ ਰੰਗ ਮੇਂ ਭਿੰਨੀ ਹੂਈ, ਜਿਸ ਮੇਂ ਸੁਭ ਗੁਨ ਰੂਪ ਤਾਰੇ ਚਮਕਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤ੍ਰੇਲ ਭਿੱਜੀ ਰਾਤ ਵਿਚ (ਆਕਾਸ਼ ਵਿਚ) ਤਾਰੇ ਡਲ੍ਹਕਦੇ ਹਨ (ਤਿਵੇਂ, ਪਰਮਾਤਮਾ ਦੇ ਪ੍ਰੇਮ ਵਿਚ ਭਿੱਜੇ ਹੋਏ ਹਿਰਦੇ ਵਾਲੇ ਮਨੁੱਖਾਂ ਦੇ ਚਿੱਤ-ਆਕਾਸ਼ ਵਿਚ ਸੋਹਣੇ ਆਤਮਕ ਗੁਣ ਲਿਸ਼ਕਾਂ ਮਾਰਦੇ ਹਨ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਿੰਨੀ = ਤ੍ਰੇਲ-ਭਿੱਜੀ। ਰੈਨੜੀਐ = ਸੋਹਣੀ ਰਾਤ ਵਿਚ। ਚਾਮਕਨਿ = ਚਮਕਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En la frescura de la noche, cuando las estrellas brillan,"