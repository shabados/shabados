[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸੁ ਤਨ ਧਨ ਕੀ; ਕਵਨ ਬਡਾਈ ॥"
page = 326
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What is there to be proud of in this body and wealth?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਦੇਹਿ ਅਤੇ ਦੌਲਤ ਅੰਦਰ ਹੰਕਾਰ ਕਰਨ ਵਾਲੀ ਕਿਹੜੀ ਸ਼ੈ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Why should anyone take pride in this body or wealth?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਇਸ ਤਨ ਔਰ ਧਨ ਕੀ ਕਿਆ ਵਡਿਆਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਸਰੀਰ ਤੇ ਧਨ ਉੱਤੇ ਕੀਹ ਮਾਣ ਕਰਨਾ ਹੋਇਆ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਵਨ ਬਡਾਈ = ਕਿਹੜੀ ਵਡਿਆਈ ਹੈ? ਕੀਹ ਮਾਣ ਕਰਨਾ ਹੋਇਆ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cómo puede uno estar orgulloso de su cuerpo o de sus riquezas?,"