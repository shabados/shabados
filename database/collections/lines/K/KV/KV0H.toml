[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੇ ਰਾਤੇ; ਹਰਿ ਗੁਣ ਗਾਵੈ ॥੫॥"
page = 231
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Dyed with the Name, they sing God's praises."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਨਾਲ ਰੰਗੇ ਹੋਏ ਉਹ ਰੱਬ ਦਾ ਜੱਸ ਗਾਇਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Attuned to the Name, they sing the Glorious Praises of the Lord. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਵਾਹਿਗੁਰੂ ਕੇ ਨਾਮੁ ਮੇਂ ਰੱਤੇ ਹੂਏ ਹਰੀ ਕੇ ਗੁਣ ਗਾਵਤੇ ਹੈਂ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਿਚ ਹੀ ਰੰਗਿਆ ਰਹਿ ਕੇ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦਾ ਰਹਿੰਦਾ ਹੈ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਮੇ = ਨਾਮਿ ਹੀ, ਨਾਮ ਵਿਚ ਹੀ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "e imbuidos en el Naam, el Nombre cantamos siempre la Alabanza del Señor.(5)"