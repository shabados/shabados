[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਤ੍ਰ ਸਬੈ ਅਬ ਨਾਸ ਹੋਹਿੰ; ਹਮ ਕੋ ਹੋਇ ਬਿਲਾਸ ॥੫੯॥"
page = 296

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "As soon as Krishna was born, the gods were filled with joy and thought that then the enemies would be destroyed and them they would be overjoyed.59."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸਾਰੇ ਦੇਵਤੇ ਕਹਿਣ ਲਗੇ) ਹੁਣ ਸਾਡੇ ਸਾਰੇ ਵੈਰੀ ਨਸ਼ਟ ਹੋ ਜਾਣਗੇ ਅਤੇ ਸਾਨੂੰ ਸੁਖ ਪ੍ਰਾਪਤ ਹੋਵੇਗਾ ॥੫੯॥"