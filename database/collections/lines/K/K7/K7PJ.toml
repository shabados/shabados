[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਵਿਲੋਕਿ ਛਕੇ ਗਣ ਗੰਧ੍ਰਬਿਸੰ ॥੩੫੧॥"
page = 663

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The pretty faces of al looked fine like ivory and even Ganas and Gandharvas were pleased to see them.351."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਗਣਾਂ ਅਤੇ ਗੰਧਰਬਾਂ ਦੇ ਸੁਆਮੀ (ਉਸ ਨੂੰ) ਵੇਖ ਕੇ ਪ੍ਰਸੰਨ ਹੋ ਰਹੇ ਹਨ ॥੩੫੧॥"