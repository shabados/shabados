[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਉੱਚਾ ਸਿਤਾਰਾ ਦੁਸ਼ਮਨਾਂ ਨੂੰ ਸਾੜ ਦਿੰਦਾ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਕਜ਼ੋ ਆਮਦਾ ਦੁਸ਼ਮਨਾਨਸ਼ ਬਸੋਜ਼ ॥੩੩॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, it burns down the enemies. (33)"