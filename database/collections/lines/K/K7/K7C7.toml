[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੂਪਵੰਤੁ ਹੋਇ; ਨਾਹੀ ਮੋਹੈ ॥"
page = 282
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If one is beauteous, by himself he fascinates not others."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਜੀਵ ਸੁੰਦਰ ਹੈ, ਤਾਂ ਆਪਣੇ ਆਪ ਉਹ ਹੋਰਨਾ ਨੂੰ ਫਰੇਫਤਾ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who is good-looking should not be vain;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਜੀਵ ਸੁੰਦਰ ਰੂਪ ਹੋਨੇ ਸੇ ਤਿਸ ਕੋ ਮੋਹਿਤ ਨਹੀਂ ਕਰ ਸਕਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰੂਪ ਵਾਲਾ ਹੋ ਕੇ ਕੋਈ ਪ੍ਰਾਣੀ (ਰੂਪ ਦਾ) ਮਾਣ ਨਾਹ ਕਰੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹੈ ਨਾਹੀ = ਮੋਹ ਨਾਹ ਕਰੇ, ਮਸਤ ਨਾਹ ਹੋਵੇ, ਮਾਣ ਨਾਹ ਕਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si alguien es bello, que no se enorgullezca de ello,"