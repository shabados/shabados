[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੀ ਸਰਣਿ ਪਇਆ; ਗਤਿ ਪਾਈਐ ॥"
page = 106
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By seeking whose shelter emancipation is obtained,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਸ਼ਰਣਾਗਤ ਸੰਭਾਲਣ ਦੁਆਰਾ ਮੁਕਤੀ ਪਰਾਪਤ ਹੁੰਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Seeking His Sanctuary, salvation is obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਜਿਸ ਵਾਹਿਗੁਰੂ ਕੀ ਸਰਣਿ ਪੜਨੇ ਸੇ (ਗਤਿ) ਮੋਖ੍ਯ ਪਾਈਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਪਰਮਾਤਮਾ ਦਾ ਆਸਰਾ ਲਿਆਂ ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਤਿ = ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Buscando su Santuario se obtiene salvación."