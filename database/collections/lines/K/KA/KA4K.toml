[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੋਹੁ ਤੁਮ ਤਜਹੁ; ਸਗਲ ਵੇਕਾਰ ॥੧॥"
page = 356
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Leave aside worldly love, as it is all sinful and purposeless."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੰਸਾਰੀ ਮਮਤਾ ਨੂੰ ਤਰਕ ਕਰ ਦੇ, ਇਸ ਸਭ ਪਾਪਾਂ ਦੀ ਮੂਲ ਹੈ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- renounce all your attachments, for they are all corrupt. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਿਖ! ਜੋ ਸਕਲ ਬਿਕਾਰ ਰੂਪ ਮੋਹ ਹੈ, ਸੋ ਤੁਮ ਤਜਹੁ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਮੋਹ ਹੀ) ਵਿਕਾਰ ਪੈਦਾ ਕਰਦਾ ਹੈ, (ਇਸ ਵਾਸਤੇ) ਮੋਹ ਨੂੰ ਛੱਡ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "libérate entonces de los apegos, pues sólo te llevarán a cometer errores. (1)"