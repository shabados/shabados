[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਆਪੁ ਗਵਾਇ, ਅਮੋਲ ਮਣਿਕਾ ॥੨੦॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Only by erasing its ego it becomes an invaluable jewel."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਆਪਾ ਗਵਾਉਣ ਕਰ ਕੇ ਹੀ ਅਮੋਲਕ ਮਾਣਕ ਹੁੰਦਾ ਹੈ।"