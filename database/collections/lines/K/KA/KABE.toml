[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਮਖ ਨਿਮਖ ਤੁਮ ਹੀ ਪ੍ਰਤਿਪਾਲਹੁ; ਹਮ ਬਾਰਿਕ ਤੁਮਰੇ ਧਾਰੇ ॥੧॥"
page = 674
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Every moment, Thou nursest me, I, Thine child, have Thy support alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਮੁਹਤ ਤੂੰ ਮੇਰੀ ਪਰਵਰਸ਼ ਕਰਦਾ ਹੈਂ। ਮੈਂ ਤੇਰਾ ਬੱਚਾ, ਤੇਰੇ ਹੀ ਆਸਰੇ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Each and every moment, You cherish and nurture me; I am Your child, and I rely upon You alone. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਖਿਨ ਖਿਨ ਮੇਂ ਤੁਮਹੀ ਮੁਝ ਕੋ ਪ੍ਰਤਿਪਾਲਤੇ ਹੋ, ਹਮ ਬਾਰਕ ਤੁਮਾਰੇ ਧਾਰੇ ਹੂਏ ਹੈਂ, ਭਾਵ ਆਪ ਕੇ ਆਸਰੇ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਹੀ ਇਕ ਇਕ ਛਿਨ ਸਾਡੀ ਪਾਲਣਾ ਕਰਦਾ ਹੈਂ, ਅਸੀਂ (ਤੇਰੇ) ਬੱਚੇ ਤੇਰੇ ਆਸਰੇ (ਜੀਊਂਦੇ) ਹਾਂ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਮਖ = ਅੱਖ ਝਮਕਣ ਜਿਤਨਾ ਸਮਾ। ਤੁਮਰੇ ਧਾਰੇ = ਤੇਰੇ ਆਸਰੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A cada momento me elevas y me nutres, yo soy Tu niño y me apoyo sólo en Ti. (1)"