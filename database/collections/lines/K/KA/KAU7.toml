[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ; ਠਾਕੁਰ ਆਗਾਧਿ ॥"
page = 180
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the Name of the Supreme Lord, the unfathomable Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ਰੋਮਣੀ ਸਾਹਿਬ ਅਤੇ ਅਥਾਹ ਮਾਲਕ ਦੇ ਨਾਮ ਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Unfathomable, Supreme Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਠਾਕਰ ਪਾਰਬ੍ਰਹਮ ਬੇਅੰਤ ਕੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਥਾਹ (ਗੁਣਾਂ ਵਾਲੇ) ਠਾਕੁਰ ਪਾਰਬ੍ਰਹਮ ਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਗਾਧਿ = ਅਥਾਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque Él es el Único Señor, Supremo e Insondable."