[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚੋਆ ਚੰਦਨ; ਅਗਰ ਕਪੂਰਿ ॥"
page = 226
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The intoxication of the essence of Sandal, aloe wood, camphor,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੰਨਣ, ਊਦ ਦੀ ਲੱਕੜ, ਮੁਸ਼ਕ ਕਾਫੂਰ ਦੇ ਅਤਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The smell of musk, sandalwood and camphor,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚੋਆ ਚੰਦਨ ਪੁਨਾ ਅਗਰ ਤਥਾ ਕਪੂਰਾਦਿ ਜੋ ਹੈਂ ਇਨ ਕੋ ਸਰੀਰ ਮੇਂ ਲਗਾਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਦੂਜੇ ਪਾਸੇ ਜੇ ਕੋਈ ਮਨੁੱਖ) ਅਤਰ ਚੰਦਨ ਅਗਰ ਕਪੂਰ (ਆਦਿਕ ਸੁਗੰਧੀਆਂ ਦੇ ਵਰਤਣ) ਵਿਚ ਮਸਤ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੋਆ = ਅਤਰ। ਕਪੂਰਿ = ਕਪੂਰ (ਆਦਿਕ ਦੇ ਵਰਤਣ) ਵਿਚ (ਮਗਨ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El aroma de sándalo, sábila y alcanfor"