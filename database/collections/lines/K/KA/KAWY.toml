data = "ਦੇਵ ਦੇਵ ਰਾਜਨ ਕੇ ਰਾਜਾ ॥"
page = 47

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O God of gods and King of kings,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੂੰ) ਦੇਵਤਿਆਂ ਦਾ ਦੇਵਤਾ ਅਤੇ ਰਾਜਿਆਂ ਦਾ ਰਾਜਾ ਹੈਂ।"