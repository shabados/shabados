[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਹਿ ਨਿਕਾਸ ਲਯੋ ਮੁਰਿ ਪ੍ਰਾਨ; ਸੁ ਮਾਪ ਲੀਯੋ ਬਲਿ ਕੋ ਤਨ ਆਧੋ ॥"
page = 355

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He, who had killed the demon named Mur and had measueed half the body of Bali"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਮੁਰ (ਦੈਂਤ) ਦੇ ਪ੍ਰਾਣ ਕਢ ਲਏ ਸਨ ਅਤੇ ਬਲਿ ਰਾਜਾ ਦਾ ਸ਼ਰੀਰ (ਬਾਵਨ ਬਣ ਕੇ) ਮਿਣ ਲਿਆ ਸੀ।"