[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਥਿ ਹੋਇ; ਤਾ ਮੁਗਧੁ ਸਿਆਨਾ ॥"
page = 931
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If there be riches, then even and idiot is looked upon as wise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਧਨ ਪਦਾਰਥ ਹੋਵੇ, ਤਦ ਇਕ ਬੁੱਧੂ ਭੀ ਅਕਲਮੰਦ ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Even an idiot is thought of as clever, if he is rich."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਘਰ ਮੇਂ ਮਾਇਆ ਹੋਇ ਤੌ ਮੂਰਖ ਭੀ ਸਿਆਨਾ ਕਹੀਤਾ ਹੈ; ਵਾ ਜਿਸਮੇਂ ਭਗਤੀ ਹੋਵੈ ਸੋ ਮੂਰਖ ਭੀ ਚਤੁਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਮਾਇਆ (ਪੱਲੇ) ਹੋਵੇ ਤਾਂ ਮੂਰਖ ਬੰਦਾ ਭੀ ਸਿਆਣਾ (ਮੰਨਿਆ ਜਾਂਦਾ) ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si uno es rico, su ignorancia es considerada erudición, pero mira,"