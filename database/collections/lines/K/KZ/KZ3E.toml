[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨ ਸੂਰ ਸਸਿ; ਮੰਡਲੋ ॥"
page = 144
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Neither the solar and lunar regions,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਂ ਸੂਰਜ ਅਤੇ ਚੰਦਰਮਾ ਦੀਆਂ ਪੁਰੀਆਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Neither the sun, nor the moon, nor the planets,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨ ਸੂਰਜ ਔਰ ਚੰਦ੍ਰਮਾ ਕੇ (ਮੰਡਲੋ) ਅਸਥਾਨ"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾ ਸੂਰਜ, ਨਾਹ ਚੰਦਰਮਾ, ਨਾਹ ਇਹ ਦਿੱਸਦਾ ਆਕਾਸ਼,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੂਰ = ਸੂਰਜ। ਸਸਿ = ਚੰਦ੍ਰਮਾ। ਮੰਡਲੋ = ਦਿੱਸਦਾ ਆਕਾਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ni el sol, ni la luna ni las estrellas;"