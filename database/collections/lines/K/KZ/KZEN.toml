[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਣ ਝੁੰਝਨੜਾ ਗਾਉ ਸਖੀ; ਹਰਿ ਏਕੁ ਧਿਆਵਹੁ ॥"
page = 927
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my mates, melodiously sing ye the Lord's praise and contemplate one God"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੈਡੀ ਸਹੀਓ। ਤੁਸੀਂ ਸੁਰੀਲੀ ਲੈਅ ਅੰਦਰ ਮੇਰੇ ਸੁਆਮੀ ਦੀ ਕੀਰਤੀ ਗਾਇਨ ਕਰੋ, ਤੇ ਇਕ ਹਰੀ ਨੂੰ ਹੀ ਸਿਮਰੋ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sing the melodious harmonies, O my companions, and meditate on the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਰੂਪ ਸਖੀਓ! ਹਰੀ ਦਾ (ਰਣ ਝੁੰਝਨੜਾ) ਜਸ ਗਾਵਹੁ, ਏਕ ਹਰੀ ਕਾ ਹੀ ਧਿਆਨ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਹੇਲੀਹੋ! ਹੇ ਸਤਸੰਗੀਓ! ਇਕ ਪਰਮਾਤਮਾ ਦਾ ਧਿਆਨ ਧਰੋ; ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦਾ (ਉਹ) ਸੋਹਣਾ ਗੀਤ ਗਾਵੋ (ਜਿਸ ਦੀ ਬਰਕਤ ਨਾਲ ਵਿਕਾਰਾਂ ਦਾ ਟਾਕਰਾ ਕਰ ਸਕੋ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਣ = ਜੁੱਧ। ਝੁੰਝਨਾ = ਜਿੱਤਣਾ। ਰਣ ਝੁੰਝਨੜਾ = ਉਹ ਸੋਹਣਾ ਗੀਤ ਜਿਸ ਨਾਲ ਇਸ ਜਗਤ ਦੀ ਰਣ-ਭੂਮੀ ਵਿਚ ਬਿਬੇਕ ਦੀ ਸੈਨਾ ਮੋਹ ਦੀ ਸੈਨਾ ਨੂੰ ਜਿੱਤ ਲਏ, ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦਾ ਗੀਤ। ਸਖੀ = ਹੇ ਸਹੇਲੀਹੋ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mis compañeros, canten y bailen la Melodía de Éxtasis y mediten en el Dios"