[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਿ ਸਿਮਰਿ; ਸਦਾ ਸੁਖ ਪਾਉ ॥"
page = 288
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remember, remember it and obtain the ever-lasting peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਯਾਦ ਕਰ, ਯਾਦ ਕਰ ਇਸ ਨੂੰ ਅਤੇ ਸਦੀਵੀ ਆਰਾਮ ਨੂੰ ਪ੍ਰਾਪਤ ਹੋ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remember, remember it in meditation, and obtain everlasting peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਭਾਈ! ਤਿਸ ਨਾਮ ਕੌ ਮਨ ਬਾਣੀ ਸੇ ਸਿਮਰ ਕਰ ਸਦਾ ਸੁਖੋਂ ਕੋ ਪਾਵਣਾ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਸਦਾ ਸਿਮਰੋ ਤੇ ਸੁਖ ਪਾਉ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "medita en Él y encontrarás Paz Eterna."