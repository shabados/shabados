[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਵਹੁ ਤ੍ਰਿਯਾ ਸਾਹ ਚੋਰ ਕਹ ਦਈ ॥"
page = 859

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Next day the court settled and the Shah assigned that woman to the thief."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਇਸਤਰੀ ਸ਼ਾਹ ਨੇ ਚੋਰ ਨੂੰ ਦੇ ਦਿੱਤੀ।"