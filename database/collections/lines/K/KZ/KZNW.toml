[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲੈ ਆਵਹੁ ਧਰਿ ਜਾਇਯਹੁ; ਯੌ ਕਹਿ ਕਰੌ ਪਯਾਨ ॥"
page = 925

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Say, “Bring in here, leave and go away.”"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "'ਲੈ ਆਓ ਅਤੇ ਧਰ ਜਾਓ' ਇਸ ਤਰ੍ਹਾਂ ਕਹਿੰਦੇ ਹੋਇਆਂ ਜਾਓ।"