[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਠਾਕੁਰ ਤੁਝ ਬਿਨੁ; ਬੀਆ ਨ ਹੋਰ ॥"
page = 500
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Master, without Thee there is no other and second."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਲਕ! ਤੇਰੇ ਬਗੈਰ ਹੋਰ ਕੋਈ ਦੂਸਰਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord and Master, without You, there is no other at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਠਾਕੁਰ ਜੀ! ਤੁਮਾਰੇ ਬਿਨਾ ਦੂਸਰਾ ਔਰ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਾਲਕ! ਤੈਥੋਂ ਬਿਨਾ ਮੇਰਾ ਕੋਈ ਹੋਰ ਆਸਰਾ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਕੁਰ = ਹੇ ਠਾਕੁਰ! ਬੀਆ = ਦੂਜਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Maestro, no hay nadie más sin Ti; Te alabo en la mente,"