[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਾਲ ਜਵਾਹਰ ਮਣਿ ਲੋਹਾ; ਸੁਇਨਾ ਪਾਰਸ ਜਾਤਿ ਬਿਚਾਰੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Similarly, jewels, rubies, pearls, iron, philosopher's stone, gold etc. preserve their innate nature."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਲਾਲ ਜਵਾਹਰ, ਮਣੀ ਅਰ ਪਾਰਸ ਨਾਲ ਪਰਸਕੇ ਜੋ ਲੋਹੇ ਥੋਂ ਸੋਨਾ ਹੁੰਦਾ ਹੈ (ਇਨ੍ਹਾਂ ਵਿਚ) ਜਾਤੀ ਅਭਿਮਾਨ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ।"