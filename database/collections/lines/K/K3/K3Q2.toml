data = "ਪੰਚ ਜਨਾ ਸਿਉ; ਸੰਗੁ ਨਿਵਾਰੈ ॥"
page = 236
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "severs connection with the five passions,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੰਜੇ ਵਿਸ਼ੇ ਵੇਗਾਂ ਨਾਲ ਆਪਣਾ ਸੰਬਧ ਤੋੜ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "cut their connections with the five passions."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਕਾਮਾਦੀ ਪੰਚ ਵਿਕਾਰੋਂ ਕਾ ਸਾਥੁ ਨਵਿਰਤ ਕਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਾਮਾਦਿਕ ਪੰਜਾਂ ਨਾਲੋਂ ਆਪਣਾ ਸਾਥ ਹਟਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗੁ = ਸਾਥ। ਨਿਵਾਰੈ = ਹਟਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "deja la compañía de los cinco deseos,"