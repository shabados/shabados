[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੁ ਪੂਰਾ ਨਮਸਕਾਰੇ ॥"
page = 625
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I make obeisance unto my Perfect Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਪੂਰਨ ਗੁਰਾਂ ਨੂੰ ਬੰਦਨਾ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I bow in reverence to the Perfect Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਪੂਰਾ) ਪੂਜ੍ਯ ਜਾਨ ਕੇ ਤੇਰੇ ਚਰਨ ਨਮਸਕਾਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੇਹੜਾ ਮਨੁੱਖ ਪੂਰੇ ਗੁਰੂ ਦੀ ਸ਼ਰਨ ਪੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਮਸਕਾਰੇ = ਸਿਰ ਨਿਵਾਂਦਾ ਹੈ, ਸ਼ਰਨ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me postro en Reverencia ante el Guru Perfecto,"