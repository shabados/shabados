[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਲ ਲਖੈ ਕਹਿ ਲਾਲ ਤਿਸੈ; ਲਟਕਾਵਤ ਅੰਗਨ ਮੈ ਜਬ ਆਵੈ ॥"
page = 955

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When she came forward to their courtyards, swinging her posture, the woman felt her fascination."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸਤਰੀਆਂ (ਉਸ ਨੂੰ) ਪ੍ਰੀਤਮ ਸਮਝਦੀਆਂ ਸਨ ਜਦੋਂ ਉਹ ਮਟਕਦਾ ਹੋਇਆ ਵੇਹੜੇ ਵਿਚ ਆਉਂਦਾ ਸੀ।"