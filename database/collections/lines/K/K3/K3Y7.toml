data = "ਤਾ ਕੀ ਤ੍ਰਿਸਨਾ; ਕਬਹੂੰ ਨ ਜਾਈ ॥੨॥"
page = 199
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "his thirst never departs."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਪਿਆਸ ਕਦਾਚਿੱਤ ਦੂਰ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- their thirst shall never depart. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੀ ਤ੍ਰਿਸਨਾ ਕਬੀ ਨਹੀਂ ਜਾਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਵਿਕਾਰਾਂ ਦੀ) ਉਸ ਦੀ ਤ੍ਰਿਸ਼ਨਾ ਕਦੇ ਭੀ ਮਿਟਦੀ ਨਹੀਂ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "su adicción por Maya se vuelve insaciable.  (2)"