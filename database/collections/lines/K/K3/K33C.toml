[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਮ੍ਰਿਤੁ ਚੁਗਹਿ; ਗੁਰ ਸਬਦਿ ਨਿਵਾਸਾ ॥"
page = 1068
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If it abides in the Guru's word, it then, in-drinks the Nectar."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਇਹ ਗੁਰਬਾਣੀ ਅੰਦਰ ਵੱਸੇ ਤਦ ਇਹ ਸੁਧਾਰਸ ਨੂੰ ਪਾਨ ਕਰਦਾ ਜਾਂ ਚੁਗਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It drinks in the Ambrosial Nectar, resting in the Word of the Guru's Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕਰ ਨਾਮ ਅੰਮ੍ਰਿਤ ਚੋਗ ਕੋ ਚੁਗਤੇ ਹੈਂ ਔਰ ਗੁਰ ਉਪਦੇਸ਼ ਮੇਂ ਸਮਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਜੀਵ-ਪੰਛੀ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਵਿਚ ਟਿਕ ਕੇ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲੀ ਨਾਮ-ਚੋਗ ਚੁਗਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਮ੍ਰਿਤੁ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲੀ ਨਾਮ-ਚੋਗ। ਚੁਗਹਿ = ਚੁਗਦੇ ਹਨ। ਸਬਦਿ = ਸ਼ਬਦ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y si habita en la Palabra del Guru,"