[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਟੇਰਿ ਕਹਿਯੋ ਧਨ ਸਿੰਘ ਬਲੀ ਰਨ ਤ︀ਯਾਗ ਸੁਨੋ ਹਰਿ ਭਾਜਿ ਨ ਜਈਯੈ ॥"
page = 408

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The mighty Dhan Singh shouting loudly said, “O Krishna! do not leave the field and run away now"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਲਵਾਨ ਧਨ ਸਿੰਘ ਨੇ ਲਲਕਾਰਾ ਮਾਰ ਕੇ, ਹੇ ਕ੍ਰਿਸ਼ਨ! ਸੁਣੋ, ਰਣ ਨੂੰ ਤਿਆਗ ਕੇ ਭਜ ਨਾ ਜਾਣਾ।"