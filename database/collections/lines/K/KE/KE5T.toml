[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਖਰ ਪੜ੍ਹਿ ਪਰਤੀਤਿ ਕਰਿ; ਹੋਇ ਵਿਸਮਾਦੁ ਨ ਅੰਗਿ ਸਮਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Jaidev would get elated seeing and reading those words."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੈ ਦੇਵ (ਉਹ ਇਕ ਅੱਖਰ ਪੜ੍ਹ ਕੇ ਪ੍ਰਤੀਤ ਕਰ ਕੇ ਹੈਰਾਨ ਹੋ ਅੰਗ ਨਾਂ ਸਮਾਵੇ।"