[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਸਮਝ ਪ੍ਰਬੀਨ ॥੬੧੪॥"
page = 745

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly “Baaji-ari-dhanani” in the beginning and then adding “Antyantak”, the names of Tupak are formed, which O skilful persons! you may comprehend.614."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤੁਪਕ ਦਾ ਨਾਮ ਹੋ ਜਾਂਦਾ ਹੈ। ਸਮਝਦਾਰੋ! ਵਿਚਾਰ ਲਵੋ ॥੬੧੪॥"