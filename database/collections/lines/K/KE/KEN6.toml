[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਗੁਰਮੁਖਿ ਸਾਚਿ ਸਮਾਵੈ ॥੨੭॥"
page = 941
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, the God-conscious being merges in the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਵਾਹਿਗੁਰੂ ਨੂੰ ਜਾਣਨ ਵਾਲਾ ਸੱਚੇ ਸੁਆਮੀ ਅੰਦਰ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Gurmukh merges in Truth. ||27||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਪੁਨਾ ਗੁਰਮੁਖ ਸਾਚ ਸਰੂਪ ਮੇਂ ਅਰਥਾਤ ਕੇਵਲ ਮੋਖ ਕੋ ਪਾਵਤੇ ਹੈਂ॥੨੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਬੰਦਗੀ ਦੀ ਰਾਹੀਂ) ਗੁਰਮੁਖ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਵਿਚ ਲੀਨ ਰਹਿੰਦਾ ਹੈ ॥੨੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚਿ = ਸੱਚੇ ਪ੍ਰਭੂ ਵਿਚ ॥੨੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y se sumerge en la Verdad.  (27)"