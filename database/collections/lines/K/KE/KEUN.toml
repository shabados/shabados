[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ. ਕਾਟੀ ਅਗਿਆਨਤਾ; ਤਬ ਛੁਟਕੇ ਫੰਧਾ ॥੨॥"
page = 400
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Guru dispelled my spiritual ignorance then was my noose cut."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਗੁਰਾਂ ਨੇ ਮੇਰਾ ਆਤਮਕ ਅਨ੍ਹੇਰਾ ਦੂਰ ਕਰ ਦਿਤਾ ਹੈ, ਤਦ ਮੇਰੇ ਫਾਹੀ ਕੱਟੀ ਗਈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Guru dispelled my ignorance, then the noose of death was cut away from my neck. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਗੁਰੋਂ ਨੇ ਅਗਿਆਨਤਾ ਕਾਟ ਦਈ ਤਬ ਜਿਤਨੇ (ਫੰਧਾ) ਫਾਹੇ ਥੇ ਸਭ ਛੁਟ ਗਏ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਜਦੋਂ ਗੁਰੂ ਨੇ ਅਗਿਆਨਤਾ ਦੂਰ ਕਰ ਦਿੱਤੀ ਤਦੋਂ ਮੋਹ ਦੀਆਂ ਫਾਹੀਆਂ ਤੋਂ ਖ਼ਲਾਸੀ ਹੋ ਗਈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛੁਟਕੇ = ਖੁਲ੍ਹ ਗਏ, ਟੁੱਟ ਗਏ। ਫੰਧਾ = ਫਾਹੀਆਂ।  ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero cuando el Guru borró mi ignorancia, mis ataduras fueron soltadas. (2)"