[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਨ ਠਾਕੁਰ ਕੈ ਮਾਰਗਿ; ਧਾਵਉ ॥੧॥"
page = 190
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With the feet I walk the way of the Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੈਰਾ ਨਾਲ ਮੈਂ ਸੁਆਮੀ ਦੇ ਰਸਤੇ ਟੁਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With my feet, I walk on the Path of my Lord and Master. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚਰਨੋਂ ਕਰ ਪਰਮੇਸ੍ਵਰ ਕੇ ਮਾਰਗ ਚਲੋ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਪੈਰਾਂ ਨਾਲ ਮੈਂ ਪਰਮਾਤਮਾ ਦੇ ਰਸਤੇ ਉਤੇ ਚੱਲ ਰਿਹਾ ਹਾਂ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਰਨ = ਪੈਰਾਂ ਨਾਲ। ਮਾਰਗਿ = ਰਸਤੇ ਉਤੇ। ਧਾਵਉ = ਧਾਵਉਂ, ਮੈਂ ਦੌੜਦਾ ਹਾਂ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y con mis pies camino en el Sendero del Señor. (1)"