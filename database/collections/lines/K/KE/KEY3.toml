[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਮਿਲਬੇ ਕੀ ਚਾਹ ॥੧॥ ਰਹਾਉ ॥"
page = 1272
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "it walks with zeal and love. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਸੁਆਮੀ ਨਾਲ ਮਿਲਣ ਦੀ ਖਾਹਿਸ਼ ਅੰਦਰ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "hoping to meet God. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕੇ ਮਿਲਨੇ ਕੀ ਚਾਹ ਕਰੁ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਦੋਂ ਇਸ ਦੇ ਅੰਦਰ) ਪਰਮਾਤਮਾ ਨੂੰ ਮਿਲਣ ਦੀ ਤਾਂਘ (ਪੈਦਾ ਹੁੰਦੀ ਹੈ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਬੇ ਕੀ = ਮਿਲਣ ਦੀ। ਚਾਹ = ਤਾਂਘ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "esperando encontrar a Dios. (1-Pausa)"