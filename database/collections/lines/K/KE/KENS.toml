[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਡੋਲਿ. ਡੋਲਿ. ਮਹਾ ਦੁਖੁ ਪਾਇਆ; ਬਿਨਾ ਸਾਧੂ ਸੰਗ ॥"
page = 405
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the society of saints, man ever wavers and suffer great agony."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿ ਸੰਗਤ ਦੇ ਬਗੈਰ ਆਦਮੀ ਸਦਾ ਡਿੱਕ ਡੋਲੇ ਖਾਂਦਾ ਹੈ ਅਤੇ ਪਰਮ ਤਕਲੀਫ ਉਠਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He wavers and falters, and suffers such great pain, without the Saadh Sangat, the Company of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਸਾਧੂਓਂ ਕੇ ਸਤਿਸੰਗ ਕੀਏ ਬਿਨਾਂ ਆਨ ਓਰ ਫਿਰ ਫਿਰ ਕਰ ਤੈਨੇ ਪਰਮ ਦੁਖ ਪਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮਨ!) ਗੁਰੂ ਨੂੰ ਸੰਗਤਿ ਤੋਂ ਵਾਂਜਿਆ ਰਹਿ ਕੇ (ਅਸਲ ਸਹਾਈ ਪਰਮਾਤਮਾ ਵਲੋਂ) ਸਿਦਕ-ਹੀਣ ਹੋ ਹੋ ਕੇ ਤੂੰ ਬੜਾ ਦੁੱਖ ਸਹਾਰਦਾ ਰਿਹਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਡੋਲਿ ਡੋਲਿ = (ਅਸਲ ਸੰਗੀ ਪਰਮਾਤਮਾ ਵਲੋਂ) ਸਰਧਾ-ਹੀਣ ਹੋ ਹੋ ਕੇ। ਸਾਧੂ = ਗੁਰੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin la Sociedad de los Santos la propia Fe vacila y uno sufre inmensamente."