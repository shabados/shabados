[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਲਵਿਖ ਕਾਟੇ ਕਾਟਣਹਾਰਾ ॥"
page = 1062
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God, the Destroyer, destroys sins."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਸ ਕਰਨ ਵਾਲਾ ਵਾਹਿਗੁਰੂ ਪਾਪਾਂ ਨੂੰ ਨਾਸ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God, the Destroyer, destroys sins."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਾਪੋਂ ਕੋ ਕਾਟਣੇਹਾਰਾ! ਤੂੰ ਹੀ ਤਿਨ ਕੇ ਪਾਪੋਂ ਕੋ ਕਾਟਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਹੜਾ ਮਨੁੱਖ ਨਾਮ ਜਪਦਾ ਹੈ ਉਸ ਦੇ ਸਾਰੇ) ਪਾਪ (ਪਾਪ) ਕੱਟਣ ਦੀ ਸਮਰੱਥਾ ਰੱਖਣ ਵਾਲਾ ਪਰਮਾਤਮਾ ਕੱਟ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਟਣਹਾਰਾ = ਕੱਟਣ ਦੀ ਸਮਰੱਥਾ ਵਾਲਾ ਪ੍ਰਭੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues lo libera a uno de las consecuencias de sus faltas y errores."