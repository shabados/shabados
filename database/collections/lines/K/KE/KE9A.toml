[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੀ ਕਿਰਪਾ ਮੋਹਿ ਕਰਹੁ ॥"
page = 828
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Lord, show Thou such mercy unto me,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸੁਆਮੀ ਤੂੰ ਮੇਰੇ ਉਤੇ ਇਹੋ ਜਿਹੀ ਰਹਿਮਤ ਧਾਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Bless me with such mercy, Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਗੁਰੂ! ਅਬ ਆਪ ਮੇਰੇ ਪਰ ਐਸੀ ਕ੍ਰਿਪਾ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੇਰੇ ਉਤੇ ਇਹ ਮੇਹਰ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਿ = ਮੈਨੂੰ, ਮੇਰੇ ਉੱਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, bendíceme de tal forma,"