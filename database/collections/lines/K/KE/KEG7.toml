[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੋਤ ਪੁਨੀਤ; ਕੋਟ ਅਪਰਾਧੂ ॥"
page = 258
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Millions of those offenders become pure,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾਂ ਹੀ ਅਪਰਾਧੀ ਪਵਿਤ੍ਰ ਹੋ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Purifier of sinners. Millions of sinners are purified;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਕ੍ਰੋੜੋਂ (ਅਪਰਾਧੂ) ਪਾਪੀ ਪਵਿਤ੍ਰ ਹੋ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾਂ ਹੀ ਉਹ ਅਪਰਾਧੀ ਪਵਿਤ੍ਰ ਹੋ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਟਿ ਅਪਰਾਧੂ = ਕ੍ਰੋੜਾਂ ਅਪਰਾਧੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Un sinnúmero de esos seres se han salvado"