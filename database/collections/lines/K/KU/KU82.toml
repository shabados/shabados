[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮੇਰੇ; ਕਰਿ ਤਾ ਕੀ ਘਾਲ ॥੭॥"
page = 238
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My soul, perform thou His service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਜਿੰਦੜੀਏ ਤੂੰ ਉਸ ਦੀ ਚਾਕਰੀ ਕਮਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So work for Him, O my mind. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤਿਸ ਕੀ (ਘਾਲ) ਸੇਵਾ ਕਰੁ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਉਸ ਪਰਮਾਤਮਾ ਦੀ ਸੇਵਾ-ਭਗਤੀ ਕਰ ॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਾਲ = ਸੇਵਾ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, sirve a tal Señor.(7)"