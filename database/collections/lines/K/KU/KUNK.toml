[[content]]
assets = ["SSKS"]
type = "primary"
data = "ਜੈਸੇ ਦਿਨ ਸਮੈ ਆਵਾਗਵਨ ਭਵਨ ਬਿਖੈ; ਤਾਹੀ ਗ੍ਰਿਹ ਪੈਸਤ ਸੰਕਾਤ ਹੈ ਅੰਧੇਰ ਹੀ ॥"

[[content]]
assets = ["SSPK"]
type = "translation"
language = "en"
data = "Just as one keeps going in and out of a house freely, but at night during darkness one feels scared of entering the same house."

[[content]]
assets = ["SSSK"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਦਿਨ ਵੇਲੇ ਘਰ ਵਿਚ ਆਵਾਜਾਈ ਹੈ ਹੁੰਦੀ ਰਹਿੰਦੀ ਹੈ ਪਰ ਅੰਧੇਰੇ ਵੇਲੇ ਉਸੇ ਘਰ ਵੜਦਿਆਂ ਡਰੀਦਾ ਹੈ।"