[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮ ਰੰਗਿ; ਜਨ ਰਹੇ ਅਘਾਇ ॥"
page = 863
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With the Name's love, the Lord's slaves remain satiated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੀ ਪ੍ਰੀਤ ਨਾਲ ਸਾਹਿਬ ਦੇ ਗੋਲੇ ਰੱਜੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Love of the Naam, the Lord's humble servants remain satisfied."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਮ ਕੇ ਅਨੰਦ ਕਰ ਕੇ ਸੰਤ ਜਨ ਤ੍ਰਿਪਤ ਹੋ ਰਹੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪ੍ਰਭੂ ਦੇ ਸੇਵਕ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੇ ਪ੍ਰੇਮ ਵਿਚ ਟਿਕ ਕੇ ਮਾਇਆ ਦੀ ਤ੍ਰਿਸ਼ਨਾ ਤੋਂ ਬਚੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨ = (ਪ੍ਰਭੂ ਦੇ) ਸੇਵਕ। ਅਘਾਇ ਰਹੇ = ਰੱਜੇ ਰਹਿੰਦੇ ਹਨ, ਤ੍ਰਿਸ਼ਨਾ ਤੋਂ ਬਚੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Devotos del Señor están saciados"