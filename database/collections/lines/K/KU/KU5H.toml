[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੋਬਿੰਦ ਭਗਤ ਕਉ; ਕਰਹਿ ਸਲਾਮੁ ॥"
page = 865
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto the Lord's devotee they make obeisance."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਸ਼ਰਧਾਲੂ ਨੂੰ ਇਹ ਪਰਣਾਮ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but they bow in subservience to God's devotees."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਜੋ ਗੋਬਿੰਦ ਭਗਤ ਹੈਂ ਤਿਨ ਕੋ ਤੋ (ਸਲਾਮੁ) ਨਮਸਕਾਰ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਪ੍ਰਭੂ ਦੇ ਭਗਤਾਂ ਨੂੰ ਨਮਸਕਾਰ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਹਿ = ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero saludan en reverencia siempre a los Devotos del Señor;"