line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some amass five lacs of rupees."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਪੰਜ ਲੱਖ ਰੁਪਏ ਜਮ੍ਹਾਂ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some collect hundreds of thousands of dollars,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਦ੍ਯਪਿ ਕਿਸੀ ਪਾਂਚ ਲਾਖ ਗਿਣਤੀ ਕੀ ਭੀ ਮਾਇਆ ਜੋੜੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਜੀਵਾਂ ਨੇ ਪੰਜ ਪੰਜ ਲੱਖ ਦੀ ਜਾਇਦਾਦ ਜੋੜ ਲਈ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਨਹੂ = ਕਈ ਜੀਵਾਂ ਨੇ, ਜਿਨ੍ਹਾਂ ਜੀਵਾਂ ਨੇ। ਜੋਰੀ = ਇਕੱਠੀ ਕਰ ਲਈ।"

