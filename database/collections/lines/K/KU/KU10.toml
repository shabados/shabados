[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਿੰਦੂ; ਰਾਮ ਨਾਮੁ ਉਚਰੈ ॥"
page = 1160
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Hindu utters the name of Rama."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਿੰਦੂ ਰਾਮ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Hindu utters the Name of Raam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਿੰਦੂ ਰਾਮ ਨਾਮ ਕੋ ਉਚਾਰਨ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਿੰਦੂ (ਸ੍ਰੀ ਰਾਮ ਚੰਦਰ ਦੀ ਮੂਰਤੀ ਵਿਚ ਹੀ ਮਿਥੇ ਹੋਏ) ਰਾਮ ਦਾ ਨਾਮ ਉਚਾਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਮ ਨਾਮੁ = ਮੂਰਤੀ ਵਿਚ ਮਿਥੇ ਹੋਏ ਸ੍ਰੀ ਰਾਮ ਚੰਦਰ ਜੀ ਦਾ ਨਾਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el hindú recita el Nombre de Rama,"