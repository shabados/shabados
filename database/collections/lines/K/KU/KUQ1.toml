[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਨੁਖੁ; ਬਿਨੁ ਬੂਝੇ ਬਿਰਥਾ ਆਇਆ ॥"
page = 712
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without knowing the Lord, vain is the man's advent."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਜਾਨਣ ਦੇ ਬਾਝੋਂ ਵਿਅਰਥ ਹੇ ਬੰਦੇ ਦਾ ਆਗਮਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without understanding, his coming into the world is useless."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮਨਮੁਖ ਪੁਰਸ਼ ਸ੍ਵੈ ਸ੍ਵਰੂਪ ਕੇ ਸਮਲੇ ਬਿਨਾਂ ਇਸ ਮਾਨੁਖ ਦੇਹ ਮੇਂ ਵਿਅਰਥ ਹੀ ਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਜਨਮ-ਮਨੋਰਥ ਨੂੰ) ਸਮਝਣ ਤੋਂ ਬਿਨਾ ਮਨੁੱਖ (ਜਗਤ ਵਿਚ) ਆਇਆ ਵਿਅਰਥ ਹੀ ਜਾਣੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin sabiduría la vida del hombre pasa en vano,"