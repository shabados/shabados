[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੇਦ ਕੀ ਬਿਪਤਿ ਪੜੀ; ਪਛੁਤਾਨਿਆ ॥"
page = 224
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Faced with the calamity of the loss of Vedas, he did repent."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵੇਦਾਂ ਦੇ ਗੁਆਚਣ ਦੀ ਮੁਸੀਬਤ ਪੈ ਜਾਣ ਤੇ ਉਸ ਨੇ ਪਸਚਾਤਾਪ ਕੀਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Only when he was faced with the downfall of the Vedas did he repent."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਮੁਖ ਤੇ ਬੇਦ ਗਿਰ ਪੜੇ ਔਰ ਦੈਈਤ ਲੈ ਗਇਆ, ਤਬ ਯਹੀ ਬੇਦੋਂ ਕੇ ਜਾਣੇ ਕੀ ਬਿਪਤਾ ਤਿਸ ਕੋ ਪੜੀ ਔਰ ਪਸਚਾਤਾਪ ਕਰਤਾ ਭਯਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਦੋਂ ਉਸ ਦਾ ਮਾਣ ਤੋੜਨ ਵਾਸਤੇ ਉਸ ਦੇ) ਵੇਦਾਂ ਦੇ ਚੁਰਾਏ ਜਾਣ ਦੀ ਬਿਪਤਾ ਉਸ ਉਤੇ ਆ ਪਈ ਤਾਂ ਉਹ ਪਛਤਾਇਆ (ਕਿ ਮੈਂ ਆਪਣੇ ਆਪ ਨੂੰ ਵਿਅਰਥ ਹੀ ਇਤਨਾ ਵੱਡਾ ਸਮਝਿਆ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੇਦ ਕੀ ਬਿਪਤਿ = ਵੇਦਾਂ ਦੇ ਚੁਰਾਏ ਜਾਣ ਦੀ ਬਿਪਤਾ, {ਦੈਂਤ ਵੇਦ ਖੋਹ ਕੇ ਲੈ ਗਏ ਸਨ। ਦੁਖੀ ਹੋਇਆ, ਪਰਮਾਤਮਾ ਦਾ ਆਸਰਾ ਲਿਆ। ਵੇਦ ਵਾਪਸ ਦਿਵਾਏ, ਦੈਂਤ ਮਾਰ ਕੇ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no dio fin a eso, pero cuando sintió la perdida de los Vedas en su mente,"