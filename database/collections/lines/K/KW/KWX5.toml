[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਰੂ ਮਹਲਾ ੫ ਘਰੁ ੪ ਅਸਟਪਦੀਆ ॥"
page = 1018
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Maru 5th Guru. Ashatpadis."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਰੂ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ ਅਸ਼ਟਪਦੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Maaroo, Fifth Mehl, Fourth House, Ashtpadheeyaa:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਮਾਰੂ, ਘਰ ੪ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਅੱਠ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Maru, Mejl Guru Aryan, Quinto Canal Divino, Ashtapadis."