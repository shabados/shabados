[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭਨਾ ਵਿਚਿ ਵਰਤੈ ਇਕੁ ਸੋਈ ॥"
page = 1049
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the one Lord is contained amidst all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਇਕ ਸੁਆਮੀ ਹੀ ਸਾਰਿਆਂ ਅੰਦਰ ਰਮਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One Lord is contained within all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਜੀਵੋਂ ਮੇਂ ਸੋ ਇਕ ਹੀ ਵਰਤਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਕ ਉਹੀ ਪਰਮਾਤਮਾ ਸਭ ਜੀਵਾਂ ਵਿਚ ਮੌਜੂਦ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਈ = ਉਹੀ ਪਰਮਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Único Señor trabaja en medio de todo"