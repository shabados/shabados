[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਹੁ ਕਿਸਨਾ ਮੁਹਜੰਗੀਆ; ਸੇਠ ਮੰਗੀਣੇ ਨੋ ਬਲਿਹਾਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "A devotee from Mujang is known by the name of Kisana and I am sacrifice unto Mangina, the wealthy person."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੁਜੰਗ (ਗਾਉਂ) ਦਾ ਵਾਸੀ ਕਿਸ਼ਨਾ ਅਤੇ ਮੰਗੀਣੇ ਸੇਠ ਥੋਂ ਬਲਿਹਾਰ ਜਾਈਏ।"