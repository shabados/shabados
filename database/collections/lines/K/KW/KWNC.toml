[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਮੁ ਲਜਾਇ ਕਰਿ; ਭਾਗਾ ॥੧॥"
page = 626
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and so, through shame, the Death's courier has fled away."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇ ਇਸ ਲਈ ਮੌਤ ਦਾ ਦੂਤ ਸ਼ਰਮ ਦਾ ਮਾਰਿਆ ਦੌੜ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Messenger of Death has run away in shame. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਤੇ ਜਮ ਲੱਜਤ ਹੋਇਕੈ ਭਾਗ ਗਿਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪਾਸੋਂ (ਵਿਕਾਰ ਤਾਂ ਕਿਤੇ ਰਹੇ) ਜਮ (ਭੀ) ਸ਼ਰਮਿੰਦਾ ਹੋ ਕੇ ਭੱਜ ਜਾਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਜਾਇ ਕਰਿ = ਸ਼ਰਮਿੰਦਾ ਹੋ ਕੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y la muerte se avergüenza de sí misma y se va. (1)"