data = "ਸਭ ਭੂਪਨ ਕੀ ਪੂਜਾ ਕਰੀ ॥੨੧੬੫॥"
page = 515

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He took his mace in his mace in his hand and beat all the kings.2165."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਾਰਿਆਂ ਰਾਜਿਆਂ ਦੀ ਪੂਜਾ ਕੀਤੀ (ਅਰਥਾਤ ਕੁਟਾਪਾ ਚੜ੍ਹਾਇਆ) ॥੨੧੬੫॥"