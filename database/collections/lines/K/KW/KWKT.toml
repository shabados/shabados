[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਜੇ ਅਨਹਦ ਬਾਜਾ ॥"
page = 892
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The celestial strain now spontaneously resounds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੈਕੁੰਠੀ ਕੀਰਤਨ ਹੁਣ ਸੁੱਤੇ ਸਿੱਧ ਹੀ ਗੂੰਜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The unstruck sound current vibrates and resounds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੇ ਅੰਤਸਕਰਣ ਮੇਂ ਏਕ ਰਸ ਨਾਮ ਕਾ ਬਾਜਾ ਬਜੇ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਉਹਨਾਂ ਦੇ ਅੰਦਰ (ਇਉਂ ਖਿੜਾਉ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ, ਮਾਨੋ, ਉਹਨਾਂ ਦੇ ਅੰਦਰ) ਇੱਕ-ਰਸ ਵਾਜੇ ਵੱਜ ਰਹੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਜੇ = ਵੱਜਦੇ ਹਨ, ਵੱਜ ਪਏ। ਅਨਹਦ = {अनहत} ਬਿਨਾ ਵਜਾਏ, ਇੱਕ-ਰਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Melodía Divina resuena en nuestra mente"