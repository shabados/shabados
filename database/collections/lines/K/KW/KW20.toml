[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਜੰਤ ਤੇਰੀ ਸਰਣਾਈ ॥"
page = 1060
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the creatures seek Thy refuge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਮੂਹ ਜੀਵ ਤੇਰੀ ਪਨਾਹ ਲੋੜਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All beings and creatures seek Your Sanctuary."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਜੀਅ ਜੰਤ ਤੇਰੀ ਸਰਨਾਈ ਹੈਂ ਅਰਥਾਤ ਤੇਰੇ ਆਸਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜੀਅ ਜੰਤ ਤੇਰੇ ਹੀ ਆਸਰੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ = {ਲਫ਼ਜ਼ 'ਜੀਵ' ਤੋਂ ਬਹੁ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y todas las criaturas buscan sólo Tú Refugio,"