[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਿਸਮੁ ਹੋਇ ਵਿਸਮਾਦ ਲਖ; ਲਖ ਚੋਜ ਵਿਡਾਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Seeing his wonderful deeds, the elation itself becomes elated."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਇਸ) ਅਚਰਜ ਕੌਤਕ ਨੂੰ ਵੇਖਕੇ ਲੱਖਾਂ ਵਿਸਮਾਦ ਵਿਸਮ ਰਹੇ ਹਨ।"