[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹ ਆਪਿ ਰਚਿਓ; ਪਰਪੰਚੁ ਅਕਾਰੁ ॥"
page = 291
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Lord Himself fashioned the universe and forms,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਸੁਆਮੀ ਨੇ ਖੁਦ ਸੰਸਾਰ ਅਤੇ ਸਰੂਪ ਸਾਜੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When He Himself fashioned the visible world of the creation,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪਾਰਬ੍ਰਹਮ ਨੇ ਆਪ ਅਕਾਰ ਰੂਪ ਪਰਪੰਚ ਰਚਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਪ੍ਰਭੂ ਨੇ ਆਪ ਜਗਤ ਦੀ ਖੇਡ ਰਚ ਦਿੱਤੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਪੰਚੁ = {Skt. प्रपंच} ਦ੍ਰਿਸ਼ਟਮਾਨ ਸੰਸਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando el Señor creó el mundo de la forma, el cual existe por la percepción de los sentidos,"