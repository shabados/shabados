[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਪਿਰ ਦੇਖੇ; ਨਂ‍ੀਦ. ਨ ਪਾਇ ॥"
page = 1262
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and without seeing his love sleeps not at all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੇ ਪਿਆਰੇ ਨੂੰ ਵੇਖਣ ਦੇ ਬਗੈਰ ਉਸ ਨੂੰ ਨੀਂਦਰ ਨਹੀਂ ਪੈਂਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without seeing her Beloved, she does not sleep at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਤੀ ਪਰਮੇਸ੍ਵਰ ਸੇ ਬਿਨਾਂ ਤਿਸ ਕੋ ਸਾਂਤੀ ਰੂਪ ਨੀਦ ਨਹੀਂ ਪੜਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਿਵੇਂ ਜੀਵ-ਇਸਤ੍ਰੀ) ਪ੍ਰਭੂ-ਪਤੀ ਦਾ ਦਰਸ਼ਨ ਕਰਨ ਤੋਂ ਬਿਨਾ ਆਤਮਕ ਸ਼ਾਂਤੀ ਹਾਸਲ ਨਹੀਂ ਕਰ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਿਰ = ਪ੍ਰਭੂ-ਪਤੀ। ਨੀਦ = ਆਤਮਕ ਸ਼ਾਂਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sin ver a su Amado, el Alma no logra conciliar"