[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਹੰਮੇਵ ਸਿਉ; ਮਸਲਤਿ ਛੋਡੀ ॥"
page = 1347
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have abandoned all counsels with ego."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹੰਕਾਰ ਨਾਲ ਸਲਾਹ ਸਾਰੇ ਮਸ਼ਵਰੇ ਤਿਆਗ ਦਿਤੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have forsaken the advice of my ego."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੰਕਾਰ ਕੇ ਸਾਥ ਤੋ ਹਮਨੇ ਸਲਾਹਿ ਕਰਨੀ ਹੀ ਛੋਡੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਅਹੰਕਾਰ ਨਾਲ (ਭੀ) ਮੇਲ-ਮਿਲਾਪ ਛੱਡ ਦਿੱਤਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਹੰਮੇਵ = (अहंएव = ਮੈਂ ਹੀ ਮੈਂ) ਅਹੰਕਾਰ। ਮਸਲਤਿ = ਸਾਲਾਹ, ਮੇਲ-ਜੋਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ya no busco el consejo de mi ego,"