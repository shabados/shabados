[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਹ ਮਰੀਆ. ਨਹ ਜਰੀਆ ॥੧॥"
page = 746
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and he dies not, nor does he age."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਨਾਂ ਮਰਦਾ ਹੈ ਅਤੇ ਨਾਂ ਹੀ ਬੁੱਢਾ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He does not die, and he never grows old. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾ ਮਰਤਾ ਹੈ ਨਾ ਆਗ ਮੇਂ ਜਰਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪ੍ਰਭੂ ਨੂੰ ਨਾਹ ਮੌਤ ਆਉਂਦੀ ਹੈ, ਨਾਹ ਬੁਢਾਪਾ ਉਸ ਦੇ ਨੇੜੇ ਢੁੱਕਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਰੀਆ = ਬੁਢੇਪਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él no muere, ni envejece. (1)"