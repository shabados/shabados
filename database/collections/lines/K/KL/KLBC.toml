[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੋਊ ਛੁਰਾ ਤੇ ਕਾਟਿ ਗਿਰਾਵੈ ॥"
page = 989

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Rattan Singh shot an arrow, he cut it off with a dagger."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ (ਚੋਰ) ਛੁਰੇ ਨਾਲ ਕਟ ਕੇ ਸੁਟ ਦਿੰਦਾ।"