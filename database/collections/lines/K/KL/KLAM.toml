[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਿਹ ਸੁਭਟਨ ਬਲਿ ਲਰਤ ਹੈ; ਤੇ ਸਭ ਗਏ ਪਰਾਇ ॥"
page = 482

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“The warriors on whose strength you are fighting, they have all fled away"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਯੋਧਿਆਂ ਦੇ ਬਲ ਬੂਤੇ ਤੇ (ਤੂੰ) ਲੜ ਰਿਹਾ ਹੈਂ, ਉਹ ਸਾਰੇ ਭਜ ਗਏ ਹਨ।"