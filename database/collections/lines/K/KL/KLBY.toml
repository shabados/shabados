[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੂਰਜੁ ਏਕੋ; ਰੁਤਿ ਅਨੇਕ ॥"
page = 357
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and several seasons, spring from the lone sun;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਈ ਮੌਸਮ ਉਤਪੰਨ ਹੁੰਦੇ ਹਨ, ਇਕੱਲੇ ਆਫਤਾਬ ਤੋਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "And seasons all originate from the one sun,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਏਕ ਸੂਰਜ ਕੇ ਵਿਖੇ ਯਹ ਅਨੇਕ ਭੇਦ ਹੈਂ ਵਾਸਤਵ ਤੇ ਸੂਰਜ ਏਕ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਸੂਰਜ ਇਕੋ ਹੀ ਹੈ (ਜਿਸ ਦੇ ਇਹ ਸਾਰੇ ਵਖ ਵਖ ਸਰੂਪ ਹਨ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "੬ ਰੁੱਤਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "las cuatro estaciones, todos son la creación del Mismo Sol Solitario;"