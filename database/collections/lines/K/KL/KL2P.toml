[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਹਰਿ; ਗਿਆਨ ਧਿਆਨ ਇਸਨਾਨ ॥"
page = 267
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He makes a show of Divine Knowledge contemplation and ablution."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਬ੍ਰਹਿਮ-ਬੋਧ, ਸਿਮਰਨ ਅਤੇ ਭਜਨ ਕਰਨ ਦਾ ਦਿਖਲਾਵਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Outwardly, they display knowledge, meditation and purification,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਾਹਰ ਤੇ ਗਿਆਨ ਕਥਨੀ ਕਾ ਔ ਧਿਆਨ ਪਖੰਡ ਸੇ ਇਸ਼ਨਾਨ ਦਿਖਾਵੇ ਹੇਤ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬਾਹਰ (ਵਿਖਾਵੇ ਵਾਸਤੇ) (ਤੀਰਥ) ਇਸ਼ਨਾਨ ਤੇ ਗਿਆਨ ਦੀਆਂ ਗੱਲਾਂ ਕਰਦਾ ਹੈ, ਸਮਾਧੀਆਂ ਭੀ ਲਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y por más que finge, sus acciones lo delatan."