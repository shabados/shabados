[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦਾ ਅਨੰਦੁ; ਤਹ ਨਹੀ ਬਿਓਗੁ ॥"
page = 275
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In that state, there is everlasting happiness and no separation from God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਹਾਲਤ ਵਿੱਚ ਸਦੀਵੀ ਪਰਸੰਨਤਾ ਹੈ ਅਤੇ ਵਾਹਿਗੁਰੂ ਨਾਲੋਂ ਕੋਈ ਵਿਛੋੜਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is in eternal bliss, and is not separated from God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਸਦਾ ਹੀ ਅਨੰਦ ਰਹਿਤਾ ਹੈ ਕਿਉਕਿ ਤਿਸ ਕੋ ਕਬੀ ਹਰੀ ਕਾ ਵਿਜੋਗ ਨਹੀਂ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਸਦਾ ਆਨੰਦ ਹੈ (ਕਿਉਂਕਿ) ਓਥੇ (ਭਾਵ, ਉਸ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪ੍ਰਭੂ-ਚਰਨਾਂ ਤੋਂ) ਵਿਛੋੜਾ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਓਗੁ = ਵਿਛੋੜਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no vuelve a entristecerse y vive en Éxtasis."