[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤ੍ਰਿਪਤਿ ਆਘਾਏ ਸੰਤਾ ॥"
page = 1006
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They remain sated and satiated,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਰੱਜੇ ਅਤੇ ਧ੍ਰਾਪੇ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Saints are fulfilled and satisfied;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤ੍ਰਿਪਤ ਹੋ ਕੇ ਸੰਤ ਰਜੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ (ਅਮੋਲਕ ਨਾਮ-ਲਾਲ ਵਿਹਾਝ ਕੇ ਮਾਇਆ ਵਲੋਂ) ਪੂਰਨ ਤੌਰ ਤੇ ਰੱਜ ਗਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤ੍ਰਿਪਤਿ = ਰੱਜ, ਰਜੇਵਾਂ। ਅਘਾਏ = ਰੱਜ ਗਏ। ਤ੍ਰਿਪਤਿ ਅਘਾਏ = ਪੂਰਨ ਤੌਰ ਤੇ ਰੱਜ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Son confortados y saciados por Dios,"