[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਜਾਨ ਅਤੇ ਦਿਲ ਰੱਬ ਦੇ ਰਾਹ ਉਤੇ ਕੁਰਬਾਨ ਕਰ ਦੇਵੇ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਜਾਨੋ ਦਿਲ ਕੁਰਬਾਂ ਰਹਿ ਸੁਬਹਾਂ ਕੁਨਦ ॥੪੬੫॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Should also be prepared to sacrifice both the life and the soul on the path of Akaalpurakh. (465)"