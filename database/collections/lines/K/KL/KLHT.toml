[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਤ੍ਰੁ ਨਾਸਤ ਹੋਹਿਗੇ ਸੁਖ ਪਾਇ ਹੈਂ ਸਭ ਸੰਤ ॥੫੩॥"
page = 205

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Bowing at the feet of Brahmins, he gave them innumerable gifts and all the people felt that now the enemies will be destroyed nad the saints will attain peace and comfort.53."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੁਣ) ਵੈਰੀ ਨਸ਼ਟ ਹੋਣਗੇ ਅਤੇ ਸਭ ਸੰਤ ਸੁਖ ਪਾਣਗੇ ॥੫੩॥"