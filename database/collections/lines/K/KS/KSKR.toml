[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਣੁ ਏਹੋ; ਹੋਰੁ ਨਾਹੀ ਕੋਇ ॥"
page = 9
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This alone is His merit that none else is like Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਇਹੋ ਹੀ ਖੂਬੀ ਹੈ ਕਿ ਉਸਦੇ ਵਰਗਾ ਹੋਰ ਕੋਈ ਨਹੀਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This Virtue is His alone; there is no other like Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹੋ ਜੇਹਾ, ਭਾਵ ਪਰਮੇਸ੍ਵਰ ਜੈਸਾ ਗੁਣੁ ਹੋਰੁ ਕਿਸੀ ਮੈਂ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਵੱਡੀ ਖ਼ੂਬੀ ਇਹ ਹੈ ਕਿ ਕੋਈ ਹੋਰ ਉਸ ਵਰਗਾ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਣੁ ਏਹੋ = ਇਹੀ ਖ਼ੂਬੀ। ਕੋ = ਕੋਈ (ਹੋਰ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Esta es Su Grandeza, no hay nadie igual a Él,"