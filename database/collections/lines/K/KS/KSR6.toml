data = "ਨਾਮ ਤੁਪਕ ਕੇ ਸਭ ਅਨੁਮਾਨਹੁ ॥੧੦੩੪॥"
page = 782

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Krishnan”, utter the words “Satchar-pati-ripu” and know all the names of Tupak.1034."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸਨੂੰ) ਸਭ ਤੁਪਕ ਦਾ ਨਾਮ ਅਨੁਮਾਨ ਕਰੋ ॥੧੦੩੪॥"