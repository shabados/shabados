[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਦ ਹੀ; ਸਾਚਿ ਮਿਲਾਵਾ ਹੋਇ ॥੧॥"
page = 1173
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then meets he with the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਹ ਸੱਚੇ ਸੁਆਮੀ ਨੂੰ ਮਿਲ ਪੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and then, one meets the True Lord. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਹੀ ਸਾਚੇ ਪਰਮੇਸ੍ਵਰ ਸੇ ਮੇਲਾ ਹੋ ਜਾਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਹੀ ਸਦਾ-ਥਿਰ ਪਰਮਾਤਮਾ ਵਿਚ ਉਸ ਦਾ ਮਿਲਾਪ ਹੋ ਜਾਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਦ = ਤਦੋਂ। ਸਾਚਿ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਵਿਚ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así nos fundimos en el Uno Verdadero. (1)"