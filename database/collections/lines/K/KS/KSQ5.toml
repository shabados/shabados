[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਲਪ ਕਰੇ; ਚਾਤ੍ਰਿਕ ਕੀ ਨਿਆਈ ॥"
page = 96
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It bewails like the pied-cuckoo."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਪਪੀਹੇ ਦੀ ਮਾਨਿੰਦ ਵਿਰਲਾਪ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It cries out like the thirsty song-bird."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਚਾਤ੍ਰਕ ਵਤ ਬ੍ਰਿਲਾਪ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਵੇਂ ਪਪੀਹਾ ਸ੍ਵਾਂਤੀ ਬੂੰਦ ਲਈ ਤਰਲੇ ਲੈਂਦਾ ਹੈ) ਪਪੀਹੇ ਵਾਂਗ (ਮੇਰਾ ਮਨ ਗੁਰੂ ਦੇ ਦਰਸਨ ਲਈ) ਤਰਲੇ ਲੈ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਲਪ = ਵਿਰਲਾਪ, ਤਰਲੇ। ਨਿਆਈ = ਨਿਆਈਂ, ਵਾਂਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "llora como el Cuclillo por una gota de  Néctar."