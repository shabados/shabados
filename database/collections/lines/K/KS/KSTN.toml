[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਖਵੰਤ; ਆਨੰਤ ਦਇਆਲਾ ॥"
page = 1073
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is joyful and infinitely compassionate."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਸੰਨ ਅਤੇ ਬੇਅੰਤ ਮਿਹਰਵਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is joyful, blissful and merciful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਸੰਨਤਾ ਵਾਲਾ ਬਿਅੰਤ ਜੋ ਦਿਆਲੂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬੇਅੰਤ ਪਰਮਾਤਮਾ ਖ਼ੁਸ਼ੀਆਂ ਦਾ ਮਾਲਕ ਹੈ, ਦਇਆ ਦਾ ਘਰ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਖ = ਖ਼ੁਸ਼ੀ। ਹਰਖਵੰਤ = ਖ਼ੁਸ਼ੀ ਦਾ ਮਾਲਕ। ਆਨੰਤ = ਅਨੰਤ, ਜਿਸ ਦਾ ਅੰਤ ਨਹੀਂ ਪਾਇਆ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es Infinitamente Compasivo, siempre está en Dicha y Su Luz es manifiesta,"