[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਗੜਦੀ ਬੀਰ ਬੈਤਾਲ ਆਗੜਦੀ ਆਰਣ ਰੰਗ ਰਚਯੋ ॥"
page = 240

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The stampede of the brave fiends became violent and alongwith it the war also grew in intensity"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬੀਰ ਬੈਤਾਲ ਯੁੱਧ-ਭੂਮੀ (ਵਿੱਚ ਫਿਰਦਾ ਹੈ) ਸਾਰਿਆਂ ਦਾ ਲਹੂ ਨਾਲ ਲਾਲ ਰੰਗ ਬਣਿਆ ਹੋਇਆ ਹੈ।"