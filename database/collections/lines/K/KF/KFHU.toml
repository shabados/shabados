[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਮਸਤਕਿ; ਗੁਰਿ ਧਰਿਆ ਹਾਥੁ ॥"
page = 1340
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, on whose forehead, the Guru, places his hand,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਮੱਥੇ ਉਤੇ ਗੁਰੂ ਜੀ ਆਪਣਾ ਹੱਥ ਰੱਖਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That person, upon whose forehead the Guru places His Hand"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਮਸਤਕ ਪਰ ਸਤਿਗੁਰੋਂ ਨੇ ਹਾਥ ਧਰਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੇ ਜਿਸ (ਮਨੁੱਖ) ਦੇ ਮੱਥੇ ਉੱਤੇ ਹੱਥ ਰੱਖਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸੁ ਮਸਤਕਿ = ਜਿਸ (ਮਨੁੱਖ) ਦੇ ਮੱਥੇ ਉੱਤੇ। ਗੁਰਿ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Esa persona a quien sobre su frente el Guru posa Su Mano,"