[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਵਿ ਨਿਵਿ ਪਾਇ ਲਗਉ ਦਾਸ ਤੇਰੇ; ਕਰਿ ਸੁਕ੍ਰਿਤੁ. ਨਾਹੀ ਸੰਗਨਾ ॥੩॥"
page = 1080
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Bending low I fall at the feet of Thine slaves and feel not shy in doing goods deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨੀਵਾਂ ਝੁਕ ਕੇ ਮੈਂ ਤੇਰੇ ਗੋਲਿਆਂ ਦੇ ਪੈਰੀਂ ਪੈਂਦਾ ਹਾਂ ਅਤੇ ਚੰਗੇ ਕਰਮ ਕਰਦਾ ਹੋਇਆ ਸ਼ਰਮ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I humbly bow and fall at the feet of Your slaves; I do not hesitate to do good deeds. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੇਰੇ ਦਾਸ ਹੋਵੈਂ ਤਿਨ ਕੇ ਚਰਣੀ ਮੈਂ ਨਿਵਿ ਨਿਵਿ ਅਰਥਾਤ ਮਨ ਤਨ ਕਰ ਕੇ ਲਾਗੋਂ, ਪੁਨਃ ਸ਼ੁਭ ਕਰਮ ਕਰਤਾ ਭੀ ਨਾ ਸੰਗਾਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਨਿਊਂ ਨਿਊਂ ਕੇ ਤੇਰੇ ਸੇਵਕਾਂ ਦੀ ਚਰਨੀਂ ਲੱਗਦਾ ਰਹਾਂ। ਇਹ ਨੇਕ ਕਮਾਈ ਕਰਦਿਆਂ ਮੈਨੂੰ ਕਦੇ ਝਾਕਾ ਨਾਹ ਲੱਗੇ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਵਿ = ਨਿਊਂ ਕੇ। ਪਾਇ ਲਗਉ = ਪਾਇ ਲਗਉਂ, ਮੈਂ ਪੈਰੀਂ ਲੱਗਾਂ। ਕਰਿ = ਕਰ ਕੇ। ਸੁਕ੍ਰਿਤੁ = ਨੇਕ ਕਮਾਈ। ਸੰਗਨਾ = ਝਾਕਾ ਲੱਗੇ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y continuar con las buenas acciones. (3)"