[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੁ ਮਾਰੇ; ਤਾ ਤ੍ਰਿਭਵਣੁ ਸੂਝੈ ॥"
page = 120
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When man effaces his self-conceit, then does he come to acquire the knowledge of the three worlds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਬੰਦਾ ਆਪਣੀ ਸਵੈ-ਹੰਗਤਾ ਨੂੰ ਮੇਸ ਦਿੰਦਾ ਹੈ, ਤਦ ਉਸ ਨੂੰ ਤਿੰਨਾਂ ਜਹਾਨਾਂ ਦੀ ਗਿਆਤ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who subdue their egotism, come to know the three worlds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਕਰ ਅਹੰਕਾਰ ਕੋ ਮਾਰੇ ਤੋ ਤ੍ਰਿਲੋਕੀ ਕੀ ਮਿਥ੍ਯਾ ਰੂਪ ਕਰ ਸਮਝ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇਹੜਾ ਸਮਝਦਾ ਹੈ, ਉਹ ਜਦੋਂ ਆਪਣੇ ਅੰਦਰੋਂ) ਆਪਾ-ਭਾਵ ਦੂਰ ਕਰਦਾ ਹੈ, ਤਦੋਂ ਉਹ ਪਰਮਾਤਮਾ ਨੂੰ ਤਿੰਨਾਂ ਭਵਨਾਂ ਵਿਚ ਵਿਆਪਕ ਜਾਣ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੁ = ਆਪਾ-ਭਾਵ। ਤ੍ਰਿਭਵਣੁ = ਸਾਰਾ ਜਗਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si calma su ego, puede conocer los tres mundos."