[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈ ਮਨਿ ਤਨਿ ਪ੍ਰਭੂ ਧਿਆਇਆ ॥"
page = 72
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With my soul and body I have reflected over the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਆਤਮਾ ਤੇ ਦੇਹਿ ਨਾਲ ਮੈਂ ਸੁਆਮੀ ਦਾ ਅਰਾਧਨ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Within my mind and body, I meditate on God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਨੇ ਮਨ ਤਨ ਕਰ ਕੇ ਹੇ ਪ੍ਰਭ ਜੀ! ਤੇਰੇ ਕੋ ਧਿਆਵਨਾ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਮਨ ਵਿਚ ਪ੍ਰਭੂ ਨੂੰ ਸਿਮਰਿਆ ਹੈ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਪ੍ਰਭੂ ਨੂੰ ਧਿਆਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਦੀ ਰਾਹੀਂ, ਮਨ ਵਿਚ। ਤਨਿ = ਤਨ ਵਿਚ, ਤਨ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En cuerpo y Alma he habitado en el Señor, y el deseo de mi mente ha sido satisfecho."