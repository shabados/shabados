[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਿਤ ਤਿਤ ਦੀਹ ਦਨੁਜ ਦਲ ਮਲੇ ॥੫੪੯॥"
page = 606

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O my Lord! they all left their countries and went here and there and the Lord Kalki destroyed the tyrants everywhere.549."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਕਿਥੇ ਵਡਾਕਾਰੀ ਦੈਂਤਾਂ ਨੂੰ ਦਲਮਲ ਸੁਟਿਆ ਹੈ ॥੫੪੯॥"