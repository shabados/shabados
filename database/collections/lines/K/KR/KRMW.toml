[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਕੀ; ਪ੍ਰਭ ਪਹਿ ਅਰਦਾਸਿ ॥੪॥੨੩॥੭੪॥"
page = 389
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "this alone is Nanak's supplication before the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਇਸ ਦੀ ਸੁਆਮੀ ਮੂਹਰੇ ਪ੍ਰਾਰਥਨਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is Nanak's prayer to God. ||4||23||74||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਪ੍ਰਭੂ! ਤੇਰੇ ਪਾਸ ਮੇਰੀ ਯਹੀ ਅਰਦਾਸ ਹੈ॥੪॥੨੩॥੭੪॥☬ਪਰਮੇਸਰ ਸੇ ਬੇਮੁਖ ਜੀਵੋਂ ਕੋ ਸਦਾ ਹਰਖ ਸੋਕ ਕੀ ਪ੍ਰਾਪਤੀ ਦਿਖਾਵਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੇਹਰ ਕਰ) ਨਾਨਕ ਦੀ ਤੇਰੇ ਪਾਸ ਇਹ ਬੇਨਤੀ ਹੈ ॥੪॥੨੩॥੭੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਹਿ = ਪਾਸ ॥੪॥੨੩॥੭੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y alaba a nadie más que a Ti, Maestro Sublime. (4-23-74)"