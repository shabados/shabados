data = "ਤਬੈ ਕਾਜ ਚਲਬੇ ਨਿਮਿਤ; ਮਥੁਰਾ ਮੈ ਮਨੁ ਦੀਨ ॥੨੨॥"
page = 292

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Vasudev made all the preparations for wedding and made arrangements for going to Mathura.22."

[[content]]
