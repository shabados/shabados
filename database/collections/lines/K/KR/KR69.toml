[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਨਾਇ ਲਏ, ਦੁਖੁ ਡੇਰਾ ਢਹਿਆ ॥੨੦॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Utterance of Name of the Lord dispels all sorrow."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(੯) ਨਾਮ ਲੈਣ ਨਾਲ ਦੁੱਖਾਂ ਦਾ ਡੇਰਾ ਢਹਿ ਪਿਆ।"