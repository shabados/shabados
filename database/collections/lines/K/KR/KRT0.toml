[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਪੂਰਬ ਤੋ ਪੱਛਮ ਤੱਕ ਦੇ ਸਾਰੇ ਸਰਦਾਰ ਅਤੇ ਬਾਦਸ਼ਾਹ"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਜ਼ਿ ਮਸ਼ਰਿਕ ਬ-ਮਗ਼ਰਿਬ ਹਮਾ ਸਰਵਰਾਂ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "All the chiefs and the kings from the east to the west"