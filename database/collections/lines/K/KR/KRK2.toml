[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਮਨ ਬੇਖ ਕੈ ਸ︀ਯਾਮ ਜੁ ਚਾਹਤ ਸ੍ਰੀ ਹਰਿ ਕੋ ਤਿਹ ਭੂਪਤਿ ਦੀਨੋ ॥"
page = 452

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Whatever Krishna had begged in the garb of a Brahmin, the king have the same to him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਾਹਮਣ ਦੇ ਭੇਸ ਵਿਚ ਸ਼ਿਆਮ ਨੂੰ ਜੋ ਕੁਝ ਚਾਹੁੰਦਾ ਸੀ, ਰਾਜੇ ਨੇ ਓਹੀ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਨੂੰ ਦੇ ਦਿੱਤਾ।"