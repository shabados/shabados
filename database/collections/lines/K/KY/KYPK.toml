data = "ਭੂੰਜਿ ਕੋਕਿਲਾ ਕੌ ਲੈ ਦੀਨੋ ॥੬੬॥"
page = 936

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He cut his meat and, after roasting, gave that to Kokila.(66)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਭੁੰਨ ਕੇ ਕੋਕਿਲਾ ਨੂੰ ਲਿਆ ਦਿੱਤਾ ॥੬੬॥"