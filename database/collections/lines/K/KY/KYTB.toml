[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਾਵੇ ਕਾ ਫਲੁ ਹੋਈ ॥"
page = 599
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The fruit of hymning His praise is gathered,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਕੀਰਤੀ ਗਾਇਨ ਕਰਨ ਦਾ ਮੇਵਾ ਤਦ ਪ੍ਰਾਪਤ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The rewards of singing His Praises"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਗਾਉਨੇ ਕਾ ਫਲ ਤੌ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਨ ਦਾ ਜੋ ਫਲ ਹੈ (ਕਿ ਸਦਾ ਉਸ ਦੇ ਚਰਨਾਂ ਵਿਚ ਲੀਨ ਰਹਿ ਸਕੀਦਾ ਹੈ, ਇਹ ਭੀ ਤਦੋਂ ਹੀ ਮਿਲਦਾ ਹੈ)"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues solamente si Dios, nuestro Señor, nos bendice,"