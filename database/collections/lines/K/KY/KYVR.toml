page = 71
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All devices and endeavours,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਮੂਹ ਜੁਗਤੀਆਂ ਅਤੇ ਉਪਰਾਲੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Abandoning all devices and contrivances,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸਗਲ ਉਕਤਿ) ਸਰਬ (ਉਕਤਿ) ਅਪਨੀ ਕਪੋਲ ਕਲਪਨਾ ਕੇ (ਉਪਾਵਾ) ਯਤਨੋਂ ਸੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਮੈਂ ਤਾਂ ਇਹ ਸਾਰੀਆਂ ਦਲੀਲਾਂ ਤੇ ਸਾਰੇ ਹੀ ਉਪਾਉ ਛੱਡ ਦਿਤੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਕਤਿ = ਦਲੀਲ। ਉਪਾਵਾ = ਹੀਲੇ।"

