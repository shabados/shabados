[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਨਾਮ; ਰਸਨਾ ਕਹਨ ॥"
page = 837
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's Name, utter I with my tongue."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦਾ ਨਾਮ, ਮੈਂ ਆਪਣੀ ਜੀਭਾ ਨਾਲ ਲੈਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I chant the Lord's Name with my tongue."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਤਿਸ ਹਰੀ ਕਾ ਨਾਮ ਜੋ ਰਸਨਾ ਸੇ ਉਚਾਰਨ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੀਭ ਨਾਲ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਉਚਾਰਨਾ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸਨਾ = ਜੀਭ (ਨਾਲ)। ਕਹਨ = ਉਚਾਰਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Al recitar el Nombre del Señor con mis labios,"