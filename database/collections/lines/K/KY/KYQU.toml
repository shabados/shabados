[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਲੁ ਨ ਚਾਪੈ; ਦੁਖੁ ਨ ਸੰਤਾਪੈ ॥"
page = 111
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Him, death crushes not, nor does agony annoy."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਮੌਤ ਨਹੀਂ ਕੁਚਲਦੀ, ਨਾਂ ਹੀ ਕਸ਼ਟ ਦੁਖੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Death does not crush him, and pain does not afflict him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੋ ਕਾਲੁ (ਨ ਚਾਪੈ) ਦਬਾਇ ਨਹੀਂ ਸਕਤਾ ਹੈ ਇਸੀ ਤੇ ਦੁਖ ਨਹੀਂ ਸਤਾਉਤਾ ਹੈ, ਭਾਵ ਏਹ ਕਿ ਜਨਮਾਦਿ ਦੁਖੋਂ ਸੇ ਰਹਤ ਹੋ ਜਾਤੇ ਹੈਂ॥☬ਪ੍ਰਸ਼ਨ: ਇਨ ਦੁਖੋਂ ਸੇ ਰਹਤ ਕੈਸੇ ਹੂਏ ਹੈਂ?☬ਉਤਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਆਤਮਕ ਮੌਤ (ਆਪਣੇ ਪੰਜੇ ਵਿਚ) ਫਸਾ ਨਹੀਂ ਸਕਦੀ, ਉਸ ਨੂੰ ਕੋਈ ਦੁੱਖ-ਕਲੇਸ਼ ਦੁਖੀ ਨਹੀਂ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਲੁ = ਮੌਤ, ਆਤਮਕ ਮੌਤ। ਚਾਪੈ = {चाप = ਧਨੁਖ} ਫਾਹੀ ਪਾ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ni la aflicción, ni el dolor lo destruyen;"