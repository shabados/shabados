[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰਿ ਬਾਹਰਿ; ਹਰਿ ਪ੍ਰਭੁ ਸਾਥੇ ॥"
page = 107
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and within and without the Lord God keeps man's company."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਅੰਦਰ ਬਾਹਰ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਬੰਦੇ ਦੇ ਨਾਲ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Inwardly and outwardly, the Lord God is always with us."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਬ੍ਰਹਮੰਡ ਪਿੰਡ ਮੇਂ ਹਰੀ ਹੈ, ਸੋ ਪ੍ਰਭੁ ਸਾਥ ਹੀ ਤਿਨੋਂ ਨੇ ਜਾਨਿਆ ਹੈ, ਭਾਵ ਏਹਿ ਕਿ ਆਪ ਕੋ ਬ੍ਰਹਮ ਰੂਪੁ ਨਿਸਚੇ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਦੇ ਹਿਰਦੇ ਵਿਚ ਤੇ ਬਾਹਰ ਜਗਤ ਵਿਚ ਪਰਮਾਤਮਾ (ਹਰ ਵੇਲੇ) ਨਾਲ (ਵੱਸਦਾ ਪ੍ਰਤੀਤ) ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y uno goza de la Compañía del Señor dentro y fuera de su ser."