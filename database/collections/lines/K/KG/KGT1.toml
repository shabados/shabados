[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦ ਜੀਵਨੁ ਭਲੋ ਕਹਾਂਹੀ ॥"
page = 655
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Men call it a good thing to live for ever."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਮੇਸ਼ਾਂ ਲਈ ਜੀਊਂਦੇ ਰਹਿਣ ਨੂੰ ਲੋਕ ਚੰਗੀ ਗੱਲ ਆਖਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "People say it is good to live forever,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਮਿਲਾਪ ਸੇ ਬਿਨਾ ਯਦਪਿ ਸਦਾ ਚਿਰ ਪਰਯੰਤ ਜੀਵਨਾ ਹੋਵੈ ਔ ਅਪਨੇ ਕੋ ਸਭ ਮੇਂ ਭਲਾ ਕਹਾਵੇ ਤਾਂ ਵੀ ਕਿਸੀ ਅਰਥ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੀਵਨ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਹੈ, ਤੇ ਜਿਸ ਨੂੰ ਲੋਕ ਸੁਹਣਾ ਜੀਵਨ ਆਖਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹਾਂਹੀ = (ਲੋਕ) ਆਖਦੇ ਹਨ, ਕਹਹਿ। ਭਲੋ = ਭਲਾ, ਚੰਗਾ, ਸੁਹਣਾ। ਸਦ ਜੀਵਨੁ = (ਇਸ) ਅਟੱਲ ਜੀਵਨ (ਨੂੰ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Obtén a ese Señor sin el Cuál uno no puede vivir."