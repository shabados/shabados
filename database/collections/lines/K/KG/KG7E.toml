[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਤਉ; ਏਕੁ ਰਮਈਆ ਲੈਹਉ ॥"
page = 874
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I take to the name of the One Lord alone."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤਾਂ ਕੇਵਲ ਇਕ ਸੁਆਮੀ ਦੇ ਨਾਮ ਨੂੰ ਹੀ ਲੈਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I take only the Name of the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੋ ਏਕ ਰਮਈਆ ਜੋ ਬਿਆਪਕ ਨਿਰਗੁਣ ਤਿਸ ਕਾ ਹੀ ਆਸਰਾ ਲੇਉਂਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪੰਡਤ!) ਮੈਂ ਤਾਂ ਇੱਕ ਸੋਹਣੇ ਰਾਮ ਦਾ ਨਾਮ ਹੀ ਲਵਾਂਗਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਉ = ਤਾਂ। ਰਮਈਆ = ਸੋਹਣਾ ਰਾਮ। ਲੈ ਹਉ = ਲਵਾਂਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me he metido sólo en mi Señor"