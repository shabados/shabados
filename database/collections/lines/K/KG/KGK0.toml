[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰੈਨਿ ਚੋਰ ਚੋਰਤ ਗ੍ਰਿਹਨ; ਤਾਹਿ ਮਿਲਤ ਠਗ ਆਇ ॥੬॥"
page = 859

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘At night the thief would go to steal and the swindler would come to meet her.(6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਨੂੰ ਚੋਰ ਘਰਾਂ ਵਿਚ ਚੋਰੀ ਕਰਨ ਜਾਂਦਾ ਅਤੇ ਉਸ (ਇਸਤਰੀ) ਨੂੰ ਠਗ ਆ ਮਿਲਦਾ ॥੬॥"