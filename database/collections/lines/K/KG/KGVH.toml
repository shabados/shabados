[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਿਰਦੈ; ਹਰਿ ਕੇ ਚਰਣ ਵਸਾਈ ॥"
page = 619
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within my mind, I enshrine the Lord's feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਅੰਦਰ ਮੈਂ ਪ੍ਰਭੂ ਦੇ ਪੈਰ ਟਿਕਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I enshrine the Lord's Feet within my heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਹਰਿ ਕੇ ਚਰਨੋਂ ਕੀ ਪ੍ਰੀਤੀ ਰਿਦੇ ਮੇਂ ਬਸਾਈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਪਰਮਾਤਮਾ ਦੇ ਚਰਨ ਟਿਕਾਈ ਰੱਖ (ਨਿਮ੍ਰਤਾ ਵਿਚ ਰਹਿ ਕੇ ਪਰਮਾਤਮਾ ਦਾ ਸਿਮਰਨ ਕਰਿਆ ਕਰ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਿਰਦੈ = ਹਿਰਦੇ ਵਿਚ। ਵਸਾਈ = ਵਸਾਇ, ਟਿਕਾ ਰੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Enaltezco los Pies del Señor en mi mente,"