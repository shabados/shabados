[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੁਧੁ ਕਰੈ ਕਹੂ ਮਲਨ ਸੋ; ਕਹੂ ਨੰਦਗ ਹਾਥਿ ਲੀਏ ਚਮਕਾਵੈ ॥"
page = 530

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere he is fighting with the wrestlers and somewhere he is rotating the mace with his hand"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਧਰੇ ਪਹਿਲਵਾਨਾਂ ਨਾਲ ਯੁੱਧ ਕਰਦੇ ਹਨ ਅਤੇ ਕਿਧਰੇ ਨੰਦਗ (ਖੜਗ) ਨੂੰ ਹੱਥ ਵਿਚ ਲੈ ਕੇ ਚਮਕਾਉਂਦੇ ਹਨ।"