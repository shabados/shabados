[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਮੈਂ ਕਹਾਂ ਸਿਧ ਹੈ, ਰੇ ਜੜ, ਤੋਹਿ ਕਛੂ ਬਰ ਦੈਹੈ ॥੨॥"
page = 712

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O fool! where is the spiritual power in them, so that they may bless you with some boon.2."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ! ਉਸ ਵਿਚ ਕੀ ਸਿੱਧੀ ਹੈ ਜੋ ਤੈਨੂੰ ਕੁਝ ਵਰ ਦੇਵੇਗਾ ॥੨॥"