[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਨਕ ਡਾਰਿ ਗੋਦ ਰਵਿ ਦਯੋ ॥"
page = 839

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They were blessed with a daughter, who was endowed in their lap by the God Sun, himself."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਸੂਰਜ ਨੇ ਹੀ (ਉਨ੍ਹਾਂ ਦੀ) ਗੋਦ ਵਿਚ ਪਾਈ ਹੋਵੇ।"