[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਮਦੂਤ; ਮਹਾ ਭਇਆਨ ॥"
page = 838
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Very dreadful are the Death's myrmidons."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਭਿਆਨਕ ਹਨ ਮੌਤ ਦੇ ਫਰੇਸ਼ਤੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Messenger of Death is dreadful and horrible."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਮ ਦੂਤ ਮਹਾਂ ਭਿਆਨਕ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੈਨੂੰ) ਜਮਦੂਤ ਬੜੇ ਡਰਾਉਣੇ (ਲੱਗ ਰਹੇ ਹਨ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਇਆਨ = ਭਿਆਨਕ, ਡਰਾਵਣੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los mensajeros de la muerte son terroríficos;"