data = "ਵਡੇ ਵਡੇ; ਜੋ ਦੁਨੀਆਦਾਰ ॥"
page = 238
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The big and great worldly people,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਚੇ ਤੇ ਵਡੇ ਸੰਸਾਰੀ ਬੰਦੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The great and powerful people of the world"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਵੱਡੇ ਵੱਡੇ ਦੁਨੀਆਦਾਰ ਅਰਥਾਤ ਮਾਇਆ ਪਤੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜਗਤ ਵਿਚ) ਜੇਹੜੇ ਜੇਹੜੇ ਵੱਡੇ ਵੱਡੇ ਜਾਇਦਾਦਾਂ ਵਾਲੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਨੀਆਦਾਰ = ਧਨਾਢ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los hombres grandes e importantes no significan nada,"