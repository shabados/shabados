[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਮਲ ਰਸਨਾ; ਅੰਮ੍ਰਿਤੁ ਪੀਉ ॥"
page = 281
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By drinking the Name Nectar thy tongue will become pure,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦਾ ਆਬਿ-ਹਿਯਾਤ ਪਾਨ ਕਰਨ ਨਾਲ ਤੇਰੀ ਜੀਭ ਪਵਿੱਤ੍ਰ ਹੋ ਜਾਏਗੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Let your tongue become pure, drinking in the Ambrosial Nectar."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਸਨਾ ਸੇ ਨਿਰਮਲ ਨਾਮ ਅੰਮ੍ਰਿਤ ਕੋ ਪਾਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਭ ਨਾਲ ਮਿੱਠਾ (ਨਾਮ-) ਅੰਮ੍ਰਿਤ ਪੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸਨਾ = ਜੀਭ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Deja que tus labios saboreen únicamente el Néctar del Nombre"