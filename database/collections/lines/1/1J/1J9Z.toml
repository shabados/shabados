[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੋ ਤੁਮ ਅਬ ਜੀਵਤ ਰਹੋ; ਬਚੈ ਤਿਹਾਰੇ ਅੰਗ ॥੧੧॥"
page = 844

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Only then you can save your life.’(11)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੂੰ ਹੁਣ ਜੀਉਂਦਾ ਰਹਿ ਸਕਦਾ ਹੈਂ ਅਤੇ ਤੇਰਾ ਸ਼ਰੀਰ ਬਚ ਸਕਦਾ ਹੈ ॥੧੧॥"