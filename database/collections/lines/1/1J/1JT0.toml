data = "ਅਛੈ ਸਰੂਪ, ਅਦ੍ਵੈ ਅਨਾਸ ॥"
page = 29

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art Unassailable Entity Non-dual and Indestructible!"

[[content]]
assets = ["RSJD"]
type = "translation"
