[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਗੁਣ ਗਾਇ; ਮੇਰਾ ਮਨੁ ਸੀਤਲਾਇਆ ॥"
page = 103
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By singing the God's praises my soul is cooled down."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੀ ਸਿਫ਼ਤ ਸ਼ਲਾਘਾ ਗਾਇਨ ਕਰਨ ਦੁਆਰਾ ਮੇਰੀ ਆਤਮਾ ਠੰਢੀ ਠਾਜ ਹੋ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Singing the Glorious Praises of the Lord, my mind is cooled and soothed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਤੇਰੇ ਗੁਣ ਗਾਇਨ ਕਰ ਕੇ ਮੇਰਾ ਮਨੁ ਸੀਤਲਤਾ ਕੋ ਪ੍ਰਾਪਤਿ ਭਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾ ਕੇ ਮੇਰਾ ਮਨ ਠੰਢਾ-ਠਾਰ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੀਤਲਾਇਆ = ਠੰਢਾ ਹੋ ਗਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "cantando Tus Gloriosas Alabanzas, mi mente se ha calmado y yo relajado."