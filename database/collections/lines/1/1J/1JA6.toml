[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁ ਐਸਾ ਰਾਜਾ; ਸ੍ਰੀ ਨਰਹਰੀ ॥੧॥"
page = 1292
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such is that venerable Man lion Emperor."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਹੋ ਜੇਹਾ ਹੈ ਉਹ ਪੂਜਯ ਮਨੂਸ਼-ਸ਼ੇਰ ਸਰੂਪ ਪਾਤਿਸ਼ਾਹ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such is my Sovereign Lord King, the Supreme Lord of all. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਐਸਾ ਸ੍ਰੀ ਨਰ ਸਿੰਘ ਰੂਪ ਰਾਜਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਤਨਾ ਵੱਡਾ ਉਹ ਪਰਮਾਤਮਾ ਰਾਜਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁ = ਉਹ ਕਾਲ। ਕਰਾ = ਕਰ, ਹਾਲਾ। ਸਿਰਿ = ਸਭ ਤੋਂ ਸਿਰਾਂ ਉੱਤੇ। ਨਰਹਰੀ = ਪਰਮਾਤਮਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal es mi Rey y Señor Soberano, el Señor Supremo. (1)"