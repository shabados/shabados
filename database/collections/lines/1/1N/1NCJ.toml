[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਤੇ ਉਪਜਿਆ; ਤਿਸੁ ਮਾਹਿ ਸਮਾਨਾ ॥"
page = 285
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and is absorbed in Him from whom he sprang."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜਿਸ ਤੋਂ ਉਹ ਉਤਪੰਨ ਹੋਇਆ ਸੀ, ਉਸੇ ਵਿੱਚ ਹੀ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is absorbed into the One, from whom he originated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਵਾਹਿਗੁਰੂ ਸੇ ਵਹੁ ਉਪਜਾ ਥਾ ਤਿਸੀ ਮੇਂ ਸਮਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਉਹ ਸਦਾ ਉਸ ਪ੍ਰਭੂ ਵਿਚ ਲੀਨ ਰਹਿੰਦਾ ਹੈ ਜਿਸ ਤੋਂ ਉਹ ਪੈਦਾ ਹੋਇਆ ਹੈ;"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Del miedo es conducido al valor"