data = "ਅਛੇਦੰ ਅਭੇਦੰ ਅਕਰਮੰ ਸੁ ਧਰਮੰ ॥"
page = 119

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art indestructible, indistinguishable, deedless and Dhrma-incarnate."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੂੰ) ਅਛੇਦ (ਨ ਛੇਦੇ ਜਾ ਸਕਣ ਵਾਲੀ) ਅਭੇਦ, ਅਕਰਮ ਅਤੇ ਸੁਧਰਮ ਹੈਂ,"