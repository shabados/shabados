type = "primary"
data = "ਜਹਾ ਤਹਾ ਆਰਿਸਟ ਬਤਾਵਤ ॥੮੪॥"
page = 559

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Forgetting the activities of dharma, they will propagate about sin here and there.84."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜਿਥੇ ਕਿਥੇ ਘੋਰ ਪਾਪਾਂ ਦਾ ਬਖਾਨ ਕਰਨਗੇ ॥੮੪॥"