[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਨਾਮੁ; ਮਨਹਿ ਆਧਾਰੁ ॥੧॥"
page = 394
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's name is the mainstay of the mind"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ ਮਨ ਦਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Name of the Lord is the Support of the mind. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਮਨ ਮੇਂ ਹਰਿ ਨਾਮ ਕਾ ਅਧਾਰ ਕੀਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਉਸ ਦੇ ਮਨ ਦਾ ਆਸਰਾ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਹਿ = ਮਨ ਦਾ। ਆਧਾਰੁ = ਆਸਰਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "para ellos el asta principal ocupada en la mente es el Naam, el Nombre del Señor. (1)"