[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਾਹੁ ਮੇਰੇ ਸਾਹਿਬਾ ਵਾਹੁ ॥"
page = 755
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hail unto Thee, my Lord, hail."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ਾਬਾਸ਼! ਹੈ ਤੈਨੂੰ ਮੇਰੇ ਸੁਆਮੀ ਸ਼ਾਬਾਸ਼!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Waaho! Waaho! Hail, hail to my Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਾਹੁ ਮੇਰੇ ਸਾਹਿਬਾ ਤੂੰ ਅਸਚਰਜ ਰੂਪ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਾਲਕ! ਤੂੰ ਧੰਨ ਹੈਂ! ਤੂੰ ਹੀ ਸਲਾਹੁਣ-ਜੋਗ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਾਹੁ = ਧੰਨ, ਸਲਾਹੁਣ-ਯੋਗ। ਸਾਹਿਬਾ = ਹੇ ਮਾਲਕ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¡Gloria a mi Señor Eterno!"