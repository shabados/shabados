[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨਾ ਦੇਖਿ; ਮੇਰਾ ਮਨੁ ਧੀਰਾ ॥੩॥"
page = 212
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By seeing him my mind has grown fortitude."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਨੂੰ ਵੇਖ ਕੇ ਮੇਰਾ ਚਿੱਤ ਧੀਰਜਵਾਨ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "beholding Him, my mind is comforted and consoled. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਤਿਨੋਂ ਕਾ ਹੀ ਦਰਸ਼ਨ ਕਰ ਕੇ ਮੇਰਾ ਮਨ ਧੀਰਜ ਕੋ ਪ੍ਰਾਪਤ ਹੂਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਦਾ ਦਰਸਨ ਕਰ ਕੇ ਮੇਰੇ ਮਨ ਨੂੰ ਭੀ ਹੌਸਲਾ ਬਣ ਰਿਹਾ ਹੈ (ਕਿ ਮੈਂ ਉਸ ਮਾਲਕ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰ ਸਕਾਂਗਾ) ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਖਿ = ਵੇਖ ਕੇ। ਧੀਰਾ = ਧੀਰਜ ਵਾਲਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Guru, Viéndolo, mi mente está confortada.  (3)"