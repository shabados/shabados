[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੂੰਮਿ ਨੇਤ੍ਰ ਤਾ ਤੇ ਲਯੋ; ਅਤਿ ਹਿਤ ਚਿਤ ਕੇ ਸੰਗ ॥੯॥"
page = 815

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘And for that I kissed your ears and eyes in passion.’(9)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਲਈ ਚਿਤ ਵਿਚ ਅਤਿ ਅਧਿਕ ਹਿਤ ਕਰ ਕੇ (ਮੈਂ ਤੁਹਾਡਾ) ਨੇਤਰ ਚੁੰਮ ਲਿਆ ਹੈ ॥੯॥"