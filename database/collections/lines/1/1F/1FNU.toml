[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਿ ਰੋਸੁ ਕੀਜੈ; ਜੇ ਦੂਜਾ ਹੋਇ ॥"
page = 842
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man may feel displeasure if there be another."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਦਮੀ ਅਪਰਸੰਨਤਾ ਤਾਂ ਮਹਿਸੂਸ ਕਰੇ ਜੇਕਰ ਕੋਈ ਹੋਰ ਹੋਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mortal might complain, if there were any other."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਭਾਈ! ਕਿਸੀ ਪਰ ਮਨ ਮੇਂ ਰੋਸ ਤਬ ਕਰੀਏ ਜੇਕਰ ਤਿਸ ਬਿਨਾਂ ਦੂਸਰਾ ਕੋਈ ਹੋਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਸੇ ਨੂੰ ਗੁਰਮੁਖ ਅਤੇ ਕਿਸੇ ਨੂੰ ਮਨਮੁਖ ਵੇਖ ਕੇ) ਮਨ ਵਿਚ ਗਿਲਾ ਤਾਂ ਹੀ ਕੀਤਾ ਜਾਏ ਜੇ (ਪਰਮਾਤਮਾ ਤੋਂ ਬਿਨਾ ਕਿਤੇ) ਕੋਈ ਹੋਰ ਹੋਵੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਰੋਸੁ = ਗਿਲਾ। ਕੀਜੈ = ਕੀਤਾ ਜਾਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "uno Lo notaría sólo si hubiera algún otro hacedor."