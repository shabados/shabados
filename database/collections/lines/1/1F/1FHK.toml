[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨਾਸਰੀ ਮਹਲਾ ੧ ਛੰਤ ॥"
page = 687
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Dhanasri 1st Guru, Chhant."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨਾਸਰੀ ਪਹਿਲੀ ਪਾਤਿਸ਼ਾਹੀ ਛੰਤ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Dhanaasaree, First Mehl, Chhant:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਧਨਾਸਰੀ ਵਿੱਚ ਗੁਰੂ ਨਾਨਕਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਛੰਤ' (ਛੰਦ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dhanasri, Mejl Guru Nanak, Primer Canal Divino, Chhant."