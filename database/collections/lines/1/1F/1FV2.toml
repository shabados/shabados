data = "ਜੈਸੀ; ਪਰ ਪੁਰਖਾ ਰਤ ਨਾਰੀ ॥"
page = 1164
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As a woman is involved in love with another person,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਇਸਤ੍ਰੀ ਪਰਾਏ ਪੁਰਸ਼ ਦੇ ਪਿਆਰ ਵਿੱਚ ਰੰਗੀ ਹੋਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Like the woman who falls in love with another man,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਬਿਭਚਾਰਨੀ ਇਸਤ੍ਰੀ ਕੀ ਪਰਾਏ ਪੁਰਸ ਮੇਂ ਪ੍ਰੀਤੀ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਕੋਈ ਨਾਰ ਪਰਾਏ ਮਨੁੱਖ ਨਾਲ ਪਿਆਰ ਪਾ ਲੈਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਤ = ਰੱਤੀ ਹੋਈ, ਪਿਆਰ ਪਾਣ ਵਾਲੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
