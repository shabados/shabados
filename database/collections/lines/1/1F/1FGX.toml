[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਾਤਮਾ; ਪਾਰਬ੍ਰਹਮ ਕਾ ਰੂਪੁ ॥ ਰਹਾਉ ॥"
page = 868
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "of beauty of the Supreme Soul and Glorious God. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਆਤਮਾ ਤੇ ਵਿਸ਼ਾਲ ਵਾਹਿਗੁਰੂ ਦੀ ਸੁੰਦਰਤਾ ਦਾ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Lord God. ||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੀਵਾਤਮਾ ਜੋ (ਪ੍ਰ) ਵਸੇਸ ਕਰ ਪਾਰਬ੍ਰਹਮ ਕਾ ਰੂਪ ਹੈ॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵਾਤਮਾ ਉਸ ਪਰਮਾਤਮਾ ਦਾ ਹੀ ਰੂਪ ਹੈ ਰਹਾਉ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਾਤਮਾ = ਜੀਵਾਤਮਾ ॥ਰਹਾਉ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nuestra Alma es imagen Perfecta del Dios Trascendente.(Pausa)"