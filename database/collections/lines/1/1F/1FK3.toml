[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮ ਵਿਹੂਣੇ. ਊਣੇ ਝੂਣੇ; ਨਾ ਗੁਰਿ ਸਬਦੁ ਸੁਣਾਇਆ ॥"
page = 767
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Lord's Name, the mortal is vacant and sad and hears not the Word of the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਨਾਮ ਦੇ ਬਗੈਰ ਪ੍ਰਾਣੀ ਸੱਖਣਾ ਅਤੇ ਨਿਮੌਝੂੜਾ ਹੈ ਤੇ ਗੁਰਬਾਣੀ ਨੂੰ ਨਹੀਂ ਸੁਣਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Naam, he is vacant and sad; he does not listen to the Word of the Guru's Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਮ ਸੇ ਬਿਨਾਂ ਹੈ ਸੇ ਖਾਲੀ ਹੈਂ, (ਝੂਣੇ) ਨਿੰਮੋਝੂਣੇ, ਭਾਵ ਉਦਾਸ ਰਹਤੇ ਹੈਂ ਤਿਨੋਂ ਕੋ ਗੁਰੋਂ ਨੇ ਸ਼ਬਦ ਨਹੀਂ ਸੁਣਾਇਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ (ਭਾਗ-ਹੀਣ ਬੰਦਿਆਂ) ਨੂੰ ਗੁਰੂ ਨੇ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦਾ ਸ਼ਬਦ ਨਹੀਂ ਸੁਣਾਇਆ, ਜੋ ਨਾਮ ਤੋਂ ਸੱਖਣੇ ਰਹੇ ਹਨ ਉਹ ਦੁੱਖੀ ਜੀਵਨ ਹੀ ਬਿਤਾਂਦੇ ਗਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਊਣੇ = ਖ਼ਾਲੀ। ਝੂਣੇ = ਉਦਾਸ। ਊਣੇ ਝੂਣੇ = ਨਿਮੋ-ਝੂਣੇ। ਗੁਰਿ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y privado del Nombre del Señor estoy vacío y triste, pues no me he puesto a escuchar la Palabra del Guru."