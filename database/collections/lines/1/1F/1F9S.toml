[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਸੰਖ ਸੂਰ; ਮੁਹ ਭਖ ਸਾਰ ॥"
page = 4
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Countless are the warriors who eat steel with their mouth (bear the brunt on their face)."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਣਗਿਣਤ ਹਨ ਯੋਧੇ ਜਿਹੜੇ ਮੂੰਹ ਉਤੇ ਲੋਹੇ ਦੀਆਂ ਸੱਟਾਂ ਸਹਾਰਦੇ (ਜਾਂ ਲੋਹਾ ਖਾਂਦੇ) ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Countless heroic spiritual warriors, who bear the brunt of the attack in battle (who with their mouths eat steel)."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਗਿਣਤ ਹੀ ਸੂਰਮੇ ਹੈਂ, ਜੋ ਜੁਧ ਕੇ ਸਨਮੁਖ ਹੋ ਕਰ ਸਤ੍ਰੂਓਂ ਕੇ ਸਸਤ੍ਰੋਂ ਰੂਪੁ☬(ਸਾਰ) ਲੋਹਾ ਅਪਨੇ ਮੁਖ ਪਰ ਸਹਾਰਤੇ ਹੈਂ, ਔਰ ਪੀਠ ਨਹੀਂ ਦੇਤੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅਕਾਲ ਪੁਰਖ ਦੀ ਰਚਨਾ ਵਿਚ) ਬੇਅੰਤ ਸੂਰਮੇ ਹਨ ਜੋ ਆਪਣੇ ਮੂੰਹਾਂ ਉੱਤੇ (ਭਾਵ ਸਨਮੁਖ ਹੋ ਕੇ) ਸ਼ਾਸਤ੍ਰਾਂ ਦੇ ਵਾਰ ਸਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੂਰ = ਸੂਰਮੇ, ਜੋਧੇ। ਮੁਹ = ਮੂੰਹਾਂ ਉੱਤੇ। ਭਖਸਾਰ = ਸਾਰ ਭਖਣ ਵਾਲੇ, ਲੋਹਾ ਖਾਣ ਵਾਲੇ, ਸ਼ਾਸਤ੍ਰਾਂ ਦੇ ਵਾਰ ਸਹਿਣ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Incontables son los hombres piadosos y serenos;"