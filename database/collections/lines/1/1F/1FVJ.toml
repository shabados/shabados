[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਹੁ ਗੁਣ ਮਹਿ; ਕੀਨੋ ਬਿਸਥਾਰੁ ॥"
page = 291
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He made the world in (subject to) three dispositions."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਜਹਾਨ ਨੂੰ ਤਿੰਨਾਂ ਸੁਭਾਵਾਂ ਵਿੱਚ (ਅਧੀਨ) ਕਰ ਦਿੱਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "he made the world subject to the three dispositions."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕਾਲ ਮੇਂ ਤੀਨੋਂ ਗੁਣੋਂ ਮੇਂ ਬਿਸਥਾਰ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਮਾਇਆ ਦੇ ਤਿੰਨ ਗੁਣਾਂ ਦਾ ਖਿਲਾਰਾ ਖਲੇਰ ਦਿੱਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਸਥਾਰੁ = ਪਸਾਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aparecieron los conceptos de virtud y vicio."