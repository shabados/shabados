type = "primary"
data = "ਬਕੁਸ਼ਤਾ ਕਸੇ ਰਾ ਕਿ ਦਾਦਸ਼ ਖ਼ਬਰ ॥੧੯॥"
page = 1428

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He went back and killed the person who had brought the news(19)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਬੰਦੇ ਨੂੰ ਮਾਰ ਦਿੱਤਾ, ਜਿਸ ਨੇ ਇਹ ਖ਼ਬਰ ਦਿੱਤੀ ਸੀ ॥੧੯॥"