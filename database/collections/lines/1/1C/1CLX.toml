[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਮਰੀ ਕ੍ਰਿਪਾ ਤੇ; ਤੁਮ ਸਰਣਾਇਆ ॥"
page = 1078
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Thine grace, I have entered into Thy sanctuary."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਦਈਆ ਦੁਆਰਾ, ਮੈਂ ਤੇਰੀ ਪਨਾਹ ਲਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Your Grace, I have entered Your Sanctuary."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਤੁਮਾਰੀ ਕ੍ਰਿਪਾ ਸੇ ਤੁਮਾਰੀ ਸਰਣ ਆਇਆ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਹੀ ਕਿਰਪਾ ਨਾਲ (ਹੁਣ) ਤੇਰੀ ਸਰਨ ਆਇਆ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ, ਨਾਲ। ਤੁਮ ਸਰਣਾਇਆ = ਤੇਰੀ ਸਰਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "he venido a buscar la Bendición de poderte servir."