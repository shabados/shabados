[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂੰਜੀ ਸਾਚਉ ਨਾਮੁ ਤੂ; ਅਖੁਟਉ ਦਰਬੁ ਅਪਾਰੁ ॥"
page = 1090
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My capital is Thy True Name, O God. Inexhaustible and Infinite is the wealth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਰਾਸ ਤੇਰਾ ਸੱਚਾ ਨਾਮ ਹੈ, ਹੇ ਵਾਹਿਗੁਰੂ! ਅਮੁੱਕ ਅਤੇ ਅਨੰਤ ਹੈ ਇਹ ਮਾਲ-ਧਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My capital is Your True Name, O Lord; this wealth is inexhaustible and infinite."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਾਰ ਸਰਧਾ ਰੂਪ ਪੂੰਜੀ ਕਰ ਕੇ ਨਾਮ ਜੋ ਸਾਚੋ ਅਖੁਟ ਦਰਬ ਹੈ, ਤਿਸ ਕੋ ਤੂੰ ਸੰਚਨ ਕਰ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਮਨੁੱਖ ਦੇ ਪਾਸ) ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਪੂੰਜੀ ਹੈ, ਜਿਸ ਪਾਸ (ਹੇ ਪ੍ਰਭੂ!) ਤੂੰ ਨਾਹ ਮੁੱਕਣ ਵਾਲਾ ਤੇ ਬੇਅੰਤ ਧਨ ਹੈਂ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Inagotable e Infinito es el Tesoro de Tu Verdadero Nombre, oh Dios."