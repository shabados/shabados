[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਨੋ ਤੇਰਾ ਅੰਗੁ; ਸੁ ਨਿਰਮਲੀ ਹੂੰ ਨਿਰਮਲਾ ॥"
page = 961
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, on whose side Thou art, is the purest of the pure."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਪੱਖ ਉੱਤੇ ਤੂੰ ਹੈ, ਉਹ ਪਵਿੱਤਰਾਂ ਦਾ ਪਰਮ ਪਵਿੱਤਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who has You on his side, is the purest of the Pure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਤੇਰਾ ਪਖੁ ਹੈ, ਸੋ ਨਿਰਮਲ ਸੇ ਨਿਰਮਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਤੇਰਾ ਆਸਰਾ ਪ੍ਰਾਪਤ ਹੈ ਉਹ ਬੜੇ ਹੀ ਪਵਿਤ੍ਰ ਜੀਵਨ ਵਾਲਾ ਬਣ ਗਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél con quien estás Tú, es lo más puro de lo puro."