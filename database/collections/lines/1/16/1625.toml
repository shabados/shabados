[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਸਨਾ ਗੁਨ ਗਾਵੈ; ਬੇਅੰਤ ॥"
page = 298
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With thy tongue sing the excellences of the Infinite Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਜੀਭ ਨਾਲ ਅਨੰਤ ਸੁਆਮੀ ਦੀਆਂ ਵਡਿਆਈਆਂ ਗਾਇਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With your tongue, sing the Glorious Praises of the Infinite Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਹਬਾ ਕਰ ਕੇ ਬੇਅੰਤ ਕੇ ਗੁਣ ਗਾਵੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਭ ਬੇਅੰਤ ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਗਾਣ ਲੱਗ ਪੈਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸਨਾ = ਜੀਭ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si pronuncia las Alabanzas Infinitas del Señor,"