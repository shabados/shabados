[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਭਾਣਾ; ਸੂਕੇ ਕਾਸਟ ਹਰਿਆ ॥"
page = 1141
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When it pleases Him, the Lord, even thy wood becomes green."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਸ ਸਾਹਿਬ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ ਤਾਂ ਸੁੱਕੀ ਲਕੜੀ ਭੀ ਹਰੀ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When it pleases Him, even dry wood becomes green."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਤੇਰੇ ਕੋ ਭਾਵ੍ਯਾ ਤਾਂ ਕਾਠ ਵਤ ਸੂਕੇ ਹੂਏ ਰਿਦ੍ਯੋਂ ਕੋ ਪ੍ਰੇਮ ਸਹਿਤ ਕਰਕੇ; ਵਾ ਸੁਭ ਗੁਣ ਦੇ ਕਰ ਹਰੇ ਕਰ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਉਸ ਪ੍ਰਭੂ ਨੂੰ ਚੰਗਾ ਲੱਗੇ ਤਾਂ ਸੁੱਕੇ ਕਾਠ ਹਰੇ ਹੋ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸੁ ਭਾਣਾ = ਉਸ (ਪ੍ਰਭੂ) ਨੂੰ ਚੰਗਾ ਲੱਗੇ। ਕਾਸਟ = ਕਾਠ, ਲੱਕੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si así es Tu Voluntad, la madera seca florece."