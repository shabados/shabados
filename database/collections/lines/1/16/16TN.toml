[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਜਨ; ਐਸੋ ਸੰਤੁ ਸਹਾਈ ॥"
page = 499
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Friend, such a helper is the Saint Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮ੍ਰਿੱਤ! ਐਹੋ ਜੇਹੇ ਸਹਾਇਕ ਸਾਧੂ ਗੁਰਦੇਵ ਜੀ ਹਨ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O friend, the Saintly Guru is such a helper."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਜਨੋਂ! ਕੋਈ ਸੰਤ ਐਸੋ ਸਹਾਇਕ ਹੋਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਿੱਤਰ! ਗੁਰੂ ਇਹੋ ਜਿਹਾ ਮਦਦਗਾਰ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਜਨ = ਹੇ ਮਿੱਤਰ! ਸੰਤੁ = ਗੁਰੂ। ਸਹਾਈ = ਮਦਦਗਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh amigo, tal es la amistad de un Santo, que las ataduras de Maya"