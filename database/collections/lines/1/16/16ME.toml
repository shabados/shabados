[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੁ ਮਨੁ ਮੁਗਧੁ; ਕਹਹੁ ਕਿਉ ਰਹਸੀ ॥"
page = 415
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Say, how can this stupid soul be rescued?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੱਸੋ ਇਹ ਮੂਰਖ ਆਤਮਾ ਕਿਸ ਤਰ੍ਹਾਂ ਬਚਾਈ ਜਾ ਸਕਦੀ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Tell me, how can this stupid mind be rescued?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ ਕਹੋ ਤੋ! ਇਹ ਮਨ ਮੂਰਖ ਦੁਖੋਂ ਸੇ ਕੈਸੇ ਬਚੇਗਾ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਹੈਰਾਨ ਹੋਇਆ) ਇਹ ਮਨ ਆਪਣੀ ਸੂਝ ਗਵਾ ਲੈਂਦਾ ਹੈ, ਫਿਰ ਦੱਸੋ, ਇਹ ਭਟਕਣੋਂ ਕਿਵੇਂ ਰਹਿ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਗਧੁ = ਮੂਰਖ। ਕਹਹੁ = ਦੱਸੋ। ਰਹਸੀ = (ਅਡੋਲ) ਰਹੇਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La mente es ignorante; ¿cómo puede ser salvada?"