[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਰਿ ਬੈਠੇ; ਗੁਰੂ ਧਿਆਇਹੁ ॥"
page = 621
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and sitting in thy very home, meditate Thou on the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੇ ਧਾਮ ਅੰਦਰ ਬੈਠਾ ਹੋਇਆ ਹੀ ਗੁਰਾਂ ਦੀ ਆਰਾਧਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "sitting within your own home, meditate on the Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਘਰ ਮੇਂ ਬੈਠੇ ਹੀ ਗੁਰੂ ਕਾ ਧਿਆਨ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅੰਤਰ-ਆਤਮੇ ਟਿਕ ਕੇ ਗੁਰੂ ਦਾ ਧਿਆਨ ਧਰਿਆ ਕਰੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਰਿ = ਘਰ ਵਿਚ ਹਿਰਦੇ ਵਿਚ, ਅੰਤਰ-ਆਤਮੇ। ਬੈਠੇ = ਟਿਕ ਕੇ। ਗੁਰਿ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, contemplen al Guru en su mismo hogar. El Guru"