[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਸਮੈ ਸ੍ਰੀ ਆਤਮਾ; ਉਚਰਿਓ ਮਤਿ ਸਿਉ ਬੈਨ ॥"
page = 34

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Once the Soul spoke these words to Intellect:"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਵਾਰ ਸ੍ਰੀ ਆਤਮਾ ਨੇ ਬੁੱਧੀ ਪ੍ਰਤਿ (ਇਸ ਤਰ੍ਹਾਂ) ਬਚਨ ਕੀਤਾ"