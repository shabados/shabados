[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿ ਨਾਮੁ ਤੇਰਾ; ਪਰਾ ਪੂਰਬਲਾ ॥"
page = 1083
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Name is Thy primal and ancient Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "'ਸਤਿ ਨਾਮ' ਤੈਡਾਂ ਆਦੀ ਤੇ ਪੁਰਾਤਨ ਨਾਮ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "'Sat Naam' is Your perfect, primal Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਸਤਿਨਾਮ ਜੋ ਹੈ, ਸੋ (ਪਰਾ) ਪਰਾ ਨਾਮ ਜੋ ਪਰਾ ਬਾਣੀ ਤਿਸ ਤੇ ਭੀ ਪੂਰਬਲਾ ਅਰਥਾਤ ਪਹਿਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ 'ਸਤਿਨਾਮੁ' ਤੇਰਾ ਮੁੱਢ-ਕਦੀਮਾਂ ਦਾ ਨਾਮ ਹੈ (ਭਾਵ, ਤੂੰ 'ਹੋਂਦ ਵਾਲਾ' ਹੈਂ, ਤੇਰੀ ਇਹ 'ਹੋਂਦ' ਜਗਤ-ਰਚਨਾ ਤੋਂ ਪਹਿਲਾਂ ਭੀ ਮੌਜੂਦ ਸੀ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਾ ਪੂਰਬਲਾ = ਮੁੱਢ-ਕਦੀਮਾਂ ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, pero más espontáneo es Tu Nombre más antiguo."