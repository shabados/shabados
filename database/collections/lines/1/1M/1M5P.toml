[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋਗੀ ਜਤੀ ਸਿਧ; ਹਰਿ ਆਹੈ ॥"
page = 203
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The yogis, celibates, and men of miracles long for God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਯੋਗੀ ਬ੍ਰਹਮਚਾਰੀ ਅਤੇ ਕਰਾਮਾਤੀ ਬੰਦੇ ਵਾਹਿਗੁਰੂ ਲਈ ਤਰਸਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the Yogis, celibates and Siddhas yearn for the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜੋਗੀ ਜਤੀ ਸਿਧ ਭੀ ਹਰੀ ਕੋ (ਆਹੈ) ਚਾਹਿਤੇ ਹੈਂ, ਵਾ (ਆਹੈ) ਉਚਾਰਤੇ ਹੈਂ॥ (ਸੰਸਕ੍ਰਿਤ ਪਦੁ ਹੈ।)"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋਗੀ ਜਤੀ ਸਿੱਧ-ਹਰੇਕ ਪਰਮਾਤਮਾ ਨੂੰ ਮਿਲਣ ਦੀ ਤਾਂਘ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਹੈ = ਤਾਂਘ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por Yoguis, ascetas y célibes,"