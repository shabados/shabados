data = "ਭਾਂਤਿ ਭਾਂਤਿ ਕੇ ਤੀਰਥਿ ਨਾਨਾ ॥"
page = 60

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "My father proceeded towards the east and visited several places of pilgrimage."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਭਿੰਨ ਭਿੰਨ ਤੀਰਥਾਂ ਉਤੇ ਇਸ਼ਨਾਨ ਕੀਤਾ।"