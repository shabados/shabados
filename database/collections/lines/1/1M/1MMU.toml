data = "ਨਿਰੰਕਾਰ ਨ੍ਰਿਬਿਕਾਰ ਨਿਰਲੰਭ ॥"
page = 1387

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Lord is Formless, Sinless and shelterless:"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪਰਮ ਸੱਤਾ! ਤੁਸੀਂ) ਨਿਰਾਕਾਰ, ਨਿਰਵਿਕਾਰ, ਨਿਰਾਧਾਰ ('ਨ੍ਰਿਲੰਭ')"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਨਿਰੰਕਾਰ ਨ੍ਰਿਬਿਕਾਰ; ਨ੍ਰਿਲੰਭ ॥"