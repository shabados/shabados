[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਖਿ ਲੇਹੁ; ਮੋਹਿ ਨਿਰਗੁਨੀਆਰੇ ॥੧॥ ਰਹਾਉ ॥"
page = 741
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord save thou me, the meritless one. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਹਿਬ! ਤੂੰ ਮੈਂ ਨੇਕੀ-ਵਿਹੂਣ ਦੀ ਰੱਖਿਆ ਕਰ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am worthless - please save me! ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੋਹਿ ਨਿਰਗੁਣ ਕੋ ਨਾਮ ਦੇ ਕੇ ਜਨਮ ਮਰਣ ਸੇ ਰਖ ਲੇਵੋ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਗੁਣ-ਹੀਨ ਨੂੰ (ਆਪਣਾ ਨਾਮ ਦੇ ਕੇ) ਵਿਕਾਰਾਂ ਤੋਂ ਬਚਾਈ ਰੱਖ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਿ = ਮੈਨੂੰ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sálvame ahora, oh mi Dios Compasivo. (1-Pausa)"