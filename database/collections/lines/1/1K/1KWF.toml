[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਥਟਿਯੋ ਧਰਮ ਰਾਜੰ ਜਿਤੇ ਦੇਵ ਸਰਬੰ ॥"
page = 166

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There was the victory of Dharma (righteousness) and the gods collectively were Victorious,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਧਰਮ ਦਾ ਰਾਜ ਕਾਇਮ ਕੀਤਾ ਅਤੇ ਸਾਰੇ ਦੇਵਤੇ ਜਿਤ ਲਏ।"