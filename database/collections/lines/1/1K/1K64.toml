[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਯਾ ਜਗ ਮਹਿ ਕੋਊ ਰਹਨੁ. ਨ ਪਾਵੈ; ਇਕਿ ਆਵਹਿ ਇਕਿ ਜਾਹੀ ॥੧॥ ਰਹਾਉ ॥"
page = 1231
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In this world, no one is allowed to stay. One comes and another goes. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਜਹਾਨ ਅੰਦਰ ਕਿਸੇ ਨੂੰ ਠਹਿਰਨਾ ਨਹੀਂ ਮਿਲਦਾ ਇਕ ਆਉਂਦਾ ਅਤੇ ਇਕ ਟੁਰ ਜਾਂਦਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one is allowed to remain in this world; one comes, and another departs. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਸੰਸਾਰ ਮੇਂ ਕੋਈ ਰਹਿਨਾਂ ਨਹੀਂ ਪਾਵਤਾ ਹੈ, ਇਕ ਆਵਤਾ ਹੈ ਇਕ ਚਲਾ ਜਾਤਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਵੇਖ) ਇਸ ਦੁਨੀਆ ਵਿਚ (ਸਦਾ ਲਈ) ਕੋਈ ਭੀ ਟਿਕਿਆ ਨਹੀਂ ਰਹਿ ਸਕਦਾ। ਅਨੇਕਾਂ ਜੰਮਦੇ ਰਹਿੰਦੇ ਹਨ, ਅਨੇਕਾਂ ਹੀ ਮਰਦੇ ਰਹਿੰਦੇ ਹਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਯਾ ਜਗ ਮਹਿ = ਇਸ ਜਗਤ ਵਿਚ। ਇਕਿ = {ਲਫ਼ਜ਼ 'ਇਕ' ਤੋਂ ਬਹੁ-ਵਚਨ}। ਆਵਹਿ = ਆਉਂਦੇ ਹਨ, ਜੰਮਦੇ ਹਨ। ਜਾਹੀ = ਜਾਂਦੇ ਹਨ, ਮਰਦੇ ਹਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "cuando nada es permanente en este mundo y mientras uno llega, otro se va. (1-Pausa)"