[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਾਵਤ ਹੈ ਉਪਮਾ ਲਛਮੀ ਕੀ; ਨ ਤਾ ਸਮ ਯੌ ਕਹਿਬੋ ਬਨਿ ਆਯੋ ॥"
page = 504

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Even Lakshmi was not like her"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਲੱਛਮੀ ਜਿਤਨੀ ਸ਼ੋਭਾ ਪਾਉਂਦੀ ਹੈ, (ਸਗੋਂ) ਇਸ ਤਰ੍ਹਾਂ ਕਹਿਣਾ ਬਣਦਾ ਹੈ ਕਿ (ਲੱਛਮੀ ਵੀ) ਉਸ ਵਰਗੀ ਨਹੀਂ ਹੈ।"