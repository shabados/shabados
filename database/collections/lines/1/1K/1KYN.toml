language = "pa"
data = "ਮੇਰੇ ਦਿਲ ਦੇ ਜ਼ਖਮ ਲਈ ਤੇਰੀ ਇੱਕੋ ਮੁਸਕਾਨ ਮਰਹਮ ਦਾ ਕੰਮ ਕਰਦੀ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਬਰਾਇ ਰੇਸ਼ਿ ਦਿਲਮ ਖ਼ੰਦਾਇ ਤੂ ਮਰਹਮ ਬਸ ॥"

