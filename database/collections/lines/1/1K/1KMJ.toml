[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਖਨੁ ਖਾਇ ਨ ਨੀਰੁ ਵਿਲੋਵੈ ॥੧੭॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "If one is to eat butter, one should not go churning water, i.e. mere talks cannot produce the right results."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਯਾ) ਪਾਣੀ ਦੇ ਰਿੜਕਣ ਨਾਲ (ਕਦੇ) ਮੱਖਣ ਨਹੀਂ (ਕੋਈ) ਖਾ ਸਕਦਾ।"