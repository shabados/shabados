[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ ਪ੍ਰਭ ਅੰਤਰਜਾਮੀ ॥"
page = 107
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Supreme Lord Master is the searcher of hearts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼੍ਰੋਮਣੀ ਸਾਹਿਬ ਮਾਲਕ ਦਿਲਾਂ ਦੀਆਂ ਜਾਨਣਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Lord God is the Inner-knower, the Searcher of hearts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਾਰਬ੍ਰਹਮ ਪ੍ਰਭੂ! ਤੂੰ  ਅੰਤਰਿਜਾਮੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਹੇ ਪਾਰਬ੍ਰਹਮ! ਹੇ ਅੰਤਰਜਾਮੀ ਪ੍ਰਭੂ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭੁ = ਹੇ ਪ੍ਰਭੂ! ਅੰਤਰਜਾਮੀ = ਹੇ ਸਭ ਦੇ ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, alabando al Señor Trascendente, Conocedor, el Ser Íntimo de mi corazón, la vivacidad llega a mi labios."