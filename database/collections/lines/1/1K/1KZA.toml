[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਾਮ ਕਰਨ ਹਿਤ ਦੂਤ ਪਠਾਏ ॥"
page = 66

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Being without food and drink, the warriors were filled with ire, the Raja sent the messengers for the Purpose of making peace."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਨ੍ਹਾਂ ਨੇ) ਸੰਧੀ ਕਰਨ ਲਈ ਦੂਤ ਭੇਜੇ।"