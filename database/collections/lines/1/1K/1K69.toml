[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈ ਬਉਰੀ; ਮੇਰਾ ਰਾਮੁ ਭਤਾਰੁ ॥"
page = 1164
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am crazy and the Lord is my Spouse."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕਮਲੀ ਹਾਂ ਅਤੇ ਸਾਹਿਬ ਮੇਰਾ ਕੰਤ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am crazy - the Lord is my Husband."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਕਮਲੀ ਇਸਤ੍ਰੀ ਕਾ ਰਾਮੁ (ਭਤਾਰੁ) ਪਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੈਂ ਆਪਣੇ ਪ੍ਰਭੂ-ਪਤੀ ਦੀ ਨਾਰ ਬਣ ਚੁੱਕੀ ਹਾਂ) ਪ੍ਰਭੂ ਮੇਰਾ ਖਸਮ ਹੈ ਤੇ ਮੈਂ (ਉਸ ਦੀ ਖ਼ਾਤਰ) ਕਮਲੀ ਹੋ ਰਹੀ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਉਰੀ = ਕਮਲੀ, ਝੱਲੀ। ਭਤਾਰੁ = ਖਸਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Estoy loco por mi Dios, mi Esposo y me arreglo"