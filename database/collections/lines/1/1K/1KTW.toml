[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਹਿ ਬਿਭੂਤਿ; ਲਗਾਵਹਿ ਭਸਮੈ ॥"
page = 1043
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some amass dust and with dust they besmear their bodies,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਸੁਆਹ ਇਕੱਤਰ ਕਰਦੇ ਹਨ ਅਤੇ ਸੁਆਹ ਨੂੰ ਆਪਣੇ ਸਰੀਰਾਂ ਨੂੰ ਮਲਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some collect dust, and smear their bodies with ashes;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਬਿਭੂਤਿ) ਮਾਇਆ ਇਕਤ੍ਰ ਕਰਤੇ ਹੈਂ ਬਾਹਰ ਲੋਕ ਦਿਖਾਵੇ ਲਈ ਸਰੀਰ ਪਰ ਸੁਆਹ ਲਗਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਕ ਉਹ ਭੀ ਹਨ ਜੋ ਤਿਆਗੀ ਬਣ ਕੇ ਜੰਗਲਾਂ ਵਿਚ ਜਾ ਬੈਠਦੇ ਹਨ, ਲੱਕੜਾਂ ਬਾਲ ਕੇ) ਸੁਆਹ ਤਿਆਰ ਕਰਦੇ ਹਨ ਤੇ ਉਹ ਸੁਆਹ (ਆਪਣੇ ਪਿੰਡੇ ਉਤੇ) ਮਲ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਭੂਤਿ = ਸੁਆਹ। ਭਸਮ = ਸੁਆਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno unge su cuerpo con cenizas, pero en nuestro interior están las maldades del enojo y del ego negativo."