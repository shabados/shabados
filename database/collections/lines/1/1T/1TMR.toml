[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੜਾ ਦੂਰਿ. ਨ ਭਾਲੀਐ; ਘਟਿ ਘਟਿ ਸਬਦੁ ਪਛਾਣੋਵਾ ॥"
page = 581
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Seek not the True One far. Recognise thou, the Lord in every heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿਪੁਰਖ ਦੀ ਦੁਰੇਡੇ ਖੋਜ-ਭਾਲ ਨਾਂ ਕਰ, ਤੂੰ ਸੁਆਮੀ ਨੂੰ ਹਰ ਦਿਲ ਅੰਦਰ ਸਿਞਾਣ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Do not search for the True Lord far away; recognize the Word of the Shabad in each and every heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਸਚੇ ਕੋ ਦੂਰ ਨ ਦੇਖੋ, ਘਟੋਂ ਘਟੋਂ ਮੇਂ ਤਿਸ ਬ੍ਰਹਮ ਕੋ ਨਿਸਚ੍ਯ ਕਰ ਕੇ ਪਹਿਚਾਨੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਨੂੰ (ਰਚੀ ਕੁਦਰਤਿ ਤੋਂ) ਦੂਰ (ਕਿਸੇ ਹੋਰ ਥਾਂ) ਲੱਭਣ ਦਾ ਜਤਨ ਨਹੀਂ ਕਰਨਾ ਚਾਹੀਦਾ। ਹਰੇਕ ਸਰੀਰ ਵਿਚ ਉਸੇ ਦਾ ਹੁਕਮ ਵਰਤਦਾ ਪਛਾਣ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੜਾ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ। ਘਟਿ ਘਟਿ = ਹਰੇਕ ਘਟ ਵਿਚ। ਸਬਦੁ ਪਛਾਣੋਵਾ = ਉਸ ਪਰਮਾਤਮਾ ਦਾ ਸ਼ਬਦ ਪਛਾਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No busques a tu Señor en la lejanía, reconoce la Palabra del Shabd en cada corazón."