data = "ਤੇਰਾ ਸਦਕਾ ਤੇਰੀ ਸਰਣਿ ॥"
page = 706

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I, a dumbed one, speak with your grace, I am a sacrifice to you and under your refuge."

