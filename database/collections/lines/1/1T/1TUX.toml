[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮੋ ਮੰਤ੍ਰ ਮੰਤ੍ਰੇ ਨਮੋ ਧਿਆਨ ਧਿਆਨੇ ॥੧੮੬॥"
page = 10
line = 6

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Salutation to Thee O Supreme Mantra! Salutation to Thee O highest meditation 186."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੰਤ੍ਰਾਂ ਦੇ ਵੀ ਮੰਤ੍ਰ! (ਤੈਨੂੰ) ਨਮਸਕਾਰ ਹੈ; ਹੇ ਧਿਆਨਾਂ ਦੇ ਵੀ ਧਿਆਨ! (ਤੈਨੂੰ) ਨਮਸਕਾਰ ਹੈ ॥੧੮੬॥"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਨਮੋ, ਮੰਤ੍ਰ ਮੰਤ੍ਰੇ; ਨਮੋ, ਧਿਆਨ ਧਿਆਨੇ ॥੧੮੬॥"