[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ ਪ੍ਰਭਿ ਆਪਣੀ; ਅਪਨੇ ਦਾਸ ਰਖਿ ਲੀਏ ॥"
page = 815
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Extending His mercy, the Lord has saved His slaves."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਰਹਿਮਤ ਧਾਰ ਕੇ ਸਾਹਿਬ ਨੇ ਆਪਣੇ ਗੋਲਿਆਂ ਦੀ ਰੱਖਿਆ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God has granted His Mercy, and saved His slaves."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੈਂਨੇ ਆਪਣੀ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਆਪਣੇ ਦਾਸ ਸਰਬ ਦੁਖੋਂ ਤੇ ਵਾ ਸਤ੍ਰੂਓਂ ਤੇ ਰਾਖ ਲੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਨੇ ਮੇਹਰ ਕਰ ਕੇ ਆਪਣੇ ਸੇਵਕਾਂ ਦੀ ਸਦਾ ਹੀ ਆਪ ਰੱਖਿਆ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ। ਰਖਿ ਲੀਏ = ਰੱਖਿਆ ਕੀਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor, en Su Misericordia, salva el honor de Sus Sirvientes,"