data = "ਬਰਖੰਤ ਬਾਣ ਬਿਖ ਧਰ ਸੁਰੰਗ ॥"
page = 249

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The frightful warriors entangled in war are showering arrows like poisonous serpents"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵਿਸ਼ ਬੁਝੇ ਬਾਣਾਂ ਦੀ ਬਰਖਾ ਕਰਦੇ ਹਨ।"