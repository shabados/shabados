[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਕਰਤਾ; ਕਰੈ ਸੁ ਹੋਈ ॥"
page = 841
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever the Creator Himself does, that alone happens."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਛ ਸਿਰਜਣਹਾਰ ਖੁਦ ਕਰਦਾ ਹੈ, ਕੇਵਲ ਉਹ ਹੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever the Creator Himself does, that alone happens."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਸਰਬ ਕਾ ਕਰਤਾ ਹੈ, ਪੁਨਾ ਜੋ ਕਰਤਾ ਹੈ, ਸੋਈ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ ਵਿਚ) ਉਹ ਕੁਝ ਹੁੰਦਾ ਹੈ ਜੋ ਕਰਤਾਰ ਆਪ ਹੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en Sí Mismo, y sólo ocurre  lo que Él, nuestro Señor, hace que ocurra."