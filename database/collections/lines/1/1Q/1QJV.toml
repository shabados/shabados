[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਜ਼ਦ ਤੇਗ਼ ਖ਼ੁਦ ਦਸਤ ਸਰ ਓ ਬੁਰੀਦ ॥੧੪॥"
page = 1406

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She took a sword in her hand and severed his head off.(14)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਆਪਣੇ ਹੱਥ ਵਿਚ ਤਲਵਾਰ ਲੈ ਕੇ ਅਜਿਹੀ ਮਾਰੀ ਕਿ ਉਸ ਦਾ ਸਿਰ ਕਟ ਦਿੱਤਾ ॥੧੪॥"