[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਆਪੇ ਹੀ ਵਿਸਮਾਦੁ ਹੋਇ; ਸਰਬੰਗਿ ਸਮਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Himself all bliss He premeates one and all."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਗੱਲ ਕੀ) ਆਪ ਹੀ ਆਪ ਅਚਰਜ ਰੂਪ ਬਣਕੇ ਸਰਬ (ਅੰਗਾਂ) ਸਰੀਰਾਂ ਵਿਖੇ ਸਮਾ ਰਿਹਾ ਹੈ।"