[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੀ ਟਹਲ; ਨ ਬਿਰਥੀ ਜਾਇ ॥"
page = 184
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whose service goes not in vain,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਸੇਵਾ ਵਿਅਰਥ ਨਹੀਂ ਜਾਂਦੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Working for Him is never in vain;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜਿਸ ਕੀ ਸੇਵਾ ਕਰੀ ਹੂਈ ਨਿਸਫਲ ਨਹੀਂ ਜਾਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਜਿਸ ਦੀ ਕੀਤੀ ਹੋਈ ਸੇਵਾ ਨਿਸਫਲ ਨਹੀਂ ਜਾਂਦੀ"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਰਥੀ = ਵਿਅਰਥ, ਨਿਸਫਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, Cuyo Servicio no se desperdicia;"