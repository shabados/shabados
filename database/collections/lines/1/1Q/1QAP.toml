data = "ਸਕਲ ਸਖਿਨ ਜੁਤ ਤੁਮ ਪੈ ਡਾਰਿਯੋ ॥"
page = 925

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘We, all the compatriots, have made the selection.’"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਸਖੀਆਂ ਨਾਲ ਮਿਲ ਕੇ ਤੁਹਾਡੇ ਉਪਰ ਪਾਇਆ ਹੈ।"