[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹਣੈ ਦੈਤ ਭਾਣੰ ॥"
page = 181

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Shiva, the holder of the trident, is in extreme anger and he hath destroyed the demons."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮਹਾਨ ਤੇਜਸਵੀ ('ਭਾਣੰ') ਦੈਂਤਾਂ ਨੂੰ ਮਾਰ ਦਿੱਤਾ।"