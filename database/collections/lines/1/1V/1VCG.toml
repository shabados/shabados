[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਕਬੀਰ; ਤੇਈ ਨਰ ਭੂਲੇ ॥"
page = 792
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir, only those persons go astray,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ, ਕੇਵਲ ਉਹ ਪੁਰਸ਼ ਹੀ ਗੁੰਮਰਾਹ ਹੁੰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, those people are deluded,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਸੋ ਜਿਨਕੀ ਬਾਤ ਪੀਛੇ ਕਥਨ ਕਰੀ ਹੈ, ਨਰ ਭੂਲੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ- ਉਹ ਮਨੁੱਖ ਖੁੰਝ ਗਏ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, aquél que abandona a Dios,"