[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਈ ਜਿ ਮੂਰਖੁ ਲੋਭੀਆ; ਮੂਲਿ. ਨ ਸੁਣੀ ਕਹਿਆ ॥੨॥"
page = 218
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "One, who is foolish and greedy, never hearkens to what is said to him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਜੋ ਬੇਵਕੂਫ ਤੇ ਲਾਲਚੀ ਹੈ, ਉਹ ਆਖੇ ਹੋਏ ਨੂੰ ਕਦਾਚਿੱਤ ਸ੍ਰਵਣ ਹੀ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But he is foolish and greedy, and he never listens to what he is told. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸਾ ਕੋਈ ਜੋ ਏਹ ਮਨ ਮੂਰਖ ਲੋਭੀ ਹੈ। ਬੇਦ ਸ਼ਾਸਤ੍ਰੋਂ ਗੁਰੋਂ ਕਾ ਕਹਣਾ ਕਦਾਚਿਤ ਨਹੀਂ ਸੁਣਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਜੀਵ ਐਸਾ ਕੋਈ ਮੂਰਖ ਲੋਭੀ ਹੈ ਕਿ (ਅਜੇਹੀ) ਆਖੀ ਹੋਈ ਗੱਲ ਬਿਲਕੁਲ ਨਹੀਂ ਸੁਣਦਾ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂਲਿ ਨ = ਬਿਲਕੁਲ ਨਹੀਂ। ਕਹਿਆ = ਆਖਿਆ ਹੋਇਆ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero el tonto y avaro ser dentro de mí no quería escuchar la Instrucción.(2)"