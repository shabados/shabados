[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਖਾਸਾ ਮਲਮਲ ਸਿਰੀਸਾਫੁ; ਸੂਤੁ ਕਤਾਇ ਕਪਾਹ ਵੁਣਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "On the other hand, from cotton are made coarse cloth muslin and sirisaf."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਖਾਸਾ, ਮਲਮਲ ਤੇ ਸਿਰੀ ਸਾਫ ਕਪਾਹ ਦੇ ਸੂਤ ਥੋਂ ਉਣਕੇ ਬਣਾਏ ਜਾਂਦੇ ਹਨ।"