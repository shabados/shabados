[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਵੈ ਚਾਰੌ ਤਾ ਮੈ ਜਰੇ; ਕਿਨਹੂੰ ਨ ਹੇਰੀ ਰਾਖਿ ॥੧੦॥"
page = 819

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the four were burned to death and no one even came across their ashes.(10)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ (ਮਕਾਨ) ਵਿਚ ਚਾਰੇ ਸੜ ਕੇ ਮਰ ਗਏ ਅਤੇ ਉਨ੍ਹਾਂ ਦੀ ਰਾਖ ਵੀ ਕਿਸੇ ਨੇ ਨਾ ਵੇਖੀ ॥੧੦॥"