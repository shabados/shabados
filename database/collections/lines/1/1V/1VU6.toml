data = "ਅਉਘਟ ਕੀ ਘਟ; ਲਾਗੀ ਆਇ ॥੨੧॥"
page = 1166
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and the hour of trouble came upon him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਤੇ ਮੁਸੀਬਤ ਦੀ ਘੜੀ ਆ ਪੁੱਜੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and his heart was troubled. ||21||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਤਿਸ ਕੋ (ਅਉਘਟ) ਔਖਾਈ ਕੀ ਘੜੀ ਆਨ ਲਗੀ, ਭਾਵ ਸੂਲ ਹੋਣੇ ਲਗ ਪੜਾ॥੨੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇ ਉੱਥੇ ਉਸ ਉੱਤੇ) ਔਖੀ ਘੜੀ ਆ ਗਈ (ਭਾਵ, ਉਹ ਸਹਿਮ ਗਿਆ) ॥੨੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਉਘਟ ਕੀ ਘਟ = ਔਖੀ ਘੜੀ ॥੨੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y pescó una enfermedad mortal. (21)"