[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਣ ਮਹਿ ਲੂਝੈ; ਮਨੂਆ ਮਾਰਿ ॥"
page = 931
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "engaging in combat, overpowers his mind,,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਯੁੱਧ ਅੰਦਰ ਜੂਝ ਕੇ ਆਪਣੇ ਮਨ ਨੂੰ ਕਾਬੂ ਕਰ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "fights the battle and conquers his own mind;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਰਣ ਮੇਂ ਕਾਮਾਦਿਕੋਂ ਕੇ ਸਾਥ (ਲੂਝੈ) ਝਗੜਤਾ ਵਾ ਲੜਤਾ ਹੈ ਔ ਮਨ ਕੋ ਮਾਰ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੇ ਕੋਝੇ ਮਨ ਨੂੰ ਵੱਸ ਵਿਚ ਲਿਆ ਕੇ ਇਸ ਜਗਤ-ਅਖਾੜੇ ਵਿਚ (ਕਾਮਾਦਿਕ ਵੈਰੀਆਂ ਨਾਲ) ਲੜਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਣ = ਜਗਤ-ਅਖਾੜਾ। ਮਨੂਆ = ਕੋਝਾ ਮਨ। ਲੂਝੈ = ਲੜਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Dios, gana la batalla de la vida y conquista su mente,"