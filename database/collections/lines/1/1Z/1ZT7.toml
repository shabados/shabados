[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇ ਜਨ ਸਚੇ ਨਿਰਮਲੇ; ਜਿਨ ਸਤਿਗੁਰ ਨਾਲਿ ਪਿਆਰੁ ॥"
page = 65
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Truthful and pure are the persons who bear love to the True Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿਵਾਦੀ ਅਤੇ ਪਵਿੱਤ੍ਰ ਹਨ ਉਹ ਪੁਰਸ਼, ਜਿਨ੍ਰਾਂ ਦੀ ਸੱਚੇ ਗੁਰਾਂ ਨਾਲ ਪਰੀਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those humble beings who are in love with the True Guru are pure and true."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕਾ ਸਤਿਗੁਰੋਂ ਕੇ ਸਾਥ ਪ੍ਰੇਮ ਹੈ, ਸੋ ਪੁਰਖ ਸਚੇ ਹੈਂ ਪੁਨਾ ਸੁੱਧ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਮਨੁੱਖ ਸਦਾ ਲਈ ਪਵਿਤ੍ਰ ਜੀਵਨ ਵਾਲੇ ਰਹਿੰਦੇ ਹਨ ਜਿਨ੍ਹਾਂ ਦਾ ਗੁਰੂ ਨਾਲ ਪਿਆਰ (ਟਿਕਿਆ ਰਹਿੰਦਾ) ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Sirvientes puros y verdaderos aman al Guru Verdadero."