[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਕਰਹਿ. ਸੁ ਸਚੇ ਭਲਾ ਹੈ; ਗੁਰ ਸਬਦਿ ਬੁਝਾਹੀ ॥"
page = 301
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O True One, whatever Thou doest that is good. By Guru's instruction this understanding is obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਤਿਪੁਰਖ! ਜੋ ਕੁਛ ਤੂੰ ਕਰਦਾ ਹੈ, ਉਹ ਚੰਗਾ ਹੈ। ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਦੁਆਰਾ ਇਹ ਸਮਝ ਆਉਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever You do is good, O True Lord; this understanding is obtained through the Word of the Guru's Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਚੇ! ਜੋ ਤੂੰ ਕਰੈ ਸੋਈ ਭਲਾ ਹੈ ਪਰੰਤੂ ਏਹੁ ਸਮਝ ਗੁਰ ਸਬਦੀਓਂ ਕੋ ਆਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੱਚੇ! ਸਤਿਗੁਰੂ ਦੇ ਸ਼ਬਦ ਰਾਹੀਂ ਤੂੰ ਇਹ ਸਮਝਾਉਂਦਾ ਹੈਂ ਕਿ ਜੋ ਤੂੰ ਕਰਦਾ ਹੈਂ ਸੋ ਚੰਗਾ ਕਰਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੁਝਾਹੀ = ਤੂੰ ਸਮਝ ਦੇਂਦਾ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo que sea que haces es Bueno; este es el Bani que la Palabra del Guru me ha revelado."