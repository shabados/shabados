[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇਤਾ ਜੀਉ ਪਿੰਡੁ ਸਭੁ ਤੇਰਾ; ਤੂੰ ਅੰਤਰਜਾਮੀ ਪੁਰਖੁ ਭਗਵਾਨੁ ॥"
page = 734
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My soul and body are all Thine, O Lord! Thou art the Knower of hearts and the Omnipotent illustrious Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਆਤਮਾ ਅਤੇ ਦੇਹ ਸਮੂਹ ਤੇਰੀਆਂ ਹਨ, ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਦਿਲਾਂ ਦੀਆਂ ਜਾਨਣਹਾਰ ਅਤੇ ਸਰਬ ਸ਼ਕਤੀਮਾਨ ਕੀਰਤੀਮਾਨ ਮਾਲਕ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My soul and body are totally Yours, Lord; You are the Inner-knower, the Searcher of hearts, my Primal Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਰਮੇਸਰ! ਯਹਿ ਜਿਤਨੀ ਚੇਤਨ ਕਲਾ ਔ ਸਰੀਰੋਂ ਕਾ ਸਮਦਾਯ ਹੈ ਸਭ ਤੇਰਾ ਕੀਤਾ ਹੋਯਾ ਹੈ। ਹੇ ਪੁਰਖ ਭਗਵਾਨ! ਤੂੰ ਅੰਤਰ ਹੋਇਕੈ ਪ੍ਰੇਰ ਰਹਿਆ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜਿਤਨਾ ਭੀ (ਜੀਵਾਂ ਦਾ) ਜਿੰਦ-ਸਰੀਰ ਹੈ, ਇਹ ਸਭ ਤੇਰਾ ਦਿੱਤਾ ਹੋਇਆ ਹੈ, ਤੂੰ ਸਭ ਦੇ ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲਾ ਸਰਬ-ਵਿਆਪਕ ਪ੍ਰਭੂ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਉ = ਜਿੰਦ। ਪਿੰਡੁ = ਸਰੀਰ। ਅੰਤਰਜਾਮੀ = ਸਭ ਦੇ ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Toda manifestación de vida es Creación Tuya, Oh Señor, Conocedor Íntimo, Espíritu Divino, Hacedor de Destinos."