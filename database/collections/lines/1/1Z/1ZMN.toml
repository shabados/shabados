[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਨਾਮੁ; ਤਤਕਾਲ ਉਧਾਰੈ ॥"
page = 264
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "there the Name of God rescues him instantly."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਰੱਬ ਦਾ ਨਾਮ ਇਕ ਦਮ ਉਸ ਨੂੰ ਬਚਾ ਲੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the Name of the Lord shall rescue you in an instant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਵਿਘਨੋਂ ਸੇ ਤਹਾਂ ਹਰੀ ਕਾ ਨਾਮ ਤਤਕਾਲ ਹੀ ਉਧਾਰ ਕਰ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਓਥੇ) ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਤੁਰਤ ਬਚਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਤਕਾਲ = ਤੁਰਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre de Dios ha de salvarte."