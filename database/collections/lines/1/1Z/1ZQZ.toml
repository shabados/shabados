[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਜਬ ਕੰਮ; ਕਰਤੇ ਹਰਿ ਕੇਰੇ ॥"
page = 118
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wonderful are the doings of God, the Creator."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਸਚਰਜ ਹਨ ਵਾਹਿਗੁਰੂ ਸਿਰਜਣਹਾਰ ਦੇ ਕਰਤਬ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The actions of the Creator Lord are marvellous and wonderful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕਰਤੇ ਕੇ ਕਾਂਮ ਅਸਚਰਜ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਉਸ ਹਰੀ ਕਰਤਾਰ ਦੇ ਕੌਤਕ ਅਚਰਜ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਤੇ ਕੇਰੇ = ਕਰਤੇ ਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Maravillosas son las Obras del Señor;"