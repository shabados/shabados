[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਸਤ੍ਰ ਬੇਦ ਪੁਰਾਣ ਪੜੑੰਤਾ ॥"
page = 1242
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man reads the Shastras, the Vedas and the Puranas."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਾਣੀ ਸਾਸਤਰਾਂ, ਵੇਦਾਂ ਤੇ ਪੁਰਾਣਾ ਨੂੰ ਵਾਚਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some read the Shaastras, the Vedas and the Puraanas."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ਼ਾਸਤ੍ਰ ਅਰ ਬੇਦ ਅਰ ਪੁਰਾਣੋਂ ਕੋ ਪੜਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਦ ਤਕ ਮਨੁੱਖ) ਸ਼ਾਸਤ੍ਰਾਂ ਵੇਦ ਪੁਰਾਣ (ਆਦਿਕ ਧਰਮ-ਪੁਸਤਕਾਂ ਨੂੰ ਨਿਰਾ) ਪੜ੍ਹਦਾ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno lee los Shastras, los Vedas y los Puranas y aunque uno los recita,"