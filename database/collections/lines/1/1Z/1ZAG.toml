data = "ਦਿਜਨ ਦੇਤ ਅਬ ਬਿਲੰਬ ਨ ਕਰਿਹੌ ॥"
page = 859

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘No’ she said without any hesitation, ‘I will definitely give each one of them a coin of takka."

[[content]]
