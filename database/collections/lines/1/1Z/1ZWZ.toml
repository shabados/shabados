[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ. ਮਨਿ ਪਿਆਰਿ ਹਾਂ ॥"
page = 409
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and enshrine love in thy mind for God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਰੱਬ ਦੇ ਨਾਮ ਲਈ ਆਪਣੇ ਚਿੱਤ ਵਿੱਚ ਪ੍ਰੀਤ ਧਾਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Cherish the Beloved Lord, Har, Har, in your mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਮੇਂ ਹਰਿ ਨਾਮ ਹੀ ਕਾ ਪ੍ਯਾਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨ ਵਿਚ ਪਰਮਾਤਮਾ ਨਾਲ ਪਿਆਰ ਬਣਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਪਿਆਰਿ = ਪਿਆਰ ਕਰ। ਗੁਰਿ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y enaltece al Bienamado Señor, Jar, Jar, en tu mente;"