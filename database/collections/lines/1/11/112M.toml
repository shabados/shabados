[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖ ਅਹੰਕਾਰੁ ਸਲਾਹਦੇ; ਹਉਮੈ ਮਮਤਾ ਵਾਦੁ ॥"
page = 301
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The perverse praise their pride, but in vain is the love of self-conceit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪ-ਹੁਦਰੇ ਆਪਣੇ ਗ਼ਰੂਰ ਨੂੰ ਵਡਿਆਉਂਦੇ ਹਨ, ਪ੍ਰੰਤੂ ਫਜੂਲ ਹੈ ਸਵੈ-ਹੰਗਤਾ ਦਾ ਮੋਹ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The self-willed manmukhs praise their own egos; their attachment to egotism is useless."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨਮੁਖ ਅਹੰਕਾਰ ਸੰਜੁਗਤੋਂ ਕੋ ਸਲਾਹਦੇ ਹੈਂ ਔਰ ਹੰਤਾ ਮਮਤਾ ਕਰਤੇ ਹੈਂ, ਸੋ ਬਿਅਰਥ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ ਜੀਵ ਅਹੰਕਾਰ ਹਉਮੈ ਤੇ ਅਪਣੱਤ ਦੀਆਂ ਗੱਲਾਂ ਨੂੰ ਪਸੰਦ ਕਰਦੇ ਹਨ ਭਾਵ ਇਹਨਾਂ ਦੇ ਅਧਾਰ ਤੇ ਕਿਸੇ ਮਨੁੱਖ ਦੀ ਨਿੰਦਾ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਲਾਹਦੇ = ਚੰਗਾ ਸਮਝਦੇ ਹਨ। ਮਮਤਾ = ਅਪਣੱਤ। ਵਾਦੁ = ਝਗੜਾ, ਝੰਬੇਲਾ, ਲੰਮੀਆਂ ਗੱਲਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los voluntariosos alaban su propio ego y hablan continuamente de “yo y lo mío”."