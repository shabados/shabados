[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਹਿ ਨਰ ਹਰਿ ਅੰਤਰੁ ਨਹੀ; ਨਾਨਕ. ਸਾਚੀ ਮਾਨੁ ॥੪੩॥"
page = 1428
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Between that man and God, there is no difference. Accept thou this as truth, O Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਇਨਸਾਨ ਅਤੇ ਹਰੀ ਦੇ ਵਿਚਕਾਰ, ਕੋਈ ਫਰਕ ਨਹੀਂ, ਤੂੰ ਇਸ ਨੂੰ ਸੱਚ ਜਾਣ ਕੇ ਕਬੂਲ ਕਰ, ਹੇ ਨਾਨਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no difference between that person and the Lord: O Nanak, accept this as the Truth. ||43||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸਮੇਂ ਔਰ ਹਰਿ ਮੇਂ ਕੁਛ ਭੇਦ ਨਹੀਂ ਹੈ, ਇਸ ਮੇਰੀ ਕਹੀ ਕੋ ਸਚ ਸਮਝ॥੪੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਇਹ ਗੱਲ ਠੀਕ ਮੰਨ ਕਿ ਉਸ ਮਨੁੱਖ ਅਤੇ ਪਰਮਾਤਮਾ ਵਿਚ ਕੋਈ ਫ਼ਰਕ ਨਹੀਂ ॥੪੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਤਰੁ = ਫ਼ਰਕ, ਵਿੱਥ। ਸਾਚੀ ਮਾਨੁ = ਠੀਕ ਮੰਨ ॥੪੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, acepta esto como Verdad. (43)"