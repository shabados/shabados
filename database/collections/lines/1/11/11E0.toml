type = "primary"
data = "ਬ ਦੀਦਨ ਵਜ਼ਾ ਚਾਰ ਮਾਹੇ ਨਿਹਮ ॥੨੪॥"
page = 1415

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Even remaining under his observation, I will keep you for four months.’(24)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਵੇਖਦੇ ਹੋਇਆਂ ਤੈਨੂੰ ਚਾਰ ਮਹੀਨੇ ਕੋਲ ਰਖਾਂਗੀ ॥੨੪॥"