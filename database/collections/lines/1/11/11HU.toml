[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਿਯ ਸੋਵਤ ਤ੍ਰਿਯ ਜਾਗਿ ਕੈ; ਪਤਿ ਕੌ ਦਿਯੋ ਜਗਾਇ ॥"
page = 832

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Although husband was in slumber, she was still awake."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸਤਰੀ ਨੇ ਜਾਗ ਕੇ ਸੁਤੇ ਹੋਏ ਪਤੀ ਨੂੰ ਜਗਾਇਆ"