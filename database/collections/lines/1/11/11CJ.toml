[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕਿਰਪਾ ਤੇ; ਦਲੁ ਸਾਧਿਆ ॥੨॥"
page = 210
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's grace I have vanquished the army of evil."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਮੈਂ ਬਦੀ ਦੀ ਸੈਨਾ ਨੂੰ ਹਰਾ ਦਿਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, I have vanquished the army of evil. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਹੀ ਆਸੁਰੀ ਸੈਨਾ ਕਾ ਸੰਬੂਹ (ਸਾਧਿਆ) ਬਸ ਕਰ ਲੀਆ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਮਿਹਰ ਨਾਲ ਮੈਂ (ਇਹਨਾਂ ਪੰਜਾਂ ਦੀ) ਫ਼ੌਜ ਕਾਬੂ ਕਰ ਲਈ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਲੁ = ਫ਼ੌਜ। ਸਾਧਿਆ = ਕਾਬੂ ਕਰ ਲਿਆ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "le he ganado a esos intrusos por la Gracia del Guru. (2)"