[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਨਾਮਾ; ਜਪਿਬੋ ਕਰੈ ॥"
page = 1165
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he recites Lord's Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਨੂੰ ਜਪਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He chants the Lord's Name,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਹਿਲਾਦ ਬਾਣੀ ਕਰ ਕੇ ਰਾਮ ਕੇ ਨਾਮ ਕੋ ਹੀ ਜਪਣਾ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਹਿਲਾਦ) ਹਰ ਵੇਲੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਪਿਬੋ ਕਰੈ = ਸਦਾ ਜਪਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él dedica su vida sólo a contemplar el Naam,"