[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰੈ ਸਤਿਗੁਰਿ; ਸਬਦੁ ਸੁਣਾਇਆ ॥"
page = 129
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "when the perfect True Guru preached to me his gospel."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਪੂਰਨ ਸੱਚੇ ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਆਪਣਾ ਉਪਦੇਸ਼ ਸਰਵਣ ਕਰਾਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "when one listens to the Shabad, the Word of the Perfect True Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਪੂਰੇ ਸਤਿਗੁਰੋਂ ਨੇ ਉਪਦੇਸ ਸੁਣਾ ਦੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਅਭੁੱਲ ਗੁਰੂ ਨੇ (ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦਾ) ਸ਼ਬਦ ਸੁਣਾ ਦਿੱਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰਿ = ਸਤਿਗੁਰ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la Riqueza del Nombre del Señor que estaba en mi propia casa."