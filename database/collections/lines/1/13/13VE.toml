[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਹਾ ਅਨੰਦ ਮੰਗਲ ਰੂਪ; ਤੁਮਰੇ ਬਚਨ ਅਨੂਪ ਰਸਾਲ ॥"
page = 680
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O the Embodiment of supreme bliss and beatitude, Thy word is exceedingly charming and the abode of Nectar."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਰਮ ਖੁਸ਼ੀ ਅਤੇ ਪ੍ਰਸੰਨਤਾ ਦੇ ਸਰੂਪ! ਤੇਰੀ ਬਾਣੀ ਮਹਾਨ ਸੁੰਦਰ ਅਤੇ ਅੰਮ੍ਰਿਤ ਦਾ ਘਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord of supreme ecstasy and blissful form, Your Word is so beautiful, so drenched with Nectar."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਹਾ ਅਨੰਦ ਕੇ ਦੇਣੇਹਾਰੇ ਮੰਗਲ ਰੂਪ (ਰਸਾਲ) ਰਸੋਂ ਕਾ ਘਰ ਤੁਮਾਰੇ ਵੇਦ ਰੂਪ ਬਚਨ ਪਰਮ ਅਨੂਪ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਆਨੰਦ-ਸਰੂਪ ਹੈਂ, ਤੂੰ ਮੰਗਲ-ਰੂਪ ਹੈਂ (ਆਨੰਦ ਹੀ ਆਨੰਦ; ਖ਼ੁਸ਼ੀ ਹੀ ਖ਼ੁਸ਼ੀ ਤੇਰਾ ਵਜੂਦ ਹੈ। ਹੇ ਪ੍ਰਭੂ! ਤੇਰੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ ਸੁੰਦਰ ਹੈ ਰਸੀਲੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨੂਪ = ਉਪਮਾ-ਰਹਿਤ, ਬਹੁਤ ਸੋਹਣੇ। ਰਸਾਲ = ਰਸ-ਭਰੇ {ਰਸ-ਆਲਯ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tu Palabra es dadora de Éxtasis Supremo, Deliciosa y de una Belleza Incomparable,"