[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਤਾ ਕੀ ਨਿਰਮਲ ਸੋਇ ॥੩॥"
page = 278
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "pure is the celebrity of him, Says Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਫੁਰਮਾਉਂਦੇ ਹਨ, ਪਵਿੱਤ੍ਰ ਹੈ ਉਸ ਦੀ ਕੀਰਤੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- says Nanak, his reputation is spotlessly pure. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਕੀ ਸੋਭਾ ਨਿਰਮਲ ਹੋਤੀ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਖ, ਹੇ ਨਾਨਕ! ਉਸ ਮਨੁੱਖ ਦੀ ਸੋਹਣੀ ਸੋਭਾ ਖਿਲਰਦੀ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਇ = ਸੋਭਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "será reconocido como crisol de pureza.(3)"