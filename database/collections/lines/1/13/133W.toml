[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਉ ਗੁਰਦੇਉ; ਤ ਭਉਜਲ ਤਰੈ ॥"
page = 1167
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Guru-God is merciful, then man crosses the dreadful ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਗੁਰੂ-ਪ੍ਰਮੇਸ਼ਰ ਮਿਹਰਬਾਨ ਹੁੰਦੇ ਹਨ ਤਦ ਬੰਦਾ ਭਿਆਨਕ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Divine Guru grants His Grace, one crosses over the terrifying world-ocean."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਗੁਰਦੇਵ ਦਯਾਲ ਹੋਤੇ ਹੈਂ ਤਬ ਸੰਸਾਰ ਸਮੁੰਦ੍ਰ ਸੇ ਤਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਗੁਰੂ ਮਿਲ ਪਏ ਤਾਂ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ ਮਨੁੱਖ ਪਾਰ ਲੰਘ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el Guru nos muestra su Compasión, uno es llevado a través."