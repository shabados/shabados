[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੂਕ ਪੁਕਾਰ. ਕੋ ਨ ਸੁਣੇ; ਓਹੁ ਅਉਖਾ ਹੋਇ ਹੋਇ ਰੋਇਆ ॥"
page = 309
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "No one listens to his cries and lamentation. He becomes miserable and bewails."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਚੀਕ-ਚਿਹਾੜੇ ਤੇ ਵਿਰਲਾਪ ਨੂੰ ਕੋਈ ਨਹੀਂ ਸੁਣਦਾ। ਉਹ ਦੁਖੀ ਹੋ ਕੇ ਰੌਦਾ-ਪਿੱਟਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one listens to his shrieks and cries; he cries out in pain and misery."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਕੂਕ ਪੁਕਾਰ ਨਹੀਂ ਸੁਣਤਾ ਵਹੁ ਦੁਖੀ ਹੋ ਹੋ ਕਰ ਰੋਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਥੇ) ਉਸ ਦੇ ਹਾੜੇ-ਤਰਲਿਆਂ ਵਲ ਕੋਈ ਗਹੁ ਨਹੀਂ ਕਰਦਾ, ਤੇ ਉਹ ਜਿਉਂ ਜਿਉਂ ਦੁਖੀ ਹੁੰਦਾ ਹੈ, ਤਿਉਂ ਤਿਉਂ (ਵਧੀਕ) ਰੋਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En verdad, se encuentra orillado a llegar hasta ahí."