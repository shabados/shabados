[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਮੰਦਰ ਮਹਿ ਹਰਿ ਵਸੈ; ਸਰਬ ਨਿਰੰਤਰਿ ਸੋਇ ॥"
page = 1346
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within the God's palace, abides God. He is contained amidst all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਮਹਿਲ ਅੰਦਰ ਵਾਹਿਗੁਰੂ ਵਸਦਾ ਹੈ। ਉਹ ਸਾਰਿਆਂ ਅੰਦਰ ਰਮਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord abides within the Temple of the Lord. He is pervading in all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੁ ਹਰਿ ਮੰਦਰ ਮੇਂ ਸੋ ਹਰੀ ਨਿਵਾਸ ਕਰਤਾ ਹੈ, ਜੋ ਸਰਬ ਕੇ ਬੀਚ ਅੰਤਰੇ ਤੇ ਰਹਿਤ ਵਿਆਪਕ ਸਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਸਰੀਰ-) 'ਹਰਿ-ਮੰਦਰ' ਵਿਚ ਪਰਮਾਤਮਾ (ਆਪ) ਵੱਸਦਾ ਹੈ, ਉਹ ਪਰਮਾਤਮਾ ਸਭ ਜੀਵਾਂ ਵਿਚ ਹੀ ਇਕ-ਰਸ ਵੱਸ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਬ ਨਿਰੰਤਰਿ = ਸਭ ਜੀਵਾਂ ਦੇ ਅੰਦਰ ਇਕ-ਰਸ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor habita en el interior de Su Templo y prevalece en todo y por todas partes,"