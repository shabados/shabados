[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤਹੁ; ਗੁਰਮੁਖਿ ਮੁਕਤਿ ਗਤਿ ਪਾਈ ॥"
page = 911
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O saints, it is through the Guru, that the status of salvation is obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤੋ! ਗੁਰਦੇਵ ਜੀ ਦੇ ਰਾਹੀਂ ਹੀ ਮੋਖਸ਼ ਦਾ ਮਰਤਬਾ ਪ੍ਰਾਪਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Saints, the Gurmukhs attain the state of liberation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨਹੁ! ਗੁਰਮੁਖੋਂ ਨੇ ਮੁਕਤੀ ਕੀ ਗਤੀ ਪਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! ਜਿਹੜਾ ਮਨੁੱਖ ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿੰਦਾ ਹੈ, ਉਹ ਵਿਕਾਰਾਂ ਤੋਂ ਖ਼ਲਾਸੀ ਹਾਸਲ ਕਰ ਲੈਂਦਾ ਹੈ, ਉਹ ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤਹੁ = ਹੇ ਸੰਤ ਜਨੋ! ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿਣ ਵਾਲਾ ਮਨੁੱਖ। ਮੁਕਤਿ = ਵਿਕਾਰਾਂ ਤੋਂ ਖ਼ਲਾਸੀ। ਗਤਿ = ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Santos, los Gurmukjs obtienen el Estado de Liberación.(1-Pausa)"