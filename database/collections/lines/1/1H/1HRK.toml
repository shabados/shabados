[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਸਤਤਿ ਨਿੰਦਾ; ਕਰੈ ਨਰੁ ਕੋਈ ॥"
page = 1164
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whether one praises me or slanders me,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਵੇਂ ਕੋਈ ਮੇਰੀ ਵਡਿਆਈ ਕਰੇ ਜਾ ਬਦਖੋਈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Anyone can praise or slander me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਪੁਰਸ਼ ਉਸਤਤੀ ਕਰੇ ਚਾਹੇ ਨਿੰਦਾ ਕਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਮਨੁੱਖ ਮੈਨੂੰ ਚੰਗਾ ਆਖੇ, ਚਾਹੇ ਕੋਈ ਮੰਦਾ ਆਖੇ (ਇਸ ਗੱਲ ਦੀ ਮੈਨੂੰ ਪਰਵਾਹ ਨਹੀਂ ਰਹੀ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਸਤਤਿ = ਸੋਭਾ, ਵਡਿਆਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No me interesa quien me alabe o me critique,"