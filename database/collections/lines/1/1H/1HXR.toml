[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਉ ਵਟੀ; ਇਤੁ ਤਨਿ ਪਾਈਐ ॥"
page = 25
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "be the oil and the fear of of Lord be the wick of this body (lamp)."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਲ ਅਤੇ ਸੁਆਮੀ ਦੇ ਡਰ ਦੀ ਬੱਤੀ ਇਸ ਦੇਹਿ (ਦੇ ਦੀਵੇ) ਵਿੱਚ ਪਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "And let the Fear of God be the wick for the lamp of this body."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹਿ ਤੋ ਭਯਾ ਤੇਲੁ, (ਭਉ) ਵਾਹਿਗੁਰੂ ਕਾ ਜੋ ਭੈ ਹੈ, ਸੋਈ ਭਈ ਬਾਤੀ, ਸਰੀਰ ਰੂਪੀ ਦੀਪਕ ਮੇਂ ਲਗਾਵਨਾ ਕਰੀਏ। ਭਾਵ ਏਹਿ ਸਰੀਰ ਮੇਂ ਪਰਮੇਸਰ ਦਾ ਭਉ ਧਾਰਨ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਡਰ-ਇਹ ਸਰੀਰ (-ਦੀਵੇ) ਵਿਚ ਵੱਟੀ ਪਾ ਦੇਈਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਤੁ = ਇਸ ਵਿਚ। ਤਨਿ = ਤਨ ਵਿਚ। ਇਤੁ ਤਨਿ = ਇਸ ਤਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "and let the Fear of God be the wick for the lamp of this body."