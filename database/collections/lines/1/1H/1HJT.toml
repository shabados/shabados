[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਥਾ ਸਤ੍ਰ ਮਿਤ੍ਰੰ ਤਥਾ ਮਿਤ੍ਰ ਸਤ੍ਰੰ ॥"
page = 151

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The enemy and the friend and the enemy are alike"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਹਾ ਵੈਰੀ ਹੈ, ਤਿਹਾ ਮਿਤਰ ਹੈ; ਜਿਹਾ ਮਿਤਰ ਹੈ, ਤੇਹਾ ਵੈਰੀ ਹੈ।"