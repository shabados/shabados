[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰੇਮ ਭਗਤਿ ਪ੍ਰਭ ਲਾਗੀ ॥"
page = 627
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone, who is very fortunate,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਓਹੀ, ਜੋ ਭਾਰੇ ਨਸੀਬਾਂ ਵਾਲਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is attached in loving devotion to God,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭ ਕੀ ਪ੍ਰੇਮਾ ਭਗਤੀ ਮੇਂ ਹਮਾਰੀ ਬ੍ਰਿਤੀ ਲਾਗੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਸੰਤ ਜਨੋ! ਜੇਹੜਾ ਮਨੁੱਖ ਗੁਰੂ ਦਾ ਧਿਆਨ ਧਰਦਾ ਹੈ) ਪ੍ਰਭੂ ਦੀ ਪਿਆਰ-ਭਰੀ ਭਗਤੀ ਵਿਚ ਉਸ ਦਾ ਮਨ ਲੱਗ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰੇਮ ਭਗਤਿ = ਪਿਆਰ-ਭਰੀ ਭਗਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo el Hombre de Destino"