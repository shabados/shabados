[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਲਗੁ; ਬਿਕਲ ਭਈ ਨਹੀ ਬਾਨੀ ॥"
page = 1159
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and so long as thy speech has grown not powerless,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜਦ ਤਾਂਈ ਤੇਰੀ ਬੋਲ ਬਾਣੀ ਬੇ-ਤਾਕਤ ਨਹੀਂ ਹੋਈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and as long as your voice has not lost its power,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਜਬ ਤਕ ਬਾਨੀ (ਬਿਕਲ) ਅਸਤ ਬ੍ਯਸਤ ਨਹੀਂ ਹੂਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦ ਤਕ ਤੇਰੀ ਜ਼ਬਾਨ ਥਿੜਕਣ ਨਹੀਂ ਲੱਗ ਪੈਂਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਕਲ = ਬੇ-ਥਵ੍ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mientras no tiembles al hablar,"