[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਾਰਿ ਪਰੇ; ਅਬ ਪੂਰਾ ਦੀਜੈ ॥੪॥੧੩॥"
page = 326
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have grown weary. Grant me perfection, now."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹੰਭ ਗਿਆ ਹਾਂ, ਹੁਣ ਮੈਨੂੰ ਪੂਰਨਤਾ ਬਖਸ਼।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am so tired; now, please bless me with Your perfection. ||4||13||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚੌਰਾਸੀ ਮੇਂ ਭਰਮਤੇ ਹੂਏ ਹਾਰ ਕਰ ਤੇਰੀ ਸਰਨ ਪੜੇ ਹਾਂ, ਅਬ ਪੂਰਾ ਜੋ ਮੋਖ ਪਦ ਹੈ, ਸੋ ਦੀਜੀਏ॥੪॥੧੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਸੀਂ ਥੱਕ-ਟੁੱਟ ਕੇ (ਤੇਰੇ ਦਰ ਤੇ) ਆ ਡਿੱਗੇ ਹਾਂ ॥੪॥੧੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਾਰਿ = ਹਾਰ ਕੇ, ਜੂਨਾਂ ਵਿਚ ਪੈ ਪੈ ਕੇ ਥੱਕ ਕੇ। ਪਰੇ = ਡਿੱਗੇ ਹਾਂ (ਤੇਰੇ ਦਰ ਤੇ)। ਪੂਰਾ = ਗਿਆਨ ॥੪॥੧੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Te entrego mi ser, bendíceme ahora con Tu Sabiduría Perfecta.(4-13)"