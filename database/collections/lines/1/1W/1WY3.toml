data = "ਰੈਨਿ ਦਿਵਸ ਡਾਰਿਯੋ ਰਹੈ; ਫੂਲ ਮਤੀ ਕੇ ਸਾਥ ॥੧॥"
page = 984

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He used to spend most of the time lying down with Phool Mati.(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਰਾਤ ਦਿਨ ਫੂਲ ਮਤੀ ਦੇ ਨਾਲ ਹੀ ਪਿਆ ਰਹਿੰਦਾ ॥੧॥"