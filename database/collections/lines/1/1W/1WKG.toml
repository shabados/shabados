[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਦਿਨ ਸਸਤ੍ਰ ਅਸਤ੍ਰ ਕਟਿ ਬਾਧੋ; ਚੰਦਨ ਚਿਤ੍ਰ ਲਗਾਊਾਂ ॥"
page = 681

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On that day I shall fasten the arms and weapons with my waist, and plaster the place with sandal"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਿਨ ਸ਼ਸਤ੍ਰ ਅਤੇ ਅਸਤ੍ਰ ਲਕ ਨਾਲ ਬੰਨ੍ਹ ਕੇ ਚੰਦਨ ਦਾ ਟਿਕਾ ਲਗਾਵਾਂਗਾ"