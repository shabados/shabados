[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹੋਰੋ ਕਿਹੁ ਕਰਿ ਪੁਛੀਐ; ਹੋਰੋ ਕਿਹੁ ਕਰਿ ਆਖਿ ਵਖਾਣੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He is asked something else and he replies altogether about something different."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਹੋਰਨਾਂ ਨੂੰ ਕਿੱਕੁਰ ਪੁਛੀਦਾ ਹੈ ਅਤੇ ਹੋਰਨੂੰ ਕਿੱਕੁਰ ਆਖਕੇ ਵੱਢ੍ਯਾਨ ਕਰੀਦਾ ਹੈ।"