[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਫੋਕਟ ਧਰਮ ਬਿਸਾਰ ਸਬੈ; ਕਰਤਾਰ ਹੀ ਕਉ ਕਰਤਾ ਜੀਅ ਜਾਨਯੋ ॥੧੨॥"
page = 712

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But my mind has forsaken all useless actions and has accepted only the One Creator.12."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਪਰ ਮੈਂ ਆਪਣੇ) ਮਨ ਵਿਚ ਸਾਰੇ ਫੋਕਟ ਧਰਮਾਂ ਨੂੰ ਭੁਲਾ ਕੇ, ਕੇਵਲ ਕਰਤਾਰ ਨੂੰ ਹੀ ਕਰਤਾ ਮੰਨਿਆ ਹੈ ॥੧੨॥"