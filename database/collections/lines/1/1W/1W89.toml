[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੰਡ ਪ੍ਰਚੰਡਿ ਸੁ ਕੇਹਰਿ ਕਾਲਿਕਾ; ਅਉ ਸਕਤੀ ਮਿਲਿ ਜੁਧ ਕਰਿਓ ਹੈ ॥"
page = 98

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The fierce Chandi, Lion Kalika other powers have waged a violent war together.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਚੰਡ ਚੰਡੀ, ਸ਼ੇਰ, ਕਾਲੀ ਅਤੇ ਦੇਵ-ਸ਼ਕਤੀਆਂ ਨੇ ਮਿਲ ਕੇ ਯੁੱਧ ਕੀਤਾ ਹੈ।"