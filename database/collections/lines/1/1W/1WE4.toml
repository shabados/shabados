[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਆਰਾਮ ਦੁਸ਼ਮਨ, ਨ ਆਜ਼ਾਰ ਦੋਸਤ ॥"
page = 1398

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Neither you have afflicted the friends, nor the enemies, to enjoy the comforts."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੁਸੀਂ) ਦੁਸ਼ਮਣ ਨੂੰ ਚੈਨ ਨਹੀਂ ਲੈਣ ਦਿੱਤਾ ਅਤੇ ਨਾ ਮਿਤਰਾਂ ਨੂੰ ਦੁਖ ਪਹੁੰਚਾਇਆ ਹੈ।"