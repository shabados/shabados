[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਪੁ ਮੁਸਫ ਬਾਚਤ ਭਈ; ਜਾਟ ਖਾਟਿ ਤਰ ਬਾਧਿ ॥"
page = 864

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She started to read Quran and had made Jat to hide underneath the bed."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੱਟ ਨੂੰ ਮੰਜੀ ਹੇਠਾਂ ਬੰਨ੍ਹ ਕੇ ਆਪ ਕੁਰਾਨ ('ਮੁਸਫ') ਵਾਚਣ ਲਗ ਪਈ"