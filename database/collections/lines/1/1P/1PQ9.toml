[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਤਨੁ ਮਉਲਿਓ; ਅਤਿ ਅਨੂਪ ॥"
page = 1180
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My mind and body have flowered, and very beauteous are they."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਚਿੱਤ ਅਤੇ ਦੇਹਿ ਪ੍ਰਫੁਲਤ ਹੋ ਗਏ ਹਨ ਅਤੇ ਉਹ ਨਿਹਾਇਤ ਹੀ ਸੁੰਦਰ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind and body have blossomed forth, in utter, incomparable beauty."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨੁ ਜੋ ਹੈ (ਤਨੁ) ਸੂਖਮ ਸੋ ਅਤਿ ਅਨੂਪ, ਭਾਵ ਅਸਚਰਜ ਪ੍ਰਫੁਲਤ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਗਾਵਣ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਮੇਰਾ ਮਨ ਸੋਹਣਾ ਖਿੜ ਪਿਆ ਹੈ ਮੇਰਾ ਤਨ ਬਹੁਤ ਸੋਹਣਾ ਖਿੜ ਪਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਉਲਿਓ = ਖਿੜ ਪਿਆ ਹੈ, ਆਤਮਕ ਜੀਵਨ ਵਾਲਾ ਬਣ ਗਿਆ ਹੈ। ਅਨੂਪ = ਸੋਹਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi cuerpo y mente han florecido, son de incomparable belleza,"