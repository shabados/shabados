data = "ਲਖ ਨਗਾਰੇ ਵਜਨ, ਆਮ੍ਹੋ ਸਾਮ੍ਹਣੇ ॥"
page = 121

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "A hundred thousand trumpets resound facing one another."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਯੁੱਧ-ਭੂਮੀ ਵਿਚ) ਲਖਾਂ ਧੌਂਸੇ ਆਹਮੋ ਸਾਹਮਣੇ ਵਜਦੇ ਸਨ।"