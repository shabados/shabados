[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿਹਾਂ. ਮਸਤਕਿ ਹੋਵੈ ਭਾਗੁ; ਤ ਸਾਜਨੁ ਪਾਈਐ ॥੨॥"
page = 1361
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Harihan, if good destiny be writ on the brow, then alone the Friend it obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰਿਹਾਂ! ਜੇਕਰ ਮੱਥੇ ਤੇ ਚੰਗੀ ਭਾਵੀ ਲਿਖੀ ਹੋਈ ਹੋਵੇ, ਕੇਵਲ ਤਦ ਹੀ ਮਿੱਤਰ ਪਰਾਪਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord! If such good destiny is inscribed upon my forehead, then I shall find my Friend. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਤੌ ਬੀ (ਹਰਿਹਾਂ) ਹੇ ਭਾਈ! ਵਾ ਛੰਦ ਕੀ ਰੀਤ ਮਸਤਕ ਮੇਂ ਪੂਰਨ ਭਾਗ ਹੋਵੈ ਤਬ ਤਿਸ ਵਾਹਿਗੁਰੂ ਸਾਜਨ ਕੋ ਪਾਈਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਹੇਲੀਏ! ਜੇ ਮੱਥੇ ਉੱਤੇ ਭਾਗ ਜਾਗ ਪਏ ਤਾਂ ਹੀ ਸੱਜਣ-ਪ੍ਰਭੂ ਮਿਲਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿਹਾਂ = ਹੇ ਹਰੀ! ਮਸਤਕਿ = ਮੱਥੇ ਉੱਤੇ। ਪਾਈਐ = ਮਿਲਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Señor, si tal buen Destino ha sido inscrito en mi frente, entonces voy a encontrar a mi Amigo.(2)"