type = "primary"
data = "ਸਭੁ ਕਿਛੁ; ਤਿਸੁ ਸੁਝੈ ਹਾਂ ॥"
page = 410
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He knows all the things."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰੀਆਂ ਗੱਲਾਂ ਨੂੰ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He knows everything."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੋ ਸਭ ਕੁਛ ਸੂਝਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਹਰੇਕ ਜੀਵ ਦੀ ਹਰੇਕ ਮਨੋ-ਕਾਮਨਾ ਦੀ ਸਮਝ ਆ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él conoce todo y supervisa todo."