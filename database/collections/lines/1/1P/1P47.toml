data = "ਬਿਕ੍ਰਾਰ ਮਾਰ ਤਹ ਮਚੀਯੰ ॥੨੪॥"
page = 197

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Rudra is also dancing there with his loosened matted hair and a dreadful war is being waged there.24."

