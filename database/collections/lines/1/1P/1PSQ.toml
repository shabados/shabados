[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਧਸੰਗਤਿ ਚੰਨਣ ਬਿਰਖੁ; ਮਿਲਿ ਚੰਨਣੁ ਹੋਈ ॥੧੨॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The holy congregation is a sandal tree to which whosoever becomes sandal"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕਿ ਸਾਧ ਸੰਗਤ ਰੂਪੀ ਚੰਨਣ ਬੂਟੇ ਨਾਲ ਮਿਲਕੇ ਚੰਨਣ ਹੋ ਗਏ ਹਨ।"