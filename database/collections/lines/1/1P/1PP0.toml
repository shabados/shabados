[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਹਰਿ ਦਾਸਨ ਕੀ ਉਸਤਤਿ ਹੈ; ਸਾ ਹਰਿ ਕੀ ਵਡਿਆਈ ॥"
page = 652
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever the praise of the Lord's slave is, that is, in fact, the Lord's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੀ ਪ੍ਰਭੂ ਦੇ ਗੋਲੇ ਦੀ ਕੀਰਤੀ ਹੈ, ਉਹ ਪ੍ਰਭੂ ਦੀ ਹੀ ਉਸਤਤਿ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The praise of the Lord's slaves is the Glory of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਜੋ ਆਪ ਕੇ ਦਾਸੋਂ ਕੀ ਜਗਤ ਮੇਂ ਉਸਤਤੀ ਹੋਤੀ ਹੈ, ਸੋਈ ਹਰ ਪ੍ਰਕਾਰ ਸੇ ਆਪ ਕੀ ਵਡਿਆਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਦੇ ਸੇਵਕਾਂ ਦੀ ਵਡਿਆਈ ਹਰੀ ਦੀ ਹੀ ਵਡਿਆਈ ਹੈ;"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Alabanza de los Devotos del Señor es en verdad la Alabanza del Señor."