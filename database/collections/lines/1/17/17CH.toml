[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਜਗਤੁ ਉਪਾਇ. ਹਰਿ ਰੰਗੁ ਕੀਆ; ਤਿਸੈ ਵਿਟਹੁ ਕੁਰਬਾਣੁ ॥"
page = 1420
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who has created the world and loves it, unto the God, I am a sacrifice."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਸੰਸਾਰ ਸਾਜਿਆ ਹੈ ਅਤੇ ਜੋ ਇਸ ਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹੈ, ਉਸ ਵਾਹਿਗੁਰੂ ਉਤੇ ਮੈਂ ਵਾਰਨੇ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to that Lord who created the world, and who loves it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪ੍ਰਮੇਸ੍ਵਰ ਨੇ ਜਗਤ ਕੋ ਉਪਾਇ ਕਰ (ਰੰਗੁ) ਹਰ ਏਕ ਰੰਗੋਂ ਕਾ ਸਮਦਾਯ ਕੀਆ ਹੈ, ਤਿਸੀ ਤੋਂ ਕੁਰਬਾਨ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਹਰੀ ਨੇ ਇਹ ਜਗਤ ਪੈਦਾ ਕਰ ਕੇ ਇਹ ਖੇਲ-ਤਮਾਸ਼ਾ ਬਣਾਇਆ ਹੈ, ਉਸ ਤੋਂ ਸਦਕੇ ਹੋਇਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਪਰਮਾਤਮਾ) ਨੇ। ਜਿਨਿ ਹਰਿ = ਜਿਸ ਹਰੀ ਨੇ। ਰੰਗੁ = ਤਮਾਸ਼ਾ। ਵਿਟਹੁ = ਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi vida a ese Señor que creó el mundo y que lo ama."