[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਧਨੋ ਛੋਡਿ; ਜਾਈਐ ਪ੍ਰਭ ਕੈਂ ਧਰਿ ॥"
page = 371
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Forsaking Thee, O Lord, whom else should I go to?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੈਨੂੰ ਤਿਆਗ ਕੇ, ਹੇ ਸੁਆਮੀ! ਮੈਂ ਹੋਰ ਕੀਹਦੇ ਕੋਲ ਜਾਵਾਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If I were to renounce You, God, unto whom could I turn?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੁਝ ਕੋ ਛੋਡਿ ਕਰ ਕਿਸ ਕੇ ਆਸਰੇ ਜਾਈਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੈਨੂੰ ਛੱਡ ਕੇ ਹੋਰ ਜਾਈਏ ਭੀ ਕਿਹੜੇ ਪਾਸੇ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੋ = ਨੂੰ। ਕੈਂ ਧਰਿ = ਕੇਹੜੇ ਪਾਸੇ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, olvidándote, ¿qué nos queda?"