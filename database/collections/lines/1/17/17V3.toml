[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਣਿ ਪੁਕਾਰੂ ਚਾਲੀ, ਧਰਤੀ ਇੰਦ੍ਰ ਥੈ ॥੪੪॥"
page = 126

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And it seemed that the earth is going to Indra for a complaint.44."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਧਰਤੀ ਪੁਕਾਰ ਕਰਨ ਲਈ ਇੰਦਰ ਕੋਲ ਚਲੀ ਹੋਵੇ ॥੪੪॥"