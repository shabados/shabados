data = "ਬਿਯਾਮਦ ਬ ਸ਼ਹਰ ਸ਼ਾਹ ਹਿੰਦੋਸਤਾ ॥੧੫॥"
page = 1425

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And came to a city in the country of Sher Shah.(15)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਹਿੰਦੁਸਤਾਨ ਦੇ ਬਾਦਸ਼ਾਹ ਦੇ ਨਗਰ ਵਿਚ ਆ ਗਈ ॥੧੫॥"