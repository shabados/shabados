[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰ ਪੂਰਾ ਨਿਰਵੈਰੁ ਹੈ; ਨਿੰਦਕ ਦੋਖੀ ਬੇਮੁਖ ਤਾਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The perfect Guru is away form enmity and He liberates even the slanderers, envious ones and the apostates."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੂ ਸਦਾ ਨਿਰਵੈਰ ਹਨ, ਨਿੰਦਕ, ਦੋਖੀ ਅਤੇ ਬੇਮੁਖਾਂ (ਨੂੰ ਬੀ ਸੰਸਾਰ ਸਮੁੰਦ੍ਰੋਂ) ਪਾਰ ਕਰਦੇ ਹਨ।"