[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨਸੇ; ਕਾਚ ਕੇ ਬਿਉਹਾਰ ॥"
page = 1227
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man, the false worldly affairs are of no avail."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੰਦੇ! ਕੂੜੇ ਸੰਸਾਰੀ ਵਿਹਾਰ ਕਿਸੇ ਕੰਮ ਨਹੀਂ ਆਉਂਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The false dealings are finished."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੀਵ! ਕਾਚ ਕੇ ਪਾਤਰ ਸਮ ਬਿਵਹਾਰੋਂ ਕੇ ਬਿਨਸਤੇ ਹੂਏ ਦੇਰ ਨਹੀਂ; ਵਾ ਕਾਚ, ਭਾਵ ਮਾਇਆ ਕੇ ਬਿਉਹਾਰ ਬਿਨਸ ਜਾਵੇਂਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੱਚ (-ਸਮਾਨ ਮਾਇਆ ਦੀ ਖ਼ਾਤਰ) ਸਾਰੀਆਂ ਦੌੜਾਂ-ਭੱਜਾਂ ਵਿਅਰਥ ਜਾਂਦੀਆਂ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਚ ਕੇ = ਕੱਚ ਦੇ, ਤੁੱਛ ਮਾਇਆ ਦੇ (ਜਿਸ ਨੇ ਸਾਥ ਜ਼ਰੂਰ ਛੱਡਣਾ ਹੁੰਦਾ ਹੈ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He abandonado el comercio con ilusiones y me he dedicado sólo a lo Real,"