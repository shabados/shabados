[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨ ਸੰਤਨ ਕੀ; ਬਾਛਉ ਧੂਰਿ ॥"
page = 282
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I desire the dust of the feet of those saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਸਾਧੂਆਂ ਦੇ ਚਰਨਾਂ ਦੀ ਮੈਂ ਧੂੜ ਲੋੜਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I seek the dust of the feet of those Saints;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਸੰਤੋਂ ਕੀ ਮੇਂ ਚਰਨ ਧੂੜੀ ਬਾਂਛਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਹਨਾਂ ਸੰਤਾਂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ਮੰਗਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਛਉ = ਚਾਹੁੰਦਾ ਹਾਂ। ਧੂਰਿ = ਧੂੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, yo beso el Polvo de los Pies de tal Santo;"