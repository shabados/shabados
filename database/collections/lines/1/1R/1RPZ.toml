[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਮਿਲੇ; ਹਰਿ ਪਾਏ ॥"
page = 1185
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "One attains to his God, on meeting the Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਊਹ ਗੁਰਾਂ ਨੂੰ ਮਿਲ ਕੇ ਆਪਣੇ ਹਰੀ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who has such destiny written on his forehead,"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮਨ!) ਗੁਰੂ ਨੂੰ ਮਿਲ ਕੇ ਹੀ ਹਰਿ-ਨਾਮ ਪ੍ਰਾਪਤ ਕੀਤਾ ਜਾ ਸਕਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਮਿਲੇ = ਗੁਰ ਮਿਲਿ, ਗੁਰੂ ਨੂੰ ਮਿਲ ਕੇ (ਹੀ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que lleva un destino así inscrito,"