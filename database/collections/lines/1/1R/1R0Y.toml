[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭਨਾ ਪ੍ਰਤਿਪਾਲ ਕਰੇ ਜਗਜੀਵਨੁ; ਦੇਦਾ ਰਿਜਕੁ ਸੰਬਾਹਾ ਹੇ ॥੨॥"
page = 1055
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God, the Life of the world, Nurtures all and brings sustenance to all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਦੀ ਜਿੰਦਜਾਨ, ਵਾਹਿਗੁਰੂ, ਸਾਰਿਆਂ ਦੀ ਪਾਲਣਾ ਪੋਸਣਾ ਕਰਦਾ ਹੈ ਅਤੇ ਸਾਰਿਆਂ ਨੂੰ ਰੋਜ਼ੀ ਪੁਚਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Life of the world nurtures and cherishes all, giving sustenance to all. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ (ਜਗ ਜੀਵਨੁ) ਪਰਮੇਸਰ ਸਭਨਾਂ ਕੀ ਪ੍ਰਤਿਪਾਲਾ ਕਰਤਾ ਹੈ, ਰਿਜਕ ਪਹੁੰਚਾ ਦੇਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਜਗਤ-ਦਾ-ਸਹਾਰਾ ਪ੍ਰਭੂ ਸਭ ਜੀਵਾਂ ਦੀ ਪਾਲਣਾ ਕਰਦਾ ਹੈ, ਸਭਨਾਂ ਨੂੰ ਰਿਜ਼ਕ ਦੇਂਦਾ ਹੈ, ਸਭਨਾਂ ਨੂੰ ਰਿਜ਼ਕ ਅਪੜਾਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਤਿਪਾਲ = ਪਾਲਣਾ। ਜਗ ਜੀਵਨੁ = ਜਗਤ ਦਾ ਸਹਾਰਾ ਪ੍ਰਭੂ। ਸੰਬਾਹਾ = ਪੁਚਾਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, Él, el Señor de toda vida, trae el sustento a todos.(2)"