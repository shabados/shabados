[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਇ ਪਇਆ ਹਰਿ ਤੇਰੈ ਦੁਆਰੈ ॥"
page = 98
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have come to lie prostrate at Thy gate, O God!"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆ ਕੇ ਤੇਰੇ ਬੂਹੇ ਤੇ ਡਿੱਗਾ ਪਿਆ ਹਾਂ, ਹੇ ਵਾਹਿਗੁਰੂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have come and fallen at Your Door, O Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਮੈਂ ਤੇਰੇ ਦ੍ਵਾਰੇ ਪਰ ਆਇ ਪੜਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਿਆਰੇ ਹਰੀ! ਮੈਂ ਤੇਰੇ ਦਰ ਤੇ ਆ ਡਿੱਗਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਇ = ਆ ਕੇ। ਹਰਿ = ਹੇ ਹਰੀ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "he venido a postrarme ante Tu Puerta."