[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅੰਬਰੀਕ ਮੁਹਿ ਵਰਤੁ ਹੈ; ਰਾਤਿ ਪਈ ਦੁਰਬਾਸਾ ਆਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "One evening while king Ambaris was fasting he was visited by sage Durvasa"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਰਾਜਾ) ਅੰਬਰੀਕ ਦਾ ਮੂੰਹ (ਇਕਾਦਸ਼ੀ ਦੇ) ਬਰਤ ਵਾਲਾ ਸੀ, ਜਦ ਰਾਤ ਬੀਤੀ ਤਦ ਦੁਰਬਾਸ਼ਾ (ਰਿਖੀ) ਆ ਗਿਆ।"