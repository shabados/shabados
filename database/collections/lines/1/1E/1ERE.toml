[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਤਾ ਪ੍ਰੀਤਿ ਕਰੇ; ਪੁਤੁ ਖਾਇ ॥"
page = 164
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mother loves to see the son eat."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਂ ਦੀ ਆਪਣੇ ਪੁਤ੍ਰ ਨੂੰ ਖਾਂਦੇ ਦੇਖਣ ਨਾਲ ਮੁਹੱਬੁਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mother loves to see her son eat."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਮਾਤਾ ਪ੍ਰੀਤੀ ਕਰਤੀ ਹੈ ਕਿ ਮੇਰਾ ਪੁਤ੍ਰ ਖਾਵੇ, ਭਾਵ ਯੇਹਿ ਕਿ ਮਾਤਾ ਪੁਤ੍ਰ ਕੋ ਛਕਾ ਕਰ ਪ੍ਰਸੰਨ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹਰੇਕ) ਮਾਂ ਖ਼ੁਸ਼ੀ ਮਨਾਂਦੀ ਹੈ ਜਦੋਂ ਉਸ ਦਾ ਪੁੱਤਰ (ਕੋਈ ਚੰਗੀ ਸ਼ੈ) ਖਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰੀਤਿ = ਖ਼ੁਸ਼ੀ (प्राति = pleasure प्री = to take delight)। ਪ੍ਰੀਤਿ ਕਰੇ = ਖ਼ੁਸ਼ੀ ਮਨਾਂਦੀ ਹੈ, ਖ਼ੁਸ਼ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La madre está feliz cuando su hijo ha sido alimentado."