[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸਾ ਕੀਰਤਨੁ; ਕਰਿ ਮਨ ਮੇਰੇ ॥"
page = 236
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My soul sing such praises of the Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਜਿੰਦੜੀਏ ਪ੍ਰਭੂ ਦੀ ਐਹੋ ਜੇਹੀ ਪ੍ਰਭਤਾ ਗਾਇਨ ਕਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, sing such Praises of the Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪਿਆਰੇ! ਐਸਾ ਕੀਰਤਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ ਪਰਮਾਤਮਾ ਦੀ ਇਹੋ ਜਿਹੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦਾ ਰਹੁ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Alaba al Señor, oh mi mente,"