[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਹੁਤੇ ਭੇਖ ਕਰਹਿ; ਭੇਖਧਾਰੀ ॥"
page = 842
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The sectarians wear many religious garbs."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਪ੍ਰਦਾਈ, ਘਣੇਰੇ ਧਾਰਮਕ ਬਾਣੇ ਪਹਿਨਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The religious fanatics wear all sorts of religious robes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਭੇਖੋਂ ਕੇ ਧਾਰਨੇ ਵਾਲੇ ਬਹੁਤੇ ਹੀ ਭੇਖ ਕਰਤੇ ਹੈਂ, ਭਾਵ ਪਖੰਡੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਨਿਰੇ ਧਾਰਮਿਕ ਪਹਿਰਾਵੇ ਦਾ ਆਸਰਾ ਲੈਣ ਵਾਲੇ ਮਨੁੱਖ ਅਨੇਕਾਂ ਭੇਖ ਕਰਦੇ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੇਖਧਾਰੀ = ਨਿਰੇ ਧਾਰਮਿਕ ਪਹਿਰਾਵੇ ਦਾ ਆਸਰਾ ਲੈਣ ਵਾਲੇ ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno se pone miles de vestimentas para tratar de pasar por religioso,"