[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਨਾਨਕ. ਪ੍ਰੀਤਿ; ਸਾਧ ਪਗ ਚਾਟੇ ॥੪॥੩॥੪੧॥"
page = 164
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Serf Nanak loves to kiss the feet of god's saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਫਰ ਨਾਨਕ ਰੱਬ ਦੇ ਸੰਤਾ ਦੇ ਪੈਰ ਚਟਣ ਨੂੰ ਪ੍ਰੀਤ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Servant Nanak loves to kiss the feet of the Holy. ||4||3||41||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੈਂ ਜਨ ਵਾ ਭਗਤ ਤੋ ਸੰਤੋਂ ਕੇ ਚਰਣ ਚਾਟਣੇ ਕਰ ਪ੍ਰਸਿੰਨ ਹੋਤੇ ਹੈਂ॥੪॥੩॥੪੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਪਰਮਾਤਮਾ ਦੇ ਸੇਵਕ ਨੂੰ ਖ਼ੁਸ਼ੀ ਹੁੰਦੀ ਹੈ ਜਦੋਂ ਉਹ ਕਿਸੇ ਗੁਰਮੁਖਿ ਦੇ ਪੈਰ ਚੁੰਮਦਾ ਹੈ ॥੪॥੩॥੪੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਾਟੇ = ਚੁੰਮਣ ਨਾਲ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, el Esclavo del Señor está complacido cuando logra besar los Pies de los Santos.(4-3-41)"