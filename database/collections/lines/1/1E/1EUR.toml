[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕੀ ਗਤਿ ਮਿਤਿ; ਕੋਇ ਨ ਲਾਖੈ ॥"
page = 285
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His condition and measure no one knows."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਦਸ਼ਾ ਤੇ ਅੰਦਾਜੇ ਨੂੰ ਕੋਈ ਨਹੀਂ ਜਾਣਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one knows His state and extent."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੀ (ਗਤੀ) ਪ੍ਰਾਪਤੀ ਔ ਮ੍ਰਿਯਾਦਾ ਕੋ ਕੋਈ ਲਖ ਨਹੀਂ ਸਕਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਉੱਚ-ਅਵਸਥਾ ਤੇ ਉਸ ਦੇ ਵਡੱਪਣ ਦਾ ਅੰਦਾਜ਼ਾ ਕੋਈ ਨਹੀਂ ਲਗਾ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਤਿ = ਹਾਲਤ, ਅਵਸਥਾ। ਮਿਤਿ = ਮਿਣਤੀ, (ਵਡੱਪਣ ਦਾ) ਅੰਦਾਜ਼ਾ। ਨ ਲਾਖੈ = ਨਹੀਂ ਸਮਝ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nadie puede igualar en grandeza al Sirviente de Dios,"