data = "ਜਾਤਿ ਜਾਟ ਤਾ ਕੀ ਜਗ ਕਹੈ ॥"
page = 878

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Chanbha Jat used to live here; he was known to the world as a Jat (peasant),"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਸਾਰੇ ਜਟ ਜਾਤਿ ਦਾ ਕਹਿੰਦੇ ਸਨ।"