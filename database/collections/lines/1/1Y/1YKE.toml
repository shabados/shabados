[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਦਾਤਾ ਦਾਤਾਰੁ; ਤੇਰਾ ਦਿਤਾ ਖਾਵਣਾ ॥"
page = 652
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou alone art the Giver and Do-nor, and we eat what Thou givest us."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤੂੰ ਹੀ ਸਖੀ ਅਤੇ ਦੇਣ ਵਾਲਾ ਹੈਂ, ਅਤੇ ਜੋ ਕੁਝ ਦਿੰਦਾ ਹੈਂ ਓਹੀ ਅਸੀਂ ਖਾਂਦੇ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the Giver, the Great Giver; we eat whatever You give us."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਦਾਤਿਓਂ ਕੇ ਸਿਰੋਮਣੀ ਦਾਤਾਰੁ ਹੈਂ, ਸਭ ਨੇ ਤੇਰਾ ਦਿਤਾ ਹੂਆ ਹੀ ਖਾਵਣਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਦਾਤਾਂ ਦੇਣ ਵਾਲਾ ਦਾਤਾਰ ਹੈਂ ਤੇਰਾ ਹੀ ਦਿੱਤਾ ਹੋਇਆ ਖਾਂਦੇ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres nuestro Único Dador, oh Dios, somos bendecidos con lo que nos das."