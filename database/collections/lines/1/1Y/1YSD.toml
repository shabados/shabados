[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦੀ; ਮਹਲੁ ਘਰੁ ਪਾਏ ॥"
page = 112
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by the Guru's grace, obtain His audience in her home."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਗੁਰਾਂ ਦੀ ਮਿਹਰ ਦੇ ਸਦਕਾ ਆਪਣੇ ਗ੍ਰਹਿ ਵਿੱਚ ਹੀ ਊਸ ਦੀ ਹਜੂਰੀ ਨੂੰ ਪਾ ਲੈਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "by Guru's Grace, obtains the Mansion of the Lord's Presence as her home."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਕਰ ਤਿਨੋਂ ਨੇ ਅਪਨਾ (ਮਹਲੁ) ਸਰੂਪ (ਘਰੁ) ਅੰਤਸਕਰਣ ਮੇਂ ਹੀ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਪ੍ਰਭੂ-ਚਰਨਾਂ ਵਿਚ ਟਿਕਾਣਾ ਬਣਾ ਲੈਂਦਾ ਹੈ ਪ੍ਰਭੂ-ਚਰਨਾਂ ਵਿਚ ਘਰ ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "hace del Castillo del Señor su hogar, por la Gracia del Guru."