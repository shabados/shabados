[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨੈਨਹੁ ਪੇਖੁ; ਠਾਕੁਰ ਕਾ ਰੰਗੁ ॥"
page = 281
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With thine eyes see the wondrous play of the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀਆਂ ਅੱਖਾਂ ਨਾਲ ਸੁਆਮੀ ਦਾ ਕਉਤਕ ਦੇਖ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With your eyes, see the wondrous play of your Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨੇਤ੍ਰਹੁ ਕਰ ਕੇ ਤਿਸ ਠਾਕੁਰ ਕੈ ਰੰਗ ਕੋ ਦੇਖ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅੱਖਾਂ ਨਾਲ ਅਕਾਲ ਪੁਰਖ ਦਾ (ਜਗਤ-) ਤਮਾਸ਼ਾ ਵੇਖ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੈਨਹੁ = ਅੱਖਾਂ ਨਾਲ। ਰੰਗੁ = ਤਮਾਸ਼ਾ, ਖੇਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Percibe con ojos atentos el Juego del Señor y no te distraigas con los demás,"