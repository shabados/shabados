[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਰੂਪ ਵਰਨ; ਮਨ ਮਾਹੀ ॥"
page = 223
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The one who is contained in all the shapes, colours and hearts,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਮੂਹ ਸ਼ਕਲਾਂ ਰੰਗ ਅਤੇ ਦਿਲਾਂ ਅੰਦਰ ਵਿਆਪਕ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is contained in all forms, colors and minds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ (ਰੂਪ) ਆਕਾਰ ਹੈਂ ਔਰ (ਵਰਨ) ਜੋ ਸ੍ਵੇਤ ਪੀਤਾਦਿ ਰੰਗ ਹੈਂ, ਸੋ ਸਭ (ਮਨ ਮਾਹਿ) ਮਨ ਕੇ ਬੀਚ ਕਲਪਤ, ਭਾਵ ਮਿਥਿਆ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਾਰੇ ਰੂਪਾਂ ਵਿਚ ਸਾਰੇ ਵਰਨਾਂ ਵਿੱਚ ਤੇ ਸਾਰੇ (ਜੀਵਾਂ ਦੇ) ਮਨਾਂ ਵਿਚ ਵਿਆਪਕ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Habita en Aquél que compenetra todas las formas, todos los colores, todas las mentes,"