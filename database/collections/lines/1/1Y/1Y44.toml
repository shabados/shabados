[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪੀਰ ਮੁਰੀਦਾਂ ਪਿਰਹੜੀ, ਓਹੁ ਅਕਥ ਕਹਾਣੀ ॥੫॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Likewise, indescribable is the story of the love of the Sikh and the Guru"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੀਰ ਨਾਲ ਮੁਰੀਦਾਂ ਦੀ (ਜਿਹੜੀ) ਪ੍ਰੀਤਿ ਹੈ ਓਹ ਅਕਥ ਕਹਾਣੀ ਹੈ।"