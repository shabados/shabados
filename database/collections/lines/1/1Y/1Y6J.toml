[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਕਿਹੜੀ ਹੈ ਉਹ ਅੱਖ, ਜਿਸ ਵਿਚ ਤੇਰੇ ਨੂਰ ਦੀ ਚਮਕ ਨਹੀਣ #"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਕੁਦਾਮ ਦੀਦਾ ਕਿ ਦਰ ਵੈ ਸਵਾਦਿ ਨੂਰਿ ਤੂ ਨੀਸਤ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "In fact, they are more effective in chastity than even the elixir of eternal life. (11) (6)"