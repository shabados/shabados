[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਬਾਬੇ ਤਾਰੇ ਚਾਰਿ ਚਕਿ; ਨਉ ਖੰਡਿ ਪ੍ਰਿਥਵੀ ਸਚਾ ਢੋਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Baba liberated all four directions and nine divisions of earth."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਬਾਬੇ ਨੇ ਚਾਰੇ ਦਿਸ਼ਾ ਤਾਰ ਦਿੱਤੀਆਂ, ਨੌਖੰਡ ਪ੍ਰਿਥਵੀ ਵਿਖੇ ਸੱਚ ਦਾ ਮੇਲ ਹੋ ਗਿਆ।"