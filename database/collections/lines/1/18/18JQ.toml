page = 1154
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Parlad's father raised his voice and said,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਫਰਲਾਦ ਦੇ ਪਿਓ ਨੇ ਇਹ ਗਜ ਕਿ ਕਿਹਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The father raised the club to strike down Prahlaad, saying,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਫੇਰ ਪਿਤਾ ਨੇ ਪ੍ਰਹਿਲਾਦ ਕੇ ਮਾਰਨੇ ਹੇਤ ਗੁਰਜ (ਉਠਾਈ) ਚਕੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੋ, ਪਿਉ (ਹਰਨਾਖਸ਼) ਨੇ ਪ੍ਰਹਲਾਦ ਉੱਤੇ ਗੁਰਜ ਚੁੱਕੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਜ = ਗਦਾ {ਡੰਡੇ ਵਰਗਾ ਹੀ ਇਕ ਸ਼ਸਤ੍ਰ ਜਿਸ ਦਾ ਸਿਰਾ ਬਹੁਤ ਹੀ ਮੋਟਾ ਤੇ ਭਾਰਾ ਹੁੰਦਾ ਹੈ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El padre quiso volarle la cabeza con un marro,"