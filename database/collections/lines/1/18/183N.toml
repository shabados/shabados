[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚਾ ਤੇਰਾ ਕਰਮੁ; ਸਚਾ ਨੀਸਾਣੁ ॥"
page = 463
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True is Thy grace and true Thy sign."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੀ ਹੈ ਤੇਰੀ ਰਹਿਮਤ ਅਤੇ ਸੱਚਾ ਤੇਰਾ ਚਿੰਨ੍ਹ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True is Your Mercy, True is Your Insignia."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੇਰਾ, ਭਾਵ ਤੇਰੇ ਅਰਥ ਜੋ ਨਿਸਕਾਮ ਕਰਮ ਹੈ, ਸੋ ਭੀ ਸਤ੍ਯ ਹੈ, ਵਾ ਤੇਰਾ ਕੀਆ ਜੋ ਇਹ ਪ੍ਰਪੰਚ ਰੂਪ ਕਰਮ ਹੈ, ਸੋ ਭੀ ਸਤ੍ਯ ਹੈ। ਔਰ ਤੇਰਾ (ਨੀਸਾਣੁ) ਪ੍ਰਗਟ ਹੋਣਾ, ਭਾਵ ਭਗਤੋਂ ਕੇ ਵਾਸਤੇ ਅਵਤਾਰ ਧਾਰਨਾ ਭੀ ਸਚਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਬਖ਼ਸ਼ਸ਼ ਸਦਾ ਲਈ ਥਿਰ ਹੈ ਤੇ ਤੇਰੀਆਂ ਬਖ਼ਸ਼ਸ਼ਾਂ ਦਾ ਨਿਸ਼ਾਨ ਭੀ (ਭਾਵ, ਇਹ ਬੇਅੰਤ ਪਦਾਰਥ ਜੋ ਤੂੰ ਜੀਆਂ ਨੂੰ ਦੇ ਰਿਹਾ ਹੈਂ) ਸਦਾ ਵਾਸਤੇ ਕਾਇਮ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੀਸਾਣੁ = ਨਿਸ਼ਾਨ, ਜਲਵਾ, ਜ਼ਹੂਰ। ਕਰਮੁ = ਬਖ਼ਸ਼ਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones de millones Te llaman Luz y Verdad;"