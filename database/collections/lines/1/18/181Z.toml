[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਬਦੁ ਦੀਪਕੁ ਵਰਤੈ. ਤਿਹੁ ਲੋਇ ॥"
page = 664
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The light of the Name lamp is pervading the three worlds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਰੂਪੀ ਦੀਵੇ ਦੀ ਰੋਸ਼ਨੀ ਤਿੰਨਾ ਲੋਕਾਂ ਅੰਦਰ ਵਿਆਪਕ ਹੋ ਰਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Word of the Shabad is a lamp, illuminating the three worlds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ (ਦੀਪਕੁ) ਪਰਕਾਸ ਰੂਪ (ਸਬਦੁ) ਬ੍ਰਹਮ ਤ੍ਰਿਲੋਕੀ ਮੇਂ ਵਰਤ ਰਹਾ ਹੈ, ਭਾਵ ਸੇ ਸਰਬ ਬਿਆਪੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰੂ ਦਾ ਸ਼ਬਦ (ਮਾਨੋ) ਦੀਵਾ (ਹੈ, ਜੋ) ਸਾਰੇ ਸੰਸਾਰ ਵਿਚ ਚਾਨਣ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੀਪਕੁ = ਦੀਵਾ। ਵਰਤੈ = ਕੰਮ ਕਰਦਾ ਹੈ, ਚਾਨਣ ਦੇਂਦਾ ਹੈ। ਤਿਹੁ ਲੋਇ = ਤਿੰਨਾਂ ਲੋਕਾਂ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Luz de la Palabra del Shabd compenetra las tres Gunas,"