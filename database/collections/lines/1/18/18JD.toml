[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ, ਹਉਮੈ ਵਿਚਹੁ ਮਾਰੀ ॥"
page = 879
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then was my self-conceit dispelled, from within me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਮੇਰੀ ਸਵੈ-ਹੰਗਤਾ ਮੇਰੇ ਅੰਦਰੋਂ ਦੂਰ ਹੋ ਗਈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "egotism was eradicated from within me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਨੇ ਮਨ ਵਿਚੋਂ ਹੰਤਾ ਮਾਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਹੀ ਜੀਵ ਨੇ ਆਪਣੇ ਅੰਦਰੋਂ ਹਉਮੈ ਦੂਰ ਕੀਤੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ = ਤਦੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el egoísmo fue erradicado de mi ser;"