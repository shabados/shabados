[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਰਠਿ ਮਹਲਾ ੩ ॥"
page = 601
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Imbued with the name and inebriated with supreme bliss night and day, they sing God's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਨਾਲ ਰੰਗੇ ਅਤੇ ਪਰਮ ਅਨੰਦ ਨਾਲ ਮਤਵਾਲੇ ਹੋਏ ਹੋਏ ਰੈਣ ਦਿਹੁੰ ਉਹ ਹਰੀ ਦਾ ਜੱਸ ਗਾਇਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sorat'h, Third Mehl:"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sorath, Mejl Guru Amar Das, Tercer Canal Divino."