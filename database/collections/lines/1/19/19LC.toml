[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਨਾਮ; ਜੋ ਕਰਹਿ ਬੀਚਾਰ ॥"
page = 281
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who meditate on Lord's Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਾਹਿਬ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who dwell upon the Lord's Name,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੁਰਸ ਰਾਮ ਨਾਮ ਕਾ ਵੀਚਾਰ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਅਕਾਲ ਪੁਰਖ ਦੇ ਨਾਮ ਦਾ ਧਿਆਨ ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਨੀ = ਗ਼ਨੀ, ਧਨਾਢ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los que viven mediante el nombre de Dios,"