[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਿਛੈ ਲਗਿ ਚਲੀ ਮਾਇਆ ॥"
page = 625
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The wealth, follows in my foot-steps"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੌਲਤ, ਮੇਰੇ ਮਗਰ ਟੁਰੀ ਆਉਂਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The wealth of Maya follows in my footsteps,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਹਮਾਰੇ ਪੀਛੇ ਸਭ ਮਾਇਆ ਲਾਗ ਚਲੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੂੰ ਮਾਇਆ ਦੀ ਲਾਲਸਾ ਨਹੀਂ ਰਹਿ ਜਾਂਦੀ) ਮਾਇਆ ਉਸ ਦੇ ਪਿੱਛੇ ਪਿੱਛੇ ਤੁਰੀ ਫਿਰਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "para mí el Tanque de Néctar y las Riquezas del Señor llueven sobre mí."