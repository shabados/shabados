data = "ਮਨੋ ਬਚ ਕਰਮੰ ਦੁਰਗਾ ਜਾਪ ਜਾਪੰ ॥੭੨੪॥"
page = 275

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He returned to his home alongwith Sita repeating the name of Sruga with mind, speech and action.724."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮਨ, ਬਚਨ ਅਤੇ ਕਰਮ ਕਰਕੇ ਦੁਰਗਾ ਦਾ ਜਾਪ ਜਪਣ ਲੱਗਾ ॥੭੨੪॥"