data = "ਕਿ ਨਾਜ਼ਮ ਬੁ ਬਰਖ਼ਾਸਤ ਦਰਵਾਜ਼ਹ ਬਸਤ ॥੨੦॥"
page = 1400

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And the organisers departed closing the doors.(20)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਬੰਧ ਕਰਨ ਵਾਲੇ ਉਠ ਗਏ ਅਤੇ ਦਰਵਾਜ਼ੇ ਬੰਦ ਹੋ ਗਏ ॥੨੦॥"