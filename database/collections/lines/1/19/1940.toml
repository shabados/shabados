[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਨਸਾ ਧਾਰੁ ਅਥਾਹੁ ਹੈ; ਤੀਰਥੁ ਉਪਲੁ ਸੇਵਕ ਸਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Manasadhar is deep and Tirath Uppal is also servant."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮਨਸਾ ਧਾਰ ਡੂੰਘਾ ਹੈ, ਤੀਰਥ, ਉਪਲ ਸਾਰਾ (ਪਰਵਾਰ) ਸੇਵਕ ਹੈ।"