[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਬਹੂ; ਹੋਇ ਪੰਡਿਤੁ. ਕਰੇ ਬਖੵਾਨੁ ॥"
page = 277
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As a scholar, sometimes, man delivers lecturers."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਦੇ ਬੰਦਾ ਬਤੌਰ ਵਿੱਦਵਾਨ ਦੇ ਲੈਕਚਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sometimes, as scholars, they deliver lectures."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਬੀ ਏਹ ਜੀਵ ਪੰਡਿਤ ਹੋ ਕਰ ਸਾਸਤ੍ਰੋਂ ਕੋ ਉਚਾਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਰਬ-ਵਿਆਪੀ ਪ੍ਰਭੂ) ਕਦੇ ਪੰਡਤ ਬਣ ਕੇ (ਦੂਜਿਆਂ ਨੂੰ) ਉਪਦੇਸ਼ ਕਰ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਖ੍ਯ੍ਯਾਨੁ = ਵਖਿਆਨ, ਉਪਦੇਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunas veces, como erudito, el hombre pronuncia largos discursos"