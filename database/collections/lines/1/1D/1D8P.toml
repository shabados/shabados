[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਅਤਿ ਅਪਜਸ ਕੀ ਕਥਾ; ਜਗਤ ਮੋ ਕੌ ਨਿਤਿ ਕਹਿ ਹੈ ॥੨੫॥"
page = 834

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And my story will go around the whole world.(25)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨਾਲ) ਜਗਤ ਵਿਚ ਨਿੱਤ ਮੇਰੇ ਅਪਜਸ ਦੀ ਕਥਾ ਚਲ ਪਏਗੀ ॥੨੫॥"