[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧੇਨੁ. ਦੁਧੈ ਤੇ ਬਾਹਰੀ; ਕਿਤੈ. ਨ ਆਵੈ ਕਾਮ ॥"
page = 133
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "A cow without milk serves no purpose."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੁੱਧ ਤੋਂ ਬਿਨਾਂ ਗਾਂ ਕਿਸੇ ਕੰਮ ਨਹੀਂ ਆਉਂਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without milk, a cow serves no purpose."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਗਉ ਦੁਧ ਸੇ ਬਿਨਾ ਕਿਸੀ ਕਾਮ ਨਹੀਂ ਆਵਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਵੇਂ) ਦੁੱਧ ਤੋਂ ਸੱਖਣੀ ਗਾਂ ਕਿਸੇ ਕੰਮ ਨਹੀਂ ਆਉਂਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧੇਨੁ = ਗਾਂ। ਬਾਹਰੀ = ਬਿਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Como la vaca que no da leche y no sirve de nada."