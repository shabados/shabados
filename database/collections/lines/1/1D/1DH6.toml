[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ ਓਹੁ; ਅਨਿਕ ਪ੍ਰਸਾਦ ਕਰਾਵੈ ॥"
page = 875
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If he gives many feasts to the needy,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਉਹ ਲੋੜਵੰਦਾਂ ਨੂੰ ਬਹੁਤੇ ਭੋਜਨ ਛਕਾਉਂਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Someone may give countless feasts,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਵਹੁ ਅਨੇਕ ਪ੍ਰਕਾਰ ਕੇ ਭੋਜਨ ਬ੍ਰਹਮਨ ਸੰਤੋਂ ਕੋ (ਕਰਾਵੈ) ਖੁਲਾਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋਈ ਮਨੁੱਖ ਠਾਕਰਾਂ ਨੂੰ ਕਈ ਤਰ੍ਹਾਂ ਦੇ ਭੋਗ ਲਵਾਵੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਸਾਦ = ਭੋਜਨ, ਠਾਕਰਾਂ ਨੂੰ ਭੋਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si por caridad distribuye riquezas abundantes,"