data = "ਵਜ਼ਾ ਸ਼ਾਹਿ ਬਾਸ਼ਦ ਜਹਾ ਅਰਜ਼ਮੰਦ ॥੫੦॥"
page = 1399

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘He is revered as the saviour king.’(50)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਬਾਦਸ਼ਾਹ ਬਣਨ ਨਾਲ ਸੰਸਾਰ ਸਤਿਕਾਰ ਹਾਸਲ ਕਰੇਗਾ ॥੫੦॥"