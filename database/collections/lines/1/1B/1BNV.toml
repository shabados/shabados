[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਨੁ ਇਕ ਧੀਰਜ ਸੁਨ ਬੀਰ ਬਰ; ਸੁ ਅਉਰ ਕਵਣ ਰਣਿ ਰਚਿ ਹੈ ॥੧੮੬॥"
page = 694

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And named Ninda (slander), the day when he will begin his fighting, on that day, who will confront him except ENDURANCE.186."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੁਣੋ, ਬਿਨਾ ਇਕ ਧੀਰਜ ਦੇ ਹੋਰ ਕੌਣ ਯੁੱਧ ਮਚਾਏਗਾ ॥੧੮੬॥"