[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਿਆਨੀਆ ਕਾ ਧਨੁ. ਨਾਮੁ ਹੈ; ਸਦ ਹੀ ਰਹੈ ਸਮਾਇ ॥"
page = 1282
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The wealth of the God-conscious being is the Lord's Name and in it he ever remains merged."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਨੂੰ ਜਾਣਨ ਵਾਲੇ ਦੀ ਦੌਲਤ ਪ੍ਰੇਮਸ਼ਰ ਦਾ ਨਾਮ ਹੈ ਅਤੇ ਉਹ ਸਦੀਵ ਹੀ ਇਸ ਅੰਦਰ ਲੀਨ ਹੋਇਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Naam is the wealth of the spiritually wise. It is permeating and pervading forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗਿਆਨੀਓਂ ਕਾ ਧਨ ਨਾਮ ਹੀ ਹੈ ਔਰ ਵਹੁ ਸਦੀਵ ਤਿਸੀ ਮੇਂ ਸਮਾਇ ਰਹੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਨਾਲ ਡੂੰਘੀ ਸਾਂਝ ਰੱਖਣ ਵਾਲੇ ਬੰਦਿਆਂ ਲਈ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਹੀ ਧਨ ਹੈ ਜੋ ਸਦਾ ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਿਆਨ = ਪਰਮਾਤਮਾ ਨਾਲ ਡੂੰਘੀ ਸਾਂਝ ਰੱਖਣ ਵਾਲਾ ਮਨੁੱਖ"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero el Naam es la Riqueza del sabio espiritual, y lo compenetra todo, prevalece por siempre."