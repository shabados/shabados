[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਹਰਿ ਭਜਨੁ; ਸਾਧ ਕੈ ਸੰਗਿ ॥"
page = 891
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "So, contemplate thou thy God in the society of saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਲਈ ਤੂੰ ਆਪਣੇ ਵਾਹਿਗੁਰੂ ਦਾ ਸਤਿਸੰਗਤ ਅੰਦਰ ਚਿੰਤਨ ਕਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So vibrate, and meditate on that Lord in the Saadh Sangat, the Company of the Holy;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਹਰੀ ਕਾ ਭਜਨ ਸੰਤੋਂ ਕੇ ਸੰਗ ਦੁਆਰਾ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੀ ਉਹ ਭਗਤੀ ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਵਿਚ (ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧ ਕੈ ਸੰਗਿ = ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno puede alabar al Señor en la Saad Sangat, la Sociedad de los Santos,"