[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਜੀ ਬਾਤ; ਨ ਧਰਈ ਕਾਨਾ ॥"
page = 340
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "lends not his ears to anything else."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਹੋਰਸ ਗੱਲ ਵਲ ਆਪਣਾ ਕੰਨ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "does not listen to anything else."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪੁਰਸ਼ ਦ੍ਵੈਤ ਕੀ ਬਾਤ ਕਾਨ ਮੇਂ ਨਹੀਂ ਧਾਰਤੇ ਹੈਂ, ਭਾਵ ਸੇ ਸਰਧਾ ਕਰ ਨਹੀਂ ਸੁਣਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ (ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਤੋਂ ਬਿਨਾ) ਕੋਈ ਹੋਰ ਗੱਲ ਖਿੱਚ ਨਹੀਂ ਪਾਂਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਧਰਈ ਕਾਨਾ = ਕੰਨ ਨਹੀਂ ਧਰਦਾ, ਗਹੁ ਨਾਲ ਨਹੀਂ ਸੁਣਦਾ, ਖਿੱਚ ਨਹੀਂ ਪੈਂਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no escucha nada más."