[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੇ ਚਿਤ; ਚਰਣ ਕਮਲ ਅਰਾਧਿ ॥"
page = 501
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, ponder over the Lord's lotus feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ! ਤੂੰ ਸੁਆਮੀ ਦੇ ਕੰਵਲ ਪੈਂਰਾਂ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my consciousness, contemplate and adore the Lotus Feet of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰੇ ਚਿਤ! ਤੂੰ  ਪ੍ਰਭੂ ਕੇ ਚਰਨਾਰਬਿੰਦ ਕਾ ਅਰਾਧਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਪਰਮਾਤਮਾ ਦੇ ਸੋਹਣੇ ਕੋਮਲ ਚਰਨਾਂ ਦੀ ਆਰਾਧਨਾ ਕਰਿਆ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਰਣ ਕਮਲ = ਸੋਹਣੇ ਕੋਮਲ ਚਰਨ (ਕੌਲ ਫੁੱਲ ਵਰਗੇ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, alaba los Pies de Loto de los Santos para que obtengas Paz"