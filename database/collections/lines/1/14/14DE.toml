data = "(ਅਗੋਂ ਦੇਵਤਿਆਂ ਨੇ ਕਿਹਾ) \"ਹੇ ਦੈਂਤਾਂ ਨੂੰ ਨਾਸ਼ ਕਰਨ ਵਾਲੇ!"