data = "ਅਬ ਕਛੁ ਕਰੋ ਮੰਤ੍ਰ ਅਸੁਰਾਰਾ ॥"
page = 192

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the gods went to meet Vishnu and said, “ O destroyer of demons  take some steps now.”"

