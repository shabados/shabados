[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੂੜ ਅਹੀਰਾਂ ਪਿੰਡੁ ਹੈ; ਪੰਜ ਦੂਤ ਵਸਨਿ ਬੁਰਿਆਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Falsehood is-the village of robbers where reside the five evil legates."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਲੁਟੇਰਿਆਂ ਦਾ ਪਿੰਡ ਝੂਠਾ ਹੈ, (ਕਿਉਂ ਜੋ) ਪੰਜ ਦੂਤ ਬੁਰੇ ਦੇ ਕਰਣਹਾਰੇ ਉਥੇ ਨਿਵਾਸ ਰਖਦੇ ਹਨ।"