[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੀਰਤਿ ਪ੍ਰਭ ਕੀ; ਗਾਉ ਮੇਰੀ ਰਸਨਾਂ ॥"
page = 1298
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my tongue, sing thou the praise of thy Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜੀਭ੍ਹਾ, ਤੂੰ ਆਪਣੇ ਸਾਈਂ ਦਾ ਜੱਸ ਗਾਇਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sing the Praises of God, O my tongue."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਰਸਨਾ! ਤੂੰ ਪ੍ਰਭੂ ਕੀ ਕੀਰਤੀ ਕੋ ਗਾਇਨ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜੀਭ! ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੇ ਗੀਤ ਗਾਇਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀਰਤਿ = ਸਿਫ਼ਤ-ਸਾਲਾਹ। ਗਾਉ = ਗਾਇਆ ਕਰ। ਰਸਨਾਂ = ਹੇ ਜੀਭ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canta las Alabanzas de Dios, oh mi lengua."