[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨੈਨੀ ਦੇਖਉ ਗੁਰ ਦਰਸਨੋ; ਗੁਰ ਚਰਣੀ ਮਥਾ ॥"
page = 1101
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With my eyes I see the Guru's vision and place I my brow one the Guru's feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀਆਂ ਅੱਖਾਂ ਨਾਲ ਮੈਂ ਗੁਰਾਂ ਦਾ ਦੀਦਾਰ ਵੇਖਦਾ ਹਾਂ ਅਤੇ ਗੁਰਾਂ ਦੇ ਪੈਰਾਂ ਉਤ ਮੈਂ ਆਪਣਾ ਮਸਤਕ ਰਖਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With my eyes, I gaze upon the Blessed Vision of the Guru's Darshan; I touch my forehead to the Guru's feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਨੇਤ੍ਰੀ ਗੁਰਾਂ ਕਾ ਦਰਸਨ ਦੇਖਤਾ ਹਾਂ ਔ ਗੁਰੋਂ ਕੇ ਚਰਨੋਂ ਪਰ ਸਿਰ ਰਖਤਾ ਹਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਅੱਖਾਂ ਨਾਲ ਗੁਰੂ ਦਾ ਦਰਸਨ ਕਰਦਾ ਹਾਂ, ਆਪਣਾ ਮੱਥਾ ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਵਿਚ ਧਰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੈਨੀ = ਨੈਨੀਂ, ਅੱਖਾਂ ਨਾਲ। ਦੇਖਉ = ਦੇਖਉਂ, ਮੈਂ ਵੇਖਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Busco ver a mi Guru con mis ojos y postrar mi cabeza a Sus Pies,"