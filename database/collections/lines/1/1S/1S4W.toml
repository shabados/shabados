[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਈਅਨੑਿ ਸਭਿ ਨਿਧਾਨ; ਸਾਹਿਬਿ ਤੁਠਿਆ ॥੧੨॥"
page = 521
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Lord's pleasure, all the treasures are obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੀ ਪ੍ਰਸੰਨਤਾ ਰਾਹੀਂ ਸਾਰੇ ਖਜ਼ਾਨੇ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All treasures are obtained, when the Lord and Master is pleased. ||12||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਕੇ ਪ੍ਰਸੰਨ ਹੋਨੇ ਸੇ ਸਭ ਖਜਾਨੇ ਮਿਲ ਜਾਤੇ ਹੈਂ॥੧੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ-ਮਾਲਕ ਦੇ ਪ੍ਰਸੰਨ ਹੋਇਆਂ (ਮਾਨੋ) ਸਾਰੇ ਖ਼ਜ਼ਾਨੇ ਪਾ ਲਈਦੇ ਹਨ ॥੧੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਹਿਬਿ = (ਅਧਿਕਰਣ ਕਾਰਕ, ਇਕ-ਵਚਨ)। ਸਾਹਿਬਿ ਤੁਠਿਆ = (ਪੂਰਬ ਪੂਰਨ ਕਾਰਦੰਤਕ) ਜੇ ਸਾਹਿਬ ਤ੍ਰੁੱਠ ਪਏ ॥੧੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él consigue todos los tesoros, y el Mismo Señor lo bendice con Su Gracia. (12)"