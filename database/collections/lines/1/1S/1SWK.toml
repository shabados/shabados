[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਕਲ ਨਾਮ ਸ੍ਰੀ ਬਾਨ ਕੇ; ਚੀਨ ਚਤੁਰ, ਚਿਤਿ ਲੇਹੁ ॥੨੪੩॥"
page = 728

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying “Angad-Pitr” (Bali) in the beginning and then adding the word “Ari”, all the names of Baan are comprehended .243."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਸਾਰੇ ਨਾਮ ਬਾਣ ਦੇ ਹਨ। ਚਤੁਰ ਪੁਰਸ਼ੋ! ਵਿਚਾਰ ਲਵੋ ॥੨੪੩॥"