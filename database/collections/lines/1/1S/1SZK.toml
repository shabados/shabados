[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦਿਨੁ; ਰਾਮ ਕੇ ਗੁਣ ਕਹੀਐ ॥"
page = 1206
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day, utter thou thy Lord's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਤੇ ਦਿਨ ਤੂੰ ਆਪਣੇ ਪ੍ਰਭੂ ਦਾ ਜੱਸ ਉਚਾਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, utter the Glorious Praises of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਰਾਤ੍ਰ ਦਿਨੇ ਰਾਮ ਕੇ ਗੁਣੋਂ ਕੋ ਉਚਾਰਨ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਓ, ਅਸੀਂ ਹਰ ਵੇਲੇ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦੇ ਰਹੀਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਦਿਨੁ = {अनुदिनां} ਹਰ ਰੋਜ਼। ਕਹੀਐ = ਆਓ, ਭਾਈ! ਆਖਿਆ ਕਰੀਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Recita siempre las Alabanzas de tu Señor, lograrás la Paz,"