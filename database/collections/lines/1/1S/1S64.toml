[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰਿ ਗਵਾਈ; ਵਿਚਹੁ ਜੂਠਿ ਭਰਾਂਤਿ ॥"
page = 1173
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "of him, the True Guru drives out sin and doubt."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਅੰਦਰੋ ਸੱਚੇ ਗੁਰੂ ਜੀ ਪਾਪ ਅਤੇ ਭਰਮ ਕੱਢ ਦਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Guru drives out sin and doubt from within."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਨੇ ਤਿਨ ਕੇ ਮਨ ਮੇਂ ਸੇ ਭ੍ਰਾਂਤੀ ਰੂਪ ਜੂਠ ਗਵਾਇ ਦਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੇ ਉਹਨਾਂ ਦੇ ਅੰਦਰੋਂ (ਮਾਇਆ ਦੀ ਖ਼ਾਤਰ) ਭਟਕਣਾ ਦੀ ਮੈਲ ਦੂਰ ਕਰ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰਿ = ਗੁਰੂ ਨੇ। ਜੂਠਿ ਭਰਾਂਤਿ = ਭਟਕਣਾ ਦੀ ਜੂਠ, ਭਟਕਣਾ ਦੀ ਮੈਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "uno es liberado de sus ilusiones, vicios y dudas."