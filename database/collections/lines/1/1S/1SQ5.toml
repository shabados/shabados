[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਗੁਰਮੁਖਿ ਚਖੈ ਸਾਦੁ; ਸਾ ਤ੍ਰਿਪਤਾਵਣੀ ॥"
page = 647
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "She, who, by Guru's grace, tastes Lord's relish, is satiated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੀ ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਸੁਆਮੀ ਦੇ ਸੁਆਦ ਨੂੰ ਮਾਣਦੀ ਹੈ, ਉਹ ਰੱਜ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That Gurmukh tastes the the sublime taste of the Lord, and is satisfied."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਹਰੀ ਕੇ ਅਨੰਦ ਕੋ ਲੇਤੀ ਹੈ, ਸੋਈ ਔਰ ਰਸੋਂ ਸੇ ਤ੍ਰਿਪਤ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਤਿਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੋ ਕੇ ਸੁਆਦ ਚੱਖਦੀ ਹੈ, ਉਹ ਰੱਜ ਜਾਂਦੀ ਹੈ (ਭਾਵ, ਉਹ ਜੀਭ ਹੋਰ ਰਸਾਂ ਵੱਲ ਨਹੀਂ ਦੌੜਦੀ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "complace al Señor. Aquél que por la Gracia del Guru participa en Dios, es liberado."