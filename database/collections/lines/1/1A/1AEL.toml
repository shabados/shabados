[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਾਚ ਸੈ ਖਟ ਸੈ ਲਗੇ; ਤਹਿ ਬੀਚ ਆਨ ਗਿਰੰਤ ॥"
page = 142

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Five hundred and six hundred arms’ length began to fall there within the fire-pit"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪੰਜ ਸੌ, ਛੇ ਸੌ (ਹੱਥਾਂ) ਜਿੰਨੇ ਉਸ (ਕੁੰਡ) ਵਿਚ ਆ ਕੇ ਡਿਗਦੇ ਸਨ।"