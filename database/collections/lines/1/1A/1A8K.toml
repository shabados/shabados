[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਜਨਮ; ਸਾਖ ਕਰਿ ਉਪਾਇਆ ॥"
page = 176
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In several births thou wert produced as a branch (vegetation)."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈਆਂ ਜਨਮਾਂ ਅੰਦਰ ਤੂੰ ਟਹਿਣੀ (ਬਨਸਪਤੀ) ਕਰ ਕੇ ਪੈਦਾ ਕੀਤਾ ਗਿਆ ਸੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "in so many incarnations, you developed branches and leaves;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਈ ਜਨਮ ਖੇਤੀ ਰੂਪ ਹੋ ਕਰ ਉਪਾਇਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਈ ਜਨਮਾਂ ਵਿਚ ਤੈਨੂੰ (ਕਿਸਮ ਕਿਸਮ ਦਾ) ਰੁੱਖ ਬਣਾ ਕੇ ਪੈਦਾ ਕੀਤਾ ਗਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਖ = ਸ਼ਾਖਾ, ਬਨਸਪਤੀ। ਕਰਿ = ਬਣਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y tantas veces uno ha tomado forma en la matriz."