[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧੂ ਧੂਰਿ; ਮੁਖਿ ਮਸਤਕਿ ਲਾਈ ॥"
page = 744
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The dust of the saints' feet, I apply to my face and forehead,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤਾਂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ਮੈਂ ਆਪਣੇ ਚਿਹਰੇ ਅਤੇ ਮੱਥੇ ਨੂੰ ਲਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I apply the dust of the feet of the Holy to my face and forehead."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਸੰਤੋਂ ਕੀ ਚਰਨ ਧੂੜ ਜੋ ਮੁਖ ਰੂਪ ਹੈ ਵਹੁ ਮਸਤਕ ਪਰ ਲਗਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ (ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਨੇ ਆਪਣੇ) ਮੂੰਹ ਉਤੇ ਮੱਥੇ ਉਤੇ ਲਾ ਲਈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧੂਰਿ = ਪੈਰਾਂ ਦੀ ਖ਼ਾਕ। ਮੁਖਿ = ਮੂੰਹ ਉਤੇ। ਮਸਤਕਿ = ਮੱਥੇ ਉਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno aplica el Polvo de los Pies de los Santos en su cara y en su frente,"