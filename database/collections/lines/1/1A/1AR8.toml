[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਬੇਅੰਤੁ; ਅਤਿ ਮੂਚੋ ਮੂਚਾ ॥"
page = 131
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art infinite and the supremely grandest of the grand."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਅਨੰਤ ਹੈ ਅਤੇ ਵਡਿਆਂ ਵਿਚੋਂ ਪਰਮ ਵੱਡਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are Infinite, You are Everything!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਤੂੰ ਬੇਅੰਤ ਹੈਂ ਔਰ ਅਤ੍ਯੰਤ ਬਹੁਤ ਸੇ ਬਹੁਤ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਆਤਮਕ ਉੱਚਤਾ ਵਿਚ) ਤੂੰ ਸਭ ਤੋਂ ਉੱਚਾ ਹੈਂ, ਤੇਰੇ ਗੁਣਾਂ ਦਾ ਅੰਤ ਨਹੀਂ ਪੈ ਸਕਦਾ, ਤੂੰ ਬੇਅੰਤ ਵੱਡੀ ਹਸਤੀ ਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres Infinito, mucho más que más."