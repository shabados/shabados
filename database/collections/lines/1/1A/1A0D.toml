[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਲਿਲਾਰਿ ਲਿਖਿਆ ਸੋਇ ॥"
page = 144
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, what is written on the forehead,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਜਿਹੜਾ ਮੱਥੇ ਉਤੇ ਲਿਖਿਆ ਹੋਇਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, that destiny which is pre-ordained and written on one's forehead"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਕੇ ਜੋ ਤੈਂ (ਲਿਲਾਰਿ) ਮਸਤਕ ਮੇਂ ਲਿਖਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਜੀਵ ਦੇ) ਮੱਥੇ ਉਤੇ (ਜੋ ਕੁਝ ਕਰਤਾਰ ਵਲੋਂ) ਲਿਖਿਆ ਗਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਿਲਾਰਿ = ਲਿਲਾਟ, ਮੱਥੇ ਉਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, eso que estaba escrito en tu destino por Dios,"