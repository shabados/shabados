[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੂਲਿ; ਨ ਮਨਹੁ ਵਿਸਾਰੀਐ ॥ ਰਹਾਉ ॥"
page = 132
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Never forget Him in thy mind. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਦਾਚਿਤ ਭੀ ਤੂੰ ਉਸ ਨੂੰ ਆਪਣੇ ਚਿਤੋਂ ਨਾਂ ਭੁਲਾ! ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Never forget Him from your mind. ||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਦਾਚਿਤ ਮਨ ਸੇ ਨ ਵਿਸਾਰੀਏ॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਆਪਣੇ ਮਨ ਤੋਂ ਭੁਲਾਣਾ ਨਹੀਂ ਚਾਹੀਦਾ।ਰਹਾਉ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂਲਿ ਨ = ਕਦੇ ਨਾਹ।ਰਹਾਉ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y no Lo olvides nunca. (Pausa)"