[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਦਰਿ ਕੋਟ; ਛਜੇ ਹਟਨਾਲੇ ॥"
page = 1033
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within the fortress are balconies and bazars."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿਲ੍ਹੇ ਦੇ ਅੰਦਰ ਬਾਲੇਖਾਨੇ ਅਤੇ ਬਾਜ਼ਾਰ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Within the fortress are balconies and bazaars."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਕੋਟਿ ਸਰੀਰ ਮੇਂ ਗੋਲਕ ਛੇਜੈ ਹੈ ਔ ਇੰਦ੍ਰੇ ਹਟਾਂ ਕੇ ਬਾਜਾਰ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ (ਸਰੀਰ-) ਕਿਲ੍ਹੇ ਦੇ ਅੰਦਰ ਹੀ, ਮਾਨੋ, ਛੱਜੇ ਤੇ ਬਾਜ਼ਾਰ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਟਨਾਲੇ = ਬਾਜ਼ਾਰ (ਜਿਥੇ ਨਾਲੋ ਨਾਲ ਹੱਟ ਹਨ)। ਛਜੇ = ਛੱਜੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Dios Mismo otorga lo necesario para la mente ahí"