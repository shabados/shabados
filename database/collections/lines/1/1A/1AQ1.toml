[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਹੁ ਚਿੰਤਾ; ਪਿੜ ਚਾਲੈ ਹਾਰੀ ॥"
page = 222
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the mortal loses the game and departs."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਘਨੇਰੇ iਫ਼ਕਰ ਅੰਦਰ ਪ੍ਰਾਣੀ ਖੇਡ ਹਾਰ ਦਿੰਦਾ ਹੈ ਤੇ ਟੁਰ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "in the anxious affairs of all these, people lose the game and depart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਨ ਪਦਾਰਥੋਂ ਕੀ ਜੋ ਬਹੁਤ ਚਿਤਵਨੀ ਕਰਤਾ ਹੈ, ਸੋ ਜੀਵ ਇਸ ਮਾਨੁਖ ਜਨਮ ਰੂਪੀ (ਪਿੜ) ਬਾਜੀ ਕੋ ਹਾਰ ਕਰ ਚਲਾ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪੁੱਤਰ ਇਸਤ੍ਰੀ ਆਦਿਕ ਦੇ ਮੋਹ ਦੇ ਕਾਰਨ) ਮਨ ਨੂੰ ਬਹੁਤ ਚਿੰਤਾ ਵਿਆਪਦੀ ਹੈ, ਤੇ, ਆਖ਼ਿਰ ਇਸ ਜਗਤ-ਅਖਾੜੇ ਤੋਂ ਮਨੁੱਖ ਬਾਜ਼ੀ ਹਾਰ ਕੇ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਿੜ = ਕੁਸ਼ਤੀ ਦਾ ਅਖਾੜਾ। ਹਾਰੀ = ਹਾਰਿ, ਹਾਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "haciendo esto , uno pierde la batalla de la vida."