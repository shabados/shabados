data = "ਫਿਰੇ ਰੁੰਡ ਮੁੰਡੰ ਤਣੰ ਤਛ ਤੀਰੰ ॥੧੫॥੧੮੩॥"
page = 143

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The trunks and heads, and bodies pierced by arrows were roaming.15.183."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ ਧੜ, ਕਿਤੇ ਸਿਰ ਅਤੇ ਕਿਤੇ ਤੀਰਾਂ ਨਾਲ ਪੱਛੇ ਸ਼ਰੀਰ ਫਿਰਦੇ ਸਨ ॥੧੫॥੧੮੩॥"