[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਛਿ ਕਛਿ ਕਾਛ ਕਛੇ ਕਛਨੀ; ਚੜਿ ਕੋਪ ਭਰੇ ਨਿਜਕਾਏ ॥"
page = 685

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And in their fury began to chop the fighters dreadful war"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਲੰਗੋਟਾਂ ਨੂੰ ਕਸ ਕਸ ਕੇ ਅਤੇ ਲਕ ਨੂੰ ਕਸ ਕਸ ਕੇ ਕ੍ਰੋਧ ਨਾਲ ਭਰੇ ਹੋਏ ਨੇੜੇ ਢੁਕ ਰਹੇ ਹਨ।"