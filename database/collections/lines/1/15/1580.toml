[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਮਲ ਉਦਕੁ; ਗੋਵਿੰਦ ਕਾ ਨਾਮ ॥"
page = 198
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Immaculate is the water of Lord's name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤ੍ਰ ਹੈ ਪਾਣੀ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The water of the Name of the Lord of the Universe is immaculate and pure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਸੰਗ ਰੂਪੀ ਰਾਮਸਰ ਮੇਂ ਗੋਬਿੰਦ ਕਾ ਨਾਮ ਨਿਰਮਲ (ਉਦਕੁ) ਜਲ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਪਵਿਤ੍ਰ ਜਲ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਦਕੁ = ਪਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Puro e Inmaculado, como el agua cristalina,"