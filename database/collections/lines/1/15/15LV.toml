[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਮ ਵਡ ਪੁਰਖ. ਵਡ ਅਗਮ ਅਗੋਚਰ; ਤੁਮ ਆਪੇ ਆਪਿ ਅਪਾਕੀ ॥"
page = 668
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art the great Lord, highly unapproachable and incomprehensible. Thou Thyself hast created the universe from Thine ownself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਵਿਸ਼ਾਲ ਪ੍ਰਭੂ, ਬਹੁਤ ਅਪਹੁੰਚ ਅਤੇ ਅਗਾਧ ਹੈਂ। ਤੂੰ ਖੁਦ ਹੀ ਆਪਣੇ ਆਪ ਤੋਂ ਸੰਸਾਰ ਰਚਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the Greatest Being, absolutely unapproachable and unfathomable; You created the Universe from Your Own Being."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੁਮ ਵਡਿਓਂ ਤੇ ਵਡੇ ਪੁਰਖ ਮਨ ਬਾਣੀ ਤੇ ਅਗੰਮ ਹੋ ਔਰ ਇੰਦ੍ਰਿਓਂ ਤੇ ਅਗੋਚਰ ਹੋ। ਤਾਂ ਤੇ ਤੁਮ ਨੇ ਅਪਨਾ ਆਪ ਤੇ ਅਪਨਾ ਰੂਪ ਇਹ ਜਗਤ ਕੀਆ ਹੈ, ਤਾਂ ਤੇ ਸਭ ਤੇਰਾ ਹੀ ਸਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਸਭ ਤੋਂ ਵੱਡਾ ਹੈਂ, ਤੂੰ ਸਰਬ-ਵਿਆਪਕ ਹੈਂ; ਤੂੰ ਅਪਹੁੰਚ ਹੈਂ; ਗਿਆਨ-ਇੰਦ੍ਰਿਆਂ ਦੀ ਰਾਹੀਂ ਤੇਰੇ ਤਕ ਪਹੁੰਚ ਨਹੀਂ ਹੋ ਸਕਦੀ। ਤੂੰ (ਹਰ ਥਾਂ) ਆਪ ਹੀ ਆਪ, ਆਪ ਹੀ ਆਪ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਮ = ਅਪਹੁੰਚ। ਅਗੋਚਰ = {ਅ-ਗੋ-ਚਰ। ਗੋ = ਗਿਆਨ-ਇੰਦ੍ਰ੍ਰੇ} ਜਿਸ ਤਕ ਗਿਆਨ-ਇੰਦ੍ਰਿਆਂ ਦੀ ਪਹੁੰਚ ਨਹੀਂ ਹੋ ਸਕਦੀ। ਅਪਾਕੀ = ਆਪ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú eres el Gran Señor, Inalcanzable e Incomprensible, Tú Mismo has creado el Universo desde Tu Propio Ser,"