data = "ਜਿਹ ਸਮਾਨ ਜਗਿ ਭਯੋ ਨ ਹੂਆ ॥"
page = 671

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There he saw a person seated with a parrot and for him there was none like it in the world"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਵਰਗਾ ਕੋਈ ਹੋਰ ਸੰਸਾਰ ਵਿਚ ਨਹੀਂ ਹੋਇਆ।"