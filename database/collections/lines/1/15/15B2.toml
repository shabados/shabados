[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੇਖਤ ਹੀ ਜੁਰ ਸੀਤ ਕਉ ਸੋ ਜੁਰ; ਭਾਜਿ ਗਯੋ ਨ ਰਤੀ ਕੁ ਸੰਭਾਰਿਯੋ ॥"
page = 522

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing which that Shakti became powerless"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "'ਸੀਤ ਜ੍ਵਰ' ਨੂੰ ਵੇਖ ਕੇ 'ਤਾਪ' ਭਜ ਗਿਆ, ਜ਼ਰਾ ਵੀ ਨਾ ਸੰਭਲ ਸਕਿਆ।"