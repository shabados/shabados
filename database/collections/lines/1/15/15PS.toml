type = "primary"
data = "ਸਾਚੇ ਨਾਮ ਕੀ; ਲਾਗੈ ਭੂਖ ॥"
page = 9
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If man feels hunger for the True Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਇਨਸਾਨ ਨੂੰ ਸੱਤਨਾਮ ਦੀ ਖੁੰਧਿਆ ਲਗ ਜਾਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If someone feels hunger for the True Name,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਕਰ ਸਚ ਨਾਮ ਕੀ ਭੂਖ ਲਗੇ, ਭਾਵ ਚਾਹ ਹੋਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਮਨੁੱਖ ਦੇ ਅੰਦਰ) ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਸਿਮਰਨ ਦੀ ਤਾਂਘ ਪੈਦਾ ਹੋ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si alguien tiene hambre del Nombre"