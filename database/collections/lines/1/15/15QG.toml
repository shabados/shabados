[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਕ ਮਲ ਕੀ ਦਾਇਨ ਜੁਧ ਕਰੈ; ਇਕ ਦੇਖ ਮਹਾ ਰਣ ਦਉਰਿ ਪਰੈ ॥"
page = 416

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Someone is fighting like a wrestler and someone seeing the dreadful war, is running away"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਪਹਿਲਵਾਨਾਂ ਵਰਗੇ ਦਾਓਆਂ ਵਾਲਾ ਯੁੱਧ ਕਰਦੇ ਹਨ ਅਤੇ ਇਕ ਵੱਡੇ ਯੁੱਧ ਨੂੰ ਵੇਖ ਕੇ ਦੌੜ ਪਏ ਹਨ।"