[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰਹੁ ਦੁਖੁ ਭ੍ਰਮੁ ਕਟੀਐ; ਸੁਖੁ ਪਰਾਪਤਿ ਹੋਇ ॥"
page = 31
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Suffering and superstition are annulled from within and peace is procured."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਕਲੀਫ ਤੇ ਸੰਦੇਹ ਅੰਦਰੋਂ ਨਾਸ ਹੋ ਜਾਂਦੇ ਹਨ ਅਤੇ ਆਰਾਮ-ਚੈਨ ਹਾਸਲ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Suffering and doubt are cut out from within, and peace is obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਸਰਬ ਦੁਖੋਂ ਕੇ ਦੇਣੇ ਵਾਲਾ ਜੋ ਭ੍ਰਮੁ ਹੈ, ਸੋ ਅੰਤਹਕਰਣ ਸੇ ਕਾਟਿਆ ਜਾਤਾ ਹੈ ਔਰੁ ਜਬ ਭ੍ਰਮੁ ਨਿਬ੍ਰਿਤਿ ਹੂਆ, ਤਬ ਪਰਮਾਨੰਦੁ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥ (ਭ੍ਰਮ ਕਾ ਸ੍ਵਰੂਪੁ ਇਸੀ ਰਾਗ ਮੇਂ ਮ: ੧, ਸ: ੨੩ ਮੇਂ ਖੋਲ ਕਰਿ ਕਹਿ ਆਏ ਹੈਂ।)"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੇ ਮਿਲਣ ਨਾਲ) ਹਿਰਦੇ ਵਿਚੋਂ ਦੁੱਖ ਕੱਟਿਆ ਜਾਂਦਾ ਹੈ, ਭਟਕਣਾ ਦੂਰ ਹੋ ਜਾਂਦੀ ਹੈ, ਆਤਮਕ ਆਨੰਦ ਪ੍ਰਾਪਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭ੍ਰਮੁ = ਭਟਕਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De su mente desaparecen la duda y la aflicción y la Paz se establece"