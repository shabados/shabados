[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਜਨਾ ਕੀ; ਚਰਣੀ ਲਾਗੁ ॥੨॥"
page = 177
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Cling thou to the feet of holy men."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਨੇਕ ਪੁਰਸ਼ਾਂ ਦੇ ਪੈਰਾਂ ਨੂੰ ਚਿਮੜ ਜਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and hold tight to the Feet of the Saints. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨੋਂ ਕੀ ਚਰਨੀ ਲਾਗ ਰਹੁ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਗੁਰਮੁਖਾਂ ਦੀ ਸਰਨ ਪਉ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y aférrate a los Pies de los Santos.(2)"