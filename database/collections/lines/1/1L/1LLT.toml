[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਿਰੁ ਪਰਦੇਸਿ; ਸਿਗਾਰੁ ਬਣਾਏ ॥"
page = 127
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The wife bedecks herself while her husband is gone abroad."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਤਨੀ ਹਾਰ ਸ਼ਿੰਗਾਰ ਲਾਉਂਦੀ ਹੈ ਜਦ ਕਿ ਉਸ ਦਾ ਪਤੀ ਪਰਾਏ ਵਤਨ ਗਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Husband is away, and the wife is getting dressed up."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਪਤੀ ਪਰਦੇਸ ਹੋ ਇਸਤ੍ਰੀ ਬਹੁਤ ਸਿੰਗਾਰ ਬਣਾਵੇ, ਭਾਵ ਏਹ ਕਿ ਪਰਦੇਸ ਪਤੀ ਵਾਲੀ ਇਸਤ੍ਰੀ ਕਾ ਸਿੰਗਾਰ ਬਿਅਰਥ ਹੈ, ਤੈਸੇ ਹੀ ਮਨਮੁਖੋਂ ਕੇ ਸਭ ਕਰਮ ਬ੍ਯਰਥ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸਤ੍ਰੀ ਦਾ) ਪਤੀ ਪਰਦੇਸ ਵਿਚ ਹੋਵੇ ਤੇ ਉਹ (ਆਪਣੇ ਸਰੀਰ ਦਾ) ਸ਼ਿੰਗਾਰ ਕਰਦੀ ਰਹੇ (ਅਜੇਹੀ ਇਸਤ੍ਰੀ ਨੂੰ ਸੁਖ ਨਹੀਂ ਮਿਲ ਸਕਦਾ।)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਦੇਸਿ = ਪਰਦੇਸ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La criatura ciega y necia se comporta como una mujer que se empeña en arreglarse bien mientras su esposo está afuera."