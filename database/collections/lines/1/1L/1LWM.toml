[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ; ਤੇਰੀ ਸਰਣਾਇ ॥"
page = 195
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Supreme Lord, I have entered Thine sanctuary."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੈ ਸ਼੍ਰੋਮਣੀ ਸਾਹਿਬ, ਮੈਂ ਤੇਰੀ ਸ਼ਰਣਾਗਤ ਸੰਭਾਲੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Supreme Lord God, I have come to Your Sanctuary."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਐਸੇ ਬੇਨਤੀ ਕਰੇ, ਹੇ ਪਾਰਬ੍ਰਹਮ ਪਰਮੇਸ੍ਵਰ! ਮੈਂ ਤੇਰੀ ਸਰਣ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਾਰਬ੍ਰਹਮ ਪ੍ਰਭੂ! ਜੇਹੜੇ ਮਨੁੱਖ (ਤੇਰੀ ਮਿਹਰ ਨਾਲ) ਤੇਰੀ ਸਰਨ ਆਉਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਰਬ੍ਰਹਮ = ਹੇ ਪਾਰਬ੍ਰਹਮ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Supremo Señor Dios, he llegado a Tu Santuario,"