[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਿ ਨਾਥੁ; ਦਿਨੁ ਰੈਨਾਈ ॥"
page = 886
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remember thou thy Lord, day and night."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੇ ਸੁਆਮੀ ਦਾ ਦਿਨ ਤੇ ਰਾਤ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate on your Lord Master, day and night."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੋਗੀ! ਤੂੰ (ਨਾਥੁ) ਪਰਮੇਸ੍ਵਰ ਕੋ ਦਿਨੇ ਰਾਤ ਜਪੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੋਗੀ! ਤੇਰਾ ਇਹ ਸਰੀਰ ਦੋ ਦਿਨਾਂ ਦਾ ਹੀ ਪਰਾਹੁਣਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਥੁ = (ਸਾਰੇ ਸੰਸਾਰ ਦਾ) ਖਸਮ। ਰੈਨਾਈ = ਰਾਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Contempla a tu Maestro, tu Dios, noche y día,"