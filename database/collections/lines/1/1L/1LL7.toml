[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਊਚ ਨੀਚ; ਕਰੇ ਪ੍ਰਤਿਪਾਲਾ ॥"
page = 99
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The high and the low, He nurses."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਚਿਆ ਅਤੇ ਨੀਵਿਆਂ ਦੀ ਉਹ ਪਰਵਰਸ਼ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He cherishes the high and the low."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਊਚ ਨੀਚ ਸਰਬ ਕੀ ਪ੍ਰਤਿਪਾਲ ਕਰਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ ਵਿਚ) ਉੱਚੇ ਅਖਵਾਣ ਵਾਲੇ ਤੇ ਨੀਵੇਂ ਅਖਵਾਣ ਵਾਲੇ ਸਭ ਜੀਵਾਂ ਦੀ ਪਾਲਣਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Gopal, la Adoración del mundo, es siempre mi Amor; Él sostiene tanto a los elevados como a los humildes."