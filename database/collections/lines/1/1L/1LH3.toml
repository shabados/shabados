[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਮਨ; ਹਰਿ ਕਾ ਨਾਮੁ ਧਿਆਇ ॥"
page = 35
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul! meditate on the Name of God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, meditate on the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪ੍ਯਾਰੇ! ਹਰੀ ਕਾ ਨਾਮੁ ਜਪੁ ਔਰੁ ਬਿਸਨ ਕਾ ਧ੍ਯਾਨੁ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, medita en el Nombre del Señor"