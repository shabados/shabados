[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਉਦਿਆਨ. ਕੁਸਮ ਪਰਫੁਲਿਤ; ਕਿਨਹਿ. ਨ ਘ੍ਰਾਉ ਲਇਓ ॥"
page = 336
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As flower in the wilderness blooms and no one enjoys its fragrance,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਬੀਅਬਾਨ ਵਿੱਚ ਫੁਲ ਖਿੜਦਾ ਹੈ ਅਤੇ ਕੋਈ ਭੀ ਉਸ ਦੀ ਸੁੰਗਧੀ ਨਹੀਂ ਮਾਣਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Like the flower which blossoms in the wilderness with no one to enjoy its fragrance,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਉਦਿਆਨ ਮੇਂ ਫੂਲ ਫੂਲੇ ਹੋਏ ਹੈਂ ਤਿਨ ਕੀ ਸੁਗੰਧਨਾ ਕੋ ਕਿਸੇ ਨੇ ਨਹੀਂ ਲੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਜੰਗਲ ਵਿਚ ਖਿੜੇ ਹੋਏ ਫੁੱਲਾਂ ਦੀ ਸੁਗੰਧੀ ਕੋਈ ਭੀ ਨਹੀਂ ਲੈ ਸਕਦਾ (ਉਹ ਫੁੱਲ ਉਜਾੜ ਵਿਚ ਕਿਸੇ ਪ੍ਰਾਣੀ ਨੂੰ ਸੁਗੰਧੀ ਨਾਹ ਦੇਣ ਦੇ ਕਾਰਨ ਆਪਣਾ ਖੇੜਾ ਵਿਅਰਥ ਹੀ ਖੇੜ ਜਾਂਦੇ ਹਨ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਦਿਆਨ = ਜੰਗਲ। ਕੁਸਮ = ਫੁਲ। ਪਰਫੁਲਿਤ = ਖਿੜੇ ਹੋਏ। ਕਿਨਹਿ = (ਕਿਸੇ ਬੰਦੇ) ਨੇ ਹੀ। ਘ੍ਰਾਉ = ਸੁਗੰਧੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como la flor retoña en el campo, y nadie está para gozar de su fragancia,"