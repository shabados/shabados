data = "ਯਕੇ ਮਾਦ ਓ ਰਾਸਤ ਸੁਭਟ ਸਿੰਘ ਨਾਮ ॥੮੦॥"
page = 1403

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "One person was spared and he was Subhat Singh.(80)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਕੇਵਲ ਇਕ ਸੁਭਟ ਸਿੰਘ ਨਾਂ ਦਾ ਸੂਰਮਾ ਬਚਿਆ ॥੮੦॥"