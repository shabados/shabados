[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਲਗੁ ਹੁਕਮੁ. ਨ ਬੂਝਤਾ; ਤਬ ਹੀ ਲਉ ਦੁਖੀਆ ॥"
page = 400
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As long as man understands not God's will so long he remains miserable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਤੋਡੀ ਆਦਮੀ ਰਬ ਦੀ ਰਜ਼ਾ ਨੂੰ ਨਹੀਂ ਸਮਝਦਾ ਤਦ ਤੋੜੀ ਉਹ ਦੁਖੀ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As long as he does not understand the Command of God's Will, he remains miserable."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਲਗ ਸ੍ਵਾਮੀ ਕਾ ਹੁਕਮ ਨਹੀਂ ਸਮਝਤਾ ਥਾ ਤਬੀ ਤਕ ਦੁਖੀਆ ਰਹਤਾ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਦ ਤਕ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੀ ਰਜ਼ਾ ਨੂੰ ਨਹੀਂ ਸਮਝਦਾ ਉਤਨਾ ਚਿਰ ਤਕ ਹੀ ਦੁਖੀ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਬ ਹੀ ਲਉ = ਤਦ ਤਕ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mientras uno no toma Conciencia de la Voluntad del Señor, uno sufre dolor,"