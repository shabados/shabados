[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਰੰਕੰ ਨ ਰਾਯੰ ਨ ਰੂਪੰ ਨ ਰੇਖੰ ॥"
page = 39

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is neither poor  nor rich;  He is Formless and Markless"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੂੰ) ਨਾ ਕੰਗਾਲ ਹੈਂ, ਨਾ ਰਾਜਾ ਹੈਂ, (ਤੇਰਾ) ਨਾ ਰੂਪ ਹੈ ਅਤੇ ਨਾ ਹੀ ਰੇਖ ਹੈ।"