[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖ ਹਉਮੈ ਮਾਇਆ ਸੂਤੇ ॥"
page = 1049
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The way-ward are asleep in self conceit and worldly valuable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪ-ਹੁਦਰੇ, ਸਵੈ-ਹੰਗਤਾ ਅਤੇ ਸੰਸਾਰੀ ਪਦਾਰਥਾਂ ਅੰਦਰ ਸੁੱਤੇ ਪਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The manmukhs are asleep in egotism and Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ ਹਉਮੈਂ ਕਰ ਕੇ ਮਾਇਆ ਕੇ ਮਦ ਮੇਂ ਸੂਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨ ਦੇ ਮੁਰੀਦ ਮਨੁੱਖ ਹਉਮੈ ਵਿਚ ਮਾਇਆ (ਦੇ ਮੋਹ) ਵਿਚ (ਸਹੀ ਜੀਵਨ ਵਲੋਂ) ਗ਼ਾਫ਼ਿਲ ਹੋਏ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਮੁਖ = ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ ਮਨੁੱਖ। ਸੂਤੇ = ਗ਼ਾਫ਼ਿਲ ਹੋਏ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Manmukj están dormidos, debido al ego y a la Maya."