[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਾਖ ਤਪੀਸਰ; ਤਪੁ ਹੀ ਸਾਧਹਿ ॥"
page = 562
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lakhs of penitents do penance unto Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲੱਖਾਂ ਹੀ ਤੱਪੀ ਉਸ ਦੀ ਤਪੱਸਿਆ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Tens of thousands of ascetics practice austere discipline."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜਿਸ ਕੇ ਮਿਲਨੇ ਕੋ ਪੁਨਾ ਲਾਖੋਂ ਤਪਸੀ ਤਪ ਕੋ ਸਾਧਤੇ, ਭਾਵ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ-ਮਿਲਾਪ ਲਈ) ਲੱਖਾਂ ਹੀ ਵੱਡੇ ਵੱਡੇ ਤਪੀ ਤਪ ਕਰਦੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਪੀਸਰ = {ਤਪੀ-ਈਸਰ} ਵੱਡੇ ਵੱਡੇ। ਸਾਧਹਿ = ਸਾਧਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por el Cual millones de ascetas practican austeridades,"