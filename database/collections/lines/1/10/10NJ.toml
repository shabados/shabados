[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧੰਧੈ ਧਾਵਤੁ ਜਨਮੁ ਗਵਾਇਆ; ਬਿਨੁ ਨਾਵੈ. ਦੁਖੁ ਪਾਇਆ ॥੬॥"
page = 1067
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Running after worldly affairs, man wastes his life and without the name, comes to grief."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰੀ ਕੰਮਾਂ ਮਗਰ ਭੱਜਿਆ ਫਿਰਦਾ ਬੰਦਾ, ਆਪਦਾ ਜੀਵਨ, ਗੁਆ ਲੈਂਦਾ ਹੈ ਅਤੇ ਨਾਮ ਦੇ ਬਾਝੌਂ ਤਕਲਫ਼ਿ ਉਠਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chasing after worldly affairs, he wastes away his life in vain; without the Name, he suffers in pain. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਧੰਧਿਆਂ ਮੇਂ ਤਿਸ ਨੇ ਧਾਵਤਿਆਂ ਜਨਮ ਹੀ ਗਵਾਇਆ ਹੈ, ਨਾਮ ਸੇ ਬਿਨਾਂ ਦੁਖ ਹੀ ਪਾਇਆ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੋਹ ਦੇ) ਧੰਧੇ ਵਿਚ ਭਟਕਦਾ ਭਟਕਦਾ (ਮਨੁੱਖਾ) ਜਨਮ ਜਾਇਆ ਕਰ ਲੈਂਦਾ ਹੈ, ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਤੋਂ ਬਿਨਾ ਦੁੱਖ ਪਾਂਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧੰਧੈ = ਧੰਧੇ ਵਿਚ। ਧਾਵਤੁ = ਦੌੜ-ਭੱਜ ਕਰਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y persiguiendo conflictos y discordias sólo desperdicia su vida y sin el Nombre sufre dolor. (6)"