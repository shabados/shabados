[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਜਾਣੋਈ ਸਭਸੈ; ਦੇ ਲੈਸਹਿ. ਜਿੰਦੁ ਕਵਾਉ ॥"
page = 463
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art the Knower of all and Thou givest and takest life with a word."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਾਰਿਆਂ ਨੂੰ ਜਾਨਣ ਵਾਲਾ ਹੈਂ। ਇੱਕ ਲਫਜ ਨਾਲ ਤੂੰ ਜਿੰਦ ਜਾਨ ਨੂੰ ਦੇ ਦਿੰਦਾ ਤੇ ਲੈ ਲੈਦਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the Knower of all; You give life, and take it away again with a word."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ (ਜਾਣੋਈ) ਸਭ ਕੇ ਜਾਣਨੇ ਵਾਲਾ, ਭਾਵ ਪਿਤਾ ਵਾ ਸਭ ਕੇ ਅੰਤਸਕਰਣ ਕੀ ਜਾਨਣੇ ਹਾਰਾ ਹੈ। (ਦੇ ਲੈਸਹਿ ਜਿੰਦ ਕਵਾਉ) ਏਕ ਬਾਕ੍ਯ ਸੰਕਲਪਕਰ ਜਾਨ, ਭਾਵ ਜੀਵ ਕੋ ਦੇਤਾ ਹੈ। ਏਕ ਬਾਕ੍ਯਕਰ ਲੇਤਾ ਹੈ ਅਰਥਾਤ ਉਤਪਤਿ ਪ੍ਰਲ੍ਯ ਕਰਤਾ ਹੈ; ਵਾ ਦੇਹ ਰੂਪ (ਕਵਾਉ) ਪੁਸ਼ਾਕ ਮੇਂ ਜੀਵ ਸਤਾ ਦੇ ਕਰ ਫਿਰ ਲੇ ਲੇਤਾ ਹੈ; ਵਾ ਦੇਹ ਰੂਪ ਪੁਸ਼ਾਕ ਦੇ ਕਰ ਫਿਰ ਸ੍ਵੇਛਿਤ ਲੇ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਭਨਾਂ ਜੀਆਂ ਦੀ ਜਾਣਨਹਾਰ ਹੈਂ। ਜਿੰਦ ਅਤੇ ਸਰੀਰ ਦੇ ਕੇ (ਤੂੰ ਆਪ ਹੀ) ਲੈ ਲਵੇਂਗਾ (ਭਾਵ, ਤੂੰ ਆਪ ਹੀ ਜਿੰਦ ਤੇ ਸਰੀਰ ਦੇਂਦਾ ਹੈਂ, ਆਪ ਹੀ ਮੁੜ ਲੈ ਲੈਂਦਾ ਹੈਂ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਣੋਈ = ਜਾਣਨਹਾਰਾ, ਜਾਣੂ। ਸਭਸੈ = ਸਭਨਾਂ ਦਾ। ਦੇ = ਦੇ ਕੇ। ਲੈਸਹਿ = ਲੈ ਲਵੇਂਗਾ। ਜਿੰਦੁ ਕਵਾਉ = ਜਿੰਦ ਅਤੇ ਜਿੰਦ ਦਾ ਕਵਾਉ (ਲਿਬਾਸ, ਪੋਸ਼ਾਕ), ਭਾਵ, ਸਰੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú conoces todo de todo, das vida en un momento, y en un momento también la tomas."