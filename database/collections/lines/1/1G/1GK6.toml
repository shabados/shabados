[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧਸੰਗਿ; ਤਾ ਕੀ ਸਰਨੀ ਪਰਹੁ ॥"
page = 191
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the congregation of Saints take to His refuge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿ ਸੰਗਤ ਅੰਦਰ ਉਸ ਦੀ ਸਰਣਾਗਤਿ ਸੰਭਾਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Saadh Sangat, the Company of the Holy, seek His Sanctuary."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਧੋਂ ਕਾ ਜੋ ਸੰਗੁ ਹੈ ਤਿਸੁ ਵਾਹਗੁਰੂ ਕੀ ਸਰਨ ਮੇਂ ਪਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮੇਰੇ ਵੀਰ!) ਸਾਧ ਸੰਗਤਿ ਵਿਚ ਜਾ ਕੇ ਉਸ ਪਰਮਾਤਮਾ ਦਾ ਆਸਰਾ ਲੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧ ਸੰਗਿ = ਸਾਧ ਸੰਗਤਿ ਵਿਚ, ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਵਿਚ। ਤਾ ਕੀ = ਉਸ (ਪਰਮਾਤਮਾ) ਦੀ"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Busca el Refugio de los Santos,"