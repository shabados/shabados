[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜੀਉ ਸੇਵਿਹੁ; ਅਗਮ ਅਪਾਰਾ ॥"
page = 1055
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Serve thou the Unapproachable, Infinite and Venerable Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਪਹੁੰਚ ਤੋਂ ਪਰੇ ਅਤੇ ਅਨੰਤ ਪੂਜ਼ਯ ਪ੍ਰਭੂ ਦੀ ਸੇਵਾ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serve the Dear Lord, the inaccessible and infinite."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹਰੀ ਜੋ ਅਗਮ ਅਪਾਰ ਹੈ ਤਿਸ ਕੋ ਸੇਵਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬੇਅੰਤ ਅਤੇ ਅਪਹੁੰਚ ਪਰਮਾਤਮਾ ਦਾ ਸਿਮਰਨ ਕਰਦੇ ਰਿਹਾ ਕਰੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵਿਹੁ = ਸਿਮਰਨ ਕਰਿਆ ਕਰੋ। ਅਗਮ = ਅਪਹੁੰਚ। ਅਪਾਰਾ = ਬੇਅੰਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Hombres y mujeres, sirvan a su Señor, Quien es Insondable e Infinito"