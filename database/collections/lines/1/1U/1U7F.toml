[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਿਰੁ ਨੀਵਾ ਨੀਵਾਣਿ ਵਾਸੁ; ਪਾਣੀ ਅੰਦਰਿ ਪਰਉਪਕਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Water goes towards low level and has qualities of altruism."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਾਣੀ ਦਾ ਸਿਰ ਨੀਵਾਂ ਹੈ ਤੇ ਨੀਵੇਂ ਥਾਂਉਂ ਪਰ ਵਾਸ ਕਰਦਾ ਹੈ (ਇਉਂ) ਪਾਣੀ ਵਿਚ ਪਰਉਪਕਾਰ ਹੈ।"