[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਚੋਰ ਹੈ ਨ ਸਾਹੁ ਹੈ; ਨ ਸਾਹ ਕੋ ਕੁਮਾਰ ਹੈ ॥੮॥੧੬੮॥"
page = 32

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is neither a thief, nor a moneylender nor a prince.8.168."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਾ ਚੋਰ ਹੈ, ਨਾ ਸ਼ਾਹ ਹੈ ਅਤੇ ਨਾ ਹੀ ਸ਼ਾਹੂਕਾਰ ਦਾ ਪੁੱਤਰ ਹੈ ॥੮॥੧੬੮॥"