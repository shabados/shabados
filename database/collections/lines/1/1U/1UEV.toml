data = "ਛੋਰਿ ਦ੍ਵਾਰੋ ਪਾਛਲੋ; ਭਾਜ ਗਏ ਤਤਕਾਲ ॥"
page = 899

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Leaving his companion at the doorstep, he quickly ran away."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਿਛਲੇ ਦਰਵਾਜ਼ੇ ਨੂੰ ਖੋਲ ਕੇ ਤੁਰਤ ਭਜ ਗਿਆ"