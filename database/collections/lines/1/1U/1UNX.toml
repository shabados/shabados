data = "ਮਾਰੂ ਰਾਗ ਸਿਧਾਰੇ ਗਾਵਤ ॥੮॥"
page = 990

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "With swords brandishing, they sang war-ballads.(8)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮਾਰੂ ਰਾਗ ਅਤੇ ਸੰਧੂਰੀਆ ਰਾਗ ਅਲਾਪਦੇ ਸਨ ॥੮॥"