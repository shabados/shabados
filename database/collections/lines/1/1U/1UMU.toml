[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਦਾ ਦੇ; ਲੈਦੇ ਥਕਿ ਪਾਹਿ ॥"
page = 2
line = 2

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਦੇਦਾ - ਦੇਣਵਾਲ, ਲੈਦੇ - ਲੈਣਵਾਲੇ।"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Giver continues giving but the recipients grow weary of receiving."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੇਣ ਵਾਲਾ ਦੇਈ ਜਾਂਦਾ ਹੈ ਪਰੰਤੂ ਲੈਣ ਵਾਲੇ ਲੈ ਕੇ ਹਾਰ ਹੁਟ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Great Giver keeps on giving, while those who receive grow weary of receiving."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁਦਾਤਾ (ਦੇਦਾ) ਦੇਣੇ ਵਾਲਾ ਜੋ ਹੈ, ਸੋ ਦਾਨੁ ਦੇਤਾ ਹੀ ਰਹਿਤਾ ਹੈ, (ਲੈਦੇ) ਲੈਣੇ ਵਾਲੇ ਥਕ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦਾਤਾਰ ਅਕਾਲ ਪੁਰਖ (ਸਭ ਜੀਆਂ ਨੂੰ ਰਿਜ਼ਕ) ਦੇ ਰਿਹਾ ਹੈ, ਪਰ ਜੀਵ ਲੈ ਲੈ ਕੇ ਥੱਕ ਪੈਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਦਾ = ਦੇਂਦਾ, ਦੇਣ ਵਾਲਾ, ਦਾਤਾਰ ਰੱਬ। ਦੇ = (ਸਦਾ) ਦੇਂਦਾ ਹੈ, ਦੇ ਰਿਹਾ ਹੈ। ਲੈਦੇ = ਲੈਂਦੇ, ਲੈਣ ਵਾਲੇ ਜੀਵ। ਥਕਿ ਪਾਹਿ = ਥਕ ਪੈਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Gran Dador incansablemente da más y más, mientras los que reciben se cansan de recibir."