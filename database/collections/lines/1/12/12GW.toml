[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਦੀਸੈ; ਸਭ ਆਵਣ ਜਾਣੀ ॥"
page = 1021
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All that seems, is subject to coming and going."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਾ ਕੁਛ ਜੋ ਦਿਸਦਾ ਹੈ, ਆਉਣ ਤੇ ਜਾਣ ਦੇ ਅਧੀਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All that is seen, is coming and going."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਦ੍ਰਿਸਟੀ ਮੇਂ ਆਵਤੀ ਹੈਂ ਸਭ ਆਵਣੇ ਜਾਣੇ ਵਾਲੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਵਿਚ ਜੋ ਕੁਝ ਦਿੱਸ ਰਿਹਾ ਹੈ ਉਹ ਜੰਮਣ ਮਰਨ ਦੇ ਗੇੜ ਵਿਚ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y todo lo que parece, sólo va y viene."