[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਾਜੇ ਅਨਹਦ ਤੂਰੇ ॥"
page = 626
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The trumpets of spiritual bliss play."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਤਮਕ ਅਨੰਦ ਦੇ ਵਾਜੇ ਵੱਜਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The unstruck melody of the sound current resounds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਰਸ ਵਾਜੇ ਵਜੇ ਹੈਂ, ਭਾਵ ਸੇ ਖੁਸ਼ੀ ਹੂਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੇ ਅੰਦਰ ਆਤਮਕ ਆਨੰਦ ਦੇ, ਮਾਨੋ) ਇਕ-ਰਸ ਵਾਜੇ ਵੱਜਣ ਲੱਗ ਪਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਹਦ = ਇਕ-ਰਸ, ਬਿਨਾ ਵਜਾਏ। ਤੂਰੇ = ਵਾਜੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y la Melodía Divina del Alma se escucha en mi mente."