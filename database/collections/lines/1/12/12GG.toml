[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਦੇਉ ਸੰਦੇਸਾ; ਪੈ ਚਰਣਾਰੇ ਜੀਉ ॥"
page = 217
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Saints, convey my this message to God, I fall at Thine feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੈ ਸਾਧੂਓ! ਮੇਰਾ ਇਹ ਸੁਨੇਹਾ ਹਰੀ ਨੂੰ ਪੁਚਾ ਦੇਣਾ, ਮੈਂ ਤੇਰੇ ਪੈਰੀ ਪੈਂਦੀ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Saints, give Him this message; I fall at Your Feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤੋ! ਮੈਂ ਤੁਮਾਰੇ ਚਰਣੋਂ ਮੇਂ ਪੜਤਾ ਹੂੰ। ਐਸੇ ਸੰਦੇਸਾ ਦੇਵੋ ਜਿਸ ਕਰ ਪਰਮੇਸ੍ਵਰ ਕੀ ਪ੍ਰਾਪਤੀ ਹੋਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇਰੇ) ਸੰਤ ਜਨਾਂ ਦੀ ਚਰਨੀਂ ਪੈ ਕੇ ਮੈਂ (ਤੇਰੇ ਵਲ) ਸੁਨੇਹਾ ਭੇਜਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤ ਦੇਉ = ਮੈਂ ਸੰਤਾਂ ਨੂੰ ਦੇਂਦਾ ਹਾਂ। ਸੰਦੇਸਾ = ਸਨੇਹਾ। ਪੈ = ਪੈ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Santos, me pongo a Sus Pies;"