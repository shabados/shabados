data = "ਅਪੋ ਆਪ ਸੈ ਨੇਕਿ ਘਾਇੰ ਸਰਾਹੈ ॥੪॥੨੨੨॥"
page = 146

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They appreciated those on their sides who inflicted deep wounds.4.222."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਦੋਵੇਂ) ਆਪੋ ਆਪਣੇ ਪਾਸਿਆਂ ਵਿਚ ਚੰਗੇ ਫਟ ਲਗਾਉਣ ਵਾਲਿਆਂ ਨੂੰ ਸਲਾਹ ਰਹੇ ਸਨ ॥੪॥੨੨੨॥"