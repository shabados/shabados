[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧੰਨੁ ਸੁਹਾਵਾ ਮੁਖੁ; ਜਿਨਿ ਹਰਿ ਧਿਆਇਆ ॥੩॥"
page = 399
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Blessed and beautiful is the mouth which repeats the Name of God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਬਾਰਕ ਅਤੇ ਸੁੰਦਰ ਹੈ ਉਹ ਮੂੰਹ, ਜਿਹੜਾ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Blessed and beautiful is that mouth, which meditates on the Lord. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਹਰਿ ਹਰਿ ਐਸਾ ਜਾਪ ਜਪਿਆ ਹੈ, ਉਸ ਪੁਰਸ ਕਾ ਮੁਖ ਸੋਭਾਇਮਾਨ ਅਰੁ ਧੰਨੁ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ (ਇਹ ਪਿਆਰ ਪਾਇਆ ਹੈ) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਿਆ ਹੈ ਉਸ ਦਾ ਮੂੰਹ ਭਾਗਾਂ ਵਾਲਾ ਹੈ ਉਸ ਦਾ ਮੂੰਹ ਸੋਹਣਾ ਲੱਗਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਹਾਵਾ = ਸੋਹਣਾ। ਜਿਨਿ = ਜਿਸ ਨੇ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, Benditos son los labios que pronuncian el Naam, el Nombre de Dios. (3)"