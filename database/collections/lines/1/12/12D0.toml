[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਿਖਿਅੜਾ ਲੇਖੁ. ਨ ਮੇਟੀਐ; ਦਰਿ. ਹਾਕਾਰੜਾ ਆਇਆ ਹੈ ॥"
page = 582
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord's writ cannot be erased. The summons have come from the Lord's court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲਿਖਤੀ ਹੁਕਮ ਮੇਸਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ। ਸਾਹਿਬ ਦੇ ਦਰਬਾਰ ਤੋਂ ਸਦਾ ਆਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The pre-ordained record of destiny cannot be erased; the summons has come from the Lord's Court."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਜਿਸ ਕੇ ਲਿਖੇ ਲੇਖ ਕੋ ਮਿਟਾਇ ਨਹੀਂ ਸਕੀਤਾ ਹੈ, ਉਸ ਕੇ ਦਰ ਕਾ ਬੁਲਾਵਾ ਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਦਾ) ਲਿਖਿਆ ਹੁਕਮ ਮਿਟਾ ਨਹੀਂ ਸਕੀਦਾ, ਜੋ ਉਸ ਦੇ ਦਰ ਤੋਂ ਸੱਦਾ ਆ ਜਾਂਦਾ ਹੈ (ਉਹ ਸੱਦਾ ਅਮਿੱਟ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਰਿ = (ਪ੍ਰਭੂ ਦੇ) ਦਰ ਤੋਂ। ਹਾਕਾਰੜਾ = ਸੱਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Decreto del Señor no es borrado; el Llamado ha venido de la Corte del Señor."