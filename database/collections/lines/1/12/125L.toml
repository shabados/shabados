[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਲਕਾ ਪਰ ਤੇ ਰਾਨਿਯਹਿ; ਸੋਤ ਨ੍ਰਿਪਤਿ ਕੋ ਡਾਰਿ ॥"
page = 996

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "By toppling over the bed on which Raja was sleeping,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਲੰਘ ਉਤੇ ਸੁੱਤੇ ਹੋਏ ਰਾਜੇ ਨੂੰ ਰਾਣੀ ਨੇ ਥਲੇ ਸੁਟ ਕੇ"