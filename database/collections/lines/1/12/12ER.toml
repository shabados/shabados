[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਉਨ ਬਾਟ ਪਰੀ ਤਿਸੈ, ਪਥ ਸਾਰਥੀ ਰਥ ਹੋਇ ॥੧॥"
page = 711

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Of what crucial necessity, He became the charioteer ?1."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕਿਹੜੀ ਔਖ ਆ ਬਣੀ ਸੀ ਕਿ ਉਹ ਅਰਜਨ (ਪਥਪਾਰਥ) ਦਾ ਰਥਵਾਨ ਬਣਿਆ ਸੀ ॥੧॥"