[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚਰਣ ਕਵਲ ਪਤਿਆਇ; ਭਵਰੁ ਲੁਭਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He remains stuck to the lotus feet of the Guru like the black bee."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਵਾਹਿਗੁਰੂ ਦੇ) ਚਰਣਾਂ ਕਵਲਾਂ ਤੇ ਪਤੀਜਕੇ ਭਵਰੇ ਵਾਂਙ ਲੁਭਤ ਹੋ ਗਿਆ।"