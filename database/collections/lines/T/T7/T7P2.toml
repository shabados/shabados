type = "primary"
data = "ਕਈ ਅੰਨਿ ਤਿਆਗਿ ਚਾਬੰਤ ਕਾਠ ॥੧੫੭॥"
page = 647

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many are busy in reciting the religious texts in various ways and many forsaking the corn, are just chewing the wood.157."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਈ ਅੰਨ ਤਿਆਗ ਕੇ ਕਾਠ ਨੂੰ ਚਬਦੇ ਹਨ ॥੧੫੭॥"