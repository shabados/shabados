[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਸਭ ਜੀਅ ਧਾਰੋ ॥੭੫੧॥"
page = 755

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Utter firstly the words Mrigi-raat” and then say “Pati Shatru”, thus comprehend the names of tupak.751."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਾਰੇ ਮਨ ਵਿਚ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝੋ ॥੭੫੧॥"