[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਪਰਵਾਰੈ ਮਾਹਿ; ਸਰੇਸਟ ॥"
page = 371
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In all the family she is the noblest."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਟੱਬਰ-ਕਬੀਲੇ ਵਿੱਚ ਉਹ ਸਭ ਤੋਂ ਉਤਮ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "She is the most noble of all the family."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਪਰਵਾਰ ਦੇਵੀ ਸੰਪਦਾ ਮੈਤ੍ਰੀ, ਮੁਦਿਤਾ, ਕਰੁਣਾ, ਸ੍ਰਧਾਦਿ ਮੇਂ ਸ੍ਰੇਸਟ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਿੱਠਾ ਬੋਲ, ਨਿਮ੍ਰਤਾ, ਸੇਵਾ, ਦਾਨ, ਦਇਆ) ਸਾਰੇ (ਆਤਮਕ) ਪਰਵਾਰ ਵਿਚ (ਭਗਤੀ) ਸਭ ਤੋਂ ਉੱਤਮ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰੇਸਟ = ਉੱਤਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En su familia ahora es considerada suprema;"