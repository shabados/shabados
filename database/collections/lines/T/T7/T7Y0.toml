[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕਉ ਰਾਖਉ; ਅਪਨੇ ਜੀਅ ਨਾਲਿ ॥"
page = 867
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saint I keep close to my soul."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਨੂੰ ਮੈਂ ਆਪਣੀ ਜਿੰਦੜੀ ਦੇ ਨਾਲ ਲਾਈ ਰੱਖਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I hold the Saints close to my soul."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਕੋ ਤੌ ਮੈਂ ਅਪਨੇ ਜੀ ਕੇ ਸਾਥ ਲਾਇਕੇ ਰਾਖਤਾ ਹੂੰ, ਭਾਵ ਸੇ ਸੰਤ ਤੋ ਮੇਰੇ ਪ੍ਰਾਨ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਨੂੰ ਮੈਂ ਸਦਾ ਆਪਣੀ ਜਿੰਦ ਦੇ ਨਾਲ ਰੱਖਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਰਾਖਉ = ਰਾਖਉਂ, ਮੈਂ ਰੱਖਿਆ ਕਰਦਾ ਹਾਂ। ਜੀਅ ਨਾਲਿ = ਜਿੰਦ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "conservo íntegramente en mi Alma al Santo."