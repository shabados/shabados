data = "ਅਰੁ ਜੇ ਹੁਤੇ ਦੇਸ ਦੇਸਨ ਮਤਿ; ਤੇ ਭੀ ਸਰਬ ਬੁਲਾਏ ॥"
page = 683

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Other people of various countries were also called"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਦੇਸਾਂ ਦੇਸਾਂ ਦੇ ਜੋ ਮਤਾਂ (ਧਰਮਾਂ) ਵਾਲੇ ਸਨ, ਉਨ੍ਹਾਂ ਨੂੰ ਵੀ ਬੁਲਾ ਲਿਆ।"