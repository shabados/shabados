[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦੀ; ਆਪੁ ਗਵਾਈਐ ॥"
page = 841
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's grace, self-conceit is dispelled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ, ਸਵੈ-ਹੰਗਤਾ ਦੂਰ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, self-conceit is eradicated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਗੁਰੋਂ ਕੀ ਕਿਰਪਾ ਤੇ ਆਪਾ ਭਾਵ ਕੋ ਗਵਾਇ ਦੇਈਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ (ਆਪਣੇ ਅੰਦਰੋਂ) ਆਪਾ-ਭਾਵ ਦੂਰ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਸਾਦੀ = ਕਿਰਪਾ ਨਾਲ, ਪਰਸਾਦਿ। ਆਪੁ = ਆਪਾ-ਭਾਵ, ਹਉਮੈ। ਗਵਾਈਐ = ਦੂਰ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Calma tu ego, oh mi mente, por la Gracia del Guru,"