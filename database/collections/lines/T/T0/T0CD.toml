[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਕਟ ਅਜੈ ਅਨਭੇਦ; ਅਮਿਟ ਅਨਰਥਿ ਨਾਮ ਤਿਹ ॥"
page = 695

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is invincible, imperishable and indiscriminate"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨਾ ਕਟੇ ਜਾਣ ਵਾਲੇ, ਨਾ ਜਿਤੇ ਜਾ ਸਕਣ ਵਾਲੇ, ਨਾ ਭੇਦੇ ਜਾ ਸਕਣ ਵਾਲੇ, ਨਾ ਮਿਟਣ ਵਾਲੇ ਦਾ ਨਾਂ 'ਅਨਰਥਿ' ਹੈ।"