[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਿਤਰ ਸਿੰਘ ਕੇ ਪੂਤ ਕੌ ਪ੍ਰਾਨ ਰਾਖ︀ਯੋ ॥੧॥"
page = 832

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Minister advised the Raja and protected the son of Chitar Singh.(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਚਿਤ੍ਰ ਸਿੰਘ ਦੇ ਪੁੱਤਰ ਦੀ ਰਖਿਆ ਕੀਤੀ ॥੧॥"