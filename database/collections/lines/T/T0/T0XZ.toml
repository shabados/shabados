[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮੋ ਹਿੰਗੁਲਾ ਪਿੰਗੁਲਾ ਅੰਬਿਕਾਯੰ ॥"
page = 119

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The source of the power of Hinglaj and Pinglaj, I salute Thee."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹਿੰਗੁਲਾ, ਪਿੰਗੁਲਾ ਅਤੇ ਅੰਬਕਾ ਨੂੰ ਨਮਸਕਾਰ ਹੈ;"