[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸ︀ਯਾਮ ਜੂ ਹੇਰਿ ਤਿਨੇ ਅਪਨੇ ਚਿਤ ਭੀਤਰ ਨੈਕੁ ਨਹੀ ਡਰੁ ਮਾਨਿਯੋ ॥੨੧੩੨॥"
page = 511

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "It appeared that on the doomsday the ocean was surging forth, but Krishna did not fear even slightly on seeing Bhumasura.2132."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਨੂੰ ਕ੍ਰਿਸ਼ਨ ਨੇ ਵੇਖ ਕੇ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਜ਼ਰਾ ਜਿੰਨਾ ਵੀ ਡਰ ਨਹੀਂ ਮੰਨਿਆ ॥੨੧੩੨॥"