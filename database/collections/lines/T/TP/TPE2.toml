[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰਜਾਮੀ; ਰਹਿਓ ਬਿਆਪਿ ॥"
page = 292
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The knower of hearts is contained in everything."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਿਲਾਂ ਦੀਆਂ ਜਾਨਣਹਾਰ ਹਰ ਵਸਤੂ ਅੰਦਰ ਰਮਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Inner-knower, the Searcher of hearts, is present everywhere."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਅੰਤਰਯਾਮੀ ਸਰਬ ਮੇਂ ਵਿਆਪ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਭ ਦੇ ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲਾ ਪ੍ਰਭੂ ਸਭ ਥਾਈਂ ਮੌਜੂਦ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਤਰਜਾਮੀ = ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues Él habita en cada corazón y prevalece en todo."