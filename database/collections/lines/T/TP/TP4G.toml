[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਹੋਵੈ; ਜਿ ਕਰੈ ਚੋਜ ਵਿਡਾਣੀ ॥੧॥"
page = 1139
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "but happens only that, what the Lord of wondrous plays does."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਤੂ ਕੇਵਲ ਉਹ ਹੀ ਹੁੰਦਾ ਹੈ ਜੋ ਅਦੁਭੁਤ ਖੇਡਾਂ ਦਾ ਸੁਆਮੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but that alone happens, which the Lord of wondrous plays does. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਹੇ (ਚੋਜ ਵਿਡਾਣੀ) ਅਚਰਜ ਕੌਤਕ ਵਾਲੇ ਵਾਹਗੁਰੂ! ਜੋ ਤੂੰ ਕਰਤਾ ਹੈਂ ਸੋਈ ਹੋਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਉਹੀ ਕੁਝ ਹੁੰਦਾ ਹੈ ਜੋ ਅਚਰਜ ਚੋਜ ਕਰਨ ਵਾਲਾ ਪਰਮਾਤਮਾ ਕਰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੋਜ ਵਿਡਾਣੀ = ਅਸਚਰਜ ਚੋਜਾਂ ਵਾਲਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero sólo sucede lo que el Dios desea. (1)"