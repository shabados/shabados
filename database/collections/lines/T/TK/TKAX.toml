[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਹੂ ਬਿਹਾਵੈ; ਦਿਨੁ ਰੈਨਿ ਚਾਲਤ ॥"
page = 914
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some pass their life walking day and night."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਦਿਹੁੰ ਰਾਤ ਟੁਰਦਿਆਂ ਹੀ ਆਪਣਾ ਜੀਵਨ ਗੁਜ਼ਾਰ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some pass their lives walking day and night."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਸੀ ਕੀ ਰਾਤ ਦਿਨ ਤੁਰਨੇ ਮੇਂ ਬੀਤਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਦੀ ਉਮਰ ਬੀਤਦੀ ਹੈ ਦਿਨੇ ਰਾਤ ਤੁਰਦਿਆਂ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੈਨਿ = ਰਾਤ। ਚਲਤ = ਤੁਰਦਿਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunos viven en la lujuria,"