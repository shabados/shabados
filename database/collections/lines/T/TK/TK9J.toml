[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਕ ਅਬਲਾ ਥੀ ਜਾਟ ਕੀ; ਤਸਕਰ ਸੋ ਤਿਹ ਨੇਹ ॥"
page = 947

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There was the wife of a Jat, the peasant, who fell in love with a thief."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਜੱਟ ਦੀ ਇਸਤਰੀ ਸੀ ਜਿਸ ਦਾ (ਇਕ) ਚੋਰ ਨਾਲ ਪ੍ਰੇਮ ਸੀ।"