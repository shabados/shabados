[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੋਟਿ ਇੰਦ੍ਰ ਇੰਦ੍ਰਾਣ; ਸਾਹੁ ਸਾਹਾਣਿ ਗਣਿਜੈ ॥"
page = 1
line = 5

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Lord of millions of Indras and kings, the Master of all worlds and beings."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ ਪਰਮ ਸੱਤਾ) ਕਰੋੜਾਂ ਇੰਦਰਾਂ ਦਾ ਇੰਦਰ ਅਤੇ ਸ਼ਾਹਾਂ ਦਾ ਸ਼ਾਹ ਗਿਣਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਕੋਟਿ ਇੰਦ੍ਰ ਇੰਦ੍ਰਾਣਿ; ਸਾਹਿ ਸਾਹਾਣਿ ਗਣਿੱਜੈ ॥"