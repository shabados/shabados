[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੈ ਦਰਿ ਪਏ; ਮੇਰੇ ਮਨਾ ॥੧॥ ਰਹਾਉ ॥"
page = 410
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "since the time I have fallen at Lord's door, O my soul. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਦਾ ਮੈਂ ਸੁਆਮੀ ਦੇ ਬੂਹੇ ਤੇ ਡਿੱਗ ਪਿਆ ਹਾਂ, ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "since I fell at God's Door, O my mind. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਹੇ ਪ੍ਰਭ! ਹਮ ਤੇਰੇ ਦ੍ਵਾਰੇ ਪਰ ਪੜੇ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! (ਚਤੁਰਾਈਆਂ ਛੱਡ ਕੇ) ਜੋ ਮਨੁਖ ਪਰਮਾਤਮਾ ਦੇ ਦਰ ਤੇ ਡਿੱਗ ਪਵੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਰਿ = ਦਰ ਤੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Póstrate entonces a las Puertas de tu Señor, oh mi mente. (1‑Pausa)"