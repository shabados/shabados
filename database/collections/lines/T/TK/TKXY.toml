[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੇਵਲ; ਰਾਮ ਨਾਮ ਮਨੋਰਮੰ ॥"
page = 526
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Utter thou only the beauteous Name of the Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਿਰਫ ਸਾਈਂ ਦੇ ਸੁੰਦਰ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Dwell only upon the beauteous Name of the Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਸੁਧ ਰਾਮ ਹੈ ਜਿਸ ਕਾ ਨਾਮ (ਮਨੋਰਮੰ) ਸੁੰਦ੍ਰ ਵਾ ਮਨ ਆਦਿ ਮੇਂ ਰਮਾ ਹੂਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਪਰਮਾਤਮਾ ਦਾ ਸੁੰਦਰ ਨਾਮ ਸਿਮਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨੋਰਮੰ = {मनोरमं}, ਮਨ ਨੂੰ ਮੋਹਣ ਵਾਲਾ, ਸੁੰਦਰ। ਬਦਿ = {वद् to utter} ਬੋਲ, ਉੱਚਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Habita entonces sólo en el Único Nombre y tenlo en tu mente;"