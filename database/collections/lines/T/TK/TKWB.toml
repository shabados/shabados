data = "ਸੰਤਾ ਕੀ ਇਹ ਰੀਤਿ ਨਿਰਾਲੀ ॥"
page = 1085
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This is the strange way of the saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਦਾ ਇਹ ਅਨੋਖਾ ਤਰੀਕਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is the unique way of the Saints;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੀ ਤੋ ਇਹ ਰੀਤਿ ਨਿਰਾਲੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨਾਂ ਦੀ (ਦੁਨੀਆ ਦੇ ਲੋਕਾਂ ਨਾਲੋਂ) ਇਹ ਵੱਖਰੀ ਹੀ ਜੀਵਨ-ਚਾਲ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੀਤਿ = ਮਰਯਾਦਾ, ਜੀਵਨ-ਚਾਲ। ਨਿਰਾਲੀ = ਵੱਖਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tales son las Maravillas de las maneras de los Santos,"