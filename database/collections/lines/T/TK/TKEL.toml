[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈਸੇ. ਗਾਇ ਕਾ ਬਾਛਾ ਛੂਟਲਾ ॥"
page = 874
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the cow's calf, when untethered,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਜਦ ਗਾਂ ਦਾ ਵੱਛਾ ਛੁੱਟ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Like the cow's calf, which, when let loose,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਝੈਸੇ ਗਊ ਕਾ ਬਛਾ ਛੂਟ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ (ਜਦੋਂ) ਗਾਂ ਦਾ ਵੱਛਾ ਕਿੱਲੇ ਨਾਲੋਂ ਖੁਲ੍ਹਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛੂਟਲਾ = ਕਿੱਲੇ ਨਾਲੋਂ ਖੁਲ੍ਹ ਜਾਂਦਾ ਹੈ। ਬਾਛਾ = ਵੱਛਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como el becerro, cuando se le suelta,"