[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਘ ਕੀ ਛਾਇਆ ਜੈਸੇ ਬਰਤਨਹਾਰ ॥"
page = 1145
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Transient as the shade of the cloud is,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਆਰਜੀ ਹੈ ਬੱਦਲ ਦੀ ਛਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The shade from a cloud is transitory,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਮੇਘ) ਬਾਦਲ ਕੀ ਛਾਯਾ ਮੇਂ ਬਰਤਨਹਾਰ ਕੋ ਜੈਸੇ ਪਸਚਾਤਾਪ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਬੱਦਲਾਂ ਦੀ ਛਾਂ (ਨੂੰ ਟਿਕਵੀਂ ਛਾਂ ਸਮਝ ਕੇ ਉਸ) ਨਾਲ ਵਰਤਣ ਕਰਨਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੇਘ = ਬੱਦਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así también es la realidad del ser humano cuando vive en el apego y el error."