[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਿ ਉਤਰਿ ਜਾਹਿ; ਇਕ ਖਿਨਾਂ ॥੧॥ ਰਹਾਉ ॥"
page = 1169
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and thou shall cross over in an instant. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਤੇਰਾ ਇਕ ਨਿਮਖ ਵਿੱਚ ਪਾਰ ਉਤਾਰਾ ਹੋ ਜਾਵੇਗਾ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and you shall cross over to the other side in an instant. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਰ ਕੇ ਏਕ ਖਿਨ ਵਿਖੇ ਸੰਸਾਰ ਸਮੁੰਦ੍ਰ ਸੇ ਪਾਰ ਉਤਰ ਜਾਵੇਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਿਮਰਨ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਇਕ ਪਲ ਵਿਚ ਹੀ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘ ਜਾਹਿਂਗਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਕ ਖਿਨਾਂ = ਇਕ ਪਲ ਵਿਚ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "para que así seas llevado a través, de forma instantánea. (1-Pausa)"