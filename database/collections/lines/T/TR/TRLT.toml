[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਿਰੋ ਨ ਮਿਟੇ, ਆਵਣਿ ਜਾਣੇ ॥੨੧॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Neither sect shall find liberation from transmigration."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਇਕੁਰ (ਚਉਰਾਸੀ ਦਾ) ਆਵਾਗਉਣ ਕਿਸੇ ਦੇ ਸਿਰੋਂ ਨਾ ਮਿਟਿਆ।"