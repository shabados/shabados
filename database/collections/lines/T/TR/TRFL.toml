type = "primary"
data = "ਤਿਸੈ ਰਾਜ ਦੀਯੰ ॥੫॥"
page = 54

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He put on the garb of a sage (rishi) and gave his kingdom to the reciter (Amrit Rai)5."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਨ੍ਹਾਂ (ਕੁਸ਼-ਬੰਸੀਆਂ) ਨੂੰ ਰਾਜ ਦੇ ਦਿੱਤਾ ॥੫॥"