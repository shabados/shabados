[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਧਰਤੀ ਸਾਜੀਅਨੁ; ਆਪੇ ਆਕਾਸੁ ॥"
page = 302
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God Himself has made the earth and Himself the sky."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨੇ ਖੁਦ ਜਮੀਨ ਰਚੀ ਹੈ ਅਤੇ ਖੁਦ ਹੀ ਅਸਮਾਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself made the earth; He Himself made the sky."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਪ੍ਰਿਥ੍ਵੀ ਉਤਪਤ ਕਰੀ ਹੈ ਔਰ ਆਪ ਹੀ ਅਕਾਸ ਬਨਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ ਆਪ ਹੀ ਧਰਤੀ ਸਾਜੀ ਤੇ ਆਪ ਹੀ ਅਕਾਸ਼।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਜੀਅਨੁ = ਸਾਜੀ ਉਸ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú, de Ti Mismo, has creado la tierra y el cielo."