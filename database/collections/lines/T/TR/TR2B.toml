[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਤਤਾ ਸੀਅਰਾ ਹੋਇ ਜਲੁ; ਆਵਟਣੁ ਖਉਂਦਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In the form of water He Himself gets hot and cold."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਦੀ ਤੱਤਾ ਤੇ ਕਦੀ ਠੰਢਾ ਹੋਕੇ, ਜਲ (ਵਾਂਗ) ਕੜ੍ਹਨੀ ਸਹਾਰਦਾ ਹੈ।"