[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਤ ਕਰਹਿ ਮੁਨਿ ਜਨ ਸੇਵ ॥੬॥"
page = 837
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever serve Him the silent sages."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੋਨਧਾਰੀ ਰਿਸ਼ੀ ਸਦਾ ਹੀ ਉਸ ਦੀ ਘਾਲ ਕੁਮਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The silent sages constantly serve Him. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਹਰੀ ਕੀ ਸੇਵਾ ਮੁਨੀ ਜਨ ਨਿਤ ਹੀ ਕਰਤੇ ਹੈਂ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਰਿਸ਼ੀ ਮੁਨੀ ਉਸ ਦੀ ਸੇਵਾ-ਭਗਤੀ ਸਦਾ ਕਰਦੇ ਹਨ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਹਿ = ਕਰਹਿ, ਕਰਦੇ ਹਨ। ਸੇਵ = ਸੇਵਾ-ਭਗਤੀ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y los sabios y los videntes Te sirven siempre.(6)"