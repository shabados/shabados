[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੇ ਨਾਮ ਬਿਨਾ; ਜਗੁ ਧੰਧਾ ॥"
page = 358
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without God's name, the world is but a turmoil."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦੇ ਬਾਝੋਂ ਸੰਸਾਰ ਇੱਕ ਨਿਰਾਪੂਰਾ ਬਖੇੜਾ (ਖੱਪ ਖਾਨਾ) ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Name of the Lord, the world is in turmoil."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਕੇ ਨਾਮ ਬਿਨਾਂ ਜੀਵ ਸੰਸਾਰ ਕਾ ਧੰਧਾ ਕਰਤਾ ਮਰ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਨ ਤੋਂ ਬਿਨਾ ਜਗਤ ਦਾ ਮੋਹ (ਮਨੁੱਖ ਵਾਸਤੇ) ਉਲਝਣ ਹੀ ਉਲਝਣ ਬਣ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧੰਧਾ = ਝੰਬੇਲਾ, ਉਲਝਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Naam, el Nombre del Señor, el mundo es un tumulto."