[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਤਾ ਹੇਠਿ ਲਤਾੜੀਐ; ਅਜਰਾਵਰੁ ਘਾਹੁ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "As the grass is trampled under the feet,"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜਿੱਕੁਰ ਜਰਨ ਵਾਲਾ ਘਾਹ ਪੈਰਾਂ ਹੇਠ ਲਿਤਾੜੀਦਾ ਹੈ (ਪਰ ਆਪਣੇ ਸੁਭਾਉ ਨੂੰ ਨਹੀਂ ਛੱਡਦਾ)।"