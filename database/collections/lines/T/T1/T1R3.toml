[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਿਤੜੇ ਲਖ ਨਗਾਰਚੀ; ਕੇਤੜਿਆਂ ਢੋਲੀ ਸਹਨਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many are kettledrum and drum-beaters and many play on clarinets."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਲੱਖਾਂ ਹੀ ਨਗਾਰੇ ਵਾਲੇ ਤੇ ਕਿਤਨੇ ਹੀ ਢੋਲਾਂ ਤੂਤੀਆਂ ਵਾਲੇ ਹਨ।"