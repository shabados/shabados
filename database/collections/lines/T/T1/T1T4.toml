data = "ਆਦਿ ਅਨੀਲ ਅਨਾਦਿ ਅਸੰਭ ॥"
page = 1387

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is the Primal Power, without Blemish, without Beginning and Unborn"

[[content]]
