[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਉਸੁ ਮੈਲੁ; ਨ ਹਮ ਕਉ ਮੈਲਾ ॥"
page = 391
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Neither he has impurity, nor have I any filth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਂ ਉਸ ਵਿੱਚ ਅਪਵਿੱਤ੍ਰਤਾ ਹੈ, ਨਾਂ ਹੀ ਮੇਰੇ ਵਿੱਚ ਕੋਈ ਗੰਦਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has no impurities, so I have no impurities."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾ ਉਸਮੇਂ ਮੈਲੁ ਹੈ ਨ ਹਮ ਕੋ ਮੈਲਾ ਕਰਮੁ ਸਪਰਸ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਾਡੇ ਅਸਲੇ) ਉਸ ਪਰਮਾਤਮਾ ਨੂੰ ਵਿਕਾਰਾਂ ਦੀ ਮੈਲ ਨਹੀਂ ਲੱਗ ਸਕਦੀ, ਸਾਨੂੰ ਭੀ ਮੈਲ ਨਹੀਂ ਲੱਗਣੀ ਚਾਹੀਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como Él es Inmaculado, así yo estoy sin mancha."