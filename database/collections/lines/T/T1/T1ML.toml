[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਾਚ ਔਰ ਝੂਠ ਕਹੇ ਬਹੁਤੈ ਬਿਧਿ; ਕਾਮ ਕਰੋਧ ਅਨੇਕ ਕਮਾਏ ॥"
page = 675

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The being, in many ways, speaking both truth and falsehood, absorbed himself in lust and anger"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਚ ਅਤੇ ਝੂਠ ਬਹੁਤ ਤਰ੍ਹਾਂ ਨਾਲ ਕਹੇ ਹਨ ਅਤੇ ਅਨੇਕਾਂ ਕਾਮ ਅਤੇ ਕ੍ਰੋਧ (ਵਾਲੇ ਕੰਮ) ਕੀਤੇ ਹਨ।"