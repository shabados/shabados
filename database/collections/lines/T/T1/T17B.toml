[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਤਾਰ ਕਰੁਣਾ ਮੈ; ਦੀਨੁ ਬੇਨਤੀ ਕਰੈ ॥"
page = 267
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Creator, embodiment of compassion, I humble make a supplication,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਹਿਮਤ ਦੇ ਪੁੰਜ, ਸਿਰਜਣਹਾਰ, ਮੈਂ ਮਸਕੀਨ ਬੇਨਤੀ ਕਰਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Creator, Lord of Mercy - Your humble servant prays;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਰਤਾਰ ਕਰਣਾ ਰੂਪੁ! ਮੈਂ ਜਨ ਤੇਰੇ ਆਗੇ ਦੀਨ ਹੋ ਕਰ ਬੇਨਤੀ ਕਰਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਰਤਾਰ! ਹੇ ਦਇਆ ਦੇ ਸਾਗਰ! (ਇਹ) ਨਿਮਾਣਾ ਦਾਸ ਬੇਨਤੀ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰੁਣਾ = ਤਰਸ। ਕਰੁਣਾ ਮੈ = ਤਰਸਵਾਨ, ਦਇਆ ਕਰਨ ਵਾਲਾ (Note = Skt. मय (ਪੰਜਾਬੀ 'ਮੈ') is an affix used to indicate 'made of, consisting of.' 'full of')। ਦੀਨੁ = ਨਿਮਾਣਾ (ਜੀਵ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Creador, Señor de Misericordia, yo que soy Tu Humilde Servidor"