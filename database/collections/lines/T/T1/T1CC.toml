type = "primary"
data = "ਸੁ ਕਬੋ ਤਹ ਅਛ੍ਰ ਬਨਾ ਕਹੀਯੋ ॥੬॥"
page = 200

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "If there is any lapses on part, for that I am answerable, therefore, O Lord! Grant me strength to compose this poem in appropriate language.6."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਵੀਓ! ਤੁਸੀਂ ਅੱਖਰਾਂ ਨੂੰ ਸੰਵਾਰ ਕੇ ਕਥਨ ਕਰ ਲੈਣਾ ॥੬॥"