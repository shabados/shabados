[[content]]
assets = ["SSKS"]
type = "primary"
data = "ਜੈਸੇ ਤਾਤ ਮਾਤ ਗ੍ਰਿਹ ਜਨਮਤ ਸੁਤ ਘਨੇ; ਸਕਲ ਨ ਹੋਤ ਸਮਸਰ ਗੁਨ ਗਥ ਜੀ ॥"

[[content]]
assets = ["SSPK"]
type = "translation"
language = "en"
data = "Just as several sons are born to a parent, but all are not virtuous to the same extent."

[[content]]
assets = ["SSSK"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਮਾਂ ਬਾਪ ਦੇ ਘਰ ਅਨੇਕ ਪੁਤ੍ਰ ਜੰਮਦੇ ਹਨ, ਪਰ ਸਾਰੇ ਗੁਣਾਂ ਦੀ ਪੂੰਜੀ ਵਿਚ ਇਕੋ ਜਿਹੇ ਨਹੀਂ ਹੁੰਦੇ।"