[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ; ਜਿਹ ਆਪਿ ਦਿਵਾਏ ॥"
page = 254
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "whom the Lord Himself mercifully gives."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਸੁਆਮੀ ਖੁਦ ਮਿਹਰ ਧਾਰ ਕੇ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "whom the Lord blesses with His Mercy;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਪਰਮੇਸ੍ਵਰ ਨੇ ਕ੍ਰਿਪਾ ਦ੍ਰਿਸਟੀ ਕਰ ਕੇ ਗੁਰਾਂ ਪਾਸੋਂ ਆਪ ਦਿਵਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੂੰ ਪ੍ਰਭੂ ਨੇ ਮਿਹਰ ਕਰ ਕੇ ਇਹ  ਦਾਤ ਦਿੱਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aquél que tenga la Gracia del Señor."