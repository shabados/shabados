[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਥਮੇ ਵਸਿਆ; ਸਤ ਕਾ ਖੇੜਾ ॥"
page = 886
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the first True-age, the town of truth was inhabited."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਹਿਲੇ ਸਤਿਯੁਗ ਵਿੱਚ ਸੱਚ ਦਾ ਪਿੰਡ ਆਬਾਦ ਹੋਇਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the first age, the Golden Age, the village of truth was inhabited."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਹਲੇ, ਭਾਵ ਸਤਜੁਗ ਮੇਂ⁽¹⁾ ਸੱਤ ਕਾ ਨਗਰੁ ਬਸਾ ਥਾ, ਭਾਵ ਸਭ ਕੋਈ ਸਚ ਬੋਲਤਾ ਥਾ ਅਰ ਧਰਮ ਕੇ ਚਾਰ ਚਰਨ ਥੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਜੋਗੀ! ਤੂੰ ਇਹੀ ਸਮਝਦਾ ਆ ਰਿਹਾ ਹੈਂ ਕਿ) ਪਹਿਲੇ ਜੁਗ (ਸਤਜੁਗ) ਵਿਚ ਦਾਨ ਦਾ ਨਗਰ ਵੱਸਦਾ ਸੀ (ਭਾਵ, ਦਾਨ ਕਰਨ ਦਾ ਕਰਮ ਪ੍ਰਧਾਨ ਸੀ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਥਮੇ = ਪਹਿਲੇ (ਜੁਗ ਵਿਚ) ਸਤਜੁਗ ਵਿਚ। ਖੇੜਾ = ਨਗਰ। ਸਤ = ਦਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En la Satia Yug la Villa de la Verdad fue habitada,"