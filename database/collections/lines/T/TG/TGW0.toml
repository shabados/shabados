[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਪਿਯੋ ਖੰਡ ਨਵੇ ਬ੍ਰਹਮੰਡਾ ॥"
page = 185

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The mighty warriors began to fall as bits and the nine regions of the world trembled."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨੌਂ ਖੰਡਾਂ ਵਾਲਾ ਬ੍ਰਹਿਮੰਡ ਕੰਬਣ ਲਗਿਆ"