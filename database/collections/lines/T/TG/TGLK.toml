[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭੁ ਨਾਵੈ ਨੋ; ਪਰਤਾਪਦਾ ॥"
page = 71
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Every one Longs for Thy Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਕੋਈ ਤੇਰੇ ਨਾਮ ਨੂੰ ਲੋਚਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everyone longs for Your Name,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਕੋਈ ਤੇਰੇ ਹੀ ਨਾਮ ਕੋ (ਪਰਤਾਪਦਾ) ਚਾਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰੇਕ ਜੀਵ ਉਸ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਲਈ ਤਾਂਘਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਵੈ ਨੋ = (ਪ੍ਰਭੂ ਦੇ) ਨਾਮ ਨੂੰ। ਸਭੁ = ਹਰੇਕ ਜੀਵ। ਪਰਤਾਪਦਾ = ਲੋਚਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "todos añoran Tu Nombre."