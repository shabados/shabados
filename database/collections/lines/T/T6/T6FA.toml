data = "ਜਨ ਹ੍ਵੈ ਨਾਰਿ ਭਵਨ ਤਿਹ ਬਸੀ ॥"
page = 840

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "As if she was his own spouse."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ (ਉਸ ਦੀ) ਨਾਰੀ ਹੋ ਕੇ ਉਸ ਦੇ ਘਰ ਵਿਚ ਹੀ ਵਸਦੀ ਹੋਵੇ।"