[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ ਪ੍ਰਭਿ ਰਾਖੇ ॥"
page = 622
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord has mercifully preserved me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿਹਰਬਾਨੀ ਕਰਕੇ, ਸਾਈਂ ਨੇ ਮੇਰੀ ਰੱਖਿਆ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In His Mercy, God has protected and preserved me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਰਪਾ ਕਰ ਕੇ ਪ੍ਰਭੂ ਨੇ ਰਾਖ ਲੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ ਕਿਰਪਾ ਕਰ ਕੇ ਜਿਨ੍ਹਾਂ ਦੀ ਰੱਖਿਆ ਕੀਤੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Su Misericordia, el Señor me ha salvado y he sido liberado"