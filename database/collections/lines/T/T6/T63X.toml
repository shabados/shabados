[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਘਾਉ ਕੈ ਸੁੰਭ ਕੈ ਗਾਤ ਬਿਖੈ; ਇਮ ਬੋਲਿ ਉਠਿਓ ਹਸਿ, ਸਿੰਧ ਜਰਾ ਜੈ ॥"
page = 449

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Shiva fell down with the blow of the dagger"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ਿਵ ਦੇ ਸ਼ਰੀਰ ਵਿਚ ਘਾਉ ਲਗਾ ਕੇ (ਰਾਜਾ) ਹਸ ਕੇ ਬੋਲ ਉਠਿਆ, 'ਜਰਾਸੰਧ ਦੀ ਜੈ'।"