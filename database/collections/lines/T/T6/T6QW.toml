type = "primary"
data = "ਕਥਿ ਸਕੈ ਕੌਨ ॥੮੯॥"
page = 621

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In his extreme sorrow on the demise of his sons, the king left for heaven and after him, there were several other kings, who can describe them?89."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਨ੍ਹਾਂ ਦਾ) ਕਥਨ ਕੌਣ ਕਰ ਸਕਦਾ ਹੈ? ॥੮੯॥"