[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਬਦੁ ਚੀਨੑਿ; ਫਿਰਿ ਲਗੈ ਨ. ਪੀਰ ॥"
page = 842
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Contemplate thou the Name and pain shall overtake thee not,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਾਹਿਬ ਦੇ ਨਾਮ ਦਾ ਮਿਮਰਨ ਕਰ, ਅਤੇ ਪੀੜ ਤੈਨੂੰ ਨਹੀਂ ਵਾਪਰੇਗੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remember the Word of the Shabad, and you shall never suffer pain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸਬਦੁ) ਬ੍ਰਹਮ ਕੋ (ਚੀਨਿ) ਜਾਣਤਾ ਹੈ, ਯਾਂ ਤੇ ਫਿਰ ਪੀੜਾ ਨਹੀਂ ਲਾਗਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਨਾਲ ਡੂੰਘੀ ਸਾਂਝ ਪਾ ਕੇ ਉਸ ਨੂੰ (ਕਾਮਾਦਿਕ ਵੈਰੀ ਤੋਂ ਕੋਈ) ਕਲੇਸ਼ ਨਹੀਂ ਪੋਹ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੀਨ੍ਹ੍ਹਿ = ਪਛਾਣ ਕੇ, ਸਾਂਝ ਪਾ ਕੇ। ਪੀਰ = (ਵਿਕਾਰਾਂ ਤੋਂ) ਕਲੇਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, aquél que medita en la Palabra del Shabd, no se topa con el dolor."