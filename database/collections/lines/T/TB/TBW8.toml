[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਾਉ ਭੂਖਨ ਕੋ ਕਹੈ, ਬਿਧ ਤੇ ਨ ਜਾਤ ਬਤਾਇ ॥੪੮॥"
page = 204

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The garments studded with diamonds and the saddles of horses studded with gems cannot be enumerated and even Brahma cannot describe the grandeur of the ornaments.48."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਗਹਿਣਿਆਂ ਦੀ ਮਹਿਮਾ ਕੌਣ ਕਹਿ ਸਕਦਾ ਹੈ, ਬ੍ਰਹਮਾ ਤੋਂ ਵੀ ਦੱਸੀ ਨਹੀਂ ਜਾ ਸਕਦੀ ॥੪੮॥"