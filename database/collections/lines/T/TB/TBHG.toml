[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਮ ਤੁਮ ਸੰਗਿ; ਝੂਠੇ ਸਭਿ ਬੋਲਾ ॥"
page = 1005
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "False is his entire talk, with me and thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੂੜੇ ਹਨ, ਉਸ ਦੇ ਸਮੂਹ ਬਚਨ-ਬਿਲਾਸ, ਮੇਰੇ ਅਤੇ ਤੇਰੇ ਨਾਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "False is all his talk of me and you."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ ਤੁਮ, ਭਾਵ ਸਭ ਕੇ ਸਾਥ ਝੂਠੇ ਬਚਨ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰੀ ਸਾਥੀਆਂ ਨਾਲ (ਸਾਥ ਨਿਬਾਹੁਣ ਵਾਲੇ) ਸਾਰੇ ਬੋਲ ਝੂਠ ਹੀ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਮ ਤੁਮ ਸੰਗਿ = ਅਸਾਂ ਤੁਸਾਂ ਨਾਲ, ਸਭ ਲੋਕਾਂ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Hablar de mí y ti es falso,"