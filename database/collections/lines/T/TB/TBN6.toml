data = "ਇਸ ਨੋ ਵਿਆਪੈ; ਸੋਗ ਸੰਤਾਪੁ ॥"
page = 1343
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It is afflicted by sorrow and suffering."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਨੂੰ ਅਫਸੋਸ ਅਤੇ ਕਲੇਸ਼ ਸਤਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It is afflicted by sorrow and suffering."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਕੇ ਅਭਿਮਾਨ ਕਰ ਕੇ ਇਸ ਜੀਵਨ ਕੋ ਸੋਕ ਸੰਤਾਪ ਵਿਆਪੇ ਹੂਏ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ (ਸਰੀਰ) ਨੂੰ ਚਿੰਤਾ-ਫ਼ਿਕਰ ਤੇ ਦੁੱਖ-ਕਲੇਸ਼ ਦਬਾਈ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "afligido por la tristeza y el sufrimiento;"