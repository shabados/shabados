[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਨਾ ਤਿਸੁ ਭਾਰੇ ਪਰਬਤਾਂ; ਅਸਮਾਨ ਖਹੰਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The sky-touching mountains also are not of much weight (than the ungrateful person)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ (ਭਾਵ ਧਰਤੀ ਨੁੰ) ਪਰਬਤ ਜਿਹੜੇ ਅਸਮਾਨ ਨਾਲ ਖਹਿੰਦੇ ਹਨ ਭਾਰੇ ਨਹੀਂ ਜਾਪਦੇ।"