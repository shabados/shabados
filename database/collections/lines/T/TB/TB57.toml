[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਠਾਕੁਰ ਕਉ; ਸੇਵਕੁ ਜਾਨੈ ਸੰਗਿ ॥"
page = 285
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The slave knows that his Lord is ever with him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੋਲਾ ਜਾਣਦਾ ਹੈ ਕਿ ਉਸ ਦਾ ਸੁਆਮੀ ਹਮੇਸ਼ਾਂ ਉਸ ਦੇ ਨਾਲ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The servant of the Lord Master knows that the Lord is with him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਠਾਕਰ ਕਾ ਸੇਵਕ ਆਪਨੇ ਸ੍ਵਾਮੀ ਕੌ ਸਦਾ ਸਾਥ ਜਾਨਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੇਵਕ ਆਪਣੇ ਮਾਲਕ-ਪ੍ਰਭੂ ਨੂੰ (ਹਰ ਵੇਲੇ ਆਪਣੇ) ਨਾਲ ਜਾਣਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਸੰਗਿ = (ਆਪਣੇ) ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Siente que el Maestro está siempre a su lado."