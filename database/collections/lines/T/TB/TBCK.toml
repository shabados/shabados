[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਿਨਹਿ ਬਿਕਾਰ ਕਰਤ; ਸ੍ਰਮੁ ਪਾਇਓ ॥"
page = 299
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He practises evil day and night, and gets tried out."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਦਿਹੁੰ ਰੈਣ ਬਦੀ ਕਮਾਉਂਦਾ ਹੈ ਅਤੇ ਹਾਰ ਹੁੱਟ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By day, people practice corruption, wearing themselves out."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਭਰ ਬਿਕਾਰ ਕਰਤਾ ਹੂਆ ਕਸ੍ਟ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਿੰਨਾਂ ਤਾਪਾਂ ਦੇ ਅਸਰ ਹੇਠ ਮਨੁੱਖ) ਸਾਰਾ ਦਿਨ ਵਿਅਰਥ ਕੰਮ ਕਰਦਾ ਕਰਦਾ ਥੱਕ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਿਨਹਿ = ਦਿਨ ਵੇਲੇ। ਸ੍ਰਮੁ = ਥਕੇਵਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En el día practica la maldad y en ello se exhausta,"