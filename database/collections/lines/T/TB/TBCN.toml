[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤਿ ਵਛਲ; ਭੈ ਕਾਟਣਹਾਰੇ ॥"
page = 685
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God is the Lover of His saints and the Destroyer of dread."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਆਪਣੇ ਸੰਤਾਂ ਦਾ ਪ੍ਰੀਤਵਾਨ ਅਤੇ ਡਰ ਨਾਸ ਕਰਨਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is the Lover of His devotees, the Destroyer of fear."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭਗਤੋਂ ਕੇ ਪਿਆਰੇ ਭੈ ਕੇ ਕਾਟਣੇ ਅਰਥਾਤ ਦੂਰ ਕਰਨੇਹਾਰੇ ਵਾਹਿਗੁਰੂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ (ਆਪਣੇ ਸੇਵਕਾਂ ਦੀ) ਭਗਤੀ ਨਾਲ ਪ੍ਰੇਮ ਕਰਦਾ ਹੈ, ਉਹਨਾਂ ਦੇ ਸਾਰੇ ਡਰ ਦੂਰ ਕਰਨ ਦੇ ਸਮਰੱਥ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el Amante de Sus Devotos, el Desvanecedor del miedo,"