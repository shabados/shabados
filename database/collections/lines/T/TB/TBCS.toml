[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁਤ ਬਾਲਕ ਤਰੁਨੀ ਤ੍ਰਿਯਾ ਤੈ ਤ︀ਯਾਗਤ ਸਭ ਸਾਜ ॥"
page = 905

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘You are leaving behind your offspring, son, and youthful wife,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੁਸੀਂ ਪੁੱਤਰ, ਬਾਲਕ, ਨੌਜਵਾਨ ਇਸਤਰੀ ਅਤੇ ਠਾਠ ਬਾਠ ਛਡ ਰਹੇ ਹੋ।"