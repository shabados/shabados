[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮਹਿ ਚਿਤਵਉ. ਚਿਤਵਨੀ; ਉਦਮੁ ਕਰਉ ਉਠਿ ਨੀਤ ॥"
page = 519
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within my mind, I think of the idea of ever rising early and making an effort."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਚਿੱਤ ਅੰਦਰ ਮੈਂ ਹਮੇਸ਼ਾਂ ਸਾਜਰੇ (ਅੰਮ੍ਰਿਤ ਵੇਲੇ) ਉਠਣ ਅਤੇ ਉਪਰਾਲਾ ਕਰਨ ਦੀ ਸੋਚ ਸੋਚਦਾ ਹਾਂ ਕਿ-।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Within my mind, I think thoughts of always rising early, and making the effort."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਮਨ ਮੇਂ ਤੇਰੇ ਗੁਣੋਂ ਕੀ ਚਿਤਵਨੀ ਕਰੂੰ ਅਰ ਨਿਤ੍ਯ ਪ੍ਰਾਤ ਕਾਲ ਉਠ ਕਰ ਤੇਰੇ ਨਾਮ ਜਪਨੇ ਕਾ ਉਦਮ ਕਰੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਮਨ ਵਿਚ (ਇਹ) ਸੋਚਦਾ ਹਾਂ ਕਿ ਨਿੱਤ (ਸਵੇਰੇ) ਉੱਠ ਕੇ ਉੱਦਮ ਕਰਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਿਤਵਉ = ਮੈਂ ਸੋਚਦਾ ਹਾਂ। ਚਿਤਵਨੀ = ਸੋਚ। ਕਰਉ = ਕਰਾਂ। ਉਠਿ = ਉੱਠ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Este es el deseo querido de mi mente, de que pueda hacer un esfuerzo"