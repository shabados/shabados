data = "ਚੱਤ੍ਰ ਚੱਕ੍ਰ ਕਾਲੇ ॥੯੭॥"
page = 6
line = 6

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "\"ਚੱਤ੍ਰ\" ਦਾ ਉਚਾਰਨ \"ਤ\" ਤੇ ਔਂਕੜ ਸਹਿਤ ਕਰਨਾ ਹੈ।"

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O the Destroyer Lord of all the four directions!97."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਭ ਦਾ ਨਾਸ਼ ਕਰਨ ਵਾਲਾ ਹੈਂ ॥੯੭॥"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਚੱਤ੍ਰੁ ਚੱਕ੍ਰ, ਕਾਲੇ ॥੯੭॥"