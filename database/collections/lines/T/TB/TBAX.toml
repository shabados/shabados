type = "primary"
data = "ਕਾਹੂ ਕਹਾ ਮਿਤ੍ਰ ਕੀ ਨ੍ਰਯਾਈ ॥"
page = 880

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He presented gold-coins to some and to some he extended his hand in friendship."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਨੂੰ ਮਿਤਰਤਾ ਦਾ ਵਾਸਤਾ ਪਾਇਆ।"