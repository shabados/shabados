[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਓਹੁ ਬਢੈ; ਨ ਘਟਤਾ ਜਾਇ ॥"
page = 343
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord neither increases nor decrease,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਨਾਂ ਵਧਦਾ ਹੈ ਅਤੇ ਨਾਂ ਹੀ ਘਟਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God does not increase or decrease."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾ ਵਹੁ ਬਢਤਾ ਹੈ ਨਾ ਘਟਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮ (ਇਸ ਮਾਇਆ ਦੇ ਵਿਚ) ਹਰੇਕ ਦੇ ਨਾਲ ਵੱਸ ਰਿਹਾ ਹੈ, ਉਹ ਕਦੇ ਵਧਦਾ ਘਟਦਾ ਨਹੀਂ ਹੈ, ਸਦਾ ਇਕੋ ਜਿਹਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero aquél que ama a su Inmaculado Señor Sin Casta,"