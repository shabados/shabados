[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਝ ਬਿਨੁ; ਦੂਜਾ ਕੋਇ ਨਾਹਿ ॥"
page = 1181
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "without thee, there is no one else."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਬਗੈਰ ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Other than You, there is no one at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਬਿਨਾਂ ਹੋਰ ਦੂਸਰਾ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੈਥੋਂ ਬਿਨਾ ਮੈਨੂੰ ਕੋਈ ਹੋਰ (ਆਸਰਾ) ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, todo eres Tú, sí,"