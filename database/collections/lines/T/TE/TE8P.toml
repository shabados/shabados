[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿੰਦਕ ਟਿਕਨੁ. ਨ ਪਾਵਨਿ ਮੂਲੇ; ਊਡਿ ਗਏ ਬੇਕਾਰ ॥੧॥ ਰਹਾਉ ॥"
page = 683
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The slanderers are not permitted to stay, they are rooted out as useless. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੂਸ਼ਨ ਲਾਉਣ ਵਾਲਿਆਂ ਨੂੰ ਕਦਾਚਿਤ ਠਹਿਰਨ ਨਹੀਂ ਦਿੱਤਾ ਜਾਂਦਾ। ਉਹ ਵਿਆਰਥ ਹੀ ਬਰਬਾਦ ਹੋ ਜਾਂਦੇ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slanderers are not allowed to stay; they are pulled out by their roots, like useless weeds. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਤੇ ਨਿੰਦਕ ਮੂਲ ਤੇ ਹੀ ਟਿਕਣਾ ਨਹੀਂ ਪਾਵਤੇ ਹੈਂ ਅਰ ਸਰਬ ਵਿਕਾਰ ਭੀ ਉਡ ਗਏ, ਭਾਵ ਦੂਰ ਭਏ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹਨਾਂ ਦੀ) ਨਿੰਦਾ ਕਰਨ ਵਾਲੇ ਉਹਨਾਂ ਦੇ ਟਾਕਰੇ ਤੇ ਉੱਕਾ ਹੀ ਅੜ ਨਹੀਂ ਸਕਦੇ। (ਜਿਵੇਂ ਹਵਾ ਦੇ ਅੱਗੇ ਬੱਦਲ ਉੱਡ ਜਾਂਦੇ ਹਨ ਤਿਵੇਂ ਉਹ ਨਿੰਦਕ ਸੇਵਕਾਂ ਦੇ ਟਾਕਰੇ ਤੇ ਸਦਾ) ਨਕਾਰੇ ਹੋ ਕੇ ਉੱਡ ਗਏ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਟਿਕਨੁ ਨ ਪਾਵਨਿ = (ਸੇਵਕ ਦੇ ਟਾਕਰੇ ਤੇ) ਟਿਕਾਉ ਹਾਸਲ ਨਹੀਂ ਕਰ ਸਕਦੇ, ਅੜ ਨਹੀਂ ਸਕਦੇ। ਮੂਲੇ = ਉੱਕਾ ਹੀ। ਬੇਕਾਰ = ਨਕਾਰਾ (ਹੋ ਕੇ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Paz y desperdician sus vidas en vano. (1-Pausa)"