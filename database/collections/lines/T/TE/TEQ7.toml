[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਹੀ ਨਗਰੀ ਊਤਮ ਥਾਨਾ ॥"
page = 1039
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the sublime place of the body village,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਰੀਰ (ਪਿੰਡ) ਦੇ ਸ਼੍ਰੇਸ਼ਟ ਅਸਥਾਨ ਅੰਦਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the body-village, the most sublime place,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਦੇਹ ਨਗਰ ਮੇਂ ਉਤਮ (ਥਾਨਾ) ਸਰੂਪ ਜੋ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖਾ ਸਰੀਰ, ਮਾਨੋ, ਇਕ ਸ਼ਹਿਰ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਹੀ = ਸਰੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, eres Inmortal, el Purusha, sobre Tu Cabeza la muerte no se acerca."