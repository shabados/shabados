[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦੀ ਦੇਵਣਹਾਰੁ ॥"
page = 363
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The merciful Guru is the giver of gifts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿਹਰਬਾਨ ਗੁਰੂ ਦਾਤਾਂ ਦੇਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, the Great Giver blesses us;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰ ਗੁਰੂ ਕ੍ਰਿਪਾ ਕਰ ਇਨ ਰਤਨੋਂ ਕੇ ਦੇਨੇ ਹਾਰੇ ਬਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਦੀ ਰਾਹੀਂ ਉਹ ਪ੍ਰਭੂ-ਦਾਤਾਰ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੇ ਕੀਮਤੀ ਰਤਨ ਜਵਾਹਰ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਸਾਦੀ = ਪਰਸਾਦਿ, ਕਿਰਪਾ ਦੀ ਰਾਹੀਂ। ਦੇਵਣਹਾਰੁ = ਦੇਣ ਦੀ ਸਮਰੱਥਾ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, el Señor, nos bendice a todos a través de la Gracia del Guru;"