[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਜਮਿ ਬਪੁਰੀ ਹੈ ਹੇਰੀ ॥੨॥"
page = 655
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou, O wretched maid, art spied by death."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੈਨੂੰ ਹੇ ਨਿਕਰਮਣ! ਮੌਤ ਤੱਕ ਰਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Death is watching you, O wretched woman. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਤੇ ਜਮ ਨੇ ਤੂੰ (ਬਪੁਰੀ) ਨਿਰਮਲ ਦੇਖੀ ਹੈ, ਭਾਵ ਸੇ ਤੁਝ ਕੋ ਮਾਰਨੇ ਕੋ ਜਮ ਦੇਖ ਰਹਾ ਹੈ; ਵਾ ਹੇ ਬਚਾਰੀ ਗਰੀਬਣੀ! ਤੂੰ ਜਮ ਨੇ ਦੇਖੀ ਹੈਂ॥੨॥☬ਬੁਧੀ ਉਤ੍ਰ ਦੇਤੀ ਹੈ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਗ-ਹੀਣ! ਤੈਨੂੰ ਜਮ ਨੇ ਆਪਣੀ ਤੱਕ ਵਿਚ ਰੱਖਿਆ ਹੋਇਆ ਹੈ (ਭਾਵ, ਮੌਤ ਆਇਆਂ ਫਿਰ ਪਤਾ ਨਹੀਂ ਕਿਸ ਲੰਮੇ ਗੇੜ ਵਿਚ ਪੈ ਜਾਇਂਗੀ) ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੂ ਬਪੁਰੀ = ਤੈਨੂੰ ਨਿਮਾਣੀ ਨੂੰ। ਜਮਿ = ਜਮ ਨੇ। ਹੇਰੀ = ਤੱਕ ਵਿਚ ਰੱਖਿਆ ਹੋਇਆ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues la muerte te asecha constantemente? (2)"