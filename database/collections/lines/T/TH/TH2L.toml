data = "ਰਾਨੀ ਕਰਹੁ ਨ ਚਿੰਤ ਹਮਾਰੀ ॥"
page = 900

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then the paramour narrated, ‘Rani, don’t worry about me."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਣੀ! ਤੁਸੀਂ ਮੇਰੀ ਚਿੰਤਾ ਨਾ ਕਰੋ।"