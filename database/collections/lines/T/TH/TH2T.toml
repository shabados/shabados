[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੈ ਤਕੀਐ; ਨਾਮਿ ਅਧਾਰੇ ॥"
page = 118
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He has the support of the Guru and the main-stay of the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਗੁਰਾਂ ਦਾ ਆਸਰਾ ਅਤੇ ਨਾਮ ਦੀ ਓਟ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru is their cushion, and the Naam, the Name of the Lord, is their Support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਗੁਰੋਂ ਕੇ ਆਸਰੇ ਹੋ ਕਰ ਨਾਮ ਕਾ ਅਧਾਰੁ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦਾ ਆਸਰਾ ਲੈ ਕੇ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੀ ਰਾਹੀਂ (ਅਜਿਹਾ ਸੰਭਵ ਹੈ।)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਕੀਐ = ਆਸਰੇ। ਨਾਮਿ = ਨਾਮ ਵਿਚ। ਅਧਾਰੇ = ਆਸਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y es por la enseñanza del Guru, que ellos aprenden a apoyarse sólo en el Nombre del Señor."