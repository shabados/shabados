[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੈ ਜੇਵਡੁ. ਮੈ ਨਾਹਿ ਕੋ; ਸਭੁ ਜਗੁ ਡਿਠਾ ਹੰਢਿ ॥੫॥"
page = 1378
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As great as Thou, O Lord, I have found none. I have seen and searched the whole world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਜਿਡਾ ਵੱਡਾ ਹੇ ਪ੍ਰਭੂ! ਮੈਨੂੰ ਕੋਈ ਨਹੀਂ ਲੱਭਾ। ਮੈਂ ਸਾਰਾ ਸੰਸਾਰ ਵੇਖਿਆ ਅਤੇ ਢੁੰਡਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have found none as great as You, Lord; I have looked and searched throughout the world. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਨੇ ਸੰਪੂਰਨ ਜਗਤ (ਹੰਡਿ) ਫਿਰਕੇ ਦੇਖ ਲੀਆ ਹੈ, ਮੈਨੂੰ ਤਿਸ ਪਤੀ ਜੈਸਾ ਬਡਾ ਪ੍ਰੀਤਮ ਕੋਈ ਪ੍ਰਤੀਤ ਨਹੀਂ ਹੋਤਾ ਹੈ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਸਾਂਈਂ!) ਮੈਂ ਸਾਰਾ ਜਗਤ ਫਿਰ ਕੇ ਵੇਖ ਲਿਆ ਹੈ, ਤੇਰੇ ਵਰਗਾ (ਸਾਥੀ) ਮੈਨੂੰ ਹੋਰ ਕੋਈ ਨਹੀਂ ਲੱਭਾ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੈ ਜੇਵਡੁ = ਤੇਰੇ ਜੇਡਾ। ਹੰਢਿ = ਫਿਰ ਕੇ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no he encontrado a nadie tan Grandioso como Tú, Señor, me he cansado de buscar por el mundo. (5)"