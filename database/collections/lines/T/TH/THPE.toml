[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਮਾ ਰਾ; ਏਕੁ ਆਸ ਵਸੇ ॥"
page = 144
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hopes of all abide in the one Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਦੀ ਊਮੀਦ ਇੱਕ ਸੁਆਮੀ ਅੰਦਰ ਵੱਸਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The hopes of all rest in the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਹਮਾ ਰਾ) ਤਮਾਮ ਕੋ ਏਕ ਤੇਰੀ ਆਸ (ਵਸੇ) ਬਹੁਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਭ ਜੀਵਾਂ ਨੂੰ, ਬੱਸ, ਇਕ ਪ੍ਰਭੂ ਦੀ ਆਸ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਮਾ = (ਹਮਹ) ਸਭ। ਰਾ = (ਫ:) ਨੂੰ। ਵਸੇ = ਬੱਸ, ਕਾਫ਼ੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque todos se apoyan en Su Soporte."