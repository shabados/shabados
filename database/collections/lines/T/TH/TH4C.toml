[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਸੁਘੜੁ ਸਰੂਪੁ ਸਿਆਣਾ ॥"
page = 1021
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself is Omniscient beauteous and wise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪ ਹੀ ਸਰਬਗ, ਸੋਹਣਾ-ਸੁਨੱਖਾ ਅਤੇ ਅਕਲਮੰਦ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is all-wise, beautiful and all-knowing."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਹੀ ਸੁੰਦ੍ਰ ਸਰੂਪ ਸਿਆਣਾ ਅਤੀ ਚਤੁਰ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਸੁਚੱਜਾ ਸੋਹਣਾ ਤੇ ਸਿਆਣਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਘੜੁ = ਸੋਹਣੀ ਘਾੜਤ ਵਾਲਾ, ਸੁਚੱਜਾ। ਸਰੂਪੁ = ਸੋਹਣੇ ਰੂਪ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todo Sabio, Bien Proporcionado y de Bella Forma."