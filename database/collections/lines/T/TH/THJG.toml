[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਹਿ ਤ ਸਾਚਾ; ਏਕੁ ਮੁਰਾਰੇ ॥"
page = 567
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They meditate on the one True Lord, the enemy of pride."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਹੰਕਾਰ ਦੇ ਵੈਰੀ ਸਾਹਿਬ ਦਾ ਸਿਮਰਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They meditate on the One True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਚਾ ਮੁਰਾਰੀ! ਜੌ ਜਪਤੇ ਹੈਂ ਤੌ ਏਕ ਤੁਝ ਹੀ ਕੋ ਜਪਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਦਾ ਤੈਨੂੰ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਨੂੰ ਸਿਮਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚਾ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ। ਮੁਰਾਰੇ = {मुर = अरि} ਪਰਮਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ellos cantan el Kirtan de Tu Alabanza parados a Tu Puerta. Habitan sólo en Ti,"