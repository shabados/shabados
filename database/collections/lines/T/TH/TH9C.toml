[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਮੋਹੁ; ਗੁਰ ਸਬਦਿ ਜਲਾਏ ॥"
page = 412
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who burns the love for wealth, under Guru's instruction,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਧਨ-ਦੌਲਤ ਦੇ ਪਿਆਰ ਨੂੰ ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਤਾਬੇ ਸਾੜ ਸੁਟਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who burns away his attachment to Maya, by the Word of the Guru's Shabad,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਨੋਂ ਨੇ ਮਾਇਆ ਕਾ ਮੋਹ ਗੁਰ ਉਪਦੇਸ ਕਰ ਕੇ ਜਲਾਇ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਵਿਚ (ਜੁੜ ਕੇ ਆਪਣੇ ਅੰਦਰੋਂ) ਮਾਇਆ ਦਾ ਮੋਹ ਸਾੜ ਦੇਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਬਦਿ = ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Palabra del Guru consume a Maya y a la infatuación,"