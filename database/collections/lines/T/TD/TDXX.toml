[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹ ਕੀਰਤਨੁ ਹਰੀਆ ॥"
page = 537
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "wherein God's praises are hymned."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਵਿੱਚ ਵਾਹਿਗੁਰੂ ਦੀਆਂ ਸਿਫ਼ਤ-ਸ਼ਲਾਘਾ ਗਾਇਨ ਕੀਤੀਆਂ ਜਾਂਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "where the Kirtan of the Lord's Praises are sung."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਹਾਂ ਹਰਿ ਕਾ ਕੀਰਤਨ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਉਥੇ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਹੁੰਦੀ ਰਹਿੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਹ = ਜਿੱਥੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es ahí donde se cantan las Bellas Alabanzas del Señor."