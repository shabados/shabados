[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾਪ ਚਿਤ ਕੇ ਸਕਲ ਨਿਵਾਰੈ ॥"
page = 846

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They often proceeded like this and ridded their afflictions."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮਨ ਦੀਆਂ ਸਾਰੀਆਂ ਤਲਖ਼ੀਆਂ ਦੂਰ ਕਰ ਦਿੰਦੇ ਸਨ।"