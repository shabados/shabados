[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਰਸੁ; ਸਾਧੂ ਹਾਟਿ ਸਮਾਇ ॥"
page = 377
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lord's ambrosia is contained in the saints shop."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦਾ ਅੰਮ੍ਰਿਤ ਸੰਤਾਂ ਦੀ ਦੁਕਾਨ ਅੰਦਰ ਟਿੱਕਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord's sublime essence permeates the homes of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਹਰਿ ਰਸੁ ਸਾਧੂਓਂ ਕੇ (ਹਾਟਿ) ਦੁਕਾਨ, ਭਾਵ ਸਤਸੰਗਤ ਵਾ ਤਿਨ ਕੇ ਰਿਦ੍ਯ ਮੇਂ ਸਮਾਏ ਰਹਿਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਨਾਮ-ਰਸ ਗੁਰੂ ਦੇ ਹੱਟ ਵਿਚ (ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਵਿਚ) ਸਦਾ ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧੂ ਹਾਟਿ = ਗੁਰੂ ਦੇ ਹੱਟ ਵਿਚ, ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਵਿਚ। ਸਮਾਇ = ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ésta se vive solamente en la Morada de los Santos."