[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤੁ ਸੰਤੋਖੁ ਦਇਆ ਧਰਮੁ; ਸੀਗਾਰੁ ਬਨਾਵਉ ॥"
page = 812
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I embellish myself with truthfulness contentment, compassion and piety."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਆਪ ਨੂੰ ਸੱਚਾਈ; ਸੰਤੁਸ਼ਟਤਾ ਰਹਿਮ ਅਤੇ ਪਵਿੱਤਰਤਾ ਨਾਲ ਸ਼ਸ਼ੋਭਤ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am embellished with truth, contentment, compassion and Dharmic faith."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤ ਔ ਸੰਤੋਖ, ਦਯਾ, ਧਰਮ ਆਦੀ ਗੁਣੋਂ ਕੇ ਧਾਰਨੇ ਕਾ ਸੀਗਾਰ ਬਣਾਵੋਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਮੇਹਰ ਕਰ) ਮੈਂ ਸਤ ਨੂੰ, ਸੰਤੋਖ ਨੂੰ, ਦਇਆ ਨੂੰ, ਧਰਮ ਨੂੰ, (ਆਪਣੇ ਆਤਮਕ ਜੀਵਨ ਦੀ) ਸਜਾਵਟ ਬਣਾਈ ਰੱਖਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਨਾਵਉ = ਬਨਾਉਂ, ਮੈਂ ਬਣਾ ਲਵਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Que embellezca mi ser con la Verdad, el Contentamiento, la Compasión y la Rectitud,"