[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗਹਰ ਗੰਭੀਰ ਅਥਾਹੁ; ਅਜਰੁ ਜਰਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He holds unfathomable and serene Lord dearly in his heart."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਫਲ) ਗਹਿਰ ਗੰਭੀਰ ਅਥਾਹ ਹੋਕੇ ਅਜਰ (ਨਾ ਜਰੇ ਜਾਣ ਵਾਲੇ ਪਦਾਰਥ) ਜਰ ਲੀਤੇ।"