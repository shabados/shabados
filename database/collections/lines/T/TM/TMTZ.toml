[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨੇ ਦਾਸ ਕਉ; ਰਾਖਨਹਾਰ ॥੧॥ ਰਹਾਉ ॥"
page = 869
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru is the saviour of his servant. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਪਣੇ ਸੇਵਕ ਦੀ ਰੱਖਿਆ ਕਰਨ ਵਾਲੇ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Saving Grace of His slaves. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਦਾਸ ਕੇ ਅਨੇਕ ਬਿਘਨੋਂ ਤੇ ਰਾਖਨੇਹਾਰ ਗੁਰੂ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਪਣੇ ਸੇਵਕ ਨੂੰ (ਨਿੰਦਾ ਆਦਿਕ ਤੋਂ) ਬਚਾਣ-ਜੋਗਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਰਾਖਨਹਾਰ = ਬਚਾਣ ਵਾਲਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él salva, con toda certeza, a sus Sirvientes y a Sus Devotos.(1-Pausa)"