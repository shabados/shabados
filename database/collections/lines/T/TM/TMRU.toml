[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਜ ਬੁਲਾਵਤ ਸਭਾ ਮੈ; ਬੇਗ ਚਲੋ ਤਿਹ ਪਾਸਿ ॥੧੨੩॥"
page = 87

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Thou hast been summoned in the royal court, appear before it very quickly.”123.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਜਾ (ਸੁੰਭ) ਸਭਾ ਵਿਚ ਬੁਲਾਉਂਦਾ ਹੈ, (ਤੁਸੀਂ) ਜਲਦੀ ਹੀ ਉਸ ਕੋਲ ਚਲੋ ॥੧੨੩॥"