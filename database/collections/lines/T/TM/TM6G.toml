[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲੋਕੀ ਤਿਹੀ ਫਿਰਾਈ, ਦੋਹੀ ਆਪਣੀ ॥"
page = 120

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“They have proclaimed their authority over all the three worlds.\""

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਨ੍ਹਾਂ ਨੇ) ਤਿੰਨਾਂ ਲੋਕਾਂ ਵਿਚ ਆਪਣੀ ਦੁਹਾਈ ਫਿਰਾ ਦਿੱਤੀ ਹੈ।"