[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭੁ ਕਿਛੁ ਹੁਕਮੇ ਆਵਦਾ; ਸਭੁ ਕਿਛੁ ਹੁਕਮੇ ਜਾਇ ॥"
page = 556
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Everything comes through Lord's will and through Lord's will everything goes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਵਸਤੂ ਸੁਆਮੀ ਦੇ ਫ਼ੁਰਮਾਨ ਰਾਹੀਂ ਆਉਂਦੀ ਹੈ ਅਤੇ ਸੁਆਮੀ ਦੇ ਫ਼ੁਰਮਾਨ ਰਾਹੀਂ ਚਲੀ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everything comes by the Lord's Will, and everything goes by the Lord's Will."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੋਗੀ! ਸਭ ਕੁਛ ਹੁਕਮ ਸੇ ਆਂਵਦਾ ਹੈ ਅਰੁ ਸਭ ਕੁਛ ਹੁਕਮ ਸੇ ਹੀ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰੇਕ ਚੀਜ਼ ਪ੍ਰਭੂ ਦੇ ਹੁਕਮ ਵਿਚ ਹੀ ਆਉਂਦੀ ਹੈ ਤੇ ਹੁਕਮ ਵਿਚ ਹੀ ਚਲੀ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todo viene a existir a través de la Voluntad del Señor, y todo es disuelto también a través de Su Voluntad."