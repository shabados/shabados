[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਖੁ ਪਾਵਹਿ; ਸਾਚੈ ਦਰਬਾਰਿ ॥੪॥੩੨॥੧੦੧॥"
page = 186
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou shall obtain peace at the True court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੱਚੀ ਦਰਗਾਹ ਅੰਦਰ ਆਰਾਮ ਨੂੰ ਪ੍ਰਾਪਤ ਹੋਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "you shall find peace at the True Court. ||4||32||101||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਸਾਚੇ ਦਰਬਾਰ ਮੇਂ ਸੁਖ ਪਾਵੈਗਾ॥੪॥੩੨॥੧੦੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦੀ ਦਰਗਾਹ ਵਿਚ ਆਨੰਦ ਮਾਣੇਂਗਾ ॥੪॥੩੨॥੧੦੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਰਬਾਰਿ = ਦਰਬਾਰ ਵਿਚ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues solamente así uno encuentra Paz en la Verdadera Corte.(4-32-101)"