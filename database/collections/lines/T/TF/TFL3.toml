[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੀਨੋ ਨਾਮੁ; ਕੀਓ ਪਵਿਤੁ ॥"
page = 892
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Blessing me with His Name, the Lord has sanctified me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਆਪਣਾ ਨਾਮ ਬਖਸ਼ ਕੇ ਪ੍ਰਭੂ ਨੇ ਪਾਵਨ ਪੁਨੀਤ ਕਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Blessing me with His Name, He has purified and sanctified me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰਾਂ ਨੇ ਨਾਮ ਦੇ ਕੇ ਭਗਤੋਂ ਕਾ ਅੰਤਸਕਰਣ ਪਵਿਤ੍ਰ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਗੁਰੂ ਨੇ ਪਰਮਾਤਮਾ ਦਾ) ਨਾਮ ਦੇ ਦਿੱਤਾ, (ਉਸ ਦਾ ਜੀਵਨ) ਪਵਿੱਤਰ ਬਣਾ ਦਿੱਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੀਨੋ = ਦਿੱਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor me ha bendecido con Su Nombre y me ha santificado;"