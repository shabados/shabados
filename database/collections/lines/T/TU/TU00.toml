type = "primary"
data = "ਤਨ ਮਨ ਅਪਨੇ ਆਪ ਸੰਭਾਰੋ ॥੮॥"
page = 948

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the night had lapsed and the day broke, he managed to control his mind and body.(8)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤਦ ਉਸ ਨੇ) ਆਪਣਾ ਤਨ ਮਨ ਅਤੇ ਆਪਣਾ ਆਪ ਸੰਭਾਲਿਆ ॥੮॥"