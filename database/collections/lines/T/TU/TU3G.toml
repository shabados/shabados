[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦਿਨੁ ਭਗਤਿ ਕਰਹਿ ਦਿਨੁ ਰਾਤੀ; ਰਾਮ ਨਾਮੁ ਸਚੁ ਲਾਹਾ ॥"
page = 600
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day, the saints ever perform the Lord's devotional service and reap the True profit of His Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਦਿਨ ਸੰਤ ਸੁਆਮੀ ਦੀ ਸਦਾ ਪ੍ਰੇਮਮਈ ਸੇਵਾ ਕਮਾਉਂਦੇ ਹਨ ਅਤੇ ਉਸ ਦੇ ਨਾਮ ਦਾ ਸੱਚਾ ਮੁਨਾਫਾ ਉਠਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, the Lord's devotees worship Him; night and day, they gather in the true profit of the Lord's Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਰਾਤ ਦਿਨ ਭਗਤੀ ਕਰਤੇ ਹੈਂ ਤਿਨ ਕੋ (ਦਿਨੁ ਰਾਤੀ) ਰਾਤ੍ਰਿ ਸੇ ਦਿਨ ਹੂਆ ਹੈ, ਭਾਵ ਅਗ੍ਯਾਨ ਨਸ਼ਟ ਔਰ ਗ੍ਯਾਨ ਪ੍ਰਾਪਤਿ ਹੂਆ ਹੈ ਔਰ ਤਿਨਾਂ ਕੋ ਰਾਮ ਨਾਮ ਕਾ ਸਚਾ ਲਾਹਾ ਪ੍ਰਾਪਤ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਹਰ ਵੇਲੇ ਦਿਨ ਰਾਤ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਕਰਦੇ ਰਹਿੰਦੇ ਹਨ, ਉਹ ਹਰਿ-ਨਾਮ ਦਾ ਲਾਭ ਖੱਟਦੇ ਹਨ ਜੋ ਸਦਾ ਕਾਇਮ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਦਿਨੁ = ਹਰ ਰੋਜ਼। ਸਚੁ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ। ਲਾਹਾ = ਲਾਭ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es por eso que los seres con Conciencia de Dios alaban a su Señor noche y día, y cosechan el Verdadero Fruto del Nombre del Señor."