[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹਸਤ ਸੁੰਡ ਪ੍ਰਮਾਨ ਘ੍ਰਿਤ ਕੀ; ਪਰਤ ਧਾਰ ਅਪਾਰ ॥"
page = 140

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The continuous current of clarified butter of the size of elephant’s trunk fell in the pit."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹਾਥੀ ਦੀ ਸੁੰਡ ਜਿੰਨੀ (ਮੋਟੀ) ਘਿਓ ਦੀ ਲਗਾਤਾਰ ਧਾਰ (ਯੱਗ ਕੁੰਡ ਵਿਚ) ਪੈਂਦੀ ਸੀ।"