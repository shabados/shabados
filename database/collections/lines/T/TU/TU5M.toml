[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਜਾਤਿ; ਰੰਗਾ ਕੇ ਨਾਵ ॥"
page = 3
line = 15

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "\"ਕੇ\" ਦਾ ਅਰਥ ਹੈ ਕਈ ਤੇ ਇਹ ਚਾਰੇ ਹੀ ਨਾਂਵਾਂ ਨਾਲ ਲਗਦਾ ਹੈ - ਕਈ ਜੀਅ, ਕਈ ਜਾਤਾਂ ਦੇ, ਕਈ ਰੰਗਾਂ ਦੇ, ਤੇ ਕਈ ਨਾਂਵਾਂ ਦੇ। ਇਸ ਕਰਕੇ \"ਰੰਗਾ\" ਦਾ ਉਚਾਰਨ \"ਰੰਗਾਂ\" ਹੈ।"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Kinds, colours and names of all the beings,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜੀਵਾਂ ਦੀਆਂ ਵੰਨਗੀਆਂ, ਰੰਗਤਾ ਅਤੇ ਨਾਮ ਉਕਰੇ ਹਨ"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The names and the colors of the assorted species of beings"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਮੈਂ ਅਨੇਕ ਜਾਤੀ, ਔ ਅਨੇਕ ਰੰਗਾਂ ਕੇ ਜੀਵ ਹੈਂ, ਔ ਅਨੇਕ ਹੀ ਤਿਨ ਕੇ ਨਾਮ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸ੍ਰਿਸ਼ਟੀ ਵਿਚ) ਕਈ ਜ਼ਾਤਾਂ ਦੇ, ਕਈ ਕਿਸਮਾਂ ਦੇ ਅਤੇ ਕਈ ਨਾਵਾਂ ਦੇ ਜੀਵ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ = ਜੀਵ ਜੰਤ। ਕੇ ਨਾਵ = ਕਈ ਨਾਵਾਂ ਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "lo que determina el tipo, color, y naturaleza de todas las criaturas."