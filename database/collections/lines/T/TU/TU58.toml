[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਕਿਉ ਵਿਸਰੈ; ਜਿਸ ਕੇ ਜੀਅ ਪਰਾਨਾ ॥"
page = 159
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why forget Him, to whom belong soul and body?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕਿਵੇਂ ਭੁਲਾਈਏ ਜਿਸ ਦੀ ਮਲਕੀਅਤ ਆਤਮਾ ਤੇ ਜਿੰਦ ਜਾਨ ਹਨ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Why forget Him, unto whom the soul and the breath of life belong?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤੇਰੇ ਜੀਅ ਪ੍ਰਾਨ ਦੀਏ ਹੂਏ ਹੈਂ, ਸੋ ਤੂੰ ਕਿਉਂ ਵਿਸਰ ਜਾਵੇਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜਿਸ ਪਰਮਾਤਮਾ ਦੇ ਦਿੱਤੇ ਹੋਏ ਇਹ ਜਿੰਦ-ਪ੍ਰਾਣ ਹਨ, ਉਸ ਨੂੰ ਕਦੇ ਭੀ (ਮਨ ਤੋਂ) ਭੁਲਾਣਾ ਨਹੀਂ ਚਾਹੀਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋ = ਉਹ (ਪਰਮਾਤਮਾ)। ਜੀਅ ਪਰਾਨਾ = ਜਿੰਦ ਪ੍ਰਾਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué olvidarlo a Él, Quien te ha dado Alma y cuerpo?"