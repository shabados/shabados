[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਪੂਰਾ ਸਾਹੁ; ਆਪੇ ਹੀ ਖਟਿਆ ॥"
page = 957
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself is the Perfect Banker and Himself earns the profit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਖੁਦ ਹੀ ਪੂਰਨ ਸ਼ਾਹੂਕਾਰ ਹੈ ਅਤੇ ਖੁਦ ਹੀ ਨਫਾ ਕਮਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is the perfect Banker; He Himself earns His profit."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਪੂਰਾ ਸਾਹੁ ਗੁਰੂ ਰੂਪ ਹੈਂ, ਆਪੇ ਹੀ ਜਗ੍ਯਾਸੂ ਰੂਪ ਹੋਇਕੈ ਨਾਮ ਧਨ ਕੋ ਖਟਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਜਗਤ-ਹੱਟ ਵਿਚ) ਉਹ ਆਪ ਹੀ ਪੂਰਾ ਸ਼ਾਹ ਹੈ, ਤੇ ਆਪ ਹੀ (ਆਪਣੇ ਨਾਮ ਦੀ) ਖੱਟੀ ਖੱਟ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖਟਿਆ = (ਹਰਿ-ਨਾਮ ਵਪਾਰ ਦੀ) ਕਮਾਈ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el Único Mercader Perfecto y Él Mismo gana su propia utilidad."