[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਿ; ਜਗੰਨਾਥ ਜਗਦੀਸ ਗੁਸਈਆ ॥"
page = 834
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man, remember thou the Lord of the universe, the Master of the world and the Proprietor of creation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੰਦੇ! ਤੂੰ ਆਲਮ ਦੇ ਸੁਆਮੀ, ਸੰਸਾਰ ਦੇ ਮਾਲਕ ਅਤੇ ਰਚਨਾ ਦੇ ਸਾਈਂ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate on the Lord of the Universe, the Master of the world, the Lord of creation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਗਤ ਕੌ ਨਾਥ ਜਗਦੀਸਰ ਸਰਬ ਕਾ ਈਸ੍ਵਰ (ਗੁਸਈਆ) ਪ੍ਰਿਥੀ ਕਾ ਮਾਲਕ ਗੁਸਾਈਂ ਜੋ ਵਾਹਿਗੁਰੂ ਹੈ, ਤਿਸ ਕੇ ਨਾਮ ਕੋ ਮਨ ਤਨ ਬਾਣੀ ਸੇ (ਜਪ) ਸਿਮਰਨ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਗਤ ਦੇ ਨਾਥ, ਜਗਤ ਦੇ ਈਸ਼੍ਵਰ, ਧਰਤੀ ਦੇ ਖਸਮ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਜਪਿਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਪਿ = ਜਪਿਆ ਕਰ। ਜਗੰਨਾਥ = ਜਗਤ ਦਾ ਨਾਥ। ਜਗਦੀਸ = ਜਗਤ ਦਾ ਈਸ਼੍ਵਰ। ਗੁਸਈਆ = ਧਰਤੀ ਦਾ ਖਸਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente, habita en tu Maestro, el Señor del Universo;"