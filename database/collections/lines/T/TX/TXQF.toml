[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦੀ ਵੇਖੈ ਨਾਲੇ ॥"
page = 129
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "perceives Him just close to her, by the Guru's grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਉਹ ਉਸ ਨੂੰ ਆਪਣੇ ਐਨ ਲਾਗੇ ਦੇਖਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "by Guru's Grace, sees Him close at hand."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੇ ਗੁਰੋਂ ਕੀ ਕਿਰਪਾ ਸੇ ਪਤੀ ਕੋ ਸਾਥ ਦੇਖਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਉਸ ਨੂੰ ਆਪਣੇ ਅੰਗ-ਸੰਗ ਵੱਸਦਾ ਵੇਖਦੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entonces por la Gracia del Guru, Lo vería dentro de sí misma."