[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਊਠਤ ਬੈਠਤ; ਸਾਸਿ ਗਿਰਾਸਿ ॥"
page = 971
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "standing, sitting, at every breath and morsel,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖਲੋਂਦਿਆਂ, ਬਹਿੰਦਿਆਂ, ਹਰ ਸੁਆਸ ਤੇ ਬੁਰਕੀ ਨਾਲ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "while standing up and sitting down, with every breath and morsel of food."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਠਤਿਆਂ ਬੈਠਤਿਆਂ ਸ੍ਵਾਸ-ਸ੍ਵਾਸ ਭੋਜਨੁ ਖਾਤਿਆਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉੱਠਦਿਆਂ ਬੈਠਦਿਆਂ, ਖਾਂਦਿਆਂ, ਸਾਹ ਲੈਂਦਿਆਂ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਸਿ = ਸਾਹ ਦੇ ਨਾਲ। ਗਿਰਾਸਿ = ਗਿਰਾਹੀ ਦੇ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sentado o parado; sí, con cada respiración."