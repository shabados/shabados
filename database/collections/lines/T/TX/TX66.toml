[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗ ਰਤਨ; ਪਰੀਆ ਪਰਵਾਰ ॥"
page = 351
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The divine music with its consorts and family is a gem."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀਆਂ ਰਾਗਣੀਆਂ ਤੇ ਵੰਸ਼ ਸਮੇਤ ਈਸ਼ਵਰੀ ਕੀਰਤਨ ਇਕ ਜਵੇਹਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The divine crystalline harmonies, their consorts, and their celestial families"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਤੇਰੀ ਪ੍ਰੀਤ (ਰਤਨ) ਬੈਰਾਗੁ (ਪਰੀਆ) ਕਰੁਣਾ, ਮ੍ਯਤ੍ਰੀ, ਮੁਦਿਤਾ, ਉਪੇਖ੍ਯਾ, ਇਤ੍ਯਾਦਿ ਜੋ ਦੈਵੀ ਸੰਪਤਾ ਹੈ ਏਹ ਪਰਵਾਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੇਸ਼ਟ ਵਧੀਆ ਰਾਗ ਤੇ ਉਹਨਾਂ ਦੀਆਂ ਰਾਗਣੀਆਂ ਆਦਿਕ ਦਾ ਇਹ ਸਾਰਾ ਪਰਵਾਰ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਤਨ ਰਾਗ = ਸ੍ਰੇਸ਼ਟ ਵਧੀਆ ਰਾਗ। ਪਰੀਆ = ਰਾਗਾਂ ਦੀਆਂ ਪਰੀਆਂ, ਰਾਗਣੀਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Melodía Divina es Preciosa como una Joya,"