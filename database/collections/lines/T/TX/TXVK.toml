[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮੋ ਜੋਗਣੀ ਭੋਗਣੀ ਪ੍ਰਮ ਪ੍ਰਗਿਯਾ ॥"
page = 118

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O goddess Durga, Thou art most wise, a Yogini"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਯੋਗ ਵਾਲੀ, ਭੋਗ ਵਾਲੀ ਅਤੇ ਬ੍ਰਹਮ-ਵਿਦਿਆ ('ਪ੍ਰਮ ਪ੍ਰਗਿਯਾ') ਨੂੰ ਨਮਸਕਾਰ ਹੈ;"