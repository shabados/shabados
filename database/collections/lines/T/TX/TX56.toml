[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਨਾਮਿ ਮਿਲੈ ਵਡਿਆਈ; ਪੂਰੇ ਗੁਰ ਤੇ ਪਾਵਣਿਆ ॥੮॥੨੫॥੨੬॥"
page = 125
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, through God's Name greatness is obtained. From the perfect Guru the Name is procured."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਰੱਬ ਦੇ ਨਾਮ ਦੇ ਰਾਹੀਂ ਵਿਸ਼ਾਲਤਾ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ। ਪੂਰਨ ਗੁਰਾਂ ਪਾਸੋਂ ਨਾਮ ਪਾਇਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, through the Naam, greatness is obtained. It is received from the Perfect Guru. ||8||25||26||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਨਾਮੀ ਕਰ ਵਡਿਆਈ ਮਿਲਤੀ ਹੈ ਔਰ (ਨਾਮਿ) ਪਰਮੇਸ੍ਵਰ ਪੂਰੇ ਗੁਰੋਂ ਸੇ ਪਾਈਤਾ ਹੈ॥੮॥੨੫॥੨੬॥☬ਅਬ ਪੂਰਬ ਸਬਦੋਕਤ ਨਾਮੀ ਕੀ ਸਰਬ ਬ੍ਯਾਪਕ ਸੱਤਾ ਅਰ ਜੋ ਤਿਸਮੈਂ ਸਮਾਏ ਹੈਂ, ਤਿਨ ਕੀ ਮਹਮਾ ਬਰਨਨ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਿਚ ਜੁੜਿਆਂ (ਲੋਕ ਪਰਲੋਕ ਵਿਚ) ਆਦਰ ਮਿਲਦਾ ਹੈ, ਤੇ (ਪ੍ਰਭੂ ਦਾ ਨਾਮ) ਪੂਰੇ ਗੁਰੂ ਪਾਸੋਂ (ਹੀ) ਮਿਲਦਾ ਹੈ ॥੮॥੨੫॥੨੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਮਿ = ਨਾਮ ਵਿਚ ॥੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, a través del Guru, uno es bendecido con la Gloria del Señor. (8-25-26)"