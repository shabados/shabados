[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਸਿਮਰਤ; ਕਿਲਵਿਖ ਸਭਿ ਨਾਸੇ ॥੧॥"
page = 806
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meditating on the Lord, all my vices have hastened away."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ, ਮੇਰੇ ਸਾਰੇ ਪਾਪ ਦੌੜ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remembering the Lord in meditation, all sinful mistakes have been erased. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਿਮਰਨ ਕਰ ਜਨਮ ਜਨਮਾਤ੍ਰੋਂ ਕੇ (ਕਿਲਵਿਖ) ਮਹਾਂ ਪਾਪ ਸਭ ਨਸ ਗਏ ਹੈਂ। ਸੋ ਇਹੁ ਹੈ: ੧ ਸੋਨਾ ਚੁਰਾਵਨਾ, ੨ ਗੁਰ ਸਿਹਜਾਪਰ ਗਵਨ, ੩ ਬ੍ਰਹਮ ਹਤਿਆ, ੪ ਮਦਰਾ ਪਾਨ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਨੇ ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਹਰਿ-ਨਾਮ ਸਿਮਰਨਾ ਸ਼ੁਰੂ ਕਰ ਦਿੱਤਾ, ਉਸ ਦੇ ਸਾਰੇ) ਦੁੱਖ ਕਲੇਸ਼ ਦੂਰ ਹੋ ਗਏ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਮਰਤ = ਸਿਮਰਦਿਆਂ। ਕਿਲਵਿਖ = ਪਾਪ। ਸਭਿ = ਸਾਰੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Contemplando al Señor, todas mis faltas se han borrado.  (1)"