[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਨੑ ਕੈ ਸੰਗਿ; ਤੂ ਰਖੀ ਪਪੋਲਿ ॥"
page = 390
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With it thou wert fondled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਨਾਲ ਤੂੰ ਪਲੋਸ ਕੇ ਰੱਖੀ ਜਾਂਦੀ ਸੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With that, you are caressed;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਨ ਕੈ ਸੰਗ ਕਰਤੇ ਤੂੰ (ਪਪੋਲਿ) ਪਲੋਸ ਕਰ ਕੇ ਰਖੀ ਹੂਈ ਥੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵਾਤਮਾ ਦੇ ਨਾਲ ਹੁੰਦਿਆਂ ਤੈਨੂੰ ਪਾਲ-ਪੋਸ ਕੇ ਰੱਖੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਪੋਲਿ = ਪਾਲ ਕੇ। ਤੂੰ = ਤੈਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con Alma estás siempre floreciente,"