data = "ਅਮਲੀ ਜੀਵੈ; ਅਮਲੁ ਖਾਇ ॥"
page = 1180
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "an opium-addict lives by eating opium,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਫੀਮੀ ਫੀਮ ਖਾ ਕੇ ਜੀਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The opium addict lives by consuming opium."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਅਮਲੀ ਅਮਲ ਕੋ ਖਾਇ ਕਰ ਜੀਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਕੋਈ ਅਫੀਮੀ ਅਫੀਮ ਖਾ ਕੇ ਸੁਖ ਪ੍ਰਤੀਤ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਮਲੀ = ਅਫੀਮੀ। ਖਾਇ = ਖਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y la vida del adicto depende de sus intoxicantes, así el ser que está entonado en Dios,"