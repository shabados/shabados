[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਆਏ ਸੇ ਪਰਵਾਣੁ ਭਏ; ਜਿ ਸਗਲੇ ਕੁਲ ਤਾਰੇਨਿ ॥੧॥"
page = 951
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, approved becomes the advent of those in this world, who save all their generations."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਪ੍ਰਮਾਣੀਕ ਹੋ ਜਾਂਦਾ ਹੈ ਸਿ ਜਹਾਨ ਵਿੱਚ ਉਨ੍ਹਾਂ ਦਾ ਆਗਮਨ ਜੋ ਆਪਣੀਆਂ ਸਾਰੀਆਂ ਪੀੜ੍ਹੀਆਂ ਦਾ ਪਾਰ ਉਤਾਰਾ ਕਰ ਦਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, their coming into the world is approved; they redeem all their ancestors. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਸੰਸਾਰ ਮੇਂ ਆਏ ਸੇ ਪਰਵਾਨ ਭਏ ਹੈਂ, ਜੋ ਭਗਤੀ ਕਰ ਕੇ ਸਾਰੇ ਹੀ ਕੁਲੋਂ ਕੋ ਤਾਰ ਲੇਤੇ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਉਹ ਨਿਰੇ ਆਪ ਨਹੀਂ ਤਰੇ, ਆਪਣੀਆਂ) ਸਾਰੀਆਂ ਕੁਲਾਂ ਭੀ ਤਾਰਦੇ ਹਨ, ਉਹਨਾਂ ਦਾ ਹੀ ਜਗਤ ਵਿਚ ਆਉਣਾ ਕਬੂਲ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲੇ = ਸਾਰੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh dice Nanak, su venida al mundo es aprobada y redimen a todas sus generaciones.(1)"