[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਲਬਧ ਕਰਮਣਹ ॥੧੬॥"
page = 1361
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "but they are found by good fortune."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰ ਉਹ ਚੰਗੇ ਭਾਗਾਂ ਰਾਹੀਂ ਮਿਲਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, they are found by good karma. ||16||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਸੋ ਸੰਤ ਭਾਗੋਂ ਕਰ ਕੇ ਪ੍ਰਾਪਤਿ ਹੋਤੇ ਹੈਂ॥੧੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ, ਹੇ ਨਾਨਕ! (ਸੰਤਾਂ ਦੀ ਸੰਗਤ) ਭਾਗਾਂ ਨਾਲ ਲੱਭਦੀ ਹੈ ॥੧੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਬਧ = (लब्ध) ਲੱਭਦਾ। ਕਰਮਣਹ = ਭਾਗਾਂ ਨਾਲ ॥੧੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y son encontrados, dice Nanak, por un buen Karma.(16)"