[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤਸੰਗਿ ਕਰਹਿ ਜੋ ਬਾਦੁ ॥"
page = 1145
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who pick up quarrel with the saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਾਧੂਆਂ ਨਾਲ ਲੜਾਈ ਝਗੜਾ ਛੇੜਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who argue and fight with the Saints"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੇ ਸਾਥ ਜੋ ਪੁਰਸ ਬਾਦ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੇ ਭਗਤ ਨਾਲ ਝਗੜਾ ਖੜਾ ਕਰੀ ਰੱਖਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗਿ = ਨਾਲ। ਕਰਹਿ = ਕਰਦੇ ਹਨ। {ਬਹੁ-ਵਚਨ}। ਬਾਦੁ = ਝਗੜਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El que entra en conflicto con el Santo,"