[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਬਖਸੇ; ਦੇ ਵੀਚਾਰੁ ॥੧॥"
page = 666
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Blessing with His contemplation, the Lord Himself pardons the man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਬੰਦਗੀ ਦੀ ਵਿਚਾਰ ਦੇ ਕੇ, ਸੁਆਮੀ ਖੁਦ ਹੀ ਬੰਦੇ ਨੂੰ ਮਾਫ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God Himself forgives, and bestows contemplative meditation. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰੁ ਤਿਨੋਂ ਕੋ ਕਰਤਾਰ ਸਚਾ ਵੀਚਾਰ ਦੇ ਕਰ ਬਖਸ਼ ਲੇਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਇਹ ਵਿਚਾਰ ਪ੍ਰਭੂ ਉਸ ਨੂੰ ਹੀ ਦੇਂਦਾ ਹੈ ਜਿਸ ਉਤੇ ਆਪ ਹੀ ਬਖ਼ਸ਼ਸ਼ ਕਰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇ = ਦੇਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bendiciendo al ser humano con la Meditación, el Señor Mismo le confiere Su Perdón. (1)"