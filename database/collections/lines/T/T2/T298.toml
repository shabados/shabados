[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਖੰਡ ਅਤੇ ਦੁਧ ਨਾਲੋਣ ਵੀ ਜ਼ਿਆਦਾ ਮਿੱਠੇ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਮੇਵਾ ਦਰ ਹਿੰਦੁਸਤਾਣ ਬਾਸ਼ਦ ਲਜ਼ੀਜ਼ ॥੩੫॥੭॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Otherwise, the adversary will slander (the claim) that He happens to be everywhere. (1)"