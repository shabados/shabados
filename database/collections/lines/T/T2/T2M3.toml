[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੁਦਰਤਿ ਕਾਦਰ ਨੋ ਕੁਰਬਾਣੈ ॥੧੨॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Whole of this creation is sacrifice unto the creator."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਇਸ) ਕਾਦਰ ਦੀ ਕੁਦਰਤ ਥੋਂ ਅਸੀਂ ਵਾਰਨੇ ਜਾਂਦੇ ਹਾਂ।"