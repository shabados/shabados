[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤੁ ਤੇਰਾ ਸੋਈ ਤੁਧੁ ਭਾਵੈ; ਜਿਸ ਨੋ ਤੂ ਰੰਗੁ ਧਰਤਾ ॥੨॥"
page = 1185
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone is Thy saint, who is pleasing to Thee, and for whom Thou enshrine love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਤੇਰਾ ਹੈ, ਜਿਸ ਨੂੰ ਤੂੰ ਪਿਆਰ ਕਰਦਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is Your devotee, who is pleasing to You. You bless them with Your Love. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਭਗਤ ਭੀ ਵਹੀ ਹੈ, ਜੋ ਤੇਰੇ ਕੋ ਭਾਇ ਜਾਵੈ। ਔਰ ਤੇਰੇ ਕੋ ਭਾਵਤਾ ਸੋਈ ਹੈ ਜਿਸ ਕੋ ਤੂੰ (ਰੰਗੁ) ਪ੍ਰੇਮ ਧਾਰਤਾ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਭਗਤ (ਭੀ) ਉਹੀ ਮਨੁੱਖ (ਬਣਦਾ ਹੈ ਜਿਹੜਾ) ਤੈਨੂੰ ਪਿਆਰਾ ਲੱਗਦਾ ਹੈ ਜਿਸ (ਦੇ ਮਨ) ਨੂੰ ਤੂੰ (ਆਪਣੇ ਪਿਆਰ ਦਾ) ਰੰਗ ਚਾੜ੍ਹਦਾ ਹੈਂ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੁਧੁ ਭਾਵੈ = (ਜਿਹੜਾ) ਤੈਨੂੰ ਪਿਆਰਾ ਲੱਗਦਾ ਹੈ। ਰੰਗੁ = ਪ੍ਰੇਮ-ਰੰਗ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo Tú provocas ese deseo en nosotros y sólo es Tu Devoto con quien estás complacido y al cual le muestras Tu Amor. (2)"