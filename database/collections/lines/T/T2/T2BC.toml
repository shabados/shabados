[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The nine doors to every township of the body,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਦੇਹ ਦੇ ਗਰਾਉਂ ਨੂੰ ਨੌ ਬੂਹੇ,"

[[content]]
assets = ["DSSK"]
