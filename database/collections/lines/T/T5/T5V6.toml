[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤਸੰਗਤਿ ਮਿਲਿ; ਹਰਿ ਗੁਣ ਗਾਏ ॥"
page = 362
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and meeting the society of saints, sings God's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਾਧ-ਸਮਾਗਮ ਨਾਲ ਜੁੜ ਕੇ ਵਾਹਿਗੁਰੂ ਦਾ ਜੱਸ ਗਾਇਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Joining the True Congregation, the Sat Sangat, the Glorious Praises of the Lord are sung."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਤਸੰਗਤਿ ਸੇ ਮਿਲ ਕਰ ਹਰਿ ਗੁਨ ਗਾਉਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਸਾਧ ਸੰਗਤਿ ਵਿਚ ਮਿਲ ਕੇ ਉਹ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦਾ ਰਹਿੰਦਾ ਹੈ (ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਿ = ਮਿਲ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "canta la Alabanza del Señor en la Saad Sangat, la Compañía de los Santos,"