[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਮਾਨੇ ਕਉ; ਜੋ ਦੇਤੋ ਮਾਨੁ ॥"
page = 863
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who grants honour to the dishonoured,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਬੇਇੱਜ਼ਤ ਨੂੰ ਇੱਜ਼ਤ ਬਖਸ਼ਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He grants honor to the dishonored,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਿਮਾਨਿਆਂ ਕੋ ਜੋ ਮਾਨ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੇਹੜਾ ਨਿਮਾਣੇ ਨੂੰ ਮਾਣ ਦੇਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਨੁ = ਆਦਰ, ਸਤਕਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor que bendice con honor a los que no lo tienen,"