[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਰ ਬਰਦਾਰੀ ਕੋ ਘਨੋ; ਖਰਚਨ ਹੋਇ ਬਨਾਇ ॥੫॥"
page = 898

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "So that the high expenses could be met.(5)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਬਰਾਦਰੀ ਦਾ ਭਾਰ ਬਹੁਤ ਹੈ, (ਇਸ ਲਈ) ਜ਼ਿਆਦਾ ਖ਼ਰਚ ਕਰਨਾ ਹੈ ॥੫॥"