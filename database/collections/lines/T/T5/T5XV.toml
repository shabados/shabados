[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਿਜੁ ਪਿਯ ਕੇ ਇਕ ਬਾਰ ਨ ਬਾਕ︀ਯੋ ॥੩੧॥"
page = 944

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She drove the chariot in such a way that she did not let Raja injured, and not even one of his hairs was split.(31)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਉਸ ਦੇ ਪ੍ਰੀਤਮ ਦਾ ਕੋਈ ਵਾਲ ਵਿੰਗਾ ਨਾ ਹੋਇਆ ॥੩੧॥"