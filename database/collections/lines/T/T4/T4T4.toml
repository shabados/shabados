[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭੁ ਜਗੁ ਆਨਿ; ਤਨਾਇਓ ਤਾਨਾਂ ॥੧॥ ਰਹਾਉ ॥"
page = 484
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He has stretched the wrap of the whole world. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਸਮੂਹ ਜਹਾਨ ਦਾ ਤਾਣਾ ਤਣਿਆ ਹੋਇਆ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has stretched out the fabric of the whole world. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਸੰਸਾਰ ਕਾ ਜਿਸ ਬ੍ਰਹਮ ਨੇ ਮਾਯਾ ਸਬਲ ਹੋ ਕਰ ਮਾਯਾ ਦ੍ਵਾਰੇ ਆਪ ਸੇ ਭਿੰਨ ਤਾਨਾ ਤਨਾਯਾ ਹੈ, ਸੋ ਅਸਲ ਜੁਲਾਹਾ ਹੈ। ਇਸ ਵਾਸਤੇ ਉਸ ਕੋ ਉਤਪਤਿ ਕੀਏ ਹੂਏ ਹਮ ਤੁਮ ਸਭੀ ਜੁਲਾਹੇ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਇਹ ਸਾਰਾ ਜਗਤ ਪੈਦਾ ਕਰ ਕੇ (ਮਾਨੋ) ਤਾਣਾ ਤਣ ਦਿੱਤਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਨਿ = ਲਿਆ ਕੇ, ਪੈਦਾ ਕਰ ਕੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aunque todos vengan para que les teja su ropa. (1‑Pausa)"