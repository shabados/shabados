[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੁ ਸੰਜਮੁ; ਕਰਣੀ ਹੈ ਕਾਰ ॥"
page = 841
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He does the deeds of truth and continence."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੱਚ ਅਤੇ ਪ੍ਰਹੇਜ਼ਗਾਰੀ ਦੇ ਕਰਮ ਕਮਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He practices truth and self-restraint."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚ ਕੋ ਧਾਰ ਕਰ, ਇੰਦ੍ਰੀਓਂ ਕਾ ਸੰਜਮ ਕਰ, ਸੁਭ ਕਰਣੀ ਭਗਤੀ ਪਰਾਇਣ ਹੋਣਾ, ਇਹੀ ਕਾਰ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ-ਥਿਰ ਹਰਿ-ਨਾਮ ਦਾ ਸਿਮਰਨ, ਅਤੇ ਇੰਦ੍ਰਿਆਂ ਨੂੰ ਵਿਕਾਰਾਂ ਵਲੋਂ ਬਚਾਈ ਰੱਖਣ ਦਾ ਉੱਦਮ-ਇਹ ਉਸ ਮਨੁੱਖ ਦਾ ਨਿੱਤ ਦਾ ਕਰਤੱਬ, ਨਿੱਤ ਦੀ ਕਾਰ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੁ = ਸਦਾ-ਥਿਰ ਹਰਿ-ਨਾਮ ਦਾ ਸਿਮਰਨ। ਸੰਜਮੁ = ਇੰਦ੍ਰਿਆਂ ਨੂੰ ਵਿਕਾਰਾਂ ਤੋਂ ਬਚਾਈ ਰੱਖਣ ਦਾ ਉੱਦਮ। ਕਰਣੀ = ਕਰਤੱਬ। ਕਾਰ = ਰੋਜ਼ਾਨਾ ਕੰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "practica la Verdad y la Disciplina."