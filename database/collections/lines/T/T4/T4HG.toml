[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦਿਨੁ ਦਾਝਹਿ; ਸਾਤਿ. ਨ ਪਾਇ ॥"
page = 664
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day, it continues burning and attains not peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਦਿਨ ਉਹ ਸੜਦਾ ਬਲਦਾ ਰਹਿੰਦਾ ਹੈ ਅਤੇ ਠੰਢ-ਚੈਨ ਨੂੰ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, they burn, and find no peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਦਿਨੇ ਰਾਤ੍ਰ ਤ੍ਰਿਸ਼ਨਾ ਅਗਨੀ ਕਰ ਜੀਵ ਜਲਤੇ ਹੈਂ ਅਰ ਸਾਂਤੀ ਕੋ ਨਹੀਂ ਪਾਵਤੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਤੋਂ ਵਿਛੁੜ ਕੇ ਮਨੁੱਖ) ਹਰ ਵੇਲੇ (ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ) ਸੜਦੇ ਰਹਿੰਦੇ ਹਨ। (ਗੁਰੂ ਦੀ ਸਰਨ ਤੋਂ ਬਿਨਾ ਮਨੁੱਖ) ਸ਼ਾਂਤੀ ਹਾਸਲ ਨਹੀਂ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਦਿਨੁ = ਹਰ ਰੋਜ਼, ਹਰ ਵੇਲੇ। ਦਾਝਹਿ = ਸਾੜਦੇ ਹਨ। ਸਾਤਿ = ਸ਼ਾਂਤੀ। ਨ ਪਾਇ = ਨਹੀਂ ਪ੍ਰਾਪਤ ਕਰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "viven en el fuego y nunca están en Paz. Encontrando al Verdadero Guru,"