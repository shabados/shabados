[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੋਵਨਹਾਰੁ; ਹੋਤ ਸਦ ਆਇਆ ॥"
page = 252
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is now, He shall be, and He, ever, has been."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਹੁਣ ਹੈ, ਉਹ ਹੋਵੇਗਾ ਤੇ ਹਮੇਸ਼ਾਂ ਹੁੰਦਾ ਆਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is now, He has been, and He shall always be."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਹੋਵਨਹਾਰੁ) ਭਾਵ ਸੱਤ ਰੂਪ ਅਬ ਹੈ, ਪ੍ਰਭੂ ਪੀਛੇ ਭੀ ਸਦੀਵ ਹੋਤਾ ਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਤੋਂ ਹੀ ਉਹ ਪ੍ਰਭੂ ਹੋਂਦ ਵਾਲਾ ਚਲਿਆ ਆ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੋਵਨਹਾਰੁ = ਹੋਂਦ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, el Eterno, es, fue y siempre será."