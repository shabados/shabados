[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਮਿੱਤਰ ਦੀ ਯਾਦ ਵਿਚ ਸਾਰੀ ਉਮਰ ਕੱਟੀ ਜਾ ਸਕਦੀ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਬਯਾਦਿ ਦੂਸਤ ਤਵਾਣ ਉਮਰ ਰਾ ਬਸਰ ਬੁਰਦਨ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "In the eyes of noble souls, that is a complete waste and downfall. (53) (3)"