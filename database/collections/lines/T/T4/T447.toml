[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਬਾਬਾ ਬੋਲੇ, ਨਾਥ ਜੀ; ਸਬਦੁ ਸੁਨਹੁ ਸਚੁ ਮੁਖਹੁ ਅਲਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Baba (further) said, O respected Nath! Please listen to the truth that I utter."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਆਪ ਗੁਰੂ) ਬਾਬਾ ਜੀ ਬੋਲੇ: “ਹੇ ਨਾਥ ਜੀ! (ਮੈਂ) ਮੂੰਹੋਂ ਸਚ ਬਚਨ ਕਹਿੰਦਾ ਹਾਂ (ਆਪ) ਸ਼ਬਦ ਸੁਣੋ।"