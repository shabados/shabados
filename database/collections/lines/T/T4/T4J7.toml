[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਖ ਨਿਧਾਨ; ਹਰਿ ਅਲਖ ਸੁਆਮੀ ॥"
page = 184
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The invisible Lord God is the treasure of peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਦ੍ਰਿਸ਼ਟ ਵਾਹਿਗੁਰੂ ਮਾਲਕ ਆਰਾਮ ਦਾ ਖਜਾਨਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Unseen Lord and Master is the Treasure of Peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ ਅਲਖ ਸੁਖ ਕੀ ਨਿਧੀ! ਹੇ ਸ੍ਵਾਮੀ!॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਖਾਂ ਦੇ ਖ਼ਜ਼ਾਨੇ ਪ੍ਰਭੂ! ਹੇ ਅਦ੍ਰਿਸ਼ਟ ਸੁਆਮੀ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਖ ਨਿਧਾਨ = ਹੇ ਸੁਖਾਂ ਦੇ ਖ਼ਜ਼ਾਨੇ ਪ੍ਰਭੂ! ਅਲਖ = ਹੇ ਅਦ੍ਰਿਸ਼ਟ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tesoro de Paz,"