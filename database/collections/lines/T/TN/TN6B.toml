type = "primary"
data = "ਸੇਖ ਮਸਾਇਕ ਹੋਇ, ਕਰਿ ਮੁਹਛੰਦਗੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The shaikhs and many other worshippers remain in His shelter."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸ਼ੇਖ, ਅਤੇ ਮਸ਼ਾਇਕ ਮੁਥਾਜੀ ਕੱਢਦੇ ਹਨ।"