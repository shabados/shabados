[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚਾ ਸਾਹਿਬੁ ਏਕੁ ਹੈ; ਮਤੁ ਮਨ ਭਰਮਿ ਭੁਲਾਹਿ ॥"
page = 428
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Lord is but One, beware thou be beguiled by doubt, O my soul."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚਾ ਸੁਆਮੀ ਕੇਵਲ ਇਕ ਹੈ ਮਤੇ ਤੂੰ ਵਹਿਮ ਅੰਦਰ ਗੁਮਰਾਹ ਹੋ ਜਾਵੇਂ, ਹੇ ਮੇਰੀ ਜਿੰਦੇ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Lord is the One and only; do not be deluded by doubt, O my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚਾ ਸਾਹਿਬੁ ਏਕ ਹੈ ਦੂਸਰਾ ਕੋਈ ਨਹੀਂ ਹੈ, ਹੇ ਮਨ! ਤੂੰ ਮਤ ਭਰਮ ਵਿਖੇ ਭੁਲ ਜਾਤਾ ਹੋਵੇਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਮਤਾਂ ਕਿਤੇ ਮਾਇਆ ਦੀ ਭਟਕਣਾ ਵਿਚ ਪੈ ਕੇ ਕੁਰਾਹੇ ਪੈ ਜਾਏਂ (ਚੇਤਾ ਰੱਖ) ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਸਿਰਫ਼ ਮਾਲਕ-ਪ੍ਰਭੂ ਹੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚਾ = ਸਦਾ-ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ। ਮਤੁ = ਮਤਾਂ। ਮਤੁ ਭੁਲਾਹਿ = ਕਿਤੇ ਭੁੱਲ ਨ ਜਾਈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Verdadero Señor es el Uno Solo; oh mente, no te dejes engañar por la duda."