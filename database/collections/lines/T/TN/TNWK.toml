[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਹੋਇ ਦਇਆਲੁ; ਤਾ ਸਦ ਹੀ ਸੁਖੁ ਦੇਹਾ ॥"
page = 149
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the True Guru becomes merciful then the body is ever in peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਸੱਚੇ ਗੁਰੂ ਮਿਹਰਬਾਨ ਹੋ ਜਾਂਦੇ ਹਨ, ਤਦ ਸਰੀਰ ਨੂੰ ਹਮੇਸ਼ਾਂ ਆਰਾਮ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the True Guru is merciful, the body is always at peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਸਤਿਗੁਰੂ ਦਿਯਾਲ ਹੋਵੈ, ਤੌ ਦੇਹ ਸਦਾ ਸੁਖੀ ਰਹਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਤਰ੍ਹਾਂ) ਉਸ ਦੇ ਸਰੀਰ ਨੂੰ ਸਦਾ ਸੁਖ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el Señor es Compasivo, estamos siempre y para siempre en Paz."