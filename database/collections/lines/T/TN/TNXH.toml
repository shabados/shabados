[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਈਤ ਊਤ. ਨ ਡੋਲਿ ਕਤਹੂ; ਨਾਮੁ ਹਿਰਦੈ ਧਾਰਿ ॥"
page = 1227
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Enshrining the Lord's Name in they mind, here and hereafter, thou shall waver not ever."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਨਾਮ ਨੂੰ ਆਪਣੇ ਮਨ ਵਿੱਚ ਟਿਕਾਉਣ ਦੁਆਰਾ, ਏਥੇ ਅਤੇ ਓਥੇ ਤੂੰ ਕਦੇ ਭੀ ਡਿਕਡੋਲੇ ਨਹੀਂ ਖਾਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Here and hereafter, you shall never waver; enshrine the Naam, the Name of the Lord, within your heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਧਰ ਉਧਰ ਕਹੀਂ ਮਤ ਡੋਲੋ, ਏਕ ਵਾਹਿਗੁਰੂ ਕਾ ਨਾਮ ਹਿਰਦੇ ਮੇਂ ਧਾਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ (ਆਪਣੇ) ਹਿਰਦੇ ਵਿਚ ਵਸਾਈ ਰੱਖ (ਇਸ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਨਾਹ ਇਸ ਲੋਕ ਵਿਚ ਨਾਹ ਪਰਲੋਕ ਵਿਚ ਕਿਤੇ ਭੀ ਨਹੀਂ ਡੋਲੇਂਗਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਈਤ = ਇਸ ਲੋਕ ਵਿਚ। ਊਤ = ਉਸ ਲੋਕ ਵਿਚ। ਕਤਹੂ = ਕਿਤੇ ਭੀ। ਹਿਰਦੈ = ਹਿਰਦੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Enaltezco el Nombre en el corazón y no vacilo ni abandono mi Sendero y, por una muy buena Fortuna,"