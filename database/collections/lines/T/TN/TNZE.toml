[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਿੰਭਰੀਆ ਭਾਮਾ ਭੂਪੇਸੀ ॥੩੩੨॥"
page = 661

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Naga-girls,, the Yaksha women, the ghost, fiends, and Gana Women all were devoid of radiance before her.332."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਭਿੰਬਰੀ, ਭਾਮਾ ਅਤੇ ਰਾਜ ਸ਼ਕਤੀਆਂ (ਉਸ ਦੇ ਸਾਹਮਣੇ ਫਿਕੀਆਂ ਹਨ) ॥੩੩੨॥"