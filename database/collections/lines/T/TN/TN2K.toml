[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧਸੰਗਿ; ਹਰਿ ਕੀਰਤਨੁ ਗਾਹੀ ॥"
page = 1085
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and he hymns God's praise in the saints society."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਹ ਸਤਿਸੰਗਤ ਅੰਦਰ ਵਾਹਿਗੁਰੂ ਦੀ ਮਹਿਮ ਗਾਇਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "he sings the Kirtan of the Lord's Praises in the Saadh Sangat, the Company of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੰਤੋਂ ਕੇ ਸੰਗ ਮਿਲ ਕੇ ਹਰੀ ਕੇ ਕੀਰਤਨ ਕੋ ਗਾਵਤਾ ਹੈ॥☬ਸੋ ਐਸੇ ਬੇਨਤੀ ਕਰਤਾ ਹੈ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਗੁਰੂ ਦੀ ਸੰਗਤ ਵਿਚ ਟਿਕ ਕੇ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੇ ਗੀਤ ਗਾਂਦੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਾਹੀ = ਗਾਹਿ, ਗਾਂਦੇ ਹਨ। ਸਾਧ ਸੰਗਿ = ਸਾਧ ਸੰਗਤ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "canta las Alabanzas del Señor,"