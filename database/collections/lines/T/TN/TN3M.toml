[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁ ਮਤਿ ਸਾਰੁ; ਜਿਤੁ ਹਰਿ ਸਿਮਰੀਜੈ ॥"
page = 895
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sublime is that mind which contemplates the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੇਸ਼ਟ ਹੈ ਉਹ ਮਨ, ਜੋ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That mind is excellent and sublime, which meditates in remembrance on the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਬੁਧੀ ਸ੍ਰੇਸਟ ਹੈ ਜਿਸ ਬੁਧੀ ਕਰ ਕੇ ਹਰੀ ਕੋ ਸਿਮਰੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਹ ਮਤਿ ਗ੍ਰਹਿਣ ਕਰ, ਜਿਸ ਦੀ ਰਾਹੀਂ ਪਰਮਾਤਮਾ ਦਾ ਸਿਮਰਨ ਕੀਤਾ ਜਾ ਸਕੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਰੁ = ਸਾਂਭ, ਸੰਭਾਲ, ਗ੍ਰਹਿਣ ਕਰ। ਜਿਤੁ = ਜਿਸ (ਮਤਿ) ਦੀ ਰਾਹੀਂ। ਸਿਮਰੀਜੈ = ਸਿਮਰਿਆ ਜਾ ਸਕਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La mente que medita en el Señor es Excelente y Sublime,"