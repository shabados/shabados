[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕਾ ਬਚਨੁ; ਜੀਅ ਕੈ ਸੰਗਿ ॥"
page = 177
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru's word remains with the soul."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦਾ ਸ਼ਬਦ ਆਤਮ ਦੇ ਨਾਲ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru's Word is always with the soul."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਪ੍ਰਲੋਕ ਮੇਂ ਭੀ ਗੁਰੋਂ ਕਾ ਹੀ ਬਚਨ ਜੀਵ ਕੇ ਸੰਗ ਰਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦਾ ਉਪਦੇਸ਼ ਸਦਾ ਜਿੰਦ ਦੇ ਨਾਲ (ਨਿਭਣ ਵਾਲਾ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ ਕੈ ਸੰਗਿ = ਜਿੰਦ ਦੇ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Palabra del Shabd del Guru guarda compañía al Alma;"