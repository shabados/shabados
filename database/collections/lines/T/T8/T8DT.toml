[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਮਿਲਿਐ; ਹਰਿ ਮੇਲਾ ਹੋਈ ॥"
page = 157
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By meeting the Guru, God is met."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਨੂੰ ਭੇਟਣ ਦੁਆਰਾ ਵਾਹਿਗੁਰੂ ਮਿਲ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting the Guru, we meet the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਸਾਥ ਮਿਲਨੇ ਕਰ ਹਰੀ ਕੇ ਸਾਥ ਮਿਲਾਪ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਗੁਰੂ ਮਿਲ ਪਏ ਤਾਂ ਪਰਮਾਤਮਾ ਨਾਲ ਮਿਲਾਪ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ ਮਿਲਿਐ = ਜੇ ਗੁਰੂ ਮਿਲ ਪਏ। ਮੇਲਾ = ਮਿਲਾਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que es encontrado por el Guru,"