[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਬਿਸਰਿਐ. ਕਿਉ ਤ੍ਰਿਪਤਾਵੈ; ਨਾ ਮਨੁ ਰੰਜੀਐ ॥"
page = 708
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How can thy mind be contented by forgetting God? it cannot be pleases either."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨੂੰ ਭੁਲਾ ਕੇ ਤੇਰਾ ਚਿੱਤ ਕਿਸ ਤਰ੍ਹਾਂ ਸੰਤੁਸ਼ਟ ਰਹਿ ਸਕਦਾ ਹੈ? ਇਹ ਪ੍ਰਸੰਨ ਨਹੀਂ ਹੋ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forgetting the Lord, how can you be satisfied? Your mind cannot be pleased."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਵਿਸਰੇ ਤੇ ਕੈਸੇ ਤ੍ਰਿਪਤੀ ਆਵੈ ਅਰਥਾਤ ਨਹੀਂ ਆਵਤੀ ਔ ਨਾ ਮਨ ਹੀਂ (ਰੰਜੀਐ) ਪ੍ਰਸੰਨ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੂੰ ਵਿਸਾਰਿਆਂ (ਨਿਰੀ ਮਾਇਆ ਨਾਲ) ਰੱਜੀਦਾ ਭੀ ਨਹੀਂ ਤੇ ਨਾਹ ਹੀ ਮਨ ਪ੍ਰਸੰਨ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਉ ਤ੍ਰਿਪਤਾਵੈ = ਰੱਜ ਨਹੀਂ ਸਕਦਾ। ਰੰਜੀਐ = ਪ੍ਰਸੰਨ ਹੁੰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cómo puede uno saciarse abandonando al Señor? ¿Cómo puede uno estar complacido?"