[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਛੋਦ ਕਰੋਟਨ ਓਟਨ ਕੋਟ; ਅਟਾਨਮੋ ਜਾਨਕੀ ਬਾਨ ਪਛਾਨੇ ॥੬੧੬॥"
page = 265

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They penetrated to the other side, when the arrows fell after piercing the steel-armours, Sita realized that these arrows were discharged by Ram.616."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਖੋਪਰੀਆਂ ਦੀ ਰੱਖਿਆ ਕਰਨ ਵਾਲੇ (ਟੋਪਾਂ) ਨੂੰ ਛੇਕ ਕੇ ਕਿਲੇ ਦੀਆਂ ਅਟਾਰੀਆਂ ਵਿੱਚ ਜਾ ਡਿੱਗੇ (ਜਿਨ੍ਹਾਂ ਨੂੰ) ਸੀਤਾ ਨੇ ਪਛਾਣ ਲਿਆ ॥੬੧੬॥"