language = "pa"
data = "ਉਹ ਬਖਸ਼ਿਸ਼ਾਂ ਦਾ ਅਤਿਅੰਤ ਹੈ ਅਤੇ ਨਿਆਮਤਾਂ ਦਾ ਵੱਡਾ ਸਮੂਹ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਵਫ਼ੂਰੁਲ ਅਤਾ ਓ ਅਮੀਮੁਲ ਨਅਮ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "He is the treasure of bestowals and a great collection of blessings,"