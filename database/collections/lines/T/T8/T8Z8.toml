[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਦੇ ਨ ਹੋਵੈ ਘਟਿ; ਸਚੀ ਪਤਿਸਾਹੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The warehouse of the True King is never deficient."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਦੇ ਬੀ ਘੱਟ ਨਹੀਂ ਹੋਊ (ਕਿਉਂਕਿ) ਸੱਚੇ ਦੀ ਪਾਤਸ਼ਾਹੀ ਦਾ ਹੈ।"