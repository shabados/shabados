[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰੀਤਿ ਰਹੀ ਹਮ ਸੋ ਤੁਮਰੀ ਕਹਾ, ਯੌ ਕਹਿ ਕੈ ਦ੍ਰਿਗਿ ਬਾਰਿ ਭਰੀਨੋ ॥"
page = 369

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "” Saying this, the eyes of Radha were filled with tears, she said again,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਨਾਲ ਹੁਣ ਤੁਹਾਡੀ ਪ੍ਰੀਤ ਕਿਥੇ ਰਹੀ ਹੈ। ਇਸ ਤਰ੍ਹਾਂ ਕਹਿਣ ਤੇ ਅੱਖੀਆਂ ਵਿਚ ਜਲ ਭਰ ਗਿਆ।"