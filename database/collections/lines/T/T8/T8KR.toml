[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਗੰਜੋ ਅਭੰਜੋ ਅਰੂਪੋ ਅਰੇਖ ॥"
page = 1394

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Now listen to the Tale of Raja Daleep,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ ਪਰਮਾਤਮਾ) ਅਗੰਜ (ਨ ਨਸ਼ਟ ਕੀਤੇ ਜਾ ਸਕਣ ਵਾਲਾ) ਅਭੰਜ (ਨ ਭੰਨਿਆ ਜਾ ਸਕਣ ਵਾਲਾ) ਰੂਪ ਤੋਂ ਰਹਿਤ ਅਤੇ ਰੇਖਾ ਤੋਂ ਪਰੇ ਹੈ।"