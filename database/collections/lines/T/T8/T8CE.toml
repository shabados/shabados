[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੀ ਪ੍ਰੀਤਿ; ਗੋਵਿੰਦ ਸਿਉ ਲਾਗੀ ॥"
page = 198
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Such an affection I have contracted with the World Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹੋ ਜੇਹੀ ਪਿਰਹੜੀ ਮੇਰੀ ਸ਼ਿਸ਼ਟੀ ਦੇ ਸੁਆਮੀ ਨਾਲ ਪੈ ਗਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such is my love for the Lord of the Universe;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੀ ਐਸੀ ਪ੍ਰੀਤ ਜੋ ਆਗੇ ਕਹੀ ਜਾਤੀ ਹੈ ਗੋਵਿੰਦ ਕੇ ਸਾਥ ਲਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਨਾਲ ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਦੀ ਇਹੋ ਜਿਹੀ ਪ੍ਰੀਤਿ (ਜਿਸ ਦਾ ਜ਼ਿਕਰ ਇਥੇ ਕੀਤਾ ਜਾ ਰਿਹਾ ਹੈ) ਬਣਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਉ = ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tal es mi Amor por Gobind, Dios Sostenedor,"