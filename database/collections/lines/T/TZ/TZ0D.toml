language = "pa"
data = "ਹੇ ਮਿਤ੍ਰ ਸੰਤੋ! ਸੋ ਅਸਥਾਨ ਮੇਰੇ ਕੋ ਦਸੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਿੱਤਰ! ਨੂੰ ਮੈਨੂੰ ਉਹ ਥਾਂ ਦੱਸ,"

