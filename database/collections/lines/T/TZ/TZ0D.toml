type = "translation"
language = "pa"
data = "ਹੇ ਮਿਤ੍ਰ! ਮੈਨੂੰ ਉਹ ਜਗ੍ਹਾ ਦੱਸੋ,"

[[content]]
assets = ["DSSK"]
type = "translation"
