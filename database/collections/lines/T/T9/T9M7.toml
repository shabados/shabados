[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਠੁ ਫਰੀਦਾ, ਉਜੂ ਸਾਜਿ; ਸੁਬਹ ਨਿਵਾਜ ਗੁਜਾਰਿ ॥"
page = 1381
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Farid! Wake up and perform thy ablution and say thy morning prayer."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੜਾ ਹੋ, ਓ ਫਰੀਦ! ਉਜੂ ਕਰ ਅਤੇ ਸਵੇਰ ਦੀ ਨਮਾਜ ਪੜ੍ਹ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Rise up, Fareed, and cleanse yourself; chant your morning prayer."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਫਰੀਦ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਹੇ ਭਾਈ! ਉਠ ਕਰ ਕੇ ਉਜੂ ਕਰ ਔਰ ਸੁਬਹ ਕੀ ਨਿਵਾਜ ਪੜ੍ਹ ਕਰ ਕੇ ਇਸ ਸਮੇਂ ਕੋ ਗੁਜਾਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਫਰੀਦ! ਉੱਠ, ਮੂੰਹ ਹੱਥ ਧੋ, ਤੇ ਸਵੇਰ ਦੀ ਨਿਮਾਜ਼ ਪੜ੍ਹ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਜੂ = ਨਿਮਾਜ਼ ਪੜ੍ਹਨ ਤੋਂ ਪਹਿਲਾਂ ਹੱਥ ਮੂੰਹ ਪੈਰ ਧੋਣੇ। ਉਜੂ ਸਾਜਿ = ਉਜ਼ੂ ਕਰ, ਮੂੰਹ ਹੱਥ ਧੋ। ਸੁਬਹ = ਸਵੇਰ ਦੀ। ਨਿਵਾਜ ਗੁਜਾਰਿ = ਨਿਮਾਜ਼ ਪੜ੍ਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Levántate, dice Farid, y limpia tu ser, realiza tus oraciones de la mañana,"