[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਬਾਰਿਕ; ਮਾਤਾ ਸੰਮਾਰੇ ॥"
page = 105
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "as a mother takes care of her child."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਮਾਂ ਆਪਣੇ ਬੱਚੇ ਦੀ ਸੰਭਾਲ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "as the mother cares for her children."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਬਾਲਿਕ ਕੋ ਮਾਤਾ ਸੰਭਾਲਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਮਾਂ ਆਪਣੇ ਬੱਚਿਆਂ ਦੀ ਸੰਭਾਲ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਮਾਰੇ = ਸੰਭਾਲਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así como la madre da soporte a su hijo."