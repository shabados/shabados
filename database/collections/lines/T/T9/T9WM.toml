[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਟੇ ਸਗਲ ਭੈ ਤ੍ਰਾਸ ॥"
page = 896
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then all your fears and alarms shall depart,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇਰੇ ਸਾਰੇ ਡਰ ਤੇ ਖੌਫ ਦੂਰ ਹੋ ਜਾਣਗੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All fears and terrors are taken away,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਤੇ ਸਭੀ ਸੰਸਾਰੀ ਭੈ ਔ ਜਮੋਂ ਕੇ ਤ੍ਰਾਸ ਮਿਟ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਨੁੱਖ ਦੇ ਸਾਰੇ ਡਰ ਸਹਿਮ ਮਿਟ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੈ = {ਲਫ਼ਜ਼ 'ਭਉ' ਤੋਂ ਬਹੁ-ਵਚਨ}। ਤ੍ਰਾਸ = ਡਰ, ਸਹਿਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así te liberarás de tus miedos"