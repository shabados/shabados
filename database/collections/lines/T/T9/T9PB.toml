data = "ਹਸੇ ਬ੍ਰਯੋਮਚਾਰੀ ॥"
page = 108

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The meat-eaters are dancing, those who roam in the sky, are laughing."

[[content]]
