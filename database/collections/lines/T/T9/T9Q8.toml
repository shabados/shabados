[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਪ ਮਿਟਹਿ; ਸਾਧੂ ਸਰਨਿ ਦਇਆਲ ॥ ਰਹਾਉ ॥"
page = 202
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sins are effaced by seeking the shelter of the kind saints. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰਿਪਾਲੂ ਸੰਤਾਂ ਦੀ ਪਨਾਹ ਲੈਣ ਦੁਆਰਾ ਪਾਪ ਨੇਸਤੋ-ਨਾਬੂਦ ਹੋ ਜਾਂਦੇ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Their sins are erased, in the Sanctuary of the Kind and Holy Saints. ||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਸਾਧੂ ਜੋ ਦਿਆਲੂ ਹੈਂ ਤਿਨ ਕੀ ਸਰਣ ਲੇਨੇ ਸੇ ਪਾਪ ਮਿਟ ਜਾਤੇ ਹੈਂ॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦਇਆ ਦੇ ਸੋਮੇ ਗੁਰੂ ਦੀ ਸਰਨ ਪਿਆਂ (ਸਾਰੇ) ਪਾਪ ਮਿਟ ਜਾਂਦੇ ਹਨ ॥ਰਹਾਉ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਰਧ = {ऊध्र्व = ਉੱਚਾ} ਉੱਚਾ ਪੁੱਠਾ ਲਟਕ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y son liberados de las consecuencias de sus actos, cuando buscan el Refugio de los Santos Benéficos. (Pausa)"