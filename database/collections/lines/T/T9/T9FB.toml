[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਜਾ ਕੇ ਪੂਰੇ ਭਾਗ ॥"
page = 864
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, he who is blessed with perfect fortune,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਫੁਰਮਾਉਂਦੇ ਹਨ, ਜਿਸ ਦੀ ਪੂਰਨ ਪ੍ਰਾਲਭਧ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, one who is blessed with perfect destiny"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਨ ਕੇ ਪੂਰੇ ਭਾਗ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਜਿਸ ਮਨੁੱਖ ਦੇ ਵੱਡੇ ਭਾਗ ਜਾਗਦੇ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, aquél que es bendecido con un Destino Perfecto,"