[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤ ਵਛਲੁ; ਤੇਰਾ ਬਿਰਦੁ ਰਖਾਇਆ ਜੀਉ ॥"
page = 216
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art the lover of Thine devotees. This daily function Thou hast taken upon Thyself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੇ ਅਨੁਰਾਗੀਆਂ ਦਾ ਪਿਆਰਾ ਹੈਂ। ਇਹ ਨਿਤਕ੍ਰਮ ਤੂੰ ਧਾਰਨ ਕੀਤਾ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the Lover of Your devotees; this is Your Nature."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭਗਤੋਂ ਕਾ ਪਿਆਰਾ ਏਹ ਤੇਰਾ (ਬਿਰਦੁ) ਪ੍ਰਣ ਰਖਾਯਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਭਗਤਾਂ ਦਾ ਪਿਆਰਾ ਹੋਣਾ-ਇਹ ਤੇਰਾ ਮੁੱਢ-ਕਦੀਮਾਂ ਦਾ ਸੁਭਾ ਬਣਿਆ ਆ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਛਲੁ = {वत्सल} ਪਿਆਰਾ। ਬਿਰਦੁ = ਮੁੱਢ-ਕਦੀਮਾਂ ਦਾ ਸੁਭਾਉ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "eres el Amante de Tus Devotos; así es Tu Naturaleza, oh Tú,"