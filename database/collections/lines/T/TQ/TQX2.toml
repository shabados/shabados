[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਾਧੋ ਸੋਢੀ ਕਾਸਮੀਰ; ਗੁਰਸਿਖੀ ਦੀ ਚਾਲ ਚਲਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Madho Sodhi made the Sikh tradition in vogue in Kashmir."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮਾਧੋ ਸੋਢੀ ਨੇ ਕਸ਼ਮੀਰ ਵਿਚ ਜਾ ਕੇ ਗੁਰ ਸਿੱਖੀ ਦੀ ਰੀਤ=ਤੋਰੀ।"