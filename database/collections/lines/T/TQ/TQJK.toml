[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਾਰਿ ਪਦਾਰਥ; ਕਹੈ ਸਭੁ ਕੋਈ ॥"
page = 154
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Everyone talks of the four cardinal boons,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਕੋਈ ਚਾਰ ਉਤਮ ਦਾਤਾਂ ਦਾ ਜਿਕਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everyone speaks of the four great blessings;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚਾਰ ਪਦਾਰਥ ਧਰਮੁ, ਅਰਥੁ, ਕਾਮੁ, ਮੋਖੁ, ਇਨ ਕੋ ਸਭ ਕੋਈ ਕਹਤਾ ਹੈ॥☬ਜੋ ਕਹੇ ਸੋ ਕਹਣੇ ਵਾਲਾ ਕਵਣੁ ਹੈ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰੇਕ ਜੀਵ ਧਰਮ ਅਰਥ ਕਾਮ ਮੋਖ (ਮੁਕਤੀ) ਇਹਨਾਂ ਚਾਰ ਪਦਾਰਥਾਂ ਦਾ ਜ਼ਿਕਰ ਤਾਂ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਾਰਿ ਪਦਾਰਥ = ਧਰਮ, ਅਰਥ, ਕਾਮ, ਮੋਖ। ਸਭੁ ਕੋਈ = ਹਰੇਕ (ਵਿਚਾਰਵਾਨ) ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los textos Semíticos, los Shastras y los teólogos dicen que hay cuatro metas en la vida:"