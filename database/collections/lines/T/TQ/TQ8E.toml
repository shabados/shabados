data = "ਕਹੂੰ ਰਿਗੰ ਬਾਚੈ ਮਹਾ ਅਰਥ ਬੇਦੰ ॥"
page = 151

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere the Rig Veda was being read and somewhere the Atharva Veda"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ ਰਿਗ ਵੇਦ ਅਤੇ ਕਿਤੇ ਮਹਾਨ ਅਥਰਬਨ ਵੇਦ ਨੂੰ ਵਾਚਿਆ ਜਾ ਰਿਹਾ ਸੀ।"