[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਰਤੀ ਸੇਵਕ; ਪਾਇਕ ਚਰਨਾ ॥"
page = 130
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The earth is Thy servant, a slave of Thine feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਮੀਨ ਤੇਰੀ ਦਾਸੀ ਹੈ, ਤੇਰੇ ਪੈਰਾਂ ਦੀ ਗੋਲੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The earth is Your servant, a slave at Your Feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਤੇਰੇ ਚਰਨੋਂ ਕੇ (ਪਾਇਕ) ਦਾਸ ਹੈਂ ਤਿਨ ਕੀ ਧਰਤੀ ਸੇਵਕ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇਰੀ ਪੈਦਾ ਕੀਤੀ ਹੋਈ) ਧਰਤੀ ਤੇਰੇ ਚਰਨਾਂ ਦੀ ਟਹਲਣ ਹੈ ਸੇਵਕਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਇਕ = ਟਹਿਲਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y la tierra es esclava a Tus Pies."