[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪੁਨਿ ਕਰਤਿ ਹ੍ਰਿਦੈ ਭਗਵਾਨ ਬਾਸ ॥੮॥"
page = 178

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In this way, destroying all the tyrants, he then abides in the heart of his devotees.8."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਭਗਵਾਨ ਦੇ ਹਿਰਦੇ ਵਿਚ ਨਿਵਾਸ ਜਾ ਕਰਦਾ ਹੈ ॥੮॥"