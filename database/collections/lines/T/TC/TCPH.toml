[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਨਿਆਸੀ. ਬਿਭੂਤ ਲਾਇ; ਦੇਹ ਸਵਾਰੀ ॥"
page = 164
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The solitarian applies ashes to decorate his body."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕਾਂਤੀ ਸੁਆਹ ਮਲ ਕੇ ਆਪਣੇ ਸਰੀਰ ਨੂੰ ਸ਼ਿੰਗਾਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Sannyaasee smears his body with ashes;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਨਿਆਸੀਓਂ ਨੇ ਬਿਭੂਤੀ ਕੋ ਲਗਾਇ ਕਰ ਦੇਹ ਸਵਾਰ ਰਖੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਨਿਆਸੀ ਨੇ ਸੁਆਹ ਮਲ ਕੇ ਆਪਣੇ ਸਰੀਰ ਨੂੰ ਸਵਾਰਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਭੂਤ = ਸੁਆਹ। ਦੇਹ = ਸਰੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Sanyasa se unta el cuerpo de cenizas."