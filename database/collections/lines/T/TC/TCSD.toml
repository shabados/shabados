[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਣ ਅੰਗੂਰਾਣ ਦੇ ਗੁੱਛਿਆਣ ਵਿੱਚੋਣ ਦਾਨੇ ਡਿਗਦੇ ਰਹਿੰਦੇ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਗੋਯਾ ਮਿਸਾਲਿ ਦਾਨਾ ਕਿ ਅਜ਼ ਖ਼ੋਸ਼ਾ-ਹਾਇ ਤਾਕ ॥੫੧॥੭॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
