[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਹੀ. ਬਿਨੁ ਹਰਿ ਨਾਉ ॥"
page = 1341
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "without the God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦੇ ਬਗੈਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "none at all, without the Lord's Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਲੋਕ ਮੇਂ ਕੋਈ ਦੂਜਾ ਥਾਉਂ ਨਹੀਂ ਹੈ, ਭਾਵ ਏਹ ਲੋਕ ਪ੍ਰਲੋਕ ਮੇਂ ਨਾਮ ਕਾ ਹੀ ਆਸਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਤੋਂ ਬਿਨਾ (ਹੋਰ ਕੋਈ ਸਹਾਰਾ) ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ninguno en Verdad, sin el Nombre del Señor,"