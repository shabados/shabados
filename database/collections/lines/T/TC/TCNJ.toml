[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹ ਜਹ ਦੇਖਾ; ਤਹ ਰਹਿਆ ਸਮਾਈ ॥੧॥ ਰਹਾਉ ॥"
page = 822
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wherever I see, I find Him pervading there. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਕਿਤੇ ਭੀ ਮੈਂ ਵੇਖਦਾ ਹਾਂ, ਉਥੇ ਮੈਂ ਉਸ ਨੂੰ ਵਿਆਪਕ ਪਾਉਂਦਾ ਹਾਂ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wherever I look, I see the Lord pervading. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਹਾਂ ਜਹਾਂ ਮੈਂ ਤੁਝ ਕੋ ਦੇਖਤਾ ਹੂੰ ਤਹਾਂ ਤਹਾਂ ਤੂੰ ਸਰਬ ਮੇਂ ਸਮਾਇ ਰਹਿਆ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤਾਂ ਜਿਧਰ ਤੱਕਦਾ ਹਾਂ, ਉਧਰ ਪਰਮਾਤਮਾ ਹੀ ਸਭ ਥਾਈਂ ਮੌਜੂਦ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਹ ਜਹ = ਜਿੱਥੇ ਜਿੱਥੇ, ਮੈਂ ਵੇਖਦਾ ਹਾਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero donde sea que volteo a ver, ahí veo al Señor prevaleciendo en todo."