[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ ਕੈ; ਨਾਹੀ ਅਭਿਮਾਨ ॥"
page = 272
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The God-awakened has no pride."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮ-ਬੇਤੇ ਵਿੱਚ ਹੰਕਾਰ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The God-conscious being has no egotistical pride."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਬ੍ਰਹਮ ਗਿਆਨੀ ਕੇ ਚਿਤ ਮੇਂ ਦੇਹਿ ਅਭਿਮਾਨ ਨਹੀਂ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕ) ਉਸ ਦੇ ਅੰਦਰ ਅਹੰਕਾਰ ਨਹੀਂ ਹੈ (ਕਿਸੇ ਦੇ ਚੰਗੇ ਮੰਦੇ ਸਲੂਕ ਦਾ ਹਰਖ ਸੋਗ ਨਹੀਂ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues se halla liberado del ego divisorio."