[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛੀਪੇ ਕੇ ਜਨਮਿ; ਕਾਹੇ ਕਉ ਆਇਆ ॥੧॥ ਰਹਾਉ ॥"
page = 1164
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why was I born a calico-printer? Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਪੈਦਾਇਸ਼ ਛੀਬੇ ਦੇ ਘਰ ਕਿਉਂ ਹੋਈ? ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "why was I born into a family of fabric dyers? ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਜਨਮੁ ਛੀਪੇ ਕੇ ਘਰ ਕਿਸ ਵਾਸਤੇ ਆਇਆ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਛੀਂਬੇ ਦੇ ਘਰ ਕਿਉਂ ਜੰਮ ਪਿਆ? ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਹੇ ਕਉ = ਕਾਹਦੇ ਲਈ? ਕਿਉਂ? ਆਇਆ = ਮੈਂ ਜੰਮਿਆ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entonces ¿por qué me hiciste nacer y ser un impresor? (1-Pausa)"