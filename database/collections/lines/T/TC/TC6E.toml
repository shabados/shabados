[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਖੁ. ਬੇਢੀ ਰਹਿਓ ਸਮਾਈ ॥"
page = 657
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lo, my carpenter is pervading everywhere."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵੇਖ! ਮੇਰਾ ਤਰਖਾਣ ਹਰ ਥਾਂ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Behold, my carpenter is pervading everywhere."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਬੇਢੀ ਕੋ ਸਰਬ ਮੇਂ ਸਮਾਇ ਰਹਿਆ ਹੂਆ ਦੇਖੁ ਤੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵੇਖ, ਉਹ ਤਰਖਾਣ ਹਰ ਥਾਂ ਮੌਜੂਦ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "este Carpintero está prevaleciendo por todas partes."