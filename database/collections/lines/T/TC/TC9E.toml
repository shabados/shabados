[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸਹਜਿ ਸੁਭਾਇ, ਨ ਅਲਖ ਲਖਾਵਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The gurmukh realises the imperceptible Lord spontaneously."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਫੇਰ ਸਿੱਖ) ਗੁਰੂ ਦੁਆਰਾ ਸਹਿਜ ਸੁਭਾਵ ਹੀ ਅਲਖ ਨੂੰ ਲਖ ਲੈਂਦਾ ਹੈ।"