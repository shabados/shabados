[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਡਫ ਬਾਰ ਤਰੰਗ ਰਬਾਬ ਤੁਰੀ; ਰਣਿ ਸੰਖ ਅਸੰਖ ਬਜਾਵਹਿਗੇ ॥"
page = 565

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The tabors, the musical glasses, rababs and conches etc. will be played,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਡਫ, ਜਲਤਰੰਗ, ਰਬਾਬ, ਤੁਰੀ ਅਤੇ ਰਣਸਿੰਗੇ ਅਣਗਿਣਤ ਵਜਾਉਣਗੇ।"