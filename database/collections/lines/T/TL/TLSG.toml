[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਡੈ ਭਾਗਿ; ਗੁਰੁ ਅਪੁਨਾ ਪਾਇਓ ॥"
page = 715
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By great good fortune, I have found my Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਰੇ ਚੰਗੇ ਭਾਗਾਂ ਰਾਹੀਂ ਮੈਂ ਆਪਣਾ ਗੁਰੂ ਪ੍ਰਾਪਤ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By great good fortune, I have found my Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਵੱਡੇ ਭਾਗੋਂ ਕਰ ਕੇ ਹਮਨੇ ਗੁਰੂ ਪਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਬੜੀ ਕਿਸਮਤਿ ਨਾਲ ਮੈਂ ਆਪਣਾ ਗੁਰੂ ਲੱਭਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਗਿ = ਕਿਸਮਤ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Destino fue grandioso y logré encontrar al Guru;"