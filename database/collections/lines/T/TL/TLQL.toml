[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਣਿ ਮਾਛਿੰਦ੍ਰਾ; ਨਾਨਕੁ ਬੋਲੈ ॥"
page = 877
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, hear thou, O Machhinder:"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਤੂੰ ਸੁਣ, ਹੇ ਮਾਛਿੰਦਰ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen, Machhindra, to what Nanak says."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਮਛਿੰਦ੍ਰਾ! ਸੁਨ ਭਗਵਤ ਕੇ ਨਾਮ ਕੋ (ਬੋਲੈ) ਉਚਾਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ-ਹੇ ਮਾਛਿੰਦ੍ਰ! ਸੁਣ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਛਿੰਦ੍ਰਾ = ਹੇ ਮਾਛਿੰਦ੍ਰ ਜੋਗੀ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escucha, oh Machindra, maestro de Yoguis, Nanak desea hablarte."