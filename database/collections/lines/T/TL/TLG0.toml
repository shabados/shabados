[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਦਾਸ ਸਦਾ ਕੁਰਬਾਨੀ ॥"
page = 1074
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, Thy slave is ever a sacrifice unto Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਗੋਲਾ, ਨਾਨਕ ਤੇਰੇ ਉੱਤੋ ਹਮੇਸ਼ਾਂ ਹੀ ਘੋਲੀ ਵੰਝਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak, Your slave, is forever a sacrifice to You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੈਂ ਤਿਸ ਉਪਰੋਂ ਸਦਾ ਕੁਰਬਾਨ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਤੇਰੇ ਦਾਸ ਤੈਥੋਂ ਸਦਾ ਸਦਕੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tu Sirviente ofrece su ser en sacrificio a Ti. Sí, asociándose a los Santos,"