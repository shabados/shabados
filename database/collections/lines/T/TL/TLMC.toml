[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈ ਕਾਮਣਿ; ਮੇਰਾ ਕੰਤੁ ਕਰਤਾਰੁ ॥"
page = 1128
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am the bride. My Groom is the Creator Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਪਤਨੀ ਹਾਂ। ਮੇਰਾ ਪਤੀ ਸਿਰਜਣਹਾਰ ਸੁਆਮੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am the bride; the Creator is my Husband Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ (ਕਾਮਣਿ) ਇਸਤ੍ਰੀ ਹਾਂ ਔਰ ਮੇਰਾ (ਕੰਤੁ) ਪਤੀ (ਕਰਤਾਰੁ) ਸਰਬ ਕਾ ਕਰਤਾ ਵਾਹਿਗੁਰੂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਖੀ! ਮੈਂ (ਜੀਵ-) ਇਸਤ੍ਰੀ ਹਾਂ, ਕਰਤਾਰ ਮੇਰਾ ਪਤੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਮਣਿ = ਇਸਤ੍ਰੀ, ਜੀਵ-ਇਸਤ੍ਰੀ। ਕੰਤੁ = ਖਸਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Soy la novia del Señor, y mi Esposo es Dios,"