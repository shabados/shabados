[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਚੀਨਿ ਚਤੁਰ, ਚਿਤ ਰਾਖੁ ॥੬੧੨॥"
page = 745

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying “Bahanantaki” and then uttering “Ripu-naadini”, the names of Tupak are formed.612."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤੁਪਕ ਦਾ ਨਾਮ ਬਣਦਾ ਹੈ। ਸਮਝਦਾਰੋ! ਚਿਤ ਵਿਚ ਰਖ ਲਵੋ ॥੬੧੨॥"