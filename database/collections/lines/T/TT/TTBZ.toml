[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਜਪਤ; ਮਨਿ ਭਏ ਅਨੰਦ ॥"
page = 201
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Repeating the Lord's Name, the mind is rendered blissful."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਨ ਦੁਆਰਾ ਚਿੱਤ ਪ੍ਰਸੰਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chanting the Naam, the Name of the Lord, the mind becomes blissful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਨਾਮ ਕੇ ਜਪਨੇ ਸੇ ਮਨ ਮੇਂ ਅਨੰਦ ਭਏ ਹਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਸਭ ਤੋਂ ਉੱਚੇ ਆਨੰਦ ਦੇ ਮਾਲਕ ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਪ੍ਰੇਮ ਨਾਲ ਗਾਵਿਆਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Habitando en el Naam, el Nombre del Señor,"