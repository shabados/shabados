data = "ਸੰਤ ਕ੍ਰਿਪਾਲ; ਕ੍ਰਿਪਾ ਜੇ ਕਰੈ ॥"
page = 279
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If the compassionate saints show him mercy,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਮਿਹਰਬਾਨ ਸਾਧੂ ਉਸ ਤੇ ਮਿਹਰ ਧਾਰਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But if the Compassionate Saint shows His Kindness,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਸੰਤ ਕ੍ਰਿਪਾਲੂ ਤਿਸ ਦੋਸੀ ਪਰ ਭੀ ਜੇਕਰ ਅਪਨੀ ਕ੍ਰਿਪਾ ਕਰੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਜੇ ਕ੍ਰਿਪਾਲ ਸੰਤ ਆਪ ਕਿਰਪਾ ਕਰੇ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y sin embargo, oh, dice Nanak, tal calumniador puede alcanzar Salvación,"