[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਮਾਇਆ ਸ੍ਰਮ ਮਾਹਿ ॥"
page = 275
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many myriads take pain in amassing wealth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਕ੍ਰੋੜ ਧੰਨ ਇਕੱਤ੍ਰ ਕਰਨ ਵਿੱਚ ਕਸ਼ਟ ਉਠਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions struggle in Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਈ ਕ੍ਰੋੜੋਂ ਜਨ ਮਾਯਾ ਕੋ ਸੰਚਨ ਕਰਨੇ ਮੇਂ ਹੀ ਥਕਤ ਹੋ ਰਹਿਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਰੋੜਾਂ (ਮਨੁੱਖ) ਧਨ ਪਦਾਰਥ ਦੀ (ਖ਼ਾਤਰ) ਮੇਹਨਤ ਵਿਚ ਜੁੱਟੇ ਹੋਏ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸ੍ਰਮ = ਮੇਹਨਤ। ਮਾਇਆ = ਧਨ-ਪਦਾਰਥ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones son los que luchan en medio de Maya."