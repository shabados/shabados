[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਤੇ ਜਾਨਿਆ. ਹਾਂ ॥"
page = 410
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thought the Guru, He is known."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਉਹ ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is known only through the Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਹ ਭੇਦ ਗੁਰੋਂ ਸੇ ਜਾਨਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਉਸ ਪਰਮਾਤਮਾ ਨਾਲ ਡੂੰਘੀ ਸਾਂਝ ਪਾ ਲਈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ ਪਾਸੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, mi mente está satisfecha"