[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਹਦ ਬਾਣੀ; ਸਬਦੁ ਵਜਾਏ ॥੭॥"
page = 231
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "For him unbeaten strain of the Name re-sounds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਲਈ ਨਾਮ ਦਾ ਸੁਤੇ ਸਿਧ ਕੀਰਤਨ ਗੂੰਜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The unstruck melody of the Shabad vibrates for them. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਉਪਦੇਸ ਰੂਪ ਬਾਣੀ ਕੋ (ਅਨਹਦ) ਏਕ ਰਸ (ਵਜਾਏ) ਜਪਤਾ ਹੈ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਵੇਂ ਢੋਲ ਵੱਜਿਆਂ ਕੋਈ ਨਿੱਕਾ-ਮੋਟਾ ਹੋਰ ਖੜਾਕ ਸੁਣਾਈ ਨਹੀਂ ਦੇਂਦਾ) ਉਹ ਮਨੁੱਖ (ਆਪਣੇ ਅੰਦਰ) ਇਕ-ਰਸ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦਾ ਸ਼ਬਦ ਉਜਾਗਰ ਕਰਦਾ ਹੈ (ਜਿਸ ਦੀ ਬਰਕਤਿ ਨਾਲ ਕੋਈ ਹੋਰ ਮੰਦੀ ਪ੍ਰੇਰਨਾ ਅਸਰ ਨਹੀਂ ਪਾ ਸਕਦੀ ॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਹਦ = {अनहत} ਬਿਨਾ ਵਜਾਏ, ਇਕ-ਰਸ, ਲਗਾਤਾਰ, ਸਦਾ ਹੀ। ਬਾਣੀ ਵਜਾਏ = ਬਾਣੀ ਵਜਾਂਦਾ ਹੈ, ਬਾਣੀ ਦਾ ਪ੍ਰਬਲ ਪ੍ਰਭਾਵ ਪਾਈ ਰੱਖਦਾ ਹੈ (ਜਿਸ ਕਰਕੇ ਵਿਕਾਰਾਂ ਦੀ ਪ੍ਰੇਰਨਾ ਸੁਣੀ ਨਹੀਂ ਜਾ ਸਕਦੀ) ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y la Melodía Celestial resuena en su mente.(7)"