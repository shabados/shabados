[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖ. ਭਗਤਿ, ਕਰਹਿ, ਬਿਨੁ ਸਤਿਗੁਰ; ਵਿਣੁ ਸਤਿਗੁਰ ਭਗਤਿ ਨ ਹੋਈ ਰਾਮ ॥"
page = 768
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The perverse worship the Lord without the True Guru, but how can the devotional service be performed without the Guru?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਤੀਕੂਲ ਪੁਰਸ਼ ਸੱਚੇ ਗੁਰਾਂ ਦੇ ਬਗੈਰ ਸੁਆਮੀ ਦੀ ਉਪਾਸ਼ਨਾ ਕਰਦੇ ਹਨ ਪ੍ਰੰਤੂ ਸੱਚੇ ਗੁਰਾਂ ਦੇ ਬਗੈਰ ਪ੍ਰੇਮ-ਮਈ ਸੇਵਾ ਕਿਸ ਤਰ੍ਹਾਂ ਕੀਤੀ ਜਾ ਸਕਦੀ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The self-willed manmukhs practice devotional rituals without the True Guru, but without the True Guru, there is no devotion."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮਨਮੁਖ ਸਤਿਗੁਰੋਂ ਕੇ ਉਪਦੇਸ ਬਿਨਾ ਭਗਤੀ ਕਰਤੇ ਹੈਂ, ਸਤਿਗੁਰ ਬਿਨਾਂ ਪਰੰਤੂ ਰਾਮ ਕੀ ਭਗਤੀ ਨਹੀਂ ਹੋਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਣ ਤੋਂ ਬਿਨਾ (ਆਪਣੇ ਵਲੋਂ) ਪ੍ਰਭੂ ਦੀ ਭਗਤੀ ਕਰਦੇ ਹਨ, ਪਰ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਣ ਤੋਂ ਬਿਨਾ ਭਗਤੀ ਹੋ ਨਹੀਂ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਮੁਖ = ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ ਮਨੁੱਖ। ਕਰਹਿ = ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los arrogantes Manmukjs también alaban al Señor; pero sin el Verdadero Guru, ¿cómo puede uno alabar al Señor?"