[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਸਾਹਿਬੁ; ਰਹਿਆ ਭਰਪੂਰਿ ॥"
page = 330
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That Lord is fully pervading everywhere."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਆਮੀ ਹਰ ਥਾਂ ਪਰੀਪੂਰਨ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That Lord and Master is pervading everywhere."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਸਾਹਿਬੁ ਸਭ ਜਗਾ ਮੇਂ ਪੂਰਨ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮਨ!) ਉਹ ਮਾਲਕ ਪ੍ਰਭੂ ਸਭ ਥਾਈਂ ਮੌਜੂਦ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਰਪੂਰਿ = ਸਭ ਥਾਈਂ ਮੌਜੂਦ, ਵਿਆਪਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, nuestro Señor, prevalece en todo, y llena todo"