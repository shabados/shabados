[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਰੁ ਲਸਕਰੁ ਸਭੁ ਤੇਰਾ ॥"
page = 622
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My home and hosts all art Thine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਗ੍ਰਿਹ ਅਤੇ ਸੈਨਾ ਸਮੂਹ ਤੈਂਡੇ ਹੀ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My home and all my possessions are Yours."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹੁ ਘਰ ਸਰੀਰ ਔ ਲਸਕਰ, ਭਾਵ ਪ੍ਰਾਣੋਂ ਕਾ ਸਮਦਾਉ ਸਭ ਤੇਰਾ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੀਵਾਂ ਨੂੰ) ਸਾਰਾ ਘਰ-ਘਾਟ ਤੇਰਾ ਹੀ ਦਿੱਤਾ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਰੁ ਲਸਕਰੁ = ਘਰ ਅਤੇ ਪਰਵਾਰ ਆਦਿਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mi hogar y mis huéspedes Te pertenecen."