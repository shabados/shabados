[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ. ਕੈਸੇ ਆੜਿ ਫਾਥੀ ਜਾਲਿ ॥"
page = 1275
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O crane, how are thou trapped in the net?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਨੜੀਏ! ਤੂੰ ਕਿਸ ਤਰ੍ਹਾਂ ਫੰਧੇ ਵਿੱਚ ਫਸ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You stork! - how were you caught in the net?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੀਵ ਰੂਪ ਆੜ! ਤੂੰ ਮੋਹ ਰੂਪੀ ਜਾਲ ਮੇਂ ਕੈਸੇ ਫਸ ਰਹੀ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਆੜਿ! (ਪੰਛੀ ਆੜਿ ਵਾਂਗ ਦੂਜਿਆਂ ਉਤੇ ਵਧੀਕੀ ਕਰਨ ਵਾਲੀ ਹੇ ਜਿੰਦੇ!) ਤੂੰ (ਮਾਇਆ ਦੇ ਮੋਹ ਦੇ) ਜਾਲ ਵਿਚ ਕਿਵੇਂ ਫਸ ਗਈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆੜਿ = (आडि, आटि) ਬਗਲੇ ਦੀ ਕਿਸਮ ਦਾ ਇਕ ਪੰਛੀ। ਜਾਲਿ = ਜਾਲ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¡Qué bárbaro, como te dejaste atrapar en la red,"