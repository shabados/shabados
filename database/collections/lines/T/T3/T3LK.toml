[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਹ ਘੋੜੇ, ਊਠ, ਹਾਥੀ ਅਤੇ ਸੋਣਾ ਲੋਚਦਾ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਅਸਪੋ ਸ਼ੁਤਰੋ ਫ਼ੀਲੋ ਤਿਲਾ ਮੀ ਖ਼ਾਹਦ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "It itself became the river and the ocean; (thus falling on the feet of Aakaalpurakh), and convergence with Him took place. (288)"