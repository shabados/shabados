[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਾਜ ਭਰੇ, ਸੁ ਟਰੇ ਨ ਡਰੇ; ਤਿਨ ਹੂੰ ਮਿਲਿ ਕੈ ਸਬ ਸੰਖ ਬਜਾਏ ॥"
page = 448

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Though they were definitely feeling ashamed, but now they stood firmly and fearlessly and they all blew their conches together"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਲਾਜ ਦੇ ਭਰੇ ਹੋਏ ਨਾ ਡਰਦੇ ਹਨ ਅਤੇ ਨਾ ਪਿਛੇ ਹਟਦੇ ਹਨ, ਉਨ੍ਹਾਂ ਸਾਰਿਆਂ ਨੇ ਮਿਲ ਕੇ ਸੰਖ ਵਜਾਏ ਹਨ।"