[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮੁ ਕਰੇ ਜਿਸੁ ਦਾਤਿ ॥੩॥"
page = 1148
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, whom the Supreme Lord blesses with the gift of His grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਸ਼ਰੋਮਣੀ ਸਾਈਂ ਆਪਣੇ ਮਿਹਰ ਦੀ ਦਾਤ ਬਖਸ਼ਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Lord God has given this gift. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ (ਪਾਰਬ੍ਰਹਮੁ) ਪਰਮੇਸ੍ਵਰ (ਦਾਤਿ) ਬਖਸਸ ਕਰਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਜਿਸ ਮਨੁੱਖ ਨੂੰ (ਆਪਣੇ ਨਾਮ ਦੀ) ਦਾਤ ਦੇਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸੁ = ਜਿਸ ਮਨੁੱਖ ਨੂੰ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "se apoya en Él noche y día. (3)"