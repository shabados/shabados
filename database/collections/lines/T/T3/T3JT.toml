[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਆਰਸੀਆ ਘੜਵਾਇ; ਮੁਲੁ ਕਰਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Making it clear like glass, its value is set."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸ਼ੀਸ਼ੀਆਂ (ਵਾਂਗੂ) ਪਤਲਾ ਘੜਾਕੇ ਮੁੱਲ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।"