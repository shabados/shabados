[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਫਲ ਸੁ ਬਾਣੀ; ਜਿਤੁ ਨਾਮੁ ਵਖਾਣੀ ॥"
page = 103
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Blest are the words where with the Name (of God) is uttered."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਬਾਰਕ ਹਨ ਉਹ ਸ਼ਬਦ ਜਿਨ੍ਹਾਂ ਦੁਆਰਾ ਹਰੀ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਣ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Blessed are those words, by which the Naam is chanted."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਗਵਨ! ਸੋ ਬਾਣੀ ਸਫਲ ਹੈ ਜਿਸ ਕਰ ਕੇ ਨਾਮ ਕਾ ਕਥਨ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਉਸ ਬਾਣੀ ਨੂੰ ਪੜ੍ਹਨਾ ਲਾਭਦਾਇਕ ਉੱਦਮ ਹੈ, ਜਿਸ ਬਾਣੀ ਦੀ ਰਾਹੀਂ ਕੋਈ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਉਚਾਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਫਲੁ = ਫਲ ਦੇਣਾ ਵਾਲਾ, ਲਾਭਦਾਇਕ। ਜਿਤੁ = ਜਿਸ (ਬਾਣੀ) ਦੀ ਰਾਹੀਂ। ਵਖਾਣੀ = ਵਖਾਣਿਆ, ਉਚਾਰਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bendita es la Palabra que revela el Nombre del Señor;"