[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਝੀ ਛੰਨੀ ਨਾਹੀ ਬਾਤ ॥"
page = 396
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It is not a concealed and hidden matter."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਕੋਈ ਲੁਕੀ ਛਿਪੀ ਹੋਈ ਗੱਲ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is not a hidden secret;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਹ ਬਾਰਤਾ ਕੁਛੁ ਲੁਕੀ ਛੁਪੀ ਨਹੀਂ ਹੈ ਪ੍ਰਗਟ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਇਹ ਕੋਈ ਲੁਕੀ-ਛਿਪੀ ਗੱਲ ਨਹੀਂ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਝੀ ਛੰਨੀ = ਲੁਕੀ ਹੋਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora no es un secreto; el milagro es manifiesto;"