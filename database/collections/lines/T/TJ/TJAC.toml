[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਸੀਤ ਹੈ ਨ ਸੋਚ ਹੈ; ਨ ਘ੍ਰਾਮ ਹੈ ਨ ਘਾਮ ਹੈ ॥"
page = 33

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He neither chilly, nor sorrowful, nor shade nor sunshine."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਨਾ ਸਰਦੀ ਹੈ, ਨਾ ਗਰਮੀ ਹੈ, ਨਾ ਛਾਂ ਹੈ ਅਤੇ ਨਾ ਧੁਪ ਹੈ;"