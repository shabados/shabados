[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵੈ ਨ ਜਾਇ; ਨਾ ਦੁਖੁ ਪਾਏ ॥"
page = 842
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and thou shall come and go not, nor shalt thou suffer any agony."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਤੂੰ ਆਵੇਂ ਤੇ ਜਾਵੇਂਗਾ ਨਹੀਂ, ਨਾਂ ਹੀ ਤੂੰ ਕੋਈ ਤਕਲੀਫ ਉਠਾਵੇਂਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You shall not have to come or go, or suffer in sorrow."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾ ਵਹੁ ਜੋਨੀਓਂ ਮੇਂ ਆਵਤਾ ਹੈ ਨਾ ਜਾਤਾ ਹੈ, ਨ ਦੁਖੋਂ ਕੋ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਵਿਚ ਨਹੀਂ ਪੈਂਦਾ, ਉਹ (ਇਸ ਗੇੜ ਦਾ) ਦੁੱਖ ਨਹੀਂ ਸਹਾਰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਵੈ ਨ ਜਾਇ = ਨਾਹ ਜੰਮਦਾ ਹੈ ਨਾਹ ਮਰਦਾ ਹੈ, ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਵਿਚ ਨਹੀਂ ਪੈਂਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él no va, ni viene, ni sufre más,"