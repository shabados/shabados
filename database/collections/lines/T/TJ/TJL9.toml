[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਲਿ ਤਰਤੀ; ਬੂਡੀ ਜਲ ਮਾਹੀ ॥੨॥"
page = 1275
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou were enjoined to swim in water, but thou are now drowned in water."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੈਨੂੰ ਪਾਣੀ ਵਿੱਚ ਤਰਨ ਦਾ ਹੁਕਮ ਸੀ, ਪਰ ਤੂੰ ਹੁਣ ਪਾਣੀ ਵਿੱਚ ਡੁੱਬ ਗਈ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You were supposed to swim in the water, but you are drowning in it instead. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਜਲਿ) ਪਦਾਰਥੋਂ ਮੇਂ ਤਰਤੀ ਹੂਈ ਅਰਥਾਤ ਵਿਸ਼ਿਓਂ ਕੋ ਭੋਗਤੀ ਹੂਈ ਵਿਸ਼੍ਯ ਜਲ ਮੇਂ ਡੂਬੀ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ (ਜਲ-ਜੰਤ ਫੜਨ ਵਾਸਤੇ) ਪਾਣੀ ਵਿਚ ਤਰਦੀ ਤਰਦੀ ਪਾਣੀ ਵਿਚ ਹੀ ਡੁੱਬ ਜਾਂਦੀ ਹੈਂ (ਹੇ ਜਿੰਦੇ! ਮਾਇਆ-ਜਾਲ ਵਿਚ ਦੌੜ-ਭੱਜ ਕਰਦੀ ਆਖ਼ਰ ਇਸੇ ਮਾਇਆ-ਜਾਲ ਵਿਚ ਹੀ ਆਤਮਕ ਮੌਤੇ ਮਰ ਜਾਂਦੀ ਹੈਂ) ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਰਤੀ = ਤਰਦੀ ਹੋਈ। ਬੂਡੀ = ਡੁੱਬ ਗਈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "debiendo estar nadando en el agua, ahora te estás ahogando en ella en vez. (2)"