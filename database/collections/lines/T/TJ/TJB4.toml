[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਉਸਤਤਿ ਨਿੰਦਾ ਸਾਧਿ ਕੈ; ਹਿੰਦੂ ਮੁਸਲਮਾਣ ਸਬਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Going beyond praise and slander, they have become beloved of the Hindus as well as Muslims."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਉਸਤੁਤ ਨਿੰਦਾ ਨੂੰ ਸਾਧਕੇ ਹਿੰਦੂ ਮੁਸਲਮਾਨ ਸਭ ਦੇ ਸਾਂਝੇ ਹੋ ਗਏ ਹਨ, (ਭਾਵ ਕਿਸੇ ਨਾਲ ਦਵੈਖ ਨਹੀਂ ਕਰਦੇ)।"