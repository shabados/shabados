[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਫ ਕੇ ਬਿਖੈ ਲਪੇਟਿ ਦੁਰਾਯੋ ॥੫੨॥"
page = 935

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Kokila learnt this, she wrapped around (the other Raja) a mat and hid him away.(52)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤਾਂ ਉਸ ਨੇ ਰਾਜਾ ਹੋਡੀ ਨੂੰ) ਚਟਾਈ ਵਿਚ ਲਪੇਟ ਕੇ ਛੁਪਾ ਦਿੱਤਾ ॥੫੨॥"