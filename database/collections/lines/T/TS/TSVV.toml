[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨਾਸਰੀ ਮਹਲਾ ੧ ਘਰੁ ੧ ਚਉਪਦੇ ॥"
page = 660
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Dhanasri 1st Guru. Chaupade."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨਾਸਰੀ ਪਹਿਲੀ ਪਾਤਿਸ਼ਾਹੀ। ਚਉਪਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Dhanaasaree, First Mehl, First House, Chau-Padhay:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਧਨਾਸਰੀ, ਘਰ ੧ ਵਿੱਚ ਗੁਰੂ ਨਾਨਕਦੇਵ ਜੀ ਦੀ ਚਾਰ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dhanasri, Mejl Guru Nanak, Primer Canal Divino, Chau-Padas."