[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੂਆ ਪਿੰਜਰਿ; ਨਹੀ ਖਾਇ ਬਿਲਾਸੁ ॥"
page = 987
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the cat can eat not the parrot in the cage."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਪਿੰਜਰੇ ਵਿੱਚ ਤੋਤੇ ਨੂੰ ਬਿੱਲੀ ਖਾ ਨਹੀਂ ਸਕਦੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "as the cat cannot eat the parrot in its cage;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੋਤਾ ਪਿੰਜਰੇ ਮੇਂ ਹੈ ਤਿਸ ਕੋ ਬਿੱਲਾ ਨਹੀਂ ਖਾਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਪਿੰਜਰੇ ਵਿਚ ਬੈਠੇ ਤੋਤੇ ਨੂੰ ਬਿੱਲਾ ਨਹੀਂ ਖਾ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੂਆ = ਤੋਤਾ। ਪਿੰਜਰਿ = ਪਿੰਜਰੇ ਵਿਚ। ਬਿਲਾਸੁ = ਬਿੱਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así como el gato que no puede comerse al perico refugiado en su jaula."