[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਹ ਹਜ਼ਾਰਾਣ ਪਾਤਸ਼ਾਹੀਆਣ ਨਾਲੋਣ ਵੀ ਚੰਗੇਰਾ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਬਿਹਤਰ ਕਿ ਹਜ਼ਾਰ ਬਾਦਸ਼ਾਹੀ ਬਾਸ਼ਦ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Then take it that the painful thorn of separation has been extracted out of the foot (depth) of our mind. (286)"