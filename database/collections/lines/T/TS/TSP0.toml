[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਹ (ਮਹਾਂ ਪੁਰਖ) ਰੱਬ ਤੋਂ ਬਿਨਾਂ ਸਭ ਕੁਝ ਤਿਆਗ ਦਿੰਦੇ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਆਂ ਮਤਾਇ ਗ਼ੈਰ ਹੱਕ ਰਾ ਰੇਖ਼ਤੰਦ ॥੩੦੧॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "He has dispelled all the darkness and cruelty from this world,"