[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ, ਕੋ ਜੋਗੀਸਰੁ ਜੋਗੀ ॥੧੭॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Any rare one is the true yogi and a yogi of the highest order."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਗੁਰਮੁਖ ਵਿਰਲਾ ਯੋਗੀਸ਼ਰ (ਅਰਥਾਤ ਜੋਗੀਆਂ ਦਾ ਰਾਜਾ) ਹੁੰਦਾ ਹੈ।"