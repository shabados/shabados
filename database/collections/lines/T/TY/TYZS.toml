[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸੋ ਸਤਿਗੁਰੁ ਸਚਾ ਵੇਸੁ; ਸਬਦਿ ਸਿਞਾਣਿਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Truth incarnate that true Guru is realised through the Word."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਓਹੀ ਸਤਿਗੁਰੂ ਸੱਚੇ ਰੂਪ ਵਾਲਾ ਹੈ (ਜਿਸ ਨੇ) ਸਬਦ (ਦੁਆਰਾ) ਪਛਾਣਿਆ ਹੈ।"