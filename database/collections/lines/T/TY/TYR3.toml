type = "primary"
data = "ਮ੍ਰਿਗ ਪੈ ਕਰਿ ਕੋਕਿਲਾ ਪਛਾਨੀ ॥"
page = 935

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Raja told her this, she accepted that Raja was really talking about the deer."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਰ ਕੋਕਿਲਾ ਨੇ ਹਿਰਨ ਉਤੇ ਸਮਝੀ ਹੈ।"