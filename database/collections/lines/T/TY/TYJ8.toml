[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਭਾਉ ਜਿਵੇਹਾ ਬਿਦਰ ਦੇ; ਹੋਰੀ ਦੇ ਚਿਤਿ ਚਾਉ ਨ ਚੁਖਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "No heart I see has even a fraction of the love that Bidar bears in his heart."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਬਿਦਰ ਦੇ ਮਨ ਅਜੇਹਾ ਪ੍ਰੇਮ ਹੈ ਕਿ ਹੋਰ (ਕਿਸੇ) ਦੇ ਮਨ ਵਿਚ ਉਸਦਾ ਰੰਚਕ ਭੀ ਹਿੱਸਾ ਨਹੀਂ ਹੈ।"