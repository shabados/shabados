[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਦ੍ਵੈਖ ਹੈ ਨ ਭੇਖ ਹੈ; ਨ ਕਾਮ ਕ੍ਰੋਧ ਕਰਮ ਹੈ ॥"
page = 33

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is without malice, garb, lust anger and action."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਵਿਚ) ਨਾ ਦ੍ਵੈਸ਼ ਹੈ, ਨਾ ਭੇਖ ਹੈ ਅਤੇ ਨਾ ਹੀ ਕਾਮ, ਕ੍ਰੋਧ ਅਤੇ ਕਰਮ ਹੈ।"