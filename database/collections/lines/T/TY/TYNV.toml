[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਬੰਧਨ ਕਾਟੇ; ਸਗਲੇ ਮੇਰੇ ॥"
page = 99
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who has shattered all my shackles."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੇ ਮੇਰੀਆਂ ਸਾਰੀਆਂ ਬੇੜੀਆਂ ਵੱਢ ਸੁਟੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "who has shattered all my bonds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਮੇਰੇ ਸੰਪੂਰਨ ਬੰਧਨ ਕਾਟ ਦੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਮੇਰੇ ਸਾਰੇ ਮਾਇਆ ਦੇ ਬੰਧਨ ਤੋੜ ਦਿੱਤੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਗੁਰੂ) ਨੇ। ਸਗਲੇ = ਸਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "quien desató las cadenas de mi ser,"