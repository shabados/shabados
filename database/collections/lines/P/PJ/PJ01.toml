data = "ਜੁਝੇ ਜੋਧਿਯੰ ਬੀਰ ਦੇਵੰ ਅਦੇਵੰ ॥"
page = 116

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors of gods and demons both are fighting against one another."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੈਂਤ ਅਤੇ ਦੇਵਤੇ ਸੂਰਮੇ (ਆਪਸ ਵਿਚ) ਲੜ ਰਹੇ ਸਨ।"