[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਡਾ ਭਗਤੁ ਹੈ ਭਾਈਅੜਾ; ਗੋਇੰਦੁ ਘੇਈ ਗੁਰੂ ਦੁਆਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Bhaiara and Govind are devotees belonging to Ghai Caste. They remain at the door of the Guru."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਭਾਈਆ ਤੇ ਗੋਇੰਦਾ ਘੇਈ ਜਾਤ ਗੁਰੂ ਦੁਆਰੇ ਵਡੇ ਭਗਤ ਸਨ।"