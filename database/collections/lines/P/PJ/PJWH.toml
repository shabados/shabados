[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਨਿਧਿ; ਹਰਿ ਹਰਿ ਹਰੇ ॥"
page = 987
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God, the Lord Master, is all the treasure."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ, ਸੁਆਮੀ ਮਾਲਕ ਹੀ ਸਮੂਹ ਖ਼ਜ਼ਾਨਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord, Har, Har, is all treasure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੀਨ ਕਾਲ ਮੇਂ ਸਭ ਨਿਧੀ ਰੂਪ ਹਰੀ ਨੇ ਹਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸੰਸਾਰ ਦੇ) ਸਾਰੇ ਹੀ ਖ਼ਜ਼ਾਨੇ ਉਸ ਪਰਮਾਤਮਾ ਦੇ ਪਾਸ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲ = ਸਾਰੇ। ਨਿਧਿ = ਖ਼ਜ਼ਾਨੇ, ਨਿਧੀਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor es el Único Tesoro que uno puede buscar,"