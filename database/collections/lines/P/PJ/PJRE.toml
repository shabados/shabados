[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਿਹ ਕਉਤੁਕ ਕੌ ਮਨ ਗੋਪਿਨ ਕੋ; ਕਬਿ ਸਯਾਮ ਕਹੈ ਦਿਖਬੋ ਈ ਚਹੈ ॥"
page = 352

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The mind of the gopis wants to see this wonderful play continuously"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਵੀ ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, ਉਸ ਕੌਤਕ ਨੂੰ ਗੋਪੀਆਂ ਦਾ ਮਨ ਵੇਖਣਾ ਹੀ ਚਾਹੁੰਦਾ ਹੈ।"