data = "ਮਮਾ; ਮਾਗਨਹਾਰ ਇਆਨਾ ॥"
page = 258
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "M: The mumper is ignorant."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮ-ਮੰਗਤਾ ਬੇਸਮਝ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "MAMMA: The beggar is so ignorant"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਮੇ ਦੁਆਰਾ ਕਹਤੇ ਹੈਂ: ਪ੍ਰਾਰਬਧ ਸੇ ਇਤਰ ਪਦਾਰਥ ਮਾਂਗਨੇ ਵਾਲਾ ਪੁਰਸ਼ (ਇਆਨਾ) ਮੂਰਖ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬੇ-ਸਮਝ ਜੀਵ ਹਰ ਵੇਲੇ (ਮਾਇਆ ਹੀ ਮਾਇਆ) ਮੰਗਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਆਨਾ = ਬੇ-ਸਮਝ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "MAMA: ¡Qué tonto es el buscador que pide y"