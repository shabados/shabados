[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੀਜੁ ਬੋਵਸਿ ਭੋਗ ਭੋਗਹਿ; ਕੀਆ ਅਪਣਾ ਪਾਵਏ ॥"
page = 705
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As is the seed man sows, so is the fruit he enjoys. He obtains the result of his own acts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਹੋ ਜੇਹਾ ਬੀ ਬੰਦਾ ਬੀਜਦਾ ਹੈ, ਉਹੋ ਜੇਹਾ ਫਲ ਉਹ ਮਾਣਦਾ ਹੈ। ਉਹ ਆਪਣੇ ਨਿੱਜ ਦੇ ਕਰਮਾਂ ਦਾ ਫਲ ਭੁਗਤਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As are the seeds he plants, so are the pleasures he enjoys; he receives the consequences of his own actions."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਕਰਮ ਰੂਪੀ ਬੀਜ ਬੋਵਤੇ ਹੈਂ ਤੈਸਾ ਹੀ ਤਿਨੋਂ ਕਾ ਫਲ੍ਹ ਭੋਗਤੇ ਹੈਂ। ਈਹਾਂ ਅਪਨਾ ਕੀਆ ਹੂਆ ਕਰਮ ਹੈ ਤਿਸ ਕਾ ਫਲ੍ਹ ਆਗੇ ਪਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਚੇਤੇ ਰੱਖ, ਜਿਹੋ ਜਿਹਾ) ਤੂੰ ਬੀ ਬੀਜੇਂਗਾ (ਉਹੋ ਜਿਹੇ) ਫਲ ਖਾਏਂਗਾ। (ਹਰੇਕ ਮਨੁੱਖ) ਆਪਣਾ ਕੀਤਾ ਪਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੋਵਸਿ = (ਤੂੰ) ਬੀਜੇਂਗਾ। ਭੋਗਹਿ = (ਤੂੰ) ਭੋਗੇਂਗਾ। ਪਾਵਏ = ਪਾਵੈ, ਪਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno no lo sabe, pero uno cosecha lo que siembra y obtiene el fruto de lo que hizo."