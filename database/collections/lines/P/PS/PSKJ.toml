[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਸਾਹਿਬੁ ਮਨਿ ਵਸੈ; ਸਚੀ ਵਡਿਆਈ ॥੮॥੧੭॥"
page = 420
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, true is the glory of him, in whose heart the Lord dwells."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਸੱਚੀ ਹੈ ਕੀਰਤੀ ਉਸ ਦੀ, ਜਿਸ ਦੇ ਦਿਲ ਅੰਦਰ ਪ੍ਰਭੂ ਨਿਵਾਸ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, True is the Glory of that one, in whose mind the Lord Master dwells. ||8||17||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਸ ਕੇ ਮਨ ਮੇਂ ਸਾਹਿਬ ਬਸਤਾ ਹੈ ਤਿਸ ਕੀ ਸਚੀ ਵਡਿਆਈ ਹੋਤੀ ਹੈ॥੮॥੫॥੧੭॥☬ਨਾਮ ਕੀ ਮਹਿਮਾ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਿਸ ਮਨੁੱਖ ਦੇ ਮਨ ਵਿਚ ਮਾਲਕ-ਪ੍ਰਭੂ ਵੱਸ ਪੈਂਦਾ ਹੈ, ਉਸ ਨੂੰ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੀ ਇਜ਼ਤ ਬਖ਼ਸ਼ਦਾ ਹੈ ॥੮॥੧੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, si el Señor habita en nuestra mente, esa es la Gloria Verdadera. (8‑17)"