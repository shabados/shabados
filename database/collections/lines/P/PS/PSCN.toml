[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਲਕ ਰਾਖਿ ਲੀਏ ਗੁਰਦੇਵਿ ॥"
page = 866
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru-God has saved His child."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ-ਪਰਮੇਸ਼ਰ ਨੇ ਆਪਣੇ ਬੱਚੇ ਦੀ ਰੱਖਿਆ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Divine Guru has saved His child."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ (ਦੇਵਿ) ਪਰਕਾਸ ਰੂਪ! ਤੈਨੇ ਅਪਨੇ ਬਾਲਕ ਜਾਨ ਕੇ ਰਾਖ ਲੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਸਭ ਤੋਂ ਵੱਡੇ ਪ੍ਰਭੂ ਨੇ (ਸਦਾ ਹੀ ਸਰਣ-ਪਏ ਆਪਣੇ) ਬੱਚਿਆਂ ਦੀ ਰੱਖਿਆ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਲਕ = (ਆਪਣੇ) ਬੱਚਿਆਂ ਨੂੰ। ਗੁਰਦੇਵਿ = ਗੁਰਦੇਵ ਨੇ, ਸਭ ਤੋਂ ਵੱਡੇ ਪ੍ਰਭੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nuestro Dios Grandioso salva a todos Sus niños."