[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਬਿਆਪੀ ਰਾਮ ਸੰਗਿ ਰਚਨ ॥"
page = 294
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He merges into the All-pervading Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰੇ ਰਮੇ ਹੋਏ ਸੁਆਮੀ ਵਿੱਚ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is absorbed in the All-pervading Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਸਰਬ ਵਿਆਪੀ ਰਾਮ ਕੇ ਸਾਥ ਰਚੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਸਭ ਥਾਈਂ ਵਿਆਪਕ ਅਕਾਲ ਪੁਰਖ ਨਾਲ ਜੁੜੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vive absorto en el Señor Todo Prevaleciente."