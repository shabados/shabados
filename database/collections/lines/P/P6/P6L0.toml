[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਵਜਲੁ. ਪਾਰਿ ਉਤਾਰਣਹਾਰਾ ॥੧॥"
page = 1129
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It ferries the mortals across the dreadful world ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਪ੍ਰਾਣੀ ਦਾ, ਭਿਆਨਕ ਸੰਸਾਰ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਉਤਾਰਾ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It carries the mortal across the terrifying world-ocean. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਤੇ ਜਪਾ ਹੂਆ ਸੰਸਾਰ ਸਮੁੰਦ੍ਰ ਸੇ ਪਾਰ ਉਤਾਰ ਦੇਣੇ ਵਾਲਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਜੀਵਾਂ ਨੂੰ) ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਲੰਘਾਣ ਦੀ ਸਮਰਥਾ ਰੱਖਣ ਵਾਲਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਵਜਲੁ = ਸੰਸਾਰ-ਸਮੁੰਦਰ। ਉਤਾਰਣਹਾਰਾ = (ਪਾਰ) ਉਤਾਰਨ ਦੀ ਸਮਰਥਾ ਵਾਲਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, nos transporta por el mar de las existencias. (1)"