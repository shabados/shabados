[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੋਬੀ ਧਉਸਾ ਪਾਈਆਂ, ਦਲਾਂ ਮੁਕਾਬਲਾ ॥"
page = 126

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The drummer beat the trumpet and armies attacked each other."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਗਾਰਚੀ ਨੇ ਧੌਂਸੇ (ਉਤੇ ਚੋਟ ਮਾਰੀ ਅਤੇ) ਦੋਹਾਂ ਦਲਾਂ ਦਾ ਮੁਕਾਬਲਾ ਸ਼ੁਰੂ ਹੋ ਗਿਆ।"