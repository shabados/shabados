data = "ਭਾਜੰਤ ਭੂਮਿ ਨਿਧਾਨ ॥"
page = 657

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "It was raining and the water was spreading on the earth"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਭੂਮੀ ਅਤੇ ਖ਼ਜ਼ਾਨੇ ਵਾਲੇ ਵੀ ਭਿਜ ਰਹੇ ਹਨ (ਅਰਥਾਂਤਰ-ਭਜ ਰਹੇ ਹਨ)।"