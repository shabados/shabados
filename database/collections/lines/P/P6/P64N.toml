[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਣੰ ਰੋਸ ਰਜੇ ਮਹਾ ਤੇਜਵਾਣੰ ॥੭੩੬॥"
page = 277

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The arrows were discharged creating wondrous type of paintings and the mighty warriors moved in the battlefield being highly infuriated.736."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵੱਡੇ ਤੇਜ ਵਾਲੇ ਸੂਰਮੇਂ ਯੁੱਧ ਦੇ ਰੋਸ ਨਾਲ ਭਰੇ ਪੀਤੇ (ਫਿਰਦੇ ਸਨ) ॥੭੩੬॥"