[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਨਾਦਿ ਅਗਾਧਿ ਬਿਆਧਿ ਆਦਿ; ਅਨਾਦਿ ਕੋ ਮਨਾਈਐ ॥"
page = 137

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is Beginningless, Unfathomable and Source of all beings that Beginningless Lord be worshipped."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਨਾਦਿ, ਅਗਾਧ, ਰੋਗਾਂ ਦੇ ਮੂਲ ਕਾਰਨ ਸਰੂਪ ਅਤੇ ਧੁਨੀ ਤੋਂ ਬਿਨਾ ਰੂਪ ਵਾਲੇ ਨੂੰ ਮੰਨਣਾ ਚਾਹੀਦਾ ਹੈ;"