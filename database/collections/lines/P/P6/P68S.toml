[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਲਤਾਨੁ ਪੂਛੈ; ਸੁਨੁ ਬੇ ਨਾਮਾ ॥"
page = 1165
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The emperor said: \"Hear thou, O Nama,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਾਦਸ਼ਾਹ ਨੇ ਆਖਿਆ: \"ਤੂੰ ਸੁਣ ਓਇ ਨਾਮਿਆ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Sultan said, \"Listen, Naam Dayv:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਾਦਸਾਹ ਗਰਬ ਸਹਿਤ ਪੂਛਤਾ ਹੈ: ਰੇ ਨਾਮਦੇਵ! ਸੁਨਾ ਹੈ ਕਿ ਤੁਮ ਨੇ ਬ੍ਰਹਮਣ ਜਿਵਾਯਾ ਹੈ। ਨਾਮਦੇਵ ਜੀ ਨੇ ਕਹਾ: ਰਾਮ ਨੇ ਜੀਵਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੁਹੰਮਦ-ਬਿਨ-ਤੁਗ਼ਲਕ) ਬਾਦਸ਼ਾਹ ਪੁੱਛਦਾ ਹੈ-ਹੇ ਨਾਮੇ! ਸੁਣ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੇ-ਹੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Rey me dijo, escucha Namdev,"