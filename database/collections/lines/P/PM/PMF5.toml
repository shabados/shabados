[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁੰਭ ਨਿਸੁੰਭ ਤੇ ਆਦਿਕ ਸੂਰ; ਸਭੇ ਉਮਡੇ ਕਰਿ ਕੋਪ ਅਖੰਡਾ ॥"
page = 810

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The heroes like Sunbh and NiSunbh, who were invincible, flew in rage."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੁੰਭ ਅਤੇ ਨਿਸੁੰਭ ਆਦਿਕ ਸਾਰੇ ਸੂਰਮੇ ਅਖੰਡ ਕ੍ਰੋਧ ਨਾਲ ਉਮਡ ਪਏ।"