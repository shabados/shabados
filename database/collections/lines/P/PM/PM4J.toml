[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੁੰਨ ਦਾਨ; ਹੋਮੇ ਬਹੁ ਰਤਨਾ ॥"
page = 265
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Alms giving oblation to fire and bestowal of many jewels."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੈਰਾਤ ਦੇਣੀ, ਅੱਗ ਦੀ ਆਹੁਤੀ ਅਤੇ ਘਣੇ ਜਵਾਹਿਰਾਤ ਦਾ ਦਾਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "donations to charities and offerings of jewels to fire;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਰਤਨੋਂ ਕੇ ਪੁੰਨ ਦਾਨ ਪੂਰਬਕ ਹੋਮ ਭੀ ਬਹੁਤ ਕਰੇ, ਵਾ (ਰਤਨਾ) ਘ੍ਰਿਤ ਆਦਿ ਬਹੁਤ ਸੇ ਹੋਮ ਭੀ ਕੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੁੰਨਦਾਨ ਕਰੇ ਤੇ ਬਹੁਤ ਸਾਰਾ ਘਿਉ ਹਵਨ ਕਰੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੋਮੈ = ਹਵਨ ਕਰੇ, ਅੱਗ ਵਿਚ ਪਾਵੇ। ਰਤਨਾ = ਘਿਉ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y quemar objetos valiosos en los ritos de sacrificio."