[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਿ ਰਹਿਓ; ਪੂਰਨੁ ਸਭ ਠਾਇ ॥"
page = 284
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Perfect Lord is filling all the places."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਕੰਮਲ ਮਾਲਕ ਸਾਰੀਆਂ ਥਾਵਾਂ ਨੂੰ ਭਰ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Perfect Lord is pervading all places."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਸੋ ਪੂਰਨ ਪੁਰਖ ਸਰਬ ਅਸਥਾਨੋਂ ਮੇਂ ਵਿਆਪਕ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪੂਰਨ ਪੁਰਖ ਸਭ ਥਾਈਂ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Perfecto prevalece en todos los lugares."