type = "primary"
data = "ਚਹੌ ਚਿਤ ਮੈ ਜੋ ਵਹੈ ਮੋਹਿ ਦੀਜੈ ॥੧੬॥"
page = 810

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And let me perform the way I elect.(l6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਜੋ ਚਿਤ ਵਿਚ ਚਾਹੁੰਦਾ ਹਾਂ, ਉਹੀ ਮੈਨੂੰ ਪ੍ਰਦਾਨ ਕਰੋ ॥੧੬॥"