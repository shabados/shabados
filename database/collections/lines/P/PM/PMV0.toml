[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਾ ਪਰਾਪਤਿ; ਸਾਧੂ ਧੂਰੇ ॥੪॥੭੭॥੧੪੬॥"
page = 195
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who are blessed with the dust of Saints feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੂੰ ਸੰਤਾ ਦੇ ਚਰਨਾ ਦੀ ਧੂੜੀ ਦੀ ਦਾਤ ਮਿਲੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "who are blessed with the dust of the feet of the Holy. ||4||77||146||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੋ ਸੰਤੋਂ ਕੀ ਚਰਨ ਧੂੜ ਪ੍ਰਾਪਤਿ ਭਈ ਹੈ॥੪॥੭੭॥੧੪੬॥☬ਸਾਕਤੋਂ ਕੀ ਦਸਾ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੂੰ ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ਮਿਲ ਜਾਂਦੀ ਹੈ ॥੪॥੭੭॥੧੪੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧੂ ਧੂਰੇ = ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "esos que son bendecidos con el Polvo de los Pies de los Santos. (4-77-146)"