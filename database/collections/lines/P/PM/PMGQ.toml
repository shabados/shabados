[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੀਰ ਕੈ ਏਕਨਿ ਡਾਰਿ ਦਏ ਗਹਿ; ਏਕਨ ਕੋ ਨਭਿ ਓਰਿ ਚਲਾਵੈ ॥"
page = 467

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He ripped and threw someone towards the sky"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕਨਾਂ ਨੂੰ ਚੀਰ ਕੇ ਸੁਟ ਦਿੱਤਾ ਹੈ ਅਤੇ ਇਕਨਾਂ ਨੂੰ ਫੜ ਕੇ ਆਕਾਸ਼ ਵਲ ਵਗਾ ਮਾਰਿਆ ਹੈ।"