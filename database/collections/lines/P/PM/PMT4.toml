[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਏ ਸੁ ਮਧਿ ਅਨਿਸੂਆ ਛਾਡਿ ॥੧੩॥"
page = 636

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On returning, he married Ansuya, who had been blessed by Shiva, Brahma and Vishnu by their Lustre.13."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਨਸੂਆ (ਦੇ ਸ਼ਰੀਰ) ਵਿਚ ਆ ਕੇ ਛਡ ਦਿੱਤਾ ॥੧੩॥"