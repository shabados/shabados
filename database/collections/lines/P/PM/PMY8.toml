[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜਸੁ ਲਿਖਹਿ ਬੇਅੰਤ; ਸੋਹਹਿ ਸੇ ਹਥਾ ॥"
page = 709
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Beauteous are the hands, which writ the infinite praises of the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁੰਦਰ ਹਨ ਉਹ ਹੱਥ, ਜੋ ਸਾਈਂ ਦੀਆਂ ਅਨੰਤ ਸਿਫਤਾਂ ਲਿਖਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those hands, which write the Praises of the infinite Lord are beautiful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਹਰੀ ਕੇ ਬਿਅੰਤ ਜਸ ਕੋ ਲਿਖਤੇ ਹੈਂ ਸੋਈ ਹਥ ਸੋਭਾ ਪਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹਨਾਂ ਦੇ) ਉਹ ਹੱਥ ਸੋਹਣੇ ਲੱਗਦੇ ਹਨ ਜੋ ਬੇਅੰਤ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਲਿਖਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਹਹਿ = ਸੋਹਣੇ ਲੱਗਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las manos de quienes escriben la Alabanza Infinita del Señor, son bendecidas."