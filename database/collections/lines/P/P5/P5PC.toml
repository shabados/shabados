[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੁਰਬਾਸਾ ਸਭੈ ਕਸਪ ਤੇ ਆਦ ਲੈ ਕੈ ॥੬੯੬॥"
page = 273

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Along with Vishvamitra, Valmiki, Durvasa, Kashyap and Atri came to him.696."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੁਰਬਾਸ਼ਾ ਅਤੇ ਕੱਸ਼ਪ ਆਦਿ ਸਾਰੇ (ਰਾਮ ਪਾਸ ਆਏ) ॥੬੯੬॥"