[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਸ ਰੱਬ ਦੇ ਢੂੰਢਾਊ ਲਈ ਹੁਕਮ ਵਿਚ ਰਹਿਣ ਤੋਂ ਬਿਨਾਂ ਹੋਰ ਕੁਝ ਮੰਨਨਾ ਮਹੀਂ ਬਣਦਾ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਤਾਲਿਬਿ ਊ ਰਾ ਬਜੁਜ਼ ਤਸਲੀਮ ਨੀਸਤ ॥੩੧੨॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "All the mysteries of the world are perceptible to him."