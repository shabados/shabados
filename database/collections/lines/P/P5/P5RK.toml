[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਤਿ ਧੋਤੀ ਬਾਧਿਤ ਫਸਿਯੋ; ਪਾਕ ਪਕਾਵਤ ਤ੍ਰੀਯ ॥"
page = 893

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Husband was stuck while tying his lion-cloth and the woman was stuck while cooking."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਤੀ ਧੋਤੀ ਬੰਨ੍ਹਦਿਆਂ ਫਸ ਗਿਆ ਅਤੇ ਇਸਤਰੀ ਰਸੋਈ ਤਿਆਰ ਕਰਦੀ ਫਸ ਗਈ।"