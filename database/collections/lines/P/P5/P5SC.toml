[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਜੋਗੁ ਵਿਜੋਗੁ; ਧੁਰਹੁ ਹੀ ਹੂਆ ॥"
page = 1007
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Union and separation is ordained by the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿਲਾਪ ਅਤੇ ਵਿਛੋੜਾ ਪ੍ਰਭੂ ਨੇ ਹੀ ਨੀਅਤ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Union and separation are ordained by the Primal Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਜੋਗ ਪੁਨਾ ਵਿਜੋਗ ਇਹੁ ਆਦੋਂ ਹੀ ਹੋਇਆ ਚਲਾ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਜਿੰਦ ਤੇ ਸਰੀਰ ਦਾ) ਮਿਲਾਪ ਅਤੇ ਵਿਛੋੜਾ ਪਰਮਾਤਮਾ ਦੀ ਰਜ਼ਾ ਅਨੁਸਾਰ ਹੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਜੋਗੁ = ਮਿਲਾਪ (ਜਿੰਦ ਤੇ ਸਰੀਰ ਦਾ)। ਵਿਜੋਗੁ = ਵਿਛੋੜਾ (ਜਿੰਦ ਤੇ ਸਾਗਰ ਦਾ)। ਧੁਰਹੁ = ਪਰਮਾਤਮਾ ਦੇ ਹੁਕਮ ਅਨੁਸਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es por el Mismo Dios que somos unidos o separados de Él."