[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਥਾਨ ਕੋ ਰਾਜਾ ॥"
page = 621
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is the King of all the places."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰਿਆਂ ਥਾਵਾਂ ਦਾ ਪਾਤਿਸ਼ਾਹ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the King of all places."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਥਾਨੋਂ ਕੇ ਬੀਚ ਸਤਸੰਗ ਸਥਾਨ ਰਾਜਾ ਪ੍ਰਕਾਸਤਾ, ਭਾਵ ਸੋਭਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪ੍ਰਭੂ ਸਾਰੇ ਥਾਵਾਂ ਦਾ ਮਾਲਕ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋ = ਦਾ। ਤਹ = ਉੱਥੇ, 'ਸਰਬ ਥਾਨ ਕੋ ਰਾਜਾ' ਨਾਲ ਮੇਲ-ਅਵਸਥਾ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el Rey del Universo Entero,"