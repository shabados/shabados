[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਬਦੁ ਬੁਝਾਏ; ਸਤਿਗੁਰੁ ਪੂਰਾ ॥"
page = 1021
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The perfect True Guru preaches and instructs the mortal."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਉਪਦੇਸ਼ ਦੁਆਰਾ ਪੂਰਨ ਸੱਚੇ ਗੁਰੂ ਜੀ ਪ੍ਰਾਣੀ ਨੂੰ ਸਿਖਮਤ ਦਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Word of the Shabad is understood through the Perfect True Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੁ ਪੂਰਾ ਉਪਦੇਸ ਕਰ ਸਮਝਾਉਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! (ਤੇਰਾ ਰੂਪ) ਪੂਰਾ ਸਤਿਗੁਰੂ (ਤੇਰੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ) ਬਾਣੀ (ਤੇਰੇ ਪੈਦਾ ਕੀਤੇ ਜੀਵਾਂ ਨੂੰ) ਸਮਝਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es a través del Guru Perfecto que Tu Palabra, oh Dios, nos es revelada"