[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਸਤ੍ਰ ਨ ਪਹਿਰੈ; ॥ ਅਹਿਨਿਸਿ ਕਹਰੈ ॥"
page = 467
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who wears not clothes, endures calamity, day and night."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੱਪੜੇ ਨਹੀਂ ਪਹਿਨਦਾ, ਉਹ ਦਿਹੁੰ ਰੈਣ ਮੁਸੀਬਤ ਸਹਾਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who does not wear any clothes, suffers night and day."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਸਤ੍ਰੋਂ ਕੋ ਨਹੀਂ ਪੈਹਨਤਾ॥ ਰਾਤ ਦਿਨ (ਕਹਰੈ) ਦੁਖ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੱਪੜੇ ਨਹੀਂ ਪਾਂਦਾ, ਤੇ ਦਿਨ ਰਾਤ ਔਖਾ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਹਿ = ਦਿਨ। ਨਿਸਿ = ਰਾਤ। ਕਹਰੈ = ਦੁੱਖ ਸਹਾਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando uno no usa ropa, uno tiembla día y noche. Hundido en el silencio, es desperdiciado."