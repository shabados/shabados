[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਧਿਕ ਪ੍ਰਪੰਚ ਦਿਖਾਇਆ ਠਗਾ ਜਗ; ਜਾਨਿ ਜੋਗ ਕੋ ਜੋਰਾ ॥"
page = 684

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "You people have deceived the world through the medium of Yoga on showing the special deceit"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਪ੍ਰਪੰਚ ਵਿਖਾ ਕੇ ਜਗਤ ਨੂੰ ਠਗ ਲਿਆ ਹੈ (ਅਤੇ ਇਸ ਨੂੰ) ਜੋਗ ਦੀ ਸ਼ਕਤੀ ਜਾਣ ਲਿਆ ਹੈ।"