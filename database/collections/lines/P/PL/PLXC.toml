[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖੇਤੁ ਖਸਮ ਕਾ; ਰਾਖਾ ਉਠਿ ਜਾਏ ॥"
page = 179
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the farm belongs to the owner, and the watchman gets up and departs when his work is over,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੈਲੀ ਮਾਲਕ ਦੀ ਮਲਕੀਅਤ ਹੈ ਅਤੇ ਪਹਿਰੇਦਾਰ ਜਦ ਉਸ ਦਾ ਕੰਮ ਮੁਕ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but the field belongs to his master, while he must get up and depart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਖੇਤ ਤੋ ਮਾਲਕ ਕਾ ਥਾ ਉਸ ਨੇ ਸੰਭਾਲ ਲੀਆ, ਰਾਖਾ ਖਾਲੀ ਚਲਾ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਫ਼ਸਲ ਪੱਕਣ ਤੇ) ਫ਼ਸਲ ਮਾਲਕ ਦੀ ਮਲਕੀਅਤ ਹੋ ਜਾਂਦਾ ਹੈ ਤੇ ਰਾਖਾ ਉੱਠ ਕੇ ਚਲਾ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਠਿ = ਉਠ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la granja se queda con el dueño mientras que el cuidador se va."