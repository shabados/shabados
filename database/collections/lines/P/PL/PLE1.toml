[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਤਿ ਰਤਿ ਤਾ ਸੌ ਮਾਨਿ ਕੈ; ਯਾਰ ਪਤਰਿਯਹਿ ਟਾਰਿ ॥"
page = 815

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She had made the thin friend to acquiesce to her request."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ (ਪਤਲੇ ਯਾਰ) ਨਾਲ ਬਹੁਤ ਅਧਿਕ ਕਾਮ ਕ੍ਰੀੜਾ ਕਰ ਕੇ ਟਾਲ ਦਿੱਤਾ।"