data = "ਸਰਬ ਇਛਾ; ਤਾ ਕੀ ਪੂਰਨ ਹੋਇ ॥"
page = 295
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All his desires are fulfilled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀਆਂ ਸਾਰੀਆਂ ਖਾਹਿਸ਼ਾ ਪੂਰੀਆਂ ਹੋ ਜਾਂਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All desires are fulfilled."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਤਿਸ ਪਾਠਕ ਕੀਆਂ ਸਰਬ ਇਛਾ ਪੂਰਨ ਹੋ ਜਾਤੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਨੁੱਖ ਦੀ ਇੱਛਿਆ ਸਾਰੀ ਪੂਰੀ ਹੋ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos los deseos son cumplidos"