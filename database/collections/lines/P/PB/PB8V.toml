[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਣ ਕਮਲ ਕੀ; ਦੀਨੀ ਓਟ ॥੩॥"
page = 194
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and has given me the support of His lotus feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੈਨੂੰ ਆਪਦੇ ਕੰਵਲਰੂਪੀ ਚਰਨਾ ਦਾ ਆਸਰਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has given me the Support of His Lotus Feet. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਆਪਨੇ ਚਰਨ ਕਵਲੋਂ ਕੀ ਓਟ ਦੀਨੀ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਆਪਣੇ ਸੇਵਕਾਂ ਨੂੰ ਆਪਣੇ) ਸੋਹਣੇ ਚਰਨਾਂ ਦਾ ਸਹਾਰਾ (ਸਦਾ) ਬਖ਼ਸ਼ਿਆ ਹੁੰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਟ = ਸਹਾਰਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y me ha dado el Soporte de Sus Pies de Loto."