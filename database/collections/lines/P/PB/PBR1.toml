data = "ਭਾਤਿ ਭਾਤਿ ਚੁੰਬਨ ਕਰੇ; ਆਸਨ ਕਰੇ ਅਨੇਕ ॥"
page = 1006

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They kissed each other multifariously and adopted many poses’"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਭਾਂਤ ਭਾਂਤ ਦੇ ਚੁੰਬਨ ਲਏ ਅਤੇ ਅਨੇਕ ਪ੍ਰਕਾਰ ਦੇ ਆਸਨ ਕੀਤੇ।"