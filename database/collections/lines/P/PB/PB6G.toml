[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਹਿਨਿਸਿ; ਸੁੰਨਿ ਸਮਾਧਿ ਸਮਾਵੈ ॥੧॥ ਰਹਾਉ ॥"
page = 877
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Day and night, he remains absorbed in profound trance. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਤੇ ਰਾਤ, ਉਹ ਅਫੁਰ ਤਾੜੀ ਅੰਦਰ ਲੀਨ ਰਹਿੰਦਾ ਹੈ। ਠਹਿਰਾਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Day and night, he remains absorbed in deepest Samaadhi. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦਿਨੇ ਰਾਤ ਅਫੁਰ ਸਮਾਧ ਮੇਂ ਸਮਾਇ ਰਹੇ॥੧॥ ਰਹਾਉ ॥☬ਪ੍ਰਸ਼ਨ: ਜੋਗ ਕੋ ਕੈਸੇ ਪਾਲੇ?☬ਉਤ੍ਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਉਹ ਦਿਨ ਰਾਤ ਐਸੇ ਆਤਮਕ ਟਿਕਾਉ ਵਿਚ ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ ਜਿਥੇ ਮਾਇਆ ਦੇ ਫੁਰਨਿਆਂ ਵਲੋਂ ਸੁੰਞ ਹੀ ਸੁੰਞ ਹੁੰਦੀ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਹਿ = ਦਿਨ। ਨਿਸਿ = ਰਾਤ। ਸੁੰਨਿ = ਸੁੰਨ ਵਿਚ, ਸੁੰਞ ਵਿਚ। ਸੁੰਨ = ਉਹ ਅਵਸਥਾ ਜਿਥੇ ਮਾਇਆ ਵਲੋਂ ਸੁੰਞ ਹੋਵੇ, ਜਿਥੇ ਮਾਇਆ ਦੇ ਫੁਰਨੇ ਨਾਹ ਉੱਠਣ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que se inmerge para siempre en el Señor Absoluto.(1-Pausa)"