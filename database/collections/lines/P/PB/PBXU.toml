[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਠਾਰਹ ਭਾਰ ਬਨਾਸਪਤੀ ਮਾਲਣੀ; ਛਿਨਵੈ ਕਰੋੜੀ ਮੇਘ ਮਾਲਾ, ਪਾਣੀਹਾਰੀਆ ॥"
page = 1292
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whose flower-girl is the eighteen loads of vegetation and water-carriers are the ninety-six millions of clouds ranges."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਮਾਲਣ ਹੈ ਅਠਾਰਾ ਬੋਝ ਨਬਾਤਾਤ ਦੇ ਅਤੇ ਜਿਸ ਦਾ ਪਾਣੀ ਲਿਆਉਣ ਵਾਲੀਆਂ ਹਨ ਛਿਆਨਵੇ ਕ੍ਰੋੜਾਂ ਬੱਦਲਾਂ ਦੀਆਂ ਕਤਾਰਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His flower-girls are the eighteen loads of vegetation; His water-carriers are the nine hundred sixty million clouds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਅਠਾਰਾਂ ਭਾਰ ਬਨਾਸਪਤੀ ਮਾਲਣੀ ਹੈ ਔਰ ਛਿੰਨਵੇ ਕ੍ਰੋੜ ਮੇਘ ਮਾਲਾ ਪਾਣੀ ਭਰਨੇ ਵਾਲੀ ਝੀਵਰੀਆਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਦੀ ਸਾਰੀ ਬਨਸਪਤੀ (ਉਸ ਨੂੰ ਫੁੱਲ ਭੇਟ ਕਰਨ ਵਾਲੀ) ਮਾਲਣ ਹੈ, ਛਿਆਨਵੇ ਕਰੋੜ ਬੱਦਲ ਉਸ ਦਾ ਪਾਣੀ ਭਰਨ ਵਾਲੇ (ਨੌਕਰ) ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਣੀਹਾਰੀਆ = ਪਾਣੀ ਭਰਨ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sus Damiselas son las flores de la vegetación;"