[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੰਧਨ ਤੋਰਿ; ਭਏ ਨਿਰਵੈਰ ॥"
page = 292
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He cuts his fetter and becomes free from enmity,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਦੀਆਂ ਬੇੜੀਆਂ ਕੱਟ ਸੁੱਟਦਾ ਹੈ, ਦੁਸ਼ਮਨੀ-ਰਹਿਤ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His bonds are cut away, and he becomes free of hatred."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਬੰਧਨੋਂ ਕੋ ਤੋੜ ਕਰ ਕੇ ਸਭ ਸੇ ਨਿਰਵੈਰ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਦੇ) ਬੰਧਨ ਤੋੜ ਕੇ ਉਹ ਨਿਰਵੈਰ ਹੋ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mientras él con Devoción Lo alaba noche y día a los Pies del Guru."