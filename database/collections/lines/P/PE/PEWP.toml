[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਭਉ ਸੋ; ਸਿਰਿ. ਨਾਹੀ ਲੇਖਾ ॥"
page = 1042
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God alone is fearless and on His head destiny is recorded not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਪ੍ਰਭੂ ਹੀ ਭੈ-ਰਹਿਤ ਹੈ ਅਤੇ ਉਸ ਦੇ ਸੀਸ ਉਹ ਪ੍ਰਾਲਭਧ ਲਿਖੀ ਹੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is fearless, who has no destiny written on His head."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਨਿਰਭਉ ਹੂਆ ਹੈ ਤਿਸ ਕੇ ਸਿਰ ਪਰ ਕੋਈ ਲੇਖਾ ਲੇਨੇ ਵਾਲਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਨੂੰ ਕੋਈ ਡਰ ਵਿਆਪ ਨਹੀਂ ਸਕਦਾ ਕਿਉਂਕਿ ਉਸ ਦੇ ਸਿਰ ਉਤੇ ਕਿਸੇ ਹੋਰ ਦਾ ਹੁਕਮ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਰਿ = ਸਿਰ ਉਤੇ। ਲੇਖਾ = ਕੀਤੇ ਕਰਮਾਂ ਦਾ ਹਿਸਾਬ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo vive libre de miedos aquél que no está sujeto al dictado de otro."