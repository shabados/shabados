[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੀਨ ਲੋਕ ਜਿਨਿ ਬਸਿ ਕੀਏ; ਅਤਿ ਬਲ ਭੁਜਾ ਅਖੰਡ ॥"
page = 83

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“He hath brought under his control all the three worlds with his mighty armed strength,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਜਿਸ ਨੇ ਆਪਣੀਆਂ ਦ੍ਰਿੜ੍ਹ ਭੁਜਾਵਾਂ ਦੇ ਬਲ ਨਾਲ ਤਿੰਨ ਲੋਕਾਂ ਨੂੰ ਵਸ ਵਿਚ ਕਰ ਲਿਆ ਹੈ,"