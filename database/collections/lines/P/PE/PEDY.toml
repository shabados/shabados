[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਭਲਿਆਈ, ਸਤਿਗੁਰ ਮਤਿ ਸਾਰੀ ॥੨੦॥੩੧॥ ਇਕਤੀਹ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Benevolence is the perfect teaching of the Guru."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਉਹ ਕੀ ਹੈ?) ਸਤਿਗੁਰੂ (ਗੁਰੂ ਨਾਨਕ ਦੀ 'ਮਤ') ਸਿੱਖ੍ਯਾ ਲੈਕੇ ਭਲਿਆਈ ਸ੍ਰੇਸਟ ਕੀਤੀ ਹੈ, (ਆਪਣਾ ਉਧਾਰ ਕਰ ਕੇ ਸਾਥੀਆਂ ਨੂੰ ਭੀ ਤਾਰ ਦਿੱਤਾ ਹੈ)।"