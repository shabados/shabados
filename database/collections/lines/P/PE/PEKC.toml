[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਿਹੂੰ ਲੋਕ ਭੀਤਰ ਉਜਿਯਾਰੋ ॥"
page = 976

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In the country of Tirhat, there was a large town of Tirhatpur, which was renowned in all the three domains."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਤਿੰਨਾਂ ਲੋਕਾਂ ਵਿਚ ਪ੍ਰਸਿੱਧ ਸੀ।"