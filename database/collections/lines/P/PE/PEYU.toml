[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਸਿਮਰਨ ਕੀ; ਸਗਲੀ ਬੇਲਾ ॥"
page = 1150
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Every time is good for God's meditation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਦੇ ਭਜਨ ਲਈ ਹਰ ਸਮਾਂ ਚੰਗਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Any time is a good time to meditate in remembrance on the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਸਿਮਰਨ ਕੀ ਬੇਲਾ ਸਾਰੀ ਉਮਰ ਹੈ ਚਾਹੇ ਕਿਸੇ ਵੇਲੇ ਸਿਮਰਨ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਹੜਾ ਭੀ ਸਮਾ ਸਿਮਰਨ ਵਿਚ ਗੁਜ਼ਾਰਿਆ ਜਾਏ ਉਹੀ ਚੰਗਾ ਹੈ) ਹਰੇਕ ਸਮਾ ਸਿਮਰਨ ਵਾਸਤੇ ਢੁਕਵਾਂ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲੀ ਬੇਲਾ = ਹਰੇਕ ਸਮਾ। ਬੇਲਾ = ਵੇਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cada momento es auspicioso para meditar en Dios."