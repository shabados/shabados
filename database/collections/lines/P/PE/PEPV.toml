[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਥਿਆ ਮਨ; ਪਰ ਲੋਭ ਲੁਭਾਵਹਿ ॥"
page = 269
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Vain is the mind which hankers after the wealth of others."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਅਰਥ ਹੈ ਚਿੱਤ ਜਿਹੜਾ ਹੋਰਨਾਂ ਦੀ ਦੌਲਤ ਨੂੰ ਲਲਚਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "False is the mind which covets the wealth of others."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਮਨ ਭੀ ਮਿਥਿਆ ਹੈ, ਜੋ ਪਰਾਏ ਵਾ ਵਸੇਸ ਕਰ ਪਦਾਰਥੋਂ ਕੇ ਲੋਭ ਮੇਂ ਲੁਭਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਤੂੰ ਭੀ ਵਿਅਰਥ ਹੈਂ (ਜੇ ਤੂੰ) ਪਰਾਏ ਧਨ ਦਾ ਲੋਭ ਕਰ ਰਿਹਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਪਰ ਲੋਭੁ = ਪਰਾਏ (ਧਨ ਆਦਿਕ) ਦਾ ਲੋਭ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la mente que codicia la riqueza de otros."