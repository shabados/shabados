[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮ ਰੰਗਿ; ਸਰਬ ਸੁਖੁ ਹੋਇ ॥"
page = 279
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the love of God's name, all the peace is gained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਦੇ ਨਾਮ ਦੀ ਪ੍ਰੀਤ ਰਾਹੀਂ ਸਮੂਹ ਆਰਾਮ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the love of the Naam, all peace is obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਮੇਂ (ਰੰਗਿ) ਪ੍ਰੇਮ ਕਰਨੇ ਸੇ ਸਰਬ ਸੁਖ ਹੋਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੀ ਮੌਜ ਵਿਚ (ਹੀ) ਸਾਰਾ ਸੁਖ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Paz, la Absoluta Paz, sólo se encuentra en el Amor del Nombre;"