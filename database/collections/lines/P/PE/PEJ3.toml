[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭੂਖਨ ਭੋਜਨ ਧਾਮ ਜਿਤੋ; ਹਮ ਕੇ ਜਦੁਬੀਰ ਬਿਨਾ ਸੁ ਰੁਚੈ ਨਾ ॥"
page = 390

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Getting agitated, Radha said this to Udhava, “O Udhava! we do not like the ornaments, food, houses etc. without Krishna,”"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਗਹਿਣੇ, ਭੋਜਨ, ਅਤੇ ਘਰ (ਆਦਿਕ) ਜੋ ਵੀ ਹੈ, ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਤੋਂ ਬਿਨਾ ਚੰਗਾ ਨਹੀਂ ਲਗਦਾ।"