[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਤਨੁ ਨਿਰਮਲੁ; ਮਾਇਆ ਮੋਹੁ ਗਵਾਏ ॥"
page = 121
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then the mind and soul are rendered pure and the love of mammon departs."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੇਹਿ ਤੇ ਆਤਮਾ ਸ਼ੁੱਧ ਹੋ ਜਾਂਦੇ ਹਨ ਅਤੇ ਧਨ ਦੌਲਤ ਦੀ ਮਮਤਾ ਦੂਰ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the mind and body become Immaculate, and emotional attachment to Maya departs."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕਾ ਮਨ ਤਨ ਨਿਰਮਲ ਹੂਆ ਹੈ, ਔਰ ਮਾਇਆ ਕੇ ਮੋਹ ਆਦਿ ਬਿਕਾਰ ਤਿਨੋਂ ਨੇ ਗਵਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਮਨ ਪਵਿਤ੍ਰ ਹੋ ਜਾਂਦਾ ਹੈ, ਉਸ ਦਾ ਤਨ ਪਵਿਤ੍ਰ ਹੋ ਜਾਂਦਾ ਹੈ। (ਆਪਣੇ ਅੰਦਰੋਂ) ਮਾਇਆ ਦਾ ਮੋਹ ਦੂਰ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el cuerpo y el Alma se vuelven puros y el amor por la Maya nos deja."