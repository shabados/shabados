data = "ਰਣ ਰੰਗ ਤੁਰੰਗਹਿ ਬਿਚਰਿ ਹੈ ॥"
page = 697

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When all these warriors will assume their power, then they will ride their horses and wander"

[[content]]
