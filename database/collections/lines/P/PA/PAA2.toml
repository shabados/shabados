type = "primary"
data = "ਧਨੁਰ ਬਾਣ ਸਾਧੇ ॥"
page = 52

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They have adorned their head with the ornament and have stretched their bows in their hands."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਤੀਰ-ਕਮਾਨਾਂ ਸਾਧੀਆਂ ਹੋਈਆਂ ਹਨ।"