data = "ਤਬ ਅਬਲਾ ਸੁਰ ਰਾਜ ਕੇ; ਮੋਹੀ ਰੂਪ ਨਿਹਾਰਿ ॥"
page = 971

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "This vulnerable lady was captivated with the magnanimity of Lord Indra,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ (ਉਹ) ਅਬਲਾ (ਅਹਿਲਿਆ) ਇੰਦਰ ਦਾ ਰੂਪ ਵੇਖ ਕੇ ਮੋਹਿਤ ਹੋ ਗਈ।"