[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਜੇ ਰਥੀ ਮਹਾਰਥੀ; ਸੁ ਲਾਜ ਕੋ ਬਿਸਾਰਿ ਕੈ ॥"
page = 706

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Her great chariot-owners, forsaking their shame, fled away"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਥੀ ਅਤੇ ਮਹਾਰਥੀ ਲਾਜ-ਮਰਯਾਦਾ ਨੂੰ ਭੁਲਾ ਕੇ ਭਜ ਗਏ ਹਨ।"