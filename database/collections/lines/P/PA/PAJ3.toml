[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਫਲ ਜਨਮੁ; ਹੋਵੈ ਪਰਵਾਣੁ ॥"
page = 193
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My life is rendered profitable and acceptable,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਜੀਵਨ ਲਾਭਦਾਇਕ ਅਤੇ ਮਕਬੂਲ ਹੋ ਗਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My life is prosperous, fruitful and approved;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਨਮ (ਪਰਵਾਣੁ) ਨਿਸਚੇ ਕਰ ਕੇ ਸਫਲ ਹੋਵੈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) (ਇਸ ਤਰ੍ਹਾਂ ਤੇਰਾ ਮਨੁੱਖਾ) ਜਨਮ ਕਾਮਯਾਬ ਹੋ ਜਾਇਗਾ ਤੂੰ (ਪਰਮਾਤਮਾ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ) ਕਬੂਲ ਹੋ ਜਾਇਂਗਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਵਾਣੁ = ਕਬੂਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi vida es próspera, fructífera y aprobada,"