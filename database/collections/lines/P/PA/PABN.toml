[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮਿ ਪ੍ਰਭਿ; ਕਰੀ ਮਇਆ ॥"
page = 1183
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Transcendent Lord has shown mercy unto me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੇਮ ਪ੍ਰਭੂ ਨੇ ਮੇਰੇ ਉਤੇ ਮਿਹਰ ਧਾਰੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Lord God has shown mercy to me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹ ਪਾਰਬ੍ਰਹਮ ਪਰਮੇਸ੍ਵਰ ਨੇ ਕ੍ਰਿਪਾ ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਮਨੁੱਖ ਉਤੇ) ਪਾਰਬ੍ਰਹਮ ਪ੍ਰਭੂ ਨੇ ਮਿਹਰ ਕੀਤੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਰਬ੍ਰਹਮਿ = ਪਾਰਬ੍ਰਹਮ ਨੇ। ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ। ਮਇਆ = ਦਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y el Dios Todopoderoso le muestra Su Compasión."