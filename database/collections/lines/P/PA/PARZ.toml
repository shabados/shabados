[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਪਰਲਉ ਓਪਤਿ; ਨਿਮਖ ਮਾਹਿ ॥"
page = 1156
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Myriads of destructions and creations, the Lord affects in an instant."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾਂ ਹੀ ਖਪਤਾਂ ਅਤੇ ਉਤਪਤੀਆਂ ਪ੍ਰਭੂ ਇਕ ਮੁਹਤ ਵਿੱਚ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He creates and destroys millions, in an instant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਗਵਨ! ਤੂੰ ਨਿਮਖ ਮਾਤ੍ਰ ਮੇਂ ਕ੍ਰੋੜੋਂ ਉਤਪਤਿ ਪਰਲ੍ਯ ਕਰਨੇ ਕੌ ਸਮਰਥ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਗੋਬਿੰਦ ਅੱਖ ਦੇ ਇਕ ਫੋਰ ਵਿਚ ਕ੍ਰੋੜਾਂ (ਜੀਵਾਂ ਦੀ) ਉਤਪੱਤੀ ਤੇ ਨਾਸ (ਕਰਦਾ ਰਹਿੰਦਾ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਲਉ = ਨਾਸ। ਓਪਤਿ = ਉਤਪੱਤੀ। ਨਿਮਖ = {निमेष} ਅੱਖ ਝਮਕਣ ਜਿਤਨਾ ਸਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien destruye y da vida en un instante, oh, ese Ser es mi Dios."