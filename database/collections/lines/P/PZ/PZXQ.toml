[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਮਿਤ ਤੇਜ, ਜਗ ਜੋਤਿ ਪ੍ਰਕਾਸੀ ॥"
page = 129

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art of Unlimited brilliance and Thy Light hath illumined the world"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਤੁਸੀਂ) ਅਸੀਮ ਤੇਜ ਵਾਲੇ, (ਆਪਣੀ) ਜੋਤਿ ਨਾਲ ਜਗਤ ਨੂੰ ਪ੍ਰਕਾਸ਼ਿਤ ਕਰਨ ਵਾਲੇ,"