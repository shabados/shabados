[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਤਿ = ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru Perfecto es Compasivo conmigo y entonces soy emancipado. (1)"