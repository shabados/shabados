[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਤੇ ਦੀਪ ਅਨ੍ਹੇਰ ਹੈ; ਗੁਰਮੁਖਿ ਦੀਪਕੁ ਸਬਦ ਉਜਾਲਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "All the seven continents are in darkness; gurmukh enlightener them by lamp of Word."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਤੇ ਦੀਪਾਂ ਵਿਖੇ ਹਨੇਰਾ ਵਰਤਦਾ ਹੈ, ਗੁਰਮੁਖਾਂ ਵਿਖੇ ਸ਼ਬਦ ਦੀਪ ਦਾ ਉਜਾਲਾ (ਚਾਨਣਾ) ਹੈ।"