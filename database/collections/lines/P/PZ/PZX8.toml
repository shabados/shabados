[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵਤ ਪਹੀਆ; ਖੂਧੇ ਜਾਹਿ ॥"
page = 872
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the guest come and depart hungry therefrom."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਥੋਂ ਪ੍ਰਾਹੁਣਾ ਆ ਕੇ ਭੁੱਖੇਭਾਣੇ ਹੀ ਟੁਰ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the guests who come there depart still hungry."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਪਰਾਹੁਣੇ ਆਤੇ ਹੈਂ, ਸੋ (ਖੂਧੇ) ਭੂਖੇ ਚਲੇ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਘਰ ਆਏ ਪਾਂਧੀ ਭੁੱਖੇ ਚਲੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਹੀਆ = ਰਾਹੀ, ਪਾਂਧੀ, ਅੱਭਿਆਗਤ। ਖੂਧੇ = ਭੁੱਖੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "los invitados que llegan se van hambrientos,"