[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕ ਦਿਵਸ; ਮਨ ਭਈ ਉਮੰਗ ॥"
page = 1195
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "One day in my mind welled up a desire."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਦਿਨ ਮੇਰੇ ਚਿੱਤ ਅੰਦਰ ਖਾਹਿਸ਼ ਉਤਪੰਨ ਹੋਈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One day, a desire welled up in my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਕ ਦਿਨ ਮੇਰੇ ਮਨ ਵਿਖੇ (ਉਮੰਗ) ਚਾਹ ਉਤਪਤਿ ਹੂਈ ਥੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇੱਕ ਦਿਨ ਮੇਰੇ ਮਨ ਵਿਚ ਭੀ ਤਾਂਘ ਪੈਦਾ ਹੋਈ ਸੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਿਵਸ = ਦਿਨ। ਉਮੰਗ = ਚਾਹ, ਤਾਂਘ, ਖ਼ਾਹਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Un día en mi mente creció la añoranza de ver a Dios"