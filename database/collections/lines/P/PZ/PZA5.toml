data = "ਯਾ ਮੈ ਕਛੂ ਭੇਦ ਨਹੀ ਮਾਨੋ ॥੭੨੨॥"
page = 752

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Add the word “Jaa” after the word “Basuddhaa” and know all the names of Tupak without any discrimination.722."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਵਿਚ ਰਤਾ ਜਿੰਨਾ ਭੇਦ ਨਾ ਸਮਝੋ ॥੭੨੨॥"