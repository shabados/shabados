[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਮੰਡਲ ਕਾ. ਨਹੀ ਬਿਨਾਸੁ ॥"
page = 1146
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The society of the saints is destroyed not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਸੰਗਤ ਨਾਸ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Realm of the Saints cannot be destroyed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਮੰਡਲ ਕਾ ਕਬੀ ਨਾਸ ਨਹੀਂ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਦੇ ਵਾਯੂ-ਮੰਡਲ ਦਾ ਕਦੇ ਨਾਸ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Reino de los Santos, uno no puede ser destruido."