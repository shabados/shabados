[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿ ਪੁਰਖੁ; ਜਾ ਕੋ ਹੈ ਨਾਉ ॥"
page = 863
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whose Name is the True Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਨਾਮ ਸੱਚਾ ਸੁਆਮੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Name is the True Primal Being;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿ ਪੁਰਖ ਜਿਸ ਕਾ ਨਾਮ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਜਿਸ ਪ੍ਰਭੂ ਦਾ ਨਾਮ (ਹੀ ਦੱਸਦਾ ਹੈ ਕਿ ਉਹ) ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਹੈ ਅਤੇ ਸਰਬ-ਵਿਆਪਕ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿ ਪੁਰਖੁ = ਸਦਾ-ਥਿਰ ਸਰਬ-ਵਿਆਪਕ। ਜਾ ਕੋ = ਜਿਸ ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su Nombre es el Verdadero Purusha;"