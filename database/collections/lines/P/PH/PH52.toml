[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਸੂਰ; ਸਸੀਅਰ ਨਖਿਆਤਿ ॥"
page = 1236
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Myriads are the suns, the moons and the stars."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਟਾ ਹੀ ਹਨ ਸੂਰਜ, ਚੰਦ੍ਰਮੇ ਅਤੇ ਤਾਰੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many suns, moons and stars."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੇਕ ਹੀ ਸੂਰਜ ਅਰ ਚੰਦ੍ਰਮਾਂ ਔਰ (ਨਖਿਆਤਿ) ਤਾਰਾਗਾਨ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੇ ਬਣਾਏ ਹੋਏ) ਅਨੇਕਾਂ ਹੀ ਸੂਰਜ ਚੰਦ੍ਰਮਾ ਅਤੇ ਤਾਰੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੂਰ = ਸੂਰਜ। ਸਸੀਅਰ = (शशधर) ਚੰਦ੍ਰਮਾ। ਨਖਿਆਤਿ = ਤਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y lunas y las cadenas de estrellas,"