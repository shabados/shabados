[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੀਟ ਹਸਤਿ ਮਹਿ; ਪੂਰ ਸਮਾਨੇ ॥"
page = 252
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In an ant and an elephant, He is fully contained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਕੀੜੀ ਤੇ ਇਕ ਹਾਥੀ ਵਿੱਚ ਉਹ ਪੂਰੀ ਤਰ੍ਹਾਂ ਰਮਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the ant and in the elephant, He is totally pervading."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਸਤੀ ਅਰ ਚੀਟੀ ਮੇਂ ਸਮਾਨ ਸੱਤਾ ਕਰ ਪੂਰਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੀੜੀ ਤੋਂ ਲੈ ਕੇ ਹਾਥੀ ਤਕ ਸਭ ਵਿਚ ਪੂਰਨ ਤੌਰ ਤੇ ਪ੍ਰਭੂ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀਟ = ਕੀੜੀ। ਹਸਤਿ = ਹਾਥੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él habita en el gusano y también en el elefante,"