[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮੁ; ਤਾ ਤੇ ਮੋਹਿ ਡੀਠਾ ॥੩॥"
page = 187
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Supreme Lord I have beheld, therefore."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ਰੋਮਣੀ ਸਾਹਿਬ, ਇਸ ਕਰਕੇ, ਮੈਂ ਵੇਖ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and I behold the Supreme Lord God. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸੀ ਕਰ (ਮੋਹਿ) ਮੈਨੇ ਪਾਰਬ੍ਰਹਮ ਕੋ ਦੇਖਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਬਰਕਤਿ ਨਾਲ ਮੈਂ ਪਰਮਾਤਮਾ ਦਾ ਦਰਸਨ ਕਰ ਰਿਹਾ ਹਾਂ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਤੇ = ਉਸ ਦੀ ਬਰਕਤਿ ਨਾਲ। ਮੋਹਿ = ਮੈਂ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y veo entonces al Supremo Señor.(3)"