[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚਿਆਰਾ. ਦੇਇ ਵਡਿਆਈ; ਹਰਿ. ਧਰਮ ਨਿਆਉ ਕੀਓਇ ॥"
page = 89
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To the truthful God grants greatness and administers even handed justice."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚਿਆ ਨੂੰ ਵਾਹਿਗੁਰੂ ਬਜ਼ੁਰਗੀ ਬਖ਼ਸ਼ਦਾ ਹੈ ਅਤੇ ਐਨ ਸੱਚਾ ਸੁੱਚਾ ਇਨਸਾਫ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord bestows glorious greatness upon those who are truthful. He administers righteous justice."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚੇ ਪੁਰਸੋਂ ਕੋ ਵਡਿਆਈ ਦੇਤਾ ਹੈ, ਹਰੀ ਨੇ ਐਸਾ ਧਰਮ ਕਾ ਨਿਆਉਂ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੱਚ ਦੇ ਵਪਾਰੀਆਂ ਨੂੰ ਆਦਰ ਬਖ਼ਸ਼ਦਾ ਹੈ-ਹਰੀ ਨੇ ਇਹ ਧਰਮ ਦਾ ਨਿਆਂ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Verdad, Verdad es Su Justicia."