[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਉਦੰਡੇ ਅਮੰਡੇ, ਪ੍ਰਚੰਡੇ ਪ੍ਰਮਾਥੇ ॥"
page = 22

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Unpunishable, non-thrustable, mighty and Omnipotent."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਨਿਡਰ, ਸਾਜ-ਸਜਾਵਟ ਤੋਂ ਪਰੇ, ਪ੍ਰਚੰਡ ਅਤੇ (ਵਿਰੋਧੀਆਂ ਦਾ) ਨਾਸ਼ ਕਰਨ ਵਾਲਾ ਹੈ।"