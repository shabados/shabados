[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚਾ ਸਬਦੁ ਸਾਲਾਹਿ; ਸਚਿ ਸਮਾਈਐ ॥"
page = 144
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By praising the True Name one merges in the True Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਨਾਮ ਦੇ ਸਿਫ਼ਤ ਸ਼ਲਾਘਾ ਕਰਨ ਦੁਆਰਾ ਮਨੁੱਖ ਸੱਚੇ ਮਾਲਕ ਵਿੰਚ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Praising the True Word of the Shabad, they merge with the True Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਸਚਾ ਉਪਦੇਸ਼ ਵਾ ਬ੍ਰਹਮ ਕੋ ਸਲਾਹਣਾ ਕਰ ਕੇ ਸਚ ਮੇਂ ਸਮਾਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਦਾ ਸੱਚਾ ਸ਼ਬਦ ਗਾਵਿਆਂ ਸੱਚੇ ਪ੍ਰਭੂ ਵਿਚ ਜੁੜੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero Aquél que alaba la Verdadera Palabra, inmerge su ser en la Verdad."