[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਦਰੁ ਉਧਾਰਿਓ; ਦਾਸਤ ਭਾਇ ॥"
page = 1192
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Bidur was redeemed through the servants sentiments."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੇਵਕ ਦੇ ਜਜ਼ਬਿਆਂ ਰਾਹੀਂ ਬਿਦਰ ਦਾ ਪਾਰ ਉਤਾਰਾ ਹੋ ਗਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Bidar was saved by his attitude of humility."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦਾਸ ਭਾਵ ਧਾਰਨੇ ਕਰ ਬਿਦਰ ਕਾ ਉਧਾਰ ਕਰ ਦੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬਿਦਰ ਨੂੰ (ਉਸ ਦੇ) ਸੇਵਾ ਭਾਵ ਦੇ ਕਾਰਨ (ਕ੍ਰਿਸ਼ਨ ਜੀ ਨੇ) ਪਾਰ ਲੰਘਾ ਦਿੱਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਾਸ = ਸੇਵਕ। ਦਾਸਤ ਭਾਇ = ਸੇਵਾ ਦੇ ਭਾਵ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vidura también fue redimido, debido a su sentido de humildad,"