[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਬਾਝੁ ਰਾਖਾ. ਕੋਇ ਨਾਹੀ; ਸੋਇ ਤੁਝਹਿ ਬਿਸਾਰਿਆ ॥"
page = 439
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without God, there is no other protector and Him thou hast forgotten."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਬਗੈਰ ਹੋਰ ਕੋਈ ਰੱਖਿਆ ਕਰਨ ਵਾਲਾ ਨਹੀਂ ਅਤੇ ਉਸ ਨੂੰ ਤੂੰ ਭੁਲਾ ਛੱਡਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Lord, there is no other protector, but you have forgotten Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਸ ਸਥਾਨ ਮੇਂ ਬਿਨਾਂ ਹਰੀ ਕੇ ਕੋਈ ਰਖ੍ਯਕ ਨਹੀਂ ਹੈ, ਸੋ ਹਰੀ ਤੈਨੇ ਬਿਸਾਰ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ (ਦੇ ਨਾਮ) ਤੋਂ ਬਿਨਾ ਹੋਰ ਕੋਈ (ਸਦਾ ਨਾਲ ਨਿਭਣ ਵਾਲਾ) ਰਾਖਾ ਨਹੀਂ (ਹੇ ਹਰਨ ਵਾਂਗ ਚੁੰਗੀਆਂ ਮਾਰਨ ਵਾਲੇ ਮਨ!) ਉਸ ਨੂੰ ਤੂੰ ਭੁਲਾਈ ਬੈਠਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਇ = ਉਹ (ਹਰੀ)। ਤੁਝਹਿ = ਤੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sin el Señor no hay nadie ahí que te proteja. ¿Por qué entonces Lo has abandonado?"