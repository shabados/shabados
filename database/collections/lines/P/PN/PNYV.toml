[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਕਬੀਰ; ਜਾਨੈਗਾ ਸੋਇ ॥"
page = 329
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir, he alone shall know this,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ, ਕੇਵਲ ਓਹੀ ਇਸ ਨੂੰ ਸਮਝੇਗਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, he alone knows this,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਸੋ ਪੁਰਸ਼ ਜਾਨੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ- (ਇਸ ਭੇਤ ਨੂੰ) ਓਹੀ ਮਨੁੱਖ ਸਮਝੇਗਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਇ = ਉਹੀ ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, sólo aquél que tiene a Dios en su corazón,"