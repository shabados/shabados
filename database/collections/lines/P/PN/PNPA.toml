[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਖਹਿ ਥਕਹਿ ਆਖਿ; ਆਖਿ; ਕਰਿ ਸਿਫਤਂ‍ੀ ਵੀਚਾਰ ॥"
page = 1241
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Uttering, uttering, uttering the Lord's praises and deliberating over them good many have grown wary."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਦੀਆਂ ਸਿਫਤਾ ਨੂੰ ਉਚਾਰਦੇ ਉਸਾਰਦੇ ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਸੋਚਦੇ ਸਮਝਦੇ ਅਨੇਕਾਂ ਹੀ ਹਾਰ ਹੁਟ ਗਹੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Mortals may utter, chant, recite and contemplate His Praises until they grow weary."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸ੍ਵਰ ਕੀ ਸਿਫਤੋਂ ਕੋ (ਆਖਿ) ਮੁਖਸੇ ਆਖ ਆਖ ਕੇ ਔਰ ਮਨ ਸੇ ਵੀਚਾਰ ਕਰ ਕਰ ਕੇ ਥਕਤ ਹੋ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੀਆਂ ਸਿਫ਼ਤਾਂ ਦਾ ਵਿਚਾਰ ਕਰ ਕੇ ਲੋਕ ਮੁੜ ਮੁੜ ਬੇਅੰਤ ਵਾਰੀ (ਉਸ ਦੀਆਂ ਵਡਿਆਈਆਂ) ਬਿਆਨ ਕਰਦੇ ਹਨ ਤੇ (ਬਿਆਨ ਕਰ ਕੇ) ਥੱਕ ਜਾਂਦੇ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਖਿ ਆਖਿ ਆਖਹਿ = ਬੇਅੰਤ ਵਾਰੀ ਆਖਦੇ ਹਨ। ਥਕਹਿ = ਥੱਕ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, millones han recitado Su Alabanza y millones habitan en Él, y aun así, ni una pequeña pizca del Valor"