[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭੁ ਕਛੁ ਵਰਤੈ; ਤਿਸ ਕਾ ਕੀਆ ॥"
page = 280
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Everything which he choose to do, comes to pass."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਭ ਕੁਝ ਜੋ ਉਹ ਕਰਨਾ ਲੋੜਦਾ ਹੈ, ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everything happens as He wills."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਸਭ ਕਿਛ ਤਿਸੀ ਕਾ ਕੀਆ ਹੂਆ ਵਰਤਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ ਵਿਚ) ਹਰੇਕ ਖੇਡ ਉਸੇ ਦੀ ਵਰਤਾਈ ਵਰਤ ਰਹੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque sólo existe lo que ha sido proyectado en Su Mente"