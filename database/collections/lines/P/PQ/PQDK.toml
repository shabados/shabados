[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਲੁ ਧਨੁ ਤਕੀਆ ਤੇਰਾ ॥"
page = 622
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art my might, wealth and support."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਮੇਰੀ ਸੱਤਿਆ, ਦੌਲਤ ਅਤੇ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my strength, wealth and support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਰਾ ਬਲ ਔ ਪਦਾਰਥ ਭੀ ਤੂੰ ਹੈਂ ਅਰ ਤੇਰਾ ਹੀ (ਤਕੀਆ) ਆਸਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਹੀ ਮੇਰਾ ਬਲ ਹੈਂ, ਤੂੰ ਹੀ ਮੇਰਾ ਧਨ ਹੈ, ਤੇਰਾ ਹੀ ਮੈਨੂੰ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਕੀਆ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todo mi poder, afluencia y soporte vienen de Ti,"