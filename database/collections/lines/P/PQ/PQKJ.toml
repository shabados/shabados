[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਕਿ ਅਰਜੁਨ ਵੀ ਜੰਗ ਦੇ ਦਿਨ ਅਜਿਹਾ ਨਹੀਂ ਸੀ ਕਰ ਸਕਿਆ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਕਿ ਅਰਜੁਨ ਨ ਕਰਦਾ ਬਰੂਜ਼ਿ ਨਬੁਰੱਦ ॥੧੫੯॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "That even the brave Arjun could not do on the day of the battle. (159) "