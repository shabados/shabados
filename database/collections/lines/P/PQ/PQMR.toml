[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਾਰਿ ਬੇਦ; ਜਿਹਵ ਭਨੇ ॥"
page = 1229
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If thou recite the four Vedas with thy tongue,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਆਪਣੀ ਜੀਭਾ ਨਾਲ ਤੂੰ ਚਾਰ ਵੇਦ ਉਚਾਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You may recite the four Vedas with your tongue,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਚਾਰੋਂ ਬੇਦ (ਜਿਹਵ) ਰਸਨਾ ਸੇ ਉਚਾਰਨ ਕਰੇ, ਭਾਵ ਕੰਠਾਗ੍ਰ ਹੋਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਜੇ ਕੋਈ ਮਨੁੱਖ ਚਾਰੇ ਵੇਦ ਆਪਣੀ ਜੀਭ ਨਾਲ ਉਚਾਰਦਾ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਹਵ ਭਨੇ = ਜੀਭ ਨਾਲ ਉਚਾਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si uno recita los cuatro Vedas con su boca"