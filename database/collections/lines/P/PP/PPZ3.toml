data = "ਸੰਗਤਿ ਸੰਤ; ਮਿਲਾਏ ॥"
page = 774
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting the society of saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਨਾਲ ਮਿਲ ਕੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Joining the Society of the Saints,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪਰਮੇਸਰ ਨੇ ਸੰਤੋਂ ਕੀ ਸੰਗਤ ਮੇਂ ਮਿਲਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਹੜਾ ਮਨੁੱਖ ਸੰਤ ਜਨਾਂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਮਿਲਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗਤਿ ਸੰਤ = ਸੰਤ ਜਨਾਂ ਦੀ ਸੰਗਤਿ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno es guiado hasta la Sociedad de los Santos;"