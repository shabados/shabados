[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਸਕਲ ਤੁਪਕ ਕੇ ਨਾਮ; ਸੁਬੁਧਿ ਮਨ ਧਾਰੀਐ ॥੯੭੬॥"
page = 776

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Rainraaj”, speak the word “Bhagaa”, then add the words “Jaachar-naath-shatru” and in this way, know all the names of Tupak.976."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਾਰੇ ਬੁੱਧੀਮਾਨ ਮਨ ਵਿਚ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝ ਲਵੋ ॥੯੭੬॥"