[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਮਨੋਰਥ ਪੂਰਨਹਾਰ ॥"
page = 1152
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is the Fulfiller of all the desires,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰੀਆਂ ਖਾਹਿਸ਼ਾਂ ਪੂਰੀਆਂ ਕਰਨ ਵਾਲਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Fulfiller of the mind's desires."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭੀ ਮਨੋਰਥੋਂ ਕੇ ਪੂਰਨ ਕਰਨਹਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਰਮਾਤਮਾ (ਜੀਵਾਂ ਦੀਆਂ) ਸਾਰੀਆਂ ਲੋੜਾਂ ਪੂਰੀਆਂ ਕਰ ਸਕਣ ਵਾਲਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲ ਮਨੋਰਥ = ਸਾਰੀਆ ਲੋੜਾਂ। ਪੂਰਨਹਾਰ = ਪੂਰੀਆਂ ਕਰ ਸਕਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres Tú Quien satisface todos nuestros deseos,"