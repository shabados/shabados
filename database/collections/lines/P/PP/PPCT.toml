[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਫੇਰਿ ਤ੍ਰਿਬੈਨੀ ਮੈ ਕੈ ਇਸਨਾਨ; ਦੈ ਦਾਨੁ ਬਲੀ ਹਰਿਦੁਆਰ ਸਿਧਾਯੋ ॥"
page = 539

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then taking a bath at triveni, this her reached Hardwar"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਤ੍ਰਿਵੇਣੀ ਵਿਚ ਇਸ਼ਨਾਨ ਕਰ ਕੇ ਅਤੇ ਦਾਨ ਦੇ ਕੇ, ਬਲਰਾਮ ਹਰਿਦੁਆਰ ਚਲਾ ਗਿਆ।"