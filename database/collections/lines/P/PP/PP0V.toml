[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨੰਦ ਕਹਿਯੋ ਜਬ ਗੋਪਿਨ ਸੋ; ਬਿਧਿ ਅਉਰ ਚਿਤੀ ਮਨ ਬੀਚ ਮੁਰਾਰੀ ॥"
page = 326

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Nand said all this to gopas then Krishna reflected something else in his mind"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਨੰਦ ਨੇ ਗਵਾਲਿਆਂ ਨੂੰ ਇਹ ਗੱਲ ਕਹੀ ਤਾਂ ਕ੍ਰਿਸ਼ਨ ਨੇ ਆਪਣੇ ਚਿਤ ਵਿਚ ਹੋਰ ਢੰਗ ਨਾਲ ਵਿਚਾਰ ਕੀਤਾ"