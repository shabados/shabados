[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਮਨ ਮੂਏ; ਭਗਤਿ. ਨ ਹੋਇ ॥"
page = 1277
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without stilling his mind, man can worship not the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨੂਏ ਨੂੰ ਮਾਰਣ ਦੇ ਬਗੈਰ, ਇਨਸਾਨ ਪ੍ਰਭੂ ਦੀ ਉਪਾਸ਼ਨਾ ਨਹੀਂ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without subduing the mind, devotional worship does not come."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਮਨ ਮੂਏ ਬਿਨਾਂ ਭਗਤੀ ਪ੍ਰਾਪਤਿ ਨਹੀਂ ਹੋਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਮਨ ਵੱਸ ਵਿਚ ਆਉਣ ਤੋਂ ਬਿਨਾ ਭਗਤੀ ਹੋ ਨਹੀਂ ਸਕਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la Alabanza de Devoción no llega,"