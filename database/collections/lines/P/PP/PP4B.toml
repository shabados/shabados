[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਪਰੋ ਭਾਜਿ ਸੰਨ︀ਯਾਸਨ ਕੈ ਕਹੈ ਦਤ ਕੇ ਨਾਮ ਪੈ ਧਾਮ ਲੁਟੈ ਦੈ ॥"
page = 715

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Who squanders his belongings to Sannyasis in the name of Dutt,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੇ (ਉਥੋਂ) ਭਜ ਕੇ ਸੰਨਿਆਸੀਆਂ (ਕੋਲ ਜਾਵੇ ਤਾਂ) ਕਹਿਣਗੇ ਕਿ ਦੱਤ ਦੇ ਨਾਂ ਤੇ ਘਰ ਨੂੰ ਲੁਟਾ ਦਿਓ।"