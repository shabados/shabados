[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੀ ਸਰਣਿ; ਪੂਰਨ ਕਿਰਪਾਲਾ ॥੧॥ ਰਹਾਉ ॥"
page = 563
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thy refuge, I seek, O Thou the Omnipresent, compassionate Lord. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੀ ਸ਼ਰਣਾਗਤ ਲੋੜਦਾ ਹਾਂ, ਹੇ ਸਰਬ-ਵਿਆਪਕ ਦਿਆਲੂ ਸੁਆਮੀ! ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I seek Your Sanctuary, O Perfect, Compassionate Lord. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੂਰਣ! ਹਮ ਤੇਰੀ ਸਰਣ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੀ ਸਰਨ ਆਇਆ ਹਾਂ, ਹੇ ਸਰਬ-ਵਿਆਪਕ! ਹੇ ਕਿਰਪਾ ਦੇ ਘਰ! ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰਨ = ਹੇ ਸਰਬ-ਵਿਆਪਕ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues busco Tu Refugio, oh Ser Perfecto y Compasivo. (1-Pausa)"