[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੁਨਿ ਬੁਨਿ; ਆਪ ਆਪੁ ਪਹਿਰਾਵਉ ॥"
page = 1159
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Weaving, weaving the clothes myself, I myself wear them,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੁਦ ਕੱਪੜਿਆਂ ਨੂੰ ਉਣ ਉਣ ਕੇ, ਮੈਂ ਖੁਦ ਹੀ ਉਨ੍ਹਾਂ ਨੂੰ ਪਹਿਨਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I weave and weave, and wear what I weave."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਿਤੀ ਕੋ ਲਗਾਇ ਲਗਾਇ ਕਰ ਆਪ ਕੋ ਪਹਿਰਾਵਤਾ ਹੂੰ ਅਰਥਾਤ ਅਨੰਦ ਭੋਗਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ-ਚਰਨਾਂ ਵਿਚ ਟਿਕੀ ਸੁਰਤ ਦੀ ਤਾਣੀ) ਉਣ ਉਣ ਕੇ ਮੈਂ ਆਪਣੇ ਆਪ ਨੂੰ ਪਹਿਨਾ ਰਿਹਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੁਨਿ ਬੁਨਿ = ਉਣ ਉਣ ਕੇ, ਪ੍ਰਭੂ-ਚਰਨਾਂ ਵਿਚ ਲਿਵ ਲਾਣ ਦੀ ਤਾਣੀ ਉਣ ਉਣ ਕੇ। ਆਪੁ = ਆਪਣੇ ਆਪ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tejo y tejo y mi ser usa todo lo que voy tejiendo"