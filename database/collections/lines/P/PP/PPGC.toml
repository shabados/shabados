[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਤਿਗੁਰ, ਸਚੁ ਸਵਾਰਣਹਾਰਾ ॥੧੭॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The true Guru alone chisels one and all."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(੯) ਸਤਿਗੁਰੂ ਸੱਚ (ਦਾ ਪਿਆਰ ਦੇਕੇ) ਸਵਾਰਨ ਵਾਲਾ ਹੈ।"