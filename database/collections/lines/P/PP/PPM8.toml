[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਕਰਤ; ਮਿਟੇ ਸਭਿ ਭਰਮਾ ॥"
page = 874
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Uttering the Lord's Name, all the doubts are dispelled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦਾ ਨਾਮ ਜੱਪਣ ਦੁਆਰਾ ਸਾਰੇ ਸੰਦੇਹ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chanting the Name of the Lord, Har, Har, all doubts are dispelled."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਹਰਿ ਜਾਪ ਕਰਤਿਆਂ ਸਭ ਕੇ ਭਰਮ ਮਿਟ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰਿ-ਨਾਮ ਸਿਮਰਿਆਂ ਸਭ ਭਟਕਣਾਂ ਦੂਰ ਹੋ ਜਾਂਦੀਆਂ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ ਹਰਿ ਕਰਤ = ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਸਿਮਰਿਆਂ। ਭਰਮਾ = ਭਟਕਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Recitando el Nombre del Señor todas tus dudas desaparecen;"