[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹਉ ਤਿਸੁ ਘੋਲਿ ਘੁਮਾਇਆ; ਪਰ ਨਾਰੀ ਦੇ ਨੇੜਿ ਨ ਜਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "I love him deeply who does not go near another’s wife."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਸਥੋਂ ਵਾਰਨੇ ਜਾਂਦਾ ਹਾਂ ਜੋ ਪਰਾਈ ਇਸਤ੍ਰੀ ਦੇ ਨੇੜੇ ਨਾ ਜਾਵੇ, (ਭਾਵ ਜਤੀ ਹੋਵੇ)।"