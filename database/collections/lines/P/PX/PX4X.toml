[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਹੁ ਬਿਧਿ ਅਸੁਰਨ ਕਰਤ ਸੰਘਾਰਾ ॥"
page = 190

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In this way, incarnating himself, he removes the load of the earth and destroys the demons in various ways."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਬਹੁਤ ਤਰ੍ਹਾਂ ਨਾਲ ਦੈਂਤਾਂ ਦਾ ਸੰਘਾਰ ਕਰਦਾ ਹੈ।"