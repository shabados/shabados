[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਆ ਡੇਰਾ ਕੀ; ਸੋ ਮਿਤਿ ਜਾਨੈ ॥"
page = 256
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Only he knows the worth of that dwelling,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨਿਵਾਸ ਅਸਥਾਨ ਦੀ ਕਦਰ ਉਹੀ ਜਾਣਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The value of that place beyond is known only to those,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਸ ਡੇਰੇ ਕੀ ਮ੍ਰਿਯਾਦਾ ਕੋ ਸੋ ਪੁਰਸ਼ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਸਦੀਵੀ ਟਿਕਾਣੇ ਦੀ ਰੀਤ-ਮਰਯਾਦਾ ਦੀ ਸਿਰਫ਼ ਉਸ ਮਨੁੱਖ ਨੂੰ ਸਮਝ ਪੈਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਤਿ = ਮਰਯਾਦਾ, ਰੀਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin embargo, si la Gracia de Dios está con él,"