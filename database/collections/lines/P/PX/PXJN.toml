data = "ਰਾਨੀ ਬਾਹਿ ਜੋਰ ਤਨ ਗਹੀ ॥੪॥"
page = 844

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Kanak did not heed to her but she took him in her arms.(4)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਣੀ ਨੇ (ਉਸ ਨੂੰ) ਜ਼ੋਰ ਨਾਲ ਬਾਂਹਵਾਂ ਦੀ ਗਲਵਕੜੀ ਪਾ ਲਈ ॥੪॥"