[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਹੁ ਜੋਨੀ ਭਵਹਿ; ਧੁਰਿ ਕਿਰਤਿ ਲਿਖਿਆਸਾ ॥"
page = 176
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They wander through many births. Their destiny is so preordained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਬੜੇ ਜਨਮਾ ਅੰਦਰ ਭਟਕਦੇ ਹਨ। ਉਨ੍ਹਾਂ ਦੀ ਕਿਸਮਤ ਮੁਢ ਤੋਂ ਹੀ ਐਸੀ ਲਿਖੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They wander lost through countless incarnations; this is their pre-ordained destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਧੁਰ ਕੇ ਕਰਤਤੁ ਲਿਖੇ ਅਨੁਸਾਰ ਅਨੇਕ ਜੋਨੀਓਂ ਮੇਂ ਭ੍ਰਮਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਉਹਨਾਂ ਦੇ ਕੀਤੇ ਕਰਮਾਂ ਅਨੁਸਾਰ ਧੁਰੋਂ ਹੀ ਉਹਨਾਂ ਦੇ ਮੱਥੇ ਉਤੇ ਅਜੇਹਾ ਲੇਖ ਲਿਖਿਆ ਹੁੰਦਾ ਹੈ ਕਿ ਉਹ ਅਨੇਕਾਂ ਜੂਨਾਂ ਵਿਚ ਭਟਕਦੇ ਫਿਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਵਹਿ = ਭੌਂਦੇ ਹਨ। ਧੁਰਿ = ਧੁਰ ਤੋਂ। ਕਿਰਤਿ = ਕੀਤੇ ਕਰਮਾਂ ਦੇ ਸੰਸਕਾਰਾਂ ਅਨੁਸਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y vaga por muchas encarnaciones. Tal es su destino ordenado por el Mismo Dios,"