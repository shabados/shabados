[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨੀ ਸਚੜਾ ਸਚੁ ਸਲਾਹਿਆ; ਹੰਉ. ਤਿਨ ਲਾਗਉ ਪਾਏ ॥"
page = 585
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who praise the Truest of the True, I fall at their feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੱਚਿਆਂ ਦੇ ਪਰਮ ਸੱਚਿਆਰਾਂ ਦੀ ਸਿਫ਼ਤ-ਸਨ ਕਰਦੇ ਹਨ ਮੈਂ ਉਨ੍ਹਾਂ ਦੇ ਪੈਰੀ ਪੈਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I fall at the feet of those who praise the Truest of the True."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਨਿਸਚੇ ਕਰ ਕੇ ਸਚਾ ਸਲਾਹਾ ਹੈ ਮੈਂ ਤਿਨ ਕੇ ਚਰਨੋਂ ਮੇਂ ਲਗਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੇ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕੀਤੀ, ਮੈਂ ਉਹਨਾਂ ਦੇ ਚਰਨੀਂ ਲੱਗਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ante los pies de aquéllos que alaban a su Verdadero Señor,"