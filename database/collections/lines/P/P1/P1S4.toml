[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ; ਨਹੀ ਦੂਜਾ ਕੋ ਪਹੁਚਨਹਾਰਾ ॥੧॥ ਰਹਾਉ ॥"
page = 176
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "no one else can equal him. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਬਰਾਬਰੀ ਕੋਈ ਹੋਰ ਨਹੀਂ ਕਰ ਸਕਦਾ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- no one else can rival him. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੋ ਦੂਸਰਾ ਕੋਈ ਪਹੁਚਨ ਵਾਲਾ ਨਹੀਂ, ਭਾਵ ਏਹਿ ਕਿ ਤਿਸ ਕੀ ਬਰਾਬਰੀ ਨਹੀਂ ਕਰ ਸਕਤਾ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦਾ ਜੀਵਨ ਇਤਨਾ ਉੱਚਾ ਹੋ ਜਾਂਦਾ ਹੈ ਕਿ) ਕੋਈ ਹੋਰ ਮਨੁੱਖ ਉਸ ਦੀ ਬਰਾਬਰੀ ਨਹੀਂ ਕਰ ਸਕਦਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਹੁਚਨਹਾਰਾ = ਬਰਾਬਰੀ ਕਰ ਸਕਣ ਵਾਲਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nadie lo puede igualar. (1-Pausa)"