[[content]]
assets = ["SSKS"]
type = "primary"
data = "ਚਟੀਆ ਅਨੇਕ ਜੈਸੇ ਆਵੈਂ ਚਟਸਾਲ ਬਿਖੈ; ਪੜਤ ਨ ਏਕਸੇ ਸਰਬ ਹਰ ਕਥ ਜੀ ॥"

[[content]]
assets = ["SSPK"]
type = "translation"
language = "en"
data = "Just as there are several students in a school, but all of them are not proficient in understanding a subject to the same extent."

[[content]]
assets = ["SSSK"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਪਾਠਸ਼ਾਲਾ ਵਿਚ ਅਨੇਕ ਵਿਦਿਆਰਥੀ ਆਉਂਦੇ ਹਨ, ਪਰ ਸਾਰੇ ਹਰੀ ਕਥਾ ਇਕੋ ਜਿਹੀ ਨਹੀਂ ਪੜ੍ਹਦੇ।"