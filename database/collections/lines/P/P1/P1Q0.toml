[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਧਿ ਮਤਿ ਕਰਤੈ ਸਭ ਹਿਰਿ ਲਈ; ਬੋਲਨਿ ਸਭੁ ਵਿਕਾਰੁ ॥"
page = 316
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Creator has taken away all their pure understanding and they talk all evil."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿਰਜਣਹਾਰ ਨੇ ਉਨ੍ਹਾਂ ਦੀ ਸਾਰੀ ਪਵਿੱਤ੍ਰ ਸਮਝ ਖੋਹ ਲਈ ਹੈ ਅਤੇ ਉਹ ਸਮੂਹ ਮੰਦਾ ਹੀ ਬੋਲਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator has taken away all their understanding and purity; all their speech is evil and corrupt."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੇਸ੍ਟ ਬੁਧੀ ਵਾਹਿਗੁਰੂ ਨੇ ਹਿਰ ਲਈ ਹੈ, ਯਾਂ ਤੇ ਸਭ ਵਿਕਾਰ ਸੰਜੁਗਤ ਬਚਨ ਬੋਲਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਰਤਾਰ ਨੇ ਉਹਨਾਂ (ਮਨਮੁਖਾਂ) ਦੀ ਹੋਸ਼ ਤੇ ਅਕਲ ਖੋਹ ਲਈ ਹੈ, ਨਿਰਾ ਵਿਕਾਰ ਹੀ ਬੋਲਦੇ ਹਨ (ਭਾਵ, ਨਿਰੇ ਵਿਕਾਰਾਂ ਦੇ ਬਚਨ ਹੀ ਕਰਦੇ ਹਨ);"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਧਿ = ਹੋਸ਼। ਹਿਰਿ ਲਈ = ਖੋਹ ਲਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Creador le ha quitado el sentido de los valores, y todo lo que habla es erróneo y vano."