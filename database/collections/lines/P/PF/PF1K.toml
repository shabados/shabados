data = "ਮਹਲਨ ਚਰੇ ਰਾਵ ਜੂ ਹੇਰਿਯੋ ॥੧੪॥"
page = 889

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When they passed by the Rajas’ palace, the Raja noticed as well.(14)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤਾਂ) ਮਹੱਲਾਂ ਉਤੇ ਚੜ ਕੇ ਰਾਜਾ ਜੀ ਨੇ ਵੇਖਿਆ ॥੧੪॥"