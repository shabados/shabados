[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਕਰਤੇ ਕਾ; ਇਹੁ ਧਨੁ ਮਾਲੁ ॥"
page = 351
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, this is the wealth and property of the creator."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਇਹ ਸਿਰਜਣਹਾਰ ਦੀ ਦੌਲਤ ਅਤੇ ਜਾਇਦਾਦ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, this is the wealth and property of the Creator Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਕਰਤੇ ਕਾ ਤੇਰੀ ਭਗਤੀ ਕਰਨੇ ਹਾਰੋਂ ਕਾ ਇਹੀ ਧਨ ਔਰ ਯਹੀ ਹਸਤੀ ਅਸ੍ਵਾਦਿ ਮਾਲ ਹੈ। ਵਾ ਹੇ ਕਰਤੇ! ਪੂਰਬਕ ਗੁਣੋ ਰੂਪੀ ਜੋ ਧੰਨਤਾ ਜੋਗ ਮਾਲ ਹੈ, ਸੋ ਸਭ ਆਪ ਕਾ ਹੈ, ਭਾਵ ਤੇਰੀ ਕ੍ਰਿਪਾ ਸੇ ਏਹ ਗੁਣ ਪ੍ਰਾਪਤਿ ਹੋਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਇਹ ਆਤਮਕ ਆਨੰਦ ਹੀ) ਕਰਤਾਰ ਤਕ ਅਪੜਾਣ ਵਾਲਾ ਧਨ-ਮਾਲ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, este en realidad es el Tesoro del Señor Creador, oh,"