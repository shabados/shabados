[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚਾ ਸਉਦਾ ਲਾਭੁ ਸਦਾ; ਖਟਿਆ ਨਾਮੁ ਅਪਾਰੁ ॥"
page = 646
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Dealing in this true merchandise, the man ever earns the profit of the unique Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੱਚੇ ਸੁਦਾਗਰੀ ਦੇ ਮਾਲ ਦਾ ਵਣਜ ਕਰ ਕੇ ਆਦਮੀ ਹਮੇਸ਼ਾਂ ਲਾਸਾਨੀ ਨਾਲ ਦਾ ਨਫਾ ਕਮਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Dealing in this true merchandise, one earns the profit of the incomparable Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਅਪਾਰ ਪਰਮੇਸਰ ਕਾ ਨਾਮ ਰੂਪ ਸਚਾ ਸਉਦਾ ਖਟਿਆ ਹੈ, ਤਿਨੋਂ ਕੋ ਸਦਾ ਲਾਭ ਰਹਿਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਇਹ ਸੱਚਾ ਸੌਦਾ (ਕਰ ਕੇ) ਬੇਅੰਤ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਲਾਭ ਖੱਟਿਆ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y comerciando con esta mercancía verdadera, logra el Fruto del Nombre."