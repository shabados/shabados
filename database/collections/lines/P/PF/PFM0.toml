[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜੜੀਆ ਸਾਈਂਦਾਸੁ ਹੈ; ਸਭ ਕੁਲੁ ਹੀਰੇ ਲਾਲ ਅਪਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The whole of the family of Bhai Sain Das is like invaluable diamonds and jewels."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂਦਾਸ ਜੜੀਆ ਸਾਰੀ ਕੁਲ ਅਪਾਰ ਹੀਰੇ ਲਾਲਾਂ (ਵਾਂਙੂ ਅਮੋਲਕ) ਸਨ।"