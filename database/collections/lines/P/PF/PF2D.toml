[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੁ ਸੇਵਿ ਮਨਾ; ਹਰਿ ਜਨ ਸੰਗੁ ਕੀਜੈ ॥"
page = 905
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Serve thou thy Guru, O my soul and associate with the Lord's slaves."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੇ ਗੁਰਾਂ ਦੀ ਟਹਿਲ ਕਮਾ, ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਅਤੇ ਪ੍ਰਭੂ ਦੇ ਗੋਲਿਆਂ ਦੀ ਸੰਗਤ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serve the Guru, O mind, and associate with the humble servants of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਗੁਰੋਂ ਕੋ ਸੇਵ ਔ ਭਗਤ ਜਨੋਂ ਕੀ ਸੰਗਤਿ ਕਰਿ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਮਨ! ਗੁਰੂ ਦੀ (ਦੱਸੀ) ਸੇਵਾ ਕਰ, ਤੇ ਸੰਤ ਜਨਾਂ ਦੀ ਸੰਗਤ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ ਜਨ ਸੰਗੁ = ਸੰਤ ਜਨਾਂ ਦੀ ਸੰਗਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sirve al Guru, oh mi mente, y busca a la Saad Sangat, la Sociedad de los Santos;"