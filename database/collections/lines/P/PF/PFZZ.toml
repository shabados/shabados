[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨ ਹੀ ਪਾਏ; ਨਿਰੰਜਨ ਦੇਵ ॥"
page = 1159
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone attains unto the immaculate Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਪਵਿੱਤ੍ਰ ਪ੍ਰਭੂ ਨੂੰ ਪਰਾਪਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone attains the Immaculate Divine Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸੇਵਕ ਨੇ ਹੀ ਨਿਰੰਜਨ ਦੇਵ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸੇ ਨੂੰ ਪ੍ਰਭੂ ਮਿਲਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, ese ser llega hasta el Dios Inmaculado."