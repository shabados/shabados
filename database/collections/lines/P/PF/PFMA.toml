[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੁਖ ਕੀ ਬਾਤ; ਸਗਲ ਸਿਉ ਕਰਤਾ ॥"
page = 384
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By words of mouth I talk with all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੂੰਹ ਦੇ ਬਚਨ ਦੁਆਰਾ ਮੈਂ ਸਾਰਿਆਂ ਨਾਲ ਬੋਲਦਾ ਚਾਲਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By word of mouth, I talk with everyone;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੁਖ ਦੀ ਬਾਰਤਾ ਤੋ ਸਭ ਸੇ ਕਰਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਮੈਂ ਸਭ ਲੋਕਾਂ ਨਾਲ (ਲੋੜ ਅਨੁਸਾਰ) ਮੂੰਹੋਂ ਤਾਂ ਗੱਲਾਂ ਕਰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਖ ਕੀ ਬਾਤ = ਮੂੰਹੋਂ ਗੱਲਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con las palabras en los labios converso con todos;"