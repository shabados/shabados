[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕਿ ਨਾਗੇ ਭੂਖੇ; ਭਵਹਿ ਭਵਾਏ ॥"
page = 1025
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some ramble and roam about hungry and naked."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਭੁੱਖੇ ਨੰਗੇ ਤੇ ਭੌਂਦੇ ਭਟਕਦੇ ਫਿਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some wander and roam around, hungry and naked."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਕਿ ਕਰਮਾਂ ਕੇ ਭਵਾਏ ਹੂਏ ਕਪੜੇ ਸੇ ਨਾਂਗੇ ਔਰ ਪੇਟ ਸੇ ਭੂਖੇ ਹੀ ਫਿਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਬੰਦੇ (ਜਗਤ ਤਿਆਗ ਕੇ) ਨੰਗੇ ਰਹਿੰਦੇ ਹਨ, ਭੁੱਖਾਂ ਕੱਟਦੇ ਹਨ (ਤਿਆਗ ਦੇ ਭੁਲੇਖੇ ਦੇ) ਭਟਕਾਏ ਹੋਏ (ਥਾਂ ਥਾਂ) ਭੌਂਦੇ ਫਿਰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunos vagan por todas partes hambrientos y desnudos,"