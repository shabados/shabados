[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਨੋ ਸਚਾ ਦੇਇ ਸੁ ਪਾਏ ॥"
page = 1063
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone obtains truth, whom the True Lord gives."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਸੱਚ ਨੂੰ ਪਾਉਂਦਾ ਹੈ, ਜਿਸ ਨੂੰ ਸੱਚਾ ਸਾਈਂ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone obtains the Truth, unto whom the True Lord gives it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੋ (ਸਚਾ) ਵਾਹਿਗੁਰੂ ਸਤਸੰਗ ਦੇਤਾ ਹੈ, ਸੋ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ, ਉਹ ਮਨੁੱਖ (ਹੀ ਸਦਾ-ਥਿਰ ਹਰਿ-ਨਾਮ ਦੀ ਦਾਤਿ) ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ ਜਿਸ ਨੂੰ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਪਰਮਾਤਮਾ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸ ਨੋ = {ਸੰਬੰਧਕ 'ਨੋ' ਦੇ ਕਾਰਨ ਲਫ਼ਜ਼ 'ਜਿਸੁ' ਦਾ (ੁ) ਉਡ ਗਿਆ ਹੈ}। ਦੇਇ = ਦੇਂਦਾ ਹੈ। ਸੁ = ਉਹ {ਇਕ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El que es bendecido por el Uno Verdadero logra llegar hasta Él,"