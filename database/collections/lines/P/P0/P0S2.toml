[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖਾਇ ਖਰਚਿ; ਮਨੁ ਰਹਿਆ ਅਘਾਇ ॥੨॥"
page = 375
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Eating and expending it, the mind remains satiated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਨੂੰ ਖਾਂਦਾ ਅਤੇ ਖਰਚਦਾ ਹੋਇਆ ਚਿੱਤ ਤ੍ਰਿਪਤ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Eating and consuming it, the mind remains satisfied. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਖਾਤੇ ਖਰਚਤੇ ਹੂਏ ਮਨ (ਅਘਾਇ) ਤ੍ਰਿਪਤ ਹੋ ਰਹਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਧਨ ਆਪ ਵਰਤ ਕੇ ਹੋਰਨਾਂ ਨੂੰ ਵੰਡ ਕੇ (ਮਨੁੱਖ ਦਾ) ਮਨ (ਦੁਨੀਆ ਦੇ ਧਨ ਦੀ ਲਾਲਸਾ ਵਲੋਂ) ਰੱਜਿਆ ਰਹਿੰਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖਾਇ = ਖਾ ਕੇ, ਆਪ ਵਰਤ ਕੇ, ਆਪ ਜਪ ਕੇ। ਖਰਚਿ = ਖਰਚ ਕੇ, ਵੰਡ ਕੇ। ਰਹਿਆ ਅਘਾਇ = ਰੱਜਿਆ ਰਹਿੰਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y al gastarlo la mente está siempre en Paz. (2)"