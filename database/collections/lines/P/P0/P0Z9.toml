[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੇਤੜਿਆਂ ਹੀ ਸਚਿਆਰ; ਕੇਤੜਿਆਂ ਦਗਾਬਾਜ ਦਰੋਗੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many are leading truthful life and many are cheats and liars."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਈ (ਇਸ ਦੁਨੀਆਂ ਵਿਚ ਆਕੇ ਈਸ਼ਵਰ ਨਾਲ) ਸੱਚੇ ਰਹਿੰਦੇ ਹਨ, ਕਿਤਨੇ ਕਪਟ ਅਤੇ ਝੂਠ ਵਿਖੇ (ਉਮਰ ਕਟੀ ਕਰ ਜਾਂਦੇ ਹਨ)।"