[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹਉ ਤਿਸੁ ਘੋਲਿ ਘੁਮਾਇਆ; ਪਰ ਦਰਬੈ ਨੋ ਹਥੁ ਨ ਲਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "I love him deeply who touches not the other’s wealth."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਸਥੋਂ ਵਾਰਨੇ ਜਾਂਦਾ ਹਾਂ ਜੋ ਪਰਾਏ ਧਨ ਨੂੰ ਹੱਥ ਨਾ ਲਾਵੇ, (ਭਾਵ ਲੋਭ ਨਾ ਕਰੇ)।"