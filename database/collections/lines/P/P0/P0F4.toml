[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕ ਤਾਜਨਿ ਤੁਰੀ ਚੰਗੇਰੀ ॥"
page = 695
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and also a good Turkistani mare."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਇਕ ਚੰਗੀ ਤੁਰਕਿਸਤਾਨੀ ਘੋੜੀ ਭੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and a fine Turkestani horse."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਏਕ (ਤਾਜਨਿ) ਉਤਮ ਜਾਤੀ ਕੀ (ਤੁਰੀ) ਘੋੜੀ ਅਸਵਾਰੀ ਹੇਤ ਮਾਂਗਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਇਕ ਚੰਗੀ ਅਰਬੀ ਘੋੜੀ ਭੀ ਚਾਹੀਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾਜਨਿ ਤੁਰੀ = ਅਰਬੀ ਘੋੜੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aparte quisiera un caballo árabe  para que lo monte y pueda ir a través de Tu Maravillosa tierra"