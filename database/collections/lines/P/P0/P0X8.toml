[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਨਾਮੁ ਜਪਹੁ ਗੁਨਤਾਸੁ ॥੫॥"
page = 290
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "all thy sorrows shall vanish, O Nanak!"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਸਾਰੇ ਗ਼ਮ ਅਲੋਪ ਹੋ ਜਾਣਗੇ। ਹੇ ਨਾਨਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, chant the Naam, the treasure of excellence. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਸੋ ਗੁਣੋਂ ਕਾ ਸਮੁੰਦ੍ਰ ਨਾਮ ਜਪੋ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਾਂ ਤੇ) ਹੇ ਨਾਨਕ! ਨਾਮ ਜਪਹੁ, (ਨਾਮ ਹੀ) ਗੁਣਾਂ ਦਾ ਖ਼ਜ਼ਾਨਾ (ਹੈ) ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਣ ਤਾਸੁ = ਗੁਣਾਂ ਦਾ ਖ਼ਜ਼ਾਨਾ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué no dedicarse a cultivar la fuente de tanto Bien?  (5)"