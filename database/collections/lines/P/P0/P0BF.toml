[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਸੰ ਸੂਰਜੰ ਆਦਿ ਲੈ ਕੈ ਉਪਿੰਦ੍ਰੰ ॥"
page = 161

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Indra gathered together all the gods including Chandra. Surya and Upendra."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੂਰਜ, ਚੰਦ੍ਰਮਾ, ਉਪੇਂਦਰ ਆਦਿ।"