[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਨ ਲੇਵੈ; ਮਰੈ ਬਿਖੁ ਖਾਏ ॥"
page = 119
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Name, he utters not and dies by taking poison."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦਾ ਊਹ ਜਾਪ ਨਹੀਂ ਕਰਦਾ ਤੇ ਜਹਿਰ ਖਾ ਕੇ ਮਰ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They do not chant the Naam, and they die, eating poison."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਨਾਮ ਜਪਤਾ ਨਹੀਂ ਔ ਵਿਖੇ ਰੂਪ ਜਹਰ ਖਾ ਕਰ ਜਨਮਤਾ ਮਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਨਹੀਂ ਸਿਮਰਦਾ, ਉਹ (ਮਾਇਆ ਦਾ ਮੋਹ-ਰੂਪ) ਜ਼ਹਰ ਖਾ ਕੇ ਆਤਮਕ ਮੌਤ ਸਹੇੜ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਰੈ = ਆਤਮਕ ਮੌਤ ਸਹੇੜਦਾ ਹੈ। ਬਿਖੁ = ਜ਼ਹਰ। ਖਾਏ = ਖਾਇ, ਖਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ese ser no pronuncia el Nombre del Señor, ni siquiera en murmullo, y se envenena hasta la muerte."