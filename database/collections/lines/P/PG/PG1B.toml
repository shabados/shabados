[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੁਤਿਯਾ ਲੈ ਤਿਹ ਊਪਰ ਜਰਿਯੋ ॥੪॥"
page = 860

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After taking the pulp out, the shell was put on his head and the other whole was put on top of it.( 4)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਦੂਜਾ ਤਰਬੂਜ਼ ਉਸ ਦੇ ਉਪਰ ਜੜ੍ਹ ਦਿੱਤਾ ॥੪॥"