[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਿ ਪੂਰਨ ਹੋਏ ਕਾਮਾ ॥੩॥"
page = 621
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by remembering which the affairs are resolved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ, ਕਾਰਜ ਰਾਸ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "chanting it, one's affairs are perfectly resolved. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੋ ਜਪ ਕੈ ਹਮਾਰੇ ਕਾਮ ਪੂਰਨ ਹੂਏ ਹੈਂ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਪ ਜਪ ਕੇ (ਜ਼ਿੰਦਗੀ ਦੇ) ਸਾਰੇ ਮਨੋਰਥ ਸਫਲ ਹੋ ਜਾਂਦੇ ਹਨ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "uno vive en Plenitud. (3)"