[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੰਚਨ ਕੇ ਬਹੁ ਮੋਲ ਜਰੇ ਨਗ; ਬ੍ਰਹਮ ਸਕੈ ਉਪਮਾ ਨ ਗਨਾਏ ॥"
page = 387

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Their praise could not even be uttered by Brahma"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਸੋਨੇ (ਦੇ ਸਨ ਅਤੇ ਉਨ੍ਹਾਂ ਵਿਚ) ਵਡ-ਮੁਲੇ ਨਗ ਜੜ੍ਹੇ ਹੋਏ ਸਨ ਜਿਨ੍ਹਾਂ ਦੀ ਉਪਮਾ ਬ੍ਰਹਮਾ ਵੀ ਨਹੀਂ ਦਸ ਸਕਦਾ।"