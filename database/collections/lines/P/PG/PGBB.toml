[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਦਿਨ ਤੈ ਤਾ ਸੋ ਘਨੀ; ਪ੍ਰੀਤਿ ਬਢੀ ਸੁਖ ਪਾਇ ॥"
page = 960

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "From that day on, Raja’s love was enhanced towards her."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਿਨ ਤੋਂ ਉਸ ਨਾਲ ਪ੍ਰੀਤ ਬਹੁਤ ਵਧ ਗਈ ਅਤੇ ਸੁਖ ਪ੍ਰਾਪਤ ਕੀਤਾ"