[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਣਿ ਦਾਤਨ ਕੇਸਨੁ ਪਾਰਹਿਗੇ ॥੩੧੮॥"
page = 583

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The elephants, horses, chariots and chariot-riders will be chopped and the warriors catching each other by their hair, they ill swing, there will be blows of legs and fists and the heads will be shattered with teeth.318."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਯੁੱਧਭੂਮੀ ਵਿਚ (ਇਕਨਾਂ ਦੇ) ਦੰਦ ਅਤੇ ਕੇਸ ਪੁਟ ਦੇਣਗੇ ॥੩੧੮॥"