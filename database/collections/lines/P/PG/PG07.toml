[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਖਾਰਿ ਪਾਇ ਬ੍ਰਹਮਣੰ ਪ੍ਰਦਛਣਾ ਬਿਸੇਖ ਦੈ ॥"
page = 204

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Washing the feet of Brahmins and giving them their seats and buring the incenses and earthen lampas, the king circumambulated the Brahmins in a special manner."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਰਾਜੇ ਨੇ) ਬ੍ਰਾਹਮਣਾਂ ਦੇ ਚਰਨ ਧੋ ਕੇ ਬਹੁਤ ਪ੍ਰਕਰਮਾ ਕੀਤੀਆਂ।"