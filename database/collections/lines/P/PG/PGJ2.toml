[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕਸੁ ਹਰਿ ਕੇ ਨਾਮ ਵਿਣੁ; ਧ੍ਰਿਗੁ ਜੀਵਣੁ. ਧ੍ਰਿਗੁ ਵਾਸੁ ॥"
page = 949
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Name of one God, accursed is his life and accursed his habitation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦੇ ਬਗੈਰ, ਲਾਣ੍ਹਤ ਮਾਰੀ ਹੈ ਉਸ ਦੀ ਜਿੰਦਗੀ ਅਤੇ ਲਾਣ੍ਹਤ ਮਾਰਿਆ ਉਸ ਦਾ ਰਹਿਣ ਦੀ ਥਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Name of the One Lord, his life is cursed, and his home is cursed as well."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਕ ਪ੍ਰਮੇਸਰ ਕੇ ਨਾਮ ਬਿਨਾ ਜੀਵਣ ਕੋ ਧ੍ਰਿਗੁ ਹੈ ਔ ਤਿਨ ਕੇ (ਵਾਸੁ) ਅਸਥਾਨ ਕੋ ਭੀ ਧ੍ਰਿਕਾਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਕ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਸਿਮਰਨ ਤੋਂ ਬਿਨਾ (ਜਗਤ ਵਿਚ) ਜੀਊਣਾ ਵੱਸਣਾ ਫਿਟਕਾਰ-ਜੋਗ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧ੍ਰਿਗੁ = ਫਿਟਕਾਰ-ਯੋਗ। ਵਾਸੁ = ਵਸੇਬਾ, ਵਾਸਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es destruido por su constante fascinación por Maya,"