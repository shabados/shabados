[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋਗ ਜੁਗਤਿ; ਸੁਨਿ ਆਇਓ ਗੁਰ ਤੇ ॥"
page = 208
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The way of communion with the Lord I have heard from the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਲਕ ਨਾਲ ਮੇਲ-ਮਿਲਾਪ ਦਾ ਤਰੀਕਾ ਮੈਂ ਗੁਰਾਂ ਪਾਸੋਂ ਸੁਣ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I came to the Guru, to learn the Way of Yoga."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋਗ ਕੀ ਮ੍ਰਯਾਦਾ ਮੇਂ ਗੁਰੋਂ ਸੇ ਸੁਨ ਕਰ ਪਰਮੇਸਰ ਕੀ ਸਰਣ ਆਇਆ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਮੈਂ ਗੁਰੂ ਪਾਸੋਂ ਅਸਲ ਜੋਗ ਦਾ ਤਰੀਕਾ ਸੁਣ ਕੇ ਆਇਆ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋਗ ਜੁਗਤਿ = (ਅਸਲ) ਜੋਗ ਦਾ ਤਰੀਕਾ, ਪਰਮਾਤਮਾ ਨਾਲ ਮਿਲਾਪ ਦਾ ਢੰਗ। ਤੇ = ਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vine a la Casa del Guru para aprender el Camino del Verdadero Yoga,"