[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੰਨੈ; ਨਾਨਕ. ਭਵਹਿ ਨ ਭਿਖ ॥"
page = 3
line = 10

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "\"ਭਵਹਿ\" ਦਾ ਕਰਤਾ ਬਹੁਵਚਨ ਹੈ ਇਸ ਕਰਕੇ ਇਸ ਦੀ ਸਿਹਾਰੀ ਤੇ ਹਾਹੇ ਦਾ ਉਚਾਰਨ ਨਾਸਕੀ ਹੈ।"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The obeyer of the Lord's fiat goes not begging."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦਾ ਹੁਕਮ ਮੰਨਣ ਵਾਲਾ ਮੰਗਦਾ ਪਿੰਨਦਾ ਨਹੀਂ ਫਿਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The faithful, O Nanak, do not wander around begging."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮਨਨ ਕਰਨੇ ਹਾਰੇ ਫਿਰ (ਭਿਖ) ਚੌਰਾਸੀ ਮੇਂ ਨਹੀਂ ਭ੍ਰਮਤੇ; ਯਥਾ: \"ਜਜੈ ਜਾਨੁ ਮੰਗਤੁ ਜਨੁ ਜਾਚੈ ਲਖ ਚੌਰਾਸੀਹ ਭੀਖ ਭਵਿਆ॥\""

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਵਿਚ ਮਨ ਜੁੜਨ ਕਰ ਕੇ, ਹੇ ਨਾਨਕ! ਮਨੁੱਖ ਧਿਰ ਧਿਰ ਦੀ ਮੁਥਾਜੀ ਨਹੀਂ ਕਰਦੇ ਫਿਰਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਵਹਿ ਨ = ਨਹੀਂ ਭੌਂਦੇ। ਭਵਹਿ ਨ ਭਿਖ = ਭਿੱਖਿਆ ਲਈ ਨਹੀਂ ਭੌਂਦੇ ਫਿਰਦੇ, ਲੋੜਾਂ ਦੀ ਖ਼ਾਤਰ ਦਰ-ਦਰ ਨਹੀਂ ਰੁਲਦੇ ਫਿਰਦੇ, ਧਿਰ ਧਿਰ ਦੀ ਮੁਥਾਜੀ ਨਹੀਂ ਕਰਦੇ ਫਿਰਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los fieles, Oh Nanak, no deambulan mendigando."