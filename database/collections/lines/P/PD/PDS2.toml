[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਕੈ ਸੰਗਿ; ਤਰੈ ਸੰਸਾਰ ॥"
page = 724
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In his company, the would is saved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਸੰਗਤ ਅੰਦਰ ਜਗਤ ਪਾਰ ਉਤਰ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Associating with them, the whole world is saved."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਤੇਰੇ ਜਪਣ ਵਾਲੇ ਕੀ ਸੰਗਤਿ ਕਰਨੇ ਸੇ ਜੀਵ ਸੰਪੂਰਨ ਸੰਸਾਰ ਦੁਖ ਸੇ ਤਰ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਨੁੱਖ ਦੀ ਸੰਗਤਿ ਵਿਚ (ਰਹਿ ਕੇ) ਸਾਰਾ ਜਗਤ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਲੰਘ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸ ਕੈ = {ਲਫ਼ਜ਼ 'ਤਿਸੁ' ਦਾ (ੁ) ਸੰਬੰਧਕ 'ਕੈ' ਦੇ ਕਾਰਨ ਉੱਡਿਆ ਹੈ}। ਕੈ ਸੰਗਿ = ਦੇ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues en su compañía el mundo entero nada a través."