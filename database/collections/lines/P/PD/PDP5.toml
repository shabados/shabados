type = "primary"
data = "ਕਹਤ ਕਬੀਰ; ਸੁਨਹੁ ਮਨ ਮੇਰੇ ॥"
page = 330
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir, hear O my soul,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ, ਸੁਣ ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, listen, O my mind:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਮੇਰੇ ਮਨ! ਸਰਵਣ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ-ਹੇ ਮੇਰੇ ਮਨ! ਸੁਣ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, escucha, oh mi mente,"