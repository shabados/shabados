[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੋ ਸੇਵੀ; ਸਦਾ ਥਿਰੁ ਸਾਚਾ ॥"
page = 1049
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Serve I the One Lord, who is ever-stable and true."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਇਕ ਸੁਆਮੀ ਦੀ ਘਾਲ ਕਮਾਉਂਦਾ ਹਾਂ, ਜੋ ਸਦੀਵੀ ਸਥਿਰ ਤੇ ਸੱਚਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I serve the One Lord, who is eternal, stable and True."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤੂੰ ਏਕ ਜੋ ਸਦਾ ਥਿਰ ਪੁਨਾ ਸਾਚਾ ਹੈ, ਤਿਸੀ ਕੋ ਸੇਵ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਿਰਫ਼ ਉਸ ਪਰਮਾਤਮਾ ਦੀ ਹੀ ਸੇਵਾ-ਭਗਤੀ ਕਰਦਾ ਹਾਂ, ਜੋ ਇਕੋ ਹੀ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵੀ = ਸੇਵੀਂ, ਮੈਂ ਸੇਵਾ-ਭਗਤੀ ਕਰਦਾ ਹਾਂ। ਥਿਰੁ = ਕਾਇਮ। ਸਾਚਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sirve sólo a Tu Único Señor, Quien es Eternamente Verdad."