page = 1043
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Maru Solhe 3rd Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਰੂ ਸੋਲਹੇ ਤੀਜੀ ਪਾਤਿਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Maaroo, Solhay, Third Mehl:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਮਾਰੂ ਵਿੱਚ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਦੀ ਬਾਣੀ 'ਸੋਹਲੇ' (੧੬ ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Maru Solajas, Mejl Guru Amar Das, Tercer Canal Divino."