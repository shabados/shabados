[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਬਿ ਸ︀ਯਾਮ ਨਿਹਾਰ ਕੈ ਰਾਮ ਕੀ ਓਰਿ ਧਵਾਇ ਤਹਾ ਰਥੁ ਜਾਇ ਪਰਿਯੋ ॥"
page = 410

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The poet says that seeing towards Balram, he caused his chariot to run towards him and then fell upon him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਵੀ ਸ਼ਿਆਮ (ਕਹਿੰਦੇ ਹਨ) ਬਲਰਾਮ ਵਲ ਵੇਖ ਕੇ ਰਥ ਨੂੰ ਭਜਾ ਕੇ ਉਥੇ ਜਾ ਪਿਆ।"