[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਉਪਦੇਸੁ; ਮਨੈ ਮਹਿ ਲੇਹੁ ॥"
page = 178
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Keep Guru 's instruction in thy mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "੍ਰਗੁਰਾਂ ਦੀ ਸਿਖਮਤ ਨੂੰ ਆਪਣੇ ਚਿੱਤ ਅੰਦਰ ਟਿਕਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Keep the Guru's Teachings in your mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਸੁਖ ਮੇਂ ਸਚਾ ਸੁਖ ਦੇਣੇ ਵਾਲਾ ਏਹੀ ਜਤਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹੀ ਹੈ ਸਾਰੇ ਸੁਖਾਂ ਤੋਂ ਸ੍ਰੇਸ਼ਟ ਸੁਖ, ਤੇ, ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਸੁਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el que conservemos la Palabra del Shabd del Guru en nuestra mente."