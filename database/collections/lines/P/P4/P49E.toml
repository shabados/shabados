[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਮ੍ਰਿਤ ਨਾਮੁ ਕ੍ਰਿਪਾ ਕਰਿ ਦੀਜੈ; ਗੁਰਿ ਗਿਆਨ ਰਤਨੁ ਦੀਪਾਇਆ ॥੬॥"
page = 1039
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Mercifully bless Thou me with Thy ambrosial Name and the jewel of the lamp of the Guru's gnosis."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿਹਰ ਧਾਰ ਕੇ ਤੂੰ ਮੂੈਨੂੰ ਆਪਣਾ ਅੰਮ੍ਰਿਤਮਈ ਨਾਮ ਅਤੇ ਗੁਰਾਂ ਦੇ ਬ੍ਰਹਮਬੋਧ ਦੇ ਦੀਵੇ ਦਾ ਜਵੇਹਰ ਪ੍ਰਦਾਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please be merciful and bless me with Your Ambrosial Naam, and the jewel, the lamp of the Guru's spiritual wisdom. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਅੰਮ੍ਰਿਤ ਕ੍ਰਿਪਾ ਕਰਿ ਕੇ ਹਮ ਕੋ ਦੇਹੁ। ਜਿਨ ਕੋ ਨਾਮ ਦੀਆ ਹੈ, ਤਿਨ ਕੋ ਸਤਿਗੁਰੋਂ ਨੇ ਗਿਆਨ ਰਤਨ (ਦੀਪਾਇਆ) ਪ੍ਰਕਾਸਿਆ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਰਪਾ ਕਰ ਕੇ ਸਾਨੂੰ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਆਪਣਾ ਨਾਮ ਦੇਹ। (ਜਿਸ ਉਤੇ ਤੂੰ ਕਿਰਪਾ ਕਰਦਾ ਹੈਂ) ਗੁਰੂ ਨੇ ਉਸ ਦੇ ਅੰਦਰ ਤੇਰੇ ਗਿਆਨ ਦਾ ਰਤਨ ਰੌਸ਼ਨ ਕਰ ਦਿੱਤਾ ਹੈ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ। ਦੀਪਾਇਆ = ਰੌਸ਼ਨ ਕੀਤਾ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por Misericordia bendíceme con el Naam Ambrosial y con la Joya, que la lámpara de la Sabiduría del Guru ilumine mi mente.(6)"