[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਿਨ ਅੰਗ ਪ੍ਰਭਾ ਕਬਿ ਦੇਤ ਸਭੈ; ਸੋਊ ਅੰਗ ਧਰੇ ਤ੍ਰਿਯ ਰਾਜ ਛਜੈ ॥"
page = 348

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Her limbs make her appear as the sovereign of women"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਦੀ ਕਵੀ ਲੋਕ ਅੰਗਾਂ ਲਈ ਉਪਮਾ ਦਿੰਦੇ ਹਨ, (ਉਹ) ਸਾਰੇ ਅੰਗ ਲੈ ਕੇ ਰਾਧਾ ('ਤ੍ਰਿਯ ਰਾਜ') ਫਬ ਰਹੀ ਹੈ।"