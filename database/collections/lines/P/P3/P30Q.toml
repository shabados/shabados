data = "(ਉਸ ਉਤੇ ਮੋਹਿਤ ਹੋ ਕੇ) ਚਿਤ ਦਾ ਗ਼ਮ ਦੂਰ ਕਰ ਦਿੱਤਾ ॥੨੪੩੩॥"