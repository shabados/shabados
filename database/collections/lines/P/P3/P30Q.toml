data = "ਚਿਤ ਕੋ ਸੋਕ ਦੂਰਿ ਕਰਿ ਡਾਰਿਯੋ ॥੨੪੩੩॥"
page = 545

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There he saw the charming Subhadra, which removed the gried of his mind.2433."

