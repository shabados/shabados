[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖ ਲਾਗੇ ਦੂਜੈ ਭਾਏ ॥"
page = 1065
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The egocentric are attached to another's love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਨਮੱਤੀਏ ਹੋਰਸ ਦੀ ਪ੍ਰੀਤ ਨਾਲ ਜੁੜੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The self-willed manmukhs are attached to the love of duality."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਮਨਮੁਖ ਦੂਜੈ ਭਾਇ ਮੇਂ ਲਾਗੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ ਉਹ ਬੰਦੇ ਮਾਇਆ ਦੇ ਪਿਆਰ ਵਿਚ ਹੀ ਲੱਗੇ ਰਹੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਮੁਖ = ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ। ਦੂਜੈ ਭਾਏ = ਦੂਜੈ ਭਾਇ, ਮਾਇਆ ਦੇ ਪਿਆਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si desperdician ese mérito? Ellos no aman a Dios,"