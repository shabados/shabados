[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਕੈ ਹਿਰਦੈ; ਰਵਿਆ ਸੋਇ ॥"
page = 236
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He the Lord abides with his mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਹਿਬ ਉਸ ਦੇ ਮਨ ਅੰਦਰ ਵਸਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord dwells within their hearts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰੁ ਤਿਸ ਕੇ ਹਿਰਦੇ ਮੇਂ ਪਰਮਾਤਮਾਂ ਰਵਿਆ, ਭਾਵ ਸਾਖ੍ਯਾਤ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਫਿਰ) ਉਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਉਹ ਪਰਮਾਤਮਾ ਆ ਵੱਸਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਿਰਦੈ = ਹਿਰਦੇ ਵਿਚ। ਸੋਇ = ਉਹ ਪਰਮਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "recibe al Señor en su corazón,"