[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਫਿਰਿ ਫਿਰਿ ਫਾਹੀ ਫਾਸੈ ਕਊਆ ॥"
page = 935
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Again and again, the crow falls into the net."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁੜ ਮੁੜ ਕੇ ਕਾਂ ਜਾਲ ਵਿੱਚ ਫਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Again and again, the crow falls into the trap."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਜੀਉ ਰੂਪ ਕਊਆ ਫਿਰ ਫਿਰ ਕੇ ਜਮ ਕੀ ਫਾਸੀ ਮੇਂ ਹੀ ਫਸਤਾ ਹੈ ਤਬ ਜਮ ਕੀ ਤਾੜਨਾ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਾਲੀਆਂ ਕਰਤੂਤਾਂ ਵਾਲਾ ਮਨੁੱਖ ਮੁੜ ਮੁੜ ਫਾਹੀ ਵਿਚ ਫਸਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਊਆ = ਮੂਰਖ, ਕਾਲੀਆਂ ਕਰਤੂਤਾਂ ਵਾਲਾ ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con una mente mediocre el hombre es atrapado una y otra vez y luego se lamenta,"