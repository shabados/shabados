[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਭਉ ਨਿਰੰਕਾਰ ਦਾਤਾਰੁ ॥"
page = 893
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Fearless, Formless and Bounteous is the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਡਰ-ਰਹਿਤ, ਸਰੂਪ ਰਹਿਤ ਅਤੇ ਦਰਿਆ-ਦਿਲ ਹੈ ਸੁਆਮੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is fearless and formless; He is the Great Giver."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਿਰੰਕਾਰ ਜੋ ਦਾਤਾ ਹੈਂ ਵਹੀ ਤੇਰੇ ਕੋ ਨਿਰਭਉ ਕਰਨਹਾਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਪਰਮਾਤਮਾ ਸਭ ਦਾਤਾਂ ਦੇਣ ਵਾਲਾ ਹੈ, ਜਿਸ ਨੂੰ ਕਿਸੇ ਦਾ ਡਰ-ਭਉ ਨਹੀਂ ਹੈ, ਜੋ ਸਰੀਰਾਂ ਦੀ ਕੈਦ ਤੋਂ ਪਰੇ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él no tiene Forma, ni miedo, es el Gran Dador,"