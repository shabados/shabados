[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਨ ਸਮੂਹ ਚਲਾਇ ਦਏ; ਕਿਲਕਾਰ ਉਠਿਓ ਜੁ ਪ੍ਰਲੈ ਘਨ ਮਾਨੋ ॥੧੭੯॥"
page = 94

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Still he shot all his arrows and thundered like the coulds of doomsday.179.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਫਿਰ ਵੀ ਉਸ ਨੇ) ਸਾਰੇ ਬਾਣ ਚਲਾ ਦਿੱਤੇ ਅਤੇ (ਇਸ ਤਰ੍ਹਾਂ) ਚੀਖ਼ ਉਠਿਆ ਮਾਨੋ ਪਰਲੋ ਵੇਲੇ ਦੇ ਬਦਲ (ਗਜਦੇ ਹੋਣ) ॥੧੭੯॥"