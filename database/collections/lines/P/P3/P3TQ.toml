[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਸੁਕਬਿ, ਸੁ ਧਾਰ ॥੫੦੯॥"
page = 740

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Kavchantkani” in the beginning and then adding “Ripu Ari”, the names of tupak are formed, which O wise men! You may recognize.509."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤੁਪਕ ਦਾ ਨਾਮ ਹੋ ਜਾਏਗਾ। ਕਵੀਓ! ਵਿਚਾਰ ਲਵੋ ॥੫੦੯॥"