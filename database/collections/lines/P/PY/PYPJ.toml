[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਅੰਕਾਰਿ; ਬੇਦ ਨਿਰਮਏ ॥"
page = 929
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It is the Lord who created the Vedas."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਪ੍ਰਭੂ ਨੇ ਹੀ ਵੇਦ ਰਹੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Ongkaar created the Vedas."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਓਅੰਕਾਰ ਪ੍ਰਮਾਤਮਾਂ ਤੇ ਬੇਦ (ਨਿਰਮਏ) ਉਤਪਤ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵੇਦ ਭੀ ਓਅੰਕਾਰ ਤੋਂ ਹੀ ਬਣੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੇਦ = ਵੇਦ ਆਦਿਕ ਧਰਮ = ਪੁਸਤਕ। ਨਿਰਮਏ = ਬਣੇ, ਪਰਗਟ ਹੋਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ong Kar creó los Vedas."