[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧ ਸਰਣਿ; ਨਾਨਕ. ਤੇ ਆਏ ॥੭॥"
page = 296
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "have O Nanak entered the saints sanctuary."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਹੇ ਨਾਨਕ! ਸਾਧੂਆਂ ਦੀ ਸ਼ਰਣਾਗਤ ਸੰਭਾਲਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, enter the Sanctuary of the Saints. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਸੋ ਇਸ ਬਾਣੀ ਕੇ ਪਾਠਕ ਸੰਤ ਕੀ ਸ਼ਰਣ ਮੇਂ ਆਏ ਹੈਂ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਹੇ ਨਾਨਕ! ਉਹ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਣ ਆਉਂਦੇ ਹਨ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh, dice Nanak, entran al Santuario de los Santos.  (7)"