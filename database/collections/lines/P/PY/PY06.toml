[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਝ ਬਿਨੁ; ਦੂਜਾ ਨਾਹੀ ਕੋਇ ॥"
page = 351
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without thee, is not any other"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਬਗੈਰ ਹੋਰ ਕੋਈ ਦੂਸਰਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without You, there is no other at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਬਿਨਾਂ ਦੂਸਰਾ ਕੋਈ ਕਰਤਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੈਥੋਂ ਬਿਨਾ ਹੋਰ ਕੋਈ ਨਹੀਂ (ਜੋ ਸਾਨੂੰ ਅਕਲ ਦੇ ਸਕੇ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues sin Ti, no hay ningún otro."