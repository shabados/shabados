[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇਈ ਭਗਤ; ਜੋ ਤੁਧੁ ਭਾਣੇ ॥"
page = 1270
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They alone are the saints, who are pleasing to Thee,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਸੰਤ ਹਨ, ਜੋ ਤੈਨੂੰ ਚੰਗੇ ਲਗਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They alone are devotees, who are pleasing to Your Will."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੇਰੇ ਕੋ ਭਾਣੇ ਹੈਂ ਸੇਈ ਭਗਤ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਉਹੀ ਮਨੁੱਖ ਤੇਰੇ (ਅਸਲ) ਭਗਤ ਹਨ ਜਿਹੜੇ ਤੈਨੂੰ ਚੰਗੇ ਲੱਗਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਈ = ਉਹ (ਮਨੁੱਖ) ਹੀ (ਬਹੁ-ਵਚਨ)। ਤੁਧੁ = ਤੈਨੂੰ। ਭਾਣੇ = ਚੰਗੇ ਲੱਗਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tus Devotos sólo son quienes complacen Tu Voluntad."