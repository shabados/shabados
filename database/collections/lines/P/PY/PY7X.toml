[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕਾ ਦਰਸੁ; ਪੂਰਨ ਇਸਨਾਨੁ ॥"
page = 189
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Saints sight is the perfect ablution."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਦਾ ਦੀਦਾਰ ਪੂਰਾ ਮੱਜਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Blessed Vision of the Saints is the perfect cleansing bath."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸੰਤ ਜਨੋਂ ਕਾ ਜੋ ਦਰਸ਼ਨ ਹੈ, ਸੋਈ ਪੂਰਨ ਸਨਾਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਗੁਰੂ-ਸੰਤ ਦਾ ਦਰਸਨ (ਹੀ) ਮੁਕੰਮਲ (ਤੀਰਥ-) ਇਸ਼ਨਾਨ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Visión del Santo es el perfecto baño de ablución;"