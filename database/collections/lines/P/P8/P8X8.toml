[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਿਉ ਬ੍ਰਿਜ ਨਾਇਕ ਸਾਧਨ ਕੇ; ਪੁਨਿ ਚਾਹਤ ਹੈ ਸਭ ਪਾਪਨ ਟਾਰਿਓ ॥੨੪੮੧॥"
page = 550

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The way in which the army of Jarasandh was churned and his pride was shattered, in the same way, Krishna wants to finish all the sins of those women.2481."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸੇ ਤਰ੍ਹਾਂ ਫਿਰ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਸੰਤਾਂ (ਭਗਤਾਂ) ਦੇ ਸਾਰਿਆਂ ਪਾਪਾਂ ਨੂੰ ਖ਼ਤਮ ਕਰ ਦੇਣਾ ਚਾਹੁੰਦੇ ਹਨ ॥੨੪੮੧॥"