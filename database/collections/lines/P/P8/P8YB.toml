[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਬ ਅਰਜੁਨ ਕੋ ਸੰਗ ਲੈ; ਇਕ ਦਿਨ ਚੜੇ ਸਿਕਾਰ ॥੨੦੮੭॥"
page = 506

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After staying for four months in Indraprastha, one day Krishna went to hunting alongwith Arjuna.2087."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਇਕ ਦਿਨ ਅਰਜਨ ਨੂੰ ਲੈ ਕੇ ਸ਼ਿਕਾਰ ਚੜ੍ਹੇ ॥੨੦੮੭॥"