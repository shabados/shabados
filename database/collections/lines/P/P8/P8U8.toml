[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੰਗਲਾ ਹਰਿ ਮੰਗਲਾ ॥"
page = 695
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hail, to Thee, O God, hail;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹ ਵਾਹ! ਹੇ ਵਾਹਿਗੁਰੂ ਤੈਨੂੰ ਵਾਹ ਵਾਹ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Hail to You, Lord, hail to You!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਰਬ ਕੇ ਰਾਜਾ ਰਾਮ! ਆਪ ਕਾ ਮਨ ਤਨ ਬਾਣੀ ਕਰ ਕੇ ਨਿਤ ਹਰ ਪ੍ਰਕਾਰ ਸੇ ਮੰਗਲ ਕਰਤਾ ਹੂੰ ਅਰਥਾਤ ਜਸ ਕਰਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਹੇ ਰਾਜਨ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਗਲੁ = ਆਨੰਦ, ਸੁਖਦਾਈ ਸੁਲੱਖਣੀ ਮਰਯਾਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo recito las Melodías de Dicha del Señor,"