[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਹਿਰਦੈ ਨਾਮੁ ਵਸਾਏ ॥੪॥੬॥"
page = 1129
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and enshrines the Name in his mind, O Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਨਾਮ ਨੂੰ ਉਸ ਦੇ ਦਿਲ ਅੰਦਰ ਟਿਕਾ ਦਿੰਦਾ ਹੇ, ਹੇ ਨਾਨਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Naam is enshrined within the heart. ||4||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਫਿਰ ਸਤਿਗੁਰੂ ਸਿਖ ਦੇ ਹਿਰਦੇ ਮੇਂ ਨਾਮ ਵਸਾਵਤੇ ਹੈ॥੪॥੬॥☬ਪੁਨ: ਨਾਮ ਕੀ ਮਹਮਾ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹ ਮਨੁੱਖ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਵਸਾਂਦਾ ਹੈ ॥੪॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕ = ਹੇ ਨਾਨਕ! ਹਿਰਦੈ = ਹਿਰਦੇ ਵਿਚ ॥੪॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así alabamos el Nombre del Señor en nuestro corazón. (4-6)"