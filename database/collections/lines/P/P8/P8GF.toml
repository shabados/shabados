[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਹਾ ਤੇਜ ਤੇਜੰ ਮਹਾ ਜ੍ਵਾਲ ਜ੍ਵਾਲੰ ॥"
page = 40

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is the Most Effulgent of all lights and Supreme Conflagration of all fires"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ) ਤੇਜਾਂ ਵਿਚ ਮਹਾਤੇਜ ਅਤੇ ਅਗਨੀਆਂ ਵਿਚ ਮਹਾ ਅਗਨੀ ਹੈ।"