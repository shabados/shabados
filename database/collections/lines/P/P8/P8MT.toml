[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ. ਨਾ ਛੋਡਉ; ਕੰਤ ਪਾਸਰਾ ॥"
page = 761
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I shall leave not my Spouse's side."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਪਤੀ ਦਾ ਪਾਸਾ ਨਹੀਂ ਛੱਡਾਂਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I shall never leave my Husband Lord's side."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਕੰਤ! ਮੈਂ ਤੇਰਾ (ਪਾਸਰਾ) ਅਸਥਾਨ ਵਾ ਪਾਸਾ ਨਹੀਂ ਛੋਡਤੀ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਖਸਮ-ਪ੍ਰਭੂ ਦਾ ਸੋਹਣਾ ਪਾਸਾ (ਕਦੇ ਭੀ) ਨਾਹ ਛੱਡਾਂਗੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਮੈਂ। ਨਾ ਛੋਡਉ = ਨ ਛੋਡਉਂ, ਮੈਂ ਨਹੀਂ ਛੱਡਦੀ। ਪਾਸਰਾ = ਸੋਹਣਾ ਪਾਸਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Siempre estaré del lado de mi Señor, pues Él es mi Amante,"