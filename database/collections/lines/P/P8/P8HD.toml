[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ ਕਾ ਮਹਲੁ ਵਿਰਲਾ ਜਾਣੈ; ਸਦਾ ਰਹੈ ਕਰ ਜੋੜਿ ॥"
page = 314
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some rare one knows Guru's court and who knows it ever stands with clasped hands."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਟਾਵਾਂ ਹੀ ਗੁਰਾਂ ਦੇ ਦਰਬਾਰ ਨੂੰ ਜਾਣਦਾ ਹੈ ਤੇ ਜੋ ਜਾਣਦਾ ਹੈ ਤੇ ਜੋ ਜਾਣਦਾ ਹੈ, ਉਹ ਹਮੇਸ਼ਾਂ ਹੱਥ ਬੰਨ੍ਹ ਕੇ ਖੜਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How rare are those who know the Mansion of the True Guru; they stand with their palms pressed together."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਕੇ ਸਤਸੰਗ ਵਾ ਅਭਿਪਰਾਇ ਕੋ ਕੋਈ ਵਿਰਲਾ ਹੀ ਜਾਨਤਾ ਹੈ, ਜੋ ਸਦਾ ਹਾਥ ਜੋੜ ਕਰ ਸਨਮੁਖ ਰਹੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਦੇ ਟਿਕਾਣੇ ਦੀ (ਭਾਵ, ਸਤਸੰਗ ਦੀ) ਕਿਸੇ ਉਸ ਵਿਰਲੇ ਨੂੰ ਸਾਰ ਆਉਂਦੀ ਹੈ ਜੋ ਸਦਾ ਹੱਥ ਜੋੜੀ ਰੱਖੇ (ਭਾਵ, ਮਨ ਨੀਵਾਂ ਰੱਖ ਕੇ ਯਾਦ ਵਿਚ ਜੁੜਿਆ ਰਹੇ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰ = ਹੱਥ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Excepcional es quien atiende siempre con Reverencia al Verdadero Guru y llega a conocer Su Recinto."