[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਘਾਇਲ ਘੂਮ ਪਰੇ ਤਿਹ ਇਉ; ਉਪਮਾ ਮਨ ਮੈ ਕਵਿ ਯੌ ਅਨੁਸਾਰੇ ॥"
page = 89

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The wounded revolve and like this according to the imagination of the poet.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਖ਼ਮੀ ਭੁਆਟੜੀ ਖਾ ਕੇ ਉਥੇ ਇਸ ਤਰ੍ਹਾਂ ਡਿਗੇ ਹੋਏ ਹਨ, (ਉਨ੍ਹਾਂ ਉਤੇ) ਕਵੀ ਮਨ ਵਿਚ ਇੰਜ ਉਪਮਾ ਢੁਕਾਉਂਦਾ ਹੈ,"