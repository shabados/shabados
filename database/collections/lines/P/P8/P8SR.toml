[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਂਤਿ ਸਹਜ; ਸੁਖ ਕੇ ਸਭਿ ਹਾਟ ॥"
page = 430
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With peace, poise and happiness are filled all the ships."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਠੰਢ-ਚੈਨ, ਅਡੋਲਤਾ ਅਤੇ ਪ੍ਰਸੰਨਤਾ ਨਾਲ ਸਾਰੀਆਂ ਹੱਟੀਆਂ ਭਰੀਆਂ ਹੋਈਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With intuitive peace and happiness, all the shops are filled."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸ਼ਾਂਤੀ ਔਰ ਆਤਮਾ ਸੁਖ ਕਰ ਕੇ (ਸਭ ਹਾਟ) ਸਭ ਇੰਦ੍ਰੈ ਰੂਪ ਦੁਕਾਨ ਪੂਰਨ ਹੂਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਦੇ ਸਾਰੇ ਹੱਟ (ਸਾਰੇ ਗਿਆਨ-ਇੰਦ੍ਰੇ) ਸ਼ਾਂਤੀ, ਆਤਮਕ ਅਡੋਲਤਾ, ਤੇ ਆਤਮਕ ਆਨੰਦ ਦੇ ਹੱਟ ਬਣ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜ = ਆਤਮਕ ਅਡੋਲਤਾ। ਸਭਿ ਹਾਟ = ਸਾਰੇ ਹੱਟ, ਸਾਰੇ ਗਿਆਨ-ਇੰਦ੍ਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Paz y Equidad llenaron las tiendas del pueblo"