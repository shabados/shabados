[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਦਰਗਹਿ. ਗੁਰ ਸਬਦਿ ਸਿਞਾਪੈ ॥"
page = 1418
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru's word he is known in the Lord's Court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਬਾਣੀ ਰਾਹੀਂ, ਉਹ ਪ੍ਰਭੂ ਦੇ ਦਰਬਾਰ ਅੰਦਰ ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Word of the Guru's Shabad, he is recognized in the Court of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਸਬਦ ਕਰ ਕੇ ਅੰਤਸਕਰਨ ਰੂਪੀ (ਗਹਿ) ਜਗਹ ਦੇ (ਦਰ) ਅੰਤਰ ਹਰੀ ਕੋ ਪਛਾਣੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਬਰਕਤਿ ਨਾਲ (ਮਨੁੱਖ) ਪਰਮਾਤਮਾ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ (ਭੀ) ਸਤਕਾਰ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਞਾਪੈ = ਪਛਾਣਿਆ ਜਾਂਦਾ ਹੈ, ਸਤਕਾਰ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mediante la Palabra del Shabd del Guru,"