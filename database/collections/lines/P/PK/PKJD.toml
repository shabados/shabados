[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋਤ ਹੈ ਨਾਮ ਕਮੰਦ ਕੇ; ਚੀਨ ਚਤੁਰ ਚਿਤਿ ਲੇਹੁ ॥੨੮੨॥"
page = 730

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the letter “K” and then adding the word “Mand”, the name “Kamand” is rcognised.282."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਹ ਨਾਮ ਪਾਸ (ਕਮੰਦ) ਦੇ ਹੋ ਜਾਂਦੇ ਹਨ। ਚਤੁਰ ਲੋਗ ਮਨ ਵਿਚ ਵਿਚਾਰ ਲੈਣ ॥੨੮੨॥"