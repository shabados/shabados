[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ. ਅਪੁਨਾ ਦਾਸੁ ਕੀਨੋ; ਕਾਟੇ ਮਾਇਆ ਫਾਧਿਓ ॥"
page = 530
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Showing mercy, the Lord has made me His slave, and has shattered the mammon's shackles."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿਹਰ ਧਾਰ ਕੇ ਸਾਈਂ ਨੇ ਮੈਨੂੰ ਆਪਣਾ ਗੁਮਾਸ਼ਤਾ ਬਣਾ ਲਿਆ ਹੈ ਅਤੇ ਮੋਹਨੀ ਦੀ ਬੇੜੀਆਂ ਕੱਟ ਛੱਡੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Showing His Mercy, the Lord has made me His slave, and shattered the bonds of Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸ੍ਵਰ ਨੇ ਕਿਰਪਾ ਕਰ ਕੇ ਮੇਰੇ ਕੋ ਅਪਨਾ ਦਾਸ ਕੀਆ ਹੈ ਔਰ ਮਾਇਆ ਕੇ ਫਾਂਧੇ, ਭਾਵ ਬੰਧਨੋਂ ਕੋ ਕਾਟਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਪਰਮਾਤਮਾ ਨੇ ਕਿਰਪਾ ਕਰ ਕੇ ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਆਪਣਾ ਦਾਸ ਬਣਾ ਲਿਆ, ਉਸ ਦੇ ਮਾਇਆ ਦੇ ਮੋਹ ਵਾਲੇ ਬੰਧਨ ਕੱਟ ਦਿੱਤੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ। ਕੀਨੋ = ਬਣਾ ਲਿਆ। ਫਾਧਿਓ = ਫਾਹੀਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor en Su Misericordia, te va a volver Su Esclavo; así cortará todas tus ligas y amarras con Maya"