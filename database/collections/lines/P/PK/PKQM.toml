[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਾ ਕੀਆ; ਸਭੁ ਕਿਛੁ ਹੋਇ ॥"
page = 1152
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, by whose doing every thing is done;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਜਿਸ ਦੇ ਕਰਨ ਦੁਆਰਾ ਸਭ ਕੁਝ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everything is done by Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰਮੇਸ੍ਵਰ ਕਾ ਕੀਆ ਹੂਆ ਸਭ ਕਿਛੁ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ ਵਿਚ) ਜਿਸ (ਪਰਮਾਤਮਾ) ਦਾ ਕੀਤਾ ਹੀ ਹਰੇਕ ਕੰਮ ਹੋ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕਾ = ਜਿਸ (ਪਰਮਾਤਮਾ) ਦਾ। ਸਭੁ ਕਿਛੁ = ਹਰੇਕ ਕੰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, Quien lo puede hacer todo y cada cosa,"