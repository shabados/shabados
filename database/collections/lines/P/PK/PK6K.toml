[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੈਸੇ ਉਧਾਰਨ; ਗੁਰਹ ਪੀਰ ॥੧॥"
page = 1181
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "so does the supreme Guru emancipate his Sikh."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਏਸੇ ਤਰ੍ਹਾਂ ਹੀ ਮੁਖੀ ਗੁਰਦੇਵ ਆਪਣੇ ਸਿੱਖ ਨੂੰ ਤਾਰ ਦਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "we are saved by the Guru. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੈਸੇ ਹੀ ਸੰਸਾਰ ਸਮੁੰਦ੍ਰ ਸੇ ਗੁਰੂ ਔਰ ਪੀਰ ਬਚਾਇ ਲੇਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਿਵੇਂ ਗੁਰੂ-ਪੀਰ (ਜੀਵਾਂ ਨੂੰ) ਪਾਰ ਉਤਾਰਨ ਲਈ ਆਸਰਾ ਹੁੰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਹ ਪੀਰ = ਗੁਰੂ-ਪੀਰ। ਉਧਾਰਨ = ਪਾਰ-ਉਤਾਰੇ ਲਈ ਆਸਰਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así los Devotos se apoyan en el Guru para su Liberación. (1)"