[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮਸਕਾਰ ਜੋ ਨ ਕਰੋ; ਮੋਹਿ ਦੁਹਾਈ ਤੋਹਿ ॥੨੫੮॥"
page = 317

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "If youdo not bow before me, then I swear against you.”258."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਨਮਸਕਾਰ ਨਹੀਂ ਕਰੋਗੀਆਂ ਤਾਂ ਮੈਨੂੰ ਤੁਹਾਡੀ ਹੀ ਸੌਂਹ ਲਗੇ (ਕਪੜੇ ਨਹੀਂ ਦੇਵਾਂਗਾ) ॥੨੫੮॥"