[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਲਾ ਗੰਢੁ; ਨਦੀਆ ਮੀਹ ਝੋਲ ॥"
page = 143
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Relief from famine is attained if it rains and the stream be overflowing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਹਿਰ ਤੋਂ ਛੁਟਕਾਰਾ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦਾ ਹੈ ਜੇਕਰ ਬਾਰਸ਼ ਹੋਵੇ ਅਤੇ ਨਦੀਆਂ ਨਾਲੇ ਛੱਲਾਂ ਮਾਰਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the famine, the rain fills the streams to overflowing, and the bond is established."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਕਾਲਾ) ਦੁਕਾਲ ਕਰ ਟੂਟੇ ਹੂਏ ਜੀਵੋਂ ਕਾ ਗੰਢ ਤੌ ਪੜਤਾ ਹੈ ਜੇ ਕਰ (ਮੀਹ) ਅਤੀ ਵਰਖਾ ਹੋਵੈ ਔਰ ਨਦੀਆਂ (ਝੋਲ) ਉਛਲ ਕਰ ਚਲੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਾਲਾਂ ਨੂੰ ਗੰਢ ਪੈਂਦੀ ਹੈ (ਭਾਵ, ਕਾਲ ਮੁੱਕ ਜਾਂਦੇ ਹਨ) ਜੇ ਬਹੁਤੇ ਮੀਂਹ ਪੈ ਕੇ ਨਦੀਆਂ ਚੱਲਣ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਲ੍ਹ੍ਹਾ ਗੰਢੁ = ਕਾਲਾਂ ਦਾ ਖ਼ਾਤਮਾ। ਝੋਲ = ਬਹੁਤ ਮੀਂਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La sequía se va si llueve bien y los arroyos se cargan de agua."