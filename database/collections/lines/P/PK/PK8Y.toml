[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਰਮਤ; ਹਰਿ ਹਰਿ ਸੁਖੁ ਪਾਇਆ ॥"
page = 1348
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meditating on the All pervading Lord God's Name, I have obtained peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਆਪਕ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਨ ਦੁਆਰਾ ਮੈਨੂੰ ਆਰਾਮ ਪਰਾਪਤ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Dwelling on the Lord, Har, Har, I have found peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਤੇਰੇ (ਰਾਮ) ਵਿਆਪਕ ਸਰੂਪ ਕੋ (ਰਮਤ) ਜਪਤਿਆਂ ਹੋਇਆਂ ਹਮਨੇ ਹਰ ਪ੍ਰਕਾਰ ਕਾ ਸੁਖ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਉਸ ਮਨੁੱਖ ਨੇ ਸਦਾ ਤੇਰਾ ਹਰਿ-ਨਾਮ ਸਿਮਰਦਿਆਂ ਆਤਮਕ ਆਨੰਦ ਮਾਣਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਮਤ = ਸਿਮਰਦਿਆਂ। ਸੁਖੁ = ਆਤਮਕ ਆਨੰਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Habitando en el Señor, Jar, Jar, he encontrado la Paz,"