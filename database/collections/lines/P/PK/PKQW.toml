[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੁਰਾਨ ਕਤੇਬ ਤੇ ਪਾਕੁ ॥੩॥"
page = 897
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and more sacred than the Quran and other Semitic texts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕੁਰਾਨ ਤੇ ਹੋਰ ਯਹੂਦੀਆਂ ਆਦਿ ਦੀਆਂ ਧਾਰਮਕ ਗ੍ਰੰਥਾਂ ਨਾਲੋਂ ਪਵਿੱਤਰ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "more sacred than the Koran and the Bible. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਕੁਰਾਨਾਦਿ ਜੋ ਕਿਤਾਬਾਂ ਹੈਂ ਤਿਨ ਕੇ ਤੂੰ ਜਾਨੀਤਾ ਹੈਂ ਵਾ ਇਨਤੇ ਪਰੇ ਹੈਂ ਅਰ ਪਵਿਤ੍ਰ ਸਰੂਪ ਹੈਂ, ਐਸੇ ਕਹਤੇ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੌਲਾ ਕੁਰਾਨ ਅਤੇ ਹੋਰ ਪੱਛਮੀ ਧਾਰਮਿਕ ਪੁਸਤਕਾਂ ਦੇ ਦੱਸੇ ਸਰੂਪ ਤੋਂ ਵੱਖਰਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ। ਪਾਕੁ = (ਭਾਵ, ਵੱਖਰਾ)।੩। (ਨੋਟ: ਲਫ਼ਜ਼ 'ਹਾਕੁ' ਪੁਲਿੰਗ ਇਕ-ਵਚਨ ਹੈ। ਲਫ਼ਜ਼ 'ਹਾਕ' ਇਸਤ੍ਰੀ-ਲਿੰਗ, ਜਿਸ ਦਾ ਅਰਥ ਹੈ 'ਆਵਾਜ਼'। ਜਿਵੇਂ 'ਜਰਾ ਹਾਕ ਦੀ ਸਭ ਮਤਿ ਥਾਕੀ ਏਕ ਨ ਥਾਕਸਿ ਮਾਇਆ') ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "desde el interior, Tú hablas de manera más Sagrada que en el Corán o la Biblia.(3)"