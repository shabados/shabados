[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਹਿ ਸਸਤ੍ਰ ਸਬੈ ਰਸ ਰੁਦ੍ਰ ਮਚੇ ॥"
page = 179

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Both the demons and gods became absorbed in the war and bedecking themselves with weapons all the warriors enjoyed the relish of anger."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ਸਤ੍ਰ ਫੜ ਕੇ ਸਾਰੇ ਯੁੱਧ ਕਰਮ ਵਿਚ ਮਸਤ ਹੋ ਗਏ।"