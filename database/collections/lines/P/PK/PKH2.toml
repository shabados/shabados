[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਬਾ; ਅਬ. ਨ ਬਸਉ ਇਹ ਗਾਉ ॥"
page = 1104
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Father, I shall abide not in this village now."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਿਤਾ! ਮੈਂ ਹੁਣ ਇਸ ਪਿੰਡ ਵਿੱਚ ਨਹੀਂ ਰਹਿਣਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O father, now I shall not live in this village."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਬਾਬਾ) ਹੇ ਭਾਈ! ਮੈਂ ਇਸ ਸਰੀਰ ਗਾਉਂ ਵਿਖੇ ਅਬ ਨਹੀਂ ਬਸੂੰਗਾ, ਭਾਵ ਦੇਹ ਸਬੰਧ ਕੀ ਇਛਾ ਮੇਰੀ ਉਠ ਗਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਾਬਾ! ਹੁਣ ਮੈਂ ਇਸ ਪਿੰਡ ਵਿਚ ਨਹੀਂ ਵੱਸਣਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਬਸਉ = ਨ ਬਸਉਂ, ਮੈਂ ਨਹੀਂ ਵੱਸਾਂਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh amigo, en verdad no me gustaría estar en esa villa, cuando mi conciencia,"