[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਆਪੇ ਦੇਵੈ ਸੋਈ ॥੧॥"
page = 599
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "when He, the Lord Himself bestows it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਹ ਸੁਆਮੀ ਖੁਦ ਇਸ ਨੂੰ ਬਖਸ਼ਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Are obtained when He Himself gives them. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸੋ ਅਕਾਲ ਪੁਰਖੁ ਆਪ ਹੀ ਕ੍ਰਿਪਾ ਕਰ ਦੇਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਉਹ ਪ੍ਰਭੂ ਆਪ ਹੀ ਦੇਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਈ = ਉਹ ਪ੍ਰਭੂ ਹੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "podemos lograr el Fruto de cantar la Alabanza del Señor. (1)"