[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਸਿਮਰਤ; ਕਛੁ. ਨਾਹਿ ਫੇਰ ॥੧॥"
page = 1183
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Dwelling on God, transmigration ends."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਦਾ ਚਿੰਤਨ ਕਰਨ ਦੁਆਰਾ ਆਵਾਗਊਣ, ਮੁੱਕ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating in remembrance on the Lord, the cycle of reincarnation comes to an end. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੋ ਸਿਮਰਤੇ ਹੂਏ ਕੁਛ ਫੇਰ ਨਹੀਂ ਹੋਤਾ ਹੈ, ਭਾਵ ਸੇ ਜੂਨੀਓਂ ਮੇਂ ਨਹੀਂ ਪੜਤਾ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰਿ-ਨਾਮ ਸਿਮਰਦਿਆਂ ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਨਹੀਂ ਰਹਿ ਜਾਂਦੇ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫੇਰ = ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, alabando a Dios, uno ya no va ni viene. (1)"