type = "primary"
data = "ਮਹਾਂ ਰੂਪ ਰੂਪੰ ਮਹਾਂ ਕਾਮ ਕਾਮੰ ॥੫੯॥"
page = 44

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art the most beautiful of the beautiful once and the most passionate of he passionate once.59."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੂੰ) ਰੂਪਾਂ ਦਾ ਮਹਾ ਰੂਪ ਅਤੇ ਕਾਮਾਂ ਦਾ ਵੀ ਮਹਾ ਕਾਮ ਹੈ ॥੫੯॥"