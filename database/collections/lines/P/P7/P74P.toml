language = "en"
data = "Somewhere Thou art practicing for the realisation of powers through the medium of learning and science!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ (ਤੂੰ) ਅੱਖਰਾਂ ਦੇ ਉਪਸਰਗਾਂ (ਪ੍ਰਤ੍ਯਯਾਂ) ਦੁਆਰਾ ਸਿੱਧ ਕੀਤਾ ਹੋਇਆ ਹੈਂ"