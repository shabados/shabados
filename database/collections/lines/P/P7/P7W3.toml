[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਆ ਅਉਸਰ ਕੈ; ਹਉ ਬਲਿ ਜਾਈ ॥"
page = 1207
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am a sacrifice unto that time,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਸ ਸਮੇ ਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to that occasion."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਸ ਸਮ੍ਯ ਕੇ ਮੈਂ ਬਲਿਹਾਰਨੇ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਸ ਮੌਕੇ ਤੋਂ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ (ਜਦੋਂ ਮੈਨੂੰ ਸੰਤ ਜਨਾਂ ਦੀ ਸੰਗਤ ਪ੍ਰਾਪਤ ਹੋਈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਉਸਰ = ਸਮਾ, ਮੌਕਾ। ਉਆ ਅਉਸਰ ਕੈ = ਉਸ ਸਮੇਂ ਤੋਂ। ਹਉ = ਮੈਂ। ਬਲਿ ਜਾਈ = ਬਲਿ ਜਾਈਂ, ਮੈਂ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi vida a esos preciosos momentos en que contemplo"