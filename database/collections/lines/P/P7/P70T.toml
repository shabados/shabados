[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਸਰਿ ਗਈ; ਸਭ ਦੁਰਮਤਿ ਰੀਤਿ ॥"
page = 802
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am rid of all the evil thoughts and ways."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਮੰਦੇ ਖਿਆਲਾਂ ਅਤੇ ਰਹੁ-ਰੀਤੀਆਂ ਤੋਂ ਖਲਾਸੀ ਪਾ ਗਿਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am rid of all evil-minded ways."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੇ ਚਿਤ ਤੇ ਖੋਟੀ ਮਤਿ ਕੀ ਰੀਤਿ ਬਿਸਰ ਗਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਖੋਟੀ ਮਤਿ ਵਾਲਾ ਸਾਰਾ (ਜੀਵਨ) ਰਵਈਆ ਭੁੱਲ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਰਮਤਿ = ਖੋਟੀ ਮਤਿ। ਰੀਤਿ = ਰਵਈਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "todas mis mañas y maldades se esfuman."