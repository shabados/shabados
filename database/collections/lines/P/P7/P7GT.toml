[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਈ ਪੂਤਾ; ਇਹੁ ਜਗੁ ਸਾਰਾ ॥"
page = 840
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This whole world is the off-spring of mammon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਮੂਹ ਸੰਸਾਰ ਮਾਇਆ ਦੀ ਔਲਾਦ (ਪਸਾਰਾ) ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This whole world is the child of Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਸੰਪੂਰਨ ਜਗਤ ਮੇਂ ਜਿਸ ਕੀ (ਪੂਤਾ) ਪਵਿਤ੍ਰਤਾ ਆਈ ਹੋਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹ ਨਾਥ-ਪ੍ਰਭੂ ਸਾਰੇ ਜਗਤ ਦੀ ਮਾਂ ਹੈ) ਇਹ ਸਾਰਾ ਜਗਤ ਉਸ ਮਾਂ (-ਨਾਥ-ਪ੍ਰਭੂ) ਦਾ ਪੁੱਤਰ ਹੈ (ਪੈਦਾ ਕੀਤਾ ਹੋਇਆ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਈ = ਮਾਇਆ, ਮਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Este mundo ha nacido de la misma madre, Maya."