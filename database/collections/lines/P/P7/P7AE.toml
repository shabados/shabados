[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹ ਗੁਰ ਕੀ ਪਉੜੀ; ਜਾਣੈ ਜਨੁ ਕੋਈ ॥"
page = 1038
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some rare person, realises this ladder of the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਵਿਰਲਾ ਪੁਰਸ਼ ਹੀ ਇਸ ਗੁਰਾਂ ਦੀ ਪਉੜੀ ਨੂੰ ਅਨੁਭਵ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How rare are those who understand this ladder of the Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹੁ ਗੁਰ ਉਪਦੇਸ਼ ਕੀ ਪਉੜੀ ਕੋਈ ਪੁਰਸ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਕੋਈ ਵਿਰਲਾ ਬੰਦਾ ਗੁਰੂ ਦੀ ਦੱਸੀ ਹੋਈ ਇਸ (ਸਿਮਰਨ ਦੀ) ਪੌੜੀ (ਦਾ ਭੇਤ) ਸਮਝਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਕੀ ਪਉੜੀ = ਗੁਰੂ ਦੇ ਦੱਸੇ ਰਾਹ ਤੇ ਤੁਰਨਾ। ਕੋਈ = ਕੋਈ ਵਿਰਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero extraordinario es aquél que logra ver la Escalera del Guru,"