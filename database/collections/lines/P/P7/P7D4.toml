[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈ. ਹਰਿ ਹਰਿ ਨਾਮੁ; ਵਿਸਾਹੁ ॥"
page = 758
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have purchased the Lord God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ ਖਰੀਦ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have purchased the Name of the Lord, Har, Har."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਪੂਰੇ ਤੇ ਮੈਂ ਹਰਿ ਹਰਿ ਨਾਮ ਖਰੀਦਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪੂਰੇ ਗੁਰੂ ਪਾਸੋਂ ਮੈਂ ਉਸ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਸਰਮਾਇਆ ਪ੍ਰਾਪਤ ਕਰ ਲਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਿਸਾਹੁ = ਸਰਮਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He traído a mi hogar el Nombre del Señor, a través del Guru"