[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਿ ਗੋਬਿੰਦੁ; ਪੜਦੇ ਸਭਿ ਕਾਜੇ ॥੩॥"
page = 897
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Contemplating the Master of the Universe, a veil is cast over all the sins of the Mortal."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਲਮ ਦੇ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ ਪ੍ਰਾਣੀ ਦੇ ਸਾਰੇ ਐਬ ਢਕੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate on the Lord of the Universe, and He will cover all your faults. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰੁ ਤਿਨੋਂ ਨੇ ਗੋਬਿੰਦ ਜਪ ਕੇ ਸਭ ਪੜਦੇ ਅਪਨੇ ਕਜ ਲੀਏ ਹੈਂ, ਭਾਵ ਪਾਪ ਪੁੰਨ ਦੋਨੋਂ ਸੇ ਰਹਿਤ ਹੂਏ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪ ਕੇ ਸਾਰੇ ਪੜਦੇ ਕੱਜੇ ਜਾਂਦੇ ਹਨ (ਲੋਕ ਪਰਲੋਕ ਵਿਚ ਇੱਜ਼ਤ ਬਣ ਜਾਂਦੀ ਹੈ) ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭਿ = ਸਾਰੇ। ਕਾਜੇ = ਕੱਜੇ ਜਾਂਦੇ ਹਨ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la mente íntegra se llena de júbilo. Contempla a tu Dios para que Él salve tu honor.(3)"