[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕਾ ਕਹਣਾ; ਕਹਹੁ ਨ ਕੋਇ ॥"
page = 1256
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "his story of praise no one can narrate."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਮਹਿਮਾ ਦੀ ਕਹਾਣੀ ਕੋਈ ਭੀ ਵਰਣਨ ਨਹੀਂ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then his praises cannot even be expressed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੋ ਤਿਸ ਕਾ (ਕਹਣਾ) ਜਸੁ ਕੋਈ ਨ ਕਹੋ, ਭਾਵ ਯੇਹ ਕਿ ਤਿਸ ਕੀ ਮਹਿਮਾ ਬ੍ਯੰਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਤਾਂ ਕਹਿਣਾ ਹੀ ਕੀਹ ਹੋਇਆ? (ਭਾਵ, ਉਸ ਦੀ ਪੂਰੀ ਸਿਫ਼ਤ ਕੀਤੀ ਹੀ ਨਹੀਂ ਜਾ ਸਕਦੀ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕਾ ਕਹਣਾ = ਉਸ ਮਨੁੱਖ ਬਾਬਤ ਕੁਝ ਆਖਣਾ। ਕਹਹੁ ਨ ਕੋਇ = ਤੁਸੀਂ ਕੋਈ ਧਿਰ ਭੀ ਨਾ ਆਖੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no podría terminar de Alabarlo, ni sondear Su Gloria;"