[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਖ ਭੰਜਨ; ਨਿਧਾਨ ਅਮੋਲੇ ॥"
page = 99
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art destroyer of pain, priceless, treasure,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਦਰਦ-ਨਾਸ਼ਕਰਤਾ, ਅਣਮੁੱਲਾ ਖ਼ਜ਼ਾਨਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Destroyer of pain, Priceless Treasure,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਦੁਖੋਂ ਕੇ ਨਾਸ ਕਰਨੇ ਵਾਲੇ, ਹੇ ਅਮੋਲਕ ਨਿਧੋਂ ਕੇ ਘਰ!॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਜੀਵਾਂ ਦੇ) ਦੁੱਖ ਨਾਸ ਕਰਨ ਵਾਲੇ! ਹੇ ਕੀਮਤੀ ਪਦਾਰਥਾਂ ਦੇ ਖ਼ਜ਼ਾਨੇ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਖ ਭੰਜਨ = ਹੇ ਦੁੱਖਾਂ ਦੇ ਨਾਸ ਕਰਨ ਵਾਲੇ! ਨਿਧਾਨ = ਹੇ ਖ਼ਜ਼ਾਨੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Tú, el Destructor del miedo; oh Tú, el Tesoro Invaluable."