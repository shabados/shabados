[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਬਿ ਹੋਵੈ ਲਿਖਿਆ; ਤਾ ਸਤਿਗੁਰੁ ਪਾਵੈ ॥੫॥"
page = 421
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If it be so pre-ordained, then, alone, one obtains the True Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਧੁਰ ਦੀ ਐਸੀ ਲਿਖਤਾਕਾਰ ਹੋਵੇ, ਕੇਵਲ ਤਦ ਹੀ ਇਨਯਾਨ ਸੱਚੇ ਗੁਰਾਂ ਨੂੰ ਪ੍ਰਾਪਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If it is so pre-ordained, then one finds the True Guru. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਪੂਰਬਲਾ ਉਤਮ ਲੇਖ ਲਿਖਾ ਹੂਆ ਹੋਵੈ ਤੋ ਪੁਰਸ਼ ਗੁਰੋਂ ਕੋ ਪਾਵਤਾ ਹੈ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਗੁਰੂ ਭੀ ਤਦੋਂ ਹੀ ਮਿਲਦਾ ਹੈ ਜੇ ਪਿਛਲੇ ਜਨਮਾਂ ਦੇ ਕੀਤੇ ਹੋਏ ਚੰਗੇ ਕਰਮਾਂ ਦੇ ਸੰਸਕਾਰ (ਅੰਦਰ) ਮੌਜੂਦ ਹੋਣ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰਬਿ = ਧੁਰ ਤੋਂ, ਪਹਿਲੇ ਕੀਤੇ ਕਰਮਾਂ ਦੇ ਸੰਸਕਾਰਾਂ ਅਨੁਸਾਰ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "uno encuentra al Verdadero Guru. (5)"