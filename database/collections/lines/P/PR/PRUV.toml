[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭਿ. ਰਾਖੀ ਪੈਜ ਹਮਾਰੀ ॥੧॥"
page = 628
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and God has saved my honour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪ੍ਰਭੂ ਨੇ ਮੇਰੀ ਇੱਜ਼ਤ ਆਬਰੂ ਰੱਖ ਲਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and God saved my honor. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸੀ ਪ੍ਰਭੂ ਨੇ ਹਮਾਰੀ (ਪੈਜ) ਪ੍ਰਤੱਗ੍ਯਾ ਰਾਖ ਲਈ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਨੇ ਸਾਡੀ ਲਾਜ ਰੱਖ ਲਈ (ਬਿਖੈ ਠਗਉਰੀ ਤੋਂ ਬਚਾ ਲਿਆ) ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ। ਪੈਜ = ਲਾਜ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y salvó mi honor. (1)"