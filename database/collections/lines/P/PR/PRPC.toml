data = "ਤਵਨ ਪਠਾਨੀ ਕੋ ਹੁਤੋ; ਨਾਮ ਗੌਹਰਾ ਰਾਇ ॥"
page = 927

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The name of the Pathani, the Pathan’s woman, was Gohraan Raae,"

