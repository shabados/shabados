type = "primary"
data = "ਦਾਹ ਦਿਯੋ ਤਿਹ ਨਾਰਿ ਕੌ; ਚਿਤ ਅਤਿ ਸੋਕ ਬਢਾਇ ॥"
page = 985

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "With intense tribulations, he cremated her"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਇਸਤਰੀ ਦਾ ਦਾਹ-ਸੰਸਕਾਰ ਕਰ ਕੇ ਅਤੇ ਮਨ ਵਿਚ ਬਹੁਤ ਦੁਖੀ ਹੋ ਕੇ"