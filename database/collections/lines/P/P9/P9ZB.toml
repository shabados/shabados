[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਸਨਾ ਗੁਣ ਗਾਵੈ; ਹਰਿ ਤੇਰੇ ॥"
page = 1080
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My God, my tongue sings Thy praise,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰ ਵਾਹਿਗੁਰੂ, ਮੇਰੀ ਜੀਭ੍ਹਾ ਤੈਡਾਂ ਜੱਸ ਗਾਇਨ ਕਰਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord, with my tongue I sing Your Glorious Praises."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰੇ ਗੁਣੋਂ ਕੋ ਮੇਰੀ ਰਸਨਾ ਗਾਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਹੇ ਹਰੀ! (ਮਿਹਰ ਕਰ) ਮੇਰੀ ਜੀਭ ਤੇਰੇ ਗੁਣ ਗਾਂਦੀ ਰਹੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸਨਾ = ਜੀਭ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, busco que mis labios reciten sólo Tu Alabanza,"