[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਹਿਦ ਖਾ ਆਗੇ ਹੁਤੋ; ਬੇਗ ਯੂਸਫ ਗਯੋ ਆਇ ॥"
page = 817

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "A person called Zaahid Khan was with her when another person, named Yusaf Khan, came as well."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਾਹਿਦ ਖਾਂ (ਨਾਂ ਦਾ ਵਿਅਕਤੀ ਉਸ ਕੋਲ) ਪਹਿਲਾਂ ਸੀ, (ਉਪਰੋਂ) ਯੂਸਫ਼ ਬੇਗ ਆ ਗਿਆ।"