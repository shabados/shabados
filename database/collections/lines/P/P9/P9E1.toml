[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਕਿਛੁ ਹੋਵੈ; ਸਹਜਿ ਸੁਭਾਇ ॥"
page = 1262
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever the does, he does spontaneously."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਝ ਉਹ ਕਰਦਾ ਹੈ, ਸੁਤੇ-ਸਿੱਧ ਹੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever he does, he does with intuitive poise."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕਿਛੁ ਹੋਤਾ ਹੈ (ਸਹਜਿ ਸੁਭਾਇ) ਸੁਤੇ ਸਿਧ ਹੀ ਹੋਤਾ ਹੈ, ਭਾਵ ਉਸ ਜੀਵਨ ਮੁਕਤਿ ਪੁਰਸ ਦੀ ਨਿਰਜਤਨ ਚੇਸਟਾ ਹੋ ਰਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਰਜ਼ਾ ਅਨੁਸਾਰ) ਜੋ ਕੁਝ ਵਾਪਰਦਾ ਹੈ ਉਸ ਨੂੰ ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਪਿਆਰ ਵਿਚ (ਟਿਕਿਆ ਰਹਿ ਕੇ ਸਹਾਰਦਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜਿ = ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ। ਸੁਭਾਇ = ਪ੍ਰੇਮ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "lo que hace, lo hace en la paz intuitiva,"