[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਧਸੰਗਤਿ ਗੁਰ ਸਬਦੁ ਸੁਣਿ; ਕਪਟ ਸਨੇਹੀ ਗਲਾਂ ਗੋਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Listening to the Word in the holy congregation the cheat talks nonsensically."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਵਿਚ ਗੁਰ ਦਾ ਸ਼ਬਦ ਸੁਣਕੇ ਕਪਟ ਸਨੇਹੀ ਕੇਵਲ ਗੱਲਾਂ ਹੀ ਕਰਦੇ ਹਨ, (ਪਰ ਗੱਲਾਂ ਨਾਲ ਕੀ ਬਣਦਾ ਹੈ)"