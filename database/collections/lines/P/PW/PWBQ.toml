[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਾਤੂ ਪੰਜਿ ਰਲਾਇ; ਕੂੜਾ ਪਾਜਿਆ ॥"
page = 1411
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Uniting the five elements together, the Lord has given it a false gilding."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੰਜਾਂ ਤੱਤਾਂ ਨੂੰ ਮਿਲਾ ਕੇ ਪ੍ਰਭੂ ਨੇ ਇਸ ਨੂੰ ਝੂਠਾ ਮੁਲੰਮਾ ਦਿੱਤਾ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Joining the five elements together, the Lord made a false cover."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂ ਕਿ ਪਾਂਚ ਤਤੋਂ ਰੂਪੀ ਧਾਤੋਂ ਕੋ ਮਿਲਾਇ ਕਰ ਝੂਠ ਕਾ ਹੀ ਪਾਜ ਲਗਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹਵਾ, ਪਾਣੀ, ਮਿੱਟੀ, ਅੱਗ, ਆਕਾਸ਼) ਪੰਜ ਤੱਤ ਇਕੱਠੇ ਕਰ ਕੇ ਇਹ ਸਰੀਰ-ਭਾਂਡਾ ਇਕ ਨਾਸਵੰਤ ਖਿਡੌਣਾ ਜਿਹਾ ਬਣਾਇਆ ਗਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਾਤੂ ਪੰਜਿ = (ਹਵਾ, ਪਾਣੀ, ਮਿੱਟੀ, ਅੱਗ, ਆਕਾਸ਼,) ਪੰਜ ਤੱਤ। ਕੂੜਾ ਪਾਜਿਆ = ਨਾਸਵੰਤ ਖਿਡੌਣਾ ਜਿਹਾ ਬਣਾਇਆ ਗਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Juntando los cinco elementos, el Señor les puso una cubierta falsa y cuando así Le place,"