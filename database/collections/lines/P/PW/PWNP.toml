[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਯਹ ਬੁਗਚਾ ਤੁਮ ਲੈ ਚਲੌ; ਚਲਿ ਆਗੇ ਫਿਰਿ ਲੇਹੁ ॥੫॥"
page = 891

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘And taking this bundle you walk in front of me.’(5)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਇਹ ਗਠਰੀ ਤੁਸੀਂ ਲੈ ਲਓ ਅਤੇ ਲੈ ਕੇ ਮੇਰੇ ਅਗੇ ਚਲੋ ॥੫॥"