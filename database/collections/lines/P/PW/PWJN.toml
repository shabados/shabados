[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨਿ ਤੇਊ; ਜਿਹ ਰੁਚ ਇਆ ਮਨੂਆ ॥"
page = 251
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Blest are they within whose mind this longing subsists."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਬਾਰਕ ਹਨ ਉਹ ਜਿਨ੍ਹਾਂ ਦੇ ਚਿੱਤ ਅੰਦਰ ਇਹ ਚਾਹਨਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Blessed are those whose minds are filled with this longing."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਵਹੁ ਪੁਰਸ ਧੰਨਤਾ ਯੋਗ ਹੈਂ ਜਿਨ ਕੇ ਮਨ ਮੇਂ (ਇਆ) ਇਸ ਸੰਤ ਚਰਨ ਧੂਰੀ ਕੀ ਰੁਚੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਬੰਦੇ ਭਾਗਾਂ ਵਾਲੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਦੇ ਮਨ ਵਿਚ ਇਸ ਧੂੜ ਦੀ ਤਾਂਘ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਨਿ = ਭਾਗਾਂ ਵਾਲੇ। ਤੇਊ = ਉਹ ਬੰਦੇ। ਜਿਹ ਮਨੂਆ = ਜਿਨ੍ਹਾਂ ਦੇ ਮਨ ਵਿਚ। ਇਆ ਰੁਚ = ਇਸ (ਧੂਰ) ਦੀ ਤਾਂਘ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "benditos son aquéllos que buscan nada más que eso."