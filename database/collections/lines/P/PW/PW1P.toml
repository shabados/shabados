[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਜਨ; ਕਉਨੁ ਤੁਮਾਰੈ ਆਵੈ ॥"
page = 1105
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O King, who would visit thee?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਾਤਿਸ਼ਾਹ! ਤੇਰੇ ਕੋਲ ਕੌਣ ਆਵੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O king, who will come to you?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰੇ ਰਾਜਨ! ਤੁਮਾਰੇ ਕੌਨ ਆਵਤਾ ਹੈ, ਭਾਵ ਤੂੰ ਸਰਧਾਹੀਨ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਜਾ (ਦੁਰਜੋਧਨ)! ਤੇਰੇ ਘਰ ਕੌਣ ਆਵੇ? (ਮੈਨੂੰ ਤੇਰੇ ਘਰ ਆਉਣ ਦੀ ਖਿੱਚ ਨਹੀਂ ਹੋ ਸਕਦੀ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਜਨ = ਹੇ ਰਾਜਾ ਦੁਰਜੋਧਨ! ਤੁਮਾਰੈ = ਤੇਰੇ ਵਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Daryodhana pregunta a Krishna, oh Rey, ¿cómo puede uno llegar hasta Tu Hogar?"