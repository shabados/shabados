[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਉ ਕਿਰਪਾ ਗੋਬਿੰਦ ਭਈ ॥"
page = 402
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the World-Lord became merciful."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਸ੍ਰਿਸ਼ਟੀ ਦਾ ਸੁਆਮੀ ਮਿਹਰਬਾਨ ਹੋ ਗਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Lord of the Universe became merciful,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਮੇਰੇ ਪਰ ਗੋਬਿੰਦ ਕੀ ਕ੍ਰਿਪਾ ਭਈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਮੇਰੇ ਉਤੇ ਗੋਬਿੰਦ ਦੀ ਕਿਰਪਾ ਹੋਈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਉ = ਜਦੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Obtuve felicidad y confort como fruto por meditar en el Naam,"