[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਪ੍ਰ ਕਰਤ ਭਏ ਸੂਦ੍ਰ ਬ੍ਰਿਤਿ ਛਤ੍ਰੀ ਬੈਸਨ ਕਰਮ ॥"
page = 54

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Vaishyas acted like Shudras and Kshatriyas like Vaishyas."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਾਹਮਣ ਸੂਦਰਾਂ ਦੇ ਕਰਮ ਕਰਨ ਲਗ ਗਏ ਅਤੇ ਛਤ੍ਰੀਆਂ ਨੇ ਵੈਸ਼ਾਂ ਦਾ ਕਰਮ ਅਪਣਾ ਲਿਆ।"