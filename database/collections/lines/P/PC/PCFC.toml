line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sublime is such a devotee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼੍ਰੇਸ਼ਟ ਹੈ ਇਹੋ ਜਿਹਾ ਅਨੁਰਾਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
