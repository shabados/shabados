[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੇ ਮਨ ਟਹਲ ਹਰਿ; ਸੁਖ ਸਾਰ ॥"
page = 986
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, real bliss lies in the Lord's service."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਅਸਲ ਖੁਸ਼ੀ ਪ੍ਰਭੂ ਦੀ ਚਾਕਰੀ ਵਿੱਚ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mind, true peace comes from serving the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਹਰੀ ਕੀ ਟਹਲ ਕਰੁ, ਤਿਸ ਮੇਂ ਸ੍ਰੇਸਟ ਸੁਖ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਮਨ! ਪਰਮਾਤਮਾ ਦੀ ਸੇਵਾ-ਭਗਤੀ ਅਸਲ ਸੁਖ ਦੇਣ ਵਾਲੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਟਹਲ ਹਰਿ = ਪਰਮਾਤਮਾ ਦੀ ਸੇਵਾ-ਭਗਤੀ। ਸਾਰ = ਸ੍ਰੇਸ਼ਟ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, el Éxtasis verdadero lo encuentras sólo en el Servicio de Dios;"