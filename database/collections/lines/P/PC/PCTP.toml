data = "ਇਸ ਮਾਟੀ ਮਹਿ; ਪਵਨੁ ਸਮਾਇਆ ॥"
page = 336
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In this clay (body), breath is infused."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਮਿਟੀ (ਦੇਹਿ) ਅੰਦਰ ਸੁਆਸ ਪਾ ਦਿੱਤਾ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Into this clay, the breath is infused."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਦੇਹ ਮਾਟੀ ਕੇ ਬੀਚ ਤੇ ਪ੍ਰਾਣ ਪਵਨ ਸਮਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਮਿੱਟੀ (ਦੇ ਪੁਤਲੇ) ਵਿਚ (ਇਸ ਨੂੰ ਖੜਾ ਰੱਖਣ ਲਈ) ਪ੍ਰਾਣ ਟਿਕੇ ਹੋਏ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਵਨੁ = ਪ੍ਰਾਣ।"

