[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬ੍ਰਹਮ ਮਹੂਰਤ ਸ︀ਯਾਮ ਉਠੈ ਉਠਿ ਨ੍ਰਹਾਇ ਹ੍ਰਿਦੈ ਹਰਿ ਧਿਆਨ ਧਰੈ ॥"
page = 530

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Getting up at the time of meditation, Krishna concentrated on the Lord"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭਾਤ ਵੇਲੇ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਉਠਦੇ ਹਨ, ਉਠ ਕੇ ਇਸ਼ਨਾਨ ਕਰਦੇ ਹਨ ਅਤੇ ਹਿਰਦੇ ਵਿਚ ਹਰਿ ਦਾ ਧਿਆਨ ਧਰਦੇ ਹਨ।"