[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਰਿ ਭਈ; ਜਪਿ ਨਾਮੁ ਮੁਰਾਰੀ ॥੩॥"
page = 742
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "are dispelled by contemplating the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ ਰਫਾ ਹੋ ਜਾਂਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "are removed by meditating on the Naam, the Name of the Lord. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੁਰਾਰੀ! ਤੇਰੇ ਨਾਮ ਕੇ ਜਪਨੇ ਸੇ ਦੂਰ ਹੂਈ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪ ਕੇ ਦੂਰ ਹੋ ਗਈਆਂ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਪਿ = ਜਪ ਕੇ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que infectan al hombre, son disueltas, habitando en Tu Nombre. (3)"