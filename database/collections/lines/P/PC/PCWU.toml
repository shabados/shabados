[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਦਾਸੁ ਕਹੈ ਬੇਨੰਤੀ; ਹਉ ਲਾਗਾ ਤਿਨ ਕੈ ਪਾਏ ॥੪॥੫॥"
page = 601
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sorath 3rd Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੋਰਠਿ ਤੀਜੀ ਪਾਤਿਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Slave Nanak utters this prayer: O Lord, please, let me fall at their feet. ||4||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਮਨ! ਮੇਰੀ ਅਕਾਲ ਪੁਰਖ ਸੇ ਯਹੀ ਬੇਨਤੀ ਹੈ, ਜੋ ਮੈਂ ਤਿਨ ਭਗਤੋਂ ਕੇ ਚਰਨੋਂ ਮੇਂ ਲਗਾ ਰਹੂੰ॥੫॥☬ਉਪਦੇਸ਼:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦਾਸ ਨਾਨਕ ਬੇਨਤੀ ਕਰਦਾ ਹੈ-ਮੈਂ ਉਹਨਾਂ ਭਗਤਾਂ ਦੇ ਚਰਨੀਂ ਲੱਗਦਾ ਹਾਂ ॥੪॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਨ ਕੈ ਪਾਏ = ਉਹਨਾਂ ਦੀ ਪੈਰੀਂ ॥੪॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak reza, oh Señor, permite que me postre a los Pies de Tus Santos. (4‑5)"