[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੀ ਪ੍ਰੀਤਿ; ਇਹੁ ਭਵਜਲੁ ਤਰੈ ॥"
page = 391
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Lord's love, man crosses this terrible world ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਸਨੇਹ ਦੁਆਰਾ ਬੰਦਾ ਇਸ ਭਿਆਨਕ ਸੰਸਾਰ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Love of God, one crosses over this terrible world-ocean."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕੀ ਪ੍ਰੀਤ ਸੇ ਇਹੁ ਜੀਵ ਸੰਸਾਰ ਸਮੁਦ੍ਰ ਸੇ ਤਰ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਿੱਤਰ! (ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ) ਪਰਮਾਤਮਾ ਦੀ ਪ੍ਰੀਤਿ (ਆ ਵੱਸਦੀ ਹੈ) ਉਹ ਇਸ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਲੰਘ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਵਜਲੁ = ਸੰਸਾਰ-ਸਮੁੰਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En el Amor de Dios, uno cruza el mar del miedo."