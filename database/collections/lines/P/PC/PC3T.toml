[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਨਹਗਾਰ ਲੂਣ ਹਰਾਮੀ ॥"
page = 739
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O sinner, untrue to thy salt,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਲੂਣ ਖਾ ਕੇ ਹਰਾਮ ਹਕਰਨ ਵਾਲੇ ਪਾਪੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O sinner, you are untrue to your own self;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਗੁਨਹਗਾਰ) ਗੁਨਾਹੀਂ ਹੇ ਨਿਮਕ ਹਰਾਮ!॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਾਪੀ! ਹੇ ਅਕਿਰਤਘਣ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਨਹਗਾਰ = ਹੇ ਗੁਨਹਗਾਰ! ਹੇ ਪਾਪੀ! ਲੂਣ ਹਰਾਮੀ = ਹੇ ਅਕਿਰਤਘਣ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, yo cometo grandes errores y Te he traicionado todo el tiempo."