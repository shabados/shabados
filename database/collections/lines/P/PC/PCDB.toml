[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਾਣੀ. ਏਕੋ ਨਾਮੁ ਧਿਆਵਹੁ ॥"
page = 1254
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O mortal, meditate thou on the one Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਫਾਨੀ ਬੰਦੇ! ਤੂੰ ਇਕ ਸਾਹਿਬ ਦੇ ਨਾਮ ਦਾ ਹੀ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mortal, meditate on the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਾਣੀ! ਤਿਸ ਇਕ ਵਾਹਿਗੁਰੂ ਕੇ ਨਾਮ ਕੋ ਧਿਆਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਾਣੀ! ਇਕ ਪਰਮਾਤਮਾ ਦਾ ਹੀ ਨਾਮ ਸਿਮਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh ser humano, habita en el Nombre de tu Único Dios,"