data = "ਦੇਵੀ ਆਪ ਸਵਾਰੇ, ਪਬ ਜਵੇਹਣੇ ॥"
page = 122

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The goddess herself killed these mountain-like demons."

[[content]]
assets = ["RSJD"]
type = "translation"
