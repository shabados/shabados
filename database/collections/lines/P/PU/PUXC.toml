[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਗੁ ਮਿਟੈ; ਸਭ ਹੀ ਸੁਖ ਪਾਵੈ ॥੪੩॥"
page = 342
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "his sorrow departs and he attains all peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਗ਼ਮ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ ਅਤੇ ਉਹ ਸਮੂਹ ਆਰਾਮ ਪਾ ਲੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "his sorrow departs, and he obtains total peace. ||43||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੋ ਸੋਗਿ ਨਵਿਰਤ ਹੋ ਜਾਵੈ ਔਰ ਸੰਪੂਰਨ ਸੁਖੋਂ ਕੋ ਪ੍ਰਾਪਤਿ ਹੋ ਜਾਵੇ॥੪੩॥☬ਭਜਨ ਕਾ ਕਾਰਣ ਵੈਰਾਗ ਹੈ। ਤਿਸ ਕੇ ਲੀਏ ਜਗਤ ਨਾਸੀ ਜਨਾਵਤੇ ਹੂਏ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ (ਇਸ ਦਾ) ਫ਼ਿਕਰ ਮੁੱਕ ਜਾਂਦਾ ਹੈ, ਤੇ ਇਹ ਸਾਰੇ ਸੁਖ ਹਾਸਲ ਕਰ ਲੈਂਦਾ ਹੈ ॥੪੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "todas sus aflicciones son quitadas y obtiene el Éxtasis. (43)"