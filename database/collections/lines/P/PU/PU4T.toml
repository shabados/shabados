[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਸਭ ਜੀਅ ਜਾਨਹੁ ॥੯੫੦॥"
page = 774

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Nishi-shanani”, add the words “Jaachar, ari and shatru” and know the names of Tupak in your mind.950."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਆਪਣੇ ਮਨ ਵਿਚ ਤੁਪਕ ਦਾ ਨਾਮ ਜਾਣੋ ॥੯੫੦॥"