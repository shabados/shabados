[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੋਟਿ; ਨ ਕਤਹੂ ਆਵੈ ॥"
page = 625
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and I am now short of nothing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੈਨੂੰ ਹੁਣ ਕਿਸੇ ਚੀਜ਼ ਦਾ ਘਾਟਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and now, nothing is lacking at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੋਟ ਕਬੀ ਨਹੀਂ ਆਵਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਵਲੋਂ ਉਸ ਨੂੰ) ਕਿਤੇ ਭੀ ਘਾਟ ਮਹਿਸੂਸ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੋਟਿ = ਕਮੀ। ਕਤਹੂ = ਕਿਤੇ ਭੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora no me falta nada;"