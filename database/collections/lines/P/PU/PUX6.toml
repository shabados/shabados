[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਜਨ ਹੋਏ; ਸਗਲ ਨਿਧਾਨ ॥"
page = 891
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that man attains to all the treasures."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਇਨਸਾਨ ਸਾਰੇ ਖਜ਼ਾਨੇ ਹਾਸਲ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "obtains all treasures."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪੁਰਸ ਕੋ ਸਭ (ਨਿਧਾਨ) ਸੁਖ ਪ੍ਰਾਪਤਿ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ (ਮਾਨੋ) ਸਾਰੇ ਹੀ ਖ਼ਜ਼ਾਨੇ ਮਿਲ ਗਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੋਏ = ਪ੍ਰਾਪਤ ਹੋ ਗਏ। ਨਿਧਾਨ = ਖ਼ਜ਼ਾਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es bendecido con todos los Tesoros;"