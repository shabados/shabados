[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਸਤ੍ਰ ਰਾਜ ਕੇ ਨਾਮ ਸਬ; ਮੋਰੀ ਕਰਹੁ ਸਹਾਇ ॥੪੨॥"
page = 719

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then the names of Kripaan, the king of weapons are formed  O Kripan! Do help me.42."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਸਾਰੇ ਨਾਮ ਸ਼ਸਤ੍ਰਰਾਜ (ਤਲਵਾਰ) ਦੇ ਹਨ, ਜੋ ਮੇਰੀ ਸਹਾਇਤਾ ਕਰਦੀ ਹੈ ॥੪੨॥"