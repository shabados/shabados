[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਪੁ ਪੁੰਨੁ; ਤਹ ਭਈ ਕਹਾਵਤ ॥"
page = 291
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Demerits and merits then began to be spoken of."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਦੀਆਂ ਤੇ ਨੇਕੀਆਂ ਦੀ ਤਦ ਕਹੌਤ ਆਰੰਭ ਹੋਈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sin and virtue then began to be spoken of."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਅਪਨੇ ਕੋ ਕਈ ਪਾਪੀ ਕਹਾਵਤਾ ਹੈ ਕੋਈ ਪੁੰਨਵਾਨ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਇਹ ਗੱਲ ਚੱਲ ਪਈ ਕਿ ਇਹ ਪਾਪ ਹੈ ਇਹ ਪੁੰਨ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹਾਵਤ = ਗੱਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Fue entonces que se generó la nostalgia por el cielo"