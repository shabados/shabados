data = "ਖ਼ੁਦਾਵੰਦਿ ਦੇਗ਼ੋ ਖ਼ੁਦਾਵੰਦਿ ਤੇਗ਼ ॥੯੧॥"
page = 1393

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "You are the chief of chiefs and the king.91."

