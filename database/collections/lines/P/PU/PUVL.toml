[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਗ ਨਾਸ ਜਾਹਿਨ ਜਾਨ ॥"
page = 673

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then the supreme essence will be known (when it will be realized) that He is also the destroyer of the world"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਜਗਤ ਦੇ ਨਾਸ਼ ਦਾ ਕਾਰਨ ਜਾਣਨਾ ਚਾਹੀਦਾ ਹੈ।"