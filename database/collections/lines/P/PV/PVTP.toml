[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਠਾਕੁਰ ਨੋ ਨ੍ਹਾਵਾਲਿ ਕੈ; ਚਰਣੋਦਕੁ ਲੈ ਤਿਲਕੁ ਚੜ੍ਹਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Having bathed the Thakur, he put the water used to wash the Thakur, on his own head."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਠਾਕੁਰ ਨੂੰ ਨੁਹਾ ਕੇ ਚਰਣ ਜਲ ਲੈ ਕੇ ਤਿਲਕ ਲਾਯਾ।"