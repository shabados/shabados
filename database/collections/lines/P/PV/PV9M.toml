[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਿਰਬੁ ਕਪੂਤਨ ਜਾਇ; ਰਾਜ ਸਪੂਤਨੁ ਬਹੁਰੈਯੈ ॥"
page = 906

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Due to spurious progeny the wealth is lost."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕੁਪੁੱਤਰਾਂ ਕਰ ਕੇ ਧਨ ਚਲਾ ਜਾਂਦਾ ਹੈ, ਸੁਪੁੱਤਰ ਖੋਏ ਹੋਏ ਰਾਜ ਨੂੰ ਪਰਤਾ ਲੈਂਦੇ ਹਨ।"