[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰ ਉਪਦੇਸੁ ਅਵੇਸੁ ਕਰਿ; ਮਿਠਾ ਬੋਲਣੁ ਮਨ ਪਰਚਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Allowing the Guru's instruction to enter their hearts they speak politely and thus comfort one another."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰ ਉਪਦੇਸ਼ ਨੂੰ ਧਾਰਨ ਕਰ ਕੇ ਓਹ ਮਿੱਠਾ ਬੋਲਕੇ (ਹਰੇਕ ਦਾ) ਮਨ ਪਰਚਾਉਂਦੇ ਹਨ।"