[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਹ ਹਰਿ ਕੇ ਨਾਮ ਕੀ; ਤੁਮ ਊਪਰਿ ਛਾਮ ॥"
page = 264
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "there the Name of God shall be a shade over thee"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦੀ ਤੇਰੇ ਉਤੇ ਛਾਂ ਹੋਵੇਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "there, the Name of the Lord will give you shade."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਹਾਂ ਹਰੀ ਕੇ ਨਾਮ ਕੀ ਹੀ ਤੁਮਾਰੇ ਪਰ ਛਾਇਆ ਹੋਇਗੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਓਥੇ ਪ੍ਰਭੂ ਦਾ ਨਾਮ (ਹੇ ਜੀਵ!) ਤੇਰੇ ਉਤੇ ਛਾਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛਾਮ = ਛਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en el Nombre encontrarás frescura."