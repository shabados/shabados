[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੇਵਕ ਮਾਗਤ ਹੈ ਬਰੁ ਏਕ; ਵਹੈ ਅਬ ਰੀਝਿ ਦਇਆ ਨਿਧਿ, ਦੀਜੈ ॥"
page = 522

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "This servant of your is asking for a boon, kindly bestow on me the same"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਮੈਂ ਤੁਹਾਡਾ) ਸੇਵਕ ਇਕ ਵਰ ਮੰਗਦਾ ਹਾਂ, ਹੇ ਦਇਆਨਿਧੀ! ਹੁਣ ਰੀਝ ਕੇ ਉਹ (ਵਰ) ਦੇ ਦਿਓ।"