[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ. ਰਾਮ ਕਹਨ ਕੀ ਛੋਡੁ ਬਾਨਿ ॥"
page = 1194
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Harnakhsh said to Prahlad, \"Abandon thou the habit of uttering the Lord's Name\"."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰਨਾਖਸ਼ ਨੇ ਪ੍ਰਹਿਲਾਦ ਨੂੰ ਆਖਿਆ, \" ਤੂੰ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਉਚਾਰਨ ਕਰਨ ਦੀ ਆਦਤ ਨੂੰ ਤਿਆਗ ਦੇ।\""

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He said to him, \"Stop uttering the Lord's Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਗੁਰੂ ਨੇ ਪ੍ਰਹਲਾਦ ਕੋ ਕਹਾ: ਤੂੰ ਰਾਮ ਨਾਮ ਕਹਿਨੇ ਕੀ ਬਾਨ ਛੋਡ ਦੇਹ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਾਂਧੇ ਨੇ ਪ੍ਰਹਿਲਾਦ ਨੂੰ ਸਮਝਾਇਆ) ਤੂੰ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਨ ਦੀ ਆਦਤ ਛੱਡ ਦੇਹ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਨਿ = ਆਦਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "dijo el Rey, deja ya el hábito de recitar el Nombre de Dios"