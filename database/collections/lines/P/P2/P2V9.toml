data = "ਤੁਮ ਕੋ ਰਾਜ ਆਪਨੋ ਦੈ ਹੈ ॥੧੩॥"
page = 887

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“One day Rani will come and let you have the Kingdom.(13)"

