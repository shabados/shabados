[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈ ਦੇਵਾਨਾ; ਭਇਆ ਅਤੀਤੁ ॥"
page = 721
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have become an intoxicated hermit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਇਕ ਮਤਵਾਲਾ ਵਿਰੱਕਤ ਹੋ ਗਿਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have become an intoxicated hermit."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਭੈ ਰੂਪੀ ਭੰਗ ਮੇਂ ਮਸਤ ਹੋ ਕਰ ਮੈਂ ਸੰਸਾਰ ਤੇ ਤਿਆਗਵਾਨ ਭਇਆ ਹੂੰ, ਭਾਵ ਤਿਆਗੀ ਫਕੀਰ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇਰੇ ਡਰ-ਅਦਬ ਦੀ ਭੰਗ ਨਾਲ) ਮੈਂ ਨਸ਼ਈ ਤੇ ਵਿਰਕਤ ਹੋ ਗਿਆ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਵਾਨਾ = ਨਸ਼ਈ, ਮਸਤਾਨਾ। ਅਤੀਤੁ = ਵਿਰਕਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "me he vuelto un ermitaño."