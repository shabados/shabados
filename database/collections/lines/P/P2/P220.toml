[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਹਿ ਸਾਹਿ ਤੁਝੁ ਸੰਮਲਾ; ਕਦੇ ਨ ਵਿਸਾਰੇਉ ॥"
page = 20
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With every breath I meditate in Thee, (O Lord) and never forget Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਸੁਆਸ ਨਾਲ ਮੈਂ ਤੇਰਾ ਸਿਮਰਨ ਕਰਦਾ ਹਾਂ, (ਹੇ ਸੁਆਮੀ!) ਅਤੇ ਕਦਾਚਿਤ ਭੀ ਤੈਨੂੰ ਨਹੀਂ ਭੁਲਾਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With each and every breath, I dwell upon You; I shall never forget You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨ: ਐਸੀ ਪ੍ਰੀਤੀ ਪੂਰਬਕ ਬੇਨਤੀ ਕਰੇ: ਕਿ ਹੇ ਪਰਮੇਸ੍ਵਰ! (ਸਾਹਿ ਸਾਹਿ) ਸ੍ਵਾਸ ਸ੍ਵਾਸ ਤੁਝ ਕੋ ਸਿਮਰਣ ਕਰੂੰ ਕਬੀ ਨਹੀਂ ਬਿਸਾਰੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਮਿਹਰ ਕਰ) ਮੈਂ ਹਰੇਕ ਸਾਹ ਦੇ ਨਾਲ ਤੈਨੂੰ ਯਾਦ ਕਰਦਾ ਰਹਾਂ, ਤੈਨੂੰ ਕਦੇ ਵੀ ਨਾਹ ਭੁਲਾਵਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਹਿ = ਸਾਹ ਨਾਲ। ਸਾਹਿ ਸਾਹਿ = ਹਰੇਕ ਸਾਹ ਨਾਲ। ਸੰਮਲਾ = ਸੰਮਲਾਂ, ਮੈਂ ਯਾਦ ਕਰਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con cada respiración medito en Ti, oh Señor, y nunca me olvido de Ti."