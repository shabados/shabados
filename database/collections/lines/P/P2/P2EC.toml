[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਸੀਗਾਰ; ਹੁਣਿ ਮੁਝਹਿ ਸੁਹਾਇਆ ॥"
page = 738
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the decorations now become me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਹਾਰ ਸ਼ਿੰਗਾਰ ਹੁਣ ਮੈਨੂੰ ਸੁਹਣੇ ਲੱਗਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am now adorned with all sorts of decorations."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰੁ ਸਾਧਨੋ ਰੂਪ ਸੀਂਗਾਰ ਸੋਭਤਾ ਭ੍ਯਾ ਹੈ ਅਰਥਾਤ ਸਾਧਨ ਸਫਲ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਮੈਨੂੰ (ਆਪਣੇ) ਸਾਰੇ ਸਿੰਗਾਰ (ਉੱਦਮ) ਸੋਹਣੇ ਲੱਗ ਰਹੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਝਹਿ = ਮੈਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora todos sus adornos son propicios para la ocasión y relucientes,"