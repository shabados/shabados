[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਬਿਨੁ; ਦੂਜਾ ਅਵਰੁ. ਨ ਕੋਈ ॥"
page = 744
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without Him, there is not another second."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਬਗੈਰ ਹੋਰ ਕੋਈ ਦੂਸਰਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without Him, there is no other at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤਿਸਤੇ ਬਿਨਾ ਦੂਸਰਾ ਹੋਰ ਕੋਈ ਸਾਮ੍ਰਥ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਸ ਤੋਂ ਬਿਨਾ ਹੋਰ ਕੋਈ ਨਹੀਂ (ਜੋ ਵਿਕਾਰਾਂ ਰੋਗਾਂ ਤੋਂ ਬਚਣ ਲਈ ਸਹਾਰਾ ਦੇ ਸਕੇ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin Él, tu Dios, no hay nadie más;"