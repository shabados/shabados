type = "primary"
data = "ਸੁਨੋ ਰਾਜ, ਕਹਾ ਨਾਰਿ ਕਾਮਾ ਬਿਚਾਰੀ ॥"
page = 922

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(The emissary,) ‘Listen Raja, what magnificence is there in Kaamkandla,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਜਨ! ਸੁਣੋ, ਇਹ ਕਾਮਕੰਦਲਾ ਨਾਰੀ ਵਿਚਾਰੀ ਕੀ ਹੈ।"