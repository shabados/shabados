[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੁਣਿ ਚੁਣਿ ਜੋਧੇ ਮਾਰੇ, ਅੰਦਰ ਖੇਤ ਦੈ ॥"
page = 123

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“She hath seleted the warriors and killed them in the battlefield"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਤੋਂ ਇਲਾਵਾ ਉਸ ਨੇ) ਰਣ ਖੇਤਰ ਵਿਚ ਚੁਣ ਚੁਣ ਕੇ (ਹੋਰ ਵੀ ਬਹੁਤ ਸਾਰੇ) ਯੋਧੇ ਮਾਰੇ ਹਨ।"