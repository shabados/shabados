[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਲਵਿਖ ਅਵਗਣ; ਕਾਟਣਹਾਰਾ ॥"
page = 112
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is the extirpator of sins and evil deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਗੁਨਾਹਾਂ ਤੇ ਮੰਦ-ਅਮਲ ਨੂੰ ਕੱਟਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He cuts out our sinful mistakes and evil actions;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਵਗੁਣੋਂ ਕੋ ਤਥਾ ਪਾਪੋਂ ਕੋ ਕਾਟਣੇ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਭ ਜੀਵਾਂ ਦੇ ਪਾਪ ਤੇ ਔਗੁਣ ਦੂਰ ਕਰਨ ਦੀ ਤਾਕਤ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਲਵਿਖ = ਪਾਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él nos purga de todos nuestros deméritos y faltas."