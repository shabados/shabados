[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਬੀਜਿ; ਆਪੇ ਹੀ ਖਾਹੁ ॥"
page = 4
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man himself sows and himself reaps (he reaps what he sows)."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਦਮੀ ਖੁਦ ਬੀਜਦਾ ਹੈ ਅਤੇ ਖੁਦ ਹੀ ਵੱਢਦਾ ਖਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You shall harvest what you plant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਸ ਅਪਨੇ (ਬੀਜ) ਕੀਏ ਹੂਏ ਕਰਮਾ ਕਾ ਫਲੁ, ਫੇਰ ਪ੍ਰਲੋਕ ਮੈ ਆਪ ਹੀ ਜੀਵ ਖਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਝ ਤੂੰ ਬੀਜੇਂਗਾ, ਉਸ ਦਾ ਫਲ ਆਪ ਹੀ ਖਾਹਿਂਗਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੇ = ਆਪ ਹੀ। ਬੀਜਿ = ਬੀਜ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Como siembras, cosecharás;"