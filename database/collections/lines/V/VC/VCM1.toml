[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੀ ਪਟੀਆ ਲਿਖਿ ਦੇਹੁ; ਗੋਬਿੰਦ ਮੁਰਾਰਿ ॥੨॥"
page = 1154
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "On my tablet write thou the Name of the Lord Master\"."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਫੱਟੀ ਉਤੇ ਤੂੰ ਸੁਆਮੀ ਮਾਲਕ ਦਾ ਨਾਮ ਲਿਖ ਦੇ।\""

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Write the Lord's Name on my tablet.\" ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਪਟੀ ਊਪਰ ਸ੍ਰੀ ਗੋਬਿੰਦ ਮੁਰਾਰੀ ਕਾ ਨਾਮ ਲਿਖ ਦੇਹੁ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੁਸੀਂ ਮੇਰੀ ਪੱਟੀ ਉਤੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹੀ ਲਿਖ ਦਿਹੁ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਰਾਰਿ = ਪਰਮਾਤਮਾ {ਮੁਰ-ਅਰਿ} ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "escribe entonces en mi libreta el Nombre de mi Señor. (2)"