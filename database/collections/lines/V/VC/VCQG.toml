[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਤਿ ਸੁਮਤਿ. ਤੇਰੈ ਵਸਿ ਸੁਆਮੀ; ਹਮ ਜੰਤ. ਤੂ ਪੁਰਖੁ ਜੰਤੈਨੀ ॥"
page = 800
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wisdom and sublime wisdom are in Thy power, O Lord, I am the instrument and Thou art the Player."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿਆਣਪ ਤੇ ਸਰੇਸ਼ਟ ਸਿਆਣਪ ਤੇਰੇ ਇਖਤਿਆਰ ਵਿੱਚ ਹਨ, ਹੇ ਸਾਹਿਬ! ਮੈਂ ਇਕ ਵਾਜਾ ਹਾਂ ਅਤੇ ਤੂੰ ਵਜਾਉਣ ਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wisdom, balanced wisdom is in Your power, O Lord and Master; I am the instrument, and You are the player, O Primal Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਤਿਸ ਵਾਹਿਗੁਰੂ ਕੇ ਆਗੇ ਐਸੇ ਬੇਨਤੀ ਕਰੋ: (ਮਤਿ) ਬਿਵਹਾਰਕ ਔ ਸੁਮਤਿ ਆਤਮ ਵਿਸੈਣੀ ਏਹੁ ਹੈ। ਹੇ ਸੁਆਮੀ! ਤੇਰੇ ਹੀ ਅਧੀਨ ਹੈ ਤਾਂ ਤੇ ਹਮ (ਜੰਤ) ਵਾਜੇ ਹੈਂ ਔਰ ਤੂੰ ਤਿਨ ਕੇ ਬਜਾਵਨਹਾਰਾ (ਜੰਤੈਨੀ) ਵਜੰਤ੍ਰੀ ਪੁਰਖ ਹੈਂ, ਭਾਵ ਇਹ, ਜੈਸੇ ਤੂੰ ਪ੍ਰੇਰਤਾ ਹੈਂ ਤੈਸੇ ਹਮ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਲਕ-ਪ੍ਰਭੂ! ਚੰਗੀ ਮੰਦੀ ਮਤਿ ਤੇਰੇ ਆਪਣੇ ਵੱਸ ਵਿਚ ਹੈ (ਤੇਰੀ ਪ੍ਰੇਰਨਾ ਅਨੁਸਾਰ ਹੀ ਕੋਈ ਜੀਵ ਚੰਗੇ ਰਾਹ ਤੁਰਦਾ ਹੈ ਕੋਈ ਮੰਦੇ ਪਾਸੇ), ਅਸੀਂ ਤੇਰੇ ਵਾਜੇ ਹਾਂ, ਤੂੰ ਸਾਨੂੰ ਵਜਾਣ ਵਾਲਾ ਸਭ ਵਿਚ ਵੱਸਣ ਵਾਲਾ ਪ੍ਰਭੂ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਮਤਿ = ਚੰਗੀ ਅਕਲ। ਵਸਿ = ਵੱਸ ਵਿਚ। ਸੁਆਮੀ = ਹੇ ਸੁਆਮੀ! ਹੇ ਮਾਲਕ! ਜੰਤ = ਵਾਜੇ। ਪੁਰਖੁ = ਸਰਬ-ਵਿਆਪਕ ਮਾਲਕ। ਜੰਤੈਨੀ = ਵਾਜੇ ਵਜਾਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, Sabiduría y tontería están ambas en Tus Manos. Somos Tus instrumentos, mientras Tú eres el Virtuoso."