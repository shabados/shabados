data = "ਹੋ ਜੋ ਯਾ ਕੀ ਏਕ ਬਾਰ; ਚੌਪਈ ਕੋ ਕਹੈ ॥੪੦੪॥"
page = 1388

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Who will even once recite this Chaupai-prayer.404."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਇਕ ਵਾਰ ਇਸ ਚੌਪਈ ਦਾ ਪਾਠ ਕਰੇਗਾ ॥੪੦੪॥"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਹੋ ਜੋ, ਯਾਕੀ ਏਕ ਬਾਰ; ਚੌਪਈ ਕੋ ਕਹੈ ॥੨੮॥"