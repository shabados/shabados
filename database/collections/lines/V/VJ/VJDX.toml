[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਸਿਖੀ ਦਾ ਸਮਝਣਾ; ਜੋਤੀ ਜੋਤਿ ਜਗਾਵਣਹਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Understanding of the Sikh life is like kindling the flame of the Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਸਿਖੀ ਦਾ ਸਮਝਣਾ (ਜੋਤੀ) ਪਰਮਾਤਮਾ ਦੀ ਜੋਤ ਦੇ ਜਗਾਉਣ ਵਾਲਾ ਹੈ (ਭਾਵ ਸਾਰੇ ਉਸ ਦੀ ਜੋਤ ਹੀ ਦਿੱਸਦੀ ਹੈ, 'ਤਿਸਦੈ ਚਾਨਣਿ ਸਭ ਮਹਿ ਚਾਨਣੁ ਹੋਇ')।"