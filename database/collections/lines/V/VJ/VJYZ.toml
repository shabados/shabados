[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬੈਠ ਹੁਤੇ ਰਣਧੀਰ ਜਤੀ ਜਹ ॥"
page = 234

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Hearing these words of Ram, that lady Surpanakha went there were Lakshman was sitting."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਰਣਧੀਰ ਜਤੀ ਲਛਮਣ ਬੈਠਾ ਹੋਇਆ ਸੀ।"