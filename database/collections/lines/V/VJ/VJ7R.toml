[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਮਨ; ਨਾਮ ਸਿਉ ਕਰਿ ਪ੍ਰੀਤਿ ॥"
page = 1006
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, embrace thou love for Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ! ਤੂੰ ਸਾਈਂ ਦੇ ਨਾਮ ਨਾਲ ਪਿਰਹੜੀ ਪਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, be in love with the Naam, the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪਿਆਰੇ! ਤੂੰ ਨਾਂਮ ਕੇ ਸਾਥ ਪ੍ਰੀਤ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਨਾਲ ਪਿਆਰ ਪਾਈ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਸਿਉ = ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, ama el Nombre del Señor."