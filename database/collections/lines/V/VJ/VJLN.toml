[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਧਨੁ ਖਟਿਓ; ਜਾ ਕਾ. ਨਾਹਿ ਸੁਮਾਰੁ ॥"
page = 185
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have earned the wealth of God's Name which is beyond reckoning."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹਰੀ ਨਾਮ ਦੀ ਦੌਲਤ ਕਮਾਈ ਹੈ ਜਿਹੜੀ ਗਿਣਤੀ ਤੋਂ ਬਾਹਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Earn the wealth of the Lord, which is beyond estimation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਜਿਸ ਕਾ ਅੰਤ ਨਹੀਂ ਸੋ ਹਰੀ ਧਨ ਖਟਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇਹੜਾ ਮਨੁੱਖ ਗੁਰਮੁਖਾਂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਬੈਠਦਾ ਹੈ ਉਸ ਨੇ) ਉਹ ਹਰਿ-ਨਾਮ ਧਨ ਕਮਾ ਲਿਆ ਜਿਸ ਦਾ ਅੰਦਾਜ਼ਾ ਨਹੀਂ ਲੱਗ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖਟਿਓ = ਖੱਟਿਆ, ਖੱਟ ਲਿਆ। ਜਾ ਕਾ = ਜਿਸ (ਧਨ) ਦਾ। ਸੁਮਾਰੁ = ਅੰਦਾਜ਼ਾ, ਮਾਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Obtenga las riquezas de Dios, que son mas de las que podamos contar."