[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਤਿਤ. ਉਧਾਰਣੁ; ਕ੍ਰਿਪਾ ਨਿਧਾਨੁ ॥"
page = 900
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is the Saviour of the sinners and the Treasure of mercy."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਾਪੀਆਂ ਨੂੰ ਤਾਰਨ ਵਾਲਾ ਅਤੇ ਰਹਿਮਤ ਦਾ ਖਜਾਨਾਂ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Savior of sinners, the treasure of mercy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਕ੍ਰਿਪਾ ਨਿਧਾਨੁ) ਗੁਰੂ ਪਰਮੇਸ੍ਵਰ ਪਾਪੀਓਂ ਕੇ ਉਧਾਰਨੇਹਾਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰੂ ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗੇ ਹੋਇਆਂ ਨੂੰ ਵਿਕਾਰਾਂ ਤੋਂ ਬਚਾਣ ਵਾਲਾ ਹੈ, ਗੁਰੂ ਕਿਰਪਾ ਦਾ ਖ਼ਜ਼ਾਨਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿਤੁ ਉਧਾਰਣੁ = ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗੇ ਹੋਇਆਂ ਨੂੰ ਬਚਾਣ ਵਾਲਾ। ਨਿਧਾਨੁ = ਖ਼ਜ਼ਾਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es el Purificador de los malhechores, el Tesoro de Misericordia."