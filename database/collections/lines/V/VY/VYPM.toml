[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਰਾਗ਼ੇ ਜਹਾ ਆਫ਼ਤਾਬੇ ਯਮਨ ॥੨੪॥"
page = 1417

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "One was the light of the universe and the other sun of the Yamanee Skies.(24)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਯਮਨ ਦੇ ਸੂਰਜ ਵਰਗਾ ਲੜਕਾ ਉਸ ਮੋਰੀ ਵਿਚੋਂ ਇਕ ਦੂਜੇ ਨੂੰ ਵੇਖਦੇ ਸਨ ॥੨੪॥"