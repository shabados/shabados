[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਨਾਮੁ ਅਚਰਜੁ; ਪ੍ਰਭੁ ਆਪਿ ਸੁਣਾਏ ॥"
page = 666
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wondrous is the God's Name, which the Lord Himself preaches."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਦਭੁਤ ਹੈ ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ। ਪ੍ਰਭੂ ਖੁਦ ਹੀ ਇਸ ਦਾ ਪ੍ਰਚਾਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord's Name is wonderful! God Himself imparts it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਨਾਮ ਅਸਚਰਜੁ ਰੂਪੁ ਹੈਂ ਅਰ ਗੁਰੂ ਰੂਪ ਹੋ ਕੇ ਪ੍ਰਭੂ ਨੇ ਆਪ ਹੀ ਸੁਣਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹੈਰਾਨ ਕਰਨ ਵਾਲੀ ਤਾਕਤ ਵਾਲਾ ਹੈ। (ਪਰ ਇਹ ਨਾਮ) ਪ੍ਰਭੂ ਆਪ ਹੀ (ਕਿਸੇ ਵਡ-ਭਾਗੀ ਨੂੰ) ਸੁਣਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਚਰਜੁ = ਹੈਰਾਨ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Maravilloso es el Nombre de Dios, el Señor Mismo habla de Él."