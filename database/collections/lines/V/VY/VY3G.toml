[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਨਕੁ ਕੰਨੁ ਫੜਿ ਵਢੀਐ; ਰਾਵੈ ਪਰ ਨਾਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The ears and nose are chopped of the man who ravishes an other's wife."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੋ ਪਰਾਈ ਇਸਤ੍ਰੀ ਨੂੰ ਭੋਗਦਾ ਹੈ ਉਸ ਦੇ ਨੱਕ ਕੰਨ ਫੜ ਕੇ ਵੱਢੇ ਜਾਂਦੇ ਹਨ।"