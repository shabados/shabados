[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੋਇਲੜਾ ਦਿਨ ਚਾਰਿ, ਗੁਰਮੁਖਿ ਜਾਣੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Gurmukh knows this world as a place of rest for a few days."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਸੰਸਾਰ) ਚਹੁੰ ਦਿਨਾਂ ਲਈ ਗੋਇਲ ਵਾਸੇ (ਵਾਂਙੂ) ਗੁਰਮੁਖ ਜਾਣਦੇ ਹਨ।"