[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਹੰਬੁਧਿ ਕਾ ਭਇਆ ਬਿਨਾਸ ॥"
page = 891
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Likewise thy haughty intellect shall be annulled,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਤੇਰੀ ਹੰਕਾਰੀ ਮੱਤ ਨਾਸ ਹੋ ਜਾਊਗੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your egotistical intellect shall be dispelled,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਸਤਿਸੰਗ ਕੀਆ ਹੈ, ਤਿਨ ਕੀ ਅਹੰਬੁਧੀ ਕਾ ਬਿਨਾਸ ਹੁਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਹੜਾ ਮਨੁੱਖ ਇਹ ਉੱਦਮ ਕਰਦਾ ਹੈ ਉਸ ਦੀ) ਹਉਮੈ ਵਾਲੀ ਅਕਲ ਦਾ ਨਾਸ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਹੰਬੁਧਿ = ਹਉਮੈ ਵਾਲੀ ਅਕਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Te verás liberado de tu ego"