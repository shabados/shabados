[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਬ ਕਹੁ ਰਾਮ; ਭਰੋਸਾ ਤੋਰਾ ॥"
page = 328
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Say now that my trust is in Thee, O Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੱਸੋ! ਹੁਣ ਜਦ ਮੇਰਾ ਯਕੀਨ ਤੇਰੇ ਉਤੇ ਹੀ ਹੈ, ਹੇ ਸਾਹਿਬ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If I say now that my trust is in You alone, Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਅਬ ਕਹੁ ਜੇ ਰਾਮ ਵਿਖੇ ਤੇਰਾ ਭਰੋਸਾ ਹੋ ਜਾਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਕਬੀਰ! ਪ੍ਰਭੂ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ) ਹੁਣ ਆਖ-ਹੇ ਪ੍ਰਭੂ! ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਇਕ ਤੇਰਾ ਆਸਰਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਬ = ਹੁਣ। ਕਹੁ = ਆਖ। ਰਾਮ = ਹੇ ਪ੍ਰਭੂ! ਤੋਰਾ = ਤੇਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si uno dice, oh Señor, yo me apoyo sólo en Ti,"