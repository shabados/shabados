[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੂਜਰੀ ਅਸਟਪਦੀਆ ਮਹਲਾ ੧ ਘਰੁ ੧ ॥"
page = 503
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Gujri Ashtpadis. 1st Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੂਜਰੀ ਅਸ਼ਟਾਪਤੀਆਂ। ਪਹਿਲੀ ਪਤਿਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Goojaree, Ashtpadheeyaa, First Mehl, First House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਗੂਜਰੀ, ਘਰ ੧ ਵਿੱਚ ਗੁਰੂ ਨਾਨਕਦੇਵ ਜੀ ਦੀ ਅੱਠ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Guyeri, Ashtapadis, Mejl Guru Nanak, Primer Canal Divino."