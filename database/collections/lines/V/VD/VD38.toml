[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਡਰੈ. ਜਿ ਪਾਪ ਕਮਾਵਦਾ; ਧਰਮੀ ਵਿਗਸੇਤੁ ॥"
page = 84
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, alone who commits sins is in fear and the virtuous one rejoices."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹੀ ਜੋ ਗੁਨਾਹ ਕਰਦਾ ਹੈ, ਭੈ ਵਿੱਚ ਹੈ ਅਤੇ ਨੇਕ ਪੁਰਸ਼ ਖੁਸ਼ੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The one who commits sins lives in fear, while the one who lives righteously rejoices."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਸੋ ਪੁਰਸ ਭੈ ਕਰਤਾ ਹੈ, ਜੋ ਪਾਪੋਂ ਕੋ ਕਮਾਵਤਾ ਹੈ, ਔਰ ਧਰਮ ਵਾਲੇ ਪੁਰਸ (ਵਿਗਸੇਤੁ) ਪ੍ਰਸਿੰਨ ਰਹਤੇ ਹੈਂ॥ ਇਸ ਮੇਂ ਹੇਤੂ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਾਪ ਕਰਨ ਵਾਲੇ ਨੂੰ (ਰੱਬ ਤੋਂ) ਡਰ ਲੱਗਦਾ ਹੈ, ਤੇ ਧਰਮੀ (ਵੇਖ ਕੇ) ਖਿੜਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਿਗਸੇਤੁ = ਖ਼ੁਸ਼ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo el que comete faltas tiene miedo, los que no, viven en Dicha."