[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਚੀ ਸੰਗਤਿ; ਸੰਤ ਕਥਾ ਰਸੁ ॥"
page = 486
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The society of saints the relish of saints converse,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਦਾ ਮੇਲ-ਮਿਲਾਪ, ਸਾਧੂਆਂ ਦੀ ਕਥਾ ਵਾਰਤਾ ਦਾ ਸੁਆਦ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord, God of gods, grant me the Society of the Saints,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸੰਤ ਚੀ) ਸੰਤੋਂ ਕੀ ਸੰਗਤ ਦੇਹੁ ਸੰਤੋਂ ਕੀ ਕਥਾ ਮੇਂ ਮੇਰਾ (ਰਸੁ) ਪ੍ਰੇਮ ਹੋਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦੇਵਤਿਆਂ ਦੇ ਦੇਵਤੇ ਪ੍ਰਭੂ! ਮੈਨੂੰ ਸੰਤਾਂ ਦੀ ਸੰਗਤਿ ਬਖ਼ਸ਼, ਮਿਹਰ ਕਰ, ਮੈਂ ਸੰਤਾਂ ਦੀ ਪ੍ਰਭੂ-ਕਥਾ ਦਾ ਰਸ ਲੈ ਸਕਾਂ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੀ = ਦੀ। ਰਸੁ = ਆਨੰਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios de dioses, bendíceme con la Sociedad de los Santos,"