[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਸੇਵਕ ਕੇ; ਕਾਰਜ ਰਾਸਿ ॥"
page = 286
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the affairs of that slave are set right."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਗੋਲੇ ਦੇ ਕੰਮ ਸੌਰ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- that humble servant's affairs are resolved."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸੇਵਕ ਕੇ ਸੰਪੂਰਨ ਮੋਖ ਆਦੀ ਕਾਰਜ ਰਾਸ ਹੋ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਸੇਵਕ ਦੇ ਸਾਰੇ ਕੰਮ ਸਿਰੇ ਚੜ੍ਹ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਸਿ = ਸਫਲ, ਸਿੱਧ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y entonces serán satisfechos todos sus deseos."