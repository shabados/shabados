[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਜਨਾ ਕੈ ਸੰਗਿ; ਹਉਮੈ ਰੋਗੁ ਜਾਇ ॥"
page = 961
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The ailment of self-conceit is eradicated in the society of saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਦੀ ਸੰਗਤ ਅੰਦਰ, ਸਵੈ-ਹੰਗਤਾਂ ਦੀ ਬਿਮਾਰੀ ਕੱਟੀ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Associating with the humble Saints, the disease of egotism is eradicated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨਾ ਕਾ ਸੰਗ ਦੇਹੁ ਜਿਸ ਕਰ ਕੇ ਹਉਮੈ ਕਾ ਰੋਗ ਜਾਇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾਂ ਦੀ ਸੰਗਤ ਵਿਚ ਰਹਿ ਕੇ ਮੇਰਾ ਹਉਮੈ ਦਾ ਰੋਗ ਕੱਟਿਆ ਜਾਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "para que viva dedicado a esta tarea"