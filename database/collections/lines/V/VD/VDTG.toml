[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਸੇਵਾ ਤਿਸੁ ਪਾਰਬ੍ਰਹਮ; ਗੁਰ ਤੇ ਮਤਿ ਲੇਹ ॥੩॥"
page = 812
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Receiving instruction from the Guru, serve thou that supreme Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਪਾਸੋਂ ਉਪਦੇਸ਼ ਲੈ ਕੇ ਤੂੰ ਉਸ ਸ਼ਰੋਮਣੀ ਸਾਹਿਬ ਦੀ ਘੋਲ ਕਮਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So serve that Supreme Lord God, and accept the Guru's Teachings. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਭਾਈ! ਤਿਸ ਪਾਰਬ੍ਰਹਮ ਕੀ ਸਦਾ ਸੇਵਾ ਕਰੋ, ਪਰੰਤੂ ਸਤਿਗੁਰਾਂ ਕੇ ਉਪਦੇਸ ਦ੍ਵਾਰਾ (ਮਤਿ) ਬੁਧ ਲੇ ਕਰ ਤਿਸ ਕੇ ਨਾਮ ਕੋ ਜਾਪੇ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਤੋਂ ਸਿੱਖਿਆ ਲੈ ਕੇ ਉਸ ਪਰਮਾਤਮਾ ਦੀ ਸੇਵਾ-ਭਗਤੀ ਕਰਿਆ ਕਰੋ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵਾ = ਭਗਤੀ। ਤੇ = ਤੋਂ। ਮਤਿ = ਅਕਲ, ਸਿੱਖਿਆ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sirve a ese Señor Supremo y sé instruido por la Sabiduría del Guru.(3)"