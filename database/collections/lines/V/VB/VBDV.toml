[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਾਟ ਪਟੰਬਰ ਗਹਣਿਆਂ; ਸੋਹਹਿਂ ਸਰਬੰਗੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The fully grown up women are there decorated with silken robes and ornaments."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੱਟ ਦੇ ਕੱਪੜੇ (ਪਹਿਰਣ ਨੂੰ। ਗਹਿਣੇ (ਸਰਬੰਗਾਂ) ਸਾਰੇ ਅੰਗਾਂ ਦੇ (ਪੂਰਣ ਲਈ, ਕੜੇ ਬੁਹੱਟੇ, ਵਾਲੇ ਆਦ) ਸ਼ੋਭਦੇ ਹੋਣ।"