[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੋ ਤਿਆਗੀ. ਵਿਰਲਾ ਕੋਇ ॥"
page = 1147
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rare is such a man of renunciation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਇੱਕ ਅੱਧਾ ਹੀ ਐਹੋ ਜਿਹਾ ਉਪਰਾਮ ਪੁਰਸ਼ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such a renunciate is very rare."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਐਸਾ ਤਿਆਗੀ ਕੋਈ ਵਿਰਲਾ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹੋ ਜਿਹਾ ਵੈਸ਼ਨਵ ਹੀ ਅਸਲ ਤਿਆਗੀ ਹੈ, ਪਰ) ਇਹੋ ਜਿਹਾ ਤਿਆਗੀ (ਜਗਤ ਵਿਚ) ਕੋਈ ਵਿਰਲਾ ਮਨੁੱਖ ਹੀ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਐਸੋ = ਇਹੋ ਜਿਹਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, raro es encontrar un ser con tal desapego,"