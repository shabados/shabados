[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਨਹੁ ਜਟਾਧਰ ਕੀ ਜਟ ਤੇ; ਜਨੁ ਰੋਸ ਕੈ ਗੰਗ ਕੋ ਨੀਰ ਢਰਿਓ ਹੈ ॥੬੮॥"
page = 82

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "As if the current of Ganga hath gushed out of he hair of Shiva.68.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਸ਼ਿਵ ('ਜਟਾਧਰ') ਦੀਆਂ ਜਟਾਵਾਂ ਤੋਂ ਗੁੱਸੇ ਨਾਲ ਗੰਗਾ-ਜਲ ਡਿਗ ਰਿਹਾ ਹੋਵੇ ॥੬੮॥"