[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੀ ਪ੍ਰੀਤਿ; ਦੁਖੁ ਲਗੈ ਨ. ਕੋਇ ॥"
page = 391
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Lord's love agony touches man not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਪ੍ਰੇਮ ਦੁਆਰਾ, ਆਦਮੀ ਨੂੰ ਕਸ਼ਟ ਨਹੀਂ ਵਾਪਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Love of God, one is not touched by pain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭ ਕੀ ਪ੍ਰੀਤ ਸੇ ਕੋਈ ਦੁਖ ਨਹੀਂ ਲਗਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੀ ਪ੍ਰੀਤ ਦਾ ਸਦਕਾ (ਉਸ ਨੂੰ) ਕੋਈ ਦੁੱਖ ਪੋਹ ਨਹੀਂ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਗੈ ਨ = ਪੋਹ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En el Amor de Dios el dolor no existe."