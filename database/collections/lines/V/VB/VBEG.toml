[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਲੌ ਤ ਏਕੈ ਮਗੁ ਚਲੌ; ਰਹੇ, ਰਹੌ ਤਿਹ ਗਾਉ ॥"
page = 921

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Corne, let us take the same path and live side by side,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੇ ਚਲੋਗੇ ਤਾਂ (ਤੁਹਾਡੇ ਨਾਲ) ਇਕੋ ਮਾਰਗ ਉਤੇ ਚਲਾਂਗੀ, (ਜਿਥੇ) ਰਹੋਗੇ, ਉਸ ਪਿੰਡ ਵਿਚ ਰਹਾਂਗੀ।"