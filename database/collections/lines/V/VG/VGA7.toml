[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਜਨਮ, ਭ੍ਰਮਤੌ ਹੀ ਆਇਓ; ਮਾਨਸ ਜਨਮੁ ਦੁਲਭਾਹੀ ॥"
page = 1207
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wandering in various existences, thou has come to attain this precious human birth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਜੂਨੀਟਾਂ ਅੰਦਰ ਭਟਕ ਕੇ ਤੈਂਨੂੰ ਇਹ ਅਮੋਲਕ ਮਨੁੱਖਾ ਜਨਮ ਹੱਥ ਲੱਗਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You wandered through countless incarnations, until finally you attained this priceless human birth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੇਕ ਜਨਮੋਂ ਮੇਂ ਭ੍ਰਮਤਾ ਹੂਆ ਆਯਾ ਹੈ ਔਰ ਮਨੁਖ ਜਨਮੁ ਦੁਰਲਭ ਪ੍ਰਾਪਤਿ ਭਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ! ਤੂੰ ਅਨੇਕਾਂ ਹੀ ਜਨਮਾਂ ਵਿਚ ਭਟਕਦਾ ਆਇਆ ਹੈਂ। ਹੁਣ ਤੈਨੂੰ ਦੁਰਲੱਭ ਮਨੁੱਖਾ ਜਨਮ ਮਿਲਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭ੍ਰਮਤੌ = ਭਟਕਦਾ। ਦੁਲਭਾਹੀ = ਦੁਰਲੱਭ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vagaste de nacimiento en nacimiento y por fin arribaste a la preciosa investidura humana,"