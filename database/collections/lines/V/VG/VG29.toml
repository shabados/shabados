[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬੈਠਿ ਖਾਟ ਪਰ ਪ੍ਰਮੁਦ ਬਢਾਯੋ ॥"
page = 860

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In the meantime silk-weaver walked in the house, he sat down on the bedstead and showered love."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੰਜੇ ਉਤੇ ਬੈਠ ਕੇ ਪ੍ਰਸੰਨ ਹੋਇਆ।"