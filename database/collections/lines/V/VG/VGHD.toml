[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਸਿਮਰਨਿ; ਭਉ ਦੁਖ ਹਰੈ ॥"
page = 986
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose meditation dread and distress depart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਇਬਾਦਤ ਦੁਆਰਾ ਡਰ ਅਤੇ ਦੁਖੜਾ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating on Him, fear and pain are taken away."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਸਿਮਰਨੇ ਕਰ ਜਨਮ ਮਰਨ ਕਾ ਦੁਖ ਅਰੁ ਭੈ ਹਰਿਆ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਸਿਮਰਨ ਦੀ ਬਰਕਤਿ ਨਾਲ ਮਨੁੱਖ ਹਰੇਕ ਡਰ ਅਤੇ ਸਾਰੇ ਦੁੱਖ ਦੂਰ ਕਰ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰੈ = (ਮਨੁੱਖ) ਦੂਰ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno es liberado de los miedos y de las aflicciones."