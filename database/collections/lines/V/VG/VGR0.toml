[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰੂਪ ਤਿਹਾਰੋ ਹੇਰਿ ਕੈ; ਬੇਗਮ ਰਹੀ ਲੁਭਾਇ ॥"
page = 910

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Admiring your handsomeness, the Rani has fallen in love with you,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੁਹਾਡੇ ਰੂਪ ਨੂੰ ਵੇਖ ਕੇ ਬੇਗਮ ਲੁਭਾਇਮਾਨ ਹੋ ਗਈ ਹੈ।"