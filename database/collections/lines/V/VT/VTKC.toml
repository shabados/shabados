[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਨੈ ਕਉਨ ਕੇਤੋ ॥੬੭੨॥"
page = 270

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then he met the mother of Lakshman and the brother Bharat and Shatrughan touched his feet. On account of the joy of union, unaccountable charity was given.672."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਉਸ ਨੂੰ ਕੌਣ ਗਿਣੇ ਕਿ ਕਿੰਨਾ ਕੁ ਸੀ? ॥੬੭੨॥"