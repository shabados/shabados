[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਤੂੰ. ਮਤ ਮਾਣੁ ਕਰਹਿ, ਜਿ ਹਉ ਕਿਛੁ ਜਾਣਦਾ; ਗੁਰਮੁਖਿ ਨਿਮਾਣਾ ਹੋਹੁ ॥"
page = 441
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man, take not pride that thou knowest some thing but be thou pious and humble."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਤੂੰ ਹੰਕਾਰ ਨਾਂ ਕਰ ਕਿ ਤੂੰ ਕੁਝ ਜਾਣਦਾ ਹੈਂ। ਤੂੰ ਪਵਿੱਤ੍ਰ ਅਤੇ ਅਜਿਜ਼ ਥੀਂ ਵੰਞ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mind, don't be so proud of yourself, as if you know it all; the Gurmukh is humble and modest."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਤੂੰ ਇਸ ਬਾਰਤਾ ਕਾ ਮਤ ਅਭਿਮਾਨ ਕਰ ਜੋ ਮੈਂ ਕੁਛ ਜਾਨਤਾ ਹੂੰ, ਗੁਰਮੁਖ ਹੋ ਕਰ ਨਿਰਮਾਨ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਵੇਖੀਂ, ਕਿਤੇ ਇਹ ਮਾਣ ਨਾਹ ਕਰ ਬੈਠੀਂ ਕਿ ਮੈਂ ਸਿਆਣਾ ਹਾਂ, ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਮਾਣ ਤਿਆਗੀ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿ = ਕਿ। ਹਉ = ਮੈਂ। ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ। ਨਿਮਾਣਾ = ਆਜਿਜ਼, ਮਾਣ-ਰਹਿਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, no crees orgullo de tus conocimientos, pues aquél que voltea hacia Dios, es humilde."