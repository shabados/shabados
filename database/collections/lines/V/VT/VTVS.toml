[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਮਿ ਨ ਮਰੈ; ਨ ਆਵੈ. ਨ ਜਾਇ ॥"
page = 370
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is born not, nor does he die. He comes and goes not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਜੰਮਦਾ ਨਹੀਂ, ਨਾਂ ਹੀ ਮਰਦਾ ਹੈ। ਉਹ ਆਉਂਦਾ ਤੇ ਜਾਂਦਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is not born, and he does not die; he does not come or go."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਵਹੁ ਪੁਰਖ ਨ ਤੋ ਜਨਮ ਕਰ ਆਵੇਗਾ ਔਰ ਨ ਮਰ ਕਰ ਜਾਵੇਗਾ, ਭਾਵ ਏਹ ਕਿ ਆਵਾਗਵਨ ਸੇ ਰਹਤ ਹੋਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ (ਮੁੜ ਮੁੜ) ਨਾਹ ਜੰਮਦਾ ਹੈ ਨਾਹ ਮਰਦਾ ਹੈ ਉਹ (ਜਗਤ ਵਿਚ ਮੁੜ ਮੁੜ) ਨਾਹ ਆਉਂਦਾ ਹੈ ਨਾਹ (ਇਥੋਂ ਮੁੜ ਮੁੜ) ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ese ser ya no nace ni muere más, ni va ni viene,"