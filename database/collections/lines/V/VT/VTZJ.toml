[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵਣ ਜਾਣ ਰਹੇ; ਸੁਖੁ ਪਾਇਆ ॥"
page = 1156
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My comings and goings have ceased, and I have obtained peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਆਉਣੇ ਅਤੇ ਜਾਣੇ ਮੁਕ ਗਏ ਹਨ ਅਤੇ ਮੈਨੂੰ ਆਰਾਮ ਪਰਾਪਤ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Coming and going in reincarnation ends, and peace is found."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਨਮ ਮਰਨ ਤਿਸ ਕਾ ਰਹਿ ਚੁਕਾ ਹੈ ਔਰ ਆਤਮ ਸੁਖੁ ਤਿਸ ਨੇ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਮੁੱਕ ਗਏ, ਉਸ ਨੇ ਆਤਮਕ ਆਨੰਦ ਪ੍ਰਾਪਤ ਕਰ ਲਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਹੇ = ਮੁੱਕ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "él ya no va ni viene, logrando el Éxtasis, y mira, oh, dice Nanak,"