data = "ਪੂਜਿਯੋ ਚਰਨ ਪਿਤਾ ਕੇ ਜਾਈ ॥"
page = 544

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Krishna went away happily and on reaching his home, he worshipped the feet of his father"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਾ ਕੇ ਪਿਤਾ ਦੇ ਚਰਨਾਂ ਦੀ ਪੂਜਾ ਕੀਤੀ।"