[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਤਿ ਕਾ ਗਰਬੁ. ਨ ਕਰਿ; ਮੂਰਖ ਗਵਾਰਾ ॥"
page = 1127
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O stupid fool, be thou not proud of thy caste."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਉਜੱਡਾ, ਮੂੜ੍ਹ! ਤੂੰ ਆਪਣੀ ਜਾਤ ਵਰਨ ਦਾ ਹੰਕਾਰ ਨਾਂ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Do not be proud of your social class and status, you ignorant fool!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੂਰਖ ਗਵਾਰਾ) ਅਤੀ ਮੂਰਖ ਬ੍ਰਾਹਮਣ! ਜਾਤ ਕਾ ਗਰਬ ਮਤ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ! ਹੇ ਗੰਵਾਰ! (ਉੱਚੀ) ਜਾਤਿ ਦਾ ਮਾਣ ਨਾਹ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂਰਖ = ਹੇ ਮੂਰਖ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No te vanaglories de tu casta, oh tonto,"