[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕਾ ਅੰਤੁ; ਨ ਜਾਣੈ ਕੋਈ ॥"
page = 1036
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His limit no one knows."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਓੜਕ ਨੂੰ ਕੋਈ ਨਹੀਂ ਜਾਣਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one knows His limits."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕਾ ਅੰਤ ਕੋਈ ਭੀ ਨਹੀਂ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਭੀ ਜੀਵ ਪਰਮਾਤਮਾ ਦੀ ਤਾਕਤ ਦਾ ਅੰਤ ਨਹੀਂ ਜਾਣ ਸਕਦਾ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, nadie conoce la Extensión de mi Dios"