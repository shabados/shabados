[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਜਿੰਦਗੀ ਦਾ ਅੰਮ੍ਰਿਤ ਹਿਰਦੇ ਰੂਪੀ ਘਰ ਵਿਚ ਹੀ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਆਬਿ ਹੈਵਾਂ ਅੰਦਰੂਨਿ ਖ਼ਾਨਾ ਹਸਤ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Then, with its lightening, the hearts of the enemy get singed. (156)"