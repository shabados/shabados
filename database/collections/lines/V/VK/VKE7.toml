[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗੁ ਬਿਹਾਗੜਾ ਚਉਪਦੇ ਮਹਲਾ ੫ ਘਰੁ ੨ ॥"
page = 537
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rag Bihagra Chaupade 5th Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਬਿਹਾਗੜਾ ਚਉਪਦੇ ਪੰਜਵੀਂ ਪਾਤਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Bihaagraa, Chau-Padhay, Fifth Mehl, Second House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਬਿਹਾਗੜਾ, ਘਰ ੨ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਚਾਰ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Bijagra, Mejl Guru Aryan, Quinto Canal Divino, Chau-Padas, Segunda Casa."