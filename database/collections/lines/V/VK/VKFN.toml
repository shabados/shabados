[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੈ ਰੰਗਿ ਰਾਤੇ; ਸਹਜਿ ਸੁਭਾਇ ॥"
page = 841
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With Thy love, O Lord, they are easily imbued."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਪ੍ਰੀਤ ਨਾਲ, ਹੇ ਸਾਈਂ! ਉਹ ਸੁਭਾਵਕ ਹੀ ਰੰਗੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They are automatically imbued with Your Love, O Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਹਾਰਾਜ! ਜੋ ਤੇਰੇ ਪ੍ਰੇਮ ਮੇਂ ਰਤੇ ਹੈਂ ਤਿਨੋਂ ਕਾ ਸਾਂਤੀ ਸੁਭਾਵ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! (ਗੁਰੂ ਦੀ ਸਰਨ ਆਉਣ ਵਾਲੇ ਮਨੁੱਖ) ਤੇਰੇ ਪਿਆਰ-ਰੰਗ ਵਿਚ ਟਿਕੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇਰੈ ਸੰਗਿ = ਤੇਰੇ (ਪ੍ਰੇਮ-) ਰੰਗ ਵਿਚ। ਰਾਤੇ = ਰੰਗੇ ਹੋਏ। ਸਹਜਿ = ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ। ਸੁਭਾਇ = ਪਿਆਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ellos son espontáneamente imbuidos en Tu Amor, oh Dios."