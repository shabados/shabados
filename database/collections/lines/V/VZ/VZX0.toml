[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਤਿਪਾਲੈ; ਜੀਅਨ ਬਹੁ ਭਾਤਿ ॥"
page = 292
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord cherishes the beings in diverse ways."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਅਨੇਕਾਂ ਤਰੀਕਿਆਂ ਨਾਲ ਜੀਵਾਂ ਦੀ ਪਰਵਰਸ਼ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He cherishes His living beings in so many ways."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਪ੍ਰਕਾਰ ਸੇ ਜੀਵੋਂ ਕੋ ਪ੍ਰਤਿਪਾਲਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵਾਂ ਨੂੰ ਕਈ ਤਰੀਕੀਆਂ ਨਾਲ ਪਾਲਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅਨ = ਜੀਵਾਂ ਨੂੰ। ਬਹੁ ਭਾਤਿ = ਕਈ ਤਰੀਕਿਆਂ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De múltiples maneras provee el Señor a Sus criaturas"