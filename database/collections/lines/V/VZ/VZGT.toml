[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚਤੁਰਦਾਸੁ ਮੂਲਾ ਕਪੂਰੁ; ਹਾੜੂ ਗਾੜੂ ਵਿਜ ਵਿਚਾਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Chatur Das and Mula are kalpur Kshatryias and Haru and Garu belong to Vij caste."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਚਤਰਦਾਸ ਤੇ ਮੂਲਾ ਜਾਤ ਦੇ ਕਪੂਰ ਖੱਤ੍ਰ੍ਰੀ ਸਨ ਤੇ ਹਾੜੂ ਤੇ ਗਾੜੂ ਵਿਚਾਰੇ ਜਾਤ ਦੇ ਵਿੱਜ ਸਨ।"