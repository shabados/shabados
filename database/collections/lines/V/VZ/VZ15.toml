[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਰਾਇਣ; ਪ੍ਰਗਟ ਕੀਨੋ ਪਰਤਾਪ ॥"
page = 868
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord manifests His slave's glory."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਆਪਣੇ ਸੇਵਕ ਦੀ ਵਡਿਆਈ ਉਘੀ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord has revealed His glory."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਰਾਇਣ ਨੇ ਹੀ ਹਮਾਰਾ ਪਰਤਾਪ ਪਰਗਟ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹਨਾਂ ਦੇ ਅੰਦਰ ਆਪਣਾ) ਤੇਜ-ਪਰਤਾਪ ਪਰਗਟ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A través de la Gracia del Señor, Su Gloria"