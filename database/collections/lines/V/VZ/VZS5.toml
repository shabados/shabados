[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੀਤਲ ਭਏ; ਹਰਿ ਹਰਿ ਜਸੁ ਜਾਪਿਆ ॥੨॥"
page = 804
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "becomes cool, by uttering the Lord God's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦੀ ਕੀਰਤੀ ਉਚਾਰਨ ਕਰਨ ਦੁਆਰਾ ਠੰਢਾ-ਠਾਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "becomes cool, chanting the Praises of the Lord, Har, Har. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਜਬ ਤੇਰੇ ਹਰਿ ਨਾਮ ਕੇ ਜਸ ਕੋ ਜਪਨਾ ਕੀਆ ਹੈ ਤਬ ਮੇਰੇ ਅੰਤਸਕਰਣ ਸੀਤਲ ਭਏ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੇ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਕਰਦੇ ਹਨ, (ਉਹਨਾਂ ਦੇ ਹਿਰਦੇ) ਠੰਢੇ-ਠਾਰ ਹੋ ਜਾਂਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero cuando medité en el Señor fui confortado. (2)"