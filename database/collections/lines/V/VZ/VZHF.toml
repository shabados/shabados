[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਜੰਤ ਸਭਿ ਤੁਧੁ ਉਪਾਏ; ਇਕਿ ਵੇਖਿ. ਪਰਸਣਿ ਆਇਆ ॥"
page = 918
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the sentient beings Thou has created, O Lord, but so rare ones who see the Guru and seek his protection."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਪ੍ਰਾਣਧਾਰੀ ਤੂੰ ਹੀ ਰਚੇ ਹਨ, ਹੇ ਸਾਹਿਬ ਪਰ ਕੋਈ ਵਿਰਲਾ ਹੀ ਗੁਰਾਂ ਨੂੰ ਵੇਖਦਾ ਹੈ ਅਤੇ ਉਨ੍ਹਾਂ ਦੀ ਪਨਾਹ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All living beings and creatures were created by You; only some come to see the Guru, and seek His blessing."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੂਖਮ ਅਸਥੂਲ ਜੀਵ ਸਭ ਤੈਨੇ ਹੀ ਉਪਾਏ ਹੈਂ। ਇਕਨਾ ਗੁਰਮੁਖਾਂ ਨੇ ਤਾਂ ਤੇਰੇ ਸਰੂਪ ਕੋ ਦੇਖ ਲੀਆ ਹੈ ਏਕ ਜਗ੍ਯਾਸੂ ਸਤਿਸੰਗ ਕੋ ਅਬੀ ਪਰਸਣ ਆਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਸਾਰੇ ਜੀਅ ਜੰਤ ਤੂੰ ਹੀ ਪੈਦਾ ਕੀਤੇ ਹਨ (ਤੂੰ ਹੀ ਇਹਨਾਂ ਨੂੰ ਪ੍ਰੇਰਦਾ ਹੈਂ, ਤੇਰੀ ਪ੍ਰੇਰਨਾ ਨਾਲ ਹੀ) ਕਈ ਜੀਵ (ਗੁਰੂ ਦਾ) ਦੀਦਾਰ ਕਰ ਕੇ (ਉਸ ਦੇ) ਚਰਨ ਛੁਹਣ ਆਉਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਕਿ = ਕਈ ਜੀਵ। ਵੇਖਿ = (ਗੁਰੂ ਨੂੰ) ਵੇਖ ਕੇ। ਪਰਸਣਿ = (ਗੁਰੂ ਦੇ ਚਰਨ) ਪਰਸਣ ਲਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Creación es obra Tuya, pero extraordinario es aquél que lo reconoce y se postra ante el Guru."