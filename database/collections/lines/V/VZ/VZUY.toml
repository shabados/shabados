[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਬਾ ਬੋਲਨਾ. ਕਿਆ ਕਹੀਐ ॥"
page = 870
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Father, If I speak, what words should I utter?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਿਤਾ! ਜੇਕਰ ਮੈਂ ਬੋਲਾਂ, ਤਾਂ ਕਿਹੜੇ ਬਚਨ ਉਚਾਰਨ ਕਰਾਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O father, if I speak, what words should I utter?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਬੋਲਣਾ ਬਾਣੀ ਕਾ ਤੋ (ਕਿਆ) ਕੈਸਾ ਵਾ ਵਹੁ ਸ੍ਰੇਸਟ ਕਹੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਜਗਤ ਵਿਚ ਰਹਿੰਦਿਆਂ) ਕਿਹੋ ਜਿਹੇ ਬੋਲ ਬੋਲੀਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਆ ਬੋਲਨਾ = ਕਿਹੋ ਜਿਹੀ ਗੱਲ-ਬਾਤ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh padre, ¿qué podría uno platicarle al Santo?"