[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨੋਮ ਏਕ ਰੂਪੰ ਅਨੇਕੰ ਸਰੂਪੇ ॥"
page = 127

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Salutation to Thee, O One Lord pervading in many forms."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੂੰ) ਇਕ ਰੂਪ ਵਾਲਾ ਹੁੰਦਾ ਹੋਇਆ ਵੀ ਅਨੇਕ ਸਰੂਪਾਂ ਵਾਲਾ ਹੈਂ; (ਤੈਨੂੰ) ਨਮਸਕਾਰ ਹੈ।"