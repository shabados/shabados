[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮੁਸਲਮਾਣਾਂ ਸੂਅਰਹੁ; ਸਉਗੰਦ ਵਿਆਜੁ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The Musalmans pledge against the pork and the interest on money;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੁਸਲਮਾਨਾਂ ਨੇ ਸੂਰ ਦੇ ਮਾਸ ਥੋਂ ਅਰ ਵਿਆਜ ਦੇ ਖਾਣ ਥੋਂ ਸੌਂਹ ਪਾਈ ਹੋਈ ਹੈ।"