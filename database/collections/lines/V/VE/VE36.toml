[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਓਅੰਕਾਰ ਅਕਾਰੁ ਜਿਸ; ਸਤਿਗੁਰੁ ਪੁਰਖੁ ਸਿਰੰਦਾ ਸੋਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The Oankar whose form is the true Guru, is the true creator of universe."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਓਅੰਕਾਰ ਹੀ ਜਿਸ ਦਾ ਆਕਾਰ ਹੈ (ਸੋਈ) ਸਤਿਗੁਰ ਪੁਰਖ ਰਚਨਹਾਰਾ ਹੈ।"