[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਹੁ ਜੋਨੀ ਭਉਦਾ ਫਿਰੈ; ਜਿਉ. ਸੁੰਞੈਂ ਘਰਿ ਕਾਉ ॥"
page = 30
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He continues roaming about, in many existences, like a crow in a deserted house."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਖਣੇ ਮਕਾਨ ਵਿੱਚ ਕਾਂ ਦੀ ਮਾਨਿੰਦ, ਉਹ ਘਨੇਰੀਆਂ ਜੂਨੀਆਂ ਅੰਦਰ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through countless incarnations they wander lost, like crows in a deserted house."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚੌਰਾਸੀ ਲਾਖ ਜੂਨੀਓਂ ਮੇਂ ਐਸੇ ਭ੍ਰਮਤਾ ਫਿਰਤਾ ਹੈ, ਜੈਸੇ ਸੂੰਨ ਗ੍ਰਹ ਮੇਂ ਕਊਆ ਦੁਖੀ ਹੋ ਕਰ ਕਲਪਨਾ ਕਰਤਾ ਭ੍ਰਮਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਫਸ ਕੇ) ਉਹ ਅਨੇਕਾਂ ਜੂਨਾਂ ਵਿਚ ਭਟਕਦਾ ਹੈ (ਕਿਤੋਂ ਭੀ ਉਸ ਨੂੰ ਆਤਮਕ ਸ਼ਾਂਤੀ ਨਹੀਂ ਮਿਲਦੀ) ਜਿਵੇਂ ਕਿਸੇ ਸੁੰਞੇ ਘਰ ਵਿਚ ਕਾਂ ਜਾਂਦਾ ਹੈ (ਉਥੋਂ ਉਸ ਨੂੰ ਮਿਲਦਾ ਕੁਝ ਨਹੀਂ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਰਿ = ਘਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Entran en el ciclo de nacimientos y muertes y vagan por la vida en sufrimiento."