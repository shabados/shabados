[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਹੀ ਕੋ ਧਯਾਨ ਪ੍ਰਮਾਨਿ ਹੀਏ; ਜੋਊ ਕੇ ਅਬ ਹੈ, ਅਰ ਆਗੈ ਊ ਹ੍ਵੈ ਹੈ ॥੧੬॥"
page = 713

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Therefore, you should only meditate on Him, who is there in the present and who will also be there in future.16."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸੇ ਦਾ ਧਿਆਨ ਹਿਰਦੇ ਵਿਚ ਧਾਰਨ ਕਰ ਜੋ (ਪਹਿਲਾਂ) ਸੀ, ਹੁਣ ਹੈ ਅਤੇ ਭਵਿਖ ਵਿਚ ਹੋਵੇਗਾ ॥੧੬॥"