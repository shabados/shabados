[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੁਹਿਤਾ ਭਗਨੀ ਦੀਜਿਯਤ; ਬੇਦ ਬਿਧਾਨ ਬਨਾਇ ॥"
page = 978

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘The daughters and sisters are given away according to the tradition of Vedas."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਧੀ ਅਤੇ ਭੈਣ ਵੇਦ ਦੇ ਵਿਧਾਨ ਅਨੁਸਾਰ ਦਿੱਤੀਆਂ ਜਾਂਦੀਆਂ ਹਨ।"