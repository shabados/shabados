[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਸਾਧ; ਪ੍ਰਭੂ ਬਨਿ ਆਈ ॥੩॥"
page = 271
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak the man of faith is akin to the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਨੇਕ ਪੁਰਸ਼ ਦੀ ਸੁਆਮੀ ਨਾਲ ਰਹਿ ਆਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Holy are at one with God. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸੁ ਪ੍ਰਭੂ ਕੇ ਸਾਥ ਸੰਤੋਂ ਕੀ ਪ੍ਰੀਤੀ ਬਨ ਆਈ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਹੇ ਨਾਨਕ! ਸਾਧ ਤੇ ਪ੍ਰਭੂ ਦਾ ਪੱਕਾ ਪਿਆਰ ਪੈ ਜਾਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਨਿ ਆਈ = ਪੱਕੀ ਪ੍ਰੀਤ ਬੱਝ ਜਾਂਦੀ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor y Su Devoto forman la Unidad Verdadera.(3)"