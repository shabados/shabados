[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੂੜ ਮੁਗਧ; ਤੇਰਾ ਸੰਗੀ ਕਵਨ ॥"
page = 898
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O ignorant fool, who is friend of thine here."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੇਸਮਝ ਮੂਰਖ! ਤੇਰਾ ਏਕੇ ਕਿਹੜਾ ਦੋਸਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You ignorant fool, who is your companion?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਤੀ ਮੂਰਖ! ਕਹੁ ਤੇਰਾ ਕੌਨ ਸੰਗੀ ਹੈ, ਭਾਵ ਕੋਈ ਸੰਗੀ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ! (ਪ੍ਰਭੂ ਤੋਂ ਬਿਨਾ ਹੋਰ) ਤੇਰਾ ਕੌਣ ਸਾਥੀ (ਬਣ ਸਕਦਾ ਹੈ)?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂੜ = ਹੇ ਮੂਰਖ! ਮੁਗਧ = ਹੇ ਮੂਰਖ! ਸੰਗੀ = (ਅਸਲ) ਸਾਥੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, grandísimo tonto. ¿Quién te hace compañía?"