[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ ਪੂਰੇ ਭਾਣਾ ॥"
page = 628
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When it so pleased the Perfect True Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਪੂਰਨ ਸੱਚੇ ਗੁਰਾਂ ਨੂੰ ਇਸ ਤਰ੍ਹਾਂ ਚੰਗਾ ਲੱਗਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When it was pleasing to the Perfect True Guru,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਪੂਰੇ ਸਤਗੁਰੋਂ ਕੋ ਹਮਾਰਾ ਕਰਤਬ ਭਾਇ ਗਿਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ, ਹੇ ਭਾਈ!) ਜਦੋਂ ਗੁਰੂ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ ਜਦੋਂ ਗੁਰੂ ਤ੍ਰੁੱਠਦਾ ਹੈ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰ ਭਾਣਾ = ਗੁਰੂ ਨੂੰ ਚੰਗਾ ਲੱਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando tal fue la Voluntad del Señor,"