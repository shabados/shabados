data = "ਦੇਸ ਦੇਸ ਨਿਜੁ ਪ੍ਰਭ ਕੀ; ਪ੍ਰਭਾ ਬਿਖੇਰਿਹੌ ॥"
page = 828

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Now I will roam around different countries to spread God’s exaltations,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੁਣ ਮੈਂ) ਦੇਸ ਦੇਸਾਂਤਰਾਂ ਵਿਚ ਆਪਣੇ ਪ੍ਰਭੂ ਦੀ ਪ੍ਰਭੁਤਾ ਨੂੰ ਪ੍ਰਸਾਰਾਂਗਾ"