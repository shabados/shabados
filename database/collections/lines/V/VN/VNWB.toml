[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਈ; ਚਰਨ ਗੁਰ ਮੀਠੇ ॥"
page = 717
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O mother, to me, sweet are the Guru's feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਅੰਮੜੀਏ! ਗੁਰਾਂ ਦੇ ਪੈਰ ਮੈਨੂੰ ਮਿੱਠੇ ਲੱਗਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mother, the Guru's feet are so sweet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਤਿਗੁਰੋਂ ਕੇ ਚਰਨ ਜੋ ਪਰਮ ਮੀਠੇ ਅਰਥਾਤ ਪਿਆਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਂ! ਗੁਰੂ ਦੇ ਚਰਨ (ਮੈਨੂੰ) ਪਿਆਰੇ ਲੱਗਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਈ = ਹੇ ਮਾਂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh madre, los Pies del Guru son dulces para mí;"