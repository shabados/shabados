[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਹੀ ਲੇਪੁ ਤਿਸੁ ਪੁੰਨਿ ਨ ਪਾਪਿ ॥"
page = 894
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak's Lord is Himself all in all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਸਾਹਿਬ ਉਤੇ ਨੇਕੀ ਅਤੇ ਬਦੀ ਦਾ ਕੋਈ ਅਸਰ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is not involved with virtue or vice."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੋ ਪੁੰਨ ਪਾਪ ਕਾ ਸਪਰਸ ਨਹੀਂ ਹੈ, ਭਾਵ ਅਸੰਗ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸੰਤ ਜਨ ਆਖਦੇ ਹਨ ਕਿ) ਉਸ ਪਰਮਾਤਮਾ ਉਤੇ ਨਾਹ ਕਿਸੇ ਪੁੰਨ ਨੇ ਨਾਹ ਕਿਸੇ ਪਾਪ ਨੇ (ਕਦੇ ਆਪਣਾ) ਪ੍ਰਭਾਵ ਪਾਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੇਪੁ = ਪ੍ਰਭਾਵ, ਅਸਰ। ਪੁੰਨਿ = ਪੁੰਨ ਨੇ। ਪਾਪਿ = ਪਾਪ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nuestro Dios no está sujeto ni a la virtud ni al vicio,"