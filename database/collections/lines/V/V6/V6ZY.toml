[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਿਖਿ ਨਾਰਿ ਸੁਰੇਸ ਨਿਕਾਰਿ ਦਯੋ ॥"
page = 971

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Accepting this, the Rishi went away and the woman took Indra out."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਿਸ਼ੀ ਦੀ ਪਤਨੀ (ਅਹਿਲਿਆ) ਨੇ ਇੰਦਰ ਨੂੰ ਮੰਜੀ ਹੇਠੋਂ ਕਢ ਦਿੱਤਾ।"