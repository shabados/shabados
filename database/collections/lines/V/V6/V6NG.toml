[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਪਕਰਾਏ; ਹਰਿ ਕੇ ਚਰਨਾ ॥"
page = 887
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru has make me cling to the Lord's feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਪ੍ਰਭੂ ਦੇ ਪੈਰ ਪਕੜਾ ਦਿੱਤੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru has attached me to the Lord's Feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਗੁਰੋਂ ਨੇ ਮੇਰੇ ਕੋ ਹਰੀ ਕੇ ਚਰਣ ਪਕੜਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੇ ਪ੍ਰਭੂ ਦੇ ਚਰਨ ਫੜਾ ਦਿੱਤੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y me ha permitido aferrarme a los Pies de Dios."