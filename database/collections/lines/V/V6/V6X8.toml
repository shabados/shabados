data = "ਇਮ ਕਹਿ ਕੈ ਇਹ ਲੋਕ ਪਠਾਯੋ ॥੫॥"
page = 55

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But the Lord made me understand His Will and sent me in this world with the following words.5."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਇਸ ਤਰ੍ਹਾਂ ਕਹਿ ਕੇ ਇਸ ਲੋਕ ਵਿਚ ਭੇਜਿਆ ॥੫॥"