[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਨਾਮੁ. ਨ ਚੇਤੈ; ਬਹੁ ਕਰਮ ਕਮਾਏ ॥"
page = 88
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He remembers not God's Name and performs many rituals."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਨਹੀਂ ਕਰਦਾ ਅਤੇ ਘਣੇਰੇ ਕਰਮ ਕਾਂਡ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He does not remember the Name of the Lord, but still, he performs all sorts of empty rituals."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਨਾਮ ਕੋ ਨਹੀਂ ਚੇਤਤਾ ਹੈ ਬਹੁਤੁ ਕਰਮ ਕਮਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਨਾਮ ਦਾ ਸਿਮਰਨ ਛੱਡ ਕੇ ਹੋਰ ਬਥੇਰੇ ਕਰਮ ਕਾਂਡ ਕਰਦਾ ਰਹੇ."

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No se acuerda del Nombre del Señor, pero hace buenas acciones y ritos vacíos,"