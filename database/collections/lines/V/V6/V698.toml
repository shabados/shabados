[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹੋਨਿ ਸਫਲ ਰੁਤਿ ਆਈਐ; ਅੰਮ੍ਰਿਤ ਫਲੁ, ਅੰਮ੍ਰਿਤ ਰਸੁ ਭਾਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In the season they fructify and offer juicy fruits."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜਦ ਰੁਤ ਆਉਂਦੀ ਹੈ ਤਦੋਂ ਫਲਾਂ ਵਾਲੇ ਹੋਕੇ ਅੰਮ੍ਰਿਤ ਰਸਾਂ ਵਾਲੇ ਭਾਰੀ ਫਲ ਦਿੰਦੇ ਹਨ।"