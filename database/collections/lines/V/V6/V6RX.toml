[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੀਮਤਿ ਕਹਣੁ. ਨ ਜਾਈਐ; ਸਚੁ ਸਾਹ ਅਡੋਲੈ ॥"
page = 1102
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, the moveless True King, Thine worth can be told not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਹਿੱਲ ਸਚੇ ਪਾਤਿਸ਼ਾਹ, ਤੇਰਾ ਮੁਲ ਆਖਿਆਂ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your worth cannot be estimated, O True, Unmoving Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਗਵਨ! ਤੇਰੀ ਕੀਮਤ ਨਹੀਂ ਕਹੀ ਜਾਤੀ ਤੂੰ ਸਚਾ ਸਾਹਿਬ ਅਡੋਲ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਦਾ-ਥਿਰ ਤੇ ਕਦੇ ਨ ਡੋਲਣ ਵਾਲੇ ਸ਼ਾਹ! ਤੇਰਾ ਮੁੱਲ ਨਹੀਂ ਦੱਸਿਆ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਡੋਲੈ = ਹੇ ਕਦੇ ਨਾਹ ਡੋਲਣ ਵਾਲੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, el Verdadero e Inamovible Rey, no podría ni empezar a Evaluarte."