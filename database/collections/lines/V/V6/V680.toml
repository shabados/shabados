data = "ਹਰਰੰਤ ਖੇਤ ਖਤ੍ਰਾਣਯੰ ॥"
page = 110

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The arrows shot from the bows create surprises in the minds of the warriors."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਯੁੱਧ ਵਿਚ ਛਤ੍ਰੀਆਂ ਨੂੰ ਹੈਰਾਨ ਕਰ ਰਹੇ ਹਨ।"