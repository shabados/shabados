[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੀਟ ਹਸਤਿ; ਸਗਲ ਪੂਰਾਨ ॥"
page = 863
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In an ant and elephant, He is all-pervading."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੀੜੀ ਅਤੇ ਹਾਥੀ ਵਿੱਚ ਉਹ ਸਾਰੇ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He sustains and fulfills both the ant and the elephant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੀੜੀ ਤੋਂ ਲੈ ਹਸਤੀ ਪ੍ਰਯੰਤ ਸਭ ਕੋ ਭੋਜਨ ਕਰ ਪੂਰਨ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੀੜੇ ਹਾਥੀ ਸਭਨਾਂ ਵਿਚ ਹੀ ਵਿਆਪਕ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀਟ = ਕੀੜੇ। ਹਸਤਿ = ਹਾਥੀ। ਸਗਲ = ਸਭਨਾਂ ਵਿਚ। ਪੂਰਾਨ = ਪੂਰਨ, ਵਿਆਪਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Quien sostiene, de la misma forma, a la hormiga que al elefante."