[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨੇ ਸੇਵਕ ਕਉ; ਸਦਾ ਪ੍ਰਤਿਪਾਰੈ ॥"
page = 1149
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His slave, the Lord ever sustains."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਗੋਲੇ ਦੀ ਸਾਈਂ ਸਦੀਵ ਹੀ ਪਾਲਣਾ-ਪੋਸ਼ਣਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself cherishes His servant forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਭਗਤੋਂ ਕੋ ਸਦਾ ਪ੍ਰਤਿਪਾਲਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪਣੇ ਸੇਵਕ ਦੀ ਆਪ ਰੱਖਿਆ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਪ੍ਰਤਿਪਾਰੈ = ਪਾਲਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor mantiene a Su Devoto siempre,"