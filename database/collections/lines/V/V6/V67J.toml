[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਵੀ ਆਪਣੇ ਮੂਹੋਂ ਕਿਹਾ ਕਿ ਮੈਂ ਰੱਬ ਹਾਂ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਚੂੰ ਅਨਅਲਹੱਕ ਬਰ ਜ਼ੁਬਾਂ ਇਜ਼ਹਾਰ ਕਰਦ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Whether the wise or the naive, all are able to do good, virtuous and charitable deeds because of him. (78)"