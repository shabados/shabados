[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੀਆ ਤੁਮਾਰਾ; ਥੀਆ ॥੧॥ ਰਹਾਉ ॥"
page = 207
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever Thou dost, O Lord that happens. Pause"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਛ ਤੂੰ ਕਹਿੰਦਾ ਹੈਂ ਹੇ ਸਾਈਂ! ਉਹੀ ਹੁੰਦਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O God, whatever You do - that alone happens. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੁਮਾਰਾ ਕੀਆ ਸਭ ਹੂਆ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! (ਜਗਤ ਵਿਚ) ਤੇਰਾ ਕੀਤਾ ਹੀ ਵਰਤ ਰਿਹਾ ਹੈ (ਉਹੀ ਹੁੰਦਾ ਹੈ ਜੋ ਤੂੰ ਕਰਦਾ ਹੈਂ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਥੀਆ = ਹੋ ਰਿਹਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "todo lo que sucede procede de Ti. (1-Pausa)"