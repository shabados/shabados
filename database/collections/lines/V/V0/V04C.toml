[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਮੁਹਾਤ ਭਏ ਭਟ ਕੇਹਰਿ ਕੇ ॥"
page = 167

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the Emperor roared loudly, then all the brave warriors trembled and all those warriors came forward in groups before that lion."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਸਾਰੇ ਸੂਰਮੇ ਕੰਬਣ ਲਗ ਗਏ ਅਤੇ ਨਰਸਿੰਘ ਦੇ ਸਾਹਮਣੇ ਹੋਏ।"