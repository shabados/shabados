[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਜਨ ਸਰਨਾਈ ॥"
page = 631
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Slave Nanak has entered the sanctuary of the Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੋਲੇ ਨਾਨਕ ਨੇ ਸੁਆਮੀ ਦੀ ਓਟ ਲਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Servant Nanak has entered His Sanctuary."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੈਂ ਜਨ ਤਿਸ ਹਰੀ ਕੀ ਸਰਨ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਾਸ ਨਾਨਕ! (ਆਖ-) ਉਸ ਪਰਮਾਤਮਾ ਦੀ ਸ਼ਰਨ ਪਏ ਰਹੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕ ਜਨ = ਹੇ ਦਾਸ ਨਾਨਕ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, el Devoto del Señor, busca Su Santuario."