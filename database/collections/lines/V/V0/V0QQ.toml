[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਪਰਾਈ; ਸੁ ਅਪਨੀ ਮਨੂਆ ॥੧॥"
page = 715
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What belongs to another, that thou deemest thine own."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੀ ਕਿਸੇ ਦੀ ਮਲਕੀਅਤ ਹੈ, ਉਸ ਨੂੰ ਤੂੰ ਆਪਣੀ ਨਿੱਜ ਦੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That which belongs to others, you believe to be your own. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਅੰਤ ਕੋ ਪਰਾਈ ਹੋ ਜਾਣੀ ਹੈ, ਸੋ ਮਾਇਆ ਤੈਨੇ ਅਪਨੀ ਮਾਨੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੀ (ਮਾਇਆ) ਬਿਗਾਨੀ (ਬਣ ਜਾਣੀ) ਹੈ ਉਸ ਨੂੰ ਤੂੰ ਆਪਣੀ ਮੰਨ ਲਿਆ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨੂਆ = ਮੰਨੀ ਹੋਈ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y lo que pertenece a otro,  imaginas que es propio.(1)"