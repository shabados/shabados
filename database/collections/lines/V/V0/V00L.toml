data = "ਪ੍ਰਥਮ ਤਵਨ ਕੀ ਤ੍ਰਿਯਹਿ ਭਿਟਾਯੋ ॥"
page = 1003

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Once the Rani met a handsome man whose wife she introduced tothe Raja."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਹਿਲਾਂ ਉਸ ਦੀ ਇਸਤਰੀ ਨੂੰ ਰਾਜੇ ਨਾਲ ਮਿਲਾਇਆ।"