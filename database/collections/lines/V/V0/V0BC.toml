[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਗੀ ਫਲ ਹੋਵਨਿ ਅੰਗਿਆਰਾ ॥੧੬॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The fruits of fire are the sparks only."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅੱਗਾਂ ਦਾ ਫਲ ਅੰਗਿਆਰੇ ਹੀ ਹੁੰਦੇ ਹਨ, (ਭਾਵ ਪਾਪਾਂ ਦੇ ਫਲ ਮੌਤ ਤੇ ਕਲੇਸ਼ ਹੀ ਪ੍ਰਾਪਤ ਹੁੰਦੇ ਹਨ)"