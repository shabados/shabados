[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਣ ਗਾਵਾ ਦਿਨੁ ਰੈਣਿ; ਏਤੈ ਕੰਮਿ ਲਾਇ ॥"
page = 961
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Yoke Thou me to this service, O Lord, that day and night, I may sing Thine praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੈਨੂੰ ਇਸ ਸੇਵਾ ਅੰਦਰ ਜੋੜ, ਹੇ ਪ੍ਰਭੂ! ਕਿ ਦਿਨ ਰਾਤ ਮੈਂ ਤੇਰੀ ਉਸਤਤੀ ਗਾਇਨ ਕਰਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "May I sing Your Glorious Praises day and night; please commit me to this task."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਗੁਣ ਗਾਵਾਂ ਦਿਨ ਰਾਤ ਏਸੇ ਕੰਮ ਮੇਂ ਲਾਇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਕਿਰਪਾਲ!) ਮੈਨੂੰ ਇਸੇ ਕੰਮ ਲਾਈ ਰੱਖ ਕਿ ਮੈਂ ਦਿਨ ਰਾਤ ਤੇਰੇ ਗੁਣ ਗਾਂਦਾ ਰਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੈਣਿ = ਰਾਤ। ਕੰਮਿ = ਕੰਮ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bendíceme para que pueda cantar siempre Tu Alabanza,"