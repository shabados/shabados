[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨੀ ਸੁਣਿ ਮੰਨਿਆ ਹਰਿ ਨਾਉ; ਤਿਨਾ ਹਉ ਵਾਰੀਆ ॥"
page = 645
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who hear and believe in the Lord's Name, unto them, I am a sacrifice."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੋ ਸੁਆਮੀ ਦੇ ਨਾਮ ਨੂੰ ਸੁਣਦੇ ਅਤੇ ਉਸ ਵਿੱਚ ਭਰੋਸਾ ਧਾਰਦੇ ਹਨ, ਉਨ੍ਹਾਂ ਤੋਂ ਮੈਂ ਬਲਿਹਾਰਨੇ ਵੰਞਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who hear, and believe in the Lord's Name, to them I am a sacrifice."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਹਰੀ ਨਾਮ ਸ੍ਰਵਨ ਕਰ ਕੇ ਮੱਨਨ ਕੀਆ ਹੈ, ਤਿਨੋਂ ਕੇ ਮੈਂ ਬਲਿਹਾਰਨੇ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਦਕੇ ਹਾਂ ਜਿਨ੍ਹਾਂ ਨੇ ਸੁਣ ਕੇ ਹਰੀ ਦਾ ਨਾਮ ਮੰਨਿਆ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, guíame hasta mis compañeros,"