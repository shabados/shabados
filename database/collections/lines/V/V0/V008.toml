[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੀਨਾ ਨਾਥ ਦੈਆਲ ਦੇਵ; ਪਤਿਤ. ਉਧਾਰਣਹਾਰੁ ॥"
page = 137
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The merciful luminous Lord is the Master of the poor and the saviour of sinners."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿਹਰਬਾਨ ਪ੍ਰਕਾਸ਼ਵਾਨ ਪ੍ਰਭੂ ਗਰੀਬਾਂ ਦਾ ਮਾਲਕ ਅਤੇ ਪਾਪੀਆਂ ਨੂੰ ਤਾਰਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Patron of the poor, the Merciful, Luminous Lord, the Redeemer of sinners."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੀਨੋਂ ਕਾ ਨਾਥ ਹੈ ਪੁਨਾ ਦਿਆਲ ਹੈ ਔਰ ਪਾਪੀਓਂ ਕਾ ਉਧਾਰ ਕਰਨੇ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਗਰੀਬਾਂ ਦਾ ਖਸਮ-ਸਹਾਰਾ ਹੈ, ਉਹ ਵਿਕਾਰਾਂ ਵਿਚ ਡਿੱਗੇ ਜੀਵਾਂ ਨੂੰ ਬਚਾਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੈਆਲ = {ਨ;ਕ ਵਕੇ;} ਦਇਆ ਦਾ ਘਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el Señor de aquéllos que no tienen soporte, el Ángel de Misericordia y tu Salvador."