[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੂਝਿ; ਬੈਰਾਗੁ ਕਰੇ ਜੇ ਕੋਇ ॥"
page = 1145
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If someone knowingly becomes detached,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਕੋਈ ਜਣਾ ਜਾਣ ਬੁੱਝ ਕੇ ਉਪਰਾਮ ਹੋ ਜਾਏ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If someone becomes detached through understanding,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਪਰਮੇਸ੍ਵਰ ਕੋ ਬੁਝ ਕੇ, ਵਾ ਮਰਨਾ ਸਚਾ ਸਮਝ ਕੇ ਕੋਈ (ਬੈਰਾਗੁ) ਰੁਦਨ ਕਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਜੇ ਕੋਈ ਪ੍ਰਾਣੀ (ਇਹ) ਸਮਝ ਕੇ (ਕਿ ਇਹ ਮਾਇਕ ਸੰਬੰਧ ਸਦਾ ਕਾਇਮ ਨਹੀਂ ਰਹਿ ਸਕਦੇ ਆਪਣੇ ਅੰਦਰ) ਨਿਰਮੋਹਤਾ ਪੈਦਾ ਕਰ ਲਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੂਝਿ = (ਜਗਤ ਦੇ ਸੰਬੰਧ ਨੂੰ) ਸਮਝ ਕੇ। ਕੋਇ = ਕੋਈ ਮਨੁੱਖ। ਬੈਰਾਗੁ = ਨਿਰਮੋਹਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que al tener el Conocimiento se vuelve desapegado,"