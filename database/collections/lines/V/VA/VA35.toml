[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਘਰਿ; ਸਗਲੇ ਸਮਾਹਿ ॥"
page = 987
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, in whose Home all are contained;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ, ਜਿਸ ਦੇ ਗ੍ਰਹਿ ਅੰਦਰ ਸਾਰੇ ਲੀਨ ਹੋਏ ਹੋਏ ਹਨ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everything is contained in His home."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਘਰ ਮੇਂ ਸਭ ਸਮਾਇ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਘਰ ਵਿਚ ਸਾਰੇ ਹੀ (ਖ਼ਜ਼ਾਨੇ) ਟਿਕੇ ਹੋਏ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੈ ਘਰਿ = ਦੇ ਘਰ ਵਿਚ। ਸਗਲ = ਸਾਰੇ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Su Hogar habitan todos los seres;"