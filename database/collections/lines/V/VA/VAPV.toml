[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਮਨਮੁਖਿ. ਨ ਬੁਝੈ, ਗਵਾਰੁ ॥੫੫॥"
page = 944
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "(Guru answers) The ignorant egocentric obtains not understanding, O Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਜੀ ਜਵਾਬ ਦਿੰਦੇ ਹਨ) ਆਪ ਹੁਦਰੇ ਮੂਰਖ ਨੂੰ ਸਮਝ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦੀ, ਹੇ ਨਾਨਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the foolish self-willed manmukh does not understand. ||55||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਿਧ ਕਹਿਤੇ ਹੈਂ: ਹੇ ਨਾਨਕ ਜੀ! ਮੂਰਖੁ ਮਨਮੁਖਤਾ ਕਰ ਕੇ ਜੋ ਹਰੀ ਕੋ ਨਹੀਂ ਸਮਝਤਾ ਹੈ॥੫੫॥☬ਉਤ੍ਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਮਨਮੁਖ ਮੂਰਖ ਸਮਝਦਾ ਨਹੀਂ ॥੫੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, el tonto y arrogante Manmukj, no entiende nada.(55)"