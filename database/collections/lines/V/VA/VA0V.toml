[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਜੰਤ ਕੀ. ਕਰੇ ਪ੍ਰਤਿਪਾਲ ॥"
page = 1173
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the sentient beings, the Lord sustains."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਪ੍ਰਾਣਧਾਰੀਆਂ ਦੀ ਪ੍ਰਭੂ ਪਾਲਣਾ-ਪੋਸ਼ਣਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord cherishes all beings and creatures."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਹਰਿ ਜੀ ਕੈਸਾ ਹੈ? ਛੋਟੇ ਬਡੇ ਸਰਬ ਜੀਵੋਂ ਕੀ ਪ੍ਰਤਿਪਾਲਾ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ, ਜੋ ਸਾਰੇ ਜੀਵਾਂ ਦੀ ਪਾਲਣਾ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor sostiene a sus criaturas,"