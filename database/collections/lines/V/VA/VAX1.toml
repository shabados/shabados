[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਜਨਾ ਕੀ; ਪਗ ਪੰਕਜ ਧੂਰਿ ॥"
page = 1174
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and deems himself the dust of the lotus feet of the saintly persons."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪ ਨੂੰ ਸਾਧੂ ਪੁਰਸ਼ਾਂ ਦੇ ਕੰਵਲ ਪੈਰਾਂ ਦੀ ਧੂੜ ਖਿਆਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the dust of the lotus feet of the humble Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨੋਂ ਕੇ ਚਰਨ ਕਮਲੋਂ ਕੀ ਰੇਣ ਕੋ ਬਾਂਛਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨਾਂ ਦੇ ਸੋਹਣੇ ਚਰਨਾਂ ਦੀ ਧੂੜ (ਆਪਣੇ ਮੱਥੇ ਤੇ ਲਾਂਦੇ ਹਨ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਗ = ਚਰਨ। ਪੰਕਜ = ਕੌਲ-ਫੁੱਲ {ਪੰਕ = ਚਿੱਕੜ। ਜ = ਜੰਮਿਆ ਹੋਇਆ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y se convierten en el Polvo del Loto de los Pies que los Santos pisan."