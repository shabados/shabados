[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹੂੰ ਮੰਤ੍ਰ ਬਿਦਿਆ, ਕਹੂੰ ਤੰਤ੍ਰ ਸਾਰੰ ॥"
page = 29

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere Thou art the instruction of mantras (spells) and somewhere Thou art the essence of Tantras!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ (ਤੁਸੀਂ) ਮੰਤ੍ਰ-ਵਿਦਿਆ ਹੋ ਅਤੇ ਕਿਤੇ ਤੰਤ੍ਰਾਂ ਦਾ ਸਾਰ ਹੋ।"