[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਤਾ ਉਪਦੇਸੈ; ਪ੍ਰਹਿਲਾਦ ਪਿਆਰੇ ॥"
page = 1133
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mother counsels her dear son, Prahlad:"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਂ ਆਪਣੇ ਪਿਆਰੇ ਪੁੱਤਰ, ਪ੍ਰਹਿਲਾਦ ਨੂੰ ਸਿੱਖ ਮੱਤ ਦਿੰਦੀ ਹੈ:"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Prahlaad's mother gave her beloved son some advice:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਤਾ ਆਨ ਕਰ ਉਪਦੇਸ਼ ਕਰਤੀ ਹੈ, ਹੇ ਮੇਰੇ ਪਯਾਰੇ! ਪ੍ਰਹਿਲਾਦ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਹਿਲਾਦ ਨੂੰ ਉਸ ਦੀ) ਮਾਂ ਸਮਝਾਂਦੀ ਹੈ-ਹੇ ਪਿਆਰੇ ਪ੍ਰਹਿਲਾਦ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਪਦੇਸੈ = ਸਮਝਾਂਦੀ ਹੈ। ਪ੍ਰਹਿਲਾਦ = ਹੇ ਪ੍ਰਹਿਲਾਦ! ਪੁਤ੍ਰ = ਹੇ ਪੁੱਤਰ! ਜੀਉ = ਜਿੰਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su madre le dijo, querido, oh mi querido hijo,"