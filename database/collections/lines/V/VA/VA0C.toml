[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹਾ ਤ੍ਰਿਖਾ; ਮਨ ਤੁਝੁ ਆਕਰਖੈ ॥"
page = 264
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Where, O man, thirst sucks out thy breath,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਹੇ ਬੰਦੇ! ਤਰੇਹ ਤੇਰਾ ਸਾਹ ਖਿੱਚਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Where thirst, O my mind, torments you to cry out,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਜਹਾਂ ਤੁਝ ਕੌ ਤ੍ਰਿਖਾ (ਆਕਰਖੈ) ਖੈਚੇਗੀ, ਭਾਵ ਦੁਖ ਦੇਵੇਗੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਜੀਵ!) ਜਿਥੇ (ਮਾਇਆ ਦੀ) ਤ੍ਰਿਹ ਤੈਨੂੰ (ਸਦਾ) ਖਿੱਚ ਪਾਉਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤ੍ਰਿਖਾ = ਤ੍ਰਿਹ। ਆਕਰਖੈ = ਖਿੱਚਦੀ ਹੈ, ਘਬਰਾਹਟ ਪਾਉਂਦੀ ਹੈ। ਤੁਝੁ = ਤੈਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En el vacío de la nada, consumido por la sed de la ausencia,"