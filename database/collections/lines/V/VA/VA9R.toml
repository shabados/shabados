data = "ਗੁਰਿ ਪੂਰੈ; ਜਬ ਕਿਰਪਾ ਕਰੀ ॥"
page = 190
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Perfect Guru showered his benediction,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਪੂਰਨ ਗੁਰਾਂ ਨੇ ਆਪਣੀ ਮਿਹਰ ਧਾਰੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Perfect Guru granted His Grace,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਪੂਰਨ ਗੁਰੋਂ ਨੇ ਕਿਰਪਾ ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਪੂਰੇ ਗੁਰੂ ਨੇ (ਮੇਰੇ ਉਤੇ) ਮਿਹਰ ਕੀਤੀ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando el Perfecto Guru me mostró su Gracia,"