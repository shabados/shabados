[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਅਉਧੂਤੀ; ਨਾ ਸੰਸਾਰੀ ॥੧॥"
page = 903
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art neither an anchoret, nor a family man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਨਾਂ ਤਿਆਗੀ ਹੈਂ, ਨਾਂ ਹੀ ਘਰਬਾਰੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are not a renunciate, nor a man of the world. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਸੇ ਤੂੰ ਨਾ ਅਵਧੂਤ ਹੂਆ ਨਾ ਸੰਸਾਰੀ ਹੂਆ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਨਾਹ ਤਿਆਗੀ ਰਿਹਾ ਨਾਹ ਗ੍ਰਿਹਸਤੀ ਬਣਿਆ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਉਧੂਤੀ = ਤਿਆਗੀ। ਸੰਸਾਰੀ = ਗ੍ਰਿਹਸਤੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el sentido de su individualidad y el amor por Maya, no es un ser humano en este mundo ni en el otro.  (1)"