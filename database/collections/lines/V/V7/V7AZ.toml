[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਵਲਾ ਸਣੁ ਕਵਲਾਪਤੀ; ਸਾਧਸੰਗਤਿ ਸਰਣਾਗਤਿ ਆਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "That goddess Kamala (Laksmi) alongwith her husband (Visnu) seeks the shelter of holy congregation"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਉਹ 'ਕਵਲਾ' (ਲਛਮੀ) ਕਮਲਾਪਤ (ਵਿਸ਼ਨੂੰ) ਦੇ ਸਣੇ ਸੰਗਤ ਦੀ ਸ਼ਰਣ ਆਈ ਹੈ।"