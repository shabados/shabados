[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਉਠੀ ਝਾਰ ਅਸਤ੍ਰੰ ॥"
page = 50

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors are fighting with their weapons in great excitement, the weapons as well as the armour are glistening."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਅਸਤ੍ਰਾਂ ਦੇ ਚਲਣ ਨਾਲ ਚਿਣਗਾਂ ਨਿਕਲਣ ਲਗੀਆਂ ਹਨ।"