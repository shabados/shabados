[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਊਆ; ਕਹਾ ਕਪੂਰ ਚਰਾਏ ॥"
page = 481
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why should one offer camphor to a crow?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਦਮੀ ਕਾਂ ਨੂੰ ਕਿਉਂ ਮੁਸ਼ਕ-ਕਾਫੂਰ ਭੇਟਾ ਕਰੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Why offer camphor to a crow?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਊਏ ਕੋ ਕਪੂਰ ਚਰਾਉਨੇ ਸੇ ਕਿਆ ਲਾਭ ਹੋਗਾ। ਕਪੂਰ ਕਾ, ਭਾਵ ਉਤਮ ਵਸਤ ਖੁਲਾਵਣ ਕਰਨੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਾਂ ਨੂੰ ਮੁਸ਼ਕ-ਕਾਫ਼ੂਰ ਖੁਆਉਣ ਤੋਂ ਕੋਈ ਗੁਣ ਨਹੀਂ ਨਿਕਲਦਾ (ਕਿਉਂਕਿ ਕਾਂ ਦੀ ਗੰਦ ਖਾਣ ਦੀ ਆਦਤ ਨਹੀਂ ਜਾ ਸਕਦੀ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਪੂਰ = ਮੁਸ਼ਕ-ਕਾਫ਼ੂਰ। ਚਰਾਏ = ਖੁਆਇਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué ponerle esencias a los cuervos?"