type = "primary"
data = "ਯਹੈ ਚਿਤ ਮੈ ਚਰਿਤ ਬਨਾਇਸ ॥"
page = 898

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the woman saw her husband coming towards her, she thought of a deception."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਮਨ ਵਿਚ ਇਹ ਚਰਿਤ੍ਰ ਬਣਾਇਆ।"