[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕਾ ਅੰਤੁ ਨ ਪਾਰਾਵਾਰੁ ॥"
page = 889
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the Lord, has no end or limit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਸਾਹਿਬ ਦਾ ਕੋਈ ਅੰਤ ਜਾਂ ਓੜਕ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has no end or limitation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੈਸਾ ਵਹੁ ਪ੍ਰਭੂ ਹੈ? ਤਿਸ ਕੇ ਪਾਰਾਵਾਰ ਕਾ ਅੰਤ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਪਰਮਾਤਮਾ ਦਾ ਅੰਤ ਨਹੀਂ ਪਾਇਆ ਜਾ ਸਕਦਾ, ਜਿਸ ਦੇ ਸਰੂਪ ਦਾ ਪਾਰਲਾ ਉਰਲਾ ਬੰਨਾ ਨਹੀਂ ਦਿੱਸ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਰਾਵਾਰੁ = ਪਾਰ-ਅਵਾਰੁ, ਪਾਰਲਾ ਉਰਲਾ ਬੰਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Infinito y sin medida"