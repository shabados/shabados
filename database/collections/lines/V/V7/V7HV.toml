[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭੁ ਅਬਿਨਾਸੀ; ਰਹਿਆ ਭਰਪੂਰਿ ॥"
page = 737
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The imperishable Lord is fully pervading everywhere."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਸ-ਰਹਿਤ ਸੁਆਮੀ ਸਾਰੀ ਥਾਈਂ ਪਰੀਪੂਰਨ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is imperishable and eternal; He is pervading and permeating everywhere."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਜੋ ਅਬਿਨਾਸ਼ੀ ਹੈ ਵਹੁ ਤੌ ਭਰਪੂਰ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਨਾਸ-ਰਹਿਤ ਪਰਮਾਤਮਾ ਤਾਂ ਹਰ ਥਾਂ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਹਿਆ ਭਰਪੂਰਿ = ਹਰ ਥਾਂ ਮੌਜੂਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero nuestro Señor Eterno lo llena todo en todas partes,"