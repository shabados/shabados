[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭਾਤੀ ਮਹਲਾ ੫ ਘਰੁ ੨ ਬਿਭਾਸ ॥"
page = 1341
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Parbhati 5th Guru. Bibhas."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭਾਤੀ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ, ਬਿਭਾਸ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Prabhaatee, Fifth Mehl, Second House, Bibhaas:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਪ੍ਰਭਾਤੀ/ਬਿਭਾਗ ਘਰ ੨ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Parbhati, Mejl Guru Aryan Dev, Quinto Canal Divino, Bibhas."