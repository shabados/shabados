[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਨ ਛਉਨਾ ਗਨ ਰਾਜ ਸ੍ਰੀ; ਮਹਾਬੀਰ ਮਨ ਰਾਇ ॥੧੫੨੫॥"
page = 449

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "These ganas were Ganchhabi, Ganraj, Mahavir and Monroy.1525."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹਨਛੌਣਾ ਗਣ, ਰਾਜਸ੍ਰੀ ਗਣ, ਮਹਾਬੀਰ ਅਤੇ ਮਨ ਰਾਇ ॥੧੫੨੫॥"