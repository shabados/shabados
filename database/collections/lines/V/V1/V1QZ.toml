[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਤਿਸਹਿ; ਨ ਲਾਗਹਿ ਦੂਖ ॥੪॥"
page = 281
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "suffers no pain, O Nanak!"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਹੇ ਨਾਨਕ! ਕੋਈ ਪੀੜ ਨਹੀਂ ਵਾਪਰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, shall not suffer pain. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਕੋ ਦੁਖ ਨਹੀਂ ਲਾਗਤੇ ਹੈਂ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਮਨੁੱਖ ਨੂੰ ਕੋਈ ਦੁੱਖ ਨਹੀਂ ਪੋਂਹਦਾ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸਹਿ = ਤਿਸ ਮਨੁੱਖ ਨੂੰ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ningún dolor aqueja al hombre.  (4)"