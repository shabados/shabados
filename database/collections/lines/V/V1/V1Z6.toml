[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਸਿਖ ਮੁਖਿ ਸਮਾਇ; ਸਭ ਫਲ ਲਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "But the seed it offered to Guru oriented ones gives all sorts of fruits."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਗੁਰ ਸਿੱਖਾਂ ਦੇ ਮੁੱਖ ਵਿਖੇ ਪਾਉਣ ਨਾਲ ਹਰੇਕ ਫਲ ਦੀ ਪ੍ਰਾਪਤੀ ਹੋ ਜਾਂਦੀ ਹੈ।"