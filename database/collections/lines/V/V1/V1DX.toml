[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਵਾਹਨ ਫਟ ਕਰਾਰੇ, ਰਾਕਸਿ ਰੋਹਲੇ ॥"
page = 121

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The infuriated demons strike strong blows causing wounds."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਗੁੱਸੇ ਨਾਲ ਭਰੇ ਹੋਏ ਰਾਖਸ਼ ਕਰਾਰੇ ਫੱਟ ਲਗਾ ਰਹੇ ਹਨ।"