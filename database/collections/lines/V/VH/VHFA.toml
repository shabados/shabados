[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬੋਲਤ ਸੁਤ ਮੁਖ ਤੇ ਨਹੀ; ਯੌ ਨ੍ਰਿਪ ਕਹਿਯੋ ਸੁਨਾਇ ॥"
page = 813

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Raja announced that the boy did not speak,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਜੇ ਨੇ ਸਾਰਿਆਂ ਨੂੰ ਇਸ ਤਰ੍ਹਾਂ ਕਹਿ ਕੇ ਸੁਣਾਇਆ ਕਿ ਪੁੱਤਰ ਮੁਖ ਤੋਂ ਬੋਲਦਾ ਨਹੀਂ ਹੈ।"