[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੰਜਵਾ ਪਾਇਆ ਘਿਰਤੁ ॥ ਤਾ ਹੋਆ ਪਾਕੁ ਪਵਿਤੁ ॥"
page = 473
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then the fifth, clarified butter, is added, then the food becomes pure and sanctified."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਪੰਜਵੀਂ ਵਸਤੂ ਘਿਓ ਪਾ ਦਿੱਤਾ ਜਾਂਦਾ ਹੈ, ਤਦ ਭੋਜਨ ਸ਼ੁੱਧ ਅਤੇ ਪਵਿੱਤ੍ਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the fifth thing, the ghee, is added, then the food becomes pure and sanctified."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਇਨ ਪੁਰਬੁਕਤ ਚਾਰ ਬਸਤੂਓਂ ਮੇਂ ਪੰਜਵਾਂ ਘ੍ਰਿਤ ਪਾਇਆ ਹੈ॥ ਤਾਂ ਭੋਜਨ (ਪਾਕੁ) ਪਵਿਤ੍ਰ ਹੂਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੰਜਵਾਂ ਘਿਉ ਭੀ ਪਵਿੱਤਰ ਹੈ, ਜੋ ਇਹਨਾਂ ਚੌਹਾਂ ਵਿਚ ਪਾਈਦਾ ਹੈ। ਤਾਂ (ਭਾਵ, ਇਹਨਾਂ ਪੰਜਾਂ ਨੂੰ ਰਲਾਇਆਂ) ਬੜਾ ਪਵਿੱਤਰ ਭੋਜਨ ਤਿਆਰ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਕੁ = ਪਵਿੱਤਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y cuando el quinto dios, la mantequilla clarificada, se mezcla con ellos, la comida se vuelve más pura aún."