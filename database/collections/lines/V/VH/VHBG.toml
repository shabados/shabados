[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਦਿਲ ਦੇ ਪੈਰ (ਗਹਿਰਾਈ) ਵਿੱਚੋਂ ਸਮਝੋ, ਵਿਛੋੜੇ ਦਾ ਕੰਡਾ ਨਿਕਲ ਗਿਆ । "

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਖ਼ਾਰਿ ਹਿਜਰਤ ਰਾ ਜ਼ ਪਾਇ ਦਿਲ ਕੁਨੰਦ ॥੨੮੬॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "His ranks are higher and He is a great refuge,"