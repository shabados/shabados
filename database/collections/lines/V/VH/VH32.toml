[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਮ ਜਨਮ ਕੇ; ਕਿਲਬਿਖ ਜਾਹਿ ॥"
page = 289
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and thy sins of all the births shall depart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਤੇਰੇ ਸਾਰੇ ਜਨਮਾਂ ਦੇ ਪਾਪ ਦੂਰ ਹੋ ਜਾਣਗੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the sins of countless lifetimes shall depart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੁਮਾਰੇ ਜਨਮ ਜਨਮਾਂਤ੍ਰੋਂ ਕੇ ਪਾਪ ਦੂਰ ਹੋ ਜਾਵੇਂਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਕਈ ਜਨਮਾਂ ਦੇ ਪਾਪ ਨਾਸ ਹੋ ਜਾਣਗੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਲਬਿਖ = ਪਾਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "todas las faltas cometidas en pasadas existencias te serán absueltas."