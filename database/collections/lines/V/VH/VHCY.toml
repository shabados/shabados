data = "ਜਉ ਘਟ ਭੀਤਰਿ; ਹੈ ਮਲਨਾਂ ॥੧॥ ਰਹਾਉ ॥"
page = 656
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "when there is filth in the mind? Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਕਿ ਹਿਰਦੇ ਅੰਦਰ ਮੈਲ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your heart is still full of filth. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਅੰਤਰ ਸੇ ਅੰਤਸਕਰਨ ਮਲਨ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਤੇਰੇ ਹਿਰਦੇ ਵਿਚ (ਕਪਟ ਦੀ) ਮੈਲ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਉ = ਜੇ। ਘਟ = ਹਿਰਦਾ। ਮਲਨਾਂ = ਮੈਲ, ਵਿਕਾਰ, ਖੋਟ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "cuando en el interior está la carroña acumulada de épocas enteras? (1‑Pausa)"