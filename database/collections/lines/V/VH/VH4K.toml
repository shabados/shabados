[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮੇਲੁ ਵਡਾ ਬੁਰਹਾਨਪੁਰਿ; ਸਨਮੁਖ ਸਿਖ ਸਹਜ ਪਰਗਾਸੁ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Famous are the Sikhs of Burhan Pur who love one another and reside in the equipoise."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਬੁਰਹਾਨਪੁਰ ਵਿਚ ਵਡਾ ਮੇਲ ਹੈ, (ਜਿੱਥੇ) ਸਹਜ ਪਦ ਤੇ ਸਨਮੁਖ ਸਿੱਖ (ਬਹੁਤ) ਪ੍ਰਸਿੱਧ ਹਨ।"