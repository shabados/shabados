type = "primary"
data = "ਤੁਮਰੋ ਕਰੋ ਇਲਾਜ; ਨ ਹਾਸੀ ਜਾਨਿਯੋ ॥"
page = 817

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘I will get you treated  there is nothing to laugh at."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਵੈਦ ਬਣੇ ਆਦਮੀ ਨੇ ਕਿਹਾ) ਮੈਂ ਤੁਹਾਡਾ ਇਲਾਜ ਕਰਾਂਗਾ, ਇਸ ਵਿਚ ਕੋਈ ਹਾਸੀ ਦੀ ਗੱਲ ਨਹੀਂ।"