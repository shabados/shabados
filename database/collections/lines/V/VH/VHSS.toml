[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਪ੍ਰੀਤਿ ਕਰੀਜੈ. ਇਹੁ ਮਨੁ ਦੀਜੈ; ਅਤਿ ਲਾਈਐ ਚਿਤੁ ਮੁਰਾਰੀ ॥"
page = 455
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "So love thou thy God, give to Him this soul and thoroughly fix thy attention on Lord, the killer of Mur demon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੇ ਵਾਹਿਗੁਰੂ ਨਾਲ ਪ੍ਰੇਮ ਕਰ। ਇਹ ਆਤਮਾ ਉਸ ਨੂੰ ਦੇ ਦੇ ਅਤੇ ਮੁਰ ਰਾਖਸ਼ ਨੂੰ ਮਾਰਨ ਵਾਲੇ ਸੁਆਮੀ ਨਾਲ ਆਪਣੀ ਬਿਰਤੀ ਚੰਗੀ ਤਰ੍ਹਾਂ ਜੋੜ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So love the Lord, and give to Him this mind of yours; totally focus your consciousness on the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਪ੍ਰਕਾਰ ਹਰਿ ਸੇ ਪ੍ਰੀਤ ਕਰੀਏ, ਇਸ ਮਨ ਕੋ ਅਰਪਣ ਕਰੀਏ, ਅਤਿਸੇ ਕਰ ਕੇ ਮੁਰਾਰੀ ਮੇਂ ਚਿਤ ਕੋ ਲਗਾਈਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਨਾਲ ਪਿਆਰ ਪਾਣਾ ਚਾਹੀਦਾ ਹੈ (ਪਿਆਰ ਦੇ ਵੱਟੇ ਆਪਣਾ) ਇਹ ਮਨ ਉਸ ਦੇ ਹਵਾਲੇ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ (ਤੇ ਇਸ ਤਰ੍ਹਾਂ) ਮਨ ਨੂੰ ਪਰਮਾਤਮਾ ਦੇ ਚਰਨਾਂ ਵਿਚ ਜੋੜਨਾ ਚਾਹੀਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੀਜੈ = ਭੇਟ ਕਰ ਦੇਣਾ ਚਾਹੀਦਾ ਹੈ। ਮੁਰਾਰੀ = ਪਰਮਾਤਮਾ (ਨਾਲ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como el Cuclillo llora de sed y va hacia las bellas nubes por unas gotas de lluvia,"