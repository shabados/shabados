[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪੁਛੇ ਪੀਰ ਤਕਰਾਰ ਕਰਿ; ਏਹੁ ਫਕੀਰੁ ਵਡਾ ਅਤਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The pir debated and came to know that this faquir is much more powerful."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਤਕਰਾਰ (=ਝਗੜਾ) ਕਰ ਕੇ (ਦਸਤਗੀਰ) ਪੀਰ ਨੇ (ਕਈ ਸੁਆਲ) ਪੁੱਛੇ, (ਜਦ ਨਿਸ਼ਾ ਹੋਈ ਤਾਂ ਜਾਤਾ ਕਿ) ਇਹ ਫਕੀਰ ਵੱਡਾ ਸ਼ਕਤੀਵਾਨ ਹੈ।"