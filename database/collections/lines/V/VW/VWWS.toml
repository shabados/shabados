[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੋਲਹਿ ਸਾਚੁ; ਮਿਥਿਆ ਨਹੀ ਰਾਈ ॥"
page = 227
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who tells the truth wherein there is not even an iota of falsehood,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੱਚ ਬੋਲਦਾ ਹੈ, ਜਿਸ ਵਿੱਚ ਇਕ ਭੋਰਾ ਭਰ ਭੀ ਝੂਠ ਨਹੀਂ ਹੁੰਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They speak the Truth - not an iota of falsehood."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਿ ਸਚੁ ਬਚਨੁ ਬੋਲਤੇ ਹੈਂ ਰਾਈ ਮਾਤ੍ਰ ਭੀ (ਮਿਥਿਆ) ਝੂਠ ਨਹੀਂ ਬੋਲਤੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੇ ਮਨੁੱਖ ਸਦਾ ਅਟੱਲ ਰਹਿਣ ਵਾਲਾ ਬੋਲ ਹੀ ਬੋਲਦੇ ਹਨ, ਰਤਾ ਭੀ ਝੂਠ ਨਹੀਂ ਬੋਲਦੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੋਲਹਿ = ਬੋਲਦੇ ਹਨ। ਸਾਚੁ = ਸਦਾ ਅਟੱਲ ਰਹਿਣ ਵਾਲਾ ਬੋਲ। ਮਿਥਿਆ = ਝੂਠ। ਰਾਈ = ਰਤਾ ਭਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que habla la Verdad y nunca es falso,"