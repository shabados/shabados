[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਕਾ ਮੰਤ੍ਰੁ; ਨ ਜਾਨੈ ਹੋਰੁ ॥"
page = 284
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "None else knows His resolve."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੋਰ ਕੋਈ ਉਸ ਦੇ ਇਰਾਦੇ ਨੂੰ ਨਹੀਂ ਜਾਣਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one else knows the mystery of His ways."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਮੰਤ੍ਰ ਅਰਥਾਤ ਸਲਾਹ ਕੌ ਔਰ ਕੋਈ ਜਾਨਤਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਗੁੱਝਾ ਭੇਤ ਕੋਈ ਹੋਰ ਜੀਵ ਨਹੀਂ ਜਾਣਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਤ੍ਰ = ਗੁੱਝਾ ਭੇਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él colma o vacía cualquier tipo de manifestación en un abrir y cerrar de ojos."