[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚਰਣ ਕਵਲ, ਮਕਰੰਦੁ ਨ ਪਾਇਆ ॥੭॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He always made show of his ego and could never receive the pollen of the lotus feet (of Lord)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਚਰਨਾਂ ਕਮਲਾਂ ਦਾ ਮਕਰੰਦ ਰਸ ਨਾ ਪਾਯਾ। (ਹਉਮੈ ਵਿਚ ਹੀ ਦੁਖੀ ਗਿਆ)।"