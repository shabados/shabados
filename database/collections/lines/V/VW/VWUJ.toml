[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤਾ ਦੀ ਸਦਾ ਤੂ ਰਖਦਾ ਹਰਿ ਜੀਉ; ਧੁਰਿ. ਤੂ ਰਖਦਾ ਆਇਆ ॥"
page = 637
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou, O dear Lord, ever preserve the dignity of Thine saints and from the very. beginning."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੇ ਮਹਾਰਾਜ ਸੁਆਮੀ! ਹਮੇਸ਼ਾਂ ਹੀ ਆਪਣੇ ਸੰਤਾਂ ਦੀ ਮਾਨਮਹੱਤਾ ਕਾਇਮ ਰੱਖੀ ਹੈ ਅਤੇ ਐਨ ਆਰੰਭ ਤੋਂ ਉਨ੍ਹਾਂ ਦੀ ਇੱਜ਼ਤ ਬਰਕਰਾਰ ਰੱਖਦਾ ਆਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You always preserve the honor of Your devotees, O Dear Lord; You have protected them from the very beginning of time."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ ਜੀਉ! ਅਪਣੇ ਭਗਤੋਂ ਕੀ ਪ੍ਰਤਗ੍ਯਾ ਤੂੰ ਸਦਾ ਹੀ ਰਾਖਤਾ ਹੈਂ, ਕੁਛ ਅਬੀ ਨਹੀਂ ਤੂੰ (ਧੁਰਿ) ਆਦ ਸੇ ਹੀ ਤਿਨ ਕੀ ਪੈਜ ਰਖਤਾ ਆਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਤੂੰ ਆਪਣੇ ਭਗਤਾਂ ਦੀ ਇੱਜ਼ਤ ਸਦਾ ਰੱਖਦਾ ਹੈਂ, ਜਦੋਂ ਤੋਂ ਜਗਤ ਬਣਿਆ ਹੈ ਤਦੋਂ ਤੋਂ (ਭਗਤਾਂ ਦੀ ਇੱਜ਼ਤ) ਰੱਖਦਾ ਆ ਰਿਹਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ ਜੀਉ = ਹੇ ਪ੍ਰਭੂ ਜੀ! ਧੁਰਿ = ਧੁਰ ਤੋਂ, ਸ਼ੁਰੂ ਤੋਂ, ਜਦੋਂ ਦਾ ਸੰਸਾਰ ਬਣਿਆ ਹੈ ਤਦੋਂ ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Has salvado el Honor de Tus Devotos desde el principio del tiempo, oh Señor."