[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਣੀ ਨਦਰਿ ਨਿਹਾਲਿ; ਆਪੇ ਲੈਹੁ ਲਾਇ ॥"
page = 1425
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Seeing thee with His gracious glance, the Lord shall attach thee with Himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਦਇਆ ਦ੍ਰਿਸ਼ਟੀ ਨਾਲ ਤੈਨੂੰ ਦੇਖ, ਸੁਆਮੀ ਤੈੌਨੂੰ ਆਪਣੇ ਲਾਲ ਜੋੜ ਲਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He shall cast His Glance of Grace, and attach you to Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਓਹ ਆਪਣੀ ਕ੍ਰਿਪਾ ਦ੍ਰਿਸ਼ਟੀ ਸੇ (ਨਿਹਾਲਿ) ਦੇਖ ਕਰ ਕੇ ਤੁਝ ਕੋ ਆਪੇ ਹੀ ਅਪਨੇ ਚਰਨੋਂ ਮੇਂ ਲਗਾਇ ਲੇਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਆਪਣੀ ਮਿਹਰ ਦੀ ਨਿਗਾਹ ਨਾਲ ਤੱਕ, ਆਪ ਹੀ (ਆਪਣੇ ਸੇਵਕ ਨੂੰ ਆਪਣੇ ਚਰਨਾਂ ਵਿਚ) ਜੋੜੀ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਦਰਿ = ਮਿਹਰ ਦੀ ਨਿਗਾਹ ਨਾਲ। ਨਿਹਾਲਿ = ਵੇਖ ਕੇ, ਤੱਕ ਕੇ। ਆਪੇ = ਆਪ ਹੀ। ਲੈਹੁ ਲਾਇ = (ਆਪਣੇ ਚਰਨਾਂ ਵਿਚ) ਜੋੜ ਲੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él posará en ti Su Mirada de Gracia y te unirá a Su Ser."