[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਤ ਪਿਤਾ ਸੁਤ ਬੰਧਪੋ; ਤੂੰ ਮੇਰੇ ਪ੍ਰਾਣ ਅਧਾਰ ॥"
page = 203
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou at my mother, father, son, Kinsman, and the support of very life."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰੀ ਅੰਮੜੀ, ਬਾਬਲ, ਪੁਤ੍ਰ ਰਿਸ਼ਤੇਦਾਰ ਅਤੇ ਜਿੰਦ-ਜਾਨ ਦਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my mother, father, son and relative; You are the Support of the breath of life."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਤਾ ਪਿਤਾ ਪੁਤ੍ਰ ਭਾਈ ਔਰ ਮੇਰੇ ਪ੍ਰਾਣੋਂ ਕਾ ਆਸਰਾ ਸਭ ਤੂੰ ਹੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਦਯ! ਹੇ ਗੋਸਾਈਂ!) ਹੇ ਮੇਰੇ ਪ੍ਰਾਣਾਂ ਦੇ ਆਸਰੇ ਪ੍ਰਭੂ! ਮਾਂ, ਪਿਉ, ਪੁੱਤਰ, ਰਿਸ਼ਤੇਦਾਰ (ਸਭ ਕੁਝ ਮੇਰਾ) ਤੂੰ ਹੀ ਤੂੰ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੰਧਪੋ = ਬੰਧਪੁ, ਰਿਸ਼ਤੇਦਾਰ। ਅਧਾਰ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres mi madre, padre, hijo, pariente, y mi Aliento Vital."