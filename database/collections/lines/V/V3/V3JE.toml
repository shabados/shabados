[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਮਲ ਤੇ; ਜੋ ਰਾਮਹਿ ਜਾਨ ॥੬॥੩॥"
page = 1158
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and pure are they, who know their Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪਵਿੱਤ੍ਰ ਹਨ ਉਹ, ਜੋ ਆਪਣੇ ਪ੍ਰਭੂ ਨੂੰ ਜਾਣਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who know the Lord. ||6||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਿਰਮਲ ਭੀ ਵਹੀ ਹੈਂ, ਜੋ ਰਾਮ ਕੋ ਜਾਨਤੇ ਹੈਂ॥੬॥੩॥☬ਮੁਲਾਂ ਪ੍ਰਤੀ ਉਪਦੇਸ ਕਰਤੇ ਹੂਏ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਿਰਫ਼ ਉਹ ਮਨੁੱਖ ਪਵਿੱਤਰ ਹਨ ਜਿਨ੍ਹਾਂ ਨੇ ਪਰਮਾਤਮਾ ਨਾਲ ਸਾਂਝ ਪਾਈ ਹੈ ॥੬॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਮਹਿ = ਪਰਮਾਤਮਾ ਨੂੰ ॥੬॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aquellos sirvientes que conocen en su interior a Dios. (6-3)"