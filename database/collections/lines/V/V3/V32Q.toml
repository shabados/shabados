[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਿ ਤਰੀਐ ਨਾਨਕ; ਨਾਮ ਹਰਿ ਰੰਗਿ ॥੮॥"
page = 298
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man is saved, O Nanak by affectionately meditating on God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਿਆਰ ਨਾਲ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ, ਹੇ ਨਾਨਕ! ਬੰਦਾ ਪਾਰ ਉਤਰ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You shall be saved, O Nanak, by lovingly chanting the Lord's Name. ||8||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਨ ਸੰਗ ਪ੍ਰੇਮ ਕਰ ਹਰਿ ਨਾਮ ਜਪਣੇ ਸੇ ਹੀ ਸੰਸਾਰ ਸਾਗਰ ਸੇ ਤਰੀਤਾ ਹੈ॥੮॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਾਂ) ਹੇ ਨਾਨਕ! ਪਰਮਾਤਮਾ ਦੇ ਪ੍ਰੇਮ-ਰੰਗ ਵਿਚ ਟਿਕ ਕੇ ਹਰਿ-ਨਾਮ ਜਪ ਕੇ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘ ਜਾਈਦਾ ਹੈ ॥੮॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਪਿ = ਜਪ ਕੇ। ਰੰਗਿ = ਪ੍ਰੇਮ ਵਿਚ ॥੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y contemplando el Nombre lleno de Amor al Señor, es emancipado. (8)"