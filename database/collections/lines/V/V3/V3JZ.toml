[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਿ ਤਰੈ; ਸੰਗਤਿ ਕੁਲ ਤਾਰੈ ॥"
page = 353
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "She not only is herself emancipated but also saves the entire assemblage."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਨਾਂ ਕੇਵਲ ਖੁਦ ਹੀ ਬੰਦ-ਖਲਾਸ ਹੈ, ਸਗੋਂ ਸਭਨਾਂ ਨੂੰ ਭੀ ਪਾਰ ਕਰ ਦਿੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "She saves herself, and saves her family and friends as well."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਆਪ ਭੀ ਤਰੇ ਹੈ ਔਰ ਅਪਨੀ ਸੰਗਤਿ ਕੋ ਔ ਅਪਨੇ ਕੁਲ ਕੋ ਭੀ ਤਾਰੇ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਜੀਵ-ਇਸਤ੍ਰੀ ਆਪ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘ ਜਾਂਦੀ ਹੈ, ਅਤੇ ਆਪਣੀ ਸੰਗਤ ਵਿਚ ਆਪਣੀ ਕੁਲ ਨੂੰ ਤਾਰ ਲੈਂਦੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ella es en sí emancipada, libera a todos sus parientes,"