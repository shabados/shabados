[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਭੇਡ ਭਿਵਿੰਗਾ ਮੁਹੁ ਕਰੈ; ਤਰਣਾਪੈ ਦਿਹਿ ਚਾਰਿ ਵਲਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The sheep, too, during its brief... youth bleats loudly (proudly)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਭੇਡ ਭੈਂ ਭੈਂ ਦਾ ਸ਼ਬਦ ਮੂੰਹੋਂ ਬੋਲਕੇ (ਅਥਵਾ ਇਕ ਅੱਖ ਵਿੰਗੀ ਕਰ ਕੇ ਤੁਰਦੀ ਹੈ) ਜਵਾਨੀ ਦੇ ਚਾਰ ਦਿਨ ਲੰਘਾਉਂਦੀ (ਓੜਕ ਕੋਹੀ ਜਾਂਦੀ ਹੈ)।"