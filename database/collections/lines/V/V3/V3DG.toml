[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹ ਸੇਵਕ; ਗੋਪਾਲ ਗੁਸਾਈ ॥"
page = 1349
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Bliss, peace and salvation abide at the place, where the Lord Master's slaves dwell."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੁਸ਼ੀ, ਆਰਾਮ ਅਤੇ ਮੁਕਤੀ ਉਸ ਥਾਂ ਤੇ ਵੱਸਦੇ ਹਨ, ਜਿਥੇ ਸੁਆਮੀ-ਮਾਲਕ ਦੇ ਗੋਲੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "where the servants of the Lord of the World abide."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਪਾਲ ਗੁਸਾਈਂ! ਜਹਾਂ ਤੇਰੇ ਸੇਵਕ ਨਿਵਾਸ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿੱਥੇ (ਸਾਧ ਸੰਗਤ ਵਿਚ) ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਰੱਖਿਅਕ ਖਸਮ-ਪ੍ਰਭੂ ਦੇ ਭਗਤ-ਜਨ (ਰਹਿੰਦੇ ਹਨ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਹ = ਜਿੱਥੇ। ਸੇਵਕ ਗੋਪਾਲ = ਗੋਪਾਲ ਦੇ ਸੇਵਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "donde los Sirvientes del Señor del mundo habitan. Dios,"