type = "primary"
data = "ਪ੍ਰੀਤਿ ਠਾਨਿ ਨਹਿ ਕੇਲ ਕਮਾਵੈ ॥੪॥"
page = 879

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He would come to her house every day, would show fondness but would not revel in making love.(4)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਉਸ ਨਾਲ ਪ੍ਰੇਮ ਪੂਰਵਕ ਰਤੀ-ਕ੍ਰੀੜਾ ਨਾ ਕਰਦਾ ॥੪॥"