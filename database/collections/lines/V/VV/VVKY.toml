data = "ਕੋਟਿ ਇੰਦ੍ਰ; ਠਾਢੇ ਹੈ ਦੁਆਰ ॥"
page = 1156
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Million of Indras stand at His door."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾਂ ਹੀ ਇੰਦ੍ਰ ਉਸ ਦੇ ਬੂਹੇ ਤੇ ਖੜ੍ਹੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Millions of Indras stand at His Door."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜੋਂ ਹੀ ਇੰਦ੍ਰ ਆਪ ਕੇ ਦ੍ਵਾਰੇ ਪਰ ਖੜੇ ਹੋ ਰਹੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾਂ ਇੰਦ੍ਰ ਉਸ ਦੇ ਦਰ ਤੇ ਖੜੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਢੇ = ਖਲੋਤੇ ਹੋਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien a Su Puerta tocan millones de Indras,"