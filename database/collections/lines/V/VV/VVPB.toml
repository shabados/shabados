[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਸ੍ਤਗੀਰੀ ਦੇਹਿ ਦਿਲਾਵਰ; ਤੂਹੀ ਤੂਹੀ ਏਕ ॥"
page = 724
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Give me assistance, O Chivalrous Lord, for Thou and Thou alone art."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਸਹਾਇਤਾ ਦੇ, ਹੇ ਸੂਰਬੀਰ ਸਾਹਿਬ ਕਿਉਂਕਿ ਕੇਵਲ ਤੂੰ ਅਤੇ ਤੂੰ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Give me Your help, O brave and generous Lord; You are the One, You are the Only Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਦਸ੍ਤ) ਹਾਥ ਮੇਰੇ ਕਾ (ਗੀਰੀ) ਪਕੜਨਾ ਕਰ ਏਹੀ ਦਾਨ ਮੈਨੂੰ ਦੇਹ, ਹੇ ਪਰਮ (ਦਿਲਾਵਰ) ਬਹਾਦਰ! ਏਕ ਤੂ ਹੀ ਲੋਕ ਔ ਤੂ ਹੀ ਪ੍ਰਲੋਕ ਮੇਂ ਮੇਰਾ ਵਾਲੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੂਰਮੇ ਪ੍ਰਭੂ! ਮੇਰੀ ਸਹਾਇਤਾ ਕਰ, ਇਕ ਤੂੰ ਹੀ (ਮੇਰਾ ਆਸਰਾ) ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਸ੍ਤ = ਹੱਥ। ਦਸ੍ਤਗੀਰੀ = ਹੱਥ ਫੜਨ ਦੀ ਕ੍ਰਿਆ, ਸਹਾਇਤਾ। ਦਸ੍ਤਗੀਰੀ ਦੇਹਿ = (ਮੇਰਾ) ਹੱਥ ਫੜ, ਮੇਰੀ ਸਹਾਇਤਾ ਕਰ। ਦਿਲਾਵਰ = ਹੇ ਦਿਲਾਵਰ! ਹੇ ਸੂਰਮੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Otórgame Tu Ayuda, oh Bravo y Generoso Señor, eres el Uno, eres el Único Señor."