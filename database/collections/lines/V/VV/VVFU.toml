[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਧੁ ਅਗਿਆਨੀ; ਕਦੇ ਨ ਸੀਝੈ ॥੨॥"
page = 160
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The blind ignorant never gets reformed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਨ੍ਹੇ ਤੇ ਬੇਸਮਝ ਦਾ ਕਦਾਚਿੱਤ ਸੁਧਾਰ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Blind and ignorant, he shall never be reformed. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਕੇ ਮੋਹ ਕਰ ਕੇ ਅੰਧਾ ਹੂਆ ਅਗ੍ਯਾਨੀ ਕਬੀ ਨਹੀਂ ਸੀਝਤਾ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹੋ ਜਿਹਾ ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ) ਅੰਨ੍ਹਾ ਤੇ ਗਿਆਨ-ਹੀਨ ਮਨੁੱਖ (ਜ਼ਿੰਦਗੀ ਦੀ ਬਾਜ਼ੀ ਵਿਚ) ਕਦੇ ਕਾਮਯਾਬ ਨਹੀਂ ਹੁੰਦਾ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੀਝੈ = ਕਾਮਯਾਬ ਹੁੰਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y, estando ciego y tonto, no es liberado.  (2)"