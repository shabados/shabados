[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਰਗਟੁ ਭਇਆ ਸੰਸਾਰਿ; ਮਿਹਰ ਛਾਵਾਣਿਆ ॥"
page = 1291
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have become renowned throughout the whole world and the canopy of the Lord's grace is stretched over me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਾਰੇ ਜਹਾਨ ਵਿੱਚ ਪ੍ਰਸਿੱਧ ਹੋ ਗਿਆ ਹਾਂ ਅਤੇ ਸੁਆਮੀ ਦੀ ਰਹਿਮਤ ਦਾ ਸ਼ਾਮਿਆਨਾ ਮੇਰੇ ਉਤੇ ਤਣ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have become famous throughout the world, under the canopy of His kindness and grace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸਰ ਕਾ ਮੇਹਰ ਰੂਪੀ (ਛਾਵਾਣਿਆ) ਸਾਇਆਵਾਨ ਸੰਸਾਰ ਮੇਂ ਪ੍ਰਗਟ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਿਮਰਨ ਕਰਨ ਵਾਲਾ ਮਨੁੱਖ) ਜਗਤ ਵਿਚ ਭੀ ਉੱਘਾ ਹੋ ਜਾਂਦਾ ਹੈ, ਪ੍ਰਭੂ ਦੀ ਮਿਹਰ ਦਾ ਸਾਇਬਾਨ ਉਸ ਉਤੇ, ਮਾਨੋ, ਤਣਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛਾਵਾਣਿਆ = ਸਾਇਬਾਨ। ਪਰਗਟੁ = ਉੱਘਾ। ਸੰਸਾਰਿ = ਸੰਸਾਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me he vuelto famoso en el mundo. Bajo el Dosel de Su Bondad y Su Gracia"