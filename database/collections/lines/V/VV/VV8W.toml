[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਿਗੜੈ ਆਪਿ, ਵਿਗਾੜੈ ਲੋਈ ॥੯॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Ruined himself he ruins others."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਆਪ ਵਿਗੜਦਾ ਹੈ ਨਾਲਦਿਆਂ ਸਾਥੀਆਂ ਨੂੰ ਵਿਗਾੜਦਾ ਹੈ।"