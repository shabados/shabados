[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਤੇ; ਕਰਣ ਪਲਾਹ ਕਰੇ ॥"
page = 1227
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man wails he in pain, because,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਾਣੀ ਦੁਖ ਅੰਦਰ ਵਿਰਲਾਪ ਕਰਦਾ ਹੈ, ਕਿਉਂ ਕਿ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You whine and cry"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਤਾਂ ਤੇ) ਤਿਸੀ ਤੇ ਜੀਉ (ਕਰਣ ਪਲਾਹ) ਅਤਿਅੰਤ ਰੁਦਨ ਕਰਤਾ ਹੈ॥☬ਜੇ ਕਹੇ ਕਾਹੇ ਤੇ? ਸੋ ਕਹਿਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ (ਮਾਇਆ) ਵਾਸਤੇ (ਮਨੁੱਖ ਸਦਾ ਹੀ) ਤਰਸ-ਭਰੇ ਕੀਰਨੇ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਤੇ = ਤਾਂ ਤੇ, ਇਸ ਵਾਸਤੇ। ਕਰਣ ਪਲਾਹ = {करुणा प्रलाप} ਤਰਸ-ਭਰੇ ਕੀਰਨੇ, ਤਰਲੇ। ਕਰੇ = ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno sufre y se aflige constantemente, pues no habita en Dios,"