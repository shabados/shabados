[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੁ ਮਨੁ ਦੀਜੈ; ਤਾ ਕਉ ਵਾਰਿ ॥"
page = 1142
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My this soul, I make a sacrifice unto Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਇਹ ਆਤਮਾਂ ਮੈਂ ਉਸ ਉਤੋਂ ਕੁਰਬਾਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I offer this mind as a sacrifice."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਹ ਇਹ ਮਨ ਤਿਸ ਕੇ ਊਪਰ ਸੇ ਵਾਰਨੇ ਕਰ ਦੀਜੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਇਹ ਮਨ ਉਸ ਪਰਮਾਤਮਾ ਦੇ ਅੱਗੇ ਭੇਟਾ ਕਰ ਦੇਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਾਰਿ ਦੀਜੈ = ਸਦਕੇ ਕਰ ਦੇਈਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, mi mente está para siempre dedicada a mi Señor."