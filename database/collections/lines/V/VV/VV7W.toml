[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਆ ਮਾਨੁਖ; ਕਹਹੁ ਕਿਆ ਜੋਰੁ ॥"
page = 178
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What is man? says, what power he has?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਦਮੀ ਕੀ ਹੈ? ਦੱਸੋ ਖਾ ਉਸ ਵਿੱਚ ਕਿਹੜੀ ਸਤਿਆ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What is the human? What power does he have?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਨੁਖ ਕਿਆ ਤੁਛ ਹੈ, ਪੁਨਾ ਜੋਰ ਇਸ ਕਾ ਕਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦੱਸੋ, ਇਹ ਬੰਦੇ ਕੀਹ ਕਰਨ ਜੋਗੇ ਹਨ? ਇਹਨਾਂ ਦੀ ਆਕੜ (ਦੀ) ਕੀਹ (ਪਾਂਇਆਂ) ਹੈ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Di, ¿qué poder tiene un simple mortal?"