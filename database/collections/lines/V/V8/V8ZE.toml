[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਜਨ; ਕਹਾ ਬਿਆਪੈ ਮਾਇਆ ॥੨॥"
page = 388
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "how can mammon cling to that man?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਇਨਸਾਨ ਨੂੰ ਮੋਹਨੀ ਕਿਸ ਤਰ੍ਹਾਂ ਚਿਮੜ ਸਕਦੀ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- how can Maya cling to him? ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਦਾਸ ਕੋ ਭਲਾ ਮਾਯਾ ਕਬ ਬ੍ਯਾਪ ਸਕਤੀ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਉਸ ਮਨੁੱਖ ਉਤੇ ਕਦੇ ਭੀ ਆਪਣਾ ਪ੍ਰਭਾਵ ਨਹੀਂ ਪਾ ਸਕਦੀ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹਾ = ਕਿੱਥੇ? ਬਿਲਕੁਲ ਨਹੀਂ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a él la Maya no lo contamina. (2)"