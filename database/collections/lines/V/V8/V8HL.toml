[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤ੍ਰਿਸਨਾ ਭੂਖ ਸਭ ਨਾਸੀ ॥"
page = 897
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All thirst and hunger are stilled,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਭ ਤ੍ਰੇਹ ਤੇ ਭੁੱਖਾਂ ਦੂਰ ਹੋ ਜਾਂਦੀਆਂ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Hunger and thirst are totally quenched;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੀ ਤ੍ਰਿਸਨਾ ਰੂਪੁ ਭੂਖ ਸਭ ਦੂਰ ਹੋਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਾਣੀ! ਉਸ ਮਨੁੱਖ ਦੇ ਅੰਦਰੋਂ (ਮਾਇਆ ਦੀ) ਤ੍ਰਿਸ਼ਨਾ (ਮਾਇਆ ਦੀ) ਭੁੱਖ ਸਭ ਨਾਸ ਹੋ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤ੍ਰਿਸਨਾ = ਤ੍ਰੇਹ, ਲਾਲਚ। ਸਭ = ਸਾਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todas las ansiedades y los deseos terminan."