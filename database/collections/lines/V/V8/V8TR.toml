[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਿਤਾ ਹਮਾਰੋ; ਵਡ ਗੋਸਾਈ ॥"
page = 476
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Father is the great Lord of the world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਬਾਪੂ ਸੰਸਾਰ ਦਾ ਵੱਡਾ ਸੁਆਮੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My Father is the Great Lord of the Universe."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰਾ ਪਿਤਾ ਹਰਿ ਸਭ ਸੇ ਬੜਾ (ਗੋ) ਪ੍ਰਿਥਵੀ ਕਾ (ਸਾਈ) ਮਾਲਕ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ (ਉਹ) ਪਿਉ ਬੜਾ ਵੱਡਾ ਮਾਲਕ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੋਸਾਈ = ਮਾਲਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Padre es el gran Maestro de la Tierra;"