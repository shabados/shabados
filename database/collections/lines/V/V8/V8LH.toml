[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਧਰਹਿ ਆਪਿ; ਤਰੈ ਸੰਸਾਰੁ ॥"
page = 185
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou Thyself shalt be saves and through thee shall be saves the world,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪ ਪਾਰ ਉਤਰ ਜਾਵੇਗਾ ਅਤੇ ਤੇਰੇ ਰਾਹੀਂ ਜਗਤ ਪਾਰ ਉਤਰ ਜਾਵੇਗਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You shall be redeemed, and through you, the whole world shall be saved,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਆਪ ਜਗਤ ਸੇ ਉਧਰੇ ਹੈਂ ਔਰ ਸਤਿਸੰਗੀਓਂ ਕੋ ਤਾਰ ਲੇਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਰਾਮ ਨਾਮ ਜਪ ਕੇ) ਤੂੰ ਆਪ (ਵਿਕਾਰਾਂ ਤੋਂ) ਬਚ ਜਾਏਂਗਾ, (ਤੇਰੀ ਸੰਗਤਿ ਵਿਚ) ਜਗਤ ਭੀ (ਵਿਕਾਰਾਂ ਦੇ ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘ ਜਾਇਗਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਧਰਹਿ = ਤੂੰ ਬਚ ਜਾਏਂਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Serán renovados, Y a través de ustedes el mundo será salvado,"