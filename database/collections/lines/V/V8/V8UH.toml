[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਨਾਮ. ਊਤਮ ਗਤਿ ਹੋਈ ॥"
page = 1342
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Lord's Name, one is blest with the sublime state of bliss."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਰਾਹੀਂ, ਪ੍ਰਾਣੀ ਨੂੰ ਪ੍ਰਸੰਨਤਾ ਦੀ ਸ਼੍ਰੇਸ਼ਟ ਅਵਸਥਾ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Lord's Name, one obtains the most sublime and exalted state."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਤਿਸ ਕੇ ਰਾਮ ਨਾਮ ਕੋ ਜਪਿਆ ਹੈ, ਤਿਨ ਕੀ ਉਤਮ ਗਤੀ ਹੋਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਜਪ ਕੇ ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a través del Nombre del Señor, uno obtiene el más Exaltado y Sublime Estado."