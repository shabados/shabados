data = "ਜਿਨ ਪ੍ਰਭ ਏਕ ਵਹੈ ਠਹਰਾ︁ਯੋ ॥"
page = 158

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Those who have recognized only God as the Lord of all,"

[[content]]
assets = ["RSJD"]
type = "translation"
