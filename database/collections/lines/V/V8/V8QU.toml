data = "ਜਿਨ੍ਹਾਂ ਨੇ ਕੇਵਲ ਉਸੇ ਇਕ ਪ੍ਰਭੁ ਨੂੰ (ਆਪਣਾ ਸੁਆਮੀ) ਠਹਿਰਾਇਆ ਹੈ,"