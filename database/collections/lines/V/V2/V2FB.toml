[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੀਚੁ. ਨ ਕੋਇ ਕਰੇ; ਅਕ੍ਰਿਤਘਣੁ ਵਿਛੁੜਿ ਪਇਆ ॥"
page = 546
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The ungrateful person is separated from the Lord and none does mediate for him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਂ-ਸ਼ੁਕਰਾ ਪੁਰਸ਼ ਪ੍ਰਭੂ ਨਾਲੋ ਵੱਖਰਾ ਹੋ ਜਾਂਦਾ ਹੈ। ਕੋਈ ਭੀ ਉਸ ਦੀ ਵਿਚੋਲਗੀ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one advocates for the ungrateful person, who is separated from the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ ਕੀ ਬੀਚ, ਭਾਵ ਵਕਾਲਤ ਕਾ ਬਿਚੋਲਗੀ ਕੋਈ ਨਹੀਂ ਕਰ ਸਕਤਾ, ਅਕ੍ਰਿਤਘਨ ਵਿਛੜ ਪੜਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾ-ਸ਼ੁਕਰਾ (ਪਰਮਾਤਮਾ ਦੇ ਕੀਤੇ ਉਪਕਾਰਾਂ ਨੂੰ ਨਾਹ ਜਾਣਨ ਵਾਲਾ) ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੇ ਚਰਨਾਂ ਤੋਂ ਵਿਛੁੜਿਆ ਰਹਿੰਦਾ ਹੈ ਤੇ (ਪ੍ਰਭੂ-ਮਿਲਾਪ ਲਈ) ਕੋਈ (ਉਸ ਦਾ) ਵਿਚੋਲਾ-ਪਨ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੀਚੁ = ਵਿਚੋਲਾ-ਪਨ। ਅਕ੍ਰਿਤਘਣੁ = {कृतघ्न} ਕੀਤੀ ਭਲਾਈ ਨੂੰ ਨਾਹ ਜਾਣਨ ਵਾਲਾ, ਨਾ-ਸ਼ੁਕਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Quién puede suplicar por un malagradecido que nunca quiso saber nada de Dios?"