[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਣ ਵਣ ਵਿਚਿ ਵਣਾਸਪਤਿ; ਰਹੈ ਉਜਾੜਿ ਅੰਦਰਿ ਅਵਸਾਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The vegetation in the desolate places in the forest remains unknown."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਉਜਾੜ ਦੇ ਅੰਦਰ ਵਣਾਂ ਵਣਾਂ (ਅਰਥਾਤ ਬਹੁਤੇ ਦਰਖਤਾਂ) ਵਿਚ ਕਈ ਬੇਮਲੂਮ ਬਨਾਸਪਤੀ ਹੁੰਦੀ ਹੈ।"