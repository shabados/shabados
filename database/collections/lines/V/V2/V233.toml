[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੋਹਿ ਦੀਨ; ਹਰਿ ਹਰਿ ਓਟ ਲੀਤੀ ॥੨॥"
page = 912
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I, the meek one, have sought the protection of the Lord-Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਮਸਕੀਨ ਨੇ ਸੁਆਮੀ ਮਾਲਕ ਦੀ ਹੀ ਪਨਾਹ ਲਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am meek; I seek the shelter and support of the Lord, Har, Har. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਦੀਨ ਨੇ ਹੇ ਹਰਿ! ਤੇਰੇ ਹਰਿ ਨਾਮ ਕੀ ਓਟ ਲਈ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਮੈਂ ਗਰੀਬ ਨੇ ਸਿਰਫ਼ ਪਰਮਾਤਮਾ ਦਾ ਆਸਰਾ ਲਿਆ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Yo he querido someterme en humildad al Refugio de mi Dios.  (2)"