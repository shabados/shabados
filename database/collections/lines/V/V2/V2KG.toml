[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ ਤੂ ਸਾਹਿਬ; ਆਵਹਿ ਰੋਹਿ ॥"
page = 25
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If Thou in rage be O Lord!"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਤੈਨੂੰ ਗੁੰਸਾ ਭੀ ਆਉਂਦਾ ਹੈ ਹੇ ਸਾਈਂ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Even if You, O Lord and Master, become angry with them,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਹਿਬ! ਜੇ ਤੂੰ  ਕ੍ਰੋਧ ਮੇਂ ਭੀ ਆਵੈਂਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਲਕ ਪ੍ਰਭੂ! ਜੇ ਤੂੰ ਗੁੱਸੇ ਵਿਚ ਆਵੇਂ (ਤਾਂ ਕਿਸ ਉੱਤੇ ਆਵੇਂ?)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਹਿਬ = ਹੇ ਸਾਹਿਬ! ਰੋਹਿ = ਰੋਹ ਵਿਚ, ਗੁੱਸੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Señor. Aunque así lo hagas,"