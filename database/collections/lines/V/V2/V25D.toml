[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਰਦਿ ਕਹਿਆ; ਸਿ ਪੂਜ ਕਰਾਂਹੀ ॥"
page = 556
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As Narad instructed so they worship the idols."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਨਾਰਦ ਨੇ ਆਖਿਆ ਹੈ, ਉਸੇ ਤਰ੍ਹਾਂ ਹੀ ਉਹ ਬੁੱਤਾਂ ਦੀ ਉਪਾਸ਼ਨਾ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As Naarad instructed them, they are worshipping idols."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਉਨ ਮੇਂ ਸੇ ਜੋ ਸੁਭ ਕਰਮੀ ਦੇਖੀਤੇ ਹੈਂ, ਸੋ ਜਿਸ ਪ੍ਰਕਾਰ ਨਾਰਦ ਜੀ ਨੇ ਕਹਾ ਹੈ ਤਿਸ ਅਨੁਸਾਰ ਪਾਖਾਣ ਪੂਜਾ ਕਰਤੇ ਹੈਂ। ਨਾਰਦ ਪੰਚਰਾਤ੍ਰ ਮੇਂ ਪ੍ਰਿਤਮਾ ਪੂਜਨ ਕਾ ਬਿਧਾਨ ਨਾਦਰ ਜੀ ਨੇ ਬਹੁਤ ਕਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਰਦ ਨੇ ਆਖਿਆ ਉਹੀ ਪੂਜਾ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਰਦਿ = ਨਾਰਦ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "como Narad les instruyó, alaban ídolos."