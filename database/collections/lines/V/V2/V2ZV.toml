[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਰੈ ਨ ਆਵੈ ਜਾਈ ॥"
page = 623
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He dies not, nor comes, nor goes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਰਦਾ ਨਹੀਂ, ਨਾਂ ਹੀ ਆਉਂਦਾ ਹੈ, ਨਾਂ ਹੀ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He does not die, or come and go in reincarnation;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੁਧਾ ਸਰ ਮੇਂ ਇਸ਼ਨਾਨ ਕਰ ਕੇ ਹਰਿ ਨਾਮ ਕੇ ਧਿਆਵਨੇ ਵਾਰਾ ਹੋਵੈਗਾ ਨਾ ਵਹੁ ਜਨਮ ਕੇ ਪੁਨਾ ਆਵੇਗਾ ਨਾ ਵਹੁ ਮਰ ਕੇ ਜਾਏਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਜਨਮ ਮਰਨ ਦੇ ਗੇੜ ਵਿਚ ਨਹੀਂ ਪੈਂਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਆਵੈ ਜਾਈ = ਨ ਆਵੈ ਨ ਜਾਈ, ਜੰਮਦਾ ਮਰਦਾ ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él no muere, ni se va, ni viene otra vez,"