[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋਇ; ਖਸਮੁ ਹੈ ਜਾਇਆ ॥"
page = 1194
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The wife gives birth to her husband."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਤਨੀ ਆਪਣੇ ਪਤੀ ਨੂੰ ਜਨਮ ਦਿੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The wife gives birth to her husband."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਜੋਇ) ਮਾਯਾ ਅਰ (ਖਸਮੁ) ਈਸਰ ਨੇ ਮਨ ਪੁਤ੍ਰ ਕੋ (ਜਾਇਆ) ਉਤਪੰਨ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸਤ੍ਰੀ ਨੇ ਖਸਮ ਨੂੰ ਜਨਮ ਦਿੱਤਾ ਹੈ (ਭਾਵ, ਜਿਸ ਮਨ ਨੂੰ ਮਾਇਆ ਨੇ ਜਨਮ ਦਿੱਤਾ ਹੈ, ਉਹੀ ਇਸ ਨੂੰ ਭੋਗਣਹਾਰਾ ਬਣ ਜਾਂਦਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੋਇ = ਇਸਤ੍ਰੀ (ਨੇ)। ਜਾਇਆ = ਜੰਮਿਆ, ਜਨਮ ਦਿੱਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Maya, esa mujer, da a luz a la mente, su esposo; y este hijo de la mente,"