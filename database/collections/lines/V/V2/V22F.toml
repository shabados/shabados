type = "primary"
data = "ਤਾ ਕਉ; ਚਿੰਤਾ ਕਤਹੂੰ ਨਾਹਿ ॥੨॥"
page = 186
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "is never ridden by care."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਫਿਕਰ ਕਦਾਚਿੱਤ ਨਹੀਂ ਵਿਆਪਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- no cares will ever bother them. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪੁਰਸ ਕੋ ਚਿੰਤਾ ਕਬੀ ਨਹੀਂ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਕਦੇ ਕੋਈ ਚਿੰਤਾ ਨਹੀਂ ਪੋਂਹਦੀ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਤਹੂੰ = ਕਦੇ ਭੀ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿cómo podría infestarse de preocupaciones? (2)"