[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੇ ਕਰ ਮਹਾ ਤਤ ਕਹੁ ਚੀਨੈ; ਪਰਮ ਤਤ ਕਹੁ ਪਾਵੈ ॥"
page = 683

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "If anyone recognizes the essence, he achieves unity with the Supreme Essence"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੇ ਕਰ ਕੋਈ ਮਹਾ ਤੱਤ ਨੂੰ ਪਛਾਣ ਲਵੇ, ਤਾਂ ਉਹ ਪਰਮ ਤੱਤ ਨੂੰ ਪ੍ਰਾਪਤ ਕਰ ਲਵੇਗਾ।"