[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਤਰ ਬਦ੍ਰਿਕਾਸ੍ਰਮ ਬਿਖੈ; ਗਰੌ ਹਿਮਾਚਲ ਜਾਇ ॥੧੨॥"
page = 1003

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Or you run away to the mountains and bury yourself in snow.’(12)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਹੀਂ ਤਾਂ ਬਦ੍ਰਿਕਾਸ਼੍ਰਮ (ਬਦਰੀਨਾਥ) ਜਾ ਕੇ ਹਿਮਾਲੇ ਵਿਚ ਗਲ ਜਾ ॥੧੨॥"