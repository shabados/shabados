[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧ ਕੈ ਸੰਗਿ; ਪ੍ਰਗਟੈ ਸੁਗਿਆਨੁ ॥"
page = 271
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the saints congregation Divine knowledge is revealed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿ ਸੰਗਤ ਅੰਦਰ ਬ੍ਰਹਿਮ-ਵੀਚਾਰ ਜ਼ਾਹਿਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Company of the Holy, spiritual wisdom is revealed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੇ ਸੰਗ ਸੇ ਸ੍ਰੇਸਟ ਗ੍ਯਾਨ ਪ੍ਰਗਟ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸ੍ਰੇਸ਼ਟ ਗਿਆਨ ਪਰਗਟ ਹੁੰਦਾ ਹੈ (ਭਾਵ, ਚੰਗੀ ਮਤਿ ਆਉਂਦੀ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁ ਗਿਆਨੁ = ਸ੍ਰੇਸ਼ਟ ਗਿਆਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "quedando en su lugar Bienaventurada Luz de Sabiduría."