[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਾ ਦਾਨੁ; ਨਿਖੂਟੈ ਨਾਹੀ ॥"
page = 395
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whose bounties exhaust not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀਆਂ ਬਖਸ਼ੀਸ਼ਾਂ ਮੁਕਦੀਆਂ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His gifts are never exhausted."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਾ ਦੀਆ ਹੂਆ ਦਾਨੁ ਕਬੀ ਨਿਖੁਟਤਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਦੀ ਦਿੱਤੀ ਹੋਈ ਦਾਤਿ ਕਦੇ ਮੁੱਕਦੀ ਨਹੀਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਾਨੁ = ਬਖ਼ਸ਼ਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Aquél Cuyas Munificencias son Inexhaustibles,"