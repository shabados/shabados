[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਿਨ ਕੋ ਇਤਨੋ ਹਿਤ ਦੇਖਤ ਹੀ; ਅਤਿ ਆਨੰਦ ਸੋ ਭਗਵਾਨ ਹਸੇ ਹੈ ॥"
page = 356

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing such a great love for him, Krishna is laughing"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ (ਗੋਪੀਆਂ) ਦਾ ਇਤਨਾ ਪ੍ਰੇਮ ਵੇਖ ਕੇ ਬਹੁਤ ਆਨੰਦਿਤ ਹੋਏ ਕ੍ਰਿਸ਼ਨ ਹਸ ਰਹੇ ਹਨ।"