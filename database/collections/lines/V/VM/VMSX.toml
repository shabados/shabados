[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਾਸ ਅਪਨੇ ਆਪਿ ਰਾਖੇ ॥"
page = 628
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His slaves, He the Lord, Himself saves."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਗੋਲਿਆਂ ਦੀ ਉਹ ਸਾਹਿਬ ਆਪੇ ਹੀ ਰੱਖਿਆ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself protects His slaves."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਨੇ ਅਪਨੇ ਦਾਸ ਆਪ ਹੀ ਰਾਖੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਪ੍ਰਭੂ) ਆਪਣੇ ਸੇਵਕਾਂ ਦੀ ਆਪ ਰਖਿਆ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es Compasivo con todos, protege a Sus Devotos por todas partes"