[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਹਰਿ ਮੇਰਾ. ਅੰਤਰਜਾਮੀ ॥"
page = 740
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, my Lord, is the searcher of hearts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੇਰਾ ਸੁਆਮੀ ਦਿਲ ਦੀਆਂ ਜਾਨਣਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is my Lord, the Inner-knower, the Searcher of hearts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਸੋ ਤੂੰ ਅੰਤਰਯਾਮੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮਾਲਕ-ਪ੍ਰਭੂ ਆਪਣੇ ਭਗਤ ਜਨਾਂ ਦੇ ਨਾਲ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਤਰਜਾਮੀ = ਹਰੇਕ ਦੇ ਦਿਲ ਦੀ ਜਾਣਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, mi Señor, es el Conocedor Íntimo de mi corazón."