data = "ਏਕ ਨਟੂਆ ਤਹ ਰਹੈ; ਤਿਹ ਬਿਸੁਨ ਦਤ੍ਵਾ ਨਾਮ ॥"
page = 924

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There lived a bard who was known as Bishan Datt,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਇਕ ਨਟ ਰਹਿੰਦਾ ਸੀ ਜਿਸ ਦਾ ਨਾਂ ਬਿਸਨ ਦਤ੍ਵਾ ਸੀ।"