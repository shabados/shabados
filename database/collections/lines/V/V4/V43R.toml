[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਧਰਾ ਨਾਥ ਸਬਨਨ ਤਨ ਕਹਾ ॥"
page = 707

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Hearing this Matsyendra remained silent and Parasnath etc. all of them said their things to him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਫਿਰ) ਰਾਜੇ (ਪਾਰਸ ਨਾਥ) ਨੇ ਸਭ ਨੂੰ ਕਿਹਾ।"