[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਤ੍ਰਿਯ ਪਹਿ ਲੈ ਆਇਯੋ; ਅਪਨੇ ਘਰ ਕੇ ਮਾਹਿ ॥੨੯॥"
page = 858

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He brought home to the woman.(29)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਨੇ ਆਪਣੇ ਘਰ ਵਿਚ ਲਿਆ ਕੇ ਇਸਤਰੀ ਨੂੰ ਦੇ ਦਿੱਤੀਆਂ ॥੨੯॥"