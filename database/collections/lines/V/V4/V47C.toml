[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਨਹੀ; ਘੂਘਰ ਨਿਰਤਿ ਕਰਾਈ ॥"
page = 913
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some one dances, wearing small anklets."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਜਣਾ ਪੈਰਾਂ ਨੂੰ ਘੁੰਗਰੂ ਬੰਨ੍ਹ ਕੇ ਨੱਚਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some dance, wearing ankle bells."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਸੀ ਨੇ ਘੁੰਘਰੂ ਬਾਧਕੈ ਨਿਰਤ ਆਪ ਕਰੀ ਹੈ ਔਰੋਂ ਪੈ ਕਰਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਨੇ ਘੁੰਘਰੂ ਬੰਨ੍ਹ ਕੇ (ਦੇਵਤਿਆਂ ਅੱਗੇ) ਨਾਚ ਸ਼ੁਰੂ ਕੀਤੇ ਹੋਏ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘੂਘਰ ਨਿਰਤਿ = ਘੁੰਘਰੂ ਪਾ ਕੇ ਨਾਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Algunos bailan al compás de las campanas de sus tobillos,"