[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਕਾਰਣਿ; ਪੜਿ ਪੜਿ ਲੂਝਹਿ ॥"
page = 1050
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and reading and reciting quarrels for the sake of wealth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪੜ੍ਹ ਤੇ ਵਾਚ ਕੇ ਧਨ ਦੀ ਖ਼ਾਤਰ ਝਗੜਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "For the sake of Maya, he reads and recites and argues."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਵਾਸਤੇ ਪੜ ਪੜ ਕੇ ਝਗੜਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਹ ਮਾਇਆ (ਕਮਾਣ) ਵਾਸਤੇ ਹੀ (ਵੇਦ ਆਦਿਕ ਧਰਮ-ਪੁਸਤਕਾਂ ਨੂੰ) ਪੜ੍ਹ ਪੜ੍ਹ ਕੇ (ਮਾਇਆ ਦੇ ਘੱਟ ਚੜ੍ਹਾਵੇ ਤੇ ਅੰਦਰੇ ਅੰਦਰ) ਖਿੱਝਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਰਣਿ = ਦੀ ਖ਼ਾਤਰ। ਪੜਿ = ਪੜ੍ਹ ਕੇ। ਲੂਝਹਿ = ਸੜਦੇ ਹਨ, ਖਿੱਝਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y siendo engañado por Maya, lee sólo para crear conflictos."