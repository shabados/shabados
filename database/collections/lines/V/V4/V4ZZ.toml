[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਈ ਕਰਣਾ; ਜਿ ਆਪਿ ਕਰਾਏ ॥"
page = 108
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Men do that which the Lord Himself directs them to do."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੰਦੇ ਉਹੀ ਕਰਦੇ ਹਨ ਜਿਹੜਾ ਕੁਛ ਸਾਈਂ ਖੁਦ ਉਨ੍ਹਾਂ ਕੋਲੋ ਕਰਵਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "People do whatever the Lord inspires them to do."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਕਾਰਜ ਕਰੀਤਾ ਹੈ, ਜੋ ਤੂੰ ਆਪ ਕਰਾਵਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੀਵ) ਉਹੀ ਕੰਮ ਕਰ ਸਕਦਾ ਹੈ, ਜੇਹੜਾ ਪਰਮਾਤਮਾ ਆਪ ਕਰਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿ = ਜੇਹੜਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Yo hago todo aquello que el Señor manifiesta a través de mí;"