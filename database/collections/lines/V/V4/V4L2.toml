[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਿ ਮਨ ਨਾਮੁ; ਏਕੁ ਅਪਾਰੁ ॥"
page = 51
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Man! repeat the Name of the One Infinite Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੰਦੇਸ! ਤੂੰ ਇਕ ਅਨੰਤ ਸਾਈਂ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mind, chant the Name of the One, the Unique and Infinite Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਏਕ (ਅਧਾਰੁ) ਪਰਮੇਸ੍ਵਰ ਕਾ ਨਾਮੁ ਜਪੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਉਸ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪ, ਜੋ ਇਕ ਆਪ ਹੀ ਆਪ ਹੈ ਤੇ ਜੋ ਬੇਅੰਤ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਪਾਰੁ = ਬੇਅੰਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Medita, oh mi mente, en el Nombre Grandioso."