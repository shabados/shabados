[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਿਲਾਨਿ ਕੋਪ ਮਾਨ ਅਪ੍ਰਮਾਨ ਬਾਨ ਸੋ ਹਨ︀ਯੋ ॥"
page = 706

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Galani (hatred) was pierced with many arrows"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਗਿਲਾਨੀ, ਕੋਪ (ਕ੍ਰੋਧ) ਅਤੇ ਮਾਨ ਨੂੰ ਬੇਸ਼ੁਮਾਰ ('ਅਪ੍ਰਮਾਨ') ਬਾਣਾਂ ਨਾਲ ਮਾਰਿਆ ਹੈ।"