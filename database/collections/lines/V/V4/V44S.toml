[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੁਛਿਤ ਹ੍ਵੈ ਤਿਨ ਯੌ ਲਖਿਯੋ; ਹਰਿ ਆਏ ਅਬ ਹਾਥਿ ॥੨੪੭੬॥"
page = 549

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Playing with Krishna for a long time, they became unconscious and in that unconscious state they saw that they had got Krishna in their grip.2476."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬੇਹੋਸ਼ੀ ਦੀ ਹਾਲਤ ਵਿਚ ਉਨ੍ਹਾਂ ਨੇ ਇਹ ਸਮਝਿਆ ਕਿ ਹੁਣ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਹੱਥ ਆ ਗਏ ਹਨ ॥੨੪੭੬॥"