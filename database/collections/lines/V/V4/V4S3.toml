[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਅਨਦਿਨੁ; ਨਾਮੁ ਲਈ ਕਰਤਾਰੇ ॥"
page = 998
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day, utter I the Name of my Creator-Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੈਣ ਦਿਹੁੰ, ਮੈਂ ਆਪਣੇ ਸਿਰਜਣਹਾਰ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I chant the Name of the Creator Lord, night and day."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਸੇ ਹਮ ਰਾਤ ਦਿਨ ਕਰਤਾਰ ਕਾ ਨਾਮ ਹੀ ਲੇਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹਰ ਵੇਲੇ (ਉਸ) ਕਰਤਾਰ ਦਾ ਨਾਮ ਜਪਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਹਉਂ, ਮੈਂ। ਅਨਦਿਨੁ = ਹਰ ਰੋਜ਼ {अनुदिनं}, ਹਰ ਵੇਲੇ। ਲਈ = ਲਈਂ, ਮੈਂ ਲੈਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Recito siempre el Nombre del Señor Creador,"