[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਪੂਰੈ; ਤਾ ਕੇ ਕਾਟੇ ਜਾਲ ॥੪॥੧੩॥੮੨॥"
page = 180
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the perfect Guru has cut the noose of him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਾਂ ਨੇ ਉਸ ਦੀ ਫਾਹੀ ਕਟ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Unto whom the Lord has shown His Mercy. ||4||13||82||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪੁਰਸ ਕੇ ਗੁਰੂ ਪੂਰੇ ਨੇ (ਜਾਲ) ਫਾਸਿ ਕਾਟ ਦੀਏ ਹੈਂ॥੪॥੧੩॥੮੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੂ ਨੇ ਉਸ ਮਨੁੱਖ ਦੇ (ਮਾਇਆ ਦੇ ਮੋਹ ਦੇ) ਫਾਹੇ ਕੱਟ ਦਿੱਤੇ ਹਨ ॥੪॥੧੩॥੮੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ। ਤਾ ਕੇ = ਉਸ ਦੇ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es liberado de la red y convertido en un pájaro libre. (4-13-82)"