data = "ਸੁੰਦਰ ਸੁਰੰਗ ਜਗ ਕਰਿ ਅਰੂਪ ॥੮੪॥"
page = 642

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He has the same form in the beginning and at the end and He is the Creator of this fascinating world.84."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ) ਸੁੰਦਰ ਸਰੂਪ ਵਾਲੇ ਨੇ ਅਨੂਪਮ ਜਗਤ ਦੀ ਰਚਨਾ ਕੀਤੀ ਹੈ ॥੮੪॥"