[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਫਿਰ ਉਹ ਇਸ ਕਿਤਾਬ ਦੇ ਪਰਦੇ ਵਿਚ ਕਿਵੇਂ ਸਮਾ ਸਕਦੀ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਕੁਜਾ ਗੁੰਜਦ ਅੰਦਰ ਹਜਾਬਿ ਕਿਤਾਬ ॥੧੭੪॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "How could, then, they be confined to the screens (pages) of any book. (174)"