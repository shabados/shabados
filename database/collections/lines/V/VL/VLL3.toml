[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਗਿਰੀ ਮੇਰ ਸੁਵਰਨ ਥੀਵੇ ॥"
page = 276
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "(By Lord's order) many millions of hills and mountains have become of gold."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਦੇ ਹੁਕਮ ਦੁਆਰਾ) ਅਨੇਕਾਂ ਕ੍ਰੋੜ ਪਹਾੜੀਆਂ ਤੇ ਪਹਾੜ ਸੋਨੇ ਦੇ ਹੋ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions of hills and mountains have been made of gold."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਕਈ ਕ੍ਰੋੜੋਂ (ਗਿਰੀ) ਪਰਬਤ ਸੁਵਰਨ ਕੇ ਸੁਮੇਰ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਰੋੜਾਂ ਹੀ ਸੋਨੇ ਦੇ ਸੁਮੇਰ ਪਰਬਤ ਬਣ ਗਏ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਿਰੀ = ਪਹਾੜ। ਥੀਵੇ = ਹੋ ਗਏ, ਬਣ ਗਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones las colinas y montañas de oro."