data = "ਕਿ ਲਾਯਕ ਜਹਾ ਬੂਦ ਅਜ਼ ਮੁਲਕ ਮਾਲ ॥੪॥"
page = 1424

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And whose intellect made him worthy of managing his countries’ affairs.(4)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਮੁਲਕ ਨੂੰ ਸੰਭਾਲਣ ਲਈ ਬਹੁਤ ਯੋਗ ਸੀ ॥੪॥"