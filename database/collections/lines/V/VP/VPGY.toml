[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਆ ਜਾਨਾਂ; ਕਿਆ ਕਰੈ ਕਰਾਵੈ ॥"
page = 1331
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What do I know as to what the Lord does and causes to be done?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕੀ ਜਾਣਦਾ ਹਾਂ, ਕਿ ਸੁਆਮੀ ਕੀ ਰਕਦਾ ਅਤੇ ਕਰਾਉਂਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What do I know about what God does?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਕਿਆ ਜਾਨੋਂ ਓਹ ਜੋ ਕਿਆ ਕਰਤਾ ਹੈ ਔਰ ਕਿਆ ਕਰਾਵਤਾ ਹੈ? ਭਾਵ ਇਹ ਤਿਸ ਕਾ ਕੋਈ ਕਰਮ ਜਾਨਿਆ ਨਹੀਂ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਇਹ ਸਮਝ ਨਹੀਂ ਕਿ (ਮੇਰਾ ਸਿਰਜਣਹਾਰ ਮੇਰੇ ਵਾਸਤੇ) ਕੀਹ ਕੁਝ ਕਰ ਰਿਹਾ ਤੇ (ਮੈਥੋਂ) ਕੀ ਕਰਾ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਆ ਜਾਨਾਂ = ਮੈਂ ਕੀਹ ਜਾਣਦਾ ਹਾਂ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Qué sé yo de lo que Dios hace? Sin el Naam,"