[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਚਿੰਦਿਆ; ਸਤਿਗੁਰੂ ਦਿਵਾਇਆ ॥"
page = 396
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Satguru has granted me what my mind wished for."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਉਹ ਕੁਛ ਬਖਸ਼ ਦਿੱਤਾ ਹੈ ਜਿਸ ਨੂੰ ਮੇਰਾ ਚਿੱਤ ਚਾਹੁੰਦਾ ਸੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That which my mind wishes for, the True Guru has granted."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰੇ ਕੋ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਨੇ ਮਨ ਇਛਤ ਫਲੁ ਅਕਾਲ ਪੁਰਖ ਸੇ ਦਿਵਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਉਹਨਾਂ ਨੂੰ ਮਨ-ਇੱਛਤ ਫਲ ਦੇਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ ਚਿੰਦਿਆ = ਮਨ-ਇੱਛਤ (ਫਲ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Poder de la Rectitud. Así fue mi deseo, y así fui bendecido por Dios,"