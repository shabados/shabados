[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਅਪਨੇ ਕੈ; ਹਰਿ ਮਨਿ ਬਸੈ ॥੩॥"
page = 1146
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "when God abides within the mind of that slave."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਗੋਲੇ ਦੇ ਚਿੱਤ ਦੇ ਅੰਦਰ ਰਬ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord dwells within the mind of His humble servant. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਤੂੰ ਜਿਸ ਅਪਨੇ ਜਨ ਕੇ ਮਨ ਮੇਂ ਬਸਤਾ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਆਪਣੇ ਸੇਵਕ ਦੇ (ਸਦਾ) ਮਨ ਵਿਚ ਵੱਸਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨ ਕੈ ਮਨਿ = ਜਨ ਦੇ ਮਨ ਵਿਚ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en que llegas a habitar en el corazón de Tu Esclavo. (3)"