[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਮਨੋਰਥ; ਪੂਰਨ ਕਾਮ ॥"
page = 1183
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All my desires and tasks are accomplished."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀਆਂ ਸਾਰੀਆਂ ਖਾਹਿਸ਼ਾਂ ਤੇ ਕਾਰਜ ਪੂਰੇ ਹੋ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All my desires and tasks are fulfilled."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਚਰਨ ਸੇਵਨੇ ਕਰ ਸਭ ਕਾਰਜੋਂ ਕੇ ਮਨੋਰਥ ਪੂਰਨ ਹੋ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀਆਂ ਸਾਰੀਆਂ ਮੁਰਾਦਾਂ ਉਸ ਦੇ ਸਾਰੇ ਕੰਮ ਸਿਰੇ ਚੜ੍ਹ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਬ = ਸਾਰੇ। ਮਨੋਰਥ = ਲੋੜਾਂ, ਮੁਰਾਦਾਂ। ਕਾਮ = ਕੰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él logra la Satisfacción y todas sus tareas son realizadas,"