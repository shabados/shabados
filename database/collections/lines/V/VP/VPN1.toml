[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਦਰਿ ਸਾਚੈ ਸੋਭਾ ਪਾਵੈ ॥੫॥"
page = 1342
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then alone is he blest with glory in the True Court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤਦ ਹੀ ਉਸ ਨੂੰ ਸੱਚੇ ਦਰਬਾਰ ਅੰਦਰ ਪ੍ਰਭਤਾ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Then, he is blessed with honor in the Court of the True Lord. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਸਚੇ ਦਰ ਸਤਿਸੰਗ ਮੇਂ ਸੋਭਾ ਕੋ ਪਾਵਤਾ ਹੈ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਉਹ ਮਨੁੱਖ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ ਆਦਰ ਪਾਂਦਾ ਹੈ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਰਿ = (ਪ੍ਰਭੂ ਦੇ) ਦਰ ਤੇ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así entonces es bendecido con Honor, en la Verdadera Corte del Señor. (5)"