[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧ ਜਨਾ ਕੀ; ਸੇਵਾ ਲਾਗੈ ॥"
page = 266
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "should apply himself to the service of the holy-men."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਨੇਕ ਬੰਦਿਆਂ ਦੀ ਟਹਿਲ ਅੰਦਰ ਜੁੜਨਾ ਉਚਿੱਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "should commit himself to the service of the Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪੁਰਸ਼ ਸੰਤ ਜਨੋਂ ਕੀ ਸੇਵਾ ਮੇਂ ਲਗੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਾਂ ਉਸ ਨੂੰ ਚਾਹੀਦਾ ਹੈ ਕਿ) ਗੁਰਮੁਖਾਂ ਦੀ ਸੇਵਾ ਵਿਚ ਲੱਗੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entonces permítete encontrar Refugio en la Compañía de aquéllos que alaban el Nombre."