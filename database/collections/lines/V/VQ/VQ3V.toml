[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਆਪੇ ਸਬਦੁ ਸੁਰਤਿ; ਧੁਨਿ ਆਪੇ ॥"
page = 165
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God Himself is the Word and Himself the understanding, which is tuned to its music."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਖੁਦ ਬਾਣੀ ਹੈ ਅਤੇ ਖੁਦ ਹੀ ਸਮਝ ਸੋਚ ਜੋ ਇਸ ਦੇ ਕੀਰਤਨ ਨਾਲ ਸੁਰਤਾਲ ਵਿੱਚ ਹੋਈ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord Himself is the Word of the Shabad. He Himself is the awareness, attuned to its music."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਹਰੀ (ਸਬਦੁ) ਬ੍ਰਹਮ ਹੈ, ਪੁਨਾ (ਸੁਰਤਿ) ਬੇਦ ਔਰ (ਧੁਨਿ) ਬੇਦ ਕਾ ਉਚਾਰਣ ਰੂਪ ਬਾਣੀ ਭੀ ਆਪ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਆਪ ਹੀ ਸ਼ਬਦ ਹੈ ਆਪ ਹੀ ਸੁਰਤ ਹੈ ਆਪ ਹੀ ਲਗਨ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧੁਨਿ = ਲਗਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, el Señor, es la Palabra del Shabd, Él, el que está entonado en Su Propia Melodía;"