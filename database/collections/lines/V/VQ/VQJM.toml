[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੰਗਲ ਗਾਵਹੁ ਨਾਰੇ ॥"
page = 764
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sing ye songs of joy, O women."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੁਸੀਂ ਖੁਸ਼ੀ ਦੇ ਗੀਤ ਗਾਓ, ਹੇ ਇਸਤ੍ਰੀਓ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "And sing the songs of joy, O sisters."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸਰ ਕੇ ਮੰਗਲ ਗਾਵੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਸਹੇਲੀਓ! ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤਿ ਸਾਲਾਹ ਦੇ ਗੀਤ ਗਾਵੋ ਜੋ ਮਨ ਵਿਚ ਹੁਲਾਰਾ ਪੈਦਾ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਰੇ = ਹੇ ਨਾਰੀਓ! ਹੇ ਮੇਰੀ ਸਹੇਲੀਓ! ਹੇ ਮੇਰੇ ਗਿਆਨ-ਇੰਦ੍ਰਿਓ! ਮੰਗਲ = ਖ਼ੁਸ਼ੀ ਦੇ ਗੀਤ, ਉਹ ਗੀਤ ਜੋ ਮਨ ਵਿਚ ਖ਼ੁਸ਼ੀ ਪੈਦਾ ਕਰਨ, ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੇ ਗੀਤ ਜੋ ਮਨ ਵਿਚ ਹੁਲਾਰਾ ਪੈਦਾ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entonen las Melodías de Dicha;"