[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਸਾਧੂ ਕੈ ਕੁਰਬਾਨ ॥੪॥"
page = 271
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak is a sacrifice unto the pious persons."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਪਵਿੱਤ੍ਰ ਪੁਰਸ਼ਾਂ ਉਤੋਂ ਬਲਿਹਾਰਣੇ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, I am a sacrifice to the Holy. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਾਂ ਤੇ ਤਿਨ ਸੰਤੋਂ ਕੇ ਹਮ ਬਲਿਹਾਰੇ ਜਾਤੇ ਹੈਂ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਾਂ ਤੇ) ਹੇ ਨਾਨਕ! (ਆਖ-) ਮੈਂ ਸਾਧ ਜਨਾਂ ਤੋਂ ਸਦਕੇ ਹਾਂ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੁਰਬਾਨ = ਸਦਕੇ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¡Entrego mi vida como ofrenda a los Santos!(4)"