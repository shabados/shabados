[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕਉ ਕਰਹੁ; ਸਗਲ ਨਮਸਕਾਰੁ ॥"
page = 1338
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the men make obeisance unto him,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜਣੇ ਉਸ ਨੂੰ ਪ੍ਰਨਾਮ ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All bow down in humble respect to those"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਜਨ ਕੋ ਸਰਬ ਲੋਕ ਨਮਸਕਾਰ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਸ ਮਨੁੱਖ ਦੇ ਅੱਗੇ ਸਾਰੇ ਆਪਣਾ ਸਿਰ ਨਿਵਾਇਆ ਕਰੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਸਗਲ = ਸਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos se postran en humilde Respeto frente"