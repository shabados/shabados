[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬੋਲਤ ਐਂਠ ਕਹਾ ਸਠ ਜਿਉ, ਸਭ ਦਾਤ ਤੁਰਾਇ, ਅਬੈ ਘਰਿ ਜੈਹੋ ॥"
page = 215

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O fool! why do you speak with such pride, you will have to go now to your home after getting your teeth broken and after receiving good tharashin."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੂਰਖ ਵਾਂਗ ਆਕੜ ਕੇ ਕਿਉਂ ਬੋਲਦੇ ਹੋ, ਹੁਣੇ ਸਾਰਾ ਦੰਦ ਭੰਨ੍ਹਵਾ ਕੇ ਘਰ ਨੂੰ ਜਾਉਗੇ।"