[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਹਿ ਕਉਤਕ ਕਰੈ; ਅਨਦ ਚੋਜ ॥"
page = 292
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself performs plays recreations and frolics."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪੇ ਹੀ ਲੀਲ੍ਹਾ, ਦਿਲ ਬਹਿਲਾਵੇ ਅਤੇ ਖੇਡਾਂ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself performs and plays His amusements and games."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਅਪਨੇ ਅਨੰਦ ਕਰ (ਚੋਜ) ਬਿਲਾਸੋਂ ਸੇ ਕਉਤਕ ਕਰ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਪ ਹੀ ਖੇਡਾਂ ਖੇਡ ਰਿਹਾ ਹੈ ਆਪ ਹੀ ਆਨੰਦ ਤਮਾਸ਼ੇ ਕਰ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él hace Milagros y actos que alegran a todos;"