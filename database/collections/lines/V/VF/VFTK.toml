[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਾਨ ਸਰੋਵਰੁ ਆਖੀਐ; ਉਪਰਿ ਹੰਸ ਸੁਵੰਸ ਵਸੰਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "It is said that on Manasarovar (lake) resides swans of the highest breed."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮਾਨ ਸਰੋਵਰ (ਛੰਭ) ਕਹੀਦਾ ਹੈ, ਉਸ ਉਪਰ ਹੰਸ ਚੰਗੀ ਵੰਸ ਵਾਲੇ ਰਹਿੰਦੇ ਹਨ।"