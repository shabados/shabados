[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭਿ ਘਟ ਭੋਗੈ; ਹਰਿ ਰਸੁ ਪੀਵਨ ॥"
page = 1031
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God enjoys all the hears and takes their relish."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਸਾਰਿਆਂ ਦਿਲਾਂ ਨੂੰ ਮਾਣਦਾ ਹੈ ਤੇ ਉਨ੍ਹਾਂ ਦਾ ਸੁਆਦ ਚੱਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord enjoys the hearts of all, and drinks in their essence."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਸਭ ਘਟੋਂ ਮੇਂ ਤੂੰ ਭੋਗਤਾ ਹੋਇਕੈ ਰਸੋਂ ਕੋ ਪੀਵਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਸਰੀਰਾਂ ਵਿਚ ਵਿਆਪਕ ਹੋ ਕੇ ਪ੍ਰਭੂ ਆਪ ਹੀ ਆਪਣੇ ਨਾਮ ਦਾ ਰਸ ਪੀ ਰਿਹਾ ਹੈ, ਮਾਣ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭਿ = ਸਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y nuestro Dios disfruta de Su Ser en todos los corazones y se regocija de sus sabores."