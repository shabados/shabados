[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਏਵਡੁ ਦਾਤਾ; ਦੇਵਣਹਾਰੁ ॥"
page = 154
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art so great the donor and Giver,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਐਡਾ ਵਡਾ ਦਾਤਾਰ ਤੇ ਦੇਣ ਵਾਲਾ ਹੈਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are So Great, O Giver, O Great Giver!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਦੇਵਣਹਾਰ! ਤੂੰ ਇਤਨਾ ਵੱਡਾ ਦਾਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਦਾਤਾਂ ਦੇਣ ਵਾਲਾ ਇਤਨਾ ਵੱਡਾ ਦਾਤਾ ਹੈਂ (ਭਗਤੀ ਦੀ  ਦਾਤ ਭੀ ਤੂੰ ਆਪ ਹੀ ਦੇਂਦਾ ਹੈਂ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਵਡੁ = ਇਤਨਾ ਵੱਡਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¡Eres tan Grandioso, tan Generoso!"