data = "ਤੁਖਾਰੀ ਛੰਤ ਮਹਲਾ ੫ ॥"
page = 1117
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Tukhari Chhant 5th Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੁਖਾਰੀ ਛੰਤ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Tukhaari Chhant, Fifth Mehl:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਤੁਖਾਰੀ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਛੰਤ'।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canto en Tukhari, Mejl Guru Aryan, Quinto Canal Divino."