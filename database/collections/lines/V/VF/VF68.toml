[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਿ ਮਿਲਾਇ ਲਏ; ਪ੍ਰਭੁ ਸੋਇ ॥"
page = 294
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord blends him with Himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਹਿਬ ਉਸ ਨੂੰ ਆਪਣੇ ਨਾਲ ਅਭੇਦ ਕਰ ਲੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God blends that one into Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਉਸ ਜਨ ਕੋ ਪ੍ਰਭ ਆਪ ਹੀ ਅਪਨੇ ਮੇਂ ਮਿਲਾਇ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਉਸ ਨੂੰ ਆਪਣੇ ਨਾਲ ਆਪ ਮਿਲਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor lo une Consigo Mismo"