[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਤੂ ਕਰਹਿ, ਸੁ ਹੋਵੈ ਕਰਤੇ; ਅਵਰੁ. ਨ ਕਰਣਾ ਜਾਈ ॥"
page = 1333
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever Thou do, O Creator Lord, alone comes to pass, no one can do otherwise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਛ ਤੂੰ ਕਰਦਾ ਹੈ, ਹੇ ਸਿਰਜਣਹਾਰ ਸੁਆਮੀ! ਕੇਵਲ ਉਹ ਹੀ ਹੁੰਦਾ ਹੈ, ਹੋਰ ਕੁਝ ਭੀ ਕੀਤਾ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever You do comes to pass, O Creator; nothing else can be done."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਰਬ ਕੇ ਕਰਤੇ! ਜੋ ਤੂੰ ਕਰਤਾ ਹੈਂ ਸੋਈ ਹੋਤਾ ਹੈ, ਤੇਰੇ ਬਿਨਾਂ ਔਰ ਕੁਛ ਕੀਆ ਨਹੀਂ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਰਤਾਰ! (ਜਗਤ ਵਿਚ) ਉਹੀ ਕੁਝ ਹੁੰਦਾ ਹੈ ਜੋ ਤੂੰ (ਆਪ) ਕਰਦਾ ਹੈਂ (ਤੇਰੀ ਮਰਜ਼ੀ ਦੇ ਉਲਟ) ਹੋਰ ਕੁਝ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਤੇ = ਹੇ ਕਰਤਾਰ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo que sea que haces, eso es lo que sucede, oh Creador, nada más se puede hacer."