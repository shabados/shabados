[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰਾ ਪ੍ਰਭੁ; ਹੋਆ ਸਦਾ ਦਇਆਲਾ ॥"
page = 627
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Lord is ever merciful."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਾਲਕ ਸਦੀਵ ਹੀ ਮਿਹਰਬਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My God is forever Merciful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਸ੍ਵਾਮੀ ਮੇਰੇ ਪਰ ਸਦੀਵ ਦਇਆਲ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੇਰਾ ਪ੍ਰਭੂ ਸਦਾ ਹੀ ਦਇਆਵਾਨ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Señor es siempre Bueno conmigo;"