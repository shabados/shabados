[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਿਰਹ ਕੁਟੰਬ ਮਹਿ; ਸਹਜਿ ਸਮਾਧੀ ॥"
page = 1246
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In their own home and family, they remain absorbed in the Lord's trance."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਘਰ ਅਤੇ ਟੱਬਰ ਅੰਦਰ ਹੀ ਉਹ ਪ੍ਰਭੂ ਦੀ ਤਾੜੀ ਅੰਦਰ ਲੀਨ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In their own household and family, they are in natural Samaadhi."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਘਰ ਅਰ ਕੁਟੰਬ ਵਿਖੇ ਹੋਤੇ ਹੀ ਤਿਨ ਕੀ ਸ੍ਵਭਾਵਕ ਹੀ ਸਮਾਧੀ ਲਗੀ ਰਹਿਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਗ੍ਰਿਹਸਤ-ਪਰਵਾਰ ਵਿੱਚ ਰਹਿੰਦੇ ਹੋਏ ਭੀ ਅਡੋਲ ਅਵਸਥਾ ਵਿੱਚ ਟਿਕੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਿਰਹ = ਗ੍ਰਿਹਸਤ। ਸਹਜਿ = ਸਹਿਜ ਵਿਚ, ਅਡੋਲ ਅਵਸਥਾ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "permanecen en el Hogar envueltos en el Trance del Equilibrio."