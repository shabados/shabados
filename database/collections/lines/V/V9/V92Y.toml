[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਗਮ ਅਗਾਧਿ; ਸੁਨਹੁ ਜਨ ਕਥਾ ॥"
page = 1235
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "On man, hear thou the Gospel of the Unapproachable and Unfathomable Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਇਨਸਾਨ! ਤੂੰ ਪਹੁੰਚ ਤੋਂ ਪਰੇ ਅਤੇ ਅਥਾਹ ਪ੍ਰਭੂ ਦੀ ਕਥਾ ਵਾਰਤਾ ਸ੍ਰਵਣ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen to the Story of the Inaccessible and Unfathomable."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋਂ! (ਅਗਮ ਅਗਾਧਿ) ਪਰਮੇਸ੍ਵਰ ਕੀ ਕਥਾ ਕੋ ਸ੍ਰਵਨ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! ਅਪਹੁੰਚ ਅਤੇ ਅਥਾਹ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਸੁਣਿਆ ਕਰੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਮ ਕਥਾ = ਅਪਹੁੰਚ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ। ਅਗਾਧਿ = ਅਥਾਹ। ਜਨ = ਹੇ ਜਨੋ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escuchen el Evangelio del Señor Insondable,"