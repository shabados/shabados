[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤ ਅਰਾਧਹਿ ਅਨਦਿਨੁ ਰੰਗਿ ॥੨॥"
page = 1144
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and Him the saints contemplate night and day with love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਨੂੰ ਸੰਤ ਰੈਣ ਅਤੇ ਦਿਨ ਪਿਆਰ ਨਾਲ ਸਿਮਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The devotees lovingly worship and adore Him night and day. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਭਗਤ ਜਨ ਪ੍ਰੇਮ ਕਰ ਕੇ ਤਿਸ ਕੋ ਜਪਤੇ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਭਗਤ ਹਰ ਵੇਲੇ ਪ੍ਰੇਮ ਨਾਲ ਉਸ ਦਾ ਨਾਮ ਜਪਦੇ ਰਹਿੰਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਰਾਧਹਿ = ਆਰਾਧਦੇ ਹਨ, ਨਾਮ ਜਪਦੇ ਹਨ। ਅਨਦਿਨੁ = ਹਰ ਰੋਜ਼, ਹਰ ਵੇਲੇ। ਰੰਗਿ = ਪ੍ਰੇਮ ਨਾਲ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pues Sus Santos meditan en Él siempre, imbuidos en Su Amor. (2)"