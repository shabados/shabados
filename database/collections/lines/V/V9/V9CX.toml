[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ ਭੇਟੇ; ਗੁਰ ਗੋਬਿੰਦ ॥"
page = 364
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He unites with the God-incarnate, the great True Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਰੱਬ ਰੂਪ ਵੱਡੇ ਸੱਚੇ ਗੁਰਾਂ ਨਾਲ ਜੁੜ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is united with the True Guru, the Guru, the Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਯੋਂਕਿ ਤਿਸ ਕੋ ਸਤਿਗੁਰੋਂ ਦੁਆਰੇ (ਗੁਰੁ) ਬੜੇ ਗੋਬਿੰਦ ਜੀ ਮਿਲੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਂਦਾ ਹੈ ਪਰਮਾਤਮਾ ਦਾ ਆਸਰਾ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰ ਭੇਟੇ = ਗੁਰੂ ਨੂੰ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y se une con el Verdadero Guru, sí, el Verdadero Dios."