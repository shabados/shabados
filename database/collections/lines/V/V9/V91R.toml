[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਵਰ ਵਸਤੁ; ਤੁਝ ਪਾਹਿ ਅਮਾਨ ॥੨॥"
page = 374
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Others goods are but a trust with thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੋਰ ਚੀਜਾਂ ਤੇਰੇ ਕੋਲ ਕੇਵਲ ਅਮਾਨਤ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "other things are entrusted to you. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਰ ਜਿਤਨੀ ਬਸਤੁ ਤੇਰੇ ਪਾਸ ਹੈ, ਸੋ ਸਭ ਦੂਸਰੋਂ ਕੀ ਅਮਾਨਤ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੋਰ ਸਾਰੀ ਚੀਜ਼ ਤੇਰੇ ਪਾਸ ਅਮਾਨਤ (ਵਾਂਗ ਹੀ ਪਈ) ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਵਰ = ਹੋਰ, ਬਾਕੀ ਦੀ। ਪਾਹਿ = ਪਾਸ। ਅਮਾਨ = ਅਮਾਨਤ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh invitado del mundo, y el resto de los bienes permanecen en prenda contigo. (2)"