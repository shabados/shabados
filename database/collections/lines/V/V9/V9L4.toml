[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਹੁਕਮਿ ਵਰਤਦਾ ਪਿਆਰਾ; ਆਪੇ ਹੀ ਫੁਰਮਾਣੁ ॥੨॥"
page = 606
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Loved Lord Himself bestows the boons and Himself He blesses with the insignia of Truth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪ ਪਿਆਰਾ ਪ੍ਰਭੂ ਖ਼ੁਦ ਸਿਮਰਨ ਦਾ ਖ਼ਜ਼ਾਨਾ ਹੈ ਅਤੇ ਖ਼ੁਦ ਹੀ ਇਸ ਦੀਆਂ ਦਾਤਾਂ ਬਖ਼ਸ਼ਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Beloved Himself obeys His Will, and He Himself issues His Command. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਹੀ ਪਿਆਰਾ ਹੁਕਮ ਮੇਂ ਵਰਤਤਾ ਹੈ ਅਰ ਆਪੇ ਹੀ (ਫੁਰਮਾਣੁ) ਹੁਕਮ ਰੂਪ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਿਆਰਾ ਪ੍ਰਭੂ ਆਪ ਹੀ (ਜੀਵਾਂ ਨੂੰ) ਹੁਕਮ ਵਿਚ ਤੋਰਦਾ ਹੈ, ਆਪ ਹੀ ਹਰ ਥਾਂ ਹੁਕਮ ਚਲਾਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੁਕਮਿ = ਹੁਕਮ ਅਨੁਸਾਰ। ਫੁਰਮਾਣੁ = ਹੁਕਮ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo obedece Su Voluntad; Él Mismo emite el Mandato. (2)"