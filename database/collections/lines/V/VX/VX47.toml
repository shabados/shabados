[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਸਭ ਲਹਿ ਲਿਜੈ ॥੧੨੭੩॥"
page = 804

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Bapudaa”, add the word “Naayak” four times and then uttering the words “Shatru” at the end know all the names of Tupak.1273."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਭ (ਇਸ ਨੂੰ) ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝ ਲਵੋ ॥੧੨੭੩॥"