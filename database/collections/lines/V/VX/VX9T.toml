[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਜੇ ਧਰਮੁ ਕਰਹਿ; ਪਰਥਾਏ ॥"
page = 1024
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The kings did good deeds for some self-interest."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਤਿਸ਼ਾਹ ਕਿਸੇ ਸਵੈ-ਮਨੋਰਥ ਲਈ ਚੰਗੇ ਕਰਮ ਕਰਦੇ ਸਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The kings acted righteously only out of self-interest."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਜਾ ਕਿਸੇ (ਪਰਥਾਏ) ਨਮਿਤ ਕਰ ਕੇ ਧਰਮ ਕਰਤੇ ਥੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਜੇ ਲੋਕ ਕਿਸੇ ਗ਼ਰਜ਼ ਦੀ ਖ਼ਾਤਰ ਧਰਮ ਕਮਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਥਾਏ = ਕਿਸੇ ਗ਼ਰਜ਼ ਵਾਸਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los reyes practicaban el Dharma impulsados por algo muy distinto al Dharma en sí,"