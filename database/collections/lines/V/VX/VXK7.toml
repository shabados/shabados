data = "ਕਾਢ︀ਯੋ ਆਨਿ ਰਾਇ ਮ੍ਰਿਗ ਤਹਾ ॥"
page = 961

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In the palace, which had beautiful windows, the deer brought the Raja there."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਜੇ ਨੇ ਹਿਰਨ ਨੂੰ ਉਥੇ ਜਾ ਕਢਿਆ।"