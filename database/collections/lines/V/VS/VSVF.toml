[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਖੁ. ਨ ਮਿਟੈ; ਬਿਨੁ ਗੁਰ ਕੀ ਸਰਣਾ ॥"
page = 1033
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Pain is stilled not without seeking the Guru's refuge."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਪਨਾਹ ਲੈਣ ਦੇ ਬਾਝੋਂ ਪੀੜ ਦਜ਼ਰ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His pain is not relieved, without seeking the Sanctuary of the Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੀ ਸਰਣ ਬਿਨਾਂ ਦੁਖ ਨਹੀਂ ਮਿਟਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਣ ਤੋਂ ਬਿਨਾ (ਇਹ ਜਨਮਾਂ ਜਨਮਾਂਤਰਾਂ ਦਾ ਲੰਮਾ) ਦੁੱਖ ਮਿਟ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin buscar el Refugio del Guru, las penas no se aminoran, y así uno va y viene en pena,"