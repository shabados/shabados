[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਣ ਦੇ ਇਹਸਾਨਾਣ ਦੇ ਬੰਦੇ ਹਾਣ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਬੰਦਾਇ ਇਹਸਾਨਿ ਸ਼ਾਣ ਰਾ ਬੰਦਾ ਏਮ ॥੧੦੧॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, drags you out of the well (depths) of grief and sorrow. (453)"