language = "pa"
data = "ਅਦਿਖ ਦੇ ਪਰਦੇ ਵਿੱਚੋਣ ਜੇਕਰ ਆਪਣਾ ਮੁਖੜਾ ਵਿਖਾ ਦੇਵੇਣ, ਤਾਣ ਕੀ ਹਰਜ ਹੈ #"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਅਜ਼ ਪਰਦਾਇ ਗ਼ੈਬ ਰੂ-ਨਮਾਈ ਚਿ ਸ਼ਵਦ ॥੨੫॥੬॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Kindly sprinkle some salt on my wounded heart from your red lips,"