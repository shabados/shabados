[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗਣ ਗੰਧਰਬ ਗਣੇਸ, ਨਾਦ ਵਜਾਇਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The gams, gandharvas and Gana et al. play instruments (for Him)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਰਣ (ਨੰਦੀ, ਭ੍ਰਿੰਗੀ ਆਦਿ) ਗੰਧਰਬ ਤੇ ਗਣੇਸ਼ ਵਾਜੇ ਵਜਾਉਂਦੇ ਹਨ।"