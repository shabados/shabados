[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿੰਦਕਿ; ਅਹਿਲਾ ਜਨਮੁ ਗਵਾਇਆ ॥"
page = 380
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The calumniator loses his life in vain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਦਖੋਈ ਕਰਨ ਵਾਲਾ ਆਪਣਾ ਜੀਵਨ ਵਿਅਰਥ ਗੁਆ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slanderer loses his life in vain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਿੰਦਕ ਨੇ ਅਪਨਾ ਜਨਮ (ਅਹਿਲਾ) ਬ੍ਯਰਥ ਨਸ਼ਟ ਕਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਸੰਤਾਂ ਦੀ ਨਿੰਦਾ ਕਰਨ ਵਾਲੇ ਮਨੁੱਖ ਨੇ (ਨਿੰਦਾ ਦੇ ਕਾਰਨ ਆਪਣਾ) ਕੀਮਤੀ ਮਨੁੱਖਾ ਜਨਮ ਗਵਾ ਲਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿੰਦਕਿ = ਨਿੰਦਕ ਨੇ। ਅਹਿਲਾ = ਕੀਮਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Infértil es la vida del calumniador,"