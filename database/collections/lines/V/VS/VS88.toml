[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੀ ਅੰਮ੍ਰਿਤੁ; ਸੰਤਨ ਪਰਸਾਦਿ ॥"
page = 892
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Quaff thou the Lord's Nectar by the saints' grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਤੂੰ ਸਾਈਂ ਦੇ ਅੰਮ੍ਰਿਤ ਨੂੰ ਪਾਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Drink in the Ambrosial Nectar, by the Grace of the Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਤਮਾਨੰਦ ਅੰਮ੍ਰਿਤ ਕੋ ਸੰਤੋਂ ਕੀ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਪਾਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਸੰਤ ਜਨਾਂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਟਿਕਿਆ ਰਹੁ, ਤੇ) ਸੰਤ-ਜਨਾਂ ਦੀ ਮਿਹਰ ਨਾਲ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ ਪੀਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਮ੍ਰਿਤੁ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ। ਪਰਸਾਦਿ = ਕਿਰਪਾ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bebe el Néctar del Señor por la Gracia del Santo;"