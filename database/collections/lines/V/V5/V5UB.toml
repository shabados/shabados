[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਿੰਮ੍ਰਿਤ ਮੈ ਖਟ ਸਾਸਤ੍ਰ ਮੈ; ਸਭ ਹੂੰ ਮਿਲ ਕ੍ਰੋਰਿ ਬਿਚਾਰ ਬਿਚਾਰੇ ॥"
page = 968

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Consulting the Simritis and the Six Shastras, all the Brahmins have reached this conclusion."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਨ੍ਹਾਂ ਨੇ) ਸਮ੍ਰਿਤੀਆਂ ਅਤੇ ਛੇ ਸ਼ਾਸਤ੍ਰਾਂ ਨੂੰ (ਵਾਚ ਕੇ) ਕਈ ਪ੍ਰਕਾਰ ਦੇ ਵਿਚਾਰ ਸੋਚੇ (ਅਤੇ ਕਿਹਾ)"