[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਝੜਿ ਭੁਲੇ ਰਾਹ; ਗੁਰਿ ਵੇਖਾਲਿਆ ॥"
page = 149
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I strayed in the wilderness. The Guru has shown me the way."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਬੀਆਬਾਨ ਵਿੱਚ ਕੁਰਾਹੇ ਪੈ ਗਿਆ ਸਾਂ। ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਮਾਰਗ ਦਿਖਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I was wandering in the wilderness, but now the Guru has shown me the Way."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰ ਉਜਾੜ ਮੇਂ ਭੂਲੇ ਜਾਤੇ ਕੋ ਪਰਮੇਸ੍ਵਰ ਕਾ ਰਸਤਾ ਗੁਰੋਂ ਨੇ ਦਿਖਲਾ ਦੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੁਰਾਹੇ ਭਟਕ ਰਹੇ ਮਨੁੱਖ ਨੂੰ ਗੁਰੂ ਨੇ ਰਸਤਾ ਦਿਖਾਇਆ ਹੈ (ਰਾਹ ਗੁਰੂ ਵਿਖਾਂਦਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਝੜਿ = ਔਝੜ ਵਿਚ, ਕੁਰਾਹ ਵਿਚ। ਗੁਰਿ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Desviado del Sendero, fui traído de regreso a Él."