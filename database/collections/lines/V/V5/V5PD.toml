[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਦ੍ਵੈ ਅਭੂਤ ਅਨਭੈ ਦਿਆਲ ॥"
page = 36

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is Non-dual, Non-Elemental, Fearless and Benign."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਦ੍ਵੈਤ ਰੂਪ ਹੈ, ਤੱਤ੍ਵਾਂ ਦੀ ਰਚਨਾ ਤੋਂ ਪਰੇ ਹੈ, ਡਰ ਤੋਂ ਰਹਿਤ ਹੈ, ਦਇਆ ਕਰਨ ਵਾਲਾ ਹੈ,"