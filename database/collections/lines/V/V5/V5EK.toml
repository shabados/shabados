data = "ਅਜੋਨੀ ਅਜੈ ਬੇਦ ਬਿਦਿਆ ਬਿਚਾਰੰ ॥੨੬॥"
page = 677

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the kings saw him as unconquerable warrior and a successful scholar of he Vedic learning.26."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਅਜੋਨੀ, ਅਜੈ ਅਤੇ ਵੇਦ ਵਿਦਿਆ ਦੇ ਵਿਚਾਰ ਵਾਲਾ ਹੈ ॥੨੬॥"