[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਨਾਮੁ ਰਤੰਨੁ ਹੈ; ਗੁਰਮੁਖਿ ਹਰਿ ਧਿਆਇਆ ॥੧੧॥"
page = 1242
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, the Lord's Name is the jewel and God is meditated upon by the Guru's grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਜਵੇਹਰ ਹੈ ਅਤੇ ਵਾਹਿਗੁਰੂ ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਸਿਮਰਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Name is a jewel; the Gurmukh meditates on the Lord. ||11||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਰਤਨ ਰੂਪ ਜੋ ਹਰੀ ਕਾ ਨਾਮ ਹੈ, ਸੋ ਗੁਰੋਂ ਦੁਆਰੇ ਧਿਆਵਣਾਂ ਕੀਆ ਹੈ, ਭਾਵ ਜਪਾ ਹੈ॥੧੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਪ੍ਰਭੂ ਦਾ) ਨਾਮ (ਮਾਨੋ) ਇਕ ਕੀਮਤੀ ਮੋਤੀ ਹੈ, ਪਰ ਹਰਿ-ਨਾਮ ਸਿਮਰਦਾ ਉਹ ਮਨੁੱਖ ਹੈ ਜੋ ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੁੰਦਾ ਹੈ ॥੧੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਤੰਨੁ = ਕੀਮਤੀ ਮੋਤੀ। ਗੁਰਮੁਖਿ = ਉਹ ਮਨੁੱਖ ਜੋ ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੈ ॥੧੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, el Nombre es la Joya, y uno habita en Dios, sólo por la Gracia del Guru. (11)"