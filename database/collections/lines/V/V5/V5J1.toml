[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਣ ਹਥੀ ਆਪਣਾ; ਆਪੇ ਹੀ ਕਾਜੁ ਸਵਾਰੀਐ ॥੨੦॥"
page = 474
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With our own hands let us ourselves arrange our own affairs."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਹੱਥਾਂ ਨਾਲ ਆਓ ਆਪਾਂ ਆਪ ਹੀ ਆਪਣੇ ਨਿੱਜ ਦੇ ਕੰਮ ਰਾਸ ਕਰੀਏ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With our own hands, let us resolve our own affairs. ||20||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਆਪਣੇ ਹਾਥ ਸੇ ਅਪਨਾ ਕਾਮ ਆਪ ਹੀ ਸਵਾਰਨਾਂ ਕਰੀਏ, ਮੁਕਤਿ ਕੇ ਵਾਸਤੇ ਪੁਰਖਾਰਥ ਕਰਨਾ ਚਾਹੀਏ॥੨੦॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਤਨਾ ਚਿਰ ਇਹ ਜਿੰਦ ਤੇ ਪ੍ਰਾਣ ਮਿਲੇ ਹੋਏ ਹਨ, ਉੱਦਮ ਕਰ ਕੇ) ਆਪਣੇ ਹੱਥਾਂ ਨਾਲ ਆਪਣਾ ਕੰਮ ਆਪ ਹੀ ਸੁਆਰਨਾ ਚਾਹੀਦਾ ਹੈ (ਭਾਵ, ਇਹ ਮਨੁੱਖਾ-ਜਨਮ ਹਰੀ ਦੇ ਸਿਮਰਨ ਨਾਲ ਸਫਲ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ) ॥੨੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con sus propias manos uno no llega a completar su trabajo. (20)"