data = "ਦੁਰੰਤ ਥਾਪ ਥਾਪੀਐ ॥੧੯੩॥"
page = 219

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Therefore was recitation of mantras and yantras and the idols of Ganas were being fixed.193."

