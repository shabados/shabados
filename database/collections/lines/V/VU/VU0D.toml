[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੀਤ ਜੀਤ ਦੇਸੇਸ੍ਵਰ ਲੀਏ ॥"
page = 49

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They performed Rajasu sacrifice several times declaring themselves as supreme rulers, after conquering kings of various countries."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਦੇਸ਼ਾਂ ਦੇ ਸੁਆਮੀਆਂ (ਰਾਜਿਆਂ) ਨੂੰ ਜਿੱਤ ਲਿਆ।"