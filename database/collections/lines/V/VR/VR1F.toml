[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮਤਿ ਮਾਨਿਆ; ਏਕ ਲਿਵ ਲਾਗੀ ॥"
page = 1343
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who accept the Guru's teaching and are attuned to the One Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੇ ਗੁਰਾਂ ਦੀ ਸਿਖਮਤ ਨੂੰ ਕਬੂਲ ਕਰ ਲਿਆ ਹੈ ਅਤੇ ਜਿਨ੍ਹਾਂ ਦੀ ਇਕ ਸੁਆਮੀ ਨਾਲ ਪਿਰਹੜੀ ਪਈ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "for those who accept the Guru's Teachings, and become lovingly attuned to the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮਤਿ ਕੋ ਜਿਨੋਂ ਨੇ ਮੰਨ ਲੀਆ ਹੈ ਪੁਨਾ ਏਕ ਮੇਂ ਬਿਰਤੀ ਲਗੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਮਨ ਗੁਰੂ ਦੀ ਸਿੱਖਿਆ ਵਿਚ ਪਤੀਜ ਜਾਂਦਾ ਹੈ, ਉਸ ਦੀ ਸੁਰਤ ਇਕ ਪ੍ਰਭੂ ਵਿਚ ਜੁੜੀ ਰਹਿੰਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y se entonan amorosamente en el Señor."