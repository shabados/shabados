[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੈਰਉ ਮਹਲਾ ੫ ਅਸਟਪਦੀਆ ਘਰੁ ੨ ॥"
page = 1155
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Bhairo 5th Guru Ashtpadis"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭੈਰਊ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ ਅਸ਼ਟਪਦੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Bhairao, Fifth Mehl, Ashtpadheeyaa, Second House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਭੈਰਉ, ਘਰ ੨ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਅੱਠ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bhairo, Mejl Guru Aryan, Quinto Canal Divino."