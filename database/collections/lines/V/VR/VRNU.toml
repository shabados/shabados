[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਮਨਹੁ ਨ ਵੀਸਰੈ, ਹਰਿ ਜੀਉ; ਕਰਤਾ ਪੁਰਖੁ ਮੁਰਾਰੀ ਰਾਮ ॥"
page = 544
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In their mind, the pious persons forget not the honourable God. Who is the Mighty Creator and the slayer of Mur demon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਚਿੱਤ ਅੰਦਰ ਪਵਿੱਤ੍ਰ ਪੁਰਸ਼ ਬਲਵਾਨ ਸਿਰਜਨਹਾਰ ਅਤੇ ਮੁਰ ਰਾਖਸ਼ ਨੂੰ ਮਾਰਨ ਵਾਲੇ ਪਤਵੰਤੇ ਵਾਹਿਗੁਰੂ ਨੂੰ ਨਹੀਂ ਭੁਲਾਉਂਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In their minds, the Gurmukhs do not forget the Dear Lord, the Primal Creator Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਰਤਾ ਪੁਰਖ ਮੁਰਾਰੀ ਹਰਿ ਜੀਉ! ਤੂੰ ਮਨ ਸੇ ਗੁਰਮੁਖੋਂ ਕੋ ਬਿਸਰਤਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਰਨ ਪਿਆਂ ਸਰਬ-ਵਿਆਪਕ ਕਰਤਾਰ ਪ੍ਰਭੂ ਮਨ ਤੋਂ ਨਹੀਂ ਭੁੱਲਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਸਰਨ ਪਿਆਂ। ਮਨਹੁ = ਮਨ ਤੋਂ। ਪੁਰਖੁ = ਸਰਬ-ਵਿਆਪਕ। ਮੁਰਾਰੀ = {ਮੁਰ-ਅਰਿ। ਅਰਿ = ਵੈਰੀ} ਪਰਮਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En sus mentes los Gurmukjs no se olvidan de su Adorado Señor, el Creador Primordial."