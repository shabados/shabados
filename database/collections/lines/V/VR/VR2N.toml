[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਕਉ; ਪਹੁਚਿ. ਨ ਸਕਸਿ ਕੋਇ ॥੩॥"
page = 1183
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "No one can equal the Lord's slave,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਜਣਾ ਸੁਆਮੀ ਦੇ ਗੋਲੇ ਦੀ ਬਰਾਬਰੀ ਨਹੀਂ ਕਰ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one can rival the humble servant of the Lord. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦਾਸੋਂ ਕੇ ਨਿਕਟ ਦੋਖੀ ਕੋਈ ਪਹੁੰਚ ਨਹੀਂ ਸਕਤਾ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਹੋਰ ਮਨੁੱਖ ਪ੍ਰਭੂ ਦੇ ਸੇਵਕ ਦੀ ਬਰਾਬਰੀ ਨਹੀਂ ਕਰ ਸਕਦਾ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਹੁਚਿ ਨ ਸਕਸਿ = ਬਰਾਬਰੀ ਨਹੀਂ ਕਰ ਸਕਦਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y no tiene igual ni tampoco rival. (3)"