[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਿਤੜੇ ਖੁਸਰੇ ਹੀਜੜੇ; ਕੇਤੜਿਆ ਗੁੰਗੇ ਤੁਤਲਾਣੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many eunuchs, many dumb and many are stammerers."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਿੰਨੇ ਖੁਸਰੇ, ਹੀਜੜੇ, ਗੁੰਗੇ ਥਥਲੇ ਹਨ।"