[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਪ੍ਰਸਾਦਿ; ਪਰਮ ਗਤਿ ਪਾਵਹਿ ॥"
page = 270
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose favour thou obtainest the supreme rank,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਦਇਆ ਦੁਆਰ ਤੂੰ ਮਹਾਨ ਮਰਤਬਾ ਪਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By His Grace, you obtain the supreme status."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਤੂੰ ਪਰਮਗਤੀ ਕੌ ਪਾਵੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਬਖ਼ਸ਼ਸ਼ ਨਾਲ ਤੈਨੂੰ ਉੱਚਾ ਦਰਜਾ ਮਿਲਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por Su Gracia, concibes tu más alto Destino."