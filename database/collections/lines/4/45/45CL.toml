[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਤੂੰ; ਦਰਗਹ ਪਾਵਹਿ ਮਾਨੁ ॥"
page = 176
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then, shalt thou obtain honour at His court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਤੈਨੂੰ ਉਸ ਦੇ ਦਰਬਾਰ ਅੰਦਰ ਇੱਜ਼ਤ ਪ੍ਰਾਪਤ ਹੋਵੇਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "thus you shall be honored in His Court."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੂੰ  ਪ੍ਰਲੋਕ ਮੇਂ ਆਦਰ ਪਾਵੇਂਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਦੋਂ ਤੂੰ ਇਹ ਉੱਦਮ ਕਰੇਂਗਾ) ਤਦੋਂ ਤੂੰ ਪਰਮਾਤਮਾ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਆਦਰ-ਮਾਣ ਪ੍ਰਾਪਤ ਕਰੇਂਗਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਨੁ = ਆਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y serás honrado en Su Corte."