[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਖੇ ਸਰਬ ਲੋਕੰ ਸਹੀ ਰਾਵਣਾਰੰ ॥"
page = 272

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Everyone was given wealth in various ways and the people saw the real personality of Ram."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਲੋਕਾਂ ਨੇ ਸ੍ਰੀ ਰਾਮ ਦੀ ਵਾਸਤਵਿਕਤਾ ਨੂੰ ਪਛਾਣ ਲਿਆ"