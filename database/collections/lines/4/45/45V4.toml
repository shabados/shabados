[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਹਿਬ ਤੇ ਸੇਵਕੁ. ਸੇਵ ਸਾਹਿਬ ਤੇ; ਕਿਆ ਕੋ ਕਹੈ ਬਹਾਨਾ ॥"
page = 797
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Lord has made me His slave and the Lord alone has blessed me with His service. What other arguments can one advance?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸੁਆਮੀ ਨੇ ਮੈਨੂੰ ਆਪਣਾ ਗੋਲਾ ਬਣਾ ਲਿਆ ਹੈ ਅਤੇ ਸੁਆਮੀ ਨੇ ਹੀ ਮੈਨੂੰ ਆਪਣੀ ਸੇਵਾ ਬਖਸ਼ੀ ਹੈ। ਹੋਰ ਕਿਹੜੀ ਦਲੀਲ ਕੋਈ ਦੇ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My Lord and Master has made me His servant, and blessed me with His service; how can anyone argue about this?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਕੀ ਸੇਵਾ ਤੇ ਸੇਵਕ ਕਹੀਦਾ ਹੈ ਔਰ ਸਾਹਿਬ ਕੀ ਕਿਰਪਾ ਤੇ ਓਹੀ ਸੇਵਕ (ਸੇਵ) ਪੂਜਨੇ ਜੋਗ ਹੋ ਜਾਤਾ ਹੈ, ਇਸ ਮੇਂ ਕੋਈ ਕਿਆ (ਬਹਾਨਾ) ਤਰਕ ਕਰ ਕੇ ਕਹਿ ਸਕਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਮਾਲਕ-ਪ੍ਰਭੂ ਦੀ ਮੇਹਰ ਨਾਲ ਹੀ (ਕੋਈ ਮਨੁੱਖ ਉਸ ਦਾ) ਭਗਤ ਬਣਦਾ ਹੈ, ਮਾਲਕ-ਪ੍ਰਭੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਹੀ (ਮਨੁੱਖ ਨੂੰ ਉਸ ਦੀ) ਸੇਵਾ-ਭਗਤੀ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ। (ਇਹ ਸੇਵਾ-ਭਗਤੀ ਕਿਸੇ ਨੂੰ ਭੀ ਉਸ ਦੇ ਆਪਣੇ ਉੱਦਮ ਨਾਲ ਨਹੀਂ ਮਿਲਦੀ) ਕੋਈ ਭੀ ਮਨੁੱਖ ਅਜੇਹੀ ਗ਼ਲਤ ਦਲੀਲ ਨਹੀਂ ਦੇ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ, ਦੀ ਰਾਹੀਂ। ਸਾਹਿਬ ਤੇ = ਮਾਲਕ-ਪ੍ਰਭੂ ਤੋਂ, ਮਾਲਕ-ਪ੍ਰਭੂ ਦੀ ਕਿਰਪਾ ਨਾਲ। ਸੇਵ = (ਮਾਲਕ-ਪ੍ਰਭੂ ਦੀ) ਸੇਵਾ-ਭਗਤੀ। ਬਹਾਨਾ = ਗ਼ਲਤ ਦਲੀਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo Tú me haces Tu Esclavo y me bendices con Tu Servicio; nadie Te puede cuestionar."