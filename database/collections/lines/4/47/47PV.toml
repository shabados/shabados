[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਿੰਘ ਚਲੈ ਮ੍ਰਿਗ ਤੇ ਟਰਿ ਕੈ; ਗਜ ਰਾਜ ਉਡਿਯੋ ਨਭ ਮਾਰਗਿ ਜਾਵੈ ॥"
page = 532

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The lion can be frightened by a deer and the elephant can fly but Arjuna said,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ੇਰ ਹਿਰਨ ਤੋਂ (ਡਰ ਕੇ) ਪਿਛੇ ਹਟ ਜਾਵੇ ਅਤੇ ਵੱਡੇ ਆਕਾਰ ਵਾਲਾ ਹਾਥੀ ਉਡ ਕੇ ਆਕਾਸ਼ ਵਲ ਚਲਾ ਜਾਵੇ।"