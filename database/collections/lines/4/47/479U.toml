[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੋਲੈ ਨਾਨਕੁ; ਸੁਣਹੁ ਤੁਮ ਬਾਲੇ ॥"
page = 942
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Q. 48: What is the discourse, uttering which thou remains detached?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰ. 48: ਉਹ ਕਿਹੜੀ ਧਰਮ-ਵਾਰਤਾ ਹੈ ਜਿਸ ਨੂੰ ਉਚਾਰ ਕੇ ਤੂੰ ਨਿਰਲੇਪ ਵਿਚਰਦਾ ਹੈਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen to what we say, O Nanak, you little boy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਵਹੁ ਸਿਧ ਬੋਲੇ ਕਿ ਹੇ ਬਾਲਕੇ! ਤੁਮ ਸੁਣੋ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਕਹਿੰਦਾ ਹੈ (ਜੋਗੀਆਂ ਨੇ ਕਿਹਾ-) ਹੇ ਬਾਲਕ (ਨਾਨਕ!) ਸੁਣ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਲੇ = ਹੇ ਬਾਲਕ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cuáles son las escrituras que te mantienen desapegado?"