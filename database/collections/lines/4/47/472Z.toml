[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਛਤੀਹ ਭੋਜਨ ਪਾਕਸਾਲ; ਰਸ ਭੋਗ ਸੁਢੰਗੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Similarly in cook houses thirtysix types of delicious dishes are there."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਰਸੋਈ ਵਿਖੇ ਛਤੀਹ ਪ੍ਰਕਾਰ ਦੇ ਭੋਜਨ ਹੋਰ ਰਸਾਂ ਦੇ ਭੋਗ ਚੰਗੇ ਢੰਗ ਬਣਾਉਣ ਵਾਲੇ।"