[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਕ੍ਰਿਆ ਮਹਿ; ਊਤਮ ਕਿਰਿਆ ॥"
page = 266
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of all the religious rites the best rite is,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਮੂਹ ਧਾਰਮਕ ਰਸਮਾਂ ਵਿਚੋਂ ਸਰੇਸ਼ਟ ਰਸਮ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Of all religious rituals, the most sublime ritual"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਜਪ ਤਪ ਆਦਿ ਕ੍ਰਿਆ ਮੇਂ ਏਹੀ ਉਤਮ ਕ੍ਰਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਕੰਮ ਹੋਰ ਸਾਰੀਆਂ ਧਾਰਮਿਕ ਰਸਮਾਂ ਨਾਲੋਂ ਉੱਤਮ ਹੈ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕ੍ਰਿਆ = ਧਾਰਮਿਕ ਰਸਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La más noble de las acciones"