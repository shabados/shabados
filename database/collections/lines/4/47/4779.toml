[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਗੁਰਸਬਦ; ਨ ਸੋਝੀ ਪਾਇ ॥੬॥"
page = 904
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Guru's instruction, it obtains not understanding."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਦੇ ਬਗੈਰ ਇਸ ਨੂੰ ਸਮਝ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Word of the Guru's Shabad, it does not understand. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਗੁਰ ਉਪਦੇਸ ਬਿਨਾ ਇਹ ਜੀਵ ਗਿਆਤ ਨਹੀਂ ਪਾਵਤਾ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਦੀ ਨੀਂਦ ਵਿਚ ਸੁੱਤੇ ਪਏ ਨੂੰ) ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਤੋਂ ਬਿਨਾ ਇਹ ਸਮਝ ਹੀ ਨਹੀਂ ਪੈਂਦੀ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues sin la Palabra del Shabd del Guru no podrá despertar.(6)"