[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇਵੇਹੇ ਕਰਮ ਕਮਾਵਦਾ; ਤੇਵੇਹੇ ਫਲਤੇ ॥"
page = 317
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As are the deeds, the man commits, so are the fruits which he gathers."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੋ ਜਿਹੇ ਅਮਲ ਬੰਦਾ ਕਰਦਾ ਹੈ, ਉਹੋ ਜਿਹੇ ਹੀ ਫਲ ਉਹ ਪਰਾਪਤ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "According to the deeds which one does, so are the fruits one obtains."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਕਰਮ ਪੁਰਸ ਕਮਾਵਤੇ ਹੈਂ ਤੈਸੇ ਹੀ ਕਰਮ ਦੁਖ ਸੁਖ ਰੂਪ ਹੋ ਕਰ ਫਲਤੇ ਹੈਂ॥ ਦ੍ਰਿਸ੍ਟਾਂਤ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅਕਿਰਤ-ਘਣ) ਮਨੁੱਖ ਜਿਹੋ ਜਿਹੇ ਕਰਮ ਕਰਦਾ ਹੈ, ਉਹ ਕਰਮ ਉਹੋ ਜਿਹਾ ਫਲ ਦੇਂਦਾ ਹੈ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫਲਤੇ = ਫਲ ਦੇਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como son las propias acciones, así es la cosecha de los resultados."