[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ. ਮਾਣਸ ਤੇ ਦੇਵਤੇ ਕੀਏ; ਕਰਤ. ਨ ਲਾਗੀ ਵਾਰ ॥੧॥"
page = 462
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who without making any delay, make angles out of men."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਚਿਰ ਲਾਉਣ ਦੇ ਬਗੈਰ (ਤੁਰਤ) ਮਨੁੱਖ ਨੂੰ ਫਰਿਸ਼ਤਾ ਬਣਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He made angels out of men, without delay. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਗੁਰੂ ਕੈਸੇ ਹੈਂ? ਜਿਨੋਂ ਨੇ ਮਾਨੁਖ ਸੇ ਦੇਵਤਾ ਬਨਾਏ ਹੈਂ, ਪਰੰਤੂ ਕਰਤਿਆਂ ਕੋ (ਵਾਰ) ਦੇਰ ਨਹੀਂ ਲਗੀ॥੧॥☬ਸ੍ਰੀ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਮਹਲਾ ੨ ਕਾ ਸਲੋਕ ਭੀ ਮਿਲਾਉਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਗੁਰੂ) ਨੇ ਮਨੁੱਖਾਂ ਤੋਂ ਦੇਵਤੇ ਬਣਾ ਦਿੱਤੇ ਤੇ ਬਣਾਉਂਦਿਆਂ (ਰਤਾ) ਚਿਰ ਨਾਹ ਲੱਗਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਗੁਰੂ) ਨੇ। ਮਾਣਸ ਤੇ = ਮਨੁੱਖਾਂ ਤੋਂ। ਕਰਤ = ਬਣਾਉਂਦਿਆਂ। ਵਾਰ = ਦੇਰ, ਚਿਰ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es Quien hizo ángeles de los humanos sin espera alguna. (1)"