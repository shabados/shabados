[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮ੍ਰਿਗ ਆਸਣੁ; ਤੁਲਸੀ ਮਾਲਾ ॥"
page = 1351
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou sit on the deer-skin and tell the rosary of sweet basil."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮਿਰਗ-ਛਾਲਾ ਉਤੇ ਬਹਿੰਦਾ ਹੈ ਅਤੇ ਨਿਆਜਬੇ ਦੀ ਜਪਣੀ ਫੇਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You sit on a deer-skin, and chant on your mala."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਿਰਗ ਕੇ ਮਿਰਗਾਨ ਕਾ ਤੋ ਆਸਣ ਦੀਆ ਹੈ ਔ ਤੁਲਸੀ ਕੀ ਮਾਲਾ ਹਾਥ ਮੇਂ ਧਾਰੀ ਹੂਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪੂਜਾ ਪਾਠ ਵੇਲੇ) ਤੂੰ ਹਿਰਨ ਦੀ ਖੱਲ ਦਾ ਆਸਣ (ਵਰਤਦਾ ਹੈਂ), ਤੁਲਸੀ ਦੀ ਮਾਲਾ ਤੇਰੇ ਪਾਸ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮ੍ਰਿਗ = ਹਿਰਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
