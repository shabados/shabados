[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜਨ ਰਾਖੇ ਗੁਰ ਗੋਵਿੰਦ ॥"
page = 681
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's serf, the Guru-God has saved."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦੇ ਗੋਲੇ ਨੂੰ ਰੱਬ ਰੂਪ ਗੁਰਾਂ ਨੇ ਬਚਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Guru, the Lord of the Universe, has saved the Lord's humble servant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਹਰਿ ਕੇ (ਜਨ) ਦਾਸ ਗੋਬਿੰਦ ਰੂਪ ਗੁਰੋਂ ਨੇ ਆਪ ਹੀ ਦੁਖੋਂ ਵਿਕਾਰੋਂ ਮੇਂ ਰਾਖੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਆਪਣੇ ਸੇਵਕਾਂ ਦੀ (ਸਦਾ) ਰਾਖੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨ = ਸੇਵਕ, ਦਾਸ {ਬਹੁ-ਵਚਨ}। ਗੁਰ ਗੋਵਿੰਦ = ਵੱਡੇ ਮਾਲਕ ਨੇ। ਗੋਵਿੰਦ = ਪ੍ਰਿਥਵੀ ਦਾ ਮਾਲਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A los Santos del Señor, el Señor Mismo los salva, y llevándome hasta Su Pecho,"