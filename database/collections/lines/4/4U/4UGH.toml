[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਗੁਰਮੁਖਿ ਨਾਮੁ ਸਮਾਲਿ ॥੧੧॥"
page = 939
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Becoming God conscious like this, O Nanak, the mortal contemplates the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਬ੍ਰਹਮ-ਬੇਤਾ ਹੋ, ਹੇ ਨਾਨਕ! ਪ੍ਰਾਨੀ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Gurmukh dwells on the Naam, the Name of the Lord. ||11||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜੋ ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਨਾਮ ਕੋ ਸਿਮਰਤੇ ਹੈਂ, ਇਹ ਭਿਖਿਆ ਮਾਂਗਤੇ ਹਾਂ॥੧੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਜੋ ਮਨੁੱਖ) ਗੁਰੂ ਦੀ ਰਾਹੀਂ (ਪ੍ਰਭੂ ਦਾ) ਨਾਮ ਯਾਦ ਕਰਦਾ ਹੈ ॥੧੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਰਾਹੀਂ। ਸਮਾਲਿ = ਸਮਾਲੇ, ਸਮ੍ਹਾਲਦਾ ਹੈ ॥੧੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y así, dice Nanak, goza del Nombre del Señor por la Gracia del Guru.(11)"