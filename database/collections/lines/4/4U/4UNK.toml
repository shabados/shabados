[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਬੈਸਨੋ; ਹੈ ਅਪਰ ਅਪਾਰੁ ॥"
page = 199
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Infinitely invaluable is that vegetarian,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਅੰਤ ਅਣਮੁੱਲਾ ਹੈ ਉਹ ਮਾਸ-ਤਿਆਗੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Infinitely invaluable is that Vaishnaav, that worshipper of Vishnu,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਬੈਸਨੋ ਸ੍ਰੇਸਟ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਰਮ ਧਰਮ ਨੇਮ ਬ੍ਰਤ ਪੂਜਾ ਕਰਨ ਵਾਲਾ ਮਨੁੱਖ ਅਸਲ ਬੈਸਨੋ ਨਹੀਂ ਹੈ) ਉਹ ਬੈਸਨੋ ਪਰੇ ਤੋਂ ਪਰੇ ਤੇ ਸ੍ਰੇਸ਼ਟ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੈਸਨੋ = ਵਿਸ਼ਨੂ ਦਾ ਭਗਤ। ਅਪਰ ਅਪਾਰੁ = ਪਰੇ ਤੋਂ ਪਰੇ, ਬਹੁਤ ਸ੍ਰੇਸ਼ਟ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el verdadero Vishnuita,"