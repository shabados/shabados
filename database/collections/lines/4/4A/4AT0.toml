[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਠੀਕਰੀਆਂ ਹਾਲੇ ਭਰਨਿ; ਉਇ ਖਰੇ ਅਸਠੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They pay tax by offering potshreds and thus become wise."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਇਕ ਠੀਕਰੀਆਂ ਦੇ ਰੁਪਏ ਬਣਾ ਕੇ ਮਾਮਲੇ ਤਾਰਨ ਜਾਂਦੇ ਹਨ, ਓਹ ਖਰੇ ਸਿਆਣੇ (ਬਣ ਬਹਿੰਦੇ ਹਨ)।"