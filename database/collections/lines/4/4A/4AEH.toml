[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਮਹਿ; ਜੋਤਿ ਕਰੇ ਪਰਗਾਸ ॥"
page = 1162
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "wherein shine His light."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਵਿੱਚ ਉਸ ਦਾ ਨੂਰ ਚਾਨਣ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There, His Divine Light radiates forth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਵਿਖੇ ਤਿਸ ਕੀ ਜੋਤਿ ਪ੍ਰਕਾਸ ਕਰ ਰਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਅੰਦਰ ਪ੍ਰਭੂ ਆਪਣੀ ਜੋਤ ਦਾ ਚਾਨਣ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਮਹਿ = ਜਿਸ (ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ) ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en donde habita nuestro Señor, ahí Dios lo ilumina todo."