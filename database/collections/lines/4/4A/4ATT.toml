[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੀ ਸਾਖੀ; ਰਾਖੈ ਚੀਤਿ ॥"
page = 974
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru's instruction he treasures up in his mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦਾ ਉਪਦੇਸ਼ ਉਹ ਆਪਣੇ ਮਨ ਅੰਦਰ ਟਿਕਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He cherishes in his consciousness the Guru's Teachings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਗੁਰ ਸਿਖ੍ਯਾ ਕੋ ਚੀਤਿ ਰਾਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੂ ਦਾ ਉਪਦੇਸ਼ ਆਪਣੇ ਮਨ ਵਿਚ ਸਾਂਭ ਕੇ ਰੱਖਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਖੀ = ਸਿੱਖਿਆ। ਚੀਤਿ = ਚਿੱਤ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "enaltecer la Palabra del Guru en su mente"