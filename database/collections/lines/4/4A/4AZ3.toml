[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿੰਦਕ ਕੀ ਗਤਿ. ਕਤਹੂ ਨਾਹਿ ॥"
page = 1145
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In no wise, the slanderer obtains salvation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਦੀ ਬਦਖੋਈ ਕਰਨ ਵਾਲੇ ਨੂੰ ਕਿਸੇ ਤਰ੍ਹਾਂ ਭੀ ਮੁਕਤੀ ਨਹੀਂ ਮਿਲਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slanderer finds no salvation at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਿਧਾਂਤ ਇਹ ਹੈ: ਕਿ ਨਿੰਦਕ ਕੀ ਗਤੀ ਕਿਤੇ ਨਹੀਂ ਹੋਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦੂਜਿਆਂ ਉੱਤੇ ਸਦਾ ਚਿੱਕੜ ਸੁੱਟਣ ਵਾਲੇ ਮਨੁੱਖ ਦੀ ਆਪਣੀ ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ਕਦੇ ਭੀ ਨਹੀਂ ਬਣਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਤਿ = ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Al calumniador no lo salva nadie, no, nadie, y finalmente cosecha todo lo que sembró."