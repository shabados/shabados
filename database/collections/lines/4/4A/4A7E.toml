data = "(ਉਹ) ਰਾਜਿਆਂ ਦਾ ਮਹਾਰਾਜਾ ਅਤੇ ਨਾਥਾਂ ਦਾ ਵੀ ਮਹਾਨਾਥ ਹੈ ॥੧੫॥"