[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਠਾਂਢਿ ਪਰੀ; ਸੰਤਹ ਸੰਗਿ ਬਸਿਆ ॥"
page = 256
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who abides in the guild of Saints is pacified,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਤਿ ਸੰਗਤ ਅੰਦਰ ਵਸਦਾ ਹੈ, ਉਹ ਸੀਤਲ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who dwells in the Society of the Saints finds a great peace;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੁਰਸ ਸੰਤੋਂ ਕੇ ਸੰਗ ਮੇਂ ਬਸਾ ਹੈ ਤਿਸ ਕੇ ਮਨ ਮੇਂ (ਠਾਂਢਿ) ਸਾਂਤੀ ਪੜੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਗੁਰਮੁਖਾਂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਨਿਵਾਸ ਰੱਖਦਾ ਹੈ, ਉਸ ਦੇ ਮਨ ਵਿਚ ਠੰਡ ਪਈ ਰਹਿੰਦੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que habita en la Saad Sangat, la Sociedad de los Santos logra la Paz,"