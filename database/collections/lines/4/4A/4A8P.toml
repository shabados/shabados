[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਾਗਹੀਨ; ਨਹੀ ਸਤਿਗੁਰੁ ਪਾਇਆ ॥੩॥"
page = 366
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The unfortunate one meets not the True Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਦਕਿਸਮਤ ਬੰਦਾ ਸੱਚੇ ਗੁਰਾਂ ਨੂੰ ਨਹੀਂ ਮਿਲਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The unfortunate ones do not meet the True Guru. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਭਾਗਹੀਨੋ ਨੇ ਸਤਿਗੁਰੋਂ ਕੋ ਨਹੀਂ ਪਾਇਆ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਬਦ-ਨਸੀਬ ਹਨ ਜਿਨ੍ਹਾਂ ਨੂੰ ਗੁਰੂ ਨਹੀਂ ਮਿਲਿਆ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si uno está trastornado por la dualidad. Y estos desafortunados no encuentran al Verdadero Guru. (3)"