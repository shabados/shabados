[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਮਣਿਆਰੀ ਕਾਮਣ ਪਾਏ; ਬਹੁ ਰੰਗੀ ਗਲਿ ਤਾਗਾ ॥"
page = 582
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mammon sorcerer works her sorcery and puts multi-coloured thread around every one's neck."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਟੂਣੇ ਹਾਰਨੀ ਮਾਇਆ ਆਪਣਾ ਟੂਣਾ ਕਰਦੀ ਹੈ ਅਤੇ ਹਰ ਜਣੇ ਦੀ ਗਰਦਨ ਦੁਆਲੇ ਬਹੁਰੰਗਾ ਧਾਗਾ ਪਾ ਦਿੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Charmer, Maya, has worked her charms, and the multi-colored thread is around everyone's neck."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ (ਕਾਮਣਆਰੀ) ਜਾਦੂ ਵਾਲੀ ਮਾਇਆ ਨੇ ਜਾਦੂ ਪਾਏ ਹੈਂ ਮੋਹ ਰੂਪ ਬਹੁਰੰਗੀ ਤਾਗਾ ਗਲੇ ਮੇਂ ਬਾਂਧ ਦੀਆ ਹੈ। ਭਾਵ ਅਨੇਕ ਪ੍ਰਕਾਰ ਕੇ ਮੋਹ ਕਰ ਜੀਉ ਬਾਂਧਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸੇ ਲਿਖੇ ਅਨੁਸਾਰ ਹੀ) ਜਾਦੂ ਟੂਣੇ ਕਰਨ ਵਾਲੀ ਮਾਇਆ ਜੀਵ ਉਤੇ ਜਾਦੂ ਪਾ ਦੇਂਦੀ ਹੈ, ਇਸ ਦੇ ਗਲ ਵਿਚ ਕਈ ਰੰਗਾਂ ਵਾਲਾ ਧਾਗਾ ਪਾ ਦੇਂਦੀ ਹੈ (ਭਾਵ, ਕਈ ਤਰੀਕਿਆਂ ਨਾਲ ਮਾਇਆ ਇਸ ਨੂੰ ਮੋਹ ਲੈਂਦੀ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਮਣਿਆਰੀ = ਜਾਦੂ ਟੂਣੇ ਕਰਨ ਵਾਲੀ (ਮਾਇਆ)। ਕਾਮਣ = ਟੂਣੇ, ਜਾਦੂ। ਗਲਿ = ਗਲ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Maya, la encantadora, ha embrujado al mundo entero, atando todos los hilos de color en cada uno de los cuellos."