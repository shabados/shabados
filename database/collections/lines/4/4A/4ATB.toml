[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਊਹਾ ਸਿਮਰਹਿ; ਕੇਵਲ ਨਾਮੁ ॥"
page = 888
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There, only the Lord's Name is meditated upon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਓਥੇ ਸਿਰਫ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਹੀ ਆਰਾਧਨ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There, they meditate only on the Naam, the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਸ ਅਸਥਾਨ ਮੇਂ ਕੇਵਲ ਨਾਮ ਹੀ ਸਿਮਰਣ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਸ ਆਤਮਕ ਅਵਸਥਾ ਵਿਚ (ਪਹੁੰਚੇ ਹੋਏ ਸੰਤ-ਜਨ) ਸਿਰਫ਼ (ਹਰਿ-) ਨਾਮ ਸਿਮਰਦੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਊਹਾ = ਉਥੇ, ਉਸ ਆਤਮਕ ਅਵਸਥਾ ਵਿਚ। ਕੇਵਲ = ਸਿਰਫ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahí meditan en el Naam,"