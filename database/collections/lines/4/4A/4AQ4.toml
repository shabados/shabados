[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉਮੈ ਮੇਰਾ; ਠਾਕਿ ਰਹਾਇਆ ॥"
page = 110
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and my egotism and egoism are stopped and stayed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਹੰਗਤਾ ਤੇ ਅਪਣੱਤ ਰੋਕ ਤੇ ਵਰਜ ਦਿਤੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "my ego has been silenced and subdued."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਹਉਮੈ ਮੇਰਾ ਆਦਿ ਸੰਕਲਪੋਂ ਕੋ ਰੋਕ ਰਖਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਉਮੈ ਤੇ ਮਮਤਾ ਨੂੰ ਰੋਕ ਕੇ ਵੱਸ ਵਿਚ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੇਰਾ = ਮਮਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y mi ego se tranquilizó."