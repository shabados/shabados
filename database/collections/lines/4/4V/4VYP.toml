[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੀਬਾਨੁ ਹਮਾਰੋ; ਤੁਹੀ ਏਕ ॥"
page = 210
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou alone art my High Official."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤੂੰ ਹੀ ਮੇਰਾ ਵੱਡਾ ਦੀਵਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You alone are my Chief Advisor."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਹਾਰਾਜ! (ਦੀਬਾਨੁ) ਆਸਰਾ ਹਮਾਰਾ ਤੂੰ ਹੀ ਏਕ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਸਿਰਫ਼ ਤੂੰ ਹੀ ਮੇਰਾ ਆਸਰਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੀਬਾਨੁ = ਹਾਕਮ, ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú eres mi Única Corte, oh Señor,"