[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਯਾ ਕੇ ਭੀਤਰ ਭੇਦ; ਨੈਕੁ ਨਹੀ ਮਾਨੀਐ ॥੧੧੦੩॥"
page = 788

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Swamini”, add the word “Shatru” at the end and know all the names of Tupak without any discrimination.1103."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਵਿਚ ਜ਼ਰਾ ਜਿੰਨਾ ਅੰਤਰ ਨਾ ਸਮਝੋ ॥੧੧੦੩॥"