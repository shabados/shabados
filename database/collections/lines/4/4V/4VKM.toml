[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਸਕਲ ਤੁਪਕ ਕੇ ਨਾਮ; ਸੁਕਬਿ ਲਹਿ ਲੀਜੀਐ ॥੧੦੨੫॥"
page = 781

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the words “Urgeshwar-bhaginin” add the words “Satchar-naath-shatru” at the end, and know all the names of Tupak.1025."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਨੂੰ) ਸੁਕਵੀ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝੋ ॥੧੦੨੫॥"