[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਸ ਕਾਰਨ ਕੋ ਭਗਵਾਨ ਤਹਾ ਕਬਿ ਸ︀ਯਾਮ ਕਹੈ ਰਸ ਖੇਲ ਕਰਿਯੋ ॥"
page = 347

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Being deeply absorbed in love, Lord Krishna played his amorous play there"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਵੀ ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, (ਪ੍ਰੇਮ) ਰਸ ਲੈਣ ਲਈ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਨੇ (ਪ੍ਰੇਮ) ਰਸ ਦੀ ਖੇਡ ਰਚਾਈ ਹੈ।"