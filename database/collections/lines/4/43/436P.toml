[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੋਹਾਗਣੀ ਕਾ ਮਨ; ਦੇਖੁ ਸੀਗਾਰੁ ॥"
page = 363
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Look! the decorations of the discarded bride."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵੇਖੋ, ਛੱਡੀ ਹੋਈ ਪਤਨੀ ਦਾ ਹਾਰ-ਸ਼ਿੰਗਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Behold, the decorations of the discarded bride!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਦੋਹਾਗਣੀ ਕਾ ਮਨ) ਮਨਮੁਖਿ ਰੂਪ ਛੁਟੜ ਇਸਤ੍ਰੀ ਕਾ ਸਿੰਗਾਰ ਦੇਖੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! (ਖਸਮ ਦੀ ਛੱਡੀ ਹੋਈ) ਮੰਦ-ਕਰਮਣ ਇਸਤ੍ਰੀ ਦਾ ਸਿੰਗਾਰ ਵੇਖ, ਨਿਰਾ ਪਖੰਡ ਹੈ ਨਿਰਾ ਵਿਕਾਰ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੋਹਾਗਣੀ = ਮੰਦ-ਭਾਗਣ, ਖਸਮ ਦੀ ਛੱਡੀ ਹੋਈ। ਮਨ = ਹੇ ਮਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Observa los decoros de la novia desaprobada,"