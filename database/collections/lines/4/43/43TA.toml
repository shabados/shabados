[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੁ ਨਾਮੁ; ਸੰਤਨ ਆਧਾਰੁ ॥"
page = 392
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The one Name is the support of his saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਨਾਮ ਹੀ ਸਾਧੂਆਂ ਦਾ ਆਸਰਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One Name is the Support of the Saints;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਨ ਸੰਤੋਂ ਕੋ ਏਕ ਨਾਮ ਹੀ ਆਧਾਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਵੀਰ!) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹੀ ਸੰਤ ਜਨਾਂ (ਦੀ ਜ਼ਿੰਦਗੀ) ਦਾ ਆਸਰਾ (ਬਣਿਆ ਰਹਿੰਦਾ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤਨ = ਸੰਤਾਂ ਦਾ। ਆਧਾਰੁ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, el Nombre es lo Primordial para los Santos,"