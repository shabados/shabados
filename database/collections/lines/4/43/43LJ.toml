[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਬਜਰ ਪਾਪਾਂ ਬਜਰ ਪਾਪ; ਮੈ ਜੇਹੇ ਕਰਿ ਵੈਰੀ ਇਠੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The worst sins have become my beloved ideals."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਬਜਰ ਥੋਂ ਜੋ ਮਹਾਂ ਬਜਰ ਪਾਪ ਹਨ ਮੈਂ ਜਿਹੇ ਵੈਰੀ ਨੇ (ਓਹ 'ਇਠੇ) ਪਯਾਰੇ ਕਰ ਕੇ ਮੰਨੇ ਹਨ।"