[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੋ ਏਕੁ; ਵਰਤੈ ਹਰਿ ਲੋਇ ॥"
page = 1177
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The one Lord is pervading in every universe."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਪ੍ਰਭੂ ਹੀ ਹਰ ਇਕ ਆਲਮ ਅੰਦਰ ਰਮ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One and Only Lord permeates and pervades the world."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਹੀ ਅਦੁਤੀ ਹਰੀ ਸਰਬ (ਲੋਇ) ਲੋਕੋਂ ਮੇਂ ਬਰਤ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਕ ਪਰਮਾਤਮਾ ਹੀ ਸਾਰੇ ਜਗਤ ਵਿਚ ਵਰਤ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੋਇ = ਜਗਤ ਵਿਚ {ਅਧਿਕਰਣ ਕਾਰਕ, ਇਕ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Único Señor prevalece en el mundo,"