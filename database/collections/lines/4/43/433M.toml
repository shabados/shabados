[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਸੰਗਿ ਰਾਤੇ; ਸੁਫਲ ਫਲਾ ॥੧॥"
page = 201
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who is imbued with Lord's love bears good fruit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਪ੍ਰਭੂ ਦੀ ਪ੍ਰੀਤ ਨਾਲ ਰੰਗੀਜਿਆਂ ਹੈ, ਉਸ ਨੂੰ ਸਰੇਸ਼ਟ ਫਲ ਲਗਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who is attuned to the Lord, is prosperous and fruitful. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਹਰੀ ਕੇ ਸਾਥ ਰਹਨੇ ਸੋ ਸੁਸਟੂ ਫਲੋਂ ਕੈ ਸਮਦਾਇ ਕਰ ਫਲਤਾ ਹੈ, ਅਰਥਾਤ ਵੈਰਾਗ ਬਬੇਕ ਆਦਿ ਗੁਣੋਂ ਕੇ ਸੰਜੁਗਤ ਹੋਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖਾ ਜਨਮ ਦਾ ਸੋਹਣਾ ਮਨੋਰਥ ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y benditas y fructíferas son todas sus acciones."