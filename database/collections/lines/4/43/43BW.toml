[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿੰਦਕ ਕਾ; ਝੂਠਾ ਬਿਉਹਾਰੁ ॥"
page = 1151
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "False are the dealings of the calumniator."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੂੜਾ ਹੈ ਕਾਰ ਵਿਹਾਰ ਕਲੰਕ ਲਾਉਣ ਵਾਲੇ ਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "False are the dealings of the slanderer."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਿੰਦਕ ਕਾ ਸਭ ਬਿਉਹਾਰ ਝੂਠਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ ਜਗਤ ਜਾਣਦਾ ਹੈ ਕਿ) ਤੁਹਮਤਾਂ ਲਾਣ ਦਾ ਇਹ ਕਸਬ ਝੂਠਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਉਹਾਰ = (ਤੁਹਮਤਾਂ ਲਾਣ ਵਾਲਾ) ਕਸਬ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, el calumniador vive en la falsedad."