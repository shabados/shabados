[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭੂ ਦਇਆ ਤੇ; ਕਮਲ ਬਿਗਾਸੁ ॥"
page = 271
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through Lord's kindness the heart lotus blooms."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਦੀ ਮਿਹਰ ਰਾਹੀਂ ਦਿਲ-ਕੰਵਲ ਖਿੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By God's Kind Mercy, the heart-lotus blossoms forth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕੀ ਦਯਾ ਸੇ ਹੀ ਰਿਦਾ ਕਮਲ (ਬਿਗਾਸੁ) ਪ੍ਰਫੁਲਤ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਦਇਆ ਨਾਲ ਹਿਰਦਾ-ਰੂਪ ਕਉਲ ਫੁੱਲ ਖਿੜਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭੂ ਦਇਆ = ਪ੍ਰਭੂ ਦੀ ਦਇਆ। ਕਮਲ ਬਿਗਾਸੁ = ਕਮਲ ਦਾ ਬਿਗਾਸ, ਹਿਰਦੇ ਰੂਪੀ ਕਉਲ ਫੁੱਲ ਦਾ ਖਿੜਾਉ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Iluminación llega por Su Gracia haciendo florecer tu ser."