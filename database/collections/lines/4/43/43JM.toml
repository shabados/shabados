data = "ਤਾਂ ਸਿਉ; ਪ੍ਰੀਤਿ ਕਰਿ ਹਾਂ ॥"
page = 410
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Do thou bear love with Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਨਾਲ ਤੂੰ ਆਪਣਾ ਪ੍ਰੇਮ ਪਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Enshrine love for Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸੇ ਪ੍ਰੀਤ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮੇਰੇ ਮਨ!) ਉਸ ਪਰਮਾਤਮਾ ਨਾਲ ਪਿਆਰ ਪਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਉ = ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh mi mente. Él no perece, o se va o muere,"