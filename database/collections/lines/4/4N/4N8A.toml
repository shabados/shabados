[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੈਹੈ ਤਿਲ ਬੂਆੜਿ ਲਖ; ਅਕਤਿਡ ਅਰੰਡ ਤੁਮੇ ਚਿਤਰਾਲੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Seedless sesame plants, castor, colocynths;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕੈਂਹਾਂ, ਬੂਆੜ ਨਾਮ ਲੱਖਾਂ ਤਿਲ, ਅੱਕਾਂ ਦੇ ਟਿੱਡੇ, ਅਰਿੰਡ ਬ੍ਰਿਛ, ਤੁੰਮੇ ਚਿੱਤ੍ਰ ਮਿੱਤ੍ਰੇ,"