[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖੁ ਅੰਧਾ; ਦੂਜੈ ਭਾਇ ਲਾਗੈ ॥"
page = 113
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The blind perverse person is attached with another's love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਨ੍ਹਾ ਪ੍ਰਤੀਕੂਲ ਪੁਰਸ਼ ਹੋਰਸ ਦੇ ਪਿਆਰ ਨਾਲ ਚਿਮੜਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the blind self-willed manmukhs are attached to the love of duality."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ ਗ੍ਯਾਨ ਨੇਤ੍ਰੋਂ ਸੇ ਹੀਨ ਦੂਜੈ ਭਾਵ ਮੇਂ ਲਾਗੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਅੰਨ੍ਹਾ ਹੋਇਆ ਮਨੁੱਖ ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲਾ ਮਨੁੱਖ (ਪ੍ਰਭੂ ਨੂੰ ਭੁਲਾ ਕੇ) ਮਾਇਆ ਦੇ ਪਿਆਰ ਵਿਚ ਫਸਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਜੈ ਭਾਇ = ਦੂਜੇ ਦੇ ਪਿਆਰ ਵਿਚ, ਪ੍ਰਭੂ ਤੋਂ ਬਿਨਾ ਹੋਰ ਦੇ ਪ੍ਰੇਮ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque los tontos arrogantes Manmukjs están cegados por su apego a la dualidad."