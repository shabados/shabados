[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਇਸੁ ਮਨ ਕੀ ਸੋਝੀ ਪਾਵੈ ॥"
page = 665
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then alone, he comes to understand this mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤਦ ਹੀ ਉਸ ਨੂੰ ਇਸ ਮਨ ਦੀ ਸਮਝ ਆਉਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and so, he comes to understand this mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਇਸ ਮਨ ਕੀ ਸੋਝੀ ਕੋ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਉਸ ਨੂੰ ਇਸ ਮਨ (ਨੂੰ ਵੱਸ ਵਿਚ ਰੱਖਣ) ਦੀ ਸਮਝ ਆ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ = ਤਦੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entonces llega a entender su mente."