[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਗੁਰ ਮਿਰੀਆ ॥"
page = 746
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak has met the Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਗੁਰਦੇਵ ਜੀ ਨੂੰ ਮਿਲ ਪਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak has met the Guru;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਐਸੇ ਗੁਰੂ ਮਿਲੇਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਜੇਹੜਾ ਭੀ ਮਨੁੱਖ) ਗੁਰੂ ਨੂੰ ਮਿਲਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਮਿਰੀਆ = ਗੁਰੂ ਨੂੰ ਮਿਲਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak a encontrado al Guru;"