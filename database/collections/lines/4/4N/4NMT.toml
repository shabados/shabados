type = "primary"
data = "ਫਲਤ ਆਪਨੀ ਭਾਵਨਾ; ਯਾ ਮੈ ਭੇਦ ਨ ਕੋਇ ॥"
page = 917

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Whatever one would wish for, one would get it accomplished"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸਭ ਥਾਂ) ਆਪਣੀ ਭਾਵਨਾ ਹੀ ਫਲਦੀ ਹੈ, ਇਸ ਵਿਚ ਕੋਈ ਭੇਦ ਨਹੀਂ ਹੈ।"