[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਣਿ ਬੇਨਤੀ; ਪ੍ਰਭ ਦੀਨ ਦਇਆਲਾ ॥"
page = 743
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hearken Thou my supplication, O Merciful Master of the meek."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰੀ ਪ੍ਰਾਰਥਨਾ ਸ੍ਰਵਣ ਕਰ, ਹੇ ਮਸਕੀਨ ਉਤੇ ਮਿਹਰਬਾਨ ਮਾਲਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Hear my prayer, O God, O Merciful to the meek."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਦੀਨਦ੍ਯਾਲ! ਮੇਰੀ ਬੇਨਤੀ ਸੁਣ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦੀਨਾਂ ਉਤੇ ਦਇਆ ਕਰਨ ਵਾਲੇ ਪ੍ਰਭੂ! (ਮੇਰੀ) ਬੇਨਤੀ ਸੁਣ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor que Te compadeces del débil"