[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਨਾਮੁ ਸੁਨਾਵੈ ਨੀਤ ॥"
page = 980
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who may ever recite to me the Lord's Name;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਮੈਨੂੰ ਸਦਾ ਹੀ ਸੁਆਮੀ ਦਾ ਨਾਮ ਸ੍ਰਵਣ ਕਰਵਾਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "who will constantly share the Lord's Name with me?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਹਰੀ ਨਾਮ ਮੇਰੇ ਕੋ ਨਿਤ ਹੀ ਸੁਨਾਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਸਦਾ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸੁਣਾਂਦਾ ਰਹੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੀਤ = ਸਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que me recite el Nombre del Señor para poder liberar mis aflicciones y mis males?"