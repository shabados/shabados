type = "primary"
data = "ਨਾਮ ਤਾਸ ਕਬਿ ਦੇਤ ਬਤਾਈ ॥੨੯੪॥"
page = 704

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All those warriors who arrayed themselves in an army rushed forward, the poet now tells their names.67.294."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੇ ਨਾਂ ਕਵੀ ਦਸਦਾ ਹੈ ॥੨੯੪॥"