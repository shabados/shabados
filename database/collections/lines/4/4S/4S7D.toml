[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੇ ਚਰਨ; ਹਿਰਦੈ ਵਸਾਏ ॥"
page = 395
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Guru's Feet I have placed within my mind,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਪੈਰ ਮੈਂ ਆਪਣੇ ਚਿੱਤ ਅੰਦਰ ਟਿਕਾਏ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The feet of the Guru abide within my heart;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸੇ ਮੈਨੇ ਗੁਰੋਂ ਕੇ ਚਰਨ ਅੰਤਸਕਰਣ ਮੇਂ ਬਸਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜਦੋਂ ਤੋਂ) ਮੈਂ ਗੁਰੂ ਦੇ ਚਰਨ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਵਸਾਏ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਿਰਦੈ = ਹਿਰਦੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que enaltece en su corazón"