[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਲਾਵਲੁ ਤਬ ਹੀ ਕੀਜੀਐ; ਜਬ ਮੁਖਿ ਹੋਵੈ ਨਾਮੁ ॥"
page = 849
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then alone make thou merry, when Lord's Name is in thy mouth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤਦ ਹੀ ਤੂੰ ਖੁਸ਼ੀ ਮਨਾ, ਜਦ ਤੇਰੇ ਮੂੰਹ ਵਿੱਚ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Be happy and sing in Bilaaval, when the Naam, the Name of the Lord, is in your mouth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤਬ ਰਿਦੇ ਮੇਂ (ਬਿਲਾਵਲੁ) ਅਨੰਦ ਧਾਰਨ ਕਰੀਏ ਜਬ ਮੁਖ ਤੇ ਨਾਮ ਕਾ ਉਚਾਰਨ ਹੋਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪੂਰਨ ਆਤਮਕ ਆਨੰਦ ਤਦੋਂ ਹੀ ਮਾਣਿਆ ਜਾ ਸਕਦਾ ਹੈ, ਜਦੋਂ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ (ਮਨੁੱਖ ਦੇ) ਮੂੰਹ ਵਿਚ ਟਿਕਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਲਾਵਲੁ = ਪੂਰਨ ਖਿੜਾਉ, ਆਤਮਕ ਆਨੰਦ। ਕੀਜੀਐ = ਕੀਤਾ ਜਾ ਸਕਦਾ ਹੈ, ਮਾਣਿਆ ਜਾ ਸਕਦਾ ਹੈ। ਮੁਖਿ = ਮੂੰਹ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Siéntete Feliz y canta las notas del Bilawal cuando el Naam, el Nombre de Dios esté en tu boca."