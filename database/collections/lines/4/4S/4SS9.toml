[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤ੍ਰਿਪਤਿ ਅਘਾਵੈ; ਹਰਿ ਦਰਸਨਿ ਮਨੁ ਮੋਰਾ ॥੧॥ ਰਹਾਉ ॥"
page = 376
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By God's sight, my mind is sated and satiated. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਦੀਦਾਰ ਦੁਆਰਾ ਮੇਰਾ ਚਿੱਤ ਰੱਜ ਅਤੇ ਧ੍ਰਾਪ ਜਾਂਦਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind is satisfied and satiated by the Blessed Vision of the Lord's Darshan. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਦਰਸਨ ਕਰ ਮੇਰਾ ਮਨੁ ਅਤੀ ਤ੍ਰਿਪਤਿ ਹੋਤਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਮੇਰਾ ਮਨ ਪਰਮਾਤਮਾ ਦੇ ਦਰਸ਼ਨ ਦੀ ਬਰਕਤਿ ਨਾਲ (ਦੁਨੀਆ ਦੇ ਧਨ ਪਦਾਰਥ ਵਲੋਂ) ਰੱਜ ਗਿਆ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤ੍ਰਿਪਤਿ ਅਘਾਵੈ = ਰੱਜ ਜਾਂਦਾ ਹੈ। ਦਰਸਨਿ = ਦਰਸਨ ਨਾਲ। ਮੋਰਾ = ਮੇਰਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "todo lo demás es en vano, porque sólo la Visión del Señor me puede llevar a la Plenitud. (1‑Pausa)"