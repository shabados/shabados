[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਤੀਤੁ ਸਦਾਏ; ਮਾਇਆ ਕਾ ਮਾਤਾ ॥"
page = 738
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is absorbed in mammon and calls himself a detached one."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਧਨ ਦੌਲਤ ਵਿੱਚ ਲੀਨ ਹੋਇਆ ਹੋਇਆ ਹੈ ਅਤੇ ਆਪਣੇ ਆਪ ਨੂੰ ਵਿਰੱਕਤ ਅਖਵਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He says that he is unattached, but he is intoxicated with Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਊਪਰ ਸੇ (ਅਤੀਤੁ) ਫਕੀਰ ਸਦਾਵਤਾ ਹੈ ਅੰਦਰੋਂ ਮਾਯਾ ਮੇਂ (ਮਾਤਾ) ਮਸਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਵੇਖ ਮੂਰਖ ਦੀ ਹਠ ਦੀ ਗੱਲ! ਇਹ ਆਪਣੇ ਆਪ ਨੂੰ) ਤਿਆਗੀ ਅਖਵਾਂਦਾ ਹੈ ਪਰ ਮਾਇਆ (ਦੀ ਲਾਲਸਾ) ਵਿਚ ਮਸਤ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਤੀਤੁ = ਵਿਰਕਤ, ਤਿਆਗੀ। ਸਦਾਏ = ਅਖਵਾਂਦਾ ਹੈ। ਮਾਤਾ = ਮੱਤਾ ਹੋਇਆ, ਮਸਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Se encuentra envuelto por Maya y dice a todo mundo que él vive en el total desapego."