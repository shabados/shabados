[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੋ ਸਾਚੁ ਕਮਾਵਣਾ; ਸਾਚੈ ਸਬਦਿ ਮਿਲਾਉ ॥੧॥ ਰਹਾਉ ॥"
page = 30
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Practise nothing but Truth and unite with the True Name. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਿਰੋਲ ਸੱਚ ਦੀ ਕਮਾਈ ਕਰ ਅਤੇ ਸੱਚੇ ਨਾਮ ਨਾਲ ਜੁੜ ਜਾ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Practice truth, and only truth, and merge in the True Word of the Shabad. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਾ ਸਾਚ ਨਾਮ ਕੋ (ਰਹਾਉ) ਬੀਜੁ, ਭਾਵ ਏਹਿ ਕਿ ਜਪੁ, ਜਿਨੋਂ ਨੈ ਮਨ, ਬਚ, ਕ੍ਰਮ, ਕਰ ਕੇ ਸਾਚ ਨਾਮ ਕਾ ਕਮਾਵਨਾ ਅਰਥਾਤ ਜਪੁ ਔਰੁ ਧਿਆਨ ਕੀਆ ਹੈ, ਸੋ ਪੁਰਸ ਸਾਚੇ ਸਬਦਿ ਬ੍ਰਹਮ ਸ੍ਵਰੂਪੁ ਮੇਂ ਅਭੇਦ ਭਏ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਸਿਮਰਨ ਦੀ ਹੀ ਕਮਾਈ ਕਰੋ, ਸਦਾ-ਥਿਰ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਵਿਚ ਜੁੜੇ ਰਹੋ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚੋ ਸਾਚੁ = ਸਾਚੁ ਹੀ ਸਾਚੁ, ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ (ਦਾ ਸਿਮਰਨ) ਹੀ। ਸਾਚੈ ਸਬਦਿ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਵਿਚ। ਮਿਲਾਉ = ਮਿਲੇ ਰਹੋ॥੧॥ਰਹਾਉ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Practica la Verdad, vive la Verdad, y únete a la Palabra Verdadera. (1-Pausa)"