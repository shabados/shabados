[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਮਿਰਤਕ; ਮਿਥਿਆ ਸੀਗਾਰੁ ॥੨॥"
page = 240
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "like the decoration of a corpse."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਲੋਥ ਉਤੇ ਹਾਰ ਸ਼ਿੰਗਾਰ ਪਾਇਆ ਹੋਵੇ"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Like decorations on a dead body. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਐਸਾ ਹੈ ਜੈਸਾ ਕਿ ਮ੍ਰਿਤਕ ਪੁਰਸ ਕੋ ਸਿੰਗਾਰ ਕਰਨਾ ਬਿਅਰਥ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹ ਇਉਂ ਹੈ) ਜਿਵੇਂ ਕਿਸੇ ਲੋਥ ਦਾ ਸਿੰਗਾਰ ਵਿਅਰਥ (ਉੱਦਮ) ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਰਤਕ = ਮੁਰਦਾ। ਮਿਥਿਆ = ਝੂਠਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "son como los adornos que les ponen a los muertos. (2)"