[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਮਨਿ ਵਸਿਆ; ਹਰਿ ਕਾ ਨਾਮੁ ॥"
page = 395
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In whose mind the Name of God abides,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਉਸ ਉਤੋਂ ਬਲਿਹਾਰਨੇ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One whose mind is filled with the Name of the Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਮਨ ਮੇਂ ਅਕਾਲ ਪੁਰਖ ਕਾ ਨਾਮ ਬਸਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਮਨ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਆ ਵੱਸਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸੁ ਮਨਿ = ਜਿਸ (ਮਨੁੱਖ) ਦੇ ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak ofrece para siempre su ser en sacrificio a aquél que ha enaltecido el Naam,"