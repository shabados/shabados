[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਮ ਮਰਨ ਦੁਹੁ ਤੇ ਰਹਿਓ ॥੬॥"
page = 241
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thus be rid of both birth and death."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਜੰਮਣ ਤੇ ਮਰਣ ਦੁਹਾ ਤੇ ਖਲਾਸੀ ਪਾ ਜਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Thus you shall be rid of both birth and death. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਯੋਂਕਿ ਜਿਸ ਨੇ ਤਿਆਗਿਆ ਹੈ, ਸੋ ਜਨਮ ਮਰਨ ਦੋਨੋਂ ਸੇ ਰਹਤ ਹੂਆ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇਹੜਾ ਮਨੁੱਖ ਇਹਨਾਂ ਵਿਕਾਰਾਂ ਨੂੰ ਮਿਟਾਂਦਾ ਹੈ) ਉਹ ਜਨਮ ਅਤੇ ਮਰਨ ਦੋਹਾਂ (ਦੇ ਗੇੜ) ਤੋਂ ਬਚ ਜਾਂਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਹੁ ਤੇ = ਦੋਹਾਂ ਤੋਂ। ਰਹਿਓ = ਬਚ ਜਾਂਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "de la avaricia, de la vanidad, y trasciende el nacimiento y la muerte. (6)"