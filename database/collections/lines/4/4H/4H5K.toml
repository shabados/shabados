[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧ ਜਨਾ ਕੀ ਚਰਣੀ ਪਾਹਾ ॥੧॥ ਰਹਾਉ ॥"
page = 742
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Let us repair to the feet of the pious persons. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਓ ਆਪਾਂ ਪਵਿੱਤਰ ਪੁਰਸ਼ਾਂ ਦੇ ਪੈਰੀ ਪਈਏ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Let us fall at the feet of the holy, humble beings. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨਾਂ ਕੀ ਪੈਰੀਂ ਪੈ ਕੇ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨਾਂ ਦੇ ਚਰਨਾਂ ਵਿਚ ਜਾ ਪਈਏ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਹਾ = ਪਈਏ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y postrémonos a los Pies de los Santos. (1-Pausa)"