[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਉ ਸਰਣਾਈ; ਪੂਰਨ ਨਾਥ ॥"
page = 867
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have entered Thine sanctuary, O my perfect Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੇਰੀ ਪਨਾਹ ਲਈ ਹੈ, ਹੇ ਮੇਰੇ ਮੁਕੰਮਲ ਮਾਲਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have entered Your Sanctuary, O Perfect Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੂਰਨ ਸੁਆਮੀ! ਹਮ ਤੇਰੀ ਸਰਣ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਰੇ ਗੁਣਾਂ ਨਾਲ ਭਰਪੂਰ ਖਸਮ-ਪ੍ਰਭੂ! ਮੈਂ ਤੇਰੀ ਸਰਨ ਆਇਆ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਉ = ਤੇਰੀ। ਨਾਥ = ਹੇ ਨਾਥ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Busco Tu Refugio, oh Dios Perfecto;"