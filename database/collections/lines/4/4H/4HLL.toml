[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੋਰੁ ਫਕੜੁ; ਹਿੰਦੂ ਮੁਸਲਮਾਣੈ ॥"
page = 952
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Others, whether Hindus or Muslims, are but praters."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੋਰ ਭਾਵੇਂ ਹਿੰਦੂ ਜਾਂ ਮੁਸਲਮਾਨ, ਕੇਵਲ ਬਕਵਾਦੀ ਹੀ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Others, whether Hindu or Muslim, are just babbling."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਿਨਾ ਜਾਣੇ ਪ੍ਰਮੇਸਰ ਕੇ ਹਿੰਦੂ ਹੋਵੈ ਚਾਹੋ ਔਰ ਕੋਈ ਹੋਵੈ ਅਥਵਾ ਮੁਸਲਮੀਨ ਹੋਵੈ ਸਭ ਕੋ (ਫਕੜੁ) ਖਰਾਬੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇ ਇਹ ਉੱਦਮ ਨਹੀਂ ਕੀਤਾ ਤਾਂ) ਹੋਰ ਦਾਹਵਾ ਕਿ ਮੈਂ ਹਿੰਦੂ ਹਾਂ ਜਾਂ ਮੁਸਲਮਾਨ ਹਾਂ ਸਭ ਫੋਕਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫਕੜੁ = ਫੋਕਟ, ਫੋਕਾ ਦਾਹਵਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el resto, hindúes o musulmanes, hacen todo su teatro en vano,"