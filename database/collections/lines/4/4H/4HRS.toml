[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰਾ ਸੋ ਦਿਨੁ; ਨੇੜੈ ਆਇਆ ॥੧॥ ਰਹਾਉ ॥"
page = 403
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thy that day of death is drawing nigh. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਉਹ ਮੌਤ ਦਾ ਦਿਹਾੜਾ ਤੇਰੇ ਨਜ਼ਦੀਕ ਢੁਕ ਰਿਹਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your day is drawing near. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਮਰਨੇ ਕਾ ਦਿਨ ਜੋ ਹੈ, ਸੋ ਸਮੀਪ ਆਯਾ ਹੂਆ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਉਹ ਦਿਨ ਨੇੜੇ ਆ ਰਿਹਾ ਹੈ (ਜਦੋਂ ਤੂੰ ਇਥੋਂ ਕੂਚ ਕਰ ਜਾਣਾ ਹੈ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "puesto que el día de la Verdad se acerca. (1-Pausa)"