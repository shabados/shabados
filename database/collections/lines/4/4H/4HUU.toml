[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਨ ਪੂਰਿ ਰਹਿਆ. ਪ੍ਰਭ ਏਕੁ ॥"
page = 892
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Perfect, Unique Lord is filling all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਾ, ਅਦੁੱਤੀ ਸੁਆਮੀ ਸਾਰਿਆਂ ਨੂੰ ਪੂਰਨ ਕਰ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One God is perfect, and all-pervading."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਪ੍ਰਭ ਸਭ ਮੇਂ ਪੂਰਨ ਹੋਇਕੈ ਬਿਆਪ ਰਹਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਕ ਪਰਮਾਤਮਾ ਹੀ ਪੂਰਨ ਤੌਰ ਤੇ ਸਭ ਵਿਚ ਮੌਜੂਦ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰਨ = ਪੂਰੇ ਤੌਰ ਤੇ। ਪੂਰਿ ਰਹਿਆ = ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues el Señor Perfecto atiende todo y por todas partes."