[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਯਾ ਕੇ ਭੀਤਰ ਭੇਦ; ਨੈਕ ਨਹੀ ਮਾਨੀਐ ॥੧੦੭੯॥"
page = 786

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Sindhurni”, add the word “Shatru” at the end and know all the names of Tupak without any discrimination.1079."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਵਿਚ ਕਿਸੇ ਪ੍ਰਕਾਰ ਦਾ ਕੋਈ ਭੇਦ ਨਾ ਸਮਝੋ ॥੧੦੭੯॥"