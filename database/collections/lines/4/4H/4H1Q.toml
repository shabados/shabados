[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਿਲੈ ਨਿਮਾਣੈ ਮਾਣੁ, ਆਪੁ ਗਵਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "It is a mystery how a humble eschewing ego acquires honour in life."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਨੇ) ਆਪਣਾ ਆਪ ਗੁਆ ਦਿਤਾ ਹੈ (ਉਸ) ਨਿਮਾਣੇ ਨੂੰ (ਦਰਗਾਹ ਵਿਚ) ਮਾਣ ਮਿਲਦਾ ਹੈ।"