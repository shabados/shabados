[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਇ ਤੇਰੈ; ਸਭਿ ਸੁਖ ਵਸਹਿ ਮਨਿ ਆਇ ॥"
page = 1327
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through Thy Name, all the comforts come to abide in the man's mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਨਾਮ ਰਾਹੀਂ ਸਾਰੇ ਆਰਾਮ ਆ ਕੇ ਮਨੁਸ਼ ਦੇ ਮਨ ਵਿੱਚ ਟਿਕ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through Your Name, all peace and comfort comes to abide in the mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਨਾਮ ਤੇ ਹੀ ਸਰਬ ਸੁਖ ਮਨ ਮੇਂ ਆਇ ਬਸਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਨਾਮ ਵਿਚ ਜੁੜਿਆਂ ਸਾਰੇ ਸੁਖ ਮਨ ਵਿਚ ਆ ਵੱਸਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con Tu Nombre, toda Paz y Comodidad llega a habitar en la mente."