[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਟ ਘਟ ਅੰਤਰਿ ਸਰਬ ਨਿਰੰਤਰਿ; ਰਵਿ ਰਹਿਆ ਸਚੁ ਵੇਸੋ ॥੨॥"
page = 1126
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God, the Embodiment of Truth is pervading within every heart and amidst all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚ ਸਰੂਪ ਵਾਹਿਗੁਰੂ ਹਰ ਦਿਲ ਵਿੱਚ ਅਤੇ ਸਾਰਿਆਂ ਅੰਦਰ ਰਮ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Deep within each and every heart, and amidst all, the Embodiment of Truth is permeating and pervading. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ (ਸਚੁ ਵੇਸੋ) ਸਚੁ ਸ੍ਵਰੂਪ ਪਰਮੇਸਰ ਹੈ, ਸੋ ਸਰਬ ਘਟੋਂ ਕੇ ਅੰਤਰਿ (ਨਿਰੰਤਰਿ) ਏਕ ਰਸ ਬ੍ਯਾਪਕ ਹੋ ਰਹਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦਾਸ ਨੂੰ ਪਰਮਾਤਮਾ) ਅੰਦਰ ਬਾਹਰ ਹਰ ਥਾਂ ਵਿਆਪਕ ਦਿੱਸਦਾ ਹੈ, ਉਸ ਪ੍ਰਭੂ ਉਤੇ ਮਾਇਆ ਦਾ ਪ੍ਰਭਾਵ ਨਹੀਂ ਪੈ ਸਕਦਾ। (ਉਸ ਸੇਵਕ ਨੂੰ) ਉਹ ਸਦਾ-ਥਿਰ-ਸਰੂਪ ਪ੍ਰਭੂ ਹਰੇਕ ਸਰੀਰ ਵਿਚ ਇੱਕ-ਰਸ ਸਭ ਜੀਵਾਂ ਦੇ ਅੰਦਰ ਮੌਜੂਦ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਟ = ਸਰੀਰ, ਹਿਰਦਾ। ਸਰਬ ਨਿਰੰਤਰਿ = ਇਕ-ਰਸ ਸਭ ਵਿਚ। ਸਚੁ ਵੇਸੋ = ਜਿਸ ਦਾ ਸਰੂਪ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí Él habita en todos los corazones y prevalece como Verdad. (2)"