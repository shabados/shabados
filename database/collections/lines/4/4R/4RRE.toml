[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਹ ਤਹ ਹੋਤ ਸਭੈ ਨਿਹਕਰਮਾ ॥੨੦੭॥"
page = 652

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Wherever Dutt, the sage performing good actions went, all those who resided there, achieved passivity.207."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਉਥੇ ਸਾਰੇ ਨਿਸ਼ਕਰਮ (ਕਰਮਾਂ ਦੇ ਬੰਧਨ ਤੋਂ ਮੁਕਤ) ਹੋ ਗਏ ॥੨੦੭॥"