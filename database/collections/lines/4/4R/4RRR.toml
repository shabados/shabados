[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਤੇ; ਬਿਰਥਾ ਕੋਈ ਨਾਹਿ ॥"
page = 282
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "none returns empty-handed from Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਪਾਸੋਂ, ਕੋਈ ਜਣਾ, ਖਾਲੀ-ਹੱਥੀ ਨਹੀਂ ਮੁੜਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "no one is turned away from Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸੇ ਬਿਰਥਾ ਅਰਥਾਤ ਖਾਲੀ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ (ਦੇ ਦਰ) ਤੋਂ ਕੋਈ ਜੀਵ ਨਾ-ਉਮੈਦ ਨਹੀਂ (ਆਉਂਦਾ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਰਥਾ = ਖ਼ਾਲੀ, ਨਾ-ਉਮੈਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y no existe nadie donde Él no habite."