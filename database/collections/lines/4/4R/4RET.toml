[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮੇ ਖ਼ੂਨ ਮਾਹੀ ਲਕੋ ਤੇਗ਼ ਮਾਹ ॥੧੧੧॥"
page = 1405

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Their action flew blood to the highest skies.(111)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਨ੍ਹਾਂ ਦੀਆਂ) ਲਹੂ ਦੀਆਂ ਬੂੰਦਾਂ ਮੱਛਲੀਆਂ ਤਕ ਅਤੇ ਤਲਵਾਰਾਂ ਦੀਆਂ ਚਮਕਾਂ ਚੰਦ੍ਰਮਾ ਤਕ ਪਹੁੰਚ ਗਈਆਂ ॥੧੧੧॥"