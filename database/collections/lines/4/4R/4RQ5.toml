[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਕਬੀਰ; ਸੁਨਹੁ ਨਰ ਭਾਈ ॥"
page = 324
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir, hear O men, my brethren,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ, ਸੁਣੋ ਹੇ ਮੇਰੇ ਇਨਸਾਨ ਭਰਾਓ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, listen, O men, O Siblings of Destiny:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਭਾਈ ਪੁਰਸ਼ੋ ਸੁਨੋ! ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ- ਹੇ ਭਰਾਵੋ! ਸੁਣੋ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਰ ਭਾਈ = ਹੇ ਭਰਾਵੋ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir,"