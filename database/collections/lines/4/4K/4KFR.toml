[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਡਭਾਗੀ; ਹਰਿ ਸੰਤੁ ਮਿਲਾਇਆ ॥"
page = 95
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God has introduced me to His saint."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਚੰਗੇ ਨਸੀਬਾਂ ਰਾਹੀਂ, ਵਾਹਿਗੁਰੂ ਨੇ ਮੈਨੂੰ ਆਪਣੇ ਸਾਧੂ ਨਾਲ ਮਿਲਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By great good fortune, the Lord has led me to meet His Saint."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ ਸੰਤ ਜਨੋਂ! ਵੱਡੇ ਪੁੰਨੋਂ ਵਾਲੇ ਕੋ ਹਰੀ ਨੇ ਸੰਤ ਰੂਪ ਗੁਰੂ ਕਾ ਮੇਲੁ ਕਰਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਵੱਡੇ ਭਾਗਾਂ ਨਾਲ ਪਰਮਾਤਮਾ ਨੇ ਮੈਨੂੰ ਗੁਰੂ ਮਿਲਾ ਦਿੱਤਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤੁ = ਗੁਰੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por suerte encontré a los Santos del Señor;"