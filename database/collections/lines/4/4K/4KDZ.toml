[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮੋ ਤਾਰਣੀ ਕਾਰਣੀਯੰ ਅਪਾਰਾ ॥"
page = 118

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art the deliverer of all, I salute Thee."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸਭ ਨੂੰ) ਤਾਰਨ ਵਾਲੀ ਅਤੇ ਅਪਾਰ ਕਾਰਨ ਰੂਪ ਵਾਲੀ ਨੂੰ ਨਮਸਕਾਰ ਹੈ;"