[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਤਿ ਜਪਹਿ ਤੇਰੇ ਦਾਸ; ਪੁਰਖ ਅਤੋਲਈ ਜੀਉ ॥"
page = 691
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thine slaves, ever think of Thee, O my unweighable Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਗੋਲੇ ਸਦਾ ਤੈਨੂੰ ਯਾਦ ਕਰਦੇ ਹਨ, ਹੇ ਮੇਰੇ ਅਜੋਖੇ ਮਾਲਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my Incomputable Lord, Your humble servants ever meditate on You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਤੋਲ ਪੁਰਖ ਜੀ! ਸੰਪੂਰਨ ਤੇਰੇ ਦਾਸ ਨਿਤੰਪ੍ਰਤੀ ਤੁਝ ਕੋ ਹੀ ਜਪਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਹ ਤੋਲੇ ਜਾ ਸਕਣ ਵਾਲੇ ਸਰਬ-ਵਿਆਪਕ ਪ੍ਰਭੂ! ਤੇਰੇ ਦਾਸ ਸਦਾ ਤੇਰਾ ਨਾਮ ਜਪਦੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਤਿ = ਸਦਾ। ਜਪਹਿ = ਜਪਦੇ ਹਨ। ਪੁਰਖ = ਹੇ ਸਰਬ-ਵਿਆਪਕ! ਅਤੋਲਈ = ਜੋ ਤੋਲਿਆ ਨਾਹ ਜਾ ਸਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, Tus Sirvientes viven sólo en Ti;"