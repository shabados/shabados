[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਨ ਕਮਲ ਰਿਦੈ ਧਾਰਿ ॥"
page = 1304
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Enshrining the Lord's lotus feet in my mind,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਦੇ ਕੰਵਲ ਪੈਰ ਆਪਣੇ ਹਿਰਦੇ ਅੰਦਰ ਟਿਕਾਉਣ ਦੁਆਰਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Enshrining His Lotus Feet within my heart,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਚਰਨ ਕਮਲ ਹਿਰਦੇ ਮੇਂ ਧਾਰਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਸੋਹਣੇ ਚਰਨ ਹਿਰਦੇ ਵਿਚ ਵਸਾ ਕੇ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਿਦੈ = ਹਿਰਦੇ ਵਿਚ। ਧਾਰਿ = ਧਾਰ ਕੇ, ਟਿਕਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Enalteciendo Sus Pies de Loto en mi corazón,"