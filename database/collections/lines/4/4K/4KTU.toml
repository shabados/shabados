[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਸਿਉ ਪ੍ਰੀਤਿ; ਨ ਕਰੈ. ਗਵਾਰੁ ॥੩॥"
page = 893
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O ignorant man, thou contractest not love with Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੇਵਕੂਫ ਬੰਦੇ! ਤੂੰ ਉਸ ਨਾਲ ਪਿਆਰ ਨਹੀਂ ਪਾਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But you do not love Him, you fool! ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗਵਾਰ! ਤੂੰ ਤਿਸ ਸਾਥ ਪ੍ਰੀਤੀ ਨਹੀਂ ਕਰਤਾ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨਾਲ ਇਹ ਮੂਰਖ ਸਾਕਤ ਕਦੇ ਪਿਆਰ ਨਹੀਂ ਪਾਂਦਾ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸੁ ਸਿਉ = ਉਸ ਨਾਲ। ਗਵਾਰੁ = ਮੂਰਖ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero aún así no lo Amas, oh tonto.(3)"