[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੂਰਤਿ ਦੇਖਿ; ਨ ਭੂਲੁ ਗਵਾਰਾ ॥"
page = 1077
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Seeing the form, be thou not misled O fool."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਰੂਪ ਨੂੰ ਵੇਖ ਕੇ, ਤੂੰ ਗਲਤ ਰਾਹੀਂ ਨਾਂ ਪਓ ਹੇ ਮੂਰਖ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Do not be fooled by appearances, you fool."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗਵਾਰ ਪੁਰਸ! ਤੂੰ ਦੇਖ ਕੇ ਨਾ ਭੁਲ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ! (ਜਗਤ ਦੇ ਪਦਾਰਥਾਂ ਦੀ) ਸ਼ਕਲ ਵੇਖ ਕੇ ਗ਼ਲਤੀ ਨਾਹ ਖਾਹ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੂਰਤਿ = ਸ਼ਕਲ। ਦੇਖਿ = ਵੇਖ ਕੇ। ਗਵਾਰਾ = ਹੇ ਮੂਰਖ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, tonto, no te dejes engañar por las formas,"