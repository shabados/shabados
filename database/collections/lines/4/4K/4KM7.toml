[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਇਹ ਕੋ ਬਲੁ ਆਇ ਕਹਿਯੋ; ਗਰਗੈ ਹਮ ਸੋ ਸੋਊ ਬਾਤ ਸਹੀ ਹੈ ॥"
page = 333

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“The description, that you have given about the might of Krishna, is quite correct"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਗਰਗ (ਮੁਨੀ) ਨੇ ਆ ਕੇ ਇਸ ਦੇ ਬਲ ਬਾਰੇ ਸਾਨੂੰ ਕਿਹਾ ਸੀ, ਉਸ ਦੀ ਗੱਲ ਸਹੀ ਹੈ।"