[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਭੁਲਿ ਅਭੁਲਿ ਅਮੁਲੁ ਦੇ; ਮੋਤੀ ਦਾਨ ਨ ਪਛੋਤਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Knowing well or unknowingly it bestows a free gift and never repents."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਭੁੱਲਕੇ ਜਾਂ ਨਾ ਭੁਲ ਕੇ ਮੋਤੀ ਦਾ ਦਾਨ ਕਰ ਕੇ (ਸਿੱਪੀ) ਕਦੇ ਬੀ ਨਹੀਂ ਪੱਛੋਤਾਉਂਦੀ।"