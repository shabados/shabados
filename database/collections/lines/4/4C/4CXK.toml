[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੁਈ ਮੇਰੀ ਮਾਈ; ਹਉ ਖਰਾ ਸੁਖਾਲਾ ॥"
page = 476
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Dead is mammon, my mother, and I am very happy."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਮੇਰੀ ਮਾਤਾ, ਮਰ ਗਈ ਹੈ ਅਤੇ ਮੈਂ ਬੜਾ ਹੀ ਸੋਖਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Maya is dead, O mother, and I am very happy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ (ਮਾਈ) ਮਮਤਾ ਜਬ ਸੇ ਮਰ ਗਈ ਹੈ ਤਬ ਸੇ ਮੈਂ (ਖਰਾ) ਬਹੁਤ (ਸੁਖਾਲਾ) ਸੁਖੀ ਹੂਆ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਉੱਤੋਂ ਮਾਇਆ ਦਾ ਪ੍ਰਭਾਵ ਮਿਟ ਗਿਆ ਹੈ, ਹੁਣ ਮੈਂ ਬੜਾ ਸੌਖਾ ਹੋ ਗਿਆ ਹਾਂ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਈ = ਮਾਂ, ਮਾਇਆ। ਮੁਈ.....ਮਾਈ = ਮੇਰੀ ਮਾਂ ਮਰ ਗਈ ਹੈ, ਮਾਇਆ ਦਾ ਦਬਾਉ ਮੇਰੇ ਉੱਤੋਂ ਹਟ ਗਿਆ ਹੈ। ਹਉ = ਮੈਂ। ਖਰਾ = ਬਹੁਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Maya, que me ha alimentado hasta aquí, ahora está muerta y yo estoy en Paz."