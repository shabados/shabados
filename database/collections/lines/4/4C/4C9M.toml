[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹਰਿ ਜਨ ਦੁਖੀ, ਸੁਖੀ ਸੁ ਸਿਵ; ਰਹੈ, ਸੁ ਕਹੁ ਮੁਹਿ ਗਾਥ ॥੨੪੫੩॥"
page = 546

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Shiva himself may remain in comfort, kindly enlighten me on this episode.”2453."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "'ਹਰਿਜਨ' (ਇਸ ਸੰਸਾਰ ਵਿਚ) ਦੁਖੀ ਰਹਿੰਦੇ ਹਨ ਅਤੇ ਸ਼ਿਵ (ਭਗਤ) ਸੁਖੀ ਰਹਿੰਦੇ ਹਨ, ਮੈਨੂੰ ਇਹ ਗਾਥਾ ਦਸੋ ॥੨੪੫੩॥"