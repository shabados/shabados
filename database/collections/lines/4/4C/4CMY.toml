[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖਾਣੀ ਬਾਣੀ ਸਰਬ ਨਿਵਾਸੀ; ਸਭਨਾ ਕੈ ਮਨਿ ਭਾਵਣਿਆ ॥੩॥"
page = 130
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the beings of four sources of creation and their speech, Thou art. The All-pervading Lord I pleasing to the hearts of all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਤਪਤੀ ਦੇ ਚਾਰੇ ਸੋਮਿਆਂ ਦੇ ਜੀਵਾਂ ਤੇ ਉਨ੍ਹਾਂ ਦੀਆਂ ਬੋਲੀਆਂ ਵਿੱਚ ਤੂੰ ਹੈ। ਸਾਰਿਆਂ ਵਿੱਚ ਵਿਆਪਕ ਸਾਈਂ ਸਭਨਾਂ ਦੇ ਦਿਲਾਂ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the four sources of creation, and in all speech, You dwell. You are dear to the minds of all. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚਾਰੋ ਖਾਣੀ ਚਾਰੋ ਬਾਣੀ ਸਰਬ ਮੇਂ ਤੂੰ ਨਿਵਾਸ ਕਰ ਰਹਾ ਹੈਂ ਔਰ ਸਭ ਕੇ ਮਨ ਕੋ ਭਾਵਤਾ ਹੈਂ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਚੌਹਾਂ ਖਾਣੀਆਂ ਵਿਚ ਜੰਮੇ ਹੋਏ ਤੇ ਭਾਂਤ ਭਾਂਤ ਦੀਆਂ ਬੋਲੀਆਂ ਬੋਲਣ ਵਾਲੇ ਸਭ ਜੀਵਾਂ ਦੇ ਅੰਦਰ ਤੂੰ ਵੱਸ ਰਿਹਾ ਹੈਂ, ਤੂੰ ਸਭ ਜੀਵਾਂ ਦੇ ਮਨ ਵਿਚ ਪਿਆਰਾ ਲੱਗਦਾ ਹੈਂ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En las cuatro fuentes de la creación, en el hablar, estás Tú, el Todo Prevaleciente Señor, Bienamado de todos.(3)"