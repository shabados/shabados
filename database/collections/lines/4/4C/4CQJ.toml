[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਕੀ ਘਾਲ; ਅਜਾਂਈ ਜਾਇ ॥੧॥"
page = 1160
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "vain goes his labour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਅਰਥ ਜਾਂਦੀ ਹੈ ਉਸ ਦੀ ਟਹਿਲ ਸੇਵਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- their work is wasted in vain. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੀ (ਘਾਲ) ਮਿਹਨਤ ਕੀ ਹੂਈ (ਅਜਾਂਈ) ਬ੍ਯਰਥ ਜਾਤੀ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਦੀ ਮਿਹਨਤ ਅਜਾਈਂ ਚਲੀ ਜਾਂਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਾਲ = ਮਿਹਨਤ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ese esfuerzo por encontrar la Divinidad de la Vida, no le sirve para nada. (1)"