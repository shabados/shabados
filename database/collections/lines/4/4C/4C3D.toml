type = "primary"
data = "ਸ਼ੁਕਰ ਕਰਦ ਯਜ਼ਦਾਨ ਆਜ਼ਮ ਅਮੀਕ ॥੨੬॥"
page = 1411

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They thought, ‘God has endowed us with a son.’(26)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਬੇਅੰਤ ਅਤੇ ਅਥਾਹ ਪਰਮਾਤਮਾ ਦਾ ਸ਼ੁਕਰ ਕੀਤਾ ॥੨੬॥"