[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਨ੍ਰਹ ਕੋ ਅੰਤਿ ਭਜਾਇ ਰਹਿਯੋ; ਮਥਰਾ ਕੇ ਬਿਖੈ ਰਹਨੇ ਹੂ ਨ ਪਾਯੋ ॥"
page = 531

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“And he had ultimately caused you to run away from Matura"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਅੰਤ ਵਿਚ ਕ੍ਰਿਸ਼ਨ ਨੂੰ ਭਜਾ ਕੇ ਰਿਹਾ ਹਾਂ। ਉਹ ਮਥੁਰਾ ਵਿਚ ਰਹਿ ਹੀ ਨਹੀਂ ਸਕਿਆ ਹੈ।"