[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਈ; ਗੁਰ ਬਿਨੁ. ਗਿਆਨੁ ਨ ਪਾਈਐ ॥"
page = 532
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my mother, without the Guru, Divine knowledge is not obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਮਾਤਾ! ਗੁਰੂ ਦੇ ਬਾਝੋਂ ਬ੍ਰਹਿਮ-ਬੋਧ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mother, without the Guru, spiritual wisdom is not obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰੋਂ ਸੇ ਬਿਨਾਂ ਗਿਆਨ ਨਹੀਂ ਪ੍ਰਾਪਤ ਹੋਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੀ) ਮਾਂ! ਗੁਰੂ (ਦੀ ਸਰਨ ਪੈਣ) ਤੋਂ ਬਿਨਾ ਪਰਮਾਤਮਾ ਨਾਲ ਡੂੰਘੀ ਸਾਂਝ ਨਹੀਂ ਪੈ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਈ = ਹੇ ਮਾਂ! ਗਿਆਨੁ = ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੂਝ, ਪਰਮਾਤਮਾ ਨਾਲ ਡੂੰਘੀ ਸਾਂਝ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh madre, sin el Guru uno no se vuelve sabio; por más vueltas que uno dé,"