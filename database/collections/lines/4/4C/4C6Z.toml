[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਈ; ਨ ਮੇਟਣ ਕੋ ਸਮਰਥੁ ॥"
page = 931
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "No one is potent to undo the influence of mammon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦਾ ਅਸਰ ਜ਼ਾਇਲ ਕਰਨ ਨੂੰ ਕੋਈ ਭੀ ਬਲਵਾਨ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one has the power to erase Maya's influence."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੌਤ ਆਈ ਕੋ ਕੋਈ ਮੇਟਨੇ ਕੌ ਸਮਰਥ ਨਹੀਂ; ਵਾ (ਆਈ) ਮਾਯਾ ਕੇ ਦੂਰ ਕਰਨੇ ਕੋ ਕੋਈ ਸਮਰਥ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮਾਇਆ ਦੀ ਤ੍ਰਿਸ਼ਨਾ ਨੂੰ ਮਿਟਾਣ-ਜੋਗਾ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਈ = ਮਾਇਆ, ਮਾਇਆ ਦੀ ਤ੍ਰਿਸ਼ਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nadie es tan poderoso como para poder detener el paso de Maya."