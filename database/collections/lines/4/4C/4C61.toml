[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਰਾਮ ਰਾਮ; ਰਮੇ ਰਮਿ ਰਹੀਐ ॥"
page = 481
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remain thou completely absorbed in the Lord God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦੇ ਨਾਮ ਵਿੱਚ ਪੂਰੀ ਤਰ੍ਹਾਂ ਲੀਨ ਹੋਇਆ ਰਹੁ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remain absorbed in the Lord's Name, Raam, Raam, Raam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮਨ ਬਾਣੀ ਕਰ ਕੇ ਰਾਮ ਰਾਮ ਜਪਤੇ ਰਹੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਆਪ ਹੀ) ਸਦਾ ਪਰਮਾਤਮਾ ਦਾ ਸਿਮਰਨ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਮੇ ਰਮਿ ਰਹੀਐ = ਸਦਾ ਸਿਮਰਦੇ ਰਹੀਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Recita el Nombre de Ram e inmérgete en Él,"