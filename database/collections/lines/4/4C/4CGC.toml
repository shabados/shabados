[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਰਿ ਅਨੇਕ ਜੀਤੇ ਜਿਨ ਜਲਿ ਥਲਿ ॥"
page = 195

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The might of demos, the sons of Diti, increased very much and they conquered many enemies in water and on land."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੇ ਅਨੇਕਾਂ ਵੈਰੀ ਜਲ-ਥਲ ਵਿੱਚ ਜਿੱਤ ਲਏ।"