[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਧੇ, ਖਾਵਹਿ ਬਿਸੂ ਕੇ ਗਟਾਕ ॥"
page = 1224
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O blind man, thou eat lump-sums of poison."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਅੰਨ੍ਹੇ ਇਨਸਾਨ! ਤੂੰ ਜ਼ਹਿਰ ਦੇ ਗੱਫੇ ਖਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is so blind! He is eating loads of poison."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ (ਅੰਧੇ) ਅਗਿਆਨੀ ਜੀਵ! ਬਿਸ ਕੋ ਖਾਵਤਾ ਹੈਂ (ਗਟਾਕ) ਗਫੇ ਲਾਇ ਕਰ, ਭਾਵ ਬਿਸ਼੍ਯੋਂ ਕੋ ਨਿਰਭੈ ਹੋ ਕਰ ਭੋਗਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ) ਅੰਨ੍ਹੇ ਹੋ ਚੁਕੇ ਮਨੁੱਖ ਆਤਮਕ ਮੌਤ ਲਿਆਉਣ ਵਾਲੇ ਪਦਾਰਥ ਹੀ ਖ਼ੁਸ਼ ਹੋ ਹੋ ਕੇ ਖਾਂਦੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਧੇ = (ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ) ਅੰਨ੍ਹੇ ਹੋ ਚੁਕੇ ਮਨੁੱਖ। ਖਾਵਹਿ = ਖਾਂਦੇ ਰਹਿੰਦੇ ਹਨ। ਬਿਸੂ = ਆਤਮਕ ਮੌਤ ਲਿਆਉਣ ਵਾਲੀ ਜ਼ਹਰ। ਗਟਾਕ = ਗੱਫੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El ciego ignorante se regocija lamiendo el veneno de Maya, y después su mirada,"