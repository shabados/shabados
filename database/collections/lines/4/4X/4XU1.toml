[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੀ ਸੋਭਾ; ਘਟਿ ਘਟਿ ਬਨੀ ॥੨॥"
page = 182
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His glory is manifest in every heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਸ਼ਾਨ ਸ਼ੌਕਤ ਹਰ ਦਿਲ ਅੰਦਰ ਪ੍ਰਗਟ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His Glory is manifest in each and every heart. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਿਸ ਕੀ ਸੋਭਾ ਘਟ ਘਟ ਮੇਂ ਬਨ ਰਹੀ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰਮਾਤਮਾ ਦੀ ਸੁੰਦਰਤਾ ਹਰੇਕ ਸਰੀਰ ਵਿਚ ਫਬਣ ਵਿਖਾ ਰਹੀ ਹੈ, (ਉਸਦਾ ਨਾਮ ਸਦਾ ਸਿਮਰ) ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਟਿ ਘਟਿ = ਹਰੇਕ ਘਟ ਵਿਚ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél, Cuya Gloria es revelada en cada corazón.(2)"