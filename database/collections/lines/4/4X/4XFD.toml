[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੋ ਤੁਮ ਸ︀ਯਾਮ ਸੁਨੋ ਛਲ ਸੋ ਰਨ ਮੈ ਦਸ ਹੂੰ ਨ੍ਰਿਪ ਮਾਰਿ ਗਿਰਾਏ ॥"
page = 415

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They said, “O Krishna! you have killed the ten kings with deceit"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਰਾਜਿਆਂ ਨੇ ਕਿਹਾ) ਹੇ ਕ੍ਰਿਸ਼ਨ! ਸੁਣ, ਤੂੰ ਛਲ ਕਰ ਕੇ ਦਸਾਂ ਰਾਜਿਆਂ ਨੂੰ ਰਣ ਵਿਚ ਮਾਰ ਗਿਰਾਇਆ ਹੈ।"