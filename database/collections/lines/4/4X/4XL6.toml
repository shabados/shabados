[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਉ ਪ੍ਰਾਣ ਜਿਨਿ ਰਚਿਓ ਸਰੀਰ ॥"
page = 1137
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The one who has created man's body and life,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਇਨਸਾਨ ਦੀ ਜਿੰਦ ਜਾਨ ਅਤੇ ਦੇਹ ਸਾਜੇ ਹਨ ਅਤੇ ਜਿਸ ਨੇ ਉਸ ਨੂੰ ਪੈਦਾ ਕੀਤਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He created the soul, the breath of life and the body."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰਮੇਸ੍ਵਰ ਨੇ ਸਰੀਰ ਕੋ ਰਚ ਕਰ ਕੇ ਜੀਵੋਂ ਕੋ ਪ੍ਰਾਣ ਦੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਪਰਮਾਤਮਾ) ਨੇ ਜਿੰਦ ਪ੍ਰਾਣ (ਦੇ ਕੇ ਜੀਵਾਂ ਦੇ) ਸਰੀਰ ਰਚੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਉ = ਜਿੰਦ। ਜਿਨਿ = ਜਿਸ (ਪਰਮਾਤਮਾ) ਨੇ। ਰਚਿਓ = ਬਣਾਇਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, Quien ha creado nuestro cuerpo,"