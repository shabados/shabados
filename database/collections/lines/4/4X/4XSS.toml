[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਿਪੁ ਕੋ ਹਰਿ ਮਾਰਿ ਗਏ ਜਬ ਹੀ; ਅਕ੍ਰੂਰ ਕਿਧੌ ਚਲ ਕੈ ਤਹਿ ਆਯੋ ॥"
page = 374

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When, after killing the enemy, Krishna was about to go, Akrur arrived there"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵੈਰੀ ਨੂੰ ਮਾਰ ਕੇ ਜਦੋਂ ਹੀ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ (ਘਰ) ਗਏ ਤਾਂ ਅਕਰੂਰ ਕਿਧਰੋਂ ਚਲ ਕੇ ਉਥੇ ਆ ਗਿਆ।"