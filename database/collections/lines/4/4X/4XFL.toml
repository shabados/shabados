[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰਾ ਪ੍ਰਭੁ ਨਿਰਮਲੁ; ਅਗਮ ਅਪਾਰਾ ॥"
page = 110
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Lord is immaculate, inaccessible and infinite."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਸੁਆਮੀ ਪਵਿੱਤ੍ਰ, ਪਹੁੰਚ ਤੋਂ ਪਰੇ ਅਤੇ ਅਨੰਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My God is Immaculate, Inaccessible and Infinite."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਪ੍ਰਭੂ ਨਿਰਮਲ ਹੈ ਪੁਨਾ (ਅਗਮ) ਮਨ ਬਾਣੀ ਕਾ ਅਵਿਸ੍ਯ ਅਰੁ ਬੇਅੰਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਿਆਰਾ ਪ੍ਰਭੂ ਆਪ ਪਵਿਤ੍ਰ-ਸਰੂਪ ਹੈ ਅਪਹੁੰਚ ਹੈ ਤੇ ਬੇਅੰਤ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਮਲੁ = ਵਿਕਾਰਾਂ ਦੀ ਮੈਲ ਤੋਂ ਰਹਿਤ। ਅਗਮ = ਅਪਹੁੰਚ। ਅਪਾਰਾ = ਜਿਸ ਦੇ ਗੁਣਾਂ ਦਾ ਪਾਰਲਾ ਬੰਨਾ ਨਾਹ ਲੱਭ ਸਕੇ, ਬੇਅੰਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Dios es Inmaculado, Incognoscible e Infinito;"