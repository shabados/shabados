[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਸੁ ਊਪਰਿ ਹੈ ਮਾਰਗੁ ਮੇਰਾ ॥"
page = 794
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "On that lies my path."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉੇਸ ਦੇ ਉਪਰ ਹੈ ਮੇਰਾ ਰਸਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That is where my path lies."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਸ ਉਪਰ ਮੇਰਾ ਮਾਰਗੁ ਹੈ, ਭਾਵ ਉਸ ਰਸਤੇ ਅਸਮਦਾਦਿ ਜੀਵੋਂ ਕਾ ਚਲਨਾ ਹੋਵੈਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਦੇ ਉਤੋਂ ਦੀ ਅਸਾਂ ਲੰਘਣਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tengo que caminar en este sendero solo."