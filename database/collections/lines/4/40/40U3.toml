[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਧੰਨੁ ਸਵਾਰਣਹਾਰਾ ॥੮॥੨॥"
page = 412
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, blessed is Lord, the Embellisher of the mortal."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਮੁਬਾਰਕ ਹੈ, ਪ੍ਰਾਣੀ ਨੂੰ ਸਸ਼ੋਭਤ ਕਰਨ ਵਾਲਾ ਸੁਆਮੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, blessed is the Lord, the Embellisher. ||8||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਐਸੇ ਗੁਰਮੁਖ ਦਾ ਸਵਾਰਨਹਾਰਾ ਗੁਰੂ ਧੰਨ ਹੈ॥੮॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਮਨੁੱਖ ਦਾ ਮਨੁੱਖਾ ਜਨਮ ਮੁਬਾਰਿਕ ਹੈ ਉਹ ਹੋਰਨਾਂ ਦਾ ਜੀਵਨ ਭੀ ਸੋਹਣਾ ਬਣਾ ਦੇਂਦਾ ਹੈ ॥੮॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, Bendito, Bendito es el Señor, Quien lo adorna con la Virtud. (8‑2)"