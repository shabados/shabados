[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲੈ ਕਰਿ ਬਿਯਾਲ ਸੋ ਬਿਯਾਲ ਬਜਾਵਤ; ਸੋ ਉਪਮਾ ਕਵਿ ਯੌ ਮਨਿ ਧਾਰੇ ॥"
page = 89

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The elephants are bumped against the elephants and the poet imagines it like this,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਭੂਤ-ਗਣ) ਹੱਥ ਵਿਚ ਹਾਥੀ ਨੂੰ ਲੈ ਕੇ (ਦੂਜੇ) ਹਾਥੀ ਨਾਲ ਟਕਰਾਉਂਦੇ ਹਨ, ਉਸ ਦ੍ਰਿਸ਼ ਦੀ ਉਪਮਾ ਕਵੀ ਦੇ ਮਨ ਵਿਚ ਇਸ ਪ੍ਰਕਾਰ ਆਈ ਹੈ,"