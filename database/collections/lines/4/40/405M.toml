[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੇਵਕੜੈ; ਧਨ ਖਰੀ ਇਆਣੀ ॥"
page = 357
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In my father's house (this world), I the bride, remained very childish,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਜਹਾਨ ਅੰਦਰ (ਪੇਕੇ ਵਿੱਚ), ਮੈਂ ਪਤਨੀ ਬਹੁਤ ਬੇਸਮਝ ਰਹੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In this world of my father's house, I, the soul-bride, have been very childish;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਧਨ (ਪੇਵਕੜੈ) ਪਿਤਾ ਕੇ ਘਰ ਮੇਂ ਅਰਥਾਤ ਇਸ ਲੋਕ ਮੇਂ ਬਡੀ ਮੂਰਖਤਾ ਸੇ ਭਰੀ ਰਹੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਜਗਤ ਦੇ ਮੋਹ ਵਿਚ ਫਸ ਕੇ ਜੀਵ-ਇਸਤ੍ਰੀ ਬਹੁਤ ਮੂਰਖ ਰਹਿੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੇਵਕੜੈ = ਪੇਕੇ ਘਰ ਵਿਚ, ਜਗਤ ਦੇ ਮੋਹ ਵਿਚ। ਧਨ = ਇਸਤ੍ਰੀ, ਜੀਵ-ਇਸਤ੍ਰੀ। ਖਰੀ = ਬਹੁਤ। ਇਆਣੀ = ਅੰਞਾਣ, ਮੂਰਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Yo, la Esposa del Señor, permanecí ignorante en la casa de mis padres,"