[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਜੋ ਪ੍ਰਭ ਸਰਣਾਈ ॥"
page = 388
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, he who is under the Lord's protection,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ ਜਿਹੜਾ ਸੁਆਮੀ ਦੀ ਛਤਰ-ਛਾਇਆ ਹੇਠ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, one who has taken to God's Sanctuary,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜੋ ਪ੍ਰਭੂ ਕੀ ਸਰਣਾਗਤਿ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਜੇਹੜਾ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੀ ਸਰਨ ਪਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕ = ਹੇ ਨਾਨਕ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, quien se entrega al Señor,"