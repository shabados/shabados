[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੋਕ ਭਯੋ ਤਿਨ ਕੇ ਮਨ ਬੀਚ; ਅਸੋਕ ਗਯੋ ਤਿਨ ਹੂੰ ਤੇ ਨਸਾਈ ॥"
page = 376

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Their mind is absorbed in sorrow and their comfort has sped away"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੇ ਮਨ ਵਿਚ ਸੋਗ ਭਰ ਗਿਆ ਹੈ ਅਤੇ ਖੁਸ਼ੀ ਉਨ੍ਹਾਂ ਕੋਲੋਂ ਭਜ ਗਈ ਹੈ।"