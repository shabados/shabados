data = "ਸਕਲ ਤੁਪਕ ਕੇ ਨਾਮ ਬਿਚਾਰਹੁ ॥੯੪੧॥"
page = 773

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Ar-anujananani”, add the words “Jaachar-pati-shatu” at the end, and consider all the names of Tupak.941."

[[content]]
assets = ["RSJD"]
