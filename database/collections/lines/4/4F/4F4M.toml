[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਚੁਲੀਆ ਸੁਚੀਆ; ਜੇ ਭਰਿ ਜਾਣੈ ਕੋਇ ॥"
page = 1240
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, pure is the mouthful of water, if some one fully knows how to gargle it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਪਵਿੱਤਰ ਹੈ ਕਰਲੀ, ਜੇਕਰ ਕੋਈ ਜਣਾ ਪੂਰੀ ਤਰ੍ਹਾਂ ਇਸ ਨੂੰ ਕਰਣੀ ਜਾਣਦਾ ਹੋਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the mouth is truly cleansed by ritual cleansing, if you really know how to do it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਏਹ ਚੁਲੀਆਂ ਸੁਚੀਆਂ ਹੈਂ ਜੇਕਰ ਕੋਈ ਭਰ ਜਾਣੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਨਿਰਾ ਪਾਣੀ ਨਾਲ ਚੁਲੀਆਂ ਕੀਤਿਆਂ ਆਤਮਕ ਜੀਵਨ ਵਿਚ ਸੁੱਚ ਨਹੀਂ ਆ ਸਕਦੀ, ਪਰ) ਜੇ ਕੋਈ ਮਨੁੱਖ (ਸੱਚੀ ਚੁਲੀ) ਭਰਨੀ ਜਾਣ ਲਏ ਤਾਂ ਸੁੱਚੀਆਂ ਚੁਲੀਆਂ ਇਹ ਹਨ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੇ ਕੋਇ = ਜੇ ਕੋਈ ਮਨੁੱਖ। ਭਰਿ ਜਾਣੈ = ਚੁਲੀ ਭਰਨੀ ਜਾਣਦਾ ਹੋਵੇ, ਚੁਲੀ ਭਰਨ ਦੀ ਸਮਝ ਹੋਵੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno no se lava la boca con un buche de agua, sino sólo si uno conoce."