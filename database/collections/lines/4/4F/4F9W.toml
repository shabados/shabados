[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਕੀ ਪੈਜ; ਸਵਾਰੀ ਆਪ ॥"
page = 500
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself has protected the honour of His slave."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ ਖੁਦ ਦੀ ਲਾਜ ਰੱਖੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord Himself has protected the honor of His humble servant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪਨੇ ਦਾਸ ਕੀ ਪ੍ਰਭੂ ਨੇ ਆਪ ਪ੍ਰਤਿਗ੍ਯਾ ਸਵਾਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਆਪਣੇ ਸੇਵਕ ਦੀ ਇੱਜ਼ਤ ਆਪ ਵਧਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੈਜ = ਇੱਜ਼ਤ। ਸਵਾਰੀ = ਕਾਇਮ ਰੱਖੀ, ਵਧਾਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor ha protegido el honor de su Sirviente;"