type = "primary"
data = "ਰਾਵ ਜੂ ਤਾ ਕੌ ਨਚਾਵਤ; ਰਹੈ ਆਠੌ ਜਾਮ ॥"
page = 924

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Whom the Raja had made to dance whole day long."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਜਾ ਉਸ ਨੂੰ ਅੱਠੇ ਪਹਿਰ ਨਚਾਉਂਦਾ ਰਹਿੰਦਾ ਸੀ।"