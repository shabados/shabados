data = "ਰੀਝ ਰਾਇ ਐਸੇ ਕਹ︀ਯੋ ਬਚਨ ਮੰਤ੍ਰਿਯਨ ਸੰਗ ॥"
page = 833

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then he asked the Minster to narrate the Chritars"

