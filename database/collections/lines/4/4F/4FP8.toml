data = "ਰਾਜੇ ਨੇ ਪਸੰਨ ਹੋ ਕੇ ਮੰਤ੍ਰੀਆਂ ਨੂੰ ਇਸ ਤਰ੍ਹਾਂ ਕਿਹਾ"