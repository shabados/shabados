[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਸੌ ਕਿਯਾ ਚਰਿਤ੍ਰ ਤਿਨ; ਸੋ ਤੁਮ ਸੁਨਹੁ ਨ੍ਰਿਪਾਲ ॥੨॥"
page = 829

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Now, my Raja, listen to the cunning acts of her plays.(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਜੋ ਚਰਿਤ੍ਰ ਕੀਤਾ, ਉਸ ਨੂੰ ਹੇ ਰਾਜਨ! ਸੁਣੋ ॥੨॥"