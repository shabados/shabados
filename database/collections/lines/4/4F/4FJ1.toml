[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚ ਸਬਦੁ; ਹਿਰਦੇ ਮਨ ਮਾਹਿ ॥"
page = 1143
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who enshrines the True Name within,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੱਚੇ ਨਾਮ ਨੂੰ ਆਪਣੇ ਰਿਦੇ ਅਤੇ ਦਿਲ ਅੰਦਰ ਵਸਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With the True Word of the Shabad in his heart and mind,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕਾ ਸਚਾ ਉਪਦੇਸੁ ਚੰਦ੍ਰਮਾਵਤ ਪ੍ਰਕਾਸਕ ਮਨ ਕੇ ਹਿਰਦੇ ਵੀਚ ਧਾਰਨ ਕਰਕੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦਾ ਸ਼ਬਦ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਆਪਣੇ ਮਨ ਵਿਚ ਟਿਕਾਈ ਰੱਖਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚ ਸਬਦੁ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando uno eleva la Palabra Verdadera del Shabd en el corazón,"