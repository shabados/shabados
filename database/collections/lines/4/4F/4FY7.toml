[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੋਹਿ ਅਚਿੰਤੁ; ਬਸੈ ਸੁਖ ਨਾਲਿ ॥"
page = 289
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou shalt become free from care and abide in comfort,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਨਿਸਚਿੰਤ ਹੋ ਜਾਵੇਗਾ ਅਤੇ ਆਰਾਮ ਅੰਦਰ ਵੱਸੇਗਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You shall become carefree, and you shall dwell in peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਚਿੰਤਾ ਸੇ ਰਹਿਤ ਹੋ ਕਰ ਸੁਖ ਸਾਥ ਵੱਸੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਬੇਫ਼ਿਕਰ ਹੋ ਜਾਹਿਂਗਾ ਤੇ ਤੇਰਾ ਜੀਵਨ ਸੁਖ ਨਾਲ ਬਿਤੀਤ ਹੋਵੇਗਾ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਚਿੰਤੁ = ਬੇ-ਫ਼ਿਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo así podrás vivir en Perfecta Paz."