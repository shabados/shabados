[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਕਾਮਿ; ਨ ਜੋਹਹਿ ਦੂਤ ॥"
page = 238
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He in whose service death's courier stalk not,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਸੇਵਾ ਵਿੱਚ ਮੌਤ ਦੇ ਜਮ ਤਕਾਉਂਦੇ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Working for Him, the Messenger of Death will not be watching you."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਿਸ ਕੇ ਸਿਮਰਨ ਕੀ ਇੱਛਾ ਸੇ ਜਮਦੂਤ ਨਹੀਂ ਦੇਖ ਸਕਤੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਉਸ ਦੀ ਸੇਵਾ-ਭਗਤੀ ਵਿਚ ਲੱਗਿਆਂ ਜਮਦੂਤ ਤੱਕ ਭੀ ਨਹੀਂ ਸਕਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਜੋਹਹਿ = ਨਹੀਂ ਤੱਕਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Yama, el agente de la muerte, no te acechará."