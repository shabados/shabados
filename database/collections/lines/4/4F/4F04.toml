[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਰਪਾ ਧਾਰੀਆ; ਹਾਂ ॥"
page = 410
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord has shown mercy unto me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਨੇ ਮੇਰੇ ਉੱਤੇ ਮਿਹਰ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has showered His Mercy upon me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਨੇ ਕ੍ਰਿਪਾ ਧਾਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਜਗਤ ਦੇ ਮਾਲਕ-ਪ੍ਰਭੂ! ਮੇਰੇ ਉੱਤੇ ਮੇਹਰ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਾਰੀਆ = ਧਾਰਿ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor ha sido Compasivo conmigo,"