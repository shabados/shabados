[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਸਕਰੁ ਸੋਇ; ਜਿ ਤਾਤਿ. ਨ ਕਰੈ ॥"
page = 872
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "A thief is he, who harbours not envy,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੋਰ ਉਹ ਹੈ ਜੋ ਈਰਖਾ ਨਹੀਂ ਕਰਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is a thief, who is above envy,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਸਕਰ ਤੋ ਸੋਇ ਹੈ, ਜੋ ਕਿਸੀ ਕੀ (ਤਾਤਿ) ਚਾਹ ਨਾ ਕਰੇ ਵਾ ਨਿੰਦਾ ਨ ਕਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੁਸੀ 'ਤਸਕਰ' ਚੋਰ ਨੂੰ ਆਖਦੇ ਹੋ, ਪਰ) 'ਤਸਕਰ' ਉਹ ਹੈ ਜੋ ਤਾਤਿ (ਈਰਖਾ ਨੂੰ ਆਪਣੇ ਮਨ ਵਿਚੋਂ ਚੁਰਾ ਲੈ ਜਾਂਦਾ ਹੈ) ਨਹੀਂ ਕਰਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਸਕਰੁ = ਚੋਰ। ਤਾਤਿ = ਈਰਖਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Un verdadero ladrón es aquél que no roba a nadie más que a su propia maldad"