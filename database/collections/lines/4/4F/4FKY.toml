[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਏ ਪੂਜ ਤੋ ਕਹਾ, ਗੁਮਾਨ ਨ ਕੀਜਿਯੈ ॥"
page = 834

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The one, who is considered as worship-worthy, should not become egotistical."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸਤਰੀ ਨੇ ਕਿਹਾ) ਜੇ ਪੂਜਣ ਯੋਗ ਹੋ ਗਏ ਤਾਂ ਕੀ ਹੋ ਗਿਆ, (ਫਿਰ ਵੀ) ਹੰਕਾਰ ਨਹੀਂ ਕਰਨਾ ਚਾਹੀਦਾ।"