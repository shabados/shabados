[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਨਿਰੰਕਾਰੁ ਅਕਾਰੁ ਕਰਿ; ਏਕੰਕਾਰੁ ਅਪਾਰ ਸਦਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "On assuming form that formless Lord was called as the boundless Ekankar."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਨਿਰਗੁਣ ਬ੍ਰਹਮ ਅਕਾਰ ਧਾਰਕੇ 'ਏਕੰਕਾਰ' ਅਪਾਰ (ਹਦ ਤੋਂ ਰਹਿਤ) ਸਰੂਪ ਕਹਾਇਆ।"