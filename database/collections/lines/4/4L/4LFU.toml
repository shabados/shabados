[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਣ ਨਿਧਾਨ ਦਇਆਲ ਪੁਰਖ ਪ੍ਰਭ; ਸਰਬ ਸੂਖ ਦਇਆਲਾ ॥"
page = 674
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The kind and compassionate Lord Master is the Treasure of virtue and all the comforts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਇਆਵਾਨ ਤੇ ਮਿਹਰਬਾਨ ਮਾਲਕ ਸੁਆਮੀ ਨੇਕੀ ਅਤੇ ਸਾਰੇ ਆਰਾਮਾਂ ਦਾ ਖਜਾਨਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is the treasure of virtue, kind and compassionate, the source of all comfort."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਗੁਣ ਨਿਧਾਨ ਦਿਆਲ ਪੁਰਖ ਪ੍ਰਭੂ! ਹੇ ਦਿਆਲ ਸਰਬ ਸੁਖੋਂ ਕੇ ਦੇਣੇ ਵਾਲੇ! ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਣਾਂ ਦੇ ਖ਼ਜ਼ਾਨੇ! ਹੇ ਦਇਆ ਦੇ ਘਰ! ਹੇ ਸਰਬ-ਵਿਆਪਕ! ਹੇ ਪ੍ਰਭੂ! ਹੇ ਸਾਰੇ ਸੁਖਾਂ ਦੀ ਬਖਸ਼ਸ਼ ਕਰਨ ਵਾਲੇ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਣ ਨਿਧਾਨ = ਹੇ ਗੁਣਾਂ ਦੇ ਖ਼ਜ਼ਾਨੇ! ਪੁਰਖ = ਹੇ ਸਰਬ-ਵਿਆਪਕ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi Señor Bondadoso, eres el Verdadero Tesoro de Virtud, el Dador de Éxtasis,"