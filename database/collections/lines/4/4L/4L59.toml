[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਬਿਨੁ; ਕੋਇ. ਨ ਚਾਲਸਿ ਸਾਥ ॥"
page = 1120
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Save the Lord, nothing goes with the man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਬਗੈਰ, ਕੁਝ ਭੀ ਬੰਦੇ ਦੇ ਨਾਲ ਨਹੀਂ ਜਾਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nothing goes along with the mortal, except for the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹਰੀ ਸੇ ਬਿਨਾਂ ਪ੍ਰਲੋਕ ਮੇਂ ਕੋਈ ਸਾਥ ਨਹੀਂ ਚਲੇਗਾ॥ ਵਹੁ ਹਰੀ ਕੈਸਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ ਤੋਂ ਤੁਰਨ ਵੇਲੇ) ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਤੋਂ ਬਿਨਾ ਹੋਰ ਕੋਈ (ਜੀਵ ਦੇ) ਨਾਲ ਨਹੀਂ ਜਾਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਥ = ਨਾਲ। ਨ ਚਾਲਸਿ = ਨਹੀਂ ਜਾਂਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nada se va contigo excepto tu Dios."