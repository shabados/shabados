[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਆਵਨ ਕਾ; ਇਹੈ ਸੁਆਉ ॥"
page = 295
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The object of the advent of Lord's serf is,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਦੇ ਗੋਲੇ ਦੇ ਆਗਮਨ ਦਾ ਪ੍ਰਯੋਜਨ ਇਹ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is his purpose in life;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸੰਤ ਜਨ ਕੇ ਆਵਣੇ ਕਾ ਇਹੀ ਲਾਭ ਵਾ ਪ੍ਰਯੋਜਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਜਿਹੇ ਮਨੁੱਖ ਦੇ ਆਉਣ ਦਾ ਇਹੀ ਮਨੋਰਥ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਆਉ = ਪ੍ਰਯੋਜਨ, ਮਨੋਰਥ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su Gracia redime a la humanidad entera."