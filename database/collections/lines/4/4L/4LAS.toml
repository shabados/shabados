[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਤੇ ਪਰੈ; ਨਾਹੀ ਕਿਛੁ ਕੋਇ ॥"
page = 283
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Beyond Him there is nothing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਤੋਂ ਪਰੇਡੇ ਹੋਰ ਕੁਝ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Beyond Him, there is nothing at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਤੇ ਪਰੈ ਕਿਛੁ ਕਰਨੈ ਲਾਇਕ ਔਰ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਤੋਂ ਬਾਹਰਾ ਹੋਰ ਕੋਈ ਜੀਵ ਨਹੀਂ, ਕੋਈ ਚੀਜ਼ ਨਹੀਂ["

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque no podrás hallar Amor más grande que el de Dios."