[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਜੁਗਤਿ ਕਰਿ; ਬਹੁਤੁ ਬੀਚਾਰਉ ॥"
page = 804
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Adopting myriad of ways, I greatly reflect on the Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੰਤ ਤਰੀਕੇ ਇਖਤਿਆਰ ਕਰ ਕੇ ਮੈਂ ਬੜਾ ਹੀ ਸਾਹਿਬ ਦੀ ਵੀਚਾਰ ਕਰਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Trying several methods, I reflect deeply upon the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੇਕ ਜੁਗਤੀਆਂ ਬਹੁਤ ਬੀਚਾਰੋਂ ਕੋ ਕਰ ਕੇ ਅਬ ਤੇਰੀ ਕਿਰਪਾ ਤੇ ਐਸਾ ਜਾਣਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੈਂ ਅਨੇਕਾਂ ਢੰਗ (ਆਪਣੇ ਸਾਹਮਣੇ) ਰੱਖ ਕੇ ਬੜਾ ਵਿਚਾਰਦਾ ਹਾਂ (ਕਿ ਕਿਸ ਢੰਗ ਨਾਲ ਇਸ ਨੂੰ ਵਿਕਾਰਾਂ ਤੋਂ ਬਚਾਇਆ ਜਾਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੁਗਤਿ = ਢੰਗ। ਬੀਚਾਰਉ = ਬੀਚਾਰਉਂ, ਮੈਂ ਵਿਚਾਰਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De mil formas medito en Ti, oh Señor,"