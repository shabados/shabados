[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਾਲ ਕੋ ਖ︀ਯਾਲ ਅਨੂਪਮ ਹੇਰਿ ਸੁ ਰੀਝ ਰਹੀ ਅਬਲਾ ਮਨ ਮਾਹੀ ॥"
page = 952

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Her lover in her mind, she would feel satiated."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੀਤਮ ਦੇ ਅਨੂਪਮ ਖ਼ਿਆਲ ਦੇ ਆਣ ਨਾਲ ਹੀ ਉਹ ਇਸਤਰੀ ਮਨ ਵਿਚ ਰੀਝ ਜਾਂਦੀ।"