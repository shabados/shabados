data = "ਤਾ ਕੋ ਰੂਪ ਅਨੂਪ; ਸਰੂਪ ਬਿਰਾਜਈ ॥"
page = 1014

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She was bestowed with pleasant features."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਆਪਣੇ ਸੁੰਦਰ ਅਤੇ ਅਨੂਪਮ ਸਰੂਪ ਵਿਚ ਬਿਰਾਜਮਾਨ ਵੇਖ ਕੇ"