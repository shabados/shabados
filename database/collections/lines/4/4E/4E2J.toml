[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਮਿਲਿਐ. ਦੇਹ ਸੁਦੇਹੀ ॥੧॥ ਰਹਾਉ ॥"
page = 657
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "meeting with whom the body is rendered a sublime body. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਮਿਲਣ ਦੁਆਰਾ ਸਰੀਰ ਇਥ ਸ਼੍ਰੇਸਟ ਸਰੀਰ ਵਿੱਚ ਬਦਲ ਗਿਆ ਹੈ। ਠਹਿਰਾਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting with Him, my body is made beauteous and sublime. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਮਿਲਨੇ ਸੇ ਇਹ ਦੇਹੀ ਸੁਦੇਹੀ ਭਈ, ਭਾਵ ਸੇਂ ਸਫਲ ਹੋਈ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਮਿਲਣ ਦੀ ਬਰਕਤਿ ਨਾਲ ਮੇਰਾ ਸਰੀਰ ਭੀ ਚਮਕ ਪਿਆ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਹ ਮਿਲਿਐ = ਜਿਸ (ਰਾਮ) ਦੇ ਮਿਲਣ ਨਾਲ। ਦੇਹ = ਸਰੀਰ। ਸੁਦੇਹੀ = ਸੋਹਣੀ ਕਾਇਆਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "encontrándolo me siento pleno. (1‑Pausa)"