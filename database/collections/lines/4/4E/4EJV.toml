[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਆ ਮੇਵਾ. ਕਿਆ ਘਿਉ ਗੁੜੁ ਮਿਠਾ; ਕਿਆ ਮੈਦਾ ਕਿਆ ਮਾਸੁ ॥"
page = 142
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What is fruit, what clarified butter and sweet molasses, what fine flour and what meat?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੀ ਹੈ ਫਲ, ਕੀ ਘੀ ਤੇ ਮਿੱਠੜਾ ਗੁੜ, ਕੀ ਮਹੀਨ ਆਟਾ ਅਤੇ ਕੀ ਗੋਸ਼ਤ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What good are fruits, what good is ghee, sweet jaggery, what good is flour, and what good is meat?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਮੇਵਾ ਹੈ, ਤੋ ਕਿਆ ਹੈ ਘਿਉ ਕਿਆ ਹੈ ਗੁੜਾਦਿ ਮਿਠਾ ਕਿਆ ਹੈ ਮੈਦਾ ਕਿਆ ਹੈ ਮਾਸ ਕਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੀਹ ਹੋਇਆ ਜੇ ਮੇਵੇ, ਘਿਉ, ਮਿੱਠਾ ਗੁੜ ਮੈਦਾ ਤੇ ਮਾਸ ਆਦਿਕ ਪਦਾਰਥ ਵਰਤੇ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿De qué sirven las frutas, la mantequilla, el azúcar, los dulces, las carnes, y la harina refinada?"