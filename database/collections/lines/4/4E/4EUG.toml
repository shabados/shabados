[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੈ ਮਨਿ ਤਨਿ ਪ੍ਰੇਮੁ ਲਗਾ; ਹਰਿ ਢੋਲੇ ਜੀਉ ॥"
page = 173
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within my mind and body love of the darling God is enshrined."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਚਿੱਤ ਤੇ ਸਰੀਰ ਅੰਦਰ ਪਿਆਰੇ ਵਾਹਿਗੁਰੂ ਦੀ ਪ੍ਰੀਤ ਲੱਗੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind and body are filled with love for my Darling Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਪ੍ਰੇਮੀਓਂ ਕੋ ਐਸਾ ਫਲ ਦੇਖ ਕਰ ਮੇਰੇ ਮਨ ਤਨ ਮੇਂ ਹਰੀ ਪਿਆਰੇ ਕਾ ਪ੍ਰੇਮ ਲਗਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਸਹੇਲੀਏ!) ਮੇਰੇ ਮਨ ਵਿਚ ਮੇਰੇ ਹਿਰਦੇ ਵਿਚ ਹਰਿ-ਮਿਤ੍ਰ ਦਾ ਪਿਆਰ ਪੈਦਾ ਹੋ ਚੁਕਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਨਿ = ਤਨ ਵਿਚ। ਢੋਲਾ = ਮਿੱਤਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi mente y mi cuerpo están imbuidos en el Amor de mi Esposo;"