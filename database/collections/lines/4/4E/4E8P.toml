[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਖ ਚਉਰਾਸੀਹ ਮੇਦਨੀ; ਤੁਝ ਹੀ ਤੇ ਹੋਈ ॥"
page = 1283
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The eighty four lacs of species have issued forth from Thee, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੁਰਾਸੀ ਲੱਖ ਜੂਨੀਆਂ ਤੇਰੇ ਤੋਂ ਹੀ ਉਤਪੰਨ ਹੋਈਆਂ ਹਨ, ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The 8.4 million species of beings issued forth from You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚਉਰਾਸੀ ਲਖ ਸ੍ਰਿਸ੍ਟੀ ਤੇਰੇ ਸੇ ਹੀ ਹੂਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸ੍ਰਿਸ਼ਟੀ ਦੀ ਚੌਰਾਸੀ ਲਖ ਜੂਨ ਤੈਥੋਂ ਹੀ ਪੈਦਾ ਹੋਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ। ਮੇਦਨੀ = ਧਰਤੀ, ਸ੍ਰਿਸ਼ਟੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las ocho millones cuatrocientos mil especies de seres salieron de Ti,"