[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਕਾ ਕੀਆ; ਸਭੁ ਪਰਵਾਨੁ ॥"
page = 294
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All is done by Him must be accepted,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਾ ਕੁਛ ਜੋ ਉਹ ਕਰਦਾ ਹੈ ਮੰਨਣਾ ਪਏਗਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His actions are all approved and accepted."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕਾ ਕੀਆ ਹੂਆ ਸਭ ਪਰਵਾਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦਾ ਕੀਤਾ ਹੋਇਆ ਸਭ ਕੁਝ (ਜੀਵਾਂ ਨੂੰ) ਸਿਰ ਮੱਥੇ ਮੰਨਣਾ ਪੈਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues fuera de Él nada existe."