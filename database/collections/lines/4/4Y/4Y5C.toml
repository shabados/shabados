[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਰੇ ਹੈ ਪਵਿਤ੍ਰ ਹੈ; ਪੁਨੀਤ ਹੈ ਪੁਰਾਨ ਹੈ ॥"
page = 32

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is in the Yond, He is Holy, Immaculate and Ancient."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਹ ਸਭ ਤੋਂ) ਪਰੇ ਹੈ, ਪਵਿਤਰ ਹੈ, ਸਵੱਛ ਹੈ ਅਤੇ ਪੁਰਾਤਨ ਹੈ।"