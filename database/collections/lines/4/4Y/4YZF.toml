[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਤੇ ਕੀਤੇ; ਹੋਰਿ ਕਰੇਹਿ ॥"
page = 6
line = 3

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਅਨਪੁਰਖ ਬਹੁਵਚਨ ਕਿਰਿਆ"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Were Thou to create as many more as already created,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਤੂੰ ਐਨੇ ਹੋਰ ਰਚ ਦੇਵੇ ਜਿੰਨੇ ਅੱਗੇ ਰਚੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If He were to create as many again as there already are,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਤਨੇ ਜੋ ਗਿਣਨੇ ਕੀਏ ਹੈਂ ਇਤਨੇ ਔਰੁ ਭੀ ਕਰੇਂ, ਭਾਵ ਪਿਛਲਿਓਂ ਕੇ ਸਾਥ ਮਿਲਾਈਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਵਿਚ ਇਤਨੇ (ਬੇਅੰਤ) ਜੀਵ ਪੈਦਾ ਕੀਤੇ ਹੋਏ ਹਨ (ਜੋ ਬਿਆਨ ਕਰ ਰਹੇ ਹਨ), (ਪਰ ਹੇ ਹਰੀ!) ਜੇ ਤੂੰ ਹੋਰ ਭੀ (ਬੇਅੰਤ ਜੀਵ) ਪੈਦਾ ਕਰ ਦੇਵੇਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਤੇ ਕੀਤੇ = ਇਤਨੇ ਜੀਵ ਪੈਦਾ ਕੀਤੇ ਹੋਏ ਹਨ। ਹੋਰਿ = ਹੋਰ ਬੇਅੰਤ ਜੀਵ। ਕਰੇਹਿ = ਜੇ ਤੂੰ ਪੈਦਾ ਕਰ ਦੇਵੇਂ (ਹੇ ਹਰੀ!)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Solamente para Describirte millones más esperan tu nacimiento,"