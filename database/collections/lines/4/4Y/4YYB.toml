type = "primary"
data = "ਕਈ ਮੇਟ ਡਾਰੇ ਉਸਾਰੇ ਬਨਾਏ ॥"
page = 41

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He hath effaced many and then made (created) others.!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੇ) ਕਈ ਮਿਟਾ ਦਿੱਤੇ ਅਤੇ ਫਿਰ ਉਸਾਰ ਕੇ ਬਣਾ ਦਿੱਤੇ।"