[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਹੀ ਅੰਦਰਿ, ਵਸਤੁ ਅਪਾਰਾ ॥"
page = 1056
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within the body is a priceless thing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਰੀਰ ਦੇ ਅੰਦਰ ਇਕ ਅਮੋਲਕ ਚੀਜ਼ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Deep within the body is the priceless object."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੇਹੀ ਕੇ ਅੰਤਰ ਹੀ (ਅਪਾਰਾ) ਪਰਮਾਤਮਾਂ ਰੂਪ ਵਸਤੂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਦੇ ਸਰੀਰ ਵਿਚ (ਹੀ) ਬੇਅੰਤ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਪਦਾਰਥ (ਮੌਜੂਦ) ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਹੀ = ਸਰੀਰ। ਵਸਤੁ ਅਪਾਰਾ = ਬੇਅੰਤ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਪਦਾਰਥ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En el cuerpo está la Cosa Infinita"