[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧਸੰਗਿ; ਜਪਿਓ ਭਗਵੰਤੁ ॥"
page = 183
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the Saints, congregation I meditate on the Auspicious Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿ ਸੰਗਤ ਅੰਦਰ ਮੈਂ ਮੁਬਾਰਕ ਮਾਲਕ ਦਾ ਆਰਾਧਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Saadh Sangat, the Company of the Holy, I meditate on the Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸਾਧੂਓਂ ਕਾ ਸੰਗ ਕਰ ਪਰਮੇਸ੍ਵਰ ਕਾ ਜਾਪ ਕੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਨੇ) ਸਾਧ ਸੰਗਤਿ ਵਿਚ ਭਗਵਾਨ ਦਾ ਸਿਮਰਨ ਕੀਤਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧ ਸੰਗਿ = ਸਾਧ ਸੰਗਤਿ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En el Santuario de los Santos habito en el Señor y recibo el Mantra,"