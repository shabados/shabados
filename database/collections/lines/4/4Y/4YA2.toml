[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਮਰੋ ਕਰਤਾ. ਰਾਮੁ ਸਨੇਹੀ ॥"
page = 692
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Creator Lord alone is my Friend."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਸਿਰਜਣਹਾਰ ਸੁਆਮੀ ਹੀ ਮੇਰਾ ਮਿੱਤਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator Lord is our only friend."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਰਬ ਕਾ ਕਰਤਾ ਜੋ ਰਾਮ ਹੈ, ਸੋ ਹਮਾਰਾ (ਸਨੇਹੀ) ਪ੍ਰੀਤਮ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਸਾਡਾ ਅਸਲ ਪਿਆਰਾ (ਜਿਸ ਨੇ ਸਾਥ ਨਿਭਾਉਣਾ ਹੈ) ਤਾਂ ਕਰਤਾਰ ਹੈ, ਪਰਮਾਤਮਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਤਾ = ਕਰਤਾਰ। ਸਨੇਹੀ = ਪਿਆਰਾ, ਸਦਾ ਦਾ ਸਾਥ ਨਿਭਾਉਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nuestro Señor Creador es el Único Dios Amoroso de todos."