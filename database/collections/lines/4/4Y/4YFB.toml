[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਸਤਿਗੁਰ ਕਰਹ ਭਗਤੀ; ਜਾਂ ਹਰਿ ਪ੍ਰਭੁ ਕਿਰਪਾ ਧਾਰੇ ॥"
page = 574
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Serve I the Divine, the Divine True Guru, when the Lord God shows mercy unto me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਈਸ਼ਵਰੀ, ਮੈਂ ਈਸ਼ਵਰੀ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਘਾਲ ਕਮਾਉਂਦਾ ਹਾਂ, ਜਦ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਮੇਰੇ ਉੱਤੇ ਮਿਹਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I worship the Lord, Har, Har, and the True Guru; the Lord God has granted His Grace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਸਤਗੁਰੋਂ ਕੀ ਭਗਤੀ ਤਬ ਹੋਇਗੀ ਜਬ ਹੇ ਹਰਿ! ਆਪ ਕਿਰਪਾ ਧਾਰਨ ਕਰਹੁਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੂੰ ਮਿਲ ਕੇ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਅਸੀਂ ਤਦੋਂ ਹੀ ਕਰ ਸਕਦੇ ਹਾਂ ਜਦੋਂ ਪਰਮਾਤਮਾ ਕਿਰਪਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਂ = ਜਦੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Alabo al Señor Jar, Jar, sirvo al Verdadero Guru y el Señor me confiere Su Gracia,"