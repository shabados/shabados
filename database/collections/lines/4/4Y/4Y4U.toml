type = "primary"
data = "ਐਸਾ ਕੋ ਵਡਭਾਗੀ ਆਇਆ ॥"
page = 1077
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rare is any such very fortunate person,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਵਿਰਲਾ ਹੀ ਐਹੋ ਜੇਹਾ ਭਾਰੇ ਨਸੀਬਾਂ ਵਾਲਾ ਪੁਰਸ਼ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Rare are those few, very blessed people, who come into the world,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸਾ ਵਡਭਾਗੀ ਕੋਈ ਜਗਤ ਮੇਂ ਆਇਆ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਵਿਰਲਾ ਹੀ ਅਜਿਹਾ ਭਾਗਾਂ ਵਾਲਾ ਮਨੁੱਖ ਜੰਮਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋ = ਕੋਈ (ਵਿਰਲਾ) ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Extraordinario es el afortunado,"