[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਕਾਰਨਿ ਧਾਵਹੀ; ਮੂਰਖ ਲੋਗ ਅਜਾਨ ॥"
page = 1427
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "For the sake of riches, the foolish and ignorant, their life passes away in vain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨ-ਦੌਲਤ ਦੀ ਖਾਤਰ, ਬੇਵਕੂਫ ਅਤੇ ਬੇਸਮਝ ਬੰਦੇ ਭੱਜੇ ਫਿਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "For the sake of Maya, the fools and ignorant people run all around."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਮਾਯਾ ਕੇ ਨਮਿਤ ਕਰ ਕੇ ਮੂਰਖ ਲੋਗ (ਅਜਾਨ) ਅਗ੍ਯਾਤ ਪੁਰਸ ਦੌੜਤੇ ਫਿਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੂਰਖ ਬੇ-ਸਮਝ ਬੰਦੇ (ਨਿਰੀ) ਮਾਇਆ (ਇਕੱਠੀ ਕਰਨ) ਵਾਸਤੇ ਭਟਕਦੇ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਾਵਹੀ = ਧਾਵਹਿ, ਦੌੜੇ ਫਿਰਦੇ ਹਨ। ਅਜਾਨ = ਬੇ-ਸਮਝ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Persiguiendo a Maya, los tontos e ignorantes merodean,"