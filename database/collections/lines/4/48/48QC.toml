[[content]]
assets = ["AKKB"]
type = "primary"
data = "ਕਾਲ ਪੁਰਖ ਕੀ ਆਗਿਆ ਪਾਇ ਪ੍ਰਗਟ ਭਯੋ ਰੂਪ ਮੁਨਿਵਰ ਕੋ ॥"

[[content]]
assets = ["SOTK"]
type = "translation"
language = "en"
data = "By the command of [A]kal Purakh [the Khalsa] took the form of the most exalted of sages, with matted hair from the top of its head to the smallest nail of its toe. "