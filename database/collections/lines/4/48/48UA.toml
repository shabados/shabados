[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੈ ਨਾਨਕੁ. ਸੁਣਿ ਮਨ ਮੇਰੇ; ਤੂ ਸਦਾ ਸਚੁ ਸਮਾਲਿ ॥੧॥"
page = 569
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says, Nanak, hearken thou, O my soul and remember thou ever the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਤੂੰ ਮੇਰੀ ਆਤਮਾ! ਸੁਣ ਤੂੰ ਸਦੀਵ ਹੀ ਸੱਚੇ ਸਾਹਿਬ ਦਾ ਸਿਮਰਨ ਕਰਿਆ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, listen, O my mind: contemplate the True Lord forever. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਮੇਰੇ ਮਨ ਸੁਣ! ਤੂੰ ਸਦੀਵਕਾਲ ਸਚ ਰੂਪ ਪਰਮੇਸ੍ਵਰ ਕੋ ਸੰਭਾਲ, ਭਾਵ ਚਿੰਤਨ ਕਰਤਾ ਰਹੁ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ ਆਖਦਾ ਹੈ ਕਿ, ਹੇ ਮੇਰੇ ਮਨ! (ਮੇਰੀ ਗੱਲ) ਸੁਣ, ਤੂੰ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਨੂੰ ਸਦਾ ਆਪਣੇ ਅੰਦਰ ਵਸਾਈ ਰੱਖ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, apresúrate, oh mi mente; construye siempre la Verdad. (1)"