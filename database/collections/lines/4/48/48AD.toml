[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਕੁਨੁ ਰੇ ॥"
page = 694
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord: \"O who art thou?\""

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ: \"ਓਇ, ਤੂੰ ਕੌਣ ਹੈਂ?\""

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "\"Who are you?\""

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਕਹਤੇ ਹੈਂ: ਤੂੰ ਕੌਣ ਹੈ ਅਰਥਾਤ ਆਪ ਕੋ ਕੌਣ ਮੰਨਿਆ ਹੈ?☬ਨਾਮਦੇਵ ਜੀ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਪ੍ਰਭੂ) ਜੀ! (ਜੇ ਤੂੰ ਮੈਨੂੰ ਪੁੱਛੇਂ-) ਤੂੰ ਕੌਣ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇ = ਹੇ ਭਾਈ! ਕੁਨੁ = ਕੌਣ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Quién eres Tú?;"