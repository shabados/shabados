[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹੂੰ ਧੂਪ ਦੀਪ, ਕਹੂੰ ਅਰਘ ਦਾਨ ॥੧੬॥੧੩੬॥"
page = 30

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere the offerings of incense earthen lamps and libations are made! 16. 136"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ (ਕੋਈ) ਧੂਪ, ਦੀਪਕ (ਆਦਿ ਸਜਾ ਕੇ) ਆਰਤੀ ਕਰ ਰਹੇ ਹਨ ਅਤੇ ਕਿਤੇ (ਕੋਈ) ਅਰਘ ਦਾਨ ਕਰ ਰਹੇ ਹਨ ॥੧੬॥੧੩੬॥"