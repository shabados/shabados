[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮਤੀ; ਨਾਮੁ ਰਿਦੈ ਵਸਾਏ ॥"
page = 222
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's instruction the Name abides in the mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਦੁਆਰਾ ਨਾਮ ਚਿੱਤ ਵਿੱਚ ਟਿਕ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Following the Guru's Teachings, the Naam abides in the heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਗੁਰੋਂ ਕੀ ਸਿਖ੍ਯਾ ਧਾਰਨ ਕਰਨੇ ਵਾਲੇ ਹੀ ਨਾਮ ਕੋ ਰਿਦੇ ਮੇਂ ਬਸਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਿੱਖਿਆ ਉਤੇ ਤੁਰ ਕੇ ਉਹ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਵਸਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਿਦੈ = ਹਿਰਦੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por la Instrucción del Guru, uno enaltece el Nombre del Señor en el corazón,"