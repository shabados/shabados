[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਕਿ ਨਿਬ੍ਰਿਤ ਅਤਿ ਬੀਰ; ਦੁਤੀਅ ਭਾਵਨਾ ਮਹਾ ਭਟ ॥"
page = 699

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The first warrior is Nivratti (free) and the second warrior is Bhavana (emotion),"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ 'ਨਿਵ੍ਰਿਤੀ' (ਨਾਂ ਵਾਲਾ) ਮਹਾਨ ਯੋਧਾ ਹੈ ਅਤੇ ਦੂਜਾ 'ਭਾਵਨਾ' (ਨਾਂ ਵਾਲਾ) ਬਹੁਤ ਵੱਡਾ ਯੋਧਾ ਹੈ।"