[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰਿ ਅਗਨਿ; ਚਿੰਤਾ ਬਹੁ ਜਾਰੇ ॥"
page = 903
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The fire of anxiety, greatly burns thy heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਫਿਕਰ ਦੀ ਅੱਗ ਤੇਰੇ ਦਿਲ ਨੂੰ ਬਹੁਤ ਹੀ ਸਾੜਦੀ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The fire of anxiety burns brightly within you."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਰਿਦੇ ਅੰਤਰ ਕੋ ਮਾਇਆ ਕੀ ਚਿੰਤਾ ਰੂਪ ਅਗਨੀ ਬਹੁਤ ਸਾੜ ਰਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਤ੍ਰਿਸ਼ਨਾ ਤੇ ਚਿੰਤਾ ਦੀ ਅੱਗ ਅੰਦਰੇ ਅੰਦਰ ਸਾੜ ਰਹੀ ਹੋਵੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਨਿ = ਤ੍ਰਿਸ਼ਨਾ ਦੀ ਅੱਗ। ਜਾਰੇ = ਸਾੜਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en él se conserva el fuego inmenso de las preocupaciones y de la ansiedad."