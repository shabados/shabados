[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪਰਸਾਦੀ; ਪਾਇਆ ॥"
page = 73
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Guru's grace I have obtained God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਮੈਂ ਵਾਹਿਗੁਰੂ ਨੂੰ ਪਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By Guru's Grace, I have found God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਅੰਤਹਕਰਣ ਮੇਂ ਗੁਰੂ ਜੀ ਨੇ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਨਾਮੁ ਪਾਇਆ ਹੈ, ਵਾ ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਜਿਸ ਪੁਰਸ ਨੈ ਅਪਨੇ ਅੰਤਹਕਰਣ ਮੇਂ ਨਾਮ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ (ਪਰਮਾਤਮਾ ਦੀ ਸਰਬ-ਵਿਆਪਕਤਾ ਦਾ ਭੇਦ) ਪਾ ਲਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਪਰਸਾਦੀ = ਗੁਰ ਪਰਸਾਦਿ, ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por la Gracia del Guru Te recibí"