[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਅਮੋਲਕੁ; ਗੁਰ ਪਰਸਾਦੀ ਪਾਇਆ ॥"
page = 124
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The priceless Name is obtained by the Guru's grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਣਮੁੱਲਾ ਨਾਮ ਗੁਰਾਂ ਦੀ ਰਹਿਮਤ ਦੁਆਰਾ ਪਰਾਪਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Priceless Naam is obtained by Guru's Grace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ੍ਹੋਂ ਨੇ ਗੁਰੋਂ ਕੀ ਕ੍ਰਿਪਾ ਸੇ ਅਮੋਲਕ ਨਾਮ ਪਾਇਆ ਹੈ"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਉਹ ਨਾਮ ਅੰਮ੍ਰਿਤ (ਅੰਦਰੋਂ ਹੀ) ਲੱਭ ਲਿਆ ਜੋ ਕਿਸੇ (ਦੁਨਿਆਵੀ ਪਦਾਰਥ ਦੇ ਵੱਟੇ) ਮੁੱਲ ਨਹੀਂ ਮਿਲਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y entonces recibimos el Nombre Invaluable del Señor, por la Gracia del Guru."