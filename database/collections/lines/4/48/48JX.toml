[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਹਰਿ ਪ੍ਰਭਿ ਕਿਰਪਾ ਧਾਰੀ ॥"
page = 879
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Lord God was in mercy,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਨੇ ਮਿਹਰ ਕੀਤੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Lord God showered His Mercy,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਜਿਸ ਪਰ ਹਰੀ ਸਮਰਥ ਨੇ ਕ੍ਰਿਪਾ (ਧਾਰੀ) ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਹਰਿ ਪ੍ਰਭੂ ਨੇ ਆਪ (ਕਿਸੇ ਜੀਵ ਉਤੇ) ਮੇਹਰ ਕੀਤੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ = ਜਦੋਂ। ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando Dios hizo llover Su Misericordia sobre mi,"