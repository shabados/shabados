[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਉਸ ਨੂੰ ਸਿਦਕ ਈਮਾਨ ਵਿਚ ਪੱਕਾ ਕਰ ਦਿੰਦਾ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਹੱਕ ਮਰ ਊ ਰਾ ਸਾਹਿਬਿ ਈਮਾਨ ਕਰਦ ॥੩੨॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "But the world would not know about this fact without a perfect Guru. (384)"