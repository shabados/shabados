[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭ੍ਰਮਰ ਕਲਾ ਏ ਬਚਨ ਕਹਿ; ਤਾ ਕੇ ਸਤਹਿ ਟਰਾਇ ॥"
page = 1006

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Relating such talk, Bharmar Kala decimated his celibacy,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਭ੍ਰਮਰ ਕਲਾ ਨੇ ਇਹ ਬਚਨ ਕਹਿ ਕੇ ਉਸ ਦੇ ਸੱਤ ਨੂੰ ਭੰਗ ਕਰ ਦਿੱਤਾ।"