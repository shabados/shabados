[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਖੁ ਮਾਂਗਤ; ਦੁਖੁ ਆਗੈ ਆਵੈ ॥"
page = 330
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man prays for peace, but pain be-falls him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੰਦਾ ਆਰਾਮ ਮੰਗਦਾ ਹੈ, ਪਰ ਉਸ ਨੂੰ ਪੀੜ ਆ ਮਿਲਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "People beg for pleasure, but pain comes instead."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਖ ਕੀ ਇਛਾ ਕਰਤੇ ਹੀ ਰਹ ਜਾਈਤਾ ਹੈ ਦੁਖ ਪਹਿਲੇ ਹੀ ਆ ਜਾਤਾ ਹੈ, ਵਾ (ਆਗੈ) ਪਰਲੋਕ ਮੇਂ ਦੁਖ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਉਸ ਸੁਖ ਦੇ ਮੰਗਣ ਦੀ ਲੋੜ ਨਹੀਂ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno busca placeres y recibe dolor,"