[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਛੈ ਅਖੈ ਅਬਿਕਾਰ ਅਭੈ; ਅਨਭਿਜ ਅਭੇਦਨ ॥"
page = 130

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Inassailable, Incorruptible, Devoid of vices, Fearless, unattached and Undistinguishable Lord."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੋਂਦ ਵਿਚ ਨਾ ਆਉਣ ਵਾਲੇ ('ਅਛੈ') ਨਸ਼ਟ ਨਾ ਹੋਣ ਵਾਲ, ਵਿਕਰਿਤ ਨਾ ਹੋਣ ਵਾਲੇ, ਡਰ ਤੋਂ ਰਹਿਤ, ਨਿਰਲੇਪ, ਨਾ ਵਿੰਨ੍ਹੇ ਜਾ ਸਕਣ ਵਾਲੇ,"