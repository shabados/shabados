[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਾਸਤ੍ਰ ਸਿਮ੍ਰਿਤਨ ਮਾਹਿ ਸਦਾ; ਸ੍ਰਵਨਨ ਸੁਨਿ ਪਾਯੋ ॥"
page = 890

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘In the Shastras and Simritis, basic truths are narrated,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ਾਸਤ੍ਰਾਂ ਸਮ੍ਰਿਤੀਆਂ ਵਿਚ (ਲਿਖੇ ਸਿੱਧਾਂਤਾਂ ਨੂੰ) ਮੈਂ ਸਦਾ ਕੰਨਾਂ ਨਾਲ ਸੁਣਿਆ ਹੈ।"