[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਹਿਨਿਸਿ ਰਹੈ ਨਿਰਾਲਮੋ; ਕਾਰ ਧੁਰ ਕੀ ਕਰਣੀ ॥"
page = 421
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Day and night he remains detached and renders service unto the Primal Being."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਿਹੁੰ ਅਤੇ ਰੈਣ ਉਹ ਅਟੰਕ ਵਿਚਰਦਾ ਹੈ ਅਤੇ ਆਦਿ ਪੁਰਖ ਦੀ ਟਹਿਲ ਕਮਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Day and night, he remains detached, and serves the Primal Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਰਾਤ ਦਿਨ ਨਿਰਮਲ ਰਹਤੇ ਹੈਂ ਔਰ (ਕਾਰ ਧੁਰ ਕੀ) ਤੁਝ ਆਦਿ ਰੂਪ ਕੀ (ਕਾਰ) ਭਗਤੀ (ਕਰਣੀ) ਕਰਨੇ ਜੋਗ ਜਾਨ ਕਰ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਵਿਚ ਜੁੜੇ ਹੋਏ ਬੰਦੇ ਸੰਤੋਖ ਵਾਲਾ ਜੀਵਨ ਗੁਜ਼ਾਰਦੇ ਹਨ, ਉਸ ਪਰਮਾਤਮਾ ਦੇ ਚਰਨਾਂ ਵਿਚ ਰੰਗੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਹਿ = ਦਿਨ {अहर्}। ਨਿਸਿ = ਰਾਤ {नीश्}। ਨਿਰਾਲਮੋ = ਨਿਰਲੇਪ, {निरा-लम} ਮਾਇਆ ਨੂੰ ਜੀਵਨ ਦਾ ਆਸਰਾ ਬਣਾਣ ਤੋਂ ਬਿਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Se mantiene desapegado día y noche y sirve solamente a su Señor."