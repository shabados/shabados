type = "primary"
data = "ਨਾ ਤਰ ਮੀਚ ਮੂੰਡ ਪਰ ਲੈਹੂ ॥"
page = 66

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He said, “Either give me ten thousand rupees immediately or take death on year head.”"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਹੀਂ ਤਾਂ ਸਿਰ ਉਤੇ ਮੌਤ ਆਈ ਸਮਝੋ।"