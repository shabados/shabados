[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਹਿ ਮਾਰਿ; ਆਪਿ ਜੀਵਾਲੈ ॥"
page = 1146
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of Himself the Lord slays and Himself He revives."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਸੁਆਮੀ ਮਾਰਦਾ ਹੈ ਤੇ ਆਪੇ ਸੁਰਜੀਤ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself kills, and He Himself rejuvenates."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸ੍ਵਰ ਆਪੇ ਹੀ ਸੰਸਾਰ ਕੀ ਤ੍ਰਫ ਸੇ ਮਾਰ ਕਰ ਅਪਣੀ ਤਰਫ ਜੀਵਾਇ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪ ਹੀ (ਜੀਵ ਨੂੰ) ਮਾਰਦਾ ਹੈ ਆਪ ਹੀ ਪੈਦਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪਹਿ = ਆਪ ਹੀ। ਮਾਰਿ = ਮਾਰੇ, ਮਾਰਦਾ ਹੈ। ਜੀਵਾਲੈ = ਜਿੰਦ ਪਾ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor mismo mata y da vida,"