[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਪੇਸ਼ੇ ਤੁ ਈਂ ਸਰ ਮਨ ਆਵੁਰਦਹਅਮ ॥੧੬॥"
page = 1407

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Here, I put the Quazi’s head in front of you.(16)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੈਂ (ਆਪਣੇ ਪਤੀ ਦਾ) ਸਿਰ ਕਟ ਕੇ ਤੁਹਾਡੇ ਸਾਹਮਣੇ ਲੈ ਆਂਦਾ ਹੈ ॥੧੬॥"