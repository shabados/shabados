[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਫਿਰਤ ਫਿਰਤ ਬਹੁਤੇ ਜੁਗ ਹਾਰਿਓ; ਮਾਨਸ ਦੇਹ ਲਹੀ ॥"
page = 631
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Grown weary of wandering about for many yugas, the man has obtained the human body."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਘਣੇਰਿਆਂ ਯੁੱਗਾਂ ਅੰਦਰ ਭਟਕਦੇ ਹੋਏ ਹਾਰੇ ਹੁੱਟੇ ਬੰਦੇ ਨੂੰ ਮਨੁੱਖੀ ਸਰੀਰ ਪ੍ਰਾਪਤ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wandering, wandering around for so many ages, he has grown weary, and finally, he obtained this human body."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋਨੀਓਂ ਮੇਂ ਫਿਰਤੇ ਫਿਰਤੇ ਨੇ ਬਹੁਤੇ ਹੀ ਜੁਗ ਹਾਰ ਦੀਏ ਅਰਥਾਤ ਬਿਤੀਤ ਕਰ ਦੀਏ, ਅਬ ਤੈਨੇ ਮਾਨੁਖ ਦੇਹਿ ਲਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਕਈ ਜੁਗ (ਜੂਨਾਂ ਵਿਚ) ਭਟਕ ਭਟਕ ਕੇ ਤੂੰ ਥੱਕ ਗਿਆ ਸੀ। (ਹੁਣ) ਤੈਨੂੰ ਮਨੁੱਖਾ ਸਰੀਰ ਲੱਭਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੁਗ = ਜੁਗਾਂ ਵਿਚ। ਹਾਰਿਓ = ਥੱਕ ਗਿਆ। ਮਾਨਸ ਦੇਹ = ਮਨੁੱਖਾ ਸਰੀਰ। ਲਹੀ = ਲੱਭਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Has ido a través de millones de nacimientos época tras época y por ello fuiste bendecido con el vestido humano."