[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗੁ ਗੋਂਡ ਅਸਟਪਦੀਆ ਮਹਲਾ ੫ ਘਰੁ ੨ ॥"
page = 869
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rag Gond Ashtpadis 5th Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਗੋਂਡ ਅਸ਼ਟਪਦੀਆਂ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Gond, Ashtpadheeyaa, Fifth Mehl, Second House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਗੋਂਡ, ਘਰ ੧ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਅੱਠ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Gond, Ashtapadis, Quinto Canal Divino."