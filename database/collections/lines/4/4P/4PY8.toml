[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਮ ਤਉ ਰਾਖਨਹਾਰ ਦਇਆਲ ॥"
page = 680
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou, O Lord, art my merciful Protector."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ, ਹੇ ਸੁਆਮੀ! ਮੇਰਾ ਮਿਹਰਬਾਨ ਰਖਿਅਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my Merciful Protector, Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਿਗੁਰੂ! ਤੁਮ ਤੋ ਦਿਆਲ ਹੋ ਕਰ ਦਾਸੋਂ ਕੋ ਰਾਖਣੇਹਾਰੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਇਆ ਦੇ ਘਰ ਪ੍ਰਭੂ! ਤੂੰ ਤਾਂ (ਸਭ ਜੀਵਾਂ ਦੀ) ਰੱਖਿਆ ਕਰਨ ਦੀ ਸਮਰਥਾ ਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਖਨਹਾਰ = ਰੱਖਿਆ ਕਰਨ ਦੀ ਸਮਰਥਾ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú eres mi Único Señor Bondadoso, Tú me proteges."