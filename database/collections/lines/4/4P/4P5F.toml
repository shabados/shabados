[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਝਾਲਾਘੇ. ਉਠਿ ਨਾਮੁ ਜਪਿ; ਨਿਸਿ ਬਾਸੁਰ ਆਰਾਧਿ ॥"
page = 255
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rise early in the morning, repeat the Name, and night and day meditate on the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਮ੍ਰਿਤ ਵੇਲੇ ਜਾਗ, ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰ ਅਤੇ ਰਾਤ ਦਿਨ ਸਾਹਿਬ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Rise early in the morning, and chant the Naam; worship and adore the Lord, night and day."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਬ (ਝਾਲਾਘੇ) ਸਵੇਰੇ ਉਠੇ ਤੌ ਵਾਹਿਗੁਰੂ ਨਾਮ ਕੋ ਜਪਣਾ ਕਰੁ। ਇਸੀ ਤਰ੍ਹਾਂ (ਨਿਸਿ ਬਾਸੁਰ) ਰਾਤਿ ਦਿਨ ਪਰਮੇਸ੍ਵਰ ਕੇ ਨਾਮ ਕੋ (ਆਰਾਧਿ) ਸੇਵਨ ਕਰਤਾ ਰਹੁ॥ ਤਿਸ ਕਾ ਫਲੁ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਅੰਮ੍ਰਿਤ ਵੇਲੇ ਉੱਠ ਕੇ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਜਪ (ਇਤਨਾ ਹੀ ਨਹੀਂ) ਦਿਨ ਰਾਤ (ਹਰ ਵੇਲੇ) ਯਾਦ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਝਾਲਾਘੇ = ਸਵੇਰੇ, ਅੰਮ੍ਰਿਤ ਵੇਲੇ। ਉਠਿ = ਉਠ ਕੇ। ਨਿਸਿ = ਰਾਤ। ਬਾਸੁਰ = ਦਿਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Levántate temprano y medita en el Naam, el Nombre del Señor, habita en Él noche y día,"