[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦ ਸਹਜ ਰਸ; ਸੂਖ ਘਨੇਰੇ ॥"
page = 1340
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Joy, poise, pleasure and peace he has in plenty."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੁਸ਼ੀ ਅਡੋਲਤਾ, ਮੌਜ ਬਹਾਰ ਅਤੇ ਆਰਾਮ ਉਸ ਦੇ ਕੋਲ ਬਹੁਤ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They are blessed with abundant bliss, happiness, pleasure and peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨੋਂ ਕੋ ਨਾਮ ਕੇ ਰਸ ਕਰ (ਸਹਜ) ਆਤਮਅਨੰਦ ਹੋਣੇ ਸੇ ਬਹੁਤ ਹੀ ਸੁਖ ਪ੍ਰਾਪਤਿ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹਨਾਂ ਦੇ ਅੰਦਰ) ਆਤਮਕ ਅਡਲੋਤਾ ਦੇ ਅਨੇਕਾਂ ਆਨੰਦ ਤੇ ਸੁਖ ਬਣੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਦ = ਆਨੰਦ। ਸਹਜ = ਆਤਮਕ ਅਡੋਲਤਾ। ਘਨੇਰੇ = ਬਹੁਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Son Bendecidos con un Éxtasis Desbordante, Felicidad, Placer y Paz,"