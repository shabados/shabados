[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿ ਬਚਨ; ਸਾਧੂ ਉਪਦੇਸ ॥"
page = 284
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True are the words and instruction of the saint."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਹਨ ਸੰਤ ਦੇ ਸ਼ਬਦ ਅਤੇ ਸਿੱਖਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "True are the Teachings, and the Instructions of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨੋਂ ਕੇ ਉਪਦੇਸ਼ ਕੇ ਬਚਨ ਭੀ ਸਤਿ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦਾ ਉਪਦੇਸ਼ ਅਟੱਲ ਬਚਨ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Santos nos instruyen en la Palabra Verdadera, porque aquéllos en que Dios habita, son Verdad."