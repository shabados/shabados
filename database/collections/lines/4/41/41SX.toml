[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਿਉ ਪੁਤੁ ਮਾਵੜ ਧੀਅੜੀ; ਹੋਇ ਭੈਣ ਭਿਰਾਵਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Father, son, mother, daughter, sister, brother are there."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੁੱਤ੍ਰ ਪਿਉ ਦਾ, ਮਾਂ ਧੀ ਦਾ, ਭੈਣ ਭਿਰਾਉ ਦਾ।"