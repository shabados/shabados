[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਪ ਪੁੰਨ; ਤਬ. ਕਹ ਤੇ ਹੋਤਾ ॥"
page = 290
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then, by whom were the bad acts and the good ones committed?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਦੋਂ ਮੰਦੇ ਕਰਮ ਤੇ ਚੰਗੇ ਅਮਲ ਕਿਸ ਕੋਲੋ ਹੁੰਦੇ ਸਨ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "who then committed sins and performed good deeds?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਪਾਪ ਔਰ ਪੁੰਨ ਕਹਾਂ ਸੇ ਹੋਤਾ ਥਾ, ਭਾਵ ਪਾਪ ਪੁੰਨ ਕਾ ਕਛੁ ਬਿਵਹਾਰ ਨਹੀਂ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਪਾਪ ਜਾਂ ਪੁੰਨ ਕਿਸ (ਜੀਵ) ਤੋਂ ਹੋ ਸਕਦਾ ਸੀ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹ ਤੇ = ਕਿਸ (ਜੀਵ) ਤੋਂ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿dónde estaba lo bueno y lo malo?"