[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਯੁਧ ਬਹੁਰਿ ਬਖਾਨੀਐ; ਨਾਮ ਬਾਨ ਕੇ ਮਾਨ ॥੧੨੬॥"
page = 723

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Uttering the words “Shambrai and Tripurari” and then adding the word “Aayudh”, the names of Baan are known.126."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਿਰ 'ਆਯੁਧ' ਸ਼ਬਦ ਕਥਨ ਕਰੋ। (ਇਨ੍ਹਾਂ ਨੂੰ) ਬਾਣ ਦੇ ਨਾਮ ਮੰਨ ਲਵੋ ॥੧੨੬॥"