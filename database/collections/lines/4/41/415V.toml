[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਸਿਉ; ਰਚਿ ਰਹੇ ਹਾਂ ॥"
page = 410
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To which thou art attached,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਨਾਲ ਤੂੰ ਚਿਮੜੀ ਹੋਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever you are attached to,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਪਦਾਰਥੋਂ ਕੇ ਸਾਥ ਜੀਵ ਰਚ ਰਹੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੈਥੋਂ ਪਹਿਲਾਂ ਇਥੇ ਆਏ ਹੋਏ ਜੀਵ) ਜਿਸ ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਫਸੇ ਰਹੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਸਿਉ = ਜਿਸ (ਮਾਇਆ) ਨਾਲ। ਰਚਿ ਰਹੇ = ਮਸਤ ਰਹੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo que sea a lo que estás apegada"