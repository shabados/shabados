[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਕਰਿ ਕਰਿ ਵੇਖਹਿ; ਜਾਣਹਿ ਸੋਇ ॥"
page = 123
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou alone doest, beholdest and knowest well Thine doings."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤੂੰ ਹੀ ਆਪਦੇ ਕੰਮਾਂ ਨੂੰ ਕਰਦਾ ਦੇਖਦਾ ਅਤੇ ਚੰਗੀ ਤਰ੍ਰਾਂ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the One who does, sees, and knows."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰ ਕੋ ਰਚ ਰਚ ਕਰ ਵੇਖਤਾ ਹੈਂ ਪੁਨਾ ਤੂੰ (ਸੋਇ) ਸਭ ਕੇ ਕਰਮੋਂ ਕੋ ਜਾਨਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ (ਜਗਤ) ਪੈਦਾ ਕਰ ਕੇ (ਉਸ ਦੀ) ਸੰਭਾਲ (ਭੀ) ਕਰਦਾ ਹੈਂ, ਤੂੰ (ਹਰੇਕ ਦੇ ਦਿਲ ਦੀ) ਜਾਣਦਾ ਭੀ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵੇਖਹਿ = ਵੇਖਦਾ ਹੈਂ, ਸੰਭਾਲ ਕਰਦਾ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "solamente Tú haces, ves y conoces Tus Hechos."