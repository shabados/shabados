[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਉਨੁ ਸੁ ਦੂਜਾ; ਤਿਸੁ ਸਮਝਾਏ ॥"
page = 1043
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who else can instruct him?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੋਰ ਕਿਹੜਾ ਉਸ ਨੂੰ ਸਿੱਖਮਤ ਦੇ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who else can teach him anything?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਕੌਨ ਉਸ ਸਰੀਖਾ ਦੂਸਰਾ ਹੈ, ਜੋ ਤਿਸ ਕੋ ਸਮਝਾਵੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਤੋਂ ਬਿਨਾ ਹੋਰ ਕੋਈ ਨਹੀਂ ਜੋ ਸਹੀ ਰਸਤਾ ਦੱਸ ਸਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y no hay nadie más que te pueda instruir,"