[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇਈ ਸਾਹ. ਭਗਵੰਤ ਸੇ; ਸਚੁ ਸੰਪੈ ਹਰਿ ਰਾਸਿ ॥"
page = 250
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They are rich and they are fortunate, who have the wealth of Truth and the capital of God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਦੌਲਤਮੰਦ ਹਨ ਅਤੇ ਉਹੀ ਭਾਗਾਂ ਵਾਲੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਦੇ ਕੋਲ ਸੱਚ ਦੀ ਦੌਲਤ ਅਤੇ ਰੱਬ ਦੀ ਨਾਮ ਦੀ ਪੂੰਜੀ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who gather Truth, and the riches of the Lord's Name, are rich and very fortunate."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੀ ਸ਼ਾਹੂਕਾਰ (ਭਗਵੰਤ ਸੇ) ਭਾਗੋਂ ਵਾਲੇ, ਵਾ ਭਗਵੰਤ ਕਾ ਸ੍ਵਰੂਪ ਹੈ ਜਿਨ ਕੇ ਪਾਸ ਸਚੇ ਹਰਿ ਨਾਮ ਰੂਪਿ ਸੰਪਤਾਦੀ (ਰਾਸਿ) ਪੂੰਜੀ ਅਰਥਾਤ ਸਰਧਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੀਵ ਜਗਤ ਵਿਚ ਹਰਿ-ਨਾਮ ਦਾ ਵਣਜ ਕਰਨ ਆਏ ਹਨ) ਜਿਨ੍ਹਾਂ ਪਾਸ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਧਨ ਹੈ, ਹਰੀ ਦਾ ਨਾਮ (ਵਣਜ ਕਰਨ ਲਈ) ਪੂੰਜੀ ਹੈ, ਉਹੀ ਸਾਹੂਕਾਰ ਹਨ, ਉਹੀ ਧਨ ਵਾਲੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਈ = ਉਹੀ ਬੰਦੇ। ਭਗਵੰਤ = ਧਨ ਵਾਲੇ। ਸੇ = ਉਹੀ ਬੰਦੇ। ਸੰਪੈ = ਧਨ। ਰਾਸਿ = ਪੂੰਜੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo serán ricos en verdad, los que guarden el Tesoro del Nombre del  Señor."