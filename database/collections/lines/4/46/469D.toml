[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਿ ਮਨ; ਸਿਰੀ ਰਾਮੁ ॥"
page = 1202
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man, contemplate thou thy Revered Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੰਦੇ! ਤੂੰ ਆਪਣੇ ਪੂਜਯ ਪ੍ਰਭੂ ਦਾ ਭਜਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, meditate on the Supreme Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਸ੍ਰੀ ਰਾਮ ਕੋ ਜਪ॥☬ਜੇ ਕਹੇ ਕੈਸਾ ਹੈ ਰਾਮ? ਸੋ ਕਹੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਮਨ! ਸ੍ਰੀ ਰਾਮ (ਦਾ ਨਾਮ) ਜਪਿਆ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, medita en el Señor Supremo,"