[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨੁ ਬਸਿ ਆਵੈ. ਨਾਨਕਾ; ਜੇ. ਪੂਰਨ ਕਿਰਪਾ ਹੋਇ ॥੧੦॥"
page = 298
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak man's mind is controlled if the Lord shows His perfect mercy unto him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਬੰਦੇ ਦਾ ਮਨੂਆ ਤਾਂ ਕਾਬੂ ਵਿੱਚ ਆਉਂਦਾ ਹੈ, ਜੇਕਰ ਸਾਈਂ ਉਸ ਉਤੇ ਆਪਣੀ ਮੁਕੰਮਲ ਮਿਹਰ ਧਾਰੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mind comes to be controlled, O Nanak, if He grants His Perfect Grace. ||10||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮਨ ਤੌ ਬਸ ਆਵਤਾ ਹੈ ਜੇ ਅਤੀ ਕ੍ਰਿਪਾ ਹੋਵੇ, ਵਾ ਪੂਰਨ ਪਰਮੇਸ੍ਵਰ ਕੀ ਕ੍ਰਿਪਾ ਹੋਵੇ॥੧੦॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨ ਤਦੋਂ ਹੀ ਵੱਸ ਵਿਚ ਆਉਂਦਾ ਹੈ ਜੇ ਸਭ ਗੁਣਾਂ ਦੇ ਮਾਲਕ ਪਰਮਾਤਮਾ ਦੀ (ਆਪਣੀ) ਮਿਹਰ ਹੋਵੇ ॥੧੦॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਸਿ = ਵੱਸ ਵਿਚ ॥੧੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La mente puede ser controlada , Oh Nanak, si El nos concede Su Misericordia (10)"