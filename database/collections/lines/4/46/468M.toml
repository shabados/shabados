[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੀਠੇ ਹਰਿ ਗੁਣ, ਗਾਉ ਜਿੰਦੂ; ਤੂੰ ਮੀਠੇ ਹਰਿ ਗੁਣ ਗਾਉ ॥"
page = 218
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sing thou the sweet praises of God, O my soul, sing thou the sweet praises of God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੀ ਮਿਠੜੀ ਉਸਤਤੀ ਗਾਇਨ ਕਰ, ਹੇ ਮੇਰੀ ਜਿੰਦੇ! ਤੂੰ ਵਾਹਿਗੁਰੂ ਦੀ ਮਿਠੜੀ ਉਸਤਤੀ ਗਾਇਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sing the Sweet Praises of the Lord, O my soul, sing the Sweet Praises of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੁਧੀ! ਵਾ ਹੇ ਪਿਆਰਿਓ! ਰਸਦਾਇਕ ਜੋ ਹਰੀ ਕੇ ਗੁਣ ਹੈਂ, ਸੋ ਮਨ ਬਾਣੀ ਕਰ ਕੇ ਤੂੰ ਗਾਇਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ! ਤੂੰ ਹਰੀ ਦੇ ਪਿਆਰੇ ਲੱਗਣ ਵਾਲੇ ਗੁਣ ਗਾ, ਹਰੀ ਦੇ ਪਿਆਰੇ ਲੱਗਣ ਵਾਲੇ ਗੁਣ ਗਾਂਦੀ ਰਿਹਾ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿੰਦੂ = ਹੇ ਜਿੰਦੇ! {ਲਫ਼ਜ਼ 'ਜਿੰਦੁ' ਉਕਰਾਂਤ ਹੈ ਤੇ ਇਸਤ੍ਰੀ ਲਿੰਗ ਹੈ। ਸੰਬੋਧਨ ਵਿਚ ਜਾਂ ਸੰਬੰਧਕ ਦੇ ਨਾਲ ਇਸ ਦਾ (ੁ) ਦੀਰਘ ਹੋ ਜਾਂਦਾ ਹੈ। ਇਸੇ ਤਰ੍ਹਾਂ ਲਫ਼ਜ਼ ਖ਼ਾਕੁ ਹੈ, 'ਖਾਕੁ' ਤੋਂ 'ਖਾਕੂ'। 'ਜਿੰਦੂ ਕੂੰ'}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi vida, canta la Dulce Alabanza del Señor."