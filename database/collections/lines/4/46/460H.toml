[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਰਿ ਕਹਿ ਸਭ ਹੀ ਬਾਨ ਕੇ; ਲੀਜੋ ਨਾਮ ਪਛਾਨ ॥੨੧੨॥"
page = 727

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Recognise all the names of Baan by saying “Jalchar” in the beginning, then adding and uttering the words “Chakshu and Ari”.212."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਫਿਰ) 'ਅਰਿ' ਸ਼ਬਦ ਕਹਿ ਦਿਓ। (ਇਹ) ਬਾਣ ਦੇ ਨਾਮ ਸਮਝ ਲਵੋ ॥੨੧੨॥"