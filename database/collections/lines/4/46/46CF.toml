[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਸਨ ਕੋਟ ਕਰੇ ਅਸਟਾਂਗ; ਧਰੇ ਬਹੁ ਨਿਆਸ, ਕਰੇ ਮੁਖ ਕਾਰੇ ॥"
page = 37

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Adopting millions of postures and observing the eight steps of Yoga, touching the limbs while reciting the mantras and blackening the face."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਰੋੜਾਂ ਆਸਨ ਕਰੇ, ਜੋਗ ਦੇ ਅੱਠ ਅੰਗ ਧਾਰਨ ਕਰੇ, ਬਹੁਤ ਤਿਆਗ ਕਰੇ ਅਤੇ (ਦੀਵਾਨੇ ਸਾਧੂਆਂ ਵਾਂਗ) ਮੂੰਹ ਕਾਲੇ ਕਰੇ;"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਆਸਨ ਕੋਟਿ ਕਰੇ ਅਸਟਾਂਗ; ਧਰੇ ਬਹੁ ਨਿਆਸ, ਕਰੇ ਮੁਖ ਕਾਰੇ ॥"