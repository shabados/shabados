[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਿ ਜਪਿ ਤੁਧੁ ਨਿਰੰਕਾਰ; ਭਰਮੁ ਭਉ ਖੋਵਣਾ ॥"
page = 523
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By continuously meditating on Thee, O formless Lord, my doubt and dread are dispelled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਇਕ ਰਸ ਆਰਾਧਨ ਕਰਨ ਦੁਆਰਾ, ਹੇ ਸਰੂਪ-ਰਹਿਤ ਸੁਆਮੀ ਮੇਰਾ ਸੰਦੇਹ ਅਤੇ ਡਰ ਦੂਰ ਹੋ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By continually meditating on You, O Formless Lord, my doubts and fears are dispelled."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਿਰੰਕਾਰ! ਤੇਰਾ ਨਾਮ ਜਪ ਜਪ ਕਰ ਕੇ ਜਿਤਨੇ ਭਰਮ ਔਰ ਜਨਮਾਦਿ ਭ੍ਯ ਹੈਂ ਸਭ ਕੋ ਖੋਨਾ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ, ਹੇ ਨਿਰੰਕਾਰ! ਤੈਨੂੰ ਸਿਮਰ ਸਿਮਰ ਕੇ ਭਟਕਣਾ ਤੇ ਡਰ ਦੂਰ ਕਰ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰੰਕਾਰ = ਹੇ ਨਿਰੰਕਾਰ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Contemplándote, oh Señor Absoluto, mi duda y mi miedo desaparecen."