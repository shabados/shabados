[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕਉ; ਕਹਾ ਬਿਆਪੈ ਮਾਇ ॥"
page = 182
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How can mammon cling to them."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਉਨ੍ਹਾਂ ਨੂੰ ਕਿਸ ਤਰ੍ਹਾਂ ਚਿਮੜ ਸਕਦੀ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How can Maya torment them?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੋ ਮਾਯਾ ਕਹਾਂ ਬਿਆਪਤੀ ਹੈ, ਅਰਥਾਤ ਨਹੀਂ ਬਿਆਪਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਉਤੇ ਮਾਇਆ ਆਪਣਾ ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕਉ = ਉਹਨਾਂ ਨੂੰ। ਮਾਇ = ਮਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cómo puede Maya entonces afectarlos?"