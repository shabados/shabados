[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੁ ਬ੍ਰਹਮ ਬਿਚਾਰੁ. ਸੁ ਜਾਨੈ ॥"
page = 623
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone knows the Divine reality,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹੀ, ਈਸ਼ਵਰੀ ਗਿਆਨ ਨੂੰ ਜਾਣਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone knows this about God,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਬੇਦ ਕੇ ਸਿਧਾਂਤ ਕੋ ਸੋ ਜਾਨੈਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਨਾਲ ਮਿਲਾਪ ਦੀ ਇਸ ਵਿਚਾਰ ਨੂੰ ਉਹ ਮਨੁੱਖ ਸਮਝਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬ੍ਰਹਮ ਬਿਚਾਰੁ = ਪਰਮਾਤਮਾ ਨਾਲ ਸਾਂਝ ਦੀ ਸੋਚ। ਸੁ = ਉਹ ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo conoce la Sabiduría del Señor aquél al que el Señor"