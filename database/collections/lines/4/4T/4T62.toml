data = "ਤੇਰੇ ਮੁਖੜੇ ਦੇ ਸਾ੍ਹਮਨੇ ਚੰਨ ਵੀ ਸ਼ਰਮਿੰਦਾ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਬਦਰ ਪੇਸ਼ਿ ਰੂਇ ਤੂ ਸ਼ਰਮਿੰਦਾ ਅਸਤ ॥"

