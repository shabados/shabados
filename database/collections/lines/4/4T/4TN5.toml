[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਕਬਿਤ ਕਾਬਿ ਮੈ ਚਹੋ ਤਹਾ ਤੇ ਦੀਜੀਐ ॥੧੧੪੧॥"
page = 792

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Kaarmukjani”, add the word “arini” at the end and know all the names of Tupak.1141."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਬਿੱਤਾ ਵਿਚ ਕਵੀਓ! ਚਾਹੋ, ਉਥੇ ਵਰਤੋ ॥੧੧੪੧॥"