[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੇ ਭਗਤ; ਸਦਾ ਸੁਖਵਾਸੀ ॥"
page = 1076
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's devotees ever abide in peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਸਰਧਾਲੂ ਹਮੇਸ਼ਾਂ ਆਰਾਮ ਵਿੱਚ ਵੱਸਦੇ ਹਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The devotees of the Lord dwell forever in peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਕੇ ਜੋ ਭਗਤ ਹੈਂ, ਸੋ ਅਚੁਤ ਸੁਖ ਕੇ ਵਾਸੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਭਗਤ ਸਦਾ ਆਤਮਕ ਆਨੰਦ ਮਾਣਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਖ ਵਾਸੀ = ਆਤਮਕ ਆਨੰਦ ਵਿਚ ਟਿਕੇ ਰਹਿਣ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Devotos del Señor están siempre en Éxtasis."