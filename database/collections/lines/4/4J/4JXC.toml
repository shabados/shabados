[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਵਣ ਕਥਾ ਲੇ; ਰਹਹੁ ਨਿਰਾਲੇ ॥"
page = 942
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Q. 47: Who is thy Guru, of whom thou art the disciple?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰ. 47: ਤੇਰਾ ਗੁਰੂ ਕੌਣ ਹੈ, ਜਿਸ ਦਾ ਤੂੰ ਮੁਰੀਦ ਹੈਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What is that speech, by which you remain unattached?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੌਨ ਸੀ ਕਥਾ ਲੇ ਕਰ ਅਰਥਾਤ ਸਮਝ ਕਰ ਨਿਰਾਲੇ ਰਹਿਤੇ ਹੋ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੇਹੜੀ ਗੱਲ ਨਾਲ ਤੂੰ ਨਿਰਲੇਪ ਰਹਿੰਦਾ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਥਾ = ਗੱਲ। ਕਵਣ ਕਥਾ ਲੇ = ਕੇਹੜੀ ਗੱਲ ਨਾਲ। ਨਿਰਾਲੇ = ਵੱਖਰੇ, ਨਿਰਲੇਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Quién es el Guru al que tú sigues?"