[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਨ ਕਮਲ ਬਸੇ; ਮੇਰੇ ਮਨ ਕੇ ॥"
page = 900
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Lord's lotus-feet abide in my mind,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਸੁਆਮੀ ਦੇ ਕੰਵਲ ਪੈਰ ਮੇਰੇ ਹਿਰਦੇ ਅੰਦਰ ਟਿੱਕ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His lotus feet dwell within my mind,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਮੇਰੇ ਮਨ ਕੇ ਬੀਚ ਸਤਿਗੁਰੋਂ ਕੇ ਚਰਨ ਕਮਲ ਬਸੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਿਆਰੇ ਗੁਰੂ ਦੇ ਸੋਹਣੇ ਚਰਨ (ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ) ਆ ਵੱਸਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੇਰੇ = ਮੇਰੇ (ਗੁਰੂ) ਦੇ। ਚਰਨ ਕਮਲ = ਸੋਹਣੇ ਚਰਨ। ਮਨ ਕੇ ਤਨ ਕੇ ਸਗਲੇ"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En mi mente habitan los Pies de Loto del Señor,"