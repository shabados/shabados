[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਸੇਈ ਜਨ ਪੂਰੇ ॥੭॥"
page = 286
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "says Nanak, they are the perfect persons."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਫੁਰਮਾਉਂਦੇ ਹਨ, ਉਹ ਪੂਰਨ ਪੁਰਸ਼ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- says Nanak, they are the perfect persons. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਸੋਈ ਜਨ ਪੂਰੇ ਪੁਰਖ ਹੈਂ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਉਹ ਮਨੁੱਖ ਪੂਰੇ ਭਾਂਡੇ ਹਨ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "puede, en verdad, ser considerado como un Ser Perfecto. (7)"