[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਧੁ ਭਾਵੈ; ਤਾ ਸਚੁ ਵਖਾਣੀ ॥"
page = 180
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If it pleases Thee, I tell the truth, then."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "੍ਰਜੇਕਰ ਤੈਨੂੰ ਚੰਗਾ ਲਗੇ ਤਦ ਹੀ ਮੈਂ ਸੱਚ ਬੋਲਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If it pleases You, then I speak the Truth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੇਰੇ ਕੋ ਭਾਈਏ ਤੌ ਸਚ ਬੋਲੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੈਨੂੰ ਪਸੰਦ ਆਵੇ ਤਾਂ ਮੈਂ ਤੇਰਾ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਨਾਮ ਉਚਾਰ ਸਕਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੁ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਨਾਮ। ਵਖਾਣੀ = ਮੈਂ ਉਚਾਰਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "hablo de Tu Verdad."