type = "primary"
data = "ਕਾਲ ਪੁਰਖ ਮੋ ਰਹਤ ਸਮਾਈ ॥੪॥"
page = 190

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After removing the lord of the earth, he goes again to the abode of gods and merges himself in the Destroyer Lord.4."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ 'ਕਾਲ-ਪੁਰਖ' ਵਿਚ ਅਭੇਦ ਹੋਇਆ ਰਹਿੰਦਾ ਹੈ ॥੪॥"