data = "ਹੋਤ ਭਸਮ ਅਨੇਕ ਬਿੰਜਨ; ਲਪਟ ਝਪਟ ਕਰਾਲ ॥੪॥੧੪੫॥"
page = 140

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many materials were reduced to ashes by the dreadful flame.4.145."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਭਿਆਨਕ (ਅਗਨੀ ਦੀ) ਲਾਟ ਵਿਚ ਅਨੇਕ ਪਦਾਰਥ ਭਸਮ ਹੋ ਰਹੇ ਸਨ ॥੪॥੧੪੫॥"