[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਜੀ; ਤੂ ਮੇਰੋ ਠਾਕੁਰੁ ਨੇਰੋ ॥"
page = 618
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My beloved Lord, ever abide near me, O my Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਮਹਾਰਾਜ ਸੁਆਮੀ, ਤੂੰ ਸਦਾ ਮੇਰੇ ਨੇੜੇ ਵਸਦਾ ਹੈਂ ਹੇ ਮੇਰੇ ਮਾਲਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my Dear Lord God Master, You are always near me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸ੍ਵਾਮੀ ਪ੍ਰਭੂ ਜੀ! ਤੁਮ ਮੇਰੇ ਸਮੀਪ ਵਰਤੀ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਜੀ! ਤੂੰ ਮੇਰਾ ਪਾਲਣਹਾਰਾ ਮਾਲਕ ਹੈਂ, ਮੇਰੇ ਅੰਗ-ਸੰਗ ਵੱਸਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਕੁਰੁ = ਪਾਲਣਹਾਰ। ਨੇਰੋ = ਨੇੜੇ, ਅੰਗ-ਸੰਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, ¡Tu Presencia está siempre tan cerca!"