[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਬ ਨਰਕ ਸੁਰਗ; ਕਹੁ ਕਉਨ ਅਉਤਾਰ ॥"
page = 291
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "say, then who did enter hell or paradise?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਦਸੋ ਕੌਣ ਦੋਜਖ ਤੇ ਬਹਿਸ਼ਤ ਵਿੱਚ ਪੈਦਾ ਸੀ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then who entered hell, and who entered heaven?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਨਰਕ ਔਰ ਸ੍ਵਰਗ ਕੋ ਭੋਗਨੇਹਾਰਾ ਕਹੋ ਤੌ ਕੌਨ ਜਨਮ ਧਾਰੀ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਦੱਸੋ, ਨਰਕਾਂ ਤੇ ਸੁਰਗਾਂ ਵਿਚ ਆਉਣ ਵਾਲੇ ਕੇਹੜੇ ਜੀਵ ਸਨ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਉਤਾਰ = ਜਨਮ ਲੈਣ ਵਾਲੇ, ਉਤਰਨ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿quién podía ser enviado al cielo o a la oscuridad de la conciencia?"