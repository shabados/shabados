[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰਾ ਜਨੁ; ਨਿਰਤਿ ਕਰੇ ਗੁਨ ਗਾਵੈ ॥"
page = 381
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thy slave dances and sings Thine excellences."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਗੋਲਾ ਨੱਚਦਾ ਅਤੇ ਤੇਰੀਆਂ ਸ਼੍ਰੇਸ਼ਟਤਾਈਆਂ ਗਾਇਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your humble servant dances and sings Your Glorious Praises."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਅਕਾਲ ਪੁਰਖ! ਤੇਰਾ ਭਗਤ ਜਨ ਨਿਰਤਿ ਕਰਤਾ ਹੈ ਔਰ ਗੁਨ ਗਾਉਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! (ਦੇਵੀ ਦੇਵਤਿਆਂ ਦੇ ਭਗਤ ਆਪਣੇ ਇਸ਼ਟ ਦੀ ਭਗਤੀ ਕਰਨ ਵੇਲੇ ਉਸ ਦੇ ਅੱਗੇ ਨਾਚ ਕਰਦੇ ਹਨ, ਪਰ) ਤੇਰਾ ਭਗਤ ਤੇਰੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੇ ਗੀਤ ਗਾਂਦਾ ਹੈ (ਇਹ, ਮਾਨੋ) ਉਹ ਨਾਚ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਤਿ = ਨਾਚ, ਭਗਤੀ ਦਾ ਨਾਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así Tu hombre, oh Señor, baila y canta Tu Alabanza;"