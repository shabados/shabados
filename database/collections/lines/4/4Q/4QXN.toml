[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕੇ ਦੋਖੀ ਕੀ; ਪੁਜੈ ਨ ਆਸਾ ॥"
page = 280
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The hope of the maligner of the saint is not fulfilled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਤੇ ਊਝ ਲਾਉਣ ਵਾਲੇ ਦੀ ਉਮੀਦ ਪੂਰੀ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The hopes of the slanderer of the Saint are not fulfilled."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਕੇ ਦੋਖੀ ਕੀ ਆਸਾ ਪੂਰਨ ਨਹੀਂ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਦੇ ਨਿੰਦਕ ਦੀ ਆਸ ਕਦੇ ਸਿਰੇ ਨਹੀਂ ਚੜ੍ਹਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੁਜੈ ਨ = ਸਿਰੇ ਨਹੀਂ ਚੜ੍ਹਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ninguna de las esperanzas del calumniador del Santo son realizadas"