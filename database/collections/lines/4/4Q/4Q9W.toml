[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਤੂ ਕਰਹਿ; ਸੋਈ ਪ੍ਰਭ ਹੋਈ ॥"
page = 998
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever Thou do, O Lord, that alone comes to pass."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਛ ਤੂੰ ਕਰਦਾ ਹੈ, ਹੇ ਸਾਈਂ! ਕੇਵਲ ਉਹ ਹੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever You do, God, that alone comes to pass."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜੋ ਤੂੰ ਕਰਤਾ ਹੈਂ, ਸੋ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਜੋ ਕੁਝ ਕਰਦਾ ਹੈਂ ਉਹੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sólo ocurre lo que Tú haces."