data = "ਗਹਿ ਬਹਿਯਾ ਸਭ ਸਦਨ ਦਿਖਾਯੋ ॥"
page = 914

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Now she sent a maid to call Raja. Leading him, she took him around the whole household (and said),"

[[content]]
