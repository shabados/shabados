[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਤਨ ਪਦਾਰਥ; ਹਰਿ ਨਾਮੁ ਤੁਮਾਰਾ ਜੀਉ ॥"
page = 217
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wealth of jewels is Thy Name, O Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਵਾਹਿਰਾਤਾਂ ਦੀ ਦੌਲਤ ਹੈ, ਤੇਰਾ ਨਾਮ, ਹੇ ਮਾਲਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your Name is the treasure of jewels, Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਤੇਰਾ ਨਾਮ ਰਤਨ ਪਦਾਰਥ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮੇਰੇ ਪਿਆਰੇ ਸੱਜਣ ਪ੍ਰਭੂ! ਹੇ ਹਰੀ! ਤੇਰਾ ਨਾਮ ਕੀਮਤੀ ਪਦਾਰਥਾਂ (ਦਾ ਸੋਮਾ) ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tu Nombre, oh Señor, es la Joya Preciosa;"