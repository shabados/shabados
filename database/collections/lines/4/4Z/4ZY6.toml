[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਰਮ ਰਾਇ; ਤਿਸੁ ਕਰੇ ਖੁਆਰੀ ॥"
page = 278
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Righteous Judge will disgrace him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਰਮ ਰਾਜਾ ਉਸ ਨੂੰ ਖੱਜਲ-ਖੁਆਰ ਕਰੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the Righteous Judge of Dharma shall expose his disgrace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪੁਰਸ਼ ਕੀ ਧਰਮ ਰਾਜਾ ਖੁਆਰੀ ਕਰਤਾ ਅਰਥਾਤ ਦੂਖ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਧਰਮਰਾਜ (ਅੰਤ ਵੇਲੇ) ਉਸ ਦੀ ਮਿੱਟੀ ਪਲੀਤ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Al soberbio no le interesan los demás,"