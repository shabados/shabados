[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਰਖ ਕੀ ਛਾਇਆ ਸਿਉ; ਰੰਗੁ ਲਾਵੈ ॥"
page = 268
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man falls in love with the shade of the tree,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਨਸਾਨ ਦਰਖਤ ਦੀ ਛਾਂ ਨਾਲ ਪ੍ਰੀਤਿ ਪਾ ਲੈਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "People fall in love with the shade of the tree,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਜੇ ਕੋਈ ਬਿਰਛ ਕੀ ਛਾਇਆ ਕੇ ਸਾਥ (ਰੰਗ) ਪ੍ਰੇਮ ਲਗਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇ ਕੋਈ ਮਨੁੱਖ) ਰੁੱਖ ਦੀ ਛਾਂ ਨਾਲ ਪਿਆਰ ਪਾ ਬੈਠੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਰਖ = ਰੁੱਖ। ਰੰਗੁ = ਪਿਆਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y así como pronto se desvanece la pasajera sombra de un árbol,"