[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੁਰੰਤ ਘਾਟ ਅਉਘਟੇ; ਕਿ ਦੇਖਨੈ ਨ ਦੇਹਿੰਗੇ ॥੬॥"
page = 614

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That Lord with His Grace will save me and I shall never pass through any condition of suffering and hardship.6."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਔਖੀਆਂ ਘਟਨਾਵਾਂ ਨੂੰ ਨਹੀਂ ਘਟਣ ਦੇਣਗੇ ਅਤੇ (ਵੈਰੀ ਨੂੰ) ਦੇਖਣ ਵੀ ਨਹੀਂ ਦੇਣਗੇ ॥੬॥"