[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਵ ਖੰਡਨ ਦੁਖ ਭੰਜਨ ਸ੍ਵਾਮੀ; ਭਗਤਿ ਵਛਲ ਨਿਰੰਕਾਰੇ ॥"
page = 670
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Lord, is the Destroyer of fear, Remover of pain, the Lover of His saints and without form and feature."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਸਾਹਿਬ ਡਰ ਦੂਰ ਕਰਨਹਾਰ, ਪੀੜ ਹਰਤਾ, ਆਪਣੇ ਸੰਤਾਂ ਦਾ ਪ੍ਰੇਮੀ ਅਤੇ ਚੱਕਰ ਚਿਹਨ ਰਹਿਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Destroyer of fear, Remover of suffering, Lord and Master, Lover of Your devotees, Formless Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜਨਮੋਂ ਕੇ ਖੰਡਨ ਕਰਨੇ ਵਾਲੇ ਔਰ ਦੁਖੋਂ ਕੇ ਨਸਟ ਕਰਨੇ ਹਾਰੇ ਮੇਰੇ ਸ੍ਵਾਮੀ! ਹੇ ਭਗਤੋਂ ਕੇ (ਵਛਲ) ਪਿਆਰੇ ਨਿਰੰਕਾਰ! ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਜਨਮ ਮਰਨ ਦਾ ਗੇੜ ਨਾਸ ਕਰਨ ਵਾਲੇ! ਹੇ ਦੁੱਖਾਂ ਦੇ ਦੂਰ ਕਰਨ ਵਾਲੇ! ਹੇ ਮਾਲਕ! ਹੇ ਭਗਤੀ ਨਾਲ ਪਿਆਰ ਕਰਨ ਵਾਲੇ! ਹੇ ਆਕਾਰ-ਰਹਿਤ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਵ ਖੰਡਨ = ਹੇ ਜਨਮ ਮਰਨ (ਦੇ ਗੇੜ ਦਾ) ਨਾਸ ਕਰਨ ਵਾਲੇ! ਦੁਖ ਭੰਜਨ = ਹੇ ਦੁੱਖਾਂ ਦਾ ਨਾਸ ਕਰਨ ਵਾਲੇ! ਭਗਤਿ ਵਛਲ = ਹੇ ਭਗਤੀ ਨਾਲ ਪਿਆਰ ਕਰਨ ਵਾਲੇ! ਨਿਰੰਕਾਰੇ = ਹੇ ਆਕਾਰ-ਰਹਿਤ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres Tú el Destructor del dolor de nacimientos y muertes, y Amante de Tus Devotos, el Ser sin Forma;"