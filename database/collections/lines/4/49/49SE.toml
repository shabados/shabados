[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਆਕਲ ਹੋਇ ਫਹੀਮ, ਮਤੇ ਮਤਾਵਹੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Millions of people full of wisdom adopt many a resolution."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਕਈ) ਬੁੱਧੀਮਾਨ ਸੋਚ ਵਿਚਾਰ ਵਾਲੇ ਹੋਕੇ ਮਤੇ ਪਕਾਉਂਦੇ ਹਨ? (ਕਿ ਰਾਜ ਦੀ ਉੱਨਤੀ ਕਿੱਕੁਰਾਂ ਹੋਵੇ?)।"