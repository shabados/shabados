[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿ ਆਜ਼ਾਦਹੇ ਸ਼ਾਹੁ ਵ ਦੁਖ਼ਤਰ ਵਜ਼ੀਰ ॥੫੫॥"
page = 1419

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That the son of the king and the daughter of the minister are openly in love.(55)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਬਾਦਸ਼ਾਹ ਦਾ ਲੜਕਾ ਅਤੇ ਵਜ਼ੀਰ ਦੀ ਲੜਕੀ ਪੂਰੀ ਖੁਲ੍ਹ ਨਾਲ ਪ੍ਰੇਮ ਕਰਦੇ ਹਨ ॥੫੫॥"