[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੋਏ ਪ੍ਰਭੂ ਸਹਾਈ ॥"
page = 622
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord has become my Helper,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਮੇਰਾ ਸਹਾਇਕ ਹੋ ਗਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God became my helper and my best friend;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੁਮ ਜਿਸ ਕੇ ਸਹਾਈ ਹੂਏ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਜਿਸ ਮਨੁੱਖ ਦਾ ਮਦਦਗਾਰ ਬਣਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਾਈ = ਮਦਦਗਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor se volvió su Único Santuario"