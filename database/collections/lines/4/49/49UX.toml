[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੀਂਗਨ ਤੇ ਗਹਿ ਡਾਰ ਦਯੋ ਸੁ ਅਠਾਰਹ ਪੈਗ ਪੈ ਜਾਇ ਪਰਿਓ ਹੈ ॥"
page = 372

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Catching hold of his horns, Krishna threw him away at a distance of eighteen steps"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਿੰਗਾਂ ਤੋਂ ਪਕੜ ਕੇ (ਉਸ ਨੂੰ) ਸੁਟ ਦਿੱਤਾ ਜੋ ਅਠਾਰ੍ਹਾਂ ਕਦਮਾਂ ਉਤੇ ਜਾ ਕੇ ਡਿਗਿਆ।"