[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਿਨ ਏਕ ਗਏ ਬਨ ਕੋ ਹਰਿ ਜੀ; ਮਘਵਾ ਤਜਿ ਮਾਨ ਹਰੀ ਪਹਿ ਆਯੋ ॥"
page = 333

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "One day, when Krishna went to the forest, then casting away his pride,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਦਿਨ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਬਨ ਨੂੰ ਗਏ, ਤਦੋਂ ਇੰਦਰ (ਆਪਣਾ) ਅਭਿਮਾਨ ਤਿਆਗ ਕੇ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਕੋਲ ਆਇਆ।"