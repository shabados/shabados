[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਥਾਵਰ; ਥਿਰੁ ਕਰਿ ਰਾਖੈ ਸੋਇ ॥"
page = 344
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "On Saturday he who keeps stable,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਨਿੱਚਰਵਾਰ ਨੂੰ ਜੋ ਸਥਿਰ ਰੱਖਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "On Saturday, keep the candle of God's Light"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਨੀਚਰ ਦ੍ਵਾਰੇ ਕਹਤੇ ਹੈਂ: ਜੋ ਇੰਦ੍ਰੇ ਪੀਛੇ ਕਹੇ ਹੈਂ, ਸੋ ਤਿਨ ਕੋ (ਥਿਰੁ) ਰੋਕ ਰਖੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "('ਬਾਰ ਬਾਰ ਹਰਿ ਕੇ ਗੁਨ' ਗਾ ਕੇ, ਮਨੁੱਖ) ਉਸ ਜੋਤ ਨੂੰ ਆਪਣੇ ਅੰਦਰ ਸਾਂਭ ਕੇ ਰੱਖਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਥਾਵਰ-ਛਨਿਛਰ ਵਾਰ। ਥਿਰੁ-ਟਿਕਵਾਂ। ਸੋਇ-ਸੋ (ਜੋਤਿ ਦੀਵਟੀ),"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En sábado debemos conservar"