[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਭ ਸਿਧੀ ਇਹ ਬੁਝਿਆ; ਕਲਿ ਤਾਰਨਿ ਨਾਨਕ ਅਵਤਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "By this time all the siddhs understood that Nanak had come to earth to deliver it from the (sins of) kaliyug."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਸਿੱਧਾਂ ਨੇ (ਗੁਰੂ ਜੀ ਦੇ ਕਥਨ ਅਰ ਤੇਜ ਤੋਂ) ਇਹ ਬੁੱਝ ਲਿਆ ਸੀ ਕਿ ਕਲਜੁਗ ਦੇ ਤਾਰਣ ਨੂੰ (ਆਇਆ ਇਹ) ਨਾਨਕ (ਗੁਰ) ਅਵਤਾਰ ਹੋਣਾ ਹੈ।"