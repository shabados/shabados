[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੈ ਸਭਿ ਤਾਣਿ; ਸਚੈ ਸਭਿ ਜੋਰਿ ॥"
page = 463
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the True Lord is all power and all might."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਸਾਈਂ ਅੰਦਰ ਹੀ ਸਾਰੀ ਤਾਕਤ ਤੇ ਸਾਰੀ ਸ਼ਕਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the True Lord is all power, in the True Lord is all might."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ (ਤਾਣ) ਬਲ ਸਚੇ ਹੈਂ ਔ ਤੇਰੇ (ਜੋਰਿ) ਜੋੜ ਭੀ ਸਚੇ ਹੈਂ, ਭਾਵ ਜੈਸੇ ਤੈਨੇ ਅੰਗ ਪ੍ਰਤੰਗ ਰਚੇ ਹੈਂ ਤੈਸੇ ਹੀ ਠੀਕ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਖੰਡ, ਬ੍ਰਹਿਮੰਡ, ਲੋਕ, ਆਕਾਰ, ਜੀਅ ਜੰਤ ਆਦਿਕ) ਸਾਰੇ ਹੀ ਸੱਚੇ ਹਰੀ ਦੇ ਤਾਣ ਤੇ ਜ਼ੋਰ ਵਿਚ ਹਨ (ਭਾਵ, ਇਹਨਾਂ ਸਭਨਾਂ ਦੀ ਹਸਤੀ, ਸਭਨਾਂ ਦਾ ਆਸਰਾ ਪ੍ਰਭੂ ਆਪ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੈ = ਸੱਚੇ ਦੇ (ਵਿਚ)। ਤਾਣਿ = ਤਾਣ ਵਿਚ। ਸਚੈ ਜੋਰਿ = ਸੱਚੇ ਦੇ ਜੋਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "toda Majestad. Verdad es Tu Alabanza,"