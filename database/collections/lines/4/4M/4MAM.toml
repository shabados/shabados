[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮਕਲੀ ਮਹਲਾ ੫ ਛੰਤ ॥"
page = 924
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ramkali 5th Guru. Chhant."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਮਕਲੀ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ। ਛੰਤ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raamkalee, Fifth Mehl, Chhant:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਰਾਮਕਲੀ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਛੰਤ'।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ramkali, Mejl Guru Aryan, Quinto Canal Divino, Chhant."