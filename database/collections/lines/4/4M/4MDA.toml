[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤਰ ਕੀ ਗਤਿ; ਗੁਰਮੁਖਿ ਜਾਣੈ ॥"
page = 414
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The pious person knows the condition of his mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤ੍ਰ ਪੁਰਸ਼ ਆਪਣੇ ਮਨ ਦੀ ਹਾਲਤ ਨੂੰ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh knows the condition of his innermost being."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ (ਅੰਤਰਿ) ਭੇਦ ਕੀ ਗਤੀ ਗੁਰਮੁਖਿ ਜਾਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਐਸਾ ਮਨੁੱਖ (ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ) ਆਪਣੀ ਅੰਦਰਲੀ ਆਤਮਕ ਹਾਲਤ ਸਮਝ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਤਿ = ਆਤਮਕ ਅਵਸਥਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y a través del Guru, conoce el Estado de su yo interno."