[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁੰਦਰੀ ਭਵਨ ਚੌਦਹੂੰ ਜਾਨੀ ॥"
page = 1010

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Abhawatti, the Rani of Uddisa, was renown for her beauty in all the\r fourteen continents."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਆਪਣੀ) ਸੁੰਦਰਤਾ ਕਾਰਨ ਚੌਦਾਂ ਲੋਕਾਂ ਵਿਚ ਪ੍ਰਸਿੱਧ ਸੀ।"