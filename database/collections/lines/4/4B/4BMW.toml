type = "primary"
data = "ਰਣੰ ਰਾਗ ਬਜੇ, ਤਿ ਗਜੇ ਭਟਾਣੰ ॥"
page = 704

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The war-horns were blown and the warriors thundered"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਣ ਵਿਚ (ਮਾਰੂ) ਰਾਗ ਵਜ ਰਿਹਾ ਹੈ ਅਤੇ ਸੂਰਮੇ ਗਜ ਰਹੇ ਹਨ।"