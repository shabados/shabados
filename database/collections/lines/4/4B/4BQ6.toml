[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਜੀਅ; ਦੇਵੈ ਆਧਾਰ ॥੪॥"
page = 1156
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To millions of beings, the Lord gives sustenance."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾਂ ਹੀ ਜੀਵਾਂ ਨੂੰ ਸੁਆਮੀ ਰੋਜ਼ੀ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He gives sustenance and support to millions of beings. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜੋਂ ਹੀ ਜੀਵੋਂ ਕੋ ਤੂੰ (ਆਧਾਰ) ਆਸਰਾ ਦੇਤਾ ਹੈਂ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਾਲਕ ਕ੍ਰੋੜਾਂ ਜੀਵਾਂ ਨੂੰ ਆਸਰਾ ਦੇ ਰਿਹਾ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ = ਜੀਵ {ਬਹੁ-ਵਚਨ}। ਆਧਾਰ = ਆਸਰਾ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo Ese Ser es mi Dios. (4)"