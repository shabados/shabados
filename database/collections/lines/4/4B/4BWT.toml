[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਮਨੁੱਖ (ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੇ) ਉਸ ਸੁਆਦ ਵਿਚ ਵਿੱਝ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
