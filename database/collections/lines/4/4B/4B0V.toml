[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਬਿਨੁ; ਉਰਝਿ ਮਰਹਿ ਬੇਕਾਰਾ ॥"
page = 1026
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Guru, one dies entangled in sins."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਬਾਝੋਂ, ਬੰਦਾ ਪਾਪਾਂ ਅੰਦਰ ਠੱਸ ਕੇ ਮਰ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Guru, he dies entangled in sin and corruption."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਬਿਨਾਂ ਬਿਕਾਰੋਂ ਮੇਂ ਫਸ ਕੇ ਮਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਣ ਤੋਂ ਬਿਨਾ ਜੀਵ ਵਿਕਾਰਾਂ ਵਿਚ ਫਸ ਕੇ ਆਤਮਕ ਮੌਤ ਸਹੇੜ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਰਝਿ ਬੇਕਾਰਾ = ਵਿਕਾਰਾਂ ਵਿਚ ਫਸ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Guru uno se involucra en el vicio hasta la muerte"