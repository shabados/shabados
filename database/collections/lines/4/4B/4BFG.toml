data = "ਤੁਮ ਕਹੋ ਚਤ੍ਰ ਚਤ੍ਰੈ ਬਿਚਾਰ ॥"
page = 139

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Tell me Graciously Thy thoughts about all the four:"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਨ੍ਹਾਂ ਚੌਹਾਂ ਬਾਰੇ ਤੁਸੀਂ ਵਿਚਾਰ-ਪੂਵਕ ਸਮਝਾਓ।"