[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਨਾਮੁ; ਕਿਨੈ ਵਿਰਲੈ ਜਾਤਾ ॥"
page = 127
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rare are those who knows the Name of God,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਟਾਵਾਂ ਪੁਰਸ਼ ਹੀ ਰੱਬ ਦੇ ਨਾਮ ਨੂੰ ਜਾਣਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How rare are those who know the Name of the Lord!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕਾ ਨਾਮ ਕਿਸੇ ਵਿਰਲੇ ਨੇ ਹੀ ਜਾਣਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਵਿਰਲੇ ਮਨੁੱਖ ਨੇ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਨਾਲ ਡੂੰਘੀ ਸਾਂਝ ਪਾਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਤਾ = ਪਛਾਣਿਆ, ਸਾਂਝ ਪਾਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Muy pocos conocen el Naam."