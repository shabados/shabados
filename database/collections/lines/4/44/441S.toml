[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਭਉ; ਕਹਉ ਸੋਇ ਹਾਂ ॥"
page = 410
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "him alone call thou the fearless one."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਕੇਵਲ ਓਸੇ ਨੂੰ ਹੀ ਨਿੱਡਰ ਆਖ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "he alone is called fearless."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਨਿਰਭਉ ਕਹੀਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਮੈਂ ਭੀ ਉਸ ਨਿਰਭਉ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦਾ ਰਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹਉ = ਮੈਂ ਆਖਦਾ ਹਾਂ, ਕਹਉਂ। ਸੋਇ = ਉਸ ਪਰਮਾਤਮਾ ਨੂੰ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "bajo los pies de los hombres."