[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚ ਬਿਨਾ. ਸੂਚਾ ਕੋ ਨਾਹੀ; ਨਾਨਕ ਅਕਥ ਕਹਾਣੀ ॥੬੭॥"
page = 946
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the True Name, no one can become immaculate. Nanak, Ineffable is the Lord's anecdote."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਨਾਮ ਦੇ ਬਾਝੋਂ ਕੋਈ ਭੀ ਪਵਿੱਤਰ ਨਹੀਂ ਹੋ ਸਕਦਾ। ਨਾਨਕ, ਵਰਣਨ ਰਹਿਤ ਹੈ, ਸਾਹਿਬ ਦੀ ਕਥਾ ਵਾਰਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the True Name, no one can become pure; O Nanak, this is the Unspoken Speech. ||67||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚ ਧਾਰਨੇ ਬਿਨਾਂ ਸੂਚਾ ਕੋਈ ਭੀ ਨਹੀਂ। ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਇਹ ਅਰਥ ਕਹਾਣੀ ਹੈ ॥੬੭॥☬ਪ੍ਰਸ਼ਨ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਐਸੇ ਉਸ) ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ (ਨੂੰ ਮਿਲਣ) ਤੋਂ ਬਿਨਾ, ਜਿਸ ਦਾ ਕੋਈ ਸਹੀ ਸਰੂਪ ਬਿਆਨ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ, ਕੋਈ ਮਨੁੱਖ ਸੁੱਚਾ ਨਹੀਂ ਹੈ ॥੬੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Nombre Verdadero, nadie se vuelve puro; oh, dice Nanak, este es el Inefable Discurso. (67)"