[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਣੀ ਗੁਰੂ. ਗੁਰੂ ਹੈ ਬਾਣੀ; ਵਿਚਿ ਬਾਣੀ. ਅੰਮ੍ਰਿਤੁ ਸਾਰੇ ॥"
page = 982
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Gurbani is the embodiment of the Guru and the Guru is the embodiment of Gurbani. In the whole of Gurbani is contained the Nectar."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਬਾਣੀ ਗੁਰਾਂ ਦਾ ਸਰੂਪ ਹੈ ਅਤੇ ਗੁਰੂ ਜੀ ਗੁਰਬਾਣੀ ਦਾ ਸਰੂਪ ਹਨ। ਗੁਰਬਾਣੀ ਅੰਦਰ ਸਮੂਹ ਅੰਮ੍ਰਿਤ-ਰਸ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Word, the Bani is Guru, and Guru is the Bani. Within the Bani, the Ambrosial Nectar is contained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਾਣੀ ਰੂਪ ਤੋ ਗੁਰੂ ਹੈ ਔ ਗੁਰੂ ਰੂਪ ਬਾਣੀ ਹੈ, ਕਿਉਂਕਿ ਬਾਣੀ ਕੇ ਵਿਚਿ ਅੰਮ੍ਰਿਤ (ਸਾਰੇ) ਸਭ ਜਗਾ ਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ) ਬਾਣੀ (ਸਿੱਖ ਦਾ) ਗੁਰੂ ਹੈ, ਗੁਰੂ ਬਾਣੀ ਵਿਚ ਮੌਜੂਦ ਹੈ। (ਗੁਰੂ ਦੀ) ਬਾਣੀ ਵਿਚ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ (ਹੈ, ਜਿਸ ਨੂੰ ਸਿੱਖ ਹਰ ਵੇਲੇ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ) ਸਾਂਭ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਮ੍ਰਿਤੁ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਜਲ। ਸਾਰੇ = ਸੰਭਾਲਦਾ ਹੈ, ਲੱਭਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Palabra es la Encarnación del Guru; el Guru está en la Palabra; sí, en la Palabra están contenidas todas las mieles."