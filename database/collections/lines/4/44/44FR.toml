[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੰਮਣੁ ਮਰਣਾ; ਠਾਕਿ ਰਹਾਏ ॥"
page = 222
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His coming and going come to an end."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਆਉਣਾ ਤੇ ਜਾਣਾ ਮੁਕ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The cycle of birth and death is ended."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪੁਰਸ ਵਾਹਿਗੁਰੂ ਨੈ ਜਨਮ ਮਰਨ ਸੇ (ਠਾਕਿ ਰਹਾਏ) ਹਟਾਇ ਰਾਖੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣਾ ਜਨਮ ਮਰਨ ਦਾ ਗੇੜ ਰੋਕ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਕਿ ਰਹਾਏ = ਰੋਕ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sus idas y venidas terminan."