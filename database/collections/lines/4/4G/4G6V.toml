[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ. ਗੁਰ ਮਿਲਿ; ਇਕੁ ਪਛਾਣਦਾ ॥"
page = 73
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Having met the Guru I recognise but One Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਨੂੰ ਭੇਟ ਕੇ ਮੈਂ ਕੇਵਲ ਇਕ ਸਾਹਿਬ ਨੂੰ ਹੀ ਸਿੰਞਾਣਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting with the Guru, I recognize only the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਗੁਰੋਂ ਕੋ ਮਿਲ ਕਰ ਇਕ ਤੇਰੇ ਕੋ ਪਹਿਚਾਨਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਗੁਰੂ ਨੂੰ ਮਿਲ ਕੇ ਮੈਂ ਸਿਰਫ਼ ਤੇਰੇ ਨਾਲ ਸਾਂਝ ਪਾਈ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਮੈਂ। ਗੁਰ ਮਿਲਿ = ਗੁਰੂ ਨੂੰ ਮਿਲ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Encontrando al Guru, realicé al Uno,"