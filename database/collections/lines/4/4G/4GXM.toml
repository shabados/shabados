data = "ਕਮਰ ਭਰਾਤ ਕੇ ਕੀ ਤੁਰਤੁ; ਜਮਧਰ ਲਈ ਨਿਕਾਰਿ ॥"
page = 995

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She withdrew the dagger from the waist of her brother,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ (ਉਸ ਨੇ) ਆਪਣੇ ਭਰਾ ਦੇ ਕਮਰਕੱਸੇ ਵਿਚੋਂ ਕਟਾਰ ਕਢ ਲਈ।"