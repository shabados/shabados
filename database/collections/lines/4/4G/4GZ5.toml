[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੋ ਸੁਘੜਾ, ਕੋ ਮੂੜਤਾ, ਕਹਾ ਤਰਕ ਅਵਤਰਕ ॥੩॥੨੦੩॥"
page = 35

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "What are wisdom and foolishness? What are logical and illogical? 3.203."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੁਘੜ ਕੌਣ ਹੈ, ਮੂਰਖ ਕੌਣ ਹੈ, ਤਰਕ ਕੀ ਹੈ ਅਤੇ ਅਵਿਤਰਕ (ਬੇਦਲੀਲੀ) ਕੀ ਹੈ? ॥੩॥੨੦੩॥"