[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੈ ਕਰਤਾ ਸਭ ਹੀ ਜਗ ਕੋ; ਅਰੁ ਦੇਵਨ ਹਾਰ ਇਹੀ ਜੁਗ ਸੰਙਾ ॥"
page = 328

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is virtually the Creator and the Sustainer of the whole universe"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਾਰੇ ਜਗ ਦਾ ਕਰਤਾ ਅਤੇ ਸਾਰਿਆਂ ਯੁਗਾਂ ਵਿਚ ਦੇਣ ਵਾਲਾ ਹੈ; (ਜੋ) ਲੋਕਾਂ ਦਾ ਸੁਆਮੀ ਹੈ,"