[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਜਾਨੈ; ਅਪਨੇ ਜੀ ਕੀ ॥"
page = 294
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone knows what is in His mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਓਹੀ ਜਾਣਦਾ ਹੈ ਕਿ ਉਸ ਦੇ ਚਿੱਤ ਵਿੱਚ ਕੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself knows His Own Being."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੇ ਰਿਦੇ ਕੀ ਵਹੁ ਆਪ ਹੀ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਦਿਲ ਦੀ ਗੱਲ ਉਹ ਆਪ ਹੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀ ਕੀ = ਦਿਲ ਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo Él conoce Su Propio Ser."