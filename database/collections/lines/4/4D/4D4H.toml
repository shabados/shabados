[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਟੂਐ, ਸਾਂਗੁ ਬਣਾਇਆ; ਬਾਜੀ ਸੰਸਾਰਾ ॥"
page = 422
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This world play is fashioned like the mimicry of a buffoon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਜਗਤ ਖੇਡ ਬਹੁਰੂਪੀਏ ਦੇ ਸੁਆਂਗ ਦੀ ਮਾਨਿੰਦ ਸਾਜੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The drama of the world is staged like the show of a buffoon."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਕਾਲ ਪੁਰਖ ਨਟ ਨੇ ਇਸ ਬਾਜੀ ਕੇ ਤੁਲ ਸੰਸਾਰ ਰੂਪ ਤਮਾਸ਼ਾ ਬਨਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੰਸਾਰ ਮਦਾਰੀ ਦੇ ਨਾਟਕ ਵਾਂਗ ਇਕ ਖੇਡ (ਹੀ) ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਟੂਐ = ਨਟ ਨੇ, ਮਦਾਰੀ ਨੇ। ਬਾਜੀ = ਖੇਡ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como hacemos nuestra pantomima en el estrado,"