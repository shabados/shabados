[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦੀਵਾ ਬਲਦਾ ਦੀਵਿਅਹੁਂ, ਸਮਸਰਿ ਪਰਵਾਣੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "From lamp is illumined the lamp and looks identical."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਦੀਵੇ ਨਾਲੋਂ ਦੀਵਾ ਪ੍ਰਕਾਸ਼ਦਾ ਹੈ, (ਉਸ ਦੇ) ਬਰਾਬਰ ਹੀ (ਪ੍ਰਕਾਸ਼ ਸਾਰੇ) ਪਰਵਾਨ ਕਰਦੇ ਹਨ।"