[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਲ ਮਹਿ ਮੀਨ; ਮਾਇਆ ਕੇ ਬੇਧੇ ॥"
page = 1160
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The fish in the water are attached to mammon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਾਣੀ ਵਿਚਲੀਆਂ ਮਛੀਆਂ ਮਾਇਆ ਨਾਲ ਜੁੜੀਆਂ ਹੋਈਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The fish in the water is attached to Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਲ ਵਿਖੇ ਜੋ ਮਛ ਆਦਿਕ ਹੈਂ ਏਹ ਮਾਯਾ ਕੇ ਬੇਦੇ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਾਣੀ ਵਿਚ ਰਹਿਣ ਵਾਲੀਆਂ ਮੱਛੀਆਂ ਮਾਇਆ ਵਿਚ ਵਿੱਝੀਆਂ ਪਈਆਂ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੀਨ = ਮੱਛੀਆਂ। ਬੇਧੇ = ਵਿੰਨ੍ਹੇ ਹੋਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El pez vive engañado por el apego al mar."