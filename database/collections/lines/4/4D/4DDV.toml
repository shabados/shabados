[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ. ਤੇ ਭਵਨ ਪਵਿਤ੍ਰਾ; ਜਾ ਮਹਿ ਸੰਤ ਤੁਮੑਾਰੇ ॥੨॥੩੨॥੫੫॥"
page = 1215
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, sanctified is the house, wherein abide Thine saints, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਪਾਵਨ ਹੈ ਉਹ ਘਰ, ਜਿਸ ਵਿੱਚ ਤੇਰੇ ਸਾਧੂ ਵਸਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, that dwelling is sacred, in which Your Saints live. ||2||32||55||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: (ਤੇ) ਵਹੁ (ਭਵਨ) ਘਰ ਪਵਿਤ੍ਰ ਹੈਂ ਜਿਨ ਕੇ ਬੀਚ (ਤੁਮਾਰੇ) ਸੰਤ ਜਨ ਵਸਤੇ ਹੈਂ॥੨॥੩੨॥੫੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਜਿਨ੍ਹਾਂ ਘਰਾਂ ਵਿਚ ਤੇਰੇ ਸੰਤ ਵੱਸਦੇ ਹਨ ਉਹ ਪਵਿੱਤਰ ਹੋ ਜਾਂਦੇ ਹਨ ॥੨॥੩੨॥੫੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ ਭਵਨ = ਉਹ ਘਰ {ਬਹੁ-ਵਚਨ}। ਜਾ ਮਹਿ = ਜਿਨ੍ਹਾਂ (ਘਰਾਂ) ਵਿਚ ॥੨॥੩੨॥੫੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Dios, Bendito, Bendito es ese lugar donde Tus Santos habitan. (2-32-55)"