[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕਾ ਸੇਵਕੁ; ਸੋ ਹਰਿ ਜੇਹਾ ॥"
page = 1076
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's slave he is like unto the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਰੱਬ ਦਾ ਗੋਲਾ; ਉਹ ਰੱਬ ਵਰਗਾ ਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord's servant becomes like the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕਾ ਜੋ ਸੇਵਕ ਹੈ, ਸੋ ਹਰੀ ਜੈਸਾ ਹੀ ਸਾਮਰਥ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਕਰਨ ਵਾਲਾ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਵਰਗਾ ਹੀ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵਕੁ = ਭਗਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Sirviente del Señor es como el Señor. Sí,"