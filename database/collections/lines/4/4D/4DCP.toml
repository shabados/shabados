[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬ ਦਹਨੇ ਦਿਗ਼ਰ ਦੁਸ਼ਮਨ ਅਫ਼ਤਦ ਦਲੇਰ ॥੭੪॥"
page = 1419

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And its futile bravery put (lion) in other’s (alligator’s) mouth.(74)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸ਼ੇਰ ਉਸ ਦੂਜੇ ਵੈਰੀ ਦੇ ਮੂੰਹ ਵਿਚ ਜਾ ਪਿਆ ॥੭੪॥"