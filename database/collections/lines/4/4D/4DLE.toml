[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਰ ਧਾਰ ਬਲੀ ਘਨ ਜਿਯੋ ਬਰਖ੍ਰਯੋ ॥੩੮॥"
page = 181

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The bow was pulled in his hands in great anger and a volley of arrows was showered like rain.38."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਬਦਲ ਵਾਂਗ (ਉਸ) ਬਲਵਾਨ ਨੇ ਤੀਰਾਂ ਦੀ ਬਰਖਾ ਸ਼ੁਰੂ ਕਰ ਦਿੱਤੀ ॥੩੮॥"