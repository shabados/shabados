data = "ਬੈਰਾਗ, ਸੰਨਿਆਸ ਅਤੇ ਅਨੇਕ ਯੋਗ (ਧਾਰਨੇ ਅਤੇ) ਪਦਾਰਥਾਂ ਦਾ ਭੋਗ ਕਰਨਾ,"