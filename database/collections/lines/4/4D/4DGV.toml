[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਈ ਰੀ; ਚਰਨਹ ਓਟ ਗਹੀ ॥"
page = 1225
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my mother, I have grasped the protection of my Lord's feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਮਾਤਾ! ਮੈਂ ਆਪਣੇ ਪ੍ਰਭੂ ਦੇ ਪੈਰਾਂ ਦੀ ਪਨਾਹ ਪਕੜੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mother, I have grasped the Protection, the Sanctuary of the Lord's Feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ ਜਨੋਂ! ਭਗਵੰਤ ਕੇ ਚਰਨੋਂ ਕੀ ਓਟ ਪਕੜ ਲਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਂ! (ਜਦੋਂ ਦਾ) ਪਰਮਾਤਮਾ ਦੇ ਚਰਨਾਂ ਦਾ ਆਸਰਾ ਲਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਈ ਰੀ = ਹੇ ਮਾਂ {'ਰੀ' ਇਸਤ੍ਰੀ ਲਿੰਗ। 'ਕਹਤ ਕਬੀਰ ਸੁਨਹੁ ਰੀ ਲੋਈ'}। ਓਟ = ਆਸਰਾ। ਗਹੀ = ਫੜੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi madre, busco sólo el Refugio de los Pies del Señor,"