[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬੀਰ ਦੁਹੂੰ ਤਿਹ ਠਉਰ ਬਿਖੈ; ਕਬਿ ਰਾਮ ਭਨੈ ਅਤਿ ਜੁਧੁ ਮਚਾਯੋ ॥"
page = 441

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors or both the sides waged a dreadful war"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਵੀ ਰਾਮ ਕਹਿੰਦੇ ਹਨ, ਦੋਹਾਂ ਸੂਰਵੀਰਾਂ ਨੇ ਉਸ ਥਾਂ ਉਤੇ ਬਹੁਤ ਵਾਰੀ ਯੁੱਧ ਕੀਤਾ।"