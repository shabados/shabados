[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੇਰੇ ਹੀ ਸ੍ਰਉਨਤ ਸੋ ਸੁਨਿ ਆਜੁ; ਧਰਾ ਇਹ ਆਰੁਨ ਬੇਖ ਰਚੈਗੀ ॥੧੫੦੬॥"
page = 447

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O Shiva! listen, this earth saturated with your blood will wear the red garb today.”1506."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੁਣ, ਤੇਰੇ ਹੀ ਲਹੂ ਨਾਲ ਅਜ ਧਰਤੀ ਸੂਹਾ ਭੇਸ ਕਰੇਗੀ ॥੧੫੦੬॥"