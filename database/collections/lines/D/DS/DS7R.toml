[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਗੁਰੇ ਕਉ; ਗਤਿ ਕਾਈ ਨਾਹੀ ॥"
page = 361
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "For him, who is without the Guru, there is no salvation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰੂ-ਹੀਣ ਹੈ, ਉਸ ਲਈ ਕੋਈ ਮੁਕਤੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no salvation for those who have no Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਿਗੁਰਾ ਹੈ ਤਿਸ ਕੀ ਕਹੀਂ ਗਤਿ ਨਹੀਂ ਹੋਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਨ ਨਹੀਂ ਪੈਂਦਾ, ਉਸ ਨੂੰ ਕੋਈ ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਈ ਗਤਿ = ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "uno salva a sus parientes, pero sin el Guru, no hay Liberación,"