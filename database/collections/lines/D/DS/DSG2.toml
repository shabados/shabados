[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰੁਸਿਖੀ ਦਾ ਜੀਵਣਾ; ਜੀਂਵਦਿਆਂ ਮਰਿ ਹਉਮੈ ਖੋਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Life of a gursikh is being dead i.e. losing one's ego while alive."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰ ਸਿਖੀ ਦਾ ਜੀਉਣਾ (ਇਹੋ ਹੈ ਕਿ) ਜੀਵੰਦਿਆਂ ਹੀ ਮਰਕੇ ਹਉਮੈ ਦਾ ਤਿਆਗ ਕਰ ਦੇਵੇ।"