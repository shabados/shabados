type = "primary"
data = "ਲਗਿਯੋ ਸਲੌਨੋ ਅਤਿ ਚਿਤ ਭਾਯੋ ॥"
page = 936

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Kokila ate that meat, she relished it tastefully and said,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਸ ਨੂੰ ਸੁਆਦੀ ('ਸਲੌਨੋ' ਨਮਕੀਨ) ਲਗਿਆ ਅਤੇ ਚਿਤ ਨੂੰ ਬਹੁਤ ਹੀ ਭਾਇਆ।"