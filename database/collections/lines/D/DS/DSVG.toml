type = "primary"
data = "ਤਰਕਸ ਟਾਗਿ ਜਾਡ ਪੈ ਧਰਿਯੋ ॥"
page = 994

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Oh, you the mean woman, why have you. done this and hung my quiver on the tree?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੂੰ ਮੇਰਾ) ਤਰਕਸ ਜੰਡ ਨਾਲ ਟੰਗ ਦਿੱਤਾ ਹੈ।"