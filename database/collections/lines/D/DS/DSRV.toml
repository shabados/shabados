[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਏ ਨਮਸਤੇ; ਹਰਏ ਨਮਹ ॥"
page = 874
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto God is my salutations and unto God my obeisance."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨੂੰ ਮੇਰੀ ਪ੍ਰਣਾਮ ਹੈ ਅਤੇ ਵਾਹਿਗੁਰੂ ਨੂੰ ਹੀ ਮੇਰੀ ਨਮਸ਼ਕਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I bow to the Lord, I humbly bow to the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੋ ਨਮਸਕਾਰ ਹੈ ਤਨ ਕਰ ਕੇ ਹਰੀ ਕੋ ਨਮਸਕਾਰ ਹੈ ਮਨ ਕਰਕੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਉਸ ਪਰਮਾਤਮਾ ਨੂੰ ਨਮਸਕਾਰ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਏ = ਹਰੀ ਨੂੰ (ਵੇਖੋ ਮੇਰੇ 'ਸੁਖਮਨੀ ਸਟੀਕ' ਵਿਚ ਲਫ਼ਜ਼ 'ਗੁਰਏ' ਦੀ ਵਿਆਖਿਆ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¡Hosanna al Señor, Hosanna a mi Dios! Recitando el Nombre del Señor,"