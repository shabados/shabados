data = "ਜੋ ਸਿਮਰੰਦੇ ਸਾਂਈਐ ॥"
page = 132
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who meditate on the Master, are not thrown into the hell."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਮਾਲਕ ਦਾ ਅਰਾਧਨ ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who meditate on the Master"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਾਲਕ ਕਾ ਸਿਮਰਨ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੇ ਮਨੁੱਖ ਖਸਮ-ਪਰਮਾਤਮਾ ਦਾ ਸਿਮਰਨ ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
