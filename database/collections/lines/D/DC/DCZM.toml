[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੂਡਤ ਕਉ; ਜੈਸੇ ਬੇੜੀ ਮਿਲਤ ॥"
page = 986
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As is the boarding a boat for the drowning man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰਾ ਡੁਬਦੇ ਹੋਏ ਬੰਦੇ ਦਾ ਕਿਸ਼ਤੀ ਤੇ ਚੜ ਜਾਣਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It is like a boat to a drowning man."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਡੂਬਤੇ ਕੋ ਜੈਸੇ ਨਾਉਕਾ ਮਿਲ ਜਾਇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਇਉਂ ਸਹਾਈ ਹੁੰਦਾ ਹੈ) ਜਿਵੇਂ ਡੁੱਬ ਰਹੇ ਨੂੰ ਬੇੜੀ ਮਿਲ ਜਾਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੂਡਤ = ਡੁੱਬਦੇ। ਕਉ = ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es como el barco para el que se ahoga."