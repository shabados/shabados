[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਦਾ ਸਦਾ ਜਪੀਐ ਹਰਿ ਨਾਮ ॥"
page = 743
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever, ever contemplate thou the Lord's Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਨਿਤ, ਨਿਤ ਸਾਈਂ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forever and ever, I chant the Lord's Name,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਦਾ ਸਦਾ ਹਰਿ ਨਾਮੋਂ ਕੋ ਜਪੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਸਦਾ ਹੀ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਦੇ ਰਹਿਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਪੀਐ = ਜਪਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Contemplemos siempre el Nombre del Señor"