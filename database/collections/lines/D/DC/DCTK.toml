data = "ਬਿਧਿ ਪੂਰਬ ਜਿਉ ਤੁਮ ਉਚਰੇ ॥੨੩੯੦॥"
page = 539

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then he said, “Just as you had said, I have taken bath at all the pilgrim-stations according to Shastric injunctions.2390."

[[content]]
