[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੁਤਾ ਗਸ਼ਤ ਮੁਸ਼ਤੇ ਹਮੀ ਚਾਰ ਗਸ਼ਤ ॥੮੬॥"
page = 1404

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He was torn either into two or four pieces.(86)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਦੋ ਜਾਂ ਚਾਰ ਹਿੱਸਿਆਂ ਵਿਚ ਵੰਡਿਆ ਗਿਆ ॥੮੬॥"