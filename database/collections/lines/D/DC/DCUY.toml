[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਉਪਦੇਸੁ; ਮੋਹਿ ਕਾਨੀ ਸੁਨਿਆ ॥"
page = 1347
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "ever since I have heard the Guru's instruction in my ears."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਕੰਨਾਂ ਨਾਲ ਜਦ ਦੀ ਮੈਂ ਗੁਰਾਂ ਦੀ ਸਿਖਮਤ ਸੁਣੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I listen to the Guru's Teachings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਗੁਰੋਂ ਕਾ ਉਪਦੇਸ ਮੈਨੇ ਕਾਨੋਂ ਕਰ ਸ੍ਰਵਨ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦਾ ਉਪਦੇਸ਼ ਮੈਂ ਬੜੇ ਧਿਆਨ ਨਾਲ ਸੁਣਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਿ = ਮੈਂ। ਕਾਨੀ = ਕਾਨੀਂ, ਕੰਨਾਂ ਨਾਲ, ਧਿਆਨ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues escucho las Enseñanzas del Guru, donde sea que veo,"