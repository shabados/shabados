[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਹਦ ਸਬਦ ਅਚਰਜ ਬਿਸਮਾਦ ॥"
page = 1143
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Wondrous is the spiritual bliss of the celestial strain."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਦਭੁਤ ਹੈ ਰੂਹਾਨੀ ਖੁਸ਼ੀ ਬੈਕੁੰਠੀ ਕੀਰਤਨ ਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Unstruck Sound-current of the Shabad, the Word of God, is wondrous and amazing!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਰਸ ਜੋ ਬ੍ਰਹਮ ਹੈ, ਸੋ ਅਸਚਰਜ ਤੇ ਅਸਚਰਜ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੁਣ ਇਉਂ ਹੋ ਗਿਆ ਹੈ ਜਿਵੇਂ) ਇਕ-ਰਸ ਸਾਰੇ ਸਾਜ਼ਾਂ ਦਾ ਰਾਗ (ਮੇਰੇ ਅੰਦਰ ਹੋ ਰਿਹਾ ਹੈ) (ਮੇਰੇ ਅੰਦਰ) ਅਚਰਜ ਤੇ ਹੈਰਾਨ ਕਰਨ ਵਾਲੀ (ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ਬਣ ਗਈ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਹਦ ਸ਼ਬਦ = ਇਕ-ਰਸ ਸਾਰੇ ਸਾਜ਼ਾਂ ਦਾ ਰਾਗ। ਬਿਸਮਾਦ = ਹੈਰਾਨ ਕਰ ਦੇਣ ਵਾਲੀ ਅਵਸਥਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Estoy impactado por Su Maravilla, en mi interior resuena la Música Celestial de la Palabra del Shabd,"