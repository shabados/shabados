[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਹ ਘਰੈ, ਨ ਹਮੈ ਦੁਖ ਦੀਜੈ ॥"
page = 228

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O Bharat! do not be obstinate, go to your home, do not give me more anguish by staying here"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਘਰ ਨੂੰ ਜਾਓ, ਸਾਨੂੰ ਦੁੱਖ ਨ ਦਿਓ।"