[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਜੈ ਭਾਇ; ਦੈਤ ਸੰਘਾਰੇ ॥"
page = 225
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Because of duality God slew the devils."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਵੈਤਭਾਵ ਦੇ ਕਾਰਨ, ਵਾਹਿਗੁਰੂ ਨੇ ਰਾਖਸ਼ ਤਬਾਹ ਕਰ ਦਿਤੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Because of the love of duality, God killed the demons."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ (ਦੂਜੈ ਭਾਇ) ਦ੍ਵੈਤ ਭਾਵਨਾ ਕਰਨੇ ਕਰ ਦੈਈਤ ਸਿੰਘਾਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਦੈਂਤਾਂ ਨੂੰ ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਫਸਾ ਕੇ ਮਾਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੂਜੈ ਭਾਇ = ਪ੍ਰਭੂ ਨੂੰ ਤਿਆਗ ਕੇ ਕਿਸੇ ਹੋਰ ਦੇ ਪ੍ਰੇਮ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y vence el poder de la dualidad en los Gurmukjs,"