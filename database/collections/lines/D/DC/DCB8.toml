[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੂਸਨ. ਤਬ ਹੀ ਮੂਸੀਐ; ਬਿਸਰਤ ਪੁਰਖ ਦਇਆਲ ॥੭॥"
page = 1364
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Musan! However, then alone is man the plundered, when he forgets the Merciful Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੰਤੂ ਹੇ ਮੁਸਨ! ਕੇਵਲ ਤਾਂ ਹੀ ਬੰਦਾ ਲੁਟਿਆ ਪੁਟਿਆ ਜਾਂਦਾ ਹੈ ਜਦ ਉਹ ਮਿਹਰਬਾਨ ਮਾਲਕ ਨੂੰ ਭੁਲ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Musan, when mortals forget the Merciful Lord God, then they are truly plundered. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੂਸਨ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਜਬ ਇਸ ਜੀਵ ਕੋ ਦਇਆਲੂ ਪੁਰਖ ਵਿਸਰ ਜਾਤਾ ਹੈ ਤਬ ਹੀ ਵਿਕਾਰੋਂ ਕਰ ਕੇ ਠਗੇ ਜਾਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਆਤਮਕ ਜੀਵਨ ਨੂੰ ਲੁਟਾ ਰਹੇ ਹੇ ਮਨੁੱਖ! (ਅਸਲ ਵਿਚ) ਤਦੋਂ ਹੀ ਲੁੱਟੇ ਜਾਈਦਾ ਹੈ ਜਦੋਂ ਦਇਆ ਦਾ ਸੋਮਾ ਅਕਾਲ ਪੁਰਖ (ਮਨੋਂ) ਭੁੱਲਦਾ ਹੈ ॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਬ ਹੀ = ਤਦੋਂ ਹੀ। ਮੂਸੀਐ = ਲੁੱਟੇ ਜਾਈਦਾ ਹੈ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sufre la pena de la separación, oh Musan, cuando los mortales se olvidan del Señor, entonces son en verdad destruidos. (7)"