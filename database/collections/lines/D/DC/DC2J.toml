[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਗੁ ਮੋਹਿ ਬਾਧਾ; ਬਹੁਤੀ ਆਸਾ ॥"
page = 412
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The worldly is bound by temporal attachment and many desires."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਹਾਨ ਸੰਸਾਰੀ ਮਮਤਾ ਅਤੇ ਘਣੇਰੀਆਂ ਖਾਹਿਸ਼ਾ ਦਾ ਨਰੜਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The world is bound by its attachments to the many desires."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਬਹੁਤ ਮੋਹ ਔਰ ਆਸਾ ਕਰ ਕੇ ਬਾਧਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਬੱਝਾ ਹੋਇਆ ਬਹੁਤੀਆਂ ਆਸਾਂ ਵਿਚ ਬੱਝਾ ਹੋਇਆ (ਜੰਮਦਾ ਮਰਦਾ ਰਹਿੰਦਾ) ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਿ = ਮੋਹ ਵਿਚ। ਇਕਿ = ਕਈ ਜੀਵ {ਨੋਟ: ਲਫ਼ਜ਼ 'ਇਕਿ' ਬਹੁ-ਵਚਨ ਹੈ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mundo está atrapado en la infatuación,"