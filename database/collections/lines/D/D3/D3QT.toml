[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਐਸੀ ਨਿਹਾਰਿ ਕੈ ਮਾਰਿ ਮਚੀ; ਜੋਊ ਜੀਵਤ ਥੇ ਤਜਿ ਜੁਧੁ ਪਰਾਨੇ ॥"
page = 420

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing such a dreadful war, those warriors who were coming for fighting left and ran away from war-arena"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਜਿਹੀ ਮਾਰ ਨੂੰ ਮਚਿਆਂ ਵੇਖ ਕੇ, ਜੋ ਜੀਉਂਦੇ ਸਨ, ਉਹ ਯੁੱਧ ਤਿਆਗ ਕੇ ਭਜ ਗਏ।"