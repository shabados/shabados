[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੈਸੇ ਕਹਉ ਮੋਹਿ; ਜੀਅ ਬੇਦਨਾਈ ॥"
page = 1206
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How should I utter the pain of my soul?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੀ ਜਿੰਦੜੀ ਦੀ ਪੀੜ ਨੂੰ ਕਿਸ ਤਰ੍ਹਾਂ ਦੱਸਾ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How can I express the pain of my soul?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਅਪਨੇ ਜੀਅ ਕੀ (ਬੇਦਨਾਈ) ਪੀੜਾ ਕੋ ਕੈਸੇ ਕਰ ਕਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਵੀਰ! ਮੈਂ ਆਪਣੇ ਦਿਲ ਦੀ ਪੀੜ ਕਿਵੇਂ ਬਿਆਨ ਕਰਾਂ? (ਬਿਆਨ ਕਰ ਨਹੀਂ ਸਕਦੀ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ ਬੇਦਨਾਈ = ਦਿਲ ਦੀ ਪੀੜ। ਮੋਹਿ = ਮੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Cómo poder describir el dolor de mi Alma?,"