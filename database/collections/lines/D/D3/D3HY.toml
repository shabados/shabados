[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਰਜ ਸਿਧਿ. ਨ ਹੋਵਨੀ ਅੰਤਿ; ਗਇਆ ਪਛੁਤਾਏ ॥"
page = 851
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Their task is fulfilled not and they depart regretting in the end."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦਾ ਕੰਮ ਸੌਰਦਾ ਨਹੀਂ ਅਤੇ ਅਖੀਰ ਨੂੰ ਅਫਸੋਸ ਕਰ ਕੇ ਟੁਰ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Their affairs are not resolved, and in the end, they depart, regretting and repenting."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੇ ਮੋਖ ਆਦੀ ਕਾਰਜ ਸਿਧ ਨਹੀਂ ਹੋਤੇ ਹੈਂ, ਇਸੀ ਤੇ ਤਿਨ ਮਨਮੁਖੋਂ ਕਾ ਸਮੁਦਾਯ ਅੰਤ ਕੋ ਪਛਤਾਇ ਕਰ ਗਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਨੂੰ ਵਿਸਾਰ ਕੇ ਮਨਮੁਖ ਨੇ ਹੋਰ ਹੋਰ ਕਈ ਧੰਧੇ ਸਹੇੜੇ ਹੁੰਦੇ ਹਨ, ਉਹਨਾਂ) ਕੰਮਾਂ ਵਿਚ (ਉਸ ਨੂੰ) ਕਾਮਯਾਬੀਆਂ ਨਹੀਂ ਹੁੰਦੀਆਂ, ਆਖ਼ਰ ਇਥੋਂ ਹਾਹੁਕੇ ਲੈਂਦਾ ਹੀ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਧਿ = ਕਾਮਯਾਬੀਆਂ। ਨ ਹੋਵਨ੍ਹ੍ਹੀ = ਨਹੀਂ ਹੁੰਦੀਆਂ। ਅੰਤਿ = ਆਖ਼ਰ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sus asuntos no son resueltos; y al final de su vida parten arrepentidos."