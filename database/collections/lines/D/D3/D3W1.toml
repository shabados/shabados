[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੇ ਚਰਣ; ਹਿਰਦੈ ਵਸਾਇ ॥"
page = 190
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Enshrine thou Guru's feet within thy mind,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਚਰਨ ਆਪਣੇ ਮਨ ਅੰਦਰ ਟਿਕਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Enshrine the Feet of the Guru within your heart;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਚਰਨ ਰਿਦੈ ਮੇਂ ਇਸਥਿਤ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਤੂੰ ਆਪਣੇ) ਹਿਰਦੇ ਵਿਚ ਗੁਰੂ ਦੇ ਚਰਨ ਵਸਾਈ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਸਾਇ = ਟਿਕਾ ਰੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Enaltece los Pies de Loto del Guru en tu corazón,"