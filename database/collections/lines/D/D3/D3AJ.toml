[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਤਿਗੁਰ ਸਰਣੀ ਜਾਇ; ਸੀਸੁ ਨਿਵਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He is true Sikh who surrenders before the Guru and bows his head;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਨੇ) ਸਤਿਗੁਰੂ ਦੀ ਸ਼ਰਨੀ ਜਾਕੇ ਸਿਰ ਨਿਵਾਇਆ।"