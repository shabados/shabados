[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੈਨ ਕਟੋਚਨ ਕੀ ਤਬੈ ਘੇਰ ਲਈ ਅਰਰਾਇ ॥੧੫॥"
page = 64

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And besieged the army of Katoch. 15."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਟੋਚੀਆਂ ਦੀ ਸੈਨਾ ਨੂੰ ਭੀਮ ਚੰਦ ('ਅਰਿ-ਰਾਇ') ਨੇ ਘੇਰ ਲਿਆ ॥੧੫॥"