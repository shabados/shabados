[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮਿ ਸਾਜਿ ਸਵਾਰਿਆ ॥"
page = 627
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Supreme Lord has created and adorned my son."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼੍ਰੋਮਣੀ ਸਾਈਂ ਨੇਂ ਮੇਰੇ ਪੁੱਤ੍ਰ ਨੂੰ ਪੈਦਾ ਅਤੇ ਸਸ਼ੋਭਤ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Lord God created and embellished him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਹਿਲੇ ਭੀ ਹੇ ਪਾਰਬ੍ਰਹਮ! ਤੈਨੇ ਹੀ ਸਾਜ ਕੇ ਸਵਾਰਿਆ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਨੇ ਇਸ ਛੋਟੇ ਬੱਚੇ (ਹਰਗੋਬਿੰਦ) ਨੂੰ ਸਾਜਿਆ ਤੇ ਸਵਾਰਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਰਬ੍ਰਹਮਿ = ਪਰਮਾਤਮਾ ਨੇ। ਸਾਜਿ = ਸਾਜ ਕੇ, ਪੈਦਾ ਕਰ ਕੇ। ਸਵਾਰਿਆ = ਸੋਹਣਾ ਬਣਾ ਦਿੱਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Trascendente ha creado"