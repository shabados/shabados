[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਧੰਨ ਹੈ ਉਹ ਸਤਿਗੁਰੂ, ਜਿਸ ਨੇ ਦਿਲ ਦੇ ਬੰਧਨ ਤੋੜ ਦਿੱਤੇ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਐ ਜ਼ਹੇ ਮੁਰਸ਼ਦ ਕਿ ਬੰਦਿ ਦਿਲ ਕੁਸ਼ਾਦ ॥੪੩੨॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Blessed is the true Guru who has broken all the limitations and shackles of my heart. (432)"