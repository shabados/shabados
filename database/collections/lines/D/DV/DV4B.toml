[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਉ ਲਖਿ ਭਾਜਿ ਗਏ ਸਿਗਰੇ; ਕਿਨਹੂੰ ਨ੍ਰਿਪ ਕੇ ਸੰਗ ਜੁਧੁ ਨ ਠਾਨਿਓ ॥੧੭੦੮॥"
page = 468

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing all this, all ran away and none of them fought with the king.1708."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ (ਦੀ ਹਾਲਤ) ਵੇਖ ਕੇ ਸਾਰੇ ਭਜ ਗਏ ਹਨ, ਕਿਸੇ ਨੇ ਵੀ ਰਾਜੇ ਨਾਲ ਯੁੱਧ ਨਹੀਂ ਕੀਤਾ ਹੈ ॥੧੭੦੮॥"