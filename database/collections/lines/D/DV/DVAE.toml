[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਆਪੇ. ਤਪੁ ਤਾਪੈ; ਲਾਇ ਤਾਰੀ ॥੧॥"
page = 165
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God Himself practises penance and assumes contemplative mood."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਖੁਦ ਹੀ ਤਪੱਸਿਆ ਕਰਦਾ ਅਤੇ ਧਿਆਨ ਅਵਸਥਾ ਧਾਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is deeply absorbed in His primal trance. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਆਪ ਹੀ ਹਰੀ ਤਾੜੀ ਲਗਾਇ ਕਰ ਤਪਸਿਆ ਕੋ ਤਾਪ ਰਹਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਪੀਆਂ ਵਿਚ ਵਿਆਪਕ ਹੋ ਕੇ) ਹਰੀ ਆਪ ਹੀ ਤਾੜੀ ਲਾ ਕੇ ਤਪ-ਸਾਧਨ ਕਰ ਰਿਹਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾਰੀ = ਤਾੜੀ, ਸਮਾਧੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien prevalece en todo.(1)"