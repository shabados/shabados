[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੁ ਆਹੂ ਕਲਾ ਪਾਇ ਅਜ਼ੀਮੇ ਦੁ ਨਰ ॥੧੩॥"
page = 1425

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Both are grand and their hooves are like the feet of the stags.(13)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਹਿਰਨ ਵਰਗੇ ਤੇਜ਼ ਅਤੇ ਬਹੁਤ ਕੀਮਤੀ ਸਨ; ਮਾਨੋ ਮਨੁੱਖ ਵਾਂਗ ਸਿਆਣੇ ਹੋਣ ॥੧੩॥"