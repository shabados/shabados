[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸੁਖ ਫਲੁ, ਗੁਰ ਸਰਣਾਏ ॥੧੯॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The pleasure fruit of the gurmukhs is the shelter of the Guru."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾਂ ਨੂੰ ਗੁਰੂ ਦੀ ਸ਼ਰਣ ਆਉਣਾ ਹੀ ਸੁਖਾਂ ਹੀ ਰੂਪੀ ਫਲ (ਦੇਂਦਾ ਹੈ)।"