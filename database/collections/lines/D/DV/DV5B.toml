[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਨਦਰੀ ਪਾਈਐ; ਅੰਮ੍ਰਿਤੁ ਗੁਣੀ ਨਿਧਾਨੁ ॥੨॥"
page = 851
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, by the grace of the Treasure of virtues, one is blessed with the Name-Nectar."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੇਕੀਆਂ ਦੇ ਖਜਾਨੇ ਦੀ ਰਹਿਮਤ ਦੁਆਰਾ ਨਾਮ ਸੁਧਾ-ਰਸ ਦੀ ਦਾਤ ਪਰਾਪਤ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, by His Grace, one is blessed with the Ambrosial Nectar of the treasure of virtue. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਗੁਣੀ ਨਿਧਾਨ ਕੀ ਕ੍ਰਿਪਾ ਦ੍ਰਿਸ੍ਟੀ ਤੇ ਨਾਮ ਅੰਮ੍ਰਿਤ ਪਾਈਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਤੇ ਸਾਰੇ ਗੁਣਾਂ ਦਾ ਖ਼ਜ਼ਾਨਾ ਪਰਮਾਤਮਾ (ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਆਪਣੀ) ਮਿਹਰ ਦੀ ਨਿਗਾਹ ਨਾਲ (ਹੀ) ਮਿਲਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਦਰੀ = ਮਿਹਰ ਦੀ ਨਿਗਾਹ ਨਾਲ। ਅੰਮ੍ਰਿਤੁ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, es a través de la Gracia de Dios que uno es bendecido con el Néctar del Señor, el Tesoro de Virtud. (2)"