[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਰੇ ਤਾਜ ਦੀਗਰ ਬਿਰਾਦਰ ਸਪੁਰਦ ॥੧੧੪॥"
page = 1405

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And endowed the crown on the head of the brother (moon).(114)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਿਰ ਦਾ ਤਾਜ ਆਪਣੇ ਭਰਾ ਦੇ ਹਵਾਲੇ ਕਰ ਦਿੱਤਾ (ਭਾਵ-ਸੂਰਜ ਡੁਬ ਗਿਆ ਅਤੇ ਚੰਦ੍ਰਮਾ ਚੜ੍ਹ ਪਿਆ) ॥੧੧੪॥"