[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖਿ ਆਵੈ; ਮਨਮੁਖਿ ਜਾਵੈ ॥"
page = 1073
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The egocentric comes and the egocentric goes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਨਮੱਤੀਆ ਆਉਂਦਾ ਹੈ ਤੇ ਮਨਮੱਤੀਆ ਹੀ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The self-willed manmukh comes, and the self-willed manmukh goes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ ਆਵਤਾ ਹੈ ਅਰ ਮਨਮੁਖ ਜਾਤਾ ਹੈ, ਭਾਵ ਜਨਮਤਾ ਮਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲਾ ਮਨੁੱਖ ਜੰਮਦਾ ਹੈ ਮਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਮੁਖਿ = ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲਾ ਮਨੁੱਖ। ਆਵੈ = ਜੰਮਦਾ ਹੈ। ਜਾਵੈ = ਮਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El ególatra va y viene sin cesar, sufre dolor una y otra vez,"