[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੇ ਪੁਤ੍ਰੀ ਤੂੰ ਕਾਲਿਕਾ, ਹੋਹੁ ਜੁ ਮੁਝ ਮੈ ਲੀਨ ॥੭੬॥"
page = 83

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O my daughter Kalika, merge in me.”76.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਹੇ ਪੁੱਤਰੀ ਕਾਲਕਾ! ਤੂੰ ਮੇਰੇ ਵਿਚ ਲੀਨ ਹੋ ਜਾ ॥੭੬॥"