[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਹਿਰੋ ਜਾ ਕੋ ਜਲ ਰਹੈ; ਜਾ ਸਮ ਨਦੀ ਨ ਆਨ ॥"
page = 896

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Its water was very deep and there was no other rivulet like this."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਪਾਣੀ ਬਹੁਤ ਡੂੰਘਾ ਸੀ; ਉਸ ਵਰਗੀ ਹੋਰ ਕੋਈ ਨਦੀ ਨਹੀਂ ਸੀ।"