[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਬਿਨੁ ਦਾਤਾ; ਅਵਰੁ. ਨ ਕੋਈ ॥"
page = 1062
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without Him, there is no other Giver."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਬਗ਼ੈਰ ਹੋਰ ਕੋਈ ਦਾਤਾਰ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no other Giver, except for Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਪਰਮਾਤਮਾ ਸੇ ਬਿਨਾਂ ਹੋਰ ਕੋਈ ਭੀ ਦਾਤਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਤੋਂ ਬਿਨਾ ਕੋਈ ਹੋਰ ਕੁਝ ਦੇਣ-ਜੋਗਾ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਵਰੁ = ਕੋਈ ਹੋਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no hay ningún otro Señor Bondadoso. A quien sea a quien Él bendice con el Nombre,"