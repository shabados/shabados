data = "ਨਾਮ ਤੁਪਕ ਕੇ ਸਕਲ ਬਿਚਾਰੋ ॥੭੧੩॥"
page = 751

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Vrakshaj” in the beginning and then adding the words “Raajaa” and “Prashthani”, comprehend all the names of Tupak.713."

