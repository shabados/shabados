[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਹ ਇਕ ਹੋਸ਼ ਵਿਚ ਰਹਿੰਦੇ ਹਨ ਅਤੇ ਮਸਤੀ ਨਹੀਣ ਕਰਦੇ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਸਰ ਤਾ ਬਕਦਮ ਬਹੋਸ਼ ਓ ਮਸਤੀ ਨ ਕੁਨੰਦ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, the eternal treasure blessed by Akaalpurakh directs one towards His path. (284)"