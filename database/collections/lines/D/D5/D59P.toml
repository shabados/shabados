[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਾਹੁ ਪੁਤ੍ਰ ਲਖਿ ਤਿਹ ਧਨੀ; ਸਕਲ ਮਿਲਤ ਭੇ ਆਇ ॥੯॥"
page = 892

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(People) came and met assuming the barber’s son to be the Shah’s son.(9)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਧਨੀ ਨੂੰ ਸ਼ਾਹ ਦਾ ਪੁੱਤਰ ਸਮਝ ਕੇ ਸਭ ਮਿਲਣ ਲਈ ਆਏ ॥੯॥"