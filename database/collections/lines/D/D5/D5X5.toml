type = "primary"
data = "ਕਹੂੰ ਨ ਜਾਪੀ ॥੯੧॥"
page = 560

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The whole world will become sinful and no person repeating the Name or performing austerities, will be left in the world.91."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਵੀ ਜਪ ਕਰਨ ਵਾਲਾ ਨਹੀਂ ਹੋਵੇਗਾ ॥੯੧॥"