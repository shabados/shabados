[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਲਤ ਫਿਰਤ ਯਾ ਕੋ ਨਿਰਖਿ; ਰਹੇ ਚਰਨ ਲਪਟਾਇ ॥੩੨॥"
page = 893

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing them walking in, they fell on their feet (and begged),(32)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸ਼ਾਹ ਨੂੰ) ਚਲਦਾ ਫਿਰਦਾ ਦੇਖ ਕੇ ਸਾਰੇ ਉਸ ਦੇ ਚਰਨੀ ਲਗ ਗਏ ॥੩੨॥"