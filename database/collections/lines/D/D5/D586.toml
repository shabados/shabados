type = "primary"
data = "ਤੁਮਲ ਜੁਧ ਮਾਗ︀ਯੋ ਮੁਖ ਪਾਯੋ ॥੧੧॥"
page = 1014

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He asked for a boon from Shiva, which could win him a big war.(11)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਘੋਰ ਯੁੱਧ ਦਾ ਮੂੰਹ ਮੰਗਿਆ ਵਰਦਾਨ ਪ੍ਰਾਪਤ ਕੀਤਾ ॥੧੧॥"