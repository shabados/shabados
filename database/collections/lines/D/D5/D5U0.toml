[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਧੁ ਵਿਣੁ. ਨਾਹੀ ਕੋਈ ਮੇਰਾ ॥"
page = 1085
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without Thee, O Lord, no one is mine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਬਗ਼ੈਰ, ਹੇ ਸੁਆਮੀ! ਮੈਡਾਂ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Other than You, O Lord, no one is mine."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਬਿਨਾਂ ਮੇਰਾ ਕੋਈ ਰਖਕੁ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੈਥੋਂ ਬਿਨਾ ਮੇਰਾ ਕੋਈ (ਸਹਾਰਾ) ਨਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No hay nada en este Universo que no Te pertenezca,"