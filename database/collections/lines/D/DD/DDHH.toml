[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਰਸਕਿ ਰਸਕਿ ਗੁਣ ਗਾਇਆ ॥੨॥"
page = 622
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Enthralled with joy, I now sing the God's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੁਸ਼ੀ ਨਾਲ ਸਰਸ਼ਾਰ ਹੋ, ਹੁਣ ਮੈਂ ਵਾਹਿਗੁਰੂ ਦੀ ਕੀਰਤੀ ਗਾਇਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "in joyful rapture, I sing the Glorious Praises of the Lord. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਤੇ ਹਮਨੇ ਪ੍ਰੇਮੀਓਂ ਕੇ ਸਾਥ ਮਿਲ ਕੇ ਹਰਿ ਰਸਕ ਕੇ ਗੁਨੋਂ ਕੋ ਗਾਯਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦਾ ਬੜੇ ਪ੍ਰੇਮ ਨਾਲ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੇ ਗੀਤ ਗਾਂਦਾ ਰਹਿੰਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਸਕਿ = ਪ੍ਰੇਮ ਨਾਲ, ਰਸ ਲੈ ਲੈ ਕੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "canto Su Alabanza envuelto en Dicha. (2)"