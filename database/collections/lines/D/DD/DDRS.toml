[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਥ ਕਥ ਰਮਣੰ; ਸਰਣੰ ਸਰਬਤ੍ਰ ਜੀਅਣਹ ॥"
page = 1361
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is pervading every-where and gives refuge to all the being."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਹਰ ਥਾਂ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ ਅਤੇ ਸਮੂਹ ਜੀਵਾਂ ਨੂੰ ਪਨਾਹ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord is All-pervading everywhere; He gives Sanctuary to all living beings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਹਾਂ ਕਹਾਂ ਅਰਥਾਤ ਸਰਬ ਅਸਥਾਨੋਂ ਮੇਂ ਪੂਰਨ ਰੂਪ ਜੋ ਸਰਬ ਜੀਵੋਂ ਕਾ (ਸਰਣੰ) ਆਸਰਾ ਵਾਹਿਗੁਰੂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਪਰਮਾਤਮਾ ਹਰ ਥਾਂ ਵਿਆਪਕ ਹੈ ਅਤੇ ਸਾਰੇ ਜੀਵਾਂ ਦਾ ਆਸਰਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਥ ਕਥ = ਜਿਥੇ ਕਿਥੇ, ਹਰ ਥਾਂ। ਰਮਣੰ = ਵਿਆਪਕ। ਸਰਣੰ = ਓਟ, ਆਸਰਾ (शरणं)। ਸਰਬਤ੍ਰ = ਸਾਰੇ (सर्वत्र = in all places)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor es Todo Prevaleciente,"