[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਗੁਰਮੁਖਿ ਸਾਚਿ ਸਮਾਇ ॥੧੩॥"
page = 939
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "A. 17: Nanak, the Guru-ward knows that the True Lord is pervading the three worlds. The Yogis say."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉ. 17: ਨਾਨਕ, ਗੁਰੂ-ਅਨੁਸਾਰੀ ਜਾਣਦਾ ਹੈ ਕਿ ਸੱਚਾ ਸੁਆਮੀ ਤਿੰਨਾਂ ਜਹਾਨਾਂ ਅੰਦਰ ਵਿਆਪਕ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, the Gurmukh merges in Truth. ||13||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਤੀਨ ਭਵਨੋਂ ਮੇਂ ਸਾਚਾ ਅਕਾਲ ਪੁਰਖ ਸਮਾਇ ਰਹਾ ਹੈ, ਪਰੰਤੂ ਗੁਰਮੁਖੋਂ ਨੇ ਜਾਨਾ ਹੈ ੫ ॥੧੩॥☬ਪ੍ਰਸ਼ਨ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਗੁਰਮੁਖ ਮਨੁੱਖ ਸੱਚੇ ਪ੍ਰਭੂ ਵਿਚ ਲੀਨ ਰਹਿੰਦਾ ਹੈ ॥੧੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚਿ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਵਿਚ ॥੧੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y el hombre de Dios es quien permanece siempre unido en la Verdad.  (13)"