[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਇਆ ਅੰਦਰਿ. ਹਉਮੈ ਮੇਰਾ ॥"
page = 126
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within the body is egotism and egoism,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੇਹਿ ਦੇ ਅੰਦਰ ਹੰਕਾਰ ਤੇ ਅਪਣੱਤ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the body is filled with ego and selfishness,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਤਕ ਦੇਹ ਸੂਖਮ ਸਰੀਰ ਮੇਂ ਹੰਤਾ ਮਮਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਜਿਸ ਮਨੁੱਖ ਦੇ ਸਰੀਰ ਵਿਚ ਹਉਮੈ ਪ੍ਰਬਲ ਹੈ ਮਮਤਾ ਪ੍ਰਬਲ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਇਆ = ਸਰੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si dentro de ti vive la idea del yo soy"