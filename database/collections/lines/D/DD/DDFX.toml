[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਬ੍ਰਹਮੇ ਬਿਸਨ ਮਹੇਸ, ਲਖ ਧਿਆਇਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Millions of Brahmas, Visnus and Mahegas adore the Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਨਾਨਕ ਜੀ ਦੇ ਪਾਤਸ਼ਾਹ ਦੇ ਅੱਗੇ) ਬ੍ਰਹਮੇ, ਬਿਸ਼ਨੁ ਸ਼ਿਵ ਆਦਿ ਲਖਾਂ ਧਿਆਨ ਕਰਣ ਹਾਰੇ (ਮੁਸਾਹਿਬ ਹਨ)।"