[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਾਧਨ ਸਬੈ ਕ੍ਰਿਤਾਰਥ ਕਰਾ ॥"
page = 173

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In this way, Vishnu, manifesting himself as the eighth incarnation, gratified all the saints."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਾਰਿਆਂ ਸਾਧਾਂ ਨੂੰ ਸਫਲ-ਮਨੋਰਥ (ਕ੍ਰਿਤਾਰਥ) ਕੀਤਾ।"