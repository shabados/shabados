[[content]]
assets = ["DGDG", "DDTK"]
type = "primary"
data = "ਅਲਾਹ ਹੈਂ ॥"
page = 3
line = 8

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "\"ਅਲਾਹ\" ਦਾ ਉਚਾਰਨ \"ਅੱਲਾਹ\" ਨਹੀਂ ਹੈ। \"ਅ-ਲਾਹ\" ਦਾ ਭਾਵ ਹੈ ਅਲੱਭ।"

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art Unbound Lord!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੂੰ) ਲਾਭ (ਲਾਹ) ਪ੍ਰਾਪਤ ਕਰਨ ਤੋਂ ਮੁਕਤ ਹੈਂ,"

