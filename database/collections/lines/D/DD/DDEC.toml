[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਨਾਮੁ ਦੀਓ ਦਾਰੂ ॥"
page = 622
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord God has given me the medicine of His Name,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਨੇ ਮੈਨੂੰ ਆਪਣੇ ਨਾਮ ਦੀ ਦਵਾਈ ਦਿੱਤੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord, Har, Har, gave me the medicine of His Name,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਕੋ ਹਰਿ ਹਰਿ ਨਾਮ ਜਪ ਦਾਰੂ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਵਿਕਾਰ-ਰੋਗਾਂ ਦਾ ਇਲਾਜ ਕਰਨ ਵਾਸਤੇ ਗੁਰੂ ਨੇ ਜਿਸ ਮਨੁੱਖ ਨੂੰ) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਦਵਾਈ ਦਿੱਤੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਾਰੂ = ਦਵਾਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor me bendijo con la Cura de Su Nombre."