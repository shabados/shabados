[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਜੋ ਉਸ ਦੇ ਸੱਚੇ ਪਿਆਰ ਦੀ ਸਿਖਿਆ ਲੈਣਦੇ ਰਹਿੰਦੇ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਆਣ ਕਿ ਮੀਖ਼ਾਨੰਦ ਅਜ਼ ਇਸ਼ਕਸ਼ ਸਬਕ ॥੪੨॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, helps in achieving the eternal divine wealth. (394)"