[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹੁਕਮੈ ਅੰਦਰਿ ਸਭ ਕੋ; ਸਭਨਾ ਆਵਟਣ ਹੈ ਸਹਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "All are in His will and all have to bear the heat of the divine order."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਹੁਕਮ ਦੇ ਅੰਦਰ ਸਾਰਾ (ਸੰਸਾਰ) ਹੈ, (ਭਾਣੇ ਦਾ) ਸੇਕ ਸਭ ਕਿਸੇ ਨੂੰ ਸਹਾਰਨਾ ਬਣਦਾ ਹੈ।"