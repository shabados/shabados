type = "primary"
data = "ਦਲ ਸਹਿਤ ਭੂਮ ਡਿਗੇ ਅਧੀਰ ॥੪੭੪॥"
page = 249

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Even Ram, the king of Raghu clan was beguiled and fell on the earth alongwith his army.474."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸੈਨਾ ਸਮੇਤ ਬੇਸੁੱਧ ਹੋ ਕੇ ਧਰਤੀ ਉੱਤੇ ਡਿੱਗ ਪਏ ਹਨ ॥੪੭੪॥"