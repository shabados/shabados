data = "ਅਛੈ ਸਰੂਪ, ਅਖੈ ਅਭੰਗ ॥"
page = 29

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Who is Unassailable Entity and Who is Indestructible and Imperishable!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਸਰੂਪ ਵਿਨਾਸ਼ ਤੋਂ ਰਹਿਤ, ਖ਼ਤਮ ਹੋਣ ਤੋਂ ਪਰੇ ਅਤੇ ਵਿਘਨ ਤੋਂ ਮੁਕਤ ਹੈ,"