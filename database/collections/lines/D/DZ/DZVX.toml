[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਮ ਧਰਮ ਸਗਲਾ ਈ ਖੋਵੈ ॥"
page = 676
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He forfeits the benefit of all his religious deeds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੇ ਸਮੂਹ ਧਾਰਮਕ ਕੰਮਾਂ ਦੇ ਲਾਭ ਨੂੰ ਗੁਆ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He forfeits all the merits of his good deeds and religion."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਪੂਰਨ ਕਰਮ ਧਰਮ ਕੋ ਖੋਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਇਨਸਾਨੀ ਫ਼ਰਜ਼ ਸਾਰਾ ਹੀ ਭੁਲਾ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲਾ ਈ = ਸਾਰਾ ਹੀ। ਖੋਵੈ = ਗਵਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues ya ha perdido todo sentido de rectitud y todo sentido del deber."