type = "primary"
data = "ਚਤੁਰ ਬਾਨਯੰ ਲੈ ਸੁ ਸੱਬਿਯੰ ਪ੍ਰਹਾਰੇ ॥"
page = 64

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I then threw away the gun and took the arrows in my hand, I shot four of them."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਚਾਰ ਬਾਣ ਲੈ ਕੇ ਸਜੇ ਹੱਥ ਨਾਲ ਛਡੇ"