[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਰਿ ਬਾਰਿ ਜਾਉ ਸੰਤ ਸਦਕੇ ॥"
page = 255
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Again and again I am devoted unto the Saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁੜ ਮੁੜ ਕੇ ਮੈਂ ਸਾਧੂਆਂ ਉਤੇ ਘੋਲੀ ਜਾਂਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Again and again, I am forever devoted to the Saints."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਬਾਰੰਬਾਰ ਸੰਤ ਜਨੋਂ ਕੇ (ਸਦਕੇ) ਬਲਿਹਾਰਨੇ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਮੁੜ ਮੁੜ ਗੁਰੂ ਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi ser en sacrificio a los Santos un millón de veces,"