[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਮੋਹੁ; ਅੰਧੁ ਅੰਧਾਰਾ ॥"
page = 1045
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Inky darkness is the love of riches,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਾਲਾ, ਬੋਲਾ ਅਨ੍ਹੇਰਾ ਹੈ: ਧਨ-ਦੌਲਤ ਦਾ ਪਿਆਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Love and attachment to Maya are utter darkness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਕੇ ਮੋਹ ਰੂਪ ਅੰਧੇਰੇ ਕਰ ਕੇ ਜਗਤ ਅੰਧਾ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ ਵਿਚ ਹਰ ਥਾਂ) ਮਾਇਆ ਦਾ ਮੋਹ (ਭੀ ਪ੍ਰਬਲ) ਹੈ, (ਮੋਹ ਦੇ ਕਾਰਨ ਜਗਤ) ਘੁੱਪ ਹਨੇਰਾ ਬਣਿਆ ਪਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਧੁ ਅੰਧਾਰਾ = ਘੁੱਪ ਹਨੇਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Maya y el apego nacen de la negra oscuridad de la Ignorancia."