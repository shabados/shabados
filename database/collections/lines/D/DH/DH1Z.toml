type = "primary"
data = "ਹ੍ਵੈ ਬੇਰਕਤ ਮੇਖਲਾ ਗਹੀ ॥"
page = 952

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘I will go and live at my parents where I was born, may be I will have to live as a destitute."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਾਂ) ਬੈਰਾਗਣ ਹੋ ਕੇ ਗੋਦੜੀ ਧਾਰਨ ਕਰ ਲਵਾਂਗੀ।"