[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਬਖ਼ਸ਼ ਅੰਦਰੂੰ ਬੇਸ਼ੁਮਾਰ ਆਮਦੰਦ ॥੪੩॥"
page = 1396

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Which were adorned with gold and silver trappings.(43)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਬਹੁਤ ਸਾਰੇ ਬਖ਼ਸ਼ ਦਿੱਤੇ ਹਨ, (ਹੁਣ ਮੇਰੇ ਪਾਸ ਕੋਈ ਊਠ ਵੀ ਨਹੀਂ ਹੈ) ॥੪੩॥"