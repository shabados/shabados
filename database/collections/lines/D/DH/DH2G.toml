[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨ ਪਿਰ; ਏਕੈ ਸੰਗਿ ਬਸੇਰਾ ॥"
page = 483
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The bride and the Groom abide together."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲਾੜੀ ਅਤੇ ਲਾੜਾ ਇੱਕੋ ਥਾਂ ਉਤੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The bride and the Groom dwell together."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ (ਧਨ) ਇਸਤ੍ਰੀ ਜੀਵ ਕਾ (ਪਿਰ) ਰਾਮ ਸਾਖੀ ਕਾ ਏਕ ਹੀ ਸਰੀਰ ਸੰਗ ਬਾਸਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮੈਂ ਜੀਵ-) ਵਹੁਟੀ ਤੇ ਖਸਮ (-ਪ੍ਰਭੂ) ਦਾ ਵਸੇਬਾ ਇੱਕੋ ਥਾਂ ਹੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਨ = ਇਸਤ੍ਰੀ। ਪਿਰ = ਖਸਮ ਦਾ। ਬਸੇਰਾ = ਵਸੇਬਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Esposo y la novia habitan en el mismo lugar,"