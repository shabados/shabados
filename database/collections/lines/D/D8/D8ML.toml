data = "ਭਏ ਸਾਧੁ ਸੰਬੂਹ ਭੀਤੰ ਅਭੀਤੇ ॥"
page = 119

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the resolute assemblies of saints have become fearless."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਸਾਧੂ ਡਰ ਤੋਂ ਨਿਡਰ ਹੋ ਗਏ ਹਨ;"