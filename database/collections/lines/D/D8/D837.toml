[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੈ ਸਬਦਿ. ਰਹਿਆ ਭਰਪੂਰਿ ॥੭॥"
page = 1278
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru's word, they behold the Lord fully-filling all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਬਾਣੀ ਰਾਹੀਂ, ਉਹ ਪ੍ਰਭੂ ਨੂੰ ਸਾਰੇ ਪਰੀਪੂਰਨ ਦੇਖਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Word of the Guru's Shabad, He is pervading and permeating everywhere. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਸਬਦ ਕਰ ਤਿਨੋਂ ਨੇ ਭਰਪੂਰ ਹੋ ਰਹਾ ਜਾਨਾ ਹੈ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ ਉਹਨਾਂ ਨੂੰ ਉਹ ਹਰ ਥਾਂ ਵਿਆਪਕ ਦਿੱਸਦਾ ਹੈ ॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਬਦਿ = ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ। ਭਰਪੂਰਿ = ਸਭ ਥਾਂ ਵਿਆਪਕ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mediante el Shabd del Guru, Él prevalece y lo compenetra todo. (7)"