data = "ਕਾਨੜਾ ਮਹਲਾ ੫ ਘਰੁ ੧੧ ॥"
page = 1307
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Kanra 5th Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਾਨੜਾ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Kaanraa, Fifth Mehl, Eleventh House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਕਾਨੜਾ, ਘਰ ੧੧ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Malhar, Kanra, Mejl Guru Aryan, Quinto Canal Divino, Décima Primera Casa."