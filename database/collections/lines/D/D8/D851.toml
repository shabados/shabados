[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਸਰੋਵਰ ਜੋਤਿ ਸਮਾਣੀ ॥"
page = 1342
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lord's Light permeates all heart-pools."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਦਿਲਾਂ ਦੇ ਤਾਲਬਾਂ ਅੰਦਰ ਪ੍ਰਭੂ ਦਾ ਪ੍ਰਕਾਸ਼ ਰਮਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord's Light fills the sacred pools of all beings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰ ਰੂਪੀ ਸਰਬ ਸਰੋਵਰ ਮੇਂ ਜਿਸ ਕੀ ਪੋਤਿ ਸਮਾਇ ਰਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਪਰਮਾਤਮਾ ਦੀ ਜੋਤਿ ਸਾਰੇ ਹੀ ਸਰੀਰਾਂ ਵਿਚ ਵਿਆਪਕ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰੋਵਰ = ਸਰੋਵਰਾਂ ਵਿਚ, ਸਰੀਰਾਂ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Luz del Señor, llena los Senotes Sagrados de todos los seres."