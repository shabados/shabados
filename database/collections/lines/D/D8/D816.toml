[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਉਠਿ ਅਨਰੁਧ ਠਾਢੋ ਭਯੋ; ਧਨੁਖ ਬਾਨ ਲੈ ਹਾਥ ॥"
page = 1016

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Anuradh got up and took his bow and arrows in his hand."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਨਰੁਧ ਹੱਥ ਵਿਚ ਧਨੁਸ਼ ਬਾਣ ਲੈ ਕੇ ਉਠ ਖੜੋਤਾ।"