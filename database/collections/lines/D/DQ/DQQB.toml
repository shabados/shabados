[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਤਿ ਸੇਤੀ ਘਰਿ ਜਾਹੁ; ਨਾਮੁ ਵਖਾਣੀਐ ॥"
page = 1288
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Uttering the Lord's Name, the mortal goes to his Home with honour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦਾ ਉਚਾਰਣ ਕਰਨ ਦੁਆਰਾ, ਪ੍ਰਾਣੀ ਇੱਜ਼ਤ ਆਬਰੂ ਨਾਲ ਆਪਣੇ ਧਾਮ ਨੂੰ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chanting the Naam, the Name of the Lord, one returns to his true home with honor."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਮ ਕੇ (ਵਖਾਣੀਐ) ਜਪਨੇ ਵਾਲੇ ਹੈਂ, ਸੋ ਪਤ ਸਹਿਤ ਪ੍ਰਲੋਕ ਘਰ ਮੇਂ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਦਾ) ਨਾਮ ਸਿਮਰਨਾ ਚਾਹੀਦਾ ਹੈ (ਜੇ ਨਾਮ ਸਿਮਰੀਏ) ਤਾਂ ਬੇਸ਼ਕ ਇੱਜ਼ਤ ਨਾਲ ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ ਅੱਪੜੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿ = ਇੱਜ਼ਤ। ਸੇਤੀ = ਨਾਲ। ਘਰਿ = ਘਰ ਵਿਚ, ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cantando el Naam, el Nombre del Señor, uno regresa a su Verdadero y Honorable Hogar."