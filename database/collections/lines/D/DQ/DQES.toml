[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਹਿ; ਦੇਵਤੇ ਕੋੜਿ ਤੇਤੀਸਾ ॥"
page = 1079
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The thirty-three crores of gods dwell upon Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਤੀ ਕ੍ਰੋੜ ਦੇਵਤੇ ਤੇਰਾ ਚਿੰਤਨ ਕਰਦੇ ਹਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The three hundred thirty million gods meditate in remembrance."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੇਵਤੇ ਜੋ ਤੇਤੀ ਕਰੋੜ ਹੈਂ ਵਹੁ ਭੀ ਤੇਰੇ ਕੋ ਸਿਮਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਤੀ ਕ੍ਰੋੜ ਦੇਵਤੇ ਵੀ ਪ੍ਰਭੂ ਨੂੰ ਹੀ ਯਾਦ ਕਰ ਰਹੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋੜਿ ਤੇਤੀਸਾ = ਤੇਤੀ ਕ੍ਰੋੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "también los treinta y tres coros de ángeles, los dioses y los seres malignos,"