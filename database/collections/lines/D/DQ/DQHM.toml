[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਰਥਾ ਜਨਮੁ ਗਵਾਇਆ ॥੧॥ ਰਹਾਉ ॥"
page = 793
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou hast lost thy human life in vain. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪਣੇ ਮਨੁੱਖੀ ਜੀਵਨ ਵਿਅਰਥ ਗੁਆ ਲਿਆ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You have wasted this human life, and lost. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਤੇ ਬਿਯਰਥ ਹੀ ਜਨਮੁ ਗਵਾਇ ਲੀਆ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਾਰੀ ਉਮਰ ਵਿਅਰਥ ਗਵਾ ਲਈ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así tu vida ha sido desperdiciada. (1-Pausa)"