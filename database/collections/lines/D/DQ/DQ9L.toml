[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਡੈ ਭਾਗਿ; ਗੁਰਮੁਖਿ ਹਰਿ ਪਾਵੈ ॥੧॥"
page = 367
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By good destiny the Guru-ward obtains God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚੰਗੀ ਕਿਸਮਤ ਦੁਆਰਾ ਗੁਰੂ ਅਨੁਸਾਰੀ ਹਰੀ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By great good fortune, the Gurmukh obtains the Lord. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸਾ ਹਰਿ ਨਾਮ ਬਡੇ ਭਾਗ ਸੇ ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਜੀਵ ਕੋ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਣ ਵਾਲਾ ਮਨੁੱਖ ਵੱਡੀ ਕਿਸਮਤਿ ਨਾਲ ਇਹ ਹਰਿ-ਨਾਮ ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਣ ਵਾਲਾ ਮਨੁੱਖ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si uno contempla el Nombre, su mente se ilumina. (1)"