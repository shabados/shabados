[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੀ ਸਰਣਿ ਪਵੈ; ਸੁਖੁ ਥੀਐ ॥"
page = 904
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Seeking the Guru's protection, peace ensues."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਪਨਾਹ ਲੈਣ ਦੁਆਰਾ ਆਰਾਮ ਉਤਪੰਨ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Seeking the Sanctuary of the Guru, peace is found."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰੋਂ ਕੀ ਸਰਣ ਇਹ ਜੀਵ ਪੜੇ ਤੋ ਸੁਖੁ ਹੋਤਾ ਹੈ, ਤਾਂ ਤੇ ਪਰਮੇਸ੍ਵਰ ਪਾਸ ਬੇਨਤੀ ਕਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਂਦਾ ਹੈ ਤਦੋਂ ਇਸ ਨੂੰ ਆਤਮਕ ਆਨੰਦ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero reposando en el Santuario del Guru, uno vive siempre en Paz."