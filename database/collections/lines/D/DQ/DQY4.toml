[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਰਛੀ ਤਬ ਹੀ ਸਿਵ ਪੂਤ ਸੰਭਾਰੀ ॥੧੫੧੦॥"
page = 448

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the army saw this condition of Shiva, then Ganesh, the son of Shiva, took the lance in his hand.1510."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਸ਼ਿਵ ਦੇ ਪੁੱਤਰ (ਗਣੇਸ਼) ਨੇ ਬਰਛੀ ਸੰਭਾਲ ਲਈ ॥੧੫੧੦॥"