[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਈ ਕਰੇ; ਜਿ ਹਰਿ ਜੀਉ ਭਾਵੈ ॥"
page = 1173
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If man does only that which pleases the Sire Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਇਨਸਾਨ ਕੇਵਲ ਓਹੀ ਕੁਛ ਕਰੇ, ਜਿਹੜਾ ਮਹਾਰਾਜ ਮਾਲਕ ਨੂੰ ਚੰਗਾ ਲਗਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who does only that which is pleasing to the Dear Lord"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਹਰਿ ਜੀ ਕੋ ਭਾਵਤਾ ਹੈ, ਸੋਈ ਗੁਰਮੁਖ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਮਨੁੱਖ ਉਹੀ ਕੁਝ ਕਰਦਾ ਹੈ ਜੋ ਕੁਝ ਪਰਮਾਤਮਾ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿ = ਜਿਹੜੀ ਗੱਲ, ਜੋ ਕੁਝ। ਭਾਵੈ = ਪਸੰਦ ਆਉਂਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si uno vive en la Voluntad del Señor,"