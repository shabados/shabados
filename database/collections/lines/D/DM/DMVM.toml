[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੋਊ ਬੀਰ ਬਾਨਾ ਬਧੈ ਅਧ ਅਧੰ ॥"
page = 146

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Both the warriors had tightened their tearing shafts."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਹਾਂ ਵੀਰਾਂ ਨੇ ਟੋਟੇ ਟੋਟੇ ਕਰ ਦੇਣ ਵਾਲੇ ਬਾਣਾਂ (ਦੇ ਭੱਥੇ) ਬੰਨ੍ਹੇ ਹੋਏ ਸਨ।"