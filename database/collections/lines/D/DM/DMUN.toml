[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਵਹਿ ਜਾਂਹਿ; ਮਰਹਿ ਮਰਿ ਜਾਈ ॥੪॥"
page = 1343
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The man comes, goes dies over and over again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਆਉਂਦਾ, ਜਾਂਦਾ ਤੇ ਮੁੜ ਮੁੜ ਕੇ ਮਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They come and go in reincarnation; they die, only to be reborn and die again. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਮਨਮੁਖ ਜੀਵ ਜੋਨੀਓਂ ਮੇਂ ਆਵਤੇ ਜਾਤੇ ਜਨਮਤੇ ਮਰਤੇ ਰਹਿਤੇ ਹੈਂ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦਾ ਜੰਮਦੇ ਹਨ ਤੇ ਆਤਮਕ ਮੌਤ ਸਹੇੜਦੇ ਹਨ। (ਜੇਹੜਾ ਭੀ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਨ ਤੋਂ ਤੇ ਸਿਮਰਨ ਤੋਂ ਵਾਂਜਿਆ ਰਹਿੰਦਾ ਹੈ) ਉਹ ਆਤਮਕ ਮੌਤ ਸਹੇੜਦਾ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਰਿ ਜਾਈ = ਆਤਮਕ ਮੌਤੇ ਮਰ ਜਾਂਦਾ ਹੈ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mueren sólo para renacer y volver a morir. (4)"