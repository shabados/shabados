[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੇਤੜਿਆਂ ਭੁਖੇ ਮਰਨਿ; ਕੇਤੜਿਆਂ ਰਾਜੇ ਰਸ ਭੋਗੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many are dying of starvation whereas many are kinds who are enjoying their kingdoms."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਈ ਭੁੱਖੇ ਹੀ ਮਰਦੇ ਹਨ, ਕਈ ਰਾਜੇ (ਰਸਾਂ=) ਵਿਖਿਆਂ ਨੂੰ ਭੋਗਦੇ ਹਨ।"