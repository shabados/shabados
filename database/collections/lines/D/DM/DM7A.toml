[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹੂੰ ਪਾਰਧੀ ਹ੍ਵੈ ਕੈ ਧਰੇ ਬਾਨ ਰਾਜੇ ॥"
page = 40

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere He becomes a hunter who looks glorious with His arrow (in His bow)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ ਸ਼ਿਕਾਰੀ ਹੋ ਕੇ (ਕਮਾਨ ਉਤੇ) ਤੀਰ ਰਖ ਕੇ ਸੋਭ ਰਿਹਾ ਹੈਂ।"