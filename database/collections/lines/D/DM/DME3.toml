[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਵਨੁ ਸੁ ਆਵੈ; ਕਵਨੁ ਸੁ ਜਾਇ ॥"
page = 939
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Q. 15: Who is he that comes? Q. 16: Who is he, who goes?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰ. 15: ਉਹ ਕੌਣ ਹੈ ਜੋ ਆਉਂਦਾ ਹੈ? ਪ੍ਰ. 16: ਉਹ ਕੌਣ ਹੈ ਜੋ ਜਾਂਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who comes, and who goes?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਵਤਾ ਜਾਵਤਾ ਕਵਨ ਹੈ ੪?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਦਾ) ਜੰਮਦਾ ਮਰਦਾ ਕੌਣ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਵੈ ਜਾਇ = ਜੰਮਦਾ ਮਰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Quién viene y se va?"