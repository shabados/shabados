[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਸਤਕਿ ਭਾਗ, ਜਿਨ੍ਹਾਂ ਦੇ ਮੰਦੇ ॥੨॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They are most unfortunate in life like the frogs."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਦੇ ਮੱਥੇ ਦੇ ਖੋਟੇ ਭਾਗ ਹਨ।"