[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੂਜਰੀ ਮਹਲਾ ੫ ਚਉਪਦੇ ਘਰੁ ੧ ॥"
page = 495
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Gujri, 5th Guru. Chaupade."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੂਜਰੀ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ। ਚਉਪਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Goojaree, Fifth Mehl, Chau-Padhay, First House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਗੂਜਰੀ, ਘਰ ੧ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਚਾਰ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Guyeri, Mejl Guru Aryan, Quinto Canal Divino, Chau-Padas."