[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਾਲੁ; ਅਮੋਲਾ ਲਾਲੋ ॥"
page = 1006
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Beloved is an invaluable jewel."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਪ੍ਰੀਤਮ ਇਕ ਅਣਮੁਲਾ ਜਵੇਹਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My Beloved is a priceless jewel."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਿਆਰਾ ਅਮੋਲਕ ਲਾਲ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਇਕ ਐਸਾ ਲਾਲ ਹੈ ਜਿਹੜਾ ਕਿਸੇ (ਦੁਨੀਆਵੀ) ਕੀਮਤ ਤੋਂ ਨਹੀਂ ਮਿਲਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਮੋਲਾ = ਜਿਹੜਾ ਕਿਸੇ ਭੀ ਕੀਮਤ ਤੋਂ ਨਾਹ ਮਿਲ ਸਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Inapreciable es ese Rubí, esa Joya,"