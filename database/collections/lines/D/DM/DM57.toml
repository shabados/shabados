[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਦੀ ਯਾਦ ਬੰਦੇ ਲਈ ਬਹੁ-ਮੁੱਲੀ ਹੁੰਦੀ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਯਾਦਿ ਹੱਕ ਬਰ ਬੰਦਾ ਅਰਜ਼ਾਨੀ ਬਵਦ ॥੨੬੬॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Whether it be the Sultaan of Iran, or Khan of Khutan"