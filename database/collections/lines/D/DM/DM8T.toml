data = "ਸੋ ਲਖਿ ਤਵਨ ਚੋਰ ਨੈ ਪਾਯੋ ॥"
page = 989

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Once, a Rattan Singh came on that route and the thief saw him."

[[content]]
