[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਕਟਿ ਵਸੈ; ਨਾਹੀ ਪ੍ਰਭੁ ਦੂਰੇ ॥੨॥"
page = 563
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord abides near and is not far off."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਨੇੜੇ ਵੱਸਦਾ ਹੈ, ਦੁਰੇਡੇ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is near at hand, not far away. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਾਂ ਤੇ ਸਭ ਕੇ ਨਿਕਟ ਹੀ ਬਸਤਾ ਹੈਂ, ਹੇ ਪ੍ਰਭੂ! ਕਿਸੀ ਸੇ ਤੂੰ ਦੂਰ ਨਹੀਂ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ (ਹਰੇਕ ਜੀਵ ਦੇ) ਨੇੜੇ ਵੱਸਦਾ ਹੈ, ਕਿਸੇ ਤੋਂ ਦੂਰ ਨਹੀਂ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਕਟਿ = ਨੇੜੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Estás tan cerca de mí y nunca lejos.(2)"