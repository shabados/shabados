[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਸਿ ਨਿਰੰਜਨੁ; ਰਚਸਿ ਮਨਾ ॥"
page = 156
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By remembering the Bright Lord, thy soul shall be absorbed in Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਕਾਸ਼ਵਾਨ ਪ੍ਰਭੂ ਦਾ ਸਿਮਰਣ ਕਰਨ ਦੁਆਰਾ, ਤੇਰੀ ਆਤਮਾ ਉਸ ਅੰਦਰ ਲੀਨ ਹੋ ਜਾਵੇਗੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditate on the Immaculate Lord, and saturate your mind with Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ (ਤੂੰ) ਨਿਰੰਜਨ ਵਾਹਗੁਰੂ ਸੇ ਮਨ ਕੋ ਖਚਤ ਕਰ ਕੇ ਜਪ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੋਗੀ! ਆਪਣਾ ਮਨ ਜੋੜ ਕੇ ਮਾਇਆ-ਰਹਿਤ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਸਿਮਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਚਸਿ ਮਨਾ = ਮਨ ਰਚਾ ਕੇ, ਮਨ ਜੋੜ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Satura tu mente de Él, y habita en Él, tu Señor Inmaculado."