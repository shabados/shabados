[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਗ ਮਹਿ ਸ੍ਰੇਸਟੁ ਊਤਮ ਕਾਮੁ ॥"
page = 998
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "is the sublime and majestic avocation in this world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਸੰਸਾਰ ਅੰਦਰ ਇੱਕ ਚੰਗਾ ਅਤੇ ਵਧੀਆਂ ਕਾਰਵਿਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "To chant it is the most sublime and exalted activity in this world."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਕਾਮ ਜਗਤ ਮੇਂ ਸੇਸਟ ਔ ਉਤਮ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦਾ ਨਾਮ ਜਪਣਾ) ਦੁਨੀਆ ਵਿਚ (ਹੋਰ ਸਾਰੇ ਕੰਮ ਨਾਲੋਂ) ਵਧੀਆ ਤੇ ਚੰਗਾ ਕੰਮ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਮੁ = ਕੰਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su Nombre es y siempre será Verdadero."