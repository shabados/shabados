[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਜਪਤ; ਸਭੁ ਮਿਟਿਓ ਅੰਦੇਸਾ ॥੧॥ ਰਹਾਉ ॥"
page = 194
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meditating on the Name all the anxieties are annulled. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਨ ਤੇ ਸਾਰੇ ਫਿਕਰ ਨਾਬੂਦ ਹੋ ਜਾਂਦੇ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chanting the Naam, the Name of the Lord, all anxieties are dispelled. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਨਾਮ ਕੋ ਜਪਨੇ ਕਰ ਕੇ ਸਰਬ ਪ੍ਰਕਾਰ ਕਾ (ਅੰਦੇਸਾ) ਸੰਸਾ ਨਬਿਰਤ ਭ੍ਯਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਵਾਸਤੇ) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪਦਿਆਂ (ਉਹਨਾਂ ਦੇ ਅੰਦਰੋਂ) ਹਰੇਕ ਫ਼ਿਕਰ ਮਿਟਿਆ ਰਹਿੰਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਪਤ = ਜਪਦਿਆਂ। ਸਭੁ ਅੰਦੇਸਾ = ਸਾਰਾ ਫ਼ਿਕਰ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y cantando el Naam, eliminan su ansiedad. (1-Pausa)"