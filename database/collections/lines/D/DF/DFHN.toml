[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਤਾ ਧੋਤਾ; ਥਾਇ. ਨ ਪਾਈ ॥"
page = 951
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "For his ablutions and washings, he is approved not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਨ੍ਹਾਉਣ ਅਤੇ ਧੋਣ ਦੇ ਬਾਵਜੂਦ ਉਹ ਸਾਈਂ ਦੇ ਦਰ ਕਬੂਲ ਨਹੀਂ ਪੈਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His cleansings and washings will not be approved."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕਾ ਨਾਤਾ ਔ ਬਸਤ੍ਰ ਧੋਤਾ ਕੋਈ ਥਾਇ ਨਹੀਂ ਪੜਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਤਰ੍ਹਾਂ ਨਿੱਤ) ਨ੍ਹਾਉਣ ਧੋਣ ਨਾਲ ਉਹ (ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ) ਕਬੂਲ ਨਹੀਂ ਹੋ ਜਾਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਥਾਇ ਨ ਪਾਈ = ਕਬੂਲ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y después de todas sus abluciones, no es aprobado por Dios."