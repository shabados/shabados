[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਤੂਅਨ ਕਰੀ ਬਨਾਇ ਕੈ ਤਾ ਮੈ ਬਧ︀ਯੋ ਬਨਾਇ ॥"
page = 918

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After making the curry of barley she placed in it a statue carved out flour dough."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਤੂ ਦਾ ਹਾਥੀ ਬਣਾ ਕੇ ਉਸ ਵਿਚ ਬੰਨ੍ਹ ਦਿੱਤਾ।"