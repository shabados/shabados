[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜੇ ਮਾਂ ਹੋਵੈ ਜਾਰਨੀ; ਕਿਉ ਪੁਤੁ ਪਤਾਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "If the mother is adulteress why should son speak ill of her."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਮਾਂ ('ਜਾਰਨੀ') ਵਿਭਚਾਰ ਕਰੇ ਤਾਂ ਪੁੱਤ੍ਰ ਉਸ ਦੀ (ਪਤਾਰੇ=) ਨਿੰਦਾ ਨਾ ਕਰੇ।"