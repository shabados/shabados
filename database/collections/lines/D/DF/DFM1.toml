[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭੁ ਕੋ ਵਣਜੁ ਕਰੇ ਵਾਪਾਰਾ ॥"
page = 1064
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Everyone traffics and trades."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਕੋਈ ਲੈਣ ਦੇਣ ਤੇ ਸੁਦਾਗਰੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everyone deals and trades."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਕੋ ਵਣਜ ਵਾਪਾਰ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ ਵਿਚ ਆ ਕੇ) ਹਰੇਕ ਜੀਵ ਵਣਜ ਵਾਪਾਰ (ਆਦਿਕ ਕੋਈ ਨਾ ਕੋਈ ਕਾਰ-ਵਿਹਾਰ) ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭੁ ਕੋ = ਹਰੇਕ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cada uno comercia y trata con esto y con lo otro, pero sin el Nombre,"