data = "ਮੁਨਿ ਦੇਵ ਮਹਾ ਮਤਿ ਗੂੜ ਗਤੰ ॥੪੮੭॥"
page = 674

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then they propagated the secret doctrines of that great sage in all the countries far and near.487."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਹਾ ਮੁਨੀ ਬਹੁਤ ਗੰਭੀਰ ਅਤੇ ਮਹਾਨ ਮਤ ਅਤੇ ਗਤੀ ਵਾਲੇ ਸਨ ॥੪੮੭॥"