[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕਿ. ਬਿੰਦੁ ਜਤਨ ਕਰਿ ਰਾਖਦੇ; ਸੇ ਜਤੀ ਕਹਾਵਹਿ ॥"
page = 419
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Putting in a effort, some control their semen and call themselves as celibates."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਉਪਰਾਲਾ ਕਰਕੇ ਆਪਣੇ ਵੀਰਜ ਨੂੰ ਰੋਕਦੇ ਹਨ। ਉਹ ਬ੍ਰਹਮਚਾਰੀ ਆਖੇ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some control their sexual energy, and are known as celibates."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਬੀਰਜ ਕੋ ਜਤਨ ਕਰ ਕੇ ਰਾਖਤੇ ਹੈਂ ਔਰ ਵਹੁ ਅਪਨੇ ਕਉ ਜਤੀ ਕਹਾਉਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਬੰਦੇ ਐਸੇ ਹਨ ਜੋ ਜਤਨ ਕਰ ਕੇ ਵੀਰਜ ਨੂੰ ਰੋਕ ਰੱਖਦੇ ਹਨ, ਤੇ ਆਪਣੇ ਆਪ ਨੂੰ ਜਤੀ ਸਦਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿੰਦੁ = ਵੀਰਜ। ਰਾਖਦੇ = ਸਾਂਭਦੇ, ਰੋਕਦੇ। ਸੇ = ਉਹ ਬੰਦੇ।"

