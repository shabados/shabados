[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਗੈ ਨੈਨ ਬੈਨੰ ਧਯੋ ਪਾਨਿ ਪੀਣੰ ॥"
page = 164

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And rushed towards her in order to relish the wantonness of her eyes and the sweetness of her words"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸਾਰਿਆਂ ਨੂੰ ਉਸ ਦੇ) ਨੈਣਾਂ ਅਤੇ ਬੋਲਾਂ (ਦੇ ਬਾਣ ਲਗੇ) ਅਤੇ (ਉਸ ਦੀ ਸੁੰਦਰਤਾ ਦੀ) ਮਦਿਰਾ ਪੀਣ ਲਈ ਦੌੜੇ।"