[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰੈ ਸਤਗੁਰਿ; ਹਰਿ ਨਾਮੁ ਧਿਆਇਆ ॥੧॥ ਰਹਾਉ ॥"
page = 559
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the perfect Satguru I have contemplated over the God's Name. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਸਤਿਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਮੈਂ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕੀਤਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Perfect True Guru, I meditate on the Name of the Lord. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਸਤਿਗੁਰੋਂ ਕੇ ਕ੍ਰਿਪਾ ਕਰਨੇ ਸੇ ਮੈਨੇ ਹਰਿ ਹਰਿ ਨਾਮੁ ਧਿਆਇਆ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਪੂਰੇ ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਨਾ ਸ਼ੁਰੂ ਕਰ ਦਿੱਤਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਗੁਰਿ = ਗੁਰੂ ਦੀ ਰਾਹੀਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y por la Gracia del Guru habitamos en el Naam. (1‑Pausa)"