[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਉਸਰੁ ਚੁਕਾ, ਹਥ ਨ ਆਵੈ ॥੧੫॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Lost opportunity comes not again."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਮਾਂ ਗਿਆ ਹੋਇਆ ਫੇਰ ਹੱਥ ਨਹੀਂ ਆਉਂਦਾ।"