[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕਾ ਦੋਖੀ; ਕਿਸੈ ਕਾ ਨਹੀ ਮਿਤੁ ॥"
page = 280
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints' slanderer, is no man's friend."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਦਾ ਨਿੰਦਕ ਕਿਸੇ ਬੰਦੇ ਦਾ ਮਿੱਤ੍ਰ ਨਹੀਂ ਹੁੰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slanderer of the Saint is nobody's friend."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਕਾ ਦੋਸੀ ਕਿਸੀ ਕਾ ਮਿਤ੍ਰ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਾਹੀਏਂ) ਉਹ (ਕਦੇ) ਕਿਸੇ ਦਾ ਸੱਜਣ ਨਹੀਂ ਬਣਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no puede ser amigo de nadie."