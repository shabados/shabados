data = "ਅਤੇ ਕਿਤੇ ਕੋਈ ਤਾਲ ਤੇ ਨਾਚ (ਕਰ ਰਿਹਾ ਹੈ ਅਤੇ) ਕਿਤੇ (ਕੋਈ) ਗੀਤ ਗਾ ਰਿਹਾ ਹੈ,"