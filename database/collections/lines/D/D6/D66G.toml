[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੁ ਸਾਲਾਹੀ; ਅਵਰੁ ਨ ਕੋਈ ॥"
page = 120
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I praise the True One and naught else."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਤਿਪੁਰਖ ਦੀ ਉਸਤਤੀ ਕਰਦਾ ਹਾਂ ਅਤੇ ਹੋਰ ਕਿਸੇ ਦੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Praise the True One, and no other."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਚੇ ਕੋ ਸਲਾਹੁਤੇ ਹੈਂ ਤਿਨ੍ਹੋਂ ਨੇ ਅਵਰ ਕੋਈ ਨਹੀਂ ਜਾਣਿਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਮੈਂ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦੀ ਹੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦਾ ਹਾਂ। ਮੈਨੂੰ ਕਿਤੇ ਉਸ ਵਰਗਾ ਕੋਈ ਹੋਰ ਨਹੀਂ ਦਿੱਸਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਲਾਹੀ = ਸਾਲਾਹੀਂ, ਮੈਂ ਸਲਾਹੁੰਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Alaba la Verdad y nada más,"