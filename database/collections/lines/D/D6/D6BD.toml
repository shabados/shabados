[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਿਨਸੁ ਰੈਨਿ ਸਦ ਧਿਆਈ ॥"
page = 630
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and day and night I ever remember Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਦਿਨੇ ਰਾਤ ਮੈਂ ਹਮੇਸ਼ਾਂ ਉਸ ਨੂੰ ਯਾਦ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Day and night, I ever meditate on Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਤ੍ਰ ਦਿਨ ਸਦੀਵ ਉਸੀ ਕੋ ਧਿਆਵਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਰਾਤ ਸਦਾ (ਉਸ ਦਾ) ਧਿਆਨ ਧਰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੈਨਿ = ਰਾਤ। ਸਦ = ਸਦਾ। ਧਿਆਈ = ਧਿਆਈਂ, ਮੈਂ ਧਿਆਨ ਧਰਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él me dio Su Mano y me protegió."