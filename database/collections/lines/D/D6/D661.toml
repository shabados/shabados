[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਹਾ ਕਾਨ੍ਰਹ ਬੈਠੋ ਹੁਤੋ; ਉਠਿ ਲਾਗੋ ਰਿਖਿ ਪਾਇ ॥੨੩੦੨॥"
page = 530

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He touched the feet of the sage.2302."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਕ੍ਰਿਸ਼ਨ ਬੈਠੇ ਹੋਏ ਸਨ। (ਉਹ) ਉਠ ਕੇ ਰਿਸ਼ੀ ਦੇ ਪੈਰੀਂ ਪਏ ॥੨੩੦੨॥"