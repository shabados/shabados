[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਤਿਨ ਬਲਿਹਾਰੈ ਜਾਇ ॥੬॥"
page = 1410
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then, unto them, Nanak, would be a sacrifice."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਨ੍ਹਾਂ ਉਤੋਂ ਨਾਨਕ ਕੁਰਬਾਨ ਥੀ ਵੰਞੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, I am a sacrifice to them. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਨਿਹਚਾ ਭੀ ਕਰ ਲੈਨ, ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੈਂ ਤਿਨੋਂ ਕੇ ਬਲਿਹਾਰੇ ਜਾਵਾਂ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਉਹਨਾਂ ਤੋਂ ਸਦਕੇ ਜਾਂਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਇ = ਜਾਂਦਾ ਹੈ। ਨਾਨਕ ਜਾਇ = ਨਾਨਕ ਜਾਂਦਾ ਹੈ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, ofrezco mi vida a ellos. (6)"