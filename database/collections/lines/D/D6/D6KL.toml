data = "ਉਸ ਪਰਮਾਤਮਾ ਦਾ ਨਾ ਕੋਈ ਪੁੱਤਰ ਹੈ, ਨਾ ਪਿਤਾ ਹੈ, ਨਾ ਮਾਤਾ, ਨਾ ਭਰਾ ਹੈ,"