[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਰ ਘੁੰਮਣਵਾਣੀ; ਭਾਈ ॥"
page = 989
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Domestic involvements are a whirlpool, O brother."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਘਰੇਲੂ ਝਮੇਲੇ ਇਕ ਘੁੰਮਣ ਘੇਰੀ ਹੈ, ਹੇ ਵੀਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Household affairs are whirlpools of entanglements, O Siblings of Destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਤੱਖ ਘਰੁ ਘੰਮੁਣਵਾਣੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਘਰਾਂ ਦੇ ਮੋਹ ਦਰਿਆ ਦੀਆਂ ਘੁੰਮਣ ਘੇਰੀਆਂ (ਵਾਂਗ) ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਰ = ਘਰਾਂ ਦੇ ਮੋਹ। ਘੁੰਮਣ ਵਾਣੀ = ਘੁੰਮਣ ਘੇਰ। ਭਾਈ = ਹੇ ਭਾਈ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El hogar y los asuntos mundanos son remolinos que nos atrapan, oh Hermanos del Destino."