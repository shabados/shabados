[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਜੀਐ ਕੀ ਸਾਰ; ਨ ਜਾਣੈ ॥"
page = 1070
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who knows not the mind's state;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨ ਦੀ ਅਵਸਥਾ ਨੂੰ ਨਹੀਂ ਜਾਣਦਾ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But one who does not know the state of the soul"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੀਆਂ ਕੀ ਸਾਰ ਕੋ ਨ ਜਾਣੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਮਨੁੱਖ (ਕਿਸੇ ਹੋਰ ਦੀ) ਜਿੰਦ ਦਾ ਦੁੱਖ-ਦਰਦ ਨਹੀਂ ਸਮਝ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਐ ਕੀ = ਜਿੰਦ ਦੀ। ਸਾਰ = ਕਦਰ, (ਦੁੱਖ-ਦਰਦ ਦੀ) ਸੂਝ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que no conoce su estado íntimo, no le digas ni una palabra, oh tonto."