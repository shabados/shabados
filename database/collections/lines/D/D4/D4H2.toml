[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਮਈਆ ਰੇਨੁ ਸਾਧ ਜਨ; ਪਾਵਉ ॥"
page = 177
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O All pervading Lord, may I obtain the dust of the feet of saintly persons."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਰਬ-ਵਿਆਪਕ ਸੁਆਮੀ! ਮੈਨੂੰ ਨੇਕ ਪੁਰਸ਼ਾਂ ਦੇ ਚਰਨਾ ਦੀ ਧੂੜ ਪ੍ਰਾਪਤ ਹੋਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord, I seek the dust of the feet of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਰਮਈਆ) ਬਿਆਪਕ ਰੂਪ ਪਰਮੇਸ੍ਵਰ ਮੇਂ ਜਿਨ ਕਾ ਨਿਹਚਾ ਹੈ, ਤਿਨ ਸਾਧੂ ਜਨੋਂ ਕੇ ਚਰਨੋਂ ਕੀ (ਰੇਨ) ਧੂੜੀ ਪਾਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੋਹਣੇ ਰਾਮ! (ਕਿਰਪਾ ਕਰ) ਮੈਂ ਗੁਰਮੁਖਾਂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ਪ੍ਰਾਪਤ ਕਰ ਲਵਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਮਈਆ = ਹੇ ਰਾਮ! ਰੇਨੁ = ਚਰਨ-ਧੂੜ। ਪਾਵਉਂ, ਮੈਂ ਪਾ ਲਵਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si pudiera ser bendecido con el Polvo de los Pies Santos del Guru,"