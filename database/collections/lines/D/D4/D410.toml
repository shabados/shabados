data = "ਬਨੰਬਾਸ ਜਾਨਯੋ ਦਯੋ ਰਾਵਣਾਰੰ ॥"
page = 275

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Finding herself in a desolate forest, Sita understood that Ram had exiled her"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਰਾਮ ਨੇ (ਮੈਨੂੰ) ਬਨਵਾਸ ਦਿੱਤਾ ਹੈ।"