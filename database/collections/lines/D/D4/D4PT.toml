[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜਸੁ ਸੁਨਹਿ ਨ ਹਰਿ ਗੁਨ ਗਾਵਹਿ ॥"
page = 332
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who neither hear God's praise nor sing God's excellence,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਂ ਵਾਹਿਗੁਰੂ ਦੀ ਕੀਰਤੀ ਸੁਣਦੇ ਹਨ ਅਤੇ ਨਾਂ ਹੀ ਵਾਹਿਗੁਰੂ ਦੀਆਂ ਵਡਿਆਈਆਂ ਗਾਉਂਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They do not listen to the Lord's Praises, and they do not sing the Lord's Glories,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨ ਹਰੀ ਕਾ ਜਸੁ ਸੁਨਤੇ ਹੈਂ ਨ ਹਰੀ ਕਾ ਜਸੁ ਗਾਵਤੇ ਹੈਂ॥ ਨਕਾਰ ਦੇਹਲੀ ਦੀਪ ਨਯਾਇ ਲਗਾਉਣਾ।"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਈ ਮਨੁੱਖ ਆਪ) ਨਾਹ ਕਦੇ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਸੁਣਦੇ ਹਨ, ਨਾਹ ਹਰੀ ਦੇ ਗੁਣ ਗਾਉਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਸੁ = ਵਡਿਆਈ, ਸਿਫ਼ਤਿ-ਸਾਲਾਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquéllos que no escuchan la Alabanza del Señor, ni tapoco la cantan"