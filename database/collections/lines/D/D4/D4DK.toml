[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈਸੇ ਮੰਦਰ ਮਹਿ; ਬਲਹਰ. ਨਾ ਠਾਹਰੈ ॥"
page = 872
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the house stays not, if the beams be removed from within it,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਘਰ ਨਹੀਂ ਠਹਿਰਦਾ, ਜੇਕਰ ਉਸ ਦੇ ਅੰਦਰੋਂ ਸ਼ਤੀਰ ਖਿੱਚ ਲਏ ਜਾਣ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As the house will not stand when the supporting beams are removed from within it,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਮੰਦਰ ਕੇ ਬੀਚ ਸੇ ਵਲਾ ਅਰਥਾਤ ਮਧਕਾ ਸਤੀਰੁ ਖੈਂਚ ਲਈਏ ਤੌ ਮੰਦਰੁ ਵਲੇ ਬਿਨਾ ਨਹੀਂ ਠਹਿਰਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਘਰ ਵਿਚ ਸ਼ਤੀਰ ਹੈ (ਸ਼ਤੀਰ ਤੋਂ ਬਿਨਾ ਘਰ ਦਾ ਛੱਤ) ਨਹੀਂ ਠਹਿਰ ਸਕਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਦਰ = ਘਰ। ਬਲਹਰ = ਵਲਾ, ਸ਼ਤੀਰ। ਠਾਹਰੈ = ਟਿਕਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si la casa no se sostiene sin pilares, entonces,"