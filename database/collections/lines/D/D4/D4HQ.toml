data = "ਮਾਰਿ ਕਿਵਰਿਯਾ ਬਿਰਛ ਕੀ; ਆਪਿ ਨਗਰ ਮੈ ਆਇ ॥"
page = 816

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Closing the door he used to go to the town during the day to beg,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਿਛ ਦੀ ਤਾਕੀ ਨੂੰ ਬੰਦ ਕਰ ਕੇ ਉਹ ਆਪ ਨਗਰ ਵਿਚ ਆ ਜਾਂਦਾ ਸੀ"