[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੈ ਬਚਨਿ; ਨ ਆਵੈ ਹਾਰਿ ॥"
page = 177
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru 's word, man suffers nor defeat."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਸ਼ਬਦ ਦੁਆਰਾ ਜੀਵ ਸ਼ਿਕਸਤ ਨਹੀਂ ਖਾਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Guru's Word, no one suffers defeat."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਬਚਨ ਮਾਨਨੇ ਸੇ ਹਾਰ ਨਹੀਂ ਆਵਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਉਪਦੇਸ਼ ਦੀ ਬਰਕਤਿ ਨਾਲ ਮਨੁੱਖ ਜੀਵਨ-ਬਾਜ਼ੀ ਹਾਰ ਕੇ ਨਹੀਂ ਆਉਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਾਰਿ = ਹਾਰ ਕੇ, (ਜੀਵਨ-ਬਾਜ਼ੀ) ਹਾਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a través del Shabd del Guru uno no sufre derrota."