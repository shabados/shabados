[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚਿ ਰਤੇ ਮੁਖ ਉਜਲੇ; ਤਿਤੁ ਸਾਚੈ ਦਰਬਾਰਿ ॥੪॥"
page = 34
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The faces of those who are imbued with Truth Become bright in that True Court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਸੱਚ ਨਾਲ ਰੰਗੇ ਹਨ, ਉਨ੍ਹਾਂ ਦੇ ਚਿਹਰੇ ਉਸ ਸੱਚੀ ਦਰਗਾਹ ਅੰਦਰ ਰੋਸ਼ਨ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who are attuned to Truth-their faces are radiant in the Court of the True Lord. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਰੀਤੀ ਸੇ ਜੋ ਪੁਰਸ ਸਚ ਸ੍ਵਰੂਪ ਮੇਂ (ਰਤੇ) ਮਸਤ ਹੂਏ ਹੈਂ, ਤਿਨ ਕੇ ਮੁਖੁ ਤਿਸ ਸਚੇ ਦਰਬਾਰ ਅਰਥਾਤ ਸਤਸੰਗ ਮੇਂ ਕਲੰਕ ਰਹਿਤ ਭਏ ਹੈਂ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਰੰਗ ਵਿਚ ਰੰਗੇ ਹੋਏ ਬੰਦੇ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਦਰਬਾਰ ਵਿਚ ਸੁਰਖ਼ਰੂ ਹੋ ਜਾਂਦੇ ਹਨ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚਿ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਪ੍ਰਭੂ ਵਿਚ। ਉਜਲੇ = ਨਿਰਮਲ। ਮੁਖ ਉਜਲੇ = ਉਜਲ ਮੁਖ ਵਾਲੇ, ਸੁਰਖ਼ਰੂ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los que se funden en la Verdad, su semblante resplandece en la Corte Verdadera.  (4)"