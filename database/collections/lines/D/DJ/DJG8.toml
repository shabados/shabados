[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਢਿ ਲੀਨ; ਸਾਗਰ ਸੰਸਾਰ ॥"
page = 331
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He has rescued me from the world ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਨੇ ਮੈਨੂੰ ਜਗਤ ਸਮੁੰਦਰ ਤੋਂ ਬਚਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has lifted me up, out of the world-ocean."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰ ਸਮੁੰਦ੍ਰ ਸੇ ਕਾਢ ਲੀਆ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਉਸ ਨੇ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਵਿਚੋਂ ਕੱਢ ਲਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਗਰ = ਸਮੁੰਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "me ha rescatado del mar traicionero de la existencia."