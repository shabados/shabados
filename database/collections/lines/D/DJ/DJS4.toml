[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਾਬ ਸਰਾਸਨ ਲੈ ਕਰ ਮੈ; ਬਹੁ ਬੀਰ ਹਨੇ ਤਿਹ ਠਉਰ ਕਰਾਰੇ ॥"
page = 529

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Samb, taking his bow in his hand, killed many warriors"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਂਬ ਨੇ ਹੱਥ ਵਿਚ ਧਨੁਸ਼ ਲੈ ਕੇ ਉਸ ਥਾਂ ਤੇ ਬਹੁਤ ਤਕੜੇ ਸੂਰਮੇ ਮਾਰ ਦਿੱਤੇ।"