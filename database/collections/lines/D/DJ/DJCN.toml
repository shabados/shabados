type = "primary"
data = "ਤੁਹੀ ਬ੍ਰਾਹਮੀ ਬੈਸਨਵੀ ਸ੍ਰੀ ਭਵਾਨੀ ॥"
page = 336

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art the power the of Brahmani, Vaishnavi,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਬ੍ਰਹਮਾ ਦੀ ਸ਼ਕਤੀ, ਵਿਸ਼ਣੂ ਦੀ ਸ਼ਕਤੀ ਅਤੇ ਸ਼ਿਵ ਦੀ ਸ਼ਕਤੀ ਹੈਂ।"