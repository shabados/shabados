[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਕੜਿ ਚਲਾਇਨਿ ਦੂਤ ਜਮ; ਕਿਸੈ. ਨ ਦੇਨੀ ਭੇਤੁ ॥"
page = 134
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The couriers of death seize and dispatch the soul and acquaint none with the secret."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੌਤ ਦੇ ਫ਼ਰਿਸ਼ਤੇ ਰੂਹ ਨੂੰ ਫੜ ਕੇ ਟੋਰ ਦਿੰਦੇ ਹਨ ਅਤੇ ਮਰਮ ਕਿਸੇ ਨੂੰ ਭੀ ਨਹੀਂ ਦਸਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Messenger of Death seizes and holds her, and does not tell anyone his secret."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੰਦ ਕਰਮੀਓਂ ਕੋ ਜਮਦੂਤ ਪਕੜ ਕਰ ਜਮ ਪੁਰੀ ਕੋ ਤੋਰੈਂਗੇ ਕਿਸੀ ਕੋ ਭੇਦ ਨਹੀਂ ਦੇਵੇਂਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਮਦੂਤ (ਜਿੰਦ ਨੂੰ) ਫੜ ਕੇ ਅੱਗੇ ਲਾ ਲੈਂਦੇ ਹਨ, ਕਿਸੇ ਨੂੰ (ਇਹ) ਭੇਤ ਨਹੀਂ ਦੱਸਦੇ (ਕਿ ਕਿੱਥੇ ਲੈ ਚੱਲੇ ਹਾਂ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਕੜਿ = ਫੜ ਕੇ। ਨ ਦੇਨੀ = ਨਹੀਂ ਦੇਂਦੇ, ਨ ਦੇਨਿ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Quién puede aliviar al Alma, atrapada en las garras de la muerte?"