[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਹੁ ਨਿਧਾਨਾ; ਸਾਧੂ ਪਾਹਿ ॥"
page = 888
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This treasure is obtained from the Lord's saint."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਖਜਾਨਾ ਕਿਸੇ ਹਰੀ ਭਗਤ ਪਾਸੋਂ ਪ੍ਰਾਪਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This treasure is obtained from the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਨਾਮ ਅੰਮ੍ਰਿਤ ਕਾ ਖਜਾਨਾ ਸਾਧੂਓਂ ਕੇ ਪਾਸ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਖ਼ਜ਼ਾਨਾ ਗੁਰੂ ਦੇ ਪਾਸ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਧਾਨਾ = ਖ਼ਜ਼ਾਨਾ। ਸਾਧੂ = ਗੁਰੂ। ਪਾਸਿ = ਪਾਸ, ਕੋਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y este Tesoro uno lo recibe del Santo Guru,"