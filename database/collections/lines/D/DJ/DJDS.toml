[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਤੁ ਸਤੁ ਸੰਜਮੁ; ਸਚੁ ਸੁਚੀਤੁ ॥"
page = 903
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who practises celibacy, chastity, sobriety and righteousness,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਿਮਚਰਜ, ਪਾਕੀਜ਼ਗੀ, ਧੀਰਜ ਅਤੇ ਸੱਚਾਈ ਦੀ ਕਮਾਈ ਕਰਨ ਵਾਲੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who practices celibacy, chastity, self-control, truth and pure consciousness"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਤੁ ਅਰੁ ਸਤੁ ਔ (ਸੰਜਮੁ) ਇੰਦ੍ਰੀਓਂ ਕਾ ਜੋ ਰੋਕਨਾ ਹੈ ਇਨ ਗੁਨੋਂ ਕੋ ਧਾਰ ਕੇ ਜਿਸ ਨੇ (ਸਚੁ) ਬ੍ਰਹਮ ਕੋ ਚਿੰਤਨ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸੇ ਜੋਗੀ ਦੇ ਅੰਦਰ ਜਤ ਹੈ ਸਤ ਹੈ ਸੰਜਮ ਹੈ ਉਸੇ ਦਾ ਹਿਰਦਾ ਪਵਿਤ੍ਰ ਹੈ ਜਿਸ ਦੇ ਅੰਦਰ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਵੱਸਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੁ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ। ਸੁਚੀਤੁ = ਪਵਿਤ੍ਰ ਹਿਰਦੇ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Castidad, la Verdad, el Autocontrol y la Mente Pura"