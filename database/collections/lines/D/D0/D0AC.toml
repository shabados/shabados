data = "ਸਹਜ ਕਲਾ ਤਿਹ ਸੁਤਾ ਬਖਨਿਯਤ ॥"
page = 816

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The trader was known as Kasikar and name of his daughter was Sehaj Kala."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਦੀ ਪੁੱਤਰੀ ਦਾ ਨਾਂ ਸਹਿਜ ਕਲਾ ਸੀ।"