[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਕੇ ਗੁਨ ਗਾਉ ॥"
page = 895
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sing thou the praise of the Pervading God, O man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਵਿਆਪਕ ਵਾਹਿਗੁਰੂ ਦਾ ਜੱਸ ਗਾਇਨ ਕਰ, ਹੇ ਬੰਦੇ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sing the Glorious Praises of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਿਆਰਿਆ! ਤੂੰ ਰਾਮ ਕੇ ਗੁਨ ਗਾਉ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਇਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਾਉ = ਗਾਂਦਾ ਰਹੁ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canta la Alabanza del Señor"