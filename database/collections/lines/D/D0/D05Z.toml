[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨੇ ਦਾਸ ਕਉ; ਦੇ ਰਾਖੈ ਹਾਥ ॥"
page = 1151
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lending His hand, the Lord saves His serf."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਹੱਥ ਦੇ ਕੇ, ਸਾਈਂ ਆਪਣੇ ਨਫਰਾ ਦੀ ਰੱਖਿਆ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He reaches out with His Hand and saves His slave."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਅਪਨੇ ਦਾਸੋਂ ਕੇ ਹਾਥ ਦੇ ਕਰ ਰਾਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਆਪਣੇ ਸੇਵਕ ਨੂੰ ਹੱਥ ਦੇ ਕੇ ਬਚਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇ = ਦੇ ਕੇ। ਰਾਖੈ = ਰੱਖਿਆ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien me bendice y me da sustento para siempre."