[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧਸੰਗਿ; ਭਏ ਆਗਿਆਕਾਰੀ ॥"
page = 272
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the saints congregation man becomes obedient to the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਅੰਦਰ ਆਦਮੀ ਸੁਆਮੀ ਦਾ ਹੁਕਮ ਮੰਨਣ ਵਾਲਾ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Company of the Holy, we become obedient to the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੇ ਸੰਗ ਕਰ ਹਮ ਹਰੀ ਕੇ ਆਗਿਆਕਾਰੀ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਦੀ ਸੰਗਤਿ ਕੀਤਿਆਂ (ਅਸੀ) ਪ੍ਰਭੂ ਦਾ ਹੁਕਮ ਮੰਨਣ ਵਾਲੇ ਹੋ ਜਾਂਦੇ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਗਿਆਕਾਰੀ = ਪ੍ਰਭੂ ਦਾ ਹੁਕਮ ਮੰਨਣ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En la Compañía de los Santos, nos volvemos obedientes al Señor."