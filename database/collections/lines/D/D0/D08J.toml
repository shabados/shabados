[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਣ ਕਾਰਣ ਪ੍ਰਭੁ ਸੋਈ ॥ ਰਹਾਉ ॥"
page = 626
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the Lord is the cause of causes. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਹਿਬ ਹੇਤੂਆਂ ਦਾ ਹੇਤੂ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is God, the Cause of causes. ||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਕਾਰਣੋਂ ਕੇ ਕਰਨੇਹਾਰਾ ਸੋਈ ਵਾਹਿਗੁਰੂ ਹੈ॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਪਰਮਾਤਮਾ ਜਗਤ ਦਾ ਮੂਲ ਹੈ ਰਹਾਉ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਣ = ਜਗਤ। ਕਾਰਣ = ਮੂਲ। ਸੋਈ = ਉਹੀ ॥ਰਹਾਉ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Señor Mismo es el Creador y la Causa. (Pausa)"