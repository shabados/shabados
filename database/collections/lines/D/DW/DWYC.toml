[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਨਾਵੈ; ਦੁਖੀਆ ਚਲਿਆ ਰੋਇ ॥੨॥"
page = 158
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sans Lord's Name, the miserable man departs bewailing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਨਾਮ ਦੇ ਬਗੈਰ ਬਦਬਖਤ ਬੰਦਾ ਵਿਰਲਾਪ ਕਰਦਾ ਹੋਇਆ ਟੁਰ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Name, the miserable ones depart crying out in pain. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਨਾਮ ਕੇ ਬਿਨਾ ਦੁਖੀਆ ਹੋ ਕਰ ਜੀਵ ਰੁਦਨ ਕਰਤਾ ਹੂਆ ਚਲਾ ਜਾਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਤੋਂ ਵਾਂਜਿਆ ਰਹਿ ਕੇ ਮਨੁੱਖ ਦੁਖੀ ਜੀਵਨ ਬਿਤੀਤ ਕਰਦਾ ਹੈ, ਦੁਖੀ ਹੋ ਕੇ ਹੀ ਇਥੋਂ ਆਖ਼ਰ ਚਲਾ ਜਾਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੋਇ = ਰੋ ਕੇ, ਦੁਖੀ ਹੋ ਕੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sin el Nombre del Señor el mundo vaga en pena. (2)"