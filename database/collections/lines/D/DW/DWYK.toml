[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਠੋਕਿ ਭੁਜਾ ਅਪਨੀ ਦੋਊ ਆਪ ਹੀ; ਹਾਥ ਲੈ ਆਪਨੈ ਨਾਦ ਬਜਾਯੋ ॥"
page = 522

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The manner in which the demon Andhaksura was attacked in rage,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਆਪਣੀਆਂ ਦੋਹਾਂ ਭੁਜਾਵਾਂ ਨੂੰ ਆਪਣੇ ਹੀ ਹੱਥਾਂ ਨਾਲ ਠੋਕ ਕੇ ਆਪ ਹੀ ਨਾਦ ਵਜਾਇਆ।"