[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇਜ ਸੁਹਾਵੀ ਸਰਬ ਸੁਖ; ਹੁਣਿ ਦੁਖਾ ਨਾਹੀ ਜਾਇ ॥"
page = 136
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My couch is beautiful, I possess all the comforts and now there is no room for aches."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਪਲੰਘ ਸ਼ੋਭਨੀਕ ਹੈ, ਮੈਨੂੰ ਸਾਰੇ ਆਰਾਮ ਹਨ ਅਤੇ ਦੁੱਖ ਤਕਲੀਫਾਂ ਲਈ ਹੁਣ ਕੋਈ ਜਗ੍ਹਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My bed is beautiful, and I have all comforts. I feel no sadness at all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਸੁਖ ਅਰਥਾਤ ਆਤਮ ਸੁਖ ਹੋਣੇ ਕਰ ਅੰਤਹਕਰਣ ਰੂਪੀ ਸੇਹਜਾ ਸੋਭਤੀ ਭਈ ਹੈ, (ਹੁਣਿ) ਅਭ ਦੁਖੋਂ ਕੋ ਜਗਾ ਨਹੀਂ ਰਹੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਦੀ ਹਿਰਦਾ-ਸੇਜ ਸੁੰਦਰ ਬਣ ਜਾਂਦੀ ਹੈ, ਉਹਨਾਂ ਨੂੰ ਸਾਰੇ ਹੀ ਸੁੱਖ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦੇ ਹਨ, ਫਿਰ ਦੁੱਖਾਂ ਲਈ (ਉਹਨਾਂ ਦੇ ਹਿਰਦੇ ਵਿਚ) ਕਿਤੇ ਰਤਾ ਥਾਂ ਨਹੀਂ ਰਹਿ ਜਾਂਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਜ = ਹਿਰਦਾ। ਜਾਇ = ਥਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Alma descansa y disfruta de todas las comodidades y todo dolor ha desaparecido."