data = "ਚੋਰਹਿ ਠੌਰ ਮਾਰ ਹੀ ਡਾਰਿਯੋ ॥੧੨॥"
page = 882

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘And considering my love for the woman, I slew him.’(12)"

