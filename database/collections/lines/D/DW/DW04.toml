[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਨ ਪੰਚਨ; ਮੇਰੋ ਮਨੁ ਜੁ ਬਿਗਾਰਿਓ ॥"
page = 710
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "These five vices have corrupted my mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਏਨਾ ਪੰਜਾਂ ਵਿਕਾਰਾਂ ਨੇ ਮੇਰਾ ਚਿੱਤ ਪਲੀਤ ਕਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The five vices have corrupted my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਨ ਪੰਚੋਂ ਕਾਮ ਆਦਿਕੋਂ ਨੇ ਮੇਰਾ ਮਨ ਜੋ ਬਿਗਾੜਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਾਮਾਦਿਕ) ਇਹਨਾਂ ਪੰਜਾਂ ਨੇ ਹੀ ਮੇਰਾ ਮਨ ਇਤਨਾ ਵਿਗਾੜ ਦਿੱਤਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੰਚਨ = ਕਾਮਾਦਿਕ ਪੰਜ ਵਿਕਾਰਾਂ ਨੇ। ਜੁ = ਇਤਨ-ਕੁ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los cinco enemigos han desviado mi mente"