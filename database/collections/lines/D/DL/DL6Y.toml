[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕਉ ਕੀਜੈ ਸਦ ਨਮਸਕਾਰਾ ॥"
page = 268
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "unto Him ever make an obeisance."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਸਦੀਵ ਹੀ ਪ੍ਰਣਾਮ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Unto Him, bow forever in adoration."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੌ ਸਦਾ ਨਮਸਕਾਰ ਹੀ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਅੱਗੇ ਸਦਾ ਸਿਰ ਨਿਵਾਉਣਾ ਹੀ ਚਾਹੀਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਦ = ਸਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que alberga al Dulce Señor"