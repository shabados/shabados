[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਪੜ ਭੋਗ ਰਸ; ਅਨਿਕ ਭੁੰਚਾਏ ॥"
page = 1337
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who makes thee enjoy various dresses, dainties and relishes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੈਨੂੰ ਅਨੇਕਾਂ ਪੁਸ਼ਾਕਾ, ਨਿਆਮਤਾ ਅਤੇ ਸੁਆਦਾ ਦੇ ਅਨੰਦ ਭੁਗਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He makes all the various pleasures, clothes and foods for you to enjoy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਵਾਹਿਗੁਰੂ ਨੇ ਕਪੜੇ ਆਦੀ ਅਨੇਕ ਭੋਗੋਂ ਕੇ ਰਸ ਤੁਝ ਕੋ (ਭੁੰਚਾਇ) ਭੁਗਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰਮਾਤਮਾ ਨੇ ਤੈਨੂੰ ਅਨੇਕਾਂ (ਕਿਸਮਾਂ ਦੇ) ਕੱਪੜੇ ਵਰਤਣ ਨੂੰ ਦਿੱਤੇ, ਜਿਸ ਨੇ ਤੈਨੂੰ ਅਨੇਕਾਂ ਚੰਗੇ ਚੰਗੇ ਪਦਾਰਥ ਖਾਣ-ਪੀਣ ਨੂੰ ਦਿੱਤੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਪੜ = ਕੱਪੜੇ। ਭੁੰਚਾਏ = ਖਾਣ ਲਈ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él creó los placeres, la comida y ropa para que disfrutes,"