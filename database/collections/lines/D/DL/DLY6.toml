[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬ ਬੇਰੂੰ ਜ਼ਿ ਮੁਲਕਸ਼ ਹਮਹ ਰੂਹ ਰੇਸ਼ ॥੧੧੩॥"
page = 1421

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And the opponents were left behind humiliated.(113)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਲੋਕ ਮੁਲਕ ਤੋਂ ਬਾਹਰ ਸਨ, ਉਨ੍ਹਾਂ ਦੇ ਮੂੰਹ ਛਿਲ ਦਿੱਤੇ (ਅਰਥਾਤ-ਮੁੰਨ ਦਿੱਤੇ) ॥੧੧੩॥"