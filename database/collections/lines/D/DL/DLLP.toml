[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੈ ਏਕੈ ਏਕ ਤੂਹੀ ॥"
page = 884
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou alone art my one Unique Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤੂੰ ਹੀ ਮੇਰਾ ਇਕੋ ਇਕ ਅਦੁੱਤੀ ਸੁਆਮੀ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You alone are the One and only Lord;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੀਨੋਂ ਕਾਲੋਂ ਮੇਂ ਏਕ ਤੂੰ ਹੀ ਬਿਆਪਕ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅਸਾਂ ਜੀਵਾਂ ਦਾ) ਇਕ ਤੂੰ ਹੀ (ਖਸਮ) ਹੈਂ, ਤੂੰ ਹੀ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਏਕੈ = ਇੱਕ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres el Uno, mi Único Dios,"