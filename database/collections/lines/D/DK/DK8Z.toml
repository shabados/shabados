[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਤਾ ਮਤਾਇਆ ਮਖੀਆਂ; ਘਿਅ ਅੰਦਰਿ ਨਾਈਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The flies thought of taking bath in ghee (but all got killed)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੱਖੀਆਂ ਨੇ ਸਲਾਹ ਕੀਤੀ ਕਿ ਘਿਉ ਵਿਚ ਇਸ਼ਨਾਨ ਕਰੀਏ (ਇਹ ਬੀ ਅਸੰਭਵ ਹੈ)।"