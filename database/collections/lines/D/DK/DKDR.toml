language = "pa"
data = "ਤੇਰਾ ਕਮਾਲ ਕਮਾਲਾਂ ਦਾ ਕਮਾਲ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਐ ਕਮਾਲਿ ਤੋ ਕਮਾਲਸਤੋ ਕਮਾਲਸਤੋ ਕਮਾਲ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Will have his deserted house, with the achievement of the Truth, rehabilitated and revived again. (204)"