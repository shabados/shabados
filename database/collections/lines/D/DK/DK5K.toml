[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਬਹੂ; ਅਪਕੀਰਤਿ ਮਹਿ ਆਵੈ ॥"
page = 277
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sometimes he falls into evil repute."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਦੇ ਉਹ ਬਦਨਾਮੀ ਅੰਦਰ ਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sometimes, they come to have evil reputations."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਬੀ ਇਹ ਅਪਕੀਰਤੀ ਮੇਂ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਦੇ ਆਪਣੀ ਬਦਨਾਮੀ ਕਰਾ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਪਕੀਰਤਿ = ਅਪ-ਕੀਰਤਿ, ਮੰਦੀ ਸੋਭਾ, ਬਦਨਾਮੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En un tiempo puede ser calumniado"