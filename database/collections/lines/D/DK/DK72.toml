[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਚੁ ਨਾਉ ਕਰਤਾਰ, ਸਚਿ ਸਮਾਇਆ ॥੧॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The name of that creator is Truth and He is ever immersed in Truth."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਜਿਸ) ਕਰਤਾਰ ਦਾ ਨਾਮ ਸੱਚਾ ਹੈ (ਉਹੋ 'ਸਚ') ਪਰਮਾਤਮਾ (ਪਸਾਰੇ ਵਿਖੇ) ਵਿਆਪਕ ਹੈ।"