[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਉ; ਮਇਆ ਭਈ ਕਰਤਾਰ ॥੧॥"
page = 888
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he on whom is the grace of the creator."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ, ਜਿਸ ਉਤੇ ਸਿਰਜਣਹਾਰ ਦੀ ਮਿਹਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "he is blessed with the Grace of the Creator Lord. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਕੋ ਕਰਤਾਰ ਕੀ ਕਿਰਪਾ ਹੋਈ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਉੱਤੇ ਕਰਤਾਰ ਦੀ ਮੇਹਰ ਹੁੰਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਇਆ ਕਰਤਾਰ = ਕਰਤਾਰ ਦੀ ਦਇਆ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "para aquél que tiene la Misericordia del Señor Creador. (1)"