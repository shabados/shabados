[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕੁ ਕਹੈ. ਸੁਣਹੁ ਜਨਹੁ; ਇਤੁ ਸੰਜਮਿ. ਦੁਖ ਜਾਹਿ ॥੨॥"
page = 466
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, hear, O ye people in this way the trouble departs."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਤੁਸੀਂ ਸ੍ਰਵਣ ਕਰੋ, ਹੇ ਲੋਕੋ! ਇਸ ਜੁਗਤੀ ਦੁਆਰਾ ਇਹ ਰੋਗ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak says, listen, people: in this way, troubles depart. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਅੰਗਦ ਦੇਵ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਸਿਖੋ ਸੁਣੋ! (ਇਤੁ ਸੰਜਮਿ) ਇਸ ਬਿਧ ਕਰ ਹਉਮੈ ਕੇ ਦੁਖ ਨਾਸ ਹੋ ਜਾਤੇ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ, ਹੇ ਲੋਕੋ! ਇਸ ਤਰੀਕੇ ਨਾਲ (ਹਉਮੈ ਰੂਪੀ ਦੀਰਘ ਰੋਗ ਤੋਂ ਪੈਦਾ ਹੋਏ ਹੋਏ) ਦੁੱਖ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕੁ ਕਹੈ = ਆਖਦਾ ਹੈ। ਇਤੁ ਸੰਜਮਿ = ਇਸ ਜੁਗਤੀ ਨਾਲ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, ¡Escuchen hombres, así el mal es curado! (2)"