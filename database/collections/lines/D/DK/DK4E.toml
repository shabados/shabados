[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਬ ਢੂਢਨ. ਕਤਹੁ ਨ ਜਾਈ ॥"
page = 621
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Now I go not anywhere for search because,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਮੈਂ ਕਿਧਰੇ ਲੱਭਣ ਲਈ ਨਹੀਂ ਜਾਂਦਾ ਕਿਉਂਕਿ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Now, I do not go searching anywhere else,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਹਮਾਰਾ ਮਨ ਢੂੰਢਨੇ ਕੋ ਕਹੀਂ ਨਹੀਂ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੁਣ (ਕਾਮਾਦਿਕ ਵੈਰੀਆਂ ਤੋਂ ਪੈ ਰਹੇ ਸਹਿਮ ਤੋਂ ਬਚਣ ਲਈ) ਕਿਸੇ ਹੋਰ ਥਾਂ (ਆਸਰਾ) ਭਾਲਣ ਦੀ ਲੋੜ ਨਾਹ ਰਹਿ ਗਈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਤਹੁ = ਕਿਤੇ ਭੀ। ਭੇਟੇ = ਮਿਲ ਪਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora no busco a nadie más afuera;"