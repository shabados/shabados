[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਤਿਸੁ ਭਾਵੈ; ਸੋਈ ਹੋਗੁ ॥"
page = 276
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever pleases Him that comes to pass."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਛ ਉਸ ਨੂੰ ਚੰਗਾ ਲਗਦਾ ਹੈ, ਉਹੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That which pleases Him, comes to pass."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤਿਸ ਹਰੀ ਕੌ ਭਾਵਤਾ ਹੈ, ਸੋ ਤੀਨੋਂ ਕਾਲ ਮੇਂ ਹੋਤਾ ਹੈ ਔ ਹੋਵੈਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਓਹੀ ਕੁਝ ਹੁੰਦਾ ਹੈ ਜੋ ਉਸ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੋਗੁ = ਹੋਵੇਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y de Él proceden también la Voluntad y la Capacidad de crear."