[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭੁ ਪੂਰਾ; ਅਨਾਥ ਕਾ ਨਾਥੁ ॥"
page = 1340
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Perfect Lord is the Master of the Masterless."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਪ੍ਰਭੂ ਨਿਖਸਮਿਆਂ ਦਾ ਖਸਮ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is Perfect, the Master of the masterless."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਪੂਰਨ ਪ੍ਰਭੂ ਸੁਆਮੀ ਅਨਾਥੋਂ ਕਾ ਨਾਥ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ (ਸਾਰੇ ਗੁਣਾਂ ਨਾਲ) ਪੂਰਨ ਹੈ, ਅਤੇ ਨਿਖਸਮਿਆਂ ਦਾ ਖਸਮ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਾਥ = ਨਿਖਸਮੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Maestro de quien no lo tiene,"