[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਣ ਕਾਰਣ ਸਮਰਥੁ, ਗੁਰੁ ਮੇਰਾ ॥"
page = 1149
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My Guru is Omnipotent to do all deeds,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਗੁਰੂ ਸਾਰੇ ਕੰਮ ਕਰਨ ਨੂੰ ਸਰਬ-ਸ਼ਕਤੀਵਾਨ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My Guru is the All-powerful Lord, the Creator, the Cause of causes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਗੁਰੂ ਕਰਣ ਕਾਰਣ ਸਮਰਥ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਗੁਰੂ-ਪਰਮੇਸਰ ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ ਦਾ ਮੂਲ ਹੈ, ਸਭ ਤਾਕਤਾਂ ਦਾ ਮਾਲਕ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਣ = ਜਗਤ, ਸ੍ਰਿਸ਼ਟੀ। ਕਾਰਣ = ਮੂਲ। ਸਮਰਥੁ = ਸਭ ਕੁਝ ਕਰ ਸਕਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Guru es Omnipotente, Creador y Causa,"