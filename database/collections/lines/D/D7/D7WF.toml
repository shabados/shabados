[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨੁ ਨਾਨਕੁ. ਨਾਮੁ ਧਿਆਏ; ਗੁਰਮੁਖਿ ਗੁਣ ਗਾਇਦਾ ॥੫॥"
page = 644
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru, slave Nanak meditates on the Name and sings God's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਗੋਲਾ ਨਾਨਕ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਦਾ ਹੈ ਅਤੇ ਵਾਹਿਗੁਰੂ ਦਾ ਜੱਸ ਗਾਉਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Servant Nanak meditates on the Naam, the Name of the Lord; as Gurmukh, he sings the Glorious Praises of the Lord. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੈਂ ਜਨ ਤਿਸ ਕੇ ਨਾਮ ਕੋ ਧਿਆਇ ਕਰ ਕੇ ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਤਿਸ ਵਾਹਿਗੁਰੂ ਕੇ ਗੁਣੋਂ ਕੋ ਗਾਵਤਾ ਹੂੰ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦਾਸ ਨਾਨਕ ਭੀ (ਉਸ ਦੀ ਭਗਤੀ ਦੀ ਖ਼ਾਤਰ) ਨਾਮ ਸਿਮਰਦਾ ਹੈ ਤੇ ਸਤਿਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੋ ਕੇ (ਉਸ ਦੀ) ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦਾ ਹੈ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak habita sólo en el Nombre del Señor, y a través de la Palabra del Shabd del Guru, canta Su Alabanza. (5)"