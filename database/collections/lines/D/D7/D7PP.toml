[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੀ ਕਾਰ ਕਮਾਇ; ਲਾਹਾ ਘਰਿ ਆਣਿਆ ॥"
page = 752
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Performing the service of the Guru, O man, thou shalt bring profit home."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਘਾਲ ਕਮਾ, ਹੇ ਬੰਦੇ! ਤੂੰ ਨਫਾ ਖੱਟ ਆਪਣੇ ਘਰ ਨੂੰ ਲੈ ਜਾਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Performing service to the Guru, you shall go home with the profit."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਗੁਰੋਂ ਕੀ ਕਾਰ ਕਮਾਇਕੇ, ਭਾਵ ਗੁਰੋਂ ਕੀ ਸੇਵਾ ਕਰ ਕੇ ਨਾਮ ਕਾ ਲਾਭ (ਘਰਿ) ਮਨ ਵਿਚ (ਆਣਿਆ) ਲਿਆਂਦਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਗੁਰੂ ਦੀ ਦੱਸੀ ਕਾਰ (ਭਗਤੀ) ਕਰ ਕੇ (ਭਗਤੀ ਦਾ) ਲਾਭ ਆਪਣੇ ਹਿਰਦੇ-ਘਰ ਵਿਚ ਲੈ ਆਂਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਾਹਾ = ਲਾਭ। ਆਣਿਆ = ਲਿਆਂਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Apegado a la tarea del Guru, uno trae los Frutos al hogar."