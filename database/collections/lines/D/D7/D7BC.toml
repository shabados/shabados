[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੋ ਗਿਆਨੁ; ਬਿਰਲੋ ਈ ਪਾਏ ॥"
page = 803
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some rare one is blessed with such an understanding,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹੋ ਜਿਹੀ ਸਮਝ ਕਿਸੇ ਵਿਰਲੇ ਪੁਰਸ਼ ਨੂੰ ਹੀ ਪਰਾਪਤ ਹੁੰਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How rare is that one who is blessed with such spiritual wisdom."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸਾ ਗਿਆਨ ਕੋਈ ਵਿਰਲਾ ਹੀ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਇਹ ਸੂਝ ਕੋਈ ਵਿਰਲਾ ਮਨੁੱਖ ਹੀ ਹਾਸਲ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਿਆਨੁ = ਸੂਝ। ਈ = ਹੀ। ਬਿਰਲੋ ਈ = ਕੋਈ ਵਿਰਲਾ ਮਨੁੱਖ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Extraordinario es el hombre que es bendecido con tal Sabiduría,"