[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰਚੰਡ ਜੋਤਿ ਕੋ ਹਸੈ ॥੧੮੩॥"
page = 569

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing his powerful form, the sun is feeling shy and his effulgence is mocking the powerful light.183."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਕੋਈ ਪ੍ਰਚੰਡ ਜੋਤਿ ਹਸ ਰਹੀ ਹੋਵੇ (ਅਰਥਾਤ ਪ੍ਰਕਾਸ਼ਮਾਨ ਹੋਵੇ) ॥੧੮੩॥"