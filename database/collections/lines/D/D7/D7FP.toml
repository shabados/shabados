[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਾਵਾ. ਵਾਹੀ ਜਾਨੀਐ; ਵਾ ਜਾਨੇ ਇਹੁ ਹੋਇ ॥"
page = 342
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "W - Know Him, by knowing Him, this man becomes as He is."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵ - ਉਸ ਨੂੰ ਅਨੁਭਵ ਕਰ। ਉਸ ਨੂੰ ਅਨੁਭਵ ਕਰਨ ਦੁਆਰਾ, ਇਹ ਇਨਸਾਨ ਉਸ ਵਰਗਾ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "WAWA: Know Him. By knowing Him, this mortal becomes Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਵੇ ਅਖਰ ਦੁਆਰਾ ਕਹਤੇ ਹੈਂ: (ਵਾਹੀ) ਉਸ ਬਿਸਨ ਕੋ ਜਾਨੀਏ, ਕਿਉਂਕਿ ਉਸ ਬਿਸਨੂ ਕੇ ਜਾਨਣੇ ਸੇ ਇਹ ਜੀਵ ਬਿਸਨ ਰੂਪ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਉਸ ਪ੍ਰਭੂ ਨਾਲ ਹੀ ਜਾਣ-ਪਛਾਣ ਕਰਨੀ ਚਾਹੀਦੀ ਹੈ। ਉਸ ਪ੍ਰਭੂ ਨਾਲ ਸਾਂਝ ਪਾਇਆਂ ਇਹ ਜੀਵ (ਉਸ ਪ੍ਰਭੂ ਦਾ ਰੂਪ ਹੀ) ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਾ ਹੀ = ਉਸ (ਪ੍ਰਭੂ) ਨੂੰ ਹੀ। ਜਾਨੀਐ = ਸਮਝੀਏ, ਜਾਣ-ਪਛਾਣ ਪਾਈਏ, ਸਾਂਝ ਪਾਣੀ ਚਾਹੀਦੀ ਹੈ। ਵਾ = ਉਸ (ਪ੍ਰਭੂ) ਨੂੰ। ਜਾਨੇ = ਜਾਣਿਆਂ, ਸਾਂਝ ਪਾਇਆਂ। ਇਹੁ = ਇਹ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Va va Conoce a tu Dios, porque conociéndolo, uno se vuelve Uno con Él."