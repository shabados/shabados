[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਰਿਦੈ; ਵਸੈ ਭਗਵਾਨੁ ॥੩॥"
page = 195
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "within whose mind the Auspicious Master abides."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਚਿੱਤ ਅੰਦਰ ਮੁਬਾਰਕ ਮਾਲਕ ਨਿਵਾਸ ਰਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "within whose hearts the Lord God abides. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੇ ਰਿਦੇ ਮੇਂ ਭਗਵਾਨ ਕਾ ਵਾਸਾ ਹੂਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਭਗਵਾਨ ਆ ਵੱਸਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੈ ਰਿਦੈ = ਜਿਸ ਦੇ ਹਿਰਦੇ ਵਿਚ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "su corazón el Señor Dios habita.(3)"