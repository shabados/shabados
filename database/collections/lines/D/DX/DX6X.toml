[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਹਿਰਦੈ; ਵਸਿਆ ਹਰਿ ਸੋਈ ॥"
page = 154
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within whose mind that God abides,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਅੰਤਰ ਆਤਮੇ ਉਹ ਵਾਹਿਗੁਰੂ ਨਿਵਾਸ ਰਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those, within whose hearts the Lord dwells,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਹਿਰਦੇ ਮੇਂ ਸੋ ਪਰਮਾਤਮਾਂ ਵਸਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪਰਮਾਤਮਾ ਆ ਵੱਸਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que enaltece al Señor en su corazón,"