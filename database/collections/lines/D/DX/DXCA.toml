[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਣੁ. ਨ ਪਾਈਐ; ਪ੍ਰਭ ਦਰਬਾਰਾ ॥੪॥"
page = 759
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "So the mortal can go not in the Lord's Court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਲਈ ਪ੍ਰਾਣੀ ਸੁਆਮੀ ਦੇ ਦਰਬਾਰ ਵਿੱਚ ਜਾ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "he cannot go to God's Court. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀਤੇ (ਪ੍ਰਭ ਦਰਬਾਰਾ) ਸਭਾ ਸਾਧ ਸੰਗਤ ਮੇਂ ਜਾਣਾ ਨਹੀਂ ਪਾਵਤਾ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਸ ਵਾਸਤੇ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੇ ਦਰਬਾਰ ਵਿਚ ਪਹੁੰਚ ਨਹੀਂ ਸਕਦਾ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਣੁ ਨ ਪਾਈਐ = ਪਹੁੰਚ ਨਹੀਂ ਸਕੀਦਾ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ellas te sacaron de la Corte de tu Dios.(4)"