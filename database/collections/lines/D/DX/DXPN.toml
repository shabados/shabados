data = "ਅਵਿਲੋਕ ਦੁਆਰਿ ਬਿਸੇਖ ॥੧੧॥"
page = 612

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many Krishna and Rama incarnation sweep His Door many Fish and Tortoise incarnations are seen standing at His special gate.11."

