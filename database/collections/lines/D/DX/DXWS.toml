[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ ਵਡ ਭਾਗ ਹੋਵਹਿ; ਵਡ ਊਚੇ ॥"
page = 367
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "if man's destiny be sublime and very high,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਆਦਮੀ ਦੀ ਕਿਸਮਤ ਸ਼੍ਰੇਸ਼ਟ ਅਤੇ ਖਰੀ ਬੁਲੰਦ ਹੋਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If one's destiny is great and exalted,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਕਰ ਬਡੇ ਸੇ ਬਡੇ ਉਚੇ ਭਾਗ ਹੋਇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਵੱਡੇ ਭਾਗ ਹੋਣ, ਜੇ ਬੜੇ ਉਚੇ ਭਾਗ ਹੋਣ ਤਾਂ ਮਨੁੱਖ (ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਪਰਮਾਤਮਾ ਦਾ) ਨਾਮ ਜਪਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੋਵਹਿ = ਹੋ ਜਾਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, cuando el Destino es Perfecto,"