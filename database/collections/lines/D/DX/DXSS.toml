[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅਚਰਜ ਵਿਚਿ ਲਖ ਅਚਰਜਾ; ਅਚਰਜ ਅਚਰਜ ਚੋਜ ਵਿਡਾਣੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Millions of wonders are full of wonder and they are further surprised to see the awe-inspiring feats of the Lord, the all wonder Himself."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਸ੍ਰਿਸ਼ਟੀ ਭਾਲਦੇ ਭਾਲਦੇ) ਅਚਰਜ (ਹੋ ਗਏ ਬ੍ਰਹਮਾਦਿਕ) ਲੱਖਾਂ ਹੀ ਅਚਰਜ ਹੋ ਰਹੇ ਹਨ, (ਪਰ ਉਹ ਇਸ) ਅਚਰਜ ਰੂਪ (ਸ੍ਰਿਸ਼ਟੀ ਦਾ ਕਰਤਾ ਜੋ) ਅਚਰਜ ਰੂਪ ਰਖਦਾ ਹੈ (ਉਸ ਅਚਰਜਤਾਈ) ਦਾ 'ਚੋਜ ਵਿਡਾਣੀ' ਤੋ (ਬਹੁਤ ਹੀ ਅਚਰਜ ਰੂਪ) ਹੈ।"