[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨੰਨਾਕਾਰੁ; ਨ ਹੋਤਾ ਤਾ ਕਹੁ ॥"
page = 257
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Refusal awaits them not,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਨੂੰ ਕੋਈ ਇਨਕਾਰ ਨਹੀਂ ਹੁੰਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who have been given the Mantra of the Naam by the Guru,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਪੁਰਸੋਂ ਕੋ ਕਹੀਂ (ਨੰਨਾਕਾਰੁ) ਨਿਰਾਦਰ ਨਹੀਂ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਦੇ ਜੀਵਨ-ਸਫ਼ਰ ਵਿਚ (ਮਾਇਆ) ਕੋਈ ਰੋਕ ਨਹੀਂ ਪਾ ਸਕਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੰਨਾਕਾਰੁ = ਨਾਹ, ਇਨਕਾਰ, ਰੁਕਾਵਟ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél a quien el Guru ha bendecido con el Mantra del Naam,"