page = 656
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have found the incomprehensible thing,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਅਗਾਧ ਚੀਜ਼ ਨੂੰ ਲੱਭ ਲਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have found this incomprehensible thing;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਵਹੁ ਅਗੋਚਰ ਬ੍ਰਹਮ ਵਸਤੂ ਪਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਉਹ ਅਪਹੁੰਚ ਹਰਿ-ਨਾਮ ਪਦਾਰਥ ਮਿਲ ਪੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਈ = (ਜਿਸ ਨੇ) ਲੱਭ ਲਈ।"

[[content]]
assets = ["SNST"]
