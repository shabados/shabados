data = "ਤੂੰ ਹੀ ਰਾਜਿਆਂ ਦੀ ਰਾਜੇਸ਼ਵਰੀ ਵਜੋਂ ਬਖਾਨ ਕੀਤੀ ਜਾਂਦੀ ਹੈਂ।"