[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੂਰਬੀਰ ਜਾ ਕੇ ਸਦਾ; ਰਹੈ ਚਰਨ ਸੋ ਲਾਗ ॥੧॥"
page = 1007

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many intrepid visited him and fell on his feet for blessings.(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੂਰਬੀਰ ਉਸ ਦੇ ਸਦਾ ਚਰਨੀ ਲਗੇ ਰਹਿੰਦੇ ਸਨ ॥੧॥"