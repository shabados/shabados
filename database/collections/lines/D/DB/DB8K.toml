[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਨ ਬਿਧਿ; ਕਉਣੁ ਕਉਣੁ ਨਹੀ ਤਾਰਿਆ ॥"
page = 227
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In this way who and which have nor been saved by God?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਰੀਤੀ ਨਾਲ ਕਿਸ ਤੇ ਕਿਹੜੇ ਨੂੰ ਵਾਹਿਗੁਰੂ ਨੇ ਪਾਰ ਨਹੀਂ ਕੀਤਾ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In this way, who - who has not been saved?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਪੂਰਬੋਕਤ ਪ੍ਰਕਾਰ ਕਰਨੇ ਸੇ ਪਰਮੇਸ੍ਵਰ ਨੇ ਕਵਨ ਕਵਨ ਨਹੀਂ ਤਾਰਿਆ ਹੈ, ਭਾਵ ਅਗਿਨਤ ਤਾਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(\"ਸਚ ਘਰ\" ਵਿਚ ਬੈਠੇ ਰਹਿਣ ਦੀ) ਇਸ ਵਿਧੀ ਨੇ ਕਿਸ ਕਿਸ ਨੂੰ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਨਹੀਂ ਲੰਘਾਇਆ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Quién, oh quién, no se ha liberado de esta forma?"