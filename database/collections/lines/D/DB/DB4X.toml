[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਬਿਨੁ; ਤੁਹੀ ਦੁਹੇਰੀ ਰੀ ॥੧॥ ਰਹਾਉ ॥"
page = 390
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without her, thou art is in miserable plight, O body. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਬਾਝੋਂ ਤੂੰ ਬੁਰੀ ਹਾਲਤ ਵਿੱਚ ਹੈਂ, ਹੇ ਦੇਹਿ! ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without it, you are miserable. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਦੇਹਿ! ਉਸ ਬਿਨਾਂ ਤੂੰ ਦੁਖੀ ਰਹਤੀ ਹੈਂ ਅਰਥਾਤ ਤੇਰਾ ਨਿਰਾਦਰ ਹੋਤਾ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਾਂਇਆਂ! ਉਸ (ਜੀਵਾਤਮਾ) ਤੋਂ ਬਿਨਾ ਤੂੰ ਦੁੱਖੀ ਹੋ ਜਾਂਦੀ ਹੈਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਹੇਰੀ = ਦੁੱਖੀ। ਰੀ = ਹੇ ਕਾਇਆਂ! ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Estarías como una esposa abandonada, sin Esposo. (1-Pausa)"