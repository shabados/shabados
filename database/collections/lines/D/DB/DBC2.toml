data = "ਸਮੈ ਪਾਇ ਕਰਿ ਕੇਲ ਮਚਾਯੋ ॥"
page = 860

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She loved him intensively and, in due course, had commenced to have sex with him."

