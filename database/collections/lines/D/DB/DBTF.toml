[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੈ ਹਥਿ ਹੈ ਸਭ ਵਡਿਆਈ; ਜਿਸੁ ਦੇਵਹਿ ਸੋ ਪਾਇਦਾ ॥੧੧॥"
page = 1063
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All glory is in Thy Hand. O Lord, whomsoever thou bless, he alone obtains it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੀ ਪ੍ਰਭਤਾ ਤੇਰੇ ਹੱਥ ਵਿੱਚ ਹੈ, ਹੇ ਪ੍ਰਭੂ! ਜਿਸ ਕਿਸੇ ਨੂੰ ਤੂੰ ਬਖ਼ਸ਼ਦਾ ਹੈਂ, ਕੇਵਲ ਉਹ ਹੀ ਇਸ ਨੂੰ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All glorious greatness rests in Your Hands; he alone obtains it, unto whom You give it. ||11||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਹਥ ਸਭ ਵਡਿਆਈ ਹੈ, ਜਿਸ ਕੋ ਦੇਤਾ ਹੈਂ, ਸੋ ਪਾਵਤਾ ਹੈ॥੧੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੀ (ਲੋਕ ਪਰਲੋਕ ਦੀ) ਇੱਜ਼ਤ ਤੇਰੇ ਹੱਥ ਵਿਚ ਹੈ, ਜਿਸ ਨੂੰ ਤੂੰ (ਇਹ ਇੱਜ਼ਤ) ਦੇਂਦਾ ਹੈਂ ਉਹ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ ॥੧੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਥਿ = ਹੱਥ ਵਿਚ। ਦੇਵਹਿ = ਤੂੰ ਦੇਂਦਾ ਹੈਂ ॥੧੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, toda Gloria está en Tus Manos y a quien sea que bendices, sólo él es el bendecido. (11)"