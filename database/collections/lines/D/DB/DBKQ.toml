[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਹ ਛਲ ਛਿਦ੍ਰ; ਲਗਤ ਕਹੁ ਕੀਸ ॥"
page = 291
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who was afflicted then by fraud and sin?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉੱਥੇ ਧੋਖਾ-ਫਰੇਬ ਅਤੇ ਪਾਪ ਕਿਸੇ ਨੂੰ ਦੁਖਾਂਤ੍ਰ ਕਰਦੇ ਸਨ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then who was tainted by fraud and sin?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਹਾਂ ਛਲ ਔ ਛਿਦ੍ਰ ਕਹੋ ਤੋ ਕਿਸ ਕੋ ਲਾਗਤੇ ਥੇ, ਭਾਵ ਕਿਸੀ ਕੋ ਲਾਗਤੇ ਨਹੀਂ ਥੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਓਥੇ ਦੱਸੋ, ਛਲ ਤੇ ਐਬ ਕਿਸ ਨੂੰ ਲੱਗ ਸਕਦੇ ਸਨ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਛਲ = ਧੋਖਾ। ਛਿਦ੍ਰ = ਐਬ। ਕੀਸ = ਕਿਸ ਨੂੰ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿había acaso, quien pudiera ser afligido por la culpa o la tristeza?"