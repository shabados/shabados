[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਉ ਗੁਰਦੇਉ; ਪਰ ਨਿੰਦਾ ਤਿਆਗੀ ॥"
page = 1166
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Divine Guru is Merciful, one abandons the slander of others."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਰੱਬ ਰੂਪ ਗੁਰੂ ਜੀ ਦਇਆਲ ਹੁੰਦੇ ਹਨ ਤਾਂ ਪ੍ਰਾਨੀ ਹੋਰਨਾਂ ਦੀ ਬਦਖੋਈ ਛੱਡ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Divine Guru grants His Grace, one forsakes the slander of others."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਗੁਰਦੇਵ ਮਿਲਤੇ ਹੈਂ ਤਬ ਪਰਾਈ ਨਿੰਦਾ ਤਿ੍ਯਾਗੀ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਗੁਰੂ ਮਿਲ ਪਏ ਤਾਂ ਕਿਸੇ ਦੀ ਨਿੰਦਾ ਨਹੀਂ ਕਰਦਾ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el Guru nos muestra su Compasión, uno deja de calumniar a los demás."