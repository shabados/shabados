[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਾਵਣਿ ਗਾਵਹਿ; ਜਿਨ ਨਾਮ ਪਿਆਰੁ ॥"
page = 158
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who love the Name, sing God's songs."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਮ ਨੂੰ ਪ੍ਰੀਤ ਕਰਦੇ ਹਨ, ਉਹ ਵਾਹਿਗੁਰੂ ਦੇ ਗੀਤ ਗਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who love the Naam, sing the song."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਕਾ ਨਾਮ ਮੇਂ ਪਿਆਰ ਹੈ, ਸੋ ਸਚੇ ਕੇ (ਗਾਵਣਿ) ਸਬਦੁ ਗਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੇ ਗੀਤ) ਅਸਲ ਵਿਚ ਉਹ ਮਨੁੱਖ ਗਾਂਦੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਦਾ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਨਾਲ ਪਿਆਰ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo aquél que ama el Nombre del Señor, puede cantar en Verdad,"