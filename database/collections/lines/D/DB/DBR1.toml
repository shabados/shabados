[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਾਰ ਸੂਹੀ ਕੀ ਸਲੋਕਾ ਨਾਲਿ ਮਹਲਾ ੩ ॥"
page = 785
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Var of Suhi. With Slok 3rd Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੂਹੀ ਕੀ ਵਾਰ। ਸਲੋਕਾਂ ਨਾਲ ਤੀਜੀ ਪਾਤਿਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Vaar Of Soohee, With Saloks Of The Third Mehl:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਸੂਹੀ ਵਿੱਚ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਦੀ ਬਾਣੀ 'ਵਾਰ', ਸਲੋਕਾਂ ਸਮੇਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Var de Suji con Sloks de Mejl, Guru Amar Das, Tercer Canal Divino"