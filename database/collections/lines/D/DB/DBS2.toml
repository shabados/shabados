[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕੁ. ਸਿਖ ਦੇਇ ਮਨ ਪ੍ਰੀਤਮ; ਹਰਿ ਲਦੇ ਖੇਪ ਸਵਲੀ ॥੩॥"
page = 79
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, counsels the dear soul to load the cheap cargo of God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਪਿਆਰੀ ਜਿੰਦੜੀ ਨੂੰ ਰੱਬ ਦੇ ਨਾਮ ਦਾ ਸਸਤਾ ਮਾਲ ਬਾਰ ਕਰਨ ਦੀ ਸਲਾਹ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak gives this advice: O beloved mind, load the profitable cargo of the Lord's Name. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਪ੍ਰਮੇਸਰ ਕਾ ਪ੍ਯਾਰਾ ਜਗ੍ਯਾਸੂ ਮਨ ਕੋ ਯਹ ਸਿਖ੍ਯਾ ਦੇਵੇ ਕਿ ਹੇ ਮਨ ਤੂੰ  ਹਰੀ ਨਾਮ ਕੀ ਖੇਪ ਜੋ (ਸਵਲੀ) ਸਸਤੀ ਹੈ, ਸੋ ਲਾਦ ਲੇ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਵਾਸਤੇ) ਹੇ ਪਿਆਰੇ ਮਨ! ਨਾਨਕ (ਤੈਨੂੰ) ਸਿੱਖਿਆ ਦੇਂਦਾ ਹੈ ਕਿ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਸੌਦਾ ਵਿਹਾਝ, ਇਹੀ ਸੌਦਾ ਨਫ਼ੇ ਵਾਲਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕੁ ਦੇਇ = ਨਾਨਕ ਦੇਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, oh mi mente bien amada, lleva contigo al más allá la Verdadera Mercancía (3)"