[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨੁ ਧਨੁ ਸੋ ਜਨੁ; ਪੁਰਖੁ ਸਭਾਗਾ ॥"
page = 792
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "blest, blest and very lucky is that God's servant."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਲੱਖਣਾ, ਸੁਲੱਖਣਾ ਅਤੇ ਭਾਰੇ ਨਸੀਬਾਂ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who is imbued with the Lord's Love, in the Saadh Sangat, the Company of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪੁਰਖ ਭਾਗੋਂ ਸਹਿਤ ਹੈ ਅਰ ਧੰਨੁ ਧੰਨ ਕਰਨੇ ਜੋਗੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਧੰਨ ਹੈ, ਭਾਗਾਂ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭਾਗਾ = ਭਾਗਾਂ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que está imbuido en el Amor del Señor asociado con los Santos,"