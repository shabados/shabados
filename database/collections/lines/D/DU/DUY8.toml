[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਗ ਰੋਗ ਬਿਪਤਿ ਅਤਿ ਭਾਰੀ ॥"
page = 742
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The sorrows, ailments and very great calamities,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਫਸੋਸ, ਬੀਮਾਰੀਆਂ ਅਤੇ ਪਰਮ ਵੱਡੀਆਂ ਮੁਸੀਬਤਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sorrow, disease and the most terrible calamities"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਗ ਰੋਗ ਅਰ ਬਿਪਤਾ ਜੋ ਅਤੀ ਭਾਰੀ ਥੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਸੇਵਕ ਦੇ) ਅਨੇਕਾਂ ਗ਼ਮ ਤੇ ਰੋਗ ਵੱਡੀਆਂ ਭਾਰੀਆਂ ਮੁਸੀਬਤਾਂ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਗ = ਗ਼ਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las inmensas tristezas, las maldades y las calamidades"