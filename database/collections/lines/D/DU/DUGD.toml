[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਿ ਸੰਤੋਖੁ; ਨਾਮ ਜਪਿ ਲੀਨੇ ॥"
page = 298
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "is mentally content and repeats the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਦਿਲੋਂ ਸੰਤੁਸ਼ਟ ਹੁੰਦਾ ਹੈ ਅਤੇ ਨਾਮ ਨੂੰ ਉਚਾਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "your mind will be content, as you chant the Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਭਗਵੰਤ ਕੇ ਨਾਮ ਜਪ ਲਏ ਹੈ, ਤਿਨ ਕੇ ਮਨ ਮੇਂ ਸੰਤੋਖ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਜਪਦਾ ਹੈ ਤਾਂ ਉਸ ਦੇ ਮਨ ਵਿਚ ਸੰਤੋਖ ਪੈਦਾ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "está contento, y contempla a su Señor;"