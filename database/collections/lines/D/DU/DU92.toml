[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਖੁ ਦਰਦੁ ਭ੍ਰਮੁ; ਤਾ ਕਾ ਭਾਗਾ ॥੧॥"
page = 194
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the misery, pang and doubt flee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਮੁਸੀਬਤ, ਪੀੜਾ ਤੇ ਸੰਦੇਹ ਦੌੜ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- pain, suffering and doubt run away from them. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੂਖੁ ਦਰਦੁ ਭ੍ਰਮ ਤਿਸ ਕਾ ਸੰਪੂਰਨ ਨਿਬ੍ਰਿਤ ਹੂਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਹਰੇਕ ਦੁੱਖ ਦਰਦ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ, ਉਸ ਦੀ (ਮਾਇਆ ਆਦਿਕ ਵਾਲੀ) ਭਟਕਣਾ ਮੁੱਕ ਜਾਂਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕਾ = ਉਸ (ਮਨੁੱਖ) ਦਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el dolor, el sufrimiento y la duda se alejan de ellos.(1)"