[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਖ ਟਕਿਆ ਕੇ ਮੁੰਦੜੇ; ਲਖ ਟਕਿਆ ਕੇ ਹਾਰ ॥"
page = 464
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They wear ear-rings worth lacs of rupees and necklace worth lakhs."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਲੱਖਾਂ ਹੀ ਰੁਪਿਆਂ ਦੇ ਕੰਨ-ਕੁੰਡਲ ਪਹਿਨਦੇ ਹਨ ਅਤੇ ਲੱਖਾਂ ਰੁਪਿਆਂ ਦੀਆਂ ਮਾਲਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They wear earrings, and necklaces worth thousands of dollars."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਉਨ ਬਜਾਰੀਓਂ ਕੇ ਨਾਚ ਮੇਂ ਲਾਖ (ਟਕਿਆ) ਰੁਪਯੋਂ ਕੇ (ਮੁੰਦੜੇ) ਬਾਲੇ ਵਾ ਛਲੇ, ਲਾਖੋਂ ਰੁਪਯੋਂ ਕੇ ਹਾਰ ਪਹਿਰਨੇ ਹਾਰਿ੍ਯੋਂ ਕੇ ਚਰਿਤ੍ਰ ਕਰਤੇ ਹੈਂ ਵਾ ਆਪ ਪਹਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਲੱਖਾਂ ਰੁਪਇਆਂ ਦੇ (ਭਾਵ, ਕੀਮਤੀ) ਵਾਲੇ ਤੇ ਹਾਰ ਪਾਂਦੇ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁੰਦੜੇ = ਸੋਹਣੇ ਸੋਹਣੇ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Preciosos son los aretes, preciosos los listones en sus cuellos, pero el cuerpo que los viste es reducido a polvo."