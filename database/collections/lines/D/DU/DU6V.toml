[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਸਿਲੀਮੁਖ ਕੇ ਸਬੈ; ਲੀਜਹੁ ਚਤੁਰ ਬਨਾਇ ॥੮੨॥"
page = 721

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After uttering the name “Subhat” and then adding the word “Ha”, the wise people tell all the names of Baan.82."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਸਾਰੇ ਨਾਮ 'ਸਿਲੀਮੁਖ' (ਤੀਰ) ਦੇ ਹਨ, ਬੁੱਧੀਮਾਨ ਲੋਗ ਬਣਾ ਲੈਣ ॥੮੨॥"