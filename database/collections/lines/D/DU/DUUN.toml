[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਸੰਖ ਗਲਵਢ; ਹਤਿਆ ਕਮਾਹਿ ॥"
page = 4
line = 4

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਉਚਾਰਨ ਨਾਸਕੀ ਕਿਉਂਕਿ ਇਸ ਕਿਰਿਆ ਦਾ ਕਰਤਾ ਅਨ- ਪੁਰਖ. ਭਹੁਵਚਨ ਨਾਂਵ ਹੈ।"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Numberless are those who cut throats and commit murders."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਣਗਿਣਤ ਹਨ ਗਲ ਵੱਢਣ ਵਾਲੇ, ਜੋ ਖੂਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Countless cut-throats and ruthless killers."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਗਿਣਤ ਹੀ ਜੋ ਗਲ ਕੋ ਕਾਟਕਰ ਹੱਤ੍ਯਾ ਹੀ ਕਮਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਹੀ ਖ਼ੂਨੀ ਮਨੁੱਖ ਲੋਕਾਂ ਦੇ ਗਲ ਵੱਢ ਰਹੇ ਹਨ"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਲਵਢ = ਗਲ ਵੱਢਣ ਵਾਲੇ, ਕਾਤਲ, ਖ਼ੂਨੀ ਮਨੁੱਖ। ਹਤਿਆ ਕਮਾਹਿ = ਦੂਜਿਆਂ ਦੇ ਗਲ ਵੱਢਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Incontables los asesinos que derraman sangre inocente."