[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਸਕਲ ਤੁਪਕ ਕੇ ਨਾਮ; ਅਨੇਕ ਪ੍ਰਬੀਨ ਲਹੁ ॥੧੦੦੧॥"
page = 778

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Tamhar-bhagnin”, utter the word “Satchar-pati”, then speaking “Shatru” know all the names of Tupak.1001."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਾਰੇ ਬੁੱਧੀਮਾਨੋ, ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝ ਲਵੋ ॥੧੦੦੧॥"