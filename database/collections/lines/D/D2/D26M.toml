[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਕਲਾ ਕਰਿ; ਖੇਲੈ ਖੇਲ ॥"
page = 294
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With all the skill He plays His plays."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੀ ਕਾਰੀਗਰੀ ਨਾਲ ਉਹ ਆਪਣੀਆਂ ਖੇਡਾਂ ਖੇਡਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With absolute power, He plays His play."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੀ ਸਰਬ ਸ਼ਕਤੀਓਂ ਕਰ ਕੇ ਅਨੇਕ ਖੇਲੋਂ ਕੋ ਖੇਲਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਤਾਕਤਾਂ ਰਚ ਕੇ (ਜਗਤ ਦੀਆਂ) ਖੇਡਾਂ ਖੇਡ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਲਾ = ਤਾਕਤਾਂ। ਕਰਿ = ਰਚ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con un sin fin de recursos, despliega Su Drama."