[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤ ਟੇਕ ਤੁਹਾਰੇ ॥"
page = 1272
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thine devotees seek but Thy support."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਅਨੁਰਾਗੀ ਕੇਵਲ ਤੇਰਾ ਹੀ ਆਸਰਾ ਲੋੜਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your devotees take Your Support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਗਵਨ! ਜੋ ਭਗਤ ਆਪ ਕੇ (ਟੇਕ) ਆਸਰੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਤੇਰੇ) ਭਗਤਾਂ ਨੂੰ ਤੇਰੀ ਹੀ ਟੇਕ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਟੇਕ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo Tú eres, oh Dios. Tus Devotos se amparan en Ti"