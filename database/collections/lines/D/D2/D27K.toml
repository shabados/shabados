[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਮਨਿ ਭਈ ਪਰਤੀਤਿ ॥"
page = 194
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, the faith comes in the mind of God's servant,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਫੁਰਮਾਉਂਦੇ ਹਨ, ਰੱਬ ਦੇ ਦਾਸ ਦੇ ਚਿੱਤ ਅੰਦਰ ਭਰੋਸਾ ਆ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, faith comes into the mind of His servant,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੇਰੇ ਮਨ ਮੇਂ ਐਸੀ ਪ੍ਰਤੀਤ ਭਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਵਾਸਤੇ) ਨਾਨਕ ਆਖਦਾ ਹੈ- (ਪਰਮਾਤਮਾ ਦੇ ਸੇਵਕਾਂ ਦੇ) ਮਨ ਵਿਚ (ਪਰਮਾਤਮਾ ਦੀ ਓਟ ਆਸਰੇ ਦਾ) ਨਿਸ਼ਚਾ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਪਰਤੀਤਿ = ਸਰਧਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, la Fe viene a la mente de aquel Sirviente,"