[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰਾ ਰੂਪੁ ਅਗੰਮੁ ਹੈ; ਅਨੂਪੁ ਤੇਰਾ ਦਰਸਾਰਾ ॥"
page = 746
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thy form is unapproachable and extremely beauteous is Thine vision."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਸਰੂਪ ਪਹੁੰਚ ਤੋਂ ਪਰੇ ਹੈ ਅਤੇ ਪਰਮ ਸੁੰਦਰ ਹੈ ਤੇਰਾ ਦਰਸ਼ਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Your Form is inaccessible, and Your Vision is incomparably beautiful."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਿਗੁਰੂ! ਤੇਰਾ ਸਰੂਪ ਮਨ ਬਾਣੀ ਕਾ ਪਰਾ ਹੈ ਪਾਵਣਾ ਬੜਾ ਕਠਨ ਹੈ ਔਰ ਤੇਰਾ ਦਰਸਨ (ਅਨੂਪੁ) ਉਪਮਾ ਸੇ ਰਹਿਤ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰੀ ਹਸਤੀ ਐਸੀ ਹੈ ਜਿਸ ਤਕ (ਅਸਾਂ ਜੀਵਾਂ ਦੀ) ਪਹੁੰਚ ਨਹੀਂ ਹੋ ਸਕਦੀ, ਤੇਰਾ ਦਰਸਨ ਅਦੁੱਤੀ ਹੈ (ਤੇਰੇ ਵਰਗਾ ਹੋਰ ਕੋਈ ਨਹੀਂ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗੰਮੁ = {अगभ्य} ਅਪਹੁੰਚ। ਅਨੂਪੁ = ਬੇ-ਮਿਸਾਲ, ਅਦੁੱਤੀ। ਦਰਸਾਰਾ = ਦਰਸਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tu Forma es Infinita, Tu Visión Encantadora;"