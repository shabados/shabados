[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੁਖ ਭੰਜਨੁ; ਤਾ ਕਾ ਹੈ ਨਾਉ ॥"
page = 1146
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Destroyer of pain is His Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੀੜ ਨੂੰ ਨਾਸ ਕਰਨ ਵਾਲਾ ਹੈ, ਉਸ ਦਾ ਨਾਮ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His Name is the Destroyer of pain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੁਖੋਂ ਕੇ ਨਸਟ ਕਰਨੇ ਵਾਲਾ ਤਿਸ ਕਾ ਨਾਮੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਨਾਮ ਹੀ ਹੈ 'ਦੁਖ-ਭੰਜਨੁ' (ਭਾਵ, ਦੁੱਖਾਂ ਦਾ ਨਾਸ ਕਰਨ ਵਾਲਾ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਖ ਭੰਜਨੁ = ਦੁੱਖਾਂ ਦਾ ਨਾਸ ਕਰਨ ਵਾਲਾ। ਤਾ ਕਾ = ਉਸ (ਪਰਮਾਤਮਾ) ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es el Destructor de la tristeza,"