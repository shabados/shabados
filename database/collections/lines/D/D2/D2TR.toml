[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਇ ਮੰਨਿਐ. ਸਾਂਤਿ ਊਪਜੈ; ਹਰਿ ਮੰਨਿ ਵਸਾਇਆ ॥"
page = 1242
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Believing in the Name, tranquillity wells up in one and the Name is enshrined in one's mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਤੇ ਭਰੋਸਾ ਰਖਣ ਦੁਆ, ਜੀਵ ਅੰਦਰ ਠੰਡ-ਚੈਨ ਪੈਦਾ ਹੋ ਜਾਂਦੀ ਹੈ ਅਤੇ ਨਾਮ ਉਸ ਦੇ ਚਿੱਤ ਵਿੱਚ ਟਿਕ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Believing in the Name, tranquility and peace well up, and the Lord is enshrined in the mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਕੇ ਮਨਨ ਸੇ ਸ਼ਾਂਤੀ ਉਪਜਤੀ ਹੈ ਔਰ ਹਰੀ ਕੋ ਮਨ ਮੇਂ ਬਸਾਇਆ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਮਨ ਨਾਮ ਸਿਮਰਨ ਵਿਚ ਗਿੱਝ ਜਾਏ ਤਾਂ ਮਨ ਵਿਚ ਠੰਢ ਵਰਤ ਜਾਂਦੀ ਹੈ, ਪ੍ਰਭੂ ਮਨ ਵਿਚ ਆ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਨਿ = ਮਨਿ, ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Confiando en el Nombre uno entra en el Contentamiento, y así alaba al Señor en su Mente."