data = "ਰਾਣੀ ਨੇ ਮਨ ਵਿਚ ਇਸ ਤਰ੍ਹਾਂ ਸਮਝਿਆ ਕਿ ਦਾਸੀ ਨਾਲ ਆ ਰਹੀ ਹੈ ॥੫॥"