[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇਜੜੀਆ ਸੋਇੰਨ; ਹੀਰੇ ਲਾਲ ਜੜੰਦੀਆ ॥"
page = 1102
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If her couch be studded with gold, rubies and jewels,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਉਸ ਦਾ ਪਲੰਘ ਸੋਨੇ, ਮਾਣਿਕਾਂ ਅਤੇ ਜਵਾਹਿਰਾਤਾਂ ਨਾਲ ਜੜਿਆ ਹੋਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Her bed is adorned with gold, diamonds and rubies;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਕਰਣਾ, ਮੁਦਤਾ, ਮੈਤ੍ਰੀ, ਅਪੇਖਿਆ ਇਨ ਕਾ ਕਥਨ ਕਰਨਾ ਹੈ ਇਹ ਸੋਇਨੇ ਦੀਆਂ ਸੇਜਾ ਹੈਂ, ਗ੍ਯਾਨ ਪਰੇਮ ਕੀਆਂ ਬਾਤਾਂ ਕਰਤੇ ਹੈਂ ਇਹ ਹੀਰੇ ਲਾਲ ਜੜੇ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੋਨੇ ਦਾ ਪਲੰਘ ਹੋਵੇ ਜਿਸ ਵਿਚ ਹੀਰੇ ਲਾਲ ਜੜੇ ਹੋਏ ਹੋਣ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਇੰਨ = ਸੋਨੇ ਦੀਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si mi aposento fuera de oro, engarzado de diamantes y rubíes"