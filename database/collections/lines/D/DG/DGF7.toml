[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਜਪੀਐ; ਉਤਰੈ ਚਿੰਦ ॥"
page = 891
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Contemplating Him by Guru's grace, worry is worn off."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਉਸ ਦਾ ਭਜਨ ਕਰਨ ਨਾਲ ਚਿੰਤਾ ਮਿੱਟ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh meditates on Him, and his worries are gone."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਦ੍ਵਾਰਾ ਜਪੀਐ ਤੋ ਸਭ ਚਿੰਤਾ ਉਤਰ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਹੜਾ ਮਨੁੱਖ ਜਪਦਾ ਹੈ, ਉਸ ਦਾ) ਚਿੰਤਾ-ਫ਼ਿਕਰ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਪੀਐ = ਜਪਣਾ ਚਾਹੀਦਾ ਹੈ। ਚਿੰਦ = ਚਿੰਤਾ, ਫ਼ਿਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y aquél que contempla Su Nombre por la Gracia del Guru, se libera de preocupaciones."