data = "ਤਿਨ ਕੇ, ਤੁਮ ਸੰਕਟ ਸਭ ਟਾਰੇ ॥੩੯੭॥"
page = 1387

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The persons who fell at Thy Feet, Thou didst remove all their troubles.397."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੇ ਸਾਰੇ ਸੰਕਟ ਤੁਸੀਂ ਦੂਰ ਕਰ ਦਿੰਦੇ ਹੋ ॥੩੯੭॥"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਤਿਨ ਕੇ; ਤੁਮ ਸੰਕਟ ਸਭ ਟਾਰੇ ॥੨੧॥"