[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਮਖ ਨਿਮਖ; ਜਪਿ ਨਾਨਕ ਹਰੀ ॥੮॥੫॥"
page = 269
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Every moment, O Nanak meditate upon the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਮੁਹਤ, ਹੇ ਨਾਨਕ! ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Each and every moment, O Nanak, meditate on the Lord. ||8||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ ਤਿਸ ਨੇ ਹੀ ਨਿਮਖ ਨਿਮਖ ਕਾਲ ਮੇਂ ਹਰੀ ਕੋ ਜਪਿਆ ਹੈ॥੮॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਐਸੇ) ਪ੍ਰਭੂ ਨੂੰ ਦਮ-ਬ-ਦਮ ਯਾਦ ਕਰ ॥੮॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਮਖ ਨਿਮਖ = ਅੱਖ ਦੇ ਫਰਕਣ ਦੇ ਸਮੇ ਵਿਚ ਭੀ ॥੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Debemos pues meditar en Él por siempre y para siempre.  (8-5)"