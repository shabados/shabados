type = "primary"
data = "ਕਿਧੋ ਗੀਰਬਾਣੇਸਹੂੰ ਕੇ ਸੁਧਾਰੇ ॥"
page = 829

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘They are pricking like the arrows straight from Cupid."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਾਂ ਇੰਦਰ ('ਗੀਰਬਾਣੇਸ') ਦੇ ਬਣਾਏ ਹੋਏ ਹਨ।"