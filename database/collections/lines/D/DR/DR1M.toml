[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਿਨਕਰ ਚਿਤ ਚਕਵੀ ਜਾਨਿਆ ॥"
page = 625

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The peacocks thought of him as cloud and the Chakvi (Brahmani duck) as sun"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਚਕਵੀ ਨੇ ਚਿਤ ਵਿਚ ਸੂਰਜ ਕਰ ਕੇ ਸਮਝਿਆ।"