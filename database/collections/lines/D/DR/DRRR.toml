data = "ਲਰਿ ਕੈ ਮਰਿ ਕੈ ਗਿਰਿ ਖੇਤਿ ਰਹੇ ॥੧੯॥"
page = 102

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And after fighting have died and fallen in the field.19."

