[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਾਨ ਸਰੋਵਰੁ ਹੰਸੁਲਾ; ਓਹੁ ਅਮੋਲਕ ਰਤਨਾ ਖਾਣੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "For swans the Manasarovar is the mine of jewels;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮਾਨ ਸਰੋਵਰ ਪਰ ਹੰਸ (ਰਹਿਕੇ) ਉਸ ਨੂੰ ਅਮੋਲਕ ਰਤਨਾਂ ਦੀ ਖਾਨ (ਜਾਣਦਾ) ਹੈ।"