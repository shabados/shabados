[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤੋਖੁ ਭਇਆ ਸੰਸਾਰੇ ॥"
page = 629
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The world has now acquired contentment."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਨੂੰ ਹੁਣ ਸੰਤੁਸ਼ਟਤਾ ਪ੍ਰਾਪਤ ਹੋ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The world has become contented."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ ਕੋ ਸੰਸਾਰ ਮੇਂ ਸੰਤੋਖ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਦੁਨੀਆ ਦੀ ਕਿਰਤ-ਕਾਰ ਕਰਦਿਆਂ ਭੀ (ਉਸ ਦੇ ਮਨ ਵਿਚ ਮਾਇਆ ਵਲੋਂ) ਸੰਤੋਖ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਸਾਰੇ = ਸੰਸਾਰ ਵਿਚ (ਵਿਚਰਦਿਆਂ), ਦੁਨੀਆ ਦੀ ਕਿਰਤ = ਕਾਰ ਕਰਦਿਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mundo entero está en verdad Contento,"