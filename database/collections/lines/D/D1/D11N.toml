[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਅਕੁਲ ਨਿਰੰਜਨੁ; ਪਰਮ ਹੀਰੁ ॥੬॥"
page = 1190
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou are the Unknowable and Immaculate most sublime jewel."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਅਗਾਧ ਅਤੇ ਪਾਵਨ ਪਵਿੱਤਰ ਮਹਾਨ ਸਰੇਸ਼ਟ ਜਵੇਹਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the Unknowable, the Immaculate, the most Sublime Jewel. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੁਲ ਜਾਤੀ ਤੇ ਰਹਿਤ ਹੈਂ; ਵਾ ਅਕੁਲ ਕਾ ਆਕੁਲ ਪਦ ਹੈ ਕ੍ਯਾ ਤੂੰ ਪੂਰਨ ਨਿਰੰਜਨ ਹੈਂ, (ਪਰਮ ਹੀਰੁ) ਵੱਡਾ ਸੁਧੁ ਹੈਂ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਕੋਈ ਖ਼ਾਸ ਕੁਲ ਨਹੀਂ, ਤੇਰੇ ਉਤੇ ਮਾਇਆ ਆਪਣਾ ਪ੍ਰਭਾਵ ਨਹੀਂ ਪਾ ਸਕਦੀ, ਤੂੰ ਸਭ ਤੋਂ ਸ੍ਰੇਸ਼ਟ ਹੀਰਾ ਹੈਂ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਕੁਲ = ਜਿਸ ਦੀ ਕੋਈ ਖ਼ਾਸ ਕੁਲ ਨਹੀਂ। ਹੀਰੁ = ਹੀਰਾ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, eres el Diamante Sublime, Inmaculado y sin Casta. (6)"