[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸ੍ਰਬ ਨਿਧਾਨ ਪੂਰਨ ਗੁਰਦੇਵ ॥੧॥ ਰਹਾਉ ॥"
page = 806
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the Perfect Bright Guru are contained all the treasures. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਪ੍ਰਕਾਸ਼ਵਾਨ ਗੁਰਾਂ ਅੰਦਰ ਸਾਰੇ ਖਜਾਨੇ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All treasures come from the Perfect Divine Guru. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਨਿਧੀਓਂ ਕੇ ਸਮੁੰਦ੍ਰ ਰੂਪ ਪੂਰਨ ਸਤਿਗੁਰ ਦੇਵ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪੂਰੇ ਗੁਰੂ ਦੀ ਸਰਨ ਪਿਆਂ ਸਾਰੇ ਖ਼ਜ਼ਾਨਿਆਂ ਦਾ ਮਾਲਕ ਪ੍ਰਭੂ ਮਿਲ ਪੈਂਦਾ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸ੍ਰਬ = {सर्व} ਸਾਰੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos los Tesoros están contenidos en el Guru Perfecto.  (1-Pausa)"