[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਹ ਪ੍ਰਸਾਦਿ; ਤੇਰੇ ਕਾਰਜ ਪੂਰੇ ॥"
page = 270
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose kindness all thy works are accomplished,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਮਿਹਰਬਾਨੀ ਦੁਆਰਾ ਤੇਰੇ ਸਾਰੇ ਕੰਮ ਸੰਪੂਰਨ ਹੋਏ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By His Grace, your works are completed;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਕ੍ਰਿਪਾ ਸਾਥ ਤੇਰੇ ਸਰਬ ਕਾਰਜ ਪੂਰਨ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਕ੍ਰਿਪਾ ਨਾਲ ਤੇਰੇ (ਸਾਰੇ) ਕੰਮ ਸਿਰੇ ਚੜ੍ਹਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਰਜ = ਕੰਮ। ਪੂਰੇ = ਮੁਕੰਮਲ, ਸਿਰੇ ਚੜ੍ਹਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por Su Gracia, tus tares son realizadas."