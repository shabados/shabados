[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗੁ ਗਉੜੀ ਗੁਆਰੇਰੀ ਮਹਲਾ ੫ ਅਸਟਪਦੀਆ ॥"
page = 235
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Measure Gauri Guareri 5th Guru Ashtpadian."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗੁ ਗਊੜੀ ਗੁਆਰੇਰੀ ਪਾਤਸ਼ਾਹੀ ਪੰਜਵੀਂ ਅਸਟਪਦੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Gauree Gwaarayree, Fifth Mehl, Ashtpadheeyaa:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਗਉੜੀ-ਗੁਆਰੇਰੀ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਅੱਠ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Gauri Gwareri, Mejl Guru Aryan, Quinto Canal Divino."