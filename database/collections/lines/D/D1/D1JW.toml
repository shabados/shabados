[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਹੁ ਗੁਣ ਕਾ; ਨਾਹੀ ਪਰਵੇਸੁ ॥"
page = 291
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then the three qualities had not entered the world."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਤਿੰਨੇ ਲੱਛਣ ਜੱਗ ਵਿੱਚ ਦਾਖਲ ਨਹੀਂ ਹੋਏ ਸਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then the three qualities were not prevailing."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਰਜ ਤਮਾਦੀ (ਤਿਹੁ) ਤੀਨੋਂ ਗੁਣੋਂ ਕਾ ਪ੍ਰਵੇਸ਼ ਨਹੀਂ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਦੇ) ਤਿੰਨ ਗੁਣਾਂ ਦਾ (ਉਸ ਉਤੇ) ਅਸਰ ਨਹੀਂ ਪੈਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਵੇਸੁ = ਦਖ਼ਲ, ਪ੍ਰਭਾਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entonces Su Presencia no existía en un mundo delimitado por los sentidos."