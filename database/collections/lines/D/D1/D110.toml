[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ ਚੁਪੈ ਜੇ ਮੰਗਿਐ; ਦਾਤਿ ਕਰੇ ਦਾਤਾਰੁ ॥"
page = 1242
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whether we keep mum and whether we ask, the beneficent Lord continues to bless us with His bounties."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਵੇਂ ਅਸੀਂ ਚੁਪ ਕਰ ਰਹੀਏ ਤੇ ਭਾਵੇਂ ਅਸੀਂ ਯਾਚਨਾ ਕਰੀਏ, ਦੇਣਹਾਰ ਸੁਆਮੀ ਸਾਨੂੰ ਆਪਣੀਆਂ ਦਾਤਾਂ ਬਖਸ਼ੀ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = ". Whether we keep silent or beg out loud, the Great Giver blesses us with His gifts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਜੇ) ਭਾਵੈਂ ਚੁਪਕਾ ਹੋ ਰਹੇ ਚਾਹੇ ਮੰਗ ਲੇਵੈ, (ਦਾਤਾਰੂ) ਪਰਮੇਸ੍ਵਰ ਸਭ ਕੋ ਦਾਤ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਭਾਵੇਂ ਚੁੱਪ ਕਰ ਰਹੀਏ ਤੇ ਭਾਵੇਂ ਮੰਗੀਏ, ਦਾਤਾਂ ਦੇਣ ਵਾਲਾ ਕਰਤਾਰ ਆਪ ਹੀ ਦਾਤਾਂ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੇ ਚੁਪੈ = ਜੇ ਚੁੱਪ ਕਰ ਰਹੀਏ। ਜੇ ਮੰਗਿਐ = ਜੇ ਕੁਝ ਮੰਗੀਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aunque uno pregunte o no, el Señor Bondadoso por Su Misericordia, da y da. He buscado por todo el mundo,"