[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੈ ਵਿਚਿ; ਚਲਹਿ ਲਖ ਦਰੀਆਉ ॥"
page = 464
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In Lord's fear flow lacs of rivers."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੇ ਡਰ ਅੰਦਰ ਲੱਖਾਂ ਹੀ ਦਰਿਆ ਵਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Fear of God, thousands of rivers flow."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਹ ਅਕਾਲ ਪੁਰਖ ਕੇ ਭ੍ਯ ਮੇਂ ਬਹਤਾ ਹੈ ਔ ਲਾਖੋਂ (ਦਰੀਆਉ) ਨਦ ਭੀ ਭ੍ਯ ਮੇਂ ਚਲਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਲੱਖਾਂ ਦਰੀਆਉ ਭੀ ਭੈ ਵਿਚ ਹੀ ਵਗ ਰਹੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਲਹਿ = ਚੱਲਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Reverencia a Él corren un sinnúmero de ríos."