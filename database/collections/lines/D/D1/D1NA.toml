[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁੰਨ ਨਿਰੰਤਰਿ; ਦੀਜੈ ਬੰਧੁ ॥"
page = 939
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If man fixes his soul in the Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਬੰਦਾ ਆਪਣੀ ਆਤਮਾ ਨੂੰ ਸੁਆਮੀ ਅੰਦਰ ਜੋੜ ਲਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Focused deep within, in perfect absorption,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸੁੰਨ) ਅਫੁਰ ਪਰਮੇਸਰ ਮੇਂ ਨਿਰੰਤਰ ਇਸ ਮਨ ਕੋ ਬੰਧ ਦੀਜੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇ ਮਾਇਆ ਦੇ ਹੱਲਿਆਂ ਦੇ ਰਾਹ ਵਿਚ) ਇਕ-ਰਸ ਅਫੁਰ ਪਰਮਾਤਮਾ (ਦੀ ਯਾਦ) ਦਾ ਇਕ ਅਤੁੱਟ ਬੰਨਾ ਬਣਾ ਦੇਈਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰੰਤਰਿ = ਇੱਕ-ਰਸ, ਲਗਾਤਾਰ। ਬੰਧੁ = ਬੰਨ੍ਹ, ਰੋਕ, ਬੰਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si uno conserva la mente en el trance sin semilla,"