[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਲ ਹੀਨ, ਕਲਾ ਸੰਜੁਗਤਿ; ਅਕਾਲ ਪੁਰਖ ਅਦੇਸ ॥"
page = 5
line = 10

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art Dearthless, Almighty, Timeless Purasha and Countryless."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ) ਕਾਲ-ਰਹਿਤ, ਕਲਾ (ਸ਼ਕਤੀ) ਸਹਿਤ ਅਕਾਲ ਪੁਰਖ ਨੂੰ ਨਮਸਕਾਰ ਹੈ;"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਕਾਲ ਹੀਨ ਕਲਾ ਸੰਜੁਗਤਿ; ਅਕਾਲ ਪੁਰਖ ਅਦੇਸ ॥"