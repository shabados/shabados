[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਪਿਰੁ ਗੁਣਵੰਤਾ; ਹਉ ਅਉਗੁਣਿਆਰਾ ॥"
page = 561
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou, O Lord, art full of merits, while I am without any merit,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਤੂੰ ਖੂਬੀਆਂ ਸੰਯੁਕਤ ਹੈ ਅਤੇ ਮੈਂ ਖੂਬੀਆਂ-ਰਹਿਤ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You, O Husband Lord, are meritorious, while I am without merit."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਪਤੀ ਗੁਣਵਾਨ ਹੈਂ, ਮੈਂ ਅਉਗਣਵਾਰਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ-ਪਤੀ! ਤੂੰ ਗੁਣਾਂ ਨਾਲ ਭਰਪੂਰ ਹੈਂ, ਪਰ ਮੈਂ ਅਉਗਣਾਂ ਨਾਲ ਭਰਿਆ ਹੋਇਆ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, Tú estás lleno de Méritos y yo no tengo ninguno."