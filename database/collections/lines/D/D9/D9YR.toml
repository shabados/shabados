[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਭੇ ਸਸਤ੍ਰ ਸਾਜਾ ਮਨੋ ਸਾਤਨੇਵੰ ॥੫੫॥੨੧੧॥"
page = 116

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "It appears that the dreadful warriors are Bhisham Pitamahas.55.211."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਭ ਨੇ ਸ਼ਸਤ੍ਰ ਸਜਾਏ ਹੋਏ ਸਨ। (ਇੰਜ ਪ੍ਰਤੀਤ ਹੁੰਦਾ ਸੀ) ਮਾਨੋ ਭੀਸ਼ਣ ਪਿਤਾਮਾ ('ਸਾਂਤਨੇਵੰ') ਹੋਣ ॥੫੫॥੨੧੧॥"