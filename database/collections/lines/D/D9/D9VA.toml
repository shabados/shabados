data = "ਸੋ ਕਹੋ ਛੰਦ ਮੋਹਣਿ ਮਝਾਰ ॥੪੪॥"
page = 679

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He adored her in various ways, whose description here I have composed in Mohani Stanza.44."

[[content]]
assets = ["RSJD"]
