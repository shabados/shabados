[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਹਜੇ ਸਮਾਈਐ ਗੋਵਿੰਦੁ ਪਾਈਐ; ਦੇਹੁ ਸਖੀਏ ਮੋਹਿ ਮਤੇ ॥"
page = 845
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my mate, so counsel thou me, that I may attain to the Lord of Universe and be easily absorbed in Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਸਹੇਲੀਏ! ਤੂੰ ਮੈਨੂੰ ਇਸ ਤਰ੍ਹਾਂ ਦੀ ਸਿੱਖ-ਮਤ ਦੇ ਕਿ ਮੈਂ ਆਲਮ ਦੇ ਸੁਆਮੀ ਨੂੰ ਪਾ ਲਵਾਂ ਅਤੇ ਸੁਖੈਨ ਹੀ ਉਸ ਅੰਦਰ ਲੀਨ ਹੋ ਜਾਵਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If only I could meet the Lord of the Universe, and be automatically absorbed into Him; tell me how, O my companions!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤੇ ਸਾਂਤਿ ਰੂਪ ਮੇਂ ਸਮਾਈਏ ਔਰ ਗੋਬਿੰਦ ਕੌ ਪਾਈਏ। ਹੇ ਸੰਤ ਜਨ ਸਖੀਓ! ਐਸੀ (ਮਤੇ) ਬੁਧਿ ਮੁਝ ਕੌ ਦੀਜੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੂੰ ਅੱਗੋਂ ਇਹ ਉੱਤਰ ਮਿਲਦਾ ਹੈ-ਜੇ) ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਲੀਨ ਰਹੀਏ ਤਾਂ ਪਰਮਾਤਮਾ-ਪਤੀ ਮਿਲ ਪੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜੇ = ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ। ਪਾਈਐ = ਮਿਲ ਪੈਂਦਾ ਹੈ। ਸਖੀਏ = ਹੇ ਸਹੇਲੀਏ! ਮੋਹਿ = ਮੈਨੂੰ। ਮਤੇ = ਮਤਿ, ਉਪਦੇਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh compañeros, ¡déjenme saber cuando!"