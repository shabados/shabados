[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਹਰਿ ਸੇਵਿਆ; ਤਿਨਿ ਸੁਖੁ ਪਾਇਆ ॥"
page = 11
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who has served Thee, has obtained peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਤੇਰੀ ਟਹਿਲ ਕਮਾਈ ਹੈ, ਉਸ ਨੂੰ ਆਰਾਮ ਪ੍ਰਾਪਤ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who serve You find peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰਿ! ਜਿਸ ਨੇ ਇਸ ਭਾਂਤਿ ਆਪ ਕੋ ਸੇਵਨ ਕੀਆ ਹੈ, ਤਿਸੀ ਨੇ ਸੁਖ ਰੂਪੁ ਆਤਮ ਪਦ ਕੋ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਮਨੁੱਖ ਨੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਿਆ ਹੈ, ਉਸ ਨੇ ਸੁਖ ਹਾਸਲ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que Te ha servido, ha obtenido la Paz"