[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਨੁ ਸੂਚਾ ਸੋ ਆਖੀਐ; ਜਿਸੁ ਮਹਿ ਸਾਚਾ ਨਾਉ ॥"
page = 19
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That body where in abides the True Name, is said to be pure."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇਹ ਅੰਦਰ ਸਤਿਨਾਮ ਵਸਦਾ ਹੈ, ਉਹ ਪਵਿੱਤਰ ਕਹੀ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That body is said to be pure, in which the True Name abides."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਹਿ ਸਚਾ ਨਾਮੁ ਜਪੀਤਾ ਹੈ, ਸੋ ਸਰੀਰੁ (ਸੂਚਾ) ਪਵਿਤ੍ਰ ਕਹੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸਰੀਰ ਵਿਚ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ ਉਹੀ ਸਰੀਰ ਪਵਿਤ੍ਰ ਅਖਵਾ ਸਕਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੂਚਾ = ਸੁੱਚਾ, ਪਵਿੱਤਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ese cuerpo, en el que habita el Nombre Verdadero, se dice que es puro."