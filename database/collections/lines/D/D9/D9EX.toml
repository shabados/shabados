[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭੁ ਆਤਮ ਰਾਮੁ ਪਛਾਣਿਆ; ਭਉਜਲੁ ਤਰਿ ਗਇਆ ॥"
page = 790
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Recognising the Pervading soul contained everywhere one crosses the dreadful world-ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਆਪਕ ਰੂਹ ਨੂੰ ਹਰ ਥਾਂ ਰਮੀ ਹੋਈ ਸਿੰਞਾਣ ਕੇ, ਇਨਸਾਨ ਭਿਆਨਕ ਸੰਸਾਰ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Recognizing that the Supreme Soul is everywhere, he crosses over the terrifying world-ocean."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਹੀ ਅਪਣਾ ਆਪ ਹੀ ਪਛਾਣਿਆ ਹੈ, ਇਸੀ ਤੇ ਗੁਰਮੁਖ (ਭਉਜਲੁ) ਸੰਸਾਰ ਸਮੁੰਦਰ ਸੇ ਤਰ ਗਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖ ਹਰ ਥਾਂ ਪਰਮਾਤਮਾ ਨੂੰ ਹੀ ਪਛਾਣਦਾ ਹੈ ਤੇ ਇਸ ਤਰ੍ਹਾਂ ਇਸ ਸੰਸਾਰ ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਲੰਘ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭੁ = ਹਰ ਥਾਂ। ਭਉਜਲੁ = ਸੰਸਾਰ-ਸਮੁੰਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así uno conoce al Señor y atraviesa el mar de la existencia."