[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸਚਾ ਪੰਥੁ ਹੈ; ਸਿਖੁ ਸਹਜ ਘਰਿ ਜਾਇ ਖਲੋਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The way of gurmukhs is that way of truth treading which, the Sikh automatically stabilizes in his innate nature."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾਂ ਦਾ ਸੱਚਾ ਰਸਤਾ ਹੈ, (ਕਿਉਂ ਜੋ, ਜੇਹੜਾ) ਸਿਖ (ਇਸ ਰਸਤੇ ਚਲਦਾ ਹੈ) ਓਹ 'ਸਹਜ ਘਰ' (ਪਰਮਾਤਮਾਂ ਵਿਖੇ) ਜਾ ਪ੍ਰਾਪਤ ਹੁੰਦਾ ਹੈ।"