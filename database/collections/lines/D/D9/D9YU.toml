[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਈ ਮੇਰਾ ਸੁਆਮੀ ਕਰਨੈਹਾਰੁ ॥"
page = 1152
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone is my Creator-Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਮੇਰਾ ਸਿਰਜਣਹਾਰ-ਮਾਲਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Creator, my Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸ੍ਰਿਸ੍ਟੀ ਕਾ ਕਰਨੇਹਾਰਾ ਹੈ, ਸੋਈ ਮੇਰਾ ਸੁਆਮੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਉਹ ਮਾਲਕ ਆਪ ਹੀ ਸਭ ਕੁਝ ਕਰਨ ਦੇ ਸਮਰੱਥ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਨੈਹਾਰੁ = ਸਭ ਕੁਝ ਕਰਨ ਜੋਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo Tú eres mi Maestro, mi Señor Creador"