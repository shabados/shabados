[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਜਪਤ; ਹੋਵਤ ਨਿਹਾਲ ॥੧॥"
page = 1181
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Uttering the Name, one is overjoyed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਨਾਮ ਨੂੰ ਉਚਾਰ ਕੇ ਪ੍ਰਾਣੀ ਪਰਮ ਪ੍ਰਸੰਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chanting the Naam, the Name of the Lord, we are uplifted and exalted. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੇਰੇ ਨਾਮ ਕੋ ਜਪਤੇ ਹੈਂ, ਸੋ ਨਿਹਾਲ ਹੋਤੇ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਨਾਮ ਜਪਦਿਆਂ ਜੀਵ ਪ੍ਰਸੰਨ-ਚਿੱਤ ਹੋ ਜਾਂਦੇ ਹਨ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਹਾਲ = ਪ੍ਰਸੰਨ-ਚਿੱਤ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y eres Tú Quien emancipó a todo aquél que meditó en Tu Nombre. (1)"