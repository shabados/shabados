[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਜੋੜਿ. ਵਿਛੋੜੇ ਆਪੇ ॥"
page = 1045
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself unites and Himself separates."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਆਪ ਜੋੜਦਾ ਹੈ ਅਤੇ ਆਪ ਹੀ ਵਿਛੋੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself unites, and He Himself separates."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਜੋੜਤਾ ਹੈ ਪੁਨਾ ਆਪ ਹੀ ਵਿਛੋੜਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਆਪ ਹੀ (ਜੀਵਾਂ ਨੂੰ) ਜੋੜ ਕੇ (ਇਥੇ ਪਰਵਾਰਾਂ ਵਿਚ ਇਕੱਠੇ ਕਰ ਕੇ) ਆਪ ਹੀ (ਇਹਨਾਂ ਨੂੰ ਆਪੋ ਵਿਚੋਂ) ਵਿਛੋੜ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor del Universo, desde Sí Mismo, une y también separa,"