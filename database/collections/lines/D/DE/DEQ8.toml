[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਉਣੁ ਜਾਣੈ. ਪੀਰ ਪਰਾਈ ॥"
page = 795
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who knows the pain of another?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੋਰਸ ਦੀ ਪੀੜ ਨੂੰ ਕੌਣ ਜਾਣਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who can know the pain of another?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ (ਪਰਾਈ) ਸਨਬੰਧੀ ਆਦਿਕੋਂ ਕੇ ਦੁਖੋਂ ਕੋ ਕੌਣ ਜਾਣੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਯਕੀਨ ਹੋ ਗਿਆ ਹੈ ਕਿ (ਪਰਮਾਤਮਾ ਤੋਂ ਬਿਨਾ) ਕੋਈ ਹੋਰ ਕਿਸੇ ਦੂਜੇ ਦਾ ਦੁੱਖ-ਦਰਦ ਸਮਝ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉਣੁ ਜਾਣੈ = ਹੋਰ ਕੋਈ ਨਹੀਂ ਜਾਣਦਾ। ਪੀਰ = ਪੀੜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y nadie conoce el dolor de mi corazón."