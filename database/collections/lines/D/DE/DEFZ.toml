[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਸਾ ਮਹਲਾ ੫ ਘਰੁ ੧੫ ਪੜਤਾਲ ॥"
page = 408
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Asa 5th Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਸਾ ਪੰਜਵੀਂ ਪਾਤਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Aasaa, Fifth Mehl, Fifteenth House, Partaal:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਆਸਾ, ਘਰ ੧੫ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਪੜਤਾਲ'।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੜਤਾਲ = ਜਿਥੇ ਤਾਲ ਮੁੜ ਮੁੜ ਪਰਤਦਾ (-ਪੜ) ਰਹੇ, ਬਦਲਦਾ ਰਹੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Asa, Mejl Guru Aryan, Quinto Canal Divino."