[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਤੁ ਸਤੁ ਸੰਜਮੁ; ਰਿਦੈ ਸਮਾਏ ॥"
page = 686
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In who's mind are enshrined chastity, righteousness and self-control,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਹਿਰਦੇ ਅੰਦਰ ਪਵਿੱਤਰਤਾ, ਸਚਾਈ ਅਤੇ ਸਵੈ-ਜ਼ਬਤ ਟਿੱਕ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chastity, purity and self-restraint are infused into the heart,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਿਦੇ ਮੇਂ ਜਤ, ਸਤ, ਸੰਜਮ, ਆਦੀ ਸ਼ੁਭ ਗੁਣ ਸਮਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਤ ਸਤ ਤੇ ਸੰਜਮ ਉਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ (ਸੁਤੇ ਹੀ) ਲੀਨ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En su interior se habrá edificado la Castidad, la Austeridad y el Autocontrol,"