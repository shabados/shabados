type = "primary"
data = "ਬੇਚਨ ਚਲਾ ਛਾਡਿ ਘਰ ਵਾਸਾ ॥"
page = 651

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He desired for more wealth day and night and he had left his home for selling his articles"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਲਈ ਸੌਦੇ ਨੂੰ) ਵੇਚਣ ਲਈ ਘਰ ਦਾ ਵਾਸਾ ਛਡ ਕੇ ਚਲਿਆ ਸੀ।"