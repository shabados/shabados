[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਪਰਪੰਚੁ ਜਗਤ ਕਉ ਡਹਕੈ; ਅਪਨੋ ਉਦਰੁ ਭਰੈ ॥੧॥"
page = 536
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By exercising fraud it hood winks the world and fills its belly."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਠੱਗੀ ਠੋਰੀ ਰੱਚ ਕੇ ਉਹ ਸੰਸਾਰ ਨੂੰ ਛੱਲਦਾ ਹੈ ਅਤੇ ਆਪਣਾ ਢਿੱਡ ਭਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Practicing deception, it tries to cheat the world, and so it fills its belly. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਪਰਪੰਚੁ) ਛਲ ਕਰ ਕੇ ਸੰਸਾਰ ਕੋ (ਡਹਕੈ) ਭਰਮਾਉਤਾ ਹੈ ਔਰ ਅਪੁਨਾ ਉਦਰ ਪੂਰਨਾ ਕਰਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਿਖਾਵਾ ਕਰ ਕੇ ਦੁਨੀਆ ਨੂੰ ਠੱਗਦਾ ਰਹਿੰਦਾ ਹੈ, ਤੇ, (ਠੱਗੀ ਨਾਲ ਇਕੱਠੇ ਕੀਤੇ ਧਨ ਦੀ ਰਾਹੀਂ) ਆਪਣਾ ਪੇਟ ਭਰਦਾ ਰਹਿੰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਪੰਚੁ = ਵਿਖਾਵਾ, ਠੱਗੀ। ਕਉ = ਨੂੰ। ਡਹਕੈ = ਠੱਗਦਾ ਹੈ, ਛਲ ਰਿਹਾ ਹੈ। ਉਦਰੁ = ਪੇਟ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "deambula perdido en el mundo, engañado y tratando sólo de llenar su estómago. (1)"