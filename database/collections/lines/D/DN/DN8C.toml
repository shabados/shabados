[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਖ਼ਾਕ ਸ਼ੌ ਮਰਦਾਨਿ ਹੱਕ ਰਾ ਖ਼ਾਕ ਬਾਸ਼ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "You should become and act like dust, i.e., be humble, and become the dust of the passage of the holy men,"