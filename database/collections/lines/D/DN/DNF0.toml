data = "ਕਉਣੁ ਮਰੈ; ਕਉਣੁ ਰੋਵੈ ਓਹੀ ॥"
page = 413
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "who dies and who does weep for him?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੌਣ ਮਰਦਾ ਹੈ ਅਤੇ ਕਿਹੜਾ ਉਸ ਨੂੰ ਰੌਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who dies, and who weeps for him?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਰੂਪ ਮੇਂ ਪ੍ਰਾਪਤ ਹੂਏ ਹੈਂ ਉਨ ਕਾ ਨਿਸਚਯ ਕਹਤੇ ਹੈਂ: ਕੌਨ ਮਰਤਾ ਹੈ ਔਰ (ਓਹੀ) ਉਹਿ ਉਹਿ ਕਹ ਕਰ ਰੋਤਾ ਕੌਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੌਣ ਮਰਦਾ ਹੈ, ਤੇ ਕੌਣ (ਮਰੇ ਨੂੰ) 'ਉਹ, ਉਹ' ਆਖ ਕੇ ਰੋਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਹੀ = 'ਉਹ, ਉਹ' ਆਖ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Quién muere? ¿Por quién lloramos,"