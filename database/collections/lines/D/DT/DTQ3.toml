[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਮੋਹਿਆ; ਟੇਢਉ ਜਾਤ ॥੧॥"
page = 892
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Bewitched by riches, he walks on the crooked path."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨ-ਦੌਲਤ ਦਾ ਮੋਹਿਆ ਹੋਇਆ ਉਹ ਵਿੰਗੇ ਰਾਹੇ ਤੁਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Enticed by Maya, he takes the crooked path. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਾਯਾ ਕੇ ਮੋਹੇ ਹੂਏ! ਤੂੰ ਗੁਰੂ ਸਾਸਤ੍ਰ ਸੇ ਟੇਢਾ ਹੀ ਜਾਤਾ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਫਸਿਆ ਹੋਇਆ (ਸਾਕਤ) ਆਕੜ ਆਕੜ ਕੇ ਤੁਰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਟੇਢਉ = ਵਿੰਗਾ, ਆਕੜ ਆਕੜ ਕੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Embrujado por Maya, uno no camina por el Sendero Verdadero. (1)"