[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਉਪਜਿਯੋ ਸੋ ਬਿਨਸਿ ਹੈ; ਜਗ ਰਹਿਬੋ ਦਿਨ ਚਾਰਿ ॥"
page = 906

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Listening such talks, Rani became unconscious,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਵਿਚ ਚਾਰ ਦਿਨ ਦਾ ਰਹਿਣਾ ਹੈ, ਜੋ ਵੀ ਪੈਦਾ ਹੋਇਆ ਹੈ, ਉਸ ਨੇ ਨਸ਼ਟ ਹੋਣਾ ਹੈ।"