[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਦੇਖਾ; ਤਬ ਗਾਵਾ ॥"
page = 656
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When I see my Lord, then sing I His praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਮੈਂ ਸੁਆਮੀ ਨੂੰ ਵੇਖਦਾ ਹਾਂ, ਤਦ ਮੈਂ ਉਸ ਦੀ ਮਹਿਮਾ ਗਾਇਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When I see Him, I sing His Praises."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਉਪਦੇਸ ਸੇ ਜਬ ਮੈਨੇ ਪਰਮੇਸ਼੍ਵਰ ਕੇ ਜਸ ਕੋ ਗਾਇਨ ਕੀਆ ਤਬ ਤਿਸ ਕੇ ਸਰੂਪ ਕੋ ਮੈਨੇ ਦੇਖਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੁਣ ਸ਼ਬਦ ਦੀ ਬਰਕਤਿ ਦਾ ਸਦਕਾ) ਜਿਉਂ ਜਿਉਂ ਮੈਂ ਪਰਮਾਤਮਾ ਦਾ (ਹਰ ਥਾਂ) ਦੀਦਾਰ ਕਰਦਾ ਹਾਂ ਮੈਂ (ਆਪ-ਮੁਹਾਰਾ) ਉਸ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਖਾ = ਦੇਖਾਂ, ਵੇਖਦਾ ਹਾਂ; ਪ੍ਰਭੂ ਦਾ ਦੀਦਾਰ ਕਰਦਾ ਹਾਂ। ਗਾਵਾ = ਗਾਵਾਂ, ਮੈਂ (ਉਸ ਦੇ ਗੁਣ) ਗਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando veo a mi Señor, canto Su Alabanza;"