[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਿਲ ਖਾਇ ਤਉ ਖੋਵੈ ਜਨਮ ਜਗੰ ॥"
page = 153

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "If we eat in his company, then we lose our birth in the world"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜੇ ਉਸ ਨਾਲ) ਮਿਲ ਕੇ (ਭੋਜਨ) ਖਾਈਏ ਤਾਂ ਜਗਤ ਵਿਚ ਜਨਮ ਭ੍ਰਸ਼ਟ ਹੁੰਦਾ ਹੈ।"