[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਮੑ ਸਾਚੁ ਧਿਆਵਹੁ; ਮੁਗਧ ਮਨਾ ॥"
page = 1176
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Contemplate thou the True Lord, O my silly soul."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੱਚੇ ਸਾਈਂ ਦਾ ਸਿਮਰਨ ਕਰ, ਹੇ ਮੇਰੀ ਮੂਰਖ ਜਿੰਦੜੀਏ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So meditate on the True Lord, O my foolish mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੂਰਖ ਮਨ! ਤੂੰ ਸਾਚੇ ਪਰਮੇਸ੍ਵਰ ਕਾ ਧ੍ਯਾਨੁ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਮੂਰਖ ਮਨ! ਤੂੰ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਨੂੰ ਸਿਮਰਿਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚੁ = ਸਦਾ-ਥਿਰ ਹਰਿ-ਨਾਮ। ਮੁਗਧ ਮਨਾ = ਹੇ ਮੂਰਖ ਮਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente ignorante,"