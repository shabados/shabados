data = "ਹੈ ਗੈ ਪਤਿ ਦੀਏ ਰਥ ਨਾਨਾ ॥੨॥੬੬॥"
page = 105

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And also many gifts like horses, elephants and chariots.2.66."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਘੋੜਿਆਂ, ਹਾਥੀਆਂ ਅਤੇ ਅਨੇਕ ਤਰ੍ਹਾਂ ਦੇ ਰਥਾਂ ਨਾਲ ਸੁਸਜਿਤ ਕੀਤਾ ॥੨॥੬੬॥"