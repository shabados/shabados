[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਸਾਬੁਨਿ; ਕਾਪਰ ਊਜਲ ਹੋਤ ॥"
page = 914
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the soap cleanses the cloth;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਸਾਬਣ ਕੱਪੜੇ ਨੂੰ ਸਾਫ ਸੁਥਰਾ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As cloth is cleaned by soap,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਸਾਬਨ ਕਰ ਕੇ ਕਪੜੇ ਉਜਲ ਹੋਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਸਾਬਣ ਨਾਲ ਕੱਪੜੇ ਸਾਫ਼-ਸੁਥਰੇ ਹੋ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਬੁਨ = ਸਾਬਣ ਨਾਲ। ਕਾਪਰ = ਕੱਪੜੇ। ਊਜਲ = ਸਾਫ਼-ਸੁਥਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como el jabón limpia la mugre,"