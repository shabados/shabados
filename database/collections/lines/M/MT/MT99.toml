[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੂਖੇ ਕਉ; ਦੇਵਤ ਅਧਾਰ ॥"
page = 283
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He gives food to the hungry."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਖੁਦਿਅਵੰਤ ਨੂੰ ਭੋਜਨ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He gives food to the hungry."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਭੂਖੇ ਕਉ ਭੋਜਨ ਆਦੀ ਆਧਾਰ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਭੁੱਖੇ ਨੂੰ ਭੀ ਆਸਰਾ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੂਖੇ = ਲਾਲਚੀ, ਤ੍ਰਿਸਨਾ-ਅਧੀਨ ਮਨੁੱਖ। ਅਧਾਰ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y alimenta a los hambrientos."