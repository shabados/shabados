[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਨਾਮਿ; ਜਿਨ ਪ੍ਰੀਤਿ ਪਿਆਰੁ ॥"
page = 1129
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who love the Lord's lovely Name;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਪ੍ਰਭੂ ਦੇ ਪਿਆਰੇ ਨਾਮ ਨਾਲ ਪ੍ਰੇਮ ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who love the Beloved Name of the Lord"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਮ ਨਾਮ ਮੇਂ ਜਿਨਿ ਪੁਰਸੋਂ ਕੀ ਤਨ ਮਨ ਕਰ ਕੇ ਪ੍ਰੀਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਿਚ ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਦੀ ਪ੍ਰੀਤ ਹੈ ਜਿਨ੍ਹਾਂ ਦਾ ਪਿਆਰ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਮ ਨਾਮਿ = ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los que se han apegado al Bienamado Nombre de Dios,"