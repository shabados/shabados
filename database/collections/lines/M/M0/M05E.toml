data = "ਚਾਰੇ ਵੇਦ ਚਾਰੇ ਸੋਮੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the four Vedas, the four sources of creation,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚਾਰ ਬੇਦ ਔ ਚਾਰੇ ਖਾਂਣੀਆਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਚਾਰ ਵੇਦ, ਚਾਰ ਹੀ ਖਾਣੀਆਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਾਰੇ ਖਾਣੀ = ਚਾਰ ਹੀ ਖਾਣੀਆਂ, ਚਾਰੇ ਹੀ ਉਤਪੱਤੀ ਦੇ ਵਸੀਲੇ {ਅੰਡਜ, ਜੇਰਜ, ਉਤਭੁਜ, ਸੇਤਜ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a los cuatro Vedas y a las cuatro fuentes de la creación,"