[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਾਇ ਬ੍ਰਤੋਤਮ ਕੌ ਤਰੁਨੀ; ਤਨ ਸੋਕ ਨਿਵਾਰਿ ਅਸੋਕੁਪਜਾਯੋ ॥"
page = 970

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "After winning over the sage the woman eradicated her tribulations."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਉੱਤਮ ਬ੍ਰਤਧਾਰੀ ਨੂੰ ਪ੍ਰਾਪਤ ਕਰ ਕੇ ਇਸਤਰੀ ਨੇ ਦੁਖ ਨੂੰ ਤਿਆਗ ਕੇ ਆਨੰਦ ਪੈਦਾ ਕਰ ਲਿਆ।"