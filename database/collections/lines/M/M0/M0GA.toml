[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਿ ਚਸ਼ਮੇ ਅਜ਼ੋ ਹਰਦੁ ਆਹੂ ਤਰਾਸਤ ॥੩੪॥"
page = 1401

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Whose eyes are as beautiful as the ones of a she-deer.(34)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀਆਂ ਦੋਵੇਂ ਅੱਖਾਂ ਹਿਰਨ ਦੇ ਬੱਚੇ (ਵਾਂਗ ਸੁੰਦਰ) ਹਨ ॥੩੪॥"