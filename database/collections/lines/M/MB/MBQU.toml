[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗੁ ਸੂਹੀ ਛੰਤ ਮਹਲਾ ੧ ਘਰੁ ੪ ॥"
page = 765
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rag Suhi Chhant 1st Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗੁ ਸੂਹੀ ਛੰਦ ਪਹਿਲੀ ਪਾਤਿਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Soohee, Chhant, First Mehl, Fourth House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਸੂਹੀ, ਘਰ ੪ ਵਿੱਚ ਗੁਰੂ ਨਾਨਕਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਛੰਤ' (ਛੰਦ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Suji, Chhant, Mejl Guru Nanak, Primer Canal Divino."