[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਗਤਿ ਕਰੇ; ਸੋ ਜਨੁ ਨਿਰਮਲੁ ਹੋਇ ॥"
page = 1173
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mortal who serves the Lord becomes pure,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਜੀਵ ਸੁਆਮੀ ਦੀ ਸੇਵਾ ਕਰਦਾ ਹੈ, ਉਹ ਪਵਿੱਤਰ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That humble being who worships the Lord with devotion becomes immaculate and pure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਭਗਤੀ ਕਰਤਾ ਹੈ, ਸੋ ਪੁਰਸ ਨਿਰਮਲ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਮਨੁੱਖ ਪਰਮਾਤਮਾ ਦੀ ਭਗਤੀ ਕਰਦਾ ਹੈ, ਉਹ ਮਨੁੱਖ ਪਵਿੱਤਰ ਜੀਵਨ ਵਾਲਾ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਮਲੁ = ਪਵਿੱਤਰ ਜੀਵਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El que es Devoto de Dios se vuelve Puro e Inmaculado"