[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੋਹਿ ਬਿਆਪਹਿ; ਮਾਇਆ ਜਾਲਿ ॥"
page = 266
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he who is entangles in the net of mammon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਧਨ-ਦੌਲਤ ਅਤੇ ਸੰਸਾਰੀ ਮਮਤਾ ਦੀ ਕੁੜਿੱਕੀ ਅੰਦਰ ਫਾਬਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "if you are entangled in emotional attachment and the net of Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਮਾਇਆ ਕੇ ਮੋਹਿ ਕਾ ਜਾਲ ਜੋ ਜੀਵ ਕੌ ਵਿਆਪ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਤੋਂ) ਬਚ ਨਹੀਂ ਸਕਦਾ, (ਸਗੋਂ) ਜੀਵ ਮਾਇਆ ਦੇ ਜਾਲ ਵਿਚ ਤੇ ਮੋਹ ਵਿਚ ਫਸਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਿ = ਮੋਹ ਵਿਚ। ਬਿਆਪਹਿ = ਫਸ ਜਾਂਦੇ ਹਨ। ਜਾਲਿ = ਜਾਲ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero no por ello se librará del cautiverio de la dualidad"