[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੂਧੁ ਪੀਆਇ; ਭਗਤੁ ਘਰਿ ਗਇਆ ॥"
page = 1163
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Making the Lord drink the milk, the devotee returned home,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੂੰ ਦੁਧ ਪਿਲਾ ਕੇ, ਸ਼ਰਧਾਲੂ ਘਰ ਨੂੰ ਮੁੜ ਆਇਆ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord drank the milk, and the devotee returned home."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਠਾਕੁਰ ਜੀ ਕੋ ਦੂਧ ਪੀਆਇ ਕਰ ਭਗਤੁ ਅਪਨੇ ਗ੍ਰਹ ਕੋ ਜਾਤਾ ਭ੍ਯਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੋਬਿੰਦ ਰਾਇ ਨੂੰ) ਦੁੱਧ ਪਿਆਲ ਕੇ ਭਗਤ (ਨਾਮਦੇਵ) ਸ੍ਵੈ-ਸਰੂਪ ਵਿਚ ਟਿਕ ਗਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਰਿ = ਘਰ ਵਿਚ। ਘਰਿ ਗਇਆ = ਘਰ ਵਿਚ ਗਇਆ, ਸ੍ਵੈ-ਸਰੂਪ ਵਿਚ ਟਿਕ ਗਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y mira, Dios Mismo bebió la leche de mis manos y después fui a mi aposento."