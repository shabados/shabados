[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਡੋ ਨਿਲਾਜੁ; ਅਜਹੂ. ਨਹੀ ਹਾਰਿਓ ॥੫॥"
page = 710
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am every shameless, for, even now, I grow not weary of their company."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਵੱਡਾ ਬੇਸ਼ਰਮ ਹਾਂ। ਅਜੇ ਭੀ ਮੈਂ ਉਨ੍ਹਾਂ ਦੀ ਸੰਗਤ ਨਾਲੋਂ ਹੰਭਦਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am very shameless - even now, I am not tired of them. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਇਹ ਮਨ ਵਡਾ ਨਿਲਾਜ ਹੈ, ਅਜੇ ਤਕ ਇਨੋਂ ਕੀ ਤਰਫੋਂ ਹਾਰਿਆ ਨਹੀਂ ਹੈ, ਭਾਵ ਪੁਨਾ ਇਨੋਂ ਮੇਂ ਹੀ ਪ੍ਰਵਿਰਤ ਹੋਤਾ ਹੈ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਇਹ ਮਨ ਬੜਾ ਬੇ-ਸ਼ਰਮ ਹੈ, ਅਜੇ ਭੀ ਵਿਕਾਰਾਂ ਵਲੋਂ ਮੁੜਿਆ ਨਹੀਂ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero qué sinvergüenza soy que no los abandono. (5)"