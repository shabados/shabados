[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਮੇਰੇ ਭੂਲੇ; ਕਪਟੁ. ਨ ਕੀਜੈ ॥"
page = 656
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my mind, practise not guile even by mistake,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ ਭੁੱਲ ਕੇ ਭੀ ਛਲ ਫਰੇਬ ਨਾਂ ਕਮਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, do not practice deception, even inadvertently."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ ਭੂਲੇ ਹੂਏ! ਕਪਟ ਕੋ ਨਾ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਭੁੱਲੇ ਹੋਏ ਮਨ! (ਰੋਜ਼ੀ ਆਦਿਕ ਦੀ ਖ਼ਾਤਰ ਕਿਸੇ ਨਾਲ) ਧੋਖਾ ਫ਼ਰੇਬ ਨਾਹ ਕਰਿਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਪਟੁ = ਧੋਖਾ, ਠੱਗੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente desviada, no practiques el engaño, pues al final"