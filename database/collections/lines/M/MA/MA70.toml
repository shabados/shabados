assets = ["DGDG"]
type = "primary"
data = "ਜਾਇ ਭਵਾਨੀ ਭਵਨ ਉਚਰੈ ॥"
page = 917

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "What ever they wished for in their minds, they would go and express to Bhawani."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਭਵਾਨੀ ਦੇ ਮੰਦਿਰ ਵਿਚ ਜਾ ਕੇ ਪ੍ਰਗਟ ਕਰਦਾ।"