[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਾਵਤ ਭੀ ਬ੍ਰਿਖਭਾਨ ਸੁਤਾ; ਅਤਿ ਹੀ ਮਨ ਭੀਤਰ ਆਨੰਦ ਪਾਯੋ ॥"
page = 370

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Amorous play alongwith the gopis, Radha, with great joy in her mind, began to sing"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਨ ਵਿਚ ਅਤਿ ਅਧਿਕ ਆਨੰਦ ਪ੍ਰਾਪਤ ਕਰ ਕੇ ਰਾਧਾ (ਰਾਸ ਵਿਚ) ਗਾਉਣ ਲਗ ਪਈ।"