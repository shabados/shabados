[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਝ ਮੇਰੀ ਜੀਭ ਤੇ ਆਉਂਦਾ ਹੈ, ਉਹੀ ਗਨੀਮਤ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਹਰ ਚਿਹ ਆਇਦ ਬਰ ਜ਼ੁਬਾਂ ਈਂ ਮੁਗ਼ਤਨਮ ॥੪੪੪॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Whatever comes on my lips and tongue, I would consider that as a boon. (444)"