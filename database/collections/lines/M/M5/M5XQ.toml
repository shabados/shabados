[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਉ ਭੀ; ਮੇਰਾ ਮਨੁ. ਨ ਪਤੀਆਰਾ ॥"
page = 373
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "even then, my mind was not appeased."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਭੀ ਮੇਰਾ ਚਿੱਤ ਤ੍ਰਿਪਤਿ ਨਾਂ ਹੋਇਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "still, my mind was not satisfied."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਉ ਭੀ ਮੇਰਾ ਮਨੁ ਪਤਿਆਇਆ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਭੀ ਮੇਰਾ ਮਨ ਸੰਤੁਸ਼ਟ ਨਾਹ ਹੋਇਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤੀਆਰਾ = ਪਤੀਜਿਆ, ਸੰਤੁਸ਼ਟ ਹੋਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "añoro adornarme más."