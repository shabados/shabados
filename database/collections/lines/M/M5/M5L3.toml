[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੋਗੁ ਵਡੋ; ਕਿਉ. ਬਾਂਧਉ ਧੀਰਾ ॥"
page = 1189
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Acute is my malady. How shall I comfort myself?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਖਤ ਹੈ ਮੇਰੀ ਬੀਮਾਰੀ। ਮੈਂ ਧੀਰਜ ਕਿਸ ਤਰ੍ਹਾਂ ਕਰਾਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The disease is so deadly; how can I find the courage?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਗ੍ਯਾਨੁ ਵੱਡਾ ਭਾਰੀ ਰੋਗੁ ਹੈ ਇਸ ਤੇ ਧੀਰਜ ਕੈਸੇ ਬਾਂਧੋਂ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਚੰਚਲਤਾ ਦਾ ਇਹ) ਰੋਗ ਬਹੁਤ ਵੱਡਾ ਹੈ (ਇਸ ਦੇ ਹੁੰਦਿਆਂ) ਮੈਨੂੰ ਆਤਮਕ ਸ਼ਾਂਤੀ ਨਹੀਂ ਮਿਲਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੋਗੁ = (ਚੰਚਲਤਾ ਦਾ) ਰੋਗ। ਧੀਰਾ = ਧੀਰਜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mis males son intensos, oh ¿cómo podría confortarme?,"