data = "ਬਾਜ ਸਹਿਤ ਤਹ ਗੇ ਜਹ ਮਾਈ ॥"
page = 285

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Those who were unconscious, the boys raised them and reached the place alongwith the horses, where Sita was sitting"

[[content]]
