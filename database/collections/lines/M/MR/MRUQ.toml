[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਰ ਤ੍ਰਿਅ ਰਮਹਿ; ਬਕਹਿ ਸਾਧ ਨਿੰਦ ॥"
page = 298
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They enjoy another's women, speak ill of the saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਹੋਰਨਾਂ ਦੀਆਂ ਇਸਤਰੀਆਂ ਨੂੰ ਭੋਗਦੇ ਹਨ, ਸੰਤਾਂ ਦੀ ਬਦਖੋਈ ਬਕਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They commit adultery, slander the Saints,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਾਈ ਇਸਤ੍ਰੀਓਂ ਕੋ ਭੋਗਤੇ ਹੈਂ, ਸੰਤੋਂ ਕੀ ਨਿੰਦਾ ਬਕਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਦੇ ਸਿਮਰਨ ਤੋਂ ਖੁੰਝੇ ਹੋਏ ਮਨੁੱਖ) ਪਰਾਈਆਂ ਇਸਤ੍ਰੀਆਂ ਭੋਗਦੇ ਹਨ ਤੇ ਭਲੇ ਮਨੁੱਖਾਂ ਦੀ ਨਿੰਦਾ ਕਰਦੇ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰ = ਪਰਾਈ। ਤ੍ਰਿਅ = ਇਸਤ੍ਰੀਆਂ। ਰਮਹਿ = ਭੋਗਦੇ ਹਨ। ਬਕਹਿ = ਬੋਲਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "cometiendo adulterio, calumniando a los Santos,"