[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੀਤਲਾ ਠਾਕਿ ਰਹਾਈ ॥"
page = 627
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord has rid him of the small pox."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਨੇ ਚੀਚਕ ਨੂੰ ਵਰਜ ਕੇ ਹਟਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He healed him from the smallpox."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਸੀਤਲਾ ਰੋਕ ਰਖੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਬਾਲਕ ਹਰਗੋਬਿੰਦ ਤੋਂ ਪ੍ਰਭੂ ਨੇ ਆਪ ਹੀ) ਸੀਤਲਾ (ਚੇਚਕ) ਰੋਕ ਲਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਕਿ = ਰੋਕ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "curándolo de la viruela."