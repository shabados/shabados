[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੰਮਣੁ ਮਰਣੁ. ਨ ਚੁਕਈ; ਰੰਗੁ ਲਗਾ ਦੂਜੈ ਭਾਇ ॥"
page = 1414
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Their comings and going end not. They are imbued with the love for another."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੇ ਆਉਣੇ ਅਤੇ ਜਾਂਦੇ ਮੁਕਦੇ ਨਹੀਂ। ਉਨ੍ਹਾ ਨੂੰ ਹੋਰਸ ਦੀ ਪ੍ਰੀਤ ਦੀ ਰੰਗਤ ਚੜ੍ਹੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Their comings and goings in reincarnation do not end; they are imbued with the love of duality."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨੋਂ ਕਾ ਜੰਮਣਾ ਮਰਣਾ ਦੂਰ ਨਹੀਂ ਹੋਤਾ ਹੈ, ਕਿਉਂ ਕਿ ਤਿਨੋਂ ਕਾ ਦ੍ਵੈਤ ਭਾਵ ਸੇ (ਰੰਗੁ) ਪ੍ਰੇਮ ਲਗਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਤਨਾ ਚਿਰ ਜੀਵ ਦੀ) ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਪ੍ਰੀਤ ਲੱਗੀ ਹੋਈ ਹੈ (ਉਤਨਾ ਚਿਰ ਇਸ ਦਾ) ਜਨਮ ਮਰਨ ਦਾ ਗੇੜ ਮੁੱਕਦਾ ਨਹੀਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਚੁਕਈ = ਨਹੀਂ ਮੁੱਕਦਾ। ਰੰਗੁ = ਪਿਆਰ। ਦੂਜੈ ਭਾਇ = (ਪ੍ਰਭੂ ਨੂੰ ਭੁਲਾ ਕੇ) ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sus idas y venidas en reencarnaciones no terminan y se conservan imbuidos en el amor a la dualidad,"