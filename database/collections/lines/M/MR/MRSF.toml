[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖਸਮੁ ਵਿਸਾਰਹਿ; ਤੇ ਕਮਜਾਤਿ ॥"
page = 349
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Vile are they who forget their Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਧਮ (ਨੀਵੇ, ਮੰਦੇ) ਹਨ ਉਹ ਜੋ ਆਪਣੇ ਮਾਲਕ ਨੂੰ ਭੁਲਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who forget their Lord and Master are vile and despicable."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਐਸੇ ਕ੍ਰਿਪਾਲੂ ਸ੍ਵਾਮੀ ਕੋ ਬਿਸਾਰ ਦੇਤੇ ਹੈਂ ਵਹੁ ਕਮ ਜਾਤੀ ਕੇ ਹੈਂ, ਭਾਵ ਸੰਕਰ ਵਰਨ ਹੈਂ ਵਾ ਚੰਡਾਲ ਹੈਂ। ਕਿਉਂਕਿ ਜਾਤ ਪਦ ਬ੍ਰਹਮਣ, ਛਤ੍ਰੀ, ਵੈਸ, ਸੂਦ੍ਰ ਕਾ ਵਾਚਕ ਹੈ; ਇਤਰ ਸਭ ਕਮਜਾਤ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਬੰਦੇ ਭੈੜੇ ਅਸਲੇ ਵਾਲੇ (ਬਣ ਜਾਂਦੇ) ਹਨ ਜੋ ਐਸੇ ਖਸਮ-ਪ੍ਰਭੂ ਨੂੰ ਵਿਸਾਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਮਜਾਤਿ = ਭੈੜੀ ਜਾਤਿ ਵਾਲੀਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los que olvidan a su Señor y Maestro, son viles y despreciables."