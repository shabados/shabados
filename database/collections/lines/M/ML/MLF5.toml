[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਜਨਾ; ਸੁਨਹਿ ਸੁਭ ਬਚਨ ॥"
page = 294
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The holy man hears good words."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਰਮਾਤਮਾ ਸਰੇਸ਼ਟ ਬਚਨ ਬਿਲਾਸ ਸੁਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Saint hears words of goodness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨ ਸਭ ਬਚਨੋਂ ਕੋ ਸੁਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨ ਭਲੇ ਬਚਨ ਹੀ ਸੁਣਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਭ = ਚੰਗੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sólo escucha palabras de Bondad."