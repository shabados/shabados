type = "primary"
data = "ਹਰਿਯਾਬਾਦ ਏਕ ਤ੍ਰਿਯ ਗੁਨੀ ॥"
page = 864

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "This is a story, which we heard with our own ears. In Haryabad a woman used to live."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਹਰਿਯਾਬਾਦ ਵਿਚ ਇਕ ਗੁਣਵਾਨ ਇਸਤਰੀ ਸੀ।"