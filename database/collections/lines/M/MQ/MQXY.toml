[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੋਹਿ ਕਹੈ ਮੁਖ ਤੇ ਕਿ ਤੂ ਮੂੜ; ਮੈ ਮੂੜ, ਤੁਹੀ ਮਨ ਮੈ ਕਰਿ ਚੀਨੋ ॥"
page = 366

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“You are addressing me as a fool, but think for a while in your mind that, in fact, you are a fool"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਤੂੰ ਮੁਖ ਤੋਂ ਮੂਰਖ ਕਿਹਾ ਹੈ, (ਕੀ) 'ਮੈਂ ਮੂਰਖ ਹਾਂ', (ਇਸ ਗੱਲ ਨੂੰ ਖੁਦ) ਮਨ ਵਿਚ ਵਿਚਾਰ ਕਰ ਕੇ ਵੇਖ।"