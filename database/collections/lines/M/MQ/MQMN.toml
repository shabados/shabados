[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕੇ ਦੋਖੀ ਕਉ; ਡਾਨੁ ਲਾਗੈ ॥"
page = 280
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints' slanderer, is awarded punishment."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਦੇ ਨਿੰਦਕ ਨੂੰ ਸਜ਼ਾ ਮਿਲਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slanderer of the Saint shall be punished."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੇ ਦੋਸੀ ਕੌ ਜਮ ਰਾਜਾ ਕਾ ਡੰਡ ਲਗਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅੰਤ ਵੇਲੇ) ਸੰਤ ਦੇ ਨਿੰਦਕ ਨੂੰ (ਧਰਮਰਾਜ ਤੋਂ) ਸਜ਼ਾ ਮਿਲਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਡਾਨੁ = ਡੰਨ (ਧਰਮਰਾਜ ਦਾ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es castigado con dolores extremos"