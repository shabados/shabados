[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਖ ਮਾਇਆ ਲਖ ਮੋਹਿ ਮਿਲਿ; ਹੋਇ ਮੁਦਈ ਦਾਵਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Getting engrossed in millions types of infatuations people have manyfold claims (over each other)."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਲੱਖਾਂ ਮਾਇਆ, ਲਖਾਂ ਮੋਹਾਂ ਦੇ ਨਾਲ ਮੇਲ ਕਰ ਕੇ ਦਾਵੇਗੀਰ ਹੋਕੇ ਦਾਵੇ ਬੰਨ੍ਹਣੇ।"