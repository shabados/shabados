data = "ਸੁਤ ਸੰਪਤਿ; ਬਨਿਤਾ ਬਿਨੋਦ ॥"
page = 210
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sons, wealth, wife, joyful sports and revetments,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੁਤ੍ਰਾਂ, ਦੌਲਤ, ਪਤਨੀ, ਖੁਸ਼ੀ ਭਰੀਆਂ ਖੇਡਾਂ ਨੂੰ"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many have renounced and left their children,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਤ੍ਰ ਔਰ ਬਿਭੂਤੀ ਤਥਾ ਇਸਤ੍ਰੀਓਂ ਕਾ ਬਿਲਾਸ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪੁੱਤਰ, ਧਨ, ਪਦਾਰਥ, ਇਸਤ੍ਰੀ ਦੇ ਲਾਡ-ਪਿਆਰ-ਅਨੇਕਾਂ ਲੋਕ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਤ = ਪੁੱਤਰ। ਸੰਪਤਿ = ਧਨ-ਪਦਾਰਥ। ਬਿਨੋਦ = ਲਾਡ-ਪਿਆਰ। ਬਨਿਤਾ = ਇਸਤ੍ਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Al final, todos tienen que abandonar sus riquezas,"