[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸਹਿ ਅਰਾਧਿ; ਸਦਾ ਸੁਖੁ ਹੋਇ ॥੧॥"
page = 896
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Contemplating Him, thou shalt be ever at peace,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ, ਤੂੰ ਸਦੀਵੀ ਆਰਾਮ ਪਾ ਲਵੇਗਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Worship and adore Him, and you shall be at peace forever. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੋ ਹੀ ਤੂੰ  ਯਾਦ ਕਰਿ, ਇਸ ਤੇ ਤੇਰੇ ਕੋ ਅਚੁਤ ਸੁਖ ਹੋਵੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪ੍ਰਭੂ ਦਾ ਸਿਮਰਨ ਕੀਤਿਆਂ ਸਦਾ ਆਤਮਕ ਸੁਖ ਮਿਲਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਰਾਧਿ = ਯਾਦ ਕਰਦਾ ਰਹੁ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así que habita en Él y vive en Paz.(1)"