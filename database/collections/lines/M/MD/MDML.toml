[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੁ ਸੰਜਮੁ ਸਤਿਗੁਰੂ ਦੁਆਰੈ ॥"
page = 1057
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Truth and self-control man obtains from the True Guru's door."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚ ਅਤੇ ਸਵੈ-ਜ਼ਬਤ ਇਨਸਾਨ ਨੂੰ ਸੱਚੇ ਗੁਰਾਂ ਦੇ ਬੂਹੇ ਤੋਂ ਪ੍ਰਾਪਤ ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Truth and self-control are found through the Door of the True Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚ ਬੋਲਣਾ ਤਥਾ ਇੰਦ੍ਰਯੋਂ ਕਾ ਰੋਕਣਾ ਸਤਿਗੁਰੋਂ ਦੁਆਰੇ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਿਕਾਰਾਂ ਤੋਂ ਬਚਣ ਦਾ ਪੱਕਾ ਪ੍ਰਬੰਧ ਗੁਰੂ ਦੇ ਦਰ ਤੇ (ਪ੍ਰਾਪਤ ਹੁੰਦਾ ਹੈ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਜਮੁ = ਪਰਹੇਜ਼, ਵਿਕਾਰਾਂ ਤੋਂ ਬਚੇ ਰਹਿਣ ਦਾ ਉੱਦਮ। ਸਚੁ = ਪੱਕਾ, ਸਦਾ-ਥਿਰ। ਦੁਆਰੈ = ਦਰ ਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es a través del Guru que uno es bendecido con la Verdad y el Auto Control,"