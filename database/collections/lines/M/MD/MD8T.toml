[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਜ੍ਰਯੰ ਕੁਤਿਸਿਤੰ ਕਰਮੰ ਭਜਿਤੰ; ਤਜਤੰ ਨ ਲਜਾ ॥"
page = 558

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "People will bedeck themselves with wicked deeds and even forsake their shame, though exhibiting it"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਾਪ ਕਰਮਾਂ ਨਾਲ ਆਪਣੇ ਆਪ ਨੂੰ ਸੁਸਜਿਤ ਕਰਨ ਤੇ ਲਾਜ ਨੂੰ ਨਹੀਂ ਤਿਆਗਣਗੇ।"