[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੁਰਤ ਖਾਟ ਤੇ ਪਕਰਿ ਪਛਾਰਿਯੋ ॥"
page = 996

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When he was sleeping, she jumped over and swiftly turned over his bed."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤਾਂ ਉਸ ਨੂੰ) ਮੰਜੇ ਤੋਂ ਪਕੜ ਕੇ ਹੇਠਾਂ ਸੁਟ ਦਿੱਤਾ।"