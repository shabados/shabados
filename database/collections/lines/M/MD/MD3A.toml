[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਬਖਸੇ. ਦੇਇ ਪਿਆਰੁ ॥"
page = 1278
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of Himself, the Lord forgives and blesses with His love."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੁਦ ਹੀ ਪ੍ਰਭੂ ਮਾਫੀ ਦਿੰਦਾ ਹੈ ਅਤੇ ਆਪਣੀ ਪ੍ਰੀਤ ਪਰਦਾਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God Himself forgives, and bestows His Love."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਆਪੇ ਬਖਸਤਾ ਹੈ ਔਰ ਅਪਣਾ ਪਿਆਰ ਦੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਮਨੁੱਖ ਉਤੇ ਪ੍ਰਭੂ) ਆਪ ਹੀ ਬਖ਼ਸ਼ਸ਼ ਕਰਦਾ ਹੈ, (ਉਸ ਨੂੰ ਆਪਣੇ) ਪਿਆਰ (ਦੀ ਦਾਤ) ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੇ = ਆਪ ਹੀ। ਬਖਸੇ = ਬਖ਼ਸ਼ਸ਼ ਕਰਦਾ ਹੈ। ਦੇਇ = ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios Mismo perdona y otorga Su Amor."