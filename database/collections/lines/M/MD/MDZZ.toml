[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਖਹੁ ਅਚਰਜੁ ਭਇਆ ॥"
page = 612
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lo, a wondrous thing has happened."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵੇਖੋ! ਇਕ ਅਸਚਰਜ ਗੱਲ ਹੋ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Behold, a wondrous miracle has happened!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤੁਮ ਦੇਖੋ ਕੈਸਾ ਅਸਚਰਜ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਵੇਖੋ (ਮੇਰੇ ਅੰਦਰ) ਇਕ ਅਨੋਖਾ ਕੌਤਕ ਵਰਤਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਚਰਜੁ = ਅਨੋਖਾ ਤਮਾਸ਼ਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mira qué espectáculo tan maravilloso, que el Maestro, Cuyo Conocimiento es Insondable,"