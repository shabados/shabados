[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਿਰਲੇ; ਕਰਮਿ ਪਰਾਪਤਿ ਹੋਇ ॥"
page = 361
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some solitary one becomes the recipient of Lord's grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਟਾਂਵਾਂ ਟੱਲਾ ਹੀ ਸੁਆਮੀ ਦੀ ਰਹਿਮਤ ਦਾ ਪਾਤਰ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How rare are those who receive the Lord's Grace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਕਿਸੀ ਬਿਰਲੇ ਕੋ ਏਹ ਪਦ ਹਰੀ ਕ੍ਰਿਪਾ ਤੇ ਪ੍ਰਾਪਤ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਵਿਰਲੇ ਨੂੰ ਪਰਮਾਤਮਾ ਦੀ ਮੇਹਰ ਨਾਲ (ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ) ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਮਿ = ਮੇਹਰ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, escasos son los Bendecidos por la Gracia de Dios."