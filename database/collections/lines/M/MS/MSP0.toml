[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦਿਨੁ; ਏਕੋ ਨਾਮੁ ਵਖਾਣੈ ॥"
page = 1261
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day, he utters the One Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੈਣ ਅਤੇ ਦਿਨ ਉਹ ਇਕ ਨਾਮ ਦਾ ਹੀ ਜਾਪ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, he chants the Name of the One Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਨਾਮ ਕੋ (ਅਨਦਿਨੁ) ਨਿਰੰਤ੍ਰ ਹੀ ਉਚਾਰਨ ਕਰੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਹਰ ਵੇਲੇ ਸਿਰਫ਼ ਹਰਿ-ਨਾਮ ਹੀ ਜਪਦਾ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਦਿਨੁ = (अनुदिनं) ਹਰ ਰੋਜ਼, ਹਰ ਵੇਲੇ। ਵਖਾਣੈ = ਉਚਾਰਦਾ ਹੈ, ਜਪਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y día y noche entone el Nombre del Señor."