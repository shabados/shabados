data = "ਦੇਵਤਿਆਂ ਦੇ ਦਲ ਪ੍ਰਸੰਨ ਹੋ ਗਏ ਅਤੇ ਫੁੱਲਾਂ ਦੀ ਬਰਖਾ ਕਰਨ ਲੱਗੇ,"