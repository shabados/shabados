[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੁ ਤੁਈ. ਏਕੁ ਤੁਈ ॥੪॥"
page = 144
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou alone art, O Lord! Thou alone art."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤੂੰ ਹੀ ਹੈਂ, ਹੇ ਸੁਆਮੀ! ਕੇਵਲ ਤੂੰ ਹੀ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You alone, Lord, You alone. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੀਨੋ ਕਾਲ ਮੇਂ ਏਕ ਤੂੰਹੀ ਹੈਂ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਦਾ ਰਹਿਣ ਵਾਲਾ, ਹੇ ਪ੍ਰਭੂ!) ਇਕ ਤੂੰ ਹੀ ਹੈਂ, ਇਕ ਤੂੰ ਹੀ ਹੈਂ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Es, sí, Él, el Uno.  (4)"