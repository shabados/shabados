[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਸੇਵਿ; ਦੇਖਹੁ ਪ੍ਰਭੁ ਨੈਨੀ ॥੧॥ ਰਹਾਉ ॥"
page = 416
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By serving the True Guru, thou shalt see the Lord with thine eyes. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਟਹਿਲ ਕਮਾਊਣ ਦੁਆਰਾ ਤੂੰ ਆਪਣੀਆਂ ਅੱਖਾਂ ਨਾਲ ਸਾਹਿਬ ਨੂੰ ਵੇਖ ਲਵੇਗੀ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serving the True Guru, you shall behold God with your eyes. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਗੁਰੂ ਕੀ ਸੇਵਾ ਕਰ ਕੇ ਨੇਤ੍ਰੋਂ ਸੇ ਪ੍ਰਭੂ ਕਾ ਦਰਸਨ ਕਰਹੁ॥੧॥ ਰਹਾਉ ॥☬ਜੇ ਕਹੇ ਜੀਤ ਕੋ ਕੌਨ ਸੇ ਬੰਧਨ ਹੈਂ? ਤਿਸ ਪਰ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਦੱਸੀ ਹੋਈ (ਇਹ) ਸੇਵਾ ਕਰ ਕੇ (ਭਾਵ, ਗੁਰੂ ਦੀ ਸਿੱਖਿਆ ਅਨੁਸਾਰ ਪ੍ਰਭੂ ਦਾ ਭਜਨ ਕਰ ਕੇ) ਤੁਸੀ (ਹਰ ਥਾਂ) ਪਰਮਾਤਮਾ ਦਾ ਦਰਸ਼ਨ ਕਰੋਗੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੈਨੀ = ਅੱਖਾਂ ਨਾਲ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "habita en tu Señor, y sirve al Verdadero Guru y así verás a tu Señor con tus propios ojos. (1‑Pausa)"