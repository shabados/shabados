[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੈ ਸਹ ਨਾਲਹੁ. ਮੁਤੀਅਸੁ; ਦੁਖਾ ਕੂੰ ਧਰੀਆਸੁ ਜੀਉ ॥"
page = 762
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Separating form Thee, O spouse, she has amassed pain for herself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਨਾਲੋਂ ਵਿਛੜ ਕੇ, ਹੇ ਪਤੀ! ਉਸ ਨੇ ਆਪਣੇ ਲਈ ਤਕਲੀਫਾਂ ਨੂੰ ਇਕੱਤਰ ਕਰ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "She separated herself from her Husband Lord, and now she suffers in pain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਹੇ (ਸਹ) ਪਤੀ! ਤੇਰੇ ਸਾਥ ਸੇ ਵਿਛੜ ਗਈ, ਇਸੀ ਸੇ ਦੁਖੋਂ ਕੋ ਧਾਰਤੀ ਭਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਤੀ! ਮੈਂ ਤੇਰੇ ਨਾਲੋਂ ਵਿਛੁੜੀ ਹੋਈ ਹਾਂ, ਮੈਂ ਨਿਰੇ ਦੁੱਖ ਹੀ ਦੁੱਖ ਸਹੇੜੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹ = ਹੇ ਪਤੀ! ਤੇ ਨਾਲਹੁ = ਤੇਰੇ ਨਾਲੋਂ। ਮੁਤੀਅਸੁ = ਮੈਂ ਵਿਛੁੜ ਗਈ ਹਾਂ। ਕੂੰ = ਨੂੰ। ਧਰੀਆਸੁ = ਧਾਰਨ ਕਰ ਲਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "viví separado de Ti, y ahora mi único refugio es el dolor"