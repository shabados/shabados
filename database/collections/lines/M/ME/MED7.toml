[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੁ ਅਚਰਜੁ; ਜਨ ਦੇਖਹੁ ਭਾਈ ॥"
page = 663
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O people, my brethren, see a strange thing,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਲੋਕੋ! ਮੇਰੇ ਭਰਾਓ! ਇਕ ਅਸਚਰਨ ਗੱਲ ਵੇਲੋ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my humble Siblings of Destiny, behold this strange and wonderful thing:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ ਜਨੋਂ! ਏਕ ਅਸਚਰਜ ਦੇਖੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ ਜਨੋ! ਇਕ ਹੈਰਾਨ ਕਰਨ ਵਾਲਾ ਤਮਾਸ਼ਾ ਵੇਖੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਚਰਜੁ = ਹੈਰਾਨ ਕਰਨ ਵਾਲਾ ਤਮਾਸ਼ਾ। ਜਨ = ਹੇ ਜਨੋ! ਭਾਈ = ਹੇ ਭਾਈ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sientan la maravilla de todo esto, oh amigos,"