[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਗਦਿ ਕਲਮ; ਨ ਲਿਖਣਹਾਰੁ ॥"
page = 3
line = 5

[[content]]
assets = ["JSTS"]
type = "note"
language = "pa"
data = "ਬਿਸ਼ਰਾਮ ਕਾਗਦਿ ਤੇ; ਮਤਲਬ ਹੈ ਕਾਗਜ਼ ਤੇ ਕਲਮ ਲਿਖ ਨਹੀਂ ਸਕਦੀ। ਕਾਗਦਿ ਦੇ ਅਖੀਰ ਦੀ ਸਿਹਾਰੀ \"ਉੱਪਰ\" ਦਾ ਅਰਥ ਦਿੰਦੀ ਹੈ।"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is no paper, pen, and scribe,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਕਾਗਜ਼, ਲੇਖਣੀ ਤੇ ਲਿਖਾਰੀ ਨਹੀਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No paper, no pen, no scribe"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਨਾ ਤੋ ਇਤਨਾ ਕਾਗਜੁ ਹੈ ਔਰ ਨ ਕਲਮ ਹੈ, ਔਰੁ ਨ ਕੋਈ ਐਸਾ ਲਿਖਾਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਮ ਵਿਚ) ਪਤੀਜੇ ਹੋਏ ਦੀ ਆਤਮਕ ਅਵਸਥਾ ਕਾਗਜ਼ ਉੱਤੇ ਕਲਮ ਨਾਲ ਕੋਈ ਮਨੁੱਖ ਲਿਖਣ ਦੇ ਸਮਰੱਥ ਨਹੀਂ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਗਦਿ = ਕਾਗ਼ਜ਼ ਉੱਤੇ। ਕਲਮ = ਕਲਮ (ਨਾਲ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ni papel, ni pluma, ni escritor,"