[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਦਰੀ ਆਵੈ; ਤਿਸੁ ਸਿਉ ਮੋਹੁ ॥"
page = 801
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The mortal contracts love with what he sees."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਾਣੀ ਉਸ ਨਾਲ ਪਿਆਰ ਪਾਉਂਦਾ ਹੈ, ਜੋ ਉਸ ਨੂੰ ਦ੍ਰਿਸ਼ਟੀ ਆਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is attached to what he sees."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਮ ਰੂਪ ਦ੍ਰਿਸਟ ਆਵਤਾ ਹੈ, ਤਿਸ ਕੇ ਸਾਥ ਚਿਤ ਕਾ ਮੋਹਿ ਲਾਗ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ! ਜੋ ਕੁਝ ਅੱਖਾਂ ਨਾਲ ਦਿੱਸ ਰਿਹਾ ਹੈ, ਮੇਰਾ ਉਸ ਨਾਲ ਸਦਾ ਮੋਹ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਦਰੀ ਆਵੈ = (ਜੋ ਕੁਝ ਅੱਖਾਂ ਨਾਲ) ਦਿੱਸ ਰਿਹਾ ਹੈ। ਸਿਉ = ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno ama lo que parece, pero eso se va;"