[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੋਬਿੰਦ ਦਾਮੋਦਰ ਮਾਧਵੇ ॥੬੨॥"
page = 1359
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God the Lord Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਮਾਲਕ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Gobind, Daamodar, Maadhav. ||62||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਬਿੰਦ! ਹੇ ਦਮੋਦਰ! ਹੇ ਮਾਧਵ! ਇਤ ਆਦੀ ਨਾਮੋਂ ਕੋ ਉਚਾਰਨ ਕਰ, ਜਿਸ ਤੇ ਤੂੰ ਸਫਲ ਹੋਵੈਂ॥੬੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "'ਗੋਬਿੰਦ' 'ਦਾਮੋਦਰ' 'ਮਾਧੋ'- (ਤਦੋਂ ਹੀ ਤੂੰ ਜੀਭ ਅਖਵਾਣ ਦੇ ਯੋਗ ਹੋਵੇਂਗੀ) ॥੬੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Gobind, Damodar, Madhav.(62)"