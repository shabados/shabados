data = "ਗ਼ਨੀਮੁਲ ਖ਼ਿਰਾਜ ਹੈਂ ॥"
page = 8
line = 14

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That Thou art the Penaliser of enemies!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਤੂੰ ਵੈਰੀਆਂ ਤੋਂ ਵੀ ਕਰ ਵਸੂਲਣ ਵਾਲਾ ਹੈਂ (ਅਰਥਾਤ ਸਭ ਨੂੰ ਅਧੀਨ ਰਖਣ ਵਾਲਾ ਹੈਂ)"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਗਨੀਮੁਲ, ਖਿਰਾਜ ਹੈਂ ॥"