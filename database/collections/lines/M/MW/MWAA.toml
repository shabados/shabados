[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਭੇ ਆਸਾ ਪੂਰੀਆ; ਆਸਾ ਵਿਚਿ ਨਿਰਾਸੁ ਵਲਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "All the hopes have been fulfilled and now the feeling of detachment towards them has come up."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਆਸਾਂ ਸਾਰੀਆਂ ਪੂਰਣ ਹੋ ਗਈਆਂ ਹਨ, ਕਿਉਂ ਜੋ ਆਸਾਂ ਦੇ ਵਿੱਚ ਰਹਿਕੇ ਹੀ ਨਿਰਾਸ ਹੋਕੇ ਸਮਾਂ ਬਿਤਾਉਂਦੇ ਹਨ।"