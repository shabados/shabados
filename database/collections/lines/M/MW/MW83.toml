[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ. ਮਨੁ ਅਸਥਾਨੇ ਸੋਈ ॥"
page = 415
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru, the soul finds that Lord's abode."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਆਤਮਾ ਉਸ ਸਾਹਿਬ ਦੇ ਟਿਕਾਣੇ ਨੂੰ ਪਾ ਲੈਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mind of the Gurmukh finds the Lord's home."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਗੁਰਮੁਖ ਹੈਂ ਸੋਈ ਮਨ ਕੋ ਸ੍ਵੈ ਅਸਥਾਨ ਮੇਂ ਠਹਰਾਉਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੋਏ ਮਨੁੱਖ ਦਾ ਮਨ ਪਰਮਾਤਮਾ ਨੂੰ (ਆਪਣੇ ਅੰਦਰ) ਥਾਂ ਦੇਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਸਥਾਨੇ = ਟਿਕਾਂਦਾ ਹੈ, ਥਾਂ ਦੇਂਦਾ ਹੈ। ਸੋਈ = ਉਸ ਪ੍ਰਭੂ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Encuentra su hogar a través del Guru,"