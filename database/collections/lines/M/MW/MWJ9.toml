[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੁ ਧਰਮੁ; ਨਹੀ ਭਾਵੈ ਡੀਠਾ ॥"
page = 676
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He does not like even to countenance truth and chastity."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੱਚ ਅਤੇ ਪਾਕਦਾਮਨੀ ਨੂੰ ਵੇਖਣਾ ਭੀ ਪਸੰਦ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He does not like to see Truth and righteousness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚ ਔ ਧਰਮ ਤੌ ਇਸ ਕੌ ਦੇਖਨਾ ਨਹੀਂ ਭਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਮਾਇਆ-ਵੇੜ੍ਹੇ ਮੂਰਖ ਮਨੁੱਖ ਨੂੰ) ਸਦਾ-ਥਿਰ ਹਰਿ-ਨਾਮ ਸਿਮਰਨ (ਵਾਲਾ) ਧਰਮ ਅੱਖੀਂ ਵੇਖਿਆ ਨਹੀਂ ਭਾਉਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚੁ = ਸਦਾ-ਥਿਰ ਹਰਿ-ਨਾਮ ਦਾ ਸਿਮਰਨ। ਭਾਵੈ = ਚੰਗਾ ਲੱਗਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uno vive sin querer tener que ver con algo como la"