[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਪਟੀ. ਕਲਮ ਆਪਿ; ਆਪਿ ਲਿਖਣਹਾਰਾ ਹੋਆ ॥"
page = 968
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou thyself art the tablet, thyself the pen and thyself hast become the writer."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪ ਤਖਤੀ ਹੈ, ਆਪ ਹੀ ਲੇਖਣੀ ਅਤੇ ਆਪੇ ਹੀ ਲਿਖਾਰੀ ਹੋ ਗਿਆ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is the paper, He Himself is the pen, and He Himself is the writer."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਸਤਕ ਰੂਪ ਪਟੀ ਭੀ ਆਪ ਹੈ ਹੁਕਮ ਰੂਪ ਲਿਖਣ ਭੀ ਆਪੇ ਹੈ, ਆਪ ਹੀ ਬ੍ਰਹਮਾ ਰੂਪ ਹੋ ਕਰ ਲੇਖ ਦੇ ਲਿਖਣਹਾਰਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੀਵਾਂ ਦੀ ਅਗਵਾਈ ਲਈ, ਪੂਰਨੇ ਪਾਣ ਲਈ) ਪ੍ਰਭੂ ਆਪ ਹੀ ਪੱਟੀ ਹੈ ਆਪ ਹੀ ਕਲਮ ਹੈ ਤੇ (ਗੁਰੂ-ਰੂਪ ਹੋ ਕੇ) ਆਪ ਹੀ ਪੂਰਨੇ ਲਿਖਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਿਖਣਹਾਰਾ = ਲਿਖਣ ਵਾਲਾ, ਪੂਰਨੇ ਪਾਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él mismo se volvió la hoja, la pluma y el texto de su Destino y aunque los que lo siguieron estaban sujetos a la trasmigración, Él estaba siempre fresco y renovado."