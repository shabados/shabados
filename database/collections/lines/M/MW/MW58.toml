[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੁਨੋ ਮਿਤ੍ਰ ਬਿਨੁ ਨਿਸਿ ਭਈ ਹ︀ਯਾਂ ਨ ਪਹੂਚਹੁ ਆਇ ॥"
page = 994

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Listen my friend; don’t come here before the night falls."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਿਤਰ! ਰਾਤ ਪਏ ਬਿਨਾ ਇਥੇ ਨਹੀਂ ਆਉਣਾ।"