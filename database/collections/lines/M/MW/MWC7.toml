[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਥੈ ਅਗੈ; ਹਰਿ ਨਾਮੁ ਸਖਾਈ ॥੧॥"
page = 230
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Here and hereafter God's Name is the mortal's succour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਲੋਕ ਅਤੇ ਪ੍ਰਲੋਕ ਵਿੱਚ ਰੱਬ ਦਾ ਨਾਮ ਪ੍ਰਾਣੀ ਦਾ ਸਹਾਇਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Here and hereafter, the Lord's Name is our Companion. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਲੋਕ ਮੇਂ ਔਰ ਪਰਲੋਕ ਮੇਂ ਹਰੀ ਕਾ ਨਾਮ ਹੀ ਸਹਾਇਕ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਇਸ ਲੋਕ ਵਿਚ ਤੇ ਪਰਲੋਕ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ (ਹੀ ਅਸਲ) ਸਾਥੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਐਥੈ = ਇਸ ਲੋਕ ਵਿਚ। ਅਗੈ = ਪਰਲੋਕ ਵਿਚ। ਸਖਾਈ = ਸਾਥੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y el Nombre del Señor te acompañará aquí y aquí después. (1)"