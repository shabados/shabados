[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਦ੍ਵੈਖ ਹੈ ਨ ਭੇਖ ਹੈ; ਨ ਦੁਈ ਹੈ ਨ ਦ੍ਰੋਹ ਹੈ ॥"
page = 33

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is without malice, garb, duality and deception."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਾ ਦ੍ਵੈਸ਼ ਹੈ, ਨਾ ਭੇਖ ਹੈ, ਨਾ ਦੂਈ ਦਾ ਭਾਵ ਹੈ ਅਤੇ ਨਾ ਧੋਖਾ ਹੈ।"