[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਯਾ ਕਹੁ ਭਾਵ ਹੀਐ ਅਨੁਮਾਨਾ ॥"
page = 650

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I shall consider him my fifth Guru, such a thought came to the mind of Dutt, the king of sages"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਹ ਕਹਿ ਕੇ ਹਿਰਦੇ ਵਿਚ (ਇਹ) ਭਾਵ ਵਿਚਾਰ ਲਿਆ।"