[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਮਕਿ ਤਰਸਿ; ਚਾਲੈ ॥"
page = 1272
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the desire of meeting with its Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਉਮੰਗ ਤੇ ਪਿਆਰ ਨਾਲ ਤੁਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It walks with eagerness and love,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਉਮਕਿ) ਉਮੰਗ ਕਰ (ਤਰਸਿ) ਚਾਹੁ ਸਹਿਤ (ਚਾਲੈ) ਚਾਲੁ ਸਤਸੰਗ ਮੇਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਤਦੋਂ ਇਹ) ਉਮਾਹ ਵਿਚ ਆ ਕੇ (ਆਤਮਕ) ਆਨੰਦ ਨਾਲ (ਜੀਵਨ-ਚਾਲ) ਚੱਲਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਮਕਿਤ = ਉਮਾਹ ਵਿਚ ਆ ਕੇ। ਰਸਿ = ਆਨੰਦ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "densos con determinación y amor,"