[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਬ ਤੂ ਸੀਝੁ; ਭਾਵੈ. ਨਹੀ ਸੀਝੈ ॥"
page = 913
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Now thou mayest chasten thy self or chasten not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੁਣ ਤੂੰ ਆਪਣੇ ਆਪ ਨੂੰ ਸੁਧਾਰ ਜਾਂ ਨਾਂ ਸੁਧਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "now, you may fulfill your destiny or not;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਤੂੰ ਕਲਿਆਣ ਕੋ ਪ੍ਰਾਪਤ ਹੋ ਚਾਹੇ ਨਾ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਮਰਜ਼ੀ ਹੈ ਹੁਣ ਤੂੰ (ਉਸ ਦਾ ਸਿਮਰਨ ਕਰ ਕੇ ਜ਼ਿੰਦਗੀ ਵਿਚ) ਕਾਮਯਾਬ ਹੋ ਚਾਹੇ ਨਾਹ ਹੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੀਝੁ = ਕਾਮਯਾਬ ਹੋ। ਭਾਵੈ = ਚਾਹੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ahora podrás o no, cumplir tu Destino, pero escucha,"