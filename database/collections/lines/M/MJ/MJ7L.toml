[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਭ ਤਾਰੇ, ਚਉਫੇਰਿ ਫਿਰਾਇਆ ॥੩॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "All the stars revolve around him."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਤਾਰੇ ਉਨ੍ਹਾਂ ਦੀ ਪਰਕ੍ਰਮਾਂ ਕਰਦੇ ਹਨ।"