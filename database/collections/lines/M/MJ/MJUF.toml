[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਕੋ ਨਿਰਤਿਕਾਰੀ ॥"
page = 884
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This alone is the dance of the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਇਹ ਹੀ ਸਾਹਿਬ ਦਾ ਨਾਚ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is the rhythmic dance of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਰਾਮ ਕਾ ਰਚਾ ਹੂਆ ਜੋ ਸੰਸਾਰੁ ਹੈ ਏਹੀ ਨਿਰਤਕਾਰੀ ਹੋ ਰਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਜਗਤ ਵਿਚ) ਪਰਮਾਤਮਾ (ਦੀ ਰਚੀ ਰਚਨਾ) ਦਾ ਨਾਚ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋ = ਦੀ। ਨਿਰਤਿਕਾਰੀ = ਨਾਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, así es el baile que el hombre danza para su Dios,"