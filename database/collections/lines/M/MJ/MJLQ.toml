type = "primary"
data = "ਚਿੰਤ ਯਹੈ ਪ੍ਰਜਾ ਮਨ ਮਾਹੀ ॥"
page = 958

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But his subject was getting worried as he was not blessed with a son."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਹੀ ਚਿੰਤਾ ਪ੍ਰਜਾ ਦੇ ਮਨ ਵਿਚ ਸੀ।"