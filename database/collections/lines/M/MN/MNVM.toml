[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਤਾ. ਮਾਇਆ ਮੋਹਿਆ; ਫਿਰਿ ਫਿਰਿ ਆਵਾ ਜਾਇ ॥"
page = 511
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The soul says \"I am allured by mammon, so I come and go again and again\"."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਤਮਾ ਆਖਦੀ ਹੈ, \"ਮੈਨੂੰ ਤਾਂ ਮੋਹਣੀ ਨੇ ਲੁਭਾਇਮਾਨ ਕਰ ਲਿਆ ਹੈ, ਇਸ ਲਈ ਮੈਂ, ਮੁੜ ਮੁੜ ਕੇ ਆਉਂਦੀ ਤੇ ਜਾਂਦੀ ਰਹਿੰਦੀ ਹੈ।\""

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The soul answers, \"I am enticed by Maya, and so I come and go, again and again.\""

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤੋ ਮਾਇਆ ਕਾ ਮੋਹਿਆ ਹੂਆ ਹੂੰ। ਇਸੀ ਤੇ (ਫਿਰਿ ਫਿਰ), ਭਾਵ ਬਾਰੰਬਾਰ (ਆਵਾ ਜਾਇ), ਭਾਵ ਜਨਮਤਾ ਮਰਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਫਸਿਆ ਮੁੜ ਮੁੜ ਜਨਮ ਮਰਨ ਵਿਚ ਪਿਆ ਰਿਹਾ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫਿਰਿ ਫਿਰਿ = ਮੁੜ ਮੁੜ। ਆਵਾ ਜਾਇ = ਆਉਂਦਾ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "“Soy seducida por Maya y así voy y vengo;"