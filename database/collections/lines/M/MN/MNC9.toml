[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਵਧਿਸ ਮੂਏ ਤਿਨ ਮਾਨ ਮਾਨੇ ॥"
page = 228

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing Shatrughan and Bharat, Ram recognized them and it came into the mind of ram and Lakshman that king Dasrath had left this world"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਰਾਮ ਤੇ ਲੱਛਮਣ ਨੇ) ਮਨ ਵਿੱਚ ਰਾਜੇ ਦਸ਼ਰਥ ਦਾ ਦੇਂਹਾਂਤ ਮੰਨ ਲਿਆ।"