data = "ਸੋ ਉਬਰਿਆ; ਮਾਇਆ ਅਗਨਿ ਤੇ ॥੩॥"
page = 211
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "is saved from the mammon fire."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੋਹਣੀ ਦੀ ਅੱਗ ਤੋਂ ਬਚ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "are saved from the fire of Maya. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪੁਰਸ ਮਾਇਆ ਅਗਨੀ ਸੇ ਬਚਿਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਮਾਇਆ ਦੀ (ਤ੍ਰਿਸ਼ਨਾ) ਅੱਗ (ਵਿਚ ਸੜਨ) ਤੋਂ ਬਚ ਜਾਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es salvado del fuego de Maya. (3)"