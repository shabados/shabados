[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧ ਕੀ ਸੋਭਾ ਕਾ; ਨਾਹੀ ਅੰਤ ॥"
page = 272
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is no limit to the glory of the saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਦੀ ਮਹੱਤਤਾ ਦਾ ਕੋਈ ਓੜਕ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The glory of the Holy people has no limit."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਕੀ ਸੋਭਾ ਕਾ ਅੰਤ ਨਹੀਂ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਦੀ ਸੋਭਾ ਦਾ ਅੰਦਾਜ਼ਾ ਨਹੀਂ ਲੱਗ ਸਕਦਾ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Gloria de las personas Santas, no tiene límite."