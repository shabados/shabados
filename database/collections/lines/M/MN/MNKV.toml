[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਬਖਸਿ ਲੈਹਿ; ਨਾਮੁ ਦੀਜੈ ॥"
page = 1048
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and forgive me and bless me with Thine Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੈਨੂੰ ਖ਼ੁਦ ਮਾਫ਼ੀ ਦੇ ਦੇ ਅਤੇ ਮੈਨੂੰ ਆਪਣਾ ਨਾਮ ਪ੍ਰਦਾਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forgive me, and bless me with Your Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਆਪ ਹੀ ਮੇਰੇ ਔਗੁਣ ਬਖਸ ਲੈ ਪੁਨਃ ਨਾਮ ਮੇਰੇ ਕੋ ਦੇਹ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪ ਹੀ ਮਿਹਰ ਕਰ ਤੇ ਇਸ ਨੂੰ ਆਪਣਾ ਨਾਮ ਬਖ਼ਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "perdóname y bendíceme con Tu Nombre."