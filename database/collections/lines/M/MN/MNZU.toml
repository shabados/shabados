[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਤੇਹ; ਪਰਮ ਸੁਖ ਪਾਇਆ ॥੪੦॥"
page = 258
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "obtains the supreme comfort, O Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਹਾਨ ਆਰਾਮ ਨੂੰ ਪਾ ਲੈਦਾ ਹੈ, ਹੇ ਨਾਨਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, obtains supreme peace. ||40||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: (ਤੇਹ) ਤਿਨੋਂ ਨੇ ਪਰਮ ਸੁਖ ਅਰਥਾਤ ਆਤਮ ਅਨੰਦ ਕੋ ਪਾਇ ਲੀਆ ਹੈ॥੪੦॥☬ਐਸੇ ਬੇਨਤੀ ਕਰੇ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਹਨਾਂ ਨੇ ਸਭ ਤੋਂ ਸ੍ਰੇਸ਼ਟ ਆਤਮਕ ਆਨੰਦ ਹਾਸਲ ਕਰ ਲਿਆ ਹੈ ॥੪੦॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇਹ = ਉਹਨਾਂ ਨੇ ॥੪੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh, dice Nanak, logra el Supremo Éxtasis. (40)"