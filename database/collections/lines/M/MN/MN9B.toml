[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਸਨੁ ਜਾ ਕਾ; ਸਦਾ ਬੈਕੁੰਠ ॥"
page = 393
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whose seat is ever in the heaven,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਟਿਕਾਣਾ ਹਮੇਸ਼ਾਂ ਹੀ ਸੱਚ ਖੰਡ ਵਿੱਚ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His seat is forever in heaven."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਜਿਸ ਕਾ (ਆਸਨੁ) ਨਿਵਾਸ ਸਥਾਨ ਸਦੀਵਕਾਲ ਬੈਕੁੰਠ ਰੂਪੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਾਧ ਸੰਗਤਿ-ਰੂਪ) ਬੈਕੁੰਠ ਵਿਚ ਉਸ ਦਾ ਨਿਵਾਸ ਸਦਾ ਹੀ ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuyo Sitio Eterno es el Paraíso de los Santos,"