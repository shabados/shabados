[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਇ. ਨ ਜਾਣੈ; ਤੇਰਾ ਚੀਰਾ ॥"
page = 1034
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "None knows Thine expanse, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਭੀ ਤੇਰੇ ਵਿਸਥਾਰ ਨੂੰ ਨਹੀਂ ਜਾਣਦਾ, ਹੇ ਸਾਈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one knows Your expanse."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਦਫਤਰ ਵਾ ਹੁਕਮ ਕੋਈ ਜਾਨ ਨਹੀਂ ਸਕਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੂੰ ਇਕ ਐਸਾ ਬੇਅੰਤ ਸਮੁੰਦਰ ਹੈਂ ਕਿ) ਤੇਰਾ ਖਿਲਾਰ ਕੋਈ ਸਮਝ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚੀਰਾ = ਪੱਲਾ, ਪਾਟ, ਖਿਲਾਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh Dios, y nadie conoce lo Vasto de Tu Expansión."