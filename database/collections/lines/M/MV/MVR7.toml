[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮ ਬਿਨਾ; ਮਾਟੀ ਸੰਗਿ ਰਲੀਆ ॥੧॥"
page = 385
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "But without the Name, he mingles with dust."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰ ਨਾਮ ਦੇ ਬਾਝੋਂ ਉਹ ਖਾਕ ਨਾਲ ਮਿਲ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but without the Name, he mingles with dust. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਬਿਨਾਂ ਨਾਮ ਸੇ ਮਟੀ ਸੇ ਮਿਲ ਜਾਨਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਰੀਰ ਆਖ਼ਿਰ ਮਿੱਟੀ ਨਾਲ ਮਿਲ ਜਾਂਦਾ ਹੈ, (ਤੇ ਜੀਵਾਤਮਾ) ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਤੋਂ ਬਿਨਾ (ਖ਼ਾਲੀ ਹੱਥ) ਹੀ ਰਹਿ ਜਾਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਟੀ ਸੰਗਿ = ਮਿੱਟੀ ਨਾਲ। ਰਲੀਆ = ਰਲ ਜਾਂਦਾ ਹੈ, ਮਿਲ ਜਾਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero sin el Naam, el Nombre del Señor, solamente se mezcla con la tierra. (1)"