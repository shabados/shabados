[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨ ਪ੍ਰਭੁ ਜਾਤਾ; ਸੁ ਸੋਭਾਵੰਤ ॥"
page = 282
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who know the Lord are glorious."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਠਾਕੁਰ ਨੂੰ ਜਾਣਦੇ ਹਨ, ਉਹ ਸੁਭਾਇਮਾਨ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who know God are glorious."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋ ਨੇ ਪ੍ਰਭੂ ਕੌ ਜਾਣਿਆ ਹੈ, ਸੋਈ ਜਨ ਸੋਭਾਵਾਨ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਬੰਦਿਆਂ ਨੇ ਪ੍ਰਭੂ ਨੂੰ ਪਛਾਣ ਲਿਆ, ਉਹ ਸੋਭਾ ਵਾਲੇ ਹੋ ਗਏ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨ = ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que ha conocido al Señor es digno de Alabanza;"