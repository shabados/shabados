[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿ ਸਤਿਗੁਰੁ ਸੇਵਨਿ ਸੇ ਉਬਰੇ; ਹਰਿ ਸੇਤੀ ਲਿਵ ਲਾਇ ॥੧॥"
page = 65
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who serve the True Guru and contract affection with the Lord are delivered."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਖਿਦਮਤ ਕਰਦੇ ਅਤੇ ਪ੍ਰਭੂ ਨਾਲ ਪ੍ਰੀਤ ਪਾਉਂਦੇ ਹਨ, ਉਹ ਪਾਰ ਉਤਰ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who serve the True Guru are uplifted and saved, in love with the Lord. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੁਰਸ ਸਤਿਗੁਰੋਂ ਕੋ ਸੇਵਨ ਕਰ ਕੇ ਹਰੀ ਕੇ ਸਾਥ ਬ੍ਰਿਤੀ ਲਗਾਵਤੇ ਹੈਂ, ਸੋ ਜਮ ਡੰਡੁ ਸੇ (ਉਬਰੇ) ਬਚੇ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਜੇਹੜੇ ਮਨੁੱਖ ਗੁਰੂ ਦਾ ਆਸਰਾ ਲੈਂਦੇ ਹਨ, ਉਹ ਪ੍ਰਭੂ (-ਚਰਨਾਂ) ਵਿਚ ਸੁਰਤ ਜੋੜ ਕੇ (ਇਸ ਮਾਰ ਤੋਂ) ਬਚ ਜਾਂਦੇ ਹਨ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿ = ਜਿਹੜੇ ਮਨੁੱਖ। ਸੇਵਨਿ = ਸੇਂਵਦੇ ਹਨ। ਲਾਇ = ਲਾ ਕੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los que sirven al Guru Verdadero, se elevan y entran en Comunión con el Señor. (1)"