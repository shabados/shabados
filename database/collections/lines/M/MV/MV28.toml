[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਪੁਰਖੁ ਅਨੰਦੀ ਅਨੰਤ; ਸਭ ਜੋਤਿ ਸਮਾਹਰਾ ॥"
page = 1096
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou are the Infinite and joyful Lord and Thy Light is pervading everywhere."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਬੇਅੰਤ ਅਤੇ ਅਨੰਦਤ ਪ੍ਰਭੂ ਹੈਂ ਅਤੇ ਤੇਰਾ ਪ੍ਰਕਾਸ਼ ਹਰ ਥਾਂ ਸਮਾ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are the blissful and infinite Primal Lord God; Your Light is all-pervading."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਅਨੰਤ ਰੂਪ ਔਰ ਅਨੰਦੀ ਪੁਰਸ ਹੈਂ ਔ ਹੇ ਜੋਤੀ! ਸਭ ਮੇਂ ਸਮਾਇ ਰਹਿਆ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਦਾ ਅਨੰਦ ਰਹਿਣ ਵਾਲਾ ਹੈਂ, ਬੇਅੰਤ ਹੈਂ, ਸਭ ਵਿਚ ਵਿਆਪਕ ਹੈਂ, ਸਭਨਾਂ ਵਿਚ ਤੇਰੀ ਜੋਤਿ ਟਿਕੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨੰਦੀ = ਅਨੰਦ ਮਾਣਨ ਵਾਲਾ। ਸਮਾਹਰਾ = ਸਮਾਈ ਹੋਈ ਹੈ, ਵਿਆਪਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, Tu Luz ilumina las mentes. Eres el Dios de dioses, el Creador,"