language = "pa"
data = "ਸੁੰਭ ਅਤੇ ਨਿਸੁੰਭ ਨੇ ਜਦੋਂ ਰਕਤਬੀਜ ਦੇ ਮਾਰੇ ਜਾਣ (ਦੀ ਗੱਲ) ਸੁਣੀ"