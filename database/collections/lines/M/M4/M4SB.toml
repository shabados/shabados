type = "primary"
data = "ਦੇਤ ਭਯੋ ਬਰਦਾਨ ਹੀਐ ਹੁਲਸਾਇ ਕੈ ॥"
page = 54

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Having been bestowed the kingdom, the Bedis were very much pleased. With happy heart, he predicted this boon:"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਦਿਲੋਂ ਖੁਸ਼ ਹੋ ਕੇ ਵਰਦਾਨ ਦੇਣ ਲਗੇ"