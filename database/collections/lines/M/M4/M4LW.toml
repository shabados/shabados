data = "ਜਾ ਕੇ ਸਾਥ ਰਮਤ ਨਿਤਿ ਅਤਿ ਨਰ ॥੨॥"
page = 864

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The wife was known as Noor Bibi, and many people used to make love with her.(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨਾਲ ਨਿੱਤ ਬਹੁਤ ਮਰਦ ਰਮਣ ਕਰਦੇ ਸਨ ॥੨॥"