[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਣੀ ਕਿਰਪਾ ਧਾਰੀ ॥"
page = 622
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To me the Lord has extended His mercy,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਉਤੇ ਸਾਈਂ ਨੇ ਆਪਣੀ ਮਿਹਰ ਕੀਤੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He extended His Mercy to me,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਵਾਹਿਗੁਰੂ ਨੇ ਆਪਣੀ ਕਿਰਪਾ ਕਰੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਪ੍ਰਭੂ ਨੇ ਉਸ ਮਨੁੱਖ ਉਤੇ ਆਪਣੀ ਮੇਹਰ ਕੀਤੀ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Mismo es Compasivo conmigo, y así fui emancipado."