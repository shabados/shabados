[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਵੇ ਪੀਲੇ ਪਾਨ ਹਹਿ; ਓਇ ਵੇਲਹੁ ਤੁਟੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The betel leaves when plucked from the branch are of green and yellow colour."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪਾਨਾਂ ਦੇ ਪੱਤ੍ਰ ਸਾਵੇ ਪੀਲੇ ਹੋਕੇ ਵੱਲਾਂ ਥੋਂ ਟੁੱਟਦੇ ਹਨ।"