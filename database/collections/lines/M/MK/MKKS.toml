[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਮੀਤ ਬੰਧਪ ਹਰਖੁ ਉਪਜਿਆ; ਦੂਤ ਥਾਉ ਗਵਾਇਆ ॥"
page = 247
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All my friends and kith and kin are in bliss and the very trace of my arch adversaries is removed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸਾਰੇ ਸੱਜਣ ਅਤੇ ਸਾਕ-ਸੈਨ ਅਨੰਦ ਅੰਦਰ ਹਨ ਅਤੇ ਮੇਰੇ ਕਟੜ ਵੈਰੀਆਂ ਦਾ ਨਾਮ ਨਿਸ਼ਾਨ ਤਕ ਮਿਟ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All my friends and relatives are happy, and all traces of my enemies have been removed."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਪੂਰਨ ਮਿਤ੍ਰ ਔ ਭਾਈਓਂ ਕੋ ਅਨੰਦ ਉਪਜਤਾ ਭਯਾ ਹੈ ਔਰ ਕਾਮ ਕ੍ਰੋਧ ਆਦਿ ਦੂਤੋਂ ਕਾ (ਥਾਉ) ਅਗਿਆਨ ਗਵਾਯਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਇਹਨਾਂ ਮਿੱਤਰਾਂ ਸਨਬੰਧੀਆਂ ਨੂੰ (ਮੇਰੇ ਗਿਆਨ-ਇੰਦ੍ਰਿਆਂ ਨੂੰ) ਚਾਉ ਚੜ੍ਹਿਆ ਰਹਿੰਦਾ ਹੈ, ਤੇ (ਮੇਰੇ ਅੰਦਰੋਂ) ਕਾਮਾਦਿਕ ਵੈਰੀਆਂ ਦਾ ਨਾਮ-ਨਿਸ਼ਾਨ ਮਿਟ ਗਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੰਧਪ = ਸਨਬੰਧੀ। ਹਰਖੁ = ਖ਼ੁਸ਼ੀ ਚਾਉ। ਦੂਤ ਥਾਉ = ਦੂਤਾਂ ਦਾ ਥਾਂ, ਕਾਮਾਦਿਕ ਵੈਰੀਆਂ ਦਾ ਨਾਮ-ਨਿਸ਼ਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mis amigos y parientes florecen en Plenitud, y los enemigos han sido destruidos."