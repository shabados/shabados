[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰ ਪੂਰੇ ਵਿਣੁ, ਦੁਖੁ ਸੈਂਸਾਰੇ ॥੮॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Without the perfect Guru there is nothing in this world except suffering."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੂ ਦੇ ਬਾਝ ਸੰਸਾਰ ਵਿਖੇ ਦੁੱਖ ਹੀ ਹੈ।"