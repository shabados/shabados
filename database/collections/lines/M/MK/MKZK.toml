[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਸਿਮਰਹੁ; ਅਗਮ ਅਪਾਰਾ ॥"
page = 698
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remember thou the Inaccessible and Infinite Lord Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਅਪਹੁੰਚ ਤੇ ਅਨੰਤ ਸੁਆਮੀ ਮਾਲਕ ਦਾ ਆਰਾਧਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remember in meditation the Lord, Har, Har, the unfathomable, infinite Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਅਗਮ ਅਪਾਰ ਕੇ ਹਰਿ ਹਰਿ ਨਾਮ ਕੋ ਸਿਮਰਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਸ ਅਪਹੁੰਚ ਅਤੇ ਬੇਅੰਤ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਿਆ ਕਰੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਗਮ = ਅਪਹੁੰਚ। ਅਪਾਰਾ = ਪਾਰ-ਰਹਿਤ, ਬੇਅੰਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Contemplamos a nuestro Señor Infinito e Insondable"