[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਰਣ ਕਾਰਣ ਸਮਰਥੁ ਹੈ; ਸਾਧਸੰਗਤਿ ਦਾ ਕਰੈ ਕਰਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "All competent God Himself is the efficient as well as material cause of all but He does everything according to the will of the holy congregation."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਨਾਨਕ ਜੀ) ਕਰਣ ਕਾਰਣ ਸਮਰੱਥ ਸਨ (ਪਰੰਤੂ ਜੋ) ਸਾਧ ਸੰਗਤ ਕਰਾਇਆ (ਚਾਹੇ ਸੋ) ਕਰਦੇ ਹਨ।"