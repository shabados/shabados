[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗ੍ਵਾਰਨੀਯਾ ਸੁਨਿ ਸ੍ਰਉਨਨ ਮੈ; ਬਤੀਆ ਹਰਿ ਕੀ ਅਤਿ ਹੀ ਮਨ ਭੀਨੋ ॥"
page = 352

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The gopis were extremely pleased on listening to the talk of Krishna"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕ੍ਰਿਸ਼ਨ ਦੀਆਂ ਗੱਲਾਂ ਨੂੰ ਕੰਨਾਂ ਨਾਲ ਸੁਣ ਕੇ ਗੋਪੀਆਂ ਦਾ ਮਨ (ਪ੍ਰੇਮ ਨਾਲ) ਬਹੁਤ ਭਿਜ ਗਿਆ ਹੈ।"