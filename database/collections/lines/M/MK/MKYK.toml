[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੂੜੁ ਸਚੁ, ਜਿਉਂ ਵਟੁ ਘੜੋਟਾ ॥੭॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The relationship between the false hood and the truth is similar to the relation of the pitcher and the stone."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕੂੜ ਤੇ ਸੱਚ ਦਾ ('ਵੱਟ ਘੜੋਟਾ') ਘੜੇ ਵੱਟੇ ਵਾਲਾ ਵੈਰ ਹੈ।"