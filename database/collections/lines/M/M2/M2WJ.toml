[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਟ ਪਰਚਾ ਕੀ; ਬਾਤ ਨਿਰੋਧਹੁ ॥"
page = 342
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Retrain thyself from every talk, which allures the mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਆਪ ਨੂੰ ਹਰ ਇਕ ਗੱਲ ਤੋਂ ਰੋਕ ਜੋ ਮਨ ਨੂੰ ਵਰਗਲਾਉਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Refrain from that talk which attracts the heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਿਦੇ ਪਰਚਾਵਣੇ ਕੀ ਜੋ ਬਾਹਜ ਮੁਖੀ ਬਾਤਾਂ ਹੈਂ ਤਿਨ ਸੇ ਮਨ ਕੋ ਰੋਕਉ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਨੂੰ ਉਹਨਾਂ ਬਚਨਾਂ ਵਿਚ ਲਿਆ ਕੇ ਜੋੜੋ, ਜਿਨ੍ਹਾਂ ਕਰਕੇ ਇਹ ਮਨ ਪਰਮਾਤਮਾ ਵਿਚ ਪਰਚ ਜਾਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਚਾ = (skt. परिचय) ਮਿੱਤ੍ਰਤਾ, ਸਾਂਝ। ਬਾਤ = ਗੱਲਾਂ। ਨਿਰੋਧਹੁ = ਰੋਕੋ, ਟਿਕਾਓ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así contrólala para que esté complacida con tu ser interior."