[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਘਾਲਹਿ ਥਕਿ ਪਾਹਿ ॥"
page = 276
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many millions are wearied with labour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਕ੍ਰੋੜ ਮੁਸ਼ੱਕਤ ਨਾਲ ਹਾਰ ਹੁਟ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions are exhausted by their labors."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਕਈ ਕ੍ਰੋੜੋਂ (ਘਾਲਹਿ) ਕਮਾਈ ਕਰਤੇ ਥਕ ਪੜਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਰੋੜਾਂ (ਐਸੇ ਹਨ ਜੋ ਰੋਟੀ ਦੀ ਖ਼ਾਤਰ) ਮੇਹਨਤ ਕਰਦੇ ਹਨ ਤੇ ਥੱਕ ਟੁੱਟ ਜਾਂਦੇ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਾਲਹਿ = ਮੇਹਨਤ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones se agotan en la miseria."