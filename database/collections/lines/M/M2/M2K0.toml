[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮਈਆ, ਹਉ ਬਾਰਿਕੁ ਤੇਰਾ ॥"
page = 478
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My pervading God, I am Thy child."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਵਿਆਪਕ ਵਾਹਿਗੁਰੂ! ਮੈਂ ਤੇਰਾ ਬੱਚਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord, I am Your child."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਮ! ਮੈਂ ਤੇਰਾ ਬਾਲਕਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਸੁਹਣੇ ਰਾਮ! ਮੈਂ ਤੇਰਾ ਅੰਞਾਣ ਬੱਚਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਮਈਆ = ਹੇ ਸੁਹਣੇ ਰਾਮ! ਹਉ = ਮੈਂ। ਬਾਰਿਕੁ = ਬਾਲਕ, ਅੰਞਾਣ ਬੱਚਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, yo también soy tu hijo;"