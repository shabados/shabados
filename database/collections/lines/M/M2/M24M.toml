[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧਸੰਗਤਿ; ਕਬਹੂ. ਨਹੀ ਕਰੈ ॥"
page = 1252
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He joins not the society of the saints ever."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿਸੰਗਤ ਨਾਲ ਉਹ ਕਦੇ ਭੀ ਨਹੀਂ ਜੁੜਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He never joins the Saadh Sangat, the Company of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਧੋਂ ਕੀ ਸੰਗਤਿ ਕਬੀ ਭੀ ਨਹੀਂ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਦੇ ਭੀ ਸਾਧ-ਸੰਗਤ ਵਿਚ ਨਹੀਂ ਬੈਠਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sin conservar para nada la compañía de los Santos."