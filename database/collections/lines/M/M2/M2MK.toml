[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਇ ਅੰਮ੍ਰਿਤ ਭਰੇ ਭਰਪੂਰ ਹਹਿ; ਓਨਾ. ਤਿਲੁ ਨ ਤਮਾਇ ॥੮॥"
page = 755
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They are filled to the brim with ambrosia and have not even a particle of avarice."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਧਾਰਸ ਨਾਲ ਲਬਾਲਬ ਭਰੇ ਹੋਏ ਹਨ ਅਤੇ ਉਨ੍ਹਾਂ ਨੂੰ ਇਕ ਭੋਰਾ ਭਰ ਭੀ ਲਾਲਚ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They are filled to over-flowing with Ambrosial Nectar, and they have absolutely no greed at all. ||8||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਨਾਮ ਅੰਮ੍ਰਿਤ ਕਰ ਕੇ ਭਰੇ ਹੂਏ ਅਤੀ ਪੂਰਣ ਹੈਂ, ਉਨ ਕੋ ਤਿਲ ਮਾਤਰ ਭੀ ਕਿਸੇ ਕੀ (ਤਮਾਇ) ਇਛਾ ਵਾ ਲੋਭ ਨਹੀਂ॥੮॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਹਾ ਪੁਰਖ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲੇ ਨਾਮ-ਰਸ ਨਾਲ ਭਰਪੂਰ ਰਹਿੰਦੇ ਹਨ, ਉਹਨਾਂ ਨੂੰ ਕਿਸੇ ਸੇਵਾ ਆਦਿਕ ਦਾ ਲਾਲਚ ਨਹੀਂ ਹੁੰਦਾ (ਪਰ ਜੇਹੜਾ ਮਨੁੱਖ ਉਹਨਾਂ ਦੀ ਸੇਵਾ ਕਰਦਾ ਹੈ, ਉਸ ਨੂੰ ਉਹਨਾਂ ਪਾਸੋਂ ਆਤਮਕ ਜੀਵਨ ਮਿਲ ਜਾਂਦਾ ਹੈ) ॥੮॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਇ = ਮਹਾ ਪੁਰਖ {ਬਹੁ-ਵਚਨ ਲਫ਼ਜ਼ 'ਓਹ' ਤੋਂ}। ਅੰਮ੍ਰਿਤ = ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ ਨਾਮ-ਰਸ। ਹਹਿ = ਹੁੰਦੇ ਹਨ। ਤਮਾਇ = ਲਾਲਚ, ਆਪਣੀ ਗ਼ਰਜ਼ ॥੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "son las Piscinas de Néctar y la avaricia nunca los seduce.(8)"