[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੂਖ ਪਾਪ ਤਿਹ ਨਿਕਟ ਨ ਆਇਆ ॥"
page = 58

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Those who mediated on the Name of the Lord, none of the sorrows and sins came near them."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਨੇੜੇ ਦੁਖ ਅਤੇ ਪਾਪ ਨਹੀਂ ਆਉਂਦੇ ਹਨ।"