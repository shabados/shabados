data = "ਅਮਿਤ ਜੋਤਿ ਜਗ ਜੋਤ ਪ੍ਰਕਰਣੰ ॥"
page = 130

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou hast unlimited light, Thou art the illuminator of light in the world."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਮਿਤ ਜੋਤਿ ਵਾਲੇ, ਜਗਤ ਵਿਚ ਪ੍ਰਕਾਸ਼ ਕਰਨ ਵਾਲੇ,"