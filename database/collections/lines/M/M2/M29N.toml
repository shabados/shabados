[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਹੂ ਕਾਜਿ ਨਾਹੀ; ਗਾਵਾਰ ॥"
page = 238
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "are of no avail, O ignorant man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿਸੇ ਕੰਮ ਦੇ ਨਹੀਂ, ਹੇ ਬੇਸਮਝ ਇਨਸਾਨ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "are of no use, you fool!"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੁਵਾਰ! ਸੋ ਨਾਮ ਬਿਨਾ ਕਿਸੀ ਕਾਮ ਕੇ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਮੂਰਖਾਂ ਦੀ (ਕੋਈ ਜਾਇਦਾਦ ਆਤਮਕ ਜੀਵਨ ਦੇ ਰਸਤੇ ਵਿਚ) ਉਹਨਾਂ ਦੇ ਕੰਮ ਨਹੀਂ ਆਉਂਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਹੂ ਕਾਜਿ = ਕਿਸੇ ਕੰਮ ਵਿਚ। ਗਾਵਾਰ = ਮੂਰਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh mi mente loca."