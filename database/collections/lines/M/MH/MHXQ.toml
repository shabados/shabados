[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਲਿਹਾਰੀ ਗੁਰ ਆਪਣੇ; ਸਦ ਸਦ ਬਲਿ ਜਾਉ ॥"
page = 400
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am devoted to my Guru and am ever, ever a sacrifice to Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਗੁਰੂ ਤੋਂ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ ਅਤੇ ਹਮੇਸ਼ਾਂ ਉਸ ਤੋਂ ਕੁਰਬਾਨ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to my Guru; forever and ever, I am a sacrifice to Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਨਿਤਯੰਪ੍ਰਤਿ ਮਨ ਤਨ ਬਾਣੀ ਕਰ ਕੇ ਤਿਸ ਅਪਨੇ ਗੁਰੂ ਪਰ ਸੇ ਬਲਿਹਾਰ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਮੈਂ ਆਪਣੇ ਗੁਰੂ ਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ, ਸਦਾ ਹੀ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ, ਮੈਂ ਗੁਰੂ ਤੋਂ ਵਾਰਨੇ ਜਾਂਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਦ ਸਦ = ਸਦਾ ਸਦਾ, ਸਦਾ ਹੀ। ਜਾਉ = ਜਾਉਂ, ਮੈਂ ਜਾਂਦਾ ਹਾਂ। ਬਲਿ = ਸਦਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, ofrezco mi ser en sacrificio a mi Guru; yo ofrezco mi ser en sacrificio a Él."