[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਬਦੇ ਹੀ ਫਿਰਿ ਓਪਤਿ ਹੋਵੈ ॥"
page = 117
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Word the creation evolves again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਚਨ ਰਾਹੀਂ ਹੀ ਉਤਪਤੀ ਮੁੜ ਪ੍ਰਕਾਸ਼ਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Shabad, creation happens again."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਮਹਾਂਪਰਲੋ ਕੇ ਪੀਛੇ ਫਿਰ ਭੀ ਉਤਪਤੀ ਸਬਦ ਸੇ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਸ ਤੋਂ ਪਿੱਛੋਂ) ਮੁੜ ਪ੍ਰਭੂ ਦੇ ਹੁਕਮ ਵਿਚ ਹੀ ਜਗਤ ਦੀ ਉਤਪੱਤੀ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਪਤਿ = ਉਤਪੱਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por la Palabra surge la evolución de la creación otra vez."