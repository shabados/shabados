[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੇਤਹਿ ਗ੍ਵਾਰਨਿ ਕੇ ਪਟ ਛਾਜਤ; ਸੇਤ ਨਦੀ ਤਹ ਧਾਰ ਬਹਾਈ ॥"
page = 383

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In the current of the white river, the gopis also wore white clothes"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਗੋਪੀਆਂ ਦੇ ਸਫ਼ੈਦ ਬਸਤ੍ਰ ਫਬਦੇ ਸਨ ਅਤੇ ਉਥੇ ਨਦੀ ਦੀ ਸਵੱਛ ਧਾਰਾ ਚਲਦੀ ਸੀ।"