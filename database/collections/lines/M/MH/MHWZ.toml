[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹੋਇ ਹੈਰਾਨੁ, ਕਰੇਨਿ ਜੁਹਾਰੀ ॥੩੨॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "All got surprised and they all bowed."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਅਚਰਜ ਹੋ ਕੇ (ਫਿਰ) ਲੱਗੇ ਨਿਮਸਕਾਰਾਂ ਕਰਨ।"