data = "ਆਵਤ ਲਖਾ ਏਕ ਬਨਜਾਰਾ ॥੨੦੦॥"
page = 651

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When, passing through the forests, cities and mountains, they went forward, there they saw a trader coming.200."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਉਸ ਨੇ ਇਕ ਬਨਜਾਰਾ ਆਉਂਦਾ ਹੋਇਆ ਵੇਖਿਆ ॥੨੦੦॥"