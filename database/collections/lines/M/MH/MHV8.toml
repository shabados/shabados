[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛੋਡਹੁ ਪ੍ਰਾਣੀ; ਕੂੜ ਕਬਾੜਾ ॥"
page = 1025
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O mortal, eschew thou falsehood and idle talk."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੀਵ! ਤੂੰ ਝੂਠ ਅਤੇ ਵਿਹਲੀਆਂ ਗੱਲਾਂ ਨੂੰ ਤਿਆਗ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mortal, abandon falsehood and your worthless ways."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਾਣੀਓਂ! ਤੁਮ ਝੂਠੀਆਂ ਗੱਪਾਂ, ਭਾਵ ਬਿਅਰਥ ਬਾਤਾਂ ਕੋ ਤਿਆਗੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਾਣੀ! ਨਿਰੇ ਮਾਇਆ ਦੇ ਮੋਹ ਦੀਆਂ ਗੱਲਾਂ ਛੱਡੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੂੜ ਕਬਾੜਾ = ਕੂੜ ਦਾ ਕਬਾੜਾ, ਮਾਇਆ ਦੇ ਮੋਹ ਦੀਆਂ ਗੱਲਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hombres, abandonen sus formas falsas de vivir,"