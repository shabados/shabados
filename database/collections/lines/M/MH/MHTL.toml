[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਨ ਸੰਤਹ; ਮਾਥ ਮੋਰ ॥"
page = 987
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I place my forehead on the saints' feet,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣਾ ਮਸਤਕ ਸਾਧੂਆਂ ਦੇ ਪੈਰਾਂ ਤੇ ਰਖਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I lay my forehead on the feet of the Saints,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਮਾਥਾ ਸੰਤੋਂ ਕੇ ਚਰਨੋਂ ਊਪਰ ਹੋਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਮਿਹਰ ਕਰ) ਮੇਰਾ ਮੱਥਾ ਸੰਤਾਂ ਦੇ ਚਰਨਾਂ ਉਤੇ (ਪਿਆ ਰਹੇ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤਹ = ਸੰਤਾਂ ਦੇ। ਮਾਥ ਮੋਰ = ਮੇਰਾ ਮੱਥਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Añoro que mi frente descanse a los Pies de los Santos,"