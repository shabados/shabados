[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਮਨ; ਜਪੀਐ ਹਰਿ ਭਗਵੰਤਾ ॥"
page = 639
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, remember thou thy fortunate Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ! ਤੂੰ ਆਪਣੇ ਭਾਗਾਂ ਵਾਲੇ ਸਾਈਂ ਨੂੰ ਸਿਮਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, meditate on the Lord, the Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਹਰੀ ਭਗਵੰਤ ਕੇ ਨਾਮ ਕੋ ਜਪਣਾ ਕਰੀਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! (ਸਦਾ) ਹਰੀ ਭਗਵਾਨ ਦਾ ਨਾਮ ਜਪਣਾ ਚਾਹੀਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mente, medita en tu Dios,"