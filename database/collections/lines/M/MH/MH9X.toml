[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਲਿ ਸੰਗਤੀ; ਗੁਨ ਗਾਵਨੋ ॥੧॥"
page = 801
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting the society of saints I sing God's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿ ਸੰਗਤ ਨਾਲ ਮਿਲ ਕੇ ਮੈਂ ਹਰੀ ਦੀ ਮਹਿਮਾ ਗਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Joining the Sangat, the Holy Congregation, I sing the Glorious Praises of the Lord. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਸਾਧ ਸੰਗਤ ਮੇਂ ਤਿਸ ਵਾਹਿਗੁਰੂ ਕੇ ਗੁਣ ਗਾਇਨ ਕਰੇ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੁਣ) ਮੈਂ ਸਾਧ ਸੰਗਤਿ ਵਿਚ ਮਿਲ ਕੇ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੇ ਗੀਤ ਗਾਂਦਾ ਹਾਂ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਲਿ = ਮਿਲ ਕੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Uniéndome a la Sociedad de los Santos, canto su Alabanza. (1)"