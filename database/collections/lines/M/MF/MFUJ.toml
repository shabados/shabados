[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਿਵ ਮਾਹੁਰ ਰੰਭਾ ਸਭ ਲੋਕਨ ॥"
page = 164

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Shiva was given the poison and Rambha, the heavenly damsel, was given to al other people"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ਿਵ ਨੂੰ ਕਾਲ-ਕੂਟ ਜ਼ਹਿਰ ਅਤੇ ਸਾਰਿਆਂ ਲੋਕਾਂ ਨੂੰ ਰੰਭਾ ਅਤੇ ਅਪੱਛਰਾ ਦਿੱਤੀਆਂ"