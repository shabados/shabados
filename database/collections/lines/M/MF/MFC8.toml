[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਬਲ ਸੁ ਭਟਹਾ ਹਾਥ ਲੈ; ਜੀਤੇ ਸਮਰ ਸੁਰੇਸ ॥੫੩॥"
page = 720

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "was used by the mighty warriors Indra, taking it in his own hand for conquering the war.53."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ) ਬਲਸ਼ਾਲੀ 'ਭਟਹਾ' (ਬਰਛੀ) ਨੂੰ ਹੱਥ ਵਿਚ ਲੈ ਕੇ ਇੰਦਰ ਨੂੰ ਜੰਗ ਵਿਚ ਜਿਤਿਆ ਗਿਆ ਸੀ ॥੫੩॥"