[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਭਾਵੰਤੀ ਨਾਰਿ ਹੈ; ਗੁਰਮੁਖਿ ਗੁਣ ਗਾਇਆ ॥"
page = 162
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Glorious is the bride, who, through the Guru, sings the praises of God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਭਾਇਮਾਨ ਹੈ ਪਤਨੀ ਜੋ, ਗੁਰਾਂ ਦੁਆਰਾ ਵਾਹਿਗੁਰੂ ਦੀ ਮਹਿਮਾ ਗਾਇਨ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Glorious is that soul-bride, who as Gurmukh, sings the Glorious Praises of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਸਮਝ ਕਰ ਜਿਸ ਨੇ ਗੁਰੋਂ ਦ੍ਵਾਰਾ ਵਾਹਿਗੁਰੂ ਕੇ ਗੁਣੋਂ ਕੋ ਗਾਯਾ ਹੈ, ਸੋ ਜਗ੍ਯਾਸੂ ਰੂਪੀ ਇਸਤ੍ਰੀ ਸੋਭਾ ਵਾਲੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਜੀਵ-ਇਸਤ੍ਰੀ (ਲੋਕ ਪਰਲੋਕ ਵਿਚ) ਸੋਭਾ ਖੱਟਦੀ ਹੈ, ਜੇਹੜੀ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਗਾਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੋ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "así está escrito por el Señor. Gloriosa es la novia que canta las Alabanzas del Señor a través del Guru."