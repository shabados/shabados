language = "pa"
data = "ਉਹ ਬਖ਼ਸ਼ਿਸ਼ ਅਤੇ ਸਖ਼ਾਵਤ ਦੇ ਸਮੁੰਦਰ ਦਾ ਮੋਤੀ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਮਹੀਤਿ ਸਖ਼ਾ ਓ ਕਰਮ ਰਾ ਗੁਹਰ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "He is the pearl of the ocean of blessings and generosity,"