data = "ਮੰਡੇ ਸਸਤ੍ਰ ਧਾਰੰ ॥"
page = 244

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There were blows of arms and the edges of the weapons were sharpened"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ਸਤ੍ਰਾਂ ਦੀਆਂ ਧਾਰਾਵਾਂ (ਸੂਰਮਿਆਂ ਨੂੰ) ਕੱਟ ਰਹੀਆਂ ਹਨ।"