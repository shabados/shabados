[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਰ ਦਰ; ਫਿਰਿ ਥਾਕੀ ਬਹੁਤੇਰੇ ॥"
page = 932
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have grown weary of wandering at many houses and doors."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਘਣੇਰਿਆਂ ਘਰਾਂ ਅਤੇ ਬੂਹਿਆਂ ਤੇ ਭਟਕ ਕੇ ਹਾਰ ਹੰਭ ਗਈ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wandering to countless doorsteps and homes, I have grown weary."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੇਹ ਰੂਪ ਬਹੁਤੇ ਘਰੋਂ ਕੇ (ਦਰ) ਅੰਤਰ ਫਿਰਤੀ ਹੋਈ ਜੀਵ ਕਲਾ ਥਕ ਗਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪਾਂਡੇ! ਗੁਰੂ ਦੀ ਮੱਤ ਵਾਲਾ ਰਸਤਾ ਫੜਨ ਤੋਂ ਬਿਨਾ) ਜਿੰਦ ਕਈ ਜੂਨਾਂ ਵਿਚ ਭੌਂ ਭੌਂ ਕੇ ਖਪ ਲੱਥਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਰ ਦਰ ਬਹੁਤੇਰੇ = ਬਥੇਰੇ ਘਰਾਂ ਦੇ ਦਰਵਾਜ਼ੇ, ਕਈ ਜੂਨਾਂ। ਫਿਰਿ ਥਾਕੀ = (ਜੀਵ-ਇਸਤ੍ਰੀ (ਭੌਂ ਭੌਂ ਕੇ ਖਪ ਲੱਥੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "He venido al mundo y pasado a través de incontables formas;"