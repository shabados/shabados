[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਟੋਪ ਪਟੇਲਾ ਪਾਖਰਾਂ, ਗਲਿ ਸੰਜ ਸਵਾਰੇ ॥"
page = 127

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They have bedecked themselves with helmets on their heads, and armour around their necks alongwith their horse-sddles with belts."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਸਿਰਾਂ ਉਤੇ) ਟੋਪ, (ਮੂੰਹ ਤੇ) ਪਟੇਲ, (ਘੋੜੇ ਉਤੇ) ਪਾਖਰ ਅਤੇ ਗਲ ਵਿਚ ਕਵਚ ਪਾਏ ਹੋਏ ਸਨ।"