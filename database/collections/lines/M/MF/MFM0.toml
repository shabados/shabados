[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਅਪਸਰਾ ਇੰਦ੍ਰ ਕੇ; ਜਾਤ ਸਿੰਗਾਰ ਬਨਾਇ ॥"
page = 812

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "A fairy, bedecking herself, was ready to go to Indra, the Celestial Raja of the Rajas,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਅਪੱਛਰਾ ਸ਼ਿੰਗਾਰ ਕਰ ਕੇ ਇੰਦਰ ਪਾਸ ਜਾ ਰਹੀ ਸੀ।"