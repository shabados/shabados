[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਕੀਮਤਿ; ਕਹਨੁ ਨ ਜਾਇ ॥੭॥"
page = 279
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, his worth cannot be told."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਉਸ ਦਾ ਮੁੱਲ ਦਸਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, His worth cannot be estimated. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਕੀ ਕੀਮਿਤ ਕਹੀ ਨਹੀਂ ਜਾਤੀ ਹੈ॥੭॥☬ਤਾਂ ਤੇ ਤਿਸ ਆਗੇ ਐਸੇ ਬੇਨਤੀ ਕਰੋ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਦਾ ਮੁੱਲ ਦੱਸਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ ॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀਮਤਿ = ਮੁੱਲ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nada existe que pueda Medirlo.(7)"