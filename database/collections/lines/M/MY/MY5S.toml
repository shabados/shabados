type = "primary"
data = "ਕਰਣੀ ਕੀਰਤਿ ਹੋਈ ॥"
page = 599
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The noblest deed is the Lord's praise,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਪੁੰਨ ਕਰਮ ਸਾਹਿਬ ਦੀ ਸਿਫ਼ਤ-ਸਲਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The noblest deed is to sing the Lord's Praises,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੀ ਸ਼ੁਭ ਕਰਨੀ ਕੀ ਕੀਰਤ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ (ਸ੍ਰੇਸ਼ਟ) ਕਾਰ ਉਦੋਂ ਮਿਲ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀਰਤਿ = ਸਿਫ਼ਤ-ਸਾਲਾਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Esta acción es la Alabanza del Señor, de la cuál uno toma Conciencia cuando el Señor,"