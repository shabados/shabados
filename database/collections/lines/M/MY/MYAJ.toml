data = "ਔਰ ਮਿਤ੍ਰ ਤਨ ਪ੍ਰਗਟ ਨ ਭਾਖ︀ਯੋ ॥"
page = 911

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He kept the secret in his heart and did not divulge to any friend."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਿਸੇ ਵੀ ਹੋਰ ਮਿਤਰ ਨੂੰ ਸਾਫ਼ ਨਾ ਦਸਿਆ।"