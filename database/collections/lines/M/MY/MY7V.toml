[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਕਿਛੁ ਕੀਆ; ਸੋ ਕਿਛੁ ਕਰੈ ॥"
page = 878
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who has created all this, He alone does everything, which happens."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਇਹ ਸਾਰਾ ਕੁਝ ਰਚਿਆਹ ਹੈ, ਉਹੀ ਇਹ ਸਾਰਾ ਕੁਝ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One who created everything, does everything."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਕਛੂ ਸਾਧਨ ਸੰਚੈ ਕੀਆ ਹੈ, ਸੋਈ ਪੁਰਸ ਕਛੂ ਬੀਚਾਰ ਕੋ ਕਰੇ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪਰਮਾਤਮਾ ਨੇ ਇਹ ਜਗਤ-ਰਚਨਾ ਬਣਾਈ, ਜੀਵਾਂ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪ੍ਰੇਮ ਦੀ ਖੇਡ ਭੀ ਉਹ ਆਪ ਹੀ ਖੇਡਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਪਰਮਾਤਮਾ) ਨੇ। ਸੋ = ਉਹੀ ਪਰਮਾਤਮਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Dios, Quien ha creado todo, es la Causa de cuanto ocurre, y sólo Él evalúa Su Propio Ser."