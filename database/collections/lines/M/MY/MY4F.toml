[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਤਿਗੁਰ ਸਿਖਾਂ, ਸਚੁ ਪਰੀਤੇ ॥੨੩॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The Sikh's true love is for the Guru alone."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਇਸੇ ਕਰਕੇ) ਸਤਿਗੁਰੂ (ਗੁਰੂ ਨਾਨਕ) ਨਾਲ ਸਿਖਾਂ ਦੀ ਸੱਚੀ ਪ੍ਰੀਤ ਹੈ।"