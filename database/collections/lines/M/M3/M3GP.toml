[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕੀ ਕੀਮਤਿ; ਕਹੀ. ਨ ਜਾਈ ॥੧॥"
page = 629
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that its worth cannot be told."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਮੁੱਲ ਆਖਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His value cannot be described. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਤਿਨ ਗੁਰੋਂ ਕੀ ਕੀਮਤ ਹਮਾਰੇ ਸੇ ਕਹੀ ਨਹੀਂ ਜਾਤੀ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਬਖ਼ਸ਼ਸ਼ ਦਾ ਮੁੱਲ ਨਹੀਂ ਪੈ ਸਕਦਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕੀ = ਉਸ (ਪੂਰੇ ਗੁਰੂ ਦੀ ਬਖ਼ਸ਼ਸ਼) ਦੀ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuyo Valor no lo puedo apreciar. (1)"