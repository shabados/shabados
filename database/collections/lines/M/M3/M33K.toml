[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭੁ ਬ੍ਰਹਮ ਪਸਾਰੁ ਪਸਾਰਿਓ; ਆਪੇ ਖੇਲੰਤਾ ॥"
page = 1095
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Supreme Lord, Thou has spread the entire universe and Thyself play in it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸ੍ਰੋਮਣੀ ਸਾਹਿਬ! ਤੂੰ ਹੀ ਸਾਰੇ ਆਲਮ ਨੂੰ ਫੈਲਾਇਆ ਹੈ ਅਤੇ ਆਪ ਹੀ ਇਸ ਅੰਦਰ ਖੇਡਦਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God spreads out the expanse of the entire universe, and He Himself plays in it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਬ੍ਯਾਪਕ! ਤੈਨੇ ਹੀ ਸਭ ਸੰਸਾਰ ਪਸਾਰੇ ਕੋ ਪਸਾਰਿਆ ਹੈ ਔ ਆਪ ਹੀ ਤਿਸ ਕੇ ਬੀਚ ਖੇਲ ਰਹਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਾਰਾ ਜਗਤ-ਖਿਲਾਰਾ ਤੂੰ ਆਪ ਹੀ ਖਿਲਾਰਿਆ ਹੋਇਆ ਹੈ, ਤੂੰ ਆਪ ਹੀ ਇਹ ਜਗਤ-ਖੇਡ ਖੇਡ ਰਿਹਾ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Universo entero es Tu Manifestación y eres Quien la sostiene."