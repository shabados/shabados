[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਊਪਰਿ ਹੋਵਤ ਦਇਆਲੁ ॥"
page = 807
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "One unto whom the Lord becomes merciful,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਉਤੇ ਸੁਆਮੀ ਮਿਹਰਬਾਨ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who is blessed by the Lord's Mercy,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਜਨ ਊਪਰ ਹਰੀ ਦਯਾਲੂ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ) ਜਿਸ ਮਨੁੱਖ ਉੱਤੇ ਦਇਆਵਾਨ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸੁ ਊਪਰਿ = ਜਿਸ (ਮਨੁੱਖ) ਉੱਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél, con quien el Señor es Compasivo,"