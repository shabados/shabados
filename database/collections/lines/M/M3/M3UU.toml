[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਿ ਅੰਧੈ. ਊਂਧੈ ਕਵਲ; ਦਿਸਨਿ ਖਰੇ ਕਰੂਪ ॥"
page = 1411
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through blind mind and reversed heart lotus, they look extremely ugly."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਨ੍ਹੇ ਮਨੂਏ ਅਤੇ ਮੂਧੇ ਹੋਏ ਹੋਏ ਦਿਲ ਕਮਲ ਰਾਹੀਂ ਉਹ ਨਿਹਾਇਤ ਹੀ ਕੋਝੇ ਦਿਸਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "With their blind minds, and their upside-down heart-lotus, they look totally ugly."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਜੋ ਮਨ ਕੇ ਅੰਧੇ ਹੈਂ ਤਿਨ ਕੇ ਹਿਰਦੇ ਕਮਲ ਗਿਆਨ ਵਈਰਾਗ ਸੇ (ਊਂਧੇ) ਉਲਟੇ ਹੂਏ ਹੈਂ, ਤਾਂ ਤੇ ਵਹੁ ਖਰੇ ਕਰੂਪ, ਭਾਵ ਅਤੀ ਭੈਦਾਯਕ ਦ੍ਰਿਸ਼ਟ ਆਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨ ਅੰਨ੍ਹਾ ਹੋਣ ਕਰਕੇ, ਹਿਰਦਾ ਕੇਵਲ (ਧਰਮ ਵਲੋਂ) ਉਲਟਿਆ ਹੋਇਆ ਹੋਣ ਦੇ ਕਾਰਨ ਉਹ ਬੰਦੇ ਬਹੁਤ ਕੋਝੇ (ਕੋਝੇ ਜੀਵਨ ਵਾਲੇ) ਲੱਗਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ ਅੰਧੈ = ਅੰਨ੍ਹੇ ਮਨ ਦੇ ਕਾਰਨ। ਊਂਧੈ ਕਵਲ = ਉਲਟੇ ਹੋਏ (ਹਿਰਦੇ-) ਕੰਵਲ ਦੇ ਕਾਰਨ। ਖਰੇ ਕਰੂਪ = ਬਹੁਤ ਕੋਝੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "con su mente ciega y el Loto de su corazón volteado al revés, se ven horribles."