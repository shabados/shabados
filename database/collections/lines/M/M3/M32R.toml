[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਨਾਮ ਤੁਪਕ ਕੇ ਸਕਲ; ਚਤੁਰ ਪਹਿਚਾਨੀਐ ॥੭੬੯॥"
page = 756

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Mentioning firstly “Tran-haa-ripu”, then adding the words “Naath Shatru”, recognize the names of Tupak.769."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਤਰ੍ਹਾਂ) ਤੁਪਕ ਦਾ ਨਾਮ ਬਣ ਜਾਏਗਾ। ਸਾਰੇ ਸੂਝਵਾਨ ਸਮਝ ਲੈਣ ॥੭੬੯॥"