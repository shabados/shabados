[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਸਾ ਵਿਚਿ ਸੁਤੇ; ਕਈ ਲੋਈ ॥"
page = 423
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many a man are asleep in hopes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਸਾਰੇ ਲੋਕ ਉਮੈਦ ਅੰਦਰ ਸੁੱਤੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So many are asleep in hope."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਸਾ ਰੂਪ ਨਿੰਦ੍ਰਾ ਮੇਂ ਕਈ ਲੋਕ ਵਾਲੋਂ ਕੋ ਵਾਲੇ ਇੰਦ੍ਰ, ਬਰਨ, ਕੁਬੇਰਾਦਿ ਸੋਏ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬੇਅੰਤ ਲੁਕਾਈ ਆਸਾਂ (ਦੇ ਜਾਲ) ਵਿਚ (ਫਸ ਕੇ ਮਾਇਆ ਦੇ ਮੋਹ ਦੀ ਨੀਂਦ ਵਿਚ) ਸੁੱਤੀ ਪਈ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੋਈ = ਲੋਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Muchos se han adormecido por falsas esperanzas"