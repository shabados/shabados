[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੀਨੋ ਉਮਰ ਖਿਤਾਬ ਜਿਮਿ ਆਜੁ ਹਮਾਰੋ ਨ︀ਯਾਉ ॥੨੭॥"
page = 858

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘To day he has done the justice according the Holy Book.(27)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ (ਕਾਜ਼ੀ ਨੇ) ਉਮਰ ਖ਼ਿਤਾਬ (ਖ਼ਲੀਫ਼ਾ) ਵਰਗਾ ਸਾਡਾ ਨਿਆਂ ਕੀਤਾ ਹੈ ॥੨੭॥"