[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਬ ਤੇ; ਮਿਟੇ ਤਾਪ ਹਾਂ ॥"
page = 410
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "since then my suffering have ceased."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਦੋਂ ਤੋਂ ਮੇਰੇ ਦੁਖੜੇ ਦੁਰ ਹੋ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "my sufferings have ended."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਸੇ ਸਭ ਪ੍ਰਕਾਰ ਕੇ ਤਾਪ ਮਿਟੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇ ਗੁਰੂ ਦੀ ਓਟ ਠੀਕ ਜਾਪਦੀ ਹੈ) ਉਸੇ ਵੇਲੇ ਤੋਂ (ਮਨ ਦੇ) ਸਾਰੇ ਦੁੱਖ-ਕਲੇਸ਼ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾਪ = ਦੁੱਖ-ਕਲੇਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y mis aflicciones han cesado."