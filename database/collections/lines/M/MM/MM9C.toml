[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਹੀ ਕਾਚੀ; ਕਾਗਦ ਮਿਕਦਾਰਾ ॥"
page = 1048
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The body is perishable like the paper."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਾਗਜ਼ ਮਾਨੰਦ, ਸਰੀਰ ਨਾਸਵੰਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The body is frail and perishable, like paper."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੇਹੀ ਕਾਚੀ ਕਾਗਦ ਕੇ ਤੁਲ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਦਾ ਇਹ ਸਰੀਰ ਕਾਗ਼ਜ਼ ਵਾਂਗ ਨਾਸਵੰਤ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਹੀ = ਸਰੀਰ। ਕਾਚੀ = ਨਾਸਵੰਤ। ਕਾਗਦ ਮਿਕਦਾਰਾ = ਕਾਗ਼ਜ਼ ਵਾਂਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El cuerpo es inestable como el papel"