[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਰੇ; ਨਾਮ ਕੋ ਸੁਖ ਸਾਰ ॥"
page = 1223
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, sublime peace is in the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ! ਸਰੇਸ਼ਟ ਆਰਾਮ ਹੈ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਅੰਦਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, the Naam is the most sublime peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਨਾਮ ਕੋ ਜਪਨੇ ਕਰ ਸਾਰ ਸੁਖ ਪ੍ਰਾਪਤ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਮਨ! ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਨ ਦਾ ਸੁਖ (ਹੋਰ ਸੁਖਾਂ ਨਾਲੋਂ) ਸ੍ਰੇਸ਼ਟ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ ਰੇ = ਹੇ ਮਨ! ਕੋ = ਦਾ। ਸਾਰ = ਸ੍ਰੇਸ਼ਟ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, la Paz Verdadera está en el Nombre del Señor, y lo que sea que haga uno,"