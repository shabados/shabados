data = "ਦਰੇਗਾ ਨ ਕੈਬਰ ਕਮਾ ਅੰਦਰੂੰ ॥੩੮॥"
page = 1416

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Alas, I cannot keep my arrow contained in my bow.(38)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਫ਼ਸੋਸ ਹੈ ਕਿ ਮੈਂ ਕਮਾਨ ਵਿਚ ਤੀਰ ਨਹੀਂ ਰਖ ਸਕਿਆ ॥੩੮॥"