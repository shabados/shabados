[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬ ਕੁਸ਼ਤਨ ਅਦੂਰਾ ਕਿ ਖ਼ੰਜਰ ਕੁਸ਼ਾਦ ॥੧੧੪॥"
page = 1422

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And she drew her dagger out of scabbard with great gusto.(114)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਵੈਰੀ ਨੂੰ ਮਾਰਨ ਲਈ ਖ਼ੰਜਰ ਨੂੰ ਖਿਚਿਆ ਹੋਇਆ ਸੀ ॥੧੧੪॥"