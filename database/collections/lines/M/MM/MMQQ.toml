type = "primary"
data = "ਰਿਖੀਸ ਈਸ ਲੋਭੀਯੰ ॥"
page = 135

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Therefore the great sages and Shiva are covetous to have Thy Sight."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਨੂੰ ਵੇਖਣ ਲਈ) ਰਿਸ਼ੀ ਅਤੇ ਸ਼ਿਵ ਲੁਭਾਇਮਾਨ ਹੋ ਰਹੇ ਹਨ;"