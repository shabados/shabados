[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਮਦੂਤੁ; ਤਿਸੁ ਨਿਕਟਿ. ਨ ਆਵੈ ॥"
page = 1079
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The myrmidon of death comes not near him,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੌਤ ਦਾ ਫਰੇਸ਼ਤਾ ਉਸ ਦੇ ਨੇੜੇ ਨਹੀਂ ਆਉਂਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Messenger of Death does not even approach that person"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਨੇੜੇ ਜਮਦੂਤ ਨਹੀਂ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਮਦੂਤ ਵੀ ਉਸ ਮਨੁੱਖ ਦੇ ਨੇੜੇ ਨਹੀਂ ਆ ਸਕਦਾ (ਮੌਤ ਉਸ ਨੂੰ ਡਰਾ ਨਹੀਂ ਸਕਦੀ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਕਟਿ = ਨੇੜੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mensajero de Yama no visita a quien, asociándose con los Santos, canta Tu Alabanza."