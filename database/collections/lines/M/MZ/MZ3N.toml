[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨ ਘਰਿ; ਬ੍ਰਹਮਣ ਪੂਰਹਿ ਨਾਦ ॥"
page = 471
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In their home the Brahmans sound the couch."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੇ ਗ੍ਰਹਿ ਵਿੱਚ ਬ੍ਰਾਹਮਣ ਸੰਖ ਵਜਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In their homes, the Brahmins sound the conch."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨਹੀ ਕੇ ਘਰ ਮੇਂ ਬ੍ਰਹਮਨ ਜਾਇ ਕਰ ਪੂਜਾ ਕਰ ਸੰਖ ਬਜਾਉਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹਨਾਂ (ਜ਼ਾਲਮ ਖੱਤ੍ਰੀਆਂ) ਦੇ ਘਰ ਵਿਚ ਬ੍ਰਾਹਮਣ ਜਾ ਕੇ ਸੰਖ ਵਜਾਂਦੇ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਨ ਘਰਿ = ਉਹਨਾਂ (ਖੱਤ੍ਰੀਆਂ) ਦੇ ਘਰਾਂ ਵਿਚ। ਪੂਰਹਿ ਨਾਦ = ਨਾਦ ਪੂਰਦੇ ਹਨ, ਸੰਖ ਵਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y en sus hogares soplan la concha del Brahmán para su oración,"