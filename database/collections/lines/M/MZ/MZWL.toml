[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਸੁਘਰ, ਪਛਾਨ ॥੫੩੬॥"
page = 741

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Nishangni” and then adding “Ripou Ari” at the end, the names of Tupak are formed.536."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤੁਪਕ ਦਾ ਨਾਮ ਹੋ ਜਾਏਗਾ। ਸੁਜਾਨੋ! ਸਮਝ ਲਵੋ ॥੫੩੬॥"