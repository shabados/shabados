[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਹਿਮਾ ਸੁੰਦਰ; ਸਦਾ ਬੇਅੰਤ ॥੩॥"
page = 393
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His greatness is beauteous and ever limitless."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਵਿਸ਼ਾਲਤਾ ਸੋਹਣੀ ਅਤੇ ਹਮੇਸ਼ਾਂ ਹੀ ਬੇਓੜਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His Greatness is so beautiful, and ever limitless. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ ਤਿਸ ਚੈਤੰਨ ਦੇਵ ਕੀ ਸੋਭਾ ਸਰਬਦਾ ਕਾਲ ਸੁੰਦ੍ਰ ਹੈ ਔਰ ਅੰਤ ਸੇ ਰਹਤ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਬੇਅੰਤ ਤੇ ਸੁੰਦਰ (ਹਰਿ-ਸਾਲਗਿਰਾਮ) ਦੀ ਸਦਾ ਮਹਿਮਾ ਹੋ ਰਹੀ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਹਿਮਾ = ਵਡਿਆਈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, su Grandeza es gloriosa y sin límite para siempre. (3)"