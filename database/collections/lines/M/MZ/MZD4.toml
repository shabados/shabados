[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜੀਉ; ਇਉ ਪਿਰੁ ਰਾਵੈ ਨਾਰਿ ॥"
page = 54
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Like this, venerable Lord, the Consort, enjoys the bride."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਪੂਜਯ ਪ੍ਰਭੂ ਪਤੀ ਪਤਨੀ ਨੂੰ ਮਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In this way, the Dear Husband Lord ravishes and enjoys His bride."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹਰਿ ਜੀ ਪਿਰ ਕੋ ਜੀਵ ਰੂਪੀ ਇਸਤ੍ਰੀ ਇਉਂ ਰਾਵੇ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਜੀ! ਇਹ ਸਰਧਾ ਧਾਰਿਆਂ ??? ਪ੍ਰਭੂ-ਪਤੀ ਜੀਵ-ਇਸਤ੍ਰੀ ਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ ਜੀਉ = ਹੇ ਪ੍ਰਭੂ ਜੀ! ਇਉ = ਇਸ ਤਰੀਕੇ ਨਾਲ, ਇਸ ਸਰਧਾ ਨਾਲ, ਇਹ ਸਰਧਾ ਧਾਰਿਆਂ। ਰਾਵੈ = ਮਾਣਦਾ ਹੈ, ਮਿਲਦਾ ਹੈ, ਪਿਆਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Esposo goza de su esposa, de quien gusta."