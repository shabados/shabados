[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਜਮ ਕਾ ਮਾਰਗੁ ਭਾਗਾ ॥"
page = 599
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then death's path recedes away from him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਮੌਤ ਦਾ ਰਾਹ ਉਸ ਤੋਂ ਪਰੇ ਹੱਟ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then the Path of Death recedes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਜਮ ਮਾਰਗ ਕਾ ਭੈ ਭਾਗਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਉਸ ਮਨੁੱਖ ਦਾ ਉਹ ਜੀਵਨ-ਰਸਤਾ ਖ਼ਤਮ ਹੋ ਜਾਂਦਾ ਹੈ ਜਿਸ ਤੇ ਤੁਰਿਆਂ ਆਤਮਕ ਮੌਤ ਹੋ ਰਹੀ ਸੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਰਗੁ = ਰਸਤਾ। ਜਮ ਕਾ ਮਾਰਗੁ = ਉਹ ਜੀਵਨ-ਰਸਤਾ ਜੋ ਆਤਮਕ ਮੌਤ ਵਲ ਲੈ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "deja de caminar por el sendero de la muerte. En la Reverencia a Dios,"