[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਪੰਥੁ ਨਿਰੋਲੁ, ਨ ਰੋਲਣਿ ਰੋਲੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The way of gurmukh is clear and distinct; it cannot be subsumed and dissipated by any one."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾਂ ਦਾ ਪੰਥ ਸੁਧ ਹੈ, (ਕਿਸੇ ਦੇ) ਰੁਲਾਇਆ ਰੁਲਦਾ ਨਹੀਂ।"