[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਤ ਦੈਤ ਕੀ ਸੁੰਭ ਸੁਨਿ; ਬੋਲਿਓ ਕਛੁ ਮੁਸਕਾਤ ॥"
page = 84

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Hearing the words of the demon, the king Sumbh said smilingly,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ) ਦੈਂਤ ਦੀ ਗੱਲ ਸੁਣ ਕੇ ਰਾਜਾ ਸੁੰਭ ਕੁਝ ਮੁਸਕਰਾ ਕੇ ਕਹਿਣ ਲਗਾ"