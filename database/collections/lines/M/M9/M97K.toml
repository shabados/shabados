[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਏਕੋ ਰਵਿ ਰਹਿਆ ਨਿਰਬਾਨੀ ॥੭॥"
page = 904
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then realises he the One Detached Lord, pervading all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਉਹ ਇਕ ਨਿਰਲੇਪ ਸੁਆਮੀ ਨੂੰ ਸਾਰੇ ਵਿਆਪਕ ਅਨੁਭਵ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The One Lord is permeating and pervading everywhere in Nirvaanaa. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿ ਏਕ ਹੀ ਨਿਰਬਾਨ ਰਵਿ ਰਿਹਾ ਹੈ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਵਾਸਨਾ-ਰਹਿਤ ਪ੍ਰਭੂ ਇਹੋ ਜਿਹਾ ਹੈ ਕਿ ਉਹ ਆਪ ਹੀ ਹਰ ਥਾਂ ਵਿਆਪਕ ਹੈ ॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰਬਾਨੀ = ਵਾਸਨਾ-ਰਹਿਤ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entonces uno ve al Señor en el Nirvana, prevaleciendo en todo y por todas partes. (7)"