[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਨਾਮੁ ਰਖਹੁ ਉਰ ਧਾਰਿ ॥"
page = 841
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Nanak, keep thou the Lord's Name clasped to thy heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਤੂੰ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਨੂੰ ਆਪਣੇ ਦਿਲ ਨਾਲ ਲਾਈ ਰੱਖ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, enshrine the Naam within your heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਭਾਈ! ਨਾਮ ਕੋ ਰਿਦੇ ਮੇਂ ਧਾਰਨ ਕਰ ਰਾਖੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਆਖ-ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਵਸਾਈ ਰੱਖੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਰ = ਹਿਰਦਾ। ਉਰ ਧਾਰਿ = ਹਿਰਦੇ ਵਿਚ ਟਿਕਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y eleva el Nombre del Señor en tu corazón"