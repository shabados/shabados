[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਠ ਪਹਰ; ਮਨ ਤਾ ਕਉ ਜਾਪਿ ॥"
page = 896
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Throughout the eight watches of the day, O my soul, meditate thou on Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਦੇ ਅੱਠੇ ਪਹਿਰ ਹੀ, ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਤੂੰ ਉਸ ਦਾ ਭਜਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Twenty-four hours a day, O mind, meditate on Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੋ ਆਠ ਪਹਿਰ ਮਨ ਕਰ ਕੇ ਜਪਤਾ ਰਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਅੱਠੇ ਪਹਿਰ ਉਸ ਨੂੰ ਜਪਿਆ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕਉ = ਉਸ (ਪ੍ਰਭੂ) ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "habita en Él, oh mente mía, por siempre y para siempre."