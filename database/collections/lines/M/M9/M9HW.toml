[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੈ ਸਬਦਿ; ਸਚਿ ਸਮਾਇ ॥੧॥"
page = 560
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the True Name one merges in the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਨਾਮ ਦੇ ਰਾਹੀਂ ਬੰਦਾ ਸੱਚੇ ਸੁਆਮੀ ਵਿੱਚ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Shabad, the True Word of God, one merges in the True Lord. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਚੇ ਗੁਰ ਉਪਦੇਸ ਕਰ ਸਚ ਰੂਪ ਪਰਮੇਸਰ ਮੇਂ ਸਮਾਇ ਜਾਈਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸਚੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ ਤੂੰ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਵਿੱਚ ਸਮਾ ਜਾਏਂ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੈ ਸਬਦਿ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਵਾਲੇ ਗੁਰ-ਸ਼ਬਦ ਵਿਚ। ਸਚਿ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਵਿਚ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "uno se inmerge en la Verdad. (1)"