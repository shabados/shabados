[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਟੁੰਡੇ ਬਾਂਡੇ ਕੇਤੜੇ; ਗੰਜੇ ਲੁੰਜੇ ਕੋੜ੍ਹੀ ਜਾਣੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many are maimed ones, bald, without hands and stricken with leprosy."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਿਨੇ ਟੁੰਡੇ, ਬਾਂਡੇ, ਗੰਜੇ, ਕੋੜ੍ਹੀ ਜਾਣੀ ਦੇ ਹਨ।"