[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਫੁਨਿ ਅਰਿ ਸਬਦ ਉਚਾਰੀਐ; ਜਾਨ ਤਿਸੈ ਤਰਵਾਰਿ ॥੪੪॥"
page = 719

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then speaking “Ar”, the resultant words mean Talwaar (sword).44."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਿਰ 'ਅਰਿ' ਸ਼ਬਦ ਉਚਾਰਿਆ ਜਾਵੇ। (ਤਾਂ) ਉਸ ਨੂੰ ਤਲਵਾਰ ਦਾ (ਦਾ ਨਾਮ) ਸਮਝ ਲਿਆ ਜਾਵੇ ॥੪੪॥"