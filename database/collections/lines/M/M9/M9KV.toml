data = "ਉਮਲ ਲਥੇ ਸੂਰਮੇ; ਮਾਰ ਮਚੀ ਕਰਾਰੀ ॥"
page = 122

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The fighters entered the field enthusiastically and there occurred formidable fighting."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਯੁੱਧ-ਭੂਮੀ ਵਿਚ) ਉਤਸਾਹ ਨਾਲ ਭਰੇ ਹੋਏ ਸੂਰਮੇ ਉਤਰ ਆਏ ਅਤੇ ਤਕੜੀ ਮਾਰ-ਕਾਟ ਸ਼ੁਰੂ ਹੋ ਗਈ।"