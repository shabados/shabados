[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵੰਝੁਲੀਐ ਝੀਗਾਰਿ, ਮਜਲਸਿ ਮਾਣੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "On the tune of flute (the unstruck melody) they go on enjoying the delight of the assembly."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਤਦੋਂ ਮਾਹੀ ਲੋਕ) ਵੰਝਲੀਆਂ ਦੀ ਧੁਨੀ ਲਾਕੇ ਮਜਲਸ ਵਿਖੇ ਮੌਜਾਂ ਮਾਣਦੇ ਹਨ।"