[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੋਸਾਈ ਸੇਵੀ; ਸਚੜਾ ॥"
page = 73
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I serve the True Lord of the universe."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਸੱਚੇ ਸੁਆਮੀ ਦੀ ਟਹਿਲ ਕਮਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I serve the True Lord of the Universe."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਚਾ ਗੁਸਾਂਈ ਪ੍ਰਿਥ੍ਵੀ ਕੇ ਮਾਲਕ! ਮੈਂ ਆਪ ਕਾ ਸੇਵਨ ਕਰਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਮਾਲਕ ਪ੍ਰਭੂ ਨੂੰ ਹੀ ਸਿਮਰਦਾ ਰਹਿੰਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵੀ = ਸੇਵੀਂ, ਮੈਂ ਸਿਮਰਦਾ ਹਾਂ। ਸਚੜਾ = ਸੱਚੜਾ, ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ahora habito sólo en el Señor Verdadero."