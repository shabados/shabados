[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮ; ਗਰੀਬ ਨਿਵਾਜ ॥"
page = 277
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Transcendent Lord is the Patroniser of the humble."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ-ਪ੍ਰਭੂ ਮਸਕੀਨਾਂ ਨੂੰ ਮਾਣ ਬਖਸ਼ਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Lord God is the Protector of the humble."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਪਾਰਬ੍ਰਹਮ ਗਰੀਬ ਨਿਵਾਜ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਗ਼ਰੀਬਾਂ ਤੇ ਮੇਹਰ ਕਰਨ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਵਾਜ = ਮੇਹਰ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En verdad que el Señor trasciende todo lo creado y es el Protector de los desvalidos."