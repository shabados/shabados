[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਨਾਮੁ ਪਦਾਰਥੁ ਲੇਇ ॥"
page = 1069
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the Guru's grace one obtains the Name's wealth,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ, ਬੰਦਾ ਨਾਮ ਦੀ ਦੌਲਤ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh receives the wealth of the Naam."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਸੇ ਗੁਰਮੁਖ ਨਾਮ ਪਦਾਰਥ ਕੋ ਲੇਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਰਾਹੀਂ ਇਹ ਕੀਮਤੀ ਨਾਮ ਹਾਸਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੇਇ = ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ese ser es bendecido y logra el objeto de su vida, el Nombre."