data = "ਆਪਿ ਤਵਨ ਕੀ ਓਰ ਸਿਧਾਯੋ ॥"
page = 63

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Bhim Chnad called me for assistance and himself went to face (the enemy)."

[[content]]
