type = "primary"
data = "ਚਹਾਰੋ ਸ਼ਹੇ ਪੇਸ਼ ਪਿਸਰਾ ਬੁਖਾਦ ॥"
page = 1394

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘This, what you have asked, is beyond my faculty."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਚੌਹਾਂ ਪੁੱਤਰਾਂ ਨੂੰ ਰਾਜੇ ਨੇ ਆਪਣੇ ਪਾਸ ਬੁਲਾਇਆ"