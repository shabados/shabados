[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਦੂਖ ਕਾ; ਹੋਵਤ ਨਾਸੁ ॥"
page = 290
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Utter thou the Name of the Lord of excellences,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਗੁਣਾ ਦੇ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਣ ਕਰ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All sorrows shall vanish."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਸੰਪੂਰਨ ਦੁਖੋਂ ਕਾ ਜਿਸ ਨਾਮ ਸੇ ਨਾਸ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇ) ਸਾਰੇ ਦੁੱਖਾਂ ਦਾ ਨਾਸ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "estabilizar su mente y liberarse para siempre de la aflicción."