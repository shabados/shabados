[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੋਟੀ ਜਾਣ ਦਿਖਾਈ, ਤਾਰੇ ਧੂਮਕੇਤ ॥੧੦॥"
page = 121

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "It appears that Dhumketu (the shooting star) had displayed its top-knot.10."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਬੋਦੀ ਵਾਲੇ (ਧੂਮ ਕੇਤੂ) ਤਾਰੇ ਨੇ ਚੋਟੀ ਵਿਖਾਈ ਹੋਵੇ ॥੧੦॥"