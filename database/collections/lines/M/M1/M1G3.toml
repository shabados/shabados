[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਉਥੇ ਪਦ ਕਉ; ਜੇ ਮਨੁ ਪਤੀਆਏ ॥੭॥"
page = 686
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that mortal in attuned to the fourth state of mind,."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਪ੍ਰਾਣੀ ਚੌਥੀ ਅਵਸਤਾ ਨਾਲ ਪ੍ਰਸੰਨ ਥੀ ਜਾਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "when one centers his mind in the fourth state. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ (ਚੌਥੇ) ਤੁਰੀਆ ਪਦੁ ਕੋ ਅੰਤਸ਼ਕਰਨ ਮੇਂ ਪਤੀਆਏ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਉਹ (ਗੁਰੂ ਦੀ ਸਰਨ ਵਿਚ ਰਹਿ ਕੇ) ਆਪਣੇ ਮਨ ਨੂੰ ਉਸ ਆਤਮਕ ਅਵਸਥਾ ਵਿਚ ਗਿਝਾ ਲਏ ਜਿਥੇ ਮਾਇਆ ਦੇ ਤਿੰਨੇ ਹੀ ਗੁਣ ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕਦੇ ॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਉਥਾ ਪਦ = ਉਹ ਆਤਮਕ ਅਵਸਥਾ ਜਿਥੇ ਮਾਇਆ ਦੇ ਤਿੰਨ ਗੁਣ ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕਦੇ। ਪਤੀਆਇ = ਗਿਝਾ ਲਏ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sólo si su mente está complacida con el Cuarto Estado de Éxtasis. (7)"