[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੂਕਰ ਸੁਆਨ ਗਰਧਭ ਮੰਜਾਰਾ ॥"
page = 832
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "One is a swine, a dog, a donkey a cat,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੂਰ, ਕੁੱਤਾ, ਖੋਤਾ, ਬਿਲਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The human is a pig, a dog, a donkey, a cat,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸੂਕਰ) ਸੂਰ ਔ (ਕੂਕਰ) ਕੁਤੇ, (ਗਰਧਪ) ਗਧੇ, (ਮੰਜਾਰਾ) ਬਿਲੇ ਆਦੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਮਨੁੱਖਾਂ ਨੂੰ ਸੂਰ, ਕੁੱਤੇ, ਖੋਤੇ, ਬਿੱਲੇ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੂਕਰ = ਸੂਰ। ਸੁਆਨ = ਕੁੱਤੇ। ਗਰਧਭ = ਖੋਤੇ। ਮੰਜਾਰਾ = ਬਿੱਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ese ser es como un puerco, un perro, un gato o un asno;"