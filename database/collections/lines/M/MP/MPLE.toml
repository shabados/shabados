[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਕਤ; ਹਰਿ ਹਰਿ ਚੀਤਿ. ਨ ਆਇਆ ॥੧॥"
page = 1136
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "even then he remembers not the Lord Master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਭੀ ਉਹ ਸੁਆਮੀ ਮਾਲਕ ਦਾ ਸਿਮਰਨ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "still the faithless cynic does not remember the Lord, Har, Har. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੌ ਭੀ ਸਾਕਤ ਕੇ ਚਿਤ ਵਿਖੇ ਹਰਿ ਹਰਿ ਨਾਮੁ ਨਹੀਂ ਆਯਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਭੀ ਉਸ ਦੇ ਚਿੱਤ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ (-ਭੋਜਨ) ਟਿਕ ਨਹੀਂ ਸਕਦਾ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਕਤ ਚੀਤਿ = ਸਾਕਤ ਦੇ ਚਿੱਤ ਵਿਚ। ਸਾਕਤ = ਪਰਮਾਤਮਾ ਨਾਲੋਂ ਟੁੱਟਾ ਹੋਇਆ ਮਨੁੱਖ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aún así él no recuerda a Dios. (1)"