data = "ਰਣ ਤਜ ਸੂਰੰ ਸਰ ਧਰ ਬੰਕੰ ॥"
page = 265

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors abandoning the field and the arrows entered Lanka"

[[content]]
assets = ["RSJD"]
type = "translation"
