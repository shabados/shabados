[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਸਮਝ ਸੁਜਾਨ ॥੪੯੭॥"
page = 740

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Ashivni” in the beginning and then adding “Ripu Ari” at the end, the names of Tupak are formed.497."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤੁਪਕ ਦਾ ਨਾਮ ਹੁੰਦਾ ਹੈ। ਸੁਜਾਨੋ! ਜਾਣ ਲਵੋ ॥੪੯੭॥"