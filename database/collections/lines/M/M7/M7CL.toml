[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਰਸਨ ਨਾਮ ਕਉ; ਮਨੁ ਆਛੈ ॥"
page = 533
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My soul long for God's vision and Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਆਤਮਾ ਵਾਹਿਗੁਰੂ ਦੇ ਦੀਦਾਰ ਅਤੇ ਨਾਮ ਨੂੰ ਲੋਚਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind longs for the Blessed Vision of the Lord's Darshan, and His Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਮਨ ਨਾਮ ਜਪਣੇ ਕੋ ਔਰ ਪ੍ਰਭੂ ਕੇ ਦਰਸਨ ਕਰਨੇ ਕੋ (ਆਛੈ) ਚਾਹਿਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਦਰਸਨ ਕਰਨ ਵਾਸਤੇ ਤੇ ਨਾਮ ਜਪਣ ਵਾਸਤੇ, ਮੇਰਾ ਮਨ ਤਾਂਘਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਵਾਸਤੇ। ਆਛੈ = ਤਾਂਘਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi mente añora tener la Visión de Tu Nombre."