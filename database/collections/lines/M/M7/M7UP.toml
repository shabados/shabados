[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖੁ ਪ੍ਰਾਣੀ ਮੁਗਧੁ ਹੈ; ਨਾਮਹੀਣ ਭਰਮਾਇ ॥"
page = 313
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Foolish is the perverse person without the Lord's Name he wanders about."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਰਖ ਹੈ, ਮਨ ਮਗਰ ਲੱਗਣ ਵਾਲਾ ਪੁਰਸ਼, ਸੁਆਮੀ ਦੇ ਨਾਮ ਦੇ ਬਾਝੋਂ ਉਹ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The self-willed manmukh is foolish; he wanders around without the Naam, the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ ਜੀਵ ਮੂਰਖ ਹੈ, ਨਾਮ ਸੇ ਰਹਤ ਹੋ ਕਰ ਭ੍ਰਮਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ ਮਨੁੱਖ ਮੂਰਖ ਹੈ, ਨਾਮ ਤੋਂ ਸੱਖਣਾ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਗਧੁ = ਮੂਰਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El arrogante Manmukj es tonto,  vaga en la duda sin el Naam, el Nombre del Señor."