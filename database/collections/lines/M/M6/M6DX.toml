[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਹੈ ਭਰਾਤਿ; ਹੋਵੈ ਜਿਸੁ ਦਾਤਿ ॥੨॥"
page = 150
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Doubt departs from Him who receives the gift."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਬਖਸ਼ੀਸ਼ ਪਰਾਪਤ ਹੁੰਦੀ ਹੈ, ਉਸ ਦਾ ਸੰਦੇਹ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Doubt departs from one who receives this gift. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਮੇਰੇ ਸੇ ਗਿਆਨ ਕੀ ਦਾਤ ਹੋਤੀ ਹੈ ਤਿਸ ਕੀ ਭ੍ਰਾਂਤੀ ਉਤਰਤੀ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਮਨ ਦੀ ਭਟਕਣਾ ਦੂਰ ਹੋ ਜਾਂਦੀ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਹੈ = ਲਹਿ ਜਾਂਦੀ ਹੈ। ਭਰਾਤਿ = ਮਨ ਦੀ ਭਟਕਣਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aquél sobre quien se posa la Misericordia del Señor se despoja de toda duda.(2)"