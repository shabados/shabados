[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖੋਜਤ ਖੋਜਤ; ਘਟਿ ਘਟਿ ਦੇਖਿਆ ॥"
page = 838
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Searching and searching, I have seen Him in all the hearts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲੱਭਦਿਆਂ, ਲੱਭਦਿਆਂ ਮੈਂ ਉਸ ਨੂੰ ਸਾਰਿਆਂ ਦਿਲਾਂ ਅੰਦਰ ਵੇਖ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Searching, searching, I have seen Him in each and every heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਘਟ ਘਟ ਮੇਂ ਬ੍ਯਾਪਕ ਦੇਖਿਆ ਹੈ, ਭਾਵ ਜਾਣਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਭਾਲ ਕਰਦਿਆਂ ਕਰਦਿਆਂ ਉਸ ਨੂੰ ਹਰੇਕ ਸਰੀਰ ਵਿਚ ਵੇਖ ਸਕੀਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਟਿ ਘਟਿ = ਹਰੇਕ ਸਰੀਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Buscando y buscando, Lo he visto en todos y en cada uno de los corazones."