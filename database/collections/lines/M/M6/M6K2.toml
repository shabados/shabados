data = "ਸੰਤ ਮੰਡਲੁ; ਤਹਾ ਕਾ ਨਾਉ ॥"
page = 1146
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That alone is called the saints guild,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿਰਫ ਉਸ ਨੂੰ ਹੀ ਸਤਿਸੰਗਤ ਆਖਿਆ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That alone is called the Realm of the Saints,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕਾ ਮੰਡਲ ਅਰਥਾਤ ਸਮੂਹ ਤਿਸ ਕਾ ਨਾਮੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਧ ਸੰਗਤ ਉਸ ਥਾਂ ਦਾ ਨਾਮ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਹਾ ਕਾ = ਉਸ (ਥਾਂ) ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Recinto de los Santos es sólo ahí,"