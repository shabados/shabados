[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਸੇਵਹਿ; ਸੇ ਜਨ ਸਾਚੇ ॥"
page = 1046
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "True are the mortals who serve their True Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਹਨ ਉਹ ਪ੍ਰਾਣੀ, ਜੋ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਘਾਲ ਕਮਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those humble beings who serve the True Guru are true."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਤਿਗੁਰੋਂ ਕੋ ਸੇਵਤੇ ਹੈਂ ਸੇ ਸਾਚੇ ਭਗਤ ਜਨ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੇ ਮਨੁੱਖ ਗੁਰੂ ਦਾ ਦਰ ਮੱਲਦੇ ਹਨ, ਉਹ ਮਨੁੱਖ ਟਿਕਵੇਂ ਆਤਮਕ ਜੀਵਨ ਵਾਲੇ ਬਣ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵਹਿ = ਸੇਵਾ ਕਰਦੇ ਹਨ, ਸਰਨ ਪੈਂਦੇ ਹਨ। ਸੇ = ਉਹ {ਬਹੁ-ਵਚਨ}। ਸਾਚੇ = ਟਿਕਵੇਂ ਆਤਮਕ ਜੀਵਨ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los que sirven al Guru Verdadero, son los seres Reales,"