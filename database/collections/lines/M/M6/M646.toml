data = "ਨ ਬੀਨਦ ਦਿਗ਼ਰ ਜ਼ਨ, ਬ ਚਸ਼ਮੋ ਖ਼ੁਦਸ਼ ॥"
page = 1398

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Neither you have given disdainful looks to any woman,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉੱਤਰ ਵਿਚ ਬਾਦਸ਼ਾਹ ਨੇ ਕਿਹਾ) ਜੋ ਬੰਦਾ ਕਿਸੇ ਹੋਰ ਦੀ ਇਸਤਰੀ ਨੂੰ ਮਾੜੀ ਨਿਗਾਹ ਨਾਲ ਨਹੀਂ ਵੇਖਦਾ ਹੈ"