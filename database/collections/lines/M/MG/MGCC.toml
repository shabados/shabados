data = "ਬਿ ਗੁਫ਼ਤੰਦ ਕਿ ਈਂ ਰਾ ਹਵਾਲਹ ਕੁਨਦ ॥"
page = 1407

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Emperor thought, ‘If I hand over (the Raja) to the Quazi’s wife,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਬਾਦਸ਼ਾਹ ਨੇ ਕਿਹਾ) ਇਸ ਆਦਮੀ ਨੂੰ ਇਸ ਔਰਤ ਦੇ ਹਵਾਲੇ ਕਰ ਦਿਓ।"