data = "ਮੂਰਖ ਰਾਵ ਭੇਦ ਨਹਿ ਚੀਨੋ ॥੩੨॥"
page = 1000

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thinking her to be liar, the maid was killed and the foolish Raja did not discover the truth.(32)"

