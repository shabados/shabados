[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਬਿਰਹੀ. ਨਾਮ ਕਾ; ਜੇ ਮਿਲੈ ਤ ਤਨੁ ਮਨੁ ਦੇਉ ॥"
page = 758
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Guru is the lover of the Name. If I meet him, then shall I surrender my body and soul unto him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰੂ ਜੀ ਨਾਮ ਦੇ ਪ੍ਰੇਮੀ ਹਨ, ਜੇਕਰ ਉਹ ਮੈਨੂੰ ਮਿਲ ਪੈਣ ਮੈਂ ਆਪਣੀ ਦੇਹ ਅਤੇ ਆਤਮਾ ਉਨ੍ਹਾਂ ਦੇ ਅਰਪਣ ਕਰ ਦੇਵਾਂਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Guru is the Lover of the Naam, the Name of the Lord. Meeting Him, I dedicate my body and mind to Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਕਾ ਪ੍ਰੇਮੀ ਜੋ ਸਤਿਗੁਰੂ ਹੈ ਜੇਕਰ ਮੈਨੂੰ ਮਿਲ ਜਾਵੈ ਤਾਂ ਮੈਂ ਉਸ ਕੋ ਤਨ ਮਨ ਦੇ ਦੇਵੋਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰੂ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਦਾ ਪ੍ਰੇਮੀ ਹੈ, ਜੇ ਮੈਨੂੰ ਗੁਰੂ ਮਿਲ ਪਏ ਤਾਂ ਮੈਂ ਆਪਣਾ ਤਨ ਆਪਣਾ ਮਨ ਉਸ ਦੇ ਅੱਗੇ ਭੇਟ ਰੱਖ ਦਿਆਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਰਹੀ = ਪ੍ਰੇਮੀ। ਤ = ਤਾਂ। ਦੇਉ = ਦੇਉਂ, ਮੈਂ ਦੇ ਦਿਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru Verdadero es el Amante del Nombre del Señor; entrego mi ser al Guru, Quien me bendice con tal Nombre."