[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਲਮ ਸਿੰਘ ਮਹਾਮਤਿ ਸਿੰਘ; ਜਗਾਜਤ ਸਿੰਘ ਲਏ ਅਸਿ ਧਾਯੋ ॥"
page = 437

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Balram Singh, Mahamati Singh and Jagajat Singh, fell upon him (the enemy) with their swords"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਨ੍ਹਾਂ ਵਿਚੋਂ) ਬਾਲਮ ਸਿੰਘ, ਮਹਾਮਤਿ ਸਿੰਘ ਅਤੇ ਜਗਾਜਤ ਸਿੰਘ ਤਲਵਾਰਾਂ ਲੈ ਕੇ ਵਧੇ ਹਨ।"