[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੇ ਮਨ ਮੇਰੇ; ਤੂੰ ਤਾ ਕਉ ਸੇਵਿ ॥"
page = 187
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O My soul, do thou serve Him,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਤੂੰ ਉਸ ਦੀ ਘਾਲ ਕਮਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, serve Him;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ ਤਿਸ ਕੋ ਸੇਵਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਤੂੰ ਉਸ ਪਰਮਾਤਮਾ ਦੀ ਸੇਵਾ-ਭਗਤੀ ਕਰ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵਿ = ਸਿਮਰ, ਸੇਵਾ-ਭਗਤੀ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, sírvelo sólo a Él,"