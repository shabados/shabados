[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮੁ ਪ੍ਰਭੁ ਸੇਵਦੇ; ਮਨ ਅੰਦਰਿ ਏਕੁ ਧਰੇ ॥"
page = 136
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They serve the Supreme Lord Master and place the unique One in their heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸ਼ਰੋਮਣੀ ਸਾਹਿਬ ਮਾਲਕ ਦੀ ਟਹਿਲ ਕਮਾਉਂਦੇ ਹਨ ਅਤੇ ਅਦੁੱਤੀ ਪੁਰਖ ਨੂੰ ਆਪਣੇ ਦਿਲ ਵਿੱਚ ਟਿਕਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They serve the Supreme Lord God, and enshrine the One Lord within their minds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਾਰਬ੍ਰਹਮ ਪ੍ਰਭ ਏਕ ਕੋ ਹੀ ਮਨ ਮੇਂ ਧਾਰ ਕਰ ਸੇਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੇ ਮਨ ਵਿਚ ਇਕੋ ਪਰਮ ਜੋਤਿ ਪਰਮਾਤਮਾ ਨੂੰ ਵਸਾ ਕੇ ਸਦਾ ਉਸ ਨੂੰ ਸਿਮਰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਰੇ = ਧਰਿ, ਧਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Entonces uno sirve al Supremo Señor Maestro, enalteciéndolo en su corazón."