[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕਪਟ ਸਨੇਹਿ, ਨ ਥੇਹਿ ਜੁੜੰਦੇ ॥੧੯॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Their false love cannot reach any place."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਤਾਂਤੇ) 'ਕਪਟ ਸਨੇਹੀ' ਕਿਸੇ ਟਿਕਾਣੇ ਨੂੰ ਨਹੀਂ ਪਹੁੰਚ ਸਕਦੇ।"