[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰੇ ਸਿਵ, ਆਜ ਅਯੋਧਨ ਮੈ; ਲਰਿ ਲੈ ਹਮ ਸੋ, ਕਰ ਲੈ ਬਲ ਜੇਤੋ ॥"
page = 447

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O Shiva! whatever strength you have today, use it in this war"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਸ਼ਿਵ! ਅਜ ਯੁੱਧ-ਭੂਮੀ ਵਿਚ ਮੇਰੇ ਨਾਲ ਲੜ ਲੈ, ਜਿਤਨਾ ਵੀ (ਤੇਰਾ) ਬਲ ਹੈ, (ਉਹ ਸਾਰਾ) ਲਗਾ ਲੈ।"