[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਧਰੇ ਅਤ੍ਰ ਨੀਕੇ ਪੁਰੀ ਅਉਧ ਆਏ ॥"
page = 271

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sovereigns were called from all the four directions and they all reached Avadhpuri"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੋ ਉਤਮ ਅਸਤ੍ਰ ਧਾਰਨ ਕਰਕੇ ਅਯੁਧਿਆ ਪੁਰੀ ਵਿੱਚ ਆਏ।"