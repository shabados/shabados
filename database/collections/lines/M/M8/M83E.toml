data = "ਮਹਾਬਾਹੁ ਬਿਸ੍ਵੰਭਰ ਭਰਣੰ ॥੯॥੨੯॥"
page = 130

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art the Most Powerful and Sustainer of the Universe.9.29."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵੱਡੀਆਂ ਬਾਂਹਵਾਂ ਵਾਲੇ ਅਤੇ ਸੰਪੂਰਨ ਵਿਸ਼ਵ ਨੂੰ ਭਰਨ ਵਾਲੇ ਹੋ ॥੯॥੨੯॥"