[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਊ ਸੁਘਰ ਨਰ ਇਸਤ੍ਰਿਯਨ; ਭੇਦ ਨ ਅਪਨੋ ਦੇਤ ॥੧੩॥"
page = 832

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But they never divulge their secrets to women.(13)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਵੀ ਸੁਘੜ ਪੁਰਸ਼ ਇਸਤਰੀਆਂ ਨੂੰ ਆਪਣਾ ਭੇਦ ਨਹੀਂ ਦਿੰਦੇ ॥੧੩॥"