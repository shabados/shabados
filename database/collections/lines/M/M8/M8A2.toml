[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਂ ਸਦੇ; ਤਾਂ ਢਿਲ. ਨ ਪਾਇ ॥"
page = 1327
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "when the call comes from God, He then can make no delay in departing,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਸ ਨੂੰ ਰੱਬ ਵੱਲੋ ਸੱਦਾ ਆ ਜਾਂਦਾ ਹੈ, ਤਦ ਉਹ ਟੁਰਨ ਨੂੰ ਦੇਰੀ ਨਹੀਂ ਲਾ ਸਕਦਾ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but when the call comes, he cannot delay."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਿਗੁਰੂ! ਤੂੰ ਜਬ ਇਸ ਜੀਵ ਕੋ (ਸਦੇ) ਹੁਕਮ ਸੇ ਬੁਲਾਵਤਾ ਹੈਂ ਤਬ ਇਸ ਕੇ ਜਾਣੇ ਮੇਂ (ਢਿਲ) ਦੇਰੀ ਨਹੀਂ ਪੜਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ (ਪਰਮਾਤਮਾ ਜੀਵ ਨੂੰ) ਮੌਤ ਦਾ ਸੱਦਾ ਭੇਜਦਾ ਹੈ (ਉਸ ਸੱਦੇ ਦੇ ਸਾਹਮਣੇ ਰਤਾ ਭੀ) ਢਿੱਲ ਨਹੀਂ ਹੋ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਂ = ਜਦੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero cuando el llamado llega, no puede retrasarse."