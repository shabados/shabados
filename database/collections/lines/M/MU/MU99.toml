data = "ਜ਼ਿ ਤੋ ਪਸ ਕਿਰਾ ਬਾਦਸ਼ਾਹੀ ਦਿਹਮ ॥"
page = 1398

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(They asked), ‘Who could we endow the kingdom after you?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਵਜ਼ੀਰ ਪੁੱਛਣ ਲਗੇ ਕਿ) ਤੁਹਾਡੇ ਪਿਛੋਂ ਇਹ ਬਾਦਸ਼ਾਹੀ ਕਿਸ ਨੂੰ ਦੇਈਏ"