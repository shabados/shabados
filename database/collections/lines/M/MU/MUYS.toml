[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈਸਾ ਸਾ; ਤੈਸਾ ਦਿਖਲਾਇਆ ॥"
page = 887
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and as Thou art, so Thou hast shown thyself to me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜੇਹੋ ਜਿਹਾ ਤੂੰ ਹੈਂ, ਓਹੋ ਜਿਹਾ ਹੀ ਤੂੰ ਮੈਨੂੰ ਆਪਣੇ ਆਪ ਨੂੰ ਵਿਖਲਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As You are, so You have revealed Yourself to me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸਾ ਨਿਜ ਸਰੂਪ ਥਾ ਆਪ ਨੇ ਤੈਸਾ ਹੀ ਦਿਖਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੈਨੂੰ ਸਾਖਿਆਤ ਆਪਣਾ ਦੀਦਾਰ ਬਖ਼ਸ਼ਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾ = ਸੀ। ਸਭੁ = ਸਾਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y Te manifiestas ante mí."