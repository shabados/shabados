[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਮ੍ਰਿਤੁ ਵੇਖੈ ਪਰਖੈ ਸਦਾ ਨੈਣੀ ॥"
page = 118
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "always see and assay this Amrit everywhere with their eyes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਅੰਮ੍ਰਿਤਮਈ ਨਾਮ ਨੂੰ ਨਿਤਾ ਪ੍ਰਤੀ ਆਪਣੇ ਨੇਤ੍ਰਾਂ ਨਾਲ ਦੇਖਦਾ ਤੇ ਪਛਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "See and behold this Amrit everywhere with their eyes."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅੰਮ੍ਰਿਤ ਰੂਪ ਬ੍ਰਹਮ ਕੋ ਸਦਾ ਨੇਤ੍ਰੀ ਦੇਖਤੇ ਹੈਂ, ਔਰੁ ਨਾਮ ਦੀ ਪਰੀਖ੍ਯਾ ਕਰਤੇ ਹੈਂ, ਭਾਵ ਮਹਿਮਾ ਜਾਨਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਅੱਖਾਂ ਨਾਲ (ਭੀ) ਸਦਾ ਜੀਵਨ-ਦਾਤੇ ਪਰਮਾਤਮਾ ਨੂੰ ਹੀ (ਹਰ ਥਾਂ) ਵੇਖਦਾ ਪਛਾਣਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਮ੍ਰਿਤੁ = ਸਦਾ ਅਟੱਲ ਪ੍ਰਭੂ। ਨੈਣੀ = ਅੱਖਾਂ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ven y observan el Amrit por todas partes con sus ojos."