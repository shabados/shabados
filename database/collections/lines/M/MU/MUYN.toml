[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹਾਂ ਸਬਦੁ ਵਸੈ; ਤਹਾਂ ਦੁਖੁ ਜਾਏ ॥"
page = 364
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Where the Name abides, from there pain departs."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਨਾਮ ਵਸਦਾ ਹੈ, ਉੱਥੋ ਰੰਜ ਗ਼ਮ ਟੁਰ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Pain departs, from that place where the Shabad abides."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਹਾਂ, ਭਾਵ ਜਿਸ ਹ੍ਰਿਦਯ ਮੇਂ ਗੁਰ ਸਬਦ ਬਸਤਾ ਹੈ ਤਹਾਂ ਤੇ ਦੁਖ ਜਾਤਾ ਰਹਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਹਿਰਦੇ ਵਿਚ ਗੁਰੂ ਦਾ ਸ਼ਬਦ ਵੱਸਦਾ ਹੈ, ਉਥੋਂ ਹਰੇਕ ਕਿਸਮ ਦਾ ਦੁੱਖ ਦੂਰ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Donde sea que la Palabra del Shabd toma lugar,"