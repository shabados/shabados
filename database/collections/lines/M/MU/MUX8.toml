[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਵਰਿ ਕਰਮ; ਸਭਿ ਲੋਕਾਚਾਰ ॥"
page = 804
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All other rituals are but worldly affairs,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੋਰ ਸਾਰੇ ਕਰਮਕਾਂਡ ਕੇਵਲ ਸੰਸਾਰੀ ਵਿਹਾਰ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All other rituals are just worldly affairs;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਨਾਮ ਬਿਨਾਂ ਔਰ ਜੇਤੇ ਕਰਮ ਕਰਨੇ ਹੈਂ, ਸੋ ਸੰਪੂਰਨ ਲੋਕਾਚਾਰ, ਭਾਵ ਲੋਕਾਂ ਕਾ ਦਿਖਲਾਵਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਗੁਰੂ ਦੀ ਸਰਨ ਤੋਂ ਬਿਨਾ) ਹੋਰ ਸਾਰੇ ਕਰਮ ਨਿਰਾ ਵਿਖਾਵਾ ਹੀ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਵਰਿ = {ਲਫ਼ਜ਼ 'ਅਵਰ' ਤੋਂ ਬਹੁ-ਵਚਨ} ਹੋਰ (ਸਾਰੇ)। ਸਭਿ = ਸਾਰੇ। ਲੋਕਾਚਾਰ = ਲੋਕ ਆਚਾਰ, ਜਗਤ ਦਾ ਰਿਵਾਜ ਪੂਰਾ ਕਰਨ ਵਾਲੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todas las demás acciones satisfacen sólo el código de la conducta mundana."