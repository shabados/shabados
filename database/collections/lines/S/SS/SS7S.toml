data = "ਸੁ ਬੈਠਿ ਇਕੰਤ੍ਰ ॥੫੭੮॥"
page = 609

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He gave his mantra to everyone, he abandoned all the Tantras and sitting in solitude, he produced his Yantras.578."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਜੰਤ੍ਰ ਲਿਖ ਦਿੱਤੇ ਹਨ ॥੫੭੮॥"