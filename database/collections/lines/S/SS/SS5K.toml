[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਿਨੁ ਏਕ ਸਾਤਿ ਸੁਨ ਰੇ ਨ੍ਰਿਪਤਿ, ਸੁ ਅਉਰ ਨ ਦੂਸਰ ਬਰਜਿ ਹੈ ॥੧੭੮॥"
page = 693

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On that day, none else will confront him except Shanti (peace).178."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਰਾਜਨ! ਸੁਣੋ, ਬਿਨਾ ਇਕ 'ਸਾਂਤਿ' ਦੇ ਹੋਰ (ਕੋਈ) ਦੂਜਾ ਉਸ ਨੂੰ ਨਹੀਂ ਵਰਜੇਗਾ ॥੧੭੮॥"