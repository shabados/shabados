[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਖਾਟ ਤਰੇ ਛਪਿ ਰਹਿਯੋ ਬਿਚਾਰੋ ॥"
page = 901

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying so, presumably he went abroad, but, as a matter of fact, he hid himself under the bed."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਰ ਅਸਲ ਵਿਚ ਉਹ ਵਿਚਾਰਾ ਮੰਜੀ ਹੇਠਾਂ ਛਿਪ ਗਿਆ।"