[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਮਕਾਲੁ ਨੇੜਿ. ਨ ਆਵਈ; ਆਪਿ ਬਖਸੇ ਕਰਤਾਰਿ ॥"
page = 1415
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Creator-Lord, of Himself, forgives them and the death's minister comes not near them."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿਰਜਣਹਾਰ ਸੁਆਮੀ ਖੁਦ ਉਨ੍ਹਾਂ ਨੂੰ ਮਾਫ ਕਰ ਦਿੰਦਾ ਹੈ ਅਤੇ ਮੌਤ ਦਾ ਦੁਤ ਉਨ੍ਹਾਂ ਦੇ ਨਿਕਟ ਨਹੀਂ ਆਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Messenger of Death does not even approach them; the Creator Lord Himself forgives them."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨੋਂ ਕੇ ਸਮੀਪ ਜਮਕਾਲ ਭੀ ਨਹੀਂ ਆਵਤਾ ਹੈ, ਕਿਉਂ ਕਿ ਓਹ ਜਨ ਕਰਤਾਰ ਨੇ ਆਪ ਹੀ ਬਖਸ਼ੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਉਤੇ ਕਰਤਾਰ ਨੇ ਆਪ ਮਿਹਰ ਕੀਤੀ ਹੁੰਦੀ ਹੈ, ਮੌਤ (ਦਾ ਡਰ ਉਹਨਾਂ ਦੇ) ਨੇੜੇ ਨਹੀਂ ਢੁਕਦਾ (ਆਤਮਕ ਮੌਤ ਉਹਨਾਂ ਦੇ ਨੇੜੇ ਨਹੀਂ ਆਉਂਦੀ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਵਈ = ਆਵੈ, ਆਉਂਦਾ। ਕਰਤਾਰਿ = ਕਰਤਾਰ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mensajero de la muerte no se les acerca y el Mismo Señor Creador los perdona."