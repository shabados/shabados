[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਮ ਕ੍ਰੋਧ; ਗੁਰ ਸਬਦਿ. ਨਾਸਿ ॥"
page = 1184
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Guru's word, their lust and wrath are destroyed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਬਾਣੀ ਰਾਹੀਂ ਉਹਨਾਂ ਦੀ ਕਾਮਚੇਸ਼ਟਾ ਅਤੇ ਗੁੱਸਾ ਨਸ਼ਟ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Word of the Guru's Shabad, sexual desire and anger are eradicated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਕੇ ਉਪਦੇਸ ਕਰ ਤਿਨ ਕਾ ਕਾਮ, ਕ੍ਰੋਧ ਨਸਟ ਹੋ ਗਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਬਰਕਤਿ ਨਾਲ ਉਹਨਾਂ ਦੇ ਅੰਦਰੋਂ ਕਾਮ ਕ੍ਰੋਧ (ਆਦਿਕ ਵਿਕਾਰ) ਨਾਸ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਬਦਿ = ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y se liberan de la lujuria y el enojo a través de la Palabra del Shabd del Guru."