[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਤੇ ਊਚਾ; ਮੰਦਰੁ ਮੇਰਾ ॥"
page = 737
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The highest of all is may mansion."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਨਾਲੋਂ ਉਚਾ ਹੈ ਮੇਰਾ ਮਹਿਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mansion is lofty and elevated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਤੇ ਬਡਾ ਨਿਸਚਾ ਰੂਪ ਮੇਰਾ ਮੰਦਰ ਅਸਥਾਨ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਸਖੀ! ਉਸ ਖਸਮ-ਪ੍ਰਭੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਹੀ) ਮੇਰਾ ਹਿਰਦਾ-ਘਰ ਸਭ (ਵਾਸਨਾਵਾਂ) ਤੋਂ ਉੱਚਾ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਦਰੁ = ਹਿਰਦਾ-ਘਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora mi Recinto está en lo Alto de lo alto,"