[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਣਿ ਪਰੇ ਕੀ; ਰਾਖਹੁ ਸਰਮਾ ॥੨॥੨੯॥"
page = 378
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Preserve thou the honour of Thine shelter seeker, O my master."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਪਨਾਹ ਲੈਣ ਵਾਲੇ ਦੀ ਲੱਜਿਆ ਰੱਖ ਹੇ ਮੇਰੇ ਮਾਲਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord, I seek Your Sanctuary - please, preserve my honor. ||2||29||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਸਰਣ ਪੜੇ ਹੂਏ ਕੀ ਲੱਜਿਆ ਰਖੋ॥੨॥੨੯॥☬ਸਨਮੁਖ ਬੇਨਤੀ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਮੈਂ ਤੇਰੀ ਸਰਨ ਆ ਪਿਆ ਹਾਂ) ਸਰਨ ਪਏ ਦੀ ਮੇਰੀ ਲਾਜ ਰੱਖੀਂ ॥੨॥੨੯॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਮਾ = ਸ਼ਰਮ, ਲਾਜ ॥੨॥੨੯॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero me postro ante Ti, oh Señor, y así cubro mi vergüenza. (2‑29)"