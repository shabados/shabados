[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਈ; ਸੁਨਤ ਸੋਚ ਭੈ ਡਰਤ ॥"
page = 529
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My mother! as I hear and think of death, I am overawed with dread."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਮਾਤਾ, ਜਦ ਮੈਂ ਮੌਤ ਬਾਰੇ ਸੁਣਦਾ ਅਤੇ ਸੋਚਦਾ ਹਾਂ, ਮੈਂ ਤ੍ਰਾਹ ਨਾਲ ਸਹਿਮ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O mother, I hear of death, and think of it, and I am filled with fear."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮਾਈ) ਭਾਈ! ਜਬ ਜਮ ਪੁਰੀ ਕੇ ਦੁਖ ਸੁਨਤੇ ਹੈਂ ਤਬ ਅਪਨੇ ਕਰਮੋਂ ਕੋ ਹਮ ਸੋਚ ਕਰ ਡਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਖਸਮ-ਪ੍ਰਭੂ ਦੀ ਸਰਨ ਨਾਹ ਪੈਣ ਵਾਲੀਆਂ ਦੀ ਦਸ਼ਾ) ਸੁਣ ਕੇ ਮੈਨੂੰ ਸੋਚਾਂ ਫੁਰਦੀਆਂ ਹਨ, ਮੈਨੂੰ ਡਰ-ਸਹਮ ਵਾਪਰਦੇ ਹਨ, ਮੈਂ ਡਰਦੀ ਹਾਂ (ਕਿ ਕਿਤੇ ਮੇਰਾ ਭੀ ਇਹ ਹਾਲ ਨਾਹ ਹੋਵੇ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਈ = ਹੇ ਮਾਂ! ਸੋਚ = ਚਿੰਤਾ। ਭੈ = {ਲਫ਼ਜ਼ 'ਭਉ' ਤੋਂ ਬਹੁ-ਵਚਨ} ਅਨੇਕਾਂ ਡਰ-ਸਹਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh madre, mientras reflexiono en el dolor de la muerte, me lleno de terror."