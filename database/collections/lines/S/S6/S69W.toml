[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਰਸੁ. ਨ ਚਾਖੈ; ਫੀਕਾ ਆਲਾਇ ॥"
page = 158
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and which tastes not God's elixir, and utters dry words."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇ ਜਿਹੜੀ ਵਾਹਿਗੁਰੂ ਅੰਮ੍ਰਿਤ ਨੂੰ ਨਹੀਂ ਭੁੰਚਦੀ, ਅਤੇ ਰੁੱਖੇ ਬਚਨ ਬੋਲਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "which does not taste the sublime essence of the Lord, and which utters insipid words."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਰਸ ਕੋ ਨਹੀਂ ਚਾਖਤੀ ਹੈ ਔਰ ਫਿਕਾ ਬੋਲਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਇਹ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦਾ ਸੁਆਦ ਤਾਂ ਨਹੀਂ ਚੱਖਦੀ, ਪਰ (ਨਿੰਦਾ ਆਦਿਕ ਦੇ) ਫਿੱਕੇ ਬੋਲ ਹੀ ਬੋਲਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਲਾਇ = ਬੋਲਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aquéllos que no te llevan a la experiencia de la Esencia del Señor, las palabras que salen de esa boca son agrias."