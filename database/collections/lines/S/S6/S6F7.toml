[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਤੁਪਕ ਕੇ ਹੋਤ ਹੈ; ਲੀਜਹੁ ਸੁਘਰ ਸੁ ਧਾਰਿ ॥੬੧੬॥"
page = 745

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the words “Vaahini-naadin” in the beginning and then adding “Ripu” at the end, the names of Tupak are comprehended correctly.616."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਤੁਪਕ ਦਾ ਨਾਮ ਬਣਦਾ ਹੈ। ਸੂਝਵਾਨ ਵਿਚਾਰ ਕਰ ਲੈਣ ॥੬੧੬॥"