[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੈ ਮੁਹਿ ਕ︀ਯੋ ਰਾਜਾ ਕਹਿਯੋ ਮੋ ਕਹੁ ਬਾਤ ਬਤਾਇ ॥੧੩॥"
page = 820

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Disclose the reason behind this.’(13)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੈਨੂੰ ਰਾਜਾ ਕਿਉਂ ਕਿਹਾ ਹੈ, ਮੈਨੂੰ (ਸਾਰੀ) ਗੱਲ ਦਸ ॥੧੩॥"