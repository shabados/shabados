[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲੋਗ ਤਮਾਸੇ ਕੌ ਚਲੇ; ਲੈ ਲਕਰਿਨ ਕੋ ਸਾਜ ॥੧੫॥"
page = 821

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Followed, too, with firewood in their hands, to observe the spectacle.(15)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਲੋਕੀਂ ਤਮਾਸ਼ਾ ਵੇਖਣ ਲਈ ਲਕੜੀਆਂ ਆਦਿ ਲੈ ਕੇ ਚਲ ਪਏ ॥੧੫॥"