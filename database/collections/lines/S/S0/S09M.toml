data = "ਵੈ ਦੁਇ ਬਾਧ ਦੇਹੁ ਮੁਹਿ ਅਬਹੀ ॥"
page = 152

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“Bind both of them and give them immediately to me"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਨ੍ਹਾਂ ਦੋਹਾਂ ਨੂੰ ਬੰਨ੍ਹ ਕੇ ਮੈਨੂੰ ਦੇ ਦਿਓ।"