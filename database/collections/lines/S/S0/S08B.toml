[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪੰਖ ਹੀਨ ਕਹਾ ਉਡਾਇਬ, ਨੈਨ ਹੀਨ ਨਿਹਾਰ ॥"
page = 619

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Hoe can one fly without the wings? And how can one see without the eyes? How can one go to the battlefield without weapons"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਖੰਭਾਂ ਤੋਂ ਬਿਨਾ (ਪੰਛੀ) ਕਿਵੇਂ ਉਡੇਗਾ ਅਤੇ ਅੱਖਾਂ ਤੋਂ ਵਾਂਝਿਆ ਹੋਇਆ (ਕਿਵੇਂ) ਵੇਖੇਗਾ।"