[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਨੂਪ ਗਾਤ ਅਤਿਭੁਤੰ ਬਿਭੂਤ ਸੋਭਤੰ ਤਨੰ ॥"
page = 672

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The bodies of the sages were marvelous and their magnificence were unique"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਦਾ) ਅਨੂਪਮ ਅਤੇ ਅਦਭੁਤ ਸ਼ਰੀਰ ਸੀ ਅਤੇ ਸ਼ਰੀਰ ਉਤੇ ਵਿਭੂਤੀ ਸ਼ੋਭ ਰਹੀ ਸੀ।"