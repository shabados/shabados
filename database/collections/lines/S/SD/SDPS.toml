[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇਵਕ ਕਉ ਦੀਨੀ; ਅਪੁਨੀ ਸੇਵ ॥੧॥ ਰਹਾਉ ॥"
page = 191
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His attendant He blesses with His service. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਟਹਿਲੂਏ ਨੂੰ ਉਹ ਆਪਣੀ ਚਾਕਰੀ ਬਖ਼ਸ਼ਦਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He blesses His servant with His service. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੇਵਕ ਕੋ ਅਪਨੀ ਸੇਵਾ ਦਈ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸੇਵਕ ਨੂੰ (ਪਰਮਾਤਮਾ ਨੇ) ਆਪਣੀ ਸੇਵਾ-ਭਗਤੀ (ਦੀ ਦਾਤਿ) ਦਿੱਤੀ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਦੀਨੀ = ਦਿੱਤੀ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y te abraza en Su Servicio. (1-Pausa)"