[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗਣ ਗੰਧਰਬ ਅਪਛਰਾ; ਕਿੰਨਰ ਜਛ ਚਲਿਤ ਬਹੁ ਖੇਲੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many are the gans (ghosts), gandharvs (celestial singers), nymphs, and kinnars who perform differently."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੰਧਰਬ (ਸਵਰਗੀ ਰਾਗੀਆਂ) ਦੇ ਸਮੂਹ, ਅਪੱਛਰਾਂ, ਕਿੰਨਰ, ਜੱਛ (ਦੇਵਤੇ) ਬਹੁਤ ਚਲਿੱਤ੍ਰ ਨੂੰ ਖੇਲਣ ਵਾਲੇ।"