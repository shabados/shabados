[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇਹੀ ਧਾਤੁ; ਤੇਹਾ ਤਿਨ ਨਾਉ ॥"
page = 25
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "gives then such names as is their inherent nature."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਉਨ੍ਹਾਂ ਦੇ ਐਸੇ ਨਾਮ, ਰੱਖਦਾ ਹੈ, ਜੇਹੋ ਜੇਹੀ ਉਨ੍ਹਾਂ ਦੀ ਜਮਾਂਦਰੂ ਖ਼ਸਲਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "according to their nature, He gives them all their names."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੀ ਜਿਸ ਕੇ ਕਰਮੋਂ ਕੀ (ਧਾਤੁ) ਧਾਵਨੀ ਕ੍ਯਾ ਪ੍ਰਵਿਰਤੀ ਹੈ, ਸੋ ਤੈਸਾ ਹੀ ਤਿਨ ਕਾ ਨਾਮੁ ਕਹਾ ਜਾਤਾ ਹੈ॥ ਯਥਾ-☬\"ਕਰਮ ਨਾਮ ਬਰਨਤ ਸੁਮਤਿ॥\""

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਹੋ ਜਿਹਾ ਰੁੱਖਾਂ ਦਾ ਅਸਲਾ ਹੈ, ਤਿਹੋ ਜਿਹਾ ਉਹਨਾਂ ਦਾ ਨਾਮ ਪੈ ਜਾਂਦਾ ਹੈ (ਉਹੋ ਜਿਹੇ ਉਹਨਾਂ ਨੂੰ ਫੁੱਲ ਫਲ ਪੈਂਦੇ ਹਨ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਾਤੁ = ਅਸਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nombra a Sus Árboles de acuerdo a sus frutos."