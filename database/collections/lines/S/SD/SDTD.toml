[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਜਤ ਹੈ ਤਰਏ ਜਮੁਨਾ; ਅਤਿ ਹੀ ਤਹ ਚਾਦਨੀ ਚੰਦ ਕਰੀ ਹੈ ॥"
page = 349

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Down below, Yamuna is flowing with currents like moonshine"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇਠਾਂ ਜਮਨਾ ਵਗਦੀ ਹੋਈ ਸ਼ੋਭਾ ਪਾ ਰਹੀ ਹੈ ਅਤੇ ਉਤੋਂ ਚੰਦ੍ਰਮਾ ਨੇ ਬਹੁਤ ਚਾਂਦਨੀ ਕੀਤੀ ਹੋਈ ਹੈ।"