type = "primary"
data = "ਜਗੇ ਸੂਰ ਹਥਿਆਰ ਸੰਭਾਰੇ ॥੫॥"
page = 931

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "With the benevolence of Chandika, all those got up, laced with the weapons.(5)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਹ ਸੂਰਮੇ ਹਥਿਆਰ ਸੰਭਾਲ ਕੇ ਤਿਆਰ ਹੋ ਗਏ ॥੫॥"