[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ; ਸਾਂਈ ਲੋੜਹਿ ਸਭੁ ॥"
page = 1378
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "if thou long for the Lord of all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਸਾਰਿਆਂ ਦੇ ਸੁਆਮੀ ਨੂੰ ਚਾਹੁੰਦਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "if you long for the Lord of all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜੇਕਰ ਸਾਂਈ ਕੋ ਸਰਬ ਮੇਂ ਪੂਰਨ ਰੂਪ ਦੇਖਿਆ (ਲੋੜਹਿ) ਚਾਹਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਤੂੰ ਮਾਲਕ (-ਪ੍ਰਭੂ) ਨੂੰ ਹਰ ਥਾਂ ਭਾਲਦਾ ਹੈਂ (ਭਾਵ, ਵੇਖਣਾ ਚਾਹੁੰਦਾ ਹੈਂ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੇ ਲੋੜਹਿ = ਜੇ ਤੂੰ ਲੱਭਦਾ ਹੈਂ। ਸਭੁ = ਹਰ ਥਾਂ, ਸਭ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si añoras al Señor de todo,"