[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਬਦ ਸੁਰਤਿ ਲਿਵ ਲਾਇ, ਅਨਹਦ ਵਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Merging their consciousness in the Word they have become one with the unstruck melody."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸ਼ਬਦ ਸੁਰਤ ਵਿਖੇ ਪ੍ਰੀਤ ਕਰ ਕੇ ('ਲਿਵ'=) ਤਾਰ ਲਾ ਰਖੀ ਹੈ ਤੇ ਅਨਹਦ ਵਾਜੇ (ਸੁਣੇ ਜਾਂਦੇ) ਹਨ।"