[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੋਟ ਚਟਾਕਨ ਤਾਲ ਦਿਵਾਯੋ ॥੧੮॥"
page = 816

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Yogi kept his eyes shut and played the love-tunes while she made love with the son of the Raja.(18)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਅਤੇ ਸ਼ਰੀਰ ਦੇ ਅੰਗਾਂ ਦੇ ਪਰਸਪਰ) ਚਟਕਣ ਦੀ ਧੁਨ ਨੂੰ ਤਾਲ ਵਜੋਂ ਵਰਤਿਆ ॥੧੮॥"