[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਆ ਡੇਰਾ ਕਉ; ਸ੍ਰਮੁ ਕਰਿ ਘਾਲੈ ॥"
page = 256
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "This dwelling over here, one erects with toil,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਟਿਕਾਣਾ ਜਿਸ ਨੂੰ ਉਹ ਮਿਹਨਤ ਮੁਸ਼ੱਕਤ ਕਰ ਕੇ ਬਣਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This place, here, is established by hard work,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਇਆ) ਇਸ ਡੇਰੇ ਕੋ (ਸ੍ਰਮੁ) ਅਤੀ ਕਸ਼ਟ ਕਰ ਕੇ (ਘਾਲੈ) ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਇਸ ਦੁਨੀਆਵੀ ਡੇਰੇ ਦੀ ਖ਼ਾਤਰ ਬੜੀ ਮਿਹਨਤ ਕਰ ਕੇ ਘਾਲਾਂ ਘਾਲਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸ੍ਰਮੁ = ਮਿਹਨਤ। ਘਾਲੈ = ਜਤਨ ਕਰਦਾ ਹੈ, ਘਾਲ ਘਾਲਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "para construir un hogar,"