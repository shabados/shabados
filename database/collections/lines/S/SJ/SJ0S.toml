[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਝੂਮਿ ਗਿਰੀ ਪ੍ਰਿਥਮੀ ਪਰ ਸੋ; ਹ੍ਰਿਦੈ ਆਨੰਦ ਥੋ ਤਿਤਨੋ ਬਿਸਰਾਯੋ ॥"
page = 391

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Forsaking the happiness of her heart, she became unconscious and fell down upon the earth"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਘੁੰਮੇਰੀ ਖਾ ਕੇ ਉਹ ਧਰਤੀ ਉਤੇ ਡਿਗ ਪਈ ਅਤੇ ਹਿਰਦੇ ਵਿਚ (ਜਿਤਨਾ) ਆਨੰਦ ਸੀ, ਉਹ (ਸਾਰਾ) ਭੁਲਾ ਦਿੱਤਾ।"