[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭੁ ਅਬਿਨਾਸੀ; ਏਕੰਕਾਰੁ ॥"
page = 284
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the Imperishable Unique Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪ ਅਮਰ ਅਦੁੱਤੀ ਸਾਹਿਬ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Eternal Lord God is the One, the Creator."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਵਹੁ ਅਬਿਨਾਸੀ ਪ੍ਰਭੂ ਏਕ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨਾਸ-ਰਹਿਤ ਹੈ, ਤੇ ਸਭ ਥਾਈਂ ਇਕ ਆਪ ਹੀ ਆਪ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Eterno Señor Dios es el Uno, el Creador."