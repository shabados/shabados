[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਮੁ ਕ੍ਰੋਧੁ ਅਹੰਕਾਰੁ ਨਿਵਾਰੇ ॥"
page = 1022
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If she banishes her lust, wrath and self-conceit,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਉਹ ਆਪਣੀ ਸ਼ਹਿਵਤ, ਗੁੱਸੇ ਅਤੇ ਸਵੈ-ਹੰਗਤਾਂ ਨੂੰ ਦੂਰ ਕਰ ਦਿੰਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Eradicating sexual desire, anger and egotism,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਰਸ ਕਾਮੁ, ਕ੍ਰੋਧੁ, ਅਹੰਕਾਰ ਕੋ ਨਿਵਿਰਤਿ ਕਰੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਜੇਹੜਾ ਮਨੁੱਖ ਆਪਣੇ ਅੰਦਰੋਂ) ਕਾਮ ਕ੍ਰੋਧ ਅਹੰਕਾਰ ਨੂੰ ਦੂਰ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si ella se logra sobreponer a su lujuria, a su enojo y a la idea del “yo soy”;"