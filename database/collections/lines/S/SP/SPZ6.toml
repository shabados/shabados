[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਵਾਰੀ ਜੀਉ ਵਾਰੀ; ਹਰਿ ਕਾ ਨਾਮੁ ਮੰਨਿ ਵਸਾਵਣਿਆ ॥"
page = 110
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am a sacrifice, my soul is a sacrifice unto those who abide God's Name in their hearts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਦਕੇ ਹਾਂ, ਮੇਰੀ ਜਿੰਦੜੀ ਸਦਕੇ ਹੈ, ਉਨ੍ਹਾਂ ਉਤੋਂ ਜੋ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਨੂੰ ਆਪਣੇ ਚਿੱਤ ਵਿੱਚ ਵਸਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice, my soul is a sacrifice, to those whose minds are filled with the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਮਨ ਤਨ ਸੇ ਉਨ ਕੇ ਵਾਰਨੇ ਜਾਤਾ ਹੂੰ ਜੋ ਹਰੀ ਕਾ ਨਾਮ ਮਨ ਮੇਂ ਵਸਾਵਣੇ ਵਾਲੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਦਾ ਉਹਨਾਂ ਤੋਂ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ, ਜੋ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਆਪਣੇ ਮਨ ਵਿਚ ਵਸਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਮੈਂ। ਮੰਨਿ = ਮਨਿ, ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi ser en sacrificio, sí, en sacrificio a aquéllos que cosechan el Fruto del Nombre del Señor en su mente."