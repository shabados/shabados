[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਖ ਸੋਹਿਲੜੇ ਹਰਿ ਗਾਵਣ ਲਾਗੇ ॥"
page = 459
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When I began to sing songs of joy to God,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਮੈਂ ਵਾਹਿਗੁਰੂ ਦੇ ਖੁਸ਼ੀ ਦੇ ਗੀਤ ਗਾਉਣ ਲੱਗ ਪਿਆ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When I began to sing the songs of rejoicing to the Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਤੇ ਹਰੀ ਕੋ ਗਾਵਣ ਲਗੇ ਹੈਂ ਤਬ ਤੇ ਸੁਖ ਔ ਮੰਗਲਾਚਾਰ ਹੋ ਰਹੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਭਗਤ (ਹਰਿ-ਜਨ) ਜਦੋਂ ਪਰਮਾਤਮਾ ਦੇ ਸੁਖਦਾਈ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੇ ਸੋਹਣੇ ਗੀਤ ਗਾਣ ਲੱਗ ਪੈਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋਹਿਲੜੇ = ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੇ ਸੋਹਣੇ ਗੀਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando empecé a cantar la Melodía de Éxtasis del Señor,"