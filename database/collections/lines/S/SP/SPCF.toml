[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧੀਰਉ; ਦੇਖਿ ਤੁਮੑਾਰੇ ਰੰਗਾ ॥"
page = 824
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Seeing Thine wondrous plays I have grown fortitudinous."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਅਦਭੁਤ ਖੇਲ, ਦੇਖ ਕੇ ਮੈਂ ਧੀਰਜਵਾਨ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am reassured, gazing upon Your wondrous play."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਤੁਮਾਰੇ ਰੰਗਾਂ ਕਉ ਦੇਖ ਕਰ ਮੈਂ (ਧੀਰਉ) ਧੀਰਜ ਕੋ ਪ੍ਰਾਪਤਿ ਭਯਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰੇ ਚੋਜ-ਤਮਾਸ਼ੇ ਵੇਖ ਵੇਖ ਕੇ ਮੈਨੂੰ (ਭੀ) ਹੌਸਲਾ ਬਣ ਰਿਹਾ ਹੈ (ਕਿ ਤੂੰ ਮੇਰੀ ਭੀ ਸਹਾਇਤਾ ਕਰੇਂਗਾ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧੀਰਉ = ਧੀਰਉਂ, ਮੈਂ ਧੀਰਜ ਫੜਦਾ ਹਾਂ, ਮੇਰੇ ਮਨ ਨੂੰ ਧੀਰਜ ਆ ਜਾਂਦੀ ਹੈ। ਦੇਖਿ = ਵੇਖ ਕੇ। ਰੰਗਾ = ਕੌਤਕ, ਚੋਜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Viendo Tu Obra Maravillosa, oh Señor, estoy en Paz"