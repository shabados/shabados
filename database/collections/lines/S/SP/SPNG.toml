[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਗੁਣ ਗਾਵਹੁ; ਮੀਤ ਹਮਾਰੇ ॥"
page = 698
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My friend, sing thou the praise of thy heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਮਿੱਤ੍ਰ, ਤੂੰ ਵਾਹਿਗੁਰੂ ਦੀਆਂ ਸਿਫਤਾਂ ਗਾਇਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sing the Glorious Praises of the Lord, O my friend."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਮਾਰੇ ਮਿਤਰ! ਹਰੀ ਕੇ ਗੁਣੋਂ ਕੋ ਗਾਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਿੱਤਰੋ! ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੇ ਗੀਤ ਗਾਇਆ ਕਰੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੀਤ ਹਮਾਰੇ = ਹੇ ਸਾਡੇ ਮਿੱਤਰੋ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Amigo mío, canta la Alabanza del Señor;"