type = "primary"
data = "ਆਨਿ ਸਮਾਨ ਨ ਆਪੁ ਬਿਰਾਜਾ ॥"
page = 624

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He had conquered many kings of undivided territories and there was none like him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਸਮਾਨ ਹੋਰ ਕੋਈ ਆ ਕੇ ਨਹੀਂ ਬਿਰਾਜਿਆ ਸੀ।"