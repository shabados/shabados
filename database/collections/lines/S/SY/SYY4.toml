[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੈਸਾ ਘਰਿ; ਬਾਹਰਿ ਸੋ ਤੈਸਾ ॥"
page = 221
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As is the Lord within home, so is He without."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਦਾ ਪ੍ਰਭੂ ਗ੍ਰਹਿ ਦੇ ਵਿੱਚ ਹੈ, ਉਹੋ ਜਿਹਾ ਹੀ ਉਹ ਬਾਹਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Just as He is within the home of the self, so is He beyond."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮੇਸ੍ਵਰ ਜੈਸਾ ਘਰ ਮੇਂ ਪੂਰਨ ਹੈ ਤੈਸਾ ਹੀ (ਬਾਹਰਿ) ਬਨ ਮੇਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇ ਮਨ-ਹਾਥੀ ਦੇ ਸਿਰ ਤੇ ਗੁਰੂ-ਕੁੰਡਾ ਨਹੀਂ ਹੈ ਤਾਂ) ਜਿਹੋ ਜਿਹਾ (ਅਮੋੜ) ਇਹ ਗ੍ਰਿਹਸਤ ਵਿਚ (ਰਹਿੰਦਿਆਂ) ਹੈ, ਉਹੋ ਜਿਹਾ (ਅਮੋੜ) ਇਹ ਬਾਹਰ (ਜੰਗਲਾਂ ਵਿਚ ਰਹਿੰਦਿਆਂ) ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él, el Señor, está dentro de nuestra casa, pero también afuera."