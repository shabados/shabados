[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਭਾਵੈ; ਤਿਉ ਕਰਿ ਪ੍ਰਤਿਪਾਲਾ ॥੪॥੨੨॥"
page = 376
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As it pleases Thee, so doest support me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਤੈਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ, ਉਸੇ ਤਰ੍ਹਾਂ ਹੀ ਮੇਰੀ ਪਾਲਣਾ-ਪੋਸਣਾ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As it pleases Him, He cherishes us. ||4||22||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪ੍ਰਕਾਰ ਤੁਝ ਕੋ ਅਛਾ ਲਗੈ ਤਿਸੀ ਪ੍ਰਕਾਰ ਮੇਰੀ ਪ੍ਰਤਿਪਾਲਾ ਕਰ, ਭਾਵ ਏਹ ਕਿ ਅਪਨੇ ਭਾਣੇ ਮੇਂ ਮੁਝੇ ਪ੍ਰਸੰਨ ਰਖ॥੪॥੨੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਹੋ ਸਕੇ (ਵਿਕਾਰਾਂ ਅਤੇ ਮਾਇਆ ਦੇ ਮੋਹ ਦੇ ਦਬਾਉ ਤੋਂ ਜੀਵਾਂ ਦੀ) ਰਾਖੀ ਕਰ ॥੪॥੨੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਤਿਪਾਲਾ = ਰਾਖੀ, ਹਿਫ਼ਾਜ਼ਤ ॥੪॥੨੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "libérame, si es Tu Voluntad. (4‑22)"