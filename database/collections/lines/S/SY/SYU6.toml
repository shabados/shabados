[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਰਕ ਸੁਰਗ ਅਵਤਾਰਾ ॥"
page = 1003
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It lands in hell and heaven,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਦੋਜ਼ਖ ਅਤੇ ਬਹਿਸ਼ਤ ਅੰਦਰ ਪ੍ਰਵੇਸ਼ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "People are incarnated in heaven and in hell."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਕਰ ਪੁਨਾ ਸ੍ਵਰਗ ਮੈਂ ਜਨਮ ਹੋਣਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਨਰਕਾਂ ਵਿਚ ਹਨ, ਕੋਈ ਸੁਰਗਾਂ ਵਿਚ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਵਤਾਰਾ = ਜੰਮਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la gente encarna en lo bueno y en lo malo,"