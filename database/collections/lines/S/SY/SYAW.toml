[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਿਧਿ ਨੀਰ ਕੇ ਭੀਤਰ ਜਾਇ ਬਸੇ; ਮੁਖ ਤੇ ਸਭ ਐਸੇ ਚਲੇ ਸੁ ਰਰੇ ॥"
page = 492

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And all of them talking about various things went to reside on the sea-coast"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਸਮੁੰਦਰ ਵਿਚ ਜਾ ਵਸੇ ਹਨ। (ਅਰਥਾਤ ਦੁਆਰਿਕਾ ਨਾਂ ਦੇ ਟਾਪੂ ਵਿਚ ਜਾ ਵਸੇ ਹਨ) ਅਤੇ ਮੁਖ ਤੋਂ ਇਸ ਤਰ੍ਹਾਂ ਕਹਿੰਦੇ ਚਲੇ ਹਨ।"