[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਨ ਖੇਲੁ; ਆਪ ਹੀ ਕੀਨੋ ॥"
page = 253
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His play, He has Himself set afoot."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਖੇਡ ਉਸ ਨੇ ਆਪੇ ਹੀ ਰਚ ਰੱਖੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself has set His own play in motion."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨੇ ਅਪਨਾ ਜਗਤ ਰੂਪ ਅਪਨਾ ਖੇਲ ਆਪ ਹੀ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਾਰਾ ਜਗਤ-ਖੇਲ ਪ੍ਰਭੂ ਨੇ ਆਪ ਹੀ ਬਣਾਇਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él mismo juega Su Propia Jugada"