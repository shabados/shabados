[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਸਾ ਮਹਲਾ ੫ ਅਸਟਪਦੀਆ ਘਰੁ ੨ ॥"
page = 430
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Asa 5th Guru. Ashtpadis"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਸਾ ਪੰਜਵੀਂ ਪਾਤਸ਼ਾਹੀ। ਅਸ਼ਟਪਦੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Aasaa, Fifth Mehl, Ashtpadheeyaa, Second House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਆਸਾ, ਘਰ ੨ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਅੱਠ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Asa, Mejl Guru Aryan, Quinto Canal Divino, Ashtapadis."