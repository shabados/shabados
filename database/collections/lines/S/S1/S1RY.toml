[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ; ਨਿਸਚੌ ਧੵਿਾਵੈ ॥"
page = 1353
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, in good faith, meditate thou on the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਆਖਦੇ ਹਨ ਤੂੰ ਨੇਕ-ਨੀਅਤੀ ਨਾਲ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, meditate on the Lord with faith."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਤਾਂ ਤੇ ਹੇ ਭਾਈ! ਨਿਸਚਾ ਕਰ ਕੇ ਵਾਹਿਗੁਰੂ ਕੇ ਨਾਮ ਕੋ ਹੀ ਧਿਆਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- (ਮਨੁੱਖ) ਸਰਧਾ ਧਾਰ ਕੇ ਪਰਮਾਤਮਾ ਨੂੰ ਸਿਮਰੇ (ਕੇਵਲ ਇਹੋ ਰਸਤਾ ਲਾਭਦਾਇਕ ਹੈ, ਪਰ)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਸਚੌ = ਸਰਧਾ ਧਾਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "dice Nanak, pues sin el Guru Verdadero,"