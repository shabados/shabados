[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਲਬਿਖ ਬਿਨਸੇ; ਗਾਇ ਗੁਨਾ ॥"
page = 1184
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Singing the Lord's praise, my sins are effaced,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦਾ ਜੱਸ ਗਾਉਣ ਦੁਆਰਾ, ਮੇਰੇ ਪਾਪ ਮਿਟ ਗਏ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The sins are erased, singing the Glories of God;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਾਰੇ ਪਾਪ ਤਿਸ ਕੇ ਗੁਣੋਂ ਕੋ ਗਾਇ ਕਰ ਨਸਟ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕੋਈ ਭੀ ਮਨੁੱਖ ਹੋਵੇ, ਪਰਮਾਤਮਾ ਦੇ) ਗੁਣ ਗਾ ਕੇ ਉਸ ਦੇ ਸਾਰੇ ਪਾਪ ਨਾਸ ਹੋ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਿਲਬਿਖ = ਪਾਪ। ਗਾਇ = ਗਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cantando las Alabanzas del Señor, uno se libera de miles de errores"