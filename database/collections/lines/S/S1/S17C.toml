type = "primary"
data = "ਜੰਤ੍ਰ ਮੰਤ੍ਰ ਕਰਿ ਲਯੋ ਬੁਲਾਈ ॥"
page = 952

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Her friends suggested her remedies and with magical spells summoned the Raja."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜੰਤ੍ਰ ਮੰਤ੍ਰ ਕਰ ਕੇ (ਪੁੰਨੂੰ ਨੂੰ) ਬੁਲਾ ਲਿਆ।"