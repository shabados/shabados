[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੈ ਹੈ ਯਾਹਿ ਨਿਕਾਰਿ ਕੈ; ਲੈ ਹੈ ਦੇਸ ਮਰੋਰਿ ॥੩॥"
page = 927

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "To capture the country and took her away.(3)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਮਨੋਰਥ ਨਾਲ ਕਿ) ਉਸ ਨੂੰ ਉਥੋਂ ਕਢ ਦੇਈਏ ਅਤੇ ਦੇਸ਼ ਖੋਹ ਲਈਏ ॥੩॥"