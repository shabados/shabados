[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਖਿਆ ਕਰਹੁ ਗੁਸਾਈ ਮੇਰੇ; ਮੈ. ਨਾਮੁ ਤੇਰਾ ਆਧਾਰੁ ॥੧॥ ਰਹਾਉ ॥"
page = 382
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Preserve me, O Lord! of the universe. Thy Name is my support. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਹਿਫਾਜਤ ਕਰ, ਹੇ ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਸੁਆਮੀ! ਤੈਡਾਂ ਨਾਮ ਮੇਰਾ ਆਸਰਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Save me, O Lord of the Universe! Your Name is my only Support. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਗੁਸਾਈ ਸੁਆਮੀ! ਇਸ ਸੰਸਾਰ ਸੇ ਮੇਰੀ ਰਖ੍ਯਾ ਕਰੋ, ਮੈਨੇ ਏਕੁ ਤੇਰਾ ਨਾਮੁ ਹੀ ਆਸਰਾ ਕੀਆ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਖਸਮ-ਪ੍ਰਭੂ! (ਇਸ ਜ਼ਹਰ ਤੋਂ) ਮੈਨੂੰ ਬਚਾਈ ਰੱਖ, ਤੇਰਾ ਨਾਮ ਮੇਰੀ ਜ਼ਿੰਦਗੀ ਦਾ ਆਸਰਾ ਬਣਿਆ ਰਹੇ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਸਾਈ ਮੇਰੇ = ਹੇ ਮੇਰੇ ਮਾਲਕ! ਆਧਾਰੁ = ਆਸਰਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Tú, mi Señor Salvador, protégeme, pues me apoyo en Tu Nombre. (1‑Pausa)"