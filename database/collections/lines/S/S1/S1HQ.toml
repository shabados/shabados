data = "ਨਿਤ︀ਯ ਨਿਤ︀ਯ ਕੋ ਤਾਪੁ ਨਿਵਾਰੋ ॥੧੦॥"
page = 859

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He determined to kill her in water and, thus, become free of the daily skirmishes.(10)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਨਿੱਤ ਨਿੱਤ ਦਾ ਦੁਖ ਦੂਰ ਕਰ ਦਿਆਂਗਾ ॥੧੦॥"