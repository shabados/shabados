[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਪੂਰੈ. ਪੂਰੀ ਕੀਨੀ ॥"
page = 628
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Perfect Guru has done the perfect thing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਾਂ ਨੇ ਪੂਰਨ ਗੱਲ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Perfect Guru has done it perfectly."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੋਂ ਨੇ ਹਮਾਰੀ ਭਗਤੀ ਪੂਰੀ ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਮਨੁੱਖ ਉਤੇ ਪੂਰੇ ਗੁਰੂ ਨੇ ਪੂਰੀ ਕਿਰਪਾ ਕੀਤੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ ਪੂਰੈ = ਪੂਰੇ ਗੁਰੂ ਨੇ। ਪੂਰੀ ਕੀਨੀ = ਪੂਰੀ ਕਿਰਪਾ ਕੀਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Perfecto Guru nos ha bendecido"