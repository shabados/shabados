data = "ਸੁਣੈ ਗਰਭਣੀਆਨ ਕੇ ਗਰਭ ਮੁਚੰ ॥"
page = 112

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Hearing which the pregnancy of women was miscarried."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਨੂੰ) ਸੁਣ ਕੇ ਗਰਭਿਤ ਇਸਤਰੀਆਂ ਦੇ ਗਰਭ-ਪਾਤ ਹੋ ਗਏ।"