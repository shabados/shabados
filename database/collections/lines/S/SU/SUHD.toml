data = "ਤਨ ਸੋਭਤ ਕੰਚਨ ਸੁਧ ਪ੍ਰਭਾ ॥੩੭੧॥"
page = 665

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There the sage a tank and also within the foliage he saw a hunter looking splendid like gold.371."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਤਨ ਸ਼ੁੱਧ ਸੋਨੇ ਵਾਂਗ ਚਮਕਦਾ ਸੀ ॥੩੭੧॥"