data = "ਕਿ ਲੁਝੇਤਿ ਜੁਆਣੰ ॥੨੬੮॥"
page = 577

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors whose limbs have been chopped, are falling in the war arena and the intoxicated warriors are being killed.268."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਯੋਧੇ (ਇਕ ਦੂਜੇ ਨਾਲ ਜੰਗ ਵਿਚ) ਉਲਝੇ ਹੋਏ ਹਨ ॥੨੬੮॥"