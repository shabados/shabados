data = "ਜਿਹ ਠਾ ਦੈਤ ਘਨੇ ਭਟ ਘਾਏ ॥੧੪॥"
page = 986

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Gathered around and raided the place where the devils had beaten them.(14)"

