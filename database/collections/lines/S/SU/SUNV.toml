data = "ਚੰਦ੍ਰਮਾ ਅਤੇ ਸੂਰਜ ਨੂੰ (ਜਿਸ ਨੇ) ਵਿਚਾਰਪੂਰਵਕ ਸਿਰਜਿਆ ਹੈ,"