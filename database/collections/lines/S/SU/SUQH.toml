[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਬਾ; ਮਾਇਆ ਭਰਮਿ ਭੁਲਾਇ ॥"
page = 60
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Brother! mammon deludes with it's illusion."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਧਨ ਦੌਲਤ ਆਪਣੇ ਛਲ ਕਪਟ ਨਾਲ ਬਹਿਕਾ ਦਿੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Baba, Maya deceives with its illusion."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਾਬਾ! ਮਾਯਾ ਨੇ ਸ੍ਰਿਸਟੀ ਭਰਮ ਮੇਂ ਭੁਲਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮਾਇਆ (ਜੀਵਾਂ ਨੂੰ) ਭੁਲੇਖੇ ਵਿਚ ਪਾ ਕੇ ਕੁਰਾਹੇ ਪਾ ਦੇਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਰਮਿ = ਭੁਲੇਖੇ ਵਿਚ (ਪਾ ਕੇ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh querido, Maya engaña con la ilusión."