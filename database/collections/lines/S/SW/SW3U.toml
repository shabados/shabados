[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮਹੀਣ; ਗਏ ਮੂੜ ਨੰਗਾ ॥"
page = 367
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Name, the fools departs naked."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੇ ਬਿਨਾਂ ਮੂਰਖ ਨੰਗੇ ਟੁਰ ਵੰਞਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Naam, the fools depart naked."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਮ ਸੇ ਰਹਿਤ ਮੂਰਖ (ਨੰਗਾ) ਨੰਗ, ਭਾਵ ਦੇਵੀ ਸੰਪਤਾ ਰਹਤ ਸੋ ਚੌਰਾਸੀ ਮੇਂ ਚਲੇ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਤੋਂ ਵਾਂਜੇ ਹੋਏ ਮੂਰਖ ਮਨੁੱਖ (ਇਥੋਂ) ਖ਼ਾਲੀ ਹੱਥ ਚਲੇ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂੜ = ਮੂਰਖ। ਨੰਗਾ = ਨੰਗੇ, ਕੰਗਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sin el Naam, el Nombre del Señor, el ignorante deja el mundo con las manos vacías;"