[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਾਉ ਦੂਜਾ; ਬਿਨਸਿ ਬਿਨਾਸਾ ॥"
page = 801
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that thy love of another pay perish."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਜੋ ਤੇਰਾ ਹੋਰਸ ਦਾ ਪਿਆਰ ਨਾਂ ਹੋ ਜਾਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and your love of duality shall simply vanish."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਔਰ ਧਨਾਦੀ ਦੂਜੇ ਭਾਉ ਕੀ (ਬਿਨਾਸਾ) ਆਸਾ ਸੇ ਬਿਨਾਂ ਹੋਇਗਾ ਤਬ ਦ੍ਵੈਤਭਾਵ ਸੰਪੂਰਨ (ਬਿਨਾਸਾ) ਨਾਸ ਹੋ ਜਾਵੇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਮਾਇਆ ਦੇ ਮੋਹ ਨੂੰ ਪੂਰਨ ਤੌਰ ਤੇ (ਅੰਦਰੋਂ) ਮੁਕਾ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਉ = ਪਿਆਰ। ਭਾਉ ਦੂਜਾ = ਮਾਇਆ ਦਾ ਮੋਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "para que tu relación con el otro sea disuelta."