[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਪਿ ਜੀਵੈ ਨਾਨਕੁ; ਤੇਰੋ ਨਾਮੁ ॥੪॥੧੦॥"
page = 1183
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that Nanak, may live contemplating Thy Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿ ਨਾਨਕ ਤੇਰੇ ਨਾਮ ਨੂੰ ਸਿਮਰਦਾ ਹੋਇਆ ਆਪਣਾ ਜੀਵਨ ਬਤੀਤ ਕਰੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "that Nanak may live in Your Name. ||4||10||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਮੈਂ ਤੇਰੇ ਨਾਮ ਕੋ ਜਪ ਕਰ ਜੀਵੋਂ, ਭਾਵ ਸੇ ਸਦੀਵ ਤੇਰੇ ਨਾਮ ਕੋ ਜਪਤਾ ਰਹੂੰ॥੪॥੧੦॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ (ਤੇਰਾ ਦਾਸ) ਨਾਨਕ ਤੇਰਾ ਨਾਮ ਜਪ ਕੇ ਆਤਮਕ ਜੀਵਨ ਪ੍ਰਾਪਤ ਕਰੇ ॥੪॥੧੦॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਪਿ = ਜਪ ਕੇ। ਜੀਵੈ = ਆਤਮਕ ਜੀਵਨ ਪ੍ਰਾਪਤ ਕਰੇ ॥੪॥੧੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "de que Nanak pueda meditar sólo en Tu Nombre. (4-10)"