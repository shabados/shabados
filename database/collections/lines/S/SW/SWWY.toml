data = "ਸੋਊ ਮਾਰਿ ਰਨ ਭੀਤਰਿ ਲੀਨੋ ॥੧੪੭੭॥"
page = 444

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The king saw this and cutting his sword, he knocked him also in the field.1477."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ (ਦੈਂਤ) ਨੂੰ ਵੀ ਰਣ ਵਿਚ ਮਾਰ ਦਿੱਤਾ ॥੧੪੭੭॥"