[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੈ ਬਲਿ ਚੰਡਿ ਮਹਾ ਰਨ ਮਧਿ ਸੁ; ਲੈ ਜਮਦਾੜ ਕੀ ਤਾ ਪਰਿ ਲਾਈ ॥"
page = 98

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In the war, Chnadi, taking the dagger, struck it with great force on the demon.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਹਾਨ ਚੰਡੀ ਨੇ ਯੁੱਧ-ਭੂਮੀ ਵਿਚ ਬਲ ਪੂਰਵਕ ਕਟਾਰ ('ਜਮਦਾੜ') ਲੈ ਕੇ ਉਸ ਉਤੇ ਚਲਾਈ।"