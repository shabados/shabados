data = "ਅਭੇਦ ਹੈਂ ਅਭੰਗ ਹੈਂ ॥"
page = 7
line = 9

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "That Thou art Immortal and none can know Thy secrets!"

[[content]]
assets = ["RSJD"]
type = "translation"
