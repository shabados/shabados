[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਾਈ ਰੇ; ਦਾਸਨਿ ਦਾਸਾ ਹੋਇ ॥"
page = 66
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Brother! be thou the slave of God's slaves."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਵੀਰ! ਤੂੰ ਰੱਬ ਦੇ ਗੋਲਿਆਂ ਦਾ ਗੋਲਾ ਹੋ ਜਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Siblings of Destiny, be the slaves of the Lord's slaves."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮੇਸ੍ਵਰ ਕੇ ਦਾਸੋਂ ਕਾ ਦਾਸੁ ਬਨੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਰਮਾਤਮਾ ਦੇ ਸੇਵਕਾਂ ਦਾ ਸੇਵਕ ਬਣ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hermano sé el Esclavo de los Esclavos del Guru."