[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੋਹਿ ਰਹਿਯੋ ਅਲਕੈ ਤੁਮਰੀ ਪਿਖਿ; ਜਾਤ ਗਯੋ ਤਜਿ ਯਾ ਨਹੀ ਡੇਰੇ ॥"
page = 369

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I am enamoured of you by seeing your hair, therefore, I could not go to my home, abandoning it"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੇਰੀਆਂ ਜ਼ੁਲਫ਼ਾਂ ਵੇਖ ਕੇ ਮੋਹਿਆ ਗਿਆ ਹਾਂ; ਹੁਣ ਇਨ੍ਹਾਂ ਨੂੰ ਛਡ ਕੇ ਡੇਰੇ ਨਹੀਂ ਜਾਇਆ ਜਾਂਦਾ।"