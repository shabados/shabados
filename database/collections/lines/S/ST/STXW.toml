[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਭ ਸ੍ਰੀ ਨਾਮ ਤੁਪਕ ਕੇ ਜਾਨਹੁ ॥੭੮੦॥"
page = 757

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Dharni”, then add the words “Jaa”, “Char” and “Shatru” and in this way comprehend all the names of Tupak.780."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਲੋਗ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝੋ ॥੭੮੦॥"