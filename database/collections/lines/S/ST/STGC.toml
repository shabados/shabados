[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲੁਕੈ ਨ ਮੂਰਖੁ, ਆਪੁ ਲਖਾਵੈ ॥੫॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Thus, the fool never remains hidden, and he definitely exposes himself."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮੂਰਖ ਲੁਕਦਾ ਨਹੀਂ ਆਪਣਾ ਆਪ ਹੀ ਲਖਾ ਦਿੰਦਾ ਹੈ।"