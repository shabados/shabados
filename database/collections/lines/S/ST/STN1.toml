[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤਹੁ; ਇਹਾ ਬਤਾਵਹੁ ਕਾਰੀ ॥"
page = 616
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O saints, show me such a way,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਧੂਓ! ਮੈਨੂੰ ਕੋਈ ਐਹੋ ਜਿਹੀ ਜੁਗਤੀ ਦੱਸੋ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Saints, show me such a way,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤੋ! ਮੇਰੇ ਕੋ ਏਹੁ ਦਵਾਇ ਬਤਾਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! (ਮੈਨੂੰ ਕੋਈ) ਇਹੋ ਜਿਹਾ ਇਲਾਜ ਦੱਸੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਇਹਾ = ਇਹੋ ਜਿਹੀ। ਕਾਰੀ = ਇਲਾਜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Santos, muéstrenme el Sendero"