type = "primary"
data = "ਤਹ ਤਹ ਪੇਖਾ ॥੧੫੯॥"
page = 566

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Wherever we shall be able to see, only sin will be visible everywhere instead of the Name of the Lord, both in water and on plain.159."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਥੇ ਉਥੇ (ਇਹੀ ਕੁਝ) ਦਿਖੇਗਾ ॥੧੫੯॥"