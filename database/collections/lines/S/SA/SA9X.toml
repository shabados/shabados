[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰਾ. ਹਰਿ ਪ੍ਰਭੁ ਮਿਤੁ ਮਿਲੈ; ਸੁਖੁ ਪਾਈ ਜੀਉ ॥"
page = 175
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When I meet my Lord God, the Friend, I obtain peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਮੈਂ ਆਪਣੇ ਯਾਰ, ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਨੂੰ ਮਿਲਦਾ ਹਾਂ, ਮੈਂ ਆਰਾਮ ਪਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have met the Lord God, my Best Friend, and I have found peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਕਰ ਮੇਰਾ ਮਿਤ੍ਰ ਹਰੀ ਪ੍ਰਭੂ ਮਿਲੇ ਤਉ ਉਸ ਕੋ ਪ੍ਰਾਪਤਿ ਹੋਵਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ (ਹੁਣ ਤਦੋਂ ਹੀ) ਆਨੰਦ ਅਨੁਭਵ ਕਰ ਸਕਦਾ ਹਾਂ ਜਦੋਂ ਮੈਨੂੰ ਮੇਰਾ ਮਿੱਤਰ ਹਰਿ-ਪ੍ਰਭੂ ਮਿਲ ਹੀ ਪਏ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਤੁ = ਮਿੱਤਰ। ਪਾਈ = ਪਾਈਂ, ਮੈਂ ਪਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y cuando mi Señor y Amigo me encuentre, estaré en total Paz."