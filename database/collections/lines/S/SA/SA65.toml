[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਗਟਿਆ ਸਭ ਮਹਿ; ਲਿਖਿਆ ਧੁਰ ਕਾ ॥ ਰਹਾਉ ॥"
page = 396
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The primal writ has become manifest amongst all. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁੱਢਲੀ ਲਿਖਤ ਸਾਰਿਆਂ ਵਿੱਚ ਜਾਹਰ ਹੋ ਗਈ ਹੈ, ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This pre-ordained destiny has been revealed to all. ||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਜੀਵੋਂ ਮੇਂ (ਧੁਰ) ਅਕਾਲ ਪੁਰਖ ਕੀ ਕ੍ਰਿਪਾ ਕਾ ਲੇਖੁ ਲਿਖਿਆ ਹੂਆ ਪ੍ਰਗਟ ਹੂਆ ਹੈ॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੀ ਬਰਕਤਿ ਨਾਲ ਉਸ ਦੀ ਸਰਨ ਆਉਣ ਵਾਲੇ) ਸਾਰੇ ਜੀਵਾਂ ਦੇ ਅੰਦਰ ਧੁਰ-ਦਰਗਾਹ ਦਾ (ਸੇਵਾ-ਭਗਤੀ ਦਾ) ਲੇਖ ਉੱਘੜ ਰਿਹਾ ਹੈ ਰਹਾਉ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭ ਮਹਿ = ਸਭ ਜੀਵਾਂ ਦੇ ਅੰਦਰ। ਪ੍ਰਗਟਿਆ = ਪਰਗਟ ਹੋ ਪਿਆ, ਜਾਗ ਪਿਆ। ਲਿਖਿਆ ਧੁਰ ਕਾ = (ਜੀਵਾਂ ਦੇ ਕੀਤੇ ਕਰਮਾਂ ਅਨੁਸਾਰ) ਧੁਰ ਦਰਗਾਹ ਦਾ ਲਿਖਿਆ (ਸੰਸਕਾਰ-ਰੂਪ) ਲੇਖ ॥ਰਹਾਉ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "se hizo manifiesto en el mundo. (Pausa)"