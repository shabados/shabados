[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੂਰ ਸਮਾਨ ਲਖਾ ਦਿਨ ਕੈ ਤਿਹ; ਚੰਦ ਸਰੂਪ ਨਿਸਾ ਪਹਿਚਾਨਾ ॥"
page = 677

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The day considered him as the sun and the night as the moon"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਨੇ ਸੂਰਜ ਦੇ ਸਮਾਨ ਵੇਖਿਆ ਹੈ ਅਤੇ ਰਾਤ ਨੇ ਚੰਦ੍ਰਮਾ ਸਮਾਨ ਪਛਾਣਿਆ ਹੈ।"