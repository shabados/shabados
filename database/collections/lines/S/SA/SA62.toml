[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਬੀਰ. ਅਲਹ ਕੀ ਕਰਿ ਬੰਦਗੀ ਜਿਹ ਸਿਮਰਤ ਦੁਖੁ ਜਾਇ ॥"
page = 1374
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Kabir, perform thou the meditation of thy God, contemplating whom, the troubles depart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ, ਤੂੰ ਆਪਣੇ ਵਾਹਿਗੁਰੂ ਦਾ ਆਰਾਧਨ ਕਰ, ਜਿਸ ਦਾ ਭਜਨ ਕਰਨ ਦੁਆਰਾ ਦੁਖੜੇ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Kabeer, worship the Lord Allah; meditating in remembrance on Him, troubles and pains depart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕਬੀਰ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਹੇ ਭਾਈ! ਅਲਹ ਕੀ ਬੰਦਗੀ ਕਰ ਜਿਸ ਕੇ ਸਿਮਰਤਿਆਂ ਹੋਇਆਂ ਤੇਰਾ ਜਨਮ ਮਰਨ ਰੂਪ ਦੁਖ ਦੂਰ ਹੋ ਜਾਇਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਬੀਰ! ਰੱਬ ਦੀ ਬੰਦਗੀ ਕਰ, ਬੰਦਗੀ ਕੀਤਿਆਂ ਹੀ ਦਿਲ ਦਾ ਵਿਕਾਰ ਦੂਰ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Kabir, alaba al Señor Alhá, meditando en Él, los problemas se acaban,"