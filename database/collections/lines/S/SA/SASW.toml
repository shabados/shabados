[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਗੁਪਤੁ ਵਰਤਦਾ; ਆਪੇ ਹੀ ਜਾਹਰਿ ॥"
page = 555
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He Himself prevails unmanifest and Himself is the manifest."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪੇ ਅਲੋਪ ਵਿਚਰਦਾ ਹੈ ਅਤੇ ਆਪ ਹੀ ਪ੍ਰਗਟ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is prevailing unmanifest, and He Himself is manifest."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਮਨਮੁਖੋਂ ਸੇ ਗੁਪਤ ਬਰਤਤਾ ਹੈ ਆਪ ਹੀ ਗੁਰਮੁਖੋਂ ਕੋ ਪ੍ਰਗਟ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ (ਸਭ ਵਿਚ) ਲੁਕਿਆ ਹੋਇਆ ਹੈ ਤੇ ਆਪੇ ਪ੍ਰਤੱਖ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਪਤੁ = ਲੁਕਿਆ ਹੋਇਆ। ਵਰਤਦਾ = ਮੌਜੂਦ ਹੈ। ਜਾਹਰਿ = ਪ੍ਰਤੱਖ, ਸਾਹਮਣੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él Mismo es Manifiesto, y Su Ser no lo manifiesta."