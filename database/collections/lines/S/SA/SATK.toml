[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧਸੰਗਤਿ ਕਉ. ਜੋਹਿ ਨ ਸਾਕੈ; ਮਲਿ ਮਲਿ ਧੋਵੈ ਪਾਇ ॥੧॥"
page = 500
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It cannot touch the society of saints and ever rubs and washes saints feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੰਤੂ ਇਹ ਸਤਿਸੰਗਤ ਨੂੰ ਛੂਹ ਤੱਕ ਨਹੀਂ ਸਕਦੀ ਅਤੇ ਸਾਧੂਆਂ ਦੇ ਪੈਰਾਂ ਨੂੰ ਹਮੇਸ਼ਾਂ ਲਈ ਅਤੇ ਧੋਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But she cannot touch the Saadh Sangat, the Company of the Holy; she washes and massages their feet. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਸਾਧ ਸੰਗਤ ਕੀ ਓਰ ਨਿਗਾਹ ਨਹੀਂ ਕਰ ਸਕਤੀ, ਮਲ ਮਲ ਕਰ ਪੈਰ ਧੋਤੀ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਸਾਧ ਸੰਗਤਿ ਵਲ (ਤਾਂ ਇਹ ਮਾਇਆ) ਤੱਕ ਭੀ ਨਹੀਂ ਸਕਦੀ, (ਇਹ ਮਾਇਆ ਸਤਸੰਗੀਆਂ ਦੇ) ਪੈਰ ਮਲ ਮਲ ਕੇ ਧੋਂਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਜੋਹਿ ਨ ਸਾਕੈ = ਤੱਕ ਨਹੀਂ ਸਕਦੀ। ਮਲਿ = ਮਲ ਕੇ। ਪਾਇ = ਪੈਰ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por el contrario, se le ve lavando siempre Sus Pies. (1)"