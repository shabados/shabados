[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁੰਨ ਸਹਜ ਮਹਿ; ਬੁਨਤ ਹਮਾਰੀ ॥੧॥"
page = 1158
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My weaving is now in the divine stillness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਬੁਣਨਾ ਹੁਣ ਈਸ਼ਵਰੀ ਚੁਪਚਾਪ ਅੰਦਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My weaving now is in the most profound celestial stillness. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸੁੰਨ ਸਹਜ) ਅਫੁਰ ਅਚੁਤ ਪ੍ਰਮੇਸ੍ਵਰ ਮੇਂ ਹਮਾਰੀ ਬੁਨਿਤ ਹੋ ਰਹੀ ਹੈ, ਭਾਵ ਤਿਸਮੈਂ ਹਮਾਰੀ ਬ੍ਰਿਤੀ ਲਗ ਰਹੀ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਲਿਵ ਹੁਣ ਉਸ ਅਵਸਥਾ ਵਿਚ ਟਿਕੀ ਹੋਈ ਹੈ, ਜਿੱਥੇ ਮਾਇਆ ਦੇ ਫੁਰਨੇ ਨਹੀਂ ਹਨ, ਜਿੱਥੇ ਅਡੋਲਤਾ ਹੀ ਅਡੋਲਤਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁੰਨਿ = ਅਫੁਰ ਅਵਸਥਾ। ਸਹਜ = ਅਡੋਲ ਅਵਸਥਾ। ਬੁਨਤ = ਤਾਣੀ, ਮਨ ਦੀ ਲਗਨ, ਲਿਵ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mi casta y mi familia, ahora sólo tejo nada más que el Nombre de Dios en la experiencia del Equilibrio. (1)"