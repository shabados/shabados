data = "ਚਤੁਰੰਗਨੀ ਫੌਜ ਭਜੀ ਜਾਂਦੀ ਹੈ ਅਤੇ ਰਾਜਾ (ਜਰਾਸੰਧ ਨੇ) ਅੱਖਾਂ ਨਾਲ ਵੇਖ ਲਿਆ ਹੈ।"