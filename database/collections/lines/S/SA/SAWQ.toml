[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਹਿ ਨਿਰੰਜਨੁ; ਤ੍ਰਿਭਵਣ ਧਣੀ ॥"
page = 974
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the centre is the Pure Lord, the Master of the three worlds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਂਦਰ ਵਿੱਚੱ, ਤਿਨ੍ਹਾਂ ਜਹਾਨਾਂ ਦਾ ਮਾਲਕ ਪਵਿੱਤਰ ਪ੍ਰਭੂ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Within it is the Immaculate Lord, the Master of the three worlds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕਮਲ ਕੇ (ਮਾਹਿ) ਬੀਚ ਤਿੰਨਾਂ ਭਵਨਾਂ ਕਾ ਸ੍ਵਾਮੀ ਨਿਰਜੰਨੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਬੰਦੇ ਦੇ ਧੁਰ ਅੰਦਰ ਤ੍ਰਿਲੋਕੀ ਦਾ ਮਾਲਕ ਪ੍ਰਭੂ ਆ ਟਿਕਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਹਿ = ਧੁਰ ਅੰਦਰ। ਧਣੀ = ਮਾਲਕ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en él habita el Dios Desapegado, el Maestro de las tres Gunas."