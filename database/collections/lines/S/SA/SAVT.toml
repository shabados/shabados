[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਡੇ ਭੂਪਤਿ ਰਾਜੇ ਹੈ ਛੇਧੇ ॥੪॥"
page = 872
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "She has destroyed the great lords of earth and kings."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਜਿਮੀਂ ਦੇ ਭਾਰੇ ਸੁਆਮੀਆਂ ਅਤੇ ਪਾਤਿਸ਼ਾਹਾਂ ਨੂੰ ਤਬਾਹ ਕਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "She destroyed the great emperors and kings of the world. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਬਡੇ ਜੋ ਸਾਰੀ ਪ੍ਰਿਥਵੀ ਕੇ ਪਤੀ ਰਾਜੇ ਹੈਂ, ਵਹੁ ਭੀ ਹਰਿ ਕੀ ਭਗਤੀ ਕਰਨੇ ਸੇ (ਛੇਧੇ) ਕਾਟ ਦੀਏ ਹੈਂ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਭ ਰਾਜੇ ਰਾਣੇ ਭੀ ਇਸ ਨੇ ਨਕੇਲੇ ਹੋਏ ਹਨ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੂਪਤਿ = ਰਾਜੇ {ਭੂ = ਧਰਤੀ। ਪਤਿ = ਮਾਲਕ}। ਛੇਧੇ = ਵਿੰਨ੍ਹੇ ਹੋਏ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ha destruido aun a reyes y a hombres grandiosos. (4)"