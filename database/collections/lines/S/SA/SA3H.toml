[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨਸਿ ਗਏ; ਬਿਖੈ ਜੰਜਾਲ ॥"
page = 1272
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then all the entanglements of mammon are past."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਮਾਇਆ ਦੇ ਸਾਰੇ ਅਲਸੇਟੇ ਮੁਕ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "corrupt entanglements have come to an end."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੇ ਬਿਸੇ ਜੰਜਾਲ ਸਭ ਬਿਨਸ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੇ ਅੰਦਰੋਂ) ਵਿਸ਼ੇ-ਵਿਕਾਰਾਂ ਦੀਆਂ ਫਾਹੀਆਂ ਮੁੱਕ ਜਾਂਦੀਆਂ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਖੈ ਜੰਜਾਲ = ਵਿਸ਼ੇ-ਵਿਕਾਰਾਂ ਦੀਆਂ ਫਾਹੀਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y los enredos corruptos de la mente han terminado"