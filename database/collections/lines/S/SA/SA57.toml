[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤੁਮਲ ਕਰਿਯੋ ਸੰਗ੍ਰਾਮ; ਘਨੇ ਮਾਰੇ ਜਾਦਵ ਨਰ ॥"
page = 433

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The five noteworthy warriors, Jagat Singh etc., waged a dreadful war and killed many Yadavas"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਨ੍ਹਾਂ ਨੇ ਬਹੁਤ ਭਿਆਨਕ ਯੁੱਧ ਕੀਤਾ ਹੈ ਅਤੇ ਬਹੁਤ ਸਾਰੇ ਯਾਦਵ ਸੈਨਿਕ ਮਾਰ ਦਿੱਤੇ ਹਨ।"