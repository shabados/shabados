[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਨ ਕਮਾਨ ਕ੍ਰਿਪਾਨ ਸੈਹਥੀ; ਬਾਣ ਪ੍ਰਯੋਘ ਚਲਾਏ ॥"
page = 686

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The arrows, bows, swords, lances etc. were used"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਾਣ, ਕਮਾਨ, ਕ੍ਰਿਪਾਨ, ਸੈਹਥੀ ਅਤੇ ਬਹੁਤ ਅਧਿਕ ਤੀਰ ਚਲਾਏ ਹਨ।"