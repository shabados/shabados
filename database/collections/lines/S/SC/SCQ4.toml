data = "ਪਰੇ ਚਰਮ ਬਰਮੰ ਕਹੂੰ ਗਾਤ ਟੂਟੇ ॥"
page = 107

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere their shields, armour and wounded bodies are lying scattered"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਯੁੱਧ-ਭੂਮੀ ਵਿਚ) ਕਿਤੇ ਢਾਲਾਂ, ਕਵਚ ਅਤੇ ਕਿਤੇ ਕਟੇ ਹੋਏ ਸ਼ਰੀਰ ਪਏ ਹੋਏ ਸਨ।"