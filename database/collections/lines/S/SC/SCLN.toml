[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਕਿਉਣਕਿ ਜੋ ਸਾਰੀ ਦੁਨੀਆ ਦੀ ਦੌਲਤ ਉਹ ਇੱਕੋ ਨਜ਼ਰ ਨਾਲ ਬਖ਼ਸ਼ ਦਿੰਦੇ ਹਨ ।"

[[content]]
assets = ["GSNL"]
