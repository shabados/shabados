[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਨਕ ਸਨੰਦ. ਮਹੇਸ ਸਮਾਨਾਂ ॥"
page = 691
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Personalities like Sanak, Snand, Shive and Sheshnag,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਨਕ, ਸਨੰਦ, ਸ਼ਿਵਜੀ ਅਤੇ ਸ਼ੇਸ਼ਨਾਗ ਵਰਗੀਆਂ ਵਿਅਕਤੀਆਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Beings like Sanak, Sanand, Shiva and Shaysh-naaga"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਨਕ ਸਨੰਦਨ ਆਦੀ ਬ੍ਰਹਮਾ ਜੀ ਕੇ ਪੁਤਰ ਔ (ਮਹੇਸ) ਸਿਵ ਜੀ ਪੁਨਾ ਤਿਨ ਕੇ (ਸਮਾਨਾ) ਸਮਾਨ ਔਰ ਭੀ ਸਕਤਧਾਰੀ ਜੇਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! (ਬ੍ਰਹਮਾ ਦੇ ਪੁੱਤਰਾਂ) ਸਨਕ, ਸਨੰਦ ਅਤੇ ਸ਼ਿਵ ਜੀ ਵਰਗਿਆਂ ਨੇ ਤੇਰਾ ਭੇਦ ਨਹੀਂ ਪਾਇਆ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਨਕ ਸਨੰਦ = ਬ੍ਰਹਮਾ ਦੇ ਪੁੱਤਰ (ਸਨਕ, ਸਨੰਦ, ਸਨਾਤਨ, ਸਨਤ ਕੁਮਾਰ)। ਮਹੇਸ = ਸ਼ਿਵ। ਸਮਾਨਾਂ = ਵਰਗਿਆਂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Seres como Sanak, Sanand, Shiva y Shesh-naga,"