[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇ. ਨ ਹੋਤੀ, ਬਾਪੁ ਨ ਹੋਤਾ; ਕਰਮੁ ਨ ਹੋਤੀ ਕਾਇਆ ॥"
page = 973
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When there was no mother, no father, no deed and no human body;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਮਾਂ ਨਹੀਂ ਸੀ, ਪਿਉ ਨਹੀਂ ਸੀ, ਨਾਂ ਕੋਈ ਅਮਲ ਸੀ ਤੇ ਨਾਂ ਹੀ ਮਨੁੱਖੀ ਦੇਹ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When there was no mother and no father, no karma and no human body,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਲੋ ਮੇਂ ਜਬ ਮਾਇ ਨਹੀਂ ਥੀ ਔ ਬਾਪ ਨਹੀਂ ਥਾ, ਨਾ ਕਰਮ ਥਾ, ਨਾ ਕਾਇਆ ਹੀ ਹੋਤੀ ਥੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇ ਇਹ ਮੰਨੀਏ ਕਿ ਕਰਮਾਂ ਦੀ ਖੇਡ ਹੈ ਤਾਂ) ਜਦੋਂ ਨਾ ਮਾਂ ਸੀ ਨਾ ਪਿਉ; ਨਾ ਕੋਈ ਮਨੁੱਖਾ-ਸਰੀਰ ਸੀ, ਤੇ ਨਾ ਉਸ ਦਾ ਕੀਤਾ ਹੋਇਆ ਕਰਮ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਇ = ਮਾਂ। ਕਾਇਆ = ਮਨੁੱਖਾ ਸਰੀਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando no había ni padre, ni madre, ni forma, ¿de dónde entonces se originó el Karma?"