[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈ ਰਾਤਿ ਦਿਹੈ; ਵਡਿਆਈਆਂ ॥"
page = 73
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "admire by night and day."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਸੰਸਾ ਕਰਦਾ ਹਾਂ; ਦਿਨ ਤੇ ਰਾਤ ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forever and ever, night and day."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਨੇ ਰਾਤਿ ਔਰ ਦਿਨ ਤੇਰੀਆਂ ਭਲਿਆਈਆਂ ਹੀ ਵਡਿਆਈਆਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤੇਰੀ ਮਿਹਰ ਨਾਲ) ਮੈਂ ਦਿਨੇ ਰਾਤ ਸਲਾਹੁੰਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦਿਹੈ = ਦਿਨੇ। ਵਡਿਆਈਆ = ਸਾਲਾਹੀਆਂ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Te rezo noche y día."