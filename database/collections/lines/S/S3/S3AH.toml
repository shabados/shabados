[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੂ ਗੁਰੂ; ਗੁਰੁ ਕਰਿ ਮਨ ਮੋਰ ॥"
page = 864
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, think thou of the Guru, the great Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੜੀਏ! ਤੂੰ ਗੁਰਾਂ, ਵੱਡੇ ਗੁਰਾਂ ਨੂੰ ਯਾਦ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chant Guru, Guru, Guru, O my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਗੁਰੂ ਗੁਰੂ ਮਨ ਬਾਣੀ ਕਰ ਕੇ ਭਜਨ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਹਰ ਵੇਲੇ ਗੁਰੂ (ਦੇ ਉਪਦੇਸ਼) ਨੂੰ ਚੇਤੇ ਰੱਖ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਚੇਤੇ ਕਰਿਆ ਕਰ। ਮਨ ਮੋਰ = ਹੇ ਮੇਰੇ ਮਨ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, recita el Nombre del Guru,"