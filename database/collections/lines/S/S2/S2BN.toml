data = "ਹਨਿ ਹੈ ਰਿਸਾਇ ॥੨੩॥੧੪੫॥"
page = 111

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "So that they may go before enemies and in great rage destroy them.23.145."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤਾਂ ਜੋ) ਜਾ ਕੇ ਕ੍ਰੋਧ ਨਾਲ ਵੈਰੀਆਂ ਨੂੰ ਮਾਰ ਦੇਣ ॥੨੩॥੧੪੫॥"