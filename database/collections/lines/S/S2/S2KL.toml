[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਤੇਰੇ ਕੈ; ਆਵੈ ਕਾਮ ॥੧॥ ਰਹਾਉ ॥"
page = 193
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It shall be of avail unto thy soul. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨੂਏ ਇਹ ਤੇਰੀ ਜਿੰਦੜੀ ਦੇ ਕੰਮ ਆਏਗਾ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It alone shall be of use to your soul. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਜੀਅ ਕੇ ਕਾਮ ਆਵੇਗਾ, ਭਾਵ ਯਹਿ ਕਿ ਤੇਰੀ ਸਹਾਇਤਾ ਕਰੇਗਾ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਨਾਮ ਹੀ ਤੇਰੀ ਜਿੰਦ ਦੇ ਕੰਮ ਆਵੇਗਾ (ਜਿੰਦ ਦੇ ਨਾਲ ਸਦਾ ਨਿਭੇਗਾ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ ਕੈ ਕਾਮਿ = ਜਿੰਦ ਦੇ ਕੰਮ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Éste es el Único Consuelo de tu Alma. (1-Pausa)"