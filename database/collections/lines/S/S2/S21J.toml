[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੋਊ ਚਕ੍ਰਵਰਤੀ ਦੋਊ ਸਸਤ੍ਰ ਬੇਤਾ ॥"
page = 147

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Both were the warriors universal monarchs and had knowledge of warfare."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਵੇਂ ਚਕਰਵਰਤੀ ਸਨ, ਦੋਵੇਂ ਸ਼ਸਤ੍ਰ ਚਲਾਉਣ ਵਿਚ ਪ੍ਰਬੀਨ ਸਨ।"