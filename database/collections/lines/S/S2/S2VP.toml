[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਬਿਘਨ; ਜਹ ਆਇ ਸੰਘਾਰੈ ॥"
page = 264
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Where many misfortunes befall and ruin the man,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਬਹੁਤ ਸਾਰੀਆਂ ਦੁਰਘਟਨਾਵਾਂ ਆ ਕੇ ਬੰਦੇ ਨੂੰ ਬਰਬਾਦ ਕਰਦੀਆਂ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Where countless misfortunes threaten to destroy you,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਹਾਂ ਅਨੇਕ ਵਿਘਨ ਇਸ ਜੀਵ ਕੌ ਆਇਕਰ ਸੰਘਾਰ ਕਰੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਅਨੇਕਾਂ ਔਕੜਾਂ ਆ ਦਬਾਉਂਦੀਆਂ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਇ = ਆ ਕੇ। ਸੰਘਾਰੈ = (skt. संहृ) ਨਾਸ ਕਰਦੇ ਹਨ, ਦੁਖੀ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si una multitud de enemigos tratan de destruirte,"