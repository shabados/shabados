[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਘਟਿ ਘਟਿ ਰਹਿਆ ਬਿਆਪਿ ॥"
page = 890
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself is pervading all the hearts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੂਭ ਆਪ ਹੀ ਸਾਰਿਆਂ ਦਿਲਾਂ ਅੰਦਰ ਰਮ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord Himself is pervading in each and every heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਕੈਸਾ ਰਾਮ ਹਰੀ ਹੈ? ਆਪ ਹੀ ਘਟੋਂ ਘਟੋਂ ਮੇਂ ਬਿਆਪ ਰਹਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) (ਹੁਣ ਨਾਨਕ ਨੂੰ ਦਿੱਸ ਰਿਹਾ ਹੈ ਕਿ) ਪਰਮਾਤਮਾ ਆਪ ਹੀ ਹਰੇਕ ਸਰੀਰ ਵਿਚ ਮੌਜੂਦ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੇ = ਆਪ ਹੀ। ਘਟਿ = ਹਿਰਦੇ ਵਿਚ। ਘਟਿ ਘਟਿ = ਹਰੇਕ ਘਟ ਵਿਚ। ਰਹਿਆ ਬਿਆਪਿ = ਵੱਸ ਰਿਹਾ ਹੈ, ਭਰਪੂਰ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Mismo prevalece en todos los corazones."