[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਕਿਛੁ ਕੀਆ. ਸੋ ਹਰਿ ਕੀਆ; ਹਰਿ ਕੀ ਵਡਿਆਈ ॥"
page = 166
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever has been done, has been done by God and is God's glory."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਝ ਹੋਇਆ ਹੈ, ਵਾਹਿਗੁਰੂ ਨੇ ਕੀਤਾ ਹੈ ਅਤੇ ਵਾਹਿਗੁਰੂ ਦੀ ਕੀਰਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever has been done, has been done by the Lord; it is the Glorious Greatness of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਜੋ ਕਿਛੁ ਕੀਆ ਹੈ, ਸੋ ਤੈਂ ਕੀਆ ਹੈ ਔਰ ਹੇ ਹਰੀ! ਤੇਰੀ ਹੀ ਵਡਿਆਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਾਰਾ ਹੀ ਜਗਤ ਜੋ ਬਣਿਆ ਦਿੱਸਦਾ ਹੈ ਇਹ ਸਾਰਾ ਪਰਮਾਤਮਾ ਨੇ ਹੀ ਪੈਦਾ ਕੀਤਾ ਹੈ, ਇਹ ਸਾਰਾ ਉਸੇ ਦਾ ਮਹਾਨ ਕੰਮ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ = ਸਾਰੇ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, todo lo que pasa está en Tú Voluntad;"