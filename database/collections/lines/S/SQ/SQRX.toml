[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੋਗੁ. ਨ ਬਿਆਪੈ; ਤੀਨੌ ਤਾਪ ॥੨॥"
page = 327
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he suffers not from illness and the three fevers."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਬੀਮਾਰੀ ਅਤੇ ਤਿੰਨੇ ਬੁਖਾਰ ਨਹੀਂ ਚਿਮੜਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "he no longer suffers from illness and the three fevers. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਆਧਿ ਬਿਆਧਿ ਉਪਾਧਿ ਤੀਨ ਤਾਪ ਰੂਪੀ ਜੋ ਰੋਗ ਹੈਂ, ਸੋ ਨਹੀਂ ਬਿਅਪਤਾ॥੨॥☬ਉੱਤ੍ਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰੋਗ ਤੇ ਤਿੰਨੇ ਤਾਪ (ਹੁਣ) ਪੋਹ ਨਹੀਂ ਸਕਦੇ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਬਿਆਪੈ = ਪੋਹ ਨਹੀਂ ਸਕਦਾ, ਆਪਣਾ ਦਬਾਅ ਨਹੀਂ ਪਾ ਸਕਦਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "a él ninguna aflicción ni maldad le toca. (2)"