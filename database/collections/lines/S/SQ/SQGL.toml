[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੰਨੇ ਹੁਕਮੁ; ਸੁ ਪਰਗਟੁ ਜਾਇ ॥"
page = 355
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who obeys Lord's command openly goes to Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੁਆਮੀ ਦੇ ਫੁਰਮਾਨ ਦੀ ਪਾਲਣਾ ਕਰਦਾ ਹੈ, ਉਹ ਜ਼ਾਹਿਰਾ ਹੀ ਉਸ ਕੋਲ ਚਲਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who obeys the Hukam of the Lord's Command, goes to Him openly."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾਂ ਕੀ ਆਗਿਆ ਕੋ ਮਾਨਤੇ ਹੈਂ, ਸੋ ਪਰਗਟ ਹੋ ਕਰ ਪ੍ਰਭੂ ਕੇ ਪਾਸ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਿ ਪਰਮਾਤਮਾ ਦੀ ਰਜ਼ਾ ਨੂੰ (ਸਿਰ ਮੱਥੇ ਤੇ) ਮੰਨਦਾ ਹੈ, ਜਗਤ ਵਿਚ ਸੋਭਾ ਖੱਟ ਕੇ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਗਟੁ = ਮਸ਼ਹੂਰ, ਆਦਰ ਪਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El que se somete a la Voluntad del Señor llega hasta Tu Corte,"