[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਰਾਜੇ ਅੰਦਰਿ ਸਦਿਆ; ਮੰਗੁ ਸੁਆਮੀ ਜੋ ਤੁਧੁ ਭਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The king after calling him in asked him to demand anything he liked."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਰਾਜੇ ਨੇ ਅੰਦਰ ਬੁਲਾਕੇ ਕਿਹਾ, “ਮੰਗ ਲੈ ਤੂੰ ਸੁਆਮੀ ਜੀ! ਜੋ ਤੈਂ ਭਾਉਂਦਾ ਹੈ”।"