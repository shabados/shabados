[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਪਿ ਕਟਕ ਆਜੁ ਜੀਤਯੋ ਬਨਾਇ ॥"
page = 249

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then the messengers went to give the news to Ravana that the forces of monkeys have been defeated"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿ ਬੰਦਰਾਂ ਦੀ ਸੈਨਾ ਅੱਜ ਚੰਗੀ ਤਰ੍ਹਾਂ ਨਾਲ ਜਿੱਤੀ ਗਈ ਹੈ।"