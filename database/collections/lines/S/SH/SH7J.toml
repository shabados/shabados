[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਗਹਿਰ ਗੰਭੀਰੁ ਹੈ ਪਿਆਰਾ; ਤਿਸੁ ਜੇਵਡੁ. ਅਵਰੁ ਨ ਕੋਇ ॥"
page = 605
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Beloved Himself is deep and unfathomable and as great as He, there is none else."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੀਤਮ ਖੁਦ ਡੂੰਘਾ ਅਤੇ ਅਥਾਹ ਹੈ। ਉਸ ਜਿੱਡਾ ਵੱਡਾ ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Beloved Himself is deep and profound and unfathomable; there is no other as great as He."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪੇ ਹੀ ਪ੍ਯਾਰਾ ਬਡਾ ਗਹਿਰਾ ਔਰ ਗੰਭੀਰੁ ਹੈ, ਤਿਸ ਕੇ ਬਰਾਬਰ ਦੂਸਰਾ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪ੍ਰਭੂ ਹੀ (ਮਾਨੋ, ਇਕ) ਬੇਅੰਤ ਡੂੰਘਾ (ਸਮੁੰਦਰ) ਹੈ। ਉਸ ਦੇ ਬਰਾਬਰ ਦਾ ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੰਭੀਰੁ = ਡੂੰਘੇ ਜਿਗਰੇ ਵਾਲਾ। ਤਿਸੁ ਜੇਵਡੁ = ਉਸ ਜਿਤਨਾ ਵੱਡਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor es Profundo e Insondable; nadie Lo puede igualar."