[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਮਵੰਤ ਸੁਖੈਨ ਨੀਲ; ਹਣਵੰਤ ਅੰਗਦ ਕੇਸਰੀ ॥"
page = 237

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Jamvant, Sukhen, Neel, Hanuman, Angad etc. in their army."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਾਮਵੰਤ, ਸੁਖੈਨ, ਨੀਲ, ਹਨੂਮਾਨ, ਅੰਗਦ ਤੇ ਕੇਸਰੀ ਆਦਿ"