[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਗਟ ਭਇਆ; ਸਾਧੂ ਕੈ ਸੰਗਿ ॥"
page = 1144
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He (Lord) becomes manifest in the society of saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ (ਪ੍ਰਭੂ) ਸਤਿਸੰਗਤ ਅੰਦਰ ਜਾਹਰ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is manifest in the Saadh Sangat, the Company of the Holy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪਰਮੇਸ੍ਵਰ ਸੰਤੋਂ ਕੇ ਸੰਗ ਕਰ ਪ੍ਰਗਟ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ-ਪਾਤਿਸ਼ਾਹ ਗੁਰੂ ਦੀ ਸੰਗਤ ਵਿਚ ਰਿਹਾਂ (ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ) ਪਰਗਟ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧੂ ਕੈ ਸੰਗਿ = ਗੁਰੂ ਦੀ ਸੰਗਤ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "se vuelve Manifiesto a través de los Santos."