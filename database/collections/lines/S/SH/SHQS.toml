data = "ਰੰਗ ਤਮਾਸੇ; ਬਹੁਤੁ ਬਿਸਥਾਰ ॥"
page = 373
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "very extensive merrymaking and entertainments,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵੱਡੇ ਖਿਲਾਰ ਵਾਲੇ ਰਾਗ ਰੰਗ ਅਤੇ ਦਿਲ ਬਹਿਲਾਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and such abundant pleasures and entertainments,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਬਿਸਥਾਰ ਕੇ ਰੰਗ ਔਰ ਤਮਾਸੇ ਦੇਖਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਬਹੁਤ ਤਰ੍ਹਾਂ ਦੇ ਰੰਗ ਤਮਾਸ਼ੇ (ਵੇਖਣ ਨੂੰ ਹੋਣ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਸਥਾਰ = ਖਿਲਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "juegos y vastos dominios e influencias,"