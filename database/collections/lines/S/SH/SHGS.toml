[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤ੍ਰਿਯ ਕੋ ਤਾਪ ਦੂਰਿ ਕਰਿ ਡਾਰਿਯੋ ॥੧੦੭॥"
page = 877

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then the Raja made love with her and eliminated all her anxiety,(107)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਇਸਤਰੀ (ਰਾਜ ਕੁਮਾਰੀ) ਦਾ (ਸਾਰਾ) ਦੁਖ ਦੂਰ ਕਰ ਦਿੱਤਾ ॥੧੦੭॥"