[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਰਿ ਮੁਲਾਨਾ ਕੋ ਦਯੋ; ਜਮ ਕੇ ਧਾਮ ਪਠਾਇ ॥੫॥"
page = 940

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And thus killed Maulana and despatched him to the domain of death.(5)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੁਲਾਣੇ ਨੂੰ ਮਾਰ ਕੇ ਜਮਲੋਕ ਭੇਜ ਦਿੱਤਾ ॥੫॥"