[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨਸੇ ਰੋਗ; ਭਏ ਕਲਿਆਨ ॥੧॥"
page = 200
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thine ailments shall go, and thou shalt be emancipated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀਆਂ ਜਹਿਮਤਾ ਟੁਰ ਜਾਣਗੀਆਂ ਅਤੇ ਤੂੰ ਮੁਕਤ ਹੋ ਜਾਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Disease shall depart, and you shall be saved. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਗੁਨ ਗਾਇਨ ਕਰਨੇ ਸੇ ਰੋਗ ਸੰਪੂਰਨ ਨਾਸ ਹੋ ਗਏ ਹੈਂ ਔਰ ਸੁਖ ਹੂਏ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਸਾਰੇ ਰੋਗ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ, ਉਸ ਦੇ ਅੰਦਰ ਆਨੰਦ ਹੀ ਆਨੰਦ ਬਣੇ ਰਹਿੰਦੇ ਹਨ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਲਿਆਨ = ਖ਼ੁਸ਼ੀਆਂ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre del Señor para que tus penas se vayan y vuelvas a la Paz y a la Alegría.(1)"