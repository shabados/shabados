data = "ਸਭ ਤੇ ਊਚ; ਪਾਏ ਅਸਥਾਨੁ ॥"
page = 295
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He obtains the highest place of all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰਿਆਂ ਤੋਂ ਉੱਚਾ ਟਿਕਾਣਾ ਪਾ ਲੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He obtains the highest place of all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਵਹੁ ਸਰਬ ਸੇ ਊਚਾ ਅਸਥਾਨ ਪਰਮ ਪਦ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਉੱਚੇ ਤੋਂ ਉੱਚਾ ਟਿਕਾਣਾ ਮਿਲ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "al obtener el Estatus más elevado."