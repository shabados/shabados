[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਰੰਗ ਜਿਉ. ਪਗੁ ਧਰੈ ਠਿਮਿ ਠਿਮਿ; ਆਪਿ ਆਪੁ ਸੰਧੂਰਏ ॥"
page = 567
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Like an elephant Thou conquettishly placeth Thy foot and art intoxicated within thyself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਾਥੀ ਦੀ ਮਾਨੰਦ ਤੂੰ ਨਾਜ਼-ਨਖਰੇ ਨਾਲ ਪੈਰ ਰਖਦਾ ਹੈਂ ਅਤੇ ਆਪਣੇ ਆਪ ਵਿੱਚ ਹੀ ਮਤਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Like an elephant, You step with Your Feet so carefully; You are satisfied with Yourself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ (ਸਾਰੰਗ) ਹਸਤੀ ਸੰਧੂਰੇ ਹੂਏ ਕੀ ਭਾਂਤ ਅਪਨੇ ਮੇਂ ਮਸਤ ਹੋ ਕਰ (ਠਿਮਿ ਠਿਮਿ) ਧੀਰੇ ਧੀਰੇ ਚਲਤੇ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਚਾਲ ਹੈ ਮਸਤ ਹਾਥੀ ਵਾਂਗ ਬੜੀ ਮਟਕ ਨਾਲ ਤੁਰਨ ਵਾਲੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਰੰਗ = ਹਾਥੀ। ਪਗੁ = ਪੈਰ। ਠਿਮਿ ਠਿਮਿ = ਮਟਕ ਨਾਲ। ਆਪੁ = ਆਪਣੇ ਆਪ ਨੂੰ। ਸੰਧੂਰਏ = ਮਸਤ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "estás absorto en Tu Propia Majestuosidad."