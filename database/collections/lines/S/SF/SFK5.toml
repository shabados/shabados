data = "ਪਸੰਦਸ਼ ਨਿਯਾਮਦ ਕਸੇ ਕਾਰ ਬਾਰ ॥੧੨॥"
page = 1400

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "But, on account of their feats, she did not like any.(12)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਰ ਕਿਸੇ ਦਾ ਵੀ ਕਾਰ-ਵਿਹਾਰ (ਲੜਕੀ ਨੂੰ) ਪਸੰਦ ਨਾ ਆਇਆ ॥੧੨॥"