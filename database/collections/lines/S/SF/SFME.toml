[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਣਿ ਸੁਣਿ ਅੰਮ੍ਰਿਤ ਨਾਮੁ; ਧਿਆਵਾ ॥"
page = 740
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hearing and hearing Thy Nectar-Name, I meditate on it."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਸੁਧਾ-ਸਰੂਪ ਨਾਮ ਨੂੰ ਸੁਣ ਸੁਣ ਕੇ, ਮੈਂ ਇਸ ਦਾ ਆਰਾਧਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Hearing, hearing Your Ambrosial Naam, I meditate on it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਣ ਸੁਣ ਕੇ ਤੇਰਾ ਨਾਮ ਅੰਮ੍ਰਿਤ ਧਿਆਵਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੁੜ ਮੁੜ (ਇਹ) ਸੁਣ ਕੇ (ਕਿ ਤੇਰਾ) ਨਾਮ ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲਾ (ਹੈ,) ਮੈਂ (ਤੇਰਾ ਨਾਮ) ਸਿਮਰਦਾ ਰਹਿੰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਣਿ = ਸੁਣ ਕੇ। ਧਿਆਵਾ = ਧਿਆਵਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, escuchando Tu Nombre de Néctar,"