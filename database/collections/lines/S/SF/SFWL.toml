[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦੁਤੀਆ ਚੰਦੁ ਅਗਾਸ ਜਿਉ; ਆਦਿ ਪੁਰਖ ਆਦੇਸੁ ਕਰਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "That primal Lord, like the second day's moon in the sky, gets himself worshipped iby one and all."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਅਕਾਸ਼ ਵਿਖੇ ਦੂਜ ਦੇ ਚੰਦ ਵਾਂਙੂੰ 'ਆਦਿ ਪੁਰਖ' (ਸਭਨਾਂ ਥੋਂ) ਨਮਸਕਾਰਾਂ ਕਰਾਉਂਦਾ ਹੈ।"