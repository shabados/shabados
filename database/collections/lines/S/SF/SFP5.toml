[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਉਖਧੁ ਖਾਇਓ; ਹਰਿ ਕੋ ਨਾਉ ॥"
page = 378
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have taken the medicine of God's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦੀ ਦਵਾਈ ਖਾਧੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have taken the medicine of the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਨੇ ਹਰਿ ਕਾ ਨਾਮ ਔਖਿਧਿ ਖਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਜਿਸ ਮਨੁੱਖ ਨੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਦਵਾਈ ਖਾਧੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਉਖਧੁ = ਦਵਾਈ। ਕੋ = ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando el bálsamo del Naam, el Nombre del Señor,"