[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਧਨੁ ਸੰਚਹੁ ਦੇਖਿ ਕੈ; ਬੂਝਹੁ ਬੀਚਾਰੇ ॥੬॥"
page = 418
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then thou too amass wealth. See understand and realise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਦ ਤੂੰ ਭੀ ਦੌਲਤ ਜਮ੍ਹਾ ਕਰ ਵੇਖ, ਸੋਚ ਸਮਝ ਅਤੇ ਅਨੁਭਵ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "then go ahead and gather wealth yourself. See this, reflect upon it, and understand. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਦੇਖ ਕੇ ਸਮਝ ਬੀਚਾਰ ਕਰ ਤੁਮ ਭੀ ਧਨ ਸੰਚਨ ਕਰੋ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੁਸੀ ਭੀ ਧਨ ਬੇਸ਼ੱਕ ਜੋੜੀ ਚੱਲੋ। ਵੇਖ ਵਿਚਾਰ ਕੇ ਸਮਝੋ! ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਚਹੁ = ਇਕੱਠਾ ਕਰੋ। ਬੀਚਾਰੇ = ਵਿਚਾਰ ਕੇ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entonces sigue su buen ejemplo; pero si ves que no, toma conciencia de esto y conoce. (6)"