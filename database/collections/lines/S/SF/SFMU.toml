[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਡੁਲਤ ਮਹੇਾਂਦ੍ਰ ਮਹਿ ਧਰ ਮਹਾਣੰ ॥੫੧੭॥"
page = 603

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sound is spreading in all the directions and the Sheshnaga is wavering on felling the loss of Dharma.517."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਵੱਡੇ ਵੱਡੇ ਰਾਜੇ ਅਤੇ ਭੂਮੀਏ ਡੋਲਦੇ ਫਿਰ ਰਹੇ ਹਨ ॥੫੧੭॥"