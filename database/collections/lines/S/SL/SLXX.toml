[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜ਼ਿਮੀ ਗਸ਼ਤ ਸ਼ੁਦ ਹਮ ਚੁ ਪੁਸ਼ਤੇ ਪਿਲੰਗ ॥੯੯॥"
page = 1404

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And with the hoofs of the horses, the soil looked like the back of leopard.(99)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ ਸੁਮਾਂ ਨਾਲ ਧਰਤੀ ਚਿਤਰੇ ਦੀ ਪਿਠ ਵਾਂਗ ਡਬਖੜਬੀ ਹੋ ਗਈ ॥੯੯॥"