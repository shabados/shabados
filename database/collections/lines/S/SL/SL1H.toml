[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸੁ ਮਾਰੀ ਬਿਨੁ; ਜਮ ਤੇ. ਨਹੀ ਛੁਟੈ ॥੬॥"
page = 238
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without killing it. man escapes not from death."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਸ ਨੂੰ ਨਾਸ ਕਰਨ ਦੇ ਬਗੈਰ, ਆਦਮੀ ਮੌਤ ਤੋਂ ਨਹੀਂ ਬਚ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without killing this, one does not escape death. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਇਸ ਦ੍ਵੈਤ ਮਾਰੀ ਬਿਨ ਜਮੋਂ ਕੇ ਦੰਡ ਸੇ ਨਹੀਂ ਛੂਟੀਤਾ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਤੇਰ ਨੂੰ ਮਿਟਾਣ ਤੋਂ ਬਿਨਾ ਜਮਾਂ ਤੋਂ ਖ਼ਲਾਸੀ ਨਹੀਂ ਹੁੰਦੀ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਮ ਤੇ = ਜਮ ਤੋਂ, ਮੌਤ ਦੇ ਡਰ ਤੋਂ, ਆਤਮਕ ਮੌਤ ਤੋਂ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y uno no es liberado del agarre de la muerte.(6)"