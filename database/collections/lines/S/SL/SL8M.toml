[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਿਹ ਨਮਿਤ ਕਵਿ ਨੇ ਕਹਿਓ; ਸੁ ਦੇਹ ਚੰਡਿਕਾ, ਸੋਇ ॥੨੩੩॥"
page = 100

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The purpose for which the poet hath comosed it, Chandi may grant him the same.233."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਚੰਡਿਕਾ! ਜਿਸ ਮਨੋਰਥ ਲਈ ਕਵੀ ਨੇ (ਇਹ ਕਥਾ) ਕਹੀ ਹੈ, ਉਸ ਦਾ ਉਹੀ (ਮਨੋਰਥ) ਪੂਰਾ ਕਰੋ ॥੨੩੩॥"