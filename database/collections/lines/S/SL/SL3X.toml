type = "primary"
data = "ਸੰਕਿ ਰਹੈ ਨਹਿ ਭੋਗ ਕਮਾਵੈ ॥"
page = 879

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "As this now pestered his mind, he would not think of having sex with her."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ (ਮਨ ਵਿਚ) ਸ਼ੰਕਾ ਹੋਣ ਕਾਰਨ ਭੋਗ ਨਾ ਕਰਦਾ।"