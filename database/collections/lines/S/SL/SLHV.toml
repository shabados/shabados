type = "primary"
data = "ਤਾਹਿ ਬਿਸਾਰਿ ਚਿਤ ਤੇ ਦੀਯੋ ॥"
page = 959

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "People pleaded but the Raja did accept her and counted her out of his mind."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਨੂੰ ਚਿਤ ਤੋਂ ਭੁਲਾ ਦਿੱਤਾ।"