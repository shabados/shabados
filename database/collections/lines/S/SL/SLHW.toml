[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਗੁਰ ਕਉ; ਸਦ ਕਰੀ ਨਮਸਕਾਰ ॥"
page = 1152
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto that Guru, I ever make obeisance."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਗੁਰਦੇਵ ਨੂੰ ਮੈਂ ਸਦੀਵ ਹੀ ਬਦਨਾਂ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I humbly bow to that Guru forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਐਸੇ ਗੁਰੋਂ ਕੋ ਸਦੀਵ ਨਿਮਸਕਾਰ ਕਰਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਆਖ-ਹੇ ਭਾਈ!) ਉਸ ਗੁਰੂ ਨੂੰ ਮੈਂ ਸਦਾ ਸਿਰ ਨਿਵਾਂਦਾ ਰਹਿੰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਦ = ਸਦਾ। ਕਰੀ = ਕਰੀਂ, ਮੈਂ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Saludo a mi Dios por siempre y para siempre"