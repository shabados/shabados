[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਚਿੰਦਿਅੜੇ; ਫਲ ਪਾਵੈ ॥"
page = 623
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "obtains his heart desired boons."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੀਆਂ ਚਿੱਤ-ਚਾਹੁੰਦੀਆਂ ਮੁਰਾਦਾਂ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and the fruits of his mind's desires are obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਜਗਤ ਮਨ ਬਾਂਛਤ ਫਲੋਂ ਕੋ ਪਾਵੈਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਮਨ-ਚਿਤਵੇ ਫਲ ਹਾਸਲ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਿ = ਮਨ ਵਿਚ। ਚਿੰਦਿਅੜੇ = ਚਿਤਵੇ ਹੋਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "los deseos de su mente son cumplidos."