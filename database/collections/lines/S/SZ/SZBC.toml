[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨੑ ਕੇ ਬੰਕੇ. ਘਰੀ ਨ ਆਇਆ; ਤਿਨੑ ਕਿਉ ਰੈਣਿ ਵਿਹਾਣੀ ॥੬॥"
page = 418
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "How did they, whose majestic husbands came not home pass their night?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਦੇ ਸੁਹਣੇ ਖਸਮ ਘਰਾਂ ਵਿੱਚ ਨਹੀਂ ਆਏ, ਉਨ੍ਹਾਂ ਦੀ ਰਾਤ ਕਿਸ ਤਰ੍ਹਾਂ ਬੀਤੀ ਹੋਵੇਗੀ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Their husbands did not return home - how did they pass their night? ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੇ ਪਤੀ (ਬੰਕੇ) ਸੁੰਦਰ ਰਾਤ੍ਰਿ ਕੋ ਘਰ ਨਹੀਂ ਆਏ, ਭਾਵ ਰਣ ਭੂਮ ਮਹਿ ਮਾਰੇ ਗਏ। ਤਿਨ ਕੋ ਦੁਖ ਕੀ ਰਾਤਿ ਕੈਸੇ ਬੀਤਤੀ ਭਈ ਹੈ, ਭਾਵ ਅਤੀ ਦੁਖੀ ਹੋਤੀਆਂ ਭਈਆਂ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੇਹੜੀਆਂ ਬਚ ਰਹੀਆਂ, ਉਹ ਭੀ ਵਿਚਾਰੀਆਂ ਕੀਹ ਬਚੀਆਂ?) ਜਿਨ੍ਹਾਂ ਦੇ ਸੋਹਣੇ ਖਸਮ ਘਰਾਂ ਵਿਚ ਨਾਹ ਆਏ, ਉਹਨਾਂ (ਉਹ ਬਿਪਤਾ ਦੀ) ਰਾਤ ਕਿਵੇਂ ਕੱਟੀ ਹੋਵੇਗੀ? ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੰਕੇ = ਬਾਂਕੇ (ਖਸਮ)। ਰੈਣਿ = ਰਾਤ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y aquéllos cuyos seres queridos no volvieron a casa, ¿de qué forma pasaron las noches? (6)"