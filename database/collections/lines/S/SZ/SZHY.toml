[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੇਸਟ ਭ੍ਰਾਤ ਕੋ ਦੀਜਿਯਤ; ਲਹੁਰੇ ਲਈ ਨ ਜਾਇ ॥੩॥"
page = 982

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They are always endowed to the older brothers, not the younger ones.(3)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਵੱਡੇ ਭਰਾ ਨੂੰ ਦਿੱਤੀ ਜਾਂਦੀ ਹੈ, ਛੋਟੇ ਭਰਾ ਨਹੀਂ ਲੈਂਦੇ ॥੩॥"