[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਵਿਸਾਰਿ; ਕਹਾ ਸੁਖੁ ਪਾਵਹਿ ॥"
page = 1029
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Forgetting the Name, how can they obtain peace?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਨੂੰ ਭੁਲਾ ਕੇ ਉਹ ਆਰਾਮ ਕਿਸ ਤਰ੍ਹਾਂ ਪਾ ਸਕਦੇ ਹਨ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Forgetting the Naam, how can they find peace?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਨਾਮ ਕੋ ਬਿਸਾਰ ਕੈ ਸੁਖ ਕਹਾਂ ਸੇ ਪਾਵੇਂਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ ਉਹ ਇਸੇ ਵਿਚ ਸੁਖ ਲੱਭਣ ਦੀ ਆਸ ਰੱਖਦੇ ਹਨ) ਪਰ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਭੁਲਾ ਕੇ ਆਤਮਕ ਆਨੰਦ ਕਿੱਥੋਂ ਲੈ ਸਕਦੇ ਹਨ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਿਸਾਰਿ = ਵਿਸਾਰ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero ¿cómo puede encontrar la Paz, olvidándose del Nombre del Señor? (14)"