[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰੈ ਭਾਗਿ; ਗੁਰੁ ਪੂਰਾ ਪਾਇਆ ॥"
page = 798
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By perfect good fortune, I have obtained the Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਚੰਗੇ ਨਸੀਬਾਂ ਦੁਆਰਾ ਮੈਨੂੰ ਪੂਰਨ ਗੁਰਦੇਵ ਜੀ ਪਰਾਪਤ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By perfect destiny, I have found the Perfect Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਭਾਗੋਂ ਕਰ ਪੂਰੇ ਸਤਿਗੁਰੋਂ ਕੋ ਹਮ ਨੇ ਪਾਇ ਲੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਮਨੁੱਖ ਨੇ ਪੂਰੀ ਕਿਸਮਤ ਨਾਲ ਪੂਰਾ ਗੁਰੂ ਲੱਭ ਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਗਿ = ਕਿਸਮਤ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por una gran fortuna uno obtiene al Guru Perfecto"