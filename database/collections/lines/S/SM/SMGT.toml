data = "ਸਸਿਯਹਿ ਹੇਰਿ ਸਭੈ ਬਲਿ ਜਾਵਹਿ ॥੮॥"
page = 951

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In unison, they were singing and appreciating Sassi Kala.(8)"

[[content]]
