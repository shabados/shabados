[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਸਤ ਪੁਨੀਤ ਹੋਹਿ; ਤਤਕਾਲ ॥"
page = 185
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The hands are rendered pure forthwith,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੱਥ ਝਟ ਪਟ ਹੀ ਪਵਿੱਤ੍ਰ ਹੋ ਜਾਂਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The hands are sanctified instantly,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਤਕਾਲ ਹੀ ਹਾਥ ਪਵਿਤ੍ਰ ਹੋਵੇਂਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ ਲਿਖ ਕੇ) ਉਸੇ ਵੇਲੇ ਤੇਰੇ ਹੱਥ ਪਵਿਤ੍ਰ ਹੋ ਜਾਣਗੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਸਤ = {हस्त} ਹੱਥ। ਪੁਨੀਤ = ਪਵਿਤ੍ਰ। ਹੋਹਿ = ਹੋ ਜਾਂਦੇ ਹਨ। {ਹੋਇ = ਹੋ ਜਾਂਦਾ ਹੈ}। ਤਤਕਾਲ = ਤੁਰਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las manos son santificadas al instante,"