[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰਭ, ਤਿਹ ਤੇ ਮੈ ਅਤਿ ਦੁਖੁ ਪਾਯੋ ॥੨੧੧੭॥"
page = 509

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He told about the agony caused by Bhumasura and said, “O Lord! I have been greatly distressed by him.2117."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਉਸ ਤੋਂ ਬਹੁਤ ਦੁੱਖ ਪਾਂਪਤ ਕੀਤਾ ਹੈ ॥੨੧੧੭॥"