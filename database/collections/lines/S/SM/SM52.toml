data = "ਜੋਊ ਮਾਨਿ ਕਹਿਯੋ ਸੋਈ ਲੇਤ ਭਏ ॥"
page = 153

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Those who accepted it, they became without the thread."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੇ (ਉਦੋਂ) ਕਹੀ ਗਈ ਗੱਲ ਨੂੰ ਮੰਨ ਲਿਆ ਅਤੇ ਜੰਜੂ ਤੋੜ ਦਿੱਤੇ,"