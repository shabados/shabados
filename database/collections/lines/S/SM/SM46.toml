[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗ੍ਰੀਵਾ ਨੀਚ ਨੀਚ ਹੀ ਰਹੀ ॥"
page = 650

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“This man has not seen all the army passing in front of him and his neck remained bowed"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕੰਮ ਵਿਚ ਲਗੇ ਦੀ) ਗਰਦਨ ਨੀਵੀਂ ਦੀ ਨੀਵੀਂ ਹੀ ਰਹੀ।"