[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ ਕਾ; ਬਡ ਪਰਤਾਪ ॥"
page = 273
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Great is the glory of the man who knows God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੜਾ ਹੈ ਤੇਜ ਉਸ ਬੰਦੇ ਦਾ ਜੋ ਵਾਹਿਗੁਰੂ ਨੂੰ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The God-conscious being is gloriously great."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮ ਗਿਆਨੀ ਕਾ ਬਡਾ ਪ੍ਰਤਾਪ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮਗਿਆਨੀ ਦਾ ਬੜਾ ਨਾਮਣਾ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਡ = ਵੱਡਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Gloriosa es la Grandeza del ser conciente de Dios."