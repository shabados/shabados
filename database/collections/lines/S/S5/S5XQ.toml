[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਤੁ ਨਾਹੀ ਕਿਛੁ. ਪਾਰਾਵਾਰੁ ॥"
page = 178
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou hast no end, this and that limit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰਾ ਕੋਈ ਓੜਕ ਇਹ ਜਾ ਉਹ ਹੱਦਬੰਨਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You have no end or limitation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਪਾਰ ਉਰਾਰ ਕਾ ਕੁਛ ਅੰਤ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਗੁਣਾਂ ਦਾ ਅੰਤ ਨਹੀਂ ਪੈ ਸਕਦਾ, ਤੇਰੇ ਸਰੂਪ ਦਾ ਉਰਲਾ ਪਾਰਲਾ ਬੰਨ੍ਹਾ ਨਹੀਂ ਲੱਭ ਸਕਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਰਾਵਾਰੁ = ਪਾਰਲਾ ਤੇ ਉਰਲਾ ਬੰਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y no hay ni límite ni fin para Tu Poder;"