[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਮ ਮੂੜ ਮੁਗਧ ਕਿਛੁ ਬੂਝਹਿ ਨਾਹੀ; ਤੂ ਆਪੇ ਦੇਹਿ ਬੁਝਾਈ ॥"
page = 1155
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am foolish and ignorant and understand not anything. thou Thyself bless me with wisdom."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਮੂਰਖ ਤੇ ਬੇਸਮਝ ਹਾਂ ਅਤੇ ਕੁਝ ਭੀ ਨਹੀਂ ਸਮਝਦਾ। ਤੂੰ ਖੁਦ ਹੀ ਮੈਨੂੰ ਸਿਆਣਪ ਪਰਦਾਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am foolish and ignorant, and understand nothing. You Yourself bless me with understanding."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ ਮਹਾਂ ਮੂਰਖ ਹਾਂ ਕੁਛ ਸਮਝਤੇ ਨਹੀਂ, ਤੂੰ ਕ੍ਰਿਪਾ ਦ੍ਰਿਸਟੀ ਕਰ ਕੇ ਆਪ ਹੀ ਬੁਝਾਇ ਦੇਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਸੀਂ (ਜੀਵ) ਮੂਰਖ ਹਾਂ ਅੰਞਾਣ ਹਾਂ, ਅਸੀਂ (ਆਤਮਕ ਜੀਵਨ ਦਾ ਸਹੀ ਰਸਤਾ) (ਰਤਾ ਭੀ) ਨਹੀਂ ਸਮਝਦੇ, ਤੂੰ ਆਪ ਹੀ (ਸਾਨੂੰ ਇਹ) ਸਮਝ ਦੇਂਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਮ = ਅਸੀਂ ਜੀਵ। ਮੁਗਧ = ਮੂਰਖ। ਬੂਝਹਿ = (ਅਸੀ) ਸਮਝਦੇ। ਦੇਹਿ = ਤੂੰ ਦੇਂਦਾ ਹੈਂ। ਬੁਝਾਈ = ਆਤਮਕ ਜੀਵਨ ਦੀ) ਸਮਝ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Somos ignorantes y salvajes, oh Dios, haznos sabios en Tu Ser,"