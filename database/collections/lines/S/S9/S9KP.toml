data = "ਪਾਗ ਉਤਰਿ ਮਿਰਜਾ ਕੀ ਪਰੀ ॥੩੧॥"
page = 995

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Some shot arrows and Mirza’s turban was toppled over.(31)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਤਰ੍ਹਾਂ) ਮਿਰਜ਼ੇ ਦੀ ਪਗ ਉਤਰ ਕੇ ਡਿਗ ਪਈ ॥੩੧॥"