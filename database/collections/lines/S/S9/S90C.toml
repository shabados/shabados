[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਗਰੁ ਕੀਨਾ ਅਤਿ ਤੁਮ ਭਾਰਾ ॥"
page = 1081
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Exceedingly great, Thou has made the ocean."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਮੁੰਦਰ ਨੂੰ ਤੂੰ ਨਿਹਾਇਤ ਹੀ ਵੱਡਾ ਬਣਾਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You made the ocean vast and huge."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੰਸਾਰ ਸਾਗਰ ਤੈਨੇ ਬਡਾ ਭਾਰਾ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਇਹ ਬੇਅੰਤ ਵੱਡਾ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੂੰ ਆਪ ਹੀ ਬਣਾਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਗਰੁ = ਸਮੁੰਦਰ। ਅਤਿ ਭਾਰਾ = ਬਹੁਤ ਵੱਡਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres Tú Quien ha creado los vastos e inmensos mares."