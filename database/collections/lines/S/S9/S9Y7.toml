[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰੂਪ ਪ੍ਰਭਾ ਬਿਰਾਜਤੀ; ਤਹ ਸੁੰਦਰੀ ਲੈ ਬਾਲ ॥"
page = 924

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Raja was in the Palace, Roop Prabha used to come there with her companions."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਉਸ ਵੇਲੇ ਰੂਪ ਪ੍ਰਭਾ ਸੁੰਦਰੀਆਂ ਨੂੰ ਨਾਲ ਨੈ ਕੇ ਉਥੇ ਬਿਰਾਜਦੀ।"