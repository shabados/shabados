[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਤੁ ਸੇਵਿਐ; ਸਦਾ ਸੁਖੁ ਹੋਈ ॥"
page = 120
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By serving whom eternal peace is obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਟਹਿਲ ਕਮਾਉਣ ਦੁਆਰਾ ਦਾਇਮੀ ਆਰਾਮ ਪਰਾਪਤ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serving Him, eternal peace is obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਕੈਸਾ ਹੈ ਜਿਸ ਕੇ ਸੇਵਨੇ ਸੇ ਸਦਾ ਸੁਖ ਹੋਤਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦਾ ਸਿਮਰਨ ਕੀਤਿਆਂ ਸਦਾ ਆਤਮਕ ਆਨੰਦ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਤੁ ਸੇਵਿਐ = ਜਿਸ ਦਾ ਸਿਮਰਨ ਕੀਤਿਆਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues Sirviéndola, obtienes la Paz Eterna."