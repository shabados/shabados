[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਤ੍ਰਿਯ ਕੋ ਪਾਇਨ ਉਠਿ ਪਰਿਯੋ ॥"
page = 996

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Learning this, the foolish Raja dreaded and fell upon the feet of the woman."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਠ ਕੇ ਉਸ ਇਸਤਰੀ ਦੇ ਪੈਰੀਂ ਪੈ ਗਿਆ।"