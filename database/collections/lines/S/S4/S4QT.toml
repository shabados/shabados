[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਲਖ ਲਖ ਬ੍ਰਹਮੇ ਵੇਦ ਪੜ੍ਹਿ; ਇਕਸ ਅਖਰ ਭੇਦੁ ਨ ਜਾਤਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Even after reading lakhs of Vedas, Brahma did not understand syllable (paramatama)"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਲੱਖਾਂ ਬ੍ਰਹਮੇ ਲੱਖਾਂ ਵਾਰ ਵੇਦ ਪੜ੍ਹਦੇ ਹਨ ਪਰੰਤੂ ਇਕ 'ਅੱਖਰ' (ਅਕਾਲ ਪੁਰਖ) ਦਾ ਭੇਦ ਨਹੀਂ ਜਾਣਿਆਂ।"