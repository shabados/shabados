[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਲਉਡੇ ਕਉ; ਕਿਸ ਕੀ ਤਾਤਿ ॥੩॥"
page = 376
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "under whose obligation should that slave run?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਗੁਲਾਮ ਕੀਹਦਾ ਅਹਿਸਾਨ ਝੱਲੇ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- who can now hold him in bondage? ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਦਾਸ ਕੋ ਕਿਸ ਕੀ (ਤਾਤਿ) ਇਛਾ ਹੈ ਅਰਥਾਤ ਤੇਰੇ ਸੇ ਬਿਨਾਂ ਕਿਸੀ ਕੀ ਚਾਹ ਨਹੀਂ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਦੇ) ਉਸ ਸੇਵਕ ਨੂੰ ਕਿਸੇ ਦੀ ਈਰਖਾ ਦਾ ਡਰ ਨਹੀਂ ਰਹਿੰਦਾ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾਤਿ = ਈਰਖਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿quién podría humillarlo? (3)"