[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਧਨੁ ਤੁਲਹਾ, ਹਰਿ ਧਨੁ ਬੇੜੀ; ਹਰਿ ਹਰਿ ਤਾਰਿ ਪਰਾਨਾ ॥੨॥"
page = 495
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The wealth of God's Name is my raft, the wealth of God's Name is my boat and the Lord Master is the ship to ferry me across."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦੇ ਨਾਮ ਦੀ ਦੌਲਤ ਮੇਰੀ ਨਉਕਾ ਅਤੇ ਸੁਆਮੀ ਮਾਲਕ ਹੀ ਮੈਨੂੰ ਪਾਰ ਕਰਨ ਲਈ ਇਕ ਜਹਾਜ਼ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The wealth of the Lord is my raft, the wealth of the Lord is my boat; the Lord, Har, Har, is the ship to carry me across. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਧਨ ਹੀ ਤੁਲਹਾ ਹੈ, ਹਰਿ ਧਨ ਹੀ ਬੇੜੀ ਹੈ, ਹਰਿ ਧਨ ਹੀ ਸੰਸਾਰ ਸਮੁੰਦਰ ਸੇ ਤਾਰਨੇ ਕੋ (ਪਰਾਨਾ) ਜਹਾਜ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਸੰਸਾਰ-ਨਦੀ ਤੋਂ ਪਾਰ ਲੰਘਣ ਲਈ ਹਰਿ-ਨਾਮ-ਧਨ ਨੂੰ ਤੁਲਹਾ ਬਣਾ ਲਿਆ ਹੈ, ਬੇੜੀ ਬਣਾ ਲਿਆ ਹੈ, ਪਰਮਾਤਮਾ ਉਸ ਨੂੰ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ ਤਾਰ ਕੇ ਪਾਰਲੇ ਪਾਸੇ ਅਪੜਾ ਦੇਂਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੁਲਹਾ = ਲੱਕੜਾਂ ਬੰਨ੍ਹ ਕੇ ਨਦੀ ਪਾਰ ਕਰਨ ਲਈ ਬਣਾਇਆ ਹੋਇਆ ਗੱਠਾ। ਤਾਰਿ = ਤਾਰੇ, ਪਾਰ ਲੰਘਾ ਦੇਂਦਾ ਹੈ। ਪਰਾਨਾ = ਪਾਰਲੇ ਪਾਸੇ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Riqueza del Señor es mi barca y La Riqueza del Señor es mi lancha y El Señor, Jar, Jar, es el Barco para llevarme a través. (2)"