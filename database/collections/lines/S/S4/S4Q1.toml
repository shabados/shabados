[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਜੀ; ਤੇਰੀ ਓਟ ਗੁਸਾਈ ॥"
page = 630
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O reverend Master, the Lord of the world, thou art my only support."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਸੁਆਮੀ! ਮਾਣਨੀਯ ਮਾਲਕ! ਕੇਵਲ ਤੂੰ ਹੀ ਮੇਰਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Dear God, Lord of the world, You are my only support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਜੀ ਗੁਸਾਈਂ! ਮੈਂ ਤੁਮਾਰੀ ਸਰਣ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ (ਮੇਰੇ) ਪ੍ਰਭੂ ਜੀ! ਹੇ ਧਰਤੀ ਦੇ ਖਸਮ! (ਮੈਨੂੰ) ਤੇਰਾ (ਹੀ) ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ! ਓਟ ਆਸਰਾ। ਗੁਸਾਈ = ਹੇ ਧਰਤੀ ਦੇ ਖਸਮ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Maestro, sólo busco Tu Refugio; eres el Señor Todopoderoso y nos bendices con Tu Protección,"