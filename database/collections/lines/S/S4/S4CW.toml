[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੇਬਿ ਕਾਲਿਕਾ ਮਾਤ ਹਮਾਰਾ ॥"
page = 73

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He, my Lord is Father and Destroyer of all, the goddess Kalika is my mother."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਉਸ ਦੀ ਸ਼ਕਤੀ) ਦੇਵੀ ਕਾਲਿਕਾ ਸਾਡੀ ਮਾਤਾ ਹੈ।"