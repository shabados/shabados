[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੈ ਕੈ ਪ੍ਰਨਾਮ ਚਲਿਯੋ ਤਬ ਹੀ; ਨ੍ਰਿਪੁ ਤ੍ਵੈ ਸੁਤ ਹੋ, ਇਹ ਭਾਤਿ ਉਚਾਰਿਯੋ ॥"
page = 398

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He bowed and left, in order to know the affection of people,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "'ਤੇਰਾ ਪੁੱਤਰ ਰਾਜਾ ਹੋਵੇਗਾ' ਇਸ ਤਰ੍ਹਾਂ ਕਹਿ ਕੇ ਤਦ ਉਸ ਨੂੰ ਪ੍ਰਨਾਮ ਕਰ ਕੇ ਚਲ ਪਿਆ।"