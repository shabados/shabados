data = "ਪ੍ਰਗਟੁ ਭਈ ਹੈ ਸਭਨੀ ਥਾਈ ॥੨॥"
page = 1142
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "has become manifest in all the places."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਥਾਵਾਂ ਵਿੱਚ ਉਜਾਗਰ ਹੋ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Has become manifest everywhere. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਅਸਥਾਨੋਂ ਵਿਖੇ ਪ੍ਰਗਟ ਹੋ ਗਈ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਭਨੀਂ ਥਾਈਂ ਰੌਸ਼ਨ ਹੋ ਗਈ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su Reputación se ha vuelto manifiesta por todas partes. (2)"