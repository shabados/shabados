[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕੇ ਦੋਖੀ ਕਉ; ਨਾਹੀ ਠਾਉ ॥"
page = 280
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints' slanderer, has no abiding place."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਦੇ ਨਿੰਦਕ ਨੂੰ ਕੋਈ ਰਹਿਣ ਦੀ ਥਾਂ ਨਹੀਂ ਮਿਲਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slanderer of the Saint has no place of rest."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੇ ਦੋਖੀ ਕਉ ਥਾਉਂ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਦੇ ਨਿੰਦਕ ਨੂੰ ਕੋਈ ਸਹਾਰਾ ਨਹੀਂ ਮਿਲਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਉ = ਥਾਂ, ਸਹਾਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El calumniador del Santo no encuentra lugar de descanso,"