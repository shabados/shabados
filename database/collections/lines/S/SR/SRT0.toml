[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬੰਦੇ. ਚਸਮ ਦੀਦੰ; ਫਨਾਇ ॥"
page = 723
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man, whatever the eye sees, is perishable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਇਨਸਾਨ! ਜੋ ਕੁਛ ਅੱਖ ਦੇਖਦੀ ਹੈ, ਉਹ ਨਾਸਵੰਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O human being, whatever you can see with your eyes, shall perish."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੰਦੇ! ਖੁਦਾਇ ਕੇ (ਚਸਮ) ਨੇਤ੍ਰੋਂ ਕਰ ਜੋ (ਦੀਦੰ) ਦੇਖੀਦਾ ਹੈ, ਨਾਮ ਰੂਪ ਜਗਤ ਸੋ (ਫਨਾਇ) ਨਾਸ ਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨੁੱਖ! ਜੋ ਕੁਝ ਤੂੰ ਅੱਖੀਂ ਵੇਖਦਾ ਹੈਂ ਨਾਸਵੰਤ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੰਦੇ = ਹੇ ਮਨੁੱਖ! ਚਸਮ = ਚਸ਼ਮ, ਅੱਖਾਂ। ਦੀਦੰ = ਦਿੱਸਦਾ। ਫਨਾਇ = ਫ਼ਨਾਇ, ਨਾਸਵੰਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh hombre, todo lo que uno ve, se va a desintegrar,"