[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਰਤ ਨੇਮ ਕਰੈ; ਬਹੁ ਭਾਤੀ ॥"
page = 265
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The performance of fastings and vows of many varieties."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਘਣੇਰੀਆਂ ਕਿਸਮਾਂ ਦੇ ਉਪਹਾਸ ਅਤੇ ਪਰਤੱਗਿਆ ਨਿਭਾਉਣੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "keeping fasts and making vows of all sorts"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਬ੍ਰਤ ਔ (ਨੇਮ) ਸੰਜਮ ਭੀ ਬਹੁਤ ਪ੍ਰਕਾਰ ਸੇ ਕਰੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਈ ਕਿਸਮਾਂ ਦੇ ਵਰਤਾਂ ਦੇ ਬੰਧੇਜ ਕਰੇ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨੇਮ = ਬੰਧੇਜ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ni aún el morirse de hambre en cumplimiento de votos y promesas."