[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਤ ਓਰ ਹਲਾਯੁਧ ਜੁਧੁ ਕਰੈ; ਉਤ ਸ੍ਰੀ ਗਰੜਧੁਜ ਕੋਪ ਭਰਿਓ ਹੈ ॥"
page = 474

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On this side Balram is engged in fighting and on that side Krishna is getting filled with rage"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਧਰੋਂ ਬਲਰਾਮ ਯੁੱਧ ਕਰਦਾ ਹੈ, ਉਧਰ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਕ੍ਰੋਧ ਨਾਲ ਭਰੇ ਹੋਏ ਹਨ।"