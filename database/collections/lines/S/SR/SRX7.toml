[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅੰਤਿ ਬਸੰਤ ਤਪ︀ਯੋ ਰਵਿ ਕਾਹੇ ਨ ਚੰਦ ਸਮਾਨ ਦਿਨੀਸ ਪ੍ਰਮਾਨੋ ॥"
page = 675

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The sun may heat in the spring season, the sun may become cold like the moon, the earth supported by the tortoise may shake,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਸੰਤ ਰੁਤ ਵਿਚ ਸੂਰਜ ਕਿਉਂ ਨਾ ਅਤਿਅੰਤ ਤਪ ਗਿਆ ਹੋਵੇ ਅਤੇ ਚੰਦ੍ਰਮਾ ਵਾਂਗ ਸੂਰਜ (ਸੀਤਲ) ਕਿਉਂ ਨਾ ਮੰਨ ਲਿਆ ਗਿਆ ਹੋਵੇ।"