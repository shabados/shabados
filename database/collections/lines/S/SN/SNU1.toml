[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਇਹ ਦੋਵੇਣ ਲੋਕ ਉਸ ਰੱਬ ਦੇ ਬੋਹਲ ਵਿੱਚੋਣ ੋਇੱਕ ਦਾਣਾ ਹਨ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਈਨੋ ਆਣ ਅਜ਼ ਖ਼ਿਰਮਨਸ਼ ਯੱਕ ਦਾਨਾ ਈਸਤ ॥੨੫॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Then, all aims and objectives of government administration would be fulfilled. (377)"