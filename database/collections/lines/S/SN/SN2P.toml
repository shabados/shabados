[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਾਹੁ ਵਾਹੁ ਕਰਤਿਆ; ਰੈਣਿ ਸੁਖਿ ਵਿਹਾਇ ॥"
page = 514
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By uttering Lord's praise, the life-night passes in peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੀ ਸਿਫ਼ਤ ਦਾ ਉਚਾਰਨ ਕਰਨ ਦੁਆਰਾ ਜੀਵਨ-ਰਾਤ੍ਰੀ ਸੁੱਖ ਆਰਾਮ ਅੰਦਰ ਬੀਤਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Chanting Waaho! Waaho! the night of one's life passes in peace."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਵਾਹੁ ਵਾਹੁ ਕਰਤੇ ਹੈਂ ਤਿਨ ਕੀ ਅਵਸਥਾ ਰਾਤ੍ਰੀ ਸੁਖ ਸੇ ਬੀਤਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦਿਆਂ (ਮਨੁੱਖਾ ਜਨਮ-ਰੂਪ) ਰਾਤ ਸੁਖੀ ਗੁਜ਼ਰਦੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Alabando al Señor, la noche de la vida pasa en Paz;"