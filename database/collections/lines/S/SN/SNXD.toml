[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੀਆ ਸਦਾ ਸਦਾ ਚੰਗਿਆਈਆ ॥"
page = 73
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thine excellences, I for ever,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਦੀਵ ਤੇ ਹਮੇਸ਼ਾਂ ਤੇਰੀਆਂ ਖੂਬੀਆਂ ਦੀ"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I praise the Greatness of Your Goodness,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸਦਾ ਸਦਾ) ਸਰਬਦਾ ਕਾਲ ਤੇਰੀਆਂ ਭਲਿਆਈਆਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰੇ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਗੁਣ-"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres el Señor de Bondad,"