data = "ਸਭ ਸ੍ਰੀ ਨਾਮ ਤੁਪਕ ਕੇ ਜਾਨਹੁ ॥੯੮੬॥"
page = 777

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying “Shrang-vahani-bhagga”, add the words “Jaachar-pati-shatru” and know all the names of Tupak.986."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝੋ ॥੯੮੬॥"