[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਾਟ ਵਟਾਊ ਲੂਣੁ ਖਾਇ; ਗੁਣੁ ਕੰਠਿ ਪਰੋਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The passerby eulogizes the person whose salt be has eaten."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਰਸਤੇ ਜਾਂਦਾ ਮੁਸਾਫਰ ਲੂਣ ਖਾਕੇ ਗੁਣਾ ਦਾ ਕੰਨ ਵਿਖੇ ਹਾਰ ਪਰੋਂਦਾ ਹੈ, (ਭਾਵ ਜਿੱਥੇ ਜਾਵੇ ਉਥੇ ਹੀ ਉਸਤਤਿ ਕਰਦਿਆਂ ਮੂੰਹ ਸੁੱਕਦਾ ਹੈ)।"