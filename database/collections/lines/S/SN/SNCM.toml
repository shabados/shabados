data = "ਸਾਧੂ ਕੀ; ਜਉ ਲੇਹਿ ਓਟ ॥"
page = 1196
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If thou seek the refuge of the saint,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਤੂੰ ਸੰਤ ਦੀ ਪਨਾਹ ਲੈ ਲਵੇ ਤਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If you seek the Support of the Holy,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੀਵ! ਜੇਕਰ ਸਾਧੂ ਕੀ (ਓਟ) ਸਰਣ ਲੇਵੇਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਕਾਇਆਂ!) ਜੇ ਤੂੰ ਗੁਰੂ ਦਾ ਆਸਰਾ ਲਏਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਧੂ = ਗੁਰੂ। ਓਟ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
