[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਉ ਨਿਧਿ; ਅੰਮ੍ਰਿਤੁ ਪ੍ਰਭ ਕਾ ਨਾਮੁ ॥"
page = 293
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The nine treasures and the Nectar are Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨੋ ਖ਼ਜ਼ਾਨੇ ਤੇ ਸੁਧਾਰਸ ਸਾਈਂ ਦੇ ਨਾਮ ਵਿੱਚ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The nine treasures are in the Ambrosial Name of God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵੈਰਾਟ ਰੂਪ ਸਰੀਰ ਹੈ ਨੌਂ ਨਿਧੀਆਂ ਕੇ ਦੇਨੇ ਹਾਰਾ ਅੰਮ੍ਰਿਤ ਰੂਪ ਜੋ ਹਰੀ ਕਾ ਨਾਮ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਜੋ (ਮਾਨੋ, ਜਗਤ ਦੇ) ਨੌ ਹੀ ਖ਼ਜ਼ਾਨਿਆਂ (ਦੇ ਤੁੱਲ) ਹੈ ਤੇ ਅੰਮ੍ਰਿਤ ਹੈ;"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En Tu cuerpo habita el Nombre de Néctar"