[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੀਤਾ ਹੋਵੈ ਕਰੇ ਕਰਾਇਆ; ਤਿਸੁ ਕਿਆ ਕਹੀਐ ਭਾਈ ॥"
page = 359
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The created one does, what he is caused to do. what can we say unto him, O brother?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿਰਜਿਆ ਹੋਇਆ ਉਹ ਕੁੱਝ ਕਰਦਾ ਹੈ, ਜੋ ਉਸ ਤੋਂ ਕਰਾਇਆ ਜਾਂਦਾ ਹੈ। ਆਪਾਂ ਉਸ ਨੂੰ ਕੀ ਆਖ ਸਕਦੇ ਹਾਂ, ਹੇ ਵੀਰ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The created being acts as he is made to act; what can be said to him, O Siblings of Destiny?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ (ਭਾਈ) ਸਭ ਕੇ ਭਾਉਨੇ ਵਾਲੇ ਪਰਮਾਤਮਾ! ਸਭ ਕੁਛ ਤੇਰਾ ਹੀ ਕੀਆ ਹੋਤਾ ਹੈ। ਜੋ ਕਰਮ ਤੂੰ  ਜੀਵੋਂ ਸੇ ਕਰਾਯਾ ਚਾਹੁਤਾ ਹੈਂ, ਸੋਈ ਜੀਵ ਕਰਤੇ ਹੈਂ। ਅਬ ਤਿਨ ਜੀਵੋਂ ਕੋ ਕਿਆ ਦੋਸ ਲਗਾਈਏ ਕਿ ਯਹਿ ਕਾਮ ਇਉਂ ਕਿਉਂ ਕੀਆ, ਇਉਂ ਕਿਉਂ ਨਾ ਕੀਆ। ਕਿਉਂਕਿ ਵਹੁ ਸੁਤੰਤ੍ਰ ਤੋ ਕਰ ਨਹੀਂ ਸਕਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਹੇ ਭਾਈ! ਜੀਵ ਦੇ ਕੀਹ ਵੱਸ? ਜੀਵ ਉਹੀ ਕੁਝ ਕਰਦਾ ਹੈ ਜੋ ਪਰਮਾਤਮਾ ਉਸ ਤੋਂ ਕਰਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੀਤਾ ਹੋਵੈ = ਜੋ ਪ੍ਰਭੂ ਦਾ ਪੈਦਾ ਕੀਤਾ ਹੋਇਆ ਹੈ, ਜੀਵ। ਕਿਆ ਕਹੀਐ = ਕੀਹ ਗਿਲਾ? ਭਾਈ = ਹੇ ਭਾਈ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que es creado y vive conforme a la Voluntad del Señor,"