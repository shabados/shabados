data = "ਅਤਿ ਕਾਮਾ ਲੋਟਤ ਧਰਨਿ; ਮਾਧਵਨਲ ਕੇ ਹੇਤ ॥"
page = 921

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The separation of Madhwan made her to roll over on the ground,"

