data = "ਮਾਧਵਾਨਲ ਦੇ ਹਿਤ ਲਈ ਕਾਮਕੰਦਲਾ ਧਰਤੀ ਉਤੇ ਲੋਟ ਪੋਟ ਹੋ ਰਹੀ ਹੈ,"