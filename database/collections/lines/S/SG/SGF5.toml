data = "ਸਭ ਸ੍ਰੀ ਨਾਮ ਤੁਪਕ ਕੇ ਧਰੀਐ ॥੮੫੧॥"
page = 764

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the words “Dvaarke-anini”, then utter the words “Jaachar-pati-shatru”, and know all the names of Tupak.851."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝੋ ॥੮੫੧॥"