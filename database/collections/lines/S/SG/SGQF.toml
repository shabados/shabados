[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਈ ਸੋੁਹਾਗਣਿ ਸਾਈ ਭਾਗਣਿ; ਜੈ ਪਿਰਿ ਕਿਰਪਾ ਧਾਰੀ ॥"
page = 959
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "She alone is the loved bride and she alone is fortunate, to whom her groom extends His grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹ ਹੀ ਪਿਆਰੀ ਪਤਨੀ ਹੈ, ਕੇਵਲ ਉਹ ਹੀ ਭਾਗਾਂ ਵਾਲੀ ਹੈ ਜਿਸ ਉਤੇ ਉਸਦਾ ਪਤੀ ਆਪਣੀ ਮਿਹਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "She alone is the blessed soul-bride, and she alone is fortunate, upon whom the Husband Lord has showered His Mercy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਸੁਹਾਗਣ ਹੈ ਔ ਸੋਈ ਭਾਗਾਂ ਵਾਲੀ ਹੈ ਜਿਸ ਪਰ ਪਤੀ ਨੇ ਕ੍ਰਿਪਾ ਧਾਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਜੀਵ-ਇਸਤ੍ਰੀ ਸੋਹਾਗ-ਭਾਗ ਵਾਲੀ ਹੋ ਸਕਦੀ ਹੈ ਜਿਸ ਉਤੇ ਪਤੀ ਨੇ ਆਪ ਮੇਹਰ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੈ = ਜਿਸ ਉਤੇ। ਪਿਰਿ = ਪਿਰ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo será la novia bienamada y de buena fortuna, quien obtenga la Gracia del Señor."