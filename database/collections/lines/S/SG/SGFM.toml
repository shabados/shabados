[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਉਠੇ ਗਦ ਸਦੰ ਚੜੇ ਚਉਪ ਚਾਯੰ ॥"
page = 242

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The wounded groups of warriors are swinging and being bewildered on falling on the earth and with double zeal they are getting up and striking with their maces."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਭਿਆਨਕ ਸ਼ਬਦ ਹੁੰਦਾ ਹੈ ਜਿਸ ਨਾਲ ਸੂਰਮਿਆਂ ਦੇ ਚਿੱਤ ਵਿੱਚ ਚਾਉ ਚੜ੍ਹਦਾ ਹੈ।"