[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉਮੈ ਮਮਤਾ; ਬਹੁ ਮੋਹੁ ਵਧਾਇਆ ॥"
page = 1261
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Their ego, mine-ness and worldly attachment have greatly increased."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਦੀ ਹੰਗਤਾ ਮੈ-ਮੇਰੀ ਅਤੇ ਸੰਸਾਰੀ ਲਗਨ ਖਰੀਆਂ ਵਧੇਰੀਆਂ ਹੋ ਗਈਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Egotism, possessiveness and attachment rise up and increase within them."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੰਕਾਰ ਅਰ ਮਮਤਾ ਕਰ ਬਹੁਤ ਮੋਹ ਵਧਾਯਾ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਆਪਣੇ ਅੰਦਰ ਹਉਮੈ ਮਮਤਾ ਅਤੇ ਮੋਹ ਨੂੰ ਵਧਾਈ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El egoísmo, la actitud posesiva y el apego se edifican e incrementan con es tipo de ritos."