type = "primary"
data = "ਸੋ ਲਰੋ ਆਨ ਮੋ ਸੋਂ ਪ੍ਰਚੰਡ ॥੫੧੮॥"
page = 254

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He who has killed my father, that mighty warriors should come forward and wage war with me.”518."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਮੇਰੇ ਨਾਲ ਆ ਕੇ ਪ੍ਰਚੰਡ ਯੁੱਧ ਕਰੇ ॥੫੧੮॥"