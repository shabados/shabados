[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਹੁਤ ਭਾਤਿ ਨਿਜ ਮਤਹਿ ਚਲਾਈ ॥"
page = 192

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When he became the preceptor of the demons, he started different kinds of sects."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ (ਉਸ ਨੇ) ਬਹੁਤ ਤਰ੍ਹਾਂ ਨਾਲ ਆਪਣੇ ਮੱਤ ਨੂੰ ਚਲਾਇਆ।"