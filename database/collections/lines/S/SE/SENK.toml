[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਭ੍ਰਮ ਭੈ ਮਿਟਿ ਗਏ; ਰਮਣ ਰਾਮ ਭਰਪੂਰਿ ॥੨॥"
page = 929
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, uttering the Name of the All-pervading Lord, my doubt and dread are dispelled."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਸਰਬ-ਵਿਆਪਦ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਨ ਦੁਆਰਾ ਮੇਰਾ ਵਹਿਮ ਤੇ ਡਰ ਨਾਸ ਹੋ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, doubt and fear are dispelled, chanting the Name of the all-pervading Lord. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਜਿਨ ਕੋ ਸੰਤ ਮਿਲੇ ਹੈਂ ਤਿਨ ਕੇ ਭਰਮ ਭੈ ਸਭ ਮਿਟ ਗਏ ਹੈਂ। ਰਾਮ ਜੋ ਸੰਸਾਰ ਮੇਂ ਪੂਰਨ ਹੈ ਤਿਸ ਮੇਂ ਤਿਨੋਂ ਨੇ ਰਮਣ ਕੀਆ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਗੁਰੂ ਨੇ ਦੱਸਿਆ ਕਿ) ਸਰਬ-ਵਿਆਪਕ ਪਰਮਾਤਮਾ ਦਾ ਸਿਮਰਨ ਕਰਨ ਨਾਲ ਮਨ ਦੀਆਂ ਭਟਕਣਾਂ ਅਤੇ ਸਾਰੇ ਡਰ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭ੍ਰਮ = ਭਰਮ, ਭਟਕਣ। ਭੈ = {ਲਫ਼ਜ਼ 'ਭਉ' ਤੋਂ ਬਹੁ-ਵਚਨ}। ਰਮਣ = ਸਿਮਰਨ। ਭਰਪੂਰਿ = ਸਰਬ-ਵਿਆਪਕ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, nuestros miedos y dudas son quitados pronunciando el Nombre de Dios, Quien colma a todos los seres.(2)"