[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਤ੍ਰਿ ਪਰਾਸਰ ਨਾਰਦ ਸਾਰਦ ਬ︀ਯਾਸ ਤੇ ਆਦਿ ਜਿਤੇ ਮੁਨ ਭਾਏ ॥"
page = 675

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There have been many sages like Atri, Parashar, Narada, Sharda, Vyas etc.,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤ੍ਰੀ ਰਿਸ਼ੀ, ਪਰਾਸ਼ਰ, ਨਾਰਦ, ਸ਼ਾਰਦਾ ਅਤੇ ਬਿਆਸ ਜਿਤਨੇ ਵੀ ਮੁਨੀ ਹੋਏ ਹਨ।"