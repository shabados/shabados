type = "primary"
data = "ਕਹੂੰ ਬੇਦ ਬਿਦਿਆ, ਕਹੂੰ ਕਾਬ ਰੂਪੰ ॥"
page = 29

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Somewhere Thou art the learning of the Vedas and somewhere Thou art literature!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ (ਤੁਸੀਂ) ਵੇਦ-ਵਿਦਿਆ ਹੋ, ਕਿਤੇ ਕਾਵਿ ਰੂਪ ਹੋ।"