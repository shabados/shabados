[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਖੁ ਫਰੀਦਾ. ਜੁ ਥੀਆ; ਦਾੜੀ ਹੋਈ ਭੂਰ ॥"
page = 1378
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "See O Farid! What has happened? Thy beard had grown grey."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵੇਖ, ਹੇ ਫਰੀਦ! ਕੀ ਹੋ ਗਿਆ ਹੈ। ਤੇਰੀ ਦਾੜੀ ਚਿੱਟੀ ਥੀ ਗਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "See, Fareed, what has happened: your beard has become grey."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਫਰੀਦ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਹੇ ਜੀਵ! ਦੇਖ ਜੋ ਕਿਆ ਹੂਆ ਕਿ ਦਾਹੜੀ ਭੀ ਭੂਰੀ ਹੋ ਗਈ ਹੈ, ਭਾਵ ਯੇਹ ਅਬ ਤੁਝ ਕੋ ਬ੍ਰਿਧ ਅਵਸਥਾ ਪ੍ਰਾਪਤਿ ਭਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਫਰੀਦ! ਵੇਖ ਜੋ ਕੁਝ (ਹੁਣ ਤਕ) ਹੋ ਚੁਕਿਆ ਹੈ (ਉਹ ਇਹ ਹੈ ਕਿ) ਦਾੜ੍ਹੀ ਚਿੱਟੀ ਹੋ ਗਈ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਥੀਆ = ਹੋ ਗਿਆ ਹੈ। ਜੁ = ਜੋ ਕੁਝ। ਭੂਰ = ਚਿੱਟੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mira, dice Farid, lo que ha pasado, tu barba se ha puesto gris,"