[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਹਿਖੁਆਸ ਚਾਰੀ ॥"
page = 108

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The wears of canopies are full of fury and from their bows shoot their arrows."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਧਨੁਸ਼ਾਂ ('ਮਹਿਖੁਆਸ') ਵਿਚੋਂ ਤੀਰ ਚਲਾਉਂਦੇ ਹਨ।"