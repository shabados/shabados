[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧ ਕੈ ਸੰਗਿ; ਮਨੋਹਰ ਬੈਨ ॥"
page = 271
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the society of saints the speech becomes fascinating."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਤਾਂ ਦੀ ਸੰਗਤ ਅੰਦਰ ਬਾਣੀ ਮਣਮੋਹਣੀ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Company of the Holy, one's speech is enticing."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੇ ਸੰਗ ਕਰ ਕੇ ਇਸ ਕੇ ਬਚਨ ਭੀ ਮਨ ਕੇ ਹਰਨੇ ਹਾਰੇ ਸੁੰਦ੍ਰ ਹੋ ਜਾਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ (ਸਭ ਨਾਲ) ਮਿੱਠੇ ਬਚਨ ਬੋਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨੋਹਰ = ਮਨ ਨੂੰ ਹਰਨ ਵਾਲੇ, ਮਨ ਨੂੰ ਖਿੱਚ ਪਾਉਣ ਵਾਲੇ। ਬੈਨ = ਬਚਨ, ਬੋਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y de sus labios brotan Palabras de Néctar."