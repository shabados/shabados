[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਸਭੁ ਕਿਛੁ; ਪ੍ਰਭ ਕੈ ਹਾਥੇ ॥੫॥"
page = 276
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak everything is in the Lord's hands."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਸਾਰਾ ਕੁਛ ਸਾਹਿਬ ਦੇ ਹੱਥਾਂ ਵਿੱਚ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, everything is in the Hands of God. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਭਾਈ! ਇਸ ਪ੍ਰਕਾਰ ਸਭ ਕਿਛੁ ਪ੍ਰਭੂ ਕੇ ਹੀ ਹਾਥ ਮੇਂ ਹੈ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਹਰੇਕ ਗੱਲ ਪ੍ਰਭੂ ਦੇ ਆਪਣੇ ਹੱਥ ਵਿਚ ਹੈ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh, dice Nanak, el destino está en Sus Manos solamente. (5)"