[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਰਬ ਗੰਜਨ ਸਰਬ ਭੰਜਨ; ਸਰਬ ਤੇ ਅਨਭੀਤ ॥"
page = 33

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is Destroyer and defacer of all, He is without malice and Merciful to all."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜੋ) ਸਭ ਨੂੰ ਨਸ਼ਟ ਕਰਨ ਵਾਲਾ, ਸਭ ਨੂੰ ਤੋੜਨ ਵਾਲਾ ਅਤੇ ਸਭ ਦੇ ਡਰ ਤੋਂ ਰਹਿਤ ਹੈ।"