[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਗੁਣ ਨਿਧੇ ਗੋਪਾਲ ॥"
page = 838
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Treasure of virtue and the Cherisher of the world,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨੇਕੀ ਦਾ ਖਜਾਨਾ ਅਤੇ ਜਗਤ ਦਾ ਪਾਲਕ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord, the treasure of virtue, the Lord of the world,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ ਗੋਪਾਲ! ਸਰਬ ਗੁਣੋਂ ਕੀ ਨਿਧੀ ਰੂਪ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਹੇ ਗੁਣਾਂ ਦੇ ਖ਼ਜ਼ਾਨੇ! ਹੇ ਧਰਤੀ ਦੇ ਰੱਖਿਅਕ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਣ ਨਿਧੇ = ਹੇ ਗੁਣਾਂ ਦੇ ਖ਼ਜ਼ਾਨੇ! ਗੋਪਾਲ = ਹੇ ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਪਾਲਣਹਾਰ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, eres el Tesoro de Virtud;"