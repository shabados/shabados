[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਉਗਣਿਆਰੀ; ਕੰਤ. ਨ ਭਾਵੈ ॥"
page = 1047
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The unvirtuous bride is liked not by her spouse."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੁਕਰਮਣ ਪਤਨੀ ਆਪਣੇ ਪਤੀ ਨੂੰ ਚੰਗੀ ਨਹੀਂ ਲਗਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The unworthy soul-bride is not pleasing to her Husband Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸੀ ਤੇ ਤਿਸ ਅਵਗੁਣਿਆਰੀ ਕੋ (ਕੰਤ) ਪਰਮੇਸਰ ਨਹੀਂ ਭਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਔਗੁਣਾਂ-ਭਰੀ ਜੀਵ-ਇਸਤ੍ਰੀ ਖਸਮ-ਪ੍ਰਭੂ ਨੂੰ ਚੰਗੀ ਨਹੀਂ ਲੱਗਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੰਤ ਨ ਭਾਵੈ = ਕੰਤ ਨੂੰ ਪਸੰਦ ਨਹੀਂ ਆਉਂਦੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La novia sin Virtud no es amada por su Señor,"