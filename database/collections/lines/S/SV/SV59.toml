[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸਾਚੇ; ਸਾਚੈ ਦਰਬਾਰਿ ॥੧॥ ਰਹਾਉ ॥"
page = 355
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and is adjudged true in the True court. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸੱਚੀ ਦਰਗਾਹ ਅੰਦਰ ਉਹ ਸੱਚਾ ਮੰਨਿਆ ਜਾਂਦਾ ਹੈ। ਠਹਿਰਾਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the True Court, he is found to be true. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਗੁਰਮੁਖ ਹੈਂ, ਤਿਸੀ ਤੇ ਸਾਚੇ ਕੇ ਦਰਬਾਰ ਮੇਂ ਸਚੇ ਰਹਤੇ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿਣ ਵਾਲੇ ਬੰਦੇ ਸਦਾ-ਅਟੱਲ ਪ੍ਰਭੂ ਦੇ ਦਰਬਾਰ ਵਿਚ ਸੁਰਖ਼ਰੂ ਹੁੰਦੇ ਹਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚੇ = ਸੁਰਖ਼ਰੂ। ਦਰਬਾਰਿ = ਦਰਬਾਰ ਵਿਚ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "entonces uno será un verdadero Gurmukj y será acreditado como verdadero en la Corte del Señor. (1-Pausa)"