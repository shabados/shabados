[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਨਾਕਸ; ਹਰੇ ਪਰਾਨ ॥"
page = 874
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God took the life of Harnakhash,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨੇ ਹਰਨਾਖਸ਼ ਦੀ ਜਾਨ ਲੈ ਲਈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord took the life of Harnaakhash,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਨੇ ਹੀ ਹਰਨਾਖਸ ਕੇ ਪ੍ਰਾਨ (ਹਰੇ) ਦੂਰ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇ ਹਰਨਾਖਸ਼ (ਦੈਂਤ) ਨੂੰ ਮਾਰਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰੇ ਪਰਾਨ = ਜਾਨ ਲੈ ਲਈ, ਮਾਰਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Señor es Aquél que destruyó a Jarnakash;"