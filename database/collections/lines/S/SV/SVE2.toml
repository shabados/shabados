[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਤਜੀਅਲੇ ਅਵਰਿ ਜੰਜਾਲ ॥੪॥੫੨॥੧੨੧॥"
page = 190
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and Nanak has forsaken all other entanglements."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਨੇ ਹੋਰ ਸਾਰੇ ਪੁਆੜੇ ਛੱਡ ਦਿਤੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak has renounced other entanglements. ||4||52||121||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਪੁਰਸ ਨੇ ਔਰ ਜੰਜਾਲ ਸੰਪੂਰਨ ਤਿਆਗੇ ਹੈਂ॥੪॥੫੨॥੧੨੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਮਨੁੱਖ ਨੇ (ਆਪਣੇ ਮਨ ਵਿਚੋਂ ਮਾਇਆ ਦੇ ਮੋਹ ਦੇ) ਹੋਰ ਸਾਰੇ ਜੰਜਾਲ ਲਾਹ ਦਿੱਤੇ ਹੁੰਦੇ ਹਨ ॥੪॥੫੨॥੧੨੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਜੀਅਲੇ = (ਉਸ ਮਨੁੱਖ ਨੇ) ਛੱਡ ਦਿੱਤੇ ਹਨ। ਅਵਰਿ = {ਲਫ਼ਜ਼ 'ਅਵਰ' ਤੋਂ ਬਹੁ-ਵਚਨ} ਹੋਰ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "oh, dice Nanak, abandona ya todos los otros tipos de esfuerzos y Consérvalo en tu mente, en tus labios y en tu corazón.(4-52-121)"