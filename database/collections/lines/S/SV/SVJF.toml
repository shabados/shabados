type = "primary"
data = "ਕਰਿਯੋ ਰਾਜ ਨਿਹਕੰਟਕੰ ਕਉਰਪਾਲੰ ॥"
page = 147

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(After that) Pandavas ruled over the family of Kauravas unconcerned."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਪਿਛੋਂ) ਰਾਜਾ ਯੁਧਿਸ਼ਠਰ ਨੇ ਕੌਰਵਾਂ ਉਤੇ ਨਿਸ਼ਕੰਟਕ ਰਾਜ ਕੀਤਾ।"