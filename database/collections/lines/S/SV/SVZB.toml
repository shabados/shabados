[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅੰਨ ਖਾਇ ਕੈ ਮਾਤ ਤੇ; ਰਹੇ ਸਦਨ ਮੈ ਸੋਇ ॥੭੬੭॥"
page = 371

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In this way, worshipping Chandi, both the great heroes, Krishna and Balram returned to their home and having their food and drink, they went to sleep.767."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮਾਤਾ ਤੋਂ ਖਾਣਾ ਖਾ ਕੇ ਘਰ ਵਿਚ ਹੀ ਸੌਂ ਰਹੇ ਹਨ ॥੭੬੭॥"