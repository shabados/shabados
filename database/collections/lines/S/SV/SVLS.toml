data = "(ਜਿਸ ਕਰ ਕੇ) ਘਾਇਲ (ਰਾਜਾ ਬਿਕ੍ਰਮ) ਦੇ ਜ਼ਖ਼ਮ ਠੀਕ ਹੋ ਗਏ ॥੬੦॥"