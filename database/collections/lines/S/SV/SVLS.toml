data = "ਬ੍ਰਣੀ ਹੁਤੋ ਅਬ੍ਰਣ ਹ੍ਵੈ ਗਯੋ ॥੬੦॥"
page = 923

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The gods showered their blessing and Bikrim’s injuries Were diminished.(60)"

[[content]]
