[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਮੰਦਰ ਕਉ; ਥਾਮੈ ਥੰਮਨੁ ॥"
page = 282
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As a pillar supports a palace,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਇਕ ਥੰਮ ਮਹਿਲ ਨੂੰ ਆਸਰਾ ਦਿੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As a palace is supported by its pillars,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਮੰਦਰ ਕੋ (ਥੰਮਨੁ) ਥੰਮਾ (ਥਾਮੈ) ਇਸਥਿਤ ਰਾਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਘਰ (ਦੇ ਛੱਤ) ਨੂੰ ਥੰਮ੍ਹ ਸਹਾਰਾ ਦੇਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਦਰ = ਘਰ। ਥਾਮੈ = ਥੰਮ੍ਹਦਾ ਹੈ, ਸਹਾਰਾ ਦੇਈ ਰੱਖਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como un pilar soporta un templo,"