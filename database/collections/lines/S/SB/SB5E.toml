[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਫਕੜ ਜਾਤੀ; ਫਕੜੁ ਨਾਉ ॥"
page = 83
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Perposterous is caste and vain the glory."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਮਾਨ੍ਹੀ ਹੈ ਜਾਤ ਅਤੇ ਫਜੂਲ ਹੈ ਨਾਮਵਰੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Pride in social status is empty; pride in personal glory is useless."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਾਤੀ ਕੇ ਅਭਿਮਾਨ ਵਿਖੇ (ਫਕੜੁ) ਖੁਆਰੀ ਹੈ, ਔਰ ਨਾਮ ਕੇ ਅਭਿਮਾਨ ਮੇਂ ਭੀ ਖੁਆਰੀ ਹੈ ਕਿ ਮੇਂ ਅਧਿਕ ਨਾਮੀ ਹੂੰ, ਭਾਵ ਏਹਿ ਜਾਤੀ ਔਰ ਨਾਮ ਕੀ ਅਧਿਕਤਾ ਮੇਂ ਕੁਛ ਸਿਧ ਨਹੀਂ ਹੋਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਾਤਿ (ਦਾ ਅਹੰਕਾਰ) ਤੇ ਨਾਮ (ਵਡੱਪਣ ਦਾ ਅਹੰਕਾਰ) ਵਿਅਰਥ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫਕੜ = ਵਿਅਰਥ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Vano es el orgullo de las castas, vano es el orgullo de la gloria terrena,"