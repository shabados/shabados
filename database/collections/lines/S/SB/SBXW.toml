[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਹਿ ਮੇਲਿ ਲਏ ॥"
page = 829
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of Himself, the Lord has blended me with Himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਲਕ ਨੇ ਖੁਦ ਹੀ ਮੈਨੂੰ ਆਪਣੇ ਨਾਲ ਅਭੇਦ ਕਰ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself merges us with Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਿਗੁਰੂ! ਤੈਨੇ ਅਪਣੇ ਦਾਸ ਆਪ ਹੀ ਮੇਲ ਲਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ! ਤੇਰੀ ਸ਼ਰਨ ਪਿਆਂ ਨੂੰ ਤੂੰ) ਆਪਣੇ ਚਰਨਾਂ ਵਿਚ ਮਿਲਾ ਲੈਂਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪਹਿ = ਆਪਿ ਹੀ {ਕ੍ਰਿਆ ਵਿਸ਼ੇਸ਼ਣ 'ਹਿ' ਹੀ ਦੇ ਕਾਰਨ ਲਫ਼ਜ਼ 'ਆਪਿ' ਦੀ 'ਿ' ਉੱਡ ਜਾਂਦੀ ਹੈ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por Sí Mismo el Señor me ha unido en Su Ser."