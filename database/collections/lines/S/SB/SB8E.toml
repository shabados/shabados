[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਜਿਸੁ ਪੂਰਬਿ ਹੋਵੈ ਲਿਖਿਆ; ਸੋ ਗੁਰ ਚਰਣੀ ਆਇ ਪਾਇ ॥੧॥"
page = 511
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, he who is so predestined, comes and falls at the Guru's feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ, ਜਿਸ ਦੇ ਭਾਗਾਂ ਵਿੱਚ ਮੁੱਢ ਤੋਂ ਐਸ ਤਰ੍ਹਾਂ ਲਿਖਿਆ ਹੁੰਦਾ ਹੈ, ਉਹ ਆ ਕੇ ਗੁਰਾਂ ਦੇ ਪੈਰੀਂ ਪੈ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, one who has such pre-ordained destiny, comes and falls at the Guru's Feet. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਿਨ ਕੇ ਮਸਤਕ ਪਰ ਪਹਿਲੇ ਹੀ ਸੇ ਲੇਖ ਲਿਖਾ ਹੋਵੈ ਹੈ, ਸੋ ਗੁਰੋਂ ਕੇ ਚਰਨੋਂ ਮੇਂ ਆਇ ਕਰ ਪੜਤੇ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਿਸ ਦੇ ਮੱਥੇ ਤੇ ਧੁਰੋਂ ਭਾਗ ਹੋਵੇ ਉਹ ਮਨੁੱਖ ਸਤਿਗੁਰੂ ਦੀ ਚਰਨੀਂ ਆ ਪੈਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰਬਿ = ਸ਼ੁਰੂ ਤੋਂ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, aquél que así lo tiene escrito en su Destino por Dios, llega a los Pies del Guru. (1)"