[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦਾਖ ਬਿਜਉਰੀ ਜਾਮਣੂ; ਖਿਰਣੀ ਤੂਤ ਖਜੂਰਿ ਅਨੰਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Lemon sized grapes, plums, mimosaceous, mulberry, dates etc. all are delight giving fruits."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਬਿਜੌਰ ਦੇਸ਼ ਦੀ ਦਾਖ, ਜਾਮਣੂ, ਖਿਰਣੀ, ਸੇਬ, ਤੂਤ, ਖਜੂਰਾਂ ਅਨੰਦ ਦਾਇਕ ਹਨ।"