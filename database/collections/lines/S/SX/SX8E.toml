[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਸਕਲ ਤੁਪਕ ਕੇ ਨਾਮ; ਸੁਬੁਧਿ ਪ੍ਰਮਾਨੀਐ ॥੯੩੮॥"
page = 772

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Shashi-ani-janani” add the words “Jaachar-naath” and then “Shatu” at the end, and in this way know all the names of Tupak.938."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਬੁੱਧੀਮਾਨ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝੋ ॥੯੩੮॥"