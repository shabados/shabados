[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੁਨੀ ਭਗਤਿ ਨਿਬਾਹਿ ॥"
page = 407
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sustain my devotional service. O Lord!"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਪ੍ਰੇਮ-ਮਈ ਸੇਵਾ ਸੰਪੂਰਨ ਕਰ। ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Please help me sustain my devotion."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੀ ਭਗਤਿ ਕਾ ਨਿਬਾਹ ਕਰੋ, ਭਾਵ ਮੇਰੇ ਮੇਂ ਭਗਤੀ ਪੂਰਨ ਰਹੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਨੂੰ ਆਪਣੀ ਭਗਤੀ ਸਦਾ ਦੇਈ ਰੱਖ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਬਾਹਿ = ਸਦਾ ਵਾਸਤੇ ਦੇਈ ਰੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, lléname de Devoción,"