[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਯਕੀਨ ਜਾਣੋ, ਕਿ ਉਸ ਦੇ ਮੁਖੜੇ ਤੇ (ਰੱਬੀ) ਸੂਰਜ ਦਾ ਨੂਰ ਚਮਕਣ ਲੱਗ ਪਿਆ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਬਰ ਰੁਖ਼ਸ਼ ਤਹਿਕੀਕ ਨੂਰਿ ਮਿਹਰ ਤਾਫ਼ਤ ॥੪੮੮॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Rest assured that his face will shine like the brilliance and radiance of the divine sun. (488)"