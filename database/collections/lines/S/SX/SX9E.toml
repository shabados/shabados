[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਚਤ ਸੰਚਤ; ਥੈਲੀ ਕੀਨੑੀ ॥"
page = 392
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Amassing and amassing, he fills bags therewith."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕੱਤਰ, ਇਕੱਤਰ ਕਰਕੇ ਉਹ ਉਸ ਨਾਲ ਬੋਰੇ ਭਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Gathering it and collecting it, he fills his bags."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਕੱਤ੍ਰ ਕਰਤਿਆਂ ੨ ਥੈਲੀ ਕਰੀ, ਭਾਵ ਥੈਲੀ ਪਰ ਥੈਲੀ ਜੋੜਨੀ ਕਰੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋੜਦਿਆਂ ਜੋੜਦਿਆਂ (ਜੇ ਉਸ ਨੇ) ਖ਼ਜ਼ਾਨਾ (ਭੀ) ਬਣਾ ਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਚਤ = ਇਕੱਠੀ ਕਰਦਿਆਂ। ਕੀਨ੍ਹ੍ਹੀ = ਬਣਾ ਲਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Junta los tesoros poco a poco, pero Dios,"