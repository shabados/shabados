[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਜਨ ਲੇਹਿ; ਖਸਮ ਕਾ ਨਾਉ ॥"
page = 328
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am ever a sacrifice unto the men,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਹਮੇਸ਼ਾਂ ਉਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am forever a sacrifice to those humble beings"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੁਰਸ ਮਾਲਕ ਅਰਥਾਤ ਪਰਮੇਸ੍ਵਰ ਕਾ ਨਾਮ ਲੇਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਮਾਲਕ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਜਪਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੇਹਿ = ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A aquél que recita el Nombre el Señor,"