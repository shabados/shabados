data = "ਖ਼ੁਦਾਵੰਦ ਬਖ਼ਸ਼ਿੰਦਹ ਹਰ ਯਕ ਅਮਾ ॥੨॥"
page = 1413

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He keeps us all away from afflictions.(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ ਹਰ ਇਕ ਦਾਤ ਦੇਣ ਵਾਲਾ ਅਤੇ ਸੁਖ ਦੇਣ ਵਾਲਾ ਹੈ ॥੨॥"