[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਸੇਵਹਿ; ਸੇ ਵਡਭਾਗੀ ॥"
page = 841
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Very fortunate are they who serve the True Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਭਾਰੇ ਨਸੀਬਾਂ ਵਾਲੇ ਹਨ ਉਹ, ਜੋ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਟਹਿਲ ਕਮਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who serve the True Guru are very fortunate."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸਤਿਗੁਰੋਂ ਕੋ ਸੇਵਤੇ ਹੈਂ ਸੋਈ ਬਡਭਾਗੀ ਪੁਰਸ ਭਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਹ ਮਨੁੱਖ ਵੱਡੇ ਭਾਗਾਂ ਵਾਲੇ ਹੁੰਦੇ ਹਨ ਜਿਹੜੇ ਗੁਰੂ ਦੀ ਸਰਨ ਆ ਪੈਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵਹਿ = ਸੇਂਵਦੇ ਹਨ, ਸੇਵਾ-ਭਗਤੀ ਕਰਦੇ ਹਨ, ਸਰਨ ਪੈਂਦੇ ਹਨ {ਬਹੁ-ਵਚਨ}। ਸੇ = ਉਹ {ਬਹੁ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Afortunados son los que sirven al Guru Verdadero,"