[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਚਰਨ ਕਮਲ ਗੁਰੁ, ਅਗਮ ਅਲਾਵਹਿ ॥੧੧॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They all declare the feet of Guru as unapproachable"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਪਰੰਤੂ ਇਹੀ) ਆਖਦੇ ਹਨ ਕਿ ਗੁਰੂ ਦੇ ਚਰਨ ਕਵਲ ਅਗੰਮ ਹਨ।"