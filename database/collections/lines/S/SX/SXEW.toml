type = "primary"
data = "ਸਿੰਘ ਪ੍ਰਾਨ ਤਬ ਹੀ ਤਜੇ; ਲਗੇ ਤੁਪਕ ਕੇ ਘਾਇ ॥"
page = 866

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the bullet hit, the lion breathed its last,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬੰਦੂਕ ਦੀ ਗੋਲੀ ਲਗਦਿਆਂ ਹੀ ਸ਼ੇਰ ਨੇ ਪ੍ਰਾਣ ਤਿਆਗ ਦਿੱਤੇ"