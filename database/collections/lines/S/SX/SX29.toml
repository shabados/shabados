[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚੀ ਕਰਣੀ; ਗੁਰ ਵੀਚਾਰਿ ॥"
page = 931
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The true way of life is obtained by Guru's instruction."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੀ ਜੀਵਨ-ਰਹੁ-ਰੀਤੀ ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਦੁਆਰਾ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True way of life comes through contemplation of the Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਚੀ ਕਰਣੀ ਗੁਰੋਂ ਕੇ ਬੀਚਾਰ ਦ੍ਵਾਰਾ ਪ੍ਰਾਪਤ ਹੋਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੋਪਾਲ ਦੇ ਗੁਣ ਯਾਦ ਕਰਨ ਦਾ ਸੱਚਾ ਕਰਤੱਬ ਸਤਿਗੁਰੂ ਦੇ ਉਪਦੇਸ਼ ਦੀ ਰਾਹੀਂ ਹੀ ਹੋ ਸਕਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਵੀਚਾਰਿ = ਗੁਰੂ ਦੀ ਦਿੱਤੀ ਹੋਈ ਵਿਚਾਰ ਦੁਆਰਾ। ਕਰਣੀ = ਕਰਤੱਬ। ਸਾਚੀ ਕਰਣੀ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਚੇਤੇ ਕਰਨ ਵਾਲਾ ਕਰਤੱਬ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, la verdadera acción es la Meditación en la Sabiduría del Guru."