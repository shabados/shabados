[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਆਤਮ ਤਤੁ; ਨ ਚੀਨੑਿਆ ॥"
page = 1351
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whosoever realises not the real soul;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੋਈ ਅਸਲੀ ਆਤਮਾ ਨੂੰ ਅਨੁਭਵ ਨਹੀਂ ਕਰਦਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whoever does not realize the essence of the soul"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਹੇ ਭਾਈ! ਜਿਨੋਂ ਨੇ ਆਪਨੇ ਆਪ ਸਾਰ ਸਰੂਪ ਕੋ ਨਹੀਂ ਜਾਣਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਗੱਲ ਸੱਚ ਹੈ ਕਿ ਜਿਸ ਮਨੁੱਖ ਨੇ ਆਤਮਾ ਦੀ ਅਸਲੀਅਤ ਨੂੰ ਨਹੀਂ ਪਛਾਣਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ ਮਨੁੱਖ ਨੇ। ਤਤੁ = ਅਸਲੀਅਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien no toma conciencia de la Esencia del Alma,"