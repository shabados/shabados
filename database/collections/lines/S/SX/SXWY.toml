[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਸੁ ਪਾਨੀ ਤੇ; ਜਿਨਿ ਤੂ ਘਰਿਆ ॥"
page = 913
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who fashioned thee out of this drop of water,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਤੈਨੂੰ ਪਾਣੀ ਦੇ ਏਸ ਤੁਪਕੇ ਤੋਂ ਘੜਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He created you out of this water."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਰਕਤ ਬੀਰਜ ਰੂਪ ਪਾਣੀ ਤੇ ਜਿਸ ਨੇ ਤੇਰਾ ਏਹ ਸਰੀਰ ਘੜਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪ੍ਰਭੂ ਨੇ ਪਿਤਾ ਦੀ ਬੂੰਦ ਤੋਂ ਤੈਨੂੰ ਬਣਾਇਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਨੀ ਤੇ = ਪਿਤਾ ਦੀ ਬੂੰਦ ਤੋਂ। ਜਿਨਿ = ਜਿਸ (ਪ੍ਰਭੂ) ਨੇ। ਤੂ = ਤੈਨੂੰ। ਘਰਿਆ = ਘੜਿਆ, ਬਣਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que te creó de una gota de agua,"