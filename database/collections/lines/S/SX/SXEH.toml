[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਏਕੁ ਨਿਰੰਜਨੁ ਗਾਈਐ; ਸਭ ਅੰਤਰਿ ਸੋਈ ॥"
page = 706
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sing thou the praise of the one Immaculate Lord, who is contained in everything."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਇਕ ਪਵਿੱਤ੍ਰ ਪ੍ਰਭੂ ਦਾ ਜੱਸ ਗਾਇਨ ਕਰ, ਜੋ ਹਰ ਸ਼ੈ ਅੰਦਰ ਰਮਿਆ ਹੋਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sing the Praise of the One, the Immaculate Lord; He is contained within all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਏਕ ਹਰੀ ਨਿਰੰਜਨ ਕੋ ਗਾਈਐ ਕਿਉਂਕਿ ਸਰਬ ਕੇ ਅੰਤਰ ਸੋਈ ਵਿਆਪਕ ਸਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਪ੍ਰਭੂ ਮਾਇਆ ਤੋਂ ਨਿਰਲੇਪ ਹੈ ਸਿਰਫ਼ ਉਸ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਕਰਨੀ ਚਾਹੀਦੀ ਹੈ, ਉਹੀ ਸਭ ਦੇ ਅੰਦਰ ਮੌਜੂਦ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰੰਜਨੁ = ਨਿਰ-ਅੰਜਨੁ {ਅੰਜਨੁ = ਕਾਲਖ, ਮਾਇਆ} ਮਾਇਆ ਤੋਂ ਨਿਰਲੇਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Canta las Alabanzas del Único Dios en tu interior,"