[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਉ ਨਿਧਿ ਤੇਰੈ. ਸਗਲ ਨਿਧਾਨ ॥"
page = 376
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou hast nine valuable riches and miracles and all the treasures."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਕੋਲ ਨੌਂ ਸੰਪਦਾ ਤੇ ਕਰਾਮਾਤਾਂ ਅਤੇ ਸਾਰੇ ਖ਼ਜ਼ਾਨੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The nine treasures are Yours - all treasures are Yours."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਉ ਨਿਧਿ ਆਦਿਕ ਸਭ ਪਦਾਰਥ ਤੇਰੇ ਖਜਾਨੇ ਮੇਂ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪ੍ਰਭੂ!) ਤੇਰੇ ਘਰ ਵਿਚ (ਜਗਤ ਦੀਆਂ) ਨੌ ਹੀ ਨਿਧੀਆਂ ਮੌਜੂਦ ਹਨ ਸਾਰੇ ਖ਼ਜ਼ਾਨੇ ਮੌਜੂਦ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇਰੈ = ਤੇਰੇ ਘਰ ਵਿਚ (ਹੇ ਪ੍ਰਭੂ!)। ਸਗਲ = ਸਾਰੇ। ਨਿਧਿ = ਖ਼ਜ਼ਾਨਾ। ਨਿਧਾਨ = ਖ਼ਜ਼ਾਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Nueve Tesoros son Tuyos, oh Dios; no, ¡todos los tesoros son Tuyos!"