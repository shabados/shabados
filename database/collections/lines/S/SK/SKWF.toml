[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੇ ਚਰਨ ਨਮਸਕਾਰਿ ॥"
page = 895
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Bow thou ever to the Guru's feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਦਾ ਗੁਰਾਂ ਦੇ ਪੈਰਾਂ ਨੂੰ ਬੰਦਨਾ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Bow down to the Guru's Feet,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਗੁਰੂ ਕੇ ਚਰਨੋਂ ਕੋ ਨਮਸਕਾਰ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਉਤੇ ਆਪਣਾ ਸਿਰ ਨਿਵਾਈ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਮਸਕਾਰਿ = ਸਿਰ ਨਿਵਾਇਆ ਕਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Póstrate siempre a los Pies de Loto de tu Señor"