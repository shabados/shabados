[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਤਿ ਊਚਾ; ਤਾ ਕਾ ਦਰਬਾਰਾ ॥"
page = 562
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Loftiest of the lofty is His court."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤਿਅੰਤ ਉੱਚੀ ਹੈ ਉਸ ਦੀ ਦਰਗਾਹ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His Darbaar, His Court, is the most lofty and exalted."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਤਿਅੰਤ ਊਚਾ ਤਿਸ ਪਿਆਰੇ ਕਾ ਦਰਬਾਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਦਰਬਾਰ ਬਹੁਤ ਹੀ ਉੱਚਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕਾ = ਉਸ (ਪਰਮਾਤਮਾ) ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo más Alto de lo alto es la Corte de mi Señor;"