[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਹੋ, ਸੁ ਸ੍ਰਮ ਕਾ ਸੋ ਕਹੈ, ਦਮ ਕੋ ਕਹਾ ਕਹੰਤ ॥"
page = 35

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "What is called effort? And what shuld endurance be called?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦਸੋ, ਤਪਸਿਆ ਕਿਸ ਨੂੰ ਕਹਿੰਦੇ ਹਨ ਅਤੇ (ਇੰਦਰੀਆਂ ਦਾ) ਦਮਨ ਕਿਸ ਨੂੰ ਕਹਿੰਦੇ ਹਨ?"