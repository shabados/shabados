[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਮਹਿ ਛਡਾਵਹੁ; ਛੁਟਕਹਿ ਬੰਧ ॥"
page = 890
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If Thou freest the mortal, then alone can his bonds be broken."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਤੂੰ ਪ੍ਰਾਣੀ ਨੂੰ ਰਿਹਾ ਕਰੇਂ, ਕੇਵਲ ਤਾਂ ਹੀ ਉਸ ਦੀਆਂ ਬੇੜੀਆਂ ਕੱਟੀਆਂ ਜਾ ਸਕਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If You emancipate the human, then his bonds are broken."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ ਤੁਮ ਹੀ ਛੁਡਾਵੋਗੇ ਤੋ ਬੰਧਨ ਸੇ ਛੂਟੇਂਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪ ਹੀ ਜੀਵਾਂ ਦੇ ਮਾਇਆ ਦੇ ਬੰਧਨ ਤੋੜੇਂ ਤਾਂ ਹੀ ਟੁੱਟ ਸਕਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੁਮਹਿ = ਤੂੰ (ਆਪ) ਹੀ। ਛੁਟਕਹਿ = ਛੁੱਟਦੇ ਹਨ, ਟੁੱਟਦੇ ਹਨ। ਬੰਧ = ਬੰਧਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Señor Benévolo, sólo si rompes mis amarras me puedo liberar."