[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਅਗਨਿ ਜਲੈ ਸੰਸਾਰੇ ॥"
page = 1049
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the fire of worldly valuables, the world is burning."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰੀ ਪਦਾਰਥਾਂ ਦੀ ਅੱਗ ਅੰਦਰ ਦੁਨੀਆਂ ਮੱਚ ਰਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The world is burning in the fire of Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖ ਮਾਇਆ ਕੀ ਤ੍ਰਿਸਨਾ ਅਗਨਿ ਕਰ ਸੰਸਾਰ ਮੇਂ ਜਲਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ (ਦੀ ਤ੍ਰਿਸ਼ਨਾ) ਦੀ ਅੱਗ ਜਗਤ ਵਿਚ ਭੜਕ ਰਹੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਲੈ = ਬਲ ਰਹੀ ਹੈ, ਭੜਕ ਰਹੀ ਹੈ। ਸੰਸਾਰੇ = ਸੰਸਾਰਿ, ਸੰਸਾਰ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mundo se consume en el fuego de Maya;"