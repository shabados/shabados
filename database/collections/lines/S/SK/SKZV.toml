[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਰਮਲ ਨਾਮੁ; ਸਦ ਹਿਰਦੈ ਧਿਆਏ ॥੪॥"
page = 412
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "ever, meditates on the immaculate Name in his heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪਵਿੱਤ੍ਰ ਨਾਮ ਦਾ ਹਮੇਸ਼ਾਂ ਹੀ ਆਪਣੇ ਦਿਲ ਅੰਦਰ ਸਿਮਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "meditates forever within his heart on the Immaculate Naam. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਧ ਨਾਮ ਕੋ ਅੰਤਸਕਰਣ ਮੇਂ ਸਦਾ ਧ੍ਯਾਉਤੇ ਹੈਂ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਪਰਮਾਤਮਾ ਦੇ ਪਵਿਤ੍ਰ ਨਾਮ ਨੂੰ ਸਦਾ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਯਾਦ ਰੱਖਦਾ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਦ = ਸਦਾ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y permite que habite el Nombre Inmaculado del Señor en el corazón. (4)"