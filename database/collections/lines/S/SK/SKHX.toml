[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਨਦਰੀ ਸੁਖੁ ਹੋਇ; ਏਨਾ ਜੰਤਾ ਕਾ ਦੁਖੁ ਜਾਇ ॥੧॥"
page = 1282
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, by God's peace wells up and the pain of these creatures departs."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਵਾਹਿਗੁਰੂ ਦੀ ਰਹਿਮਤ ਸਦਕਾ, ਆਰਾਮ ਉਤਪੰਨ ਹੁੰਦਾ ਹੈ ਅਤੇ ਇਨ੍ਹਾਂ ਜੀਵਾਂ ਦਾ ਕਸ਼ਟ ਨਵਿਰਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, by His Grace, there is peace; the pain of these creatures is gone. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਜਬ ਨਦਰੀ ਕੀ ਨਦਰ ਕਰ ਸੁਖ ਹੋਵੈ, ਤੌ ਇਨ ਜੀਵੋਂ ਕਾ ਦੁਖ ਜਾਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਪ੍ਰਭੂ ਦੀ ਮਿਹਰ ਦੀ ਨਜ਼ਰ ਨਾਲ ਸੁਖ ਪੈਦਾ ਹੁੰਦਾ ਹੈ ਤੇ ਇਹਨਾਂ ਜੀਵਾਂ ਦਾ ਦੁੱਖ ਦੂਰ ਹੁੰਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਦਰਿ = ਪਰਮਾਤਮਾ ਦੀ ਮਿਹਰ ਦੀ ਨਿਗਾਹ ਨਾਲ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por Su Gracia, oh, dice Nanak, obtienen Paz y el dolor de estas criaturas se va. (1)"