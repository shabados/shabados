data = "ਇਨ੍ਹਾਂ ਨੂੰ ਦੁਨੀਆ ਤਾਂ ਮਾੜੇ ਲੱਛਣ ਕਹਿੰਦੀ ਹੈ ਅਤੇ ਤੁਸੀਂ ਗੁਣ ਕਹਿੰਦੇ ਹੋ"