[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੀ ਬਾਂਧੀ. ਭਗਤੁ ਛਡਾਵੈ; ਬਾਂਧੈ ਭਗਤੁ. ਨ ਛੂਟੈ ਮੋਹਿ ॥"
page = 1252
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My saint can release one bound by me, but I can release not one bound by my saint."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਬੰਨ੍ਹੇ ਹੋਏ ਨੂੰ ਮੇਰਾ ਸਾਧੂ ਛੜ ਸਕਦਾ ਹੈ, ਪਰ ਮੇਰੇ ਸਾਧੂ ਦੇ ਬੰਨ੍ਹੇ ਹੋਏ ਨੂੰ ਮੈਂ ਛਡ ਨਹੀਂ ਸਕਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The devotee can release anyone from my bondage, but I cannot release anyone from his."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਬਾਂਧੀ ਹੂਈ ਪਰਤਗ੍ਯਾ ਕੋ ਭਗਤੁ ਛੁਡਾਇ ਦੇਤਾ ਹੈ ਔਰ ਜੋ ਭਗਤੁ ਪਰਤਗ੍ਯਾ ਬਾਂਧ ਸੇ ਮੇਰੇ ਸੇ ਛੂਟਤੀ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੀ ਬੱਧੀ ਹੋਈ (ਮੋਹ ਦੀ) ਗੰਢ ਨੂੰ ਮੇਰਾ ਭਗਤ ਖੋਲ੍ਹ ਲੈਂਦਾ ਹੈ, ਪਰ ਜਦੋਂ ਮੇਰਾ ਭਗਤ (ਮੇਰੇ ਨਾਲ ਪ੍ਰੇਮ ਦੀ ਗੰਢ) ਬੰਨ੍ਹਦਾ ਹੈ ਉਹ ਮੈਥੋਂ ਖੁਲ੍ਹ ਨਹੀਂ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੋਹਿ = ਮੇਰੇ ਪਾਸੋਂ, ਮੈਥੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo que ato Yo, mi Devoto lo puede desatar, pero aquello que Mi Devoto ata, ni Yo Mismo lo desato, pues el Lazo del Amor Me Somete a Mí con Mi Devoto,"