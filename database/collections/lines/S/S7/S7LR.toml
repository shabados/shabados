[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਨ ਹੋਇ; ਰਾਮ ਨਾਮ ਅਧਾਰਾ ॥੧॥ ਰਹਾਉ ॥"
page = 330
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "when I have not the Lord's Name as my support? Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਕਿ ਸੁਆਮੀ ਦੇ ਨਾਮ ਦਾ ਆਸਰਾ ਮੇਰੇ ਪੱਲੇ ਨਹੀਂ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have not taken the Lord's Name as my Support. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਰਾਮ ਨਾਮ ਕਾ ਅਧਾਰ ਨ ਹੋਵੇ॥੧॥ ਰਹਾਉ ॥☬ਪ੍ਰਸ਼ਨ: ਨਾਮ ਸੇ ਬਿਨਾਂ ਔਰ ਜੋਗ ਆਦਿ ਸਾਧਨ ਭੀ ਆਪਨੇ ਕੀਏ ਹੋਵੇਂਗੇ ਤਿਨਕਾ ਅਧਾਰ ਹੋਵੇਗਾ?☬ਉੱਤ੍ਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ ਮਾਇਆ ਇਤਨੀ ਪ੍ਰਬਲ ਹੈ ਕਿ) ਜੇ ਅਸਾਨੂੰ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦਾ ਆਸਰਾ ਨਾਹ ਹੋਵੇ ਤਾਂ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਬ = ਜੇ। ਅਧਾਰਾ = ਆਸਰਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No he tomado el Naam, el Nombre del Señor como mi Soporte. (1-Pausa)"