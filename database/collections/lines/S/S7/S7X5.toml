[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚਿ ਨਾਮਿ; ਮੇਰਾ ਮਨੁ ਲਾਗਾ ॥"
page = 384
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With the True Name, my soul is attached."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਤਿਨਾਮ ਨਾਲ ਮੇਰੀ ਜਿੰਦੜੀ ਜੁੜੀ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My mind is attached to the True Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰਾ ਮਨ ਸਾਚੇ ਨਾਮੀ ਮੇਂ ਲਗਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਮੇਰਾ ਮਨ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਿਚ (ਸਦਾ) ਜੁੜਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਚਿ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲੇ ਵਿਚ। ਨਾਮਿ = ਨਾਮ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La mente más profunda está entonada en el Verdadero Nombre del Señor,"