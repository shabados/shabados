[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਚਿੰਤ; ਨਾਮੁ ਵਸਿਆ ਮਨਿ ਆਈ ॥"
page = 798
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All-too-spontaneously the Name has come to abide within my mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੁਦ-ਬ-ਖੁਦ ਹੀ ਨਾਮ ਆ ਕੇ ਮੇਰੇ ਚਿੱਤ ਅੰਦਰ ਟਿਕ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Naam, the Name of the Lord, has spontaneously come to abide in my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਚਿੰਤਾ ਕੇ ਦੂਰ ਕਰਨੇਹਾਰਾ ਤੇਰਾ ਨਾਮੁ ਤਿਨਾਂ ਕੇ ਮਨ ਮੇਂ ਆਇ ਵਸਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਮਨ ਵਿਚ ਉਹ ਹਰਿ-ਨਾਮ ਆ ਵੱਸਦਾ ਹੈ ਜੋ ਹਰੇਕ ਕਿਸਮ ਦਾ ਫ਼ਿਕਰ-ਤੌਖਲਾ ਦੂਰ ਕਰ ਦੇਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਚਿੰਤ ਨਾਮੁ = ਚਿੰਤਾ ਤੋਂ ਬਚਾਣ ਵਾਲਾ ਹਰਿ-ਨਾਮ। ਮਨਿ = ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre del Señor es enaltecido en mi mente de modo espontáneo."