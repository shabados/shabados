[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੋਰਹੁ ਸੁਤ ਕੈ ਰਾਖਿਯੈ ਜੋ ਹ︀ਯਾਂ ਲ︀ਯਾਵੈ ਰਾਮ ॥੩॥"
page = 885

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘If God sends a thief, we may keep him as our son.(3)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੇ ਪਰਮਾਤਮਾ ਇਥੇ ਚੋਰ ਨੂੰ ਵੀ ਲੈ ਆਏ (ਤਾਂ ਉਸ ਨੂੰ ਵੀ ਅਸੀਂ) ਪੁੱਤਰ ਬਣਾ ਕੇ ਰਖ ਲਵਾਂਗੇ ॥੩॥"