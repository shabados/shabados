[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਾਰਿ ਅਨੁਗ੍ਰਹੁ. ਆਪਿ ਪ੍ਰਭ ਸ੍ਵਾਮੀ; ਪਤਿ ਮਤਿ ਕੀਨੀ ਪੂਰੀ ॥"
page = 625
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Extending His mercy, the Lord Master has Himself saved my honour and illumined my intellect."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਮਿਹਰ ਕਰ ਕੇ, ਪ੍ਰਭੂ ਪ੍ਰਮੇਸ਼ਰ ਨੇ ਖੁਦ ਮੇਰੀ ਇੱਜ਼ਤ ਤੇ ਅਕਲ ਸਸ਼ੋਭਤ ਕਰ ਦਿੱਤੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Granting His Grace, God my Lord and Master Himself saved my honor, and my intellect has been made perfect."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ ਸੁਆਮੀ! ਤੈਨੇ ਅਪਨੀ ਕਿਰਪਾ ਕਰ ਕੇ ਪਤਿ ਔ ਬੁਧੀ ਭੀ ਮੇਰੀ ਪੂਰੀ ਕਰੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਹੇ ਸੁਆਮੀ! ਤੂੰ ਆਪ ਹੀ (ਜੀਵ ਉਤੇ) ਕਿਰਪਾ ਕਰ ਕੇ ਉਸ ਨੂੰ (ਲੋਕ ਪਰਲੋਕ ਵਿਚ) ਇੱਜ਼ਤ ਬਖ਼ਸ਼ਦਾ ਹੈਂ, ਉਸ ਨੂੰ ਪੂਰੀ ਅਕਲ ਦੇ ਦੇਂਦਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨੁਗ੍ਰਹੁ = ਕਿਰਪਾ। ਧਾਰਿ = ਕਰ ਕੇ। ਪ੍ਰਭ = ਹੇ ਪ੍ਰਭੂ। ਪਤਿ = ਇੱਜ਼ਤ। ਮਤਿ = ਅਕਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, eres Compasivo conmigo; has salvado mi honor e iluminado mi intelecto."