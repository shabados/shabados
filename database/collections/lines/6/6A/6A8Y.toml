[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਇਆ ਦਿਵਾਨਾ ਸਾਹ ਕਾ; ਨਾਨਕੁ ਬਉਰਾਨਾ ॥"
page = 991
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ignorant Nanak has become mad after his Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੇਸਮਝ ਨਾਨਕ, ਆਪਣੇ ਸੁਆਮੀ ਦੇ ਮਗਰ ਸ਼ੁਦਾਈ ਹੋ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Crazy Nanak has gone insane, after his Lord, the King."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਮੈਂ ਬਾਵਰਾ ਹੂਆ ਹੂੰ, ਸੋ ਤੌ ਬਾਵਰਾ (ਸਾਹ) ਪਰਮੇਸੁਰ ਕੀ ਪ੍ਰਾਪਤੀ ਕਾ ਭਇਆ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸ਼ਾਹ-ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦਾ ਆਸ਼ਿਕ ਹੋ ਗਿਆ ਹਾਂ। (ਇਸ ਵਾਸਤੇ ਦੁਨੀਆ ਆਖਦੀ ਹੈ ਕਿ) ਨਾਨਕ ਝੱਲਾ ਹੋ ਗਿਆ ਹੈ"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਇਆ = ਹਉ ਭਇਆ, ਮੈਂ ਹੋ ਗਿਆ ਹਾਂ। ਦਿਵਾਨਾ = ਮਸਤਾਨਾ, ਆਸ਼ਿਕ, ਪ੍ਰੇਮੀ। ਸਾਹ ਕਾ = ਸ਼ਾਹ-ਪ੍ਰਭੂ (ਦੇ ਨਾਮ) ਦਾ। ਬਉਰਾਨਾ = ਝੱਲਾ, ਕਮਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Pero estoy loco por mi Rey, mi Dios,"