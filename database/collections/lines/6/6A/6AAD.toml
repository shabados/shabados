data = "ਮਾਇ ਮਰੇ ਪਦ ਕੂਕਿ ਸੁਨਾਵਤ ॥੨੪॥"
page = 871

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "With fully stretched bows, they came into action and dying braves yelled for their mothers.(24)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ 'ਹਾਇ ਮਾਂ ਮਰ ਗਏ' ਸ਼ਬਦ ਕੂਕ ਕੇ ਸੁਣਾਉਂਦੇ ॥੨੪॥"