[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਰਨ ਕਮਲ; ਭਗਤਾਂ ਮਨਿ ਵੁਠੇ ॥"
page = 109
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The God's lotus feet abide in the heart of His devotees."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਦੇ ਕੰਵਲ ਪੈਰ ਉਸ ਦੇ ਅਨੁਰਾਗੀਆਂ ਦੇ ਦਿਲ ਵਿੱਚ ਵਸਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His Lotus Feet dwell in the minds of His devotees."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਚਰਨ ਕਮਲ ਭਗਤੋਂ ਕੇ ਮਨ ਮੇਂ ਵਸੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਭਗਤਾਂ ਦੇ ਮਨ ਵਿਚ ਪਰਮਾਤਮਾ ਦੇ ਸੋਹਣੇ ਚਰਨ (ਸਦਾ) ਵੱਸਦੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵੁਠੇ = ਵਸਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las mentes de los Devotos están concentradas en los Pies de Loto del Señor."