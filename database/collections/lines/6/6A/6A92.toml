[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਆਗੀ; ਸਰਨਿ ਪਾਵਾ ॥"
page = 71
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have abondened and sought the Guru's sanctuary."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਛਡ ਕੇ ਮੈਂ ਗੁਰਾਂ ਦੀ ਸ਼ਰਣਾਗਤ ਸੰਭਾਲੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have sought His Sanctuary."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤ੍ਯਾਗੀ ਹੋ ਕਰ ਜੋ ਸਰਨ ਕੋ ਪ੍ਰਾਪਤਿ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਪ੍ਰਭੂ ਦੀ ਹੀ ਸਰਨ ਪਿਆ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਵਾ = ਮੈਂ ਪਿਆ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "busca el Santuario del Señor"