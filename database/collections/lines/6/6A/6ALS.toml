[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਰਗੁ ਛੋਡਿ; ਅਮਾਰਗਿ ਪਾਇ ॥"
page = 1165
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He abandons the Lord's path and goes the wrong way."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ ਦੇ ਰਸਤੇ ਨੂੰ ਤਿਆਗ, ਕੁਰਾਹੇ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He abandons the Lord's Path, and takes the wrong path."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰ (ਮਾਰਗੁ) ਸਤਿਸੰਗ ਕੇ ਰਸਤੇ ਕੋ ਛੋਡ ਕੇ ਕੁਸੰਗੀਓਂ ਕੇ ਰਸਤੇ ਪੜਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੀਵਨ ਦਾ ਸਿੱਧਾ) ਰਾਹ ਛੱਡ ਕੇ (ਵਿਕਾਰਾਂ ਦੇ) ਉਲਟੇ ਰਸਤੇ ਪੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਮਾਰਗਿ = ਕੁਰਾਹੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pues ha abandonado Su Sendero y va por el camino equivocado."