[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਹਲਾਦ ਕਾ ਰਾਖਾ ਹੋਇ; ਰਘੁਰਾਇਆ ॥੩॥"
page = 1133
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God, the King of Raghwas becomes the saviour of Prahlad."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਘਵਾਂ ਦਾ ਰਾਜਾ ਵਾਹਿਗੁਰੂ ਪ੍ਰਹਿਲਾਦ ਦਾ ਰਖਵਾਲਾ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "God is the Savior of Prahlaad. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਲੋਕ ਕਹਤੇ ਹੈਂ ਕਿ ਪ੍ਰਹਿਲਾਦੁ ਕਾ ਰਖਕੁ ਰਾਮ ਹੀ ਹੋਵੈਗਾ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਪ੍ਰਹਿਲਾਦ ਦਾ ਰਾਖਾ ਆਪ ਪਰਮਾਤਮਾ ਬਣ ਗਿਆ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਘੁਰਾਇਆ = ਪਰਮਾਤਮਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "que ahora sólo Dios podía darle protección. (3)"