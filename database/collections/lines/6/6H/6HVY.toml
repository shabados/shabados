[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਥਮੇ ਮਿਟਿਆ; ਤਨ ਕਾ ਦੂਖ ॥"
page = 395
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "First vanishes the pain of the body,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਹਿਲਾਂ ਦੇਹਿ ਦੀ ਪੀੜ ਨਾਸ ਹੋ ਗਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "First, the pains of the body vanish;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਿਥਮੇ ਮੇਰਾ ਸਰੀਰ ਕਾ ਦੁਖ ਦੂਰ ਹੋ ਗ੍ਯਾ, ਭਾਵ ਦੇਹ ਅਭਿਮਾਨ ਨਵਿਰਤ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਗੁਰੂ ਨੂੰ ਮਿਲਿਆਂ ਸਭ ਤੋਂ) ਪਹਿਲਾਂ ਮੇਰੇ ਸਰੀਰ ਦਾ ਹਰੇਕ ਦੁੱਖ ਮਿਟ ਗਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਥਮੇ = ਪਹਿਲਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El dolor se va del cuerpo"