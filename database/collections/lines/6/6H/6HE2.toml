data = "ਤੁਮ ਕੋ ਮੀਤ ਆਪਨੋ ਕੈਹੋ ॥੧੦॥"
page = 869

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "I will show you her deception, and for that you become my friend.(10)"

