[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਤੈ ਦੈਤ ਬਾਕੇ, ਉਤੈ ਦੇਵ ਸੋਹੈ ॥"
page = 983

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On one side were the gods and the other devils."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਧਰ ਬਾਂਕੇ ਦੈਂਤ ਸਨ ਅਤੇ ਉਧਰ ਦੇਵਤੇ ਸ਼ੋਭ ਰਹੇ ਸਨ।"