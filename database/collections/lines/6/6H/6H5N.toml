data = "ਦੋਊ ਮਤ ਬਾਰੁੰਨ ਬਿਕ੍ਰਮ ਸਮਾਨੰ ॥"
page = 147

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Both were intoxicate elephants and like king Vikrama."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੋਵੇਂ ਹਾਥੀ ('ਬਾਰੁੰਨ') ਵਾਂਗ ਮਸਤ ਅਤੇ (ਰਾਜਾ) ਬਿਕ੍ਰਮ ਦੇ ਸਮਾਨ ਸਨ।"