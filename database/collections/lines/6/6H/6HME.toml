[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉਮੈ; ਭਗਤਿ ਕਰੇ ਸਭੁ ਕੋਇ ॥"
page = 1277
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Abiding in ego, every one serves the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੰਗਤਾ ਅੰਦਰ ਵਸ, ਹਰ ਕੋਈ ਸਾਈਂ ਦੀ ਸੇਵਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In egotism, everyone can pretend to worship God with devotion."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਉਮੈਂ ਵਿਚ ਸਭ ਕੋਈ ਭਗਤੀ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਸਰਨ ਆਉਣ ਤੋਂ ਬਿਨਾ ਆਪਣੀ) ਹਉਮੈ ਦੇ ਆਸਰੇ ਹਰ ਕੋਈ ਭਗਤੀ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭੁ ਕੋਇ = ਹਰੇਕ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con egoísmo muchos pretenden alabar a Dios con toda devoción,"