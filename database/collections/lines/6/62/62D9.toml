data = "ਮੁਸਟ ਜੁਧ ਪੰਚਮ ਭਯੋ; ਬਰਖਿਯੋ ਲੋਹ ਅਪਾਰ ॥"
page = 973

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then came the turn of the boxing, and the hands swung like steel."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪੰਜਵਾਂ ਯੁੱਧ ਮੁਕਿਆਂ ਦਾ ਹੋਇਆ ਅਤੇ ਬਹੁਤ ਲੋਹਾ ਖੜਕਿਆ"