[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੂਰਜ ਚੰਦੁ; ਕਰਹਿ ਉਜੀਆਰਾ ॥"
page = 329
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The sun and the moon diffuse light."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੂਰਜ ਅਤੇ ਚੰਦ੍ਰਮਾ ਚਾਨਣ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The sun and the moon give their light;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਿਸ ਕੀ ਸਤਾ ਕੋ ਪਾਇ ਕਰ ਸੂਰਜ ਔਰ ਚੰਦ੍ਰਮਾ ਉਜਿਆਲਾ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਜੋ) ਸੂਰਜ ਤੇ ਚੰਦ੍ਰਮਾ (ਆਦਿਕ ਜਗਤ ਵਿਚ) ਚਾਨਣ ਕਰ ਰਹੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਹਿ = ਕਰ ਰਹੇ ਹਨ। ਉਜਿਆਰਾ = ਚਾਨਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El sol y la luna brillan con resplandor,"