[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਇਆ ਮੋਹੁ; ਜਗਤੁ ਸਬਾਇਆ ॥"
page = 129
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The entire universe is engrossed in the love of worldly valuables."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੀ ਦੁਨੀਆਂ ਸੰਸਾਰੀ ਪਦਾਰਥਾਂ ਦੀ ਪ੍ਰੀਤ ਅੰਦਰ ਖਚਤ ਹੋਈ ਹੋਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The whole world is engrossed in emotional attachment to Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਜਗਤ ਮਾਇਆ ਕਰ ਮੋਹਿਆ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਾਇਆ ਦਾ ਮੋਹ ਸਾਰੇ ਜਗਤ ਨੂੰ ਵਿਆਪ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਬਾਇਆ = ਸਾਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El mundo entero está envuelto en el amor a Maya;"