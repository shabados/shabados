[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਬ ਹੀ, ਆਤਮ ਤਤ ਕੋ ਦਰਸੇ; ਪਰਮ ਪੁਰਖ ਕਹ ਪਾਵੈ ॥੩॥੧॥੧॥"
page = 709

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then you will visualize the supreme essence and realise the supreme Purusha.3.1."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਦ ਹੀ ਆਤਮ ਤੱਤ ਨੂੰ ਵੇਖ ਸਕੇਂਗਾ ਅਤੇ ਪਰਮ ਪੁਰਖ (ਪਰਮਾਤਮਾ) ਨੂੰ ਪ੍ਰਾਪਤ ਕਰੇਂਗਾ ॥੩॥੧॥"