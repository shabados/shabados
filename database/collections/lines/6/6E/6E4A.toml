[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਾਜ ਰਾਜ ਅਰੁ ਗਿਰੇ ਕਿਕਾਣੰ ॥"
page = 106

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The goddess showered arrows like incessant rain, which caused the horses and their riders fall down."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਕਰਕੇ) ਘੋੜ-ਸਵਾਰ ਅਤੇ ਘੋੜੇ ਡਿਗ ਪਏ।"