[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛਾਤੀ ਸੀਤਲ. ਮਨੁ ਸੁਖੀ; ਛੰਤ ਗੋਬਿਦ ਗੁਨ ਗਾਇ ॥"
page = 254
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The breast becomes cool and the soul happy, by singing the chhant of the praises of the World-Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ੍ਰਿਸ਼ਟੀ ਦੇ ਸੁਆਮੀ ਦੇ ਜੱਸ ਦੇ ਛੰਦ ਗਾਇਨ ਕਰਨ ਦੁਆਰਾ ਹਿੱਕ ਠੰਡੀਠਾਰ ਅਤੇ ਆਤਮਾ ਪਰਸੰਨ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The heart is cooled and soothed, and the mind is at peace, chanting and singing the Glorious Praises of the Lord of the Universe."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਬਿੰਦ ਜੀ! ਤੇਰੇ ਗੁਨ ਅਰ ਜਸ ਕੋ ਗਾਇ ਕਰ ਮੇਰੀ ਛਾਤੀ ਅਰਥਾਤ ਬੁਧੀ ਸੀਤਲ ਭਈ ਹੈ, ਪੁਨਾ ਮਨ ਭੀ ਸੁਖੀ ਹੂਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ ਗਾ ਕੇ ਮੇਰੇ ਦਿਲ ਵਿਚ ਠੰਡ ਪੈ ਜਾਏ, ਮੇਰਾ ਮਨ ਸੁਖੀ ਹੋ ਜਾਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੀਤਲ = ਠੰਡੀ। ਛੰਤ = ਛੰਦ, ਗੀਤ। ਗਾਇ = ਗਾ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El corazón del que canta la Alabanza del Señor, está en Paz, y su mente en Equilibrio."