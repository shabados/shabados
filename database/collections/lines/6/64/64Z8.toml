[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇੰਦ੍ਰਾਦਿ ਬਿਸਨੁ ਬੈਠੇ ਪਿਨਾਕ ॥੨੩॥"
page = 636

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing Indra, Vishnu and Shiva, all the devotees eulogized them.23."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ਿਵ ('ਪਿਨਾਕ') ਵਿਸ਼ਣੂ ਅਤੇ ਇੰਦਰ ਬੈਠੇ ਹੋਏ (ਪ੍ਰਸੰਨ ਹੋਏ) ॥੨੩॥"