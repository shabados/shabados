[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਕਉ ਰਾਖੈ; ਸਿਰਜਨਹਾਰੁ ॥"
page = 867
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, whom the Creator Lord saves,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਰਚਣਹਾਰ ਸੁਆਮੀ ਰੱਖਿਆ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who is protected by the Creator Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ (ਸਿਰਜਨਹਾਰ) ਪ੍ਰਮੇਸ੍ਵਰ ਰਾਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਰਤਾਰ ਆਪ ਜਿਸ ਮਨੁੱਖ ਦੀ ਰੱਖਿਆ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸ ਕਉ = {ਲਫ਼ਜ਼ 'ਜਿਸੁ' ਦਾ (ੁ) ਸੰਬੰਧਕ 'ਕਉ' ਦੇ ਕਾਰਨ ਉਡ ਗਿਆ ਹੈ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél a quien el Señor Creador salva,"