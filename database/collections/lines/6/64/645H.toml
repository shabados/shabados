[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਮਰੁ ਅਜੋਨੀ; ਜਾਤਿ ਨ ਜਾਲਾ ॥"
page = 838
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and without caste and involvement."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਵਰਨ ਤੇ ਜੰਜਾਲ ਰਹਿਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "immortal, unborn, beyond social class or involvement."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮ੍ਰਿਤ ਸੇ ਰਹਿਤ ਅਰੁ (ਅਜੋਨੀ) ਜਨਮ ਸੇ ਰਹਤ ਹੈ, ਔ ਤਿਸ ਕੋ ਕੋਈ ਜਾਤੀ ਕਾ ਬੰਧਨੁ ਭੀ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਕਦੇ ਮਰਦਾ ਨਹੀਂ, ਉਹ ਜੂਨਾਂ ਵਿਚ ਨਹੀਂ ਆਉਂਦਾ, ਉਸ ਦੀ ਕੋਈ ਖ਼ਾਸ ਜਾਤਿ ਨਹੀਂ, ਉਸ ਨੂੰ (ਮਾਇਆ ਆਦਿਕ ਦਾ) ਕੋਈ ਬੰਧਨ ਨਹੀਂ (ਵਿਆਪਦਾ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਲਾ = ਜਾਲ, ਬੰਧਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Inmortal, no ha nacido del vientre, no tiene casta,"