data = "ਸੂਰ ਲਯੋ ਜਾ ਤੇ ਉਜਿਆਰਾ ॥੧॥"
page = 844

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He was handsome too and, even, the Sun borrowed light from him.(1)"

