[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਧਰਮ ਧਾਮ ਸੁ ਭਰਮ ਰਹਿਤ; ਅਭੂਤ ਅਲਖ ਅਭੇਸ ॥"
page = 5
line = 11

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art the Abode of righteousness,  Thou art Illusionless, Garbless, Incomprehensible and devoid of five elements."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਧਰਮ ਦਾ ਸਰੋਤ, ਭਰਮ ਤੋਂ ਰਹਿਤ, ਪੰਜ ਤੱਤ੍ਵਾਂ ਤੋਂ ਨਿਆਰਾ, ਅਦ੍ਰਿਸ਼ ਅਤੇ ਭੇਸ ਰਹਿਤ ਹੈ;"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਧਰਮ ਧਾਮ ਸੁ ਭਰਮ ਰਹਤ; ਅਭੂਤ ਅਲਖ ਅਭੇਸ ॥"