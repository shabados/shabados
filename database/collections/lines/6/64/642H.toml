[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸੂਕਿ ਦੂਬਰੋ ਤਨ ਭਯੋ; ਹੇਰੇ ਲਜਤ ਰਬਾਬ ॥੧੩॥"
page = 892

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And got weaker and weaker with the shame.(13)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸ਼ਰਮ ਦਾ ਮਾਰਿਆ ਸੁਕ ਕੇ ਰਬਾਬ ਵਰਗਾ ਦੁਬਲਾ ਹੋ ਗਿਆ ॥੧੩॥"