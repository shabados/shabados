[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨ ਸਿਧ ਸਾਧਿਕਾ ਧਰਾ ॥"
page = 143
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "nor men of miracles or seekers shall stay on earth."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਂ ਹੀ ਕਰਾਮਾਤੀ ਬੰਦੇ ਅਭਿਆਸੀ ਧਰਤੀ ਤੇ ਰਹਿਣਗੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nor the Siddhas, nor the seekers shall remain on the earth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਨ ਸਿੱਧ ਹੈ ਨ (ਸਾਧਿਕਾ) ਸਾਧਨਾ ਕਰਨੇ ਵਾਲੇ ਹੈਂ ਔ (ਧਰਾ) ਪ੍ਰਿਥ੍ਵੀ ਭੀ ਸਤਿ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਹ ਜੋਗ-ਸਾਧਨਾਂ ਵਿਚ ਪੁੱਗੇ ਜੋਗੀ, ਨਾਹ ਜੋਗ-ਸਾਧਨ ਕਰਨ ਵਾਲੇ, ਕੋਈ ਭੀ ਧਰਤੀ ਤੇ ਨਾਹ ਰਿਹਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਧ = ਜੋਗ-ਸਾਧਨਾਂ ਵਿਚ ਪੁੱਗੇ ਹੋਏ ਜੋਗੀ। ਧਰਾ = ਧਰਤੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ni Sidhas, ni buscadores permanecerán en la Tierra."