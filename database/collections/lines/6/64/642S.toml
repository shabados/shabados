data = "ਤਾ ਕੌ ਘੇਰਿ ਦਸੋ ਦਿਸਿ ਲਯੋ ॥੨੫॥"
page = 991

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Raja made the army to besiege the enemy from all the four sides.(25)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ (ਵੈਰੀ) ਨੂੰ ਚੌਹਾਂ ਪਾਸਿਆਂ ਤੋਂ ਘੇਰ ਲਿਆ ॥੨੫॥"