[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕਨਾ ਨੋ ਹਰਿ ਲਾਭੁ ਦੇਇ; ਜੋ ਗੁਰਮੁਖਿ ਥੀਵੇ ॥"
page = 83
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God grants profit to some who becomes Guruwards."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈਆਂ ਨੂੰ ਜਿਹਡੇ ਗੁਰੂ ਅਨੁਸਾਰੀ ਹੋ ਜਾਂਦੇ ਹਨ ਵਾਹਿਗੁਰੂ ਨਫਾ ਬਖਸ਼ਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord bestows His Profits on those who become Gurmukh."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਉਨ ਏਕ ਪੁਰਸੋਂ ਕੋ ਮਾਨੁਖ ਜਨਮ ਵਿਖੇ ਲਾਭ ਦੇਤਾ ਹੈ, ਜੋ ਗੁਰੋਂ ਕੇ ਸਨਮੁਖ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੀਵ ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੋ ਗਏ ਹਨ, ਉਹਨਾਂ ਨੂੰ ਹਰੀ ਨਫ਼ਾ ਬਖ਼ਸ਼ਦਾ ਹੈ, (ਭਾਵ, ਉਹਨਾਂ ਦਾ ਜਨਮ ਸਫਲਾ ਕਰਦਾ ਹੈ)"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahí los Gurmukjs cosechan la Ganancia."