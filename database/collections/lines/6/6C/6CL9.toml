[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਹਾ ਪੰਥਿ; ਤੇਰਾ. ਕੋ ਨ ਸਿਞਾਨੂ ॥"
page = 264
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "On the path where there is no acquaintance of thine,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਰਸਤੇ ਉਤੇ ਤੇਰਾ ਕੋਈ ਜਾਣੂ ਨਹੀਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "On that journey where no one knows you,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਰਸਤੇ ਮੇਂ ਤੇਰਾ ਕੋਈ ਸਿਆਨੂ ਨਹੀਂ ਅਰਥਾਤ ਤੁਝ ਕੌ ਕੋਈ ਜਾਨਤਾ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਰਸਤੇ ਵਿਚ (ਹੇ ਜੀਵ!) ਤੇਰਾ ਕੋਈ (ਅਸਲੀ) ਮਰਹਮ ਨਹੀਂ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੰਥਿ = ਰਾਹ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En cualquier sitio donde te traten como un extraño,"