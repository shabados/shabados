[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਪੂਰੈ; ਮੇਟਿਆ ਅੰਧਿਆਰਾ ॥"
page = 184
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Perfect Guru has dispelled the darkness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਾਂ ਨੇ ਅਨ੍ਹੇਰਾ ਨਵਿਰਤ ਕਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Perfect Guru has dispelled the darkness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਪੂਰੇ ਨੇ ਜਿਨ ਕਾ ਅਗਿਆਨ ਅੰਧਕਾਰ ਮੇਟਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰਮਾਤਮਾ ਦੀ ਮਿਹਰ ਨਾਲ) ਪੂਰੇ ਗੁਰੂ ਨੇ (ਜਿਸ ਮਨੁੱਖ ਦੇ ਅੰਦਰੋਂ ਮਾਇਆ ਦੇ ਮੋਹ ਦਾ) ਹਨੇਰਾ ਦੂਰ ਕਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "su ceguera ha sido disipada por el Perfecto Guru."