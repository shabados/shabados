[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਨੁ ਬਨੁ ਫਿਰਤੀ ਢੂਢਤੀ; ਬਸਤੁ ਰਹੀ ਘਰਿ ਬਾਰਿ ॥"
page = 934
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The things thou wanderest for, searching forest to forest, abides within thy very home."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜੀ ਚੀਜ਼ ਨੂੰ ਤੂੰ ਜੰਗਲ ਜੰਗਲ ਲੱਭਦੀ ਫਿਰਦੀ ਹੈਂ, ਉਹ ਤੇਰੇ ਆਪਣੇ ਗ੍ਰਹਿ ਅੰਦਰ ਹੀ ਵੱਸਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wandering from forest to forest searching, you will find that those things are within the home of your own heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਗੇ ਤੋ ਬੁਧੀ ਬਨ ਬਨ ਮੇਂ (ਢੂਢਤੀ) ਖੋਜਤੀ ਫਿਰਤੀ ਥੀ ਔ (ਘਰਿ) ਅੰਤਸਕਰਣ ਕੇ (ਬਾਰਿ) ਬੀਚ ਆਤਮ ਵਸਤੂ ਰਹਿ ਗਈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜੋ ਜੀਵ-ਇਸਤ੍ਰੀ ਉਸ ਪ੍ਰਭੂ-ਨਾਮ ਦੀ ਖ਼ਾਤਰ) ਜੰਗਲ ਜੰਗਲ ਢੂੰਢਦੀ ਫਿਰੀ (ਉਸ ਨੂੰ ਨਾਹ ਮਿਲਿਆ, ਕਿਉਂਕਿ) ਉਹ (ਨਾਮ-) ਵਸਤ ਤਾਂ ਹਿਰਦੇ ਵਿਚ ਸੀ, ਘਰ ਦੇ ਅੰਦਰ ਹੀ ਸੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਸਤੁ = 'ਨਾਮ'-ਰੂਪੀ (ਅਸਲ) ਚੀਜ਼। ਘਰਿ = ਘਰ ਵਿਚ। ਬਾਰਿ = ਦਰਵਾਜ਼ੇ ਦੇ ਅੰਦਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y de estar triste por la dualidad, te vuelves Santo, encontrando a tu Dios Guru."