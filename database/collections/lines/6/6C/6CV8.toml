[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਕੈ ਦੀਐ; ਰਹੈ ਅਘਾਇ ॥"
page = 281
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By whose gifts man remains satiated,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀਆਂ ਦਾਤਾਂ ਦੁਆਰਾ ਆਦਮੀ ਰੱਜਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By His gifts, we are satisfied,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਦੀਏ ਹੂਏ ਸੇ ਤੂੰ ਤ੍ਰਿਪਤ ਰਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਦਿੱਤਿਆਂ (ਮਨੁੱਖ) ਰੱਜਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਹੈ ਅਘਾਇ = ਅਘਾਇ ਰਹੈ, ਰੱਜਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "…con Sus Regalos cualquier anhelo."