[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੀਨਿ ਭਵਨ, ਭਰਪੂਰਿ ਰਹਿਓ ਸੋਈ ॥"
page = 1405
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, the Lord is fully-filling the three worlds."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਆਮੀ, ਤਿੰਨਾਂ ਹੀ ਜਹਾਨਾ ਅੰਦਰ ਪਰੀਪੂਰਨ ਹੋ ਰਿਹਾ ਹੈ, "

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is totally pervading and permeating the three realms;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੀਨੋਂ ਲੋਕੋਂ ਮੇਂ ਆਪ ਸੋਈ ਅਕਾਲਪੁਰਖ ਪਰੀਪੂਰਨ ਹੋਇ ਰਹਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਹੜਾ) ਅਕਾਲ ਪੁਰਖ ਆਪ ਹੀ ਤਿੰਨਾਂ ਭਵਨਾਂ ਵਿਚ ਵਿਆਪਕ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਰਪੂਰਿ ਰਹਿਓ = ਵਿਆਪਕ ਹੈ। ਸੋਈ = ਉਹ ਅਕਾਲ ਪੁਰਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él prevalece y compenetra plenamente los tres mundos,"