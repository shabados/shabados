[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਧਉ ਅਕ੍ਰੂਰੁ ਤਿਲੋਚਨੁ ਨਾਮਾ; ਕਲਿ ਕਬੀਰ. ਕਿਲਵਿਖ ਹਰਿਆ ॥"
page = 1393
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Name effaced the sins of Oodho, Akrur and, in the Darkage, of Tirlochan, Nam Dev and Kabir."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਨੇ ਊਧੋ, ਅਕਰੂਰ ਅਤੇ ਕਲਜੁਗ ਵਿੱਚ ਤ੍ਰਿਲੋਚਨ, ਨਾਮਦੇਵ ਅਤੇ ਕਬੀਰ ਦੇ ਪਾਪ ਮੇਟ ਦਿੱਤੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It has erased the sins of Oodho, Akroor, Trilochan, Naam Dayv and Kabeer, in this Dark Age of Kali Yuga."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਧਵ ਜੀ ਅਕ੍ਰੂਰ, ਤ੍ਰਿਲੋਚਨ, ਭਗਤ ਨਾਮਦੇਵ ਜੀ ਨੇ ਪੁਨਾ ਕਲਿਯੁਗ ਕੇ ਬੀਚ ਕਬੀਰ ਜੀ ਤੇ ਆਦਿ ਲੇ ਕਰ ਸਰਬ ਭਗਤੋਂ ਨੇ ਜਿਸ ਨਾਮ ਕੇ ਜਾਪ ਸੇ ਸਰਬ (ਕਿਲਵਿਖ) ਪਾਪੋਂ ਕੋ (ਹਰਿਆ) ਦੂਰ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸੇ ਨਾਮ ਨੂੰ ਊਧੌ, ਅਕ੍ਰੂਰ, ਤ੍ਰਿਲੋਚਨ ਅਤੇ ਨਾਮਦੇਵ ਭਗਤ ਨੇ ਸਿਮਰਿਆ, (ਉਸੇ ਨਾਮ ਨੇ) ਕਲਜੁਗ ਵਿਚ ਕਬੀਰ ਦੇ ਪਾਪ ਦੂਰ ਕੀਤੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਲਿ = ਕਲਜੁਗ ਵਿਚ। ਕਿਲਵਿਖ = ਪਾਪ। ਹਰਿਆ = ਦੂਰ ਕੀਤੇ। ਉਧਉ = ਕ੍ਰਿਸ਼ਨ ਜੀ ਦਾ ਭਗਤ। ਅਕ੍ਰੂਰੁ = ਕ੍ਰਿਸ਼ਨ ਜੀ ਦਾ ਭਗਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ha borrado las faltas de Odho, Akur, Trilochan, Nam Dev y Kabir en esta era oscura de Kali."