[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕੁ ਜੀਵੈ; ਹਰਿ ਚਰਣ ਧਿਆਇ ॥੪॥੧੨॥"
page = 1183
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak lives by meditating on the God's feet."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਵਾਹਿਗੁਰੂ ਦੇ ਪੈਰਾਂ ਦਾ ਆਰਾਧਨ ਕਰਨ ਦੁਆਰਾ ਜੀਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak lives by meditating on the Feet of the Lord. ||4||12||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹਰੀ ਕੇ ਚਰਣੋਂ ਕੋ ਧ੍ਯਾਇ ਕਰ ਜੀਵਤੇ ਹੈਂ॥੪॥੧੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ (ਭੀ) ਉਸ ਪਰਮਾਤਮਾ ਦੇ ਚਰਨਾਂ ਦਾ ਧਿਆਨ ਧਰ ਕੇ ਆਤਮਕ ਜੀਵਨ ਹਾਸਲ ਕਰਦਾ ਰਹਿੰਦਾ ਹੈ ॥੪॥੧੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਵੈ = ਆਤਮਕ ਜੀਵਨ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ। ਧਿਆਇ = ਧਿਆਨ ਧਰ ਕੇ ॥੪॥੧੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "meditando en los Pies del Señor. (4-12)"