[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੈ ਵਸਿ; ਖਾਨ ਸੁਲਤਾਨ ॥"
page = 182
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In whose power are the lords and emperors."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਕਾਬੂ ਵਿੱਚ ਹਨ, ਸਰਦਾਰ ਅਤੇ ਪਾਤਸ਼ਾਹ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Kings and emperors are under His Power."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਪਦੇਸ: ਜਿਸ ਕੇ ਅਧੀਨ ਸਰਦਾਰ ਔਰ ਪਾਤਸ਼ਾਹ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਦੁਨੀਆ ਦੇ) ਖ਼ਾਨ ਤੇ ਸੁਲਤਾਨ (ਭੀ) ਜਿਸ ਪਰਮਾਤਮਾ ਦੇ ਅਧੀਨ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾ ਕੈ ਵਸਿ = ਜਿਸ (ਪਰਮਾਤਮਾ) ਦੇ ਵੱਸ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél, Cuyo Poder domina a los regentes y a los reyes."