[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਰੂ ਮਹਲਾ ੩ ਘਰੁ ੫ ਅਸਟਪਦੀ ॥"
page = 1016
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Maru 3rd Guru. Ashatpadi."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਰੂ ਤੀਜੀ ਪਾਤਿਸ਼ਾਹੀ ਅਸ਼ਟਪਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Maaroo, Third Mehl, Fifth House, Ashtpadheeyaa:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਮਾਰੂ, ਘਰ ੫ ਵਿੱਚ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਦੀ ਅੱਠ-ਬੰਦਾਂ ਵਾਲੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Maru, Mejl Guru Amar Das, Tercer Canal Divino, Ashtapadis."