[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਕਰਤਾ; ਆਪੇ ਦੇਉ ॥੮॥"
page = 930
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "is himself the Creator and Himself the Luminous Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਖ਼ੁਦ ਸਿਰਜਣਹਾਰ ਹੈ ਅਤੇ ਖ਼ੁਦ ਹੀ ਪ੍ਰਕਾਸ਼ਵਾਨ ਪ੍ਰਭੂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "is Himself the Creator, Himself the Divine Lord. ||8||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਓਹ ਆਪ ਹੀ ਕਰਤਾ ਹੈ ਔਰ ਆਪ ਹੀ (ਦੇਉ) ਪ੍ਰਕਾਸ ਰੂਪ ਹੈ॥੮॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਿ ਪ੍ਰਭੂ ਆਪ ਹੀ ਸਾਰੇ ਜਗਤ ਦਾ ਪੈਦਾ ਕਰਨ ਵਾਲਾ ਹੈ ਤੇ ਆਪ ਹੀ (ਆਪ ਜੋਤਿ ਨਾਲ ਇਸ ਨੂੰ) ਚਾਨਣ ਦੇਣ ਵਾਲਾ ਹੈ (ਭਾਵ, ਪ੍ਰਭੂ ਆਪ ਹੀ ਇਸ ਜਗਤ ਨੂੰ ਜੀਵਨ-ਰਾਹ ਸਿਖਾਣ ਵਾਲਾ) ਹੈ ॥੮॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੇ = ਆਪ ਹੀ। ਦੇਉ = ਚਾਨਣ ਦੇਣ ਵਾਲਾ ॥੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es en verdad Uno con Él.(8)"