data = "ਰੋਝ ਰੀਛ ਬਹੁ ਭਾਂਤਿ ਬਿਦਾਰੇ ॥"
page = 60

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "There I killed may lions, nilgais and bears."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਈ ਤਰ੍ਹਾਂ ਦੇ ਰਿਛਾਂ ਅਤੇ ਨੀਲਗਾਵਾਂ (ਰੋਝ) ਨੂੰ ਮਾਰਿਆ।"