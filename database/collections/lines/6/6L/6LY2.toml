data = "ਬ ਜਾਨੋ ਦਿਲੇ ਬਰ ਤੁ ਆਸ਼ਕ ਸ਼ੁਦਮ ॥੧੭॥"
page = 1407

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Because I love you from, both, my heart and soul.(17)"

