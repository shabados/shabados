data = "ਕਿਉਂਕਿ ਮੈਂ ਦਿਲੋ-ਜਾਨ ਤੋਂ ਤੇਰੇ ਉਤੇ ਆਸ਼ਕ ਹਾਂ ॥੧੭॥"