[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੀ ਸਾਲਾਹਿਹੁ, ਸਾਚਾ ਸੋਇ ॥"
page = 595
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever praise thou that True Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਦਾ ਹੀ ਉਸ ਸੱਚੇ ਸੁਆਮੀ ਦੀ ਸਿਫ਼ਤ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So praise the True Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਜੋ ਸਚਾ ਵਾਹਿਗੁਰੂ ਪਤਿ ਹੈ ਤਿਸ ਕੋ (ਭੀ) ਬਾਰੰਬਾਰ (ਸਲਾਹਿਹੁ) ਉਪਮਾ ਕਰਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੁੜ ਮੁੜ ਉਸ ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲੇ ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤ-ਸਾਲਾਹ ਕਰਦੇ ਰਹੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੀ = ਮੁੜ ਮੁੜ। ਸਾਚਾ = ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es mejor que alabes al Creador, pues por Su Gracia obtenemos el Éxtasis Eterno."