data = "ਬਹੁ ਸੁੰਦਰੀ ਸੁਭ ਨੈਨ ॥੯੧॥"
page = 633

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The flutes were played and there were many beautiful ladies of charming eyes seated there.91."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਸੁੰਦਰ ਅਤੇ ਸ਼ੁਭ ਨੈਣਾਂ ਵਾਲੀਆਂ (ਇਸਤਰੀਆਂ ਗਾਉਂਦੀਆਂ ਹਨ) ॥੯੧॥"