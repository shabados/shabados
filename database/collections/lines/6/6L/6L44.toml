[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਇਸਨਾਨੁ; ਤਨਿ ਚਕ੍ਰ ਬਣਾਏ ॥"
page = 1348
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Taking bath, he makes religious marks on his body,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਹਾ ਧੋ ਕੇ, ਉਹ ਆਪਣੀ ਦੇਹ ਉਤੇ ਧਾਰਮਕ ਚਿੰਨ ਬਣਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Ritual cleansing baths are taken, and sacred marks are applied to the body."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ਼ਨਾਨ ਕਰ ਕੇ ਮਨ ਮੇਂ ਚਕ੍ਰਾਦੀ ਚਿਹਨ ਭੀ ਬਣਾਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ (ਤੀਰਥ-ਆਦਿ ਉਤੇ) ਇਸ਼ਨਾਨ ਕਰ ਕੇ ਸਰੀਰ ਉੱਤੇ (ਧਾਰਮਿਕ ਚਿਹਨਾਂ ਦੇ) ਨਿਸ਼ਾਨ ਲਾਏ ਜਾਣ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ। ਤਨਿ = ਸਰੀਰ ਉੱਤੇ। ਚਕ੍ਰ = (ਧਾਰਮਿਕ ਚਿੰਨ੍ਹਾਂ ਦੇ) ਨਿਸ਼ਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Baños rituales son tomados y marcas sagradas son aplicadas en el cuerpo,"