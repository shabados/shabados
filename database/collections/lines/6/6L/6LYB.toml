[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕੁ ਵਖਾਣੈ; ਸਾਚੁ ਨਾਮੁ ॥੪॥੧॥੧੩॥"
page = 1176
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak ever utters the Lord's True Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਸਦੀਵ ਹੀ ਸੁਆਮੀ ਦੇ ਸੱਚੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak chants the True Name. ||4||1||13||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਾਂ ਤੇ ਜੀਵ ਸਾਚੇ ਨਾਮ ਕੋ ਜਪੈ॥੪॥੧੩॥☬ਮਨ ਕੇ ਪ੍ਰਥਾਇ ਦ੍ਰਿਸ੍ਟਾਂਤੋਂ ਕਰ ਉਪਦੇਸੁ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਾਹੀਏਂ) ਨਾਨਕ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਉਚਾਰਦਾ ਰਹਿੰਦਾ ਹੈ ॥੪॥੧॥੧੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕੁ ਵਖਾਣੈ = ਨਾਨਕ ਉਚਾਰਦਾ ਹੈ। ਸਾਚੁ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ॥੪॥੧॥੧੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así Nanak recita por siempre el Nombre Eterno del Señor. (4-1-13)"