[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂੰ ਠਾਕੁਰੁ ਸੁਆਮੀ; ਪ੍ਰਭੁ ਮੇਰਾ ॥"
page = 106
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou art my Lord Master Husband."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰਾ ਸਾਹਿਬ ਮਾਲਕ ਤੇ ਸਿਰ ਦਾ ਸਾਈਂ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my God, my Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਠਾਕੁਰ! ਤੂੰ  ਮੇਰਾ ਸਮਰਥੁ ਸੁਆਮੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਮੇਰਾ ਪਾਲਣਹਾਰ ਹੈਂ, ਤੂੰ ਮੇਰਾ ਸੁਆਮੀ ਹੈਂ, ਤੂੰ ਮੇਰਾ ਮਾਲਕ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque Tú eres mi Señor, mi Maestro."