[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੇ ਓਹੁ; ਕੂਪ ਤਟਾ ਦੇਵਾਵੈ ॥"
page = 875
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and if he dedicates a well and if he dedicates a well and a tank,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਜੇਕਰ ਉਹ ਖੂਹ ਅਤੇ ਤਲਾਬ ਸਮਰਪਨ ਕਰ ਦੇਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and dig wells and pools,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਵਹੁ ਕੂਏ ਔ ਤਲਾਉ ਭੀ (ਦੇਵਾਵੈ) ਲਗਾਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ (ਲੋਕਾਂ ਦੇ ਭਲੇ ਲਈ) ਖੂਹ ਤਲਾਬ (ਆਦਿਕ) ਲਵਾਏ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੂਪ = ਖੂਹ। ਤਟਾ = {नडाग} ਤਲਾਬ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si construye pozos y tanques para que otros se bañen,"