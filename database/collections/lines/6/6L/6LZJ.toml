[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਗਰ ਪਾਵਟਾ ਸੁਭ ਕਰਨ; ਜਮੁਨਾ ਬਹੈ ਸਮੀਪ ॥੨੪੯੦॥"
page = 550

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In the town of Paonta at the auspicious hour, on banks of the flowing Yamuna, (this work has been completed).2490."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਾਂਵਟਾ ਨਗਰ (ਵਿਚ ਕਵਿਤਾ ਰਚਣ ਦਾ ਇਹ) ਸ਼ੁਭ ਕਰਮ (ਕੀਤਾ ਜਿਥੇ) ਨੇੜੇ ਹੀ ਜਮਨਾ ਵਗ ਰਹੀ ਹੈ ॥੨੪੯੦॥"