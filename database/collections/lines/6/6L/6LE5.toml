data = "ਚੇਰੀ ਪੁਤ੍ਰ ਕਹਾ ਤੇ ਪਾਯੋ ॥੬॥"
page = 916

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘I have never maid love with the maid, then, how did she becotne pregnant.’(6)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਫਿਰ) ਇਸ ਦਾਸੀ ਨੇ ਪੁੱਤਰ ਕਿਥੋਂ ਪ੍ਰਾਪਤ ਕੀਤਾ ਹੈ ॥੬॥"