[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਖਾਟ ਸਾਹੁ ਕੋ ਪੁਤ੍ਰ ਲੈ ਅਧਿਕ ਦੁਖ︀ਯ ਭਯੋ ਚਿਤ ॥"
page = 892

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Taking the bed Shah’s son was very much afflicted."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸ਼ਾਹ ਦਾ ਪੁੱਤਰ ਮੰਜੀ ਲੈ ਕੇ ਮਨ ਵਿਚ ਹੋਰ ਵੀ ਦੁਖੀ ਹੋਇਆ।"