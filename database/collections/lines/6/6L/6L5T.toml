data = "ਤਿਸੁ ਗੁਰ ਕਉ; ਝੂਲਾਵਉ ਪਾਖਾ ॥"
page = 239
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I wave the fan over that Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਗੁਰੂ ਨੂੰ ਮੈਂ ਪੱਖਾ ਝੱਲਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
