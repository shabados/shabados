[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉਮੈ ਰੋਗੁ ਮਹਾ ਦੁਖੁ ਲਾਗਾ; ਗੁਰਮਤਿ ਲੇਵਹੁ. ਰੋਗੁ ਗਇਆ ॥੬॥"
page = 906
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou sufferest great pain from the disease of self-conceit. Receiving the Guru's instruction thou shalt be rid of this disease."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਵੈ-ਹੰਗਤਾ ਦੀ ਬੀਮਾਰੀ ਨਾਲ ਤੂੰ ਬਹੁਤ ਤਕਲੀਫ ਉਠਾਉਂਦਾ ਹੈਂ। ਗੁਰਾਂ ਦਾ ਉਪਦੇਸ਼ ਧਾਰਨ ਕਰਨ ਦੁਆਰਾ ਤੂੰ ਇਸ ਬੀਮਾਰੀ ਤੋਂ ਖਲਾਸੀ ਪਾ ਜਾਵੇਗਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You suffer great pain from the disease of egotism. Following the Guru's Teachings, you shall be rid of this disease. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਉਮੈ ਰੋਗ ਕਾ ਤੁਮ ਕੋ ਬਡਾ ਦੁਖ ਲਾਗਾ ਹੈ। ਜੇ ਤੂੰ ਗੁਰਮਤਿ ਲੇਵੇਂ ਤੌ ਤੂੰ ਜਾਨ ਕਿ ਏਹ ਰੋਗ ਗਿਆ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੈਨੂੰ ਹਉਮੈ ਦਾ ਵੱਡਾ ਰੋਗ ਵੱਡਾ ਦੁੱਖ ਚੰਬੜਿਆ ਹੋਇਆ ਹੈ। ਜੇ ਤੂੰ ਚਾਹੁੰਦਾ ਹੈਂ ਇਹ ਰੋਗ ਦੂਰ ਹੋ ਜਾਏ ਤਾਂ ਗੁਰੂ ਦੀ ਸਿੱਖਿਆ ਲੈ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਮਤਿ = ਗੁਰੂ ਦੀ ਸਿੱਖਿਆ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Eres picado por el ego, pero recuerda: sólo a través de la Palabra del Shabd del Guru uno es liberado de esta Maya. (6)"