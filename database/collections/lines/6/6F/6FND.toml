[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਵਨੁ ਬਾਪਾਰੀ; ਜਾ ਕਾ ਊਹਾ ਵਿਸਾਹੁ ॥੧॥"
page = 181
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who is that dealer who commands credit there?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਕਿਹੜਾ ਵਪਾਰੀ ਹੈ, ਜਿਸਦੀ ਓਥੇ ਸਾਖ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Who is the trader who deals there? ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਵਨੁ ਓਹੁ ਬਪਾਰੀ ਹੈ ਜਿਸ ਕਾ ਊਹਾ, ਭਾਵ ਤੇਰੇ ਸਰੂਪ ਮੇਂ ਬਿਸ੍ਵਾਸੁ ਹੈ? ॥੧॥☬ਉੱਤ੍ਰ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਵਿਰਲਾ ਨਾਮ-ਵਣਜਾਰਾ ਹੈ, ਜਿਸ ਦਾ ਉਸ ਸ਼ਾਹ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਇਤਬਾਰ ਬਣਿਆ ਹੋਇਆ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਾਪਾਰੀ = ਨਾਮ-ਪੂੰਜੀ ਦਾ ਵਣਜ ਕਰਨ ਵਾਲਾ। ਵਿਸਾਹੁ = ਇਤਬਾਰ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero, ¿quién comercia con Él? (1)"