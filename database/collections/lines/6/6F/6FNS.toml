[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਾਹਿਬੁ ਸਉਹੈਂ ਆਪਣੇ; ਹਥਿਆਰੁ ਨ ਫੜੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Take not arms against your master."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਾਲਕ ਦੇ ਸਾਹਮਣੇ (ਕਦੀ) ਹਥਿਆਰ ਨਾ ਫੜੀਏ।"