type = "primary"
data = "ਰਵਿ ਰਥ ਹਟਕ ਚਲਨ ਤੇ ਗਯੋ ॥੮॥"
page = 195

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On the birth of the enemy like deeraghkaya, even the chariot of the sun hesitated to move.8."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਅਤੇ) ਸੂਰਜ ਦਾ ਰਥ ਚਲਣੋਂ ਰੁਕ ਗਿਆ ॥੮॥"