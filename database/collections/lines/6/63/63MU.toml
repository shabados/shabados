data = "ਤਾਂ ਡਰ ਗਿਆ ਅਤੇ ਕਹਿਣ ਲਗਾ ਕਿ ਹੇ ਭੈੜੇ ਲੱਛਣਾਂ ਵਾਲੀਏ! ॥੧੯॥"