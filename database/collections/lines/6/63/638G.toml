[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਭਈ ਭੋਰ ਫਿਰਿ ਪਕਰ ਮੰਗਾਯੋ ॥"
page = 815

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Raja sent his son to the prison and early next morning called him  back."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਵੇਰ ਹੋਣ ਤੇ ਫਿਰ ਪਕੜ ਕੇ ਮੰਗਵਾ ਲਿਆ।"