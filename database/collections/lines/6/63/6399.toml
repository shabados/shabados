[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੈ ਸਿਮਰਨਿ; ਕਾਲੁ ਪਰਹਰੈ ॥"
page = 262
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By Lord's meditation death is removed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੀ ਬੰਦਗੀ ਦੁਆਰਾ ਮੌਤ ਦੂਰ ਹੋ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Remembering God, death is eliminated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਕੇ ਸਿਮਰਨੇ ਸੇ ਕਾਲ ਭੀ ਤਿਆਗ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੌਤ (ਦਾ ਭਉ) ਪਰੇ ਹਟ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਹਰੈ = (skt. परिहृ to avoid, shun) ਪਰੇ ਹਟ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Meditando en el Señor, el miedo a la muerte desaparece."