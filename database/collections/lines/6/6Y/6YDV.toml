type = "primary"
data = "ਕੋਊ ਨਾਚਿ ਉਠ ਕੋਊ ਗਾਵੈ ॥"
page = 1004

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "A number off airy used to come to him; some sang and some dancedfor him."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਉਠ ਕੇ ਨਚਦੀ ਸੀ ਅਤੇ ਕੋਈ ਗਾਉਂਦੀ ਸੀ।"