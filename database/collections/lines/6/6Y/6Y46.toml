[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਿਮਰਤ ਨਾਮੁ; ਕਿਲਬਿਖ ਸਭਿ ਨਾਸੇ ॥"
page = 1339
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Remembering the Name, all my sins are effaced,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦਾ ਚਿੰਤਨ ਕਰਨ ਦੁਆਰਾ ਮੇਰੇ ਪਾਪ ਮਿਟ ਗਏ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meditating in rememberance on the Naam, all my sins have been erased."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਕੇ ਸਿਮਰਤੀਆਂ ਹੋਇਆਂ ਤਿਨੋਂ ਕੇ ਕਿਲਵਿਖ ਸਭ ਨਾਸ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸਿਮਰਦਿਆਂ ਸਾਰੇ ਪਾਪ ਨਾਸ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਮਰਤ = ਸਿਮਰਦਿਆਂ। ਕਿਲਬਿਖ = ਪਾਪ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Meditando en el Naam, todas mis faltas han sido borradas,"