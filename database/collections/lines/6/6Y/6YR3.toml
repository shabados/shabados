[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਮ ਹਰਿ ਰਾਖੇ; ਗੁਰਸਬਦੁ ਬੀਚਾਰਿਆ ॥੧॥ ਰਹਾਉ ॥"
page = 227
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God has protected me, as I meditated on Guru's Word. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਨੇ ਮੇਰੀ ਰੱਖਿਆ ਕੀਤੀ ਹੈ, ਕਿਉਂ ਜੋ ਮੈਂ ਗੁਰਾਂ ਦੇ ਬਚਨ ਦਾ ਸਿਮਰਨ ਕੀਤਾ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "But I am protected by the Lord; I contemplate the Word of the Guru's Shabad. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ ਕੋ ਗੁਰ ਉਪਦੇਸ਼ ਕੇ ਵੀਚਾਰ ਕਰਨੇ ਕਰ ਹਰੀ ਨੇ ਰਾਖ ਲੀਆ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਆਤਮਕ ਜੀਵਨ ਨੂੰ ਪਰਮਾਤਮਾ ਨੇ ਆਪ ਬਚਾ ਲਿਆ, (ਕਿਉਂਕਿ ਉਸ ਦੀ ਮਿਹਰ ਨਾਲ) ਮੈਂ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਨੂੰ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਵਸਾ ਲਿਆ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਮ = ਮੈਨੂੰ। ਰਾਖੇ = ਆਤਮਕ ਮੌਤ ਤੋਂ ਬਚਾ ਲਿਆ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero yo fui salvado porque habité en la Palabra del Shabd del Guru. (1-Pausa)"