[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇਈ ਮੁਏ; ਜਿਨ ਚਿਤਿ. ਨ ਆਵੈ ॥੧॥"
page = 1287
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that who contemplate not their Lord are like dead."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿ ਜੋ ਆਪਣੇ ਸੁਆਮੀ ਨੂੰ ਨਹੀਂ ਸਿਮਰਦੇ ਉਹ ਮਰ ਜਾਣ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who do not remember the Lord, are dead. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਪੁਰਸ਼ ਮੂਏ ਹੂਏ ਜਾਣੋ ਜਿਨ ਕੋ ਵਾਹਿਗੁਰੂ ਚਿਤ ਨਹੀਂ ਆਵਤਾ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅਸਲ ਵਿਚ) ਆਤਮਕ ਮੌਤੇ ਮਰੇ ਹੋਏ ਉਹੀ ਹਨ ਜਿਨ੍ਹਾਂ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪ੍ਰਭੂ ਨਹੀਂ ਵੱਸਦਾ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "quiénes no recuerdan al Señor están muertos. (1)"