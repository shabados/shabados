[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਖਹੁ ਲੋਗਾ; ਕਲਿ ਕੋ ਭਾਉ ॥"
page = 1194
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "See, O people the influence of the Darkage."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੇਖੋ ਹੇ ਲੋਕੋ! ਕਲਜੁਗ ਦਾ ਪ੍ਰਭਾਵ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Behold, people! This is how it is in the Dark Age of Kali Yuga."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਲੋਗਾ! (ਕਲਿ) ਅਵਿਦ੍ਯਾ ਕਾ (ਭਾਉ) ਪ੍ਰਤਾਪੁ ਦੇਖੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਲੋਕੋ! ਵੇਖੋ, ਕਲਿਜੁਗ ਦਾ ਅਜਬ ਪ੍ਰਭਾਵ ਪੈ ਰਿਹਾ ਹੈ (ਭਾਵ, ਪ੍ਰਭੂ ਤੋਂ ਵਿਛੜਨ ਕਰਕੇ ਜੀਵ ਉੱਤੇ ਅਜਬ ਦਬਾਉ ਪੈ ਰਿਹਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋ = ਦਾ। ਭਾਉ = ਪ੍ਰਭਾਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escucha oh ser humano, las maneras de la era de Kali,"