[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਹਜ ਭਾਇ; ਪਾਇਆ ਹਰਿ ਨਾਮੁ ॥੩॥"
page = 1176
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and I easily obtained the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮੈਨੂੰ ਸੁਖੈਨ ਹੀ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਪ੍ਰਾਪਤ ਹੋ ਗਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and then, I obtained the Lord's Name with intuitive ease. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸਹਜ ਭਾਇ) ਨਿਰਜਤਨ ਹੀ ਹਰੀ ਕਾ ਨਾਮੁ ਤਿਨੋਂ ਨੇ ਪਾਇ ਲੀਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਆਤਮਕ ਅਡੋਲਤਾ ਦੇਣ ਵਾਲੇ ਪ੍ਰੇਮ ਵਿਚ ਟਿਕ ਕੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਪ੍ਰਾਪਤ ਕਰ ਲਿਆ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਹਜ = ਆਤਮਕ ਅਡੋਲਤਾ। ਭਾਇ = ਪ੍ਰੇਮ ਵਿਚ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre del Señor de manera espontánea. (3)"