[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਨਾਵੈ ਨੋ ਲੋਚਦੀ; ਜਿਸੁ ਕ੍ਰਿਪਾ ਕਰੇ ਸੋ ਪਾਏ ॥"
page = 427
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All people long for the Name, but he alone receives it to whom the Lord shows favour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਨਾਮ ਦੀ ਤਾਂਘ ਰਖਦੇ ਹਨ, ਪਰ ਕੇਵਲ ਓਹੀ ਇਸ ਨੂੰ ਪਾਉਂਦਾ ਹੈ, ਜਿਸ ਤੇ ਸਾਈਂ ਮਿਹਰ ਧਾਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Everyone longs for the Name, but he alone receives it, unto whom the Lord shows His Mercy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਸ੍ਰਿਸਟੀ ਨਾਮ ਕੋ ਚਾਹਤੀ ਹੈਂ, ਪਰੰਤੂ ਜਿਸ ਕੋ ਤੂੰ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਦੇਤਾ ਹੈਂ ਸੋਈ ਨਾਮ ਪਦਾਰਥ ਪਾਉਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੀ ਲੁਕਾਈ ਹਰਿ-ਨਾਮ ਵਾਸਤੇ ਤਾਂਘ ਕਰਦੀ ਹੈ, ਪਰ ਉਹੀ ਮਨੁੱਖ ਹਰਿ-ਨਾਮ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ ਜਿਸ ਉਤੇ ਪ੍ਰਭੂ ਆਪ ਮੇਹਰ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਵੈ ਨੋ = ਹਰਿ-ਨਾਮ ਨੂੰ। ਸੋ = ਉਹ ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos añoran el Naam, el Nombre del Señor, pero sólo el que tiene la Gracia Especial, Lo recibe."