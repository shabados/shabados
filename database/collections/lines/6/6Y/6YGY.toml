[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸਹਜਿ ਨਿਵਾਸੁ, ਮਨ ਹਠ ਮਾਰਿਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Eschewing stubbornness of mind, gurmukhs reside in equipoise."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖਾਂ ਦਾ ਨਿਵਾਸ ਸਹਿਜ ਵਿੱਚ ਹੋਵੇਗਾ (ਕਿਸੇ ਬਾਤ ਵਿਚ) ਹਠ ਮਨ ਵਿਚ ਨਹੀਂ ਧਾਰਨਗੇ।"