[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਤ ਕਤ ਪੇਖਉ; ਤੇਰੀ ਸਰਣਾ ॥"
page = 1149
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Master, wherever I am, I look up to Thy protection,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਕਿਤੇ ਭੀ ਮੈਂ ਹੁੰਦਾ ਹਾਂ, ਮੈਂ ਤੇਰੀ ਪਨਾਹ ਤਕਾਉਂਦਾ ਹਾਂ, ਹੈ ਮੇਰੇ ਮਾਲਕ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Wherever I look, is the Protection of Your Sanctuary."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਜਹਾਂ ਕਹਾਂ (ਤੇਰੀ) ਤਿਸ ਕੀ ਸਰਣ ਕੋ ਦੇਖਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਮੈਂ ਹਰ ਥਾਂ ਤੇਰਾ ਹੀ ਆਸਰਾ ਤੱਕਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਤ ਕਤ = ਜਿੱਥੇ ਕਿੱਥੇ, ਹਰ ਥਾਂ। ਪੇਖਉ = ਪੇਖਉਂ, ਮੈਂ ਵੇਖਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Dios, donde sea que estoy, busco Tu Santuario."