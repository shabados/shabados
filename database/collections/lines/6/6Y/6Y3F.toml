[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋਤ ਉਦੋਤ ਫਿਰੰਗ ਪਠਾਵੈ ॥"
page = 1004

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The same way, he would get her every night and then return her toFarangh Shah."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸਵੇਰ ਹੋਣ ਤੇ ਫਿਰੰਗ (ਸ਼ਾਹ) ਕੋਲ ਭੇਜ ਦਿੰਦਾ।"