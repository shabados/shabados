[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਬਾ; ਮਾਇਆ ਮੋਹ ਹਿਤੁ ਕੀਨੑ ॥"
page = 482
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Father, I have enshrined love and affection for mammon,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਿਤਾ! ਮੈਂ ਧਨ ਦੌਲਤ ਲਈ ਪਿਆਰ ਤੇ ਮੁਹੱਬਤ ਧਾਰਨ ਕਰ ਲਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Father, I have enshrined love and affection for Maya,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਮੋਹ ਸੇ ਜੀਵ ਨੇ ਮਾਇਆ ਕੇ ਵਿਖੇ ਹਿਤ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਬਾਬਾ! ਅਸਾਂ ਮਾਇਆ ਨਾਲ ਮੋਹ-ਪਿਆਰ ਪਾਇਆ ਹੋਇਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਿਤੁ = ਪਿਆਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh amigo, me he agraciado con Maya,"