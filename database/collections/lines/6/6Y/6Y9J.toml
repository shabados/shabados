[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਰੋਗ ਤੇ; ਓਹੁ ਹਰਿ ਜਨੁ ਰਹਤ ॥"
page = 281
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "gets exempt from all the ailments."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰੀਆਂ ਬੀਮਾਰੀਆਂ ਤੋਂ ਖਲਾਸੀ ਪਾ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Such a devotee of the Lord is free of all disease."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਹਰੀ ਕਾ ਜਨੁ ਸਰਬ ਰੋਗੋਂ ਸੇ ਰਹਤ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰੇ ਰੋਗਾਂ ਤੋਂ ਬਚ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ ਜਨੁ = ਪ੍ਰਭੂ ਦਾ ਸੇਵਕ। ਸਰਬ ਰੋਗ ਤੇ ਰਹਤ = ਸਾਰੇ ਰੋਗਾਂ ਤੋਂ ਬਚਿਆ ਹੋਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ese devoto del Señor  alcanza la Liberación."