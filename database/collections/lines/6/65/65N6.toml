[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਨਹੀ ਚੀਨਸਿ; ਆਤਮ ਰਾਮ ॥੧॥ ਰਹਾਉ ॥"
page = 324
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "when he remembers not the Pervading Lord in his mind. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਉਹ ਆਪਣੇ ਮਨ ਅੰਦਰ ਵਿਆਪਕ ਸੁਆਮੀ ਨੂੰ ਯਾਦ ਨਹੀਂ ਕਰਦਾ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "if he does not remember the Lord within his soul? ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਤਕ ਆਪ ਕੋ ਰਮਣ ਰੂਪ ਨਹੀਂ ਚੀਨਤਾ ਅਰਥਾਤ ਬ੍ਰਹਮ ਰੂਪ ਨਹੀਂ ਜਾਨਿਆ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦ ਤਕ ਤੂੰ ਪਰਮਾਤਮਾ ਨੂੰ ਨਹੀਂ ਪਛਾਣਦਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਹੀ ਚੀਨਸਿ = ਤੂੰ ਨਹੀਂ ਪਛਾਣ ਕਰਦਾ। ਆਤਮ ਰਾਮ = ਪਰਮਾਤਮਾ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si uno no contempla al Todo Prevaleciente Señor?  (1-Pausa)"