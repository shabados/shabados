data = "ਸਭ ਸ੍ਰੀ ਨਾਮ ਤੁਪਕ ਕੇ ਜਾਨਹੁ ॥੧੦੩੬॥"
page = 782

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Tapatni”, and the words “Satchar-nayak-shatru” nd know the names of Tupak.1036."

