[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੇ ਮੈ ਗੁਣ ਨਾਹੀ; ਹਉ ਕਿਆ ਕਰੀ. ਦੁਹਾਗਣਿ ॥੩॥"
page = 561
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Those virtues I possess not; What should I, the discarded one, then do?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਖੂਬੀਆਂ ਮੇਰੇ ਵਿੱਚ ਨਹੀਂ, (ਤਦ) ਮੈਂ ਛੁੱਟੜ ਇਸਤ੍ਰੀ ਕੀ ਕਰਾਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I don't have these virtues; what can I, the discarded bride, do? ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "(ਸੇ) ਉਨ ਸੁਹਾਗਣੋਂ ਵਾਲੇ ਗੁਣ ਮੇਰੇ ਮੇਂ ਨਹੀਂ ਹੈਂ, ਤਾਂ ਤੇ ਮੈਂ (ਦੁਹਾਗਣਿ) ਛੁਟੜ ਕਿਆ ਕਰਾਂਗੀ ਅਰਥਾਤ ਆਤਮ ਅਨੰਦ ਕੋ ਕੈਸੇ ਭੋਗਾਂਗੀ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਸੁਹਾਗਣ ਵਾਲੇ ਗੁਣ ਮੇਰੇ ਅੰਦਰ ਨਹੀਂ ਹਨ, ਮੈਂ ਛੁੱਟੜ (ਪ੍ਰਭੂ-ਪਤੀ ਨੂੰ ਮਿਲਣ ਲਈ) ਕੀਹ ਕਰ ਸਕਦੀ ਹਾਂ? ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰੀ = ਕਰੀਂ, ਮੈਂ ਕਰਾਂ। ਦੁਹਾਗਣਿ = ਮੰਦੇ ਭਾਗਾਂ ਵਾਲੀ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿qué podré hacer siendo un desertor? (3)"