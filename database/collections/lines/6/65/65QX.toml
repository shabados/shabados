[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨ ਸਰਸੁ. ਕੀਅਉ ਨ ਜਗਤ ਕੋਈ ॥"
page = 1405
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He has no created another in this world, equal to Himself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਬਰਾਬਰ ਦਾ ਉਸਨੇ ਹੋਰ ਕੋਈ ਇਸ ਜਗ ਵਿੱਚ ਨਹੀਂ ਰਚਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "in all the world, He has not created another like Himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਅਪਨੇ ਸਦਰਸ ਜਗਤ ਮੇਂ ਕੋਈ ਨਹੀਂ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਦਾ ਕੋਈ ਦੂਜਾ ਜੀਵ (ਜਿਸ ਨੇ) ਆਪਣੇ ਵਰਗਾ ਪੈਦਾ ਨਹੀਂ ਕੀਤਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਸੁ = ਸਦਰਸ਼, ਵਰਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en el mundo entero no ha creado a nadie como Él,"