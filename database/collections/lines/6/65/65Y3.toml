[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਲ ਜੰਤ ਪਰਤ੍ਰਿਨ ਪਤ੍ਰ ਦਹੇ ॥੩੬੨॥"
page = 236

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Even there the leaves of lotus could not survive and the creatures of water, grass, leaves etc. all were reduced to ashes with the geat of the state of separation of Ram.362."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਲ-ਜੀਵ ਅਤੇ ਪੰਛੀਆਂ ਦੇ ਖੰਭ ਵੀ ਸੜ ਗਏ ॥੩੬੨॥"