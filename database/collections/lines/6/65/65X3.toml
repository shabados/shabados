data = "ਬਿਜ਼ਦ ਸੀਨਹ ਖ਼ੁਦ ਹਰਦੋ ਦਸਤਾ ਅਜ਼ੋ ॥੩੮॥"
page = 1411

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘And I took both his hands on them.(38)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਆਪਣੇ ਦੋਵੇਂ ਹੱਥ ਛਾਤੀ ਉਤੇ ਰਖ ਲਏ ॥੩੮॥"