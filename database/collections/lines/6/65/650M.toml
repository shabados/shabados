data = "ਬੈਰੀ ਅਧਿਕ ਆਪਨੇ ਜੀਤੇ ॥"
page = 883

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Years passed by thus, and she won over many enemies."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਆਪਣੇ ਬਹੁਤ ਸਾਰੇ ਵੈਰੀਆਂ ਨੂੰ ਜਿਤ ਲਿਆ।"