[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਟਿ ਘਟਿ; ਮਨਸਾ ਦੁਬਿਧਾ ਲਾਗੀ ॥"
page = 415
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To every soul, desire and duality are attached."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਰ ਆਤਮਾ ਨੂੰ ਖਾਹਿਸ਼ ਅਤੇ ਦਵੈਤ ਭਾਵ ਚਿਮੜੀਆਂ ਹੋਈਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Desire and duality afflict each and every heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਿਨਾਂ ਬੈਰਾਗ (ਦੁਬਿਧਾ) ਦ੍ਵੈਤ ਭਾਵਨਾ ਅਰ ਵਾਸਨਾ ਸਭ ਕੇ ਅੰਤਸਕਰਣ ਮੇਂ ਲਗ ਰਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਦੇ ਹਰੇਕ ਸਰੀਰ ਵਿਚ (ਮਾਇਆ-ਵੇੜ੍ਹੇ ਮਨ ਨੂੰ) ਮਾਇਕ ਫੁਰਨਾ ਤੇ ਦੁਬਿਧਾ ਆ ਚੰਬੜਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਟਿ ਘਟਿ = ਹਰੇਕ ਘਟ ਵਿਚ। ਮਨਸਾ = ਮਾਇਕ ਫੁਰਨਾ। ਦੁਬਿਧਾ = ਦੁਚਿੱਤਾ-ਪਨ, ਭਟਕਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en otro, renuncia a sus personalidades y a sus egos."