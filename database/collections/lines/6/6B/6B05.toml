[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਜੁਗਤਿ; ਨਹੀ ਪਾਇਆ ॥"
page = 210
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By various devices I could find Thee not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕਾਂ ਢੰਗਾਂ ਦੁਆਰਾ ਮੈਂ ਤੈਨੂੰ ਪ੍ਰਾਪਤ ਨ ਕਰ ਸਕਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By various devices, I could not find You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੇਕ ਦ੍ਰਿਸਟਾਂਤੋਂ ਕਰ ਨਹੀਂ ਪਾਯਾ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! (ਹੋਰ ਹੋਰ) ਅਨੇਕਾਂ ਢੰਗਾਂ ਨਾਲ ਮੈਂ ਤੈਨੂੰ ਨਹੀਂ ਲੱਭ ਸਕਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੁਗਤਿ = ਢੰਗ, ਤਰੀਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Traté de muchas formas, pero no Te encontré,"