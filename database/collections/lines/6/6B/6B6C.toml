[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮਤੀ ਹਰਿ ਪਾਇਆ; ਮਾਇਆ ਮੋਹ ਪਰਜਾਲਿ ॥"
page = 1418
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Burning off the love of riches, I have attained my God, through the Guru's instruction."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨ-ਦੌਲਤ ਦੀ ਮਮਤਾ ਨੂੰ ਸਾੜ ਕੇ ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਰਾਹੀਂ ਮੈਂ ਆਪਦੇ ਵਾਹਿਗੁਰੂ ਨੂੰ ਪਾ ਲਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Following the Guru's Teachings, I have found the Lord; my emotional attachment to Maya has been burnt away."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮਤੀਓਂ ਨੇ ਮਾਯਾ ਕੇ ਮੋਹ ਕੋ (ਪਰਜਾਲਿ) ਵਿਸ਼ੇਸ਼ ਕਰ ਜਲਾਇ ਕਰ ਹਰੀ ਕੋ ਪਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਗੁਰੂ ਦੀ ਮੱਤ ਤੁਰ ਕੇ (ਅੰਦਰੋਂ) ਮਾਇਆ ਦਾ ਮੋਹ ਚੰਗੀ ਤਰ੍ਹਾਂ ਸਾੜ ਕੇ (ਹੀ, ਕਿਸੇ ਭਾਗਾਂ ਵਾਲੇ ਨੇ ਅੰਦਰ-ਵੱਸਦਾ) ਪਰਮਾਤਮਾ ਲੱਭਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਰਜਾਲਿ = ਚੰਗੀ ਤਰ੍ਹਾਂ ਸਾੜ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Siguiendo las Enseñanzas del Guru, he encontrado al Señor y mis apegos emocionales a Maya han sido sofocados."