[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰੁ ਸੇਵੇ; ਤਾ ਸਭ ਕਿਛੁ ਪਾਏ ॥"
page = 116
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If man serves the Sat Guru he then receives everything."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਬੰਦਾ ਸਤਿਗੁਰਾਂ ਦੀ ਘਾਲ ਕਮਾਵੇ ਤਦ ਸਾਰਾ ਕੁਝ ਮਿਲ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serving the True Guru, all things are obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸਤਗੁਰੋਂ ਕੀ ਸੇਵਾ ਕਰੇ ਤਬ ਜੀਵ ਸਭ ਕੁਛ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਮਨੁੱਖ ਗੁਰੂ ਦਾ ਪੱਲਾ ਫੜੇ ਤਾਂ ਉਹ ਹਰੇਕ ਚੀਜ਼ ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭ ਕਿਛੁ = ਹਰੇਕ ਚੀਜ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que sirve al Guru obtiene todo lo que añora;"