data = "ਜਨੁ ਸਰਬ ਸੋਭ ਕਹੁ ਲੀਲ ਲੀਸੁ ॥੪੧॥"
page = 630

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Leaving him, absorbing all the glory within herself, she moved further.41."

