type = "primary"
data = "ਤ੍ਰਿਪਤ ਸਕਲ ਦਿਜ ਕੀਏ ਰਿਝਾਏ ॥"
page = 152

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Who satisfied all the incoming Brahmin."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਸਨੌਢੀਏ) ਬ੍ਰਾਹਮਣ ਨੇ ਸਾਰਿਆਂ ਨੂੰ ਚੰਗੀ ਤਰ੍ਹਾਂ ਰਜਾ ਕੇ ਤ੍ਰਿਪਤ ਕੀਤਾ।"