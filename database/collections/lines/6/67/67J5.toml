[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਘਟਾ ਕੇ ਅੰਤਰਜਾਮੀ ॥"
page = 1079
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is the knower of all the hearts,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰਿਆਂ ਦਿਲਾਂ ਦੀਆਂ ਜਾਣਨਹਾਰ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Inner-knower, the Searcher of all hearts."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਪੂਰਨ ਘਟਾਂ ਕੇ ਅੰਤਰ ਹੋਇਕੇ ਪ੍ਰੇਰ ਰਹਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਭ ਦੇ ਦਿਲਾਂ ਦੀ ਜਾਣਨ ਵਾਲੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਟ = ਹਿਰਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, eres el Conocedor Íntimo de los corazones y a quien sea que traes a Tu Devoción,"