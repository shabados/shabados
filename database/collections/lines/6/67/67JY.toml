[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਥਿਆ ਜਿਹਬਾ; ਅਵਰੇਂ ਕਾਮ ॥"
page = 1163
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "False, O my tongue, are other occupations."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੂੜੇ ਹਨ ਹੇ ਮੇਰੀ ਜੀਭੇ ਹੋਰ ਕਾਰਵਿਹਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my tongue, other occupations are false."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਹੁ ਜਿਹਵਾ (ਮਿਥਿਆ) ਬ੍ਯਰਥ ਹੈ, ਜੋ ਔਰ ਕਾਮ ਮੇਂ ਲਗੀ ਹੂਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੋਰ ਹੋਰ ਆਹਰਾਂ ਵਿਚ ਲੱਗੀ ਹੋਈ ਜੀਭ ਵਿਅਰਥ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਿਥਿਆ = ਵਿਅਰਥ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh labios míos, todo lo demás es sólo ilusión."