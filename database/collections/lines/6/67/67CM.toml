[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨ ਕੀ ਲੇਖੈ ਪਤਿ ਪਵੈ; ਚੰਗੇ ਸੇਈ ਕੇਇ ॥੩॥"
page = 469
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "A few, whose honour is of account, they are good."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਿਰਲੇ ਹੀ, ਜਿਨ੍ਹਾਂ ਦੀ ਇਜਤ ਆਬਰੂ ਗਿਣਤੀ ਵਿੱਚ ਪੈਂਦੀ ਹੈ, (ਪਰਵਾਨ ਪੈਂਦੀ ਹੈ) ਭਲੇ ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those few, whose honor is confirmed, are good. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਕੋਈ ਅਛੇ ਹੋਇਂਗੇ ਜਿਨ ਕੀ ਪਤਿਸ਼ਟਾ ਵਹਾਂ ਲੇਖੇ ਮੇਂ ਪੜੇਗੀ ਅਰਥਾਤ ਪ੍ਰਮਾਣ ਹੋਵੈਗੀ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਓਥੇ ਉਹੋ ਕੋਈ ਕੋਈ ਮਨੁੱਖ ਭਲੇ ਗਿਣੇ ਜਾਂਦੇ ਹਨ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਕਰਮਾਂ ਦਾ ਲੇਖਾ ਹੋਣ ਵੇਲੇ ਆਦਰ ਮਿਲਦਾ ਹੈ (ਭਾਵ ਜਿਨ੍ਹਾਂ ਨੇ ਜਗਤ ਵਿਚ ਭਲੇ ਕੰਮ ਕੀਤੇ ਹੋਏ ਸਨ, ਤੇ ਇਸ ਕਰਕੇ ਉਹਨਾਂ ਨੂੰ ਰੱਬ ਦੇ ਦਰ ਤੇ ਆਦਰ ਮਿਲਦਾ ਹੈ) ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਈ ਕੇਇ = ਉਹੀ ਕੋਈ ਕੋਈ (ਜੀਵ)। ਲੇਖੈ = ਲੇਖਾ ਹੋਣ ਵੇਲੇ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Solamente aquéllos cuyo honor está considerado en las cuentas del Señor, son gente honorable. (3)"