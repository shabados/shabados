[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਲੇ ਬੈਠ ਕੈ ਸੂਰਬੀਰੰ ਬਿਮਾਣੰ ॥"
page = 242

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Queer type of arrows, making beautiful paintings, are moving fastly while piercing the bodies and alongwith it the warriors are flying away in the air-vehicles of death."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਸੂਰਵੀਰ ਬਿਮਾਨਾਂ ਵਿੱਚ ਚੜ੍ਹ ਕੇ ਸੁਅਰਗ ਨੂੰ ਚਲੇ ਜਾ ਰਹੇ ਹਨ।"