data = "ਅਨਛੇਦਾਭੇਦਾ ਉਧਾਰੀ ॥"
page = 679

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "You are indestructible, the destroyer of all and the redeemer of all"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਾ ਛੇਦੇ ਜਾ ਸਕਣ ਵਾਲੀ, ਨਾ ਭੇਦੇ ਜਾ ਸਕਣ ਵਾਲੀ, ਉੱਧਾਰ ਕਰਨ ਵਾਲੀ,"