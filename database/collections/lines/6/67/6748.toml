[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਨੁ ਉਤਾਰਿਯੋ ਕ੍ਰਿਸਨ ਪ੍ਰਤਿ; ਬੋਲਿਓ ਕੋਪ ਹਕਾਰਿ ॥੧੨੮੨॥"
page = 425

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He spoke egoistically with Krishna.1282."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕ੍ਰਿਸ਼ਨ ਪ੍ਰਤਿ ਆਪਣਾ ਅਭਿਮਾਨ ਉਤਾਰਦਿਆਂ ਕ੍ਰੋਧ ਨਾਲ ਕਹਿਣ ਲਗਾ ॥੧੨੮੨॥"