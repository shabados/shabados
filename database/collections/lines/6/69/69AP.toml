[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਮਤਕਾਰ ਤੋ ਕੌ ਤੁਰਤੁ; ਪ੍ਰਥਮੈ ਦੇਊ ਦਿਖਾਇ ॥"
page = 996

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘First I will show you Shiva’s miracle,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਮੈਂ) ਤੁਹਾਨੂੰ ਪਹਿਲਾਂ (ਉਸ ਦਾ) ਚਮਤਕਾਰ ਤੁਰਤ ਵਿਖਾਉਂਦੀ ਹਾਂ।"