[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਾਥਾ ਅਨੰਤ ਉਪਮਾ ਅਗਾਤ ॥"
page = 139

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "It is difficult to describe the king of three ages, their story is endless and the Praise indescribable."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ ਉਨ੍ਹਾਂ ਦੀ) ਕਥਾ ਅਮੁਕ ਹੈ ਅਤੇ ਉਪਮਾ ਕਥਨ ਤੋਂ ਪਰੇ ਹੈ ('ਅਗਾਤ')"