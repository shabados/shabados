data = "ਦੁਹੂੰਅਨਿ ਕੌ ਗੋਡਨ ਸੌ ਮਰਿ ਹੈ ॥੬॥"
page = 1011

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘He will fling me as well, and then will trod over with his knees.(6)"

