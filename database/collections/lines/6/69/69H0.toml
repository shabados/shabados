[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋਗੀ ਜਤੀ ਪੰਡਿਤ ਬੀਚਾਰੀ ॥"
page = 1004
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Some are Yogis, celibates, scholars and thinkers."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਈ ਯੋਗੀ, ਬ੍ਰਹਮਚਾਰੀ, ਵਿਦਵਾਨ ਅਤੇ ਵੀਚਾਰਵਾਨ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Some are Yogis, celibates, religious scholars and thinkers."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋਗੀ ਜਤੀ ਔ ਪੰਡਤ ਜੋ ਬਿਚਾਰਮਾਨ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਈ ਜੋਗੀ ਹਨ ਜਤੀ ਹਨ ਸਿਆਣੇ ਪੰਡਿਤ ਹਨ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੀਚਾਰੀ = ਵਿਚਾਰਵਾਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "algunos son Yoguis, célibes, escolares religiosos o pensadores,"