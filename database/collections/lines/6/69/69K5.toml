type = "primary"
data = "ਤੁਹੀ ਰਾਜਸੀ ਸਾਤਕੀ ਤਾਮਸੀ ਹੈ ॥"
page = 336

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art Rajas, tamas and Sattva, the three modes of maya"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੀ ਰਾਜਸੀ, ਸਾਤਵਿਕੀ ਅਤੇ ਤਾਮਸੀ ਸ਼ਕਤੀ ਹੈਂ।"