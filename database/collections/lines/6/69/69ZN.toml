[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਭਗਤ. ਹੈ ਸਦਾ ਸੁਖਾਲੇ ॥੪॥੪॥੧੨॥"
page = 1160
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Ever in bliss are the Lord's saints."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਮੇਸ਼ਾਂ ਖੁਸ਼ੀ ਅੰਦਰ ਵਸਦੇ ਹਨ ਸੁਆਮੀ ਦੇ ਸੰਤ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord's devotees are forever in bliss. ||4||4||12||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਮ ਕੇ ਭਗਤ ਸਦੀਵ ਸੁਖਾਲੇ ਹੈਂ॥੪॥੪॥੧੨॥☬ਮਾਇਆ ਕੀ ਪ੍ਰਬਲਤਾ ਦਿਖਾਵਤੇ ਹੂਏ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ ਸੁਖੀ ਜੀਵਨ ਵਾਲੇ ਸਿਰਫ਼ ਉਹੀ ਹਨ ਜੋ ਪ੍ਰਭੂ ਦੇ ਭਗਤ ਹਨ' ॥੪॥੪॥੧੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero los Devotos de Dios se conservan para siempre en Éxtasis. (4-4-12)"