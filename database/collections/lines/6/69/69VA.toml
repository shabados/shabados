[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਕਬੀਰ. ਜੇ ਕਿਰਪਾ ਧਾਰੈ; ਦੇਇ ਸਚਾ ਨੀਸਾਨਾ ॥੪॥੭॥"
page = 477
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Kabir God shows mercy, He gives man a true mark."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਜੀ ਆਖਦੇ ਹਨ, ਜੇਕਰ ਵਾਹਿਗੁਰੂ ਮਿਹਰ ਕਰੇ, ਉਹ ਬੰਦੇ ਨੂੰ ਸੱਚਾ ਚਿੰਨ੍ਹ ਬਖਸ਼ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Kabeer, if God grants His Grace, He bestows the insignia of Truth. ||4||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਕਬੀਰ ਜੀ ਕਹਤੇ ਹੈਂ: ਜੌ ਰਾਮ ਕ੍ਰਿਪਾ ਧਾਰਨ ਕਰੈ ਤੋ ਨਾਮ ਰੂਪੀ ਸਚਾ (ਨੀਸਾਨਾ) ਪਰਵਾਨਾ ਦੇਤਾ ਹੈ॥੪॥੭॥☬ਕਾਜੀ ਨੇ ਗੁਸਾਈਂ ਕਬੀਰ ਜੀ ਸੇ ਕਹਾ: ਆਪ ਸ਼ਰਾ ਅਨੁਸਾਰ ਚਲਾ ਕਰੋ ਅੋਰ ਰੋਜਾ ਨਮਾਜ ਕੁਰਾਨ ਪਢਾ ਕਰੋ। ਤਿਸ ਪ੍ਰਤਿ ਕਹਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਬੀਰ ਆਖਦਾ ਹੈ- ਜੇ ਪ੍ਰਭੂ ਆਪ ਮਿਹਰ ਕਰੇ ਤਾਂ ਉਹ ਇਹ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਨੂਰ ਬਖ਼ਸ਼ਦਾ ਹੈ ॥੪॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਇ = ਦੇਂਦਾ ਹੈ। ਸਚਾ = ਸਦਾ ਟਿਕਿਆ ਰਹਿਣ ਵਾਲਾ। ਨੀਸਾਨਾ = ਨਿਸ਼ਾਨ, ਮੱਥੇ ਉੱਤੇ ਨੂਰ ॥੪॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, si el Señor me muestra Misericordia, me bendice con la insignia de la Verdad. (4‑7)"