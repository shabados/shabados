[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪ੍ਰਥਮ ਅਤ੍ਰ ਰਿਖਿ ਭਏ; ਬਰੀ ਅਨਸੂਆ ਜਿਨਹੂੰ ॥"
page = 1006

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "(Rani:)‘First, there has been a sage called Attar, who married Ansua."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਪਹਿਲਾਂ ਅਤ੍ਰਿ ਰਿਸ਼ੀ ਹੋਇਆ ਜਿਸ ਨੇ ਅਨਸੂਆ ਨਾਲ ਵਿਆਹ ਕੀਤਾ।"