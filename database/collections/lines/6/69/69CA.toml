[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭਏ ਅਚਿੰਤ; ਏਕ ਲਿਵ ਲਾਇਆ ॥੩॥"
page = 396
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have become care free and have fixed my attention on one God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਬੇਫਿਕਰ ਹੋ ਗਿਆ ਹਾਂ, ਅਤੇ ਮੈਂ ਆਪਣੀ ਬਿਰਤੀ ਇਕ ਵਾਹਿਗੁਰੂ ਵਿੱਚ ਜੋੜ ਲਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have become carefree, and I fix my attention on the One Lord. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਬ ਹਮ ਨੇ ਨਿਸਚਿੰਤ ਹੋ ਕਰ ਏਕ ਹਰੀ ਮੇਂ ਬ੍ਰਿਤੀ ਕੋ ਲਗਾਇਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜੇ ਵਡ-ਭਾਗੀ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਦੀ ਬਰਕਤਿ ਨਾਲ) ਇਕ ਪਰਮਾਤਮਾ ਵਿਚ ਸੁਰਤਿ ਜੋੜਦੇ ਹਨ ਉਹ ਚਿੰਤਾ ਤੋਂ ਰਹਿਤ ਹੋ ਜਾਂਦੇ ਹਨ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਚਿੰਤ = ਬੇ-ਫ਼ਿਕਰ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y encontrándome sin preocupaciones, me entoné en el Señor. (3)"