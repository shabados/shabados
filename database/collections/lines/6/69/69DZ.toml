[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਨਤ ਕਹਤ; ਰਹਤ ਗਤਿ ਪਾਵਹੁ ॥"
page = 289
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By hearing, uttering and abiding by it, thou shalt obtain emancipation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਣਨ, ਆਖਣ ਅਤੇ ਇਸ ਅਨੁਸਾਰ ਰਹਿਣ ਦੁਆਰਾ ਤੂੰ ਮੁਕਤੀ ਪਾ ਲਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Hearing, speaking and living it, emancipation is obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਨਾਮ ਕੇ ਕਹਤੇ ਹੂਏ ਧਾਰਨਾ ਮੇਂ ਰਹਤੇ ਹੂਏ ਤੁਮ ਮੋਖ ਕੋ ਪਾਵੋਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਮ) ਸੁਣਦਿਆਂ, ਉੱਚਾਰਦਿਆਂ ਤੇ ਨਿਰਮਲ ਰਹਿਣੀ ਰਹਿੰਦਿਆਂ ਉੱਚੀ ਅਵਸਥਾ ਬਣ ਜਾਏਗੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਨਤ = ਸੁਣਦਿਆਂ। ਰਹਤ = ਰਹਿੰਦਿਆਂ, ਭਾਵ ਉੱਤਮ ਜ਼ਿੰਦਗੀ ਬਣਾ ਕੇ। ਗਤਿ = ਉੱਚੀ ਅਵਸਥਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y tome Conciencia de Él, será liberado."