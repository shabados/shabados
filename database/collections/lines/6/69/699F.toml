type = "primary"
data = "ਛਟਈ ਦੇਗ ਪਿਯਾਦਨ ਲੀਨੀ ॥"
page = 999

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She gave fifth cauldron to the servants and sixth one to the footmen."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਛੇਵੀਂ ਦੇਗ ਪਿਆਦਿਆਂ (ਸਿਪਾਹੀਆਂ) ਨੇ ਲਈ।"