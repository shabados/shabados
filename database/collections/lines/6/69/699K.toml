[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਘਰੁ; ਦਯਿ ਵਸਾਇਆ ॥"
page = 625
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "that house the Lord causes to flourish."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਧਾਮ (ਘਰ) ਨੂੰ ਪ੍ਰਭੂ ਪ੍ਰਫੁਲੱਤ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In which He comes to mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਘਰ ਪ੍ਰੇਰਕ ਪਰਮੇਸਰ ਨੇ ਵਸਾਇਆ ਹੈ, ਭਾਵ ਸੇ ਸੋ ਰਿਦਾ ਸੁਭ ਗੁਣੋਂ ਸਹਤ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੀਤਮ-ਪ੍ਰਭੂ ਨੇ ਉਹ ਹਿਰਦਾ-ਘਰ (ਆਤਮਕ ਗੁਣਾਂ ਨਾਲ) ਭਰਪੂਰ ਕਰ ਦਿੱਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੋ ਘਰੁ = ਉਹ ਹਿਰਦਾ-ਘਰ। ਦਯਿ = ਪਿਆਰ ਕਰਨ ਵਾਲੇ ਪ੍ਰਭੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en donde alabo al Señor en mi mente."