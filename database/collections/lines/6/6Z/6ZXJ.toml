data = "Somewhere Thou art the learning about lyre, somewhere about singing song!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਿਤੇ (ਤੁਸੀਂ) ਵੀਣਾ ਵਜਾਉਣ ਦੀ ਵਿਦਿਆ ਹੋ ਅਤੇ ਕਿਤੇ ਸੰਗੀਤ ਦੀ ਵਿਦਿਆ ਹੋ।"