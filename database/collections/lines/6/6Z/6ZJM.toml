[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਪ੍ਰਭੁ ਰਾਖੈ; ਤਿਵ ਹੀ ਰਹੈ ॥"
page = 277
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the Lord keeps him, so does he remains."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਸੁਆਮੀ ਉਸ ਨੂੰ ਰੱਖਦਾ ਹੈ, ਉਸੇ ਤਰ੍ਹਾਂ ਹੀ ਉਹ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As God keeps them, so they remain."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪ੍ਰਕਾਰ ਇਸ ਜੀਵ ਕੌ ਪ੍ਰਭੂ ਰਾਖਤਾ ਹੈ, ਤਿਸੀ ਪ੍ਰਕਾਰ ਇਹ ਰਹਿਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੀਵ ਉਸੇ ਤਰ੍ਹਾਂ ਜੀਵਨ ਬਿਤੀਤ ਕਰਦਾ ਹੈ ਜਿਵੇਂ ਪ੍ਰਭੂ ਕਰਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El hombre es en verdad moldeado por la Voluntad de su Creador."