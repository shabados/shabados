[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭੁ ਪਾਇਆ ਸੁਖਦਾਈਆ; ਮਿਲਿਆ ਸੁਖ ਭਾਇ ॥"
page = 808
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He attains to his peace-giving Lord and automatically meets with Him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਆਪਣੇ ਆਰਾਮ ਦੇਣਦਾਰ ਸਾਹਿਬ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹੈ ਅਤੇ ਸੁਭਾਵਕ ਹੀ ਉਸ ਦੇ ਨਾਲ ਮਿਲ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He finds God, the Giver of peace, with feelings of joy."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਖਦਾਯਕ ਪ੍ਰਭੂ! ਜਿਨ ਕੋ ਸੁਖੈਨ ਪੂਰਾ ਸਤਿਗੁਰੂ ਆਨ ਮਿਲਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਮਨੁੱਖ ਨੇ (ਸਾਰੇ) ਸੁਖ ਦੇਣ ਵਾਲਾ ਪਰਮਾਤਮਾ ਲੱਭ ਲਿਆ, ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਆਤਮਕ ਆਨੰਦ ਅਤੇ ਪ੍ਰੇਮ ਵਿਚ ਟਿਕ ਕੇ ਪ੍ਰਭੂ ਮਿਲ ਪਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਖਦਾਈਆ = ਸੁਖ ਦੇਣ ਵਾਲਾ। ਸੁਖ ਭਾਇ = ਸੁਖ ਦੇ ਭਾਵ ਨਾਲ, ਆਤਮਕ ਆਨੰਦ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Obtiene entonces, y de forma espontánea, a su Señor, Dador de Éxtasis,"