[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਤਿਆਗਹੁ; ਭਾਉ ਦੂਜੇਰੈ ॥"
page = 1304
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and be delivered of the love of all others."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਹੋਰ ਸਾਰਿਆਂ ਦੇ ਪਿਆਰ ਤੋਂ ਖਲਾਸੀ ਪਾ ਜਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Abandon the love of everything else."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦ੍ਵੈਤ ਭਾਵ ਤ੍ਯਾਗ ਦੇਹੁ॥☬ਐਸੇ ਬੇਨਤੀ ਕਰੁ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਤੋਂ ਬਿਨਾ) ਹੋਰ ਹੋਰ ਪਦਾਰਥ ਵਿਚ (ਪਾਇਆ ਹੋਇਆ) ਪਿਆਰ ਸਾਰਾ ਹੀ ਛੱਡ ਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭਾਉ = ਪਿਆਰ। ਦੂਜੇਰੈ = ਦੂਜੇ ਪਦਾਰਥ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "abandona la fascinación a todo lo demás."