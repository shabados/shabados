[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕਉ; ਸਤਿਗੁਰੁ ਅਪਨਾ ਰਾਖੈ ॥"
page = 1298
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "whomsoever protects his True Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕਿਸੇ ਦੀ ਭੀ ਉਸ ਦੇ ਗੁਰਦੇਵ ਰਖਿਆ ਕਰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whoever keeps his Guru enshrined within"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪੁਰਸੁ ਕੋ ਅਪਨਾ ਸਤਿਗੁਰੂ ਸਰਣਿ ਰਾਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਿਆਰਾ ਗੁਰੂ ਜਿਸ ਮਨੁੱਖ ਦੀ ਰੱਖਿਆ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਖੈ = ਰੱਖਿਆ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quien conserva a su Guru enaltecido en el interior de su ser,"