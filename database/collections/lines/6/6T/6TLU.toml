[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਖੋਜ ਥਕੇ ਸਭ ਹੀ ਖੁਜੀਆ ਸੁਰ; ਹਾਰ ਪਰੇ, ਹਰਿ ਹਾਥ ਨ ਆਵੈ ॥੭॥੨੪੯॥"
page = 37

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All the searchers have got tired in their search and none of them could realize the Lord. 7.249."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਖੋਜੀ ਦੇਵਤੇ ਖੋਜ ਕਰਦੇ ਥਕ ਗਏ, ਹਾਰ ਗਏ, (ਪਰ) ਪ੍ਰਭੂ ਕਿਸੇ ਦੇ ਵੀ (ਹੱਥ) ਨਹੀਂ ਆਇਆ ॥੭॥੨੪੯॥"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਖੋਜ ਥਕੇ ਸਭ ਹੀ ਖੁਜੀਆ ਸੁਰ; ਹਾਰ ਪਰੇ, ਹਰਿ ਹਾਥ ਨ ਆਵੈ ॥੭॥"