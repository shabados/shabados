[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨ ਕਉ ਬਿਆਪੈ; ਚਿੰਤਾ ਰੋਗ ॥੧॥"
page = 188
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "them the malady of anxiety afflicts."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਨੂੰ ਫਿਕਰ ਚਿੰਤਾ ਦੀ ਬੀਮਾਰੀ ਚਿਮੜ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "are afflicted by the disease of anxiety. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਨ ਕੋ ਚਿੰਤਾ ਰੂਪੀ ਰੋਗ ਬਿਆਪੇ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹਨਾਂ ਨੂੰ ਚਿੰਤਾ ਦਾ ਰੋਗ (ਸਦਾ) ਦਬਾਈ ਰੱਖਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਨ ਕਉ = ਉਹਨਾਂ ਨੂੰ। ਬਿਆਪੈ = ਦਬਾਈ ਰੱਖਦੀ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "están afectados por la enfermedad de la preocupación.  (1)"