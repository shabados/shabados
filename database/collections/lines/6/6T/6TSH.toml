[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਦੀਨੀ; ਸੋਭਾ ਵਡਿਆਈ ॥"
page = 177
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Who has given thee renown and greatness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਤੈਨੂੰ ਨਾਮਵਰੀ ਤੇ ਬਜੁਰਗੀ ਦਿੱਤੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He has given you fame and greatness;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜਿਸ ਨੇ (ਸੋਭਾ) ਉਸਤਤੀ ਤਥਾ (ਵਡਿਆਈ) ਪ੍ਰਤਿਸਟਾ ਦਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਮੈਨੂੰ ਸੋਭਾ ਦਿੱਤੀ ਹੈ ਵਡਿਆਈ ਬਖ਼ਸ਼ੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sin que tú intervinieras en nada."