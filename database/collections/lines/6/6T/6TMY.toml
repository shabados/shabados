[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨ ਵਿਟਹੁ ਨਾਨਕੁ ਵਾਰਿਆ; ਸਦਾ ਸਦਾ ਕੁਰਬਾਨਾ ॥੫॥"
page = 725
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Unto them, Nanak is a sacrifice and for ever and aye he is devoted."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਉਤੋਂ ਨਾਨਕ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹੈ ਅਤੇ ਸਦੀਵ ਤੇ ਹਮੇਸ਼ਾਂ ਲਈ ਸਦੱਕੜੇ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak is a sacrifice to them, forever and ever a devoted sacrifice. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਨਾਂ ਗੁਰਸਿਖਾਂ ਉਤੋਂ ਮੈਂ ਮਨ ਤਨ ਸੇ ਸਦਾ ਹੀ ਕੁਰਬਾਨ ਜਾਤਾ ਹੂੰ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਉਹਨਾਂ ਮਨੁੱਖਾਂ ਤੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹੈ, ਸਦਾ ਸਦਕੇ ਜਾਂਦਾ ਹੈ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਿਟਹੁ = ਤੋਂ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak ofrece su ser a ellos, por siempre y para siempre.(5)"