[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਹੈ ਆਪਨੇ ਖਾਵੰਦਹਿ ਅਧਿਕ ਪ︀ਯਾਰੀ ॥"
page = 832

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In the city of Cheenmaacheen, there lived a woman who was very much esteemed by her husband."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਅਪਾਣੇ ਪਤੀ ਦੀ ਬਹੁਤ ਪਿਆਰੀ ਸੀ।"