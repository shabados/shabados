[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਸਾ ਪ੍ਰੀਤਮੁ; ਕਰਿ ਮਨ ਮੀਤ ॥"
page = 187
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my mind make that beloved God, thy friend."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜਿੰਦੇ ਤੂੰ ਉਸ ਪਿਆਰੇ ਹਰੀ ਨੂੰ ਆਪਣਾ ਮਿੱਤ੍ਰ ਬਣਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Make the Beloved Lord your friend."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! (ਹਰਿ ਸਾ) ਸੋ ਹਰੀ ਮਿਤ੍ਰ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਿੱਤਰ ਮਨ! ਪਰਮਾਤਮਾ ਵਰਗਾ ਪ੍ਰੀਤਮ ਬਣਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾ = ਵਰਗਾ। ਕਰਿ = ਬਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Haz de tu Señor tu Bienamado, oh mi mente, la Vida de tu vida, oh mi amigo,"