[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਿੰਦੂ ਕੈ ਘਰਿ. ਹਿੰਦੂ ਆਵੈ ॥"
page = 951
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Hindu comes to the house of the Hindu."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹਿੰਦੂ ਦੇ ਗ੍ਰਹਿ ਵਿੱਚ ਹਿੰਦੂ ਆਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Hindu comes to the house of a Hindu."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਖਤ੍ਰੀ ਹਿੰਦੂ ਕੇ ਘਰ ਬ੍ਰਾਹਮਣ ਹਿੰਦੂ ਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਸੇ ਖਤ੍ਰੀ ਆਦਿਕ) ਹਿੰਦੂ ਦੇ ਘਰ ਵਿਚ ਬ੍ਰਾਹਮਣ ਆਉਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਿੰਦੂ = (ਭਾਵ) ਬ੍ਰਾਹਮਣ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El hindú entra sólo en la casa del hindú"