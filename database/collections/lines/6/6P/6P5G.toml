data = "ਯਾ ਮੈ ਕਛੂ ਭੇਦ ਨਹੀ ਕੀਜੈ ॥੭੨੭॥"
page = 752

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Utter firstly the word “Pundareek” and then add “Ari” after it, then comprehend all the names of Tupak, there id no mystery in it.727."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਵਿਚ ਕੋਈ ਭੇਦ ਨਾ ਸਮਝੋ ॥੭੨੭॥"