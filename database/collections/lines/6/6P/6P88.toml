[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੰਚ ਦੂਤ; ਕਾਇਆ ਸੰਘਾਰਹਿ ॥"
page = 1045
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The five demons destroy the body."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੰਜ ਭੂਤਨੇ (ਵਿਕਾਰ) ਦੇਹ ਨੂੰ ਨਾਸ ਕਰ ਦਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The five demons destroy the body."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੰਚ ਕਾਮਾਦੀ ਦੂਤ ਇਹੁ ਬੁਧੀ ਕੋ ਸੰਘਾਰੇ ਅਰਥਾਤ ਮਾਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਾਮਾਦਿਕ ਪੰਜੇ ਵੈਰੀ ਉਹਨਾਂ ਦੇ ਸਰੀਰ ਨੂੰ ਗਾਲਦੇ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੰਚ ਦੂਤ = (ਕਾਮਾਦਿਕ) ਪੰਜ ਵੈਰੀ। ਸੰਘਾਰਹਿ = ਨਾਸ ਕਰਦੇ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los cinco enemigos han tomado el control del cuerpo y de la mente,"