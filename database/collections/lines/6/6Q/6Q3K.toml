[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਥਹੁ ਉਪਜੈ. ਕਹ ਰਹੈ; ਕਹ ਮਾਹਿ ਸਮਾਵੈ ॥"
page = 1193
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Where from springs the man, where lives he, and in what does he merge?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬੰਦਾ ਕਿਥੋਂ ਉਤਪੰਨ ਹੁੰਦਾ ਹੈ, ਕਿਥੇ ਉਹ ਰਹਿੰਦਾ ਹੈ ਅਤੇ ਕਾਹਦੇ ਵਿੱਚ ਉਹ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Where do we come from? Where do we live? Where do we go in the end?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਹਾਂ ਸੇ ਜਗਤ ਉਤਪਤ ਹੋਤਾ ਹੈ ਔਰ ਕਹਾਂ ਇਸਥਿਤ ਰਹਿਤਾ ਹੈ ਔਰ ਅੰਤ ਕੋ ਕਿਸ ਮੇਂ ਸਮਾਵਤਾ ਹੈ?☬ਇਸ ਕਾ ਉੱਤ੍ਰ: ਜਿਸ ਤੇ ਜਿਸ ਪਰਮੇਸ੍ਵਰ ਸੇ ਜਗਤ ਉਤਪਤ ਹੂਆ ਹੈ, ਤਿਸੀ ਮੇਂ ਇਸਥਤ ਹੈ। ਪੁਨਹ ਅੰਤ ਕੋ ਭੀ ਸੋਈ ਰੂਪ ਹੂਆ ਹੈ, ਭਾਵ ਸੇ ਕਲਪਤਿ ਵਸਤੂ ਅਧਿਸਠਾਨ ਸੇ ਭਿੰਨ ਨਹੀਂ ਹੋਤੀ ਹੈ। ਇਸ ਮੇਂ ਜਗ੍ਯਾਸੂ ਕੇ ਚਿੰਤਨ ਕਾ ਪ੍ਰਕਾਰੁ ਹੈ, ਭਾਵ ਐਸੇ ਚਿੰਤਨ ਕਰੋ ਵਾ ਪ੍ਰਸ੍ਨ ਪਖ ਮੇਂ ਏਹੁ ਉੱਤਰ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕੋਈ ਨਹੀਂ ਦੱਸ ਸਕਦਾ ਕਿ) ਪ੍ਰਭੂ ਕਿਥੋਂ ਪੈਦਾ ਹੁੰਦਾ ਹੈ ਕਿਥੇ ਰਹਿੰਦਾ ਹੈ ਤੇ ਕਿਥੇ ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਹ ਮਾਹਿ = ਕਾਹਦੇ ਵਿਚ? ਸਮਾਵੈ = ਲੀਨ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿De dónde viene el ser humano, en dónde vive y a dónde va?"