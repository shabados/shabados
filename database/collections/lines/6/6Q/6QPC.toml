[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਕੀ; ਪ੍ਰਭ ਸਚੁ ਅਰਦਾਸਿ ॥੪॥੪॥੨੨॥"
page = 1271
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak thus prays to the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਐਸੀ ਪ੍ਰਾਰੱਬਨਾ ਕਰਦਾ ਹੈ ਸੱਚੇ ਸੁਆਮੀ, ਮੂਹਰੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak offers his prayer to the True Lord God. ||4||4||22||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹਮਾਰੀ ਨਿਸਚੈ ਕਰ ਕੇ ਇਹੀ ਬੇਨਤੀ ਹੈ॥੪॥੪॥੨੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਨਾਨਕ ਦੀ ਇਹ ਅਰਦਾਸ ਹੈ, (ਸੇਵਕ ਨੂੰ) ਆਪਣਾ ਸਦਾ-ਥਿਰ ਨਾਮ ਬਖ਼ਸ਼ ॥੪॥੪॥੨੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਚੁ = ਸਦਾ-ਥਿਰ ਹਰਿ-ਨਾਮ ॥੪॥੪॥੨੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nanak ofrece su oración al Verdadero Señor Dios. (4-4-22)"