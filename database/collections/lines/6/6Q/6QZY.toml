[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਲਗੁ ਰਿਦੈ; ਨ ਆਵਹਿ ਯਾਦਿ ॥੧॥"
page = 351
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "unless one remembers not the Lord in his mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਤਾਈਂ ਆਪਣੇ ਚਿੱਤ ਅੰਦਰ ਉਸ ਨੂੰ ਸਾਈਂ ਚੇਤੇ ਨਹੀਂ ਆਉਂਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "if the Lord is not cherished in the heart! ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸ੍ਵਾਮੀ! ਜਬ ਤਕ ਤੂੰ ਰਿਦੇ ਮੇਂ ਯਾਦ ਨਹੀਂ ਆਉਤਾ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦ ਤਕ, ਹੇ ਸਿਰਜਣਹਾਰ! ਤੂੰ ਮੇਰੇ ਹਿਰਦੇ ਵਿਚ ਚੇਤੇ ਨਾਹ ਆਵੇਂ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਵਹਿ = ਤੂੰ ਆਵੇਂ (ਹੇ ਪ੍ਰਭੂ!) ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "si uno no puede alabar al Señor en su corazón. (1)"