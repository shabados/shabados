[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਖਿ ਸਾਂਦਿ ਫਿਰਿ ਆਏ ॥"
page = 630
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Safe and sound, I have returned home, again."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਜ਼ੀ ਬਾਜ਼ੀ, ਮੈਂ ਮੁੜ ਕੇ ਘਰ ਆ ਗਿਆ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have returned again safe and sound."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਖ ਅਰ ਸਾਂਤੀ ਸਹਿਤ ਘਰ ਮੇਂ ਆਇ ਗਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ (ਕਾਮਾਦਿਕ ਵਲੋਂ) ਪਰਤ ਕੇ ਆਤਮਕ ਆਨੰਦ ਵਿਚ ਆ ਟਿਕੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਖਿ ਸਾਂਦਿ = ਆਤਮਕ ਆਨੰਦ ਵਿਚ, ਸ਼ਾਂਤ ਅਵਸਥਾ ਵਿਚ। ਆਏ = ਆ ਟਿਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y he regresado a salvo a mi Hogar."