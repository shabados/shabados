[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉਮੈ ਮਾਇਆ ਕੇ ਗਲਿ ਫੰਧੇ ॥"
page = 1041
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The noose of the pride of mammon is round their neck."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨ-ਦੌਲਤ ਦੇ ਹੰਕਾਰ ਦੀ ਫਾਹੀ ਉਨ੍ਹਾਂ ਦੀ ਗਰਦਨ ਦੁਆਲੇ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The noose of egotism and Maya is around their necks."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਉਮੈਂ ਕਰ ਕੇ ਮਾਇਆ ਕੇ ਗਲ ਮੇਂ ਫਾਹੇ ਪਏ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਬੰਦਿਆਂ ਦੇ ਗਲ ਵਿਚ ਹਉਮੈ ਤੇ ਮਾਇਆ ਦੇ ਮੋਹ ਦੇ ਫਾਹੇ ਪਏ ਰਹਿੰਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਲਿ = ਗਲ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y es atrapado en la trampa de Maya y del yo soy."