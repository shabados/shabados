[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਾਝੁ ਗੁਰੂ; ਹੈ ਭਰਮਿ ਭੁਲਾਇ ॥੩॥"
page = 1139
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "But without the Guru, he strays in doubt."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰੰਤੂ ਗੁਰਾਂ ਦੇ ਬਗੈਰ ਊਹ ਵਹਿਮ ਵਿੱਚ ਭਟਕਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Guru, he is confused and deluded by doubt. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਸੇ ਬਿਨਾਂ ਭਰਮ ਕਾ ਭੁਲਾਯਾ ਹੂਆ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਸਰਨ ਤੋਂ ਬਿਨਾ (ਜਗਤ) ਭਟਕਣਾ ਦੇ ਕਾਰਨ ਕੁਰਾਹੇ ਪਿਆ ਰਹਿੰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sí, sin el Guru, uno es de seguro engañado por la duda. (3)"