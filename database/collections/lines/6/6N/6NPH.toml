[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗੁ ਸਾਰੰਗ ਬਾਣੀ ਭਗਤਾਂ ਕੀ ॥ ਕਬੀਰ ਜੀ ॥"
page = 1251
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rag Sarang Hymns of the saints. Reverend Kabir."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗੁ ਸਾਰੰਗ ਭਗਤਾਂ ਦੇ ਸ਼ਬਦ। ਪੂਜਯ ਕਬੀਰ ਜੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Saarang, The Word Of The Devotees. Kabeer Jee:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਸਾਰੰਗ ਵਿੱਚ ਭਗਤਾਂ ਦੀ ਬਾਣੀ। ਭਗਤ ਕਬੀਰ ਜੀ ਦੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Sarang, Palabras de los Bhaktas, Kabir yi."