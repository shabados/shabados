[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਘਟਿ ਦੀਪਕੁ ਰਹਿਆ ਸਮਾਈ ॥੨॥"
page = 656
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "as within my mind the lamp go gnosis is aflame."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਮੇਰੇ ਹਿਰਦੇ ਅੰਦਰ ਬ੍ਰਹਮ-ਗਿਆਨ ਦਾ ਦੀਵਾ ਜਗਮਗਾ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "my mind is illuminated and enlightened. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਤਿਨੋਂ ਕੇ ਅੰਤਸਕਰਨ ਮੇਂ ਵੁਹ ਗਿਆਨ ਦੀਪਕ ਭੀ ਸਮਾਇ ਗਿਆ, ਭਾਵ ਲੈ ਹੋ ਗਿਆ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਅੰਦਰ ਉਹ ਦੀਵਾ ਫਿਰ ਸਦਾ ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਘਟਿ = (ਉਸ ਦੇ) ਹਿਰਦੇ ਵਿਚ। ਸਮਾਈ ਰਹਿਆ = ਅਡੋਲ ਜਗਦਾ ਰਹਿੰਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y mi mente se ha Iluminado. (2)"