[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਚੁ ਰੇ ਮਨ; ਗੁਰ ਕੈ ਆਗੈ ॥"
page = 506
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Dance, O man, before thy Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਿਰਤਕਾਰੀ ਕਰ, ਤੂੰ ਹੇ ਬੰਦੇ! ਆਪਣੇ ਗੁਰਾਂ ਦੇ ਮੂਹਰੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So dance, O mind, before your Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰੇ ਮਨ! ਗੁਰੋਂ ਕੇ ਸਨਮੁਖਿ ਨ੍ਰਿਤ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਗੁਰੂ ਦੀ ਹਜ਼ੂਰੀ ਵਿਚ ਨੱਚ (ਗੁਰੂ ਦੇ ਹੁਕਮ ਵਿਚ ਤੁਰ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਕੈ ਆਗੈ = ਗੁਰੂ ਦੇ ਸਾਹਮਣੇ, ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, danza para el Guru, pues aquél que danza en la Voluntad del Guru,"