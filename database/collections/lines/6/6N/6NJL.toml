[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਣ ਗਾਵਹੁ ਸੰਤ ਜੀਉ; ਮੇਰੇ ਹਰਿ ਪ੍ਰਭ ਕੇਰੇ ਜੀਉ ॥"
page = 175
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O venerable Saints, sing the praises of my Lord God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪੁਜਯ ਸਾਧੂਓ! ਮੇਰੇ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦਾ ਜੱਸ ਗਾਇਨ ਕਰੋ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Dear Saints, sing the Glorious Praises of my Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤੋ ਜੀ! ਮੇਰੇ ਹਰੀ ਪ੍ਰਭ ਕਾ ਗੁਣ ਗਾਇਨ ਕਰੋਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! ਤੁਸੀ ਮੇਰੇ ਹਰਿ-ਪ੍ਰਭੂ ਦੇ ਗੁਣ ਗਾਵੋ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤ ਜੀਉ = ਹੇ ਸੰਤ ਜੀ! ਕੇਰੇ = ਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Santos, canten las Alabanzas del Señor y habiten en Su Nombre,"