[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲੀਲਾ ਕਿਛੁ ਲਖੀ, ਨ ਜਾਇ ॥੪॥"
page = 897
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His wondrous play can be realised not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਅਦਭੁਤ ਖੇਡ ਅਨੁਭਵ ਕੀਤੀ ਨਹੀਂ ਜਾ ਸਕਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His play cannot be known. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੁਮਾਰੀ ਲੀਲਾ ਕੁਛ ਲਖੀ ਨਹੀਂ ਜਾਤੀ, ਐਸੇ ਕਹਿਤੇ ਹੈਂ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਖੇਡ ਕੁਝ ਭੀ ਬਿਆਨ ਨਹੀਂ ਕੀਤੀ ਜਾ ਸਕਦੀ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲੀਲਾ = ਇਕ ਚੋਜ, ਕੌਤਕ, ਖੇਡ। ਲਖੀ ਨ ਜਾਇ = ਬਿਆਨ ਨਹੀਂ ਹੋ ਸਕਦੀ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Su Obra es Incognoscible.(4)"