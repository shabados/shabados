[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਬਹੁਰਿ ਭਇਓ ਮਹਖਾਸੁਰ; ਤਿਨ ਤੋ ਕਿਆ ਕੀਆ ॥"
page = 76

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then there appeared Mahishasura and whatever he did is as follows:"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਫਿਰ ਮਹਿਖਾਸੁਰ (ਝੋਟੇ ਦੀ ਸ਼ਕਲ ਵਾਲਾ ਦੈਂਤ) ਹੋਇਆ। ਉਸ ਨੇ ਕੀ ਕੀਤਾ? (ਉਸ ਦਾ ਵਰਣਨ ਇਸ ਪ੍ਰਕਾਰ ਹੈ)।"