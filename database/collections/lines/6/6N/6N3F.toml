[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਗੀਰਦ ਬੁਜ਼ੋ ਮੇਸ਼ੋ ਆਹੂ ਗੁਜ਼ਰ ॥੧੭॥"
page = 1390

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The goat, sheep and deer do not go near him.17."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਬਕਰੀ, ਭੇਡ ਅਤੇ ਹਿਰਨ ਪਕੜ ਨਹੀਂ ਸਕਦੇ (ਸਗੋਂ ਉਸ ਪਾਸੋਂ) ਗੁਜ਼ਰ ਵੀ ਨਹੀਂ ਸਕਦੇ ॥੧੭॥"