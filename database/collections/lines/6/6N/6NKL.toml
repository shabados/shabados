[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਸੇਤੀ; ਸਦ ਰਹਹਿ ਲਿਵ ਲਾਇ ॥"
page = 1174
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They, who ever remain attached with God in love;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਪ੍ਰੇਮ ਅੰਦਰ ਹਮੇਸ਼ਾਂ ਵਾਹਿਗੁਰੂ ਨਾਲ ਜੁੜੇ ਰਹਿੰਦੇ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who remain lovingly attuned to the Lord forever"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਕੇ ਸਾਥ ਸਦੀਵ ਬ੍ਰਿਤੀ ਕੋ ਲਗਾਇ ਰਖਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਦਾ ਪਰਮਾਤਮਾ ਨਾਲ ਆਪਣੀ ਸੁਰਤ ਜੋੜੀ ਰੱਖਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਤੀ = ਨਾਲ। ਸਦ = ਸਦਾ। ਲਿਵ = ਲਗਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ellos permanecen imbuidos en Dios,"