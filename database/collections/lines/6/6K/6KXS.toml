language = "pa"
data = "ਉਸ ਅੱਗ ਨਾਲ ਮੈਣ ਅਜਿਹਾ ਸੜਿਆ ਹਾਣ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਆਣ ਚੁਨਾਣ ਸੋਖ਼ਤਮ ਅਜ਼ਾਣ ਆਤਿਸ਼ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "O Guru, my good friend! Radiance of your eyes cannot be matched by the light of the day."