[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜਪ ਤਪ ਸੰਜਮ ਹੋਮ ਜਗ; ਕਰਮ ਧਰਮ ਕਰਿ ਦਾਨ ਕਰਾਏ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He made the traditions of recitations, ascetic discipline, continence, burnt offerings, rituals, worships, char­ity etc."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜਪ ਤਪ ਸੰਜਮ ਹੋਮ, ਜੱਗ ਦਾਨ ਧਰਮ (ਆਦਿਕ ਸ਼ੁਭ ਕਰਮ) ਬਣਾਏ।"