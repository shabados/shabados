[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਮਨ; ਨਾਮੁ ਹਿਰਦੈ ਧਾਰਿ ॥"
page = 1007
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my soul, enshrine thou the Lord's Name within thy heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੈਂਡੀ ਜਿੰਦੜੀਏ! ਤੂੰ ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਨੂੰ ਆਪਣੇ ਦਿਲ ਅੰਦਰ ਟਿਕਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my mind, enshrine the Naam, the Name of the Lord, within your heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪਿਆਰੇ! ਨਾਮ ਕੋ ਰਿਦੇ ਮੇਂ ਧਾਰਿ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਹਿਰਦੇ ਵਿਚ ਟਿਕਾਈ ਰੱਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨ = ਹੇ ਮਨ! ਧਾਰਿ = ਟਿਕਾਈ ਰੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi mente, enaltece el Naam, el Nombre del Señor en tu corazón,"