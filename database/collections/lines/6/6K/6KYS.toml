[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਇਹ ਸੰਸਾਰੀ ਲਾਲ ਜਵਾਹਰ ਤਾਂ ਸਭ ਨਾਸ਼ਵਾਨ ਹਨ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਈਂ ਜਵਾਹਰ-ਹਾ ਹਮਾ ਫ਼ਾਨੀ ਬਵਦ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, all of them are the followers of his divine commands. (38)"