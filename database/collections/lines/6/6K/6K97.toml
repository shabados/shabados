[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰੈ ਸਤਿਗੁਰਿ. ਸੋਝੀ ਪਾਈ ॥"
page = 1054
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Perfect Guru has imparted understanding unto me,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਸਮਝ ਦਰਸਾ ਦਿੱਤੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Perfect True Guru has imparted this understanding."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹੁ ਸੋਝੀ ਭੀ ਪੂਰੇ ਸਤਿਗੁਰੋਂ ਸੇ ਪਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਸਤਿਗੁਰੂ ਨੇ (ਮੈਨੂੰ ਆਤਮਕ ਜੀਵਨ ਦੀ) ਸਮਝ ਬਖ਼ਸ਼ੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰਿ = ਗੁਰੂ ਦੀ ਰਾਹੀਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru Perfecto me hace ver"