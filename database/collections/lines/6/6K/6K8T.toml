[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੈ ਭਰੁਟੇ ਧਨੁ ਸੇ ਬਰਨੀ ਸਰ; ਦੂਰ ਕਰੈ ਤਨ ਕੇ ਦੁਖਰੈ ਸੇ ॥"
page = 337

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing such beautiful women, all the sufferings of the body are effeced"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਭਰਵੱਟੇ ਧਨੁਸ਼ ਵਰਗੇ, ਪਲਕਾਂ ਤੀਰਾਂ (ਦੇ ਸਮਾਨ ਹਨ) ਅਤੇ ਜੋ (ਜਿਸ ਨੂੰ ਲਗਦੇ ਹਨ ਉਸ ਦੇ) ਤਨ ਦੇ ਦੁਖ ਨੂੰ ਦੂਰ ਕਰਦੇ ਹਨ।"