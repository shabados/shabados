[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰੁ ਪੂਰਾ; ਵਡਭਾਗੀ ਪਾਈਐ ॥"
page = 804
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By great good fortune the perfect Guru is attained to."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਚੰਗੇ ਨਸੀਬਾਂ ਦੁਆਰਾ ਗੁਰਦੇਵ ਜੀ ਪਰਾਪਤ ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By great good fortune, the Perfect Guru is found."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸਾ ਪੂਰਾ ਸਤਿਗੁਰ ਵੱਡੇ ਭਾਗੋਂ ਕਰ ਪਾਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪੂਰੀ ਵੱਡੀ ਕਿਸਮਤ ਨਾਲ (ਹੀ) ਗੁਰੂ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਡਭਾਗੀ = ਵੱਡੀ ਕਿਸਮਤ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Por buena fortuna obtenemos al Guru Perfecto;"