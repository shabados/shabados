[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਣਿ ਵਡਾ; ਆਖੈ ਸਭੁ ਕੋਇ ॥"
page = 9
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By hearing every one calls Thee great (O Lord!),"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਣ ਸੁਣਾ ਕੇ ਹਰ ਕੋਈ ਤੈਨੂੰ ਵਿਸ਼ਾਲ ਆਖਦਾ ਹੈ (ਹੇ ਸੁਆਮੀ),"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Hearing of His Greatness, everyone calls Him Great."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਾਸਤ੍ਰੋਂ ਸੇ ਸੁਨ ਸੁਨ ਕਰ ਕੇ ਸਭ ਕੋਈ ਵਡਾ ਕਹਿਤਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰੇਕ ਜੀਵ (ਹੋਰਨਾਂ ਪਾਸੋਂ ਸਿਰਫ਼) ਸੁਣ ਕੇ (ਹੀ) ਆਖ ਦੇਂਦਾ ਹੈ ਕਿ (ਹੇ ਪ੍ਰਭੂ!) ਤੂੰ ਵੱਡਾ ਹੈਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਣਿ = ਸੁਣ ਕੇ। ਸਭੁ ਕੋਇ = ਹਰੇਕ ਜੀਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor, oyendo de Ti, todos hablan de Tu Grandeza,"