[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜੀਉ ਕੇ; ਦਰਸਨ ਕਉ ਕੁਰਬਾਨੀ ॥"
page = 1210
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am a sacrifice unto the vision of my Revered Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਪੂਜਨੀਯ ਪ੍ਰਭੂ ਦੇ ਦੀਦਾਰ ਉਤੋਂ ਬਲਿਹਾਰ ਜਾਂਦੀ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice to the Blessed Vision, the Darshan of my Dear Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਜੀਉ ਕੇ ਦਰਸਨ ਕੋ ਕੁਰਬਾਨ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਪ੍ਰਭੂ ਜੀ ਦੇ ਦਰਸਨ ਤੋਂ ਸਦਕੇ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਤੋਂ। ਕੁਰਬਾਨੀ = ਸਦਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ofrezco mi ser por tener la Visión de mi Dios,"