[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਅਲਖ ਪੁਰਖ ਅਬਗਤ ਅਵਧੂਤਾ ॥"
page = 11

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He is Imperceptible Purusha, Unmanifested and Unscathed."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਨਾ ਜਾਣਿਆ ਜਾ ਸਕਣ ਵਾਲਾ, ਅਵਿਅਕਤ, ਮਾਇਆਵੀ ਪ੍ਰਭਾਵ ਤੋਂ ਮੁਕਤ ਪੁਰਸ਼ ਹੈ।"