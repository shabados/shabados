[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਆਇ ਪਰੈ ਹਰਿ ਜੀ ਜਬ ਹੀ; ਤਬ ਹੀ ਸਭ ਗ੍ਵਾਰ ਸਨੈ ਚਬਿ ਜਾਵੈ ॥"
page = 307

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And when Krishna comes to that side, he may chew him alongwith the gopas"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਦੇ ਮੂੰਹ ਵਿਚ) ਜਦੋਂ ਸ੍ਰੀ ਕ੍ਰਿਸ਼ਨ ਆ ਪਵੇ, ਤਦੋਂ ਹੀ ਸਾਰਿਆਂ ਗਵਾਲ ਬਾਲਕਾਂ ਸਮੇਤ ਚਬ ਜਾਵੇ।"