[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦੀਪਾ ਦੇਊ ਨਰਾਇਣ ਦਾਸੁ; ਬੂਲੇ ਦੇ ਜਾਈਐ ਬਲਿਹਾਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "I am sacrifice unto Bhai Dev , Bhai Naryan Das, Bhai Bula and Bhai Dipa."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਦੇਉ ਜਾਤ ਵਾਲਾ ਦੀਪਾ ਭਗਤ, ਨਰੈਣ ਦਾਸ ਤੇ ਬੂਲਾ (ਨਾਮੇ ਸਿੱਖ ਪਰ ਅਸੀਂ) ਬਲਿਹਾਰ ਜਾਂਦੇ ਹਾਂ।"