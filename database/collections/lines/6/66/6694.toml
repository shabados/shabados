[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਿਨੁ ਰੈਣਿ ਸਭ ਸੁਹਾਵਣੇ ਪਿਆਰੇ; ਜਿਤੁ ਜਪੀਐ ਹਰਿ ਨਾਉ ॥੫॥"
page = 432
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Embellished are all the days and nights, O my Love, when God's Name is remembered."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਭਾਇਮਾਨ ਹਨ ਸਾਰੇ ਦਿਹਾੜੇ ਅਤੇ ਰਾਤਰੀਆਂ ਹੇ ਮੇਰੇ ਪ੍ਰੀਤਮਾਂ! ਜਦ ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ ਸਿਮਰਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All my days and nights are blessed, O Beloved, when I chant and meditate on the Lord's Name. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ ਪ੍ਯਾਰੇ! ਜਿਨ ਕਰ ਤੇਰਾ ਨਾਮ ਜਪੀਏ ਸੋ ਦਿਨੁ ਰੈਨ ਸਭ ਸੁਹਾਵਣੇ ਲਗਤੇ ਹੈਂ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਿਆਰੇ ਹਰੀ! ਉਹ ਹਰੇਕ ਦਿਨ ਰਾਤ ਸਾਰੇ ਸੋਹਣੇ ਲੱਗਦੇ ਹਨ ਜਦੋਂ ਤੇਰਾ ਨਾਮ ਸਿਮਰਿਆ ਜਾਂਦਾ ਹੈ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੈਣਿ = ਰਾਤ। ਸੁਹਾਵਣੇ = ਸੋਹਣੇ, ਸੁਖਦਾਈ। ਜਿਤੁ = ਜਿਸ ਵਿਚ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Benditos son los días y las noches en los que uno habita en el Naam, el Nombre del Señor. (5)"