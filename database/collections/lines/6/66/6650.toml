[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਵਈਏ ਮਹਲੇ ਤੀਜੇ ਕੇ ੩ ॥"
page = 1392
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Sawayas in praise of the 3rd Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਵਈਏ, ਤੀਜੀ ਪਾਤਿਸ਼ਾਹੀਦੀ ਉਸਤਤੀ ਵਿੱਚ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Swaiyas In Praise Of The Third Mehl:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਅਮਰਦਾਸ ਸਾਹਿਬ ਤੀਸਰੇ ਪਾਤਸ਼ਾਹ ਜੀ ਕੇ ਸੁਜਸ ਕੋ ਵੇਦੋਂ ਕਾ ਸਰੂਪ ਜੋ ਭੱਟ ਹੈਂ, ਸੋ ਉਚਾਰਨ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਦੀ ਉਸਤਤਿ ਵਿਚ ਉਚਾਰੇ ਹੋਏ ਸਵਈਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sweyas, en Alabanza de Guru Amar Das, Mejl Tercer Canal Divino."