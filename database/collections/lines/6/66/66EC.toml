[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਡਭਾਗੀ; ਕਿਸੈ ਪਰਾਪਤਿ ਹੋਇ ॥"
page = 279
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By great good fortune, only a few obtain the name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਚੰਗੇ ਨਸੀਬਾਂ ਦੁਆਰਾ, ਵਿਰਲੇ ਹੀ ਨਾਮ ਨੂੰ ਹਾਸਲ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Only a few obtain this, by great good fortune."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਨਾਮ ਕਿਸੀ ਵਡਭਾਗੀ ਕੋ ਹੀ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅਤੇ ਇਹ ਸੁਖ) ਕਿਸੇ ਵੱਡੇ ਭਾਗਾਂ ਵਾਲੇ ਨੂੰ ਮਿਲਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "es en verdad por la más grande fortuna, que un hombre llega a concebir tal Estado."