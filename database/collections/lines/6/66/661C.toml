[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਰਾਇਣ ਸੇਵਿ; ਸਗਲ ਫਲ ਪਾਹਿ ॥੧॥"
page = 868
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Lord's service, all the fruits are obtained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੀ ਸੇਵਾ ਰਾਹੀਂ ਸਾਰੇ ਮੇਵੇ ਪਰਾਪਤ ਹੋ ਜਾਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serving the Lord, all fruitful rewards are obtained. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਨਾਰਾਇਣ ਕੀ ਸੇਵਾ ਕਰਨੇ ਵਾਲੇ ਸਭ ਫਲੋਂ ਕੌ ਪਾਵਤੇ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਰਾਇਣ ਦੀ ਭਗਤੀ ਕਰ ਕੇ ਸਾਰੇ ਫਲ ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦੇ ਹਨ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੇਵਿ = ਸਿਮਰ ਕੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aquél que Lo sirve, es plenamente satisfecho. (1)"