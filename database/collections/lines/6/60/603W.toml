[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਅੰਤੁ ਨ ਸਿਫਤਿ ਸਲਾਹ, ਆਖਿ ਸੁਣਾਵਹੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "But their praises and eulogies cannot know his extent."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਸਿਫਤ ਦੇ ਸਲਾਹੁਣ ਦਾ ਕੁਝ ਅੰਤ ਨਹੀਂ' (ਕਈ ਏਹ ਬਾਤ) ਆਖਕੇ ਸਣਾਉਂਦੇ ਹਨ।"