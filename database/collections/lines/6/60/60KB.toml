[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਜੀਆ ਕਾ; ਰਾਖਾ ਸੋਇ ॥"
page = 286
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of all the sentient - beings that Lord is the Protector."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਮੂਹ ਪ੍ਰਾਣਧਾਰੀਆਂ ਦਾ ਉਹ ਪ੍ਰਭੂ ਹੀ ਰਖਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Protector of all beings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਪੂਰਨ ਜੀਵੋਂ ਕਾ ਰਾਖਣੇ ਹਾਰਾ ਏਕ ਸੋਈ ਵਾਹਿਗੁਰੂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜੀਵਾਂ ਦਾ ਰਾਖਾ ਪ੍ਰਭੂ ਆਪ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਬ = ਸਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es el Protector de todos los seres."