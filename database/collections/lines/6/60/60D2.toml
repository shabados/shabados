[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਕਰੇ ਕਰਾਏ ਕਰਤਾ ॥"
page = 1063
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of Himself, the creator is the doer and the Prompter."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿਰਜਣਹਾਰ ਖ਼ੁਦ ਹੀ ਕਰਨ ਵਾਲਾ ਤੇ ਕਰਾਉਣ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator Himself acts, and inspires all to act."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਆਪ ਹੀ ਸੰਸਾਰ ਕੋ ਕਰਤਾ ਹੈ ਔ ਆਪ ਹੀ ਤਿਸ ਪਾਸੋਂ ਕਰਮ ਕਰਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ, ਕਰਤਾਰ ਆਪ ਹੀ (ਸਭ ਕੁਝ) ਕਰਦਾ ਹੈ, ਆਪ ਹੀ (ਜੀਵਾਂ ਪਾਸੋਂ) ਕਰਾਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪੇ = (ਪ੍ਰਭੂ) ਆਪ ਹੀ। ਕਰਤਾ = ਕਰਤਾਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Creador, en Sí Mismo,"