[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਿਰਜੇ ਦਾਨੋ ਦੇਵਤੇ; ਤਿਨ ਅੰਦਰਿ ਬਾਦੁ ਰਚਾਇਆ ॥"
page = 119

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He created the demons and gods and caused strife between them."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਫਿਰ) ਦੈਂਤ ਅਤੇ ਦੇਵਤੇ ਸਿਰਜੇ ਅਤੇ ਉਨ੍ਹਾਂ ਅੰਦਰ ਵੈਰ-ਵਿਵਾਦ ਪੈਦਾ ਕੀਤਾ।"