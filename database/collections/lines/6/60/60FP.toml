[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਉ ਗੁਰਦੇਉ; ਸਭੈ ਬਿਖੁ ਮੇਵਾ ॥੭॥"
page = 1167
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Divine Guru is in mercy, then man is deemed to have performed twelve worship."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਈਸ਼ਵਰ ਸਰੂਪ ਗੁਰੂ ਜੀ ਰਹਿਮਤ ਦੇ ਘਰ ਵਸਦੇ ਹਨ, ਸਾਰੀਆਂ ਜ਼ਹਿਰਾਂ ਅੰਮ੍ਰਿਤਮਈ ਫਲ ਬਣ ਜਾਂਦੀਆਂ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Divine Guru grants His Grace, all poison is transformed into fruit. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਗੁਰਦੇਵ ਕੀ ਕ੍ਰਿਪਾ ਹੋਤੀ ਹੈ ਤਬ ਸਭੀ (ਬਿਖੁ) ਜਹਰ ਮੀਰਾਂ ਬਾਈ ਵਤ ਮੇਵਾ ਰੂਪ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇ ਗੁਰੂ ਮਿਲ ਪਏ ਤਾਂ ਉਸ ਮਨੁੱਖ ਲਈ ਸਾਰੇ ਜ਼ਹਿਰ ਭੀ ਮਿੱਠੇ ਫਲ ਬਣ ਜਾਂਦੇ ਹਨ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si el Guru nos muestra su Compasión, aún el veneno se convierte en dulce. (7)"