[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨਿ ਤੂ ਜਾਤਾ. ਕਰਮ ਬਿਧਾਤਾ ॥"
page = 1061
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who knows Thee as the Builder of destiny;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਤੈਨੂੰ ਪ੍ਰਾਲਭਧ ਦੇ ਬਣਾਉਣ ਵਾਲਾ ਕਰਕੇ ਜਾਣਦਾ ਹੈ;"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who knows You as the Architect of Karma,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਕਰਮ ਫਲ ਪ੍ਰਦਾਤਾ! ਜਿਨੋਂ ਨੇ ਤੁਮ ਕੋ ਜਾਣਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਜੀਵਾਂ ਦੇ ਕੀਤੇ ਕਰਮਾਂ ਅਨੁਸਾਰ ਪੈਦਾ ਕਰਨ ਵਾਲਾ ਹੈਂ। ਜਿਸ (ਮਨੁੱਖ) ਨੇ ਤੇਰੇ ਨਾਲ ਸਾਂਝ ਪਾ ਲਈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੂ = ਤੈਨੂੰ। ਜਿਨਿ = ਜਿਸ (ਮਨੁੱਖ) ਨੇ। ਤੂ ਜਾਤਾ = ਤੇਰੇ ਨਾਲ ਸਾਂਝ ਪਾ ਲਈ। ਕਰਮ ਬਿਧਾਤਾ = ਜੀਵਾਂ ਦੇ ਕੀਤੇ ਕਰਮਾਂ ਅਨੁਸਾਰ ਪੈਦਾ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que Te conoce como el Constructor de nuestro Destino, él,"