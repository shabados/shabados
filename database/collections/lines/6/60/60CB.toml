data = "ਉਰ ਮੈ ਮਾਰਿ ਕਟਾਰੀ ਮਰਿਹੋ ॥੧੩॥"
page = 993

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘What will he do once I have gone. Would he kill himself with a dagger?(13)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹਿਰਦੇ ਵਿਚ ਕਟਾਰ ਮਾਰ ਕੇ ਮਰ ਜਾਓਗੇ ॥੧੩॥"