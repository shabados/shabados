[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੈ; ਹਰਿ ਹਰਿ ਨਾਮੁ ਧਰ ਸੋਈ ॥"
page = 735
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord God's Name; that alone is my support."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਵਾਹਿਗੁਰੂ ਦਾ ਨਾਮ, ਕੇਵਲ ਉਹ ਹੀ ਮੇਰਾ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Name of the Lord, Har, Har, is my only support."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰਿ! ਜੋ ਤੇਰਾ ਹਰਿ ਨਾਮ ਹੈ, ਸੋਈ ਮੇਰਾ ਆਸਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਮੇਰੇ ਵਾਸਤੇ ਤੇਰਾ ਉਹ ਨਾਮ ਹੀ ਆਸਰਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੈ = ਮੇਰੇ ਵਾਸਤੇ। ਧਰ = ਆਸਰਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Nombre del Señor, Jar, Jar, es mi Único Soporte."