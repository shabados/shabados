[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਸ ਕਉ; ਜੋ ਜਾਣੈ ਨੀਚਾ ॥"
page = 266
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who deems himself low,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਆਪਣੇ ਆਪ ਨੂੰ ਨੀਵਾਂ ਜਾਣਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who sees himself as lowly,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪੁਰਸ ਅਪਨੇ ਆਪ ਕੋ ਨੀਵਾਂ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਮਨੁੱਖ ਆਪਣੇ ਆਪ ਨੂੰ (ਸਾਰਿਆਂ ਨਾਲੋਂ) ਮੰਦ-ਕਰਮੀ ਖ਼ਿਆਲ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪਸ ਕਉ = ਆਪਣੇ ਆਪ ਨੂੰ। ਨੀਚਾ = ਨੀਵਾਂ, ਮੰਦਾ, ਮਾੜਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que se considera como ínfima parte de la creación,"