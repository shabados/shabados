[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹੀਉ ਅਰਪਿ ਦੇਨ ॥"
page = 1305
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I surrender my soul unto them."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੀ ਜਿੰਦੜੀ ਉਨ੍ਹਾਂ ਦੇ ਸਮਰਪਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I dedicate my heart to them."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਤਿਨ ਕੋ ਅਪਨਾ ਹੀਉ, ਭਾਵ ਮਨੁ ਅਰਪਨ ਕਰ ਦੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਹਿਰਦਾ ਭੇਟ ਕਰ ਦੇਈਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਰਪਿ ਦੇਨ = ਭੇਟ ਕਰ ਦਿੱਤਾ ਜਾਏ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "del Señor y dedico mi corazón a ellos."