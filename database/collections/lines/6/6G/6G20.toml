[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਲ ਭੀਤਰਿ; ਤਾ ਕਾ ਹੋਇ ਬਿਨਾਸ ॥"
page = 278
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "in a moment he shall be destroyed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਇਕ ਮੁਹਤ ਵਿੱਚ ਤਬਾਹ ਹੋ ਜਾਏਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "but he shall vanish in an instant."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕਾ ਏਕ ਪਲ ਬੀਚ ਹੀ ਨਾਸ ਹੋਇ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਪਲਕ ਵਿਚ ਉਸ ਦਾ ਨਾਸ ਹੋ ਜਾਂਦਾ ਹੈ (ਤੇ ਉਹਨਾਂ ਵਿਚੋਂ ਕੋਈ ਭੀ ਸਹਾਈ ਨਹੀਂ ਹੁੰਦਾ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੀਤਰਿ = ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando un hombre se jacta de dar soporte y protección a un pueblo entero,"