[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਾਈਐ ਧਾਮਿ ਸੁਨੋ ਘਨਿ ਸ︀ਯਾਮ ਬਿਸ੍ਰਾਮ ਕਰੋ ਸੁਖ ਅੰਮ੍ਰਿਤ ਪੀਜੈ ॥"
page = 441

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“O Krishna! go to your home, take rest and live in peace"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹੇ ਕ੍ਰਿਸ਼ਨ! ਸੁਣੋ, ਘਰ ਜਾਓ, ਬਿਸਰਾਮ ਕਰੋ ਅਤੇ ਸੁਖ ਰੂਪ ਅੰਮ੍ਰਿਤ ਦਾ ਪਾਨ ਕਰੋ।"