[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਹੇ; ਏਕ ਬਿਨਾ ਚਿਤੁ ਲਾਈਐ ॥"
page = 379
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why apply thou thy mind to any, but the one Lord?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਇੱਕ ਸੁਆਮੀ ਦੇ ਬਗੈਰ, ਤੂੰ ਆਪਣਾ ਮਨ ਕਿਉਂ ਕਿਸੇ ਨਾਲ ਜੋੜਦਾ ਹੈਂ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Why center your consciousness on any other than the Lord?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਏਕ ਅਕਾਲ ਪੁਰਖ ਸੇ ਬਿਨਾਂ ਦੂਸਰੇ ਮੇਂ ਚਿਤ (ਕਾਹੇ) ਕਿਉਂ ਲਗਾਈਏ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਇਕ ਪਰਮਾਤਮਾ ਤੋਂ ਬਿਨਾ ਕਿਸੇ ਹੋਰ ਵਿਚ ਪ੍ਰੀਤਿ ਨਹੀਂ ਜੋੜਨੀ ਚਾਹੀਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਹੇ = ਕਿਉਂ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué aplicas tu mente siempre en el otro entonces?"