[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਭੈ ਭਗਤੀ; ਆਵਉ ਜਾਉ ॥"
page = 1188
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Lord's fear and devotional service one comes and goes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਡਰ ਅਤੇ ਅਨੁਰਾਗੀ ਸੇਵਾ ਦੇ ਬਾਝੋਂ ਇਨਸਾਨ ਆਉਂਦਾ ਤੇ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Fear of God and devotional worship of Him, the mortal comes and goes in reincarnation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸ੍ਵਰ ਕੇ ਭੈ ਔ ਭਗਤੀ ਸੇ ਬਿਨਾਂ ਪੁਰਸੁ ਜਨਮਤਾ ਮਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਭਗਤੀ ਤੋਂ ਸੱਖਣਾ ਹੈ ਪ੍ਰਭੂ ਦੇ ਡਰ-ਅਦਬ ਤੋਂ ਖ਼ਾਲੀ ਹੈ ਉਸ ਨੂੰ ਜੰਮਣ ਮਰਨ ਦਾ ਗੇੜ ਮਿਲਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਵਉ ਜਾਉ = ਜੰਮਣ ਮਰਨ (ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sin ser teñidos por Su Temor, el amor es sólo Ilusión."