[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖ ਅੰਧੁਲੇ; ਸੋਝੀ ਨਾਹੀ ॥"
page = 1029
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The blind apostate has no under standing."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅੰਨ੍ਹੇ ਅਧਰਮੀ ਨੂੰ ਕੋਈ ਸਮਝ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The blind, self-willed manmukh does not understand."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨਮੁਖਤਾ ਕਰਿ ਜੋ ਅੰਧੇ ਹੈਂ ਤਿਨ ਕੋ ਪ੍ਰਾਪਤੀ ਕੀ ਸੋਝੀ ਨਹੀਂ ਪੜਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ ਤੇ ਮਾਇਆ ਦੇ ਮੋਹ ਵਿਚ ਅੰਨ੍ਹੇ ਹੋਏ ਬੰਦਿਆਂ ਨੂੰ (ਇਸ ਤ੍ਰਿਸ਼ਨਾ-ਅੱਗ ਦੇ ਸਮੁੰਦਰ ਦੀ) ਸਮਝ ਨਹੀਂ ਪੈਂਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਮੁਖ = ਆਪਣੇ ਮਨ ਦੇ ਪਿਛੇ ਤੁਰਨ ਵਾਲੇ ਬੰਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los arrogantes Manmukjs están ciegos,"