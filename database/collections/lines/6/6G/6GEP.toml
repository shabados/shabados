[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੁੰਤੀ ਕਉ ਦੇਖਤ ਹੀ ਕਬਿ ਸ︀ਯਾਮ ਕਹੈ ਤਿਨ ਪਾਇਨ ਸੀਸ ਝੁਕਾਯੋ ॥"
page = 398

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On seeing Kunti, he bowed down his head"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਵੀ ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, ਕੁੰਤੀ ਨੂੰ ਵੇਖਦਿਆਂ ਹੀ ਉਸ ਨੇ ਪੈਰਾਂ ਉਤੇ ਸਿਰ ਨਿਵਾਇਆ।"