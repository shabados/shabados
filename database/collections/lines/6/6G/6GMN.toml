[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਲਖਯੋ ਰਾਮ ਕੋ ਅਤ੍ਰ ਧਾਰੀ ਅਭੰਗੰ ॥੬੮੪॥"
page = 272

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The kings, who presented multi-coloured red and blue gems, had a sight of Ram, the wielder of weapons and arms.684."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਭ ਨੇ ਸ੍ਰੀ ਰਾਮ ਨੂੰ ਅਚੂਕ ਅਸਤ੍ਰਧਾਰੀ ਰੂਪ ਵਿੱਚ ਵੇਖਿਆ ॥੬੮੪॥"