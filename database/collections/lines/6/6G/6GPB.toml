[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਹੁ ਨਾਨਕ. ਭਜੁ ਹਰਿ ਮਨਾ; ਅਉਧ ਜਾਤੁ ਹੈ ਬੀਤਿ ॥੩॥"
page = 1426
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Says Nanak, dwell thou on thy God, O man, thy life is fleeting away."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਜੀ ਫੁਰਮਾਉਂਦੇ ਹਨ ਤੂੰ ਆਪਣੇ ਹਰੀ ਦਾ ਚਿੰਤਨ ਕਰ, ਹੇ ਬੰਦੇ! ਤੇਰੀ ਜਿੰਦਗੀ ਭੱਜੀ ਜਾ ਰਹੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Says Nanak, meditate, vibrate upon the Lord; your life is fleeting away! ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਅਬ ਯਿਹ ਬੁਢੇਪੇ ਕੀ ਅਵਧ ਭੀ ਬੀਤੀ ਜਾਤੀ ਹੈ, ਤਾਂ ਤੇ ਹਰਿ ਕਾ ਭਜਨ ਕਰ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਆਖਦਾ ਹੈ- ਹੇ ਮਨ! ਪਰਮਾਤਮਾ ਦਾ ਭਜਨ ਕਰਿਆ ਕਰ। ਉਮਰ ਲੰਘਦੀ ਜਾ ਰਹੀ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਉਧ = ਉਮਰ। ਜਾਤ ਹੈ ਬੀਤਿ = ਗੁਜ਼ਰਦੀ ਜਾ ਰਹੀ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "dice Nanak, medita, pues tu vida está llegando a su fin. (3)"