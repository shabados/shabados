[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹੋਇ ਸੁਫਲ ਫਲੁ ਸਫਲੁ, ਵਟ ਸਹਾਇਆ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Then becoming full of fruits it bears the stone-blows."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਚੰਗੇ ਫਲਾਂ ਨਾਲ ਫਲੀਭੂਤ ਹੋਕੇ ਵੱਟ ਸਹਾਰੇ।"