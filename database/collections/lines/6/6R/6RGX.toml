[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹਾਥੀ ਨੀਰਿ ਨ੍ਹਵਾਲੀਐ; ਸਿਰਿ ਛਾਰੁ ਉਡਾਵੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The elephant even bathed in water puts dust on its head."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਹਾਥੀ ਨੂੰ ਪਾਣੀ ਵਿਖੇ ਨਵਾਈਏ ਸਿਰ ਪੁਰ ਸੁਆਹ ਹੀ ਉਡਾਂਵਦਾ ਹੈ।"