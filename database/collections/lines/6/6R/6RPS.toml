[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸ︀ਯਾਮ ਬੁਲਾਵਤ ਹੈ ਸੁ ਜਹਾ ਉਠ ਕੈ ਤਿਹ ਠਉਰ ਬਿਖੈ ਚਲਿ ਜਈਯੈ ॥"
page = 363

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "You go to the place, where Krishna is calling you"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਥੇ ਕ੍ਰਿਸ਼ਨ ਬੁਲਾਉਂਦਾ ਹੈ, ਉਸ ਥਾਂ ਤੇ ਉਠ ਕੇ ਚਲੇ ਜਾਣਾ ਚਾਹੀਦਾ ਹੈ।"