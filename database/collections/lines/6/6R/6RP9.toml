data = "ਅਜ਼ੀ ਰਾਜਹਾ ਕਸ ਨਿਯਾਮਦ ਨਜ਼ਰ ॥"
page = 1400

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Spoke, ‘None from them suits my eyes.‘"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਲੜਕੀ ਨੇ ਕਿਹਾ) ਇਨ੍ਹਾਂ ਵਿਚੋਂ ਮੇਰੀ ਨਜ਼ਰ ਹੇਠ ਕੋਈ ਨਹੀਂ ਆਇਆ।"