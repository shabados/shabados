[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੇ ਹਰਿ ਕੇ ਲੋਗ ਅਤੀਤਾ ॥੫॥"
page = 1189
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "such are the detached men of God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਹੋ ਜਿਹੇ ਹਨ ਵਾਹਿਗੁਰੂ ਦੇ ਨਿਰਲੇਪ ਬੰਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "such people of the Lord remain unattached. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਐਸੇ ਤੇਰੇ ਲੋਗ ਸਭ ਤੇ ਅਸੰਗ ਰਹਿਤੇ ਹੈਂ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਇਸ ਤਰ੍ਹਾਂ ਪਰਮਾਤਮਾ ਦੇ ਸੇਵਕ (ਮਾਇਆ ਦੇ ਮੋਹ ਤੋਂ) ਨਿਰਲੇਪ ਹੋ ਜਾਂਦੇ ਹਨ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਐਸੇ = ਇਸ ਤਰ੍ਹਾਂ, ਇਸ ਤਰੀਕੇ ਨਾਲ। ਅਤੀਤਾ = ਨਿਰਲੇਪ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y su conciencia en la Conciencia Universal, él en verdad, es el ser desapegado con Conciencia de Dios. (5)"