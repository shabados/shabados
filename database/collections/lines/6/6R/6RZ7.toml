[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਕ੍ਰਤ ਚਾਰ ਚਕ੍ਰਵੈ ਚਕ੍ਰਤ; ਚਉਕੁੰਟ ਚਵਗਨ ॥"
page = 131

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Visualizing the Beauty of the Universal monarch all the four directions seem stunned."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਚੌਹਾਂ ਚੱਕਾਂ ਦੇ ਸੁੰਦਰ ਚਕ੍ਰਵਰਤੀ ਰਾਜੇ (ਉਸ ਦੇ) ਰੂਪ ਤੋਂ ਹੈਰਾਨ ਹੋਏ ਫਿਰਦੇ ਹਨ।"