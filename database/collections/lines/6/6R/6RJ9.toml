[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ ਪਿਛੈ ਭਜਿ ਪਵਹਿ; ਏਹਾ ਕਰਣੀ ਸਾਰੁ ॥"
page = 143
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They should run to the True Guru's sanctuary. This is the rightful way of life."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਦੌੜ ਕੇ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਸ਼ਰਣਾਗਤ ਜਾਂ ਡਿੱਗਣ, ਇਹ ਹੀ ਦਰੁਸਤ ਜੀਵਨ ਰਹੁ-ਰੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They should worship and follow the True Guru-this is the lifestyle of excellence."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਸਤਿਗੁਰੋਂ ਕੋ ਪੀਛੇ ਅਰਥਾਤ ਸਰਣ ਮੇਂ ਭਜ ਕਰ ਕੇ ਕਿਆ ਸੀਘਰ ਹੀ ਪੜ ਜਾਇ, ਕਿਉਂਕਿ ਏਹੀ ਕਰਣੀ ਉਤਮ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹਨਾਂ ਹੌਲੇ ਜੀਵਨ ਵਾਲੇ ਜੀਵਾਂ ਲਈ) ਸਭ ਤੋਂ ਚੰਗੀ ਕਰਨ ਵਾਲੀ ਗੱਲ ਇਹੀ ਹੈ ਕਿ ਸਤਿਗੁਰੂ ਦੀ ਸਰਨੀ ਜਾ ਪੈਣ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਰੁ = ਸ੍ਰੇਸ਼ਟ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ellos deberían de seguir al Verdadero Guru porque solamente ésta es la Acción Pura."