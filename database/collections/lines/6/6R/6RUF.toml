data = "ਹੇ ਸੰਤ ਜਨੋ! ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਨੇ ਪੂਰੇ ਗੁਰੂ ਦਾ ਧਿਆਨ ਧਰਿਆ,"

