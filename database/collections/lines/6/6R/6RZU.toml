[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗੁ ਰਾਮਕਲੀ ਮਹਲਾ ੫ ਪੜਤਾਲ ਘਰੁ ੩ ॥"
page = 901
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rag Ramkali 5th Guru. Partal."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਰਾਮਕਲੀ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ। ਪੜਤਾਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Raamkalee, Fifth Mehl, Partaal, Third House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਰਾਮਕਲੀ, ਘਰ ੩ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਪੜਤਾਲ'।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ramkali, Mejl Guru Aryan, Quinto Canal Divino, Partala."