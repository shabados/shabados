[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰਿਆ ਦਾਸਾ ਰਿਦੈ. ਮੁਰਾਰੀ ॥"
page = 622
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Lord, the Enemy of ego, Thou abidest within the mind of Thine."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਹੰਕਾਰ ਦੇ ਵੈਰੀ ਸੁਆਮੀ! ਤੂੰ ਆਪਣਿਆਂ ਗੋਲਿਆਂ ਦੇ ਮਨ ਵਿੱਚ ਵਸਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You dwell in the hearts of Your slaves, Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੁਰਾਰੀ! ਤੇਰਿਆਂ ਭਗਤਾਂ ਕੇ ਰਿਦੇ ਮੇਂ ਤੇਰੀ ਭਗਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰੇ ਸੇਵਕਾਂ ਦੇ ਹਿਰਦੇ ਵਿਚ ਹੀ ਨਾਮ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਰਾਰੀ = {ਮੁਰ-ਅਰਿ} ਪਰਮਾਤਮਾ। ਰਿਦੈ = ਹਿਰਦੇ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tus Devotos Te alaban en su corazón, y en él, oh Murari,"