[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਬਦੈ ਵਿਚਿ ਵਖਾਣੀਐ; ਸੁਰਤੀ ਵਿਚਿ ਰਿਸੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "He is described through words and He is illumined in the consciousness."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਜੋ ਸ਼ਬਦ ਵਿਚ ਉਚਾਰਿਆ ਜਾਂਦਾ ਹੈ। (ਉਹ) ਸੁਰਤ ਵਿਚੋਂ ਨਿਕਲਦਾ ਹੈ।"