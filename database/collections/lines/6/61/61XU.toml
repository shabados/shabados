[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੀਤ ਸਖੇ; ਕੇਤੇ ਜਗ ਮਾਹੀ ॥"
page = 1028
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Man may have good many friends and comrades in the world,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਅੰਦਰ ਬੰਦੇ ਦੇ ਭਾਵੇਂ ਅਨੇਕਾਂ ਮਿੱਤ੍ਰ ਤੇ ਸਾਥੀ ਹੋਣ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You may have many friends and companions in the world,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਕੇ ਬੀਚ ਮਿਤ੍ਰ ਪਿਆਰੇ ਕਈ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਗਤ ਵਿਚ (ਭਾਵੇਂ) ਅਨੇਕਾਂ ਹੀ ਮਿੱਤਰ ਸਾਥੀ (ਬਣਾ ਲਈਏ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੇਤੇ = ਕਿਤਨੇ ਹੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Hay miles de amigos en el mundo,"