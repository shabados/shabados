[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚਾਕਰੁ ਤ ਤੇਰਾ. ਸੋਇ ਹੋਵੈ; ਜੋਇ ਸਹਜਿ ਸਮਾਵਏ ॥"
page = 567
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone becomes thy slave, O Lord, who, in a state of poise, ever cherishes Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਉਹੀ ਗੁਮਾਸ਼ਤਾ ਹੁੰਦਾ ਹੈ ਜੋ ਸਹਿਜ ਅਵਸਥਾ ਅੰਦਰ ਲੀਨ ਹੈ ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone becomes Your servant, who contemplates You in peaceful ease."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਤੇਰਾ (ਚਾਕਰ) ਦਾਸ ਤੋ ਸੋਈ ਹੋਤਾ ਹੈ, ਜੋ (ਸਹਜਿ) ਸਾਂਤੀ ਮੇਂ ਸਮਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਮਨੁੱਖ ਤੇਰਾ ਅਸਲ ਭਗਤ-ਸੇਵਕ ਹੈ ਜੋ (ਤੇਰਾ ਨਾਮ ਸਿਮਰ ਕੇ) ਆਤਮਕ ਅਡੋਲਤਾ ਵਿਚ ਟਿਕਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਾਕਰੁ = ਸੇਵਕ। ਸਹਜਿ = ਅਡੋਲ ਆਤਮਕ ਅਵਸਥਾ ਵਿਚ। ਸਮਾਵਏ = ਸਮਾਵੈ, ਲੀਨ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ni adversario ni dolor pueden tocarlo;"