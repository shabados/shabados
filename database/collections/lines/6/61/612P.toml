data = "ਹੋ ਤਬ ਦੈਹੈ ਇਹ ਜਾਨ; ਹ੍ਰਿਦੈ ਸੁਖੁ ਪਾਇ ਕੈ ॥੯॥"
page = 838

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘After that you will be let free.’(9)"

[[content]]
