[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕ ਬਿਨਉ ਕਰਉ ਜੀਉ; ਸੁਣਿ ਕੰਤ ਪਿਆਰੇ ॥"
page = 247
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I make a supplication, listen to it, O my Beloved Spouse."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਇਕ ਪ੍ਰਾਰਥਨਾ ਕਰਦੀ ਹਾਂ, ਇਸ ਨੂੰ ਸ੍ਰਵਣ ਕਰ, ਹੇ ਮੇਰੇ ਲਾਡਲੇ ਖ਼ਸਮ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I offer this one prayer - please listen, O my Beloved Husband Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਏਕ ਬੇਨਤੀ ਕਰਤੀ ਹੂੰ, ਹੇ ਮੇਰੇ ਪਿਆਰੇ ਪਤੀ ਜੀ! ਤੁਮ ਸ੍ਰਵਨ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਿਆਰੇ ਕੰਤ ਜੀਉ! ਸੁਣ, ਮੈਂ ਇਕ ਬੇਨਤੀ ਕਰਦੀ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਨਉ = ਬੇਨਤੀ। ਕਰਉ = ਕਰਉਂ, ਮੈਂ ਕਰਦੀ ਹਾਂ। ਕੰਤ = ਹੇ ਕੰਤ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En oración Te pido, oh Amado, escúchame, oh mi Esposo,"