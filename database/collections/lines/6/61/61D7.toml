[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੂ ਕਾਂਇ ਗਰਬਹਿ; ਬਾਵਲੀ ॥"
page = 1196
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why take thou pride, O demented bride?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਕਿਉਂ ਹੰਕਾਰ ਕਰਦੀ ਹੈ, ਨੀ ਕਮਲੀਏ ਮਹੇਲੀਏ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Why are you so proud? You are insane."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੀਵ ਰੂਪੀ ਬਾਵਲੀ ਇਸਤ੍ਰੀ! ਤੂੰ ਕਾਇ ਕਿਸ ਵਾਸਤੇ ਗਰਬ ਕਰਤੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਕਮਲੀ ਕਾਇਆਂ! ਤੂੰ ਕਿਉਂ ਮਾਣ ਕਰਦੀ ਹੈਂ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਂਇ = ਕਿਉਂ? ਕਾਹਦੇ ਲਈ? ਗਰਬਹਿ = ਅਹੰਕਾਰ ਕਰਦੀ ਹੈਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh loco amigo, ¿por qué te inflas con tanto orgullo?,"