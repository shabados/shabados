[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਬ ਹਮ; ਏਕੋ ਏਕੁ ਕਰਿ ਜਾਨਿਆ ॥"
page = 324
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When I realise that there is but one Lord,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਮੈਂ ਕੇਵਲ ਇਕ ਪ੍ਰਭੂ ਨੂੰ ਹੀ ਸਿਆਣਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When I realize that there is One, and only One Lord,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਬ ਹਮਨੇ ਏਕ ਹੀ ਏਕ ਪਰਮੇਸ੍ਵਰ ਜਾਨਿਆਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਅਸਾਂ (ਭਾਵ, ਮੈਂ) ਇਹ ਸਮਝ ਲਿਆ ਹੈ ਕਿ ਸਭ ਥਾਈਂ ਇਕ ਪਰਮਾਤਮਾ ਹੀ ਵਿਆਪਕ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਮ = ਅਸਾਂ। ਏਕੋ ਏਕੁ ਕਰਿ = ਇਹ ਨਿਸ਼ਚਾ ਕਰ ਕੇ ਕਿ ਸਭ ਥਾਈਂ ਇਕ ਪਰਮਾਤਮਾ ਹੀ ਵਿਆਪਕ ਹੈ। ਜਾਨਿਆ = ਸਮਝਿਆ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si he concibiendo que hay sólo un Dios,"