type = "primary"
data = "ਦੀਨ ਦਇਆਲ ਗਰੀਬ ਨਿਵਾਜਾ ॥੧॥"
page = 47

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Merciful Lord of the lowly and protector of the humble.1."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੂੰ) ਦੀਨਾਂ (ਵਿਚਾਰਿਆਂ) ਉਤੇ ਦਇਆ ਕਰਨ ਵਾਲਾ ਅਤੇ ਗ਼ਰੀਬਾਂ ਨੂੰ ਵਡਿਆਉਣ ਵਾਲਾ ਹੈਂ ॥੧॥"