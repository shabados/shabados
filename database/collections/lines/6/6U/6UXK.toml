[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਧੂ ਸੰਗਮੇ ਹਾਂ ॥"
page = 410
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have joined the society of saints,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਤਿ ਸੰਗਤ ਨਾਲ ਜੁੜ ਗਿਆ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Joining the Saadh Sangat, the Company of the Holy,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਮਨ! ਫਿਰ ਇਸ ਪ੍ਰਕਾਰ ਕਹੁ ਕਿ ਹੇ ਸ੍ਵਾਮੀ ਅਬ ਹਮ ਸੰਤੋਂ ਕੇ ਸੰਗ ਰਹਿਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮੇਰੇ ਮਨ) ਗੁਰੂ ਦੀ ਸੰਗਤਿ ਵਿਚ ਰਿਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਗਮੇ = ਮੇਲ ਵਿਚ, ਸੰਗਤਿ ਵਿਚ। ਸਾਧੂ = ਗੁਰੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando me uní a la Sociedad de los Santos,"