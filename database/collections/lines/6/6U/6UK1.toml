[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਿ ਚਿਤਾਰੇ ਅਪਣਾ ਕੀਆ ॥"
page = 1076
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou Thyself give thought to Thine creation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਖ਼ੁਦ ਹੀ ਆਪਣੀ ਰਚਨਾ ਦਾ ਖ਼ਿਆਲ ਰਖਦਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You Yourself are conscious of Your Creation."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੇਰਾ ਆਪਣਾ ਕੀਆ ਜੋ ਜਗਤ ਹੈ ਤਿਸ ਕੋ ਤੂੰ ਆਪ ਹੀ ਯਾਦ ਕਰਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਪੈਦਾ ਕੀਤੇ ਜਗਤ ਦੀ ਪ੍ਰਭੂ ਆਪ ਹੀ ਸੰਭਾਲ ਕਰ ਰਿਹਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਿਤਾਰੇ = ਸੰਭਾਲ ਕਰਦਾ ਹੈ, ਖ਼ਿਆਲ ਰੱਖਦਾ ਹੈ। ਕੀਆ = ਪੈਦਾ ਕੀਤਾ ਹੋਇਆ (ਜਗਤ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tú Mismo te ocupas y das seguimiento a lo que has creado,"