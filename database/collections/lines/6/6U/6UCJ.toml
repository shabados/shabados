[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਾਤ ਕੀ ਬਾਤ ਨ ਮਾਨੀ ਕਛੂ; ਤਜਿ ਰੋਵਤ ਹੀ ਰਨਿਵਾਸਹਿ ਆਯੋ ॥"
page = 909

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He did not agree to his mother, and, leaving her in distress, he came to the palace of Rani."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੇ) ਮਾਤਾ ਦੀ ਕੁਝ ਗੱਲ ਨਾ ਮੰਨੀ (ਅਤੇ ਉਸ ਨੂੰ) ਰੋਂਦਿਆਂ ਛਡ ਕੇ ਰਣਵਾਸ ਵਿਚ ਆਇਆ।"