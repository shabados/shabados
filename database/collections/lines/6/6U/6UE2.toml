[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਥ. ਤ ਪਰ ਸਕਯਥ; ਹਥ ਲਗਹਿ. ਗੁਰ ਅਮਰ ਪਯ ॥"
page = 1394
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Supremely fruitful are those hands, that touch the feet of Guru Amar Dass."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਸਫਲ ਹਨ ਹੱਥ, ਜੇਕਰ ਹੱਥ ਗੁਰੂ ਅਮਰਦਾਸ ਦੇ ਪੈਰਾਂ ਨੂੰ ਪਰਸਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Supremely fruitful are the hands which touch the feet of Guru Amar Daas."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਾਥ ਤਬ ਵਿਸ਼ੇਸ਼ ਕਰ ਸਕਾਰਥੇ ਹੋਤੇ ਹੈਂ ਜਬ ਸ੍ਰੀ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਕੇ (ਪਯ) ਚਰਨ ਕਮਲੋਂ ਸਾਥ ਹਾਥ ਲਗੇਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਹੱਥ ਸਫਲੇ ਹਨ, ਜੋ ਹੱਥ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਦੇ ਚਰਨਾਂ ਤੇ ਲੱਗਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰ ਅਮਰ ਪਯ = ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਦੇ ਪੈਰਾਂ ਉੱਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Supremamente fructíferas son las manos que logran tocar los Pies de Guru Amar Das."