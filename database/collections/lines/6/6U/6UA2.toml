[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨੀ ਗਤਿ; ਆਪਿ ਜਾਨੈ ॥"
page = 894
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His state, He Himself knows."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਅਵਸਥਾ ਨੂੰ ਉਹ ਆਪੇ ਹੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Only He Himself knows His own state."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰਮੇਸ੍ਵਰ ਅਪਨੀ ਗਤੀ ਆਪ ਹੀ ਜਾਨਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪਰਮਾਤਮਾ ਕਿਹੋ ਜਿਹਾ ਹੈ-ਇਹ ਗੱਲ ਉਹ ਆਪ ਹੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਤਿ = ਹਾਲਤ। ਜਾਨੈ = ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo Tú conoces Tu Propio Estado;"