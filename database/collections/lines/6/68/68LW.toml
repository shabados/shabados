[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਿਕ ਜੀਅ; ਜਾ ਕੇ ਗ੍ਰਿਹ ਮਾਹਿ ॥"
page = 1236
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There are millions of beings in His Home."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾਂ ਹੀ ਹਨ ਜੀਵ ਉਸ ਦੇ ਘਰ ਵਿੱਚ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many beings are in His home."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਨੰਤ ਹੀ ਜੀਅ ਜਿਸ ਕੇ ਸੰਸਾਰ ਗ੍ਰਹ ਮੇਂ ਰਮ ਰਹੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੰਤ ਜਨੋ! (ਉਹ ਪਰਮਾਤਮਾ ਐਸਾ ਗ੍ਰਿਹਸਤੀ ਹੈ) ਕਿ ਉਸ ਦੇ ਘਰ ਵਿਚ ਅਨੇਕਾਂ ਹੀ ਜੀਵ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ = (ਲਫ਼ਜ਼ 'ਜੀਉ' ਤੋਂ ਬਹੁ-ਵਚਨ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones son las criaturas en el Reino de Su Hogar, sí,"