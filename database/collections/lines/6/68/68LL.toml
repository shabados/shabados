data = "ਮਾਰ ਜਬੈ ਸੈਨਾ ਲਈ; ਤਬੈ ਦੈਤ ਇਹ ਕੀਨ ॥"
page = 91

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When his army was killed by Chandi, Raktavija did this:,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ (ਚੰਡੀ ਨੇ ਦੈਂਤਾਂ ਦੀ) ਫ਼ੌਜ ਮਾਰ ਲਈ, ਤਦੋਂ (ਰਕਤ-ਬੀਜ) ਨੇ ਇਹ ਕੰਮ ਕੀਤਾ"