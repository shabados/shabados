[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਕਾਮੀ; ਕਾਮਿ ਲੁਭਾਵੈ ॥"
page = 629
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As a lustful man is enticed by lust,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਵਿਸ਼ੈਈ ਬੰਦਾ ਵਿਸ਼ੇ ਨੂੰ ਲਲਚਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Just as the lustful man is enticed by lust,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਕਾਮੀ ਪੁਰਸ਼ ਕਾਮਨੀ ਵਾ ਕਾਮ ਵਿਖੇ ਹੀ ਲੋਭਾਇਮਾਨ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਵੇਂ ਕੋਈ ਵਿਸ਼ਈ ਮਨੁੱਖ ਕਾਮ-ਵਾਸ਼ਨਾ ਵਿਚ ਹੀ ਮਗਨ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾਮੀ = ਵਿਸ਼ਈ ਮਨੁੱਖ। ਕਾਮਿ = ਕਾਮ-ਵਾਸ਼ਨਾ ਵਿਚ। ਲੁਭਾਵੈ = ਮਗਨ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así de imponente como es el llamado de la carne para el lujurioso,"