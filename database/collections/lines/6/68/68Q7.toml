[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਘੁ ਵਰਸੈ; ਸਭਨੀ ਥਾਈ ॥"
page = 105
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The rain falls at all the places."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੀਆਂ ਥਾਵਾਂ ਤੇ ਮੀਹ ਵਰ੍ਹਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the rain is falling everywhere."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਮੇਘ ਸਰਬ ਅਸਥਾਨ ਬਰਸਤਾ ਹੈ ਵਾ ਜਬ ਪ੍ਰਮੇਸ੍ਵਰ ਜੀ ਦਯਾਲੂ ਹੂਏ ਤਬ ਗੁਰੂ ਰੂਪੀ ਮੇਘ ਨੇ ਸਰਬ ਅਧਕਾਰੀਓਂ ਕੋ ਉਪਦੇਸੁ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਾਂ) ਬੱਦਲ (ਉੱਚੇ ਨੀਵੇਂ) ਸਭ ਥਾਵਾਂ ਤੇ ਵਰਖਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੇਘੁ = ਬੱਦਲ। ਵਰਸੈ = ਵਰ੍ਹਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y la roció por todas partes."