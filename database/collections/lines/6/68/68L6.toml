type = "primary"
data = "ਕਿਨ੍ਰਨ ਕਿਨ੍ਰਦੇਵ ਪਹਚਾਨਾ ॥੧੪੧॥"
page = 624

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Yakshas and Kinnar thought of him as their king.141."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਕਿੰਨਰਾਂ ਨੇ ਕਿੰਨਰ ਰਾਜਾ ਦੇ ਰੂਪ ਵਿਚ ਪਛਾਣਿਆ ॥੧੪੧॥"