[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਚੁ ਵਣਜੁ ਗੁਰੁ ਹਟੀਐ; ਸਾਧਸੰਗਤਿ ਕੀਰਤਿ ਕਰਤਾਰਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The true merchandise is available in the Guru's shop, the holy congregation, wherein praises and glory of the Lord are sung."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸੱਚਾ ਵਣਜ ਗੁਰੂ ਦੀ ਹੱਟੀ ਤੇ ਹੁੰਦਾ ਹੈ (ਜੋ) ਸਾਧ ਸੰਗਤ ਵਿਖੇ ਹੈ, (ਓਥੇ ਵਪਾਰ) ਕਰਤਾਰ ਦੇ ਕੀਰਤਨ ਦਾ ਹੁੰਦਾ ਹੈ, (ਅਤੇ)"