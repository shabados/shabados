[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਸਦਾ ਸੋਹਾਗਣੀ; ਜਿਨ ਜੋਤੀ ਜੋਤਿ ਸਮਾਇ ॥੪॥੨॥੧੯॥"
page = 157
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nanak, they are, ever, happy married wives, whom the luminous lord blends with his light."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਨਕ ਉਹ ਸਦੀਵ ਹੀ ਖੁਸਬਾਸ਼ ਵਿਆਹੁਤਾ ਪਤਨੀਆਂ ਹਨ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਪ੍ਰਕਾਸ਼ਵਾਨ ਪ੍ਰਭੂ ਆਪਣੇ ਪ੍ਰਕਾਸ਼ ਨਾਲ ਅਭੇਦ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, they are forever the happy soul-brides, whose light merges into His Light. ||4||2||19||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਸੋ ਜੀਵ ਰੂਪ ਇਸਤ੍ਰੀਆਂ ਸਦਾ ਸੋਹਾਗਣੀ ਹੈਂ, ਜਿਨ ਕੀ ਹੇ ਜੋਤੀ ਰੂਪ ਵਾਹਗੁਰੂ! ਤੇਰੇ ਮੇਂ ਜੋਤ ਸਮਾਈ ਅਰਥਾਤ ਅਭੇਦ ਹੂਈ ਹੈ॥੪॥੨॥੧੯॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਿਨ੍ਹਾਂ ਜੀਵ-ਇਸਤ੍ਰੀਆਂ ਦੀ ਜੋਤਿ (ਸੁਰਤਿ) ਸਦਾ ਜੋਤਿ-ਰੂਪ ਪ੍ਰਭੂ ਵਿਚ ਟਿਕੀ ਰਹਿੰਦੀ ਹੈ, ਉਹ ਬੜੀਆਂ ਭਾਗਾਂ ਵਾਲੀਆਂ ਹਨ ॥੪॥੨॥੧੯॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨ = ਜਿਨ੍ਹਾਂ ਦੀ। ਜੋਤੀ = ਜੋਤਿ-ਸੂਰਪ ਪ੍ਰਭੂ ਵਿਚ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Nanak, sólo será para siempre bendecido, aquél cuya Alma se inmerja en el Alma Universal. (4-2-19)"