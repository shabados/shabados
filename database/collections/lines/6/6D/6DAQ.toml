[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚੁਨਿ ਚੁਨਿ ਚੋਰ ਸਬੈ ਗਹਿ ਘਾਏ ॥"
page = 65

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many years elapsed in this way, all the wicked persons (thieves) were spotted, caught and killed."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਅਤੇ ਇਲਾਕੇ ਵਿਚੋਂ) ਲਭ ਲਭ ਕੇ ਸਾਰੇ ਚੋਰ ਪਕੜ ਕੇ ਮਾਰ ਦਿੱਤੇ।"