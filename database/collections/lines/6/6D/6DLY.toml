[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਿਰਿਯੋ ਝੂੰਮਿ ਕੈ ਭੂੰਮਿ, ਆਖੈਂ ਨ ਖੋਲੈ ॥੨੧॥"
page = 1002

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He sat down with his head hanging, then he swung and fell flat witheyes closed.(21)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਘੁਮੇਰੀ ਖਾ ਕੇ ਧਰਤੀ ਉਤੇ ਡਿਗ ਪਿਆ ਅਤੇ ਅੱਖਾਂ ਨਾ ਖੋਲ੍ਹੀਆਂ ॥੨੧॥"