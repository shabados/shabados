[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸੀ ਜਾਨਿ ਪਾਈ ॥"
page = 1005
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thus have I understood,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਐਸ ਤਰ੍ਹਾਂ ਸਮਝਿਆ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This is what I have come to know."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮਨੇ ਤੌ ਐਸੀ ਬਾਤ ਜਾਨ ਪਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤਾਂ ਇਉਂ ਸਮਝ ਲਿਆ ਹੈ"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਐਸੀ = ਇਉਂ। ਜਾਨਿ ਪਾਈ = ਅਸਾਂ ਸਮਝੀ ਹੈ, ਮੈਂ ਸਮਝੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Ahora conozco la Verdad,"