[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਦਮ ਨਾਥ ਪਦਮਾਛ ਨਵਲ, ਨਾਰਾਇਣ ਨਰਿਹਰਿ ॥"
page = 130

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Ever-new Lord with lotus-eyes, He is the Lord of men."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਲਕਸ਼ਮੀ ਦੇ ਸੁਆਮੀ, ਕਮਲ ਵਰਗੀਆਂ ਅੱਖਾਂ ਵਾਲੇ, ਨਿੱਤ ਨਵੇਂ ਨਰ-ਹਰਿ ਨਾਰਾਇਣ ਰੂਪ ਵਾਲੇ,"