data = "ਦਗ਼ਾ ਮੇ ਦਿਹਦ ਪਾਸਬਾਨਾਨ ਸ਼ਾਹ ॥੪੩॥"
page = 1426

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And this way deceived the king’s guards.(43)"

[[content]]
