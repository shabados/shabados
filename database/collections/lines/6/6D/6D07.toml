[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਨਿ ਅੰਧਲੀ ਲੋਈ, ਬੇਪੀਰਿ ॥"
page = 871
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Hearken, O blind and guideless Loi."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਣ ਹੇ ਅੰਨ੍ਹੀ ਅਤੇ ਨਿਗੁਰੀ ਲੋਈਏ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Listen, O blind and unguided Loi:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੁਣ! ਅਗਿਆਨ ਕਰ ਬੇ-ਮੁਰਸਦੀ ਲੋਈ!"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਅੰਨ੍ਹੀ ਨਿਗੁਰੀ ਲੋਈ! ਸੁਣ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੇਪੀਰਿ = ਨਿਗੁਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice Kabir, escucha, oh ciega esposa,"