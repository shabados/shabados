[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਊਚੇ ਤੇ ਊਚਾ; ਭਗਵੰਤ ॥"
page = 268
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Thou, O Wealthy Lord, art the Highest of the high."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹੇ ਧਨਾਢ ਸਾਹਿਬ! ਬੁਲੰਦਾ ਦਾ ਪਰਮ ਬੁਲੰਦ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Highest of the High, Most Generous God,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਉਂਕਿ ਤੂੰ ਸਰਬ ਬ੍ਰਹਮਾਦੀ ਊਚਿਓਂ ਸੇ ਭੀ ਊਚਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਤੂੰ ਸਭ ਤੋਂ ਉੱਚਾ ਭਗਵਾਨ ਹੈਂ।"

