[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਮਿਲਿਐ; ਨਹ ਜੋਹੈ ਮਾਈ ॥"
page = 1075
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Meeting with the Guru, mammon eyes one not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਨਾਲ ਮਿਲਣ ਦੁਆਰਾ ਮੋਹਣੀ ਬੰਦੇ ਨੂੰ ਨਹੀਂ ਤਕਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Meeting with the Guru, one is not watched by Maya."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰੋਂ ਸਾਥ ਮਿਲਣੇ ਤੇ (ਮਾਈ) ਮਾਇਆ ਨਹੀਂ ਦੇਖ ਸਕਤੀ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਉਤੇ ਮਾਇਆ ਆਪਣਾ ਪ੍ਰਭਾਵ ਨਹੀਂ ਪਾ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਹ ਜੋਹੈ = ਤੱਕ ਨਹੀਂ ਸਕਦੀ, ਘਰ ਨਹੀਂ ਸਕਦੀ। ਮਾਈ = ਮਾਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sí, encontrando al Guru, Maya no le clava su mirada,"