[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਬਾਨੀ ਮਹਿ; ਅੰਮ੍ਰਿਤ ਬਾਨੀ ॥"
page = 266
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of all the speeches the ambrosial speech is,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਬਚਨ-ਬਿਲਾਸਾਂ ਵਿਚੋਂ ਅੰਮ੍ਰਿਤਮਈ ਬਚਨ-ਬਿਲਾਸ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Of all speech, the most ambrosial speech"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਪੂਰਣ ਬਾਣੀਓਂ ਮੇਂ ਅੰਮ੍ਰਿਤ ਰੂਪ ਬਾਣੀ ਇਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪ੍ਰਭੂ ਦੇ ਜਸ ਦੀ) ਆਤਮਕ ਜੀਵਨ ਦੇਣ ਵਾਲੀ ਬਾਣੀ ਹੋਰ ਸਭ ਬਾਣੀਆਂ ਨਾਲੋਂ ਸੁੰਦਰ ਹੈ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਮ੍ਰਿਤ = ਅਮਰ ਕਰਨ ਵਾਲੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De todo lo que puede decirse,"