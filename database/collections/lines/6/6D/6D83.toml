[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਅਪੁਨੇ ਕਉ; ਨਿਤ ਨਿਤ ਜਾਪਿ ॥੨॥"
page = 1184
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and ever, ever meditate on my Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਹਮੇਸ਼ਾਂ ਹਮੇਸ਼ਾਂ ਹੀ ਮੈਂ ਆਪਣੇ ਗੁਰਾਂ ਦਾ ਆਰਾਧਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I meditate continually, continuously, on my Guru. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਮ ਅਪੁਨੇ ਗੁਰੋਂ ਕੋ ਨਿਤਾਪ੍ਰਤਿ ਜਪਤੇ ਹੈਂ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਤੂੰ ਭੀ ਸਦਾ ਹੀ ਸਦਾ ਹੀ ਆਪਣੇ ਗੁਰੂ ਨੂੰ ਯਾਦ ਕਰਦਾ ਰਹੁ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਉ = ਨੂੰ। ਜਾਪਿ = ਜਪਿਆ ਕਰ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y nos hace meditar en el Guru. (2)"