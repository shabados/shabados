[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜਨ; ਸਗਲ ਉਧਾਰੇ ਸੰਗ ਕੇ ॥"
page = 1208
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God's slave emancipates all his associates."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਦਾ ਗੋਲਾ ਆਪਣੇ ਸਾਰੇ ਸੰਗੀਆਂ ਦਾ ਪਾਰ ਉਤਾਰਾ ਕਰ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord's humble servant saves those who accompany him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਜਨ ਸੰਤੋਂ ਨੇ ਅਪਨੇ ਸੰਗ ਕੇ ਸਮੂਹ ਉਧਾਰ ਲੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਸੰਤ ਜਨ (ਆਪਣੇ) ਨਾਲ ਬੈਠਣ ਵਾਲੇ ਸਾਰਿਆਂ ਨੂੰ ਹੀ ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਲੰਘਾ ਲੈਂਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਰਿ ਜਨ = ਹਰੀ ਦੇ ਜਨ, ਪਰਮਾਤਮਾ ਦੇ ਸੰਤ ਜਨ। ਸਗਲ = ਸਾਰੇ। ਉਧਾਰੇ = ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ ਪਾਰ ਲੰਘਾ ਲੈਂਦੇ ਹਨ। ਸੰਗ ਕੇ = ਆਪਣੇ ਨਾਲ ਦੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor de lo Santos emancipa a todos con los que llega,"