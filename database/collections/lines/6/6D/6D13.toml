[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਸ ਕਉ; ਕਰਿ ਕਛੁ ਨ ਜਨਾਵੈ ॥"
page = 286
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He ought not to show himself in any way."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ ਆਪਣੇ ਆਪ ਨੂੰ ਕਿਸੇ ਤਰ੍ਹਾਂ ਭੀ ਜਤਲਾਉਣਾ ਨਹੀਂ ਚਾਹੀਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is not to call attention to himself in any way."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਆਪਨੇ ਆਪ ਕੋ ਕਿਸੀ ਪ੍ਰਕਾਰ ਕੁਛ ਜਨਾਵੇ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਆਪਣੇ ਆਪ ਨੂੰ ਵੱਡਾ ਨਹੀਂ ਜਤਾਉਂਦਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਪਸ ਕਉ = ਆਪਣੇ ਆਪ ਨੂੰ। ਜਨਾਵੈ = ਜਣਾਉਂਦਾ, ਜਤਾਉਂਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No sentirá orgullo por sus propios actos"