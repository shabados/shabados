[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਲ ਫਾਸ ਤੇ, ਤਾਹਿ ਉਬਾਰਾ ॥"
page = 1388

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He, who remembered Thee even once, Thou didst protect him from the noose of death"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ (ਤੁਸੀਂ) ਕਾਲ ਦੀ ਫਾਹੀ ਤੋਂ ਬਚਾ ਲਿਆ।"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਕਾਲ ਫਾਸ ਤੇ; ਤਾਹਿ ਉਬਾਰਾ ॥"