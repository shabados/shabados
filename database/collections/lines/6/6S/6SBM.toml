[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਿਤ੍ਰ ਭਏ ਘਰ ਆਂਙਨ ਦੇਖਿ ਗਚੇ ਤਹ ਕੇ ਅਰੁ ਚਿਤ ਭ੍ਰਮਾਈ ॥"
page = 388

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Seeing the house and courtyard all are being allured like the portraits"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਚੂਨੇ) ਗਚ ਕੀਤੇ ਹੋਏ ਘਰਾਂ ਉਤੇ ਚਿਤਰ ਬਣੇ ਹੋਏ ਹਨ ਅਤੇ ਵੇਹੜੇ ਵੀ (ਸਜੇ ਹੋਏ ਹਨ) (ਜਿਨ੍ਹਾਂ ਨੂੰ ਵੇਖ ਕੇ) ਚਿਤ ਭਰਮਾ ਜਾਂਦਾ ਹੈ।"