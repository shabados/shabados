[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਹੁ ਮਨੁ ਡੋਲਤ; ਤਉ ਠਹਰਾਵੈ ॥"
page = 1344
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Then alone this wobbling mind becomes equipoised."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤਾਂ ਹੀ ਇਹ ਡੋਲਦਾ ਹੋਇਆ ਮਨੂਆ ਅਸਥਿਰ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "This wobbling, unsteady mind is stabilized,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹੁ ਮਨ ਡੋਲਤਾ ਹੂਆ, ਤਬ ਠਹਿਰਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਦੋਂ ਮਨੁੱਖ ਦਾ ਇਹ ਮਨ ਮਾਇਆ ਪਿੱਛੇ ਭਟਕਣੋਂ ਹਟ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y la mente intranquila se estabiliza,"