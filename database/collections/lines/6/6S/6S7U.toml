[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਨੁ ਘਾਯਲ ਘਾਇਨ ਲਗੇ; ਗਿਰੈ ਉਠੈ ਬਰਰਾਇ ॥੨੩॥"
page = 921

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Like the injured man, tried to get up but fell down again.(23)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਘਾਇਲ ਘਾਉ ਲਗਣ ਤੇ ਡਿਗਦਾ, ਉਠਦਾ ਅਤੇ ਬਰੜਾਉਂਦਾ ਹੋਵੇ ॥੨੩॥"