type = "primary"
data = "ਬਹੁ ਮੂੰਠੀ ਭਰਿ ਰਾਖਿ ਉਡਾਈ ॥"
page = 895

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the woman ascertained goldsmith’s secret, she picked up a handful of dust and blew on his head saying,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਸੁਆਹ ਦੀਆਂ ਬਹੁਤ ਸਾਰੀਆਂ ਮੁਠੀਆਂ ਭਰ ਕੇ ਉਡਾਈਆਂ।"