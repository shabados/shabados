[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾਹੇ ਜਨਮੁ ਗਵਾਵਹੁ; ਵੈਰਿ ਵਾਦਿ ॥੨॥"
page = 1176
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Why waste thou thy life through enmity and strife?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦੁਸ਼ਮਨੀ ਅਤੇ ਬਖੇਵੇ ਰਾਹੀਂ ਤੂੰ ਜੀਵਨ ਨੂੰ ਕਿਉਂ ਨਸ਼ਟ ਕਰਦਾ ਹੈ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Why waste your life in hatred, vengeance and conflict? ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਸ ਵਾਸਤੇ ਵੈਰ ਵਿਰੋਧ ਮੇਂ ਜਨਮ ਗਵਾਵਤੇ ਹੋ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵੈਰ ਵਿਚ ਵਿਰੋਧ ਵਿਚ ਕਿਉਂ ਆਪਣੀ ਜ਼ਿੰਦਗੀ ਗਵਾ ਰਹੇ ਹੋ? (ਗੁਰੂ ਦੀ ਸਰਨ ਪਵੋ) ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵੈਰਿ = ਵੈਰ ਵਿਚ। ਵਾਦਿ = ਝਗੜੇ ਵਿਚ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Por qué, oh ser, desperdicias este nacimiento humano y te involucras en los celos y la contienda? (2)"