[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮੁ; ਨਿਕਟਿ ਕਰਿ ਪੇਖੁ ॥"
page = 295
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "See the Supreme Lord as near thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸ਼ਰੋਮਣੀ ਸਾਹਿਬ ਨੂੰ ਆਪਣੇ ਨੇੜੇ ਕਰਕੇ ਵੇਖ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "see the Supreme Lord God near you."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਰੁ ਪਾਰਬ੍ਰਹਮ ਕੋ ਅਪਣੇ ਨਿਕਟਿ ਕਰਿ ਦੇਖੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ, ਅਕਾਲ ਪੁਰਖ ਨੂੰ (ਹਰ ਥਾਂ) ਨੇੜੇ ਜਾਣ ਕੇ ਵੇਖ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਕਟਿ = ਨੇੜੇ। ਕਰਿ = ਕਰ ਕੇ। ਪੇਖੁ = ਵੇਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y ve al Supremo Señor cerca de ti."