[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਨਿਧਾਨ ਸੁਖ ਪਾਇਆ ॥"
page = 626
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have obtained all the treasure and comforts,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਾਰੇ ਖਜਾਨੇ ਅਤੇ ਸੁੱਖ ਆਰਾਮ ਪਾ ਲਏ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have all treasures and comforts,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਰਬ ਸੁਖੋਂ ਕਾ ਖਜ਼ਾਨਾ ਰੂਪ ਗੁਰ ਉਪਦੇਸ਼ ਪਾਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੇ ਸਾਰੇ (ਆਤਮਕ) ਖ਼ਜ਼ਾਨੇ ਸਾਰੇ ਆਨੰਦ ਪ੍ਰਾਪਤ ਕਰ ਲਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਧਾਨ = ਖ਼ਜ਼ਾਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Contemplo al Guru en el que"