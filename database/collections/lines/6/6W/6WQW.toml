[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਿਨਸੁ ਰੈਣਿ; ਬਰਤ ਅਰੁ ਭੇਦਾ ॥"
page = 237
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the day, the night, the fasting and their differentiation,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਦਿਨ, ਰਾਤ, ਉਪਹਾਸ ਅਤੇ ਉਹਨਾਂ ਦੇ ਫ਼ਰਕ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "day and night, fasting days and their determination;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦਿਨ ਔਰ ਰਾਤ੍ਰੀ ਪੁਨਾ ਬ੍ਰਤ ਤਥਾ ਊਚ ਨੀਚ ਬਰਣ ਆਸ੍ਰਮ ਕੇ ਜੋ ਭੇਦ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਰਤ ਆਦਿਕ ਵਖ ਵਖ ਕਿਸਮ ਦੀਆਂ ਮਰਯਾਦਾ;"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੈਣਿ = ਰਾਤ। ਭੇਦਾ = ਵਖ ਵਖ ਮਰਯਾਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El día y la noche, los días señalados para ayunar, y otros días apartados para festividades especiales."