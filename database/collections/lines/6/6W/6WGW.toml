[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹਰਿ ਨਾਮੁ ਅਮੋਲਾ ॥"
page = 407
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lord God's Name is priceless,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦਾ ਨਾਮ ਅਮੋਲਕ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Name of the Lord, Har, Har, is priceless."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰਿ ਹਰਿ ਨਾਮ ਅਮੋਲਕ ਜਿਸ ਨੇ ਜਪਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਪਰਮਾਤਮਾ ਦਾ ਅਮੋਲਕ ਨਾਮ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਮੋਲਾ = ਜੇਹੜਾ ਕਿਸੇ ਭੀ ਮੁੱਲ ਤੋਂ ਨਾਹ ਮਿਲ ਸਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que atesora el Invaluable Nombre del Señor,"