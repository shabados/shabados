data = "ਹਰਿ ਦੁਆਰੈ ਖਰੀਆ ॥"
page = 746
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and stands before the God's gate,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਰੱਬ ਦੇ ਦਰ ਤੇ ਜਾ ਖੜਾ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and stands before the Lord's Gate."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਸੰਤ ਹਰੀ ਕੇ ਦੁਆਰੇ ਖੜੇ ਹੈਂ, ਭਾਵ ਜੋ ਪ੍ਰਾਪਤੀ ਵਾਲੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਪ੍ਰਭੂ ਦੇ ਦਰ ਤੇ ਆ ਖਲੋਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੁਆਰੈ = ਦਰ ਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y se para ante la Puerta del Señor,"