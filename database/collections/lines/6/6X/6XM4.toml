[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਆਪੇ ਹੋਇ ਦਇਆਲੁ; ਤਾਂ ਭਗਤ ਸੰਗੁ ਪਾਈਐ ॥੯॥"
page = 520
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Lord Himself becomes merciful, then in the society of His devotees attained."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਮਾਲਕ ਖੁਦ ਮਿਹਰਬਾਨ ਹੁੰਦਾ ਹੈ, ਤਦ ਹੀ ਅਨੁਰਾਗੀਆਂ (ਭਗਤਾਂ) ਦੀ ਸੰਗਤ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Lord Himself becomes merciful, then we attain the Society of His devotees. ||9||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਤੂੰ ਆਪ ਹੀ ਦਿਆਲ ਹੋਤਾ ਹੈਂ ਤਬ ਸਾਧੋਂ ਕਾ ਸੰਗ ਪਾਈਤਾ ਹੈ॥੯॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਦੋਂ ਪ੍ਰਭੂ ਆਪ ਹੀ ਦਿਆਲ ਹੁੰਦਾ ਹੈ ਤਾਂ ਉਸ ਦੇ ਭਗਤਾਂ ਦੀ ਸੰਗਤ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ ॥੯॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo nos encontramos con la Sociedad de los Santos cuando el Señor Mismo nos bendice con ella. (9)"