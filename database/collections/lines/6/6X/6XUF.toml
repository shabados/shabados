[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਬਿਨੁ; ਸੋਝੀ ਬੂਝ. ਨ ਹੋਇ ॥"
page = 355
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Guru this understanding and knowledge is not obtained,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਬਗੈਰ ਇਹ ਸਮਝ ਅਤੇ ਗਿਆਤ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Guru, understanding and realization are not obtained;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵਾਸਤਵ ਬਿਚਾਰੀਏ ਤੋ ਸੋ ਸਚੇ ਗੁਰਾਂ ਤੇ ਪੂਛੇ ਤੇ ਬਿਨਾਂ (ਬੂਝ), ਭਾਵ ਅਪ੍ਰੋਖ ਗਿਆਨ ਨਹੀਂ ਹੋਤਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਇਹ ਸਮਝ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਣ ਤੋਂ ਬਿਨਾ ਨਹੀਂ ਆਉਂਦੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬੂਝ = ਸਮਝ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nadie es despertado sin la Luz del Guru,"