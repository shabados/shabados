[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਡੀ ਵਡਿਆਈ ਵਡੇ ਕੀ; ਗੁਰਮੁਖਿ ਆਲਾਏ ॥੭॥"
page = 303
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru-ward utters the great glory of the great Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ-ਸਮਰਪਣ ਵਿਸ਼ਾਲ ਪ੍ਰਭੂ ਦੀ ਵਿਸ਼ਾਲ ਪ੍ਰਭੁਤਾ ਉਚਾਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh chants the glorious greatness of the great Lord God. ||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਵੱਡੇ ਕੀ ਜੋ ਵੱਡੀ ਵਡਿਆਈ ਹੈ ਗੁਰਮੁਖਿ ਹੀ ਤਿਸ ਕੋ (ਆਲਾਏ) ਉਚਾਰਤੇ ਹੈਂ॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੀਵ ਸਤਿਗੁਰੂ ਦੇ ਸਨਮੁਖ ਹੁੰਦਾ ਹੈ, ਉਹੀ ਵੱਡੇ ਪ੍ਰਭੂ ਦੀ ਵੱਡੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਕਰਨ ਲੱਗ ਪੈਂਦਾ ਹੈ ॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਲਾਏ = ਉਚਾਰਦਾ ਹੈ ॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero solamente uno puede participar en ella, si voltea su mirada hacia Dios. (7)"