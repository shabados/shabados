[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਇਸੁ ਮਾਰੇ; ਤਿਸ ਕੀ ਤ੍ਰਿਸਨਾ ਬੁਝੈ ॥"
page = 238
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who kills it, has his desire quenched."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਇਸ ਨੂੰ ਨਸ਼ਟ ਕਰ ਦਿੰਦਾ ਹੈ ਉਸ ਦੀ ਖਾਹਿਸ਼ ਮਿਟ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who kills this has his desires quenched."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਜੋ ਇਸ ਕੋ ਮਾਰੇ ਤਿਸ ਕੀ ਤ੍ਰਿਸਨਾ ਬੁਝ ਜਾਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੇਹੜਾ ਮਨੁੱਖ ਇਸ ਮੇਰ-ਤੇਰ ਨੂੰ ਆਪਣੇ ਅੰਦਰੋਂ ਦੂਰ ਕਰ ਲੈਂਦਾ ਹੈ, ਉਸ ਦੀ ਮਾਇਆ ਦੀ ਤ੍ਰਿਸ਼ਨਾ ਮੁੱਕ ਜਾਂਦੀ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que elimina la dualidad, sacia su sed"