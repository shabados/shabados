[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕੇ ਸੇਵਕ; ਊਚ ਤੇ ਊਚੇ ॥"
page = 285
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Lord's slaves are the highest of the high."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਹਿਬ ਦੇ ਗੋਲੇ ਉਚਿੱਆਂ ਤੋਂ ਪਰਮ ਉੱਚੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The servant of God is the highest of the high."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪ੍ਰਭੂ ਕੇ ਸੇਵਕ ਸਰਬ ਊਚਿਓਂ ਸੇ ਊਚੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਿਉਂਕਿ) ਪ੍ਰਭੂ ਦੇ ਸੇਵਕ ਉੱਚਿਆਂ ਤੋਂ ਉਚੇ ਹੁੰਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél a quien Dios elige para Su Servicio,"