type = "primary"
data = "ਨਗਰ ਪਾਵਟਾ ਛੋਰਿ ਹਮ; ਆਏ ਤਹਾ ਉਤਾਲ ॥੨॥"
page = 896

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Leaving the City of Paonta, we came to this place.(2)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਸੀਂ ਪਾਉਂਟਾ ਨਗਰ ਨੂੰ ਛਡ ਕੇ ਜਲਦੀ ਨਾਲ ਉਸ ਥਾਂ ਉਤੇ ਆ ਗਏ ॥੨॥"