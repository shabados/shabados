[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪੈਠਿ ਪੈਠਿ ਗਏ ਤ੍ਰੀਆਲੈ; ਹਾਰਿ ਹਾਰਿ ਅਧੀਰ ॥"
page = 685

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "On this side they were falling on the earth and on that side the heavenly damsels getting agitated were putting wreaths around their necks and wedding them"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਹਾਰ ਹਾਰ ਕੇ ਅਧੀਰ ਹੋਏ (ਸੂਰਮੇ) ਰੰਨਵਾਸਾਂ ਵਿਚ ਵੜੀ ਜਾ ਰਹੇ ਸਨ।"