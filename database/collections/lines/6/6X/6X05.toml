[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸਹਿ ਭਲਾਈ; ਨਿਕਟਿ ਨ ਆਵੈ ॥"
page = 278
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "goodness does not draw near him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਚਗਿਆਈ ਉਸ ਦੇ ਨੇੜੇ ਨਹੀਂ ਲਗਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "goodness shall not draw near him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਨਿਕਟ ਭਲਿਆਈ ਨਹੀਂ ਆਵਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨੇਕੀ ਉਸ ਦੇ ਨੇੜੇ ਭੀ ਨਹੀਂ ਢੁੱਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸਹਿ = ਉਸ ਨੂੰ। ਨਿਕਟਿ = ਨੇੜੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que quiere ser reconocido como bueno, ahuyenta cualquier posibilidad de Bondad."