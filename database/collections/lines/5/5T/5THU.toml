[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੇ ਜੀਅ; ਚਲੈ ਤੁਹਾਰੈ ਸਾਥੀ ॥"
page = 260
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O man he shall go with thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੈ ਇਨਸਾਨ! ਉਹ ਤੇਰੇ ਨਾਲ ਜਾਵੇਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O soul, He alone shall go along with you."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜੀਵ! ਯਿਹੀ ਭਜਨ ਤੁਮਾਰੇ ਸੰਗ ਸਾਥੀ ਹੋ ਕਰ ਚਲੇਗਾ, ਭਾਵ ਮਿੱਤ੍ਰ ਸਮ ਸਹਾਇਕ ਹੋਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੀ ਯਾਦ ਨੇ ਹੀ ਤੇਰੇ ਨਾਲ ਜਾਣਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇ ਜੀਅ = ਹੇ ਜਿੰਦੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en Él que le hace Compañía a tu Alma siempre y para siempre."