[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਰੱਬ ਨੇ ਉਸਨੂੰ ਹਰ ਉੱਚੇ ਅਸਥਾਨ ਤੋ ਉਚੇਰਾ ਬਿਠਾਇਆ ਹੈ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਨਸ਼ਾਂਦਸ਼ ਜ਼ਿ ਹਰ ਬਰ-ਤਰੀਂ ਬਰ-ਤਰੀਂ ॥੩॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "And, has placed him on a higher place out of all high places. (3)"