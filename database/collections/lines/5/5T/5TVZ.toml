data = "ਐਸੇ ਕਹਤ ਜੁਲਾਹੋ ਜਾਇ ॥"
page = 925

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Then he started his journey saying, ‘Come flying and get entrapped.’"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਸ ਤਰ੍ਹਾਂ ਕਹਿੰਦਾ ਹੋਇਆ ਜੁਲਾਹਾ ਤੁਰਦਾ ਜਾ ਰਿਹਾ ਸੀ।"