[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਿਸੰਤ ਜੀਤ ਜੀਤ ਕੈ; ਅਨੰਤ ਸੂਰਮਾ ਲਏ ॥੧੯॥"
page = 197

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Many people came running under the refuge of gods, and Suraj, who ends the night, conquered many warriors.19."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਨੰਤ ਸੂਰਮਿਆਂ ਨੂੰ ਸੂਰਜ ਨੇ ਜਿੱਤ ਲਿਆ ॥੧੯॥"