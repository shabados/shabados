[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਾ ਕੀ ਮਾਈ; ਕਾ ਕੋ ਬਾਪ ॥"
page = 188
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whose is this mother and whose this father?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਿਸ ਦੀ ਇਹ ਮਾਂ ਹੈ ਅਤੇ ਕਿਸ ਦਾ ਇਹ ਪਿਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whose mother is this? Whose father is this?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਕਿਸ ਕੀ ਮਾਈ ਔਰ ਕਿਸ ਕਾ ਪਿਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਅਸਲ ਵਿਚ ਸਦਾ ਲਈ) ਨਾਹ ਕੋਈ ਕਿਸੇ ਦੀ ਮਾਂ ਹੈ, ਨਾਹ ਕੋਈ ਕਿਸੇ ਦਾ ਪਿਉ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਾ ਕੀ = ਕਿਸ ਦੀ? ਕਾ ਕੋ = ਕਿਸ ਦਾ?"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿De quién es el padre? ¿De quién es la madre?"