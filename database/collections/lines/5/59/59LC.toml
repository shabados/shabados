[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾ ਇਹੁ ਤਪਾ ਕਹਾਵੈ ਸੇਖੁ ॥"
page = 871
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "It is not an ascetic, nor is it called a Sheikh."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਂ ਇਹ ਤਪੱਸਵੀ ਹੈ, ਨਾਂ ਹੀ ਇਹ ਸ਼ੇਖ ਆਖਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "It is not called a man of austere self-discipline, or a Shaykh."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਹੁ ਤਪਾ ਭੀ ਨਹੀਂ ਕਹਾਵਤਾ ਹੈ ਔਰ (ਸੇਖੁ) ਬਿਰਕਤ ਭੀ ਨਹੀਂ ਹੈ, ਵਾ ਸੇਖ ਜਾਤੀ ਭੀ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਪੇ, ਸ਼ੇਖ਼, ਸਭ ਵਿਚ ਇਹੀ ਹੈ; ਸਭ ਸਰੀਰਾਂ ਵਿਚ ਆ ਕੇ ਜੰਮਦਾ ਮਰਦਾ ਭੀ ਜਾਪਦਾ ਹੈ, ਫਿਰ ਭੀ ਸਦਾ ਲਈ) ਨਾਹ ਇਹ ਕੋਈ ਤਪਸ੍ਵੀ ਹੈ ਨਾਹ ਕੋਈ ਸ਼ੇਖ਼ ਹੈ;"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No es un ser austero ni tampoco un jeque;"