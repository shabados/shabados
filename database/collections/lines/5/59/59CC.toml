[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅੰਦਰਿ ਰੰਗੁ ਸਦਾ ਸਚਿਆਰਾ ॥"
page = 1057
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within their mind, they ever love the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਚਿੱਤ ਅੰਦਰ ਉਹ ਸਦੀਵ ਹੀ ਸੱਚੇ ਸਾਈਂ ਨੂੰ ਪਿਆਰ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Deep within, they love the True Lord forever."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਅੰਤਰ ਪ੍ਰੇਮ ਹੈ, ਸੋ ਸਦਾ ਸਚਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਪਿਆਰ ਹੈ, ਉਹ ਸਦਾ ਸੁਰਖ਼ਰੂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੰਗੁ = ਪਿਆਰ। ਸਚਿਆਰਾ = {ਸਚ-ਆਲਯ} ਸੁਰਖ਼ਰੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Con ellos está el Amor del Uno Verdadero"