[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਲਾ; ਤਾ ਕੈ ਲਵੈ. ਨ ਕੋਊ ॥"
page = 252
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "L: There is none equal to Him. He is but One, there shall not be another."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲ-ਉਸ ਦੇ ਬਰਾਬਰ ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "LALLA: There is no one equal to Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਲਲੇ ਅਖਰ ਦ੍ਵਾਰਾ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਪਰਮੇਸ੍ਵਰ ਕੇ (ਲਵੈ) ਤੁੱਲ ਵਾ ਪਾਸ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪਰਮਾਤਮਾ ਦੇ ਬਰਾਬਰ ਦਾ ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਵੈ = ਬਰਾਬਰ ਦਾ, ਨੇੜੇ ਤੇੜੇ ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "LALA: No hay nadie que iguale al Señor."