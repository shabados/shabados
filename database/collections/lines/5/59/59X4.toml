[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜੋਗੀ ਦੇਖਿ ਚਲਿਤ੍ਰ ਨੋ; ਮਨ ਵਿਚਿ ਰਿਸਕਿ ਘਨੇਰੀ ਖਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Seeing this miracle, the yogis’ anger was aroused."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੋਗੀਆਂ ਨੇ (ਇਸ) ਕੌਤਕ ਨੂੰ ਦੇਖਕੇ ਮਨ ਵਿਖੇ ਘਣੀ ਈਰਖਾ ਖਾਧੀ।"