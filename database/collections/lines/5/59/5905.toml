[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਨਾਮੁ ਪਰਾਪਤਿ ਹੋਇ ॥੪॥੭॥"
page = 1129
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "then alone, O Nanak, the man receives the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਤਾਂ ਹੀ, ਹੇ ਨਾਨਕ! ਇਨਸਾਨ ਨਾਮ ਨੂੰ ਪਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, then the mortals receive the Naam. ||4||7||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਉਸੀ ਪੁਰਸ ਕੋ ਨਾਮ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥੪॥੭॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! (ਉਸ ਨੂੰ ਹੀ ਉਸ ਦਾ) ਨਾਮ ਮਿਲਦਾ ਹੈ ॥੪॥੭॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਨਕ = ਹੇ ਨਾਨਕ! ॥੪॥੭॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "dice Nanak, el Nombre es Lo que uno obtiene. (4-7)"