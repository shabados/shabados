data = "ਸਭ ਸ੍ਰੀ ਨਾਮ ਤੁਪਕ ਕੇ ਮਾਨੋ ॥੮੫੬॥"
page = 765

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the word “Dvarkendrani”, then “Jaachar-pati and shatru” and know all the names of Tupak.856."

