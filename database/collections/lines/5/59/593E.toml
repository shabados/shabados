[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮੁ; ਵਸਿਆ ਮਨਿ ਆਇ ॥੧॥"
page = 1151
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The transcendent Lord comes to abide in their mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਪ੍ਰਭੂ ਆ ਕੇ ਉਹਨਾਂ ਦੇ ਅੰਤਰ ਆਤਮੇ ਟਿਕ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Lord God comes to dwell in their minds. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਿਯੋਂ ਕਿ (ਪਾਰਬ੍ਰਹਮੁ) ਪਰਮੇਸ੍ਵਰ ਨੇ ਤਿਨ ਕੇ ਮਨ ਮੇਂ ਆਇ ਕਰ ਨਿਵਾਸ ਕੀਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਮਨੁੱਖ ਦੇ) ਮਨ ਵਿਚ ਪਰਮਾਤਮਾ ਆ ਵੱਸਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਇ = ਆ ਕੇ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y el Señor, el Dios, llega a habitar en la mente. (1)"