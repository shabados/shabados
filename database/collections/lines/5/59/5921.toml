[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮਲਿਤ ਮੁਕਟ ਸਿਰ ਧਰੇ; ਪਰਮ ਬਾਣਣ ਕਹ ਸਾਧੇ ॥"
page = 694

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Wearing dirty clothes on the dirty body and heaving tied dirty ornaments with his chariot, with dirty crown on his head and the arrows fashioned for discharge"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮੈਲਾ ਜਿਹਾ ਮੁਕਟ ਸਿਰ ਉਤੇ ਧਾਰਨ ਕੀਤਾ ਹੋਇਆ ਹੈ ਅਤੇ ਬਹੁਤ ਚੰਗੇ ਬਾਣਾਂ ਨੂੰ ਸਾਧਿਆ ਹੋਇਆ ਹੈ।"