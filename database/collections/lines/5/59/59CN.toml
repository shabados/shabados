[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੋਹਨ ਸਿੰਘ ਜਿਹਿ ਨਾਮ ਭਟ; ਸੋਊ ਭਯੋ ਤਿਨ ਸੰਗਿ ॥"
page = 437

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "A warrior named Mohan Singh accompanied him"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਸੂਰਮੇ ਦਾ ਨਾਂ ਮੋਹਨ ਸਿੰਘ ਹੈ, ਉਹ ਵੀ ਉਨ੍ਹਾਂ ਨਾਲ ਹੈ।"