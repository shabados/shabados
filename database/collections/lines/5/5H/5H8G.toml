[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਖੁ ਪਰੋਇ; ਪ੍ਰਭੁ ਅਪੁਨੇ ਮਨਾ ॥"
page = 270
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "keep that Lord in deep within thy heart."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਸੁਆਮੀ ਨੂੰ ਆਪਣੇ ਦਿਲ ਅੰਦਰ ਗੁੰਥਨ ਕਰਕੇ ਰੱਖ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "keep God enshrined in your heart."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਨ! ਤਿਸ ਪ੍ਰਭੂ ਕੋ ਅਪਨੇ ਰਿਦੇ ਮੇਂ ਪਰੋਇ ਰਾਖੁ, ਭਾਵ ਤਿਸੀ ਕਾ ਸਿਮਰਨ ਕਰੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪ੍ਰਭੂ ਨੂੰ ਆਪਣੇ ਮਨ ਵਿਚ ਪ੍ਰੋ ਰੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "consérvalo enaltecido en tu corazón."