[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਠ ਪਹਰ; ਸਿਮਰਉ ਭਗਵੰਤ ॥"
page = 1338
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The eight watches through, contemplate I my Illustrious Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਠੇ ਪਹਿਰ, ਮੈਂ ਆਪਣੇ ਕੀਰਤੀਮਾਨ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Twenty-four hours a day, I meditate in remembrance on God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਭਗਵੰਤ ਕੋ ਮੈਂ ਆਠੋਂ ਪਹਰ ਸਿਮਰਨ ਕਰਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਤਾਹੀਏਂ) ਮੈਂ ਅੱਠੇ ਪਹਰ ਭਗਵਾਨ (ਦਾ ਨਾਮ) ਸਿਮਰਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਿਮਰਉ = ਸਿਮਰਉਂ, ਮੈਂ ਸਿਮਰਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Las veinticuatro horas del día, medito recordando a Dios."