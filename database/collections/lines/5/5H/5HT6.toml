type = "primary"
data = "ਪ੍ਰਭਾਤੀ ਮਹਲਾ ੩ ਬਿਭਾਸ ॥"
page = 1346
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Parbhati 3rd Guru. Bibhas"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭਾਤੀ ਤੀਜੀ ਪਾਤਿਸ਼ਾਹੀ। ਬਿਭਾਸ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Prabhaatee, Third Mehl, Bibhaas:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਪ੍ਰਭਾਤੀ/ਬਿਭਾਗ ਵਿੱਚ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਦੀ ਬਾਣੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Parbhati, Mejl Guru Amar Das, Tercer Canal Divino, Bibhas."