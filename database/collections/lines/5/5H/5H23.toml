[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਵਣਜੁ ਕਰਹੁ. ਮਖਸੂਦੁ ਲੈਹੁ; ਮਤ ਪਛੋਤਾਵਹੁ ॥"
page = 418
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Do thy dealings, gain thy object lest thou should regret afterwards."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਵਾਪਾਰ ਕਰ, ਆਪਣੇ ਮਨੋਰਥ ਨੂੰ ਪ੍ਰਾਪਤ ਕਰ, ਮਤ ਤੈਨੂੰ ਮਗਰੋ ਪਸਚਾਤਾਪ ਕਰਨਾ ਪਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Make your deals, and obtain the true merchandise, or else you shall regret it later."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸਾ ਬ੍ਯਾਪਾਰ ਕਰਹੁ ਜਿਸ ਮੇਂ (ਮਖਸੂਦ) ਨਫਾ, ਭਾਵ ਸਿਧਾਂਤ ਮਿਲੈ। ਜਿਸ ਕਰ ਫਿਰ ਪਸਚਾਤਾਪ ਨ ਹੋਇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਾਮ-ਸਿਮਰਨ ਦਾ ਅਜੇਹਾ) ਵਣਜ-ਵਪਾਰ ਕਰੋ, ਜਿਸ ਤੋਂ ਜੀਵਨ ਮਨੋਰਥ ਦਾ ਲਾਭ ਖੱਟ ਸਕੋ, ਨਹੀਂ ਤਾਂ ਪਛਤਾਣਾ ਪਵੇਗਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਖਸੂਦੁ = ਲਾਭ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Comercia sólo con el Objeto Deseable; si no, llorarás."