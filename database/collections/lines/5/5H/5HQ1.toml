[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਜੁਗਿ; ਸਤੁ ਸੰਤੋਖੁ ਸਰੀਰਾ ॥"
page = 1023
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "In the True age, truth and contentment permeated the human bodies."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਯੁੱਗ ਅੰਦਰ ਸੱਚ ਅਤੇ ਸੰਤੁਸ਼ਟਤਾ, ਮਨੁਖੀ ਦੇਹਾਂ ਅੰਦਰ ਰਮੇ ਹੋਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In the Golden Age of Truth, Truth and contentment filled the bodies."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਜੁਗ ਮੇਂ ਸਰੀਰਾਂ ਵਿਖੇ ਸਤਿ ਸੰਤੋਖ ਕੀ ਬਹੁਲਤਾ ਥੀ ਅਰਥਾਤ ਧਰਮ ਕੇ ਚਾਰ ਚਰਨ ਥੇ ਸਤ, ਤਪ, ਦਾਨ ਤਥਾ ਸੋਚ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਪ੍ਰਾਣੀਆਂ ਦੇ ਅੰਦਰ (ਉਸ ਸਿਰਜਣਹਾਰ ਦੀ ਮੇਹਰ ਦਾ ਸਦਕਾ) ਸਤ ਅਤੇ ਸੰਤੋਖ (ਵਾਲਾ ਜੀਵਨ ਉੱਘੜਦਾ) ਹੈ ਉਹ, ਮਾਨੋ, ਸਤਜੁਗ ਵਿਚ (ਵੱਸ ਰਹੇ ਹਨ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਜੁਗਿ = ਸਤਜੁਗ ਵਿਚ, ਸਤਜੁਗ ਦੇ ਪ੍ਰਭਾਵ ਵਿਚ। ਸਰੀਰਾ = ਸਰੀਰਾਂ ਵਿਚ, ਮਨੁੱਖਾਂ ਵਿਚ (ਵਰਤੈ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Después vino la Sat Yug, donde la Verdad y el Contentamiento prevalecían en el ser humano,"