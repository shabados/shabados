[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਕੈ ਬਚਨਿ; ਮਿਟਾਵਹੁ ਆਪੁ ॥"
page = 177
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Under Guru 's instruction, efface thy ownself."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਤਾਬੇ, ਆਪਣੇ ਆਪ ਨੂੰ ਮੇਸ ਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Guru's Teachings, eradicate selfishness and conceit."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨਾ ਗੁਰੋਂ ਕੇ ਬਚਨੋਂ ਸੇ ਹੰਕਾਰ ਕੋ ਮਿਟਾ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਬਚਨ ਵਿਚ (ਜੁੜ ਕੇ ਆਪਣੇ ਅੰਦਰੋਂ) ਆਪਾ-ਭਾਵ ਦੂਰ ਕਰ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਚਨਿ = ਬਚਨ ਦੀ ਰਾਹੀਂ। ਆਪੁ = ਆਪਾ-ਭਾਵ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A través del Guru aniquila tu ego,"