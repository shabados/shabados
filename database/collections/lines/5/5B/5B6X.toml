[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਸਰਬ ਫਲ; ਹਰਿ ਲੇਇ ॥"
page = 838
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "he receives all the fruits from the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ ਪਾਸੋਂ ਸਾਰੇ ਮੇਵੇ ਪਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "receives all fruits and rewards from the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਜਨ ਹਰੀ ਤੇ ਧਰਮ, ਅਰਥ, ਕਾਮ, ਮੋਖ, ਸਰਬ ਫਲੋਂ ਕੋ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਮਨੁੱਖ ਸਾਰੇ ਫਲ ਦੇਣ ਵਾਲੇ ਪ੍ਰਭੂ ਦਾ ਮਿਲਾਪ ਪ੍ਰਾਪਤ ਕਰ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਬ ਫਲ ਹਰਿ = ਸਾਰੇ ਫਲ ਦੇਣ ਵਾਲਾ ਹਰੀ। ਲੇਇ = (ਮਿਲਾਪ) ਹਾਸਲ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "sobre la Alabanza del Señor, por Dios alcanza la Plenitud."