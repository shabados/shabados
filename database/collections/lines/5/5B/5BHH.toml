[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਜੰਤ ਏ ਕਿਆ ਵੇਚਾਰੇ; ਕਿਆ ਕੋ ਆਖਿ ਸੁਣਾਏ ॥"
page = 64
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What are these poor living beings? what can they say and tell?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੀ ਹਨ ਇਹ ਗਰੀਬ ਪ੍ਰਾਣਧਾਰੀ? ਉਹ ਕੀ ਕਹਿ ਤੇ ਸਮਝ ਸੁਣਾ ਸਕਦੇ ਹਨ?"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "What are these poor beings and creatures? What can they speak and say?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਨ ਵਿਚਾਰੇ ਜੀਵ ਜੰਤੋਂ ਕੇ ਕ੍ਯਾ ਬਸ ਹੈ, ਔਰ ਕਿਆ ਕੁਛ ਏਹ ਕਹ ਕਰ ਸੁਨਾ ਸਕਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਨਹੀਂ ਤਾਂ) ਇਹ ਜੀਵ ਜੰਤ ਵਿਚਾਰੇ ਕੀਹ ਹਨ? (ਭਾਵ, ਇਹਨਾਂ ਦੀ ਕੋਈ ਪਾਂਇਆਂ ਨਹੀਂ ਕਿ ਇਹ ਆਪਣੇ ਉੱਦਮ ਨਾਲ ਪ੍ਰਭੂ-ਚਰਨਾਂ ਵਿਚ ਜੁੜ ਸਕਣ, ਆਪਣੇ ਕਿਸੇ ਅਜਿਹੇ ਉੱਦਮ ਦੀ ਬਾਬਤ) ਕੋਈ ਜੀਵ ਕੀਹ ਆਖ ਕੇ (ਕਿਸੇ ਨੂੰ) ਸੁਣਾ ਸਕਦਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਆਖਿ = ਆਖ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¿Quiénes son estos pobres hombres sin Fe? ¿Qué podrán decir todos ellos?"