[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਅ ਜੰਤ ਸਗਲੇ ਪ੍ਰਤਿਪਾਰੇ ॥"
page = 563
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the men and other beings He sustains,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਬੰਦਿਆਂ ਤੇ ਹੋਰ ਜਾਨਦਾਰਾਂ ਨੂੰ ਉਹ ਪਾਲਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He cherishes and sustains all beings and creatures."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਆਮੀ! ਆਪ ਨੇ ਸਭੀ ਜੀਵ ਜੰਤ ਪ੍ਰਤਿਪਾਲੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਸਾਰੇ ਹੀ ਜੀਵਾਂ ਦੀ ਪਾਲਣਾ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੀਅ = ਕਈ ਜੀਵ {ਲਫ਼ਜ਼ 'ਜੀਉ' ਤੋਂ ਬਹੁ-ਵਚਨ}।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Das sustento a todas tus criaturas;"