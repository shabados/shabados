[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਹਿਨਿਸਿ; ਭਗਤਿ ਕਰੇ ਲਿਵ ਲਾਇ ॥"
page = 352
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He who immersed in love, day and night, performs Lord's devotional service,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਪ੍ਰੇਮ ਅੰਦਰ ਭਿੱਜਾ ਦਿਹੁੰ ਰੈਣ ਪ੍ਰਭੂ ਦੀ ਭਗਤੀ ਕਮਾਉਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nanak falls at the feet of that person who immerses himself in the Lord's Love,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਰਾਤ ਦਿਨ ਬ੍ਰਿਤ ਲਗਾਇ ਕਰ ਭਗਤੀ ਕਰਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਸੁਰਤਿ ਜੋੜ ਕੇ ਦਿਨ ਰਾਤ ਭਗਤੀ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਹਿ = ਦਿਨ। ਨਿਸਿ = ਰਾਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así vive uno en el Señor, noche y día,"