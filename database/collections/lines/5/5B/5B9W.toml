[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਮਲਾਪਤਿ ਕਵਲਾ; ਨਹੀ ਜਾਨਾਂ ॥੩॥"
page = 691
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "the Lord of Lakhshmi (Vishnu) and Lakhsmi, understands not the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਲਖਸ਼ਮੀ ਦਾ ਪਤੀ ਵਿਸ਼ਨੂੰ ਅਤੇ ਲਖਸ਼ਮੀ, ਸਾਹਿਬ ਨੂੰ ਨਹੀਂ ਸਮਝਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "And Lakshmi herself - none of them know the Lord. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਲਖਮੀ ਨੇ ਭੀ ਹੇ ਕਮਲਾ ਪਤੀ! ਆਪ ਕਾ ਅੰਤ ਜਾਣਿਆ ਨਹੀਂ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਿਸ਼ਨੂ ਤੇ ਲੱਛਮੀ ਨੇ ਭੀ ਤੇਰਾ ਅੰਤ ਨਹੀਂ ਪਾਇਆ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਮਲਾਪਤਿ = ਲੱਛਮੀ ਦਾ ਪਤੀ, ਵਿਸ਼ਨੂ। ਕਵਲਾ = ਲੱਛਮੀ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ni Lakshmi misma, conocen al Señor. (3)"