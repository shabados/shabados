[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਐਸਾ ਦੇਖਿ; ਬਿਮੋਹਿਤ ਹੋਏ ॥"
page = 370
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Seeing such a power of hers, bewitched are,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਐਹੋ ਜੈਹੀ ਤਾਕਤ ਵੇਖ ਕੇ ਮੋਹਤ ਹੋ ਗਏ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Beholding her, all are bewitched:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸਾ ਮਾਯਾ ਕਾ ਚਰਿਤ੍ਰ ਦੇਖ ਕਰ ਕੇ ਹਮ (ਬਿਮੋਹਿਤ) ਮੋਹ ਸੇ ਰਹਤ ਹੂਏ ਹੈਂ ਵਾ ਜੀਵ ਬਸੇਸ ਕਰ ਮੋਹਤ ਹੂਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਮਾਇਆ ਨੂੰ) ਵੇਖ ਕੇ ਇਹ ਸਾਰੇ ਬਹੁਤ ਮਸਤ ਹੋ ਜਾਂਦੇ ਹਨ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਮੋਹਿਤ = ਮਸਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Viéndola, los hombres son seducidos por sus encantos."