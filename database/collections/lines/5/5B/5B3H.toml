[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨ ਪੁਤ੍ਰੰ ਨ ਪੌਤ੍ਰੰ ਨ ਦਾਯਾ ਨ ਦਾਯੰ ॥"
page = 40

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He hath no son, no grandson and no male and female nurses"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਨਾ (ਉਸ ਦਾ ਕੋਈ) ਪੁੱਤਰ ਹੈ, ਨਾ ਪੋਤਰਾ ਹੈ, ਨਾ ਕੋਈ ਦਾਈ ਹੈ ਅਤੇ ਨਾ ਹੀ ਦਾਇਆ (ਖਿਡਾਵਾ) ਹੈ।"