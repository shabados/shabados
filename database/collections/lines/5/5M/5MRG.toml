language = "pa"
data = "(ਉਹ) ਅਤਿਅੰਤ ਉਦਾਰ ਅਤੇ ਮੁਨੀਆਂ ਦੇ ਮਨ (ਵਿਚ ਵਸਣ ਵਾਲਾ) ਮਹਾਨ ਹੈ।"