[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗ੍ਰੀਵ ਨਿਵਾਇ ਮਹਾ ਦੁਖੁ ਪਾਇ; ਘਨੋ ਪਛਤਾਇ ਕੈ ਧਾਮਿ ਗਯੋ ਹੈ ॥"
page = 485

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He went back to his home, repenting in affliction"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਧੌਣ ਨੂੰ ਨਿਵਾ ਕੇ ਅਤੇ ਬਹੁਤ ਦੁਖ ਪਾ ਕੇ ਪਛਤਾਉਂਦਾ ਹੋਇਆ ਘਰ ਨੂੰ ਚਲਿਆ ਗਿਆ ਹੈ।"