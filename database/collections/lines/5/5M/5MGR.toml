[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਅਪਨੇ ਆਗੈ ਅਰਦਾਸਿ ॥"
page = 1147
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Before my Guru-God, the treasure of virtues,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨੇਕੀਆਂ ਦੇ ਖਜਾਨੇ ਆਪਣੇ ਗੁਰੂ ਪਰਮੇਸ਼ਵਰ ਅੱਗੇ ਮੈਂ ਬੇਨਤੀ ਕਰਦਾ ਹਾਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I offer my prayer to my Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਗ੍ਯਾਸੂ ਅਪਨੇ ਗੁਰੋਂ ਕੇ ਆਗੇ ਐਸੇ ਬੇਨਤੀ ਕਰੇ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਗੁਰੂ ਦੇ ਦਰ ਤੇ (ਸਦਾ) ਅਰਜ਼ੋਈ ਕਰਿਆ ਕਰ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Le rezo ahora a mi Guru, mi Dios,"