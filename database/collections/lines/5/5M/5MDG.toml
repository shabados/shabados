[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨ ਕੇ ਚਿਤ ਕਠੋਰ ਹਹਿ; ਸੇ ਬਹਹਿ ਨ. ਸਤਿਗੁਰ ਪਾਸਿ ॥"
page = 314
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They whose hearts are hard sit not near the True Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਦੇ ਦਿਲ ਸਖਤ ਹਨ, ਉਹ ਸੱਚੇ ਗੁਰਾਂ ਕੋਲ ਨਹੀਂ ਬਹਿੰਦੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who have hearts as hard as stone, do not sit near the True Guru."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਕੇ ਕਠੋਰ ਚਿਤ ਹੈਂ, ਸੋ ਸਤਿਗੁਰੋਂ ਕੇ ਪਾਸ ਨਹੀਂ ਬੈਠਤੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਮਨੁੱਖਾਂ ਦੇ ਮਨ ਕਰੜੇ (ਭਾਵ, ਨਿਰਦਈ) ਹੁੰਦੇ ਹਨ, ਉਹ ਸਤਿਗੁਰੂ ਦੇ ਕੋਲ ਨਹੀਂ ਬਹਿ ਸਕਦੇ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਚਿਤ = ਚਿੱਤ ਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquéllos que tienen su corazón endurecido, no habitan en el Verdadero Guru."