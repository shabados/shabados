[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਜੋ ਕਰੈ; ਸੋਊ ਫੁਨਿ ਹੋਊ ॥"
page = 251
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever the Lord does, that ultimately, comes to pass."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੁਛ ਸੁਆਮੀ ਕਰਦਾ ਹੈ, ਆਖਰਕਾਰ ਉਹੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever He does, comes to pass."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੋ ਪਰਮੇਸ੍ਵਰ ਕਰਤਾ ਹੈ ਬਹੁੜੋ ਓਹੀ ਹੋਤਾ ਹੈ ਅਰੁ ਹੋਊਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਗਤ ਵਿਚ) ਉਹੀ ਕੁਝ ਹੋ ਰਿਹਾ ਹੈ ਜੋ ਪ੍ਰਭੂ ਆਪ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਫੁਨਿ = ਮੁੜ, ਫਿਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sólo ocurre lo que Él ordena."