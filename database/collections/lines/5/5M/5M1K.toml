[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਿਛੁ ਖਾਜੈ; ਕਿਛੁ ਧਰਿ ਜਾਈਐ ॥"
page = 989
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "We may eat some part and treasure up the rest,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਸੀਂ ਕੁਝ ਹਿੱਸਾ ਖਾ ਲਈਏ ਅਤੇ ਬਾਕੀ ਦਾ ਜਮ੍ਹਾਂ ਕਰ ਰਖੀਏ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Eat some, and save the rest,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੁਛ ਖਾਵੀਏ ਪੁਨਃ ਕੁਛ (ਧਰਿ) ਰਖ ਭੀ ਜਾਈਐ ਅਰਥਾਤ ਉਸੀ ਘਰ ਉਸ ਦੇਹ ਮੇਂ ਫੇਰ ਨਹੀਂ ਆਵਣਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਮੂਰਖ ਮਨ! ਤੂੰ ਸਦਾ ਇਹ ਸੋਚਦਾ ਹੈਂ ਕਿ) ਕੁਝ ਧਨ-ਪਦਾਰਥ ਖਾ-ਹੰਢਾ ਲਈਏ ਤੇ ਕੁਝ ਸਾਂਭ ਕੇ ਰੱਖੀ ਜਾਈਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਖਾਜੈ = ਖਾ ਲਈਏ, ਵਰਤ ਲਈਏ। ਧਰਿ = ਸਾਂਭ ਕੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Hemos gastado sólo parte de nuestros tesoros"