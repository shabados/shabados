[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਿਨ ਸਾਕ ਦਏ ਨਹਿ ਰਾਰਿ ਬਢੀ ॥"
page = 154

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Those who did not marry their daughters, the wrangle increased with them."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਨ੍ਹਾਂ ਨੇ ਸਾਕ ਨਾ ਦਿੱਤੇ (ਉਨ੍ਹਾਂ ਨਾਲ) ਲੜਾਈ ਵੱਧ ਗਈ।"