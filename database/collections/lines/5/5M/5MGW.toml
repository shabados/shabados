[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਉ ਮਨੁ ਮਤਵਾਰੋ; ਪੀਵਨਹਾਰ ॥੨॥"
page = 344
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "drinks the Nectar and gets intoxicated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਤਦੋਂ ਸੁਧਾਰਸ ਪਾਨ ਕਰਦਾ ਹੈ ਅਤੇ ਖੀਵਾ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "drinking in this Nectar, it is intoxicated. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਉ ਮਨ ਜੋ ਅੰਮ੍ਰਿਤ ਕੇ ਪੀਵਨੇ ਵਾਲਾ ਹੈ, ਸੋ ਮਸਤ ਹੋਤਾ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮਸਤ ਹੋਇਆ ਮਨ ਉਸ ਅੰਮ੍ਰਿਤ ਨੂੰ ਪੀਂਦਾ ਰਹਿੰਦਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਤਵਾਰੋ = ਮਤਵਾਲਾ, ਮਸਤ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y se extasía con el Néctar del Señor."