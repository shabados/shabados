[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਭਾਵੈ; ਸੋਈ ਫੁਨਿ ਹੋਗੁ ॥"
page = 275
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whatever pleases the Master, that ultimately comes to pass."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੁਛ ਮਾਲਕ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ, ਓਹੀ, ਆਖਰਕਾਰ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Whatever pleases God, ultimately comes to pass."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਜੋ ਤਿਸ ਪ੍ਰਭੂ ਕੋ ਭਾਵੈ ਸੋਈ ਪੁਨਾ ਹੋਤਾ ਹੈ ਵਾ ਹੋਵੈਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਪ੍ਰਭੂ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ ਉਹੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪ੍ਰਭ ਭਾਵੈ = (ਜੋ ਕੁਝ) ਪ੍ਰਭੂ ਨੂੰ ਭਾਉਂਦਾ ਹੈ। ਫੁਨਿ = ਫੇਰ, ਮੁੜ। ਹੋਗੁ = ਹੋਵੇਗਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y cualquiera que sea Su Voluntad ha de realizarse."