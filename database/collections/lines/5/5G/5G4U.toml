[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਮਨੋਰਥ ਪੂਰਨਹਾਰੀ ॥੨॥"
page = 1142
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is the fulfiller of all the mind's desires."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਮੂਹ ਮਨ ਦੀਆਂ ਖਾਹਿਸ਼ਾਂ ਪੂਰੀਆਂ ਕਰਨ ਵਾਲਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Fulfiller of all the mind's desires. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਸਗਲ ਮਨੋਰਥ ਪੂਰਨ ਕਰਨੇ ਵਾਲੀ ਜਿਸ ਕੀ ਭਗਤੀ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ (ਆਪਣੇ ਭਗਤਾਂ ਦੇ) ਸਾਰੇ ਮਨੋਰਥ ਪੂਰੇ ਕਰਨ ਵਾਲਾ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨੋਰਥ = ਮੰਗਾਂ, ਲੋੜਾਂ। ਪੂਰਨਹਾਰੀ = ਪੂਰੀਆਂ ਕਰਨ ਵਾਲਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él es Quien nos da la Satisfacción a todos nosotros, nuestro Único Dios. (2)"