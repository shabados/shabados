[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਜੋ ਕਹੈ; ਸੁ ਮੁਕਤਾ ਹੋਇ ॥"
page = 271
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Whosoever utters His Name, he is emancipated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਕੋਈ ਭੀ ਉਸ ਦੇ ਨਾਮ ਨੂੰ ਜਪਦਾ ਹੈ, ਉਹ ਮੋਖਸ਼ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "whoever speaks of Him shall be liberated."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕੇ ਜਸ ਵਾ ਨਾਮ ਕੋ ਜੋ ਜੋ ਜਨ ਉਚਾਰਨ ਕਰਤਾ ਹੈ, ਸੋਈ ਸੋਈ ਮੁਕਤਿ ਹੋ ਜਾਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜੋ ਜੋ (ਮਨੁੱਖ ਉਸ ਨੂੰ) ਸਿਮਰਦਾ ਹੈ ਉਹ (ਵਿਕਾਰਾਂ ਦੇ ਜਾਲ ਤੋਂ) ਖ਼ਲਾਸੀ ਪਾ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੁਕਤਾ = (ਮਾਇਆ ਦੇ ਬੰਧਨਾਂ ਤੋਂ) ਆਜ਼ਾਦ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la liberación llega a aquél que repite Su Nombre."