[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਮ ਜਨੀ; ਕੀਨੀ ਖੰਡ ਖੰਡ ॥੩॥"
page = 892
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord's slaves cut her into pieces."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਗੋਲੇ ਇਸ ਨੂੰ ਟੋਟੇ ਟੋਟੇ ਕਰ ਦਿੰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord's humble servants cut her apart into pieces. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਜਨੋਂ ਨੇ ਟੁਕੜੇ ਟੁਕੜੇ ਕਰੀ ਹੈ, ਭਾਵ ਇਹ ਕਿ ਉਦਾਰਤਾ ਕਰ ਗੋਬਿੰਦ ਅਰਥ ਲਾਇ ਦਈ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਸੰਤ ਜਨਾਂ ਨੇ (ਉਸ ਦੇ ਮੋਹ ਨੂੰ) ਟੋਟੇ ਟੋਟੇ ਕਰ ਦਿੱਤਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰਾਮ ਜਨੀ = ਸੰਤ ਜਨਾਂ ਨੇ। ਜਨੀ = ਜਨੀਂ, ਜਨਾਂ ਨੇ। ਖੰਡ ਖੰਡ = ਟੋਟੇ ਟੋਟੇ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero los Santos del Señor la traen marcando el paso. (3)"