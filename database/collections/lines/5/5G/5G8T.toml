[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਰਾਖਹੁ ਪੈਜ ਸਤਿਗੁਰੂ ਕੀ; ਨਿਤ ਚੜੈ ਸਵਾਈ ॥"
page = 310
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "God preserves the True Guru's honour which increases with each day."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਵਾਹਿਗੁਰੂ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਇੱਜ਼ਤ ਰੱਖਦਾ ਹੈ, ਜੋ ਹਰ ਰੋਜ਼ ਵਧਦੀ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord preserves the honor of the True Guru, which increases day by day."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਰੀ ਸਤਿਗੁਰੋਂ ਕੀ ਪ੍ਰਤਗ੍ਯਾ ਰਖਤਾ ਹੈ, ਸੋ ਨਿਤੰਪ੍ਰਤੀ ਸਵਾਈ ਚੜਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਪ੍ਰਭੂ! ਤੂੰ ਸਤਿਗੁਰੂ ਦੀ ਪੈਜ ਰੱਖਦਾ ਹੈਂ, ਤੇ ਸਤਿਗੁਰੂ ਦੀ ਵਡਿਆਈ ਦਿਨੋ ਦਿਨ ਵਧਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Mismo protege el Honor del Guru, y así su Gloria se incrementa cada día."