[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਗਲ ਬਨਸਪਤਿ; ਆਣਿ ਜੜਾਈ ॥"
page = 385
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He brings all kinds of plants and implants them, there."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਸਾਰੀਆਂ ਕਿਸਮਾਂ ਦੇ ਪੌਦੇ ਲਿਆ ਕੇ, ਉਥੇ ਲਾਉਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He brings all sorts of plants and plants them there."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੀਵੋਂ ਰੂਪ ਜਿਤਨੀ ਬਨਾਸਪਤੀ ਹੈ ਸਭ ਮਾਯਾ ਸਕਤੀ ਕੋ (ਆਣਿ) ਲੇ ਕਰ ਜਟਿਤ ਕਰੀ ਹੈ ਵਾ ਆਪਤੇ ਭਿੰਨ ਕਰ ਜੜਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਉਸ ਮਾਲੀ ਨੇ ਇਸ ਜਗਤ-ਬਗ਼ੀਚੇ ਵਿਚ) ਸਾਰੀ ਬਨਸਪਤੀ ਲਿਆ ਕੇ ਸਜਾ ਦਿੱਤੀ ਹੈ (ਰੰਗਾ ਰੰਗ ਦੇ ਜੀਵ ਪੈਦਾ ਕਰ ਕੇ ਸੰਸਾਰ-ਬਗ਼ੀਚੇ ਨੂੰ ਸੋਹਣਾ ਬਣਾ ਦਿੱਤਾ ਹੈ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਗਲ ਬਨਸਪਤਿ = ਸਾਰੀ ਬਨਸਪਤੀ, ਬੇਅੰਤ ਜੀਅ ਜੰਤ। ਆਣਿ = ਲਿਆ ਕੇ। ਜੜਾਈ = ਸਜਾ ਦਿੱਤੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todo tipo de árboles son traídos y plantados ahí,"