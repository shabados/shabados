[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਤਿਤ. ਪਵਿਤ ਭਏ; ਰਾਮੁ ਕਹਤ ਹੀ ॥੧॥ ਰਹਾਉ ॥"
page = 718
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The sinners become pure by uttering the Lord's Name. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਈਂ ਦੇ ਨਾਮ ਦਾ ਉਚਾਰਨ ਕਰਨ ਦੁਆਰਾ ਪਾਪੀ ਪਵਿੱਤਰ ਹੋ ਜਾਂਦੇ ਹਨ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Sinners become pure, chanting the Lord's Name. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਰਾਮ ਨਾਮ ਕੇ ਕਹਤਿਆਂ ਹੀ ਅਨੇਕ ਪਾਪੀਓਂ ਸੇ ਪਵਿਤ੍ਰ ਹੋ ਗਏ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵਿਕਾਰਾਂ ਵਿੱਚ ਨਿੱਘਰੇ ਹੋਏ ਬੰਦੇ ਭੀ ਪ੍ਰਭੂ ਦਾ ਭਜਨ ਕਰ ਕੇ ਪਵਿੱਤਰ ਹੋ ਜਾਂਦੇ ਹਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "(ਪਤਿਤ = ਵਿਕਾਰਾਂ ਵਿਚ) ਡਿੱਗੇ ਹੋਏ ਬੰਦੇ। ਭਏ = ਹੋ ਜਾਂਦੇ ਹਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos los malvados son purificados con el simple hecho de recitar el Nombre de mi Dios. (1-Pausa)"