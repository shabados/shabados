[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਓਹੁ; ਅਬਿਨਾਸੀ ਅਲਖ ਅਭੇਵਾ ॥੨॥"
page = 227
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "That Lord is Imperishable, Unseen, and Inscrutable."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਪ੍ਰਭੂ ਅਮਰ, ਅਦ੍ਰਿਸ਼ਟ ਅਤੇ ਅਭੇਦ-ਰਹਿਤ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That Lord is Imperishable, Invisible and Inscrutable. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਜੋ ਏਕ ਪਰਮੇਸ੍ਵਰ ਅਲਖ ਅਭੇਵ ਹੈ ਵਹੁ ਅਬਿਨਾਸ਼ੀ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਆਤਮਕ) ਮੌਤ ਤੋਂ ਬਚਿਆ ਹੋਇਆ ਸਿਰਫ਼ ਇਕ ਪਰਮਾਤਮਾ ਹੈ ਜਿਸ ਦੇ ਗੁਣ ਬਿਆਨ ਨਹੀਂ ਹੋ ਸਕਦੇ, ਜਿਸ ਦਾ ਭੇਤ ਪਾਇਆ ਨਹੀਂ ਜਾ ਸਕਦਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo el Señor es Inmortal; el Inefable e Insondable Señor. (2)"