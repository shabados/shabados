[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਮਰਾਵਹੁ ਆਗੈ ਝੇਰਾ ॥"
page = 621
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I presented my dispute to the nobles too."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣਾ ਝਗੜਾ ਅਮੀਰਾਂ ਵਜ਼ੀਰਾਂ ਮੂਹਰੇ ਵੀ ਰੱਖਿਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I presented my dispute to the noblemen as well."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔ ਉਮਰਾਵ ਜੋ ਦੇਵਤੇ ਹੈਂ ਤਿਨ ਕੇ ਆਗੇ ਭੀ ਝਗੜਾ ਕੀਆ ਤੋ ਭੀ ਨਿਬੇੜਾ ਹੂਆ ਨਹੀਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਰਕਾਰੀ ਹਾਕਮਾਂ ਅੱਗੇ ਭੀ ਇਹ ਝਗੜਾ (ਪੇਸ਼ ਕੀਤਿਆਂ ਕੁਝ ਨਹੀਂ ਬਣਦਾ।)"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਮਰਾਵਹੁ ਆਗੈ = ਸਰਕਾਰੀ ਹਾਕਮਾਂ ਦੇ ਸਾਹਮਣੇ। ਝੇਰਾ = ਝਗੜਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Presenté mi disputa ante los cortesanos, pero sólo el Señor,"