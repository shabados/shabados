[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰ ਕੀ ਬਾਣੀ; ਸਦਾ ਸੁਖੁ ਹੋਇ ॥"
page = 1175
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the True Guru's word, eternal peace is procured,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਬਾਣੀ ਦੁਆਰਾ, ਕਾਲ ਸਤਾਈ ਆਰਾਮ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Through the Bani, the Word of the True Guru, eternal peace is found."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਕੇ ਉਪਦੇਸ ਰੂਪ ਬਾਣੀ ਕਰ ਸਦੀਵ ਸੁਖ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੀ ਬਾਣੀ ਦੀ ਬਰਕਤਿ ਨਾਲ ਉਹਨਾਂ ਦੇ ਅੰਦਰ ਸਦਾ ਆਤਮਕ ਆਨੰਦ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "bendecido con la Palabra del Shabd del Guru,"