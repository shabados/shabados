[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋ ਠਗੁ ਠਗਿਆ; ਠਉਰ ਮਨੁ ਆਵਾ ॥੧੮॥"
page = 341
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I have cheated that cheat,. my mind is now at peace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਸ ਛਲੀਏ ਨੂੰ ਛਲ ਲਿਆ ਹੈ, ਮੇਰਾ ਚਿੱਤ ਹੁਣ ਆਰਾਮ ਵਿੱਚ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "- I have cheated that cheater, and my mind is now at peace. ||18||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਸੋ ਠਗ ਠਗ ਲੀਆ ਤਬ ਮਨ ਠੌਰ ਆਗਿਆ ਕਿਆ ਇਸਥਿਤ ਹੋ ਗਿਆ॥੨੮॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ (ਮੋਹ-) ਠੱਗ ਨੂੰ ਕਾਬੂ ਕੀਤਿਆਂ ਮੇਰਾ ਮਨ ਇਕ ਟਿਕਾਣੇ ਤੇ ਆ ਗਿਆ ਹੈ ॥੧੮॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਉਰ = ਟਿਕਾਣੇ ਤੇ ॥੧੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "la he atrapado, y así mi mente está en paz. (18)"