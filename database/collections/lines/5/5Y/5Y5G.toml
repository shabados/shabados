[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸੁ ਹਰਿ ਭਾਵੈ, ਤਿਸੁ ਗੁਰੁ ਮਿਲੈ; ਸੋ ਹਰਿ ਨਾਮੁ ਧਿਆਇ ॥"
page = 86
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "With whom the Lord is pleased, him meets the Guru, and he alone ponders over the Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹਦੇ ਨਾਲ ਮਾਲਕ ਪ੍ਰਸੰਨ ਹੁੰਦਾ ਹੈ, ਉਸ ਨੂੰ ਗੁਰੂ ਜੀ ਮਿਲਦੇ ਹਨ, ਕੇਵਲ ਉਹੀ ਨਾਮ ਦਾ ਅਰਾਧਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "That person, with whom the Lord is pleased, meets with the Guru, and meditates on the Name of the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਹਰਿ (ਭਾਵੈ) ਚਾਹੇ ਤਿਸ ਕੋ ਗੁਰੂ ਮਿਲਤਾ ਹੈ, ਸੋ ਹਰਿ ਨਾਮ ਕੋ ਧਿਆਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸੇ ਮਨੁੱਖ ਨੂੰ (ਹੀ) ਸਤਿਗੁਰੂ ਮਿਲਦਾ ਹੈ, ਜਿਸ ਉਤੇ ਪ੍ਰਭੂ ਤਰੁੱਠਦਾ ਹੈ ਅਤੇ ਉਹੋ ਹੀ ਹਰਿ-ਨਾਮ ਦਾ ਸਿਮਰਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que obtiene la Gracia del Señor, encuentra al Guru, y sólo él habita en el Nombre del Señor."