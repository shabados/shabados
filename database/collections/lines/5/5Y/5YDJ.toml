[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਊਚ ਮੂਚ ਅਪਾਰ ਗੋਬਿੰਦਹ ॥"
page = 1359
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The most high great and limitless is the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਬੁਲੰਦ, ਵੱਡਾ ਅਤੇ ਅਨੰਤ ਹੈ ਸੁਆਮੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord of the Universe is Lofty and High, Great and Infinite."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਨੋਂ ਤੇ ਪਰੇ ਊਚ ਤੇ ਊਚਾ ਅਪਾਰ ਗੋਬਿੰਦ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੋਬਿੰਦ ਬੇਅੰਤ ਹੈ, (ਬਹੁਤ) ਉੱਚਾ ਹੈ, (ਬਹੁਤ) ਵੱਡਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੂਚ = ਵੱਡਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero el Señor del Universo es Suave y Elevado, Grandioso e Infinito."