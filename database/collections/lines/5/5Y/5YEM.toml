[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਿਤ ਅਪਨੇ ਮੈ ਰਾਖਿਯਹੁ; ਕਿਸੂ ਨ ਦੀਜਹੁ ਭੇਵ ॥੭॥"
page = 891

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Please keep it in your heart and do not reveal to any body.’(7)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ ਗੱਲ) ਆਪਣੇ ਚਿਤ ਵਿਚ ਰਖਣੀ ਅਤੇ ਕਿਸੇ ਨੂੰ ਇਸ ਦਾ ਭੇਦ ਨਹੀਂ ਦੇਣਾ ॥੭॥"