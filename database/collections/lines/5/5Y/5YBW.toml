[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰ ਪੂਰੇ ਕੀ ਚਰਣੀ ਲਾਗੁ ॥"
page = 891
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Repair thou to the feet of the Perfect Guru,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਪੂਰਨ ਗੁਰਾਂ ਦੇ ਪੈਰੀਂ ਪੈ ਜਾ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Fall at the feet of the Perfect Guru;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਤੂੰ ਗੁਰੂ ਪੂਰਿਆਂ ਕੀ ਚਰਨੀ ਲਾਗੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਪੂਰੇ ਗੁਰੂ ਦੇ ਚਰਨਾਂ ਤੇ ਪਿਆ ਰਹੁ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Póstrate a los Pies del Perfecto Guru"