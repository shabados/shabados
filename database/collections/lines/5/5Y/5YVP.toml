[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨ; ਨਾਹੀ ਨਾਹੀ ਰੇ ॥"
page = 830
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is not, is not another without the Lord, O mortal."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਬਾਝੋਂ ਹੋਰਸ ਕੋਈ ਨਹੀਂ ਅਸਲੋਂ ਹੀ ਨਹੀਂ ਹੇ ਪ੍ਰਾਣੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no other, none other than the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਅਨ) ਦ੍ਵੈਤ ਰੂਪ ਸੰਸਾਰ ਤੀਨੋ ਕਾਲੋਂ ਮੇਂ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਦਰਸਨ ਦੀ ਬਰਕਤ ਨਾਲ) ਹੋਰ ਮੋਹ ਉੱਕਾ ਹੀ ਨਹੀਂ ਭਾਉਂਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇ = ਹੇ ਭਾਈ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Escucha, no hay ningún otro sin Él,"