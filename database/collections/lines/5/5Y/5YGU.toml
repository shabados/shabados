[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਰਸੈ ਨਿਝਰ ਧਾਰਿ, ਅੰਮ੍ਰਿਤ ਵਾਣੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In this very world, for gurmukhs incessant rain of nectar goes on pouring."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਵਰਸਦੀ ਹੈ ਇਕ ਰਸ ਧਾਰਾ ਅੰਮ੍ਰਤ ਦੇ ਰੰਗ ਵਾਲੀ (ਭਾਵ ਉਥੇ ਵਡੇ ਨਿਰਮਲ ਜਲ ਦੀ ਧਾਰਾ ਦੇ ਮੀਂਹ ਵਰਸਦੇ ਹਨ)।"