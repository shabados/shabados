[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਕੇ ਗੁਣ ਗਾਵਾ; ਜੇ ਹਰਿ ਪ੍ਰਭ ਭਾਵਾ ॥"
page = 1065
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If I am pleasing to the Lord-God, then alone sing I the Lord's praise."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਮੈਂ ਸੁਆਮੀ ਵਾਹਿਗੁਰੁ ਨੂੰ ਚੰਗਾ ਲੱਗਾਂ, ਕੇਵਲ ਤਾਂ ਹੀ ਮੈਂ ਪ੍ਰਭੂ ਦੀ ਕੀਰਤੀ ਗਾਉਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I sing the Glorious Praises of the Lord, as I am pleasing to the Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੌ ਹਰੀ ਕੇ ਗੁਣ ਗਾਵਾਂ ਜੋ ਸਾਮ੍ਰਥ ਕੋ ਭਾਵਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਪਰਮਾਤਮਾ ਦੇ ਗੁਣ ਤਦੋਂ ਹੀ ਗਾ ਸਕਦਾ ਹਾਂ ਜੇ ਮੈਂ ਉਸ ਨੂੰ ਚੰਗਾ ਲੱਗਾਂ (ਜੇ ਮੇਰੇ ਉਤੇ ਉਸ ਦੀ ਮਿਹਰ ਹੋਵੇ)।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਾਵਾ = ਗਾਵਾਂ, ਮੈਂ ਗਾਵਾਂ। ਭਾਵਾ = ਭਾਵਾਂ, ਮੈਂ ਚੰਗਾ ਲੱਗਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me fluye cantar el Nombre el Señor, sólo cuando estoy complaciendo al Señor,"