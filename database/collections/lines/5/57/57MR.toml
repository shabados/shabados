[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਪਤ ਦੀਪ ਭਏ ਪੁਨਿਰ; ਨਵਖੰਡ ਨਾਮ ਬਿਚਾਰ ॥"
page = 618

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Those princes fragmented the earth and distributed amongst themselves and seven continents “Nav-Khand’ (nine regions)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸੱਤ ਦੀਪਾਂ ਦਾ ਨਾਮ ਫਿਰ ਵਿਚਾਰ ਪੂਰਵਕ 'ਨਵ ਖੰਡ' ਰਖਿਆ ਗਿਆ।"