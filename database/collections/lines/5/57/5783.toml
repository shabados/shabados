[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜੀਵਦੁ ਜਗਸੀ ਫਤੇਪੁਰਿ; ਸੇਠਿ ਤਲੋਕੇ ਸੇਵ ਕਮਾਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Bhai Jivanda, Bhai Jagasi and Tiloka have served well at fatehpur."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੀਵੰਦਾ ਤੇ ਜਗਸੀ ਨੇ ਫਤੇ ਪੁਰ ਵਿਖੇ ਅਤੇ ਤਲੋਕੇ ਸੇਠ ਨੇ (ਗੁਰ) ਸੇਵਾ ਕੀਤੀ।"