data = "ਜੋ ਹੌ ਕਛੂ ਮੁਹੰਮਦਹਿ; ਮੁਖ ਤੈ ਕਾਢੋ ਗਾਰਿ ॥"
page = 940

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Had we committed perjury against the prophet,"

