data = "(ਇਸਤਰੀ ਨੇ ਕਿਹਾ) ਜੇ ਮੈਂ ਮੁਹੰਮਦ ਸਾਹਿਬ ਨੂੰ ਮੁਖ ਤੋਂ ਕੁਝ ਗਾਲ੍ਹ ਕਢਦੀ"