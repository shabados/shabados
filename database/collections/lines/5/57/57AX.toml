[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਿਣੁ ਗੁਣੁ ਗੁਰੂ ਸਦਾਇਦੇ; ਓਇ ਖੋਟੇ ਮਠੇ ॥੯॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Those who without merit call themselves Guru, are sluggish dissemblers."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਬਾਝ ਜੋ (ਮੂਰਖ ਲੋਕ) ਆਪ ਨੂੰ ਗੁਰੂ ਸਦਾਉਂਦੇ ਹਨ, ਓਹ ਖੋਟੇ ਤੇ (ਮਨ ਦੇ) ਆਲਸੀ ਢੱਗੇ ਹਨ।"