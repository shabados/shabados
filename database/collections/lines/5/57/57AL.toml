[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਮਹਿ ਰਾਮ ਰਤਨੁ; ਲੈ ਚੀਨੀ ॥"
page = 1030
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Within that see thou the Lord's jewel."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਅੰਦਰ ਤੂੰ ਪ੍ਰਭੂ ਦੇ ਜਵੇਹਰ ਨੂੰ ਵੇਖ ਲੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Know that the Lord's jewel is within it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸੀ ਦੇਹੀ ਮੇਂ ਰਾਮ ਅਮੋਲਕ ਹੈ, ਤਿਸ ਕੋ ਪਹਿਚਾਨ ਲੇਵੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਰਤਨ ਖੋਜ ਕੇ ਲੱਭ ਲੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸੁ ਮਹਿ = ਉਸ (ਸਰੀਰ) ਵਿਚ। ਲੈ ਚੀਨੀ = ਚੀਨਿ ਲੈ, ਪਛਾਣ ਲੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y en nuestro interior vemos"