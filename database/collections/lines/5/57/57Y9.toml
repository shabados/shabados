[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਬਿਨੁ ਗੁਰ ਕੋਇ ਨ ਸਿਝਈ; ਹਉਮੈਂ ਵਧਦੀ ਜਾਇ ਵਧੇਰੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Without holy congregation, the sense of ego stares at the jtv menacingly,"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਦੇ ਬਾਝ ਕੋਈ ਮੁਕਤ ਨਹੀਂ ਹੋ ਸਕਦਾ (ਸਗੋਂ) ਹੰਤਾ ਤੇ ਮਮਤਾ ਬਾਹਲੀ ਵਧਦੀ ਜਾਂਦੀ ਹੈ। (ਕਿਉਂ)"