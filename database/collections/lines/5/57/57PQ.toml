[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਪਾਸਿ ਕੇ ਸਕਲ ਹੀ; ਨਿਕਸਤ ਚਲਤ ਅਪਾਰ ॥੪੫੫॥"
page = 738

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying the word “Sindhuri” in the beginning and then uttering “Ripu Ari” at the end, the names of Paash continue to be evolved.455."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਸਾਰੇ ਪਾਸ ਦੇ ਨਾਮ ਬਣਦੇ ਚਲੇ ਜਾਂਦੇ ਹਨ ॥੪੫੫॥"