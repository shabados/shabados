[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮਤਿ ਚਲਦੇ, ਵਿਰਲੇ ਬੰਦੇ ॥੨੦॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Only rare ones behave in accordance with the wisdom of the Guru, the Gurmati."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਜੋ) ਗੁਰੂ ਦੀ ਸਿੱਖ੍ਯਾ ਵਿਖੇ ਚਲਦੇ ਹਨ, (ਅਜਿਹੇ) 'ਬੰਦੇ' ਵਿਰਲੇ ਹਨ।"