data = "ਪ੍ਰਾਨ ਫਿਰੰਗਨਿ ਬਹੁ ਕੇ ਹਰੈ ॥੭॥"
page = 985

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "More and more he was inflamed, more he became resolute.(7)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਬਹੁਤੇ ਵਿਦੇਸੀਆਂ ('ਫਿਰੰਗਨਿ') ਦੇ ਪ੍ਰਾਣ ਹਰ ਲੈਂਦਾ ॥੭॥"