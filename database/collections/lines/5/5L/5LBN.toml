[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋ ਹਠ ਕੈ ਭਿਰਿਹੈ ਤਿਹ ਸੋ; ਤਿਹ ਕਉ ਛਿਨ ਮੈ ਜਮਲੋਕਿ ਪਠੈ ਹੈ ॥"
page = 519

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“He, who will fight with him, in persistence, he will dispatch him to the abode of Yama in an instant"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜੇ ਕੋਈ ਹਠ ਪੂਰਵਕ ਉਨ੍ਹਾਂ ਨਾਲ ਲੜਾਈ ਕਰੇਗਾ, ਉਸ ਨੂੰ (ਉਹ) ਛਿਣ ਭਰ ਵਿਚ ਯਮਲੋਕ ਭੇਜ ਦੇਣਗੇ।"