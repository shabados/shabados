[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਟੇ ਵਿਸੂਰੇ; ਉਤਰੀ ਚਿੰਤ ॥੨॥"
page = 190
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My worries are effaced, and gone is the anxiety."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਫਿਕਰ ਮਿਟ ਗਏ ਹਨ ਅਤੇ ਦੂਰ ਹੋ ਗਏ ਹੈ ਅੰਦੇਸਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My worries are forgotten, and my anxiety is gone. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕਰ (ਵਿਸੂਰੇ) ਝੋਰੇ ਅਰਥਾਤ ਪਸਚਾਤਾਪੋਂ ਕੀ ਨਿਵਰਤੀ ਹੂਈ ਔਰ ਚਿੰਤਾ ਭੀ ਉਤਰ ਗਈ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਸ ਮੰਤ੍ਰ ਦੀ ਬਰਕਤਿ ਨਾਲ ਉਸ ਦੇ ਸਾਰੇ) ਝੋਰੇ ਮਿਟ ਗਏ ਹਨ ਉਸ ਦੀ (ਹਰੇਕ ਕਿਸਮ ਦੀ) ਚਿੰਤਾ ਲਹਿ ਗਈ ਹੈ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਿਸੂਰੇ = ਝੋਰੇ। ਚਿੰਤ = ਚਿੰਤਾ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y todas mis penas y preocupaciones se me han quitado.(2)"