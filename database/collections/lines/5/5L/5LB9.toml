type = "primary"
data = "ਅਸਿ ਉਜਲ ਪਾਨਿ ਪ੍ਰਭਾ ਨ੍ਰਿਮਲੰ ॥"
page = 697

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The name of that mighty warrior is Kitriya (evil woman)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਨੇ) ਸਫੈਦ ਤਲਵਾਰ ਹੱਥ ਵਿਚ (ਪਕੜੀ ਹੋਈ ਹੈ ਜਿਸ ਦੀ) ਚਮਕ ਬਹੁਤ ਨਿਰਮਲ ਹੈ।"