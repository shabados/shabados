[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਪੂਰੈ ਦੀਆ ਉਪਦੇਸਾ; ਤੁਮ ਹੀ ਸੰਗਿ ਪਰਾਤਾ ॥ ਰਹਾਉ ॥"
page = 614
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Perfect Guru has instructed me, and with Thee, O Lord, I am attuned. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਸਿਖਮਤ ਦਿੱਤੀ ਹੈ ਅਤੇ ਤੇਰੇ ਨਾਲ ਹੇ ਸੁਆਮੀ! ਮੇਰੀ ਸੁਰ ਮਿਲ ਗਈ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Perfect Guru has given me these Teachings, and I am attuned to You. ||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਕੋ ਗੁਰੋਂ ਪੂਰਿਓਂ ਨੇ ਯਹ ਉਪਦੇਸ਼ ਦੀਆ ਹੈ ਕਿ ਤੁਮਾਰੇ ਸਾਥ ਹੀ ਵਾਹਗੁਰੂ ਭਲੀ ਪ੍ਰਕਾਰ (ਰਾਤਾ) ਮਿਲਾ ਹੂਆ ਹੈ॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਦੋਂ ਤੋਂ) ਪੂਰੇ ਗੁਰੂ ਨੇ ਮੈਨੂੰ ਉਪਦੇਸ਼ ਦਿੱਤਾ ਹੈ, ਮੈਂ ਤੇਰੇ ਨਾਲ ਹੀ ਪ੍ਰੋਤਾ ਗਿਆ ਹਾਂ ਰਹਾਉ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ ਪੂਰੈ = ਪੂਰੇ ਗੁਰੂ ਨੇ। ਪਰਾਤਾ = ਪ੍ਰੋਤਾ ਗਿਆ ਹਾਂ ॥ਰਹਾਉ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "en Ti y ahora estoy entonado Contigo. (Pausa)"