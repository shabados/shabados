[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕਉ ਸਮਝਾਵਣ ਜਾਈਐ; ਜੇ ਕੋ ਭੂਲਾ ਹੋਈ ॥"
page = 1329
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If any person goes astray, one should go to instruct him."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਕੋਈ ਜਣਾ ਕੁਰਾਹੇ ਪੈ ਜਾਵੇ, ਇਨਸਾਨ ਉਸ ਨੂੰ ਸਿਖਮਤ ਦੇਣ ਲਈ ਜਾਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "If anyone is mistaken and fooled, you should go to instruct him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸੁ ਕਉ ਤਉ ਸਮਝਾਵਣੇ ਜਾਈਏ ਜੇਕਰ ਭੂਲਾ ਹੂਆ ਹੋਵੈ, ਭਾਵ ਪਰਮੇਸ੍ਵਰ ਅਭੁਲੁ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਜੀਵਾਂ ਦੇ ਕੀਹ ਵੱਸ?) ਉਸੇ ਜੀਵ ਨੂੰ ਮੱਤ ਦੇਣ ਦਾ ਜਤਨ ਕੀਤਾ ਜਾ ਸਕਦਾ ਹੈ ਜੇਹੜਾ (ਆਪ) ਕੁਰਾਹੇ ਪਿਆ ਹੋਵੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕਉ = ਉਸ ਬੰਦੇ ਨੂੰ। ਕੋ = ਕੋਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Si ves que alguien es un tonto y está equivocado, deberías de instruirlo."