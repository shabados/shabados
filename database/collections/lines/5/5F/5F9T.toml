data = "ਤਬ ਨ੍ਰਿਪ ਕੋਪ ਘਨੋ ਮਨਿ ਕੀਨੋ ॥"
page = 443

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When the demons besieged the king, who became extremely enraged in his mind"

[[content]]
