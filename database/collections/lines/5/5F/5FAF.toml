data = "ਹਰਿ ਹਰਿ ਨਾਮੁ; ਜਾ ਕੈ ਹਿਰਦੈ ਵਸੈ ॥"
page = 179
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He in whose heart abides the Name of Lord God,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੇ ਦਿਲ ਅੰਦਰ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦਾ ਨਾਮ ਨਿਵਾਸ ਰਖਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One whose heart is filled with the Name of the Lord, Har, Har"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਹਿਰਦੈ ਮੇਂ ਹਰਿ ਹਰਿ ਨਾਮ ਵਸਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਜਿਸ ਮਨੁੱਖ ਦੇ ਹਿਰਦੇ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਵੱਸ ਪੈਂਦਾ ਹੈ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, dice Nanak, de aquél en cuyo corazón habita el Nombre,"