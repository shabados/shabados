[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਣ ਦੀ ਸੰਗਤ ਦੀ ਪ੍ਰਾਪਤੀ ਰੱਬ ਦੀ ਕਿਰਪਾ ਨਾਲ ਹੀ ਹੁੰਦੀ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਸੁਹਬਤਿ ਏਸ਼ਾਣ ਬਵਦ ਲੁਤਫ਼ਿ ਖ਼ੁਦਾ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "The glow of the garb of the flame of truth, and the blossoming of the closed buds is their joy and happiness."