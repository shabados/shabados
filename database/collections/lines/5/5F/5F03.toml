[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਂਹ ਤਂਹ ਬਿਲੋਕ ਤਂਹ ਤਂਹ ਪ੍ਰਸੋਹ ॥"
page = 38

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Wherever I see, I feel Thy Touch there, O Motivator of gods.!"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਮੈਂ) ਜਿਥੇ ਕਿਥੇ ਵੇਖਦਾ ਹਾਂ, ਉਥੇ ਉਥੇ ਹੀ (ਤੂੰ) ਫਬ ਰਿਹਾ ਹੈਂ।"