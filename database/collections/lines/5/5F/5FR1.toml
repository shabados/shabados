type = "primary"
data = "ਇਕ ਰਾਜੁ ਧਰਮ, ਇਕ ਦਾਨ ਧਰਮ ॥"
page = 139

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "One is political discipline, one is ascetic’s discipline"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉੱਤਰ ਵਿਚ ਪਰਮਾਤਮਾ ਨੇ ਕਿਹਾ) ਇਕ ਰਾਜ-ਧਰਮ (ਰਾਜਨੀਤੀ) ਹੈ, ਇਕ ਦਾਨ-ਧਰਮ (ਧਰਮ-ਨੀਤੀ) ਹੈ,"