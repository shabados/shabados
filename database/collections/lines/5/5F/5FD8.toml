[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਿਰ ਧਰ ਟੇਕਯੰ ਤਜ ਕਰ ਕਾਮੰ ॥"
page = 228

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When Bharat saw with his own eyes the mighty Ram, then abandoning all his desires, Bharat prostrated before him."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਕਾਮਨਾ ਨੂੰ ਤਿਆਗ ਕਰਕੇ ਧਰਤੀ 'ਤੇ ਸਿਰ ਰੱਖ ਕੇ (ਮੱਥਾ) ਟੇਕਿਆ।"