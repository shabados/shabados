[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਜੀਉ; ਅਪਣੀ ਕ੍ਰਿਪਾ ਕਰੇਇ ॥"
page = 1129
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the Sire Lord shows His mercy,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਮਹਾਰਾਜ ਮਾਲਕ ਆਪਣੀ ਮਿਹਰ ਧਾਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the Dear Lord showers His Mercy,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਹਰੀ ਅਪਣੀ ਕਿਰਤਾ ਕਰਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਮਨੁੱਖ ਉੱਤੇ) ਪਰਮਾਤਮਾ ਆਪਣੀ ਕਿਰਪਾ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰੇਇ = ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dios por Sí Mismo, nos bendice con Su Misericordia,"