[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮ ਰਤਨੁ; ਜਿਨਿ ਪਾਇਆ ਦਾਨੁ ॥"
page = 891
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, who is blessed with the gift of the Name jewel,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੂੰ ਨਾਮ ਦੇ ਹੀਰੇ ਦੀ ਦਾਤ ਪ੍ਰਦਾਨ ਹੋਈ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who is blessed with the gift of the jewel of the Name,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਸਤਿਗੁਰੋਂ ਦ੍ਵਾਰਾ ਰਾਮ ਅਮੋਲਕ ਦਾਨ ਪਾਇਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਪੰਡਿਤ! ਤੂੰ ਜਜਮਾਨਾਂ ਪਾਸੋਂ ਦਾਨ ਮੰਗਦਾ ਫਿਰਦਾ ਹੈਂ, ਪਰ) ਜਿਸ ਮਨੁੱਖ ਨੇ (ਗੁਰੂ ਪਾਸੋਂ) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ-ਰਤਨ ਦਾਨ ਪ੍ਰਾਪਤ ਕਰ ਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਨਿ = ਜਿਸ (ਮਨੁੱਖ) ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que es bendecido con la Joya del Nombre del Señor,"