[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਚਕੇ ਭੂਤ ਅਰੁ ਪ੍ਰੇਤ; ਸਰਬ ਬਿਦਿਆਧਰ ਨਰ ਬਰ ॥"
page = 605

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "All ghosts, fiends and superb Vidyadharis wondered"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਭੂਤ, ਪ੍ਰੇਤ, ਵਿਦਿਆਧਰ ਅਤੇ ਸ੍ਰੇਸ਼ਠ ਮਨੁੱਖ ਹੈਰਾਨ ਹੋ ਰਹੇ ਹਨ।"