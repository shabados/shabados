[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜਿਉ ਧਨ ਸੋਘਾ ਰਖਦਾ; ਘਰਿ ਅੰਦਰਿ ਸਾਹੁ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "As, the wise person keeps money intact at home"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜਿੱਕੁਰ ਸ਼ਾਹੂਕਾਰ ਘਰ ਦੇ ਅੰਦਰ ਧਨ ਨੂੰ ਸਾਂਭ ਰੱਖਦਾ ਹੈ।"