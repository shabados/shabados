data = "ਬੇਦ ਪੁਰਾਨ; ਸਿੰਮ੍ਰਿਤਿ ਸੁਧਾਖੵਰ ॥"
page = 262
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Vedas, Puranas and Simirtis of pure word,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਵਿੱਤ੍ਰ ਅੱਖਰ ਵਾਲੇ ਵੇਦ, ਪੁਰਾਣ ਅਤੇ ਸਿਮ੍ਰਤੀਆਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Vedas, the Puraanas and the Simritees, the purest of utterances,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚਾਰੋਂ ਵੇਦ ਅਰੁ ਅਠਾਰਹ ਪੁਰਾਣ ਸਿਮ੍ਰਤੀ ਕੇ (ਸੁਧਾਖਰ) ਏਕ ਏਕ ਅਖਰ ਕੌ ਸੋਧ ਕਰਕੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਵੇਦਾਂ ਪੁਰਾਨਾਂ ਤੇ ਸਿਮ੍ਰਿਤੀਆਂ ਨੇ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਧਾਖ੍ਯ੍ਯਰ = ਸੁੱਧ ਅੱਖਰ, ਪਵਿਤ੍ਰ ਲਫ਼ਜ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
