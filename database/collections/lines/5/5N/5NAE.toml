[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਛੀਨ ਲਈ ਠਕੁਰਾਈ, ਸਾਤੇ ਦਾਨਵੀ ॥"
page = 120

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "“The demons have seized from us our kingdom.\""

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਿ) ਸਾਡੇ ਤੋਂ ਦੈਂਤਾਂ ਨੇ ਰਾਜ ਖੋਹ ਲਿਆ ਹੈ।"