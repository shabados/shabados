[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪੁਨੇ ਹਰਿ ਪ੍ਰਭ ਕੀ; ਹਉ ਗੋਲੀ ॥"
page = 168
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am the maid-servant of my Lord God."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦੀ ਮੈਂ ਦਾਸੀ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am the maid-servant of my Lord God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਅਪਨੇ ਹਰੀ ਪ੍ਰਭੂ ਕੀ ਗੋਲੀ ਹਾਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੇ ਹਰੀ ਦੀ ਪ੍ਰਭੂ ਦੀ ਦਾਸੀ (ਬਣ ਗਈ) ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਮੈਂ। ਗੋਲੀ = ਦਾਸੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Soy el Esclavo perpetuo de mi Señor."