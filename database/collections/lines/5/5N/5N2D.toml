[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਰਲੇ ਪਾਵਹਿ; ਓਹੁ ਬਿਸ੍ਰਾਮੁ ॥"
page = 888
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Rare are they, who attain to that seat of rest."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬਹੁਤ ਥੋੜ੍ਹੇ ਹਨ ਉਹ ਜੋ ਉਸ ਆਰਾਮ ਦੇ ਅਸਥਾਨ ਨੂੰ ਪਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How rare are those who find this place of rest."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕੋਈ ਬਿਰਲੇ ਹੀ ਉਸ ਅਸਥਾਨ ਮੇਂ ਬਿਸਰਾਮ ਪਾਵਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰ ਉਹ ਉੱਚੀ ਆਤਮਕ ਅਵਸਥਾ ਵਿਰਲੇ ਮਨੁੱਖਾਂ ਨੂੰ ਹਾਸਲ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਓਹੁ ਬਿਸ੍ਰਾਮ = ਉਹ ਆਤਮਕ ਟਿਕਾਣਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero extraordinarios son los que encuentran este lugar de descanso,"