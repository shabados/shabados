data = "ਮੀਤ ਨਾਮ ਸੁਨਿ ਕੰਠ ਲਗਾਈ ॥"
page = 913

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "When she listened to the letter and hearing the lover’s name she embraced it."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਮਿਤਰ ਦਾ ਨਾਂ ਸੁਣ ਕੇ ਗਲ ਨਾਲ ਲਾ ਲਈ।"