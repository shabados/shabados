type = "primary"
data = "ਰਿਸਿਯੋ ਤੇਜਿ ਮਾਣੰ ॥"
page = 61

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The warriors struck with arrows became red with blood."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਹ ਅਗਨੀ ਵਾਂਗ (ਤੇਜਿ ਮਾਣੰ) ਲਹੂ ਨਾਲ ਲਾਲ ਹੋ ਜਾਂਦੇ।"