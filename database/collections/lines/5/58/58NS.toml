[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਾਹਾ ਪਲੈ ਪਾਇ; ਹੁਕਮੁ ਸਿਞਾਣੀਐ ॥੪॥"
page = 419
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By realising the Lord's will, the mortal obtains the profit."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੁਆਮੀ ਦੀ ਰਜ਼ਾ ਨੂੰ ਅਨੁਭਵ ਕਰਨ ਦੁਆਰਾ ਪ੍ਰਾਣੀ ਨਫਾ ਪਰਾਪਤ ਕਰ ਲੈਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He obtains the true profit, realizing the Lord's Command. ||4||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਲਾਹਾ ਤਬ ਪਲੇ ਪੜੇਗਾ ਜਬ ਉਸ ਹੁਕਮ ਕੋ ਸਮਝੀਏਗਾ ਅਰਥਾਤ ਸੁਖ ਦੁਖ ਹਾਂਨ ਲਾਭ ਕੇ ਹੁਕਮ ਮੇਂ ਮੰਨ ਕਰ ਸਮਾਨ ਬ੍ਰਿਤਿ ਰਖੋਗੇ॥੪॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਰਜ਼ਾ ਨੂੰ ਪਛਾਨਣਾ ਚਾਹੀਦਾ ਹੈ, ਇਸ ਤਰ੍ਹਾਂ ਹੀ ਜੀਵਨ ਲਾਭ ਮਿਲਦਾ ਹੈ ॥੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਲੈ ਪਾਇ = ਮਿਲਦਾ ਹੈ ॥੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Conciencia del Comando del Señor. (4)"