[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਲ ਬਾਰਿਧ ਜਾਨੁ ਪ੍ਰਲੈ ਉਛਲੰ ॥"
page = 663

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The king was with his army and that army was rushing forth like the clouds of doomsday"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਪਰਲੋ ਦਾ ਸਮੁੰਦਰ ਹੀ ਉਛਲਿਆ ਹੋਵੇ।"