[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸ ਨੋ ਬਖਸੇ; ਸਾਚਾ ਸੋਇ ॥੩॥"
page = 661
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He alone becomes potent to do, whom, He, the True Lord, blesses."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕੇਵਲ ਓਹੀ ਕਰਨ ਦੇ ਯੋਗ ਹੁੰਦਾ ਹੈ, ਜਿਸ ਨੂੰ ਉਹ ਸੱਚਾ ਸੁਆਮੀ, ਬਰਕਤ ਦਿੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He alone is blessed, whom the True Lord forgives. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੋ ਸੋ ਸਚਾ ਵਾਹਿਗੁਰੂ ਬਖਸ਼ੇ ਤਿਸੀ ਕੌ ਨਾਮ ਵਾ ਸਤਸੰਗ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਸਿਰਫ਼ ਉਹੀ ਜੀਵ ਪ੍ਰਭੂ ਨੂੰ ਮਿਲ ਸਕਦਾ ਹੈ) ਜਿਸ ਉਤੇ ਉਹ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਆਪ (ਸਿਮਰਨ ਦੀ) ਬਖ਼ਸ਼ਸ਼ ਕਰੇ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En lo que dura un aplauso me tendré que ir. (3)"