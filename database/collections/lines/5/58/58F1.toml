[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਚੁ ਵਾਪਾਰੁ; ਕਰਹੁ ਵਾਪਾਰੀ ॥"
page = 293
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Deal thou in true trade o dealer."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸੱਚਾ ਵਣਜ ਕਰ, ਹੈ ਵਣਜਾਰੇ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Deal in the true trade, O trader,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜਗ੍ਯਾਸੂ ਜਨੋ! ਜਬ ਤੁਮ ਸਚ ਕਾ ਵਾਪਾਰੁ ਕਰੋਗੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਣਜਾਰੇ ਜੀਵ! ਸੱਚਾ ਵਣਜ ਕਰਹੁ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਵਾਪਾਰੀ = ਹੇ ਵਣਜਾਰੇ ਜੀਵ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "porque ella te acompañará aun después de la muerte."