[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹਾਂਡਾ ਆਲਮ ਚੰਦੁ ਹੈ; ਸੈਸਾਰਾ ਤਲਵਾੜੁ ਸੁਖਾਲਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Alam Chand Handa, Sainsara Talvar are the Sikhs who live with all happiness."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਹਾਂਡਾ ਸੰਗ੍ਯਕ ਆਲਮ ਚੰਦ, ਸੈਂਸਾਰਾ ਭਗਤ ਤਲਵਾੜ ਸੰਗ੍ਯਕ (ਰਾਜਪੂਤ) ਸੁਖ ਦਾ ਘਰ ਸੀ।"