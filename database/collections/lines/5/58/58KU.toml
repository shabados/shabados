[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੋ ਰੋਵੈ; ਸੋਈ ਪਤਿ ਖੋਵੈ ॥੩॥"
page = 871
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "whosoever weeps, he loses his honour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਹੜਾ ਕੋਈ ਰੋਂਦਾ ਹੈ, ਉਹ ਆਪਣੀ ਇੱਜ਼ਤ ਗੁਆ ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "that person loses his honor. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਰੋਵਤਾ ਹੈ, ਸੋਈ ਅਪਨੀ ਪਤ ਖੋਵਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ (ਜੋ ਰੋਂਦਾ ਹੈ) ਖ਼ੁਆਰ ਹੀ ਹੁੰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤਿ ਖੋਵੈ = ਇੱਜ਼ਤ ਗਵਾਉਂਦਾ ਹੈ, ਖ਼ੁਆਰ ਹੁੰਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pierde credibilidad por ser tan tonto. (3)"