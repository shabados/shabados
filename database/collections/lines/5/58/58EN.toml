[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਮਾਣਕ ਮੋਤੀ ਹੀਰਿਆ; ਨਿਰਮੋਲ ਮਹੋੜੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Again invaluable jewels, pearls and diamonds are kept with all this;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਮਾਣਕ ਮੋਤੀ, ਹੀਰੇ (ਨਿਰਮੋਲ ਮਹੋੜੀ=) ਮਹਾਂ ਨਿਰਮੋਲਕ।"