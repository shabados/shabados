[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ; ਨਾਮੁ ਰਖਹੁ ਉਰ ਧਾਰਿ ॥੪॥੮॥"
page = 1129
line = 13

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Clasp thou His Name, to thy heart, O Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਨਾਮ ਨੂੰ ਤੂੰ ਆਪਣੇ ਦਿਲ ਨਾਲ ਲਾਈ ਰਖ, ਹੇ ਨਾਨਕ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, enshrine the Naam within your heart. ||4||8||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਯਾਂ ਤੇ ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਭਾਈ! ਵਾਹਿਗੁਰੂ ਕੇ ਨਾਮ ਕੋ ਹਿਰਦੇ ਵਿਖੇ ਧਾਰਨ ਕਰ ਰਖੋ॥੪॥੮॥☬ਨਾਮ ਕੀ ਮਹਿਮਾ ਕਥਨ ਕਰਤੇ ਹੂਏ ਉਪਦੇਸ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਦਾ ਨਾਮ ਆਪਣੇ ਹਿਰਦੇ ਵਿਚ ਪ੍ਰੋ ਕੇ ਰੱਖ ॥੪॥੮॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਰ = ਹਿਰਦਾ। ਧਾਰਿ = ਧਾਰ ਕੇ, ਟਿਕਾ ਕੇ ॥੪॥੮॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "aprecia entonces en tu corazón sólo Su Nombre. (4-8)"