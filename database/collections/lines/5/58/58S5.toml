[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਛੋਡਿ ਮਾਇਆ ਕੇ ਧੰਧ ਸੁਆਉ ॥੧॥ ਰਹਾਉ ॥"
page = 885
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = ", shedding all the relishes of the worldly pursuits. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰੀ ਪੁਆੜਿਆਂ ਦੇ ਸਾਰੇ ਸੁਆਦਾਂ ਨੂੰ ਤਿਆਗ ਕੇ। ਠਹਿਰਾਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and renounces the entanglements and pursuits of Maya. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਮਾਇਆ ਕੇ ਧੰਧਿਆਂ ਕਾ (ਸੁਆਉ) ਸੁਆਦ ਵਾ ਲਾਭ ਛੋਡ ਦੀਆ ਹੈ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਮਾਇਆ ਦੇ ਧੰਧੇ ਛੱਡ ਕੇ, ਮਾਇਆ ਦੀ ਗ਼ਰਜ਼ ਛੱਡ ਕੇ (ਪਰਮਾਤਮਾ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੇ ਗੀਤ ਗਾਂਦਾ ਹੈ) ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਆਉ = ਸੁਆਰਥ, ਖ਼ੁਦ-ਗ਼ਰਜ਼ੀ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y renuncia a los enredos de Maya. (1-Pausa)"