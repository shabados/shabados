[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭ ਤੇ ਊਚ; ਜਾ ਕਾ ਦਰਬਾਰੁ ॥"
page = 1144
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He, whose court is the highest of all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਦਰਗਾਹ ਸਾਰਿਆਂ ਨਾਲੋਂ ਬੁਲੰਦ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His Regal Court is the highest of all."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਭ ਸੇ ਊਚਾ ਜਿਸ ਕਾ (ਦਰਬਾਰੁ) ਸਤਸੰਗ ਵਾ ਸ੍ਵਰੂਪ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਪਰਮਾਤਮਾ) ਦਾ ਦਰਬਾਰ ਸਭ (ਪਾਤਿਸ਼ਾਹਾਂ ਦੇ ਦਰਬਾਰਾਂ) ਨਾਲੋਂ ਉੱਚਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭ ਤੇ = ਸਭ (ਪਾਤਿਸ਼ਾਹਾਂ ਦੇ ਦਰਬਾਰਾਂ) ਤੋਂ। ਜਾ ਕਾ = ਜਿਸ (ਪ੍ਰਭੂ-ਪਾਤਿਸ਼ਾਹ) ਦਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél Cuya Corte es la más Sublime,"