[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਨ ਮਾਣਸ ਜਨਮਿ. ਨ ਪਾਇਆ; ਤਿਨੑ ਭਾਗੁ ਮੰਦੇਰਾ ਰਾਮ ॥"
page = 844
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Evil is the destiny of those, who have not attained the human life."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੰਦੀ ਹੈ ਪ੍ਰਾਲਬਧ ਉਨ੍ਹਾਂ ਦੀ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਮਨੁੱਖੀ ਜੀਵਨ ਪਰਾਪਤ ਨਹੀਂ ਹੋਇਆ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who have not attained human incarnation, are cursed by evil destiny."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨੋਂ ਨੇ ਇਸ ਮਾਨੁਖ ਜਨਮ ਮੇਂ ਰਾਮ ਕੋ ਨਹੀਂ ਪਾਯਾ ਹੈ ਤਿਨੋਂ ਕਾ ਭਾਗ ਮੰਦਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਨ੍ਹਾਂ ਨੇ ਮਨੁੱਖਾ ਜਨਮ ਵਿਚ ਪਰਮਾਤਮਾ ਦਾ ਮਿਲਾਪ ਹਾਸਲ ਨਾਹ ਕੀਤਾ, ਉਹਨਾਂ ਦੀ ਖੋਟੀ ਕਿਸਮਤ ਜਾਣੋ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੰਦੇਰਾ = ਖੋਟਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "¡Qué desafortunado es aquél que no ha alcanzado la forma humana!"