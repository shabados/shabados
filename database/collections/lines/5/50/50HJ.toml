[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਸਾਰੀ ਦੁਨੀਆ ਦੀ ਦੌਲਤ ਉਸ ਦੇ ਦਰ ਦੀ ਖ਼ਾਕ ਤੋਣ ਵਾਰ ਸੁੱਟਾਣ, ਇਹ ਇੱਕ ਐਸੀ ਚੀਜ਼ ਹੈ,"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਤਮਾਮ ਦੌਲਤਿ ਗੀਤੀ ਫ਼ਿਦਾਇ ਖ਼ਾਕਿ ਦਰਸ਼ ॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "Then, why are you so negligent (in remembering Him) when the meeting with Him is so obvious and clear? (53) (4)"