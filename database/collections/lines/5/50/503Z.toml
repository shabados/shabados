[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨੁ ਭਗਵੰਤੀ ਨਾਨਕਾ; ਜਿਨਾ ਗੁਰਮੁਖਿ ਲਧਾ ਹਰਿ ਭਾਲਿ ॥"
page = 1418
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Blessed is the fortunate bride, O Nanak, who searches and finds her Lord, by the Guru's grace."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੁਬਾਰਕ ਹੈ ਉਹ ਭਾਗਾਂ ਵਾਲੀ ਪਤਨੀ, ਜੋ ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਆਪਣੇ ਸੁਆਮੀ ਨੂੰ ਖੋਜ ਕੇ ਪਾ ਲੈਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Blessed is that happy soul-bride, O Nanak, who, as Gurmukh, seeks and finds the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਿਤੇ ਹੈਂ: ਸੋ ਪੁਰਸ਼ ਪੁੰਨੋਂ ਵਾਲੇ ਧੰਨ ਹੈਂ ਜਿਨੋਂ ਨੇ ਗੁਰੋਂ ਦ੍ਵਾਰੇ ਹਰੀ ਕੋ (ਭਾਲਿ) ਖੋਜ ਕੇ ਲਭ ਲੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਸ਼ਾਬਾਸ਼ੇ ਉਹਨਾਂ ਭਾਗਾਂ ਵਾਲਿਆਂ ਨੂੰ, ਜਿਨ੍ਹਾਂ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ (ਇਸ ਸਰੀਰ-ਹਰਿਮੰਦਰ ਵਿਚ ਵੱਸਦਾ) ਪਰਮਾਤਮਾ ਖੋਜ ਕੇ ਲੱਭ ਲਿਆ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਧਨੁ = (धन्य)। ਭਗਵੰਤੀ = ਭਾਗਾਂ ਵਾਲੇ। ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੀ ਰਾਹੀਂ। ਲਧਾ = ਲੱਧਾ, ਲੱਭ ਗਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Bendita y feliz es la novia Alma, oh, dice Nanak, que como Gurmukj busca y encuentra al Señor."