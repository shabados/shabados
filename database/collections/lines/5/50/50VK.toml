[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਪ੍ਰਸਾਦਿ; ਕਮਲੁ ਬਿਗਸਾਇਆ ॥੨॥"
page = 891
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By saints' grace, my heart-lotus has bloomed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂਆਂ ਦੀ ਦਇਆ ਦੁਆਰਾ, ਮੇਰਾ ਦਿਲ ਕੰਵਲ ਖਿੜ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "By the Grace of the Saints, my heart-lotus blossoms forth. ||2||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤੋਂ ਕੀ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਤਿਨ ਕਾ ਰਿਦਾ ਕਮਲੁ ਖਿੜਿਆ ਹੈ॥੨॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ-ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ ਉਸ ਦੇ ਹਿਰਦੇ ਦਾ ਕੌਲ-ਫੁੱਲ ਖਿੜ ਪਿਆ ॥੨॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੰਤ ਪ੍ਰਸਾਦਿ = ਗੁਰੂ-ਸੰਤ ਦੀ ਕਿਰਪਾ ਨਾਲ। ਕਮਲ = ਹਿਰਦੇ ਦਾ ਕੌਲ-ਫੁੱਲ। ਬਿਗਸਾਇਆ = ਖਿੜ ਪਿਆ ॥੨॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "por la Gracia de los Santos, el Loto del corazón florece.(2)"