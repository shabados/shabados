[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੇਰੇ ਗਲਹਿ ਤਉਕੁ; ਪਗ ਬੇਰੀ ॥"
page = 655
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "On thy neck is the collar and on thy feet the fetters."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੀ ਗਰਦਨ ਦੁਆਲੇ ਪਟਾ ਹੈ ਤੇ ਪੈਰੀਂ ਬੇੜੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The chain is around your neck, and the cuffs are on your feet."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਬੁਧੀ! ਤਿਸ ਵਿਚਾਰ ਸੇ ਬਿਨਾ ਤੇਰੇ ਗਲੇ ਮੇਂ ਮੋਹਿ ਰੂਪੀ (ਤਉਕੁ) ਲੋਹੇ ਕਾ ਜੰਜੀਰ ਪੜ ਰਹਾ ਹੈ ਔ ਪੈਰੋਂ ਮੇਂ ਵਾਸਨਾ ਰੂਪ ਬੇੜੀ ਪੜ ਰਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਜਿੰਦੇ! ਤੇਰੇ ਗਲ ਵਿਚ ਮੋਹ ਦਾ ਪਟਾ ਤੇ ਤੇਰੇ ਪੈਰਾਂ ਵਿਚ ਆਸਾਂ ਦੀਆਂ ਬੇੜੀਆਂ ਹੋਣ ਕਰਕੇ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਲਹਿ = ਗਲ ਵਿਚ। ਤਉਕੁ = ਲੋਹੇ ਦਾ ਕੜਾ ਜੋ ਗ਼ੁਲਾਮਾਂ ਦੇ ਗਲ ਵਿਚ ਪਾਇਆ ਜਾਂਦਾ ਸੀ, ਮੋਹ ਦਾ ਪਟਾ। ਪਗ = ਪੈਰਾਂ ਵਿਚ। ਬੇਰੀ = ਆਸਾਂ ਦੀ ਬੇੜੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sobre tu cuello está el cabestro, en tus pies los grilletes,"