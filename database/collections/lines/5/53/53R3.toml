[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਚੋਰ ਜਾਰ ਜੂਆਰ ਤੇ. ਬੁਰਾ ॥"
page = 1145
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is worse than a thief, an illicit lover and a gambler."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਤਸਕਾਰ ਵਿਭਚਾਰੀ ਅਤੇ ਜੁਆਰੀਏ ਨਾਲੋ ਭੈੜਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is worse than a thief, a lecher, or a gambler."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਚੋਰ ਯਾਰ ਔਰ ਜੁਆਰੀ ਸੇ ਭੀ ਨਿੰਦਕ ਬੁਰਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਨਿੰਦਾ ਕਰਨ ਵਾਲਾ ਮਨੁੱਖ ਚੋਰ ਨਾਲੋਂ ਵਿਭਚਾਰੀ ਨਾਲੋਂ ਜੂਆਰੀਏ ਨਾਲੋਂ ਭੀ ਭੈੜਾ ਸਾਬਤ ਹੁੰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤੇ = ਤੋਂ। ਜਾਰ = ਵਿਭਚਾਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el que tiene amores ilícitos, pues carga todo el tiempo"