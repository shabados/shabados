[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪਾਸ ਪਰੋਸਿਨ ਬਾਸ ਗਹਿਯੋ ਬਨ; ਲੋਗ ਭਏ ਸਭ ਹੀ ਨਕ ਵਾਨੀ ॥"
page = 860

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The neighbours turned away to their houses as all were puzzled, ‘What sort of a woman is she?"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਆਸ ਪਾਸ ਦੇ ਪੜੋਸੀਆਂ ਨੇ ਬਨ ਵਿਚ ਨਿਵਾਸ ਕਰ ਲਿਆ ਹੈ (ਅਰਥਾਤ ਆਪਣੇ ਘਰ ਛਡ ਕੇ ਚਲੇ ਗਏ ਹਨ) ਅਤੇ ਸਾਰਿਆਂ ਲੋਕਾਂ ਦਾ ਨਕ ਵਿਚ ਦਮ ਹੋ ਗਿਆ ਹੈ (ਭਾਵ-ਬਹੁਤ ਤੰਗ ਹੋ ਗਏ)।"