[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਉ ਮਧੁ ਮਾਖੀ. ਸੰਚੈ ਅਪਾਰ ॥"
page = 1252
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As the bee hoards up much honey,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਮੱਖੀ ਬਹੁਤਾ ਸ਼ਹਿਦ ਇਕੱਠਾ ਕਰਦੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The bee stores up loads of honey;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੈਸੇ ਮਾਖੀ ਸਹਿਤ ਕੋ (ਅਪਾਰ) ਬਹੁਤ ਸਿੰਚਨ ਕਰਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਵੇਂ ਮੱਖੀ ਬਹੁਤ ਸ਼ਹਿਦ ਇਕੱਠਾ ਕਰਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਧੂ = ਸ਼ਹਿਦ। ਸੰਚੈ = ਇਕੱਠਾ ਕਰਦੀ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La abeja colecta la miel en su panal"