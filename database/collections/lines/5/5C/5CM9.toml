[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮੇਰੇ ਸਤਿਗੁਰਾ; ਹਉ. ਤੁਧੁ ਵਿਟਹੁ ਕੁਰਬਾਣੁ ॥"
page = 52
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "My True Guru! I am a sacrifice unto Thee."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਸਚੇ ਗੁਰਦੇਵ ਜੀ! ਮੈਂ ਤੁਹਾਡੇ ਉਤੋਂ ਬਲਿਹਾਰਨੇ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my True Guru, I am a sacrifice to You."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸਤਿਗੁਰੁ! ਮੈਂ ਤੇਰੇ ਉਪਰ ਸੇ ਕੁਰਬਾਨ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸਤਿਗੁਰੂ! ਮੈਂ ਤੈਥੋਂ ਕੁਰਬਾਨ ਜਾਂਦਾ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਉ = ਮੈਂ। ਵਿਟਹੁ = ਤੋਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh mi Verdadero Guru, mi ser lo ofrezco a Ti."