[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜਵਾਬੇ ਸੁਖ਼ਨ ਰਾ ਅਲਮਬਰ ਗਰਿਫ਼ਤ ॥੩੫॥"
page = 1396

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘You, the lights of the world and stars of Yaman.‘(35)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉੱਤਰ ਦੇਣ ਲਈ ਝੰਡਾ ਧਾਰਨ ਕਰ ਲਿਆ (ਭਾਵ ਜਵਾਬ ਦੇਣ ਲਈ ਤਿਆਰ ਹੋ ਗਿਆ) ॥੩੫॥"