[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਨੀ ਮਾਹਿ ਦੇਖੁ ਮੁਖੁ ਜੈਸਾ ॥"
page = 1318
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "As man sees his countenance reflected in clear water,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਤਰ੍ਹਾਂ ਬੰਦਾ ਸਾਫ਼ ਪਾਣੀ ਵਿੱਚ ਆਪਣੇ ਖਿਹਰੇ ਦੇ ਅਕਸ ਨੂੰ ਵੇਖ ਲੈਂਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "As one's face is reflected in the water,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਪ੍ਰਕਾਰ ਪਾਨੀ ਕੇ ਬੀਚ ਮੁਖ ਕਾ ਪ੍ਰਤਿਬਿੰਬ ਦੇਖੀਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੁਸੀਂ ਜਿਵੇਂ ਪਾਣੀ ਵਿਚ (ਆਪਣਾ) ਮੂੰਹ ਵੇਖਦੇ ਹੋ, (ਮੂੰਹ ਪਾਣੀ ਵਿਚ ਟਿਕਿਆ ਦਿੱਸਦਾ ਹੈ, ਪਰ ਉਸ ਉੱਤੇ ਪਾਣੀ ਦਾ ਕੋਈ ਅਸਰ ਨਹੀਂ ਹੁੰਦਾ),"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como el semblante es reflejado en el estanque,"