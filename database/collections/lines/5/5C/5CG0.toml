[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਉਠੀ ਝਾਲੂ ਕੰਤੜੇ; ਹਉ ਪਸੀ ਤਉ ਦੀਦਾਰੁ ॥"
page = 1094
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my spouse, I arise early to behold Thy vision."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਪਤੀ, ਤੇਰਾ ਦਰਸ਼ਨ ਦੇਖਣ ਲਈ ਮੈਂ ਅੰਮ੍ਰਿਤ ਵੇਲੇ (ਸਾਜਰੇ) ਉਠਦੀ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I rise early, O my Husband Lord, to behold Your Vision."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ (ਝਾਲੂ) ਆਸਰਾ ਰੂਪ ਪਤੀ! ਜਬ ਬ੍ਰਿਤੀ (ਉਠੀ) ਉਥਾਨ ਹੋਵੈ; ਵਾ ਜਬ ਮੈਂ (ਝਾਲੂ) ਪ੍ਰਾਤਹਿਕਾਲ ਉਠੋਂ ਤਬ ਮੈਂ ਤੇਰਾ ਹੀ ਦੀਦਾਰੁ (ਪਸੀ) ਦੇਖੋਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੋਹਣੇ ਕੰਤ! ਸਵੇਰੇ ਉੱਠਾਂ ਤੇ (ਪਹਿਲਾਂ) ਤੇਰਾ ਦਰਸਨ ਕਰਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਠੀ = ਉੱਠੀਂ, ਮੈਂ ਉੱਠਾਂ। ਝਾਲੂ = ਝਲਾਂਗੇ, ਸਵੇਰੇ। ਕੰਤੜੇ = ਹੇ ਸੋਹਣੇ ਕੰਤ! ਹਉ = ਮੈਂ। ਪਸੀ = ਪੱਸੀਂ, ਵੇਖਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Me levanto en la hora ambrosial para Poderte ver, mi Sol, pues el colirio en los ojos,"