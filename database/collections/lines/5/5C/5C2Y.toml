[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਚਾ ਸੇਵਹੁ; ਸਾਚੀ ਬਾਣੀ ॥"
page = 1175
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the True word, serve thou the True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੀ ਗੁਰਬਾਣੀ ਦੇ ਰਾਹੀਂ, ਤੂੰ ਸੱਚੇ ਸਾਹਿਬ ਦੀ ਘਾਲ ਕਮਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So serve the True Lord, through the True Bani of His Word."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰ ਉਪਦੇਸ ਰੂਪ ਸਾਚੀ ਬਾਣੀ ਕਰ ਕੇ ਸਚਾ ਵਾਹਿਗੁਰੂ ਸੇਵਹੁ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਦੀ ਭਗਤੀ ਕਰਦੇ ਰਿਹਾ ਕਰੋ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sirve entonces a Tu Dios a través de la Palabra"