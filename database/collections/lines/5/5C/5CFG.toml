[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਪਰਾਧੀ; ਖਿਨ ਮਹਿ ਤਾਰੈ ॥੧॥"
page = 1298
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Through the Lord's Name, millions of sinners are saved in an instant."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਦੇ ਨਾਮ ਦੇ ਰਾਹੀਂ, ਕ੍ਰੋੜਾ ਹੀ ਪਾਪੀਆਂ ਦਾ ਇਕ ਮੁਹਤ ਵਿੱਚ ਪਾਰ ਉਤਾਰਾ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Millions of sinners are carried across in an instant. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਨੇ ਕ੍ਰੋੜੋਂ ਪਾਪੀ ਇਕ ਛਿਨ ਵਿਖੇ ਤਾਰ ਦੀਏ ਹੈਂ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹਰਿ-ਨਾਮ ਕ੍ਰੋੜਾਂ ਪਾਪੀਆਂ ਨੂੰ ਇਕ ਖਿਨ ਵਿਚ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਤੋਂ) ਪਾਰ ਲੰਘਾ ਲੈਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਟਿ = ਕ੍ਰੋੜਾਂ। ਪਰਾਧੀ = ਅਪਰਾਧੀ, ਪਾਪੀ। ਤਾਰੈ = (ਨਾਮ) ਪਾਰ ਲੰਘਾ ਲੈਂਦਾ ਹੈ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones de seres malévolos son llevados a través en un instante. (1)"