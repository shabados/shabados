[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕੀ ਕੀਮਤਿ; ਕਹਣੁ. ਨ ਜਾਈ ॥ ਰਹਾਉ ॥"
page = 614
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His worth cannot be described. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਮੁੱਲ ਬਿਆਨ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "His worth cannot be described. ||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਮਹਿਮਾ ਕੀ ਕੀਮਤ ਕੁਛ ਕਹੀ ਨਹੀਂ ਜਾਤੀ ਹੈ॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦਾ ਮੁੱਲ ਨਹੀਂ ਦੱਸਿਆ ਜਾ ਸਕਦਾ ਰਹਾਉ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਾ ਕੀ = ਉਸ (ਵਡਿਆਈ) ਦੀ ॥ਰਹਾਉ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nadie la puede apreciar. (Pausa)"