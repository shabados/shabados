[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਪੀਅ ਕੋਪਿਤ ਹਮਰੇ ਪਰ ਹੁਐ ਹੈ ॥੭॥"
page = 188

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The wife of Vishnu thought that if Narada partook it the food would become impure and her lord wound be angry with.7."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਪ੍ਰੀਤਮ ਮੇਰੇ ਉਤੇ ਗੁੱਸੇ ਹੋਵੇਗਾ ॥੭॥"