[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਜੋ ਬੀਜੈ, ਸੋਈ ਫਲੁ ਖਾਏ ॥੨੦॥੩੦॥ ਤੀਹ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "One reaps what one sows."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਜੇਹਾ ਕੋਈ ਬੀਜਦਾ ਹੈ ਤੇਹਾ ਹੀ ਫਲ ਖਾਂਦਾ ਹੈ।"