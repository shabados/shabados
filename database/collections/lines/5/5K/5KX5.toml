[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਆਪੁ ਗਵਾਇਆ; ਜੀਵਨੁ ਮੁਕਤਿ ਨ ਤਾਮਸ ਪਿਤਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "By leaving away ego they become liberated and do not allow the darkness (ignorance) to reside in their heart."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਆਪਾ ਭਾਵ ਗੁਵਾ ਦਿੰਦੇ ਹਨ, ਜੀਵਨ ਮੁਕਤ ਹੋ ਰਹੇ ਹਨ, ਗੁਰਮੁਖਾਂ ਦਾ ਪਿੱਤਾ (ਦਿਲ) ਤਮੋਂ ਗੁਣੀ ਨਹੀਂ।"