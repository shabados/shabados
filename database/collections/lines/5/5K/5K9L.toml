[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਵਨ ਸੁ ਜੁਗਤਿ; ਜਿਤੁ ਕਰਿ ਭੀਜੈ ॥"
page = 181
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "What is the way by which the Lord is pleased?"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਕਿਹੜਾ ਢੰਗ ਹੈ ਜਿਸ ਦੁਆਰਾ ਸਾਹਿਬ ਖੁਸ਼ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "How can we please the Lord?"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਸ਼ਨ: ਵਹੁ ਕੌਨ ਜੁਗਤੀ ਹੈ ਜਿਸ ਕਰ ਕੇ ਹੇ ਪਰਮੇਸ੍ਵਰ! ਤੂੰ ਪ੍ਰਸਿੰਨ ਹੋਵੇਂ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹ ਕੇਹੜਾ (ਵਿਰਲਾ ਪ੍ਰਭੂ ਦਾ) ਸੇਵਕ ਹੈ ਜੋ (ਮੈਨੂੰ ਭੀ) ਨਾਮ ਦਾ ਸੌਦਾ ਕਰਾ ਦੇਵੇ?"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੁਗਤਿ = ਤਰੀਕਾ। ਜਿਤੁ = ਜਿਸ ਦੀ ਰਾਹੀਂ। ਭੀਜੈ = ਪ੍ਰਸੰਨ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y los entregaría al servicio de aquél que me muestre la manera para mover el Corazón del Señor."