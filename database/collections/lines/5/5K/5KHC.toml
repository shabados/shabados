[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੰਤ ਕੇ ਦੋਖੀ ਕਉ; ਉਦਿਆਨ ਭ੍ਰਮਾਈਐ ॥"
page = 280
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The saints' evil-wisher is made to wander into the wilderness."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਧੂ ਦਾ ਬੁਰਾ ਚਿਤਵਨ ਵਾਲੇ ਨੂੰ ਬੀਆਬਾਨ ਅੰਦਰ ਭਟਕਾਇਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The slanderer of the Saint wanders in the wilderness."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਕੇ ਦੋਖੀ ਕੌ ਸੰਸਾਰ ਰੂਪੀ (ਉਦਿਆਨ) ਬਨ ਮੇਂ ਭ੍ਰਮਾਈਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸੰਤ ਦੇ ਨਿੰਦਕ ਨੂੰ, (ਮਾਨੋ) ਜੰਗਲਾਂ ਵਿਚ ਖ਼ੁਆਰ ਕਰੀਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਦਿਆਨ = ਜੰਗਲ। ਭ੍ਰਮਾਈਐ = ਭਟਕਾਈਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Es conducido a divagar por el desierto"