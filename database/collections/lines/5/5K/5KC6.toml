[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਮਧੇ; ਕੋਈ ਵਿਰਲਾ ਲੇਇ ॥"
page = 1335
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Out of millions, rare is the one, who attains unto it,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕ੍ਰੋੜਾ ਵਿਚੋਂ ਕੋਈ ਵਿਰਲਾ ਹੀ ਇਸ ਨੂੰ ਪਰਾਪਤ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Out of millions, only a rare few receive it"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪਰੰਤੂ ਕਰੋੜੋਂ ਵਿੱਚੋਂ ਕੋਈ ਵਿਰਲਾ ਹੀ ਲੇਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਕ੍ਰੋੜਾਂ ਵਿਚੋਂ ਕੋਈ ਵਿਰਲਾ ਮਨੁੱਖ ਹੀ (ਇਹ ਦਾਤਿ) ਹਾਸਲ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਟਿ ਮਧੇ = ਕ੍ਰੋੜਾਂ ਵਿਚੋਂ। ਲੇਇ = ਲੈਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero de millones, extraordinario es en verdad quien la recibe,"