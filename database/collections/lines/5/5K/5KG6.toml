[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰੰਗੀ ਲੇ ਜਿਹਬਾ; ਹਰਿ ਕੈ ਨਾਇ ॥"
page = 1163
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my tongue, be thou imbued with the Lord's Name."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੀ ਜੀਭੈ! ਤੂੰ ਹਰੀ ਦੇ ਨਾਮ ਨਾਲ ਰੰਗੀਜਿਆ ਜਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O my tongue, be imbued with the Lord's Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਜਿਹਵਾ! ਹਰੀ ਰੰਗੀਲੇ ਕੇ ਨਾਮ ਕੋ ਜਪੁ॥☬ਕੈਸੇ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਆਪਣੀ ਜੀਭ ਨੂੰ ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਵਿਚ ਰੰਗ ਲਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੰਗੀ ਲੇ = ਮੈਂ ਰੰਗ ਲਈ ਹੈ। ਨਾਇ = ਨਾਮ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Imbúyete entonces en Él,"