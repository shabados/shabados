[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪਿ ਭੁਲਾਇ; ਆਪੇ ਮਤਿ ਦੇਵੈ ॥੩॥"
page = 224
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself misleads and Himself imparts understanding."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਖੁਦ ਗੁਮਰਾਹ ਕਰਦਾ ਹੈ ਅਤੇ ਖੁਦ ਹੀ ਸਮਝ ਪ੍ਰਦਾਨ ਕਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Lord Himself misleads people, and He Himself imparts understanding. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਵਾਹਿਗੁਰੂ ਆਪ ਹੀ ਜੀਵ ਕੋ ਭੁਲਾਉਤਾ ਹੈ, ਪੁਨਾ ਆਪ ਹੀ (ਮਤਿ) ਸਿਖ੍ਯਾ ਦੇਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ ਜੀਵ ਦੇ ਕੀਹ ਵੱਸ?) ਪਰਮਾਤਮਾ ਆਪ ਭੁਲਾਉਂਦਾ ਹੈ ਅਤੇ ਆਪ ਹੀ ਅਕਲ ਦੇਂਦਾ ਹੈ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Mismo nos desvía del Camino, y Él Mismo nos trae de regreso.(3)"