[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕੋਟਿ ਬਿਘਨ; ਨਹੀ ਆਵਹਿ ਨੇਰਿ ॥"
page = 888
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Millions of tribulations draw not near him,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਕਰੋੜਾਂ ਹੀ ਆਫਤਾਂ ਉਸ ਦੇ ਨੇੜੇ ਨਹੀਂ ਆਉਂਦੀਆਂ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Millions of troubles do not come near him;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਉਸ ਕੇ ਨਿਕਟ ਅਨੇਕ ਬਿਘਨ ਨਹੀਂ ਆਵਤੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! (ਉਸ ਮਨੁੱਖ ਦੀ ਜ਼ਿੰਦਗੀ ਦੇ ਰਾਹ ਵਿਚ ਆਉਣ ਵਾਲੀਆਂ) ਕ੍ਰੋੜਾਂ ਰੁਕਾਵਟਾਂ ਉਸ ਦੇ ਨੇੜੇ ਨਹੀਂ ਆਉਂਦੀਆਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕੋਟਿ = ਕ੍ਰੋੜਾਂ। ਬਿਘਨ = ਰੁਕਾਵਟਾਂ। ਨੇਰਿ = ਨੇੜੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones de tribulaciones no le afectan"