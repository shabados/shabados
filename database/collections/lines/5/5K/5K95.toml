[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਨਿਵ ਚਲਣੁ, ਗੁਰ ਮਾਰਗੁ ਦੱਸੈ ॥੧੧॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Thus the great Guru teaches the way of humility."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਨਿਵਕੇ ਚਲਣ ਦਾ ਰਸਤਾ ਗੁਰੂ ਜੀ ਦਸਦੇ ਹਨ।"