[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦੈਤਨ ਮਾਰਨ ਹੇਤ ਚਲੇ ਅਪੁਨੇ ਸੰਗ ਲੈ ਸਭ ਹੀ ਭਟ ਦਾਨੀ ॥"
page = 402

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Krishna moved forward alongwith the warriors in order to kill the demons"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਦੈਂਤਾਂ ਨੂੰ ਮਾਰਨ ਲਈ ਆਪਣੇ ਨਾਲ ਸਾਰੇ ਵੱਡੇ ਦਿਲਾਵਰ ਸੂਰਮੇ ਲੈ ਕੇ ਚਲੇ ਹਨ।"