[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਉ ਵਾਰੀ ਜੀਉ ਵਾਰੀ; ਨਾਮੁ ਸੁਣਿ ਮੰਨਿ ਵਸਾਵਣਿਆ ॥"
page = 123
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I am devoted and my soul is devoted unto those who hear and enshrine the Name in their mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਸਦਕੇ ਹਾਂ ਅਤੇ ਮੇਰੀ ਜਿੰਦੜੀ ਸਦਕੇ ਹੈ ਉਨ੍ਹਾਂ ਉਤੋਂ ਜੋ ਨਾਮ ਨੂੰ ਸਰਵਣ ਕਰਦੇ ਤੇ ਆਪਣੇ ਚਿੱਤ ਵਿੱਚ ਟਿਕਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I am a sacrifice, my soul is a sacrifice, to those who hear and enshrine the Naam within their minds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਮ ਸੁਣ ਕਰ ਮਨ ਮੇਂ ਵਸਾਵਤੇ ਹੈਂ, ਮੈਂ ਤਿਨ ਕੇ ਮਨ ਤਨ ਕਰ ਵਾਰਨੇ ਜਾਤਾ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਉਹਨਾਂ ਮਨੁੱਖਾਂ ਤੋਂ ਸਦਾ ਕੁਰਬਾਨ ਸਦਕੇ ਜਾਂਦਾ ਹਾਂ, ਜੇਹੜੇ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਸੁਣ ਕੇ ਆਪਣੇ ਮਨ ਵਿਚ ਵਸਾਈ ਰੱਖਦੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਣਿ = ਸੁਣ ਕੇ। ਮੰਨਿ = ਮਨਿ, ਮਨ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "En sacrificio, oh, yo ofrezco mi ser en sacrificio a aquéllos que escuchan el Nombre del Señor y Lo enaltecen en su mente,"