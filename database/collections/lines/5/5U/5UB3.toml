[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨ ਨਾਨਕ. ਨਾਮੁ ਸਲਾਹਿ ਤੂ; ਜਨਮ ਮਰਣ ਦੁਖੁ ਜਾਇ ॥੧॥"
page = 313
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Praise thou God's Name, O slave Nanak that thy pain of birth and death may end."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਗੋਲੇ ਨਾਨਕ ਤੂੰ ਨਾਮ ਦੀ ਪਰਸੰਸਾ ਕਰ, ਤਾਂ ਜੋ ਤੇਰੀ ਜੰਮਣ ਤੇ ਮਰਨ ਦੀ ਤਕਲੀਫ ਮਿਟ ਜਾਂਵੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O servant Nanak, praise the Naam; the pains of birth and death shall come to an end. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਹੇ ਜਨ! ਤੂੰ  ਨਾਮ ਕੋ ਸਲਾਹ, ਜਿਸ ਕਰ ਕੇ ਤੇਰਾ ਜਨਮ ਮਰਣ ਦਾ ਦੁਖ ਜਾਤਾ ਰਹੇ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਸ ਵਾਸਤੇ) ਹੇ ਦਾਸ ਨਾਨਕ! ਤੂੰ ਭੀ ਨਾਮ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਕਰ (ਤਾ ਕਿ) ਤੇਰਾ ਸਾਰੀ ਉਮਰ ਦਾ ਦੁੱਖ ਮੁੱਕ ਜਾਏ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਨਮ ਮਰਣ ਦੁਖੁ = ਜਨਮ ਤੋਂ ਮਰਨ ਤੱਕ ਦਾ ਦੁੱਖ, ਸਾਰੀ ਉਮਰ ਦਾ ਦੁਖ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dice el Sirviente  Nanak, alaba el Naam y el dolor de nacer y morir terminará para ti.  (1)"