[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨ ਮਾਗੈ; ਪ੍ਰਿਉ ਬਹੁ ਬਿਧਿ ਧਾਵੈ ॥"
page = 1072
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "On the bride's demand, the spouse runs in many ways."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਤਨੀ ਦੇ ਮੰਗ ਕਰਨ ਉਤੇ ਪਤੀ ਕਈ ਪਾਸੀ ਦੋੜਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "When the bride asks, the husband runs around in all sorts of ways."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਦੇਹ ਇਸਤ੍ਰੀ ਮਾਂਗਤੀ ਹੈ ਤਉ ਜੀਵ ਪਤੀ ਬੁਹੁ ਪ੍ਰਕਾਰ ਧਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਾਇਆਂ-ਇਸਤ੍ਰੀ (ਭੀ ਜੋ ਕੁਝ) ਮੰਗਦੀ ਹੈ, (ਉਹ ਹਾਸਲ ਕਰਨ ਵਾਸਤੇ) ਜੀਵਾਤਮਾ-ਪਤੀ ਕਈ ਤਰ੍ਹਾਂ ਦੀ ਦੌੜ-ਭੱਜ ਕਰਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਾਗੈ = ਮੰਗਦੀ ਹੈ। ਬਹੁ ਬਿਧਿ = ਕਈ ਤਰ੍ਹਾਂ। ਧਾਵੈ = ਦੌੜਿਆ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Lo que la novia pide, el consorte se esfuerza por satisfacer y lo que sea que encuentra,"