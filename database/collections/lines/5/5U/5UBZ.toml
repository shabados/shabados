[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਭੁ ਕਿਛੁ ਆਪੇ ਆਪਿ; ਆਪਿ ਉਪੰਨਿਆ ॥"
page = 965
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Himself, all by Himself, He has created everything."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਖੁਦ, ਖੁਦ-ਬ-ਖੁਦ ਹੀ, ਉਸ ਨੇ ਸਾਰਾ ਕੁੱਝ ਰਚਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself, by Himself, created everything."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਸਭ ਕੁਛ ਆਪ ਹੀ ਆਪ ਹੈ ਔਰ ਆਪ ਹੀ ਉਤਪਤ ਕਰਤਾ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ ਸਾਰਾ ਜਗਤ ਤੇਰਾ ਆਪਣਾ ਹੀ (ਸਰਗੁਣ) ਰੂਪ ਹੈ, ਤੇ ਇਹ ਤੈਥੋਂ ਹੀ ਇਸ ਦਿੱਸਦੇ ਰੂਪ ਵਿਚ ਆਇਆ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਪੰਨਿਆ = ਪੈਦਾ ਹੋਇਆ, ਦਿੱਸਦੇ ਰੂਪ ਵਿਚ ਆਇਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor desde Sí crea lo que crea;"