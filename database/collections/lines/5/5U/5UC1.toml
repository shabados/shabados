[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਇਕੁ ਲਖੁ ਪੂਤ; ਸਵਾ ਲਖੁ ਨਾਤੀ ॥"
page = 481
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "A lac of sons and a lac and quarter of grandsons;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਕ ਲੱਖ ਪੁੱਤ੍ਰ ਅਤੇ ਸਵਾ ਲੱਖ ਪੋਤ੍ਰੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Thousands of sons and thousands of grandsons"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਰਾਵਨ ਕੇ ਘਰ ਮੇਂ ਏਕ ਲਾਖ ਪੁਤ੍ਰ ਔਰ ਸਵਾ ਲਾਖ (ਨਾਤੀ) ਪੋਤਾ ਥਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਰਾਵਣ ਦੇ ਇੱਕ ਲੱਖ ਪੁੱਤਰ ਤੇ ਸਵਾ ਲੱਖ ਪੋਤਰੇ (ਦੱਸੇ ਜਾਂਦੇ ਹਨ),"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਾਤੀ = ਪੋਤਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cien mil hijos y muchos más nietos él tenía,"