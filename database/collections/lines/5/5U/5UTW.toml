[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਆਸਾ ਵਿਚਿ, ਨਿਰਾਸੁ ਵਲਾਈ ॥੧੪॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "In the midst of desires he remains free from them."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "(ਗੁਰਮੁਖ ਮਾਰਗ) ਆਸਾ ਵਿਚ ਨਿਰਾਸ ਰਹਿੰਦਾ ਹੈ।"