type = "primary"
data = "ਯੌ ਬਰਦਾਨ ਰੁਦ੍ਰ ਤੇ ਲਿਯੋ ॥"
page = 1013

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "He meditated for a long time and attained a boon from Shiva."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਰੁਦ੍ਰ ਤੋਂ ਇਹ ਵਰ ਪ੍ਰਾਪਤ ਕੀਤਾ।"