data = "ਆਪਣੇ (ਬੰਸ ਦੀ) ਕੀਰਤੀ ਦਾ ਵਰਣਨ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ ॥੫੧॥"