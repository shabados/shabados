[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਦਿਜ ਸੁਨ ਬਾਤ ਚਲੇ ਸਭ ਧਾਮਾ ॥"
page = 152

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Hearing these words of the king, all the Brahmins went to their homes,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਬ੍ਰਾਹਮਣ ਇਹ ਗੱਲ ਸੁਣ ਕੇ ਘਰਾਂ ਨੂੰ ਚਲੇ ਗਏ (ਇਹ ਕਹਿ ਕੇ ਅਸੀਂ ਸਲਾਹ ਕਰ ਕੇ ਉੱਤਰ ਦਿਆਂਗੇ)।"