[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਨਮ ਜਨਮ ਕੇ ਮਿਟੇ ਬਿਤਾਲ ॥੫॥"
page = 1349
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "and my disharmony with Him of the many births has ended."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਨਾਲ ਮੇਰਾ ਅਨੇਕਾਂ ਜਨਮਾਂ ਦਾ ਬੇਸੁਰਾ-ਪਣ ਮੁਕ ਗਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "My disharmony with Him of so many lifetimes is ended. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਬ ਜਨਮ ਜਨਮਾਂਤ੍ਰੋਂ ਕੇ ਜੋ ਹਮ ਕੋ ਕਾਮ, ਕ੍ਰੋਧ ਆਦੀ ਪਿਸਾਚ ਲਾਗੇ ਹੂਏ ਥੇ, ਸੋ ਮਿਟ ਗਏ ਹੈਂ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹਨਾਂ ਦੇ) ਅਨੇਕਾਂ ਜਨਮਾਂ ਦੇ ਬੇ-ਥਵ੍ਹੇ-ਪਨ ਮਿਟ ਜਾਂਦੇ ਹਨ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਿਤਾਲ = (ਜੀਵਨ-ਸਫ਼ਰ ਵਿਚ) ਤਾਲੋਂ ਖੁੰਝੇ ਹੋਏ ਕਦਮ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "mi desarmonía con Él, durante tantas vidas ha terminado. (5)"