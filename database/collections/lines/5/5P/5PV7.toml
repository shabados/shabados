language = "pa"
data = "ਉਸ ਦਾ ਉਜੜਿਆ ਹੋਇਆ ਘਰ ਸੱਚ ਦੀ ਪਰਾਪਤੀ ਨਾਲ ਆਬਾਦ ਹੋ ਗਿਆ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਖ਼ਾਨਾਇ ਵੀਰਾਂ ਜ਼ਿ ਹੱਕ ਆਬਾਦਾ ਸ਼ੁਦ ॥੨੦੪॥"

