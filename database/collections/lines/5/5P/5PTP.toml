[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਉਨ ਸੂਰਨ ਤੇ ਨਹਿ ਏਕ ਬਚਿਯੋ; ਦੁਖ ਹੈ ਛਤਿਯਾ, ਕਿਹ ਭਾਤਿ ਭਰੈ ॥"
page = 990

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘Dear Rani, we have lost, may be, but our Raja is not dead."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਸੂਰਮਿਆਂ ਤੋਂ ਇਕ ਨਹੀਂ ਬਚਿਆ। ਮੇਰੀ ਛਾਤੀ ਵਿਚ ਦੁਖ ਭਰਿਆ ਪਿਆ ਹੈ, ਇਸ ਨੂੰ ਕਿਸ ਤਰ੍ਹਾਂ (ਦੂਰ ਕਰਾਂ)।"