[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਾ ਕੀ ਮਹਿਮਾ; ਗਨੀ ਨ ਆਵੈ ॥"
page = 262
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "his praises cannot be recounted."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀਆਂ ਸਿਫ਼ਤ-ਸ਼ਲਾਘਾ ਗਿਣੀਆਂ ਨਹੀਂ ਜਾ ਸਕਦੀਆਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "the praises of his glory cannot be recounted."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਕਿੰਚਤ ਮਾਤ੍ਰ ਜਪਣੇ ਕੀ, ਵਾ ਤਿਸ ਪੁਰਸ਼ ਕੀ ਮਹਿਮਾ ਗਿਣਤੀ ਮੇਂ ਨਹੀਂ ਆਵਤੀ॥☬ਤਾਂ ਤੇ ਐਸੇ ਬੇਨਤੀ ਕਰੋ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੀ ਵਡਿਆਈ ਬਿਆਨ ਨਹੀਂ ਹੋ ਸਕਦੀ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਹਿਮਾ = ਵਡਿਆਈ।"

