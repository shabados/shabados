[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਸਹਿ ਸਹਾਈ; ਗੋਬਿਦੁ ਮੇਰਾ ॥"
page = 199
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Death does not come near to him whose helper is Lord. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਸਹਾਇਕ ਮੇਰਾ ਸੁਆਮੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who have my Lord of the Universe as their support"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਸਹਾਇਤਾ ਕਰਨੇ ਵਾਲਾ ਮੇਰਾ ਗੋਬਿੰਦ ਹੋਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਮੇਰਾ ਗੋਬਿੰਦ ਜਿਸ ਮਨੁੱਖ ਦਾ ਸਹਾਈ ਬਣਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਸਹਿ ਸਹਾਈ = ਜਿਸ ਦੀ ਸਹਾਇਤਾ ਕਰਨ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La muerte no alcanza a aquél que tiene el Apoyo de Dios,"