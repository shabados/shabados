assets = ["DGDG"]
type = "primary"
data = "ਜਨੁ ਖੋਯੋ ਨਿਧਨੀ ਧਨੁ ਟੋਰੈ ॥੧੨॥"
page = 961

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They honnobbed their hands like a poor man who tried to move his hands searching for his last wealth.(12)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਮਾਨੋ ਕੋਈ ਨਿਰਧਨ ਗਵਾਚੇ ਹੋਏ ਧਨ ਨੂੰ ਲਭ ਰਿਹਾ ਹੋਵੇ ॥੧੨॥"