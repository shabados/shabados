[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕਾਹੇ ਕਉ ਪ੍ਰਾਨਨ ਸੋ ਧਨ ਖੋਵਤ, ਜਾਹੁ ਭਲੇ ਹਥਿਯਾਰਨ ਦੈ ਕੈ ॥੧੪੪੫॥"
page = 441

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Why do you want to lose your life? Run away and give your weapons to us.”1445."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਤੂੰ) ਪ੍ਰਾਣਾਂ ਵਰਗੇ ਧਨ ਨੂੰ ਕਿਸ ਲਈ ਨਸ਼ਟ ਕਰਦਾ ਹੈਂ, (ਇਸ ਲਈ) ਹਥਿਆਰ ਸੁਟ ਕੇ ਸੁਖ ਨਾਲ ਘਰ ਨੂੰ ਚਲਾ ਜਾ ॥੧੪੪੫॥"