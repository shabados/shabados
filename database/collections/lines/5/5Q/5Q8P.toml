[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਬ੍ਰਹਮੇ ਬਿਸਨ ਮਹੇਸ; ਨ ਦਰਸਨੁ ਪਾਇਆ ॥੩॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Brahma, Visnu and Mahesa cannot have the sight of the Lord (but the gurmukhs have the same)"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਮਾ ਵਿਸ਼ਨੂੰ, ਸ਼ਿਵ (ਤਿੰਨੇ ਦੇਵਤੇ ਬੀ) ਦਰਸ਼ਨ ਨਹੀਂ ਪਾ ਸਕਦੇ।"