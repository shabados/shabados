[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਬਿਨੁ ਨਾਵੈ; ਸਭ ਫਿਰੈ ਬਉਰਾਣੀ ॥੫॥"
page = 424
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Without the Name every one wanders about like a mad man."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਨਾਮ ਦੇ ਬਗੈਰ ਹਰ ਕੋਈ ਪਾਗਲ ਪੁਰਸ਼ ਦੀ ਮਾਨਿਦ ਭਟਕਦਾ ਫਿਰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Without the Name, everyone wanders around insane. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਬਿਨਾਂ ਨਾਮ ਕੇ ਸਾਰੀ ਸ੍ਰਿਸ਼ਟੀ (ਬਉਰਾਣੀ) ਕਮਲੀ ਫਿਰਤੀ ਹੈ॥੫॥☬ਪ੍ਰਸ਼ਨ: ਮਾਇਆ ਕੀ ਪ੍ਰਬਲਤਾ ਕਿਸੀ ਲੋਕ ਮੇਂ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਦੇ ਨਾਮ ਤੋਂ ਖੁੰਝ ਕੇ (ਹਰੇਕ ਜੁਗ ਵਿਚ ਹੀ) ਝੱਲੀ ਲੁਕਾਈ ਭਟਕਦੀ ਰਹੀ ਹੈ ॥੫॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਉਰਾਣੀ = ਕਮਲੀ, ਪਾਗਲ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre del Señor, el mundo vaga como loco. (5)"