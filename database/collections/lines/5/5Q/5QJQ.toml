[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਕਯਥੁ ਸੁ ਹੀਉ, ਜਿਤੁ ਹੀਅ ਬਸੈ; ਗੁਰ ਅਮਰਦਾਸੁ, ਨਿਜ ਜਗਤ ਪਿਤ ॥"
page = 1394
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Fruitful is the mind, in which mind Guru Amar Dass, the father of the world, himself abides."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਫਲ ਹੈ ਉਹ ਹਿਰਦਾ, ਜਿਸ ਹਿਰਦੇ ਅੰਦਰ ਸੰਸਾਰ ਦਾ ਪਿਤਾ, ਗੁਰੂ ਅਮਰਦਾਸ ਖੁਦ ਨਿਵਾਸ ਰਖਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Fruitful is the heart in which Guru Amar Daas, the Father of the world, Himself abides."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋਈ ਰਿਦਾ ਸਫਲ ਹੈ ਜਿਸ ਰਿਦੇ ਮੇਂ ਸ੍ਰੀ ਗੁਰੂ ਅਮਰਦਾਸ ਸਾਹਿਬ ਜੀ ਸਰਬ ਜਗਤ ਕੇ ਪਿਤਾ ਰੂਪ ਆਪ ਨਿਵਾਸ ਕਰੇਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਹੀ ਹਿਰਦਾ ਸਕਾਰਥਾ ਹੈ, ਜਿਸ ਹਿਰਦੇ ਵਿਚ ਜਗਤ ਦਾ ਪਿਤਾ ਪਿਆਰਾ ਗੁਰੂ ਅਮਰਦਾਸ ਜੀ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੀਉ = ਹਿਰਦਾ। ਜਿਤੁ ਹੀਅ = ਜਿਸ ਹਿਰਦੇ ਵਿਚ। ਨਿਜ = ਆਪਣਾ। ਜਗਤ ਪਿਤ = ਜਗਤ ਦਾ ਪਿਤਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Supremamente fructífera es la cabeza, dice Yalap,"