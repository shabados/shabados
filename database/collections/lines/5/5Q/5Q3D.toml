[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ ਸਾਚਾ ਸਬਦਿ ਪਛਾਤਾ ॥"
page = 1051
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "By the Guru's grace, the True Name is recognised."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਸੱਚਾ ਨਾਮ ਸਿੰਝਾਣਿਆ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh realizes the True Word of the Shabad."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗੁਰਮੁਖੋਂ ਨੇ ਸਾਚਾ ਬ੍ਰਹਮ ਪਛਾਣਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਮਨੁੱਖ ਨੇ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ ਸਦਾ-ਥਿਰ ਪਰਮਾਤਮਾ ਨਾਲ ਸਾਂਝ ਪਾ ਲਈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿ ਕੇ। ਸਾਚਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ ਪਰਮਾਤਮਾ। ਸਬਦਿ = ਗੁਰੂ ਦੇ ਸ਼ਬਦ ਦੀ ਰਾਹੀਂ। ਪਛਾਤਾ = ਪਛਾਣ ਲਿਆ, ਸਾਂਝ ਪਾ ਲਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Gurmukj toma Conciencia de la Palabra Verdadera del Shabd,"