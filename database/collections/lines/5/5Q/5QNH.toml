[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਲਿ ਮੋਹੁ. ਘਸਿ ਮਸੁ ਕਰਿ; ਮਤਿ ਕਾਗਦੁ ਕਰਿ ਸਾਰੁ ॥"
page = 16
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Burnt wordly love and pound it into ink and turn thy intelligence into superior paper."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੰਸਾਰੀ ਮਮਤਾ ਨੂੰ ਸਾੜ ਸੁੱਟ ਅਤੇ ਇਸਨੂੰ ਪੀਹ ਕੇ ਸਿਆਹੀ ਬਣਾ ਅਤੇ ਆਪਣੀ ਅਕਲ ਨੂੰ ਵਧੀਆ ਕਾਗਜ਼ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Burn emotional attachment, and grind it into ink. Transform your intelligence into the purest of paper."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੋਹ ਕੋ ਜਲਾ ਕਰ ਕੇ ਵਾ (ਜਾਲਿ) ਸਮੂਹ ਜੋ ਇਸਤ੍ਰੀ, ਧਨ, ਪੁਤ੍ਰਾਦਿਕੋਂ ਕਾ ਮੋਹੁ ਹੈ, ਤਿਸ ਕੋ (ਘਸਿ) ਰਗੜ ਕਰ, ਭਾਵ ਕਟ ਕਰ ਕੇ (ਮਸੁ) ਸਿਆਹੀ ਬਨਾਓ, ਅਰੁ (ਮਤਿ) ਬੁਧੀ ਰੂਪੀ (ਸਾਰੁ) ਸ੍ਰੇਸਟ ਕਾਗਦੁ ਬਨਾਓ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ! ਮਾਇਆ ਦਾ) ਮੋਹ ਸਾੜ ਕੇ (ਉਸ ਨੂੰ) ਘਸਾ ਕੇ ਸਿਆਹੀ ਬਣਾ ਤੇ (ਆਪਣੀ) ਅਕਲ ਨੂੰ ਸੋਹਣਾ ਕਾਗ਼ਜ਼ ਬਣਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਲਿ = ਸਾੜ ਕੇ। ਘਸਿ = ਘਸਾ ਕੇ। ਮਸੁ = ਸਿਆਹੀ {ਇਹ ਲਫ਼ਜ਼ ਇਸਤ੍ਰੀ-ਲਿੰਗ ਹੈ ਤੇ ਸਦਾ (ੁ) ਅੰਤ ਹੁੰਦਾ ਹੈ}। ਸਾਰੁ = ਵਧੀਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Quema el amor mundano y el polvo que queda vuélvelo tinta, haz de tu inteligencia el mejor papel."