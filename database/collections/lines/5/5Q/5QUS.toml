[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੁਣਿ ਗਲਾ; ਗੁਰ ਪਹਿ ਆਇਆ ॥"
page = 74
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Having heard words regarding Him I went to the Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਨ੍ਹਾਂ ਬਾਰੇ ਬਚਨ ਸਰਵਣ ਕਰਕੇ, ਮੈਂ ਗੁਰਾਂ ਦੇ ਕੋਲਿ ਪੁੱਜਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I heard of the Guru, and so I went to Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਵਾਹਿਗੁਰੂ ਪ੍ਰਾਪਤਿ ਹੋਣੇ ਕੀ (ਗਲਾ) ਵਾਰਤਾਂ ਗੁਰੋਂ ਕੇ ਪਾਸੋਂ ਸ੍ਰਵਨ ਕਰਨ ਕੇ ਵਾਸਤੇ ਵਾ ਸੁਣ ਕੇ ਘਰ ਮੇਂ ਆਇਆ ਹੂੰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਗੁਰੂ ਦੀ ਵਡਿਆਈ ਦੀਆਂ) ਗੱਲਾਂ ਸੁਣ ਕੇ ਮੈਂ ਭੀ ਗੁਰੂ ਦੇ ਕੋਲ ਆ ਗਿਆ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੁਣਿ = ਸੁਣ ਕੇ। ਪਹਿ = ਪਾਸ, ਕੋਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Así como escuché de Él, llamé al Guru"