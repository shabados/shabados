[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪਨੀ ਬਣਤ; ਆਪਿ ਬਨਾਈ ॥"
page = 277
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His own handi-work, He has Himself made."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਨਿੱਜ ਦੀ ਬਣਤਰ, ਉਸ ਨੇ ਖੁਦ ਹੀ ਬਣਾਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself fashioned His own handiwork."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੀ ਬਨਾਵਟ, ਭਾਵ ਰਚਨਾ ਤਿਸ ਨੇ ਆਪ ਹੀ ਬਨਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹ (ਜਗਤ-) ਰਚਨਾ ਉਸ ਨੇ ਆਪ ਰਚੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਣਤ = ਬਨਾਵਟ, ਆਕਾਰ, ਜਗਤ-ਰੂਪ ਘਾੜਤ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Mismo ha generado la creación entera,"