[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨ ਉਧਰਣ ਕਾ; ਸਾਜੁ ਨਾਹਿ ॥"
page = 1192
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "To emancipate himself man makes no preparation."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਆਪ ਨੂੰ ਮੁਕਤ ਕਰਨ ਦੀ ਇਨਸਾਨ ਕੋਈ ਤਿਆਰੀ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The mortal makes no arrangements to save himself."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਕੇ ਉਧਾਰ ਕਰਨੇ ਕਾ ਜੀਵ ਨੇ ਕੋਈ (ਸਾਜ) ਬਨਾਉ ਅਰਥਾਤ ਉਪਾਉ ਨਹੀਂ ਕੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਮਨ ਨੂੰ (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਦੇ ਵਿਕਾਰਾਂ ਵਿਚ ਡੁੱਬਣ ਤੋਂ) ਬਚਾਣ ਦਾ ਉਹ ਕੋਈ ਉੱਦਮ ਨਹੀਂ ਕਰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਧਰਣ ਕਾ = (ਸੰਸਾਰ-ਸਮੁੰਦਰ ਵਿਚ ਡੁੱਬਣ ਤੋਂ) ਬਚਾਣ ਦਾ। ਸਾਜੁ = ਉੱਦਮ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no llega a conocer su Destino al no saber cómo emancipar su propia mente,"