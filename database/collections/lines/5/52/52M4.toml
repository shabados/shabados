[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਿਤੁ ਸੇਵਿਐ; ਸਦਾ ਸੁਖੁ ਹੋਇ ॥"
page = 1174
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "by serving whom lasting peace is procured."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦੀ ਸੇਵਾ ਕਰਨ ਨਾਲ ਸਦੀਵੀ ਆਰਾਮ ਪ੍ਰਾਪਤ ਹੋ ਜਾਂਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Serving Him, eternal peace is obtained."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੇ ਸੇਵਨੇ ਕਰ ਸਦਾ ਕਾ ਸੁਖੁ, ਭਾਵ ਆਤਮ ਅਨੰਦ ਪ੍ਰਾਪਤਿ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਜਿਸ ਦੀ ਭਗਤੀ ਕੀਤਿਆਂ ਸਦਾ ਆਤਮਕ ਆਨੰਦ ਬਣਿਆ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਿਤੁ = ਜਿਸ ਦੀ ਰਾਹੀਂ। ਜਿਤੁ ਸੇਵਿਐ = ਜਿਸ ਦੀ ਭਗਤੀ ਕਰਨ ਨਾਲ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "logras el Estado de Éxtasis para siempre."