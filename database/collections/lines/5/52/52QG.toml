[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪਾਰਬ੍ਰਹਮਿ ਪ੍ਰਭਿ; ਮੇਘੁ ਪਠਾਇਆ ॥"
page = 106
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lofty Lord Master has sent the cloud."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਚੇ ਸੁਆਮੀ ਮਾਲਕ ਨੇ ਬੱਦਲ ਭੇਜਿਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Supreme Lord God has unleashed the rain clouds."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਪਾਰਬ੍ਰਹਮੁ ਪ੍ਰਭੂ ਨੇ ਗੁਰੂ ਰੂਪ ਬਾਦਲ ਭੇਜਿਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਵੇਂ ਜਦੋਂ ਭੀ) ਪਾਰਬ੍ਰਹਮ ਪ੍ਰਭੂ ਨੇ ਬੱਦਲ ਘੱਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਾਰਬ੍ਰਹਮਿ = ਪਾਰਬ੍ਰਹਮ ਨੇ। ਪ੍ਰਭਿ = ਪ੍ਰਭੂ ਨੇ। ਮੇਘ = ਬੱਦਲ। ਪਠਾਇਆ = ਭੇਜਿਆ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Supremo ha enviado la lluvia"