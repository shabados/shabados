[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵੀਚਾਰੀ ਵੀਚਾਰਿ, ਭੇਤੁ ਨ ਦੇਵਹੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The thinkers also could know nothing about His mystery."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਵੀਚਾਰ ਕਰਣਹਾਰੇ ਵਿਚਾਰਦੇ ਹਨ, (ਪਰੰਤੂ) ਭੇਤ ਨਹੀਂ ਦੇ ਸਕਦੇ।"