data = "ਸਗਲ ਬਟਰੀਆ ॥"
page = 537
line = 6

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the mortals are the way-farers,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਪ੍ਰਾਣੀ ਮੁਸਾਫਰ ਹਨ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "All are travellers,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਸੇਂ ਯਹ ਕਿ ਸਭੀ ਜੀਵ (ਬਟਰੀਆ) ਬਟਾਊ ਅਰਥਾਤ ਰਾਹੀ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਜੀਵ (ਇਥੇ) ਰਾਹੀ ਹੀ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਬਟਰੀਆ = (ਵਾਟ = ਰਸਤਾ) ਰਾਹੀ, ਮੁਸਾਫ਼ਿਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Todos los hombres son pasajeros,"