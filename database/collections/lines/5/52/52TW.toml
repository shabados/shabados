[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਠਾਢਿ ਪਾਈ ਕਰਤਾਰੇ ॥"
page = 622
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Creator has brought peace to my home,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਿਰਜਣਹਾਰ ਨੇ ਮੇਰੇ ਘਰ ਵਿੱਚ ਠੰਢ-ਚੈਨ ਵਰਤਾ ਦਿੱਤੀ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Creator has brought utter peace to my home;"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਰਤਾ ਨੇ ਠੰਢ ਪਾਈ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਿਸ ਮਨੁੱਖ ਦੇ ਅੰਦਰ ਕਰਤਾਰ ਨੇ ਠੰਡ ਵਰਤਾ ਦਿੱਤੀ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਠਾਢਿ = ਠੰਢ, ਸ਼ਾਂਤੀ। ਕਰਤਾਰੇ = ਕਰਤਾਰਿ, ਕਰਤਾਰ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mi Señor ha traído el Bienestar a mi hogar;"