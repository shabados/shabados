[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਭੂਲ ਚੂਕ ਅਪਨਾ ਬਾਰਿਕੁ ਬਖਸਿਆ; ਪਾਰਬ੍ਰਹਮ ਭਗਵਾਨਾ ॥੧॥"
page = 383
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His erring child, the fortunate transcendent Lord has pardoned."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਗਲਤੀ ਕਰਦੇ ਹੋਏ ਬੱਚੇ ਨੂੰ ਭਾਗਾਂ ਵਾਲੇ ਪਰਮ ਪ੍ਰਭੂ ਨੇ ਮਾਫ ਕਰ ਦਿਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The errant child has been forgiven by the Supreme Lord God. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮਨ ਕਰ ਕੇ ਭੂਲਾ ਹੂਆ ਬਾਣੀ ਕਰ ਕੇ ਚੂਕਾ ਹੂਆ ਜੋ ਮੈਂ ਬਾਲਕ ਹੂੰ, ਮੁਝ ਕੋ ਪਾਰਬ੍ਰਹਮ ਭਗਵਾਨ ਤੁਮ ਨੇ ਬਖਸ ਲਿਆ ਹੈ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੇਰੀਆਂ ਅਨੇਕਾਂ ਭੁੱਲਾਂ ਚੁੱਕਾਂ ਵੇਖ ਕੇ ਭੀ ਪਾਰਬ੍ਰਹਮ ਭਗਵਾਨ ਨੇ ਮੈਨੂੰ ਆਪਣੇ ਬਾਲਕ ਨੂੰ ਬਖ਼ਸ਼ ਲਿਆ ਹੈ ॥੧॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਭੂਲ ਚੂਕ = ਭੁੱਲਾਂ ਚੁੱਕਾਂ, ਗ਼ਲਤੀਆਂ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "A este niño el Señor le perdona todos sus errores; sí, Él, el Señor Trascendente, Quien es el Edificador de nuestro destino. (1)"