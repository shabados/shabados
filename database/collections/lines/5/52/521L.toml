data = "ਇਕ ਕਾਟ︀ਯੋ ਕਾਟ︀ਯੋ ਇਕ ਨਾਹੀ ॥"
page = 860

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "She put two melons in the pitcher; one was cut and the other whole."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਨੂੰ ਕਟ ਦਿੱਤਾ ਅਤੇ ਇਕ ਨੂੰ ਨਾ ਕਟਿਆ।"