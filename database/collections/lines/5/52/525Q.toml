[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪ੍ਰਭ ਕਉ ਸਿਮਰਹਿ; ਸੇ ਪੁਰਖ ਪ੍ਰਧਾਨ ॥"
page = 263
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The most distinguished are the men who meditate on the Master,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪਰਮ ਨਾਮਵਰ ਹਨ ਉਹ ਇਨਸਾਨ ਜੋ ਮਾਲਕ ਦਾ ਆਰਾਧਨ ਕਰਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who remember God are the most distinguished persons."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੋ ਪ੍ਰਭੂ ਕੌ ਸਿਮਰਤੇ ਹੈਂ ਸੋਈ ਪ੍ਰਧਾਨ ਅਰਥਾਤ ਮੁਖ੍ਯ ਪੁਰਖ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇ ਉਹ (ਸਭ ਮਨੁੱਖਾਂ ਤੋਂ) ਚੰਗੇ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੁਰਖ = ਮਨੁੱਖ। ਪ੍ਰਧਾਨ = ਸ੍ਰੇਸ਼ਟ, ਚੰਗੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ellos son los verdaderos regentes del mundo."