[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਨਮੁਖ ਖਾਧੇ; ਦੂਜੈ ਭਾਇ ॥੧॥ ਰਹਾਉ ॥"
page = 231
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The apostates have been eaten up by another's love. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੋਰਸੁ ਦੀ ਪ੍ਰੀਤ ਨੇ ਅਧਰਮੀਆਂ ਨੂੰ ਖਾ ਲਿਆ ਹੈ। ਠਹਿਰਾਉ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The self-willed manmukhs have been consumed by the love of duality. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਮਨਮੁਖੋਂ ਕਾ ਦ੍ਵੈਤ ਮੇਂ ਪ੍ਰੇਮ ਹੈ, ਸੋ ਕਾਲ ਨੇ ਖਾਏ ਹੈਂ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪਰ) ਜੇਹੜੇ ਮਨੁੱਖ ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਦੇ ਹਨ, ਮਾਇਆ ਦੇ ਪਿਆਰ ਵਿਚ (ਫਸਣ ਕਰਕੇ) ਉਹਨਾਂ ਦੇ ਆਤਮਕ ਜੀਵਨ ਖ਼ਤਮ ਹੋ ਜਾਂਦੇ ਹਨ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮਨਮੁਖ = ਆਪਣੇ ਮਨ ਦੇ ਪਿੱਛੇ ਤੁਰਨ ਵਾਲੇ। ਦੂਜੈ ਭਾਇ = ਮਾਇਆ ਦੇ ਪਿਆਰ ਵਿਚ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "pero los arrogantes Manmukjs son devastados por la dualidad. (1-Pausa)"