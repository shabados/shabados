[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਤਾ ਸੋ ਨੇਹੁ ਤੁਰਾਇ ਕੈ; ਕਿਯਾ ਆਪੁਨੋ ਯਾਰ ॥੧੬॥"
page = 869

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And making him to break with his wife, she won him over as her paramour.(16)(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਉਸ ਨਾਲੋਂ ਪ੍ਰੇਮ ਤੁੜਵਾ ਕੇ ਆਪਣਾ ਯਾਰ ਬਣਾ ਲਿਆ ॥੧੬॥"