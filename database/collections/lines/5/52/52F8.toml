[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸ ਤੇ ਊਪਰਿ; ਨਾਹੀ ਕੋਇ ॥"
page = 842
line = 11

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Higher than Him, there is absolutely none."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਸ ਦੇ ਉਤੇ ਅਸਲ ਹੀ ਹੋਰ ਕੋਈ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is none higher than Him."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸੇਵਕ ਸੇ ਉਪਰ ਔਰ ਕੋਈ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਉਸ (ਪਰਮਾਤਮਾ) ਨਾਲੋਂ ਵੱਡਾ ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਸ ਤੇ = {ਸੰਬੰਧਕ 'ਤੇ' ਦੇ ਕਾਰਨ ਲਫ਼ਜ਼ 'ਤਿਸੁ' ਦਾ (ੁ) ਉਡ ਗਿਆ ਹੈ}। ਊਪਰਿ = ਵੱਡਾ, ਉੱਚਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "No hay nadie más elevado que Él,"