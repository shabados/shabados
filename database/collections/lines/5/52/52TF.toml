[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦਾਸ ਕੀ ਰੇਣੁ. ਪਾਏ ਜੇ ਕੋਇ ॥"
page = 897
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "If any mortal is blessed with the dust of the feet of God's slave;"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੇਕਰ ਕਿਸੇ ਪ੍ਰਾਣੀ ਨੂੰ ਵਾਹਿਗੁਰੂ ਦੇ ਗੋਲੇ ਦੇ ਪੈਰਾਂ ਦੀ ਧੂੜ ਪ੍ਰਾਪਤ ਹੋ ਜਾਵੇ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "One who is blessed with the dust of the feet of the Lord's slave,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਐਸੇ ਸੰਤੋਂ ਕੇ ਚਰਨੋਂ ਕੀ ਧੂੜ ਜੋ ਕੋਈ ਜਨ ਪਾਵੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਇਹੋ ਜਿਹੇ ਪ੍ਰਭੂ-ਸੇਵਕ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ਜੇ ਕੋਈ ਮਨੁੱਖ ਪ੍ਰਾਪਤ ਕਰ ਲਏ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇਣੁ = ਚਰਨ-ਧੂੜ {ਨੋਟ: ਲਫ਼ਜ਼ 'ਰੇਣੁ' ਅਤੇ 'ਰੈਣਿ' ਦਾ ਫ਼ਰਕ ਚੇਤੇ = ਰੱਖਣ-ਯੋਗ ਹੈ}। ਕੋਇ = ਕੋਈ ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que es bendecido con el Polvo de los Pies de los Santos,"