[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੀਵਨਾ ਹਰਿ ਜੀਵਨਾ ॥"
page = 684
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The life, the divine life,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿੰਦਗੀ, ਰੱਬੀ ਜਿੰਦਗੀ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Life, spiritual life, is in the Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਤੀਨੋਂ ਕਾਲ ਮੇਂ ਜੀਵਨਾ ਹੋਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਇਹੀ ਹੈ ਅਸਲ ਜੀਵਨ, ਇਹੀ ਹੈ ਅਸਲ ਜ਼ਿੰਦਗ਼ੀ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "La Verdadera Vida significa vivir en Dios y contemplar el Nombre del Señor"