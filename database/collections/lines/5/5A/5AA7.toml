[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਇਹ ਪੈਂਡੇ ਆਯੋ ਹੁਤੋ; ਮੈ ਸੁਤ ਕਹਿਯੋ ਬੁਲਾਇ ॥੮॥"
page = 885

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "And told, ‘ He was roaming around and I have adopted him as our son.(8)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਹ ਰਸਤੇ ਵਿਚ ਆ ਰਿਹਾ ਸੀ, ਮੈਂ ਇਸ ਨੂੰ ਬੁਲਾ ਕੇ ਪੁੱਤਰ ਬਣਾ ਲਿਆ ਹੈ ॥੮॥"