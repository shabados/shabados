[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਨਦਿਨੋ; ਪ੍ਰਭ ਧਿਆਵਉ ॥"
page = 408
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Night and day I meditate on the Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰੈਣ ਦਿਹੁੰ ਮੈਂ ਸੁਆਮੀ ਦਾ ਸਿਮਰਨ ਕਰਦਾ ਹਾਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Night and day, meditate on God."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਰਾਤ ਦਿਨ ਪ੍ਰਭ ਕਾ ਧਿਆਨ ਕਰੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮੈਂ ਤਾਂ ਹਰ ਵੇਲੇ ਪਰਮਾਤਮਾ ਦਾ ਧਿਆਨ ਧਰਦਾ ਹਾਂ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਨਦਿਨੋ = ਹਰ ਰੋਜ਼। ਧਿਆਵਉ = ਮੈਂ ਸਿਮਰਦਾ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Y contemplo a mi Señor siempre y para siempre, y victorioso,"