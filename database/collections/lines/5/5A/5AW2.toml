[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਰਾਨੀ ਜਾਹਿ ਬੁਲਾਇ ਕੈ; ਭੇਦ ਕਹਿਯੋ ਸਮਝਾਇ ॥"
page = 909

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The Rani had called some body and made him to discern (the secret)."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਰਾਣੀ ਨੇ ਜਿਸ (ਵਿਅਕਤੀ) ਨੂੰ ਬੁਲਾ ਕੇ ਸਾਰੀ ਭੇਦ ਦੀ ਗੱਲ ਦਸੀ ਸੀ,"