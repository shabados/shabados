data = "ਦੇਸ ਆਨਿ ਅਪਨੇ ਬਸੇ; ਤਿਯ ਕੋ ਸਦਨ ਬਨਾਇ ॥"
page = 964

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "‘They had come to their own country now,"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਆਪਣੇ ਦੇਸ ਵਿਚ ਆ ਕੇ ਵਸ ਗਏ ਅਤੇ ਰਾਣੀ ਨੂੰ ਨਵਾਂ ਮਹੱਲ ਬਣਵਾ ਦਿੱਤਾ।"