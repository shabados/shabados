[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਾਹ ਵਾਪਾਰੀ; ਦੁਆਰੈ ਆਏ ॥"
page = 372
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Banker! the dealer has come to thy door."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਸ਼ਾਹੂਕਾਰ! ਵਣਜਾਰਾ ਤੇਰੇ ਬੂਹੇ ਤੇ ਆਇਆ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I have come to the door of the Trader."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਹੁ ਸਤਗੁਰੂ ਸੰਤੋ! ਜਗ੍ਯਾਸੀ ਬਾਪਾਰੀ ਆਪ ਕੇ ਦ੍ਵਾਰੇ ਆਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸ਼ਾਹ! ਹੇ ਸਤਿਗੁਰੂ! ਤੇਰੇ ਦਰ ਤੇ (ਨਾਮ ਦਾ ਵਣਜ ਕਰਨ ਵਾਲੇ) ਜੀਵ-ਵਪਾਰੀ ਆਏ ਹਨ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਾਹ = ਹੇ ਸ਼ਾਹ! ਹੇ ਗੁਰੂ! ਦੁਆਰੈ = ਦੁਆਰੇ ਤੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Llegué yo, el buscador, hasta la puerta del joyero diciendo,"