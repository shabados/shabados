[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਅਪੁਨੀ ਕੀਮਤਿ; ਆਪੇ ਪਾਏ ॥"
page = 287
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "His worth He Himself knows."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਪਣਾ ਮੁੱਲ ਉਹ ਆਪੇ ਹੀ ਜਾਣਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Only He Himself can estimate His worth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਅਪਨੀ ਕੀਮਤ ਕੋ ਵਹੁ ਆਪੇ ਹੀ ਪਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਆਪਣੀ ਬਜ਼ੁਰਗੀ ਦਾ ਮੁੱਲ ਭੀ ਆਪ ਹੀ ਪਾਂਦਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y sólo Él conoce Su Verdadero Valor."