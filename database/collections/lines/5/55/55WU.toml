[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਦੁਬਿਧਾ ਓਹੁ ਨ ਏਹੁ, ਇਕੁ ਪਛਾਣਦੇ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "They do not have this or that dilemma and know only one Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਦੁਬਿਧਾ ਵਖੇ ਲੋਕ ਪ੍ਰਲੋਕ (ਦੀ ਬੀ ਪਰਵਾਹ) ਨਹੀਂ ਰਖਦੇ, ਇਕ (ਅਕਾਲ ਪੁਰਖ) ਨੂੰ ਹੀ ਪਛਾਣਦੇ ਹਨ।"