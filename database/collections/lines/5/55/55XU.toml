[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੀਨਿ ਬਾਰ; ਪਤੀਆ ਭਰਿ ਲੀਨਾ ॥"
page = 870
line = 18

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Three times he carried out the test."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤਿੰਨ ਵਾਰੀ ਉਸ ਨੇ ਤਜਰਬਾ ਕੀਤਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Three times, he tried to do it."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹਾਥੀ ਕੇ ਆਗੇ ਤੀਨ ਬੇਰ ਡਾਰਕੈ ਪਰਤਾਵਾ (ਭਰਿ ਲੀਨਾ) ਲੈ ਲੀਆ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਾਜ਼ੀ ਨੇ ਹਾਥੀ ਨੂੰ ਮੇਰੇ ਉਪਰ ਚਾੜ੍ਹ ਚਾੜ੍ਹ ਕੇ) ਤਿੰਨ ਵਾਰੀ ਪਰਤਾਵਾ ਲਿਆ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪਤੀਆ = ਪਰਤਾਵਾ, ਅਜ਼ਮਾਇਸ਼।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Tres veces trató de acabarme."