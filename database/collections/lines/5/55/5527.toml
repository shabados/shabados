[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਮੋ ਕਾਰਤਿਕ੍ਰਯਾਨੀ ਸਿਵਾ ਸੀਤਲਾਯੰ ॥੧੦॥੨੨੯॥"
page = 117

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art the power of Kartikeya and Shiva etc.! I salute thee.10.229."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਕਾਰਤਿਕਯਾਨੀ (ਕਾਰਤੀਕੇਯ-ਸ਼ਕਤੀ) ਸ਼ਿਵਾ ਅਤੇ ਸੀਤਲਾ ਨੂੰ ਨਮਸਕਾਰ ਹੈ ॥੧੦॥੨੨੯॥"