[[content]]
assets = ["GSNL"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਫੁਟਦੇ ਵਾਲਾਂ ਦੇ ਕੈਦੀ ਨੂੰ ਛੁਟਕਾਰੇ ਦੀ ਲੋੜ ਨਹੀਣ ।"

[[content]]
assets = ["GSNL"]
type = "primary"
data = "ਅਸੀਰਿ ਖ਼ਤਿ ਤੁਰਾ ਹਾਜਤਿ ਗਵਾਹੀ ਨੀਸਤ ॥੭॥੩॥"

[[content]]
assets = ["KEGP"]
type = "translation"
language = "en"
data = "The couplets of Goyaa are capable to grant life like the divine nectar,"