[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਵਡਾ ਵੇਪਰਵਾਹੁ, ਤਾਣੁ ਨਿਤਾਣੀਐ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "The true Guru is totally carefree yet He is the power of the powerless ones."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਵਡਾ ਬੇਪਰਵਾਹ ਹੈ, ਨਿਤਾਣਿਆਂ ਨੂੰ ਤਾਣ ਦਿੰਦਾ ਹੈ।"