[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਿਹਰ ਦਇਆ ਕਰਿ ਕਰਨੈਹਾਰ ॥"
page = 897
line = 5

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my Creator, extend Thine kindness and compassion unto me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਕਰਤਾਰ! ਤੂੰ ਆਪਣੀ ਰਹਿਮਤ ਅਤੇ ਮਿਹਰਬਾਨੀ ਮੇਰੇ ਉਤੇ ਧਾਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Be kind and compassionate to me, O Creator Lord."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੁਸਲਮਾਨ ਕਹਿਤੇ ਹੈਂ: ਮੇਹਰ ਕਰ ਔਰ ਹਿੰਦੂ ਕਹਿਤੇ ਹੈਂ: ਦਇਆ ਕਰ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਭ ਜੀਵਾਂ ਦੇ ਰਚਨਹਾਰ! ਹੇ ਸਿਰਜਣਹਾਰ! ਮਿਹਰ ਕਰ ਕੇ ਦਇਆ ਕਰ ਕੇ-"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਨੈਹਾਰ = ਹੇ ਪੈਦਾ ਕਰਨ ਵਾਲੇ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh Señor Creador, ten Compasión de mí"