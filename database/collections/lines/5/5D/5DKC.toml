[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਗਲ ਦੁਆਰ ਕਉ ਛਾਡਿ ਕੈ; ਗਹਿਓ ਤੁਹਾਰੋ ਦੁਆਰ ॥"
page = 290

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "O Lord! I have forsaken all other doors and have caught hold of only Thy door. O Lord! Thou has caught hold of my arm"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਦਰਾਂ ਨੂੰ ਛੱਡ ਕੇ, ਤੁਹਾਡਾ ਦਰ ਫੜਿਆ ਹੈ।"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਸਗਲ ਦੁਆਰ ਕਉ ਛਾਡਿ ਕੈ; ਗਹਿਓ ਤੁਹਾਰੋ ਦੁਆਰ ॥"