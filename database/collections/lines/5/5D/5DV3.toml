[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ ਦਾਸ; ਸਭਿ ਦੂਖ ਪਲਾਇਣ ॥੪॥੯॥੧੪॥"
page = 805
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "All the aliments of slave Nanak are allayed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੋਲੇ ਨਾਨਕ ਦੇ ਸਾਰੇ ਦੁਖੜੇ ਦੂਰ ਹੋ ਗਏ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O slave Nanak, all pains are relieved. ||4||9||14||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਨ ਤੇਰੇ ਦਾਸੋਂ ਕੇ ਜਨਮ ਮਰਣਾਦੀ ਦੁਖ ਸਰਬ ਭਾਗ ਜਾਤੇ ਭਏ ਹੈਂ॥੪॥੯॥੧੪॥☬ਪੁਨਾ: ਬੇਨਤੀ ਉਚਾਰਨ ਕਰਤੇ ਹੈਂ:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਦਾਸ ਨਾਨਕ! (ਆਖ-) ਉਸ ਦੇ ਸਾਰੇ ਦੁੱਖ ਦੂਰ ਹੋ ਜਾਂਦੇ ਹਨ ॥੪॥੯॥੧੪॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਭਿ = ਸਾਰੇ। ਪਲਾਇਣ = ਦੂਰ ਹੋ ਗਏ ਹਨ ॥੪॥੯॥੧੪॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "y así todas las aflicciones de Nanak, Su Esclavo, han pasado.  (4-9-14)"