[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤੁਮ ਸਮਸਰਿ; ਅਵਰੁ. ਕੋ ਨਾਹੀ ॥੬॥"
page = 416
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Equal to Thee, there is not another, O Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਬਰਾਬਰ ਦਾ ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੇ ਸੁਆਮੀ!"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "There is no one else equal to You. ||6||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਔਰ ਮੁਖ ਸੇ ਕਹਤੇ ਹੈਂ ਭਗਵੰਤ ਤੁਮਾਰੇ ਸਮਾਨ ਦੂਸਰਾ ਕੋਈ ਨਹੀਂ ਹੈ॥੬॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤੇਰੇ ਬਰਾਬਰ ਹੋਰ ਕੋਈ ਨਹੀਂ ਹੈ ॥੬॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਮਸਰਿ = ਬਰਾਬਰ ॥੬॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no hay ningún otro como Tú que yo pueda percibir. (6)"