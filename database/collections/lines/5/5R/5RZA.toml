[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਰੂ ਅੰਜੁਲੀ ਮਹਲਾ ੫ ਘਰੁ ੭ ॥"
page = 1007
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Maru Anjuli 5th Guru."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਾਰੂ ਅੰਜੁਲੀ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Maaroo, Anjulee ~ With Hands Cupped In Prayer, Fifth Mehl, Seventh House:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਮਾਰੂ, ਘਰ ੭ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਅੰਜੁਲੀ'।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅੰਜੁਲੀ = ਬੁੱਕ, (ਆਪਣੇ ਇਸ਼ਟ ਪਾਸੋਂ ਖ਼ੈਰ ਮੰਗਣ ਲਈ ਅੱਡਿਆ ਹੋਇਆ ਬੁੱਕ), ਦੋਵੇਂ ਹੱਥ ਜੋੜ ਕੇ ਕੀਤੀ ਹੋਈ ਅਰਜ਼ੋਈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Maru, Anyeli, la Súplica, Mejl Guru Aryan, Quinto Canal Divino."