[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਨਾਮ ਠਾਮ ਨ ਜਾਤਿ ਜਾ ਕਰ; ਰੂਪ ਰੰਗ ਨ ਰੇਖ ॥"
page = 5
line = 3

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Thou art Nameless, Placeless, Casteless, Formless, Colourless and Lineless."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਨਾਮ, ਧਾਮ, ਜਾਤਿ, ਰੂਪ, ਰੰਗ ਅਤੇ ਰੇਖ ਨਹੀਂ ਹੈ;"

[[content]]
assets = ["DDTK"]
type = "primary"
data = "ਨਾਮ ਠਾਮ ਨ ਜਾਤ ਜਾਕਰ; ਰੂਪ ਰੰਗ ਨ ਰੇਖ ॥"