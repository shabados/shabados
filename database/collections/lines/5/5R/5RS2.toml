[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਕੇਤੜਿਆਂ ਹੀ ਭੁਰਟੀਏ; ਦਰਬਾਰਾਂ ਅੰਦਰਿ ਦਰਬਾਰੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Many were Bhats who were courtiers in the bigger courts."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਕਿਤੜੇ ਭਟੀਏ (ਕੌਮ ਦੇ) ਦਰਬਾਰਾਂ ਵਿਚ 'ਦਰਬਾਰੀ' ਹਨ।"