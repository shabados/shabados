data = "ਰੇ ਮਹਾਵਤ; ਤੁਝੁ ਡਾਰਉ ਕਾਟਿ ॥"
page = 870
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O driver, I shall have thee cut into pieces."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਥਵਾਨ! ਮੈਂ ਤੈਨੂੰ ਟੋਟੇ ਟੋਟੇ ਕਰਵਾ ਦਿਆਂਗਾ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He yelled out, \"O driver, I shall cut you into pieces."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮਹਾਵਤ! ਤੇਰੇ ਕੋ ਕਾਟ ਡਾਰੋਂਗਾ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਕਾਜ਼ੀ ਆਖਦਾ ਹੈ-) ਨਹੀਂ ਤਾਂ ਮੈਂ ਤੇਰਾ ਸਿਰ ਉਤਰਾ ਦਿਆਂਗਾ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਰੇ = ਹੇ!"

