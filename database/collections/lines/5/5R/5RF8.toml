[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾਨ ਪ੍ਰਬੀਨ ਸੁਆਮੀ ਪ੍ਰਭ ਮੇਰੇ; ਸਰਣਿ ਤੁਮਾਰੀ ਅਹੀ ॥"
page = 529
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Knowing Thee to be all-wise, O my Lord Master, I have desired Thine shelter."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੈਨੂੰ ਹਰ ਤਰ੍ਹਾਂ ਸਿਆਣਾ ਸਮਝ ਕੇ, ਹੇ ਮੈਂਡੇ ਸਾਹਿਬ ਮਾਲਕ! ਮੈਂ ਤੇਰੀ ਸ਼ਰਨ ਦੀ ਚਾਹਨਾ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I know that You are all-wise, O God, my Lord and Master; I seek Your Sanctuary."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਮੇਰੇ ਸ੍ਵਾਮੀ ਸਮਰੱਥ! ਆਪ ਕੋ ਸਭ ਪ੍ਰਕਾਰ ਚਤੁਰ ਜਾਨ ਕਰ ਤੁਮਾਰੀ ਸਰਣਿ (ਅਹੀ) ਲਈ ਵਾ ਚਾਹੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸੁਜਾਨ ਤੇ ਸਿਆਣੇ ਮਾਲਕ! ਹੇ ਮੇਰੇ ਪ੍ਰਭੂ! ਮੈਂ ਤੇਰੀ ਸਰਨ ਆਇਆ ਹਾਂ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜਾਨ = ਹੇ ਸੁਜਾਨ! ਪ੍ਰਬੀਨ = ਹੇ ਸਿਆਣੇ! ਅਹੀ = ਮੰਗੀ ਹੈ, ਆਇਆ ਹਾਂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sabiendo, oh Señor, que eres el Maestro Omnisapiente, he buscado Tu Refugio."