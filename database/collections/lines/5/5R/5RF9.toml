[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਹੰਸਾਂ ਨਾਲਿ ਟਟੀਹਰੀ; ਕਿਉ ਪਹੁਚੈ ਦਉੜੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "How a plover can fly equal to a swan."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਹੰਸਾਂ ਦੇ ਨਾਲ ਟਟੀਹਰੀ (ਨਿੱਕੀ ਗੁਟਾਰ) ਕਿੱਕੁਰ ਦੌੜਕੇ ਪਹੁੰਚ ਸਕਦੀ ਹੈ।"