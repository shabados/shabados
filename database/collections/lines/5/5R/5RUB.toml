[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਰਿ ਕਿਰਪਾ; ਗੁਰ ਦੀਨੋ ਨਾਉ ॥"
page = 395
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Guru has mercifully given me God's Name"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮਿਹਰਬਾਨੀ ਕਰਕੇ ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਹਰੀ ਦਾ ਨਾਮ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "In His Mercy, the Guru bestows the Lord's Name."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਗੁਰੋਂ ਨੇ ਕ੍ਰਿਪਾ ਕਰ ਕੇ ਮੁਝੇ ਨਾਮ ਦੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੇ ਕਿਰਪਾ ਕਰ ਕੇ ਮੈਨੂੰ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਦਿੱਤਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਕਰਿ = ਕਰ ਕੇ। ਗੁਰਿ = ਗੁਰੂ ਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "el Nombre del Señor, y su mente está siempre en Éxtasis."