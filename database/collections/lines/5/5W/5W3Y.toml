[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗਿਆਨੀਆ ਨੋ ਸਭੁ ਸਚੁ ਹੈ; ਸਚੁ ਸੋਝੀ ਹੋਈ ॥"
page = 425
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The divine scholars know nothing but truth as they obtain true understanding."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਬ੍ਰਹਿਮ ਬੇਤੇ ਨਿਰੋਲ ਸੱਚ ਨੂੰ ਹੀ ਜਾਣਦੇ ਹਨ। ਉਨ੍ਹਾਂ ਨੂੰ ਸੱਚ ਸਮਝ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The spiritual teachers know nothing but the Truth; they obtain true understanding."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਗਿਆਨੀ ਪੁਰਖੋਂ ਕੋ ਸਭ ਸਥਾਨ ਮੇਂ ਸਚ ਹੀ ਪ੍ਰਤੀਤ ਹੋਤਾ ਹੈ, ਕ੍ਯੋਂਕਿ ਤਿਨ ਕੋ ਸਚ ਕੀ ਬੂਝ ਭਲੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸਹੀ ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੂਝ ਵਾਲੇ ਬੰਦਿਆਂ ਨੂੰ ਹਰ ਥਾਂ ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ ਹੀ ਦਿੱਸਦਾ ਹੈ (ਪ੍ਰਭੂ ਦੀ ਮੇਹਰ ਨਾਲ ਉਹਨਾਂ ਨੂੰ) ਇਹੀ ਸਮਝ ਆ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗਿਆਨੀ = ਆਤਮਕ ਜੀਵਨ ਦੀ ਸੂਝ ਵਾਲਾ ਮਨੁੱਖ। ਸਭੁ = ਹਰ ਥਾਂ। ਸਚੁ = ਸਦਾ-ਥਿਰ ਪ੍ਰਭੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Los Sabios no saben más que la Verdad,"