[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਰਹਰ ਸਭੇ ਸਾਕ; ਸੁਰੰਗ ਰੰਗੀਵਣਾ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Repudiating all worldly connections he must remain dyed in the colour of the Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸਾਰੇ ਸਾਕਾਂ ਨੂੰ ਛੱਡਕੇ (ਇਕ ਭਗਤੀ ਦੇ) ਸੁਹਣੇ ਰੰਗ ਵਿਖੇ ਰੰਗਿਆ ਰਹੇ।"