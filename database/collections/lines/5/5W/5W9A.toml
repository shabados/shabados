[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਏਕ ਨਾਥ ਸਭ ਜਗਤ ਮੈ ਬ︀ਯਾਪਿ ਰਹਿਯੋ ਸਭ ਦੇਸ ॥"
page = 903

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Only One is there in the Universe, who is omnipresent."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਇਕ ਪਰਮਾਤਮਾ ਹੀ ਸਾਰੇ ਜਗਤ ਦੇ ਸਾਰਿਆਂ ਦੇਸਾਂ ਵਿਚ ਵਿਆਪ ਰਿਹਾ ਹੈ।"