[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਕੰਜ ਪ੍ਰਭਾ ਰਾਨੀ ਰਹੈ; ਜਾ ਕੋ ਰੂਪ ਅਪਾਰ ॥੧॥"
page = 917

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Kanj Prabha was his wife; she was extremely pretty.(1)"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਸ ਪਾਸ) ਕੰਜ ਪ੍ਰਭਾ ਨਾਂ ਦੀ ਰਾਣੀ ਸੀ ਜਿਸ ਦਾ ਅਪਾਰ ਰੂਪ ਸੀ ॥੧॥"