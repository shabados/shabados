[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਹਰਿ ਹੋ; ਹੋ ਕਿਰਪੀਸ ॥੧॥ ਰਹਾਉ ॥"
page = 1296
line = 17

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O my God, be Thou merciful unto me. Pause."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਵਾਹਿਗੁਰੂ, ਤੂੰ ਮੇਰੇ ਉਤੇ ਮਾਇਆਵਾਨ ਹੋ। ਠਹਿਰਾਓ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Lord, please, please, be Merciful to me. ||1||Pause||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਰੀ! ਹਮਾਰੇ ਪਰ ਕ੍ਰਿਪਾ ਕਰਨੇ ਵਾਲੇ ਹੋਵੋ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਹਰੀ ਪ੍ਰਭੂ ਦਇਆ ਦਾ ਘਰ ਹੈ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹੋ = ਹੇ ਭਾਈ! ਕਿਰਪੀਸ = ਕਿਰਪਾ ਦਾ ਈਸ, ਕਿਰਪਾ ਦਾ ਮਾਲਕ ॥੧॥ ਰਹਾਉ ॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, Señor, por favor, por favor muéstrame Tu Misericordia. (1-Pausa)"