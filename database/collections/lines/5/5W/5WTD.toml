[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਰਬ ਸੁਖਾ ਸੁਖੁ ਸਾਚਾ ਏਹੁ ॥"
page = 178
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Of all the comforts, this is the true comfort."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਆਰਾਮਾਂ ਵਿਚੋਂ ਇਹ ਯਥਾਰਥ ਆਰਾਮ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Of all comforts, this is the true comfort."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਗੁਰੋਂ ਕਾ ਉਪਦੇਸ ਮਨ ਮੇਂ ਧਾਰ ਲੇ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਹੇ ਭਾਈ!) ਸਤਿਗੁਰੂ ਦਾ ਉਪਦੇਸ਼ ਆਪਣੇ ਮਨ ਵਿਚ ਟਿਕਾ ਕੇ ਰੱਖ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਰਬ = ਸਾਰੇ। ਸਾਚਾ = ਸਦਾ ਕਾਇਮ ਰਹਿਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "De todos los placeres, éste es el que se queda con nosotros:"