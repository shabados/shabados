data = "ਪਰ, ਪ੍ਰਭੂ ਜੀ ਆਪ ਜਿਸ ਮਨੁੱਖ ਦੇ ਰਖਵਾਲੇ ਬਣ ਗਏ,"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Aquél que se ampara en el Señor, el Dios,"