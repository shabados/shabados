page = 1143
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "One who considers Lord as Protector,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਦਾ ਰਖਵਾਲਾ ਸਾਈਂ ਖੁਦ ਹੋ ਜਾਂਦਾ ਹੈ,"

[[content]]
