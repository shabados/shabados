[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਗੁਰ ਪੂਰੇ ਵਿਣੁ, ਜੂਨਿ ਭਵੰਦਾ ॥੪॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Without the (shelter of) perfect Guru, he wanders through the species."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੂ ਦੇ ਬਾਝ ਜੋਨੀਆਂ ਵਿਖੇ ਭਟਕਦਾ ਹੈ।"