[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸਤਿਗੁਰਿ; ਮੋ ਕਉ ਕੀਨੋ ਦਾਨੁ ॥"
page = 1157
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The True Guru, has blessed me with the boon."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸੱਚੇ ਗੁਰਾਂ ਨੇ ਮੈਨੂੰ ਦਾਤ ਪਰਦਾਨ ਕੀਤੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The True Guru has blessed me with this gift."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸਤਿਗੁਰੋਂ ਨੇ ਮੇਰੇ ਕੋ ਇਹੁ ਦਾਨ ਕੀਆ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਗੁਰੂ ਨੇ ਮੈਨੂੰ (ਇਹ) ਦਾਤ ਬਖ਼ਸ਼ੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਤਿਗੁਰਿ = ਗੁਰੂ ਨੇ। ਮੋ ਕਉ = ਮੈਨੂੰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Mira, el Guru Verdadero me ha bendecido con Su Regalo."