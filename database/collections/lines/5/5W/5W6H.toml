[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਸਬਦ ਸੁਰਤਿ ਲਿਵ ਲੀਣੁ ਹੋਇ; ਪਿਰਮ ਪਿਆਲਾ ਅਪਿਉ ਪਿਓਈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Then, they getting the consciousness attuned to the Word, quaff the cup of nectar of loving devotion."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਸ਼ਬਦ ਸੁਰਤ ਦੀ (ਇਕ ਰਸ ਲਗਨਿ) ਵਿਚ ਲੀਨ ਹੋਕੇ ਪ੍ਰੇਮ ਦਾ ਅੰਮ੍ਰਿਤ ਰੂਪ ਪਿਆਲਾ ਪੀਂਦੇ ਹਨ।"