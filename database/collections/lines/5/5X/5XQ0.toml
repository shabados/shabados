[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਦੇਖਿ ਕਹਉ; ਭਾਵੈ ਮਨਿ ਸੋਇ ॥"
page = 831
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Seeing all, say I that He, the Lord alone is pleasing to my mind."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਸਾਰਿਆਂ ਨੂੰ ਵੇਖ ਕੇ ਮੈਂ ਆਖਦਾ ਹਾਂ ਕਿ ਕੇਵਲ ਉਹ ਸੁਆਮੀ ਹੀ ਮੇਰੇ ਚਿੱਤ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "I see, and I say, that He alone is pleasing to my mind."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਾਂ ਤੇ ਤਿਸੀ ਕੋ ਹੀ ਦੇਖਤਾ ਹੂੰ ਔ ਤਿਸੀ ਕੇ ਜਸ ਕੋ ਕਹਤਾ ਹੂੰ, ਔ ਸੋਈ ਮੇਰੇ ਮਨ ਵਿਖੇ ਭਾਵਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਨੂੰ (ਹਰ ਥਾਂ) ਵੇਖ ਕੇ ਮੈਂ ਉਸ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਕਰਦਾ ਹਾਂ, ਉਹੀ ਮੈਨੂੰ ਆਪਣੇ ਮਨ ਵਿਚ ਪਿਆਰਾ ਲੱਗਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਦੇਖਿ = ਵੇਖ ਕੇ। ਕਹਉ = ਮੈਂ ਆਖਦਾ ਹਾਂ, ਮੈਂ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਕਰਦਾ ਹਾਂ। ਭਾਵੈ = ਪਿਆਰਾ ਲੱਗਦਾ ਹੈ। ਸੋਇ = ਉਹ ਪ੍ਰਭੂ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Después de ver digo que sólo el Señor complace mi mente,"