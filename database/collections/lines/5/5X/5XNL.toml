[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਿਖਿਆ ਲੇਖੁ. ਨ ਮੇਟੈ ਕੋਈ; ਗੁਰਮੁਖਿ. ਮੁਕਤਿ ਕਰਾਵਣਿਆ ॥੫॥"
page = 109
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The scribed writ no one can erase Through the Guru is one emancipated."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਕਰੀ ਹੋਈ ਲਿਖਤਾਕਾਰ ਕੋਈ ਮੇਸ ਨਹੀਂ ਸਕਦਾ। ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਹੀ ਮਨੁੱਖ ਮੋਖਸ਼ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one can erase pre-recorded destiny; the Gurmukhs are liberated. ||5||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਲੇਖ ਲਿਖੇ ਹੂਏ ਕੋ ਕੋਈ ਮੇਟ ਨਹੀਂ ਸਕਤਾ, ਭਾਵ ਏਹਿ ਕਿ ਮਨਮੁਖੋਂ ਕੇ ਖੋਟੇ ਭਾਗ ਕੌਨ ਮੇਟੇ, ਔਰ ਜੋ ਗੁਰਮੁਖ ਹੈਂ ਤਿਨ ਕੀ ਤੂੰ ਗੁਰੋਂ ਸੇ ਮੁਕਤੀ ਕਰਾਵਤਾ ਹੈਂ॥੫॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਦੁਬਿਧਾ ਵਾਲੇ ਕੀਤੇ ਕਰਮਾਂ ਅਨੁਸਾਰ, ਮੱਥੇ ਉੱਤੇ ਦੁਬਿਧਾ ਦੇ ਸੰਸਕਾਰਾਂ ਦਾ) ਲਿਖਿਆ ਲੇਖ ਕੋਈ ਨਹੀਂ ਮਿਟਾ ਸਕਦਾ। (ਇਸ ਲੇਖ ਤੋਂ) ਉਹੀ ਖ਼ਲਾਸੀ ਪ੍ਰਾਪਤ ਕਰਦਾ ਹੈ, ਜੋ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈਂਦਾ ਹੈ ॥੫॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nadie puede cambiar el hado que le ha puesto el Mismo Dios, pero si Dios quiere, la Liberación se vive a través del Guru.  (5)"