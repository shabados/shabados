[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਿਕਟਿ ਵਸੈ; ਦੇਖੈ ਸਭੁ ਸੋਈ ॥"
page = 831
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord abides near, and He beholds all,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਨੇੜੇ ਵਸਦਾ ਹੈ ਤੇ ਉਹ ਸਾਰਿਆਂ ਨੂੰ ਵੇਖਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He dwells close at hand, and sees all,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਵਾਹਿਗੁਰੂ ਸਭ ਕੇ ਨਿਕਟ ਵਸਤਾ ਹੈ ਔਰ ਸਭ ਕੋ ਸੋ ਪ੍ਰਤਖ੍ਯ ਦੇਖਤਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ (ਹਰੇਕ ਜੀਵ ਦੇ) ਨੇੜੇ ਵੱਸਦਾ ਹੈ, ਉਹ ਆਪ ਹੀ ਹਰੇਕ ਦੀ ਸੰਭਾਲ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਕਟਿ = ਨੇੜੇ। ਸੋਈ = ਉਹੀ (ਪ੍ਰਭੂ)।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor habita muy cerca y lo ve todo;"