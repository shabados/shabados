[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਮੁਖਿ; ਕਰਣੀ ਕਾਰ ਕਮਾਵੈ ॥"
page = 665
line = 10

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "When the holy man does virtuous deeds and actions,"

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਦ ਨੇਕ ਬੰਦਾ ਪਵਿੱਤਰ ਅਮਲ ਕਰਦਾ ਹੈ,"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Gurmukh does good deeds,"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਬ ਗੁਰੋਂ ਦੁਆਰੇ (ਕਰਣੀ) ਭਗਤੀ ਕੀ ਕਾਰ ਇਹ ਜੀਵ ਕਮਾਵੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਭਾਈ! ਜਦੋਂ ਮਨੁੱਖ ਗੁਰੂ ਦੀ ਸਰਨ ਪੈ ਕੇ (ਗੁਰੂ ਵਲੋਂ ਮਿਲੀ) ਕਰਨ-ਜੋਗ ਕਾਰ ਕਰਨੀ ਸ਼ੁਰੂ ਕਰ ਦੇਂਦਾ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਮੁਖਿ = ਗੁਰੂ ਦੇ ਸਨਮੁਖ ਰਹਿ ਕੇ। ਕਰਣੀ = ਕਰਣੀਯ, ਕਰਨ-ਯੋਗ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Cuando el Santo realiza acciones virtuosas,"