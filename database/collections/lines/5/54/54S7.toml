[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਪਥਰੁ ਮੂਲਿ ਨ ਭਿਜਈ; ਸਉ ਵਰ੍ਹਿਆ ਜਲਿ ਅੰਦਰਿ ਵਸੈ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Even after remaining in water for a hundred years the stone would not get wet at all."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਪੱਥਰ ਕਦੇ ਨਹੀਂ ਭਿੱਜਦਾ, ਭਾਵੇਂ ਸੈਂਕੜੇ ਵਰਹੇ ਪਾਣੀ ਦੇ ਅੰਦਰ ਵੱਸਦਾ ਰਹੇ।"