[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਪੂਰਿ ਰਹਿਓ ਸਰਬਤ੍ਰ ਮਹਿ; ਪ੍ਰਭ ਗੁਣੀ ਗਹੀਰ ॥"
page = 818
line = 14

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Our Lord, the ocean of excellences is fully contained amongst all."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਗੁਣਾਂ ਦਾ ਸਮੁੰਦਰ, ਸਾਡਾ ਸੁਆਮੀ ਸਾਰਿਆਂ ਅੰਦਰ ਪਰੀਪੂਰਨ ਹੋ ਰਿਹਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is permeating and pervading everywhere; God is the ocean of virtue."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਪ੍ਰਭੂ ਗੁਣੋਂ ਕਾ (ਗਹੀਰ) ਸਮੁੰਦਰ ਵਾ ਗੁਣ ਗ੍ਰਾਹੀ ਸਭ ਮੇਂ ਪੂਰਨ ਹੋ ਰਹਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਉਹਨਾਂ ਨੂੰ ਨਿਸ਼ਚਾ ਹੁੰਦਾ ਹੈ) ਕਿ ਸਾਰੇ ਗੁਣਾਂ ਦਾ ਮਾਲਕ ਅਥਾਹ ਪ੍ਰਭੂ ਸਾਰੇ ਜੀਵਾਂ ਵਿਚ ਵੱਸਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੂਰਿ ਰਹਿਓ = ਭਰਪੂਰ ਹੈ, ਮੌਜੂਦ ਹੈ। ਸਰਬਤ੍ਰ ਮਹਿ = ਸਭਨਾਂ ਵਿਚ। ਗੁਣੀ = ਗੁਣਾਂ ਦਾ ਮਾਲਕ। ਗਹੀਰ = ਡੂੰਘਾ, ਅਥਾਹ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Nuestro Señor de Virtudes Insoldables prevalece por todas partes y,"