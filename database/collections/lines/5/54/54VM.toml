data = "He saw the beautiful royal mare."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਜਲ ਵਿਚੋਂ ਨਿਕਲੇ ਘੋੜੇ ਨੇ) ਰਾਜ ਦੇ ਠਾਠ-ਬਾਠ ਵਾਲੀ ਘੋੜੀ (ਬਾਜਨੀ) ਨੂੰ ਵੇਖਿਆ"