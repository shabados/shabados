[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਨਕ. ਤਾ ਕਉ; ਦੂਖੁ ਨ ਬਿਆਪੈ ॥੫੦॥"
page = 260
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "him calamity befalls not O Nanak."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਨੂੰ ਮੁਸੀਬਤ ਨਹੀਂ ਵਾਪਰਦੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "O Nanak, are not afflicted by suffering. ||50||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸ੍ਰੀ ਗੁਰੂ ਜੀ ਕਹਤੇ ਹੈਂ: ਤਿਸ ਪੁਰਸ ਕੋ ਕੋਈ ਭੀ ਦੁਖ ਨਹੀਂ ਵਯਾਪ ਸਕਤਾ ਹੈ॥੫੦॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਨਾਨਕ! ਉਸ ਉਤੇ ਕੋਈ ਦੁੱਖ-ਕਲੇਸ਼ ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕਦਾ ॥੫੦॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨ ਬਿਆਪੈ = ਜ਼ੋਰ ਨਹੀਂ ਪਾ ਸਕਦਾ ॥੫੦॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "no es tocado ni por la tristeza ni por el dolor.(50)"