[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਸਰ ਕੇ ਨਾਮ ਅਪਾਰ; ਚਤੁਰ, ਚਿਤ ਮੈ ਜਾਨੀਐ ॥੧੦੭॥"
page = 722

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Whosoever described the earth in the beginning, many names of Baan continue to be evolved, when her sons are brought under description.107."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਹ) ਸਾਰੇ ਅਪਾਰ ਨਾਮ ਬਾਣ ਦੇ ਹਨ। ਹੇ ਚਤੁਰੋ! ਮਨ ਵਿਚ ਜਾਣ ਲਵੋ ॥੧੦੭॥"