[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਖੰਡ ਬ੍ਰਹਮੰਡ ਉਧਾਰਣਹਾਰਾ ॥"
page = 1072
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord is the Saviour of the beings of the continents and universes."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਮਹਾਂ ਦੀਪਾਂ ਅਤੇ ਆਲਮਾਂ ਦੇ ਜੀਵਾਂ ਦਾ ਪਾਰ ਉਤਾਰਾ ਕਰਨ ਵਾਲਾ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He is the Savior of worlds and galaxies."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਸੋ ਖੰਡ ਔ ਬ੍ਰਹਮਮੰਡੋਂ ਕੇ ਉਧਾਰਨੇ ਵਾਲਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪਰਮਾਤਮਾ ਖੰਡਾਂ ਬ੍ਰਹਮੰਡਾਂ ਦੇ ਜੀਵਾਂ ਨੂੰ ਵਿਕਾਰਾਂ ਤੋਂ ਬਚਾਣ-ਜੋਗ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਉਧਾਰਣਹਾਰਾ = ਵਿਕਾਰਾਂ ਤੋਂ ਬਚਾ ਸਕਣ ਵਾਲਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor salva el Universo entero y todas sus partes."