[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਉ ਪੂਜੀਐ. ਨਾਉ ਮੰਨੀਐ; ਅਖੰਡੁ ਸਦਾ ਸਚੁ ਸੋਇ ॥੩॥"
page = 17
line = 7

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They worship God's Name and believe in nothing but the Name. Ever imperishable is that True Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਉਹ ਹਰੀ ਨਾਮ ਦੀ ਉਪਾਸਨਾ ਕਰਦੇ ਹਨ ਅਤੇ ਨਾਮ ਤੇ ਹੀ ਨਿਸਚਾ ਧਾਰਦੇ ਹਨ। ਸਦੀਵ ਹੀ ਅਬਿਨਾਸ਼ੀ ਹੈ ਉਹ ਸੱਚਾ ਸੁਆਮੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "They worship the Naam, and they believe in the Naam. The True One is forever Intact and Unbroken. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੁਨ: (ਅਖੰਡੁ) ਦੇਸ ਕਾਲ ਵਸਤੂ ਭੇਦ ਰਹਿਤ ਜੋ (ਸਦਾ) ਸਚੁ ਤ੍ਰੈਕਾਲਾਬਾਧ ਸ੍ਵਰੂਪ ਵਾਹਿਗੁਰੂ ਹੈ, ਤਿਸ ਕੇ ਨਾਮ ਕਰ ਕੇ ਹੀ ਸੋ ਪੂਜੀਦੇ ਮੰਨੀਦੇ ਹਨ। ਵਾ ਤਿਨੋਂ ਕੇ ਔਰੁ ਦੇਵ ਸਭ ਛੋਡ ਕਰ ਏਕ ਅਖੰਡ ਵਾਹਿਗੁਰੂ ਕੀ ਹੀ ਪੂਜਾ ਮਾਨਤਾ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਇਹ ਪੱਕਾ ਨਿਯਮ ਜਾਣੋ ਕਿ) ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਹੀ ਪੂਜਿਆ ਜਾਂਦਾ ਹੈ, ਨਾਮ ਹੀ ਸਤਕਾਰਿਆ ਜਾਂਦਾ ਹੈ। ਪ੍ਰਭੂ ਹੀ ਸਦਾ ਇਕ-ਰਸ ਸਦਾ-ਥਿਰ ਰਹਿਣ ਵਾਲਾ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਅਖੰਡ = ਇਕ-ਰਸ, ਸਦਾ, ਲਗਾਤਾਰ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Él alaba el Nombre de Dios y tiene Fe sólo en el Nombre. (3)"