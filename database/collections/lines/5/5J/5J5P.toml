[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਹੋ ਸਕਲ ਤੁਪਕ ਕੇ ਨਾਮ; ਸੁਬੁਧਿ ਪਹਿਚਾਨੀਐ ॥੧੦੨੪॥"
page = 781

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Saying firstly the words “Urag-naath-bhaginin”, add the words “Satchar-naath-shatru” and recognize wisely the names of Tupak.1024."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਇਸ ਨੂੰ) ਸਭ ਬੁੱਧੀਮਾਨ ਤੁਪਕ ਦਾ ਨਾਮ ਸਮਝੋ ॥੧੦੨੪॥"