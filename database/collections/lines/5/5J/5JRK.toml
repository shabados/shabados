[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜੂਠੇ ਜੂਠਾ ਮੁਖਿ ਵਸੈ; ਨਿਤ ਨਿਤ ਹੋਇ ਖੁਆਰੁ ॥"
page = 472
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "so does falsehood dwell in the mouth of the false one and he is ever, ever distressed."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਏਸੇ ਤਰ੍ਹਾਂ ਹੀ ਝੂਠੇ ਦੇ ਮੂੰਹ ਵਿੱਚ ਝੂਠ ਵਸਦਾ ਹੈ ਅਤੇ ਉਹ ਸਦਾ, ਸਦਾ ਹੀ ਦੁਖੀ ਹੁੰਦਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "so does falsehood dwell in the mouth of the false; they suffer forever, again and again."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜੇ (ਜੂਠੇ) ਝੂਠੇ ਵਾ ਅਸੁਧ ਜੀਵ ਨਾਮ ਸੇ ਬੇਮੁਖ ਹੈਂ। ਤਿਨ ਕੇ ਮੁਖ ਮੇਂ (ਜੂਠਾ) ਨਿੰਦ੍ਯਾਦਿ ਸਬਦੁ ਬਸਤਾ ਹੈ ਤਿਸ ਕਰ ਨਿਤਹੀ ਖਰਾਬ ਹੋਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਤਿਵੇਂ ਝੂਠੇ ਮਨੁੱਖ ਦੇ ਮੂੰਹ ਵਿਚ ਸਦਾ ਝੂਠ ਹੀ ਰਹਿੰਦਾ ਹੈ ਤੇ ਇਸ ਕਰਕੇ ਉਹ ਸਦਾ ਦੁੱਖੀ ਹੀ ਰਹਿੰਦਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਜੂਠੇ = ਝੂਠੇ ਮਨੁੱਖ ਦੇ। ਜੂਠਾ = ਝੂਠਾ। ਏਹਿ = ਅਜੇਹੇ ਮਨੁੱਖ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "con toda regularidad, pero ve la impureza en los labios de la persona que tiene impureza"