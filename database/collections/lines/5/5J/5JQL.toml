data = "ਜਲੰ ਬਾ ਥਲੇਯੰ ਕੀਯੋ ਰਾਜ ਸਰਬੰ ॥"
page = 165

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "They ruled over all the places in water and on land"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਉਨ੍ਹਾਂ ਨੇ) ਜਲ ਅਤੇ ਥਲ ਸਭ ਪਾਸੇ ਆਪਣਾ ਰਾਜ ਕਾਇਮ ਕਰ ਲਿਆ।"