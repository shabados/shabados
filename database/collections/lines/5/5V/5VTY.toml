[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਗਿਰਿਯੋ ਝੂਮਿ ਭੂਮੰ ਗਏ ਪ੍ਰਾਣ ਛੁਟੰ ॥"
page = 102

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Who swayed, fell down of the goround and breathed his last."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਉਹ ਭੁਆਟਣੀ ਖਾ ਕੇ ਧਰਤੀ ਉਤੇ ਡਿਗ ਪਿਆ ਅਤੇ (ਉਸ ਦੇ) ਪ੍ਰਾਣ ਨਿਕਲ ਗਏ।"