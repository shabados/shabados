[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਲਏ ਦਿਤੇ ਵਿਣੁ; ਰਹੈ ਨ ਕੋਇ ॥"
page = 350
line = 2

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "There is no one, who receives or bribes not."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਐਹੋ ਜੇਹਾ ਕੋਈ ਨਹੀਂ ਜੋ ਵੱਢੀ ਲੈਦਾ ਜਾਂ ਦਿੰਦਾ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "No one lives without give and take."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਲਏ ਬਿਨਾ ਭੇਟਾ ਗੁਰ, ਦਏ ਬਿਨਾਂ ਸਰੇਪਾਉ ਸਿਖ ਦੋਨੋ ਮੇਂ ਸੇ ਕੋਈ ਨਹੀਂ ਰਹਤਾ ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਿਸ਼ਵਤ ਲੈਣ ਦੇਣ ਤੋਂ ਬਿਨਾ ਨਹੀਂ ਰਹਿੰਦਾ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਲਏ ਦਿਤੇ ਵਿਣੁ = ਮਾਇਆ ਲੈਣ ਦੇਣ ਤੋਂ ਬਿਨਾ, ਰਿਸ਼ਵਤ ਤੋਂ ਬਿਨਾ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nadie vive sin dar ni tomar."