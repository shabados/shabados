[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਖਿਮਾਂ ਧੀਰਜ ਲਖ ਲਖ ਮਿਲਿ; ਸੋਭਾ ਸਰਮਾਹੀ ॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "If the combination of forgiveness, patience and myriad modesties put grandeur to shame;"

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਖਿਮਾਂ ਧੀਰਜ ਦਾ ਸੁਖ (ਯਥਾ ਲਾਭ ਸੰਤੁਸਟ ਹੋਣਾ)"