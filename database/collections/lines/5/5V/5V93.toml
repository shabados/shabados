[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਪੇ ਸਬਦੁ; ਆਪੇ ਨੀਸਾਨੁ ॥"
page = 795
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The Lord Himself is the Divine Word and Himself the insignia of approval."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪ੍ਰਭੂ ਆਮ ਰੱਬੀ ਕਲਾਮ ਹੈ ਅਤੇ ਆਪ ਹੀ ਪਰਵਾਨਗੀ ਦਾ ਚਿੰਨ੍ਹ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "He Himself is the Word of the Shabad, and He Himself is the Insignia."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਆਪ ਹੀ ਆਪ ਬ੍ਰਹਮ ਸਦਾ (ਨੀਸਾਨੁ) ਪ੍ਰਗਟ ਸ੍ਵਰੂਪ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਜਿਸ ਮਨੁੱਖ ਨੂੰ ਨਾਮ ਦੀ ਦਾਤ ਮਿਲ ਜਾਂਦੀ ਹੈ ਉਸ ਨੂੰ ਇਹ ਯਕੀਨ ਬਣ ਜਾਂਦਾ ਹੈ ਕਿ ਪ੍ਰਭੂ) ਆਪ ਹੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਹੈ (ਭਾਵ, ਜਿਥੇ ਉਸ ਦੀ ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਹੁੰਦੀ ਹੈ ਉਥੇ ਉਹ ਮੌਜੂਦ ਹੈ), ਆਪ ਹੀ (ਜੀਵ ਵਾਸਤੇ ਜੀਵਨ-ਸਫ਼ਰ ਵਿਚ) ਰਾਹਦਾਰੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਬਦੁ = ਸਿਫ਼ਤਿ-ਸਾਲਾਹ ਦੀ ਬਾਣੀ। ਨੀਸਾਨੁ = ਪਰਵਾਨਾ, ਰਾਹਦਾਰੀ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Señor Mismo es la Palabra del Shabd; Él Mismo es la Insignia."