[[content]]
assets = ["VGRG"]
type = "primary"
data = "ਆਦਿ ਪੁਰਖੁ, ਆਦੇਸੁ ਕਰਾਈ ॥੧੬॥"

[[content]]
assets = ["JVBG"]
type = "translation"
language = "en"
data = "Worthy of salutation is only that primeval Lord."

[[content]]
assets = ["VBGS"]
type = "translation"
language = "pa"
data = "ਆਦਿ ਪੁਰਖ ਨੂੰ ('ਆਦੇਸ਼') ਨਮਸਕਾਰ ਕਰਦਾ ਹੈ।"