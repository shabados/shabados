[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੀਤਲੁ ਹਰਿ ਹਰਿ ਨਾਮੁ; ਸਿਮਰਤ ਤਪਤਿ ਜਾਇ ॥੩॥"
page = 399
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Cool is the Lord God's Name remembering it the burning is slaked."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਠੰਢਾ ਹੈ ਵਾਹਿਗੁਰੂ ਸੁਆਮੀ ਦਾ ਨਾਮ, ਇਸ ਦਾ ਜਾਪ ਕਰਨ ਦੁਆਰਾ ਸੜਾਂਦ ਬੁੱਝ ਜਾਂਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Name of the Lord, Har, Har, is soothing and cool; remembering it in meditation, the inner fire is quenched. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਹਰੀ ਕਾ ਨਾਮੁ ਹਰ ਪ੍ਰਕਾਰ ਸੇ ਸੀਤਲ ਹੈ, ਕਿਉਂਕਿ ਜਪਣੇ ਸੇ ਤਪਤ ਦੂਰ ਹੋ ਜਾਤੀ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ (ਮਨ ਵਿਚ) ਠੰਢ ਪਾਣ ਵਾਲਾ ਹੈ, ਉਸ ਦਾ ਨਾਮ ਸਿਮਰਿਆਂ (ਮਨ ਵਿਚੋਂ ਤ੍ਰਿਸ਼ਨਾ ਦੀ) ਤਪਸ਼ ਬੁੱਝ ਜਾਂਦੀ ਹੈ ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸੀਤਲੁ = ਠੰਢ ਦੇਣ ਵਾਲਾ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Confortable es el Naam, el Nombre del Señor; Jar, Jar, Contemplándolo, el fuego interno de uno es apagado. (3)"