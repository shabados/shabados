[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਮੇਘ ਗਏ ਪਛੁਤਾਇ ਗ੍ਰਿਹੰ ਕਹੁ, ਗੋਪਿਨ ਕੋ ਮਨ ਆਨੰਦ ਬਾਢੇ ॥"
page = 331

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "The clouds on repenting and the gopas on being pleased went away to their homes"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਬਦਲ ਪਛਤਾਉਂਦੇ ਹੋਏ ਘਰਾਂ ਨੂੰ ਪਰਤ ਗਏ ਅਤੇ ਗਵਾਲਿਆਂ ਦੇ ਮਨ ਵਿਚ ਆਨੰਦ ਵਧ ਗਿਆ।"