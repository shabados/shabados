[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਮਾਨੁਖ ਕੈ; ਕਿਛੁ ਨਾਹੀ ਹਾਥਿ ॥"
page = 281
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Nothing is in man's hand."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਆਦਮੀ ਦੇ ਹੱਥ ਵਿੱਚ ਕੁਛ ਭੀ ਨਹੀਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Nothing at all is in the hands of mortal beings."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਇਸ ਮਾਨੁਖ ਕੇ ਹਾਥ ਕੁਛ ਨਹੀਂ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਮਨੁੱਖ ਦੇ ਵੱਸ ਕੁਝ ਨਹੀਂ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਹਾਥਿ = ਹੱਥ ਵਿਚ, ਵੱਸ ਵਿਚ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "nada depende del poder del hombre."