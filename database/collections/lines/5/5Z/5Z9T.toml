assets = ["DGDG"]
type = "primary"
data = "ਬਹੁ ਜਗ ਧਰਮ ਸਮਾਜ ॥"
page = 634

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In this way, the king ruled like a great sovereign in the world doing religious and social services and performing Yajnas"

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "ਅਤੇ ਧਰਮ ਦੇ ਸਮਾਜ ਸਹਿਤ ਬਹੁਤ ਸਾਰੇ ਯੱਗ ਕੀਤੇ।"