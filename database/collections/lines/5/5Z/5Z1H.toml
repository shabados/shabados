[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਰਾਗੁ ਆਸਾ ਮਹਲਾ ੪ ਸੋ ਪੁਰਖੁ ॥"
page = 10
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Asa Measure, Fourth Guru. That Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਆਸਾ, ਚਉਥੀ ਪਾਤਸ਼ਾਹੀ। ਉਹ ਸੁਆਮੀ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Raag Aasaa, Fourth Mehl, So Purakh ~ That Primal Being:"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਆਸਾ ਵਿੱਚ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਦੀ ਬਾਣੀ 'ਸੋ-ਪੁਰਖੁ'।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Rag Asa, Mejl Guru Ram Das, Cuarto Canal Divino, So-Purkj."