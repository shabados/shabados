[[content]]
assets = ["DGDG"]
type = "primary"
data = "ਜੋਰਿ ਘਨੋ ਧਨੁ ਸ︀ਯਾਮ ਭਨੈ ਸੁ ਦਿਲੀਪਤਿ ਪੈ ਚਲਿ ਅਰਜੁਨ ਆਯੋ ॥੨੩੧੫॥"
page = 531

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "In this way, the most powerful Arjuna came back to Delhi Soverign Yudhishtar.2315."

[[content]]
assets = ["RSJD"]
type = "translation"
language = "pa"
data = "(ਕਵੀ) ਸ਼ਿਆਮ ਕਹਿੰਦੇ ਹਨ, ਬਹੁਤ ਸਾਰੀ ਸੈਨਾ ਇਕੱਠੀ ਕਰ ਕੇ ਅਤੇ ਧਨੁਸ਼ ਲੈ ਕੇ ਅਰਜਨ ਦਿੱਲੀ ਦੇ ਸੁਆਮੀ ਪਾਸ ਆਇਆ ॥੨੩੧੫॥"