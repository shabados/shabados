[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਗੁਰਿ ਪੂਰੈ ਦ੍ਰਿੜਿਓ ਹਰਿ ਨਾਮੁ ॥"
page = 1145
line = 15

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "The perfect Guru has implanted the Lord's Name within me."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਪੂਰਨ ਗੁਰਦੇਵ ਜੀ ਨੇ ਪ੍ਰਭੂ ਦਾ ਨਾਮ ਮੇਰੇ ਅੰਦਰ ਪੱਕਾ ਕੀਤਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Perfect Guru has implanted the Naam within me."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੋਂ ਸੇ ਹਰੀ ਕਾ ਨਾਮ ਦ੍ਰਿੜ ਕੀਯਾ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਪੂਰੇ ਗੁਰੂ ਨੇ (ਮੇਰੇ ਹਿਰਦੇ ਵਿਚ) ਪਰਮਾਤਮਾ ਦਾ ਨਾਮ ਪੱਕਾ ਟਿਕਾ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਗੁਰਿ ਪੂਰੈ = ਪੂਰੇ ਗੁਰੂ ਨੇ। ਦ੍ਰਿੜਿਓ = (ਮੇਰੇ ਹਿਰਦੇ ਵਿਚ) ਪੱਕਾ ਕਰ ਦਿੱਤਾ ਹੈ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Guru Perfecto ha enaltecido el Nombre en el interior de mi ser."