data = "ਪਾਰਬਤੀ, ਸਚੀ (ਇੰਦ੍ਰਾਣੀ) ਸੀਤਾ ਅਤੇ ਸਤੀ ਉਸ ਦਾ ਰੂਪ ਵੇਖ ਕੇ"