data = "ਸਿਵਾ ਸਚੀ ਸੀਤਾ ਸਤੀ; ਤਾ ਕੋ ਰੂਪ ਨਿਹਾਰਿ ॥"
page = 971

[[content]]
assets = ["DSKO"]
type = "translation"
language = "en"
data = "Shiva’s consort, Saachi, Sita and other devout woman,"

