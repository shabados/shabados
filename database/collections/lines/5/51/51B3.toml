[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਸੁ ਠਾਕੁਰ ਕਉ; ਸਦਾ ਨਮਸਕਾਰੁ ॥੧॥"
page = 863
line = 9

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "ever make thou obeisance unto that Lord."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਤੂੰ ਹਮੇਸ਼ਾਂ ਹੀ ਉਸ ਸੁਆਮੀ ਨੂੰ ਪਰਨਾਮ ਕਰ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "So humbly bow forever to that Lord and Master. ||1||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਸੁਆਮੀ ਕੋ ਤੂੰ ਸਦਾ ਨਿਮਸਕਾਰ ਕਰ॥੧॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਉਸ ਮਾਲਕ-ਪ੍ਰਭੂ ਨੂੰ ਸਦਾ ਸਿਰ ਨਿਵਾਇਆ ਕਰ ॥੧॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "ante ese Señor, mi Dios, me postro en Eterna Reverencia.(1)"