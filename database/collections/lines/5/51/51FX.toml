[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਆਦਿ ਨਿਰੰਜਨ; ਖਸਮ ਹਮਾਰੇ ॥"
page = 1023
line = 12

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "O Primordial and immaculate Lord, Thou are my Beloved Spouse."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਹੇ ਪਰਾ ਪੂਰਬਲੇ ਪਵਿੱਤ੍ਰ ਪ੍ਰਭੂ! ਤੂੰ ਮੇਰਾ ਪਿਆਰਾ ਪਤੀ ਹੈਂ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "You are my primal, immaculate Lord and Master."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਹੇ ਹਮਾਰੇ ਸੁਆਮੀ! ਤੁਮ ਮਾਇਆ ਸੇ ਰਹਿਤ ਹੋ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਹੇ ਸਾਰੀ ਰਚਨਾ ਦੇ ਮੂਲ! ਹੇ ਨਿਰੰਜਨ! ਹੇ ਸਾਡੇ ਖਸਮ!"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਨਿਰੰਜਨ = ਹੇ ਮਾਇਆ ਦੇ ਪ੍ਰਭਾਵ ਤੋਂ ਪਰੇ ਪ੍ਰਭੂ!"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Oh, Señor Primordial nuestro, Esposo Inmaculado;"