[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਕਈ ਕੋਟਿ; ਸਸੀਅਰ ਸੂਰ ਨਖੵਤ੍ਰ ॥"
page = 275
line = 19

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Many millions are the moon, the suns, and the stars."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਅਨੇਕ ਕ੍ਰੋੜ ਹਨ ਚੰਦ੍ਰਮੇ, ਸੂਰਜ ਅਤੇ ਤਾਰੇ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Many millions are the moons, suns and stars."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਕਈ ਕ੍ਰੋੜੋਂ (ਸਸੀਅਰ) ਚੰਦ੍ਰਮਾ ਔ (ਸੂਰ) ਸੂਰਜ, ਪੁਨਾ (ਨਖਤ੍ਰ) ਤਾਰੇ ਕੀਏ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਕਈ ਕਰੋੜਾਂ ਚੰਦ੍ਰਮਾਂ, ਸੂਰਜ ਤੇ ਤਾਰੇ ਹਨ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਸਸੀਅਰ = (Skt. शशिधर) ਚੰਦ੍ਰਮਾ। ਸੂਰ = ਸੂਰਜ। ਨਖ੍ਯ੍ਯਤ੍ਰ = ਤਾਰੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Millones las lunas, los soles y estrellas."