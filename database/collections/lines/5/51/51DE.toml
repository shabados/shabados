[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਤਿਨਿ; ਸਗਲੀ ਲਾਜ ਰਾਖੀ ॥੩॥"
page = 623
line = 1

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "which has wholly preserved my honour."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਨੇ ਮੁਕੰਮਲ ਤੌਰ ਤੇ ਮੇਰੀ ਇੱਜ਼ਤ ਆਬਰੂ ਰੱਖ ਲਈ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "and through it, my honor was totally preserved. ||3||"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਤਿਸ ਉਪਦੇਸ਼ ਨੇ ਹਮਾਰੀ ਸਭ ਲਜਿਆ ਰਖ ਲਈ ਹੈ॥੩॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਸ਼ਬਦ ਨੇ ਉਸ ਦੀ ਸਾਰੀ ਇੱਜ਼ਤ ਰੱਖ ਲਈ (ਉਸ ਨੂੰ ਵਿਕਾਰਾਂ ਦੇ ਢਹੇ ਚੜ੍ਹਨ ਤੋਂ ਬਚਾ ਲਿਆ) ॥੩॥"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਤਿਨਿ = ਉਸ (ਸ਼ਬਦ) ਨੇ। ਲਾਜ = ਇੱਜ਼ਤ ॥੩॥"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo hablo lo que me haces hablar, oh Señor; eres mi Maestro, el Tesoro de Virtud.(3)"