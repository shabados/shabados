[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਨਾਮੁ ਰਤਨੁ ਮੇਰੈ ਭੰਡਾਰ ॥"
page = 1144
line = 4

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "I possess the treasure of the Name jewels."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਕੋਲ ਨਾਮ ਦੇ ਜਵਾਹਿਰਾਤ ਦਾ ਖਜਾਨਾ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The Jewel of the Naam is my treasure."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਮੇਰੇ ਹਿਰਦੇ ਰੂਪ ਭੰਡਾਰ ਵਿਖੇ ਰਤਨ ਰੂਪ ਨਾਮ ਕੈਸਾ ਹੈ?"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "(ਪੂਰੇ ਗੁਰੂ ਦੀ ਕਿਰਪਾ ਨਾਲ) ਕੀਮਤੀ ਨਾਮ ਮੇਰੇ ਹਿਰਦੇ ਵਿਚ ਆ ਵੱਸਿਆ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਮੇਰੈ = ਮੇਰੇ ਵਾਸਤੇ, ਮੇਰੇ ਹਿਰਦੇ ਵਿਚ। ਰਤਨੁ = ਕੀਮਤੀ ਪਦਾਰਥ। ਭੰਡਾਰ = ਖ਼ਜ਼ਾਨੇ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Nombre, el Tesoro de Joyas, vive en mí."