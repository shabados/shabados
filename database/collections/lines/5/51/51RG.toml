[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਧਨਾਸਰੀ ਮਹਲਾ ੫ ਘਰੁ ੯ ਪੜਤਾਲ ॥"
page = 683
line = 8

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "Dhanasri 5th Guru. Partal."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਧਨਾਸਰੀ ਪੰਜਵੀਂ ਪਾਤਿਸ਼ਾਹੀ। ਪੜਤਾਲ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Dhanaasaree, Fifth Mehl, Ninth House, Partaal:"

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਪੜਤਾਲ ਛੰਦ ਕੀ ਚਾਲ ਕਾ ਨਾਮ ਹੈ।"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਰਾਗ ਧਨਾਸਰੀ, ਘਰ ੯ ਵਿੱਚ ਗੁਰੂ ਅਰਜਨਦੇਵ ਜੀ ਦੀ ਬਾਣੀ 'ਪੜਤਾਲ'।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Dhanasri, Mejl Guru Aryan, Quinto Canal Divino, Partaal."