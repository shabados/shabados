[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਜਾ ਕੀ ਧੂਰਿ; ਕਰੇ ਪੁਨੀਤਾ ॥"
page = 1078
line = 3

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "He is the One, dust of whose feet sanctifies one."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਇਹ ਉਹ ਹਨ, ਜਿਨ੍ਹਾਂ ਦੇ ਚਰਨਾਂ ਦੀ ਧੂੜ ਬੰਦੇ ਨੂੰ ਪਵਿੱਤ੍ਰ ਕਰ ਦਿੰਦੀ ਹੈ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "The dust of His feet purifies."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਸ ਕੀ ਚਰਣ ਧੂਰ ਪਵਿਤ੍ਰ ਕਰਤੀ ਹੈ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "ਜਿਸ (ਪ੍ਰਭੂ) ਦੀ ਚਰਨ-ਧੂੜ ਪਵਿੱਤਰ ਕਰ ਦੇਂਦੀ ਹੈ,"

[[content]]
assets = ["PSST"]
type = "note"
language = "pa"
data = "ਪੁਨੀਤਾ = ਪਵਿੱਤਰ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "El Polvo de Sus Pies es lo que nos santifica,"