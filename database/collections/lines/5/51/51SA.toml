[[content]]
assets = ["SSA2"]
type = "primary"
data = "ਸੋਹਨਿ ਸਚਿ ਦੁਆਰਿ; ਨਾਮੁ ਪਿਆਰਿਆ ॥"
page = 86
line = 16

[[content]]
assets = ["SBMS"]
type = "translation"
language = "en"
data = "They who bear love to the Name, look beauteous at the True gate."

[[content]]
assets = ["SBMS"]
type = "translation"
language = "pa"
data = "ਜੋ ਨਾਮ ਨਾਲ ਪ੍ਰੀਤ ਕਰਦੇ ਹਨ, ਉਹ ਸੱਚੇ ਦਰ ਉਤੇ ਸੁੰਦਰ ਦਿਸਦੇ ਹਨ।"

[[content]]
assets = ["DSSK"]
type = "translation"
language = "en"
data = "Those who love the Naam look beauteous at the Gate of Truth."

[[content]]
assets = ["NKFT"]
type = "translation"
language = "pa"
data = "ਜਿਨ ਪੁਰਸੋਂ ਨੇ ਨਾਮ ਕੇ ਸਾਥ ਪਿਆਰ ਕੀਆ ਹੈ, ਸੋ ਸਚੇ ਦੁਆਰ ਮੇਂ ਸੋਭਤੇ ਹੈਂ॥"

[[content]]
assets = ["PSST"]
type = "translation"
language = "pa"
data = "'ਨਾਮ' ਨਾਲ ਪਿਆਰ ਕਰਨ ਵਾਲੇ ਬੰਦੇ ਸੱਚੇ ਹਰੀ ਦੇ ਦਰਗਾਹ ਵਿਚ ਸੋਭਾ ਪਾਉਂਦੇ ਹਨ।"

[[content]]
assets = ["SNST"]
type = "translation"
language = "es"
data = "Sólo se verán bellos en la Puerta Verdadera, los que aman el Nombre del Señor."