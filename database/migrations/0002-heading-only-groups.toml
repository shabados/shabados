description = "Merge 5 heading-only line-groups into the groups they head"
issue = 13

# Each of these line-groups holds a heading and nothing else. The mirror of
# 0001: there a heading sits one group too early, here it sits alone.
#
# Unlike 0001 these are not pure moves. Each empties its source, so each RETIRES a
# line-group ID — recorded in retired-ids.toml, in the same commit, because a
# corpus with an empty line-group is not valid in between.
#
# Three of the five separate a heading from its own mangal, which open a division
# as a pair. See database/docs/numbering.md.

[[move]]
line = "QKH1"
from = "FRC"
to = "YGD"
position = "first"
text = "ਰਾਗੁ ਆਸਾ ਮਹਲਾ ੩ ਪਟੀ ॥"
why = "YGD opens with the mangal this heading belongs with"

[[move]]
line = "MRU2"
from = "FF5"
to = "18L"
position = "first"
text = "ਰਾਗੁ ਗੋਂਡ ਬਾਣੀ ਭਗਤਾ ਕੀ ॥ ਕਬੀਰ ਜੀ ਘਰੁ ੧ ॥"
why = "reported as shabados/shabados#13; 18L opens with the mangal this heading belongs with"

