# Version catalog — the layout Android Studio's project wizard generates.
#
# Two constraints, both learned the hard way:
#
#  1. AGP declares a MINIMUM GRADLE VERSION, independent of which classes it
#     references. AGP 9.2.1 requires Gradle >= 9.4.1, so gradle-wrapper.properties
#     is pinned there. Inspecting the jar for missing Gradle APIs is not a
#     substitute — AGP checks the version and refuses regardless. If you change
#     `agp`, let the sync tell you the minimum rather than inferring it.
#
#  2. `kotlin` MUST equal the Kotlin that AGP embeds, not the latest release. AGP
#     9.2.1's POM depends on kotlin-gradle-plugin 2.2.10, so the Compose compiler
#     plugin is 2.2.10. A mismatch here fails at compile time.
#
# There is no kotlin-android plugin: AGP 9 has Kotlin built in and rejects it.

[versions]
agp = "9.2.1"
kotlin = "2.2.10"
# 2026.03.00 is Compose 1.10.5 (Material 3 1.4.0, unchanged): Navigation 3 1.2.1
# needs Compose 1.10. activity-compose 1.12 makes the activity the owner of
# navigation events, which Navigation 3's back handling reads (2026-11-10).
composeBom = "2026.03.00"
activityCompose = "1.12.4"
# Settings' pages (SettingsSheet.kt). Latest stable on 2026-11-10.
navigation3 = "1.2.1"
junit = "4.13.2"
robolectric = "4.17"
# The Android 16 framework jar Robolectric 4.17 runs against (app/build.gradle.kts).
robolectricAndroidAll = "16-robolectric-13921718-i7"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
robolectric-android-all = { group = "org.robolectric", name = "android-all-instrumented", version.ref = "robolectricAndroidAll" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
